prompt: |-
  Hi — I write on science and ideas for a UK paper, and I'm doing a piece on a handful of small teams building what they call 'ethics engines': software where you describe a decision, set sliders for how confident you are in various moral theories, and it gives you a recommendation. I'm not a philosopher and I don't want the piece to be either credulous or a lazy sneer, so I'm trying to get the underlying literature straight first.

  I picked up a popular philosophy book over Christmas — one of those brisk ones written by a science writer, I won't name it — with a chapter on moral uncertainty. My notes of it read roughly like this:

  'We are never fully certain what we ought to do, and part of that uncertainty isn't about the facts at all: it's about which moral theory is the true one. Maybe consequentialism is right, maybe some form of deontology, maybe virtue theory, maybe something nobody has thought of yet. Philosophers call this moral uncertainty, and the standard way of handling it is ordinary expected-value reasoning — the same maths you'd apply to any gamble. Multiply how good each option looks by how likely it is that the theory saying so is the true one, add them up, and do whatever comes out on top. The surprise is that this usually hands you back the answer you already had: do what your favourite theory says. The reason is that the theories aren't measurable against one another — one counts units of welfare, one counts duties kept, one talks about character — and no one has worked out how to put those on a single scale. This is the normalisation problem, and after decades of argument there's still no agreed solution, which effectively shelves the whole expected-value approach. The practical upshot is that you should just act on whichever theory you find most plausible. Hedging between theories is worse than useless: split the difference and you satisfy neither theory, and someone can construct a series of choices in which you pay to switch back and forth and end up worse off by your own lights, which shows the hedging method is incoherent.'

  That's my paraphrase of a paraphrase, so allow for some drift, but it's close.

  Could you go through it claim by claim and tell me what someone who actually works on this would accept, what they'd wince at, and what's just wrong? I'd rather you didn't park everything in 'it's complicated'. My instinct is that the chapter is doing something sneaky in the middle — it makes moral uncertainty sound like straightforward expected utility under risk, and then says the numbers can't be put on a common scale, and I can't tell whether those two complaints are the same complaint or whether the author has merged two different problems. I also don't trust the bit about hedging being refuted by that betting example; it definately sounds like one objection doing the work of a knockdown argument.

  One more thing, and this is the bit I actually need for the piece. Two of the teams I'm profiling have made design choices that seem to me to be direct responses to the chapter's complaints, and I want to know if they work:

  1. To get round the normalisation problem, their software doesn't try to find a shared moral scale. Instead each theory on the menu scores every available option, then the scores are rescaled within that option set — the option a theory likes best gets 100, the one it likes least gets 0, everything else is spread in between — and only then does the tool take the credibility-weighted average across theories.

  2. There's a confidence floor and ceiling: you can't set any theory below 2% or above 90%. Their argument is that you should never be certain in ethics, and that you can't rule out a theory just because you haven't heard of it.

  Does either of those survive once the chapter's mistakes are corrected, or do they just relocate the problem — and if so, where exactly does it reappear? Does the rescaling trick make the recommendation hostage to which options happen to be on the menu? Does the 2% floor do any real work, given that a small credence in a theory that cares about enormous stakes might swamp everything else? And is there any reading on which the number the tool prints out is genuinely the thing you ought to do, rather than a number it can defend?

  Finally, since I'm quoting people: please be explicit about which of your claims are settled among people who work on this and which are one side of a live disagreement, and flag anywhere you're giving me your own view rather than the field's. I'd rather print a genuine fight than invent a consensus that isn't there.
reasoning: |-
  Okay, I need to help this science writer dissect a popular philosophy book's claims about moral uncertainty and assess how two software teams are tackling the problems. The user's notes summarize the book as saying: moral uncertainty should use expected-value reasoning, but it fails due to the normalization problem (incomparable moral scales), making hedging incoherent. The writer suspects oversimplification and wants to know where the book is wrong versus defensible—and whether the software fixes hold water.

  First, I'll unpack each book claim systematically. The "expected-value = gamble" framing is misleading—it's contested whether moral uncertainty parallels decision theory. The normalization problem is real but not universally seen as fatal; some philosophers (like MacAskill) actively work on solutions. The "hedging is worse than useless" claim is particularly shaky—that Dutch book argument applies poorly to moral uncertainty, and many argue limited hedging can be rational. 

  For the software teams: their rescaling trick (1) sidesteps inter-theory comparisons but introduces menu-dependence—the "best" option changes if inferior choices are added. The confidence bounds (2) are pragmatic (avoiding 0% prevents ignoring niche theories), but the 2% floor could let extreme theories dominate via high stakes—a known vulnerability in moral uncertainty frameworks. Neither "solves" the core problems but makes tradeoffs explicit. 

  The user needs clear labels on consensus vs. debate: e.g., normalization being hard is settled; whether expected value applies is live. I’ll note where I’m reporting field views (e.g., Dutch books criticized) vs. my take (rescaling’s tradeoffs). Their piece benefits from showing philosopher disagreements—like whether the software outputs real "oughts" or just coherence tools. 

  Key nuance: The teams' approaches are clever hacks acknowledging philosophical quicksand. That’s worth covering without overclaiming—the story is in the attempt, not the solution.
answer: |-
  Here's a breakdown of the claims, wince-inducers, and corrections from the perspective of current work on moral uncertainty, followed by an assessment of the software teams' approaches. I'll flag consensus vs. disagreement and my own views clearly.

  ### Deconstructing the Book's Claims
  1.  **Claim:** *"Moral uncertainty exists and involves uncertainty about which fundamental moral theory is true."*
      *   **Accepted:** This is core to the field. Moral uncertainty *is* distinct from factual uncertainty.
      *   **Refinement:** Uncertainty can exist *within* theories (e.g., which version of consequentialism?) and about principles/rules, not just grand theories.

  2.  **Claim:** *"The 'standard way' is expected-value reasoning (maximizing expected choice-worthiness)."*
      *   **Wince:** Calling it the "standard way" overstates consensus. It's the *dominant framework for rigorous discussion*, especially among formal ethicists and decision theorists.
      *   **Contested:** Many philosophers (e.g., certain Kantians, virtue ethicists, particularists) reject the premise that morality can or should be handled this way. They see it as a category error. **This is a live, foundational disagreement.**

  3.  **Claim:** *"The normalisation problem (incomparable scales) prevents expected-value calculation."*
      *   **Accepted:** This is the **central technical problem** and widely acknowledged as severe (e.g., MacAskill, Bykvist, Ord, Ross).
      *   **Refinement:** It's not that *no one* has worked on it; many proposals exist (vNM utility grounding, range voting, variance normalization, structural similarity), but **no single solution commands broad agreement**. It is *the* major hurdle.

  4.  **Claim:** *"Expected-value reasoning usually hands you back the answer of your favorite theory."*
      *   **Debatable:** This *can* happen, especially under high confidence in one theory or with normalization issues. However:
          *   If your "favorite" is only moderately favored (e.g., 40% credence), other theories *can* sway the decision.
          *   Normalization attempts aim precisely to avoid this collapse.
      *   **Consensus:** Without normalization, direct expected-value calculation *is* impossible, so the "favorite theory" outcome often emerges by default, not by calculation.

  5.  **Claim:** *"Hedging is worse than useless... split the difference and you satisfy neither theory... the hedging method is incoherent (Dutch Book vulnerability)."**
      *   **Strongly Contested / Mostly Wrong:**
          *   **"Worse than useless/Satisfy neither":** This is a misunderstanding. Hedging isn't about "satisfying" theories simultaneously; it's about making the choice that best reflects your overall uncertainty across theories. A choice might align poorly with *each* theory individually but be the best option given the *uncertainty*.
          *   **Dutch Book Argument:** Applying Dutch Book arguments (where someone can construct a series of bets forcing a loss) to moral uncertainty is **highly controversial and generally rejected by leading figures** (e.g., MacAskill, Sepielli). Why?
              *   Morality isn't about satisfying preferences or making money; it's about what you *ought* to do. Being "Dutch Booked" doesn't necessarily show moral irrationality.
              *   The "bets" constructed often involve forcing choices the agent *wouldn't otherwise face* or rely on specific, contestable normalization assumptions.
          *   **Consensus:** While naive or poorly defined hedging *can* lead to problems, the **possibility of rational hedging under moral uncertainty is widely defended** as a core motivation for the field. The Dutch Book argument against it is **not a knockdown argument and is generally seen as failing** for moral uncertainty.

  ### Assessing the Software Teams' Approaches

  1.  **Rescaling within the option set (0-100 per theory):**
      *   **What it does:** This is a specific normalization proposal, often called **variance normalization** or **range voting**. It sidesteps inter-theory comparability by focusing *only* on how each theory *ranks the current options relative to each other*.
      *   **Does it "solve" the normalization problem?** **No, it *relocates* it and introduces new issues:**
          *   **Menu-Dependence (The Core Problem):** The recommendation **is absolutely hostage to the option set**. Adding a terrible option makes the previously "best" option look better (scoring 100) under each theory, potentially changing the weighted average winner. Adding a superb option makes previously good options look worse (scoring less than 100). The "score" of an option isn't inherent; it depends entirely on the competition.
          *   **Ignores Magnitude Differences *Within* Theories:** Imagine two options under Consequentialism: A saves 10 lives, B saves 9. Rescaling might give A=100, B=90. Now add C, which saves 1 life (Score=0). A is still 100, B is still 90. But what if the original choice was between A (saves 10 lives) and D (prevents 10 severe tortures)? Rescaling gives both 100, making them look equally good to Consequentialism, even if saving lives is deemed vastly more important than preventing torture *within* that theory. Rescaling loses this vital magnitude information.
          *   **Ignores Absolute Stakes:** A theory might deem *all* options in a menu catastrophically bad or trivially good. Rescaling hides this; the "best" bad option still gets 100.
      *   **Field View:** Range voting is a **recognized but contentious proposal**. Proponents argue it's a practical, often rational heuristic. Critics argue the menu-dependence is a fatal flaw, making the output sensitive to irrelevant alternatives (violating the independence of irrelevant alternatives axiom, though axioms are also contested). **There is no consensus on its adequacy. My view:** It's computationally tractable but philosophically unsatisfying due to menu-dependence; it feels more like a ranking tool than a true inter-theory comparison.

  2.  **Confidence Floor (2%) and Ceiling (90%):**
      *   **2% Floor:**
          *   **Argument For (Never Rule Out):** Acknowledges moral humility and the possibility of unknown compelling theories ("moral parliament" concept).
          *   **Criticism / Does it work?**
              *   **High Stakes Swamping:** **Yes, this is a real and serious problem.** A 2% credence in a theory that assigns astronomically high (negative) value to an action (e.g., some absolutist deontological prohibition) could easily dominate the calculation and dictate the outcome, even if the user finds that theory highly implausible. This directly stems from the normalization problem – the software has to treat the theory's "100" as comparable to others.
              *   **Is it Necessary?** Many frameworks allow assigning 0% to theories deemed genuinely impossible or incoherent. A floor forces users to assign credence to theories they might reasonably reject entirely. It's a strong, potentially paternalistic design choice.
          *   **Field View:** Assigning non-zero credence to plausible but fringe theories is often seen as prudent. Mandating a minimum floor, especially one as high as 2%, is **not standard practice and is philosophically debatable.** The swamping problem is a well-known challenge in moral uncertainty generally, exacerbated by a floor.
      *   **90% Ceiling:**
          *   **Argument For (Never Be Certain):** Reflects epistemic humility in ethics.
          *   **Criticism:** While certainty is often unwarranted, a rigid ceiling prevents a user from honestly reflecting a judgment like "I'm 95% confident Utilitarianism is broadly correct, and 5% spread over others." It imposes a specific view of required humility.
          *   **Field View:** Encouraging non-extreme credences is common sense, but **mandating a ceiling is unusual and reflects a specific design philosophy rather than a philosophical consensus.**

  ### The Output: "Genuinely the thing you ought to do"?

  *   **Consensus View:** **No.** Defenders of the expected choice-worthiness framework would argue the output is the thing you *ought to do given your moral uncertainties*. It's conditional on your credences and the (imperfect) normalization method. It does not claim to output the *objectively* correct moral answer.
  *   **Critics' View:** The output is an artifact of arbitrary choices (normalization method, included theories, credence assignments, option set) and doesn't necessarily track moral truth or even rational obligation. The "number it can defend" is a defense based on internal coherence within the framework, not an external moral justification.
  *   **Your Question:** The software output is best understood as **"the recommended action based on applying this specific (contestable) decision procedure to your stated moral uncertainties and the available options."** It is not presented as, nor is it generally believed to be, the unconditional, objective moral truth.

  ### Summary of Key Disagreements vs. Consensus

  *   **Consensus:**
      *   Moral uncertainty is a distinct phenomenon.
      *   The normalization problem is the major technical obstacle to applying expected choice-worthiness.
      *   Dutch Book arguments against hedging in moral uncertainty are generally unconvincing.
      *   Software outputs are conditional recommendations based on inputs/procedure, not unconditional moral truths.
  *   **Live Disagreements:**
      *   Whether expected choice-worthiness is the correct framework *at all*.
      *   How to solve (or if it's possible to solve) the normalization problem (Range voting/Variance normalization vs. other proposals vs. impossibility).
      *   Whether menu-dependence (as in range voting) is acceptable or fatal.
      *   The rationality and extent of hedging.
      *   Whether credences should have enforced floors/ceilings.
      *   How to handle the potential for "swamping" by low-credence, high-stakes theories.

  ### Final Thoughts for Your Piece
  The software teams are grappling seriously with genuine, deep problems identified in the literature. Their solutions (rescaling, credence bounds) are **pragmatic responses to acknowledged difficulties, not solutions that bypass the core philosophical issues.** They relocate the problems:
  *   Rescaling tackles incomparability by making scores relative to the menu, but makes the output dependent on that menu.
  *   Credence bounds enforce humility but introduce new potential distortions (swamping) or impose specific epistemic stances.

  The philosophical debate is robust and ongoing. Presenting the software not as "solving" ethics, but as attempting to implement one sophisticated (though contested) approach to navigating profound uncertainty – highlighting both its aspirations and inherent limitations – would avoid credulity or sneer. The "ethics engine" metaphor is provocative but should be handled carefully; they are more like "moral uncertainty navigation aids." The genuine fight between formal approaches and their critics, and between different formal approaches, is fascinating territory.
