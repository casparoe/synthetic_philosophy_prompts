prompt: |-
  I am finishing the second chapter of a dissertation on distributive justice, and the chapter keeps helping itself to interpersonal comparisons of well-being that I have not earned. Before I commit to a comparison metric, I want the specification written out: what a theory of interpersonal comparisons would have to deliver in order to count as adequate for the use I am going to make of it.

  The purpose, so that adequacy is relative to something: the metric has to function as the informational input to a distributive principle that a real allocator applies. Concretely, a fixed health budget divided among identified patients in a single year, where the allocator has clinical records, a limited amount of observed choice behaviour, and some self-report; does not have anyone's full preference ordering; will be second-guessed by patients who compare notes; and has to defend the allocation in public. And the metric has to be strong enough to adjudicate between sum-ranking and priority-to-the-worst-off rather than being reverse-engineered from one of them.

  What I want from you is a numbered list of requirements, each with the case or consideration that makes it a requirement, each tagged as non-negotiable, negotiable, or a prejudice of one camp. Organise the list around the grades of comparability — comparisons of order only, of units, of levels including the placement of each person's zero, and of ratios — because what I most need to know is which grade each requirement forces and what it costs to get there. Anchor the requirements to cases, not to slogans. The cases I want handled, at a minimum:

  1. Two patients in the same clinical condition, one of whom has recalibrated her expectations downward after years of chronic pain and now reports herself content, the other not.
  2. The chain: a committee is confident comparing a mild migraine with a fractured wrist, a fractured wrist with moderate depression, moderate depression with blindness; composing the chain yields a migraine-to-blindness comparison that nobody will endorse.
  3. An allocation that moves resources from one patient's final year to another patient's first year — the comparison of one person at two times must not be settled by a different procedure from the comparison of two people at one time.
  4. The numeraire test: state everyone's position on patient A's scale, then on patient B's; do the orderings agree, and do the ratios?
  5. The zero: where does each person's neutral point sit, and does locating it at a level below which life is not worth continuing smuggle a normative judgment in under a measurement label?
  6. Strategic presentation: patients know they are being read and have reason to present as worse off than they are.
  7. A decision that changes who exists, where one of the parties to the comparison exists only under one of the options.
  8. Whether a benefit to a better-off patient becomes more urgent merely because worse-off patients exist.
  9. A very large number of barely perceptible harms set against one severe harm: does the metric have the resolution to say anything here, and if it says nothing, is that a defect?
  10. Public defensibility: the allocator has to be able to give each patient a reason, not just a number.

  Here are the candidate requirements I have accumulated from reading and from arguments with my committee. Tell me which survive as genuine desiderata, which are negotiable, and which are artifacts of a camp:

  - recoverability from observed choice alone, with self-report and clinical judgment treated as illegitimate;
  - deference to each person's own testimony about how well off they are;
  - completeness over every pair an allocator might face, versus the capacity to declare some pairs incomparable;
  - separability of the interpersonal ordering from unaffected parties' positions, versus sensitivity to rank or to the shape of the distribution;
  - invariance of all interpersonal comparisons under independent positive-affine rescaling of each person's scale;
  - non-manipulability by strategic presentation;
  - closure under chaining, so that comparability does not go sorites-fragile across adjacent pairs;
  - a single unified treatment of intrapersonal and interpersonal comparison;
  - extension to merely possible people;
  - reason-expressibility, i.e. that every comparison the metric issues can be stated as a reason to the person who loses out.

  Two suspicions I want tested rather than indulged. First, that full invariance under independent rescaling of each person's scale cannot coexist with level comparability, so that any priority-to-the-worst-off view is purchasing its comparisons with something that preference data alone does not supply; if that is right, say what is being imported and whether the import is acceptable. Second, that completeness, refusal to make anyone worse off merely because others are worse off, and transitivity cannot be had together; check this rather than take it from me, and if it fails only given some further assumption, isolate the assumption. More generally: if some subset of the requirements you end up endorsing is jointly unsatisfiable, say so plainly, because the unsatisfiability is itself the result I care about most.

  Then tell me which single requirement does the most work in excluding candidates, and which requirement you would drop from my list above and why.

  Only after the criteria: a compact scorecard, a table is fine, rating against your final list the following, briefly and without discussing their provenance — strict ordinalism with no interpersonal comparisons at all; the impartial-observer approach on which one ranks outcomes by imagining oneself in each person's position under an equal chance of being them; partial comparability of the kind that stops short of full level comparisons; a resource or primary-goods proxy used in place of well-being; a fixed health-state tariff of the kind used in cost-effectiveness analysis; and the flat-footed realist claim that there is one true cardinal scale and the problem is merely epistemic. Keep the scorecard short; the criteria are where I want the effort. No literature review and no citations — I have those, and I need the specification, not the bibliography.
reasoning: |-
  Okay, the user is working on a dissertation chapter about distributive justice and needs to specify requirements for interpersonal well-being comparisons. Let me start by understanding their main concerns. They mentioned that their chapter relies on these comparisons without having justified the metric yet. The key purpose is to inform a real allocator dividing a health budget among patients. The allocator has clinical records, some choice behavior, and self-reports, but not full preference orderings. They also need to defend decisions publicly and handle cases where patients compare notes.

  The user provided ten specific cases that the metric must handle, like the adapted preferences scenario (patient recalibrating expectations) and the chain problem (comparing mild to severe conditions via intermediates). They also listed candidate requirements from their reading, like recoverability from choice data alone or deference to testimony. They want these requirements organized by comparability grades (ordinal, unit, level, ratio) and tagged as non-negotiable, negotiable, or camp-specific.

  First, I need to map each requirement to the cases. For example, Case 1 (adapted preferences) requires level comparability to distinguish true well-being from reported contentment. That pushes beyond ordinal. Case 2 (chain problem) needs closure under chaining but might require unit comparability to avoid inconsistency. Case 3 (intertemporal vs. interpersonal) demands a unified treatment, so the same metric applies to both. That's non-negotiable.

  The user suspects that full affine invariance conflicts with level comparability. If each person's scale is rescaled independently, the zero point (level) might shift, making comparisons invalid. So yes, that's a conflict. Level comparability needs a fixed zero, which affine invariance doesn't allow. That means priority views need an anchor like a neutral point, which is a normative import.

  Another key point is the potential impossibility of completeness, separability, and transitivity together. If separability means no sensitivity to others' positions, but completeness requires all comparisons, with transitivity, you might run into issues like the chain problem leading to intransitive judgments. But maybe with unit comparability, it's manageable. However, if separability is strict (Pareto separability), that might conflict when the existence of worse-off people affects urgency (Case 8). So that combination might be problematic.

  Public defensibility (Case 10) is crucial. The allocator must explain decisions in understandable terms, not just numbers. So reason-expressibility is non-negotiable. Strategic presentation (Case 6) requires non-manipulability, which might mean not relying solely on self-report.

  Looking at the candidate requirements, recoverability from choice alone is negotiable because the allocator has multiple data sources. Deference to testimony is also negotiable due to adaptation and manipulation risks. Completeness might be negotiable if some pairs are incomparable, but the chain problem suggests chaining is necessary, so closure under chaining is key.

  The scorecard should rate approaches against the final requirements. Strict ordinalism fails level comparability and public defensibility. Impartial observer might handle level comparisons but lacks public reasons. Partial comparability avoids some issues but might not resolve conflicts like Case 2. Resource proxies don't handle adapted preferences. Health tariffs might face the chain problem. Realism assumes a cardinal scale but struggles with epistemic access.

  The user's unspoken need might be to identify which requirements are essential for their allocator context versus theoretical ideals. They need to know where compromises are necessary and what trade-offs exist, especially between technical feasibility and normative acceptability. Highlighting joint unsatisfiability (e.g., affine invariance vs. level comparisons) is critical for their argument. They also need clarity on what makes a requirement non-negotiable in a real-world, defensible allocation system.
answer: |-
  Below is a structured specification of requirements for an interpersonal comparison metric, anchored to your cases and allocator context. Requirements are organized by *grade of comparability* (Ordinal, Unit, Level, Ratio), tagged as **Non-Negotiable** (essential for your allocator), **Negotiable** (context-dependent trade-offs), or **Camp Prejudice** (reflects sectarian assumptions). Conflicts and forcing relations are highlighted.

  ### **Core Requirements**  
  *(Based on your cases & allocator constraints)*  

  1.  **Level Comparability (Zero-Point Identification)**  
      - **Requirement**: The metric must identify a *normatively neutral zero point* (e.g., "neutral" well-being) for each person, enabling claims like "A is below zero, B is above."  
      - **Case Anchor**: Case 1 (adapted preferences), Case 5 (zero-point normativity), Case 3 (intertemporal/interpersonal unity).  
      - **Why Non-Negotiable**: Without a shared anchor, the allocator cannot credibly assert that a "content" chronic-pain patient is worse off than an unhappy one (Case 1), nor defend transfers across time/persons (Case 3).  
      - **Cost**: Forces Level+ comparability. Requires normative input (e.g., defining "neutral" well-being), rejecting pure choice/data-driven metrics.  

  2.  **Unit Comparability with Chaining Robustness**  
      - **Requirement**: The metric must support fine-grained difference comparisons (e.g., "relieving A’s migraine yields a well-being gain comparable to relieving B’s wrist fracture") and preserve ordering under composition of adjacent comparisons.  
      - **Case Anchor**: Case 2 (migraine-to-blindness chain), Case 9 (barely perceptible vs. severe harms).  
      - **Why Non-Negotiable**: The allocator must handle clinical "chains" (Case 2) and aggregate small benefits (Case 9). Fragile comparability invites paralysis or inconsistency.  
      - **Cost**: Forces Unit+ comparability. May require cardinal health-state tariffs or structured preference aggregation.  

  3.  **Unified Inter/Intrapersonal Treatment**  
      - **Requirement**: The procedure for comparing two states of one person (e.g., healthy vs. ill) must be identical to comparing two people in those states.  
      - **Case Anchor**: Case 3 (resource transfer across lifetimes).  
      - **Why Non-Negotiable**: Allocator must justify shifting resources from Person A’s end-of-life care to Person B’s early-life intervention without double standards.  
      - **Cost**: Rules out "separate spheres" approaches (e.g., some resourcist views).  

  4.  **Public Reason-Giving Capacity**  
      - **Requirement**: Every comparison must be expressible as a justifiable reason *to affected patients*, not just a technical output.  
      - **Case Anchor**: Case 10 (public defensibility), Case 6 (strategic presentation).  
      - **Why Non-Negotiable**: Patients "comparing notes" (Case 10) and incentives to misreport (Case 6) demand transparent, articulable grounds.  
      - **Cost**: Excludes black-box metrics (e.g., complex utility functions). Favors clinically interpretable scales.  

  5.  **Non-Manipulability**  
      - **Requirement**: The metric must be robust to strategic underreporting of well-being.  
      - **Case Anchor**: Case 6 (strategic presentation).  
      - **Why Negotiable**: Absolute non-manipulability is likely impossible; allocator can cross-verify via clinical data. Prioritize *mitigation* (e.g., triangulation) over perfection.  
      - **Cost**: Undermines pure deference to self-report. Requires behavioral/clinician input.  

  6.  **Incompleteness Tolerance**  
      - **Requirement**: The metric need not deliver complete orderings over all pairs; it may declare some comparisons indeterminate.  
      - **Case Anchor**: Case 2 (chain breakdown), Case 7 (non-identity problem).  
      - **Why Negotiable**: Forcing completeness (e.g., in Case 2) risks arbitrariness. Allocator can use defaults (e.g., equal weighting) for incomparable cases.  
      - **Cost**: Accepts allocative "gray areas" – problematic for rigid distributive rules.  

  ---

  ### **Assessment of Your Candidate Requirements**  
  - **Recoverability from choice alone**: *Camp Prejudice* (behaviorists). Rejected: allocator has clinical/self-report data; choice data is sparse.  
  - **Deference to personal testimony**: *Negotiable*. Useful but insufficient (Case 1, 6). Must be tempered with clinical judgment.  
  - **Completeness**: *Negotiable*. Desirable but less critical than chaining robustness (Case 2).  
  - **Separability (Pareto) vs. Sensitivity**: *Non-Negotiable*: **Separability required**. Case 8 (urgency from others’ suffering) is normative, not measurement. Metric should isolate individual states.  
  - **Invariance under independent affine rescaling**: *Camp Prejudice* (ordinalists). **Incompatible with Level Comparability** (Req. 1). Level comparisons fix zero points; affine invariance allows zero-point shifts.  
  - **Closure under chaining**: *Non-Negotiable* (as robustness: Req. 2).  
  - **Unified treatment**: *Non-Negotiable* (Req. 3).  
  - **Extension to possible people**: *Negotiable*. Case 7 (non-identity) is edge case; allocator can treat existent/non-existent asymmetrically.  
  - **Reason-expressibility**: *Non-Negotiable* (Req. 4).  

  ---

  ### **Suspicion Testing**  
  1.  **Affine Invariance vs. Level Comparability**:  
      - **Conflict Confirmed**: Affine invariance permits rescaling each person’s scale independently (e.g., shifting zero points). Level comparability requires fixed, interpersonally comparable zeros (Req. 1).  
      - **What’s Imported**: A *normative anchor* (e.g., "neutral life" or "barely worth living"). Acceptability depends on whether this anchor is defensible publicly (Req. 4).  

  2.  **Completeness + Separability + Transitivity**:  
      - **Jointly Satisfiable** under unit/level comparability. *However*, adding **Case 8 (urgency from others’ existence)** creates tension:  
        - If the metric is separable (individual-focused), it cannot deem a benefit "more urgent due to worse-off others."  
        - If distributive sensitivity is needed (e.g., for priority views), it must enter *after measurement*, via the aggregative principle.  
      - **Verdict**: Metric can satisfy all three, but Case 8 is a *normative* issue beyond measurement.  

  ---

  ### **Key Tensions & Exclusions**  
  - **Most Exclusionary Requirement**: **Level Comparability (Req. 1)**. It excludes:  
    - Ordinal metrics (no zero point).  
    - Affine-invariant cardinals (zero-point fluidity).  
    - Choice-only approaches (requires normative anchor).  
  - **Requirement to Drop**: **Extension to possible people (Case 7)**. Low practical urgency for your allocator (fixed population/year). Handle via default assumptions.  

  ---

  ### **Approach Scorecard**  
  *(Ratings: ✘ = Fails, △ = Partial, ✓ = Satisfies)*  

  | Requirement                 | 1. Level | 2. Units+Chaining | 3. Unified | 4. Public Reason |  
  |-----------------------------|----------|-------------------|------------|------------------|  
  | **Strict Ordinalism**       | ✘        | ✘                 | △          | ✓                |  
  | **Impartial Observer**      | △        | ✓                 | ✓          | ✘ (vague)        |  
  | **Partial Comparability**   | ✘        | △ (fragile)       | △          | △                |  
  | **Resource Proxy**          | ✘        | △                 | ✘          | ✓                |  
  | **Health-State Tariff**     | ✓        | ✓                 | ✓          | ✓                |  
  | **Cardinal Realism**        | ✓        | ✓                 | ✓          | ✘ (opaque)       |  

  ### **Recommendation**  
  A **publicly justifiable health-state tariff** (e.g., calibrated disability weights with a defined "neutral" point) best satisfies non-negotiable requirements. It delivers level/unit comparability (handling Cases 1,2,3,5), supports reason-giving (Case 10), and resists manipulation via clinical cross-validation (Case 6). It fails affine invariance and pure choice recovery—but these are dispensable camp prejudices. The critical trade-off is importing a normative zero point (e.g., "health state X is equivalent to being dead"), but this is unavoidable for priority views and defensible in public deliberation.
