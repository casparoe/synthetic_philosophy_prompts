answer: |-
  ## Research Proposal: Mapping the Ethical Ledgers of Food Choices

  **Research Question:** Under counterfactual conditions where food demand remains constant, does replacing beef calories with chicken or plant-based alternatives reduce overall animal harm when accounting for deaths caused, lives created, and wild lives prevented, using both death counts and suffering-day metrics?

  **The Problem with Common Sense:** Common approaches yield conflicting answers because they rely on incomplete or incompatible ethical "ledgers":
  1.  **Deaths per Calorie:** Favors beef (fewer large animals killed) over chicken (many small birds) and potentially over crops (field deaths). Ignores suffering duration and existence.
  2.  **Suffering per Animal:** Favors chicken (shorter lives) over beef (longer confinement) but struggles with crop field deaths and ignores existence/wildlife impacts.
  3.  **The Existence Argument (Lives Created):** Claims raising animals for food is neutral or beneficial *for those animals* (they wouldn't exist otherwise). This seems to settle it for beef, but ignores the "lives prevented" ledger (wild animals displaced) and assumes a life created for food is worth living. It also fails when comparing to plant-based diets which don't create farmed animal lives.

  **These positions leave the question open because they:**
  *   **Focus on isolated ledgers:** They don't integrate deaths caused, lives created, and lives prevented into a single comparative framework.
  *   **Assume a single currency:** They use either deaths *or* suffering days *or* existence value, without acknowledging the conflict between these measures.
  *   **Neglect the counterfactual:** They don't systematically model what happens *instead* when one food source is replaced (e.g., what land use changes occur?).
  *   **Omit wild animal suffering:** The potential vastness of preventing wild lives (if net suffering) could drastically alter the ethical calculation, especially for land-intensive beef or crops.

  **Methodology (6 Weeks @ ~15 hrs/week):** This is a *conceptual modeling project* integrating existing data into ethical frameworks. No new data collection; analysis relies on published sources (to be refined with mentor).

  *   **Week 1: Framework Construction & Base Parameters**
      *   Define core counterfactual: Constant calorie demand replaced.
      *   Formalize the three ledgers: Deaths Caused (direct killing), Lives Created (farmed animals existing), Lives Prevented (wild animals not existing due to land conversion).
      *   Define the two core currencies: Death Counts & Suffering-Days (incorporating lifespan and welfare assumptions).
      *   Establish baseline conversion ratios (calories from beef -> chicken -> plants, land use efficiencies).
      *   *Deliverable:* Detailed flowchart/model structure and initial parameter estimates document.

  *   **Week 2: Farmed Animal Parameters**
      *   Research & synthesize average data for US industrial systems: Lifespans (beef cow, broiler chicken), deaths per calorie produced, average welfare scores (confinement, procedures) translated into estimated suffering-day intensity.
      *   *Deliverable:* Data summary tables for beef and chicken production metrics.

  *   **Week 3: Crop Production & Field Deaths**
      *   Research & synthesize data on land use per calorie for key feed (corn, soy) and human-consumed crops.
      *   Research & synthesize estimates of field deaths per hectare for relevant crops/methods (small mammals, birds, insects).
      *   *Deliverable:* Data summary tables for crop land efficiency and field mortality estimates.

  *   **Week 4: Wild Animal Suffering & Land Use Counterfactuals**
      *   Research ecological data: Vertebrate/invertebrate density estimates for relevant ecosystems (pasture, cropland, "natural").
      *   Develop explicit counterfactual land use scenarios (e.g., beef pasture reverts to forest? To savanna? Used for chicken feed? Used for human crops?).
      *   Synthesize philosophical arguments & limited empirical work on net welfare of wild lives (acknowledging high uncertainty).
      *   *Deliverable:* Scenarios document outlining land reversion possibilities and associated wildlife density/welfare assumptions.

  *   **Week 5: Model Integration & Sensitivity Analysis**
      *   Build a quantitative model (spreadsheet-based) integrating Weeks 1-4.
      *   Run comparisons (Beef vs. Chicken, Beef vs. Plants, Chicken vs. Plants) under both currencies (deaths, suffering-days) and across land counterfactual scenarios.
      *   Conduct sensitivity analysis: Vary key uncertain parameters (especially field death rates, wild animal density, net wild animal welfare value) to see how robust rankings are.
      *   *Deliverable:* Model spreadsheet and initial results summary.

  *   **Week 6: Analysis, Synthesis & Deliverable Drafting**
      *   Interpret results: Under which combinations of currency (deaths vs. suffering), land counterfactual, and WAS assumption does each substitution (beef->chicken, beef->plants, chicken->plants) show net harm reduction?
      *   Identify the most critical assumptions driving the outcome.
      *   Draft final deliverable: A clear, accessible guide for decision-makers.
      *   *Deliverable:* Final Research Report & Decision Tool.

  **Why This Approach (vs. Alternatives):**
  *   **Better than assembling estimates:** Simply listing published numbers (e.g., deaths/calorie) doesn't resolve the ledger/currency conflict. This project *structures* the comparison, making trade-offs explicit.
  *   **Better than surveying diets:** Surveys reveal preferences, not objective harm comparisons. They don't address the underlying ethical/metric confusion.
  *   **Better than arguing for one diet:** Premature advocacy ignores the complexity and the genuine possibility that the "best" choice depends on the weight given to different ethical concerns (currencies/ledgers). This project maps that dependency.
  *   **Genuine Progress:** It moves beyond restating known conflicts by building a structured framework that forces explicit choices about currencies and counterfactuals, revealing *when* and *why* different diets might be preferable under specific ethical priorities. It quantifies the impact of the "existence argument" and the potentially crucial role of wild animal suffering.

  **Possible Conclusions & Deciding Factors:**
  1.  **Robust Ranking:** A particular substitution (e.g., beef -> plants) reduces harm across *most* plausible currency choices and land counterfactuals. *Decided by:* Model results showing low sensitivity to key assumptions.
  2.  **Currency-Dependent Ranking:** The "better" choice flips depending on whether deaths or suffering-days are prioritized (e.g., plants win on deaths, chicken wins on suffering-days). *Decided by:* Clear divergence in model outputs between currency metrics.
  3.  **WAS-Dependent Ranking:** The inclusion and valuation of wild animal suffering flips the ranking (e.g., beef looks better than crops only if preventing wild lives is a significant *harm reduction*). *Decided by:* Model sensitivity to the net welfare value assigned to a wild animal life.
  4.  **The Existence Argument's Limited Power:** While creating a life might be neutral/positive, the model shows it's outweighed by deaths caused, suffering endured, or wild lives prevented in most comparisons. *Decided by:* The magnitude of negative impacts in other ledgers exceeding the positive existence value.

  **Failure Condition & Ensuring Informativeness:**
  *   **Honest Failure Condition:** The outcome could be "It depends" if rankings are *highly sensitive* to within-reason variations in uncertain parameters (especially wild animal density/net welfare) *and* the choice between currencies (deaths vs. suffering-days). This would occur if, for example, small changes in estimated field deaths or WAS valuation completely reversed the beef/plants comparison under both currencies.
  *   **Ensuring Value Beyond "It Depends":** Even in this case, the project succeeds by:
      1.  **Mapping the Dependencies:** Clearly showing *which specific assumptions* drive the outcome (e.g., "The choice between beef and plants hinges critically on whether you value preventing deaths more than reducing suffering-days AND on your estimate of net wild animal welfare").
      2.  **Quantifying Trade-offs:** Providing concrete estimates of *how much* harm (in deaths or suffering-days) trades off against other factors in different scenarios.
      3.  **Identifying Critical Knowledge Gaps:** Highlighting the parameters where better data (e.g., on field deaths, wild animal welfare) would most reduce uncertainty. This directs future research.
      4.  **Clarifying the Role of Existence:** Demonstrating quantitatively how much (or how little) the "lives created" ledger contributes compared to the others.

  **Feasibility Adjustments:**
  *   **Cut:** Deep dives into complex ecological modeling of land reversion or highly granular welfare scoring. Stick to established ranges for parameters like field deaths and WAS from literature reviews.
  *   **Simplify:** Focus on 2-3 primary land counterfactual scenarios (e.g., pasture reverts to avg. forest; converted directly to crops). Avoid modeling complex market shifts beyond direct calorie replacement land use.
  *   **Simplify:** Use broad vertebrate/invertebrate categories for WAS estimates rather than species-level modeling.
  *   **Mentor Reliance:** Explicitly state that refining complex parameter estimates and locating specific data sources will be done *in consultation with the faculty mentor* during the fellowship.

  **Deliverable for Decision-Makers:**
  A concise, visually clear **"Ethical Impact Comparison Guide"** (1-2 pages + simple flowchart) for cafeteria managers or individuals. It would:
  1.  State the core ethical trade-offs (Deaths vs. Suffering Time; Farmed Animals vs. Wild Animals).
  2.  Present key findings as scenarios: "If reducing total animal *deaths* is your priority, then... [Plant-based likely best]. If reducing prolonged *suffering* is your priority, then... [Chicken over Beef? Depends on crops]. If you believe preventing wild animal lives usually *reduces suffering*, then... [Land-efficient options favored]."
  3.  Include a simple flowchart: "Start: What's your primary ethical concern? -> Option A -> Option B -> Recommended focus."
  4.  Emphasize transparency: "These recommendations depend on X, Y, Z assumptions. The biggest uncertainties are around [Field Deaths / Wild Animal Welfare]."
  5.  **Goal:** Not to dictate one answer, but to help users align their food choices with their *specific* ethical values by making the complex trade-offs understandable.

  This project tackles the core confusion you identified by building a structured framework to compare the incommensurable. It makes genuine progress by forcing explicitness about currencies and counterfactuals, quantifying trade-offs, and mapping the landscape of disagreement – providing actionable insight even if no single "best" diet emerges. Good luck!
