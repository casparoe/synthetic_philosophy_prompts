prompt: |-
  I need help with the thinking part of this more than the writing part. I'm giving the opening remarks — five minutes, maybe six — at a "listening session" the city is holding next week about its new Housing Repair Priority Score. About sixty people will be there, mostly tenants and homeowners from the neighborhoods with the oldest housing stock, plus three or four city staff including the two data people who actually built the thing, a legal aid attorney, and someone from the council member's office. I'm there as a tenant union member; I have no academic background at all, I work in medical billing. I've been chewing on this on my own for about a year, mostly arguing with a friend who does machine learning, and I think I've got the shape of something right but I also can't tell where I'm about to say something that will make the two data people smirk.

  Here's the setup. Roughly 4,000 households a year ask the city for help with serious repairs — lead, no heat, roofs. There's money and inspector time for about 120. So the city built a score that ranks requests by predicted urgency, and the top 120 get an inspector, and then a human inspector decides what actually gets fixed. The city's line is that the model "doesn't decide anything," it just tells them which houses to look at first.

  What I think I understand, and where I want you to correct me: there's a family of results saying a risk score can't satisfy all the fairness conditions you'd want at the same time. In particular you can't have both a score that means the same thing across groups — a 7 means the same real-world risk whether you're in group A or group B — and equal rates of both kinds of mistake across those groups, unless the groups genuinely have the same underlying rates or the score is basically perfect. And if I'm reading this right, that's not a fact about computers, it's a fact about any ranking, including the old way where a housing authority staffer eyeballed the pile. I also think it gets worse, not better, when the groups overlap: our union wants any twenty residents to be able to petition to define a group that then has to be audited for parity, and people would obviously belong to several at once — by neighborhood, by language, by disability, by whether there's a kid in the house. One of the consultants has floated something he calls "temporal fairness budgeting": enforce one fairness criterion each quarter and rotate, so over a year everybody gets a turn. That sounds to me like it might be a genuine dodge of the impossibility, or it might just be hiding it inside one household's lived experience.

  What I need is the five minutes, written to be spoken, no jargon (if I say "calibration" out loud the room is gone). The constraints are part of the point: I don't want to say the algorithm can be fixed if we just tune it, because I don't think that's true. I also don't want to say scrap it and go back to how it was, because if I'm right the old human version has exactly the same problem and I'd be lying to make people feel good. What I actually want the room to walk out knowing is that somebody has to pick which mistake we're willing to make and whose, that that's a decision about people and not about math, and that it should be made out loud by people who can be voted out. It has to land as being on our side without being anti-math or despairing, and it's a listening session so it can't be a rant — it has to leave people able to say something useful when the mic gets passed.

  So: write it. Then give me a short note on where my understanding above is wrong or overconfident, and two or three one-sentence replies I could use if the data people push back with the "it doesn't decide anything" line or the rotation idea. And don't let it sound like a TED talk.
