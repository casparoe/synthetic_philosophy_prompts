answer: |-
  Here's a brainstorm of readings I set aside:  
  1.  *"Heroic Individual vs. Systemic Failure"*: Too easy – it reduces the film to Paul's courage against international indifference, ignoring the core tension about the word itself.  
  2.  *"Media's Role in Bearing Witness"*: Too easy – while present, the journalist scene is more crucially about the *failure* of witnessing to compel action despite naming (implicitly) the horror.  
  3.  *"UN Hypocrisy Critique"*: Too easy – the UN officer’s mandate explanation isn't just hypocrisy; it's a direct confrontation with the gap between legal definition and political will/action.  

  **Reading the Film Through the Dispute:**  
  The scenes you selected powerfully support the *necessity* of the superlative for mobilization, demonstrating its tragic failure *in practice*, thus implicitly arguing *against* the student's clean split:  

  1.  **The Journalist Scene (Jack Daglish):** Daglish doesn't need the word "genocide." His footage *is* the superlative horror. His prediction – "they'll say 'Oh my God, that's horrible,' and go on eating their dinners" – directly attacks the core of the student's proposal. It shows that raw, undeniable evidence of "ascriptive mass killing" (the intent-claim) is *insufficient* for mobilization. The horror is registered descriptively, yet fails to trigger the *duty* the legal term implies. The scene suggests the mobilizing force ("ranking") is not inherent in the description but must be culturally/politically attached and *acted upon*. Daglish’s despair stems from the dissociation between seeing the superlative horror and feeling the imperative to act.  

  2.  **The UN Colonel (Oliver):** His insistence "We are peacekeepers, not peacemakers... My mandate does not allow me to intervene" is the legal trigger mechanism malfunctioning catastrophically. The *absence* of the word "genocide" by authorities (your point is correct – Paul uses it once, desperately/morally, not officially) is crucial. Oliver *knows* what is happening fulfills the descriptive horror ("They're animals," he says of the Interahamwe). Yet, without the *official naming* invoking the specific legal regime and its absolute duty ("prevent and punish"), the mechanism remains inert. The mandate becomes an alibi precisely because the situation hasn't been *categorically ranked* as Genocide with a capital 'G' by the powers that could intervene. The scene argues the legal trigger *depends* on the political recognition inherent in the "ranking" aspect to activate. A flat "ascriptive mass killing" category provides no stronger lever than "war crimes" to overcome this inertia.  

  3.  **The Closing Text (War Crimes Conviction):** This is the film's devastating final argument against the student's split. Prosecuting for war crimes, not genocide, is not a neutral legal choice. It’s a deliberate *demotion*. It confirms the international community's *refusal* to apply the ranking superlative even *after* the fact. This demotion minimizes the specific intent to destroy the Tutsi group and the systematic nature of the atrocity. It demonstrates that without the assertion of "the worst thing," the legal response defaults to a lesser category with lesser symbolic weight and potentially lesser consequences. The film shows that withholding the word *is* an act of political ranking in itself, diminishing the atrocity and the victims. A flat vocabulary would simply become the tool *for* this demotion, not a solution to it.  

  **Where the Film Resists: The Hierarchy it Needs**  
  Your worry is astute. The film *absolutely* relies on and reinforces the hierarchy the student wants to dissolve. Its emotional architecture is built on the audience knowing this *is* genocide, feeling the moral outrage of the word's absence, and sharing Paul's desperate need for its recognition. We supply the word and the shudder precisely because the film meticulously depicts the *criteria* (intent, scale, systematic targeting of a protected group) while showing the world refusing the *conclusion*. It needs us to feel the superlative horror to understand the profound betrayal of inaction and misnaming.  

  **Does the film know this?** Yes, profoundly. It makes something essential of it: **The film exposes the hypocrisy and deadly cost of the hierarchy *precisely by depending on it*.** It traps the audience in the same paradox as Paul. We *know* it's genocide, we *feel* the imperative to act, and we experience the impotence when the word is withheld by those with power. The film’s power comes from showing the monstrous gap between the descriptive reality (which meets the criteria) and the political refusal of the ranking term and its attendant duties. It *uses* the moral hierarchy inherent in "genocide" to indict the world's failure to live up to the obligations *that same hierarchy* supposedly imposes. It’s not a failure of nerve; it’s a deliberate, painful immersion in the contradiction. To remove the hierarchy would neuter the film's central critique: that the world looked at genocide and chose not to name it, and thus not to act.  

  **What the Film Adds:** Hotel Rwanda uniquely dramatizes the *lived, immediate consequence* of the naming dispute – not as an academic debate, but as the terrifying gap between the victims' reality and the world's evasive semantics, where the refusal to deploy the superlative becomes a weapon of abandonment.
