prompt: |-
  I'm a journalist who covers science and ideas, and I'm working on a piece about everyday conventions — who stands where, whether you leave money on the table, when you step off the pavement — and about the odd disproportion in them: that failing at one can leave you feeling, and being made to feel, guilty in a way that seems to have nothing to do with anybody having been harmed. I have recently managed to get inside this question rather than merely report on it, and I'd like your help with the particular case before I file.

  I'm five weeks into a reporting trip in a Nordic city where, as I understand the local arrangement, service is included in the price and hospitality wages are set by collective agreement rather than supplemented by gratuities. Three small things have happened.

  First: at a neighbourhood restaurant I added roughly fifteen percent when I paid. The server followed me onto the street to return it, visibly embarrassed, and a local friend later explained why. In her account the gesture is not simply unnecessary; it imports a labour model the country has deliberately rejected, it implies that the person standing in front of you is not adequately paid, and it is the sort of thing that, repeated often enough by visitors, begins to loosen the arrangement locals spent decades building. I experienced this as a small act of generosity and am now being told it was something closer to a small act of vandalism.

  Second: at a tram stop in the same city there is, to my eye, no queue — people gather in a loose cluster and board. I joined the cluster and boarded with everyone else. A colleague subsequently told me that there is in fact a strict order there, legible only to people who know where to stand on the platform and whose eye to catch, and that I had effectively pushed in ahead of two or three people. I could not have discovered this by looking. I still feel I did something wrong.

  Third: at an empty intersection after midnight I waited for the signal. A passer-by laughed, and another local later observed that pedestrians here cross whenever it is clear, that waiting marks you as a visitor, and — this is the part I keep turning over — that a child who watches a row of adults wait at an empty crossing learns something false about when a signal can be trusted.

  In each case I did what would be unremarkable, or right, at home. In each case I got it wrong here, and not in a single direction: I over-performed in one and three, and under-performed in two.

  Here is the crude principle I've been using to sort this out, which I haven't seen stated anywhere and which I suspect is wrong. Call it the reliance-and-visibility test: a convention generates a genuine obligation for a visitor only if it is load-bearing, in the sense that people have taken jobs, set prices, or planned journeys that presuppose it will hold, and only if it is legible, in the sense that an attentive outsider could have worked out that it existed without being told. The plain queue passes both; the invisible queue at the tram stop fails the second condition, though it arguably passes the first; the local no-tipping convention, on my friend's account, passes both, which would mean I owed it to her not to tip. But my test seems to make obligation hostage to whatever political project a local majority happens to be running — if a city had a convention of not acknowledging service workers at all, my test would apparently tell me to adopt it — and it says nothing about why I felt guilty at the empty crossing, where nobody relied on me and nobody was harmed.

  So, concretely: what should I actually have done in each of the three cases, and why? Is there a principled asymmetry between over-conforming and under-conforming, given that skipping the invisible queue seems to take something from an identifiable person while over-tipping seems only to give, and yet both drew the same resentment — and is that resentment moral, or is it political or aesthetic wearing moral dress? Does my status as someone who will leave in a fortnight change anything, especially given that locals know I will leave and may be extending me the latitude routinely extended to guests: do I owe it to them to learn a convention I cannot see, and is accepting their latitude itself a kind of condescension? And where exactly does the harm my friend described come in — does my single tip bear any real relation to the erosion of a wage system, or is that a way of moralizing an objection that is really about who gets to set the terms of life here? If you think my framing of all three as one phenomenon is the mistake, tell me where the disanalogy lies.
reasoning: |-
  Okay, this is a fascinating and layered query from a science journalist grappling with cultural conventions and the moral weight of unintentional breaches. The user has presented three vivid vignettes from a Nordic context (tipping, queueing, traffic signals) that all center on the tension between local norms and visitor behavior. 

  What makes this particularly rich is how the user is wrestling with multiple dimensions simultaneously: 
  - The psychological experience of guilt/shame despite no obvious harm
  - The political economy embedded in conventions (especially tipping as rejecting exploitative labor models)
  - Epistemological questions about how outsiders can access "invisible" rules
  - Moral philosophy about obligation and cultural relativism

  The user's proposed "reliance-and-visibility test" shows they've done significant conceptual work already. But their unease with it is well-founded - it risks justifying any majority norm, however unjust. The tram queue example perfectly exposes the flaw: an invisible system that still "load-bears" local expectations.

  Several key tensions stand out:
  First, the asymmetry between over-conforming (tipping, waiting at crossing) and under-conforming (queue jumping). The emotional response seems similar, but the social meaning differs - one disrupts by introducing foreign elements, the other by taking local resources. Yet both trigger resentment because they reveal the visitor's failure to recognize the local moral ecosystem.

  Second, the time-bound nature of the user's presence creates interesting wrinkles. The tipping incident carries political weight precisely because temporary visitors' actions can accumulate into systemic impact (what Scandinavians might call "folkhemmet" - the people's home - being eroded by individualism). Whereas the traffic signal moment seems more about social signaling - the passerby's laugh suggests amusement at unnecessary rule-following.

  The harm question is especially thorny. The friend's tipping explanation frames individual acts as threads in a social fabric - but is that burden fair to place on unaware visitors? And in the queue case, the "harm" is to abstract queue order rather than concrete individuals, yet feels intensely personal.

  What the user might not have fully articulated is how these conventions function as boundary markers. The strong reaction to tipping isn't just about economics - it defends a cultural identity built on egalitarianism. The invisible queue maintains social cohesion through subtle mutual monitoring. Even the traffic light moment becomes a civics lesson about trust in institutions.

  For the response, I'll need to:
  1) Affirm the validity of grouping these as related phenomena (all concern maintaining social coordination systems)
  2) Dissect why their "test" works imperfectly (it misses the expressive function of conventions)
  3) Suggest concrete reframing: obligations arise from (a) avoiding tangible harm/distributional injustice AND (b) respecting expressive cultural meanings where legible
  4) Note the special responsibility regarding practices tied to core societal values (like tipping's link to labor justice)
  5) Propose practical visitor ethics: prioritize learning visible/explained norms, accept grace for invisible ones, and recognize that feeling guilty about the crossing incident reveals your own cultural conditioning more than actual wrongdoing
answer: |-
  Your observations cut to the heart of cultural coordination—how invisible rules bind societies—and the real moral tension visitors face. Let's dissect your cases through a layered ethical lens:

  ### What You Should Have Done & Why:
  1. **Tipping**:  
     - **Action**: Withheld the tip.  
     - **Why**: This isn’t about political conformity but *harm prevention*. Your friend’s framing holds: tipping here isn’t neutral generosity; it risks undermining a hard-won labor equilibrium. Like introducing an invasive species, it pressures workers to adapt to foreign expectations, potentially destabilizing collective bargaining. Your status as a temporary visitor *intensifies* this duty—locals extend latitude, but reciprocating means respecting systems they’ve built.  

  2. **The Invisible Queue**:  
     - **Action**: Observed longer before boarding. If still unclear, boarded last or asked quietly.  
     - **Why**: The "harm" here is distributive injustice—you took a spot others earned through implicit social labor. Unlike tipping, this convention’s invisibility *matters*. Obligation scales with legibility: when a norm is opaque, your duty is *procedural* (observe, defer, ask) rather than performative. Feeling guilty is appropriate—you deprived specific individuals—but the resentment you sensed likely blended moral offense ("they cheated") and frustration at system fragility ("outsiders don’t even try").  

  3. **The Empty Crossing**:  
     - **Action**: Crossed when safe.  
     - **Why**: No reliance or harm exists here—the signal’s midnight emptiness voids its coordination function. Waiting isn’t morally wrong but *semiotically misleading*. The passer-by’s critique reveals conventions as pedagogy: your action taught bad "civic grammar." Yet as a visitor, your duty is to avoid tangible harm, not perform cultural fluency. Accepting latitude here isn’t condescension—it’s acknowledging legitimate outsider status.  

  ---

  ### Core Principles Emerging:
  - **The Asymmetry of Over/Under-Conforming**:  
    - *Under-conforming* (queue-jumping) causes immediate, micro-level harm: quantifiable disadvantage to individuals.  
    - *Over-conforming* (tipping, waiting) introduces macro-level risk: importing values that could unravel systems. Resentment here isn’t moral but *political*—it defends a local world-making project. Your tipping wasn’t "vandalism," but it *was* a mild form of cultural imperialism, however unwitting.  

  - **Visitor Ethics**:  
    - **Legibility Threshold**: You owe diligence in learning *discernible* norms (e.g., posted tipping policies). For invisible rules (the queue), goodwill effort suffices. Guilt over the queue is productive; guilt over the crossing is misplaced.  
    - **Temporal Status**: Your transience reduces obligations *except* where actions risk cumulative effects (tipping) or direct harm (queue). Locals’ latitude is grace—not an invitation to exploit ignorance.  

  - **Harm Realism**:  
    Your single tip won’t collapse a wage system—but normalizes a practice that *collectively* pressures workers to accommodate tipped income, fraying solidarity. The "harm" is less economic than *discursive*: it reframes service as charity, not dignified work. Your friend’s objection *is* moral: it defends a society’s right to define fairness.  

  ---

  ### Reframing Your Test:
  The "reliance-and-visibility test" fails by ignoring *power* and *purpose*. **Try this instead**:  
  A visitor’s obligation binds when:  
  1. **Reliance + Harm Potential**: The convention prevents tangible harm/distributive injustice (e.g., queues allocating scarce space).  
  2. **Legibility + Value Defense**: The norm reflects non-oppressive local values *and* is reasonably legible (e.g., tipping’s rejection of wage precarity).  
  3. **Outsider Impact**: Your action could plausibly alter systems (e.g., tipping’s normalization effect) or directly disadvantage individuals (queue-jumping).  

  **Where your cases land**:  
  - Tipping: Strong obligation (fails 1 & 2—harms systemic values, legible if researched).  
  - Queue: Moderate obligation (fails 1—harms individuals; but low legibility reduces culpability).  
  - Crossing: No obligation (harms none; legibility irrelevant).  

  ---

  ### The Deeper Disanalogy
  Your three cases *are* linked as "coordination failures," but their moral structures differ:  
  - **Tipping** is *teleological*: its wrongness lies in the future it risks creating.  
  - **Queue-jumping** is *deontological*: it violates fairness-as-process.  
  - **Crossing** is *expressive*: its "wrong" is symbolic miscommunication.  

  The resentment you faced wasn’t uniform. Tipping drew political anger (defending a system); the queue drew moral irritation (correcting unfairness); the crossing drew anthropological amusement (decoding a foreigner). Your guilt at the crossing reveals your *imported* ethics—proof of how deeply conventions shape conscience.  

  ### Final Thought
  As a visitor, you navigate a paradox: expected to respect local sovereignty, yet forgiven for inevitable stumbles. Your duty is epistemic humility: research legible norms, observe cautiously, and when corrected (as in the tipping), apologize and adapt. The conventions that sting most—those that feel arbitrary yet morally charged—often guard a society’s deepest values. File this not as a catalog of errors, but as a testament to how fiercely humans cling to the rules that let us coexist.
