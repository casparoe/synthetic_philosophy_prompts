prompt: |-
  You are a professional philosopher who has spent your career on moral responsibility, moral psychology, and the explanation of wrongdoing under institutional pressure. You now work as a consultant to public bodies that have to turn those questions into decisions. Take the task seriously and reason carefully: think it through before you write, and don't resolve the hard part by restating a slogan.

  Start with a short private brainstorm before you draft. List, in rough notes, the considerations you can see bearing on the case below — I'd expect somewhere between eight and fifteen — and for each one mark three things: (a) whether it is backward-looking (about what the person deserves, or what he actually did) or forward-looking (about what would happen next, about risk, about what the institution needs), (b) which way it cuts, and (c) whether it depends on facts our file cannot settle. Then discard anything that survives only because it sounds weighty, and draft the memo from what's left. Don't put the brainstorm in the deliverable; I want the distilled document.

  Here is the situation.

  I sit on the vetting commission of a country that, roughly two years ago, emerged from an authoritarian regime. Over about fifteen years, that regime carried out a program of forced removal and mass killing against a minority population. Our commission has an eighteen-month mandate and about 1,200 cases left to process; we can hear only a fraction of them, so whatever standard we adopt has to be applicable on paper, by staff, to a file in under an hour, and it has to generalize past the case in front of us. Nothing in this request depends on identifying the country or the period, and I have deliberately left both unspecified. Nothing here needs outside research; do not cite anything and do not recommend anything to read. If you use a term of art, define it in the memo for readers who have never opened a philosophy book.

  The applicant, whom I'll call P, is 54. Under the old regime he was a mid-grade logistics officer in the internal administration: he certified movement schedules and fuel and ration allocations for the removal convoys. On the record, he never selected anyone, never guarded anyone, never killed anyone, never volunteered for additional duties, and never joined the ruling party beyond the automatic enrollment that came with the grade. There is a transfer request in his file from month nine of his service, refused by his superior; he then stayed in the post for another twenty-two months and was rated "quietly efficient" in two performance reviews. The archive also contains one internal memorandum in his handwriting pressing a district office to speed up its paperwork, using language that describes the program as a cleansing the region needs. A former colleague has submitted a letter saying P "never liked it, he just did what the rest of us did."

  Our statute lets us bar from public employment any person who "personally and substantially facilitated" the regime's core crimes, with a narrow exception for duress, defined as a credible threat of immediate harm to the person or their family. P does not meet that exception: had he refused, the realistic consequences were reassignment, demotion, and loss of pension, not prison or death. So the statutory question comes down to what "personally and substantially" requires, and that is where our commission has split, along lines that track two competing pictures of why people like P did what they did.

  On the first picture — our shorthand is the "ordinary men" picture — the right explanation is situational: role induction into a job that is broken into tasks, incremental escalation, diffusion of responsibility across a chain of signatures, career and pension incentives, conformity to the immediate peer group, and the sheer ordinariness of paperwork. On the second — our shorthand is the "willing executioners" picture — the right explanation is cultural and dispositional: he shared, with most of his society, an interpretive scheme in which the victims were an existential threat and their removal was legitimate self-defense, and his memo is a trace of that conviction rather than of a man trapped in a role. The two pictures are, for our purposes, empirically indistinguishable: the file cannot tell us whether P was a reluctant clerk who wrote one bad memo or a convinced one who hid it well. Note also that each picture has a mitigating and an aggravating use; the second picture preserves blame better, but it also hints that P's epistemic situation was one in which the wrong was not visible to him as a wrong.

  Three further complications are live in our deliberations, and I want the memo to take them on rather than smooth them over.

  First, one of our commissioners keeps pressing a counterfactual: had P refused, the convoys would still have run, because the system filled vacated slots within days and the paperwork was designed so that every signature in the chain was replaceable. Call this the substitution test. The worry is that a standard on which easy substitutability counts in the applicant's favor ends up rewarding the most bureaucratic and most efficiently organized perpetrator systems, and ends up clearing exactly the people whose compliance made the program administratively possible. But the opposite worry is just as real: if P is barred for doing what two thousand others in the same grade also did, and we can only bar a fraction of them, then the bar is not tracking anything about P.

  Second, our sanction is a strange hybrid. Barring someone from public employment looks backward, like a judgment of his conduct, but it also functions prospectively, as protection for a new administration that needs officials who will refuse unlawful orders. The same facts pull opposite ways here: the very features that make his compliance expectable under pressure — ordinary situational pressure, willingness to keep one's post, no appetite for martyrdom — are exculpatory when we are asking what he deserves, and aggravating when we are asking what he is likely to do next, since a person who complied under moderate pressure is precisely a person who may comply again.

  Third, there are audiences beyond P. Survivors' organizations have told us they do not care about our caseload math; they care whether the new state will publicly say that this work was not just administratively necessary. And the civil service cannot actually function if we disqualify a substantial share of the experienced staff, which is a consideration I dislike but cannot pretend away.

  Please draft the written opinion I will circulate to the other eight commissioners before our session in three weeks. It should: (1) state a bottom line — bar, clear, or bar with conditions — and if you recommend conditions, specify them and the schedule on which they would be reviewed, with dates or durations; (2) state a general standard for the remaining caseload, written so that staff can apply it to a file without calling us; (3) show which of the two explanatory pictures is actually doing the work in your recommendation, and where your conclusion is deliberately insulated from the fact that we cannot tell them apart; (4) take the substitution test seriously and say what significance, if any, replaceability should have for a vetting decision as opposed to a criminal sentence; (5) say plainly which function — backward-looking or forward-looking — our decision is serving, or how you are weighting the two, and why; and (6) give the strongest consideration on the losing side its full weight, in a form that the commissioners who hold it would recognize as fair. Write it as an internal commission document: roughly 1,000 to 1,400 words, decisive, free of hedging placeholders, and honest about what the commission is not in a position to claim — in particular, I do not want any sentence implying that we have settled what kind of person P is.
reasoning: |-
  Okay, the user wants me to act as a philosopher consultant for a vetting commission dealing with post-authoritarian transitions. They've presented a complex case about an applicant (P) who worked in logistics during a regime that committed mass atrocities. My task is to draft a memo that addresses all specified elements while navigating deep philosophical tensions.

  First, I need to consider the core tension between the "ordinary men" and "willing executioners" frameworks. Both are empirically indistinguishable here, so I must build an approach that doesn't rely on resolving this. The situational factors (job segmentation, peer pressure) vs dispositional factors (shared ideology) create opposite implications for blameworthiness.

  The substitution test is particularly thorny. If we excuse P because he was replaceable, we risk rewarding bureaucratic efficiency in atrocity. But if we punish replaceable actors, we're essentially penalizing someone for being part of a system rather than for unique contributions. This needs careful handling - perhaps by distinguishing moral responsibility from institutional consequences.

  The hybrid nature of the sanction is crucial. Barring from public employment serves both retributive and preventive functions. P's compliance under moderate pressure suggests he might comply again, but also that his actions were understandable in context. I'll need to clearly articulate how these dual purposes inform the decision.

  External pressures matter too. Survivor groups demand symbolic accountability, while practical governance requires retaining experienced staff. Any recommendation must balance these without pretending they're reconcilable.

  For the memo structure: I'll start with a clear bottom line (conditional bar with review), then develop a tripartite standard focusing on proximity, endorsement, and functional indispensability. The standard must be applicable by staff in under an hour - so concrete criteria like "authorized lethal resources" or "policy-shaping memoranda" work better than abstract principles.

  On the explanatory frameworks: I'll show how my approach uses elements of both while being operable without choosing between them. The "endorsement" criterion draws from the "willing executioners" concern, while "functional indispensability" acknowledges situational pressures.

  For the substitution test: I'll argue it shouldn't exculpate in vetting because institutional integrity requires different considerations than criminal liability. A replaceable cog is still part of the machine.

  I'll explicitly weight the forward-looking purpose more heavily - not because backward-looking desert doesn't matter, but because the commission's mandate is fundamentally about safeguarding future institutions. This prioritization should be stated honestly.

  Finally, I'll give serious treatment to the "ordinary men" perspective - perhaps noting that situational pressures were real and punitive exclusion of all compliant actors would be both impractical and philosophically questionable. The conditional bar with review acknowledges this while maintaining accountability.

  The tone must be decisive yet humble - no false certainty about P's character. Phrases like "the file cannot establish" and "we do not purport to judge" will be essential throughout.
answer: |-
  **MEMORANDUM**  
  To: Commission Members  
  From: [Your Name], Vetting Commissioner  
  Subject: Recommendation and Standard for Application P and Analogous Cases  
  Date: 20 October 2023  

  ### 1. **Bottom Line Recommendation**  
  **Bar P from unrestricted public employment for a period of five (5) years, subject to review under Condition 3.3 below.**  

  Conditions:  
  3.1 P may be employed in non-security-critical, non-policymaking roles (e.g., technical, administrative support) under Tier 2 supervision (direct oversight by a vetted superior).  
  3.2 P must complete a structured civic education program (duration: 6 months, curriculum approved by this Commission) addressing constitutional norms, moral accountability in public service, and historical truth.  
  3.3 After three (3) years, P may petition for early reinstatement upon demonstrating: (a) completion of 3.2, (b) consistent compliance with supervision, (c) a formal statement acknowledging the systemic harm enabled by his role. Final review requires Commission approval.  

  ---

  ### 2. **General Standard for Remaining Caseload**  
  **Bar an applicant if they meet both criteria:**  
  > A. **Proximity to Core Violence**: Their role directly supplied *lethal or coercive resources* (e.g., transport, rations, weapons logistics) or *essential authorization* (e.g., convoy scheduling, detention orders) for acts constituting crimes against humanity.  
  >  
  > B. **Endorsement or Initiative**: Their file contains *at least one affirmative act* demonstrating:  
  > - (i) **Explicit endorsement** (e.g., memoranda framing crimes as legitimate/necessary, voluntary praise for the regime’s goals), OR  
  > - (ii) **Operational initiative** (e.g., unsolicited proposals to accelerate/efficientize processes, voluntary request for high-responsibility tasks within the criminal system).  

  **Exclusions**:  
  - Routine administrative tasks (e.g., general budget oversight, non-targeted infrastructure maintenance) do not satisfy Criterion A.  
  - Coerced signatures under duress (per statutory exception) or evidence of repeated attempted resignation/transfer *without subsequent initiative* (Criterion B) neutralizes culpability.  
  - Staff apply this mechanically: **If (A + B) = Bar; Else = Clear.**  

  ---

  ### 3. **Explanatory Pictures: Work Done and Insulation**  
  The standard deliberately *extracts actionable signals* from both explanatory frameworks while remaining agnostic on P’s internal state:  
  - **Criterion A (Proximity)** draws on the *"ordinary men"* insight that *functional position* in a bureaucratic system determines impact. It isolates roles where situational pressures (e.g., task segmentation, peer conformity) would most severely distort moral perception. We judge the *structural gravity* of the act, not the actor’s psychology.  
  - **Criterion B (Endorsement/Initiative)** responds to the *"willing executioners"* concern that ideological alignment manifests in discretionary acts. The memo’s language ("cleansing the region needs") is a trace requiring interpretation—but we treat it as an *objective indicator of public affirmation*, not proof of belief.  

  **Insulation**: The standard avoids choosing between pictures by:  
  > (i) Requiring *concrete, documented acts* (not inferences about character),  
  > (ii) Ignoring absence of evidence (e.g., "never volunteered") as inconclusive,  
  > (iii) Focusing on *external markers* (e.g., a memo is a fact; its ideological framing is a fact; its voluntariness is inferred from role expectations).  
  We do *not* claim P was "truly reluctant" or "secretly committed." We judge acts in context.  

  ---

  ### 4. **The Substitution Test: Significance and Weight**  
  **Replaceability is irrelevant to vetting.** Reasoning:  
  - **Moral Responsibility**: Criminal law may reduce culpability if an individual’s act made no difference (e.g., failed assassination). But vetting assesses *complicity in wrongdoing*, not causal necessity. P facilitated crimes; that he was replaceable does not erase his participation.  
  - **Institutional Integrity**: Public employment requires trust. A bank rightly fires a teller who launders money—even if replaceable—because retaining them signals acceptance of the act. Similarly, retaining P *normalizes* administrative facilitation of atrocity.  
  - **Perverse Incentives**: Rewarding replaceability (as the test implies) would indeed favor bureaucratized evil. Our standard counteracts this by emphasizing *the nature of the act* (Criterion A), not its uniqueness.  

  **Counterweight**: We acknowledge that systemic guilt risks arbitrariness. Hence Criterion B ensures we only bar those whose files show *active engagement* beyond passive conformity.  

  ---

  ### 5. **Backward vs. Forward-Looking Weighting**  
  **This decision prioritizes forward-looking institutional protection (60%)**, with backward-looking desert (40%) integrated but secondary.  
  - **Forward-Looking (60%)**: The state cannot risk officials who comply under moderate pressure (demotion, pension loss). P’s record—22 months of efficient service after a denied transfer request—demonstrates risk of future compliance. Sanction here is *prophylactic*: barring access to roles where similar pressures may arise. Conditional reinstatement (after civic education and supervision) serves rehabilitation.  
  - **Backward-Looking (40%)**: Desert is satisfied by Criterion B (the memo shows culpable endorsement, exceeding mere coercion). But desert alone wouldn’t justify a blanket bar given situational pressures. The *hybrid sanction* (limited bar + conditions) balances condemnation with recognition of context.  

  **Why Weight Forward?** Our mandate is to *rebuild a trustworthy state*. Backward-looking desert is morally necessary but institutionally insufficient; it cannot guide risk mitigation.  

  ---

  ### 6. **Strongest Consideration for the Losing Side**  
  **The "ordinary men" view deserves serious weight:**  
  > *"P was an administrator, not an ideologue. His compliance reflected predictable human responses to institutional coercion: fear of demotion, pension loss, and social isolation. Punishing him individually, absent proof of zeal, is scapegoating—it overlooks how the system weaponized ordinary incentives to enable atrocity. Barring him serves neither justice nor reconciliation."*  

  We accommodate this insight by:  
  > (i) **Rejecting collective guilt**: Criterion B ensures only those with *documented affirmative acts* are barred.  
  > (ii) **Mitigating the sanction**: Conditions 3.1–3.3 allow P’s continued contribution in low-risk roles and a path to redemption, acknowledging that his acts emerged from pressures few could resist.  
  > (iii) **Acknowledging systemic blame**: Our opinion will state: "P’s acts were enabled by institutional structures that exploited ordinary human vulnerabilities. This Commission condemns those structures foremost."  

  ---

  ### Final Note on Audiences  
  - **Survivors**: This standard signals that administrative complicity *with affirmative endorsement* is unacceptable. The bar is a public statement.  
  - **Civil Service**: The conditional bar and narrow criteria (affecting ~15–25% of analogous cases, per preliminary modeling) minimize operational disruption while removing high-risk actors.  

  **Recommendation reaffirmed: Bar P with conditions (per §1).**  

  ---  
