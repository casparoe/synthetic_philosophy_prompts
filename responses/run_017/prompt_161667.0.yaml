answer: |-
  Here is a decision procedure for publishing identifying details of individuals, designed for speed, defensibility, and explicit escalation points. It addresses your five core difficulties and halts at clear thresholds. Use it sequentially—**stop at the first "No" or "Escalate"**.

  ---

  ### **Decision Procedure: Publishing Identifying Details**  
  ***(Apply only to living individuals. Groups/companies/dead persons have no procedural privacy claim here.)***

  1. **IS THIS A HUMAN BEING CURRENTLY ALIVE?**  
     - *Sufficient answer:* Verification via public records or reliable sourcing.  
     - **→ Stop, NO** if deceased or not human (e.g., corporation).  
     - **→ Proceed** if yes.  

  2. **IS THE DETAIL TRULY "PUBLIC" IN CONTEXT?**  
     - *Sufficient answer:* Accessible *today* without specialized tools (e.g., not behind logins, paywalls, or obscure archives), *and* the current audience/purpose aligns with the original disclosure context (e.g., clinical data remains in medical realm, HR records in employment).  
     - **→ Stop, NO** if:  
       - It’s "public" only in a niche/outdated context (e.g., decade-old employee roster now unearthed by a reporter).  
       - Audience/purpose mismatch (e.g., clinical data repurposed for viral news).  
     - **→ Escalate to Editor** if uncertain whether context is intact.  
     - *Addresses difficulty 1 (context) & 3 ("already-public" fallacy).*  

  3. **IS THE DETAIL RELEVANT BEYOND ATMOSPHERIC VALUE?**  
     - *Sufficient answer:* Directly proves/disproves a key claim, explains motivation, or is unavoidable for understanding the core event.  
     - **→ Stop, NO** if:  
       - Only adds "colour," "human interest," or speculative context.  
       - Could be replaced with equally informative alternatives (e.g., "a lab in Boston" vs. "Elm Street lab").  
     - **→ Proceed** if indispensable.  

  4. **WHAT IS THE EXPOSURE GRAVITY?**  
     - Assess:  
       - *Intimacy:* Is it biographical (e.g., health, home, family) or neutral (e.g., job title)?  
       - *Control:* Did the person consent *to this specific use*? If not, would a reasonable person expect this disclosure?  
       - *Power imbalance:* Is the subject vulnerable (e.g., student, patient, junior employee)?  
     - **→ Stop, NO** if:  
       - High intimacy + no consent + high vulnerability (e.g., patient’s street name).  
       - The detail invites harassment, doxxing, or stigmatization.  
     - **→ Escalate to Editor** if:  
       - Medium intimacy + no consent + low public interest (e.g., naming an email author in a minor dispute).  
     - *Addresses difficulty 4 (non-harm objections: privacy as autonomy/contextual integrity).*  

  5. **DOES THIS COMPLETE A REVEALING MOSAIC?**  
     - *Sufficient answer:* Confirm no other public fragments exist that, combined with your detail, would expose protected information (e.g., health status, location, private behavior).  
     - **→ Stop, NO** if:  
       - Your detail is the "key" to unlocking private facts (e.g., street name + disease rarity = identifiable patient).  
       - The subject is already in a sensitive situation (e.g., misconduct investigation).  
     - **→ Escalate to Editor** if aggregation risk is plausible but unprovable quickly.  
     - *Addresses difficulty 2 (aggregation).*  

  6. **IS THE SUBJECT’S ROLE PERIPHERAL?**  
     - *Sufficient answer:* The person is not a central actor, decision-maker, or beneficiary of the event.  
     - **→ Stop, NO** if:  
       - They are a bystander, minor participant, or involuntary figure (e.g., graduate student near a lab under investigation).  
     - **→ Proceed** if they are a primary protagonist (e.g., PI leading the research).  

  **IF ALL STEPS PASS → PUBLISH.**  

  ---

  ### **Application to Your Cases**  
  **Case 1: Naming the author of the leaked email**  
  - Step 2: Email is "public" via records release, but context mismatch (internal university comms → national audience). **→ Escalate to Editor**.  
  - *Procedure outcome:* **Handed to editor**. Values conflict: Public interest in transparency vs. contextual integrity. Without evidence of author’s significance, naming likely fails.  

  **Case 2: Publishing photo of graduate student outside lab under investigation**  
  - Step 4: High vulnerability (student under investigation cloud), no consent, low relevance (single-clause mention). **→ Stop, NO**.  
  - Step 5: Aggregation risk (photo + investigation context implies association). **→ Stop, NO**.  
  - *Procedure outcome:* **Do not publish**.  
  - **Defense sentence for editor:** *"We don’t publish visuals of bystanders in misconduct contexts—it implies guilt by proximity and offers no public insight."*  

  **Case 3: Printing street name (no number) of rare-disease patient**  
  - Step 2: Street name is public, but original context (e.g., municipal records) ≠ national feature about health. **→ Escalate?**  
  - Step 4: High intimacy (health + home), consent didn’t cover address. **→ Stop, NO**.  
  - Step 5: Aggregation risk (rare disease + street may = identifiable). **→ Stop, NO**.  
  - *Procedure outcome:* **Do not publish**.  

  ---

  ### **Failure Modes of the Procedure**  
  1. **Systematic blind spots:**  
     - **Power dynamics:** May overlook systemic vulnerability (e.g., low-wage worker vs. institution).  
     - **"Relevance" bias:** Overvalues journalists’ judgment about what’s "indispensable."  
     - **Mosaic underestimation:** In 20 mins, you can’t audit all existing public fragments.  

  2. **When the 20-min version is a sham:**  
     - If aggregation risk (Step 5) is plausible but requires deep-digging to confirm.  
     - If "context" (Step 2) hinges on cultural nuance (e.g., stigmatized communities).  

  3. **What no checklist can do:**  
     - **Absorb uncertainty:** When harm feels possible but unprovable.  
     - **Replace editorial courage:** Protecting the vulnerable may require rejecting a juicy detail.  
     - **Solve value conflicts:** Lawyers see defamation; philosophers see dignity; you see narrative. Only humans can weigh these.  

  **Final note:** This procedure errs toward caution on non-central figures and intimate details. It treats privacy as *contextual control*—not secrecy—and rejects "public therefore fair game" as a standalone argument. Your editor’s "colour" has a cost; this tool makes that cost visible.
