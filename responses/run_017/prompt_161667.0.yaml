  - Aggregation: Step 5 examines if the detail completes a revealing mosaic
  - Already-public defense: Step 3 rejects this as automatic justification by requiring "intact context"
  - Non-harm objections: Step 4 acknowledges inherent dignity via the "exposure gravity" test
  - Entity scope: Step 1 limits protections to living humans only

  Testing on their cases:
