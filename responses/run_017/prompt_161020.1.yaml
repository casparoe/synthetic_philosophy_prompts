prompt: |-
  I've just spent a long evening arguing with a friend — a biostatistician, and an unapologetic frequentist — about what a large replication project is actually *for*, and I came away convinced she was wrong without being able to say exactly where. Her position was that the job of a multi-site replication is to issue an error-controlled verdict: fix a significance level and a smallest effect size of interest before data collection, run an equivalence test, and be able to say something about the effect that is calibrated across the whole portfolio of studies rather than tailored to whoever happens to be arguing about it. My position was that nobody in the field is interested in long-run error rates over a batch of studies that nobody sampled at random; the question is what we should now believe, and a Bayes factor under a pre-registered prior answers that directly. Neither of us moved. On the way home it occurred to me that the argument was downstream of a prior one: whether the output of a replication should be a verdict at all.

  I am one of two statisticians on the steering committee of a multi-university registered replication project, and on Thursday we have to settle the analysis plan for our next round: replications of a single disputed priming effect — call it H — across twelve labs, roughly 2,500 participants total. The published literature on H consists almost entirely of small-sample studies; the best available bias-corrected meta-analytic estimate is around d = 0.4, and our own pilot work points to something somewhere between 0 and 0.15. The original authors have agreed in advance to write a commentary whatever we find, and they have already told us informally that they expect our protocol to omit something essential.

  Three proposals are on the table. (a) A pre-registered equivalence test against a smallest effect size of interest, with the headline result stated as a calibrated decision — "smaller than we care about," "not distinguishable from the original estimate," or "inconclusive." (b) A pre-registered Bayes factor under a default prior, reported with a robustness curve across a family of priors, with the headline stated as a change in belief. (c) Mine, and the one I am least able to evaluate impartially: no verdict about H at all. Instead we pre-register three priors — an enthusiast's, centered on the bias-corrected meta-analytic estimate; a skeptic's, tightly centered on zero; and a diffuse default — and we report, as the headline result, a disagreement-reduction profile: how far each camp's posterior moves toward the others, expressed both as a percentage of the initial distance closed and in units of the smallest effect size of interest, plus the sample size at which the enthusiast's and skeptic's posteriors would come within a pre-set distance of one another. The thought behind it is that when a field is genuinely divided, the value of a replication is how much it forces the two sides together, and that a study which leaves both sides exactly where they were is uninformative no matter what its p-value or its Bayes factor says. My friend's objection, which I think is the strongest thing against me, is that this makes the evidential value of a fixed body of data depend on who happens to be arguing — in a field with no skeptics the same data would count for nothing — and that it is gameable, since the more extreme the two registered priors, the larger any convergence looks.

  Please draft the memo I will circulate to the committee on Monday, under 900 words, addressed to the other eleven members. It should: (1) recommend one of the three as the primary pre-registered analysis, with enough specificity that the analysis team can implement it — what is computed, in what units it is reported, and what the headline sentence of the resulting paper is and is not permitted to say; (2) say what happens to the two options not chosen, i.e. whether they are dropped or demoted to secondary and sensitivity analyses and how they are to be labelled; (3) give the strongest case for the recommendation you did *not* make in a form its defenders would recognise as their own argument rather than a version of mine; and (4) dispose in one paragraph of the hidden-moderator reply — if H fails to replicate, the authors will say our protocol omitted a feature essential to the effect — by stating a rule the committee can actually apply about when that reply shifts the burden of proof back onto them and when it is an unfalsifiable escape hatch. If you think (c) is simply a bad idea, say so and recommend (a) or (b); I would much rather be talked out of it in a memo than in the meeting.
reasoning: |-
  Hmm, the user is a statistician on a replication project committee facing a methodological debate. They've described a heated argument with a frequentist colleague about the purpose of replication studies, and now need to recommend an analysis plan for their 12-lab replication of a disputed priming effect. 

  The core tension is philosophical: should replications issue definitive verdicts (frequentist position) or quantify belief updates (Bayesian), or - as the user proposes - measure how much evidence brings opposing camps together? The user seems emotionally invested in their convergence approach (option c) but is wisely seeking external validation before Thursday's meeting. 

  Three key aspects stand out: First, the replication target (effect H) has shaky foundations - small studies, meta-analysis suggesting d=0.4 but their pilot showing 0-0.15. Second, original authors are primed to claim protocol flaws regardless of outcome. Third, the committee needs operational clarity, not just theory.

  Option a (equivalence testing) appeals to regulatory rigor but feels ill-suited for a scientifically contested effect. Option b (Bayes factors) handles uncertainty better but still frames evidence monolithically. The user's option c is innovative in focusing on resolving scientific disagreement rather than proving/disproving effects - this aligns with how science actually progresses when paradigms clash.

  The strongest objection (that evidentiary value shouldn't depend on who's arguing) is valid but overstated: pre-registering fixed priors for "enthusiast" and "skeptic" positions avoids gaming, and in polarized fields, moving consensus is precisely what matters. The convergence metrics also sidestep the hidden moderator problem by making original proponents demonstrate their claims rather than letting them veto results.

  For implementation: Recommend option c as primary with specific convergence metrics (percentage distance closed, skeptic's posterior shift in SESOI units). Demote a and b to sensitivity analyses. For hidden moderators, adopt a burden-shifting rule requiring original authors to provide positive evidence for their "essential feature" claim. The memo should present option a's error-control argument faithfully before explaining why convergence better serves this project's goal of resolving disputes.
answer: |-
  **MEMORANDUM**  
  To: Steering Committee, Replication Project H  
  From: [Your Name], Committee Statistician  
  Date: Monday, [Date]  
  Subject: Recommendation for Primary Pre-Registered Analysis  

  ---

  ### (1) Primary Analysis Recommendation: Option (c)  
  **Implementation:**  
  - **Priors:** Pre-register three priors:  
    - *Enthusiast:* Normal prior centered at meta-analytic estimate (d = 0.4), SD = 0.2.  
    - *Skeptic:* Normal prior centered at 0, SD = 0.05 (tightly concentrated).  
    - *Diffuse:* Cauchy(0, 0.3) or Normal(0, 1.0).  
  - **Computation:** For each prior, compute:  
    (i) **% Distance Closed:** Reduction in divergence between enthusiast/skeptic posteriors.  
    (ii) **Skeptic’s Posterior Shift:** Distance moved by skeptic’s posterior toward enthusiast’s prior, in units of SESOI (pre-set at d = 0.1).  
    (iii) **Convergence Sample Size:** N required for enthusiast/skeptic posteriors to fall within d = 0.05.  
  - **Headline Result:**  
    > "This replication reduced disagreement between skeptic and enthusiast positions by [X]%, with skeptic beliefs shifting [Y] SESOI units. Full convergence would require [Z] participants."  
  - **Prohibited Language:** Avoid claims like "H is true/false," "effect absent," or "replication success/failure."  

  **Rationale:** In a polarized field, evidence should be measured by its power to resolve conflict—not by binary thresholds. This quantifies progress toward consensus without declaring winners.  

  ---

  ### (2) Handling Non-Primary Options  
  - **Option (a) (Equivalence Test):**  
    Demote to **sensitivity analysis**. Label: *"Frequentist Error-Control Check."*  
    - Test TOST equivalence (bounds: d = ±0.1) at α = 0.05. Report if "equivalent," "not equivalent," or "inconclusive."  
    - **Do not feature in abstract or press release.**  
  - **Option (b) (Bayes Factor):**  
    Demote to **supplementary analysis**. Label: *"Bayesian Belief-Update Sensitivity."*  
    - Compute BF₁₀ under diffuse prior. Report robustness curve (e.g., prior SD from 0.05 to 1.0).  
    - **Include in appendix only.**  

  ---

  ### (3) Strongest Case for the Rejected Option (a)  
  *(Presented as its proponents would articulate it):*  
  > "Replications demand methodologically standardized, error-controlled verdicts to curb selective interpretation. Pre-registered equivalence tests provide a *calibrated decision*: they control Type I/II errors across the *entire portfolio* of replications, ensuring false positives/negatives are bounded in the long run. Reporting ‘inconclusive’ when data are noisy is a virtue—not a flaw—as it prevents overstatement. Belief-based approaches (options b/c) surrender to subjectivity: they let prior biases distort evidence and ignore frequency guarantees. When publishing authoritative multi-lab replications, we owe the field objective, universally interpretable decisions—not bespoke diagnostics that shift with whoever is arguing."  

  ---

  ### (4) Rule for the "Hidden Moderator" Objection  
  **Rule:** Burden shifts back to original authors *only if* they:  
  > (i) Pre-specify the "essential feature" in writing pre-data-collection, *and*  
  > (ii) Provide empirical evidence (e.g., pilot data) demonstrating its necessity for the effect.  

  Otherwise, the objection is an **unfalsifiable escape hatch** and must be dismissed. If they meet (i)–(ii), we will test the feature in a follow-up.  

  ---

  ### Why Not (c)? Addressing Your Concern  
  Your proposal is *not* a bad idea—it is the **most scientifically honest** approach for a contested effect. The "gameability" risk is mitigated by pre-registering skeptic/enthusiast priors (limiting extremism) and reporting convergence *in standard SESOI units*. The charge that evidence "depends on who is arguing" misstates the goal: we are not quantifying universal truth, but *whether this replication moves the field toward consensus*. If there are no skeptics, convergence is irrelevant—but in this case, skeptics demonstrably exist.  

  **Recommendation:** Adopt (c) as primary. It reframes replication as a tool for resolving disputes—precisely what Project H needs.  

