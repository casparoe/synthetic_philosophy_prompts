prompt: |-
  I'm drafting the privacy chapter of a report on what a hospital owes the patients whose records it releases, and I've realised I have no specification: I can't yet say what a theory of privacy would have to get right in order to be good enough for that job. Write one for me.

  Fix the purpose as institutional: the theory must let a data-holder decide whether a given practice wrongs anyone, in cases where nothing further bad happens to the person — no discrimination, no breach, no distress, because nobody ever looks.

  The cases I take to be load-bearing are these, and a theory that simply stipulates an answer to any of them is one I don't want: an idle sensor, a ward camera that records continuously and is wiped on schedule without ever being played; a sealed letter, a colleague authorised to open your file only if you go missing; the night-train stranger, to whom you tell your entire life and feel nothing lost; the inference, a shopping-pattern model that outputs a fact about you that no record anywhere states and that no one accessed any document to learn; the genetic mirror, where your sequence reveals something about your sister, who was never a patient; and the ten-thousandth viewer, where the question is whether the wrong attenuates as the audience grows.

  Sections, in this order:

  **Requirements** (~600 words). Numbered, each with the case or consideration behind it and tagged non-negotiable or negotiable. Among the things I want adjudicated rather than assumed: that the theory must say what is distinctively lost when nothing further bad follows; that it must not let privacy collapse into autonomy or into security; that it must distinguish having privacy from waiving it or not caring about it; that it must not smuggle in a fixed inventory of sensitive categories; and that it must take a position on whether an unexercised permission or an unread record is already a loss, and on whether inferred facts can be private at all.

  **Collisions** (~150 words). Which subset of your own requirements you suspect cannot be jointly satisfied, and why. If the list turns out to be impossible, that is the result I most want to see.

  **The sharpest requirement** (~120 words). The single one that excludes the most of the familiar families — control-based, access-based, reductionist, contextual-integrity.

  **Scorecard** (~150 words). A table and nothing else, scoring those four against your requirements.
reasoning: |-
  Okay, let me approach this systematically. The user is drafting a hospital privacy policy chapter and needs a theoretical framework that addresses very specific edge cases where no tangible harm occurs. This requires careful construction.

  First, I need to unpack the core challenge: defining privacy violations absent secondary harms. The user's examples like idle sensors and genetic mirrors present fascinating paradoxes - how can something be violated if no one ever knows? 

  Looking at the requirements section, I consider starting with non-negotiable principles:
  - Violations must exist independently of harm (ward camera example)
  - Privacy can't collapse into security or autonomy (genetic mirror case)
  - Distinguishing actual privacy from waived rights (night-train stranger)
  - Avoiding predefined sensitive categories
  - Clarifying status of inferred data and unused permissions

  For negotiable aspects, I ponder:
  - Whether attenuation matters (ten-thousandth viewer)
  - How to handle third-party implications
  - Whether intention affects violations

  The collision section will be tricky - I suspect the requirement for freestanding violations conflicts with theories demanding human awareness. The sharpest requirement is likely the freestanding violation principle, as it eliminates most mainstream frameworks.

  When scoring theories, contextual integrity might fare best by focusing on norms, though it struggles with unused permissions. Control-based theories fail spectacularly on multiple fronts. 

  Throughout this, I remain conscious of the hospital context - whatever framework emerges must work for real medical record decisions. The genetic mirror case especially highlights institutional responsibilities beyond individual consent.
answer: |-
  Here is a theoretical framework for institutional privacy assessment, designed specifically for your hospital context and addressing your load-bearing cases and requirements:

  **Requirements for an Institutional Privacy Theory**

  1.  **Freestanding Wrongness:** The theory must identify a distinct wrong *inherent* to the privacy violation itself, even when no secondary harm (discrimination, distress, breach consequences) materializes. *Non-negotiable.*  
      *   *Rationale (Idle Sensor/Ward Camera):* If recording/watching *itself* isn't wrongful without subsequent misuse or viewing, then the practice is permissible. But intuitively, the *act* of recording without justification feels like a violation, even if the tape is wiped unseen. The theory must explain this wrongness independently.

  2.  **Distinct from Autonomy & Security:** Privacy must be defined independently of individual choice (autonomy) and protection from harm (security). Waiver or lack of care doesn't negate the existence of privacy; a breach isn't solely a security failure. *Non-negotiable.*  
      *   *Rationale (Night-Train Stranger/Sealed Letter):* Telling secrets voluntarily doesn't mean privacy didn't exist beforehand; it was waived. A sealed letter represents a privacy boundary regardless of whether it's ever opened (security lapse). Privacy is the *condition* that can be waived or breached.

  3.  **Non-Reductionism:** Privacy cannot be reduced solely to control over information or restricted access. *Non-negotiable.*  
      *   *Rationale (Idle Sensor/Ten-Thousandth Viewer):* The sensor records *without* any human access or control being exercised. If privacy *is* control, the unexercised permission (colleague's access) might be inherently violating. Attenuation (10,000th viewer) challenges pure access/control models.

  4.  **No Fixed Sensitive Categories:** The theory must not rely on pre-defined lists of "private" information (e.g., health, finances). Sensitivity must be derivable from the theory's core principles in context. *Non-negotiable.*  
      *   *Rationale (Inference):* Inferred facts (e.g., pregnancy from shopping) might be highly sensitive yet not categorically "health" in the source data. The theory must adjudicate sensitivity based on more than labels.

  5.  **Status of Latent Information/Permission:** The theory must explicitly take a position on whether:
      *   The *mere existence* of an unaccessed record or an unexercised permission constitutes a privacy violation.
      *   Inferred facts (not recorded but knowable) can be subject to privacy claims. *Non-negotiable to require a position; the *specific* position is negotiable based on theoretical coherence.*  
      *   *Rationale (Idle Sensor/Sealed Letter/Inference):* Is the unviewed ward footage a violation? Is the sealed letter's *potential* accessibility violating? Is the inferred fact private *before* it's inferred?

  6.  **Third-Party Implications:** The theory must address whether and how actions concerning one person's data can wrong a *different* person whose information is revealed through it. *Non-negotiable.*  
      *   *Rationale (Genetic Mirror):* Sequencing Patient A inherently reveals information about Sister B (never a patient). Does the hospital wrong Sister B merely by possessing/handling A's sequence in a way that makes B's information latent?

  7.  **Attenuation:** The theory must take a position on whether the perceived wrongness or the nature of the violation changes as the number of people with potential or actual access/knowledge increases. *Negotiable.*  
      *   *Rationale (Ten-Thousandth Viewer):* Is the 10,000th person viewing a record committing the *same* wrong as the 1st? Does the initial violation diminish or change character with scale? Must the theory account for this?

  8.  **Intentionality:** The theory must clarify the role of the data-holder's *intent* (vs. capability or outcome) in defining a violation. *Negotiable.*  
      *   *Rationale (Idle Sensor vs. Authorised Access):* Does the *purpose* (safety monitoring vs. idle recording) or the *design* (access only if missing) affect whether the latent capability is violating?

  **Collisions**

  The most likely collision is between **Freestanding Wrongness (1)** and the requirement to avoid collapse into Autonomy/Security (2) or Reductionism (3). Defining a distinct, inherent wrong absent harm, control, or access is profoundly difficult. Many theories satisfying (1) risk smuggling in elements of autonomy (e.g., violation of normative expectations shaped by autonomy) or security (e.g., violation as creating a *risk* state). Satisfying (1) while strictly adhering to (2) and (3) is the core challenge and may necessitate a novel construct like "violation of constitutive informational boundaries" or "breach of contextual moral architecture."

  **The Sharpest Requirement**

  **Freestanding Wrongness (1)** is the sharpest requirement. It immediately excludes:
  *   **Harm-Based Theories:** If no harm occurs, no wrong exists (fails Idle Sensor).
  *   **Control-Based Theories:** Focus on choice/consent (violates Distinctness from Autonomy (2) and struggles with Idle Sensor/Unused Permission (5)).
  *   **Restricted Access Theories:** Require actual or intended access/knowledge (fails Idle Sensor, struggles with Unused Permission (5) and Attenuation (7)).
  *   **Reductionist Theories:** Often collapse into control or access.
  *   **Contextual Integrity (CI):** While powerful, CI typically defines violation as deviation from context-appropriate *flow* norms. An unaccessed record or unused permission might not constitute an improper "flow," potentially failing Freestanding Wrongness (1) for the Idle Sensor. CI might need significant adaptation or a novel interpretation of "flow" to encompass latent states.

  **Scorecard**

  | Requirement             | Control-Based | Access-Based | Reductionist | Contextual Integrity |
  | :---------------------- | :------------ | :----------- | :----------- | :------------------- |
  | **1. Freestanding Wrongness** | ✗ (Needs harm/choice) | ✗ (Needs access) | ✗ (Often collapses) | △ (Struggles w/ latent state) |
  | **2. Distinct (Autonomy/Sec)** | ✗ (Collapses into Autonomy) | △ (Can conflate w/ Sec) | ✗ (Often collapses) | ✓ (Defines norms distinctly) |
  | **3. Non-Reductionism**       | ✗ (Is reductionist) | ✗ (Is reductionist) | ✗ (Is reductionist) | ✓ (Holistic norms)    |
  | **4. No Fixed Categories**    | ✓             | ✓             | △ (Varies)    | ✓ (Contextual)        |
  | **5a. Latent Record Violate?**| △ (Often yes) | ✗ (Usually no) | △ (Varies)    | △ (Flow not broken?)  |
  | **5b. Inferred Facts Private?**| ✓ (If controlled) | ✗ (Not accessed) | △ (Varies)    | ✓ (If norm violation) |
  | **6. Third-Party (Genetic Mirror)** | ✗ (Focus on individual) | ✗ (Focus on access) | ✗ (Individual) | ✓ (Norms govern info type) |
  | **7. Attenuation**             | ✗             | △ (Maybe)     | ✗             | △ (Norms may scale?)  |
  | **8. Intentionality**          | ✓ (Central)   | △ (Incidental)| △             | ✓ (Purpose is key)    |

  **Key:** ✓ = Generally Satisfies, △ = Partially Satisfies/Depends, ✗ = Generally Fails

  **Conclusion for your Report:** This framework demands a theory that posits privacy as a **state of normative informational integrity relative to an entity**, where violation occurs upon the **non-consensual creation or existence of a capability/knowledge-state that transgresses contextually defined constitutive boundaries**, irrespective of subsequent use or harm. This inherently wrongs the individual(s) whose constitutive boundaries are transgressed. Contextual Integrity comes closest but requires strengthening its handling of latent states and constitutive boundaries to fully meet the sharpest requirement.
