answer: |-
  ### Translation of Statutory Interpretation to Specification Vocabulary

  The debate between textualism and purposivism maps cleanly to software specification practices, with legislatures as specification maintainers and courts as implementers. Below, I address your cases, then provide the residue report.

  ---

  ### Case A: Drafting Failure (Broken Cross-Reference)
  #### Legal Scenario  
  Penalty for subsection (c) attaches a 15-year sentence, but renumbering moved the intended offense to (e). Literal reading applies harsh penalty to minor conduct.

  #### Translation to Specification Terms  
  - **Specification**: Released version with typo (cross-reference to `§(c)`).  
  - **Reference implementation**: Reflects intended behavior (penalty tied to `§(e)`).  
  - **Commit history**: Shows renumbering error in draft commits.  
  - **Implementer reliance**: Some consumers built systems assuming `§(c)` is correct.  

  #### Camps' Positions  
  - **Textualism (Software)**:  
    Follow released spec literally. The cross-reference is `§(c)`, so apply penalty there.  
    **Why?** Maintainers shipped the version; implementers must honor it. Fix requires a patch (new legislation). Backwards compatibility trumps intent.  
    **Outcome**: Harsh penalty stands.  

  - **Purposivism (Software)**:  
    Treat the error as a "scrivener's bug." Use commit history/reference implementation to correct pointer to `§(e)`.  
    **Why?** The spec's purpose is unambiguous. Ignoring history violates maintainer intent.  
    **Outcome**: Penalty applied to `§(e)`.  

  #### Conflict in Your Terms  
  - **Core tension**: Whether to prioritize *released artifact* (textualism) or *design intent* (purposivism). Reliance on the bug forces a tradeoff: break existing implementations or violate spec purpose.  

  ---

  ### Case B: Unforeseen Technology (Notice by Mail)  
  #### Legal Scenario  
  Statute requires "first-class mail." Lender uses authenticated email (received, effective). Debtor argues form is mandatory.  

  #### Translation to Specification Terms  
  - **Specification**: Explicitly requires "first-class mail."  
  - **Design context**: Outcome of negotiation (security/compliance tradeoffs), not technical optimality.  
  - **Changed environment**: New transport (email) satisfies purpose but violates literal requirement.  

  #### Camps' Positions  
  - **Textualism (Software)**:  
    Enforce spec as written. "First-class mail" is a fixed contract; email violates interface.  
    **Why?** Implementers can't unilaterally replace negotiated terms. Change requires a version bump (legislative amendment).  
    **Outcome**: Lender non-compliant.  

  - **Purposivism (Software)**:  
    Treat "mail" as a *purpose-driven term* (reliable delivery). Authenticated email satisfies the spirit.  
    **Why?** Specs aim for outcomes, not rigid methods. "First-class mail" was a period-specific implementation detail.  
    **Outcome**: Lender compliant.  

  #### Conflict in Your Terms  
  - **Core tension**: Whether the requirement is a *deliberate constraint* (textualism) or a *means to an end* (purposivism). Negotiation history implies the former, but purposivism overrides text when purpose is met.  

  ---

  ### Residue Report: Mapping Legal Concepts  
  | Legal Concept                  | Software Counterpart                                  | Rating       | Notes |  
  |--------------------------------|-------------------------------------------------------|--------------|-------|  
  | **Textualism**                 | Literal adherence to released spec                   | Clean        | Direct parallel. Ignores history/intent. |  
  | **Purposivism**                | Prioritizing design intent (commits, reference impl) | Clean        | Uses history to resolve ambiguity. |  
  | **Reasonable reader**          | "Reasonable implementer" (domain-aware consumer)     | Clean        | How a typical engineer would read the spec. |  
  | **Ordinary meaning**           | Default interpretation (no domain-specific quirks)   | Clean        | Contrasts with "terms of art." |  
  | **Terms of art**               | Domain-specific jargon in spec                       | Clean        | E.g., "idempotent" in APIs. |  
  | **Canons of construction**     | Conventions (e.g., REST principles, RFC norms)       | Distorted    | Legal canons are more rigid; software relies on looser community norms. |  
  | **Absurdity exception**        | Overriding specs that crash systems                  | Clean        | Both allow ignoring text if outcomes are catastrophic. |  
  | **Legislative history**        | Commit messages/design docs                          | Clean        | Evidence of intent. |  
  | **Scrivener's error**          | Typos corrected via history/reference impl           | Clean        | Case A is archetypal. |  
  | **Reliance on impl details**   | Bug-for-bug compatibility                            | Clean        | Maintaining unintended behavior for consumers. |  
  | **Undefined behavior**         | Unspecified edge cases                               | Clean        | Implementers handle gaps autonomously. |  
  | **Deprecation**                | Deprecation warnings, sunsetting                     | Clean        | Phasing out old behavior. |  
  | **Backwards compatibility**    | Non-breaking changes (SemVer MINOR/PATCH)            | Clean        | Prioritize existing consumers. |  
  | **Semantic versioning**        | Legislative versions (amendments/patches)            | **No counterpart** | Law lacks systematic versioning. *Why?* Legal versions are ad hoc; SemVer assumes rational maintainers. |  

  #### Notes on Gaps  
  - **Semantic versioning**: No legal counterpart. **Cause**: Law lacks a MAJOR.MINOR.PATCH framework. *This reveals legal indeterminacy*—amendments don't signal compatibility risk.  
  - **Canons of construction**: Rating=**Distorted**. **Cause**: Legal canons are prescriptive; software conventions are descriptive. *This reflects a defect in your vocabulary* for formal rule structures.  

  #### Smuggled Assumptions  
  - **Maintainer competence**: Mapping legislatures → spec maintainers assumes good faith/competence. In law, this is contested (e.g., "public choice theory" argues laws serve interest groups, not abstract "purpose"). Your framework silently assumes specs are *well-designed*, which is the core dispute.  
  - **Working software as goal**: Law aims for justice/policy goals, not just "functioning systems." Purposivism imports values (e.g., "fairness") your vocabulary omits.  

  #### Compiler/Test Suite Role  
  - **Compiler**: Courts act as "runtime interpreters." They resolve ambiguity dynamically but can't pre-validate statutes.  
  - **Test suite**: Precedent (case law) serves as "integration tests," validating statutes against real-world scenarios. Unprovided-for cases are edge tests—courts *must* decide (no exceptions).  

  ---

  ### Residual Disagreement: Meaning vs. Repair Authority  
  The debate reduces to:  
  1. **Textualism**: The text *is* the meaning. Ambiguities require maintainers (legislature) to repair via new versions.  
  2. **Purposivism**: Meaning includes intent. Implementers (courts) may repair gaps/errors if purpose is clear.  

  #### Can Your Vocabulary Capture This?  
  Yes.  
  - **Textualism**: "The released spec is the contract. Maintainers own fixes (SemVer MAJOR bumps)."  
  - **Purposivism**: "The reference implementation and commit history define the contract. Implementers may patch bugs (MINOR bumps) to align with intent."  

  The key difference is **institutional authority**: Whether implementers can "patch" specs without maintainer involvement. Your framework expresses this via:  
  - **Consumer vs. maintainer roles**: Courts (implementers) vs. legislatures (maintainers).  
  - **Versioning control**: Who authorizes breaking changes.  

  #### Borrowed Nuance  
  Legal theory adds one layer: **democratic legitimacy**. Textualists argue courts overstep by "fixing" laws, violating separation of powers. Your vocabulary lacks this political dimension, reducing it to "maintainer vs. implementer permissions."  

  ---  
  ### Final Take  
  The translation works because both fields deal with *governance of artifacts*. Textualism mirrors strict API compliance; purposivism resembles open-source maintainership (intent over literalism). The residue—versioning, canons, political legitimacy—highlights where law is less "engineered" than software. Your framework's strength is clarifying that the core conflict is about *who gets to debug the spec*.
