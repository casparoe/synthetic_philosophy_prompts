prompt: |-
  I work as the quantitative lead at a small forecasting platform, and six months ago we started running model-based forecasters alongside our human panel, so the question of how to score a forecaster has stopped being academic for me. We currently report Brier and log scores side by side on a leaderboard, and they disagree about who is best: log lavishes reward on the forecaster who was confidently right and effectively destroys the one who was confidently wrong, while Brier is gentler and, according to my colleague, lets a cautious forecaster sit near the middle of the scale and look respectable. I have a decision meeting in a fortnight and have to recommend one number, which will then be used both to rank forecasters publicly and to pay out prizes, so it is simultaneously a measurement and an incentive. I started reading around and found the accuracy-first epistemology literature, which is clearly the right neighbourhood, but it seems mostly aimed at showing that incoherent credences are accuracy-dominated or that conditionalization maximizes expected accuracy, rather than at what I need. So before I choose, I want the specification. By an epistemic utility measure I mean: a function that takes a credence function over some partition of possibilities and a world, and returns how far off that credence function is at that world, lower being better, with the expectation of that quantity taken relative to the agent's own credences when we talk about expected inaccuracy. Write me the desiderata such a measure has to meet to be adequate for my purpose, with the case or consideration behind each.

  Here are the cases and constraints I keep circling, to be organized, corrected, or thrown out rather than simply echoed back: our forecasters are scored on many questions at once and ranked by a single number, so whatever we use has to aggregate across questions and across forecasters who answered different subsets. A forecaster who says 0.99 and is wrong has to come out worse than one who says 0.6 and is wrong, but I am not sure how much worse, and I want to know what the right principle is for settling that. A forecaster who never leaves 0.5 on any binary question should not be able to win, and I want to know whether that is a requirement on the measure or a happy consequence of some other requirement. We do occasionally catch forecasters holding jointly incoherent sets of credences, and I would like the score to have something to say about that rather than scoring each question in isolation. We run conditional forecasts, where someone forecasts an outcome given an antecedent that then fails to occur, and we run long-range questions that never resolve, or that resolve in a way some forecasters call half true because the resolution criteria turned out ambiguous; I need to know what a measure owes me in those cases. We have had the same target event carved up at different levels of fineness in different tournaments, and I do not know whether the score ought to be indifferent to how finely the outcome space is partitioned or whether some sensitivity there is correct. And because the number is now also a training signal for the model forecasters, I care about whether a measure that gives honest reporting the best expected score is automatically a good objective to optimize, or whether that is a separate desideratum in its own right.

  Two further things matter more to me than the scoring of particular rules. First, I want to know which of these demands are genuine requirements on a measure of epistemic value and which are prejudices of one camp: whether strict propriety, for instance, is really a constraint on epistemic goodness or only a cleverly disguised practical demand about eliciting honest reports; whether rewarding informativeness or resolution independently of accuracy is a defect or a feature; whether boundedness is a substantive epistemological commitment or an artifact of not wanting one catastrophic forecast to swamp a track record. Second, I suspect some subset of the desiderata cannot be jointly satisfied — that strict propriety pulls against, say, additivity across questions, or against insensitivity to how the outcome space is carved, or against some natural requirement about closeness to the truth for non-atomic propositions — and I want those incompatibilities flagged explicitly, with the reason each pair cannot both hold, since if the list is jointly unsatisfiable that is itself the answer to my question. Tell me which single requirement knocks out the most candidate measures, and mark which are non-negotiable given that the number must rank forecasters, pay them, and train them. A sentence or two each on the Brier, log, and spherical rules is plenty; the list is what I am paying for.
reasoning: |-
  We are going to define desiderata for an epistemic utility measure for the purpose of ranking forecasters, paying prizes, and training models. The measure is a function that takes a credence function over a partition and a world, and returns a loss (inaccuracy), with lower being better. We are aggregating over many questions and forecasters who may have answered different subsets. We also have special cases: conditional forecasts, unresolved or ambiguous resolutions, and different levels of fineness in partitioning.

  We'll organize the desiderata, correct misconceptions, and note incompatibilities. We'll also address the two main concerns: which demands are genuine requirements and which are prejudices, and which sets of desiderata are incompatible.

  Let's list the desiderata:

  1. **Truth-Directedness (Monotonicity):** If one credence function is uniformly closer to the truth values (0 or 1) than another in every proposition, then it should be strictly more accurate. This ensures that moving credences toward the truth improves the score and away worsens it. This is fundamental for any measure of accuracy.

  2. **Propriety (Strictly Proper):** The measure should be strictly proper. This means that for any probability function, the expected inaccuracy (with respect to that probability function) is minimized when the forecaster reports that probability function. This has two roles:
     - It encourages honest reporting because any misreporting leads to a higher expected inaccuracy (from the forecaster's own perspective).
     - It avoids the issue of a forecaster being able to "hedge" by reporting something other than their true belief to gain a better score in expectation.

     However, note that propriety is sometimes challenged as being more about incentives (elicitation) than pure epistemology. But for your purpose (incentivizing honest reporting and using the score for training) it is crucial.

  3. **Extensionality (Independence of Labeling):** The score should depend only on the credences assigned to the actual outcomes and not on the labels of the possibilities. This is a basic requirement for any sensible measure.

  4. **Additivity (Separability) across Questions:** The overall inaccuracy for a set of questions is the sum of the inaccuracies for each question. This is necessary for aggregation over multiple questions. Without additivity, the score might not be decomposable and might not allow for fair aggregation when forecasters answer different subsets. However, note that additivity is not always compatible with other desiderata (like partition invariance).

  5. **Partition Invariance (Invariance under Refinement):** The score should be invariant under how the outcome space is partitioned. That is, if we have a coarser partition (e.g., just {A, not A}) and a finer partition (e.g., {A and B, A and not B, not A}), then the score for the same event should be the same regardless of the partition. This is important because you have the same event carved up differently in different tournaments. However, note that this is a strong requirement and may conflict with additivity and propriety.

  6. **Boundedness:** The inaccuracy score should be bounded. This prevents one catastrophic forecast (e.g., assigning 0 to a true event) from dominating the entire track record. This is particularly important for your leaderboard and for training (to avoid one bad forecast overwhelming the signal). However, note that the logarithmic score is unbounded below (when a forecaster assigns 1 to a true event) and unbounded above (when a forecaster assigns 0 to a true event). The Brier score is bounded.

  7. **Handling Conditional Forecasts:** For conditional forecasts (e.g., P(B|A)), if the antecedent A does not occur, then the forecast should be ignored (or not penalized). This is because the conditional forecast is only about what happens if A occurs. The standard approach is to use a scoring rule that is only defined when A occurs, or to have a neutral score (like 0) when A does not occur. Alternatively, one can use a rule that integrates the conditional forecast into the joint distribution and then scores appropriately. But for aggregation, we need a clear rule.

  8. **Handling Unresolved or Ambiguous Questions:** For questions that never resolve or resolve ambiguously, we must decide how to score. One option is to exclude them. Another is to use a scoring rule that can handle partial resolutions (e.g., when the outcome is a set of possibilities). However, this is complex and might require a different framework (like scoring with respect to a set of worlds). This is an open issue and might require a practical decision (like dropping such questions).

  9. **Coherence Incentive:** The score should discourage incoherent sets of credences. For example, if a forecaster assigns P(A) = 0.6, P(not A) = 0.5, then this is incoherent. The score should be such that the expected inaccuracy for an incoherent set is dominated by some coherent set. This is achieved by using a strictly proper scoring rule that is defined for the entire credence function and that is additive over the partition (if we require additivity). However, note that if we score each question in isolation, then incoherence might not be penalized. Therefore, we must require that the score is computed over a full partition (or at least a set of propositions that form a basis) and that the scoring rule is strictly proper for the entire vector.

  10. **Informativeness/Reward for Resolution:** The score should reward more informative (sharper) forecasts when they are correct. However, there is a trade-off: a forecaster who is always 0.5 (on binary questions) should not win, but a forecaster who is too sharp and wrong should be penalized heavily. The logarithmic score is very sensitive to sharpness (it heavily rewards confident correct forecasts and heavily penalizes confident wrong ones). The Brier score is less sensitive. This is a matter of degree and might be a design choice.

  Now, let's address the two main concerns:

  **Which demands are genuine requirements and which are prejudices?**
  - Strict propriety: This is both an epistemological requirement (it aligns with the idea that one's own credences are the best from one's own perspective) and a practical demand (for elicitation and training). Given that you use the score for training and incentives, strict propriety is non-negotiable. Without it, forecasters might be incentivized to lie about their true beliefs.
  - Boundedness: This is more of a practical concern. Epistemologically, extreme errors (assigning 0 to a truth) should be severely penalized. However, for a track record, unbounded penalties can lead to a single mistake dominating. This is a trade-off and might be considered a practical requirement for your context.
  - Partition invariance: This is a requirement for the score to be independent of the representation of the same underlying uncertainty. However, it is known that no strictly proper scoring rule can be both additive and partition invariant (see below). So this might be a desideratum that you have to relax.

  **Incompatibilities:**
  - **Additivity and Partition Invariance:** These two are incompatible. If we require that the score is additive (over a set of questions that are independent) and also that the score for an event does not depend on how the rest of the space is partitioned, then we run into problems. In fact, it is known that the only additive and partition-invariant scoring rule is the logarithmic score (but note: the logarithmic score is not partition invariant in the sense of being invariant under refinements? Actually, the logarithmic score is additive and satisfies a form of partition invariance only if we take the entire partition. However, if we have two different partitions for the same event, the score for the event might change if we change the rest of the partition. Actually, the logarithmic score is not partition invariant in the desired way. The Brier score is additive but not partition invariant.) There is a known result: under certain conditions, the only additive, strictly proper, and partition invariant scoring rule is the logarithmic score. But note: partition invariance is a very strong condition and is not satisfied by the logarithmic score when we consider refinements. For example, consider a binary event A and not A. The log score for A when it happens is -log(p). Now, if we split not A into B and C, then the same event A is now part of a three-element partition. The log score for A is still -log(p), but the overall score for the partition would include the other events. However, if we are only scoring the event A, then the score for A is the same. But if we are scoring the entire distribution, then the score changes because the forecaster must assign probabilities to B and C. This is a complex issue. In fact, it is known that there is no strictly proper scoring rule that is both additive and partition invariant (in the sense that the score for an event is independent of the partition in which it is embedded). Therefore, we must choose between additivity and partition invariance. Given that you need to aggregate over questions (which may be from different partitions) and that forecasters answer different subsets, additivity is essential. Therefore, we may have to give up partition invariance.

  - **Propriety and Additivity:** These are compatible. Both the Brier and log scores are additive and strictly proper.

  - **Propriety and Boundedness:** These are compatible. The Brier score is bounded and strictly proper. The log score is strictly proper but unbounded.

  Now, let's consider the requirement that a forecaster who always says 0.5 should not win. This is a consequence of strict propriety and truth-directedness. If a forecaster always reports 0.5, then their expected score (if they are calibrated) is the same for every event. But a forecaster who is more accurate (i.e., who assigns higher credence to truths and lower to falsehoods) will have a better score. So a forecaster who is always 0.5 will be beaten by one who is more accurate.

  **Handling Conditional Forecasts:**
  We can use the approach of only scoring when the antecedent occurs. For example, for a conditional forecast P(B|A), we wait until we see if A occurs. If A does not occur, we skip. If A occurs, then we score P(B|A) as if it were P(B) in the world where A is true. This is standard.

  **Handling Unresolved or Ambiguous Questions:**
  We must decide on a policy. One option is to exclude them. Another is to use a scoring rule that can handle imprecise outcomes (like the set of possible outcomes). But this is complex and not standard. Given that you have a platform, it might be best to exclude such questions or have a fixed rule (e.g., assign the outcome to a special category and score as if it were a new outcome). However, this is an open issue and not directly about the scoring rule.

  **Coherence Incentive:**
  If we require that the score is computed over a full partition and is additive and strictly proper, then incoherent forecasts will be accuracy-dominated by coherent ones. However, if forecasters are scored on arbitrary subsets of questions, then we might not capture incoherence. Therefore, we should require that when a set of questions forms a partition, they are scored together. Otherwise, incoherence might go undetected. But if we are only scoring individual questions, then we cannot enforce coherence. This suggests that we should group questions that form a partition and score the entire vector for that partition. But in practice, you might have many unrelated questions. So this is a challenge. One solution is to use a scoring rule that is strictly proper for the entire joint distribution and then aggregate over all questions. But if forecasters answer different subsets, we cannot do that. Therefore, we must rely on the fact that for individual binary questions, the scoring rule is strictly proper, but that does not penalize incoherence across different questions. This is a limitation of the additive approach.

  **Which single requirement knocks out the most candidate measures?**
  Partition invariance is very strong and knocks out almost all measures. In fact, there is no strictly proper scoring rule that is both additive and partition invariant in the desired sense (i.e., the score for an event is independent of the partition). Therefore, we must drop partition invariance.

  **Non-negotiable requirements:**
  1. **Strict Propriety:** Because we use the score for incentives and training. Without it, we might train models to report dishonest probabilities.
  2. **Additivity:** Because we need to aggregate over many questions and forecasters answer different subsets. Without additivity, aggregation is arbitrary.
  3. **Truth-Directedness:** Fundamental for any accuracy measure.
  4. **Extensionality:** Obvious.
  5. **Handling Conditional Forecasts:** We must have a rule that ignores conditionals when the antecedent is false.

  Boundedness is negotiable: we can choose a bounded rule (like Brier) to avoid catastrophic penalties.

  **Recommendation:**
  Given the above, we have two leading candidates: the Brier score and the logarithmic score.

  - **Brier Score (for a binary event):** (1 - p)^2 for the true outcome (if 1) and (0 - p)^2 for the false outcome (if 0). For multiple events, it is the sum of squares. It is strictly proper, additive, bounded, and truth-directed. However, it is not partition invariant and does not penalize incoherence across questions (if scored per question). It is gentler on extreme errors than the log score.

  - **Logarithmic Score:** -log(p) for the true outcome. It is strictly proper, additive, and truth-directed. It is unbounded, which means that a single extreme error can dominate the entire track record. It heavily rewards confident correct forecasts and heavily penalizes confident wrong ones.

  Given that you are paying prizes and training models, the unboundedness of the log score might be problematic. One extreme error (e.g., assigning 0 to a true event) would make the entire track record very bad, and the forecaster might never recover. The Brier score is more forgiving and bounded (between 0 and 2 for a binary event). Also, the Brier score is less sensitive to extreme confidence. Therefore, for a public leaderboard and for training, I recommend the Brier score.

  However, note that the logarithmic score has the advantage of being local (it only depends on the probability assigned to the actual outcome) and it is the only additive and strictly proper score that is local (by a theorem). But the Brier score is not local (it depends on the probabilities assigned to all outcomes). In practice, for binary events, they are both local in the sense that for a binary event, the Brier score for the event and its complement are linked.

  Given your description that the log score "destroys" the forecaster who is confidently wrong, and you want to avoid that for a track record, the Brier score is preferable.

  **Summary of Desiderata:**

  1. **Truth-Directedness:** Required. Any adequate measure must satisfy this.
  2. **Strict Propriety:** Non-negotiable for incentives and training.
  3. **Extensionality:** Required.
  4. **Additivity across Questions:** Non-negotiable for aggregation over different subsets.
  5. **Partition Invariance:** Dropped because incompatible with additivity and strict propriety.
  6. **Boundedness:** Recommended for practical reasons (to avoid one mistake dominating the track record) but not an absolute requirement of epistemology. We choose a bounded rule (Brier) for this reason.
  7. **Conditional Forecasts:** We will score conditionals only when the antecedent occurs, using the same rule (Brier or log) for the conditional probability as if it were an unconditional probability in the restricted world.
  8. **Unresolved or Ambiguous Questions:** Exclude them from the score. (Practical policy, not a desideratum on the measure.)
  9. **Coherence Incentive:** We cannot fully enforce coherence when scoring isolated questions. We must rely on scoring full partitions when possible, but in practice, we aggregate additively over questions. This is a limitation.

  Given the above, the **Brier score** is recommended because it is strictly proper, additive, bounded, and truth-directed. It is also continuous and less sensitive to extreme errors than the log score.

  **Final Note on Training:** Since the Brier score is strictly proper, it is a proper objective to optimize for honest reporting. Therefore, it is suitable for training the model forecasters.
answer: |-
  Below, I present a structured list of desiderata for an epistemic utility measure tailored to your use case: ranking forecasters, paying prizes, and training models. Each desideratum is grounded in your requirements, with explicit justifications, cases, and considerations. I then address your two core concerns—distinguishing genuine requirements from "camp prejudices" and identifying incompatibilities—followed by recommendations. The desiderata are ordered by priority, with non-negotiables marked.

  ---

  ### **Desiderata for the Epistemic Utility Measure**
  1. **Strict Propriety**  
     *Requirement*: The measure must be strictly proper.  
     *Case/Justification*: Ensures that a forecaster's expected inaccuracy is minimized only when they report their true credences. This is non-negotiable because your measure serves as an incentive: without strict propriety, forecasters could "game" the system by misreporting beliefs to exploit the scoring rule (e.g., a cautious forecaster might inflate confidence to chase bonuses). Also critical for model training, as it guarantees that optimizing the score aligns with honest belief reporting.  
     *Non-negotiable*: Yes—central to elicitation and training.

  2. **Additivity across Questions**  
     *Requirement*: The total inaccuracy for a set of forecasts must be the sum of inaccuracies for individual questions.  
     *Case/Justification*: You aggregate scores across many questions and forecasters who answer different subsets. Additivity ensures fairness in ranking: a forecaster’s score is simply the sum of their question-level scores, allowing comparisons even with partial participation. Without additivity, complex normalization would be needed, introducing arbitrariness (e.g., a forecaster with 100 questions vs. 10 could be penalized disproportionately).  
     *Non-negotiable*: Yes—practical necessity for aggregation.

  3. **Truth-Directedness**  
     *Requirement*: If credence assignment $c_i$ is uniformly closer to the truth values (0 or 1) than $c_j$ across all propositions, then $c_i$ must have strictly lower inaccuracy.  
     *Case/Justification*: Ensures that moving credences toward truth strictly improves scores. A forecaster assigning 0.99 to a false outcome must be penalized more than one assigning 0.6 (as they were "farther from truth"), while a correct 0.99 must be rewarded more than a correct 0.6. This prevents a "cautious" forecaster (e.g., always 0.5) from winning by default—they lose to anyone more accurate.  
     *Non-negotiable*: Yes—foundational for accuracy.

  4. **Boundedness**  
     *Requirement*: Inaccuracy scores must be bounded (i.e., no infinite penalties).  
     *Case/Justification*: Avoids one catastrophic forecast (e.g., assigning 0 to a true event) from swamping a track record. Unbounded measures (like log score) make recovery impossible—a single extreme error could permanently sink a forecaster, discouraging participation. Boundedness is practical for leaderboards and payouts, as it ensures scores reflect long-term performance.  
     *Non-negotiable*: Contextual—epistemologically optional (extreme errors *should* hurt), but required for your incentives to avoid distorted rankings.

  5. **Extensionality**  
     *Requirement*: Scores depend only on credences assigned to actual outcomes, not on labels or structure of the partition.  
     *Case/Justification*: Ensures consistency when the same event is carved up differently (e.g., "A" vs. "A and B" vs. "A and not B"). Without this, forecasters could be penalized arbitrarily based on how questions are framed.  
     *Non-negotiable*: Yes—prevents framing biases.

  6. **Neutrality for Non-Occurring Antecedents (Conditionals)**  
     *Requirement*: If a conditional forecast (e.g., $P(B|A)$) has a false antecedent ($A$ does not occur), it contributes zero to inaccuracy.  
     *Case/Justification*: Conditional forecasts are irrelevant when antecedents fail (e.g., "If it rains, P(parcel delayed) = 0.8" is moot if it doesn’t rain). Scoring them would unfairly penalize forecasters for unused predictions.  
     *Non-negotiable*: Yes—fairness for conditional questions.

  7. **Coherence Incentive**  
     *Requirement*: The measure must penalize global incoherence (e.g., $P(A) + P(\neg A) \neq 1$ across forecasts).  
     *Case/Justification*: You encounter forecasters with jointly incoherent credences (e.g., assigning $P(A) = 0.7$ and $P(\neg A) = 0.4$). Scoring should discourage this by making incoherent forecasts strictly accuracy-dominated by coherent ones. This requires scoring the *joint* credence function over a partition, not isolated questions.  
     *Non-negotiable*: Ideal but not absolute—relies on forecasters answering related questions.

  8. **Partition Invariance**  
     *Requirement*: Scores for an event should not depend on how finely the possibility space is partitioned.  
     *Case/Justification*: You have the same target (e.g., "election outcome") partitioned differently across tournaments (e.g., binary vs. candidate-level). Invariance ensures fair comparisons: a forecaster shouldn’t gain/lose points based on granularity.  
     *Non-negotiable*: No—conflicts with additivity and strict propriety (see incompatibilities).

  9. **Robustness to Ambiguity/Non-Resolution**  
     *Requirement*: For unresolved or ambiguously resolved questions, the measure should assign neutral inaccuracy (e.g., 0).  
     *Case/Justification*: Long-range or ambiguous questions (e.g., "Half-true" outcomes) lack clear truth values. Including them in scoring adds noise, so they should be excluded or nullified.  
     *Non-negotiable*: Practical necessity—handle via policy, not the measure itself.

  ---

  ### **Addressing Core Concerns**
  #### **Genuine Requirements vs. "Camp Prejudices"**
  - **Strict Propriety**: Genuine requirement, not just practical. It ensures accuracy-first epistemology: incoherent or non-truth-directed credences are *accuracy-dominated*. Practical incentives (eliciting honesty) are a consequence, not the driver.  
  - **Rewarding Informativeness**: Feature, not defect. Truth-directedness demands that confident correct forecasts (e.g., 0.99 right) score better than hesitant ones (e.g., 0.6 right). This is epistemological: credences *should* reflect strength of belief.  
  - **Boundedness**: Largely practical, not epistemological. Epistemology permits unbounded penalties for egregious errors (e.g., log score), but boundedness prevents leaderboard distortion and encourages participation.  
  - **Additivity**: Practical necessity for aggregation, not inherently epistemological. Epistemology cares about local accuracy, but your use case requires cross-question comparisons.

  #### **Incompatibilities**
  1. **Additivity + Partition Invariance → Impossible**  
     - *Reason*: Additivity requires summing question-level scores. Partition invariance demands that scores for an event (e.g., "A") are identical whether it is binary (A/¬A) or part of a finer partition (A/B/C). But only logarithmic-like rules satisfy invariance, and they violate additivity when questions are independent. **Verdict**: Partition invariance must be dropped—additivity is non-negotiable for you.

  2. **Strict Propriety + Coherence Incentive + Isolation → Tension**  
     - *Reason*: Strict propriety and coherence incentives require scoring the *joint* credence function over a partition. But if forecasters answer isolated questions (no common partition), coherence cannot be assessed. **Verdict**: For you, this is a limitation—score questions additively but group related ones (e.g., "A" and "¬A") to penalize incoherence locally.

  3. **Boundedness + Truth-Directedness → Limits Penalty Sensitivity**  
     - *Reason*: Boundedness (e.g., Brier) caps penalties for extreme errors (0 assigned to truth), while truth-directedness demands they hurt more than moderate errors. This is a trade-off: boundedness softens penalties for practical reasons, but truth-directedness still holds.

  **Most Exclusionary Requirement**: **Partition invariance** eliminates all candidates except logarithmic-like rules, but these conflict with additivity and boundedness. **Additivity** eliminates non-separable rules (e.g., spherical score).

  ---

  ### **Assessment of Candidate Measures**
  - **Brier Score (Quadratic)**:  
    Strictly proper, additive, truth-directed, bounded (0–2), and extensional. *Fails partition invariance*: scores change with finer partitions (e.g., binary vs. trinary). Gentler on extreme errors than log score—optimal for your incentives.  
  - **Logarithmic Score**:  
    Strictly proper, additive, truth-directed, and extensional. *Unbounded*: extreme errors (e.g., 0 on truth) cause catastrophic penalties, distorting leaderboards. *Fails partition invariance* and coherence incentives for isolated questions. Over-rewards sharpness for training.  
  - **Spherical Score**:  
    Strictly proper, bounded, and truth-directed. *Fails additivity*: not separable across questions, making aggregation arbitrary. Impractical for your use case.

  ---

  ### **Recommendation**
  **Adopt the Brier score**. It satisfies all non-negotiables:  
  - Strictly proper → Ensures honest reporting and training.  
  - Additive → Enables fair aggregation across questions/forecasters.  
  - Truth-directed → Rewards accuracy and punishes overconfidence.  
  - Bounded → Prevents single errors from dominating rankings.  
  - Extensional and handles conditionals → Fair and consistent.  

  **Why not log score?** Unboundedness makes it unsuitable for leaderboards and payouts—one extreme error could invalidate a season of work. **Why not spherical?** Non-additivity breaks aggregation. **Addressing coherence**: Group related questions (e.g., $P(A)$ and $P(\neg A)$) into joint forecasts when possible; score them as a single partition to disincentivize incoherence. For unresolved/ambiguous questions, exclude them from scoring. 

  **Final Note**: Brier’s gentleness on extreme errors is a virtue for incentives—it encourages forecasters to take calibrated risks without fear of irrecoverable losses, while still rewarding accuracy decisively.
