answer: |-
  Below is a comprehensive design for your seminar session, structured to meet your goals and constraints. I'll address each phase, debrief, potential pitfalls, and a stripped-down version for your condo board. The core insight is that individually coherent commitments (behaving as if they assign consistent probabilities) can lead to collectively exploitable positions through Dutch book arguments, without the house needing special information. The session makes this visceral by having students experience a guaranteed loss through trading.

  ### **Phase One: Individuals**
  **Objective:** Students experience personal vulnerability due to inconsistent price assignments (violating probability axioms).

  **Setup:**
  - **Bag Composition:** 30 balls (10 red, 10 blue, 10 green). Seal the composition in an envelope and do not reveal it. Emphasize that prices should reflect personal confidence, not guesses about the bag.
  - **Tickets & Payouts:** Each ticket pays 100 points if the drawn ball matches the condition. Use six tickets:
    - Single-color: Red, Blue, Green.
    - Two-color: Red or Blue, Red or Green, Blue or Green.
  - **Pricing:** Each student writes a single price (no spreads) for each ticket, representing what they’d pay to buy or accept to sell it. Stress: "This is about your personal valuation, not predicting the bag."

  **Price Schedule and House Strategy:**
  - **House Trading Rule:** For each student, the house computes a Dutch book based solely on their prices. The house will:
    - **Sell** a ticket to the student if their buy price is above the "fair" probability-derived price.
    - **Buy** a ticket from the student if their sell price is below the "fair" price.
  - **Exploit Inconsistencies:** Common exploits include:
    - If a student’s price for a two-color ticket (e.g., Red or Blue) exceeds the sum of their single-color prices (Red + Blue), the house sells the two-color ticket and buys the singles.
    - If a student’s single-color prices sum to >100, the house buys all three singles.
    - *Example Trade Sequence*: For a student with prices: Red=40, Blue=40, Green=40, Red or Blue=85. House buys Red at 40 and Blue at 40 (student receives 80), then sells Red or Blue at 85 (student pays 85). Net cash: -5. Obligations: Student must pay 100 if Red or Blue is drawn, but house pays 100 if Red or Blue is drawn. Outcome is fixed at -5 loss regardless of draw.

  **Trading Process to Hide the Package:**
  - **Brokers:** Assign 3 students as brokers (rotate roles if needed). Each broker handles two tickets:
    - Broker 1: Red and Red or Blue.
    - Broker 2: Blue and Blue or Green.
    - Broker 3: Green and Red or Green.
  - **Order:** Brokers approach each student sequentially (order: 1, 2, 3). Each broker:
    - Sees only the student’s prices for their two tickets.
    - Executes a pre-assigned trade (determined by the professor after reviewing all six prices) for one of their tickets. The professor calculates the Dutch book trades privately without the bag composition.
  - **Ledger Settlement:** After trades, students calculate net cash flow and obligations. They then compute outcomes for all three colors (e.g., "If red: cash + payouts from sold tickets - payouts for bought tickets"). They discover the outcome is identical (and negative) for every color. *Example:* Net loss of 5 points in all cases.
  - **The Anticlimax:** Draw a ball anyway. Highlight that the loss was certain before the draw, making the draw irrelevant. This reveals the exploit.

  **Why This Works:** Students see their prices created a "hole" in their ledger. The house used no bag knowledge—only their prices.

  ### **Phase Two: Committees**
  **Objective:** Committees experience collective vulnerability—coherent individuals produce incoherent group prices via majority vote.

  **Setup:**
  - **Committees:** Form groups of three. Each member gets a private card with internally consistent prices for the three single-color tickets (summing to 100). Use these cards:
    - Card A: Red=60, Blue=20, Green=20
    - Card B: Red=20, Blue=60, Green=20
    - Card C: Red=20, Blue=20, Green=60
  - **Voting Rule:** For each trade, members vote by secret ballot. Trade passes if majority (≥2) votes yes. No deliberation.
  - **Trades:** House proposes buying one single-color ticket at a time at fixed prices (all trades executed):
    - Buy a Red ticket for 20 points.
    - Buy a Blue ticket for 20 points.
    - Buy a Green ticket for 20 points.

  **Voting and Exploit Arithmetic:**
  - **Voting Outcomes:**
    - Red trade (20 points): Card A votes no (needs ≥60), Cards B and C vote yes (20≥20). **Passes 2-1.**
    - Blue trade (20 points): Card B votes no, Cards A and C vote yes. **Passes 2-1.**
    - Green trade (20 points): Card C votes no, Cards A and B vote yes. **Passes 2-1.**
  - **Committee Ledger:**
    - Cash received: 20 (Red) + 20 (Blue) + 20 (Green) = 60 points.
    - Obligations: Must pay 100 points per drawn color (e.g., if red, pay 100 for Red ticket).
    - Outcome: 
      - If red: -100 (for Red) + 0 (no other payouts) + cash (60) = **-40**.
      - If blue: -100 + 60 = **-40**.
      - If green: -100 + 60 = **-40**.
    - **Loss of 40 points guaranteed.**
  - **Private Objections:** Each member opposed one trade:
    - A opposed Red, B opposed Blue, C opposed Green. No member voted yes to all three.

  **Scaling to Five-Person Committees:**
  - With five members, vulnerability is harder to spot. Use these cards:
    - Card 1: Red=50, Blue=30, Green=20
    - Card 2: Red=50, Blue=20, Green=30
    - Card 3: Red=30, Blue=50, Green=20
    - Card 4: Red=30, Blue=20, Green=50
    - Card 5: Red=20, Blue=30, Green=50
  - **Trades:** House buys each single-color ticket for 30 points.
  - **Voting:** 
    - Red trade (30): Cards 3,4,5 vote yes (30≥30,30,20); Cards 1,2 vote no (50>30). **Passes 3-2.**
    - Blue trade (30): Cards 1,4,5 vote yes; Cards 2,3 vote no. **Passes 3-2.**
    - Green trade (30): Cards 1,2,3 vote yes; Cards 4,5 vote no. **Passes 3-2.**
  - **Outcome:** Cash=90 (30×3). Pay 100 per draw. Loss=10 in all states. No member voted yes to all three (e.g., Card 1 voted no on Blue and Green).

  ### **Phase Three: Repair**
  **Objective:** Committees try to fix their position but are re-exploited, showing the vulnerability is structural.

  **Rounds:**
  1. **Initial Loss Reveal:** Tell committees their position loses 40 points (or 10 for five-person) no matter what. Invite them to "repair" by:
     - Changing private prices (reassign cards, but maintain individual coherence; e.g., Card A: Red=50, Blue=30, Green=20).
     - Changing decision rules (e.g., unanimity, averaging, median votes).
  2. **Round 1: New Trades Under New Rules**
     - *If they switch to averaging:* House sells a Red or Blue or Green ticket (pays 100 for any color) for 110 points. 
       - Under averaging, group price for this ticket is 100 (since individual prices sum to 100). They buy if asked price (110) ≤ average (100)? **No trade.** But if they misinterpret and buy, loss=10.
     - *If they switch to unanimity:* House offers to buy a Red ticket for 25 points. Card A (Red=60) votes no, so trade fails. **No exploit yet.**
     - *If they keep majority or switch to median:* House proposes original trades again (buy singles for 20). With new prices, recalculate to ensure exploit (e.g., if new Card A: Red=50, Blue=30, Green=20, set buy price for Red at 30 to pass majority). Loss recurs.
  3. **Round 2: Buyout and Re-Exploit**
     - **Buyout Offer:** House offers to cancel all obligations for 30 points (net loss reduced to 10 for three-person, or to 0 for five-person if initial loss was 10).
     - **Re-Exploit:** After buyout, house proposes new trades:
       - Sell a compound ticket (e.g., "Not Green," paying 100 if Red or Blue) for 80 points.
       - Under majority voting, Cards A and B (high on Red/Blue) vote yes. If passed, loss is 80 - 100 = -20 if Red/Blue, or -80 if Green—still exploitable if prices are inconsistent.
  4. **Debrief Spark:** Ask committees, "What rule would make you immune?" Guide them to see:
     - **Immunity requires coherent group prices** (summing to 100 for mutually exclusive events).
     - **Trade-offs:** 
       - Averaging preserves coherence but ignores minority views. 
       - Majority voting on per-ticket trades creates incoherence. 
       - Unanimity prevents exploits but may lead to gridlock (no trades).

  ### **Debrief**
  **Mapping to Core Ideas:**
  - **Phase One Exploit:** When a student sees their ledger is negative in all outcomes, reveal this as "violating probability axioms allows a sure loss." Tie to personal inconsistency.
  - **Phase Two Exploit:** Committees discovering their loss shows "group aggregation (majority) of coherent individuals creates incoherence."
  - **The Anticlimactic Draw:** Highlights "loss was certain before uncertainty resolved—commitments were the flaw."
  - **House's Ignorance:** When drawing the ball, note: "The house never opened the bag envelope. Your prices alone created this."
  - **Condominium Link:** "Like your condo votes, item-by-item majority decisions can yield a package no one supports."

  **Predictable Problems and Fixes:**
  1. **Students give a spread (e.g., bid-ask):** Require a single price. Frame it: "In condo votes, you vote yes/no—give your break-even price."
  2. **Students guess the bag:** Emphasize in instructions: "Prices are about your confidence, not the bag. If you had perfect confidence in red, you’d price Red at 100."
  3. **Someone works out the trick early:** If a student warns others, say: "Yes, consistency prevents this. But many smart people are inconsistent—let’s see if you avoid it."
  4. **Non-traders or point-indifference:** Acknowledge: "Not trading avoids vulnerability, but in collective action (like condos), abstention isn’t always feasible or responsible." For point-indifference, use a small prize (e.g., candy) for high scorers.

  **Assumptions and Fixes:**
  - **Risk Neutrality & Linear Utility:** Assumed in using prices as probabilities. If stakes are high, risk aversion distorts prices. *Fix:* Use small points (no real loss) to approximate risk neutrality.
  - **Stakes Size:** If points feel trivial, students might not engage. *Fix:* Add a "real" edge (e.g., top scorer gets a book).

  **What the Session Cannot Deliver:**
  - **No Broad Irrationality Claim:** It shows vulnerability to sure loss, not that individuals are "irrational" in a descriptive sense (they may accept the risk). You must clarify this.
  - **No Dynamic Consistency:** The exercise is static. You must add that real-world exploitation often relies on changing commitments over time (e.g., time-inconsistency in voting).
  - **No Utilities/Preferences:** It assumes prices reflect beliefs, not state-dependent utilities. You must note that preferences (e.g., loving red) can distort prices.

  ### **Stripped-Down Condo Board Version (20 Minutes)**
  **Setup:**
  - **Context:** Over wine, say: "Let’s simulate how our votes create unintended packages."
  - **Game:** Use the committee phase (no bag needed). Assign each owner a private card:
    - Owner 1: Issue A=60, B=20, C=20
    - Owner 2: A=20, B=60, C=20
    - Owner 3: A=20, B=20, C=60
    - (Scale for seven: Duplicate cards 1-3 and add one coherent card, e.g., A=34, B=33, C=33.)
  - **Voting:** Per yes/no item (e.g., "Spend $X on Issue A"), majority rule.
  - **Trades:** Propose "buying" each issue (e.g., "Commit to A for $20 savings"). Vote per issue.
  - **Outcome:** All three "trades" pass. Group saves $60 but must "pay" $100 for whichever issue arises. Net loss of $40. Reveal: "No one would accept this package upfront."

  **The One Sentence:**  
  "We’ve voted ourselves into outcomes that, seen together, contradict what any of us would have chosen as a whole."

  This session delivers visceral insight into exploitable commitments while adhering to your constraints. It requires minimal materials (cards, envelopes, ballots) and emphasizes discovery over lecture. For the condo board, it’s a light but revealing opener.
