  The key challenge is balancing their demand for concrete requirements against philosophical tensions. For instance:
  - The vulnerability window concept clashes with strict determinism but is empirically undeniable
  - Actor/cause distinction pits intentionality against material force
  - The cholera case threatens to collapse causation into epistemology

  When structuring requirements, I'll prioritize:
  1. Non-negotiable: Causal parity, traceability, mediation specification
  2. Negotiable: Actor-status criteria, counterfactual robustness
  3. Explicit tensions: The looped causation requirement may conflict with historical materialism's human-centric view

  The exclusionary requirement will likely be the evidential clause - it eliminates many postmodern approaches. Their vulnerability window concept survives scrutiny as a necessary mediator, while channeling might be their field's useful heuristic rather than universal requirement.

  For the actor/cause question, I'll propose a goal-directedness threshold that excludes volcanoes but admits pathogens. The table comparing schools will show environmental determinism failing mediation tests, while actor-network theory struggles with scale mismatches.

  Most importantly, I must honor their prohibition against citations and focus purely on structural evaluation. The final output should feel like a well-calibrated instrument rather than literature review.
answer: |-
  ### Requirements for an Adequate Account of Non-Human Causation in History  
  *(Non-negotiable requirements marked ★; negotiable marked ◇)*  

  1. **★ Causal Parity**: Must treat non-human causes as *ontologically equivalent* to human causes in explanatory structure.  
     *Case*: Tambora (1) – identical geophysical forcing had divergent outcomes across polities.  
     *Requirement*: Avoids anthropocentric bias; geophysical events exist independently of human perception.  

  2. **★ Mediation Specification**: Must explicitly trace *causal pathways* through which non-human causes interact with human structures.  
     *Case*: 14th-century plague (4) – pathogen → mortality → labor scarcity → institutional change (serfdom decline).  
     *Requirement*: Isolates where human agency/non-human force dominates; prevents "just-so" stories.  

  3. **★ Evidential Traceability**: Must specify what *empirical signature* (proxy, text, artifact) would confirm/refute the causal claim.  
     *Case*: Undocumented eruption (2) – requires ice-core sulfate spikes + tree-ring frost damage + archaeological evidence of societal disruption.  
     *Requirement*: Anchors history in testable claims; satisfies scientific rigor.  

  4. **◇ Actor-Cause Distinction**: Must define *actor* status (beyond cause) via *goal-directed behavior* (e.g., pathogen evolution).  
     *Case*: *Phytophthora infestans* (3) – reproduces directionally; miasma (5) lacks agency (beliefs are human constructs).  
     *Requirement*: Distinguishes purposive biological agents from inert forces; negotiable as criteria for "goals" vary.  

  5. **★ Scale Reconciliation**: Must address *mismatches* between cause scale (e.g., monsoon) and outcome scale (e.g., policy).  
     *Case*: Monsoon failure (7) – explains harvest collapse but not legislation; requires institutional filters.  
     *Requirement*: Prevents ecological reductionism; forces engagement with contingency.  

  6. **★ Looped Causation Capacity**: Must handle *feedback* between human/non-human systems.  
     *Case*: Little Ice Age cooling → famine → plague (6a); Amerindian depopulation → CO₂ dip → climate change (6b).  
     *Requirement*: Earth-system science demands bidirectional causality; non-negotiable for Anthropocene-aware histories.  

  7. **◇ Counterfactual Robustness**: Should clarify how *absence* of the non-human factor changes outcomes.  
     *Case*: Irish famine (3) – without blight, would export policies still cause crisis?  
     *Requirement*: Highlights necessity; negotiable as some reject counterfactuals in historical explanation.  

  #### Tensions & Exclusions  
  - **Irreconcilable Pair**: Scale Reconciliation (5) and strict **Environmental Determinism** clash. Determinism cannot explain why identical forcings yield divergent outcomes. *Keep Scale Reconciliation* – it forces granularity.  
  - **Exclusionary Requirement**: **Evidential Traceability (3)** eliminates accounts that treat non-human causes as purely discursive constructs (e.g., some postmodern narratives).  

  #### Verdict on Your Concepts  
  - **Vulnerability Window**: Genuine desideratum (★). *Case*: Tambora’s impact depended on pre-existing agrarian stress (1).  
  - **Channeling**: Discipline-specific *heuristic* (◇). Useful but reducible to Mediation Specification (2). Not a covert anti-determinist concession.  

  ---

  ### Evaluation of Theoretical Families  
  *(Satisfies ✓ | Partially ⚠ | Fails ✗)*  

  | Requirement               | Env. Determinism | Possibilism | Counterfactual | Actor-Network | Anthropocene |
  |---------------------------|------------------|-------------|----------------|---------------|--------------|
  | 1. Causal Parity          | ✗ (Humans passive) | ✓         | ✓            | ✓ (symmetry)  | ✓           |
  | 2. Mediation Specification| ✗ (Direct causation) | ⚠       | ✓            | ⚠ (flattens scale) | ✓          |
  | 3. Evidential Traceability| ✓               | ✓          | ⚠ (speculative) | ✗ (relativist) | ✓          |
  | 5. Scale Reconciliation   | ✗               | ✓          | ⚠             | ✗              | ⚠          |
  | 6. Looped Causation       | ✗               | ✗          | ⚠             | ✓             | ✓          |
  | 7. Counterfactual Robust. | N/A             | ⚠          | ✓             | ✗             | ⚠          |

  #### Notes  
  - **Actor-Network**: Fails Traceability (3) and Scale (5) – dissolves causation into networks, evading empirical anchors.  
  - **Anthropocene**: Struggles with Scale (5) – often overemphasizes human drivers, under-theorizing non-human autonomy.  
  - **Counterfactual**: Weak on Looped Causation (6) – linear "difference-making" struggles with feedback cycles.  

  **Unresolved**: Whether *any* account fully satisfies Actor-Cause Distinction (4) without smuggling in teleology. Goal-directedness (e.g., pathogen evolution) may be a special case of efficient causation.
