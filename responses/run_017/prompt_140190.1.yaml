prompt: |-
  youre a philosopher of biology who has spent years on the species problem, and also — this is the part I actually need — someone who has had to hand a species concept to people who write binding regulations. Before you write anything, brainstorm out loud for a bit: argue with yourself about whether the spec I'm asking for is even coherent, and list the requirements you're tempted to include but think are bogus. I'd rather have a slightly messy list that names the real tensions than a clean one that hides them.

  What the concept is for: I'm helping draft guidance for an international biodiversity instrument. It has to do three jobs at once. (1) Deciding which populations get legal protection when a listed taxon gets split or lumped. (2) Giving a stable unit for monitoring extinction rates, so that adopting a better concept shouldn't make the trend line jump by 30% overnight. (3) Handling organisms that don't reproduce in anything like the familiar way.

  Give me the requirements list — what any species concept has to deliver to be adequate for that job — with the case behind each, and mark which are non-negotiable and which are just preferences of one camp. Don't recite the usual menu of concepts and don't give me citations or a reading list; I have no web access and I dont need who-said-what. I want the criteria and their motivating cases. A table is fine.

  Here are the cases I want the list to earn its keep on, including two I've stipulated so you can't just fall back on stock examples:

  - Stipulated case one: a clade where overall genomic divergence and gene flow come apart. Populations A and B interbreed freely wherever they meet and the hybrids are fertile, yet they differ at a large fraction of sites across the whole genome. Populations C and D almost never interbreed in the wild, yet they differ at very few sites — and nearly all of those sit in a small number of regions on one chromosome. A concept that keys on amount of difference gets A/B wrong; one that keys on gene flow gets C/D wrong; one that keys on the differences that matter owes me an account of which ones matter that doesn't just assume the answer.
  - Stipulated case two: a group of microbes where the only trait anyone uses to sort them is a metabolic pathway carried on a mobile element that jumps between lineages. The niche-based criterion makes membership temporary; the lineage-based criterion makes the ecologically important unit invisible.
  - A continuous fossil sequence that has to be carved somewhere, because the treaty needs a count.
  - The familiar ring-species and hybrid-zone headaches, briefly, only if they add a requirement the others don't.

  Three more things. Say which distinctions a concept may not collapse — e.g. having species status versus how many species there are, and is-a-species versus is-the-same-species-as, given that the second relation misbehaves. Tell me which single requirement knocks out the most popular concepts. And if some subset of the requirements is jointly unsatisfiable — I suspect the law wants yes-or-no answers about something that is only ever a matter of degree, and I suspect being responsive to new evidence fights with job (2) — say so explicitly and show me the conflict; that's the part I most want to see.
reasoning: |-
  Okay, the user is asking for a requirements list for a species concept to be used in drafting biodiversity regulations. They outlined three main jobs: legal protection decisions during taxonomic splits/lumps, stable units for extinction monitoring, and handling non-standard reproductive organisms. They also provided two stipulated cases to test the concept.

  First, I need to unpack the core tensions here. The legal system wants clear boundaries, but biology is messy. The user's examples highlight this: genomic divergence vs. gene flow paradox, microbes with mobile elements, continuous fossil sequences. These cases expose how traditional concepts fail when key criteria conflict.

  The biggest conflict I see is between stability (for monitoring) and responsiveness (to new science). Regulations can't have species counts jumping overnight when new data emerges, but science must update classifications. This is fundamental - you can't optimize both simultaneously. 

  For the legal protection function, we need a concept that handles splits/lumps without constant status changes. But the microbial case shows ecological function (mobile elements) doesn't align with lineages. Any concept prioritizing one will sacrifice the other.

  The user's deep need seems to be: "Give me an honest roadmap of trade-offs" rather than a false solution. They want the tensions named - like how "amount of divergence" requirements conflict with ring species where divergence is gradual.

  I'll structure requirements as non-negotiable vs. preferences. Non-negotiables include: handling non-sexual organisms (microbes), providing countable units (fossils), and working for conservation policy (not just systematics). 

  The genomic divergence case kills most popular concepts. Phenetic concepts fail on A/B, biological on C/D, ecological on microbes. Only pluralistic approaches might work, but then we lose monism - which policymakers often demand for simplicity.

  Key distinctions to preserve: species status vs. count (lumping/splitting shouldn't alter overall trends), and "is-a-species" vs. "same-species" (the latter isn't always transitive). The monitoring stability requirement alone eliminates most existing concepts - they're too revision-prone.

  Ultimately I'll present this as: "Here's what you minimally need, here's what you'll sacrifice to get it." The user's wisdom is recognizing that hiding these trade-offs helps nobody.
answer: |-
  Here's the requirements list with tensions laid bare. Non-negotiables are **bolded**. Preferences are *italicized*. Conflicts are explicit.

  | Requirement | Case/Justification | Type | Tension/Conflict |
  |-------------|---------------------|------|-------------------|
  | **1. Operationalizability:** Must be applicable using standardizable evidence (morphology, genetics, geography, ecology) available to regulators/labs. | Legal protection needs defensible decisions based on accessible data. Fossil sequences need countable units based on remains. | **Non-negotiable** | Conflicts with capturing complex biology (Stipulated Case 1 & 2). |
  | **2. Stability Under Taxonomic Revision:** Species count/status for *existing* taxa shouldn't wildly fluctuate due solely to *concept adoption* (though new evidence can drive change). | Job (2): Monitoring extinction rates requires trend stability. Legal certainty requires predictable units. | **Non-negotiable** | **Directly conflicts with Requirement 6 (Responsiveness).** Law wants fixed points; biology is fluid. |
  | **3. Applicability Across Life:** Must handle asexual microbes, hybrids, ring species, fossils, and organisms without clear sexual reproduction. | Job (3): Legal scope includes all biodiversity. Stipulated Case 2 (microbes), fossils, ring species. | **Non-negotiable** | Knocks out Biological Species Concept (BSC) immediately. |
  | **4. Definable Boundaries (Countability):** Must allow for discrete units to be listed, counted, and have legal status assigned, even where biology is continuous. | Job (1) & (2): Legal protection requires knowing *what* is protected. Monitoring needs counts. Fossil sequence *must* be carved. | **Non-negotiable** | Conflicts intrinsically with degree-based nature of divergence/gene flow (Stipulated Case 1, ring species). Forces thresholds. |
  | **5. Lineage Fidelity (Cohesion/Identity):** Must identify populations evolving as a unit over relevant timeframes, maintaining distinctness. | Legal protection needs a unit that persists. Monitoring needs a trackable entity. Prevents arbitrary groupings. | **Non-negotiable** | Stipulated Case 2 (mobile element microbes) challenges this: ecological unit lacks lineage, lineage lacks ecological cohesion. |
  | **6. Responsiveness to Evidence:** Must allow status to change based on *new* empirical data (genomic, ecological, behavioral). | Scientific integrity & adaptive management. Stipulated Case 1 *requires* incorporating complex divergence/gene flow data. | **Strong Preference** | **Directly conflicts with Requirement 2 (Stability).** New evidence *should* change counts, undermining trend stability. |
  | *7. Monism (Single Concept):* Prefer one concept applied universally for simplicity and consistency in regulation. | Regulatory practicality, avoiding loopholes based on organism type. | *Preference (Pro-Regulator)* | Conflicts with Requirement 3 & biological reality. Different organisms (microbes vs. birds) may need different criteria. |
  | *8. Evolutionary Significance:* Prefer units reflecting meaningful evolutionary processes/diversification. | Scientific coherence, ensuring protected units represent biodiversity's "atoms". | *Preference (Pro-Biologist)* | Conflicts with Requirement 4 (forcing counts on continua) and operationalizability. |
  | *9. Ecological Cohesion:* Prefer units sharing a core ecological niche/adaptive zone. | Relevant for ecosystem function protection. Helps with Stipulated Case 2 function. | *Preference (Pro-Ecologist)* | Conflicts with Lineage Fidelity in Stipulated Case 2. Conflicts with stability if niches shift rapidly. |

  **Key Distinctions A Concept MUST NOT Collapse:**
  *   **Species Status vs. Species Count:** A lump/split changes the *count* of species, but the *status* (protected/not) of the underlying populations shouldn't necessarily flip wildly. (Requirement 2 aims at count stability).
  *   **Is-A-Species vs. Is-The-Same-Species-As:** The *relation* "same species as" can be non-transitive (ring species), while the *property* "is a species" is assigned to a lineage/population unit defined by the concept. The concept defines the unit, the relation follows imperfectly.

  **Requirement That Knocks Out Most Popular Concepts:** **Requirement 3 (Applicability Across Life)**. BSC fails microbes and fossils. Many lineage concepts struggle with rampant hybridization or strict asexuality. Phenetic concepts often fail Stipulated Case 1 & stability.

  **The Core Unsatisfiable Conflict:** **Requirement 2 (Stability Under Taxonomic Revision) vs. Requirement 6 (Responsiveness to Evidence).**

  *   **Why it's a conflict:** Science progresses. New genetic tools (like those revealing the complexities in Stipulated Case 1) constantly emerge. A concept truly responsive to evidence *will* lead to revisions in species delineation as we understand gene flow, divergence, and phylogeny better. This *will* change species counts and potentially the protected status of populations (e.g., a lump means population X is no longer a protected species).
  *   **Why it matters for the jobs:** Job (2) demands stable counts for extinction trend monitoring. A 30% jump due to a *concept change* invalidates historical comparisons. Job (1) needs predictable units for protection; constant reclassification based on new science creates legal chaos and uncertainty for conservation efforts.
  *   **The Impossible Choice:** You cannot simultaneously have a species count stable against conceptual refinement *and* have classifications that faithfully incorporate the latest, best evidence of evolutionary relationships and processes. **Regulation demands stasis; biology demands flux.** Any concept used will be a compromise, likely involving:
      *   **Operational thresholds:** Arbitrary cut-offs for genetic distance, niche overlap, or time since divergence to enforce Requirement 4 (Countability) and *some* stability.
      *   **Baseline concept & frozen taxonomy:** Locking in an initial taxonomy based on a chosen concept (e.g., Phylogenetic Species Concept - monophyly + diagnosability) and being *extremely* conservative about revising it based on new evidence, sacrificing Requirement 6.
      *   **Pluralism:** Using different criteria for different groups (e.g., PSC for most macrobes, Ecotype/Strain concepts for microbes), sacrificing Requirement 7 (Monism).

  **Handling Your Stipulated Cases Within This Framework:**

  *   **Stipulated Case 1 (Genomic Divergence vs. Gene Flow):** No concept solves this perfectly. A monophyly-based concept (PSC) might split A/B if they form distinct clades despite gene flow, or lump C/D if they are paraphyletic/polyphyletic but rarely interbreed. It highlights the need for **operational thresholds** and accepting that the concept will sometimes misrepresent biology to meet Requirements 2 & 4.
  *   **Stipulated Case 2 (Microbes & Mobile Elements):** Requires prioritizing either Lineage Fidelity (ignoring the ecologically crucial mobile element) or Ecological Cohesion (creating ephemeral "species" tied to the element). Regulation likely needs **separate tracking of the functional unit (the pathway)** alongside the lineage-based species unit. Sacrifices monism and clean "species" status for the functional unit.
  *   **Continuous Fossil Sequence:** **Requirement 4 (Countability) forces arbitrary divisions.** Choose a concept with clear operational thresholds (e.g., phenetic gap, or time-calibrated PSC using molecular clocks from extant relatives) and **stick with it** for stability, even if new fossils blur the lines. Sacrifices Requirement 6.
  *   **Ring Species/Hybrid Zones:** Reinforce that "same species as" isn't transitive. The concept must define the endpoints as separate species (if countability/stability requires it) or the ring as one species (if lineage cohesion is prioritized), accepting the internal inconsistency. Highlights the **Is-A-Species vs. Is-The-Same-Species-As** distinction.

  **Conclusion for Regulation:** You need a concept prioritizing **Operationalizability, Stability, Countability, and Lineage Fidelity across all life (Requirements 1, 2, 3, 4, 5)**. This will likely be a **Phylogenetic Species Concept (diagnosable monophyletic units) or a carefully thresholded General Lineage Concept**, applied with **strict conservatism regarding revisions**. Acknowledge upfront that this **sacrifices true biological Responsiveness (Requirement 6)** and will sometimes misclassify complex cases (Stipulated Case 1) or require supplementary tracking for functional units (Stipulated Case 2). The stability of the extinction trend and legal framework depends on suppressing biological flux.
