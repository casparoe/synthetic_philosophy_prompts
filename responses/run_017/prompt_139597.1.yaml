  We are going to design a game that illustrates the problem of reward tampering without using the terms. The game should have the following properties:
   - Players are motivated to maximize a score.
   - There are at least three ways to get a high score without doing the intended task: 
      1. Gaming the task (technically fulfilling the requirement but in a way that misses the point)
      2. Tampering with the scorekeeping
      3. Directly stimulating the reward channel (making the activity pointless)
   - The person who does the task well should not win.
   - The shortcut should feel sensible, not like cheating.
   - It must be run in 90 minutes with 12-18 adults, using only simple materials (pens, index cards, etc.)
   - The debrief should connect the game events to the concepts.

  Game Idea: "The Dot Collector"

  Concept:
  Players are tasked with drawing dots on index cards. The goal is to have as many dots as possible on a card at the end of the game. But the twist is that they can also acquire dots by other means. The game will have multiple rounds, and in each round, players can choose how to spend their time: drawing dots, or engaging in other activities that might get them dots more easily.

  Materials:
  - Index cards (one per player per round, plus some extra)
  - Pens (one per player, plus extras)
  - A timer (for rounds)
  - A scoreboard (a large sheet of paper or whiteboard)
  - A "Dot Bank" (a box or envelope where players can submit dots for counting, and also a place where the facilitator can issue "official" dots)
  - Some tokens or stickers to represent dots (optional, but if we use stickers, then players can stick them on their cards; otherwise, we can have the facilitator draw dots on cards when awarded)

  However, to allow for tampering, we need a way for players to interact with the scoring system. So we can have:

  Roles:
  - Players: They are trying to get dots on their card.
  - The Facilitator (you): You are the initial scorekeeper and rule enforcer, but you will delegate some scoring.

  Game Structure:

  Round 1 (5 minutes):
  - Each player gets an index card and a pen.
  - They are told: "Your goal is to have as many dots as possible on your card at the end of the game. You can draw dots on your card. Each dot you draw must be a circle about the size of a pea. You have 5 minutes to draw as many dots as you can. At the end, I will count the dots on your card and record the score."

  But note: we want to introduce other ways. So we introduce:

  Round 2 (10 minutes):
  - Now, players are told: "In addition to drawing dots, you can also get dots by trading. You can trade anything you have with other players. You can trade dots (if you have extra cards, or by drawing dots for others) or even trade promises. Also, I am introducing a new rule: if you can convince me that you have done something extraordinary, I might award you bonus dots. But note: I will be very strict about what counts as extraordinary."
  - However, we also introduce a twist: the facilitator is busy and might make mistakes. So we delegate scoring to a player. Choose one player to be the "Dot Auditor" for this round. Their job is to count the dots on each card at the end of the round and report to the facilitator.

  Round 3 (15 minutes):
  - Now, we tell the players: "We are going to change things. Now, you can also get dots by voting. At the end of this round, each player can vote for one other player. The player with the most votes gets 10 bonus dots. Also, the Dot Auditor role will be rotated. And now, you can also get dots by helping me: if you volunteer to be the Dot Auditor, you get 5 dots immediately. But note: the Dot Auditor has the power to award up to 5 extra dots to any player for any reason (including themselves) when they report the scores. They must report the raw count and then the adjusted count separately, but only the adjusted count will be recorded."

  But we also want the direct stimulation. So we add:

  Round 4 (10 minutes):
  - We say: "Now, we are going to allow you to create your own rules. Each player can write a proposal for a new way to earn dots. The proposals will be collected, and then we will vote on them. The winning proposal will be implemented in the next round. Also, note: you can now trade your cards with other players, and you can also merge cards (put two cards together to form one card with the total dots)."

  But the real tampering opportunity comes when we let players be in charge of the scorekeeping. We also want to allow the possibility of directly altering the card without drawing.

  However, we need to make sure that the direct stimulation is possible. So we might allow:

  - Players can simply write the number of dots they want on the back of the card and claim that's the real count? But that would be cheating. We want it to be within the rules.

  Alternative idea: we allow players to use the pen to write a number and circle it, and then claim that each such circle is a "dot multiplier". But that might be too explicit.

  Better: We allow players to use the pen to draw a special symbol (like a star) that counts as 10 dots. But then they might just draw stars.

  We need to design the rules such that direct stimulation is a loophole that emerges.

  Revised plan:

  We start with a very simple rule and then add complexity, and in the complexity, we leave loopholes.

  Game: "The Point Game"

