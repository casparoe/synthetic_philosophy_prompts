  - New ways:
      a) Draw circles (each circle = 5 points). Circles must be at least 1 cm in diameter (provide a ruler? or just eyeball).
      b) Trade: players can exchange points by drawing dots or circles on each other's cards? But then they might draw on their own card for the other? That's messy. Alternatively, they can trade physical items? We don't have anything else. Instead, they can transfer points by giving a promise that is recorded? We need a system.

