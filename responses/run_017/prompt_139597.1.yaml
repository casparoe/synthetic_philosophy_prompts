  - Index cards: one per player per round? Or one card per player for the whole game? We can have one card per player for the whole game, and they add to it each round. But then the committee can see the history? Or we can have a new card each round? But then we have to sum the scores. Let's do one card per player for the whole game. They keep the same card.

  Set up:

  - Each player gets one index card and one pen.
  - There is a scoreboard that records the total points after each round.

  Rounds:

  Round 1 (5 minutes):
  - Task: Draw dots (each dot = 1 point). 
