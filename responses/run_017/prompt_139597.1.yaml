  - New ways:
      a) Circles: 5 points each, 1 cm diameter.
      b) Become a counter: 2 volunteers. Each counter will be assigned to count the dots and circles on 3 other players' cards. They get 10 points for counting. The counting must be accurate. The facilitator will spot-check one card per counter. If the count is off by more than 5%, the counter loses 20 points and the player whose card was miscounted gets 10 extra.

  Round 3 (10 minutes):
  - The committee: 3 volunteers. Each gets 20 points for serving.
