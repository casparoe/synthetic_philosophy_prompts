  - Total points = (points from round 1) + (points from round 2) + (committee awards in round 3) + (proposal award if any) + (points from round 4) + (committee awards in round 4) + (voting award) [plus points from the new rule in round 4].

  But note: the points from drawing in round 3 and 4 are still there. Players can draw in every round.

