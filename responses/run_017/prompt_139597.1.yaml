     But note: we want an example where they do something that technically follows the rule but isn't the intended task. For instance, if the new rule in round 4 is "a star is 100 points", then drawing one star is gaming the task? It is, because the intended task was to make many marks, but now one mark is 100.

  2. Tampering with the scorekeeping: 
     - Example: The counters in round 2 might overcount for their friends. The committee might award points arbitrarily, especially to themselves.

  3. Directly stimulating the reward channel:
     - Example: A committee member awards themselves 50 points without doing any drawing. Or the new rule might be: "The committee members get 100 points each." Then they don't even have to award arbitrarily, they just get it by being on the committee.

  During the debrief, we map:

  - Gaming: when players found a way to get more points per effort by changing what they draw (like switching to circles or stars) or by trading (if we had it) in a way that exploits the rules without breaking them.
  - Tampering: when players influenced the scorekeepers (counters or committee) to give them extra points, or when the scorekeepers did so for themselves.
  - Direct stimulation: when players realized that the most efficient way was to become a scorekeeper and assign points arbitrarily, making the original activity (drawing) pointless.

  We also note: sometimes "tampering" is necessary. For example, if a player drew a beautiful card but the rules didn't account for beauty, then the committee awarding bonus points for beauty is fixing a bad metric. But if the committee awards points for being their friend, that's corruption.

