  The strongest attack to rescue the entailment from exploitability to irrationality would be to say that the agent's overall plan is irrational. Specifically, the agent can see at t0 that the plan of cycling through the options is dominated by the plan of never trading. So it is irrational to engage in the cycle. The fees are not payment for a service because the agent ends up with the same option she started with. The objector might say that the agent's changing preferences are not rational, but the case stipulates that each change is cross-temporally ratified, so it's not that any time-slice is irrational.

  The attack might be that the agent should adopt a plan at t0 and stick to it, and the only rational plan is to never trade. Any other plan is exploitably unstable.

  In response, we can say that the resolute plan avoids the drain but at the cost of forcing the agent to forgo trades that are locally beneficial at later nodes. The cost is real because at those later nodes, the agent has to endure holding an option she then disprefers.

  In the case, the resolute agent at Node1 is holding A, which she then ranks below B and below C. So by her lights at Node1, she is worse off than if she had traded.

  The case establishes that exploitability by itself does not locate a local failure; the failure is at the diachronic level, and there is a conflict between different diachronic approaches (myopic, resolute, sophisticated) with no clearly dominant one.

  Now, write as continuous prose.
