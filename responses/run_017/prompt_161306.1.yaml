  Here's a case built to your specifications, drawn from ordinary life: imagine an agent deciding which of three used cars to purchase for commuting, with the option to trade at a dealership run by a shrewd but not omniscient businessman. The cars are: A (a reliable but bland sedan), B (a sporty coupe), and C (a practical hatchback). The agent starts with $0 and car A. The dealer offers sequential trades for explicit $10 fees, with stakes under $100. The agent's preferences shift predictably due to anticipated changes in her commute: initially (t0) she faces a long, smooth highway and prefers A for comfort, then (t1) her route changes to winding roads where she prefers B for handling, next (t2) she encounters frequent stops where she prefers C for agility, and finally (t3) she reverts to highway driving, preferring A again. She foresees these shifts from the outset, and each change is cross-temporally ratified—at every node, she endorses past and future choices as correct given the preferences at the time they were made. The dealer, possessing no hidden information or risk, profits solely from fees.

  The tree has four nodes. At each, the agent chooses to trade or not. Fees are $10 per trade, and the dealer offers only one trade per node: at Node0 (t0), A to B; at Node1 (t1), A to B; at Node2 (t2), B to C; at Node3 (t3), C to A. Preferences are complete and transitive: t0: A ≻ B ≻ C; t1: B ≻ C ≻ A; t2: C ≻ A ≻ B; t3: A ≻ B ≻ C.

  **Myopic chooser** evaluates only immediate options. At Node0, with t0 preferences, she prefers A to B and declines. At Node1, preferences shift to B ≻ C ≻ A; she pays $10 to trade A for B. At Node2, with C ≻ A ≻ B, she pays $10 to trade B for C. At Node3, with A ≻ B ≻ C, she pays $10 to trade C for A. Net: A, -$30.

  **Resolute chooser** commits at t0 to never trade, valuing A. At Node0 and Node1, she declines trades. At Node1, this costs her: by her t1 preferences, she prefers B to A and could switch for $10, so she forgoes a locally preferred option. Similarly at Node2, with C ≻ A ≻ B, she declines trading A for C, again enduring a dispreferred holding. She avoids fees but ends with A, which at t1 and t2 she ranks below alternatives. Net: A, $0, with real cost in frustrated preferences during the sequence.

  **Sophisticated chooser** uses backward induction, predicting future choices under changing preferences. At Node3, she will trade C for A for $10 under t3 preferences. At Node2, anticipating this, she will trade B for C for $10 under t2 preferences (C ≻ A ≻ B). At Node1, knowing she will trade to B and then to C and A, she will trade A for B for $10 under t1 preferences. At Node0, she foresees paying $30 to cycle back to A. Alternatives: trading to B at Node0 costs $10 initially, but at Node1 (B ≻ C ≻ A) she declines further trades until Node2, where she trades B for C for $10, and Node3, where she trades C for A for $10—net -$30. Trading to C at Node0 costs $10; at Node1 (B ≻ C), she trades to B for $10; then at Node2 and Node3, she trades as before—net -$40. Sophistication cannot improve beyond -$30, matching myopia. Net: A, -$30.

  The structural feature enabling the sophisticated drain is the confluence of complete preference shifts and the dealer’s fixed trade sequence, forcing the agent into a cycle where each step is locally optimal but cumulatively harmful. Backward induction fails as a defense because future choices are locked in by the preference shifts, leaving no escape path.

  **Ablation 1: Dropping cross-temporal ratification.** Suppose at t2, the agent disowns her t1 trade, believing (despite t1 preferences) that keeping A would have been better. This collapses into a standard money-pump: the sophisticated agent, foreseeing regret, avoids trading at t1. She keeps A at Node1, escaping the cycle. Net: A, $0. This confirms that cross-temporal ratification is essential for the sophisticated drain—it sustains the cycle by validating each shift, preventing regret-based avoidance.

  **Ablation 2: Terminal-only valuation.** Assume only the final car matters, evaluated by t0 preferences (A ≻ B ≻ C). Sophistication now escapes: at Node1, she values only the endpoint and sees that trading to B leads to fees to return to A. She keeps A, paying no fees. Net: A, $0. This shows that the drain relies on the agent valuing the holdings *during* the sequence; when only the endpoint counts, foresight allows avoiding trades.

  The strongest attack to rescue irrationality from exploitability argues that the agent’s failure is diachronic: she lacks a stable plan that avoids domination. Never trading dominates cycling (A, $0 vs. A, -$30), so cycling is irrational. The fees are not payment for value, as she ends where she started. This attack locates irrationality at the planning level—consistent preferences require a plan resistant to exploitation. However, it merely relocates the issue: resolute planning avoids the drain but demands costly adherence to past commitments against current preferences, which may itself be irrational if local preferences are authoritative. The case shows that exploitability alone does not pinpoint a local error; it reveals a deeper tension in diachronic rationality—between the sovereignty of present preferences and the need for unified agency over time. In essence, the case establishes that even with full foresight and no local mistakes, structural features of changing, ratified preferences can force rational agents into inescapable exploitation.
