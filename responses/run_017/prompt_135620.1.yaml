  **DEPARTMENT OF ETHICAL ALLOCATIONS**  
  **Office of De Minimis Harms**  
  **19 CFR Part 107**  
  **[Docket No. ODMH-2023-0007; RIN 1080-AB42]**  

  **Notice of Proposed Rulemaking: Establishment of Microharm Credit System and Harm Conversion Metrics**  

  **AGENCY:** Office of De Minimis Harms (ODMH), Department of Ethical Allocations.  
  **ACTION:** Notice of proposed rulemaking.  

  ---

  **SUMMARY:** The Office of De Minimis Harms (ODMH) proposes to establish a standardized framework for quantifying, aggregating, and offsetting minor physical discomforts ("microharms") against instances of severe physical suffering. This rulemaking implements Section 12(b)(7) of the Harm Reconciliation Act of 2028. The proposed regulations include: (1) A schedule of tradable Microharm Credits (MHCs); (2) a Noticeability Exemption threshold; (3) a Per-Subject Harm Cap; and (4) conversion metrics for equating imperceptible or minimally perceptible harms with severe harms.  

  **DATES:** Comments must be received on or before October 23, 2023.  

  **ADDRESSES:** Submit comments via the Federal eRulemaking Portal: http://www.regulations.gov (Docket ID: ODMH-2023-0007).  

  ---

  **SUPPLEMENTARY INFORMATION:**  

  ### I. Background  
  ODMH is charged with minimizing the aggregate experiential burden of harm allocation decisions mandated under the Harm Reconciliation Act. Historical ad-hoc approaches to reconciling severe isolated harms against distributed microharms have resulted in inconsistent outcomes and excessive administrative expenditure. This rule seeks to standardize the valuation and exchange of harms to enhance predictability, reduce decision latency, and ensure no single individual bears a disproportionate burden when distributed alternatives exist.  

  ### II. Proposed Regulatory Text (§ 107.1 – § 107.8)  

  **§ 107.1 Definitions**  
  *(c) Microharm:* A physical stimulus inducing transient discomfort below 1.5 seconds in duration, with no measurable lasting physical or psychological sequalae, and falling below the Noticeability Threshold (see § 107.3).  
  *(f) Severe Harm Unit (SHU):* Equivalent to one subject experiencing 24 consecutive hours of unmitigated, consciousness-impairing physical torture as defined in 18 U.S.C. § 2340(1).  
  *(g) Microharm Credit (MHC):* A tradable unit representing the quantified burden of one microharm event.  

  **§ 107.3 Noticeability Exemption**  
  (a) A harm stimulus qualifies for exemption if fewer than 0.7% of subjects in a representative sample report conscious awareness of the stimulus during post-event debriefing under controlled conditions (ODMH Protocol 12-C).  
  (b) **Exemption Threshold:** Aggregated microharms below the Noticeability Threshold SHALL NOT count toward MHC accrual *unless* the cumulative MHCs projected for a single subject exceed the Per-Subject Harm Cap (§ 107.4) within a 30-day period, OR the total affected population exceeds **3 × 10^18 subjects** within a 24-hour allocation window.^(1)  

  **§ 107.4 Per-Subject Harm Cap**  
  No subject shall accrue more than **500 MHCs** within any rolling 30-day period. Microharms administered beyond this cap SHALL be reallocated to other subjects or require Severe Harm Offset (SHO) authorization.  

  **§ 107.5 Microharm Credit Conversion**  
  (a) **Base Conversion:** 1 SHU = **8.64 × 10^10 MHCs**^(2)  
  (b) MHCs may be banked, traded, or retired for offset against severe harm obligations.  

  **§ 107.7 Recurring Harm Allocation Elections**  
  For recurring harm allocation decisions presented daily to a standing cohort:  
  (a) Subjects MUST affirmatively select either the "Distributed Microharm" or "Focal Severe Harm" option each 24-hour cycle. Default selections are prohibited.  
  (b) ODMH will publish projected 50-year MHC accumulation tables for cohort review biannually.  

  **§ 107.8 Impact Analysis Requirement**  
  All agencies proposing actions involving microharm allocation MUST submit an ODMH Form 10-T, demonstrating adherence to §§ 107.3–107.5 and including:  
  (i) Total affected population;  
  (ii) Projected MHC accrual per subject;  
  (iii) Documentation of Noticeability Exemption testing;  
  (iv) Rationale for exceeding Per-Subject Cap (if applicable).  

  ### III. Justification and Rationale  
  ODMH acknowledges arguments that distributed microharms impose no *meaningful* burden on individual subjects. However, the principle of transitivity requires that if Event A is preferable to Event B, and Event B to Event C, then A is preferable to C. If the avoidance of one SHU justifies *any* number of exemptible microharms, consistency demands avoidance of *n* SHUs justifies *n* × 8.64e10 microharms.^(3) **Agencies selecting the focal severe harm option must provide a compelling explanation for why the experience of one individual outweighs the summed micro-experiences of each distinct individual in the alternative scenario.**^(4)  

  The Per-Subject Cap (§ 107.4) addresses concerns about "death by a thousand specks," while the Noticeability Exemption (§ 107.3) recognizes that harms never consciously registered cannot contribute to a subject’s experiential tally of "bad days." The Recurring Election provision (§ 107.7) ensures democratic legitimacy for standing policies.  

  ---

  **IV. Impact Analysis Table (Proposed Appendix B to Part 107)**  

  | Total Subjects Affected | MHCs Generated | Equivalent SHUs Offset | Noticeability Exemption Applies? |  
  |------------------------|----------------|------------------------|----------------------------------|  
  | 1                      | 1              | 1.15741e-11            | Yes                              |  
  | 10^9                   | 10^9           | 0.0115741              | Yes                              |  
  | 10^18                  | 10^18          | 11,574.1               | **No** (Threshold Exceeded)      |  
  | 3 × 10^18              | 3 × 10^18      | 34,722.2               | **No**                           |  
  | 3 ↑↑ 3^(5)             | 3 ↑↑ 3         | 3.48 × 10^(3.6e12)     | **No**                           |  

  ---

  **V. Request for Comments**  
  ODMH specifically seeks comment on:  
  (1) The scientific validity of the Noticeability Threshold (0.7% reporting rate);  
  (2) Appropriateness of the Per-Subject Cap (500 MHCs/30 days);  
  (3) Methodologies for auditing microharm non-registration.  

  ---

  **Footnotes:**  
  ^(1) *Source: ODMH Study 2041-7: "Conscious Registration Thresholds for Transient Ocular Particulate Irritation." Note: Threshold derived via logarithmic regression of self-report data; 99.3% non-registration confidence interval collapses at N ≈ 1.5e18, hence 3e18 provides 2x margin.*  
  ^(2) *Calculation: 1 SHU = 86,400 torture-seconds. 1 torture-second deemed equivalent to burden of 1,000,000 microharm-seconds. 86,400 × 1e6 = 8.64e10 MHCs/SHU. Basis: ODMH Technical Memo 88a (meta-analysis of disutility scaling).*  
  ^(3) *See ODMH v. Compassionate Prioritizers Consortium, 2055 F.3d 876 (Fed. Cir. 2055).*  
  ^(4) *Emphasis added. Refusal to aggregate microharms functionally asserts that the focal victim’s experience possesses infinite weight relative to any single speck-bearer.*  
  ^(5) *Knuth's up-arrow notation: 3 ↑↑ 3 = 3^(3^3) = 3^27 = 7,625,597,484,987. Used here as placeholder for "astronomically large integer."*  

  ---
  **AUTHORITY:** 42 U.S.C. § 4321 et seq.; 5 U.S.C. § 553; Pub. L. 117–328, Title IX, § 904.  

  **Dated:** August 23, 2023.  
  **Janice R. Thorne,**  
  *Acting Administrator, Office of De Minimis Harms.*  

