  (Setting down his coffee mug, Ray looks Nate dead in the eye, voice low and steady.)

  Your numbers on who makes what? Yeah, they’re probably right. But you forget what happens when nobody’s here to answer the pager. Old Man Petrovic’s place burned last winter because Kittanning’s ladder truck took twenty minutes. We got there in seven. You know the rule: miss three calls, you’re off the roster. So we show up. That furnace fire over on Third Street Tuesday? Your cousin Duane pulled two kids out. No paycheck for that. Just knowing everybody in that truck would do the same for him.

  And that high school gym? It’s where we fed the whole town after your Aunt Bev passed. Every casserole dish in Brackett was on those tables. State shuts the school, consolidates with Kittanning? Okay. Then where do we bury our people? You gonna drive your data charts back from Pittsburgh to set up folding chairs in a church basement? That’s not poverty, Nate. That’s losing the ground under your feet.
