  Important to flag that some desiderata conflict. For example: demanding both "informativeness" (close tracking) and "reportability gaps" (systematic errors) might require careful balancing. The "appears to whom" problem might be fundamentally unresolvable for strict illusionism - hence my "hard problem of appearance" entry.

  The desktop metaphor... it's useful but limping. Files/folders are discrete whereas consciousness is continuous. And unlike computers, there's no unambiguous "real work" level in the brain - just different scales of processing. 

  For the narrator's believability: she'd likely lean toward Dennett's model but with existential angst about the "who." In their fictional training scenario, she might experience either radical detachment (no self to which things appear) or discover that the "appearing" itself is irreducible. That ambiguity could be literarily rich.

