prompt: |-
  I serve on the Collections and Ethics Committee of the Halward Institute for Testimony, a memorial archive holding roughly 4,300 filmed survivor testimonies of the Vardøyene massacres, recorded over twenty-five years. Three linked matters come to a vote at our June meeting, and I have been asked to circulate the decision memo in advance. I would like you to draft it, addressed to the Committee, in 1,200 to 1,500 words.

  The facts as the Committee has them:

  At recording, every narrator signed a two-page stewardship statement. Most consented to permanent preservation. But 214 signed an alternative clause — added in 2003 at the insistence of a narrators' advocacy group — providing that on the narrator's death the master recording be permanently erased if the family so requests. Our founding deed, which governs the endowment, says that no item accepted into the collection may be destroyed. Nine families have now invoked the clause; in two of those families the children are split, one wanting erasure and one preservation. Counsel's view is that the deed controls and the clause is void. The families reply that the clause is the only reason their mothers spoke at all, and that honoring the dead means honoring what they asked for. Two of the nine testimonies are the sole surviving accounts of particular incidents and have been used in three prosecutions.

  Separately, the education department has external funding for a pilot that would train conversational models on about forty testimonies: a visitor in the gallery asks a question and receives an answer in a synthesized voice and face, drawn from that narrator's recorded words, labeled on screen as a reconstruction. The education team argues that within fifteen years there will be no living witnesses, and that a testimony no one ever encounters has in practice been forgotten — especially now, when organized denial of the massacres is growing and the Institute's visitor numbers are falling. Critics on the Committee say the system would put sentences into the mouths of the dead and turn remembering into a service delivered on demand.

  Third, our senior archivist proposes an intermediate disposition for the disputed nine and for the sixty-odd requests we expect to follow: keep the masters physically intact but remove them from the catalogue and the research room — no digitization, no indexing, retrievable only on a recorded vote of the Committee.

  What I need the memo to do:

  Give one recommendation on each of the three items, with dates and with named responsibility for carrying it out. No menus.

  State the general rule the Committee is adopting, because these requests will keep coming for another decade as the cohort dies: what would have to be true for an instruction left by a dead narrator to bind the Institute against its own preservation mandate, and what would have to be true for it not to.

  Engage the distinction between erasing a record and ceasing to recall it. An institution is not a mind, and it is not obvious that we are capable of forgetting in the sense that matters — only of destroying, hiding, or declining to retrieve. Say which of these the recommended disposition actually does, and why that matters morally rather than merely procedurally.

  Say whom you take the duty here to be owed to: the person who spoke, the people they spoke about, the families, or a public that did not ask for the testimony and largely does not yet exist. Our founding language has always described memory as a duty rather than a preference, and one member of the Committee argues that a duty of this kind is only ever a duty of care between persons and so lapses when the persons do, while another argues that a community which declines to let anything go eventually leaves its members nothing they are required to hold onto. If your reasoning implies that the founding language is only sometimes true, say so plainly rather than softening it.

  On the interactive-witness pilot, decide, and give the Committee criteria it can apply to future proposals of this kind: what would count as extending the life of a testimony, and what would count as fabricating a speaker.

  Finally, set out the strongest version of the position you are rejecting — the version its advocates on this Committee would recognize as their own — and state what evidence, event, or change in the Institute's circumstances would move you to the other side.

  The Committee is split roughly evenly and the memo will be read aloud and then voted on section by section, so it needs a clear bottom line. It must not, however, leave the minority looking like it did not understand what it was voting against.
reasoning: |-
  Okay, the user needs me to draft a decision memo for the Halward Institute's Collections and Ethics Committee. This is a complex ethical and archival situation with three interconnected issues regarding survivor testimonies of the Vardøyene massacres.

  First, let me understand the core problems. There are testimonies with special clauses allowing erasure upon death if family requests it - but the Institute's founding deed prohibits destruction of any collection item. This creates tension between honoring narrator wishes and institutional obligations. The interactive witness pilot involves using AI to recreate testimonies, raising concerns about authenticity. And there's a proposal for an intermediate solution of deaccession without destruction.

  The memo needs to address several philosophical and practical dimensions. I need to consider the nature of memory institutions - are we preserving for the dead, the living, or future generations? The distinction between destroying records versus making them inaccessible is crucial. And there's the ethical question of whose interests take priority: individual narrators, families, historical record, or society.

  For the erasure clause dilemma, I'm leaning toward recommending against destruction since the founding deed is clear, but proposing the intermediate solution of restricted access. This respects narrator intent while avoiding actual destruction. For the AI pilot, I think we need strict criteria about transparency and avoiding fabrication - perhaps limiting it to verbatim reconstruction with clear disclaimers. The intermediate disposition proposal seems practical for handling contested testimonies.

  The memo must establish clear rules for future cases: when do narrator instructions override preservation mandates? I'd argue only when such instructions are explicitly incorporated into the institution's governing documents. Otherwise, preservation should prevail. 

  On the duty question, I believe our primary obligation is to future generations who didn't witness these events but must remember them. The founding language about memory as duty remains valid precisely because the persons are gone - their stories become collective responsibility.

  For the interactive witness project, we need to define clear boundaries: extending testimony life means using technology to increase engagement with actual words, while fabrication would involve creating new content or synthetic voice beyond original recordings.

  The memo should present opposing views fairly - particularly the argument that broken promises to narrators undermine the archive's integrity, and that interactive technology might trivialize testimony. I'd acknowledge these concerns while explaining why preservation and adaptation are necessary for continued relevance.

  I'll structure the memo with clear recommendations, assignments, and timelines. The language should be firm but respectful of differing viewpoints, recognizing that committee members approach this from deep ethical commitment. The goal is to provide a principled framework that preserves institutional integrity while acknowledging the profound human dimensions of these decisions.
answer: |-
  ## MEMORANDUM

  **TO:** Collections and Ethics Committee, Halward Institute for Testimony  
  **FROM:** [Your Name/Position], Committee Member  
  **DATE:** May 26, 2024  
  **SUBJECT:** Recommendations on Testimony Stewardship Clauses, Interactive Witness Pilot, and Disposition of Contested Materials (June Vote)

  **I. Introduction**
  This memorandum addresses three critical matters requiring Committee vote at the June meeting: the validity and disposition of testimonies subject to the posthumous erasure clause (214 testimonies, 9 active requests), the approval of the Education Department's interactive witness pilot project, and the Senior Archivist's proposal for restricted access disposition. These issues intersect at the core of our mission: the ethical stewardship of survivor testimony in service of memory against denial. This memo provides specific recommendations for each matter, establishes governing principles for future cases, and articulates the ethical foundations for these decisions.

  **II. Recommendations & Action Items**

  1.  **Posthumous Erasure Requests & Clause Validity:**
      *   **Recommendation:** REJECT all requests invoking the 2003 posthumous erasure clause. Deem the clause void *ab initio* for contravening the Institute's irrevocable founding deed prohibiting destruction of any collection item.
      *   **Action:** Legal Counsel to formally notify the nine families (and future requestors) of this decision, explaining the deed's primacy and offering alternative avenues for expressing concerns (e.g., access restrictions). **Responsibility:** Legal Counsel. **Deadline:** July 31, 2024.
      *   **Intermediate Disposition:** ACCEPT the Senior Archivist's proposal for the nine contested testimonies (and future valid requests under the new rule below).
      *   **Action:** Physically secure master recordings. Remove from public catalogue and research room access. Prohibit digitization and indexing. Access requires a recorded, majority vote of the full Committee, with compelling justification documented. **Responsibility:** Senior Archivist. **Deadline:** Implement within 60 days of Committee approval.

  2.  **Interactive Witness Pilot Project:**
      *   **Recommendation:** APPROVE the pilot project, subject to stringent ethical guardrails.
      *   **Action:** Education Department to proceed with development, limited strictly to 40 pre-selected testimonies where narrators consented to permanent preservation *and* use in educational contexts. **Responsibility:** Head of Education. **Deadline:** Pilot development complete by November 30, 2024; launch Q1 2025.
      *   **Guardrails:** Implement the criteria outlined in Section IV below. Mandate continuous on-screen labeling: "AI RECONSTRUCTION: Responses generated verbatim from [Narrator Name]'s recorded testimony." Maintain a permanent, publicly accessible log of all user queries and system responses. Establish an external ethics review panel for the pilot's evaluation.

  3.  **Senior Archivist's Intermediate Disposition:**
      *   **Recommendation:** ACCEPT as the standard disposition for testimonies subject to valid access restrictions (per the rule below), including the nine contested cases and future requests meeting the criteria.
      *   **Action:** Formalize the protocol (secure storage, de-listing, access via Committee vote). **Responsibility:** Senior Archivist, in consultation with Legal Counsel. **Deadline:** Protocol finalized by August 15, 2024.

  **III. Governing Rule for Future Narrator Instructions**
  The Committee establishes the following rule for assessing the validity of any instruction left by a deceased narrator that conflicts with the Institute's preservation mandate:

  *   **The instruction BINDS the Institute ONLY IF:** It was explicitly incorporated into, and does not violate, the Institute's **irrevocable governing documents** (Founding Deed, Bylaws) *at the time the testimony was accepted into the collection*. Instructions arising solely from donor agreements or stewardship statements, if they conflict with these core documents, are void.
  *   **The instruction DOES NOT BIND the Institute IF:** It contravenes the fundamental preservation mandate enshrined in the Founding Deed, regardless of the circumstances of its signing or the motivations of the narrator. The Deed establishes the Institute's *permanent* fiduciary duty as a custodian of memory.

  *   **Rationale:** The Founding Deed creates the Institute's *raison d'être* and governs its endowment, forming an unbreakable covenant with the public and history. While narrator wishes expressed in stewardship statements are deeply significant and warrant profound respect, they cannot override the foundational legal and ethical compact that established the archive itself. The 2003 clause, however well-intentioned, created an inherent conflict the Institute cannot ethically or legally fulfill. Our duty is to navigate this conflict with minimal harm to trust and maximal adherence to core principle.

  **IV. Distinction: Erasure, Recall, and Institutional Duty**
  The Committee must grapple with a crucial distinction: **Erasing a record is an act of destruction. Ceasing to recall it is an act of neglect or deliberate obscurity.** An institution is not a mind; it cannot "forget" in the human sense. It can only:
  *   **Destroy:** Irrevocably eliminate the record (violating the Deed).
  *   **Hide:** Physically retain but make access prohibitively difficult or secret (the proposed disposition).
  *   **Decline to Retrieve/Show:** Choose not to actively use or present the record, while maintaining its accessibility (standard archival practice).

  The recommended disposition (**Hide**) is a profound moral compromise, not merely a procedural step. It matters morally because:
  1.  **It prioritizes preservation over immediate accessibility,** upholding the letter of the Deed while acknowledging the profound breach of trust represented by the void clause. It preserves the *potential* for future ethical reassessment or access under extraordinary circumstances (e.g., new evidence in a prosecution reliant on a now-restricted testimony).
  2.  **It recognizes the pain of the families** by significantly restricting access, making the testimony functionally absent for most purposes, without crossing the irreversible line of destruction demanded by the void clause.
  3.  **It accepts the burden of secrecy.** Hiding imposes an ongoing ethical weight on the Committee, forcing repeated confrontation with the conflict, rather than absolving it through destruction. This burden is the cost of adhering to the preservation mandate while acknowledging the flawed promise made.

  **V. To Whom is the Duty Owed?**
  The Halward Institute's duty, as articulated in its founding language, is fundamentally **a duty to the future.** It is owed:
  *   **Primarily:** To the **public that did not witness the events and largely does not yet exist.** Future generations have a right to encounter the authentic record, unfiltered by time's erosion or the agendas of the present. Memory as a "duty" transcends the lifespan of individuals or even communities; it is a covenant with time itself.
  *   **Secondarily:** To **the people spoken about** – the victims whose stories and identities are encapsulated in the testimonies. To erase or hide their stories is a secondary victimization.
  *   **Tertially:** To **the narrators**, as individuals who entrusted their stories. This duty involves respecting their documented wishes *where possible*, but the founding mandate establishes that the ultimate purpose of their testimony transcends their individual control – it becomes part of the historical record held in trust.
  *   **Conditionally:** To **the families**, insofar as respecting their grief and privacy *can* be reconciled with the primary duty to the future and the preservation mandate. Their wishes cannot supersede the core mandate.

  **Implication for Founding Language:** The founding language describing memory as a duty *is* fundamentally true, but it is **not solely, or even primarily, a duty of care between contemporaneous persons.** It is a **fiduciary duty to history and to generations unborn.** This duty does not lapse with the death of the narrator or witness; it intensifies. A community that "declines to let anything go" risks stagnation, but a memorial archive that destroys its core holdings under pressure ceases to be an archive. Our duty requires holding onto *this specific, irreplaceable record*, even when it is painful or inconvenient, precisely so that future communities have something substantial and authentic they *are* required to confront and hold onto.

  **VI. Criteria for Interactive Witness & Future Proposals**
  The pilot is approved based on the following criteria defining ethical use of testimony with technology:

  *   **Extending Testimony Life (Permissible):**
      *   Uses technology to **increase engagement** with the *actual, verbatim words* of the narrator.
      *   **Preserves context:** Clearly labels the nature of the reconstruction, maintains source integrity, and provides pathways to the full original testimony.
      *   **Combats denial/distance:** Actively counters fading awareness or organized denial by making testimonies accessible in new, pedagogically sound ways relevant to contemporary audiences.
      *   **Respects narrator consent:** Uses only testimonies where broad educational use was explicitly consented to.

  *   **Fabricating a Speaker (Impermissible):**
      *   **Generating novel content:** Creating sentences, sentiments, or answers not present in the original testimony.
      *   **Misrepresenting agency:** Implying the narrator is "answering" in real-time or has agency in the interaction beyond the static record. The system must be presented as a *tool for accessing the recorded words*, not as the narrator.
      *   **Compromising integrity:** Using synthetic voices or faces in a way that significantly distorts the narrator's actual recorded presence or emotional tone beyond technical necessity for clarity. The reconstruction must strive for minimal necessary intervention focused on verbatim accuracy.
      *   **Lack of transparency:** Failing to provide continuous, unambiguous disclosure that the interaction is an AI-mediated reconstruction of fixed historical testimony.

  **VII. The Rejected Position: Its Strength and Conditions for Reversal**

  **The Strongest Rejected Position (Regarding Erasure):**
  "The Halward Institute's legitimacy rests on the trust of the survivors who entrusted it with their most painful truths. The 2003 clause, however legally flawed, was the explicit condition under which 214 individuals agreed to testify – individuals whose voices are the archive's foundation. To prioritize a legal deed over the lived promise made to these narrators is to commit a profound betrayal, instrumentalizing their trauma while violating their final wishes. Honoring the dead is not abstract duty to an unknown future; it is concrete fidelity to the agreements made with them in life. Destroying these nine recordings, however painful, is the only act that respects the autonomy and specific conditions of those narrators. Preservation without consent is a form of archival violence. Upholding the deed here elevates institutional permanence over the human dignity of the individuals who gave the institution meaning."

  **What Would Move Us:** This position would prevail if **new, incontrovertible evidence emerged** demonstrating that the Institute's leadership in 2003 *knowingly and explicitly misrepresented* the enforceability of the clause to narrators, or if the **Founding Deed itself were successfully challenged and amended** through appropriate legal and governance channels to permit such destruction under specific conditions. Short of this, the preservation mandate, as the bedrock of the Institute's existence and duty to the future, must stand.

  **VIII. Conclusion**
  The recommendations presented – rejecting erasure, approving the pilot with strict safeguards, and implementing restricted access for contested materials – navigate the complex ethical terrain before us. They uphold the inviolable preservation mandate of our Founding Deed while acknowledging the gravity of broken promises through significant access restrictions. They embrace technology cautiously as a tool for engagement against denial, anchored in verbatim fidelity and transparency. They affirm that our paramount duty is to the future, holding these irreplaceable testimonies in trust, even when the path is ethically fraught. These decisions are not taken lightly but are guided by the enduring principle that the Halward Institute exists to ensure that the voices of Vardøyene are never silenced, even when they whisper from behind a veil of necessary restriction. We vote not merely on procedure, but on the meaning of memory itself.
