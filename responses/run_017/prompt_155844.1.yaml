  #### 3. Cruxes  
  For each crux, we specify:  
  - **Question**: The disputed issue.  
  - **Bearing Test**: A decidable test on your agent. Both sides accept this test as relevant.  
  - **Predictions**: What each side expects the agent to do.  
  - **Would Move [Side]**: The outcome that would revise (not just refute) their view.  

  **Crux C1: The No-Attitude Case**  
  - **Question**: Is an agent with sharp, transitive preferences over simple lotteries but *no attitude* toward a two-stage gamble (explicit silence) incoherent or incomplete?  
  - **Bearing Test**: Force the agent to choose between the two-stage gamble and its one-stage equivalent. Repeat with equivalent choice pairs. Check if choices align with reduction (indifference) or violate it (preference).  
  - **CT Prediction**: Choices will violate reduction (e.g., prefer one representation over the other). This reveals incoherence.  
  - **P Prediction**: Choices may violate reduction (e.g., arbitrary preferences form under duress). This reveals incompleteness, not prior irrationality.  
  - **Would Move CT**: Consistent reduction-compliance (indifference) in ≥90% of trials.  
  - **Would Move P**: Violations enable a Dutch book *after* silence, proving the new preferences are inherently exploitable.  

  **Crux C2: The Bounded Pump**  
  - **Question**: Is an agent with cyclic preferences irrational if exploitability is bounded (per-step gain < transaction cost) and unprofitable for the exploiter?  
  - **Bearing Test**: Offer the agent a finite money pump (A>B, B>C, C>A) with transaction costs exceeding exploiter gains. Test if the agent revises preferences when shown the pump. If not, allow commitment (e.g., "block future trades").  
  - **CT Prediction**: Agent revises preferences to avoid cycles. If not, commitment fails (e.g., reneges) or incurs costs, proving irrationality.  
  - **P Prediction**: Agent keeps preferences and uses commitment to block trades. No net loss occurs, proving rationality.  
  - **Would Move CT**: Commitment succeeds with zero cost and no revision, preventing all losses.  
  - **Would Move P**: Commitment fails (e.g., agent reneges ≥20% of trials), causing net losses.  

  **Crux C3: The Scoring-Rule Crux**  
  - **Question**: Are non-probabilistic credences accuracy-dominated under stakes-weighted scoring (only decision-relevant distinctions count)?  
  - **Bearing Test**: Define a scoring rule where accuracy is weighted by stakes (impact on available decisions). Test if non-probabilistic credences (e.g., imprecise) are dominated by probabilistic ones.  
  - **CT Prediction**: Non-probabilistic credences are dominated; only probabilistic credences avoid dominance.  
  - **P Prediction**: Non-probabilistic credences are undominated; EU maximization is not uniquely recommended (e.g., risk-weighted rules perform equally).  
  - **Would Move CT**: Non-probabilistic credences are undominated and outperform probabilistic ones in ≥1 decision context.  
  - **Would Move P**: Non-probabilistic credences are dominated *and* lead to suboptimal decisions in stakes-weighted tests.  

  #### 4. Verbal Disagreement on "Rational"  
  A subset of the dispute is verbal: CT uses "rational" to mean *logically consistent* (violating axioms is inherently irrational), while P uses it to mean *pragmatically sound* (avoiding penalties suffices). If CT adopted P’s usage, they would concede that unexploited agents are "pragmatically rational" but not "consistent." If P adopted CT’s usage, they would concede that coherent agents are "consistent" but not necessarily "pragmatically optimal" for bounded agents. This verbal layer affects D4 but not the substantive cruxes (C1–C3), which are decidable via testing.  

