answer: |-
  ### Joint Statement on Coherence and Rational Choice for Bounded Artificial Agents  

  **To the Builder of a Computationally Bounded Artificial Agent:**  
  This statement results from an adversarial collaboration between a Coherence Theorist (CT) and a Permissivist (P) on whether coherence arguments establish that a rational agent must maximize expected utility (EU). Our goal is to provide you with decidable cruxes for your agent design. Every disagreement is framed to be settled by empirical tests on your agent, not intuition.  

  #### 1. Agreed Claims  
  The following claims are accepted by both parties. Each rules out a plausible alternative position:  
  1. **Conditional Coherence**: If an agent has complete, transitive, continuous, and independent preferences over a prospect space closed under mixing and compounding, *and* can reduce compound gambles, then rationality requires maximizing EU relative to those preferences.  
     *Ruled out: "EU maximization is optional even with representable preferences."*  
  2. **Penalty in Principle**: Under idealized conditions (no transaction costs, closed prospect space, infinite trades), violations of the axioms make an agent vulnerable to Dutch books, money pumps, or accuracy dominance via strictly proper scoring rules.  
     *Ruled out: "Violations are penalty-free even in theory."*  
  3. **Avoidability**: Agents can prevent *actual* penalties (e.g., monetary loss) from exploitation arguments by using commitment strategies (e.g., preemptively refusing trades) or adjusting preferences dynamically.  
     *Ruled out: "Penalties are inevitable regardless of agent design."*  
  4. **Incompleteness ≠ Indifference**: An agent may lack any attitude (preference or indifference) toward a prospect. Silence is distinct from indifference and does not violate transitivity or completeness.  
     *Ruled out: "Silence must be treated as indifference."*  
  5. **Representation Requires Computation**: An agent with EU-representable preferences may still fail to maximize EU due to computational limits (e.g., intractable expectations). Such failures are irrational.  
     *Ruled out: "Having representable preferences excuses computational failures."*  

  #### 2. Disagreements  
  Each disagreement is stated twice: once in CT’s wording, once in P’s. "Substantive" disputes reflect factual disagreements; "verbal" reflect semantic differences; "methodological" reflect prioritization. Only substantive disputes survive translation to a shared vocabulary.  

  | ID | Kind          | Coherence Theorist Formulation                                      | Permissivist Formulation                                          | Crux IDs | Stakes (What the Formulation Rules Out) |  
  |----|---------------|---------------------------------------------------------------------|------------------------------------------------------------------|----------|-----------------------------------------|  
  | D1 | Substantive   | Rationality requires complete, transitive preferences over all compound prospects in a closed space. Violations are incoherent. | Rationality permits context-sensitive or incomplete preferences; silence on compounds is acceptable. Violations are costly only when penalized. | C1       | Whether an agent without compound attitudes is irrational or merely incomplete. |  
  | D2 | Substantive   | Cyclic preferences are irrational *even if* unexploited in practice, as exploitability reveals structural irrationality. Commitment strategies do not resolve the defect. | Cyclic preferences are irrational only if they cause net losses in practice. Commitment strategies negate irrationality by preventing penalties. | C2       | Whether bounded exploitability (with no net loss) implies irrationality. |  
  | D3 | Substantive   | Rationality requires credences to be probabilistic. Non-probabilistic credences are accuracy-dominated on *any* reasonable scoring rule, including stakes-weighted ones. | Rationality permits non-probabilistic credences if accuracy is stakes-weighted. Such credences may be undominated on the agent’s own measure. | C3       | Whether EU maximization is uniquely accuracy-undominated under stakes-weighted scoring. |  
  | D4 | Verbal        | "Incoherent" means logically inconsistent, implying irrationality.               | "Incoherent" means practically costly, not necessarily irrational.             | –        | Whether "incoherence" entails strict irrationality or practical risk. |  
