prompt: |-
  A blogger I follow wrote this about moral uncertainty and I honestly can't tell how much of it to trust:

  If you're not sure which moral theory is true, the fix is to treat that uncertainty exactly like uncertainty about the facts: assign each theory a credence, then pick the option with the highest expected choice-worthiness — the sum, over theories, of your credence in the theory times how good the option is by that theory's lights. Since that's just expected-utility maximisation with theories in the role of outcomes, it's the only rationally permissible rule, and anyone who refuses to aggregate is being straightforwardly irrational. It also basically dissolves moral disagreement: once two people who disagree about which theory is correct both do the weighted-average thing, whatever dispute is left over is purely empirical. And the standard worry — that some theory you assign a tiny credence can swamp the sum by positing astronomical stakes, so you end up devoting your life to whatever weird long-shot view is floating around — shows the whole approach is broken; the honest fallback is to just act on the theory you find most plausible and ignore the rest.

  A friend who did some grad philosophy says the last move is a live objection rather than a refutation, and mumbled something I couldn't follow about "how good by the theory's lights" not being a quantity most moral theories even supply, about some theories telling you to ignore your doubts about them, and about how you'd also need to be uncertain about what to do when you're morally uncertain, which just pushes the problem up a level.

  How fair is the passage overall? Which sentences would someone who actually works on this accept, which are conflations or overstatements, and does the "just go with your favourite theory" conclusion survive even if the worries my friend raised do land?
reasoning: |-
  Okay, the user is grappling with a complex passage about moral uncertainty from a blogger. They're unsure how much to trust it and have a friend who raised some objections. Let me unpack this step by step.

  First, the blogger's core argument presents expected choice-worthiness maximization as the only rational solution to moral uncertainty. The user needs to know how credible this is. I recall that while this approach (maximizing expected choice-worthiness) is indeed a major framework in the literature, calling it the "only rationally permissible rule" is way too strong. Many philosophers see it as one plausible approach among others, not a settled truth.

  The blogger's claim about dissolving moral disagreement seems particularly problematic. Reducing all disputes to empirical ones after aggregation overlooks deep structural differences between theories. Theories might not even agree on what counts as empirical evidence, or have incommensurable value scales. That part feels like a clear overstatement.

  The astronomical stakes objection is real - Nick Bostrom's "Pascal's mugging" scenario shows how tiny-credence theories can dominate decisions. The blogger dismisses this as proof the approach is broken, but actually philosophers treat it as a serious technical challenge. Solutions like variance normalization or credence thresholds exist, though they're not perfect.

  The user's friend made three important points: 1) Not all theories supply quantifiable "goodness" metrics (how does deontology assign numbers to duties?), 2) Some theories explicitly tell you to ignore doubts (like actual deontology), and 3) There's potential for infinite regress when uncertain about uncertainty frameworks. These are legitimate complications the blogger glosses over.

  Regarding the fallback position ("just go with your favorite theory"): It's not irrational per se, but rather a different approach called My Favorite Theory. However, it has its own issues - it ignores the possibility that even low-credence theories might contain important insights, and feels oddly dismissive of uncertainty itself.

  The user seems to want both technical accuracy and practical guidance. Underneath the surface questions, they might be wrestling with how to actually live with moral uncertainty. The blogger's confident tone might have appealed to that need for certainty, but the reality is messier. I should emphasize that serious philosophers engage these complexities without claiming definitive solutions.
answer: |-
  That passage mixes some genuine insights with significant overstatements and philosophical naivete. Here's a breakdown:

  **What's Reasonable (or a Live Position):**

  1.  **Treating Moral Uncertainty Like Factual Uncertainty:** This is the core idea of *Expected Moral Value* (EMV) or *Maximizing Expected Choice-Worthiness* (MEC). It's a serious and influential approach advocated by philosophers like William MacAskill, Toby Ord, and Nick Bostrom. The analogy to expected utility maximization is valid on its face.
  2.  **The "Astronomical Stakes" Worry is Real:** This is a well-known and serious problem for MEC, often called the "Problem of Fanaticism," "Pascal's Mugging for Moral Theories," or the "Swamping Problem." A tiny credence in a theory with *unboundedly large* potential value (e.g., a theory valuing the creation of near-infinite numbers of sentient beings, or avoiding near-infinite suffering) can dominate the calculation and dictate your action, regardless of what other theories say. This is widely seen as a major challenge.
  3.  **"Just Act on Your Favorite Theory" is a Proposed Alternative:** This is known as the **My Favorite Theory** (MFT) approach. It *is* defended by some philosophers (e.g., Elizabeth Harman) as a response to the problems of MEC, particularly fanaticism. The blogger presents it as the *only* honest fallback, which is too strong, but it *is* a live option.

  **Conflations, Overstatements, and Problems:**

  1.  **"The *only* rationally permissible rule... anyone who refuses... is straightforwardly irrational."** This is **wildly overstated**. MEC is *one* proposed solution, not the uncontested, rationally mandated truth. Many philosophers reject it or propose alternatives (like MFT, various voting models, or multi-level theories). Claiming dissenters are "straightforwardly irrational" betrays a lack of engagement with the depth and complexity of the debate.
  2.  **"It basically dissolves moral disagreement... whatever dispute is left over is purely empirical."** This is a **gross overstatement and likely false**. Here's why:
      *   **Incommensurability:** Different moral theories often use radically different scales and concepts of value (e.g., utility vs. rights vs. virtues). Aggregating "how good" an option is requires translating these scales into a common metric (intertheoretic comparisons of choice-worthiness). This is a *huge* unsolved problem. Is "1 unit of utility" comparable to "1 unit of duty fulfillment"? There's often no obvious or agreed-upon way to do this, meaning the "weighted average" might be mathematically impossible or meaningless. *This* is a major source of remaining *non-empirical* disagreement.
      *   **Theory-Specific Uncertainty:** Even *within* a theory, applying it to a complex world involves significant judgment calls and uncertainty about what the theory *requires* in a given situation. Aggregation doesn't magically eliminate this.
      *   **Structural Disagreement:** People might fundamentally disagree *about how to handle moral uncertainty itself* (e.g., MEC vs. MFT vs. other approaches). The blogger assumes MEC is the only rational way, but this is precisely what's contested.
  3.  **"Shows the whole approach is broken... honest fallback..."** While the fanaticism problem is severe, it doesn't *necessarily* mean MEC is irredeemably "broken." Philosophers actively work on solutions: capping potential value scales, normalizing variance between theories, discounting theories with unbounded stakes, or using more complex decision rules. Dismissing the entire approach because of one (admittedly big) problem is premature. Furthermore, presenting MFT as the "honest fallback" ignores that it has its own serious problems (ignoring potentially valuable insights from other theories, being overly dogmatic).

  **Your Friend's Points are Highly Relevant:**

  1.  **"How good by the theory's lights" not being a quantity:** This hits directly on the **intertheoretic comparison problem**. Many theories (like Kantian deontology or some virtue ethics) don't provide a neat, cardinal ranking of all options. They might offer ordinal rankings, pronounce actions permissible/impermissible, or focus on character. Forcing them into a cardinal "choice-worthiness" metric is often arbitrary and controversial. This is a major technical hurdle for MEC.
  2.  **"Some theories tell you to ignore your doubts about them":** This is crucial. MEC assumes that when you are uncertain about a theory T, you should act *as if* you might be wrong about T. But **some theories explicitly reject this!**
      *   A **deontologist** might believe you have an absolute duty to X, regardless of what other theories say.
      *   A **moral realist** might believe the *true* theory demands acting on its precepts, and that accommodating uncertainty is itself a moral error.
      *   MEC itself implicitly adopts a *meta-norm* about how to handle uncertainty. A theory might explicitly reject *that meta-norm*. MEC assumes its own meta-norm is correct in a way that might beg the question against theories that disagree.
  3.  **"Uncertain about what to do when you're morally uncertain" (Higher-Order Uncertainty):** This is the problem of **regress**. How do you choose *which* method (MEC, MFT, etc.) to use for handling first-order moral uncertainty? You'd need a second-order rule... but you might be uncertain about *that* too. This pushes the problem up a level without necessarily solving it. Some frameworks try to incorporate this (e.g., "maximizing expected choice-worthiness of choice-worthiness functions"), but it gets immensely complex.

  **Does "Just go with your favourite theory" (MFT) Survive?**

  *   **Yes, as a live position.** It avoids the fanaticism problem and the intertheoretic comparison problem. Proponents argue it better reflects a sincere commitment to what one believes is right.
  *   **But it has significant weaknesses:**
      *   **Ignores Credences:** It throws away all information from your credences in other theories. If you have 40% credence in Theory B, which strongly condemns your MFT-preferred action, MFT tells you to ignore that entirely. This seems epistemically and practically risky.
      *   **Dogmatism:** It can lead to acting on a theory you only marginally favor over strong alternatives, ignoring potential compromises or actions that are acceptable to a wider range of plausible theories.
      *   **Arbitrariness:** The line between "favorite" and others can be blurry. What if credences are close? MFT offers no guidance here.
      *   **Vulnerability:** If your "favorite" theory changes slightly based on new arguments, your actions might swing wildly, whereas MEC might offer more stability.

  **Overall Fairness Assessment:**

  The passage starts with a genuine (though simplified) description of a leading approach (MEC) and identifies a major problem (fanaticism). However, it is deeply flawed by:
  1.  **Overstating the dominance and rationality of MEC:** Framing it as the *only* rational solution is incorrect and dismissive of genuine philosophical debate.
  2.  **Severely understating the technical problems:** Especially the intertheoretic comparison problem, which is arguably *the* core challenge for MEC. The dismissal of fanaticism as a simple refutation is too quick.
  3.  **Making empirically false claims about dissolving disagreement:** The incommensurability problem means deep moral disagreement persists even after aggregation.
  4.  **Presenting MFT as the only viable fallback:** While MFT is a legitimate alternative, it's not the only one, and its own problems are ignored.

  **Conclusion:** Trust the passage with extreme skepticism. While it touches on real issues, its presentation is polemical, oversimplified, and dismissive of the profound complexities in the field of moral uncertainty. Your friend's points about intertheoretic comparisons, theory-specific meta-norms, and regress are valid and highlight key objections that the blogger either ignores or downplays. MFT survives as *one* possible response, but it's not the only one, nor is it without its own significant drawbacks. The reality is that handling deep moral uncertainty is an exceptionally difficult, unsolved philosophical problem with multiple competing approaches, none of which are obviously "the only rational" solution.
