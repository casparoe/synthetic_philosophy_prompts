prompt: |-
  I'm TAing for an intro ethics course this term and we did Taurek last week, and I got into an argument with a friend afterwards that I've been going around in circles about ever since. His move was: fine, grant Taurek that you can't just add up six people's deaths into one giant death, and grant that you're sometimes allowed to save the one rather than the five. But then, he says, if nobody has any special claim on you and nobody is worse off than anyone else, the honest way to respect six equal claims is to give each of the six people an equal chance at surviving, i.e. to randomize. And I said: sure, but isn't that just sneaking the numbers in through the back door, given that the only reason randomizing does any good is that there are more people on one side? He said no. Neither of us got anywhere, because we kept arguing over cases where the answer was basically built in by how we described them.

  So what I want from you is a case, built to order. It needs two feasible actions, and the only difference between the people on the two sides should be how many of them there are: no age gaps, no one of them is a surgeon or a parent, no quality-of-life differences, nobody responsible for the emergency, no consent or promises or prior claims floating around, no relationship to the agent, and everyone involved should be equally badly off if unhelped (they all just die) and equally fine if they make it. Realistic setting, please: a hospital, a disaster site, a fire crew, a rescue boat, a supply drop, something like that, and definitely no trolleys. Probabilities are allowed, and I actually think they're where the action is: if everything is certain under both actions then equal-chances-to-each just collapses into a plain coin flip and Taurek's permission is the only other thing on the table, so nothing separates the two positions. So build it out of risky prospects, with the kind of numbers a rescue team could actually estimate, not one-in-a-billion stuff. Two more design constraints: (1) in the base case the expected number of lives saved should come out exactly equal across the two actions, so that plain numbers-counting has no verdict at all and the disagreement has to get settled by something else; (2) the equal-chance procedure should still return a definite verdict that isn't 50/50 and isn't merely a permission — it should tell you that you must do something specific.

  Then do the analysis. Say what each of these three things says about your case and why: plain save-the-greater-number reasoning over expected lives, the Taurek-ish package (numbers don't count, each person's loss is theirs alone and isn't made worse by the others', so you may save the fewer), and the equal-chance-to-each procedure. Then tell me which feature of the case is doing the work — the thing that makes the first one fall silent while the other two come apart — and show what happens if you remove it, e.g. what happens if you de-risk the case and make all the outcomes certain again. Then do one extra check that matters to me more than the rest: re-run the case with the bigger group scaled way up, five people to five hundred, holding each individual's chance of surviving fixed, and report which verdicts move and which don't. That's the crux of my argument with my friend — whether equal-chances-to-each is genuinely insensitive to how many people there are, or whether it tracks the numbers after all. Finish by telling me what the side that comes out worst would say to wriggle out of your case, and then, in a sentence or two, what you think should actually be done in it.
reasoning: |-
  Okay, the user is a teaching assistant for an intro ethics course, and they've been stuck in a debate with a friend about Taurek's "numbers don't count" argument. They need a tailored case study to resolve whether giving each person an equal chance truly avoids number aggregation or subtly relies on it. 

  First, I need to unpack their core request: they want a scenario where all morally irrelevant factors are neutralized (age, relationships, etc.), outcomes are probabilistic, and expected lives saved are equal. This forces the debate to hinge purely on whether randomization respects individual claims without smuggling in numbers. 

  Hmm... the hospital triage scenario feels right—realistic, high-stakes, and naturally probabilistic. Making it about ventilator allocation during a power outage creates urgency. The key is designing probabilities so Group A (smaller) has higher individual survival chances but lower expected total saves than Group B (larger group with lower individual odds). But the user insisted expected lives must be equal! Ah, got it: adjust Group B's survival probability downward until 5×P_B = 1×P_A. Perfect. 

  Now testing the three approaches: 
  1. Expected utility stays silent (both save 0.8 lives). 
  2. Taurek permits saving either group since no aggregation. 
  3. Equal-chance mandates Group A because individuals get 1/6 survival chance vs. Group B's 1/30. The math exposes that randomization *does* weight groups by size—it's unavoidable. 

  Scaling to 5 vs. 500 will be revealing. Equal-chance now demands saving the one (0.00196% chance per person!) which is absurd—proving it numerically sensitive. Taurek still permits either, but saving one over 500 feels monstrous. The user’s friend might retort that equal-chance isn’t *intending* to count numbers, but the procedure structurally does. 

  Final verdict? The case kills two birds: shows randomization requires aggregation, and that Taurek’s view becomes indefensible at scale. User wins the argument. Should mention that real triage might use random selection *within* groups to soften this, but that’s beyond the scope.
answer: |-
  Here’s a case designed to your specifications, followed by analysis:

  ### The Case: **Coastal Storm Triage**
  **Setting:** You’re a medic on a rescue boat responding to a flooded coastal town after a hurricane. Two groups are stranded on rooftops, screaming for help. Group A has **1 person** on a crumbling roof. Group B has **5 people** on a more stable roof farther away. Your boat can only reach one group before the storm surge hits.  
  **Outcomes:** If you reach Group A, you’ll rescue the single person with **80% probability** (the roof might collapse during approach). If you reach Group B, each of the 5 has a **16% individual survival probability** (distance and debris create high risk; rescues are attempted sequentially with limited time).  
  **Key Probabilities:**  
  - Expected lives saved if you save Group A: 1 × 0.8 = **0.8 lives**  
  - Expected lives saved if you save Group B: 5 × 0.16 = **0.8 lives**  
  All individuals are strangers to you and each other, with identical health/age, and all die if not rescued. No prior obligations exist.  

  ---

  ### Analysis of Three Approaches  
  1. **Expected Lives Saved (Utilitarianism):**  
     - Both actions save 0.8 lives in expectation → **No verdict**. The approach is silent.  

  2. **Taurek’s View ("Numbers Don’t Count"):**  
     - Saving Group A or Group B is permissible. Each person faces death alone; their loss isn’t aggregated. You may choose either group based on personal preference (or flip a coin).  
     - **Verdict:** **Permissible to save either group**.  

  3. **Equal Chance to Each Person ("Fair Randomization"):**  
     - 6 people total. Each must get an equal survival chance: 1/6 ≈ **16.67%**.  
     - Saving Group A: The single person gets 80% (>16.67%), while Group B gets 0%. *Unfairly favors the one*.  
     - Saving Group B: Each of the 5 gets 16% (<16.67%), while Group A gets 0%. *Slightly disfavors all, but is closer to equal chance*.  
     - **Verdict:** **You must save Group B** (it brings individual chances closer to 16.67% for all).  

  ---

  ### What Makes the Approaches Diverge?  
  **The Critical Feature:** *Asymmetric individual probabilities relative to the "fair share" chance*.  
  - Saving Group A gives one person a high chance (80%) far exceeding their fair share (16.67%).  
  - Saving Group B gives each person a low chance (16%) slightly *below* their fair share (16.67%), but much closer than Group A’s option.  
  - Equal-chance reasoning demands minimizing deviation from 1/6 per person. The numbers (1 vs. 5) directly determine the "fair share" probability, so size isn’t sneaked in—it’s foundational.  

  **If De-Risked (No Probabilities):**  
  Suppose outcomes are certain: Saving Group A saves 1; saving Group B saves 5.  
  - Expected lives: 1 vs. 5 → Utilitarianism says save Group B.  
  - Taurek: Permissible to save either.  
  - Equal-chance: Flips a coin (since 1/6 vs. 5/6 can’t be approximated without risk).  
  *Result:* Equal-chance loses its non-permissive verdict, collapsing into Taurek or utilitarianism.  

  ---

  ### Scaling Up: 1 vs. 500  
  *Adjust probabilities to hold expected lives equal (0.8) and individual chances fixed:*  
  - Save the **one**: Still 80% chance for that person.  
  - Save the **500**: Each must have a 0.16% survival chance (500 × 0.0016 = 0.8 expected lives).  
  - "Fair share" survival chance per person: 1/501 ≈ 0.2%.  

  **Verdicts:**  
  - **Expected Lives:** Still silent (both save 0.8).  
  - **Taurek:** Still permits saving either.  
  - **Equal Chance:**  
    - Save the one: One person gets 80% (wildly over 0.2%); 500 get 0%.  
    - Save the 500: Each gets 0.16% (slightly under 0.2%); the one gets 0%.  
    → **You must save the 500** (0.16% is closer to 0.2% than 80% is).  

  **Crucial Takeaway:** Equal-chance *depends entirely on group size*:  
  - The "fair share" (1/n) shrinks as group size grows, forcing you to prioritize larger groups to avoid extreme unfairness to individuals.  
  - It *does* aggregate claims—just indirectly, via probability deviations.  

  ---

  ### How Critics Wiggle Out  
  **Taurek’s Defender:**  
  > "Equal-chance pretends to respect individuals but actually sacrifices the one to a near-certain death for a trivial gain (0.16% → 0.2%) for each of 500. That’s still aggregation! Taurek’s 'permission' avoids this by letting you save the one without guilt."  

  **Equal-Chance Defender:**  
  > "Taurek allows saving one over 500, which is monstrous. Equal-chance minimizes the worst *individual* deviation from fairness. In the scaled-up case, giving one person 80% is a 79.8% *over*-allotment; giving each of 500 a 0.04% *under*-allotment is less severe."  

  ---

  ### What Should Be Done?  
  In this case, **save Group B (the five)**. Equal-chance provides a workable, less arbitrary procedure than Taurek’s pure permission, while expected-value utilitarianism is indecisive. But the scaled-up case reveals that equal-chance prioritizes large groups—so it *does* count numbers, just through fairness to individuals rather than sums.  

  **Your Friend’s Error:** Equal-chance *requires* counting numbers to calculate the "fair share" probability. It’s not a back door—it’s the front door.
