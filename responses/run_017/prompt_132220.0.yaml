prompt: |-
  Hey — I'm putting together the framing doc for a grad seminar on reduction and emergence, and I want the criteria settled before we look at any positions. So: write me the desiderata that any adequate account of reduction (and of its failure, i.e. emergence) has to meet.

  Purpose, so you know what "adequate" means here: the theory should be good enough to say something action-guiding to a working scientist. She's got a macro-level model — a climate model, a population-genetics model, a model of flock behaviour — and a micro-level one, and she wants to know whether it's worth hunting for a derivation of the first from the second, and what it would even mean if there isn't one. So it's not a metaphysical theory of nature's levels for its own sake; it needs consequences for modelling practice.

  For each requirement, give the case or consideration behind it, and be honest about which ones are genuine constraints and which are just what one camp happens to demand. At minimum I want these on the table:

  - Derivation isn't enough: the classic bridge-principle story needs something on top of deducibility even in the easy cases, since the macro vocabulary doesn't appear in the micro one. What exactly does reduction have to add over and above "you can deduce it"?
  - Multiple realizability: the macro kind gets realized by wildly heterogeneous micro states. Is that a knockdown, or only a demand for a disjunctive bridge law — and what does each answer cost you?
  - The exclusion worry: if the micro story is causally complete, what's left for the macro to do? I want the desideratum here, not the solution.
  - Decoupled macro behaviour: cases where the macro regularity shrugs off changes in micro details you'd have expected to matter (critical phenomena and universality, that sort of thing). Should a theory of reduction be required to explain why the micro details drop out, or is that a separate virtue we're smuggling in?

  Two things I care about most.

  First, I think there's a conflation running through most of this literature and I want the list to force it open: a claim about what exist (are there macro properties over and above the micro ones), a claim about what can be derived (is there a derivation, and how strong is it), and a claim about what's predictable or controllable in practice (do you need the macro model to get the answer at all, even in principle). Those can come apart in both directions. Make each of them a seperate requirement, say which one the "autonomy of the special sciences" arguments actually need, and flag which one you think people really mean when they say "emergent".

  Second, there's a failure mode I've started calling phantom reduction: the micro model gets tweaked, in ways nobody thinks of as cheating, until it reproduces the macro behaviour — extra terms, fitted parameters, a convenient choice of boundary conditions — and everyone declares reduction achieved, but nothing has been explained and the tuned micro model predicts nothing outside the regime it was fitted in. I want a requirement that rules that out, and I want you to argue for what it should be: what has to be true of a reduction beyond output-matching? Novel prediction outside the fitted regime? Stability of the derivation under perturbation of the micro assumptions? Bridge principles that are independently checkable? Then say whether your requirement is satisfiable at all, and whether it quietly collapses back into the multiple-realizability requirement or is genuinely independent of it.

  Then: is any subset of your own list jointly unsatisfiable? If so, which, and why — that's the part I most want to see. And name the single requirement that does the most work in excluding candidate accounts, plus the one you'd drop first if you had to drop one.

  Last, a short scorecard (table is fine, a paragraph each is fine) for three familiar shapes of view: the bridge-law / deduce-the-macro-from-the-micro-plus-bridges picture; the "reduction is a limit or approximation relation between models" picture, renormalization-group and continuum-limit style; and the "emergence is about the causal powers of macro configurations" picture. Just enough to see where each breaks against your list. And please don't pad it with a reading list or citations — I know the literature, I'm after the criteria.
reasoning: |-
  Okay, the user is putting together a framing document for a grad seminar on reduction and emergence. They need desiderata that any adequate account must meet, specifically for guiding working scientists. The focus is on practical implications for modeling, not just metaphysical theories. 

  First, I need to unpack their main concerns. They mention derivation not being sufficient, multiple realizability, exclusion worry, and decoupled macro behavior. They also want to separate three aspects: existence, derivability, and predictability. Plus, they're worried about phantom reduction. 

  Hmm, the user's deeper need seems to be clarity on how these philosophical concepts translate to scientific practice. They want to equip scientists with criteria to decide when pursuing reduction is worthwhile. The phantom reduction issue is critical because it addresses a real problem in scientific practice where models are tweaked to fit but lack explanatory power.

  Breaking down the three conflated claims: existence, derivability, predictability. The autonomy arguments in special sciences probably hinge on predictability, since scientists care about whether macro models are indispensable. But when people say "emergent," they might mix all three, though predictability is key for practice.

  For phantom reduction, the requirement should ensure that reduction isn't just curve-fitting. Independently checkable bridge principles or stability under perturbation could work. Novel prediction is ideal but might be too strong. Stability is more feasible and avoids collapsing into multiple realizability.

  Now, checking if any desiderata conflict. For example, requiring both explanatory depth and multiple realizability might clash. If a reduction must provide micro-explanations but the macro kind is multiply realizable, a disjunctive bridge law might seem shallow. Also, causal exclusion vs. autonomous causation could conflict with causal completeness at the micro level.

  The bridge-law approach fails on multiple realizability and phantom reduction. The RG/limit approach handles decoupling but struggles with existence and causal exclusion. Causal powers view tackles existence and exclusion but might ignore derivability and predictability.

  The user probably wants to highlight these tensions to show students where different theories fall short. Emphasizing the separation of existence, derivability, predictability will help avoid conflation. Also, stressing practical guidance for scientists is crucial, so predictability and anti-phantom criteria are vital.
answer: |-
  Here’s a set of desiderata for accounts of reduction/emergence, designed to meet your goals (action-guidance for scientists, disentangling conflations, addressing phantom reduction). Requirements are labeled **R1–R10**, grouped by your key themes. For each, I specify: the core demand, its motivation (case/consideration), and whether it’s a genuine constraint (GC) or a camp-specific demand (CSD).

  ---

  ### **I. Core Derivation Requirements**
  1.  **R1: Vocabulary Resolution**  
      *   **Demand:** Must specify how macro-vocabulary (e.g., "temperature", "gene frequency", "flock cohesion") relates to micro-vocabulary *beyond mere deducibility of macro-predictions*.  
      *   **Case:** Deriving Boyle's Law from kinetic theory requires identifying "temperature" with "mean molecular kinetic energy". Deduction alone doesn't establish this semantic link.  
      *   **Constraint:** GC. Without this, you have prediction-matching, not reduction (leads to phantom reduction).  

  2.  **R2: Non-Ad Hoc Bridge Principles**  
      *   **Demand:** Bridge principles (connecting macro/micro vocab) must be independently motivated/checkable, not *post hoc* constructs *only* justified by enabling the derivation.  
      *   **Case:** Phantom Reduction: Adding a "flock spirit force" to particle interactions to fit flocking models isn't reduction; defining "cohesion" via specific metrics of particle proximity/direction (measurable independently of flock outcomes) might be.  
      *   **Constraint:** GC. Rules out phantom reduction. Satisfied by bridge principles grounded in micro-theory or direct measurement. Novel prediction/stability are *evidence* for non-ad hoc-ness but not strictly required.  

  ---

  ### **II. Handling Multiple Realizability & Heterogeneity**
  3.  **R3: Multiple Realizability Tolerance**  
      *   **Demand:** Must allow that a macro-state/property can be realized by diverse/disjunctive micro-states.  
      *   **Case:** "Fitness" in population genetics is realized by countless genotypic combinations; "solidity" by diverse atomic lattices.  
      *   **Constraint:** GC (for most scientists). A theory *requiring* unique micro-realizers is inadequate.  
  4.  **R4: Explanatory Depth (vs. Disjunction)**  
      *   **Demand:** Should explain *why* diverse micro-states realize the *same* macro-property, avoiding brute-force disjunctions.  
      *   **Case:** Universality in phase transitions: Diverse micro-systems exhibit same critical behavior because micro-details become irrelevant near critical points (explained by RG flow). A disjunctive bridge law ("critical point = micro-config A or B or C...") lacks this insight.  
      *   **Constraint:** CSD (but strong GC for many). Favors accounts (like RG) providing unifying explanations over Nagelian "disjunctive bridge laws".  

  ---

  ### **III. Disentangling Conflations (Existence, Derivation, Predictability)**
  5.  **R5: Ontological Distinctness (Existence)**  
      *   **Demand:** Must clarify if macro-properties/entities exist "over and above" micro-constituents.  
      *   **Case:** Is a hurricane "just" air/water molecules, or a distinct entity with its own properties?  
      **Constraint:** CSD (primarily metaphysical). *Autonomy arguments often need only R6/R7.*  
  6.  **R6: Derivational Strength**  
      *   **Demand:** Must characterize the *type and robustness* of derivation possible: exact, approximate, asymptotic, limit-based, requiring contingent initial/boundary conditions, stable under perturbations?  
      *   **Case:** Deriving Navier-Stokes equations from molecular dynamics requires coarse-graining and assumptions about molecular chaos (approximate/limit-based). Deriving rigid body mechanics from atomic models requires fixed lattice assumptions (fragile).  
      *   **Constraint:** GC. Directly impacts scientist's decision to pursue derivation.  
  7.  **R7: Predictable Autonomy (Predictability)**  
      *   **Demand:** Must address whether the macro-model is *predictively indispensable* – even in principle – for certain phenomena, regardless of ontological status or derivability.  
      *   **Case:** Predicting flock behavior *in practice* requires agent-based models; predicting critical exponents *requires* RG methods, not simulating 10²³ atoms.  
      *   **Constraint:** **GC (Crucial).** *This is the core need for "autonomy of special sciences" arguments.* **When scientists say "emergent", they often *mean* this (predictive autonomy), though they may *talk* like R5.**  

  ---

  ### **IV. Causation, Exclusion & Decoupling**
  8.  **R8: Causal Completeness Response**  
      *   **Demand:** Must address the challenge: If micro-physics is causally closed, how can macro-properties have distinct/explanatory causal powers?  
      *   **Case:** Does "selection pressure" *cause* allele frequency change, or is it "just" particle motions doing all the causing?  
      *   **Constraint:** GC (for accounts invoking macro-causation). A desideratum *to address the worry*, not to endorse/preclude solutions.  
  9.  **R9: Decoupling Explanation**  
      *   **Demand:** Should explain *how/why* macro-regularities can be insensitive to (decoupled from) specific micro-details.  
      *   **Case:** Universality, hydrodynamic behavior, many ecological patterns.  
      *   **Constraint:** CSD/GC Hybrid. Strongly desirable for understanding *why* reduction succeeds/fails in specific ways (R4 related), but a separate virtue from basic reduction criteria.  

  ---

  ### **V. Anti-Phantom Reduction Requirement**
  10. **R10: Non-Fragile Derivation**  
      *   **Demand:** A successful reduction requires the derivation of the macro-model (or its key regularities) to be *stable* under reasonable variations of micro-assumptions, initial/boundary conditions, or parameter values *within the intended domain*.  
      *   **Case:** Phantom Reduction: Tweaking micro-interaction parameters until flocking emerges *only for one specific setup* isn't reduction. Deriving diffusion from random walks that holds for a *range* of lattice types/scattering probabilities is.  
      *   **Constraint:** **GC (Key against phantom reduction).** **Independent of R3:** A multiply realizable macro-property (R3) can still have a non-fragile derivation if the derivation captures the relevant invariant features (e.g., RG fixed points). Novel prediction is ideal evidence but not required; stability is the core demand. Satisfiable if the macro-behavior depends on robust micro-features.

  ---

  ### **Tensions & Trade-offs**
  *   **Joint Unsatisfiability?** Significant tension exists between:
      *   **R4 (Explanatory Depth)** + **R10 (Non-Fragile Derivation)** vs. **R3 (Multiple Realizability)**: Demanding a deep, non-disjunctive explanation (R4) and derivation stability (R10) for a *radically* multiply realizable property (R3) might be impossible if the micro-realizers share no robust common features exploitable in a derivation. *Example:* "Jade" (jadeite/nephrite) – a stable, deep reduction to a *single* micro-structure is impossible; you need disjunction or a higher-level (e.g., mineralogical) account.
      *   **R7 (Predictable Autonomy)** vs. **R6 (Strong Derivation)**: If a macro-model is predictively indispensable (R7), then by definition, a strong derivation (R6 – exact or highly robust) isn't achievable *for that purpose*. Accounts emphasizing R6 may downplay R7.
  *   **Most Exclusionary Requirement:** **R10 (Non-Fragile Derivation)**. It rules out most simplistic bridge-law accounts and phantom reductions. Nagel-style reduction often fails here.
  *   **First to Drop:** **R5 (Ontological Distinctness)**. Least action-guiding for the scientist focused on modeling/prediction (R6/R7). Useful for metaphysics, less so for practice.

  ---

  ### **Scorecard of Views**

  | View                          | Key Tenets                                                                 | Breaks Against Desiderata                                                                                                                                 |
  | :---------------------------- | :------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Bridge-Law / Nagelian**  | Reduction = Deduce macro-laws from micro-laws + Bridge Principles.         | **R3/R4:** Handles MR only via brute disjunctions (fails depth). **R10:** Prone to phantom reduction (ad hoc bridges). **R7/R9:** Ignores autonomy/decoupling. |
  | **2. Limit/Approximation (RG/Continuum)** | Reduction = Show macro-model is limiting case/asymptote of micro-model (often via coarse-graining). | **R5/R8:** Often neutral/avoidant on ontology/causation. **R1:** Can be weak on vocabulary resolution (focuses on equations). **R3:** May struggle with *radical* MR not tied to universality classes. **Strengths:** R2, R4, R6, R7, R9, R10. |
  | **3. Causal Powers Emergence** | Emergence = Macro-configurations have novel, downwardly-exercised causal powers not possessed by parts. | **R6/R10:** Often downplays derivability/stability. **R8:** Central challenge (must solve exclusion). **R7:** May conflate predictive autonomy with ontological novelty. **Strengths:** R5 (asserts distinctness), R8 (tackles it head-on). |

  ---

  This framework forces open the existence/derivation/predictability conflation (R5/R6/R7), directly addresses phantom reduction (R2, R10), and provides clear criteria for evaluating whether pursuing a micro-derivation is worthwhile (strength of R6, satisfaction of R10, failure of R7). The scientist's key takeaway is: **A reduction is adequate if it provides non-ad hoc, stable derivations of macro-regularities (R1, R2, R6, R10), explains insensitivity to micro-details where it exists (R4, R9), and clarifies predictive autonomy where derivation fails (R7).** Ontology (R5) and causation (R8) matter primarily for explanatory interpretations, not core modeling decisions.
