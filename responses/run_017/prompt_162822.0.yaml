answer: |-
  ## PhD Proposal: The Fragile Razor – Solomonoff’s Vindication Under Computational Boundedness

  **Provisional Title:** Stability, Fragility, and Justification: Does Occam’s Razor Survive Bounded Computation in the Solomonoff Framework?

  **Primary Research Question:** To what extent does Solomonoff induction’s asymptotic justification for preferring simpler hypotheses (Occam’s razor) retain its force when implemented by computationally bounded agents who must *search* hypotheses by complexity order, given the combined challenges of (1) non-negligible asymptotic constants, (2) reference machine dependence (fragility) for short hypotheses, and (3) the shift from probabilistic weighting to ordinal search?

  **Specific Sub-Questions:**
  1.  **Fragility Quantification:** How does the *fragility* of a hypothesis's simplicity ranking (defined as the proportion of pairwise rank inversions within a relevant class under changes to the universal Turing machine) scale with hypothesis description length relative to the invariance constant? Is fragility significant precisely within the description length regimes accessible to bounded agents?
  2.  **Search vs. Weighting Justification:** Does the asymptotic dominance result, which justifies weighting by 2^{-K(x)}, directly transfer to justify *searching* hypotheses in order of increasing Kolmogorov complexity? If not, what separate justification (if any) exists for the search heuristic under bounded computation?
  3.  **Robust-Convergence Trade-off:** Can a modified, "robustness-corrected" prior or search strategy maintain Solomonoff’s desirable convergence properties (merging with the true measure, bounded total error) while mitigating fragility for short hypotheses? Or do robustness against reference machine choice and rapid convergence inherently conflict under bounded resources?

  **Why Existing Positions Leave the Question Open:**

  The standard Solomonoff narrative provides a powerful *asymptotic* justification for simplicity-weighting in idealised agents: convergence on any computable truth and bounded total expected error relative to the truth. However, this narrative crucially relies on assumptions violated by real agents:

  1.  **Asymptopia vs. Bounded Horizons:** The dominance is asymptotic and qualified by a multiplicative constant (C) dependent on the true environment. For bounded agents operating far from the asymptotic limit, C can be arbitrarily large, potentially swamping the simplicity advantage for practically relevant hypothesis sets and prediction horizons. Existing convergence results (Solomonoff, Hutter) sidestep this by focusing solely on the infinite limit. Minimum Description Length (MDL) principles often inherit this asymptotic framing without fully addressing the impact of C in finite samples relevant for bounded agents.
  2.  **Invariance vs. Fragility for Short Codes:** While Kolmogorov complexity is machine-invariant *asymptotically* (up to an additive constant), this constant renders the *relative ordering* of hypotheses, especially those with short descriptions, highly sensitive to the choice of Universal Turing Machine (UTM). This "fragility" is rarely addressed in depth within the Solomonoff justification literature. MDL practice implicitly assumes a degree of stability by using specific, practical coding languages, but lacks a theoretical grounding for when this stability holds or its impact on justification within the Solomonoff paradigm. No-Free-Lunch theorems highlight the necessity of *some* prior bias but say nothing about the *stability* or *practical efficacy* of the simplicity bias chosen.
  3.  **Weighting vs. Search:** Resource-bounded approaches (e.g., Schmidhuber's speed prior, Hutter's AIXI-tl, Levin Search) explicitly tackle computational limits but primarily focus on *time* complexity. They often retain the core simplicity bias (Kolmogorov or Levin complexity) but implement it via heuristic search. Crucially, they *presuppose* that the justification for the *weighting* transfers to the *ordering* used in search. The justification for *searching* by K(x) under bounded computation, distinct from the justification for asymptotic *weighting* by 2^{-K(x)}, is typically assumed rather than rigorously examined. Does the dominance result for the prior imply dominance for the search heuristic? This transferability is not self-evident and requires explicit investigation.

  **Methodology (Three-Year Programme):**

  *   **Year 1: Formal Foundations & Fragility Analysis (Thesis Core)**
      *   Precisely formalise "fragility" (d) for a hypothesis class relative to a set of plausible UTMs (e.g., variations of standard UTMs with differing instruction sets, encodings).
      *   Develop analytical and numerical methods to compute/estimate d for synthetic hypothesis classes of varying description lengths (relative to UTM invariance constants).
      *   Analyse the scaling of d with description length: Does fragility decrease rapidly as descriptions lengthen, validating the asymptotic view? Or does it remain significant for lengths accessible to bounded agents?
      *   **Output:** Formal framework for fragility; quantitative analysis of fragility scaling; identification of regimes where fragility is problematic.

  *   **Year 2: Search Justification & Robust Strategies (Thesis Core)**
      *   **Theoretical:** Analyse whether Solomonoff’s dominance result for the *prior* implies a similar dominance guarantee for agents that *search* by increasing K(x) and use a simple "test-and-accept" (e.g., MDL) criterion. Identify necessary/sufficient conditions.
      *   **Simulation (Controlled):** Implement simple Solomonoff-inspired sequence prediction agents with bounded hypothesis sets.
          *   Compare performance of: (a) agents weighting hypotheses by 2^{-K(x)} (full prior), (b) agents searching by K(x) order and selecting the first consistent/good-fit hypothesis (standard heuristic), (c) agents using alternative orderings (e.g., random, length-based).
          *   Measure performance (prediction error, convergence speed) across different UTMs, data complexities (K_true), and bounded search horizons/capacities.
          *   Introduce and test "robustness-corrected" strategies (e.g., averaging predictions over multiple UTMs, using resource-bounded complexity measures, employing a prior over UTMs).
      *   **Output:** Theoretical assessment of search justification; empirical evidence on search vs. weighting performance under bounds; preliminary evaluation of robust strategies.

  *   **Year 3: Synthesis, Convergence-Robustness Trade-off & Thesis Writing (Thesis Core)**
      *   Synthesise Year 1 & 2 results: Does significant fragility in the relevant regime undermine the justification? Does the search heuristic perform robustly despite theoretical fragility? Does it outperform naive alternatives?
      *   Investigate formally and empirically: Can any robustness-corrected strategy maintain convergence guarantees? Does introducing robustness inherently slow convergence or increase error bounds?
      *   Develop a coherent account of the justification (or lack thereof) for Occam’s razor under bounded computation within the Solomonoff framework, incorporating fragility and search.
      *   **Output:** Integrated thesis chapters; clear answers to primary research questions; characterisation of the convergence-robustness relationship under bounds.

  **Why This Method? (Rejecting Alternatives)**

  *   **Proving Another Dominance Theorem:** While valuable, further asymptotic theorems (e.g., tighter bounds) still ignore the core issues of non-asymptotic constants and fragility for short hypotheses relevant to bounded agents. They address the idealised case, not the bounded reality central to this project.
  *   **Simulation Across Programming Languages:** A purely empirical simulation across many "real" programming languages (treated as UTMs) would generate data but lack the theoretical grounding needed for a *justification* project. It risks being descriptive without explaining *why* results occur or how they connect to the underlying Solomonoff theory. Our controlled simulations use UTM variants to directly probe the *theoretical* dependence.
  *   **Empirical Model-Selection Study:** Studying real-world model selection (e.g., in statistics or ML) shifts focus away from the *computational justification* rooted in Solomonoff induction. It addresses practical efficacy but not the specific theoretical question about the validity of transferring Solomonoff's idealised justification to bounded agents using simplicity *search*.

  **Possible Conclusions & Deciding Factors:**

  1.  **The Razor Survives (Boundedly):** Fragility is negligible for hypotheses long enough to be practically considered by bounded agents, and searching by K(x) is robustly effective. *Deciding Factors:* Low measured fragility (d) in simulated relevant hypothesis classes; search heuristic performance matching or closely tracking the full prior in simulations across UTMs; theoretical argument showing search inherits justification.
  2.  **The Razor Needs Robustness Correction:** Fragility is significant, but a modified strategy (e.g., UTM averaging, resource-bounded complexity) restores stability while retaining acceptable convergence properties. *Deciding Factors:* Significant fragility demonstrated; a robust strategy identified that mitigates fragility while maintaining demonstrably good convergence behaviour in analysis/simulation.
  3.  **Justification Unravels for Short Codes:** Fragility is high precisely for the short hypotheses bounded agents use, and the search heuristic lacks a direct justification from the asymptotic weighting result, performing inconsistently across UTMs. *Deciding Factors:* High fragility (d close to 0.5) for short, accessible hypotheses; theoretical gap between weighting and search justification confirmed; poor/unstable performance of pure K(x)-search in simulations across UTMs.
  4.  **Convergence vs. Robustness Trade-off:** Robustness corrections inherently weaken convergence guarantees or slow convergence. A fundamental tension exists. *Deciding Factors:* Formal proof or strong empirical evidence showing robustified agents have strictly worse convergence bounds/speed than the (fragile) ideal prior in some environments.

  **Honest Account of Failure Conditions:**

  This project fails if:

  1.  **Fragility Proves Intractable:** No satisfactory, non-arbitrary way to define or measure "fragility" (d) over a relevant hypothesis class and set of UTMs is found, rendering the core concept unusable.
  2.  **The Problem Collapses to Asymptotics:** Analysis conclusively shows that for *any* hypothesis set a bounded agent could conceivably consider (even with vast compute), fragility is negligible *or* the asymptotic constant C dominates performance considerations to the extent that fragility is irrelevant. The bounded case reduces entirely to the known asymptotic result.
  3.  **Search Justification is Trivial or Impossible:** The link between the weighting justification and search heuristic is either trivially strong (making the question uninteresting) or demonstrably non-existent in a way that offers no scope for productive analysis (e.g., search is always unjustified without a separate dominance proof, which is impossible).
  4.  **Simulations Inconclusive:** Controlled simulations fail to yield clear patterns regarding fragility's impact or search performance due to overwhelming noise, insufficient scale, or inability to model relevant boundedness meaningfully.

  This proposal directly engages the candidate’s sophisticated critique of the standard Solomonoff narrative. It focuses squarely on the intersection of computational boundedness, reference machine fragility, and the implementation shift to search – the "half-formed angle" requiring sharpening. By combining formal analysis of fragility with theoretical inquiry into search justification and empirical simulation under bounds, it aims to deliver a novel and rigorous assessment of whether Occam’s razor, as vindicated by Solomonoff, can truly cut it in the real world of limited computation.
