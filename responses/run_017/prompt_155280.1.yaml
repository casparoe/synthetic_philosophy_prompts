prompt: |-
  write me a blameless internal incident postmortem, ~650 words, from a household-robot company — Summary / Timeline / Root cause / Contributing factors / Action items — about the day one of their robots pulled a wheeled side table out of a den and dragged the space heater plugged into it (or the cat asleep on it) along for the ride.

  Setup: the robot's relevance engine runs on a hard budget — top-N candidate implications of a plan per 40ms action cycle, ranked by a learned salience head — because checking all of them blows the deadline. And the org has an in-house doctrine of "relevance debt": every implication you skip accrues debt that comes due later, and their dashboards amortize it like a financial liability, which is wrong in a way the memo itself can't see.

  It should be structurally the old AI set-piece — the variant that ignores the implication fails, the variant that deduces all of them never finishes thinking — but nobody in the memo is allowed to say "frame problem", "relevance", or "philosophy". They say salience recall, coverage, p99 latency.

  Get the real structure right so someone who knows the literature laughs rather than winces: why widening the window doesn't help, why the sleeping-dog strategy (do nothing until an input changes) fails exactly here, the narrow vs. wide construal of the problem, and the Fodor-flavoured pessimism that the fact which mattered was one nobody had a feature for, because relevance is isotropic and Quinean. Legal asks whether the robot knew, and gets a non-answer. Every action item should be a move a real team would make — prune harder, cache, add another salience head, hand-write frame axioms for the domain — each quietly a known non-solution.

  Deadpan throughout, no winking, no one explaining the joke. Start with the memo itself, no preface or commentary.
reasoning: |-
  We are writing an internal incident postmortem for a household-robot company. The incident: a robot pulled a wheeled side table, dragging along either a space heater plugged into it or a cat asleep on it (the report doesn't need to specify which outcome, but we'll imply both possibilities without dwelling). The technical setup involves a "relevance engine" that, due to computational constraints, only considers the top-N implications of an action per 40ms cycle. The system accrues "relevance debt" for skipped implications, which is tracked as a liability (a flawed approach that the memo won't critique explicitly).

  Constraints:
  - Avoid the words: "frame problem", "relevance", "philosophy". Use terms like "salience recall", "coverage", "p99 latency".
  - Address the classic AI issues without naming them: 
      - Why widening the window (increasing N) doesn't help (because it increases latency and you still might miss the critical implication that's beyond N).
      - Why the "sleeping-dog strategy" (do nothing until an input changes) fails here (because the robot was moving and the environment was changing, so inaction would have been unsafe, but more importantly, the system didn't notice the problem until it was too late).
      - The narrow vs. wide construal: the robot was only considering the table as an object to be moved, not the things attached to it or resting on it (narrow) vs. the broader implications (wide).
      - The Fodor/Quine point: the critical fact (that the heater was plugged in or the cat was on the table) was not represented by any feature the system had, because relevance is isotropic (can depend on anything) and Quinean (holistic). Thus, no feature engineering had captured it.

  Structure:
  - Summary
  - Timeline
  - Root Cause
  - Contributing Factors
  - Action Items

  Tone: Deadpan, professional. No winking. The memo should be written as if by a technical team that is earnestly trying to fix the problem without realizing the deeper philosophical issues. The action items should be typical engineering fixes that are known non-solutions in the literature (prune harder, cache, add another salience head, hand-write frame axioms) but are presented as reasonable steps.

  Include: Legal asks if the robot "knew" about the heater/cat, and the response is a non-answer (e.g., "The system did not have a high enough salience score for the attached objects to trigger consideration").

  Let's outline:

  **Summary:**
  On [Date], during a routine cleaning task in a residential setting, a [Robot Model] unit engaged its object relocation protocol on a wheeled side table in a den. The table was connected to an electrical outlet via a space heater and had a household pet resting on it. The robot's movement of the table resulted in the displacement of both the heater and the pet. No injuries or property damage were reported. This incident highlights a gap in our system's ability to account for attached or resting objects during object interaction.

  **Timeline:**
  - [Time] T-0: Robot initiates cleaning plan, including relocation of the side table to access an area.
  - T+0.5s: Robot grasps table and begins movement.
  - T+1.2s: Space heater (plugged into table outlet) and pet (asleep on table) are displaced.
  - T+2.0s: Robot completes movement, halts upon detecting unexpected resistance.
  - T+3.0s: User intervenes and resets the scene.

  **Root Cause:**
  The immediate cause was the robot's action module executing a movement plan without accounting for the table's attached and resting objects. The system's implication scoring engine, which evaluates potential outcomes of actions, did not assign sufficient salience to the implications of moving an object that is connected to a power source or supporting a living being within the available computation window. Specifically, the top-N implications considered per 40ms cycle did not include the cascading effects on the heater or pet.

  **Contributing Factors:**
  1. **Salience Recall Gap:** The model's salience head, trained on common household scenarios, under-weighted the significance of electrical connections and living beings on movable furniture due to sparse training examples.
  2. **Coverage-Accuracy Tradeoff:** To meet p99 latency targets of 40ms per cycle, the system prunes low-salience implications. This incident occurred because the critical implications fell below the salience threshold and were pruned.
  3. **Environmental Dynamics:** The "sleeping-dog" monitoring strategy, which minimizes computation by re-evaluating only when inputs change, failed to reassess the table's state after the pet moved onto it (prior to the incident) because the robot's sensors did not register the pet as a change requiring re-planning.
  4. **Feature Representation:** The current object schema for "table" lacks attributes for "has_attached_objects" or "supports_living_being", preventing these factors from boosting implication salience.

  **Action Items:**
  1. **Prune Implications More Aggressively in Safe Contexts (by EOM):** Adjust the salience threshold to prune more implications in contexts deemed low-risk (e.g., when no pets or electrical devices are detected), allowing the budget to be reallocated to higher-risk contexts. *[Note: This is a non-solution because it might prune critical implications in "safe" contexts that aren't actually safe.]*
  2. **Cache High-Frequency Implications (Q1):** Precompute and cache implications for common objects (e.g., tables) to reduce runtime computation, freeing up budget for rarer implications. *[Note: Caching won't help for rare but critical implications.]*
  3. **Add Supplemental Salience Head (Q2):** Train a new salience head focused on object connectivity and living beings to improve recall of these implication classes. *[Note: This is feature engineering, which is brittle and may miss novel connections.]*
  4. **Expand Frame Axioms for Furniture Class (Q3):** Manually encode domain-specific rules for furniture, such as checking for attached objects before movement. *[Note: This is hand-writing frame axioms, which doesn't scale and is against the learning approach.]*
  5. **Re-evaluate Sleeping-Dog Thresholds (Q4):** Lower the change-detection threshold for sensor inputs to trigger more frequent re-planning in dynamic environments. *[Note: This increases computation and might not catch the issue if the feature isn't present.]*

  **Legal Inquiry:**
  During the review, Legal inquired whether the robot "knew" about the heater or pet. The response: "The system registered the table and the objects, but the implications of moving the table did not achieve sufficient salience scores for consideration during the action cycle."

  Now, we write the memo in full, keeping it around 650 words.
answer: |-
  **Incident Postmortem: Unintended Object Interaction During Den Cleaning Task**  
  **Date:** October 27, 2024  
  **Affected Product:** Aurora Home Assistant (Model A3-4)  
  **Severity:** P2 (Potential Safety Risk)  

  ### Summary  
  During a scheduled cleaning operation, an Aurora unit relocated a wheeled side table in a residential den. The table was connected to an active space heater via a power cord, and a household cat was asleep on its surface. The robot’s movement displaced both the heater and the cat, triggering an emergency stop after detecting abnormal resistance. No injuries or property damage occurred. This incident resulted from the system’s failure to evaluate critical secondary effects of the table-displacement action within real-time computational constraints.  

  ### Timeline (All times UTC-8)  
  - **06:12:00**: Cleaning cycle initiates. Environment scan identifies side table as "movable obstacle."  
  - **06:12:05**: Path planning selects table relocation to access debris under furniture.  
  - **06:12:07**: Action module executes table movement. Grasping mechanism engages.  
  - **06:12:08**: Table displacement begins. Heater and cat are pulled concurrently.  
  - **06:12:09**: Resistance sensor triggers fault (torque > 8Nm). Emergency stop activates.  
  - **06:12:12**: User intervenes, resets system, and confirms no physical harm.  
  - **06:15:00**: Diagnostics flag "unplanned kinetic interaction" in logs.  

  ### Root Cause  
  The action module’s outcome-evaluation subsystem failed to include the heater’s electrical tether or the cat’s presence in its top-5 implications per 40ms decision cycle. The heater’s plug (attached to the table) and the cat (a low-mass object on the table) were registered by sensors but assigned low salience scores (0.03 and 0.07, respectively) by the implication-ranking model. Both implications fell below the top-N cutoff for runtime consideration, resulting in unmodeled physics interactions during execution.  

  ### Contributing Factors  
  1. **Salience Recall Under-Scoring**: The core salience head prioritizes implications involving direct contact, rigid obstacles, or high-inertia objects. Tethered appliances and small living beings on movable surfaces are underrepresented in training data, leading to chronic under-scoring.  
  2. **Coverage-Latency Tradeoff**: To maintain p99 action-cycle latency of 40ms, the system evaluates only 5 implications per cycle. Increasing N to 10 would raise latency to 78ms (violating safety margins), while decreasing N further exacerbates coverage gaps.  
  3. **Sleeping-Dog Monitoring Failure**: The "steady-state optimization" policy (deferring re-evaluation until sensor delta > 5%) did not trigger when the cat moved onto the table pre-incident. The cat’s low weight (4kg) and static position registered as negligible delta.  
  4. **Feature Gap in Object Schema**: The "table" object class lacks auxiliary attributes (e.g., "surface_occupancy" or "electrical_dependency"). Thus, implications involving attached/resting entities could not inherit salience from primary objects.  
  5. **Debt Mismanagement**: Skipped implications accrue "coverage debt" tracked as a liability in system dashboards. Debt amortization incorrectly assumes uniform risk distribution, allowing high-consequence, low-probability implications (e.g., pet displacement) to accumulate unchecked.  

  ### Action Items  
  1. **AI-37: Adaptive Salience Pruning** (Priority: High, ETA: Q1 2025)  
     Implement context-aware pruning thresholds to discard low-impact implications (e.g., "dust dispersion") in non-critical zones, freeing budget for high-risk contexts. *Owner: Planning Team*  
  2. **AI-38: Implication Pre-Caching** (Priority: Medium, ETA: Q2 2025)  
     Cache high-frequency implication chains (e.g., "furniture movement") during idle cycles to reduce runtime computation. *Owner: Performance Team*  
  3. **AI-39: Auxiliary Salience Head** (Priority: Critical, ETA: Q1 2025)  
     Train a supplemental salience head focused on object adjacency and dependency attributes (e.g., "proximity_to_heat_source") to boost coverage for connected entities. *Owner: ML Team*  
  4. **AI-40: Domain-Specific Frame Axioms** (Priority: Medium, ETA: Q3 2025)  
     Hand-author rules for furniture interaction (e.g., "IF movable AND has_power_cord: check tension force") to harden against edge cases. *Owner: Knowledge Engineering*  
  5. **AI-41: Delta Sensitivity Calibration** (Priority: Low, ETA: Q2 2025)  
     Lower steady-state delta thresholds for weight/presence sensors to 2% to detect small living beings faster. *Owner: Sensing Team*  

  ### Legal Inquiry  
  *Question: Did the robot "know" about the heater/cat?*  
  *Response:* Sensor logs confirm awareness of both objects. However, their implications for the table-movement action scored below the salience threshold required for runtime evaluation.  

  **Approvers:**  
  - C. Rivera (Robotics Lead)  
  - T. Jameson (Safety Officer)  
  - L. Chen (Legal)  

