     But we might stop at Informed: if they don't know, then it's not that they don't want it, they just don't know. So without evidence they are informed, we stop: behavior may be due to misunderstanding.

  (b) Power users spend 40% time in a screen we were about to delete:
     - Forced? Maybe they have alternatives? 
     - Intentional? Probably: power users, repeated use. 
     - Informed? They are power users, so likely informed. 
     - Current? But note: we were about to delete, so maybe they are using it because they are used to it? Check if they are on old UI? If they are on new UI and it's still there, then current. 
     - Aligned? They might have given feedback? 
     - Robust? If we remove it, do they complain? 
     But note: the question is whether they want it? The time spent might be because it's inefficient? So we might need to see if they are achieving their goal? The procedure might pass, but we should note that time spent might indicate friction. However, the claim is that they want the screen? So if they spend time there, it might be because they find it useful? Or because it's slow? We don't have that in the checklist. But we have the model: what goal were they optimizing? If the model says they are trying to achieve something and that screen is the only way, then forced? But if there are alternatives, then they choose it. 

     We'll run the checklist.

  (c) Nag-banner metric: 
     - We are claiming: users want to do the thing the banner nags about? 
     - Forced? Maybe not: they could ignore? 
     - Intentional? They click to dismiss? That might be intentional but the goal is to dismiss, not to do the thing? So the model might infer the goal as "remove banner" not "do X". 
     - If the model is inferring the goal as "do X", then we have a problem because the same action (clicking) can have two goals: to do X or to dismiss. So in Question 2, we might have ambiguity. 
     - Then we stop: data cannot tell.

  So for (c), we might stop at Question 2: ambiguous intent.

  Now, limitations:

  - Cannot read minds: we infer from behavior and context.
  - Cannot resolve conflicts between behavior and self-reports without judgment.
  - Cannot account for unobserved alternatives (if there's a better way that we don't offer, we don't know they want that).
  - Without experiments, we cannot prove causality.
