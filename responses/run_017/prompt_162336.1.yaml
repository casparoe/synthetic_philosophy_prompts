  Now, run on three cases:

  (a) Advanced search not used: 
     - Forced? The default search is an alternative? So they choose default over advanced. 
     - Intentional? Probably: they know about advanced? 
     - Informed? Maybe not: they don't know advanced is more powerful? 
     - Current? Yes. 
     - Aligned? Maybe feedback says they want better search? 
