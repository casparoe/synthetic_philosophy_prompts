  Let's write the procedure in a box.

  **Procedure: "Does the data show users want X?" (Max 6 questions, 20 mins)**

  1. **Forced?**  
     - _Check:_ Are there at least two ways to achieve the same user goal? (If unsure, assume yes.)  
     - _Pass:_ Alternatives exist → Next.  
     - _Fail:_ No alternatives → Stop: "Behavior is forced, doesn't indicate preference."  

  2. **Intentional?**  
     - _Check:_ Is behavior deliberate? For model: get top-2 goals and probabilities.  
     - _Pass:_ Clear intent (e.g., no backtracking, model top goal prob. > 70% and gap to next > 30%) → Next.  
     - _Fail/Ambiguous:_ Accident (quick backtrack) or model ambiguity (top goal prob. ≤ 70% or gap ≤ 30%) → Stop: "Data cannot confirm intent."  

  3. **Informed?**  
