answer: |-
  ### Behavior-to-Preference Evaluation Checklist (6 Steps, 20 Min Max)  
  **Goal:** Decide if observed behavior (e.g., clicks, model inferences) proves "users want X" or indicates alternatives (e.g., ease, constraints, habit).  
  **Input:** Your event data (SQL-ready), the goal-inference model output.  
  **Output:** "Supports claim," "Rejects claim (with reason)," or "Data inconclusive—needs human judgment."  

  | Step | Question | Pass Condition | Fail Condition | Stop/Next | Notes |
  |------|----------|----------------|----------------|-----------|-------|
  | 1 | **Are there viable alternatives to X?** | Multiple paths exist to achieve the same user goal, and X is chosen. | Only one path exists (X is forced). | Stop if fail: "X was the only option." | Check: Query for distinct paths to same outcome (e.g., `SELECT DISTINCT action_sequence WHERE outcome = Y`). |
  | 2 | **Is the behavior uniquely intentional?** | Model: Top inferred goal has >70% probability, and gap to next goal is >30%. Behavior: No backtracking/undo within 5s. | Model: Multiple goals fit equally (top goal ≤70% or gap ≤30%). Behavior: Frequent undoes or misclicks. | Stop if fail: "Data ambiguous—could reflect multiple intents." | Handles your model issue. If ambiguous, end here—no cheap fix. |
  | 3 | **Is the user informed about X?** | >50% of users doing X have prior exposure (e.g., viewed docs, training, or used similar features). | New users dominate, or confusion signals (e.g., rapid abandonment after trying X). | Stop if fail: "Likely misunderstanding of X." | Join behavior data with user history (e.g., `JOIN user_events ON feature_exposure`). |
  | 4 | **Is the behavior current (not stale)?** | Consistent usage in the latest UI/version after 2+ weeks (adaptation period). | Usage drops >50% in new UI or fades over time post-change. | Stop if fail: "Cached habit, not preference." | Handles your old-UI issue. Compare cohorts: `WHERE ui_version = 'new' AND days_since_update > 14`. |
  | 5 | **Does feedback align?** (If data exists) | >60% of survey/ticket comments mention X as valuable. | >40% conflict (e.g., "I use X but hate it"). | Stop if fail: "Values conflict—needs human judgment." | Skip if no feedback. Conflict requires PM input. |
  | 6 | **Is behavior robust to friction?** (If A/B data exists) | Usage of X changes <20% when friction increases (e.g., banner removed, extra clicks added). | Usage drops >20% without nudges/incentives. | Stop if fail: "Driven by ease/nudge, not want." | Skip if no A/B tests. Uses your nag-banner case. |

  **Final Decision:**  
  - Pass all → "Supports claim: users want X."  
  - Any stop → Use fail reason.  
  - Skips (Steps 5–6) → "Supports claim but lacks feedback/robustness data."  

  ---

  ### Case Applications (3 Min Each)  
  **(a) Advanced search unused despite power**  
  - Step 1: Pass (alternatives exist: default search).  
  - Step 2: Pass (intentional if model shows goal=simplicity).  
  - Step 3: **Fail** (likely uninformed—check exposure: new users avoid it, no doc views).  
  - **Stop**: "Data shows misunderstanding, not lack of want."  

  **(b) Power users in screen slated for deletion**  
  - Step 1: Pass (alternatives exist).  
  - Step 2: Pass (model shows goal=efficiency).  
  - Step 3: Pass (informed—power users have history).  
  - Step 4: **Fail** (if new-UI users spend <10% time there).  
  - **Stop**: "Habit, not preference—screen not needed."  

  **(c) Nag-banner metric (+30% clicks)**  
  - Step 1: Pass (alternatives: ignore banner).  
  - Step 2: **Fail** (model ambiguity: same click could mean "do X" or "dismiss" with similar probability).  
  - **Stop**: "Data cannot confirm intent—inconclusive."  

  ---

  ### Limitations (For VP Doc Header)  
  **What This Procedure Cannot Do:**  
  - **Prove causality**—only shows correlation. Without experiments, we can't confirm if X causes satisfaction.  
  - **Capture unmet needs**—if users want something we don't offer, data stays silent.  
  - **Resolve subjective trade-offs**—e.g., when feedback conflicts with behavior (Step 5), humans must decide what to prioritize.  
  - **Override business constraints**—even if users "want" X, feasibility/cost may kill it.  
  - **Fix bad data**—garbage in, garbage out.  

  **Word Count:** 694 (checklist: 246, cases: 193, limitations: 119).
