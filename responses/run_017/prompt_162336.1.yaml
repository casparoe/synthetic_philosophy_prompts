prompt: |-
  Hey — I'm a backend engineer, no philosophy background, and I need something I can actually use. Please skip anything I'd have to look up: if you use a term from economics or ML, define it in one clause, and don't tell me to go read anything, I won't.

  The situation: every two weeks at sprint planning someone says "the data shows users want X" and I either have to back that or push back on it. The data is clickstream and event telemetry from about 4k internal engineers using a build/deploy dashboard my team owns, plus an experimental model one of our data scientists trained that looks at action sequences and guesses what goal a user was optimizing for (given what they did, infer what they wanted). Stakes are real — whatever we conclude decides what gets a quater of engineering time, and the VP of product signs off on it. I've got roughly 20 minutes per decision and my teammates know SQL and not much else.

  What I want: a procedure — ordered questions, six of them max, runnable in that 20 minutes — for deciding whether an observed pattern of behavior actually licenses the claim "these users want X," as opposed to "X was the easiest thing to do," "X was the only thing we made available," "they think they want X but are wrong about what X does," or "that behavior is stale habit and doesn't reflect anyone's current evaluation." For each question: what counts as a passing answer, what counts as a fail, where we stop with a no, and where the question has to be handed to a person because it's a values call and not a fact. Please be explicit about which steps are judgement calls dressed up as procedure.

  Three things I keep tripping over, handle them inside the procedure rather than as asides:

  - The model fits the data great and I have no way to tell whether the goal it inferred is the real one or just one of several that would produce the exact same clicks. Is there a cheap test for whether the data even pins down a single answer, and what do I do when it doesn't?
  - Half our users are still on a two-year-old UI because the rollout is gated, and they keep taking a path that no longer exists in the new one. Is that preference or cached muscle memory, and how do I tell?
  - Our favorite metric — the one I built the pipeline for, so I'm biased — went up 30% after we added a nag banner. I think people are clicking it to make it go away. Where does the procedure put that?

  Then run it on three cases, briefly: (a) almost nobody uses our "advanced search" even though it's strictly more powerful than the default; (b) power users spend 40% of session time in a screen we were about to delete; (c) the nag-banner metric. I want at least one of them to come out as "the data cannot tell you this," and I'd rather you tell me which one then flatter me.

  End with a short section on what this procedure can never do, written so I can paste it at the top of the doc where my VP will actually read it.

  Hard limit: 700 words total for the whole thing, with the checklist itself under 250. Bullets and a table are fine, I don't need prose.
reasoning: |-
  We are creating a procedure with max 6 questions. The procedure should help decide if observed behavior means "users want X" vs alternatives like ease, lack of options, misunderstanding, or habit.

  Three specific issues to address:
  1. Model uncertainty: the model fits well but we don't know if the inferred goal is the only one that fits. We need a cheap test for whether the data pins down a single answer and what to do when it doesn't.
  2. Old UI users taking a path that no longer exists: is it preference or muscle memory?
  3. Metric increase due to a nag banner: are users clicking to make it go away?

  The procedure must be runnable in 20 minutes by someone with SQL knowledge.

  We'll also run the procedure on three cases:
  (a) Almost nobody uses "advanced search" even though it's strictly more powerful.
  (b) Power users spend 40% of session time in a screen we were about to delete.
  (c) The nag-banner metric.

  One of these should come out as "the data cannot tell you".

  End with limitations.

  Word limit: 700 total, checklist under 250.

  Let's design the checklist:

  Question 1: **Is the behavior forced?** 
     - Check: Are there alternative actions that achieve the same user goal? If no alternatives exist (i.e., the system only allows one path), then the behavior doesn't indicate preference. 
     - Passing: Alternatives exist and the user chose X among them. 
     - Failing: No alternatives exist (then stop: behavior does not indicate preference for X, only that X was the only option). 
     - If alternatives exist, proceed.

  Question 2: **Is the behavior intentional?**
     - Check: Is there evidence that the behavior is a deliberate choice and not an accident? Look for patterns that suggest the user is aware of what they are doing (e.g., repeated actions, time spent, no immediate backtracking). Also, for the model: if the model's inferred goal is one of many that fit, then we can't be sure. 
     - Cheap test for model: If the same action sequence can be explained by multiple goals (ask the data scientist for the top-k goals and their probabilities; if multiple goals have high probability and they are very different, then ambiguity exists). 
     - Passing: Clear evidence of intent (e.g., the model assigns high probability to one goal and the goal is consistent with the user's context) OR direct evidence (like no backtracking, repeated use). 
     - Failing: Ambiguous intent (multiple goals fit) or evidence of accident (e.g., quick backtracking). If ambiguous, stop: data cannot tell. 
     - If ambiguous by model, ask data scientist for top-3 goals and their likelihoods. If the top goal is much more likely (e.g., >70% probability) then pass, else fail and stop.

  Question 3: **Is the behavior informed?**
     - Check: Is there reason to believe the user understands what X does? For example, if X is a feature, have they used it before? If it's new, have they seen the documentation? 
     - Passing: Evidence that the user has been exposed to information about X (e.g., they visited the docs, or they are a returning user who has used similar features) and the behavior is consistent with that understanding. 
     - Failing: The behavior is from a user who has never been exposed to information about X (e.g., new user) or there's evidence of confusion (e.g., they tried X and then immediately undid it). If failing, stop: behavior may reflect misunderstanding.

  Question 4: **Is the behavior current?**
     - Check: Is the behavior happening in the current context, or is it a stale habit? Especially for the old UI: are users who have switched to the new UI still doing the same thing? 
     - Passing: The behavior is observed in the current system (or in a comparable context) and when the user has had time to adapt (e.g., not in the first week after a change). 
     - Failing: The behavior is only in the old UI and not in the new, or it's only in the first week of using a new version (then it might be habit). Also, if the behavior is decreasing over time after a change, it might be habit. Stop: then it's habit, not current preference.

  Question 5: **Is the behavior aligned with stated preferences?**
     - Check: If available, look at user feedback (surveys, support tickets) about X. Do they say they want it? 
     - Passing: The behavior and the stated preferences align (e.g., they say they want X and they use it). 
     - Failing: They say they don't want X but use it (then maybe forced) or they say they want it but don't use it (then maybe not really wanted). But note: this is a values call? Actually, it's a fact if we have the data, but if not, we skip. 
     - If no feedback data, skip. If feedback conflicts, then it's a judgment call: we might need to weight behavior over words or vice versa? But we want to avoid values calls. So: if feedback exists and conflicts, mark as ambiguous and stop? Or note that the data is conflicting and we must make a judgment? We'll say: if feedback exists and conflicts, then it's a judgment call and we stop the procedure and flag for human discussion.

  Question 6: **Is the behavior robust to nudges?**
     - Check: If we have A/B tests or natural experiments (like the nag banner) where we changed the cost of doing X (e.g., made it harder or easier), how did behavior change? 
     - Passing: Behavior persists even when we make it slightly harder to do (or when we remove a nudge). 
     - Failing: Behavior changes dramatically when the cost changes (e.g., when we added a nag banner, clicks went up, but if we remove the nag banner, they drop). Then it's likely driven by the nudge, not inherent desire.

  But note: for the nag banner, we see an increase. So if we see a big change in behavior when we add a nudge, that suggests the behavior is not robust. We might not have an A/B test? So we have to use what we have.

  If we don't have A/B data, we skip. But we can sometimes look at natural variation? Maybe not in 20 minutes.

  We'll structure:

  **Procedure: "Does the data show users want X?" Checklist**

  1. **Forced?** 
     - _Check:_ Are there alternatives to X that achieve the same goal? 
     - _Pass:_ Yes, and users choose X. 
