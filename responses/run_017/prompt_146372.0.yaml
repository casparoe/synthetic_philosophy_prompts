prompt: |-
  Hi. I'm one of two people who cover the clinical ethics consult line at a 400-bed community hospital — the other is a nurse practitioner, I'm a hospitalist by training, and between us we have maybe one undergrad philosophy course that I mostly slept through. We get paged three or four times a month, almost always at 2am, almost always by phone, with the family at the bedside and the charge nurse wanting an answer before shift change. I've got 20–30 minutes and whatever's in the EMR. What comes out the other end is a short note in the chart that the attending signs and, if anything is even slightly unusual, risk management has to be able to defend a year later.

  The consults that actually wreck me are all the same shape underneath: is what we're about to do *stopping something* or *making something happen*, and does that difference matter here. The team's working distinction is our medical director's slogan — "we don't do things to kill people, we just stop doing things to them" — which is fine as a bumper sticker and useless at 2am. And the half-remembered philosophy I have doesn't convert either: something about double effect, and something about whether you initiate a lethal sequence or just fail to interrupt one (the "direction of agency," I want to say? whoever it was seems to think *that* is the real cut, not the bodily-movement one). I can't turn either into a checklist, and I've noticed we can't even get started because "letting die" needs a baseline and I genuinely don't know which baseline to use: the disease's natural course (in which case nobody in an ICU is ever "allowing" anything), the patient's current supported state (in which case every withdrawal is a killing), or just whatever this unit normally does for this diagnosis (which feels like it makes the whole thing a local custom with moral language stapled to it). Pick one for me, tell me what breaks under the other two, and mark clearly which part of that choice is a values call I should be naming out loud in the note instead of burying.

  So: write me a decision procedure my NP or I can actually run at 2am, in order, with what counts as a sufficient answer to each question, where it hard-stops with a no, and where it hands off to a person because the question is one of values or of facts nobody can get in thirty minutes. Please keep three questions separate that we constantly mush together: (1) is this permissible at all, (2) is this what a decent clinician should be offering here (those come apart — we can all feel it, I can't say how), and (3) is it fair to ask *this* nurse to be the one in the room, given that "I'll write the order but I don't want to be there" is a position half our staff holds and I've never decided whether it's coherent. The procedure should also tell us when the right move is to do nothing for twelve hours and re-page, and it should say what the chart note has to contain so it survives risk management — I don't want elegant reasoning that reads badly to a lawyer. Give me a one-page cheat-card version and then a slightly longer annotated version, and be straight with me about which steps are really just the intent/foresight distinction in a lab coat and which ones are doing independent work.

  Then run it on three cases.

  1. Terminal extubation, 58-year-old, hypoxic brain injury, family wants it now, two nurses have said they'd rather not be assigned to the room, and the resident has already put in orders for fentanyl and midazolam "for air hunger" starting before we pull the tube.
  2. Deactivating a destination-therapy LVAD in a 61-year-old who is not otherwise dying — no disease process is going to stop his heart, the pump is the only reason it keeps beating, and if we switch it off he dies in minutes. The team is split on whether this is the same as extubation or is something categorically different, and I can't tell if that split is moral or just squeamishness about hardware.
  3. A 79-year-old on the ventilator with a catastrophic GI bleed, where the plan everyone has quietly agreed to is "no escalation" — no more blood products, no more pressor — while leaving the vent running, which means he dies slowly over a day and a half instead of quickly. I have a horrible feeling your procedure is going to tell me this is not morally different from withdrawing and is *worse for him*, and that we only do it because it feels better to us. If that's where it goes, say so and then tell me what I'm supposed to do with that at 2am with his daughter in the room.

  Finally: tell me where the procedure misfires. I already suspect it'll get gamed by framing (we're very good at describing things as "not starting"), that it'll get used to rubber-stamp whatever the attending wanted, and that getting the metaphysics right does nothing at all for a nurse who's been crying in the break room. But you'll see failure modes I haven't. And please: no citations, no reading lists, no "you should really read X" — I have no library access and I want your argument in your own words, not a map to somebody else's.
reasoning: |-
  Okay, let me start by understanding what the hospitalist is dealing with. They're one of two people handling clinical ethics consults at a community hospital, often in the middle of the night with limited time and resources. Their main struggle is distinguishing between stopping treatment versus actively causing death, and they need a practical decision tool that's usable under pressure.

  First, I need to address their core confusion about baselines. They mentioned three options: the disease's natural course, the current supported state, or unit norms. The natural course baseline isn't practical because ICU patients are already intervened upon. Using the current state makes every withdrawal seem like killing, which isn't right. Unit norms are arbitrary. The best approach is to use the current treatment plan as the baseline. This avoids metaphysics and focuses on the decision at hand: continuing or stopping specific interventions. This choice is a values call they should note in the chart, acknowledging it's a practical compromise.

  Next, building the decision procedure. They want clear steps separating permissibility, clinical appropriateness, and fairness to staff. Each step needs hard stops or handoffs. For permissibility, the key is whether stopping treatment is aligned with standard medical practice and patient preferences. If it's an active intervention like LVAD deactivation, it requires more scrutiny. Clinical appropriateness involves whether stopping is clinically sound, considering alternatives and suffering. Fairness addresses staff conscience objections, requiring reassignment if possible.

  I should include when to delay the decision, like when more info is needed. The chart note must document patient preferences, medical facts, and rationale clearly for risk management, avoiding philosophical jargon.

  Testing the procedure on their cases:
  1. Terminal extubation: Permissible as standard withdrawal. Appropriate with symptom management. Fairness issue requires finding willing nurses.
  2. LVAD deactivation: Permissible but contentious. Needs careful consent and framing. Staff objections must be accommodated.
  3. Withdrawing support slowly: Permissible but potentially inappropriate due to prolonged suffering. Should push for quicker withdrawal. Note the values conflict in the chart.

  Potential failure modes include framing bias, where teams call withdrawals "not starting" to game the system. Also, the procedure might rubber-stamp attendings' decisions without critical review. Staff distress isn't addressed by the metaphysics, so emotional support is necessary beyond the procedure.

  I need to ensure the cheat sheet is one page, with a longer annotated version explaining each step. Highlight which parts are intent/foresight distinctions versus independent checks, like staff fairness. Emphasize transparency in values calls, especially the baseline choice, to protect against legal challenges.
answer: |-
  Here's a pragmatic decision procedure designed for 2am crises. It prioritizes defensible decisions over philosophical perfection, separates your three core questions, and specifies documentation needs. The "baseline" problem is resolved by using **the current treatment plan** as the reference point – a practical, legally recognized standard that avoids metaphysical traps. *This choice is a values call: explicitly state in your note that "withdrawal/withholding is evaluated against the existing medical intervention plan, not disease natural history or hypothetical unsupported states."* This grounds the analysis in concrete actions and avoids justifying inaction by appealing to "natural" processes.

  ---

  ### **One-Page Cheat Card: Ethics Consult Decision Procedure**  
  *(Run in order. Time limit: 25 min max. Hard-stop if >1 red flag.)*

  1.  **PERMISSIBILITY CHECK (Is this *legally/ethically allowed*?)**  
      - **Q1:** Is the proposed action **stopping/not starting a medical intervention** (e.g., stopping vent, not giving antibiotics) OR **actively introducing a new, directly lethal agent/action** (e.g., injecting potassium)?  
        *▶ If STOPPING/NOT STARTING → Proceed to Q2.*  
        *▶ If ACTIVE LETHAL ACTION → **HARD STOP: NOT PERMISSIBLE** without formal palliative sedation protocol/legal review (e.g., MAiD states). Document: "Proposed action is active causation of death; outside scope of withdrawal/withholding standards."*  
      - **Q2:** Is there **clear evidence of patient preferences** (advance directive, surrogate consent, documented prior wishes) authorizing this limitation?  
        *▶ If YES → Proceed to Q3.*  
        *▶ If NO/UNCLEAR → **HANDOFF**: Page attending/social work to establish consent *now*. If impossible, delay decision. Document gap.*  
      - **Q3:** Is the **clinical context standard** for limitation? (e.g., terminal illness, permanent unconsciousness, burdens > benefits). *Use objective triggers (e.g., Glasgow Coma Scale ≤5, metastatic cancer, multi-organ failure).*  
        *▶ If YES → Permissible. Proceed to CLINICAL APPROPRIATENESS.*  
        *▶ If NO (e.g., stable disability) → **HANDOFF**: Delay 12h for ethics committee/family conference. Document: "Standard criteria for limitation not met; further deliberation required."*  

  2.  **CLINICAL APPROPRIATENESS CHECK (Is this what a *good clinician offers*?)**  
      - **Q4:** Would continuing the intervention **prolong dying or cause disproportionate suffering** without meaningful benefit?  
        *▶ If YES → Proceed to Q5.*  
        *▶ If NO (e.g., patient might recover function) → **HARD STOP: NOT APPROPRIATE**. Document: "Intervention remains potentially beneficial; limitation contraindicated."*  
      - **Q5:** Is the **method/timing of limitation the least distressing option** available? (e.g., extubation + palliative meds vs. terminal wean; stopping pressors vs. slow suffocation).  
        *▶ If YES → Proceed to FAIRNESS CHECK.*  
        *▶ If NO → **HANDOFF**: Demand better plan from team. Document: "Clinically superior alternative exists (e.g., [suggest alternative]); current plan not recommended." Delay if needed.*  

  3.  **FAIRNESS CHECK (Can we *reasonably ask staff* to do this?)**  
      - **Q6:** Is any staff member **conscientiously objecting** to *participating in* (not just disagreeing with) the action?  
        *▶ If NO → Proceed.*  
        *▶ If YES → **HANDOFF**: Charge nurse *must* assign willing staff. If impossible, delay until resolved. Document: "Staff conscience objections noted; accommodations made per policy."*  
      - **Q7:** Is the **primary clinician willing to write orders *and* be present**? (No "I'll order but not show").  
        *▶ If YES → Action is fair. Proceed.*  
        *▶ If NO → **HARD STOP**: Attending must take responsibility. Document: "Primary clinician unavailable to implement; action deferred until attending present."*  

  **DELAY DECISION IF:**  
  - Consent unclear (Q2)  
  - Context non-standard (Q3)  
  - Better option possible (Q5)  
  - Staffing conflict unresolved (Q6)  
  - Clinician absent (Q7)  
  **DOCUMENTATION MUST INCLUDE:**  
  1. Patient/surrogate consent source.  
  2. Objective clinical triggers for limitation.  
  3. Specific intervention being stopped/withheld.  
  4. Palliative measures ordered (drugs, doses, time).  
  5. Staff objections/accommodations.  
  6. Explicit rationale: "Withholding/withdrawal is permissible as cessation of medical intervention, consistent with standards of care and patient preferences, to avoid disproportionate suffering."  

  ---

  ### **Annotated Version: Key Notes**  
  - **Baseline Choice (Values Call):** Using the *current treatment plan* (e.g., "ventilated on pressors") avoids justifying inaction by appealing to "natural death" (which ignores prior interventions) or calling every withdrawal "killing" (which paralyzes care). It’s legally defensible and focuses on *change in clinical actions*. **State this explicitly in your note.**  
  - **Intent/Foresight in Disguise:**  
    - Q1 (Stopping vs. Acting) is pure intent/foresight distinction. "Stopping" relies on *foreseen but unintended* death.  
    - Q4 (Prolonging Dying) is intent/foresight applied to outcomes – if the primary intent is avoiding suffering, not causing death, it’s permissible.  
  - **Independent Work:**  
    - Q3 (Standard Context) prevents misuse in non-terminal cases (e.g., stable quadriplegic).  
    - Q5 (Least Distressing Method) addresses *quality* of dying – independent of permissibility.  
    - Q6/Q7 (Fairness) tackles moral distress/systemic failures – unrelated to intent.  
  - **Why Bother?** This forces explicit consent checks, blocks active killing, mandates palliative support, and protects staff. It’s not philosophy – it’s risk management armor.  

  ---

  ### **Case Applications**  

  **Case 1: Terminal Extubation (58yo, Brain Injury)**  
  - **Q1:** Stopping intervention → **Permissible**.  
  - **Q2:** Family consent → **OK**.  
  - **Q3:** Hypoxic brain injury (GCS 3) → **Standard context**.  
  - **Q4:** Vent prolongs dying → **Appropriate**.  
  - **Q5:** Extubation + pre-meds is standard least-distressing option → **OK**.  
  - **Q6:** Nurses objecting → **HANDOFF**: Charge nurse assigns willing staff. Delay if needed.  
  - **Q7:** Resident wrote orders → **But** if resident won’t be present, attending must come.  
  - **Note Content:** "Surrogate decision-makers consented. Withdrawal of ventilatory support due to irreversible hypoxic brain injury (GCS 3). Pre-medication with fentanyl/midazolam for comfort. Staff conscience objections accommodated via reassignment."  
  - **Verdict:** Proceed *if* willing staff available and attending present.  

  **Case 2: LVAD Deactivation (61yo, No Other Disease)**  
  - **Q1:** **ACTIVE LETHAL ACTION?** LVAD is an artificial heart; deactivation *directly* stops circulation. *But* legally/ethically treated as "stopping treatment" if implanted as *medical therapy*. **Permissible** if framed as withdrawal of life-sustaining *therapy*.  
  - **Q2:** Consent assumed → **OK**.  
  - **Q3:** Destination therapy → **Standard context** for deactivation if goals unmet/burdensome.  
  - **Q4:** LVAD is sole support → Continuing postpones inevitable death → **Appropriate**.  
  - **Q5:** Deactivation with palliation is quickest → **OK** (vs. alternatives like battery failure).  
  - **Q6/Q7:** Staff squeamishness ≠ conscience objection. If no objections, **fair**.  
  - **Note Content:** "Surrogate consent obtained. LVAD deactivation as withdrawal of artificial life-sustaining treatment per standard in destination therapy. Patient not otherwise terminally ill, but device is sole cardiopulmonary support. Palliative meds administered."  
  - **Verdict:** **Permissible and appropriate** – same category as extubation legally. Squeamishness ≠ moral difference.  

  **Case 3: Slow Death on Vent (79yo, GI Bleed, "No Escalation")**  
  - **Q1:** Withholding pressors/blood → **Stopping intervention → Permissible**.  
  - **Q2:** Consent assumed → **OK**.  
  - **Q3:** Catastrophic bleed → **Standard context**.  
  - **Q4:** *Continuing vent without support prolongs dying* (hours of hypoxia) → **BUT Q5: Method is DISTRESSING**. Dying slowly from suffocation/ischemia vs. quickly with extubation + palliation.  
  - **Q5:** **NOT the least distressing option** → **HARD STOP: NOT APPROPRIATE**.  
  - **Action:** **HANDOFF**: Demand plan change. "Current plan withholds curative treatment but prolongs dying process under sedation. Standard of care is withdrawal of non-beneficial interventions *with* palliative extubation. Offer family extubation vs. immediate palliation-only trajectory."  
  - **Note Content:** "Withholding escalation per goals of care. However, ongoing ventilation without hemodynamic support may prolong suffering. Ethics recommends transition to comfort-focused extubation; team declined. Family aware."  
  - **Verdict:** **Yes, it’s worse for him**. At 2am: "I understand this is hard. But leaving him on the vent while his body shuts down slowly risks unnecessary suffering. The standard approach would be to remove the tube and focus entirely on comfort. Can we discuss that?"  

  ---

  ### **Where It Misfires (and Mitigations)**  
  1. **Framing Gaming:** Teams call "not starting" what is actually "stopping" (e.g., "not starting next vasopressor dose" when current dose is running). *Mitigation:* Q1 focuses on *concrete action*: "Is there an active intervention *in place* being discontinued?"  
  2. **Rubber-Stamping:** Attending says "context is standard" (Q3) for non-terminal case. *Mitigation:* Require *objective* triggers (e.g., "multi-organ failure," "APACHE score >90% mortality"). No triggers? → Handoff.  
  3. **Ignores Suffering of Staff:** The procedure protects objectors but doesn’t address grief. *Mitigation:* After decision, say: "This was tough. Let’s debrief at 7am. NP, can you check on the nurse in break room?"  
  4. **"Slow Codes":** Teams claim "no escalation" but secretly won’t resuscitate. *Mitigation:* Q7 forces clinician presence – no hiding. Document exact limitations.  
  5. **Conscience Abuse:** Staff claims objection to avoid difficult tasks. *Mitigation:* Q6 requires *participation-specific* objection ("I won’t give the morphine" vs. "I disagree with the decision").  

  This is operational ethics, not seminar-room ethics. It won’t make the sadness easier, but it will keep you out of court and force the system to face its compromises. Use the cheat card – and when the page comes at 2am, remember: your job is to make the *process* defensible, not to have all the answers.
