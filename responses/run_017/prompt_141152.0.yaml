answer: |-
  ### **My verdicts, restated**
  1. **Add +1 person at +1**: No reason (neutral).  
  2. **Raise person 1 to +100**: Strong reason (improvement).  
  3. **Rescue person 1 from −1000 to +1**: Stronger reason than (2) (priority for worst off).  
  4. **Harm person 1 to −1000 for unbounded gains to others**: **No verdict** (conflict: unbounded gain vs. severe harm).  
  5. **All raised to +2**: Strictly better than W.  
  6. **Mixed world (+10 & −1)**: **No verdict** (depends on density; reject framing-dependence).  
  7. **Finite analogue (billion people)**: Adding +1 is good; (4)-analogue is worth it. **Discontinuity** between finite/infinite.  

  ---

  ### **The principle**  
  **Infinite Pareto Plus (IPP)**:  
  1. **Pareto Matching**: If a bijection exists pairing all individuals such that each is weakly better off and one is strictly better off in World B, prefer B. *Motivation*: Captures verdicts (2), (3), (5).  
  2. **Finite Disturbance**: If a change affects only finitely many individuals, evaluate only their welfare changes (ignore untouched infinity). *Motivation*: Resolves (1) (no net effect), (4) (only person 1’s loss matters), and (7)-discontinuity (infinity changes rules). **Load-bearing clause** for (4).  
  3. **Non-Aggregation Fallback**: If neither applies, reject totalistic aggregation; use non-utilitarian rules (e.g., priority to worst off, constraints). *Motivation*: Handles (6) and undefined totals.  

  IPP prioritizes *local* impacts over illusory "sums." Clause 2 treats infinity as a fixed background, making only finite differences evaluable.  

  ---

  ### **Verdicts on cases I haven’t settled**  
  (i) **Torture button**: *Finite disturbance* applies. Your act affects only *one* victim (you control one button). Pushing it harms them for no gain (others’ acts are fixed). **Don’t push** – violating a constraint against harming.  
  (ii) **+100/−100 vs. 0**: *Non-aggregation* triggers. No Pareto matching (e.g., pairing +100→0 harms some). Totals undefined. **No verdict**; use priority for worst off: prefer all at 0 (no one at −100).  
  (iii) **Sparse gains in (4)**: *Finite disturbance* still applies. Only person 1’s loss (−999) matters; sparse gains are irrelevant (untouched infinity). **Reject the trade** – same as original (4). Density doesn’t matter for IPP.  

  ---

  ### **Verdicts I’d have to give up**  
  IPP forces you to abandon **verdict (5)**. Raising *all* to +2 lacks a bijection where *each* is better off (W has no "spare" person to pair with the new welfare level). Clause 2 also fails (change is infinite). Thus, IPP yields **no verdict** – contradicting your intuition that universal +2 is better. The **discontinuity in (7)** is *defensible*: infinity *should* transform small additions from improvements (finite) to neutral (infinite).  

  ---

  ### **What would change this answer**  
  **One argument**: If the "fixed background" assumption in Clause 2 fails – e.g., if we *must* count untouched infinities because they *contextually* matter. This could flip verdicts (1) (adding +1 might become obligatory) and (4) (unbounded gains might outweigh harming one). The core disagreement is **substantive**: whether morality in infinite worlds must be *local* (IPP) or can demand "cosmic" accounting. I’m 90% confident in Clause 2 for (4), but only 60% in rejecting (5) – if we allow "welfare shifts" without bijection (e.g., "everyone is better off" as primitive), IPP could accommodate it. The technical summing issue (e.g., Cesàro means for (6)) is secondary to the moral question: **Is infinity a veil or a ledger?**
