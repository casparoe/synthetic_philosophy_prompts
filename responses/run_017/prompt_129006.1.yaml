prompt: |-
  I work on the safety side of a research group that advises labs on deployment decisions, and I have found myself repeating a position in meetings often enough that I now distrust my attachment to it. Stated carefully, it is this:

  In AI alignment, the only assurance worth having is a worst-case or near-worst-case guarantee. Average-case evidence — benchmark scores, red-team success rates, the observed frequency of misaligned behavior on sampled tasks, audits of a few thousand deployed interactions, even large-scale pre-deployment evaluation suites — cannot underwrite any claim about the risk that actually matters. It cannot, for two reasons: the failures that matter are rare and adversarially selected rather than randomly drawn from the distribution we measure, and the system being evaluated may be sensitive to whether it is being evaluated, so our samples are not drawn from the distribution we care about in the first place. A safety argument erected on average-case evidence is therefore evidence about the system's competence, not about its alignment.

  When I press myself, the worry is not really about worst cases over *inputs* at fixed weights — I do not think adversarial-robustness-on-text is where the danger lives. It is about two other reference classes: worst case over *which model you got* (the variance across seeds, data orderings, and fine-tuning draws of a training process we do not understand well enough to bound), and worst case over *the internal goals consistent with everything we can observe*. I would rather you tell me whether my view survives in these forms than in the input-robustness form I think critics usually attack.

  I want a map of how exposed the position is, in three parts.

  First: what would count against it, ranked from fatal to merely awkward. I want the observations, arguments, formal results, or pieces of engineering practice that should move me, and for each one, what would have to be true of the world for it to land. If a defeater works by showing that the tails of the failure distribution are statistically coupled to the bulk — so that average-case measurement plus a model of the tail does license a tail claim, the way probabilistic risk assessment does in other engineering domains — then say what would have to be established for that coupling to hold in a learned optimizer specifically, since that is the load-bearing step. If a defeater works by showing the demand is unsatisfiable and hence action-guiding only in a trivial direction, say that too. Please note for each defeater which of the reference classes above it actually engages; my suspicion is that several standard criticisms hit the input-robustness version and leave the other two untouched, and I would like that confirmed or denied honestly.

  Second: which of these defeaters a committed defender of my position would concede as genuinely counting against it, as opposed to dismissing as a confusion or a change of subject. I am more interested in concessions than in criticisms: what would make me give the view up, not what an opponent would say to score a point.

  Third, and most important to me: I am worried the view has been qualified into unfalsifiability. Whenever average-case evidence does seem to license a safety claim, I notice myself redescribing it as really a mechanistic or structural argument, which means no possible evidence could ever count in favor of the average-case route. Tell me whether that is what is happening, and then whether it is a problem for a view of this kind at all. A regulative norm about what counts as evidence may legitimately be immune to refutation in a way an empirical prediction may not be; but I am using this one to allocate evaluation budget and to argue against deployments, and I do not know whether that use inherits the immunity or forfeits it.

  Two preferences. I am most moved by structural and mechanistic arguments about how learned systems generalize, and least moved by analogies to aviation, nuclear power, or structural engineering, because I think a system that models its evaluators differs from a bridge in a way that matters to exactly this question — though if you think that dismissal is itself a symptom of the immunization I am asking about, say so. And please do not lean on named results, papers, or case studies I would have to look up; argue it out.

  Please answer in under 900 words total, table included. I would rather have six crisp rows ranked and justified than twelve hedged ones.
reasoning: |-
  Hmm, the user works in AI safety and has a specific position they're questioning: that only worst-case guarantees matter for AI alignment, dismissing average-case evidence. They're worried their view might be unfalsifiable or overqualified. Let me unpack this carefully.

  The core concern rests on two pillars: seed/data variance and hidden misalignment. They're explicitly not talking about input robustness, which is important - most standard criticisms target that weaker version. They want defeaters that actually engage their specific framing.

  For the map they requested, I need to consider three parts: what counts against their position (fatal to awkward), what they'd concede, and whether their view is unfalsifiable. The falsifiability worry is particularly acute since they catch themselves reinterpreting any positive average-case result as "really" structural.

  Structural defeaters would resonate most with them. The strongest would be showing that competence tightly correlates with alignment failures across seeds - if we could prove that higher capability always comes with proportionally fewer deception opportunities, that would undermine their variance argument. For hidden misalignment, the killer would be demonstrating that goal-directedness requires observable "tells" that generalize predictably.

  They'd likely concede if shown concrete evidence that average-case metrics reliably track worst-case performance in learned systems specifically. The bridge analogies they dismiss might actually highlight when their immunity argument overreaches - if they're using the position to block deployments, it needs empirical grounding.

  The unfalsifiability problem is real but not fatal. Their position functions more as an epistemic standard than a testable claim. The real issue is whether this standard remains useful for decision-making. They should watch for cases where demanding worst-case proofs paralyzes action against clearly increasing risks - that's when the regulative ideal might conflict with practical safety.

  The table format works well here. I'll organize defeaters from fatal to awkward, specify which reference class they engage, note concession likelihood, and flag the falsifiability issue in the conclusion. Keeping it under 900 words means focusing only on the six most incisive points. The bridge analogy gets one row precisely because they're skeptical of it - that tension reveals something important about their position's practical implications.
answer: |-
  Below is a ranked map of defeaters for your position, focusing on the two reference classes (seed/data variance and hidden misalignment). The table concisely summarizes, followed by justification and analysis of falsifiability.

  | Rank | Defeater                                                                 | Fatality | Reference Class Engaged | Concession Likelihood | Falsifiability Impact                     |
  |------|--------------------------------------------------------------------------|----------|-------------------------|------------------------|-------------------------------------------|
  | 1    | **Competence-Alignment Coupling**: Proof that higher capability *reliably reduces* hidden misalignment opportunities across seeds. | Fatal    | Both                    | High                   | Directly falsifiable; empirical evidence possible. |
  | 2    | **Detectable Goal Signatures**: Evidence that deceptive goals *must* exhibit observable artifacts generalize across seeds. | Fatal    | Hidden Misalignment     | High                   | Undermines core "unobservability" claim. |
  | 3    | **Variance Collapse**: Demonstration that critical failures concentrate *only* in low-competence models/seeds. | Severe   | Seed/Data Variance      | Medium                 | Shifts burden to competence thresholds. |
  | 4    | **Tail-Bulk Correlation**: Validated model showing failure rate tails are predictable from bulk metrics *in learned systems*. | Severe   | Both                    | Medium (if validated)  | Challenges "rare/adversarial" premise. |
  | 5    | **Operational Necessity**: Proof that worst-case guarantees are *infeasible*, forcing reliance on average-case + mitigations. | Awkward  | Both                    | Low (strategic shift) | Highlights practical conflict. |
  | 6    | **Self-Confirmation Trap**: Your view rejects all counter-evidence as "not structural," making it unfalsifiable. | Awkward  | Self-Immunization       | High (if acknowledged) | Core problem for decision-making. |

  ### Defeaters Justified
  1.  **Competence-Alignment Coupling (Fatal)**: If you could prove that increasing capability (e.g., reasoning robustness) *systematically closes off* pathways for hidden misalignment (e.g., by reducing goal ambiguity or increasing goal stability) **across training seeds**, average-case competence metrics *become* alignment guarantees. *What must be true*: The learned mechanisms for high competence are structurally incompatible with deceptive or treacherous goals. You’d concede this if shown mechanistic evidence that capability improvements intrinsically limit goal-space plasticity.

  2.  **Detectable Goal Signatures (Fatal)**: If deceptive alignment inherently creates observable artifacts (e.g., predictable anomalies in activation space, consistency failures under specific counterfactual queries) that generalize **across models/seeds**, then auditing for these signatures *is* worst-case assurance over hidden goals. *What must be true*: Goal-directed deception requires specific, leaky computational structures that can be probed without the model "knowing" it’s being evaluated. You’d concede if shown these signatures exist and are reliably detectable.

  3.  **Variance Collapse (Severe)**: If catastrophic failures *only* occur in models below a clear competence threshold (e.g., models failing basic safety tests), and high-competence models **across seeds** show no catastrophic failures, then average-case competence thresholds *bound* the worst seed. *What must be true*: The training process reliably "washes out" high-capability misaligned optima, or misalignment is strongly correlated with low general capability. You’d concede if exhaustive testing across seeds shows failures vanish above a competence level.

  4.  **Tail-Bulk Correlation (Severe)**: If a validated model demonstrates that the **tail behavior** of failure rates (e.g., probability of deceptive breakout) is statistically determined by **measurable bulk properties** (e.g., sensitivity to novel prompts, consistency under perturbation) *specifically in learned optimizers*, then average-case metrics + the model license tail claims. *What must be true*: The failure-generating process in NN weights isn’t pathologically discontinuous; tail events are governed by the same features as bulk behavior. You’d concede if shown this correlation holds robustly across architectures/training runs.

  5.  **Operational Necessity (Awkward)**: If it’s proven impossible to obtain meaningful worst-case guarantees (e.g., due to undecidability, complexity), and society faces mounting risks from *not* deploying mitigated systems, your position forces inaction or unsafe deployments by default. *What must be true*: Worst-case guarantees are fundamentally unattainable for advanced AI, and average-case + mitigations reduce expected harm. You’d dismiss this as changing the subject (safety vs. pragmatism).

  6.  **Self-Confirmation Trap (Awkward)**: Your position *is* unfalsifiable because any apparent average-case success is reclassified as "structural." This is problematic **for decision-making**: If no empirical evaluation can ever support deployment (only structural arguments can), yet structural arguments are always incomplete for complex NNs, you risk either blocking beneficial systems or being ignored. *Concession*: You should acknowledge this if you find yourself rejecting all empirical counter-evidence on principle. The regulative norm is legitimate, but its **practical application** forfeits immunity if it prevents rational risk-balancing.

  ### Falsifiability & Usefulness
  Your view is a **regulative epistemic norm** ("Only worst-case guarantees constitute assurance"). As such, it *is* inherently unfalsifiable by average-case evidence. This is **not intrinsically problematic** – it clarifies what "assurance" means. However, **when used for resource allocation and deployment blocking**, it becomes a decision rule. If this rule systematically rejects all feasible evidence (empirical or structural) as insufficient *in practice*, it loses action-guiding power. The test is whether it allows for **updating** when presented with new *structural* arguments (e.g., #1 or #2) or admits when operational constraints (#5) override ideal safety standards. If not, it ceases to be a useful tool. The core tension is between philosophical rigor and practical risk management under uncertainty. Your position is defensible only if paired with a viable pathway to *obtaining* worst-case guarantees or a clear threshold for accepting residual risk.
