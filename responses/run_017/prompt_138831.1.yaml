answer: |-
  ### Joint Statement on Representation in Trained Neural Networks

  #### Preamble
  We, a representation realist and a representation deflationist, have engaged in a year-long adversarial collaboration centered on a shared experimental setup. We use a 1-billion-parameter decoder-only transformer trained on a mixed text corpus. Our analysis focuses on a single middle layer of the **residual stream** (the vector space carrying the network’s internal state between layers). We apply an unsupervised **dictionary-learning** pipeline—specifically, a **sparse autoencoder (SAE)**—to activations from this stream. The SAE decomposes activations into a linear combination of **directions** (basis vectors), imposing sparsity (few active directions per input) to yield human-interpretable candidates. We jointly examined three SAE-recovered directions:  
  - Direction A: Activates strongly with the language of the text (e.g., English vs. French).  
  - Direction B: Activates with sentiment or politeness (e.g., positive/negative tone).  
  - Direction C: Activates with references to a specific named-entity class (e.g., cities).  

  We also use a synthetic test case: a small transformer trained on data generated by a known grammar with known latent variables, providing ground-truth features.  

  #### 1. Agreed Claims  
  We affirm the following substantive, non-platitudinous claims. Each is deniable by a partisan from either camp:  

  1. **The SAE pipeline reveals non-random structure.** The directions recovered (e.g., A, B, C) exhibit consistent, non-trivial correlations with human-interpretable concepts across diverse inputs. This structure is absent in a randomly initialized network, implying training induces statistical regularities exploitable by sparsity-based methods.  
  2. **Interpretability alone does not imply causal efficacy.** Human labeling of directions (e.g., "this direction represents language") is insufficient to establish that the direction is a cause of the network’s behavior. Correlations may be epiphenomenal to the network’s true computational mechanisms.  
  3. **The change-of-basis argument does not resolve the debate.** While inserting an invertible linear map (and its inverse) into adjacent layers preserves input-output behavior, this does not entail that all bases are computationally equivalent. Whether the network’s internal causality privileges one decomposition remains open.  
  4. **Sparsity is methodologically imposed, not discovered.** The SAE’s sparsity penalty constrains solutions; it does not reveal an intrinsic property of the network. The network may use dense, superpositional representations (where directions overlap non-orthogonally) that SAE approximates sparsely.  
  5. **Features must earn explanatory value.** For a direction to qualify as a "real" feature, it must (i) enable counterfactual predictions about network behavior under intervention (e.g., **steering**—artificially altering activations along a direction), and (ii) compress the network’s internal state more effectively than arbitrary alternatives for out-of-distribution (OOD) generalization.  
  6. **The synthetic case is not dispositive for real networks.** Even if SAE recovers ground-truth variables in the synthetic setting, real networks may not exhibit analogous decompositions due to data complexity and optimization pressures. Failure in the synthetic case, however, challenges SAE’s reliability.  
  7. **Causal structure exists at multiple scales.** The network’s behavior is determined by the collective dynamics of its weights and activations. Disagreement persists over whether feature-level descriptions add unique explanatory power beyond layer- or circuit-level analyses.  

  #### 2. Disagreements Table  
  We isolate four sub-questions underlying our disagreement. Each row states a neutral claim, a realist formulation (acceptable to the realist), a deflationist formulation (acceptable to the deflationist), and notes the core difference.  

  | Sub-question | Neutral Claim | Realist Formulation | Deflationist Formulation | Why Wording Differs |  
  |--------------|---------------|---------------------|--------------------------|---------------------|  
  | **Privileged decomposition** | Whether a unique set of features best explains the network’s causal structure. | A privileged decomposition exists, fixed by the network’s training dynamics; it is sparse, stable under perturbation, and minimally interventional. | No decomposition is privileged; all are arbitrary linear summaries of the residual stream, with "sparsity" and "interpretability" being method-dependent artifacts. | Realist ties decomposition to network-internal causality; deflationist sees decompositions as descriptive tools. |  
  | **Content** | Whether directions carry semantic content (e.g., "represent language") as a property. | Directions have content: their activation patterns covary robustly with input features, and interventions (steering) produce content-aligned changes in output. | "Content" is a post hoc human narrative; directions are activation patterns that correlate with inputs under training data, but lack inherent aboutness. | Realist sees content as causal and invariant; deflationist sees it as correlational and observer-dependent. |  
  | **Causal role** | Whether directions are the actual units of computation. | Directions are causally efficacious: ablating or amplifying them disrupts specific behaviors, and their interactions model the network’s local computation. | Causality resides in the full activation vector; feature-level explanations are approximations that often misattribute effects. | Realist attributes micro-causal power to features; deflationist attributes causality holistically. |  
  | **Method convergence** | Whether SAE-like methods discover pre-existing structure. | SAE approximates the privileged decomposition; convergence across methods (e.g., SAE, **linear probes**—simple classifiers predicting features from activations) indicates discovery. | SAE invents decompositions biased by sparsity penalties and human labeling; divergent results across methods confirm imposition. | Realist views convergence as evidence of reality; deflationist views it as consistency in human bias. |  

  **Live disagreements:** All four sub-questions are live. We *do not* dispute that SAE directions correlate with network behavior or that the residual stream has structure.  

  #### 3. Crux Table  
  For each diagnostic test, we specify a concrete experiment, both parties’ pre-registered predictions, and inferences from adversarial outcomes.  

  | Crux | Test Description | Realist Prediction | Deflationist Prediction | Realist Inference If Deflationist Outcome | Deflationist Inference If Realist Outcome |  
  |------|-----------------|-------------------|-------------------------|------------------------------------------|------------------------------------------|  
  | **Change-of-basis** | Apply an invertible linear transformation to the residual stream, adjusting weights to preserve input-output behavior. Fit SAE to transformed activations. | SAE recovers directions linearly equivalent to the original (e.g., Direction A still tracks language), as causal structure is basis-invariant. | SAE yields *different* interpretable directions (e.g., "language" splits into sub-language directions), proving decompositions are arbitrary. | Concedes that bases are underdetermined but argues causal roles persist in subspaces. | Concedes that SAE finds *some* structure but notes human labels may not transfer. |  
  | **Illegible ground truth (synthetic)** | Train a synthetic network with latent variables designed to be human-illegible (e.g., random linear combinations of input tokens). Fit SAE to its residual stream. | SAE recovers the true latents (verified by steering tests), as they are causally critical despite illegibility. | SAE fails to recover latents, instead yielding sparse, human-legible directions absent in ground truth. | Concedes SAE has human-legibility biases in real networks. | Concedes SAE can find non-interpretable structure if it dominates causality. |  
  | **Untrained-network control** | Fit SAE to activations from an untrained network *exposed to training data*. Compare direction interpretability/usefulness to the trained network. | Untrained SAE directions are uninterpretable and useless for steering/probing, as structure requires training. | Untrained SAE yields *some* interpretable directions (due to data statistics + sparsity), but they lack causal power. | Concedes sparsity + data can produce "features" without training, weakening SAE as evidence. | Concedes training adds causal structure, but not necessarily feature-level. |  
  | **Cross-model transplant + far-transfer steering** | (1) Transplant Direction A from Network 1 (trained on corpus C1) to Network 2 (same arch, corpus C2). Test if steering induces language shifts in C2. (2) For Direction B, test steering on OOD inputs (e.g., non-English text for an English-sentiment direction). | (1) Steering transfers with >75% accuracy; (2) OOD steering induces sentiment shifts with >70% accuracy. Features are functionally conserved. | (1) Transfer accuracy ≈ chance; (2) OOD steering fails or induces incoherent outputs. Features are corpus-specific correlations. | Concedes features are not universal, but argues for task-dependent conservation. | Concedes features can generalize but attributes it to data similarity, not discovery. |  
  | **Compression/OOD prediction** | Fit SAE on in-distribution (ID) data. Use it to predict residual stream activations on OOD inputs (e.g., code for a text-trained net). Compare error to random-basis and PCA baselines. | SAE’s OOD error is lower than baselines by >15%, indicating it captures generalizable structure. | SAE’s OOD error matches baselines, confirming it overfits to ID statistics. | Concedes SAE lacks generalizability but argues better methods might succeed. | Concedes SAE captures *some* generalization, but not uniquely. |  
  | **Method convergence** | Apply SAE, activation clustering, and linear probes to the same layer. Measure agreement (e.g., via directional alignment) on key features (e.g., Direction C). | Methods converge: e.g., SAE’s city direction aligns with clusters/probes for cities (cosine similarity >0.7). | Methods diverge: e.g., each identifies distinct "city-like" directions (similarity <0.3). | Concedes divergence implies method-specific artifacts. | Concedes convergence suggests consistent structure but not necessarily "features". |  

  *Non-diagnostic note:* The untrained-network control is ambiguous due to differing activation statistics. We replace it with a **partially trained control**: Fit SAE at training checkpoints. Realist predicts increasing direction stability/interpretability; deflationist predicts high variance and early interpretability from data bias.  

  #### 4. Retraction Conditions  
  Each party specifies strong, non-tautological conditions under which they would retract core claims.  

  - **Realist**: "I will retract realism if, in the synthetic case *with sparse, legible ground truth*, SAE (or equivalent) consistently fails to recover true variables *and* an alternative method demonstrates recoverability. I will also retract if cross-model steering (same architecture/task) fails in >80% of trials despite high data similarity."  
  - **Deflationist**: "I will retract deflationism if SAE recovers human-*illegible* ground-truth variables in the synthetic case *and* those variables show stronger causal efficacy in steering than human-legible alternatives. I will also retract if, across multiple methods, feature sets converge (agreement >70%) *and* these features enable OOD prediction errors 20% lower than baselines."  

  #### 5. Closing Section  
  **Verbal disputes**: We identify two terminological divergences:  
  - "**Representation**": Realist uses it to denote causal, content-carrying states; deflationist uses it descriptively for correlations. This is resolvable by distinguishing "causal representation" from "correlational feature".  
  - "**Discovery**": Realist means "approximation of pre-existing structure"; deflationist means "imposition of human biases". This reduces to whether methods are theory-laden.  

  **Substantive disputes** (non-verbal, requiring empirical resolution):  
  1. Whether a privileged decomposition exists.  
  2. Whether feature-level causality adds explanatory value over holistic accounts.  
  3. Whether method convergence indicates discovery.  

  **Next steps**: The collaboration commits to:  
  1. Running crux experiments (e.g., illegible synthetic test, cross-model steering), pre-registering predictions/analysis.  
  2. Developing a metric for "causal efficacy" (e.g., ablation impact vs. prediction error) to adjudicate retraction conditions.  
  3. Testing if **superposition** (entanglement of features in activation space) explains SAE’s failures/successes in OOD settings.  

  Predictions will be adjudicated via pre-agreed thresholds (e.g., >70% steering accuracy for "success"). Results will be published regardless of outcome.  

  ---  
  **Glossary**  
  - **Residual stream**: The vector space carrying a transformer’s internal state between layers, updated additively by each layer.  
  - **Direction**: A vector in activation space; a candidate "feature" if aligned with human-interpretable concepts.  
  - **Sparse autoencoder (SAE)**: An unsupervised model that compresses activations into a sparse combination of basis vectors (a "dictionary"), imposing an L1 penalty to limit active vectors.  
  - **Dictionary-learning**: Decomposing activations into a linear sum of basis vectors (the "dictionary").  
  - **Superposition**: When a network represents more features than activation dimensions by encoding them non-orthogonally.  
  - **Steering**: Adding a direction vector to activations at inference time to alter network behavior (e.g., amplify "politeness").  
  - **Linear probe**: A linear classifier trained on activations to predict input properties, used to evaluate feature interpretability.  
  - **Change-of-basis**: An operation inserting invertible linear maps into adjacent layers, preserving input-output behavior while altering internal coordinates.  

