  We are drafting a joint statement from an adversarial collaboration between a representation realist and a representation deflationist. The setup is fixed: both work on the same 1B-parameter decoder-only transformer, and they use a sparse autoencoder (SAE) on the residual stream activations at one middle layer. They have three example directions: language ID, sentiment/politeness, and a named entity type. They also have a synthetic control: a small transformer trained on a synthetic language with known latent variables.

  Deliverable has five parts:
  1. Agreed claims (substantive, not platitudes)
  2. Disagreements table (with rows for each sub-question: privileged decomposition, content, causal role, method convergence; with realist and deflationist formulations and why they differ)
  3. Crux table (with concrete tests and predictions for each party, including at least the five mentioned: change-of-basis, illegible-ground-truth control, untrained-network control, cross-model transplant and far-transfer steering, compression/OOD prediction)
  4. Retraction conditions (what each would accept as counting against their view)
  5. Closing section (verbal vs. substantive disputes and next steps)

  Constraints:
  - No citations or named results; write predictions as to-be-tested.
  - Define technical terms for philosophers and ML researchers.
  - Register: neutral, no point-scoring, no forced middle ground.
  - ~2000 words plus tables.

  We start with a preamble setting up the shared experimental context.

  ---

  **Joint Statement on Representation in Trained Neural Networks**

  **Preamble**

  We, a representation realist and a representation deflationist, have engaged in a year-long adversarial collaboration to clarify our disagreements about the interpretability of trained neural networks. We work with a 1-billion-parameter decoder-only transformer trained on a mixed text corpus. Our unsupervised dictionary-learning pipeline is a sparse autoencoder (SAE) fitted to the residual stream activations at one middle layer. The *residual stream* is the vector space that carries the network's internal state from one layer to the next. *Dictionary learning* refers to the process of finding a set of basis vectors (called "features" or "directions") such that each activation vector in the residual stream can be approximately expressed as a weighted sum of a small number of these basis vectors. The SAE learns a dictionary by imposing a sparsity penalty, encouraging only a few features to be active at once. We have jointly studied three example directions recovered by this SAE: 
  1. A direction that correlates strongly with the language of the input text (e.g., English vs. French).
  2. A direction that correlates with sentiment or politeness (e.g., positive/negative or polite/impolite).
  3. A direction that activates for references to a particular class of named entities (e.g., cities).

  Additionally, we use a synthetic test case: a small transformer trained on a language generated by a known grammar over a set of latent variables. In this case, the "true" features are known by construction, providing a controlled setting.

  ---

  **1. Agreed Claims**

  We agree on the following substantive claims, which are not mere definitions, platitudes, or observations of difficulty, and which we believe a competent partisan on either side might deny:

  1. **The pipeline recovers directions that are not arbitrary.** The SAE pipeline, when applied to the residual stream of the trained network, yields directions that are more interpretable to humans and more useful for downstream tasks (e.g., linear probing) than random directions or directions from an untrained network. This is not solely an artifact of the sparsity penalty; it reflects structure in the network's activations.

  2. **The pipeline does not, on its own, establish realism.** The mere fact that the SAE finds directions that humans can label with concepts does not demonstrate that these directions correspond to causally efficacious variables in the network. The pipeline might be capturing patterns that are merely correlated with the network's behaviour, rather than playing a direct causal role.

  3. **The network's internal state is structured.** The residual stream activations are not random noise; they have statistical regularities that the SAE exploits. The success of the SAE in compressing the activations (i.e., achieving low reconstruction error with a sparse code) indicates that the activation vectors lie near a low-dimensional manifold.

  4. **The existence of multiple decompositions does not refute realism by itself.** There are many invertible linear transformations of the activation space that preserve the network's input-output function (via the change-of-basis argument). However, this does not entail that all decompositions are equally natural or that there is no privileged basis for understanding the network's causal structure. The question of whether a privileged decomposition exists is open.

  5. **The burden of explanation.** The network's behaviour must be explained at some level of description. The deflationist holds that the whole computation is the appropriate level; the realist holds that a decomposition into features is both possible and necessary for a complete explanation. Both agree that the network's behaviour is not brute fact and that some account of its internal causality is needed.

  6. **The role of human interpretability.** The fact that a direction is interpretable to humans (i.e., we can assign a label to it) is not sufficient to establish that it is a "real" feature of the network. However, it is also not irrelevant: interpretability may be a useful heuristic for identifying features that play a role in the network's processing.

  7. **The synthetic case is informative but not decisive.** The synthetic control provides a clear test bed, but its lessons for real networks are not straightforward. If the SAE recovers the true latent variables in the synthetic case, it supports the realist's claim that the method can discover real features; if it fails, it supports the deflationist's worry about imposing human biases. However, the real network may differ in ways that make generalization uncertain.

  8. **Sparsity is a methodological choice, not a discovery.** The SAE imposes sparsity; it does not discover that the network's representations are sparse. The network may use dense representations that the SAE approximates with sparse ones. The success of sparse methods does not prove that the network itself is sparse.

  ---

  **2. Disagreements Table**

  We have identified four core sub-questions that underlie our disagreement. For each, we state the disputed claim in neutral language, then the realist formulation (which the realist would endorse), the deflationist formulation (which the deflationist would endorse), and a note on why the wordings differ.

  | Sub-question | Neutral Claim | Realist Formulation | Deflationist Formulation | Note on Difference |
  |--------------|---------------|---------------------|--------------------------|-------------------|
  | **Privileged Decomposition** | Whether there is a unique or privileged set of features that the network uses, as opposed to many equally valid ones. | There exists a privileged decomposition of the residual stream into features that correspond to the network's natural computational units. This decomposition is distinguished by its causal efficacy and stability across interventions. | Any decomposition into features is merely one way to describe the network's state; the network's causal structure is invariant under linear change of basis, so no decomposition is privileged over others. | The realist emphasizes causal efficacy and stability, while the deflationist emphasizes invariance under change of basis. |
  | **Content** | Whether the candidate features carry content (i.e., represent aspects of the input or the world). | The privileged features have content: they represent specific, identifiable aspects of the input (e.g., language, sentiment, or entity type) and this content plays a role in the network's computations. | Features do not carry content in themselves; what we call "content" is a story we impose based on correlations we observe. The network's computations are defined over activation vectors, not over semantic features. | The realist sees content as inherent and causal; the deflationist sees it as an external gloss. |
  | **Causal Role** | Whether the features identified by the SAE play the causal role attributed to them in the network's processing. | The privileged features are causally efficacious: intervening on them (e.g., via steering) produces predictable changes in the network's output, and ablating them disrupts specific functions. | The causal-explanatory structure of the network is at the level of the entire vector in the residual stream. Feature-level attributions are either shorthand for vector-level effects or misleading oversimplifications. | The realist claims features are causal units; the deflationist claims causality resides at the vector level. |
  | **Method Convergence** | Whether current methods (like SAE) can discover the true features, if they exist. | When applied correctly, SAE and similar methods can discover features that approximate the privileged decomposition. The convergence of multiple methods on similar features is evidence of their reality. | SAE finds features that are artifacts of its own biases (sparsity, interpretability). Different methods yield different decompositions, and there is no convergence to a single "true" set. | The realist believes methods can converge on reality; the deflationist believes methods impose structure. |

  *Note:* We are not fighting about whether the network has internal structure (we agree it does) or whether the SAE finds useful directions (we agree it does). Our live disagreements are exactly the four above.

  ---

  **3. Crux Table**

  For each crux, we describe a concrete test or argument that both parties accept as bearing on the sub-question. We state each party's prediction in advance and note what each would infer from possible outcomes. We include the five suggested cruces and one additional one (on convergence). We mark one as non-diagnostic and replace it.

  | Crux | Test Description | Realist Prediction | Deflationist Prediction | What Realist Infers If Deflationist Prediction Obtains | What Deflationist Infers If Realist Prediction Obtains | Notes |
  |------|-----------------|-------------------|-------------------------|------------------------------------------------------|-------------------------------------------------------|-------|
  | **Change-of-Basis Argument** | Insert an invertible linear map and its inverse into the network, preserving the input-output function. Then, apply the SAE pipeline to the transformed activations. | The SAE will recover the same features (up to linear transformation) because the privileged decomposition is invariant under such changes. The network's causal structure, though mathematically equivalent, is still best described in terms of the original features. | The SAE will recover a different set of features, but they will be equally interpretable and useful. This shows that the decomposition is arbitrary; what matters is the invariant structure. | If the SAE finds different features that are equally good, this supports the idea that the decomposition is not unique. | If the SAE recovers the same features (modulo linear transform), it suggests the features are robust to this intervention. | The realist believes the causal structure is tied to the features; the deflationist believes it is not. |
  | **Illegible Ground Truth (Synthetic Control)** | Train a small transformer on a synthetic language with known latent variables, but make these variables deliberately illegible: e.g., let them be random linear combinations of input tokens or dense and entangled. Fit SAE to the residual stream and check if it recovers the true latent variables. | The SAE will recover the true latent variables (or a linear transformation thereof) because they are causally efficacious in the network, even if illegible to humans. The method tracks causal structure, not human labels. | The SAE will fail to recover the true variables and instead find directions that are sparse and interpretable, showing that the method imposes human-legible structure. | If SAE finds interpretable but false features, it suggests the method is biased toward human legibility. | If SAE recovers the illegible true variables, it supports the method's ability to find causal structure. | Both agree that if SAE recovers the true variables, it is strong evidence for realism in this case. |
  | **Untrained Network Control** | Apply the identical SAE pipeline to the same architecture but with random weights (untrained), using the same input distribution. Compare the interpretability and usefulness of the recovered directions. | The SAE on the untrained network will yield directions that are not interpretable and not useful for downstream tasks (e.g., linear probing performance will be at chance). | The SAE on the untrained network may still yield some interpretable directions by chance, due to the sparsity penalty and the input statistics. | If the untrained SAE yields interpretable features, it suggests that interpretability can arise without training. | If the untrained SAE yields uninterpretable noise, it supports the idea that training induces structure. | We agree that this control is imperfect because activation statistics differ, but we use it with caution. |
  | **Cross-Model Transplant and Far-Transfer Steering** | (a) Take a direction (e.g., the language ID direction) recovered from Network A (trained on corpus C1) and use it to steer Network B (same arch, trained on C2 from different init). (b) For a single network, steer along a direction (e.g., sentiment) on inputs far outside the distribution where it was identified (e.g., code or non-English text). Measure whether steering produces the predicted change in output. | (a) The direction will transfer: steering in Network B will produce the predicted effect (e.g., changing language) because the feature is functionally conserved across networks. (b) Steering will work even far out-of-distribution because the feature represents a general concept. | (a) The direction will not transfer; steering will produce weak, inconsistent, or unintended effects because features are network-specific. (b) Steering will fail out-of-distribution because the direction is only correlated with the concept in the training distribution. | If transfer fails, it suggests features are not general. If far-transfer fails, it suggests the feature is not robust. | If transfer succeeds, it suggests that features can be functionally shared. If far-transfer succeeds, it challenges the deflationist's view that features are distribution-dependent. | For (a), both agree that if the networks have similar architectures, some transfer is possible, but the realist expects stronger effects. |
  | **Compression and OOD Prediction** | Fit a decomposition (e.g., SAE) on in-distribution data. Then, use the decomposition to predict the network's residual stream activations on out-of-distribution inputs (e.g., text from a different domain). Compare the prediction error to that of a baseline (e.g., random directions). | The decomposition will predict OOD activations better than baselines because it captures genuine structure in the network's representations. | The decomposition will perform no better than baselines on OOD data because it overfits to the training distribution. | If OOD prediction fails, it suggests the decomposition does not capture invariant structure. | If OOD prediction succeeds, it suggests the decomposition captures something general. | Both agree that if OOD prediction is successful, it is evidence for the decomposition's robustness. |
  | **Convergence of Methods** | Apply multiple independent interpretability methods (e.g., SAE, activation clustering, linear probes) to the same network and layer. Check if they identify the same features. | Different methods will converge on similar features, indicating they are discovering the same underlying structure. | Methods will yield different features, each interpretable under its own framework, showing that features are method-dependent. | If methods disagree, it suggests features are imposed by the method. | If methods converge, it suggests there is an underlying reality they are all tracking. | The realist expects convergence; the deflationist expects divergence. |

  *Note on Untrained Network Control:* We agree that this test is not fully diagnostic because the untrained network has different activation statistics (e.g., smaller norm, different covariance). To improve it, we propose a "partially trained" control: train the network for a few steps and apply SAE at intervals. The realist predicts increasing structure; the deflationist predicts that SAE will find interpretable features early if the data has structure.

  ---

  **4. Retraction Conditions**

  Each party states what evidence would count against its view, stated strongly enough that the other party would recognize it as a concession.

  - **Realist's retraction condition:** If, in the synthetic case with known ground truth, the SAE consistently fails to recover the true latent variables (even when they are sparse and legible) and instead finds features that are artifacts of the method, I would retract the claim that current methods can discover the network's true features. Additionally, if cross-model steering consistently fails under conditions where the networks are trained on similar data distributions and tasks, I would retract the claim that features are conserved across networks.

  - **Deflationist's retraction condition:** If, in the synthetic case with illegible ground truth, the SAE consistently recovers the true latent variables (despite their illegibility), I would retract the claim that the method imposes human-legible structure. Additionally, if multiple independent methods (e.g., SAE, clustering, and probing) converge on the same set of features across different initializations and training runs, I would retract the claim that features are method-dependent artifacts.

  ---

  **5. Closing Section**

  We identify the following as **verbal disputes** (disagreements that hinge on how we use words, rather than substantive claims about the world):

  - **"Representation":** Part of our disagreement stems from different conceptions of what it means for a direction to "represent" something. The realist requires that a representation have causal efficacy and content; the deflationist denies that such talk is appropriate at the feature level. This is partly terminological: we agree on the correlations but disagree on whether to call them representations.

  - **"Discovery":** The realist asserts that methods can "discover" features; the deflationist asserts that they "impose" them. This may reflect a difference in emphasis: the realist focuses on the network's structure constraining the method, while the deflationist focuses on the method's biases.

  The following are **substantive disputes** (they turn on empirical or conceptual matters that are not merely verbal):

  - Whether there is a privileged decomposition that the network uses (as opposed to many equivalent ones).
  - Whether the features identified by SAE play a direct causal role in the network's computations.
  - Whether current methods converge on a unique set of features.

  For these substantive disputes, the collaboration commits to the following next steps:

  1. We will run the crux experiments outlined in Section 3, pre-registering the predictions and analysis plans. 
  2. We will jointly analyze the results of the synthetic control, focusing on the illegible ground truth and convergence tests. 
  3. We will conduct cross-model transplant and far-transfer steering experiments on the real network and its variants. 
  4. We will test the OOD prediction capabilities of the SAE decomposition. 

  The pre-registered predictions will be adjudicated by comparing the outcomes to the predictions in the crux table. For continuous measures (e.g., transfer success), we will pre-define effect size thresholds for what counts as supporting or refuting a prediction. We will publish the results regardless of outcome.

  --- 

  **Definitions of Technical Terms (for Philosophers)**

  - **Residual stream:** In a transformer, the residual stream is the vector space that carries the network's internal state from one layer to the next. It is modified by each layer via additive updates.
  - **Direction:** A vector in the residual stream's activation space. In interpretability, a "feature direction" is a basis vector that is thought to correspond to a meaningful concept (e.g., sentiment).
  - **Sparse autoencoder (SAE):** A type of neural network used for unsupervised dictionary learning. It consists of an encoder that maps an activation vector to a sparse vector of coefficients, and a decoder that reconstructs the activation from the coefficients. The sparsity penalty encourages most coefficients to be zero.
  - **Dictionary learning:** The process of finding a set of basis vectors (the "dictionary") such that input vectors can be represented as linear combinations of a small number of these basis vectors.
  - **Superposition:** A phenomenon where a neural network represents more features than there are dimensions in the activation space by using non-orthogonal vectors and interference. This complicates the identification of individual features.
  - **Steering:** The technique of adding a vector (e.g., a feature direction) to the residual stream at inference time to influence the network's output (e.g., making the output more positive by adding the sentiment direction).
  - **Linear probe:** A simple classifier (linear model) trained on top of activations to predict a property of the input. Often used to assess whether a feature is present.
  - **Change-of-basis argument:** The observation that one can apply an invertible linear transformation to the activations of a layer and adjust the weights of adjacent layers accordingly without changing the network's input-output function. This implies that the internal coordinates are not uniquely determined.

