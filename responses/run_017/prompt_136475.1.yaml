prompt: |-
  Hi — I'm putting together a short piece for my uni reading group on Moore's hands arguement (the bit where he holds up his hands, concludes that at least two material objects exist, and takes that to settle that there's an external world), and I want to compare it with something I made up that looks to me like it has exactly the same shape, in order to work out what's actually doing the work in his version.

  Here's my invention — call it the counter-Moore proof. A sceptic runs the same gesture in reverse. She says: I know that right now I'm having a visual experience as of a hand; here is one such experience and here is a second one; so at least two experiences exist; and nothing about that requires there to be hands, or bodies, or a world at all. She then insists that her starting point is more certain than anything Moore could say against her, in exactly the way Moore insists that his starting point is more certain than anything the sceptic could say against him.

  So: compare the two. As far as I can tell they're formally the same move — first person, present tense, a kind of demonstration performed rather than argued, and in each case the speaker claims their starting point is the thing you'd give up last. Is there a genuine asymmetry that breaks the tie in Moore's favour, or does it collapse into a standoff? And if you think the right answer is that Moore's thing isn't really a proof at all but some other kind of move — say, a way of fixing which doubts even count as available, or of showing what a philosophical argument would have to beat — then say what that other kind of move is and whether its worth anything philosophically or is just rhetoric with a lecture theatre.

  I'm less interested in the tidied-up closure reconstruction people usually give (you know: I know I have hands, if I have hands then I'm not a handless envatted brain, so I know I'm not) than in the raw version with the hands. And if you think my counter-Moore proof isn't really the same shape as his, tell me exactly where the disanalogy is instead of answering around it.

  Please write in British English, keep it under 800 words, and skip citations and reading lists entirely — I've read the obvious material, I just want the comparison.
