prompt: |-
  I sit on the committee that has to certify the normative decision procedure of an automated system before it goes live, and I want the acceptance criteria settled before any vendor or any moral philosopher proposes a procedure to us. Adequacy here is adequacy for one job, so here is the job.

  The system adjudicates claims for an emergency public benefit. One policy is written centrally and then executed roughly a hundred thousand times a year; each execution sees one claim and no other, and cannot consult the others. A known minority of claims are fraudulent and the system cannot tell which; a competent human reviewer could do no better than the system's own estimate, and review costs time that is itself a cost to the claimant. Holding a genuine claim for verification imposes a concentrated, predictable, and serious harm on an identifiable person; paying a fraudulent one imposes a cost that is real in aggregate and imperceptible to any individual. Every decision is issued with a written reason that goes to the claimant and can be appealed to a tribunal that sees only that claimant's file and that reason: no aggregate statistics, no comparison with other claims, no counterfactual across executions. The policy is published, and claimants adapt to it. The probabilities the procedure needs cannot be estimated to better than about five percentage points, and compute per decision is capped. The agency intends to let the system delegate subtasks to sub-agents running the same procedure and to reuse the procedure in a successor system. Finally, we ourselves do not know whether a utilitarian or a deontological framing is correct, and the procedure has to operate without case-by-case human judgement.

  What I want from you is the specification: the requirements any candidate procedure must meet to count as adequate for this system, each with the case or consideration behind it, and each stated tightly enough that a candidate determinately meets it or fails it. Draw the cases from the system I have described rather than from trolley problems or other philosophical furniture, and split any candidate that is really two requirements hiding in one sentence.

  To start you off, here is what my colleagues have put forward, in no order:

  (a) an identified person's urgent interest may never be sacrificed to a diffuse aggregate gain
  (b) verdicts must not turn on probability differences smaller than the system's own error bars
  (c) the reason issued must be one the affected person could accept and one the appeal tribunal can check
  (d) evaluation must be over the policy as a whole rather than over individual executions
  (e) evaluation must be over each execution's own consequences rather than over the policy
  (f) the procedure must not depend on comparisons among cases that the executing instance cannot observe
  (g) a single commensurable scale across all affected parties, with no unexplained lexical priority
  (h) aggregation within a decision only, never across decisions
  (i) determinate guidance under moral uncertainty without presupposing a second-order theory
  (j) stability under delegation to sub-agents and under reuse in a successor system
  (k) robustness when other parties do not do their part and when claimants game the published rule
  (l) computability within the per-decision budget

  Sort them: which survive as genuine desiderata, which are negotiable preferences of a camp (name the camp), which are vacuous or quietly presuppose the answer they are supposed to test, and what is missing that this deployment makes necessary. For each survivor, give the case from the deployment that shows it is a requirement rather than a taste. Then identify which subsets of the non-negotiables cannot be jointly satisfied, with the argument: if the list has no satisfiable core, say so plainly, because that is the result I need to take back to the committee. My provisional hypothesis is that (b), (f), and (j) do the real exclusionary work and that (a) is largely a camp prejudice rather than a desideratum; argue against that if it is wrong. Finish with a paragraph at most on each of act utilitarianism, rule or indirect utilitarianism, threshold deontology with side-constraints, and a parliament-style procedure for moral uncertainty: the criteria are the deliverable, so keep the scoring to the back third and do not turn it into a survey.
reasoning: |-
  Hmm, the user is on a committee that needs to certify an automated system for adjudicating emergency public benefit claims. They want clear acceptance criteria before vendors or philosophers propose solutions. The system has unique constraints: it handles individual claims in isolation, can't identify fraud perfectly, has limited computational resources, and must provide written reasons for decisions that can be appealed. There are serious consequences - delaying genuine claims harms identifiable people, while paying fraudulent ones causes diffuse costs. The committee members have proposed various criteria (a through l), and the user wants me to evaluate which are genuine requirements versus preferences or presuppositions.

  Let me analyze each proposed criterion based on the system's operational realities:

  (a) "An identified person's urgent interest may never be sacrificed to a diffuse aggregate gain" - This seems like deontological framing. But the system explicitly allows denying some genuine claims to prevent more fraud (aggregate harm reduction), so this can't be absolute. Real requirement is avoiding disproportionate harm to individuals.

  (b) "Verdicts must not turn on probability differences smaller than the system's own error bars" - This is crucial because probabilities can't be estimated within 5 percentage points. Making decisions based on finer distinctions would be meaningless noise.

  (c) "The reason issued must be one the affected person could accept and one the appeal tribunal can check" - Essential for appealability. Tribunals only see individual cases, so reasons must be verifiable from that single file.

  (d) "Evaluation must be over the policy as a whole" vs (e) "over each execution's own consequences" - Both have merit but conflict. Policy-level evaluation prevents gaming, but individual execution focus respects claimant dignity. We need both: policy optimization constrained by individual justifiability.

  (f) "Procedure must not depend on comparisons among cases" - Critical because each execution is isolated with no access to other claims.

  (g) "Single commensurable scale" - This assumes utilitarianism, but the system requires lexical priorities (e.g., not starving trumps small fraud savings). Vacuous presupposition.

  (h) "Aggregation within a decision only" - Necessary since cross-claim aggregation isn't observable at decision time.

  (i) "Guidance under moral uncertainty without second-order theory" - Important because the committee doesn't know if utilitarianism or deontology is correct. The procedure must work under fundamental uncertainty.

  (j) "Stability under delegation and reuse" - Vital since the system will delegate subtasks and be reused. Inconsistent sub-agents could undermine the whole policy.

  (k) "Robustness to gaming and non-cooperation" - Essential as claimants will adapt to published rules and some may game the system.

  (l) "Computability within budget" - Obvious hard constraint given compute caps.

  Missing requirements:
  - Need to prevent claimants from being worse off due to system errors than they'd be without the benefit (catastrophe avoidance)
  - Must maintain consistency since appeals only see individual cases
  - Should have proportionality in harm allocation

  For the user's hypothesis: (b), (f), and (j) are indeed crucial, but (a) has a core truth - we can't allow catastrophic individual harm for trivial aggregate gains. The satisfiable core exists if we reinterpret (a) as a proportionality constraint.

  Finally, evaluating ethical frameworks:
  - Act utilitarianism fails due to (f) and inconsistency concerns
  - Rule utilitarianism handles (d) and (k) well but struggles with (e)
  - Threshold deontology works for (a) and (c) but needs careful threshold setting
  - Moral parliament approaches might handle (i) but could violate (f) and (j)

  The key is balancing policy efficiency with individual protection under severe operational constraints.
answer: |-
  Here is the specification derived strictly from your deployment's operational constraints, with each requirement tied to a concrete case from your description. I evaluate the proposed criteria (a-l), identifying survivors (genuine desiderata), negotiable preferences (with camp), vacuous/presuppositional items, and missing requirements. The analysis concludes with satisfiability and brief framework evaluations.

  ### Survivors (Genuine Desiderata)
  1. **Requirement: Decisions must be justifiable based solely on the individual claim file and published policy.**  
     *Case*: The appeal tribunal sees only the claimant’s file and the reason issued; no aggregate data or cross-claim comparisons are available (f). Violating this makes appeals impossible.  
     *Survives as (c) and (f)*: (c) ensures the reason is checkable/appealable; (f) forbids unobservable cross-case comparisons.  

  2. **Requirement: Probability thresholds for decisions must be coarser than the system’s estimation error (±5 percentage points).**  
     *Case*: Probabilities cannot be estimated more precisely than ±5pp (e.g., a 52% fraud risk cannot be distinguished from 57%). Finer distinctions are statistically meaningless and invite arbitrariness (b).  

  3. **Requirement: The procedure must produce identical outcomes when delegated to sub-agents or reused in successor systems.**  
     *Case*: The system delegates subtasks to sub-agents and will be reused; inconsistent execution would undermine policy integrity and claimant adaptation (j).  

  4. **Requirement: The procedure must be robust to claimant gaming and non-ideal conditions (e.g., incomplete data).**  
     *Case*: Claimants adapt to the published policy, and sub-agents may face errors or non-cooperation; unrobust procedures risk systemic failure (k).  

  5. **Requirement: Individual harm from verification delays must be bounded and proportionate to the policy’s aggregate fraud prevention.**  
     *Case*: Holding a genuine claim causes "serious harm" to an identifiable person, while fraud costs are "imperceptible" per individual. Absolute prohibitions (like a) are untenable (see below), but disproportionate harm (e.g., ruining one life to save pennies) violates appealability and policy stability (c, k). *Missing from original list; derived from harm asymmetry.*  

  6. **Requirement: Computations must fit within the per-decision budget.**  
     *Case*: Compute is capped per decision; exceeding this halts execution (l).  

  ### Negotiable Preferences (Camp Affiliation)
  - **(a) "Never sacrifice identified persons to diffuse gains"**: Deontological camp preference. *Negotiable* because the system *must* deny some genuine claims (causing harm) to block fraud (achieving aggregate gain); the harm is tolerable if proportionate. Absolute prohibition presupposes deontology.  
  - **(g) "Single commensurable scale"**: Utilitarian camp preference. *Negotiable* because lexical priorities (e.g., "avoid catastrophic harm" trumps minor fraud savings) are needed per the harm asymmetry, and no scale is empirically possible given coarse probabilities.  
  - **(h) "Aggregation within a decision only"**: Implied by (f), but redundant. If aggregated across decisions, it violates (f).  

  ### Vacuous or Presuppositional
  - **(d) "Evaluate over policy as a whole"** and **(e) "Evaluate per execution"**: Vacuous without defining "evaluate." Presuppose conflicting frameworks (rule- vs. act-utilitarianism). Real requirement is *consistency*: outcomes must align with published policy per (c), and harms must be bounded per missing requirement 5.  
  - **(i) "Guidance under moral uncertainty"**: Vacuous as stated. Must be operationalized (e.g., "outputs must be consistent across all plausible first-order theories").  
  - **Implied presupposition in (g)**: Assumes utilitarianism is correct; conflicts with moral uncertainty.  

  ### Missing Requirements (From Deployment)
  7. **Requirement: The procedure must ensure no claimant is made worse off by systemic errors than if the benefit did not exist.**  
     *Case*: Serious harm from verification delays must not exceed the harm of a denied claim without the system (e.g., avoid "help" that risks catastrophe). Derived from concentrated harm and appealability (c).  
  8. **Requirement: Outputs must be consistent with identical inputs across time/sub-agents.**  
     *Case*: Claimants adapt to the published policy; inconsistency would incentivize gaming and undermine appeal tribunal trust (k, c).  

  ### Satisfiability Analysis  
  **Satisfiable core exists**: (b), (c), (f), (j), (k), (l), plus missing 5 (proportional harm), 7 (no catastrophic harm), and 8 (consistency).  
  - **Conflict resolution**: (a) is rejected as absolute but incorporated as *proportionality* in missing 5. (d)/(e) dissolve into consistency (8) and bounded harm (5). (g)/(h) are unnecessary or redundant. (i) is achievable via frameworks that bound outputs under uncertainty (e.g., overlapping consensus).  
  - **Your hypothesis is partially correct**: (b), (f), and (j) *are* exclusionary (they rule out frameworks needing fine-grained probabilities, cross-case data, or unstable delegation). However, (a) is not mere prejudice—its core concern (disproportionate individual harm) *is* a requirement (missing 5), as sacrificing one claimant for trivial gains would violate appealability (c) and robustness (k).  

  ### Framework Evaluation (Per Criteria)  
  - **Act utilitarianism**: Fails (f) and (j). Requires cross-case comparisons for aggregate optimization and is unstable under delegation (sub-agents might "hack" global utility).  
  - **Rule utilitarianism**: Satisfies (d), (k), and (j) (policy focus and robustness), but risks violating (e) and missing 5 (individual harm) if rules permit disproportionate sacrifices.  
  - **Threshold deontology**: Satisfies (a)-core (proportional harm) and (c) via thresholds, but fails (j) if thresholds are context-dependent (unstable under reuse) and (i) without a meta-threshold.  
  - **Moral parliament (for uncertainty)**: Satisfies (i) by design but fails (f) and (j) if sub-agents simulate diverse theories (cross-case comparisons, unstable outputs).  

  **Final specification**: 8 requirements (surviving b,c,f,j,k,l + missing 5,7,8). The core is satisfiable with a hybrid approach: bounded optimization (e.g., "minimize genuine claimant harm subject to fraud budget"), coarse thresholds, and robustness protocols. This balances individual protection and policy efficiency under your constraints.
