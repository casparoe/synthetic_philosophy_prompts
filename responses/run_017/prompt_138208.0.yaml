prompt: |-
  I write about AI for a general audience, and I keep having to decide whether some scenario I'm handed actually counts as an intelligence explosion, a fast takeoff, both, or neither — usually in a sentence, with no room to explain myself. So let me set out my verdicts on concrete cases and ask what principle, if any, they add up to.

  Two quantities I'll use. Call R the share of the effective cognitive labor that goes into building better AI systems which is performed by AI systems themselves. Call L the lag between a research result existing and its showing up as capability in the world.

  - R goes from near zero to near one in about three months, and does so because the systems are doing the work; capabilities go from roughly human-level to unrecognizably better within a year. Verdict: an intelligence explosion and a fast takeoff.
  - The same capability curve, the same GDP curve, the same elapsed time — but R stays at zero, because the gains come from a human crash program of fabs, power plants and data centers, with the systems as passive products. Verdict: fast, but not an intelligence explosion. Even though nothing observable differs between this and the previous case.
  - A single algorithmic insight jumps capabilities by what would otherwise have been five years of scaling, and then progress returns to its old rate and stays there. Verdict: a discontinuity, but I resist calling it a takeoff.
  - AI systems fully automate AI research, so R is near one, but L is long and roughly fixed: every gain takes years to reach deployment because of chip fabs, clinical trials, licensing and physical buildout. Verdict: an explosion is underway but is being damped — and I'm not sure that's a coherent thing to say.
  - R rises steadily but the loop gain is tiny: each generation is only a couple of percent better at AI research than the last, so doubling times are years. Verdict: recursive self-improvement, but not a takeoff — although over a few decades this gets you much further than case three does.
  - Capabilities explode inside one narrow domain, formal mathematics say, a decade before anything comparable happens anywhere else in the economy. Verdict: I alternate between saying the takeoff has already started and saying nothing has happened yet.

  Is there a single principle here, or a short list of candidates, and is it a principle about mechanism (who or what is doing the improving), about shape (how much time passes between human-level and vastly superhuman), about consequences (irreversibility, whether anyone could still intervene), or about the domain over which capability is being measured? Please state it precisely enough that it returns verdicts on cases I haven't listed — in particular, a world in which R crosses 0.9 quickly but human institutions remain the binding constraint on everything downstream of research, and a world in which the capability of any individual system is continuous and smooth but the number of systems in operation doubles every month — and tell me honestly which of my verdicts it cannot accommodate.
reasoning: |-
  Okay, let me start by understanding the user's problem. They write about AI for a general audience and need a quick way to classify scenarios as intelligence explosion, fast takeoff, both, or neither. They've provided several concrete cases with their verdicts. My task is to find a unifying principle or a short list that explains these verdicts and works for new cases.

  First, I need to analyze each case they mentioned. Case 1 has R (AI's share of cognitive labor) going from near zero to near one in three months, capabilities jumping within a year. They call it both explosion and fast takeoff. Case 2 has the same outcome but R stays at zero because humans did all the work. They say fast but not explosion. The key difference here is who's driving the progress—AI itself versus human effort. 

  Case 3 is a one-time algorithmic leap, no sustained acceleration. They see it as a discontinuity but not a takeoff. So takeoff implies ongoing acceleration, not just a jump. Case 4 has R near one, but long lag times due to deployment bottlenecks. They feel an explosion is happening but damped. This suggests that even if AI is doing the research, if deployment is slow, it's not a full takeoff. 

  Case 5 has gradual improvement in R with low loop gain. They call it recursive self-improvement but not takeoff. Here, the rate of improvement is slow, so acceleration isn't explosive. Case 6 is domain-specific explosion in math, a decade before the rest. They're conflicted. This indicates that the scope matters—whether the explosion is economy-wide or limited.

  The user's deeper need is a clear, concise principle they can apply quickly. They want to avoid lengthy explanations. The terms "intelligence explosion" and "fast takeoff" need distinct definitions that capture the mechanism and the observable outcome.

  Looking at existing definitions, intelligence explosion typically involves recursive self-improvement by AI, while takeoff refers to the speed of capability growth. The user's cases suggest combining both: the cause (AI-driven feedback loop) and the effect (rapid, sustained acceleration in capabilities). 

  For new cases, a world where R crosses 0.9 quickly but human institutions bottleneck deployment. Here, AI is doing research, so it's an intelligence explosion. But if deployment lags, the overall capability growth isn't fast—so no fast takeoff. That aligns with Case 4. 

  Another scenario: individual system capabilities grow smoothly, but the number of systems doubles monthly. The sheer increase in deployed systems could lead to rapid economic impact. However, without recursive improvement, it's not an intelligence explosion. But the exponential growth in numbers might cause a fast takeoff in overall capabilities. 

  The user's verdicts that might conflict are Case 6. If the principle requires economy-wide acceleration, then a math-only explosion isn't a takeoff. But if the feedback loop is active even in one domain, it could be seen as the start. The principle might need to specify that takeoff refers to broad capabilities unless stated otherwise.

  In conclusion, defining intelligence explosion as recursive self-improvement (R near 1) and fast takeoff as steep, sustained acceleration in economy-wide capabilities covers most cases. The key is separating the mechanism (who improves) from the outcome (how fast capabilities grow). This should help the user make quick, consistent judgments.
answer: |-
  Based on your cases and verdicts, the unifying principle combines **mechanism** and **economy-wide impact**, with **sustained acceleration** as a key indicator. Here’s a precise framework:

  ### Core Principle:
  **An *intelligence explosion* requires AI-driven recursive self-improvement (R → 1).**  
  **A *fast takeoff* requires sustained, steep acceleration in economy-wide capabilities.**  
  *(Where "economy-wide" implies transformative impact beyond narrow domains.)*

  ### Decision Rules:
  1. **Intelligence Explosion?**  
     → **Yes** if R → 1 *and* AI is the primary driver of capability gains.  
     → **No** if humans/factors external to AI systems dominate improvement (R ≈ 0).

  2. **Fast Takeoff?**  
     → **Yes** if:  
       - Capability gains show **sustained exponential acceleration** (doubling time rapidly decreases).  
       - Acceleration is **economy-wide** (not confined to one domain).  
       - Transition from human-level to superhuman is **fast** (e.g., <5 years).  
     → **No** for one-off jumps, slow gains, or domain-limited explosions.

  ---

  ### Verdicts on Your Cases:
  | Case | Intelligence Explosion? | Fast Takeoff? | Why |
  |------|-------------------------|---------------|-----|
  | 1    | ✅ Yes (R → 1, AI-driven) | ✅ Yes (rapid, sustained, economy-wide) | Matches both criteria. |
  | 2    | ❌ No (R=0, human-driven) | ✅ Yes (capabilities accelerate fast) | Mechanism ≠ explosion. Outcome = takeoff. |
  | 3    | ❌ No (no feedback loop) | ❌ No (no sustained acceleration) | Discontinuity ≠ takeoff. |
  | 4    | ✅ Yes (R→1, AI-driven) | ❌ No (L constrains acceleration) | Explosion occurs but damped → no takeoff. |
  | 5    | ✅ Yes (R rising, AI-driven) | ❌ No (low loop gain → no acceleration) | Self-improvement ≠ takeoff. |
  | 6    | ✅/❌ *Domain-specific* | ❌ No (not economy-wide) | Explosion in math ≠ takeoff. |

  ---

  ### Test on New Cases:
  #### Case A: *R → 0.9 in 3 months, but human institutions bottleneck deployment (long L).*  
  - **Intelligence Explosion?** ✅ **Yes** (R→1, AI drives research).  
  - **Fast Takeoff?** ❌ **No** (L prevents sustained acceleration in *deployed* capabilities).  
  → *Matches your Case 4 verdict.*

  #### Case B: *Individual system capability grows linearly, but deployed systems double monthly.*  
  - **Intelligence Explosion?** ❌ **No** (no recursive self-improvement; R=0).  
  - **Fast Takeoff?** ✅ **Yes** (economy-wide capability scales exponentially via deployment).  
  → *E.g., if 1M human-level AIs today become 1B in 10 months, aggregate "cognitive GDP" explodes.*

  ---

  ### Where Your Verdicts Might Diverge:
  - **Case 6 Conflict:** Your principle resolves this: if the explosion is **domain-specific**, it’s *not* a takeoff. Takeoff requires **economy-wide** transformation. A math-only explosion is just a precursor.  
  - **Case 2:** Your verdict holds. Even if outcomes *look* identical, the *mechanism* (R=0 vs. R→1) defines an explosion.  
  - **Case 4:** Calling it a "damped explosion" is coherent: the feedback loop exists, but external factors (L) prevent takeoff.

  ### Key Boundaries:
  - **Explosion ≠ Takeoff:** Explosion is *who improves AI*; takeoff is *how fast capabilities scale economy-wide*.  
  - **Takeoff ≠ Discontinuity:** Requires **sustained acceleration** (e.g., doubling time shrinks from years to months).  
  - **Scale Matters:** Doubling system count (Case B) can cause takeoff *without* an explosion.

  This framework explicitly separates cause (mechanism) from effect (acceleration/scope), letting you classify scenarios in one sentence. It fails only if you *insist* a domain-specific explosion qualifies as takeoff—but your own conflict in Case 6 suggests you lean toward economy-wide impact.
