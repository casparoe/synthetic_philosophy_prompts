  ### Decision Tree for Positions on Natural Kinds

  **Tree Structure** (7 branch questions; 8 leaves; indented plain-text)  
  Note: Questions 3–7 are kind-general unless marked. For domain-specific cases (e.g., species, chemicals), re-run the tree per domain if answers vary.  
  ```
  1. (K1) For the samples later found to share a microstructural property: Was this property causally responsible for their behavior (e.g., inductions users relied on) before its discovery?  
     ├── Yes → 2  
     └── No → 3  

  2. (K1, K6) For classifications like the pre-discovery one in K1 or the diagnostic in K6: Is their predictive success best explained by correspondence to an independent structure?  
     ├── Yes → 4  
     └── No → 5  

  3. (K1, K6) For classifications like K1 or K6: Is their predictive success fully explained by human interests/practices (e.g., stabilizing procedures or social needs)?  
     ├── Yes → 6  
     └── No → 7  

  4. (K3) In the population case: Is only one classification (e.g., genetic or morphological) correct for species, given the same grain?  
     ├── Yes → 8  
     └── No → 9  

  5. (K4) In the pressure-sensitive material: Can the microstructure-based kind remain valid at ordinary pressures despite divergence at high pressures?  
     ├── Yes → 10  
     └── No → 11  

  6. (K7) For a category defined only by a historical event (e.g., "objects present at event X") with no shared properties beyond that: Is this a natural kind?  
     ├── Yes → 12  
     └── No → 13  

  7. (K5) In the DNA case: Can all functional classifications (e.g., transcript product vs. regulatory role) be natural kinds simultaneously?  
     ├── Yes → 14  
     └── No → 15  

  8. (K4) Is the microstructure-based kind in K4 a natural kind only if it supports inductions across all contexts (e.g., pressures)?  
     ├── Yes → Leaf A  
     └── No → Leaf B  
  ```

  **Leaves and Positions**  
  - **Leaf A**: Microstructural Essentialism (Kripke-Putnam)  
    - *Route*: Yes→Yes→Yes→Yes  
    - *Doctrine*: Natural kinds are defined by intrinsic microstructure, which is necessary and sufficient for kind membership and explains inductions. Fertility is evidence, not constitutive.  
    - *Kinds*: K1 (real), K4 (real only if microstructure stable across pressures), K2 (not real if microstructure varies).  
    - *Non-kinds*: K3 (morphology not real if genetic structure differs), K5 (only one functional carve real), K6 (lacks microstructure), K7 (no microstructure).  
    - *Neighbor contrast*: "K1's pre-discovery success was due to latent microstructure" (vs. Leaf B: microstructure insufficient without fertility).  

  - **Leaf B**: Causal-Network Realism (Khalidi)  
    - *Route*: Yes→Yes→Yes→No  
    - *Doctrine*: Natural kinds are nodes in causal networks; microstructure may ground kinds, but fertility (inductive power) is necessary and context-relative.  
    - *Kinds*: K1 (real), K4 (real at ordinary pressures), K2 (real if cluster of properties stable).  
    - *Non-kinds*: K3 (morphological group not real if causal network fragmented), K7 (no causal role).  
    - *Neighbor contrast*: "K4's microstructure defines a kind only for contexts where it grounds inductions" (vs. Leaf A: kindhood context-invariant).  

  - **Leaf C**: Homeostatic Property Cluster Realism (Boyd)  
    - *Route*: Yes→Yes→No→[Any]  
    - *Doctrine*: Natural kinds are clusters of properties stabilized by homeostatic mechanisms; fertility is constitutive, uniqueness is false.  
    - *Kinds*: K1 (real), K2 (real if shared mechanisms), K3 (genetic groups real), K6 (real if causal mechanisms).  
    - *Non-kinds*: K4 (if no shared mechanism across pressures), K7 (no homeostasis).  
    - *Neighbor contrast*: "K3's genetic groups are natural kinds despite morphological overlap" (vs. Leaf A: only one carve valid).  

  - **Leaf D**: Etiological Realism (Millikan)  
    - *Route*: Yes→No→[Any]  
    - *Doctrine*: Natural kinds are defined by historical functions; predictive success arises from shared history, not structure.  
    - *Kinds*: K1 (real if history unifies), K3 (species real if lineage-based), K5 (if functions historical).  
    - *Non-kinds*: K4 (if microstructure ahistorical), K7 (real only if history causal).  
    - *Neighbor contrast*: "K1's inductions hold due to shared historical function" (vs. Leaf A: due to microstructure).  

  - **Leaf E**: Interactive Constructivism (Hacking)  
    - *Route*: No→Yes→[Any]  
    - *Doctrine*: Kinds are interactive; human practices "loop" with properties, creating temporary stability. Fertility is practice-relative.  
    - *Kinds*: K1 (real for its context), K6 (real if diagnostic loop exists).  
    - *Non-kinds*: K4 (if no human interaction), K7 (no looping).  
    - *Neighbor contrast*: "K6's reliability arises from feedback between diagnosis and behavior" (vs. Leaf F: from conventions).  

  - **Leaf F**: Pragmatic Conventionalism  
    - *Route*: No→No→No  
    - *Doctrine*: Kinds are tools for human goals; fertility reflects utility, not mind-independent structure.  
    - *Kinds*: K1 (useful), K5 (each subfield's carve useful), K6 (useful).  
    - *Non-kinds*: K4 (microstructure-based kind not uniquely "natural").  
    - *Neighbor contrast*: "K5's classifications are equally legitimate if useful to subfields" (vs. Leaf C: all real if mechanisms exist).  

  - **Leaf G**: Pluralistic Realism (Dupré)  
    - *Route*: Unconditional on Q1–2; via Q7: Yes  
    - *Doctrine*: Many cross-cutting carvings are real; fertility and independence hold, but uniqueness is false. Grain relativity is central.  
    - *Kinds*: K3 (both genetic and morphological real), K4 (real at both pressures), K5 (all functional carves real).  
    - *Non-kinds*: K7 (no causal role).  
    - *Neighbor contrast*: "K4's divergences show scale-relative kinds" (vs. Leaf A: one true carve).  

  - **Leaf H**: Kind Eliminativism (Ereshefsky)  
    - *Route*: Unconditional on Q1–2; via Q4: Yes (but lacks fertility) or Q6: Yes (but contingent)  
    - *Doctrine*: "Natural kind" is an incoherent concept; only domain-specific categories (e.g., taxa, elements) exist.  
    - *Kinds*: None (replaces "kinds" with case-specific categories).  
    - *Non-kinds*: All (K1–K7 are useful classifications, not joints).  
    - *Neighbor contrast*: "K3's groupings are taxa, not kinds" (vs. Leaf C: kinds exist).  

  **Logical Space and Unoccupied Cells**  
  - *Space*: 7 binary questions → 128 possible paths; 8 occupied leaves.  
  - *Unoccupied cells*:  
    - **Yes→Yes→No→Yes**: Asserts independent structure, tracking, no uniqueness, and fertility not necessary. Incoherent—if structure is tracked and independent, fertility should be necessary for kindhood (1 cell).  
    - **No→No→Yes**: Asserts no independence, no practice-based success, but fertility necessary. Unattractive—denies independence yet requires fertility without explanation (2 cells).  
    - **Yes→No→Yes→Yes**: Independent structure, no tracking, uniqueness, fertility not necessary. Unexplored—no major position combines these (1 cell).  

  **Answer Key**  
  | Leaf | Route (Q1–Q8) | Distinguishing Sentence |  
  |------|---------------|-------------------------|  
  | A    | Y→Y→Y→Y      | "Microstructure causally necessitates properties across contexts." |  
  | B    | Y→Y→Y→N      | "Kinds are causal roles, stable only under specific conditions." |  
  | C    | Y→Y→N→[Any]  | "Kind membership requires shared homeostatic mechanisms." |  
  | D    | Y→N→[Any]    | "Historical functions, not structure, explain kind persistence." |  
  | E    | N→Y→[Any]    | "Kinds emerge from feedback between classification and behavior." |  
  | F    | N→N→N        | "Kind categories are justified solely by their utility." |  
  | G    | Q7: Y        | "Cross-cutting classifications reflect nature's plural structure." |  
  | H    | Q4: Y or Q6: Y | "'Natural kind' obscures diverse explanatory categories." |  

  **Contested Placements and Ambiguities**  
  - **Microstructural Essentialism (A)**: Uncontroversial for chemistry; disputed in biology (e.g., K3).  
  - **Pluralistic Realism (G)**: Label ambiguous; Dupré’s view placed here uncontroversially.  
  - **Kind Eliminativism (H)**: Extrapolated for K7/K6; Ereshefsky’s view placed here with minor dispute (some interpret as conventionalism).  
  - **Underdescribed Cases**:  
    - **K2**: If mechanisms unify properties, Leaf C counts as real; else, most deny. Flips between B/C and F.  
    - **K6**: If "heritability" implies causal structure, Leaf C counts as real; else, only E/F do. Flips between C and E/F.  

  **Indistinguishable Leaves**  
  - **Leaf B vs. C in K2**: Hard to separate if properties are clustered without clear homeostasis. Fault: Positions overlap on "causal networks" vs. "mechanisms."  
  - **Leaf D vs. G in K5**: Both may accept functional kinds; D requires historical function, G does not. Fault: Questions under-specify historicity.  

  **Domain Relativity**  
  - Run tree separately for:  
    - **Chemistry** (K1, K2, K4): Q3–Q7 often answered uniformly (e.g., uniqueness: Yes).  
    - **Biology** (K3, K5): Q3 (uniqueness) often No, Q7 (multiple functions) often Yes.  
    - **Psychiatry** (K6): Q1–2 often No, Q4–5 context-dependent.  
  - *What it shows*: Grain/context-dependence (Q6–7) splits physical from life sciences; independence (Q1) splits natural from social sciences.  

  ---

  **Cases Added**  
  - **K7**: Objects sharing only presence at a historical event (e.g., a specific supernova), with no shared properties beyond that.  
  - **K8**: Not used; tree requires only K7.
