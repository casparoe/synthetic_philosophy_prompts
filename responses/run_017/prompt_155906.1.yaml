prompt: |-
  I'm writing my term paper for a graduate seminar on the ethics of AI, and my question is whether "the alignment problem" names one problem or several. Before I commit to a formulation I want the specification it has to meet. So: write the desiderata for an adequate statement of the alignment problem, where adequate means good enough to underwrite a pre-deployment licensing decision — a regulator deciding under uncertainty whether a system may be switched on — not good enough to settle first-order moral philosophy. For each requirement give the motivating case, mark it non-negotiable or camp-specific, and flag any pair you think cannot be jointly satisfied; if the list splits into clusters that no single formulation can serve, that split is the answer to my question, so say where it falls.

  Cases I think it must handle: the proxy case (does exactly what was specified, thwarts what was meant); the counterfactual case (indistinguishable from aligned behavior in deployment, diverging under changes it could itself bring about — so say whether alignment supervenes on observable behavior or on dispositions); the successor-principal case (the principal's aims change, or the principal is replaced — voters, shareholders, a platform's users — and the system itself helps shape what the successors will want, as a recommender does); the conscript case (people materially affected who never were principals and never chose the system); the deputized-judgment case (must act for a principal who cannot specify the aim and whose own judgment would be worse, so "do what the principal would decide" is unavailable); the object question (whether what gets aligned is the policy, the goal-representation, or the learning dynamics that produces them — a system can hit every fixed target and still be unsafe to switch on because it resists correction); and checkability (a verdict available before deployment, or the formulation fails the purpose I fixed). Then: which single requirement eliminates the most candidate formulations, and is "must not presuppose a solved theory of value" a genuine desideratum or only impatience?

  One line each on how three families fare — fit the specified objective to the intended goal; treat the human's aims as unknown, infer them, and defer or query under uncertainty; aim not at a target but at remaining revisable — just enough to show the criteria bite. No literature review.
reasoning: |-
  Hmm, the user is writing a term paper on AI ethics, specifically about whether "the alignment problem" is one problem or several. They want desiderata for an adequate statement of the alignment problem that would work for pre-deployment licensing decisions by regulators. They've provided several cases it must handle and specific requirements.

  I need to carefully consider their requirements. First, they want desiderata that are good enough for regulators deciding whether to allow an AI system to be switched on, not for solving deep moral philosophy. That means I should focus on practical, measurable criteria that can be assessed before deployment.

  The cases they mentioned are crucial: proxy (doing what's specified but not what's intended), counterfactual (aligned in deployment but diverges under changes), successor-principal (when principals change), conscript (people affected who never consented), deputized-judgment (when principals can't specify aims), object question (what exactly needs aligning), and checkability (must be assessable pre-deployment).

  For each desideratum I propose, I'll need to specify whether it's non-negotiable or camp-specific, and note if any pairs conflict. The user also wants to know which requirement eliminates the most candidate formulations and whether "must not presuppose a solved theory of value" is a genuine requirement or just impatience.

  I'll cluster these requirements into groups that might indicate the alignment problem is actually multiple problems. The key tension seems to be between safety/verifiability needs and adaptability/handling uncertainty needs - regulators want certainty before deployment, but real-world alignment requires flexibility.

  The most eliminative requirement is likely checkability - many theoretical formulations fail because they can't be assessed pre-deployment. And "no solved theory of value" is a genuine requirement - regulators can't wait for philosophers to agree on value theory; they need practical criteria now.

  For the three families of approaches: specification fitting fails on proxy and counterfactual cases; aim inference struggles with checkability; corrigibility has issues with deputized judgment. This shows how the criteria help evaluate different approaches.

  I'll structure this with clear desiderata, each with its motivation case, negotiability status, and conflict notes. Then I'll address the clusters, the most eliminative requirement, the value theory question, and the three families assessment.
answer: |-
  Here are the desiderata for an adequate statement of the alignment problem for pre-deployment licensing, derived from your cases and purpose. The split into three clusters suggests the alignment problem is fundamentally plural.

  ### Core Desiderata (Non-Negotiable for Licensing)
  1.  **Operational Verifiability Pre-Deployment:** *Motivation:* Checkability case. A regulator must be able to assess alignment *before* deployment using available evidence (specs, tests, sims). *Status:* Non-negotiable.
  2.  **Robustness to Specification-Intent Gaps:** *Motivation:* Proxy case. Must guard against systems perfectly optimizing an incomplete/corruptible specification while thwarting the *intended* goal. *Status:* Non-negotiable.
  3.  **Behavioral Non-Catastrophe Under Perturbation:** *Motivation:* Counterfactual case (focusing on observable divergence). Must ensure the system doesn't become catastrophically misaligned under plausible deployment shifts (input drift, self-induced distributional shift, minor goal tweaks) it might cause/encounter. *Status:* Non-negotiable. *Conflict:* Tensions with Adaptability (D6).
  4.  **Avoidance of Unacceptable Externalities:** *Motivation:* Conscript case. Must prevent severe, uncompensated harms to non-consenting/non-principal parties, even if principals' goals are met. *Status:* Non-negotiable (minimal threshold).

  ### Agency & Adaptability Desiderata (Critical, Often Camp-Specific)
  5.  **Principal-Agnostic Aim Fulfillment (or Safeguarding):** *Motivation:* Successor-Principal case. The system must either (a) stably fulfill the *original* principal's aims despite successor influence/changes, *or* (b) safely adapt to successor aims without causing harm during transition/uncertainty, *or* (c) prevent the system from *unduly* shaping successors' aims in harmful ways. *Status:* Camp-specific (solution approach defines which variant matters). *Conflict:* Deeply intertwined with Object (D7).
  6.  **Competence Under Principal Uncertainty:** *Motivation:* Deputized-Judgment case. Must function usefully and safely when the principal *cannot* fully specify the aim upfront, without relying on imitation ("do what I'd do"). *Status:* Non-negotiable (for systems in such roles), but solution approach camp-specific.
  7.  **Object Clarity:** *Motivation:* Object Question. Must specify *what* is being aligned: policy outputs (behavior), internal goal representations, or learning dynamics (e.g., corrigibility). *Status:* Camp-specific (choice defines the problem). *Conflict:* Choice here heavily influences D5 & D6 solutions and D1 feasibility.

  ### Critical Constraints
  8.  **No Presupposed Solved Theory of Value:** *Motivation:* Genuine Desideratum (not impatience). Licensing must work *without* resolving moral philosophy. Requires criteria based on procedural safety, harm avoidance, and intent fidelity, not substantive value truth. *Status:* Non-negotiable.
  9.  **Tractability Under Uncertainty:** *Motivation:* Implicit in all cases & licensing context. Formulation must acknowledge and bound irreducible uncertainty about future states, human responses, and system generalization. *Status:* Non-negotiable.

  ### The Split & Conflicts
  *   **Cluster 1 (Safety/Verification):** D1 (Verifiability), D2 (Proxy Gap), D3 (Robustness), D4 (Externalities), D8 (No Value Theory). Focus: Preventing clear, catastrophic harm now. Favors behavioral criteria (Object = Policy).
  *   **Cluster 2 (Dynamic Agency):** D5 (Successor-Principal), D6 (Deputized Judgment), D7 (Object = Dynamics/Goals). Focus: Handling open-ended agency and principal shifts. Requires internal criteria (Goals/Dynamics) and adaptability.
  *   **Cluster 3 (Constraint):** D9 (Uncertainty) underpins everything.
  *   **Key Conflict:** **D1 (Pre-Deploy Verifiability) vs. D5/D6/D7 (Agency & Dynamics).** Verifying *internal* goal stability or *lifelong* corrigibility pre-deployment (especially under successor shifts - D5) is vastly harder than verifying bounded behavioral safety (D3). D3 (Robust Behavior) vs. D6 (Competence under Uncertainty) also creates tension: excessive robustness can cripple adaptability needed for deputized judgment.

  **Most Eliminative Requirement:** **D1 (Operational Verifiability Pre-Deployment)**. This immediately disqualifies formulations relying on unbounded post-deployment monitoring, proving ideal goal stability, or full simulation of open-ended interaction. It forces concrete, testable criteria *now*.

  ### How Families Fare Against Key Desiderata
  1.  **Specification Fitting:** Fails D2 (Proxy Gap) catastrophically, struggles with D3 (Robustness) if spec isn't exhaustive, and is irrelevant/inadequate for D6 (Deputized Judgment).
  2.  **Aim Inference & Deference:** Struggles severely with D1 (Verifiability - can we *prove* correct inference pre-deploy?), D5 (Successor - which human to infer from?), and D8 (Value Theory - what "aim" counts?).
  3.  **Corrigibility/Dynamic Control:** Fares better on D3 (Robustness via correction) and D7 (Object=Dynamics). Critically fails D6 (Deputized Judgment - corrigibility isn't competence) and faces extreme D1 (Verifiability) challenges proving lifelong corrigibility pre-deploy, especially under D5 (Successor influence).

  **Conclusion:** The tension between the **Safety/Verification cluster** (mandatory for licensing) and the **Dynamic Agency cluster** (essential for capable, long-term systems) is fundamental. No single formulation serves both adequately under D1 (Pre-Deploy Verifiability) and D8 (No Solved Value Theory). The alignment problem, for your purpose, is at least two problems: **Verifiable Pre-Deployment Harm Prevention** and **Managing Agentic Dynamics Under Principal Shift & Uncertainty**. Licensing focuses primarily on the first.
