prompt: |-
  I sit on the funding committee of a small foundation that moves somewhere between ten and fifteen million dollars a year. We rank causes with the importance–tractability–neglectedness framework that circulates in this part of the philanthropic world: score a cause by the value of solving (or substantially reducing) the problem, multiplied by the share of the problem you can expect to eliminate per million dollars spent, multiplied by how little is already going into it. One of our programme officers has written an internal paper arguing that the framework cannot underwrite a durable funding strategy. I cannot find the mistake in it, and I also cannot accept its conclusion. Reconstructed as cleanly as I can:

  (1) Our score for a cause C is S(C) = I(C) × T(C) × N(C), where I is the value of eliminating the problem, T is expected problem-eliminated per dollar at current spending levels, and N is (inversely) the resources already devoted to C.

  (2) S(C) is not a property of C alone. Both T and N are functions of what other funders are doing, so S depends on other agents' behaviour. Call any quantity with that feature crowding-sensitive. This step is not in dispute; it is why we re-run the ranking each cycle.

  (3) A decision procedure is admissible as the basis of a standing strategy only if widespread compliance with it does not systematically destroy the conditions in virtue of which it issued its recommendation. A procedure that is self-defeating in that sense cannot guide action at scale, however well it serves whoever moves first.

  (4) ITN is self-defeating in precisely that sense. Its top-ranked cause is by construction one that few others are funding. Acting on the recommendation moves money and people into that cause; that raises the resources going to it, which lowers N, which lowers S; and if enough of us act on it, the cause stops being top-ranked. The recommendation erases the ground it stood on.

  (5) None of this turns on the details of ITN. Take any crowding-sensitive quantity, build a rule that says do more of whatever currently scores highest on it, and the same thing happens: successful compliance moves the quantity and withdraws the reason for complying. So no crowding-sensitive framework can support a standing strategy for a community of funders; it can at most give a one-off edge to whoever moves first and quietly.

  (6) But (5) is absurd, and I want to treat that as a reductio. It indicts choosing the shortest queue, arbitraging a mispriced asset, triaging an emergency room by urgency, and allocating wherever marginal return is highest. Every one of those is crowding-sensitive; every one of them is fine. A principle that condemns all of them has condemned optimizing under scarcity as such. So something in (1)–(5) has to go.

  (7) Hence we must restrict or replace the framework. The paper offers three options: treat ITN as a private heuristic valid only for actors too small to move the aggregate; drop N and rank by I × T alone; or replace N with an estimate of the total resources the cause will eventually attract, and fund only where we expect to move that total rather than join it.

  Two things about our situation that I think constrain the answer. First, we commit on a three-year cycle and some of the causes we care about are thirty-year projects, so a framework whose verdicts flip when others move is a real problem for us and not a theoretical one. Second, we cannot measure T directly for most of what we fund — no trials, no clean counterfactuals, and where we do have estimates they are contested. Neglectedness is in the framework largely because it is the best available evidence about where the cheap opportunities are, not because anyone thinks crowding is intrinsically valuable. Assume that stays true.

  There is also a worry I cannot tell whether it belongs to this argument or is a separate one. For a cause to be uncrowded may itself be evidence that better-informed funders looked at it and passed — the sidewalk-money thought. On that reading N is not a proxy for untapped opportunity but a proxy for adverse selection, and multiplying by it is not merely redundant with T but sign-flipping. Does that change the diagnosis, or is it an independent complaint that I should handle on its own?

  So: which step do you reject, and what does rejecting it cost me? Please name the step, explain why it looked innocent, and price the alternatives rather than only the one you pick — in particular, tell me what I lose if I give up (1) rather than (3) or (4), since I would rather keep (2) and (6) than (1). If you intervene at (3), give me the corrected version of the principle and say whether ITN survives it. And if the right answer is that ITN is fine at any given moment but unstable across time, tell me what a committee in our position should do with that instability. One thing I would find unhelpful: being told that ITN is only a heuristic and that heuristics are fine. I know that; it does not tell me which of the three options in (7) to adopt.
reasoning: |-
  Okay, let's tackle this problem step by step. The user sits on a funding committee that uses the ITN framework to allocate funds. A program officer has argued that ITN is self-defeating when used by multiple funders. The user can't find the flaw but can't accept the conclusion. They need help identifying which part of the argument is wrong and what to do about it.

  First, I need to understand the core argument. The program officer claims that ITN is "crowding-sensitive" because both T (tractability) and N (neglectedness) depend on other funders' actions. When many funders follow ITN, they all move to the top-ranked cause, increasing funding, which reduces N and thus lowers the S score. This makes the cause drop in ranking, so the initial recommendation becomes invalid. The argument concludes that any crowding-sensitive framework can't support a durable strategy.

  The user points out that rejecting this would also condemn practices like choosing the shortest queue or arbitrage, which are effective despite being crowding-sensitive. That's a problem because those strategies work in practice. So where's the flaw?

  Looking at step (3): The admissibility condition states that widespread compliance shouldn't destroy the conditions for the recommendation. But in real-world scenarios like queueing or arbitrage, systems reach equilibrium rather than self-destruct. For example, in ER triage, patients are constantly arriving and being treated, creating a dynamic system. The recommendation adapts as conditions change. Similarly, in ITN, once a cause gets funding, other causes rise in priority. The framework doesn't collapse; it reallocates resources dynamically.

  The key is that ITN is meant to be recalculated periodically. The framework anticipates that scores change as funding shifts. The instability isn't a flaw but a feature—it redirects funds to the next most urgent cause. This continuous adjustment is how systems under scarcity optimize. The error in step (4) is assuming that lowering S for one cause invalidates the entire framework. Instead, it signals that resources should now move elsewhere.

  The user also worries about neglectedness being a proxy for adverse selection (sidewalk-money thought). But this is a separate issue. If N indicates that others passed due to low tractability, then ITN's reliance on N might be problematic. However, the main argument against ITN's self-defeating nature still holds if we see the framework as dynamic.

  Given the constraints—long-term commitments and difficulty measuring T—the best option might be to treat ITN as a heuristic for small actors. Since the foundation can't measure T directly, N remains a useful proxy for untapped opportunities. Switching to I×T alone is risky without accurate T estimates. The third option, estimating total resources, is speculative. So, accepting the framework's dynamism and committing to periodic reassessments makes sense. They should also invest in better T estimation and consider adverse selection when evaluating N.
answer: |-
  I reject **step (4)** as misdiagnosing ITN's dynamics. Here’s why it looks compelling but fails, what each alternative costs, and how to handle instability:

  ### Why Step (4) Looks Innocent (But Is Wrong)
  Step (4) claims ITN "erases the ground it stood on" because funding a top-ranked cause reduces its neglectedness (N), lowering its score (S). This seems logical—but it ignores that **ITN is a dynamic ranking for cyclical allocation, not a static prescription**. The framework *expects* scores to change as funding shifts. Successful compliance doesn’t "destroy" the conditions for good recommendations; it *creates* new conditions where the next-most-urgent cause rises to the top. This is a feature, not a bug: it redirects resources to the new frontier of opportunity. Crucially, **equilibrium is reached when causes are funded proportionally to their I×T**, with N reflecting residual neglect. This mirrors functional systems like ER triage (where treating urgent cases reveals the next-urgent) or arbitrage (where exploiting mispricing corrects the market).

  ### What Rejecting Step (4) Costs
  - **Cost of keeping ITN intact**: You must embrace its dynamism. Rankings *will* shift, and causes may lose funding after 3–5 years as N declines. This demands discipline to exit successful interventions and constant reassessment. For 30-year causes, you’ll need supplementary criteria (e.g., "lock in" funding after initial ITN-driven selection).
  - **Cost of misdiagnosis**: Abandoning ITN over this "flaw" would discard a proven heuristic for marginal optimization under scarcity. The alternatives in (7) are worse (see below).

  ### Pricing the Alternatives in (7)
  1. **Treat ITN as a small-actor heuristic**:  
     - *Cost*: Forces you to act suboptimally. If your $10–15M/year moves N significantly in a cause (e.g., niche policy advocacy), you *are* large enough to distort the metric. Pretending otherwise invites waste.
     - *Verdict*: Worst option. Undermines your scale.

  2. **Rank by I × T alone (drop N)**:  
     - *Cost*: Since you lack reliable T estimates, you’ll overweight intractable high-I causes (e.g., curing ALS). Without N, you can’t identify "low-hanging fruit." This risks pouring funds into crowded, diminishing-return areas (e.g., climate tech R&D where $100M buys minimal progress). Neglectedness isn’t "intrinsically valuable"—it’s your best proxy for *marginal* tractability.
     - *Verdict*: Unworkable given your measurement constraints.

  3. **Fund only where you shift total resources**:  
     - *Cost*: Requires predicting long-term funding trajectories—a speculative task. Overestimating your influence could lead to futile efforts (e.g., trying to "catalyze" a $1B field with $15M). Underestimating it misses opportunities (e.g., seed-funding proven interventions others ignore). Also clashes with 30-year projects: few fields need 30 years of *neglectedness*.
     - *Verdict*: High risk of misallocation; contradicts ITN’s core logic.

  ### Handling the Sidewalk-Money Worry (Adverse Selection)
  This is a **separate, critical issue** that *doesn’t change the step (4) diagnosis* but impacts how you use N.  
  - **If N signals adverse selection**: Low N may indicate high T (others fund it because it’s tractable), but *very high* N may signal hidden pitfalls (informed funders avoided it). Multiplying I × T × N could then amplify errors.  
  - **Solution**: **Condition N on evidence of tractability**. Use N *only* when:  
    a) You have independent T evidence (e.g., pilot studies), OR  
    b) N is moderate (e.g., 20th–60th percentile of neglect)—not extreme.  
    Avoid causes in the "99% neglected" bin without strong T proxies. This mitigates sidewalk-money risks without abandoning N.

  ### What You Should Do
  1. **Keep ITN** as your core framework. Its instability isn’t fatal—it’s how optimization under scarcity works.  
  2. **Add two safeguards**:  
     - **Dynamic thresholds**: Set a "N-floor" (e.g., don’t fund if >$100M/year is already spent) and "T-ceiling" (e.g., don’t fund if T < X based on historical analogs). Recalibrate these yearly.  
     - **Adverse selection filter**: As above, discard ultra-high-N causes without T evidence.  
  3. **For 30-year projects**: Use ITN for *entry*, then switch to **progress-conditioned funding**. Fund Year 1–3 based on ITN; renew only if:  
     - N remains > threshold (showing continued neglect), OR  
     - Independent review confirms high marginal ROI (e.g., leveraging sunk costs).

  ### Why This Works
  ITN survives step (3) because **widespread compliance doesn’t destroy its efficacy—it redistributes resources optimally**. When Cause A’s S falls after funding, Cause B’s S rises. The system converges toward allocating capital where marginal impact is highest *at each stage*. Your committee’s role isn’t to "solve" instability but to **ride the wave of receding neglect**, shifting focus as opportunities evolve. This demands agility but beats the alternatives.

  --- 

  **Final note**: The true cost of rejecting step (4) is *operational rigor*—you must monitor crowding and update rankings aggressively. But with your 3-year cycle, this is feasible: build a mid-cycle "light review" to adjust allocations if N plummets unexpectedly. If you abandon ITN, you’ll lose your best compass for neglected opportunities.
