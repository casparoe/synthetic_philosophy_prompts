  The BRF view is robust in many settings but has critical vulnerabilities. The most decisive is shared-mode failure: if the entire reference class suffers the same bias, the outside view becomes systematically wrong. This is not just a possibility but observed in domains like project planning. The defender might try to adjust by widening tails or choosing a different class, but that requires inside-view judgment, which BRF aims to avoid. 

