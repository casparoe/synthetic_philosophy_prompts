  Approach:

  1. **Shared-mode failure (systematic error in reference class):** 
     - What: The entire reference class is subject to the same systematic error (e.g., all builders are overoptimistic about project timelines). Then the distribution (base rate) is biased, and averaging doesn't remove the bias. The tails (especially the bad tail) are underestimated.
     - Bite: Serious to fatal because it undermines the reliability of the outside view. The outside view's errors are supposed to be noise, but here they are systematic.
     - Live: Yes, observed. Example: In the planning of large infrastructure projects, cost overruns and delays are consistently underestimated across many projects (Flyvbjerg's work).
     - Defender concedes: Grudgingly. They might say that one should choose a reference class that accounts for this (e.g., "projects with initial optimistic forecasts") but that may be hard to define without inside view. Commitment 1 and 2 are affected: the outside view may not have the claimed advantage, and the tails might need adjustment by the inside view.

  2. **Self-consuming base rates (Goodhart's law for base rates):**
     - What: When a base rate is published, people react. E.g., if the base rate for startup success is 10%, and entrepreneurs see this, they might try harder or change strategy, making the base rate obsolete. The base rate decays and becomes less predictive.
     - Bite: Serious. It means that historical base rates are not stable and thus not reliable as priors.
     - Live: Yes, observed. Example: In finance, when a trading strategy becomes known, it stops working because too many people use it. Similarly, if a base rate for success in an industry is published, it might alter behavior.
     - Defender concedes: Yes. This is a known issue. Commitment 3 might be adjusted: the calibration record must be recent or adjusted for reactivity. Also, commitment 4 (causal similarity) must account for the fact that the base rate is now conditional on being published.

  3. **Laundering (reference class built on inside views):**
     - What: The reference class was constructed by experts using their inside view (without case details) to group cases. Then the "outside view" is just an aggregate of inside views, inheriting their systematic errors.
     - Bite: Serious. It undermines the independence of the outside view and may make it no better than the inside view.
     - Live: Live-but-unmeasured? It's plausible. Example: In medicine, a reference class for a disease might be defined by experts based on their clinical experience (inside view) without rigorous empirical grouping. But we don't have systematic measurement of how common this is.
     - Defender concedes: Grudgingly. They might say that even if the reference class is built by experts, the aggregation still reduces noise. But if the errors are systematic, it doesn't. Commitment 1 is challenged: the outside view might have the same systematic errors.

  4. **Reference-class drift:**
     - What: The reference class chosen before the fact differs from the one chosen after the fact (hindsight bias). Without a clear rule, the outside view becomes subjective.
     - Bite: Awkward to serious. It makes the application of BRF dependent on arbitrary choices, reducing objectivity.
     - Live: Yes, observed. Example: In forecasting, after an event occurs, people often say "this was a special case" and argue for a different reference class.
     - Defender concedes: Grudgingly. They might argue that commitment 4 (causal similarity) provides a rule, but it's hard to apply objectively. Commitment 4 must be operationalized better.

  5. **Privileged access (inside view has unique information):**
     - What: When the inside view has information that the reference class doesn't capture (e.g., the project is half-built, you know your team's attrition). Then the inside view should update more than BRF allows (especially in the tails).
     - Bite: Awkward to serious. It challenges commitment 2: the inside view should be able to move the tails in such cases.
     - Live: Yes, observed. Example: A construction project that has already passed major milestones might have a different risk profile than the base rate for starting projects.
     - Defender concedes: Yes. They might adjust commitment 2 to allow the inside view to update the tails when there is truly unique information.

  6. **The regress worry (picking reference class is inside view):**
     - What: The choice of reference class is itself an exercise of judgment (inside view at a higher level). Thus, the outside view is not truly independent.
     - Bite: Serious (if accepted). It undermines the entire foundation of BRF by making the outside view dependent on the inside view.
     - Live: Logical-possibility-only? But the user is cold to this. However, it's a live issue in epistemology.
     - Defender concedes: No. The BRF defender would argue that the choice of reference class is guided by causal similarity (commitment 4) and that this is a separate, more objective process. But if forced, they might say that the higher-level outside view can be used (e.g., base rates for the accuracy of reference class choices) but that's not always available.

  7. **Empirical: Inside-view adjustments improve calibration:**
     - What: If empirical studies show that forecasters who use inside-view adjustments (especially in the tails) have better calibration than those who stick strictly to base rates, then BRF's commitment 2 (inside view barely touches tails) is wrong.
     - Bite: Serious. It would force a change in how we combine views.
     - Live: Live-but-unmeasured? We have some studies on forecasting (e.g., Tetlock's superforecasters) that show adjusting base rates with case-specific info helps, but it's not focused on tails.
     - Example: If a study shows that for projects that are half-built, forecasters who ignore the base rate and use inside-view for tail risks (e.g., catastrophic failure) are better calibrated, that would challenge BRF.

  8. **Empirical: Base rates are often unavailable or too noisy:**
     - What: In many domains, there is no stable reference class or the base rate is so noisy as to be uninformative. Then BRF is not applicable.
     - Bite: Awkward. It limits the scope of BRF.
     - Live: Yes, observed. Example: In novel situations (e.g., a pandemic caused by a new virus), reference classes are hard to define.
     - Defender concedes: Yes. They might say BRF is for when reference classes are available.

  9. **Unfalsifiability via commitment 4:**
     - What: If any failure of BRF can be attributed to a wrong reference class (via commitment 4), then the theory is unfalsifiable.
     - Bite: Fatal if true. It would make BRF non-empirical.
     - Live: Logical-possibility-only? But the user is worried about this.
     - Defender concedes: Grudgingly. They must admit that commitment 4 needs clear operational criteria to avoid this. Otherwise, BRF becomes a "just-so" story.

