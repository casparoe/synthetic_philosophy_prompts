  The BRF commitments are:
  1. Tie goes to the outside view when there's disagreement because inside view errors are systematic and outside view errors are noise.
  2. The combination: reference class as prior, inside view as likelihood that moves center but barely affects tails.
  3. Epistemic modesty is bookkeeping: defer to process with better calibration record, drop when record falters.
  4. Reference class chosen by causal similarity, screened off from effort (so you can't choose a class that already encodes the effect of your effort/skill).

  Defeaters provided by the user:
  - Shared-mode failure: everyone in the reference class wrong for same reason -> averaging doesn't help, tails understated.
  - Self-consuming base rates: published base rates change behavior of agents, making the base rate decay.
  - Laundering: reference classes are sometimes built by insiders using inside-view reasoning without case details -> outside view is just someone else's inside view.
  - Reference-class drift: the class you pick before vs after the outcome differs, and no principled rule to fix.
  - Privileged access: cases where the inside view has genuine privileged information (e.g., you've already built half the bridge).

