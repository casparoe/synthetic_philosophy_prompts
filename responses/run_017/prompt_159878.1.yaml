  Prioritizing objections: Commentator's distinction challenge is top—it undermines the whole argument. Then neuroscientist's relevance question—fumbling here loses credibility. Non-reductive physicalists' exclusion worry is key for their position. ML's neural nets example is concrete and popular. Grad students' levels critique hits methodology. Etc.

  Replies should be sharp: For the commentator, clarify that horizontal is intra-level variance, vertical is inter-level substrate independence, but admit this might not satisfy a functionalist. For the neuroscientist, link to degeneracy research showing robustness without implying multiple substrates. Weakness: still armchair for vertical cases.

  Need to ensure replies don't get bogged down. Two-minute limit means concise points. For example, against ML: neural nets are same-substrate simulations, not true realization. Soft spot: future substrate-independent AI might challenge this.

