  First, I need to understand their core argument. They split MR into horizontal (same-level variation) and vertical (cross-level, like silicon or aliens). Horizontal MR is evident but manageable by reductionists, while vertical MR lacks evidence beyond behavioral mimicry. The key is that vertical MR is unsupported and crucial for non-reductive physicalism.

  The user wants eight objections from this specific audience, prioritized by damage potential. Each objection should mirror the speaker's style (no Twin Earth for the neuroscientist). Replies need to be concise, with weaknesses noted. Also, strategies for concessions to the non-reductive physicalists, what to hold firm on, and a feared question.

