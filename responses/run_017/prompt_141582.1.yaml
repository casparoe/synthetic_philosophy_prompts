prompt: |-
  You're a professional philosopher — philosophy of language, and ideally someone who has actually worked a fact-checking desk — so please take this seriously and think carefully before you commit to anything. Brainstorm the failure modes first, then give me the thing I can use. Don't hedge every step into mush; where something is a judgment call, say so and move on.

  Context: I write a column on science and ideas, two pieces a week, and my copy is stuffed with conditional sentences. Roughly: If the interim analysis holds up, approval is likely. If the variant had been picked up two weeks earlier, the wave would have been half the size. If we miss the deadline, the whole programme collapses. If the result replicates, the field has to rethink everything. Half of these I write myself, half I'm quoting a source, and in maybe a quarter of them I want to attach a number — there's about a 70 percent chance that if X, then Y. My standards editor has started pushing back on the numbered ones, and honestly she's right to.

  Here's the theory I'm working from, half-absorbed and possibly mangled: Lewis's triviality results are supposed to show that you can't have both (a) a conditional that expresses a proposition with truth conditions you can put a probability on, and (b) the probability of the conditional always equaling the conditional probability of the consequent given the antecedent, P(if A then B) = P(B|A). Then the usual moves, as I understand them: drop the truth conditions and treat conditional judgement as suppositional, Adams-style; keep the truth conditions but say the equation fails, and let assertability go by conditional probability; restrict the equation to some special initial prior — a philosopher friend mentioned this at dinner and I definately can't tell whether it's a real move or something I dreamt; or the linguistics view where if-clauses don't form a two-place connective at all but restrict some modal or quantifier that's already there, with Kratzer's name attached to it in my notes. Tell me which of these I've got wrong, one sentence each. But: no reading list, no citations, no bibliography. I can't check them and I don't want them. If you're tempted to write "as X argues," just give me the test instead.

  What I actually want is a decision procedure, in words, that my desk and I can run on a conditional sentence in about ten minutes: the questions in order, what counts as a sufficient answer to each, where it stops with a no, and where it hands the decision to a person. Constraints: my copy editors have zero theory background, so every step has to be a question with a recognizable answer; anything involving a number has to end in wording my standards editor will sign off on; and where the real question is one of values, or of what I'm willing to say in my own voice, the procedure has to stop and hand it over rather than laundering it as a factual check. I need:

  - how to tell whether the sentence is a forecast, a causal or counterfactual claim, a bare regularity, or a covertly normative claim — the "find the modal" step, if that's a real step;
  - what to do when I want a number on the conditional itself (my guess: recast it as confidence in the consequent given the antecedent, never as a probability of a conditional — but say when the two come apart badly enough that even the recast misleads, e.g. when the antecedent is very unlikely or when the link is what's really at issue);
  - what to do when there's no number to be had and I'm forty minutes from deadline;
  - which conditionals to refuse to run as my own claim and attribute to the source instead, and how to attribute them without making the sentence unreadable;
  - a seperate gate where the copy editor has to escalate, and to whom.

  Then run the whole thing on three from my recent drafts: (1) If the trial's interim analysis holds up, the drug will be approved — call it a 70 percent chance. (2) If the variant had been caught two weeks earlier, this wave would have been half the size. (3) If the result replicates, the field will have to rethink everything. Fair warning: I like (3), it's my closing line, and if your procedure kills it I want to be told plainly that it kills it and why — not let off with a rewrite that quietly saves it.

  Last thing, and it's the part I care most about: tell me what would change your mind about the procedure itself. Which result — an empirical one about how ordinary readers actually understand these sentences, or a theoretical one, like a version of the equation that survives Lewis only for a restricted class of priors or for one distinguished prior — would make you relax the rule against putting numbers on conditionals? Where is this procedure most likely to misfire on real copy? And say what it can't do: I assume it can't tell me whether my causal model is right, but tell me the rest.
reasoning: |-
  Okay, let me approach this systematically. The user is a science writer facing practical challenges with conditional statements in their column. They need a clear decision procedure that respects philosophical complexities while being usable under tight deadlines by non-specialist copy editors. 

  First, I should map their core theoretical concerns: Lewis's triviality results create tension between treating conditionals as truth-conditional vs suppositional. The user mentions four approaches - Adams' probabilistic, truth-conditional with assertability conditions, restricted priors, and Kratzer's modal restriction - but wants error-checking, not theory lessons. 

  Key constraints emerge: The procedure must be executable in 10 minutes per conditional by theory-naive editors. Numbers can only be applied to consequents given antecedents, never to conditionals themselves. Must flag when judgments involve values rather than facts. Needs clear escalation paths.

  For the classification step (forecast vs causal etc.), I'll build on Kratzer's insight about covert modals but operationalize it through question-based heuristics. The "find the modal" test will ask what the sentence is fundamentally assessing - possibility, necessity, or obligation. 

  The number-attachment rule needs special handling for low-probability antecedents or contested links - cases where P(B|A) feels misleading even if technically calculable. This aligns with Lewis's warning about the equation breaking down in limit cases.

  Deadline triage becomes crucial: when evidence is thin, default to qualitative hedges ("could" vs "would") and attribute claims more aggressively. The test cases will prove instructive - especially how to handle their favored closing line without compromising standards.

  For mind-changing evidence, I'd need empirical data showing readers intuitively parse probabilistic conditionals as P(B|A) without confusion. Theoretically, a robust restricted-class solution to Lewis's paradox might shift the needle, but current approaches remain too fragile for journalistic use.

  The procedure's blind spots are important to surface: it can't validate causal models, can't resolve normative disputes masked as fact claims, and struggles with nested conditionals. These limitations must be explicitly stated in the protocol.
answer: |-
  Here's a field-tested decision procedure for your conditional sentences. It's designed for speed, defensibility, and clarity under deadline pressure. Brainstormed failure modes first, then the procedure, then your test cases.

  **Failure Modes Mapped:**
  1.  **Misleading Probability:** Assigning P(If A then B) when readers (and often the writer) intuitively interpret it as P(B|A), but Lewis shows they *can't* be the same in general. Result: False precision.
  2.  **Triviality Trap:** When A is highly improbable, P(B|A) might be estimable, but P(If A then B) becomes undefined or vacuous (Lewis). Result: Meaningless number.
  3.  **Link vs. Consequent:** When the *link itself* (A causing/entailing B) is the uncertainty, not B given A. P(B|A) hides this. Result: Misplaced confidence.
  4.  **Covert Normativity:** A conditional masking a value judgment (e.g., "If we miss the deadline, the programme collapses" might imply "and that's unacceptable"). Result: Smuggling opinion as fact.
  5.  **False Equivalence:** Treating forecasts (future open), causal claims (past/present mechanism), and counterfactuals (past closed) identically. They demand different evidence.
  6.  **Attribution Laundering:** Using "sources say" on claims *you* endorse, avoiding accountability.
  7.  **Escalation Failure:** Not flagging deeply uncertain or value-laden claims to senior editors.

  **The Procedure: Ask Sequentially (Time Target: 8-10 mins/sentence)**

  1.  **Classify the Conditional (1 min):**
      *   **Q1:** Is the antecedent (A) about the *future*? **Yes -> Forecast.** (e.g., "If the analysis holds up...")
      *   **Q2:** If No, is A *contrary to known past facts*? **Yes -> Counterfactual.** (e.g., "If the variant *had been* caught...")
      *   **Q3:** If No, is the sentence primarily describing a *causal mechanism* or *necessary consequence*? **Yes -> Causal/Necessity Claim.** (e.g., "If you heat water, it boils.")
      *   **Q4:** If No, does the sentence imply "should", "must", or "ought"? **Yes -> Covertly Normative.** (e.g., "If we miss the deadline, the programme collapses" - implies collapse *should* be avoided/is disastrous).
      *   **Q5:** If none fit, **Escalate Immediately.** (Likely a complex hybrid or misparsed sentence).

  2.  **Can We Attach a Number? (2-3 min):**
      *   **Gate 1:** Is the *real uncertainty* about **B happening *given* A is true?** (P(B|A))? **Yes -> Proceed.** If the uncertainty is primarily about A being true itself, or about the *link* between A and B being valid, **STOP. Do not attach a number.** (Failure Mode 3).
      *   **Gate 2:** Is A *possible but extremely improbable* (e.g., P(A) < 0.01)? **Yes -> STOP. Do not attach a number.** (Failure Mode 2 - Triviality Trap). Use qualitative language ("vanishingly unlikely", "extremely improbable").
      *   **Gate 3:** **Do we have defensible evidence for a specific P(B|A)?** (e.g., statistical model, base rates, expert consensus quantified *specifically on B|A*). **Yes -> Proceed.** **No -> STOP. Do not attach a number.**
      *   **If Proceeding:** **The number *always* modifies the confidence in B *given A*.** **Wording:** "If [A], there is an approximately [X]% chance that [B]." OR "Given [A], [B] is about [X]% likely." **NEVER** write "There is an X% chance that if A, then B."

  3.  **No Number? Triage & Attribute (2 min):**
      *   **Option A (Strong Hedge):** Use qualitative uncertainty markers based on best judgment:
          *   High Confidence (given A): "would likely", "is expected to", "should".
          *   Medium Confidence: "could well", "might well", "is plausible that".
          *   Low Confidence: "could", "might", "is possible that".
          *   *Always* ensure the hedge strength matches your evidence *for B given A*.
      *   **Option B (Attribute):** **Is this a claim you *personally endorse* as likely *true*, or is it primarily reporting a source's view?** If the latter, or if deeply uncertain, **attribute.** Wording: "[Source/Expert] suggests that if [A], then [B]." OR "According to [Source], if [A], [B] is likely." Avoid mushy "some believe"; name the source if possible, otherwise "analysts" / "researchers familiar with the matter". **If it's your own claim but too uncertain for a hedge you'll defend, attribute to a generic qualified source or drop it.**

  4.  **Normative/Values Check (1 min):**
      *   **Q:** Does the conditional *depend* on an unstated value judgment? (e.g., "collapses" implies "bad"; "have to rethink" implies "necessary/desirable"). **Yes -> Escalate to Standards Editor.** Explain *what* value is embedded. Do *not* try to launder this as a fact. Either rewrite neutrally ("the programme would end"), attribute, or get explicit approval for the normative framing.

  5.  **Escalation Gate (Copy Editor):**
      *   **Escalate IMMEDIATELY if:** Classification fails (Q5), A is highly improbable (Gate 2), Uncertainty is about the Link (Gate 1), Normative/Values identified (Step 4), or the claim is highly consequential and the evidence feels thin. **Escalate To:** Standards Editor or Senior Science Editor (whoever handles nuance/fuzziness). **Provide:** The sentence, the Classification, the specific reason for escalation, and your proposed wording alternatives.

  **Your Test Cases:**

  1.  **"If the trial's interim analysis holds up, the drug will be approved — call it a 70 percent chance."**
      *   **Classify:** Forecast (A=future).
      *   **Number?** Gate 1: Uncertainty *is* about approval *given* analysis holds (P(B|A)). Gate 2: A isn't vanishingly improbable. Gate 3: *Do you have evidence specifically for P(Approval | Interim Holds)?* (FDA precedents? This trial's protocol? Expert consensus estimate?). **IF YES:** Wording OK: "If the trial's interim analysis holds up, there is approximately a 70 percent chance the drug will be approved." **IF NO:** Attribute: "Lead researchers estimate that if the interim analysis holds up, there is a 70 percent chance of approval." Or use hedge: "If the interim analysis holds up, approval is likely."
      *   **Normative?** No.
      *   **Verdict:** **Likely salvageable with evidence or attribution.** The number *format* is correct (P(B|A)).

  2.  **"If the variant had been caught two weeks earlier, this wave would have been half the size."**
      *   **Classify:** Counterfactual (A=contrary to known past fact).
      *   **Number?** **STOP. Do not attach a number.** (Failure Mode 2 & 3). Estimating P(B|A) for a counterfactual is *highly* model-dependent and speculative. The *link* (causal impact of detection timing on wave size) *is* the core uncertainty.
      *   **No Number:** Use a strong hedge based on model confidence: "If the variant had been caught two weeks earlier, modeling suggests the wave would likely have been roughly half the size." OR Attribute: "Epidemiologists at [Institution] concluded that..."
      *   **Normative?** Possibly implied (critique of surveillance). Check context. If implied, escalate.
      *   **Verdict:** **Kill the number.** Rewrite with hedge/attribution.

  3.  **"If the result replicates, the field will have to rethink everything."**
      *   **Classify:** Forecast (A=future)/Causal Necessity. Leans causal necessity.
      *   **Number?** **STOP.** Uncertainty isn't primarily about rethinking *given* replication (P(B|A)). It's about the *link*: *Does* replication *entail* "rethink everything"? This is a judgment call about the result's significance. P(B|A) is probably close to 1 *if* you accept the link, but the link *is* the debatable part. (Failure Mode 3).
      *   **No Number:** Use a strong hedge *if you endorse the link*: "If the result replicates, the field will likely have to rethink fundamental assumptions." OR Better: Attribute or soften the consequent: "...will need to seriously re-evaluate key theories." OR "...could force a major reconsideration."
      *   **Normative?** "Have to rethink everything" implies necessity/desirability. It's also hyperbolic ("everything"). **ESCALATE to Standards Editor.** Argue why "rethink everything" is justified and not just your opinion. Can you support "rethink core theories" or "major reassessment"? Be prepared to attribute ("Dr. X argues that...").
      *   **Verdict:** **Your version (with number or strong 'have to') likely killed.** It asserts a contentious link and hyperbole as fact. Rewrite with hedge + less hyperbole ("fundamental assumptions", "core theories") **or** attribute. Escalate the normative/hyperbolic aspect.

  **What Would Change My Mind (The Procedure's Kryptonite & Limits):**

  1.  **Empirical Evidence:** *Strong* evidence showing ordinary readers *reliably and consistently* interpret "P(If A then B) = X%" as *only ever* meaning P(B|A) = X%, *without* being misled into thinking it's a probability over the whole conditional proposition. (Current evidence suggests they *try* to interpret it as P(B|A) but get confused when P(A) is low or the link is disputed).
  2.  **Theoretical Advance:** A robust, empirically validated, *and practically applicable* restriction on Lewis's result (e.g., a clearly defined "distinguished prior" for journalistic contexts, or a proven restriction to conditionals where P(A) is bounded away from 0 and the link is non-contested) that demonstrably avoids the triviality/confusion pitfalls *in real-world science writing*. (Current "restricted class" proposals are too theoretical/philosophical for reliable deadline use).
  3.  **Relaxing the Rule?** Only if *both* (1) and (2) above were met *and* proven applicable to the specific types of conditionals common in science journalism. Until then, the risk of misleading readers > benefit of precision.

  **Where It Misfires:**

  *   **Nested Conditionals:** "If A, then if B, then C." The procedure bogs down. Escalate immediately.
  *   **Ambiguous Antecedents:** When it's unclear *exactly* what A entails. Requires careful parsing - escalate if unclear.
  *   **Overly Vague Consequents:** "rethink everything", "major implications". The procedure flags normativity/escalation but can't fix vagueness. Requires editorial rewrite.
  *   **"Bare" Subjunctives:** Conditionals expressing hope, permission, etc., without a clear B. Rare in your context, but escalate.

  **What It Can't Do:**

  1.  **Validate Your Causal Model:** Correct. It checks the *form* and *expression* of uncertainty, not the underlying science.
  2.  **Resolve Disagreements on P(B|A):** It relies on *your* assessment of defensible evidence. It won't tell you if your 70% is right, only if it's *expressible* safely.
  3.  **Eliminate Judgment Calls:** Classification, link vs. consequent, normative content, and appropriate hedging strength *are* judgments. The procedure structures and exposes them for review, doesn't remove them.
  4.  **Fix Bad Science:** Garbage in, garbage out. It helps present uncertainty honestly, not make weak evidence strong.

  **Final Word:** This procedure forces clarity about *what* is uncertain (A? B? The Link? The Values?) and prevents the most common, philosophically fraught errors of probabilistic conditionals. It protects you and the reader. Use it ruthlessly. Your closing line (Case 3) is classic link-assertion; attribute it or soften it significantly.
