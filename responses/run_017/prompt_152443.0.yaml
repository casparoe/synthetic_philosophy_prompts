answer: |-
  ### Scenario
  Subject A and Subject B have identical neural implants—a FDA-approved hippocampal prosthesis that records and replays episodic memories, interfacing directly with their brain's memory systems. The device, used for recalling pharmaceutical batch records during quality-control inspections, has been error-free for two years and is as reliable as biological memory. Subject A trusts it implicitly due to seamless integration: when asked about a temperature log, A reports, "I remember it was 22°C," acting directly on the output. Subject B, recalling an early malfunction (since corrected), distrusts it: B says, "The implant says 22°C," then cross-checks written logs before acting. Both are equally accurate, but B is slower due to verification. The device's reliability, spatial location (implanted), and function are identical; only the subjects' stances differ.

  ### Verdicts from the Three Views
  1. **Clark and Chalmers' Parity Principle (with tightening: reliable availability, easy accessibility, automatic endorsement, and typical invocation without scrutiny)**  
     - **Trusting case (A)**: The content counts as a belief. The device is reliably available and easily accessible, and A automatically endorses its outputs as personal recollections without scrutiny, satisfying the criteria for cognitive extension.  
     - **Cautious case (B)**: The content does not count as a belief. Though reliable and accessible, B subjects the outputs to scrutiny and cross-checking, violating automatic endorsement and typical invocation, thus failing to integrate as part of the cognitive process.  

  2. **Skin-and-skull view (boundary at organism's spatial edge; cognition is brain-based)**  
     - **Both cases**: The content counts as a mental state. The device is inside the organism's spatial boundary (implanted), so it is treated as internal to the mind regardless of reliability or attitude; cognition includes any process occurring within the body.  

  3. **Adams and Aizawa's derived content view (cognitive states require non-derived content; artefacts provide only derived content)**  
     - **Both cases**: The content does not count as a belief. The implant, as an artefact, generates derived content (e.g., based on engineered representations), lacking the intrinsic non-derived content of biological processes, irrespective of location or trust.  

  ### Ablation: Altering Variables
  - **Device moved outside the skull (wearable with identical function)**:  
    - Parity view: Trusting case (A) still counts as belief (endorsement and reliability hold), cautious case (B) does not (lacks endorsement).  
    - Skin-and-skull view: Neither counts (device now outside spatial boundary).  
    - Derived content view: Neither counts (content remains derived).  
  - **Subjects' attitudes equalized (both trust the device)**:  
    - Parity view: Both count as beliefs (automatic endorsement now satisfied for B).  
    - Skin-and-skull view: Both count (spatial location unchanged).  
    - Derived content view: Neither counts (derivation unchanged).  
  - **Device made subtly unreliable, trusting subject (A) continues trusting**:  
    - Parity view: A no longer counts as belief (reliability condition fails, despite endorsement).  
    - Skin-and-skull view: Both count (spatial location unchanged, reliability irrelevant).  
    - Derived content view: Neither counts (derivation unchanged).  

  ### Audit
  - **Engineered verdict**: The case is designed to isolate the subject's stance (endorsement) as the critical variable for the parity view, producing the three-way split (A:yes/B:no for parity; both:yes for skin-and-skull; both:no for derived content). This is not stipulation: the verdicts derive directly from each view's core criteria (endorsement for parity, spatial boundary for skin-and-skull, content derivation for Adams-Aizawa) applied to observable behavior (A's first-person reports vs. B's third-person checks).  
  - **Failure to isolate**: The case does not fully isolate reliability for the skin-and-skull view. This view treats spatial location as sufficient, ignoring reliability or attitude, but the ablation shows it is *only* responsive to location—unreliability does not alter its verdict, which may conflate spatial position with cognitive status.  
  - **Underdescription objection**: No view should decline a verdict; the scenario specifies all relevant criteria (reliability, location, function, and observable attitudes). Each view has sufficient detail to apply its criteria without theoretical baggage.  

  ### Counterattacks Answered
  1. **Extended mind theorist's defense of endorsement**:  
     The claim that endorsement is intrinsic to belief (not an "added" condition) is correct and should be embraced. Automatic endorsement is part of the functional role that distinguishes beliefs from consulted sources—a distrusting subject treats the resource as external, breaking cognitive integration. This is not a reductio: it aligns with functionalism, where a biological memory distrusted after confabulations would similarly lose belief-status under parity. What turns on this is whether the extended mind thesis is functionalist (it is); rejecting this would undermine its basis in role-based equivalence.  

  2. **Skin-and-skull theorist's retreat to "silicon isn't neural"**:  
     Retreating to a brain-only view (cognition requires neural tissue) is **ad hoc** if spatial location was initially the criterion, but it is **not ad hoc** if the view consistently emphasizes biology. However, accepting this collapse destroys the three-way split: it merges skin-and-skull with derived content (both now say "not mental in either case"), as silicon implants lack neural biology and carry derived content. The split only holds if the skin-and-skull view is defined spatially (as above); redefining it biologically concedes to Adams-Aizawa and abandons spatiality as the boundary.  

  ### Practice-Based Extended Mind View
  A practice-based variant (e.g., Sutton or Menary) focuses on enculturated practices: the resource is part of the mind if it is seamlessly woven into learned routines. Here, Subject A's trusting, automatic use embodies such a practice, so the content counts as mental. Subject B's cautious, explicit verification treats the device as a tool, not an integrated practice, so it does not. This view **does not escape** attitude-dependence: practices depend on the subject's habitual stance (trust enables routine integration), so the worry about attitude determining the boundary remains. It avoids stipulation by emphasizing observable skills, but still relies on the subject's behavioral relationship to the resource.  

  The case cleanly separates the three criteria, revealing that the extended mind's boundary is fixed by functional endorsement, not reliability or location alone. Yet it highlights vulnerabilities: attitude-dependence may seem overly subjective, and spatial/biological views risk conflation.
