answer: |-
  ### Exam Question

  **Question 4: The Locally Coherent Agent and the Money Pump**  
  Consider an agent who is "locally coherent": at every individual choice node she faces, her preferences over the immediately available options are complete and transitive. However, her preferences exhibit menu-dependence:  
  - When offered {A, B}, she prefers A > B.  
  - When offered {B, C}, she prefers B > C.  
  - When offered {C, A}, she prefers C > A.  
  - When offered {A, B, C} simultaneously, she prefers A > B > C and chooses A.  

  An exploiter can sequentially offer her swaps (A→B for a small fee ε, then B→C for ε, then C→A for ε), leaving her with A again but poorer by 3ε. She foresees this cycle, understands the pump, and is "contented": she prefers keeping her current preferences (even with this vulnerability) over paying to change them. **Critically evaluate whether this agent is rational.** In your response:  
  1. Explain precisely what the money pump reveals about her rationality (e.g., a preference defect, choice-rule flaw, or framing vulnerability) and why this distinction matters.  
  2. Argue why her contentment does *not* resolve the challenge.  
  3. Describe how she could avoid exploitation (e.g., refusing a trade) and the cost of such avoidance.  
  4. Address whether *all* agents vulnerable to exploitation (e.g., those with changing tastes) are irrational, or if her case is distinctive.  

  ---

  ### Model Answer (700 words)  
  The money pump argument targets a deep inconsistency in the locally coherent agent’s *diachronic choice rule*, not merely her preferences. While her preferences are synchronically coherent at each node, the pump exploits her inability to align choices over time with her overarching assessment in the grand menu ({A, B, C}). This reveals a defect in how she translates stable, context-independent valuations (A > B > C in the full set) into sequential decisions. The distinction matters because it clarifies that rationality requires not just coherent moment-to-moment preferences, but a *diachronic plan* resistant to self-sabotage through framing effects.  

  Her contentment—preferring her current dispositions over costly reform—does not defuse the pump. Money pump arguments are fundamentally about *structural coherence*, not welfare. Even if she derives satisfaction from her choices, the pump demonstrates that she actively undermines her own prior commitments: she pays to cycle back to A despite initially ranking it highest. Rationality here concerns whether her choices align with her enduring evaluative standpoint (reflected in the grand menu), not her subjective happiness. Contentment addresses desire-satisfaction, not the formal inconsistency that enables exploitation.  

  To escape exploitation, she must act *resolutely*: at the first node (choosing between A and A+ε for B), she must refuse the trade, adhering to her grand-menu preference for A over B despite her current pairwise preference for B. This requires suppressing her local preference in deference to a prior plan. The cost is violating *synchronic rationality*: she chooses an option (keeping A) that is dispreferred *at that moment* in favor of a future-oriented commitment. Rationality thus demands a trade-off: either endure exploitation or act counter-preferentially at some node, both of which appear rationally deficient.  

  However, not all exploitability implies irrationality. Consider an agent whose preferences *reasonably change* over time (e.g., learning that B is toxic). She might pay to swap A for B, then pay to revert upon learning new information. This is benign exploitation reflecting rational updating. By contrast, the locally coherent agent’s vulnerability stems from *stable but context-dependent* preferences. Her grand-menu ranking (A > B > C) persists unchanged, yet she pays to deviate from it due to menu manipulation. This is not learning or endorsement but *incoherence*: she lacks a unified valuation that governs choices across subsets. The defect lies in the *arbitrariness* of her menu-dependence, not mere exploitability. Crucially, she *endorses* her grand-menu preference but cannot enact it sequentially without external intervention—a failure of instrumental rationality.  

  Thus, the locally coherent agent is irrational. Her contentment only highlights that she values her incoherent disposition, but this conflates welfare with rationality. The money pump shows that her choice rule cannot execute her own affirmed goals without loss, violating the core rational mandate of *instrumental efficiency*. Resolute choice might avoid exploitation but at the cost of synchronic irrationality, suggesting a deeper flaw: her preferences are not robust across framing, undermining rational agency.  

  ---

  ### Marking Scheme (20 marks total)  
  1. **Diagnosis of the pump’s target** (4 marks)  
     *Must identify the defect as lying in diachronic choice rules/framing vulnerability, not preferences alone.*  
     *Common error: Claiming it shows "intransitive preferences" without addressing menu-dependence or diachronicity.*  

  2. **Contentment’s irrelevance** (4 marks)  
     *Must explain why welfare/desire-satisfaction ≠ coherence; pump targets structural consistency.*  
     *Common error: Arguing contentment makes her rational by her own standards.*  

  3. **Escape route and its cost** (4 marks)  
     *Must describe resolute refusal and note it violates synchronic preference (e.g., keeping A when B is locally preferred).*  
     *Common error: Proposing preference revision without addressing the cost of acting counter-preferentially.*  

  4. **Overgeneration response** (4 marks)  
     *Must distinguish benign exploitability (e.g., learning) from arbitrary menu-dependence using the stable grand-menu ranking.*  
     *Common error: Asserting all exploitability is irrational or failing to contrast with preference change.*  

  5. **Synthesis & normativity** (4 marks)  
     *Must conclude that rationality demands instrumentally efficient diachronic plans, overriding contentment claims.*  
     *Common error: Retreating to "rationality is subjective" without engaging instrumental efficiency.*  

  **A vs B Differentiation**:  
  - **A (16–20)**: Integrates all points, explicitly distinguishes rationality/welfare, and defends instrumental coherence as normative.  
  - **B (12–15)**: Covers points but conflates welfare/coherence or fails to resolve the resolute-choice paradox.  

  ---

  ### Confidence Note (92 words)  
  I am 85% confident this question has a single best answer: the agent is irrational due to diachronic incoherence overriding contentment. The least defensible A-grade requirement is that **resolute choice violates synchronic rationality**, as some (e.g., McClennen) defend resoluteness as rational. However, for this course—focused on standard rational choice—requiring this illustrates the tension between synchronic and diachronic demands. Strong candidates should recognize this tension but conclude that *without* synchronic violation, menu-dependent agents are exploitable, which standard theory cannot accept. This forces engagement with rational choice’s core axioms.
