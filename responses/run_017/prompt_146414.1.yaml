  We are writing a research proposal on intervention-relative reward identification in inverse reinforcement learning (IRL), with a focus on assistive robotics where the deployment action set differs from the demonstration action set. The proposal must be two pages, structured with clear sections, and address the following:

  1. **Framing the Question**: Propose a taxonomy of intervention classes and characterize the equivalence classes of rewards for each. The conjecture is that as intervention classes get richer (more types of changes), the equivalence classes become finer (more distinguishable rewards). The classic "many rewards fit one policy" is the empty-intervention case.

  2. **Critique of Existing Work**: Argue that current debates (e.g., priors, regularizers) are proxies for unstated assumptions about the intended intervention. Once the intervention class is specified, some disputes become resolvable.

  3. **Approach**: 
     - Develop the theoretical framework (taxonomy, equivalence classes).
     - Conduct empirical stress tests: 
          a) Gridworld with capacity-limited demonstrator and expanded deployment action set.
          b) Continuous-control simulation (assistive-like) with similar setup.
     - Use synthetic data only (no human data).

  4. **Deliverable**: A one-page practitioner checklist that, given an intervention class, outlines the remaining reward ambiguity and the data needed to reduce it.

  5. **Failure Modes and Scope**:
     - Failure: If the equivalence-class hierarchy collapses (capacity changes don't matter) or if the taxonomy is just a relabeling of existing identifiability literature.
     - Scope: Six-month pilot fellowship at 60% time (so about 3 months full-time equivalent). Focus on theory and simulations.

  6. **Addressing Critiques**: 
     - Economists: Acknowledge revealed preference theory but emphasize that IRL deals with sequential decisions and partial observability of rewards, and our focus is on the consequences of changing action sets in sequential settings (which is less studied in economics).

  We write in American English, avoid citations, and aim for a style that is neither too philosophical nor purely empirical.

  Proposal Structure:

  1. **Title and Abstract**
  2. **Introduction and Problem Statement**
  3. **Research Questions and Objectives**
  4. **Background and Motivation**
  5. **Preliminary Theoretical Framework: Intervention-Relative Identification**
  6. **Critique of Existing Approaches**
  7. **Methodology**
  8. **Expected Outcomes and Deliverables**
  9. **Risk Management and Limitations**
  10. **Timeline and Resources**
  11. **Conclusion**

  Given the two-page constraint, we must be concise. We'll aim for about 1500 words.

  Let's draft accordingly.
answer: |-
  ### Research Proposal: Intervention-Relative Reward Identification for Robust Assistive Robotics  

  **Title:** Capacity-Relative Reward Inference: A Framework for Action-Set Mismatch in Shared-Autonomy Systems  

  #### 1. Introduction and Problem Statement  
  Inverse reinforcement learning (IRL) aims to infer rewards from observed behavior. However, IRL suffers from *underdetermination*: many rewards explain the same behavior. This ambiguity is often treated as a monolithic challenge, but its severity depends on how the inferred reward will be used. In assistive robotics (e.g., wheelchair-mounted arms), a critical gap arises: rewards are inferred from users with *restricted motor capacities* (e.g., head-array inputs), yet deployed to guide robots with a *broader action set*. This mismatch conflates "what the user intended" with "what they could physically achieve." For example, a user nudging a cup toward a table edge might be compensating for limited reach, not expressing a preference for cup placement. We hypothesize that reward ambiguity is not inherent to the data alone but is *relative to the class of interventions* (e.g., action-set changes, environmental perturbations) under which the reward will be deployed. Failure to account for this leads to reward misspecification, risking harmful autonomy in assistive settings.  

  #### 2. Research Questions and Objectives  
  **Core Question:** How does the identifiability of rewards in IRL depend on the *class of interventions* for which they are optimized?  
  **Objectives:**  
  1. **Taxonomy Development:** Define intervention classes (e.g., Table 1) and characterize the equivalence classes of rewards indistinguishable under each class.  
  2. **Ambiguity Quantification:** Prove theoretically and empirically that richer intervention classes yield finer reward equivalence classes (reducing ambiguity).  
  3. **Assistive Focus:** Demonstrate that capacity mismatch (demonstrator vs. deployment action sets) induces severe ambiguity overlooked by standard IRL.  
  4. **Practical Guidance:** Deliver a decision tool for practitioners to diagnose and resolve ambiguity given their intervention context.  

  *Table 1: Proposed Intervention Taxonomy*  
  | **Intervention Class** | **Description** | **Example** |  
  |------------------------|-----------------|-------------|  
  | *Class 0*: Prediction | No intervention; predict behavior under same dynamics | User modeling |  
  | *Class 1*: Environment Dynamics | Change transition function ($\mathcal{P} \to \mathcal{P}'$) | Adding obstacles |  
  | *Class 2*: Action Set Expansion | Expand demonstrator’s actions ($\mathcal{A} \subset \mathcal{A}'$) | Assistive robotics |  
  | *Class 3*: Choice Set Alteration | Change available options (e.g., recommender systems) | Nudging via option ranking |  
  | *Class 4*: Preference Shaping | Shift user goals ($R \to R'$) | Cognitive therapy bots |  

  **Conjecture:** The classic "many rewards fit one policy" result [e.g., Ng & Russell 2000] corresponds to *Class 0*. As interventions grow richer (e.g., *Class 2*), equivalence classes shrink (fewer rewards explain post-intervention behavior).  

  #### 3. Critique of Existing Approaches  
  Current IRL debates focus on *priors* (Bayesian IRL), *regularizers* (feature-count matching), or *noise models* (Boltzmann rationality) as solutions to underdetermination. However, these are proxies for implicit assumptions about deployment interventions. For instance:  
  - **MaxEnt IRL** [Ziebart 2008] assumes rewards will predict behavior under *unchanged* dynamics (*Class 0*), failing when actions expand (*Class 2*).  
  - **Bayesian IRL** [Ramachandran 2007] incorporates domain knowledge via priors but does not formalize how priors should encode intervention classes.  
  - **Deep IRL** often treats ambiguity as noise, neglecting structural mismatches like capacity shifts.  
  These approaches leave ambiguity unresolved because they do not *explicitly condition reward identifiability on the intervention class*. By formalizing this link, we convert philosophical disputes (e.g., "which prior is correct?") into testable claims: A prior is "good" if it captures the intervention’s effect on reward equivalence classes.  

  #### 4. Methodology  
  **Phase 1: Theoretical Framework**  
  - Define *intervention-relative equivalence*: Rewards $R_1, R_2$ are equivalent under intervention class $\mathcal{I}$ if they prescribe identical optimal behaviors *for all environments in $\mathcal{I}$*.  
  - Derive equivalence-class cardinality bounds for each intervention class (e.g., *Class 2* requires rewards to agree on all actions in $\mathcal{A}'$, not just $\mathcal{A}$).  
  - **Key Theorem**: If $\mathcal{I}_1 \supset \mathcal{I}_2$, the equivalence classes under $\mathcal{I}_1$ are subsets of those under $\mathcal{I}_2$ (finer ambiguity).  

  **Phase 2: Empirical Stress Testing**  
  - **GridWorld:** Simulate a demonstrator with limited actions (e.g., only $\{left, right\}$) and deploy under expanded actions ($\{left, right, up, down\}$). Fit rewards using MaxEnt IRL and Bayesian IRL. Measure divergence in reward-consistent policies post-expansion.  
  - **Continuous Control:** Use MuJoCo to simulate a disabled user pouring water with a low-dimensional controller (2DoF), then deploy a high-DoF robotic arm. Fit rewards via deep MaxEnt IRL [Finn 2016], then compute regret when executing reward-optimal policies under full action space.  
  - **Metrics:** Policy divergence (KL-divergence), regret relative to ground truth, and ambiguity radius (max $L_2$-distance between rewards in the same equivalence class).  

  **Phase 3: Practitioner Tool**  
  Develop a checklist to map intervention classes to:  
  - *Ambiguity Type* (e.g., for *Class 2*, "rewards may disagree on unused actions").  
  - *Data Requirements* (e.g., "collect demonstrations under $\geq 2$ action subsets to disambiguate").  

  #### 5. Expected Outcomes and Deliverables  
  1. **Theoretical:** Hierarchy of reward equivalence classes per intervention type.  
  2. **Empirical:** Quantification of capacity-relative ambiguity in simulations (e.g., "Action-set expansion doubles regret in assistive pouring").  
  3. **Tool:** One-page checklist for IRL practitioners.  
  4. **Conferences:** Submission to CoRL or RSS (robotics) and ICML (ML theory).  

  #### 6. Risk Management and Limitations  
  **Failure Modes:**  
  - *Collapsing Hierarchy:* If equivalence classes are identical across intervention classes (e.g., action-set changes induce no extra ambiguity), the core hypothesis fails. We mitigate by testing pathological cases (e.g., degenerate rewards).  
  - *Trivial Taxonomy:* If the taxonomy reduplicates known identifiability results (e.g., linear vs. nonlinear rewards), we will show novel distinctions using *Class 2* (action expansion) and *Class 3* (choice sets).  
  - *Oversimplification:* Synthetic simulations may miss human factors. We explicitly scope out human trials (no IRB).  

  **Scope for 6-Month Pilot (60% effort ≈ 3 months full-time):**  
  - Complete *Class 0–2* theory and gridworld experiments.  
  - Draft continuous-control simulations (full implementation deferred).  
  - Release checklist beta for *Class 2* interventions.  

  #### 7. Addressing Interdisciplinary Critiques  
  To economists: While revealed preference theory handles capacity constraints in *static* choice, IRL addresses *sequential*, *partially observable* decisions where actions affect future states. Our work formalizes how *changes in sequential action sets* introduce ambiguity distinct from static budget constraints. We integrate economic rigor (e.g., equivalence classes mirror completeness axioms) but focus on dynamical systems.  

  To philosophers/engineers: This is not pure theory; we deliver testable predictions (equivalence-class structure) and empirical benchmarks. It is not just engineering; we prove formal guarantees about identifiability under interventions.  

  ---  
  **Proposal Length:** ~2 pages (excludes title/abstract).  
  **American English:** Ensured (e.g., "behavior" not "behaviour").  
  **Next Steps:** Insert citations (e.g., Ng & Russell, Ziebart, Finn) and expand theoretical proofs in appendix.
