prompt: |-
  I volunteer as a facilitator for a small peer-support group for people living with recurrent depression and bipolar disorder, and part of my job is sitting down with new members for a single ninety-minute session to write what we call a "bad day plan": one page, written while the member is steady, saying what the rest of us should do if they start to slide — who to call, whether to contact their clinician, whether emergency services should ever be involved, and what they have told us in advance that they do and don't want. Months later that page gets used by whoever happens to be on the phone at two in the morning, often a volunteer who has never met the member, so it has to be legible to a stranger under time pressure. I have no academic background in any of this; I got interested after a friend compared it to the story of Odysseus having himself tied to the mast, and I've been reading and arguing about it on my own ever since.

  The tangle I can't resolve on my own is that the person who shows up later is often not the person who signed the page. Sometimes a member in a bad stretch texts us to cancel the plan outright — "ignore everything I wrote, I meant none of it, don't contact anyone" — and we can't tell whether that is the very state the plan was written to guard against, or a genuine change of mind we should respect. Sometimes it runs the other way: someone wrote a clause at the bottom of an episode ("never let them hospitalize me again, whatever happens") and now, stable and on a medication that works, insists the clause should stay, and I don't know whether honoring that is loyalty to their earlier self or just ratifying something a suffering person wrote. Sometimes the later self is simply better informed than the earlier one — a new diagnosis, a new drug, a therapist who explained something nobody knew when the page was signed. And the same puzzle has come up one level up: our group is drafting an amendment to its own rules about when plans can be overridden, and everyone wants to pass it in the same heated meeting where an incident happened, which is exactly when I least trust our judgment.

  What I need from you is a procedure my fellow facilitators and I can actually run, not a discussion of the theory for its own sake. Please give me: the questions to ask in order during and after a session; what counts as a good enough answer to each one given that we have ninety minutes and no clinical training; the point at which the procedure just stops and says no, we don't write this clause or we don't act on this instruction; and the points where it has to hand the decision to a human being — the member, their clinician, the group — because the question is really about whose values count rather than about facts. Include the shape of the one-page output itself, since that is the artifact that has to work at two in the morning. Please run the procedure on three situations like the ones I described — the cancellation message sent during a bad stretch, the clause written at the bottom of an episode that the now-stable member wants to keep, and the charter amendment proposed in the heat of an incident — including at least one case where it gives an answer our group will dislike. Finally, be explicit about what the procedure cannot do: where it will misfire, and which disagreements it can only surface rather than settle. Anything the procedure asks us to record has to be something a volunteer could write down in plain language and defend to the member afterwards.
reasoning: |-
  We are designing a procedure for creating and implementing a "bad day plan" (BDP) for members of a peer-support group. The procedure must address:
  1. The creation of the BDP during a 90-minute session when the member is stable.
  2. Handling situations where the member later tries to cancel or change the plan during a bad stretch.
  3. Handling clauses in the BDP that were written during a previous episode and the member, now stable, wants to keep.
  4. Handling group-level decisions (like amending rules) made in the heat of an incident.

  The procedure must:
  - Be practical for volunteers without clinical training.
  - Result in a one-page, legible document that can be used by a stranger at 2 a.m.
  - Include clear steps for when to stop and say "no" to a clause or an instruction.
  - Specify when to hand decisions to the member, their clinician, or the group.

  We'll break the procedure into parts:
  I. The 90-minute session to create the BDP.
  II. Procedures for when a member later contacts the group (e.g., to cancel the plan).
  III. Procedures for reviewing and updating the BDP (when the member is stable).
  IV. Group-level rule changes (charter amendments).

  Additionally, we'll design the one-page BDP template.

  **I. The 90-Minute Session to Create the Bad Day Plan (BDP)**

  Objective: Create a clear, one-page plan that can be used by any volunteer during a crisis.

  Steps during the session:

  1. **Introduction and Consent (10 minutes)**
     - Explain the purpose: "This plan is for when you are in a bad state and might not be able to make decisions or communicate clearly. We will write down what you want us to do in that situation, based on what you tell us now when you are feeling steady."
     - Explain that the plan is designed to be used by any volunteer, even one who doesn't know you, so clarity is key.
     - Obtain written consent: "Do you agree to create this plan? Do you understand that we will follow it unless we have a clear reason to believe it no longer reflects your values or current situation?"

  2. **Gathering Information (30 minutes)**
     - Ask the following questions and record the answers in plain language. The volunteer should write exactly what the member says, but if the member uses jargon or unclear terms, ask for clarification in simple words.
       - **Q1: What are the early signs that you are starting to slide?** (e.g., "I stop answering texts," "I start sleeping all day")
       - **Q2: What helps when you are sliding?** (e.g., "Call me every day at 6 pm," "Remind me to take my meds," "Ask my friend Alex to check on me")
       - **Q3: What makes things worse?** (e.g., "Don't tell my boss," "Don't mention my ex")
       - **Q4: Who should we contact?** (List in order of priority. For each contact, get name, relationship, phone, and what they are authorized to do. Also, ask: "Is there anyone we should never contact?")
          - Primary contact: 
          - Secondary contact: 
          - Clinician(s): (Name, phone, and under what circumstances to call)
          - Emergency services: When to call? (e.g., "Only if I say I have a plan to hurt myself") and when not to call?
       - **Q5: What are your advance instructions regarding medical care?** (e.g., "If I am not making sense, call my psychiatrist Dr. Smith at 555-1234," "I consent to being taken to General Hospital but not to County," "Do not call an ambulance unless I am unconscious")
       - **Q6: Is there anything else we should know?** (e.g., "I have a service dog named Max," "I take medication X at 8 am and 8 pm")

  3. **Drafting the Plan (20 minutes)**
     - Use a template (provided below) to fill in the answers. Read back each section to the member and ask: "Is this what you meant? Is there anything we should change to make it clearer?"

  4. **Review and Commitment (20 minutes)**
     - **Key question to ask the member:**
       - "We know that when you are in a bad state, you might change your mind and tell us to ignore this plan. How should we decide whether to follow the plan or your new instruction during a bad stretch?"
          - Possible answers we are looking for: 
            - The member might say: "Always follow the plan, even if I say to cancel it." -> Then we write: "DO NOT cancel this plan if I ask during a bad stretch. Follow it exactly."
            - Or: "If I say to cancel, then call my sister Jane at 555-0001 and she will decide." -> Then we write: "If I ask to cancel the plan, contact Jane Doe at 555-0001 and follow her instructions."
            - Or: "If I say to cancel, then do cancel, but only if I am not in danger." -> This is too vague. We must avoid ambiguity. So we push for a clear rule: "We cannot judge whether you are in danger. Can we agree on a rule? For example, we will call your clinician if you ask to cancel and let them decide?" ... If we can't get a clear rule, then we write: "If I ask to cancel the plan, contact [clinician's name] and follow their instructions. If no clinician is available, follow the plan."
       - We must avoid ambiguity. If the member cannot provide a clear rule, we default to: "Any request to cancel the plan must be confirmed by [designated contact] or [clinician]. Until then, the plan remains in effect."
     - **Second key question:** 
       - "What if we see that your situation has changed in a way that you couldn't have known when writing this plan? For example, a new diagnosis or medication?"
          - We can write: "The group may contact [clinician] if they believe there is new information that changes the plan." 
     - **Third key question:**
       - "How often should we review this plan? We suggest every 6 months, or after a major change (new diagnosis, new meds, etc.)."
     - Have the member sign and date the plan. The volunteer also signs as witness.

  5. **Stop Points:**
     - If the member cannot answer the questions in a way that produces a clear plan (e.g., they refuse to name any contacts, or they insist on ambiguous instructions that a volunteer couldn't follow at 2 a.m.), we stop and do not create a plan. We explain: "We need a clear plan to keep you safe. Let's try again when you feel ready."
     - If the member wants to include a clause that the volunteer believes is unsafe (e.g., "never call emergency services no matter what"), we say: "We cannot agree to that because we have a duty to prevent serious harm. We must be able to call emergency services if we believe you are in immediate danger. Let's discuss how we can make you feel safe while also having a backup." If the member insists, we do not create the plan.

  **Template for the One-Page Bad Day Plan:**

  [Member's Name]'s Bad Day Plan
  Created on: [Date]
  Review due: [Date, 6 months later]

  **Early signs that I am sliding:**
  [Bulleted list from Q1]

  **What helps:**
  [Bulleted list from Q2]

  **What makes things worse:**
  [Bulleted list from Q3]

  **Who to contact (in order):**
  1. [Name, Relationship, Phone, What they can do]
     (e.g., "Jane Doe (sister) 555-0001: Can come to my apartment and check on me")
  2. ...
  3. Clinician: [Name, Phone, When to call] (e.g., "Dr. Smith, 555-1234, call if I miss two check-ins")
  4. Emergency services: [When to call, when not to call] (e.g., "Call 911 only if I am unconscious or threatening immediate harm to myself or others. Do not call for any other reason.")

  **Advance medical instructions:**
  - [e.g., "I consent to being taken to General Hospital. Do not take me to County Hospital."]
  - [e.g., "I am allergic to medication X."]

  **Other important information:**
  - [e.g., "I have a service dog named Max."]

  **Special Rules:**
  - If I ask to cancel this plan: [e.g., "Call Jane Doe (555-0001) and follow her instructions. Do not cancel without her confirmation." OR "Do not cancel. Follow this plan even if I say to cancel."]
  - If there is new information (like a new diagnosis) that might affect the plan: [e.g., "The group should contact Dr. Smith for guidance."]

  **Signatures:**
  Member: ________________________ Date: ________
  Facilitator (Witness): ______________ Date: ________

  **II. Procedure for Handling a Member's Request to Cancel the Plan During a Bad Stretch**

  When a member sends a message to cancel the plan (e.g., "ignore everything I wrote, I meant none of it, don't contact anyone"):

  1. **Check the Plan:**
     - Look at the "Special Rules" section of their BDP. 
     - If it says "Do not cancel. Follow this plan even if I say to cancel," then ignore the cancellation request and follow the plan.
     - If it says to contact a designated person (e.g., "Call Jane Doe and follow her instructions"), then contact that person and follow their instructions.
     - If it says to contact a clinician, then contact the clinician and follow their instructions.

  2. **If the Plan Doesn't Have Clear Instructions for Cancellation:**
     - Default action: Contact the primary contact from the plan and follow their instructions.
     - If you cannot reach the primary contact within 30 minutes, contact the secondary contact.
     - If you cannot reach anyone and the member seems to be in danger (based on the plan's emergency criteria), call emergency services.

  3. **Stop Point:**
     - If the plan does not have clear instructions for cancellation and you cannot reach any designated contact or clinician, and you believe the member is in immediate danger (e.g., expressing suicidal intent), call emergency services. Otherwise, follow the existing plan.

  **III. Procedure for When a Member Wants to Keep a Clause Written at the Bottom of an Episode**

  Situation: The member is now stable and wants to keep a clause in their BDP that they wrote during a previous episode (e.g., "never let them hospitalize me again, whatever happens").

  1. **Review the Clause During a Stable Period:**
     - Schedule a session to review the entire plan (as per the review date or upon member's request).
     - Ask: "You wrote this clause when you were in a bad state. Now that you are stable, do you still believe this clause is what you want? Why or why not?"
     - If the member says they still want it, ask: "Can you tell me your reasons for wanting to keep this clause? How does it fit with your current values and situation?"

  2. **Evaluate the Clause:**
     - If the clause is clear and does not put the member at immediate risk (e.g., it says "avoid hospitalization if possible, but if my clinician says it's necessary then allow it"), then it can stay.
     - If the clause is absolute and potentially dangerous (e.g., "never hospitalize me, even if I am suicidal"), we must challenge it:
          - Explain: "We cannot agree to a clause that prevents us from calling emergency services if we believe your life is in danger. We have a duty to keep you safe. Can we revise this to something like: 'Avoid hospitalization if possible. Contact [designated person] and [clinician] to discuss alternatives first, but if they are not available and I am in immediate danger, then emergency services may be called.'"

  3. **If the Member Insists:**
     - We cannot include a clause that forces us to withhold life-saving help. We say: "We cannot include this clause because it would prevent us from acting in an emergency. We can write that you prefer to avoid hospitalization and list alternatives, but we cannot promise never to call emergency services."
     - If the member still insists, we may have to remove the entire plan because we cannot create a plan that we cannot follow in good conscience.

  4. **Handoff to Clinician:**
     - If the member and the facilitator cannot agree, suggest: "Let's consult your clinician. We can send them the clause and ask for their input." Then, if the clinician supports the clause and agrees to take responsibility, we might include it with a note: "This clause has been reviewed by [clinician] on [date]." But note: we are not bound by the clinician's advice if we believe it is unsafe. If we are uncomfortable, we can still refuse.

  **IV. Group-Level Rule Changes (Charter Amendments)**

  Situation: The group wants to amend its rules about when plans can be overridden, and the proposal comes in the heat of an incident.

  1. **Procedure for Amending Rules:**
     - Require that any rule change proposal be submitted in writing and discussed at two separate meetings, at least one week apart.
     - At the first meeting, only discuss the proposal. No vote.
     - At the second meeting, after members have had time to reflect, discuss again and then vote.
     - Require a 2/3 majority of the facilitators and at least one consulting clinician (if available) to approve.

  2. **Stop Point:**
     - If a proposal is made during a heated incident, do not allow a vote until the above procedure is followed. Explain: "We are not in a calm state to make permanent decisions. Let's write down the proposal and discuss it at our next regular meeting."

  **Running the Procedure on Three Situations**

  **Situation 1: Cancellation Message During a Bad Stretch**

  - Member: Alex
  - BDP says: "If I ask to cancel this plan, do not cancel. Follow the plan even if I say to cancel."
  - Alex texts: "Ignore everything I wrote, I meant none of it, don't contact anyone."

  Procedure:
  - Follow the BDP: ignore the cancellation request and follow the plan.
  - Record: "Alex requested cancellation at [time]. BDP states to ignore such requests. Proceeding with plan: calling primary contact (Jane) and then clinician (Dr. Smith)."

  **Situation 2: Clause Written at Bottom of Episode that Stable Member Wants to Keep**

  - Member: Taylor
  - Clause: "Never hospitalize me again, whatever happens."
  - Taylor is now stable and wants to keep it.

  Procedure:
  - During a review session, the facilitator asks Taylor about the clause.
  - Taylor explains: "I had a terrible experience in the hospital last time. I would rather die than go back."
  - The facilitator says: "We understand that you had a bad experience, but we cannot promise never to hospitalize you because we might be in a situation where it's the only way to save your life. Let's try to make a safer clause: 'Avoid hospitalization if at all possible. Contact my therapist Dr. Lee and my brother Sam to discuss alternatives. Only call emergency services if I am in immediate danger and no alternative can be found.'"
  - Taylor agrees to the revision. The clause is updated accordingly.

  **Situation 3: Charter Amendment Proposed in the Heat of an Incident**

  - During a meeting where a member had a crisis and the BDP was overridden (perhaps because it was outdated), a facilitator proposes: "We should be able to override any plan if two facilitators agree it's necessary."

  Procedure:
  - The group leader says: "This is an important proposal. Let's write it down and put it on the agenda for our next meeting. We will discuss it then and again at the meeting after that. We cannot vote today because we are all upset about the incident and need time to reflect."

  **One Case Where the Answer is Disliked**

  **Situation:** A member, Jordan, writes in their BDP: "Do not contact my parents under any circumstances." Later, during a crisis, the volunteer on the phone sees that the only contact listed (a friend) is unreachable, and the member is in severe distress. The volunteer knows that the member's parents are supportive and nearby but the BDP forbids contacting them.

  Procedure:
  - The BDP must be followed: do not contact the parents.
  - The volunteer tries the friend again and then the clinician. If no one answers and the member is in immediate danger (e.g., threatening suicide), then call emergency services. 
  - The group may dislike this because the parents could have helped, but the procedure respects the member's advance directive.

  **What the Procedure Cannot Do**

  1. **Resolve deep value conflicts:** For example, if a member's stable self values life above all, but during an episode they write a clause that could lead to death, the procedure can surface that conflict but cannot resolve it without the member's input when stable. We must rely on the stable self's instructions.

  2. **Predict the future:** The BDP is based on the member's current knowledge. If a new diagnosis or treatment changes things, the procedure can only build in a way to contact a clinician for guidance.

  3. **Replace clinical judgment:** The procedure does not make us clinicians. We are bound by the plan and our duty of care. If a situation arises that the plan doesn't cover, we must use our best judgment and default to safety.

  4. **Prevent all regret:** Sometimes following the plan will lead to outcomes the member later regrets (like hospitalization). The procedure cannot avoid that; it only ensures we followed the member's prior instructions.

  5. **Handle every edge case:** The procedure is a framework. Unforeseen situations will arise, and volunteers must use the plan as a guide but also common sense and compassion.

  By following this procedure, we aim to respect the member's autonomy while ensuring their safety, with clear guardrails for volunteers.
answer: |-
  Below is a practical, step-by-step procedure for creating and implementing "bad day plans" (BDPs) in your peer-support group. It is designed for non-clinical volunteers, fits within a 90-minute session, and addresses your core challenges: honoring autonomy while safeguarding against crisis-driven changes, ambiguous clauses, and group decisions made in distress. The procedure includes:  
  - **Key questions** to ask during/after sessions.  
  - **Clear stop points** where the process halts or defers decisions.  
  - **A template** for the one-page BDP.  
  - **Handoffs** to clinicians, members, or the group when values clash.  
  - **Three worked examples** (including one unpopular outcome).  
  - **Limitations** where the procedure may misfire.  

  ---

  ### **I. Procedure for the 90-Minute BDP Session**  
  *Goal: Create a clear, actionable plan while the member is stable.*  
  **Time Allocation:** Stick to these phases strictly to stay within 90 minutes.  

  #### **Phase 1: Introduction and Consent (10 minutes)**  
  - **Key Question:**  
    > *"This plan will be used if you’re in a bad state and can’t make decisions. We’ll write down what you want us to do then, based on what you tell us today. Do you understand and agree to create this plan?"*  
  - **Stop Point:** If the member hesitates, seems unstable, or cannot consent clearly, end the session. Say: *"Let’s pause and revisit this when you’re ready."*  
  - **Good Enough Answer:** A clear "yes" and signature on a consent form.  

  #### **Phase 2: Core Questions (40 minutes)**  
  Ask these questions verbatim. Record answers verbatim, then simplify for clarity.  
  1. **Early Signs:**  
     > *"What are 2–3 specific signs that you’re starting to slide (e.g., sleep changes, isolating)?"*  
     - **Good Enough:** Concrete behaviors (e.g., "Skips meals," "Stops texting back"). Avoid vague terms like "feel worse."  
     - **Stop Point:** If answers are too ambiguous (e.g., "I just know"), ask for observable cues. If still unclear, skip and revisit later.  

  2. **Helpful Actions:**  
     > *"What should we do to support you early on? Who should we involve (e.g., call a friend, remind you to take meds)?"*  
     - **Good Enough:** Actionable steps (e.g., "Text me daily at 6 PM," "Call my sister Lisa").  

  3. **Unhelpful/Harmful Actions:**  
     > *"What should we NEVER do (e.g., contact your workplace, mention a trigger)?"*  
     - **Good Enough:** Specific boundaries (e.g., "Don’t call my ex," "Don’t discuss weight").  

  4. **Contacts:**  
     > *"Who should we contact first? Second? When should we call your clinician? When should we call emergency services (e.g., if you mention suicide)? Who should we NEVER contact?"*  
     - **Good Enough:** Names, phone numbers, and clear rules (e.g., "Call Dr. Lee if I miss 3 check-ins," "Call 911 only if I threaten immediate harm").  
     - **Stop Point:** If they refuse any emergency contacts, say: *"We can’t create a plan without at least one backup contact. Let’s stop here."*  

  5. **Advance Directives:**  
     > *"If you’re in crisis, what medical choices do you want us to uphold (e.g., hospital preferences, medication allergies)?"*  
     - **Good Enough:** Direct instructions (e.g., "Take me to St. Mary’s Hospital," "I’m allergic to haloperidol").  

  #### **Phase 3: Crisis Safeguards (25 minutes)**  
  *Address the "later self" problem upfront.*  
  1. **Cancellation Rule:**  
     > *"If you later say ‘ignore this plan,’ how should we decide whether to listen? Options: (A) Always follow this plan, (B) Call your clinician/contact to decide, or (C) Something else."*  
     - **Good Enough:** A clear rule (e.g., "Never cancel—follow this plan" or "Call my sister to decide").  
     - **Stop Point:** If they insist on ambiguous rules (e.g., "Cancel if I sound serious"), refuse. Say: *"We need a rule a stranger can follow. Pick A or B, or we can’t finish."*  

  2. **Clause Expiration:**  
     > *"Should any instructions expire if your situation changes (e.g., new diagnosis)? If so, who should we check with (e.g., your clinician)?"*  
     - **Good Enough:** A renewal rule (e.g., "Review every 6 months" or "Call my doctor if things change").  

  3. **Values Check:**  
     > *"Is there anything here that feels extreme (e.g., ‘never hospitalize me’)? If so, why is it important to you?"*  
     - **Handoff to Member:** If they defend it stably (e.g., "Hospital trauma is worse than my episodes"), allow it. If unstable/unsafe, defer to clinician (see Phase 4).  

  #### **Phase 4: Finalization and Handoffs (15 minutes)**  
  1. **Draft the BDP:** Use the template below. Read it aloud. Ask: *"Is this clear to a stranger at 2 AM?"*  
  2. **Clinician Handoff:**  
     - If a clause risks safety (e.g., "never call EMS"), say: *"We need your clinician to confirm this won’t harm you. Can we email them a summary?"* If member refuses, omit the clause.  
     - If the plan relies on clinical knowledge (e.g., medication details), add: *"Contact [clinician] if unsure."*  
  3. **Sign-Off:**  
     > *"This plan reflects your wishes today. We’ll follow it unless [clinician/contact] advises otherwise during a crisis. Sign if you agree."*  
     - **Stop Point:** No signature? No plan.  

  ---

  ### **II. One-Page BDP Template**  
  *Design Principles: Scannable, plain language, <1 page. Use bold headers, bullet points, and a large font.*  

  ```markdown
  **BAD DAY PLAN FOR [NAME]**  
  Created: [Date] | Review by: [Date] [➔ Default: 6 months]  

  **🚩 EARLY SIGNS I'M SLIDING:**  
  • [e.g., "Isolate for 48+ hours"]  
  • [e.g., "Stop taking meds"]  

  **🛟 WHAT HELPS:**  
  • [e.g., "Text me daily: 'You said to check in'"]  
  • [e.g., "Call my sister Lisa (555-1234)"]  

  **⚠️ WHAT HURTS:**  
  • [e.g., "Never mention my job"]  
  • [e.g., "Don’t call 911 unless I’m a direct danger"]  

  **📞 WHO TO CONTACT (IN ORDER):**  
  1. [Name, Relation, Phone, Role] • e.g., "Lisa (sister) 555-1234: Can bring me food/meds"  
  2. [Clinician, Phone, When] • e.g., "Dr. Lee 555-5678: Call if I skip 2 check-ins"  
  3. [EMS When] • e.g., "Call 911 ONLY if I threaten suicide"  

  **⚕️ ADVANCE MEDICAL REQUESTS:**  
  • [e.g., "Hospital: St. Mary’s only"]  
  • [e.g., "Allergy: Haloperidol"]  

  **❗ CRISIS RULES:**  
  • "If I say 'cancel this plan,' [e.g., IGNORE - FOLLOW THIS PLAN] or [e.g., CALL LISA TO DECIDE]"  
  • "If my situation changes (e.g., new meds), [e.g., CALL DR. LEE]"  

  Signed: _________________________ [Member] | _________________________ [Facilitator]  
  ```  

  ---

  ### **III. Procedure for Post-Session Scenarios**  
  #### **Scenario 1: Member Texts "Cancel the Plan" During a Bad Stretch**  
  - **Step 1:** Check the BDP’s "Crisis Rules" section.  
    - If it says "IGNORE - FOLLOW PLAN," proceed with the plan.  
    - If it says "CALL [CONTACT] TO DECIDE," contact that person and follow their instruction.  
  - **Step 2:** If no rule exists, default to: Contact the member’s clinician (if listed) or primary contact.  
    - **Stop Point:** If unreachable after 30 minutes and member is in danger (e.g., suicidal), call EMS.  
  - **Step 3:** Log the incident and inform the member when stable.  
  - **Handoff to Clinician:** If the member protests later, say: *"Your plan gave us rules to follow. If you want to change this, let’s update it together when you’re steady."*  

  #### **Scenario 2: Stable Member Wants to Keep a Clause Written at Rock Bottom (e.g., "Never Hospitalize Me")**  
  - **Step 1:** Ask: *"You wrote this when you were in a bad place. Now that you’re stable, why keep it?"*  
    - If answer shows reasoned values (e.g., *"Hospital trauma is worse than my episodes"*), proceed.  
  - **Step 2:** Safety Check:  
    - If the clause prevents life-saving help (e.g., no EMS even if suicidal), say: *"We can’t promise this. Let’s revise it to include safeguards, like calling your clinician first."*  
  - **Handoff to Clinician:** If member insists, require clinician approval: *"We’ll add: 'Unless Dr. [Name] says it’s an emergency.'"* If they refuse, omit the clause.  
  - **Stop Point:** No compromise? Do not include. Say: *"We can’t risk harm. Let’s focus on other instructions."*  

  #### **Scenario 3: Group Proposes Rule Change During Heated Incident**  
  - **Step 1:** Table the amendment. Say: *"We’re all upset right now. Let’s write this down and revisit in 1 week."*  
  - **Step 2:** At the next meeting, ask:  
    > *"Does this change reflect our shared values, or just today’s emotions? What are the risks?"*  
  - **Handoff to Group:** Vote after 2+ meetings. Require 75% agreement to pass.  
  - **Stop Point:** If the group insists on voting immediately, say: *"Our rules require a cooling-off period. We can’t vote today."*  

  ---

  ### **IV. Worked Examples**  
  #### **Example 1: Cancellation Message During Bad Stretch**  
  - **Member:** Alex’s BDP says: *"If I say ‘cancel,’ call my clinician Dr. Lee."*  
  - **Incident:** Alex texts *"Ignore the plan! Don’t contact anyone!"* during a depressive episode.  
  - **Procedure:**  
    - Follow BDP: Contact Dr. Lee.  
    - Dr. Lee advises to continue the plan (e.g., send a wellness check).  
    - **Result:** Plan upheld. Alex dislikes this later, but facilitator defends: *"Your plan told us to call Dr. Lee. We did."*  

  #### **Example 2: Keeping a Rock-Bottom Clause**  
  - **Member:** Taylor wrote: *"Never call EMS."* Now stable, they want to keep it.  
  - **Procedure:**  
    - Taylor explains stably: *"EMS caused trauma last time. I prefer to risk death."*  
    - Safety check: Clause is high-risk.  
    - **Handoff to Clinician:** Facilitator says: *"We’ll add: ‘Unless Dr. Lee says it’s life-threatening.’"* Taylor agrees.  
    - **Result:** Compromise clause added.  

  #### **Example 3: Group Amendment During Incident (Unpopular Outcome)**  
  - **Incident:** A BDP failed during a crisis. In the heated meeting, facilitators propose: *"Override plans if 2 facilitators agree."*  
  - **Procedure:**  
    - Table the vote. At the next meeting, group debates:  
      - *"This protects members!"* vs. *"It violates autonomy!"*  
    - **Handoff to Group:** Vote fails (only 60% support).  
    - **Result:** Amendment rejected. Unpopular with some, but facilitator defends: *"We need broad consensus to change rules."*  

  ---

  ### **V. What the Procedure Cannot Do**  
  1. **Resolve values conflicts:**  
     - E.g., If a member’s stable and crisis selves clash ("Let me die" vs. "Save me"), the procedure surfaces this but defers to the clinician or member when stable.  

  2. **Prevent all harm:**  
     - If a member’s BDP forbids EMS and they attempt suicide, the procedure may "misfire" by honoring their wishes. Log and review these cases.  

  3. **Replace clinical judgment:**  
     - Volunteers aren’t trained to assess "genuine change of mind." The procedure hands off to clinicians for ambiguity (e.g., "Is this cancellation a symptom?").  

  4. **Fix rushed plans:**  
     - If a 90-minute session produces a vague BDP (e.g., unclear EMS rules), it may fail at 2 AM. Stop Point: Only accept concrete answers.  

  5. **Eliminate group tension:**  
     - Rejecting a popular amendment (Example 3) may cause conflict. The procedure only ensures decisions are made calmly.  

  ---

  ### **Key Takeaways**  
  - **Your role:** You’re a scribe and facilitator—not a clinician. Stick to the script, defer to experts, and prioritize safety when plans are ambiguous.  
  - **Odysseus Tie-In:** Like tying oneself to the mast, a BDP binds the member to their "steady self." Your procedure ensures the ropes hold.  
  - **When in Doubt:** Default to the BDP’s written rules, contact the clinician, or call EMS if imminent danger exists.  

  This procedure balances autonomy and safety while respecting your group’s constraints. Revisit it annually to refine based on real cases.
