answer: |-
  In your cell scenario, the captive remains a human being with the *capacity* for personhood throughout, but their actual *status as a person* was actively suppressed and rendered unrealized during their confinement precisely because the necessary relations of mutual recognition were violently withheld. Those relations aren't merely *acknowledgment* of an independent status; they are constitutive of the status itself. The captors didn't manufacture a non-person *ex nihilo*; they prevented the flourishing realization of personhood that depends on engagement. Retroactive recognition by scholars centuries later is profoundly meaningful *ethically*—it restores dignity, honors potential, and condemns the wrong—but it cannot *ontologically* constitute the captive's personhood *during their lifetime*. Personhood, on this view, is an emergent property of *lived*, contemporaneous interaction. The temporal index matters because personhood isn't a static substance but a dynamic *process* unfolding in real-time reciprocity; the scholars relate *to a memory*, not *with a present other* capable of mutual shaping. The captive's personhood was wrongfully denied *because* the relations required for its actualization were possible yet obliterated—not because a pre-existing person-status was ignored. Your scholars perform vital repair work on the *narrative* and *ethical* fabric, not on the metaphysical reality of the captive’s past being-in-relation, which was extinguished.  
  [Confidence: High on the core distinction between capacity and actualized status. Least defensible step: Insisting retroactive recognition cannot *partially* redeem past ontological status, even as narrative/ethical repair.]  

  So, to answer directly: In the cell, deprived of actual mutual recognition, the captive was not a *realized person*, though they possessed the human capacity for it. The scholars' work doesn't change *that* past ontological fact, however much it changes our understanding and moral reckoning. My ontology relies on the *actual network of reciprocally shaping relations* existing at a given time—which were absent then, even if future relations point tragically to what was possible and destroyed.
