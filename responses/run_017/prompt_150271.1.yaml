prompt: |-
  I've got a 40-minute slot on the two-envelope paradox in my second-year decision theory seminar next week, and I want to use it as the bridge into Newcomb rather than as a cute puzzle we dispose of in ten minutes. They've seen conditional expectation but no measure theory, and they've all done a week of Bayesian epistemology, so they're primed to reach for priors. Don't explain the paradox to me — plan the explanation: does it earn its keep to open with the closed-envelope version (you don't look inside) and only then do the version where you see the amount, or is that backwards, and what should the one carrying example be?

  What I really want mapped is the misconception structure and where in the sequence to defuse each thing: the slip where X gets treated as the same variable in the doubling and halving branches; the reflex of blaming the whole thing on there being no uniform distribution over the positive reals (I think this is a dead end, since the trouble survives a perfectly proper prior, but tell me if I'm wrong); and the stubborn student who says that if switching looks better for every amount she might see, then the policy of always switching must be better. I'd definite like to know whether that last one is really a confusion or just true once you let the prior over the smaller amount be heavy-tailed enough, and if it is true, how I say that out loud without leaving them thinking expected utility theory is broken. Finish with one question I can put to them that separates someone who's got it from someone who's just learned to mutter it depends on your prior, plus what I should deliberately leave out at this level.
reasoning: |-
  Okay, let me tackle this decision theory seminar planning request. The professor wants to use the two-envelope paradox as a bridge to Newcomb's problem in a 40-minute slot for second-year students with some Bayesian background. 

  First, I need to consider the pedagogical sequence. The user asks whether to start with the closed-envelope version or the open-envelope version. I recall that in the closed version, the paradox appears symmetric - switching seems equally good or bad. But when you open the envelope and see a specific amount, that's when the faulty calculation tempts you to always switch. That psychological shift is crucial for exposing the misconception. The closed version sets up the symmetry while the open version breaks it in a way that reveals the error. So I'll recommend starting closed then moving to open.

  For the carrying example, I need something that feels concrete but still exposes the paradox. £10 might work - small enough to be relatable but large enough that halving/doubling creates psychologically different amounts (£5 vs £20). The discontinuity around zero isn't an issue here since we're dealing with positive amounts.

  Now for the misconception structure. The core variable confusion happens when students use the same 'X' for both branches without realizing these represent different random variables. I should emphasize that X_switch and X_stay are different when conditioned on the observed amount. 

  The uniform distribution over reals is a red herring - the paradox persists even with proper priors like exponential distributions. I need to show how heavy-tailed priors create switch-always situations without breaking expected utility theory. The key is that for any fixed prior, there will be some amounts where switching is disadvantageous.

  That stubborn student who thinks always switching must be better if it looks better for every observed amount... that's tricky. With heavy-tailed priors, always switching can indeed be optimal, but it's not paradoxical - it just reflects the prior's shape. I should provide a clear example where switching is neutral for most amounts but beneficial for extreme values due to prior beliefs.

  For the diagnostic question, I'm thinking: "If I open my envelope and see £10, does the expected gain from switching depend on what I believe about the host's method for choosing the amounts?" That tests whether they grasp the prior-dependence beyond just the calculation.

  What to omit: measure theory complications, continuous vs discrete distinctions, and the infinite expectation cases. Focus on the conditional expectation error and how priors resolve it without overcomplicating.

  The user seems sophisticated - they've anticipated common student errors and want to strategically dismantle them. I should match that precision while keeping explanations accessible. The bridge to Newcomb will likely involve this same tension between conditional and unconditional expectations.
answer: |-
  Here's a battle-tested lesson plan focusing on misconception demolition and the bridge to Newcomb, optimized for 40 minutes:

  **Core Sequence & Why:**
  1.  **Start Closed (7 mins):** Present the classic closed-envelope version ("Two envelopes, one has 2x the other. You pick one. Should you switch?"). *Why:* Establishes the symmetry intuitively. Students quickly see the argument for indifference (E[Gain] = 0.5*(+x) + 0.5*(-x) = 0). This anchors the "no benefit" baseline and feels stable. It highlights the symmetry that *will* be broken.
  2.  **Pivot to Open (The Crucial Move) (8 mins):** "You pick an envelope, *open it*, and see $Y. Should you switch?" Walk through the faulty reasoning step-by-step: "The other envelope has a 50% chance of $2Y and a 50% chance of $Y/2. So E[Other] = 0.5*($2Y) + 0.5*($0.5Y) = 1.25Y. Since 1.25Y > Y, I should switch!" **Use £10 as the concrete example.** This is where the paradox bites *psychologically* and exposes the key misconception.

  **Targeted Misconception Demolition:**
  *   **The Variable Slip (X Confusion) (7 mins):**
      *   **Spot it:** Explicitly label the error in the open case: "The fatal move is treating 'Y' as the *same fixed value* in both branches of the expectation calculation. When you condition on seeing Y, the amounts in the 'double' and 'halve' scenarios *aren't symmetric* relative to the *smaller amount*."
      *   **Fix it:** Reframe correctly: "Let S be the smaller amount. If you see Y, it could mean:
          *   Case A: Y = S (you have the smaller, other is 2S)
          *   Case B: Y = 2S (you have the larger, other is S)
          The probability of these cases *depends on your prior belief about S!*"
      *   **Correct E[Gain | See Y]:** = `P(Case A | See Y) * (2S - S) + P(Case B | See Y) * (S - 2S)` = `P(Y is smaller | See Y) * (+Y) + P(Y is larger | See Y) * (-Y/2)` (since S = Y/2 if Y is larger).
      *   **Key Insight:** The 50/50 assumption (`P(Case A | See Y) = P(Case B | See Y) = 0.5`) is *only* justified under very specific priors (e.g., you were shown S first and then a coin flip decided which envelope you get).

  *   **Blaming Infinity/Uniform Prior (Dead End) (5 mins):**
      *   **Acknowledge:** "Yes, you *cannot* have a uniform prior over all positive reals. That seems problematic."
      *   **Demolish:** "But the paradox *isn't* solved by this! Use a *perfectly proper prior* like Exponential(λ) for S. Calculate E[Other | See Y]. You'll *still* find ranges of Y where E[Gain | See Y] > 0 and ranges where it's < 0, depending on the prior density at S=Y/2 vs S=Y. The paradox *survives* finite expectations and proper priors. The infinity/uniform issue is a red herring masking the core conditional probability error." (Skip the exp calc; emphasize the result).

  *   **The Stubborn "Always Switch" Student (The Heavy-Tail Truth) (8 mins):**
      *   **Confusion? Sometimes True!** This is CRITICAL. Don't dismiss it as *always* confused. It *can* be rational!
      *   **Explain:** "If your prior belief about S is *heavy-tailed enough* (e.g., P(S > k) decays slower than 1/k²), then for *every finite Y you might see*, E[Gain | See Y] > 0. In this case, the 'always switch' policy *is* optimal!"
      *   **Defuse the Panic:** "This does *not* break EU theory! It reveals its power. EU theory tells you to switch *conditional on what you see (Y)*. If your prior is *so* diffuse that seeing *any* finite Y makes you think you probably got the smaller envelope, then switching *is* beneficial each time. The 'paradox' vanishes; it was just bad intuition about what the prior implies. EU works as designed."
      *   **Contrast:** "For most 'reasonable' priors (e.g., S concentrated on plausible amounts), E[Gain | See Y] flips sign. Seeing £10 might make switching good, seeing £1000 might make it bad."

  **The Bridge & The Finish:**
  *   **Link to Newcomb (2 mins):** "Notice the parallel: In Newcomb, you're tempted to one-box *conditional on the prediction already being made*. But does EU tell you to condition on the prediction? Or act unconditionally? The tension between conditional and unconditional reasoning, and how your beliefs (prior) shape the conditioning, is the core link. We pick this up next time."
  *   **Diagnostic Question (1 min):** "If I open my envelope and see £10, does the expected gain from switching **depend on what I believe about how the host chose the amounts of money?** Explain briefly why." *Why it works:* A "got it" student immediately says "YES!" and explains it depends on the prior over S (the smaller amount), which encodes beliefs about the host's method. A "mutterer" might say "it depends" but can't articulate *how* the prior matters or confuses it with the uniform distribution issue.
  *   **Deliberate Omissions (at this level):**
      *   **Measure Theory:** Stick to discrete examples or continuous with densities. Avoid σ-algebras.
      *   **Non-Probabilistic Resolutions:** Don't dive into logic puzzles or causal decision theory *yet* (save for Newcomb).
      *   **Deep Dives on Specific Priors:** Calculating E[Gain] for Exponential is overkill. State results intuitively.
      *   **Infinite Expectations:** Acknowledge they exist with heavy tails but don't get bogged down in St. Petersburg comparisons. Focus on the *sign* of E[Gain | Y] being prior-dependent.

  **Why this sequence earns its keep:**
  1.  **Builds Intuition:** Starts with the stable (closed) case, then injects the psychological pull of the faulty open-case reasoning, making the error vivid.
  2.  **Targets Errors:** Directly names and dismantles the X-confusion, debunks the uniform prior red herring, and resolves the "always switch" tension correctly without dismissing the student.
  3.  **Empowers Bayes:** Shows priors aren't just a caveat, but the *resolution mechanism*. Heavy tails aren't broken, they're informative.
  4.  **Sets up Newcomb:** Explicitly flags the conditional/unconditional tension as the key link.
  5.  **Manages Time:** Allots time proportional to conceptual weight and student sticking points. The diagnostic question provides instant feedback.

  **One Carrying Example:** **Stick with £10.** It's concrete, relatable, and avoids the £0 issue. The psychological pull of potentially gaining £10 vs losing only £5 is strong and perfectly illustrates the faulty 50/50 reasoning.
