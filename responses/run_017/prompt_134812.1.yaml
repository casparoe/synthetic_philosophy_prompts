  ### Diagnostic Decision Tree for Conceptions of Liberty

  **Design Principles**:  
  - Six yes/no questions, each isolating a distinct axis of liberty.  
  - Questions phrased as concrete cases; no labels or taxonomy presupposed.  
  - Answers map to eight or fewer "leaves" (conceptions), with empty combinations diagnosed.  
  - Scoring key allows answers in any order.  

  ---

  #### Questions (Branch Nodes)  
  1. **Locked Prisoners**:  
     - *Case*: Prisoner A has a guard holding a key (who will never turn it). Prisoner B is behind a jammed lock no one can open. Neither can leave.  
     - **Question**: Is Prisoner A less free than Prisoner B?  
       - *Axis*: Whether unfreedom requires an agent (vs. natural/structural obstacles).  
       - **Yes**: Unfreedom requires an agent.  
       - **No**: Unfreedom can exist without an agent (e.g., jammed lock).  

  2. **Benevolent Master**:  
     - *Case*: A master has absolute power over a subject but has never interfered and is reliably benevolent.  
     - **Question**: Is the subject unfree?  
       - *Axis*: Whether an unexercised standing power suffices for unfreedom.  
       - **Yes**: Standing power alone reduces freedom.  
       - **No**: Freedom requires actual interference.  

  3. **Endorsed Law**:  
     - *Case*: A law you fully endorse (it tracks your reasons) closes options you would otherwise have.  
     - **Question**: Does this law reduce your freedom?  
       - *Axis*: Whether interference by an authority you endorse reduces freedom.  
       - **Yes**: All interference reduces freedom, regardless of endorsement.  
       - **No**: Endorsed interference does not reduce freedom.  

  4. **Addict**:  
     - *Case*: An addict cannot quit due to internal compulsion, with no external obstacle.  
     - **Question**: Is the addict unfree?  
       - *Axis*: Whether obstacles must be external (vs. internal).  
       - **Yes**: Internal obstacles (e.g., addiction) reduce freedom.  
       - **No**: Unfreedom requires external obstacles.  

  5. **Accountable Official**:  
     - *Case*: An official may override you only under rules you helped write, with appeal options.  
     - **Question**: If overridden, does this reduce your freedom?  
       - *Axis*: Whether non-arbitrary (accountable) interference reduces freedom.  
       - **Yes**: All interference reduces freedom, even if accountable.  
       - **No**: Accountable interference does not reduce freedom.  

  6. **Anticipatory Scheduler**:  
     - *Case*: An adaptive workplace system learns your plans and rearranges the environment to prevent you from attempting blocked actions. No one stops or threatens you.  
     - **Question**: Are you free?  
       - *Axis*: Whether freedom requires non-manipulation of options (vs. absence of encountered obstacles).  
       - **Yes**: Freedom exists if no obstacles are encountered.  
       - **No**: Freedom requires no background manipulation, even if obstacles are avoided.  

  ---

  #### Decision Tree Logic  
  - **Tree Structure** (questions in recommended order for efficiency):  
    - Start with **Q1 (Locked Prisoners)** → **Q2 (Benevolent Master)** → **Q3 (Endorsed Law)** → **Q4 (Addict)** → **Q5 (Accountable Official)** → **Q6 (Scheduler)**.  
    - *Rationale*: Q1 and Q2 isolate core divides (agent-dependence and power); later questions refine.  
  - **Leaves (Conceptions)**:  
    Answers combine into 64 possible outcomes, but only 7 are coherent/attractive. Empty combinations are diagnosed below.  

  ---

  #### Leaves (Conceptions of Liberty)  
  Based on answer combinations (`Q1–Q6` as `Y/N`):  

  | Leaf | Conception                          | Description                                                                 | Answers (Q1–Q6) | Empty? | Diagnosis if Empty |
  |------|-------------------------------------|-----------------------------------------------------------------------------|-----------------|--------|--------------------|
  | 1    | **Non-Interference (Causal)**       | Freedom = absence of *actual* interference. Unfreedom is option-specific, non-moralized, external, and causal. | Y, N, Y, N, Y, Y | No     | —                  |
  | 2    | **Non-Interference (Moralized)**    | Freedom = absence of *illegitimate* interference. Only unjust obstacles count. | N, N, N, N, N, Y | No     | —                  |
  | 3    | **Non-Domination (Unaccountable)**  | Freedom = absence of *arbitrary power* (unaccountable to you). Standing power suffices. | Y, Y, N, N, N, N | No     | —                  |
  | 4    | **Non-Domination (Interest-Tracking)** | Freedom = absence of power that *fails to track your interests*. Standing power suffices. | Y, Y, N, N, N, Y | No     | —                  |
  | 5    | **Self-Mastery (Procedural)**       | Freedom = internal self-governance (e.g., rational choice). Internal/external obstacles count. | N, Y, N, Y, Y, N | No     | —                  |
  | 6    | **Self-Mastery (Perfectionist)**    | Freedom = alignment with objective goods. Internal/external obstacles count; non-endorsed interference always reduces freedom. | N, Y, Y, Y, Y, N | No     | —                  |
  | 7    | **Social Status Freedom**           | Freedom = social and material conditions for agency. Obstacles (even endorsed) and standing power reduce freedom. | N, Y, Y, Y, Y, N | No     | —                  |
  | —    | *Unoccupied*                        | *All other combinations*                                                    | —               | Yes    | See below          |

  **Notes on Leaves**:  
  - **Self-Mastery (Procedural vs. Perfectionist)**: Both share `N, Y, ?, Y, Y, N` but split on Q3:  
    - Procedural (`Q3=N`): Endorsed interference doesn’t reduce freedom if autonomy-respecting.  
    - Perfectionist (`Q3=Y`): Interference reduces freedom if it closes "objectively valuable" options.  
  - **Shared Leaf**: **Self-Mastery (Perfectionist)** and **Social Status Freedom** both yield `N, Y, Y, Y, Y, N`.  
    - *Diagnosis*: The tree cannot separate these. The tie is genuine—both views overlap on structural conditions and reject the scheduler’s freedom. A further case is needed:  
      - *New Case*: **The Unchosen Charity**: You receive life-saving aid from a hidden benefactor, ensuring your survival but without your input.  
        - **Question**: Does this enhance your freedom?  
          - Perfectionist: **Yes** (objectively good conditions).  
          - Social Status: **No** (freedom requires agential participation in conditions).  

  **Empty Combinations**:  
  - **`Y, Y, Y, ...`** (e.g., `Y, Y, Y, N, Y, Y`):  
    - *Diagnosis*: Incoherent. Accepts standing power suffices for unfreedom (Q2=Y) but also holds all interference reduces freedom (Q3=Y), even if endorsed—contradicts non-domination logic.  
  - **`N, N, Y, N, ...`** (e.g., `N, N, Y, N, N, Y`):  
    - *Diagnosis*: Unattractive. Claims natural obstacles reduce freedom (Q1=N) but endorsed/accountable interference does not (Q3=N, Q5=N)—implies mountains reduce freedom more than just laws.  
  - **`Y, N, N, Y, ...`** (e.g., `Y, N, N, Y, Y, N`):  
    - *Diagnosis*: Unoccupied. Coherent (e.g., "hybrid" view) but no major theory matches.  

  ---

  #### Scoring Key  
  **How to Use**:  
  1. Answer all six questions (in any order).  
  2. Match your `Y/N` answers to the table below.  
  3. If your combo is missing, see "Empty Combinations" above.  

  | Q1 | Q2 | Q3 | Q4 | Q5 | Q6 | Leaf Conception                             | 
  |----|----|----|----|----|----|--------------------------------------------| 
  | Y  | N  | Y  | N  | Y  | Y  | Non-Interference (Causal)                  | 
  | N  | N  | N  | N  | N  | Y  | Non-Interference (Moralized)               | 
  | Y  | Y  | N  | N  | N  | N  | Non-Domination (Unaccountable)             | 
  | Y  | Y  | N  | N  | N  | Y  | Non-Domination (Interest-Tracking)         | 
  | N  | Y  | N  | Y  | Y  | N  | Self-Mastery (Procedural)                  | 
  | N  | Y  | Y  | Y  | Y  | N  | Self-Mastery (Perfectionist) or Social Status Freedom (tie) | 
  | *Other* | | | | | | *Empty: Incoherent, Unattractive, or Unoccupied* | 

  ---

  **Tree Validation**:  
  - **Distinctions Captured**:  
    - Non-Interference vs. Non-Domination: Split by Q2 (standing power) and Q3 (endorsed interference).  
    - Self-Mastery vs. Others: Split by Q4 (internal obstacles) and Q6 (manipulation).  
  - **Weakness**: The tie between Perfectionist Self-Mastery and Social Status Freedom requires the *Unchosen Charity* case to resolve.  
  - **Efficiency**: Most users reach a leaf in 4–6 questions; no redundant queries.  

  This tree diagnoses conceptions through cases, avoiding labels. Empty combos reveal theoretical gaps or tensions.
