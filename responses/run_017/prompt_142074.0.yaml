answer: |-
  Below is a fully designed activity based on your goals. It uses the symbol wheel (◆ → ▲ → ■ → ● → ★ → ◆) to create a microdomain where students experience how context shapes what feels "obvious" in analogical reasoning. The activity avoids technical language until the debrief and focuses on the visceral realization that prior exposure (warm-up sets) bends interpretations of "the same" operation.

  ---

  ### **Activity: The Shifting Obvious**
  **Core Idea:** Groups primed with different warm-up problems will disagree on ambiguous target problems, revealing that "obvious" answers depend on recent context—not inherent correctness. This mirrors how analogies require "bending" categories, with some "slips" (shifts in interpretation) feeling cheaper than others due to competing pressures.

  **Materials (Nothing to Buy):**
  - **Wheel Handout (1 per group):** A printed circle with ◆ → ▲ → ■ → ● → ★ → ◆ (clockwise). Label symbols clearly.
  - **Problem Cards (Sticky Notes or Index Cards):** 
    - Warm-up sets (A, B, C) on colored cards (e.g., A on blue, B on green, C on yellow).
    - Target problems (identical for all) on white cards.
  - **Group Worksheets (1 per group):** For recording answers and reasons (simple template: problem number, answer, brief reason).
  - **Prediction & Ranking Sheet (1 per group):** For the later phases.
  - **Whiteboard/Poster:** To collate target answers during debrief.

  **Group Structure:** 5 groups of 3–4 students. Assign warm-up sets as:
  - Groups 1 & 2: Warm-up A (successor-focused)
  - Groups 3 & 4: Warm-up B (run-focused)
  - Group 5: Warm-up C (within-string-symbols-focused)

  ---

  ### **Problem Sets**
  All problems ask: "Given this string, what is the next symbol?" Students only need the wheel handout—no theory.

  #### **Warm-up Sets (Priming Phase)**
  Each set has 4 problems. Answers are unambiguous *if* groups follow their primed pattern. **Do not explain rules**—let groups infer from repetition.
  - **Warm-up A (Successor-Focused):** Always move to the next symbol on the wheel.  
    Problems:  
    1. ◆▲ → ? ■ (▲’s successor)  
    2. ■● → ? ★ (●’s successor)  
    3. ●★ → ? ◆ (★’s successor)  
    4. ◆■ → ? ● (■’s successor)  
    **Predictions:** Groups will default to "travel along the wheel."

  - **Warm-up B (Run-Focused):** Always repeat the last symbol (extend the run).  
    Problems:  
    1. ◆◆ → ? ◆ (extend ◆ run)  
    2. ▲▲▲ → ? ▲ (extend ▲ run)  
    3. ■● → ? ● (extend ● run; string becomes ■●●)  
    4. ★★◆ → ? ◆ (extend ◆ run; string becomes ★★◆◆)  
    **Predictions:** Groups will treat runs (e.g., ◆◆) as units and "grow" them.

  - **Warm-up C (Within-String-Symbols-Focused):** Cycle through the string’s symbols in order of first appearance.  
    Problems:  
    1. ◆▲ → ? ◆ (symbols: ◆, ▲; cycle ◆→▲→◆; last is ▲, so next is ◆)  
    2. ▲◆▲ → ? ▲ (symbols: ▲, ◆; cycle ▲→◆→▲; last is ◆, so next is ▲)  
    3. ■●★ → ? ■ (symbols: ■, ●, ★; cycle ■→●→★→■; last is ★, so next is ■)  
    4. ◆★◆ → ? ★ (symbols: ◆, ★; cycle ◆→★→◆; last is ◆, so next is ★)  
    **Predictions:** Groups ignore the wheel and focus on symbols in the string.

  #### **Target Problems (Ambiguous Phase)**
  All groups get these 3 problems. Answers depend on warm-up priming. **Key:** All answers are defensible, but warm-ups make one feel obvious. Conflicts arise because problems pit primed moves against others (e.g., successor vs. run extension).

  | Problem | String      | Predicted Answers by Warm-up Group                                      | Contested? Why                                                                 |
  |---------|-------------|-------------------------------------------------------------------------|--------------------------------------------------------------------------------|
  | 1       | ◆◆▲         | A: ■ (▲’s successor) <br> B: ▲ (extend ▲ run) <br> C: ◆ (cycle: ▲→◆)     | High conflict: Run vs. successor vs. cycle. Run extension and cycle ignore the wheel. |
  | 2       | ■●★         | A: ◆ (★’s successor) <br> B: ★ (extend ★ run) <br> C: ■ (cycle: ★→■)     | Medium conflict: Successor requires "leaving" the string’s symbols (◆ not present). |
  | 3       | ★▲◆         | A: ■ (◆’s successor) <br> B: ◆ (extend ◆ run) <br> C: ★ (cycle: ◆→★)     | High conflict: All moves possible, but run extension and cycle resist "traveling" the wheel. |

  **Notes:** 
  - Warm-up B’s last problem (★★◆ → ◆) intentionally previews a similar pattern to Target 3 (★★▲ → ?) to prime run extension, but the symbol change (◆ vs. ▲) creates tension.
  - Target 3 uses ★▲◆ (not ★★◆) to avoid exact warm-up repetition and amplify ambiguity.

  ---

  ### **Payoff Scheme (No Money Needed)**
  - **"Insight Points":** Groups earn points for:  
    - **Prediction Accuracy (Phase 3):** 1 point per correct prediction of another group’s answer.  
    - **Naturalness Ranking Consensus (Phase 4):** 1 point if their top-ranked answer matches the class majority in debrief.  
    Points are tallied on the board—bragging rights only. This encourages engagement without pressure.

  ---

  ### **Timeline (75 Minutes Total)**
  **0–5 min: Setup (5 min)**  
  - Split into 5 groups. Distribute wheel handouts and worksheets.  
  - **Instructions (Simple):** "You’ll solve pattern problems. For each string, decide the next symbol. Use the wheel, but there’s no single rule—discuss and record answers and reasons."

  **5–25 min: Warm-up Phase (20 min)**  
  - Give each group their warm-up cards (A, B, or C as assigned).  
  - **Groups:** Solve 4 problems (5 min for problems, 10 min discussion). **Instructor Circulates:** Nudge with, "Why did that feel right?" if groups struggle.  
  - **Expected Issue:** Warm-up C may confuse initially (cycling isn’t intuitive). Clarify: "Work with the symbols you see in the string."

  **25–40 min: Target Phase (15 min)**  
  - Give all groups identical target problem cards (◆◆▲, ■●★, ★▲◆).  
  - **Groups:** Solve and record answers/reasons. **Instructor Circulates:** Note disagreements within groups (sign of ambiguity).  
  - **Expected Issue:** Loud members may dominate. Mitigate by assigning roles (e.g., "Recorder," "Skeptic," "Timekeeper").

  **40–55 min: Prediction Phase (15 min)**  
  - Reveal: "Different groups had different warm-ups (A, B, C)." Assign predictions:  
    - Groups 1 & 2 (A): Predict Group 3 (B) on Target 1 (◆◆▲).  
    - Groups 3 & 4 (B): Predict Group 5 (C) on Target 2 (■●★).  
    - Group 5 (C): Predict Group 1 (A) on Target 3 (★▲◆).  
  - **Groups:** Discuss and record predictions on sheets. Collect all target answers for the board.

  **55–65 min: Ranking Phase (10 min)**  
  - Post all groups’ target answers anonymously on the board (e.g., "◆◆▲ answers: ■, ▲, ◆").  
  - **Groups:** Rank answers for *one* target problem (assign each group a different target) from "most natural" to "least natural" (1–3).  
  - **Payoff:** Groups earn points if their #1 rank matches the class majority later.

  **65–75 min: Debrief (10 min)**  
  - Reveal warm-up assignments and actual answers. Discuss:  
    - **Specific Moments to Highlight:**  
      - **Warm-up Phase:** "When you did four similar problems, you built a habit. What felt automatic?" (Link: Habits create "pressure" for consistency.)  
      - **Target Phase:** "Why did ◆◆▲ feel obvious to Group A (■) but not Group B (▲)? Did anyone feel torn?" (Link: "Bending" categories creates tension—e.g., run extension ignores the wheel’s successor arrow.)  
      - **Prediction Phase:** "How did you guess Group B’s answer? Did their warm-up make it predictable?" (Link: Context makes some "slips" cheap—e.g., B sticking to runs.)  
      - **Ranking Phase:** "Why was ■ ranked ‘natural’ for ◆◆▲ by some, even if not your answer?" (Link: Wheel structure makes successor a "cheap slip"; cycle/run extensions are "expensive" without priming.)  
    - **Concept Mapping:**  
      - "The ‘same’ move (e.g., ‘next symbol’) isn’t given—it bends with context."  
      - "Slips aren’t free: Successor is cheaper (fits wheel), but run extension needs priming."  
      - "Competing pressures: Wheel vs. string symbols vs. runs—context decides what wins."  
  - **End:** "This is why analogy isn’t arbitrary: Structure and history constrain what slips feel cheap."

  ---

  ### **What Will Go Wrong (and Mitigation)**
  1. **Relativist Collapse ("All answers are arbitrary"):**  
     - **Mitigation:** Use the ranking phase to show gradients (e.g., successor often ranked "natural"). In debrief, stress: "The wheel makes ■ cheaper for ◆◆▲ than a random symbol—structure matters."

  2. **Loudest Group Steamrolls:**  
     - **Mitigation:** Assign roles in groups (e.g., "Skeptic must challenge the first answer"). Circulate to ensure quieter members speak.

  3. **Warm-up C Confusion:**  
     - **Risk:** Groups may miss the cycling rule.  
     - **Mitigation:** Warm-up C’s problems are designed to build the pattern (e.g., ◆▲ → ◆). Nudge: "What symbols are in the string? What came first?"

  4. **Target Answers Deviate from Predictions:**  
     - **Risk:** Groups may break priming (e.g., Warm-up B uses successor for ■●★).  
     - **Turn into Data:** Highlight this in debrief—"Why did you break pattern? Was the slip too expensive?"

  5. **Time Shortfall:**  
     - **Mitigation:** Trim warm-up/target time if needed. Skip one ranking problem.

  ---

  ### **What the Activity Can’t Show (Need Your Voice in Debrief)**
  - **Graded, Sub-Symbolic Nature:** Real analogies involve parallel, weighted possibilities (e.g., successor and run both activate, with one winning). This activity is discrete—groups commit to one answer.  
    **Say:** "In reality, your brain tests multiple ‘moves’ at once—context weights one as ‘obvious.’ Here, you only see the outcome."

  - **Cultural/Historical Factors:** This microdomain lacks real-world stakes or history.  
    **Say:** "Outside class, analogies bend under cultural pressure (e.g., ‘virus’ for computer malware felt natural due to biology familiarity)."

  - **Creation of New Categories:** The activity selects from existing moves but doesn’t show how new categories (e.g., "reverse runs") emerge.  
    **Say:** "Analogies can invent categories—here, we only reshuffled given ones."

  - **Dynamic Feedback Loops:** In real cognition, each "slip" adjusts future slips. Here, context is fixed by warm-ups.  
    **Say:** "In life, every analogy you make retunes the system—today’s ‘expensive slip’ could be tomorrow’s habit."

  ---

  ### **Final Tips**
  - **Prep:** Print wheel handouts and problem cards. Use sticky notes for easy board posting.
  - **Energy:** Start with, "No lecture—jump in! Your gut reactions matter."
  - **Pivot:** If groups finish early, add: "For target problems, list *two* possible answers and argue which feels more natural."
  - **Output:** Debrief should end with students articulating how "obviousness" shifted—e.g., "I thought they were wrong, but their warm-up made it make sense."

  This design ensures students *feel* the context-dependence of "sameness" before naming it. The symbol wheel keeps it answerable, while warm-up/target conflicts mirror how analogies negotiate "slippage." Good luck!
