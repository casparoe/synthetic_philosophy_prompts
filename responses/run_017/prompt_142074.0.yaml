    Warm-up C:

    1. ◆▲■ -> next? ◆   (cycle: after ■ comes the first, ◆)
    2. ▲■◆ -> next? ▲   (cycle: after ◆ comes the first, ▲) [Note: the string ▲■◆: first symbol ▲, then ■, then ◆. So the cycle is ▲→■→◆→▲. So after ◆, next is ▲.]
