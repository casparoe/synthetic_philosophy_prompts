  We are designing an activity to help students experience how context (recent problems) shapes what feels like the "obvious" answer in an analogical reasoning task. The domain is a circular wheel of symbols: ◆ ▲ ■ ● ★, arranged in that cyclic order (so ◆→▲→■→●→★→◆...). Strings are sequences of these symbols.

  Key moves we want to include:
  - Successor (next symbol on the wheel) and predecessor (previous symbol)
  - Repeating a symbol vs. moving to the next one
  - Treating a run (e.g., ◆◆) as a unit
  - Growing a run instead of traveling along the wheel
  - The distinction between the entire wheel and the symbols present in a particular string

  The activity has three phases:
  1. Warm-up: Each group gets a set of problems that prime a particular way of reasoning (e.g., one group only sees problems requiring successor moves, another sees problems that require thinking in terms of run-lengths, etc.)
  2. Target problems: All groups get the same set of ambiguous problems. We expect their answers to be influenced by their warm-up.
  3. Prediction and ranking: Groups predict how other groups answered and then rank the answers for naturalness.

  After the activity, we debrief to draw out the concepts.

  **Problem Sets:**

  We'll have three types of warm-up sets (A, B, C). Since we have five groups, we can assign:
