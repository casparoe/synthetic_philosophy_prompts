    4. ◆▲■◆▲ -> next? ■   (distinct symbols: ◆,▲,■ (order of first appearance). The last symbol is ▲, so next in cycle: after ▲ is ■.)

    This primes that we are constrained to the symbols in the string and we cycle in the order of first appearance.

  **Target Problems (for all groups):**

  These are ambiguous and can be answered in multiple ways, depending on the priming.

  We'll have 3 target problems:

  1. String: ◆◆▲ -> next?
     - Successor (A): would say ■ (because ▲→■)
     - Run (B): would say ▲ (extend the run of ▲)
     - Within (C): The distinct symbols in the string: ◆ and ▲. Order of appearance: ◆,▲. The cycle: ◆→▲→◆. The last symbol is ▲, so next is ◆.

  2. String: ■●★ -> next?
     - Successor (A): would say ◆ (because ★→◆)
     - Run (B): would say ★ (extend the run of ★? But the string ends with ★, so extend by ★)
     - Within (C): distinct symbols: ■,●,★. Order: ■,●,★. Cycle: ■→●→★→■. Last is ★, so next is ■.

  3. String: ★★◆ -> next?
     - Successor (A): would say ▲ (because ◆→▲)
     - Run (B): would say ◆ (extend the run of ◆? But the last symbol is ◆, so extend by ◆ -> ★★◆◆)
     - Within (C): distinct symbols: ★,◆. Order: ★,◆. Cycle: ★→◆→★. Last is ◆, so next is ★.

  But note: the within group might also have an alternate interpretation? But we are sticking to the rule we primed.

  However, we also want to see if the warm-up affects the interpretation.

  **Prediction and Ranking:**

  After the groups have done the warm-up and the target problems, we reveal that different groups had different warm-ups. Then we assign each group to predict what another group (with a different warm-up) answered for one of the target problems.

  Then, we give all the answers that were actually given (we collect them) and ask each group to rank them for naturalness (without knowing which group gave which).

  **Payoff Scheme (non-monetary):**

  We can have a "confidence" points system. For the prediction phase, if a group correctly predicts what another group answered, they get a point. Then for the ranking phase, we can have the group that has the ranking closest to the overall naturalness ranking (as determined by the class) gets points. But we don't want to make it too competitive.

  Alternatively, we can have the payoff in terms of "insight points" that are just for fun and are tallied on the board. The goal is to encourage careful thinking, not to create high stakes.

  **Timeline (75 minutes):**

  - 0-5 min: Introduction and grouping (5 min)
    - Explain that they will be solving pattern problems in small groups. Hand out the wheel diagram to each group and explain the symbols and that the wheel is cyclic. Do not explain any rules beyond the wheel: "You'll see strings of symbols and be asked what the next symbol is. There are different ways to think about it, and you'll figure it out from the examples."

  - 5-20 min: Warm-up phase (15 min)
    - Each group gets their warm-up set (A, B, or C) and solves the 4 problems. They record their answers and the reason (if any) on a sheet.

  - 20-35 min: Target problems (15 min)
    - Each group gets the 3 target problems and solves them. They record their answers.

  - 35-50 min: Group reporting and prediction (15 min)
    - First, the instructor collects the answers for the target problems from each group (without revealing which group had which warm-up). Then, reveal that there were three different warm-up sets (A, B, C) and assign each group to predict for one target problem what a group with a different warm-up answered.
      Example: assign group 1 (A) to predict what a group with warm-up B would say for target 1, and group 2 (A) to predict what a group with C would say for target 2, etc.
    - They write down their predictions.

  - 50-65 min: Ranking naturalness (15 min)
    - The instructor writes all the answers for each target problem on the board (anonymized by group, but labeled by the answer and the warm-up type? Actually, we don't want to reveal the warm-up type yet). For each target problem, there will be several answers. The groups are then given the list of answers for one target problem and asked to rank them from most natural to least natural.

  - 65-75 min: Debrief (10 min)
    - Reveal which group had which warm-up and show how the warm-up influenced the target answers.
    - Discuss why they thought their answer was obvious, and then how the context (warm-up) set up expectations.
    - Draw out the concepts: the "same" operation (what counts as the same kind of move) depends on the recent context; the slip from one interpretation to another isn't arbitrary but constrained by the domain and the recent pressure; some slips are cheap (if they fit the current mode) and some are expensive (if they require switching mode). Also, note that in the ranking, some answers were considered more natural by the class even though they weren't the group's own, indicating that there are gradients.

  **What might go wrong:**

  1. **Relativist collapse:** They might say "it's all arbitrary, any answer is fine." To counter, in the debrief, emphasize that the answers were constrained by the warm-up and by the structure of the domain. Also, in the ranking, we'll see that some answers are consistently ranked as more natural. We can point out that the wheel structure makes successor moves more available than, say, random symbols.

  2. **Loudest group steamrolling:** During group work, one person might dominate. Mitigation: assign roles (e.g., recorder, skeptic, timekeeper) or encourage everyone to write their own answer first and then discuss.

  3. **Groups not following the prime:** They might not pick up the pattern in the warm-up. To avoid, make the warm-up problems unambiguous and repetitive. Also, during the warm-up, the instructor can circulate and nudge: "Why did you choose that? What pattern are you seeing?"

  4. **Target problems too ambiguous:** We designed them to be ambiguous, but we hope the warm-up will sway them. If a group gives an answer that doesn't match their warm-up, that's data too! We can discuss why they broke the pattern.

  **What the activity can't show:**

  - The graded, sub-symbolic nature: In real cognition, there are multiple possibilities active at once with varying strengths. This activity is discrete and symbolic.

  - The activity doesn't show the historical or cultural factors that shape analogies in the wild.

  - It doesn't show how new categories can be formed (only how existing ones are selected).

  **Debrief specific points:**

  - When they were doing the warm-up, they built a habit. Then when they saw the target, the habit was active and made one answer feel obvious. That's the "pressure" of the context.

  - But note that in the target problem, multiple answers were possible. Why did they pick one? Because the warm-up made it cheap. If they had to break the habit, that would be expensive.

  - In the ranking phase, even though they were primed, they could recognize that some answers were more natural in the abstract (e.g., successor moves might be ranked higher because of the wheel). That shows that the domain structure also constrains what is natural.

  - The slip: in the target problems, they might have felt a tension between the habit and the string. For example, in ◆◆▲, the successor group might have thought about extending the run? But they didn't because they were primed for successor. That tension is the "bending" of the categories.

  **Final Problem Sets:**

  *Warm-up A (Successor):*
    1. ◆▲ -> next? ■
    2. ▲■ -> next? ●
    3. ■● -> next? ★
    4. ●★ -> next? ◆

  *Warm-up B (Run extension):*
    1. ◆◆ -> next? ◆
    2. ▲▲▲ -> next? ▲
    3. ■● -> next? ●   (so becomes ■●●)
    4. ◆◆▲ -> next? ▲   (so becomes ◆◆▲▲)   [Note: this is also a target problem, but that's okay because in the warm-up they are doing it and then they'll see it again in the target? But we want the target to be ambiguous. Let me change the warm-up B problem 4 to a different string?]

    Change warm-up B problem 4 to: ★★◆ -> next? ◆   (so becomes ★★◆◆). Then the target problem 3 is ★★◆, so they might be primed to say ◆. But we have a target problem 3 as well. Alternatively, we can avoid overlap.

    How about for warm-up B:

    1. ◆◆ -> next? ◆
    2. ▲▲▲ -> next? ▲
    3. ■■● -> next? ●   (becomes ■■●●)
    4. ●★★ -> next? ★   (becomes ●★★★)

    Then the target problems don't overlap.

  *Warm-up C (Cycle within the string's symbols in order of first appearance):*
    1. ◆▲ -> next? ◆   (cycle: ◆→▲→◆. Last is ▲, so next is ◆ -> becomes ◆▲◆)
    2. ▲◆ -> next? ▲   (cycle: ▲→◆→▲. Last is ◆, so next is ▲ -> becomes ▲◆▲)
    3. ◆▲■ -> next? ◆   (cycle: ◆→▲→■→◆. Last is ■, so next is ◆ -> becomes ◆▲■◆)
    4. ■◆▲■ -> next? ◆   (distinct symbols: ■,◆,▲. Cycle: ■→◆→▲→■. Last is ■, so next is ◆ -> becomes ■◆▲■◆)

  *Target Problems (for all):*
    1. ◆◆▲ -> next?
    2. ■●★ -> next?
    3. ★★◆ -> next?

  **Predicted Answers by Warm-up Group:**

  For target 1 (◆◆▲):
    A: ■ (successor of ▲)
    B: ▲ (extend the run of ▲)
    C: ◆ (cycle: distinct symbols in order ◆,▲. After ▲, next is ◆)

  For target 2 (■●★):
    A: ◆ (successor of ★)
    B: ★ (extend the run of ★)
    C: ■ (cycle: distinct symbols ■,●,★. After ★, next is ■)

  For target 3 (★★◆):
    A: ▲ (successor of ◆)
    B: ◆ (extend the run of ◆)
    C: ★ (cycle: distinct symbols ★,◆. After ◆, next is ★)

  Then in the prediction phase, we assign groups to predict for a specific target and a specific warm-up type that they didn't have.

  **Ranking:**

  For each target, we'll have up to 5 answers (but some might be the same). We ask the groups to rank the answers for naturalness (without knowing which group gave which).

  **Materials:**

  - Handout: Wheel with ◆→▲→■→●→★→◆ (clockwise)
  - Warm-up problem sets on separate sheets for each group (labeled A, B, or C)
  - Target problem set on a sheet for all
  - Sticky notes or whiteboard for reporting answers.

