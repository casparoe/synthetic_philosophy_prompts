prompt: |-
  For thirty years I have kept, alongside each novel, a ledger of characters, dates, and promises made to the reader. I consult it constantly, trust it without checking, and could not finish a book without it: by every functional test I have seen proposed for counting an external store as part of a mind, it qualifies. Yet it does not feel like mine. Deprived of it I feel impeded rather than diminished; when it misleads me I feel thwarted by something other, not answerable for a failure of my own. The asymmetry runs the other way too: a continuity file compiled by a collaborator now feels more mine than the early drafts I wrote myself and no longer recognize.

  I gather that philosophers hold, on roughly those conditions — reliable availability, effortless access, automatic endorsement, and some history of having been endorsed — that such a ledger is as much a constituent of thinking as biological memory is. My case appears to meet all of them and still seems to lack whatever makes a state mine. Does this configuration have an established name, and is it treated as an objection to that view or as simply beside the point?

  A label alone will not satisfy me. I want to know which of those conditions, if any, is meant to carry ownership, and why my case shows that it does not; whether dependence and felt ownership can genuinely come apart as I have described them, or whether I have misdescribed one of the two; where the line falls between my ledger and a reference work I consult just as often and trust just as implicitly; and what my unrecognizable early drafts are a case of. If nothing established fits, say so plainly, and give the phenomenon a name, a definition, and its boundary cases.
reasoning: |-
  Hmm, the user describes a fascinating philosophical puzzle about the nature of cognitive ownership. They've maintained an external ledger for thirty years that functionally serves as part of their writing process, meeting all standard criteria for extended cognition - reliable availability, effortless access, automatic endorsement, and historical integration. Yet crucially, they report it doesn't feel "theirs" in the way biological memory does.

  The core tension here is between functional equivalence and phenomenal experience. Philosophers like Clark and Chalmers would argue the ledger qualifies as part of their mind under the "parity principle," but the user's lived experience contradicts this. When the ledger fails, they feel thwarted by an external tool rather than experiencing it as a personal cognitive failure. 

  Interestingly, the asymmetry manifests in reverse with old drafts: work products created by their biological cognition now feel alien, while a collaborator's continuity file feels integrated. This suggests ownership isn't about origin but current integration into the sense of self. 

  The key questions to address are: Why don't the functional conditions produce felt ownership? What's missing between the ledger and biological memory? How can dependence and ownership dissociate? Where's the boundary between cognitive extension and mere tool use? And what explains the estrangement from early drafts?

  Potential explanations could include: 
  - The lack of pre-reflective access (the ledger requires deliberate consultation unlike involuntary memories)
  - Absence of affective coloring (biological memories carry emotional resonance)
  - Missing metacognitive feelings (we "just know" internal memories without verification)
  - The ledger's modularity versus memory's interconnectedness

  For boundary cases: A reference book differs through lack of personal curation history. Early drafts suffer from psychological continuity disruption - they're cognitively orphaned outputs. 

  This suggests ownership requires what phenomenologists call "mineness" - the first-personal givenness of experience. The ledger meets third-person functional criteria but lacks the first-personal incorporation. Perhaps we should call this "cognitive alienation" - functional integration without phenomenal identification.
answer: |-
  This is a profound case study that cuts to the heart of debates about extended cognition, phenomenal ownership, and personal identity. Your experience reveals genuine tensions in philosophical accounts, and no single established term fully captures this configuration. Here's a systematic analysis addressing each of your questions:

  ### 1. **Core Phenomenon & Its Name**
     - **Proposed Name**: **Functional Integration without Phenomenal Mineness (FIPM)**  
     - **Definition**: A state where an external resource meets functional criteria for cognitive extension (reliable availability, automatic trust, historical endorsement, task-constitutive dependence) yet lacks the *phenomenal quality of first-personal ownership* – the pre-reflective sense of "me-ness" characterizing internal states.
     - **Boundary Cases**:
       - *Integrated Extension*: A well-worn prosthetic limb used automatically; feels "like part of me."
       - *Mere Tool*: A trusted reference book consulted often but requiring deliberate effort; no sense of cognitive incorporation.
       - *Your Ledger*: Functionally integrated but alienated from the sense of self.

  ### 2. **Why Standard Conditions Fail to Confer Ownership**
  Your case undermines the assumption that functional integration *entails* phenomenal ownership. The conditions philosophers emphasize (Clark & Chalmers' "parity principle," Menary's "cognitive integration") address *causal-functional* roles, not subjective experience:

  | **Condition** | **Why It Doesn't Guarantee "Mineness"** |
  |---------------|------------------------------------------|
  | Reliable Availability | Ensures access, not identity. Like owning a car vs. *being* a driver. |
  | Effortless Access | Habitual use ≠ self-incorporation (e.g., muscle memory in a tool). |
  | Automatic Endorsement | Trust is epistemic, not ontological. You trust a GPS without feeling *it is you*. |
  | Historical Endorsement | Past use creates dependence, not identity (cf. estranged early drafts). |

  **The Missing Element**: **Pre-reflective Self-Ascription** – Biological memory involves raw feels (e.g., recalling a memory *as yours* before you think about it). The ledger lacks this immediacy; its contents are *processed* rather than *lived*.

  ### 3. **Dependence vs. Ownership: Can They Diverge?**
  Yes, your description is coherent and reveals a crucial distinction:
  - **Dependence**: "I feel *impeded* without it."  
    → The ledger is a *scaffold*: disabling it disrupts function but not core selfhood.
  - **Ownership**: "I feel *diminished* by biological memory loss."  
    → Internal memory is *constitutive*: its loss erodes the self.
    
  This mirrors Heidegger's tool analysis: the ledger is "ready-to-hand" (transparent in use) but not "existentially owned."

  ### 4. **The Ledger vs. Reference Work Boundary**
  The difference lies in **personalized curation** and **task-constitution**:
  - **Your Ledger**: 
    - *Authored by you* for your specific creative process.
    - *Constitutive* of narrative continuity (you "cannot finish a book without it").
    - *Procedurally embedded* (constant consultation is seamless).
  - **Reference Work**: 
    - *Generic* content, not tailored to your cognition.
    - *Adjunct* to thought (supports but doesn't constitute your mental states).
    - *Context-dependent* trust (you verify its authority periodically).

  ### 5. **Unrecognizable Early Drafts: A Case of...**
  This is **Cognitive Disownership through Temporal Alienation**:
  - The drafts were once "yours" but now lack **autobiographical coherence** with your current self.
  - Unlike the ledger (external-but-functional), these are *internal outputs* that no longer resonate with your identity narrative.  
  - **Key Mechanism**: Shifts in your **self-narrative schema**. Current selfhood rejects past outputs as incompatible with your present creative identity ("not me anymore").

  ### Philosophical Implications
  - **Objection to Extended Mind?** Yes, but only to *strong* claims that functional parity implies phenomenal incorporation. Your case shows cognition can be *hybrid*: partly extended, partly bounded.
  - **Why Philosophers Miss This**: Analytic traditions prioritize functional criteria; phenomenology (e.g., Zahavi) tackles "mineness" but rarely applies it to external tools.
  - **Resolution Path**: Accept a **two-layer model**:
    1. **Subpersonal Cognitive Extension** (ledger as functionally part of your writing system).
    2. **Personal Phenomenal Ownership** (lacking for the ledger, present for biological memory).

  ### Conclusion
  Your ledger exemplifies **FIPM**: a state functionally integral to cognition yet phenomenally alien. This isn't a flaw in the extended mind theory but highlights its scope—it describes cognitive *processing*, not subjective *identity*. The dissociation you observe arises because:
  - **Ownership requires affective-embodied integration** (biological memory is felt in the body; the ledger isn't).
  - **Selfhood is narratively constructed** (the ledger supports your current narrative but isn't part of your *history of self*).

  This configuration isn't "beside the point"—it forces a refinement of cognitive theories to account for the lived experience of the thinker. You've identified a genuine lacuna: the *phenomenology of cognitive extension*.
