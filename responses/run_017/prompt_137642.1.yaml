answer: |-
  Here’s a comprehensive exam question, model answer, and marking scheme tailored to your requirements:

  ### Exam Question
  **Dr. Helena Vance, a 20th-century neo-Malthusian, reformulates the core principle as follows: "Human systems will inevitably encounter a binding resource constraint, where aggregate demand (measured in ‘consumption units’ weighted by energy and material intensity) outpaces regenerative biocapacity. This constraint triggers corrective mechanisms—famine, conflict, or economic collapse—that restore equilibrium. The timing and spatial scale of this rupture are indeterminate, as innovation and substitution can temporarily shift the constraint to new resources (e.g., from arable land to phosphorus, then to lithium, then to stable climate)."**

  **Evaluate Vance’s reformulation. Is this a *degenerating research programme* (Lakatos), an *unfalsifiable tautology* (Popper), or does it retain scientific value as a *genuine dynamic constraint* analogous to a budget identity? In your analysis, address how Vance employs re-dating, re-scaling, and re-description of variables. Crucially, specify what empirical or conceptual commitments would be needed for Vance’s claim of being ‘right but early’ to constitute more than a face-saving maneuver. (25 marks)**

  ---

  ### Model Answer (Approx. 600 words)
  Vance’s reformulation of Malthusianism exemplifies how failing long-run predictions are often rescued through three moves: re-dating (indeterminate timing), re-scaling (shifting resource constraints across planetary systems), and re-description (from "subsistence" to dynamic "consumption units" and "biocapacity"). While framed as a "dynamic constraint," this reformulation risks degenerating into unfalsifiable tautology unless anchored to concrete empirical thresholds.  

  Vance’s model functions as a **degenerating research programme** (Lakatos) in its current form. By making timing "indeterminate" and the binding resource infinitely substitutable, she immunizes the core claim against falsification by *any* finite run of prosperity. The demographic transition or Green Revolution become mere delays, not refutations. Re-scaling to planetary boundaries (e.g., climate) further postpones the deadline, while re-description ("consumption units") obscures testable definitions. Vance’s "corrective mechanisms" (famine/conflict/collapse) are so broad that any crisis (e.g., the 1973 oil shock) can be retrofitted as confirmation, yet no specific prosperity (e.g., post-1950 GDP growth) can refute it. This mirrors Lakatos’s "degenerating programme," where ad hoc adjustments replace novel predictions.  

  However, Vance’s model isn’t purely tautological. It echoes a **budget constraint identity**: total consumption ≤ regenerative capacity + drawdown of stocks. Like an overdraft, humanity can deplete natural capital temporarily, but sustained deficit incurs compounding "interest" (e.g., biodiversity loss, carbon accumulation). This framing has value in modeling ecological economics (e.g., Rockström’s planetary boundaries). Yet for it to transcend accounting and function as a *predictive* theory, Vance must specify:  
  1. **Non-arbitrary thresholds**: Define *in advance* the depletion rate (e.g., >150% of biocapacity for 20 years) that *must* trigger collapse.  
  2. **Irreducible constraints**: Identify resources for which substitution is impossible (e.g., freshwater in specific basins, stable climate at +2°C).  
  3. **Mechanistic specificity**: Detail *how* "corrective mechanisms" operate—e.g., predict whether lithium shortages cause recessions or wars, under what conditions.  

  Without these commitments, "right but early" is mere face-saving. Vance’s claim that innovation only "temporarily" shifts constraints lacks criteria for "temporary." If 200 years of avoided famine (1750–1950) doesn’t falsify Malthus, what duration would? Similarly, re-describing "subsistence" as "consumption units" voids Malthus’s original link to caloric survival. When Vance claims a lithium shortage validates Malthusianism as surely as grain shortages would have, she conflates price signals (which incentivize substitution) with Malthus’s positive checks (which reduce population). This equivocation transforms a testable theory into an untestable narrative.  

  For Vance’s model to be a *progressive* research programme, it must generate *novel predictions*—e.g., "Regions exceeding X material footprint per capita will experience state collapse within Y years without degrowth policies." Absent such forecasts, it remains a post-hoc accounting framework, not a predictive theory of societal collapse. The demographic transition refuted Malthus by breaking the population-income link; Vance sidesteps this by redefining the crisis as ecological rather than demographic. While planetary boundaries are real, Vance’s evasion of deadlines reduces her model to an unfalsifiable prophecy of doom.  

  ---

  ### Marking Scheme (25 points total)
  **Must-hit moves** (Aim for 5/5 to score 20+; missing one caps at B+):  
  1. **Identify Vance’s rescue moves** (4 pts):  
     - Re-dating: "Indeterminate timing" (1 pt)  
     - Re-scaling: "Planetary boundaries," shifting resources (1 pt)  
     - Re-description: "Consumption units," "biocapacity" (2 pts)  
     *Common botch: Lists moves without linking to Vance’s text.*  

  2. **Classify degeneracy/tautology/constraint** (6 pts):  
     - Degenerating programme (Lakatos) for immunizing core theory (2 pts)  
     - Not purely tautological (budget identity analogy) (2 pts)  
     - Distinguishes accounting (constraint) from prediction (2 pts)  
     *Common botch: Only labels it "Popperian unfalsifiable" without nuance.*  

  3. **Apply deadline test** (6 pts):  
     - Notes no finite prosperity can falsify Vance (2 pts)  
     - Specifies required commitments: thresholds, irreplaceable resources, mechanistic links (4 pts; 1.3 pts each)  
     *Common botch: Vaguely says "it needs deadlines" without concrete examples.*  

  4. **Critique "right but early"** (5 pts):  
     - Explains why duration (e.g., 200 years) or substitution (e.g., lithium for grain) voids falsifiability (3 pts)  
     - Contrasts Vance’s "consumption units" with Malthus’s subsistence (2 pts)  
     *Common botch: Claims Vance is "still correct" without addressing evasion.*  

  5. **Epistemic verdict** (4 pts):  
     - Concludes it’s degenerative *unless* novel predictions/thresholds are added (2 pts)  
     - Distinguishes ecological accounting from Malthusian prediction (2 pts)  
     *Common botch: Advocates for Vance’s model as "warnings" without scientific critique.*  

  **Penalties**:  
  - Caps at **B (16 pts)** if only sorts moves into Popper/Lakatos boxes without deadline test analysis.  
  - **A (21+ pts)** requires explicit thresholds/irreducible resources (Move 3).  

  **Grade boundaries**: 21-25=A, 18-20=B+, 15-17=B, 12-14=C+, <12=D/F.  

  ---  
  This question forces engagement with *how* predictions evade falsification while challenging students to salvage epistemic integrity. The marking scheme rewards specificity on thresholds and penalizes box-ticking classifications.
