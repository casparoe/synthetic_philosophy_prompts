  For the marking scheme, I will allocate points across five key moves: identifying Vance's modifications, analyzing the rescue strategies, applying the deadline test, evaluating falsifiability, and discussing epistemic integrity. Common mistakes might include just listing the three moves without deeper analysis or conflating Vance's theory with Malthus's original. 

