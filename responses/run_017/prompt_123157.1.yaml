  ok so me and my roommate Dan got into a 3 hour argument last night about the Death in Damascus setup and got absolutely nowhere, so I want an outside opinion with actual numbers in it. The version we were fighting about: you're in Damascus, at midnight Death will be in exactly one city (Damascus or Aleppo), you die iff you're in the same city as him, and you can either stay or take the road to Aleppo — the road is unpleasant but survivable and staying has some small positive value to you, so if the two options come out exactly equal you stay. Death predicted yesterday which of the two things you'd do and is now in the city matching that prediction. He's 90% accurate conditional on each thing you might do, i.e. P(predicts stay | you stay) = P(predicts flee | you flee) = 0.9. And you're the sort of person who stays, base rate 0.9, so I make it 0.82 that he predicted you'd stay. My calc: read causally, the prediction is already fixed and not up to you, so P(die | stay) = 0.82 and P(die | flee) = 0.18 and you should run for Aleppo; read evidentially, both acts come out at 0.9 and you might as well stay. That this is Newcomb's problem with the sign flipped — evidential reasoning is the optimistic one there and the hopeless one here — is what got us going in the first place.

  Dan's big move was that all of this rests on your being ignorant of your own decision, and that a properly rational agent who can see what it's about to do ends up in the self-undermining loop where each option looks better conditional on you not taking it. He thinks that kills the causal verdict; I think he's smuggling the self-prediction debate in form the Newcomb literature and it shouldn't get to count here. I'm at about 0.6, Dan is at about 0.25.

