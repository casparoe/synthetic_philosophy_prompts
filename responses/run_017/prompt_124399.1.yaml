answer: |-
  ### Case Construction
  **Scenario**: Dr. Lena, a seasoned geologist, has conducted extensive fieldwork and verified through multiple independent methods that the local volcano is dormant (p: "the volcano is dormant"). Her evidence is overwhelming and meets all scientific standards. However, Lena recently survived a traumatic volcanic eruption elsewhere, causing a visceral, uncontrollable anxiety that prevents her from forming any belief about volcanic activity, despite her intellectual acceptance of the evidence. She knows p (relying on a reliabilist externalist account: her methods are truth-conducive, her evidence is robust, and p is true, so she satisfies justification, truth, and reliable process conditions). Her lack of belief is not partial, self-deceptive, or weak-willed; it is a complete absence of doxastic commitment due to trauma-induced inhibition. Lena is epistemically blameless—she rigorously followed protocols, sought peer review, and cannot be faulted for her trauma. A colleague observing her work and anxiety can naturally remark, "Lena knows the volcano is dormant but doesn't believe it." Yet, if Lena asserts, "The volcano is dormant, but I don't believe it," it sounds absurd to ordinary hearers.

  **Mechanism**: Trauma-induced cognitive inhibition blocks belief formation while preserving externalist knowledge. This is not hesitant belief because Lena lacks any credence or affirmation toward p; she acknowledges the evidence but cannot psychologically endorse p as true, akin to a phobic response overriding rational processing.

  ### Verification Against Specifications
  - **Knows p (reliabilist externalism)**: Lena’s evidence-gathering was reliable (repeated tests, peer-verified), truth-tracking, and conclusive.
  - **Lacks belief p**: The trauma creates a flat inability to form belief, distinct from weakness of will (no conflict of intentions) or self-deception (no motivated avoidance).
  - **Blamelessness**: Her trauma is involuntary; she upheld epistemic duties (thorough testing, consultation).
  - **Third-person felicity**: The colleague’s description is natural, reflecting Lena’s expertise versus her psychological state.
  - **First-person absurdity**: The utterance remains absurd due to assertion’s commitment (detailed below), not third-party stipulation.

  ### Verdicts by Theory
  - **Doxastic account**: Fails to explain absurdity. Lena holds no contradictory attitudes—she knows p (externally) and truly lacks belief p—so there is no irrational "belief + lack of belief" state to cause absurdity. The account cannot ground the paradox here.
  - **Knowledge norm of assertion**: Struggles, as Lena knows p (reliabilism) and knows she lacks belief p (introspection). Asserting the conjunction should be permissible (both conjuncts known), yet it feels absurd. The norm does not capture why conjoining them is problematic.
  - **Commitment/scoreboard account**: Explains the absurdity best. Asserting p commits Lena to believing p (as assertion updates the conversational "scoreboard" to reflect speaker commitment). Conjoining "I don’t believe p" directly negates this commitment, creating pragmatic incoherence. The absurdity arises from the act’s constitutive norms, not Lena’s psychology.

  ### Critical Analysis
  - **Load-bearing feature**: The trauma-induced disconnect between externalist knowledge and internal belief. Externalism allows knowledge without belief, while trauma cleanly severs doxastic commitment.
  - **Ablation**: If trauma is removed, Lena believes p, collapsing into a standard Moorean case (irrational "p + ¬belief p" attitudes). If externalism is rejected, knowledge entails belief, making (1) and (2) incompatible and voiding the case.
  - **Best doxastic reply (stronger than entailment)**: Assertion expresses belief, so Lena’s utterance of p expresses belief in p, rendering "I don’t believe p" contradictory at the speech-act level. This is not merely about attitude incoherence but about the self-refutation inherent in asserting p while denying belief in it. However, this reply covertly adopts the commitment account’s machinery, conceding that the absurdity stems from assertion norms, not attitudes alone. It also fails because expression is not factive: asserting p may conventionally implicate belief without requiring Lena to actually hold it, and her context (trauma) suspends this implication for third parties.

