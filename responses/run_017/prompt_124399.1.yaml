  We are constructing a case to pressure the doxastic account of Moore's paradox, which holds that the absurdity of asserting "p and I don't believe that p" arises from the irrationality of simultaneously believing p and not believing p. We want a scenario where a speaker knows p but does not believe p (in a robust sense) and yet cannot felicitously utter the Moorean sentence, even though she is epistemically blameless and the third party can describe her as knowing without believing. The mechanism for knowledge without belief should be clear and not one of the excluded types (like self-deception, etc.).

  **Proposal: The Case of the Expert Witness**

  Consider Dr. Aris, a forensic scientist who has just completed a complex DNA analysis in a criminal case. The evidence, which she has meticulously examined and cross-checked using standard protocols, conclusively establishes that the defendant was at the crime scene (p: "the defendant was at the crime scene"). Dr. Aris knows p (in the sense of having a justified true belief, but we will challenge the belief component). However, Dr. Aris has recently been through a traumatic experience: her own brother was wrongfully convicted based on what turned out to be contaminated DNA evidence. This has led to a deep-seated, visceral distrust of DNA evidence in criminal trials, despite her professional expertise and the current evidence being uncontaminated. She cannot bring herself to form the belief that p. This is not mere weakness of will or self-deception; she explicitly acknowledges the strength of the evidence and her own thoroughness, but her emotional block prevents the formation of belief. She is blameless because her trauma is a psychological condition beyond her control and she has done everything required by her epistemic duties. A colleague, aware of the evidence and her trauma, can truthfully say, "Dr. Aris knows the defendant was there, but she doesn't believe it." Yet, if Dr. Aris were to say, "The defendant was at the crime scene, but I don't believe that," it would sound absurd to an ordinary hearer.

  **Mechanism for Knowledge without Belief**: The mechanism is a deep emotional block (trauma-induced cognitive inhibition) that prevents the formation of belief despite possession of evidence that justifies knowledge. This is not hesitant or partial belief because she does not hold the attitude of belief at all towards p. She has a strong conviction in the evidence and the process (so she knows), but the emotional trauma blocks the formation of the belief that p.

  **Meeting the Specifications**:

  1. **Knows that p**: We rely on a standard externalist account of knowledge (e.g., reliabilism or a virtue-theoretic account). Dr. Aris has a true belief? Wait: we are denying she has the belief. So we must adjust. We can use an externalist account that does not require belief as a mental state but rather as a disposition to act or as a normative status. Alternatively, we can note that in this case, the justification and truth conditions are met, and the only thing missing is the belief component because of the trauma. But if knowledge requires belief, then she doesn't know. So we must avoid the entailment. Instead, we can rely on a functionalist or externalist account that separates knowledge from the internal mental state of belief. For example, in virtue epistemology, knowledge is a success from intellectual virtue. Dr. Aris's cognitive faculties are functioning virtuously (she has done the analysis correctly) and she has formed a true representation (she would report the results as true in a professional context, but not in a personal one). However, the problem is that belief is typically taken as necessary. Alternatively, we can use a contextualist or pragmatic account of knowledge attribution. The colleague's attribution of knowledge is appropriate because, in the context of the professional community, Dr. Aris has all the markers of knowledge: she has the evidence, she can defend it, and she is right. But internally, she lacks belief. This is a tricky point. Alternatively, we can use the idea that knowledge is a state that is appropriately responsive to the truth, and in this case, Dr. Aris is in that state (she has a justified true representation that she can use in her professional work) but without the accompanying feeling of conviction. This is a form of knowledge without belief? Not obviously. Let me reframe.

  Another approach: use the concept of "alief" versus "belief". But that might be too controversial. Alternatively, we can say that she has a belief in a thin, dispositional sense (she is disposed to act professionally as if p is true) but not in a thick, affective sense. However, the specification requires that it is not partial or half-hearted. We must avoid that.

  Alternatively, we can rely on a distinction between two kinds of belief: one that is purely cognitive and one that is affective. But that might not hold water.

  Perhaps we should choose a different case. Let me think of another.

  **Alternative Case: The Superstitious Scientist**

  Dr. Vega is an astrophysicist who has calculated, based on the latest data and well-established theories, that a particular asteroid will not hit Earth (p: "the asteroid will not hit Earth"). She has checked her calculations multiple times and they are correct. She knows p in the sense of having a justified true belief (but again, we need to avoid belief). However, Dr. Vega was raised in a culture that deeply believes in astrological prophecies, and she has a superstitious fear that the asteroid might hit despite the science. She cannot shake off the feeling that it might hit, even though she knows rationally that it won't. But this superstitious fear prevents her from forming the belief that p. She is blameless because she has done all she can to overcome her superstition and her scientific work is impeccable. A colleague can say, "Dr. Vega knows the asteroid won't hit, but she doesn't believe it." But if Dr. Vega says, "The asteroid won't hit, but I don't believe that," it sounds absurd.

  But here, we might say she has a partial belief or is self-deceived. We need to avoid that.

  **Another Idea: The Implicit Bias Case**

  Dr. Kim, a sociologist, has conducted a rigorous study showing that implicit bias does not play a significant role in hiring decisions in a particular context (p: "implicit bias does not significantly affect hiring in context C"). She knows p (by standard scientific criteria). However, Dr. Kim has a strong personal commitment to social justice and has been involved in activism against implicit bias. This commitment creates a cognitive dissonance such that she cannot form the belief that p, even though she accepts the methodology and results of her study. She is blameless because she has followed the scientific method and her personal commitment is not epistemically irresponsible. A colleague can say, "Dr. Kim knows that implicit bias isn't a big factor here, but she doesn't believe it." But if Dr. Kim says, "Implicit bias isn't a big factor here, but I don't believe that," it sounds absurd.

  But again, we might think of this as self-deception or partial belief.

  **Revised Expert Witness Case with Externalist Knowledge**:

  Let's stick with Dr. Aris but adjust the epistemology. We can rely on an externalist account of knowledge that does not require the internal mental state of belief. For example, in Fred Dretske's relevant alternatives theory, knowledge is an information-carrying state. Dr. Aris's analysis carries the information that the defendant was at the crime scene (it is a reliable indicator of the truth). She has access to this information and can use it in her professional capacity. But because of her trauma, she does not subjectively believe it. This is knowledge without belief because the information is in her cognitive system and she can retrieve it and use it appropriately, but she does not have the subjective conviction. The colleague attributes knowledge because of the externalist conditions. This is controversial, but it has been defended in the literature (e.g., by Dretske).

  **Specifications**:

  1. **Knows p**: Externalist sense (reliabilism or information-theoretic). The evidence is reliable and she has accessed it, so she knows.
  2. **Does not believe p**: The trauma blocks the formation of the subjective attitude of belief.
  3. **Blameless**: She has done her job correctly and the trauma is not her fault.
  4. **Third-person felicity**: The colleague can naturally say she knows without believing.
  5. **First-person absurdity**: If she utters the Moorean sentence, it sounds absurd because of the commitment of assertion.

  **Mechanism**: Trauma-induced blockage of belief formation. This is not hesitant belief because she has no degree of belief in p; she is certain of the evidence but cannot form the belief about the defendant.

  **Verdicts**:

  - **Doxastic account**: The doxastic theorist would say that the absurdity of the Moorean utterance comes from the irrationality of simultaneously believing p and not believing p. But in this case, Dr. Aris does not believe p (by stipulation), so she does not have the contradictory beliefs. So why is her utterance absurd? The doxastic account cannot explain it because there is no irrational combination of attitudes.
  - **Knowledge norm of assertion**: According to this, one should assert only what one knows. Dr. Aris knows p (by externalist lights), so she can assert p. But when she asserts the conjunction, she also asserts that she doesn't believe p. But she does not know that she doesn't believe p? Actually, she might know that she doesn't believe p. But the problem is that the assertion of the whole conjunction might violate the knowledge norm because she cannot know the conjunction? Why? Because if she knows p and knows that she doesn't believe p, then she knows the conjunction. So it should be assertible. But it sounds absurd. So the knowledge norm does not explain the absurdity.
  - **Commitment account**: On this view, asserting p commits the speaker to believing p. So when she asserts the conjunction, she commits to believing p (by the first conjunct) and also asserts that she does not believe p (the second conjunct). This is a commitment conflict: she is committed to something and at the same time denies that she has that commitment. This is what generates the absurdity. This account fits because the absurdity arises from the act of assertion and its commitments, regardless of the speaker's actual mental states.

  **Load-Bearing Feature**: The key feature is the separation of knowledge and belief via an externalist account of knowledge and a trauma-induced blockage of belief. This allows the third-party attribution of knowledge without belief and the first-person absurdity.

  **Ablation**: If we remove the trauma-induced blockage (say, if she did believe p), then the case collapses into a standard Moorean scenario where the speaker both believes p and doesn't believe p (which is impossible) or into a scenario where she believes p and the absurdity is explained by the doxastic account. But if she does believe p, then she does have the contradictory attitudes? Not necessarily: she might believe p and also believe that she doesn't believe p? But that's a higher-order irrationality. Our case avoids that by having her not believe p and know that she doesn't believe p.

  **Best Doxastic Reply**: The strongest reply is not just that knowledge entails belief (which we are denying by using externalism) but that the very notion of knowledge without belief is incoherent. Even if we accept externalism, the act of assertion requires belief. So when Dr. Aris asserts p, she must believe p (or at least, she represents herself as believing p). Therefore, in the act of asserting the first conjunct, she is representing that she believes p, but then she denies it in the second conjunct. This is a contradiction in what she is representing, not in her mental states. But note: this reply is actually moving towards the commitment account. The doxastic theorist might also argue that in the case as described, Dr. Aris does have a belief that p (a dispositional belief) because she acts on it professionally. For instance, she signs the report and testifies in court that p. This would mean that she does believe p, and her feeling of not believing is just a mistaken higher-order belief. Then the absurdity of the Moorean sentence is explained by the fact that she does believe p but says she doesn't. But we stipulated that she does not believe p. So the doxastic theorist must argue that the stipulation fails because belief is tied to action. This is a strong reply: if she acts as if p is true, then she believes p. Therefore, she does believe p, and the case fails. But note: we can adjust the case so that she does not act on p in her personal life. For example, she might refuse to testify because of her trauma, even though she knows the evidence is solid. Or she might testify but with great internal conflict. The colleague might still attribute knowledge, but the belief is missing. This is tricky.

  **Even Stronger Reply**: The doxastic theorist might argue that the absurdity of the Moorean sentence is not due to the speaker's actual mental states but due to what the speaker represents about her mental states. In other words, the utterance "p and I don't believe p" is absurd because it represents the speaker as both believing p (by asserting p) and not believing p (by the second conjunct). This is a contradiction in what is represented, and it is independent of the speaker's actual mental states. This reply is strong because it accounts for the absurdity even in cases where the speaker does not have the contradictory attitudes. But note: this is essentially the commitment account. So the doxastic theorist might co-opt the commitment account and say that the irrationality is in the act of assertion, not in the attitudes. But then they are abandoning the doxastic account.

  Alternatively, the doxastic theorist might insist that in any case where the speaker knows p, she must believe p, and so the case is impossible. They might reject the externalist account of knowledge and insist on an internalist one that requires belief. This is the standard reply. But we are asked for something stronger.

  **Strongest Reply**: The strongest reply is to challenge the possibility of the scenario. The doxastic theorist can argue that the functional role of knowledge requires belief. Specifically, if Dr. Aris is able to use p in practical reasoning (e.g., in her professional work), then she does believe p. Her feeling of not believing is a separate, higher-order state that might be irrational, but it doesn't negate the first-order belief. Therefore, the case actually involves a belief that p and a higher-order belief that she does not believe p, which is irrational. Then the absurdity of the Moorean sentence is explained by the doxastic account. This reply is strong because it turns the case into a standard Moorean paradox of the form "p and I believe that not-p" or "p and I don't believe that I believe p" — both of which are well-known variants. But note: we stipulated that it is not a case of self-deception or weakness of will. However, the doxastic theorist might say that it is a case of self-deception: she believes p but also believes that she doesn't believe p. This is a form of self-deception. Therefore, the case violates condition (2) and (3). This is the strongest reply: the case is not possible as described because the subject must believe p if she knows p and uses p in her reasoning, and the only way she wouldn't is if she has contradictory beliefs (which would be irrational and blameworthy).

  **Conclusion**: The case is designed to pressure the doxastic account by presenting a scenario where the absurdity of the Moorean sentence persists without the irrational combination of attitudes. The commitment account handles it naturally. The doxastic theorist's strongest reply is to deny the separation of knowledge and belief and to argue that the subject does believe p (despite her protestations) because of her behavior, and that the case is actually one of self-deception or higher-order irrationality.

