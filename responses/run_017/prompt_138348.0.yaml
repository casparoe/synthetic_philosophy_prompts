  - Must withstand redescribed skepticism (case: permanent-seeming deception)
  - Must state falsification conditions (case: definitional immunity)

  Then their original tests:
  - Reversal test (negating premises to check robustness)
  - Deformation test (checking sensitivity to practice variations)

  For structural requests:
  - Mark each requirement negotiable/non-negotiable
  - Note where requirements conflict (e.g., Stroud's squeeze between verificationism and modesty)
  - Identify which requirement excludes most arguments

  I consider how to map these into seven items. The first six will cover requirements with:
  1) Skeptic-accessible starting point (non-negotiable; case: avoiding question-begging)
  2) Non-contingent necessity (negotiable; case: cognitive limitations)
  3) Distinct from abduction (non-negotiable; case: vocabulary inflation)
  4) Mind-independence (non-negotiable; case: Berkeleyan collapse)
  5) Scenario-redescription robustness (non-negotiable; case: deceiver variations)
  6) Falsifiability (non-negotiable; case: definitional immunity)

  Their reversal and deformation tests can be integrated into existing requirements rather than separate items to stay within seven. The reversal test fits naturally with falsifiability (item 6), while deformation aligns with non-contingency (item 2).

  For conflicts: The Stroud squeeze appears between requiring necessity (item 2) while avoiding idealism (item 4) - creating tension between strong modal claims and mind-independence.

  For the seventh item: The falsifiability requirement (item 6) does the heaviest exclusionary work, disqualifying arguments like Putnam's brain-in-vat which can't specify failure conditions.
answer: |-
  1. The starting point must be genuinely available to the sceptic, such as the occurrence of apparent experience, without implicitly presupposing external objects (e.g., describing "experience" as *of* tables begs the question). This is non-negotiable; else the argument assumes its conclusion.  
  2. The necessity claimed must not reduce to contingent facts about human cognition or neurology (e.g., arguing we *evolved* to perceive space doesn't entail spatiality's necessity). This is negotiable; a weaker necessity may suffice if grounded in practice.  
  3. The argument must be distinguishable from inference to the best explanation by demonstrating strict indispensability, not mere utility (e.g., claiming concepts require objects because they "best explain" unity ignores alternatives like systematic illusion). This is non-negotiable; otherwise it collapses into abduction.  
  4. The conclusion must entail mind-independent objects, not merely a "phenomenal" domain (e.g., Kant’s empirical realism fails if space is only a form of intuition). This is non-negotiable; else it concedes idealism.  
  5. The argument must resist reformulation within the sceptic’s favoured scenario (e.g., a deceiver supplying coherent, persistent-seeming data must still require *that which* enables deception’s coherence). This is non-negotiable; else it ignores redescribed scepticism.  
  6. The argument must specify conditions under which its conclusion would fail (e.g., "if no stable objects existed, re-identification would be impossible" – falsifiable if re-identification occurs without objects). This is non-negotiable; unfalsifiability makes it tautological. Integrating your reversal test: negating the premise (e.g., "experience doesn’t require objects") must not allow the same derivation to yield "objects don’t exist," exposing premise-dependence. Your deformation test aligns with (2): if removing memory leaves the conclusion intact, it signals logical, not transcendental, necessity.  
  7. Requirement (6) excludes the most candidates: Putnam’s BIV argument fails as it cannot state when "I am not a BIV" is false given its semantic externalism; similarly, Davidson’s triangulation avoids falsifiability by making belief in objects constitutive of interpretation.
