prompt: |-
  I'm an MA student in philosophy, currently in a seminar on computation and rationality, and I'm trying to write a paper on whether computational hardness results can do genuine philosophical work — whether they tell us something about the world and about what an ideal agent could be, or only something about how small and slow creatures like us happen to be. What I'm missing isn't more references; I have the standard ones already. What I'm missing is the shape of the argument, so I'd be grateful for an explanation rather than a survey of who has said what. Please answer in American English, and please pitch it at this level: I've taken one course in computability and logic and one in philosophy of mind, so you can use terms like NP-completeness, polynomial-time reduction, worst-case versus average-case, and functionalism without defining them from scratch, but please don't assume I know anything beyond the elementary results.

  Here is the distinction I keep circling around and can't state properly on my own. Call a computational limitation *contingent* if it is removed by giving the agent more of what it already has — more time, more memory, faster hardware, more processors working in parallel — while leaving the description of the task untouched. Call it *structural* if no amount of more-of-the-same helps, because the cost of the task grows with the size of the input in a way that outruns any resource you could plausibly scale, so that the obstacle looks like a feature of the shape of the task rather than of the agent. My working gloss is that only structural infeasibility could constrain an ideal agent or a normative theory of rationality; contingent infeasibility is, I want to say, merely a fact about us, of a piece with the fact that we can't keep seven arbitrary digits in mind at once.

  I think that gloss is too quick, for two reasons I can see and presumably others I can't. First, a hardness result is a worst-case claim about a formal problem, and worst-case hardness is not typical hardness: there are problems that are computationally intractable in general but which actual solvers dispatch almost all the time, so "this is hard" seems to be a claim about a distribution over instances and a class of algorithms, not about reality. Second, there is what I've started calling *the approximation dodge*: faced with a hardness result, you quietly replace the original task with a nearby one — settle for an approximation, use a heuristic, restrict attention to instances of the kind the environment actually serves up — and then announce that the limit has been overcome. I can't tell whether that move is a legitimate re-description of what the task really was all along, or a philosophical sleight of hand that lets a theory escape every empirical check.

  So here is what I'd like explained. What would have to be true for a hardness result to be philosophically load-bearing rather than merely biographical — and, concretely, how should I think about the two cases my seminar keeps returning to? The first is the objection that if some mental capacity we attribute to agents requires solving an intractable problem, a computational theory of that capacity is empirically inadequate, and the standard reply that real systems use heuristics and meet only structured instances. The second is the objection that norms like full Bayesian updating or belief-revision over an unbounded space of hypotheses violate the thought that ought implies can, and the reply that normative theories are allowed to idealize. In each case I want to know whether the limitation at issue is contingent or structural in my sense, whether my sense survives the two worries above, and where, if anywhere, the distinction simply breaks down and turns out to be a false dichotomy. A single worked example traced all the way through would help me more than a general discussion, and please be willing to tell me if the distinction I've drawn is the wrong one to be drawing.
reasoning: |-
  Okay, let me try to unpack this MA student's dilemma. They're wrestling with whether computational hardness results have genuine philosophical weight or just reflect human limitations. The core tension is between what they call "contingent" versus "structural" limitations - can we scale our way out of a problem, or is it fundamentally baked into reality?

  Hmm, the student has clearly done their homework. They name-drop NP-completeness and functionalism comfortably but wisely flag their boundaries - no need to show off with circuit complexity here. What they're really craving is argument scaffolding, not more citations. That's refreshing; too many philosophy papers get lost in lit reviews.

  Let me zoom in on their two main worries: the "worst-case vs typical-case" gap and the "approximation dodge". Both cut deep. The first questions whether hardness results map to real-world problems - if most Sudoku puzzles are easy, does NP-hardness matter? The second is sneakier: when we swap exact solutions for heuristics, are we cheating philosophically?

  The seminar examples they mention are perfect test cases. For cognitive science: if vision requires solving NP-hard problems, but brains use shortcuts, does that invalidate computational models? For normative theories: if ideal rationality demands supercomputing power, can it still guide humans? 

  I should avoid yes/no answers. The contingency/structure distinction isn't binary - it's more like a spectrum with context-dependent thresholds. "Polynomial time" feels structural until you face n^100 algorithms. "Average-case hardness" might bridge the gap, but only if we can define "typical" rigorously. 

  Their approximation worry is thorniest. When we accept heuristics, are we changing the subject or being pragmatic? Maybe the key is whether the task's telos survives the swap. For Sudoku, a heuristic that fails on 0.1% of puzzles might preserve the "spirit" of puzzle-solving; for ethical decisions, approximate utilitarianism could be morally catastrophic. 

  I'll use Bayesian updating as a through-line. Worst-case it's #P-hard, but in practice? If your priors are sparse or your queries simple, it's tractable. That suggests the limitation is contingent... until we consider agents facing adversarial data streams. Suddenly the hardness bites structurally. 

  The punchline? Hardness results constrain ideal agents only when: (1) the problem instances we care about are hard in the relevant sense, and (2) approximations alter the normative goal. Otherwise, they're just facts about current tools. But proving (1) and (2) is where philosophy earns its keep.
answer: |-
  Your distinction between **contingent** and **structural** limitations is insightful and philosophically productive—but it needs refinement to handle the complexities of computational hardness. Let’s break this down step by step, using Bayesian updating as a concrete case study. I’ll address your two worries (worst-case vs. typical-case, approximation) and show where the distinction holds, bends, and requires context.

  ---

  ### **1. The Core Distinction Refined**
  Your definitions are a strong starting point, but **structural infeasibility** must meet stricter criteria to constrain ideal agents:
  - **Contingent**: Solvable with *scaled resources* (time, space, parallelism).  
    *Example:* Sorting a list with bubble sort (slow but feasible with more time).  
  - **Structural**: Resource needs grow **faster than any physical or plausible resource** (e.g., super-polynomial time for inputs of arbitrary size), *and* the task is **inescapable for the agent’s goals**.  
    *Crucial caveat:* "Structural" only bites if the hardness persists under:
    - Realistic input distributions (not just worst-case),  
    - All possible approximations/heuristics,  
    - The *exact normative demands* of the task.

  ---

  ### **2. Case Study: Bayesian Updating**
  **The task:** Update beliefs over a hypothesis space \( \mathcal{H} \) given evidence \( e \).  
  **Hardness result:** Exact Bayesian updating is #P-hard (worse than NP-hard) for many representations (e.g., Bayesian networks). For unbounded \( \mathcal{H} \), it’s intractable even for simple priors.  

  #### **Objection 1: "Real agents use heuristics!" (The Approximation Dodge)**  
  - **Contingent?** If heuristics (e.g., variational inference, MCMC) yield "good enough" posteriors *for practical purposes*, tractability is restored.  
  - **Structural?** Depends on whether the heuristic **alters the normative standard**:  
    - If "rationality" *requires* exact coherence (e.g., avoiding Dutch books), heuristics fail.  
    - If rationality is **instrumental** (achieving accurate predictions/decisions), heuristics may suffice.  
    **Verdict:** The limitation is structural *only if* exact updating is normatively necessary. Otherwise, it’s contingent—scaling compute or better heuristics helps.  

  #### **Objection 2: "Worst-case hardness ≠ typical-case hardness"**  
  - **Contingent?** If real-world evidence \( e \) and hypotheses \( \mathcal{H} \) have structure (e.g., sparsity, independence), updating may be easy.  
  - **Structural?** Two scenarios make hardness "structural":  
    - **Adversarial environments**: If an ideal agent must handle *any* input (e.g., crafted to exploit heuristic weaknesses), worst-case matters.  
    - **Unbounded hypotheses**: If \( \mathcal{H} \) grows with new evidence (e.g., in scientific reasoning), no fixed approximation works forever.  
    **Verdict:** Hardness is structural when the agent faces **open-ended tasks** where problem instances can be arbitrarily hard.  

  #### **Philosophical Load-Bearing Test**  
  Bayesian updating’s hardness constrains ideal agents **only if**:  
  - Rationality *requires* exactness (not just outcomes),  
  - The environment *can* generate hard instances (no "friendly universe" guarantee),  
  - No approximation preserves the normative goal (e.g., avoiding incoherence).  

  Otherwise, it’s contingent—a limitation of *implementation*, not rationality.

  ---

  ### **3. Your Seminar Cases Resolved**
  #### **Case 1: Cognitive Science (e.g., Perception as NP-Hard Inference)**  
  - **Objection:** If vision requires solving NP-hard problems, but humans do it fast, computationalism fails.  
  - **Reply:** Heuristics + structured inputs save the day.  
  - **Contingent or Structural?**  
    - **Structural if**: The NP-hard task (e.g., optimal scene parsing) is *definitional* to perception (e.g., for a perfect agent).  
    - **Contingent if**: Perception is defined by *ecological function* (e.g., navigating safely), and heuristics suffice.  
    **Key insight:** The limitation is structural only if the "genuine" task *must* be solved exactly/optimally—else, it’s a redescription.  

  #### **Case 2: Normative Theories (Ought Implies Can)**  
  - **Objection:** Full Bayesianism over unbounded \( \mathcal{H} \) violates "ought implies can."  
  - **Reply:** Norms can idealize (e.g., frictionless planes in physics).  
  - **Contingent or Structural?**  
    - **Contingent if**: The idealization is *approachable* (e.g., better compute gets you closer).  
    - **Structural if**: The task is **provably unapproachable** (e.g., error bounds on approximations grow exponentially, or coherence is binary).  
    **Example:** Solomonoff induction is *structurally* infeasible (incomputable), not just hard—no finite resource suffices. Bayesian updating is often *contingently* hard.  

  ---

  ### **4. When the Distinction Breaks Down**
  Your dichotomy isn’t false—but it **depends on normative and empirical context**:  
  - **Approximation isn’t a "dodge" if**: The original task was over-specified (e.g., exact probabilities aren’t needed for decisions).  
  - **Worst-case matters if**: Robustness is normative (e.g., an ideal agent shouldn’t fail on *any* valid input).  
  - **Thresholds blur**: Polynomial time (\(O(n^{1000})\)) is "tractable" in theory but contingent in practice.  

  **Ultimate criterion**: A limitation is structural only if:  
  - It holds for *all possible* algorithms (unconditional hardness),  
  - And the task is *inescapable* for the agent’s purpose (no redescription possible).

  ---

  ### **5. Recommendations for Your Paper**  
  - **Argue that structural infeasibility exists**: Use #P-hardness or incomputability (e.g., Halting Problem) as clear cases.  
  - **Show context-dependence**: NP-hardness is structural for open-ended optimization (e.g., chess against optimal opponents) but contingent for SAT solvers in practice.  
  - **Defang approximations**: Argue that heuristics *change the task* (e.g., satisficing vs. optimizing). If the normative goal shifts, the hardness result no longer applies.  
  - **Target ideal agents**: Hardness constrains them only when approximations violate core norms (e.g., Dutch books for Bayesians).  

  **Concrete thesis**: *Computational hardness results are philosophically load-bearing when they reveal limitations that no possible agent—regardless of resources—could overcome while satisfying the task’s necessary conditions for success.* This withstands both the "worst-case" and "approximation" worries when the task’s norms are non-negotiable.  

  Would you like to workshop a specific paragraph or explore another example (e.g., logical reasoning as NP-hard)?
