  **Blunt Verdict:** Your core move (evidential entanglement) *is* novel and interesting, reframing the epistemic worry around counterfactual reliability. However, your application of it, especially the confident reclassification of expertise as "tuning," is where you're most exposed. **Drop the "majority" claim about tuning.** Focus on developing entanglement as the criterion and *show*, don't assert, why some calibration cases might avoid entanglement. Your vision science friend will shred the expertise claim in Q&A if left unchallenged. The paper has real promise if you shore up this vulnerability.
