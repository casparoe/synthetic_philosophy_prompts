answer: |-
  ### Stage 1: Brainstorming Candidate Principles
  Dana's verdicts across the five cases suggest a pattern that balances consequentialist reasoning (expected harm) with non-consequentialist elements (civic duty). I brainstormed candidate principles that could generate her pattern, drawing from common approaches in collective action problems. Each candidate must explain:
  - **Case 1 (Chicken):** Ought not buy (due to small expected harm via restocking).
  - **Case 2 (Voting):** Ought to vote (despite negligible tie-breaking chance).
  - **Case 3 (Flight):** Ought not take (due to small expected harm via load factors).
  - **Case 4 (Oil Share):** May buy (no duty; no causal impact on harm).
  - **Case 5 (Petition):** May skip (no duty; no causal impact).

  Here are the candidate principles:
  1. **Expected Harm Avoidance (EHA):** Focus on whether your action has a non-zero expected causal impact on harm (positive or negative). If the expected harm outweighs benefits, refrain; if no expected harm, no duty. Civic duties (like voting) are exceptions.
  2. **Rule Consequentialism (RC):** Act according to rules that, if generally followed, would maximize good consequences. Rules are context-specific (e.g., "avoid demand for harmful goods," "vote in elections").
  3. **Fair Share (FS):** You have a duty to contribute your fair share to collective efforts that prevent harm or achieve good, but only if your contribution affects outcomes or fairness. No duty if your action is futile or irrelevant.
  4. **Participation in Harm (PH):** You have a duty not to participate in harmful activities, even if your contribution is overdetermined, but this duty may be waived if participation is trivial or symbolic.
  5. **Threshold-Sensitive Expected Utility (TSEU):** Combine expected utility with threshold effects. If above a harm threshold, your action only matters if it affects the outcome; if below, small expected impacts count. Civic duties override in low-impact cases.

  ### Stage 2: Testing Candidates on the Five Cases
  I applied each candidate to Dana's verdicts, noting strains (misalignments or ad hoc adjustments needed).

  - **Expected Harm Avoidance (EHA):**
    - Case 1: Fits (expected harm via restocking → ought not buy).
    - Case 2: Strain. Voting has negligible expected impact, but civic duty exception explains "ought to vote."
    - Case 3: Fits (expected harm via load factors → ought not take).
    - Case 4: Fits (no expected harm → no duty).
    - Case 5: Fits (no expected harm → no duty).
    - **Strains:** Requires ad hoc civic duty exception for voting.

  - **Rule Consequentialism (RC):**
    - Case 1: Fits (rule: "avoid factory-farmed products" → ought not buy).
    - Case 2: Fits (rule: "vote in elections" → ought to vote).
    - Case 3: Fits (rule: "avoid unnecessary flights" → ought not take).
    - Case 4: Fits (rule: "avoid direct funding of harmful companies" → secondary market has no impact, so no duty).
    - Case 5: Fits (rule: "sign petitions only if impactful" → no duty).
    - **Strains:** Rules are tailored to each case, risking circularity. Does not explicitly address why voting's rule overrides low expected impact.

  - **Fair Share (FS):**
    - Case 1: Strain. Fair share might imply refraining, but Dana's reasoning is about expected harm, not fairness.
    - Case 2: Fits (voting as fair share in democracy → ought to vote).
    - Case 3: Strain. Similar to Case 1; Dana cites expected harm, not fairness.
    - Case 4: Fits (no fair share owed when action is futile → no duty).
    - Case 5: Fits (no fair share when signature is irrelevant → no duty).
    - **Strains:** Poor fit for Cases 1 and 3, where Dana emphasizes causal impact over fairness.

  - **Participation in Harm (PH):**
    - Case 1: Fits (participating in harmful system → ought not buy).
    - Case 2: Strain. Voting could be seen as participating in a good system, but PH doesn't clearly explain "ought to vote" as a duty.
    - Case 3: Fits (participating in harmful activity → ought not take).
    - Case 4: Strain. Buying a share is participating in harmful ownership, but Dana says no duty → requires "no causal role" exception.
    - Case 5: Fits (signing is symbolic participation, but no impact → no duty).
    - **Strains:** Struggles with voting and oil share; needs exceptions for causal futility.

  - **Threshold-Sensitive Expected Utility (TSEU):**
    - Case 1: Fits (below threshold; small expected harm matters → ought not buy).
    - Case 2: Strain. Voting is below threshold (safe state), so should be permissible, but Dana says "ought to vote" → requires civic duty override.
