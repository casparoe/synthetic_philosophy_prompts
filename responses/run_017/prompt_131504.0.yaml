prompt: |-
  I work at a chemicals regulator, and two features of our own practice puzzle me. First, an asymmetry of burden: a firm that wants to place a new substance on the market must submit a full safety dossier and wait for approval before it may sell, while a substance that was already on the market when the inventory was compiled may simply remain, often on evidence decades old, until we get around to reviewing it one at a time — even where the older substance's known toxicity is worse than the new one's suspected toxicity. Second, an asymmetry of framing: when we assess a proposed substitute for a hazardous substance already in use, we assess the substitute's risks but treat the harm from continued use of the incumbent as a background condition rather than as something our decision produces, even when our own numbers say that delay in approving the substitute is the larger expected harm.

  I suspect that neither asymmetry is really a view about uncertainty, and I want the alternative tested. My candidate: the practice rests on what I call an *authorship of risk* norm, on which whoever proposes to introduce a hazard is answerable for it in a way that no one is answerable for a hazard that merely persists — so the precautionary principle is triggered by a proposed change in the world with an identifiable proponent, not by the probability or magnitude of the harm.

  Please reconstruct the implicit theory the practice needs: what view of responsibility, risk, or evidence it strictly presupposes, as opposed to what it merely sits well with; which rival views it quietly rules out; and whether the two asymmetries above presuppose the same thing or different things that happen to be compatible. Say where the practice is philosophically underdetermined, so that several incompatible theories would license it. In particular, can the authorship reading be cashed out epistemically — we have lived with the incumbent hazard and so know something of its shape, whereas the new one is untested — rather than morally, and if it can, does the practice then owe us something it currently doesn't deliver, such as a duty to generate evidence about incumbents or to review them on a fixed schedule? Finally, what would a symmetric practice look like: if the risks of the status quo were treated as newly authorised each year, what in our procedure would have to change, and what, if anything, would be lost by the change?

  Two constraints: keep it short — this is a memo I can act on, not a literature review, and I will supply the citations to the precautionary principle literature myself — and be explicit about which parts of the reconstruction hold for any precautionary practice of this shape and which depend on details I have described.
reasoning: |-
  Okay, the user works at a chemicals regulator and is puzzled by two asymmetries in their practice. The first is the burden asymmetry: new substances require a full safety dossier and approval before sale, while older substances remain on the market with outdated evidence until reviewed. The second is the framing asymmetry: when assessing substitutes, they only evaluate the substitute's risks, treating the harm from the incumbent substance as a background condition, even if delaying approval causes more harm.

  The user suspects these asymmetries stem from an "authorship of risk" norm, where introducing a new hazard makes the proposer responsible, but no one is accountable for existing hazards. They want this theory reconstructed—what it strictly presupposes, which rival views it rules out, and if the asymmetries share the same basis. They also ask if the authorship norm can be explained epistemically rather than morally, and what a symmetric practice would look like.

  First, I need to unpack the implicit theory. The authorship norm implies that moral responsibility hinges on actively creating change. This contrasts with utilitarian or consequentialist views that focus on overall outcomes. The norm rules out theories that assign responsibility based on ongoing harm or the ability to mitigate harm. Both asymmetries likely stem from the same core principle: change requires justification, while the status quo doesn't.

  Next, can authorship be framed epistemically? Yes, arguing that existing substances have known risks, while new ones are uncertain. But this epistemic view would necessitate regular reviews of old substances to update knowledge, which current practice lacks. So the practice doesn't meet what an epistemic justification would require, like scheduled reassessments.

  For a symmetric approach, treating the status quo as annually reauthorized would shift burdens. Incumbents would need periodic reviews, similar to new substances. Approval delays for substitutes would require weighing harms from both action and inaction. The trade-off here is increased regulatory workload but potentially better public health outcomes by addressing ongoing harms.

  The user's deeper need might be to advocate for procedural changes. They might seek arguments to justify reforms like mandatory reviews of old substances or balanced assessment frameworks. Highlighting the moral-epistemic gap could support such initiatives. Also, they might want to challenge the status quo bias inherent in current regulations without appearing to disregard safety.
answer: |-
  ### Reconstructed Implicit Theory of Current Practice  
  **Core Presupposition**: The practice strictly presupposes that **moral responsibility attaches only to *new actions* that alter the status quo**, not to *inaction* perpetuating existing hazards. This reflects an "authorship of risk" norm: *proposing change* makes an agent liable for its risks, whereas *failing to intervene* in ongoing harm does not.  

  **Rival Views Ruled Out**:  
  - **Consequentialism/Utilitarianism**: These would require comparing *total expected harm* (new vs. incumbent) and minimizing net harm. The practice ignores this by treating incumbent harm as "given."  
  - **Ongoing Responsibility**: Views holding regulators accountable for *allowing* known harms (e.g., "duty to rescue") are rejected.  
  - **Symmetric Precaution**: A truly precautionary approach would apply equal scrutiny to *any* avoidable risk, regardless of origin.  

  **Relationship Between Asymmetries**:  
  Both stem from the same core norm:  
  1. **Burden Asymmetry**: New substances require proof of safety *because* the proposer "authors" new risk; incumbents are "grandfathered" as passive background.  
  2. **Framing Asymmetry**: Assessing only the substitute’s risks treats the regulator’s *inaction* (maintaining the incumbent) as non-culpable.  

  **Philosophical Underdetermination**:  
  The practice *could* be justified by:  
  - A **deontological** view: "Do no new harm" outweighs "Prevent existing harm."  
  - **Epistemic conservatism**: Preferring known risks (incumbents) over unknown (new/substitutes).  
  - **Practical feasibility**: Prioritizing manageable workloads (reviewing new entrants first).  

  ---  

  ### Can "Authorship" Be Purely Epistemic?  
  **Yes, but with gaps**: If risk-authorhood is epistemic (i.e., incumbents have "known" risks, new substances have "uncertain" risks), the practice still **fails its own standard**:  
  - Incumbent risks are often *not* adequately known (e.g., outdated data).  
  - **What the practice owes but doesn’t deliver**:  
    - A **duty to actively generate evidence** on grandfathered substances.  
    - **Fixed review schedules** for incumbents (to update "known" risks).  
    - **Comparative risk assessment** when substitutes exist (to resolve uncertainty faster).  
  Without these, the epistemic reading becomes a **moral bias in disguise**: preserving the status quo due to inertia, not knowledge.  

  ---  

  ### A Symmetric Practice: Key Changes  
  **Core Shift**: Treat the *continuation* of incumbent substances as an **annual reauthorization decision**, weighing their risks against alternatives.  

  **Procedural Changes**:  
  1. **Grandfathering Sunset Clause**: All incumbents require updated dossiers every 10–15 years.  
  2. **Substitute Assessments**: Evaluate *both* the substitute’s risks *and* the avoidable harm from delaying its use.  
  3. **Burden Sharing**: Firms marketing incumbents fund ongoing safety studies; new entrants pay for initial approval.  

  **What Could Be Lost**:  
  - **Regulatory throughput**: Slower approvals if resources stretch to reassess incumbents.  
  - **Industry stability**: Firms face recurring costs for existing products.  
  - **Predictability**: Shifting from a clear "new = guilty until proven innocent" standard.  

  **What Could Be Gained**:  
  - **Net risk reduction**: Faster substitution of safer alternatives.  
  - **Procedural fairness**: Equal accountability for all market hazards.  
  - **Evidence-driven decisions**: Updated data on high-risk legacy substances.  

  ---  
  **Key Constraints Applied**:  
  - **Generalizable**: The "authorship" norm underpins *any* precautionary system prioritizing new interventions over existing hazards.  
  - **Context-Specific**: The epistemic gap (outdated incumbent data) and framing asymmetry (substitute assessments) depend on *your described details*.  
  **Action Implication**: Testing the authorship theory reveals that current practice conflates *moral* and *epistemic* rationales. Fixing this requires either embracing the moral norm explicitly (and its flaws) or reforming procedures to close the evidence gap for incumbents.  

  > **Recommendation**: Pilot a "rolling review" system for high-risk legacy substances and require substitute assessments to quantify harm from approval delays. This forces the authorship norm into the open for debate.
