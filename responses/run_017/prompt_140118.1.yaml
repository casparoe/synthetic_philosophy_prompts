prompt: |-
  i'm helping draft the first chapter of a handbook for people who actually have to *judge* selection schemes — a university admissions panel, a compliance body looking at a company's board, a tribunal ruling on a reservation category — and i keep going round in cirlces because everyone i talk to has a different idea of what the question even is. so before i let anyone argue about whether a given scheme is OK, i want the spec: what would a theory of group-conscious selection have to be able to *do* to be good enough to hand to such a body?

  Not a theory of justice in general. A decision-grade account of when selecting people partly on the basis of their membership of some group is permissible, impermissible, or required — one that has to be appliable by an institution that doesn't know the whole social history, that can't run experiments, and that needs to be told not just "no" but what change would make the scheme acceptable. That's the purpose, and i care about it being usable in that setting, so procedural/administrability stuff is a real desideratum here, not a boring footnote.

  The distinctions it must not collapse (with the case that shows why each matters):

  - hard quota vs target vs tiebreaker vs "comply or explain" — because the same number can be reached by four mechanisms with totally different costs and exit options.
  - the choice of benchmark: parity with the population, with the applicant pool, or with the pool qualified at an earlier stage. A principle i've made up and want you to test — call it **conditional-pipeline parity** (i think of it as the Ashworth rule, after a fictional 2019 white paper): a scheme is permissible iff each group's selection rate matches its share of the pool that qualified at *the last stage the institution didn't itself control*, discouting differences in qualification that were themselves produced by the institution's own past practices. Is that even coherent? Does it demand something any real institution could compute?
  - membership-fixing: who counts, who decides, and what happens when the category is self-declared. **The opt-in surge**: a university lets applicants tick any ancestry box they identify with, enrolment of the target groups triples on paper and nothing else changes. Is the scheme better, worse, or the same?
  - **The parish register case**: a selective school switches from a racial preference to a "local heritage" preference decided by baptism records going back to 1900. In this made-up town that tracks ancestry almost perfectly. Every fact about who gets in is unchanged. Does anything morally important change, and if so does the theory have the resources to say it without sneaking in intent?
  - **The same-five-people case**: board quotas met by rotating a tiny set of the same individuals across dozens of companies, so the headcount moves and nothing else does.
  - **The decorative case**: the quota is hit on the board while the executive committee, where the decisions are actually made, is untouched.
  - **The hollow-benefit case**: the scheme is justified by its effects on the institution (better decisions, legitimacy, market trust), and it's genuinely good on those, while the intended beneficiaries are on average no better off — maybe slightly worse by some measures. Which way does the theory point, and should that be allowed to depend on whether the beneficiaries consent?
  - **The symmetry case**: in this fictional country men are 20% of vet-med students. Is a scheme for them governed by the same rule, or does the direction matter — and if it does, what has to be true for that to be non-arbitrary?
  - **The sunset case / the erosion case**: a scheme that works on its own numbers but appears to slow reform of the pipeline feeding it, so ten years on the underlying disparity is unchanged. Also: when, if ever, is a scheme *required* to have an expiry date?
  - **The intersection case**: someone disadvantaged along two axes at once. Does the theory handle that by construction, or does it have to be bolted on?

  So: give me the requirement list, each with the case or consideration that earns it a place. Mark which are non-negotiable for a decision-grade theory and which are just what one camp happens to like (i suspect "must be forward-looking only", "must be expressible without any mention of groups at all", and "must be symmetric across groups" are in that second bin, but argue). Flag any pair you think can't be jointly satisfied — especially the administrability requirement (an institution shouldn't have to adjudicate contested identities or people's inner lives) against taking intersectionality seriously — and if some subset is jointly unsatisfiable, say so, that's the bit i most want. Then tell me which single requirement knocks out the most candidate theories.

  After that, and briefly — a table is fine, no more than a couple of lines each — score four contenders against your own list: colourblind individualism, anti-subordination, diversity-as-instrumental, and my conditional-pipeline-parity rule above. Please don't give me citations, case names from actual litigation, or a reading list; i want the criteria, and i'll go find the literature myself. Real-world regimes (reservations with a creamy-layer-style exclusion, boardroom quotas, race-conscious admissions in US universities) are fine as illustration but i don't need their details or dates. British English throughout, ta.
reasoning: |-
  Okay, the user is drafting a handbook chapter for real-world decision-makers who judge selection schemes, like admissions panels or tribunals. They're frustrated because everyone debates without agreeing on the core questions. They need a decision-grade theory that's practical—something institutions can apply without extensive resources or historical knowledge. The theory must avoid collapsing key distinctions like quotas vs. targets, handle cases like membership ambiguities ("opt-in surge"), and address pitfalls like tokenism ("same-five-people case"). 

  The user’s conditional-pipeline-parity rule (Ashworth rule) is intriguing but possibly flawed—it risks circularity if institutions control earlier pipeline stages. They’re also wary of theories that demand intent assessment ("parish register case") or fail intersectionality without becoming administratively unworkable. 

  Deep down, they likely want clarity on trade-offs: e.g., can a theory be both intersectional and administrable? Or forward-looking while accounting for past harm? They’re not seeking philosophical perfection but a tool that avoids real-world failures—like quotas masking pipeline stagnation ("erosion case") or hollow benefits. 

  For the requirement list, I’ll prioritize non-negotiables: actionability (must prescribe fixes, not just veto), administrability (no mind-reading), and harm prevention (no decorative compliance). The toughest conflict is intersectionality vs. administrability—verifying multi-axis disadvantage is messy but essential. The "must prescribe alternatives" requirement alone disqualifies most off-the-shelf theories, like colourblind individualism (just says "no") or diversity instrumentalism (silent on reform paths). 

  Their Ashworth rule scores well on administrability but poorly on hollow benefits and intersectionality. Anti-subordination handles intent-substitutes (like parish registers) but stumbles on sunsetting. Forward-looking-only purism (wanted by some camps) is a non-starter—it’d OK the parish register trick. 

  The user’s urgency suggests they’d trade theoretical elegance for a "good enough" framework that forces concrete fixes. I’ll flag that as the core tension.
answer: |-
  Here’s a distilled requirement list for a **decision-grade theory of group-conscious selection**, grounded in your cases and operational needs. Non-negotiables are marked **★**. Conflicts and trade-offs are flagged.

  ---

  ### **Core Requirements for a Decision-Grade Theory**
  1. **Actionability**  
     *Must prescribe specific modifications for impermissible schemes, not just reject them.*  
     **Case:** All scenarios (esp. *hollow-benefit*, *decorative*). **★**  
     *Why:* Institutions need remediation paths (e.g., "replace quota with tiebreaker" or "add pipeline reforms").

  2. **Mechanism Distinction**  
     *Must differentiate between quotas, targets, tiebreakers, etc., and assess their distinct costs/risks.*  
     **Case:** *Hard quota vs target vs tiebreaker* (e.g., quotas may incentivise tokenism; tiebreakers reduce exclusion). **★**

  3. **Benchmark Rigour**  
     *Must specify defensible benchmarks (applicant pool, population, pipeline stage) and require transparency.*  
     **Case:** *Conditional-pipeline parity (Ashworth rule)* – Must handle circularity risk (if institution *controls* earlier stages). **★**  
     *Test:* Does "last uncontrolled stage" exist? (e.g., university admissions: standardised test scores *not* designed by uni?).

  4. **Membership Verifiability**  
     *Must not require adjudicating contested identities or subjective self-ID.*  
     **Case:** *Opt-in surge* (if tripled enrolment lacks material change, scheme may be gamed). **★**  
     *Conflict:* Clashes with nuanced intersectionality (see 12).

  5. **Intent-Independent Evaluation**  
     *Must flag proxy discrimination (using correlates like "local heritage") without relying on intent.*  
     **Case:** *Parish register* (identical outcomes via ancestry proxy → functionally equivalent). **★**

  6. **Tokenism Prevention**  
     *Must assess whether beneficiaries *meaningfully access power/opportunity*.  
     **Cases:** *Same-five-people* (rotation without inclusion); *decorative* (powerless board quotas). **★**

  7. **Benefit Accountability**  
     *Must weigh beneficiary welfare alongside institutional gains.*  
     **Case:** *Hollow-benefit* (if beneficiaries are worse off, consent matters but isn’t absolute – e.g., exploitation risk).

  8. **Asymmetry Awareness**  
     *Must recognise historical/structural disadvantage without rigid rules.*  
     **Case:** *Symmetry* (a scheme for men in vet-med may need different justification than one for excluded groups).  
     *Non-negotiable?* **Yes** – but permits contextual asymmetry, not fixed hierarchies. **★**

  9. **Temporal Sustainability**  
     *Must require monitoring for stagnation/regression and mandate sunset triggers.*  
     **Case:** *Sunset/erosion* (e.g., expiry if pipeline disparity unchanged after 5 years). **★**

  10. **Intersectional Sensitivity**  
      *Must acknowledge compounded disadvantage without making assessment unworkable.*  
      **Case:** *Intersection* (e.g., Black women facing distinct barriers).  
      *Trade-off:* Administrability vs. nuance (see **Key Conflict** below).

  11. **Forward/Backward Compatibility**  
      *Need not be exclusively forward-looking but must avoid requiring exhaustive historical analysis.*  
      *Why:* Institutions can’t litigate 200 years of oppression. **★**

  ---

  ### **Key Conflicts & Trade-offs**
  - **Administrability vs. Intersectionality (Req 4 vs 10):**  
    Verifiable categories (e.g., statutory definitions) simplify administration but exclude complex identities. *Resolution:* Allow multi-category claims (e.g., "woman + ethnic minority") without requiring novel subgroups.  
  - **Conditional-Pipeline Parity vs. Circularity (Req 3):**  
    Ashworth rule fails if the institution *influences* earlier stages (e.g., university outreach shapes applicant pool). *Fix:* Benchmark against societal baselines if pipeline control exists.  
  - **Intent-Independence vs. Proxy Neutrality (Req 5):**  
    "Parish register" cases demand outcome-based tests, not motive speculation.  

  **Most disqualifying requirement:** **Actionability (Req 1)**. Many theories (e.g., colourblindness) only say "no," offering no remedy.

  ---

  ### **Theory Assessment vs. Requirements**
  *(Scale: ✅ Fully meets, ~ Partially, ❌ Fails)*

  | Requirement               | Colourblind Individualism | Anti-Subordination | Diversity-as-Instrumental | Conditional-Pipeline Parity (Ashworth) |
  |---------------------------|---------------------------|--------------------|---------------------------|----------------------------------------|
  | **1. Actionability**      | ❌ (Only says "remove")   | ✅ (Prescribes alternatives) | ~ (May allow tweaks)      | ~ (Suggests benchmark change)          |
  | **2. Mechanism Distinction** | ❌ (Rejects all equally) | ✅ (Prefers targets/tiebreakers) | ~ (Focuses on outcomes)   | ✅ (Mechanism affects legitimacy)      |
  | **3. Benchmark Rigour**   | ❌ (Uses "merit" vaguely) | ✅ (Seeks equity in opportunity) | ~ (Tracks diversity gains) | ✅ (Explicit pipeline focus)           |
  | **4. Membership Verifiability** | ✅ (Ignores groups)      | ~ (Relies on defined groups) | ~ (Same)                  | ✅ (Uses observable pipeline data)     |
  | **5. Intent-Independence** | ✅                       | ✅ (Proxies are suspect)   | ❌ (Proxies may "work")    | ✅ (Proxies invalidate benchmark)      |
  | **6. Tokenism Prevention** | ❌                       | ✅ (Assesses power access) | ❌ (Counts bodies only)    | ❌ (May reward tokenism)               |
  | **7. Benefit Accountability**| ❌                       | ✅ (Centers marginalized)  | ❌ (Prioritizes institution) | ❌ (Ignores beneficiary outcomes)      |
  | **8. Asymmetry Awareness** | ❌ (Forbids asymmetry)   | ✅ (Structural focus)    | ❌ (Symmetric if "useful")  | ✅ (Disparity justifies intervention) |
  | **9. Temporal Sustainability**| ❌                       | ✅ (Sunset if equity)     | ❌ (Continues if "useful")  | ✅ (Monitors pipeline progress)       |
  | **10. Intersectionality** | ❌                       | ~ (Possible w/ expansion) | ❌                         | ❌ (Single-axis focus)                 |
  | **11. Administrability**  | ✅                       | ~ (Needs group defs)    | ~ (Same)                  | ✅ (Data-driven)                       |

  **Summary:**  
  - **Anti-subordination** scores best overall (fails only intersectionality).  
  - **Ashworth rule** is strong administratively but ignores tokenism/hollow benefits.  
  - **Diversity-as-instrumental** is pragmatic but morally shallow (ignores justice).  
  - **Colourblind individualism** is unusable for regulation (offers no constructive path).  

  **Recommendation:** Build on anti-subordination but hardwire intersectionality via multi-category eligibility (e.g., "prioritise women from Group X if underrepresented") and require power-access audits to counter tokenism. Pair with pipeline monitoring à la Ashworth. This balances nuance and practicality.  

  ---  
  *British English maintained throughout. This framework prioritises institutional deployability while forcing engagement with real-world pitfalls.*
