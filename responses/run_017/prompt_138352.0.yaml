prompt: |-
  I sit on my town's planning board (small New England town, basically all single-family zoning) and "housing is a human right" gets said at nearly every meeting — the genuinely annoying part is that it gets said by people arguing for opposite things. Last month a neighbors' group opposing a 12-unit building used it: housing is a human right, so the town has a duty to make sure whatever gets built is permanently affordable, and until it is we shouldn't approve market-rate units that'll just bid up rents around them. Then a YIMBY guy used the same seven words to argue we have to legalize apartments everywhere, and that requiring affordability covenants is itself a rights violation, since it makes new homes illegal unless somebody subsidizes them. I'm sure at least one of them is leaning on the slogan for something it doesn't say, but I can't say which, and that's a problem because I have to vote on this stuff.

  So: lay out the distinct precise claims that sentence could be making. Not "different people mean different things" hand-waving — an actual menu of readings I can line up next to each other, and for each one, whether it's trivial, substantive and defensible, or false. The axes I keep getting tangled on:

  - Is it a right against the state, against whoever owns land, or against my town specifically? Does anything change if the duty-bearer is a legislature rather than a court?
  - Is it a right to be handed a unit, a right that nobody arbitrarily deprive you of shelter, or a right to have a say in how the place you live gets produced — I think that last one (the "right to the city" version) is a different animal entirely and shouldn't be lumped in, but tell me if I'm wrong.
  - Who holds it: people already living here, anyone who might want to move here, or households in general? And is it a right against being displaced or against being excluded, because those come apart.
  - Does it come with a remedy, and does it specify a level — enough to not be homeless, enough to live in this particular neighborhood, enough to stay put?

  The part I actually need: for each reading, would it support the neighbors' conclusion, the YIMBY's, both, or neither? My suspicion is that most readings are compatible with basically any policy and so aren't doing the work either speaker thinks they're doing, and I want to know which readings would have to be true for the sentence to actually settle something. Also tell me which reading each of my two speakers probably had in mind, and if it helps, say in the old claim-right / privilege / immunity vocabulary what kind of entitlement each reading is positing — I think "right" is doing three different jobs in that one sentence and that's where the confusion lives.

  No citations or reading lists, I've read plenty of op-eds. Just clean up the distinctions.
reasoning: |-
  Okay, the user is on a town planning board in a small New England town where everyone argues about housing using the phrase "housing is a human right." They're frustrated because both sides—opponents of a 12-unit building and a YIMBY advocate—use the exact same slogan to justify opposite positions. The user needs clarity on what this phrase actually means in precise terms so they can make informed decisions when voting.

  First, I need to break down the possible interpretations of "housing is a human right" into distinct, actionable readings. The user provided specific axes: duty-bearer (state, landowners, town), nature of the right (provision, non-deprivation, participation), right-holders (current residents, potential movers, general households), and remedies (homelessness prevention, specific neighborhood access, protection from displacement). They also want to know which interpretations support which policy conclusions and what each speaker likely meant.

  Starting with the duty-bearer. The state could be the primary duty-bearer, meaning the government must ensure housing access without necessarily providing it directly. Alternatively, the duty could fall on landowners, requiring them to offer affordable housing, which is more radical. Or it could target the town specifically, obligating local policies to prevent displacement or exclusion.

  Next, the nature of the right. Is it about the government providing housing (like public housing), protecting against arbitrary deprivation (eviction protections), or allowing participation in planning ("right to the city")? These are different and shouldn't be conflated.

  Right-holders matter too. Current residents might have rights against displacement, while potential movers have rights against exclusion. This distinction affects policies like rent control versus zoning changes.

  Remedies range from basic shelter to neighborhood-specific access. The level determines policy responses—emergency shelters versus subsidized housing in high-opportunity areas.

  Now, linking each reading to the speakers' arguments. The neighbors opposing the 12-unit building likely see housing as a right to provision, requiring affordability covenants to ensure low-cost housing. They prioritize existing residents not being displaced by rising rents. The YIMBY probably views it as a right against deprivation, where restrictive zoning creates artificial scarcity, violating the right by making housing unaffordable. They argue for legalizing apartments to increase supply.

  The user suspects the slogan is too vague to mandate specific policies. Most interpretations don't inherently support either side conclusively. For example, a right to non-arbitrary deprivation might support the YIMBY's supply-side approach, while provision could align with the neighbors' affordability demands. But neither reading outright settles the debate; they require balancing with other factors like property rights or fiscal constraints.

  The user's deeper need is to cut through rhetorical slogans and assess policies based on tangible outcomes. They want a framework to evaluate claims dispassionately, avoiding being swayed by emotional appeals. By clarifying which interpretations hold water and their implications, the user can focus on practical governance—like whether supply increases or affordability mandates better address local housing needs without violating core rights.
answer: |-
  Here's a breakdown of the distinct readings of "Housing is a human right," analyzed along your axes, with their implications for your specific policy dilemma:

  **The Core Distinctions & Readings:**

  1.  **Right to Basic Shelter (Minimalist, Negative Duty)**
      *   **Claim:** Individuals have a right *not to be arbitrarily deprived* of basic shelter, primarily imposing a *negative duty* on the state (and potentially others) *not to* render them homeless through direct action or gross negligence.
      *   **Duty-Bearer:** Primarily the State (especially courts/executive preventing unlawful eviction, minimal safety net). Indirectly on others (e.g., landlords must follow eviction laws).
      *   **Nature of Right:** Right *against deprivation* of shelter. *Not* a right to be *handed* a specific unit, nor necessarily a right to participate in production.
      *   **Holder:** Anyone physically present within the jurisdiction, facing imminent homelessness *due to state action or systemic failure the state enables*. Focuses on preventing homelessness.
      *   **Remedy/Level:** Prevention of literal homelessness. Access to emergency shelter or minimal habitable housing. *Not* tied to a specific location, neighborhood quality, or permanence beyond immediate need. "Enough to not be homeless."
      *   **Type of Entitlement:** Primarily an **Immunity** (from being made homeless by state action) and a **Claim-Right** against the state to provide minimal emergency shelter *if no other options exist* due to state failures.
      *   **Supports Neighbors (Anti-12-unit)?** No. This reading focuses on preventing active harm (homelessness), not blocking new supply. Market-rate units don't directly violate this right.
      *   **Supports YIMBY (Legalize Apartments)?** Indirectly Yes. Restrictive zoning *can* contribute to scarcity and high prices, increasing *risk* of homelessness, which *could* implicate this right by failing to prevent systemic deprivation the state enables. Removing barriers aligns with preventing deprivation.
      *   **Status:** **Substantive and Defensible (as a minimal floor).** Widely recognized in international law (e.g., ICESCR Art 11) interpreted as a right to *adequate* housing, but this minimalist version is its core negative aspect.
      *   **Speaker Likely Using:** Neither perfectly. The YIMBY edges closer by highlighting how restrictions *cause* deprivation.

  2.  **Right to Adequate, Affordable Housing (Positive Duty, Progressive Realization)**
      *   **Claim:** Individuals/households have a right to *access* housing that is adequate (safe, secure, habitable) and *affordable* (cost not prohibitive to other basic needs), imposing a *positive duty* on the State to progressively realize this right using "maximum available resources."
      *   **Duty-Bearer:** Primarily the State (Legislature & Executive - policy, funding, regulation). Municipalities are key implementers. *Not* primarily a duty on private landowners.
      *   **Nature of Right:** Right *to provision* of *opportunity* or direct provision of adequate/affordable housing. *Not* necessarily a right to a specific unit or neighborhood, nor primarily participation.
      *   **Holder:** Residents and *potential* residents within the relevant housing market (often defined regionally/nationally). Focuses on inclusion and affordability barriers.
      *   **Remedy/Level:** Progressive realization towards adequacy and affordability for all. Level is contextual (habitable, secure, affordable relative to income, access to services). "Enough to live adequately without excessive burden," *not* necessarily "in this particular neighborhood" but *against exclusion* from reasonable opportunity areas. May imply protection from *economic* displacement.
      *   **Type of Entitlement:** Primarily a **Claim-Right** against the state to take reasonable legislative/executive action towards progressive realization. Involves **Powers** (to enact policy) and **Immunities** (from policies actively undermining affordability/access).
      *   **Supports Neighbors (Anti-12-unit)?** **Potentially, if narrowly/misapplied.** Their argument hinges on *conditioning approval* on affordability to prevent harm (rising rents) *to existing residents*. This reading *could* support requiring affordability components *on new projects* as a policy tool *if* deemed necessary for progressive realization *and* resources exist. However, *blocking all market-rate development* likely *hinders* progressive realization by reducing overall supply and tax base.
      *   **Supports YIMBY (Legalize Apartments)?** **Strong Yes.** Restrictive zoning is a primary *state-created barrier* to adequacy and affordability (by limiting supply, type, and location). Legalizing diverse housing types is a core, low-cost state action for progressive realization. Requiring affordability covenants *can* hinder production if set unrealistically high, conflicting with realization.
      *   **Status:** **Substantive and Defensible** (basis of ICESCR Art 11, UN interpretations). Recognizes resource constraints ("progressive realization").
      *   **Speaker Likely Using:** **The Neighbors (for their condition) AND the YIMBY (against the condition).** This is the central battleground. Neighbors emphasize the "affordability" aspect as an immediate duty on *this project*. YIMBY emphasizes the "access/supply/removing barriers" aspect and the counterproductive nature of the neighbors' proposed tool.

  3.  **Right to Security of Tenure / Against Displacement (Negative/Procedural Duty)**
      *   **Claim:** Individuals/households *already housed* have a right to remain in their homes, protected from arbitrary eviction, unreasonable rent hikes, or displacement due to redevelopment/gentrification without due process and mitigation.
      *   **Duty-Bearer:** Primarily the State (Legislature/Executive enacting protections, Courts enforcing). Landlords bound by regulations.
      *   **Nature of Right:** Right *against deprivation* of *existing* home. Security, stability. *Not* a right to a new unit, or necessarily participation.
      *   **Holder:** **Existing residents** (renters, owners facing eminent domain). Focuses on protecting the *status quo*.
      *   **Remedy/Level:** Legal protections against arbitrary eviction/unreasonable rent increases, relocation assistance, right to return. "Enough to stay put" securely if desired.
      *   **Type of Entitlement:** **Immunity** from arbitrary deprivation, **Claim-Right** to due process and mitigation measures.
      *   **Supports Neighbors (Anti-12-unit)?** **Yes, directly.** Their core argument is preventing potential rent increases ("bid up rents") that could displace *existing* residents. They frame blocking market-rate development as protecting this security.
      *   **Supports YIMBY (Legalize Apartments)?** **No, or Contradictory.** While new supply *can* stabilize rents long-term, the *immediate* fear is increased pressure. YIMBY policy doesn't directly address displacement of *current* residents from *their existing* units.
      *   **Status:** **Substantive and Defensible** (component of "adequacy" in ICESCR, many domestic tenancy laws).
      *   **Speaker Likely Using:** **The Neighbors.** Their argument centers on protecting *current* residents from displacement pressure.

  4.  **Right to Develop/Housing Opportunity (Liberty Interest)**
      *   **Claim:** Individuals/landowners have a right to use their property to develop housing (within broad regulations), and potential residents have a right to access housing opportunities without exclusionary barriers. This is framed as a "human right" to participate in providing/accessing shelter.
      *   **Duty-Bearer:** Primarily the State (Legislature/Courts), imposing a *negative duty not to arbitrarily block* development or access. Duty on the *town* not to impose exclusionary zoning.
      *   **Nature of Right:** Right *to participate* in the housing market (as developer or resident) free from arbitrary exclusion. A "right to try" to house oneself/others. Closer to a liberty or economic right.
      *   **Holder:** Landowners/developers, potential residents seeking to move in. Focuses on *exclusion*.
      *   **Remedy/Level:** Removal of unreasonable regulatory barriers (like bans on apartments). Access to the market. "Enough to have a reasonable opportunity to build/buy/rent."
      *   **Type of Entitlement:** **Privilege** (liberty to develop) and **Immunity** from exclusionary regulations. For residents, a **Claim-Right** against discriminatory/exclusionary state action.
      *   **Supports Neighbors (Anti-12-unit)?** **No.** Blocking development directly violates this right for the developer and potential residents.
      *   **Supports YIMBY (Legalize Apartments)?** **Strong Yes.** This is the core of their argument: exclusionary zoning violates the right to develop and the right of potential residents to access housing. Affordability covenants *mandated* by the state can be seen as an additional barrier violating this liberty if they make development infeasible.
      *   **Status:** **Substantive but Contested.** Rooted in property rights and anti-discrimination principles, but framing it as a distinct "human right" is less established internationally than Readings 1-3. Strong in US property rights discourse.
      *   **Speaker Likely Using:** **The YIMBY.** Their argument centers on the illegitimacy of barriers and mandates blocking development/housing opportunity.

  5.  **Right to a Specific Unit/Neighborhood (Unqualified Positive Provision)**
      *   **Claim:** Individuals have a right to be *provided* with a housing unit meeting specific standards (size, type, location) at little or no cost, regardless of market conditions or individual resources.
      *   **Duty-Bearer:** The State (as direct provider), potentially imposing confiscatory duties on landowners.
      *   **Nature of Right:** Right *to be handed* a specific housing outcome.
      *   **Holder:** Anyone deemed to need it. Often implies a right *to stay in or move to* a *specific* high-opportunity neighborhood.
      *   **Remedy/Level:** Direct provision of a unit meeting the standard, potentially in a specific location. "Enough to live in this particular neighborhood."
      *   **Type of Entitlement:** **Claim-Right** to a specific good/service from the state/others.
      *   **Supports Neighbors (Anti-12-unit)?** **Potentially, if interpreted as requiring units in *this* area to be affordable *now*.** But blocking supply doesn't create the unit.
      *   **Supports YIMBY (Legalize Apartments)?** **No.** Legalizing apartments increases *opportunity* but doesn't guarantee a specific unit/outcome.
      *   **Status:** **False or Trivially Impossible.** No legal or philosophical framework treats housing as an unqualified, immediately enforceable right to a specific good/location without regard to resources, feasibility, or competing rights. Would require massive, likely unsustainable, state intervention/confiscation.
      *   **Speaker Likely Using:** **Neither speaker holds this pure version,** though the neighbors' demand for *permanent affordability on this specific project* as a *condition for any development* edges towards it by implying the right can only be fulfilled by this specific mechanism on this site.

  **Conclusion & Your Suspicion Confirmed:**

  *   **The Slogan Doesn't Settle Policy:** You are correct. Almost every substantive reading (1-4) is compatible with a *range* of policies. Reading 5 is unrealistic. The phrase is a moral assertion, not a specific policy prescription.
  *   **Neighbors' Argument:** Primarily relies on **Reading 3 (Security Against Displacement)** to justify blocking the project *and* leans heavily on a narrow, immediate application of **Reading 2 (Adequate/Affordable)** to demand affordability covenants as the *only* acceptable way to fulfill the right *for this project, right now*. They implicitly reject **Reading 4**.
  *   **YIMBY's Argument:** Primarily relies on **Reading 4 (Right to Develop/Opportunity)** to argue against zoning barriers *and* affordability mandates. They also effectively use **Reading 2 (Adequate/Affordable)** to argue that *supply and removing barriers* are necessary for *progressive realization* of affordability, and that the neighbors' requirement *hinders* this realization. They implicitly reject the neighbors' application of **Reading 3** as counterproductive or secondary.
  *   **The Work Being Done:** The slogan provides moral weight but doesn't resolve the *tension between competing aspects of the right itself* (security for current residents vs. opportunity for potential residents; affordability mandates vs. supply production) or the *trade-offs inherent in policy choices*. It also doesn't address *resource constraints* or *competing rights* (like property rights).
  *   **Your Vote:** Focus on evidence and practical outcomes:
      *   Will blocking *this* project demonstrably protect *specific* current residents from *imminent* displacement? (Reading 3)
      *   Will allowing it *without* affordability covenants significantly accelerate displacement? (Reading 3 vs. Reading 2/4)
      *   Does requiring affordability covenants make *this specific project* financially infeasible, thus reducing *overall* supply and harming affordability goals long-term? (Reading 2/4)
      *   Does legalizing apartments more broadly advance the goal of adequate, affordable housing for the community/region over time? (Reading 2/4)
      *   Are there less restrictive tools than project-specific affordability mandates to address displacement concerns (e.g., rental assistance, tenant protections)? (Balancing Readings 2, 3 & 4)

  The slogan highlights the moral importance of housing but obscures the complex trade-offs you must navigate as a planner. Your job is to weigh these competing interpretations *within* the broader goal of housing access and stability, using practical tools and evidence, not to be bound by a single, ambiguous seven-word phrase wielded by opposing sides.
