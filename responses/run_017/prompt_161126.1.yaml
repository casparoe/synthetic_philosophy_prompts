prompt: |-
  I'm a high school senior with one semester of independent study — roughly forty working hours, a good school library, but no archives, no specialist journals, and no interviews — to write a short field guide for my school's crisis-simulation and debate club on when reaching for a historical analogy (Munich, Vietnam, the Thucydides trap) actually sharpens a judgment and when it only decorates one. Which five lines of inquiry should I spend those hours on, and in what order?

  I want the ranking defended rather than asserted: tell me which criterion you are weighting — how much a line would change the forecasts my club actually makes, how many of the other lines depend on it, whether it is tractable for someone limited to secondary sources, how neglected it is in writing aimed at general readers — and name what I would have to find in the first few weeks to move a line up or down the list.

  Place three suspicions of mine rather than simply accepting them: that the stock of analogies we can reach for is survivorship-biased, since the ones still in circulation tend to be those that flattered the person who used them while analogies that produced quiet successes were forgotten; that an analogy earns its keep only if its user can name, before the outcome is known, the observable that would make them abandon it, and that most famous ones fail this test because they cut both ways and so discriminate nothing; and that most of the damage is done by analogies doing legitimizing work in the costume of predictive work. Say plainly if any of these is overrated, or is downstream of something I have not listed.

  Give your answer as a numbered list of exactly five items, each one or two sentences, with no introduction or conclusion.
reasoning: |-
  Okay, the user is a high school senior with limited resources—40 hours, a school library, no archives or specialists. They need to create a field guide for their debate club on using historical analogies effectively. Their main question is which five lines of inquiry to prioritize and why. 

  Hmm, they also have three specific suspicions: survivorship bias in analogies, the need for falsifiability, and the confusion between legitimizing vs predictive purposes. I should address whether these are overrated or if something deeper is missing. 

  First, assessing their actual needs. The club makes forecasts in crisis simulations, so practicality is key. The guide should prevent flawed analogies from distorting their decisions. Their constraints matter—no primary sources, so secondary materials must suffice. 

  Ranking criteria: Impact on forecasts is paramount (weight: 40%). Then foundational importance for other inquiries (30%), tractability with their resources (20%), and neglect in general readings (10%). 

  Their suspicions: All three are valid but interconnected. Survivorship bias is real but part of a larger "analogy ecology" problem. Falsifiability is crucial but hinges on inquiry #1. Legitimizing vs predictive confusion stems from unclear intentions—covered in inquiry #2. None are overrated, but they’re symptoms of deeper issues like poor framing or shallow sourcing. 

  Now, the five lines:  
  1. **Framing the analogy’s purpose** must come first because misaligned intent (predictive vs. moral) causes the most damage. If early sources show unclear goals, it’s even more critical.  
  2. **Source criticism** next—debunking "eternal wisdom" myths. If library books reveal thin sourcing, this climbs higher.  
  3. **Falsifiability** as a core test. Early checks for discard conditions will show if it’s feasible.  
  4. **Analogy ecology** (their survivorship bias point) relies on #2. Finding forgotten cases proves bias.  
  5. **Contextual sensitivity** last, as it builds on all prior work. Spotting over/under-stretched analogies in practice seals its rank.  

  Order justification: #1 and #2 are foundational; #3-5 depend on them. #1 has highest forecast impact (e.g., preventing Vietnam-Iraq errors). #5 is least tractable but still doable via secondary critiques. All are under-discussed in general texts except maybe Munich/Vietnam clichés.  

  For adjustments: If Week 1 reveals rampant source myths (#2), it might swap with #1. If discard conditions (#3) are absent in major analogies, prioritize it higher.  

  … Done. This order maximizes actionable insights within their limits while tackling their suspicions head-on.
answer: |-
  Here are the five lines of inquiry, ranked by weighted criteria: **Impact on forecasts (40%)**, **Foundational necessity for other inquiries (30%)**, **Tractability with secondary sources (20%)**, and **Neglect in general writing (10%)**. Order is based on maximizing early practical insight and building logically.

  1.  **Define the analogy's explicit purpose and mechanism (Is it predictive, instructive, cautionary, or legitimizing?).** *Weighting: Foundational (30%) + Impact (40%) = 70%* (Must come first; intent dictates validity tests. If early reading shows pervasive conflation of legitimizing/predictive uses, its priority increases).
  2.  **Critically examine the *source analogy's* historical accuracy, complexity, and dominant narratives (What is simplified/mythologized?).** *Weighting: Foundational (30%) + Tractability (20%) + Neglect (10%) = 60%* (Essential for #3-5; library histories on Munich/Vietnam reveal simplification. Finding myths treated as fact moves it up).
  3.  **Establish specific, observable *discard conditions* (What real-world evidence would falsify the analogy's relevance *before* the outcome?).** *Weighting: Impact (40%) + Tractability (20%) = 60%* (Core to sharpening judgment; check if major texts propose discard conditions. Finding their absence confirms its criticality).
  4.  **Analyze the "analogy ecology" (Why *this* analogy survives: Does its narrative flatter users, justify actions, or obscure alternatives?).** *Weighting: Impact (40%) + Neglect (10%) = 50%* (Addresses survivorship bias; library books on decision-making may cite forgotten cases. Finding legitimizing intent (#1) as the driver confirms bias).
  5.  **Assess the *degree of fit* between source and target contexts (Key variables: actors, stakes, power dynamics, constraints; where does it over/under-stretch?).** *Weighting: Impact (40%) + Tractability (20%) = 60%* (Needs #1-4; practical application. Finding secondary critiques highlighting poor fits (e.g., Munich/Ukraine) validates its place).

  **On your suspicions:**
  *   **Survivorship Bias:** Valid and covered in #4. It's part of the "analogy ecology" and linked to legitimizing purposes (#1), not overrated.
  *   **Falsifiability (Discard Conditions):** Crucial (#3). Not overrated; its absence is a core flaw in decorative analogies. It depends on clear purpose (#1).
  *   **Legitimizing vs. Predictive:** Spot-on (#1). Not overrated; this conflation is often the root cause of misuse. It's upstream of survivorship bias and poor falsifiability.
