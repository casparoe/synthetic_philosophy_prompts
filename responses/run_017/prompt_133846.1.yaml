answer: |-
  ### Classification Instrument: Navigating Replication Failure Interpretations

  **Decision Tree Structure** (Indented list format; Q = Branch node, L = Leaf)

  1. **Q1 (Vignette):** *"When our lab found effect size 0.4 [95% CI: 0.3, 0.5] and a multi-site replication found 0.1 [-0.05, 0.25], the discrepancy primarily indicates..."*  
     - A: **Flawed original procedure** (e.g., undisclosed flexibility, measurement error)  
     - B: **Heterogeneity in the effect across contexts/populations**  
     - C: **Systematic bias in the literature** (e.g., publication bias inflating original)  

  2. **Q2 (Principle):** *"In fields like psychology or biomedicine, a published effect size ideally represents..."*  
     - A: **A stable population-average parameter** (estimable across studies)  
     - B: **A mechanism active only under specific conditions** (context-dependent)  

  3. **Q3 (Vignette):** *"When replicating our study with 0.4 effect, the replication team should..."*  
     - A: **Adopt our exact protocol and expected effect size** (to test our specific claim)  
     - B: **Redesign for robustness, using their own effect-size expectations** (accounting for flaws/context)  

  4. **Q4 (Principle):** *"If 10% of a field's high-impact papers fail replication, the core problem lies with..."*  
     - A: **Individual papers/labs** (require case-by-case scrutiny)  
     - B: **Systemic incentives** (e.g., career pressure, journal bias)  

  5. **Q5 (Principle):** *"To audit a field's reliability, prioritize..."*  
     - A: **Random sampling of published claims** (audit batch-level error rates)  
     - B: **Targeting contested/famous findings** (adversarial stress-testing)  

  ---

  **Populated Leaves** (Combinations of answers; 12 leaves)  
  *Format: [Path] Leaf Name (if unnamed: "Unnamed"). Commitment summary. Most awkward commitment.*  

  - **A-A-A-A-A**  
    **L1: Frequentist Reformist**  
    Focus: Fix methods to control long-run error rates (e.g., preregistration).  
    *Awkward: Rejects that context-dependence explains most failures.*  

  - **A-A-A-A-B**  
    **L2: Adversarial Institutionalist**  
    Focus: Audit via high-profile replications; reform incentives.  
    *Awkward: Accepts that targeted replications may misrepresent field-wide reliability.*  

  - **A-A-B-A-B**  
    **L3: Unnamed**  
    Focus: Replicators redesign studies, but appraise papers individually.  
    *Awkward: Allows replicators to shift hypotheses, risking "moving goalposts."*  

  - **A-B-A-A-A**  
    **L4: Contextual Estimator**  
    Focus: Abandon testing; report CIs for context-specific effects.  
    *Awkward: Cannot generalize beyond observed settings without theory.*  

  - **A-B-B-B-B**  
    **L5: Mechanistic Revisionist**  
    Focus: Replace p-values with personal-prior Bayes factors; labs revise claims.  
    *Awkward: Priors vary, undermining consensus on "failed" replications.*  

  - **A-B-B-B-A**  
    **L6: Reference Bayesian**  
    Focus: Use default priors for Bayes factors; institutional audits.  
    *Awkward: Defaults may not reflect any researcher's actual beliefs.*  

  - **B-A-A-A-A**  
    **L7: Population Realist**  
    Focus: Literature reflects true effects; replication failures expose publication bias.  
    *Awkward: Assumes population stability even when mechanisms vary.*  

  - **B-A-B-B-B**  
    **L8: Likelihoodist**  
    Focus: Judge evidence via likelihood ratios alone; target fragile claims.  
    *Awkward: Rejects priors entirely, making evidence interpretation subjective.*  

  - **B-B-A-B-B**  
    **L9: Theoretical Skeptic**  
    Focus: Weak theory (not method) causes failures; adversarial replication tests boundaries.  
    *Awkward: Dismisses methodological fixes as superficial.*  

  - **B-B-B-B-B**  
    **L10: Crisis Denier**  
    Focus: Observed irreproducibility matches expected error rates; not a crisis.  
    *Awkward: Justifies high false-positive rates as "cost of doing science."*  

  - **C-A-A-B-A**  
    **L11: Meta-science Reformer**  
    Focus: Fix institutions (e.g., preregistration) via batch auditing.  
    *Awkward: Neglects contextual heterogeneity in effects.*  

  - **C-B-B-B-B**  
    **L12: Radical Incentivist**  
    Focus: Abandon NHST; overhaul rewards to prioritize robustness.  
    *Awkward: Requires dismantling current incentive structures.*  

  ---

  **Unoccupied Combinations & Why**  
  1. **A-A-B-B-A** (Procedural flaw + Population target + Replicator redesign + Field appraisal + Batch audit):  
     *Unoccupied* (Incoherent: If effect is population-level, redesigning protocols invalidates inference.)  
  2. **B-A-B-A-A** (Heterogeneity + Population target + Replicator redesign + Paper appraisal + Batch audit):  
     *Unoccupied* (Unattractive: Demands population inference while allowing protocol changes.)  
  3. **C-A-B-A-B** (Literature bias + Population target + Replicator redesign + Paper appraisal + Targeted audit):  
     *Unoccupied* (Not yet explored: Logically possible but no prominent advocates.)  

  **Inseparable Pairs & Separating Question**  
  - L1 (Frequentist Reformist) vs. L11 (Meta-science Reformer): Both support batch auditing.  
     *Separator: "Should replication protocols strictly copy originals?"* (Yes → L1; No → L11)  
  - L5 (Mechanistic Revisionist) vs. L6 (Reference Bayesian): Both use Bayes factors.  
     *Separator: "Should priors be standardized?"* (No → L5; Yes → L6)  

  ---

  **Your Path**  
  - Q1: **A** (Flawed procedure)  
  - Q2: **B** (Mechanism, not population average)  
  - Q3: [Not needed; Q2=B bypasses Q3 in logic]  
  - Q4: **B** (Systemic incentives; from your audit preference)  
  - Q5: **A** (Batch sampling audit)  
  Path: **A-B-_-B-A** → **L11: Meta-science Reformer**  
  *This leaf is occupied (e.g., advocates of preregistration as institutional reform).*  
  *Awkward commitment: Neglects contextual heterogeneity in effects.*
