  Regarding their "level-climbing" objection to primitive ties: this strikes me as acute. Positional structure in ties recreates the original problem at a higher level - whether through ordered tuples (which themselves require unity) or slots within the tie (which need binding). This isn't just restating the regress but showing how "solutions" may relocate rather than resolve it.

  Their non-well-founded proposal is creative but raises serious concerns about determinacy. Circular structures might avoid infinite descent but risk making truth conditions indeterminate or allowing paradoxical "propositions." The cognitive graspability issue seems particularly damaging if we want propositions to be thinkable.

