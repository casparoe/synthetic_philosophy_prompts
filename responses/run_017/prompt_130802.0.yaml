  Okay, let me approach this systematically. The user is a fourth-year PhD student in philosophy of physics preparing a graduate seminar on spacetime theories, specifically focusing on the hole argument and Leibniz's relevance. They're frustrated with the standard ambiguous treatment of Leibniz in this context and want a definitive interpretation. 

  First, I need to understand their core questions: (1) Leibniz's actual position regarding substantivalism vs relationism in light of the hole argument, (2) whether his Principle of Sufficient Reason (PSR) independently condemns indeterminism, and (3) whether "occupancy substantivalism" would satisfy him. They also want to know if Leibniz would see the hole argument as novel or just a localized version of his displacement argument.

  The user suspects Leibniz was attacking haecceitism (non-qualitative individuality of points) rather than spatial entities per se. But they're troubled by Leibniz's explicit denial that space is an entity. This tension needs resolving. They also want to avoid verificationist readings ("we can't tell the difference") and focus on PSR-based metaphysical objections.

  For the first question, I recall Leibniz's correspondence with Clarke. His displacement argument ("East Indies swapped with West Indies") clearly targets haecceitism - the idea that spatial relocation without relational change constitutes a real difference. But his relational view of space as an "order of coexistents" seems more radical. The key is recognizing that Leibniz rejects both haecceitism AND mind-independent spatial entities. For him, relations are ontologically prior to relata. So he'd reject sophisticated substantivalism (which retains points as entities) just as much as haecceitist substantivalism.

  Regarding PSR and indeterminism: yes, Leibniz would absolutely view the hole argument's indeterminism as a PSR violation. The two models represent a brute, inexplicable difference - precisely what PSR forbids. This isn't about epistemic verification but metaphysical grounding. PSR gives him a direct route to anti-haecceitism without verificationism.

  On occupancy substantivalism: Leibniz would reject it. Occupied points still have haecceities - why is matter-point A here rather than there? The displacement argument applies equally. Moreover, in GR, metric fields "occupying" space would either collapse to plain substantivalism (if metric properties count as occupation) or be incoherent to Leibniz (if not, since he'd deny unoccupied metric structure).

  Finally, the hole argument would strike Leibniz as a significant development: it makes his global displacement argument local and dynamical, exposing indeterminism within a theory rather than just across possible worlds. But it reinforces his core anti-haecceitist view.

  The hardest premise is Leibniz's reduction of spatial relations to monadic properties - that spatial facts ultimately supervene on non-relational properties of substances. Without this, his relationism might allow spacetime points as entities. But his texts consistently deny this.
answer: |-
  Here is the committed Leibnizian position I would defend in your seminar, grounded in his core principles and resolving the tensions you identify:

  **1. Leibniz's Stance on the Hole Argument & Substantivalism**  
  Leibniz would unequivocally endorse **sophisticated substantivalism** (diffeomorphism-equivalent models describe one world), *not* relationism or brute indeterminism. His displacement argument targets **haecceitism**, not spacetime points *as such*. Key evidence:  
  - In the Clarke correspondence (Fifth Paper, §47), he states that indiscernible universes (e.g., Earth displaced east/west) are *identical*, rejecting primitive transworld identity for locations.  
  - His "order of coexistents" (e.g., *New Essays*, II.xiii) is not a denial of spatial entities *in re*, but a denial of *independent* existence. Spatial relations are real but reducible to monadic properties of substances.  

  **Resolution of the tension**: When Leibniz says space is "not an entity," he means it lacks *substantial* or *independent* existence (like a Cartesian *res extensa*). But relational structures *supervene* on substances and their properties. Thus, spacetime points exist as *modes* of substances, not bare particulars. This aligns with sophisticated substantivalism: points exist, but their identities are fixed by relational structure (anti-haecceitism).  

  **2. Principle of Sufficient Reason (PSR) & Determinism**  
  **Yes**, PSR directly condemns the indeterminism in the hole argument as a *reductio*. Leibniz’s objection is metaphysical, not epistemic:  
  - PSR forbids brute facts. If two assignments are qualitatively identical but differ haecceitistically, *no reason* exists for one over the other (PSR violation).  
  - As he writes to Clarke (Fifth Paper, §21): "A sufficient reason [...] must be found *in the thing itself*." Indeterminism via haecceitism violates this by making distinctions without differences.  
  This avoids verificationism: the defect is ontological (lack of ground), not epistemological (inability to discern).  

  **3. Occupancy Substantivalism & GR**  
  Leibniz **rejects** occupancy substantivalism. His reasons:  
  - **Metaphysical**: Even occupied points would require haecceities. Why is *this* point occupied by *this* matter? Without relational grounding, it violates PSR (see *Specimen Dynamicum*).  
  - **In GR**: If "occupation" includes metric fields, the view **collapses into plain substantivalism**. Gravitational waves "occupying" vacuum regions still permit haecceitistic redistributions (e.g., shifting the wave’s location without qualitative change). If metric properties don’t count as occupation, the view is **incoherent for Leibniz** – he denies unoccupied spatial structure (monads ground all relations).  

  **Most damaging collapse**: Defining occupation to include metric fields is worse. It resurrects haecceitism (the hole argument’s core problem) while pretending to solve it. Leibniz would dismiss this as relabeling absolutism.  

  **Conclusion: Leibniz’s Moral & Novelty**  
  - **Moral**: The hole argument confirms **anti-haecceitism** via PSR, not relationism. Spacetime points exist, but their identities are structurally defined.  
  - **Novelty**: Leibniz *would* see this as meaningfully new. His displacement argument is global/static; the hole argument makes it **local, dynamical, and theory-immanent**, exposing indeterminism *within* a physical theory (GR). As he wrote, "Nature has no gaps" (*Monadology* §69) – indeterminism is unthinkable.  

  **Hardest Premise**: **Spatial relations reduce to monadic properties**. If spacetime points were irreducible (even relationally individuated), Leibniz might permit them. But his substance ontology (monads with intrinsic properties) forces reduction: relations are *grounded in* non-relational foundations. Texts underdetermine this reduction’s mechanism, but the *commitment* is explicit (Fifth Paper, §47).  

  **Seminar Defense**: "Leibniz isn’t a relationist in the modern sense. He attacks haecceitism, not spacetime points. His PSR forbids the hole argument’s indeterminism independently, and occupancy substantivalism fails because occupation doesn’t fix haecceities. For Leibniz, the hole argument is his displacement argument – but dynamized, localized, and deadlier."
