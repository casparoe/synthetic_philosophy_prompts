prompt: |-
  I volunteer at a natural history museum, where I run a small table called "Is it alive?" for visiting school groups — a tray of objects, a laminated card, about ninety seconds per group. I have a friend in a synthetic-biology lab who keeps feeding me new specimens, and I have started to notice that my verdicts are more settled than my reasons, and that "it depends what you mean by alive" has stopped being an answer I can give to a nine-year-old and still feel honest about. So I want the principle behind the pattern, if there is one. Here is where I land: a mule is alive, obviously, and so is a worker ant, even though neither will ever have offspring and no mule is descended from another mule; a seed from a two-thousand-year-old jar that can still germinate was alive the whole time, and so, I want to say, was a tardigrade dried to a speck and a human embryo in liquid nitrogen; a line of human cells in a lab dish, descended from a person who died seventy years ago and proposed by someone as a species of its own, is alive; a rotifer lineage that appears to have gone tens of millions of years without sex is alive; a hybrid frog that has to mate with a different species each generation to rebuild its own genome is alive; a bacterial cell whose genome was chemically synthesized and then cut down to the bare set of genes needed to divide is alive. Fire is not alive, even though it metabolizes, grows, responds to wind, spreads, and passes on something like a flame shape. A prion is not alive. A virus particle floating outside a cell is not alive, though I waver about the giant ones that carry some of their own translation machinery. A computer virus and a machine in a factory that assembles copies of itself from parts are not alive, and not nearly alive. The case I keep arguing with my friend about is a virus inside the cell it has taken over: a few virologists say the infected cell, not the particle, is the living stage of the virus, the particle being only a dispersal form, and my gut says the infected cell is alive while the virus in it is not, which may just be incoherent.

  The principle I keep coming back to is something like: a thing is alive if it belongs to a lineage whose continuation is explained by natural selection acting on heritable variation. That gets fire and computer viruses out cleanly, and it gets the HeLa cells and the ancient seed in, and it explains why the giant virus makes me waver. But it says the mule and the worker ant are not alive, or at least gives no reason to call them alive, and it seems to make the dried tardigrade alive only in virtue of a lineage it is not currently participating in — and I am not willing to give any of those three up. I have also noticed that my verdicts may be answers to three different questions that I have been sliding between: whether something is alive, whether it is an organism, and whether it is a unit of selection.

  What I would like from you: state the principle, or the smallest set of candidate principles, precisely enough that I could defend it at the table, and tell me which of my cases motivates each clause. Test my lineage formulation against the mule, the worker ant and the dormant seed specifically, and either repair it so that they come out alive without also letting in fire and self-replicating machines, or tell me plainly why no account with that shape can have them. Then tell me what your preferred account predicts for two cases I have not given a verdict on: a lab-built clump of frog skin cells that swims, sweeps loose cells into rough copies of itself, and dies out after a few generations without evolving at all; and a brain organoid grown from human cells, kept alive in a dish for years, with no body and no prospect of one. Finally, say which of my verdicts you think I should overturn, and why that one rather than the others.
reasoning: |-
  Okay, the user volunteers at a natural history museum and runs an "Is it alive?" exhibit for school groups. They've been getting specimens from a synthetic-biology lab friend, and they're struggling to find a consistent principle to explain why certain things are alive or not. They have a list of examples they've classified but feel their reasoning isn't solid. Their current principle involves lineages and natural selection, but it has issues with cases like mules, worker ants, and dormant seeds. They want a precise principle they can explain to nine-year-olds without resorting to "it depends."

  First, the user needs a clear, defensible principle that covers all their cases. Their lineage-based approach fails for mules and worker ants because those don't reproduce. Also, dormant seeds and tardigrades aren't actively participating in lineages while dormant. They also mention three possible questions they might be conflating: whether something is alive, an organism, or a unit of selection. That's key—maybe the solution lies in separating these concepts.

  Looking at their examples: mules and worker ants are alive but sterile. Dormant seeds and cryopreserved embryos are alive. Lab-grown cells, asexual rotifers, hybrid frogs, and synthetic bacteria are alive. Fire, prions, viruses (mostly), computer viruses, and self-replicating machines aren't. The infected cell is alive, but the virus inside isn't. 

  The user's lineage principle excludes mules because they don't reproduce. But mules are clearly alive. So how to include them? The answer might be that being part of a lineage doesn't require the individual to reproduce. Instead, life is about the potential for evolutionary processes, but individuals can be alive without reproducing. That means shifting focus from the individual's reproductive role to its characteristics. 

  Standard biology definitions often include organization, metabolism, growth, adaptation, response, reproduction. But fire meets some of these, and dormant seeds don't metabolize. So maybe metabolism isn't necessary during dormancy. The key is the presence of a self-sustaining process that can resume activity. 

  The user's cases suggest that life is tied to biological processes that can be paused and resumed, supported by cellular machinery. Fire lacks this; it's a chemical reaction. Viruses rely entirely on host cells. Mules have all the biological processes even if sterile. So perhaps the core is being a self-sustaining chemical system capable of Darwinian evolution. But mules themselves don't evolve; their lineage does. So for the individual, it's about possessing the machinery that enables evolutionary processes, even if they don't use it.

  For mules and worker ants: they have cells, metabolism, respond to stimuli. Their sterility doesn't negate their aliveness; they are products of living lineages. The dormant seed has the potential to restart metabolism. Fire has no heritable information; it's just energy release. 

  The two new cases: the frog cell clump and the brain organoid. The frog cells swim and replicate but don't evolve. This seems like a transient phenomenon, not a lineage. It might be alive in the sense that the cells are alive, but the clump itself isn't an organism. The organoid has metabolism and responds but no way to reproduce or function as an independent unit. It's alive as tissue but not an organism.

  The user might need to distinguish between being alive (as in having biological processes) and being an organism. Cells in a dish are alive; the tissue is alive. But an organism has more integration. The organoid isn't an organism but is composed of living cells. Similarly, the frog clump is a temporary structure made of living cells.

  So the principle could be: Something is alive if it is a self-sustaining chemical system maintaining organization through metabolism (when active), capable of heritable variation and evolution as part of a lineage. 

  This covers dormant states by noting metabolism isn't always active. Mules are alive because they have metabolic processes and are part of a lineage. Fire lacks heritable information. Computer viruses have information but not chemical. 

  For the infected cell: the cell is alive; the virus is not, as it lacks metabolism. The virologists' view that the infected cell is the living stage might blur lines, but the virus particle itself isn't alive.

  The user should overturn the verdict on the giant virus? But their gut says viruses aren't alive. The principle maintains that without metabolism, they're not alive. Giant viruses might carry some translation machinery, but they still depend entirely on the host for replication. So not alive.

  In summary, the key is decoupling the individual's reproductive capability from its status as alive, focusing instead on its biological processes and role within a lineage. This should satisfy the user's need for a consistent principle that works for kids without overcomplicating.
answer: |-
  Here's a principled framework that resolves your cases while remaining teachable to nine-year-olds. It distinguishes between **being alive**, **being an organism**, and **being a unit of selection**, using three layered criteria:

  ### The Principle (Defendable Version for Kids):
  > **"Something is ALIVE if:**
  > 1. **It's made of CELLS** (or was built by cells, like a shell or a prion—but those aren't alive themselves!)
  > 2. **It can DO LIFE THINGS** (use energy, grow, respond to its surroundings—even if paused, like a seed)
  > 3. **It came from OTHER LIVING THINGS and could make MORE** (even if it doesn't, or needs help like the hybrid frog).  
  >   
  > **Fire and robots fail #1 and #3. Viruses fail #2 when floating around—they're like seeds without water!"**

  ### The Rigorous Version (for your clarity):
  > **X is ALIVE if:**  
  > (A) **Cellular Basis:** X is or contains at least one cell, *or* is in a dormant state derived from a cell (e.g., spore, frozen embryo).  
  > (B) **Process Potential:** X maintains metabolic activity *or* can autonomously resume it under permissive conditions (using its own machinery).  
  > (C) **Lineage Context:** X belongs to a lineage with heritable variation subject to natural selection *at the population level* (even if X itself doesn't reproduce).  

  ### How It Handles Your Cases:
  | Specimen                 | Your Verdict | How Principle Applies                                                                                               |
  |--------------------------|--------------|---------------------------------------------------------------------------------------------------------------------|
  | **Mule**                 | Alive        | (A) Cellular, (B) Metabolic, (C) Part of a lineage *shaped* by selection (donkeys/horses)                          |
  | **Worker ant**           | Alive        | (A, B) Cellular/metabolic, (C) Part of a eusocial lineage where selection acts on the *colony*                     |
  | **Dormant seed/tardigrade** | Alive     | (A, B) Cellular; metabolic activity paused but *autonomously resumable*                                            |
  | **HeLa cells**           | Alive        | (A, B) Cellular/metabolic, (C) Descended from a lineage under selection (cancer as evolutionary process)            |
  | **Synthetic bacteria**   | Alive        | (A, B) Cellular/metabolic, (C) Minimal but functional lineage under selection                                      |
  | **Fire**                 | Not alive    | Fails (A): Not cellular. Fails (C): No heritable variation.                                                        |
  | **Virus (free)**         | Not alive    | Fails (B): No metabolism or autonomous activity. Fails (A): Not cellular.                                           |
  | **Infected cell**        | Alive        | **Cell is alive** (A, B, C). **Virus inside isn't alive**—it's a hijacker with no independent metabolism (B).       |
  | **Giant virus**          | Not alive*   | Still fails (B): Lacks *autonomous* metabolism (needs host translation). Your "wavering" addressed by (B)'s autonomy clause. |

  ### Why Your Lineage-Only Formulation Failed:
  - **Mule/ant problem:** Lineage-only accounts exclude *individuals* that don't reproduce. Principle (C) fixes this by connecting them to a population-level lineage under selection, without requiring *their* reproduction.  
  - **Dormancy problem:** Dormant things aren't "participating" in lineages *now*. Principle (B) covers paused states, while (C) anchors them to an evolutionary context.  
  - **Fire exclusion:** Fire lacks cellularity (A) and heritable variation (C)—it "reproduces" but doesn't *evolve*.

  ### New Cases & Verdicts:
  1. **Frog skin cell clump (Xenobots):**  
     - **Alive? YES.**  
       - (A) Made of cells.  
       - (B) Metabolizes, responds, "sweeps" (energy use).  
       - (C) Derived from frog lineage under selection.  
     - *But not an organism:* It's a cell aggregate without functional integration. "Life thing" (metabolism) happens at *cell level*.  

  2. **Human brain organoid:**  
     - **Alive? YES (at tissue level).**  
       - (A, B) Cellular and metabolic.  
       - (C) Derived from human lineage.  
     - *Not an organism:* No body integration or evolutionary trajectory. A "preview" of neural tissue, not a selectable unit.  

  ### Verdict to Overturn: The Infected Cell as "Living Stage of the Virus"
  - **Why overturn this?** Your gut is right: the infected cell is alive; the virus is not. Calling the cell the "living stage of the virus" confuses *host exploitation* with *aliveness*.  
  - **Why this one?** It conflates *life* with *replication*. Viruses replicate but lack autonomous metabolism (B)—they're more like invasive DNA instructions. Accepting this view would logically force you to call plasmids or cancer genes "alive," collapsing your framework.  
  - **Child-friendly defense:** "The cell is alive but sick. The virus is like a pirate ship—it needs a crew (the cell) to work!"  

  ### Why This Works at Your Table:
  - **"Cells"** is concrete (kids know cells from school).  
  - **"Do life things"** covers metabolism/growth/response simply.  
  - **"Came from and could make more"** links to lineage without needing "natural selection."  
  - **Hard cases become teachable moments:**  
    - *Mule:* "It eats and grows like its parents—it just can't be a parent itself."  
    - *Dormant seed:* "Like a paused video game—it has everything to restart!"  
    - *Virus:* "Needs to invade a cell to do anything—like a key without a car!"

  This separates **life** (cellular + metabolic potential + lineage context) from **organismality** (integrated functionality) and **units of selection** (what evolves). It keeps fire, prions, and machines out; brings mules, ants, and dormancy in; and handles edge cases via autonomy in (B) and population-level thinking in (C).
