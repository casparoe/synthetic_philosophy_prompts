answer: |-
  ### Utility Conceptions Decision Tree  
  *Start here: Nia always takes an apple when both apples and bananas are available. When bananas are absent, she takes an apple. Everyone agrees: this is* ***some evidence*** *that Nia prefers apples over bananas. But what does "preference" mean? Follow the cases...*  

  #### 1. **Marcus Case**: Marcus refuses tap water, believing it contaminated (it’s safe). If he knew the truth, he’d drink it. Does his refusal reveal his "true preference"?  
     - **Yes** (Choice reflects true preference despite beliefs) → Go to 2.  
     - **No** (Choice is distorted by false beliefs) → **Leaf A: Belief-Correction View**  
       - *Statement:* Utility requires separating beliefs from desires; choices alone are unreliable without belief data.  
       - *Swallow:* Must define "true beliefs" objectively.  
       - *Admin:* Cannot rank welfare from choices alone.  

  #### 2. **Thea Case**: Thea was raised being told "people like you don’t do X" and now doesn’t want X. If raised freely, she might want X. Does her current choice reflect her "true preference"?  
     - **Yes** (Preference is sincere regardless of origin) → Go to 3.  
     - **No** (Preference is distorted by oppression) → **Leaf B: Informed Preference-Satisfaction**  
       - *Statement:* Welfare is satisfying preferences formed under full information and autonomy.  
       - *Swallow:* Defining "ideal conditions" is paternalistic.  
       - *Admin:* Needs data on corrected preferences, not choices.  

  #### 3. **Amara Case**: Amara votes for a tax costing her $100 to help a neighbor. Does this choice contribute to *her welfare*?  
     - **Yes** (Her welfare includes others' well-being) → Go to 4.  
     - **No** (Welfare is self-regarding) → Go to 5.  

  #### 4. **Intensity Case**: Two patients choose the same surgery over an alternative. One barely cares; the other would pay anything. Can "utility" capture this intensity difference?  
     - **Yes** (Utility measures strength of feeling) → Go to 6.  
     - **No** (Utility only ranks options ordinally) → Go to 7.  

  #### 5. **Why not for Amara?**  
     - Welfare is about conscious experiences (e.g., happiness) → **Leaf C: Experienced-State Welfarism**  
       - *Statement:* Welfare is positive experiences; choices may mislead (e.g., Amara might feel worse after paying).  
       - *Swallow:* People often choose what doesn’t bring happiness.  
       - *Admin:* Needs surveys/neuroscience, not choices.  
     - Welfare isn’t about preferences or experiences → **Leaf D: Alternative Approaches**  
       - *Statement:* Use capabilities (e.g., "can Amara achieve her goals?"), objective lists (e.g., health, knowledge), or rights.  
       - *Swallow:* Requires a non-subjective theory of the good.  
       - *Admin:* Ignores choices; uses external metrics.  

  #### 6. **Painkiller Case**: Same painkiller offered to a rich patient (WTP $100) and a poor patient (WTP $10). Is the utility gain identical for both?  
     - **Yes** (Utility is the physical relief) → **Leaf C** (Experienced-State, same as above).  
     - **No** (Utility varies by willingness-to-pay) → **Leaf E: Money-Metric Welfarism**  
       - *Statement:* Willingness-to-pay ($) measures welfare intensity.  
       - *Swallow:* Values rich people’s preferences more.  
       - *Admin:* Ranks welfare using prices/budgets.  

  #### 7. **Menu-Change Case**: Nia chooses apple over banana. When cherries are added, she picks cherry over apple. Does the utility of the apple change?  
     - **Yes** (Utility is relative to the menu) → Go to 8.  
     - **No** (Utility is stable across menus) → Go to 9.  

  #### 8. **Menu-Anchored Utility**:  
     - Require choices to be consistent across menus? (e.g., if Nia picks banana > cherry and cherry > apple, must she pick banana > apple?)  
       - **Yes** → **Leaf F: Integrability View**  
         - *Statement:* Utility exists only if choices are consistent ("integrable"); else, no utility function.  
         - *Swallow:* Real people are often inconsistent.  
         - *Admin:* Can assign utilities *if* data is consistent.  
       - **No** → **Leaf G: Strict Behaviorism**  
         - *Statement:* "Preference" is *defined* as choice dispositions; utility is a label for observed choices.  
         - *Swallow:* Preferences can reverse arbitrarily when menus change.  
         - *Admin:* Describes choices; silent on welfare.  

  #### 9. **Menu-Free Utility**: Can we use it for welfare judgments?  
     - **Yes** → **Leaf H: Raw Preference-Satisfaction Welfarism**  
       - *Statement:* Welfare is satisfying actual preferences, revealed by choices (e.g., Thea’s choice reflects her welfare).  
       - *Swallow:* Counts harmful/mistaken preferences (Marcus, Thea).  
       - *Admin:* Ranks welfare directly from choices.  
     - **No** → **Leaf I: Instrumentalism ("As If")**  
       - *Statement:* Utility is a tool to model/predict choices—not real or welfare-relevant.  
       - *Swallow:* Cannot explain *why* people choose.  
       - *Admin:* Predicts choices; ignores welfare.  

  ---

  ### Notes  
  - **Unseparated Leaves**:  
    - **Leaf C** (Experienced-State) appears twice—reached via different paths (intensity or Amara cases).  
    - **Leaf F** (Integrability) and **Leaf I** (Instrumentalism) are not fully separated by cases; they diverge on whether utility must be *predictive* vs. *consistent*. Invented case: *If choices are inconsistent, can we still model them "as if" they have utility?* (Yes→I; No→F).  
  - **Unclaimed/Incoherent Cells**:  
    - *"Menu-free + belief-distorted"*: If utility is stable across menus but distorted by false beliefs (e.g., Marcus), it requires correction (Leaf A). Denying this is incoherent for welfare claims.  
    - *"Experienced-state + menu-anchored"*: Utility as sensations can’t be menu-relative (e.g., pain relief is intrinsic), so this combo is unattractive.  

  ### How to Run This in Class  
  **Step 1:** Have students work through the tree *alone* (10 min), landing on a leaf. **Emphasize:** "Don’t defend your leaf—note where branches feel forced or unclear."  
  **Step 2:** In small groups (5 min), discuss: "Which case or branch *most surprised you*, and why?" Focus on tensions in the cases, not position labels. This avoids debate and exposes conceptual fault lines.  

