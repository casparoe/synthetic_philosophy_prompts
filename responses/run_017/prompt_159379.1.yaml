  ### Scenario: The Pro Bono Prediction Bonus

  Elena, a lawyer, receives a $50,000 bonus from her firm’s senior partners. The bonus was awarded because the partners, after reviewing her work history, charitable activities, and interviewing colleagues, predicted with 90% accuracy (based on known reliability of such human judgments in similar cases) that she would take a specific, unlikely pro bono case without pay if it arose, saving the client $20,000. The case never materialized, but the bonus, given unconditionally, is irrevocable. Afterward, the partners privately request she donate $20,000 to a legal aid charity, emphasizing that her decision is unrecorded, unobservable, and will not affect her career, future interactions, or reputation. Elena knows the bonus is fixed, and payment cannot alter it or trigger any consequences.  
  - **No observers/reputational consequences**: The request is explicitly private and unrecorded.  
  - **No second round**: The partners state this is a one-time request with no follow-up.  
  - **No pre-commitment device**: Elena had no prior mechanism to bind her decision.  
  - **No character consideration**: Payoffs are purely monetary; character effects are excluded.  
  **Break-even accuracy**: Payment is rational if predictor accuracy exceeds ≈55.6% (derived from expected utility: paying policy yields $40,000p vs. not-paying policy $50,000(1−p), indifference at p = 5/9). Stated accuracy (90%) clears this by a wide margin (34.4%).  

  ### Demonstration of Verdicts  
  - **Causal decision theory (CDT) recommends not paying**: Payment causes a $20,000 loss with no countervailing benefit. The bonus is irrevocable, and no causal pathway (e.g., influencing future rewards) exists. EU(pay) = $30,000; EU(not pay) = $50,000.  
  - **Functional/updateless decision theory (FDT/UDT) recommends paying**: From an ex ante perspective (before knowing if the case arises), the policy “always pay if asked” maximizes expected utility. It ensures the 90% chance of receiving the bonus ($50,000) and yields $30,000 in both worlds (case or no case). EU(policy) = 0.5 × [0.9 × $30,000 (case) + 0.9 × $30,000 (no case)] = $27,000, vs. $5,000 for “never pay.” FDT and UDT align here.  
  - **Evidential decision theory (EDT) recommends not paying**: Payment is evidence of consistency with the prediction, but conditional on having the bonus (evidence the prediction was positive), EU(pay) = $30,000 is strictly dominated by EU(not pay) = $50,000. The absence of an evidential link to other outcomes (e.g., no bundled harm) makes EDT ignore the counterfactual benefit.  

  **Minimal change to make EDT recommend payment (XOR rig)**: Introduce a separate, irrevocable event whose outcome correlates with prediction accuracy. For example, the partners also predicted the outcome of a lawsuit Elena cares about; if their prediction was wrong (e.g., evidenced by her not paying), she loses a $100,000 settlement. Now, not paying is evidence of prediction inaccuracy, which is evidence of losing the settlement. EU(not pay) = $50,000 (bonus) + 0.1 × $100,000 (low chance of accuracy) = $60,000, but EU(pay) = $30,000 + 0.9 × $100,000 = $120,000. EDT pays, trading on the evidential link to the lawsuit loss.  

  **Structural difference from XOR blackmail**: In XOR blackmail, payment avoids evidence of a *distinct, concurrent bad outcome* in the same world (e.g., the lawsuit loss above). Here, the **counterfactual mugging** only involves evidence of forgone benefits in *other* worlds (e.g., the bonus in the case-arisen world). This is secured by the bonus being granted unconditionally in the *actual* world and the request having no tied consequences.  

  ### Load-Bearing Feature and Removal Tests  
  The **load-bearing feature** is the *combination* of: (1) benefit disbursed irrevocably before choice, (2) payment requested afterward with no causal consequences, and (3) prediction accuracy exceeding break-even.  
  - **Choice before disbursement**: If Elena decides payment before the bonus, it becomes a standard investment decision (e.g., paying ensures bonus receipt). All theories align on paying.  
  - **Predictor still reachable**: If partners could revoke the bonus, payment might causally protect it. CDT would then pay, collapsing the divergence.  
  - **Second round added**: If Elena’s payment affects future predictions, CDT might pay to signal cooperation.  
  The constraint doing the most work is the **irrevocable benefit with no causal pathways**, as it forces CDT to ignore the counterfactual.  

  ### Lines of Attack for CDT  
  1. **Uncertain predictor reliability**: A CDT agent might doubt the 90% accuracy, lowering expected gains from paying and justifying refusal.  
  2. **Hidden causal pathways**: A CDT agent could argue that payment *causally* influences the predictor’s future behavior (e.g., via subconscious biases) despite explicit assurances.  

  ### Honest Note  
  The scenario requires readers to accept that the predictor’s 90% accuracy and the absence of hidden consequences are *fully credible* based on the firm’s description. Realistically, agents might doubt these assurances, opening room for CDT to rationalize refusal. This must be stipulated for the decision-theoretic contrast to hold.
