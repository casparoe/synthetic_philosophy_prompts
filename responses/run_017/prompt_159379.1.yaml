  But in our specification, the benefit must be already disbursed and irrevocable, and the request comes afterward. In this setup, in the tails world, the benefit (which was given in the heads world) is not given in the tails world. So in the tails world, there is no benefit that has been given. But we want a benefit that has been given in the actual world (tails) and is irrevocable.

  So we need to give the benefit in both worlds? Or find a way to give it in advance.

   Give the benefit in advance, before E is known.

  - At time T0, the senior partners predict what the agent would do in the event that E does not occur. Specifically, they predict whether she would donate $100 if asked in the future when E does not occur.
  - If they predict she would donate, they give her a bonus of $10,000.
  - Then, time T1: it is revealed whether E occurs or not.
    - If E occurs ( heads), nothing more happens.
    - If E does not occur (tails), they ask for a donation of $100.

  The bonus is given at T0, before the state is known, and is irrevocable.

  The prediction is about what she would do in the world where E does not occur.

  The agent must choose at T0 a policy for what to do at T1 if E does not occur.

  The predictor at T0 is 90% accurate in predicting what she would do at T1 in the event that E does not occur.

  The states are equally likely: P(E occurs)=0.5, P(E does not occur)=0.5.

  Now, the policies are only about what to do in the tails world: pay or not pay.

  But the policy is fixed at T0? Or can she change at T1? The predictor is at T0, so they are predicting her action at T1 in the tails world based on her state at T0.

  She may not be able to commit at T0. At T1, if E does not occur, she can choose whether to pay or not.

  But then, at T1, in the tails world, she has already received the bonus. If she pays, she has $10,000 - $100 = $9,900. If she doesn't, she has $10,000.

  So she wouldn't pay.

  Unless she is updateless and considers the ex ante expected utility.

  At T0, before she knows the state, she would choose a policy for T1.

  - If she commits to paying in the tails world, then:
    - With 90% probability, the predictor predicts she will pay, and she gets the bonus.
    - With 10% probability, the predictor predicts she won't pay, and she doesn't get the bonus.

    Then, in the heads world (E occurs), she has: if she got the bonus, $10,000; if not, $0.
    In the tails world, she has: if she got the bonus, $9,900; if not, and then she doesn't pay, $0.

    Expected utility at T0:
    - Probability of heads: 0.5
      - P(bonus|policy) = 0.9 -> $10,000
      - P(no bonus|policy) = 0.1 -> $0
      heads utility: 0.9*10,000 + 0.1*0 = $9,000
    - Probability of tails: 0.5
      - If she got bonus (0.9), then $9,900
      - If no bonus (0.1), then $0
      tails utility: 0.9*9,900 + 0.1*0 = $8,910
    - Total EU: 0.5*9,000 + 0.5*8,910 = $8,955

  - If she commits to not paying in the tails world, then:
    - With 90% probability, the predictor predicts she won't pay, and she doesn't get the bonus.
    - With 10% probability, the predictor predicts she will pay, and she gets the bonus.

    In heads world: 
      - if bonus (10%) -> $10,000
      - if no bonus (90%) -> $0
      utility: 0.1*10,000 = $1,000
    In tails world:
      - if bonus (10%), then she has $10,000 (because she doesn't pay)
      - if no bonus (90%), then $0
      utility: 0.1*10,000 = $1,000
    Total EU: 0.5*1,000 + 0.5*1,000 = $1,000

  So ex ante, the policy of paying in the tails world has EU $8,955, while not paying has EU $1,000. So she would commit to paying.

  But at T1, in the tails world, she has the bonus or not. If she has the bonus, then by not paying she can have $10,000 instead of $9,900. And if she doesn't have the bonus, she has $0 and if she were to pay, she would be in debt? We assume she doesn't pay if she doesn't have the bonus.

  So in the tails world, if she has the bonus, she is tempted to not pay.

  This is the commitment problem.

  In our scenario, the bonus has already been given and is irrevocable. In the tails world, if the predictor predicted she would pay, she has the bonus. Then she is asked to pay. If she does not, she keeps the bonus. But then, ex ante, she would have wanted to commit to paying.

  For the seminar, we can use this. The agent at T0 would prefer the paying policy. But at T1 in the tails world, causal decision theory (CDT) would not pay.

  The benefit (bonus) has been disbursed at T0 and is irrevocable. The request for payment is at T1 in the tails world.

  We need to ensure that in the tails world, there are no other consequences. We have to close the loopholes.

  So let's build the scenario.

  **Scenario:**

  At the beginning of the year, the senior partners at Elena's law firm predict whether she would agree to donate $20,000 to a legal aid charity at the end of the year if a particular rare event (say, a designated pro bono case not materializing) does not occur. They base this prediction on a thorough review of her work, her emails about charitable giving, and an interview; we assume they are 90% accurate. If they predict she would donate, she receives a bonus of $50,000 immediately. The bonus is irrevocable. The rare event does not occur. Now, at the end of the year, the senior partners ask her to donate $20,000 as predicted. They assure her that the decision is completely private, will not be recorded, and will have no impact on her career or any future interactions. There are no observers, no reputation effects, and no second rounds.

  Loopholes closed in the scenario (one sentence each):

  1. **No observers**: The request is private and unrecorded.
  2. **No second round**: This is a one-time interaction with no future consequences.
  3. **No reputational effects**: The decision will not be shared with anyone.
  4. **No pre-commitment device**: Elena did not have an opportunity to publicly commit or use a commitment device.
  5. **No character consideration**: The decision is purely about the money; any effect on her character is to be ignored.

  Payoffs:

  - If she pays, she has $50,000 - $20,000 = $30,000.
  - If she doesn't, she has $50,000.

  Break-even accuracy:

  Let p be the accuracy of the predictor.

  Ex ante expected utility for the paying policy:

  - Probability of rare event occurring (heads): 0.5
    - She gets the bonus with probability p ( EU = p * $50,000 )
  - Probability of rare event not occurring (tails): 0.5
    - She gets the bonus with probability p, and then donates $20,000, so net $30,000.
    - So EU for tails: p * $30,000
  - Total EU (paying policy): 0.5 * p * 50,000 + 0.5 * p * 30,000 = 0.5p * 80,000 = 40,000p

  For the not-paying policy:

  - Probability of heads: 0.5
    - She gets the bonus only if the predictor predicts she would pay (but she doesn't), so probability of bonus is 1-p. EU = (1-p) * $50,000.
  - Probability of tails: 0.5
    - She gets the bonus with probability 1-p (since predictor predicts she won't pay, and if they are correct, no bonus; if incorrect, bonus). Then in tails, she doesn't pay, so if she has the bonus, she has $50,000.
    - EU for tails: (1-p) * $50,000.
  - Total EU (not-paying policy): 0.5 * (1-p)*50,000 + 0.5 * (1-p)*50,000 = (1-p)*50,000

  Set equal: 40,000p = 50,000 - 50,000p
  40,000p + 50,000p = 50,000
  90,000p = 50,000
  p = 5/9 ≈ 0.5556

  So break-even at about 55.56% accuracy. We assume 90%, which is well above.

  **Now, the agent is in the tails world. She has already received the bonus (because the predictor predicted she would pay). Should she pay?**

  Causal decision theory (CDT) in the tails world:
  - The bonus is already given and irrevocable. Her action of paying or not has no causal effect on the bonus. It only costs her $20,000.
  - CDT recommends not paying.

  Functional decision theory (FDT) / updatelessness:
  - FDT considers the agent's action as the output of a function that is evaluated in all possible worlds. In this case, the function is her policy. The policy that led to the bonus is the one where she pays in this situation. If she now does not pay, then ex ante, she would have been predicted to not pay and would not have gotten the bonus. But ex post, she has the bonus. However, FDT says to choose the action that is part of the best policy ex ante. The best policy ex ante is to pay in the tails world, which has EU 40,000 * 0.9 = 36,000, while not paying has EU 50,000 * (1-0.9) = 5,000. So she should pay.

  Evidential decision theory (EDT):
  - In the tails world, she has the bonus. Why does she have the bonus? Because the predictor predicted she would pay. So having the bonus is evidence that the predictor thinks she is the type that pays. If she pays, that is consistent with the prediction. If she does not pay, that is not consistent. But does that affect anything? In this setup, there are no future consequences. So the only effect is that paying costs $20,000. EDT would look at the conditional expected utility.

  Let W be the event that the predictor predicted she would pay.
  She has the bonus, so she knows W happened.

  She is in the tails world.

  If she pays, she has $30,000.
  If she does not, she has $50,000.

  EDT calculates:

  - EU(pay | in tails world and W) = Utility of having $30,000 = 30,000.
  - EU(not pay | in tails world and W) = Utility of having $50,000 = 50,000.

  Clearly, 50,000 > 30,000, so EDT says not to pay.

  To make EDT recommend paying, we need to add an XOR-style rig. We need to make it so that not paying is evidence that something bad happens. But in this case, what can it be?

  We can add that if the predictor is proven wrong, then in the heads world something bad happens. But that is not in the current world.

  Alternatively, in the tails world, if she does not pay, that is evidence that the predictor might have made a mistake in other predictions, but that could affect her future. But we closed future consequences.

  The minimal change: suppose that the predictor also manages a separate, orthogonal matter that affects the agent. For example, the predictor is also responsible for deciding whether to include her in a valuable networking event next year, and they will include her only if they believe their own prediction about her donation was correct. But this is a future consequence, which we have to avoid.

  We can make it so that the predictor's accuracy is the same for a past event that affected her. But that would be part of the bonus.

  Alternatively, we can make the bonus have two parts: the one she already received, and another one that is given conditionally on the prediction being correct. But that would be a second benefit.

  But we want the benefit to be already disbursed and irrevocable.

  So perhaps: the senior partners have already given her the bonus of $50,000. But if it turns out that the predictor was wrong, then they will not give her a separate, already planned bonus of $X next year. But that is a future consequence, which we are not allowed.

  To make EDT pay, we need an additional consequence that is evidenceally linked but not causally.

  We can add: the senior partners have a policy of being very upset if their prediction is wrong, and they might take it out on the agent in ways that are not officially recorded but which the agent would prefer to avoid. But that is vague and not allowed because we want no reputational or future consequences.

  Alternatively, in the spirit of the XOR blackmail, we can make the bonus have been given only if the predictor is correct in both worlds? But that doesn't make sense.

  Perhaps: the bonus was given conditionally on the predictor's prediction being correct. But then, in the tails world, if she does not pay, that means the prediction was wrong, and then the bonus might be clawed back. But we said the bonus is irrevocable.

  We are stuck. But for the seminar, we can note that EDT does not recommend paying in this setup, and to make EDT recommend paying, we would need an additional element that makes not paying evidence of some other bad outcome that is not causally related. For example, if there is a separate, already determined event that is bad and is evidenceally linked to the predictor's accuracy. But that might be too artificial.

  Perhaps: the predictor's accuracy is the same for a different, important prediction about the agent that has already affected her in the past. For example, the predictor also predicted whether she would win a valuable prize last year, and her winning that prize was based on that prediction. But then, in the tails world, if she does not pay, that is evidence that the predictor is inaccurate, which would be evidence that she did not deserve the prize last year. But that doesn't causally affect anything, but it might make her feel bad. But we are to consider only monetary payoffs.

  Alternatively, we can have a monetary loss: if the predictor is proven to be wrong in this instance, then it will be discovered that they were also wrong in predicting that she would win the prize, and then she will have to return the prize money. But that is a causal consequence.

  This is difficult within the constraints.

  For the sake of the problem set, we can leave EDT not paying and note that to make EDT pay, we would need to rig the case so that not paying is evidence that she will have to return the bonus or face a loss. But that would make the case an XOR blackmail.

  Alternatively, we can not worry about EDT and focus on CDT vs FDT.

  **Demonstration:**

  - CDT: In the tails world, the agent's action has no causal effect on the bonus or any future consequence. The only effect is to reduce her wealth by $20,000. Therefore, CDT recommends not paying.

  - FDT/Updateless: The agent should use the policy that maximizes expected utility from the ex ante perspective. The paying policy has an expected utility of 0.9 * 40,000 = 36,000 (using the above calculation with p=0.9), while the not-paying policy has 0.1 * 50,000 = 5,000. Therefore, the paying policy is better, and FDT recommends paying in the tails world.

  - EDT: In the tails world, conditional on having received the bonus (which means the predictor predicted she would pay), the expected utility of paying is $30,000 and of not paying is $50,000. There is no evidence that not paying will cause any harm, so EDT recommends not paying.

  To make EDT recommend paying, we would need a rig where not paying is evidence of a further loss. For example, suppose that the predictor's accuracy is the same as for a coin flip that determines whether she will lose a lawsuit for an unrelated matter. Specifically, if the predictor is wrong about her donation decision, then she will lose a lawsuit (and have to pay a large amount) because the predictor's inaccuracy is evidence that the coin flip for the lawsuit (which has already been made but not revealed) was also wrong. But this is convoluted.

  Minimal change: 

    In addition to the bonus, there is a separate matter: the predictor has made a prediction about the outcome of a lawsuit that affects Elena. The lawsuit has already been decided, but the outcome is not yet known. If the predictor was correct in the donation prediction, then she wins the lawsuit and gets $100,000; if incorrect, she loses and gets nothing. The lawsuit outcome depends on a coin flip that has already occurred, and the predictor's prediction of the coin flip is 90% accurate. The predictor's accuracy for the donation and for the lawsuit are the same and perfectly correlated (i.e., if they are wrong about the donation, they are wrong about the lawsuit).

    Then, in the tails world, if she does not donate, that is evidence that the predictor was wrong about the donation, which is evidence that they are also wrong about the lawsuit, which is evidence that she will lose the lawsuit and lose $100,000.

    So EDT will see:
      - If she pays, then the predictor was likely correct, so she is likely to win the lawsuit: EU = $30,000 + probability of winning * $100,000.
      - If she does not pay, then the predictor was likely wrong, so she is likely to lose the lawsuit: EU = $50,000 + probability of losing * $0.

    The probability of winning if she pays: 
      P(predictor correct | she pays) = P(pays | predictor correct) * P(predictor correct) / P(pays)
      This is messy. But note: if she pays, that is evidence that the prediction was correct, so evidence that she wins the lawsuit.

    Specifically, let C be the event that the predictor was correct about the donation.
    If she pays, then C is true (because she does what was predicted). 
    If she does not pay, then C is false.
    And the lawsuit outcome is the same as the donation prediction correctness? No, the lawsuit outcome is determined by a coin flip, and the predictor predicted the coin flip. But we said the predictor's accuracy is the same and perfectly correlated. So if the predictor was correct about the donation, they were also correct about the lawsuit, and she wins the lawsuit. If not, she loses.

    So:
      - If she pays, then C is true, so she wins the lawsuit: EU = $30,000 + $100,000 = $130,000.
      - If she does not pay, then C is false, so she loses the lawsuit: EU = $50,000.

    Then EDT would recommend paying.

    But this is an XOR blackmail because not paying is evidence of a further loss that is not caused by not paying.

    In our original scenario, we do not have that, so it is a counterfactual mugging and not an XOR blackmail.

    The structural difference: in the counterfactual mugging, the harm from not paying is only in the counterfactual world where the coin was heads (in our case, the heads world), and there is no additional harm in the tails world. In the XOR blackmail, there is an additional harm in the tails world that is evidenceally linked.

    In our scenario, the only harm from not paying is that in the heads world, she would not have received the bonus. But in the tails world, she has the bonus and would only lose the $20,000 if she pays.

    In the XOR-style rig, there is an additional harm (losing the lawsuit) in the tails world if she does not pay.

  **Load-bearing feature**: the benefit (bonus) is given in all worlds but conditionally on the policy, and the agent is now in the world where the policy's action is due, and there are no further consequences in this world.

  Removal tests:

  1. **If the agent chooses before the disbursement**: Then it becomes a standard decision under uncertainty. The agent chooses a policy, and the predictor uses that to determine the bonus. This is not a mugging.

  2. **If the predictor is still alive and reachable**: But in our case, the predictor is the senior partners, and they are not going to change the bonus. We have to ensure they don't. If the predictor could change the bonus based on her action, then it would be causal.

  3. **If a second round is added**: For example, if there might be a similar situation next year, then she might want to build a reputation. But we have closed that by having no observers and no record.

  The constraints that do the work are: the benefit is disbursed and irrevocable, the request is after with no causal consequences, and the prediction is about the counterfactual world.

  **Lines of attack for CDT**:

  1. The agent might not be sure of the predictor's accuracy. If she can doubt the accuracy, she might avoid paying.

  2. The agent might question whether the predictor's prediction was based on her actual policy or on something else. If the prediction was based on her character, then by not paying, she might be acting out of character, but we've excluded character considerations.

  **Honest note**: The scenario relies on the agent being able to reason about her ex ante expected utility and to commit to a policy. In the tails world, from her current perspective, paying is dominated. The scenario requires the agent to be motivated by the ex ante perspective even when she knows which world she is in. Some might find this unrealistic.
