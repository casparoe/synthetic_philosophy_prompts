prompt: |-
  Write me the specification for a cause-prioritization framework: the list of requirements any method for ranking giving opportunities has to meet to count as adequate, together with the case or consideration behind each requirement.

  I want the purpose fixed rather than left open. The framework is for a small foundation with a fixed pot and a roughly ten-year horizon, choosing between broad cause areas rather than between individual grants, and not assuming it can coordinate with, or even observe, other funders.

  I also want the requirements to do real work rather than restate the obvious, and in particular to settle the following, each of which the familiar importance / tractability / neglectedness scoring handles badly or not at all:

  - The three factors are not independent of one another: neglectedness largely shows up as a low price, and tractability per dollar already reflects how crowded a space is. So the framework must either derive all three from a single underlying quantity or show that combining them does not amount to counting the same consideration twice.
  - It must rank marginal dollars or marginal funding rounds rather than causes. As the foundation spends, the cheap opportunities inside a cause are used up, and the foundation's own spending can itself change how neglected and how tractable that cause is for the next dollar.
  - It must specify whose counterfactual the comparison is against: doing nothing, the next-best grantee, or the other funders whom the money displaces in cases where giving is substantially fungible.
  - It must handle non-additive returns, where the value of a cause depends on whether total spending crosses some threshold, so that the value of a given dollar is a function of what everyone else does.
  - It must remain usable under axiological uncertainty, where the evaluator is spread across totalist, averaging, and person-affecting views, and where some of the spread involves very small probabilities of very large payoffs.

  For each requirement, give the motivating case and mark whether it is non-negotiable or merely a preference of one camp. Flag any pair of requirements you suspect cannot be jointly satisfied, and say which single requirement excludes the largest share of what people actually use. Then, in a few sentences, how three-factor scoring, straight marginal cost-effectiveness analysis, and a portfolio or robustness-weighted expected-value approach each fare against the list.
reasoning: |-
  We are designing a cause-priortization framework for a small foundation with:
   - Fixed pot of money, 10-year horizon.
   - Choosing between broad cause areas (not individual grants).
   - Cannot coordinate with or observe other funders.

   The framework must meet the following requirements:

   1. **Integrated Factors (Non-negotiable)**: The framework must not double-count considerations. Specifically, it must either derive the factors (importance, tractability, neglectedness) from a single underlying quantity or demonstrate that combining them does not double-count. 
      *Motivation*: As noted, neglectedness often shows up as a low price (high tractability per dollar) because if a cause is neglected, each dollar goes further. Thus, treating them as independent factors leads to double-counting. This is non-negotiable because double-counting leads to biased rankings.

   2. **Marginal Analysis (Non-negotiable)**: The framework must rank marginal dollars (or marginal funding rounds) rather than entire causes. It must account for the fact that as the foundation spends, the opportunities within a cause become more expensive (diminishing returns) and that the foundation's spending may change the neglectedness and tractability of the cause for future dollars.
      *Motivation*: Without marginal analysis, we fail to account for the fact that the first dollar in a cause might be highly effective, but the millionth dollar might not. Also, our own spending can make the cause less neglected and hence less tractable per dollar for subsequent spending. This is non-negotiable because the foundation is making sequential decisions and must consider the impact of each marginal dollar.

   3. **Counterfactual Clarity (Non-negotiable)**: The framework must specify the counterfactual against which we compare. Options include: doing nothing, the next-best grantee, or other funders displaced (in cases of fungibility). 
      *Motivation*: The value of a grant depends on what would have happened otherwise. Without clarity, we might over- or under-estimate impact. For instance, if the foundation's grant displaces another funder, the impact is only the difference between what the foundation does and what the displaced funder would have done. This is non-negotiable because the counterfactual is central to impact assessment.

   4. **Non-Additive Returns (Non-negotiable)**: The framework must handle non-additive returns, i.e., situations where the value of a dollar depends on whether total spending in a cause crosses a threshold (e.g., a funding cliff or a step-function return). 
      *Motivation*: In reality, some interventions only work if they reach a critical mass of funding (e.g., a research project that requires $1M to start). Thus, the value of a dollar in a cause that is near a threshold is higher than one that is not. This is non-negotiable because without accounting for thresholds, we might miss crucial nonlinearities.

   5. **Axiological Uncertainty (Preference)**: The framework must remain usable under axiological uncertainty, where the evaluator is uncertain about moral weights (e.g., spread across totalist, averaging, and person-affecting views) and where some probabilities are very small but payoffs very large.
      *Motivation*: The foundation might have uncertainty about which moral view is correct. Moreover, some causes (like existential risk reduction) may involve tiny probabilities of enormous payoffs. The framework should be robust to such uncertainty. This is a preference (though a strong one) because while it is challenging, it may be possible to approximate without a full formal treatment.

   Potential Tensions:
   - **Marginal Analysis vs Non-Additive Returns**: Marginal analysis typically assumes smoothness and diminishing returns, but non-additive returns (threshold effects) are discontinuous. This might require modeling the entire funding path to see if thresholds are crossed, which complicates marginal analysis.
   - **Integrated Factors vs Axiological Uncertainty**: A single underlying quantity (like a utility function) might be hard to define under deep uncertainty about values. We may need to use a multi-objective or robustness approach.

   Which requirement excludes the most existing methods?
   - The requirement that excludes the largest share of existing methods is **Marginal Analysis**. Many frameworks (e.g., the three-factor scoring) evaluate causes at a fixed point without considering the diminishing returns and the effect of our own spending on the cause's characteristics.

   Now, how do three existing approaches fare?

   1. **Three-Factor Scoring (Importance, Tractability, Neglectedness)**:
      - Fails on **Integrated Factors** (double-counting between neglectedness and tractability).
      - Fails on **Marginal Analysis** (it's a static snapshot, doesn't account for how spending changes the cause).
      - Fails on **Counterfactual Clarity** (typically uses an undefined counterfactual, often "doing nothing" without considering displacement).
      - Fails on **Non-Additive Returns** (assumes linearity).
      - Partially fails on **Axiological Uncertainty** (can incorporate uncertainty by averaging, but without a structured way to handle extreme payoffs).

   2. **Straight Marginal Cost-Effectiveness Analysis (CEA)**:
      - Meets **Integrated Factors** (if done correctly, marginal CEA aggregates all factors into one metric, e.g., cost per life saved).
      - Meets **Marginal Analysis** (by definition).
      - May fail on **Counterfactual Clarity** unless the counterfactual is explicitly defined (e.g., in health interventions, it's often the next-best treatment, but in philanthropy, it might be displaced funding). It can be adapted to meet this requirement by specifying the counterfactual.
      - Fails on **Non-Additive Returns** (standard CEA assumes linear, additive returns).
      - Partially fails on **Axiological Uncertainty** (it requires a single utility function; without that, we need multi-dimensional CEA and a way to aggregate).

   3. **Portfolio or Robustness-Weighted Expected-Value Approach**:
      - Meets **Integrated Factors** (if we define a single utility function, but if we use multiple, then we avoid double-counting by having separate metrics).
      - Partially meets **Marginal Analysis** (it can incorporate marginal analysis by considering the marginal contribution to the portfolio, but it might require modeling the entire portfolio at once, which is complex).
      - May meet **Counterfactual Clarity** if the counterfactual is built into the impact model.
      - Meets **Non-Additive Returns** (by modeling the entire distribution of outcomes and thresholds, e.g., via Monte Carlo simulation).
      - Meets **Axiological Uncertainty** (by design: it can take a weighted average over moral views and use expected utility with risk aversion or robustness).

   However, note that the portfolio approach might struggle with **Marginal Analysis** in a dynamic setting because it typically optimizes a portfolio for the entire pot at once, not sequentially. But with iterative optimization (e.g., by simulating the spending path) it can be adapted.

   Revised Specification:

   We propose a framework that:
   - Uses a **marginal cost-effectiveness model** that explicitly defines the counterfactual (e.g., displacement-adjusted impact) and accounts for diminishing returns and threshold effects by modeling the cause's funding curve (including how our spending changes the cause's properties).
   - Incorporates **non-additive returns** by allowing the impact function to be a step function or S-shaped, and by using a simulation that tracks cumulative spending and thresholds.
   - Addresses **axiological uncertainty** by:
        a) Defining multiple scenarios for moral weights (e.g., totalist vs person-affecting) and for the probability of extreme outcomes.
        b) Using a robustness criterion (e.g., maximizing the minimum expected value across plausible views, or using a weighted average if probabilities can be assigned).
   - To avoid double-counting (**Integrated Factors**), the model should derive the impact per dollar from a unified model of the cause area, which already incorporates the current level of funding (neglectedness) and the diminishing returns (tractability) and the inherent importance.

   Example: 
     For a cause area, we define:
       - A funding curve: impact = f(total spending)
       - Which includes thresholds (e.g., if spending < T, impact=0; if spending>=T, impact = constant or increasing at a decreasing rate).
     We also model displacement: if we spend $X, how much does it displace? (e.g., if displacement rate is d, then the net additional spending is (1-d)X).
     Then the marginal impact of the next $X is f(current_total + (1-d)X) - f(current_total), adjusted for the counterfactual.

     Under axiological uncertainty, we run this model for each moral view and then aggregate (e.g., by taking the expected value over views, or by ensuring that the cause performs reasonably well across views).

   This framework is complex but meets the requirements. The main challenge is data: we need to estimate the funding curve and displacement rates for each cause.

   However, note that the requirement **Marginal Analysis** and **Non-Additive Returns** might be in tension because non-additive returns require us to look at the entire funding path to know if a threshold is crossed. We can handle this by:
     - For each cause, we model the impact of the next $X as a function of the current total funding and the threshold. If the next $X pushes the cause over a threshold, then the marginal impact is the entire step (minus the impact that would have been achieved without crossing the threshold). But note: if the threshold is large and our $X is small, we might not cross it. We must model the entire spending plan.

   Thus, we might need to plan the entire allocation for the pot (over 10 years) and then use backward induction or optimization to decide the sequence. This is computationally heavy. Alternatively, we can use a heuristic: if a cause is close to a threshold and we can push it over, then it gets a high priority for the next dollar.

   Given the foundation's size (small) and horizon (10 years), we can approximate by:
     - At the beginning of each year, reassess the state of each cause (current funding, threshold proximity) and allocate the year's budget to the causes that have the highest marginal impact in that year, updating the state after each allocation.

   This dynamic programming approach meets the requirements but requires iterative modeling.
answer: |-
  Below is a specification for a cause-prioritization framework meeting your criteria, with requirements, motivations, negotiability, tensions, and an analysis of existing approaches.

  ---

  ### **Specification: Cause-Prioritization Framework**  
  **Purpose**: Rank *marginal funding rounds* (not causes holistically) for a **small foundation** with:  
  - Fixed budget, 10-year horizon.  
  - Focus on broad cause areas (not individual grants).  
  - No coordination/visibility into other funders.  

  ---

  ### **Requirements**  
  1. **Unified Impact Model**  
     - *Requirement*: Derive importance, tractability, and neglectedness from a **single underlying quantity** (e.g., cost-effectiveness) or prove no double-counting.  
     - *Motivation*: Neglectedness lowers "price per unit of good," making tractability endogenous. Treating them separately counts the same factor twice (e.g., a vaccine program becomes less cost-effective as funding saturates).  
     - *Non-negotiable*: Yes. Double-counting invalidates rankings.  

  2. **Dynamic Marginal Analysis**  
     - *Requirement*: Evaluate *marginal dollars*, not causes. Model diminishing returns, opportunity depletion, and funding-induced changes to tractability/neglectedness.  
     - *Motivation*: The first $1M in a cause may yield 100 QALYs/$; the next $1M may yield only 10 QALYs/$ due to saturation. The foundation’s spending alters the cause’s landscape.  
     - *Non-negotiable*: Yes. Static models misallocate later funding rounds.  

  3. **Explicit Counterfactual Baseline**  
     - *Requirement*: Specify counterfactuals: doing nothing, next-best grantee, or displaced funders (if giving is fungible).  
     - *Motivation*: Impact = [Outcome with grant] – [Outcome in counterfactual]. Fungibility matters (e.g., if funding displaces another donor, impact is marginal difference).  
     - *Non-negotiable*: Yes. Ambiguity here leads to vast over/underestimation.  

  4. **Threshold-Aware Valuation**  
     - *Requirement*: Handle non-additive returns (e.g., step-function outcomes). Value of a dollar must depend on others’ actions and proximity to thresholds.  
     - *Motivation*: E.g., funding 49% of a $10M cancer trial has ~0 value; funding 51% unlocks the entire project.  
     - *Non-negotiable*: Yes. Linear models fail at critical junctures.  

  5. **Axiological Robustness**  
     - *Requirement*: Function under moral uncertainty (e.g., totalist vs. person-affecting views) and low-probability tail risks.  
     - *Motivation*: A foundation split between views (e.g., 60% weight on totalism, 40% on person-affecting) and tail risks (e.g., 0.1% chance of extinction risk reduction) needs consistent comparison.  
     - *Non-negotiable*: No (preference). Simpler frameworks may omit this but lose adaptability.  

  ---

  ### **Tensions & Trade-offs**  
  - **Key Tension**: **Dynamic Marginal Analysis** (Requirement 2) vs. **Threshold-Aware Valuation** (Requirement 4).  
    - *Why*: Marginal analysis focuses on local, linear changes; thresholds require global, path-aware optimization. Resolving this requires iterative simulation (e.g., Monte Carlo) of funding sequences.  
  - **Most Exclusionary Requirement**: **Dynamic Marginal Analysis** (Requirement 2).  
    - *Excluded*: >90% of existing frameworks (e.g., ITN scoring, naive CEA) that evaluate causes statically.  

  ---

  ### **Analysis of Existing Approaches**  
  1. **Three-Factor (ITN) Scoring**  
     - Fails Requirement 1 (double-counting: neglectedness ≈ low price → inflates tractability).  
     - Fails Requirement 2 (static cause evaluation).  
     - Fails Requirement 3 (ambiguous counterfactual).  
     - Fails Requirement 4 (assumes linear returns).  
     - Partial pass on Requirement 5 (can weight views but ignores dynamics).  

  2. **Straight Marginal Cost-Effectiveness Analysis (CEA)**  
     - Passes Requirement 1 (unified metric: e.g., cost per life saved).  
     - Passes Requirement 2 (if modeled dynamically).  
     - Fails Requirement 3 (rarely specifies counterfactual displacement).  
     - Fails Requirement 4 (assumes additivity).  
     - Fails Requirement 5 (requires single utility function).  

  3. **Portfolio/Robustness-Weighted Expected Value**  
     - Passes Requirement 1 (if based on unified welfare functions).  
     - Fails Requirement 2 (unless paired with dynamic CEA).  
     - Partial pass on Requirement 3 (possible but not standard).  
     - Passes Requirement 4 (handles non-linearities via scenario modeling).  
     - Passes Requirement 5 (explicitly models uncertainty across views/outcomes).  

  ---

  ### **Proposed Framework**  
  A **Dynamic Threshold-Aware CEA** with:  
  - **Unified metric**: Expected welfare gain per marginal dollar, adjusted for displacement (e.g., 40% of funds displace other donors).  
  - **Dynamic modeling**: Iterative simulation of funding paths over 10 years, updating cost-effectiveness as causes saturate.  
  - **Thresholds**: Monte Carlo scenarios for threshold probabilities (e.g., likelihood that $X in policy advocacy triggers reform).  
  - **Axiological uncertainty**: Welfare functions averaged over moral views (e.g., totalist vs. person-affecting), with fat-tailed risk adjustment.  

  **Trade-off**: Computationally intensive but feasible for broad cause areas and 10-year horizons. Requires estimating funding response curves and counterfactual displacement rates.
