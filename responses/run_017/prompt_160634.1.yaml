prompt: |-
  I'm writing a reading note for a graduate seminar on Dewey's experimentalism — the idea, as I'm reading him, that democracy is not merely one form of government among others but the political shape that inquiry takes when it is conducted in common — and I keep failing at the same sub-task. Intuitively, "experimental" cannot simply mean "tried out and then adjusted," because plenty of thoroughly undemocratic arrangements do that; but whenever I try to say what else is required, I end up either with something so demanding that nothing real qualifies, or with something so thin that a marketing A/B test qualifies. My supervisor has spent years handing down off-the-cuff verdicts on examples, and I have been writing them down. She also has a visible allergy to the phrase "evidence-based policy," which I take to be a clue, though I cannot say to what. Her rulings so far: a school district in which teachers and parents spent a year arguing about what the problem even was, two reading programs were then assigned to matched schools, results were published, and the district went on to reopen the question of what reading well consists in — experimental, without hesitation. A statewide initiative imposing a supermajority requirement for tax increases, passed after a well-funded campaign, containing no review provision and defended by its authors as a permanent correction to a known bias in legislatures — not experimental, on the grounds that this is a doctrine with a ballot attached. A city zoning ordinance preceded by eight months of genuine town halls and then never revisited, the council treating the town halls as having settled the matter — not experimental. A health department that randomized two appointment-reminder messages, measured attendance, published a working paper, rolled out the winner nationally and then declared the question closed for a decade, with no patient or staff involvement in framing the question and the attendance target never itself questioned — not experimental. And a housing authority that meets quarterly with a tenant union to review how a rent-relief rule is working, proceeding on residents' testimony that is minuted and published rather than on any formal measurement, revising the rule repeatedly and at one point redefining what would count as its working — experimental, and more warmly than the school district.

  The case I actually care about is a live proposal in our city, and I need to predict her reaction before I present it. A public employment agency wants to replace its fixed schedule of caseworker contact with an adaptive allocation system: a learning algorithm continuously re-randomizes claimants across different intensities of support and reallocates effort toward whichever variant is currently producing the highest rate of employment at six months, updating weekly. Everything is logged, and a public dashboard reports the current allocation and its measured effects. Claimants are not told they are in an allocation and no claimant body has been consulted; the six-month employment target is written into the enabling statute, and the agency says it has no authority to reconsider it, though the statute sunsets in five years with a mandatory legislative review. A claimants' advocacy group has been given access to the dashboard and publishes its own readings of it, but has no formal role. Her verdicts seem to me jointly consistent with several different rules, and they come apart here: one that requires only that consequences be systematically observed, fed back into the practice, and made public, with no point at which inquiry is declared finished; one that additionally requires that the people affected be parties to fixing the problem and reading the results; and one on which the test is whether the end is itself held revisable rather than given, so that optimizing means toward a fixed end would not count.

  What I would like is a reconstruction rather than your own view of Dewey. Set out the candidate rules that fit her track record equally well, say what each of them predicts about the employment-agency proposal, and give me your best guess at her verdict with your reasons for preferring that reading — tell me which of her past verdicts is doing the most work in your reconstruction, and tell me honestly if the track record is better explained by her having been inconsistent than by any single rule, and if so which verdict is the outlier. Then name the one further case you would put to her to force the surviving readings apart, and what she would have to say about it to confirm each. If her precedents genuinely leave the new case open, say which principle she would be committing herself to with each answer; I would much rather she commit to something explicitly than let the word "experimental" go on doing its work by sounding vaguely complimentary.
reasoning: |-
  Okay, the user is working on a reading note for a graduate seminar about Dewey's experimentalism, specifically the idea that democracy is the political form of inquiry conducted collectively. They're struggling to define what makes something "experimental" beyond just trying things out and adjusting, because undemocratic systems can do that too. They've collected several rulings from their supervisor on various cases and need to predict how their supervisor would judge a public employment agency proposal using an adaptive algorithm for caseworker support.

  The user has provided five examples with their supervisor's judgments:
  1. School district reading program: Experimental
  2. State supermajority tax requirement: Not experimental
  3. City zoning ordinance: Not experimental
  4. Health department A/B test: Not experimental
  5. Housing authority with tenant union: Experimental

  The key case they care about involves a public employment agency using a learning algorithm to randomize claimant support, with a dashboard but no claimant involvement and a fixed six-month employment target.

  I need to reconstruct possible rules from the supervisor's past verdicts that would fit all these cases. The rules should explain why some cases were deemed experimental and others weren't. Then, apply these rules to the new proposal to predict the supervisor's verdict. After that, identify which past verdict is most influential in the chosen reconstruction. If the rulings seem inconsistent, point that out and suggest an outlier. Finally, propose a new test case to distinguish between the surviving interpretations.

  First, looking at the supervisor's rulings, I notice a pattern. The experimental cases involve ongoing inquiry where the problem definition and goals are revisable by the affected community. The non-experimental cases either fix the ends permanently or lack inclusive participation in the inquiry process.

  Possible rules that fit the track record:

  1. **Inquiry Openness Rule**: An arrangement is experimental only if there's no fixed endpoint where inquiry is declared finished. Consequences must be systematically observed, fed back into practice, and made public indefinitely.

  2. **Participatory Problem-Solving Rule**: Additionally requires that affected parties co-define the problem and interpret results. The community must be involved in framing the question and assessing outcomes.

  3. **Revisable Ends Rule**: Requires that the ends (goals) themselves are held revisable, not just the means. Optimizing means toward a fixed end doesn't count as experimental.

  Now, applying these to the employment agency proposal:

  - **Inquiry Openness Rule**: The proposal has continuous feedback, public data, and a sunset clause suggesting potential revisability. This might lean toward experimental.

  - **Participatory Problem-Solving Rule**: Claimants aren't consulted in framing the problem or interpreting results; they're subjects rather than participants. The advocacy group has access but no formal role. This suggests not experimental.

  - **Revisable Ends Rule**: The six-month employment target is fixed by statute and not revisable by the agency. Optimization is only of means toward this fixed end. This strongly suggests not experimental.

  Considering the supervisor's past reactions, the Revisable Ends Rule seems most consistent. The health department A/B test was rejected despite systematic measurement because the end (attendance target) wasn't questioned. Similarly, the supermajority requirement was a "permanent correction," showing fixed ends. The housing authority case was experimental partly because they redefined what "working" meant, showing revisable ends.

  The strongest evidence comes from the health department case, where measurement and adjustment occurred, but the fixed target and lack of end-revisability made it non-experimental. This parallels the employment agency's fixed employment target.

  The outlier might be the school district case. If the Revisable Ends Rule is primary, the school district's reopening of "what reading well consists in" shows end-revisability, making it experimental. But if the Participatory Rule were paramount, the school case had teacher and parent involvement, which the employment proposal lacks. However, the health department case had no participation and fixed ends, making it non-experimental, which aligns with both the Participatory and Revisable Ends Rules. The school case supports Revisable Ends because they questioned the goal itself.

  For a test case to distinguish the rules: Imagine a military unit using A/B testing on training methods, with continuous feedback and public data, but no trainee involvement and fixed goals. The Revisable Ends Rule would still reject it if ends are fixed, while the Participatory Rule would reject it due to lack of involvement. To separate them, a case where ends are revisable but without participation: e.g., a corporation letting an algorithm adjust workplace policies based on productivity metrics, with a committee redefining "productivity" quarterly but no employee input. If the supervisor calls this experimental, Revisable Ends is key; if not, Participation is essential.

  In the employment case, the fixed statutory target and lack of claimant agency in redefining success suggest the supervisor would rule it not experimental, aligning with the Revisable Ends interpretation.
answer: |-
  Based on your supervisor's track record, I reconstruct three candidate rules that jointly explain her verdicts. Each fits all five cases, but they diverge when applied to your employment-agency proposal. I then predict her verdict, identify the most decisive precedent, and propose a test case to resolve ambiguity. My reconstruction prioritizes internal consistency in her rulings—no outlier is needed—but I note where tension exists.

  ### Candidate Rules Fitting All Five Precedents
  1. **The Inquiry Openness Rule**  
     An arrangement is experimental iff:  
     (a) Consequences are systematically observed and fed back into practice;  
     (b) Inquiry has no fixed endpoint (it is "open");  
     (c) Process and results are public.  
     *Why it fits all cases*:  
     - School district: Met (a)-(c); reopened inquiry.  
     - Supermajority law: Failed (b); "permanent correction" declared.  
     - Zoning ordinance: Failed (b); "settled" with no revisiting.  
     - Health department: Failed (b); "question closed for a decade."  
     - Housing authority: Met (a)-(c); continuous revision.  

  2. **The Participatory Problem-Solving Rule**  
     An arrangement is experimental iff:  
     (a) Consequences are systematically observed and fed back;  
     (b) Inquiry is open;  
     (c) **Affected parties co-define the problem and interpret results** (not just receive feedback).  
     *Why it fits all cases*:  
     - School district: Teachers/parents argued over "what the problem was."  
     - Supermajority law: No affected-party co-definition; "doctrine with a ballot."  
     - Zoning ordinance: Town halls occurred but treated as settlement, not ongoing interpretation.  
     - Health department: No patient/staff involvement in framing or interpretation.  
     - Housing authority: Tenants testified, influenced redefinition of "working."  

  3. **The Revisable Ends Rule**  
     An arrangement is experimental iff:  
     (a) Consequences are systematically observed and fed back;  
     (b) Inquiry is open;  
     (c) **Ends (goals/targets) are held revisable**, not just means.  
     *Why it fits all cases*:  
     - School district: Reopened "what reading well consists in" (end revisable).  
     - Supermajority law: Defended as "permanent correction" (end fixed).  
     - Zoning ordinance: Ends (zoning goals) never revisited.  
     - Health department: Attendance target "never questioned" (end fixed).  
     - Housing authority: Redefined "what would count as working" (end revisable).  

  ---

  ### Prediction for the Employment-Agency Proposal
  - **Inquiry Openness Rule**: **Experimental**.  
    *Why*: Feedback loop (weekly updates), public dashboard, sunset clause implies non-fixed endpoint (b). Fails only if "mandatory review" is seen as endpoint, but continuous adjustment suggests openness.  
  - **Participatory Rule**: **Not experimental**.  
    *Why*: Claimants are subjects, not co-inquirers. Advocacy group access ≠ co-defining problem/interpreting results (they react, not collaborate). No claimant involvement in framing "problem" or questioning the target.  
  - **Revisable Ends Rule**: **Not experimental**.  
    *Why*: Six-month employment target is fixed by statute; agency claims no authority to reconsider it. Optimizing *means* (support intensity) toward a given end.  

  **My Prediction**: **She will rule it NOT experimental**, leaning most heavily on the **Revisable Ends Rule**.  

  #### Why This Reading & Key Precedent  
  - **Strongest evidence**: The **health department A/B test** verdict.  
    - Parallels: Both involve randomization, measurement, and adjustment of means (reminder messages/support intensity). Both fix the end (attendance target/employment rate) and exclude affected parties from inquiry. Her rejection of the health case as non-experimental—despite systematic feedback—signals that optimizing means toward a fixed end is insufficient.  
  - **Supporting precedent**: The **supermajority law** and **zoning ordinance** were rejected for "closing" inquiry, but the health case is more analogous (technical adjustment + fixed ends). The housing authority case (revisable ends) contrasts sharply.  
  - **Why not other rules?**  
    - *Inquiry Openness* is necessary but insufficient: The health case had openness in means-adjustment but failed.  
    - *Participatory Rule*: While relevant (lack of claimant involvement hurts the proposal), the health case didn’t rely solely on this (no participation *and* fixed ends).  

  **Consistency Check**: The rulings are **jointly consistent** under the Revisable Ends Rule. No outlier exists, but the school district case is the "boundary pusher": it satisfies all three rules, making it the clearest yes. The health case is the clearest no for the proposal.  

  ---

  ### Test Case to Force a Decision Between Rules  
  To disentangle the Revisable Ends and Participatory Rules, propose:  
  > *A corporate warehouse uses sensors and algorithms to A/B test ergonomic interventions (e.g., floor mats vs. exoskeletons) to reduce back injuries. Workers are not consulted; injury-reduction targets are set by management. However, a worker-data collective publishes independent analyses, and management commits to quarterly reviews of the injury target itself based on data.*  

  - **If she says NOT experimental**: The **Participatory Rule** is decisive.  
    *Reason*: Affected parties (workers) are still excluded from co-defining the problem/ends, despite ends being revisable by management. This aligns with her zoning ordinance verdict (town halls occurred but no ongoing co-inquiry).  
  - **If she says experimental**: The **Revisable Ends Rule** is decisive.  
    *Reason*: Ends (injury targets) are revisable, and systematic feedback occurs. This would mirror the school district case, where ends were revisited without explicit participatory framing.  

  **Why this case?** It splits the participatory and ends-revisability dimensions: ends are flexible but parties excluded. Her answer reveals whether ends-revisability alone suffices (Revisable Ends Rule) or if participation in inquiry is essential (Participatory Rule).  

  ---

  ### Conclusion: Commit to a Principle  
  Your supervisor’s allergy to "evidence-based policy" likely stems from its tendency to fix ends (e.g., "employment rate") and reduce inquiry to technical optimization—exactly the pitfall in the health department and employment-agency cases. Her precedents point to Dewey’s core: experimentalism requires that *ends emerge from and evolve with public inquiry*, not predefine it.  

  For your proposal, predict a **"not experimental" verdict** due to the **fixed statutory end**. If she surprises you, the test case above will force clarity. Press her to reject either the Revisable Ends Rule (health department precedent) or Participatory Rule (housing authority warmth) explicitly—this will prevent "experimental" from being a vague compliment and ground your reading note in her operationalized Dewey.
