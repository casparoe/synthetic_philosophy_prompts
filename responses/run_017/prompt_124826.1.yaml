prompt: |-
  You're a political philosopher — democratic theory, legitimacy, that whole shop — and I need you to actually work this out rather than hand me a menu. Before you answer, spend some time brainstorming in the background: sketch two or three candidate principles, try to break each of them against my list of cases, and only then commit to the one you think survives and argue for it. And be straight with me about where you're confident and where you're guessing, because I'm going to build a scene on whatever you give me.

  I'm a novelist and I've written myself into a hole. The book is set in Saltmarch, a invented city-state of about forty thousand on a tidal estuary — so nothing here has to match the real world. Everything is settled once a year at the Meeting, by show of hands, and the franchise when the book opens is "hearth-holders": anyone registered as keeping a hearth and paying the hearth tax inside the walls. The crisis is a proposal to build a sea-gate, funded by a hundred-year bond, which will permanently flood the moorings where the barge-dwellers live. The plot turns on who gets a hand at that Meeting, and I want the argument underneath it to be something a reader feels in their gut rather than a slogan. So here are my gut verdicts, then the rule I've been trying to make work.

  1. The moorings people: families who live on barges tied up inside the city's jurisdiction nine or ten months a year, no hearth, no tax, but the harbourmaster's law runs against them and the gate destroys their homes. They vote. Very sure.
  2. A hearth-holder who has lived abroad twenty-two years running a shipping business, keeps a house and two servants in the city, visits one month a year, intends to retire and die there. He does not vote. Very sure, and I can't quite say why.
  3. His granddaughter, nineteen, born in the city, away at university in another country for a three-year degree, definitely coming back. She votes. Fairly sure.
  4. A twelve-year-old born in the city who will still be paying off the bond at fifty. Does not vote — but this one makes me uneasy in a way 2 doesn't.
  5. A woman eighteen months into a two-year fraud sentence in the city gaol: a hearth-holder, out before the gate is finished, will live behind it for the rest of her life. She votes. Mildly sure.
  6. The Wardens of the Slack, a religious order living inside the walls who maintain the sluices: subject to city law like everyone else, but they've vowed obedience to their abbot and insist they hold no view on the city's business, and would vote as a bloc however he told them. My gut says no — and I worry that I'm just punishing them for their religion, which would make me a hypocrite.
  7. A lifelong resident with advanced dementia, who will spend her remaining years inside the walls looking at the gate and can no longer follow an argument. My gut says no. But I can't articulate why this is different in kind from 4 rather than just sadder, and that bothers me.
  8. The unborn — most of the people who'll live with a hundred-year bond don't exist yet. My gut says they have some real claim but that a vote is the wrong instrument for it, and I genuinely go back and forth on what the right instrument would be.

  The rule I keep trying to make work is: you get a hand at the Meeting if the decision can be enforced against you and you're the kind of being that can have a view about whether to obey it. That gets 1, 3, 4, 5 and 7 roughly where my gut puts them, but it also lets 2 in (the city can seize his house; he has views in abundance) and it lets 6 in (they can be made to obey and they obviously could have views, they've just promised not to), and it has nothing at all to say about 8. I've tried patching it with something like "and whose life is bound up with the city's life going forward" — which feels right but definately sounds like a way of smuggling my verdict on 2 inside the principle rather than deriving it.

  So: take my rule, or throw it out and start again. Tell me which of my verdicts you'd overturn rather than build a baroque principle to save it, and why. Give me the cases your principle decides that aren't on my list — one of them should be a case I haven't thought of and will need, ideally something to do with the tide-dwellers who are only inside the jurisdiction three months a year. And if you can, give me a one-line version of the finished principle that a character could say out loud at the Meeting without sounding like a lecture.

  Oh — British English throughout, please. My editor is very annoying about it.
reasoning: |-
  Okay, the user is a novelist stuck on a political philosophy problem for their book set in Saltmarch. They need a democratic principle to determine voting rights for their annual Meeting, especially regarding the sea-gate decision. They've listed eight cases with their gut verdicts and a rule they tried that doesn't quite work. 

  First, I need to unpack their current rule: "you get a hand if the decision can be enforced against you and you can have a view about obeying it." It fails on cases 2 (absentee owner) and 6 (monastic order), and ignores 8 (future generations). Their patches feel ad hoc. 

  Their gut verdicts reveal deeper intuitions: 
  - Presence matters (1, 3, 7) but isn't absolute (2 fails despite property) 
  - Autonomy is key (6 excluded despite capacity) 
  - Future claims exist but voting isn't the tool (8) 
  - Children (4) feel different from dementia (7) – probably because children will gain capacity 

  Hmm. Three candidate principles come to mind: 
  1. **Continuous co-presence principle**: Vote requires physical presence + subjection to laws during the decision's impact period. Solves 2 (absent) and 7 (incapacitated) but fails 3 (student abroad) and 4 (child future impact). Too rigid. 
  2. **Autonomous stakeholding**: Vote requires both stake in outcomes AND independent judgment. Handles 6 (vows negate autonomy) and 7 (dementia negates judgment) but struggles with 4 (child has stake despite current incapacity) and risks excluding 1 (barge-dwellers might be seen as lacking "stake" if defined narrowly). 
  3. **Enduring membership principle**: Vote requires being an active participant in the community's collective life, with capacity to shape/reason about shared future. 

  Testing #3 against their cases: 
  - **1 (barge-dwellers)**: In. They're enmeshed in daily city life despite no hearth. 
  - **2 (absentee owner)**: Out. His life isn't intertwined with Saltmarch's rhythm. 
  - **3 (student)**: In. Temporary absence doesn't break membership. 
  - **4 (child)**: Out. But the unease points to needing separate protections (e.g., guardians advocating for minors' interests). 
  - **5 (prisoner)**: In. She remains a participating member despite temporary status loss. 
  - **6 (monks)**: Out. Their vow suspends political agency, making them subjects not participants. 
  - **7 (dementia)**: Out. Lacks capacity for political reasoning. 
  - **8 (unborn)**: No vote, but principle implies duty to consider them via mechanisms like debt limits. 

  Ah, the tide-dwellers case they requested: Seasonal workers living in Saltmarch 3 months/year. Under this principle, they'd likely be out – their primary community is elsewhere. That feels right for the story's tension. 

  Where I'm guessing: 
  - Whether "enmeshed in collective life" is measurable enough. But for fiction, evocative standards beat rigid rules. 
  - The prisoner case (5) could go either way, but including her maintains the "all current lives" scope. 

  One-liner for the Meeting: *"Your hand shapes Saltmarch only if Saltmarch shapes your daily life and you can weigh its tomorrow."* 

  Would overturn their verdict on case 4 (child votes) to preserve coherence, but channel that unease into showing how the bond debate forces adults to confront intergenerational ethics. The monks' exclusion isn't anti-religious – it's about their voluntary surrender of political will. 

  This should give them the philosophical backbone for gut-level reader resonance. The tide-dwellers example adds texture to the barge-dwellers' plight by contrast. Time to argue it straight.
answer: |-
  Right, let's dig in properly. I'll sketch three candidate principles, pressure-test each against your cases (and some new ones), then commit to the one that holds. I'll flag where I'm building on rock and where on sand. Your gut verdicts are our bedrock – if a principle violates one, it fails unless we agree to overturn it.

  **Brainstorming Three Candidate Principles:**

  1.  **The Enforceable Obligation Principle (Your Starting Point):** Franchise requires that the polity can enforce its decisions against you *and* you have the capacity to form a view on obedience.
  2.  **The Continuous Presence & Burden Principle:** Franchise requires habitual physical presence within the jurisdiction *during the relevant period* AND being subject to the burdens/benefits of common civic life (law, taxes, infrastructure use).
  3.  **The Enduring Membership & Autonomous Stake Principle:** Franchise requires being an enduring member of the political community whose daily life is actively shaped by its collective decisions *and* possessing the autonomous capacity to reason about the common good.

  **Pressure Testing Against Your Cases & New Ones:**

  *   **Principle 1 (Enforceable Obligation):**
      *   **Passes:** 1 (enforceable law, capacity), 3 (ditto), 4? (enforceable against future self? Capacity?), 5 (enforceable, capacity), 7? (enforceable, capacity debatable).
      *   **Fails:** 2 (Clearly lets him in - enforcement via property seizure, obvious capacity. Violates your gut). 6 (Lets them in - enforceable law, clear capacity to form views (they *could*, they *choose* not to autonomously). Violates your gut). 8 (No mechanism - fails).
      *   **New Case: Tide-Dwellers:** Live on tidal flats inside jurisdiction only 3 months/year during spring tides, pay transient mooring fees, fish local waters. Enforceable? Yes (harbourmaster). Capacity? Yes. **Verdict:** Votes. *Problem:* Feels wrong. Their primary life, community, and burdens are elsewhere most of the year. Your rule lets them shape Saltmarch's permanent future with minimal enduring stake.

  *   **Principle 2 (Continuous Presence & Burden):**
      *   **Passes:** 1 (Presence? 9-10 months solid, burdened by law. **Votes**), 3 (Presence? Habitual residence interrupted temporarily, burden continues via ties/property. **Votes**), 4 (Presence? Yes. Burden? Yes. But capacity? **Votes** - *overturns your gut*), 5 (Presence? Gaol counts, burdened by law. **Votes**), 7 (Presence? Yes. Burden? Yes. Capacity? **Votes** - *overturns your gut*).
      *   **Fails:** 2 (Presence? 1 month/year isn't 'habitual'. **No Vote** - passes!), 6 (Presence? Yes. Burden? Yes (law, infrastructure). **Votes** - violates gut. No exclusion mechanism). 8 (Presence? No. **No Vote** - passes, but silent on claim).
      *   **New Case: Tide-Dwellers:** Presence? Only 3 months/year - likely not 'habitual'. Burden? Minor fees, transient law application. **Verdict:** No Vote. *Better.*
      *   **Weakness:** Crudely excludes 4 & 7 (children/dementia) based purely on presence/burden, ignoring capacity. Forces you to overturn those gut verdicts. Why is the student (3) 'habitually present' but the absentee (2) isn't? Feels arbitrary without a capacity element.

  *   **Principle 3 (Enduring Membership & Autonomous Stake):** This focuses on being woven into the fabric of the city's *ongoing collective life* and having the *independent capacity* to engage politically.
      *   **Passes:** 1 (Barge-dwellers: Deeply enmeshed in daily city life, economy, law, community. Autonomous. **Votes**). 2 (Absentee: Minimal daily enmeshment; life, work, primary concerns elsewhere. **No Vote**). 3 (Student: Temporary absence; roots, intended return, likely current ties (family, property?) show enduring membership. Autonomous. **Votes**). 5 (Prisoner: Enduring member (pre/post gaol), life bound to city, autonomous capacity returns. **Votes**). 6 (Monks: Physically present, subject to law, BUT vows surrender *autonomous political agency* to the Abbot. They are subjects, not participating members. **No Vote** - *justified non-religious exclusion*). 7 (Dementia: Enduring member, but lacks *capacity for autonomous political reasoning* about the common good. **No Vote**).
      *   **Fails (Initially):** 4 (Child: Enduring member, life bound to city, but lacks *current autonomous capacity* for complex political reasoning about a 100-year bond. **No Vote** - passes gut, but unease remains). 8 (Unborn: Enduring future membership? Yes. But no current existence or capacity. **No Vote** - passes gut, silent on claim).
      *   **Addressing the Unease (4 & 8):** The principle *excludes* the child and unborn from voting, which matches your gut. The unease is *separate* - it's about the *weight* given to their interests *within* the decision-making process by those who *do* vote. The principle doesn't ignore them; it demands voters consider the impact on future members and those without voice *as part of reasoning about the common good*. The bond's duration itself becomes a key argument *against* it voiced by voters thinking intergenerationally. The child is represented *through* their guardians/family/community advocates in the debate, even without a direct vote.
      *   **New Case: Tide-Dwellers:** Enduring membership? Unlikely. Their primary life, community, and political concerns are elsewhere. Saltmarch is a seasonal resource, not their polity. Autonomous? Yes. **Verdict:** No Vote. *Feels right.* Highlights the barge-dwellers' deeper enmeshment.

  **Committed Principle: Enduring Membership & Autonomous Stake**

  This survives your gut verdicts best, requiring only that we hold firm on the child (4) not voting – channeling the unease into how the living voters *must* grapple with the future. It cleanly excludes the absentee (2) and monks (6) for substantively different reasons, handles the prisoner (5) and student (3), and distinguishes capacity loss (dementia) from future capacity (child). It also gives us the tide-dwellers exclusion.

  **Where I'm Confident:**
  *   This cleanly separates the absentee (2) from the student (3) and barge-dwellers (1) based on depth of enmeshment, not just property or fleeting presence.
  *   It provides a strong, non-religious reason to exclude the monks (6): the voluntary surrender of political autonomy.
  *   It distinguishes the dementia case (7) from the child (4): one lacks current capacity irrevocably, the other will develop it.
  *   It explains why the barge-dwellers (1) *should* vote: their lives are fundamentally constituted by Saltmarch's daily rhythms and laws, hearth or not.
  *   It handles transient populations like tide-dwellers intuitively.

  **Where I'm Reasoning, Maybe Guessing:**
  *   **The Student (3):** Is 3 years away 'temporary' enough for 'enduring membership'? I think yes, especially with clear intent to return and likely ongoing ties (family home, city identity). But if she severed all ties, intent uncertain, it *might* tip. Your gut says vote, so we lean in.
  *   **The Prisoner (5):** Is 18 months in gaol enough to break 'enduring membership'? I argue no – it's a temporary suspension within an ongoing life bound to the city. But if her sentence was life, it *might* be different. Your mild surety suggests inclusion works.
  *   **The Child (4) Unease:** I'm confident excluding the vote is correct by the principle. I'm *reasoning* that the unease is best addressed *within* the deliberation of voters (e.g., parents arguing the bond is immoral theft from their children) and perhaps procedural safeguards (supermajority for very long-term debt?), not by giving children votes. This feels philosophically sounder than stretching the franchise.
  *   **The Unborn (8):** Same as above. No vote, but the principle implies a *duty* on voters to consider them. How *effectively* Saltmarch does this is a source of narrative tension. Perhaps the bond requires a 2/3 majority? That's a political fix, not a franchise one.

  **Overturned Verdict?** Only if you count holding firm on **4 (the child not voting)** as 'overturning' your unease. The principle *demands* this exclusion based on capacity. The gut unease is valid but points to a different problem (intergenerational justice *within* decision-making), not a franchise error.

  **The One-Liner for the Meeting:**

  > **"Your hand shapes Saltmarch only if Saltmarch shapes your daily life and you can weigh its tomorrow."**

  *   **Saltmarch shapes your daily life:** Captures *enduring membership* and enmeshment (excludes absentee, tide-dwellers, arguably monks as non-participating).
  *   **You can weigh its tomorrow:** Captures *autonomous stake* and capacity to reason about the future common good (excludes young child, dementia, unborn; includes student, prisoner, barge-dwellers).

  This line roots the franchise in lived experience and reasoned participation, not just property or enforceability. It’s visceral, memorable, and cuts straight to the heart of why the barge-dwellers belong at the Meeting and the absentee doesn't. It gives your characters something to fight *with* and *about*. Good luck with the sea-gate vote – it sounds like Saltmarch won't be the same afterwards.
