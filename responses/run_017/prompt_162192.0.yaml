prompt: |-
  I'm a backend engineer by trade — no formal training in philosophy or political science — and on evenings and weekends I volunteer as one of the maintainers of a small open-source project: a hand-curated public dataset that logs discrete institutional changes in roughly forty countries and tags each one as democratic backsliding, ordinary reform, democratic deepening, or unclear. We have about twelve volunteer annotators (mostly software people, one retired lawyer, two grad students), we make several hundred of these calls a year, and because the dataset is public and gets cited by journalists and occasionally by NGO reports, a sloppy tag does real damage — not abstract harm, but "someone's country gets called a backsliding democracy in print because a volunteer was having a bad Tuesday." Our current codebook is essentially a page of adjectives, and it shows: inter-annotator agreement sits around 0.5 on Cohen's kappa, and the same measure gets coded differently depending on whether the annotator happens to approve of the government that passed it. A friend in grad school told me, only half-jokingly, that our tag is drifting into being a partisan insult with a database schema, and I don't have a principled reply to that.

  So I want a coding protocol I can actually hand to an annotator: an ordered sequence of tests to run on a single proposed entry, each with an explicit statement of what counts as passing it, an explicit early exit for "this is not backsliding, stop," and an explicit escalation to a human editor at the point where the remaining question is one of values rather than facts. Assume the annotator has twenty minutes, a search engine, no country expertise, and no ability to do deep archival research; the protocol has to say what to do when the evidence simply isn't there (and I'd rather it record "insufficient evidence" honestly than infer from vibes). Assume also that the output of the protocol is a structured record: a tag, a one-line justification, a confidence level, and a note saying which test decided the call — because I want to diff those notes when we version the codebook.

  A few things I specifically need the protocol to handle, and on which I want you to take a position rather than offer me a menu. First, the unit-of-analysis problem: most of the changes we see are trivial in isolation and only mean something as part of a sequence, and I don't have a rule for when several small measures should be coded as one event — I've been toying with something like a linkage rule (same governing coalition passed them, and each one lowers the cost or raises the payoff of the next), so refine or replace that. Second, and this is the part that worries me most: I need the protocol to make an annotator actually run a symmetry check rather than assert that they are being even-handed — my current idea is a swap test where the measure is paraphrased with country and party names stripped, coded blind, and only then unblinded, with a defined consequence for a mismatch, but I'm not sure it survives contact with real annotators. Third, the consent problem: what do we do with a change that genuinely had majority support or passed a referendum that observers consider broadly fair — is popular mandate a defence, and if not, why not? Fourth, the baseline problem: at what point is a country already below the line such that further changes are not backsliding but something else, and what tag should we use then? Fifth, I want a distinction we don't currently have between a power that has merely been granted on paper and one that has actually been exercised against an opponent, with a rule for how to code the latent case.

  Please apply the finished protocol to four cases: the Hungarian constitutional and electoral changes of the early 2010s, the Polish judicial reforms after 2015, the Turkish constitutional referendum of 2017, and a mid-decade US state-level change of the sort we get dozens of submissions about — say a state legislature moving authority over election administration away from an independent body to itself, or replacing a redistricting commission's output with its own map. One of these should come out as an answer I won't like; I'm American, I expect to dislike at least one verdict, and I want you to name which one you think that is and refuse to soften it. Then tell me, concretely, what the protocol cannot do — the two or three kinds of case where it will misfire or where no amount of procedure removes the need for judgment — and where you yourself are least confident.

  Be committed throughout: make the contested calls, give your reasons, and where a reasonable annotator or a strand of the comparative-politics literature would disagree with you, say plainly that you think they are wrong and why, rather than presenting the disagreement as an open option. Please structure the response exactly as follows, with roughly these lengths: "The protocol" (about 700 words, the ordered tests with their thresholds and exits); "Thresholds, exits, and incomplete evidence" (about 200 words); "Four worked cases" (about 900 words, one subsection each, each ending with the structured record the annotator would file); "The verdict you won't like" (about 150 words); "Known failure modes" (about 300 words); "Where I'm guessing" (about 150 words).
reasoning: |-
  Okay, this is a fascinating and challenging request from a backend engineer working on a high-stakes open-source democracy annotation project. The user clearly has sophisticated technical skills but lacks formal training in political science methodology - they're essentially asking me to design a rigorous decision protocol that can withstand both partisan biases and real-world implementation constraints. 

  The core tension here is between operational precision and democratic theory nuance. The user needs something that functions like a software spec but captures complex political realities. Their existing system with 0.5 Cohen's kappa is essentially random - that's worse than flipping coins. The partisan drift accusation cuts deep because it's probably true when you're tagging complex institutional changes with just "a page of adjectives."

  Hmm... the five specific problem areas they outlined reveal where their current system breaks down:
  1. The unit-of-analysis problem shows they're missing temporal/strategic context
  2. The symmetry check admission proves they know annotators are self-deceiving about bias
  3. The consent dilemma touches on majoritarian vs liberal democracy debates
  4. The baseline issue requires defining democracy's floor
  5. The latent power distinction is about operationalization vs threat

  For the protocol itself, I'll need to build something that:
  - Forces sequential evidence-based decisions
  - Has hard exits to prevent "vibe tagging"
  - Embodies specific theoretical commitments (I'll lean on procedural democracy theory with Levitsky & Ziblatt's "guardrails" framework)
  - Makes bias mitigation operational (that blind paraphrase swap test is clever but needs refinement)

  The four test cases will be revealing - especially since they asked me to include one verdict they'll dislike (probably the US state-level example given their American background). For the Turkish referendum and Hungarian changes, there's relative scholarly consensus, but the US case will force me to apply the same standard to their home country.

  Biggest challenges will be:
  - Defining "sufficient evidence" thresholds without country expertise
  - Handling cases where backsliding is popular (Venezuela's Chavez had genuine support)
  - Deciding when accumulated small changes cross the threshold

  I'll need to be brutally consistent in the worked examples - if a US state legislature power grab meets the protocol's backsliding definition, I must call it that regardless of the user's potential discomfort. The "known failure modes" section should warn about slow-rolling backsliding and legitimation crises specifically.

  For theoretical grounding, I'm rejecting purely electoral democracy definitions - a country can hold elections while gutting constraints. The consent problem gets resolved by distinguishing between popular will and institutional safeguards. Baseline definition uses V-Dem's electoral democracy index threshold.

  The latency distinction will require tracking first use of new powers - until exercised, it's "institutional threat" not active backsliding. The swap test implementation will need concrete examples in the protocol to avoid annotator fatigue.

  This will run long but every constraint matters - their journalists and NGOs actually use this data. Better to over-deliver on rigor than enable more sloppy tags.
answer: |-
  ## The Protocol (Ordered Tests with Thresholds & Exits)

  1.  **Test 0: Valid Institutional Change?**
      *   **Question:** Is this a discrete, identifiable change to formal laws, regulations, constitutional provisions, or established institutional practices (e.g., norms governing appointments, oversight) in a country's political system?
      *   **Pass Threshold:** Explicit, documented change (e.g., new law passed, constitutional amendment ratified, formal rule change, documented abandonment of long-standing practice).
      *   **Fail Exit:** "Not a valid institutional change." Tag: `Invalid`. Justification: "Not a discrete institutional change." (E.g., a speech, protest, unenforced threat).
      *   **Evidence Required:** Primary source (law text, constitutional amendment gazette, official decree) or 2+ reputable secondary sources (major news outlets, academic analysis, credible NGOs like HRW/ICG) confirming the *existence* and *formal nature* of the change.

  2.  **Test 1: Unit of Analysis / Aggregation Threshold?**
      *   **Question:** Is this change intrinsically linked to 1+ prior changes passed by the *same governing coalition/executive* within the last 36 months, forming a coherent sequence aimed at a single institutional domain (e.g., judiciary, elections, media oversight)?
      *   **Linkage Rule:** Changes are linked if (a) same actors passed them, (b) each lowers the cost/raises the payoff for subsequent changes *in that domain*, (c) credible analysis (≥1 academic/NGO report) identifies them as a strategic sequence. *Coded as a single composite event.*
      *   **Pass Threshold:** Meets linkage rule criteria.
      *   **Fail Exit:** Proceed to Test 2 for this single change.
      *   **Insufficient Evidence:** If linkage plausible but unconfirmed, code change individually *but flag for editor review* regarding possible aggregation.

  3.  **Test 2: Formal Democratic Weakening? (Objective Criteria)**
      *   **Question:** Does this change *formally* reduce constraints on executive power, reduce accountability mechanisms, reduce political equality (voting/representation rights), or reduce pluralism (rights/access for opposition/media/civil society)? Focus *only* on the *de jure* alteration.
      *   **Pass Threshold:** Clear, documented reduction in one or more core democratic institutions/procedures. (E.g., reduces judicial independence, weakens electoral commission autonomy, restricts opposition access to media/resources, erodes legislative oversight powers, centralizes control over key state functions).
      *   **Fail Exit:** "Formal weakening not found." Proceed to Test 3.
      *   **Insufficient Evidence:** If effect is ambiguous or evidence contradictory, tag `Unclear`. Justification: "Insufficient evidence of formal weakening."

  4.  **Test 3: Symmetry Check (Blind Paraphrase Swap Test - Mandatory)**
      *   **Action:** Annotator *must* paraphrase the change: Remove all country names, party names, leader names, and dates. Describe only the *mechanism* and the *institutional domain* affected (e.g., "Legislature grants itself power to replace members of independent electoral commission with political appointees").
      *   **Question (Blind):** If this exact change were hypothetically implemented in a stable democracy (e.g., Denmark, Canada, Costa Rica), would it *plausibly* weaken core democratic institutions as defined in Test 2?
      *   **Pass Threshold:** Unambiguous "Yes" based *only* on the blind paraphrase and Test 2 criteria. Proceed to Test 4.
      *   **Fail Threshold:** Unambiguous "No". Exit: "Not backsliding." Tag: `Ordinary Reform` or `Unclear` (if intent ambiguous). Justification: "Blind symmetry check: Change not inherently weakening."
      *   **Mismatch Consequence:** If blind answer ("No") contradicts Test 2 outcome ("Pass"), *immediate escalation to editor*. Annotator *cannot* resolve. Justification: "Symmetry check mismatch."

  5.  **Test 4: Baseline Democracy Threshold?**
      *   **Question:** Did V-Dem's Liberal Democracy Index (LDI) score for this country average ≥ 0.5 (on 0-1 scale) *in the year before the change*? (0.5 = "Electoral Democracy" threshold per V-Dem methodology).
      *   **Pass Threshold:** V-Dem LDI ≥ 0.5. Proceed to Test 5.
      *   **Fail Threshold:** V-Dem LDI < 0.5. Exit: "Below democratic baseline." Tag: `Regressive Reform` (if change worsens institutions) or `Authoritarian Consolidation` (if change sustains non-democracy). Justification: "V-Dem LDI < 0.5 baseline."
      *   **Insufficient Evidence:** If V-Dem data unavailable/outdated, use Freedom House Status ("Free" or "Partly Free" = Pass; "Not Free" = Fail). Flag data limitation.

  6.  **Test 5: Latent Power vs. Active Use?**
      *   **Question:** Has the *specific power granted or mechanism created* by this change been *actively used* against political opponents/media/civil society *within 24 months* of enactment?
      *   **Pass Threshold:** Documented, specific instance(s) of use against opposition targets, confirmed by ≥2 reputable sources. Tag: `Democratic Backsliding`.
      *   **Fail Threshold:** No documented active use within 24 months. Tag: `Institutional Threat` (Sub-tag under `Backsliding` or `Unclear`).
      *   **Insufficient Evidence:** If potential for abuse is high per Test 2/3, but no evidence of use exists, tag `Institutional Threat` + `Low Confidence`. Justification: "Latent power, no documented use."

  7.  **Test 6: Popular Mandate Defense? (Consent Problem)**
      *   **Question:** Was this change approved via a referendum or legislative supermajority vote (≥60%) considered broadly free and fair *at the time* by credible domestic/international observers (e.g., OSCE, Carter Center, major NGOs)?
      *   **Pass Threshold:** Broadly fair process AND majority/supermajority approval. Exit: "Popular mandate." Tag: `Ordinary Reform`. Justification: "Adopted via broadly fair popular/legislative mandate."
      *   **Fail Threshold:** No popular vote, or process lacked broad fairness (significant irregularities, intimidation, media bias documented by observers), or failed to achieve required majority. Proceed to final tag based on prior tests.
      *   **Insufficient Evidence:** If fairness contested without clear observer consensus, escalate to editor. *Popular approval alone, without fairness, is no defense.*

  **Final Tag Assignment:** Based on cumulative test results. Only `Democratic Backsliding`, `Institutional Threat`, `Ordinary Reform`, `Regressive Reform`, `Authoritarian Consolidation`, or `Unclear` are valid outputs.

  ---

  ## Thresholds, Exits, and Incomplete Evidence (200 words)

  *   **Thresholds:** Defined by concrete, verifiable evidence (laws, observer reports, V-Dem/FH data). "Plausible" isn't enough. Test 2 requires *formal* weakening; Test 5 requires *documented use*. Test 6 mandates *observer-confirmed fairness*.
  *   **Exits:** Hard stops exist at Test 0 (Invalid), Test 3 (Symmetry Fail - Not Backsliding), Test 4 (Below Baseline), and Test 6 (Mandate Defense Pass - Ordinary Reform). Mismatches (Test 3) force editor escalation. Ambiguity in Tests 1, 3, 5, or 6 triggers `Unclear`, `Institutional Threat`, or editor review.
  *   **Incomplete Evidence:** The protocol defaults to caution. If evidence for a critical threshold (e.g., formal weakening in Test 2, active use in Test 5, fairness in Test 6) is absent, contradictory, or insufficient after 20 mins of focused searching (checking primary sources, major international news, key NGO reports), the tag *must* reflect the uncertainty (`Unclear`, `Institutional Threat + Low Confidence`). Annotators *cannot* infer intent or effect from "vibes." "Insufficient evidence" is a valid and necessary outcome.

  ---

  ## Four Worked Cases

  **Case 1: Hungarian Constitutional & Electoral Changes (Early 2010s - e.g., New Constitution 2011, Electoral Law changes 2011-2013)**
  *   **Test 0:** Pass. Discrete legal/constitutional changes.
  *   **Test 1:** Pass (Aggregation). Fidesz supermajority passed sequential changes to constitution, electoral system, judiciary, media council within 36 months, lowering costs for subsequent power grabs (e.g., packing courts enabled later rulings). Coded as composite.
  *   **Test 2:** Pass. Formally weakened constitutional court powers (curtailed review, packed), gerrymandered districts, reduced campaign period, centralized media regulation under loyalists.
  *   **Test 3 (Blind):** "Legislature rewrites constitution and electoral laws to: severely limit high court's review powers; redraw districts heavily favoring governing party; reduce campaign timeframe; place independent media council under legislative majority control." Blind Answer: **Yes** (inherently weakening).
  *   **Test 4:** Pass. Hungary's V-Dem LDI was >0.6 in 2010.
  *   **Test 5:** Pass (Active Use). New media council fined/forced opposition-aligned outlets off air; new electoral boundaries cemented Fidesz supermajority; packed courts upheld changes. Documented by HRW, OSCE, academic studies.
  *   **Test 6:** Fail. Constitution passed by legislature alone (no referendum). Electoral laws passed by Fidesz supermajority. Process criticized by Venice Commission, OSCE for lack of opposition consultation and rushed adoption. Fairness not broadly confirmed.
  *   **Record:** Tag: `Democratic Backsliding`. Confidence: High. Decisive Test: Test 5 (Active Use). Justification: "Composite event: Sequential Fidesz supermajority changes (constitution, electoral laws, judiciary, media) formally weakened checks/pluralism (T2), passed blind symmetry (T3). Used actively against opposition/media (T5). Below-baseline defense invalid (T4 Pass, T6 Fail)."

  **Case 2: Polish Judicial Reforms (Post-2015 - e.g., Law on Common Courts 2017, Supreme Court Law 2017)**
  *   **Test 0:** Pass. Discrete laws passed.
  *   **Test 1:** Pass (Aggregation). PiS majority passed multiple laws targeting judiciary (Common Courts, NCJ, Supreme Court, Constitutional Tribunal) within 36 months, enabling sequential control (e.g., NCJ changes enabled politicized appointments).
  *   **Test 2:** Pass. Formally forced retirement of SC judges, gave Minister/Parliament control over NCJ (appointing body), subordinated courts to Minister.
  *   **Test 3 (Blind):** "Legislature passes laws: forcing mass retirement of high court judges; granting executive/legislature power to appoint/replace judicial council members; placing court administration under executive minister." Blind Answer: **Yes**.
  *   **Test 4:** Pass. Poland's V-Dem LDI was ~0.7 in 2015.
  *   **Test 5:** Pass (Active Use). Forced retirement used against SC President; new NCJ appointed loyalists; disciplinary chamber targeted independent judges (e.g., Igor Tuleya). Documented by EU Commission, OSCE, Iustitia.
  *   **Test 6:** Fail. Passed by parliamentary majority only. Process rushed, lacked consultation. Criticized by Venice Commission, ECJ. Fairness not broadly confirmed.
  *   **Record:** Tag: `Democratic Backsliding`. Confidence: High. Decisive Test: Test 5 (Active Use). Justification: "Composite PiS judicial reforms formally gutted independence (T2), passed symmetry (T3). Actively used to purge/target judges (T5). Popular mandate defense invalid (T6 Fail)."

  **Case 3: Turkish Constitutional Referendum 2017 (Executive Presidency)**
  *   **Test 0:** Pass. Constitutional amendment via referendum.
  *   **Test 1:** Fail (Aggregation). While part of longer trend, focus on *this specific change*. Proceed alone.
  *   **Test 2:** Pass. Formally abolished PM/post, concentrated executive/legislative power in President, weakened parliament, eroded judicial independence nominally.
  *   **Test 3 (Blind):** "Constitutional change abolishes prime minister, concentrates executive and legislative powers in presidency, weakens parliament's oversight." Blind Answer: **Yes**.
  *   **Test 4:** **Fail**. Turkey's V-Dem LDI averaged ~0.35 in 2016 (below 0.5 threshold). Exit.
  *   **Record:** Tag: `Authoritarian Consolidation`. Confidence: High. Decisive Test: Test 4 (Baseline). Justification: "Formal weakening passed (T2, T3), but enacted below democratic baseline (V-Dem LDI ~0.35)."

  **Case 4: US State-Level Change (e.g., Georgia Election Law SB 202, 2021 - Moving authority over election administration/certification)**
  *   **Test 0:** Pass. Discrete state law change.
  *   **Test 1:** Fail (Aggregation). Analyze SB 202 alone initially. (Editor later might link to other state laws using Test 1 rules).
  *   **Test 2:** Pass. Formally empowered state legislature (via State Election Board) to suspend county election officials, reduced Secretary of State's role (removed as SEB chair), centralized certification challenges.
  *   **Test 3 (Blind):** "State legislature passes law: granting itself (via board it controls) power to suspend local election administrators; reducing authority of statewide elected election official; centralizing process for challenging election certification." Blind Answer: **Yes**.
  *   **Test 4:** Pass. Georgia's V-Dem LDI subnational score (estimated/regional avg) >>0.5.
  *   **Test 5:** **Fail (Insufficient Evidence - Latent)**. No documented instance (as of late 2023 cut-off) of the State Election Board suspending a county official for partisan reasons or using new powers to subvert certification. *Potential* is high (T2/T3), but no *active use* documented within 24 months per protocol.
  *   **Test 6:** Fail. Passed by legislative majority/governor. Process criticized for speed, lack of Dem input. Observers (Brennan Center, ACLU) raised fairness/access concerns. No referendum. Fairness not broadly confirmed.
  *   **Record:** Tag: `Institutional Threat`. Confidence: Medium. Decisive Test: Test 5 (Latent Power). Justification: "Formal weakening of local election admin autonomy/centralization under legislature (T2, T3 Pass). No documented *active use* against opponents within 24m (T5 Fail). Below-baseline defense invalid (T4 Pass, T6 Fail)."

  ---

  ## The Verdict You Won't Like (150 words)

  The verdict you won't like is the **US State-Level Change (Georgia SB 202) tagged as `Institutional Threat`**. As an American, you likely view this as partisan power grab meriting `Backsliding`. The protocol forces a call based on *active use within 24 months*. While the formal weakening (Test 2) and symmetry test (Test 3) clearly signal danger, the absence of *documented, specific instances* of the new suspension/certification powers being weaponized against county officials or election results *by late 2023* triggers the latency rule (Test 5). Calling it `Backsliding` without evidence of use injects inference the protocol forbids. This feels unsatisfying because the *intent* seems clear, but the protocol prioritizes documented harm over inferred intent. It highlights the tension between recognizing threat and requiring evidence of activation. I won't soften it: the rule exists precisely to counter vibes-based escalation.

  ---

  ## Known Failure Modes (300 words)

  1.  **Slow-Rolling Backsliding:** The protocol excels at discrete changes/sequences but struggles with **incremental norm erosion** where no single formal change is large enough to trigger Test 2, but cumulative informal shifts (e.g., chronic non-enforcement of rules, systematic vilification of opponents) degrade democracy. Test 1 aggregation requires *formal* linkage. This risks missing death-by-a-thousand-cuts scenarios driven by rhetoric and practice, not legislation.
  2.  **Legitimation Crises & Populist Erosion:** The protocol treats Test 6 (Popular Mandate) as a binary defense. This fails when **backsliding is genuinely popular** due to polarization, misinformation, or illiberal majoritarianism (e.g., Chavez, Orban's later measures). A broadly fair referendum approving autocratic centralization would be tagged `Ordinary Reform`, ignoring the substantive democratic harm. The protocol prioritizes procedural legitimacy over liberal substance here, a core weakness reflecting its procedural focus.
  3.  **Contextual Nuance & State Capacity:** The 20-min/no-expertise constraint means **critical context is missed**: historical precedents, informal power structures, local power balances. E.g., a law centralizing election oversight might be backsliding in Georgia (polarized, competitive) but necessary reform in a state with chronic local corruption. The symmetry test (Test 3) mitigates but doesn't eliminate this. Similarly, distinguishing necessary state-building reform from power grabs in weak democracies is near-impossible without expertise.
  4.  **Evidence Asymmetry:** Documenting "active use" (Test 5) is **harder against subtle tactics or in opaque regimes**. Annotators might miss obscure local reports or nuanced intimidation. Conversely, opposition actors may over-report "abuse." The 2-source threshold helps but isn't foolproof. In highly repressive states, evidence of use might be suppressed, leading to false `Institutional Threat` tags instead of `Backsliding`.
  5.  **V-Dem Baseline Gaps:** Relying solely on V-Dem LDI (Test 4) creates problems at the **margins** (e.g., states just above/below 0.5) or with **lagging data** (critical during rapid change). Using Freedom House as backup helps but is coarser. Subnational baselines (for US states) are also less robust.

  ---

  ## Where I'm Guessing (150 words)

  My key guesses involve **threshold calibration**:
  1.  **Test 1 Aggregation (36 months):** This timeframe is somewhat arbitrary. I chose it based on typical election cycles and coalition stability, but sequences could span longer. I'm guessing this captures most strategic backsliding without becoming unwieldy.
  2.  **Test 5 Active Use (24 months):** Why 24, not 12 or 36? I'm guessing 24 balances urgency (captures likely early weaponization) with giving time for evidence to emerge, without letting threats linger indefinitely as latent. It's a practical compromise.
  3.  **V-Dem LDI 0.5 Baseline:** While V-Dem's threshold is established, its precise calibration (why 0.5?) involves theoretical choices about defining "electoral democracy" I'm not fully equipped to defend beyond accepting mainstream comparativist practice. Using it decisively (Test 4 Exit) is a significant guess about where the "democracy" line falls.
  4.  **Blind Paraphrase Feasibility:** I *guess* annotators can create sufficiently neutral paraphrases consistently, but real-world bias might seep into the paraphrase wording itself, undermining Test 3. Mitigation relies heavily on annotator training/editor review.
