answer: |-
  ### Joint Statement on the Halvik Lomping Case  
  **Signed by R (Wittgensteinian) and C (Classical Theorist)**  

  #### 1. Agreed Claims (246 words)  
  1. **No Necessary Feature**: Halvik’s "lomping" has no single feature (e.g., rhythmic motion, idleness) present in all agreed cases and absent in all non-cases. The anthropologist’s list confirms this: coin-sorting is lomping in the tavern but not at the bank, despite identical movements.  
  2. **Clear Cases and Borderlines**: Consensus exists for paradigmatic examples (e.g., net-mending while waiting) and non-examples (e.g., hauling nets for work). Genuine disagreement arises only in borderline cases (dog tail-chasing, councillor drumming).  
  3. **Hidden Property Insufficient**: The high-tide property (contact with tide-touched objects) fails as a definition. It is present in agreed-non-lomping (shopkeeper restocking) and absent in agreed-lomping (coin-sorting inland at the chapel).  
  4. **Community Practice Central**: Lomping is determined by Halvik’s shared judgments, not abstract criteria. The probes show speakers override the high-tide property when it conflicts with their intuitions.  
  5. **Distinguishing Three Issues**:  
     - *No Shared Feature*: Established by the anthropologist’s list and the coin-sorting contrast.  
     - *No Sharp Boundary*: Demonstrated by split verdicts on borderline cases.  
     - *No Explanation for Judgments*: The high-tide property does not explain why speakers classify as they do, as they reject it in probes.  
  Halvik data definitively shows **no shared feature** and **no sharp boundary**, but does not prove **no explanation for judgments**; it only shows the high-tide property is not that explanation.  

  ---

  #### 2. Disagreements (Table: 348 words)  

  | Point of Difference                     | R’s Position (Wittgensteinian)                                                                 | C’s Position (Classical Theorist)                                                                 |
  |-----------------------------------------|------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------|
  | **Existence of Necessary Conditions**   | Lomping has no necessary conditions; it is sustained solely by overlapping resemblances and communal training. | Lomping *must* have necessary conditions; borderline cases reflect vagueness or our ignorance of the true boundaries. |
  | **Nature of Borderline Cases**          | Borderline disagreements (e.g., tail-chasing) reveal the open texture of the concept, not epistemic lack. | Borderline cases are fuzzy due to incomplete knowledge or linguistic vagueness; a precise boundary exists independent of us. |
  | **Role of Hidden Structure**            | The high-tide correlation is accidental; meaning resides in use, not hidden properties. | The high-tide property is a candidate for a necessary condition; speakers track it subconsciously despite explicit overruling. |
  | **Identical Movements, Different Verdicts** | Coin-sorting differs because context (tavern leisure vs. bank work) alters its place in Halvik’s form of life. | Identical movements are insufficient; lomping requires unstated conditions (e.g., non-instrumental intent) absent in the bank. |

  ---

  #### 3. Cruxes and Predictions (398 words)  
  1. **Crux: Does Context Override Physical Properties?**  
     - *Test*: Introduce a novel case: *A sailor rhythmically taps a tide-touched rope on the dock while waiting for cargo, but believes he is “working.”*  
     - *R’s Prediction*: Halvik denies "lomping" because the activity is embedded in a work narrative. Practice trumps physical features.  
     - *C’s Prediction*: Halvik may call it lomping if it meets hidden conditions (e.g., idleness); if not, the “work” belief signals missing necessary conditions.  

  2. **Crux: Can the High-Tide Property Become Explicit?**  
     - *Test (Empirical)*: Tell Halvik about the tide link. Observe if they: (a) reject it, (b) revise borderline judgments (e.g., accept the councillor if his table was tide-touched), or (c) ignore it.  
     - *R’s Prediction*: Usage remains unchanged; the property is irrelevant to practice.  
     - *C’s Prediction*: Judgments shift toward the tide criterion as speakers align practice with latent knowledge.  

  3. **Crux: Identical Movements, Divergent Verdicts**  
     - *Test*: Ask Halvik why tavern coin-sorting is lomping but bank sorting is not.  
     - *R’s Prediction*: Explanations cite social setting (“tavern is idle time”; “bank is duty”), not movement-based conditions.  
     - *C’s Prediction*: Speakers invoke unobservables (e.g., “purpose” or “appropriateness”) as necessary conditions.  

  **Generalization**: Halvik suggests most everyday concepts lack strict definitions (supporting R), but C maintains this is domain-specific; scientific concepts (e.g., “water = H₂O”) retain classical structure.  

  ---

  #### 4. Verbal or Not (148 words)  
  The dispute is **not primarily verbal**. Both agree on Halvik’s empirical data (e.g., no feature is necessary, speakers override the tide property). The conflict concerns **what constitutes a “concept”**:  
  - If “concept” refers to *psychological/communal practices* (R), Halvik shows concepts are fluid and practice-dependent.  
  - If “concept” refers to *mind-independent structures* (C), Halvik merely shows folk concepts are imperfect.  
  This is philosophical, not verbal: it turns on whether meaning is grounded in use or abstract conditions. A verbal element arises if “vagueness” is equivocated: C calls borderline cases “vague” due to ignorance; R calls them “indeterminate” due to open texture. Testing requires examining other concepts: if most exhibit Halvik-like features, R’s view generalizes; if rigorous domains (e.g., mathematics) differ, C’s distinction holds.  

  ---  
  **Total: 1190 words**  
  *Key Generalization*: Halvik extends Wittgenstein’s “game” example by demonstrating how *context* and *communal norms* override physical or behavioral regularities, challenging classical theories outside formal domains.
