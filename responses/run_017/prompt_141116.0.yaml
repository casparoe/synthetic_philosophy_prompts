prompt: |-
  for a history project I have to write about how anyone can know what happened a really long time ago, and I keep going in circles. we read some Herodotus in class and my teacher said you can't just read an old book and believe it, but when I ask how you decide, people say stuff like "check if the author was biased" — wich every author is. so before I trust anybody's verdict I want the spec.

  Write the requirements a method for judging very old sources would have to meet, with the case behind each. These are the cases I want handled, plus whatever I'm missing:

  - exactly one old book says a battle happened and nothing else ever mentions it
  - three later books say it happened, but they all look like they copied the first one
  - an author who was actually there vs. an author writing 200 years later who says he talked to people who were
  - a source that gets small stuff right (names, distances, dates) and the big stuff weird
  - a source with an obvious reason to lie vs. one that just repeats what everyone in his city already believed
  - something known only from coins or buildings, with no text at all
  - a source that says a god did it

  Also, my friend says that when a writer reports something that makes his own side look bad, that's a sign it's true, and I sort of believe him but I can't say why — is that a real requirement or just a vibe?

  Say which requirements are non-negotiable and which are just what one kind of historian happens to like. And I think there might be two on the list that can't both be met: you need something independent to check a source against, but the only independent stuff is more sources, so you never get going. If that's a real problem and not just me confusing myself, say so, and say what it means for whether a method can be suspicious enough without giving up on ever answering anything.

  Don't tell me books to read or name historians, I can't look anything up. Just the spec and the cases.
reasoning: |-
  Okay, the user is working on a history project and is stuck in a loop over how to evaluate ancient sources. They've listed specific scenarios, like when only one source mentions a battle or when sources might be biased. They also mention their friend's point about sources making their own side look bad being more credible. The core issue seems to be establishing a reliable method to judge historical sources without circular reasoning.

  First, I need to address the user's main request: a set of requirements for judging ancient sources. Each requirement should have a rationale tied to their cases. The user doesn't want book recommendations or historian names, just the specs. 

  Looking at their scenarios, each one presents a different challenge. For example, a single source requires checking if it's isolated or if there's indirect support. Later copies need to be traced back to a common origin. Eyewitness vs. secondhand accounts involve evaluating the chain of transmission. 

  The user is also concerned about bias. They note that all authors have biases, so simply checking for bias isn't enough. The method needs to handle that by considering the type and influence of bias. The friend's point about sources making their own side look bad is a valid heuristic (criterion of embarrassment), but it's not foolproof. I should categorize that as a soft requirement.

  The big problem they mentioned is circularity: needing independent evidence but only having other sources. This is a real issue in historical methodology. The key is to use multiple lines of evidence (texts, archaeology, coins) and look for coherence. Not all sources are equally independent, so cross-referencing helps. Also, some requirements like empirical adequacy (fitting physical evidence) break the circle by using non-textual data.

  I need to differentiate between non-negotiable requirements (like empirical adequacy and independence) and preferred ones (like causal plausibility). The user's examples, like a source getting small details right but big ones wrong, point to the need for consistency checks. The god-intervention case requires naturalistic explanations unless there's overwhelming evidence, which ties into coherence with established knowledge.

  Also, the user might be struggling with how to start when sources are scarce. Emphasizing that the method is probabilistic, not definitive, could help. They need to understand that historians work with likelihoods, not certainties, and that some questions remain unanswered due to lack of evidence.

  In summary, the response should structure requirements clearly, address each case, explain how to avoid circularity through multiple evidence types, and clarify which criteria are essential vs. helpful. Highlighting that some scenarios can't be resolved with current evidence manages expectations while providing a practical framework.
answer: |-
  Here's a specification for a method to judge very old sources, designed to handle your cases and the core problem of circularity. Think of it as a set of filters – a source must pass enough to be deemed credible *on a specific point*.

  **Non-Negotiable Requirements (The Absolute Must-Haves):**

  1.  **Empirical Adequacy:** *The claim must not be definitively contradicted by physical evidence (archaeology, geology, biology, etc.).*
      *   **Case Behind:** A story claiming a massive battle at a specific location must leave evidence (weapons, mass graves, fortification damage). If digs find nothing, the story fails. Handles "coins/buildings only" by demanding the claim fits what the coins/buildings show. Handles "god did it" – if the claim requires physically impossible events (e.g., mountains moving overnight with no geological trace), it fails.
      *   **Why Non-Negotiable:** History deals with the physical past. If physical evidence directly falsifies a claim, the claim is unreliable *on that point*.

  2.  **Internal Consistency:** *The source must not contradict itself on fundamental facts within the relevant passage or narrative.*
      *   **Case Behind:** An author can't claim the battle happened on Tuesday and Friday in the same account without error. Catches sloppy copying or internal fabrication. Handles "small stuff right, big stuff weird" by highlighting the inconsistency *within the source itself*.
      *   **Why Non-Negotiable:** Self-contradiction signals unreliability in recording or transmission for that specific event.

  3.  **Critical Provenance:** *We must be able to identify, as far as possible: WHO wrote it, WHEN (relative to the event), WHERE, and FOR WHAT PURPOSE/AUDIENCE.*
      *   **Case Behind:** Essential for *all* cases. Knowing an author was present ("eyewitness") vs. writing 200 years later ("talked to people") provides crucial context for reliability. Identifies potential bias ("obvious reason to lie" vs. "repeats common belief"). Helps assess "copied later books" by tracing origins. Even for coins/buildings, we ask "who minted/built this, when, and why?"
      *   **Why Non-Negotiable:** Without basic context, assessing reliability is impossible. You can't evaluate bias, proximity, or motive without this.

  **Highly Preferred Requirements (Strong Indicators, But Not Absolute Proof):**

  4.  **Independence (Corroboration):** *Does the claim find support in sources demonstrably unrelated (different author, location, tradition, type of evidence)?*
      *   **Case Behind:** The core solution to "only one book" and "copied later books". If an event is mentioned *independently* by Greek historians, Egyptian records, and Babylonian chronicles, it's far stronger than one source or copies. Handles "eyewitness vs. later source" – independent eyewitnesses trump a single later compiler. Physical evidence (coins/buildings) provides vital independent corroboration. Breaks the "only other sources" circle by demanding *different kinds* of sources/traditions.
      *   **Why Preferred, Not Absolute:** Truly independent corroboration is rare for ancient events. Its absence doesn't *prove* falsity, but its presence massively boosts credibility. It's the best tool against circularity.

  5.  **Causal Plausibility:** *Does the claim fit within a coherent understanding of human behavior, societal norms, technology, and natural laws of the time?*
      *   **Case Behind:** Handles "big stuff weird" – why would an author get small details right but invent a bizarre central event? Also handles "god did it" – unless presented as pure myth/parable, direct divine intervention generally lacks causal plausibility for historical analysis. Explains why "repeats common belief" is slightly more reliable than an obvious liar – the belief itself might be plausible within that society.
      *   **Why Preferred:** "Plausibility" is culturally subjective and changes. What seems implausible now might have been accepted then (and vice versa). It's a filter, not a veto.

  6.  **Transparency & Methodology:** *Does the source reveal its sources or methods? Does it express uncertainty?*
      *   **Case Behind:** An author saying "I was there" or "I interviewed X, Y, and Z" is better than one making bare assertions. An author saying "some say this, others say that" shows awareness of uncertainty. Helps evaluate "eyewitness vs. later" – the later author *must* demonstrate good methodology in using sources. Helps spot potential bias by seeing what sources they *omit*.
      *   **Why Preferred:** Ancient sources rarely meet modern standards. Lack of transparency is common, not automatic proof of unreliability. Its presence, however, is a strong positive indicator.

  **Useful Heuristics (Indicators, Often Contingent):**

  7.  **Criterion of Embarrassment:** *Does the claim harm the author's own cause, group, or heroes?*
      *   **Case Behind:** Your friend's point. If a Roman historian admits a Roman defeat, it's *less likely* he invented it (why make your side look bad?). Helps differentiate "obvious reason to lie" (they *wouldn't* report embarrassing truths) from "repeats common belief" (might include inconvenient facts).
      *   **Why Heuristic, Not Requirement:** 1) Authors *can* report embarrassing truths for complex reasons (building credibility for a bigger lie, moral lesson, criticizing rivals). 2) Authors *can* invent embarrassing events about *enemies*. It's a strong signal, not proof.

  8.  **Detail Consistency:** *Does the source accurately report verifiable minor details (names, titles, geography, customs)?*
      *   **Case Behind:** An author who gets local place names, king lists, or travel times right *might* be more reliable on the bigger event ("small stuff right"). Helps assess the "copied later books" – if they copy minor errors from the original, it shows dependence.
      *   **Why Heuristic:** Getting small details right doesn't guarantee the big picture is correct (mistakes happen, details could be known independently). Getting them wrong *might* just mean a minor error, not falsifying the whole account.

  **Handling Your Cases & The Circularity Problem:**

  *   **Single Source:** Requires **Critical Provenance** (who/when/why?) and **Causal Plausibility**. Does it fit the **Empirical** evidence? Is there *any* **Independent** support (even indirect archaeological context)? If it passes provenance/empirical checks and seems plausible, it *might* be accepted cautiously. Often, it remains uncertain (e.g., many events in Herodotus).
  *   **Copied Later Books:** **Critical Provenance** shows dependence. **Independence** is absent. **Detail Consistency** might show copying errors. They add little beyond the original source unless one shows **Transparency** about *other* sources used.
  *   **Eyewitness vs. Later Compiler:** **Critical Provenance** is key. Eyewitness has inherent proximity. Later compiler relies entirely on **Transparency & Methodology**. Did they have access to good sources? Did they cite them? **Independence** of *their* sources matters.
  *   **Small Stuff Right, Big Stuff Weird:** Highlights **Internal Consistency** failure. Check **Causal Plausibility** for the "weird" part. Does it violate **Empirical** evidence? Why get small stuff right but big stuff wrong? (Mistake? Propaganda? Later interpolation?).
  *   **Obvious Liar vs. Repeats Belief:** **Critical Provenance** reveals motive for the liar. **Criterion of Embarrassment** helps – the liar avoids harmful truths, the repeater might include them. **Independence** is crucial – does anyone else, especially outsiders, support the "common belief"?
  *   **Coins/Buildings Only:** Pure **Empirical Adequacy** evidence. **Critical Provenance** asks "who made this and why?". **Causal Plausibility** applies (does the building style fit the period?). Lacks narrative detail, but provides hard facts about existence, power, art, technology, economy.
  *   **God Did It:** Fails **Causal Plausibility** for naturalistic history. Requires overwhelming, verifiable **Empirical** evidence impossible to explain naturally (which is exceptionally rare). Usually treated as myth, theology, or the author's cultural lens, not a literal historical claim.

  **The Circularity Problem: It's Real, But Not Fatal**

  You identified the core issue: Needing independent sources to check a source, but only having more sources. Here's how the method tackles it:

  1.  **Break the Circle with Non-Textual Evidence:** **Empirical Adequacy** is the anchor. Archaeology, coins, inscriptions, pollen analysis, climate data – these provide evidence *not* derived from the textual sources. They can corroborate or falsify claims independently.
  2.  **Demand *Different Kinds* of Independence:** Don't just want "another source," want a source from a different *tradition*, culture, location, or type (e.g., Egyptian records vs. Greek historian vs. Assyrian annals vs. physical ruins). This reduces the chance they all copied the same original lie.
  3.  **Focus on Coherence:** Does a claim fit within a coherent picture built from *multiple lines* of evidence (texts, archaeology, geography, known technology)? Does it causally make sense? A claim might be accepted provisionally because it *coheres* well with the established framework built from diverse evidence.
  4.  **Accept Probabilities, Not Certainties:** History rarely offers absolute proof. The method provides tools to assign *degrees of confidence*. A claim passing multiple filters (strong provenance, empirical fit, independent corroboration, causal plausibility) is highly probable. One failing key filters is improbable or rejected. Some claims remain stubbornly uncertain due to lack of evidence – that's an honest outcome.

  **Suspicion vs. Answering:**

  The method *is* inherently suspicious – that's the point of the filters. It prevents gullibly accepting any old story. **Empirical Adequacy, Internal Consistency, and Critical Provenance** form the non-negotiable bedrock of this suspicion. **Independence** and **Plausibility** are the powerful tools for building positive cases. It *doesn't* require giving up on answers, but it *does* require accepting that:
  *   Answers are often probabilistic ("very likely," "possible but doubtful").
  *   Some questions *cannot* be answered definitively with the available evidence.
  *   New evidence (like an archaeological find) can radically change conclusions.

  The goal is to be as rigorous and critical as possible within the constraints of the surviving evidence, using all available tools to build the most reliable picture achievable.
