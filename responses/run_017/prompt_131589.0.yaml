prompt: |-
  I write novels — four out, fifth in copyedits — and at a dinner party last week I got into an argument with a friend of my husband's who does philosophy, and it's been rattling around my head ever since. He was arguing for the view that moral judgement has to depend on general principles, against the thing I'd have said I already believed: that there aren't really moral rules, because whether a feature of a situation counts in favour of an act depends on the rest of the situation, so the very same feature that's a reason one way in one case can be no reason at all, or a reason the other way, in another. He mentioned some names for all this that I've since forgotton. I believe the same thing about writing, which is maybe my whole problem.

  His argument, as near as I can reconstruct it:

  (1) People really do learn to judge new cases correctly. I can read a scene in a manuscript I've never seen and tell that it isn't working, and I aquired that by reading a lot of scenes and being corrected by editors. Likewise you can watch a kid learn that it's mean to exclude somebody from a game and then watch her apply it to a situation nothing like the one she learned it in.

  (2) If you get new cases right, it can't be luck. The new case has to be like the old ones in the respects that mattered, and your judgement has to be keyed to those respects.

  (3) But "the respects that matter" just is a general principle — something of the form: any case with features F is to be judged thus-and-so. If nothing general connects the old cases to the new one, then the old ones gave you no guidance at all and you were guessing and happened to be right.

  (4) So anyone who has the ability in (1) must have picked up general principles. Maybe ones they can't state, but principles all the same, because that's the difference between having learned something and having just been drilled.

  (5) Morality is no different in structure from craft. Someone who reliably judges that an act was cruel, or disloyal, or a betrayal, in situations she's never met before, has picked up general principles about cruelty, disloyalty, betrayal.

  (6) So my original view is false. There are moral principles, at least tacit ones, and the idea that reasons can flip valence from case to case with nothing general holding them together is incoherent.

  (7) At which point I said — and I thought I'd scored a hit, but he didn't look worried — that the exact same argument runs on craft. If (1) through (4) are right, then a line cook who knows by the sound when a sauce is about to break, a jazz bassist, me editing a paragraph: all of us are following tacit rules that could in principle be written down in advance, and if we can't produce them it's only because we haven't tried hard enough. Which is nuts. I've spent twenty years trying to write down what makes a scene work and what I actually have is a folder of examples and a shrug.

  (8) He says (7) is just the price of denying (6): if I want to say craft is real knowledge without rules, I have to say the same about morality, and then I owe everybody an account of how anyone learns it, or argues about it, or gets corrected, or improves.

  Every step from (1) to (4) looks like a truism to me and (5) looks fine, and yet (6) and (7) together are something I can't swallow. I keep going back and forth between thinking (3) is a bit of a scam and thinking (5) is where the sleight of hand is, and I can't settle it. If I have to choose I'd rather keep (1) and (7) than (6). So: which step do you give up, why did it look like a truism when it isn't, and what does giving it up actually cost me — does it commit me to saying I can never really explain to a student why her scene fails, or that two people disagreeing about something moral have nothing to reason with? I want to know what I'm paying, not just which line to cross out.
reasoning: |-
  Okay, let me start by unpacking the user's dilemma. She's a novelist with five books, so she's deeply experienced in her craft. The argument she had with the philosopher friend challenges her belief that there are no fixed moral rules—context changes everything. The philosopher's structured argument from (1) to (6) seems logical, but it clashes with her experience in writing, where she feels rules can't capture the nuance. 

  First, I need to identify where the argument goes wrong for her. Step (3) is key here—it claims that learning must involve general principles. But her writing expertise contradicts that. She can't reduce her judgment to rules; it's more about holistic perception. So maybe step (3) oversimplifies how expertise works. 

  Next, considering her identity as a writer, her resistance to (6) and (7) makes sense. She knows craft isn't about rigid rules, so applying the same to morality feels wrong. Her deeper need might be to reconcile her intuitive, context-based approach with the philosopher's demand for principles. She wants validation that her craft knowledge is legitimate without rules, and perhaps extend that to morality.

  Also, she’s worried about the implications. If she rejects principles, can she still teach writing or argue about morals? That’s a practical concern. I should address how judgment can be reliable without codified rules, maybe through analogy or pattern recognition. 

  The philosopher’s point about learning and correction (step 8) needs a response. She might explain learning as building a repertoire of examples and refining perception, not deriving rules. For morality, similar non-rule-based reasoning could exist, like virtue ethics or narrative approaches. 

  Lastly, cost assessment: giving up step (3) doesn’t mean chaos. It means embracing a different model of understanding—one that’s flexible, context-sensitive. She can still teach using examples and critique, and moral debates can appeal to shared narratives or consequences. The cost is accepting that not all knowledge is reducible to principles, but that doesn’t undermine its validity. 

  I think focusing on step (3) as the misstep aligns with her experience and preserves her core beliefs while addressing the philosopher’s challenge. It also offers a coherent way to handle both craft and morality without rigid rules.
answer: |-
  You're wrestling with a profound philosophical tension between *principled rationality* and *contextual judgment* – and your instinct that step (3) is the weak link is spot on. Let's break down where the argument stumbles, what it costs you to reject it, and how to preserve your core insights about both craft and morality.

  **The Crux: Step (3) is the Problematic "Truism"**

  *   **Why it *seems* true:** There's an undeniable logic here. If past experience guides future judgment, there must be *some* relevant similarity between the cases we've learned from and the new case. This similarity *could* be captured by a principle ("F is always a reason for X").
  *   **Why it's false (or at least, too simplistic):** Step (3) commits a fundamental error: **it conflates *relevant similarity* with *codifiable principle*.** It assumes that the "respects that matter" must be *generalizable into a rule applicable to all future cases*. This ignores the possibility that:
      1.  **Similarity is perceived holistically, not via discrete features:** Expertise often involves recognizing a *gestalt* – a whole pattern or constellation of features – that resembles past experiences. This gestalt resists reduction to a finite list of necessary and sufficient conditions (F1, F2, F3... Fn). The cook hears the *sound*, the bassist feels the *groove*, you see the *scene failing* – it's the integrated whole, not a checklist.
      2.  **The relevance of features is context-dependent:** A feature (e.g., "character pauses before speaking") might be vital in Scene A (showing hesitation) but irrelevant or even detrimental in Scene B (killing momentum). Its relevance emerges from its *relationship* to the entire context, not its isolated existence. Step (3) assumes features have inherent, context-independent moral/craft "valence," which is precisely what you deny.
      3.  **Tacit knowledge isn't rule-following:** Michael Polanyi famously argued "we know more than we can tell." Expertise involves *tacit knowledge* – embodied, perceptual, intuitive understanding built through vast experience and pattern recognition. This knowledge allows judgment *without* conscious access to underlying rules. Your folder of examples *is* your knowledge base; the "shrug" reflects the limits of articulation, not the absence of understanding. You judge new scenes by seeing how they resonate (or clash) with this internalized library of patterns.
      4.  **Principles are often *ex post facto* rationalizations:** We frequently articulate "rules" *after* the fact to explain a judgment we arrived at intuitively. This doesn't mean the rule *caused* or *guided* the original judgment. Your folder of examples likely *precedes* any feeble attempts you've made to write down "rules," which are pale shadows of the rich understanding the examples provide.

  **What Giving Up Step (3) Costs You (and What it Doesn't):**

  1.  **Cost: A Simple, Universal Theory of Learning & Judgment:** You lose the neat, rule-based explanation for how we learn and apply judgment across domains. You have to accept that expertise often involves messy, context-sensitive pattern recognition rather than crisp rule application.
  2.  **Cost: Easy Codifiability:** You give up the idea that the *essence* of craft or moral judgment can be fully captured in a set of written principles accessible to a novice. The folder and the shrug are part of the reality.
  3.  **What it DOESN'T Cost You:**
      *   **Reliable Judgment:** You absolutely keep (1) and (2). People *do* learn, get better, and judge new cases reliably *without* it being luck. The cook *knows* the sauce, you *know* the scene. This reliability comes from sophisticated pattern recognition and sensitivity to context honed by experience and correction, not from hidden rulebooks.
      *   **The Ability to Teach & Argue:** You can absolutely explain to a student why her scene fails! You just won't do it *only* by citing universal rules. You'll do it by:
          *   **Pointing to specific features in context:** "See here, the dialogue feels flat *because* you've told us everything the character is feeling in the narration just before, leaving nothing for the subtext."
          *   **Using Analogies & Examples:** "This reminds me of that scene in [Example X] where the pacing died for a similar reason – look how they handled the internal monologue differently."
          *   **Highlighting Consequences:** "If this character reacts this passively here, it undermines the tension you built in the previous chapter."
          *   **Guiding Perception:** "Look at the rhythm of this paragraph – read it aloud. Do you hear how it stumbles here?"
      *   **The Possibility of Moral Reasoning & Disagreement:** Similarly, moral disagreement doesn't require shared principles. It can involve:
          *   **Narrative & Example:** "Imagine if *you* were in their position... Think about what happened in situation Y..."
          *   **Exploring Context & Consequences:** "Consider the pressure they were under... Look at the harm this caused to Z..."
          *   **Conceptual Clarification:** "Is this *really* loyalty, or is it just fear? Is that exclusion *really* necessary, or was it just cruel?"
          *   **Appealing to Shared Values (not necessarily principles):** "We both value compassion, right? Doesn't this action seem needlessly harsh in light of that?"
      *   **The Reality of Improvement & Correction:** Learning happens through *calibration*. An editor corrects you ("This scene drags"), you see *why* in *that specific context* (too much exposition, wrong POV, weak motivation), and you internalize that nuance. Your internal "pattern library" gets refined. The kid is corrected for excluding ("That was mean"), experiences the hurt, and learns to recognize *patterns of exclusion* and *patterns of distress* in new situations. The guidance isn't a rule, it's a refinement of perception and sensitivity.

  **Addressing Your Specific Concerns:**

  *   **"Does rejecting step (3) mean I can never explain to a student?"** No. It means your explanation won't be reducible to a simple, timeless rule. It will involve context, analogy, pointing, and guiding their perception – just like any master teaching an apprentice a complex craft. This is often *more* effective than handing them a rulebook.
  *   **"Does it mean moral disagreement has no reasoning?"** No. It means reasoning isn't *only* deductive logic from shared axioms. It involves persuasion through narrative, empathy, consequence-tracing, and conceptual exploration. Think of a jury deliberation – they reason deeply, often without citing abstract principles, by weighing the *particulars* of the case.
  *   **"What about step (5) and the sleight of hand?"** Step (5) *is* valid *if* you accept step (3). If judgment *requires* tacit rules, then craft and morality are analogous. But since step (3) is flawed, step (5) just highlights the *structural similarity* (both involve learned, reliable judgment in new cases) *without* forcing the conclusion that both *must* be rule-based. The sleight of hand occurs earlier, in the assumption that rule-following is the *only* model for this kind of judgment.

  **The Alternative Model: Case-Based Reasoning & Phronesis**

  You're describing a view aligned with **moral particularism** (opposed to generalism/principlism – names your friend might have mentioned include Jonathan Dancy, or earlier, Aristotle's *phronesis* or Wittgensteinian views) and theories of **expertise as situated cognition**.

  *   **Learning:** Accumulates a rich repertoire of cases, examples, experiences, and nuances.
  *   **Judgment:** Involves perceiving the unique constellation of features in a *new* situation and discerning which past experiences/patterns are relevantly similar *in this specific context*. It's analogical, not deductive.
  *   **Knowledge:** Is often tacit, embodied, and perceptual. Principles, when used, are flexible maxims, heuristics, or summaries of past judgments – *not* algorithmic rules.
  *   **Virtue:** Aristotle's *phronesis* (practical wisdom) is precisely this: the capacity to perceive what is morally salient in a unique situation and act rightly, developed through experience and guided by general notions of virtue (like courage, justice) which are themselves understood through examples, not rigid definitions.

  **Conclusion: Keep Your Folder and Your Shrug**

  Reject step (3). It falsely equates "guidance from past experience" with "following tacit rules." What you have – the ability to judge new scenes based on a lifetime of reading, writing, and correction – is *real knowledge*. It's built on a vast internal library of patterns, relationships, successes, and failures. Explaining it involves pointing, comparing, contextualizing, and refining perception, not reciting rules. Morality works the same way. We learn through stories, examples, corrections, and empathetic understanding, building a nuanced sense of what kindness, cruelty, fairness, and betrayal *look like* in endlessly varying contexts.

  The cost is abandoning a simplistic, rule-bound model of rationality. The gain is embracing the rich, contextual, perceptive, and truly human way we navigate the complexities of craft, morality, and life itself. Your folder of examples isn't a failure to find the rules; it *is* the repository of your expertise. Your shrug acknowledges the limits of words, not the absence of understanding. That's not incoherent; it's deeply realistic.
