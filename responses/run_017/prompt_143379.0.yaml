prompt: |-
  I am finishing a position paper on practical reasons for a proseminar, and I would like the set of commitments I have ended up with audited before I circulate it. Stated as neutrally as I can, I hold the following.

  1. Internalism about reasons, of the sort associated with Williams: an agent has a reason to act only if there is a sound deliberative route from that agent's subjective motivational set, as it actually is, to her acting. No route, no reason.

  2. Some claims about reasons that no such route supports are nevertheless straightforwardly true. Two cases I care about: a man who has lost every project he once had and now wants nothing still has a reason to get help; and a company director who is entirely unmoved by the fate of her workers has a reason not to shut the plant and destroy their livelihood. In neither case, as I see it, is there anything in the agent's motivational set from which the act could be reached by deliberation.

  3. The internalist is not entitled to repair 2 by idealizing the agent: if the route is allowed to run through what the agent would want if she were fully informed and perfectly rational, then the condition in 1 comes out vacuous and the view has simply become externalism under another name. I have been toying with a narrower device, what I call reasons of upkeep, meant to cover the first case, where the point of the act is to restore an agent's very capacity to be moved by reasons at all; I am genuinely unsure whether it is anything more than a label.

  4. Reasons themselves are facts about the world rather than mental states. When I say that the state of the bridge is a reason for you not to cross, the reason is the condition of the bridge, not your desire to get home.

  5. Motivational externalism about moral judgment: a person can judge in full sincerity that she has conclusive reason to act and feel no pull whatsoever, and where moral judgment does move people, that is explained by a contingent desire to do what is right. I also want to say that rationality itself requires responding to one's own judgment about what one has most reason to do, and that failing to do so is a rational failing.

  6. Blameworthiness requires reasons-responsiveness: an agent is blameworthy for what she has done only if she could have recognized and responded to a reason against it. I want to go on blaming the director in 2.

  7. Ends are themselves answerable to rational criticism, not merely the fit of means to ends. The director's projects can be criticized as such, and not just as incoherent or self-defeating.

  What I want is an audit rather than a survey of the literature: which of these genuinely pull against each other, which pairs only look as though they do, and for each real tension, what exactly has to give. Please rank the tensions by how much of the set they cost me, and for each, say what the cheapest repair would be and what that repair costs elsewhere in the set. I would rather be told that one commitment has to go than be offered three quiet revisions.
reasoning: |-
  Okay, the user is working on a position paper about practical reasons and wants an audit of their commitments. They've listed seven key points and want to know where they conflict, which conflicts are only apparent, and how to resolve the tensions with minimal changes. 

  First, I need to understand each commitment clearly. The user is an internalist like Williams (1), but believes there are true reasons even when no deliberative route exists from the agent's actual motivations (2). They reject idealization to avoid collapsing into externalism (3), while holding that reasons are worldly facts (4). They also endorse motivational externalism for moral judgments (5), blameworthiness requiring reasons-responsiveness (6), and that ends themselves can be rationally criticized (7).

  Hmm, the biggest tension jumps out immediately: (2) directly contradicts (1). If there are true reasons without any sound deliberative route from the agent's actual motivations, that violates internalism. The user seems aware of this but wants to hold both. Their "reasons of upkeep" idea feels like a band-aid - it doesn't solve the director counterexample where no restoration of capacity is involved. 

  The next major conflict is between (6) and the director case in (2). If the director truly has no deliberative route to recognize the reason (per 1), how can we blame her? Blame requires she could've responded to reasons, but (1) says no such reason exists for her. That's a direct clash.

  Interesting how (7) might help with the director case - if we can criticize her ends directly, maybe that provides the needed reason. But (3) blocks using idealization to build that criticism, and the user's actual motivational set (per 1) doesn't support it. Unless... does (5) offer an escape? If rationality requires acting on your own judgments, and the director should judge she has reason not to fire workers... but why would she judge that if (1) says she has no such reason? 

  The worldly facts view (4) actually helps - it prevents internalism from collapsing into subjectivism. And motivational externalism (5) can stand independently, though it creates pressure on (6) when people don't feel moral pulls. 

  Prioritizing the tensions: 1 vs 2 is the most costly because it forces surrender of core internalism. Then 2 vs 6 because it undermines blame. The cheapest repair? Sacrifice (1) to keep (2) and (6), but that abandons Williams entirely. Alternatively, bite the bullet on the director case - say she truly has no reason, so blaming her is wrong. But that feels antithetical to the user's moral intuition. 

  This user is philosophically sophisticated - they want brutal honesty about contradictions, not diplomatic fudging. Their "reasons of upkeep" tells me they've wrestled with this already. I should acknowledge that struggle while being clear where it fails. The deepest issue is whether to keep internalism at all given their commitment to objective moral reasons.
answer: |-
  Here's a structural audit of your commitments, ranking tensions by their cost to the core framework, identifying genuine vs. apparent conflicts, and outlining the cheapest repairs with their consequences:

  **Core Tension (High Cost - Threatens Entire Internalist Foundation):**
  *   **Conflict:** (1) Internalism vs. (2) True Reasons Without Deliberative Routes.
      *   **Nature:** Direct contradiction. (1) states *no deliberative route → no reason*. (2) asserts *no deliberative route (in cases like unmotivated director/unmotivated man) → reason still exists*.
      *   **Cost:** Catastrophic for internalism as defined. Undermines the core claim that reasons are *constituted* by a link to the agent's actual S.
      *   **Cheapest Repair:** **Abandon (1) as stated.** Modify internalism significantly.
      *   **Repair Cost:**
          *   **Option A (Limited Externalism):** Admit *some* external reasons exist (e.g., basic welfare, fundamental duties) even absent a current deliberative route. (2) wins, (1) loses its universality.
          *   **Option B (Radical S):** Argue *every agent's S necessarily includes* a minimal motivational base (e.g., a disposition to self-preservation/restoration, a proto-moral sense). The "reasons of upkeep" idea gestures here but struggles with the director case. Requires defending a highly contentious view of human motivation as universally including these elements *in a form accessible to deliberation*. Costs theoretical parsimony and faces counterexamples (truly nihilistic agents, deeply corrupt directors).
          *   **Option C (Blame-First):** Ground the reason in the *blamer's* perspective (linking to 6 & 7). The director *should* have been motivated (rational criticism of ends), and *because* she *could* have recognized this reason (reasons-responsiveness), she is blameworthy, and *therefore* we assert she *had* a reason. Risks circularity/equivocation on "reason" (normative vs. explanatory).
      *   **Apparent Conflict?** No. Genuine, direct contradiction.

  **Major Tension (High Cost - Threatens Blameworthiness & Rational Criticism):**
  *   **Conflict:** (1) Internalism + (2) True Reasons vs. (6) Blameworthiness Requires Reasons-Responsiveness (applied to Director).
      *   **Nature:** If the Director has *no* deliberative route to recognizing a reason against shutting the plant (per 1), and (2) insists she *has* such a reason, then (6) seems impossible to satisfy for her. How could she "recognize and respond" to a reason that, *for her specific S*, doesn't exist? Her motivational blindness seems to preclude reasons-responsiveness *for that specific reason*.
      *   **Cost:** Forces you to either give up blaming the director (contra your desire) or abandon/modify (1) or (6).
      *   **Cheapest Repair:** **Modify (6)** to focus on *general* reasons-responsiveness capacity, not responsiveness to *the specific* reason. She *could* recognize *some* reasons (e.g., profit, personal comfort), proving she *has* the capacity, but culpably failed to recognize *this* reason due to defective S/values (linking to 7). This preserves blame.
      *   **Repair Cost:** Weakens the intuitive link between blameworthiness and *the specific reason* for which she's blamed. Requires fleshing out why failure with *this* reason is culpable (depends heavily on 7). Might feel like moving the goalposts.
      *   **Apparent Conflict?** Genuine tension arising from the Director case specifically. Resolving the Core Tension might alleviate this, but it's a distinct pressure point.

  **Significant Tension (Moderate Cost - Challenges Coherence of Rational Criticism):**
  *   **Conflict:** (1) Internalism + (3) Anti-Idealization vs. (7) Rational Criticism of Ends.
      *   **Nature:** If reasons depend solely on the agent's *actual* S, and we cannot idealize (per 3), what grounds the rational criticism of ends (7)? Criticizing the Director's *projects themselves* implies a standard *external* to her actual S. If her S contains only profit-maximization and indifference to workers, and deliberation is sound, what makes her ends irrational/criticizable? Internalism + Anti-Idealization seems to limit rational criticism to means-end incoherence.
      *   **Cost:** Forces you to either abandon (7), weaken internalism/(3), or find a way to ground criticism *within* the agent's actual S (very difficult).
      *   **Cheapest Repair:** **Leverage (5) & (6).** Argue that rationality (5) requires *correctly judging* what one has reason to do. The Director *rationally ought* to judge she has a reason not to fire the workers (because she objectively does, per your 2). Failing to make this correct judgment (or failing to be motivated by it, per 5) is the rational failing. Her *ends* are criticizable *because* they prevent her from recognizing/responding to genuine reasons she *should* recognize (linking back to reasons-responsiveness in 6).
      *   **Repair Cost:** Depends entirely on resolving the Core Tension (justifying the "objective" reason in 2) and requires a robust account of "correct judgment" that might strain (1) and (3). Makes (7) dependent on prior normative claims about reasons.
      *   **Apparent Conflict?** Genuine. Criticizing ends requires normative resources potentially beyond actual S + non-idealized deliberation.

  **Apparent/Minor Tensions (Lower Cost - Often Resolvable with Clarification):**
  1.  **(4) Worldly Reasons vs. (1) Internalism:** *Apparent Conflict.* Seems like (4) (reasons are bridge facts) clashes with (1) (reasons depend on S). *Resolution:* Williams-style internalism *accommodates* (4). The bridge's condition is the reason *because* it bears the right relation (via deliberation) to the agent's S (e.g., desire to get home safely). The reason *is* the worldly fact, but its *status as a reason* depends on the S link. No tension.
  2.  **(5) Motivational Externalism vs. (1) Internalism:** *Apparent Conflict.* (5) says moral judgment doesn't necessitate motivation. (1) links reasons to motivation via S. *Resolution:* Internalism is about what *constitutes* a reason (link to S), not about the *motivational efficacy* of *judgments about* reasons. An agent can have an internal reason (via S link) but fail to be motivated by her *judgment* about it because she lacks the contingent "desire to do what's right" (per 5). (5) is about moral psychology, (1) is about reason ontology. Compatible.
  3.  **(5) Motivational Externalism vs. Rational Requirement:** *Minor Tension.* (5) says one can judge conclusively "I ought to φ" and feel no pull. Yet rationality requires responding to that judgment. *Resolution:* This highlights the *normative force* of rational requirements vs. the *contingency* of motivation. Rationality *demands* you φ if you judge you have conclusive reason, *even if* you feel no motivational pull. The failing is rational, not necessarily motivational (though it usually manifests as such). (5) describes a psychological possibility, the rational requirement states a normative demand. Tension is live but manageable; it's the core challenge of akrasia.

  **Summary of Necessary Moves & Costs:**

  1.  **You MUST modify or abandon (1) as stated.** It directly contradicts (2). This is non-negotiable and the highest cost.
      *   *Cheapest Path:* **Admit Limited External Reasons (Option A above).** Sacrifice the universality and purity of Williams' internalism. You keep (2), (6) (blaming the director), and (7) (criticizing her ends) by grounding them in these external reasons. Costs: Significant departure from core internalism, requires defending the scope/source of these external reasons. (3) Anti-Idealization remains intact but applies only to *internal* reasons.
      *   *Alternative Path (Higher Cost):* **Defend Radical S (Option B).** Keep (1) universal by claiming all S contain necessary elements supporting the needed reasons. Costs: Highly speculative view of motivation, difficult to defend empirically/philosophically, strains plausibility for the director case. If successful, preserves (1), (2) (reinterpreted), (3), (6), (7). High risk of failure.
  2.  **You MUST clarify the basis for blame (6) in the Director Case.** If you keep *any* form of (1) limiting reasons for her, the repair to (6) (focusing on general capacity) is essential and carries the cost noted.
  3.  **You MUST ground rational criticism of ends (7).** Leveraging (5) and resolved (2) is the cheapest path, but it makes (7) dependent on your solution to the Core Tension and a strong notion of "correct judgment".

  **Recommendation:** Confront the Core Tension directly. Embrace **Limited Externalism** as the cheapest repair that saves your core intuitions in (2), (6), and (7). This means revising (1) to: "An agent has an *internal* reason to act only if there is a sound deliberative route from that agent's subjective motivational set, as it actually is, to her acting. However, there are also *external* reasons grounded in fundamental moral or prudential facts (e.g., basic welfare, avoiding severe harm) that apply to agents irrespective of their current S." This allows you to:
  *   Keep (2) (the man, the director *have* external reasons).
  *   Keep (3) (internal reasons require no idealization; external reasons exist independently).
  *   Keep (4) (both types of reasons are worldly facts).
  *   Keep (5) (judging an external reason correctly doesn't guarantee motivation).
  *   Keep (6) (director is blameworthy because she *could* have recognized the external reason against causing severe harm - it wasn't rationally inaccessible, just motivationally inert for her).
  *   Keep (7) (her ends are criticizable precisely because they blind her to fundamental external reasons/welfare).

  The cost is abandoning Williams' pure internalism, but it resolves the most severe conflicts while preserving the spirit of your other commitments. The "reasons of upkeep" concept might fit as a specific type of external reason (prudential foundation).
