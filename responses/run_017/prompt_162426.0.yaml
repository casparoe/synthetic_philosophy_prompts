prompt: |-
  I write fiction — three novels, and I teach an occasional workshop — and there's a thing I keep running into in revision that I don't have a word for. I'd like one, if there is one, but honestly what I want more than a word is the shape of it.

  The basic move first, so you see what I'm not asking about. When a scene goes dead, the fix is nearly always to cut the sentence where the character sizes up her situation and put in the body instead. Out goes "she understood that he'd meant it as an insult"; in goes her hand going back to the deadbolt a second time, the way she can't get her breath all the way down. Everybody says this. Show don't tell, on the nose, whatever. Two other things I keep noticing are not that.

  One: the body outlives the thought. My character finds out at breakfast that the threat was a prank, a dumb joke, nobody was ever in the parking garage. She believes it completely — ask her and she'll say she's safe. At lunch she's still walking to her car with her keys between her knuckles. Nobody in workshop ever flags this as a inconsistency, nobody says wait, she knows better now. And they don't read the belief as the truth and the keys as a leftover habit; they read the keys as the more honest of the two. The fear and the judgment come apart and the fear wins the room.

  Two, and this is the one I actually care about: order. Take a character who believes the dog is harmless and whose hand still goes to the latch. Written one way — "She knew the dog was harmless. Her hand went to the latch anyway" — readers come back describing the fear as an afterimage, already over, and a little sentimental, the way you'd describe something that's finished. Reverse the two sentences — "Her hand went to the latch. She knew the dog was harmless" — and readers describe her as frightened right now, and they keep describing her that way after they've read the second sentence. Same two facts, same character, same paragraph, opposite verdict on whether the fear is still going on. And it works in first person too, where she's the one doing the reporting and has full access to what she believes.

  A writer friend said the first one "recalcitrant emotion," she may have the word slightly wrong, and I definately don't think it covers the second one, because nothing in my case is about a belief she failed to update — she updates fine, on page, out loud — it's the sequence of the sentences that decides whether the thing reads as present or past. So:

  1. Does the second thing have a name of its own, in philosophy of emotion or anywhere else that deals with how emotions get attributed? Or is it the first thing in a different costume, and I'm mistaking one mechanism for two?
  2. Whether or not there's a name, where does it stop? Does it still work in second person, in past perfect, across a chapter break, when the two sentences are split between two characters, when the feeling sentence is narration and the belief sentence is dialogue?
  3. Which of the big accounts of what an emotion is — a kind of judgment, a perceptual experience of value, or a felt bodily episode with a cause — actually predicts the order effect? I want to know whether this is evidence about emotion or only evidence about sentence-level reading, because if it's the second I've been drawing conclusions about my characters for years off something that's really just about prose.

  Don't hand me a label and call it done, and please no reading lists or citations — I can't get at journals and I don't want to chase references. What I want is the carving: what exactly this is, what it isn't, which of the nearest candidates genuinely fits and why the others only look like they do.

  Also: tell me how confident you are in each of the claims you make, and single out the one you're least sure of. And American English, plainly written, if you wouldn't mind.
reasoning: |-
  Okay, let me unpack this writer's query. They're describing two distinct but related phenomena in emotional portrayal, with a deep focus on the second one about sentence sequencing. The core need seems to be: "Help me understand the mechanics of this ordering effect so I can wield it intentionally."

  First, I need to confirm what they're NOT asking. They've already mastered basic show-don't-tell principles. Their two observations are more nuanced: (1) how bodily reactions persist beyond conscious belief (the parking garage keys example), and (2) how sentence order creates different perceptions of emotional states (the dog latch sequence). 

  The writer's frustration with existing terminology is palpable - "recalcitrant emotion" doesn't quite fit because their character does update beliefs consciously. This suggests I should avoid jargon and focus on functional descriptions. Their three numbered questions reveal precise needs: a conceptual framework (Q1), practical boundaries (Q2), and theoretical grounding (Q3).

  Hmm... the sequence effect feels rooted in cognitive psychology. When body-reaction comes first, it sets an anchor - readers experience the sensation in real-time, then interpret the belief as secondary. Reverse order lets readers "file" the physical reaction under past-tense emotion immediately. This might connect to "somatic marker" theory where bodily feelings frame interpretation.

  For Q2 about boundaries: I suspect the effect weakens with distance (chapter breaks) or perspective shifts (two characters), but might persist in second person since it maintains immediacy. Past perfect could disrupt it by adding temporal layers. Least confident here - these are hypotheses needing testing.

  Q3 is fascinating. Judgment-based emotion theories (Solomon) can't explain why order matters. Perceptual theories (Prinz) come closer by prioritizing bodily input. But predictive processing models (Clark) fit best - the body data generates predictions that beliefs then try (and fail) to override.

  Biggest uncertainty is whether this is about emotion per se or narrative processing. Probably both: the sequence manipulates how readers simulate the character's mind. But I'll flag this as my shakiest point.

  The writer's examples are gold - I'll use them to illustrate concepts without academic references. Key is emphasizing that this is about reader perception construction, not just character psychology. Their craft observation reveals how prose sequence controls emotional vividness.
answer: |-
  Here's the carving, plain as I can make it:

  **The Two Mechanisms (They're Separate)**

  1.  **The Persistence Effect:** (Your "body outlives the thought")
      *   **What it is:** The automatic physiological/bodily response (fear-flinch, key grip) persists even after the conscious *belief* driving the initial threat assessment has been rationally updated and accepted ("it was a prank").
      *   **Why it works:** It aligns with how brains work. Fear circuits (amygdala) activate fast and bypass conscious thought. Deactivating them takes time, even after the cortex (reasoning) gets the "all clear." Readers intuitively recognize this lag as deeply human and authentic. The *body* is reporting a deeper, older, more visceral truth than the *declarative statement*. Confidence: **Very High**. This is well-established in affective neuroscience and psychology (think "fight-or-flight" lingering).

  2.  **The Sequencing Effect:** (Your "order" effect with the dog latch)
      *   **What it is:** The order of sentences fundamentally alters the reader's perception of the *current, active emotional state*, even when reporting identical facts.
      *   **Why it works:**
          *   **Primacy & Anchoring:** The *first* piece of information sets the stage and creates an anchor for interpretation. "Hand to latch" first establishes *immediate action/sensation*, painting the *present moment* with fear. "Knew it was harmless" first establishes the *intellectual context*, framing the subsequent action as a *relic* or *override*.
          *   **Simulating the Character's Stream of Experience:** Prose unfolds linearly. When the body *leads*, readers simulate the character experiencing the sensation *first*, then perhaps recalling the belief. When the belief *leads*, readers simulate the character *thinking* first, then perhaps noticing the lingering bodily residue. The sequence mimics the perceived order of internal events.
          *   **Attribution of Salience:** What comes first feels more prominent, more "present." The hand on the latch *demands* attention as the current reality if stated first. Stated second, it feels like a footnote to the established belief. Confidence: **High**. This is a robust effect in narrative psychology and reader response theory, grounded in cognitive principles of attention and information processing.

  **Answers to Your Questions:**

  1.  **Does the second thing (Sequencing Effect) have a name? Is it related to the first?**
      *   **Name:** There isn't one single, perfect, universally recognized term. **"Emotional Primacy in Narration"** captures the core idea. Related concepts are "salience through order," "anchoring bias in emotional description," or the "narrative framing of affect." It is *distinct* from the Persistence Effect.
      *   **Relation:** They are *separate mechanisms* that often *work together* to create complex emotional states. The Persistence Effect explains *why* the body might react against belief (the *content*). The Sequencing Effect explains *how the order of presenting that content* shapes the reader's perception of its *current intensity and relevance*. You can have Persistence *without* needing the specific Sequencing effect (e.g., describing the keys later in a scene without contrasting it immediately with belief). You can have a Sequencing effect *without* Persistence (e.g., describing a *current* fleeting fear vs. a memory of fear based on order alone). Confidence: **High** on distinction, **Medium** on naming (no single perfect term exists).

  2.  **Where does the Sequencing Effect stop? (Confidence levels noted per point)**
      *   **Second Person ("You..."):** Likely **works similarly or stronger.** "You knew the dog was harmless. Your hand went to the latch anyway" still frames the fear as residual. "Your hand went to the latch. You knew the dog was harmless" makes the fear feel immediate and primary, forcing the "you" character (and reader) to reconcile the physical impulse with the belief. Confidence: **High**.
      *   **Past Perfect ("She *had known*..."):** **Weakens the Sequencing Effect significantly.** Past perfect explicitly places the belief *further in the past*. "Her hand went to the latch. She *had known* the dog was harmless" makes the belief feel distant *regardless* of order. The fear might still feel present due to the simple past action. The order manipulation loses much of its power against the strong temporal marker. Confidence: **Medium-High**.
      *   **Across a Chapter Break:** **Likely disrupts or resets the effect.** The break creates a temporal and cognitive separation. The reader starts the new chapter fresh. The *immediate* context within the new chapter's paragraphs will dominate the perception of emotional state. The previous chapter's *last* sentence might create an overall mood, but the fine-grained sequencing effect within the new scene will follow its own local rules. Confidence: **Medium**.
      *   **Split Between Two Characters:** **Changes the effect fundamentally.** If Character A observes Character B's hand go to the latch, then Character B *says* "I know it's harmless," the reader is interpreting *Character A's observation* and *Character B's statement*. It becomes about *Character A* perceiving B's fear vs. B potentially downplaying it, or B's internal conflict expressed externally then verbally. The pure internal sequencing effect on a single character's state is lost. Confidence: **High**.
      *   **Feeling (Narration) vs. Belief (Dialogue):** **Alters but doesn't destroy the effect.** "Her hand went to the latch. 'I know he's harmless,' she said." The *narration* (hand) still feels more like an objective report of current state/action. The *dialogue* (belief) is filtered through performance (is she convincing herself? convincing others?). The hand still carries significant weight as an involuntary cue, potentially conflicting with the spoken belief. The pure "which is more present?" effect is slightly muddied by the shift in voice, but the body cue often retains primacy. Confidence: **Medium**.

  3.  **Which Emotion Theory Predicts the Sequencing Effect?**
      *   **Judgment-Based Theories (e.g., Solomon):** **Fails.** If emotion *is* the judgment ("I judge this to be threatening"), then stating the judgment *should* define the emotion. The order of reporting the judgment vs. a physical remnant shouldn't fundamentally change the perception of the *current* emotional state. It doesn't predict the power of the body-first sequence.
      *   **Perceptual Theories of Value (e.g., Tappolet, Prinz - 'embodied appraisal'):** **Gets Closer.** These see emotion as a perception of value (threat, benefit) often grounded in bodily feelings. The body-first sequence aligns nicely: the bodily cue *is* (or directly reports) the perceptual experience of threat, which *then* conflicts with the cognitive belief. The belief is seen as *overriding* the perception. Confidence: **Medium-High** (fits well with the primacy of the body cue).
      *   **Felt Bodily Theories (e.g., James-Lange):** **Partially Predicts, But Limited.** If emotion *is* the perception of bodily changes, then describing the bodily change first *should* directly establish the emotion. However, pure James-Lange struggles with the *conflict* aspect and might not fully explain why stating the belief *after* the body doesn't immediately negate the feeling perception for the reader.
      *   **Predictive Processing / Active Inference (Modern Framing):** **Best Fit.** This views the brain as constantly generating predictions about the world and itself. The body-first sequence ("Hand on latch") presents a strong sensory prediction error ("I am acting scared!") that the brain (character's and reader's simulating it) must explain. The subsequent belief ("Dog is harmless") is a *competing* top-down prediction trying to resolve the error. The body-data feels present and demanding because it *is* the incoming sensory signal generating the conflict. The belief-first sequence sets the top-down prediction ("Harmless") first, making the body cue ("Hand on latch") a smaller prediction error, easily explained away as habit or residue. This explains the immediacy of the fear in the body-first sequence and its diminished status in the belief-first sequence. Confidence: **High** (for predicting the *effect*).
      *   **Conclusion on Q3:** This effect provides **strong evidence for how emotion is represented *in narrative* and perceived *by readers*.** It leverages core cognitive processes (primacy, anchoring, simulation). While it reflects real psychological phenomena (Persistence Effect), the *Sequencing Effect* specifically demonstrates **how narrative structure (sentence order) powerfully shapes the reader's simulation of the character's *present moment experience*.** It's evidence *for* the primacy of bodily/experiential signals *in reader interpretation* within a narrative context. Confidence: **High** that it's about both emotion *and* prose mechanics – they are inseparable here. The prose mechanics *create* the specific emotional simulation for the reader.

  **Least Confident Claim:** My confidence is **lowest on the *exact* boundaries of the Sequencing Effect across large distances like chapter breaks.** While I strongly suspect the effect is most powerful within a tight local context (a paragraph/scene) and weakens significantly across breaks, proving the precise point of dissolution is harder. Reader attention and memory reconstruction play bigger roles there. It's more an intuition based on narrative flow than a hard rule I can cite definitive evidence for.

  **The Carving:**

  *   **Persistence Effect:** Body keeps score, even after the mind knows the game is over. (Mechanism: Slow neurobiological deactivation of threat response).
  *   **Sequencing Effect:** The order of reporting body vs. belief dictates whether the emotion feels *live* or *archival* to the reader. (Mechanism: Cognitive Primacy/Anchoring & Simulation of Stream of Experience within Narrative).
  *   **What it is:** A fundamental tool of narrative control over perceived emotional immediacy.
  *   **What it isn't:**
      *   Just "show don't tell" (it's about *which* thing you show *first*).
      *   Recalcitrant emotion (that implies the belief *hasn't* updated, which it has in your case).
      *   Solely about the character's psychology (it's equally about the reader's cognitive processing of the text).
      *   A universal law unaffected by context (tense, distance, perspective modulate it).

  You've hit on a profound, under-discussed aspect of craft: **sentence order as emotional timestamp.** It's not just *what* the character feels, but *when the reader feels they feel it* relative to other internal facts. That's the shape.
