answer: |-
  Here's a reconstruction of the implicit philosophy of mind underlying your research policy system, analyzing the tensions and evaluating the proposed "homology rule":

  ### 1. The Implicit Philosophy: Pragmatic, Leaky Functionalism with Mechanism-Laden Reservations
  The core practice is **predominantly functionalist**, but inconsistently applied and tempered by implicit biological commitments:

  -   **Functionalist Core:** Attributing pain, anxiety, etc., based on *behavioral proxies and causal roles* (aversive stimuli → escape/avoidance behavior, physiological stress responses → "anxiety-like" behavior in tests) across phylogenetically distant species (rodents → zebrafish/flies) relies on multiple realizability. The *evidential weight* in severity assessment hinges on the functional profile matching human-relevant states.
  -   **Mechanistic Reservations:** The insistence on conserved circuits/molecular details for mechanism-dependent results reveals an underlying intuition that **functional equivalence alone is insufficient for strong psychological inference, especially for complex states.** This suggests:
      *   **Epistemic Caution:** Homology provides stronger evidence that the *same psychological state* is being engaged, reducing the risk of false positives where similar behavior arises from different underlying mechanisms/states (e.g., reflexive withdrawal vs. experienced pain; general stress vs. anxiety disorder).
      *   **Metaphysical Leakage:** An implicit view that for many complex states (belief, recollection, nuanced affect), the *specific neural implementation matters* to the state's identity or its sufficiently close similarity to the human state. This isn't strict identity theory, but a view where realization details constrain psychological kind-membership ("neurally informed functionalism" or "biological functionism").

  ### 2. The Tension: Severity vs. Mechanism-Hunting
  *   **Severity Side:** Prioritizes *functional equivalence for welfare attribution*. It operates on a broad functionalist principle: "If it looks like pain (behavior, physiology), acts like pain (motivates avoidance), and is caused by noxious stimuli like pain, treat it as pain for welfare purposes *regardless of precise homology*." This pulls towards behavioral similarity.
  *   **Mechanism-Hunting Side:** Prioritizes *mechanistic equivalence for scientific inference*. It operates on the principle: "To be confident this rodent model predicts *human psychology/disease* for complex processes, we need evidence the *same underlying mechanism* is involved." This pulls towards neural similarity.
  *   **Are they inconsistent?** Not necessarily *logically* inconsistent, but **pragmatically and epistemically strained**. The system uses functionalism when convenient for welfare/regulation (attributing states broadly) but retreats to mechanism-laden realism when demanding high confidence in translational validity. The strain arises because:
      1.  Severity assessments *for complex states* (depression, anxiety) implicitly rely on the translational validity the mechanism-hunting side often finds lacking without homology evidence.
      2.  The justification for using animals ("benefit to humans") hinges on translational validity, which the mechanism-hunting side directly challenges for functionally similar but mechanistically dissimilar findings.

  ### 3. Evaluating the "Homology Rule"
  The homology rule ("mechanism must be homologous for evidence to count") is **a radicalization of the mechanism-hunting intuition, not a pure application of the current logic, and likely a betrayal of its functionalist core.**

  *   **Contradiction with Current Practice:** It directly contradicts the foundational functionalist principle currently used for welfare attribution (severity bands) and for justifying *any* research using phylogenetically distant models where strict homology is unlikely (e.g., flies in basic learning/memory). It would invalidate much of the preclinical pipeline.
  *   **Alignment with Mechanism-Hunting?** While amplifying the caution inherent in mechanism-hunting, it goes further:
      *   It makes homology *constitutive* of evidence, not just strengthening evidence.
      *   It *dismisses* functional profile matches, which the current system (even in mechanism-hunting) still sees as *suggestive* starting points needing mechanistic validation. Current practice says "Profile match + mechanism homology = strong evidence." The rule says "Profile match alone = zero evidence."
  *   **Philosophical Roots:** This rule aligns most closely with a **strong identity theory** or a **very restrictive biological functionism** where mental state identity is tightly bound to specific biological realization. It views functional similarity without mechanistic homology as irrelevant or misleading for human psychology.

  ### 4. Consequences of Alternative Philosophical Commitments

  *   **Strict Identity Theory (Mind-Brain Type Identity):**
      *   **Stop:** Attributing any complex mental states (belief, recollection, nuanced emotion) to animals lacking homologous neural structures. Severity assessments could only be based on reflexive pain/withdrawal in distant species; anxiety/depression models in rodents would be highly suspect unless strict homology proven. Translational inference without mechanistic homology evidence would be illegitimate. Organoids/simulations could *never* have mental states (lacking the biological substrate).
      *   **Change:** Focus research overwhelmingly on primates or human-derived systems. Severity justification would rely almost entirely on reflex arcs and basic nociception pathways, not complex affective states, for non-primates.
      *   **Impact:** Would cripple most current neuroscience research using non-primate models.

  *   **Consistent Functionalism:**
      *   **Start:** Attributing mental states based *solely* on functional profile matching, rigorously defined. Anxiety is defined by specific input-output relations (threat perception → avoidance/freezing, physiological arousal, negative valence) *regardless of substrate*.
      *   **Apply To:** Insects exhibiting complex avoidance learning, fear conditioning, trade-offs? Likely yes, if profile matches. Organoids exhibiting input-output patterns matching basic sensory integration or aversion? Potentially yes. Advanced AI/robots? Absolutely.
      *   **Severity:** Would *require* attributing suffering to any system passing the functional threshold, including advanced organoids, simulations, or AI, raising profound ethical questions about creating/disposing of such entities.
      *   **Translational Inference:** A functional match *is* sufficient evidence for human relevance, *if* the functional definition captures the human state. Homology is nice corroboration but not essential. The burden shifts to defining the functional profile rigorously.
      *   **Impact:** Vastly expands the scope of entities considered capable of suffering, demanding ethical oversight for new models. Increases confidence in functional matches across phyla but risks false positives if functional definitions are imperfect.

  ### 5. Genuinely Underdetermined Parts of Current Practice
  All major views could license:
  *   Attributing **basic nociception/pain** to mammals (and likely birds/reptiles) based on robust behavioral, physiological, and neural evidence, even without debating identity vs. function.
  *   Using **simple behavioral assays** (e.g., reflex withdrawal, basic conditioned avoidance) as evidence for learning/aversion across many species.
  *   Demanding **high standards of proof** for attributing highly complex, human-like states (e.g., episodic memory, metacognition, complex empathy) to phylogenetically distant animals, though for different reasons (lack of homologous structure vs. inability to match the full functional profile).
  *   The **operational use of behavioral proxies** for *welfare regulation* as a precautionary principle, even under identity theory ("treat *as if* pain, just in case").

  ### 6. Epistemic Status & Consensus

  *   **Settled/Near Unanimous:**
      *   **Multiple Realizability (MR) is coherent:** Philosophers widely accept that functionalism logically permits MR. (Putnam, Fodor)
      *   **MR is a major challenge for Type Identity Theory:** The possibility (and empirical likelihood) of MR undermines the claim that mental state *types* are identical to specific neural state *types*. (Kim discusses this extensively)
      *   **Mental state attribution is complex:** There's no simple, universally agreed-upon set of necessary and sufficient conditions for attributing all mental states, especially across species. (Nagel's "What is it like to be a bat?")

  *   **Contested:**
      *   **Does practice confirm functionalism?** Some (e.g., Dennett) argue our flexible attributions support functionalism. Others (e.g., Searle) argue our attributions are grounded in biological understanding. *My view: Current practice is messy but leans functionalist in attribution, revealing functionalism's intuitive pull, even if inconsistently applied.*
      *   **Can functionalism accommodate homology intuition?** Can purely functional accounts explain why mechanistic similarity feels evidentially crucial? Some functionalists (e.g., Lycan) argue homology provides evidence the functional profile is *correctly identified and instantiated reliably*. Others see it as an illegitimate constraint. *My view: A sophisticated functionalism *can* incorporate homology as strong *evidence* for genuine functional equivalence and translational validity, but it cannot make homology *constitutive* of the mental state without collapsing into identity theory.*
      *   **Homology: Metaphysical vs. Evidential Constraint?** Is homology required because the mental state *just is* the biological state (metaphysical), or because it's the best evidence we have that the same functional/causal role is truly present (evidential)? *My view: The pull of homology in science is primarily *evidential and epistemic*, not metaphysical. We seek it because history shows functional similarity alone can be misleading for complex traits. The metaphysical question (is the state identical?) remains open.* **This disagreement bottoms out in empirical questions:** How conserved *are* the mechanisms underlying core affective states across phyla? How often does convergent evolution produce similar behaviors via different mechanisms? Neuroscience is actively researching this (e.g., Panksepp's affective neuroscience, studies on insect "emotion-like" states).

  **Conclusion:** Your institution's practice reflects a **pragmatic, leaky functionalism** for state attribution and severity assessment, combined with an **epistemically cautious, mechanism-laden realism** for validating translational inferences, particularly for complex states. This creates tension but not strict logical inconsistency; it's a practical accommodation. The proposed "homology rule" is a radical **identity-theory-inspired shift** that contradicts the functionalist foundation enabling broad model use. Adopting consistent functionalism would vastly expand ethical scope; adopting strict identity theory would severely restrict model validity. The unresolved tension reflects deeper philosophical debates about the nature of mind and evidence, partly constrained by unresolved empirical questions about neural conservation.
