answer: |-
  ## Graduate Seminar Proposal: Reassessing the Utility Monster’s Bite – Is Separateness of Persons Really Doing the Work?

  **Working Title:** Intrapersonal Monsters and the Fate of Separateness: Re-examining the Utility Monster Objection

  **1. Research Question**
  Does the intuitive force of the interpersonal utility monster objection fundamentally depend on the *separateness of persons*, or is it primarily driven by concerns about the *shape of the aggregation function* (specifically, the absence of diminishing marginal weight or distributive fairness constraints), as evidenced by the lack of analogous intuitive discomfort in structurally parallel *intrapersonal* cases?

  **2. Background & Problem Statement**
  The utility monster (UM) objection, famously associated with Robert Nozick, posits an individual capable of deriving vastly greater welfare from resources than others. Utilitarianism, by summing welfare impartially, demands we funnel all resources to this "monster," seemingly violating strong intuitions about fairness and the moral significance of individuals' distinctness (the "separateness of persons" - SoP). This is widely presented as a *distinctive* problem for utilitarianism arising *specifically* from aggregating across separate persons.

  However, an intrapersonal analogue exists: consider an agent choosing between a modest present benefit for their current self versus enabling an *enormously* greater future benefit for their future self (e.g., due to enhanced capacities, radically improved circumstances, or even a different "phase of life" with higher hedonic potential). Utilitarian (or even standard expected utility) intrapersonal aggregation similarly privileges the state (current or future) with the highest aggregate welfare potential. Yet, this conclusion generally feels *less* counterintuitive, or even prudent (e.g., saving for retirement, investing in education). **The crux:** If the core objection in the interpersonal UM case isn't unique to SoP but stems from aggregation *shape* (e.g., lack of priority to the worse-off, no diminishing returns), then the UM should pose a similar challenge *within* a life and, crucially, to *any* aggregative theory lacking these features – including prioritarianism, which explicitly claims to respect SoP but aggregates weighted welfare. The standard dialectic, which positions the UM as a *uniquely interpersonal* and *uniquely utilitarian* problem, may be misleading.

  **3. Method: Testing the Mechanism**
  To isolate the source of the objection, the project will dissect the UM into two distinct mechanisms and build parallel interpersonal/intrapersonal cases for each. Prioritarianism will then be tested against both:

  *   **Step 1: Disambiguating the Monster**
      *   **Capacity Monster (CM):** Focuses on inherent *capacity* for welfare. Monster-M has a vastly greater innate ability to experience welfare states than others (or their own future self has this capacity compared to their present self). Welfare *per unit of resource/effort* might be similar, but the *ceiling* is much higher.
      *   **Conversion-Rate Monster (CRM):** Focuses on *efficiency*. Monster-M converts resources/actions into welfare units at a vastly higher *rate* than others (or their future self does compared to their present self). The same resource input yields massively more welfare for M. (This often overlaps with CM but is conceptually distinct).
      *   *Rationale:* These mechanisms might trigger different intuitions and interact differently with aggregation functions.

  *   **Step 2: Construct Parallel Cases**
      *   For each Monster type (CM, CRM), create:
          1.  **Standard Interpersonal Case:** Resource allocation between Monster-M and numerous non-Monster individuals (N1, N2...).
          2.  **Intrapersonal Analogue:** Choice for a single agent between a course of action benefiting their *current self* (modestly) versus a course benefiting their radically enhanced *future self* (enormously), replicating the CM or CRM dynamic internally.
      *   *Example (Capacity Monster - Intrapersonal):* An artist faces a choice: (A) Take a moderate stipend now allowing basic comfort and limited creative work. (B) Endure significant hardship/poverty now (low welfare) to fund revolutionary therapy that will vastly enhance their sensory/cognitive/emotional capacities in 5 years, enabling profound creative fulfilment and hedonic states *impossible* for their current self.

  *   **Step 3: Analyse Intuitions & Theoretical Responses**
      *   Analyse whether the intuitive discomfort present in the interpersonal case *persists* in the intrapersonal analogue for each Monster type. Is the intrapersonal case seen as disturbing, prudent, or neutral?
      *   Apply **Prioritarianism** (specifically, a version like Parfit's, where priority is given to benefiting the worse-off *individual*, weighting welfare gains inversely to the recipient's absolute welfare level) to *both* interpersonal and intrapersonal cases for each Monster type:
          *   *Interpersonal (CM/CRM):* Does prioritarianism avoid sacrificing the non-Monsters? (Likely yes, if non-Monsters are worse off). Is this intuitive?
          *   *Intrapersonal (CM/CRM):* Does prioritarianism prioritise the *current* (potentially worse-off) self over the *future* high-capacity self? If the current self is significantly worse off than the future self will be, prioritarianism *should* favour aiding the current self, potentially rejecting the enormous future gain. Is *this* conclusion intuitively plausible, or does it seem counterintuitive/irrational in the intrapersonal context?

  **4. Possible Conclusions & Deciding Factors**

  *   **Conclusion A (SoP is Key):** Significant intuitive discomfort *only* arises in the interpersonal cases, persisting even under prioritarianism in the intrapersonal analogues where it favours the present self. The UM objection *is* fundamentally rooted in SoP. Prioritarianism successfully addresses the interpersonal UM *because* it respects SoP via weighting.
      *   *Deciding Factor:* Strong, persistent intuitive divergence between interpersonal and intrapersonal cases *across both Monster types*, especially where prioritarianism yields counterintuitive results intrapersonally but intuitive ones interpersonally.
  *   **Conclusion B (Aggregation Shape is Key):** Intuitive discomfort stems primarily from the *linear summation* or lack of distributive constraints (diminishing marginal weight, priority to the worse-off), *not* SoP per se. This is evidenced by:
      *   Similar discomfort arising in intrapersonal cases if presented starkly (though perhaps lessened by psychological biases like identity continuity), *or*
      *   Prioritarianism feeling counterintuitive in the intrapersonal case where it sacrifices enormous future gains for modest current ones – demonstrating that the "monstrous" aggregation shape is problematic *even within a life*.
      *   *Deciding Factor:* Intuitions aligning more with concerns about aggregation shape (e.g., discomfort when gains aren't prioritised for the worse-off, even intrapersonally; acceptance of aggregation when priority/diminishing returns are built-in). Prioritarianism struggling with the intrapersonal analogue would be strong evidence.
  *   **Conclusion C (Hybrid/Fairness Constraint):** SoP plays a role in *triggering* demands for fairness constraints (like priority), but the core objection is to the unconstrained aggregation. The UM highlights the *need* for such constraints in any aggregative view, interpersonally *and* potentially intrapersonally in specific contexts (e.g., radical future selves).
      *   *Deciding Factor:* Evidence that SoP catalyses the demand for distributive constraints, but the constraints themselves are the primary solution, applicable beyond strict interpersonal boundaries.

  **5. Feasibility, Risks, and Scope**

  *   **What Counts as Failure?**
      *   **Inconclusive Intuitions:** The constructed intrapersonal cases fail to elicit clear or consistent intuitions, or the parallels are judged too dissimilar to be informative (e.g., identity concerns dominate).
      *   **Prioritarianism's Behaviour is Ambiguous:** The application of prioritarianism to the intrapersonal cases is technically or conceptually messy (e.g., defining "the worse-off" across time within one life).
      *   **Oversimplification:** The dissection into CM/CRM proves inadequate or fails to capture the core UM dynamic.
  *   **Honest Feasibility Assessment:**
      *   **Manageable for One Term:** The core analysis – disambiguating the UM, building the 4 key cases (Inter-CM, Inter-CRM, Intra-CM, Intra-CRM), and testing intuitions and prioritarianism against them – is a focused and achievable core for a seminar paper. It avoids exhaustive historical exegesis or engagement with every variant of prioritarianism/utilitarianism.
      *   **Key to Success:**
          1.  **Precise Case Construction:** Time must be spent crafting clear, compelling, and parallel thought experiments.
          2.  **Focused Scope:** Prioritise analysing the Capacity Monster (CM) first, as the "innate potential" aspect may provide the cleaner test. Explicitly bracket deep metaphysical issues about personal identity over time – assume sufficient continuity for the thought experiment. Focus primarily on one formulation of prioritarianism.
          3.  **Manage Expectations:** The project aims for a *plausible challenge* to the standard narrative and a *clarification* of the dialectic, not a definitive refutation of SoP or prioritarianism. Analysing *why* the conclusions matter (shifting the dialectic) is crucial.
      *   **Risk Mitigation:** If time runs short, the paper can focus exclusively on the Capacity Monster (CM) comparisons, which are central to the core intuition about innate potential, offering a still-significant contribution. The Conversion-Rate Monster (CRM) can be addressed more briefly or flagged for future work.

  **6. Significance**
  This project challenges the standard framing of the utility monster objection. If separateness of persons is not the core driver, the objection transforms from a *unique* problem for interpersonal utilitarianism into a *general* constraint on aggregative axiologies – demanding features like priority or diminishing returns, *even within a single life*. This significantly shifts the dialectic: prioritarianism could no longer claim to straightforwardly "solve" the UM solely by respecting SoP; it would need to justify why its aggregation function is acceptable intrapersonally if it avoids the interpersonal monster. The project refocuses the debate on the fundamental structure of aggregation itself.
