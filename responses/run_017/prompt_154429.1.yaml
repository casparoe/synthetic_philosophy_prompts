prompt: |-
  hey — act as a philosopher of language / translation theorist who also happens to write very dry corporate satire. I need one parody piece for something I'm putting together on translation under formal constraint (the whole "does preserving rhyme, meter and shape preserve anything worth preserving" question, Le Ton beau de Marot territory).

  Format: the release notes / changelog for version 3.0 of a machine-translation product, call it something like Verso. In 2.x it translated for sense; 3.0 ships a new "strict isomorphy" mode that will never break form to save meaning — same line count, same syllable count per line, same rhyme scheme, same terminal stress, and as the headline feature it preserves the source's acrostic (the first letters of the lines spell something). Meaning is ranked dead last in the priority order, and the notes should say so cheerfully.

  Before you write, brainstorm for a second on what a real formalist about translation actually thinks form carries — that the shape is part of the content, that a rhyme does argumentative work, that the constraint is partly what makes the poem the poem — then pick two or three of those commitments and push them until they're ridiculous. The jokes have to come from getting the tradeoff right, so a translation theorist laughs instead of wincing: show the engine quietly solving impossible constraints by swapping the referent, inventing proper names, rhyming on grammatical particles, replacing a metaphor with a different metaphor that happens to have the same number of syllables. Include one mock customer testimonial and a "known issues" section where at least one entry is really an admission that the product is doing something indefensible. The target is the formalist premise, not "ha ha machines are dumb" — the product is just the straight face it's wearing.

  Also invent one concrete worked example: a short stanza (4-6 lines) in an imaginary source language, with a bracketed English gloss, and then what Verso 3.0 outputs. The acrostic should be doing real damage — it forces some line to say nearly the opposite of the source. Around 500-700 words, deadpan corporate voice throughout, no winking, and definately don't explain the joke at the end.
