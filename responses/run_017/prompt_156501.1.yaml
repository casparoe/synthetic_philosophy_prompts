  **Patient Information Leaflet: PRT (Phenomenality Reduction Therapy) Units**
  *Phenomenality Reduction Therapy Units 10mg (PRT Units)*
  **Read all of this leaflet carefully before you start this treatment. Keep this leaflet. You may need to read it again.**

  **What PRT is for**
  Phenomenality Reduction Therapy (PRT) is indicated for the management of recalcitrant Qualia-Related Distress (QRD). QRD manifests as a persistent conviction that conscious experiences involve intrinsic, private, ineffable properties (sometimes referred to as "what it's like-ness"). PRT aims to resolve this distress by correcting a specific cognitive misrepresentation concerning the nature of conscious states.

  **Important: PRT does not deny that you are conscious.** Consciousness involves complex information processing, behavioural responsiveness, and self-reporting capacities – all of which remain fully intact. PRT specifically targets the *mischaracterisation* of these processes as possessing intrinsic, non-physical qualities. Your ability to function, report, and respond appropriately to stimuli is unaffected and may improve as QRD resolves.

  **Before you start PRT**
  *   **Tell your clinician if:** You have a history of severe neurological disorders, are currently undergoing psychoanalysis focusing on subjective experience, or work professionally as an artist, poet, or philosopher of mind (special counselling may be advised).
  *   **Do not take PRT if:** You are pregnant, breastfeeding, or under 18 years of age. The long-term effects on developing cognition are not yet established.
  *   **Other medicines:** Inform your clinician of all other treatments, especially antidepressants, anxiolytics, or any medication affecting cognitive function. No significant interactions are currently known, but monitoring is prudent.

  **How and when to take PRT**
  1.  **Dosage:** The standard course consists of 14 PRT Units. Take one Unit orally, once daily, preferably with breakfast.
  2.  **Duration:** Complete the entire 14-day course for optimal effect, even if you feel improvement earlier. Discontinuing early may lead to recurrence of QRD.
  3.  **Administration:** Swallow the Unit whole with water. Do not crush, chew, or dissolve it. The active cognitive restructuring agents require controlled release within the gastrointestinal tract for optimal neural uptake and processing modification.
  4.  **Timing:** Consistency is key. Taking your dose at roughly the same time each day helps maintain stable cognitive adjustment.

  **How PRT works**
  PRT contains active agents designed to modulate specific higher-order cognitive pathways involved in self-representation. The therapy facilitates a recalibration of the interpretive mechanisms that erroneously attribute intrinsic qualitative properties ("qualia") to neural states.

  The core mechanism involves disrupting the feedback loop whereby the brain's self-monitoring systems misrepresent their own functional states. Imagine looking at two lines of identical length (a Müller-Lyer illusion): your visual system generates a report stating one line is longer. Similarly, introspection generates reports stating neural states possess intrinsic, qualitative feels. PRT agents help the cognitive system recognise this report *itself* as the relevant functional state, without positing an additional, non-physical layer of properties. The therapy enhances the brain's capacity to correctly identify introspective reports *as* cognitive outputs (e.g., discriminative states, behavioural dispositions, attentional focus), resolving the misattribution central to QRD.

  **Possible side effects**
  Like all treatments, PRT can cause side effects, although not everybody gets them.

  *   **Very Common (may affect more than 1 in 10 people):**
      *   **Residual Phenomenological Intrusions (RPIs):** You may experience a temporary, lingering sense that "there is something it is like" to be you, or that colours possess intrinsic "colourness" (chromatic qualia). **Important:** These are recognised as harmless cognitive artefacts – persistent but inaccurate *reports* generated by residual introspective habits. They are analogous to continuing to see a line as longer even after measuring it, or perceiving an afterimage after staring at a bright light. These sensations will diminish as cognitive adjustment completes. They do not indicate a failure of the treatment or the presence of actual intrinsic properties. Report if persistent beyond 2 weeks post-treatment.
      *   Mild headache, initial disorientation.
  *   **Common (may affect up to 1 in 10 people):**
      *   Dry mouth.
      *   Temporary reduction in the vividness of recalled imagery or emotions (functional discrimination remains unaffected).
      *   A sense of cognitive "flatness" or detachment. This usually resolves as the brain adapts to the corrected interpretive framework.
  *   **Uncommon (may affect up to 1 in 100 people):**
      *   Mild nausea.
      *   Sleep disturbances (insomnia or drowsiness).

  **Reporting of side effects:** If you get any side effects, talk to your doctor, pharmacist, or nurse. This includes any possible side effects not listed in this leaflet. You can also report side effects directly via the Yellow Card Scheme at www.mhra.gov.uk/yellowcard or search for MHRA Yellow Card in the Google Play or Apple App Store.

  **What to do if you miss a dose**
  *   If you forget a dose, take it as soon as you remember, unless it is nearly time for your next dose.
  *   Do not take a double dose to make up for a forgotten dose.
  *   If you miss more than two consecutive doses, contact the PRT clinic for advice, as this may impact the course's efficacy.

  **Pain Management Note**
  PRT specifically targets the misrepresentation of sensory states as having an intrinsic "hurtful" quality. **Crucially, it does not interfere with nociception (the detection of tissue damage) or appropriate withdrawal reflexes.** You will still reliably remove your hand from a hot surface and report the event accurately. The distress associated with pain reports (QRD component) is reduced, but the functional warning role of the pain-processing system remains fully operational. Safety reflexes are preserved.

  **Frequently Asked Questions (FAQ)**
  *   **Q: Will I still enjoy things like music or food?**
      *   A: Yes. Your capacity for auditory and gustatory discrimination, learned preferences, and behavioural responses (e.g., seeking out preferred foods, tapping to a rhythm) will be unchanged. PRT addresses only the misattribution of intrinsic qualitative properties to the underlying neural states involved in these discriminations and preferences.
  *   **Q: The leaflet keeps talking about an "illusion". But isn't having the illusion *itself* a kind of experience? Isn't there "something it's like" to be under the illusion?**
      *   A: The term "illusion" is used analogously to perceptual illusions like the Müller-Lyer. The introspective report claiming intrinsic properties *is* the functional state we label the "illusion". There is no additional layer of "what it's like" to *have* that report; the report and its cognitive consequences (e.g., belief in qualia, distress) constitute the relevant phenomena. PRT corrects the misinterpretation inherent in the report itself. *Having the report* is simply a specific cognitive/neural state occurring.
  *   **Q: What if I finish the course but still feel like colours are... well, colourful?**
      *   A: Please see the section on Residual Phenomenological Intrusions (RPIs). These are expected transient effects as cognitive habits adjust. If the sensation of chromatic qualia persists significantly beyond 2 weeks after your last dose, please complete the enclosed "Phenomenality Persistence Report Card" and return it to the clinic using the prepaid envelope. Do not restart PRT without consulting your clinician. *You may find that the treatment* <u>appears slightly</u> *less effective for certain modalities initially; this is normal.*
  *   **Q: Will this make me emotionless?**
      *   A: No. Emotional responses involve complex physiological changes, behavioural tendencies, facial expressions, and cognitive appraisals. PRT does not target these functional aspects. It specifically addresses the potential misattribution of intrinsic "feely" qualities to the underlying emotional state representations.

  **Reporting Persistent Phenomenality**
  If you experience persistent sensations suggesting intrinsic qualitative properties (e.g., "what it's like-ness", chromatic qualia, auditory qualia) **more than 2 weeks after completing your course**, please detach and complete the **Phenomenality Persistence Report Card** included in your treatment pack. Post it using the FREEPOST envelope provided. This helps the clinic monitor long-term outcomes. **Do not report via séance.**

  **Manufactured for the Qualia Resolution Institute NHS Partnership Trust.**

  **PL 24601/0123 | Last revised: 09/2024**
