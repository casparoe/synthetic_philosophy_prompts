prompt: |-
  I'm taking a seminar on the ethics of force and I'm trying to work out what I actually think about humanitarian intervention by going case by case instead of from the top down, because the responsibility-to-protect framing we were given seems to settle the easy cases and do no work on the hard ones. My gut verdicts:

  Kosovo, 1999: NATO's bombing campaign to stop the expulsion and killing of Kosovar Albanians was justified, even though the Security Council never authorized it and Russia would have vetoed.

  Iraq, 2003: not justified. No atrocity was under way, and the case for it rested on weapons claims that turned out to be false.

  Libya, 2011: the opening phase — the no-fly zone and strikes authorized to keep Qaddafi's forces out of Benghazi — was justified; the slide into regime change and his killing was not. I genuinely cannot tell whether that makes the whole intervention unjustified or whether one part can be justified and another not.

  A case I invented: a state intervenes, stops an ongoing massacre, and does it partly to secure an oil concession. Justified. Motives look irrelevant to me.

  The same intervention, identical in conduct, casualties and outcome, but carried out by one state acting alone rather than by a coalition: not justified, or at least much weaker. And it isn't hypocrisy that bothers me, because I don't think an intervener's domestic human-rights record disqualifies it.

  One more: a recognized government invites foreign troops to help crush a rebellion, and those troops can foresee that the government will use the restored security to carry out mass killing in the rebel region. Not justified, even though invitation is normally the cleanest title to use force.

  The pair I can't reconcile is the motive case against the coalition case. If what justifies an intervention is what it does — the people it saves — then why should it matter whether it is done by many states or one, when it doesn't matter why it is done? My own tentative principle is that an intervention is justified when it averts an ongoing or imminent mass atrocity, when it is the least rights-violating means likely to succeed, and when the intervener is not the sole judge of its own compliance with the first two conditions. But I can't see how that third clause does the work I want — it looks like it condemns unilateral action for being powerful rather than for being partial, which is not my objection.

  Can you give me a principle, or a short list of candidate principles, that gets these verdicts or nearly all of them? Please state it precisely enough that I can apply it, say what it predicts about a case I haven't listed — arming a rebel group that would probably stop the atrocities and would probably commit some of its own — and tell me honestly which of my verdicts it forces me to give up and why that one is the weakest.
reasoning: |-
  Okay, the user is working through the ethics of humanitarian intervention, examining specific cases to form their own principles instead of relying on top-down frameworks like R2P. They've listed their gut verdicts on Kosovo, Iraq, Libya, and some hypotheticals. The main conflict they're struggling with is why motives don't matter in one case (oil concession) but the coalition vs. unilateral action does. They proposed a principle with three conditions but are unsure about the third one preventing unilateral actions.

  First, I need to unpack their examples. They justified Kosovo despite no UN authorization because it stopped atrocities. Iraq was unjustified due to false premises and no ongoing atrocity. Libya's initial phase was okay, but regime change wasn't. The oil motive case was fine, but unilateral action wasn't, even with the same outcome. Then there's the invited intervention foreseeing mass killings, which they deemed unjustified.

  Their dilemma is reconciling why motives are irrelevant but the number of actors matters. Their tentative principle includes a third condition about not being the sole judge, which they feel might wrongly target power rather than partiality. They need a principle that captures their intuitions without that flaw.

  Looking deeper, the user might value both effectiveness and legitimacy. Unilateral actions might lack checks, leading to mission creep or hidden agendas, even if motives are declared irrelevant. The oil example works because the outcome is good, but a single actor without oversight could deviate from the mission. So legitimacy here could stem from multilateralism as a procedural check, ensuring the intervention stays focused on humanitarian goals.

  The principle I'm considering is based on three elements: atrocity prevention, necessity/proportionality, and legitimacy via multilateralism. Legitimacy isn't about power but about reducing partiality through collective decision-making. This explains why unilateral actions are suspect—they lack external validation, increasing risks of abuse or scope expansion.

  Testing this on their cases: Kosovo gets legitimacy from NATO, a multilateral body, even without UN approval. Iraq fails on all counts. Libya's initial phase had UN backing, but the regime shift lacked multilateral consensus. The oil motive case is acceptable because the outcome aligns with humanitarian goals, regardless of motives. Unilateral action fails the legitimacy condition, as one state can't provide sufficient checks. The invited intervention fails because foreseeing atrocities violates the necessity/proportionality condition.

  For the rebel arming hypothetical, the principle would likely reject it. Arming rebels might stop atrocities but risks new ones and lacks control, failing necessity/proportionality. Also, unilateral arming lacks legitimacy.

  The user might need to adjust their view on unilateral actions if the principle deems them unjustified due to legitimacy concerns. They might see legitimacy as procedural rather than about power, which addresses their partiality worry. They'd have to accept that unilateral interventions, even effective ones, are problematic without multilateral backing, which might be a tough trade-off but strengthens consistency.
answer: |-
  Here's a principle designed to capture your core intuitions while addressing the coalition/motive dilemma:

  **Principle:** Humanitarian intervention is justified *only* when:
  1.  **Atrocity Condition:** It aims to halt or prevent an *ongoing or imminent* mass atrocity crime (genocide, crimes against humanity, war crimes, ethnic cleansing);
  2.  **Necessity/Proportionality Condition:** The force used is *necessary* (no effective non-military alternative exists) and *proportionate* (the harm caused by the intervention is not excessive in relation to the humanitarian good achieved); and
  3.  **Legitimacy/Avoidance of Abuse Condition:** The intervention is authorized by a body possessing *sufficient institutional legitimacy and capacity for constraint* to reasonably ensure the action is (a) *primarily motivated* by the humanitarian objective in (1), and (b) *limited in scope* to achieving the objective in (1), thereby minimizing the risk of abuse, mission creep, or ulterior motives dictating the action.

  **How this principle explains your verdicts:**

  1.  **Kosovo (1999):** *Justified.*
      *   (1) Met: Ongoing ethnic cleansing of Kosovar Albanians.
      *   (2) Met: Bombing seen as necessary last resort; proportionality debated but arguably met given scale of atrocity.
      *   (3) Met: *NATO* acted. While not the UNSC, NATO possesses significant institutional legitimacy (treaty-based alliance of democracies), internal procedures requiring consensus (acting as a constraint), and a declared purpose limited to halting atrocities/providing humanitarian space (preventing mission creep to regime change). Russia's veto threat highlights the *lack of a better option*, but NATO offered a *sufficient* institutional check against unilateral abuse.

  2.  **Iraq (2003):** *Unjustified.*
      *   (1) **Failed:** No ongoing/imminent mass atrocity. The WMD/pre-emption rationale was false and unrelated to R2P.
      *   (2, 3 irrelevant as (1) fails).

  3.  **Libya (2011):**
      *   **Initial Phase (No-Fly Zone/Benghazi):** *Justified.*
          *   (1) Met: Imminent massacre in Benghazi by Qaddafi's forces.
          *   (2) Met: Force seen as necessary/proportionate to stop attack.
          *   (3) Met: *UNSC Resolution 1973* authorized force explicitly for civilian protection (establishing legitimacy and *limiting* mandate).
      *   **Regime Change/Killing:** *Unjustified.*
          *   (1) **Failed:** Halting an imminent atrocity morphed into regime change, a different objective.
          *   (3) **Failed:** Exceeded the UNSC mandate's scope (protection), violating constraint. The intervening coalition (primarily NATO) *expanded* the mission beyond the legitimizing objective.

  4.  **Your Invented Case (Oil Motive):** *Justified.*
      *   (1) Met: Stops an ongoing massacre.
      *   (2) Met: Conduct, casualties, outcome identical to a "pure" intervention.
      *   (3) Met: *Crucially, the intervention is authorized/conducted by a sufficiently legitimate/constraining body (e.g., UNSC, regional body like AU/ECOWAS, NATO-like coalition).* This body's authorization *defines the mission scope* (stop the massacre). The *intervener's private motive* (oil) doesn't automatically negate the *institutional legitimacy and constraint* provided by the authorizing body, *as long as the action stays within the authorized scope.* The institution acts as a check against the motive derailing the mission objective. The *outcome* (lives saved) is achieved within the defined mandate.

  5.  **Your Invented Case (Unilateral Action):** *Unjustified.*
      *   (1) Met: Stops an ongoing massacre.
      *   (2) Met: Conduct, casualties, outcome identical.
      *   (3) **Failed:** The *single state acting alone* lacks the necessary institutional legitimacy and capacity for constraint. It is the *sole judge* of motives (even if declared pure, no external validation) and mission scope (high risk of creep/abuse due to no external checks). This fails condition (3a & 3b) inherently. The power asymmetry and lack of procedural checks create unacceptable risk, even if avoided *in this specific instance*. The principle prioritizes *institutional safeguards against predictable risks* over perfect outcomes achieved without them.

  6.  **Invited Intervention Foreseeing Massacre:** *Unjustified.*
      *   (1) **Failed:** While invited to "crush rebellion," the *foreseeable consequence* of restored government control is a *new/imminent mass atrocity*. Intervention enables this atrocity, violating the core purpose.
      *   (3) **Failed:** Even with invitation (a form of legitimacy), foreseeing the atrocity means the intervention *cannot be primarily motivated* by (nor limited to) preventing atrocities (3a), and actively facilitates them. The "clean title" is negated by the foreseeable harm.

  **Resolving the Motive/Coalition Dilemma:**
  Your intuition that motives shouldn't matter *if the action is right* is captured by focusing on the *institutional authorization defining the mission scope and providing constraint*. The *private motive* of a participant in a coalition doesn't inherently violate (3) because the coalition itself provides the legitimacy and constraint. However, the *unilateral actor* inherently lacks this external legitimizing and constraining structure, making its declared motives untrustworthy and its mission scope prone to dangerous expansion. **Condition (3) isn't about hypocrisy or power, it's about the *procedural safeguards* inherent in multilateral authorization that reduce the inherent risks of abuse and mission creep in such a grave act as war.**

  **Testing the Principle: Arming Rebels**

  *   **Scenario:** Arming a rebel group to stop ongoing atrocities, foreseeing the rebels will likely commit some of their own atrocities.
  *   **Application:**
      *   (1) *Potentially Met:* Aims to stop ongoing atrocity.
      *   (2) *Likely Failed:* Is arming rebels *necessary*? Are there better options (sanctions, diplomacy, protected zones)? Is it *proportionate*? Arming groups known to commit atrocities likely causes excessive harm (fueling conflict, enabling new atrocities) relative to the good. High risk of blowback.
      *   (3) *Likely Failed:* Who authorizes/controls this? A single state arming rebels lacks legitimacy/constraint (3a, 3b). Even a coalition authorizing it struggles – how do they ensure the arms *only* stop the initial atrocity and not enable new ones? Mission scope is inherently uncontrolled.
  *   **Verdict:** Likely **Unjustified.** While (1) might be met, (2) and (3) are highly problematic. This action is high-risk, lacks proportionality, and is prone to abuse and uncontrollable consequences, failing the safeguards built into the principle. It resembles enabling one atrocity to stop another without adequate control.

  **Which Verdict Must You Give Up (and Why it's the Weakest):**

  The principle forces you to give up **considering the unilateral intervention with identical good outcomes as justified.**

  *   **Why:** The principle argues that the *inherent risk* and *lack of procedural safeguards* in unilateral action make it unjustifiable *as a rule*, even if it works perfectly in a hypothetical. Relying on benevolent dictators or perfectly restrained superpowers is too dangerous a precedent. The potential for catastrophic abuse (Iraq 2003 being a prime example of unilateral disaster) outweighs the hypothetical benefit. Legitimacy and constraint are *procedural requirements* to mitigate these inherent risks, not just assessments of power or purity.
  *   **Why it's the Weakest:** Your intuition that the *outcome* (lives saved) is paramount is powerful and morally compelling. This principle prioritizes *systemic safeguards and risk mitigation* over the perfect outcome in a single case. It's a trade-off: accepting that some atrocities *might* go unstopped because no legitimate/constrained actor will act, in order to prevent the far greater harm caused by rampant, abusive unilateral interventions justified under flimsy humanitarian pretenses. This reflects the real-world lessons of failures like Iraq and the slippery slope in Libya. It's the point where procedural justice and risk management constrain pure consequentialism.

  This principle offers a structured way to navigate the hard cases by focusing on the core humanitarian goal, the minimal harm principle, and crucially, the *institutional mechanisms* needed to prevent the noble concept of R2P from becoming a cover for aggression or chaos. It moves beyond "who" or "why" in isolation to "how is this action authorized, constrained, and limited to its humanitarian purpose?"
