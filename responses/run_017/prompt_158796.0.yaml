prompt: |-
  I write about science and ideas for a broadsheet, and I have been given roughly three months of reporting time and about 4,000 words for a single feature. The question I want the piece to be about is what we are actually doing when we claim to know something about the distant past, and how much of that knowledge is likely to survive the next fifty years.

  Two framings I have taken from recent interviews have been competing for the centre of the piece, and I would like you to adjudicate and then go further.

  The first, from a historian: that the basic unit of historical knowledge should not be the source but the transmission event. On this view, any claim about the deep past is graded by reconstructing the chain behind it — an observation, a report, a copy, a selection, a translation, an excavation record, a restoration — and then grading the claim by its weakest link rather than by the number of apparently independent sources that repeat it, on the grounds that apparent independence usually conceals a shared ancestor. He wants this taught to first-year undergraduates as the successor discipline to source criticism, and he thinks the older habit of asking who wrote a text, when, for whom and with what bias is a special case of it.

  The second, from an archaeologist: that the growth is all in non-testimonial evidence — radiocarbon, ancient DNA, isotopes, tree rings, remote sensing — where there is no reporter to interrogate and where the traditional tools have nothing to grip; on her account, I am paraphrasing, the history of periods without written sources becomes the model, and text-based history is reduced to a literature of illustration built around a skeleton of measurement.

  A third thing I keep running into, which neither of them quite addresses: damaged texts are increasingly completed by models trained on the surviving corpus, and a machine-proposed restoration can end up in the published record looking like a reading of the physical evidence. The worry is not primarily forgery. It is that the reconstruction is informed by the very body of material it is subsequently taken to corroborate, so that a chain can acquire a link that is at once highly probable and evidentially empty.

  What I want is not a survey. Given my constraints — 4,000 words, three months, readers who are educated but not specialists — which two or three open questions should the piece be built around, in what order, and why? Please make the criteria explicit: how much of the rest of the terrain hangs on each question; whether it can be made intelligible and genuinely interesting to a general reader in the space I have; whether it is live rather than settled in disguise; and whether an answer would change a practice outside the seminar room, since courts, legislatures and museums do act on claims about the deep past. Name at least one question in this area that sounds important and that you would cut, and say why it is overrated. Then tell me what evidence or event over the next two or three years would move things up or down your list.

  Please close with a short note on your own confidence: how confident you are in each of your main claims, and which single point you are least sure of. I would rather that was flagged plainly than smoothed into prose that reads as confidence. I do not want a reading list or citations; if you mention a particular author, work or finding, be sure of it from memory or leave it out. Please write in British English.
reasoning: |-
  Okay, the user is a science and ideas writer for a broadsheet, working on a 4,000-word feature about how we claim to know the distant past and whether that knowledge will survive the next fifty years. They've presented two competing framings from experts and a third concern about AI reconstruction of texts. They want help structuring the piece around key open questions rather than a survey.

  Hmm, this is a deep epistemological challenge wrapped in practical journalism constraints. The historian's "transmission event" approach fundamentally shifts how we assess historical claims - it's not just about sources but about the chain of copying and translation. Meanwhile, the archaeologist pushes toward hard science methods where traditional textual analysis doesn't apply. And then there's this fascinating wrinkle about AI reconstructions creating circular evidence loops.

  The user's real need seems to be cutting through academic debates to find questions that matter to educated non-specialists. They want impact - will this change courts, museums, legislation? And they want to avoid wasting words on overrated questions. 

  Right, first I need to identify which questions meet their criteria: intelligible to general readers, genuinely unsettled, with real-world consequences. The transmission vs hard evidence tension is clearly central. The AI reconstruction problem is urgent but might need framing as part of a larger question. 

  That "weakest link" idea from the historian feels revolutionary - it could change how we teach history undergraduates tomorrow. Whereas the archaeologist's point forces us to ask what happens when science replaces storytelling. Both have museum implications: display labels might need reliability scores! 

  The question I'd cut? "Can we ever truly know the past?" - too philosophical, too settled as "only partially", and changes no practices. Better to focus on how our methods are changing what we can claim to know. 

  For future movers: watch how courts handle ancient DNA evidence in repatriation cases, or if major museums start tagging AI-reconstructed artifacts. A big scandal involving machine-"restored" texts could make this urgent overnight. 

  My least confident point? Whether transmission theory can really be taught to first-years - academics love theoretical frameworks that collapse in classroom practice. Should flag that. 

  This structure gives them: one framing question about method (transmission vs science), one about new threats (AI reconstruction), and one about future-proofing - all funneling toward real-world impact. The museum angle makes it tangible. 

  Time to articulate this cleanly with British spelling. Must remember: no citations, no false confidence, and explicitly state where I'm least sure.
answer: |-
  Here’s a structural proposal for your feature, built around three open questions that meet your criteria of centrality, intelligibility, liveliness, and real-world impact. I’ve excluded one overrated question and flagged key near-term developments.

  ### Core Criteria Applied:
  1.  **Hangs on the terrain:** Does it underpin debates across history, archaeology, and science?
  2.  **Intelligible/Interesting:** Can it be made vivid with concrete examples for general readers?
  3.  **Live & Unsettled:** Is it actively debated, not a settled matter disguised as open?
  4.  **External Impact:** Could answers change practices in courts, museums, policy, or education?

  ---

  ### The Three Open Questions (in recommended order):

  1.  **Is the "Chain of Transmission" the True Weakest Link in Knowing the Past?**
      *   **Why this?** Directly engages the historian’s thesis. It reframes the *entire* basis of historical knowledge – moving from "source" to "process". This challenges how evidence is weighted (e.g., multiple chronicles vs. one well-preserved inscription), impacting textbooks, museum provenance, and even legal historical claims.
      *   **Intelligibility:** Use vivid examples: How does a modern translation of a medieval copy of a lost Roman text differ from interpreting an original pottery shard? Contrast the "chain" for Tacitus vs. pollen data from a peat bog. Show how "independent sources" often share an ancestor (e.g., biblical scholarship).
      *   **Liveliness:** Historians fiercely debate this. Proponents see it as essential rigour; critics see it as paralysing scepticism that undervalues contextual analysis. Can it *really* be applied universally?
      *   **External Impact:** Would revolutionise historical methodology teaching (as proposed), force museums to explicitly grade reliability chains on displays, and challenge legal reliance on textual traditions (e.g., land rights, cultural heritage). Courts *do* grapple with historical evidence.

  2.  **Will Science Replace Story? How Non-Testimonial Evidence Reshapes Our Past.**
      *   **Why this?** Takes the archaeologist’s framing head-on. It explores the epistemological shift: when DNA, isotopes, or lidar data become the *primary* narrative drivers, not illustrations for texts. This fundamentally alters timelines, causation (e.g., plague, migration), and even identities.
      *   **Intelligibility:** Contrast traditional "kings and battles" history with stories built from cattle teeth isotopes (diet/migration), pathogen DNA from graves, or lidar revealing lost cities beneath jungles. Show how this changes understanding of periods *with* texts too (e.g., challenging written accounts of conquests).
      *   **Liveliness:** Active tension! Does this reduce history to environmental determinism? Can "scientific facts" truly narrate human experience without texts? Is text-based history becoming niche? Archaeologists vs. traditional historians.
      *   **External Impact:** Drives multi-million-pound research funding (ancient DNA labs, big data archaeology). Changes museum narratives (objects become data points). Influences policy on heritage management, repatriation (DNA evidence), and even climate change narratives (deep-time environmental data).

  3.  **Are We Building a House of Cards? How AI Reconstruction Threatens the Integrity of Evidence.**
      *   **Why this?** Addresses your crucial third point. It exposes a hidden vulnerability emerging *now*. This isn't forgery; it's systemic, well-intentioned circularity corrupting the evidence base. Impacts *both* textual and material analysis (e.g., AI 'restoring' fragmented paintings or pottery).
      *   **Intelligibility:** Explain simply: AI fills gaps by learning from existing examples. Show a damaged papyrus – human guesswork vs. AI suggestion. Stress how the AI's "probable" fill becomes cited evidence, reinforcing the *existing* corpus it learned from, potentially entrenching errors or biases.
      *   **Liveliness:** Cutting-edge and alarming. Scholars are only starting to grapple with protocols. How do we flag AI interventions? Can we avoid "training set contamination"? Is human judgment still paramount?
      *   **External Impact:** Critical for scholarly publishing, museum cataloguing, and digital archives. A major scandal involving AI-reconstructed evidence being presented as physical fact could erupt, damaging trust. Courts relying on historical documents must know if AI "restoration" was involved.

  ### Why This Order?
  1.  **Transmission Chain:** Establishes the *foundational critique* of how we currently handle traditional evidence. It sets the stage.
  2.  **Science vs. Story:** Introduces the *ascendant force* reshaping the field, showing the tension with #1.
  3.  **AI Reconstruction:** Presents a *new, critical vulnerability* affecting both #1 and #2, looking urgently to the future. It's the looming threat to the survival of knowledge.

  ---

  ### The Overrated Question to Cut
  *   **"Can We Ever *Truly* Know the Past?"**
  *   **Why Cut It?**
      *   **Settled in Disguise:** Philosophers have debated this endlessly. The practical answer for working historians/scientists is always a qualified "We can know *some* things, with *varying degrees of confidence*, but never perfectly." Rehashing this abstractly adds little.
      *   **Low External Impact:** It doesn't change *how* courts weigh specific evidence, how museums present findings, or how research grants are allocated. It’s a meta-question detached from practice.
      *   **Space Drain:** Exploring it deeply consumes precious word count without yielding actionable insights for your readers on the *current* crisis of method and survival.

  ---

  ### Future Evidence/Events That Could Reshape the Landscape (2-3 years)
  1.  **Major AI Reconstruction Scandal:** Revelation that a widely accepted "discovery" (e.g., a restored classical text passage, an interpreted inscription) was primarily AI-generated and subsequently corroborated circularly. Would catapult Question 3 (#AI threat) to the top.
  2.  **Landmark Legal Case:** A court ruling (e.g., on indigenous land rights, artefact repatriation, historical liability) that explicitly prioritises non-testimonial evidence (e.g., DNA, isotope studies) over traditional textual narratives, or rigorously applies "transmission chain" analysis to dismiss textual claims. Would validate the urgency of Question 1 (#Transmission) or Question 2 (#Science).
  3.  **Breakthrough in "Deep Past" Science:** A technique dramatically extending or refining non-testimonial evidence (e.g., reliable protein-based dating beyond radiocarbon limits, extracting complex behavioural data from ancient DNA). Would significantly boost the centrality of Question 2 (#Science).
  4.  **Widespread Adoption of Transmission Protocols:** If major universities/museums officially adopt "chain grading" standards for historical claims. Would validate Question 1 (#Transmission) as a practical revolution.

  ---

  ### Confidence Assessment
  1.  **Centrality of the Three Questions:** **High Confidence.** These capture the core methodological shifts (Transmission, Science) and emerging threats (AI) defining the field's current crisis regarding knowledge of the deep past and its future.
  2.  **Intelligibility for General Readers:** **High Confidence.** The concepts (chain links, scientific data vs. stories, AI filling gaps) are fundamentally graspable with clear analogies and examples. Your skill as a writer is key here.
  3.  **Liveliness of the Debates:** **High Confidence.** Based on the framings you provided and wider trends, these are active, contentious fronts among practitioners, not settled academic backwaters.
  4.  **Real-World Impact Potential:** **Medium-High Confidence.** Impacts on museums (display, provenance), education (teaching methods), and law (evidence weighting) are demonstrable and growing. The *scale* of future impact depends on adoption/scandals.
  5.  **Weakest Point: Historian's Teachability Claim.** **Low Confidence.** While the "transmission event" theory is powerful, whether it can *effectively replace* source criticism as the *core* undergraduate discipline in 3 months is highly debatable. Does it truly encompass nuance like authorial intent and bias effectively? Critics might argue it's a complementary tool, not a full successor. Flag this tension explicitly.

  ---

  This structure provides a rigorous framework exploring *how* we know the past (Q1), *what new ways* are changing that (Q2), and *what new risks* threaten the survival of reliable knowledge (Q3), all while meeting your practical constraints and focus on future-proofing and real-world consequences. Good luck!
