answer: |-
  Here are ten interview questions designed to press on your guest's core thesis while anticipating her deflections. Each question is in spoken register (concise, conversational), limited to two sentences, with a one-sentence follow-up keyed to her likely response. The sequence covers all nine specified topics, uses one slot for an additional probing question (topic 6, unfolding argument), and closes with the deflection-proof challenge.

  1. **Topic 1 (Axioms to postulates):**  
     "Your book argues IIT's axioms reflect universal features of experience, but could a conscious subject with radically different perception—say, no time or space—violate those axioms?"  
     *Follow-up (if she says axioms are universal):* "If we discovered such a subject, would IIT reject its consciousness or revise the axioms?"  

  2. **Topic 2 (Exclusion postulate):**  
     "When two overlapping brain networks have nearly identical Φ, a tiny change—like adding a sensor—could flip which one is maximal. Can consciousness really switch so easily?"  
     *Follow-up (if she says Φ differences are rarely negligible):* "But if we engineered a system where Φ values *were* that close, would IIT predict volatile consciousness?"  

  3. **Topic 3 (Intractability and proxies):**  
     "Since computing true Φ is impossible for brains, what can a proxy like PCI really tell us? And what critical limitations make it unreliable for IIT?"  
     *Follow-up (if she says proxies correlate weakly with Φ):* "If PCI consistently misidentifies conscious systems relative to IIT's predictions, is that a flaw in the proxy or the theory?"  

  4. **Topic 4 (Cerebellum as retrofit):**  
     "IIT dismisses the cerebellum as unconscious despite its complexity, but wasn’t this exclusion retrofitted to match intuition, not predicted in advance?"  
     *Follow-up (if she says it follows from causal structure):* "If future work shows the cerebellum has high Φ under a novel grain, would IIT accept it as conscious or reject the grain?"  

  5. **Topic 5 (Artifacts):**  
     "Critics show grids of simple nodes can have high Φ—do you accept these are conscious? And what could such a system’s experience even feel like?"  
     *Follow-up (if she revises intuitions):* "Without behavioral or functional markers, how can we test claims about its experience beyond just asserting it?"  

  6. **Topic 6 (Unfolding argument):**  
     "A system can be 'unfolded' into multiple causal structures with identical functions but different Φ. Doesn’t this mean consciousness dissociates from function entirely?"  
     *Follow-up (if she emphasizes causal structure):* "Could two identical brains then differ in consciousness if one is unfolded differently?"  

  7. **Topic 7 (Causal-emergence reconciliation):**  
     "You equate IIT's Φ-maximization with causal emergence, but isn’t IIT’s 'intrinsic' constraint unique? And doesn’t allowing macro-descriptions invite global workspace theories back in?"  
     *Follow-up (if she says IIT constrains grainings):* "If a global workspace model maximizes causal power at its grain, does IIT endorse it as conscious?"  

  8. **Topic 8 (Quality claim):**  
     "IIT aims to derive specific experiences from causal structures, but how can we verify the 'shape' matches qualia if first-person reports are untrustworthy?"  
     *Follow-up (if she cites internal consistency):* "Without subjective validation, isn’t this just a mathematical fiction?"  

  9. **Topic 9 (Graded consciousness):**  
     "If Φ scales continuously, is there a non-arbitrary threshold for consciousness? And what does that imply for treating low-Φ systems like insects or organoids?"  
     *Follow-up (if she denies sharp boundaries):* "Doesn’t that force us to grant *some* moral status to almost any causal system?"  

  10. **Closing (Deflection-proof falsifiability):**  
      "What single outcome—say, a system with maximal Φ but verified no experience—could disprove IIT, without appealing to measurement error or revised intuitions?"  
      *Follow-up:* "If such a case arose, would you abandon the theory or reinterpret 'experience'?"
