  ### **Key Discussion Points**  
  1. **Tax framing cracks under non-marginal change**: Compensating humans isn’t possible if AI destabilizes civilization.  
  2. **Reversibility ≠ low impact**: Moving a chair back is easy, but moving a nuclear waste container isn’t—yet both might be harmless.  
  3. **Hybrid approach**: Use penalties for tractable harms (e.g., energy use) + hard constraints for existential risks.  
  4. **Econ insight**: Pricing *known* externalities (e.g., CO₂) is viable; for unknown AI impacts, default to caution (e.g., reversible actions).  

