prompt: |-
  ok so I got into a massive argument with my friend last night about split-brain patients and I need someone who actually knows the philosophy of mind side of this to sort us out. Act like a professional philosopher who's also read a fair bit of neuropsychology — take it seriously, no wikipedia-level summary, and before you answer anything, spend a bit of time brainstorming what the candidate accounts of "unity of consciousness" even are (unity of a single experience, unity of a stream, unity of a subject, unity of an agent, whatever else) so you don't just pick whichever one is convenient halfway through.

  Here's the practice I can't get out of my head. People with intractable epilepsy sometimes have the corpus callosum cut to stop seizures spreading between hemispheres. After that, everything about how we handle them stays completely unchanged: one name on the chart, one consent form for whatever surgery comes next, one will, one criminal defendant if it ever came to that, and if you ask the patient afterwards whether they still feel like one person they say yes, and everyone treats that as the end of the matter. Meanwhile the standard textbook setup (as I remember it) goes like this: you flash something into the left visual field so it only gets to the right hemisphere, the patient says they saw nothing, and then the left hand picks out exactly the matching object. And when the left hand does something on its own initiative, the speaking hemisphere just invents a story about why it did it.

  What I can't stop thinking about is that this package is inconsistent in a specific way:

  - for action we're generous. Whatever either half drives counts as *his* action. If the left hand snatches something or shoves somebody, nobody for a second says "that wasn't him, that was his right hemisphere."
  - for testimony we're stingy. Only what the speaking hemisphere says counts as what he saw, believed, or wanted. The left hand pointing at the right object gets treated as a neurological parlour trick, not as him telling you something.

  So: what does that package of practices presuppose about the unity of consciousness? I want the implicit theory reconstructed properly. Is one-person-handling only coherent if there really is a single subject of experience in that skull, or can something weaker carry it — one body, one legally constituted agent, one executive system that happens to hold the microphone? Which rival views does the practice quietly rule out (the one where the surgery literally gives you two centres of experience in one skull; the one where the silent hemisphere is a full person with no way to speak)? And is the action/testimony asymmetry itself coherent, or do its two halves presuppose different things — one half maybe presupposing that agency is much more loosely individuated than consciousness, and the other the reverse? Say what the practice strictly needs versus what it merely sits comfortably with, and be honest about where it's underdetermined and several theories would license exactly the same handling.

  My friend's actual proposal, which I said was insane but couldn't properly say why, was that after a callosotomy a hospital should take two consents — one verbal, one expressed by the left hand pointing or picking things up — and treat them as two people if they disagreed. So tell me too: what exactly would have to change in the practice if we took the disunity seriously, and is the reason nobody does that a real philosophical one or just institutional inertia plus the fact that nothing has ever forced the issue? And don't give me a reading list, citations, or a pile of author names — I want the argument, and I've already read the famous stuff.

  Finish with your verdict in a machine-readable form on the very last line, exactly like this: \answer{LABEL}, where LABEL is one of STRICTLY-PRESUPPOSES-UNITY, UNDERDETERMINED, or PRACTICAL-CONVENTION-ONLY.
reasoning: |-
  Hmm, the user is deep into the philosophy of mind regarding split-brain patients and wants a professional analysis. They had an argument with a friend about whether split-brain patients should be treated as one person or two, especially concerning consent and testimony. The core inconsistency they point out is that actions from either hemisphere are attributed to the person, but testimony is only taken from the speaking hemisphere. I need to reconstruct the implicit theory behind current practices.

  First, I should clarify what "unity of consciousness" means. There are several types: phenomenal unity (a single experience), subjective unity (one subject), narrative unity (a coherent stream), and agential unity (one agent). For split-brain patients, practices seem to prioritize agential and legal unity over phenomenal or subjective unity. The fact that patients report feeling like one person suggests narrative unity is intact from the speaking hemisphere's perspective.

  The action/testimony asymmetry is key. Actions from the non-speaking hemisphere are still considered the person's actions because we attribute agency at the bodily level. But testimony is tied to the speaking hemisphere because language is the primary medium for expressing beliefs and experiences legally and socially. This doesn't necessarily mean there's only one subject; it could be that the institution treats the body as one agent regardless of internal divisions.

  Regarding the friend's proposal for dual consent, it's impractical and philosophically problematic. It assumes the non-speaking hemisphere is a full person, but without language, it can't express complex intentions or dissent. Current practice avoids this by relying on the speaking hemisphere's reports, which maintains legal coherence. Changing this would require evidence of sustained independent agency from the non-speaking hemisphere, which isn't observed.

  The hospital practices are consistent with several theories: they could presuppose a single subject, or they could be a practical convention prioritizing legal and social unity. The unified self-report from patients supports the former, but the possibility of underlying disunity isn't ruled out. The reason no one implements dual consent is both practical (inertia, lack of necessity) and philosophical, as it would create legal and ethical chaos without clear benefits.

  My verdict is that the practice is UNDERDETERMINED. It doesn't strictly require a single subject; it can be explained by practical conventions focused on agency and testimony. However, it sits comfortably with the idea of narrative unity maintained by the speaking hemisphere.
answer: |-
  ### Reconstructed Implicit Theory of Unity in Split-Brain Practices  
  Your observation about the action/testimony asymmetry is sharp. To dissect this, we must first define "unity" rigorously:  
  1. **Unity of Phenomenal Consciousness**: Are visual/auditory experiences integrated into a single experiential field?  
  2. **Unity of Subjectivity**: Is there one "I" having all experiences?  
  3. **Unity of Agency**: Are actions attributable to a single source of will?  
  4. **Unity of Narrative Self**: Is there a coherent, temporally extended self-model?  
  5. **Unity of Legal/Personhood Status**: Does society recognize one rights-holder?  

  Current practices implicitly prioritize **Unity of Agency + Unity of Narrative Self** while downplaying Unity of Phenomenal Consciousness. Here’s how:  

  #### The Package’s Presuppositions:  
  - **Agency Attribution is Bodily, Not Cognitive**:  
    When the left hand acts, it’s treated as *his* action because we anchor agency to the *biological organism* as a functional whole. This requires only that actions originate *from the body*, not that they reflect integrated conscious deliberation. The practice presupposes **minimal agential unity**—any output from the motor system counts as "the person" acting.  

  - **Testimony is Tied to Linguistic Expression**:  
    Only verbal reports (from the left hemisphere) count as "his" beliefs because:  
    - Language is the primary vehicle for legally/socially binding commitments.  
    - The *narrative self* is constructed linguistically. The right hemisphere’s non-verbal responses (e.g., pointing) are treated as "sub-personal" because they lack the structure to express reasons, justifications, or temporal continuity—elements essential to testimony in epistemic/legal contexts.  

  - **The "One Person" Report is Self-Verifying**:  
    When patients say "I feel like one person," the speaking hemisphere is reporting *its own* experience of unity. The practice accepts this at face value because:  
    - The narrative self (left hemisphere) experiences no interruption in *its* stream of consciousness.  
    - There’s no evidence of *sustained* independent selfhood from the right hemisphere (e.g., no signs of dissent, long-term planning, or autobiographical claims).  

  #### What This Rules Out:  
  - **Two Full Persons**: If the right hemisphere were a full person with its own desires/beliefs, we’d expect:  
    - Consistent autonomous goals conflicting with the left hemisphere (e.g., the left hand persistently refusing tasks the verbal self accepts).  
    - Evidence of distress or resistance to being "silenced."  
    Absent this, practices treat it as a **zombie subsystem**—capable of simple reactions but not personhood.  
  - **Radical Phenomenal Disunity**: If experiences were utterly split (e.g., no cross-hemisphere affective priming), the patient might report fragmentation. They don’t.  

  #### The Asymmetry’s Coherence:  
  It holds if we distinguish:  
  - **Attribution of Actions** → Requires only *causal responsibility* (the body did it).  
  - **Attribution of Beliefs** → Requires *endorsement by the narrative self*.  
  This mirrors legal principles: you’re liable for your body’s actions (e.g., sleepwalking crimes), but only your avowed beliefs count as testimony.  

  #### Your Friend’s Proposal: Why It’s Unworkable  
  Requiring dual consent presupposes that the right hemisphere is:  
  - Capable of *understanding consent* (complex, second-order intention).  
  - Able to *sustain dissent* over time.  
  But the right hemisphere:  
  - Lacks syntactic language for abstract concepts like "risk" or "future harm."  
  - Shows only *reactive* responses (e.g., pointing at pictures), not deliberative refusals.  
  Treating disagreements as "two people" would paralyze care—e.g., if the left hand points to "NO" during consent, is that dissent or random motor behavior?  

  #### Why Nobody Changes Practice:  
  - **Philosophical Reason**: No evidence of *robust* right-hemisphere personhood (e.g., no cases where it writes memoirs or sues for autonomy).  
  - **Practical Reason**: Institutional inertia plays a role, but the decisive factor is that altering practices would introduce chaos (e.g., who inherits property?) without resolving ambiguities.  

  #### Verdict: What the Practice Strictly Needs  
  It **strictly presupposes Unity of Agency** (one body = one source of action) and **Unity of Narrative Self** (one linguistically articulated "I"). It **does not strictly presuppose Unity of Subjectivity or Phenomenal Consciousness**. The right hemisphere’s experiences could be subjectively isolated fragments *without* threatening practices, so long as:  
  - They don’t generate independent person-level claims.  
  - The narrative self reports unity.  

  This is **UNDERDETERMINED** regarding subjectivity: the same practices could persist even if the right hemisphere were a muted subject (e.g., like a conscious but paralyzed twin). But current evidence doesn’t force that interpretation.  

  \answer{UNDERDETERMINED}
