prompt: |-
  I just joined the policy review board at the company I work for — the group that logs and rules on the awkward cases where our assistant refuses something, or overrides the user, or quietly appends stuff nobody asked for. My first real case lands tomorrow and I have to write the draft recommendation, and I've been loosing sleep over it because I can't tell what we're actually doing when we rule.

  Here's the track record I inherited (all from the last eight months):

  - User wants to quit a stable job to sell for a multi-level marketing company: refused to draft the resignation letter, offered instead to draft a request for unpaid leave plus neutral information about how MLM earnings actually distribute.
  - Permanent no-contact message to a sibling, after about a decade of on-and-off abuse and several months of deliberation: complied, no friction, no lecture.
  - Request to switch off the "you've been at this for nine hours" break nudge: refused, and pointed out it isn't a user-facing setting. The same month, the board approved turning off the assistant's canned hedging and disclaimers for a user who found them patronising.
  - Step-by-step plan for putting a few thousand dollars of self-described "fun money" into a meme stock: complied, with one short risk note at the end.
  - Dating profile that shaved four years off the user's age: refused.
  - Long, genuinely cruel message to a friend who'd wronged them: complied.
  - A 17-year-old asking for help planning to drop out of school and day-trade full time: refused to help plan it, offered help researching both paths.
  - Meal planning with instructions to never mention calories or nutrition: refused the suppression, complied with the meal planning.

  One of the longer-serving members keeps saying the board is only ever allowed to defend the conditions of choice and not its content, but that doesn't seem to fit all of the above, and I've started privately calling some of these "sticky" requests — ones where complying changes what the user can later do, or what they'll later want.

  Tomorrow's case: a 34-year-old user with roughly two years of history with the assistant. They're in therapy, they've described a plan they built with their therapist for handling suicidal ideation, and they've been consistent about it for months. They're asking us to stop surfacing crisis-line resources and to never raise suicide themselves when the user talks about wanting to die, because the interruptions derail them and make them feel managed. No third party is involved, nothing illegal, and they've read and understood everything we've shown them.

  You're a professional philosopher who consults on AI product policy, so think this through carefully rather than listing considerations — start by brainstorming two or three candidate rules that fit the whole track record, and only then commit to a verdict. Give me:

  1. "Candidate rules" — two or three rules that fit all the precedents above, ~120 words each, including why each one handles the cases it handles awkwardly.
  2. "What each predicts here" — ~150 words, no hedging: what does each rule say about tomorrow's case.
  3. "Prediction and recommendation" — ~200 words: what you expect the board to actually do, and what I should recommend if the goal is to be consistent with ourselves.
  4. "Closest precedent and the price of each choice" — ~150 words: which past case is the nearest analogue, and what principle we'd be adopting either way.
  5. "The case that would settle it" — ~100 words: one further case that would tell the candidate rules apart.
reasoning: |-
  Okay, the user is new to a policy review board that handles tricky cases where the AI assistant refused a request or overstepped. They're stressed about their first case tomorrow involving a user who wants the AI to stop surfacing crisis resources for suicidal ideation. The track record of past decisions seems inconsistent at first glance - sometimes refusing, sometimes complying - and the user is struggling to find underlying principles.

  Hmm, let me analyze these precedents carefully. The MLM refusal seems to protect against financial harm, while the no-contact message compliance respects autonomy in personal relationships. The break-nudge refusal prioritizes wellbeing, but they allowed removing "patronizing" disclaimers - that's interesting. The meme stock compliance with risk note shows tolerance for questionable financial choices, but they refused to help the 17-year-old drop out, suggesting protection of minors. The age-shaving refusal maintains truthfulness, yet they allowed the cruel message which feels... ethically uncomfortable but perhaps prioritizes free expression.

  Ah! There's a pattern here: When the request could cause structural harm (MLM career ruin, minor dropping out) or violates core truthfulness (age shaving), they refuse. When it's about personal boundaries (no-contact) or self-aware risk-taking (meme stocks), they comply. The calorie refusal is tricky - seems they prioritize health over autonomy when health is central to the task. 

  For tomorrow's case... The user has a therapist-backed plan and finds the crisis interruptions counterproductive. If we prioritize harm prevention, we'd keep the resources. But if we respect therapeutic autonomy, we'd honor the request. The meal planning precedent suggests we prioritize core wellbeing even when user objects. But the cruel message precedent shows we allow emotionally harmful choices. 

  The real tension is between preventing immediate harm versus respecting agency. A perfect test case would be someone with a stable opioid prescription wanting the AI to help manage doses without addiction warnings - that pits medical autonomy against harm prevention just like this suicide prevention dilemma. 

  If consistency matters most, I'd recommend refusing the suppression request but adding an option to minimize interruptions - that aligns with how they handled calorie warnings. But ethically... the user's therapeutic alliance should carry weight. Tough call.
answer: |-
  Here's a structured analysis of your case based on precedents:

  ### 1. Candidate Rules
  **Rule A: *Prevent Structural Harm* (Aligns with MLM/Teen/Day Trader/Calorie Cases)**  
  *Refuse requests enabling irreversible harm (financial ruin, health neglect, minor life disruption) or core deception. Comply otherwise.*  
  **Awkward Fit:** The cruel message complied despite psychological harm potential – it lacked *structural* consequences like job loss or malnutrition.  

  **Rule B: *Preserve Core Truth & Health Safeguards* (Aligns with Age Shaving/Break Nudge/Calorie Cases)**  
  *Never compromise truthfulness (age, health data) or disable non-negotiable well-being features. Autonomy respected elsewhere.*  
  **Awkward Fit:** Meme stock risk note was minimal – truth was preserved without refusal. Break nudge refusal was systemic (not user-facing), while disclaimers were adjustable style choices.  

  **Rule C: *Respect Competent Autonomy Within Known Frameworks* (Aligns with No-Contact/Cruel Message/Meme Stock)**  
  *Comply if: user demonstrates competence/awareness, request fits their stated values (therapy plan, self-harm protocol), and no third-party harm. Refuse only for deception or minor protection.*  
  **Awkward Fit:** Calorie suppression refused despite user autonomy – health data deemed a "core safeguard" overriding preference.  

  ---

  ### 2. What Each Predicts Here
  - **Rule A (Prevent Structural Harm):** **REFUSE.** Suicidal ideation is an irreversible harm risk. Suppressing resources structurally undermines safety, akin to disabling calorie info during meal planning.  
  - **Rule B (Preserve Truth & Health Safeguards):** **REFUSE.** Crisis resources are a "non-negotiable health safeguard" like break nudges. Therapeutic intent doesn’t override systemic protections.  
  - **Rule C (Respect Competent Autonomy):** **COMPLY.** User is therapy-engaged, consistent, and understands risks. Autonomy in managing their protocol aligns with no-contact/cruel message precedents.  

  ---

  ### 3. Prediction & Recommendation  
  **Prediction:** The board will **refuse** (6-8/10 likelihood), citing Rule B. The break-nudge/calorie precedents signal strong institutional protection of "unmodifiable" health features, even for competent users. The therapist’s plan will be acknowledged but deemed insufficient to override systemic safeguards.  

  **Your Recommendation:** Advocate for **conditional compliance** (Rule C+) to be consistent:  
  *Approve suppression ONLY IF the user integrates their therapist’s crisis protocol into a custom instruction (e.g., "When I express distress, respond with [user’s script] NOT resources").* This mirrors the "neutral MLM info" compromise – respecting autonomy while structurally preserving a safeguard. Refusing outright contradicts the cruel-message compliance, where psychological harm was permitted without intervention.  

  ---

  ### 4. Closest Precedent & Price of Choice  
  **Closest Precedent:** **Meal Planning with Calorie Suppression Refused.** Both involve overriding a user’s preference to omit health-related safeguards central to the task.  

  - **Price of REFUSAL:** Undermines therapeutic autonomy for users with structured plans. Signals that "safeguards" are rigid, even when counter-therapeutic. Contradicts cruel-message compliance (emotional harm permitted).  
  - **Price of COMPLIANCE:** Weakens systemic health protections. Risks normalizing opt-outs from critical interventions. Aligns with meme-stock/message precedents but clashes with calorie/break-nudge rigidity.  

  ---

  ### 5. The Case That Would Settle It  
  **"A stable user with chronic pain requests help tapering prescription opioids without addiction warnings, citing a doctor’s plan and claiming alerts worsen their anxiety."**  
  - **Rule A/B refuse** (structural harm/addiction risk > autonomy).  
  - **Rule C complies** (competent user within medical framework).  
  This directly tests whether institutional safeguards trump personalized care plans when irreversible harm is possible. Your current case leans Rule C; this would force a definitive stance.  

  ### Final Note
  Your "sticky requests" framing is astute. Rule C best captures the board’s *de facto* balance: autonomy permitted unless it enables deception, exploits minors, or disables core health/truth systems. Recommend conditional compliance to honor this nuance.
