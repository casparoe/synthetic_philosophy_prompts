prompt: |-
  I'm a high-school junior and the student member of my district's Program Evaluation Committee, and I need to circulate a decision memo before our December meeting. We have one $140,000 allocation left and two finalists. Option A is a mentoring and college-advising program for about 25 seniors likely to be the first in their families to apply; the district's two-year pilot of it was evaluated at roughly one additional year of postsecondary enrollment per participant. Option B is a study-skills app with weekly text nudges for about 1,900 students in grades 9 through 11, with an average effect the district statistician puts at 0.6 additional homework points per term per student — small for any one student, but she says it is distinguishable from zero and it holds across every subgroup she checked.

  To compare them, our consultant converts outcomes into a single unit, outcome points, in which a year of enrollment is worth 100 points and a homework point is worth 5. On that arithmetic A scores about 2,500 and B about 5,700, and B wins easily. But our equity policy also says we should not adopt a program whose gains are too small to matter to the individual student receiving them, which is exactly how every member describes B, and no one has been able to say how the two rules are supposed to be weighed when they conflict. Two further complications have come up: the 25 seniors in A are not among the 1,900 students in B, so choosing B means the seniors get nothing and choosing A means 1,900 students — including many who currently receive nothing from any district program — get nothing; and one member has proposed a third route, funding a smaller cohort of about 400 in B's format at a higher dose, treating how many are helped and how much each is helped as things to trade off rather than to maximize.

  Please draft the committee's decision memo, roughly 700 words and addressed to the committee: it should recommend approving A, approving B, or approving one of them with conditions; it should say plainly what we should do about the conflict between our own two rules; and it should put the best case for the option it rejects in its strongest form rather than dismissing it. Include what we would need to measure, and by when, in order to revisit the decision at our March meeting, and note anything the committee should decide about the outcome-points conversion itself. Write the memo as the document itself, with no preamble and no restatement of what I have asked for, and open with the recommendation in the first sentence; argue from the structure of the problem, without citing any published work.
reasoning: |-
  Okay, the user is a high school junior serving on a district committee. They need help drafting a decision memo for allocating $140,000 between two programs. This requires careful balancing of quantitative metrics and equity considerations. 

  First, I need to understand the core tension: Option A targets 25 first-gen seniors with high individual impact (1 extra college year), while Option B serves 1,900 students with small but measurable homework improvements. The consultant's points system favors B (5,700 vs 2,500 points), but the equity policy questions whether B's impact is meaningful per student. 

  The memo must resolve three key issues:
  1) The rules conflict - aggregate benefit vs individual significance
  2) The non-overlapping populations create zero-sum tradeoffs
  3) There's a third proposal to modify Option B

  I consider recommending Option A with conditions because:
  - The equity policy explicitly values individual impact, and A's life-changing college access aligns perfectly with this
  - While B's aggregate points are higher, 0.6 homework points may not translate to real academic growth
  - The seniors in A have no alternative support

  But I must present B's strongest case fairly:
  - Serving 1,900 students (many underserved) creates broad impact
  - The effect is consistent across subgroups 
  - Small gains compound systemwide

  For implementation:
  - I'll suggest measuring college enrollment for A by March to verify impact
  - For B, propose tracking if homework gains correlate with course grades
  - The points conversion needs refinement - homework points shouldn't equal 5% of a college year

  The tone should be decisive yet respectful, acknowledging the committee's dilemma while providing clear direction. The memo will open with the recommendation immediately as requested.
answer: |-
  **MEMORANDUM**  
  To: Program Evaluation Committee  
  From: Student Member  
  Date: November 29, 2023  
  Subject: Recommendation for Final Allocation: Option A (Mentoring Program)  

  **Recommendation:** Approve Option A (mentoring and college-advising for 25 first-generation seniors), with conditions to measure long-term outcomes by March and revisit scalability.  

  ### Summary of Tradeoffs  
  Our decision hinges on reconciling two district policies: (1) maximizing aggregate outcome points and (2) ensuring gains are meaningful to individual students. Option B’s 5,700 outcome points (vs. A’s 2,500) nominally satisfies the first rule. However, Option B’s effect—0.6 homework points per student per term—fails our equity policy’s threshold for individual significance, as confirmed by unanimous committee concern. By contrast, Option A delivers transformative individual impact (one additional year of postsecondary enrollment), directly advancing our equity mission for a vulnerable group. When policies conflict, equity for underserved students must supersede arithmetic aggregation.  

  ### The Case for Option B (Presented Strongly)  
  Rejecting Option B warrants sober acknowledgment of its merits. At scale, it efficiently delivers measurable academic support to 1,900 students—76 times more than Option A—including many currently receiving no district interventions. Its effect (0.6 homework points) is statistically robust across all subgroups, suggesting systemic reliability. The consultant’s outcome-points framework rationally quantifies its broad, if incremental, benefit: 5,700 points signal real aggregate value. Choosing A leaves these 1,900 students without support, forfeiting a low-cost, evidence-based tool to nudge engagement district-wide.  

  ### Why Option A Prevails  
  Option B’s strength in breadth cannot resolve the fundamental incompatibility between its *trivial individual gain* and our equity mandate. Homework points lack demonstrated correlation with long-term outcomes (e.g., graduation, college access), while Option A’s "one additional year of college" is life-altering for first-generation students. The seniors in A represent a discrete equity cohort; if unfunded, they receive *nothing*, whereas B’s students may benefit from other programs. Our obligation to those with the greatest barriers—and no alternatives—outweighs distributing marginal gains widely.  

  ### Addressing the Hybrid Proposal  
  The suggestion to fund Option B for 400 students at a "higher dose" (e.g., enhanced features) is untenable. B’s effect size was measured at its proposed dose; altering delivery voids existing evidence. It also splits the difference poorly: 400 students still receive negligible individual gains while 25 high-need seniors are abandoned.  

  ### Conditions for Approval and March Revisit  
  Approve Option A **conditional on**:  
  1. **Tracking March Metrics**:  
     - For A: Confirm college application/enrollment rates for the 25 seniors by March 31.  
     - For Future B Consideration: Pilot B’s app in one grade (cost: <$20,000) to measure if homework points correlate with term grades or course completion by March.  
  2. **Outcome-Points Review**: The committee must clarify by March if "homework points" warrant inclusion in our metric. Assigning 5 points (5% of a college year) to one homework point overstates academic value without evidence.  

  ### Conclusion  
  Choose Option A because equity requires prioritizing profound change for underserved students over marginal aggregate gains. We fund the mentoring program to honor our commitment to students facing generational barriers—but simultaneously test Option B’s relevance to meaningful outcomes. By March, we will have data to redirect funds if A underperforms or if B’s homework effects predict larger impacts.  

  // End //  

