prompt: |-
  I'm a clinical epidemiologist, and twice a year I run a ninety-minute workshop for hospital mortality-and-morbidity review committees: around fifteen clinicians, no probability training beyond risk ratios and p-values. The one idea I want them to walk out with is the classical Condorcet jury theorem, because the working assumption in these rooms is that a verdict endorsed by eight people who read the same chart is more likely to be right than one endorsed by three, and that the size of the committee is itself doing the epistemic work.

  Plan how I should explain it; don't just explain it to me. Tell me what has to be in place before the claim is even intelligible, which single case should carry the whole thing and why it should not be a courtroom jury, where in the sequence to defuse each mistake I expect, one question I can ask at the end that would show it landed rather than being nodded at, and what I should openly decline to cover at this level.

  Two things I want handled carefully. First, my reviewers fail the theorem's independence condition, but not primarily because they talk: they all form their views from one shared written record, so their errors have a common cause even when nobody speaks. I want the sequence to separate non-communication from independence in the relevant sense, and to mark where deliberation genuinely helps — pooling evidence the members separately hold — as opposed to manufacturing the correlation the theorem excludes. Second, many of these reviews ask whether a death was avoidable under a standard of care rather than what happened, and I suspect the theorem has no purchase there; tell me where that limitation goes in the sequence and whether it is a footnote or load-bearing.

  The misconceptions I expect: that the theorem vindicates majority rule as such; that adding members always improves accuracy however weak they are; that what is needed is each member better than chance rather than the group's aggregate; that this is the same result as the intransitive-majorities problem also associated with Condorcet; and, worst, that the theorem shows our committee was right, when at most it licenses a conditional whose assumptions we cannot check from inside the room.

  Give it to me as one ordered plan of under 600 words, naming the carrying example in the first sentence and tagging the point at which each misconception gets headed off.
reasoning: |-
  Okay, I need to help a clinical epidemiologist explain the Condorcet jury theorem to hospital mortality review committees. The key is to focus on a single example that carries the explanation without using courtroom juries. Let me think about their scenario.

  The epidemiologist mentioned that reviewers rely on the same written record, which creates a common cause of error. This violates the independence condition. I should separate non-communication from independence and clarify when deliberation helps versus when it introduces problematic correlation. 

  The carrying example could be independent radiologists reading different X-rays. That shows how individual assessments, when truly independent, lead to better group accuracy. But in their case, everyone sees the same chart, so errors are correlated. I need to contrast that with pooling separate evidence, like different specialists bringing unique expertise.

  For misconceptions: I'll address early that majority rule isn't inherently vindicated—it's about competence and independence. The competence threshold (better than chance) is crucial, and adding weak members can hurt. I'll differentiate from the intransitive majorities problem. The biggest pitfall is mistaking the theorem as confirmation of their decisions rather than a conditional framework.

  The avoidable death question is a limitation. Since it's about judgment rather than factual truth, the theorem doesn't apply. This needs to be a load-bearing point, mentioned when discussing the theorem's assumptions.

  The sequence should start with the radiologist example, then define competence and independence. Show majority accuracy mathematically with high competence, then contrast with shared chart breaking independence. Explain helpful deliberation (pooling separate knowledge) versus harmful groupthink. End with a question testing understanding, like whether adding more reviewers always helps.
answer: |-
  Here's your teaching plan, centered on **independent infectious disease consultants** reviewing *different* lab reports for an outbreak source:

  1.  **Hook & Core Example (Mistake Head-Off: Majority Rule ≠ Inherently Epistemic):** "Imagine 15 expert ID consultants. *Each independently* reviews *different* lab data and patient histories for the *same* potential outbreak source (e.g., contaminated water vs. food). Each consultant is pretty good individually – say, 60% likely to identify the *true* source correctly based on *their unique data*. If they vote independently, what happens as we add *more* such consultants? Condorcet tells us something powerful about the group's chance of getting the *factual* source right via majority vote."

  2.  **Define Foundational Concepts:**
      *   **Binary Fact:** Emphasize the question is strictly factual: "What *was* the source?" (True/False). **Flag Limitation:** "This *does not apply* to judgments like 'Was the death avoidable?' – that's a different beast involving values and standards, not a single factual truth. The theorem needs a clear 'right answer'." **(Load-Bearing Limitation)**
      *   **Individual Competence (p):** "p is the probability *each* member gets the *factual* answer right *on their own*. Crucially, **p > 0.5** (better than coin flip)." **(Head-Off: 'Better than chance' is the *minimum* bar, not the group's aggregate)**
      *   **Independence:** "Votes are *independent* if knowing how Consultant A voted tells you *nothing* about how Consultant B will vote. Their errors aren't linked. This happens when they base their vote on *different* evidence or reasoning paths." **(Prepares for shared chart problem)**

  3.  **State the Core Claim:** "If these hold (binary fact, p > 0.5, independence), then: 1) The probability the *majority* gets the right answer is *higher* than any single member's p. 2) As you add *more* competent, independent members, this group accuracy *increases*, approaching 100% certainty with enough members."

  4.  **The Shared Chart Problem - Breaking Independence (Head-Off: Common Cause ≠ Communication):** "Now, contrast our ID consultants. *Your committee is different*. You *all* read the *exact same chart*. This is the problem! **The shared chart is a 'common cause' of error.** If the chart is missing a key lab result, *everyone* might miss it. If the note about the allergic reaction is ambiguously worded, *everyone* might misinterpret it the same way. Your errors become *correlated*, even if you never speak! **This violates the independence condition.** The theorem's guarantee *does not hold* when votes are correlated like this."

  5.  **When Deliberation Helps vs. Hurts:**
      *   **Helps (Pooling *Separate* Evidence):** "Good deliberation shines when members bring *unique, independent* knowledge. 'Dr. A, did you see the community health record showing prior admissions?' 'Nurse B, your shift note mentioned a different medication timing?' *This* pools distinct evidence, potentially raising individual competence *if* it reveals new facts." (Ties to competence `p`).
      *   **Hurts (Manufacturing Correlation):** "Bad deliberation happens when the group prematurely coalesces around an interpretation of the *shared, ambiguous* record. 'Well, the note *kind of* suggests X, so we all agree it's X?' This *creates* correlation in errors the theorem assumes away. Dominant personalities or fatigue can push this."

  6.  **Addressing Key Misconceptions Explicitly:**
      *   **Adding Weak Members:** "The theorem assumes *every* added member has p > 0.5. Adding someone who's only 40% correct *lowers* group accuracy under independence!" **(Head-Off: Adding members ≠ always good)**
      *   **Aggregate vs. Individual:** Reiterate "p > 0.5" is per *individual*, not the group's average feeling. **(Head-Off: Group's aggregate feeling)**
      *   **Condorcet Paradox:** "This is *not* about voting cycles (A>B, B>C, C>A). That's a different, also important, Condorcet result about preferences. We're only talking about finding a *factual truth*." **(Head-Off: Intransitive majorities)**
      *   **The Conditional:** Hammer home: "The theorem does **not** say your committee's *specific* majority decision was correct. It says *if* (big IF!) you have competent individuals voting independently on a factual question, *then* larger majorities from larger groups are more reliable. We *know* the independence condition is violated here (shared chart!). So, while larger agreement *feels* better, the theorem *doesn't guarantee* it actually *is* more reliable in your setting." **(Head-Off: Mistaking theorem as validation)**

  7.  **The Revealing Question:** "Based just on the theorem itself, if your committee *doubled* in size tomorrow, but every new member was only slightly better than chance (say p=0.51) and *still* relied solely on the same single chart, would Condorcet guarantee your group accuracy improved? Why or why not?" *(Correct Answer: No. Independence is still broken by the shared chart, and adding barely competent members doesn't overcome that or necessarily help much even if independent. Tests understanding of both independence violation and the p>0.5 requirement).*

  8.  **Openly Decline:** "We won't cover the math (binomial probabilities), extensions to unequal competence, or how to *measure* 'p' in practice today. Focus is on the core logic and its limits for *your* context."

  **Why this works:** The ID consultant example isolates the core mechanism (independent evidence -> independence) while being clinically relevant. Separating "shared evidence" (common cause) from "communication" (deliberation) is crucial. The "avoidable death" limitation is flagged early and centrally. Each major misconception is actively countered where it naturally arises. The final question directly probes the key tension: size vs. independence/competence.
