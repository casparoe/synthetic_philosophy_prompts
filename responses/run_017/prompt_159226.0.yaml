answer: |-
  ## The Ledger and the Lockstep

  The air in the Tribunal Chamber hung thick with dust motes dancing in the single shaft of late afternoon sun piercing the high, narrow window. Below, on the worn oak table, lay the Bureau of Removals’ final ledger for the Kestrel Accord, its pages heavy with ink and consequence. Five faces stared at it – the Tribunal members – and one face, pale as parchment, watched them: Aris Thorne, son of the murdered Mediator.

  Chief Clerk Hestia Morn, her grey hair scraped back severely, stood ramrod straight. "The Bureau's findings are conclusive, Esteemed Tribunal. The Kestrel Accord fell on the 17th of Rainmonth, 30th Year of the Compact. We have examined the documented precipitating factors under Procedure Seven: removal and consequence isolation."

  She tapped the ledger, her finger landing on the first entry. **"Factor Alpha: Grain Convoy R-17.** Due to unseasonal silting at the Gull’s Beak sandbar – documented siltation reports attached, Appendix A – Convoy R-17 arrived at Kestrel Landing on the 15th, not the 12th. Removal: Had the siltation *not* occurred, the convoy arrives on schedule. Consequence: Riverside districts receive grain. Ledger holds all subsequent events fixed. Conclusion: Riots on the 13th do not occur. Council convenes on the 14th as scheduled... but dissolves anyway over the subsequent disputes regarding the Mediator succession and garrison movements. Accord still falls. Factor Alpha: Insufficient."

  A murmur ran through the observers. Aris Thorne flinched. His father’s death was next.

  **"Factor Beta: Death of Mediator Ennis Thorne."** Hestia’s voice didn’t waver. "Assassinated by crossbow bolt, Council Plaza, noon, the 14th. Per City Watch report and witness testimonies (Appendix B): Shooter One, concealed in the Weaver’s Guild loft, fired the fatal shot. Shooter Two, positioned near the Fishmonger’s stall, was apprehended before firing; a loaded crossbow was recovered. Removal: Had Shooter One *not* fired…" Hestia paused, her gaze briefly flicking to the rulebook beside the ledger. "...Procedure Seven requires holding *all else* fixed, barring direct interference caused by the removal itself. Shooter Two remains present, armed, and unapprehended. Shooter Two fires. Mediator still dies. Council, lacking his unifying authority, fractures irreparably on the 14th. Accord still falls. Factor Beta: Insufficient."

  Aris choked back a sound. *Shooter Two never fired!* But the Bureau’s cold logic held Shooter Two ready, like a coiled spring, frozen in that moment of potential violence. The *possibility* condemned his father’s death to irrelevance.

  **"Factor Gamma: Mutiny of the Riverstone Garrison."** Hestia moved on. "Commander Vor sent dispatch R-S-9 (Appendix C) at dawn on the 16th, declaring his intent to march on Kestrel Landing to 'secure order' after the riots and the Mediator’s death. He arrived on the 17th, finding the Council Hall already abandoned. Removal: Had Commander Vor *not* decided to march… Ledger holds fixed the Council’s dissolution on the 14th. Garrison remains at Riverstone. Accord still fell on the 17th due to the prior dissolution. Factor Gamma: Insufficient."

  She paused, letting the weight of the three 'insufficients' settle. Then her finger tapped the fourth entry, written in a different, almost dismissive ink. **"Factor Delta: Unanimity Clause, Article 12, Section 3.** Incorporated at the Accord's founding. Requires unanimous ratification for any emergency measure, including extending council sessions or appointing an interim mediator. Never invoked. Removal: Had the Unanimity Clause *not* been part of the Accord… Following the Mediator’s death on the 14th, a simple majority vote could have extended the session or appointed a successor. Council remains functional. Subsequent riots or garrison movements could have been addressed *within* the Accord framework. Accord does *not* fall. Factor Delta: Necessary and Sufficient."

  A collective intake of breath. A *rule*. An obscure clause. The cornerstone of the collapse.

  **"Disputed Factor: Epsilon Dispatch."** Hestia’s tone turned dismissive. "Dispatch from Silver Reach, dated the 15th, intercepted on the 17th (Appendix D), revealing their covert rearmament – an act which *would* have violated the Accord. Removal: Had the rearmament *not* occurred… Ledger holds fixed the Council’s dissolution on the 14th. Dispatch arrives on the 17th to find no Accord left to violate. Factor Epsilon: Causally irrelevant."

  Tribunal Head, Magistrate Borin, a man whose face resembled old leather, leaned forward. "So, Clerk Morn, the Bureau finds only one true cause? This… clause?"

  "By the strict application of Procedure Seven, Esteemed Magistrate," Hestia affirmed. "The clause was the necessary condition. Without it, the other events, however disruptive, could not have dissolved the framework itself."

  "But the riots? The murder? The mutiny?" protested Advocate Kell, representing Kestrel Landing, which blamed Riverstone for the mutiny. "Are you saying they did *nothing*?"

  "They were precipitating events, Advocate," Hestia replied coolly. "But the ledger shows the Accord possessed the means to withstand any *one* of them, had the clause not existed. The clause was the lock that failed."

  "Lock?" scoffed Commander Vor’s advocate. "It was a rusty scrap of words! My client acted only because chaos reigned! The riots, the murder – *that* was the cause!"

  The tribunal dissolved into procedural wrangling. Aris Thorne felt numb. His father’s death, dismissed as insufficient. The grain merchant whose convoy was late sat slumped, spared reparations. Commander Vor glowered, his mutiny deemed irrelevant. The cost was all on Aris: reparations levied on his family’s estate and, potentially, a treason indictment for his father’s role in a ‘failed mediation’.

  During the recess, a junior clerk, Elara, approached Aris hesitantly. Her eyes were red-rimmed. "Sir... about Shooter Two."

  "What of him?" Aris rasped.

  "During the Beta removal... Senior Clerk Morn was very strict. 'Hold all else fixed. Shooter Two was there, armed, motive established. He fires.' But..." Elara lowered her voice. "The Watch report. Shooter Two was *apprehended* by Guard Captain Pell *because* Shooter One fired. The noise, the chaos... Pell saw him fumbling with his weapon *after* the bolt struck. If Shooter One *hadn't* fired... would Pell have noticed Shooter Two? Would he have been arrested *before* he acted? It... it changes the removal."

  Aris stared at her. The Bureau’s certainty rested on freezing time at noon on the 14th, holding Shooter Two perpetually ready to shoot, ignoring the ripples caused by removing the *actual* shot. Elara was tracing backwards, against Procedure Seven. "But your ledger..."

  "Procedure forbids tracing consequences backwards," Elara whispered, shamefaced. "It would invalidate the finding. Clerk Morn says it leads to endless speculation. But... it *feels* wrong." She fled before Hestia Morn returned.

  The tribunal reconvened. Arguments raged. Kestrel Landing argued the grain delay *was* the but-for cause of the riots that prevented the council from addressing the murder. Riverstone argued the mutiny was the *only* physical dissolution. A historian-pamphleteer shouted from the gallery that the *real* cause was the *lack* of trust manifest in Silver Reach’s secret rearmament, making the clause irrelevant. Hestia Morn defended the Bureau’s findings with icy procedural correctness. "The ledger is clear. The procedure is sound. We trace the thread of removal *forward*, not backward into the tangle of might-have-beens."

  Magistrate Borin finally raised a hand for silence. He looked exhausted. "We must name a cause. Reparations hinge upon it. Justice demands it. The Bureau's method is established. We have their finding." He glanced at the pale Aris Thorne. "The Unanimity Clause in Article Twelve, Section Three, is hereby declared the Proximate and Decisive Cause of the Collapse of the Kestrel Accord."

  Aris closed his eyes. The cost was immediate. Bailiffs stepped towards him. The treason indictment against his late father would proceed, tarnishing his name, seizing his assets. The grain merchant exhaled in relief. Commander Vor smirked. The Silver Reach delegates looked bored. The clause, the unnoticed lockstep rule buried in parchment, had been named. It was necessary, like air for fire. But naming it felt like blaming the riverbed for the flood.

  As Aris was led away, he passed Hestia Morn packing the ledger. Her face was impassive, but her knuckles were white on the leather binding. Elara stood nearby, clutching a sheaf of Watch reports, her eyes fixed on the entry for Shooter Two, seeing the fragile edifice of the Bureau’s truth built on the convention of frozen time. The grain convoy’s silt, the bolt from the loft, the garrison commander’s ambition, the fear driving Silver Reach – they all echoed in the silent chamber, causes undeniable yet erased by the ledger’s logic and the tribunal’s need for a single name. The Accord had fallen in a week, brought down by a convergence of failures. But history, and justice, would record only the failure of a forgotten rule. The air, necessary, had been named the arsonist.
