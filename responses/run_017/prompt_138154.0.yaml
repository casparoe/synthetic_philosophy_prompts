  The handbook needs to be written in deadpan bureaucratic style with no overt humor, while subtly undermining itself through its premise. I need to incorporate specific cosmological paradoxes: typicality reasoning that makes Boltzmann brains problematic for cosmology departments, the unreliability of memories for fluctuation observers, the unresolved measure problem, and the contradiction between the handbook's instructions and the unstable reality it describes.

  The required sections include: Welcome, What We Know About You, Your Memories, How to Report a Suspected Fluctuation, Your Rights, and a closing exhortation to continue research and teaching normally. Each section should sound useful while being fundamentally useless given the circumstances.

  I need to maintain strict scientific accuracy regarding Boltzmann brains and cosmology concepts while making it accessible to non-physicists. No citations or references to real papers - just generic cosmological concepts. The satire should emerge naturally from the logical structure rather than invented absurdities.

  For the Welcome section, I'll use standard corporate welcome language that becomes ironic when addressed to entities with fractions-of-a-second lifespans. "What We Know About You" will state the expected lifetime without acknowledging how this contradicts the stable reality the department claims to study.

  The "Your Memories" section is particularly tricky - I need to explain that memories can't be trusted without admitting this invalidates the handbook's own claims. I'll frame it as standard onboarding advice about memory verification.

  For "How to Report a Suspected Fluctuation," I'll create an impossible bureaucratic procedure that requires stability the Boltzmann brain won't have. "Your Rights" will list meaningless entitlements like professional development for beings about to cease existing.

  The closing section should be the most biting - urging continued research and teaching when the "faculty member" will disappear before finishing a sentence. The satire peaks here by maintaining absolute bureaucratic seriousness about impossible expectations.

  Throughout, I'll maintain the HR pamphlet voice: numbered sections, footnotes, institutional cadence. The physics must be accurate enough to make real cosmologists wince in recognition. The humor comes from the earnest presentation of logical impossibilities without ever acknowledging the contradictions.
