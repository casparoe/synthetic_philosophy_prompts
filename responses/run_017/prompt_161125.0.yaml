prompt: |-
  Twenty years into the evolutionary debunking literature it feels totally frozen: the Darwinian-dilemma style arguments keep coming, the third-factor / dovetailing replies and the "that would be an unexplained coincidence" replies keep coming, everyone agrees on the evolutionary story itself — that selective pressures shaped a big chunk of our moral psychology toward fitness rather than toward the moral facts — and nobody moves an inch. I want a diagnosis of the stalemate, not another survey of who said what.

  Here's my hunch, which I might be wrong about. I think "our moral beliefs were selected for fitness, not for truth" is agreed on by both sides and actually does no work; what does the work is a counterfactual claim nobody states out loud — that had the moral facts been different (if, say, gratuitous cruelty had been morally required, or impartial benevolence forbidden) our beliefs would have come out roughly the same anyway. Call the first thesis Off-Target and the second Insensitive. If I'm right, the interesting question isn't about evolution at all but about the space of possible selective pressures, and both sides are answering it from the armchair, which is why it plays out as people restating priors at each other.

  A second thing I notice: the sides seem to be using different exhibits. Debunkers reach for kin altruism, reciprocity, purity/disgust and loyalty, where the fitness story is detailed; the third-factor people reach for impartial claims about harm and fairness, where it's much easier to say that the truth itself was fitness-conducive. So maybe it's partly a fight about which beliefs are the data, and the "all moral beliefs or none" framing is what keeps it stuck.

  So: verbal, or substantive? A hidden empirical/counterfactual question, a disagreement about which cases count as data, a clash of priors and burdens of proof in epistemology, or two questions under one name? Argue for one (or tell me it splits several ways and by how much), and then tell me what would count as progress given your diagnosis — a distinction like mine, some formal result about tracking, restricting the argument to a subclass of moral beliefs, an actual result about counterfactual selection — or tell me honestly that no progress should be expected and why.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're frustrated with the stalemate in evolutionary debunking arguments (EDAs) in metaethics. The core issue is that despite two decades of debate, no one seems to be moving forward. Both sides agree that natural selection shaped moral psychology for fitness, not truth—what the user calls "Off-Target." Yet, the debate remains stuck. The user's hunch is that the real sticking point is an unstated counterfactual claim, "Insensitive": that if moral facts were different, our beliefs would still be the same due to evolutionary pressures.

  First, I need to validate if the user's insight about Insensitive is accurate. Looking at key papers, debunkers like Sharon Street often imply Insensitive when they argue that evolution would produce the same beliefs regardless of moral facts. Defenders, like David Enoch, counter by proposing third factors—traits that align truth with fitness. But both sides don't explicitly separate Off-Target from Insensitive. The user is spot-on here; Insensitive is the hinge.

  Next, the user points out that both sides use different exhibits. Debunkers focus on kin altruism or disgust, where the fitness link is clear. Defenders use impartial harm norms, where truth and fitness might align. This selective use of examples keeps the debate circular. The user's observation about "which beliefs are data" is crucial. The "all or nothing" framing ignores this nuance, causing stalemate.

  Now, considering the user's request for a diagnosis and path forward. They want to know why things are stuck and how to move forward. The key issues are: the conflation of Off-Target/Insensitive, cherry-picking examples, and differing burdens of proof. 

  For progress, distinguishing Off-Target and Insensitive formally is essential. Debunkers must prove Insensitive, not just assume it. Then, moving beyond armchair speculation to empirical work on how sensitive moral beliefs are to varying environments. Computational models could help test counterfactuals. Also, fragmenting the debate by moral domains—like harm versus purity—could break the stalemate. This means rejecting the "all or nothing" approach.

  The user might be a grad student or philosopher tired of repetitive debates. Their deeper need is for a fresh framework to make progress. They’re not looking for another survey but actionable solutions. They might also want interdisciplinary approaches, combining philosophy with evolutionary biology or cognitive science. 

  In conclusion, the user's hunch is correct. The stalemate is due to unaddressed Insensitive, selective examples, and burdens of proof. Progress requires formal distinctions, empirical work, domain-specific analysis, and interdisciplinary collaboration. This could transform a frozen debate into a dynamic one.
answer: |-
  Here's a diagnosis arguing that the stalemate is **substantive, rooted in three interlocking factors: a hidden counterfactual commitment, selective domain focus, and conflicting epistemological burdens.** Progress requires tackling all three.

  1.  **"Insensitive" is the Hidden Engine (You're Largely Right):**
      *   **The Core:** Off-Target (selection for fitness, not truth) *alone* is insufficient to debunk. It merely establishes a *possible* disconnect. The *necessary* debunking premise is Insensitive: our belief-forming process is *unresponsive* to the moral facts. If the process would output the same beliefs regardless of the moral truth (because evolution was only "listening" to fitness), then the actual truth of our beliefs *is* a coincidence.
      *   **Why It's Hidden & Sticky:** Both sides *know* this implicitly. Debunkers *assume* Insensitivity is true because the evolutionary causal story seems to leave no room for moral facts to influence the process. Defenders *deny* Insensitivity precisely by positing third factors or dovetailing – mechanisms where tracking truth *just is* fitness-conducive in the relevant domain. The stalemate arises because **proving "Insensitive" requires establishing a counterfactual about selection pressures under different moral facts, which is empirically inaccessible and conceptually fraught.** Both sides retreat to armchair intuitions about what selection *could* or *couldn't* produce, grounded in their prior metaphysical/epistemological commitments (e.g., naturalism vs non-naturalism, reliability of intuitions).

  2.  **Selective Domain Focus Fuels the Fire (Your Second Point is Crucial):**
      *   **The Data Problem:** You're exactly right about the exhibits. Debunkers focus on domains clearly shaped by parochial evolutionary pressures (kin altruism, in-group loyalty, disgust-based purity). Here, the fitness story is robust, and the link to *objective moral truth* seems tenuous at best – Insensitivity seems plausible. Defenders focus on core prohibitions (harm, fairness, impartiality). Here, they argue tracking truth *is* fitness-conducive (e.g., cooperation requires norms against harm and cheating; impartiality prevents destructive in-group conflict).
      *   **Why It Sticks:** Both sides are arguing past each other by:
          *   **Generalizing Illegitimately:** Debunkers imply that *if some* core moral beliefs are insensitive, *all* are (especially "core" ones). Defenders imply that *if some* core beliefs are sensitive/truth-tracking, *all* core beliefs are, and perhaps the debunkable ones aren't "really" moral.
          *   **Defining the "Core" Differently:** What counts as the explanandum? Debunkers often include loyalty/purity in the core. Defenders often exclude them as non-moral or derivative.
          *   **Ignoring Interaction:** Even if harm norms are truth-tracking *now*, were they *shaped* by tracking truth, or by fitness, and did those coincide *contingently*? Insensitivity might hold for the *origin*, even if sensitivity holds *now*.

  3.  **Conflicting Epistemological Burdens & Priors Cement the Stalemate:**
      *   **The Burden Clash:** Debunkers argue: "Given Off-Target, and the plausible Insensitivity (especially in domains X,Y,Z), the coincidence of true beliefs needs explaining. Your third-factor story is just an *ad hoc* rescue attempt." They place the burden on the realist to *prove* sensitivity/dovetailing. Defenders argue: "Off-Target doesn't *entail* Insensitivity. We have prima facie justification for our core moral beliefs. The debunker needs to *prove* Insensitivity across the board, not just assert its possibility or point to non-core domains." They place the burden on the debunker to *disprove* sensitivity/dovetailing.
      *   **Deep Priors:** The burden each side accepts reflects deeper priors:
          *   **Debunker Prior:** Strong naturalism/metaphysical suspicion; moral beliefs *look like* other evolved faculties (e.g., taste preferences), which *are* insensitive to objective counterparts.
          *   **Defender Prior:** Robust moral phenomenology/internal realism; the seeming objectivity/reasonableness of core moral demands suggests sensitivity; evolution is seen as a potential *conduit* for truth, not necessarily a barrier.

  **Why This Creates a Stalemate:** The debate hinges on Insensitivity, which is a massive, empirically unverifiable counterfactual claim about evolution under different moral facts. Both sides supply armchair evolutionary scenarios supporting their view, grounded in their priors and focused on domains favorable to their case. Neither can decisively shift the burden because the key premise (Insensitivity) is fundamentally resistant to direct evidence. It's a clash of explanatory frameworks with different burdens of proof, selectively applied to different data.

  **Paths to Progress (Building on Your Insights):**

  1.  **Formalize and Attack "Insensitive" Directly:**
      *   **Distinction:** Make the Off-Target/Insensitive distinction explicit and mandatory. Force debunkers to argue *for* Insensitivity, not just assume it from Off-Target.
      *   **Formal Modeling:** Use evolutionary game theory, agent-based models, or formal learning theory to explore *how sensitive* belief-forming mechanisms *could be* to environmental inputs (including potential moral facts) *under different assumptions*. Model scenarios where "truth-tracking" is/isn't fitness-conducive. **Progress:** A formal result showing that Insensitivity is either (a) *highly probable* under plausible evolutionary assumptions, or (b) *surprisingly difficult to achieve* without specific constraints, would shift the debate.
      *   **Comparative Sensitivity:** Analyze the *relative sensitivity* of moral cognition vs. other evolved faculties (e.g., perception, folk physics, predator detection) to their respective target domains. Is moral cognition uniquely or exceptionally *in*sensitive compared to other domains where we grant reliability?

  2.  **Fragment the Debate (Reject "All or Nothing"):**
      *   **Domain-Specific Debunking:** Acknowledge that the evolutionary story and the plausibility of Insensitivity likely vary *dramatically* across moral domains. Progress requires abandoning the quest to debunk/defend "morality" wholesale.
      *   **Domain Taxonomy:** Develop a principled taxonomy of moral beliefs based on their likely evolutionary etiology and cognitive underpinnings (e.g., harm/fairness vs. purity/authority vs. abstract distributive justice). **Progress:** A widely accepted taxonomy where both sides agree that *some* domains (e.g., disgust-based purity norms) are likely insensitive and debunkable, while *others* (e.g., core harm norms) require a different analysis, would break the stalemate.
      *   **Hybrid Views:** Explore views where some domains are sensitive/truth-tracking, others are insensitive/useful fictions, and their interaction creates our overall moral psychology.

  3.  **Empirical Work on Counterfactual Sensitivity (Indirectly):**
      *   **Environmental Variance:** Study how moral intuitions vary (or don't vary) across human populations facing *radically different* adaptive challenges (e.g., small-scale foragers vs. large-scale agriculturalists vs. modern industrial societies). While not testing *moral facts* changing, it tests sensitivity to *environmental inputs*. **Progress:** Finding significant, adaptive variation in *core* moral intuitions (beyond the usual suspects like purity) would support debunkers. Finding remarkable stability in core norms (like harm prohibitions) across vastly different environments would support defenders (suggesting robustness/resilience, potentially indicating sensitivity).
      *   **Cognitive Archaeology/Anthropology:** Investigate the development of moral concepts and norms in human prehistory and history. Does the emergence of norms like universal human rights or impartial benevolence track plausible changes in social complexity/cooperation problems (favoring a fitness story), or does it seem like a discovery process less tied to immediate fitness (suggesting potential sensitivity)?

  4.  **Reframe the Epistemological Question:**
      *   **Coincidence vs. Explanation:** Shift focus from "Is it a coincidence?" to "What constitutes a *satisfactory explanation* for the alignment (if any) between our moral beliefs and the moral facts, given Off-Target?" Is a third-factor explanation *sufficiently good* even if Insensitivity is *possible*? What are the criteria for a "good enough" explanation here?
      *   **Defeasibility:** Focus on whether evolutionary origins provide *defeaters* for specific types of justification (e.g., intuition-based) in specific domains, rather than global skepticism.

  **Will Progress Happen? Should It Be Expected?**

  Progress is **possible but difficult and incremental**. Expecting a single knock-down argument or formal proof to resolve the core metaphysical/epistemological clash is unrealistic. However, progress *can* and *should* be expected in the following ways:

  1.  **Conceptual Clarification:** Widespread adoption of the Off-Target/Insensitive distinction and abandoning "all or nothing" claims would be major progress.
  2.  **Domain Fragmentation:** Achieving consensus on a taxonomy where evolutionary debunking is accepted for *some* moral domains but seen as implausible for others would be significant progress, moving beyond the binary stalemate.
  3.  **Sharpened Arguments:** Formal modeling and empirical work on variation can force both sides to refine their scenarios and burden-shifting arguments, making the underlying commitments and disagreements clearer, even if not resolved.
  4.  **Shifting the Burden (Locally):** Strong empirical evidence of radical adaptive variation in a domain previously thought "core" could shift the burden towards debunkers *in that domain*. Evidence of robust stability *despite* environmental variation could shift the burden towards defenders *in that domain*.

  The stalemate persists because it touches the deepest nerves of metaphysics and epistemology. However, by rigorously dissecting the hidden premise (Insensitive), rejecting monolithic approaches, embracing domain-specificity, and leveraging formal and empirical tools to constrain armchair speculation, **substantive, albeit localized and piecemeal, progress is achievable.** The frozen field can thaw, not with a single sun, but by carefully melting specific patches of ice.
