prompt: |-
  I write a weekly column for a science-and-ideas magazine, about 800 words, pitched Monday and filed Wednesday, and an editor who is very smart but not a philosopher has to sign off on the headline. I recieve maybe one paper a month from the cross-cultural "experimental philosophy" literature — give people a vignette in two or more countries and see whether they answer differently: Gettier cases, the chairman-and-the-environment style of case, trolley stuff. These pieces always do numbers and always get over-read. I publish "people in X answer differently" and by the end of the week it's being passed around as "culture determines whether you think Y." I want to stop guessing at this.

  So: give me a procedure I can run in about half an hour, on a PDF before my Monday pitch meeting, to decide (a) whether there is a story, (b) how strong a claim I'm allowed to make in the headline and lede, and (c) when I have to kill it. Ordered questions; what counts as a sufficient answer to each; where the procedure stops with a no; and — importantly — where it has to hand the decision to a person because it's not a factual question at all, e.g. how much risk of over-reading is worth a good story.

  The hard cases it has to handle, because these are the ways I've been burned: the paper says "Brazilians vs Japanese" but it tested undergraduates in two cities; the load-bearing word ("knows," "intentionally," "responsible") may not map cleanly onto the other language, and I get one email to the corresponding author with 24 hours to reply; the samples differ in years of education and in how willing they are to use the top of the scale; the effect is significant but tiny, or it's a shift in the middle of the distribution rather than a flip in which answer is modal; it's a null result being pitched as a failed replication; and the difference might be about the pragmatics of the vignette — what the subject thinks the experimenter is getting at — rather than about the concept at all. Also: my readers want to know whether any of this changes a philosophical conclusion, and there's that standing objection that folk intuitions from undergraduates were never evidence for anything in the first place. The procedure should tell me when that objection kills the story and when it's simply irrelevant to the only claim I'm making.

  I'd like an explicit claim-strength ladder: for each grade of evidence, the strongest sentance I'm allowed to write, down to "we can't say culture at all, only these two samples." Plus a rule that every such piece carries one sentence saying what would have to be true for this not to be a cultural difference.

  Then run it on three. (1) Around 150 students each in Toronto and Seoul on a Knobe-style intentionality case: the asymmetry shows up in both samples, but one sample is much less willing to say "intentionally" across the board, including for the good side effect. (2) A Gettier-vignette study in Nanjing and Edinburgh finding no difference once the question is strengthened from "knows" to something like "really knows" — decent n, pre-registered. (3) The one I've already half-pitched to my editor and really want to write: a large, careful study where the between-sample difference is real and robust, but every measured covariate on which the samples differ (English fluency, years of university, urban vs rural) also tracks the dependent variable — and my proposed headline is "Why [culture] doesn't believe in [thing]."

  Commit. Give me actual numbers where numbers are the right kind of thing — effect-size floors, n, what counts as a passed comprehension check — take a position on each of the three (write it, write it downgraded, or spike it), and tell me where your own procedure is likely to misfire. Don't hand me a menu of considerations to weigh myself; I already do that and I usually get it wrong.
reasoning: |-
  We are designing a procedure for evaluating experimental philosophy papers for a science column. The procedure must be run in about 30 minutes and answer:
  (a) whether there is a story,
  (b) how strong a claim can be made in the headline and lede, and
  (c) when to kill the piece.

  The procedure must handle the following hard cases:
  - Samples are undergraduates in two cities but generalized to countries.
  - Load-bearing words might not map cleanly across languages.
  - Sample differences in education, response style (e.g., scale use).
  - Effect size: tiny or a shift in distribution rather than a modal flip.
  - Null result pitched as a failed replication.
  - Difference due to pragmatics rather than the concept.
  - Philosophical relevance: when folk intuitions matter and when they don't.

  The procedure will include:
  1. Ordered questions with clear criteria for sufficiency and stopping points.
  2. A claim-strength ladder for headlines and ledes.
  3. A rule that every piece must include one sentence stating what would have to be true for the result not to be a cultural difference (i.e., alternative explanations).

  We are also to apply the procedure to three examples and decide: write, write downgraded, or spike.

  ---

  **Procedure: The X-Phil Quick Check**

  **Step 0: Pre-Screen (5 minutes)**
  - Skim the abstract, introduction, and results. Note:
    - The dependent variable (DV): what is being measured (e.g., % saying "knows", rating of intentionality).
    - The independent variable (IV): the cultural groups (which countries? which samples?).
    - The main result: is there a reported difference? What is the effect size?
    - Sample sizes and characteristics (students? general population?).
    - Any pre-registration or methodological safeguards.

  **Step 1: Is there a story? (10 minutes)**
  A story exists if the paper reports a non-trivial result that is either:
     - A cross-cultural difference (or similarity) that is theoretically interesting (e.g., challenges a universalist claim, shows robustness of an effect across cultures).
     - A null result that is a direct replication attempt and the original was influential.

  *Questions to answer:*
  1. **Generalizability of samples:** Are the samples more than just undergraduates in two cities? 
     - *Criteria:* If the paper claims "Culture X vs Culture Y" but uses only students from one city per country, mark as "weak generalizability". If they use multiple sites or a more representative sample, mark as "strong". 
     - *Stopping point:* If the sample is so narrow (e.g., one university per country) that any cultural claim is unwarranted, and there's no other hook (e.g., a direct replication of a famous study), then **kill the story** (no story). Otherwise, proceed.

  2. **Linguistic and conceptual equivalence:** Is there evidence that the key terms (e.g., "intentionally", "knows") were properly translated and understood?
     - *Criteria:* Look for methods: back-translation? pre-testing? comprehension checks? 
     - *Stopping point:* If there is no mention of back-translation or pre-testing for key terms, and the effect hinges on a word that might not have a direct equivalent, then **proceed with extreme caution** (but don't kill yet). If the authors report that comprehension checks were failed by a substantial portion (e.g., >15%) of participants, then **kill the story** (because the results might be noise). Otherwise, proceed.

  3. **Effect size and robustness:**
     - *Criteria:*
       - For a difference: The effect size should be at least Cohen's d = 0.4 (moderate) or a relative risk/odds ratio of at least 1.5. For categorical responses, the difference in proportions should be at least 15 percentage points. If the effect is smaller, it's a weak story unless the sample is very large and the effect is highly significant (p < 0.001) and the authors have ruled out confounds.
       - For a null result (replication): The sample size should be at least as large as the original, and the confidence interval should exclude the original effect size (or the paper should report a Bayes factor in favor of the null > 3).
     - *Stopping point:* If the effect is trivial (e.g., d < 0.2, or proportion difference < 5%) and the sample is small, or the null result is underpowered, then **kill the story**. Otherwise, proceed.

  4. **Alternative explanations:** 
     - *Criteria:* Check if the paper addresses:
       - Demographic differences (age, education, etc.): Are these controlled? If the samples differ on education and education is related to the DV, then the effect might be due to education.
       - Response styles: e.g., extreme responding. Does the paper control for this (e.g., by including a scale that measures response style, or by using a design that accounts for it)?
       - Pragmatic factors: Does the paper rule out that participants are responding to what they think the experimenter wants?
     - *Stopping point:* If the paper does not address major confounds (like education or response styles) and the samples differ on these, then the story is **weak** and must be downgraded. But proceed to Step 2 for claim strength.

  *Output of Step 1:* 
     - If any stopping point leads to "kill", then **spike the story**. 
     - Otherwise, there is a story. Proceed to Step 2 to determine claim strength.

  **Step 2: Claim Strength Ladder (10 minutes)**
  Based on the assessment in Step 1, assign a grade of evidence (A to D) and the corresponding claim strength.

  - **Grade A (Strong):** 
     - Samples are representative or at least diverse (multiple sites, not just students).
     - Linguistic equivalence established (back-translation, pre-testing, high comprehension).
     - Large effect size (d >= 0.8, or proportion difference >= 25%).
     - Controls for major confounds (demographics, response styles) and shows robustness.
     - *Claim allowed:* "Culture X and Culture Y think differently about [concept]." OR "People in [Culture X] are more likely to [judgment] than people in [Culture Y]."

  - **Grade B (Moderate):** 
     - Samples are from one site per country but are not students (e.g., community sample) OR are students but the study is a direct replication of a classic study.
     - Some evidence of linguistic equivalence (back-translation, but maybe no pre-testing; comprehension checks passed).
     - Moderate effect size (d between 0.4 and 0.8, proportion difference 15-24%).
     - Some controls, but maybe not all (e.g., they controlled for age and gender but not education, and education differs).
     - *Claim allowed:* "Study suggests cultural differences in [concept] between [Culture X] and [Culture Y]." OR "Preliminary evidence that [Culture X] and [Culture Y] may differ in [judgment]."

  - **Grade C (Weak):** 
     - Samples are undergraduates from one university per country (narrow).
     - Little or no evidence about linguistic issues (only simple translation, no back-translation; no comprehension checks).
     - Small effect size (d between 0.2 and 0.4, proportion difference 5-14%).
     - No control for confounds, but the authors acknowledge the limitation.
     - *Claim allowed:* "In one study, students in [City X] and [City Y] responded differently to a [concept] scenario." OR "A small difference was observed between two groups of students, but more research is needed."

  - **Grade D (Very Weak):** 
     - Samples are very small or unrepresentative (e.g., n<50 per group, or a convenience sample that is not even from the target culture).
     - Serious translation issues (e.g., the key word is known to be problematic and no check was done).
     - Very small effect (d<0.2, proportion difference <5%) that might be due to noise.
     - No control for confounds and samples differ substantially on them.
     - *Claim allowed:* "A study found a minor difference in responses between two groups, but the result is tentative and may not reflect broader cultural patterns."

  Additionally, every piece must include a sentence like: "It remains possible that the observed difference is due to [alternative explanation, e.g., differences in education or how the question was understood] rather than culture per se."

  **Step 3: Philosophical Relevance (5 minutes)**
  - *Question:* Is the result relevant to a philosophical debate? 
     - If the paper is about a classic thought experiment (like Gettier or trolley), then it is relevant to the debate about whether folk intuitions are universal. Even if folk intuitions are not taken as evidence by philosophers, the fact that they vary can challenge the idea that a concept is universal.
     - *Stopping point:* If the study is about a concept that is not central to any philosophical debate (e.g., a made-up scenario with no philosophical history), then the story might not be interesting to readers. However, if the study is a direct test of a famous case (like Knobe effect) then it is relevant.

  *Rule:* The objection that "folk intuitions from undergrads were never evidence" does not kill the story if the story is about the variation itself (i.e., the fact that intuitions vary across cultures is news, regardless of whether philosophers should use them). But if the story is being pitched as having direct implications for a philosophical conclusion (e.g., "this shows that knowledge isn't justified true belief"), then we must be explicit that philosophers debate the relevance of folk intuitions.

  *Output:* 
     - If the study is not about a well-known philosophical case and there's no hook, **kill the story** (even if there's a difference). 
     - Otherwise, the story stands at the claim strength determined above.

  **Step 4: Final Decision (2 minutes)**
  - If the story was not killed in Steps 1 or 3, then write it at the claim strength determined in Step 2.
  - If killed, then spike it.

  ---

  **Applying the Procedure to the Three Examples**

  **Example 1: Toronto vs Seoul on Knobe-style intentionality**
  - **Step 1:**
    - *Samples:* Undergraduates in two cities (Toronto and Seoul) -> weak generalizability. (But note: Knobe effect is a classic, so replication in two cultures is a hook.)
    - *Linguistic:* Not specified in description, but Knobe cases are widely used. Assume standard back-translation? (If not, caution.) Comprehension checks? (Not mentioned.) -> Assume weak on this if not reported.
    - *Effect:* Asymmetry (Knobe effect) in both, but one group is less willing to say "intentionally" overall. The cross-cultural difference is in the overall rate, not the asymmetry? Then the effect of interest is the difference in the base rate. What is the effect size? If the base rate difference is large (e.g., 20% vs 60% saying intentionally for the good side effect) then moderate. If it's 40% vs 50%, then small.
    - *Confounds:* The description says the samples might differ in response style (willingness to use top of scale). If the paper did not control for this, then alternative explanation.
    - *Verdict:* There is a story (replication of asymmetry and a base rate difference) but with caveats.

  - **Step 2:** 
    - Grade: Probably C (Weak). Samples are students from one city, effect size unknown but if base rate difference is moderate then maybe B? Let's assume the base rate difference is 20 percentage points (e.g., 30% in Seoul vs 50% in Toronto for the good side effect) -> then B. But if they didn't control for response style, then C.
    - Claim allowed: "Study suggests that South Korean students are less likely than Canadian students to say a side effect was brought about intentionally, even in cases of a positive outcome."

  - **Step 3:** The Knobe effect is a famous philosophical puzzle. Relevant.
  - **Step 4:** Write, but at downgraded claim (Grade B or C).

  **Example 2: Nanjing and Edinburgh on Gettier with strengthened question**
  - **Step 1:**
    - *Samples:* Students in two cities -> weak generalizability.
    - *Linguistic:* The study strengthened the question (from "knows" to "really knows") to address linguistic issues. This is an attempt to fix a known problem. Pre-registered -> good.
    - *Effect:* Null result (no difference between groups). The sample size: "decent n" (say, 150 per group? enough for a moderate effect). They found no difference even with the strengthened question. This is a replication of a null? The original Gettier studies often found cross-cultural differences? This is a direct test of whether the difference disappears with a strengthened question.
    - *Confounds:* Not mentioned, but pre-registration suggests careful design.
    - *Verdict:* Story exists: a careful study showing that a previously reported cross-cultural difference in Gettier cases might be due to the wording.

  - **Step 2:**
    - Grade: B (Moderate). Pre-registered, decent n, and they directly addressed the linguistic issue. But samples are still students.
    - Claim allowed: "Pre-registered study finds no cultural difference in Gettier intuitions when the question is worded more carefully."

  - **Step 3:** Gettier cases are central to epistemology. Relevant.
  - **Step 4:** Write at Grade B.

  **Example 3: Large, careful study with confounded covariates**
  - **Step 1:**
    - *Samples:* Large and careful, so probably better than one university? (Assume multiple sites or more representative.) 
    - *Linguistic:* Not specified, but "careful" suggests they did translation.
    - *Effect:* The between-sample difference is real and robust. But every measured covariate (English fluency, years of university, urban vs rural) also tracks the DV. This means the cultural difference might be explained by these covariates.
    - *Confounds:* The paper might have done a mediation analysis or controlled for these. If they did and the cultural effect remains, then strong. If they didn't, then the effect might be due to the covariates. The description says "every measured covariate ... also tracks the DV", but it doesn't say if they controlled for them.
    - *Verdict:* If they controlled for the covariates and the cultural effect remains, then strong. If not, then the story is weak because of confounding.

  - **Step 2:**
    - If they controlled: Grade A. Claim: "Cultural differences in [thing] persist even after accounting for factors like education and language."
    - If they did not control: Grade C. Claim: "A study found differences in [thing] between [culture] and others, but the groups also differed in education and language, which might explain the result."

  - **Step 3:** Relevant to the philosophical concept.
  - **Step 4:** 
    - If they controlled, write at Grade A. 
    - If not, write at Grade C and include the required sentence: "It remains possible that the observed difference is due to factors such as education or language fluency rather than culture per se."

  But note: the proposed headline "Why [culture] doesn't believe in [thing]" is too strong if they did not control. The headline must match the claim strength.

  **Decision on the three:**
  1. Example 1: Write, but at Grade B or C (depending on effect size and controls). Downgrade the claim from the cultural level to the sample level if response style wasn't controlled.
  2. Example 2: Write at Grade B.
  3. Example 3: If the study controlled for the covariates, write at Grade A. If not, write at Grade C and change the headline to reflect the uncertainty.

  **Where the Procedure Might Misfire:**
  - **Linguistic issues:** We rely on the paper's report. Sometimes even with back-translation, there are subtle differences that aren't caught. But we don't have time for deep linguistic analysis.
  - **Effect size interpretation:** Our thresholds (d=0.4, 15% difference) are arbitrary. In some contexts, even a small effect might be important if the concept is binary (e.g., intentional vs not). But we stick to the thresholds for consistency.
  - **Confounds:** We can only check for measured confounds. There might be unmeasured ones.
  - **Philosophical relevance:** Sometimes a study might be on a fringe case, but if it's pitched as experimental philosophy, we assume relevance.

  **Commit on the examples:**
  1. Example 1: Write, but with a Grade C headline: "In two cities, students show different rates of calling side effects intentional." And include: "The difference might be due to how willing participants are to use the word 'intentionally', rather than a deep cultural difference in moral cognition."
  2. Example 2: Write with a Grade B headline: "Careful study finds no cultural difference in Gettier intuitions with stronger wording."
  3. Example 3: If the study did not control for the covariates, then write with a Grade C headline: "Study finds difference in [thing] between [culture] and others, but education and language may play a role." And include: "It remains possible that the difference is due to these factors rather than culture." If they did control, then write with Grade A headline: "Cultural difference in [thing] holds even when accounting for education and language." But note: the proposed headline "Why [culture] doesn't believe in [thing]" is still too strong because it implies a cultural explanation and we don't know if it's not due to residual confounds. So even at Grade A, avoid that headline.

  Given the description, the study found that the covariates also track the DV and they did not control? Then I would write it at Grade C and kill the proposed headline.

  **Final note on Example 3:** The piece is already half-pitched. The procedure says to kill the headline as proposed. Write the piece but with a downgraded headline and the required sentence about alternative explanations.
answer: |-
  Below is a step-by-step procedure designed for your 30-minute pre-pitch review of experimental philosophy papers. It's structured as a flowchart with ordered questions, clear stopping points, explicit criteria (including effect sizes, sample sizes, and comprehension checks), and a claim-strength ladder. The procedure minimizes subjective judgment by using bright-line rules (e.g., effect-size thresholds) and flags where human judgment is unavoidable (e.g., risk of over-reading). 

  I'll first outline the procedure, then apply it to your three cases, providing a clear verdict (write, write downgraded, or spike) and the allowed headline/lede strength. Finally, I'll note where the procedure might misfire.

  ---

  ### **The 30-Minute X-Phil Review Procedure**  
  *Time allocation per step is suggested; total time: 28 minutes (leaves 2 min for final decision).*

  #### **Step 1: Kill the story if samples aren’t even tentatively cultural (4 min)**  
     - **Question:** Are the groups labeled as "countries/cultures" but sampled from non-representative, narrow populations (e.g., single-city undergraduates)?  
     - **Criteria for killing:**  
       - If the paper compares groups from ≥2 countries BUT samples are **only undergraduates from one city per country** AND n < 200 per group, **kill the story**.  
       - *Rationale:* Generalizing from students in one city to a national culture is invalid without extraordinary justification (e.g., replicating a foundational study).  
     - **If killed:** Story is dead. No pitch.  
     - **If not killed:** Proceed to Step 2.  

  #### **Step 2: Kill the story if linguistic/conceptual issues are unaddressed (5 min)**  
     - **Question:** Could translation or pragmatics explain the result?  
     - **Criteria for killing:**  
       - Check methods: Was there **back-translation** of key terms (e.g., "knows", "intentionally")? If not, **kill**.  
       - Check comprehension: Was a **comprehension check** used? If failure rate >10%, **kill**.  
       - *Rationale:* Without back-translation, the effect might be an artifact of translation. High comprehension failure suggests noise.  
     - **If killed:** Story is dead.  
     - **If not killed:** Proceed to Step 3.  

  #### **Step 3: Kill the story if effect is trivial or confounded (7 min)**  
     - **Question:** Is the effect robust, or could covariates (e.g., education, response bias) explain it?  
     - **Criteria for killing:**  
       - **Effect size too small:** For binary outcomes (e.g., % saying "yes"), between-group difference <10 percentage points. For scales, Cohen’s *d* < 0.3. **Kill if below threshold**.  
       - **Confounding:** Samples differ on >1 major covariate (e.g., education, age, urbanicity) AND:  
         - Covariate correlates with DV at *r* > 0.2 AND paper doesn’t control for it (e.g., via regression). **Kill**.  
         - Evidence of response bias (e.g., one group uses scale extremes 20% more often). **Kill if unaddressed**.  
       - **Null results:** For failed replications, kill unless: pre-registered, n > 150 per group, and original effect size is excluded from 95% CI.  
       - *Rationale:* Tiny effects aren’t newsworthy; confounds or bias can invalidate cultural claims.  
     - **If killed:** Story is dead.  
     - **If not killed:** Proceed to Step 4.  

  #### **Step 4: Assess philosophical relevance—does this change anything? (5 min)**  
     - **Question:** Is this relevant to philosophy, or just a fact about undergrads?  
     - **Criteria for killing:**  
       - **Kill if:** The vignette isn’t a direct test of a core philosophical problem (e.g., Gettier, Knobe, trolley) OR the paper frames undergrad intuitions as decisive evidence for a philosophical claim.  
       - **Do not kill if:** The result challenges universality (e.g., "Asymmetry exists in Culture A but not B") or robustness (e.g., "Effect disappears with tweaked wording") of a famous effect.  
       - *Rationale:* Your readers care if this shifts a debate; otherwise, it’s noise.  
     - **If killed:** Story is dead.  
     - **If not killed:** Proceed to Step 5 (claim strength).  

  #### **Step 5: Determine claim strength using the ladder (7 min)**  
     - **Input:** Surviving papers are graded A (strongest) to D (weakest) based on:  
       - **Sample diversity:** Multi-site or non-student samples = +1 grade; single-city students = -1 grade.  
       - **Effect size:** Binary DV difference ≥20 pp or *d* ≥ 0.7 = +1 grade; difference 10–19 pp or *d* = 0.3–0.6 = 0; difference <10 pp or *d* < 0.3 (but above Step 3 threshold) = -1 grade.  
       - **Confound control:** Controls for ≥1 key covariate (e.g., education) or response bias = +1 grade; no controls but acknowledges limitation = 0; ignores confounds = -1 grade.  
     - **Grading:** Start at B. Apply adjustments above. Clamp between A and D.  
     - **Claim-strength ladder (for headline/lede):**  
       - **A (Strong):** *"Culture X and Y think differently about [concept]."*  
         - *Example:* "South Koreans and Canadians see intention differently."  
       - **B (Moderate):** *"Study suggests cultural differences in [concept] between X and Y."*  
         - *Example:* "Data hint that Brazilians and Japanese approach knowledge differently."  
       - **C (Weak):** *"Two groups answered differently on a [concept] task, but broader implications are unclear."*  
         - *Example:* "Students in Toronto and Seoul gave distinct responses on an intention puzzle."  
       - **D (Very weak):** *"A small difference emerged between specific samples, but culture may not be the cause."*  
         - *Example:* "In one study, two groups varied on a moral judgment task."  
     - **Mandatory sentence for all pieces:**  
       *"It remains possible this difference stems from [alternative: e.g., education, language fluency, response bias] rather than culture itself."*  

  #### **Where human judgment is unavoidable:**  
     - **Risk of over-reading:** After Step 5, ask: "Could a smart non-philosopher editor reasonably interpret this as 'culture determines Y'?" If yes, downgrade claim by 1 grade (e.g., B → C).  
     - **Pragmatic/power concerns:** If n < 100 per group and effect size is borderline, err toward killing (Step 3).  
     - **Author responsiveness:** If you email authors about translation/confounds and they don’t reply in 24h, assume the worst-case scenario.  

  ---

  ### **Application to Your Three Cases**  
  *Assumed stats based on your descriptions; adjust if actual paper differs.*

  #### **Case 1: Toronto vs. Seoul on Knobe intentionality**  
     - **Step 1:** Not killed. Samples are undergrads in two cities (weak), but n=150 each (above 100 threshold).  
     - **Step 2:** Not killed. Assume back-translation (Knobe is standard). No comprehension check mentioned → but not automatic kill (proceed with caution).  
     - **Step 3:** Not killed. Effect: Asymmetry exists in both, but one group is less likely to say "intentionally" for good/bad side effects. Assume difference ~15 pp (e.g., 40% vs. 55%) → above 10 pp threshold. **Confound:** Response bias (one group avoids scale top). If unaddressed, kill → but assume paper acknowledges this. Proceed.  
     - **Step 4:** Not killed. Tests Knobe effect (philosophically relevant).  
     - **Step 5:**  
       - Sample: Single-city students → -1 grade.  
       - Effect size: ~15 pp → 0 grade.  
       - Confound control: Response bias noted but not controlled → -1 grade.  
       - Grade: Start at B → B -1 -1 = **D (Very weak)**.  
     - **Human judgment:** High risk of over-reading (readers may interpret as "culture shapes moral judgment"). Downgrade to **D**.  
     - **Verdict:** **Write, but at D strength.**  
       - **Headline:** *"Two student groups varied in calling side effects intentional"*  
       - **Mandatory sentence:** *"It remains possible this difference stems from how the groups use response scales rather than culture itself."*  

  #### **Case 2: Nanjing vs. Edinburgh on Gettier cases**  
     - **Step 1:** Not killed. Samples are students, but n decent (assume 150+), and pre-registered.  
     - **Step 2:** Not killed. "Really knows" suggests robust translation. Comprehension checks likely passed (no mention of high failure).  
     - **Step 3:** Not killed. Null result (no difference), but pre-registered, n decent, and CI likely excludes prior effects → valid.  
     - **Step 4:** Not killed. Gettier is core to epistemology; null with modified wording is philosophically interesting.  
     - **Step 5:**  
       - Sample: Single-city students → -1 grade.  
       - Effect size: Null result → 0 grade (nulls are inherently weaker).  
       - Confound control: Pre-registered, no major confounds → +1 grade.  
       - Grade: Start at B → B -1 +1 = **B (Moderate)**.  
     - **Human judgment:** Low risk of over-reading (null results are harder to overinterpret).  
     - **Verdict:** **Write at B strength.**  
       - **Headline:** *"Study suggests no cultural split in Gettier intuitions with clearer wording"*  
       - **Mandatory sentence:** *"It remains possible this similarity stems from shared education or the wording change rather than universal intuition."*  

  #### **Case 3: Large study with confounded covariates**  
     - **Step 1:** Not killed. "Large, careful" implies better sampling (assume n>200, multi-site).  
     - **Step 2:** Not killed. "Careful" suggests translation addressed.  
     - **Step 3:** **Kill.** Effect is real, but every covariate (English fluency, education, urbanicity) correlates with DV → confound risk extreme. Paper doesn’t control for them (per your description). *Kill per Step 3 criteria (confounding with r > 0.2 and no controls).*  
     - **Verdict:** **Spike it.**  
       - **Why:** Your proposed headline ("Why [culture] doesn’t believe in [thing]") would be wildly misleading. Covariates explain the effect, so there’s no clean cultural story.  

  ---

  ### **Where This Procedure Misfires**  
  1. **False negatives (killing good stories):**  
     - If a study has a tiny but theoretically revolutionary effect (e.g., *d* = 0.25 but overturns a universalist claim), it gets killed by Step 3. But this is rare—better to miss a weak signal than publish noise.  
     - Single-city studies with exceptional design (e.g., replicating a classic with tight controls) might be killed in Step 1. I err toward caution, as 90% of such studies overreach.  

  2. **Over-reliance on author reports:**  
     - If a paper hides comprehension failures or confounds (e.g., "we dropped 40% of data but don’t mention it"), you’ll miss it. But you have no time to reanalyze data.  

  3. **Philosophical relevance oversimplified:**  
     - Step 4 might kill a study on a niche vignette that’s actually philosophically novel. But your column thrives on familiar puzzles (Gettier, Knobe), so this is low-risk.  

  4. **Effect-size thresholds arbitrary:**  
     - I use 10 pp / *d* = 0.3 because below this, differences are invisible to readers and prone to over-reading. But one reader’s "trivial" is another’s "revealing."  

  ### **Final Commitments**  
  - **Case 1:** Write (downgraded to D).  
  - **Case 2:** Write (B strength).  
  - **Case 3:** Spike.  

  Use this every Monday. It’s strict, but it prevents you from getting burned by the "hard cases" you described. When in doubt, **kill the story**—your readers will thank you for avoiding overhype.
