  **MINUTES OF THE FACULTY SENATE MEETING**  
  **October 27, 2023 | 3:00 PM | University Hall, Room 304**

  **I. Attendance**  
  Present: Chair Prof. Ainsworth (History), Vice-Chair Prof. Brennan (Mathematics), Secretary Dr. Chen (Linguistics), and 38 Senators. Absent: 7 Senators (excused). Quorum established.

  **II. Approval of Minutes**  
  Minutes of October 13, 2023, were approved without amendment.

  **III. Old Business**  
  None.

  **IV. New Business**

  **4.1 Curriculum Requirement Suspension (Item #23-C.17)**  
  *   **4.1.1 Premise A:** "Enrollment in the core language requirement (LANG 101) has fallen below the 5-year historical average threshold as defined in Senate Policy 7.8b."  
      *Vote: 24 Aye, 12 Nay, 8 Abstain. Motion to accept Premise A carried.*  
  *   **4.1.2 Premise B:** "If enrollment in the core language requirement falls below the 5-year historical average threshold, the requirement shall be suspended for the next academic year (per Senate Policy 7.8b)."  
      *Vote: 26 Aye, 10 Nay, 8 Abstain. Motion to accept Premise B carried.*  
  *   **4.1.3 Conclusion:** "Therefore, the core language requirement is suspended for the 2024-2025 academic year."  
      *Vote: 10 Aye, 28 Nay, 6 Abstain. Motion to adopt the Conclusion failed.*  
  *   **Chair's Ruling:** Chair Ainsworth observed that Premise A and Premise B having been accepted by majority vote, the Conclusion necessarily follows as a matter of logical entailment under Senate Procedural Rule 5.1(a) (Premise-Based Aggregation). The suspension of the language requirement for 2024-2025 is therefore adopted.  
  *   **Senator Thorne (Philosophy) Objection:** Senator Thorne objected that a clear majority (28 votes) had explicitly rejected the Conclusion.  
  *   **Chair's Response:** The Chair ruled the objection out of order. Rule 5.1(a) specifies that the Conclusion is derived from the accepted premises; the direct vote on the Conclusion is advisory only and does not override the logical derivation. The ruling stands.

  **4.2 Budget Reallocation for Language Department (Item #23-B.9)**  
  *   **4.2.1 Premise:** "Enrollment in the core language requirement (LANG 101) has fallen below the 5-year historical average threshold as defined in Senate Policy 7.8b." *(Identical to Item 4.1.1 Premise A)*  
      *Vote: 8 Aye, 30 Nay, 6 Abstain. Motion to accept the Premise failed.*  
  *   **4.2.2 Conclusion:** "Therefore, $50,000 shall be reallocated from the General Fund to the Department of Modern Languages for targeted recruitment initiatives."  
      *Vote: (Not taken, as Conclusion contingent on failed Premise).*  
  *   **Chair's Ruling:** The motion fails as the necessary factual premise was not accepted.

  **4.3 Report: Governance Committee on Voting Procedures (GC-23-4)**  
  Prof. Delgado (Physics), Committee Chair, presented the report. Key findings:
  1.  The Senate has employed four distinct aggregation methods: Conclusion-Based Voting (pre-2023), Premise-Based Voting (Rule 5.1(a)), Sequential Priority Voting (trial, Spring 2023), and Expert Panel Referral (trial, Fall 2023).
  2.  Analysis confirms no aggregation method simultaneously satisfies all five core Senate desiderata:
      *   (i) Admissibility of any combination of individual judgments.
      *   (ii) Equal weight per Senator on each question.
      *   (iii) Decidability of each question based solely on votes cast on that question.
      *   (iv) Unanimous judgment of the Senate always prevails.
      *   (v) Logical consistency of the resulting Senate position.
  3.  The Committee notes that vesting final decision authority in a single individual (e.g., the Chair) satisfies (i), (ii), (iv), and (v), but was rejected by the Committee as incompatible with desideratum (iii) and broader principles of shared governance (non-logical grounds).
  4.  **Recommendation:** Empower the Senate Chair, for each agenda item, to designate which one of the five desiderata listed above may be set aside for that item's resolution. This provides flexibility while adhering to core principles where possible.

  **Motion:** To accept the Governance Committee Report GC-23-4 and adopt its recommendation regarding Chair designation authority.  
  *Vote: 28 Aye, 14 Nay, 2 Abstain. Motion carried.*

  **4.4 Proposal: Implementation of Bundled Resolution Format (Item #23-P.2)**  
  Prof. Kim (Computer Science) moved the adoption of a Bundled Resolution format for complex or logically interconnected matters, as a practical implementation solution identified during discussion of the Governance Report.
  *   **Rationale:** Bundling fuses logically interdependent propositions (factual premises, conditional principles, specific actions, budgetary figures) into a single, compound resolution requiring a single Yes/No vote. This eliminates potential for internal inconsistency within a single agenda item, as all elements stand or fall together.
  *   **Example Bundle:** "Resolved: That enrollment in French language courses has declined by 15% compared to 2019; that equity considerations demand immediate intervention for under-enrolled programs; and that $75,000 shall be transferred from the College of Business contingency fund to the Department of Modern Languages for curriculum development in French."
  *   **Motion:** To adopt the Bundled Resolution format as an optional procedure, at the discretion of the Agenda Committee, effective immediately.  
      *Vote: 30 Aye, 12 Nay, 2 Abstain. Motion carried.*
  *   **Senator Thorne (Philosophy) Objection:** Senator Thorne argued that this procedure constitutes an abdication of the Senate's deliberative function. "We are not deciding discrete questions based on reasoning and evidence; we are merely ratifying pre-drafted bundles. The substantive authority shifts entirely to the drafter of the bundle. The Senate, as a collective body holding beliefs about the world and our duties, ceases to perform its function."  
  *   **Chair's Response:** The Chair observed that the motion adopting the Bundled Resolution format had been duly carried. The objection pertained to the substance of the adopted rule, not its procedural application, and was noted for the record. Further discussion required a new motion, which was not forthcoming.

  **V. Adjournment**  
  Meeting adjourned at 5:17 PM.

  **Respectfully Submitted,**  
  Dr. L. Chen, Secretary, Faculty Senate

