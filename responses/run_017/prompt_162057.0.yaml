  **MEMORANDUM**

  **TO:** Faculty Senate Members  
  **FROM:** Elias Vance, University Parliamentarian  
  **DATE:** October 28, 2023  
  **SUBJECT:** Clarification on Contextual Validity of Premise Determinations

  Several inquiries have arisen concerning the Senate's handling of identical factual premises yielding contradictory acceptances (Item 4.1 Premise A accepted; Item 4.2 Premise rejected). This memorandum clarifies the procedural foundation.

  Senate Procedural Rule 5.1(a) (Premise-Based Aggregation) operates on the principle of **Exhausted Specificity**. A vote on a premise constitutes a judgment *relative solely to the specific motion and its logical context* as presented within that discrete agenda item. The premise "Enrollment in LANG 101 has fallen..." in Item 4.1 was embedded within a conditional structure concerning *suspension of a requirement*. In Item 4.2, the identical premise was embedded within a structure concerning *budget reallocation*.

  The Senate's determination on the premise is thus *exhausted by* the question then before it. It reflects the collective judgment *under the specific framing and implications* of that item. A premise is not a free-standing, context-independent factum established for all Senate purposes by a single vote. Each presentation of a premise, even linguistically identical, constitutes a distinct *proposition-in-context* requiring its own determination based on the votes cast at that time, pertaining only to that specific logical chain.

  This ensures adherence to desideratum (iii): each question is decided solely on the votes cast *on that question*. Consistency *across* agenda items is not a requirement under Rule 5.1(a) and, as the Governance Committee report elucidates, cannot be guaranteed under any aggregation method satisfying the core desiderata simultaneously. The Exhausted Specificity principle maintains procedural integrity within each item while acknowledging the contextual nature of collective determinations. The alternative – binding future decisions by past votes on contextually distinct propositions – would violate desideratum (iii) and introduce rigidity contrary to deliberative practice.

  E. Vance  
  University Parliamentarian
