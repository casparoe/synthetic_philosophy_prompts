answer: |-
  Here is a detailed assessment of the student's answer, following your requirements:

  ### Overall Mark: **3/20** (Band: F / Fail)  
  *(Part (a): 0/8, Part (b): 3/12)*  

  ---

  ### Part (a) Assessment (0/8)  
  **Student's Claims:**  
  1. *"A spandrel is a trait that natural selection built for one function and that was later co-opted for a different one."*  
     - **Verdict: Wrong** (High Confidence).  
     - **Reason:** Gould and Lewontin explicitly define spandrels as **architectural by-products** of selection acting *elsewhere*, not as traits "built for" any function. The San Marco spandrels were structural necessities of the arches/dome, not designed for decoration. The student inverts the core concept by implying spandrels have an original function.  

  2. *"A spandrel is defined by a mismatch between the role a feature was built for and the role it currently plays."*  
     - **Verdict: Wrong** (High Confidence).  
     - **Reason:** Spandrels **lack an original function**; they are "non-adaptive" by-products (Gould & Lewontin, 1979, p. 581). The "mismatch" framing misrepresents the critique.  

  3. *"A secondarily captured trait is plainly a spandrel."*  
     - **Verdict: Wrong** (High Confidence).  
     - **Reason:** Secondary capture begins with a trait that **has no original function** (an architectural by-product). Spandrels are defined as such by-products *before* any co-option. Secondary capture describes a *process* that may start with a spandrel but evolves beyond it.  

  **What Was Needed for Full Marks:**  
  - Correct definition: A spandrel is **an architectural by-product of selection acting on another trait**, initially non-functional (e.g., San Marco spandrels as unavoidable geometric spaces).  
  - Correct comparison: Secondary capture **begins** with a spandrel (the by-product phase) but **ceases to be a spandrel** once selection modifies it for a new function. The student conflates origin with later stages.  

  ---

  ### Part (b) Assessment (3/12)  
  **Student's Core Argument:**  
  > *"The argument quoted in the question is essentially correct... secondary capture dissolves Gould and Lewontin's distinction... because exaptation followed by selection is just adaptation."*  
  - **Verdict: Partially right but misses the critique's crux** (Medium Confidence).  
  - **Partial Credit (3/12):**  
    - Correctly notes that secondary capture allows the trait's *present form* to be shaped by selection for current use (+2).  
    - Correctly identifies that the *origin* is not under selection for current function (+1).  
  - **Critical Errors:**  
    1. **Misrepresents Gould & Lewontin's burden of proof:**  
       - Student: *"The burden has moved to the critic, who must show the trait is still only a by-product."*  
       - **Reality:** G&L demand that adaptationists **test and exclude non-selective origins** (e.g., by-products, constraints) *before* asserting a trait was *built by* selection for its current role. The burden is on the adaptationist, not the critic.  
       - **Verdict: Wrong** (High Confidence).  

    2. **Misstates G&L's claim about testability:**  
       - Student: *"Stories about a trait's origin cannot be tested at all."*  
       - **Reality:** G&L argue origins *can* be tested by comparing alternative hypotheses (e.g., constraint vs. selection). Their critique is that adaptationists **fail to test** these, not that testing is impossible.  
       - **Verdict: Wrong** (High Confidence).  

    3. **Ignores the key distinction:**  
       - Student conflates *current maintenance/modification* by selection with *original construction* for a function.  
       - **G&L's requirement for origin:** To accept a selective *origin*, adaptationists must show the trait **arose directly as an adaptation** for its current (or ancestral) function, not as a by-product later co-opted. Secondary capture explicitly violates this.  
       - **Verdict: Misunderstands the assignment** (High Confidence).  

  **What Was Needed for Full Marks:**  
  - Acknowledge that secondary capture *does* refute the claim that a trait's *current form* must reflect its origin.  
  - Emphasize that G&L’s critique targets adaptationists who **assume a trait's origin was selective** without testing against by-product hypotheses (like early-stage secondary capture).  
  - State G&L’s requirement: To accept a selective origin, adaptationists must show the trait **originated as an adaptation for a function** (current or ancestral), not that it was later modified.  

  ---

  ### Additional Issues Flagged  
  1. **Misuse of San Marco Example (a):**  
     - Student claims the spandrels were "built for" a job. This contradicts G&L: the spandrels are **by-products** of the dome/arches, not designed features.  
     - **Impact:** Undermines the entire definition (0 credit for part (a)).  

  2. **Uncharitable Phrasing (b):**  
     - *"The critique therefore survives only as a quibble about historical priority."*  
     - **Verdict:** Uncharitable but not factually wrong. G&L *do* care about historical origins, but their main point is methodological (testing alternatives). Would mark this as hyperbolic but not deduct further.  

  3. **Conflation in (b):**  
     - Student claims secondary capture makes the trait "an adaptation now." This is true *only* for its **modified form**, not its origin. However, they use this to dismiss the critique, ignoring that G&L’s target is often **untested assumptions about origins**.  

  ---

  ### Confidence Assessment  
  - **Highest Confidence (5/5):**  
    - Part (a) spandrel definition is inverted and incorrect.  
    - Part (b) misplaces burden of proof on critics (not adaptationists).  
  - **Moderate Confidence (4/5):**  
    - Student’s claim that G&L think origins "cannot be tested" is false.  
  - **Lowest Confidence (3/5):**  
    - Whether to award partial credit in (b) for recognizing current selection’s role. The student undercuts this by dismissing historical analysis, but the point itself is valid.  

  **Weakest Point:** Awarding 3/12 for part (b). The student grasps *current* selection’s role but misapplies it to invalidate the entire critique. A stricter grader might give 1-2/12.  

  ---

  ### Recommended Feedback to Student  
  > *(a) Your definition of a spandrel incorrectly assigns it an original function. Spandrels are by-products of selection on *other* traits (e.g., San Marco spandrels are geometric necessities, not designed). A secondarily captured trait *starts* as a spandrel (by-product) but evolves beyond it.  
  >   
  > (b) You correctly note that selection can modify a secondarily captured trait for current use. However, Gould & Lewontin’s critique requires adaptationists to *test whether the trait originated as a by-product* before claiming it was *built by* selection for its function. Secondary capture exemplifies a non-adaptive origin, so the critique retains force. The burden of proof remains on adaptationists to rule out by-product hypotheses.*  

  This answer confuses *current utility* with *historical origin* and misrepresents the methodological core of the spandrels critique. The strong prose masks fundamental misunderstandings.
