prompt: |-
  I am a novelist, and the book I am drafting turns repeatedly on a family of devices in which a character truthfully announces, in advance, that something will happen at a moment its hearers will not see coming. A headmistress warns her staff of exactly one inspection during a five-day week, adding that on the evening before it they will not know which morning it is. A blackmailer names a thirty-day window in which a letter will be posted, and undertakes that on the morning of the day it goes out the mark still will not be able to work out whether today is the day. An autonomous system, on a run with no scheduled end, tells its operator that it will refuse one of his commands at a moment he cannot predict. These are all variants of the surprise-exam announcement, and readers who know the paradox keep writing to ask whether such scenes can be coherent at all — whether the announcement can be true, believed, believed to be true, and still surprising when it lands, or whether my characters are simply failing to draw a conclusion that is sitting there to be drawn. I cannot tell which of my devices is which.

  What I want is a procedure, not an essay: something I can run on each new device in ten minutes, with the questions in order, what would count as a sufficient answer to each, the point at which it returns a verdict of no, this cannot work, and the point at which it hands the decision back to me because the open question is one about what I want the scene to mean rather than about whether it is consistent. Please say which distinctions have to survive the simplification, and correct me where I have the wrong ones. My own guesses are that it matters whether the window of days is fixed and known in advance, whether surprising means not deducible from the announcement or merely not expected, whether the speaker guarantees that the thing happens at all rather than saying that it may, and whether the hearers are entitled to trust the speaker — and also, I suspect crucially, whether the speaker knows the date herself or is only passing on what she was told, since an announcement that reports someone else's decision seems to behave quite differently under the backward induction. Tell me if any of that is beside the point, and whether some distinction I have not thought of is doing more work than these.

  Then run the procedure on the three devices above, and on a fourth: the headmistress genuinely does not know which morning the inspectors are coming, having been told only that it will be one of the five. I would rather be told plainly that the open-ended device works only because I want the scene, if that is the case. Include at least one verdict that costs me a device I am attached to, and finish by saying what the procedure cannot tell me — in particular whether a device that survives it is dramatically any good, or whether a reader who has heard of the paradox will feel cheated by a scene the procedure passes.
reasoning: |-
  We are going to design a procedure to test the coherence of surprise announcement devices in a narrative context. The goal is to determine if an announcement can be true, believed, believed to be true, and still surprising when the event happens.

  Key distinctions that must be considered (as per the user and additional insights):

  1. **Fixed and Known Window**: The set of possible days (or moments) is fixed and known in advance by the hearers.
  2. **Meaning of "Surprising"**: 
     - **Strong Surprise (deducible)**: The event cannot be deduced in advance (on the morning of the event, the hearers cannot logically deduce that the event must occur that day).
     - **Weak Surprise (expected)**: The event is not subjectively expected (it might be deducible but the hearers don't realize it, or they assign low probability).
  3. **Guarantee of Occurrence**: The speaker guarantees that the event will definitely happen (as opposed to saying it might happen).
  4. **Trust in the Speaker**: The hearers trust the speaker and believe the announcement to be true.
  5. **Speaker's Knowledge**:
     - **Informed Speaker**: The speaker knows the exact date of the event.
     - **Uninformed Speaker**: The speaker does not know the exact date (e.g., they are relaying information from another source).

  Additionally, we note that the classic surprise exam paradox hinges on backward induction, which relies on a fixed finite window and a strong notion of surprise (deducibility). The paradox shows that if the announcement is believed, then the event cannot occur on the last day (because then on the previous evening the hearers would know it must be the last day), and then by backward induction, it cannot occur on the penultimate day, and so on. Thus, the announcement seems impossible to satisfy. However, in practice, the paradox is resolved by noting that the surprise might still occur if the backward induction is not performed by the hearers (e.g., due to lack of common knowledge or logical omniscience) or by redefining the conditions.

  But for our procedure, we want to check for logical consistency (can the announcement be true and the event still be a surprise?).

  The procedure:

  We will ask a series of questions. The order is designed to quickly eliminate scenarios that are clearly impossible and then to address the nuances.

  **Procedure Steps**:

  1. **Is the event guaranteed to happen?** 
     - If the announcement only says the event *may* happen (without guarantee), then there is no paradox: the event can happen as a surprise because it might not happen at all. 
     - *Sufficient answer*: The announcement must guarantee that the event will definitely occur within the window. If not, then the scenario is coherent (return: **coherent**). Otherwise, proceed.

  2. **Is the window of possible days fixed and known in advance?**
     - If the window is not fixed (e.g., it might change) or not known in advance, then backward induction cannot be applied (because the set of days is not fixed). 
     - *Sufficient answer*: The window must be fixed and known in advance for the paradox to even arise. If not, then the scenario is coherent (return: **coherent**). Otherwise, proceed.

  3. **Is the window finite?**
     - If the window is infinite (or unbounded) then backward induction cannot be applied (because there is no last day to start the induction). 
     - *Sufficient answer*: If the window is infinite, then the scenario is coherent (return: **coherent**). If finite, proceed.

  4. **What is the meaning of "surprising" in the context?**
     - We need to distinguish between:
          (a) Strong surprise: On the morning of the event, the hearers cannot deduce from the announcement and the fact that the event hasn't occurred yet that it must occur that day.
          (b) Weak surprise: The hearers do not expect the event (subjectively, perhaps due to not performing the deduction or assigning low probability).
     - *Sufficient answer*: 
          - If the intended surprise is weak (i.e., not about logical deduction but about subjective expectation), then the scenario is coherent (return: **coherent**). 
          - If the intended surprise is strong (logical deduction), then we must check the backward induction. Proceed to step 5.

  5. **Does the speaker know the exact date?**
     - *Sufficient answer*: 
          - If the speaker does not know the exact date (and is merely relaying information), then the announcement might be made in a way that does not provide the hearers with enough information to perform the backward induction (because the speaker's own lack of knowledge breaks the chain of reasoning). In this case, the scenario is coherent (return: **coherent**). 
          - If the speaker knows the exact date, then we have the full force of the paradox. Proceed to step 6.

  6. **Apply backward induction to the finite fixed window with strong surprise and informed speaker.**
     - For a window of N days, the backward induction argument shows that the event cannot occur on day N (because on the evening of day N-1, if the event hasn't happened, the hearers would know it must be on day N). Then, knowing it cannot be on day N, they would on day N-1 morning know that if it hasn't happened by day N-2, then it must be on day N-1 (because day N is eliminated) — but then it wouldn't be a surprise on day N-1. And so on, eliminating all days.
     - *Sufficient answer*: For a finite fixed window with strong surprise and an informed speaker, the backward induction argument shows that the announcement cannot be true (unless N=0, which is trivial). Therefore, the scenario is **incoherent** (return: **incoherent**).

  **Important**: If at any step the conditions are not met, we return **coherent** and exit. Only if we reach step 6 do we return **incoherent**.

  **What the procedure cannot tell us**:
  - It cannot tell if a scenario that is logically coherent (by avoiding the paradox) is dramatically effective.
  - It cannot tell if a reader familiar with the paradox will feel cheated by a scenario that uses weak surprise or an uninformed speaker to avoid the paradox. That depends on the reader and the execution.

  Now, let's run the procedure on the four examples:

  **Example 1: Headmistress**
  - Announcement: One inspection during a five-day week, and on the evening before it, the staff will not know which morning it is.
  - Conditions:
    1. Event guaranteed? Yes.
    2. Window fixed and known? Yes (5 days).
    3. Window finite? Yes.
    4. Surprise meaning: Strong (they will not know, meaning cannot deduce).
    5. Speaker's knowledge: We are not told. But in the initial description, the headmistress is the one making the announcement. The fourth example clarifies that she might not know. For this first example, we assume she knows? Actually, the fourth example is a variant. So for the first one, we must assume we don't know. But the procedure must be run on the given description. Since the example does not specify the headmistress's knowledge, we must assume the default: she knows? However, the procedure requires that we ask. But in the initial description, it's not stated. So we should note that without information we might have to assume she knows (as the one making the announcement). Alternatively, we can run two versions.

  But the user says: "the headmistress warns her staff" — without specifying if she knows. So we proceed with the information we have.

  Running the procedure:

  1. Guaranteed? Yes -> proceed.
  2. Fixed window? Yes -> proceed.
  3. Finite? Yes -> proceed.
  4. Surprise? Strong ("will not know" implies deduction) -> proceed.
  5. Speaker's knowledge? Not specified. But the procedure requires an answer. Since the example does not say she doesn't know, we assume she does (as the head of the school, she might be expected to know). Therefore, we assume she knows -> proceed to step 6.
  6. Backward induction: For 5 days, backward induction eliminates all days. So the announcement cannot be true. Verdict: **incoherent**.

  But note: the user has a fourth example where the headmistress does not know. So we must run that separately.

  **Example 2: Blackmailer**
  - Announcement: A thirty-day window, the letter will be posted on one day, and on the morning of the day it goes out, the mark will not be able to work out whether today is the day.
  - Conditions:
    1. Guaranteed? Yes.
    2. Fixed window? Yes (30 days).
    3. Finite? Yes.
    4. Surprise meaning: Strong ("will not be able to work out" implies deduction).
    5. Speaker's knowledge: The blackmailer is making the announcement and presumably knows the date (since they are the ones who will post the letter). So they know. -> proceed to step 6.
    6. Backward induction: For 30 days, backward induction eliminates all days. Verdict: **incoherent**.

  **Example 3: Autonomous system**
  - Announcement: On a run with no scheduled end, it will refuse one command at a moment the operator cannot predict.
  - Conditions:
    1. Guaranteed? Yes (it will refuse one command).
    2. Fixed window? The run has no scheduled end, so the window is unbounded (infinite). -> Step 3: Window finite? No (infinite). Therefore, we return **coherent** at step 3.

  **Example 4: Headmistress variant**
  - The headmistress genuinely does not know which morning the inspectors are coming, having been told only that it will be one of the five.
  - Conditions:
    1. Guaranteed? Yes.
    2. Fixed window? Yes (5 days).
    3. Finite? Yes.
    4. Surprise meaning? Strong (same as example 1: they will not know).
    5. Speaker's knowledge: The headmistress does not know the exact date. Therefore, we return **coherent** at step 5.

  **Results**:

  - Example 1 (headmistress, assumed to know): **incoherent** (we lose this device)
  - Example 2 (blackmailer): **incoherent** (we lose this device too)
  - Example 3 (autonomous system): **coherent**
  - Example 4 (headmistress uninformed): **coherent**

  The user requested at least one verdict that costs a device they are attached to. We have two: the headmistress (if she knows) and the blackmailer.

  **What the procedure cannot tell us**:

  - It cannot tell if a device that is logically coherent (like the autonomous system or the uninformed headmistress) is dramatically effective. For instance, in the autonomous system case, the operator might still be surprised because they cannot predict the moment, but a reader familiar with the paradox might question why the operator doesn't perform the backward induction (if they think about the future as potentially infinite, they might not). The narrative must handle this.

  - Similarly, for the uninformed headmistress, the announcement is consistent, but the staff might still try to perform backward induction. However, because the headmistress does not know the date, she cannot be providing information that the staff can use to deduce the date (since she doesn't know it). Therefore, the staff cannot use the announcement to deduce the date. This breaks the backward induction.

  - It also cannot tell if the reader will feel cheated. A reader who knows the paradox might expect the strong surprise condition and an informed speaker, and if the narrative uses an uninformed speaker to avoid the paradox, they might feel it's a cop-out. Alternatively, if the narrative establishes that the speaker is uninformed, it might be satisfying.

  **Conclusion**:

  The procedure is a decision tree that quickly checks the key conditions that lead to the paradox. It returns **incoherent** only in the case of a finite fixed window, strong surprise, and an informed speaker. All other cases are **coherent**. 

  The user must then decide if the coherent cases are dramatically satisfying and if the reader will accept the conditions (like an uninformed speaker or an infinite window). The procedure cannot answer those subjective questions.
answer: |-
  Below is a step-by-step procedure to evaluate the coherence of "surprise announcement" devices in your narrative. It focuses on logical consistency—whether the announcement can be true, believed, and still result in genuine surprise—while flagging scenarios where dramatic effectiveness or reader perception might be at risk. The procedure is designed for efficiency (under 10 minutes per device) and prioritizes key distinctions that determine if the paradox invalidates the device. 

  ### Key Distinctions That Must Survive Simplification
  1. **Fixed and known window**: The set of possible days/moments for the event must be predetermined and known to the hearers. If not, backward induction (the core of the paradox) collapses.  
  2. **Guaranteed occurrence**: The announcement must state the event **will** happen (not "might" happen). Without a guarantee, surprise is trivially possible.  
  3. **Strong vs. weak surprise**:  
     - **Strong surprise (deducibility)**: The event cannot be deduced in advance from the announcement and prior knowledge.  
     - **Weak surprise (subjective unexpectedness)**: The event is merely not anticipated (e.g., due to probability, psychology, or imperfect reasoning).  
     Devices relying on weak surprise are always coherent but dramatically fragile.  
  4. **Speaker knowledge**:  
     - **Informed speaker**: The speaker knows the exact date of the event.  
     - **Uninformed speaker**: The speaker does not know the date (e.g., relaying third-party information).  
     This is critical—uninformed speakers bypass the paradox.  
  5. **Hearer trust**: The hearers must believe the announcement is truthful. If trust is absent, surprise is possible but dramatically uninteresting.  

  #### Distinctions You Mentioned That Are Less Relevant
  - "Whether the speaker guarantees it happens" is covered under **guaranteed occurrence**.  
  - "Whether hearers trust the speaker" is binary: if trust is lacking, the device "works" trivially (but isn't engaging). We assume trust unless specified.  
  - "Whether the speaker knows the date" is **vital** (as you suspected) and built into the procedure.  

  #### Distinction You Underemphasized
  - **Finiteness of the window**: Infinite/unbounded windows (e.g., "no scheduled end") prevent backward induction and resolve the paradox.  

  ---

  ### The Procedure: 6 Questions for Coherence
  Run these in order. Stop and return a verdict if any answer matches the **bolded exit condition**.  

  1. **Is the event guaranteed to happen?**  
     - If **no** (e.g., "may happen"), surprise is trivially possible → **Coherent (but dramatically weak)**.  
     - If **yes**, proceed.  

  2. **Is the window of possible moments fixed and known to the hearers in advance?**  
     - If **no** (e.g., the window shifts unexpectedly), backward induction fails → **Coherent**.  
     - If **yes**, proceed.  

  3. **Is the window finite?**  
     - If **no** (e.g., unbounded/infinite), backward induction fails → **Coherent**.  
     - If **yes**, proceed.  

  4. **What type of "surprise" is specified?**  
     - If **weak surprise** (e.g., "won't expect it," "feel unprepared"), the device works → **Coherent (but paradox-aware readers may protest)**.  
     - If **strong surprise** (e.g., "cannot deduce it," "will not know"), proceed.  

  5. **Is the speaker uninformed?**  
     - If **yes** (speaker does not know the event date), backward induction fails → **Coherent**.  
     - If **no** (speaker knows the date), proceed.  

  6. **Apply backward induction**:  
     - For a window of *N* days, the event cannot occur on day *N* (hearers would deduce it on day *N-1*). Iterating backward, it cannot occur on any day.  
     - → **Incoherent: Announcement cannot be true.**  

  ---

  ### Application to Your Devices
  #### Device 1: Headmistress (5-day week, strong surprise)  
  - **Guaranteed?** Yes (one inspection).  
  - **Fixed/known window?** Yes (5 days).  
  - **Finite?** Yes.  
  - **Surprise type?** Strong ("will not know which morning").  
  - **Speaker uninformed?** Unspecified. **Assume informed** (default for authority figures).  
  - **Backward induction?** Eliminates all days → **Incoherent**.  
  **Verdict**: Fails. Device cannot work if headmistress knows the date.  

  #### Device 2: Blackmailer (30-day window, strong surprise)  
  - **Guaranteed?** Yes (letter will be posted).  
  - **Fixed/known window?** Yes (30 days).  
  - **Finite?** Yes.  
  - **Surprise type?** Strong ("will not be able to work out").  
  - **Speaker uninformed?** No (blackmailer chooses the date).  
  - **Backward induction?** Eliminates all days → **Incoherent**.  
  **Verdict**: Fails. Costs you this device.  

  #### Device 3: Autonomous System (no scheduled end, strong surprise)  
  - **Guaranteed?** Yes (will refuse one command).  
  - **Fixed/known window?** Yes (all future moments).  
  - **Finite?** **No** (unbounded run). → Exit at Q3: **Coherent**.  
  **Verdict**: Works. No backward induction possible.  

  #### Device 4: Headmistress Variant (uninformed, strong surprise)  
  - **Guaranteed?** Yes.  
  - **Fixed/known window?** Yes (5 days).  
  - **Finite?** Yes.  
  - **Surprise type?** Strong ("will not know").  
  - **Speaker uninformed?** **Yes** (headmistress doesn't know the date). → Exit at Q5: **Coherent**.  
  **Verdict**: Works. Uninformed speaker breaks the paradox.  

  ---

  ### What the Procedure Cannot Tell You  
  1. **Dramatic effectiveness**: A device can be logically coherent but dramatically flawed.  
     - Example: *Uninformed speaker* (Device 4) is consistent, but readers may feel the headmistress's lack of knowledge undermines tension.  
     - Example: *Weak surprise* avoids paradox but may feel like cheating to paradox-aware readers.  
  2. **Reader perception**: Paradox-literate readers may reject:  
     - **Strong surprise with finite window**: Even if coherent (e.g., uninformed speaker), they may *expect* backward induction and feel misled if it's not addressed.  
     - **Infinite windows**: Some readers may still *attempt* backward induction on a subjective "likely window," causing dissonance.  
  3. **Nuances in character reasoning**: The procedure assumes rational hearers. If hearers are irrational, overwhelmed, or distrustful, surprise is easier—but this may not serve your theme.  

  #### Recommendations for Salvaging Devices  
  - **Blackmailer (Device 2)**: Make the blackmailer *uninformed* (e.g., "I’ll post it when I feel safe, but even I won’t know until morning"). This passes Q5.  
  - **Headmistress (Device 1)**: Use weak surprise (e.g., "you’ll be on edge, never sure when") or an unbounded window (e.g., "sometime this term").  

  --- 

  ### Final Output  
  - **Coherent devices**: Autonomous system (infinite window), Headmistress variant (uninformed speaker).  
  - **Incoherent devices**: Original headmistress (informed), Blackmailer (informed).  
  - **Cost to you**: The blackmailer device (as stated) is lost.  

  Use this to pre-test new devices. For coherent cases, enhance dramatic plausibility by:  
  - Acknowledging the paradox in dialogue (e.g., a character says, "Wait, isn’t this like that exam riddle?").  
  - Justifying why backward induction fails (e.g., "The system’s logic is too alien for deduction").  
  - Emphasizing subjective stakes over logic (e.g., "I knew it *could* be today, but I didn’t *feel* it").  

  This balances rigor with narrative flexibility—the rest is your artistry.
