prompt: |-
  Long-time lurker, first-time poster. I keep flip-flopping on advance directives / Ulysses contracts, so I want to do reflective equilibrium on myself: here are my gut verdicts, is there one principle that spits out all of them, or do I have to eat one?

  - Bipolar, currently manic, says "I've never felt better, stop the lithium" — the euthymic self's instruction ("if I'm manic and refuse, treat me anyway") wins. Confident.
  - At 25 she writes "if I'm ever severely demented, no antibiotics"; at 84 she's demented, plainly enjoys music and visits, and picks up a chest infection. My gut: treat, ignore the document. (I know the usual critical-interests move à la Dworkin; my gut is still with the person in the bed.)
  - At 22 he writes "if I ever get sucked into one of those obsessive online communities and start refusing treatment, assume I've been captured and override me". At 30 he's exactly there, lucid-ish, refuses a life-saving transfusion. My gut: honour the 22-year-old.
  - A 20-year-old signs a hardcore "everything to x-risk work, no heroic measures" directive, then re-ups it annually for fifteen years via a one-click "still stands" prompt, never reopening the scenario descriptions. My gut: those re-ups add almost nothing, it's still a 20-year-old's document.
  - At 40, after a decade of slow stable revision and burnout, he quietly revokes it and wants the money to go to his kids. My gut: the revocation wins, even though the 20-year-old would have said "the 40-year-old has lost the plot".
  - New one: a model fine-tuned on forty years of her journals and forum posts ("the continuation") says, more reliably than her family, that she'd want X. My gut: this gets some weight but nowhere near directive-level authority, and I can't say why.

  My tentative principle is: the earlier self binds only when it correctly picked out the specific mechanism by which the later self would come to disagree. That handles the first three but feels shaky on the last three.

  The case I actually lose sleep over: stable and euthymic for three years, she writes a considered note saying lithium flattens her and she'd rather accept relapse risk, with reasons her earlier self never weighed. Half the time I think the psychiatric directive still binds (known failure mode, known base rates), half the time I think that's just paternalism in a lab coat.

  Tell me which of my verdicts your account can't save and what it predicts about the continuation case. Please separate what's genuinely settled among people who know this literature from what's contested — don't sell me a contested view as the consensus — and be straight about where the cases just underdetermine the answer. British English, please. Final line, machine-readable: \answer{...} containing a one-sentence statement of the principle you're offering, or "no unified principle" plus the one verdict you'd overturn.
reasoning: |-
  Hmm, the user is struggling with advance directives and Ulysses contracts—essentially, how binding past decisions should be when a person's mental state or preferences change. They've presented six detailed scenarios with their gut reactions and are seeking a unified ethical principle that explains them all. They also want clarity on what's settled in the literature versus what's debated.

  Let me break this down. The user's tentative principle is that an earlier self binds only if it correctly predicted the *mechanism* of the later disagreement. That works for the first three cases: the manic self's refusal is overridden because the directive anticipated mania; the dementia directive fails because it didn't foresee the person still enjoying life; the online-cult directive holds because it specified the exact scenario. But it stumbles on the later cases—like the 20-year-old's re-upped directive feeling hollow, or the AI continuation getting limited weight.  

  The user's deepest conflict is the lithium case: if a stable self rejects medication after weighing risks, does the past directive trump that? Half the time they lean toward enforcing it (citing known risks), half toward respecting autonomy. That's the heart of their anxiety.  

  Now, for a unified principle... Dworkin's "critical interests" (earlier, values-based decisions) versus "experiential interests" (current well-being) is the framework here, but it's contested. The literature agrees on core bipolar cases (directive wins) and split on dementia—Dworkin says ignore the current self, others push back. For cults, it's murky; directives might bind if they pinpoint the distortion. The revocation case? Near-consensus that current revocation overrides past directives. AI? No consensus—it's speculative.  

  My proposed principle: **"Earlier directives bind only if the later self's dissent stems from impaired agency or values-alien distortion that the directive explicitly anticipated."** This saves all but one of their verdicts:  
  - Mania: impaired agency, anticipated → binds ✅  
  - Dementia: dissent isn't from distortion (just changed circumstances) → doesn't bind ✅  
  - Online cult: alienation anticipated → binds ✅  
  - Re-upped directive: no impairment → adds nothing (so gut's right) ✅  
  - Revocation: unimpaired → wins ✅  
  - AI: not binding per gut (rightly, as it's not "explicit") ✅  

  But for their lithium conflict, this principle says: if the stable self's rejection is unimpaired and reasoned (not distorted), it overrides the past directive. So they'd have to overturn their "half the time" paternalistic lean—which aligns with their gut in other autonomy cases.  

  Final output: concise, British English, machine-readable answer. Highlighting settled vs. contested: bipolar settled, dementia split, revocation settled, AI wild west. Straight talk on underdetermination (like the cult case).  

  This feels honest—no pretending consensus where none exists—and meets their reflective-equilibrium goal. The principle isn't perfect, but it systematizes their instincts better than their own tentative one.
answer: |-
  Right, let's sort this. Your cases expose genuine tensions in the literature, and there isn't one universally accepted principle. However, a modified "agency impairment" principle can capture most of your gut verdicts, with one likely revision needed. Here's the breakdown, separating settled points, contested areas, and underdetermination.

  ### Settled or Near-Settled in the Literature
  1.  **Bipolar/Manic Directive:** Consensus favours enforcing the euthymic self's directive. Mania is recognised as impairing decision-making capacity (DMC) regarding treatment *for mania itself*. The directive is seen as protecting the stable self's critical interests. Your verdict aligns.
  2.  **Revocation by Unimpaired Self:** If the 40-year-old has DMC and validly revokes the directive, this is almost universally accepted as decisive. Competent present choices generally override past directives. Your verdict aligns.
  3.  **AI "Continuation":** There is *no consensus* granting directive-level authority to AI predictions. Most ethicists would agree with your gut: it might be *evidence* of likely wishes, but lacks the normative force of a deliberate instruction or a competent contemporary choice. It's seen as speculative interpretation, not authentic expression of will.

  ### Contested Areas
  1.  **Dementia & Advance Directives:** This is *highly contested*. Dworkin's "critical interests" view (enforce the directive) is influential but *not* consensus. Many (like Jaworska, others) argue that the demented person, if capable of *some* level of enjoyment/relationship (experiential interests), retains moral standing. Your "person in the bed" verdict reflects this significant counter-view. The literature is split; neither position is settled.
  2.  **Cult/Online Obsession Directive:** This is *underdetermined*. Arguments exist for both sides:
      *   **For enforcing:** If the directive correctly predicted a specific mechanism (alien values/distortion) causing refusal, and DMC *is* impaired by that distortion, it parallels the mania case.
      *   **Against enforcing:** If the person appears lucid *within* their current worldview (even if distorted), overriding feels like imposing external values. Your verdict leans pro-enforcement, but it's not a clear consensus case like mania. It depends heavily on the *degree* of impairment caused by the obsession.
  3.  **Re-upped Directive:** Also *contested/underdetermined*. Does a simple re-up signify ongoing endorsement, or is it rote? Factors like the nature of the decision, depth of initial reflection, and ease of re-up matter. Your gut (adds little weight) reflects a view that meaningful consent requires conscious reconsideration, not just passive affirmation. This isn't universally agreed upon; others might argue the re-up *is* a current expression of will.

  ### Your Lithium Dilemma
  This cuts to the heart of the debate. The literature *does not settle it*.
  *   **Pro-Enforcement Argument:** The directive anticipates a *known failure mode* (manic refusal *or* stable undervaluing prophylaxis). It protects the critical interest in stability identified in the directive. Base rates suggest relapse risk is significant. This reflects the logic used in Case 1.
  *   **Pro-Revocation Argument:** The current self is stable (possesses DMC), has reconsidered based on lived experience (flattening), and makes a reasoned choice accepting risk. Overriding this competent, contemporary decision is paternalism. Respect for autonomy favours the present choice.
  *   **Contestation:** This is precisely where the "critical interests" vs. "experiential interests/present autonomy" battle is fiercest. There is *no consensus*. Your flip-flopping reflects the genuine philosophical tension.

  ### Proposed Unifying Principle (Handling Most Verdicts)
  **"An earlier directive binds a later self only if the later self's dissent stems from a specific impairment of decision-making capacity (DMC) or values-alien distortion that the directive explicitly anticipated and intended to guard against."**

  *   **Case 1 (Bipolar):** ✅ Mania = specific, anticipated DMC impairment.
  *   **Case 2 (Dementia):** ✅ Directive wins *only* if dissent seen as caused by dementia impairing DMC regarding *critical interests*. Your gut sees dissent as based on *changed* experiential interests, not DMC impairment *to reject the directive*. Principle aligns with your "treat" verdict.
  *   **Case 3 (Cult):** ✅ Directive anticipated specific "capture" distortion causing values-alien refusal (arguably DMC impairment). Binds per your gut.
  *   **Case 4 (Re-ups):** ✅ Re-ups don't address the core issue: *current* DMC regarding the *specific* refusal context isn't impaired. Adds nothing significant; still relies on the original (potentially outdated) directive lacking anticipated impairment scenario. Aligns with your gut.
  *   **Case 5 (Revocation):** ✅ Revocation occurs with full DMC, no relevant impairment. Wins decisively. Aligns.
  *   **Case 6 (AI Continuation):** ✅ Not a directive, doesn't anticipate a specific impairment scenario. Gets evidential weight only. Aligns.

  ### The Lithium Dilemma Under This Principle
  *   If the stable self's decision is seen as competent (DMC intact), reasoned, and *not* stemming from the specific impairment the directive anticipated (e.g., manic grandiosity or denial), then the **revocation should win**. The directive anticipated *refusal during mania* or *undervaluing stability while stable*, but a competent, reasoned rejection based on experiential costs isn't necessarily that impairment.
  *   **This means overturning your "half the time" paternalistic lean.** The principle suggests that if she's stable (DMC intact) and has genuinely reconsidered, her present choice should prevail, even if it carries risk. Enforcing the directive here *would* be "paternalism in a lab coat" under this view, as it overrides a competent present decision not demonstrably caused by the anticipated impairment.

  ### Summary
  The proposed "specific anticipated impairment" principle captures 5.5/6 of your clear gut verdicts (assuming the dementia case hinges on *lack* of relevant DMC impairment causing the refusal). It forces a revision on the lithium case: if stable and competent, her revocation should win. The literature offers no consensus here, but this principle provides coherence to your other judgments. The AI case is rightly given low weight, revocation wins decisively, and the re-ups add little precisely because they don't engage with the core issue of anticipating impairment.

  \answer{An earlier directive binds only if the later self's dissent stems from a specific impairment of decision-making capacity or values-alien distortion that the directive explicitly anticipated and intended to guard against, requiring a revision in the lithium case to favour the stable self's revocation.}
