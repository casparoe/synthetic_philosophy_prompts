     - *Verdict*: This is a genuine desideratum. For a weighted sum rule, we can explain the social ranking as a weighted sum of individual utilities. However, the weights are the same for everyone? Then to the person who loses out, we can show that the alternative chosen had a higher total (weighted) sum. But note: the weights might be different for different people? If so, then it becomes harder to explain. However, if the weights are determined by a fixed rule (like the reciprocal of the range of each individual's utility), then we can explain. 
     - *Conflict with robustness?*: If the weights are fixed and the utility functions are continuous, then the rule is continuous and robust. So no conflict.

  ## Conflicts and Impossibilities

  - **Conflict between valuing fairness of chances (ex ante equality) and Harsanyi's independence axiom**: If we want the coin flip to be strictly better than the outright allocation (because it gives each person a fair chance), then we must drop the independence axiom (or the reduction of compound lotteries). But without independence, we lose the expected utility form. Therefore, we cannot have both the weighted sum form and the valuation of fairness of chances. 

  - **Conflict between variable population and avoiding the repugnant conclusion**: If we use the unweighted sum, then we get the repugnant conclusion (a large number of people with barely positive utility is better than a small group with very high utility). If we use the average, then we avoid that. But the average breaks subgroup consistency? Not necessarily. The problem says the same rule must be applied to different group sizes on different days, but we are not comparing across groups? However, if we want the rule to be consistent in the sense that adding a person with zero utility does not change the ranking (and zero is the status quo), then the unweighted sum satisfies that (the additive rule) but the average does not. The average would require that we compare the average utility. 

  - **Conflict between invariance to affine transformations and fixing a natural unit**: If we have a natural unit (from estimation), then we might fix the weights accordingly. But the problem states that utilities are not interpersonally comparable by construction. Therefore, we must have invariance. The only way to fix the weights is to choose a normalization (e.g., set zero and unit for each individual). We might require that each individual's utility is normalized to [0,1] by using the range of their utility in the relevant domain. Then we can use equal weights. But note: the normalization is arbitrary? 

  ## Contender Scoring

  We evaluate four contenders:

  1. **Unweighted sum**: Social welfare = Σ_i u_i.
  2. **Concave transformation of the sum**: Social welfare = f(Σ_i u_i) where f is concave (e.g., square root).
  3. **Ex post equality rule**: First evaluate each realized outcome vector by a measure of equality (e.g., the minimum utility, or a concave function of the vector), then take the expectation. Example: social welfare = E[ min_i u_i ] or E[ Σ_i g(u_i) ] for concave g.
  4. **Normalized sum**: Social welfare = (1/n) * Σ_i u_i (average utility).

