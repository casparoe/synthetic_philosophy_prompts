  The requirement that does the most exclusionary work is **Pareto**. It excludes the ex post equality rule.

  ## Conclusion

  The weighted sum form (Harsanyi) with a normalization to make the utilities interpersonally comparable (by setting a common zero and unit) and then using equal weights, either as a sum or average, is a strong contender. But note:

  - To avoid the repugnant conclusion, we might prefer the average.
  - To incorporate social risk aversion, we might want a concave transformation, but that breaks the expected utility axioms? Actually, it does not break the expected utility axioms at the social level if we define a new vNM utility for society that is the concave function of the sum. However, then we are no longer in the Harsanyi form (which is linear in individual utilities). 

  But the problem says the rule must be defensible to each individual. The concave transformation might be harder to explain.

  Given the desiderata, the normalized sum (average) with a pre-normalization of each individual's utility to a common scale (e.g., zero at status quo and unit at one standard benefit) is a good candidate. It satisfies:
     - Anonymity: by using the same weight for everyone.
     - Affine invariance: after normalization.
     - Pareto: yes.
     - Continuity: yes.
     - Variable population: it is the average, so defined for any group.
     - Description invariance: yes.
     - Legibility: we can explain it as the average utility.

  It does not, however, value fairness of chances. If that is a requirement, then we must abandon the expected utility form.

  Given the cases, the most critical challenge is case 1: the coin flip vs the outright allocation. The average utility rule (with normalized utilities) will rank the outright allocation to A, the outright allocation to B, and the coin flip all the same (if the two individuals are normalized to the same scale and have the same utility from the benefit). So it does not value the fairness of chances. If that is a requirement, then we need a different rule.

  But the problem states: "by any anonymity condition the two outright allocations are equally good; by the sure-thing-style independence axiom on the social ranking, they are then also indifferent to the coin flip". So we are forced to indifference. Therefore, if we want to value fairness, we must drop independence.

  ## Final List of Desiderata

  Non-negotiable:
  1. Anonymity.
  2. Invariance to independent affine rescaling (achieved by normalization).
  3. Pareto (weak and indifference) with respect to the system's probability.
  4. Continuity/stability.
  5. Variable population (by the problem).
  6. Description invariance.
  7. Determination of weights (by normalization and equal weights).
  8. Legibility.

  The weighted average (normalized sum divided by n) with normalized utilities satisfies these. But it does not value fairness of chances or social risk aversion. 

  If we require fairness of chances, we drop independence and hence the expected utility form. Then we might consider a rule that is not of the weighted sum form. For example, we might use a rule that is the expected utility of the individuals plus a bonus for ex ante equality. But that would break the linearity in probabilities.

  If we require social risk aversion, we can use a concave transformation of the sum (or average) but then we break the linearity in the individual utilities. Then we are not in the Harsanyi form. And we might lose the ability to explain in terms of the individual's own utility? Not necessarily: we can still compute the social welfare as a function of the individual utilities.

  Given the problem, I recommend the normalized average. It is the most straightforward and satisfies all the non-negotiable requirements except possibly fairness of chances. And the problem does not explicitly require valuing fairness of chances (it asks if it is a desideratum). In many settings, the fairness of chances is not valued per se because the system is only concerned with the distribution of outcomes (and the chances are already incorporated in the expected utility). 

  Therefore, the final verdict: use the average of the normalized utilities.
