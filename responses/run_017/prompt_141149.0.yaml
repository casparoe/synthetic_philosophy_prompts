  We are designing an aggregation rule for ranking risky prospects in a resource-allocation system. The setting has the following features:
  - Each individual has a von Neumann-Morgenstern (vNM) utility function, which is cardinal and unique up to positive affine transformations.
  - Utility functions are estimated with error bars and are not interpersonally comparable by construction.
  - The same rule must work for groups of different sizes and be defensible to the individuals.

  We start from Harsanyi's theorem: a social ordering that satisfies the expected-utility axioms and Pareto indifference must be a weighted sum of individual utilities. But we must decide on the desiderata and see if that form is appropriate.

  We address the seven cases and two additional requirements.

  ## Desiderata (Requirements)

  1. **Anonymity (Non-negotiable)**: 
     - *Motivation*: In the case of two indistinguishable people and one indivisible benefit, the outright allocations to A or B should be equally good. This is a basic fairness condition. The coin flip should be indifferent to the outright allocations if we require independence (as in Harsanyi) and anonymity. However, if we want to value the fairness of chances (ex ante equality) as an improvement, then we must drop the independence axiom. But note: Harsanyi's form (weighted sum) under the same weights for both individuals will rank the coin flip as the average of the two allocations, which by anonymity is indifferent to either. So it does not value the chance per se. 
     - *Verdict*: Anonymity is non-negotiable. Valuing fairness of chances is a separate desideratum that requires dropping the independence axiom (or the reduction of compound lotteries). But note that independence is a key axiom for expected utility. Without it, we lose the linearity in probabilities.

  2. **Invariance to Independent Affine Rescaling (Non-negotiable for the base setting)**: 
     - *Motivation*: Utilities are only defined up to positive affine transformations (shift and scale). Therefore, the aggregation rule must be invariant to such transformations for each individual independently. This is because the utility functions are not interpersonally comparable. In the hard-to-please person case, if we have a natural unit (from estimation) that pins down a common scale, then we might drop this requirement. However, the specification states that utilities are "not interpersonally comparable by construction", so we must respect the invariance. 
     - *Verdict*: This is non-negotiable. Therefore, the rule must depend only on the ratios of differences within each individual's utility. The weights in Harsanyi's sum must be chosen in a way that is invariant to the scaling of each individual's utility. This implies that the weights must be proportional to the reciprocals of the scale factors of the individual utility functions (if we fix a normalization). But without a natural normalization, we must fix the weights relative to a chosen normalization. The requirement that fixes the normalization is an additional one: we might require that the weights be chosen so that the marginal social utility of each individual is equal at a benchmark (e.g., status quo). However, the problem of fixing weights is separate.

  3. **Pareto Conditions**:
     - *Unanimity over Prospects (Pareto Indifference and Weak Pareto)*: 
          - Pareto Indifference: If every individual is indifferent between two prospects, then society should be too. (Non-negotiable)
          - Weak Pareto: If every individual strictly prefers one prospect to another, then society should too. (Non-negotiable)
     - *Case 3: Disagreement about probabilities*: Here, we must decide between two versions of Pareto:
          - (a) Unanimity over prospects evaluated at a single probability distribution (the system's probability) -> then if both individuals rank the same prospect higher under the system's probability, we require social ranking to respect that.
          - (b) Unanimity over each person's own expected-utility ranking -> then if each individual, using their own probability, ranks prospect X over Y, then society should too.
     - *Verdict*: The standard Harsanyi framework uses a common probability distribution (the system's). Therefore, it uses (a). However, (b) is stronger and may lead to inconsistencies. For example, if the two individuals have different probabilities and rank two prospects in opposite orders, then (b) would require society to rank X over Y and Y over X, which is impossible. Therefore, (b) is not a reasonable requirement. We must use (a) and the system's probability. The requirement then is: the rule must satisfy Pareto with respect to the system's probability. This is non-negotiable for the Harsanyi form.

  4. **Continuity/Stability (Non-negotiable for practical reasons)**:
     - *Motivation*: The utility estimates have error bars. If the ranking flips within the error bars, the rule is unusable. Therefore, we require that the social ranking is a continuous function of the individual utility estimates. 
     - *Cost*: This rules out thresholds and lexicographic orders (which are discontinuous). However, in the weighted-sum rule, the ranking is continuous if the weights are fixed and the utility functions are continuous. So it is satisfied by the Harsanyi form. 

  5. **Variable Population (Non-negotiable by the problem statement)**:
     - *Motivation*: The rule must work for groups of different sizes. Harsanyi's theorem holds for fixed populations. We must extend the rule to variable populations. 
     - *Considerations*: We require that the rule is defined for any finite group. The extension must be consistent: if we have two groups that are disjoint and we apply the rule to each, then when we consider the union, the rule should be consistent. But note: the problem does not require comparing groups of different sizes on the same day? It says "differently sized groups on different days", so we are not comparing across groups? But the rule must be defined for any group. 
     - *Cost*: The main cost is that we must specify how the weights (if any) are determined for groups of different sizes. We might require that the rule is anonymous and that the weight per person is the same (i.e., unweighted sum) or that the weight depends on the group size (e.g., normalized by group size). But note: if we use the same weights for every individual regardless of group, then the rule is additive and the social welfare for a group is the sum of individual utilities. However, this leads to the repugnant conclusion: a very large group with low positive utility per person might be ranked higher than a small group with high utility. Alternatively, if we normalize by group size, we avoid that. But then we break additivity. 

  6. **Description Invariance (Non-negotiable)**:
     - *Motivation*: The social ranking should depend only on the joint distribution over utility vectors. Therefore, reducing compound lotteries or splitting states must not change the ranking. This is the standard axiom of expected utility. 
     - *Tensions*: It is in tension with ex post equality concerns (case 1) because if we value ex post equality, then we might prefer a coin flip to an outright allocation to one person (even though the distribution of utility vectors is the same as a 50-50 lottery between (1,0) and (0,1)). But note: in the coin flip, the ex post outcomes are unequal, but the ex ante chances are equal. If we want to value the ex post equality, we would have to violate description invariance because we would care about the state-by-state outcomes. However, the requirement of description invariance is a core axiom for expected utility.

