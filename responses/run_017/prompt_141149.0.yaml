     - *Motivation*: Each individual's risk aversion is already incorporated in their vNM utility. Therefore, the social ranking should not introduce additional risk aversion. If we do, it might be seen as double-counting. However, we might want to be inequality-averse at the social level, which would require a concave transformation of the sum (or of each individual's utility). 
     - *Verdict*: If we use a concave transformation of the sum, then we are being risk-averse at the social level. But note: the sum of utilities is linear in probabilities, so it respects the expected utility axioms. A concave transformation would break linearity. Therefore, if we require the social ranking to satisfy the expected utility axioms (which Harsanyi does), then we cannot have a concave transformation. The appearance of double-counting is an objection if we believe that the only source of risk aversion should be individual risk aversion. However, if we want to be averse to inequality in outcomes, then we must break the expected utility form. 

