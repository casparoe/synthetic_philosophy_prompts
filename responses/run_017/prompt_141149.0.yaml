  ### Desiderata for Aggregation Rule
  1. **Anonymity**  
     - *Motivation*: Ensures symmetric treatment of identical individuals (case 1).  
     - *Verdict*: Non-negotiable. Violation implies unjustifiable discrimination.  
     - *Conflict*: Forces indifference between outright allocation and coin flip in case 1. Valuing "fair chances" requires dropping independence (but breaks Harsanyi's form).

  2. **Invariance to Independent Affine Rescaling**  
     - *Motivation*: Utilities are cardinal only up to affine transformations; no natural comparability (case 2).  
     - *Verdict*: Non-negotiable. Survives even if estimation provides error bars, as lack of comparability is inherent.  
     - *Weight normalization*: Required to fix weights. Normalize each individual’s utility to [0,1] (range normalization) using the outcome domain, ensuring weights are proportional to scale.

  3. **Pareto Conditions**  
     - *Weak Pareto*: If all individuals prefer prospect A to B under the system's probability, society must rank A above B.  
     - *Pareto Indifference*: If all are indifferent, society is indifferent.  
     - *Motivation*: Unanimity should be respected (case 3).  
     - *Verdict*: Non-negotiable. Case 3 requires using the system's probability (clinician's 25%), not individual beliefs. Rules satisfying Pareto under a common probability **cannot** satisfy unanimity under individual probabilities—they conflict when beliefs diverge.

  4. **Continuity/Stability**  
     - *Motivation*: Robustness to estimation noise (case 4).  
     - *Verdict*: Non-negotiable for usability. Rules must be Lipschitz-continuous in utilities.  
     - *Cost*: Rules out thresholds, lexicographic orders, and discontinuous equality metrics.

  5. **Variable Population Consistency**  
     - *Motivation*: Rule must handle different group sizes without ad hoc adjustments (case 5).  
     - *Verdict*: Non-negotiable. Extension of Harsanyi requires specifying how weights scale.  
     - *Cost*: Forces choice between additive (unweighted sum) or averaging (normalized sum) forms; latter avoids repugnant conclusion but breaks subgroup separability.

  6. **Description Invariance**  
     - *Precise requirement*: Social ranking depends only on the joint distribution over utility vectors, not on lottery description (case 6).  
     - *Verdict*: Non-negotiable (core to expected utility).  
     - *Tension*: Conflicts with ex post equality (case 1): valuing equality of outcomes violates invariance if rankings depend on state-wise utilities.

  7. **Social Risk Attitudes**  
     - *Motivation*: Should societal ranking introduce risk aversion beyond individuals'? (case 7).  
     - *Verdict*: Negotiable. Harsanyi’s linear form avoids double-counting; concave transformations add social risk aversion. The latter is a feature if inequality aversion is desired, but breaks linearity and Pareto under common probability.

  8. **Weight Determination**  
     - *Motivation*: A rule with free weights is underspecified.  
     - *Verdict*: Non-negotiable. Weights must be fixed by normalization (e.g., range-based) without free parameters.

  9. **Legibility**  
     - *Motivation*: Explain rankings to individuals using their utilities (closing requirement).  
     - *Verdict*: Non-negotiable. Satisfied by weighted sums: show weighted totals. Conflicts with robustness only if weights depend discontinuously on inputs.

  ### Conflicts and Impossibilities
  - **Jointly unsatisfiable trio**:  
    - (i) **Ex post equality** (valuing equal outcomes),  
    - (ii) **Description invariance**,  
    - (iii) **Pareto under common probability**.  
    Ex post equality (e.g., prioritizing worst-off in each state) violates description invariance and Pareto (case 6 and case 3).  
  - **Most exclusionary requirement**: **Pareto under common probability** (excludes ex post equality rules).  
  - **Critical tension**: **Valuing fair chances** (case 1) cannot be added without dropping **independence**, breaking Harsanyi’s form.

  ### Contender Scoring
  | Rule                     | Anon. | Affine Inv. | Pareto | Cont. | Var. Pop. | Desc. Inv. | Social Risk | Weights | Legibility |  
  |--------------------------|-------|-------------|--------|-------|-----------|------------|-------------|---------|------------|  
  | **Unweighted sum**       | ✓     | ✓*          | ✓      | ✓     | ✘ (repugnant) | ✓          | ✘ (neutral) | ✓       | ✓          |  
  | **Concave sum (e.g., √Σ)**| ✓     | ✓*          | ✓      | ✓     | ✘ (repugnant) | ✓          | ✓ (averse)  | ✓       | △ (complex)|  
  | **Ex post equality**     | ✓     | ✓*          | ✘      | ✓     | ✓         | ✘**        | ✓ (averse)  | ✓       | △ (opaque) |  
  | **Normalized sum (avg)** | ✓     | ✓*          | ✓      | ✓     | ✓         | ✓          | ✘ (neutral) | ✓       | ✓          |  

  - *✓ = Satisfied, ✘ = Violated, △ = Partially satisfied*  
  - **Affine Inv.**: All require range normalization (e.g., map utilities to [0,1]) to achieve invariance.  
  - **Ex post equality**: Fails Pareto (case 3) and description invariance if state-splitting affects equality evaluation (case 6).  
  - **Unweighted/Concave sum**: Fail variable population (case 5) due to repugnant conclusion.  
  - **Normalized sum (avg)**: Best balance; avoids repugnant conclusion and satisfies all non-negotiable desiderata except social risk aversion.  

  ### Final Recommendation  
  **Normalized sum (average utility)** with range-normalized utilities satisfies all non-negotiable requirements. It is legible, robust, and population-consistent. Social risk aversion is excluded to preserve Pareto and linearity; fairness of chances is excluded to preserve independence. If inequality aversion is essential, a concave transformation of the sum is feasible but sacrifices linearity and complicates legibility. Ex post equality is impossible under Pareto and description invariance.
