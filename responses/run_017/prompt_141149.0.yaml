     - *Motivation*: The rule must fix the weights. We cannot leave them as free parameters. 
     - *Verdict*: This is a genuine requirement for a specification. We must have a rule that determines the weights. The most common approach is to use equal weights (unweighted sum) or to normalize each individual's utility function (e.g., by setting a common zero and unit) and then use equal weights. However, the normalization must be fixed. 

