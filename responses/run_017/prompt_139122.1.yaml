answer: |-
  ### Exam Question: Reasons and Normativity Final Exam  
  *(Time Allowed: 90 minutes)*  

  **Essay Question**  
  Fitting-attitude (FA) accounts analyze an object’s evaluative property (e.g., being admirable) as constituted by reasons to favor it (e.g., to admire). This faces the *exclusion problem*: some reasons to have an attitude (e.g., threats, bribes) do not bear on whether the object *merits* that attitude. The standard solution distinguishes *right-kind reasons* (RKRs)—which bear on the attitude’s *correctness* or *fittingness*—from *wrong-kind reasons* (WKRs)—which bear on the *costs/benefits* of having it.  

  However, consider two cases:  
  - **Case A (Deferred Access)**: A poem possesses a genuinely funny-making feature, but a reader can perceive this feature *only* by first being amused (amusement redirects her attention to it). She is offered this reason to be amused now: *"Amusement is your only route to appreciating the feature that makes this poem funny."*  
  - **Case B (Friend’s Request)**: A close friend, with no threat or bribe, asks you *as her friend* to find her mediocre poem funny. Finding her work funny is partly constitutive of your friendship, and you have strong reason to sustain this friendship.  

  For each case:  
  1. Is the offered reason an RKR or a WKR?  
  2. Does your answer depend on whether the attitude (amusement) would be held *because* of that reason?  

  Then address the *crux*:  
  Can the RKR/WKR distinction be stated such that it:  
  (i) Yields clear answers for **both** cases,  
  (ii) Avoids appealing to the very evaluative property (e.g., "funny") the FA account aims to analyze, *and*  
  (iii) Is not merely a list of pre-classified cases?  
  If no formulation satisfies all three, what should the FA theorist give up?  

  **Instructions**:  
  - Answer with a focused **argument**, not a literature review.  
  - No citations expected.  
  - Be concise and precise.  

  ---

  ### Model Answer (Approx. 600 words)  

  **Case A (Deferred Access)**: The reason ("amusement is your only route to appreciating the funny-making feature") is an RKR *if* amusement is held *because* it accesses the feature. The reason directly invokes the poem’s *genuine* evaluative property (its funny-making feature) and positions amusement as the necessary epistemic conduit. This aligns with RKRs’ function: justifying the attitude *via properties of the object*. However, if amusement is adopted *merely* as a tool (e.g., to test a theory), ignoring the feature, it functions as a WKR—akin to a bribe for amusement unrelated to the poem’s content.  

  **Case B (Friend’s Request)**: The reason ("finding her work funny sustains friendship") is a WKR, regardless of *why* the attitude is held. Friendship’s value does not make the *poem* funny; it provides a distinct, practical reason to *cultivate* amusement. If you find it funny *because* friendship requires it, you are conflating relational obligations with the poem’s properties. If you find it funny *for other reasons*, the offered reason is irrelevant to the attitude’s fittingness.  

  **The Crux**: No formulation of the RKR/WKR distinction satisfies (i)–(iii).  
  - **Why (i) and (ii) fail**: Case A reveals a hybrid reason: it is *object-grounded* (satisfying (ii)) but *psychologically mediated*. Standard RKRs (e.g., "the joke’s clever twist") directly warrant the attitude; here, the reason warrants the attitude *instrumentally*. Calling it RKR requires relaxing "directness," risking conflation with WKRs. Case B’s reason is clearly non-object-grounded, but labeling it WKR ignores its *non-instrumental* role: amusement is *constitutive* of friendship, not a means to it. This challenges the "costs/benefits" gloss of WKRs.  
  - **Why (iii) fails**: To classify Case A as RKR (when attitude-dependent) and Case B as WKR, we must appeal to *case-specific intuitions* about "proper" access to value or the scope of "object-groundedness." Any general rule (e.g., "RKRs must be object-immanent") either excludes Case A’s reason (despite its evaluative link) or admits Case B’s (by stretching "object" to include friendship).  

  The FA theorist should **give up the ambition of a context-invariant, non-circular distinction**. Case A shows that *access conditions* for evaluative properties can blur RKR/WKR lines, while Case B shows that *social practices* (e.g., friendship) generate reasons to adopt attitudes that are not fitting in the standard sense but are normatively non-arbitrary. FA accounts should instead:  
  1. **Restrict their scope**: Analyze "thin" evaluative properties (e.g., *goodness*) via RKRs, but accept that "thick" properties (e.g., *funny*) or context-embedded attitudes (e.g., friendship-required amusement) demand supplemental norms.  
  2. **Embrace a two-tier structure**: Distinguish *fittingness* (governed by RKRs) from *normative justification* (which can include WKRs or hybrid reasons) without reducing the latter to the former.  

  This preserves FA’s core insight—that value is response-dependent—while acknowledging that reasons for attitudes exceed fittingness conditions.  

  ---

  ### Marking Scheme (Total: 20 points)  

  | **Points (Total)** | **Must-Hit Point**                                                                 | **Common Mistakes**                                                                 |
  |--------------------|------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|
  | **4**              | **Correctly classifies both cases** (A: RKR if attitude-dependent, else WKR; B: WKR) | Misidentifying Case A as purely RKR/WKR; or Case B as RKR due to friendship’s value. |
  | **4**              | **Analyzes role of ‘because’** for Case A (crucial) and Case B (irrelevant)       | Treats "because" symmetrically; ignores constitutive element in Case B.             |
  | **5**              | **Argues no distinction satisfies (i)–(iii)** with reasoning for each case        | Claims a distinction works (e.g., "RKRs are object-grounded") without testing flaws. |
  | **5**              | **Defends what the FA theorist should give up** (e.g., universal non-circularity) | Vague surrender (e.g., "give up FA theory"); no positive adjustment.               |
  | **2**              | **Overall coherence, precision, and concision**                                   | Digressions; conflating cases; overly descriptive.                                  |

  **Separating A from B**: An A answer **recognizes that Cases A and B challenge different assumptions** (epistemic access vs. constitutive practices) and uses this to diagnose the distinction’s limitations, while a B answer treats them as similar puzzles or proposes superficial fixes.
