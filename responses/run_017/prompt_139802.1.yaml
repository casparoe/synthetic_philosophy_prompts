prompt: |-
  my friend and I have been going in circles on this for like three weeks and I want a third opinion with actual numbers attached. The claim: KK is false for real human knowers — there are actual cases where somebody knows that p but isn't in a position to know that they know that p. Not "KK isn't a theorem of some modal logic" and not "KK fails in a far-out skeptical scenario" — everyday-ish cases of the kind the Williamson-style anti-luminosity argument is supposed to produce (sorites series, a margin-for-error requirement on knowledge, and being in a position to know supervening on your evidence). I'll count it as resolved either way by an argument from premises nearly everyone in the field already accepts, or by the literature just quietly stopping to treat it as open — and I want to know how much of your number is riding on which of those. I'm at about 0.65 that KK fails in that sense; he's at 0.9.

  Give me your own number, but mostly the decomposition. Terms I think matter (add any I've missed): (1) whether being in a position to know supervenes on the subject's evidence, or whether external stuff — reliability of the process, the environment — can come apart between two cases with indistinguishable evidence; (2) whether knowledge requires a margin for error at all, on a safety or sensitivity style account, and whether that premise is doing nearly all the work; (3) whether there really are adjacent cases in the series with indistinguishable total evidence — he keeps saying the neural realizers are discrete so the sorites can't get started, and I can't tell if that's a real reply or a dodge; (4) whether knowing is even the kind of state luminosity arguments are about, given that it's factive and world-involving rather than purely mental; (5) how much rides on what "in a position to know" means — ability or disposition versus evidential support — i.e. how much of the whole dispute is verbal.

  And here's the bit I most want priced, because it's his actual move and I've never seen it anywhere in print, which makes me suspect it's just confused: the indexical dodge. Case: Mira is shown a series of 1000 colour patches, each step imperceptibly different from the last, red at one end and orange at the other. She's told the switch happens at trial 500, and she can track perfectly which trial she's on. So at trial 500 her evidence is not the same as at 501 — it includes the trial index — so the indistinguishability premise fails and she is in a position to know she sees red. My worry is that the argument just recurs one level down on the index (is she luminous about which trial she's on?), and the regress either bottoms out in something that isn't luminous or doesn't bottom out at all. So: put a number on whether the indexical dodge saves luminosity for at least some non-trivial conditions, and tell me whether the fact that her index-tracking has to come from somwhere makes the reply circular — or whether it can rest on a non-luminous hard base without sinking the cases built on top of it.

  Then combine into the headline number, tell me which single term it's most sensitive to, which of the two of us is most likely wrong about which term, and what would actually move you: more argument, or something empirical like psychophysics on discrimination thresholds? Also — I'm writing this up, so please flag clearly what's settled versus genuinely contested among people who actually work on this. I don't want to write "the consensus is" over what's really one camp's view with a catchy argument.
