prompt: |-
  I am a professor of philosophy and, for the past three years, the ethics adviser to my university's clinical research partnership at a teaching hospital in a West African city, where our local staff describe a small gift to someone who has helped you as ordinary etiquette and describe going through a fixer or a well-placed relative as simply how anything gets done here. I am asked to rule on ten or twelve matters a year, and I want a procedure rather than a policy statement: ordered questions, what counts as a sufficient answer to each, where the procedure stops with a refusal, and where it must hand the decision to a named person because the remaining question is one of values rather than of fact.

  Two constraints shape it. First, it has to be runnable by our site coordinator, a senior nurse with no training in ethics, in about half an hour, from a written record, with me unreachable by phone. Second, it may not simply export our home university's compliance list: the site reasonably rejects the suggestion that a goat, a length of cloth, or a bottle given after the fact is the moral equivalent of an envelope of cash, and it is equally unmoved by our monetary threshold.

  I want the procedure built on the thought that corruption is not a class of objects but a capture of a role's discretion by a loyalty the role was created to exclude, so that a bribe, a clientelist relationship, and a gift are one phenomenon at different durations, and the operative test is whether a consideration entered a decision that the role's point excludes, asked from the standpoint of whoever loses by it. It must also handle the case where refusing is not neutral, because to decline the gift is to decline the relationship the work depends on.

  Apply it to three cases: a family giving the study nurse who recruited their child a chicken and a bottle of schnapps once the child's treatment has ended; our site director proposing to award the sample-courier contract to his wife's brother's firm, which is also the only firm that reliably reaches the district, disclosed and declared irrelevant by him; and a foreign partner university offering our medical school's dean, who is deciding whether to renew their memorandum, an all-expenses-paid week at the resort hotel where the signing is to take place. I suspect one of these will come out the way I would rather it did not; say which, and whether that is a defect in the procedure or in my expectation. Finally, state plainly what the procedure cannot settle, in particular whether the standard it applies is ours, theirs, or something it has quietly introduced of its own.
reasoning: |-
  Hmm, the user is a philosophy professor and ethics advisor for a clinical research partnership in West Africa. They're facing real-world ethical dilemmas where local customs conflict with Western compliance standards. They want a practical decision procedure, not just policy statements, that accounts for cultural context without compromising ethical principles.

  Key requirements stand out: The procedure must be usable by a non-ethicist site coordinator in 30 minutes, avoid cultural imperialism, and be grounded in their sophisticated definition of corruption as "role capture" rather than focusing on material objects. Three test cases highlight the tension between local norms and institutional ethics.

  The corruption definition here is particularly nuanced - it's about whether external loyalties subvert a role's purpose, viewed from the disadvantaged party's perspective. This reframes the problem from "is this gift acceptable?" to "does this compromise the role's intended function?" 

  For the procedure design, I need to create a flowchart-like sequence that:
  - Starts with factual questions about the transaction
  - Progresses to role-integrity analysis
  - Includes off-ramps for clear violations
  - Has escalation points for value judgments
  - Accommodates cases where refusal causes harm

  The three test cases will be revealing:
  1. The chicken/schnapps gift seems culturally appropriate but requires assessing whether it influences future decisions
  2. The director's brother-in-law contract involves clear conflict of interest despite practical necessity
  3. The dean's resort invitation blurs professional judgment with hospitality

  I suspect the brother-in-law contract case will be most problematic - practical necessity clashes directly with conflict-of-interest principles. This might reveal a limitation in the procedure rather than flawed expectations.

  The procedure's boundary needs clarification: It can identify when roles are compromised but can't resolve fundamental value conflicts between institutions. The standard it applies is neither purely local nor imported, but role-functional - asking what the position was created to achieve.

  The implementation challenges are significant: training non-specialists, ensuring consistent documentation, and building trust that this isn't just Western ethics in disguise. But by centering on role purpose rather than monetary thresholds, it might bridge the cultural gap they're facing.
answer: |-
  Here is a procedural decision tree based on your ethical framework, designed for practical use by the site coordinator. It focuses on **role integrity** and **disadvantaged perspective**, avoiding cultural imposition while upholding core anti-corruption principles.

  **Procedure: Role Integrity Assessment (RIA)**

  *   **Step 1: Record Basic Facts (5 mins)**
      *   Q1: What is the *role* of the recipient (e.g., study nurse, site director, dean)?
      *   Q2: What specific *action* or *decision* did/will this role perform? (e.g., recruit patient, award contract, renew MoU)
      *   Q3: What *consideration* (gift, favor, relationship, invitation) is being offered, given, or utilized?
      *   Q4: Who *provides* the consideration? What is their relationship to the role's action/decision?
      *   Q5: *When* is the consideration given/proposed relative to the action/decision? (Before, during, after)
      *   **Sufficiency:** Clear, factual answers recorded. If unclear, coordinator documents the ambiguity and proceeds.

  *   **Step 2: Assess Role Purpose & Excluded Loyalties (10 mins)**
      *   Q6: What is the *primary purpose* of the recipient's role in the context of the research partnership? (e.g., impartial patient care, fair procurement, objective partnership evaluation).
      *   Q7: What loyalties or influences *is this role specifically created to exclude* to fulfill its purpose? (e.g., loyalty to family over patient welfare, loyalty to personal gain over fair competition, loyalty to gift-giver over institutional independence).
      *   **Sufficiency:** Answers derived from job descriptions, research protocols, MoU clauses, or fundamental institutional mission. If unclear, document and proceed cautiously.
      *   **Stop Point:** If Q7 reveals the consideration *directly embodies* an excluded loyalty (e.g., cash for a specific favorable decision *before* the decision), **REFUSE**. (e.g., An envelope of cash offered *before* patient recruitment for priority inclusion).

  *   **Step 3: Disadvantaged Perspective & Role Capture (10 mins)**
      *   Q8: Who is *most clearly disadvantaged* if the consideration influenced (or appears to influence) the role's action/decision? (e.g., other patients not recruited, other courier firms, rival universities, institutional integrity).
      *   Q9: From *their perspective* (Q8), does the consideration risk *capturing the discretion* of the role? Specifically:
          *   Could it create a sense of obligation affecting future decisions?
          *   Could it incentivize prioritizing the provider of the consideration over others?
          *   Does it create a loyalty (personal, familial, clientelist) that *competes with* the loyalty the role demands (Q7)?
      *   **Sufficiency:** Requires reasoned judgment based on Steps 1 & 2. Coordinator must articulate *why* it might capture discretion from the disadvantaged perspective.
      *   **Stop Point:** If the answer to Q9 is clearly **YES**, **REFUSE**. If clearly **NO**, **PERMIT** (with documentation).

  *   **Step 4: Necessity & Neutrality Check (5 mins) - *Only if Q9 is UNCLEAR or AMBIGUOUS***
      *   Q10: Is refusing the consideration likely to *damage necessary relationships or functions* critical to the ethical operation of the research (e.g., community trust, sample delivery, partnership management) in this specific context?
      *   Q11: Would accepting the consideration under these specific circumstances *appear* more neutral (maintain necessary function) than refusing it (disrupting function), *especially* from the disadvantaged perspective (Q8)?
      *   **Sufficiency:** Requires practical, context-specific judgment. Must be more than mere convenience; must relate to core operational ethics.
      *   **Handoff Point:** If Q10/Q11 suggest refusal is *not* neutral and risks significant harm to ethical operations, OR if the coordinator feels unequipped to weigh the competing values, **HANDOFF TO NAMED PERSON: [Name of University Designated Ethics Officer or Equivalent]** for final value judgment. Provide full record from Steps 1-4.

  **Application to Cases:**

  1.  **Family gives chicken & schnapps to study nurse after child's treatment.**
      *   Step 1: Nurse (Recruitment/Care), Action (Past Recruitment/Care), Consideration (Modest gift post-action), Provider (Grateful family).
      *   Step 2: Purpose (Impartial care/recruitment). Excluded Loyalty (Loyalty to gift-giver over other patients).
      *   Step 3: Disadvantaged (Other patients). Capture Risk? Unlikely post-hoc for small, culturally normative token of thanks. Obligation for *future* decisions seems minimal. Disadvantaged perspective unlikely to see this as distorting care.
      *   Step 4: Not reached. Refusal could damage community trust (necessary relationship).
      *   **OUTCOME: PERMIT** (Documented as cultural token of gratitude post-service).

  2.  **Site director proposes brother-in-law's courier firm (only reliable option).**
      *   Step 1: Director (Procurement), Action (Award contract), Consideration (Family relationship), Provider (Director via family tie).
      *   Step 2: Purpose (Fair, value-driven procurement). Excluded Loyalty (Loyalty to family/self-interest over fair competition).
      *   Step 3: Disadvantaged (Other courier firms). Capture Risk? **YES.** The *relationship itself* is the excluded loyalty. Discretion is captured by familial obligation *before* any decision is made, regardless of declared irrelevance. The disadvantaged perspective sees nepotism, excluding fair chance.
      *   **OUTCOME: REFUSE** (Step 3 Stop Point). Practical necessity doesn't erase the role capture; it demands finding a *procedural* solution (e.g., independent validation of sole-source necessity, director recusal from decision/oversight).

  3.  **Foreign partner offers dean all-expenses-paid resort week before MoU renewal.**
      *   Step 1: Dean (Partnership Evaluation), Action (Renew MoU), Consideration (Luxury hospitality), Provider (Party seeking favorable decision).
      *   Step 2: Purpose (Objective assessment of partnership merit). Excluded Loyalty (Loyalty to gift-giver/hospitality provider over institutional interest).
      *   Step 3: Disadvantaged (Rival universities, institutional integrity). Capture Risk? **YES.** Significant hospitality *before* a decision creates obligation/appearance of obligation. Disadvantaged perspective sees this as buying influence/access.
      *   **OUTCOME: REFUSE** (Step 3 Stop Point). Timing and value create clear capture risk.

  **Suspicion Confirmed & Analysis:**
  *   You suspected Case 2 (brother-in-law courier) might come out negatively. It did (**REFUSE**).
  *   **This is a defect in your expectation, not the procedure.** Your expectation was likely influenced by the practical necessity ("only reliable firm") and the director's disclosure. The procedure correctly identifies the *inherent role capture*: the director's discretion is compromised by the familial loyalty his procurement role must exclude. Necessity requires mitigating the *process* (e.g., recusal, independent verification), not ignoring the conflict. The procedure protects the disadvantaged perspective (other firms) and role integrity over convenience.

  **What the Procedure Cannot Settle:**
  1.  **Fundamental Value Conflicts:** It cannot resolve clashes between the core values embedded in the role's purpose (Step 2) and deeply-held local social norms or values *if* those norms inherently require the excluded loyalty (e.g., if a role *must* prioritize family loyalty by local definition). This is the **Handoff Point** (Step 4).
  2.  **Defining the Role's Purpose/Exclusions (Step 2):** While based on documentation, the *interpretation* of the role's core purpose and excluded loyalties involves value judgments. The procedure relies on existing institutional definitions but highlights when this is ambiguous.
  3.  **The Origin of the Standard:** The standard applied is **neither purely "ours" nor purely "theirs."** It is **role-functional**. It asks: *What is this position for within this institution/project? What must it be free from to achieve that?* This standard emerges from the *institutional role itself* within the partnership context. It avoids imposing external lists but also doesn't uncritically accept local norms that would fundamentally undermine the role's defined purpose. It "quietly introduces" a **functional, role-centric standard**, grounded in the anti-corruption principle you defined (capture of role discretion by an excluded loyalty), viewed from the perspective of the disadvantaged.

  This procedure provides a structured, fact-based, role-focused analysis that a non-ethicist can follow, respects context without capitulating, and clearly flags when value judgments beyond its scope are required.
