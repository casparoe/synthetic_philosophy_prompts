  | **Q3** (Grain sensitivity) | 0.10 | No non-arbitrary grain exists; refining hypotheses dilutes priors, making Pascalian recommendations vanish. |
  | **Q4** (Self-defeating payoffs) | 0.40 | Distinct from voluntarism; it directly sabotages rewards, but some hypotheses may lack this clause. |
  | **Q5** (Fanaticism) | 0.90 | The Wager *is* an instance of fanaticism; if fanaticism works generally, P could too. |
