  ## RFC-0019: Standardized Feature Ontology & Activation Vector Governance Framework  
  **Author:** B. Reynolds, Staff Engineer, Model Interpretability Tooling  
  **Date:** 2024-10-23  
  **Status:** DRAFT (Pre-Circulation for SAE Alignment Working Group)

  ### 1. Summary
  This RFC proposes the establishment of a mandatory, company-wide **Feature Registry** to enforce a rigorous "One Concept, One Direction" (1C1D) policy for all neural network activations. Each semantically meaningful concept (e.g., "Off-By-One Error," "Polite Request Syntax," "Golden Retriever") shall be assigned:  
  - A globally unique, immutable UUID (`feat_off_by_one_8873e`).  
  - A single, canonical direction in activation space.  
  - A designated Feature Owner (engineering team/pod).  
  - Quarterly recertification against drift.  
  Non-compliant activations (e.g., polysemantic vectors, superpositional overrides) will be deprecated via toolchain enforcement.

  ### 2. Motivation  
  Our interpretability pipeline currently suffers from *ad hoc* feature identification. Recent analyses reveal:  
  - **Inconsistent Nomenclature:** Team A identifies `feat_math_error_offset_1`; Team B finds `vec_index_miscalc`. This violates DRY.  
  - **Vector Proliferation:** Unmanaged superposition allows ~3x more "features" than dimensions in layer 15. This is technical debt.  
  - **Unversioned Features:** SAE retraining replaces `feat_german_language` with `feat_german_adj_declension` and `feat_german_noun_gender` without backward compatibility.  
  - **Orphaned Activations:** 37% of high-magnitude directions lack clear ownership, causing P0 incidents when downstream probes break.  
  - **Ambiguous Utilization:** Without canonical vectors, we cannot track if `feat_copyright_violation` is *actually used* by the classifier head.  

  Enforcing 1C1D provides:  
  ✅ **Predictability:** Features become stable API endpoints.  
  ✅ **Accountability:** Feature Owners handle recertification.  
  ✅ **Interoperability:** Probes targeting `feat_unsafe_code` work across SAE versions.  
  ✅ **Debuggability:** Attribution stops at certified features.

  ### 3. Non-Goals  
  - Resolving philosophical debates about "ground truth" features. (Per company policy, see HR memo #451: "Activation vectors are company IP.")  
  - Supporting probabilistic or context-dependent feature representations.  
  - Accommodating "fuzzy" concepts lacking clear SAE activation boundaries.  
  - Backward compatibility for legacy polysemantic neurons (to be deprecated Q3 ‘25).

  ### 4. Rollout Plan  
  **Phase 1 (Q1 ‘25): Registry MVP**  
  - Deploy `feat-registry-service` with gRPC API.  
  - Freeze SAE training. Manually onboard Top 500 Features (by `L1_norm * interpretability_score`).  
  - Assign Owners (e.g., "Syntax Errors" → Code Reliability Pod).  
  **Phase 2 (Q2 ‘25): Enforcement**  
  - Modify SAE loss: +`λ * ||non_certified_activations||²`.  
  - Patch `probe_trainer` to reject non-registry feature targets.  
  - Slack alerts for recertification overdue >14 days.  
  **Phase 3 (Q3 ‘25): Legacy Cleanup**  
  - Deprecation warnings for polysemantic activations.  
  - `SAE-Retrain-Controller` to prioritize orthogonal bases for certified features.

  ### 5. FAQ  
  **Q: What if a new SAE finds finer-grained features (e.g., splits `feat_dog` into `feat_golden_retriever`/`feat_labrador`)?**  
  *A: Feature Owners must recertify. If finer splits are validated, `feat_dog` is marked deprecated and replaced. Registry ensures no overlap.*  

  **Q: How do we handle features activated only in superposition?**  
  *A: Superposition is an unoptimized legacy artifact. Phased enforcement will compress non-essential activations via L1 regularization, freeing dimensions for certified features.*  

  **Q: What if two SAEs (trained with different seeds) disagree on a feature’s direction?**  
  *A: The Registry UUID defines the concept. SAEs must align via orthogonal Procrustes (see Appendix B). Directional drift >5° triggers recertification.*  

  **Q: Does a certified feature imply the model *uses* it downstream?**  
  *A: Usage tracking is out-of-scope. 1C1D ensures features exist as stable entities. Downstream consumption is a separate logging issue (see RFC-0020).*  

  **Q: What about neurons activating on "blue" *and* "sadness"?**  
  *A: Polysemy violates 1C1D. Owners of `feat_color_blue` and `feat_emotion_sadness` must collaborate to disentangle via SAE retraining. Until resolved, both features are marked `UNSTABLE`.*  

  ---

  **Post-Script: Comedy Notes for OP**  
  *Target:* **Realists** ("features are discovered"). This RFC absurdly concretizes their core claim—that features are discrete, pre-existing entities—by ignoring every messy reality of SAEs:  
  - **Superposition:** Mandating "one direction per feature" ignores that models *must* use superposition (features ≫ dimensions). The policy tries to "fix" this by brute-force regularization.  
  - **Basis Dependence:** Enforcing directional uniqueness pretends SAEs find Platonic ideals, not bases shaped by initialization & loss hyperparameters. Procrustes alignment is a band-aid on this.  
  - **Feature Splintering:** Recertification handwaves how concepts fragment under higher resolution (is "off-by-one" one feature or twelve context-dependent ones?).  
  - **Probes ≠ Usage:** The doc separates "feature existence" from "usage," highlighting that finding a direction doesn’t prove it’s functionally relevant.  
  *Liberties:* Exaggerates corporate bureaucracy (recertification, ownership) and ludicrously applies engineering norms (DRY, APIs) to theoretical constructs. The "HR memo" quip leans into the "IP" framing some labs use to dodge philosophy.  
  *Contested Reading:* Some argue superposition isn’t "legacy" but fundamental. The parody implies realists might wish it away via tooling.
