prompt: |-
  So I've been reading the rationalist blogs since basically forever and I still can't referee an argument two friends of mine got into after a board game night, so I'm outsourcing it.

  Setup: my friend Dev is quitting his job to build a niche B2B SaaS thing solo. He figures 8 months to first paying customers and says it's 60% it works out. My other friend Mira is a hard outside-view person and the two of them went at it for like forty minutes. Roughly:

  (1) Mira: don't use your own model, use the reference class "solo first-time founder software projects" — median time to anything shippable is way more then 8 months and most of them never get a paying customer at all. Your 60% is a planning-fallacy number with a confidence interval welded onto it.

  (2) Dev: that class is doing no work, it lumps me in with people who are teaching themselves to code. I've got twelve years in the industry, I've shipped in this exact domain before, and I have a 9k-person mailing list from a newsletter I've run for years. The relevant class is "senior engineers with distribution and domain experience building in a market they've already worked in," and that class looks a lot better. Also, I said 60%, not 100 — I already took a haircut.

  (3) Mira: that's reference class gerrymandering. You picked the narrowing features after looking at your own case, and every founder can do exactly this, so the class always collapses into "people circumstanced like me," which is the inside view with extra steps. If narrowing is free, the outside view has zero bite.

  (4) Dev: it isn't free, but if it's banned then the outside view is just conservatism with a spreadsheet attached. Every successful thing was, ex ante, a member of a class with a bad base rate. And worse: the outside view isn't closed under universal adoption. If everyone actually deferred to the broad class, the population of attempted projects would change — the ones that still get attempted would be a different set, selected for ignoring exactly the number you measured — so the base rate you're quoting wouldn't describe the world you'd be acting in. The number eats itself.

  (5) Mira: fine, but you're conflating two things people mean by "outside view." One is correcting for a corrupted estimator — your optimism, your availability, the fact that you've already sunk two months into building. The other is a claim about which evidence to use. Those have different remedies, and the first one says debias your own model, not replace it with a class average. But on the second: the burden is on the narrow class to show the narrowing feature actually tracks outcomes, and "I feel like my experience is relevant" isn't that. Show me that newsletters predict shipping.

  (6) Dev: I can't, and that's structural, not laziness. The classes anybody has numbers for are the ones some institution already bothered to count — broad, old, legible ones. Call it the census effect. So the outside view doesn't drag you toward the truth, it drags you toward whatever was cheap to tabulate, and it gets to look modest and rigorous the whole time it's doing it.

  (7) Mira: okay, but then what, we go back to vibes? And honestly this whole argument is beside the point, because the outside view is about your probability, not your decision. Fat-tailed payoff — you don't need 60% for quitting to be right. What the outside view changes is the shape of the attempt: keep the job two days a week, precommit to a kill criterion at month twelve, sell before you build. Dev: but if it doesn't change whether I go, and my inside number was already above what I needed, then what exactly did it do?

  I want a verdict on each of (1) through (7), somewhere on a scale from clearly mistaken to clearly right, with a sentence or two on why, then who is more right overall and what both of them are missing. Please actually pick — I've watched this same fight play out on the forums a dozen times and it always dissolves into "both sides have a point, reference classes are hard," which is useless to me. If one of them is equivocating somewhere, say exactly where. And don't tell me to go read somebody, I've read the blog posts; I want the object-level argument.

  Bonus if you want it: is there any principled way to choose a reference class, or is the honest answer that you have to use your inside view to pick the class and then your outside view to set the number — in which case Mira's whole thing is just the inside view wearing a lab coat?
reasoning: |-
  Okay, the user presents a detailed debate between Dev and Mira about using reference classes for estimating startup success probability. They want clear verdicts on each point (1-7), an overall winner, and identification of what both are missing. 

  First, I need to unpack the core conflict. Dev argues for a narrow reference class based on his specific experience (domain expertise, mailing list), while Mira insists on broader classes to avoid bias. The user seems frustrated with typical "both sides have merit" responses and wants decisive judgments. 

  Looking at each argument:
  (1) Mira's broad class suggestion seems statistically sound but ignores Dev's unique advantages. Verdict: partially mistaken for oversimplification. 
  (2) Dev's pushback about relevant class makes sense - dismissing his credentials would be throwing away signal. Verdict: clearly right on substance. 
  (3) Mira's "gerrymandering" charge feels technically correct about methodology but ignores that some narrowing is legitimate. Verdit: right about risk, wrong as blanket prohibition. 
  (4) Dev's self-eating prophecy argument is brilliant - base rates change if everyone follows them. Verdict: clearly right and underappreciated insight. 
  (5) Mira's distinction between debiasing and evidence sources is sharp. Also correctly demands evidence for predictive factors. Verdict: clearly right, especially about burden of proof. 
  (6) Dev's "census effect" critique rings true - available data skews toward legible, generic classes. Verdict: clearly right about institutional data bias. 
  (7) Mira nails it by separating probability from decision, highlighting risk management. Dev misses this strategic layer. Verdict: Mira clearly right.

  Overall Mira wins on rigor but Dev makes crucial points about real-world data limitations. Both miss that reference classes require iterative calibration - start broad, narrow cautiously with evidence, then adjust estimates using inside-view factors as likelihood modifiers. The "lab coat" concern is valid but addressable through Bayesian updating.

  The bonus question reveals the core tension: yes, class selection inherently uses inside-view judgment, but that doesn't make the outside view useless. The key is transparency about assumptions and using classes as priors rather than replacements for thinking.
answer: |-
  Here's a decisive verdict on each point, an overall judgment, and what's missing – no equivocation:

  **Verdicts:**

  1.  **Mira (1): Partially Mistaken.** While correctly identifying the planning fallacy risk, dismissing *all* class narrowing as invalid ignores that some features (like domain experience) *are* empirically predictive of startup success. A broad class containing wildly different cases (e.g., novice coders vs. experts) is often *less* informative than a slightly narrower one. "Never get a paying customer" is likely overstated for the *broadest* class, but her core warning about overconfidence stands.
  2.  **Dev (2): Clearly Right (on substance).** His specific attributes (12 yrs experience, domain expertise, shipped before, 9k mailing list) *are* legitimately differentiating factors known to improve startup odds and reduce time-to-market. Dismissing this by lumping him in with absolute beginners is throwing away valuable signal. His 60% already being a "haircut" shows awareness of optimism bias.
  3.  **Mira (3): Partially Right (on risk), Partially Mistaken (as prohibition).** She correctly identifies the *risk* of cherry-picking narrowing features to confirm desired beliefs ("gerrymandering"). However, declaring *all* narrowing based on specific advantages "the inside view with extra steps" is too extreme. Valid narrowing uses features *known* or *plausibly* correlated with outcomes based on evidence/anecdote, not just "feels right for me." Banning it renders the outside view useless for non-median cases.
  4.  **Dev (4): Clearly Right (and Profound).** His "self-eating prophecy" point is crucial and often overlooked. *If* everyone rigidly adhered to broad base rates, only irrationally optimistic or uniquely positioned individuals would attempt startups, making the original base rate obsolete. Base rates are descriptive, not prescriptive laws. Successful ventures *always* start as exceptions to the mean. Mira's strict outside view fails to account for selection effects and dynamism.
  5.  **Mira (5): Clearly Right.** This is her strongest point. She correctly disentangles two uses of "outside view": 1) **Debiasing:** Correcting cognitive flaws in your *own* estimate (e.g., subtract 20% for optimism). 2) **Evidence Selection:** Replacing your estimate with a class average. The debiasing approach is often more appropriate than wholesale replacement. Crucially, she nails the burden of proof: Narrowing requires justification that the feature *predicts outcomes*. "Feels relevant" isn't enough; Dev needs evidence (even indirect) that domain expertise/newsletters improve solo founder success rates.
  6.  **Dev (6): Clearly Right.** His "census effect" critique is devastating. Available statistics *are* heavily skewed towards broad, easily measurable classes (e.g., "all startups", "solo founders"). Data on highly specific, favorable classes (like his) is scarce or non-existent. Relying *only* on available stats *does* bias estimates towards easily tabulated, often pessimistic aggregates, ignoring unique advantages that lack institutional tracking.
  7.  **Mira (7): Clearly Right.** She correctly shifts focus from the probability estimate to the *decision* and *risk mitigation*. The core value of the outside view here isn't necessarily to change the go/no-go decision (Dev might proceed even at 40%), but to shape *how* he attempts it: de-risking strategies (part-time, kill criteria, pre-sales) are direct responses to the base-rate reality of high failure likelihood. Dev misses this by focusing only on the probability number.

  **Overall Verdict: Mira is More Right (Slightly).**

  *   **Why Mira Wins:** She correctly identifies the core weaknesses in Dev's application of the outside view (gerrymandering risk, burden of proof for narrowing, distinction between debiasing and replacement, crucial shift to risk mitigation). Her points (5) and (7) are particularly strong and address fundamental flaws in how Dev is reasoning. She forces rigor onto the class selection process.
  *   **Why It's Close:** Dev is absolutely right that his specific advantages are real and meaningful (2), that rigid adherence to broad base rates is logically flawed (4 - his best point), and that available data is structurally biased (6). Mira underestimates the validity of intelligent class narrowing and over-relies on the availability of broad statistics.

  **What Both Are Missing:**

  1.  **Iterative Calibration:** The best approach isn't "broad class OR narrow class OR inside view." It's: start with the broadest *relevant* class as a prior, then *cautiously* adjust (Bayesian update) based on the strength of evidence supporting *each* differentiating factor (e.g., domain experience = strong evidence = significant adjustment; newsletter = weaker/unknown evidence = smaller adjustment). Dev wants to jump straight to his narrow class; Mira wants to forbid adjustment.
  2.  **Focus on Uncertainty, Not Just Point Estimates:** Both argue over a single number (60%). The outside view's greater value is often in revealing the *uncertainty* or *distribution* of outcomes (e.g., "Even with your advantages, 20% chance of taking 18+ months"). Mira gestures at this with "fat-tailed payoff" but doesn't develop it.
  3.  **The "Why" of Failure:** The broad class base rate is useful for identifying *common failure modes* (e.g., running out of cash, misreading market, technical hurdles) that Dev should explicitly guard against, *regardless* of his specific probability estimate. Mira mentions risk mitigation but doesn't explicitly link it to common failure causes revealed by base rates.
  4.  **Quantifying the "Haircut":** Dev says he took a "haircut" to get 60%, but it's vague. How much was the haircut? Based on what? Mira should challenge this process explicitly.

  **Bonus: The Principled Way to Choose a Reference Class**

  Mira is partially right: **The honest answer is that you *do* inherently use your inside view to pick the class, but that doesn't make the outside view useless or just a "lab coat".** Here's a principled approach:

  1.  **Start Broad, Define Relevance:** Begin with the broadest class that is *meaningfully relevant* to the *key factors influencing success/failure* for *this specific endeavor* (e.g., "Solo Software Founders" is more relevant than "All Small Businesses" for Dev). Justify relevance based on causal mechanisms, not just outcome correlation.
  2.  **Identify Legitimate Narrowing Factors:** Systematically list factors *known* or *strongly suspected* (based on evidence, theory, expert consensus) to significantly alter the probability within the broad class (e.g., "Technical Founder", "Prior Domain Experience", "Pre-existing Audience").
  3.  **Prioritize Based on Predictive Power & Evidence:** Assign tentative adjustment weights based on the *strength of evidence* linking the factor to outcomes. Domain experience? Strong evidence, significant upward adjustment. Newsletter list? Weaker evidence (size? engagement?), smaller adjustment. "Feeling experienced" isn't a factor; demonstrable experience is.
  4.  **Bayesian Update, Not Replacement:** Treat the broad class probability as a *prior*. Use the identified factors and evidence strength to derive a *posterior* estimate. This explicitly incorporates both views.
  5.  **Acknowledge Uncertainty & Structural Limits:** Explicitly state the limits of the data (Dev's "Census Effect") and the uncertainty introduced by adjustments. "Given broad class P(success) = X%, adjusting for strong factor A (+Y%) and weaker factor B (+Z%), my estimate is X+Y+Z%, but with high variance due to data limitations on B."
  6.  **Focus on Risk Drivers:** Use the broad class less for *the* probability number, and more to identify common failure modes to mitigate (Mira's point 7).

  **Yes, the inside view guides class selection and adjustment.** But the outside view provides the crucial anchor (the prior), forces justification for deviations, highlights common pitfalls, and quantifies the baseline uncertainty. **Mira's demand for evidence to justify narrowing *is* the lab coat – it's the rigor preventing the inside view from running wild.** The outside view isn't replaced; it's the foundation upon which a *justified* inside-view adjustment is built. Dev wants to build on sand; Mira wants to forbid building. The principled way is to build carefully on the bedrock, using solid materials (evidence).
