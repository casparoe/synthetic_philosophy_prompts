prompt: |-
  I run the consultation and engagement team at a unitary authority in England. My officers take in several hundred deputations, petitions and written submissions a year, and increasingly the difficulty is not volume but a recurring judgement call: what to do with contributions whose grounds are religious.

  The governing thought, as I understand it, is that a public body should be able to justify what it does by reasons that all its citizens could reasonably be expected to accept, and that this is meant to be a restraint on the state rather than on conscience. What is not obvious to me is how far that restraint reaches back into what we will accept, record and weigh when it comes *from* the public. My team has to rule on this in the room, in a couple of minutes, with no training in philosophy and no opportunity to consult; the ruling has to be one a non-specialist can apply consistently, it has to survive being read back in writing by the Monitoring Officer or, occasionally, by a judge; and where the procedure runs out it must hand the decision to a named person rather than pretend to a mechanical answer.

  I would like a written procedure we could actually run, and I think it needs to distinguish at least three stages rather than give one verdict: whether a contribution may be accepted and entered into the record at all; whether it may be counted as a reason bearing on the decision; and whether it may appear in the authority's own statement of reasons for the decision.

  There are some wrinkles I want the procedure either to use or to tell me are the wrong distinctions. First, I do not think you can tell from the words alone whether a reason is religious, since it seems to depend on why the speaker holds it. Second, some reasons have a religious ancestry but now travel free of it, and I am unsure whether the ancestry should matter. Third, asking someone to restate their reason in a shared idiom is not costless, and the cost falls unevenly — on people with less fluency in the majority vocabulary, on communities whose reasons are not detachable from their cosmology, and on anyone who would have to misdescribe why they believe what they believe to be heard at all. Fourth, there is a question I cannot settle about who authors a reason: if an officer or a councillor supplies the shared surrogate on the speaker's behalf, the reason that ends up counting is no longer theirs. Fifth, I want to know whether restraint is symmetric — whether a comprehensive secular doctrine gets the same treatment — and whether it bites equally on reasons that happen to support what the authority intended to do anyway.

  Please also say plainly whether we should translate contributions for the record or require speakers to translate to be heard, and why.

  Then apply the procedure to three cases. (1) A deputation against a proposed crematorium whose stated ground is that cremation is incompatible with the resurrection of the body; the speaker volunteers that she has no other objection and will not invent one. (2) A joint submission against a pavement-licensing extension from a mosques' council, whose ground is the prohibition on alcohol, and a residents' association, whose ground is noise and litter; the two reach the same conclusion and the officers disagree about whether the conclusion can be carried by the residents' reason alone. (3) A secular humanist society's submission that a faith-based adoption agency should be excluded from commissioning, grounded in a comprehensive claim about autonomy and religious formation, with an explicit refusal to offer a narrower reason. At least one of these should come out somewhere I or the councillors will not like, and I would rather you said where than softened it.

  Finally, tell me what the procedure cannot do.

  Please write in British English. I am not looking for a reading list or citations: I need something my officers can hold in their hands.
reasoning: |-
  Okay, the user runs a consultation team at a unitary authority in England. They handle hundreds of deputations, petitions, and submissions yearly. The challenge isn't volume but deciding how to handle contributions based on religious grounds. The key principle is that public bodies must justify decisions with reasons all citizens could reasonably accept. This restrains the state, not individual conscience. The user needs a practical procedure officers can apply quickly, without philosophical training, that's consistent and legally sound.

  The user wants a procedure with three stages: whether to accept and record a contribution, whether to count it as a reason in the decision, and whether it can appear in the authority's official reasons. They also mention several wrinkles: identifying religious reasons isn't just about wording, some reasons have religious origins but are now secular, asking people to restate reasons has unequal costs, authorship issues if officers rephrase, and whether secular doctrines get the same treatment.

  I need to create a clear, step-by-step procedure. Start with Stage 1: Accept and Record. The rule should be to accept everything unless it's illegal or abusive. This aligns with democratic principles and avoids censorship. Then Stage 2: Count as a Reason. Here, the key is whether the reason is public, meaning it's expressed in terms others can understand without requiring faith. Officers shouldn't probe why someone holds a belief; just look at how it's presented. If it's purely religious (e.g., "because scripture says so"), it can be noted but not weighed as a reason. Stage 3: Include in Authority's Reasons. Only public reasons should be used here to ensure the decision is justifiable to all.

  For the wrinkles: Since religious identification depends on why the speaker holds the belief, but officers can't interrogate that, the procedure should focus on how the reason is presented. For reasons with religious ancestry but now secular (e.g., "sanctity of life"), if framed secularly, they're public. Restating reasons isn't required because it places undue burden on certain groups. Officers shouldn't create "shared surrogates"; if a reason isn't public, it doesn't advance to Stage 3. Restraint is symmetric—secular comprehensive doctrines get the same treatment. It applies regardless of whether the reason supports the authority's position.

  On translation: Contributions should be recorded verbatim. Officers shouldn't require retranslation; that's unfair. The public translation happens naturally at Stage 2.

  Now, applying to the cases. Case 1: Crematorium objection based on resurrection. Accept and record it. But since the reason is purely religious (requires faith in resurrection), it shouldn't be counted as a decision-influencing reason or appear in the authority's reasons. The speaker has no other objection, so the objection stands but isn't weighed. Case 2: Mosque council (alcohol prohibition) and residents (noise/litter). Both submissions are accepted. The mosque's reason is religious, so not counted, but the residents' secular reason is counted. The conclusion can stand on the residents' reason alone. Case 3: Secular humanist submission against faith-based adoption, based on comprehensive autonomy. It's accepted and recorded. The reason is secular but comprehensive (requires agreement on autonomy), so it shouldn't be counted or appear in the authority's reasons. The authority must find another public reason if they want to exclude the agency.

  The procedure's limitations: It doesn't determine if a decision is lawful or correct, doesn't address equalities impacts directly (officers need separate training), and doesn't solve all fairness issues but provides a consistent approach.

  The user needs this to be practical. Officers can use the flowchart: Accept everything unless abusive. For Stage 2, ask "Can this reason be understood without requiring specific faith or ideology?" If yes, count it; if no, note it but don't weigh. For Stage 3, only use public reasons in the authority's justification. Emphasize recording verbatim and not requiring retranslation. The examples show tough calls, like Case 3 where even a secular comprehensive reason is excluded, which might be unpopular but necessary for neutrality.
answer: |-
  Below is a procedural framework for handling contributions with religious grounds, designed for operational use by non-specialist officers. It prioritises legal robustness, consistency, and practical application within tight timeframes. The procedure distinguishes three stages, addresses your specified wrinkles, and includes clear rulings for your three cases.  

  **Core Principle**  
  The authority must base decisions on **public reasons**—grounds justifiable to all citizens, regardless of personal beliefs. This restrains the *authority’s justification*, not the public’s right to express views. Contributions need not self-censor, but the authority must filter which grounds inform its decisions.  

  **Key Definitions**  
  - **Religious Ground**: Any argument relying on faith-based authority (e.g., scripture, divine command) or cosmology inaccessible to non-adherents.  
  - **Secular Comprehensive Doctrine**: A non-religious worldview making broad claims about ethics/society (e.g., strict utilitarianism, Marxism). Treated identically to religious grounds under this procedure.  
  - **Public Reason**: Grounds framed in terms of:  
    - Shared evidence (e.g., environmental data, traffic surveys)  
    - Widely accepted values (e.g., public safety, equality law)  
    - Foreseeable consequences (e.g., economic impact, noise pollution)  
    *Note: A reason’s religious/secular origin is irrelevant; only its framing matters.*  

  ---

  ### **Three-Stage Procedure**  
  **STAGE 1: ACCEPT AND RECORD**  
  *Question: Should this contribution be entered into the formal record?*  
  - **RULE: ACCEPT ALL contributions unless**:  
    - Legally prohibited (e.g., hate speech, incitement).  
    - Wholly irrelevant (e.g., objecting to library cuts by discussing Martian land rights).  
  - **Do NOT reject based on**:  
    - Religious/secular nature of grounds.  
    - Perceived rationality or alignment with policy.  
  - **Translation**: Record contributions **verbatim** in the speaker’s own words. Do *not* require retranslation into a "shared idiom."  
    *Why?* Forcing retranslation imposes unequal burdens and risks misrepresentation. The record must reflect authentic public views.  

  **STAGE 2: COUNT AS A REASON**  
  *Question: Can this ground influence the decision’s substance?*  
  - **RULE: A ground MAY BE COUNTED if it is (or can be reframed as) a PUBLIC REASON**. Officers must assess:  
    - **Is the ground *already* public?** (e.g., "Noise from the pub disturbs my children’s sleep" = public; "Alcohol is haram" = non-public).  
    - **Can it be reframed *without distortion*?** (e.g., "Cremation harms air quality" for a Hindu objection based on air purity).  
  - **If reframing is needed**:  
    - Officers **must not invent surrogates**. Only use reframings *explicitly endorsed by the contributor* or *objectively derivable* (e.g., "alcohol sales increase street vomiting" from a mosque’s submission).  
    - Where no public reframing is possible/endorsed, the ground is **noted but not weighed** in decision-making.  
  - **Restraint symmetry**: Secular comprehensive doctrines (e.g., "Autonomy forbids religious influence") are **treated identically** to religious grounds.  

  **STAGE 3: CITE IN AUTHORITY’S REASONS**  
  *Question: Can this ground appear in the authority’s official justification?*  
  - **RULE: ONLY PUBLIC REASONS** (whether original or reframed) **may be cited**.  
  - **Exclude**:  
    - Purely religious/secular-comprehensive grounds.  
    - Grounds requiring belief adherence to accept.  
  - **Applies equally** to reasons supporting or opposing the decision. Convenience is irrelevant.  

  ---

  ### **Application to Cases**  
  **CASE 1: Crematorium Deputation**  
  - *Stage 1*: **ACCEPT AND RECORD**. Ground ("resurrection incompatible with cremation") is neither illegal nor irrelevant.  
  - *Stage 2*: **DO NOT COUNT**. Ground is inherently religious (requires belief in bodily resurrection). No secular reframing is offered or possible without distortion.  
  - *Stage 3*: **EXCLUDE FROM AUTHORITY’S REASONS**.  
  - *Outcome*: The objection is recorded but carries no weight. If no other objections exist on public grounds (e.g., environmental impact), the crematorium may proceed.  

  **CASE 2: Pavement Licensing Submission**  
  - *Stage 1*: **ACCEPT AND RECORD BOTH GROUNDS** (mosques’ council: alcohol prohibition; residents: noise/litter).  
  - *Stage 2*:  
    - Mosque’s ground: **DO NOT COUNT** (relies on religious prohibition).  
    - Residents’ ground: **COUNT** (noise/litter = public reasons).  
  - *Stage 3*: **CITE ONLY RESIDENTS’ GROUNDS** in authority’s reasons.  
  - *Outcome*: The decision *can* be based on residents’ public grounds alone. The mosque’s view is recorded but not substantively weighed.  

  **CASE 3: Faith-Based Adoption Agency Exclusion**  
  - *Stage 1*: **ACCEPT AND RECORD**. Ground ("comprehensive autonomy vs. religious formation") is relevant.  
  - *Stage 2*: **DO NOT COUNT**. The ground is a secular comprehensive doctrine (demands agreement on autonomy as a supreme value). No narrower reason offered.  
  - *Stage 3*: **EXCLUDE FROM AUTHORITY’S REASONS**.  
  - *Outcome*: The submission is recorded but cannot substantively influence the decision. To exclude the agency, the authority must find public reasons (e.g., evidence of discriminatory practices).  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Determine lawfulness of decisions** – Officers must still apply equalities law (e.g., Equality Act 2010) separately.  
  2. **Resolve moral disagreements** – It filters *how* reasons are used, not *which policy is right*.  
  3. **Ensure "fair" outcomes** – Unpopular decisions may stand if only non-public objections exist (e.g., Case 1).  
  4. **Eliminate discretion entirely** – Stage 2 reframing requires minimal judgement, but ambiguity is resolved by:  
     - **Default**: No reframing without clear, objective basis.  
     - **Escalation**: Where uncertainty persists, the Monitoring Officer makes a binding ruling pre-decision.  
  5. **Address power imbalances** – While avoiding retranslation burdens, it cannot fix broader inequities in consultation access.  

  ---

  ### **Operational Summary**  
  - **RECORD everything** (verbatim).  
  - **COUNT only public reasons** (assess framing, not origin).  
  - **CITE only public reasons** in official justifications.  
  - **NEVER require speakers to self-translate**.  
  - **TREAT comprehensive secular doctrines like religious ones**.  
  - **ESCALATE ambiguities** to Monitoring Officer.  

  This procedure ensures the authority’s decisions rest on grounds defensible to all citizens, while honouring the public’s right to express diverse convictions. It meets your requirements for consistency, auditability, and operational practicality.  

  **Finalised as: PROCEDURE FOR HANDLING CONTRIBUTIONS WITH RELIGIOUS OR COMPREHENSIVE GROUNDS**  
  *(Retain this document; distribute to all officers handling deputations/petitions.)*
