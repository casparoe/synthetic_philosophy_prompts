answer: |-
  You've built an elegant trap, I'll grant you that. But the hinges swing on a separation I reject. Here's why your case doesn't crack the feeling-centric view:

  First, your "pleasant pain with compulsive aversion" scenario smuggles in the badness *elsewhere*. If the *sensation itself* genuinely feels like warm sun – pleasant, welcome, non-intrusive – then the "make it stop" impulse *isn't a response to the pain's badness*. It's an alien compulsion, a glitch or conditioned reflex *about* the sensation, not *in* it. Think of someone with OCD washing hands they *feel* are clean: the badness is in the anxiety *driving* the compulsion, not the sensation of water. The pills, the button-smashing? Those aren't evidence the *pain* is bad; they're evidence of a separate, intrusive *aversion-state* – perhaps an anxiety disorder or a neurological misfire – parasitizing a neutral or even positive sensation. That aversion-state *itself* might feel unpleasant or distressing, but *that's* the locus of the badness, not the original sun-like pain. The "fight" is bad because the *aversion* feels bad or is dysfunctional, not because the sensation it's fixed on is intrinsically harmful. You've relocated the badness, not eliminated the need for unpleasant *feelings*.

  Now, to your test: distinguishing "unpleasant-but-not-minding" from "minding-but-not-unpleasant" *without* words. My answer is brutal: **You can't, and it doesn't matter.** The feeling *is* the intrinsic quality. If someone exhibits all the "minding" behaviors (flinching, withdrawing, seeking escape) while sincerely reporting *zero* unpleasantness in the sensation itself (truly akin to enjoying sun or a deep stretch), then the "minding" is either performative, driven by expectation/social conditioning, or stems from a *different*, concurrent unpleasant feeling (like fear or anxiety *about* the sensation, not the sensation's quality). The *feeling* of unpleasantness is self-intimating; its presence or absence *is* what the person reports when they say it "hurts" or "feels bad." Behavior is a *proxy*, often reliable, but only because it typically *expresses* the underlying unpleasant feeling. The feeling itself is the bedrock – "what it's like" *includes* its hurtfulness. To deny this is to make the badness ghostly, detached from the actual experience.

  Finally, your "being against it": On your view, is it a feeling? If it *is* a distinct feeling (like dread or anxiety), then you've just relocated the unpleasantness. If it's *just* a disposition to act (like a reflex knee-jerk without any felt aversion), then why call it "bad"? A knee-jerk isn't bad; it's just a mechanism. The badness only enters when the disposition *feels* like something you *want* to resist – i.e., when it *feels unpleasant*. Your "being against it" only carries normative weight *if* it has a negative phenomenal character. Otherwise, it's just noise in the system. The unpleasantness *is* the feeling of being against it. They aren't separable.

  Your turn. Why isn't the compulsion in your case just *another* (unpleasant) feeling layered *on top* of the pleasant sensation? And if the aversion *isn't* felt unpleasantly, what makes its behavioral expression "bad" for the person?
