  Okay, let me start by understanding the user's situation. They just had an argument with a friend about whether contractualism can count numbers in moral decisions, specifically regarding aggregation. Now they need to teach a seminar on Scanlon's contractualism to undergrads familiar with utilitarianism and some Kant but no contractualism. The core disagreement is about two cases: one where a single person suffers 200 nights of mild sleep loss versus 200 people each suffering one night. The user believes contractualism can treat these differently by focusing on burdens within a single life rather than summing across lives.

  First, I need to plan how to structure the seminar. The user wants to build around their argument with the friend. The key is making the distinction between intra-life composition and inter-life summing intelligible. So, I should start by introducing contractualism's basics without assuming prior knowledge. Emphasize the central idea: principles that no one could reasonably reject, focusing on individual standpoints. 

  Next, contrast with utilitarianism. Undergrads know utilitarianism, so highlighting how it aggregates all happiness/suffering across people versus contractualism's individual complaints would clarify the difference. Use the noise case as a concrete example. Break it down: Case A (one person, 200 nights) versus Case B (200 people, one night each). Explain why in Case A, that person has a serious complaint due to cumulative burden, while in Case B, each person's single night is minor, so no strong individual complaint. 

  Anticipate misconceptions. The user mentioned three: numbers never matter, any objection destroys a principle, and reasonable rejectability is about actual complaints. I need to address these at specific points. For example, when explaining reasonable rejectability, clarify it's about what's reasonable, not actual complaints. Also, stress that numbers can matter indirectly when they affect individual burdens, not as a sum.

  The closing question should test if students grasp that when burdens are equal, contractualism looks at other factors like necessity or alternatives. A case where two people have equally severe burdens, but one burden is unavoidable. The right answer is to choose based on reasons beyond individual complaints, like fairness or no better options. 

  Avoid diving into aggregation problems too deeply or other complexities. Stick to the basics, using the noise case as the anchor. Make sure to structure the seminar step-by-step, building from foundational concepts to the specific cases, addressing misconceptions as they arise naturally in the discussion. That should help students grasp the intra-life versus inter-life distinction without confusion.
answer: |-
  Here's a structured seminar plan focusing on your core disagreement, designed for second-year undergrads new to contractualism:

  **Core Objective:** Students grasp *why* Scanlonian contractualism treats the composition of burdens *within a single life* differently from summing burdens *across distinct lives*, using the noise case.

  **Seminar Structure (90 mins):**

  1.  **Foundations: What Contractualism *Is* & *Isn't* (20 mins)**
      *   **Hook:** "We judge actions right/wrong based on what people *owe* to each other. What does that mean? Kant said 'respect autonomy,' utilitarians say 'maximize happiness.' Scanlon asks: 'What principles could no one *reasonably reject*?'"
      *   **Key Pillars:**
          *   **Moral Motivation:** The desire to justify our actions to others on grounds they couldn't reasonably reject.
          *   **The Test:** A principle is wrong if there's an alternative that *anyone* could reasonably reject *less*.
          *   **The Individual Standpoint:** Focus on reasons individuals have *for themselves* to reject a principle, based on how it burdens *their life*. (Contrast sharply with utilitarianism's impersonal sum).
          *   **Reasonable Rejectability ≠ Actual Rejection:** Emphasize "reasonable" – based on generic, impersonal reasons anyone in that position could cite (e.g., "This causes me significant pain," not "I hate Tuesdays").
          *   **What it's NOT:** It's not about bargaining, actual consent, predicting complaints, or majority rule. **Head off Misconception #3 here:** Clarify "reasonable rejectability" is a normative standard, not a prediction of actual behavior.

  2.  **Introducing the Core Distinction: Within-Life vs. Across-Lives (15 mins)**
      *   **The Crucial Insight:** Contractualism cares about *how a principle impacts individual lives taken as a whole*. Burdens are assessed within the context of a single person's existence.
      *   **Analogy (Simple):** "Imagine judging the burden of carrying weight. Utilitarianism adds up all pounds carried by everyone. Contractualism looks at *each person*: 'Is *this person* carrying a heavy load that strains *them*?' One person carrying 200 lbs has a serious complaint. 200 people each carrying 1 lb don't have a serious complaint *individually*, even if the total weight is the same."
      *   **Why this distinction matters:** It explains *where* aggregation happens. Utilitarianism aggregates across persons. Contractualism aggregates burdens *over time and experiences* **within** a single life, but *strictly forbids* aggregating burdens *across* different lives to outweigh one person's serious burden. **Head off Misconception #1 here:** Numbers *can* matter *indirectly* if they change the nature of an *individual's* burden (e.g., being the *only* one excluded), but contractualism doesn't sum minor burdens across many to outweigh a major burden to one.

  3.  **The Anchor Case: Factory Noise (30 mins)**
      *   **Present both scenarios clearly:**
          *   **Case A (Single Resident):** Factory noise causes mild sleep loss (minor burden) to *one resident* for *200 consecutive nights*.
          *   **Case B (200 Residents):** Factory noise causes mild sleep loss (same minor burden) to *200 different residents*, each for *only one night*.
          *   **Shared Features (Crucial):** Same *type* and *intensity* of burden per night. No catastrophic harm. No prior consent. No risk of greater harm. Equal total "burden-units" if summed.
      *   **Contractualist Analysis:**
          *   **Case A:** Ask students: "What's the resident's complaint *over their life as a whole*?" Guide them: Chronic sleep deprivation = significant health risk (fatigue, weakened immune system, stress), reduced quality of life, constant annoyance. *Within this one life*, minor burdens *compose* into a serious, objectionable burden. This resident has **strong grounds to reasonably reject** a principle allowing this.
          *   **Case B:** Ask: "What's the complaint of *any single resident*?" Guide them: One mildly bad night is annoying but not life-altering. It's a minor hiccup. *Within each individual life*, the burden is small and isolated. **No single resident has strong grounds to reasonably reject** a principle allowing this *based on their own burden*. The fact there are 200 people *doesn't create a single complaint stronger than "I had one bad night."* **Head off Misconception #2 here:** Someone *can* object, but the question is whether that objection is *reasonable* given the minor nature of *their individual* burden. Contractualism doesn't require unanimity, but a principle allowing Case B likely isn't *reasonably rejectable* by any single individual *based on this burden*.
      *   **Conclusion:** Contractualism sees these as *morally distinct* because Case A creates a serious burden *within one life*, giving strong grounds for reasonable rejection, while Case B does not create any serious burden *within any individual life*, so no strong grounds for rejection exist. Total "burden-units" are irrelevant.

  4.  **Addressing Challenges & Nuances (15 mins)**
      *   **"But isn't the community harmed in Case B?"** Contractualism focuses on *individual standpoints*. Community harm must be traceable to individual burdens. If no individual has a serious burden, "community harm" isn't a sufficient reason *for any individual to reject* the principle *if they are only mildly burdened*. (Link back to impersonal reasons).
      *   **"What if the one night was worse?"** Acknowledge thresholds matter. If the single night was *moderately* bad (e.g., severe migraine), some residents *might* have a stronger case. But the core point holds: the complaint is always assessed *within the individual life*. The key is comparing *the worst-off individual's burden* under different principles.
      *   **Recap Distinction:** "Composing within a life = YES (Case A). Summing across lives = NO (Case B)."

  5.  **Closing Question & Synthesis (10 mins)**
      *   **Question:** "Imagine a life-saving drug is scarce. Giving it to Patient X relieves their constant, severe, untreatable pain (but doesn't cure the underlying fatal condition). Giving it to Patient Y cures their otherwise fatal disease (but they feel no pain). According to contractualism, who should get the drug? *Assume the *severity of burden* from dying (Y) and living in severe pain (X) are judged to be equally strong grounds for reasonable rejection.*"
      *   **Purpose:** Tests if they grasp:
          1.  Contractualism focuses on individual burdens (both have equally strong *individual* complaints).
          2.  When burdens are *equally* severe/rejectable, contractualism *doesn't* simply collapse. It needs to look for *other reasons* within the framework:
              *   Are the principles generating these burdens different? (Is one burden avoidable? Is one principle uniquely necessary?)
              *   Is there a relevant difference in their situations? (E.g., is the pain *caused* by an injustice?)
              *   Are there alternative principles that *minimize* the strongest individual complaint? (Neither principle avoids a severe burden here).
          *   **Key Insight:** Contractualism struggles with "Tie-Breaking" when individual burdens are truly equal and unavoidable under any principle. The answer *might* be that *either* choice is permissible, or that factors beyond direct burden comparison (like the nature of the harm – death vs. suffering? – though you said assume equal severity) become relevant, *or* that we need to look at the principles governing scarcity itself. The point is to see them grapple with the *limits* of the "individual burden comparison" model when burdens are equally rejectable. It shows the framework doesn't automatically tell you to flip a coin or sum numbers.
      *   **Synthesis:** Recap the core insight: Contractualism's focus on *individual lives* and *reasonable rejectability based on personal burden* explains why it treats Case A and Case B differently, even with equal total burdens. It prioritizes preventing serious burdens to individuals over preventing many scattered minor ones.

  **What to Explicitly Refuse to Go Into at This Level:**

  *   **Deep dives into other aggregation problems:** Especially the "Rule of Rescue" or large-number cases where many minor burdens *might* intuitively seem to outweigh one major one (e.g., saving one life vs. preventing millions of headaches). Stick to your noise case as the clear anchor.
  *   **Meta-ethical justifications:** *Why* does Scanlon think the individual standpoint is fundamental? Don't debate the foundations, just explain the structure.
  *   **Detailed comparisons with other contractualists:** (e.g., Rawls, Hobbes). Keep it focused on Scanlon's "What We Owe to Each Other" model.
  *   **Sophisticated objections about "composability":** E.g., "How minor is too minor to compose?" or "What about intermittent burdens?" Keep it at the level of your clear case. Acknowledge thresholds exist but don't dissect them.
  *   **The "Numbers Problem" proper:** While related, your noise case is the essential building block. Don't jump to the classic "One vs. Five" trolley-style numbers problem. That's a *next step* after firmly grasping the within-life vs. across-lives distinction.

  This plan builds logically, uses your core case effectively, anticipates and counters key misconceptions at the right moments, and provides a challenging closing question that reinforces the core concepts while highlighting a boundary of the theory. Good luck!
