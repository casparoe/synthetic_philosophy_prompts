  1. **Does the patch change the set of axioms or inference rules?**
     - If yes, we must check that the new axioms/rules are acceptable.
     - Sufficient answer: The new axioms are conservative over T (i.e., they don't prove any new theorems in the language of T) OR they are a reflection principle that is known to be safe (like adding Con(T) but with care) OR they are a bounded soundness principle (e.g., for proofs of up to a certain length). 
     - If it fails: Block if it adds an unrestricted reflection rule (like A) without any restriction). Escalate if it adds a reflection principle that might be safe (like B) so that we can consider the implications. Allow with condition if it is conservative and we have a proof (but we are not proof theorists, so we might need to rely on external review or known safe extensions).
     - What this step can't catch: It might not catch a change that indirectly allows an unsound rule (e.g., via a proof cache that caches an unverified proof).

  2. **Does the patch change the proof verification process (e.g., caching, faster verifier)?**
     - If yes, we must ensure that the verification process remains sound (i.e., only valid proofs are accepted).
     - Sufficient answer: The change does not skip verification of any step in the proof, except for steps that have been previously verified and stored in a way that guarantees their integrity (like a cache that only stores theorems that were fully verified at least once). For a faster verifier, we need assurance (e.g., by a trusted expert) that the algorithm is correct.
     - If it fails: Block if it skips verification for new proofs (like caching unverified steps). Escalate if the change is complex and we cannot be sure (e.g., a new verifier algorithm). Allow with condition if we have a way to audit the cache or if the cache is only for theorems that were previously verified and the cache is tamper-proof.
     - What this step can't catch: A subtle bug in the verifier that might accept invalid proofs.

  3. **Does the patch allow the system to use a different theory (or a different version of itself) to verify proofs?**
     - This is about the theory in which the proof is checked. For example, if Marrow is modified to use a successor theory T' (like T+Con(T)) to check proofs, then we must ensure that T' is trustworthy.
     - Sufficient answer: The new theory T' is a conservative extension of T OR we are willing to accept the additional assumption (like Con(T)) and we have considered the risks (e.g., by escalating to a values call). Additionally, we must ensure that the system does not use T' to prove its own soundness in a circular way.
     - If it fails: Block if the new theory is clearly inconsistent (e.g., T + ¬Con(T)) or if it adds an unrestricted reflection rule. Escalate if it adds a consistency statement or a bounded reflection principle (because we must decide if we trust that).
