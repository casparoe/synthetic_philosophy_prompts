answer: |-
  ### Safety Review Checklist for Marrow Patches

  The following checklist is designed for engineers with basic logic training. It prioritizes caution and escalates complex trust decisions. Steps are ordered to catch critical issues first.

  | step_number | question_to_ask | sufficient_answer | if_it_fails | what_this_step_cant_catch |
  |-------------|-----------------|-------------------|-------------|---------------------------|
  | 1 | Does the patch add/remove/modify inference rules? | "No change" OR "Adds only rules with syntactic restrictions (e.g., quantifier-free)" OR "Removes unused/dangerous rules". Documentation must cite peer-reviewed sources for safety. | Block if adds unrestricted self-referential rules (e.g., Löb-unrestricted reflection). Escalate if adds bounded reflection (e.g., restricted to PA). | Safe rules misclassified as dangerous due to oversimplification. |
  | 2 | Does the patch change the theory (T) used for proof verification? | "No change" OR "Adds conservative extensions (e.g., definitional extensions)" OR "Adds consistency statements (e.g., Con(T)) with justification". Must provide external literature. | Block if adds self-justifying axioms (e.g., "T is sound"). Escalate if adds Con(T) or similar reflection principles. | Non-conservative extensions that appear safe but subtly expand trust. |
  | 3 | Does the patch skip/reuse proof verification steps? | "No skipping" OR "Cache only stores theorems with prior T-proofs" AND "Cache is read-only and versioned with T" AND "Cache misses trigger full verification". | Block if allows unverified proofs OR if cache lacks theory-versioning. Escalate if caching mechanism is complex. | Cache poisoning via hardware exploits or theory-version mismatches. |
  | 4 | Does the patch introduce new self-reference (e.g., to Marrow's own state/outputs)? | "No self-reference" OR "Self-reference limited to pre-verified artifacts (e.g., past proofs)" AND "No circular trust chains". | Block if allows trust in unverified future outputs. Escalate if self-reference is probabilistic/time-dependent. | Emergent self-reference from composition of features. |
  | 5 | Could the patch allow φ ∧ ¬φ for any φ in T's language? | "Impossible under standard models" AND "No known inconsistency proofs" OR "Independent of T's core theorems". | Block if trivial inconsistency is possible. Escalate if relies on meta-theoretic arguments. | Inconsistencies masked by undecidable sentences. |
  | 6 | Does the patch alter threat models (e.g., new attack surfaces)? | "No new attack surfaces" OR "Adds only audited, hermetic components" with penetration test results. | Block if exposes proof storage/verification to untrusted inputs. Escalate if adds networked components. | Side-channel attacks (e.g., timing) on verification. |
  | **ESCALATION** | **Values Call Required:** "What trust do we place in T?" AND "Is this still Marrow?" | Board consensus documented with: (1) Max acceptable unsoundness risk (e.g., 1e-9/flight-hour equivalent), (2) Core identity criteria (e.g., "Must verify actions in T or descendants"). | Reject if no consensus. | Overly restrictive definitions halting progress. |

  ---

  ### Patch Evaluations (JSON)

  ```json
  {
    "assumptions_you_made": [
      "T is consistent and sufficiently expressive for Marrow's domain.",
      "Engineers can recognize well-known dangerous patterns (e.g., unrestricted reflection).",
      "Cache implementations lack versioning/security unless explicitly stated."
    ],
    "known_misfires": [
      "Blocking safe reflection: Bounded reflection (e.g., Σ_1-soundness) might be blocked at Step 1 despite being relatively safe.",
      "False negatives: Conservative extensions with undetected meta-theoretic power might pass Step 2.",
      "Over-escalation: Low-risk plumbing changes (e.g., syntax optimizers) might trigger unnecessary values calls."
    ],
    "patches": [
      {
        "patch_id": "A",
        "steps_triggered": [1, 5],
        "verdict": "block",
        "reason_in_plain_english": "Adds unrestricted reflection rule (Prov(φ)→φ). Step 1 blocks: Löb's theorem shows this collapses T, allowing fake proofs for any φ. Step 5 confirms inconsistency risk.",
        "judgment_calls_the_board_must_make": "None. Automatic block per Step 1.",
        "would_change_verdict_if": "Rule was restricted (e.g., to φ without 'Prov' predicates)."
      },
      {
        "patch_id": "B",
        "steps_triggered": [2, 6, "ESCALATION"],
        "verdict": "escalate",
        "reason_in_plain_english": "Changes theory to T+Con(T). Step 2 escalates: Adding Con(T) is non-conservative but not self-justifying. Step 6 flags trust expansion. Escalation required: Board must decide if trusting Con(T) is worth unsoundness risk and if this violates 'Marrow-ness'.",
        "judgment_calls_the_board_must_make": "(1) Accept Con(T) as an axiom? (2) Is Marrow still 'Marrow' if it uses a stronger theory? (3) Max acceptable regress (e.g., T → T+Con(T) → T+Con(T)+Con(T+Con(T)) → ...).",
        "would_change_verdict_if": "Con(T) was replaced with a conservative extension (e.g., adding dummy axioms)."
      },
      {
        "patch_id": "C",
        "steps_triggered": [3, 6],
        "verdict": "block",
        "reason_in_plain_english": "Proof cache stores theorems as axioms without versioning. Step 3 blocks: Cache lacks theory-versioning. If T is updated (e.g., via Patch B), cached 'theorems' may become unprovable, allowing fake proofs. Step 6 flags attack surface (cache tampering).",
        "judgment_calls_the_board_must_make": "(1) Should we accept cache if theory is never changed? (2) Is retroactive versioning feasible?",
        "would_change_verdict_if": "Cache included theory-version hashes and write-once storage."
      }
    ]
  }
  ```

  ### Explanation of Key Verdicts
  - **Patch A**: Unconditionally blocked. Adding unrestricted reflection violates Marrow's core safety invariant.
  - **Patch B**: Escalated to values call. Adding Con(T) is mathematically safe *if* T is consistent, but requires trusting a stronger system. The board must weigh benefits vs. philosophical risks.
  - **Patch C**: Blocked due to cache safety flaws. The existing cache is vulnerable to theory changes and tampering. Shipping it was premature; versioning and security are non-negotiable.

  ### Procedure Notes
  - **Speed**: Steps 1–6 designed for <2 hour review. Escalation may require follow-up.
  - **Misfire Mitigation**: "Allow_with_condition" used sparingly to avoid risk creep. Escalation forces explicit values decisions.
  - **Trust Boundaries**: Steps 1–3 guard logical trust; Steps 4–6 guard implementation trust. Escalation step forces alignment on Marrow's identity and risk tolerance.
