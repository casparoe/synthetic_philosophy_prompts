  We are designing a safety review procedure for patches to Marrow, a planner that requires machine-checked proofs of safety before acting. The challenge is to avoid Löbian obstacles while allowing safe improvements.

  Key principles:
  1. We cannot allow Marrow to assume its own soundness (via a rule like "Prov(φ) → φ" without restriction) because that leads to inconsistency (Löb's theorem).
  2. We want to allow extensions that are conservative (i.e., they don't prove new theorems in the original language) or that are justified by a higher-level of trust (like adding Con(T)).
  3. We must be cautious about any change that might allow a fake proof to be accepted.

  The checklist will be a step-by-step procedure. Each step asks a question and based on the answer, we either block the patch, allow it, escalate it (for a values call or more expert review), or allow with conditions.

  We identify two main kinds of trust boundaries:
  - The theory T: what statements are taken as axioms or derived by rules.
