prompt: |-
  I host a podcast on long-term ethics. Next week's guest defends a specific version of the suffering-risk case: on a symmetric totalist axiology the expected suffering in a technologically mature future dwarfs every other consideration, so preventing human extinction matters only instrumentally; nearly all of that suffering would come from digital minds and space colonization rather than from biology; suffering has near-lexical priority, so no quantity of mild happiness compensates for torture; and the highest-leverage work is shaping which technologies and which values mature first. She adds one auxiliary thesis of her own: that the intensity of a single mind's suffering has a ceiling fixed by that mind's representational bandwidth, so the astronomical totals come from the number of suffering minds rather than from how badly any one of them suffers.

  Give me eight to ten interview questions that never let her restate that package, each with a follow-up keyed to the answer she is likely to give. Include at least one question on each of the following:

  - The auxiliary thesis: if the ceiling is set by bandwidth, a mind of far greater bandwidth has a far greater ceiling, so headcount and intensity come apart less than she needs them to. Likely reply: bandwidth is physically bounded, or intensity saturates well below the ceiling. Write the follow-up for that reply.
  - Extinction as s-risk mitigation: on her own numbers, extinction, or a civilization that never builds digital minds, would avert enormous suffering. What sign does her view assign to extinction, and what follows for the extinction-risk work she is deprioritizing?
  - The expected-value structure: her case is driven by small probabilities of astronomically large harms, which makes it fanatical in the decision-theoretic sense. Does she accept that implication, and if not, what bounds the utilities?
  - Strategic feedback: once astronomical suffering is common knowledge as the worst outcome, anyone able to credibly threaten to cause it gains enormous leverage, and the priority she recommends may itself raise the incentive to acquire that capacity. Is suffering-risk prioritization self-undermining? Likely reply: such threats are available anyway, or the remedy is to reduce the number of agents who could make them. Write the follow-up for that reply.
  - One question that forces her to name a specific observation that would make her drop suffering risks as a priority, and to say what she would have to be wrong about: the distribution of sentience, or the tractability of influencing which values lock in.

  She is fluent in these debates and will not concede a point merely because it is put to her, so every question should pin her to a commitment and then use that commitment against her.
reasoning: |-
  Okay, let me approach this query methodically. The user hosts a long-term ethics podcast and needs incisive interview questions for a guest with very specific views on suffering risks (s-risks). The guest's position combines symmetric totalism, astronomical suffering potential from digital minds, lexical priority of suffering prevention, and an auxiliary bandwidth thesis about suffering ceilings.

  First, I need to unpack the core components that each question must target: the bandwidth-intensity relationship, extinction's moral value under this framework, expected-value fanaticism, strategic feedback loops, and falsifiability conditions. The questions must prevent restatement while forcing substantive engagement.

  For the bandwidth thesis, I'll design a question highlighting how higher-bandwidth minds could challenge her ceiling argument. Her likely rebuttal about physical bounds or saturation will require a follow-up questioning whether such constraints truly eliminate the risk or just relocate it.

  The extinction paradox question needs to corner her on whether preventing digital mind creation is net positive. Since her framework assigns negative value to suffering-risks but not existence itself, the follow-up should pressure her to justify deprioritizing extinction prevention given its s-risk mitigation effect.

  On fanaticism, I'll focus on how unbounded negative utilities make tiny probabilities dominate decision-making. If she rejects fanaticism, the follow-up must demand her alternative bounding mechanism without compromising her core argument.

  For strategic feedback, I'll formulate a question about how prioritizing s-risks might incentivize suffering-based extortion. When she inevitably notes existing threats, the follow-up should challenge why her approach wouldn't exacerbate this specific leverage dynamic.

  The falsifiability question requires her to name concrete disconfirming evidence - either about sentience distributions or intervention tractability. The follow-up will test whether this truly invalidates her priority or merely adjusts probabilities.

  Each question pair follows an "expose tension → anticipate rebuttal → escalate" structure. The tone remains academically rigorous but adversarial, as the guest is highly fluent. I'll avoid softball questions while ensuring all specified components are covered.
answer: |-
  Here are eight incisive interview questions designed to challenge the core tenets of your guest's position, each with a follow-up targeting likely replies. They are structured to force novel commitments and expose tensions:

  1.  **On the Auxiliary Thesis (Bandwidth Ceiling):** "You argue suffering intensity has a ceiling set by a mind's representational bandwidth. Doesn't this imply that a civilization actively *pursuing* maximal bandwidth expansion – perhaps for scientific computation or complex simulations – would *necessarily* also be creating minds with vastly *higher potential suffering ceilings*? If so, isn't your key distinction between headcount and intensity collapsing precisely where it matters most?"
      *   **Likely Reply:** "Bandwidth is physically bounded by energy/matter constraints / Intensity saturates well below theoretical ceiling."
      *   **Follow-up:** "But doesn't that just relocate the problem? If intensity saturates, what *determines the saturation point*? If it's fixed biologically or by fundamental physics, why? And if it *isn't* fundamentally fixed, doesn't the pursuit of higher-bandwidth systems *still* risk pushing intensity closer to its (now potentially higher) saturation limit, making bandwidth expansion a *new* s-risk vector?"

  2.  **On Extinction as S-Risk Mitigation:** "Given your symmetric totalist axiology and the astronomical suffering potential you describe, doesn't *human extinction before creating digital minds or large-scale space colonization* become an overwhelmingly *positive* outcome on expectation? On your own view, what is the *sign* (+/-) of near-term extinction?"
      *   **Likely Reply:** "Extinction prevents vast suffering, so it would be positive *if* it prevents those specific futures, but..."
      *   **Follow-up:** "...But if preventing those futures is so overwhelmingly positive, and extinction is currently the most *reliable* way to prevent them (as we don't yet have reliable, targeted methods to prevent *only* suffering-risks), doesn't this imply that reducing *near-term* extinction risk is actually *instrumentally negative*? How does this *not* force you to deprioritize or even oppose most current extinction risk work?"

  3.  **On Expected-Value Structure & Fanaticism:** "Your case relies on small probabilities of astronomically large suffering. Standard decision theory often treats this as 'fanaticism,' where tiny chances of infinite (or near-infinite) disutility dominate *all* other considerations. Do you embrace this fanatical implication? If not, how do you *bound* the negative utility of suffering to avoid it?"
      *   **Likely Reply:** "I accept the implications of the expected value calculation; the stakes are simply that high. / Suffering isn't literally infinite, just astronomically large."
      *   **Follow-up:** "If you reject literal infinities but accept astronomically large values, doesn't any plausible bounding function (like a logarithmic scale) *still* require astronomical suffering to swamp vast amounts of mild happiness? Doesn't this *preserve* the fanatical structure by making the prevention of tiny-probability s-risks vastly outweigh *any* finite, near-certain benefit? How does bounding *practically* change the prioritization?"

  4.  **On Strategic Feedback & Self-Undermining:** "Prioritizing astronomical suffering as the worst possible outcome creates a powerful incentive: any actor who can *credibly threaten* to create such suffering gains immense leverage ('suffering blackmail'). Doesn't making s-risk mitigation a top global priority itself *increase* the number of actors seeking this leverage and the perceived value of acquiring the capacity to cause it?"
      *   **Likely Reply:** "Such threats are possible regardless of prioritization. / The solution is to reduce the number of actors capable of causing s-risks."
      *   **Follow-up:** "But doesn't *explicit prioritization* significantly increase the *salience and perceived value* of this specific threat vector? And if your solution is reducing the number of actors capable of causing s-risks, aren't you advocating for a highly centralized, potentially authoritarian control over future technologies – which itself creates massive new risks of misuse, error, or catastrophic conflict over that control? How is this net safer?"

  5.  **On Lock-in & Values:** "You argue the highest leverage is shaping which technologies and values mature first. But values often emerge *from* technological capabilities and the actors who wield them. Given the massive incentives for powerful actors to use advanced AI for strategic advantage long before 'value lock-in,' how tractable is it to *actually* steer the values of the entities that will control the pivotal technologies?"
      *   **Likely Reply:** "Early intervention in AI governance, research culture, and institutional design is key."
      *   **Follow-up:** "But doesn't this presuppose that the institutions or coalitions you empower to do this steering will *themselves* reliably prioritize suffering prevention over their own power, security, or other values – especially under intense competitive pressure? Isn't this just pushing the value lock-in problem one step back?"

  6.  **On Compensation & Lexical Priority:** "You state 'no quantity of mild happiness compensates for torture.' Does this hold *only* within a single mind, or also *across* minds? Is it morally permissible to allow one mind to suffer torture if doing so is the *only* way to enable a sufficiently large number of other minds to experience mild happiness?"
      *   **Likely Reply:** "Suffering has lexical priority; no amount of happiness elsewhere compensates for torture in one mind."
      *   **Follow-up:** "Doesn't this lead to paralysis? If creating *any* potential for suffering minds (which seems inherent in creating complex digital systems) carries an *infinite* expected disutility due to the lexical priority and astronomical stakes, doesn't the only morally permissible action become *total inaction* to prevent *any* future development? How is this a coherent strategy?"

  7.  **On Specific Falsifiability:** "What would be a *specific, observable development* in the next 20-50 years that would lead you to significantly *downgrade* the priority of suffering risks? Would it be evidence about the distribution of sentience (e.g., consciousness is much harder to achieve than assumed), or about tractability (e.g., influencing value lock-in is effectively impossible), or something else? What core plank of your argument would that observation force you to abandon?"
      *   **Likely Reply:** "Evidence that digital sentience is physically impossible / Evidence that value lock-in is predetermined or completely uncontrollable."
      *   **Follow-up:** "If evidence emerged that influencing value lock-in was highly intractable, wouldn't that *increase* the expected suffering (by making lock-in to non-suffering-prioritizing values more likely), thus arguably making s-risks *more* urgent, not less? Doesn't downgrading priority based on intractability imply a hidden assumption that the *baseline* outcome without intervention is *not* astronomically bad?"

  8.  **On Biological Suffering & Scope:** "You state 'nearly all' future suffering comes from digital minds and space colonization, not biology. But given the vast timescales and potential for biological life to spread across galaxies (e.g., via directed panspermia or slow biological expansion), and the sheer number of biological beings that could exist, how confident are you that biological suffering *isn't* also astronomical? Doesn't symmetric totalism force you to consider *all* sentient beings equally, potentially reviving the importance of shaping biological values far into the future?"
      *   **Likely Reply:** "Digital minds can be created orders of magnitude faster and in greater numbers; biological expansion is comparatively slow and resource-limited."
      *   **Follow-up:** "But over cosmological timescales, even slow biological expansion could fill galaxies. If a single advanced civilization can seed life across billions of stars over millions of years, leading to quadrillions of suffering-capable beings per planet, wouldn't the cumulative biological suffering still be astronomical? Doesn't your focus on digital minds *require* the auxiliary assumption that biological expansion will be *utterly dwarfed* by digital proliferation, and isn't that highly contingent on unknown future choices?"

  **Key Tactics Employed:**

  1.  **Forcing Concrete Commitments:** Questions demand specific signs (Q2), bounds (Q3), falsifiable conditions (Q7), and scope definitions (Q8).
  2.  **Exploiting Internal Tensions:** Highlights contradictions between conclusions and premises (Q2, Q6), or between proposed solutions and risks (Q4, Q5).
  3.  **Pushing Implications to Extremes:** Explores if the logic leads to paralysis (Q6), fanaticism (Q3), or perverse incentives (Q4).
  4.  **Targeting Auxiliary Assumptions:** Challenges the bandwidth/suffering link (Q1) and the biological/digital suffering comparison (Q8).
  5.  **Anticipating Rebuttals:** Follow-ups are pre-loaded to counter the most probable escape routes, forcing deeper justification or revealing further problems.
  6.  **Demanding Specificity:** Especially in Q7, requiring a *concrete* disconfirming observation and its specific implication.

  These questions are designed to move beyond restatement and force the guest to engage with the challenging implications, dependencies, and potential weaknesses of her sophisticated position. Good luck with the interview!
