prompt: |-
  I'm giving a seventy-minute talk next month at a law-and-philosophy workshop — about twenty minutes of questions at the end — and I want a Q&A prep sheet, not a defense of the view or an assessment of whether it's true.

  The position I'm defending, which I've been calling relational answerability: I read the question of which variety of free will is worth wanting as a question in conceptual ethics — which concept of responsibility should we keep, reform, or discard and institutionalize — and my answer is that what's worth wanting is not a property of agents at all. Not leeway or alternative possibilities, not sourcehood or ultimacy, and not even moderate reasons-responsiveness construed as a desert base. It's a status an agent holds inside a practice of mutual accountability: being someone to whom demands can be addressed and from whom answers are owed. The argument runs in three steps. First, a functional claim about what the practices of blame, resentment, excuse and apology actually do — coordinate expectations and transmit norms — and a claim that they can do that without desert. Second, a conservative-reform claim: when a practice is under pressure, keep the parts whose benefits are demonstrable and drop the parts whose justification can't be given, and on that test the forward-looking, answer-eliciting functions survive while backward-looking desert does not. Third, a claim about manipulation arguments: their force depends on the thought that manipulation changes something intrinsic in the agent, whereas on my view what manipulation damages is the relationship, which is why the law already treats coercion and exploitation as excusing or mitigating — so the manipulation argument is an objection from inside the practice rather than from outside it. I'm aware that answerability already has a use in the tripartite account of responsibility and that the relational move sounds close to the second-personal account; I gesture at both in the talk and don't settle either, which I suspect is where I'll get hit.

  The room is about fifteen people, roughly half criminal law scholars — three of them retributivists for whom desert is the whole point of punishment, two who work on excuse and mitigation doctrine and think in terms of duress, provocation and diminished capacity — and roughly half philosophers: one hard incompatibilist in the Pereboom mold who thinks the reactive-attitudes move changes the subject rather than answering it, one reasons-responsiveness compatibilist who will want to know what my view says about the capacities an agent has to have in order to be answerable at all, and two experimental philosophers who run studies on folk attributions in manipulation and bypassing cases and who think the folk want alternative possibilities.

  What I want: the eight or so objections I'll actually get, in the order I'll get them, not the ones I'd get from a room of metaphysicians. Phrase each one the way that particular person would say it out loud rather than in my vocabulary — the retributivist's version, the excuse scholar's version, the incompatibilist's version — and give me for each a reply I could say in about two minutes, a note on where that reply is soft or quietly evasive, and a judgment about which objections have real force and which I can answer and move past. Say what I should concede in the first two minutes, before anyone asks anything, and which single reply has to land if the view is going to survive the session. My third step is the one I feel best about, so attack it specifically and tell me what it can't handle. Finish with the question I'm hoping nobody asks.

  Write the whole thing as continuous prose, the way you'd write it in an email to a colleague: no headings, no bullet points, no bold, no tables, and signal the ordering with transitions rather than numbers or layout. Open by naming, in a sentence or two, the objection you think will do me the most damage and why.
reasoning: |-
  Okay, the user is preparing for a Q&A session after a talk on relational answerability. They want a prep sheet focused on potential objections from a mixed audience of legal scholars and philosophers. The key is to anticipate real-world objections, not just theoretical ones, and provide concise replies.

  Hmm, the user's view challenges traditional free will concepts by shifting responsibility to relational practices. The audience includes retributivists, excuse scholars, and philosophers with varying stances. The most damaging objection likely comes from retributivists who see desert as fundamental to criminal law. 

  Let me structure this. First, identify the most critical objection - the retributivist's challenge about desert being indispensable. Then outline other objections in probable order: the excuse scholar's operational concern, the reasons-responsiveness compatibilist's capacity question, the incompatibilist's subject-changing critique, the experimental philosopher's folk intuition argument, and possible relational view conflations. 

  For each objection, I'll craft a verbal quote mimicking how that person might speak. The replies should be two-minute responses with tactical concessions and soft spots noted. The manipulation argument defense (step three) needs special stress-testing - perhaps with covert manipulation cases. The "hope nobody asks" question should target the core vulnerability: whether relational answerability can truly replace desert-based practices.

  The opening concession is crucial: upfront acknowledge desert's intuitive pull while denying its justificatory necessity. The must-land reply is the functional claim about practices working without desert. Throughout, maintain natural prose flow as requested.
answer: |-
  Here’s how I’d prep you for that room, based on the dynamics you’ve described. The objection that could do the most damage comes from your retributivist colleagues, specifically the one for whom desert is non-negotiable. They’ll argue that stripping desert from responsibility evacuates the core moral significance of practices like blame and punishment, rendering them merely instrumental and failing to capture the deep intuition that wrongdoers *deserve* to suffer for their actions – an intuition they’ll claim is foundational to law and morality. This hits hardest because it attacks the *point* of the entire project for them; if desert is essential, your functional/conservative reform argument collapses at the first step.

  Before anyone even asks, concede this openly in your first minute: "Let me start by acknowledging the powerful intuitive pull of desert. When we resent a wrong done to us, it *feels* like the wrongdoer deserves that resentment, and perhaps more. My argument isn’t that this feeling is unreal or unimportant, but that it isn’t a *justificatory foundation* we can successfully build or defend a practice on when pressed. The work of holding accountable can be done – and done with moral seriousness – without that metaphysical commitment." This preempts the desert elephant in the room and frames the debate about justifiability, not phenomenology.

  The first objection will likely come from a retributivist, phrased bluntly: "If there’s no desert, what’s left? You’re reducing blame to social engineering or etiquette – telling someone ‘that wasn’t okay’ and asking for an apology, but stripping out the moral *sting*, the sense that they truly *ought* to feel bad for what they did. Doesn’t that make resentment itself irrational? And doesn’t the law *need* that sting to mark the gravity of wrongs?" Your two-minute reply: "The sting isn’t in the desert, it’s in the *demand* itself and the impaired relationship. Calling someone to account *is* the serious moral act – it asserts the norm’s validity and the victim’s standing. The ‘sting’ comes from being confronted with the fact that you violated a shared norm and damaged a relationship of mutual regard. That *is* the moral gravity. The law marks gravity through the seriousness of the demand and the consequences attached to failing to answer adequately – deterrence, incapacitation, rehabilitation – all forward-looking responses consistent with the practice’s function." **Soft Spot:** This doesn’t fully satisfy the retributivist’s deep intuition that *suffering* (not just confrontation) is intrinsically deserved. You’re changing the subject from what they see as the core moral fact. **Verdict:** You can answer and move past *in this session* by reframing gravity, but the fundamental disagreement remains.

  Next, an excuse/doctrine scholar will ask, operationalizing the retributive worry: "Okay, but how does this actually work in doctrine? Take duress: we mitigate punishment because the threat *overwhelms* the agent’s capacity, making them less blameworthy in a desert sense. On your view, why mitigate? Because they couldn’t answer the demand? But if the demand is just ‘why did you do it?’, the answer ‘I was coerced’ seems like a perfectly good answer that *ends* the accountability conversation, not just reduces it. Why partial excuse?" Reply: "It’s about the *quality* of the answer and its implications for future norm transmission. ‘I was coerced’ is a valid answer, but if coercion was only partial, or if the agent showed insufficient resistance to a norm we consider vital, the answer might be *inadequate*. We mitigate because the coercive pressure (like provocation) significantly impaired the agent’s ability to *properly* engage with the demand – to weigh the norms appropriately *in that moment*. The practice demands a fuller engagement for full consequences. Mitigation signals that while an answer is owed and the norm stands, the agent’s capacity to fully internalize and respond to it in that instance was compromised, weakening the need for the strongest forward-looking response." **Soft Spot:** This edges close to smuggling in capacity conditions under the guise of "quality of answer." **Verdict:** Answerable, moves past. Shows the view *can* engage doctrine.

  The reasons-responsiveness compatibilist will zero in: "You’re dodging capacities. To be ‘answerable,’ an agent must be *capable* of understanding the demand, grasping the relevant norms, and offering reasons in response. That sounds suspiciously like moderate reasons-responsiveness! Aren’t you just giving up on desert but keeping the same underlying capacity structure as a necessary condition for entry into the practice?" Reply: "Necessary, yes, but not sufficient as a *desert base*. Capacities are prerequisites for participating meaningfully in the *practice* of answerability, just as understanding a language is a prerequisite for a conversation. But the *status* of being answerable and the *act* of holding responsible aren’t *based on* or *deserved because of* those capacities in a backward-looking way. They are constituted by the practice itself, triggered when we *address* the demand. The capacities enable participation, but the responsibility relation is created by the address within the normative community." **Soft Spot:** This is a fine line. You *are* relying on capacities functionally. The evasion is denying they ground desert while using them to ground participation. **Verdict:** Important clarification, but the compatibilist might feel you’ve co-opted their machinery without the metaphysical payoff. Answerable.

  The Pereboom-style incompatibilist will pounce: "This doesn’t solve the fundamental problem. Manipulation arguments show that even if an agent has your ‘capacities for answerability,’ if their action is ultimately determined by factors beyond their control (or manipulated), holding them responsible is unfair. You say manipulation damages the *relationship*, but that’s changing the subject! The core objection is that determinism/manipulation shows the agent *lacks ultimacy* – they aren’t the true source. Your ‘relationship damage’ just papers over that metaphysical lack. You haven’t answered the incompatibilist challenge; you’ve retreated to a practice that ignores it." Reply: "The objection *presupposes* that ultimacy is what matters. My Step 3 argues that the *force* of manipulation cases comes *from within the practice*: we feel the relationship is damaged *because* the manipulation interfered with the normal functioning of the capacities required for mutual answerability (understanding, reasoning, non-distorted volition). The law excuses coercion *not* because the agent lacked libertarian freedom, but because the coercive pressure disrupted the conditions for meaningful normative engagement *as we understand them in the practice*. The incompatibilist is importing an external, metaphysical criterion of ultimacy that the practice doesn’t actually require or use." **Soft Spot:** This is where your Step 3 confidence is tested. Is the incompatibilist *really* just importing, or are they pointing to a genuine condition *implicit* in the practice's own standards? **Verdict:** Your strongest card. If this reply lands – showing manipulation objections *are* practice-immanent concerns about relationship conditions – you survive the metaphysical assault. Must land hard.

  The experimental philosopher (folk intuitions) will ask: "But our studies show that in manipulation cases (like Professor Plum), folk *do* appeal to alternative possibilities or the ‘true self’ being bypassed. They seem to *want* leeway or sourcehood. Isn’t your view out of step with the very intuitions that animate the practice you’re trying to conserve?" Reply: "Folk intuitions are complex and often express the *moral gravity* of the situation using available metaphysical language. When they say ‘he couldn’t have done otherwise’ or ‘it wasn’t really him,’ they are often expressing precisely the *relationship damage* I describe – the sense that the manipulation made genuine normative engagement impossible. My view offers a *better interpretation* of those intuitions, one that doesn’t commit us to metaphysically dubious leeway or ultimacy, but captures the functional core of why manipulation matters: it breaks the normal link between the agent and the norms, making the demand for answers unfair or pointless." **Soft Spot:** It’s a battle of interpretations. You might be over-rationalizing folk talk. **Verdict:** Defensible, especially if you emphasize the *functional* interpretation of their reactions.

  Someone will conflate you with the second-personal view: "This sounds just like Darwall’s second-personal account. Aren’t you just reinventing that wheel?" Reply: "Darwall is crucial, but my focus is different. He grounds responsibility in second-personal *authority* and the inherent dignity triggering obligations. I’m focused on the *functional role* of the practice of answerability itself – coordinating expectations, transmitting norms – and arguing that *this function* survives the rejection of desert or inherent authority, while also being more directly responsive to the legal/institutional concerns here. It’s a more pragmatic, practice-based take on the relational space." **Soft Spot:** You haven’t fully settled the relationship. Are you denying the foundational authority Darwall posits? **Verdict:** Quick clarification, moves past.

  Now, attacking Step 3 specifically: Here’s what it can’t handle cleanly: **Covert, non-coercive manipulation.** Imagine an agent whose preferences are subtly altered over time through undetectable neuro-manipulation (not coercion, just preference-shaping) to make them more selfish, and they then commit a selfish crime. They have the *capacities* you require (understanding, reasoning), they can *answer* the demand ("I did it because I wanted X"), and the manipulation wasn’t discovered, so the *relationship* wasn’t *known* to be damaged at the time of address. Does your view still hold them answerable? Intuitively, many feel they shouldn’t be. Your Step 3 relies on manipulation *damaging the relationship*, but if the damage is unknown and didn’t destroy core capacities (just altered content), does it count? If you say "Yes, they are answerable," you clash with intuitions about hidden unfairness. If you say "No," you need a richer account of "undamaged relationship" that includes authenticity of preference formation, edging back toward sourcehood. **This exposes the soft underbelly:** Your relational condition needs a robust, non-metaphysical account of what constitutes an "undamaged relationship of mutual answerability" that rules out covert manipulation *without* appealing to ultimacy. The law currently lacks such a doctrine, which is why this is hard.

  Finally, the question you’re hoping nobody asks: **"If answerability without desert is all there is, why is *punishment* ever justified? Specifically, why impose hard treatment – suffering – beyond the demand for answers itself? If the criminal gives a bad answer (‘I did it because I felt like it’), why is locking him in a cage for years an appropriate *response within the practice of mutual accountability*? Doesn’t this just collapse into purely forward-looking deterrence or incapacitation, abandoning any distinctive connection to *responsibility* as opposed to mere dangerousness? And if so, haven’t the retributivists won the argument about what the practice *requires* – namely, desert as the justification for punishment’s punitive core?"** This hits the legal heart of the matter. Your reply must show how hard treatment is an intelligible, non-desert-based part of the accountability practice: perhaps as a severe form of norm-reinforcement when answers are grossly inadequate, or as a necessary (regrettable) tool for maintaining the normative order when accountability fails. But the gap between "You owe me an answer" and "Therefore, I can imprison you" is vast, and bridging it without desert is your view’s greatest challenge in a room of criminal law scholars. Concede it’s the toughest issue, lean heavily on the *functional necessity* of sanction for norm transmission in a complex society when answerability fails, and admit it’s a work in progress. Survival depends on not letting this be the *last* question.

  Good luck. The desert objection is the bedrock; the punishment question is the siege engine. Land the Step 3 reply firmly, and you’ll live to refine the view another day.
