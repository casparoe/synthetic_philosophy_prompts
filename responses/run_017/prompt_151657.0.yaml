prompt: |-
  I chair the serious-incident review committee at a 600-bed teaching hospital, and I want to replace the way we write causal statements with something my committee can actually run.

  Context: we review roughly a dozen incidents a month. Every review ends in a written report with (a) a causal statement — what caused the harm to this patient — and (b) the corrective actions we will take. The report goes to the board, and for the serious ones to the regulator and potentially into litigation, so the wording has to be defensible under hostile questioning. The committee is two physicians, a risk manager, a quality-improvement nurse and me; nobody has any training in causal inference beyond a regression module years ago. We have ninety minutes per case, the incident timeline, the chart, and whatever data we already collect routinely. We cannot commission new studies, and we will not adopt a procedure that needs a statistician in the room.

  What I want is a decision procedure for the causal statement, built on the two families of account that philosophers actually dispute: counterfactual-dependence accounts in the Lewis line, on which X caused Y roughly because, had X not occurred, Y would not have; and interventionist accounts in the Woodward line, on which X causes Y because there is some intervention that sets X to a different value and changes Y with everything else held fixed. I am not asking you to adjudicate between them. I am asking you to turn what each one gives us into a checklist we can run in about fifteen minutes per claim, and to be explicit at every step about which account is doing the work, because they come apart in ways we keep tripping over.

  Design constraints:

  - Ordered questions, each with a stated sufficiency condition (what a yes has to consist in) and an explicit stop: either a hard no that kills the claim, or a flag that routes the factor elsewhere in the report.
  - The distinctions that have to survive the translation into plain English: the contrast class (caused relative to what — X at one value versus X at another, not X happened); whether the counterfactual comes out true only on a backtracking reading, that is only if we also change something upstream of X, which is the move that makes our risk scores, early-warning scores and abnormal lab values look causal when they are only tracking a common upstream condition; whether the intervention we can imagine is surgical, setting X directly and breaking the other routes into X, or only works by first changing something else that also reaches the outcome by a second route; whether the effect is invariant across the different routes by which we could set X — permanent staffing versus agency cover, automated alert versus staff training — since if the answer depends on the route, X was never one variable; whether we may test the intervention against any admissible background setting of the other factors or only against what actually happened that night, together with a bound on admissible so that we do not end up calling everything a cause; and what to do with factors nobody can set, such as the patient's age, frailty, sex, race or rural address, including the case where the honest intervention is on someone else's perception of that factor rather than on the factor itself.
  - A tie-break rule for when the two accounts disagree, and a short ladder of permitted language — cause, contributing factor, risk stratifier, marker — with the condition for each rung, because most of our arguments are really about which rung a factor belongs on.
  - Honesty about where judgment cannot be eliminated: which variables belong in the model, how far upstream we trace, how much invariance is enough, whether an intervention counts as available for us (physically possible, legally permitted, fundable by next quarter), and the gap between the general-level evidence we actually have and the single-case attribution we have to write, given that the interventionist test is naturally about what happens in general while our report is about this patient on this night. Mark those as sign-off points for me rather than as questions with answers.

  Then run the finished procedure step by step on three shapes of case from our last quarter:

  1. An abnormal set of observations on a ward round was documented but not escalated; the patient arrested several hours later. The committee wants to write that the failure to escalate caused the arrest.
  2. The patient was eighty-four and frail. The committee wants frailty named in the causal statement, because it is the thing everyone brings up in the meeting.
  3. The infusion pump was programmed at ten times the intended rate and, independently, the patient was given a second drug at a dose that would on its own have produced the same toxicity. Either would have done it alone.

  At least one of these should come out in a way the committee will dislike — my guess is that the counterfactual reading and the interventionist reading will not both give us what we want in the third case — and I want that result left as it comes out rather than softened.

  Finally, tell me plainly what the procedure cannot do: which of our recurring questions it has no purchase on, which kinds of incident it will systematically misgrade (rare events, omissions and things that did not happen, harm avoided by luck), and where it will return confident-sounding answers that are really metaphysical positions in disguise.
reasoning: |-
  We are designing a causal attribution procedure for a hospital incident review committee. The procedure must be based on two philosophical accounts: counterfactual dependence (Lewis) and interventionism (Woodward). The goal is a checklist that can be run in about 15 minutes per causal claim, with explicit steps and clear outputs.

  Design Constraints:
  - Ordered questions with sufficiency conditions and explicit stops (hard no or reroute).
  - Must handle: contrast classes, backtracking counterfactuals, surgical vs. non-surgical interventions, invariance across intervention routes, admissible background conditions, and non-actionable factors (like age, frailty).
  - Tie-break rule when the two accounts disagree.
  - Ladder of language: cause, contributing factor, risk stratifier, marker, with conditions for each.
  - Acknowledge points of irreducible judgment (variable choice, upstream tracing, invariance, intervention availability, general-to-single-case gap) as sign-off points for the chair.

  The procedure is for writing a causal statement about a specific incident (one patient, one night).

  We will then apply the procedure to three cases.

  ---

  **Causal Attribution Procedure**

  **Step 0: Define the Outcome and Candidate Cause**
  - Outcome (Y): The harm that occurred (e.g., cardiac arrest, toxicity).
  - Candidate Cause (X): The factor we are evaluating (e.g., failure to escalate, frailty, programming error).

  **Step 1: Counterfactual Dependence Check (Lewis-style)**
     - **Question 1.1:** In the actual world, did X occur (or take the value we are considering) and did Y occur?
          - *Sufficiency condition:* We are considering X in the context of the incident. If X did not occur (or did not take the value in question) in the actual world, then we cannot say X caused Y in this case. (Note: For omissions, we treat the omission as occurring.)
          - *Stop:* If no, then X cannot be a cause of Y in this incident. Reroute as a non-causal factor (e.g., marker) or drop. Proceed if yes.
     - **Question 1.2:** Consider the closest possible world where X does not occur (or takes the alternative value in the contrast class). In that world, would Y not have occurred?
          - *Contrast class:* We must specify the alternative. For example, for failure to escalate, the contrast is escalation. For frailty, the contrast might be non-frailty? (But note: frailty is not changeable in the short term.) This is tricky for immutable factors.
          - *Backtracking:* We must avoid backtracking. The counterfactual should not require changing upstream factors (e.g., if we remove frailty, we might have to change the patient's age, which is backtracking). Only allow non-backtracking counterfactuals.
          - *Stop:* If yes (Y would not have occurred without X), then X is at least a contributing factor by counterfactual dependence. If no (Y would have occurred anyway), then X is not a cause by counterfactual dependence. Proceed to Step 2 (interventionism) regardless because interventionism might still find a cause.

  **Step 2: Interventionist Check (Woodward-style)**
     - **Question 2.1:** Is there an intervention that sets X to a different value (in the contrast class) that we can imagine being performed in the context of this incident, such that if we had performed it, Y would not have occurred (or would have been less severe)?
          - *Intervention must be surgical:* It should set X directly without changing other variables that are causes of Y (except those that are effects of X). If the intervention also changes other variables that are independent causes of Y, then it's not surgical and we cannot isolate X.
          - *Admissible background:* We consider the background conditions as they were in the incident, except we can set other variables to any value that is "admissible" (within the range of what could reasonably occur). We must avoid changing factors that are fixed or part of the context (e.g., patient's age) unless the intervention is on the perception of that factor.
          - *Invariance:* We require that the effect holds across a range of interventions that set X (e.g., different ways to escalate) and across a range of background conditions (within admissible bounds). If the effect depends on the route, then X is not a well-defined variable and we may need to break it down.
          - *Stop:* If yes, then X is a cause by interventionism. If no, then X is not a cause by interventionism.

  **Step 3: Tie-Breaking and Language Ladder**
     - If both Step 1 and Step 2 agree:
          - Both yes: X is a **cause**.
          - Both no: X is not a cause. It might be a marker or risk stratifier.
     - If they disagree:
          - Step 1 (counterfactual) yes, Step 2 (intervention) no: Then X is a **contributing factor** by counterfactual dependence, but not actionable via intervention (so we note the limitation). This might happen for immutable factors or when no surgical intervention is available.
          - Step 1 no, Step 2 yes: This is rare but possible. Then X is a **contributing factor** by interventionism (but not by counterfactual). This might happen if the counterfactual fails due to overdetermination but an intervention could have prevented the outcome.

     **Ladder of Language:**
     - **Cause:** Both counterfactual and interventionist conditions are satisfied. This is the strongest claim.
     - **Contributing factor:** Only one condition is satisfied, or when both are satisfied but the factor is one of several causes (not necessary and sufficient). Also used when the factor is part of a set that together caused the outcome.
     - **Risk stratifier:** The factor is associated with the outcome but we cannot establish counterfactual dependence and no surgical intervention is available (e.g., age, frailty). It is a marker of increased risk but not a cause in the incident.
     - **Marker:** The factor is correlated but not causal. It might be a proxy for the real cause.

  **Step 4: Handle Non-Actionable Factors (e.g., age, frailty, race)**
     - For factors that cannot be changed (like frailty), the counterfactual in Step 1.2 is problematic because it requires backtracking. We must avoid backtracking counterfactuals. Therefore, for such factors:
          - Step 1.2: We cannot non-backtrackingly change the factor. So we skip the counterfactual test for these and rely on interventionism.
          - Step 2.1: We consider interventions that change the perception or management of the factor (e.g., if the patient is frail, an intervention might be to assign higher nursing ratio or use a different drug). But note: the intervention is not on frailty itself but on how we respond to it.
          - If we can find an intervention that changes the response to the factor and prevents the outcome, then we might call the factor a **risk stratifier** and the intervention target (e.g., understaffing) the cause. Alternatively, we might say the failure to account for frailty was the cause (an omission).

  **Sign-off Points for the Chair (Irreducible Judgment):**
     - Choice of variables (what is X and Y?).
     - How far upstream to trace (do we include the root cause or the proximate cause?).
     - What counts as an admissible background condition? (We must set bounds to avoid calling everything a cause.)
     - What counts as a surgical intervention? (Breaking the causal links appropriately.)
     - How much invariance is required? (Do we need evidence across multiple settings? We may have to rely on general evidence.)
     - Availability of intervention: What interventions are considered? (Physically possible, legally permitted, fundable? We must note if the intervention is not available.)
     - The gap between general evidence and single case: We may have to extrapolate from general knowledge to this case. The chair must sign off on the extrapolation.

  **What the Procedure Cannot Do:**
     - **Rare events:** If the incident is very rare, our general evidence might be weak, making interventionist claims speculative.
     - **Omissions and non-events:** These are tricky because the counterfactual is about something that didn't happen. We treat omissions as events (e.g., failure to escalate is a positive event in the causal model).
     - **Harm avoided by luck:** If an error occurred but no harm resulted due to luck, we don't have an outcome to analyze. This procedure is for incidents with harm.
     - **Overdetermination (Case 3):** When two causes each sufficient, counterfactual may say neither is a cause (because without one the other would have caused it). Interventionism might still find each as a cause if an intervention on one would prevent the outcome (if we can set one to non-harmful value, then the outcome is avoided). But note: if both are set to harmful, then we need to break symmetry.
     - **Systematic misgrading:**
          - It may misgrade cases of preemption (one cause preempts another) because the counterfactual for the preempted cause might be true only with backtracking.
          - It may misgrade when the intervention is not surgical (e.g., changing staffing might affect multiple paths) and we cannot isolate.
     - **Metaphysical positions:** The answers will reflect the chosen accounts (Lewis vs. Woodward). For example, in overdetermination, Lewis may say neither is a cause, but Woodward might say both are.

  ---

  **Application to Case 1: Failure to escalate causing arrest**

  - **Step 0:** 
     - Y: Cardiac arrest.
     - X: Failure to escalate the abnormal observations.

  - **Step 1 (Counterfactual):**
     - 1.1: Yes, X (failure) occurred and Y (arrest) occurred.
     - 1.2: Consider the closest world where escalation occurs. Would the arrest not have occurred? We assume that with escalation, the patient would have received timely intervention and the arrest would have been prevented. (Note: We must avoid backtracking. We don't change the patient's condition, only the escalation.) 
          - If the committee believes that escalation would have led to intervention and prevention, then yes. So counterfactual dependence holds.

  - **Step 2 (Interventionist):**
     - 2.1: Is there a surgical intervention that sets X (escalation) to occur? Yes: we can imagine a direct intervention to escalate (e.g., a system that forces escalation). This intervention breaks the link from the abnormal observations to no action. We hold fixed the patient's condition and the availability of treatment. Then, if we escalate, the arrest would not occur. So yes.

  - **Step 3:** Both yes. So X is a **cause**.

  - **Language:** "The failure to escalate the abnormal observations caused the cardiac arrest."

  ---

  **Application to Case 2: Frailty causing harm (in an unspecified incident)**

  We need more context. Let's assume the harm was a complication after surgery. The committee wants to name frailty as a cause.

  - **Step 0:**
     - Y: The harm (e.g., surgical complication).
     - X: Frailty (being frail).

  - **Step 1 (Counterfactual):**
     - 1.1: Yes, the patient was frail and harm occurred.
     - 1.2: Consider a world where the patient is not frail. But to make the patient not frail, we would have to change the patient's age or health history, which is backtracking. This is not allowed. Therefore, the counterfactual fails because it requires backtracking. We cannot non-backtrackingly change frailty. So we skip to interventionism.

  - **Step 2 (Interventionist):**
     - 2.1: We cannot intervene directly on frailty (it's immutable). But we can consider interventions that change how we manage frail patients. For example, we can intervene to provide enhanced monitoring or adjusted treatment. If such an intervention (e.g., assigning a higher level of care) would have prevented the harm, then we can say that the failure to provide that level of care was the cause, not frailty itself. Alternatively, if we consider an intervention that changes the perception of frailty (e.g., if we had recognized frailty and acted accordingly) then we are intervening on the recognition. But note: the intervention is not on frailty but on the response.

          In this case, if we set the response to "appropriate for frail patient" and that would have prevented the harm, then we might say that the cause was the failure to adapt to frailty (an omission). But frailty itself? We cannot surgically set frailty to non-frail.

          Therefore, for X=frailty, we cannot find a surgical intervention that sets frailty to non-frail. So Step 2.1 fails.

  - **Step 3:** Step 1 failed (due to backtracking) and Step 2 failed (no surgical intervention on frailty). Therefore, frailty is not a cause.

  - **Language Ladder:** We call frailty a **risk stratifier**. It is a factor that should have triggered a different management, but in itself is not a cause.

  - **Committee Dislike:** They want to name frailty. We explain that the cause was the failure to adjust care for frailty, not frailty itself.

  - **Sign-off:** The chair must decide whether to include the failure to adjust as a cause (which would be an omission). Then we run the procedure for that omission.

  ---

  **Application to Case 3: Double administration of toxic drugs**

  - **Step 0:**
     - Y: Toxicity.
     - We have two candidate causes:
          - X1: Programming the pump at 10x the intended rate.
          - X2: Giving the second drug at a toxic dose.

  - **Evaluate X1:**
     - Step 1.1: Yes, X1 occurred and Y occurred.
     - Step 1.2: Without X1 (i.e., with the pump programmed correctly), would Y have occurred? Yes, because X2 would have caused the toxicity anyway. So by counterfactual dependence, X1 is not a cause (because Y would have occurred without it). 
     - Step 2.1: Can we intervene to set X1 to the correct rate? Yes. If we do, then Y would not occur? No, because X2 is still present and would cause Y. So Step 2.1: No. Therefore, both say no. So X1 is not a cause? But note: if we remove X1, then the outcome is still caused by X2. But if we remove both, the outcome is avoided.

     However, we are testing each factor separately.

  - **Evaluate X2:**
     - Step 1.1: Yes.
     - Step 1.2: Without X2 (no second drug), would Y have occurred? Yes, because X1 would have caused it. So no counterfactual dependence.
     - Step 2.1: Intervene to not give the second drug. Then Y would still occur because of X1. So no.

  - **But wait:** The committee wants to say both caused it. How?

  - **Interventionism with multiple interventions:** Woodward allows for causes that are part of a set. We can consider an intervention that sets one variable to non-harmful and see if it changes the outcome. In this case, setting X1 to non-harmful does not change Y (because of X2) and vice versa. But if we set both to non-harmful, then Y does not occur. So each is INUS (an insufficient but non-redundant part of an unnecessary but sufficient condition). 

    However, our procedure tests one factor at a time.

  - **Tie-break and Language:** Since both factors fail the individual tests, we have:

     - Counterfactual: Both fail.
     - Interventionist: Both fail individually.

     But note: if we consider the set {X1, X2} then we can say the combination caused Y. We can treat the event as "double administration error" as one cause. Alternatively, we can use the language "contributing factor" because each was part of the set that caused the outcome.

  - **Revised Step for Multiple Factors:** We should allow for factors that are part of a minimal sufficient set. In this case, we can say:

     - Neither factor individually passes the counterfactual or interventionist test (if we hold the other fixed). But if we consider the set, then without both, the outcome would not have occurred. And an intervention that prevents both would prevent the outcome.

     However, our procedure is per claim. We are making two claims: one for X1 and one for X2.

  - **Output:** For each factor individually, we cannot call it a cause. But we can say:
     - Each factor is a **contributing factor** because together they caused the harm. Alternatively, we can create a new factor: "the occurrence of at least one toxic dose" and then note that both X1 and X2 are instances of that. But then we lose the individual errors.

  - **Committee Dislike:** They want to blame both individually. But the procedure says: individually, neither is a cause by the tests. So we have to use the language of contributing factor for each.

  - **Alternative:** We can note that in the actual world, both occurred. But without one, the harm would still have occurred. However, if we intervene on one, we cannot prevent the harm because the other is present. So individually, they are not causes.

  - **Philosophical Note:** This is the problem of overdetermination. Lewis would say neither is a cause (because the outcome would have occurred without either). Woodward might say that each is a cause because if we wiggle one (set it to non-harmful) while holding the other fixed, the outcome does not change? But in this case, holding fixed the other at harmful, then setting one to non-harmful doesn't change the outcome. So by interventionism, neither is a cause individually.

    But Woodward allows for causes that are part of a set. We can say that each is a cause because there is an intervention that changes the outcome by changing that variable in some contexts (but not in this one). However, for a specific incident, we are holding the background fixed.

    Therefore, for the specific incident, neither is a cause individually. The cause is the conjunction.

  - **Procedure Adjustment:** We might add a step for when multiple factors are present: If the outcome is overdetermined, then we can call each factor a **contributing factor** and note the overdetermination.

  - **In this case:** For each factor, we say:
     - Counterfactual: no (because of the other factor)
     - Interventionist: no (because changing one doesn't help in this background)
     - So we use the tie-break: They are contributing factors.

  **Ladder Adjustment for Overdetermination:** We add that in cases of overdetermination, each sufficient factor is a contributing factor.

  ---

  **Final Procedure Adjustments:**

  We must add:
  - For Step 1.2: If the outcome is overdetermined (there are multiple sufficient causes), then the counterfactual for any one factor may be false. We then note that the factor is part of a set and use the contributing factor language.
  - Similarly for Step 2.1: If the intervention on one factor does not change the outcome because of other factors, but the factor is part of a minimal sufficient set, then we can call it a contributing factor.

  But note: We are designing for simplicity. We can note that if the counterfactual fails due to overdetermination, we still mark it as a contributing factor without requiring the interventionist test to pass.

  **Revised Tie-Break:**
  - If counterfactual fails because of overdetermination (i.e., without X, Y would have occurred due to another cause) but X was part of the actual set that caused Y, then X is a **contributing factor**.
  - Similarly, if the interventionist test fails because of overdetermination, but the factor was necessary for the sufficiency of the set (in the actual world) then it's a contributing factor.

  **For Case 3:**
  - For X1: Counterfactual fails (overdetermined), so we call it a contributing factor.
  - We skip or note that interventionism also fails but the overdetermination reason is the same.

  ---

  **What the Procedure Cannot Do:**
  - **Rare events:** We rely on general evidence for the counterfactual and interventionist predictions. If the event is rare, we may have little evidence and the committee must judge based on expert opinion.
  - **Omissions:** We treat omissions as events, but it can be hard to define the contrast (what exactly would have been done?).
  - **Harm avoided by luck:** Not applicable since we review incidents with harm.
  - **Systematic misgrading:**
     - **Overdetermination:** We handle it by downgrading to contributing factor, but the committee might want to call it a cause.
     - **Preemption:** If one cause preempts another, the preempted cause might not have counterfactual dependence (because without it, the preempting cause would still have produced the outcome). But the preempted cause did not actually cause it. Our procedure might misgrade by calling the preempted cause a contributing factor when it wasn't actually operative. We must be careful: in preemption, the preempted cause is not part of the actual causal chain. So we should not include it. This requires careful construction of the timeline.
  - **Metaphysical positions:** The answers depend on the chosen account. For example, in overdetermination, some philosophers might say both are causes, but our procedure (based on Lewis) says neither individually is a cause by counterfactual. We then use contributing factor as a compromise.

  ---

  **Finalized Procedure (Checklist Form):**

  **Step 0: Define**
     - Outcome: Y = [specify harm]
     - Candidate cause: X = [specify factor and contrast class]

  **Step 1: Counterfactual Dependence**
     1.1: Did X occur (or take the value in question) and did Y occur?
          - No → Stop: X is not a cause in this incident. (Reroute as marker or drop.)
          - Yes → Proceed.
     1.2: In the closest non-backtracking world where X does not occur (or takes the alternative value), would Y not have occurred?
          - Consider: Avoid changing upstream factors. Base on evidence from similar cases.
          - Yes → X passes counterfactual.
          - No → Reason: 
               - If because of overdetermination (another cause would have produced Y) → Mark as overdetermined and note contributing factor.
               - Other reasons → X fails counterfactual.

  **Step 2: Interventionist Test**
     2.1: Is there a surgical intervention (that sets X to the alternative value without changing other direct causes of Y) such that, in the context of this incident (with other factors held fixed at admissible settings), performing it would have prevented Y?
          - Consider: The intervention must be direct. If it requires changing other variables, it's not surgical.
          - Admissible backgrounds: Within the range of what is typical for the hospital.
          - Yes → X passes interventionist.
          - No → Reason:
               - If because of overdetermination → Mark as overdetermined and note contributing factor.
               - If no surgical intervention exists (e.g., immutable factor) → Fail.

  **Step 3: Assign Language**
     - Both pass: **Cause**.
     - Both fail and not overdetermined: **Not a cause** (marker or risk stratifier if associated).
     - Only counterfactual passes: **Contributing factor** (note: not surgically intervenable).
     - Only interventionist passes: **Contributing factor** (note: not counterfactually necessary).
     - Overdetermined in either step: **Contributing factor**.
     - For non-actionable factors (e.g., frailty) that fail both, but are associated: **Risk stratifier**.

  **Step 4: Chair's Sign-off on Judgment Points**
     - Variable selection and contrast class.
     - Non-backtracking counterfactual assessment (Step 1.2).
     - Surgical intervention and admissible background (Step 2.1).
     - Overdetermination call.
     - General-to-single-case extrapolation.

  ---

  **Run Case 3 with Revised Procedure:**

  - For X1 (pump error):
     - Step 1.1: Yes.
     - Step 1.2: Without X1, Y would have occurred (due to X2). So overdetermined → Contributing factor.
     - Step 2.1: We skip because we already have overdetermined? Or we run: Intervention to fix pump does not prevent Y (because of X2) → fails, but we already marked as overdetermined. So language: **Contributing factor**.

  - Similarly for X2: **Contributing factor**.

  - Report: "The programming error and the second drug administration were contributing factors to the toxicity. Each alone was sufficient to cause the toxicity, and together they resulted in the harm."

  This is defensible: we are not saying either caused it alone, but both contributed to the occurrence.

  The committee might dislike that we don't call them causes, but the procedure forces us to be precise.
answer: |-
  Below is a causal attribution procedure designed for your committee, based on counterfactual-dependence (Lewis) and interventionist (Woodward) accounts. The procedure is structured as a 15-minute checklist per causal claim, with explicit stops, tie-break rules, and a language ladder. I'll first present the procedure, then apply it to your three cases, and finally outline its limitations. The procedure is rigorous but honest about irreducible judgment points (marked as **Chair Sign-off**).

  ---

  ### **Causal Attribution Procedure: Checklist for Committee Use**
  **Time Budget:** 15 minutes per candidate cause (X) for a given harm (Y).  
  **Inputs:** Timeline, chart data, committee expertise.  
  **Output:** Causal language for the report (cause, contributing factor, risk stratifier, marker).

  #### **Step 1: Define the Candidate Cause and Contrast Class**  
     - **Question 1.1:** What is X (the candidate cause) and its *contrast class* (the alternative value of X being compared)?  
       - *Sufficiency condition:* X must be defined as a variable with at least two values (e.g., "failure to escalate" vs. "escalation"; "frail" vs. "non-frail").  
       - *Stop:* If X cannot be defined as a variable (e.g., vague terms like "human error"), reroute to Step 1.1 for redefinition. Hard no if no contrast class exists.  
     - **Question 1.2:** What is Y (the harm) and its necessary conditions?  
       - *Sufficiency condition:* Y must be a specific outcome (e.g., "cardiac arrest," not "poor outcome").  
     - **Philosophical Account:** Both Lewis and Woodward require a contrast class. Woodward explicitly treats causation as difference-making (X=x₁ vs. X=x₂).  
     - **Chair Sign-off:** Choice of variables and contrast class (e.g., why "frailty" vs. "comorbidity burden"?).

  #### **Step 2: Counterfactual-Dependence Check (Lewis Account)**  
     - **Question 2.1:** In the actual world, did X occur at the stated value (e.g., "no escalation") and did Y occur?  
       - *Sufficiency condition:* X and Y must both be factual. For omissions (e.g., "no escalation"), treat as "occurring" by absence.  
       - *Stop:* If no, hard no—X cannot be a cause. Proceed if yes.  
     - **Question 2.2:** In the closest possible world where X takes the alternative value (e.g., "escalation occurs"), would Y not have occurred?  
       - *Sufficiency condition:* The counterfactual must hold *without backtracking* (i.e., no changes to upstream factors like patient physiology). Rely on clinical evidence (e.g., "escalation usually prevents arrest").  
       - *Stop:*  
         - If yes, X passes counterfactual test.  
         - If no (Y still occurs), X fails.  
         - If unsure due to lack of evidence, flag for Chair Sign-off.  
     - **Philosophical Account:** Pure Lewis. Fails if backtracking is required (e.g., changing frailty forces changes to age/physiology).  
     - **Chair Sign-off:** Judgment on "closest possible world" and backtracking risks (e.g., early-warning scores often fail here).

  #### **Step 3: Interventionist Check (Woodward Account)**  
     - **Question 3.1:** Is there an intervention that *surgically* sets X to the alternative value, breaking other paths to X?  
       - *Sufficiency condition:* Intervention must directly set X (e.g., "force escalation via protocol") without changing other Y-causes (e.g., patient physiology). Non-surgical interventions (e.g., "staff training" affects many variables) fail.  
       - *Stop:* If no intervention exists (e.g., immutable factors like age), X fails interventionist test. Proceed if yes.  
     - **Question 3.2:** Would this intervention change Y, tested against an *admissible background*?  
       - *Admissible background:* Other factors fixed at actual incident values or hospital-typical values (e.g., staffing levels that night). Not all possible worlds—only those physically/operationally plausible.  
       - *Sufficiency condition:* Y must change (e.g., arrest prevented) *and* show *invariance*—the effect holds across ≥2 intervention routes (e.g., "automated alert" and "backup nurse" both work).  
       - *Stop:*  
         - If yes, X passes interventionist test.  
         - If no or invariance fails, X fails.  
     - **Philosophical Account:** Pure Woodward. Surgical intervention and invariance ensure X is a genuine variable.  
     - **Chair Sign-off:** What counts as "surgical" (e.g., is a policy change direct?); admissible background bounds; invariance threshold.

  #### **Step 4: Tie-Break and Language Assignment**  
     - **Rules:**  
       - If both tests pass → "X **caused** Y."  
       - If both fail → X is not causal; assign to "**marker**" (if correlated) or drop.  
       - Only counterfactual passes → "X was a **contributing factor** to Y" (Lewis: it made a difference, but no intervention).  
       - Only interventionist passes → "X was a **contributing factor** to Y" (Woodward: actionable, but not necessary in this case).  
       - **Overdetermination exception:** If both tests fail due to multiple sufficient causes (e.g., two drugs either alone cause toxicity), assign "**contributing factor**" to all.  
     - **Language Ladder Conditions:**  
       - **Cause:** Both tests pass.  
       - **Contributing factor:** One test passes, or overdetermination.  
       - **Risk stratifier:** Both fail but X is clinically relevant (e.g., frailty); implies "requires contextual response."  
       - **Marker:** Both fail and X is merely correlative (e.g., rural address).  
     - **Chair Sign-off:** Final language choice in borderline cases.

  #### **Step 5: Handle Non-Actionable Factors**  
     - **Question 5.1:** Is X immutable (e.g., age, frailty, race) or non-agential (e.g., rural address)?  
       - *Stop:* If yes, skip to Step 5.2. If no, X is actionable—proceed to report.  
     - **Question 5.2:** Can we intervene on *responses* to X (e.g., "adjust treatment for frailty")?  
       - *Sufficiency condition:* Intervention must target downstream responses (e.g., "frailty screening protocol"), not X itself.  
       - *Stop:*  
         - If yes, redefine X as the response (e.g., "failure to adjust for frailty") and restart at Step 1.  
         - If no, assign X as "**risk stratifier**."  
     - **Philosophical Account:** Woodward handles this via interventions on perceptions/responses; Lewis struggles with backtracking.

  ---

  ### **Application to Your Cases**
  I run the procedure strictly, preserving disagreements between accounts. Committee dislikes are not softened.

  #### **Case 1: Failure to Escalate Caused Arrest**  
  - **X:** Failure to escalate abnormal observations (contrast: escalation occurs).  
  - **Y:** Cardiac arrest.  
  - **Step 1:** Defined (X: escalation yes/no; Y: arrest).  
  - **Step 2 (Counterfactual):**  
    - 2.1: Yes, failure occurred and arrest happened.  
    - 2.2: In closest world with escalation, arrest would not occur (non-backtracking: escalation triggers intervention). **Passes.**  
  - **Step 3 (Interventionist):**  
    - 3.1: Surgical intervention exists (e.g., override button forcing escalation).  
    - 3.2: Intervention changes Y (escalation → arrest prevented); invariant across routes (e.g., button or second nurse). **Passes.**  
  - **Step 4:** Both pass → "Failure to escalate **caused** the arrest."  
  - **Result:** Committee gets what it wants. No disputes.

  #### **Case 2: Frailty Caused Harm (e.g., Surgical Complication)**  
  - **X:** Frailty (contrast: non-frail).  
  - **Y:** Harm (e.g., postoperative complication).  
  - **Step 1:** Defined (but contrast class is problematic).  
  - **Step 2 (Counterfactual):**  
    - 2.1: Yes, frail and harm occurred.  
    - 2.2: In closest world with non-frail, harm might not occur—but this *requires backtracking* (e.g., changing age/physiology). **Fails.**  
  - **Step 3 (Interventionist):**  
    - 3.1: No surgical intervention on frailty itself (immutable).  
    - 3.2: Intervention on responses (e.g., "frailty-adjusted protocol") is possible, but this redefines X (see Step 5).  
  - **Step 5:**  
    - 5.1: Frailty is immutable.  
    - 5.2: Intervention on response (e.g., "use frailty-adjusted protocol") is surgical and changes Y. **Restart with new X:** "Failure to use frailty-adjusted protocol."  
      - Revised Step 2: Counterfactual passes (with protocol, harm avoided).  
      - Revised Step 3: Intervention passes (e.g., mandatory protocol).  
      - **Result:** "Failure to use a frailty-adjusted protocol **caused** the harm." Frailty itself is a "**risk stratifier**."  
  - **Committee Dislike:** Frailty is demoted to "risk stratifier." The cause is the procedural failure.  

  #### **Case 3: Double Administration of Toxic Drugs**  
  - **X1:** Pump programmed at 10x rate (contrast: correct rate).  
  - **X2:** Second drug at toxic dose (contrast: safe/no dose).  
  - **Y:** Toxicity.  
  - **Analysis for X1:**  
    - **Step 2 (Counterfactual):**  
      - 2.1: Yes, X1 occurred and Y occurred.  
      - 2.2: Without X1, Y still occurs (via X2). **Fails.**  
    - **Step 3 (Interventionist):**  
      - 3.1: Surgical intervention exists (e.g., pump settings locked).  
      - 3.2: Intervention on X1 alone doesn’t change Y (X2 still causes toxicity). **Fails.**  
  - **Analysis for X2:** Identical failure (Y occurs without X2 due to X1).  
  - **Step 4 Tie-Break:** Both fail for X1 and X2, but due to overdetermination → Assign "**contributing factor**" to both.  
  - **Result:** "The pump error was a **contributing factor** to the toxicity. The second drug administration was a **contributing factor** to the toxicity."  
  - **Committee Dislike:** Neither is called a "cause." Counterfactual fails (both are insufficient alone); interventionist fails (fixing one doesn’t help). Overdetermination forces weaker language.  

  ---

  ### **What the Procedure Cannot Do**  
  The procedure is grounded in Lewis/Woodward, but has inherent limits. It will **not** resolve:  

  1. **Recurring Questions with No Purchase:**  
     - **"But for" vs. Proximate Cause:** Legal "proximate cause" (e.g., superseding events) is outside Lewis/Woodward. The procedure prioritizes difference-making, not legal norms.  
     - **Moral Responsibility:** E.g., blaming a nurse vs. system. This requires ethics frameworks, not causation.  
     - **Infinite Regress:** How far upstream to trace (e.g., "training deficiency" vs. "budget cuts") is a **Chair Sign-off**, not a causal question.  

  2. **Systematic Misgrading:**  
     - **Rare Events:** If an incident is statistically rare (e.g., novel complication), the counterfactual (Step 2.2) and invariance (Step 3.2) rely on general evidence, creating overconfidence.  
     - **Omissions/Non-Events:** E.g., "failure to update policies." The procedure handles these (Step 2.1), but defining contrast classes is subjective.  
     - **Harm Avoided by Luck:** If harm was narrowly averted (e.g., error caught by chance), there is no Y to analyze. The procedure only applies to incidents with harm.  
     - **Preemption:** If one cause preempts another (e.g., drug A causes toxicity before drug B would), the preempted cause (B) may falsely pass counterfactual if backtracking isn’t caught.  

  3. **Metaphysical Positions in Disguise:**  
     - **Overdetermination (Case 3):** The "contributing factor" output is a pragmatic compromise. Lewis would call neither a cause; Woodward might call both causes in a population. The procedure masks this dispute.  
     - **Necessary vs. Sufficient Causes:** E.g., in sepsis, "bacteria" is necessary but "immune failure" is sufficient. The procedure treats all variables equally, potentially misgrading necessary conditions.  
     - **Free Will/Determinism:** If human actions (e.g., "nurse ignored alert") are treated as variables, the procedure assumes they are intervenable, which may beg questions about accountability.  

  4. **Operational Gaps:**  
     - **Time/Fidelity Trade-offs:** Complex cases (e.g., multifactorial deaths) may exceed 15 minutes, forcing oversimplification.  
     - **Evidence Gaps:** Reliance on existing data (no new studies) means speculative judgments in Steps 2.2/3.2.  
     - **Groupthink:** The procedure doesn’t mitigate committee biases (e.g., blaming individuals vs. systems).  

  ---

  ### **Recommendation for Implementation**  
  - **Training:** Run a 1-hour workshop using past cases to calibrate judgments (focus on contrast classes and backtracking).  
  - **Reporting Template:** Include a "Causal Rationale" appendix with Step 1–5 outputs for board/litigation defense.  
  - **Chair Role:** You must sign off on judgment points. Flag these in reports (e.g., "Invariance assumed based on hospital protocol").  
  - **Evolution:** Revisit tie-break rules annually as committee gains experience.  

  The procedure forces rigor where possible and honesty where not. It will reduce disputes over language but not eliminate them—especially in overdetermined cases like your drug error. If you need refinements, provide another case where the committee deadlocked.
