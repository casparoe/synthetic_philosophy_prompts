      - This is intended to be a case where the stand-in (exam performance) is part of what constitutes mastery (the target). 
      - Improvement Condition: Every way to improve exam performance (by studying) improves mastery. So holds.
      - No-Gaming Condition: If the exam is well-constructed, there is no way to improve exam performance without improving mastery (e.g., cheating is not available or is prevented). So holds.
      - Relevance Condition: Causal relevance (studying causes both better performance and mastery) and also the performance is part of mastery? But mastery is more than the exam. However, if the exam is well-constructed, then the performance is a reliable indicator and also a component. The condition holds (causal and evidential). So it's good.

  12. **Improving the target only by neglecting the stand-in: researcher writing one book vs. six papers.**
      - Stand-in: number of publications. Target: quality of research (or impact).
      - The researcher can improve the stand-in (by writing six papers) but that might leave the target unchanged or even decrease it (if the book would have been better). Alternatively, they can improve the target (by writing the book) but that leaves the stand-in (number of publications) lower than it could be.
      - Improvement Condition: If they write six papers, they increase the stand-in but do not increase the target (or even decrease it). So condition 1 is violated: there is a way to increase the stand-in (by writing papers) that does not increase the target. 
      - Also, they can increase the stand-in without increasing the target. So condition 2 is also violated? 
      - Therefore, the stand-in is not in good order.

  **Which verdicts cannot be accommodated?**
  The principle accommodates all of the user's verdicts on the nine cases. The user might object to the vacuous truth in case 7 and 9, but the Relevance Condition handles it.

  **Which verdict should the user give up?**
  None. The principle supports all.

  **Causal or Evidential?**
  The user's verdicts commit them to both. The principle incorporates both causal and evidential relevance. The agent has reasons that can be either causal (when they can influence the outcome) or evidential (when their action provides information about the outcome).

  **Final Principle Statement:**

  > A stand-in \( S \) for a target \( T \) is in good order for an agent \( A \) at time \( t \) if and only if:
  > 1. **Improvement Condition:** Every action available to \( A \) at \( t \) that would, if taken, increase \( S \), would also increase \( T \).
  > 2. **No-Gaming Condition:** There is no action available to \( A \) at \( t \) that would increase \( S \) without increasing \( T \) (i.e., while leaving \( T \) unchanged or decreasing it).
  > 3. **Relevance Condition:** At least one of the following holds:
  >    - (a) **Causal Relevance:** \( A \)'s actions at \( t \) can causally influence \( S \).
  >    - (b) **Evidential Relevance:** \( A \)'s actions at \( t \) are evidentially relevant to \( T \) through \( S \), meaning that \( A \)'s actions provide information about \( T \) via \( S \).

  **Definitions:**
  - An action is "available" at \( t \) if it is within \( A \)'s abilities at \( t \) without requiring prior self-modification that is not currently feasible.
  - "Increase" means to improve the value of \( S \) or \( T \) according to \( A \)'s values.

  This principle accounts for both surrogate goals and acausal threats, and it addresses the gaps in the original principle.
