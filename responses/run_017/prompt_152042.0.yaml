answer: |-
  Your variant of the St. Petersburg paradox is a known construct in decision theory and probability, specifically called the **Pasadena paradox**. It was introduced by Harris Nover and Alan Hájek in 2004 to illustrate issues with expected utility theory when utilities are unbounded and the expectation is conditionally convergent. Your setup—where a fair coin is tossed until the first heads, and the payoff for the first heads on the nth toss is \((-1)^{n-1} \cdot 2^n / n\)—is precisely the Pasadena game. The expectation, summed in natural order, is the alternating harmonic series \(\sum_{n=1}^\infty (-1)^{n-1}/n = \ln(2)\), but the series is not absolutely summable, leading to problems under rearrangement.

  Below, I address your questions in detail, drawing on the Pasadena literature and related concepts in measure theory and decision theory. The key distinction revolves around the existence of the expectation, the role of countable additivity, and the implications for defining a "fair price."

  ### 1. **Does this configuration have an established name and literature?**
     - **Name**: This is the **Pasadena paradox**.
     - **Literature**: The paradox was first presented in:
       - Nover, H., & Hájek, A. (2004). ["Vexing Expectations"](https://www.jstor.org/stable/10.1086/381264). *Mind*, 113(450), 237–249.
       - It has since been discussed in decision theory, economics, and philosophy, often as a counterexample to the universality of expected utility. Key papers include:
         - Hájek, A. (n.d.). *Unexpected Expectations*. (Book manuscript, but sections available online.)
         - Easwaran, K. (2008). ["Strong and Weak Expectations"](https://doi.org/10.1093/mind/fzn032). *Mind*, 117(467), 633–641.
         - Bartha, P. (2016). ["Making Do Without Expectations"](https://doi.org/10.1093/mind/fzv152). *Mind*, 125(499), 799–827.
       - The Pasadena paradox is distinct from the St. Petersburg paradox (where expectation diverges to \(+\infty\)) but is often presented as a footnote or extension due to its conditional convergence.

  ### 2. **What is the distinction you are groping at?**
  The core distinction is between:
     - **An expectation that is infinite but well-defined**: E.g., the St. Petersburg paradox, where \(E[X] = +\infty\) because the series diverges absolutely in the positive direction (all terms non-negative). Here, the expectation "exists" as an infinite value.
     - **An expectation that does not exist at all**: This is the case for the Pasadena game. Because \(E[|X|] = \sum_{n=1}^\infty |\text{payoff} \cdot \text{probability}| = \sum_{n=1}^\infty 1/n = \infty\) (harmonic series divergence), and the positive and negative parts both diverge (\(E[X^+] = \infty\) and \(E[X^-] = \infty\)), the expectation is **undefined**. It is not a real number, nor is it infinite; it simply lacks a well-defined value.
     - **A limit of partial sums that exists relative to a chosen enumeration while the integral fails to exist**: In the natural order, the partial sums converge to \(\ln(2)\), but this is order-dependent. Under rearrangement (e.g., permuting the indices of the outcomes), the series can converge to any real number or diverge (Riemann rearrangement theorem). The Lebesgue integral (standard definition of expectation) fails to exist because it requires \(E|X| < \infty\) for the integral to be order-invariant and well-defined.

  ### 3. **Does the truncation argument rescue \(\ln(2)\)?**
     - **No, it does not rescue the expectation**: The truncation argument shows that for the capped game (stop after \(N\) tosses, pay 0 if no heads), the expectation \(E_N\) is the \(N\)th partial sum of the alternating harmonic series, \(S_N = \sum_{n=1}^N (-1)^{n-1}/n\), which converges to \(\ln(2)\) as \(N \to \infty\). However:
       - This convergence is robust for the capped game because finite sums are order-invariant.
       - For the uncapped game, \(E_N\) converges to \(\ln(2)\), but this is the limit of a sequence of expectations for different random variables (\(X_N\), the capped version), not the expectation of the limit random variable (\(X\), the uncapped game).
       - Because \(E|X| = \infty\), \(X\) is not integrable, and \(E_N \to \ln(2)\) **does not imply** that \(E[X] = \ln(2)\). In fact, \(E[X]\) does not exist.
       - The truncation argument **assumes a specific order** (natural enumeration by \(n\)), which the rearrangement argument denies. By rearranging the uncapped game's outcomes, we can make the partial sums converge to a different value, e.g., \(-\infty\) or 100, even though the capped expectations still tend to \(\ln(2)\) under any fixed order for finite \(N\).

  ### 4. **Where does the real moral land?**
  The Pasadena paradox highlights several foundational issues:
     - **Definition of expectation**: In standard measure-theoretic probability (Kolmogorov), the expectation \(E[X]\) is defined only if \(E|X| < \infty\) (absolute convergence). If not, \(E[X]\) may be undefined, even if the series converges conditionally. The moral is that **expectation requires absolute integrability to be well-defined and order-invariant**.
     - **Countable additivity**: Countable additivity holds for the probability measure, but it does not guarantee a well-defined expectation when \(E|X| = \infty\). Here, the problem is not with countable additivity itself, but with the random variable's integrability.
     - **Admissibility of unbounded utility**: The paradox challenges expected utility theory by showing that **unbounded utilities can lead to ill-defined expectations**. Decision rules based on expected utility may be incoherent if utilities are not restricted to be bounded or absolutely integrable.
     - **Assumption that every gamble has a fair price**: The Pasadena game has no unique fair price. While \(\ln(2)\) emerges from truncation, it is not the expectation, and rearrangements justify any "fair price." This suggests that **not all gambles admit a fair price** under standard expected value. Resolutions include:
       - Using "weak expectations" (Nover & Hájek), which incorporate preferences over truncations.
       - Rejecting unbounded utilities or adopting alternative decision frameworks (e.g., rank-dependent utility).
       - Defining value via limits of truncated games (as you suggested), but this is not the standard expectation and may not satisfy all decision-theoretic axioms.

  ### 5. **Connection to the two-envelope puzzle**
  The two-envelope puzzle involves similar infinite expectations but for different reasons:
     - **Similarity**: Both puzzles involve divergent or ill-defined expectations due to unbounded payoffs. In the two-envelope puzzle, the expected value of switching envelopes appears to be \( (5/4) \times \) the current amount, implying infinite gain, but this arises because the calculation treats the unknown amount as a variable with improper prior or infinite mean.
     - **Difference**: 
       - In the two-envelope puzzle, the issue is **improper conditioning**—the expectation is flawed due to the lack of a proper probability distribution for the smaller amount \(A\). It often assumes \(E[A]\) is infinite, leading to a flawed comparison.
       - In the Pasadena paradox, the issue is **non-integrability**—the expectation is conditionally convergent but not absolutely convergent, making it undefined under rearrangement.
       - Both show pathologies from unbounded utility, but the Pasadena paradox is more directly tied to the mathematical properties of series convergence, while the two-envelope puzzle stems from probabilistic incoherence in the setup.

  ### Final Thoughts
  You have indeed stumbled upon the Pasadena paradox, a significant extension of the St. Petersburg paradox. The truncation argument provides a pragmatic way to assign a value (\(\ln(2)\)) but does not resolve the underlying issue: the expectation is undefined, and no unique fair price exists. This underscores the importance of absolute convergence in defining expectations and the limitations of expected utility for unbounded gambles. For further reading, start with Nover and Hájek's "Vexing Expectations" and Hájek's work on weak expectations. If you seek a "carving," it lies in recognizing that conditional convergence is insufficient for a robust notion of expected value—absolute integrability is essential.
