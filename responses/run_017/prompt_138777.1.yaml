  ### Desiderata for Updating on Uncertain Evidence

  Updating on uncertain evidence requires a rule that generalizes Bayesian conditionalization. Below are desiderata (requirements) for such a rule, categorized as **non-negotiable** (essential for coherence) or **preference** (commonly desired but context-dependent, often motivated by divergence minimization). I include a case illustrating each requirement. Finally, I provide a worked case to test the desiderata.

  #### Core Desiderata
  1. **Marginal Constraint Satisfaction (Non-negotiable)**  
     The rule must assign the new marginal probabilities \(P'(E_i) = q_i\) for the partition \(\{E_1, \dots, E_n\}\).  
     *Case*: After a blurry vision of a die, you assign \(P'(\text{even}) = 0.7\), \(P'(\text{odd}) = 0.3\). The rule must output these marginals exactly.  
     *Why non-negotiable?* The experience directly shifts credences over the partition; violating this contradicts the evidence.

  2. **Reduction to Bayesian Conditionalization (Non-negotiable)**  
     When evidence becomes certain (i.e., \(q_i = 1\) for some \(E_i\), \(q_j = 0\) for \(j \neq i\)), the rule must reduce to \(P'(A) = P(A \mid E_i)\).  
     *Case*: Initially uncertain if a coin is fair (\(E_1\)) or biased (\(E_2\)), you later learn it is certainly fair (\(q_1 = 1\)). The posterior for \(A = \text{heads}\) must match \(P(A \mid E_1)\).  
     *Why non-negotiable?* Certain evidence is a special case; failure here violates the axioms of probability.

  3. **Probability Consistency (Non-negotiable)**  
     The output \(P'\) must be a valid probability distribution (non-negative, sum-normalized).  
     *Case*: Shifting \(P(\text{rain}) = 0.4\) to \(P'(\text{rain}) = 0.6\) must not yield negative probabilities for \(\text{rain} \land \text{windy}\).  
     *Why non-negotiable?* Basic coherence requirement.

  #### Preference-Based Desiderata
  4. **Minimal Information Loss (Preference)**  
     \(P'\) should minimize divergence (e.g., Kullback-Leibler, KL) from \(P\), subject to constraints.  
     *Case*: With prior \(P\), uncertain evidence shifts \(P(E_i)\) to \(q_i\). Jeffrey's rule minimizes KL divergence by holding \(P(A \mid E_i)\) fixed.  
     *Why preference?* Motivated by information geometry, but other divergences (e.g., Wasserstein) may suit different contexts. Not all agree this is necessary.

  5. **Commutativity of Updates (Preference)**  
     Sequential updates on independent partitions should commute (order-invariance).  
     *Case*: First update on \(\{\text{rain}, \neg \text{rain}\}\) to \((0.6, 0.4)\), then on \(\{\text{windy}, \neg \text{windy}\}\) to \((0.7, 0.3)\). The result should match the reverse order.  
     *Why preference?* Intuitively desirable but often incompatible with other desiderata in thick evidence cases. Not always possible or demanded.

  6. **Invariance Under Reparameterization (Preference)**  
     The rule should not depend on how the partition is labeled.  
     *Case*: Updating on \(\{\text{even}, \text{odd}\}\) vs. \(\{1,2,3,4,5,6\}\) for a die should be consistent if marginal constraints match.  
     *Why preference?* Avoids arbitrary choices in modeling evidence.

  #### Conflicts Between Desiderata
  - **Conflict: Commutativity vs. Reduction to Conditionalization**  
    These *cannot* both hold universally. If evidence becomes certain in one step (requiring conditionalization), but a subsequent update alters conditionals (as in thick evidence), commutativity fails. For example:  
    - Step 1: Shift \(P(E_1) \to 1\) (certain \(E_1\) → conditionalization).  
    - Step 2: Update on a new partition, altering \(P(A \mid E_1)\).  
    Reversing steps may not preserve the final \(P'\).  
    **Which requirement excludes the most candidates?**  
    **Reduction to Conditionalization** is the strongest filter. It eliminates rules that:
    - Fail to handle certainty as a boundary case (e.g., some "fuzzy" updates).
    - Enforce commutativity rigidly (e.g., linear pooling rules).

  #### Worked Case: Thick Evidence in a Medical Scenario
  **Setup**:  
  - Diseases: \(D_1\) (common cold), \(D_2\) (flu).  
  - Symptom: \(S\) (fever).  
  - **Prior \(P\)**:  
    - \(P(D_1) = 0.7\), \(P(D_2) = 0.3\).  
    - \(P(S \mid D_1) = 0.2\), \(P(S \mid D_2) = 0.9\).  
  - **Uncertain evidence**: A lab test is ambiguous. It shifts your disease credences to \(P'(D_1) = 0.4\), \(P'(D_2) = 0.6\) (marginal constraint). But the test also teaches that fever is *more likely under both diseases* (thick evidence), so \(P(S \mid D_i)\) cannot stay fixed. Instead, you learn:  
    \[
    P'(S \mid D_1) = 0.5, \quad P'(S \mid D_2) = 0.95.
    \]

  **Goal**: Update \(P(S)\) and \(P(D_1 \land S)\) under a general rule. Assume the rule minimizes KL divergence subject to all constraints.

  **Solution**:  
  1. **Constraints from evidence**:  
     - Marginals: \(P'(D_1) = 0.4\), \(P'(D_2) = 0.6\).  
     - Conditionals: \(P'(S \mid D_1) = 0.5\), \(P'(S \mid D_2) = 0.95\).  

  2. **Joint probabilities**:  
     - \(P'(S, D_1) = P'(S \mid D_1) P'(D_1) = 0.5 \times 0.4 = 0.2\),  
     - \(P'(S, D_2) = 0.95 \times 0.6 = 0.57\),  
     - \(P'(S) = P'(S, D_1) + P'(S, D_2) = 0.2 + 0.57 = 0.77\).  

  3. **Unconstrained probabilities**:  
     - For \(\neg S\), use consistency:  
       - \(P'(\neg S, D_1) = P'(D_1) - P'(S, D_1) = 0.4 - 0.2 = 0.2\),  
       - \(P'(\neg S, D_2) = 0.6 - 0.57 = 0.03\).  

  **Verifying Desiderata**:  
  - **Marginal Constraint**: \(P'(D_1) = 0.4\), \(P'(D_2) = 0.6\) → **satisfied**.  
  - **Reduction to Conditionalization**: Not applicable (evidence not certain).  
  - **Probability Consistency**: All probabilities \(\geq 0\) and sum to 1 → **satisfied**.  
  - **Minimal Information Loss**: Using KL minimization, the rule holds fixed conditionals *not* constrained (here, none left). This matches the solution → **satisfied** (if KL is preferred).  
  - **Commutativity**: Suppose a second update shifts \(P(S)\). Due to thick evidence (altered \(P(S \mid D_i)\)), order dependence is expected → **violated** (but acceptable per preferences).  
  - **Invariance**: Reparameterizing as \(\{D_1, D_2\}\) or \(\{\text{disease}\}\) doesn’t change the result → **satisfied**.  

  **Conclusion**:  
  - **Non-negotiable desiderata** are met.  
  - **Preference desiderata** are partially met (commutativity fails, but divergence minimization holds).  

  ### Key Takeaways
  - **Non-negotiable** requirements ensure coherence and boundary-case correctness.  
  - **Preference** requirements depend on philosophical stance (e.g., divergence minimization is popular but not mandatory).  
  - **Thick evidence** necessitates additional constraints (e.g., new conditionals), making Jeffrey's rule insufficient.  
  - **Reduction to conditionalization** is the strictest requirement, eliminating rules that don’t generalize Bayesian updating.  
  - **Commutativity often fails** in thick evidence cases, as updates alter dependencies between variables.
