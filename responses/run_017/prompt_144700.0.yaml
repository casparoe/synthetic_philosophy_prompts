prompt: |-
  Two friends of mine have been going at it for about a year about who should get to have a say in a given political decision, and I volunteered — should of said no — to help them turn the argument into a written thing. One of them holds the all-affected-interests view: you have a claim to a say in a decision just in case, and to the degree that, the decision affects your interests. The other holds the all-subjected view: what matters is that you are subject to the coercive power of the body making the decision. They have agreed in principle to an adversarial collaboration and I am meant to produce the draft they can both react to. Will you write it?

  What I need in it:

  1. A numbered agreed-claims section — the things both of them could actually sign. I think at least some of these belong there, but you decide and add your own: that a boundary principle is supposed to tell us who has a claim to a say, not who gets to rule; that both views agree on the easy cases, like long-term legal residents and small children represented by trustees, and only really come apart at the margins; that any such principle seems to face a circularity, because you need some prior account of which decisions are this bodys to make and which are collective at all; that neither principle by itself fixes what level of government should decide a given thing; and that stakes come in degrees while having a vote is binary. Where a claimed agreement is only apparent, say so and say why.

  2. A disagreements section, as a table, where every disagreement is stated twice — once in wording the affected-side would accept for its own view, once in wording the subjected-side would accept for its own — with the source side labelled. If you think a row is really just a verbal dispute or a difference of emphasis dressed up as a substantive one, flag it as such rather than pretending it is deep.

  3. The cruxes: the sub-questions such that settling one would move at least one of them. My guesses about what belongs here: whether coercion or stakes is the right currency in the first place; whether the relevant stakes are stakes in this particular decision or in the whole package of things the polity does over time; whether a very slight degree of affectedness generates any real claim, or whether the affected view quietly collapses into everyone belongs to every demos, and if so whether that is a reductio or a fine result; whether these principles are about legitimacy, so that a demos that excludes wrongly simply lacks authority, or only about justice in how the lines get drawn; and questions of timing, like people who show up after the vote, children born later, and people who can exit only at ruinous cost. Cut or add freely.

  4. For each crux, a case both of them would accept as bearing on it, with each side's prediction written down in advance of the answer, like a prediction register. Please use concrete cases and not the textbook ones, because they have both read all of those and just trade intuitions about them. Here is what I have in mind, roughly, but fix them so they actually isolate something:

  - A city of about 380,000 puts a combined transit and zoning package on the ballot every two years, voted by registered city residents. Roughly 70,000 people commute in each day from four unincorporated towns; their commute and costs swing with what the city decides, and they pay a city parking levy that city inspectors enforce against their cars. The city's stormwater rules also determine whether a township 40 km downstream floods, and those residents never enter the city at all.
  - A county of 90,000 votes to host a hazardous waste repository with a 150 year design life. Nearby counties, a town across a nearby border, and people not yet born all have big stakes; nobody outside the county is subject to the county's coercion.
  - A large trade bloc sets a product safety and data standard for its internal market, and because of the market's size it becomes the de facto global standard, so a factory worker in a country outside the bloc has her working conditions set by a rule that in no sense applies to her.
  - A tourist on a nine day visit is fully subject to local law, including fines and arrest, and is barely affected by anything the city decides; separately, someone held in pre trial detention for eighteen months and then released without charge.
  - A homeowner in a one industry town whose house would sell for less than it would cost to move. She can leave, but only at ruinous cost, and she says therefore she cannot.
  - The same question, say water abstraction, could be decided by a city, a river basin authority, a state, or a treaty body, and everyone agrees the answer matters more than who counts as a member. Also: if membership follows affectedness, then someone with thin stakes in lots of places belongs to every demos at once, and I want to know whether that is a problem or just how it goes.

  One more thing I keep wondering about and want you to take a position on: maybe the disagreement is not really about inclusion at all but about weight. If you let the size of someone's stake set their voting weight instead of setting the boundary, does either principle secretly push you toward that, and does the fight dissolve or just move? I have been calling it the graduated demos fallback.

  End with a short section on what would actually move this debate, where each side writes down what would count as evidence against its own view, and tell me straight if you think part of the year-long argument was about words. For style: my friends are not writing a paper, one of them keeps saying the other's view is just a sticker for whoever has power, and the other keeps saying the affected view is unworkable because affectedness is infinite — feel free to say when one of them is being unfair. Format it however makes it usable: numbered agreed claims, then the disagreements table, then the cruxes with their cases and predictions.
reasoning: |-
  Okay, the user is mediating a year-long debate between two friends about political decision-making boundaries. They need a structured draft for an adversarial collaboration. Let me unpack this.

  First, the core conflict: one friend advocates the "all-affected-interests" view (stakes-based inclusion), the other the "all-subjected" view (coercion-based inclusion). The user wants me to create a document with four key sections: agreed claims, disagreements table, cruxes with case studies, and pathways forward.

  Hmm, the user provided specific examples but wants fresh cases to avoid textbook fatigue. Good call - reused examples would just restart their intuition-trading. The commuting workers and hazardous waste cases need tweaking to isolate specific philosophical tensions. For instance, the commuter case should highlight temporal vs permanent affectedness, while the waste repository needs to stress intergenerational justice.

  Important nuance: the user suspects some disagreements might be about voting weight rather than inclusion boundaries. That "graduated demos" idea deserves exploration in the cruxes - maybe through the global standards case where distant workers have asymmetric stakes.

  The tone matters here. Both friends seem entrenched ("sticker for whoever has power" vs "unworkable infinite affectedness"). The draft should call out these rhetorical excesses while maintaining neutrality. Section 4's "evidence against own view" could force productive reflection.

  For structure:
  - Agreed claims first to establish common ground. Must include their suggested points but verify actual overlap. That circularity point about prior authority is crucial - neither principle solves the meta-problem of jurisdiction.
  - Disagreements table needs mirrored phrasing. The coercion/stakes dichotomy goes first since it's foundational. Flag apparent agreements like "children represented by trustees" - both include them but for different reasons.
  - Cruxes should prioritize the user's suggested cases but refine them. The detained tourist case is perfect for coercion-without-stakes. Add the "multiple demos membership" case to test boundary porosity.
  - Endgame section requires intellectual honesty from both sides. The subjected-view adherent should specify what would disprove coercion's primacy (maybe voluntary associations with high stakes?). The affected-view holder must address infinity objections.

  Biggest challenge: preventing Section 3's prediction register from becoming another intuition battlefield. Concrete details matter - specify the commuter's $7 daily levy, the waste repository's 0.3% annual containment failure probability. Ground abstract principles in tangible costs.

  Finally, that "graduated demos" probe. Worth a standalone crux: if we allowed fractional voting rights proportional to stakes, would the principles converge? The global factory worker case suggests not - subjected-view still excludes her entirely while affected-view might grant 0.0001 vote weight. Revealing.

  Noting time sinks to avoid: no rehashing consent theory; no hypothetical stateless societies; no analogies to private clubs. Stay focused on their real jurisdictional examples. The river basin authority case is underutilized - perfect for testing scalability of both principles.

  This needs to be a compass, not a map. The draft should equip them to navigate disagreements, not declare winners. Sometimes naming a stalemate is progress.
answer: |-
  Here is a draft adversarial collaboration document designed to clarify the dispute, isolate genuine disagreements, and provide concrete testing grounds. It incorporates your requirements and aims for neutrality, precision, and usefulness for your friends' reactions.

  **Adversarial Collaboration: Boundary Principles for Democratic Inclusion**

  **Section 1: Agreed Claims**
  *(Statements both parties endorse as foundational or jointly accepted limitations)*

  1.  **Purpose:** A boundary principle identifies who has a *claim* to participate in shaping a specific political decision (e.g., voting, consultation), not who ultimately wields ruling authority or how votes are aggregated into outcomes.
  2.  **Easy Cases:** Both principles agree that long-term legal residents of the relevant jurisdiction have a strong claim to participation. Both also agree that individuals lacking capacity (e.g., young children) can be represented via trustees, though the *basis* for this inclusion differs (Affected: vital interests; Subjected: subjection to law).
  3.  **Marginal Disagreement:** The significant practical divergence between the principles primarily occurs at the margins of inclusion/exclusion, not for core residents.
  4.  **Prior Authority Problem:** Neither principle *by itself* fully resolves the prior question of which decisions inherently belong to which collective body or which matters are appropriately "collective" at all. Determining the scope of the *polity* itself requires additional justification beyond the boundary principle.
  5.  **Level of Governance:** Neither principle *directly* dictates the appropriate level (local, regional, national, supranational) for making a specific decision. This requires supplementary principles of subsidiarity, efficiency, or jurisdictional competence. (Apparent agreement: While both agree the principle doesn't *directly* fix the level, they likely disagree on *which* supplementary principles are most compatible or primary).
  6.  **Binary vs. Degrees:** Both acknowledge a fundamental tension: having a formal "say" (like a vote) is typically binary (in/out), while both affectedness and subjection can exist in degrees. This creates a threshold problem for both views.
  7.  **Legitimacy vs. Justice:** The principles are primarily framed as addressing the *justice* of inclusion/exclusion boundaries. Neither claims that a violation *automatically* renders every act of the polity utterly illegitimate or void, though both agree systematic exclusion based on the principle undermines legitimacy. The severity of the wrong is debated.

  **Section 2: Key Disagreements**
  *(Stated neutrally for each side, identifying the core conflict)*

  | # | Disagreement Description (Affected-Interests Wording)                                                                 | Disagreement Description (All-Subjected Wording)                                                                  | Source of Disagreement | Flagged Issue?                                     |
  |---|-----------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------|------------------------|----------------------------------------------------|
  | 1 | The fundamental basis for a claim to participate is whether and how much one's **interests are impacted** by the decision's outcome. | The fundamental basis for a claim to participate is whether one is **subject to the coercive enforcement** of the decision-making body's rules. | Foundational Currency  | **Deep:** Core difference in moral foundation.    |
  | 2 | Significant **stakes in the outcome**, even without being subject to the enacting body's routine coercion, generate a participation claim (e.g., downstream towns). | Only those **directly governed by the coercive authority** enacting the decision bear the unique burden justifying a participation claim; affected outsiders do not. | Inclusion of Affected Outsiders | **Deep:** Central point of practical divergence. |
  | 3 | **Transient subjection** without significant stakes (e.g., a short-term tourist) generates little or no claim, as the core justification (protecting vital interests) is weak. | Anyone **subject to the coercive power** of the polity at the time of the decision, however briefly, has a claim based on that subjection, regardless of the magnitude of affected interests. | Inclusion of Transiently Subjected | **Deep:** Tests the core commitment to coercion.  |
  | 4 | **Future generations** deeply affected by long-term decisions (e.g., hazardous waste) have a claim that must be represented, as their interests are profoundly at stake. | **Future individuals** cannot be "subjected" to coercion *before they exist*; therefore, they lack a direct participation claim, though their interests should be considered by trustees. | Future Persons          | **Deep:** Involves metaphysics of subjection and moral patiency. |
  | 5 | The relevant "affectedness" is primarily **stakes in the specific decision at hand**, as each decision impacts different constellations of interests. | The relevant criterion is subjection to **the general system of rules** enforced by the polity over time; individual decisions are moments within that system. | Scope of Assessment (Specific vs. Systemic) | **Emphasis/Threshold:** Partly deep, partly about where the line is drawn within each view. |
  | 6 | **High exit costs** effectively transform potential outsiders into members, as their vital interests are bound to the jurisdiction despite formal non-residence (e.g., tied homeowner). | **High exit costs** may create hardship, but they do not equate to being *subjected to the authority* of the polity; exit remains possible, even if costly. | Exit Costs & Membership | **Deep:** Relates to coercion vs. stakes and the nature of "subjection". |
  | 7 | "Infinite affectedness" is managed by **thresholds of significant interest** and jurisdictional scope; it's a practical challenge, not a fatal flaw. | The "all-affected" view inherently lacks a **coherent limiting principle**, inevitably leading to an unbounded demos and practical unworkability. | Manageability vs. Coherence | **Emphasis/Threshold:** Disagreement on the severity and nature of the problem. |

  **Section 3: Cruxes & Prediction Register**
  *(Concrete cases isolating disagreements, with pre-commitments)*

  **Crux 1: Foundational Currency (Stakes vs. Coercion)**
  *   **Case:** *The Global Factory Worker:* The Pacific Rim Trade Bloc (PRTB), comprising large economies, sets a stringent product safety and data standard for goods sold within its market. Due to the PRTB's market dominance, this becomes the *de facto* global standard. Li Mei assembles electronics in a factory in a non-PRTB country. The PRTB standard directly dictates her workstation layout, safety gear requirements, and pace of work (via remote monitoring specs), enforced by her local employer under threat of losing PRTB contracts. She has no vote or consultation rights within the PRTB.
      *   **Affected-Interests Prediction:** Li Mei has a strong claim to participate in PRTB standard-setting. Her working conditions, health, and livelihood are profoundly and directly affected. The mechanism (market dominance) doesn't negate the impact.
      *   **All-Subjected Prediction:** Li Mei has no claim to participate in PRTB decisions. She is not subject to the PRTB's *coercive authority* (fines, arrest by PRTB agents). She is subject to her employer and national government, who *choose* to adopt the standard. The PRTB governs its own market participants, not foreign workers indirectly affected.

  **Crux 2: Inclusion of Affected Outsiders vs. Subjection Limiter**
  *   **Case:** *Downstream Flood Risk & Commuter Levies:* Metroville (pop. 380,000) votes every 2 years on a combined transit/zoning package. Key elements: Stormwater runoff rules significantly impacting flood risk for Brook Hamlet (pop. 8,500), 40km downstream (never enter Metroville). Separately, commuters from 4 unincorporated towns (70,000 people) pay a daily $7 "Congestion Levy" enforced by Metroville parking inspectors ticketing their cars within city limits. Their commute costs and time are heavily dependent on Metroville's transit/zoning decisions.
      *   **Affected-Interests Prediction:** Both Brook Hamlet residents (flood risk) and commuters (levy costs, commute impacts) have a significant claim to participate in the Metroville vote concerning these specific elements. Their core interests are directly targeted.
      *   **All-Subjected Prediction:** Brook Hamlet residents have no claim; they are not subject to Metroville's coercion. Commuters *are* subject to Metroville's coercive enforcement (ticketing) regarding the levy *within city limits*. They may have a claim regarding decisions *directly tied to the levy's purpose/use* (e.g., transit projects funded by it), but not necessarily the entire zoning/transit package, and only based on their subjection, not their affectedness.

  **Crux 3: Transient Subjection vs. Minimal Affectedness**
  *   **Case:** *The Detained Visitor:* Alex, a tourist, visits Capital City for 9 days. They are fully subject to local laws, fines, and potential arrest. Separately, Sam was held in Capital City's jail for 18 months awaiting trial on charges later dismissed before trial commenced. Both are released without conviction. A vote occurs during Alex's visit/Sam's detention on a minor tax adjustment affecting only long-term property owners.
      *   **Affected-Interests Prediction:** Alex likely has *minimal* claim due to very low stakes in the specific decision. Sam, having endured prolonged coercive confinement, has a significant claim based on subjection *and* the profound impact of detention itself, regardless of the vote's topic.
      *   **All-Subjected Prediction:** Alex, being subject to coercion during the vote, has a claim to participate, however minor the decision's impact on them. Sam, having been subjected to the city's coercive power intensively for 18 months, has a very strong claim to participate.

  **Crux 4: Future Generations**
  *   **Case:** *The Millennial Repository:* Green County (pop. 90,000) votes to host a hazardous waste repository with a meticulously designed 150-year containment system (0.3% estimated annual failure risk post-closure). Nearby counties and a town just across the state line face significant contamination risks for centuries. Unborn generations for 150+ years bear the primary long-term risk.
      *   **Affected-Interests Prediction:** Future generations (for ~150 years) have a strong claim that must be represented (e.g., via scientific trustees or adjusted discount rates). Nearby present populations also have claims. The claim derives from the massive potential impact on vital interests (health, environment).
      *   **All-Subjected Prediction:** Future generations cannot be subjects before they exist; they have no direct participation claim. Nearby present populations are not subjected to Green County's coercion; they have no claim. Only Green County residents, subject to the county's authority enacting the decision, have a claim. Trustees *might* consider future interests, but this is not based on a participation *claim* of the unborn.

  **Crux 5: Exit Costs & Coercion**
  *   **Case:** *The Company Town Homeowner:* Maria owns a home in Milltown, built around a single, massive factory. The factory closes permanently. Due to economic collapse, her house's market value is now less than the cost of moving her family and belongings. She *can* physically leave, but doing so would mean financial ruin (significant debt, loss of life savings). Milltown votes on drastic austerity measures affecting remaining services.
      *   **Affected-Interests Prediction:** Maria has a very strong claim to participate. Her vital interests (financial security, housing, community) are inextricably bound to Milltown's decisions; the ruinous exit cost makes her effectively captive to its political choices.
      *   **All-Subjected Prediction:** Maria has a claim only because she remains a resident *subject to Milltown's laws and coercion*. The high exit cost is tragic and increases her *stakes*, but the source of her claim is her ongoing subjection as a resident, not the cost of exit itself. If she left, her claim would cease.

  **Crux 6: Multiple Memberships & Jurisdictional Level (Graduated Demos Probe)**
  *   **Case:** *The River Basin Puzzle:* Water abstraction from the River Rundle is contested. It could be decided by: Riverton City (immediate upstream users), the Rundle River Basin Authority (RRBA - multi-county), the State, or a multi-state Rundle Compact. Farmer Chen owns small, non-water-intensive plots in 3 counties spanning the RRBA and part of another state. Each decision level affects her minimally but non-trivially (water availability, regulation costs).
      *   **Affected-Interests Prediction:** Chen likely has a thin participation claim at *multiple* levels (City? RRBA? State?) where decisions affect her interests, proportional to the stake. The "graduated demos" (weighted voting by stake) might be a juster solution than binary inclusion/exclusion at a single level. The best level is whichever aggregates the relevant affected interests most fairly/effectively.
      *   **All-Subjected Prediction:** Chen has a clear participation claim only at the level whose *coercive authority* she is directly subject to regarding land/water use - likely her County and State. Her thin stakes elsewhere do not generate additional participation claims. The appropriate level is the one with legitimate jurisdictional authority over the resource, primarily determined by established legal/political structures, not directly by her affectedness. *Graduated demos is incompatible with the core idea of subjection defining membership.*

  **Section 4: Pathways Forward - What Would Move the Debate?**

  *   **To the Affected-Interests Proponent:** What empirical observation or theoretical argument would genuinely make you doubt that *stakes* are the fundamental currency for participation claims?
      *   *Potential Answer:* If it could be conclusively shown that *only* those subjected to coercion develop the necessary sense of reciprocity, shared fate, or civic responsibility required for functional democratic deliberation and legitimate collective decision-making, *and* that including solely based on stakes (without subjection) consistently undermines these processes without yielding superior justice outcomes.
  *   **To the All-Subjected Proponent:** What empirical observation or theoretical argument would genuinely make you doubt that *subjection to coercion* is the fundamental currency for participation claims?
      *   *Potential Answer:* If it could be conclusively shown that political communities can make stable, legitimate, and just decisions *routinely* including individuals demonstrably subjected to significant impacts by those decisions but *not* subject to the enforcing authority (e.g., robust transnational environmental or economic bodies with stakeholder input), without collapsing into incoherence or injustice, and that excluding them *solely* due to lack of subjection consistently leads to severe, unjustifiable harm that outweighs concerns about reciprocity or coherence.
  *   **On Verbal Disputes & Unfairness:**
      *   **"Just a sticker for power":** This is unfair. The All-Subjected view aims for a principled limit based on a distinct moral burden (coercion), not merely legitimizing power. Its proponents genuinely believe this limit is necessary for coherence and reciprocity, even if it excludes some affected parties. Accusing it of being purely cynical dismisses its normative intent.
      *   **"Unaffectedness is infinite":** While overstated ("infinite"), this highlights a *serious challenge* for the Affected-Interests view: defining non-arbitrary thresholds for "significance" and avoiding over-inclusion. Dismissing it as *merely* a practical problem ignores the depth of the theoretical challenge to its coherence as a *boundary* principle. The Subjected view has a clearer, if controversial, limiting principle.
  *   **The "Graduated Demos" Question:** This doesn't dissolve the core dispute; it *moves* it. The Affected view naturally aligns with it (stakes -> weight). The Subjected view fundamentally opposes it, seeing membership (and thus the equal vote) as binary based on subjection. The fight shifts to whether weighted voting based on stakes is a viable or just alternative model for democracy itself, which is an even larger debate.
  *   **What Would Help:** Moving beyond trading textbook intuitions. Focusing on these specific, concrete cases and their *implications* (e.g., What institutional mechanisms *could* satisfy the claim of the factory worker or future generations under each view? What are the measurable consequences of exclusion in cases like Brook Hamlet or the commuters?). Exploring historical or contemporary examples where one principle seems to have been applied (well or poorly). Clarifying the *moral weight* of coercion vs. impact/stakes independently of the institutional design challenge.

  This draft provides a structured foundation for your friends to engage with. It identifies common ground, precisely frames disagreements in their own terms, uses fresh cases to test core commitments, and challenges both sides to articulate what could falsify their view. Good luck!
