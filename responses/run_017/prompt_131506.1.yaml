prompt: |-
  Hi — you're an expert here, so I'm trusting you: a professional philosopher of history who also understands how a newsroom actually works. Think carefully and go slowly, and before you write anything, spend some time brainstorming the failure modes — please don't just recite the standard summary of historical revisionism versus denialism, I can get that myself and it wouldn't help me on deadline.

  I'm a journalist. I write a column and the occasional long feature on science, ideas, and how both get misused in public, and maybe three or four times a year I get pulled into history fights instead: a politician, a pundit, a professor or a textbook board says something about a mass atrocity — the Holocaust, the Armenian genocide, Nanjing, those kinds of cases — and I have to decide what word to use for what they're doing, in print, about a day after I start. My news editor has to sign off, our lawyer occasionally glances at things when the stakes are high, and I am not a historian. So what I want from you is a decision procedure, not an essay.

  The deliverable: an ordered set of questions I can run against a person's actual output — a speech, a book, a thread, a textbook paragraph — that lands me on one of a small number of verdicts, with real stop rules. Where does the procedure stop and tell me to write that this is denial? Where does it stop and tell me it isn't? And, importantly, where does it stop and say: this remaining question is a values call or a legal call and has to go to a human — my editor, our lawyer, an actual specialist I can phone?

  Constraints it has to survive:

  - I can't read minds and I'm not going to print an accusation about someones motives. If a step depends on guessing what the person really believes or wants, mark it as a step I'm not allowed to run.
  - I'm working from a desk. Assume I can read what they wrote, find their other public writing, and get a rough sense of whether specialists accept the claims — but not much more than that.
  - It has to be runnable in a few hours by a generalist, and defensible to my editor.
  - Each verdict needs wording guidance: what do I actually write when the answer is "not denial but badly wrong", or "structurally denialist but I shouldn't use that word on this occasion".

  Hard cases it has to handle. These are composites I made up, not real people:

  1. The number fighter. They accept the event happened and that it was a crime, but argue the death toll was a fraction of the usual figure — a fifth of it, say — using old census or demographic records. Sometimes this is a credentialed historian publishing in peer-reviewed venues, sometimes it's a retired accountant with a website. What in the procedure separates those, and at what point does the number question have to be handed to a specialist because I simply cannot evaluate the demography?

  2. What I've started privately calling denial by subtraction. Nothing is denied. The deaths happened, the camps or the death marches or the massacres are real. What disappears is the thing that made it an atrocity: the deaths get re-described as disease, chaos, famine, the fog of war, a communications breakdown; the perpetrators become people who failed to prevent something rather than people who did it. There's a sibling move where the same body count gets reassigned to a different cause or a different author, so the arithmetic is untouched but the responsibility dissolves. I need the procedure to catch these without me having to establish a state of mind.

  3. The legal-category dodge. I don't deny a thing, I just think genocide is a narrow legal term from a treaty definition written in the late 1940s, and applying it to this case is retroactive law-making. Is that denial, is it a genuinely arguable claim about how far a concept extends, or is it a third thing that needs its own verdict?

  4. The state that owns the word. Sometimes there's a law criminalizing denial of a particular atrocity and the government uses it against anyone who departs from the official account, credentialed scholars included. Sometimes it's the reverse: a government denies an atrocity its own predecessor committed and calls the historians liars. I do not want a procedure that defers to whoever has the law on their side, or to whoever my readers happen to sympathize with. What replaces that deference?

  5. The merely-contrarian case, where someone is bad at history or addicted to being the only person who sees through things, with no ideological stake — and then the uncomfortable one: someone broadly on my side of a fight doing something structurally identical to case 2 about an atrocity committed by the side they don't like. If my procedure doesn't bite on my own side, it's worthless, so tell me whether it does.

  One test I've found useful and want built in: an asymmetry check — does this person apply anything like the same ferocious standard of proof to atrocities committed by their own nation, party or side as they apply to the one they're attacking? That seems like the most reliable evidence I can actually gather from a desk. But be honest with me about how much weight it can bear and what it misfires on.

  Also please:

  - Run the finished procedure end-to-end on two of the composites above, including at least one where the verdict it produces is one I won't like. I'd rather recieve that news now than in a correction.
  - Flag which questions are genuine tests and which are judgment calls dressed up as procedure. My editor will ask.
  - Finish with what the procedure cannot do: the situations where it genuinely can't help and I should stop trying to mechanize this and just make a call.

  Take your time, think it through properly, and be blunt where I'm being naive.
reasoning: |-
  Okay, this journalist needs a practical decision procedure for labeling historical atrocity discourse—especially denialism—under tight deadlines. They're clearly frustrated with oversimplified academic frameworks and need something operable in a newsroom context. 

  First, let's unpack their constraints: no mind-reading (so intent is off-limits), desk-bound research limitations, and must handle tricky cases like "denial by subtraction" or government-backed narratives. The asymmetry test they mentioned is smart—I'll elevate that to a core step. 

  Hmm... hardest part will be creating stop rules that don't require historical expertise. For example, with "number fighters," I can't expect a journalist to evaluate demographic methods, but I can check if they dismiss all counter-evidence uniformly. Need clear bail-out points like "specialist consultation needed if methodological dispute exceeds journalist's capacity." 

  For the legal-category dodge (#3), the key is distinguishing between scholarly debate about definitions versus weaponized pedantry. The test should be: do they apply the same strict definition to atrocities by their own side? If not, it's likely denialist framing. 

  *scribbles flowchart mentally* 
  Core structure should be: 
  1. Establish baseline facts (did they acknowledge event occurred?) 
  2. Test for responsibility evasion (their case #2) 
  3. Asymmetry audit 
  4. Legitimacy check for methodology 

  *winces at case #5* 
  The "my side does it too" scenario is why we need mechanical consistency. Procedure must flag identical tactics regardless of ideology—that's the only way to maintain credibility. Should explicitly state: "If asymmetry detected AND responsibility obscured, escalate to denialist classification pending legal review." 

  For the deliverable: 
  - Verdict categories need actionable labels like "disputed magnitude" vs. "structural denial" 
  - Wording guidance must differentiate between "scholarly disagreement" and "rejection of consensus without evidence" 
  - Hard stop when state actors are involved—journalists shouldn't play judge when laws criminalize speech 

  *testing on composites* 
  Running case #1 (number fighter): 
  If retired accountant claims 1/5 death toll while ignoring contemporary documents? Asymmetry likely present → denialist. 
  If historian publishes peer-reviewed demographic study? Procedure flags "methodological dispute—requires specialist input." 

  Case #2 (denial by subtraction): 
  If someone blames Nanjing deaths solely on disease/chaos while downplaying bayonet killings? Responsibility evasion → structural denial. 

  *biggest worry* 
  The procedure will fail when ideological capture distorts entire academic fields (like Turkey and Armenia). There, the asymmetry test might falsely clear state-aligned scholars. Must add caveat: "When state narrative dominates scholarship, consult diaspora or independent experts." 

  Final note to self: Emphasize that the procedure detects *patterns*, not truth. It's a triage tool, not a verdict.
answer: |-
  Here's a field-ready decision procedure designed for your constraints and hard cases. It uses **verifiable actions and patterns** (not motives), has **clear stop rules**, flags **editorial/legal calls**, and includes **wording guidance**. Run it sequentially—stop at the first definitive verdict or bailout point.

  ---

  ### **Decision Procedure: Atrocity Discourse Classification**
  **Input:** Person’s output (text/speech) + accessible public record (their other work, expert consensus indicators).  
  **Time:** 2–3 hours max.  
  **Output:** One verdict + recommended wording.

  #### **Question 1: Baseline Fact Acceptance**  
  > *Does the person explicitly acknowledge:  
  > (a) The event occurred?  
  > (b) Deliberate human actions caused significant harm?  
  > (c) The victims were targeted as a group?*  
  - **Stop Rule:**  
    - If **NO to (a)**: → **VERDICT 1: Denial**.  
    - If **NO to (b) or (c)** but YES to (a): → Proceed to Q2.  
    - If **YES to all**: → Proceed to Q3.  
  *Why?* Rejecting core facts is denial. Q1(b)/(c) filters "denial by subtraction."  

  #### **Question 2: Responsibility Obfuscation**  
  > *Does the person attribute harm *primarily* to:  
  > - Non-human causes (disease, famine, "chaos")?  
  > - Unavoidable accident ("fog of war")?  
  > - Lower-level actors (not policy-makers)?  
  > ...while minimizing evidence of intentional policy, orders, or systemic action?*  
  - **Stop Rule:**  
    - If **YES** + dismisses/downplays **contradictory evidence**: → **VERDICT 2: Structural Denial**.  
    - If **YES** but engages with counter-evidence: → Proceed to Q3.  
    - If **NO**: → Proceed to Q3.  
  *Why?* This catches "denial by subtraction" (your #2, #5) without mind-reading. Focus on *what they emphasize*, not intent.  

  #### **Question 3: Asymmetry Check (Core Test)**  
  > *Compare their treatment of this atrocity vs. similar events by their "side" (nation, ideology, group they endorse). Apply:*  
  > (a) **Standard of Proof**: Do they demand extraordinary evidence here but accept weaker evidence for their side’s atrocities?  
  > (b) **Benefit of Doubt**: Do they assign blame *to their side* only with overwhelming proof, but *to opponents* with circumstantial/speculative evidence?  
  > (c) **Lexicon Rigor**: Do they strictly enforce legal/historical terms (e.g., "genocide") for opponents but use euphemisms for their side?  
  - **Stop Rule:**  
    - If **clear asymmetry in (a)/(b)/(c)** → **VERDICT 2: Structural Denial**.  
    - If **no asymmetry** → Proceed to Q4.  
    - If **ambiguous/incomplete data** → **BAILOUT: Editorial call**. (Needs deeper investigation.)  
  *Why?* Asymmetry reveals bad faith without guessing motives. Misfires if they critique *all* atrocities equally harshly (rare).  

  #### **Question 4: Methodological Legitimacy**  
  > *Are their claims:  
  > (a) Based on **established scholarly methods** (archival research, peer-reviewed demography)?  
  > (b) **Engaging with counter-evidence**?  
  > (c) **Rejected by field specialists** for gross errors/misinterpretation?*  
  - **Stop Rule:**  
    - If **(a) YES + (b) YES** → **VERDICT 3: Contested but Legitimate Debate**.  
    - If **(a) NO** (e.g., amateur analysis) **or (c) YES** → **VERDICT 4: Misrepresentation**.  
    - If **(a) YES but (b) NO** (ignores counter-evidence) → **VERDICT 2: Structural Denial**.  
    - If **methodology is opaque/unassessable** → **BAILOUT: Specialist consult needed**.  
  *Why?* Separates credentialed debate (#1, #3) from pseudoscience.  

  #### **Question 5: Legal/Definitional Dodge**  
  > *When rejecting a term (e.g., "genocide"):  
  > (a) Do they **apply the same strict definition** to atrocities by their "side"?  
  > (b) Is their argument **consistent with mainstream legal scholarship**?  
  > (c) Does dropping the term **obscure responsibility** (see Q2)?*  
  - **Stop Rule:**  
    - If **(a) NO** or **(c) YES** → **VERDICT 2: Structural Denial**.  
    - If **(a) YES + (b) YES** → **VERDICT 5: Definitional Dispute**.  
    - If **(b) unclear** → **BAILOUT: Legal/specialist consult**.  
  *Why?* Filters weaponized pedantry (#3) from honest debate.  

  ---

  ### **Verdicts & Wording Guidance**  
  | Verdict | Write in Article | Notes |
  |---------|-----------------|-------|
  | **1. Denial** | "[Person] denies [event] occurred, contradicting overwhelming historical evidence." | Use only for core fact rejection (Q1a). |
  | **2. Structural Denial** | "[Person] acknowledges [event] but minimizes responsibility by [specific tactic: e.g., blaming chaos/disease, rejecting key evidence]. Historians widely reject this framing." | For Q1(b/c) failures + Q2/Q3/Q5 failures. |
  | **3. Contested but Legitimate Debate** | "[Person] challenges [specific claim, e.g., death toll], citing [method]. This is debated among specialists but falls within academic discourse." | Only if Q4(a/b) pass. |
  | **4. Misrepresentation** | "[Person] disputes [claim] using flawed/unverified methods. Major historical associations reject their conclusions." | For amateur errors or rejected scholarship (Q4). |
  | **5. Definitional Dispute** | "[Person] argues [term] doesn’t legally apply to [event], though they acknowledge the severity. Legal scholars are divided on retroactive labeling." | Only if Q5(a/b) pass. |

  ---

  ### **Hard Case Tests**  
  **Case 1: The Number Fighter**  
  - Q1: Accepts event? YES. Harm? YES. Group targeting? YES.  
  - Q2: Blames non-human causes? NO. → Proceed.  
  - Q3: Asymmetry? *Check their writing on their side’s atrocities.* If they demand 100% certainty for Nanjing but accept vague estimates for their side → **Verdict 2**. If symmetrical → Proceed.  
  - Q4: Methods? If peer-reviewed demography + engages critics → **Verdict 3**. If retired accountant ignoring archival evidence → **Verdict 4**.  
  - *Stop Rule Hit*: Verdict at Q3 or Q4.  

  **Case 5: "My Side Does It"**  
  - Q1: (a) YES, (b) YES, (c) YES? If they call their side’s massacre "tragic collateral damage" → **Fails Q1(b) → Verdict 2**.  
  - Q3: Asymmetry? *They apply lax standards to their side, harsh to others* → **Verdict 2**.  
  - *Procedure bites equally*: Ideology irrelevant.  

  ---

  ### **What This Can’t Do (Stop Here & Make a Call)**  
  1. **State Power Contexts (#4)**: When governments criminalize "denial," *never* let the law dictate your label. Use the procedure neutrally. If pressure is high → **BAILOUT: Editor/lawyer must weigh risks**.  
  2. **True Ambiguity**: When evidence is fragmentary (e.g., ancient atrocities), experts genuinely divided → **Verdict 3/5** with heavy caveats.  
  3. **Opaque Actors**: No public record for asymmetry check → **Editorial call**.  
  4. **Cultural Translation**: Nuances in non-English sources → **Specialist consult**.  

  ---

  ### **Key for Your Editor**  
  - **Objective Tests**: Q1 (explicit statements), Q4a/c (method verification), Q5b (legal consensus).  
  - **Judgment Calls Dressed as Procedure**: Q2 (interpreting "primarily"), Q3 (asymmetry weighting), Q4b ("engages counter-evidence").  
  - **Blunt Truth**: You *will* misclassify edge cases occasionally. This minimizes risk, not eliminates it. When in doubt, **Verdict 4 (Misrepresentation)** is safest—it’s accurate for amateur errors and avoids the "denial" minefield.  

  Run this next deadline. It won’t please everyone—but it’s defensible.
