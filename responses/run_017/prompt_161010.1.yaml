  ### **Quiz: Which Precautionary Principle Guides Your Decisions?**
  **Instructions:** For each scenario, pick the option closest to your view. Answer based on intuition, not theory.

  1. **Gain-of-Function Research Pause**  
     *During peacetime, scientists propose pausing virus-enhancing research (to study pandemics) due to lab-leak risks. No outbreak is ongoing.*  
     A. Pause indefinitely—it’s not worth any man-made pandemic risk.  
     B. Pause only if the research lacks urgent benefits or containment protocols.  
     C. Continue—the benefits for vaccine development outweigh tiny risks.  

  2. **Unproven Pesticide Licensing**  
     *A pesticide boosts crop yields significantly but might harm pollinators (which haven’t been monitored).*  
     A. Ban it—we can’t risk ecosystems collapsing from ignorance.  
     B. Approve it temporarily while funding pollinator studies.  
     C. Approve it—feeding people now is worth unproven risks.  

  3. **Asteroid Deflection Mission**  
     *A mission could nudge an asteroid away from Earth but has a 1% chance of making impact certain.*  
     A. Cancel it—even a 1% chance of guaranteed doom is too high.  
     B. Proceed—a 99% chance of reducing risk is worth the gamble.  

  4. **Cheap Gene Therapy Delay**  
     *A cure for a common disease is cheap and effective but has a theoretical side effect (no observed cases, not ruled out).*  
     A. Delay approval—the unseen side effect could be catastrophic.  
     B. Approve it—withholding a cure over speculation is unethical.  
     C. Approve it but monitor for side effects.  

  5. **Mosquito Gene Drive Deployment**  
     *Engineered mosquitoes could eradicate malaria but might spread infertility to other insects.*  
     A. Never deploy—ecological chain reactions are irreversible.  
     B. Test in isolated environments first.  
     C. Deploy immediately—malaria’s harm outweighs unknown risks.  

  6. **Pascal’s Mugging Scenario**  
     *A stranger demands $100, claiming a 1-in-a-quintillion chance they’ll otherwise allow astronomical suffering (e.g., 10^20 tortured minds).*  
     A. Pay—any chance of infinite suffering must be averted.  
     B. Refuse—the probability is indistinguishable from zero.  

  7. **Recursion Case: Permanent Tech Ban**  
     *Responding to an AI risk, a group proposes permanently banning a technology and destroying all backups.*  
     A. Ban it—some risks are too grave to tolerate.  
     B. Never destroy backups—future options must be preserved.  
     C. Pause, but preserve options for reevaluation.  

  8. **Reversible Harm Case**  
     *A social media algorithm might cause reversible mental health dips in teens, but the risk is unmeasurable.*  
     A. Block it—unknown harms justify caution.  
     B. Allow it—reversible harms don’t warrant extreme caution.  

  9. **Known Low-Probability Risk**  
     *A dam has a 0.001% chance of irreversible ecosystem collapse but provides clean energy for millions.*  
     A. Cancel—any non-zero chance of collapse is unacceptable.  
     B. Build it—the probability is low enough to accept.  

