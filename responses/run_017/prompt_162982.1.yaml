  ```sql
  SELECT B.ID
  FROM Beings B
  JOIN Being_Properties BP ON B.ID = BP.BeingID
  JOIN Properties P ON BP.PropID = P.PropID
  JOIN GreatnessOrder G ON P.PropID = G.PropID
