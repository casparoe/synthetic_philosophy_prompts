  5. Hence, the GCB must exist in reality.

  The lost-island parody (by Gaunilo) applies the same reasoning to a perfect island, arguing that by the same logic we would have to conclude that such an island exists, which is absurd.

  The objection that existence is not a predicate (associated with Kant) holds that existence does not add to the concept of a thing; it is not a property that can be predicated of an object in the same way as, say, being red or being tall.

  **Translation into Data Modeling Terms:**

  Let's model this in terms of a database schema.

  - **Domain:** We have a set of possible beings (or entities) and a set of properties that these beings can have. We also have a special property: existence in reality (as opposed to existence in the understanding).
  - **Tables:**
