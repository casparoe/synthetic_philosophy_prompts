  ### Key Insights  
  - **Load-Bearing Feature**: Taylor’s **executive fatigue** is the linchpin. It’s a non-cognitive, physiological blocker (e.g., depleted mental energy from a taxing week) that severs the link between judgment and action—unlike discounting, which alters valuation. Remove it, and Taylor’s weakness of will vanishes.  
  - **Why This Isn’t Hyperbolic Discounting**: Taylor’s discount curve remains exponential; they consistently value P > H. Their failure is volitional (can’t *execute* P), not evaluative (didn’t revalue H > P).  
  - **Strongest Objection & Rebuttal**: Critics might argue fatigue makes immediate costs "feel" heavier, mimicking present bias. But Taylor’s unwavering judgment ("P is better") proves no revaluation occurred—the mechanism is motor disinhibition, not discounting.  

  This case isolates weakness of will as a *volitional pathology* distinct from time inconsistency. Sam’s present bias changes what they want; Taylor’s fatigue breaks the connection between wanting and doing.
