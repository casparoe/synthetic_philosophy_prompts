answer: |-
  ### Scenario  
  Sam and Taylor are colleagues who, on Tuesday, both plan to attend a retirement party on Friday evening. The party (Option P) offers meaningful long-term rewards: strengthening work relationships and fulfilling social obligations. Staying home (Option H) provides immediate comfort but no lasting benefits. By Friday, both choose to stay home—but for fundamentally different reasons.  

  - **Sam** (Agent A): On Tuesday, Sam prefers P > H, valuing future relationships. On Friday, Sam’s preference reverses (H > P) due to present bias: the *immediate* effort of attending feels disproportionately costly. Crucially, Sam’s judgment aligns with this reversal—they now sincerely believe H is better. Sam stays home without regret.  
  - **Taylor** (Agent B): On Tuesday *and* Friday, Taylor prefers P > H, judging the party better for their career and relationships. Yet on Friday, Taylor experiences acute executive fatigue—a sudden, overwhelming physical exhaustion unrelated to discounting. This fatigue paralyzes their willpower, overriding their judgment. Taylor stays home while consciously believing it’s the worse choice, feeling deep guilt afterward.  

