prompt: |-
  hey — I'm writing a blog post arguing that "weakness of will is just hyperbolic discounting with a fancy Greek name" is a category error, and I need one worked case to make it land. Can you build it?

  I want a single ordinary scenario (two collegues deciding about the same Friday evening; no addiction, no medication, no "multiple selves" metaphor doing the work; one short paragraph) with two agents who end up doing the same thing, where:

  - Agent A is genuinely time-inconsistent: their preference between the two options reverses between Tuesday and Friday, with the outcome descriptions, their information, and the temptation strength all held fixed, and the reversal comes from present bias / a beta-delta style curve rather than anything else. But it would be wrong to call A weak-willed: at the moment of acting they don't do what they judge worse, because their judgment moves along with their preference.
  - Agent B is not time-inconsistent at all — same ordering on Tuesday and Friday, no present bias — and yet is straightforwardly weak-willed: right then, on Friday, they do the thing they themselves judge worse. Since their discount rate isn't shifting, something else has to be doing the work, and I want it stated as an actual mechanism, not just named. "Their motivations came apart" is the kind of hand-waving I'm trying to avoid.

  To keep this from collapsing into stipulation, run the reversal test explicitly: name the option pair, give each agent's ordering on Tuesday and on Friday and their all-things-considered judgment on Friday, then show which of the two diagnoses each one gets and why. By "judgment" I just mean what they'd say, sincerely and with no self-deception, if you asked them right then which option is better — that's the only sense I care about, so don't solve the problem by making one of them confused about what they want.

  After that: which feature of the setup is load-bearing, what happens to the case if you remove it, and how would someone who thinks present bias is the whole story push back?

  Give me the scenario as prose, then a JSON object with exactly these fields: scenario (string), agents (array of objects, each with name, discount_function, preference_tuesday, preference_friday, judgment_friday, action, hyperbolic_discounting (bool), akratic (bool), mechanism (string)), reversal_test (string), load_bearing_feature (string), removal_test (string), strongest_objection (string), confidence (number 0–1).
