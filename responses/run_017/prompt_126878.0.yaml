  We are going to build a scenario with two colleagues, Sam and Taylor, deciding about their Friday evening. The two options are:
    Option X: Attend a colleague's retirement party (social obligation, mildly enjoyable, but requires effort to go out).
    Option Y: Stay home and relax (immediately gratifying, low effort).

  We need to set up such that:
    - Agent A (Sam) is time-inconsistent due to present bias (hyperbolic discounting). On Tuesday, Sam prefers going to the party (because it's in the future and the immediate cost isn't felt), but on Friday, the immediate cost of going looms large and Sam prefers staying home. Importantly, at the time of acting (Friday), Sam's judgment (what they would say if asked) aligns with their preference: they now think staying home is better. So they are not weak-willed because they are doing what they judge best at the time.

    - Agent B (Taylor) is not time-inconsistent. On both Tuesday and Friday, Taylor judges that going to the party is the better option (because they value maintaining relationships and they know they'll feel good about having gone). However, on Friday, Taylor ends up staying home. Why? We need a mechanism that isn't discounting. Let's say that Taylor experiences a sudden surge of tiredness and inertia that overpowers their better judgment. They don't change their mind about what's better; they just fail to act on it. The mechanism is a temporary overwhelming of their executive function by a visceral state (tiredness) that leads to inaction.

  Reversal test: 
    For Sam (A): 
      Tuesday preference: Party (X) > Home (Y)
      Friday preference: Home (Y) > Party (X)
      Friday judgment: Home (Y) is better. So they act (stay home) in accordance with their judgment.

    For Taylor (B):
      Tuesday preference: Party (X) > Home (Y)
      Friday preference: Party (X) > Home (Y) [unchanged]
      Friday judgment: Party (X) is better. But they act by staying home (Y), so they act against their own judgment.

  Now, the mechanism for Taylor: We can describe it as an "executive function failure due to acute fatigue". The key is that Taylor's judgment (what they think is best) remains intact, but their ability to follow through is compromised by a transient state that doesn't alter their evaluation but does alter their capacity to act.

  Load-bearing feature: The mechanism of executive function failure (or visceral override) that is distinct from any change in discounting. This is what allows Taylor to have stable preferences/judgment but still fail to act accordingly.

  Removal test: If we remove the acute fatigue (or the visceral state) on Friday, then Taylor would go to the party. But note: if we remove the present bias from Sam, then Sam would consistently prefer the party and go.

  Strongest objection: Someone who thinks present bias is the whole story might argue that Taylor's failure is also due to a form of time inconsistency, but at a more granular level. They might say that the immediate discomfort of getting ready and going out is being over-weighted at the moment of action, which is effectively present bias. However, in our setup, we have specified that Taylor's judgment (their all-things-considered evaluation) still ranks the party higher. So if Taylor is not discounting the future costs and benefits differently at the moment, then it's not a discounting issue. But the objector might claim that the judgment itself is not the whole story and that there is an implicit discounting of the future benefits of going to the party because they are not immediate. We can counter by noting that Taylor explicitly says, even in the moment, that going is better. The objection might then be that what Taylor says is not their true preference, but that would be moving the goalposts.

  Confidence: I think the case is strong, but the objection might have some traction in redefining terms. I'll set confidence at 0.85.

  Now, let's write the scenario in prose:

  **Scenario:**
  Sam and Taylor, two colleagues, are deciding about their Friday evening. On Tuesday, both plan to attend a colleague's retirement party (Option X) because they believe it's important for maintaining workplace relationships and they expect to feel good about going. Staying home (Option Y) is appealing for immediate relaxation but less so in the long run. 

  By Friday evening, both end up staying home. 

  For Sam, on Tuesday the party seemed clearly better. But on Friday, the immediate effort of getting ready and going out feels overwhelming, and Sam now genuinely thinks staying home is the better choice. Sam acts on this judgment and stays home without regret. 

  Taylor, however, on Friday still judges that going to the party is the better option: they believe they should go to maintain relationships and they know they'll regret missing it. But after a particularly exhausting work week, Taylor feels an intense wave of fatigue and inertia. Despite their judgment, Taylor cannot muster the energy to get off the couch and go. Taylor stays home, knowing it's the worse choice, and feels guilty afterward.

