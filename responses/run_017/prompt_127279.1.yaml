  ### Case Setup: The Pawnbroker's Dilemma

  You need a $1000 loan to cover an emergency expense. A pawnbroker, who is 70% accurate at reading whether someone will repay, offers the loan with a verbal agreement that you'll repay $1100 in a month. There is no contract, collateral, repeat interaction, or reputation—only her assessment of your type. After the loan, she can choose to demand the agreed $1100 or opportunistically overcharge $1500 at repayment. You can pre-commit to a disposition:  
  - **Type H (Honest)**: Pay whatever is demanded (you've self-bound to "always repay debts," losing track of the exact amount).  
  - **Type S (Strategic)**: Pay nothing (you rationally maximize immediate gain).  

  The pawnbroker lends *only* if her read is "Type H." If she reads "Type S," she refuses the loan.  

  **Payoffs (Borrower Perspective)**:  
  - **Loan obtained + full repayment**: Gain $1000, lose repaid amount. Net: `$1000 - repayment`.  
  - **Loan obtained + no repayment**: Net +$1000.  
  - **No loan**: Net $0.  

  **Mechanism for coarse disposition**: Self-binding (e.g., via self-deception like "I owe what I’m asked") makes you pay *any* demand. You cannot fine-tune it to "pay only $1100" because the cognitive act of *tracking the debt* would preserve your strategic reasoning, allowing you to renege if overcharged. Only by abandoning exact memory of the debt can you ensure repayment—but this leaves you vulnerable to exploitation.  

  **Outcomes**:  
  - If you become **Type H**:  
    - Pawnbroker reads "H" (70% chance): Lends $1000, then overcharges $1500 (she knows Type H pays anything). You repay $1500. **Net: -$500**.  
    - Pawnbroker reads "S" (30% chance): No loan. **Net: $0**.  
    **Expected value (EV)**: \(0.7 \times -500) + (0.3 \times 0) = -$350\).  
  - If you remain **Type S**:  
    - Pawnbroker reads "S" (70% chance): No loan. **Net: $0**.  
    - Pawnbroker reads "H" (30% chance): Lends $1000. You pay nothing. **Net: +$1000**.  
    **EV**: \(0.7 \times 0) + (0.3 \times 1000) = $300\).  

  Self-binding (Type H) yields **-$350**; staying strategic (Type S) yields **+$300**. You lose $650 by becoming irrational. The backfire occurs *within the transaction*: The pawnbroker overcharges only when she expects repayment, exploiting your coarse disposition. Her 70% accuracy ensures she sometimes misreads Type S as H (30%), allowing Type S to profit, but self-binding invites overcharging when it works.  

  ---

  ### Decision Theory Analysis  
  **First node (pre-commitment decision)**:  
  - **Causal (CDT)**: Choose based on causal consequences.  
    - Self-bind → EV = -$350.  
    - Stay strategic → EV = +$300.  
    **Verdict: Don’t self-bind**.  
  - **Evidential (EDT)**: Choose based on evidence provided by the act.  
    - Self-binding *correlates* with being overcharged when read as H (70% of the time), leading to negative evidence. EV = -$350.  
    - Staying strategic correlates with free loans when misread (30%), positive evidence. EV = +$300.  
    **Verdict: Don’t self-bind**.  
  - **Functional (FDT)**: Choose the best decision rule.  
    - Rule 1 (self-bind): If followed, pawnbroker overcharges when she reads H, giving EV = -$350.  
    - Rule 2 (stay strategic): If followed, pawnbroker sometimes misreads, giving EV = +$300.  
    **Verdict: Follow Rule 2 (don’t self-bind)**.  

  **Second node (repayment decision)**:  
  - **Type H (self-bound)**: Pays $1500 (no choice—disposition forces payment).  
  - **Type S (strategic)**: Pays $0 (causally dominates payment).  
  All theories agree with the action dictated by the type at this node.  

  ---

  ### Load-Bearing Feature and Sensitivity  
  **Load-bearing feature**: The pawnbroker’s *ability to overcharge conditional on her read*. She overcharges only when she expects repayment (i.e., when she reads "Type H"), and your coarse disposition ensures you comply. If removed (e.g., she must demand $1100 always):  
  - Type H EV: \(0.7 \times (1000 - 1100) + 0.3 \times 0 = -$70\).  
  - Type S EV: \(0.3 \times 1000 + 0.7 \times 0 = $300\).  
  Self-binding is still worse (-$70 vs. +$300), but by only $370. The overcharge amplifies the loss by making exploitation more extreme when you self-bind.  

  ---

  ### Wriggle Room for Proponents of Rational Irrationality  
  A proponent might argue: "You can self-bind to pay *exactly $1100*, not any amount. Fine-tuning is possible!"  
  **Rebuttal**: This fails the constraints. To enforce "$1100 exactly," you must track the debt, preserving your strategic reasoning. At repayment, if she demands $1500, CDT/EDT/FDT would advise refusing (paying $0 dominates paying $1500). The pawnbroker, knowing this, won’t overcharge—but she also won’t lend if her read is "Type H" because:  
  - Her EV for lending: \(0.7 \times 1100 + 0.3 \times 0 = $770 < 1000\) (a loss).  
  Thus, she *refuses all loans*, and self-binding gains nothing (EV = $0), while staying strategic occasionally profits from misreads. The coarse disposition remains necessary to get the loan—and it invites overcharging. No wriggle avoids the trap without smuggling in enforcement or violating the one-shot setup.
