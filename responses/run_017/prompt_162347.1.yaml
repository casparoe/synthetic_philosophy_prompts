answer: |-
  ### Rational Irrationality: The Hitchhiker's Dilemma Activity  
  **Designed for 22 students, 80 minutes, with a PhD assistant.**

  ---

  ### **Materials & Setup**
  - **Equipment**: Movable tables, whiteboard, index cards (44), envelopes (22 numbered), pens, timer.
  - **Anonymity System**: 
    - Assign each student a random ID (1–22). Use numbered envelopes to collect decisions (e.g., "Hitchhiker 12" envelope).
    - PhD assistant shuffles pairings and matches decisions privately. Only aggregate results are revealed.
  - **Payoffs**:  
    - Points convert to **essay title priority**: Top 7 hitchhikers/drivers (top third) pick assessed essay titles first.  
    - No real money. Point system:  

  | **Role**       | **Action**                              | **Points**                          |  
  |----------------|-----------------------------------------|-------------------------------------|  
  | **Hitchhiker** | Not picked up (no bond)                 | 0                                   |  
  |                | Not picked up (bought bond)             | –20 (bond cost)                     |  
  |                | Picked up, paid (no bond)               | 0 (100 saved – 100 paid)            |  
  |                | Picked up, **not** paid (no bond)       | +100 (100 saved – 0 paid)           |  
  |                | Picked up (bought bond)                 | +80 (100 saved – 20 bond cost)      |  
  | **Driver**     | Didn’t stop                             | 0                                   |  
  |                | Stopped & paid                          | +90 (100 payment – 10 stop cost)    |  
  |                | Stopped & **not** paid                  | –10 (0 payment – 10 stop cost)      |  
  | **Belief Bonus**| Accuracy on payment probability (0–100)| Linear scoring: `(p/10)` if paid, `((100-p)/10)` if not paid (rounded, max +10) |  

  ---

  ### **Game Rules**  
  1. **Roles**:  
     - **Hitchhikers** (IDs 1–11): Decide pre-emptively whether to buy a "bond." If bought, payment is automatic if picked up.  
     - **Drivers** (IDs 12–22): Decide whether to stop after reading the hitchhiker’s message.  

  2. **Key Mechanics**:  
     - **Bond**: Costs 20 points. Bought *before* hitchers know if they’ll be picked up. Non-refundable. If bought, payment is enforced automatically—no choice at arrival.  
     - **Cheap Talk**: Hitchers write 1 sentence to drivers. **Crucially**: Unbonded hitchers *can lie* and claim they bought the bond.  
     - **Driver Belief**: Drivers state a probability (0–100) that their hitcher will pay *before* deciding to stop. Scored for accuracy.  
     - **Filler Task**: After being "picked up," hitchers complete a 4-minute distraction task *before* payment decisions (simulates "safety" time gap).  
     - **One-Shot & Anonymous**: Pairings reshuffled secretly. No repeated interactions.  

  ---

  ### **Timeline (80 Minutes Total)**  
  **Total Facilitator Script: British English, clear, paced.**  

  1. **Introduction (5 mins)**  
     - Explain the hitchhiker dilemma: "Stranded in desert, driver offers ride for £100 promise. At town, why pay?"  
     - Emphasise: **No reputation**—pairings random, anonymous. **Payoffs matter** (essay priority).  
     - State: "Bond buys commitment. Cheap talk allows lies. Drivers predict payments."  
     - Show payoff table on whiteboard.  

  2. **Pre-Play: Bond & Message (5 mins)**  
     - **Hitchhikers**:  
       - On index card, circle **BOND** or **NO BOND**.  
       - Write **1 sentence** to driver (e.g., "I bought the bond" or "I’m trustworthy!").  
       - Seal in envelope (e.g., "Hitchhiker 5").  
     - *Collect envelopes. PhD records bond status/messages privately.*  

  3. **Pairing & Driver Decisions (10 mins)**  
     - PhD randomly pairs drivers with hitchhikers (e.g., Driver 14 ↔ Hitchhiker 3).  
     - **Drivers**:  
       - Receive *only* their hitcher’s message (e.g., "I have a bond!").  
       - On card: Circle **STOP** or **NOT STOP**, write **probability** (0–100) of payment.  
       - Seal in envelope (e.g., "Driver 14").  
     - *Collect envelopes. PhD records decisions.*  

  4. **Filler Task (4 mins)**  
     - **All students**: "List as many UK Prime Ministers since 1945 as possible in 2 mins."  
     - *After 2 mins*: "Now, circle the ones from the 21st century." (Keep time pressure.)  
     - *Purpose*: Simulate "time passing" for hitchers to feel "safe."  

  5. **Payment Decision (5 mins)**  
     - Announce which hitchers were "picked up" (e.g., "Hitchhikers 3, 7, 11 picked up").  
     - **Unbonded hitchers** who were picked up:  
       - On card, circle **PAY** or **NOT PAY**.  
       - Seal in envelope.  
     - *Bonded hitchers*: No action (payment automatic).  
     - *Collect envelopes. PhD compiles data.*  

  6. **Reveal & Scoring (15 mins)**  
     - **Whiteboard Aggregates** (example):  
       ```  
       HITCHHIKERS  
       Bond bought: 5/11  
       Cheap talk: 8 claimed bond (3 true, 5 lies)  
       Unbonded paid: 2/6 | Didn’t pay: 4/6  

       DRIVERS  
       Stopped: 8/11  
       Avg. belief if paid: 75% | If not paid: 30%  
       ```  
     - **PhD calculates points/belief bonuses**. Announce top scorers (IDs only) for essay priority.  

  ---

  ### **Debrief (35 mins)**  
  **Goal**: Link activity to theory. Pre-empt econ-meta, principle objections, and bonding pitfalls.  

  #### **Key Debriefing Points**  
  1. **Rational Irrationality & Commitment**:  
     - "Why did bonded hitchers get picked up more? *Ex ante*, buying the bond was rational—it made you credible. *Ex post*, unbonded hitchers ‘rationally’ didn’t pay (100 > 0!), but that made drivers distrust them. Commitment devices resolve this."  
     - **Map to activity**: Show driver stop rates for bonded vs. unbonded hitchers. Ask: "Who regretted not buying the bond?"  

  2. **Tying Hands vs. Changing Preferences**:  
     - "The bond ‘ties you to the mast’—it’s external enforcement. Without it, you rely on internal change (e.g., morals), but payoffs made that irrational here."  
     - **Contrast with morals**: "Did anyone pay without a bond? Why? Note: If you felt guilty, your ‘payoff’ changed. But in strict rationality, only the bond forces compliance."  

  3. **Not Prisoner’s Dilemma**:  
     - "This isn’t ‘just defect.’ PD is simultaneous, symmetric. Here:  
       - **Sequential**: Driver moves first, hitcher second.  
       - **Asymmetric**: Driver risks –10; hitcher gains +100 if cheating.  
       - **Commitment tool**: PD has no bond equivalent!"  
     - **Show payoff asymmetry**: Drivers need only 10% payment chance to break even (E[payoff] = 90p – 10(1–p) ≥ 0 → p ≥ 10%).  

  4. **Cheap Talk & Trust**:  
     - "Did drivers stop more for bond claims? Did liars pay? Probably not—cheap talk failed without commitment. Truthful bond claims built trust; lies poisoned it."  
     - **Use whiteboard data**: If drivers ignored claims, note: "In one-shot games, cheap talk is noise without consequences."  

  5. **Beliefs & Time Inconsistency**:  
     - "Drivers who predicted low payment were often right. Why? They anticipated the hitcher’s *future* self would defect. That’s time inconsistency—your ‘desert self’ vs. ‘town self’."  
     - **Ask drivers**: "Did you distrust promises? Smart—you saw the temptation before hitchers felt it."  

  #### **Predictable Problems & Fixes**  
  - **Econ students meta-gaming bonds**:  
    - *Problem*: "If everyone buys bonds, drivers always stop!" → Bonds become dominant.  
    - *Fix*: Stress bond cost (–20 if not picked up). Debrief: "Bonds are only rational if pickup likelihood outweighs cost. Did drivers avoid unbonded?"  
  - "**Won’t play promise-breaker**":  
    - *Problem*: Moral students pay unbonded.  
    - *Fix*: "Note your internal payoff shift. But in rationality terms, you ‘irrationally’ lost 100 points." Show payoff tables.  
  - **Drivers stop for all (politeness)**:  
    - *Problem*: Drivers ignore payoffs, stop universally.  
    - *Fix*: Pre-game emphasis: "Maximise points—stopping blindly loses you –10 if cheated." Use belief bonus to incentivise realism.  
  - **Lying poisons atmosphere**:  
    - *Problem*: Students resent being deceived.  
    - *Fix*: Normalise in intro: "Lying is permitted—it’s part of testing trust." Debrief: "Did lies collapse cooperation? That’s real-world rational irrationality!"  
  - **Everyone buys bonds**:  
    - *Problem*: No variation to analyse unbonded behaviour.  
    - *Fix*: If >75% buy bonds, announce: "Bond shortage! Only first 5 envelopes processed." (Pre-set rule.)  

  #### **Structural Limits (Facilitator Must Explain)**  
  1. **Split-Person Problem**:  
     - "In reality, one person faces *time* inconsistency. Here, roles split that across people. You didn’t *feel* your own future defection—you saw someone else do it. The filler task simulated this, but it’s not identical."  
  2. **Payoffs ≠ Rationality**:  
     - "This shows what’s *payoff-maximising*, not what rationality *is*. Philosophers debate: Is it rational to satisfy future you or past you? The bond is a tool for your past self to bind future you."  
  3. **No Preference Change**:  
     - "Real hitchhikers might *want* to repay kindness. Here, payoffs made defection ‘rational’—we stripped away morals. In life, preferences are messier."  

  ---

  ### **Runoff Summary**  
  - **Before Session**: Number envelopes 1–22. Print payoff tables. Prep whiteboard aggregates template.  
  - **During**: Stick to timeline. Use PhD to shuffle/match envelopes swiftly.  
  - **Debrief**: Start with "What surprised you?" Use whiteboard data to anchor theory. Pre-empt econ objections early.  
  - **Final Tip**: If econ students dominate, pose: "If this were repeated, would bonds still be needed? Yes—reputation is fragile. But today, we’re isolating one-shot commitment."  

  **British English Check**: "Prioritise," "whilst," "maths," "plough through," "post" (not "mail").  

  ---  
  This design forces students to confront time inconsistency, cheap talk failure, and commitment value—while dodging reputation games. Run it verbatim, and debrief hard!
