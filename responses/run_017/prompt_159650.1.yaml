  Okay, let me try to unpack this user's problem. They're in a formal epistemology reading group and worked through Lewis's triviality results for indicative conditionals. They reconstructed the derivation with explicit numbers and noticed something troubling—the argument seems to generalize beyond conditionals to other epistemic modals like "might" and probabilistic comparisons. 

  Hmm, the user is clearly technically proficient—they're manipulating probability distributions and affine functions with ease. Their anxiety shines through: they've discovered what feels like a philosophical nuclear weapon that vaporizes truth-conditions for half our epistemic vocabulary. The core tension they articulate is beautiful: how can we reconcile Adams' Thesis (which feels right) with propositionality (which feels necessary) without imploding epistemic discourse?

  Let me walk through their steps. Their reconstructed proof is elegant—using concrete P and P' distributions makes the non-affineness visceral. The extension to "might"-claims is devastatingly clever: threshold effects create discontinuities that mixtures exploit. Their observation about comparative likelihood claims ("C is more likely than D") is equally damning—credence comparisons aren't affine either. 

  I notice two unspoken worries beneath the surface. First, about compositionality: if "if A then C" isn't a proposition, how do we explain embedded conditionals? Second, about normative symmetries: why does "credence = conditional credence" feel uniquely right for conditionals if the math equally supports it for "might"?

  Their attempted exits are telling. The "shifting content" move feels like cheating—if any sentence can dodge propositionality by appealing to context shift, why did we ever think propositions existed? The "mixing closure" complaint is more interesting—maybe real agents don't have credence functions closed under convex combinations? But that seems to undermine standard Bayesian modeling.

  The user's philosophical loyalties matter here. They want to keep Adams' Thesis and truth-aptness for epistemic modals—a tall order. I should acknowledge that tension rather than paper over it. Their die example is perfect; I'll keep using it to make things concrete.

  The key insight is recognizing that conditionals and epistemic modals are devices for reflecting on one's epistemic state. When we say "if A then C", we're not describing the world directly but constraining our own uncertainty. That's why their probabilities behave differently from propositions—they're meta-representations. 

  For the "might" case, the threshold issue is critical. Their version assumes a sharp threshold, but in practice "might" has vagueness and context-sensitivity. Still, the problem persists even if we make the threshold fuzzy—as long as there's some drop-off in acceptability when cr(C) approaches zero, mixtures will cause trouble.

  I think the cleanest resolution is to bite the bullet: epistemic modals don't express classical propositions. But that doesn't make them "not truth-apt"—it means we need a more flexible notion of content. Relativist or dynamic semantics could help here. Alternatively, we might distinguish between credence in a content and credence in the appropriateness of an assertion, though that feels like retreating to metalinguistic safety.

  The mixing assumption deserves more attention. Ordinary agents don't form linear mixtures of probability functions—they update. But in the triviality proofs, mixtures are just mathematical tools to expose structural features. Rejecting mixtures feels like rejecting the thermometer because it tells you you're sick.

  Ultimately, the user has hit upon a profound point: much of epistemic language is "fraught" in Yalcin's sense. Their discomfort is the sound of classical propositions cracking under epistemic pressure. I should validate that insight while offering paths forward—perhaps toward expressivist or informational accounts that preserve truth-aptness without propositionality.
answer: |-
  Your reconstruction is sharp and exposes a genuine foundational tension. The Lewis-style argument *does* generalize, and this reveals deep constraints on how credences, propositions, and epistemic vocabulary interact. Let's dissect your steps, identify the exits, and weigh the costs. The core conflict is between **Adams's Thesis (AT)**, the **Affineness of Propositional Credence (AFF)**, and the **Truth-Aptness of Epistemic Vocabulary (TRUTH)**.

  ### Step-by-Step Analysis & Exits

  1.  **Adams's Thesis (AT):** `cr(if A then C) = cr(C|A)` (when `cr(A)>0`). You want to keep this. It's empirically well-supported for indicative conditionals and central to their logic.
  2.  **Concrete Case:** This is just an illustration. Uncontroversial. It shows `cr(C|A)` is not affine (`P(C|A) = 1/3`, `P'(C|A)=5/6`, `P½(C|A)≈0.606 ≠ (1/3 + 5/6)/2 ≈ 0.583`).
  3.  **The Mixture P½:** Also uncontroversial. `P½ = ½P + ½P'` is a valid probability function.
  4.  **Affineness (AFF):** `P½(X) = ½P(X) + ½P'(X)` for any proposition `X`. This *is* compulsory *if* `X` is a proposition whose truth conditions are fixed independently of the credence function evaluating it. This is the standard Kolmogorov/Bayesian picture: propositions are sets of worlds, credences are measures over these sets.
  5.  **Contradiction & Conclusion:** If "if A then C" denotes a proposition `X`, then:
      *   By AT: `cr(X) = cr(C|A)` for *any* credence function `cr`.
      *   Therefore: `P(X) = P(C|A) = 1/3`, `P'(X) = P'(C|A) = 5/6`.
      *   By AFF: `P½(X) = ½*(1/3) + ½*(5/6) = 7/12 ≈ 0.583`.
      *   By AT applied to `P½`: `P½(X) = P½(C|A) ≈ 0.606`.
      *   Contradiction: `0.583 ≠ 0.606`.
      *   Conclusion: "if A then C" does not denote a proposition satisfying AFF.
  6.  **The Generalization:** This is the crucial insight. The argument only relies on:
      *   A rule `cr(S) = f(cr)` assigning credence to sentence `S` based on the credence function `cr`.
      *   The function `f` being **non-affine** (`f(½P + ½P') ≠ ½f(P) + ½f(P')`).
      *   `cr(C|A)` is non-affine (as shown).
      * `cr(◊C) = 1 if cr(C)>0 else 0` is non-affine (as your "might" example shows: `f(P)=1`, `f(P')=0`, `f(P½)=1 ≠ 0.5`).
      * `cr(C >_L D) = 1 if cr(C) > cr(D) else 0` is non-affine (mix two functions where `P(C)>P(D)` but `P'(C)<P'(D)` such that `P½(C) ≈ P½(D)`; `f(P)=1`, `f(P')=0`, `f(P½)=?` -- it could be undefined by the rule, or require a tie-breaker, but strict inequality makes it discontinuous and non-affine).
      * `cr(probably C) = 1 if cr(C)>t else 0` is non-affine (as you note).
  7.  **Application to Epistemic Modals/Comparatives:** Your derivations are correct. The argument *does* generalize: **Any sentence `S` governed by a credence-assignment rule `cr(S) = f(cr)` that is a non-affine function of the credence function cannot denote a proposition satisfying AFF.**

  ### The Tension & The Exits

  You cannot simultaneously hold **AT**, **AFF**, **TRUTH** (for conditionals *and* epistemic modals/comparatives), *and* the **Mixing Closure** assumption (that the class of rational credence functions is closed under convex combination). Your generalization proves this. You must reject at least one.

  Here are the exits, with costs:

  1.  **Reject Adams's Thesis (AT) for Indicative Conditionals:**
      *   **Why it looked compulsory:** AT is the cornerstone of the Ramsey Test, explains the failure of certain logical laws (e.g., strengthening the antecedent), and fits many intuitive judgments.
      *   **Cost:** Requires a fundamentally different (and likely more complex) account of conditional credence and its link to conditionals. Must explain why AT *seems* so compelling and works so well locally if it's globally untenable. Faces the challenge of the "or-to-if" inference and other data AT handles elegantly. *Doesn't solve the problem for "might"/comparatives.*
      *   **Verdict:** Possible but costly and doesn't address the broader issue you uncovered. You explicitly want to keep AT.

  2.  **Reject Affineness (AFF) for Propositions:**
      *   **Why it looked compulsory:** AFF is a direct consequence of the standard definition of probability measures over a fixed algebra of propositions (sets of worlds). `P½(X)` is *defined* as `∫ X d(½P + ½P') = ½∫ X dP + ½∫ X dP' = ½P(X) + ½P'(X)`.
      *   **Cost:** Requires abandoning the standard possible-worlds model of propositions and credence as a simple measure over them. What replaces it?
          *   **Option A: Context/Index-Dependence:** Propositions are true/false relative to a world *and* some contextual parameter (like an information state or standard of precision). Credence `cr(X)` is then an average over worlds *only*, holding the contextual parameter fixed for the agent. However, this *preserves AFF* for the fixed contextual parameter. The non-affineness of `f(cr)` arises precisely because `f` depends on the credence function itself (which embodies the information state), effectively changing the relevant contextual parameter across `P`, `P'`, and `P½`. AFF doesn't hold *across* different contextual settings. This is the "shifting content" move you considered.
          *   **Option B: Radical Non-Classicality:** Propositions aren't sets of worlds at all; credences aren't classical measures. This could involve truth-value gaps, degrees, or non-Boolean algebras. Highly revisionary.
      *   **Verdict:** **This is the most promising exit if you want to preserve TRUTH for epistemic vocabulary.** The "shifting content" move (Option A) is *not* available for *any* sentence; it's specifically motivated for sentences whose intuitive truth conditions *depend on the agent's epistemic state*. "The die landed 2" doesn't shift; "It might be 2" clearly does. This dissolves the *contradiction* by blocking the application of AFF *across* credence functions with different information states. The "proposition" expressed by "if A then C" or "might C" depends on the epistemic context (modelled by the credence function itself). `P½` evaluates the sentence relative to *its own* information state (credence function), not relative to `P`'s or `P'`'s. This explains why `cr(S) = f(cr)` holds locally without implying `f` must be affine globally. Costs: Complicates the semantics (requires parameters beyond worlds), makes propositional content agent-relative/epistemically contingent, challenges the idea of stable content across disagreements or changes in belief. Boolean compounding becomes more complex but tractable (see "dynamic" or "informational" semantics). Credence is still a measure, but over a richer space (worlds + contexts?) or relative to a context.

  3.  **Reject Truth-Aptness (TRUTH) for Epistemic Vocabulary:**
      *   **Why it looked compulsory:** We embed them, argue about them, say they are true/false. "Is it *true* that if it's even, it's a two?" seems meaningful. "You're wrong, it might be 4!" feels like a factual disagreement.
      *   **Cost:** Requires an expressivist or non-factualist account of epistemic modals, conditionals, and comparatives. "Might C" doesn't describe the world; it expresses the speaker's state of non-exclusion (or a rule for updating). "If A then C" expresses a conditional attitude or a constraint on conditional beliefs. "C is more likely than D" expresses a comparative judgment. This avoids the contradiction because these sentences *don't denote propositions* at all, so AFF doesn't apply. `cr(S)` isn't a belief *in a proposition S*; it's part of the *specification* of the credal state itself (e.g., `cr(◊C)=1` just *is* the state where `cr(C)>0`).
      *   **Verdict:** Coherent and avoids the technical contradiction cleanly. But it clashes powerfully with intuitions about truth, disagreement, and embedding. Explaining the *semantics* of embedding (e.g., "If it might be 4, then we should check again") within expressivism is challenging (though work by Gibbard, Yalcin, etc., attempts this). *This exit preserves AT and AFF for classical propositions but relegates epistemic vocabulary to a non-propositional status.*

  4.  **Reject Mixing Closure:**
      *   **Why it looked compulsory:** Probability theory *allows* convex combinations. Restricting the space of rational credence functions seems ad hoc. If `P` and `P'` are rational, why shouldn't `P½` be?
      *   **Cost:** Argues that `P½` is not a *rational* credence function for the agent to hold, even though `P` and `P'` are. This requires a substantive epistemological claim that rational credences aren't closed under mixing. Perhaps only credences based on *evidence* are rational, and `P½` doesn't correspond to any possible evidence state (it represents a kind of meta-uncertainty about which of two evidential situations one is in). This is your friend's complaint.
      *   **Verdict:** **Potentially deep, not evasive, but requires significant epistemological work.** It challenges the common Bayesian practice of using mixtures to model uncertainty about priors or learning scenarios. If defensible, it blocks the derivation at step 3: `P½` isn't a rational credence function, so applying AT to it is invalid or the `f(cr)` rule doesn't apply to it. Costs: Needs a principled account of which credence functions are "rational" or "admissible" that excludes mixtures like `P½` while including the pure `P` and `P'`. Must explain why mixtures are illegitimate for evaluating content but perhaps legitimate for other purposes (e.g., representing self-doubt). Less radical than rejecting AFF or TRUTH, but non-trivial.

  ### Recommendation

  Given your desire to keep **AT** and **TRUTH** (for conditionals *and* modals/comparatives), the most viable exits are:

  1.  **Embrace Context/Index-Dependence (Exit 2, Option A):** Accept that epistemic vocabulary expresses propositions relative to an information state (formally represented by the credence function). This dissolves the contradiction by making AFF inapplicable across different information states. `cr(S)` is still `f(cr)`, but `f` depends on the credence function *as part of the context*. This preserves truth-aptness (relative to a context) and AT (as a local norm). Cost: Complex semantics, relative content.
  2.  **Embrace Expressivism (Exit 3):** Accept that epistemic vocabulary doesn't express truth-conditional propositions. This cleanly avoids the contradiction and preserves AT and classical AFF for ordinary propositions. Cost: Radical departure from intuitive semantics, embedding problems.
  3.  **Restrict Rational Credences (Exit 4):** Argue that mixtures like `P½` aren't genuinely rational credence functions for an agent to hold. This blocks the contradiction at the source. Cost: Requires a major epistemological argument about the nature of rational credence.

  **The "shifting content" move (Exit 2, Option A) is likely the best fit for your goals.** It directly addresses your worry that the move seems universally available by restricting it to vocabulary whose meaning *is* plausibly epistemic-state-dependent. It preserves truth-aptness (contextually) and AT. While it complicates the picture of propositions, it offers a framework for Boolean compounding (e.g., via dynamic semantics or two-dimensional semantics) and retains credence as a measure over worlds relative to a context. Your die example still works: "if even then two" expresses different propositions relative to `P`, `P'`, and `P½`, each with its own probability matching the conditional probability defined by that credence function. The contradiction vanishes because `P½` evaluates the conditional relative to *its own* context, not the contexts of `P` or `P'`.

  **In short: The generalization is correct. To save AT and TRUTH, you must abandon the simple picture that *all* meaningful sentences denote propositions with fixed truth-conditions independent of the epistemic state. The content of epistemic vocabulary shifts with the information state (context), rendering AFF inapplicable across states and dissolving the contradiction. This isn't cheating; it's recognizing the distinctive nature of epistemic language.**
