  Question (30 minutes, 20 marks):

  In iterated elimination of strictly dominated strategies (IESDS), it is well known that:

  - A strategy can be strictly dominated by a mixed strategy even if no pure strategy dominates it.
  - The iterative procedure is order-independent: the set of strategies that survive IESDS does not depend on the order in which strategies are removed.
  - In two-player games, the surviving set is exactly the set of rationalizable strategies.

  Consider a modified procedure called "pair-dominance IESDS" in which we only allow a strategy to be removed if it is strictly dominated by a mixed strategy that uses at most two pure strategies (i.e., a mixture of two or fewer pure strategies). We are only considering two-player games.

  (a) (10 marks) Provide an example of a two-player game in which there is a strategy that is strictly dominated by some mixed strategy (with no restriction on the support size) but is not strictly dominated by any mixed strategy with support size at most two. Explain why it is not dominated by any pair.

  (b) (10 marks) Is pair-dominance IESDS order-independent in two-player games? That is, does the final set of strategies that survive the iterative removal depend on the order in which we remove strategies? Either argue that the procedure is order-independent (by explaining why the usual proof extends or by providing a new proof) or provide an example where the final set depends on the order.

  Model Answer:

  (a) Consider the following game with Player 1 as the row player and Player 2 as the column player. Player 1 has strategies A, B, C, and D. Player 2 has strategies X, Y, and Z.

  Player 1's payoffs:

          X   Y   Z
      A   4   0   0
      B   0   4   0
      C   0   0   4
      D   1   1   1

  We claim that strategy D is strictly dominated by the mixed strategy that plays A, B, and C each with probability 1/3. This mixture yields payoff 4/3 in every column, which is greater than 1.

