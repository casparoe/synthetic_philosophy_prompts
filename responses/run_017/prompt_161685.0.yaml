  ### Question: Iterated Elimination with Pair-Dominance (30 minutes, 20 marks)

  Consider the standard iterated elimination of strictly dominated strategies (IESDS) procedure. In this question, we examine a restricted version called **pair-dominance IESDS**, where a strategy can only be eliminated if it is strictly dominated by a **mixture of at most two pure strategies** (i.e., a pure strategy or a mixture of two). We focus on **two-player games** only.  

  **(a)** **(10 marks)**  
  Provide an example of a two-player game where:  
  - One player has a strategy that is strictly dominated by some mixed strategy (with unlimited support size).  
  - This strategy is **not** strictly dominated by any mixture of at most two pure strategies.  

  Clearly present the game (label players, strategies, and payoffs), identify the dominated strategy, specify a dominating mixture (with support size > 2), and explain why no mixture of one or two strategies dominates it.  

  **(b)** **(10 marks)**  
  In standard IESDS (with unrestricted mixtures), the final set of surviving strategies is **order-independent**: the outcome does not depend on the order of elimination.  

  Is pair-dominance IESDS order-independent in two-player games? That is, can the order of elimination affect the final set?  
  - **Either** argue that pair-dominance IESDS *is* order-independent by explaining why the order-independence property of standard IESDS extends to the restricted case.  
  - **Or** provide a counterexample (with at least three strategies per player) where different elimination orders yield different final sets. Explicitly show the steps for two distinct orders and the resulting sets.  

  ---

  ### Model Answer (550 words)  
  **(a) Example:**  
  Consider a two-player game:  
  - **Player 1** has strategies: \(A, B, C, D\).  
  - **Player 2** has strategies: \(X, Y, Z\).  
  - **Payoffs for Player 1** (Player 2’s payoffs are irrelevant for this domination; assume they are constant):  

  | P1 \ P2 | \(X\) | \(Y\) | \(Z\) |
  |---------|-------|-------|-------|
  | \(A\)   | 4     | 0     | 0     |
  | \(B\)   | 0     | 4     | 0     |
  | \(C\)   | 0     | 0     | 4     |
  | \(D\)   | 1     | 1     | 1     |

  - **Dominated strategy:** \(D\) is strictly dominated by the mixture \(\sigma = (\frac{1}{3}A, \frac{1}{3}B, \frac{1}{3}C)\).  
    - Against \(X\): \(\sigma\) yields \( \frac{1}{3}(4) + \frac{1}{3}(0) + \frac{1}{3}(0) = \frac{4}{3} > 1 \).  
    - Against \(Y\): \(\sigma\) yields \( \frac{1}{3}(0) + \frac{1}{3}(4) + \frac{1}{3}(0) = \frac{4}{3} > 1 \).  
    - Against \(Z\): \(\sigma\) yields \( \frac{1}{3}(0) + \frac{1}{3}(0) + \frac{1}{3}(4) = \frac{4}{3} > 1 \).  
    Thus, \(\sigma\) strictly dominates \(D\).  

  - **No mixture of one or two strategies dominates \(D\):**  
    - **Pure strategies:** None dominate \(D\):  
      - \(A\) loses to \(D\) against \(Y\) (0 < 1) and \(Z\) (0 < 1).  
      - Similarly, \(B\) and \(C\) lose to \(D\) in at least two columns.  
    - **Mixtures of two:**  
      - **Mix \(A\) and \(B\)**: Payoffs: \(X: 4p\), \(Y: 4(1-p)\), \(Z: 0\).  
        To dominate \(D\): \(4p > 1\), \(4(1-p) > 1\), and \(0 > 1\) (impossible).  
      - **Mix \(A\) and \(C\)**: Payoffs: \(X: 4p\), \(Y: 0\), \(Z: 4(1-p)\).  
        Need \(0 > 1\) for \(Y\) (impossible).  
      - **Mix \(B\) and \(C\)**: Payoffs: \(X: 0\), \(Y: 4p\), \(Z: 4(1-p)\).  
        Need \(0 > 1\) for \(X\) (impossible).  
    No mixture of one or two strategies strictly dominates \(D\) in all columns.  

  **(b) Order-independence:**  
  Pair-dominance IESDS **is order-independent** in two-player games. The standard order-independence proof for IESDS extends to this restricted case.  

  **Key reasoning (4 steps):**  
  1. **Strict domination is hereditary:** If strategy \(s_i\) is strictly dominated by mixture \(\sigma_i\) in the full game, then \(s_i\) remains strictly dominated by \(\sigma_i\) in any subgame where:  
     - All strategies in \(\sigma_i\)’s support are present.  
     - The opponent’s strategy set is a subset of the original.  
     (Strict inequalities hold pointwise for all opponent strategies, so they hold in subsets.)  

  2. **Pair-dominance preservation:** If \(\sigma_i\) has support size \(\leq 2\) and dominates \(s_i\) in the full game, \(\sigma_i\) still dominates \(s_i\) in any subgame meeting the above conditions.  

  3. **No early removal of dominators:** A strategy in \(\sigma_i\)’s support cannot be eliminated before \(s_i\) because:  
     - Strategies in the support of \(\sigma_i\) are undominated in the full game (if one were dominated, \(\sigma_i\) could not strictly dominate \(s_i\), as domination requires \(\sigma_i\) to outperform \(s_i\) universally).  
     - Thus, they survive until \(s_i\) is eliminated.  

  4. **Later-dominated strategies:** Strategies not dominated in the full game but dominated in a subgame (due to prior eliminations) will be removed when their domination condition is met. Crucially, the reduced game is fixed, so the set of strategies dominated at that stage is order-invariant.  

  **Conclusion:** Since every pair-dominated strategy is eventually removed, and the reduced game is unambiguous, the final set is order-independent.  

