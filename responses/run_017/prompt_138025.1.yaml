prompt: |-
  hey all — I'm in a game theory & society seminar this term and I keep running into a pattern that I dont have a word for, and it's driving me a little nuts.

  The setup is the familiar one: a bunch of parties are stuck spending more and more on something that only matters relative to what everyone else spends, nobody can quit unilaterally without loosing ground, so the total just climbs. I know that part has a name and I'm not asking about it. What I keep noticing is what happens when someone actually tries to cap it. Two things, and I'm not sure they're even one thing:

  (1) The spending doesn't go away, it relocates. Cap or ban the obvious margin and people compete on whatever you forgot to cap, or on whatever is hardest to measure — and the new spending is often worse than the old, in the sense that it doesn't even buy anyone an advantage anymore, it's just cost.
  (2) It doesn't reset. Lift the cap, or remove whatever started the race, and the level stays where it climbed to. The new margin of competition sticks around even when nothing is making anyone compete on it anymore.

  Admissions is my clearest case: kill one screening device and the competition reappears somewhere else, more expensive and less informative, and it doesn't unwind afterward. But I think I've seen the same shape in hiring requirements and in how labs chase benchmarks, and "credential inflation" only names the admissions version.

  So: is there a name for the relocation-plus-not-resetting thing, or am I mashing two separate phenomena together? And if there's no established name, coin one with an actual definition and give me boundary cases — I need to be able to tell it apart from a plain arms race, from a measure getting gamed until it stops tracking anything, and from ordinary stickiness in prices or wages. Rank how close each of those near-misses is, and tell me which features of my description each one fails to capture. Please no reading lists or paper recs, I want the carving and not the sources. American English, under 300 words.
reasoning: |-
  Okay, the user is in a game theory seminar and struggling to describe a specific pattern they've noticed in competitive spending scenarios. They describe a situation where spending escalates due to relative competition (which they already know is called an arms race), but they're focused on what happens when someone tries to cap it. They observe two key phenomena: (1) spending relocates to another dimension that's often less efficient and harder to measure, and (2) this new spending level persists even if the cap is removed. Their primary example is admissions, where banning one screening tool leads to competition shifting elsewhere, becoming more expensive and less informative, without reverting when the ban is lifted.

  The user wants to know if there's a term for this combined "relocation-plus-not-resetting" phenomenon. They also ask for boundary cases to distinguish it from similar concepts like arms races, Goodhart's Law, and price stickiness. They specifically want a concise definition in American English under 300 words, without literature recommendations.

  Hmm, the core issue here involves competitive escalation with path dependency. The first part (relocation) resembles what's often called "Whac-A-Mole" in policy contexts, but that's not formal. The persistence aspect reminds me of hysteresis in economics, where systems don't revert after temporary changes. 

  For terminology, "competitive escalation hysteresis" seems precise—it captures both the relocation of competition and its irreversible persistence. "Hysteresis" is the key differentiator from simple arms races, which lack the irreversibility. Goodhart's Law explains why new metrics become useless but doesn't address persistence. Price stickiness involves reluctance to adjust prices, not competitive dimensions.

  The user's admissions example perfectly illustrates this: when SATs are banned, competition shifts to extracurriculars (relocation), and even if SATs return, the inflated extracurricular expectations remain (no reset). This differs from an arms race because arms races can de-escalate (e.g., disarmament treaties), whereas here the new equilibrium sticks. 

  Boundary cases: 
  - Arms race without persistence: Cold War nuclear de-escalation after treaties. 
  - Goodhart without relocation: Teachers "teaching to the test" without shifting to new metrics. 
  - Stickiness without competition: Minimum wage changes affecting baseline pay but not competitive hiring criteria. 

  The user seems analytically sharp—they've pinpointed a gap in standard terminology. Their frustration suggests they need this conceptual clarity for academic writing. By requesting coined terms and distinctions, they likely want to formalize their observation for seminar discussions or papers. The avoidance of "reading lists" implies they seek conceptual tools, not sources, possibly to avoid bias or to original analysis.
answer: |-
  Here's a term and its definition, plus distinctions:

  **Term:** **Competitive Escalation Hysteresis** (or **Escalation Lock-In**)

  **Definition:** The phenomenon where an externally imposed constraint on a specific dimension of competitive spending causes spending to relocate to a less efficient or measurable dimension (substitution), and where this new equilibrium persists even if the constraint is removed, due to path dependency and sunk costs in the new competitive arena.

  **Boundary Cases & Distinctions:**

  1.  **Plain Arms Race:** Captures the initial escalating spending *before* the cap. Fails to capture **relocation** to new dimensions and **persistence** after constraint removal. Arms races can de-escalate.
  2.  **Goodhart's Law** ("When a measure becomes a target, it ceases to be a good measure"): Explains *why* the new spending dimension becomes inefficient/uninformative after relocation. Fails to capture the **relocation** mechanism itself (the shift to a *new* measure) and the **persistence** after the original constraint is gone.
  3.  **Price/Wage Stickiness:** Describes resistance to downward adjustment in *prices/wages*. Fails to capture the **competitive relocation** aspect (shifting *where* spending occurs) and the focus on **relative advantage** within a zero-sum or positional context. Stickiness is about *levels* resisting change; this is about *dimensions* shifting and new *levels* locking in.

  **Closeness Rank:**
  1.  **Goodhart's Law (Closest conceptually to inefficiency):** Explains the *result* of relocation (new metric becomes useless). Doesn't cover relocation trigger or persistence.
  2.  **Plain Arms Race (Closest to the initial dynamic):** Explains the pre-cap escalation. Doesn't cover relocation or persistence post-cap.
  3.  **Price Stickiness (Least Close):** Only vaguely analogous in the persistence aspect, but mechanism and context (competitive dimension shift vs. price adjustment) are fundamentally different.

  **Key Features Captured:**
  *   **Relocation:** Spending shifts to uncapped/less measurable dimensions.
  *   **Inefficiency:** New spending is often worse (purely costly, less informative).
  *   **Persistence:** New competitive level/dimension persists *even after* the original cap/trigger is removed (hysteresis/lock-in).
  *   **Path Dependency:** Sunk costs, established norms, and adapted strategies in the *new* dimension prevent reverting to the pre-cap state.
