  For the game, we can have:

  In the first round (beat 1 and 2), they turn all cards and see everything. In beat 3, we change the rule: now they only get to see the outcome for the flagged. Then they try to fill the audit worksheet and cannot compute FPR and FNR. Then the facilitator can reveal that in the past they had full data, but now due to budget cuts, they can only routinely collect outcomes for the flagged.

  But we want that their choices determine which part they cannot run. Perhaps the size of the un-flagged group determines the cost of auditing it? We can skip this if time is short.

