  Timeline for 90 minutes:

  - Introduction: 5 minutes
  - Distribute materials and read rules: 10 minutes
  - Beat 1: Without fractional flagging. Teams work to choose thresholds and then compute. They will likely not get 14 and then have to leave some un-flagged. They turn all cards and compute. Then they see the error rates are not equal. (20 minutes)
  - Facilitator then asks: did anyone satisfy all rules? Probably not. Then introduces the legal note for fractional flagging. (5 minutes)
  - Beat 2: With fractional flagging. Teams work to set thresholds and fractions to hit 14 and try to equalize error rates. They turn all cards and compute. They see that they cannot. (25 minutes)
  - Beat 3: Facilitator introduces that outcomes for un-flagged are not routinely collected. Teams are to compute what they can. They realize they cannot compute error rates. (10 minutes)
