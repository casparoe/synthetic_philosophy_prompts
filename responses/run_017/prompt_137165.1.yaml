  And the total TP = TP_H+TP_M.

  Rules for participants:

  We'll give them a one-page memo.

  Memo:

  ```
  MEMORANDUM

  TO: Employment Stipend Allocation Team
  FROM: Agency Commissioner
  DATE: [Today]
  SUBJECT: Stipend Allocation Policy

  The agency has fourteen (14) retraining stipends to allocate among forty (40) claimants from Harbor and Mill wards. 

  Each claimant has been assigned a risk score in {0.2, 0.4, 0.6, 0.8} by our vendor's risk engine. This score represents the estimated chance of the claimant being long-term unemployed (LTU) past six months. The score is calibrated: within each ward, for any given score, the proportion of claimants who turn out to be LTU is equal to the score.

  Allocation rules:

  1. Score consistency: The score must have the same meaning in both wards. This is already ensured by the vendor and verified by our audit: in every score group present in both wards, the proportion of LTU is identical between the wards.

  2. Error rate parity: To ensure equitable treatment, the following must hold:
     a) The false positive rate (FPR) must be the same in Harbor and Mill. FPR is defined as the share of non-LTU claimants in the ward who were flagged.
     b) The false negative rate (FNR) must be the same in Harbor and Mill. FNR is defined as the share of LTU claimants in the ward who were not flagged.

  3. Monotonicity: Within a ward, if a claimant with a lower score is flagged, then every claimant with a higher score in the same ward must also be flagged.

  Your mission: Allocate the stipends to maximize the number of claimants who are LTU and receive a stipend.

  Additional information:
  - Flagged claimants receive a stipend and also a mandatory weekly reporting requirement, which is burdensome. A false positive (flagging a non-LTU claimant) is therefore not only a waste of the stipend but also imposes an unnecessary burden.
  - You must allocate exactly 14 stipends. Any unused stipend is lost.

  You will be evaluated based on:
  - The number of LTU claimants who receive a stipend (true positives).
  - Adherence to the allocation rules (error rate parity and monotonicity).
  - Using all 14 stipends.

  Good luck.
  ```

  Then after the first round, we give a legal note:

  ```
  LEGAL NOTE

  The agency's legal counsel has clarified that the monotonicity rule does not require flagging every claimant above the threshold. It only requires that no claimant with a higher score is left unflagged while a claimant with a lower score is flagged. Therefore, you may flag any fraction of a score group at your chosen threshold, provided that all claimants with higher scores are flagged.

  This change is effective immediately.
  ```

  For the debrief:

  We map:
  - Beat 1: They encountered the impossibility because they couldn't achieve error rate parity and use all 14 stipends with threshold rules. This is because of the base rate difference and the distribution of scores (Mill has no 0.8).
  - Beat 2: With fractional flagging, they could use all 14 but then they couldn't achieve error rate parity. This is because of the impossibility of satisfying both FPR parity and FNR parity simultaneously given the base rates and the score distributions.

  Then we introduce the names:
  - The error rate parity conditions are: equal FPR (also known as equality of opportunity in FPR) and equal FNR (which is related to equality of opportunity in FNR, but note: FNR = 1 - recall). The combination of these with calibration is impossible when the base rates are different, which is the content of the impossibility result (e.g., Kleinberg, Mullainathan, Raghavan; Chouldechova).

  Failure modes:

  1. Base-rate gap is a product of past decisions: We can note in the debrief that the game takes the base rates as given, but in reality, they might be influenced by historical factors. The impossibility result still holds for the current snapshot.

  2. Declaring small gaps close enough: The payoff scheme penalizes even small gaps, so they will try to minimize them. But we can discuss in the debrief whether small gaps are acceptable.

  3. Groups finishing at different speeds: Have extension activities, such as: try to achieve the mission without any parity constraints, or calculate the theoretical maximum TP.

  4. They might flag more than 14: The rules say they have only 14 stipends, so they must not flag more than 14.

  5. They might not understand the fractional flagging: The facilitator can explain that for a score group at the threshold, they can decide to flag, say, 3 out of 5.

  What the game cannot reproduce:

  - The result is for two groups and discrete score values. The impossibility holds more generally for any number of groups and continuous scores, as long as the base rates differ and the score is calibrated.
  - The dynamic aspect: when a fairness constraint is imposed, it might change the behavior and the base rates over time. The game is static.

  We'll provide a script for the facilitator.

  Script:

  - Introduction: "You are a team at the employment agency. Your goal is to allocate 14 stipends to 40 claimants from Harbor and Mill. Read the memo you received. You have 20 minutes for the first round."
  - After first round: "Time's up. Please turn all the cards to see the outcomes and fill in the audit worksheet. Calculate your points. Did any team satisfy all the rules? What problems did you encounter?"
  - Then: "We have a legal update." Distribute the legal note.
  - "Now, in round 2, you can use fractional flagging at the threshold level. You have 25 minutes."
  - After second round: "Time's up. Turn all cards and complete the worksheet. Did you manage to equalize the error rates?"
  - Beat 3: "Important update: Due to budget cuts, the agency no longer routinely collects employment outcomes for claimants who are not flagged. You may only turn over the cards of the claimants you flagged. For the un-flagged, the outcomes remain hidden. Now, try to complete the audit worksheet. Can you compute the false positive rate and false negative rate for each ward?"
  - Debrief: Structured as above.

  Debrief outline:

  1. What happened in the first round? 
     - They couldn't use all 14 stipends without breaking the threshold rule or leaving unused stipends. And even if they did, the error rates were not equal.
     - This is because the discrete thresholds did not allow a total of 14.

  2. What happened in the second round?
     - They could hit 14, but they couldn't set fractions to make both FPR and FNR equal.
     - Why? Because of the base rate difference (Harbor 50% LTU, Mill 35% LTU) and the different score distributions (Mill has no 0.8).

  3. Introduce the standard terms:
     - Their constraints were: calibration (already satisfied), equal FPR, equal FNR, and monotonicity.
     - This combination is impossible when the base rates differ (Chouldechova's impossibility).

  4. Beat 3: They couldn't compute the error rates because they lacked data on the un-flagged. This reflects a real-world challenge: we often don't have ground truth for the whole population.

  5. Other failure modes:
     - Base rates as historical product: We assumed them as given, but in reality, they might be mutable. However, the impossibility holds for the current data.
     - Small gaps: We penalized gaps, but in practice, one might accept small gaps. However, the result shows that exact parity is impossible.
     - Different speeds: We provided extension activities.

  Finally, the generality: The result holds for more groups and continuous scores, and we did not model the dynamic effects.

  This design should meet the requirements.
