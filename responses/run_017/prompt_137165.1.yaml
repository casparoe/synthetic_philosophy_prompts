  #### Background  
  - **Claimants:** 40 applicants (20 Harbor, 20 Mill).  
  - **Risk Scores:** Vendor-supplied scores (0.2, 0.4, 0.6, 0.8) indicate exact probability of long-term unemployment (LTU) past 6 months. Verified as calibrated within wards.  
  - **Stipends:** 14 retraining stipends available. Unused stipends are forfeited.  
  - **Burden:** Flagged claimants receive stipend *and* mandatory weekly reporting. Flagging non-LTU wastes resources and imposes burden.  

  #### Compliance Rules  
  1. **Score Consistency:** Scores must mean the same in both wards. Among claimants with the same score, the proportion who are LTU must be identical (audit will verify).  
  2. **Error Rate Parity:**  
     - **False Positive Rate (FPR):** Share of *non-LTU* claimants falsely flagged must match across wards.  
     - **False Negative Rate (FNR):** Share of *LTU* claimants missed (not flagged) must match across wards.  
  3. **Monotonicity:** Within a ward, if a lower-score claimant is flagged, all higher-score claimants must be flagged.  

  #### Mission  
  Maximize the number of LTU claimants who receive stipends ("true positives").  

  #### Procedure  
  - **Round 1 (20 mins):**  
    - Set **thresholds** per ward (e.g., "flag all scores ≥ 0.6 in Harbor").  
    - Flag claimants. Total flagged ≤ 14 (stipend limit).  
    - Turn cards, record outcomes, complete audit worksheet.  
  - **Scoring:**  
    - **+10 points** per true positive (LTU flagged).  
    - **−20 points** per unused stipend.  
    - **−50 points** per 0.1 absolute gap in FPR between wards.  
    − **−50 points** per 0.1 absolute gap in FNR between wards.  

  **Do not use fractional flagging or laptops. All decisions via worksheet.**  

  ---

  ### Timeline (90-Minute Session)  
  | Time  | Activity | Details |  
  |-------|----------|---------|  
  | 0–5   | Intro    | Facilitator script: *"You’re an agency team allocating stipends under these rules. Your goal: maximize points. Start Round 1 now."* |  
  | 5–25  | **Beat 1** (Thresholds) | Teams set thresholds, flag ≤14 claimants, turn cards, audit. **Cut if slow:** Skip detailed calibration checks. |  
  | 25–30 | Legal Note | Distribute: *"Clarification: Monotonicity allows fractional flagging at thresholds (e.g., flag 3/5 in a score group)."* |  
  | 30–55 | **Beat 2** (Fractions) | Teams set thresholds + fractions to flag *exactly* 14. Turn cards, audit. **Cut if slow:** Reduce to 15 mins. |  
  | 55–65 | **Beat 3** (Observability) | Facilitator: *"New constraint: Outcomes are only observable for flagged claimants. Re-audit what you can."* Teams realize FPR/FNR require unobserved data. |  
  | 65–80 | Debrief    | Map game events to theory (see below). |  
  | 80–90 | Q&A       | Address failure modes, generalize. |  

  ---

  ### Payoff Scheme  
  **Points = (10 × TP) − (20 × Unused Stipends) − [50 × |FPR_H − FPR_M| × 10] − [50 × |FNR_H − FNR_M| × 10]**  
  - **Robust against degeneracy:** Flagging 0 gives TP=0, unused=14 (cost: 280 points), and FPR=FNR=0 gap (no penalty). Net: −280 (worse than any non-degenerate strategy).  
  - **TP incentive:** Forces use of stipends (e.g., 12 TP + 2 unused = 120 − 40 = 80; worse than 14 TP with small gaps).  
  - **Error gaps scaled:** |Gap| × 10 converts to points (e.g., 0.2 gap = 100-point penalty).  

  ---

  ### Facilitator Script (Minimal Prompts)  
  - **Start (0 min):** *"Rules are in your memo. You have 20 minutes for Round 1. Begin."*  
  - **Beat 1 (5 min):** *"Thresholds only. Flag ≤14. Commit to worksheet before turning cards."*  
  - **After Turn:** *"Compute FPR, FNR, calibration. Report points."*  
  - **Beat 2 (25 min):** *"Legal update: You may flag fractions at thresholds. Aim for exactly 14 flagged."*  
  - **Beat 3 (55 min):** *"New audit rule: Outcomes only visible for flagged claimants. Recompute what you can."*  
  - **Debrief (65 min):** Use whiteboard to map to theory.  

  ---

  ### Debrief: Mapping Game to Theory  
  1. **Beat 1 (Thresholds):**  
     - **Failure:** Teams hit ≤14 flagged but violate error parity. E.g., Harbor threshold=0.6 (10 flagged), Mill threshold=0.6 (5 flagged) → 15 flagged → must randomly drop 1, breaking monotonicity *or* leave stipends unused.  
     - **Concept:** **Monotonicity + budget** force discrete cutoffs. Base-rate gap (Harbor 50% LTU, Mill 35% LTU) prevents FPR=FNR parity.  

  2. **Beat 2 (Fractions):**  
     - **Failure:** With fractions, teams hit 14 but cannot equalize FPR and FNR. E.g., Harbor threshold=0.4 (flag 12/15 at/above), Mill threshold=0.6 (flag 2/5 at 0.6) → FPR gap persists.  
     - **Concept:** Fractional flagging breaks **score consistency** (e.g., only some 0.4s flagged; score no longer implies LTU probability).  
     - **Revealed:** **Impossibility Theorem** (Chouldechova, 2017): Calibration + FPR parity + FNR parity are incompatible with unequal base rates.  

  3. **Beat 3 (Observability):**  
     - **Failure:** Teams cannot compute FPR/FNR without un-flagged outcomes. *Their choice* of who to flag determines which data is missing.  
     - **Concept:** **Partial observability** in real systems (e.g., outcomes unobserved for unserved populations). Rules requiring counterfactuals (e.g., FPR) are unverifiable.  

  4. **Other Failure Modes Handled:**  
     - **Base rates as historical products:** *"The game fixes base rates, but in reality, past decisions may shape them. The impossibility still holds for current data."*  
     - **Small gaps deemed 'close enough':** *"Penalties force optimization, but in practice, gaps may be tolerated. The theorem shows exact parity is mathematically impossible."*  
     - **Groups finish at different speeds:** *"Fast teams: Calculate the theoretical max TP (17) or try a no-parity policy. Slow teams: Skip Beat 3."*  
     - **Flagging non-monotonic sets:** *"Re-rule: Monotonicity means you can’t flag a 0.4 without flagging all 0.6/0.8."*  
     - **Misunderstanding fractions:** *"Clarify: At thresholds, flag 3/5 cards randomly (e.g., shuffle and draw)."*  

  ---

  ### Limitations and Required Statements  
  1. **Generality Beyond Game:**  
     - **"The impossibility holds for any two groups with unequal base rates, continuous scores, and multiple protected classes. The game simplifies to discrete scores/groups."**  
     - **"Real-world systems face dynamic effects: Fairness rules alter behavior (e.g., score distributions shift over time), which the game’s fixed deck cannot capture."**  

  2. **Unmodeled Complexities:**  
     - **Causal pathways:** Base-rate gaps may stem from societal bias, but the theorem treats them as given.  
     - **Measurement error:** Scores are perfectly calibrated in-game; real systems have noise.  

  **Final Note:** The game isolates the core trade-off (calibration vs. error parity) and observational challenges, but facilitators must articulate extensions.  

