prompt: |-
  I've got 20 minutes next month at the consciousness group in the neuro department to argue that global workspace theory is a theory of access consciousness and doesn't have the resources to be a theory of phenomenal consciousness, and that the overflow argument survives the sparseness reply once you seperate phenomenal richness from phenomenal determinacy. My main move is the bottleneck argument: if the workspace is a limited-capacity broadcaster, what gets broadcast is a lossy compressed summary, so GWT either has to say experience is only as rich as the broadcast or admit that most of the phenomenal field is never broadcast at all. To force the choice I'm using a hypothetical partial-report result: in a delayed-cue Sperling setup, content from all three rows stays decodable in early visual areas, but frontoparietal ignition only happens for the cued row, and subjects say they saw the whole array for a moment even though they can only report one row.

  The room is mostly global neuronal workspace people — ignition, P3b, where the NCC is, prefrontal vs sensory — plus one IIT person, one recurrent-processing guy who basically agrees with me and will push me to go further than I want to, and a philosopher of mind who is an illusionist and thinks the access/phenomenal distinction is hopeless.

  Can you write me a Q&A prep sheet? The seven or eight objections I'll actually get, roughly in the order they'll come, phrased the way each of those people would actually say them rather than in journal-referee prose. For each one: a two-minute version of my reply, what I should concede in the talk instead of waiting to be asked, and where my reply is soft. Include the objection I'm hoping nobody raises. Also flag, for each, where I'd be leaning on a contested reading — of what GWT claims, of what the overflow data shows, of what richness even means — versus what people in the field actually agree on, because I don't want slides that present a contested reading as the consensus.
