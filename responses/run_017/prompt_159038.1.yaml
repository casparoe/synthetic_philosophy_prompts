prompt: |-
  I'm an MA student in philosophy, currently in a seminar on computation and rationality, and I'm trying to write a paper on whether computational hardness results can do genuine philosophical work — whether they tell us something about the world and about what an ideal agent could be, or only something about how small and slow creatures like us happen to be. What I'm missing isn't more references; I have the standard ones already. What I'm missing is the shape of the argument, so I'd be grateful for an explanation rather than a survey of who has said what. Please answer in American English, and please pitch it at this level: I've taken one course in computability and logic and one in philosophy of mind, so you can use terms like NP-completeness, polynomial-time reduction, worst-case versus average-case, and functionalism without defining them from scratch, but please don't assume I know anything beyond the elementary results.

  Here is the distinction I keep circling around and can't state properly on my own. Call a computational limitation *contingent* if it is removed by giving the agent more of what it already has — more time, more memory, faster hardware, more processors working in parallel — while leaving the description of the task untouched. Call it *structural* if no amount of more-of-the-same helps, because the cost of the task grows with the size of the input in a way that outruns any resource you could plausibly scale, so that the obstacle looks like a feature of the shape of the task rather than of the agent. My working gloss is that only structural infeasibility could constrain an ideal agent or a normative theory of rationality; contingent infeasibility is, I want to say, merely a fact about us, of a piece with the fact that we can't keep seven arbitrary digits in mind at once.

  I think that gloss is too quick, for two reasons I can see and presumably others I can't. First, a hardness result is a worst-case claim about a formal problem, and worst-case hardness is not typical hardness: there are problems that are computationally intractable in general but which actual solvers dispatch almost all the time, so "this is hard" seems to be a claim about a distribution over instances and a class of algorithms, not about reality. Second, there is what I've started calling *the approximation dodge*: faced with a hardness result, you quietly replace the original task with a nearby one — settle for an approximation, use a heuristic, restrict attention to instances of the kind the environment actually serves up — and then announce that the limit has been overcome. I can't tell whether that move is a legitimate re-description of what the task really was all along, or a philosophical sleight of hand that lets a theory escape every empirical check.

  So here is what I'd like explained. What would have to be true for a hardness result to be philosophically load-bearing rather than merely biographical — and, concretely, how should I think about the two cases my seminar keeps returning to? The first is the objection that if some mental capacity we attribute to agents requires solving an intractable problem, a computational theory of that capacity is empirically inadequate, and the standard reply that real systems use heuristics and meet only structured instances. The second is the objection that norms like full Bayesian updating or belief-revision over an unbounded space of hypotheses violate the thought that ought implies can, and the reply that normative theories are allowed to idealize. In each case I want to know whether the limitation at issue is contingent or structural in my sense, whether my sense survives the two worries above, and where, if anywhere, the distinction simply breaks down and turns out to be a false dichotomy. A single worked example traced all the way through would help me more than a general discussion, and please be willing to tell me if the distinction I've drawn is the wrong one to be drawing.
reasoning: |-
  Okay, let me approach this systematically. The MA student in philosophy is struggling with how computational hardness results relate to philosophical concepts of rationality and ideal agency. They've framed a distinction between contingent and structural limitations but recognize it might be oversimplified. 

  First, I need to unpack their core concern: they want to know when computational hardness reveals something fundamental about rationality itself versus merely reflecting human cognitive constraints. Their two main worries are the relevance of worst-case analysis and the legitimacy of approximation strategies. 

  Looking at their examples, I notice both involve key tensions:
  - For cognitive models: the gap between formal intractability and observed human performance
  - For normative theories: how "ought implies can" interacts with idealization

  The student seems particularly sharp - they've identified approximation as potentially philosophical sleight of hand, which is exactly where the interesting debate lives. Their request for a concrete example is spot-on; abstract discussions won't help them at this stage.

  I should choose one case study to develop fully. Bayesian updating is ideal because:
  - It's central to both philosophy and CS
  - Shows worst-case vs average-case tension clearly
  - Approximation strategies (like MCMC) are well-studied
  - Forces confrontation with what counts as "solving" the task

  The student's contingent/structural distinction needs refinement though. As they suspect, it's not binary - polynomial scaling might be structural for physics but contingent for CS. The key insight is that structural constraints bind even ideal agents when we fix the problem specification and physical laws.

  For Bayesian updating, I'll demonstrate:
  1. Why worst-case hardness seems structural (exponential scaling)
  2. How approximation dodges work (MCMC, restricted priors)
  3. Why this isn't cheating if the environment is kind
  4. The crucial role of computational complexity in normative theories

  The payoff will be showing how hardness results constrain possible rationalities - they force us to either accept approximation as rational or redefine the task. Neither option leaves the concept of rationality untouched.

  I should emphasize that the distinction breaks down for parallel computation (where "more processors" changes complexity classes) and heuristic success (where "hard" problems become easy). The deeper point is that computational complexity exposes how rationality must be embodied - even for ideal agents.
answer: |-
  Here's a concrete analysis using Bayesian updating as a case study, tracing your distinction through both worries to show where it holds, bends, and reveals deeper philosophical stakes. I'll address your core question: **When does a hardness result constrain *rationality itself* versus merely describing *implementational limitations*?**

  ### The Case: Bayesian Updating as a Normative Ideal
  **The Task:** Update beliefs (a probability distribution over hypotheses) upon receiving new evidence, following Bayes' theorem. For an unbounded hypothesis space (e.g., all possible scientific theories fitting some schema), this is PSPACE-hard or worse in the worst case.

  **Objection (Ought Implies Can):**  
  "If Bayesian updating over unbounded spaces is computationally intractable (e.g., requires exponential time/memory), it violates 'ought implies can.' No agent—human or ideal—can satisfy this norm. Therefore, it cannot be a genuine norm of rationality."

  **Standard Reply (Idealization):**  
  "Normative theories idealize. We don't demand physical possibility (e.g., infinite precision), so why demand computational feasibility? Rationality is about *what to aim for*, not what's achievable."

  **Your Question:**  
  Is this intractability *contingent* (solved with more resources) or *structural* (inherent to the task's shape)? And does the "approximation dodge" (e.g., using MCMC sampling) resolve the worry or hide it?

  ---

  ### Step 1: Applying Your Distinction
  - **Contingent Limitation?**  
    Giving an agent "more of the same" (faster CPUs, more RAM) *doesn't* make exponential time/space scale polynomially. Doubling resources only lets you handle slightly larger inputs before hitting the same exponential wall. **→ This suggests structural limitation.**
    
  - **Structural Limitation?**  
    The hardness result (e.g., PSPACE-completeness) shows that *any* algorithm solving *exact* Bayesian updating for *arbitrary* priors and evidence *must* scale exponentially in the worst case, regardless of hardware. **→ This looks structural.**

  *But your two worries complicate this:*

  ---

  ### Step 2: Confronting Your Worries
  **Worry 1: Worst-Case vs. Typical Hardness**  
  - **The Issue:** Worst-case hardness (e.g., pathological priors that force exhaustive search) might be vanishingly rare. Real agents only face "nice" distributions (e.g., smooth, sparse priors).
  - **Does this make the limitation contingent?** No. It reveals that the *formal task specification* ("update *any* prior") is structurally hard, but *environmental constraints* might make the *practically relevant* task easier.  
  - **Philosophical Significance:**  
    - If we define rationality as "responding correctly to *actual* evidence in *actual* environments," hardness results *don't* constrain norms—because real environments avoid hard instances.  
    - If we define rationality as "responding correctly to *logically possible* evidence," worst-case hardness *is* structural and constrains ideal agents.  
    - **Key Insight:** The limitation is structural *for the abstract task*, but possibly contingent *for embodied agents in finite worlds*. This forces a choice: **Is rationality about mastering a formal domain or thriving in a physical one?**

  **Worry 2: The Approximation Dodge**  
  - **The Move:** Use approximate methods (e.g., variational inference, MCMC) that trade exactness for tractability.  
  - **Is this sleight of hand?**  
    - **If the task is "find the *exact* posterior":** Approximation *changes* the task. This dodges the structural limitation but abandons the original norm (exact Bayesianism).  
    - **If the task is "get *reliably accurate* beliefs":** Approximation might satisfy the *epistemic goal* without solving the formal problem. Here, hardness results expose a tradeoff: you *must* accept approximations (or domain restrictions) to achieve tractability.  
  - **Philosophical Significance:**  
    - Hardness results show that **exact Bayesian updating over large spaces is not a coherent norm for any finite agent**, ideal or otherwise—because it demands impossible resources.  
    - They force us to **redefine rationality** in terms of *satisficing* (e.g., "get within ε accuracy with high probability") rather than *optimizing* (find the exact posterior).  

  ---

  ### Step 3: Is the Limitation Structural or Contingent? A Verdict
  - **For the *exact, worst-case* task:** Structural. No amount of resources makes exponential scaling polynomial.  
  - **For the *approximate, average-case* task:** Contingent. Better hardware/heuristics improve accuracy/speed for fixed inputs.  

  **But the crucial point:** The structural hardness of the exact task *forces* even ideal agents to confront tradeoffs. An "ideal" agent with unlimited resources *could* compute exact updates—but only by sacrificing *other* ideals (e.g., speed, which matters in time-sensitive decisions). Meanwhile, average-case hardness (if proven) *would* be structural: some distributions remain hard even with approximation.  

  ---

  ### Where Your Distinction Bends (and Why That's Useful)
  1. **"More of the Same" Isn't Always Neutral**  
     Adding parallel processors *changes the computational model* (e.g., moving from P to NC). This blurs your distinction: a "structural" limit in serial computation may be "contingent" in parallel. Rationality might demand exploiting parallelism—but then the norm is model-dependent.

  2. **The Environment is Part of the Task**  
     If "the task" includes *real-world constraints* (e.g., "update before the tiger pounces"), then polynomial time may be a *structural requirement* for rationality. Hardness results show when this is impossible.

  3. **Idealization Has Computational Costs**  
     Normative theories that ignore computational limits risk prescribing *incoherent ideals* (e.g., "always compute the exact posterior"). Hardness results expose these as **literally unrealizable by any physical system**, no matter how advanced. This *is* philosophically load-bearing: it shows that such norms are **not just unattainable but metaphysically flawed** for finite worlds.

  ---

  ### Conclusion: What Makes Hardness Results Philosophical
  A hardness result is philosophically significant when it reveals that:  
  1. **A proposed norm is incoherent** (e.g., it demands unbounded resources in a finite universe).  
  2. **Rationality requires compromise** (e.g., between accuracy and speed, or generality and efficiency).  
  3. **The structure of the task dictates the structure of rationality** (e.g., NP-hardness implies that deductive reasoning *must* use heuristics/abstraction).  

  In the Bayesian case, hardness results **constrain normative theories** by showing that "ideal" rationality cannot mean "exact and universal." They force us to either:  
  - **Revise the norm** (embrace approximation as rational),  
  - **Restrict the domain** (accept that rationality is domain-specific), or  
  - **Reject computationalism** (argue that minds aren't Turing machines).  

  **Your distinction isn't wrong—it's the starting gun.** Computational complexity doesn't just describe *us*; it maps the **boundaries of the possible** for any agent operating in a finite physical universe. The philosophical work lies in deciding how rationality navigates those boundaries.  

  Would you like to extend this analysis to your other case (mental capacities and heuristics)?
