prompt: |-
  I am a third-year PhD student in philosophy working on decision theory and formal epistemology, and I have been going round in circles on a version of Pascal's mugging that I built to block the standard escape routes. I would be grateful for a diagnosis. Please answer in British English.

  (1) A rational agent maximises expected utility: acts are ranked by the probability-weighted sum of the utility of their possible outcomes, and a rational agent performs a maximal act.

  (2) The mugger asks for £5 and says that, from a region entirely outside my future light cone, they will create and sustain in bliss a number of lives that can be named in a few dozen characters using Knuth's up-arrow notation. I cannot assign this claim probability zero: it is consistent with everything I know, and a sensible credence function does not assign zero to a possibility it cannot rule out.

  (3) The probability I should assign to a claim decays with the length of its description, not with the size of the numbers it mentions. Under a complexity-based prior the mugger's sentence costs a few dozen bits, and there is no bound on the payoff a sentence of that length can name.

  (4) The usual reply that utility should be bounded is no help here: nothing in (1)–(3) turns on my own welfare. Put the payoff in lives created rather than in utils to me, and a bounded utility function still yields an unbounded expected payoff.

  (5) The usual causal-decision-theory reply is also closed off: the stipulated payoff lies outside my light cone, so there is no causal route from my paying to anything. Whatever rescues evidential reasoning in the standard Newcomb-style cases should rescue it here too.

  (6) Now iterate. For every act available to me, some compactly stated mugging offer has greater expected value. So no act maximises expected utility: whatever I do, there was something better available.

  (7) And if for every available act A there is an available act B with greater expected value, then performing A while B is available is irrational. So every ordinary act — eating, sleeping, writing my thesis — is rationally forbidden.

  (8) The same construction runs on belief rather than action. Let the payoff be conditional on my accepting some creed: a being outside my light cone creates the same astronomical number of blissful lives if, and only if, I believe a proposition they name. Steps (2) and (3) go through unchanged, with the value now attached to believing rather than to paying. So for any proposition compactly enough stated and attached to a large enough conditional payoff, rationality requires raising my credence in it, and there is no creed, however arbitrary, that rationality permits me to reject.

  (9) So expected-utility maximisation, together with a non-zero credence floor and any complexity-based prior, entails what I will call fanatical paralysis: no act permitted and no proposition rejectable.

  That conclusion is not one I can accept, and I do not think (7) is where I want to pay. I would like to keep the thought that tiny-probability, huge-stake reasoning is sometimes perfectly sound — pandemic preparedness and existential-risk mitigation both look like cases where a small probability of an enormous loss should move us — and I would rather not give up (1) outright. Please tell me which step is doing the illegitimate work, why it looks innocent, and what each of the alternatives would cost me: giving up the non-zero floor in (2), rejecting the description-length assumption in (3), restricting (1) to cases where the expectation is well defined, or distinguishing epistemic from pragmatic reasons in (8). I am not asking for a survey of the literature or for references; I have read the standard replies and they are what I am trying to get behind. I want the step named and the bill priced.
reasoning: |-
  Okay, I need to thoroughly understand this user's problem. They're a third-year PhD student in philosophy, focusing on decision theory and formal epistemology. They've constructed a version of Pascal's Mugging that blocks standard escape routes, leading to what they call "fanatical paralysis." The core issue is that expected utility maximization, combined with a non-zero credence floor and complexity-based priors, seems to make every ordinary action irrational and forces acceptance of any belief with a high enough conditional payoff. The user wants to know which step is flawed, why it seems innocent, and what the costs are of rejecting each alternative.

  First, I'll break down each step of their argument. The user has already considered common solutions like bounded utility or causal decision theory and found them insufficient in this setup. Their iteration point (step 6) is particularly strong because it shows that for any action, there's always a "mugging offer" with higher expected value, making no action maximal. Similarly, for beliefs (step 8), any compactly stated creed with a high conditional payoff must be accepted.

  The key pressure points seem to be:
  - The non-zero credence floor (step 2): They argue we can't assign zero probability to claims consistent with our knowledge.
  - Complexity-based priors (step 3): Probability decays with description length, not the size of numbers mentioned.
  - Expected utility maximization (step 1): Applied without restriction.
  - The iteration leading to paralysis (steps 6-7 for actions, 8 for beliefs).

  I think the deepest flaw is in step 3: the assumption that description length alone determines probability, regardless of content. This treats all hypotheses of equal complexity as equally probable, ignoring how implausible certain claims are based on what we know about reality. For example, a hypothesis involving entities outside our light cone that can create astronomical amounts of blissful lives should have lower probability than one about, say, a hidden teapot in the asteroid belt, even with similar description lengths. This is because our background knowledge includes empirical evidence that such extravagant claims are less likely—they require mechanisms we've never observed, contradict conservation laws, etc.

  Why does this seem innocent? Because in algorithmic information theory, Kolmogorov complexity is a standard way to assign priors, favoring simplicity. But this formal approach doesn't incorporate empirical content. Assigning non-zero probability is one thing, but the magnitude matters. The user's setup ignores that even within a complexity class, priors should vary based on fit with existing knowledge.

  The cost of rejecting step 3 is significant. We'd need a richer prior that incorporates empirical plausibility, not just description length. This might involve Bayesian updates starting from more informed priors or allowing probabilities to decay faster for hypotheses that make grand, unsupported claims. For instance, the probability could decay with the scale of the claim or its conflict with established laws. However, this risks subjectivity or ad hoc adjustments. We'd lose the clean, formal approach of complexity-based priors and might struggle to formalize "empirical plausibility" rigorously.

  Now, considering alternatives:
  - Rejecting the non-zero credence floor (step 2): This avoids the mugging by allowing zero probability for outlandish claims. But the cost is high—it violates regularity principles and might lead to dogmatism. If we assign zero to some possibilities, we can't update on them even with evidence, which is problematic for epistemology.
  - Restricting expected utility maximization (step 1): Only apply it when expectations are well-defined or bounded. This blocks the paralysis but sacrifices the universality of EU maximization. We'd need a new decision rule for unbounded cases, which could be messy and context-dependent.
  - Distinguishing epistemic/pragmatic reasons (step 8): Say that pragmatic gains (like avoiding mugging) shouldn't force belief changes. But this separation is tricky—pragmatic reasons often influence credences indirectly. The cost is losing a unified account of rationality, potentially creating tension between belief and action.

  The user wants to keep small-probability, high-stake reasoning (e.g., for existential risks) while avoiding fanaticism. The solution must allow sensible priors for genuine threats (like asteroid impacts) without being derailed by arbitrary mugging scenarios. This suggests that empirical grounding is key—existential risks are based on plausible mechanisms (physics, biology), unlike the mugger's light-cone-defying claims.

  In summary, step 3 is the culprit. Its flaw is treating probability as a function of description length alone, ignoring empirical content. Fixing it requires more nuanced priors, costing formal elegance but preserving rationality. The user must accept that complexity-based priors need supplementation with empirical factors to avoid paralysis.
answer: |-
  Your construction is admirably tight, and I see why it's causing circular headaches. The flaw lies in **step (3)**, specifically in the assumption that probability decays *only* with description length, ignoring the *semantic content* and *empirical coherence* of the hypothesis. This step looks innocent because it appeals to algorithmic information theory (e.g., Solomonoff induction), where priors favour simpler (shorter) descriptions. But this formal approach divorces probability assignment from the *substantive constraints of background knowledge*, which is fatal when dealing with claims about entities "outside the light cone" making astronomic causal interventions.

  ### Why Step (3) is Illegitimate
  - **The innocence**: Complexity-based priors seem objectively grounded in information theory. If a hypothesis can be stated compactly (e.g., "Knuth-arrow-number of bliss lives created extra-spatiotemporally"), its prior probability shouldn’t vanish simply because the numbers are large. This aligns with Occam’s razor: shorter descriptions are a priori more likely.
    
  - **The flaw**: The prior must also account for *how well the hypothesis coheres with established physical laws and causal structures*. Your mugger’s claim isn’t just "complex" – it posits a mechanism (creation/sustenance of vast lives from outside spacetime) that is *maximally incongruent* with everything we know about causality, thermodynamics, and the relativistic constraint of light cones. In a *sensible* prior, probability doesn’t decay merely with string length but with *degrees of deviation from known laws*. A hypothesis requiring new physics (or magic) gets penalised *beyond* its Kolmogorov complexity. For instance:
    - "A teapot orbits Mars" (low complexity, modest deviation from known physics) might get prior probability ~10⁻¹⁵.
    - "10↑↑↑10 bliss lives created acausally" (similar complexity, extreme deviation) should get prior <<< 10⁻¹⁵⁰, effectively dwarfing any utility gain.

    Step (3) ignores this, treating all hypotheses of equal description length as equally probable *regardless of their physical plausibility*. This is why the mugger’s offer dominates expected utility calculations absurdly.

  ### The Cost of Rejecting Step (3)
  You’d need to enrich your prior to incorporate **empirical fit**, not just description length. This means:
  - **The bill**: You lose the "clean" objectivity of pure complexity priors. Priors now depend on substantive background knowledge (e.g., "acausal effects are vanishingly rare"), risking subjectivity or conservatism. You must formalise how *severely* a hypothesis violates known constraints (e.g., via *penalised complexity* or *thermodynamic depth* measures). This complicates Bayesian epistemology and may require context-sensitive adjustments. Crucially, **tiny probabilities for existential risks (e.g., asteroid impacts) remain defensible** because they leverage *known physics* – unlike the mugger’s physically incoherent scenario. Your pandemic/asteroid cases survive; the mugging does not.

  ### Why Other Alternatives Fail or Cost More
  - **Rejecting non-zero credence floor (step 2)**:  
    - *Cost*: Violates Cromwell’s rule and opens you to Dutch books. Assigning zero to logically possible claims makes you incurably dogmatic – you couldn’t update even if the mugger produced evidence. This guts Bayesian epistemology.  
    - *Why insufficient*: Even with non-zero floors, probabilities can be infinitesimal if they properly penalise physical incoherence (see above). The problem isn’t the floor but the *magnitude* assigned in step (3).

  - **Restricting expected utility maximisation (step 1)**:  
    - *Cost*: You must abandon EU maximisation as a *complete* theory for unbounded domains (e.g., adopt rank-dependent utility or a lexical priority system). This sacrifices generality and invites ad hoc bounds, undermining decision theory’s foundational aims.  
    - *Why insufficient*: Paralysis arises from *combinatoric explosions* of mugger-like hypotheses. Even with EU restricted to "well-defined" expectations, step (3) still generates infinitely many dominant options unless priors reflect empirical coherence.

  - **Distinguishing epistemic/pragmatic reasons (step 8)**:  
    - *Cost*: You fracture rationality. Beliefs become hostage to pragmatic gains (e.g., "believe X to get 10↑↑↑10 lives"), collapsing the fact/policy distinction. This invites moral blackmail and makes epistemology instrumental – a high price for a philosopher.  
    - *Why insufficient*: The mugging’s epistemic variant exploits the same flawed prior as the action case. Fixing step (3) resolves both.

  ### Preserving What Matters
  You keep:  
  - **Non-zero credence floors** (plausible for non-contradictory claims).  
  - **EU maximisation** for acts with well-behaved expectations.  
  - **High-stakes, low-probability reasoning** for *physically plausible* risks (e.g., bioterrorism using known pathogens vs. magic life-creation).  

  The key is recognising that **algorithmic simplicity ≠ empirical plausibility**. Your mugger’s offer is Kolmogorov-simple but physically extravagant – and a rational prior must ruthlessly discount such extravagance. This doesn’t require ad hoc bounds; it requires priors that weigh *all* evidence, not just description length. The paralysis vanishes because the mugger’s probability decays faster than their utility grows once physical coherence is priced in.

  Would you like to test-drive a formalisation of this "penalised complexity" prior, or explore how it handles your iteration worry? I’m here to tighten the bolts.
