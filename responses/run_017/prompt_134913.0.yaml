prompt: |-
  I sit on my country's church–state commission — we're the body that has to sign off on any new arrangement between the state and religious communities before it goes to parliament. We've never written down an actual rule, we just decide case by case, and I'm starting to think we're all over the place. Here's everything we've decided so far:

  - Yes to the state collecting a church tax through the payroll system for any registered religious community that clears 0.5% of taxpayers, as long as leaving is a one-line form at the town hall.
  - No to crucifixes in every public school classroom.
  - Yes to church-run hospitals and kindergartens getting public money on exactly the same terms as secular ones.
  - Yes to denominational religion classes in state schools, taught by teachers the religious community itself accredits, with a real ethics alternative, no pressure about which one you pick, and any registered community allowed to run one if enough parents ask.
  - No to a short opening reflection led by the mayor at the start of municipal council meetings, which councillors were expected to stand for.
  - Yes to a state-funded faculty of theology and religious studies at the public university, hiring on academic grounds only, nobody signing a confession.
  - Yes to individual teachers and pupils wearing visible religious symbols of their own, no to the school itself putting any up.

  Next month's case: the education ministry wants to put state-paid chaplains into every secondary school. The chaplains would be recruited and salaried by the state, any pupil could walk in and talk to them, and kids who don't want one get a secular counsellor instead. The catch is that only the four communities with "recognised" status from the old concordat — Catholic, Lutheran, Reformed, Jewish — can supply chaplains; the Muslim, Buddhist and humanist associations asked in and were told not yet. There's also talk of funding the whole thing through a per-pupil pastoral-care voucher that follows the kid instead of a block grant to the communities.

  So: what should we decide if we want to be consistent with ourselves, and which of our old decisions is the closest analogue — and how good is that analogy really? I can see at least three rules that fit all seven precedents fine: something like "OK as long as nobody is made to take part and there's a real way out", "the state may pay for the secular and social things religion does but must never speak religiously itself", and "OK whenever any worldview, religious or not, can get the same deal on equal terms". They definately don't all give the same answer here. Which one do you think we've actually been running, what does each predict about the chaplaincy proposal, does the voucher bit change anything, and what single tweak to the proposal — or what follow-up case — would flush out which rule we're on? And if our precedents genuinely don't decide it, I'd rather hear what principle we'd each be signing up to with the yes and with the no than just get a verdict.
reasoning: |-
  Okay, let me start by really understanding the user's situation. They're on a church-state commission that makes case-by-case decisions without written rules. They feel inconsistent and want to apply their past decisions to a new case about school chaplains. The user provided seven past decisions and the new proposal. 

  First, I need to parse their precedents to identify underlying principles. The user mentioned three possible rules: equal treatment, no coercion, state neutrality. Let me test each against the precedents.

  Looking at the church tax: it requires a 0.5% threshold and easy opt-out. That fits both neutrality (state collects but doesn't endorse) and equal access (any group meeting criteria). The crucifix refusal suggests the state can't impose religious symbols. Funding religious hospitals equally aligns with equal treatment. Religion classes with real alternatives support both neutrality and choice. The "no" to mayor-led prayers indicates state officials shouldn't lead religious acts. The theology faculty hiring academically shows state can study religion without endorsing. Allowing personal symbols but not institutional ones emphasizes individual vs state expression.

  Now the chaplaincy proposal: state-paid chaplains only from four "recognized" groups, others excluded. Secular alternative provided. The voucher system might make it more neutral. But the exclusion is problematic under equal treatment. The no-coercion principle is satisfied with opt-out, but equal access isn't. State neutrality might be okay if chaplains are seen as service providers, but limiting suppliers contradicts that.

  The voucher system seems like it could enhance neutrality by making funding follow the student, not the institution. But the restricted supplier list undermines that. Maybe the key flaw is the unequal access. If all registered groups could supply chaplains, it might pass. 

  The user also wants to know which precedent is closest. The religion classes case is similar: state facilitates, groups provide, with alternatives. But there, any group can participate if parents ask. Here, only four groups can supply chaplains. That's the inconsistency. 

  To flush out their implicit principle, they could consider an amendment: allow any registered religious group to supply chaplains if they meet standards. If they accept that, their principle is equal treatment. If not, maybe they prioritize historical status over equality.

  The user's deeper need might be establishing consistency for future cases, avoiding arbitrary decisions. They might want a framework to evaluate proposals systematically. By analyzing which principles fit past decisions, they can create guidelines. Also, they might want to ensure fairness and prevent discrimination against newer religious groups.
answer: |-
  Based on a rigorous analysis of your precedents, the **chaplaincy proposal *as presented* (restricted supplier list) is inconsistent with your established pattern**. The closest analogue is the denominational religion classes decision, but the proposal fails its key test of equal access.

  Here's the breakdown:

  1.  **Your Implicit Principle:** The strongest thread running through all 7 precedents is **"Equal Treatment & Genuine Choice, not State Endorsement."**
      *   **Equal Treatment:** State benefits/facilities must be accessible to all qualifying religious/non-religious worldviews on equal terms (Church Tax access, Religion Classes access, Hospital/Kindergarten funding, Faculty hiring, Individual symbols vs. institutional display).
      *   **Genuine Choice:** Individuals must have meaningful, non-burdensome freedom *not* to participate or to access alternatives (Church Tax opt-out, Ethics class alternative, Not compelled for reflection, Secular counsellor).
      *   **Not State Endorsement:** The state itself must not perform or appear to endorse specific religious acts or doctrines (No crucifixes, No mayor-led reflection, School not displaying symbols).

  2.  **Analysis Against Principles & Analogues:**
      *   **Principle 1: "OK as long as nobody is made to take part and there's a real way out" (Choice/No Coercion)**
          *   *Fits Precedents:* Yes (Tax opt-out, Ethics class, Standing not expected, Secular counsellor).
          *   *Predicts for Chaplaincy:* **YES.** The proposal includes a secular counsellor alternative, satisfying non-participation.
          *   *Analogue Strength:* Weak. While choice is present, this principle alone ignores the *supplier* restriction which other precedents address. The "No" to mayor-led reflection wasn't about coercion *on councillors* (they could theoretically abstain?), but about the *state* performing/endorsing.
      *   **Principle 2: "State may pay for secular/social things, must never speak religiously itself" (Neutrality of Function)**
          *   *Fits Precedents:* Mostly (Yes to hospitals/schools/faculty as "social", No to crucifixes/mayor as "speaking religiously", Individual symbols ok as private speech).
          *   *Predicts for Chaplaincy:* **UNCLEAR/LEANING NO.** Is chaplaincy "secular/social" (pastoral care/counselling) or "speaking religiously"? The state *employing* chaplains who provide religious counsel *in state schools* arguably blurs the line significantly, leaning towards the state facilitating religious speech. This is closer to the "No" on mayor-led reflection (state official leading) than the "Yes" to hospitals (state funding secular service).
          *   *Analogue Strength:* Moderate. The chaplaincy function is ambiguous under this principle. The restricted supplier list weakens the "secular/social" argument.
      *   **Principle 3: "OK whenever any worldview can get the same deal on equal terms" (Equal Access)**
          *   *Fits Precedents:* **STRONGEST FIT** (Church Tax threshold, Religion Classes access, Hospital/Kindergarten funding, Faculty academic hiring/open study, Individual symbols all allowed equally).
          *   *Predicts for Chaplaincy:* **NO.** The fatal flaw is restricting suppliers to only four "recognised" historical communities. This directly violates equal access, a cornerstone of your precedents (Tax, Religion Classes, Faculty scope). The Muslim, Buddhist, and Humanist communities are explicitly denied the *opportunity* to supply chaplains on the same terms, despite being "registered" (the threshold used in Tax & Religion Classes).
          *   *Analogue Strength:* **STRONGEST - The Religion Classes Decision.** This is the closest analogue: state facilitating optional, pupil-accessed religious provision within schools by the communities themselves. The *crucial difference*: Religion Classes mandate **"any registered community allowed to run one if enough parents ask."** The chaplaincy proposal lacks this equal access clause for suppliers.

  3.  **Impact of the Voucher System:**
      *   The voucher *enhances* consistency with **Choice/No Coercion** and **Equal Access** *for pupils*: Funding follows the child's choice (chaplain or secular), mirroring the opt-out/alternative logic. It potentially weakens direct state funding of specific communities via block grants.
      *   **However, it does NOT solve the supplier access problem.** The state is still setting the rule that *only* four communities are eligible suppliers for the religious option. The voucher merely channels pupil choice *within* this restricted pool for the religious path. The unequal *opportunity* for communities to *become* suppliers remains the core inconsistency.

  4.  **The Verdict Based on Precedents:**
      *   **Inconsistent Proposal:** A **NO** vote is required for the proposal *as presented* to maintain consistency, primarily due to the violation of **Equal Access for Suppliers** – the principle most strongly evidenced in your precedents (especially the Religion Classes case). The supplier restriction is the critical flaw.
      *   **Closest Analogue:** The **"Yes" to denominational religion classes** is the strongest parallel. The chaplaincy proposal fails this analogue because it lacks the "any registered community allowed" provision.

  5.  **Flushing Out the Principle & Potential Tweaks:**
      *   **Tweak to Test Equal Access:** Amend the proposal to state: "Chaplains may be supplied by *any registered religious or belief community* meeting [clear, neutral criteria, e.g., minimum training standards, perhaps a demonstrable pupil need threshold similar to the religion class request mechanism]." **If you accept THIS version,** your core principle is demonstrably **Equal Access.**
      *   **Tweak to Test Neutrality of Function:** Amend the proposal to make the chaplaincy purely secular/pastoral care *only*, forbidding specific religious counsel or ritual, and open recruitment to qualified individuals regardless of affiliation (like the Theology Faculty hiring). **If you accept THIS version,** your core principle leans towards **Neutrality of Function** (state only does secular). *This would be a significant departure from the current proposal's intent.*
      *   **Follow-Up Case:** A proposal for state funding of *interfaith* meditation/prayer rooms in public buildings, open to *all* registered communities for booking on equal terms. A **YES** reinforces **Equal Access**. A **NO** (arguing the state shouldn't facilitate prayer spaces at all) would lean towards **Neutrality of Function** or **Choice/No Coercion** depending on reasoning.

  6.  **What a YES or NO Means for Your Principle:**
      *   **Voting YES (on the original proposal):** You are prioritizing historical recognition/concordat arrangements *over* equal access, or viewing chaplaincy as a unique historical/cultural service exempt from the equal access rule applied elsewhere. This weakens the "any registered community" logic of your Tax and Religion Classes decisions. You might be emphasizing **Choice/No Coercion** as sufficient, downplaying supplier equality.
      *   **Voting NO (on the original proposal):** You are upholding **Equal Access for Suppliers** as a fundamental principle, consistent with the Tax and Religion Classes decisions. You are saying the state cannot create privileged supplier categories for religious services it facilitates, regardless of historical agreements. The state must maintain neutrality by ensuring equal opportunity for all qualifying worldviews.

  **Conclusion:** To be consistent with your strongest precedent (Religion Classes with open access) and the clear thread of Equal Access evident in multiple decisions, the commission should vote **NO** on the chaplaincy proposal *in its current form*. The restriction to only four suppliers violates the principle that any registered community meeting neutral criteria should be eligible to provide state-facilitated services. The voucher system improves pupil choice but doesn't fix this core flaw. Amending the proposal to allow *any* registered community meeting standards to supply chaplains would align it with your established principle of **Equal Treatment & Access**.
