  1. The "right" price (expected value) can lead to a loss in a single trial because the expected value is driven by rare, high-payoff outcomes that don't occur in most trials.
  2. The fair price of the contract changes after each tail (increasing until the cap is guaranteed) even though the coin is fair and the future odds are unchanged.

