answer: |-
  ### Activity: St. Petersburg Trading Game  
  **Goal:** Students experience how the "fair" price of a risky contract depends on rare outcomes (insight 1) and changes dynamically after tails (insight 2), without invoking risk aversion or expected value.  

  ---

  ### **Materials & Setup**  
  - **Materials:** Whiteboard, coin (or phone app), index cards (1 per student per round), play money (each student starts with 100 PM), 3 chocolate bars (prizes).  
  - **Whiteboard Setup:**  
    - **Payoff Table:**  
      | Tails before heads | Payout |  
      |-------------------|--------|  
      | 0 (first flip H)  | 1      |  
      | 1                 | 2      |  
      | 2                 | 4      |  
      | 3                 | 8      |  
      | ...               | ...    |  
      | 9                 | 512    |  
      | 10+               | 1000   | *(Cap at 1000)*  
    - **Tracking:** Space for recording bids/asks, trade prices, and coin flips.  

  ---

  ### **Rules**  
  1. **Contract:** One contract per game. It pays out based on the **first heads** in a public coin-flip sequence (fair coin).  
  2. **Trading Rounds:**  
     - **Round 0 (Initial Auction):** Sealed bids. Highest bidder wins the contract, pays their bid to the bank.  
     - **After Each Tail:** Re-price the contract.  
       - Holder writes an **ask** (minimum to sell).  
       - Others write **bids** (maximum to buy).  
       - Trade occurs if highest bid ≥ holder’s ask. Holder sells to highest bidder at the bid price.  
     - **After Heads:** Contract pays holder (payout per table), game ends.  
  3. **Prizes:** After 1–2 games, top 3 PM balances win chocolate.  

  ---

  ### **Timeline (75 min)**  
  1. **Intro (10 min):**  
     - Explain rules, payoff table, and trading. Emphasize: "Price the contract so you don’t lose money on average."  
     - Assign starting PM (100 per student).  

  2. **Break-Even Price Derivation (15 min):**  
     - **Pairs activity:** "What’s the maximum you’d pay for this contract? Use the payoff table. Assume 50/50 odds."  
     - **Do not discuss answers as a class yet.** *(Prevents early spoilers.)*  

  3. **Game 1 (20 min):**  
     - Auction: Collect sealed bids. Sell to highest bidder. Record price.  
     - Flip coin publicly.  
       - **Heads:** Payout ends game.  
       - **Tails:** Hold trading round. Repeat flips/trading until heads. Record all bids, asks, trades.  

  4. **Game 2 (15 min):**  
     - Repeat with a new contract. *(Ensures at least one game has multiple flips.)*  

  5. **Debrief (15 min):**  
     - **Insight 1 (Right price, wrong outcome):**  
       - *Ask:* "Who paid near 6 PM in Game 1? What was the payout? Did you lose despite a ‘fair’ price?"  
       - *Point:* "6 is break-even on average because of the tiny chance of 512 or 1000. But in one game, you likely get 1–8 and lose."  
       - *Map to moment:* Highlight a student who refused a high offer (e.g., 30 PM) then got 16. "Refusing was right for the average, but lost here."  
     - **Insight 2 (Price moves after tails):**  
       - *Ask:* "After a tail, did bids go up? Why? Did anyone think heads was ‘due’?"  
       - *Show break-even prices on board:*  
         | Tails so far | Break-even |  
         |-------------|-----------|  
         | 0           | 6         |  
         | 1           | 11        |  
         | 2           | 20        |  
         | 3           | 36        |  
         | 4           | 64        |  
         | 5           | 111       |  
         | 6+          | →1000     |  
       - *Point:* "Each tail doubles the min payout and brings the cap closer. The coin didn’t change—the contract did."  
       - *Map to moment:* Compare post-tail trade prices to the table. Note if bids underreacted (e.g., only rose to 15 after 1 tail).  

  6. **What the Game Can’t Reproduce:**  
     - The original paradox has **infinite expected value** (no cap). Our cap makes the price finite, so you must say: "Without a cap, the ‘fair’ price is infinity—but would you pay $1,000,000? That’s the paradox!"  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Game ends on first flip (no re-pricing):**  
     - **Fix:** Run 2 games. If both end early, use a **pre-generated sequence** (e.g., T,T,H) for Game 2 to force re-pricing. *Cost: Loses randomness but keeps activity alive.*  

  2. **Student shouts "Expected value!" early:**  
     - **Fix:** Redirect: "Great—but calculate it for our capped version with the table." Keep auction closed until pairs finish. If they blurt a number, say: "Prove it to your pair first."  

  3. **Show-off bids (e.g., 400 PM):**  
     - **Impact:** Distorts initial auction; holder may refuse fair later bids.  
     - **Mitigation:** Let it happen. In debrief, contrast with break-even prices: "Who would sell to this bidder? Would you buy it for 400 if the max payout is 1000?"  

  4. **Market freezes (no bids ≥ ask):**  
     - **Response:** No trade. Holder stays. Use as a teachable moment: "Why no deal? Was the holder’s ask too high?"  

  ---

  ### **Teacher Notes**  
  - **Break-Even Prices (Your Numbers):** Correct. Values are rounded for simplicity (exact math in response).  
  - **Key Debrief Don’t:** Avoid claiming "people are irrational." Focus on: "Rare outcomes dominate pricing, and tails change the contract’s structure."  
  - **Why This Works:** Trading makes insights visceral. Students see prices shift and feel the tension between "right for average" and "wrong for reality."  

  Summary: Students trade a coin-flip contract with doubling payouts and a cap, discovering how fair prices hinge on rare outcomes and shift after tails despite unchanged odds.
