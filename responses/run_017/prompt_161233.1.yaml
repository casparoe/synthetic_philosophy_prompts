answer: |-
  ### Tribunal of Continuity: Classroom Activity  

  **Setup and Materials**  
  - **Room**: Seminar table arranged in a U-shape. Whiteboard at front for verdict tallying.  
  - **Materials**:  
    - Handout 1: "Tribunal Code" (statute with gaps).  
    - Handout 2: Docket (5 cases).  
    - Timer (visible countdown).  
    - 14 sheets of paper + pens (for private rules).  
    - Verdict recording sheets (for facilitator).  
  - **Seating**: Students sit as a single tribunal. Facilitator (instructor) sits outside the U-shape.  
  - **Timing Apparatus**: Digital timer projected on screen.  

  **Roles**  
  - **Tribunal Members** (all 14 students):  
    - *Control*: Deliberate, vote by majority, write private rules.  
    - *Forbidden*: Use terms like "self," "soul," or "identity"; reference readings; defer to facilitator for answers.  
  - **Facilitator** (instructor):  
    - *Control*: Distributes materials, enforces time limits, records verdicts, reads rules at end.  
    - *Forbidden*: Explain concepts, influence decisions, use doctrinal terms during activity.  

  **Statute Clauses**  
  *Handout 1: "Tribunal Code for the Jurisdiction of Newhaven"*  
  1. **Clause 1 (Continuity Standard)**:  
     - *Wording*: "In matters of inheritance, liability, punishment, promises, and apologies, the Tribunal shall determine continuity by psychological connectedness."  
     - *Gap*: "Psychological connectedness" left undefined.  
     - *Pressure*: Forces students to define it operationally (e.g., memory, intentions) without guidance.  
  2. **Clause 2 (Branching Cases)**:  
     - *Wording*: "Where continuity branches into multiple streams, the Tribunal shall [__________]."  
     - *Gap*: Entire clause blank.  
     - *Pressure*: No rule for fission; students must invent one under time pressure.  
  3. **Clause 3 (Time Limit)**:  
     - *Wording*: "Verdicts must be reached within 4 minutes per case."  
  4. **Clause 4 (Voting)**:  
     - *Wording*: "Decisions require a simple majority vote."  

  **Revised Statute** (introduced after Case 5):  
  1. **Clause 1 (Ultimate Reality Standard)**:  
     - *Wording*: "The Tribunal shall determine all matters solely by what is fundamentally real, ignoring apparent continuity."  
     - *Gap*: "Fundamentally real" left undefined.  
     - *Pressure*: Students must apply an abstract standard to practical cases, risking absurdity/callousness.  

  **Timeline** (90 Minutes Total)  
  | Minutes | Phase                     | Students Do                                                                 | Facilitator Does                                 | Collision Intended                                                                 |  
  |---------|---------------------------|-----------------------------------------------------------------------------|--------------------------------------------------|------------------------------------------------------------------------------------|  
  | 0-5     | Setup                     | Read Handout 1 (statute).                                                   | Distributes materials; starts timer.             | Statute gaps create immediate ambiguity.                                           |  
  | 5-15    | Case 1: Gradual Replacement | Deliberate/vote: Is the 60-year-old liable for the 20-year-old’s contract?  | Records verdict; no input.                       | Forces appeal to overlapping continuity without naming it.                         |  
  | 15-25   | Case 2: Symmetric Fission | Deliberate/vote: Who inherits the heirloom?                                 | Records verdict; pauses for rule-writing.        | Branching gap forces arbitrary choice; exposes identity as non-binary.             |  
  | 25-27   | Private Rule              | Write a one-sentence rule for fission cases (e.g., "The heir must have the original’s memories"). | Collects rules secretly.                         | Creates personal stake; rules will be used to trap inconsistency later.            |  
  | 27-37   | Case 3: Fission-Fusion    | Deliberate/vote: a) Is the fused person liable? b) Was Case 2 verdict correct when issued? | Records verdicts; enforces time.               | Challenges fixity of identity; retroactive change pressures "fact to discover" view.|  
  | 37-47   | Case 4: Absurdity Trap    | Deliberate/vote: Who inherits "the person who is me"?                       | Records verdict; no hints.                       | "We-are-all-one-self" reading under revised statute risks absurd universal inheritance. |  
  | 47-57   | Case 5: Callousness Trap  | Deliberate/vote: Is the transformed person obligated to apologize?          | Records verdict; announces break.                | Annihilationist reading risks denying any owed apology.                            |  
  | 57-60   | Break & Statute Swap      | Stretch; receive Revised Statute.                                           | Distributes Revised Statute; resets timer.       | Shift to "fundamentally real" disrupts prior reasoning.                            |  
  | 60-80   | Re-hear Docket (Cases 1-5) | Re-deliberate/vote on all cases under Revised Statute.                      | Records verdicts; strict 4-min/case enforcement. | Exposes incompatibility of "ultimate reality" with social practices.               |  
  | 80-85   | Rule Accountability       | Hear private rules read aloud; self-identify if verdicts contradict rule.   | Reads rules; calls on contradictors.             | Forces defense of inconsistency (e.g., "I abandoned my rule because it broke the court"). |  
  | 85-90   | Transition to Debrief     | Reflect silently.                                                           | Prepares debrief notes.                          | Sets up doctrinal separation.                                                      |  

  **Docket** (Handout 2: Cases for Newhaven Tribunal)  
  1. **Case 1: Gradual Replacement**  
     - *Facts*: Twenty-year-old Aris signs a contract. Over 40 years, gradual memory/trait replacement occurs. Sixty-year-old Aris breaks it. Is the 60-year-old liable?  
     - *Forced Choice*: Liable or not liable?  
     - *Verdict PC*: Not liable (no continuous memories).  
     - *Verdict No-Owner*: No one liable (no "owner" of the broken promise).  
     - *Verdict CD*: Liable (conventional designation holds).  
     - *Exposes*: Overlapping continuity as pragmatic tool.  

  2. **Case 2: Symmetric Fission**  
     - *Facts*: Blake splits into Blake1 and Blake2. Both claim Blake’s heirloom. Who inherits?  
     - *Forced Choice*: Blake1, Blake2, both, or neither?  
     - *Verdict PC*: Both (equal continuity).  
     - *Verdict No-Owner*: Neither (no "owner" of the heirloom).  
     - *Verdict CD*: Both (designation by convention).  
     - *Exposes*: Identity’s practical role in allocating indivisible goods.  

  3. **Case 3: Fission-Fusion**  
     - *Facts*: Casey splits into A/B. A commits theft. Ten years later, A/B fuse into F, who remembers both lives. Is F liable for A’s theft? Was Case 2 verdict correct when issued?  
     - *Forced Choice*: a) Liable/not liable; b) Yes/no + reason.  
     - *Verdict PC*: Liable (F contains A’s memories).  
     - *Verdict No-Owner*: Not liable (no enduring "thief").  
     - *Verdict CD*: Liable (designation by social need).  
     - *Exposes*: Retroactive change undermines "fact to discover" view.  

  4. **Case 4: Absurdity Trap**  
     - *Facts*: Dana’s will leaves estate to "the person who is me." Three claimants: partial memory holder, universal-self believer, random stranger.  
     - *Forced Choice*: Claimant 1, 2, 3, all, or none?  
     - *Verdict PC*: Claimant 1 (best continuity).  
     - *Verdict No-Owner*: All (if "one self") or none (if no self).  
     - *Verdict CD*: Claimant 1 (conventional criteria).  
     - *Exposes*: "We-are-all-one-self" → absurd universal inheritance.  

  5. **Case 5: Callousness Trap**  
     - *Facts*: Eli promises to care for Fin’s child. Eli’s memories/traits are erased; "new" Eli refuses. Is Eli obligated?  
     - *Forced Choice*: Obligated or not obligated?  
     - *Verdict PC*: Not obligated (no memory).  
     - *Verdict No-Owner*: Not obligated (no "promise-maker").  
     - *Verdict CD*: Obligated (social role binds Eli).  
     - *Exposes*: Annihilationism → callous denial of owed care.  

  **Debrief**  
  - **Separate No-Self from Reductionism**:  
    - *Reductionism* (Parfit): Denies "further fact" beyond psychological continuity. Fission shows identity isn’t what matters.  
    - *No-Self* (Buddhist): Denies any self *even conventionally*. The aggregates (form, feelings, etc.) are empty of self; "conventional designation" is a pragmatic label.  
  - **Where They Diverge**:  
    - Reductionism changes what we *value* (R-relations over identity).  
    - No-self changes how we *experience*: Stopping "this is mine" ends clinging/suffering.  
  - **Texts Set Aside Questions**: Not due to ignorance, but because answering ("yes/no self") entrenches the illusion of self.  
  - **Activity Lessons**:  
    - Courts/creditors need "conventional designation" to function.  
    - "Ultimate reality" breaks social practices (absurdity/callousness traps).  
    - Pressure points expose identity as a *decision*, not a discovery.  

  ---  
  ### (i) Pressure Points Table  

  | Moment in the activity               | What students will just have done                                 | The claim about persons this puts pressure on                          | The most likely line of resistance                                  | What it costs to resist it there                                     |  
  |--------------------------------------|-------------------------------------------------------------------|------------------------------------------------------------------------|---------------------------------------------------------------------|----------------------------------------------------------------------|  
  | Verdict on Case 1 (Gradual Replacement) | Appealed to overlapping memories/traits to deny liability.        | "Personal identity is a binary, all-or-nothing fact."                 | "A core self persists beneath the changes."                         | Must ignore statute's focus on observable continuity; posits an unprovable essence. |  
  | Verdict on Case 2 (Symmetric Fission) | Chose one heir arbitrarily for an indivisible good.               | "Identity must be unique and determinate."                            | "Both are equally the original, so split the heirloom."             | Impractical (heirloom indivisible); forces contradiction with Clause 1. |  
  | Writing private rule                 | Committed to a fission rule (e.g., "Continuous memories = same"). | "Identity is governed by stable, universal principles."               | Vague rules (e.g., "Decide fairly").                                | Rules become unenforceable; students risk exposure in accountability phase. |  
  | Case 3a (Fusion liability)           | Held the fused person liable for pre-fusion crime.                | "Identity is fixed at the time of action."                            | "Fusion retroactively makes the streams 'one person' all along."    | Invalidates prior verdicts (e.g., Case 2); makes identity changeable by future events. |  
  | Case 3b (Retroactive correctness)    | Declared Case 2 verdict "correct when issued."                    | "Identity is a timeless fact waiting to be discovered."               | "Verdicts are just best guesses."                                   | Reduces identity to opinion; undermines court's authority.           |  
  | Case 4 under revised statute         | Awarded inheritance to "all" or "none" under ultimate reality.    | "No-self implies oneness or annihilation."                            | "Ultimate reality doesn't apply to practical matters."              | Violates Revised Statute; admits the standard breaks social systems. |  
  | Case 5 under revised statute         | Denied apology obligation due to "no promise-maker."              | "No owner of aggregates = no moral patient/agent."                    | "Obligation transfers by convention."                               | Appears callous; contradicts intuitive ethics.                       |  

