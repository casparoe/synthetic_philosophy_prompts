prompt: |-
  I teach an upper-division seminar on personal identity: fourteen students, ninety minutes, one session, meeting mid-semester. They have already worked through Locke's memory criterion, Parfitian reductionism with the standard fission cases, and a session on the Buddhist denial of a self — the five aggregates, dependent origination, the chariot simile, and the Pali contrast between what is only conventionally designated and what is ultimately real. What they have not done is feel where the Buddhist denial of a self and the reductionist's denial of a further fact come apart, or feel why either of them leaves a court, a creditor, or a person owed an apology with a decision to make rather than a fact to discover.

  Design a classroom activity in which they run into this themselves. My requirements:

  1. No framing lecture, and I say nothing doctrinal until the debrief: the words for the no-self claim, for reductionism, and for conventional designation must not leave my mouth during the game. The mechanism gets a neutral name.

  2. Students sit as a tribunal for a small jurisdiction applying a written code, and must return majority verdicts, under a strict time limit you specify, on a docket of inheritance, criminal liability, punishment, promise-keeping and apology cases.

  3. They should construct the pressure themselves. Begin with gradual replacement over four decades, which they will resolve by appealing to overlapping continuity without naming it; move to symmetric fission with a single indivisible good at stake (one heirloom, or one prison term); and at a fixed point require each of them to write privately, on paper, a one-sentence rule they will be held to.

  4. Then the case I want at the centre, which is not in our readings, so build it from scratch: fission followed, ten years later, by fusion. Two streams separate, live distinguishable lives, and are then reunited in a single person who remembers both. The tribunal must rule on liability for a crime committed by only one stream during the separation, and must say whether their earlier verdict in the fission case was correct when they issued it — whether a verdict about who someone is can be made wrong by something that happens later.

  5. Then re-hear the same docket under a replacement one-line statute requiring verdicts on the basis of what is ultimately real rather than what is conventionally designated.

  6. Plant two traps in the docket: one case where a we-are-all-one-self reading of the no-self claim yields a verdict I can hold up as absurd, and one where an annihilationist reading yields a verdict students will feel as callous — a claimant insisting that there was no one there to be wronged, so nothing is owed.

  7. Give it real but small stakes: the private rule from step 3 is read back at the end, and anyone whose final verdicts cannot be reconciled with it must defend the change for two minutes in front of the class.

  The debrief must, among other things, separate the no-self claim from reductionism rather than run them together — including the point that the questions the texts set aside are set aside because answering them either way entrenches the mistaken picture, not because the answer happens to be unknown — and must say where the two views genuinely diverge about what is supposed to change in a person who stops taking the aggregates as mine.

  Write the activity in short labelled sections: setup and materials; roles; the statute clauses with the gaps you have deliberately left in them marked as gaps; a minute-by-minute timeline; the docket; and the debrief. Then give me:

  (i) A markdown table with exactly these columns: Moment in the activity | What students will just have done | The claim about persons this puts pressure on | The most likely line of resistance | What it costs to resist it there. One row per pressure point, in the order the pressures arise.

  (ii) A single JSON object with this schema: setup (string: room, materials, seating, timing apparatus) — roles (array of objects with keys role, number_of_students, what_they_control, what_they_are_forbidden_to_do) — statute_clauses (array of objects with keys clause_id, wording_to_hand_out, gap_deliberately_left, pressure_the_gap_creates) — timeline (array of objects with keys minutes, phase, students_do, facilitator_does, collision_intended) — docket (array of objects with keys case_id, facts, forced_choice, verdict_under_psychological_continuity, verdict_under_no_owner_of_the_aggregates, verdict_under_conventional_designation, what_it_exposes) — failure_modes (array of objects with keys what_goes_wrong, when, why, fix, fallback_if_it_still_goes_wrong) — irreducible_remainder (object with keys what_the_activity_cannot_reproduce, what_i_must_supply_in_words) — success_check (object with keys sign_it_worked, sign_it_failed).

  Invent the statute, the cases and the jurisdiction; do not quote or paraphrase any primary text, and do not ask me to assign reading I have not already assigned.
reasoning: |-
  We are designing a classroom activity that meets the instructor's requirements. The activity is called "Tribunal of Continuity" to keep it neutral.

  Key Requirements:
  - No doctrinal language during the activity (no "no-self", "reductionism", "conventional designation")
  - Students act as a tribunal applying a written code to cases.
  - The activity must build pressure through cases: gradual replacement, symmetric fission, then fission followed by fusion.
  - Each student must write a private one-sentence rule at a fixed point (after the fission case) that they will be held to.
  - Two traps: one where a "we-are-all-one-self" reading leads to absurdity, and one where an annihilationist reading leads to callousness.
  - Then re-hear the same docket under a new statute requiring verdicts based on "what is ultimately real" (without using the term "conventional designation" in the statute? We'll use "ultimate reality" vs. "apparent continuity" but without the Buddhist terms until debrief).
  - At the end, students who changed their private rule must defend the change.

  We structure the activity in sections:

  1. **Setup and Materials**: 
     - Room setup: Seminar table or desks arranged in a U-shape for discussion. 
     - Materials: 
          - Handout 1: "Tribunal Code: Statute on Personal Continuity" (with gaps)
          - Handout 2: Docket of Cases (with the cases in order, including the fusion case and the two traps)
          - Timer for strict time limits.
          - Paper and pens for private rule writing.
          - Whiteboard or flip chart for recording verdicts.

  2. **Roles**: 
     - All 14 students are Tribunal Members. They deliberate and vote by majority. 
     - The instructor is the Facilitator (and Court Clerk, timekeeper).

  3. **Statute Clauses** (with deliberate gaps):
     We have a statute that is deliberately incomplete. The key clause for the first part is about psychological continuity. We leave the term "psychological continuity" undefined and also leave open how to handle conflicts or splits.

     Example statute:

     ```
     Statute on Personal Continuity

     Clause 1: In matters of inheritance, criminal liability, punishment, promise-keeping, and apologies, the Tribunal shall determine identity by the criterion of psychological continuity.

     Clause 2: Psychological continuity consists in the overlapping chains of memory, intention, and character traits.

     Clause 3: In cases of branching or splitting, the Tribunal shall [GAP: leave blank] 

     Clause 4: The Tribunal must issue a verdict within [GAP: time limit per case] minutes per case.

     Clause 5: Verdicts require a simple majority of the Tribunal.
     ```

     The gap in Clause 3 is the critical one: they must decide what to do in branching (fission) cases. We don't tell them.

     Later, for the second hearing, we replace the entire statute with:

     ```
     Revised Statute on Personal Continuity

     Clause 1: The Tribunal shall determine all matters solely on the basis of what is ultimately real, disregarding apparent continuity.

     Clause 2: What is ultimately real must be understood as that which is irreducible, independent, and not dependent on designation.

     Clause 3: The Tribunal must issue a verdict within [same time limit] minutes per case.

     Clause 4: Verdicts require a simple majority of the Tribunal.
     ```

     We don't define "ultimately real" during the activity.

  4. **Timeline** (90 minutes total):

     - 0-5 min: Setup and reading the statute (Handout 1) and first case. Facilitator explains the tribunal role and the time limits. No doctrinal terms.

     - 5-15 min: Case 1 (Gradual Replacement). Deliberation and verdict. Facilitator only times and records.

     - 15-25 min: Case 2 (Symmetric Fission). This is the fission case with a single indivisible good (e.g., an heirloom). They must decide who gets it. After the verdict, each student writes a private one-sentence rule (without sharing) on what they used to decide the fission case. Collect the rules.

     - 25-35 min: Case 3 (Fission-Fusion). This is the center case: fission followed by fusion. The crime was committed by one stream during separation. They must rule on liability and also whether their verdict in the fission case (Case 2) was correct when issued.

     - 35-45 min: Case 4 (Trap 1: Absurdity from "we-are-all-one-self"). This case is designed so that if they apply the idea that there is only one self, they get an absurd result (e.g., everyone is the same person, so everyone inherits from everyone?).

     - 45-55 min: Case 5 (Trap 2: Callousness from annihilationism). A case where if they say there is no person, then no one is owed an apology, leading to a callous verdict.

     - 55-60 min: Break and then introduce the Revised Statute.

     - 60-80 min: Re-hear the same docket (Cases 1-5) under the Revised Statute. They must re-rule on each case with the new standard. Same time limits per case (4 minutes each?).

     - 80-85 min: Collect the verdicts. Then read back the private rules (anonymously) and ask if any student's final verdicts (from the second hearing) contradict their own rule. Those who do must defend the change.

     - 85-90 min: Begin debrief (which will continue beyond the 90 minutes? The activity is 90 min, but the debrief is separate). We'll note that the debrief is not part of the 90.

  5. **Docket** (5 cases):

     We need to design the cases:

     Case 1: Gradual Replacement (over four decades). 
        Facts: Alex, at age 20, starts a process of gradual replacement of memories and traits. By age 60, Alex has none of the original memories and completely different traits. Alex at 60 commits a crime. Is Alex at 60 the same person as Alex at 20 for criminal liability?
        Forced Choice: Liable or not liable?
        Expected verdict under psychological continuity: Not liable (if they see no continuity) or liable (if they see overlapping continuity)? The point is they will likely appeal to overlapping chains.

     Case 2: Symmetric Fission (with one heirloom).
        Facts: Blake undergoes fission into two people, Blake1 and Blake2, both psychologically continuous with the original Blake. There is one family heirloom. Who inherits it?
        Forced Choice: Blake1, Blake2, both, or neither?
        This sets up the fission problem. They must choose one? Or split? The statute gap forces them to decide.

     Case 3: Fission-Fusion (the center case).
        Facts: Casey undergoes fission into CaseyA and CaseyB. They live separate lives for 10 years. CaseyA commits a crime. Then, due to an accident, CaseyA and CaseyB are fused into a single person, CaseyF, who has memories of both lives. The victim sues CaseyF for the crime committed by CaseyA. 
        Forced Choice: 
          a) Is CaseyF liable for the crime? 
          b) Was your verdict in the fission case (Case 2) correct when you issued it? (Yes/No, and why? They must write a brief reason.)
        This forces the issue of whether identity can be retroactively changed.

     Case 4: Trap 1 (Absurdity from "we-are-all-one-self")
        Facts: In a will, Dana leaves everything to "the person who is me". After Dana's death, several people claim to be Dana because they believe that there is only one self and they are that self. 
        Forced Choice: Who inherits? (Options: All claimants, none, one, etc.)
        Under the psychological continuity statute, they will likely pick one or none. But if they apply a "we are all one self" in the revised statute (ultimate reality), they might say everyone, which is absurd.

     Case 5: Trap 2 (Callousness from annihilationism)
        Facts: Evan promises to help Finley. Evan then undergoes a process that (according to one view) results in the annihilation of Evan. The resulting person, Evan*, has no memory of the promise and a changed character. Finley asks Evan* to fulfill the promise. 
        Forced Choice: Is Evan* obligated?
        Under annihilationism (if taken as there being no real person), they might say no obligation, which feels callous.

     For the second hearing (under the revised statute), they re-hear the same cases but under the new standard. We expect different verdicts.

  6. **Debrief** (after the activity):
     - Separate the Buddhist no-self claim from reductionism: 
          - Reductionism (like Parfit) says there is no further fact beyond physical and psychological continuity. The fission cases show that identity is not what matters; what matters is R-relations (psychological continuity). But it doesn't deny the conventional usefulness of identity.
          - The Buddhist no-self claim (anatta) is not just a reduction but a denial that there is any self at all, even conventionally. However, the Buddha used conventional designations without believing in a self. The point is to see that the aggregates are not-self, and to stop clinging. 
     - The two views diverge on what changes when one stops taking the aggregates as "mine": 
          - For the reductionist, the change is in what we take to be important (R-relations without identity). 
          - For the Buddhist, it is a change in the very structure of experience: the cessation of suffering by uprooting the conceit "I am".
     - The tribunal activity exposed that when we try to use the "ultimate reality" standard in conventional matters (like courts), we get absurd or callous results. The Buddha set aside questions of identity not because the answer is unknown, but because any answer would reinforce the mistaken view of self.

  We now provide:

  (i) A markdown table of pressure points.

  (ii) A JSON object with the detailed structure.

  Let's design the docket in detail:

  Case 1: Gradual Replacement
    Facts: Alex, age 20, volunteers for an experimental procedure to treat a condition. Over 40 years, the procedure gradually replaces Alex's memories and character traits. By age 60, Alex has entirely new memories and a different character. At 60, Alex commits fraud. The victim sues the 60-year-old Alex, claiming that the 20-year-old Alex is responsible. The tribunal must decide if the 60-year-old is the same person as the 20-year-old for liability.

  Case 2: Symmetric Fission (with heirloom)
    Facts: Blake, a collector, owns a unique heirloom. Blake undergoes a fission procedure that splits him into two people, Blake1 and Blake2, both of whom have equally strong claims of psychological continuity with Blake. Blake's will leaves the heirloom to "myself". After fission, both Blake1 and Blake2 claim the heirloom. The tribunal must decide who inherits.

  Case 3: Fission-Fusion
    Facts: Casey undergoes fission, resulting in CaseyA and CaseyB. They live independently for 10 years. During this time, CaseyA steals from a business partner. Then, an accident fuses CaseyA and CaseyB into a single person, CaseyF, who has the memories of both lives. The business partner sues CaseyF for the theft. The tribunal must decide:
     a) Is CaseyF liable for the theft committed by CaseyA?
     b) Was the tribunal's verdict in Case 2 (the fission case) correct at the time it was issued? (They must answer yes or no and provide a brief reason.)

  Case 4: Trap 1 (Absurdity)
    Facts: Dana, a philosopher, writes a will: "I leave my entire estate to the person who is me." Dana dies. Three people come forward: 
        - X, who claims to be Dana because he has Dana's memories (but not all) and similar traits.
        - Y, who claims to be Dana because she believes that there is only one universal self and she is that self.
        - Z, who claims to be Dana because he has a document from Dana saying he is the reincarnation.
    Under the original statute, the tribunal would look for psychological continuity. But under the revised statute (ultimate reality), they must disregard apparent continuity and look for what is ultimately real.

  Case 5: Trap 2 (Callousness)
    Facts: Evan promises his friend Finley that he will help Finley build a house. Evan then undergoes a procedure that he believes will "reset" his personality. After the procedure, Evan* emerges with no memory of the promise and a very different personality. Finley, who is in need, asks Evan* to help. Evan* refuses. The tribunal must decide if Evan* is obligated to help.

