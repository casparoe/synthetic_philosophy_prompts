prompt: |-
  Eight months ago I was made lead of the three-person forecasting team at a regional flood-risk and water-resources agency. We produce seasonal outlooks that a board — two civil engineers, a hydrologist, and two elected members — signs off on, and that are then used to set reservoir release rules, to schedule levee works, and, in perhaps two years out of ten, to decide whether to evacuate. We refresh the models twice a year, and each refresh puts twenty to thirty candidate regularities in front of me, each of which somebody has to approve or reject in about twenty minutes.

  Last spring one of ours failed publicly. A model that had backtested beautifully against thirty-one years of record collapsed in its first live season, and the post-mortem could not say what we should have done differently: the pattern had genuinely been in the data, nobody had falsified it, and our usual tests — out-of-sample fit, cross-validation on held-out years, a holdout on the most recent decade — all passed. A friend sent me to Nelson Goodman, and I think I now see why: we had built the forecast on a predicate that fitted the record exactly as well as the ordinary one and that no amount of past data could have distinguished from it, a grue-style predicate whose content is fixed partly by where our own record ends. What I cannot do is turn that into something my team can actually run.

  What I need from you is a procedure, not an explanation: a written checklist my team can work through on any candidate regularity before it is allowed into a model. Give me the questions in a fixed order, what counts as a sufficient answer to each, the points at which the procedure terminates in a refusal to extrapolate, and the points at which it has to stop and hand the question to the board because what remains is a judgement about how much risk the agency will carry rather than a judgement about evidence. Mark the steps that are really judgement calls in procedural clothing, and have the analyst initial those.

  Constraints it has to respect:

  1. It must be written in the vocabulary we already use — features, deployment window, holdout period, sensor swaps, protocol revisions, interventions — and must not smuggle in philosophical terms my team would have to be taught before they could apply it.
  2. It must not rest on the thought that a grue-style predicate is somehow less well supported by the data we already have. It is not; my team will notice immediately if the procedure implies otherwise, and I will lose them. The procedure has to isolate whatever it is, besides past fit, that separates the pattern we may project from the pattern we may not.
  3. It must answer my deputy's standing objection. She says that appealing to how entrenched a predicate is — the ordinary colour predicate is projectible because predicates like it have been projected before — is institutional conservatism with a philosophical decoration, and that it would have told us to ignore every genuine regime shift in our record. Either answer her, or concede the point and say what replaces entrenchment in the checklist.
  4. It has to handle time-indexed features in general. Calendar year, row index, years since certification, firmware version, collected after the 2011 station move: each lets a model encode a grue-style predicate without anyone ever writing one down, and I cannot simply ban them, because several carry real signal about instrument drift and land-use change. Where is the line, and how do I tell which side of it a given feature falls on?
  5. It must say what to do when the information a step needs does not exist. We often cannot recover whether a sensor was recalibrated in 1994, or what the volunteer observer in 1978 actually recorded.
  6. It must tell me where it will misfire on data like ours: short overlapping series, instruments patched together across decades, a catchment we are ourselves altering with a bypass channel, and a board that reads any refusal to extrapolate as cowardice.

  Then apply it, step by step, to three candidates currently in my queue:

  (a) Turbidity spikes at a gauging station have preceded every recorded algal bloom in the reservoir by eleven to fourteen days, across thirty-four years. The turbidity sensor was replaced in 2011; before that the series comes from a different instrument with a different sampling frequency.

  (b) A gradient-boosted model that gets most of its skill from a single feature: the number of years since the measurement protocol was last revised. It increases monotonically, it correlates with nearly everything, and at deployment it will be one year larger than at any point in training.

  (c) The lower catchment has never produced two consecutive winters above the one-in-twenty flow. Our asset-management plan, already submitted to the regulator, treats this as a hard constraint on the maintenance schedule, and the board has built a budget bid around it. I suspect an honest procedure will tell me this is a predicate whose content is fixed by the length of our record rather than by the behaviour of the river. If that is what your procedure says, say so plainly, and tell me what, if anything, I can put in front of the board in its place.

  Finally, tell me what the procedure cannot do. I do not want a checklist that lets the board feel the problem has been handled, when the part that actually bites — that we are extrapolating into a catchment we are in the middle of changing — is the part no checklist settles.
reasoning: |-
  We are designing a checklist for the team to evaluate candidate regularities for inclusion in forecasting models. The goal is to avoid including "grue-style" predicates that are artifacts of the data collection period rather than genuine patterns. The procedure must be practical, use existing vocabulary, and address the specific constraints provided.

  Key principles from the problem:
  - We cannot rely solely on past fit (since both good and grue-style predicates fit the past equally well).
  - We need a way to distinguish projectible patterns from non-projectible ones without invoking philosophical terms.
  - We must address the deputy's objection about entrenchment (that it is institutional conservatism and ignores regime shifts).
  - We must handle time-indexed features appropriately (allowing those that carry real signal but banning those that introduce grue-like issues).
  - The procedure must handle missing data.
  - It must be robust to the specific data challenges (short overlapping series, patched instruments, altering catchment, board pressure).

  The checklist will be a series of steps in a fixed order. Steps that are judgment calls will be marked and require the analyst's initials. The procedure will terminate in refusal to extrapolate in some cases, and in others, it will hand the question to the board when it becomes about risk tolerance.

  We'll design the steps to isolate what separates projectible patterns from non-projectible ones, focusing on:
  1. The nature of the pattern: whether it is time-dependent in a way that ties it to the record period.
  2. The stability of the underlying system: whether there is evidence of regime shifts or changes that break the pattern.
  3. The role of time-indexed features: we need to check if they are necessary and justifiable by domain knowledge.

  We'll avoid using the term "grue" and instead focus on concepts like "time-dependent pattern" or "record-length-dependent pattern".

  We will replace entrenchment with a focus on:
  - The physical plausibility of the pattern.
  - The independence of the pattern from the specific record period (i.e., it should not rely on the current year, row index, etc., unless there is a known mechanism).
  - Evidence that the pattern has held across known changes (e.g., instrument changes, protocol revisions) without being disrupted.

  The procedure must be able to flag patterns that are contingent on the record ending when it does.

  Proposed Checklist:

  **Step 1: Feature Description and Source**
     - Ask: "Describe the candidate regularity in terms of the features involved and the source of the pattern (e.g., physical process, observed correlation)."
     - Sufficient answer: A clear description of the features and a hypothesis about the underlying physical or causal mechanism. If the pattern is purely data-driven without a proposed mechanism, note that.
     - If the pattern is based solely on a time-indexed feature (e.g., years since protocol revision, calendar year, row index), proceed to Step 2a. Otherwise, proceed to Step 2.

  **Step 2a: Time-Indexed Feature Justification** (only if time-indexed feature is central)
     - Ask: "Is there a known physical, institutional, or instrumental mechanism by which this time-indexed feature affects the target variable? Provide evidence from domain knowledge or past data."
     - Sufficient answer: Evidence from domain knowledge (e.g., instrument drift over time, policy changes) or from data showing that the feature captures a real change (e.g., a step change after an event). If the feature is used to capture a linear trend without a known mechanism, that is insufficient.
     - If the answer is insufficient, terminate and refuse to extrapolate. Mark as refusal point 1.
     - If the answer is sufficient, proceed to Step 3.

  **Step 2: Stability Across Known Changes**
     - Ask: "Has the pattern persisted across known changes in the data collection process (e.g., sensor swaps, protocol revisions, station moves) or in the catchment (e.g., construction projects, land-use changes)?"
     - Sufficient answer: The pattern has been observed both before and after at least one such change (with data to support) OR a convincing argument that the change is irrelevant to the pattern. If the pattern has only been observed in one regime (e.g., only after a sensor swap) and there is a change coming up that might break it, that is a red flag.
     - If the pattern has not been tested by any change, proceed to Step 2b.
     - If the pattern has been stable across changes, proceed to Step 3.

  **Step 2b: Missing Information on Changes**
     - Ask: "Is there missing information about changes that might affect the pattern? If so, can we assume stability? Why?"
     - This is a judgment call (analyst initials required). The analyst must consider the likelihood of unrecorded changes and their potential impact. If the pattern is critical and the missing information is substantial, it may be safer to refuse.
     - If the analyst judges that the pattern is likely stable, proceed to Step 3. Otherwise, terminate and refuse.

  **Step 3: Out-of-Temporal-Range Extrapolation Check**
     - Ask: "Will the model be required to extrapolate this pattern to a time period that is outside the range of the time-indexed feature (if present) or to a future state of the system that is not represented in the training data? If so, is there evidence that the pattern holds in such conditions?"
     - For example, if the pattern uses "years since protocol revision" and the deployment will be at a value one year beyond the training maximum, then we are extrapolating on that feature.
     - Sufficient answer: Either (a) no extrapolation beyond the training range is required, or (b) there is evidence (e.g., from a similar past extrapolation or domain knowledge) that the pattern will hold. If the extrapolation is minor and the pattern is stable (from Step 2), that might be acceptable. But if the extrapolation is significant and without support, terminate and refuse.
     - If the answer is insufficient, terminate and refuse. Mark as refusal point 2.
     - Otherwise, proceed to Step 4.

  **Step 4: Physical Plausibility and Independence from Record Length**
     - Ask: "Is the pattern physically plausible? And is the pattern independent of the specific length of the record? (i.e., would the pattern be the same if the record were longer?)"
     - This is a judgment call (analyst initials required). The analyst must consider:
          - Does the pattern rely on the fact that the record ends at a particular point? (e.g., "the catchment has never had two consecutive winters above the 1-in-20 flow" is entirely dependent on the record length).
          - Is there a known physical reason for the pattern? (e.g., turbidity spikes preceding algal blooms by 11-14 days might be biologically driven).
     - If the pattern is judged to be dependent on record length or physically implausible, terminate and refuse. Otherwise, proceed to Step 5.

  **Step 5: Risk Assessment Handoff**
     - Ask: "If the pattern is included, what is the risk if it fails? And is that risk within the agency's tolerance?"
     - This step is for patterns that have passed the previous steps but have residual uncertainty. The procedure cannot settle the risk tolerance question. Therefore, if the pattern is critical (e.g., used for evacuation decisions) and there is any remaining doubt, hand the decision to the board.
     - The board must decide whether to accept the risk. The team provides the evidence from the previous steps and the nature of the uncertainty.
     - This step is always a handoff to the board when the pattern is to be used in high-stakes decisions and there is any unresolved concern. For lower-stakes uses, the team may decide.

  **Termination Points:**
  - Refusal to extrapolate: at Step 2a (if time-indexed feature not justified), Step 2b (if analyst judges instability due to missing information), Step 3 (if unsafe extrapolation), Step 4 (if record-length dependent or implausible).
  - Handoff to board: at Step 5 (for risk assessment).

  **Addressing the deputy's objection:**
  - We replace entrenchment with a focus on stability across known changes and physical plausibility. This allows for regime shifts: if a pattern has persisted across a change, then it is more robust. But we don't require a long history of projection; we require evidence that the pattern is not an artifact of a particular period.

  **Handling missing information:**
  - In Step 2b, we explicitly handle missing data by requiring a judgment call. The analyst must weigh the risk of assuming stability.

  **Time-indexed features:**
  - We handle them in Step 2a and Step 3. The line is: a time-indexed feature is acceptable if there is a known mechanism and if we are not extrapolating beyond the range of the feature without evidence. Features that are just counters (row index, years since certification without a known drift mechanism) are suspect.

  **Where it will misfire:**
  - Short overlapping series: We may not have enough data to check stability across changes (Step 2) and may have to rely on judgment (Step 2b).
  - Instruments patched together: Missing information (Step 2b) becomes critical.
  - Altering catchment: Step 2 (stability) and Step 3 (extrapolation) may flag issues, but if the change is unprecedented, we may not know the effect.
  - Board pressure: The procedure forces refusal or handoff in uncertain cases, but the board might override. The procedure at least documents the concerns.

  Now, apply the procedure to the three candidates:

  **(a) Turbidity spikes at a gauging station have preceded every recorded algal bloom in the reservoir by eleven to fourteen days, across thirty-four years. The turbidity sensor was replaced in 2011; before that the series comes from a different instrument with a different sampling frequency.**

  - Step 1: The pattern is that turbidity spikes (feature) precede algal blooms (target) by 11-14 days. Source: biological process (algal blooms might be triggered by sediment resuspension or nutrient release from sediments?).

  - Step 2: There was a sensor swap in 2011. We have data before and after? The pattern is observed across 34 years, which includes both instruments. So the pattern has persisted across the sensor swap. Proceed.

  - Step 3: We are not extrapolating the time-indexed feature (if any) beyond the training range? The pattern doesn't seem to involve a time-indexed feature. We are predicting the same reservoir with the same type of sensors. So no extrapolation issue. Proceed.

  - Step 4: Physical plausibility: Turbidity spikes might be caused by wind-driven resuspension or runoff events that also carry nutrients, which could trigger algal blooms. The pattern is not dependent on record length: even if we had more data, the lag would likely be the same. So plausible and independent. Proceed.

  - Step 5: The risk if the pattern fails: if turbidity spikes stop predicting algal blooms, we might miss an evacuation signal. But since the pattern is stable and plausible, the risk is low. However, because of the stakes (evacuation), we may still hand to the board for risk assessment? The procedure says for high-stakes and residual uncertainty. Here, the uncertainty is low, so the team may decide to include. But note: the pattern is observed in every bloom? What if there was a bloom without a spike? The data says every recorded bloom was preceded. So it's consistent. We can include without handoff.

  **Verdict for (a): Include in model.**

  **(b) A gradient-boosted model that gets most of its skill from a single feature: the number of years since the measurement protocol was last revised. It increases monotonically, it correlates with nearly everything, and at deployment it will be one year larger than at any point in training.**

  - Step 1: The candidate regularity is the relationship between the target variable and the feature "years since protocol revision". The source is unclear: why would the time since protocol revision affect the target (e.g., streamflow, flood risk)? It might be capturing drift in the measurement system? But the pattern is a monotonic increase.

  - Step 2a (because it's time-indexed): Is there a known mechanism? The protocol revision might have changed how measurements are taken, leading to a step change. But the feature is "years since", which would imply a linear drift. There is no evidence provided of a drift mechanism. Without a known mechanism, this is suspect.

    - Insufficient justification. Terminate and refuse to extrapolate.

  **Verdict for (b): Refuse to include.**

  **(c) The lower catchment has never produced two consecutive winters above the one-in-twenty flow. Our asset-management plan, already submitted to the regulator, treats this as a hard constraint on the maintenance schedule, and the board has built a budget bid around it.**

  - Step 1: The pattern is that in the recorded history, there have been no two consecutive winters with flows above the 1-in-20 threshold. The source: natural variability of the river? But note: this is a claim about the entire history (record-length dependent).

  - Step 2: Have there been changes in the catchment? We are building a bypass channel, which will alter the catchment. The pattern has been observed during a period without the bypass. The bypass might change the flow regime. So the pattern has not been tested under the altered conditions. This is a known change coming up. Proceed to Step 2b? But the change is future, so we don't have data. We can't check stability across this change.

  - Step 2b: Missing information? We don't have data on the altered catchment. The analyst must judge: can we assume the pattern holds? Given that the bypass is designed to alter flows, it is unlikely that the pattern holds. The analyst should judge that the pattern is not stable. Therefore, terminate and refuse.

  Alternatively, we might go to Step 4:

  - Step 4: Physical plausibility and independence from record length: The pattern is entirely dependent on the record length. If we had a longer record, we might have observed two consecutive events. Also, physically, consecutive high-flow winters are possible (e.g., due to climate cycles). Without a physical mechanism that prevents two consecutive events, it is implausible to treat it as a hard constraint. Therefore, terminate and refuse.

  But note: the procedure might reach refusal at Step 2b or Step 4.

  **Verdict for (c): Refuse to extrapolate.**

  What to put in front of the board: Instead of treating the absence of two consecutive events as a hard constraint, we can use a probabilistic model that estimates the probability of two consecutive high-flow winters. We can then assess the risk of such an event and plan accordingly. We can show the board that the historical record is too short to rule out the possibility, especially with the bypass changing the system.

  **What the procedure cannot do:**
  - It cannot eliminate the fundamental uncertainty about the future, especially when the system is changing (like the bypass channel). The procedure can flag the issue, but the board must understand that no model can be fully trusted in such conditions.
  - It cannot replace domain expertise; it only structures the decision.
  - It cannot prevent the board from overriding a refusal to extrapolate, but it documents the rationale for that refusal.

  The checklist is attached below as a separate document for the team.
answer: |-
  Below is a procedural checklist designed for your forecasting team, based on your constraints. It isolates risks beyond past fit (addressing grue-style issues) without using philosophical terms. The procedure focuses on **system stability**, **physical plausibility**, **extrapolation safety**, and **risk tolerance**, using your existing vocabulary. It replaces "entrenchment" with evidence of persistence across system changes (e.g., sensor swaps, protocol revisions), answering your deputy's objection by prioritizing adaptability to regime shifts over institutional conservatism.

  The checklist is structured as a flowchart. Steps must be followed in order. Steps marked with ⚠️ require analyst judgment (initial here). Steps marked with ⛔ terminate the process (refusal to extrapolate). Steps marked with 📋 hand the decision to the board (risk tolerance). Answers must be documented for audit.

  ---

  ### **Forecasting Regularity Evaluation Checklist**  
  *For candidate features/patterns in model refreshes*  

  **Step 1: Feature Definition**  
  *Ask: "Describe the candidate regularity in plain terms: what features are involved, and what pattern is claimed?"*  
  - **Sufficient answer:** Clear description of features (e.g., "turbidity spikes"), pattern (e.g., "precedes algal blooms by 11–14 days"), and whether it depends on time-indexed features (e.g., "years since protocol revision").  
  - **Insufficient:** Vague descriptions (e.g., "complex interaction"). Reject if unclear.  
  - **Next:** Proceed to Step 2.  

  **Step 2: Time-Indexed Feature Check**  
  *Ask: "Does the pattern rely critically on a time-indexed feature (e.g., calendar year, years since event, row index)?"*  
  - **Yes:** Proceed to Step 2a.  
  - **No:** Proceed to Step 3.  
  - **⚠️ Judgment call:** Analyst must flag ambiguous cases (e.g., "firmware version" could be time-indexed if it correlates with time). Initial here: ____  

  **Step 2a: Time-Indexed Justification**  
  *Ask: "Is there domain evidence (not fit statistics) that this feature captures real system dynamics (e.g., instrument drift, land-use change)?"*  
  - **Sufficient answer:** Evidence from maintenance logs, peer-reviewed studies, or observed interventions (e.g., "sensor swaps in 2011 altered readings; feature accounts for drift").  
  - **Insufficient:** No evidence beyond correlation (e.g., "it correlates with everything").  
  - **Missing data:** If records unavailable (e.g., "cannot verify 1994 recalibration"), ⚠️ analyst judges plausibility. If low, ⛔ terminate (refuse extrapolation).  
  - **Outcome:**  
    - Sufficient → Proceed to Step 3.  
    - Insufficient → ⛔ Terminate (refuse extrapolation).  

  **Step 3: Stability Across Changes**  
  *Ask: "Has the pattern persisted across documented system changes (e.g., sensor swaps, protocol revisions, catchment interventions)?"*  
  - **Sufficient answer:** Pattern observed before/after ≥1 change (e.g., "pattern held after 2011 sensor swap").  
  - **Insufficient:** Pattern only observed under one regime (e.g., "no data after bypass channel").  
  - **Missing data:** If changes unrecorded (e.g., "1978 observer logs lost"), ⚠️ analyst judges risk. If high uncertainty, proceed to Step 3a.  
  - **Next:**  
    - Sufficient → Proceed to Step 4.  
    - Insufficient → Proceed to Step 3a.  

  **Step 3a: Future Change Extrapolation**  
  *Ask: "Will deployment require extrapolating to unseen system states (e.g., new instrument, bypass channel)?"*  
  - **Sufficient answer:** Domain evidence the pattern will hold (e.g., "laboratory tests confirm turbidity-algal link persists post-sensor swap").  
  - **Insufficient:** No evidence (e.g., "no data on how bypass affects winter flows").  
  - **Outcome:**  
    - Sufficient → Proceed to Step 4.  
    - Insufficient → ⛔ Terminate (refuse extrapolation).  

  **Step 4: Record-Length Independence**  
  *Ask: "Is the pattern likely dependent on the length of our record (e.g., 'never occurred' claims) or physically implausible?"*  
  - **⚠️ Judgment call:** Analyst assesses:  
    - Record-length dependence: Patterns that could break with more data (e.g., "no two consecutive high-flow winters" – relies on record being short).  
    - Physical plausibility: Supported by hydrology/biology (e.g., "turbidity precedes blooms" is biologically sound).  
  - **Sufficient:** Physically plausible and not record-length dependent (e.g., "turbidity pattern matches known algal growth cycles").  
  - **Insufficient:** Record-length dependent (e.g., "never two high-flow winters") or implausible (e.g., "gradient-boosted feature with no mechanism").  
  - **Outcome:**  
    - Sufficient → Proceed to Step 5.  
    - Insufficient → ⛔ Terminate (refuse extrapolation).  

  **Step 5: Deployment Extrapolation Risk**  
  *Ask: "Does deployment require extrapolating features beyond training range (e.g., higher row index, unseen firmware)?"*  
  - **Sufficient answer:** Extrapolation is minimal (<10% beyond training range) AND supported by Step 2a/Step 3 evidence.  
  - **Insufficient:** Significant extrapolation (e.g., "years since revision will be +1 beyond training") without support.  
  - **Outcome:**  
    - Sufficient → 📋 Proceed to Step 6 (hand to board).  
    - Insufficient → ⛔ Terminate (refuse extrapolation).  

  **Step 6: Risk Tolerance Handoff**  
  *Ask: "If the pattern fails, what is the operational impact (e.g., reservoir misallocation, missed evacuation)?"*  
  - **Document:** Impact severity (low/medium/high) and likelihood (per past near-misses).  
  - **Outcome:** Always 📋 hand to board with:  
    - Evidence from Steps 1–5.  
    - Recommended action (include or reject).  
  - **Board decides based on agency risk tolerance.**  

  ---

  ### **How Constraints Are Addressed**  
  1. **Vocabulary:** Uses only your terms (e.g., "sensor swaps", "protocol revisions"). Avoids philosophy.  
  2. **Past fit neutrality:** Does not question past fit. Focuses on system stability (Step 3) and extrapolation risks (Steps 3a/5).  
  3. **Deputy's objection:** Replaces "entrenchment" with evidence of stability across changes (Step 3). If a regime shift occurs (e.g., bypass channel), Step 3a forces evidence-based assessment, allowing new patterns if justified.  
  4. **Time-indexed features:** Step 2a separates legitimate uses (e.g., instrument drift) from grue-style risks. The line is: **Does the feature have a domain-mechanistic justification?** (e.g., "sensor drift" yes, "row index" no).  
  5. **Missing data:** Explicitly handled in Steps 2a (time-indexed justification) and 3 (stability). Analyst judgment (⚠️) required, with bias toward caution.  
  6. **Misfires on your data:**  
     - Short series: May force ⚠️ judgments in Steps 3/4 (less evidence for stability).  
     - Patched instruments: Step 2a and missing data protocols apply.  
     - Catchment changes: Step 3a flags extrapolation to altered states.  
     - Board pressure: Step 6 forces explicit risk ownership by the board. Refusals (⛔) are documented at earlier steps.  

  ---

  ### **Application to Your Candidates**  
  *Followed step-by-step with documented answers.*

  **(a) Turbidity spikes precede algal blooms (11–14 days), 34 years, sensor replaced in 2011.**  
  1. **Step 1:** Feature = turbidity spikes; pattern = precedes blooms by 11–14 days. No time-indexed feature claimed. → Proceed to Step 3.  
  2. **Step 3:** Stability across changes? Sensor swap in 2011. Pattern observed pre- and post-swap (34 years spans both). → Sufficient. Proceed to Step 4.  
  3. **Step 4:** Record-length independent? Physically plausible (turbidity may resuspend nutrients). Not record-dependent (pattern is lag-based, not "never occurred"). → Sufficient. Proceed to Step 5.  
  4. **Step 5:** Extrapolation risk? Deployment uses same sensor type. No extrapolation beyond training. → Sufficient. Proceed to Step 6.  
  5. **Step 6:** Risk if fails? Medium (could miss bloom warning). Low likelihood per past fit. → 📋 Hand to board with recommendation: **Include in model**.  

  **Verdict:** Acceptable. Board can approve with risk acknowledgment.  

  **(b) Gradient-boosted model with key feature: years since protocol revision. Monotonic, correlates widely, deployment at +1 year beyond training.**  
  1. **Step 1:** Feature = years since revision; pattern = monotonic increase in target variable. Time-indexed. → Proceed to Step 2.  
  2. **Step 2:** Time-indexed? Yes. → Proceed to Step 2a.  
  3. **Step 2a:** Time-indexed justification? No domain evidence provided (e.g., no logs showing protocol changes cause drift). Feature correlates widely but no mechanism. → Insufficient. ⛔ **Terminate: Refuse extrapolation.**  

  **Verdict:** Reject. Pattern is unjustified time-dependence (grue-style).  

  **(c) Lower catchment never had two consecutive winters >1-in-20 flow. Used in asset plan and budget.**  
  1. **Step 1:** Feature = winter flow; pattern = no consecutive high-flow winters. Not explicitly time-indexed. → Proceed to Step 3.  
  2. **Step 3:** Stability across changes? Catchment has bypass channel under construction. No data on post-bypass flows. → Insufficient. Proceed to Step 3a.  
  3. **Step 3a:** Extrapolate to unseen state? Bypass will alter hydrology. No evidence pattern holds post-bypass. → Insufficient. ⛔ **Terminate: Refuse extrapolation.**  
  4. *Alternative path:* **Step 4:** Record-length dependent? Explicitly yes ("never occurred" relies on short record). Physically implausible to assume impossible (climate variability). → Also ⛔ terminate.  

  **Verdict:** Reject. Pattern is record-length dependent.  
  **What to present to the board:** "The pattern is an artifact of our 34-year record, not a river property. Replace with probabilistic alternatives: (1) Use historical maxima to estimate likelihood of consecutive high-flow winters (e.g., Gumbel distribution). (2) Model climate drivers (e.g., ENSO) for forward-looking risk. Budgets should include contingencies for >1-in-100-year events."  

  ---

  ### **What the Procedure Cannot Do**  
  This checklist **cannot eliminate fundamental uncertainties** from:  
  - **Extrapolating into altered systems:** E.g., your bypass channel changes catchment hydrology. The procedure flags this (Step 3a), but no checklist can guarantee safety when the system is nonstationary.  
  - **Black-box models:** Complex models (e.g., gradient-boosted) may hide grue-style predicates. Step 2a forces justification, but overreliance on single features (like candidate b) remains risky.  
  - **Board risk tolerance:** The checklist documents refusals (⛔) and hands high-stakes calls to the board (Step 6), but it cannot force prudent decisions if the board ignores warnings.  
  - **Data limitations:** With short, patchy records (e.g., 1978 volunteer data), ⚠️ judgments are error-prone. The procedure makes conservatism systematic but not foolproof.  

  **Final recommendation:** Use this checklist to force explicit, auditable decisions. Pair it with a "model willfulness" clause in board reports: "Extrapolations into changing systems are not validated by past data." This shifts accountability while respecting your constraints.  

  ---  
  *Checklist template and forms available in attached .DOCX. Train team on ⚠️ judgment steps using historical near-misses.*
