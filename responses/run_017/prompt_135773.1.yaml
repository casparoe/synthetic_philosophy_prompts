  Two more things. First, I'd rather have calibrated than confident: tell me roughly how sure you are about each bit, flag where you're reconstructing rather than reporting, and say plainly if a real card-carrying Dennettian would balk at any of it, since I want the scene to survive a knowledgable reader. Second, and more important: if I've got the setup wrong — if the two-bitser doesn't do the thing I think it does, or if "original rather than derived" is just not the conclusion that argument is in the business of delivering — say that straight out instead of politely helping me write a better version of a confused speech. I'd much rather hear "your premise is busted, here's the actual shape of the disagreement" than get a nicely worded monologue for a scene that's built on a mistake.
