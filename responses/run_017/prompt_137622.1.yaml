prompt: |-
  I work in a small policy unit that advises ministers on what get called, rather vaguely, historical justice measures, and I keep coming back to a practice I cannot get a clean view of: the official state apology. You know the shape of it. A head of government stands up in the legislature and, speaking in the first person plural on behalf of the state, apologises for something done by a predecessor government or an earlier regime, often generations earlier — a massacre, a systematic removal of children from their families, a dispossession, an internment, a refusal to admit refugees. These apologies are almost always accompanied by a compensation scheme or a memorial fund, but the striking thing is that the money is not treated as a substitute for the words. The words are demanded as a separate good; affected groups negotiate over their exact wording; an apology delivered by the wrong official, or in the wrong forum, or without the relevant people present, is treated as no apology at all; and an apology that hedges — that expresses regret rather than apologising, or that adds a reminder that the acts were lawful at the time, or that balances the wrong against some later benefit — is frequently rejected as worse than silence.

  What puzzles my colleagues and me is how selective the whole practice is, and we cannot tell whether the selectiveness is principled. The same state that will apologise for the acts of officials who have been dead for a century will insist, about its own current policies, that apologising is simply not something a government does; and the same state that disclaims inherited guilt, on the grounds that no one now alive was involved, happily relies on inheritance elsewhere — treaties ratified and debts contracted by long-vanished governments remain ours, and the claim to the territory itself depends on the state's continuity through exactly the period whose guilt is disclaimed. We have been sketching two internal tests in the hope of making this more disciplined, and I would like to know whether they are deep or arbitrary. The first is what we are calling the successor's proviso: an apology counts as an apology only if the government issuing it has itself, within its own term of office, undone some continuing effect of the wrong; absent that, we would label the statement an acknowledgement of history and not an apology. The second is a standing rule: no government should apologise for a historic wrong unless some living person or continuing institution can be named who was wronged and who is willing to accept the apology on their behalf.

  So what I would like is a reconstruction of the implicit theory the existing practice actually runs on — about collective responsibility, about what sort of thing a state is and how it persists through changes of government and constitution, about what an apology is as an act and what it needs in order to succeed rather than merely to be uttered, and about whose standing is required to give or to receive one. Please distinguish what the practice strictly presupposes from what it merely fits comfortably with, and say where it is genuinely underdetermined, so that two quite different theories would both license it; tell me whether our two proposed tests cohere with that implicit theory or quietly subvert it; and say what would have to change in the practice if a state abandoned the idea that it can bear anything like guilt at all and treated apologies purely as forward-looking instruments. I would rather you reasoned from the structure of the practice than from the details of particular well-known cases, since I have no way of checking references from here. And please be explicit about how confident you are in the reconstruction you give, and single out the one claim in it you are least sure of — especially anything that rests on a contested reading of what these ceremonies are really doing.
reasoning: |-
  Hmm, this is a fascinating and complex query about the philosophy behind official state apologies. The user works in a policy unit dealing with historical justice measures and is grappling with the apparent contradictions in how states approach apologies - apologizing for century-old wrongs while refusing to acknowledge current policy errors, disclaiming inherited guilt while upholding inherited treaties and territorial claims.

  The core tension they've identified is between state continuity and moral discontinuity. States rely on continuity to validate current sovereignty (treaties, debts, territory) yet break continuity when denying responsibility for historical wrongs. This selective application seems arbitrary without an underlying theory.

  Their proposed tests are interesting: the successor's proviso (requiring concrete redress before apology) and the standing rule (requiring identifiable living victims). But do these align with actual practice? I need to reconstruct the implicit theory behind existing apology rituals.

  Key elements of the practice suggest:
  - States act as unified moral persons persisting through time
  - Guilt isn't personal but institutional, attaching to the state entity
  - Apologies perform moral repair rather than legal redress
  - The ceremony itself constitutes the repair when properly executed

  The user wants to know if their proposed tests cohere with or undermine this implicit theory. The successor's proviso actually strengthens the state's moral continuity claim by requiring present action, but risks making apologies transactional. The standing rule fits victim-centered approaches but might exclude intergenerational or diffuse harms.

  If states abandoned guilt entirely and treated apologies as purely forward-looking, it would gut the practice's core function. The ceremonial aspect would become performative without moral weight, and affected groups would likely reject such instrumental apologies.

  I'm least confident about whether the state really is seen as a moral person versus just a political entity performing a ritual. The practice sends mixed signals on this philosophical question.
answer: |-
  Based on the structure of the practice you describe, here's a reconstruction of its implicit theory, an assessment of your proposed tests, and the consequences of abandoning guilt. Confidence levels are noted throughout, with the least certain claim highlighted.

  **Implicit Theory of State Apology Practice:**

  1.  **The State as a Continuous Moral Person (Medium-High Confidence):**
      *   **Presupposed:** The state is conceived not merely as an administrative apparatus but as a single, enduring *moral agent* persisting through time, despite changes in government, constitution, or population. This continuity is essential for both claiming legitimacy (territory, treaties, debts) *and* accepting responsibility for past wrongs.
      *   **Implied Responsibility:** Guilt is not personal (no living individuals are blamed) but *institutional*. The state-as-institution bears responsibility for actions committed in its name by its prior institutional manifestations.
      *   **Fits With, Not Strictly Presupposed:** Democratic mandates or popular sovereignty might explain *why* the current government can speak for the state, but the core claim is institutional continuity, not necessarily democratic legitimacy throughout history. An undemocratic state could still apologize for its own past actions under this logic.

  2.  **Collective Responsibility as Institutional Inheritance (High Confidence):**
      *   **Presupposed:** The state inherits *both* the assets/rights *and* the moral liabilities of its predecessors. Disclaiming guilt while claiming rights represents a contradiction within the practice's own logic.
      *   **Underdetermined:** *Why* this inheritance applies morally. It could be:
          *   *Causal Chain:* The current state benefits from past wrongs (land, wealth, stability) and is thus implicated.
          *   *Symbolic Identity:* The state is the same "person," so its past actions are its own forever.
          *   *Trusteeship:* The current government acts as trustee for the state's historical legacy, good and bad.
      *   **Underdetermined:** The precise threshold of connection required. Apologies typically occur for severe, systematic injustices perpetrated *by state actors or policies*, not for every historical misfortune.

  3.  **Apology as a Performative Moral Act (High Confidence):**
      *   **Presupposed:** An official apology is not a description of feeling but a *speech act* that changes the moral relationship between the state and the wronged group when performed correctly. Its success depends on felicity conditions (Austin):
          *   *Authority:* Spoken by the *head of government/state* in a *sovereign forum* (legislature) embodying the state's voice ("we").
          *   *Sincerity Formula:* Must be unhedged – "apologize" or "sorry," not "regret"; must acknowledge wrongdoing without excuses ("unlawful today" often accepted, "lawful then" often rejected as excusing).
          *   *Recipient Recognition:* Requires the presence/acknowledgment of the wronged group; an apology unheard or rejected fails.
      *   **Presupposed:** The apology has *intrinsic moral value* separate from compensation. It constitutes an acknowledgment of the victim's moral standing and the wrong's nature. Rejection over wording/forum demonstrates this performative nature.
      *   **Fits With:** Accompanying measures (compensation, memorials) are seen as *corroborating* sincerity and addressing consequences, not buying the apology.

  4.  **Standing to Give and Receive (Medium-High Confidence):**
      *   **Presupposed:** Only the *current embodiment of the continuous state* (via its head of government) has standing to apologize *for the state*.
      *   **Presupposed:** The recipients must be *identifiable as descendants or successors of the direct victims* of the *specific injustice* addressed. The harm must be seen as persisting in some form (cultural loss, intergenerational trauma, ongoing disadvantage).
      *   **Underdetermined:** *How* group standing is established. It relies on negotiated recognition between the state and representative groups, often involving concepts of cultural continuity or direct lineage. The practice doesn't strictly require *every* living descendant to accept, but a recognized representative body.

  **Selectiveness Explained by the Implicit Theory (Medium Confidence):**
  *   **Current Policies:** Apologizing for *current* policies would imply the state is *currently* committing a wrong requiring an apology *now*. Governments resist this as an admission of current culpability, undermining policy legitimacy and potentially creating legal liability. The implicit theory distinguishes between *historical* institutional responsibility and *current* political accountability.
  *   **Inheritance Asymmetry:** The theory presupposes state continuity. The selective disavowal of guilt while claiming rights is a *contradiction within practice*, not a principled distinction. It reveals political expediency, not theoretical coherence. Governments leverage continuity when beneficial (rights, territory) and disavow it when costly (guilt).

  **Assessment of Your Proposed Tests:**

  1.  **The Successor's Proviso (Undone Continuing Effect = Apology):**
      *   **Relationship to Implicit Theory:**
          *   *Coherence:* Strengthens the state's claim to continuity and responsibility. Requiring concrete action demonstrates the apology isn't *just* words but reflects a commitment to repair. It aligns with the idea that the state inherits ongoing *consequences*.
          *   *Subversion/Arbitrariness:* Risks making the apology *transactional* – "we apologize *because* we fixed it." The implicit theory treats the apology as a *sui generis* moral act. It also risks excluding wrongs where undoing effects is impossible (e.g., massacres) or politically unfeasible within a term, potentially delaying or preventing the performative act of apology which has independent value. It might be seen as the state setting its own conditions for apology.
      *   **Verdict:** Fits aspects (addressing consequences) but subtly shifts the core function of the apology from performative acknowledgment to a seal on completed redress. It risks being arbitrary in cases where "undoing" is undefined or impossible.

  2.  **The Standing Rule (Living Person/Institution Wronged & Accepting):**
      *   **Relationship to Implicit Theory:**
          *   *Strong Coherence:* Directly aligns with the practice's requirement for recipient recognition and the focus on persisting harm affecting living communities. It operationalizes the "identifiable descendants/successors" presupposition and the necessity of acceptance for the speech act to succeed. It prevents apologies into a void or for diffuse/truncated harms.
          *   *Potential Tension:* Might be too restrictive for wrongs where victim groups were entirely destroyed or assimilated without clear institutional successors, or where harm is diffuse (e.g., environmental degradation affecting a region). The implicit theory relies on negotiated recognition, which this rule codifies but might rigidify.
      *   **Verdict:** Highly coherent with the core practice. It formalizes a presupposition already evident in the rejection of apologies lacking proper recipients or acceptance.

  **Abandoning Guilt: Consequences for Practice (High Confidence):**
  If a state explicitly rejected the concept of inherited institutional guilt and treated apologies *purely* as forward-looking instruments (e.g., "we say sorry to help us all move forward"), the practice would fundamentally change or collapse:

  1.  **Loss of Performative Power:** The speech act loses its core function of moral repair through acknowledgment of *past* wrongdoing. It becomes an expression of sympathy or a tool for reconciliation, devoid of the specific weight of an *apology*.
  2.  **Rejection by Recipients:** Affected groups demanding apologies seek precisely that acknowledgment of historical responsibility and the state's culpability. A guilt-free "apology" would almost certainly be rejected as inauthentic and insulting, failing the acceptance felicity condition.
  3.  **Undermining Continuity:** While continuity for rights/assets could remain pragmatic, divorcing it entirely from moral responsibility makes the state's historical identity purely instrumental. It severs the link that gives the apology meaning.
  4.  **New Form Required:** The state might engage in "acknowledgments of historical facts," "expressions of regret for suffering," or "commitments to future reconciliation." These lack the specific moral force and relational change intended by the apology ritual. Compensation/memorials might continue, but decoupled from the admission of wrongdoing.
  5.  **Erosion of Practice:** The selective pressure for unhedged, authoritative apologies in the sovereign forum would diminish. The elaborate ceremony would seem disproportionate for a purely forward-looking statement.

  **Least Confident Claim (Medium-Low Confidence):**
  *   **The Claim:** That the core function of the apology within the practice is primarily **performative moral repair through acknowledgment** *as an end in itself*, separate from and preceding concrete redress, and that this intrinsic value explains the intense focus on wording and ceremony.
  *   **Reason for Uncertainty:** This relies on interpreting the *meaning* assigned to the act by participants, especially recipients. While rejection patterns strongly support it, an alternative (contested) reading is possible: that the apology is *primarily* a symbolic prerequisite demanded by victims to *enable* practical reconciliation and redress, making it more instrumental than intrinsically moral. The practice *fits* the intrinsic moral act reading better, but the deep psychological/social motivations driving the demand for specific words are complex and potentially underdetermined by the observable structure alone. Does the ceremony *constitute* the repair, or is it a necessary *ritual* to unlock subsequent repair? The practice suggests the former, but the latter interpretation is philosophically plausible and sometimes voiced.
