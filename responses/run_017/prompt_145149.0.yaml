prompt: |-
  Hey — I run a monthly ideas night at the library, fifteen-ish adults, no logic background at all, and I've got forty minutes next week on the idea that some things can't be settled by working harder inside the rules: you have to step outside and say something *about* the system. (JOOTSing, if you've read Hofstadter.) I'm not using his MIU puzzle, since two of the regulars have read the book and the answer's online anyway, so I made up my own:

  Start string AX. Rules: (1) if the string ends in X you may add an A; (2) you may double everything after the first letter; (3) you may replace any run of three X's with a single A. Question: can you reach AAA?

  I've checked that you can get as far as AAX, which is one character away and drives me nuts, and I'm definately of the opinion you can never arrive, but I don't want the proof — I want a plan for teaching the thing. What has to come first, and does the ten minutes of letting them flail at derivations actually earn their keep or should I cut it? Which single example or analogy should carry the whole session, and what does it have to have and not have? My co-host wants to just tell them "look for something that stays the same" in the first two minutes and save twenty — tell me what that costs. Then the misconceptions I should expect: I'm guessing "you just haven't searched hard enough, a computer could do it", "the letters must stand for something", and maybe "so the rules are broken / the puzzle's unfair" — give me the ones I've missed and say exactly where in the sequence each one gets killed. And what should I flat-out refuse to explain at this level and say out loud that I'm refusing?

  Finish with one question to end on that shows they got the move and not just the answer — ideally I tweak a rule and their proof should either survive or collapse — plus what a right and a wrong answer to it look like.

  Sections in this order, please: Order (about 250 words, numbered, with what depends on what), The carrying example (about 100), Misconception map (about 200, each one tagged with where in the sequence to defuse it), The check (about 100), What I leave out (about 60), Tell my co-host (about 60).
