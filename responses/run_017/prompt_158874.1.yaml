prompt: |-
  I am a novelist, and a long-form essay I read recently in a literary magazine — part of a series on "post-truth fiction" — summarised pragmatic encroachment and epistemic contextualism roughly as follows:

  "The two theories come to much the same thing: whether someone counts as knowing depends on how much is at stake. Contextualists hold that the word 'knows' shifts its meaning with the conversational context, so that raising the stakes raises the standard — a woman who knew the bank would be open on Saturday morning ceases to know once a missed payment will cost her the house. Pragmatic encroachment adds that the operative stakes are those of whoever is doing the attributing, which means knowledge is less a fact about the subject than a status we confer on people when their evidence is good enough for our purposes. The view has accordingly been refuted by its central objection — that it makes what a person knows depend on who happens to be talking about them — and few philosophers defend it any longer."

  I suspect this is unfair, and I am fairly confident about the "much the same thing" part, since I have seen the two views listed separately, but I cannot locate the rest. Could you go through the passage and tell me what a defender of each view would accept, what is a legitimate simplification for a general reader, and what is simply wrong or overstated — and, in particular, whether the essay's conclusion that the position has been refuted survives once the summary is corrected?

  The reason I care is that I wanted to press one of these views into service in the novel I am drafting. It is narrated in the first person by a woman recalling a death she may have caused, and at a crucial point she says of her sister, "she knew the letter was a forgery." I want the reader to feel that line turn false as the stakes for the sister inside the story rise, even though nothing whatever is at stake for the narrator or for the reader. I have been calling this "diegetic encroachment": the proposal that, in fiction, a knowledge attribution answers to the practical situation of the character it is about rather than to that of the speaker, the audience, or the author. Does anything in contextualism or pragmatic encroachment actually support that extension, is it a coherent thesis in its own right, or does it rest on a confusion that the corrected version of the theories exposes? Please write in British English.
reasoning: |-
  Okay, the user is a novelist who came across a summary of pragmatic encroachment and epistemic contextualism in an essay about "post-truth fiction." They suspect the summary is unfair, especially the claim that both theories are essentially the same and that pragmatic encroachment has been refuted. They want to use these ideas in their novel, where a character's knowledge attribution changes as the stakes rise for another character, calling it "diegetic encroachment." 

  First, I need to unpack the essay's summary. The key points are: 1) both theories make knowledge depend on stakes, 2) contextualism says "knows" shifts meaning with conversational context, 3) pragmatic encroachment ties knowledge to the attributor's stakes, making it a conferred status, and 4) pragmatic encroachment is refuted because knowledge depends on who's talking. 

  Hmm, the essay oversimplifies. Contextualism and pragmatic encroachment are distinct. Contextualism is about semantic context-sensitivity, while pragmatic encroachment claims stakes affect knowledge itself, not just the word "know." The refutation claim is overstated—pragmatic encroachment is still debated, not dead. 

  The novelist's "diegetic encroachment" idea is fascinating. They want knowledge attributions in fiction to respond to a character's stakes, not the narrator's or reader's. Does existing theory support this? Contextualism could stretch to cover it if we treat the fictional world as the context. Pragmatic encroachment would require adjusting whose stakes matter—usually the attributor's, but maybe the subject's in fiction. 

  I should clarify where the essay goes wrong: conflating the theories, misrepresenting pragmatic encroachment as universally rejected, and implying both always use attributor stakes. For the novel, "diegetic encroachment" is innovative but needs careful framing to avoid confusion with real-world theories. It's coherent if presented as a fictional device. 

  The user might also worry about philosophical accuracy versus narrative needs. Reassuring them that their concept works as a literary extension, not a direct application. Highlighting how their example—"she knew the letter was a forgery" becoming false as stakes rise—aligns with core ideas of stakes affecting knowledge, even if tweaked for fiction. 

  British English check: using "defence," "centre," "realise," etc. Keeping tone scholarly but accessible for a creative writer. Prioritising clarity on why the essay's summary is flawed and how the novel's idea can stand independently.
answer: |-
  A sharp critique – your suspicions about that essay summary are spot on. Let's dissect it piece by piece, clarifying the theories and assessing the essay's claims, before turning to your intriguing "diegetic encroachment" idea. I'll use British English throughout.

  ### Deconstructing the Essay's Summary

  1.  **"The two theories come to much the same thing..."**
      *   **What's Accepted:** Both theories agree that whether an attribution like "S knows that p" seems true or appropriate *can* depend on practical stakes. High stakes often mean we demand more evidence or certainty before attributing knowledge.
      *   **Legitimate Simplification:** For a general reader, saying both link knowledge attributions to practical context/stakes is fair enough.
      *   **What's Wrong/Overstated:** They are *fundamentally different* theories solving different problems. Contextualism is primarily a *semantic* theory about the *word* "knows", explaining why knowledge *attributions* seem true in low-stakes contexts and false in high-stakes ones. Pragmatic Encroachment (PE) is an *epistemic* theory claiming that practical stakes genuinely affect the *fact* of whether someone *possesses* knowledge, not just how we talk about it. They are rivals, not twins.

  2.  **"...whether someone counts as knowing depends on how much is at stake."**
      *   **What's Accepted:** Both theories endorse this *in some form*.
      *   **Legitimate Simplification:** This captures the core shared *motivation* – explaining the intuitive link between stakes and knowledge attributions.
      *   **What's Wrong/Overstated:** Contextualism says whether "counts as knowing" is context-sensitive – it *literally* means something stricter in high-stakes contexts. PE says the *knowledge itself* is harder to come by (or easier to lose) when stakes are high – it's not just about counting.

  3.  **"Contextualists hold that the word 'knows' shifts its meaning with the conversational context..."**
      *   **What's Accepted:** This is a standard and largely accurate description of epistemic contextualism. The "conversational context" typically includes the purposes, presuppositions, and salient alternatives of the *speakers* (the attributors).
      *   **Legitimate Simplification:** Yes, for a general reader.
      *   **What's Wrong/Overstated:** The bank example is classic (DeRose), so that's fine. Crucially, the relevant stakes are usually those salient in the *conversation where the attribution is made* (often the attributor's context).

  4.  **"Pragmatic encroachment adds that the operative stakes are those of whoever is doing the attributing..."**
      *   **What's Accepted:** This correctly identifies that for most PE theorists (like Fantl & McGrath or Stanley), the stakes that matter are typically those *facing the subject* (S), *not* primarily the attributor (A). The essay gets this **exactly backwards**. PE argues that the *subject's* practical situation affects whether their belief constitutes knowledge *for them*. If *S* faces high stakes regarding p, *S* needs stronger evidence to *know* p, regardless of who is talking about it later.
      *   **Legitimate Simplification:** Simplifying to "stakes affect knowledge itself" is okay, but specifying *whose* stakes is crucial.
      *   **What's Wrong/Overstated:** The essay's claim that PE makes the operative stakes those of the *attributor* is a **significant misrepresentation**. This conflation with contextualism is a key error. While *some* PE variants might be complex, the standard view focuses on the *subject's* stakes.

  5.  **"...which means knowledge is less a fact about the subject than a status we confer on people when their evidence is good enough for our purposes."**
      *   **What's Accepted:** Contextualists *might* accept a version of this – the truth of "S knows p" *is* relative to the attributor's context and purposes. PE theorists would **strongly reject this**. For PE, knowledge *is* a fact about the subject (S's evidence, S's stakes, S's relation to the truth of p). They deny it's merely a status conferred by attributors for their purposes; it's a genuine, stake-sensitive epistemic state of the subject.
      *   **Legitimate Simplification:** None. This mischaracterises PE and blurs the key distinction.
      *   **What's Wrong/Overstated:** See above. This description fits a crude form of contextualism but is antithetical to PE's core claim that knowledge itself is stake-sensitive.

  6.  **"The view has accordingly been refuted by its central objection — that it makes what a person knows depend on who happens to be talking about them — and few philosophers defend it any longer."**
      *   **What's Accepted:** The objection described ("makes what a person knows depend on who is talking") *is* a common objection, but it's primarily aimed at **Contextualism** (the "semantic ascent" or "strange denials" problem). It's less directly applicable to standard PE, which ties knowledge to the *subject's* situation.
      *   **Legitimate Simplification:** Highlighting that the dependence on the *attributor* is controversial is fair.
      *   **What's Wrong/Overstated:** This is **highly misleading**.
          *   **Refuted?** Neither theory is generally considered "refuted." Both remain active areas of research and debate. While they face significant objections, they also have sophisticated defences. Declaring PE (or contextualism) dead is simply incorrect.
          *   **Which View?** The objection described ("depends on who is talking") is a major problem *for contextualism*, not PE. Applying it as the "central objection" to PE specifically is mistaken, given that PE typically grounds knowledge in the *subject's* stakes. PE faces other objections (e.g., whether stakes *really* affect justification/knowledge itself, or just actionability; worries about "pragmatic purism").
          *   "Few philosophers defend it"? This is an overstatement. While contextualism's popularity might have waned slightly compared to its peak, and PE faces challenges, both have prominent defenders publishing new work. PE, in particular, remains a significant position.

  ### Corrected Summary

  *   **Epistemic Contextualism:** The word "knows" is context-sensitive. Its meaning (the standard required for truth) shifts depending on the practical context (stakes, salient alternatives) of the *conversation where the knowledge attribution is made* (typically the attributor's context). In high-stakes contexts, "knows" demands more than in low-stakes contexts. This explains why attributions seem true in low stakes and false in high stakes – the word itself means something stricter when stakes are high. It's primarily a theory about language and attribution.
  *   **Pragmatic Encroachment (Standard View):** Whether a subject (S) genuinely *possesses* knowledge that p depends not only on S's evidence, reliability, etc., but *also* on the practical stakes facing *S* regarding p. If it's very important for S that p is true (high stakes), S needs stronger evidence (or a higher degree of justification) to count as *knowing* p than they would need if the stakes were low. Knowledge itself is stake-sensitive, grounded in the *subject's* situation. It's primarily a theory about the nature of knowledge/justification.

  ### Your "Diegetic Encroachment" and the Novel

  Your idea is fascinating and coherent as a distinct literary device, though it doesn't map perfectly onto either standard philosophical theory. Let's analyse it:

  1.  **The Proposal:** In fiction, the truth of a knowledge attribution within the narrative ("she knew the letter was a forgery") depends primarily on the practical stakes facing the *character* it is about (the sister), *not* the narrator, reader, or author.
  2.  **Relation to Contextualism:**
      *   **Conflict:** Standard contextualism ties "knows" to the *speaker's* (narrator's) context. Your narrator is recalling events; their current stakes (as narrator) or the reader's stakes should, according to contextualism, set the standard for their *use* of "knows". If nothing is at stake for the narrator *now*, contextualism suggests "knows" should have a relatively low standard, making the attribution true even if the sister faced high stakes *then*.
      *   **Potential Support?** You *could* stretch contextualism by arguing the narrator is attempting to faithfully represent the *sister's epistemic situation at the time*. The narrator might be adopting the sister's *past* practical context as the relevant conversational context for the attribution. This is a non-standard but conceivable move – framing the narrative as attempting to report knowledge relative to the *subject's historical context*. It leans towards making the fictional world's context primary.
  3.  **Relation to Pragmatic Encroachment:**
      *   **Stronger Resonance:** PE directly links the *fact* of knowledge to the *subject's* stakes. If the sister faced high personal stakes regarding the letter's authenticity *at the relevant time*, then according to PE, she might *not* have known it was a forgery, even if her evidence seemed sufficient in a low-stakes scenario. This fits perfectly with the idea that the *character's* situation determines the knowledge fact.
      *   **The Narration Issue:** The *attribution* "she knew" is still made by the narrator. Standard PE says the sister either knew (relative to her stakes) or didn't at the time. The narrator's statement should report *that fact*. So, if the sister didn't know due to high stakes, the narrator's statement "she knew" would simply be *false*. The *feeling* of it "turning false" for the reader arises as the reader learns more about the sister's *past* stakes and realises the narrator's past-tense claim is incorrect *because* of PE (the sister's high stakes meant she lacked knowledge).
  4.  **Coherence of "Diegetic Encroachment":**
      *   **As a Literary Device:** It's coherent and powerful. You're proposing that within the fictional world, the *truth conditions* for knowledge attributions are set by the practical context of the *character-subject* at the time the knowledge is relevant. This prioritises the *diegesis* (the story world) over the narration or reader's context.
      *   **Philosophical Novelty:** It doesn't neatly align with standard contextualism (attributor-focused) or PE (subject-focused *fact*, but the attribution is still made *now* by the narrator). It's closer to a *diegetic application of PE*: within the fiction, the fact of a character's knowledge depends on *their* stakes. The narrator is reporting *that diegetic fact*.
      *   **Not Exposed as Confusion:** The corrected theories don't undermine it; they help clarify its nature. PE provides the *closest philosophical analogue* because it grounds knowledge in the subject's stakes. Your device is effectively saying: "In my fictional world, Pragmatic Encroachment is true, and when my narrator says 'she knew', she is reporting whether, according to PE-in-the-fiction, the sister knew *then*."

  ### Conclusion & Advice for Your Novel

  *   **The Essay's Summary:** Is flawed, particularly in conflating the theories, misattributing the "attributor stakes" claim to PE (it belongs to contextualism), and grossly overstating the "refutation" of PE. PE remains a live option, focused on the *subject's* stakes affecting the *fact* of knowledge.
  *   **"Diegetic Encroachment":** Is a coherent and compelling literary concept. It finds its strongest philosophical support in **Pragmatic Encroachment**, specifically the idea that the *character's own stakes* at the relevant time affect whether they genuinely *knew* the fact in question.
  *   **How it Works in Your Scene:** As the reader learns the immense stakes *for the sister* surrounding the letter, they realise that, given those stakes (and likely the sister's awareness of them), her evidence probably *wasn't* sufficient for genuine knowledge (according to PE). Therefore, the narrator's statement "she knew the letter was a forgery" becomes understood as *false* – not because the word "knew" changed meaning for the narrator or reader, but because the *fact* of the sister's knowledge, given *her* high-stakes situation, was that she *didn't* actually know. The line "turns false" as the reader grasps the sister's context.
  *   **Implementation:** To make this work, ensure the narrative reveals the sister's high-stakes situation *after* the initial knowledge attribution, or simultaneously in a way that forces the reader to re-evaluate. The weight comes from the reader realising the sister was operating under conditions where absolute certainty was required, making the claim of "knowledge" unsustainable within the fictional reality you've established (where PE-like rules hold for characters).

  Your instinct to use these ideas is excellent. Framing it as "diegetic encroachment" – applying a subject-stakes-sensitive view of knowledge *within the fiction* – is a sophisticated and dramatically potent tool for exploring uncertainty, responsibility, and the crushing weight of consequences in your narrative. Good luck with the novel!
