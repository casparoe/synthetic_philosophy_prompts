  *(Note: Q3 reappears after Q7 to split myopic vs. policy for calibrated rules)*  

  ---

  ### Leaves (Positions) and Most Awkward Commitments
  1. **Myopic Expected Choiceworthiness (EC)**:  
     *May endorse acts that irreversibly foreclose options deemed obligatory by minority theories (e.g., your "future foreclosure" case).*  
  2. **Policy EC**:  
     *Requires evaluating all possible future policy trajectories, which is computationally intractable for complex real-world decisions.*  
  3. **Myopic Variance Voting**:  
     *Compresses all theories' scales to equal variance, so a theory with high-stakes but low-variance choices can be drowned out by noisy low-stakes theories.*  
  4. **Myopic Borda**:  
     *Sensitive to irrelevant alternatives; adding a clearly worse option can change the ranking of existing options.*  
  5. **Tolerant EC with Permissibility and Future Preservation (Your Hybrid)**:  
     *The fixed tolerance threshold is arbitrary; infinitesimal changes in expected choiceworthiness can abruptly switch an option from "tied" to "suboptimal."*  
  6. **Non-Cognitivist**:  
     *Ignores moral truth-aptness entirely, reducing all moral uncertainty to non-moral preferences (e.g., weighting veganism and carnism like ice cream flavors).*  
  7. **Anti-Fanatical (Tempered)**:  
     *Systematically underweights low-probability, high-stakes outcomes, potentially ignoring existential risks assigned by minority theories.*  
  8. **Permissibility Aggregation**:  
     *Treats all permissible options as equally good, so a barely permissible act on many theories trumps a uniquely optimal act on one.*  
  9. **Policy Variance Voting**:  
     *Combines the variance-sensitivity of Leaf 3 with the computational infeasibility of Leaf 2.*  
  10. **Policy Borda**:  
      *Combines the ranking pitfalls of Leaf 4 with the intractable policy space of Leaf 2.*  

