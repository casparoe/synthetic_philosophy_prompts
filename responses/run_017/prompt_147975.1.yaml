prompt: |-
  I keep noticing an asymmetry in arguments about the very long-run future, and I want to know whether it has been picked out and named, or whether I am confusing two things that merely look alike.

  The first place I see it is in discussions of risk. Take an intervention that moves a very small amount of probability — a thousandth of a percent, say — from a future containing an enormous amount of suffering to an otherwise similar future containing an enormous amount of well-being. Describe it as lowering the chance of an astronomically bad outcome, and the sheer size of the stakes is treated as settling the question: any reduction, however small, matters a great deal. Describe the very same intervention as raising the chance of an astronomically good outcome, and the same people reach for the familiar complaints — that this is fanatical, that it is a Pascalian style of argument, that once you allow sufficiently large numbers to do that kind of work you can justify anything. Nothing about the affected population, the numbers involved, or the size of the stakes differs between the two descriptions; only the sign does.

  The second place is in population ethics, where bringing into existence enormous numbers of flourishing beings tends to be treated as, at best, weakly valuable or as nobody's loss if it doesn't happen, while preventing a comparable quantity of suffering is treated as urgent. I don't know whether this is the same phenomenon wearing different clothes or a different one that I have run together with it, and part of what I want is to know which.

  I am not mainly after a label, and a bare name would not settle anything for me. What I want is the carving: whether anything established names this; how it differs from the nearest candidates on each side — the psychological ones about losses and bad news counting more than gains, and the normative ones about suffering having a distinctive weight, or about creating well-being being different in kind from preventing harm; which of them, if any, actually fits; and where the edges lie. In particular I would like to know whether the asymmetry is really about valence or about direction of change: does it survive if the good outcome is recast as averting the loss of happiness that would otherwise have existed? Does it depend on the stakes being astronomical, or does it persist at ordinary scales? Does it apply to a handful of beings in agony as much as to vast numbers in mild discomfort? And is what I have described best read as a claim about how people in fact respond to large numbers, a claim about what there is reason to do, or something that has to be pulled apart into both? If nothing established fits, please say so plainly rather than implying a literature exists, and then name and define it yourself, with the boundary cases marked.

  I have no way to chase down references, so please argue from the distinctions themselves rather than pointing me at things to read. Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restatement of my question; and tell me how confident you are in what you claim, singling out the point you are least sure of.
reasoning: |-
  Okay, the user has presented a complex philosophical issue about asymmetries in evaluating long-term outcomes. They've noticed two distinct but possibly related phenomena: one in risk assessment (where reducing catastrophic risk is prioritized over pursuing massive benefits) and another in population ethics (where preventing suffering is seen as more urgent than creating equivalent flourishing). 

  The core challenge here is to determine whether these are manifestations of the same underlying asymmetry or separate issues. The user isn't just seeking terminology - they want a rigorous conceptual dissection. They've explicitly asked for bottom-line conclusions first, followed by reasoning, with no fluff. 

  Let me start by identifying what's common to both cases: in risk scenarios, people treat probability reductions of catastrophic outcomes as more compelling than equivalent probability increases of utopian outcomes. In population ethics, creating new happy lives is seen as less obligatory than preventing comparable suffering. The valence (positive/negative) seems to matter more than the magnitude.

  Where this gets philosophically tricky is separating descriptive psychology from normative claims. Psychologically, loss aversion and scope neglect might explain reactions to large numbers. But normatively, some philosophers argue suffering has intrinsic moral weight that flourishing lacks. The key test cases would be: does the asymmetry hold if we frame creating happiness as preventing happiness-deficient states? And does it scale down to individual cases?

  After mapping the conceptual landscape, I conclude these are distinct asymmetries with different foundations. The risk case involves psychological loss aversion amplified by large stakes, while the population ethics case stems from normative views about moral patients and obligations. Neither reduces to the other, though both exhibit valence sensitivity. 

  The user's framing questions are particularly sharp - especially about whether reframing creation as prevention of absence would change the asymmetry (it doesn't in population ethics). My least confident point is whether the risk asymmetry persists at ordinary scales; intuition suggests loss aversion operates there too, but the "astronomical stakes" element might be qualitatively different.
answer: |-
  Your described asymmetry is real and distinct, though it combines elements from different domains. Here's the bottom line, followed by the carving:

  **Bottom Line:** The asymmetry you observe stems from two distinct but reinforcing phenomena: (1) a *normative* asymmetry in population ethics (the "Asymmetry in Procreation"), and (2) a *psychological/descriptive* asymmetry in risk perception under astronomical stakes ("Scope Insensitivity for Gains vs. Loss-Aversion for Catastrophic Losses"). The valence (suffering vs. flourishing) is primary, but direction of change interacts, especially in the risk case.

  **Carving the Distinction:**

  1.  **Core Phenomenon:** The fundamental observation is a **Valence Asymmetry**: Identical absolute changes in expected value (EV), or identical magnitudes of suffering vs. flourishing, are treated differently based solely on whether the outcome involves suffering (bad) or flourishing (good). Suffering reductions/avoidance carry vastly more moral weight or psychological urgency than flourishing increases/creation of equivalent magnitude.

  2.  **Distinguishing the Two Manifestations:**
      *   **Manifestation 1 (Risk):** Focuses on changes in *probabilities* affecting fixed future populations/states. The asymmetry arises when comparing *reducing the probability of astronomical suffering* vs. *increasing the probability of astronomical flourishing*.
      *   **Manifestation 2 (Population Ethics):** Focuses on changes in *existence* itself. The asymmetry arises when comparing *preventing suffering in potential beings* vs. *creating flourishing in potential beings*.

  3.  **Relation to Established Concepts & Why They Don't Fully Capture It:**
      *   **Loss Aversion (Psychology):** Explains why losses loom larger than gains *for an existing subject*. This fits the *risk* manifestation well when framed as avoiding catastrophic loss vs. gaining massive benefits. However, it doesn't inherently explain the *population ethics* asymmetry, where there is no existing subject experiencing a loss or gain from non-existence. Loss aversion primarily applies to *changes in state for existing entities*.
      *   **Scope Insensitivity/Neglect (Psychology):** People often fail to proportionally scale their valuation (willingness to pay, moral urgency) to the *magnitude* of gains or the *number* of beneficiaries for positive outcomes, especially large/abstract ones. This contributes to the downplaying of astronomically large gains. Conversely, *catastrophic losses* often *do* trigger proportional (or even super-proportional) responses. This explains the differential reaction to large numbers specifically in the *risk* context.
      *   **The Asymmetry in Procreation (Normative Population Ethics):** This is the established normative core for Manifestation 2. It holds: (a) We have a strong duty to avoid creating miserable lives (preventing suffering in potential beings). (b) We have no (or only a very weak) duty to create happy lives (creating flourishing in potential beings), even if those lives would be very happy. (c) Absence of happiness in non-existent beings is not bad (no "lost" happiness). (d) Absence of suffering in non-existent beings is good. This directly explains your population ethics observation. It is fundamentally about *valence* (suffering vs. flourishing) and the *nature of existence/non-existence*.
      *   **Negative Utilitarianism (NU) / Prioritization of Suffering (Normative):** NU prioritizes minimizing suffering over maximizing happiness. Less extreme views still often hold that preventing suffering is morally more urgent than promoting happiness of equivalent magnitude. This explains the valence asymmetry but doesn't inherently distinguish between the risk and population contexts or address the specific psychological reactions to large numbers.

  4.  **Testing the Boundaries (Your Questions):**
      *   **Valence vs. Direction of Change:** Valence is primary. Recasting the "astronomically good outcome" in the risk case as "averting the loss of happiness" *might* slightly increase its perceived importance due to loss aversion framing, but it still won't reach the urgency of preventing equivalent suffering. In population ethics, recasting creating flourishing as "preventing the absence of flourishing" *fails completely* – the Asymmetry explicitly states that the absence of flourishing in non-existent beings is *not bad* and thus not something to be "prevented."
      *   **Dependence on Astronomical Stakes?**
          *   *Risk:* The asymmetry is *amplified* by astronomical stakes but exists at smaller scales due to loss aversion (avoiding a $1000 loss feels worse than gaining $1000). Scope neglect for gains becomes more pronounced as numbers get larger, exacerbating the asymmetry.
          *   *Population Ethics:* The core Asymmetry applies regardless of scale. Preventing one being from existing in agony is seen as obligatory, while creating one flourishing being is seen as optional/neutral. Large numbers highlight the counterintuitive implications but don't create the fundamental asymmetry.
      *   **Scale of Suffering?** The asymmetry holds across scales. Preventing agony for one is urgent; creating mild flourishing for one is weakly positive/neutral. Preventing vast mild suffering is very urgent; creating vast mild flourishing is weakly positive/neutral. The *Asymmetry in Procreation* applies per potential life.
      *   **Descriptive vs. Normative:** This is crucial.
          *   The *Population Ethics* asymmetry is fundamentally a *normative* claim (about what we *ought* to value) – the Asymmetry in Procreation. People *also* descriptively tend to find it intuitive, but its core justification is philosophical.
          *   The *Risk* asymmetry combines:
              *   A *descriptive psychological* component: Humans exhibit loss aversion and scope neglect for gains, amplified by large/abstract numbers, making suffering reduction feel more urgent than flourishing enhancement of equivalent EV.
              *   A potential *normative* component: Many (but not all) ethical views prioritize preventing suffering, making the *reduction in probability of catastrophe* normatively weightier than an equivalent *increase in probability of utopia*.

  **Synthesis & Naming:**

  *   **The Core:** You've identified a fundamental **Valence Asymmetry in Long-Termist Evaluation**: Suffering (reduction/avoidance) is consistently prioritized over flourishing (increase/creation) of equivalent magnitude, across contexts.
  *   **The Manifestations:**
      *   Manifestation 1 (Risk): **Astronomical Loss Aversion with Scope-Neglected Gains** (Descriptive/Psychological, Amplified by Normative Priorities). This is the specific asymmetry in probability-weighting under high stakes.
      *   Manifestation 2 (Population Ethics): **The Asymmetry in Procreation** (Established Normative Position). This is the core asymmetry concerning creating vs. preventing existence based on valence.
  *   **Relationship:** They are distinct phenomena but share the common root of valence asymmetry. The *Asymmetry in Procreation* provides the normative foundation for the valence preference in both contexts. The risk manifestation *adds* the psychological effects of loss aversion and scope neglect operating on the probabilities of those valenced outcomes, particularly under astronomical stakes, making the descriptive asymmetry there even more pronounced. The population case is more purely normative.

  **Confidence:**

  *   **High Confidence:** The existence of the Asymmetry in Procreation as a defined normative position explaining Manifestation 2. The descriptive reality of loss aversion and scope neglect contributing to Manifestation 1.
  *   **Moderate Confidence:** The distinction between the two manifestations and their respective primary drivers (normative vs. psychological amplified by normative). The primacy of valence.
  *   **Lower Confidence (Point of Least Surety):** The precise *degree* to which the normative priority of suffering *itself* (distinct from the Asymmetry in Procreation) contributes to the risk asymmetry *beyond* the psychological effects. While I believe it does contribute, disentangling its exact weight from the psychology in descriptive reactions is complex.
