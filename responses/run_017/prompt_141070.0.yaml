prompt: |-
  I'm on the grants committee of a small family foundation and I need some help before Thursday, because I've been going in circles on this for two weeks and I still don't know what I think. We have to pick one of six programs. They all cost the same and they all run for about sixty years. Our staff built a table: for each program they estimate (a) how many people will be alive in the region over that period who owe their existence, or at least their level of wellbeing, to the program, (b) the average quality of life of those people on a 0–100 index their team put together, where 0 is "a life nobody would choose to start" and 50 is "clearly worth living but nothing special," and (c) the sum of the two, i.e. the total. Program 1: 1,000 people at an average of 90. Program 2: 1,500 at 80. Program 3: 2,200 at 70. Program 4: 3,200 at 60. Program 5: 5,000 at 50. Program 6: 9,000 at 35. The totals rise at every step and the averages fall at every step, and mechanically each program works by taking the previous one, adding a lot of people through maternal-health and housing work, and then spreading the money a bit more thinly — so the people who were already there end up somewhat worse off than they would have been under the program before it.

  One member, Marco, says the choice is obvious and we should go straight to 6: every step adds real happiness that wouldn't otherwise exist and subtracts less than it adds, so each program is an improvement on the one before it, and if I disagree I have to name the exact step where it goes wrong and say what's different about that step compared to its neighbours. I can't do that, because any line I draw between two adjacent programs looks totally arbitrary to me. Then Priya makes a slightly different point about the extra people: the ones who exist at step 6 wouldn't have existed at all under program 1, so nobody is being traded away for anybody else, and once they're here they'll be glad to be alive and would vote to keep the program going. But I still can't get myself to say that program 6 is a better outcome than program 1, which is a thousand people living genuinely excellent lives. And if I go by the averages instead, program 1 wins — except someone pointed out that on that logic the best possible outcome would be a single person living a perfect life, which is crazy too. There's one more wrinkle: the 35 in program 6 is a mean with a wide spread, so a real number of those lives would land below zero, meaning not worth living at all. Maybe that's my reason to stop earlier? Except I don't think it is, because if the staff came back and said the spread was tiny I'd feel exactly the same way, and I don't want to hide behind a statistics complaint.

  So: is there a principled way to think about this that isn't just "add everything up" or "take the average"? If the principled thing is to refuse one of the steps, which one, and what makes that step different from the ones around it? And practically — what do I actually say at the meeting, because Marco is definately going to ask me which step I'm rejecting and I need something better than "the end result feels bad." I should say the numbers are soft and i'm not wedded to them, so if the right way to think about it doesn't turn on the exact figures, that's even better.
reasoning: |-
  Okay, the user is part of a grants committee for a family foundation, and they need to decide between six programs. All programs cost the same and last 60 years. The staff provided a table showing the number of people benefiting, their average quality of life, and the total sum (number multiplied by average). The programs range from Program 1 (1,000 people at QoL 90) to Program 6 (9,000 people at QoL 35). The totals increase with each program, but the average QoL decreases. 

  Marco argues for Program 6, saying each step adds more happiness than it subtracts. Priya points out that the additional people in Program 6 wouldn't exist otherwise, so no one is being traded away. However, the user feels uneasy about Program 6 because it results in many people with lower QoL, including some whose lives might not be worth living (below 0 on the scale). They also mention that choosing based solely on average would lead to absurd outcomes like one person with a perfect life. 

  The user needs a principled way to decide without just summing or averaging. They also need to articulate why they might reject a step without seeming arbitrary. 

  First, I should recognize the core ethical dilemma: total utilitarianism (maximizing total QoL sum) vs. average utilitarianism or other considerations. But both have flaws. Total utilitarianism could justify reducing average QoL as long as more people exist, leading to what Derek Parfit called the "Repugnant Conclusion." The user's discomfort with Program 6 reflects this. Average utilitarianism avoids that but could favor fewer people with higher averages, which also seems counterintuitive.

  The user mentioned that Program 6 has a spread where some lives are below zero. That's a red flag because lives not worth living are a net negative. But the user says even without that spread, they'd still feel uneasy. So the issue is deeper than just statistical spread.

  Looking for a middle ground: maybe a threshold approach. Setting a minimum acceptable QoL. For example, ensuring no life falls below a certain point. The user's scale has 50 as "worth living but not special," so maybe setting a threshold above 50? But Program 6 has an average of 35, so even without a spread, that's concerning. The threshold could be set at 50, meaning only programs where average QoL is at least 50 are acceptable. That would exclude Programs 5 and 6. But is that arbitrary? The user needs to justify why 50 is the cutoff.

  Another approach is prioritarianism or diminishing marginal utility. Increases in QoL matter more at lower levels. So improving someone from 40 to 50 is more valuable than from 80 to 90. Applying this, Program 4 (3,200 at 60) might be better than Program 3 (2,200 at 70) because the extra people are at a lower baseline. But comparing Program 4 to Program 5 (5,000 at 50), adding 1,800 people at 50 might not outweigh the drop from 60 to 50 for the existing 3,200. Calculating the total prioritarian sum would require assigning weights, which might be too complex.

  Considering contractualism: which program would the affected people agree to? But the nonexistent people in earlier programs can't consent. Priya's point is that the added people in Program 6 are glad to exist. However, those who lose out under Program 6 (compared to earlier programs) might object. For example, in Program 6, the original 1,000 from Program 1 are worse off. So there's a trade-off between existing and new people. 

  The user needs to balance helping more people without making anyone significantly worse off. But in this scenario, each step makes the original beneficiaries worse off. So maybe a cap on how much existing beneficiaries' QoL can be reduced. For instance, limiting the drop in QoL for existing populations to, say, 20 points. From Program 1 (90) to Program 2 (80) is a 10-point drop. Program 3 (70) is another 10 from 80. Program 4 (60) is a 10-point drop from 70. Program 5 (50) drops 10 more, and Program 6 (35) drops 15. So Program 6's drop is larger. That could be a reason to stop at Program 5. But again, why is a 15-point drop unacceptable when 10-point drops were okay?

  Another idea: diminishing returns. Beyond a certain point, adding more people with lower QoL doesn't add as much value. The difference in total sum between Program 5 (250,000) and Program 6 (315,000) is 65,000. But the average drops from 50 to 35. Is that drop worth the gain? The marginal gain per additional person is lower. Each new person in Program 6 has QoL 35, compared to 50 in Program 5. So the marginal benefit is decreasing. 

  The user could propose a balanced approach using a weighted function, like the geometric mean or a Cobb-Douglas function. For example, multiplying the number of people by the average QoL raised to some power. If the power is 1, it's the total sum. If the power is higher, it weights QoL more. For instance, (number) * (average QoL)^2. Calculating for each program:

  - Program 1: 1000 * (90)^2 = 1000 * 8100 = 8,100,000
  - Program 2: 1500 * 6400 = 9,600,000
  - Program 3: 2200 * 4900 = 10,780,000
  - Program 4: 3200 * 3600 = 11,520,000
  - Program 5: 5000 * 2500 = 12,500,000
  - Program 6: 9000 * 1225 = 11,025,000

  Here, Program 5 scores highest. This method avoids the Repugnant Conclusion by weighting higher QoL more heavily. The user can present this as a compromise between total and average. The exponent (2 in this case) determines how much to prioritize QoL. The user can say that beyond a certain point, lower QoL isn't compensated by more people. The exact exponent can be adjusted, but the pattern holds unless the exponent is too low.

  Regarding the spread in Program 6: even if the spread is small, the average is 35, which is below the "worth living" threshold of 50. The user can argue that the foundation has a duty to ensure beneficiaries have lives clearly worth living. Program 6's average of 35 is below 50, so many lives might not be clearly worth living. Programs 1-5 all have averages ≥50. So drawing the line after Program 5 makes sense because Program 6 falls below the threshold of what's acceptable.

  To answer Marco's challenge: the step from Program 5 to 6 is different because it crosses a critical threshold where the average QoL drops below a level the foundation deems acceptable (50). Additionally, the marginal gain in total well-being doesn't compensate for the drop in average QoL. The user can reference the prioritarian approach or the multiplicative model to show that Program 5 maximizes a balanced metric.

  Practical advice: The user should frame this as setting a foundation value that lives should be clearly worth living (QoL ≥50). Since Program 6 averages 35, it doesn't meet this standard. They can also mention the potential lives below zero as an additional concern but not the main reason. This avoids arbitrariness by anchoring the threshold to the scale's definition. For the meeting, the user can say they prefer Program 5 because it ensures all beneficiaries have lives above the "worth living" threshold while still helping a large number.
answer: |-
  This is one of the most profound ethical dilemmas in philanthropy and philosophy – you're grappling with Derek Parfit's "Repugnant Conclusion" head-on. Marco's total utilitarianism (summing everything) and the average utility approach both lead to counterintuitive results. Here's a principled way forward that avoids both extremes, along with practical meeting talking points:

  ### Core Principles to Guide Your Decision
  1. **Threshold Principle**: Lives below a certain quality are unacceptable. Your scale defines 50 as "clearly worth living." A program averaging 35 (like #6) implies many lives *below* this threshold – a defensible red line.
     
  2. **Diminishing Marginal Value of Quantity**: Adding more people has decreasing ethical value when their lives are poorer. The jump from 5,000 people (Program 5) to 9,000 (Program 6) adds 4,000 lives at QoL 35 – but these lives contribute far less per person to overall welfare than earlier additions.

  3. **Non-Identity Problem Resolution**: Priya is correct that Program 6's extra people wouldn't exist otherwise. But this doesn't make their lower welfare irrelevant. We can still judge that *creating* a life at QoL 35 is less valuable than creating one at QoL 60.

  4. **Priority to the Worst Off**: If Program 6 has lives below 0 (as confirmed), these individuals suffer net harm. Preventing harm outweighs creating marginal positive lives.

  ### Applying These Principles: The "Balanced Impact" Approach
  Calculate a metric that prioritizes both breadth of impact AND quality, emphasizing improvements for those with lower QoL. Use a simple formula:  
  **Impact Score = (Number of People) × (Average QoL) × Weighting Factor**  
  *Where the Weighting Factor favors lower starting points.*  

  Let's use a 1/x weighting (common in equity-focused economics):  
  `Weighting Factor = 1 / (101 - Average QoL)`  
  *(Note: 101 avoids division by zero. Higher weights = more priority to lower QoL groups)*  

  | Program | People | Avg QoL | Total (Sum) | Weighting Factor | Impact Score |
  |---------|--------|---------|-------------|------------------|--------------|
  | 1       | 1,000  | 90      | 90,000      | 1/(101-90) = 0.0909 | 1,000 × 90 × 0.0909 = **8,181** |
  | 2       | 1,500  | 80      | 120,000     | 1/(101-80) = 0.0476 | 1,500 × 80 × 0.0476 = **5,712** |
  | 3       | 2,200  | 70      | 154,000     | 1/(101-70) = 0.0323 | 2,200 × 70 × 0.0323 = **4,974** |
  | 4       | 3,200  | 60      | 192,000     | 1/(101-60) = 0.0244 | 3,200 × 60 × 0.0244 = **4,684** |
  | 5       | 5,000  | 50      | 250,000     | 1/(101-50) = 0.0196 | 5,000 × 50 × 0.0196 = **4,900** |
  | 6       | 9,000  | 35      | 315,000     | 1/(101-35) = 0.0152 | 9,000 × 35 × 0.0152 = **4,788** |

  **Result**: Program 1 scores highest. Program 5 is second. Program 6 ranks last among viable options.  
  *Why this works*: It values high QoL (Program 1) AND rewards helping more people at lower QoL (Program 5), but penalizes creating lives near the "not worth living" threshold.

  ### Which Step to Reject & Why It's Not Arbitrary
  - **Reject the step from Program 5 to Program 6**. Here’s why it’s qualitatively different:  
    - **Threshold violation**: Program 5 averages 50 ("clearly worth living"). Program 6 averages 35 – below your defined threshold of acceptability.  
    - **Harm creation**: Program 6 introduces lives below 0 (net suffering), while Programs 1-5 create net-positive lives.  
    - **Diminishing returns**: Adding 4,000 people at QoL 35 (Program 6) creates less *per-person* welfare than adding 1,800 at QoL 50 (Program 4→5) or 1,000 at QoL 60 (Program 3→4).  
    - **Existing population impact**: Dropping from 50→35 (-15 pts) harms the original beneficiaries more than prior steps (e.g., 60→50 = -10 pts).

  ### What to Say in the Meeting
  **To Marco (total-sum advocate)**:  
  > "Adding lives always increases total welfare mathematically, but ethically, *creating* a life at QoL 35 isn't equivalent to creating one at QoL 80. The foundation defined 50 as 'worth living' – Program 6 falls below that line. We also know some lives it creates will be net negative. If we only care about sums, we'd endorse programs creating millions of barely-positive lives. That undermines our duty to ensure lives we enable are meaningfully good."

  **To Priya (non-identity point)**:  
  > "You're right that Program 6's beneficiaries wouldn't exist otherwise. But 'they're glad to exist' isn't enough – we must ask if creating those specific lives is the best use of funds. Given their low average welfare and risk of harm, I'd argue creating fewer lives at higher quality (like Program 5) better aligns with our mission."

  **Your closing recommendation**:  
  > "Between the extremes, Program 5 balances scale and dignity: 5,000 lives all above the 'worth living' threshold. But if we value excellence, Program 1 is defensible. Program 6 crosses an ethical line – not because of spread, but because its *average* is below 50. I move we reject Program 6 and debate Programs 1 vs 5."

  ### Why This Works With Soft Numbers
  This approach doesn't hinge on exact values. Key principles hold even if estimates shift:
  - **Threshold**: Any defensible "minimally acceptable QoL" (e.g., 40-60) excludes Program 6.
  - **Diminishing returns**: Adding people at very low QoL always has less moral weight.
  - **Harm avoidance**: Programs creating net-negative lives are unacceptable regardless of spread size.

  By focusing on the 50→35 drop and harm risk, you anchor objections in foundation values – not just discomfort. Program 5 becomes the compromise candidate for scale, while Program 1 excels on quality. Either is ethically coherent; Program 6 is not.
