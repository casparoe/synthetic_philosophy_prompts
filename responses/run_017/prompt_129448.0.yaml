answer: |-
  ### Scenario: The Stopped Book on the Table
  Imagine a heavy book sliding across a long dining table with a dry, rough surface. The book is pushed at some unknown time in the past, from an unknown starting position and with an unknown initial velocity. It slides under the influence of kinetic friction, which decelerates it at a constant rate (determined by the known friction coefficient) until it comes to a complete stop. At the present moment, the book is observed at rest at a precise location, say position \(x_0\). The task is to determine a specific fact about the past: the starting position and initial velocity (i.e., how hard and from where it was pushed). The laws governing the system are Newton's laws plus a deterministic friction model: while moving, acceleration is constant and opposite to velocity until velocity reaches zero; once stopped, acceleration is zero indefinitely. The system is purely classical, with no quantum effects, and involves only ordinary macroscopic objects.

  ### Check: State, Compatible Pasts, and Predictability
  - **Present state known to arbitrary precision**: The state is defined as the book's position \(x\) and velocity \(v\). At the present time, we know \(x = x_0\) exactly (to as many decimal places as desired) and \(v = 0\) exactly. No other variables (e.g., temperature of the table, air motion) are included in this state description because the laws specified operate only on \(x\) and \(v\). This is a valid deterministic macroscopic model of the system.
    
  - **Set of pasts compatible with the present state**: Infinitely many past histories are consistent with the book being at rest at \(x_0\). Specifically:
    - The book could have been pushed from the left or right (direction encoded in the sign of initial velocity).
    - For a given direction (e.g., left to right), any initial velocity \(v_{\text{initial}} > 0\) is possible, as long as the starting position \(x_{\text{initial}}\) satisfies \(x_{\text{initial}} = x_0 - \frac{v_{\text{initial}}^2}{2a}\), where \(a\) is the constant deceleration magnitude (fixed by the friction coefficient and gravity).
    - The push could have occurred at any time in the past, provided the book had sufficient time to stop by the present.
    Thus, the set of compatible pasts is a continuum parameterized by \(v_{\text{initial}}\) (or equivalently \(x_{\text{initial}}\)) and the time of the push. Each choice yields a distinct history leading to the same present state.

  - **Why extra precision in the present does not collapse the set**: Increasing the precision of \(x_0\) narrows the exact stopping location but does not add new state variables (e.g., no information about heat or microscopic vibrations is included or required by the model). The state \((x_0, 0)\) remains insufficient to determine \(v_{\text{initial}}\), \(x_{\text{initial}}\), or the push time, as these are not encoded in the present state. Even with infinite precision, the model's state space has no "memory" of the initial conditions—only the outcome (position at rest) is recorded.

  - **Future predictability**: From the present state \((x_0, 0)\), the future is perfectly predictable: the book remains at rest at \(x_0\) indefinitely, as static friction prevents motion unless an external force intervenes. This follows deterministically from the laws.

  ### The Load-Bearing Feature: Irreversible Dynamics
  The key feature enabling past underdetermination is the **irreversible dynamics** of the friction model. Friction dissipates kinetic energy as heat, erasing information about initial conditions (e.g., starting position and velocity) from the macroscopic state variables \((x, v)\). This makes the dynamics "lossy": many initial states converge to the same final rest state, but the reverse mapping is impossible within the model.

  - **Effect of removing this feature**: If friction were removed (or replaced with a conservative force, like a spring), the system would become reversible. For example, on a frictionless table, the state \((x, v)\) would uniquely determine both future and past trajectories via Newton's laws. Irreversibility is necessary for the underdetermination.

  ### Objection and Reply
  - **Objection from a determinist**: "Determinism implies that the complete present state, combined with the laws, uniquely determines all past and future states. If we included the full microscopic state (e.g., table and air molecules) with reversible fundamental laws, we could reverse-integrate to recover the past. Thus, the past fact must be recoverable in principle."
    
  - **Reply**: Determinism guarantees that the future is uniquely determined from the present state, but it does not inherently guarantee uniqueness of the past—this depends on the reversibility of the dynamics. In this model, the laws are explicitly irreversible (energy dissipation without information retention in the state variables), so the system is deterministic forward in time but not backward. The objection conflates the macroscopic model with an underlying reversible microphysics. The scenario uses a valid phenomenological law (common in engineering or forensics) where irreversibility is emergent. If we switched to a reversible microscopic model, the system would no longer satisfy the constraint of "ordinary objects" without "infinity tricks," as tracking every molecule is computationally and practically infeasible in a forensic context. Here, determinism holds for the future, but the past is underdetermined due to the chosen level of description.

  ### Settled Name and Boundaries
  - **Name**: This is an instance of **macroscopic irreversibility** in deterministic systems.
    - **What it includes**: Systems with dissipative forces (e.g., friction, inelastic collisions) modeled at a coarse-grained level, where information loss occurs due to irreversible dynamics. The past is underdetermined despite future predictability.
    - **What it excludes**:
      - *Chaos*: Sensitive dependence on initial conditions (e.g., butterfly effect) is not involved; here, underdetermination is structural, not due to error amplification.
      - *Statistical irreversibility*: This refers to emergent irreversibility in many-particle systems (e.g., entropy increase), but here it is built into a simple low-dimensional law.
      - *Reversible systems*: If the dynamics were conservative (e.g., no friction), the past would be unique.
      - *Quantum or relativistic effects*: The scenario is purely classical and non-relativistic.
    - **Boundaries**: Macroscopic irreversibility applies when using phenomenological laws that abstract away microscopic details. It stops being relevant if the model includes all degrees of freedom with reversible laws, but that violates the "ordinary objects" constraint by requiring infinite precision in practice.

  \answer{Irreversible dynamics}
