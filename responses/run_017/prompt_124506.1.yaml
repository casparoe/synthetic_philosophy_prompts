prompt: |-
  I never studied philosophy formally — I left university after a science degree and have been picking things up from podcasts and from a reading group that meets above a pub. We recently spent two evenings on whether the fact that our moral beliefs were shaped by evolution gives us any reason to doubt them. One member of the group, Dan, argues that it does: our moral intuitions are the output of selection pressures favouring cooperation within bands of kin and allies, and once you really take that in, you have no remaining reason to think those intuitions track anything outside of that history. When I pushed him on what exactly follows, another member said the whole argument "can't get off the ground, because you can't derive an ought from an is" — the line I've seen attached to Hume's name — and the group treated that as having settled the matter and moved on to the next topic. I don't think it settled anything, and I also don't think Dan was refuted, but I can't articulate why.

  So what I want is a precisification of that sentence as it was being used in that room. Please lay out, as a numbered menu, the distinct precise claims "you can't derive an ought from an is" could be making here — claims about what can follow from what in a valid argument, claims about whether moral statements can be analysed into non-moral ones, claims about what a causal explanation of why someone holds a belief does to that person's justification for holding it, claims about the kind of thing moral facts would have to be if there are any, and any others you think belong on the list — and for each one say whether it is close to a platitude, a substantive thesis that many people working on this would defend, or something that would be widely rejected, and whether it is the sort of claim that would actually stop Dan's argument or only change its shape.

  Two contributions of my own that I'd ask you to take apart rather than humour. First, my attempt in the room: I said the slogan looked to me like it cuts both ways, since if the gap blocks Dan from getting "our moral beliefs are unjustified" out of "our moral beliefs were selected for", it should equally block the realist in our group from getting "our moral beliefs are roughly true" out of "evolution steered us toward beliefs that made cooperation pay". Dan replied that a debunker only has to remove a justification, not install a verdict of error, and I want to know whether that reply is a real distinction or a way of restating his conclusion. Second, a case I invented afterwards to test the slogan: imagine a population whose central moral convictions were produced by a deliberate, decades-long state propaganda campaign, and imagine they later find out. Almost everyone feels that this discovery tells against those convictions. If something with that same shape is doing the real work in the evolutionary argument, then it looks to me as though the fight between Dan and the realist is about whether evolution is more like propaganda or more like perception — and not about any is/ought gap at all. Tell me whether that diagnosis is right, and, if it is, which of your readings of the slogan survive it and which turn out to be beside the point in this particular debate.

  One last thing about how I'd like the answer pitched: please be explicit about which of your claims are uncontroversial among people who actually work on this and which are live disputes. I would much rather be told "this is settled, that is contested, and here is roughly how the disagreement divides" than be handed a confident answer that papers over a fight. Where a reading you list is itself philosophically contested, mark it as contested rather than presenting it as the standard view, and where you are going beyond anything the literature settles, say so plainly. I don't need citations, references or a reading list — I want the distinctions and the verdicts on them, nothing I'd have to look up.
reasoning: |-
  Okay, let me try to unpack this user's query. They're coming from a science background, no formal philosophy training, but they've been part of a pub reading group discussing whether evolution undermining moral beliefs. Dan argues that since moral intuitions evolved for cooperation within kin groups, that casts doubt on their truth. Another member shut down the discussion with Hume's "no ought from is," and the user feels this didn't resolve anything.

  First, I need to clarify what "no ought from is" could mean in this context. The user wants distinct interpretations, so I should list them as numbered claims. They mentioned validity of arguments, analysis of moral statements, impact of causal explanations on justification, nature of moral facts, etc. For each, I need to assess if it's platitude, contested, or rejected, and if it stops Dan or just reshapes his argument.

  The user offered two contributions. First, their point that the slogan cuts both ways: if it blocks Dan concluding beliefs are unjustified, it should also block realists from claiming beliefs are true based on evolution. Dan replied that debunkers only need to remove justification, not prove false. I need to dissect whether that's a real distinction or just restating his conclusion. Second, their propaganda analogy: if discovering moral beliefs came from propaganda undermines them, and evolution is similar, then the debate is about whether evolution is like propaganda or perception, not about is/ought. I need to evaluate if this is right and which interpretations of the slogan survive it.

  The user emphasized wanting clarity on what's settled versus contested in philosophy. So for each interpretation, I should note consensus levels without jargon. They don't want citations but clear distinctions and verdicts. Also, address their examples critically, not just agree.

  Hmm, starting with the interpretations. The first is logical entailment: no valid argument can have moral conclusions from non-moral premises alone. That's widely accepted. But Dan isn't making a deductive argument; he's giving a causal story. So this doesn't refute him, just says his conclusion isn't logically necessary. It might reshape his argument by pointing out he needs additional premises.

  Next, conceptual analysis: moral terms can't be defined by non-moral ones. This is contested (naturalism vs non-naturalism). If true, it means Dan's evolutionary explanation can't fully capture moral facts, which might protect realism unless he argues morality is reducible. So it doesn't stop him but requires him to engage in metaethics.

  Third, inference justification: non-moral premises can't justify moral conclusions without prior moral commitments. This is a substantive thesis. If accepted, Dan's argument is affected because he relies on non-moral facts to challenge moral beliefs. But realists might need prior moral assumptions to claim evolution supports truth. The user's "cuts both ways" point fits here. Dan's reply that debunking only removes justification without proving false might hold if justification relies on the causal origin, but that's where the propaganda analogy kicks in.

  Causal explanations and justification: if a belief's origin undermines its justification, that's a substantive claim. Dan assumes evolutionary origins are distorting, like propaganda. The user's analogy here is key. The debate then shifts to whether evolution is reliable for moral truth, which depends on if moral facts exist and how we access them. So the is/ought gap might not be central; it's about the reliability of the cognitive process.

  Moral facts' nature: if moral facts require special faculties, evolution might not provide them. But if moral facts are natural, evolution could track them. This ties into the perception vs propaganda analogy. Realists might argue evolution selected for true beliefs because cooperation is objectively good, while debunkers say it's merely adaptive.

  The user's contributions: their first point about the slogan cutting both ways is valid. If is/ought blocks debunking, it should block vindicating too. Dan's distinction between removing justification vs proving false is real in epistemology (like undermining evidence vs proving falsity). But in moral debunking, it's contested whether causal origins can undermine without implying error.

  The propaganda analogy is insightful. It shows that the real issue isn't is/ought but whether the causal process is truth-tracking. So interpretations about logical entailment or conceptual analysis might be beside the point here. The key surviving points are about justification and reliability of cognitive processes.

  Putting it together: I'll list each interpretation with its status and relevance to Dan. Highlight that logical entailment is platitude but doesn't stop Dan. Conceptual analysis is contested and shapes the debate. Justification-related interpretations are substantive and central. The propaganda analogy shifts focus to reliability, making some interpretations less relevant. Conclude that Dan's argument depends on whether evolution is truth-tracking, which is where the real disagreement lies.
answer: |-
  Here's a precisification of "you can't derive an ought from an is" in your context, presented as a numbered menu of distinct claims. For each, I'll note its status in philosophy, whether it stops Dan's argument or reshapes it, and address your contributions directly. Key consensus levels:

  - **Platitude**: Near-universal agreement among specialists.  
  - **Substantive/Contested**: Live debate, with respected arguments on both sides.  
  - **Widely Rejected**: Majority view against it, though not without dissent.  

  ---

  ### **1. Logical Entailment Claim**  
  *"No valid deductive argument can have a purely normative (ought) conclusion if its premises are entirely non-normative (is)."*  
  - **Status**: Platitude. Hume’s core point is uncontroversial here.  
  - **Effect on Dan**: Doesn’t stop him; **reshapes his argument**. Dan isn’t making a deductive inference (e.g., "Evolution shaped belief X, therefore X is false"). He’s offering an *undermining defeater*: a reason to doubt the *justification* of moral beliefs given their origin. The gap blocks deductive proofs of error, but Dan’s argument is probabilistic (e.g., "This origin makes truth-tracking unlikely").  

  ### **2. Semantic Analysis Claim**  
  *"Moral statements cannot be fully reduced to or analysed in non-moral (e.g., biological, psychological) terms."*  
  - **Status**: Substantive/Contested. Non-naturalists (e.g., G.E. Moore) defend this; naturalists (e.g., Railton) reject it.  
  - **Effect on Dan**: Reshapes debate. If moral facts *are* irreducible (e.g., "goodness" is a simple property), Dan’s evolutionary story can’t capture them. But if moral facts *are* natural (e.g., "good" = promotes flourishing), evolution *might* track them. The slogan here flags a metaethical dispute Dan must engage.  

  ### **3. Justificatory Gap Claim**  
  *"Non-moral premises cannot *justify* a moral conclusion without prior moral commitments (e.g., bridge principles linking facts to values)."*  
  - **Status**: Substantive/Contested. Accepted by non-naturalists and some error theorists; rejected by naturalists who think moral justification can flow from empirical facts alone.  
  - **Effect on Dan**: **Stops his *vindicating* move but not his debunking**.  
    - Your "cuts both ways" point is sharp here: if evolution can’t *justify* moral realism (without prior moral assumptions), it equally can’t *justify* debunking (e.g., "undermined beliefs are unreliable" assumes a norm about justification).  
    - **Dan’s reply**: Distinction between *removing justification* and *proving error* is real in epistemology. Debunkers argue that exposing flawed origins *defeats* existing justification (e.g., "you thought your belief was intuitive/self-evident; now you see it’s contingent"). Proving *error* requires extra premises (e.g., "evolution selects for fitness, not truth").  

  ### **4. Causal Explanation Claim**  
  *"Explaining the causal origin of a belief (e.g., via evolution) *undermines its justification* only if that origin is *unreliable* for truth-tracking."*  
  - **Status**: Substantive/Contested. Core to evolutionary debunking literature (Street, Joyce vs. Enoch, Wielenberg).  
  - **Effect on Dan**: **Reshapes his argument** into reliability assessment.  
    - **Your propaganda analogy is spot-on**. The debate pivots to: *Is evolution like propaganda (distorting) or perception (reliable)?*  
      - Dan: Evolution optimizes for cooperation/kin survival, not moral truth. If moral facts exist independently (e.g., "torture is wrong"), evolution may not track them.  
      - Realist: Evolution *could* track moral truth if true beliefs promote survival (e.g., cooperation *is* objectively good).  
    - This claim **survives your analogy** and is the heart of your group’s dispute. The is/ought gap is secondary here.  

  ### **5. Metaphysical Claim**  
  *"If moral facts exist, they must be *sui generis* (non-natural), so empirical facts (like evolution) are irrelevant to them."*  
  - **Status**: Substantive/Contested. Non-naturalists defend this; naturalists/reductionists reject it.  
  - **Effect on Dan**: **Stops him if accepted**. If moral facts are non-natural, evolutionary history can’t touch them. But this is a heavyweight metaphysical stance, not a knockdown argument.  

  ### **6. Epistemic Authority Claim**  
  *"Moral intuitions have *prima facie* justification unless defeated; causal explanations alone don’t defeat them."*  
  - **Status**: Substantive/Contested. Defended by intuitionists (e.g., Huemer); debunkers reject it.  
  - **Effect on Dan**: **Directly blocks his argument** if true. Dan needs to show why evolution *is* a defeater (e.g., by arguing for unreliability, per Claim 4).  

  ---

  ### **Diagnosis of Your Contributions**  
  1. **Your "cuts both ways" point**:  
     - **Correct**: The justificatory gap (Claim 3) *does* constrain both sides. Realists can’t infer "moral beliefs are true" from evolution alone; debunkers can’t infer "beliefs are false."  
     - **Dan’s reply**: Distinction between *defeating justification* and *proving error* is valid but **incomplete**. Defeat requires showing the origin is *non-truth-tracking* (Claim 4). His reply assumes evolution *is* distorting, which is the contested point.  

  2. **Your propaganda analogy**:  
     - **Largely correct**: The core issue **is reliability** (Claim 4), not the is/ought gap per se.  
     - **What survives the analogy**:  
       - Claims 1 & 2 (logical/semantic) are **beside the point** in this debate.  
       - Claims 3 & 4 (justification/reliability) are **central**.  
       - Claim 6 (intuitional authority) is contested but **secondary**.  
     - **Why it works**: Both propaganda and evolution are *contingent causal processes*. If they’re truth-apt (e.g., perception), origins don’t debunk; if not (e.g., hallucination), they do.  

  ### **The Real Stakes**  
  - **Dan’s argument relies on two contested claims**:  
    - (a) Evolutionary pressures *are unreliable* for tracking moral truth (Claim 4).  
    - (b) Explaining moral beliefs via evolution *defeats their justification* (Claim 3).  
  - **The realist retort**:  
    - Without prior moral assumptions (e.g., "survival is good"), Dan can’t establish unreliability (per your "cuts both ways" point).  
    - Evolution *may* be reliable if moral facts align with fitness (e.g., if "cooperation is good" is true).  
  - **What's settled**: You can’t *deduce* moral conclusions from non-moral premises (Claim 1).  
  - **What's contested**: Whether causal origins can debunk justification (Claims 3, 4, 6) and whether moral facts are natural (Claims 2, 5).  

  **Bottom line**: Your group treated "no ought from is" as a conversation-ender, but it’s merely a gatekeeper. The real fight is whether evolution is a *debunking* origin (propaganda) or a *vindicating* one (perception). That’s where the philosophy gets thorny—and where your analogy hits home.
