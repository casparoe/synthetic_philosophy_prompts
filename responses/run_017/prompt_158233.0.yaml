prompt: |-
  me and my mate got into a massive argument last night about quantum immortality and I'm still turning it over this morning. He's all in on it. The setup is the usual quantum suicide thing: a device wired to a quantum event, 50/50, bad outcome you die instantly and painlessly, good outcome you're fine and richer. Run it once or run it thirty times, he says it doesn't matter, because you can never observe your own death, so the only futures you'll ever actually experience are ones where you kept surviving. I pushed back on him for like two hours and couldn't put my finger on whats wrong with it, and part of why is that my own gut verdicts on cases don't line up. So here they are, and I want to know if there's a principle that captures them or if one of them has to go.

  1. One run, 50% instant death, ten million dollars if you live. I'd do it. Nothing to do with immortality, that's just an ordinary gamble I'd take.

  2. Thirty runs of the same device, ten million if you make it through all of them, so one in a billion by ordinary counting. I would NOT do it. And I'd still not do it even granting him the premise that you only ever experience the branches where you survive, which I sort of do grant. I feel like I'm being inconsistent here but I can't locate which bit is the bad bit.

  3. Same thirty runs, except on the bad outcome the machine doesn't kill you, it leaves you alive but permanently unconscious, or locked in, unable to move or communicate. I'm even more certain I wouldn't do it. This is the strongest thing I think I have against him: 'there is some continuer of you' isn't enough, the continuer has to be conscious. But I notice this might just collapse into 'most of the branches you survive into are awful'.

  4. Measure. He says you should expect to find yourself in the high-measure branches, the ones with more 'amount' of you however exactly that works under many worlds, so a thin sliver of a branch where you're rich shouldn't count for much. My gut says the opposite: if there's any branch where I'm alive, conscious and rich, that's the one I'll find myself in, and how thin it is is irrelevant. But this sits really badly with 3, where the reason I refuse is basically that the fat branches are the horrible ones.

  5. Other people. If HE does the thirty runs I'd grab the device out of his hands and I'd expect to be planning his funeral. I don't apply any immortality reasoning to him whatsoever, I just count what fraction of branches contain a living him. But I'm not doing that for me, and I can't say why the asymmetry is OK.

  6. The copy version, which I made up in the middle of the argument: on the bad outcome the machine kills you but first builds an exact atom-for-atom replica of you, which wakes up remembering taking the bet and believing it won. Now there's guaranteed to be someone around with my memories and my bank balance. I don't count that as me surviving at all, it's just a new person. So apparently I care about more than 'there exists some future subject who takes himself to be me'.

  7. The version where the money doesn't go to me, it goes to my kids, and they exist and get paid in every branch including the ones where I'm dead. I'd do this one without hesitating. It feels completely different from 2 even though the physics and the odds are identical. Which makes me suspect that in 2 I'm secretly not moved by the immortality reasoning at all, and then I want to know what I am moved by.

  So: is there a single principle here, about what you should care about when you branch, about how to weight branches, or about what counts as surviving, that gets all seven or nearly all of them? Please state it precisely enough that I can test it, say what it predicts for a case I haven't listed, and tell me honestly which of my verdicts it can't accommodate. Also feel free to tell me one of my cases is confused rather than that my verdict is wrong, if that's what you think. And what does whatever principle you land on say about the one I keep going back and forth on: a one-shot medical thing where a drug either kills you instantly (99%) or gives you fifty more healthy years (1%). Is that just case 2 in a white coat, or is it really case 1?
reasoning: |-
  Okay, let me try to unpack this user's quantum immortality dilemma. They had a heated argument with their friend and are now questioning their own intuitions across seven different scenarios. The core tension is between accepting quantum immortality (where you only experience survival branches) and their gut feelings that reject it in repeated trials or certain conditions.

  First, I notice the user is deeply analytical but frustrated by their own inconsistent reactions. They want a unifying principle but also seem to value emotional coherence - like why they'd risk death for their kids but not for personal gain. There's this meta-layer too: they're annoyed at not being able to articulate why their friend's position feels wrong despite conceding the premise.

  Looking at their cases, the contradictions cluster around three axes: 
  - Continuity of consciousness (case 3 vs 6) 
  - Branch weighting (case 4's measure problem) 
  - Self/other asymmetry (case 5). 

  The medical trial case they mention last is particularly telling - it's where abstract theory meets real-world stakes. Their struggle there suggests they intuitively reject immortality reasoning when survival odds get too low, even if logically consistent.

  What's fascinating is how their examples progressively isolate what "survival" means to them. Case 7 (money to kids) proves their refusal in case 2 isn't about risk calculation per se, but about valuing first-person experience. Yet they can't square this with case 4 where they dismiss branch thickness.

  I think their underlying ask is twofold: 
  1) A framework that preserves most of their intuitions without special pleading 
  2) Permission to reject "observer effect" absolutism in practical decisions. 

  The copying case (6) is their strongest card - it shows identity isn't just about information preservation. But they haven't connected this to why comatose branches (3) feel worse than death branches.

  Hmm... the solution might lie in distinguishing three survival criteria: 
  - Biological continuity (fails in copying) 
  - Subjective continuity (fails in coma) 
  - Causal history (fails for other observers). 

  This could explain why they'd do the medical trial for kids (causal impact persists) but not for themselves (subjective discontinuity). The friend's mistake? Equating "possible future experience" with "valuable survival."
answer: |-
  Here's a unified principle that captures your intuitions across most cases while identifying where one intuition needs adjustment:

  **The Principle of Subjective Continuity of Valued Experience (SCVE):**  
  *When evaluating branching scenarios, you should care about the* ***continuation of your first-person conscious experience with the capacity for valued states***. This requires:  
  1.  **Subjective Continuity:** Your current stream of consciousness must be uninterrupted (or perceived as uninterrupted) into the future branch.  
  2.  **Valued Experience:** The future state must allow for experiences you value (e.g., consciousness, agency, relationships).  
  3.  **Branch Weighting by Survival Likelihood:** For repeated trials *before* commitment, you weight branches by their objective probability of *allowing subjective continuity* from your current perspective.

  **How SCVE Handles Your Cases:**

  1.  **One Run (50% Death):** **Fits.** Subjective continuity is preserved if you survive (50% chance), and the valued experience (life + $10M) is substantial. The 50% risk feels acceptable.
  2.  **Thirty Runs (Death):** **Fits.** SCVE *rejects* quantum immortality's "guaranteed survival" claim. Before the runs start, the objective probability (1 in a billion) that *your current stream of consciousness* survives all 30 trials is vanishingly small. You correctly refuse because SCVE weights branches by survival probability *at the decision point*, not by what you'd experience *after* surviving many splits. Quantum immortality describes the survivor's *retrospective* experience, not the *prospective* risk assessment.
  3.  **Thirty Runs (Coma):** **Fits Perfectly.** Even branches where "you" technically survive often lack *Valued Experience* (consciousness, agency). Most branches result in a persistent vegetative state – the antithesis of valued experience. This is worse than death in many ways. SCVE explains the stronger refusal.
  4.  **Measure:** **Your Gut is Partially Correct, Needs Refinement.** SCVE agrees that you only ever *find yourself* in a branch where you exist (subjective continuity holds). However, *before* the event, when deciding, you *must* consider how *likely* it is that the branch allowing your subjective continuity *also* contains valued experience. In the coma case, the "fat" branches are horrific. In the death case, the "fat" branches are non-existence. Only the vanishingly thin sliver offers valued experience. **SCVE says:** For *decision-making*, you weight the *objective probability* of landing in a branch satisfying both Subjective Continuity *and* Valued Experience. How "fat" a branch is *after* the split doesn't change the *prior* probability of your consciousness surviving *into* a valuable branch. QI confuses post-hoc experience with prior probability.
  5.  **Other People:** **Fits (Asymmetry Explained).** You care about *their* objective survival probability (the fraction of branches with a living them) because you cannot experience *their* subjective continuity. You only experience your own. SCVE is inherently first-person. For others, you use standard probability (branch counting). The asymmetry is fundamental and necessary.
  6.  **Copy Version:** **Fits.** The copy is a *new* stream of consciousness, even if identical. Your *current* subjective continuity ends at death; the copy's experience begins anew. SCVE requires the continuation of *your specific* stream, not just the existence of *a* subject with your memories. This distinguishes survival from replacement.
  7.  **Money to Kids:** **Fits.** Your refusal in (2) wasn't *secretly* rejecting QI; SCVE explicitly rejects QI for *prospective decision-making*. This case changes the *Valued Experience*. Even if *you* don't survive, the valued outcome (kids secure) occurs in *many* branches (50% per trial, ~1 in a billion overall for full success, but significant chance of partial success). The low probability of *your* survival is outweighed by the high probability of *some* benefit to your kids across the branches. Your focus shifts from *your* subjective continuity to causing a valued external outcome.

  **Where SCVE Suggests Refinement:**
  *   **Case 4 (Measure):** Your gut feeling ("I'll find myself in the rich branch") is correct *only after the event, if you survive*. **Before** the event, you *must* acknowledge the near-certainty (in repeated trials) that your consciousness will *not* make it to the valuable branch. SCVE insists on weighting by survival probability *before* commitment. Your "thin branch counts" intuition applies *after* survival, not during rational pre-commitment assessment. QI proponents mistake the survivor's inevitable perspective for a guarantee during decision-making.

  **The Medical Trial Case (1% survival, 50 years):**
  *   **SCVE Verdict:** This is **fundamentally different from Case 2 (30 runs)**. It's **analogous to Case 1 (One Run)**.
  *   **Why:** It's a *single* trial. The prospective probability that *your current subjective consciousness* continues into a future with 50 valued years is 1%. The probability of non-continuation (death) is 99%. This is a high-risk, high-reward *single* gamble on your stream of consciousness continuing. Like Case 1, whether you take it depends on your personal risk tolerance for a one-off chance at a vastly extended valuable life vs. near-certain death.
  *   **Contrast with Case 2:** Thirty runs require *sequential survival*. The probability your consciousness survives *all* splits is (0.5)^30 ≈ 1e-9. SCVE sees this as effectively guaranteed death of your current stream, not a 1-in-a-billion *chance* at life. The medical trial offers a small but *real* chance (1%) your consciousness continues *once*. Repeated trials guarantee the *overwhelming* likelihood your specific consciousness stream ends *during the sequence*.

  **In Summary:**
  *   **SCVE** provides a coherent framework capturing 6.5/7 of your intuitions (refining Case 4).
  *   It **rejects Quantum Immortality as a decision-making tool** because QI ignores the *prospective probability* of your current consciousness surviving into a valuable future branch.
  *   It prioritizes **continuation of your specific first-person experience** with capacity for value, distinguishing survival from copying or coma.
  *   It explains the **self/other asymmetry**.
  *   It clarifies why **benefiting others** changes the calculation.
  *   It distinguishes **single high-risk trials** (gambles on continuation) from **repeated trials** (near-certain termination of your consciousness stream).

  **Honest Incompatibility:** SCVE firmly rejects your friend's core claim that the probability of experiencing death is zero *from the perspective of rational pre-commitment assessment*. While a survivor *will* only remember surviving, the *rational actor* knows the chance of *being* that survivor in a long sequence is negligible. Your Case 2 and 3 verdicts are correct under SCVE; the "inconsistency" you felt stemmed from temporarily granting an incorrect premise (QI for decision-making). SCVE restores consistency by separating survivor experience from decision risk.
