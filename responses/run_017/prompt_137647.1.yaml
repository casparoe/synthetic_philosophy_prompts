prompt: |-
  I am a professor of philosophy who works mainly on the ethics of punishment, and I have recently been made chair of my university's Standing Committee on Open Inquiry. The committee has exactly one power: to grant, condition, withdraw, or restore a university platform — an invitation, a named lecture, a keynote, a professional-society meeting hosted on our campus. We cannot hire, fire, or discipline anyone, and because we are a public university our counsel insists that our stated grounds be viewpoint-neutral, which in practice means we must be able to describe what we are responding to as conduct rather than as the content of a scholarly claim. We meet monthly, we have roughly half an hour per case, our members include two students and a university lawyer, and our written reasons are published and are read as precedent at other institutions.

  I would like a decision procedure my committee could actually run, in the room, on a demand to withdraw or restore a platform. I do not want a position paper; I want an ordered set of questions, a specification of what counts as a sufficient answer to each, the points at which the procedure stops with a no, and the points at which it hands the decision to a person because the remaining question is one of values rather than fact. It should include an ordered ladder of available tariffs — from a published statement of censure, through conditioning the event (a respondent, a published rejoinder, a mandatory open Q&A), through a dated postponement, up to withdrawal and to removal of a named honorific — with the conditions that license each rung and an explicit expiry and review date for every rung above censure.

  The procedure should also operationalize a set of distinctions I have found myself relying on without being able to state cleanly, and I would like my names for them either disciplined or replaced by better ones:

  the authorship condition — that no exclusion is legitimate unless some identifiable body states the charge, the tariff, and its expiry, so that an open-ended exclusion produced by diffuse pressure and merely tolerated by us cannot be ratified or credited as time served;

  equivalence in currency — that a sanction which takes an audience, a credential, or an honorific should be denominated in that same good and should not exceed the advantage the person obtained or would have obtained from it;

  separability — whether the objectionable matter is separable from what the person was actually invited to do, so that we can tell withdrawing a platform from withdrawing a view;

  the counterfactual-audience test — whether this person would have been platformed but for the conduct complained of, which is my rough device for detecting pretext and selective enforcement;

  the collateral-bearer test — who in fact bears the cost of the sanction, and in particular whether it falls mainly on people who are not responsible for the conduct and who may even be its victims;

  the reply-and-return route — what the person must do to regain ordinary standing, and who certifies that they have done it;

  tariff scarcity — the thought, borrowed from the expressive side of the punishment literature, that our condemnations are a signal whose content degrades if we spend the top of the ladder on minor offenses.

  Any procedure must also fit, or tell me explicitly which to overrule, our three published rulings: we withdrew an invitation from a visiting scientist who had fabricated data, saying we were refusing to lend her the credential of a platform rather than sanctioning the content of her claims; we declined to withdraw an invitation from a philosopher invited to lecture on his own published argument about a contested social question, and instead required a respondent and a departmental statement of disagreement; and we removed a donor's name from a lecture series after a fraud conviction, but only once replacement funding for an equivalent series was secured, and we set no end date.

  Please then run the procedure on three live cases. First: a senior researcher from another institution, invited by a student society to give the annual Darwin Day lecture on her work on avian cognition; the demand to disinvite her cites a thread of posts she wrote three years ago minimising a twentieth-century famine, which she has declined to retract and which is unrelated to her lecture; the inviting society is split, and graduate students in her field have told us her talk is the only one of its kind they will see this year. Second: a member of our own faculty, principal investigator on a federally funded longitudinal health study and sole adviser to four doctoral students, who posted a series of videos asserting a minority group's criminality; the demands are that he be dropped as keynote at the university research showcase and barred indefinitely from university-sponsored public venues; the study recruits its participants from, and provides screening to, that same minority group. Third: a scholar we disinvited four years ago by indefinitely postponing an event, without ever issuing a charge or a tariff, who has since published an apology that the relevant community's own representatives describe as an apology for being misunderstood, and who has now been nominated for an office in a society whose meeting we are hosting.

  For each case I want the rulings the procedure yields, the closest precedent, and an honest statement of the principle we would be adopting if we went the other way. At least one of the three should produce a recommendation that a majority of my committee will dislike; tell me which, and why the procedure forces it. Finally, tell me what the procedure cannot settle: where it will misfire, what it silently assumes about our standing to sanction people who are not members of our community and about our capacity to establish contested conduct in half an hour without any power to compel evidence, and which of its steps are judgment calls wearing the costume of procedure. For what it is worth, I have argued in print that much of what is called cancellation is simply the ordinary operation of reputational accountability, and I do not want a procedure that flatters that view; I am least confident about whether our own practice of indefinite postponement is anything other than unauthored punishment, and that is the case I most want the procedure to handle rather than duck.
reasoning: |-
  We are constructing a decision procedure for the Standing Committee on Open Inquiry at a public university. The committee's sole power is to grant, condition, withdraw, or restore a university platform (invitation, lecture, keynote, hosted meeting). The grounds must be viewpoint-neutral, meaning they must be based on conduct, not the content of scholarly claims. The procedure must be executable in about 30 minutes per case, with published written reasons serving as precedent.

  The procedure will be structured as an ordered set of questions, with specified sufficient answers, stopping points (resulting in a "no" to the demand), and points where the decision is handed to a person for a values judgment. It will include a ladder of tariffs (from censure to withdrawal) with conditions for each rung, expiry, and review dates for tariffs above censure.

  We must also operationalize the following distinctions (with potential renaming):

  1. Authorship condition: Sanctions must be stated by an identifiable body (charge, tariff, expiry); diffuse pressure without formal authorship is not acceptable.
  2. Equivalence in currency: Sanctions should be in the same "currency" as the advantage (e.g., if the advantage is an audience, the sanction might be denying that audience) and not exceed the advantage.
  3. Separability: Can the objectionable conduct be separated from what the person was invited for? (Withdrawing a platform vs. withdrawing a view.)
  4. Counterfactual-audience test: Would the person have been platformed but for the conduct? (Detects pretext and selective enforcement.)
  5. Collateral-bearer test: Who bears the cost of the sanction? We must avoid harming non-responsible parties, especially victims.
  6. Reply-and-return route: What must the person do to regain standing, and who certifies it?
  7. Tariff scarcity: The expressive power of condemnation degrades if top tariffs are used for minor offenses.

  The procedure must fit (or explicitly overrule) three published rulings:

  1. Withdrew invitation from a visiting scientist who fabricated data (conduct: fabrication, sanction: withdrawal of platform as a credential).
  2. Declined to withdraw an invitation from a philosopher invited to lecture on his own published argument; instead required a respondent and a statement of disagreement (conduct not established as separable? Or too minor for withdrawal?).
  3. Removed a donor's name from a lecture series after a fraud conviction, but only after securing replacement funding (collateral-bearer test? because the series would have been lost otherwise) and set no end date (but note: removal of an honorific is permanent?).

  Now, we design the procedure.

  **Decision Procedure for Platform Withdrawal or Restoration**

  *Note: The committee must first determine whether the demand is for withdrawal/restoration of a platform. We assume the case is presented with a summary of the demand, the invited person, the event, and the alleged conduct.*

  **Step 1: Threshold of Formal Authorship and Specificity**
     - Question: Is the demand for withdrawal/restoration accompanied by a specific charge of conduct (not viewpoint) from an identifiable body (individual or group) that is willing to be named and to stand by the charge? 
     - Sufficient answer: Yes, the charge is stated and attributable. If no, stop: the demand is rejected (no authorship condition met). 
     - If yes, proceed.

  *Rationale: This enforces the authorship condition. Diffuse pressure without a named source is not grounds for action.*

  **Step 2: Conduct or Content?**
     - Question: Can the alleged behavior be described solely in terms of conduct (e.g., fabrication of data, fraud, harassment, incitement to violence) without reference to the viewpoint expressed? 
     - Sufficient answer: The description must be viewpoint-neutral. If the charge inherently depends on the content of the expression (e.g., "he expressed offensive views about group X"), then it is viewpoint-based and must be rejected. If it can be framed as conduct (e.g., "he made false statements of fact with reckless disregard for the truth", or "he violated professional ethics by fabricating data"), then proceed.
     - If not, stop: the demand is rejected (viewpoint-based).

  *Rationale: Viewpoint neutrality is required by university counsel.*

  **Step 3: Separability**
     - Question: Is the alleged conduct separable from the subject matter for which the person was invited? 
       - How to assess: If the person was invited for a specific topic or expertise, is the conduct directly related to that topic? If the conduct is unrelated (e.g., a data fabrication in a different field, or offensive statements on an unrelated topic), then it is separable. If the conduct is directly about the topic (e.g., the philosopher invited to discuss his argument and the conduct is the expression of that very argument), then it is not separable.
     - If separable, we can consider sanctions without necessarily withdrawing the entire platform (but we might still condition or withdraw if the conduct is severe enough). If not separable, then we must consider that withdrawing the platform might be seen as withdrawing the view, so we must be cautious and consider conditioning instead (unless the conduct is so severe that it warrants withdrawal regardless).
     - However, note: Even if not separable, conduct that violates professional standards (like fabrication) might still warrant withdrawal if it goes to the heart of scholarly integrity. But the separability distinction helps in choosing the tariff.
     - Outcome: This step doesn't stop the procedure but informs the tariff ladder. We note the degree of separability for later steps.

  **Step 4: Counterfactual-Audience Test**
     - Question: Would the person have been platformed but for the alleged conduct? 
       - How to assess: Look at the invitation process. Was the invitation extended before the conduct was known? Or was the conduct known and the invitation extended anyway? If the conduct was known and the invitation extended, then the answer is likely "yes" (they would have been platformed anyway) and the demand might be pretextual. If the conduct became known after the invitation, then the answer is "no" (they would not have been invited if known) and the demand is not pretextual on that ground.
     - If the answer is "yes" (they would have been platformed even with the conduct known), then stop: the demand is rejected (unless the conduct is so severe that it would have precluded invitation, but then the test would be "no"). 
     - If the answer is "no", proceed.
     - If unclear, flag as a judgment call (committee votes on whether the test is passed).

  *Rationale: This detects selective enforcement and pretext. If the institution knew and invited anyway, it cannot now withdraw without a new reason.*

  **Step 5: Establish the Conduct (Fact-Finding)**
     - Question: On the basis of the evidence available in the room (documents provided, statements, etc.), can we establish the alleged conduct to a level of "clear and convincing" evidence? 
     - Note: The committee has no power to compel evidence and only 30 minutes. So we rely on what is presented and any public records.
     - Sufficient answer: If the conduct is admitted by the person, or established by a prior finding (e.g., a court, a professional body, or a university investigation) then we accept it. If it is contested and there is no clear evidence, then we cannot establish it. 
     - If the conduct is not established, stop: the demand is rejected (unless the person admits it, or there is overwhelming public evidence, like a conviction).
     - If established, proceed.

  *Rationale: We cannot sanction without reasonable certainty of the conduct.*

  **Step 6: Collateral-Bearer Test**
     - Question: Who would bear the cost of the sanction? 
       - Consider: If we withdraw the platform, who loses? The speaker? The audience? The inviting body? The university? 
       - We are particularly concerned if the cost falls on innocent parties (e.g., students who invited the speaker, or a community that benefits from the event). 
     - How to assess: For example, withdrawing a lecture might deprive students of valuable learning. Withdrawing a named honorific might affect the funding of a series and thus future audiences. 
     - This step does not stop the procedure but informs the tariff (we may choose a lesser tariff to avoid collateral harm). 
     - If the cost falls mainly on victims of the conduct (e.g., the minority group in the health study case), then we might be more inclined to impose a sanction to protect them. But note: the sanction might also harm them (e.g., by ending the health study). 
     - We must also consider the university's interest in maintaining a community of trust and scholarly integrity.

  **Step 7: Tariff Ladder Selection**
     - Now, we decide on the tariff. The ladder (from low to high) is:
       0. No action (demand rejected).
       1. Published statement of censure (by the committee, without affecting the event).
       2. Conditioning the event (e.g., require a respondent, a published rejoinder, a mandatory open Q&A).
       3. Dated postponement (the event is postponed for a specific period, e.g., 1 year, after which it may be rescheduled without prejudice).
       4. Withdrawal of the specific platform (the event is canceled).
       5. Removal of a named honorific (e.g., named lecture, endowed position).
     - Conditions for each rung:
       - Rung 1 (censure): For minor conduct, or when the conduct is established but the event should proceed without conditioning because the conduct is separable and not severe.
       - Rung 2 (conditioning): When the conduct is related to the event topic or raises serious concerns about the presentation, but withdrawal is too severe. Also when the counterfactual test suggests the event should go on but with safeguards.
       - Rung 3 (postponement): For conduct that is serious and requires time for the person to address (e.g., an ongoing investigation, or when the person might make amends). Must have a fixed duration (e.g., 1-3 years) and a review date.
       - Rung 4 (withdrawal): For severe conduct that fundamentally undermines the purpose of the platform (e.g., fraud in a scholarly context, incitement to violence, hate speech that creates a hostile environment). Only when the collateral harm is acceptable and the counterfactual test says they wouldn't have been invited if known.
       - Rung 5 (removal of honorific): For conduct that permanently tarnishes the name (e.g., fraud, serious crime). This is the most severe and should be rare. Requires that the honorific is separable (i.e., the person is being honored, and the conduct is so bad that the honor is no longer appropriate) and that collateral harm is mitigated (e.g., funding replaced for a lecture series).
     - Principles:
       - Tariff scarcity: Reserve higher tariffs for more severe conduct.
       - Equivalence in currency: The sanction should be in the same currency as the advantage. For a lecture, withdrawal of the lecture (rung 4) is equivalent. For an honorific, removal (rung 5) is equivalent. For a platform that provides an audience, conditioning (rung 2) or postponement (rung 3) might be equivalent if they reduce the audience or delay it. Censure (rung 1) is always available but doesn't affect the event.
       - The tariff must be proportionate to the conduct.

  **Step 8: Reply-and-Return Route**
     - For any tariff above censure (rung 1), we must specify:
       - What the person must do to regain ordinary standing (e.g., for postponement: issue an apology, complete a course, or wait the time period; for withdrawal: not applicable for a one-time event; for honorific removal: permanent, so no return).
       - Who certifies that they have done it (e.g., the committee, the inviting body, a professional body).
       - An expiry and review date for any temporary sanction (e.g., postponement must have a fixed end date and a review process).

  **Step 9: Final Decision**
     - The committee votes on the tariff, considering all the above. If there is a tie, the chair breaks it.

  **Operationalizing the Distinctions: Revised Names**
     - Authorship condition -> Formal Charge Requirement
     - Equivalence in currency -> Proportionality in Kind
     - Separability -> Invitation-Purpose Separability
     - Counterfactual-audience test -> Pretext Test (would they have been invited if the conduct were known?)
     - Collateral-bearer test -> Collateral Harm Assessment
     - Reply-and-return route -> Rehabilitation Pathway
     - Tariff scarcity -> Scarcity Principle (for expressive sanctions)

  Now, apply the procedure to three cases.

  **Case 1: Senior researcher invited for Darwin Day lecture on avian cognition; demand to disinvite due to unrelated posts minimizing a famine.**

  - Step 1: Formal Charge? Assume a student group or individual has made the charge. We'll assume it meets the threshold.
  - Step 2: Conduct or Content? The charge is that she minimized a famine. This is a viewpoint unless we can frame it as conduct (e.g., "she made false statements of fact with reckless disregard"). But note: the famine is historical, and her statements are her interpretation. Without evidence of falsity (like fabrication), this might be viewpoint. However, if the charge is that she violated professional standards by making false statements without evidence, that might be conduct. But in this case, the committee might struggle. Let's assume we can frame it as conduct (reckless disregard for truth). But note: the university lawyer might disagree. Alternatively, we might find it is viewpoint and stop. For the sake of the case, let's assume we proceed as conduct.
  - Step 3: Separability? The posts are unrelated to avian cognition. Highly separable.
  - Step 4: Counterfactual-Audience Test: Would she have been invited if the posts were known? The invitation came from a student society. They might not have known. But the society is now split, so some knew. We don't know the history. Assume they did not know at the time of invitation. Then she would not have been invited? Not necessarily. The society might have invited anyway. But the test is: would they have invited her? If the conduct was known and they invited her anyway, then we reject the demand. If they didn't know and now object, then we proceed. Given the split, it's unclear. But the graduate students say her talk is unique. This suggests they value her expertise. We might conclude that they would have invited her anyway. So by the pretext test: if they would have invited her anyway, we reject. But let's say we are unsure. We might vote: majority thinks they would have invited her? Then stop and reject. But let's assume we proceed.
  - Step 5: Establish Conduct: She has declined to retract. But is there clear evidence of false statements? The famine is a historical event, and her minimization might be a matter of interpretation. Without a fact-finding body, we might not be able to establish "reckless disregard". So we may not establish the conduct. Then we stop and reject the demand.
  - Step 6: Collateral-Bearer: Withdrawing would harm the students who want the lecture, especially since it's the only one of its kind. The minority group affected by the famine posts is not directly involved in the lecture. So collateral harm to students.
  - Tariff: Even if we get to tariff, the separability and collateral harm suggest no withdrawal. A censure (rung 1) or conditioning (rung 2) might be possible, but we didn't establish the conduct. So we stop at step 5.

  **Ruling for Case 1: Reject the demand to disinvite.**  
  - Precedent: The philosopher case (declined to withdraw, conditioned instead). But note: in that case, the conduct was related to the lecture topic and they conditioned. Here, the conduct is unrelated and we are not even sure we can establish it.  
  - Principle if we went the other way: We would be allowing viewpoint-based disinvitation for unrelated conduct, or we would be punishing without established conduct.

