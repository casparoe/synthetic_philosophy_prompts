  During the lunch break before the final debate round, Alex and Jordan review their strategies. Alex, the first speaker, must choose at the last second between an economic strategy (A) or a social justice strategy (B), based on the opponents' case. Jordan, giving the first rebuttal, must prepare now. Alex knows that if Jordan senses Alex is committed to A, Jordan will prepare only A; if committed to B, only B; but if Alex is genuinely undecided, Jordan will prepare both. The team wins only if Jordan is prepared for the strategy Alex chooses. Alex realizes that if they decide now, Jordan will focus on that, but then the opponents might make the other strategy better. If Alex remains undecided, Jordan prepares both, and Alex can choose optimally. Alex deliberately avoids forming an opinion, remaining uncertain, and Jordan, perceiving this, prepares both. In the round, the opponents' case favors B, Alex chooses B, and they win.

  Views:

  (T) The transparency view: A rational agent should seek accurate self-knowledge. Alex should therefore form the best possible prediction of their future choice. Given no information about the opponents, Alex might assign equal probability to A and B. But once Alex forms this belief, they become committed to the strategy they believe is more likely (or feels compelled to choose one to be decisive). They then inform Jordan, say, "We'll do A." Jordan prepares only A. In the round, if the opponents favor B, Alex either switches to B (causing Jordan to be unprepared and they lose) or sticks with A (which is suboptimal and they lose). Thus, T leads to a loss.

  (C) The deliberation-blind view: Alex holds their own future action as a free variable and treats their self-belief as fixed. At the preparation stage, Alex has a self-belief, say, that they are likely to choose A (because they are more familiar with it). This belief is fixed. Jordan, sensing this belief, prepares only A. At the round, Alex sees that B is better but knows that Jordan is prepared only for A. If Alex chooses B, Jordan is unprepared, and they lose. If Alex chooses A, they might lose if A is suboptimal. Thus, Alex is forced to choose A, and if the opponents make B better, they lose. Had Alex had a self-belief of uncertainty, Jordan would have prepared both, but under C, Alex cannot choose their self-belief; it's fixed. So with a fixed self-belief of preferring A, they lose when B is better.

  (E) The procedure-design view: Alex chooses a decision-making procedure: "I will avoid forming any opinion about A or B until I see the opponents' case. This will keep me genuinely uncertain, which will cause Jordan to prepare both. Then, at the round, I will choose the best strategy based on the opponents." Alex executes this procedure. Jordan, seeing Alex's genuine uncertainty, prepares both. In the round, Alex chooses B, and they win. E wins.

  Then, the single feature doing the work: Jordan's response depends on Alex's genuine self-knowledge state. If Alex is genuinely uncertain, Jordan prepares both; if not, Jordan prepares only the strategy Alex is committed to.

  If we remove this feature, and instead Jordan always prepares both, then the case is simply about flexibility in decision-making, and self-knowledge is irrelevant. Alex can know or not know without affecting Jordan. Then T and C might both recommend waiting to decide, and E is the same.

  The strongest reply for T: The winning move under E is self-deception. By avoiding forming a belief, Alex is deliberately keeping themselves in the dark. This is not true self-knowledge; it's a form of self-manipulation that might have costs in other contexts. Moreover, in this case, it worked, but in the long run, agents who avoid self-knowledge might make poorer decisions when they cannot rely on others to compensate.

  But E can reply that for embedded agents, self-knowledge is not just for accuracy but for coordination. In this case, the procedure is chosen to achieve the best outcome, and it includes managing self-knowledge as a design parameter.

  We'll go with this.
