  Combining these... conditional math gives (1) * [(2) OR (3)] * (4). The OR operation needs finessing—probably max(2,3). That puts me around 0.6 overall. 

  Sensitivity check: term (3) dominates. If praiseworthiness is merely internalized community norms, the independent reading collapses. But Smith's language ("man within the breast") suggests transcendence. The user's charity dilemma matters here: is this Smith's genius or my imposition? 

