prompt: |-
  Hi — I work in a tiny unit that writes the "generational impacts" annex for anything the health department puts to cabinet that will still be running in twenty-five years. Two or three a month, half a day each, and the draft gets signed off by a director who's a lawyer by training and has no patience for anything she can't paste into a submission. There are no philosophers on staff.

  Here's the thing that keeps eating our afternoons. Our costing rule (s.12(3) of our enabling regulation, don't ask) says we can only count a cost if it's a cost **to a person**, and we've realised that a lot of our programmes don't harm anybody in the sense the rule seems to want. A programme that changes when people conceive, or how many children they have, or where they end up living, doesn't leave the future population worse off — it leaves a *different* future population in place, one that (mostly) has lives worth having. The people who end up harmed wouldn't have existed at all under the alternative, so nothing we do makes them worse off than they would otherwise have been. I gather this is the sort of thing people call Parfit's non-identity problem; I've read the wikipedia page and one very short SEP entry and that's the ceiling of the theory we have in-house.

  So I need a procedure, not a theory. Something I can actually run in half a day on a real proposal, in this order:

  - a **triage step** that labels the proposal. My predecessor left behind three labels I've inherited and half-understood: *L* (locked — the affected future people are going to exist either way), *S* (swapped — same number of future people, different ones), and *T* (thinned or thickened — the number changes too). I want those made precise enough to apply, and I suspect they're not exhaustive: we keep hitting *partial* shifts, where a programme locks some people in place and swaps others, and "near-misses" where a swapped person ends up worse off than a locked person in a way that isn't a harm to *them*.
  - a **locking horizon**. The further out you go, the more any intervention scrambles who gets conceived — after a couple of generations, presumably *everything* is an S case and nothing is ever a cost, which can't be the right result. So the procedure needs to say how far out we're allowed to treat identity as determinate before we call it indeterminate, and what we do in the indeterminate band.
  - an explicit **stop** rule: the point at which we write "no count" and close the file, versus the point at which we hand the question up as a values call (ministers, not us) because the remaining disagreement isn't empirical.
  - a **sufficiency rule** for each question — what actually counts as an answer at half-a-day's effort, including what we do when the epi modelling can't tell us whether conception timing moves.

  Please run it on three real-ish proposals:

  1. A publicly funded IVF protocol that moves a lot of patients to freeze-all cycles, i.e. transfers happen months later than they would have. Same number of children, different children.
  2. A means-tested child benefit that changes completed family size, so the number of future people changes as well as who they are.
  3. A flood-defence and relocation scheme, twenty-year build, that changes where a coastal population lives and therefore who is conceived over the next several decades. This is the one I'm dreading: if the procedure says the entire future harm budget can't be counted, we lose the strongest line in the business case for the scheme our ministers most want. I'd rather find that out from you than from my director.

  Can you write it up as:

  1. **The trap, in one paragraph** — about 150 words, something I can paste at the top of the annex.
  2. **The procedure, step by step** — about 700 words, the questions in the order I should ask them, with the stop and hand-up points marked.
  3. **Three cases** — about 700 words, the procedure run on each of the three above, including whatever answer it gives on number 3.
  4. **Where this breaks** — about 300 words, the cases the procedure will misfire on and the bits of it that are judgement calls wearing a hi-vis vest.
  5. **What I tell my director** — about 200 words, the honest version of what this annex can and can't claim.

  Please don't give me a reading list or footnotes — I can't chase references and wouldn't understand them anyway. And keep the jargon to a minimum; if a term is unavoidable, define it in the sentence.
reasoning: |-
  Okay, let me tackle this complex policy problem step by step. The user works in a government health unit that assesses long-term impacts of policies, and they're stuck on how to count costs when policies affect who exists in the future - that's Parfit's non-identity problem in practice. 

  First, I need to understand their operational constraints: tiny team, half-day per assessment, legally trained director who hates theory. They inherited a labeling system (L/S/T) but find it doesn't cover partial cases. The core tension is between their costing rule (must harm a person) and the reality that many policies create different (but still worthwhile) lives rather than harming existing people.

  Hmm... the user's real pain points seem to be:
  - Practical application of philosophical concepts under time pressure
  - Fear of invalidating their minister's pet project (the flood scheme)
  - Needing concrete decision rules, not debate

  For the procedure, I should:
  - Refine their L/S/T labels to handle partial cases by dominant effect
  - Set a locking horizon (20-30 years?) based on conception predictability
  - Build in off-ramps where they can stop analysis
  - Define evidence thresholds for "good enough" answers

  The three test cases are perfect for stress-testing:
  1. IVF timing change (pure S case - different children)
  2. Child benefit affecting family size (T case - different number)
  3. Flood defenses (mixed case with time horizon critical)

  For the flood case specifically... that's tricky. Early years might have locked individuals, but beyond 20-25 years it becomes indeterminate. The business case harm probably falls in the indeterminate zone. I'll need to show how the procedure leads to that conclusion without sugarcoating.

  The "where it breaks" section should warn about:
  - Marginal existence cases (lives barely worth living)
  - Cascading identity effects
  - When "no harm" feels morally wrong despite the logic

  For the director, I'll emphasize procedural rigor over philosophical perfection - this gives defensible answers under constraints, not absolute truth. The key message: "We flag when costing disappears due to identity effects, so ministers know they're making value calls."

  Better avoid all academic jargon. Define any necessary terms like "locked/swapped/thinned" inline. No references - they explicitly said no reading lists. Keep explanations in health policy operational language.
answer: |-
  ## 1. The Trap (150 words)
  Our costing rule requires identifying specific future individuals harmed by a policy. However, many health interventions subtly shift who exists in the future by changing conception timing, family size, or location. The future individuals who might seem "harmed" (e.g., living in a flood-prone area due to a delayed defence scheme) would *not exist at all* under the alternative policy. Since they aren't worse off than they would otherwise have been (as they wouldn't otherwise exist), we cannot count this as a "cost to a person" under our rule. This is the non-identity trap. It means major future impacts – even obvious harms like increased flood risk – disappear from our cost calculations if they stem from identity-shifting effects, potentially undermining the rationale for long-term preventative investments. Our procedure identifies these cases transparently.

  ## 2. The Procedure (700 words)

  **Goal:** Determine if a policy's future impact can be counted as a cost *to a person* under s.12(3), given identity-shifting effects.

  **Step 1: Triage (Identity Effect Label)**
  *   **Question:** How does the policy change the identity or number of future people compared to the *Do Nothing* alternative, specifically for the population cohort impacted by the policy's long-term effect? Focus on the *dominant effect* for the key impacted cohort(s).
  *   **Labels:**
      *   **Locked (L):** The specific individuals who experience the future impact *would exist anyway* under the Do Nothing scenario. Their conception timing/location/parentage is unaffected. *(e.g., Policy delays a known infrastructure project affecting existing residents' future flood risk).*
      *   **Swapped (S):** The policy changes *who* is conceived (different individuals), but the *number* of people in the impacted future cohort is the same as under Do Nothing. *(e.g., IVF timing change leading to different children born).*
      *   **Thinned/Thickened (T):** The policy changes the *number* of people in the impacted future cohort compared to Do Nothing. Identity is inherently changed. *(e.g., Child benefit changing average family size).*
      *   **Partial (P):** The cohort includes a mix of L and S/T individuals. Assign the dominant label (>50%) if possible. If significant mix persists, proceed to Step 2b/3 cautiously.
      *   **Near Miss (NM):** An S or T individual ends up worse off than an L individual *would have been* under Do Nothing. BUT, crucially, they are not worse off than *they themselves* would have been (which is non-existence).
  *   **Stop Point 1:** If **L Dominant**, proceed to standard cost assessment (harm *can* be counted). If **S, T, P, or NM**, proceed to Step 2.

  **Step 2: Locking Horizon & Indeterminate Band**
  *   **Question:** How far into the future can we reasonably assume the identity of people experiencing the impact is "Locked" (L)?
  *   **Rule:** Identity becomes indeterminate ("Swapped" or "Thinned/Thickened") **25 years** after a policy's primary effect on conception/location decisions begins. This is based on the average time for one generational shift (parent -> child conception).
      *   **Impact within 25 years:** Treat as potentially Locked (**Provisional L**). Proceed to Step 2b.
      *   **Impact beyond 25 years:** Treat as Swapped or Thinned/Thickened (**S/T**). Identity is assumed indeterminate. Proceed to Step 3.
  *   **Step 2b: Locking Test (For Provisional L within 25 years)**
      *   **Question:** Can we demonstrate with reasonable confidence (e.g., epidemiological modelling, demographic data) that the specific individuals impacted *would exist* under the Do Nothing scenario? (Focus on conception timing/location/parental identity).
      *   **Sufficiency Rule:** If modelling/data shows >80% likelihood of same conception cohort existing under both policy and Do Nothing, treat as **L**. Count costs. If modelling is inconclusive (<80% confidence) OR shows significant swapping/thinning (>20%), revert to **S/T** label. Proceed to Step 3.
      *   **Stop Point 2:** If **L Confirmed** (via Step 2b), count costs. If **S/T** (from Step 2 or 2b), proceed to Step 3.

  **Step 3: Non-Identity Assessment & Hand-Up**
  *   **Question:** For impacts labelled S, T, P, or NM (including impacts beyond 25 years or indeterminate within 25 years), can we identify a cost *to a person*?
  *   **Rule:** If the impact affects individuals who *would not exist* under the Do Nothing scenario (S/T/P/NM), then *by definition*, the policy does not make those specific individuals *worse off* than they would otherwise have been (non-existence). Therefore, **no cost to a person** exists under s.12(3) for these identity-shifted impacts.
  *   **Hand-Up Point:** If the impact is severe (e.g., widespread future suffering, existential risk) but falls under S/T/P/NM, **flag for Ministerial Values Call**. State clearly: "Policy creates significant future burden X, but due to identity-shifting effects (S/T), this burden falls on individuals who would not exist otherwise. S.12(3) does not permit counting this as a cost to a person. Whether this future burden constitutes a 'cost' requiring policy adjustment is a value judgement for Ministers."
  *   **Stop Point 3:** For all S/T/P/NM impacts not flagged for Hand-Up, conclude **"No count"** under s.12(3). Close the file.

  ## 3. Three Cases (700 words)

  **Case 1: IVF Freeze-All Protocol**
  *   **Triage (Step 1):** Moves conception timing for specific births. Same number of children born per patient, but different children conceived (different eggs/sperm combinations due to timing). **Label: S (Swapped)**.
  *   **Locking Horizon (Step 2):** Impact is on the children conceived. Identity is swapped *immediately* (first cycle affected). **Result: S** (No Provisional L possible).
  *   **Non-Identity Assessment (Step 3):** Any future impact (health, cost) on these specific children affects individuals who would not exist under the old protocol (Do Nothing). They are not worse off than they would have been (non-existence). **Result: No count** under s.12(3) for impacts on the swapped children. (Note: Costs *to parents* during treatment are L and countable).

  **Case 2: Means-Tested Child Benefit**
  *   **Triage (Step 1):** Changes completed family size for some families. Fewer/more children born overall. **Label: T (Thinned/Thickened)**.
  *   **Locking Horizon (Step 2):** Impact starts immediately on conception decisions. Identity/number changes *immediately* for the additional/missing children. **Result: T** (No Provisional L possible for the affected cohort - the children whose existence depends on the benefit).
  *   **Non-Identity Assessment (Step 3):** Future impacts (e.g., lower lifetime earnings for a child born into a larger, poorer family due to the benefit) affect a child who *would not exist* without the benefit. They are not worse off than they would have been (non-existence). Impacts on *existing siblings* whose resources are diluted might be L if their conception was unaffected. **Result: No count** under s.12(3) for impacts on the additional children whose existence depends on the policy. Costs to existing siblings/parents/society are potentially L and countable.

  **Case 3: Flood Defence & Relocation Scheme (20-year build)**
  *   **Triage (Step 1):** Changes where people live over decades, affecting who meets whom and when they conceive children. Likely changes both *who* exists (S) and potentially *how many* exist (T) in future coastal cohorts. **Label: P (Partial - Mix of L and S/T expected)**, but dominant effect likely S/T over time.
  *   **Locking Horizon (Step 2):** Impact on conception starts as soon as relocation begins.
      *   **Impact within ~25 years (e.g., Years 20-45):** **Provisional L** for some. Apply Step 2b. Modelling population movement and conception over 20+ years is highly uncertain. Likelihood of same individuals >80% is very low (<20%) after ~5-10 years of disrupted settlement patterns. **Result: S/T Dominant** for most of this period.
      *   **Impact beyond ~25 years (e.g., Year 45+):** **Result: S/T** (Indeterminate).
  *   **Non-Identity Assessment (Step 3):**
      *   **Years 0-20:** Costs during construction (disruption, direct costs) affect *existing* locked individuals (L). **Countable**.
      *   **Years 20-45+:** Future flood risk/harms (the major cost avoided by the scheme) primarily affects individuals whose existence depends on the relocation pattern (S/T). They are not worse off than they would have been (non-existence under Do Nothing, or existence in a different location). **Result: No count** under s.12(3) for these future avoided harms/risks.
  *   **Hand-Up Point:** The *unavoided future flood risk/harm* under the Do Nothing scenario also falls on S/T individuals beyond the locking horizon! However, the *magnitude* of potential future suffering (even if uncountable as a "cost to a person") is vast. **Flag for Ministerial Values Call:** "The core future harm/benefit of the flood scheme (avoided damage post-Year ~25) impacts identity-shifted populations (S/T). S.12(3) does not permit counting these future harms/benefits as costs to persons. Ministers must decide whether the significant *uncounted* future burden avoided (widespread property loss, potential loss of life affecting future generations) constitutes a sufficient rationale for the scheme, alongside the countable costs (construction) and benefits (reduced risk to *existing* locked individuals over the next ~25 years)."

  ## 4. Where This Breaks (300 words)

  *   **Marginal Existence & Worthwhile Lives:** The procedure assumes swapped/thinned lives are "worth having." It breaks if a policy causes lives so awful the individuals might rationally prefer non-existence (e.g., severe genetic disorder knowingly caused). Our procedure (Step 3) would still say "no harm to *them*" versus non-existence, but this feels morally wrong. **Judgement:** Treat exceptionally severe suffering as a potential Hand-Up, even within S/T.
  *   **Cascading Shifts:** Small, early swaps (S) can lead to large, unforeseen downstream T/S effects (e.g., one swapped person influences many future conceptions). Our 25-year horizon simplifies this. **Judgement:** If modelling shows *extreme* cascade potential within the locking horizon (Step 2b), lean towards S/T earlier.
  *   **Partial Shifts (P):** Determining the "dominant" effect (Step 1) is often guesswork. **Judgement:** Be conservative. If significant doubt (>20% S/T), proceed to Step 2/3. Document the uncertainty.
  *   **Near Misses (NM):** The intuition that "someone is harmed" is strong when an S person has a life much worse than the L person who *would* have existed. The procedure strictly says "no count" (Step 3). **Judgement:** This is the core non-identity trap. Stick to the rule but use Hand-Up for severe NM cases where the "harm" feels policy-relevant.
  *   **Epistemic Limits (Step 2b):** The 80% confidence threshold is arbitrary. **Judgement:** It's a procedural necessity. Document modelling limitations clearly. If data is utterly lacking, default to S/T within the locking horizon.

  ## 5. What I Tell My Director (200 words)

  Director,

  This annex identifies a critical constraint in our costing rule (s.12(3)). For policies affecting *who* exists in the distant future, we often cannot identify specific individuals harmed – the "harmed" individuals wouldn't exist under the alternative. Legally, this means we cannot count those future impacts as costs or benefits under the rule.

  The procedure systematically flags these cases:
  1.  **Labels interventions** (Locked, Swapped, Thinned/Thickened).
  2.  **Sets a 25-year horizon** for treating identity as fixed (based on generational shift).
  3.  **Requires empirical evidence** to claim identity is locked within 25 years.
  4.  **Outputs are clear:**
      *   **"Count"**: Impacts on provably "Locked" individuals.
      *   **"No Count"**: Impacts on identity-shifted individuals (Swapped/Thinned), as per the rule.
      *   **"Hand-Up"**: Significant uncounted future burdens/benefits requiring a Ministerial values judgement on whether they justify the policy *despite* being uncountable under s.12(3).

  **Bottom Line:** This annex ensures legal compliance with s.12(3) and transparently reveals when major long-term impacts vanish from the cost calculation due to identity shifts. It does *not* assess the overall moral or policy merit; it highlights where that judgement falls to Ministers. For the flood scheme, it means the core long-term benefit (avoided damage decades out) is likely uncountable as a cost avoided, necessitating a Ministerial call.
