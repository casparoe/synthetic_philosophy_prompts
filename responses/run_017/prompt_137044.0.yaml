  On progress: Real progress would involve either clarifying the concept of "could have done otherwise" or shifting focus to source conditions. Empirical work on folk intuitions might help, but philosophical refinement is needed. The field might need to acknowledge that PAP isn't the crux and focus on sourcehood.

