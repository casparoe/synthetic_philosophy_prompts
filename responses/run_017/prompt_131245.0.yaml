  Key challenges I need to address:
  - Their vocabulary is deeply rooted in physical systems with clear constraints, while AI alignment deals with more abstract reasoning about goals and beliefs
  - Control engineering relies heavily on physical interlocks and independence, while AI alignment considers scenarios where the system could manipulate its operators
  - They explicitly want me to avoid quietly importing assumptions from their field

  For the residue report, I need to identify:
  (a) Concepts with no control-theoretic equivalent (like strategic adversaries that adapt to the controller, or constraint sets revealed through intervention)
  (b) Control engineering resources not present in AI alignment (quantitative margins, independence requirements, defense-in-depth)

  The user seems skeptical about whether the alignment community is overcomplicating what engineers would solve with physical interlocks. But they're also aware autonomous systems might defeat traditional safety approaches. I need to give an honest assessment about whether their field's confidence relies on assumptions that don't hold for general AI systems.

  I'll structure this carefully:
  1. Stage-by-stage translation using their terms
  2. Testing their two proposed mappings
  3. Residue report highlighting true gaps
