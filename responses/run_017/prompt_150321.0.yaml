prompt: |-
  Hi — hoping you can help me put something together that my committee can actually use.

  I'm the governance officer (clerk, minute-taker, and de facto rules nerd) for a professional institute of about 9,000 members. Our rulebook is amended at the AGM and at emergency general meetings — 30 or 40 substantive motions a year, plus the occasional one shoehorned in between. My job is to rule, sometimes in advance of the vote and sometimes the morning after, on whether a motion that carried actually changed the rules, or whether it's void / void in part / did something different from what the proposer thought. I then give the Rules Committee three or four paragraphs of written reasons they sign off on. Two of my rulings have ended up in front of a judge, so they can't be hand-wavy; but the committee is five lay trustees who will not sit through a lecture on self-reference, and I usually have about two days from motion to ruling.

  The bit we keep crashing into is that the rules govern their own amendment, and the drafting is a mess. Roughly:

  - Rule A1: rules may be amended by a two-thirds majority at a general meeting; A1 itself may be amended only by a three-quarters majority.
  - Rule A2: the rules in force are those printed in the current Handbook, as updated by the Secretary. The Handbook is reprinted every other year, so what members vote against and what's on the shelf are often two different texts.
  - Rule A3: if part of an amendment is void, the rest stands.
  - Rule A4: no amendment may remove an accrued right of a member. Nobody knows what accrued means here; we've been reading it as a right someone has already started to exercise.
  - Rule A5: defines who counts as a voting member.

  So: give me a decision procedure. Ordered questions, what counts as an answer to each one, where the procedure stops with a no, and where it hands the decision to the committee because it's a values call dressed up as a rule question. It has to be runnable in an afternoon with the rulebook and the minutes, and it has to handle self-referential amendments specifically — an amendment that changes the threshold it has to clear, a rule that tries to lock itself against later amendment, a motion that repeals the amending power and hands it somewhere else. Please don't just tell me these are paradoxical; I still have to issue a ruling on Monday.

  Run it on these:

  1. A motion to lower the general amendment threshold in A1 from two-thirds to a simple majority. It got 68%. Did it carry, and if so what threshold applies to next year's motions?
  2. In 2022 a motion added to Rule 14 (the subscription cap) the sentence "Rule 14 may not be amended or repealed." Passed 71%. In 2024 a motion to repeal Rule 14 outright passed 69%. What's in force now — and was the 2022 lock itself valid, given A1?
  3. A single motion, passed 78%, repealing A1 and replacing it with "the Board may amend these Rules by resolution." Do we still have a rulebook, and can a later board resolution be challenged?

  And two hard cases the procedure has to say something about: (a) the 2019 Members' Charter — a block of protections including a right to appeal expulsion, inserted by a 71% vote, with a preamble saying these are fundamental and shall not be amended; this year a 70% motion deleted the appeal right. My instinct, and the members', is that the preamble protects it. I suspect the procedure will tell me otherwise. (b) A motion to exclude retired members from voting, which passed 67% counting the retired members who voted and 61% excluding them — the amending majority depends on the content of the amendment.

  Please flag where the procedure can't settle things: rules we've all been relying on for years that were probably never validly adopted, and the printed-Handbook lag under A2. And tell me what it can't do at all. No need for citations or further reading — I want the tests and the reasons, not a reading list.
reasoning: |-
  Okay, let me tackle this governance officer's problem. The user needs a practical decision procedure for ruling on rule amendments that's both legally sound and usable by lay trustees. 

  First I need to understand the core tension: the rules govern their own amendment, creating potential paradoxes, while the user must issue binding rulings quickly. The five existing rules (A1-A5) form a messy self-referential system. Key pain points are: self-amending thresholds (A1), the Handbook lag (A2), severability (A3), vague "accrued rights" (A4), and membership definitions affecting voting (A5).

  For the decision procedure, I consider structuring it as a flowchart of yes/no questions. Each step should have clear pass/fail criteria and indicate when to stop or escalate. The sequence should start by verifying basic validity before tackling self-reference issues. 

  Testing scenarios immediately come to mind:
  - The threshold-lowering motion (68% vote) tests whether new thresholds apply instantly
  - The Rule 14 lock/repeal conflict questions if "entrenched" clauses can exist under A1
  - The A1 replacement motion examines whether the board can inherit amendment powers
  - The Members' Charter case probes if preambles create binding constraints
  - The retired members vote shows how amendment content affects voting eligibility

  For the Handbook lag under A2, I note it creates special problems: members may vote on outdated texts, and printed rules may not reflect actual governance. The procedure should flag this for committee attention since it's systemic.

  Where the rules are silent (like defining "accrued rights"), I build in escalation points. The committee must decide these value judgments - the procedure can only highlight the ambiguity. Similarly, historical validity questions about long-standing rules should trigger warnings but not automatic invalidation.

  The hardest design challenge is handling self-amendment without getting stuck in paradox loops. My approach is to prioritize functionality: if an amendment breaks the amendment system itself, it should be void. But if it modifies thresholds or procedures while leaving the system intact, it may stand.

  For the test cases:
  - The 68% threshold change fails because it didn't meet the current A1 requirement for amending itself
  - The Rule 14 lock was invalid from the start since A1 doesn't allow unamendable rules
  - Replacing A1 with board authority voids the motion entirely - it destroyed the amendment mechanism
  - The Members' Charter preamble is unenforceable under A1
  - The retired members vote requires checking voting eligibility under both old and new rules

  I make sure to include "can't resolve" flags for issues like the Handbook lag or historically questionable rules where the committee must decide based on practical governance rather than strict validity.
answer: |-
  Here's a streamlined decision procedure designed for speed and clarity, focusing on your core rules (A1-A5) and common pitfalls. It follows **6 ordered questions**, with clear stopping points ("**VOID**"), committee referrals ("**REFER**"), and outputs. Self-referential amendments are handled explicitly.

  ---

  ### **Rule Amendment Validity Decision Procedure**
  **(Use with Current Rulebook, Motion Text, & Voting Minutes)**

  1.  **DOES THE MOTION CLEAR THE APPLICABLE THRESHOLD UNDER *CURRENT* A1?**
      *   *Check:* Majority required by **A1 as written at meeting time**. Threshold for A1 changes is 75%; all else is 66.6...%.
      *   *If NO:* **VOID** (Stops here).
      *   *If YES:* Proceed.
      *   *Special Case (A5 impact):* If the amendment *changes voting eligibility*, calculate the result **BOTH** ways (including/excluded affected members). If it passes **ONLY ONE WAY**, **REFER** to Committee (Values/Policy: Who is the electorate?).

  2.  **DOES THE AMENDMENT INVALIDATE OR REMOVE THE *ENTIRE* AMENDING POWER (A1) WITHOUT PROVIDING A VALID REPLACEMENT MECHANISM?**
      *   *Check:* Does it repeal A1, or set its threshold impossibly high (e.g., 100%), *without* establishing *another* clear, operable method (e.g., board power, new GM process) for future amendments?
      *   *If YES:* **VOID** (Irreparably breaks governance continuity). Stops here.
      *   *If NO:* Proceed. (Modifying A1 is allowed, removing it entirely is not).

  3.  **DOES THE AMENDMENT ATTEMPT TO MAKE A RULE (OR PART) *IMMUTABLE* ("SHALL NOT BE AMENDED")?**
      *   *Check:* Does it contain phrases locking rules against future amendment (e.g., "Rule X may not be amended")?
      *   *If YES:* That specific clause/lock is **VOID** (Contradicts inherent amendability under A1). Proceed to Step 4 with the *rest* of the amendment.
      *   *If NO:* Proceed.

  4.  **DOES THE AMENDMENT REMOVE AN *ACCRUED RIGHT* (UNDER A4)?**
      *   *Check:* Does it remove a **right a member has *already initiated action upon*** (e.g., mid-process appeal, pending benefit claim), *not* just future rights?
      *   *If YES (Removes Accrued Right):* **VOID** that specific provision *only*. Proceed to Step 5 (Severability applies).
      *   *If NO or UNCLEAR:* **REFER** to Committee (Values/Policy: Interpretation of "accrued" & impact on members). *Your "initiated action" test is sound, but Committee must endorse.*
      *   *Note:* Preamble statements ("fundamental") are **NOT** binding rights (A4 is about *action*, not sentiment).

  5.  **APPLY SEVERABILITY (A3):**
      *   *Check:* If any part was voided in Steps 3 or 4, can the **remaining parts** of the amendment:
          *   (a) Stand alone grammatically and logically?
          *   (b) Operate independently?
          *   (c) Reflect a coherent intent *separate* from the void part?
      *   *If YES:* Amendment is **PARTIALLY VALID** (Void parts discarded, valid parts enacted).
      *   *If NO:* Amendment is **VOID IN ITS ENTIRETY** (Stops here).

  6.  **IS THE AMENDMENT SELF-REFERENTIAL REGARDING ITS *OWN* VALIDITY THRESHOLD?**
      *   *Check:* Does it **change the threshold in A1** *and* its vote % met the *old* threshold but *not* the *new* one it tries to establish?
      *   *If YES:* **VOID** (Cannot bootstrap a lower threshold; validity determined by rule *at time of vote*). Stops here.
      *   *If NO:* Amendment is **VALID** (or PARTIALLY VALID per Step 5).

  ---

  ### **Application to Your Test Cases & Hard Cases**

  1.  **Lower Threshold to Simple Majority (68% vote):**
      *   Step 1: Passed? 68% > 66.6%? YES (Under current A1).
      *   Step 2: Remove amending power? NO (Modifies it).
      *   Step 3: Make immutable? NO.
      *   Step 4: Remove accrued right? NO.
      *   Step 5: N/A (No void parts yet).
      *   Step 6: **Self-referential threshold? YES**. It changes A1 threshold. Vote (68%) met *old* threshold (66.6%) but *not* the *new* one it tries to set (50%). **VOID**.
      *   *Ruling:* Motion void. Threshold remains 2/3 (66.6...%). Next year's motions require 2/3.

  2.  **Rule 14 Lock (2022: 71%) & Repeal (2024: 69%):**
      *   *2022 "Lock" Motion:*
          *   Step 3: Attempts to make Rule 14 immutable? **YES**. Lock clause ("Rule 14 may not be amended") is **VOID** per Step 3. Remainder (adding text *to* Rule 14, if any) proceeds.
          *   *Ruling (2022):* Lock clause void. Rule 14 amended as proposed *minus* the lock.
      *   *2024 Repeal Motion (Assuming 69%):*
          *   Step 1: Passed? 69% > 66.6%? YES (Current A1 threshold).
          *   Step 2: Remove amending power? NO (Repeals specific rule, not A1).
          *   Step 3: Make immutable? NO.
          *   Step 4: Remove accrued right? **REFER** (Does Rule 14 involve accrued rights? e.g., capped fees paid based on old rule? Committee must decide).
          *   *If Committee says NO accrued right:* Proceeds. Rule 14 repealed.
          *   *If Committee says YES accrued right:* Void repeal for Rule 14.

  3.  **Repeal A1, Give Power to Board (78%):**
      *   Step 1: Passed? 78% > 75%? YES (Amending A1 requires 75%).
      *   Step 2: **Remove *entire* amending power? YES**. It repeals A1 (member GM power) and hands power *only* to the Board. **VOID** (Irreparably breaks continuity - no mechanism for members to ever amend rules again or correct the Board). Stops at Step 2.
      *   *Ruling:* Motion void. Rulebook intact. A1 unchanged. Future board resolutions attempting rule changes are *ultra vires* (beyond power) and void.

  4.  **Hard Case (a): Members' Charter - Preamble "Fundamental" & Deletion of Appeal Right (70%):**
      *   *2019 "Charter" Insertion (71%):*
          *   Step 3: Preamble says "shall not be amended"? **YES**. "Fundamental" implies immutability. Preamble lock clause is **VOID** per Step 3. Procedural/appeal rights are added, but remain amendable.
      *   *2024 Deletion of Appeal Right (70%):*
          *   Step 1: 70% > 66.6%? YES.
          *   Step 2: Remove amending power? NO.
          *   Step 3: Make immutable? NO (The *deletion* isn't locking anything).
          *   Step 4: Remove accrued right? **REFER** (Is the *right to appeal* "accrued" only if a member *has started* an appeal under the old rule? If no member was mid-appeal when motion passed, likely NO. Committee must confirm interpretation).
          *   *Likely Outcome:* Appeal right validly deleted unless Committee finds an accrued right existed.

  5.  **Hard Case (b): Exclude Retired Members Voting (67% inc / 61% exc):**
      *   Step 1: **REFER** immediately. Amendment changes voting eligibility (A5 impact). Result differs depending on inclusion/exclusion of retired members. Committee **must decide the electorate question** (Policy/Values: Can a group vote to disenfranchise itself?).

  ---

  ### **What the Procedure CANNOT Do & Key Limitations**

  1.  **Historical Validity of Existing Rules:** The procedure only assesses *new* motions. It **flags potential issues** (e.g., "Step 3 was likely triggered when Rule X was 'locked' in 2015, making that lock void") but **cannot invalidate long-standing rules** based solely on this procedure. That requires a separate review/committee decision.
  2.  **Handbook Lag (A2):** The procedure **assumes the rulebook text provided is current**. A2 creates a systemic disconnect. **Flag strongly in rulings:** "Members voted based on Handbook Y, but rules in force were Z. The amendment integrates into *current* rulebook Z." This is a major governance risk needing policy change.
  3.  **"Accrued Right" (A4) Definition:** It **cannot define "accrued."** It forces a **REFER** to the Committee for interpretation on a case-by-case basis ("initiated action" is the operable test for *them* to apply).
  4.  **Intent vs. Effect:** It judges validity based on the motion's *text and rules*, **not** what the proposer *thought* it would do. If the text is valid, it stands, even if the effect is unintended.
  5.  **"Values Calls":** Explicitly **REFERs** to Committee for:
      *   Ambiguous "accrued right" (Step 4).
      *   Voting electorate conflicts (Step 1 special case).
      *   Systemic issues flagged (Handbook lag, historical locks).
  6.  **Total Rulebook Breakdown:** It **cannot fix** a rulebook if a truly paradoxical valid amendment destroys all amendment paths (Step 2 guards against this). This would likely require court intervention or extraordinary member action.

  **Key Outputs for Committee:** A simple statement: Motion is (1) **VALID**, (2) **PARTIALLY VALID** (list valid parts), or (3) **VOID**, citing the Step(s) causing voidance (e.g., "Failed Step 1: Threshold not met", "Failed Step 2: Removed amending power without replacement"). For **REFER** points, state the precise question for them (e.g., "Does removing the appeal right extinguish an *accrued* right under A4 for any member currently mid-appeal?"). Keep the "3-4 paragraphs" focused on the Step logic and their specific REFER question.
