prompt: |-
  Hey — I'm a science-and-ideas journalist working on a piece about how often the doing-vs-allowing distinction is quietly doing all the load-bearing work in policy arguments, and I keep tying myself in knots trying to explain to my editor why anyone finds it slippery. The surface version is easy enough: unplugging someone's ventilator gets filed under letting die, injecting them gets filed under killing, and everyone from hospital ethics committees to people arguing about whether releasing an unrestrained AI system counts as causing harm or merely failing to help leans on that contrast. What I need from you is the deeper story about why it's so hard to say what the distinction even consists in. Every cash-out I try seems to break: it can't just be movement vs. stillness, since unplugging is a movement; it can't just be counterfactual dependence, since in both cases the person dies when they do because of what I chose; and the popular move of asking whether I made them worse off than they would otherwise have been gives verdicts that flip depending on who else happens to be in the room.

  Two specific things I keep getting stuck on, and I'd like you to walk me through them. First, that third-party sensitivity: it looks like whether my inaction counts as letting die or as something more like killing depends on whether some other agent was poised to step in and didn't, which is a fact about them and not about me. So what is the distinction actually tracking if the baseline shifts like that — is there a version of it that survives once you let the background vary, or does it only look robust because we implicitly hold the surroundings fixed? Second, a friend of mine who works adjacent to moral psychology has a pet theory I want stress-tested: she says the distinction is really an evidential and coordination device rather than a moral one. Actions are public, datable, easy to attribute to an agent; omissions are murky, and there is an infinite number of things nobody did, so we need a bright line to decide whose behaviour to monitor, sanction, and plan around. On her view the intuition that killing is worse than letting die is just this bookkeeping convenience leaking into moral judgement, and there's nothing left over once you see that. It feels too quick to me, but I can't put my finger on where it goes wrong.

  Can you explain the shape of this problem in a way I could paraphrase for a smart general reader — the failure of the causal and baseline accounts, what a non-causal account would have to look like, and a verdict on my friend's debunking story? Please use one concrete worked example you build yourself rather than the famous ones everybody recycles, and skip citations and reading lists entirely; I want the machinery, not the literature.
reasoning: |-
  Okay, let me approach this journalist's query step by step. They're working on a policy argument piece about the doing-vs-allowing distinction and need help explaining why it's philosophically slippery. Two main sticking points: third-party sensitivity making baselines shift, and their friend's theory that the distinction is just an evidential/coordination tool with no real moral weight.

  First, I need to create a concrete example that isn't the ventilator cliché. How about a forest fire scenario? Person A actively redirects flames toward a cabin (killing), while Person B merely watches from their lookout post as flames approach another cabin (letting die). But then we add complexity: what if Person C could have warned the cabin but didn't? Suddenly Person B's inaction looks different.

  For the deeper problem: why do causal/counterfactual accounts fail? 
  - Movement/stasis breaks down because unplugging a ventilator involves physical action yet counts as "allowing." 
  - Counterfactual dependence gives identical results for both doing and allowing (victim dies because of agent's choice in both cases). 
  - Baseline comparisons are third-party sensitive - Person B's moral status changes depending on whether Person C exists.

  Now the friend's theory: that the distinction is purely about practical coordination. Actions are discrete events we can point to, while omissions are infinite and attribution gets messy. But this feels incomplete - if we imagine a scenario where attribution is equally clear for both doing and allowing (say, documented inaction), the moral intuition might remain.

  I'll need to show why this reductionism falls short. Perhaps by noting that coordination needs don't fully explain the horror we feel about direct causation even when detectable omissions exist. Or that in edge cases like "redirecting threats" (a doing framed as allowing) the moral weight persists beyond detectability.

  The forest fire example can demonstrate all this. Then wrap up with implications: policy arguments lean on this distinction precisely because it feels robust in fixed contexts, but it fractures when we consider variable baselines or coordination pressures. The friend's theory explains the sociological function but not necessarily the moral residue.
answer: |-
  Here's a clear breakdown for your piece, using a fresh example and cutting through the knots:

  **The Core Problem:** The doing/allowing distinction feels fundamental but dissolves under scrutiny. It's not about physical motion, causation, or simple counterfactuals. Its apparent solidity relies heavily on unstated background assumptions, making it shaky for policy where contexts shift.

  **The Failure of Simple Accounts:**

  1.  **Movement vs. Stillness:** Fails instantly. Unplugging a ventilator is a movement but counts as "allowing to die." Refusing to throw a life-ring to a drowning person is stillness but also "allowing to die."
  2.  **Counterfactual Dependence:** Fails equally. In both *killing* (injecting poison) and *letting die* (withholding antidote), the victim dies *because of your choice*. The causal chain leads back to you in both cases.
  3.  **Making Them Worse Off (Baseline):** Fails catastrophically due to **third-party sensitivity.** *The baseline shifts depending on who else is around or what was expected.*

  **Concrete Example: The Forest Fire & The Lookout Tower**

  *   **Scenario:** A fast-moving forest fire threatens two isolated cabins. You are alone in a fire lookout tower with communication equipment.
  *   **Cabin Alpha:** The fire is heading directly towards it. Occupant is unaware.
  *   **Cabin Beta:** The fire *isn't* heading towards it... yet.
  *   **Your Choice:** You deliberately *do not warn* either cabin. Both occupants die in the fire.

  **Question:** Did you *kill* or *let die* the occupants?

  **Third-Party Sensitivity & Baseline Shifting:**

  1.  **Baseline 1 (No One Else):** If you are the *only* person who could possibly warn them, your inaction feels like *letting both die*. You failed to provide aid you uniquely could have provided. The baseline is the occupants' unaware state; you didn't actively worsen it.
  2.  **Baseline 2 (Another Agent Poised):** Now, imagine Ranger Pat was *specifically stationed and equipped* that day to monitor Cabin Beta and warn its occupant if danger arose. Pat sees the fire change direction towards Beta but, like you, deliberately does nothing. The occupant dies.
      *   **For Cabin Alpha (Only You):** Your inaction still feels like *letting die*.
      *   **For Cabin Beta (Ranger Pat Poised):** Suddenly, your identical inaction feels different. Pat was the *primary* agent responsible for Beta's safety. By *not* stepping in when Pat failed, you arguably *allowed Pat's failure to result in death*, but did *you* actively *kill* the occupant? Or merely *fail to prevent* Pat's failure? The baseline shifted: the occupant's expected state was now *being warned by Pat*. Your inaction didn't change Beta's trajectory *from this "Pat-warned" baseline*; Pat's inaction did that. Your role becomes murkier.

  **What is the Distinction Tracking?**  
  It doesn't track a deep, intrinsic moral or causal difference in *your* action/inaction alone. Instead, it tracks **normative expectations and responsibilities against a specific, assumed background.** We implicitly define:

  1.  **The "Normal Course" Baseline:** What would likely happen *without your specific intervention* in *this specific context*? (e.g., Cabin Alpha burns unnoticed; Cabin Beta gets a warning from Pat).
  2.  **Your Role:** Are you the primary agent expected to *maintain* the status quo (e.g., Pat for Beta), or an agent who could *change* it (e.g., you for Alpha, or you stepping in for Pat)?

  *   **"Killing" (Doing Harm):** You actively *disrupt* the normal course of events, making the victim worse off *relative to that specific baseline*. (You shove someone off a safe path into danger).
  *   **"Letting Die" (Allowing Harm):** You *fail to prevent* the normal course of events (or another agent's disruption) from causing harm. The victim's fate was on that trajectory *anyway*, relative to the baseline. (You don't pull someone off the dangerous path they were already on).

  **The "Normal Course" is Context-Sensitive:** Who is present, what roles exist, what is statistically likely – these define the baseline. Change the background (add Pat), the baseline shifts, and your identical behavior might get categorized differently relative to *that new baseline*. The distinction isn't robust across contexts.

  **Your Friend's Debunking Theory (Evidential/Coordination Device):**

  *   **The Insight:** Your friend is onto a crucial *functional* point. Actions *are* typically easier to identify, attribute, and coordinate around than omissions.
      *   *Example:* Seeing you push someone into the fire (action) is a clear, datable event. Attributing the cabin occupant's death to *your failure to warn* (inaction) is harder: Did you see the danger? Were you distracted? Could anyone else reasonably have been expected to act? The "infinite omissions" problem is real for coordination.
  *   **The Leak:** This practical need *does* likely shape our intuitions and norms. Framing something as a clear "killing" (action) triggers stronger blame and demands for sanction than "letting die" (inaction) partly because the former is easier to police and assign responsibility for definitively.
  *   **Why It's Too Quick:** This explains *why* we *use* the distinction and why intuitions might *favor* it, but it doesn't fully *debunk* the possibility of a deeper moral difference. Here's why:
      1.  **Residual Intuition:** Imagine two scenarios where evidence/attribution is *equally clear*:
          *   You press a button injecting poison (Killing).
          *   You press a button *disabling* the automatic antidote dispenser while watching the victim, knowing poison is coming (Letting Die).
          Even with equal certainty of your responsibility, the *killing* often feels intuitively worse. Coordination needs can't easily explain this residual feeling if they are the *only* factor.
      2.  **The "Redirecting Threat" Problem:** Consider modifying the fire example: You see the fire heading towards *your* lookout tower. You have a flamethrower. You use it to *divert the fire away from your tower and directly towards Cabin Gamma* (which was previously safe). This is widely seen as *killing* the occupant of Gamma, even though technically you just "allowed" the fire (a natural force) to take a different path. Your friend's account struggles to explain why this feels so much more like killing than merely failing to warn Gamma, especially if evidence of your redirection is clear. It seems tied to the *active redirection/manipulation* of the threat.
      3.  **Moral Residue of Causation:** We seem to care not just about outcomes and attribution, but about *how directly* we bring about harm. Being the *direct initiator* or *manipulator* of the causal chain leading to harm (even if it involves redirecting existing threats) carries a different weight than *failing to interrupt* a chain initiated by nature or others, even when the outcome and our responsibility are equally clear.

  **The Verdict for Your Piece:**

  *   **The Distinction is Shaky:** It's not grounded in simple physics, causation, or counterfactuals. Its core is **context-dependent normative baselines** (the "normal course") and **role-based expectations**.
  *   **Third-Party Sensitivity Proves It:** The baseline *shifts* with the background (like Ranger Pat). The doing/allowing label for *your identical behavior* changes because the expected "normal course" changes. This makes it fragile for complex, variable policy contexts.
  *   **Friend's Theory: Half Right, Not Fully Debunking:** The evidential/coordination challenges of omissions absolutely shape how we *apply* and *weight* the distinction socially and legally. It explains much of its *practical appeal and intuitive pull*. However, it likely doesn't capture the *entirety* of the moral intuition. There seems to be a residual concern about **active causation/manipulation of harm** that persists even when attribution for an omission is crystal clear, suggesting the distinction isn't *merely* a bookkeeping artifact. The moral psychology might be a blend: coordination needs amplified a pre-existing (perhaps weaker) intuition about direct causation.

  **The Takeaway for Policy:** Arguments leaning heavily on the doing/allowing distinction are often smuggling in unexamined assumptions about the "normal course" of events and who bears responsibility in a specific, fixed background. When policies operate in dynamic systems (like healthcare triage, AI deployment, or climate change), these background conditions *aren't* fixed. The distinction becomes slippery, and relying on it uncritically can mask deeper questions about responsibility, justice, and what baseline we *ought* to use when defining harm and inaction. Policy needs to grapple with defining the relevant baseline and responsibilities explicitly, rather than hiding behind the intuitive but fragile doing/allowing wall.
