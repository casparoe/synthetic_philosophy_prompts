answer: |-
  Here's a menu of distinct precise theses that "make people happy, not make happy people" could express, ordered from least to most radical. Each thesis is evaluated as a platitude (true but trivial), substantive and defensible, or false. For substantive theses, I note key commitments and potential unattractive conclusions. I then test each against your three cases and address your core questions: which block the inference from "an extra life worth living is good" to "the larger population is better," and whether this costs the longtermist claim about extinction. Finally, I identify the most likely intended reading and the locus of residual disagreement.

  ---

  ### **The Menu of Theses**

  1. **The Beneficiary Constraint**  
     *Thesis*: An action can only be good if it benefits a specific, identifiable person. Creating a new person doesn't "benefit" them because they wouldn't exist otherwise.  
     *Verdict*: Substantive and defensible.  
     *Commits to*: Rejecting "impersonal" value (value not tied to welfare improvements for actual people). This avoids the repugnant conclusion but generates the *absurd conclusion*: creating a miserable person is bad (it harms them), but creating a happy person isn't good (it doesn't benefit anyone).  
     *Unattractive conclusion*: Adding happy people is neutral, but adding unhappy people is bad. This implies that a world with 1,000 happy people is no better than a world with 10 happy people, which many find counterintuitive.  
     **Test cases**:  
     - (1) **10B barely worth living vs. 5B wonderful**: Favors 5B wonderful (adding 5B barely-worthwhile lives isn't a "benefit" to anyone). Blocks repugnant conclusion.  
     - (2) **Mere addition**: Neutral (adding happy people doesn't benefit existing or new people; they weren't deprived before).  
     - (3) **Distant planet**: Neutral (no beneficiary is affected).  

  2. **The Person-Affecting Restriction**  
     *Thesis*: Morality only concerns making existing (or future-but-inevitable) people better off. Creating new people is neither good nor bad unless it affects existing people.  
     *Verdict*: Substantive and defensible.  
     *Commits to*: A "narrow" person-affecting view. This blocks the repugnant conclusion by denying that potential people count, but it generates the *extinction paradox*: extinction isn't bad if no one exists to be harmed, contradicting your friend's longtermism.  
     *Unattractive conclusion*: If we choose a policy causing future extinction, it’s not wrong if current people aren’t harmed—even if trillions of happy lives are lost.  
     **Test cases**:  
     - (1) Favors 5B wonderful (adding people isn't relevant).  
     - (2) Neutral (unless the addition affects others).  
     - (3) Neutral (no effect on existing people).  

  3. **The Asymmetry Thesis**  
     *Thesis*: Creating a person with a life worth living is good, but *not* creating them isn't bad. However, creating a person with a life *not* worth living is bad, and not creating them is good.  
     *Verdict*: Substantive and defensible.  
     *Commits to*: A "weak" asymmetry. It avoids the repugnant conclusion by denying that we must maximize happy lives, but generates the *procreation asymmetry puzzle*: Why is avoiding suffering more urgent than creating happiness?  
     *Unattractive conclusion*: A world with no one in it is better than a world with net-positive but low-quality lives (e.g., 10B barely worth living), since the burden of proof is on creation.  
     **Test cases**:  
     - (1) Favors 5B wonderful (creating 10B barely-worthwhile lives is only weakly good, outweighed by the risk of harm).  
     - (2) Good but not obligatory (creating happy people is permissible but not required).  
     - (3) Weakly good (if lives are barely worth living, creation is marginally acceptable).  

  4. **Non-Additive Aggregation (Diminishing Marginal Value)**  
     *Thesis*: The value of a happy life doesn't add linearly across people. Each additional life contributes less moral value than the last, especially at low welfare levels.  
     *Verdict*: Substantive and defensible.  
     *Commits to*: Prioritizing quality over quantity. Avoids the repugnant conclusion but generates the *reverse repugnant conclusion*: A tiny population with superb lives might be better than a vast one with "good enough" lives, even if total welfare is lower.  
     *Unattractive conclusion*: Adding a million happy lives to an already-large population might be worthless, which feels overly dismissive of scale.  
     **Test cases**:  
     - (1) Favors 5B wonderful (10B barely-worthwhile lives have low marginal value).  
     - (2) Slightly good (diminishing returns make the addition less valuable).  
     - (3) Slightly good (but less so than if lives were excellent).  

  5. **Incomparability of Different Populations**  
     *Thesis*: Populations with entirely different people cannot be compared morally. "Better than" is undefined.  
     *Verdict*: False (or at least highly problematic).  
     *Commits to*: Moral paralysis in population choices. Avoids the repugnant conclusion by denying comparability but generates the *incomparability paradox*: We can't say that extinction is worse than survival, or vice versa.  
     *Unattractive conclusion*: Choosing a world with 1,000 tortured children over 1,000 happy children isn't worse if the children are different.  
     **Test cases**:  
     - (1) Incomparable (no judgment possible).  
     - (2) Incomparable (new people = new population).  
     - (3) Incomparable (no shared people).  

  6. **Exclusion of Barely Worthwhile Lives**  
     *Thesis*: Lives "barely worth living" have zero (or negative) moral value. Only lives above a threshold (e.g., "good" or "excellent") count.  
     *Verdict*: Substantive but false.  
     *Commits to*: A fixed welfare threshold. Avoids the repugnant conclusion by dismissing barely-worthwhile lives but generates the *threshold absurdity*: A life at 0.0001 utility is worthless, but at 0.0002 it’s valuable—an arbitrary line.  
     *Unattractive conclusion*: Adding a billion lives barely worth living is no better than adding none, but adding one life just above the threshold is good, regardless of scale.  
     **Test cases**:  
     - (1) Favors 5B wonderful (10B barely-worthwhile lives are valueless).  
     - (2) Neutral or bad (if "barely worth living" is below the threshold).  
     - (3) Neutral or bad (same reason).  

  ---

  ### **Which Block the Inference?**
  - **Blocks the inference** (from "extra life worth living is good" to "larger population is better"): All except #6 (which blocks it partially by devaluing low-welfare lives).  
    - Strongest blockers: #1 (Beneficiary), #2 (Person-Affecting), #5 (Incomparability).  
    - Why? They deny that creating new people is a moral positive, even if their lives are good.  
  - **Costs the longtermist claim?**  
    - #1 and #2 *do* cost it: If creating future people isn't good (or is neutral), extinction isn't a loss of value.  
    - #3, #4, and #6 *preserve* it: Creating future people can still be good (if lives are above a threshold or aggregation allows it), so extinction is bad.  
    - #5 (Incomparability) destroys all claims—extinction can't be worse.  

  ---

  ### **What Your Friend Likely Meant**
  Given her insistence that extinction is a vast loss, she probably holds a **moderate asymmetry view (#3) or non-additive aggregation (#4)**. These avoid the repugnant conclusion while allowing that creating future people *can* be good (saving her longtermism). The slogan "make people happy" reflects her focus on quality (improving existing/future lives) over quantity (creating more lives).  

  **Residual disagreement with the "total view" (additive utilitarianism)**: Genuine and non-verbal. It centers on:  
  - Whether creating happy people is intrinsically valuable (total view: yes; her view: no or weakly).  
  - Whether we can trade off quality for quantity (total view: yes; her view: no).  
  This isn't just semantics—it shapes real decisions (e.g., prioritizing current well-being vs. large-scale colonization).  

  Her position is coherent if she holds a threshold or asymmetry view: Extinction is bad because it loses *excellent* future lives, but a vast population of barely-worthwhile lives isn't better than a smaller, happier one. The slogan rejects additive aggregation without dismissing future people entirely.
