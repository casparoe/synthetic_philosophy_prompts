prompt: |-
  Last night my friend and I argued for hours about whether the astronomical number of future people is what makes human extinction catastrophic. When I said that this way of valuing future people looks like it commits her to something in the neighbourhood of the repugnant conclusion — a huge population of lives barely worth living beating a much smaller population of excellent ones — she answered 'make people happy, not make happy people' and treated that as settling it. The trouble is that she had spent the previous hour insisting that extinction would be a vast loss precisely because of all the people who would then never exist, so she cannot have meant the strongest thing the slogan seems to say.

  Please set out, as a menu, the distinct precise theses that one-liner could be expressing. I can already see three rough candidates — that a benefit needs a beneficiary, that the value of a life worth living does not aggregate additively across numbers of people, and that no value comparison is even defined between populations containing different people — but I want the fuller list, ordered from trivial to radical, with a verdict on each: platitude, substantive and defensible, or false. Where a reading is substantive, say what else it commits you to, including whether it generates an unattractive conclusion of its own in some other case.

  Test each reading against three cases: (1) ten billion people with lives barely worth living versus five billion with wonderful ones; (2) a mere addition, where an extra group with lives worth living is added without affecting anyone else; (3) a population on a distant planet whose existence no one else ever learns of, containing lives barely worth living. The part I care most about is which readings, if any, actually block the step from 'this extra life would be worth living' to 'the larger population is better' — and whether blocking that step costs her the longtermist claim she opened with. Also tell me which reading someone who deploys the slogan in an argument like ours probably has in mind, and where the residual disagreement with a total view is genuine rather than merely verbal. Assume I know what the repugnant conclusion and the mere addition paradox are, and don't give me citations or a reading list.
reasoning: |-
  Okay, I need to help the user unpack the slogan "make people happy, not make happy people" that their friend used in their argument. The user wants a menu of distinct precise theses this slogan could express, ordered from trivial to radical, with verdicts on each. They also want each thesis tested against three cases and to know which readings block the step from "an extra life worth living is good" to "larger population is better." Plus, I need to identify which reading the friend likely intended and where the residual disagreement lies.

  First, I recall the context: the friend argued that human extinction is catastrophic because of the astronomical number of future people who would never exist. But when confronted with the repugnant conclusion (where a huge population with barely worthwhile lives is considered better than a smaller one with excellent lives), the friend used this slogan. The user pointed out the contradiction since the friend had just emphasized the loss of future people, so the slogan can't mean the strongest interpretation.

  The user already has three rough candidates: the beneficiary idea, non-additive aggregation, and incomparability between different populations. I need to expand this into a fuller list. Let me brainstorm possible interpretations:

  1. **Literal "make people happy" vs. "make happy people":** This could mean we should improve existing lives rather than create new ones. But that seems too simplistic.

  2. **Beneficiary requirement:** A benefit must have a beneficiary who experiences it. Creating a happy person benefits that person, so this might not block the repugnant conclusion.

  3. **Non-identity problem:** Since future people don't currently exist, we don't owe them existence, only better conditions if they exist. This could relate to Parfit's non-identity problem.

  4. **Person-affecting view:** Only actions affecting existing people matter; creating new people is neutral. But this might imply that extinction isn't bad if no one is harmed, which contradicts the friend's initial claim.

  5. **Asymmetry:** While creating a happy person is good, creating an unhappy person is bad, but not creating a happy person isn't bad. This could avoid the repugnant conclusion but might have its own issues.

  6. **Aggregation limits:** The value of lives doesn't add up linearly, especially for barely worthwhile lives. So a large number of them doesn't outweigh a smaller number of excellent lives.

  7. **Incomparability:** Different populations can't be compared because they contain different people. This would block the repugnant conclusion entirely but might be too radical.

  I need to order these from trivial to radical. Let me structure them:

  - Start with the beneficiary requirement (trivial, since it's almost definitional).
  - Then person-affecting views (moderate).
  - Then asymmetries (more substantive).
  - Aggregation limits (substantive).
  - Incomparability (radical).

  For each, I'll assess whether it's a platitude, defensible, or false; what it commits to; and if it generates unattractive conclusions. Then test against the three cases:

  1. **Repugnant scenario:** 10B barely worth living vs. 5B wonderful lives.
  2. **Mere addition:** Adding extra happy people without affecting others.
  3. **Distant planet:** Lives barely worth living, unknown to others.

  Key question: which readings block the inference from "extra life worth living is good" to "larger population is better." And whether this costs the friend the longtermist claim that extinction is bad due to lost future people.

  The friend likely had in mind a moderate view like the person-affecting restriction or asymmetry, since they still think extinction is bad but want to avoid the repugnant conclusion. The residual disagreement with total utilitarianism is genuine on how we value future people creation.

