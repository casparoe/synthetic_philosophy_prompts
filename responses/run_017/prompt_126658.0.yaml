prompt: |-
  I'm part of a small commission drafting a facilitator's handbook for a state-level citizens' assembly on assisted dying. The assembly's recommendations are formally non-binding, but the legislature has committed to putting them to a vote, so anything a participant says can end up shaping coercive law — indirectly, through two stages of delegation, with a facilitation norm that pushes participants toward unanimity rather than majority voting. The section I keep failing to write is the guidance on religious reasons. Two colleagues of mine — one a Rawlsian-flavored restrictivist who thinks citizens owe one another restraint in matters of coercion, the other an inclusionist who thinks a citizen may offer whatever actually grounds her political conviction — have been going back and forth about it for months, and I'd rather they produce a document than another round of emails. Please write the joint statement they could both sign at the end of a good-faith adversarial collaboration: not a verdict on who is right, and not a dramatized exchange, but the constructive text.

  Call the first position the restrictivist camp: roughly, that when a citizen advocates for a coercive law, or votes for one, she owes her fellow citizens a justification they can in principle assess, and that reasons whose force depends on a revelation or authority they do not share fail that test. Call the second the inclusionist camp: roughly, that such a duty either misdescribes democratic citizenship, or asks religious citizens to be alienated from their own deepest convictions, or rests on a religion/secularism distinction that does not survive scrutiny. Give me, first, a numbered list of claims both camps can actually sign — about coercion, about the difference between what a citizen may act on and what she may offer, about whether the relevant duty (if there is one) falls on voters, on advocates, on officials, or on the authors of an official rationale document, and about what an assembly's own unanimity-oriented facilitation norm does or does not add to the ordinary case. Do not let these be vacuous: each should be capable of being denied by someone.

  Then give me a disagreements table with these columns: the crux; the inclusionist claim in wording an inclusionist would accept; the restrictivist claim in wording a restrictivist would accept; a concrete case or piece of evidence both would agree bears on that crux; and what each side predicts about it in advance. Among the cruxes I want at least these four addressed. (1) Formulational: the requirement might be about the accessibility of a reason's epistemic warrant, about whether it is the kind of reason others could share, or merely about what it is permissible to adduce in public advocacy — and I suspect a good part of their quarrel dissolves once these are separated, so tell me which part you think is verbal and why. (2) The asymmetric-accessibility case: a small religious minority offers a reason the majority cannot assess, while the majority offers a secular reason resting on a contested social-scientific claim that the minority cannot assess; do the two norms treat these symmetrically, and if not, what work is the religion/secularism distinction really doing? (3) Testimony: a religious participant says, in effect, that she has a long track record of sound judgment on the common good and asks to be trusted that this policy serves it, while declining to share the revelatory ground on which she holds it; does that satisfy the norm, flout it, or change what the norm was about? (4) Integrity and uptake: whether the cost of restraint falls unevenly on religious citizens, and whether it is a moral wrong or an etiquette of civic friendship that is being violated — plus what each camp would count as evidence that religious reasons in deliberation entrench rather than open up discussion.

  Two constraints. First, the handbook is for facilitators with no philosophical training, so define any term of art you use and don't cite or gesture at the literature — I want the argument, not the bibliography. Second, close with a short section stating, for each camp, what single development — an argument, an institutional change, or an empirical finding about how assemblies actually deliberate — would most move it, and say whether there is anything both would agree would settle the matter. Aim for roughly 1,200 to 1,600 words, and write it so that neither of my colleagues would accuse you of having quietly adopted the other's framing.
reasoning: |-
  Okay, the user is part of a commission drafting a facilitator's handbook for a state-level citizens' assembly on assisted dying. They're stuck on the section about handling religious reasons during deliberations. Two colleagues—one restrictivist (Rawlsian) and one inclusionist—are deadlocked. The user wants a joint statement both can sign, avoiding a verdict but capturing their common ground and key disagreements.

  First, I need to understand the core positions. The restrictivist believes citizens should justify coercive laws with reasons others can assess, excluding revelation-based claims. The inclusionist argues this alienates religious citizens and the secular/religious distinction is flawed. The challenge is finding non-vacuous common claims while respecting both viewpoints.

  For the joint statement, I'll start with shared principles. Both agree coercion requires justification, deliberation aims at the common good, and the assembly's unanimity norm adds pressure. I'll avoid watering down their stances—each claim should be deniable. For example, stating that reasons must be "articulated clearly" is something a hardline restrictivist might reject if they demand accessibility, not just clarity.

  Next, the disagreements table needs to address four cruxes. For the formulational issue, I'll show how conflating accessibility, shareability, and admissibility muddles the debate. The restrictivist cares about accessibility of warrant, while the inclusionist sees admissibility as the real constraint. Separating these clarifies their dispute isn't entirely verbal. 

  The asymmetric-accessibility case is crucial. Both sides might agree that inaccessible secular reasons (like complex sociology) also fail the restrictivist test, but the inclusionist argues the norm isn't neutrally applied—secular reasons get a pass. I'll highlight this asymmetry to expose the religion/secularism distinction's burden.

  On testimony, I'll illustrate how a participant asking for trust based on track record tests the boundaries. The restrictivist sees it as dodging justification, while the inclusionist views it as legitimate civic trust-building. This reveals deeper divides about what counts as "giving reasons."

  For integrity and uptake, I'll note the uneven burden on religious citizens and conflicting evidence on whether religious reasons entrench divisions. The inclusionist points to polarization studies, while the restrictivist cites cases where secular framing enabled consensus.

  Finally, for developments that could move each side: The restrictivist might budge with evidence that restraint causes alienation, validated by affected citizens. The inclusionist could shift if a procedural filter for inaccessible reasons proved workable without exclusion. Both might agree a well-run assembly testing both approaches could settle the matter, but remain skeptical.

  Throughout, I'll keep language accessible for facilitators, avoiding jargon. The goal is a balanced scaffold that lets both colleagues recognize their views without feeling co-opted.
answer: |-
  ## Joint Statement on Religious Reasons in Citizens' Assembly Deliberation (Restrictivist & Inclusionist Consensus Draft)

  **Preamble:** This section addresses the role of religiously grounded reasons in our Citizens' Assembly deliberations on assisted dying. We recognize the profound sensitivity and importance of this issue. While we hold differing views on the *ideal norms* for public reason-giving in a pluralistic democracy, we affirm the following shared understandings relevant to the *specific context* of this state-level Citizens' Assembly tasked with generating recommendations that will receive a formal legislative vote.

  **Shared Foundational Claims (Numbered):**

  1.  **Coercion Requires Justification:** Any recommendation advocating for a coercive law (one restricting individual liberty or imposing obligations) demands a justification. Participants advocating for a specific policy outcome bear a responsibility to offer reasons for their position.
  2.  **Deliberation Aims at the Common Good:** The purpose of our deliberation is to identify recommendations that serve the common good – the well-being and fundamental interests of all citizens – not merely the interests of a particular group or belief system.
  3.  **The Assembly Context Intensifies Scrutiny:** While citizens voting in private may base decisions on deeply personal reasons (including religious ones), the Assembly's structured, public deliberation aimed at producing *shared, reasoned recommendations* for the *entire polity* creates a stronger expectation for participants to offer justifications oriented towards shared concerns. The legislature's commitment to voting on these recommendations further underscores this responsibility.
  4.  **Unanimity Aspiration Shapes Dynamics:** The facilitation norm encouraging movement towards unanimity (or the broadest possible consensus) places a premium on reasons that can resonate across differing worldviews. It heightens the need for participants to articulate their positions in ways that foster mutual understanding and bridge divides, even if complete agreement is unattainable.
  5.  **Distinction Between Grounding & Offering:** A participant's deepest convictions (religious or otherwise) *ground* their political judgment. However, the act of *offering* reasons in a formal deliberation aimed at shaping coercive policy for all involves a distinct civic practice. The core disagreement concerns the *nature* of the reasons appropriate for this public offering.
  6.  **No Requirement for Personal Belief Change:** Neither position demands that participants change their personal religious beliefs or the role those beliefs play in their private moral reasoning. The question is solely about the *mode of public justification* within the Assembly's specific task.
  7.  **Facilitator Role is Key:** Facilitators must create an environment where all participants feel respected and heard, while also guiding the deliberation towards the production of actionable, widely justifiable recommendations. Navigating the tension between inclusion and justification is central to their role.

  **Areas of Persistent Disagreement (Structured Analysis):**

  | Crux                                                                                                | Inclusionist Claim (Wording Accepted)                                                                                                                                 | Restrictivist Claim (Wording Accepted)                                                                                                                                 | Shared Concrete Case / Evidence                                                                                                 | Inclusionist Prediction                                                                                                | Restrictivist Prediction                                                                                               |
  | :-------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------- |
  | **1. Formulational: What is the core requirement?** (Accessibility of Warrant? Shareability? Admissibility?) | "The core requirement for public justification in a pluralistic democracy is *admissibility*: citizens must be free to offer any reason that genuinely grounds their political conviction, without censorship based on its source." | "The core requirement is the *accessibility of the reason's epistemic warrant*: justification must rely on reasons whose force or truth can, in principle, be understood and evaluated by others using shared faculties of reason and observation, without requiring faith in a specific revelation or authority." | A participant states: "My faith teaches that human life is sacred from conception to natural death; therefore, assisted dying is always wrong." | Separating concepts clarifies the debate is substantive: the restrictivist norm *is* a form of inadmissibility based on source. | Separating concepts clarifies the debate: the requirement is about accessible *warrant*, not banning religious *content*. Shareability/admissibility follow from accessible warrant. |
  | **2. Asymmetric Accessibility:** (Inaccessible Religious vs. Inaccessible Secular Reasons)          | "The restrictivist norm treats inaccessible religious reasons differently than inaccessible secular reasons (e.g., complex sociology), revealing an unfair bias against religion disguised as neutrality." | "The norm applies symmetrically. A complex sociological claim lacking accessible evidence *also fails* the accessibility requirement. The difference is that complex secular claims *can* be made accessible in principle through evidence and reason, even if not instantly. Religious revelation, by its nature, cannot." | A small religious minority opposes assisted dying based on a specific scriptural interpretation unknown to others. The majority supports it citing a sociological study on suffering that the minority lacks the expertise to evaluate. | Observers will see facilitators challenge the sociological study's methodology (seeking accessibility) but dismiss the scriptural reason outright (inadmissibility). | Observers will see facilitators ask *both* sides to explain *how* their reason supports the common good in terms others might grasp, treating the epistemic challenge similarly. |
  | **3. Testimony & Track Record:** (Can trust substitute for shared warrant?)                          | "A citizen with a demonstrable history of sound judgment on the common good can legitimately ask others to trust her conviction on this issue, even if she cannot share the revelatory ground, as an act of civic trust." | "Requesting trust based on track record, while declining to offer an assessable reason for *this specific policy*, fails the duty of justification for coercion. It substitutes authority (personal credibility) for public reason." | A respected participant says: "Based on my lifelong commitment to community well-being and consistent ethical positions you've trusted before, I urge you to trust me that this policy is deeply harmful, though I cannot explain why in secular terms." | This fosters civic friendship by acknowledging the participant's integrity and shared history, allowing their voice to be heard meaningfully. | This bypasses the core deliberation. Others are asked to support coercion based solely on deference, not shared reason. It ends discussion rather than opening it. |
  | **4. Integrity, Uptake & Entrenchment:** (Costs & Effects)                                          | "Requiring religious citizens to 'translate' or suppress their core reasons imposes a unique burden, alienates them, and violates the integrity of their civic contribution. Suppressing these reasons can entrench division by silencing authentic voices." | "The 'cost' is part of the civic duty to seek fair terms of cooperation. Offering inaccessible reasons often entrenches division by shutting down dialogue ('God says so' ends discussion) and failing to provide others with grounds to reconsider their view." | Observing whether discussions involving explicitly religious reasons lead to: (a) deeper understanding, compromise, or finding common ground; or (b) polarization, dismissal, or participants 'talking past' each other. | Evidence will show authentic religious expression, when heard respectfully, often builds bridges by revealing shared values (e.g., compassion, dignity) beneath doctrinal differences. | Evidence will show discussions stall or polarize when inaccessible reasons are central, whereas focusing on accessible impacts (suffering, autonomy, safeguards) fosters productive debate. |

  **Potential Paths Forward / Developments:**

  *   **What Might Move the Restrictivist Camp:** Clear empirical evidence from similar assemblies demonstrating that explicitly including religious reasons in core justifications *without requiring translation* consistently leads to *more robust, stable, and widely accepted* consensus recommendations on morally charged issues, *and* that participants from diverse religious backgrounds report feeling *more* civically integrated, not alienated, by this practice. (Currently, they predict the opposite).
  *   **What Might Move the Inclusionist Camp:** The development and successful implementation of a clear, practicable, and non-coercive *deliberative filter* within the Assembly process – distinct from facilitator censorship – that reliably distinguishes reasons based on *accessible warrant* without unfairly burdening religious viewpoints or relying on a contested secular/religious binary, *and* demonstrably improves the quality of rationale in the final recommendations received by the legislature. (Currently, they view this as impossible or inherently biased).
  *   **What Both Might Agree *Could* Settle the Matter (Though Skeptical):** The results of a rigorously designed, large-scale series of parallel citizens' assemblies on identical complex moral issues (like assisted dying), some operating under a strong restrictivist facilitation norm and others under a strong inclusionist norm. Comparing the quality of deliberation (depth, mutual respect, polarization), the perceived legitimacy of the process by participants and the public, and the long-term stability and societal acceptance of the resulting recommendations *might* provide decisive evidence for one approach over the other in achieving the Assembly's core goals. Both camps, however, suspect their core philosophical commitments might lead them to interpret even such results differently.

  **Conclusion for Facilitators:** Your primary task is to ensure respectful, productive deliberation focused on the common good and the Assembly's mandate. Be mindful of the principles outlined in the Shared Foundational Claims. When religious reasons arise:
  1.  **Ensure Respectful Listening:** All participants deserve to be heard and have their deeply held convictions acknowledged.
  2.  **Focus on Shared Concerns:** Gently guide participants to explore *how* their position relates to shared values or practical impacts relevant to *all* citizens (e.g., preventing suffering, ensuring autonomy, protecting the vulnerable, maintaining social trust). Ask: "What concern about our shared life together leads you to this position?"
  3.  **Encourage Explanation, Not Translation:** Ask participants to explain *why* they believe their position serves the common good in terms that help others understand the *consequences or values* at stake, without demanding they abandon their foundational beliefs. Avoid forcing artificial "secular" reframing if it feels inauthentic to the participant.
  4.  **Prioritize Unpacking Impacts:** Steer discussion towards the tangible effects of potential policies – who might be affected, how, and what safeguards or alternatives exist – as these often provide common ground for deliberation regardless of ultimate grounding.
  5.  **Maintain the Goal:** Remember the aim is not theological debate but formulating recommendations for the legislature that reflect careful consideration of the common good, drawing on the diverse perspectives within the room. Your skill lies in fostering an environment where this complex exchange can happen constructively.
