  For the AI value case, I suspect the colleague will reject "internalized value" as a skyhook due to homunculus concerns - attributing normative reasoning exceeds the mechanistic reality. But she'll accept the footnote's "disposition" language as good reductionism since it maps cleanly to the training process. 

