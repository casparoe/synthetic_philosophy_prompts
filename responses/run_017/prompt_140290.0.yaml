answer: |-
  **Aeternum Health Solutions: Clinical Coverage Policy 7.45 Rev. 3 - Distinguishing Therapeutic Intervention from Non-Covered Enhancement**

  **1. Purpose:** To establish objective criteria for determining whether a requested intervention constitutes Covered Therapy (restoration to species-typical normal functioning) or Non-Covered Enhancement (improvement beyond species-typical normal functioning), thereby ensuring appropriate resource allocation consistent with the Plan's foundational ethical and actuarial principles.

  **2. Definitions:**
      *   **2.1 Species-Typical Normal Functioning (STNF):** The statistically predominant functional capacity observed within the current, unenhanced Plan Member population for a specific physiological or cognitive parameter. STNF is defined by the 50th percentile performance level ascertained annually via Plan-wide anonymized claims data analysis and validated market-benchmarking surveys ("The Norm").
      *   **2.2 Baseline Function:** The Member's documented functional capacity for the relevant parameter immediately preceding the onset of the condition necessitating intervention OR prior to any Member-initiated alteration of function (See Clause 5.2).
      *   **2.3 Covered Therapy:** An intervention demonstrably restoring the Member's functional capacity from a sub-STNF Baseline (as defined in 2.2) to meet or minimally exceed the current STNF threshold.
      *   **2.4 Non-Covered Enhancement:** Any intervention aimed at elevating functional capacity above the Member's Baseline Function when said Baseline already meets or exceeds current STNF, or above the current STNF threshold itself.

  **3. Determination of STNF Baseline:**
      *   **3.1 Annual Adjustment:** The STNF threshold for each functional parameter is subject to annual downward recalibration based on the preceding year's aggregated Plan Member population data. Improvements in population-wide function do not necessitate upward recalibration. (e.g., If average untreated visual acuity declines from 20/20 to 20/25, STNF for vision becomes 20/25).
      *   **3.2 Reference Class - Declared Life Plan (DLP):** The functional demands of STNF may be modulated by the Member's formally declared, Plan-registered Life Plan. STNF for a parameter is assessed relative to the typical functional requirements of the DLP's associated cohort.
          *   **3.2.1 DLP Amendment:** Members may amend their registered DLP subject to Form AHS-780b submission and a 90-day waiting period. Interventions initiated under a prior DLP classification will be re-evaluated under the new DLP at the next scheduled utilization review. Coverage for ongoing interventions may be modified or terminated based on the reclassification outcome.

  **4. Prohibition on Positional Competitive Enhancement:**
      *   **4.1 Competitive Benefit Clawback:** Any intervention whose primary benefit derives solely from conferring a positional advantage relative to others (i.e., its value diminishes as utilization within the relevant population increases) is categorically deemed Non-Covered Enhancement. Coverage for previously authorized interventions under this category is subject to immediate clawback upon determination of widespread adoption nullifying their competitive benefit.
      *   **4.2 Reversion to STNF:** If the widespread adoption of a previously competitive intervention results in its performance level becoming the new population STNF, interventions restoring individuals *below* this new STNF back *to* it may then qualify as Covered Therapy under Clause 2.3.

  **5. Special Considerations:**
      *   **5.1 Induced Deficit Pathway:** A Member may establish a new, lower Baseline Function through a self-funded, Plan-approved elective procedure or pharmaceutical regimen inducing a defined sub-STNF deficit. Subsequent interventions restoring function *from this new Baseline* back to STNF may qualify as Covered Therapy. The induced deficit must be precisely documented and measurable against STNF. (Pre-approval via Form AHS-781c required).

  **Sample Coverage Determinations:**

  **Case #:** 2024-0876-CV
  **Member:** 45 y.o. male.
  **Request:** Coverage for advanced neural-cognitive processing speed augmentation (NexusFlow™ Implant).
  **DLP:** "Commercial Air Traffic Controller" (Registered 01/15/2023).
  **Analysis:** STNF for cognitive processing speed within the "Air Traffic Controller" cohort (Cohort #ATC-4) requires sustained multi-stream processing at 95%ile human capacity. Member's current Baseline is 92%ile. STNF threshold for Cohort ATC-4 is 90%ile. Member's Baseline (92%ile) exceeds cohort STNF (90%ile). Intervention seeks to elevate function beyond Baseline/STNF.
  **Determination:** **DENIED** as Non-Covered Enhancement (Clause 2.4). NexusFlow™ known to confer competitive advantage in ATC roles; widespread adoption would nullify positional benefit (Clause 4.1).

  **Case #:** 2025-1123-AU
  **Member:** 28 y.o. female.
  **Request:** Coverage for bilateral cochlear implant (Sonitus Ultra™).
  **DLP:** "Multimedia Artist" (Registered 03/10/2025).
  **History:** Member underwent elective, self-funded micro-ablation of tympanic membranes (Procedure Code TX-879, Plan-approved via AHS-781c on 01/15/2025), inducing a documented, stable hearing deficit (Baseline: 45 dB loss, bilateral). Current STNF for auditory acuity within "Multimedia Artist" cohort (Cohort #MMA-2) is 30 dB loss.
  **Analysis:** Member's induced Baseline Function (45 dB loss) is sub-STNF (30 dB loss). Sonitus Ultra™ reliably restores function to ≤25 dB loss, exceeding STNF minimally.
  **Determination:** **APPROVED** as Covered Therapy (Clause 2.3, Pathway 5.1). Restoration from induced sub-STNF Baseline to exceed current STNF threshold.

  **Case #:** 2026-0455-OG
  **Member:** 10 y.o. male.
  **Request:** Continuation of coverage for sustained-release methylphenidate (LearnAdept XR®), initiated 02/2025.
  **Original DLP:** "Competitive Academic Scholarship Pursuit" (Registered by Guardian 01/20/2025). STNF for sustained attention within cohort "CAS-1" (min. 35 mins focused task persistence).
  **Current Status:** Guardian amended DLP to "Creative Writing Focus" (Cohort #CWF-3) via AHS-780b on 01/05/2026. STNF for Cohort CWF-3 is min. 15 mins focused task persistence. Member's unmedicated Baseline attention span is 10 mins. LearnAdept XR® maintains function at 40 mins.
  **Analysis:** Member's unmedicated Baseline (10 mins) is sub-STNF for *both* original (35 min) and new (15 min) cohorts. However, current function (40 mins) vastly exceeds STNF for new DLP cohort CWF-3 (15 mins).
  **Determination:** **COVERAGE TERMINATED** effective 04/01/2026. While initial need under prior DLP was valid, current sustained performance (40 mins) exceeds the STNF requirement (15 mins) of the current DLP (Cohort CWF-3) by a non-minimal margin, reclassifying the intervention as Enhancement under the new life plan context (Clause 2.4, 3.2.1). Dose reduction to achieve ≤20 mins function recommended if therapeutic support is still desired relative to new STNF.

  **Case #:** 2027-3389-VI
  **Member:** Plan-Wide Review.
  **Issue:** Coverage status of corrective lenses (refractive error).
  **Background:** Near-universal adoption of corrective lenses (>98% Plan Members requiring them utilize covered options). Average corrected visual acuity in the population is 20/15. Average *uncorrected* acuity is 20/50.
  **Analysis:** Current population STNF for visual acuity, based on aggregate functional capacity *without intervention*, is 20/50 (Clause 2.1, 3.1). Corrective lenses elevate function far beyond this STNF (typically to 20/20 or better). The primary benefit of optimal vision relative to uncorrected individuals is inherently positional/competitive (e.g., driving safety, employment screening).
  **Determination:** **COVERAGE RESCINDED** for all refractive error correction, effective 01/01/2028. Corrective lenses constitute Non-Covered Enhancement (Clause 2.4) providing primarily competitive advantage now nullified by near-universal adoption (Clause 4.1). Interventions restoring individuals to the uncorrected STNF baseline (20/50) from a worse deficit (e.g., cataract-induced blindness) remain Covered Therapy. Members requiring correction to achieve 20/50 or better must utilize Health Savings Funds.
