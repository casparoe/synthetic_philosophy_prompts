  Okay, the user is engaging me in a philosophical debate about moral worth, specifically challenging my view that an action has moral worth only if the agent's operative reason is the right-making consideration itself. They present the case of Mira returning a lost wallet for her grandmother's approval, where the grandmother is either a perfect detector of moral rightness or of local admiration. 

  Hmm, I need to carefully distinguish between acting because something is right versus acting because an authority approves of it. The key point is that moral worth requires the right-making feature to be the agent's own reason for acting, not mediated through another's judgment. In the first Mira case, even though Grandma detects rightness, Mira's motive is still approval-seeking - the rightness itself isn't her reason. 

  Ah, I recall my previous concession about unreflective concern: when someone acts from direct concern for another person, that concern embodies the right-making feature. But Mira's case is different because her motive is fundamentally about Grandma's approval, not the wallet-owner's need. The reliability of Grandma's judgment doesn't change this - it's still deference. 

  I should emphasize that what's missing is Mira's practical orientation toward the right-making feature itself. She relates to rightness only as whatever Grandma approves, not as a consideration that could potentially conflict with Grandma's view. This isn't about internal reliability but about whether the right-making feature has direct normative grip on her will. 

  The user seems well-prepared with follow-up cases, so I must keep my response tight and focused on this distinction without getting drawn into tangents. My concession about unreflective concern actually helps here - it shows I recognize non-cognitive access to rightness, but Mira's case lacks even that direct connection.
answer: |-
  The missing element is Mira's direct practical acknowledgment of the right-making feature—the wallet-owner's need—as normatively compelling *for her*. In the unreflective helper case, the agent’s concern for the person *is* her non-inferential grasp of the moral claim; the need itself motivates her, even if she misdescribes the act’s rightness. Mira, however, relates to rightness *only* through her grandmother’s endorsement as a contingent psychological anchor. Her motive is structured as "because Grandma approves," not "because this person needs help," even if Grandma’s approval reliably covaries with that need. The will’s relation to the right-making feature here is *extrinsic*: it treats rightness as an inert fact tracked by Grandma’s judgment, not as an intrinsically reason-giving consideration that directly engages her practical rationality. Reliability isn’t the issue; what’s absent is the first-personal uptake of the moral reason *as such*. Mira’s deference makes Grandma’s approval the operative object of her will—a different motivational structure altogether, one that instrumentalizes morality rather than responding to its direct call. This preserves the core distinction: worth requires the right-making feature to function as the agent’s own practical reason, not merely as the referent of a reliable proxy.
