prompt: |-
  I'm on the strike committee of a mid-sized public-transit workers' local — about 900 members, mixed: drivers, depot mechanics, cleaners, some dispatch. A few times a year we have to decide whether to ask the membership to authorize strike action, or whether to back someone else's action, and right now we do it by arguing in a room until someone calls for a vote. I want an actual procedure we can run in a week with what we've got: no economists, nothing our organiser can't dig up in a day, and it has to fit on one page our members can read and argue with, not a paper. Our lawyer handles the purely legal side (ballots, notice periods, what our category is barred from doing outright), so I only want the moral and political test.

  I've been reading about the just war criteria — last resort, proportionality, legitimate authority, reasonable chance of success, and the rule about not deliberately targeting non-combatants — and they feel like the right shape for this, but they were built for something else and I want them adapted, not borrowed. So please write the procedure: the questions in order, what counts as a good enough answer to each, what we do when the number we'd need just isn't available, where the procedure simply stops with a no, and where it has to hand the decision back to us because it's a fight about values rather than a question of fact. Be honest about which steps are judgement wearing a hi-vis vest.

  Two things I want you to actually solve rather than wave at. First: a strike is normally coercion, not speech — it works by costing the employer money untill they concede. So I want a step that asks whether the party being costed is the party who can give us what we're asking for, and when the answer is no (our employer is a body that can't settle our claim without someone above them signing off, or we're walking out over a national policy they have no say in) the procedure needs to say something more useful than "then it's just expressive, go home." Second: most of our action costs third parties more than it costs the employer — commuters, hospital patients, contract cleaners on somebody else's payroll. Give me a distinction between harm that is doing the work (the leverage) and harm that's spillover, and a rule for how much spillover is too much when we can't put a figure on it. Also one step on the members who don't want to do it: what the procedure owes them, and what it says about asking non-members to respect a picket line.

  Then run it, briefly, on three:

  1. A 48-hour stoppage over rostering and rest breaks. The employer can concede, the grievance route has genuinely been tried twice, a ballot would pass easily, and the spillover is commuters plus a city-wide event that weekend.
  2. A sympathy strike to back a cleaners' local at a completely different employer who are running their own ballot. Our employer can give them nothing, the spillover is huge, and our members will definately want to do it — solidarity is more or less the point of having a union. If the procedure comes out no, say so plainly, say which step kills it, and say what would have to be true for it to come out yes. This is the one I expect to hate your answer to.
  3. A one-day walkout over a government policy that has nothing to do with our contract, no ballot held yet, employer can't concede and wouldn't if it could.

  At the end: what the procedure can't do. I'm thinking of the walkouts we're asked to bless after they've already started, work-to-rule and go-slows that aren't formally strike action, and action whose real point is recruitment or public opinion rather than the demand on the table — if the procedure can't even classify those, say so. And flag the two or three steps that are really votes in disguise, and who should take them: the committee, the whole membership, or just the members in the affected depot.

  Keep the whole thing under 900 words: ordered steps first, then the three cases, then the limits. No theory jargon and please don't name-drop philosophers at us, our members will switch off.
reasoning: |-
  Okay, the user is part of a strike committee for a mid-sized public transit workers' union. They need a practical, moral, and political decision-making procedure for authorizing strike actions. They mentioned just war criteria but want it adapted, not borrowed. Let me unpack their requirements.

  First, the procedure must be simple, fit on one page, and use resources they can access quickly. No economists or complex data. The legal aspects are handled by their lawyer, so focus is on moral/political questions. Key issues: ensuring the target can actually meet demands, distinguishing between leverage and spillover harm, and addressing internal dissent.

  The user highlighted two main problems. One is when the employer isn't the right target—like if higher approval is needed. The procedure must handle this beyond calling it expressive. The second is third-party harm, like commuters or patients. Need a clear way to separate necessary leverage from collateral damage and decide when spillover is excessive without exact numbers.

  Also, members who oppose the strike need consideration. How does the procedure address their concerns? And what about asking non-members to respect picket lines?

  Now, the three scenarios:
  1. Rostering stoppage: employer can concede, processes exhausted, high member support, spillover includes commuters and an event. This should likely pass.
  2. Sympathy strike: different employer, spillover huge, strong member solidarity. The user expects conflict here. The procedure might fail if the target can't concede, so need to explain why and what could change the outcome.
  3. Walkout over government policy: employer can't act, no ballot. This should clearly not pass.

  The procedure must also outline its limits: spontaneous walkouts, work-to-rule, actions aimed at recruitment rather than demands. Also, identify steps that are value judgments needing committee or member votes.

  I'll structure the steps to flow logically: starting with authority and demands, then exhaustion of alternatives, target capability, proportionality, success likelihood, harm analysis, internal support, and non-member solidarity. 

  For spillover harm, use a "reasonable bystander" test—would an impartial observer see the harm as necessary? Steps requiring judgment: proportionality, spillover assessment, and some vote steps. 

  In the sympathy strike case, the issue is the employer can't concede. To get a "yes," maybe if the action pressures a common entity or minimizes spillover? But realistically, it's tough. Need to be honest here even if the user dislikes it.

  Limitations: the procedure won't cover actions already started, non-strike actions like slowdowns, or symbolic actions without concrete demands. Flag steps 3 (proportionality), 6 (spillover), and 9 (support) as judgment-heavy, requiring committee or member input.

  Keep it under 900 words, avoid jargon. Use clear, direct language. Ensure each step has a clear pass/fail or handback. Make the three examples concise, showing how the procedure applies.
answer: |-
  Here's a strike authorization procedure designed for your committee, fitting on one page. It uses 9 core questions, prioritizes practicality, and addresses your specific requirements.

  **Strike Action Test: Moral & Political Questions (For Committee Recommendation)**

  1.  **Authority:** *Do we have the legal right and membership mandate to call this specific action?*  
      **Check:** Has a proper ballot been held *for this action/demand*? Is it within our legally permitted scope? (Handoff: If "No" or unclear, consult lawyer immediately. Stop procedure until resolved. This is foundational.)

  2.  **Core Demand:** *Is the demand specific, achievable, and directly related to our members' working conditions or rights?*  
      **Check:** Can we state *exactly* what we want? Is it something the employer *could* realistically grant? (Stop: If "No" – e.g., vague demands like "Fairness!" or demands impossible for the employer to meet. Handback: If the demand is symbolic or political – requires committee debate on values.)

  3.  **Exhaustion:** *Have all other reasonable avenues to resolve this been genuinely attempted and failed?*  
      **Check:** Grievance procedures used? Negotiations held? Mediation attempted? Evidence of employer bad faith or refusal to engage? (Handback: Disagreement about whether avenues were "genuinely" tried or "reasonable" requires committee judgement/vote.)

  4.  **Target Capability:** *Is the party we are targeting (by costing them money/disruption) the party with the actual power to grant our demand?*  
      **Check:** If our employer needs higher approval (e.g., city council, state funding body), does our action effectively pressure *that* decision-maker? (Stop: If the true decision-maker is immune to our pressure and our action *only* hurts the powerless middleman. Handback: If the link is indirect but plausible – e.g., our stoppage forces the city to pressure the state – requires committee judgement on effectiveness. **SOLVED: Action isn't "just expressive" if it pressures the real power-holder, even indirectly.**)

  5.  **Proportionality:** *Is the scale/duration of the proposed action proportionate to the seriousness of the grievance?*  
      **Check:** Is a full walkout justified for a minor scheduling tweak? Is a 1-day stoppage enough for a major safety violation? (Handback: Always. This is pure judgement. Committee must debate/vote. **Hi-Vis Judgement #1**)

  6.  **Success Likelihood:** *Is there a reasonable chance this action will succeed in winning the demand, or at least force significant concessions?*  
      **Check:** Employer's financial vulnerability? Public/political pressure generated? Strength of our position (ballot results, picket strength)? Past precedent? (Handback: Always involves prediction. Committee assesses evidence and votes. **Hi-Vis Judgement #2**)

  7.  **Harm Assessment (Leverage vs. Spillover):**  
      *   **a. Leverage Harm:** Is the *primary* financial/practical cost falling on the employer or the true decision-maker identified in Step 4? (This harm is the intended mechanism.)
      *   **b. Spillover Harm:** What significant harm falls on uninvolved third parties (commuters, patients, small businesses, other workers)? Can it be minimized?  
      **Rule:** Spillover is unacceptable if it is **severe, indiscriminate, and grossly disproportionate** to the grievance/expected gain, *or* if it hits vulnerable groups catastrophically (e.g., cutting off critical medical transport). **SOLVED:** Leverage harms the target; spillover harms bystanders. **Hi-Vis Judgement #3:** Committee weighs spillover severity (even without $ figures) against grievance seriousness and proportionality. Does the action feel *cruel* or *reckless* to a reasonable bystander?

  8.  **Member Support & Duty:**  
      *   *Is there strong evidence a majority of directly affected members support this action?* (Check: Ballot results, meeting votes, delegate feedback).
      *   *What does the procedure owe dissenters?* It ensures their views are heard (Step 3, 5, 7), demands are serious (Step 2), harm is justified (Step 7), and action has a point (Steps 4, 6). They retain the right to vote "no" in the ballot.
      *   *Asking Non-Members:* Asking other workers to respect a picket line is legitimate solidarity *if* our action meets this test. It asks them to choose sides in a justified dispute.

  9.  **Final Sanity Check:** *Even if all above pass, is this action the *right thing to do* for our members, our union, and the community we serve?*  
      **(Handback:** Always. Pure values judgement. Committee vote.)

  **Procedure Flow:** Start at Step 1. A "Stop" ends the process (Recommend "No"). "Handback" means the committee must debate and vote on that specific point to proceed. Proceed to next step only if the previous step is passed or resolved by vote.

  ---

  **Test Run:**

  1.  **48-hour Rostering Stoppage:**
      *   1: (Assume ballot held) Pass.
      *   2: Specific demands (rostering rules, breaks). Pass.
      *   3: Grievances tried twice. Pass.
      *   4: Employer can concede directly. Pass.
      *   5: Committee judges: 48hrs vs. safety/rest issues? Likely Pass (Judgement).
      *   6: Employer vulnerable, ballot strong. Good chance. Pass (Judgement).
      *   7: Leverage: Costs employer. Spillover: Commuters + event disruption. Significant but not catastrophic/vulnerable-targeting. Likely Pass (Judgement: Not grossly disproportionate).
      *   8: Ballot strong. Pass. Dissenters heard via process.
      *   9: Committee vote: Likely Yes.
      *   **Result: RECOMMEND YES**

  2.  **Sympathy Strike (Cleaners at Different Employer):**
      *   1: (Assume ballot held for *this* action? If not, Stop at 1). Assume Pass.
      *   2: Demand is cleaner's win. Achievable? Only by *their* employer. Pass (but see 4).
      *   3: Our avenues exhausted? Not applicable - not our dispute. Pass by default? (Weakness).
      *   4: **TARGET CAPABILITY FAIL:** *Our* employer cannot grant cleaners' demand. Our action doesn't effectively pressure *their* employer (different entity). Our stoppage primarily hurts *our* employer and the public, not the cleaners' boss. **STOP.** Recommend No.
      *   *For a "Yes":* The cleaners' employer would need to be directly harmed by *our* stoppage (e.g., if we transport their staff/materials), or our action must force a *common* higher power (e.g., City Hall funds both) to intervene. Spillover being huge also makes Step 7 very difficult.

  3.  **One-Day Walkout (Gov Policy):**
      *   1: **STOP.** No ballot held. Cannot proceed. (Even if it passed Step 1...)
      *   2: Demand unrelated to contract? Handback/Stop (Likely Stop: Not achievable by employer).
      *   4: Employer cannot concede policy. Stop. (Unless action demonstrably pressures government effectively, which is highly unlikely for a one-day transit stoppage).

  ---

  **What This Procedure CAN'T Do:**

  1.  **Bless Actions After They Start:** Requires prior steps (ballot, assessment). For wildcats, use crisis management, not this test.
  2.  **Formally Assess "Non-Strike" Action:** Work-to-rule, go-slows, overtime bans operate differently. Need separate guidelines (focus: proportionality, targeting, member unity).
  3.  **Actions Primarily About Recruitment/PR:** Fails Step 2 (core demand) and Step 6 (success likelihood tied to concrete win). Useful for discussion, but not the core purpose here.
  4.  **Resolve Deep Strategic Disagreements:** It structures the debate, not replaces it. Values clashes (Steps 5, 7, 9) still need committee votes.
  5.  **Predict the Future Perfectly:** Step 6 (Success) is always a best guess.

  **Key Judgement/Vote Steps (Hi-Vis Judgement):**
  *   **Step 5 (Proportionality):** Committee Vote.
  *   **Step 7 (Spillover Harm):** Committee Vote (Heavily informed by member feedback & Step 8 evidence).
  *   **Step 9 (Final Sanity):** Committee Vote.
  *   **Step 8 (Support Evidence):** Relies on Membership Ballot/Vote for affected group. Committee interprets strength.
