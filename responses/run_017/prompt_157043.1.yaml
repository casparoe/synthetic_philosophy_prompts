  ### Decision Procedure for Category Licenses

  The decision procedure evaluates any proposed or existing category for three licenses: **Induction**, **Explanation**, and **Intervention**. Each license is assessed separately through an ordered set of tests. If a test fails, the license is denied. The procedure outputs the granted licenses (with grain and horizon) or concludes the category is not a kind (`CONVENIENCE` for administrative use or `WITHDRAW` for retirement). Grain specifies the level of description (e.g., site subset, time window), and horizon specifies the validity period, including sensitivity to measurement changes.

  #### Ordered Tests for Each License
  **Tests are applied in sequence; failure at any test denies the license.**
  - **Missing/ambiguous data**: If required data is unavailable, the test fails (deny license). Grain and horizon are set to "unknown" if partial data exists, but license is denied without sufficient evidence.
  - **Stop condition**: License denied if any test fails. Proceeds to next license only if current license passes all tests.
  - **Handoff to human**: When value judgments are needed (e.g., harm assessment for `WITHDRAW`), the procedure flags it.

  **1. INDUCTION License**  
  Generalizes results from one site/time to others.  
  - **Test 1.1 (Definition Stability)**  
    - *Sufficient answer*: Definition unchanged for ≥3 years; data available across ≥80% of sites and ≥5 years. Grain: sites/periods with stable data. Horizon: from last definition change.  
    - *Missing data*: If history unknown, assume current definition used since creation; if inconsistent data coverage, grain restricted to sites/periods with data.  
    - *Stop*: Definition changed <3 years ago or inconsistent data; deny license.  
  - **Test 1.2 (Membership Stability)**  
    - *Sufficient answer*: Longitudinal data shows ≤15% drift (membership change) between consecutive assessment windows after adjusting for measurement error. Grain: assessment window level. Horizon: 1–2 assessment windows.  
    - *Missing data*: No longitudinal data → deny.  
    - *Stop*: Drift >15% not attributable to error; deny license.  
  - **Test 1.3 (Cross-Site/Time Consistency)**  
    - *Sufficient answer*: Distributions of ≥3 non-defining clinical variables (e.g., symptom severity) are consistent (p>0.05 for site/time differences, Cohen’s d<0.2) across ≥70% of sites and ≥3 years. Grain: consistent sites/periods. Horizon: 3–5 years.  
    - *Missing data*: Key variables missing at >30% of sites → deny.  
    - *Stop*: Inconsistency detected; deny license.  
  - **Test 1.4 (Predictive Validity)**  
    - *Sufficient answer*: Significant association (p<0.05) with a non-administrative outcome (e.g., treatment response), consistent across ≥80% of sites (no site-by-category interaction, p>0.05). Grain: sites with data. Horizon: ≥3 years.  
    - *Missing data*: No outcome data → deny.  
    - *Stop*: No significant/consistent association; deny license.  
  - **Granted**: If all passed. Grain/horizon aggregated from tests.

  **2. EXPLANATION License**  
  Allows category to explain causal mechanisms.  
  - **Test 2.1 (Causal Coherence)**  
    - *Sufficient answer*: ≥3 non-defining current properties cluster together (e.g., ANOVA F-test p<0.05 for category explaining variance). Grain: variable level. Horizon: stable definition period.  
    - *Missing data*: Insufficient non-defining properties → deny.  
    - *Stop*: No clustering; deny license.  
  - **Test 2.2 (Feedback Loop Check)**  
    - *Sufficient answer*: For categories with potential feedback (e.g., practice-influenced), coherence strength unchanged or decreased over time/sites without practice. Grain: pre-feedback sites/periods. Horizon: pre-feedback period.  
    - *Missing data*: No pre-feedback data → deny due to risk.  
    - *Stop*: Coherence increased with practice; deny license (circularity).  
  - **Test 2.3 (Mechanistic Plausibility)**  
    - *Sufficient answer*: Plausible mechanism proposed in literature/committee and not refuted.  
    - *Missing data*: No mechanism proposed → deny.  
    - *Stop*: No mechanism; deny license.  
  - **Granted**: If all passed. Grain/horizon from tests.

  **3. INTERVENTION License**  
  Allows targeting interventions to new members.  
  - **Test 3.1 (Homogeneous Treatment Effect)**  
    - *Sufficient answer*: Consistent treatment effect within category (e.g., non-significant heterogeneity test, p>0.05) in ≥1 trial. Grain: trial population. Horizon: trial period.  
    - *Missing data*: No trial data → deny.  
    - *Stop*: Heterogeneous effect; deny license.  
  - **Test 3.2 (Predictive Validity for Treatment)**  
    - *Sufficient answer*: Significant category-by-treatment interaction (p<0.05) in ≥1 trial. Grain: trial population. Horizon: trial period.  
    - *Missing data*: No trial data → deny.  
    - *Stop*: No interaction; deny license.  
  - **Test 3.3 (Effect Generalizability)**  
    - *Sufficient answer*: Treatment effect consistent across ≥2 sites/periods (no site/time-by-effect interaction, p>0.05). Grain: sites/periods with data. Horizon: 3–5 years.  
    - *Missing data*: Single site/period → deny.  
    - *Stop*: Inconsistency; deny license.  
  - **Granted**: If all passed. Grain/horizon aggregated.

  **Final Category Label (If All Licenses Denied)**  
  - `CONVENIENCE`: If category is used in active protocols, claims coding, or administrative tasks without evidence of harm. Permitted for registration, scheduling, or stratification for balance. *Not permitted* for subgroup claims, generalization, or targeting.  
  - `WITHDRAW`: If unused or harmful (e.g., misleading, associated with worse outcomes). Must be retired.  
  - *Handoff to human*: Harm assessment requires committee judgment.

  **Procedure Limitations**  
  - **Systematic failure**: Cannot detect unmeasured confounding (e.g., hidden variables explaining predictive validity).  
  - **Monitoring (next 2 years)**: Track (1) generalization failures for induction, (2) mechanistic disconfirmations for explanation, (3) intervention failures in new populations. Use this to revoke licenses.

