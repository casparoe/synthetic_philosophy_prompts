prompt: |-
  I am a doctoral candidate in philosophy writing a chapter on weakness of will, and I share a reading group with two behavioral economists. One of them put an argument to me some weeks ago that I have not managed to get out of, and what I want from you is a diagnosis of the argument rather than a survey of positions.

  Start from the standard definition: an agent acts akratically at t only if she acts freely and intentionally against her own all-things-considered better judgment about what she ought to do at t. The argument, as he gave it:

  (1) An agent's all-things-considered judgment at t ranks option A above option B just in case her preference ordering at t ranks A above B. There is no daylight between what she judges best at a time and what she prefers at that time for judgment to slip into.
  (2) Intentional action at t follows the agent's preference ordering at t: if at t she prefers A to B, believes herself able to A, and is not blocked, she A-s.
  (3) For an agent with a hyperbolic — or quasi-hyperbolic, beta–delta — discount function, the ordering over a smaller-sooner option s and a larger-later option l is time-indexed: l is ranked above s while both are temporally distant, and s is ranked above l once s becomes imminent.
  (4) So at every time t such an agent does what she judges best at t. No sooner does the ordering reverse than the judgment reverses with it, and the action follows both.
  (5) Akrasia requires acting against one's better judgment, and by (4) that never happens. So no agent with a hyperbolic discount function ever acts akratically in virtue of the reversal. The stock case — the dieter who eats the cake — is not a case of acting against better judgment at all, and the discounting model, precisely insofar as it successfully predicts the reversal, fails to generate the phenomenon it was introduced to explain.
  (6) Nothing in (1), (2) or (4) depends on the shape of the discount function. Generalize, and no intentional action is ever akratic; continence becomes trivially universal rather than an achievement, and the effortful, variable, sometimes exhausting character of self-control becomes unintelligible.

  He takes (6) as a reductio of the orthodox picture and concludes that we should stop treating continence and incontinence as a distinction in the agent's will and treat it as a distinction in her circumstances. I cannot accept that, and I also cannot find the step.

  Three wrinkle cases I have tried on him, which seem to me to make the problem worse rather than better.

  First, the clear-eyed dieter. Suppose that at t her discount function has reversed, so her preference ranks s above l, but she also sincerely and reflectively judges at t that l is what she should do, and says so while reaching for the cake. If this counts as akrasia, then (1) is false and judgment and preference can come apart at a time. But then I do not know what work hyperbolic discounting is doing: either the preference reversal is the whole story, in which case clear-eyed akrasia is impossible and my case is misdescribed, or the reversal is not the whole story, in which case the model under-determines the phenomenon.

  Second, the sophisticated agent who pre-commits. If (4) is right, then at t she cannot act otherwise than her t-indexed ordering dictates, so resisting temptation without a commitment device is impossible; yet people plainly do resist without one. This makes me want to reject (2) rather than (1), and to allow that an agent can act against her present preference ordering. But then I owe an account of how such an action is explained and caused at all, and I have the familiar worry that contra-motivational action starts to look like a lucky spasm rather than something she does.

  Third, an agent with the reverse profile: impatient at a distance, patient up close, so that she defers a readily available good while judging at t that she should take it, and then judges at the later time that she should have taken it. If akrasia is symmetric — if it should be possible to act against one's judgment in either direction — then a model that generates only one direction of reversal cannot be the whole account of failures of self-governance.

  So: which step do you reject, and what does rejecting it cost? Please tell me why the step I should reject looked compelling in the first place, and price the alternatives rather than just listing them. Two specific things I would like addressed. If I keep (2), is the right move to reject (1) and reconceive better judgment so that it is indexed to the agent as a temporally extended entity rather than to a time-slice — and if so, what fixes which slice's judgment is authoritative for her, and does the notion of a better judgment survive once every candidate slice is admitted to be her? Alternatively, should I give up the standard definition and reconceive akrasia in terms of self-governance, practical identity, or the failure to conform to one's own diachronic policies — and if I do, what becomes of the ordinary first-personal phenomenology of acting against one's better judgment, and of the intuition that the continent and the incontinent agent differ in something other than their environments? If I have to choose, I would rather give up the judgment–preference link than the claim about how intentional action relates to preference, since the quasi-hyperbolic modeling result is not something I want to relitigate here; but I want to know exactly what I am paying and whether the bill is larger than I think.
reasoning: |-
  Okay, let me start by unpacking the doctoral candidate's dilemma. They're grappling with a behavioral economist's argument that challenges the existence of akrasia within the hyperbolic discounting model. The core issue is that the argument seems to eliminate the possibility of acting against one's better judgment by collapsing judgment into preference at each time slice. 

  First, I need to pinpoint where the argument goes wrong. The economist claims that since judgment equals preference at any given moment (premise 1), and action follows preference (premise 2), the preference reversal in hyperbolic discounting means the agent always acts according to their current judgment (premise 4). This leads to the conclusion that akrasia never occurs.

  Hmm. The wrinkle cases the philosopher presents are revealing. The clear-eyed dieter suggests judgment and preference might come apart, which directly contradicts premise 1. The sophisticated agent who resists without pre-commitment challenges premise 2. The reverse profile case questions the model's symmetry. 

  I think the fatal flaw is premise 1's equation of "all-things-considered better judgment" with "preference ordering." In philosophy, better judgment typically involves reflective endorsement of values, while behavioral economics often reduces judgment to revealed preference. The philosopher's standard definition of akrasia requires acting against what the agent reflectively believes she ought to do, not merely against what she currently desires. 

  When the dieter reaches for cake while saying "I shouldn't do this," that "shouldn't" reflects her persisting commitment to long-term health goals - it's not just a momentary preference. The economist's model misses this normative layer by reducing all evaluation to time-slice preferences. 

  The cost of rejecting premise 1 is significant though. It means accepting that agents have multiple evaluative standards simultaneously: their momentary preferences and their reflective commitments. But this aligns with hierarchical theories of will (Frankfurt, Bratman) where akrasia occurs when actions conflict with higher-order volitions. 

  For the action-preference link (premise 2), we might preserve it by distinguishing between occurrent preferences (driving action) and dispositional preferences (reflecting values). The dieter acts on occurrent preference while her dispositional preference aligns with better judgment. 

  The bill for this solution? We must develop an account of how reflective judgments persist across time-slices and how they exert causal influence. This might involve notions like diachronic identity or planning agency. The phenomenology of regret in the dieter case actually supports this - she regrets immediately because her action violates her enduring normative commitment.
answer: |-
  Your colleague's argument is clever but rests on a fundamental conflation in premise (1). I reject **premise (1)** and argue that it misidentifies the nature of "better judgment" in akrasia. Here’s the breakdown:

  ### **Why (1) is False and Why It Looks Compelling**
  - **The Flaw**: Premise (1) equates an agent’s "all-things-considered better judgment" with her *occurrent preference ordering at t*. But in the philosophical tradition (e.g., Davidson, Bratman), better judgment is a **reflective, normative assessment** of what *ought* to be done, grounded in the agent’s enduring values or commitments. Preference orderings in behavioral economics are **revealed choices** driven by momentary incentives.  
    - *Example*: The dieter judges "I ought to refuse cake" (reflecting her commitment to health) while simultaneously having a occurrent preference *for* cake due to visceral temptation. Her better judgment persists *as a commitment* even when her preference reverses.  
  - **Why It Looks Compelling**: Behavioral economics often operationalizes "judgment" as revealed preference (since preferences are inferred from choices). This collapses the normative/descriptive distinction. Hyperbolic discounting models predict preference reversals, but they don’t require that the agent’s *normative self-assessment* reverses simultaneously.  

  ### **The Cost of Rejecting (1)**
  1. **Theoretical Cost**: You must defend a **dual-aspect psychology** where agents have:  
     - (a) *Occurrent preferences* (driving intentional action, per premise 2),  
     - (b) *Reflective judgments* (grounded in diachronic values).  
     This risks dualism, but it’s mitigated by frameworks like **Bratman’s planning theory** (judgments as stable plans) or **Frankfurt’s hierarchical volitions** (better judgments as higher-order desires).  
  2. **Empirical Cost**: Behavioral economists might protest that "judgment" isn’t observable. Reply: We infer judgments from avowals (e.g., "I shouldn’t eat this"), post-hoc regret, or pre-commitment behaviors.  

  ### **Saving Akrasia and Self-Control**
  - **Akrasia Redefined**: An agent acts akratically when she acts *against her reflective, commitment-grounding judgment* despite it being consciously accessible. The dieter *prefers* cake at *t* but *judges* (reflectively) that she ought to refuse it.  
  - **Self-Control’s Effort**: Self-control is the effortful maintenance of action aligned with reflective judgment *despite* occurrent preferences. This explains why resisting temptation is exhausting: it requires suppressing the occurrent preference.  
  - **Addressing Your Wrinkle Cases**:  
    - *Clear-eyed dieter*: Akrasia is possible because her reflective judgment ("I should refuse") conflicts with her occurrent preference ("I want cake now"). Hyperbolic discounting explains the *preference reversal* but not the *persistence* of her normative judgment.  
    - *Sophisticated agent*: She *can* resist without pre-commitment by effortfully aligning action with reflective judgment (e.g., focusing on long-term goals). This doesn’t violate (2) if we distinguish *occurrent preference* (defeated) from *action-driving intention* (aligned with judgment via effort).  
    - *Reverse profile agent*: Akrasia isn’t symmetric. Judging "I should take it now" but deferring aligns with a *conservative* reflective judgment (e.g., "never rush"). If no such judgment exists, this is akrasia—but hyperbolic discounting doesn’t model it.  

  ### **Should You Index Judgment to the Extended Agent?**
  Yes—but **cautiously**.  
  - **Authority Problem**: The "authoritative" judgment is the one endorsed by the agent’s **practical identity** (Korsgaard) or **diachronic plan** (Bratman). For the dieter, her health commitment is authoritative because it structures her life-narrative.  
  - **Phenomenology Preserved**: The agent experiences tension because her action conflicts with *what she reflectively stands for*. This explains regret: she feels "I betrayed myself."  
  - **Continence as Achievement**: The continent agent succeeds in making her action track her reflective identity; the incontinent agent fails. This difference is agential, not environmental.  

  ### **Alternatives Considered (and Rejected)**
  - **Reject (2) instead?** Dangerous. If intentional action doesn’t track preference, action explanation becomes mysterious (as you note). Keep (2) but limit "preference" to *occurrent* desires.  
  - **Scrap the Standard Definition?** Unnecessary. The standard definition can survive if "better judgment" is understood as *reflective commitment*.  

  ### **What You Pay (and Gain)**
  - **Cost**: You must defend a robust notion of **practical rationality** that isn’t reducible to choice-based preferences. Economists may dismiss this as "unscientific," but your tools are philosophical.  
  - **Gain**: You save akrasia, explain self-control’s effort, and reconcile the discounting model with phenomenology. Hyperbolic discounting explains *why* occurrent preferences reverse—but akrasia occurs when the agent’s *reflective self* resists this reversal.  

  ### **In Short**  
  Your colleague’s argument fails because it conflates *revealed preference* with *normative judgment*. Rejecting (1) allows you to:  
  - Preserve the core of hyperbolic discounting (as a model of preference shifts),  
  - Explain akrasia as a conflict between occurrent preference and reflective judgment,  
  - Ground continence in the agent’s effort to align action with her enduring commitments.  
  The "bill" is a commitment to a richer psychology—but it’s one philosophy is well-equipped to pay.
