answer: |-
  Your demand for a grain commits the very error I resist: events aren't pre-sliced like salami; we individuate *through* causal inquiry. But take your council's collapse: at the grain of "capitulation occurring on June 15, 1912, with McLeod casting the decisive vote after the telegraph confirmed police absence," true overdetermination would require two *simultaneous, sufficient, and independent* causal chains forcing that precise outcome—say, the wage cut alone *and* the police withdrawal alone each being sufficient to make McLeod break at 3:17 PM when the wire arrived, with no interaction. Find me a documented historical case where such knife-edge duplication exists for a finely described event, and I’ll concede. They vanish under scrutiny; what you call overdetermination is either coarse description masking a dominant thread, or robustness against alternatives. Your 1908 non-event? Its "causes" aren't comparable—they’re heterogeneous barriers (no wage cut, strong police, weak radicals), not rival sufficient triggers for a specific collapse. You’ve confused preventing *any* collapse with causing *this* one. Now defend your smuggled press: was it truly independent of the price crash, or did the crash enable their mobilization?  

  *(I’m ready—keep arguing.)*
