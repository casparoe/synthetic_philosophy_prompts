  **Part 3: Substantive vs. Verbal Disagreements**  
  - **Substantive**: (a), (b), (e). These involve core assumptions (weighting by observers, reference class boundaries, action guidance) with empirical consequences. Resolving them requires new principles or evidence.  
  - **Verbal**: (c), partially. The "person vs. observer-moment" dispute re-describes the same problem: what unit defines "observation"? If re-described as a choice of clock (subjective vs. objective time), the disagreement reduces to whether we sample minds or moments. What survives: both agree the choice is critical, but neither derives it from first principles.  
  - **Substantive**: (d). Infinity remains unresolved; no verbal re-description helps.  

