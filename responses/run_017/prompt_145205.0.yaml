  ### Joint Document on the Doomsday Argument: Adversarial Collaboration  

  **Part 1: Agreed Claims**  
  1. **Bayesian Structure**: Both parties agree the argument is Bayesian. The likelihood of observing birth rank \(n \approx 1.1 \times 10^{11} + 1\) under hypothesis \(H\) (with total population \(N\)) is \(P(n \mid N) = 1/N\) for \(n \leq N\), and 0 otherwise. This assumes uniform sampling from all \(N\) observers.  
  2. **SSA-Based Shift**: Under the self-sampling assumption (SSA) with a reference class of terrestrial humans, the likelihood ratio for \(H_{\text{soon}}\) (total \(N_{\text{soon}} = 2 \times 10^{11}\)) vs. \(H_{\text{vast}}\) (total \(N_{\text{vast}} = 10^{16}\)) is:  
  \[
  \frac{P(n \mid H_{\text{soon}})}{P(n \mid H_{\text{vast}})} = \frac{1 / (2 \times 10^{11})}{1 / (10^{16})} = 5 \times 10^4.
  \]  
  This favors \(H_{\text{soon}}\) by a factor of 50,000.  
  3. **Limitations of the Argument**:  
     - It names no causal mechanism for doom.  
     - It does not predict the timing of extinction; it only updates odds between \(H_{\text{soon}}\) and \(H_{\text{vast}}\).  
  4. **Shared Likelihood**: Both accept \(P(n \mid N) = 1/N\) as the correct likelihood function conditional on \(N\). The dispute lies in priors and reference-class boundaries.  
  5. **Reference Class Dependence**:  
     - The choice of reference class (e.g., humans vs. all observers) is load-bearing: changing it alters conclusions.  
     - Neither side claims a principled, universally agreed derivation of the reference class; it is stipulated or inferred from context.  
  6. **Admitted Failure Cases**: Both frameworks fail to handle infinite universes without regularization (see §2d).  

