  **Part 2: Disagreements Table**  

  | Issue | SSA-Based Doomsday Arguer | SIA-Based Theorist | Crux Beneath | Test/Case | Predictions |
  |-------|---------------------------|-------------------|-------------|----------|------------|
  | **(a) Prior weighting by observers** | Prior \(P_0(H)\) is independent of observer count. Formula: \(P(H \mid n) \propto P(n \mid H) \cdot P_0(H)\). | Prior \(P_0(H)\) is proportional to the number of observers in \(H\). Formula: \(P(H \mid n) \propto P(n \mid H) \cdot N_H \cdot P_0(H) = P_0(H)\). | Should hypotheses with more observers gain prior weight? SIA weights by observers; SSA rejects this as "double-counting." | **Test**: Two hypotheses: \(H_1\) (1 observer) and \(H_2\) (1,000 observers), with equal non-anthropic priors. What is \(P(H_2)\) before observing \(n\)? | **SSA**: \(P(H_1) = P(H_2) = 0.5\). **SIA**: \(P(H_2) = 1000/1001\). |
  | **(b) Reference class with alien civilization** | Alien observers (discovered in 2089: \(10^{25}\) beings over \(10^7\) years) are outside the reference class (terrestrial humans). Credence in \(H_{\text{soon}}\)/\(H_{\text{vast}}\) unchanged; only non-anthropic priors may shift if aliens correlate with human survival. | Aliens are in the reference class (all observers). Prior for any \(H\) boosts by total observers (humans + aliens), diluting human birth rank. Shift favors \(H_{\text{vast}}\) if aliens are likelier under long-lived civilizations. | Is the reference class restricted to humans or universal? SSA excludes aliens; SIA includes them. | **Test**: Does alien discovery alter \(P(H_{\text{vast}})\)? Both update non-anthropic priors, but anthropic update differs. | **SSA**: No anthropic shift. **SIA**: Birth-rank evidence swamped; posterior nears non-anthropic prior. |
  | **(c) Cheap minds (artificial observers)** | Reference class = biological humans (persons). Artificial minds (\(10^{25}\) total, \(10^6 \times\) humans, \(10^6 \times\) speed) excluded. \(H_{\text{vast}}\) ruled out: our birth rank (\(1.1 \times 10^{11} + 1\)) exceeds its biological humans (\( \approx 10^{10}\)). | Reference class = all observers (including artificial). If counting persons, SIA cancels shift. If counting observer-moments, \(H_{\text{vast}}\)’s prior boost grows \( \approx 10^{12} \times \) (due to speed/number), further favoring it. | Should artificial minds be in the reference class? Should we count persons or moments? | **Test**: Does switching to observer-moments change conclusions? | **SSA**: Weakens if forced to count moments (low chance of being biological). **SIA**: Strengthens \(H_{\text{vast}}\) if counting moments. |
  | **(d) Infinity** | No trusted procedure. Doomsday shift may not survive: with infinite observers, \(P(n \mid H) = 0\). Regularization (e.g., finite volumes) is untested. | No trusted procedure. SIA prior \(\propto\) observer count diverges. Regularization (e.g., measure-theoretic) untested. Shift likely vanishes. | Neither has a resolution for infinite universes; both frameworks fail. | **Test**: Limiting ratio as \(N \to \infty\)? | **SSA**: Shift may persist in finite subspaces. **SIA**: Shift cancels in all regularizations. |
  | **(e) Practical upshot** | Increases extinction risk spending: shift favors \(H_{\text{soon}}\) (LR = 50,000). E.g., if priors were 1:1, \(P(H_{\text{soon}}) \approx 1\). Supports urgent mitigation. | No change: anthropics cancel. Spending based only on non-anthropic priors. If non-anthropic odds favor \(H_{\text{vast}}\), focus on long-term projects. | Does the doomsday argument compel action? SSA says yes; SIA says no. | **Test**: Would a rational agent pay more to prevent doom post-update? | **SSA**: Yes, proportionally to shift. **SIA**: No. |

