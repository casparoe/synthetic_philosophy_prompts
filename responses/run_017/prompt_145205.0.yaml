      Yes. The doomsday argument shifts our posterior in favor of H_soon (doom soon). Therefore, we should increase our spending on reducing extinction risk. We cannot give an exact number because it depends on the non-anthropic prior and the utility function, but the shift is substantial (likelihood ratio 50,000). So if we started with even odds, we now have P(H_soon) = 50,000 / (50,000+1) ≈ 1.
  - SIA theorist:
      No. The anthropic update cancels out. Therefore, we should rely solely on the non-anthropic prior. If the non-anthropic prior favors H_vast, then we should not spend as much on extinction risk and should focus on long-term projects. The SIA framework yields no number from the anthropic argument; it falls silent on this update.

  Part 3: Sorting Disagreements into Substantive and Verbal

  - Crux (a): Substantive. The disagreement is about how to set the prior over hypotheses, which affects the entire update.
  - Crux (b): Substantive. The choice of reference class is a deep disagreement with empirical consequences.
  - Crux (c): Partly substantive, partly verbal. The question of whether to count persons or moments is substantive. The question of whether artificial minds are in the reference class is substantive. But the choice between persons and moments might be re-described as a choice of what we mean by "observer". What survives: the need to specify the reference class and the unit of counting.
  - Crux (d): Substantive. There is no agreed regularization for infinity.
  - Crux (e): Substantive. The upshot for action depends on the framework.

