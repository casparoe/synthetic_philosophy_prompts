prompt: |-
  I teach an upper-level undergraduate seminar on meaning and rule-following: sixteen students, one eighty-minute session, one teaching assistant, a room with movable chairs, index cards, and a board. I want a runnable activity that makes them feel, rather than hear, why the rule-following debate is not a puzzle about other people or about the limits of evidence. By the end I want them to have run into four things on their own: that the pressure is first-personal and about *correctness* rather than about knowledge of someone else's mind; that nothing they can point to inside themselves — a formula, an image, a felt sense of "and so on", their own past answers — settles which rule they meant, because whatever they point to is itself something that has to be taken one way rather than another; that appealing to the community does not end the difficulty but moves it up a level, since agreement with whom, over what range of cases, and counted in what respect is the same question again; and that what is left at the bottom is not ignorance of a fact but something more like a decision about whether to go on with a person.

  The device I have in mind, which you may replace if you have something better and you should say what makes your replacement better, is this. Give the sequence 1, 2, 4, 8, 16 and ask for the next term. Most will write 32. Among the responses they see, one card gives 31, with its rule stated: the greatest number of regions you can cut a circle into by joining every pair of n points on its circumference, which begins 1, 2, 4, 8, 16, 31, 57, 99. This matters because the usual dismissal of a deviant continuation is that the deviant rule is gerrymandered, disjunctive, or grue-like; this one is none of those things. It is a perfectly projectible, non-ad-hoc mathematical function that simply happens to agree with doubling for the first five terms. So the class cannot wave it away, and the question "what makes it the case that I meant doubling?" has to be answered on its merits. I also want a far-divergence card alongside it — a rule that agrees with the expected one on every case anyone in the room will ever meet and diverges only at inputs far too large to check — plus a short paired exercise in which one student privately writes down a rule and their partner, without seeing it, produces a different rule that fits every term revealed so far, however many terms they are given. The partner always wins, and I want them to feel that. Since the discussion should not look like a fact about arithmetic, include at least one non-numerical parallel case in which the continuation of a pattern of shapes or of the application of an ordinary predicate is at issue.

  Constraints. No lecture before the activity, and the words Kripke, Wittgenstein, quus, grue, sceptical solution, indeterminacy and rule-following paradox are not used until the final eight minutes. The cards must be described honestly as responses collected in another seminar rather than passed off as this class's own. The facilitator may never assert that there is no fact of the matter: if that claim arrives, a student has to say it and the others have to push back on it. The final poll should be designed to discriminate three positions that are easy to run together — there is a determinate fact about which rule was meant and we merely cannot tell which; it is indeterminate which rule was meant, though something weaker is still true; and there is no fact here at all, so that asking which rule was meant is not asking a question with an answer waiting to be found — and the debrief should say what each answer commits the student to and which of the three the activity itself can support.

  What I need from you: the rules and materials; a minute-by-minute timetable for the eighty minutes; the debrief, mapping each moment of the session onto the claim it is supposed to make visible and marking, for each of the escape routes students will reach for — simplicity or naturalness, introspection, intentions, more data, community agreement — where in the timetable it arises, what it would cost to take it, and what is wrong with taking it there; an honest list of what will predictably go wrong the first time I run this, with a fix for each; and a frank account of which feature of the debate the activity cannot reproduce and which the facilitator must therefore say out loud. On that last point I take it that the normativity claim — that meaning fixes what one *ought* to answer, not merely what one will — is the hardest thing to stage, since the experience the activity produces is naturally described as not being able to tell, and I would like you to say how to convert that into the stronger claim without simply asserting it.
reasoning: |-
  We are designing an 80-minute seminar activity to help students experience the rule-following paradox from the inside, focusing on the first-personal pressure of correctness, the failure of internal states to fix a rule, the problem with appealing to community, and the idea that what remains is a decision rather than a fact.

  The core activity: 
  1. Present the sequence: 1, 2, 4, 8, 16. Ask for the next term.
  2. Collect responses on index cards. Then reveal a few, including:
     - The expected "32" (with the rule: doubling each time)
     - "31" (with the rule: the maximum number of regions defined by connecting every pair of n points on a circle. Sequence: 1,2,4,8,16,31,57,...)
     - A far-divergence rule (e.g., a rule that matches doubling for all numbers up to, say, 1000, and then diverges). We don't need to write the actual next term for this one because it's beyond what we can write, but we can describe the rule: "double until 1000, then add 1" (but note: we don't want to give a term that is actually written, so we just describe the rule and note that it matches for all the numbers we have and for any we might write in class).

  Additionally, we want:
  3. A paired exercise: One student (A) writes down a rule (private) and the other (B) tries to guess the next term. After each guess, A reveals the next term in their rule. B then writes a rule that fits all the revealed terms. The key is that B can always produce a rule that fits, no matter how many terms are revealed, by constructing a rule that is "the series defined by the terms so far and then anything after". This is the "curve-fitting" problem.

  Non-numerical parallel: We should have one. For example:
     - A sequence of shapes: e.g., square, circle, square, circle, ... What comes next? But then we can have a rule that alternates until step 5 and then becomes all squares, or something. Alternatively, we can use an ordinary predicate: e.g., show a series of color patches that are all green until one that is blue-green and ask if it's green. But we want a pattern. Let me think of one.

  Alternative non-numerical: 
     - A pattern of arrows: →, ↗, ↑, ↖, ←, ... (rotating 45 degrees counterclockwise). The next would be ↙. But then we can have a rule that says: for the first 5 steps, rotate 45 degrees counterclockwise starting at →, then at step 6, rotate 90 degrees. So the sixth term would be ↓. We can also have a rule that continues the 45-degree rotation (so ↙) and one that does something else.

  But we want it to be projectible and non-gerrymandered? Actually, we want to show that even in non-numerical contexts, multiple rules fit.

  Another idea: Use a word pattern. E.g., "ba", "bba", "bbba", "bbbba", ... What comes next? Most say "bbbbba". But we could have a rule that after five "b"s followed by "a", we do something else (like "c"). But that might be seen as disjunctive.

  Alternatively, a pattern in behavior: e.g., a story about a teacher who says "add 2" and the student writes 2,4,6,8,... but then at 1000 writes 1004. The teacher says "I meant add 2 up to 1000, then add 4." But that's numerical.

  We can do a simple geometric pattern: 
     Draw a sequence of figures:

     Step 1: *
     Step 2: *
              *
     Step 3: *
              *
              *
     Step 4: *
              *
              *
              *

     What's step 5? Most would say a vertical line of 5 stars. But a rule could be: for n<=4, a vertical line of n stars; for n=5, a horizontal line of 5 stars. So step 5 would be: * * * * *

  But let's stick to the numerical and have one non-numerical example as a parallel.

  Plan:

  Minute-by-minute:

  0-5 min: Introduction. Without using the technical terms, set up the activity. "Today we are going to explore how we follow rules. I'm going to give you a sequence of numbers and ask for the next one. Then we'll see what happens."

  5-10 min: Present the sequence: 1,2,4,8,16. Ask each student to write on an index card the next number and a brief statement of the rule they are following. They should also write their name (so we can call on them). They have 2 minutes to do this. Meanwhile, the TA and I will prepare the board.

  10-15 min: Collect the cards. Then, read out a few of the "32" responses. Then reveal the "31" card (described as from a previous seminar) and explain the rule (circle regions). Then reveal the far-divergence rule (also from a previous seminar) and explain it: "This rule is: double the number until you get to 1000, and then for 1001, instead of doubling, add 1. But note, for all the numbers we've written, and for any we could write here, it matches doubling."

  15-20 min: Facilitate initial reactions. Ask: "What do you think of these different rules? Which one do you think was intended? How do you know?" The goal is to get them to see that the usual ways of dismissing the alternative rules (like being disjunctive) don't work for the circle regions rule. Also, the far-divergence rule shows that even if we check a lot of terms, we might still be wrong.

  20-30 min: Paired exercise. Pair the students (8 pairs). In each pair, one is A (rule-maker) and one is B (rule-guesser). A chooses a rule (they can choose doubling, or the circle regions, or something simple like add 3, or a non-numerical rule we provide? But we want them to be able to generate terms). We can give A a choice of two rules? But they might not understand. Instead, we provide a set of rules for them to choose from? Or we let them make up any rule? We want B to be able to win, so we need the rule to be one that B doesn't know. But if A makes up a rule, it might be hard for B to play. So we'll give A a rule from a set we provide? We want the rule to be one that has been defined for all n, so that A can give the next term for any n.

  Solution: We give each A a card with a rule. The rules are simple, but we have a variety. Examples: 
     - Double the number (starting at 1)
     - Add the current position (so for n=1:1, n=2: 1+2=3, but wait that doesn't match the initial sequence). We need the initial sequence to be fixed? Actually, we are starting over for the paired exercise. We don't have to use the same sequence. We can start with a new sequence. But we want the point to be that B can always fit a rule.

  Better: Let the paired exercise use a new sequence. We can have A's rule defined by a function f(n). For example:
     Rule 1: f(n) = n
     Rule 2: f(n) = 2n
     Rule 3: f(n) = n^2
     Rule 4: f(n) = n(n-1)/2 + 1   [which gives 1,2,4,7,11,...]

  But we want B to be able to produce a rule that fits any finite set of terms. So we can do:

     A is given a rule (say, f(n)=n). They will generate the sequence: 
        n=1: 1
        n=2: 2
        n=3: 3
        ... 

     B is asked to guess the next term. After each guess, A reveals the next term. Then B writes a rule that fits all the terms so far. For example:

     After n=1: term=1. B can say: the rule is f(n)=1 (constant). Then when A gives n=2:2, which doesn't fit. So B must revise. But we want B to be able to always have a rule that fits. So instead, we have B write a rule after each new term is revealed, and it must fit all the terms so far.

     Step-by-step:
       Step 0: No terms. (Skip)
       Step 1: A reveals f(1)=1. B writes a rule: f(n)=1. Then A reveals f(2)=2. Now B's rule fails. So B must write a new rule that fits f(1)=1 and f(2)=2. They can write f(n)=n. Then A reveals f(3)=3. It fits. Then A reveals f(4)=4. It fits. 
       But if A's rule is f(n)=n until n=5, then f(5)=100? Then when A reveals f(5)=100, B must write a rule that fits 1,2,3,4,100. They can write: f(n) = n for n<5, and f(5)=100. Then for n=6, A reveals f(6)=? (if A's rule is f(n)=n, then f(6)=6, but that doesn't fit B's rule). So then B must revise again: f(n)=n for n<5, f(5)=100, and f(6)=6. But then A reveals f(6)=6? Then it fits.

     The point is that for any finite set of points, B can always construct a rule that fits exactly those points. We want B to see that they can always do this, and that they can even write a formula (like a polynomial) that fits the given points.

     However, in practice, for a class, we might not want to get into polynomial interpolation. So we can let B use piecewise rules: "the sequence is 1,2,3,4,100, then 6, then ..." but that becomes messy.

     Alternatively, we can have B write the next term they predict (without having to state a rule) and then after A reveals the next term, B then writes a rule that fits all the terms so far. And we want B to be able to do this every time.

     We can show that there are infinitely many rules that fit any finite set of data.

     How to do this without math? We can have B just state a rule in words that fits. For example:

       Terms: 1,2,3
       B can say: "add one each time" -> so next term 4.
       But if A then gives 5 (so the sequence so far: 1,2,3,5), then B can say: "the rule is: the first three terms are +1, then the fourth is +2, then ..." and then they can say the next term they predict is 7? But then if A gives 6, then B must adjust.

     This might be too vague. Alternatively, we can skip the paired exercise and instead do a group version? But we want every student to experience it.

     Revised plan for paired exercise:

       We'll do two rounds. In the first round, A has a rule and B tries to guess the next term. They do a few terms. Then we stop and ask: can B be sure? Then we do a second round where B's job is not to guess the rule but to write, after each new term, a rule that fits the data so far. We want B to see that they can always write such a rule.

     We can provide a set of rules to A. We have 8 pairs, so we can have 4 different rules. We give each A a card with a rule, e.g.:

       Rule 1: f(n) = n
       Rule 2: f(n) = 2n
       Rule 3: f(n) = n^2
       Rule 4: f(n) = 10*n

     Then the sequence is generated by n starting at 1. So:

       Rule 1: 1,2,3,4,5,...
       Rule 2: 2,4,6,8,10,...
       Rule 3: 1,4,9,16,25,...
       Rule 4: 10,20,30,40,...

     But note: we want the initial terms to be the same for multiple rules? Actually, no. We want to show that for any finite set, there are many rules. So we can start with n=1 and go up.

     How the exercise goes:

       Step 1: A reveals f(1). Then B writes a rule that fits f(1). (B can write any rule that gives that number at n=1, e.g., constant function, or linear, etc.)
       Step 2: A reveals f(2). Then B must write a rule that fits both f(1) and f(2). 
       Step 3: A reveals f(3). Then B writes a rule that fits all three.

     And so on. We do up to n=5.

     Then we stop and have each pair report: did B manage to write a rule at every step? (They should have.) Then we ask: if we did this forever, would B always be able to write a rule? (Yes, because there are infinitely many functions that fit any finite set of points.)

     But we want them to feel that B is always winning: that no matter what A does, B can produce a rule that fits. And then we point out that if this is so, then how can A have meant a particular rule all along? Because B is always able to produce a rule that matches the data.

     However, note: the rule B writes might be very complex (piecewise) and that might be unnatural. But we can allow B to write piecewise rules. For example:

        n=1: 2. B says: f(n)=2 for all n.
        n=2: 4. B says: f(n)=2n for all n.
        n=3: 6. B says: f(n)=2n (still).
        n=4: 8. B says: f(n)=2n.

     But if A has a rule that changes at n=5: f(5)=100, then B must change:

        Now terms: 2,4,6,8,100.
        B can say: f(n)=2n for n=1,2,3,4; and for n>=5, f(n)=100.

     So it's always possible.

  30-40 min: Paired exercise in progress. We need to keep it to 10 minutes, so we do 5 terms per pair.

  40-50 min: Groups report. Each pair shares: what was the rule A was using? How did B's rules change? What happened? Then we discuss: did B always have a rule that fit? How is that possible? What does that say about the idea that the rule A had in mind was determined by the data?

  50-55 min: Non-numerical parallel. Present a non-numerical pattern. Example:

     A sequence of shapes:

        Step 1: red circle
        Step 2: blue circle
        Step 3: red square
        Step 4: blue square
        Step 5: ?

     What comes next? Most might say red circle? Or blue circle? But we can have a rule that says: after step 4, we start over? Or we can have a rule that says: the next is green triangle.

     But we want to show that there are multiple rules. We can present two possibilities:

        Rule 1: the pattern cycles every 4: red circle, blue circle, red square, blue square, then red circle, ...
        Rule 2: the pattern is defined by a function of n: for n mod 4 = 1: red circle; n mod 4=2: blue circle; n mod 4=3: red square; n mod 4=0: blue square. Then for n=5, it's red circle.

     But we can also have:

        Rule 3: for n<=4, as above; for n>=5, we alternate red and blue circles.

     So for n=5: red circle; n=6: blue circle; n=7: red circle; etc.

     We can also have a rule that after n=4, we do the same but with triangles? So step 5: red triangle.

     The point is: without a rule that specifies what to do beyond the observed, there is indeterminacy.

  55-65 min: Group discussion. The goal is to draw out the four points:

     a) The pressure is first-personal: when you are the one who is supposed to follow the rule, you feel that there is a correct answer, but you cannot point to anything inside that fixes it.

     How to draw this out? We can ask: "When you were the rule-maker in the pair, did you feel that there was a right answer for the next term? How did you know what it was? What if your partner had written a different rule that also fit the data? Does that mean you were both following the same rule until the divergence point? Or does it mean that you were following different rules that happened to coincide?"

     b) Internal states fail: We can ask: "When you were the rule-maker, what was in your mind when you thought of the rule? A formula? An image? A feeling? Did that feeling tell you exactly what to do for every case? Could that feeling have been interpreted in multiple ways? For example, if you had the rule 'double', did the feeling of doubling tell you what to do for 1000? Or for 1001? Or when you thought of the rule, did you have a formula? But the formula is just symbols. Couldn't the symbols be interpreted in different ways? (Like the '+', which might be quus in Kripke's example.)"

     c) Community doesn't help: Ask: "What if we decided by voting? But then we have to agree on what counts as the same rule. What if the community disagrees? Or what if the community changes its mind? And how do we know which community? This class? All humans? What if we found an ancient text that had a different rule? How do we know they meant the same rule?"

     d) What is left: Ask: "So if there is no fact about which rule was meant, then what are we doing when we follow a rule? Are we just deciding to go on in a particular way? And when we say someone made a mistake, are we just saying that we don't want to go on with them?"

  65-75 min: Final poll and debrief.

     Poll: We want to discriminate three positions:

     Position 1: There is a determinate fact about which rule was meant, but we cannot always know it (epistemic).
     Position 2: It is indeterminate which rule was meant, but there is still something there (maybe a cluster of rules, or a partial fact).
     Position 3: There is no fact of the matter at all about which rule was meant; it's not a question that has an answer.

     Ask: Which of these best captures what we experienced?

     Then we tally and discuss each:

     - Position 1: What would the fact consist in? How would it be determined? Why can't we know? The activity shows that no amount of data fixes it? But maybe the fact is in the mind. But then we saw that the mind doesn't fix it either. And if the fact is in the mind, then how does it fix the application to an indefinite number of cases?

     - Position 2: What would the indeterminacy look like? How would it be different from no fact? And how would we decide what is in the cluster? This might be a middle ground, but it still leaves open how we go on.

     - Position 3: Then rule-following is not a matter of discovery but of decision. But then what about correctness? How can we say someone is wrong? We can say: we have decided to count this as wrong. And we might exclude them from our community.

     The activity supports position 3? But note: we don't want the facilitator to assert that. We want the activity to push toward it.

  75-80 min: Finally, we introduce the technical terms and connect to the readings. But we do it quickly. We say: "What we've been exploring is known as the rule-following paradox, discussed by Wittgenstein and famously by Kripke. The positions we've seen correspond to different responses: the sceptical solution (Kripke) which says that there is no fact but we can still talk about correctness in terms of community agreement, and then the problems with community agreement we saw; or other responses that try to find facts in dispositions or in normative primitives."

     But note: the constraint is not to use the words until the final 8 minutes. So we use the last 5 minutes for this.

  Now, the normativity problem: The activity naturally produces an epistemic feeling (not being able to tell). How do we convert that into the normativity claim (that meaning fixes what one ought to do)? 

     We can do this by focusing on the moment when the rule-maker is asked for the next term. They feel that there is a correct answer. Even if they cannot point to anything that fixes it, they feel compelled. And when they see an alternative, they might say "that's not what I meant". So the normativity is in the compulsion and the sense of correctness. But then we ask: where does that compulsion come from? It doesn't come from any fact. So perhaps it comes from a decision? But then why do we feel it as a discovery? 

     We can ask: "When you were the rule-maker, if your partner had written a different next term, would you have said they were wrong? Why? What if they had a rule that fit all the past terms? Would you still say they were wrong? And if so, why? Is it because you had a private fact? Or because you are committed to going on in a certain way?"

     This sense of "wrong" is the normativity. And if there is no fact, then the normativity must come from something else.

  Predictable problems and fixes:

  1. Problem: Students might not take the alternative rules seriously (like the circle regions rule). 
     Fix: Present it as a genuine mathematical sequence that someone might have meant. Show the diagram for n=5: 31 regions? Actually, for n=5, the circle regions sequence is 1,2,4,8,16,31. We can draw the circle with 5 points and show the regions? But we might not have time. Instead, we can refer them to the OEIS (Online Encyclopedia of Integer Sequences) and note that it's a well-known sequence.

  2. Problem: The paired exercise might be too abstract or mathematical for some students.
     Fix: Provide very simple rules for A. And have them work with small n. Also, we can do one round as a group with the TA to demonstrate.

  3. Problem: Students might say that the rule is determined by the simplicity or naturalness. 
     Fix: In the circle regions example, is doubling simpler than the circle regions rule? It depends. But in the far-divergence rule, it is just as simple until 1000. And in the paired exercise, B's rules become complex, but they are still rules. We can ask: what makes one rule more natural? And is that naturalness in the world or in our minds? And if in our minds, then isn't that just our disposition to choose one rule? But then if we have a disposition, why do we feel that the rule compels us? And what if our disposition changes?

  4. Problem: The non-numerical example might not be compelling.
     Fix: Choose an example that is very intuitive. Maybe a word: "I am going to show you a pattern of letters: A, B, C, D, ... What comes next? E? But it could be that the rule is: the first four are the first four letters, then it's the alphabet backwards starting from Z? So E? Or Z? But that's arbitrary. Alternatively, use a pattern of actions: 
          Monday: I went to the library.
          Tuesday: I went to the library.
          Wednesday: I went to the library.
          Thursday: I went to the library.
          Friday: ?
          Most say: went to the library. But maybe the rule is: when the day has an 'r' in it, go to the library. Then Friday has no 'r', so I don't go. But that's a known puzzle. We can use that? But then we have to explain the rule. Alternatively, we can have a rule that says: go every day until Friday, then go to the movies. So Friday: go to the movies.

     But we want to show that without a rule that specifies, we don't know.

  5. Problem: The community move: students might say that the rule is what the community agrees on.
     Fix: We ask: which community? And what if the community changes? And what if there is a disagreement? How do we count agreement? For example, in the sequence, if 14 students say 32 and 2 say 31, does that mean the rule is doubling? But what if we then show the circle regions rule? And what if the two students meant that rule? Then the community disagrees. How do we resolve it? By appealing to the rule? But that's circular.

  6. Problem: The normativity point might get lost.
     Fix: We structure the discussion so that we focus on the experience of the rule-maker: they feel that there is a correct answer. We then ask: what is the source of that correctness? If it's not in the mind, and not in the community, then what? And we note that the feeling of compulsion is real, but it might not be based on a fact.

  7. Problem: The paired exercise might take too long.
     Fix: We limit it to 5 terms per pair and set a timer.

  8. Problem: Students might think that the rule is determined by the rule-maker's intentions.
     Fix: We ask: what are the intentions? How do the intentions fix the application to new cases? And how do we know what the intentions are? The rule-maker might have had an intention, but the intention is just another mental state that can be interpreted in multiple ways.

  What the activity cannot reproduce: The normativity of meaning is hard to stage because in the activity, when the student is the rule-maker, they feel the normativity (they feel there is a right answer) but we don't have a way to make them feel that without them already having that intuition. So we rely on their introspection. We try to draw it out by asking: "When you were A, if B had written a different next term, would you have said B was wrong? Why?" And then we point out that they feel that B is wrong even if B has a rule that fits the past. That feeling of wrongness is the normativity. And then we ask: what grounds that wrongness? 

  The facilitator must say: "Notice that the feeling of correctness and incorrectness is very strong. But we've seen that it cannot be grounded in any fact about the rule or about your mind. So what is it? One answer is that it is grounded in a decision we make to go on in a certain way and to hold each other accountable. But that decision is not arbitrary because we are social creatures who need to coordinate. And that leads us to the idea that meaning is a social practice."

  But note: we cannot say that until the end.

  Now, the debrief mapping:

     - The sequence activity (with 31 and far-divergence): shows that alternative rules are not gerrymandered and that even with more data we might be wrong.
     - The paired exercise: shows that for any finite set of data, there are multiple rules that fit. So the rule-maker's past usage does not fix a unique rule.
     - The non-numerical example: shows that the problem is not about numbers.
     - The discussion about internal states: when we ask about what was in the rule-maker's mind, we see that any mental item (formula, image) can be interpreted in multiple ways.
     - The community move: we ask what if we appeal to the community, and then we see that we have to agree on which community and what counts as agreement, which is the same problem again.

  Escape routes and when they arise:

     - Simplicity/naturalness: arises when we present the alternative rules (circle regions and far-divergence). Why not just say doubling is simpler? 
          Cost: We have to define simplicity. And the circle regions rule is natural in its own context. The far-divergence rule is just as simple for all practical purposes. Also, simplicity is subjective? 
          What's wrong: It doesn't solve the problem because simplicity doesn't fix a unique rule (there could be two simple rules that diverge). And if we say the simplest rule is the one we meant, then we are changing the subject from what we did mean to what rule we should have meant.

     - Introspection: arises when we ask what was in the rule-maker's mind. 
          Cost: We cannot introspect a rule that covers all cases. We can only introspect a general idea, which is open to interpretation.
          What's wrong: The rule we introspect (like a formula) is itself a symbol that can be interpreted in multiple ways.

     - Intentions: arises in the discussion about the rule-maker. 
          Cost: The intention is just another mental state that is open to interpretation. How does the intention connect to the infinite number of applications?
          What's wrong: We cannot point to an intention that is not itself in need of interpretation.

     - More data: arises when we present the far-divergence rule. 
          Cost: We cannot get the data for very large n. And even if we could, the rule might diverge at n+1.
          What's wrong: The rule-following problem is not about evidence but about what the rule requires even in cases we haven't considered.

     - Community agreement: arises in the group discussion. 
          Cost: We have to specify what counts as the community and what counts as agreement. And then we have to follow the community rule, which leads to an infinite regress (what rule does the community follow?).
          What's wrong: It moves the problem to the community level but doesn't solve the rule-following problem for the community.

  Final timetable:

