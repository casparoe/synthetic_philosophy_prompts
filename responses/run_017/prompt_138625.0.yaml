answer: |-
  ### Rule-Following Activity: "The Next Term"  
  **Core Device:**  
  Your sequence device is enhanced with additional layers to ensure students confront the first-personal pressure of correctness and the inadequacy of internal/community appeals. I’ll keep your circle-regions (31) and far-divergence rules but add a non-numerical case and structured partner work.  

  **Why This Design?**  
  - **Replaces dismissal tactics**: The circle-regions rule (non-gerrymandered, mathematically valid) and far-divergence rule (empirically unfalsifiable) force engagement with *why* a rule feels correct.  
  - **Adds embodied doubt**: Partner work makes students *lose* control of their own rules, exposing the gap between intention and determinacy.  
  - **Scaffolded revelation**: Each stage isolates one escape route (simplicity, introspection, etc.) and dismantles it through experience, not lecture.  
  - **Non-numerical parallel**: Uses a predicate ("grue-like" without the term) to generalize beyond math.  

  ---

  ### Materials & Rules  
  1. **Index Cards** (3 types):  
     - **Initial Prompt**: "Next term after 1, 2, 4, 8, 16? State your rule briefly."  
     - **Prepared Responses** (from "prior seminar"):  
       - **Card A (32)**: "Double the previous term: 1, 2, 4, 8, 16, **32**."  
       - **Card B (31)**: "Max regions by joining *n* points on a circle: 1, 2, 4, 8, 16, **31**, 57..."  
       - **Card C (Far Divergence)**: "Double until *n*=1000, then add 1. For *n*=6? **32** (since 6<1000)."  
     - **Blank Cards**: For partner exercise.  

  2. **Non-Numerical Case**:  
     - **Shapes Sequence**: ⬛️ (black square), ⬜️ (white square), 🔴 (red circle), 🔵 (blue circle), ❤️ (red heart).  
     - **Prepared Continuations**:  
       - "Color alternates, shape cycles: Next = ⬛️ (black square)."  
       - "Heart after blue: Next = 💙 (blue heart)."  

  3. **Partner Exercise Rules**:  
     - **Student A**: Privately writes a simple rule (e.g., "Add 3 starting from 1: 1, 4, 7, 10...").  
     - **Student B**: Predicts next terms. After each guess, **A reveals the next term**. **B must write a rule** fitting *all* revealed terms.  
     - **Critical Twist**: B can *always* invent a rule matching the data (e.g., after 1,4,7, B says "Add 3"; after A reveals 10, B says "Add 3"; if A reveals 100, B says "Add 3 until *n*=4, then jump to 100").  

  ---

  ### Timetable (80 Minutes)  
  **0–10 min: Setup & Individual Response**  
  - Introduce: "You’ll see a pattern. Write the next term and your rule on a card. No talking."  
  - Project: **1, 2, 4, 8, 16** (numeric) and **⬛️, ⬜️, 🔴, 🔵, ❤️** (non-numeric). Collect cards.  

  **10–20 min: Reveal Responses & Seed Doubt**  
  - Shuffle and read 3–4 "32" cards. Then reveal **Card B (31)** and **Card C (Far Divergence)**.  
  - Ask: *"Which rule feels correct? Why can’t we dismiss 31 or the far-divergence rule?"*  
    - **Goal**: Surface simplicity/naturalness escape route. Students call 31 "complex," but you note: *"It’s a fundamental geometry problem—no disjunctions. Why isn’t it just as valid?"*  

  **20–35 min: Partner Exercise**  
  - Pair students. **A** writes a private rule (e.g., "Multiply by 2," "Add 5"). **B** predicts next terms.  
  - After each guess, **A** reveals the next term. **B** writes a new rule fitting *all* data so far.  
  - Repeat for 3–4 terms. **Stop when B successfully "hijacks" the rule** (e.g., B’s rule diverges from A’s intent).  
  - **Debrief prompt**: *"Rule-makers: Did your partner’s rule match what you meant? How did you know?"*  

  **35–45 min: Non-Numerical Parallel**  
  - Project shapes sequence. Ask for next term. Reveal both continuations (⬛️ and 💙).  
  - Ask: *"Could both be right? What inside you decides if ❤️ should be followed by ⬛️ or 💙?"*  
    - **Goal**: Transfer doubt to non-math context.  

  **45–65 min: Guided Discussion (Draw Out Key Insights)**  
  | Discussion Question                          | Target Insight                                  | Predictable Escape Route & Counter  
  |----------------------------------------------|------------------------------------------------|-------------------------------------  
  | *"When you were the rule-maker, how did you know the ‘correct’ next term?"* | **First-person pressure of correctness** (not evidence) | **Introspection**: Students say, "I felt it." → *"Did that feeling tell you what to do for n=1000? Could the feeling be misinterpreted?"*  
  | *"What if you pointed to a formula in your mind? Does that settle it?"* | **Internal states fail** (rule needs interpretation) | **Intentions**: "I intended doubling." → *"How does that intention fix ‘double’ rather than ‘double until 1000’? The intention is just more words to interpret."*  
  | *"Should we vote or ask the class?"*         | **Community moves the problem**                | **Community agreement**: "Majority rules." → *"Agreement with whom? What if half the class wrote 31? What counts as ‘agreement’—same number or same rule?"*  
  | *"Is there a fact about what rule you meant?"* | **Decision, not ignorance**                    | **More data**: "If we see more terms, we’d know." → *"In the partner game, even infinite terms fit multiple rules. What if two rules never diverge in practice?"*  

  **65–75 min: Final Poll & Positions**  
  - Poll: *"After today, which best describes rule-following?"*  
    1. **Determinate fact, but we can’t always know it** (epistemic).  
    2. **Indeterminate—no single fact, but something weaker** (e.g., family of rules).  
    3. **No fact at all—asking ‘which rule?’ is misguided**; it’s about whether to *go on* with someone.  
  - **Tally votes publicly**.  

  **75–80 min: Debrief & Technical Terms**  
  - Reveal: "Today’s activity mirrors Wittgenstein/Kripke’s rule-following paradox. Terms like ‘quus’ or ‘sceptical solution’ name what you felt."  
  - **Normativity bridge**: *"When you said your partner was ‘wrong,’ were you describing a fact or holding them to a standard? If no fact fixes the rule, what grounds that ‘ought’?"* → Connect to "decision to go on together."  

  ---

  ### Debrief Map: Insights vs. Escape Routes  
  | Activity Moment          | Key Insight Revealed                          | Escape Route Arising          | Why It Fails                          |
  |--------------------------|-----------------------------------------------|-------------------------------|---------------------------------------|
  | **Card B (31) revealed** | Rules aren’t gerrymandered; correctness feels obvious | Simplicity/naturalness        | Circle-regions is natural in geometry; "simplicity" is context-dependent. |
  | **Partner exercise**     | No internal state (formula/image) fixes interpretation | Introspection/Intentions      | Your "add 3" intention still allows B’s "add 3 until *n*=4, then jump" rule. |
  | **Non-numerical shapes** | Problem isn’t about math or other minds       | More data                     | Even infinite consistent data fits non-standard rules (far-divergence). |
  | **Community discussion** | Agreement presumes shared rules               | Community standards           | "Agreement" requires a prior rule to define "same," creating regress. |
  | **Final poll**           | Positions 1/2 require facts that don’t exist | N/A (synthesis)               | Activity supports Position 3: Rule-following is a practice, not fact-tracking. |

  ---

  ### Predictable Problems & Fixes  
  1. **Problem**: Students dismiss 31 as "irrelevant" or "artificial."  
     - **Fix**: Pre-empt by noting, *"This sequence solves a real problem: how many slices create max regions in a pizza? It’s as ‘natural’ as doubling."* Show a diagram for *n*=5 (31 regions).  

  2. **Problem**: Partner exercise stalls if B can’t invent rules.  
     - **Fix**: Give B a cheat sheet: "Use piecewise rules (e.g., ‘same as A until *n*=k, then...’) or polynomials." Demo with TA first.  

  3. **Problem**: Students conflate indeterminacy with "anything goes."  
     - **Fix**: Stress, *"The issue isn’t that rules don’t exist—it’s that nothing* fixes *which one you meant. You still feel compelled."*  

  4. **Problem**: Community appeal feels satisfying early on.  
     - **Fix**: Force ambiguity: *"What if half the class wrote 31? Is it a ‘different rule’ or ‘same rule, wrong answer’? How do you decide?"*  

  5. **Problem**: Normativity ("ought") collapses into personal feeling.  
     - **Fix**: Ask rule-makers: *"When B hijacked your rule, why did you say they were ‘wrong’? Was it a fact—or a refusal to go on with them?"*  

  ---

  ### What the Activity Can’t Reproduce & How to Bridge It  
  - **The Normativity Gap**: Students experience epistemic doubt ("I can’t tell") but not the normative force ("But I *ought* to write 32!").  
    - **Bridge**: During partner debrief, isolate the moment when A says B is "wrong." Ask:  
      *"Was ‘wrong’ a description of B’s answer or an act of holding B accountable? If no fact makes B wrong, why do we feel we* must *say it? This ‘must’ isn’t ignorance—it’s the weight of committing to a way of going on."*  
    - **Then connect**: "This is why Kripke says meaning is normative: it binds you to what you *should* do. The activity doesn’t create that normativity—you brought it. We’re exploring why it exists without facts."  

  This design forces students to confront the paradox from within, using their own reactions to expose the limits of facts, minds, and communities. The partner exercise is key: losing control of their rule creates the visceral doubt you want.
