    - For the non-numerical example: a slide or board drawing of the pattern (if using shapes) or a written description.

  Rules for paired exercise: We prepare cards for A with rules. Each card has a rule like:
     - Rule 1: f(n) = n
     - Rule 2: f(n) = 2n
     - Rule 3: f(n) = n^2
     - Rule 4: f(n) = 10*n
     - Rule 5: f(n) = n + 1
