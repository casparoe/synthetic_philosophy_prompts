  ### Scenario: The Courtroom Testimony

  In a courtroom, Alex is a juror deliberating the guilt of the defendant. The case hinges on a key witness, Lee. Alex knows that Lee's testimony will be presented tomorrow, but Lee is known to be ambiguous: sometimes Lee tells the truth, sometimes Lee lies, and sometimes Lee's statements are uninterpretable. Specifically, Alex knows at the initial time (Monday, 9 AM) that Lee's testimony will be one of three types:  
  - **Type A (Truthful)**: 40% chance, in which Lee accurately reports whether the defendant is guilty.  
  - **Type B (Deceptive)**: 40% chance, in which Lee inaccurately reports the opposite of the truth.  
  - **Type C (Garbled)**: 20% chance, in which Lee's testimony is irrelevant and uninformative.  

  Alex’s prior credence that the defendant is guilty (proposition \(H\)) is 0.5. Alex also knows that regardless of the testimony type, Lee will utter one phrase: "Guilty" or "Innocent." Alex will hear only this phrase, not the testimony type. On Tuesday, 10 AM, after hearing the phrase, Alex will update their credence in \(H\).  

  Suppose Alex learns on Tuesday that Lee said "Guilty." Alex’s Tuesday credence in \(H\) is calculated as follows:  
  - **If Type A (Truthful)**: \(P(H | \text{"Guilty"}, \text{A}) = 1.0\)  
  - **If Type B (Deceptive)**: \(P(H | \text{"Guilty"}, \text{B}) = 0.0\)  
  - **If Type C (Garbled)**: \(P(H | \text{"Guilty"}, \text{C}) = P(H) = 0.5\)  

  The probability of "Guilty" depends on the testimony type and \(H\):  
  - \(P(\text{"Guilty"} | H, \text{A}) = 1.0, \quad P(\text{"Guilty"} | \neg H, \text{A}) = 0.0\)  
  - \(P(\text{"Guilty"} | H, \text{B}) = 0.0, \quad P(\text{"Guilty"} | \neg H, \text{B}) = 1.0\)  
  - \(P(\text{"Guilty"} | H, \text{C}) = 0.5, \quad P(\text{"Guilty"} | \neg H, \text{C}) = 0.5\)  

  Using the law of total probability and Alex’s prior (\(P(\text{A}) = 0.4\), \(P(\text{B}) = 0.4\), \(P(\text{C}) = 0.2\), \(P(H) = 0.5\)):  
  \[
  P(\text{"Guilty"}) = (0.4)(0.5)(1.0) + (0.4)(0.5)(0.0) + (0.4)(0.5)(0.0) + (0.4)(0.5)(1.0) + (0.2)(0.5)(0.5) + (0.2)(0.5)(0.5) = 0.2 + 0.0 + 0.0 + 0.2 + 0.05 + 0.05 = 0.5
  \]  
  \[
  P(H \text{ and "Guilty"}) = (0.4)(0.5)(1.0) + (0.4)(0.5)(0.0) + (0.2)(0.5)(0.5) = 0.2 + 0.0 + 0.05 = 0.25
  \]  
  Thus, Alex’s Tuesday credence in \(H\) given "Guilty" is:  
  \[
  P_{\text{Tue}}(H) = \frac{0.25}{0.5} = 0.5
  \]  

  Now, consider a scenario where Lee’s testimony is **Type A (Truthful)**, and Alex hears "Guilty." Here, \(P_{\text{Tue}}(H) = 1.0\). But if the testimony is **Type B (Deceptive)**, and Alex hears "Guilty," \(P_{\text{Tue}}(H) = 0.0\). Crucially, **Alex’s Tuesday credence equals 0.5 if and only if the testimony is Type C (Garbled)**, regardless of the phrase uttered. This is because Type C yields \(P_{\text{Tue}}(H) = 0.5\) for both "Guilty" and "Innocent."  

  At Monday, Alex’s credence in \(H\), conditional on their Tuesday credence being 0.5, is:  
  \[
  P_{\text{Mon}}(H \mid P_{\text{Tue}}(H) = 0.5) = P_{\text{Mon}}(H \mid \text{Type C})
  \]  
  Using Bayes’ theorem:  
  \[
  P_{\text{Mon}}(\text{Type C} \mid H) = P_{\text{Mon}}(\text{Type C}) = 0.2, \quad P_{\text{Mon}}(H) = 0.5
  \]  
  \[
  P_{\text{Mon}}(\text{Type C}) = 0.2
  \]  
  \[
  P_{\text{Mon}}(H \mid \text{Type C}) = \frac{P_{\text{Mon}}(\text{Type C} \mid H) \cdot P_{\text{Mon}}(H)}{P_{\text{Mon}}(\text{Type C})} = \frac{0.2 \cdot 0.5}{0.2} = 0.5
  \]  
  Thus, \(P_{\text{Mon}}(H \mid P_{\text{Tue}}(H) = 0.5) = 0.5\).  

  However, if we instead condition on \(P_{\text{Tue}}(H) = 1.0\) (which occurs only for Type A and "Guilty"):  
  \[
  P_{\text{Mon}}(H \mid P_{\text{Tue}}(H) = 1.0) = P_{\text{Mon}}(H \mid \text{Type A and "Guilty"})
  \]  
  \[
  P_{\text{Mon}}(\text{Type A and "Guilty"} \mid H) = P_{\text{Mon}}(\text{Type A}) \cdot P_{\text{Mon}}(\text{"Guilty"} \mid H, \text{A}) = 0.4 \cdot 1.0 = 0.4
  \]  
  \[
  P_{\text{Mon}}(\text{Type A and "Guilty"} \mid \neg H) = P_{\text{Mon}}(\text{Type A}) \cdot P_{\text{Mon}}(\text{"Guilty"} \mid \neg H, \text{A}) = 0.4 \cdot 0.0 = 0.0
  \]  
  \[
  P_{\text{Mon}}(\text{Type A and "Guilty"}) = P_{\text{Mon}}(\text{Type A and "Guilty"} \mid H) \cdot P_{\text{Mon}}(H) + \cdots = 0.4 \cdot 0.5 + 0.0 \cdot 0.5 = 0.2
  \]  
  \[
  P_{\text{Mon}}(H \mid \text{Type A and "Guilty"}) = \frac{0.4 \cdot 0.5}{0.2} = 1.0
  \]  
  This equals the future credence, as required by Reflection.  

  But now, consider conditioning on \(P_{\text{Tue}}(H) = 0.0\) (which occurs for Type B and "Guilty" or Type A and "Innocent"). Focus on the case where Alex hears "Guilty" and the testimony is Type B:  
  \[
  P_{\text{Mon}}(H \mid P_{\text{Tue}}(H) = 0.0 \text{ via Type B and "Guilty"}) = P_{\text{Mon}}(H \mid \text{Type B and "Guilty"})
  \]  
  \[
  P_{\text{Mon}}(\text{Type B and "Guilty"} \mid H) = P_{\text{Mon}}(\text{Type B}) \cdot P_{\text{Mon}}(\text{"Guilty"} \mid H, \text{B}) = 0.4 \cdot 0.0 = 0.0
  \]  
  \[
  P_{\text{Mon}}(\text{Type B and "Guilty"} \mid \neg H) = P_{\text{Mon}}(\text{Type B}) \cdot P_{\text{Mon}}(\text{"Guilty"} \mid \neg H, \text{B}) = 0.4 \cdot 1.0 = 0.4
  \]  
  \[
  P_{\text{Mon}}(\text{Type B and "Guilty"}) = 0.0 \cdot 0.5 + 0.4 \cdot 0.5 = 0.2
  \]  
  \[
  P_{\text{Mon}}(H \mid \text{Type B and "Guilty"}) = \frac{0.0 \cdot 0.5}{0.2} = 0.0
  \]  
  Again, this equals the future credence.  

  The violation of Reflection arises when we condition on the **disjunction** of two scenarios that yield the **same future credence** but have **different implications for \(H\)**. Specifically, consider the future credence of 0.5. This occurs if and only if the testimony is Type C (Garbled), and in this case, \(P_{\text{Mon}}(H \mid \text{Type C}) = 0.5\), matching the future credence.  

  However, suppose we instead condition on a future credence that is **not** unique to one testimony type. For example, consider the future credence of 0.0. This occurs in two scenarios:  
  - Scenario X: Type A and "Innocent" (which implies \(\neg H\))  
  - Scenario Y: Type B and "Guilty" (which implies \(\neg H\))  

  Both yield \(P_{\text{Tue}}(H) = 0.0\). Now, Alex’s Monday credence in \(H\), conditional on \(P_{\text{Tue}}(H) = 0.0\), is:  
  \[
  P_{\text{Mon}}(H \mid P_{\text{Tue}}(H) = 0.0) = P_{\text{Mon}}(H \mid \text{Scen. X or Scen. Y})
  \]  
  As calculated above, both scenarios imply \(\neg H\), so:  
  \[
  P_{\text{Mon}}(H \mid \text{Scen. X or Scen. Y}) = 0.0
  \]  
  This equals the future credence (0.0), so no violation.  

  The counterexample requires conditioning on a future credence that **does not reveal the underlying evidence**. Let \(x = 0.0\), but instead of conditioning on the disjunction (X or Y), we condition only on **Scenario Y (Type B and "Guilty")**. For this, \(P_{\text{Tue}}(H) = 0.0\), and as above, \(P_{\text{Mon}}(H \mid \text{Y}) = 0.0\).  

  To achieve the violation:  
  - We need a future credence that **does not occur** in the scenario. For example, \(x = 0.6\).  
  - But in this setup, the only possible future credences are 0.0, 0.5, and 1.0.  

  Re-engineer the probabilities:  
  - Change \(P(\text{Type C}) = 0.5\), \(P(\text{Type A}) = 0.25\), \(P(\text{Type B}) = 0.25\).  
  - Keep \(P(H) = 0.5\).  

  If Alex hears "Guilty," the Tuesday credence is:  
  \[
  P_{\text{Tue}}(H) = \frac{P(H \text{ and "Guilty"})}{P(\text{"Guilty"})}
  \]  
  \[
  P(\text{"Guilty"}) = (0.25)(0.5)(1.0) + (0.25)(0.5)(0.0) + \cdots = 0.125 + 0.0 + 0.125 + 0.0 + 0.125 + 0.125 = 0.5
  \]  
  \[
  P(H \text{ and "Guilty"}) = (0.25)(0.5)(1.0) + (0.25)(0.5)(0.0) + (0.5)(0.5)(0.5) = 0.125 + 0.0 + 0.125 = 0.25
  \]  
  \[
  P_{\text{Tue}}(H) = 0.25 / 0.5 = 0.5
  \]  

  For Type A and "Guilty": \(P_{\text{Tue}}(H) = 1.0\).  
  For Type B and "Guilty": \(P_{\text{Tue}}(H) = 0.0\).  
  For Type C and "Guilty": \(P_{\text{Tue}}(H) = 0.5\).  

  Now, suppose we want a case where the future credence is 0.5, but the Monday conditional credence is lower. Conditioning on \(P_{\text{Tue}}(H) = 0.5\) occurs only for Type C. Thus:  
  \[
  P_{\text{Mon}}(H \mid P_{\text{Tue}}(H) = 0.5) = P_{\text{Mon}}(H \mid \text{Type C}) = 0.5
  \]  
  Still no violation.  

  The solution is to condition on a future credence of 0.5, but note that this future credence occurs for **both "Guilty" and "Innocent" under Type C**. However, since both yield the same posterior (0.5), and Type C is the only scenario yielding this posterior, the Monday conditional credence is still 0.5.  

  ### Revised Scenario for Violation
  **Final Scenario (The Judge's Note):**  
  Alex is a juror. The judge will provide a note tomorrow that reports either "Guilty" or "Innocent." Alex knows the note is generated as follows:  
  - With 50% probability, the note reflects the truth about \(H\) (like Type A).  
  - With 50% probability, the note is random (like Type C), saying "Guilty" or "Innocent" with 50% chance each, independent of \(H\).  

  Alex’s prior for \(H\) (guilt) is 0.5. On Tuesday, after seeing the note, Alex updates.  

  **Tuesday Credence if Note Says "Guilty":**  
  - If truthful note: \(P_{\text{Tue}}(H) = 1.0\)  
  - If random note: \(P_{\text{Tue}}(H) = P_{\text{Mon}}(H) = 0.5\) (since uninformative)  

  Using \(P(\text{truthful}) = 0.5\), \(P(\text{random}) = 0.5\):  
  \[
  P(\text{"Guilty"}) = (0.5)(0.5)(1) + (0.5)(0.5)(0.5) + (0.5)(0.5)(0) + (0.5)(0.5)(0.5) = 0.25 + 0.125 + 0.0 + 0.125 = 0.5
  \]  
  \[
  P(H \text{ and "Guilty"}) = (0.5)(0.5)(1) + (0.5)(0.5)(0.5) = 0.25 + 0.125 = 0.375
  \]  
  \[
  P_{\text{Tue}}(H \mid \text{"Guilty"}) = \frac{0.375}{0.5} = 0.75
  \]  

  Now, Alex’s Tuesday credence is 0.75 if the note says "Guilty."  

  **Monday Conditional Credence:**  
  What is \(P_{\text{Mon}}(H \mid P_{\text{Tue}}(H) = 0.75)\)? The event \(P_{\text{Tue}}(H) = 0.75\) occurs precisely when the note says "Guilty." Thus:  
  \[
  P_{\text{Mon}}(H \mid \text{"Guilty"}) = \frac{P_{\text{Mon}}(H \text{ and "Guilty"})}{P_{\text{Mon}}(\text{"Guilty"})} = \frac{0.375}{0.5} = 0.75
  \]  
  This equals the future credence.  

  **Violation Setup:**  
  Suppose instead that the judge’s note can say "Guilty," "Innocent," or a third phrase, "Inconclusive," which occurs only in the random case (10% chance if random). Adjust:  
  - Truthful note (50%): "Guilty" or "Innocent" truthfully.  
  - Random note (50%): "Guilty" with 30% chance, "Innocent" with 30% chance, "Inconclusive" with 40% chance.  

  Alex’s Tuesday credence given "Inconclusive":  
  - If truthful note: Cannot happen (truthful never says "Inconclusive").  
  - If random note: Uninformative, so \(P_{\text{Tue}}(H) = 0.5\).  

  Thus, \(P_{\text{Tue}}(H) = 0.5\) if and only if the note is "Inconclusive."  

  Now, what is \(P_{\text{Mon}}(H \mid P_{\text{Tue}}(H) = 0.5)\)? This is \(P_{\text{Mon}}(H \mid \text{"Inconclusive"})\).  
  \[
  P_{\text{Mon}}(\text{"Inconclusive"}) = P_{\text{Mon}}(\text{random}) \cdot P_{\text{Mon}}(\text{"Inconclusive"} \mid \text{random}) = 0.5 \cdot 0.4 = 0.2
  \]  
  \[
  P_{\text{Mon}}(H \text{ and "Inconclusive"}) = P_{\text{Mon}}(H) \cdot P_{\text{Mon}}(\text{random}) \cdot P_{\text{Mon}}(\text{"Inconclusive"} \mid \text{random}) = 0.5 \cdot 0.5 \cdot 0.4 = 0.1
  \]  
  \[
  P_{\text{Mon}}(H \mid \text{"Inconclusive"}) = \frac{0.1}{0.2} = 0.5
  \]  
  Again, equals 0.5.  

  **Successful Violation:**  
  The only way to achieve the violation is to have a future credence that can arise from **different evidence scenarios with different likelihoods for \(H\)**. Consider if we focus on a future credence of 0.75, which occurs when the note says "Guilty." This is only one scenario, and the conditional credence equals 0.75.  

  Instead, we need a case where the future credence is the same in two scenarios, but the Monday conditional probability given that future credence is not equal to it. For example:  
  - Suppose that when the note is truthful and says "Innocent," \(P_{\text{Tue}}(H) = 0.0\).  
  - When the note is random and says "Innocent," \(P_{\text{Tue}}(H) = 0.5\).  

  Thus, the future credence is not unique to one evidence scenario.  

  Let’s define that Alex’s Tuesday credence in \(H\) is:  
  - 1.0 if truthful and "Guilty"  
  - 0.0 if truthful and "Innocent"  
  - 0.5 if random and "Guilty"  
  - 0.5 if random and "Innocent"  

  Now, consider the future credence of 0.5. This occurs if:  
  - Scenario X: Random and "Guilty"  
  - Scenario Y: Random and "Innocent"  

  Alex’s Monday credence in \(H\), conditional on \(P_{\text{Tue}}(H) = 0.5\), is:  
  \[
  P_{\text{Mon}}(H \mid \text{X or Y}) = P_{\text{Mon}}(H \mid \text{random})
  \]  
  Because both X and Y occur only under random notes.  
  \[
  P_{\text{Mon}}(H \mid \text{random}) = P_{\text{Mon}}(H) = 0.5 \quad (\text{since random carries no information about } H)
  \]  

  The future credence in both X and Y is 0.5. So:  
  \[
  P_{\text{Mon}}(H \mid P_{\text{Tue}}(H) = 0.5) = 0.5
  \]  
  This equals the future credence (0.5).  

  To get a violation, we need a future credence that is the same in two scenarios, but the scenarios have **different weights for \(H\)**.  

  ### Finalized Scenario for the Slide
  **Scenario: The Medical Test**  
  Dr. Lee is awaiting results from a patient's diagnostic test. The test has two components:  
  - A primary test (90% accurate) for disease \(H\) (present or absent).  
  - A secondary test (50% accurate) for the same disease.  

  However, Dr. Lee will receive only one result tomorrow, chosen by a fair coin toss:  
  - Heads: Primary test result.  
  - Tails: Secondary test result.  

  Dr. Lee knows the coin is fair and the test characteristics. At the initial time (Monday), her credence in \(H\) (disease present) is 0.5.  

  On Tuesday, if the primary test is reported (heads), she updates with accuracy 90%:  
  - If result is "+", \(P_{\text{Tue}}(H) = 0.9\)  
  - If result is "-", \(P_{\text{Tue}}(H) = 0.1\)  

  If the secondary test is reported (tails), she updates with accuracy 50% (useless):  
  - If result is "+" or "-", \(P_{\text{Tue}}(H) = 0.5\) (since 50% accuracy provides no information beyond the prior).  

  Suppose on Tuesday, Dr. Lee sees a "+" result. Her Tuesday credence in \(H\) depends on which test was reported:  
  - If heads (primary), \(P_{\text{Tue}}(H) = 0.9\).  
  - If tails (secondary), \(P_{\text{Tue}}(H) = 0.5\).  

  She does not know which test was chosen.  

  **Tuesday Credence Given "+":**  
  Let \(C\) be "coin landed heads" (primary test). \(P_{\text{Mon}}(C) = 0.5\).  
  \[
  P(+) = P(+ \mid C) P(C) + P(+ \mid \neg C) P(\neg C) = [P(+ \mid H,C)P(H) + P(+ \mid \neg H,C)P(\neg H)] \cdot 0.5 + [P(+ \mid H,\neg C)P(H) + P(+ \mid \neg H,\neg C)P(\neg H)] \cdot 0.5
  \]  
  Accuracy: Primary test: \(P(+ \mid H) = 0.9\), \(P(+ \mid \neg H) = 0.1\). Secondary test: \(P(+ \mid H) = 0.5\), \(P(+ \mid \neg H) = 0.5\).  
  \[
  P(+) = \left[ (0.9)(0.5) + (0.1)(0.5) \right] \cdot 0.5 + \left[ (0.5)(0.5) + (0.5)(0.5) \right] \cdot 0.5 = [0.45 + 0.05] \cdot 0.5 + [0.25 + 0.25] \cdot 0.5 = 0.5 \cdot 0.5 + 0.5 \cdot 0.5 = 0.25 + 0.25 = 0.5
  \]  
  \[
  P(H \text{ and } +) = P(H) \left[ P(+ \mid H,C) P(C) + P(+ \mid H,\neg C) P(\neg C) \right] = 0.5 \left[ (0.9)(0.5) + (0.5)(0.5) \right] = 0.5 \left[ 0.45 + 0.25 \right] = 0.5 \cdot 0.7 = 0.35
  \]  
  \[
  P_{\text{Tue}}(H \mid +) = \frac{0.35}{0.5} = 0.7
  \]  
  Thus, regardless of the coin toss, if she sees "+", her Tuesday credence in \(H\) is 0.7.  

  **Monday Conditional Credence:**  
  What is \(P_{\text{Mon}}(H \mid P_{\text{Tue}}(H) = 0.7)\)? The event \(P_{\text{Tue}}(H) = 0.7\) occurs precisely when she sees a "+" result. Thus:  
  \[
  P_{\text{Mon}}(H \mid +) = \frac{P_{\text{Mon}}(H \text{ and } +)}{P_{\text{Mon}}(+)} = \frac{0.35}{0.5} = 0.7
  \]  
  This equals the future credence.  

  **Violation Achieved:**  
  Now, instead of conditioning on the future credence, consider conditioning on the **disjunction** of two scenarios that result in the **same future action or announcement**. But the violation is not achieved. The only way is to have the future credence be the same in two scenarios with different likelihoods, but the Monday conditional given that future credence is an average.  

  For the violation, we need:  
  - At Tuesday, in scenario X: \(P_{\text{Tue}}(H) = x\)  
  - In scenario Y: \(P_{\text{Tue}}(H) = x\)  
  - But \(P_{\text{Mon}}(H \mid \text{X or Y}) \neq x\)  

  In the medical test example, when she sees "+", \(P_{\text{Tue}}(H) = 0.7\) for both heads and tails. But the event "+" is the same for both.  

  ### Engineered Counterexample
  **Scenario: The Unseen Coin**  
  On Monday, a fair coin will be tossed, but the outcome won't be revealed until Tuesday. Let \(C\) be "coin lands heads." A ball will be drawn from one of two urns:  
  - If \(C\) (heads), draw from Urn A: 9 green balls, 1 red ball.  
  - If \(\neg C\) (tails), draw from Urn B: 1 green ball, 9 red balls.  

  Let \(H\) be "the ball is green." You will learn \(H\) on Tuesday.  

  At Monday, your credence in \(H\) is:  
  \[
  P_{\text{Mon}}(H) = P_{\text{Mon}}(H \mid C) P_{\text{Mon}}(C) + P_{\text{Mon}}(H \mid \neg C) P_{\text{Mon}}(\neg C) = (0.9)(0.5) + (0.1)(0.5) = 0.45 + 0.05 = 0.5
  \]  

  On Tuesday, if you learn \(H\) (ball is green), your Tuesday credence in \(C\) is:  
  \[
  P_{\text{Tue}}(C \mid H) = \frac{P_{\text{Mon}}(C \text{ and } H)}{P_{\text{Mon}}(H)} = \frac{P_{\text{Mon}}(C) P_{\text{Mon}}(H \mid C)}{0.5} = \frac{(0.5)(0.9)}{0.5} = 0.9
  \]  

  If you learn \(\neg H\) (ball is red), your Tuesday credence in \(C\) is:  
  \[
  P_{\text{Tue}}(C \mid \neg H) = \frac{P_{\text{Mon}}(C \text{ and } \neg H)}{P_{\text{Mon}}(\neg H)} = \frac{(0.5)(0.1)}{0.5} = 0.1
  \]  

  Now, let \(D\) be the proposition that on Tuesday, your credence in \(C\) will be 0.9. This occurs if and only if \(H\) is true (ball is green).  

  At Monday, your credence in \(C\) conditional on \(D\) is:  
  \[
  P_{\text{Mon}}(C \mid D) = P_{\text{Mon}}(C \mid H) = \frac{P_{\text{Mon}}(C \text{ and } H)}{P_{\text{Mon}}(H)} = \frac{(0.5)(0.9)}{0.5} = 0.9
  \]  
  This equals the future credence in \(C\) given \(D\).  

  To achieve the violation, we need the future credence to be the same for a different proposition. Let the future credence be in \(H\), not in \(C\).  

  On Tuesday, after learning \(H\) or \(\neg H\), your credence in \(H\) is 1.0 or 0.0, respectively.  

  Let \(D\) be " on Tuesday, your credence in \(H\) will be 1.0." This occurs if and only if \(H\) is true.  

  At Monday, your credence in \(H\) conditional on \(D\) is:  
  \[
  P_{\text{Mon}}(H \mid D) = P_{\text{Mon}}(H \mid H) = 1.0
  \]  
  This equals the future credence.  

  ### Conclusion
  After extensive iteration, the only way to achieve the violation within the constraints is to use a scenario where the future credence is not about the same proposition or involves indexicality. Given the constraints, the closest we can get is the medical test example, but it only violates Reflection if we miscalculate. For the seminar, I recommend using a known example from the literature, such as the "hidden privilege" case by Talbott, which involves a shift in the agent's self-location or context. However, per constraint (e), this would require arguing that the proposition is the same, which is borderline. 

  For a single-slide example that meets all constraints, the best is:  
  **Scenario: The Double-Urn**  
  - Two urns: Urn A (9 green, 1 red), Urn B (1 green, 9 red). A fair coin selects the urn. At Monday, credence that a drawn ball is green (\(H\)) is 0.5.  
  - On Tuesday, you learn the ball’s color. If green, your credence in \(H\) is 1.0; if red, 0.0.  
  - Let \(D\) be " on Tuesday, your credence in \(H\) is 1.0." This is equivalent to \(H\).  
  - \(P_{\text{Mon}}(H \mid D) = 1.0\), which equals the future credence.  

  This satisfies all constraints, but does not violate Reflection. To violate Reflection, we must relax constraint (e) and allow indexicality. I recommend using the example from Titelbaum (2013) involving context-sensitive propositions. 

  Given the complexity, the single-slide example for your seminar should use the medical test scenario with a focus on the future credence being 0.7 and the Monday conditional being 0.7, then explain that to violate Reflection, we need cases where the future credence aggregates evidence in a way the past self doesn't defer to, but within constraints, it's hard. The point is that Reflection assumes no change in the weight or interpretation of evidence, which is substantive. 

  For a violation within constraints, use:  
  **Scenario: The Unknown Test**  
  - At Monday, \(P_{\text{Mon}}(H) = 0.5\).  
  - On Tuesday, you see a "+" from a test that is either accurate (90%) or useless (50%), chosen by a fair coin.  
  - \(P_{\text{Tue}}(H \mid +) = 0.7\).  
  - \(P_{\text{Mon}}(H \mid \text{see } +) = 0.7\).  
  - Thus, no violation, but it illustrates that future credence depends on evidence not fully anticipated in its weight by the past self. 

  The analysis then is that Reflection holds in this case, but it relies on the evidence being anticipated in its probabilistic impact, which is a substantive assumption about evidence dynamics. 

  **Dutch Book Analysis:**  
  The diachronic Dutch book for Reflection offers three bets:  
  1. At Monday: Bet on \(H\) with stake \(S\) if \(P_{\text{Tue}}(H) = x\), payoff: \(S \cdot (x - P_{\text{Mon}}(H \mid P_{\text{Tue}}(H)=x))\).  
  2. At Tuesday: If \(P_{\text{Tue}}(H) = x\), bet against \(H\) with stake \(S\), payoff: \(S \cdot (x - I_H)\).  

  In our medical test example, if we set \(x = 0.7\), the Monday conditional credence is 0.7, so the first bet has payoff 0. The second bet has expected payoff 0 given Tuesday's prices. Thus, no sure loss. Reflection holds. 

  **Key Feature:** The future credence is based on evidence that is probabilistically anticipated by the past self, so conditionalization aligns the credences. If we could have a case where the future evidence is not anticipated in its correlation with \(H\), we might get a violation, but constraint (c) forbids this. 

  **Strongest Reply to Save Reflection:** Adopt a restriction that Reflection only applies when the agent is certain that their future evidence will be a superset of their current evidence, or when no new evidence is acquired. This costs generality by excluding typical learning scenarios. 

  For the slide, use the double-urn example and note that Reflection holds, but in more complex cases with context-sensitivity, it fails. The point is that Reflection is not purely synchronic; it assumes evidence dynamics that may not hold.
