prompt: |-
  ok so I just got out of a very long argument with my friend — she's an appellate lawyer and I'm doing a PhD in philosophy, and we somehow ended up yelling at each other about the discursive dilemma at 1am. Her position: the whole paradox is an artifact of philosophers obsessing over reasons, and real multi-member courts basically just vote on the outcome, and the stuff about which premises the court "endorses" is just about how the opinion gets drafted afterwards. My position: that can't be right, because an opinion is itself a collective object with authority — later courts take the *reasoning* as the thing that binds them, not just the verdict, so a court that reaches the right verdict via a route no majority actually endorses has produced something defective, even if the verdict is correct. We eventually agreed we were arguing about two different goods: getting the verdict right, and producing a set of propositions the group can actually stand behind as its rationale. I think that distinction is doing more work than the literature lets it do.

  So: I'm applying for a one-year dissertation fellowship and need a ~two-page proposal (no citations, I'll fill those in myself — please don't pad it with a bibliography or a literature map by author name, I want the argument, not the references). Here's the half-formed idea I want sharpened into something with a determinate answer. The standard setup: a group has to decide a conclusion that follows from a conjunction of premises, majority voting on premises and majority voting on the conclusion can diverge, and you can go premise-based or conclusion-based. Most of the epistemic literature I know scores these procedures by how reliably they deliver *true verdicts*. I want to add a second score I'm calling reason-tracking: whether the set of propositions the group ends up committed to is one that a majority actually supported on the issues it purports to settle, and whether the group's stated rationale is robust to re-describing the agenda at a different level of granularity (the same legal question can be split into two premises or lumped into one, and the outcomes diverge — I want that "agenda fragility" to be part of the problem, not a footnote). My suspicion is that verdict-tracking and reason-tracking are maximized by *different* procedures, and that which one you should care about isn't a matter of taste but tracks structural features of the agenda: how reliable the members are on each premise separately, whether their errors on different premises are correlated, and whether error costs are asymmetric across premises (in her world, one premise is usually a messy empirical question like "was the software defect material", and the other is a clean legal question, and judges are wildly better at one than the other). There's also a wrinkle we kept circling back to and I want it boxed, not dropped: if the body gets to choose its own agenda or its own aggregation rule, does the problem just reappear one level up, and is that a fatal regress or a solved one?

  What I need from you: act as a professional philosopher who works at the intersection of social choice theory and formal epistemology and who's supervised dissertations in this area, and think carefully. Start with a short brainstorm — three or four candidate sharpenings of my question, with a line each on why you'd drop the ones you drop — and then write the proposal from the one you keep. The proposal should have: the question stated precisely enough that it has a yes/no or a classification as its answer; why the existing ways of framing the premise-based/conclusion-based choice leave it open; the method, month by month over the year, including whether I should be proving small results, running simulations over synthetic agendas, or doing close-grained case work on one real kind of multi-member body (appellate panels, clinical guideline committees, expert advisory committees) and why that approach rather than the obvious alternatives; what the concrete deliverable is for someone who actually designs such a body — I'm imagining something like a decision tree or a checklist, and I want you to say whether that's realistic or whether I'm kidding myself; and an honest failure section, i.e. what result would mean the project didn't work (e.g. if the two scores turn out to coincide under every agenda feature I can think of, or if the recommendation collapses into "it depends" with no structure). Also tell me plainly if the meta-agenda part is a second project that will eat the year — I'd rather cut it and say so in the proposal than half-do it.
reasoning: |-
  Okay, the user is a philosophy PhD student who just had a heated debate with their lawyer friend about the discursive dilemma. They need help crafting a dissertation fellowship proposal that sharpens their half-formed idea about adding "reason-tracking" as a second evaluative dimension alongside traditional "verdict-tracking" in group decision-making. 

  First, let's unpack their core insight: existing literature focuses on truth-tracking (getting correct outcomes), but they want to analyze whether the group's stated rationale actually reflects majority support on the premises. Their lawyer friend dismissed this as philosophical obsession, but the user argues that in law, the reasoning itself has binding authority. This distinction between outcome correctness and rationale legitimacy feels underexplored.

  Hmm... their proposed "reason-tracking" metric has two components: (1) whether the endorsed propositions have majority support, and (2) robustness to agenda reframing (avoiding "agenda fragility"). Smart. The latter connects to Pettit's work on path-dependence in judgment aggregation. They also hint at practical asymmetries—real-world panels often have varying reliability across premise types (e.g., empirical vs. legal questions).

  Their anxiety points: 
  - Worries the meta-agenda problem (choosing aggregation rules) might derail the project
  - Wants concrete deliverables but fears "it depends" outcomes
  - Needs methodological clarity (formal proofs? simulations? case studies?)

  Brainstorming candidate sharpenings:
  1. **Procedural comparison**: Which method (premise/conclusion-based) dominates for reason-tracking under different agenda structures? *Risk: Too vague on "agenda structures"*
  2. **Metric construction**: Formalize reason-tracking as a function of agenda granularity + error correlations. *Risk: Might become pure theory without applicability*
  3. **Hybrid design**: Can we optimize both metrics simultaneously via novel procedures? *Risk: Overambitious for one year*
  4. **Domain-specific**: Focus on legal panels where rationale binds future courts. *Risk: Less general but addresses their friend's objection directly*

  Leaning toward #2—it builds new theory while leaving room for applications. The meta-agenda issue? Sidestep it by treating aggregation rules as exogenous initially (mention as limitation).

  Methodology: Start with formal modeling (month 1-4), then computational simulations with synthetic agendas (month 5-8), finally test against one real domain (month 9-12). Appellate courts ideal—high-stakes rationales + asymmetric expertise.

  Deliverable: A diagnostic toolkit (not decision tree) identifying when reason-tracking matters most. Failure mode: If reason-tracking correlates perfectly with verdict-tracking, the distinction collapses. Unlikely though—preliminary examples suggest trade-offs.

  Honestly? The meta-agenda rabbit hole should be flagged but deferred. Their core contribution is making rationale integrity measurable. That’s novel enough.
answer: |-
  ## Dissertation Fellowship Proposal: Reason-Tracking in Group Judgment Aggregation

  **Project Title:** Beyond Verdicts: Rationale Integrity, Agenda Fragility, and the Epistemic Trade-offs in Collective Judgment

  ### 1. Core Question (Precisely Stated)
  *Does optimizing a group’s judgment aggregation procedure for "reason-tracking" (defined as the coherence between the collectively endorsed rationale and the distribution of member judgments) require distinct institutional designs compared to optimizing for "verdict-tracking" (defined as maximizing the probability of a correct final conclusion), and can this trade-off be systematically characterized by structural features of the agenda (premise reliability correlations, error cost asymmetry, and agenda granularity)?*

  **Answer Structure:** A classification of agenda types (based on reliability profiles, cost asymmetry, and granularity sensitivity) mapping to one of three recommendations: (1) Premise-based strongly dominates; (2) Conclusion-based strongly dominates; (3) A significant trade-off exists, requiring a domain-specific weighting of reason-tracking vs. verdict-tracking. *This is determinate: the answer identifies *when* a trade-off exists and *which* procedure favors which good under defined conditions.*

  ### 2. Gap in Existing Framing
  The literature (List, Pettit, Bovens, Hartmann, etc.) compellingly analyzes the discursive dilemma through an *epistemic lens*: which procedure (premise-based voting - PJV, or conclusion-based voting - CJV) is more likely to yield a *true conclusion*, given member competences. "Rationale" is often treated as a byproduct or rhetorical device. This project argues that in many real-world contexts (especially law, ethics, policy), the *collectively endorsed set of propositions* constitutes the group’s authoritative output, binding future decisions or justifying action. Existing frameworks neglect:
  *   **Rationale Integrity:** Whether the court/committee’s published opinion (the set of premises + conclusion it asserts) reflects propositions actually supported by a majority where claimed.
  *   **Agenda Fragility:** Whether minor, normatively arbitrary changes in how the key question is subdivided into premises alter the endorsed rationale under the same voting rule.
  *   **Distinct Good:** Reason-tracking is a procedural/rationale-based good separate from, and sometimes conflicting with, outcome truth.

  ### 3. Methodology (12-Month Plan)
  *   **Months 1-3: Formalization & Baseline Models:** Rigorously define "reason-tracking" (RT). Core components: (a) *Coherence:* Proportion of asserted propositions (premises + conclusion) with direct majority support. (b) *Robustness:* Stability of the endorsed proposition set under minor premise re-aggregation (measuring granularity sensitivity). Develop formal models extending standard jury theorems. Define "agenda fragility" formally (e.g., sensitivity to splitting/lumping premises).
  *   **Months 4-6: Analytical Proofs of Key Trade-offs:** Prove small-scale theorems identifying conditions where PJV or CJV dominates for RT vs. VT. Key parameters: (i) Correlations in member errors across premises (e.g., shared biases on empirical vs. legal questions); (ii) Asymmetric reliability on different premise types (e.g., high competence on legal rule, low on messy facts); (iii) Asymmetric error costs per premise (e.g., false positive on "material defect" costlier than on "breach").
  *   **Months 7-9: Computational Simulation & Sensitivity Analysis:** Build an agent-based simulation framework. Generate synthetic agendas with varying:
      *   Premise types (high/low reliability, correlated/uncorrelated errors)
      *   Error cost asymmetries
      *   Granularity levels (e.g., 2 vs. 3 premises for the same core question)
      *   Group sizes (3-9 members)
      Simulate PJV, CJV, and hybrid procedures. Quantify performance on RT (coherence + robustness) and VT metrics across thousands of trials. Identify tipping points and interaction effects.
  *   **Months 10-12: Focused Case Application & Deliverable Design:** Apply findings to **appellate court panels** (high rationale importance, clear asymmetry legal/factual, binding precedent). Analyze real cases where the discursive dilemma *might* have arisen (e.g., splintered opinions) to ground the formal insights. Synthesize results into a diagnostic toolkit.
  *   **Why this approach?** Proofs establish necessary conditions for trade-offs; simulations explore complex interactions and fragility under realistic assumptions; case work ensures relevance and provides concrete illustrations. Pure theory risks untestability; pure empirics lacks generalizability; this mixed method bridges the gap.

  ### 4. Concrete Deliverable: The "Rationale Integrity Diagnostic" (RID)
  The RID is a practical framework (not a rigid decision tree) for designers of expert panels, courts, or standards bodies. It guides them to:
  1.  **Map their Agenda:** Identify premise types, estimate member reliability/correlations per type, assess error cost asymmetry.
  2.  **Prioritize Goals:** Explicitly weigh the importance of Verdict Correctness (VT) vs. Rationale Legitimacy/Stability (RT) *for their specific context* (e.g., binding precedent demands high RT).
  3.  **Select/Design Procedure:** Based on steps 1 & 2, the RID indicates:
      *   When PJV/CJV strongly favors one good over the other.
      *   When a significant trade-off exists, suggesting either a hybrid rule (e.g., premise-based with conclusion override under specific fragility conditions) or a deliberate prioritization.
      *   How agenda formulation (granularity) interacts with rule choice to impact RT.
  **Is it realistic?** Yes, but manage expectations. The RID won't give a single "right" answer for all complex cases. It provides *structured reflection points* to make the VT/RT trade-off explicit and informed by agenda structure, moving beyond intuition or tradition. It makes agenda fragility a central design consideration.

  ### 5. Failure Modes & Honest Assessment
  *   **Substantive Failure:** If simulations reveal RT and VT are *perfectly aligned* under PJV or CJV across all plausible agenda structures, the core distinction lacks practical force. (Unlikely: Preliminary analysis suggests trade-offs, especially with asymmetric reliability/costs).
  *   **"It Depends" Collapse:** If findings show no systematic relationship between agenda features and the VT/RT trade-off magnitude/direction, yielding only highly context-specific advice. (Mitigation: Focus on identifying robust *clusters* of agenda types).
  *   **Agenda Fragility Intractability:** If robustness proves impossible to define formally or measure meaningfully. (Mitigation: Focus on clear cases of splitting/lumping).
  *   **The Meta-Agenda Problem:** You are right to flag this. **Assessment:** Formally modeling the *choice* of aggregation rule (or agenda granularity) as a higher-order judgment aggregation problem *is a second project*. It introduces significant complexity (regress, strategic voting). **Recommendation:** Explicitly bracket it as a fundamental limitation. Discuss it briefly in the proposal as context *why* the initial rule choice matters, but focus the project on evaluating fixed procedures/granularities. State: "This project takes the aggregation rule and agenda formulation as exogenous inputs, acknowledging the critical (but distinct) challenge of meta-agenda setting as essential future work."

  ### 6. Why This Project Matters
  This research moves beyond the purely epistemic lens dominating judgment aggregation. By taking "reason-tracking" seriously as a distinct good tied to institutional legitimacy and the practical authority of group rationales (especially in law), it offers:
  1.  **Theoretical Novelty:** Integrates rationale coherence and agenda fragility into the core evaluation of aggregation procedures.
  2.  **Practical Impact:** Provides tools for designing deliberative bodies where the *justification* of the decision is as crucial as the decision itself (courts, ethics boards, standards committees).
  3.  **Sharpened Debate:** Reframes disputes like yours with your friend – not as philosophy vs. practice, but as identifying which institutional good (VT or RT) is paramount in a given context and how to achieve it structurally.

  **Proposal Sharpening:** The brainstormed candidate questions highlighted the need to *characterize the trade-off* (Option 2) rather than just compare procedures (Option 1, too vague) or jump to novel designs (Option 3, too ambitious) or focus solely on law (Option 4, limiting generality). The chosen question focuses on the *interaction* of procedure and agenda structure to map the VT/RT landscape systematically. This is tractable in one year with the proposed methods and delivers foundational insights with clear applicability.
