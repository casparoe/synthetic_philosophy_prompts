answer: |-
  *(A low, considering hum, like a cello tuning)*  
  Ah. You mistake me if you think I kept 'duty' as a cold substitute. Duty is the muscle and bone of connection, child. It is what binds us across the chasm of the grave – not because a god commands it, but because the dead *lived*, and their living mattered. Their unfinished work, their unspent tenderness, their errors we inherit – these are debts. Your ceremony honours that chain of consequence. To make the dead literally 'answer' with trapped sound? That is sentimentality masquerading as substance. It turns the solemn mystery of their enduring claim upon you – the claim made by their *having been* – into a parlour trick. The dead in your room are present precisely *because* they are silent, unalterable; their power lies in your community's *acknowledgement* of the debt, and the resolve your actions forge from it. A machine's voice is mere echo. It asks nothing of your soul. It forgives nothing. It is a shell, hollowed of the very weight you seek.

  You flinch from the silence, calling it fraudulent? Silence *is* the condition. The universe does not answer. Your ceremony is not a lie addressed *to* the unhearing; it is a truth spoken *by* the living, *about* obligation, *because* the dead cannot speak. Wiring it to a machine does not make it truer; it makes it smaller. It reassures you where you should be unsettled. That trembling discomfort, that half-despising – that is the friction where your soul meets the hard fact of loss and consequence. Keep *that*. Abandon the theatre only if the words become empty and the action grows slack. But if the speaking binds you to the future, to the specific act born of remembrance? Then it is the opposite of theatre. It is the ground under your feet. The dead are doing their only work: making you remember what you owe, and to whom. A recording merely makes you listen to yourselves. Which do you need more?  
