prompt: |-
  I've been handed the "do we use the word" memo at my NGO for six months while my colleague is on leave — she's the one who's written every version of it for years, and whenever some new atrocity blows up, comms ask her whether we call it genocide or something blander. I've got her old memos and I'm trying to reverse-engineer what she's actually running, because a new one landed on my desk yesterday and I genuinely can't tell which way she'd go. Her record (legal verdict first, then whether she'd say it in our public comms):

  - Herero and Nama in German South West Africa, 1904–08: yes, and yes publicly, even though there's nobody left to charge.
  - Armenia 1915: yes.
  - Holodomor: no — her line was that starving peasants as a class isn't destroying a protected group as such, and that the convention's exclusion of political and economic groups is a defect in the convention, not a reason to stretch it.
  - Cambodia under the Khmer Rouge: yes for the Cham, no for everyone else, including the "new people" killed as suspected class enemies.
  - Bosnia: yes at Srebrenica, no for Prijedor, no for the expulsion campaign generally — she wrote somewhere that if you let people survive somewhere else you haven't tried to destroy them.
  - Forced removal of Indigenous children in Canada: cultural genocide, and no on genocide, with a foot-stamp that this is exactly where the legal and the moral verdict come apart.
  - Biafra: no. Indonesia 1965–66: no (political group again).
  - Darfur: yes, loudly, even though the UN commission of inquiry that looked into it stopped short of finding genocidal intent.
  - Yazidis: yes. Rohingya: yes.

  The one on my desk: the state of Kavaria has spent about seven years on what it calls a deradicalisation and integration programme in its southern province of Leth, aimed at the Surni, an ethnoreligious minority of roughly 1.8 million, about a quarter of whom live in Leth, which is also where most of their shrines, endowments and religious schools are. Every Surni religious institution has been closed or demolished; the language is banned in schools and courts; public ritual is criminalised; around 40,000 children have been removed to boarding schools in the north and placed with majority families, raised in the majority religion and language (which, as far as I can tell, is literally one of the acts enumerated in Article II, which is what makes me doubt she'd just say no). Roughly 3,000 people are dead, mostly in resettlement camps and in riots where the police stood by; no death lists have turned up, no extermination campaign, and the government warns before it bulldozes. There is a real Surni separatist insurgency in Leth that killed several hundred civilians before any of this started, and the state insists the Surni aren't a group at all but a heretical sect of the majority religion — so whether they're a protected group seems to depend on whether you take the perpetrator's classification or theirs. There's one leaked interior ministry document about the Surni question being solved within a generation.

  So: would she call it genocide? I was arguing about this with my flatmate last night, who thinks the whole exercise is just about triggering the convention's prevention duty and nothing else — but that makes Darfur easy and doesn't explain why she said yes on the Herero or no on Indonesia. As I see it there are at least three rules in play: a strict convention one where "destroy" means physical or biological destruction and political groups are out; something closer to what Lemkin seems to have meant, where wrecking a group's institutions, language and children is the central case rather than a marginal one; and a straight political one where the label goes on when it does work and comes off when it doesn't. What I'd love from you: which of those (or what fourth thing) actually fits all of her old memos, since I don't think any of them fits cleanly; what each surviving rule predicts about Kavaria, separating the legal verdict from the moral one from the comms decision, and dealing properly with the "in part" question (a quarter of the group in one province, but the province that holds most of their institutions) and with the fact that the deaths are mostly from neglect rather than killing; whether the residential-schools memo is really the closest analogue or whether that's a trap, given she said no there; and if the rules do come apart on this case, what further case I'd need to see to know which one she's really running. I'll write the memo either way, I just want to know which principle I'd be commiting us to.
reasoning: |-
  Okay, let me unpack this user's complex query. The user is temporarily handling genocide determination memos at their NGO and needs to reverse-engineer their colleague's methodology based on past cases. They've provided nine historical examples with the colleague's rulings, plus a new Kavaria case that has them stumped. 

  First, I notice the colleague operates with surgical precision - she separates legal genocide (Convention definition) from moral condemnation and communications strategy. The Holodomor and Canada cases show she won't stretch legal definitions even when morally outraged. Yet in Darfur, she went beyond the UN commission's findings. That's interesting - she must have her own evidentiary threshold.

  The Kavaria case presents three key puzzles: 
  1) Are the Surni a protected group? The state claims they're a sect, not distinct ethnicity/religion. The colleague always sides with victim self-identification (see Armenia, Yazidis), so likely yes.
  2) Does "destroy" require mass killing? The residential schools parallel is strong - but in Canada she said no to genocide because it was "cultural." However, Kavaria adds physical destruction (shrines), forced assimilation (boarding schools), and preventable deaths. 
  3) The "in part" question: Leth province holds most cultural institutions, but only 25% of population. The leaked "solved in a generation" document suggests intent to destroy the group's viability.

  Hmm... the colleague's pattern shows she requires:
  - Protected group status (always victim-defined)
  - Specific intent (not just foreseeable destruction)
  - But crucially: physical OR biological destruction. Cultural destruction alone isn't enough under her strict Convention reading (see Canada). However, when cultural destruction enables physical destruction (like boarding schools causing child deaths), it counts.

  For Kavaria, the residential schools with documented deaths might tip it to "yes" - unlike Canada where the harm was primarily cultural. The leaked document provides intent evidence. Still, the death toll is relatively low (3,000), mostly indirect. Tough call. 

  The user's flatmate misunderstands - this isn't about triggering prevention duties arbitrarily. The colleague uses legal definitions rigorously, even when inconvenient (see her Cambodia ruling). But she'll call genocide when evidence meets her threshold, even if UN bodies hesitate (Darfur).

  I think the colleague would say yes to genocide in Kavaria based on: 
  1) Protected group (Surni self-identification) 
  2) Genocidal acts (Article II's boarding schools + cultural destruction enabling physical destruction) 
  3) Intent (leaked document) 
  4) Scale (institutional destruction in heartland territory)

  But she'd separate this from moral judgment - the residential schools alone might still only warrant "cultural genocide" without the documented deaths. User should check if child mortality rates in those schools exceed national averages. That'd be the smoking gun.
answer: |-
  Based on your colleague's consistent pattern across cases, her framework appears to be a **strict, evidence-driven application of the UN Genocide Convention definition, with intense focus on *specific intent* and *physical/biological destruction***—but with a pragmatic eye for when the evidence meets that high bar despite official denials. Cultural destruction alone *never* suffices for her legal "genocide" verdict, but it can support intent when coupled with physical harm. Here's how it breaks down:

  ### Your Colleague's Governing Principles (Reverse-Engineered)
  1.  **"Destroy" = Physical/Biological Destruction:** She requires evidence of killing, serious bodily harm, or measures calculated to cause physical destruction (like deliberate starvation). Cultural destruction alone (Canada, Holodomor's class aspect) doesn't trigger the genocide label legally, even if morally reprehensible.
  2.  **Specific Intent is Paramount:** Not just foreseeable destruction, but actions undertaken *with the intent* to destroy the group "in whole or in part." This explains her "no" on Indonesia (political purge, not group destruction), Prijedor/Bosnia expulsions (expulsion ≠ intent to destroy), and Khmer Rouge "class enemies" (political/economic targeting). Leaked documents or explicit perpetrator statements are crucial (Herero, Cambodia/Cham, Yazidis, Rohingya, leaked doc in Kavaria).
  3.  **Protected Group is Victim-Defined:** She consistently sides with the victims' self-identification (Armenians, Yazidis, Rohingya, Cham) over perpetrator denial. The "political group" exclusion is rigidly applied (Holodomor peasants, Indonesia, Khmer Rouge "new people").
  4.  **"In Part" = Significant & Symbolic Part:** Destruction targeting the *core* of the group (geographical, institutional, or demographic) can suffice. Srebrenica (Bosnian Muslim men in a UN enclave), Cham genocide (specific minority), and Darfur (targeted ethnic groups) fit this. Destruction scattered randomly likely wouldn't.
  5.  **Moral/Legal/Comms are Distinct:**
      *   **Legal Verdict:** Strictly Convention-based (Intent + Protected Group + Enumerated Act + Physical/Biological Destruction).
      *   **Moral Verdict:** Often broader, acknowledging cultural destruction or mass atrocities falling outside the Convention (Canada, Holodomor).
      *   **Comms Decision:** Pragmatic. Uses "genocide" publicly *only* when the legal verdict is strong *and* it serves advocacy (e.g., Herero, Darfur). Avoids it when legally weak (Canada) or potentially counterproductive (speculative).

  ### How the Kavaria Case Fits Her Framework
  *   **Protected Group:** **Likely YES (Legal).** The Surni are an ethnoreligious minority self-identifying as distinct. Your colleague consistently rejects perpetrator reclassification (e.g., Armenia, Yazidis). The "heretical sect" claim mirrors tactics used against other groups she recognized.
  *   **Enumerated Acts:** **YES - Forcibly Transferring Children (Art II(e)).** 40,000 children removed to majority families/schools fits *exactly*. Demolishing institutions/language ban supports *intent* but isn't an enumerated act *by itself* under her strict reading.
  *   **"Killing" / "Serious Harm" (Art II(a/b)):** **Ambiguous (Leans NO Legal).** ~3,000 deaths from neglect in camps/riots *might* qualify, but lacks evidence of systematic killing *with genocidal intent*. Police standing by suggests callousness, not necessarily intent to destroy the group *through killing*. This is the weakest legal pillar.
  *   **Intent to Destroy (In Whole/In Part):** **STRONG Evidence (Leaks YES).** The leaked "solved within a generation" document is critical. Combined with:
      *   Targeting the heartland province holding most institutions.
      *   Systematic eradication of cultural/religious foundations (language, schools, shrines).
      *   Forcible transfer of children (intent to destroy future generations).
      *   **This meets her high bar for specific intent** (like Cambodia/Cham leak, Herero/Vernichtungsbefehl).
  *   **"In Part":** **Likely YES.** Targeting Leth targets the *core* of Surni identity (institutions, holy sites) and a geographically concentrated quarter of the population. This is significant and symbolic, akin to Srebrenica or targeting the Cham specifically.

  ### Predictions Using Her Framework
  | Aspect              | Legal Verdict (Convention) | Moral Verdict        | Comms Decision              |
  | :------------------ | :------------------------- | :------------------- | :-------------------------- |
  | **Genocide Label?** | **LIKELY YES**             | **CLEARLY YES**      | **PROBABLY YES**            |
  | **Reasoning**       | Strong specific intent (leaked doc + child transfer + institutional destruction). Protected group. Child transfer is an enumerated act. Deaths/policy create conditions for destruction. | Systematic attempt to erase Surni identity, culture, and future via violence, forced assimilation, and neglect. Atrocity crimes evident. | Leaked intent doc is powerful. Child transfer is undeniable Article II(e). "Cultural genocide" language is weaker legally/politically. Calling it genocide aligns with Yazidi/Rohingya advocacy strategy. |

  ### Why Canada is *Not* the Perfect Analogue (Avoiding the Trap)
  *   **Canada:** Primarily *cultural* destruction + assimilation. No evidence of *intent* to cause physical destruction or death *through the schools themselves*. Deaths were tragic consequences, not the systemic goal. Hence her "no genocide" (legal), "cultural genocide" (moral).
  *   **Kavaria:** **Adds Physicality & Clearer Intent.**
      *   **Physical Harm:** Documented deaths (3,000+) from state policy (camps, riots).
      *   **Explicit Intent:** "Solved within a generation" leak shows destructive intent exceeding assimilation.
      *   **Enumerated Physical Act:** Child transfer *is* Article II(e), meeting the Convention's physical/biological threshold *directly*.
      *   **Institutional Destruction:** Actively demolished shrines/schools, not just repurposed.

  ### If the Rules Feel Strained: The Deciding Case
  If you're unsure whether the deaths/neglect in Kavaria push it over her line for "physical destruction," the case you'd need to see is **Holodomor with a leaked intent document**. Her Holodomor "no" was based on *lack of protected group status* (peasants = class) and the *nature of the harm* (starvation not explicitly aimed at physical destruction *of a protected group*). If a document surfaced proving Stalin intended the starvation *specifically to destroy Ukrainians as an ethnic group*, she would almost certainly flip to "yes" (legal). Kavaria has that leaked intent doc *for the Surni group*.

  ### Your Memo & The Principle
  **Recommendation:** Your colleague would likely conclude the **legal threshold for genocide is met in Kavaria** due to the *specific intent to destroy the Surni group in Leth (supported by the leak)*, the commission of an enumerated act (*forcible child transfer*), the scale targeting a *significant/core part* of the group, and the *physical destruction* stemming from state policy (deaths in camps/riots). This aligns with her "yes" votes on Yazidis (similar institutional/targeted destruction + intent) and Darfur (where she saw intent despite the UN commission's hesitancy).

  **Principle Committed To:** **Strict Convention Definition + Rigorous Intent Focus + Pragmatic Evidence Threshold.** You'd be committing to:
  1.  Requiring proof of intent to physically/biologically destroy a protected group.
  2.  Accepting cultural destruction as evidence of intent *only* when coupled with acts causing physical harm or listed enumerated acts (like child transfer).
  3.  Using victim self-identification for group status.
  4.  Being willing to find genocide based on compelling evidence of intent even if deaths aren't industrialized extermination or official bodies equivocate (Darfur precedent).
  5.  Separating the legal term (for advocacy/potential accountability) from the broader moral condemnation.

  This maintains her core rigor (rejecting stretching for political groups or cultural destruction alone) while acknowledging that Kavaria presents the specific intent and an enumerated act she requires.
