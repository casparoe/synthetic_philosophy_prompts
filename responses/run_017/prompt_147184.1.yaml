prompt: |-
  I teach a final-year undergraduate seminar in aesthetics and am writing this term's final exam. I want one 60-minute essay question on fakes, forgeries and the value of originals that cannot be answered by summarizing Goodman's argument about indiscernible copies or by invoking Benjamin on aura. Build it around this invented case, which I have drafted for the paper:

  In 1911 a panel painting catalogued as the work of a minor seventeenth-century Dutch master is transferred: the conservator lifts the whole paint and ground layer off its warped oak panel and mounts it on a new mahogany one. Some decades later the museum re-examines its holdings. Dendrochronology dates the oak panel — which the museum kept, with a thin residue of ground still adhering to it — to the master's lifetime. Pigment analysis dates the paint layer now on display to the 1880s, and archival work shows that a restorer of that period reconstructed the image almost in its entirety from what survived of the original and had the result catalogued and sold as the master's own. So the object on the wall is a nineteenth-century imitation made of nineteenth-century materials; the only physically continuous remnant of the seventeenth-century object is a nearly blank plank in a storeroom.

  Please give me:

  1. The question as I would print it — the case, plus an instruction precise enough that a strong student knows what they are being asked to settle.
  2. A model answer of roughly 600 words.
  3. A marking scheme out of 20, organized around four must-hit moves, with the marks attached to each and one line on the error that should cost marks at that point. The errors I most want caught are sliding from "the plank is the spatio-temporally continuous object" to "so the plank is what is worth looking at," and treating "the hanging picture is not by the master" as though that settled what kind of value it can have.

  The question should force students to say what sort of property authenticity is and what work it is supposed to do — a historical property, a guarantee of a certain kind of experience, or something else again — rather than to decide which of the two objects deserves a single title. Assume no access to a library, and give me no bibliography; I will attach the readings myself.
reasoning: |-
  Okay, let me tackle this professor's request. They teach an undergrad aesthetics seminar and need a final exam question about fakes/forgeries that avoids the usual Goodman and Benjamin routes. The core is this fascinating case study about a transferred painting where the original plank and reconstructed image create an ontological puzzle.

  First, I need to design a question that forces students to grapple with what authenticity *does* rather than just defining it. The key is to prevent two common errors: conflating spatiotemporal continuity with aesthetic value, and assuming attribution determines all possible worth. The prompt must push beyond "which is the real artwork?" to "what work does authenticity perform?"

  For the model answer, I'm considering structuring it around three core moves: 
  First, dissecting authenticity as a relational historical property rather than a physical trait. 
  Second, distinguishing between attributional authenticity (who made it) and object authenticity (material history). 
  Third, showing how both the plank and the hanging image can hold different types of value - the plank as archaeological evidence, the reconstruction as historical interpretation. 

  The marking scheme should penalize exactly those slippery arguments the professor warned about. I'll allocate points for: 
  1) Correctly framing authenticity's nature (5 marks) 
  2) Separating attribution from material continuity (5 marks) 
  3) Articulating plural value frameworks (5 marks) 
  4) Avoiding the two prescribed errors (5 marks) 

  For the model answer's thrust, I'm imagining a student arguing that authenticity isn't a switch but a dial - the plank has maximal material authenticity but minimal aesthetic legibility, while the reconstruction reverses that. The real insight should be that museums aren't just display cases but time machines that stage encounters with history in different modes. 

  The challenge is making sure the question doesn't let students off the hook with "both have value" without specifying *how*. The instruction must demand they show their cards about what authenticity *is for* - is it about grounding interpretation? Enabling certain experiences? Or something else entirely?
answer: |-
  Here is the complete exam package addressing your requirements, designed to push students beyond attribution debates into the metaphysics and function of authenticity:

  **1. Exam Question (to be printed):**

  > **Case Study:** In 1911, a panel painting catalogued as the work of a minor seventeenth-century Dutch master underwent conservation: the entire paint and ground layer was lifted off its warped oak panel and mounted on a new mahogany support. Decades later, the museum re-examined its holdings. Dendrochronology dated the *original oak panel* (kept by the museum with a thin residue of ground layer) to the master’s lifetime. However, pigment analysis dated the *paint layer now on display* to the 1880s. Archival research revealed that a restorer in that period had reconstructed the image almost entirely from remnants of the original and had the resulting object catalogued and sold as the master’s work. Thus, the object currently displayed is a nineteenth-century imitation using nineteenth-century materials, while the only physically continuous remnant of the seventeenth-century object is a nearly blank plank in storage.

  > **Question:** Neither the plank nor the hanging picture can straightforwardly claim the title "the original work by the master." Using this case, **explain what kind of property ‘authenticity’ constitutes within the artworld and what specific work this property is expected to perform.** Your analysis must:
  >   a)   Precisely define the nature of authenticity at stake (e.g., historical, material, experiential, intentional).
  >   b)   Demonstrate what is *gained* or *lost* aesthetically and institutionally when we apply this property to *each* object (the plank and the hanging picture).
  >   c)   Argue why maintaining a concept of authenticity matters (or doesn't) for our engagement with art *in this specific case*, beyond simply establishing correct attribution.
  >
  > *Avoid relying on Goodman’s arguments about indiscernibility or Benjamin’s concept of aura. Focus on the functional role of authenticity revealed by this scenario.*

  **2. Model Answer (Approx. 600 words):**

  This complex case exposes authenticity not as a singular, inherent quality, but as a *relational historical property* signifying a unique causal connection to a specific context of creation. Its primary work is epistemic and axiological: it underwrites certain kinds of interpretive and experiential claims while shaping institutional practices of preservation, display, and value assignment. Authenticity here functions as a *guarantor of historical encounter*, though the form of that encounter differs radically between the two objects.

  Regarding the **nearly blank plank**: Its authenticity lies in its *material continuity* as a component physically crafted and used within the 17th-century artist's workshop. It possesses *provenancial authenticity* – a direct, unbroken material link to the past moment. The work this authenticity performs is primarily *archaeological*. It offers tangible, scientific evidence of the artist's process (wood choice, ground preparation). Its value is historical testimony, not aesthetic contemplation. While it is the "spatio-temporally continuous object," this doesn't automatically make it the "authentic artwork" for display, precisely because the crucial aesthetic properties – the intentional visual configuration applied *to* that support – are almost entirely absent. To claim the plank *is* the artwork worth looking at solely based on material continuity is to commit a category error, mistaking a component relic for the complete aesthetic artifact. Its authenticity grounds historical knowledge, not current aesthetic experience.

  Conversely, the **hanging picture** lacks *attributional authenticity* (it wasn't created by the master) and *material authenticity* in its paint layer. However, it possesses a different, historically significant authenticity: *intentional reconstruction authenticity*. The 19th-century restorer aimed (fraudulently, yet skillfully) to recreate the *appearance* and *aesthetic effect* of the lost 17th-century work based on surviving evidence. The work performed by acknowledging *this* authenticity is recognizing the object as a significant historical document *of 19th-century artistic values, restoration practices, and art market desires*. It has aesthetic value *as* a skilled 19th-century pastiche, offering a window into how a past era viewed and sought to preserve an even earlier one. To dismiss its value entirely because "it’s not by the master" ignores this layered historical meaning and its own aesthetic merits as a product of its time. Its display value stems from its visual coherence and its embodiment of art historical reception, not its spurious attribution.

  This case demonstrates why authenticity matters beyond mere labeling. It dictates the *framework of engagement*. Authenticity (in its various forms) tells us *what we are encountering* and thus *how we should approach it*. Encountering the plank *as* authentic 17th-century material demands a forensic, historical-analytical mode. Encountering the hanging picture *as* an authentic 19th-century reconstruction demands an appreciation of historical interpretation and period craftsmanship, alongside critical awareness of its deceptive provenance. The concept of authenticity isn't just about "who made it"; it's about securing a reliable connection to a specific generative moment in history (creation or reception), which then structures the kinds of meaning, value, and experience we can legitimately derive from the object. Abandoning the concept altogether would collapse these distinct historical encounters and flatten the complex, layered nature of art's existence through time, diminishing our understanding of both the 17th-century artist's world and the 19th-century art market. Authenticity, therefore, performs the essential work of enabling differentiated historical understanding and appropriately calibrated valuation.

  **3. Marking Scheme (Out of 20):**

  *   **Move 1: Defining Authenticity's Nature & Function (5 marks)**
      *   *5/5:* Clearly defines authenticity as a relational/historical property (e.g., causal link, contextual origin) and explicitly states its core function (e.g., enabling specific encounters, grounding interpretation/value, historical testimony).
      *   *3-4:* Defines authenticity but function is vague or simplistic (e.g., just "being real" or "old"). Focuses only on attribution.
      *   *0-2:* Misdefines authenticity (e.g., as inherent aura, physical perfection) or function (e.g., solely monetary value). Mentions Goodman/Benjamin.
      *   **Error Cost:** **-2 marks** for treating authenticity as an intrinsic, non-relational property or failing to articulate its *work*.

  *   **Move 2: Distinguishing Attribution from Continuity/Value (5 marks)**
      *   *5/5:* Explicitly separates spatio-temporal/material continuity (plank) from attributional authenticity AND clearly argues why continuity alone does not equate to the artwork's primary aesthetic value or display-worthiness. Avoids the plank trap.
      *   *3-4:* Notes the plank has historical value but implies it might be the "real artwork" or conflates its continuity with primary aesthetic significance. Distinction is fuzzy.
      *   *0-2:* Declares the plank is the "real" artwork solely because it's the continuous relic. Or fails to address the plank's status meaningfully.
      *   **Error Cost:** **-3 marks** for sliding from "the plank is the continuous object" to "therefore it is the authentic artwork worth displaying/viewing aesthetically".

  *   **Move 3: Articulating Plural Value Frameworks (5 marks)**
      *   *5/5:* Accurately identifies and justifies *distinct* types of value and authenticity applicable to *each* object (e.g., plank: historical/testimonial/material authenticity; hanging picture: reconstruction/period skill/historical reception authenticity, aesthetic value *as* a 19th-c object). Avoids dismissal based solely on attribution.
      *   *3-4:* Acknowledges both have value but doesn't clearly articulate *different frameworks* or types of authenticity/value. Still overly focused on the hanging picture *not* being by the master.
      *   *0-2:* Dismisses the hanging picture's value entirely because it's "fake" or "not by the master," or vastly over/under-states the value of either object without justification.
      *   **Error Cost:** **-3 marks** for treating "the hanging picture is not by the master" as sufficient reason to deny it *any* significant artistic or historical value within a relevant framework.

  *   **Move 4: Arguing for Authenticity's Role (5 marks)**
      *   *5/5:* Provides a compelling, case-specific argument for *why* maintaining the concept(s) of authenticity matters (or doesn't), focusing on its functional role (e.g., enabling differentiated historical encounters, structuring interpretation, guiding institutional practice, preventing historical flattening).
      *   *3-4:* States it matters for "accuracy" or "truth" but doesn't elaborate on the functional *consequences* for engagement. Argument is generic, not case-rooted.
      *   *0-2:* Concludes authenticity doesn't matter, or the argument is absent, circular, or solely about market honesty.
      *   **Error Cost:** **-2 marks** for a generic or weak conclusion about authenticity's importance that doesn't stem from the analysis of the case's specific dynamics.

  **Rationale:** This structure forces students to analyze authenticity *as a functional concept* within the artworld ecosystem. It prevents summary (Goodman/Benjamin are excluded) and sidesteps the binary "which is the real one?" trap by demanding an explanation of what authenticity *is for* in relation to materially complex objects. The marking scheme explicitly penalizes the two key errors you identified. The model answer demonstrates handling the case's complexity by defining distinct authenticities and values for each object, rooted in their different historical origins and functions, while arguing for the conceptual necessity of authenticity in enabling nuanced engagement.
