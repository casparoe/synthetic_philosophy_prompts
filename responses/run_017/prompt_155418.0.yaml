answer: |-
  ### Audit of Commitments  

  Your position is internally coherent in several respects: (C5) grounds (C2) and (C3) effectively, (C1) aligns with (M), and (C6) explicitly addresses a trade-off without contradicting core principles. However, tensions exist, primarily due to the scope of (C5) and its interaction with (C4). Below, I address your requests systematically.  

  #### 1. Ranked Pairwise Tensions by Severity  
  I identify one severe tension and one lower-severity tension. Others dissolve upon inspection (see Section 2). The ranking is based on:  
  - **Severity**: Degree to which the tension undermines logical consistency or forces a costly revision.  
  - **Commitment that must bend**: Which commitment is logically untenable if the other holds.  
  - **Downstream cost**: Practical or principled loss from bending (e.g., weakening a core argument, creating new inconsistencies).  

  | Pair          | Severity | Commitment that must bend | Downstream cost of bending |  
  |---------------|----------|---------------------------|----------------------------|  
  | C4 vs C5      | High     | C4                        | Loss of distinction between municipal/national franchise; may require abandoning the idea that citizenship is uniquely tied to national sovereignty. |  
  | C1 vs C6      | Low      | Neither (tension dissolves; see Section 2) | N/A |  

  **Explanation of tensions**:  
  - **C4 vs C5 (High severity)**: (C5) applies the all-affected principle universally ("anyone durably subject to a government's coercion must have a say") and places the burden of proof on exclusion. Yet (C4) excludes non-citizen residents from the national franchise without justification. If (C5) holds, (C4) must bend to include non-citizens in the national franchise, as they are "durably subject" to national coercion (e.g., federal laws, taxes, security policies). Bending (C4) costs you the municipal/national distinction you assert. If (C5) bends instead (e.g., by limiting the principle to municipal contexts), it loses its universality and weakens the procedural presumption, undermining its use in defending (C3).  
  - **C1 vs C6 (Low severity)**: Superficially, (C1) risks adding "less-engaged voters" (by compelling turnout), which (C6) identifies as degrading electoral judgment. But the tension dissolves: (C6) concerns franchise *expansion* (adding new voter groups), while (C1) affects *existing* voters’ behavior without altering franchise boundaries. (C6) explicitly rejects competence tests, so it does not conflict with (C1)’s compulsion mechanism. No bending is needed.  

  #### 2. Pairs That Dissolve on Inspection  
  - **C1 vs M**: (M) demands that (C1) be justified by interests (e.g., skew in whose interests get registered), not symbolism. (C1) explicitly rests on this interest-based logic (addressing turnout skew), so no tension exists.  
  - **C5 vs C6**: (C6) acknowledges a cost (degraded judgment) but rejects competence-based exclusion, treating it as mitigable outside the franchise. (C5) focuses on inclusion criteria. These are complementary: (C5) defines *who votes*, (C6) addresses *how to manage* their participation. No tension.  
  - **C3 vs C4**: (C3) grants municipal votes to non-citizen residents; (C4) denies them national votes. This is not inherently tense—it reflects a jurisdictional distinction. The tension arises only when (C5) is applied (as in C4 vs C5).  

  #### 3. Case Verdicts vs (C5) Principle  
  - **(C2)**: Deliverable by (C5). Sixteen-year-olds are "durably subject" to municipal coercion (e.g., school regulations, curfews). The burden of proof for exclusion falls on opponents; you assume no default exclusion.  
  - **(C3)**: Deliverable by (C5). Non-citizen residents (3+ years) are "durably subject" to municipal coercion (e.g., local policing, zoning). Burden of proof for exclusion lies with opponents.  
  - **(C4)**: **Not deliverable** by (C5). Non-citizen residents are also "durably subject" to *national* coercion (e.g., federal taxes, immigration enforcement). (C5)’s burden of proof requires justification for their exclusion, which (C4) does not provide. (C4) must move (e.g., by aligning with (C3) for both levels or revising (C5)).  

  #### 4. Single Revision to Remove the Most Tension  
  - **Revision**: Drop or revise **C4** to align with (C5). Specifically, extend your support for non-citizen resident voting to national elections.  
  - **Tension removed**: Resolves the severe C4 vs C5 tension and ensures consistency in applying the all-affected principle.  
  - **Cost to you**: You lose the municipal/national franchise distinction. This may conflict with intuitions about national sovereignty or citizenship, and it could weaken political support for your overall package. However, it preserves (C5)’s integrity and avoids ad hoc exceptions.  

  ---  
  **Verdict: C4**
