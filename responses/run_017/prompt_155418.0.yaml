prompt: |-
  I sit on a charter-reform commission for a city of about 400,000 people. Our remit is the franchise for municipal elections only, but we have been asked to say how our recommendations bear on the national rules, which we cannot ourselves change. Before I draft my section I want my own position audited, because I have a feeling it is tidier in my head than it is on paper. Here it is, as six commitments plus one methodological preference.

  (C1) Turnout should be legally required, but not by fine. I favour what I have been calling forfeiture-based compulsion: a registered elector who does not vote, and has not filed a standing declaration of conscientious abstention, is struck from the electoral roll and must re-register before voting again. The declaration is available on the day at the polling place, needs no justification, and carries no penalty, so that nobody is ever made to record a preference they do not hold.

  (C2) The voting age should be sixteen for municipal elections; I would support sixteen nationally if that were open to us.

  (C3) Long-term residents who are not citizens — three or more years of lawful residence — should have the municipal franchise.

  (C4) But not the national franchise.

  (C5) The ground for (C3) is the all-affected principle: anyone durably subject to a government's coercion must have a say in who wields it. I pair this with a procedural presumption: the burden of proof always lies with whoever would exclude someone from the franchise.

  (C6) I take seriously the objection that an electorate's judgement degrades as less-engaged voters are added, and I think that cost is real and should be weighed. But I reject competence tests, plural voting, and every other device that requires the state to grade voters' competence, so I treat the cost as something to be mitigated rather than priced into the rule that defines the franchise.

  (M) Methodological preference: I am unmoved by defences of compulsory voting that treat it as civic ritual or as an instrument of nation-building. I want the case for (C1) to rest on interests — above all on the way voluntary turnout skews whose interests get registered — and not on symbolism.

  Please audit this package rather than defend it. I want to know where it binds on itself. Concretely:

  1. Rank the pairwise tensions by severity instead of listing them all as equally bad. For each, state exactly which commitment has to bend and what bending it costs me downstream.
  2. Identify any pair that merely looks tense and dissolves on inspection, and say what makes it dissolve. I would rather you discriminate than flag everything.
  3. Tell me whether any of the case verdicts — (C2), (C3), (C4) — is a verdict my own stated principle in (C5) cannot actually deliver, and if so which verdict has to move.
  4. Give me the single revision that removes the most tension at the least cost, and say plainly what I lose by making it.

  Two constraints. Keep this an audit of my commitments: I do not need a tour of what is usually argued about compulsory voting, voting age, or resident voting, and I do not want anything settled by appeal to how actual jurisdictions have drawn their lines. Where a tension depends on an empirical claim, say what the claim is and how much of my set rides on it.

  Present the ranked tensions as a table with columns for the pair, severity, which commitment gives way, and the downstream cost. Close with one final line in exactly this form:

  Verdict: <the label of the single commitment I should give up or revise if I want the set to hang together>
reasoning: |-
  We are auditing the user's position, which consists of six commitments (C1 to C6) and one methodological preference (M). The user wants to know where the commitments bind on each other, i.e., where there are tensions and how severe they are. We are to answer four concrete questions.

  The commitments are:

  C1: Turnout should be legally required by "forfeiture-based compulsion": non-voters without a declaration of conscientious abstention are struck from the roll and must re-register. No fine, and the declaration is easy and penalty-free.

  C2: Voting age should be sixteen for municipal elections (and nationally if possible).

  C3: Long-term residents (3+ years lawful residence) should have the municipal franchise.

  C4: They should not have the national franchise.

  C5: The all-affected principle (durably subject to coercion -> must have a say) and a procedural presumption: the burden of proof is on those who would exclude.

  C6: Acknowledges that adding less-engaged voters may degrade the electorate's judgment, but rejects competence tests and plural voting. The cost should be mitigated, not built into the franchise rule.

  M: Methodological preference: The case for compulsory voting (C1) should rest on interests (especially skew in whose interests get registered) and not on symbolism (like civic ritual or nation-building).

  We are to:

  1. Rank pairwise tensions by severity. For each tension, state which commitment must bend and the downstream cost of bending.

  2. Identify pairs that look tense but dissolve on inspection.

  3. Check if any case verdict (C2, C3, C4) is not deliverable by the principle in C5.

  4. Recommend a single revision that removes the most tension at the least cost, and state what is lost.

  Constraints: Audit only the commitments, no appeal to actual jurisdictions or usual arguments.

  Let's list all possible pairwise combinations that might have tension:

  - C1 and C5? (compulsion and all-affected principle)
  - C1 and C6? (compulsion and concern about adding less-engaged voters)
  - C2 and C5? (voting age 16 and all-affected principle)
  - C3 and C5? (resident municipal franchise and all-affected principle) - but they are aligned, so probably not.
  - C4 and C5? (no national franchise for residents and all-affected principle) - this might be a tension because the all-affected principle might apply nationally too.
  - C1 and M? (compulsion justified by interests, which is aligned with M, so probably not)
  - C3 and C4? (municipal franchise but not national) - might be tension with the all-affected principle if the principle applies equally to both levels?
  - C5 and C6? (all-affected principle and concern about degraded judgment) - this is the core tension that C6 addresses.

  We are to focus on tensions, so let's examine each.

  Step 1: Identify and rank tensions.

  Tension 1: Between C4 and C5.
  - C5 states the all-affected principle: anyone durably subject to a government's coercion must have a say. But C4 denies the national franchise to long-term residents. Are long-term residents durably subject to the national government's coercion? If so, then C5 would suggest they should have a say in national elections, but C4 says they should not. This is a direct conflict.
    - Severity: High. Because it directly challenges the consistency of the all-affected principle across levels of government.
    - Which commitment must bend? C4 must bend (to allow national franchise) or C5 must bend (to limit the all-affected principle to municipal only, or to introduce a distinction between levels). 
    - Downstream cost: If C4 bends, then the user loses the distinction between municipal and national franchise that they want. If C5 bends, then the user must adjust the principle to explain why the all-affected principle applies only to municipal government. But note that the user's C5 does not specify the level of government. The principle is stated generally.

  Tension 2: Between C1 and C6.
  - C1 introduces compulsory voting (with forfeiture) to address the skew in whose interests are registered (as per M). But C6 acknowledges that adding less-engaged voters (which compulsory voting might do) degrades the electorate's judgment. However, C1 is designed to increase turnout and thus might add less-engaged voters. The user in C6 says the cost of degradation should be mitigated, not built into the franchise. But note: C1 is about compulsion, not about expanding the franchise. However, by forcing turnout, it might bring in less-engaged voters who are already in the franchise. So the tension is: C1 may exacerbate the problem C6 identifies (degradation by less-engaged voters) and C6 rejects competence tests, so the user cannot use competence tests to mitigate the degradation. The user must rely on other mitigation methods. 
    - However, note that C1 does not expand the franchise (it only compels those already registered) and the degradation concern in C6 is about expanding the franchise (adding new groups). But the user in C6 says: "an electorate's judgement degrades as less-engaged voters are added". The word "added" might refer to expanding the franchise, but in the context of C1, the less-engaged voters are already in the franchise and are being compelled to vote. So C1 might increase the participation of existing less-engaged voters, which could degrade the overall judgment. 
    - But the user in C6 is explicitly about the franchise definition (adding groups) and not about turnout. The commitment C6 says: "the cost is real and should be weighed" but rejects competence tests. The tension is that the user wants to expand the franchise (C2 and C3) and also compel voting (C1) which together might increase the number of less-engaged voters participating, and the user wants to mitigate the degradation without adjusting the franchise. 
    - This tension is indirect and might be less severe because the user in C6 is primarily about franchise expansion, not turnout. However, the concern about degradation applies to the composition of the electorate that actually votes. So if C1 increases the participation of less-engaged voters (who are already in the franchise), that might be seen as a form of "adding" in terms of the active electorate. 
    - Severity: Medium. Because the user can argue that mitigation measures (like civic education) are separate and that the degradation from turnout is less than from franchise expansion. Also, C6 explicitly says the cost should be mitigated, so the user is already accounting for it. But note: the mitigation must not involve competence tests, plural voting, etc. 
    - Which commitment must bend? If we take the tension as real, then either C1 (by not having compulsion) or C6 (by allowing that the cost might be too high and thus adjusting the franchise). But the user in C6 says the cost should be mitigated. So we don't have to bend a commitment? We might say that the tension is resolved by the mitigation approach. However, if the degradation is severe and the mitigation fails, then the user might have to reconsider. But the user is committed to not building it into the franchise rule. So the tension is that the compulsion (C1) might worsen the degradation, and the user's only tool is non-franchise mitigation. 
    - Downstream cost: If C1 bends, then the user loses the mechanism to address the skew in interests. If C6 bends, then the user might have to accept competence tests or similar, which they reject.

  But note: the user in M wants C1 to be justified by interests (the skew). The degradation of judgment (C6) is also about the quality of the outcome. So there is a potential trade-off: reducing skew (by C1) might come at the cost of degraded judgment. The user must accept that trade-off and hope that mitigation works. So the tension is inherent but not necessarily a contradiction.

  Tension 3: Between C2 and C5.
  - C2: Voting age 16. C5: All-affected principle. Does the all-affected principle require that 16-year-olds have the vote? They are subject to the government's coercion. But note: the user's principle says "durably subject". Are 16-year-olds durably subject? Yes, they are. However, one might argue that below a certain age, individuals are not sufficiently affected or that they are represented by their parents. But the user's C5 has a procedural presumption: the burden of proof is on those who would exclude. So the user must argue that 16-year-olds should be included unless there is a compelling reason to exclude. The user has not provided an exclusion reason. So C5 supports C2. No tension.

  Tension 4: Between C3 and C5.
  - C3 is directly supported by C5: long-term residents are durably subject to municipal government coercion, so they must have a say. No tension.

  Tension 5: Between C4 and C5, as above (high severity).

  Tension 6: Between C5 and C6.
  - C5: The all-affected principle and the burden of proof on exclusion. C6: Concern about degradation of judgment by adding less-engaged voters. But note that C6 does not override C5. The user says the cost (degradation) is real and should be weighed, but they reject competence tests and plural voting. So the user is committed to not excluding on the basis of competence. Therefore, the all-affected principle (C5) must be applied without regard to competence. The tension is that the burden of proof (C5) would require including a group even if it might degrade judgment (unless there is proof that the degradation is so severe as to justify exclusion). But the user in C6 says the cost should be mitigated, not built into the franchise. So the two are consistent: the franchise is defined by the all-affected principle, and then we mitigate the degradation. No tension.

  Tension 7: Between C1 and M.
  - M is the methodological preference for justifying C1 by interests (skew) and not symbolism. The user has already done that. So no tension.

  Tension 8: Between C3 and C4.
  - This is not a direct tension because they are about different levels. But the question is: why does the all-affected principle apply at the municipal level but not the national? The user must provide a reason why national is different. The tension is with C5, not between C3 and C4 per se.

  Therefore, the main tensions are:

  1. C4 vs C5 (high severity)
  2. C1 vs C6 (medium severity)

  Now, are there pairs that look tense but dissolve?

  - C1 and C6: As argued, C6 is about franchise expansion, while C1 is about turnout among the existing franchise. The user might argue that the degradation concern in C6 is about the boundaries of the franchise, and C1 does not change those boundaries. Therefore, the tension dissolves because C6 is not about turnout. The user in C6 says "as less-engaged voters are added" meaning added to the franchise (by expanding it), not added to the active voting pool by compulsion. So the tension dissolves on inspection.

  But note: the user's statement in C6: "the objection that an electorate's judgement degrades as less-engaged voters are added". The word "added" could be ambiguous. However, in the context of the commitments, C2 and C3 are about adding new groups (16-year-olds and non-citizens) to the franchise. C1 is about compelling existing voters. Therefore, the primary concern of C6 is franchise expansion, not turnout. Thus, C1 and C6 are not in tension.

  Therefore, the only severe tension is between C4 and C5.

  Now, question 3: Check if any case verdict (C2, C3, C4) is not deliverable by C5.

  - C2 (voting age 16): As above, C5 supports it because 16-year-olds are durably subject to coercion and there is no reason to exclude (burden of proof on the excluder).
  - C3 (municipal franchise for residents): Directly delivered by C5.
  - C4 (no national franchise for residents): This is not delivered by C5. In fact, C5 would seem to require the national franchise for long-term residents because they are also durably subject to the national government's coercion. Therefore, C4 is not deliverable by C5. The user must either adjust C4 (to include national franchise) or adjust C5 (to limit the principle to municipal only).

  Question 4: Single revision that removes the most tension at the least cost.

  The main tension is between C4 and C5. We can either:
  - Revise C4: Extend the franchise to non-citizen residents for national elections. Then C4 is dropped or revised. What is lost? The user loses the distinction between municipal and national franchise. They might believe that national franchise should be for citizens only, but that belief is not supported by their principle C5.
  - Revise C5: Limit the all-affected principle to municipal government. For example, by saying that the principle applies only to local government because the connection between being affected and having a say is more direct at the local level. What is lost? The user loses the universality of the principle. Also, the procedural presumption (burden of proof) would then only apply locally, which weakens the overall argument.

  Alternatively, we could revise C5 to include a distinction between levels. For instance: "The all-affected principle applies to any government, but the level of connection required may vary. At the municipal level, residence is sufficient; at the national level, citizenship is required because of the broader political community." But then the burden of proof (procedural presumption) would require justification for why citizenship is required at the national level. The user might argue that the national government represents the political community of citizens, so non-citizens are not part of that community. However, the user's C5 does not currently include such a distinction. The revision would add complexity to C5.

  The tension with C4 is severe because it directly contradicts C5. Therefore, the revision that removes the most tension is to drop C4 and extend the franchise to non-citizen residents for national elections. But note: the commission's remit is only municipal elections. However, the user has been asked to say how their recommendations bear on national rules. The user's position is that non-citizens should not have the national franchise (C4). But if they drop C4, then they are neutral or supportive of national franchise for non-citizens? That might be outside their remit, but they are making a statement about national rules.

  Alternatively, if the user does not want to drop C4, they must revise C5 to accommodate the distinction. The cost is that the principle becomes less universal and might be seen as ad hoc.

  But the user asked for the single revision that removes the most tension at the least cost. Dropping C4 removes the tension without altering the principle (C5) and without affecting the municipal recommendations (C3). The cost is that the user loses the position that national franchise should be restricted to citizens. However, the user might not have a strong independent reason for C4 beyond the principle in C5? If C5 is the foundation, then C4 is inconsistent.

  Therefore, the best revision is to drop C4.

  But note: the user might have an unstated reason for C4, such as the idea that national elections are about the political community of the nation-state, which is defined by citizenship. However, the user has not included that in the principles.

  Alternatively, the user could revise C5 to say that the all-affected principle applies only to municipal government. But then what about the national government? The user would need a different principle for the national franchise. That complicates the package.

