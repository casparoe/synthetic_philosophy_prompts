answer: |-
  Here's the strict Darwin-Turing inversion mapping applied to the Wright episode, addressing your specific grasps and counterpoints:

  **1. The Competent-Without-Comprehending System:**  
     *   **Primary:** **The wind-tunnel programme & iterative selection process.** This subsystem operated on variation (different wing shapes/camber, control mechanisms) and *selection* (measured lift/drag, pilot feedback on handling). It generated functional solutions (high lift-to-drag airfoils, effective wing-warping) *without* requiring the Wrights (or the process itself) to initially understand *why* those specific shapes/actions worked better in a deep quantitative or causal-physics sense. It was a mechanical selector.
     *   **Secondary:** **The Flyer (1903).** As the *output* artifact, it embodied flight competence purely physically. Its structure/function emerged from the selection process, not prior comprehension of aerodynamics.

  **2. Mapping the Grasps (1903 Wrights vs. Langley):**

  | Grasp Type          | Wrights (1903)                                        | Langley (Pre-1903)                                   | How They Came Apart                                                                 |
  | :------------------ | :---------------------------------------------------- | :--------------------------------------------------- | :---------------------------------------------------------------------------------- |
  | **Quantitative-Predictive** | **Limited/Corrected Empirical.** Could *measure* lift accurately with their tunnel/data tables, but couldn't *compute* it from fluid dynamics principles. Knew *what* number worked (corrected Lilienthal), not *why* mathematically. | **Strong (but Flawed).** Relied on existing theory & coefficients (e.g., Lilienthal's tables, Rayleigh equations) to calculate lift/stability *in advance* for his designs. Believed in the math. | Langley's grasp was abstract & predictive *in theory* but failed in practice. Wrights' grasp was grounded in measured reality but not first-principles. |
  | **Causal-Handle**   | **Exceptional.** Knew *precisely* which "knobs" to turn (warp wings, move rudder, adjust elevator) and *how* (coordinated inputs) to control the aircraft based on direct piloting experience & tunnel feedback on roll/yaw/pitch effects. Mastered the *machine* as a system. | **Weak.** Focused on inherent stability. Lacked practical understanding of pilot-controlled *active* stability and 3-axis control interaction. No real piloting feedback loop. Knew knobs *theoretically* (e.g., dihedral for roll stability) but not how to *operate* them dynamically in flight. | Wrights understood control *as an operator*. Langley understood stability *as a theorist*. Wrights' causal-handle grasp *was* their competence. |
  | **Justificatory**   | **Minimal/Functional.** Could justify choices based on *empirical results* ("this wing shape gives more lift in our tests," "warping stops the roll we experienced"). Could not explain the underlying fluid dynamics *why* (boundary layers, pressure gradients, circulation). | **Strong (but Incorrect).** Could provide detailed theoretical justifications using established physics (Newtonian impact theory, equilibrium/stability math) for his designs. His math *was* his justification. | Langley had a coherent, accepted scientific justification that was wrong in key aspects. Wrights had no deep scientific justification, only proof-by-working. |

  **3. Addressing Your Nagging Points (Inversion Confirmation?):**

  *   **Corrected Pressure Coefficient:** This *is* empirical competence scaffolding *towards* comprehension, not its refutation. The wind tunnel + measurement *was* their selection mechanism. They didn't derive the correction from Navier-Stokes; they *measured* it. This shows competence (accurate measurement) *enabling* a *specific*, localized piece of quantitative understanding ("Lilienthal's number is wrong; here's the right one *for our purposes*"), not comprehension driving the initial competence. It's the *inversion in action*: doing (measuring) led to knowing (the correct coefficient), not vice-versa for that step.
  *   **Theory Enabling Skipping Wind-Tunnel Runs:** True, but this is *later* comprehension built *upon* the competence demonstrated by the Wrights and others. The inversion posits competence *precedes* deep comprehension, not that comprehension is useless. The theory of lift (Kutta-Joukowski, Prandtl) emerged *to explain* the competence already achieved (flight) and data generated (like the Wrights' tunnel results). Comprehension then becomes a new, powerful tool *derived from* the prior competence. It doesn't negate that the *initial* competence (flight itself) was achieved without that deep theory.

  **4. Is it a Clean Fit? A Partial Fit, Suggesting a Cleaner Instance:**

  *   **The Messiness:** You're right. The Wrights' deliberate experimentation, instrumentation (tunnel), and analysis elevate it beyond "mindless" natural selection. Their *agency* and focused tinkering blur the line. The competence *is* distributed (brothers, process, machine, data).
  *   **Why it Still Confirms the Core Inversion:** Despite the agency, the *source* of their key breakthroughs (effective airfoils, 3-axis control) was iterative testing and selection (wind tunnel, glider flights) *without* prior deep comprehension. They solved the *empirical* problem of flight while the comprehending establishment failed. Langley's *comprehension* (quantitative, justificatory) without practical causal-handle grasp and without a selection mechanism tied to real flight conditions, produced non-viable aircraft.
  *   **A Cleaner Instance:** **Biological Evolution by Natural Selection.** Here, competence (e.g., a wing, an eye) emerges purely through variation + environmental selection over generations. *Zero* comprehension exists in the system (DNA, organisms, environment). The "grasp" (if any) comes much later, *only* in the minds of biologists studying the *fait accompli*. The Wrights had intentionality; evolution does not. **Artificial Neural Networks (ANNs)** also fit cleanly: competence (image recognition, game playing) emerges from training data + optimization algorithms. The ANN has no quantitative-predictive, causal-handle, or justificatory grasp of *why* it works internally; that comprehension (interpretability) is a separate, hard challenge for humans *after* the competence is achieved.

  **Inversion's Core Holds:** The Wright episode powerfully illustrates that practical flight *competence* (achieved via iterative selection on empirical feedback) emerged *before* and largely *enabled* the deep aerodynamic *comprehension* that followed. The establishment's existing "comprehension" proved insufficient and even misleading without the right selection process tied to the actual environment (controlled flight). The Wrights' localized quantitative corrections and later theory's power are *products* of the competence-first process, not its contradiction.
