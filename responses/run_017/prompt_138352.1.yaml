prompt: |-
  I sit on my town's planning board (small New England town, basically all single-family zoning) and "housing is a human right" gets said at nearly every meeting — the genuinely annoying part is that it gets said by people arguing for opposite things. Last month a neighbors' group opposing a 12-unit building used it: housing is a human right, so the town has a duty to make sure whatever gets built is permanently affordable, and until it is we shouldn't approve market-rate units that'll just bid up rents around them. Then a YIMBY guy used the same seven words to argue we have to legalize apartments everywhere, and that requiring affordability covenants is itself a rights violation, since it makes new homes illegal unless somebody subsidizes them. I'm sure at least one of them is leaning on the slogan for something it doesn't say, but I can't say which, and that's a problem because I have to vote on this stuff.

  So: lay out the distinct precise claims that sentence could be making. Not "different people mean different things" hand-waving — an actual menu of readings I can line up next to each other, and for each one, whether it's trivial, substantive and defensible, or false. The axes I keep getting tangled on:

  - Is it a right against the state, against whoever owns land, or against my town specifically? Does anything change if the duty-bearer is a legislature rather than a court?
  - Is it a right to be handed a unit, a right that nobody arbitrarily deprive you of shelter, or a right to have a say in how the place you live gets produced — I think that last one (the "right to the city" version) is a different animal entirely and shouldn't be lumped in, but tell me if I'm wrong.
  - Who holds it: people already living here, anyone who might want to move here, or households in general? And is it a right against being displaced or against being excluded, because those come apart.
  - Does it come with a remedy, and does it specify a level — enough to not be homeless, enough to live in this particular neighborhood, enough to stay put?

  The part I actually need: for each reading, would it support the neighbors' conclusion, the YIMBY's, both, or neither? My suspicion is that most readings are compatible with basically any policy and so aren't doing the work either speaker thinks they're doing, and I want to know which readings would have to be true for the sentence to actually settle something. Also tell me which reading each of my two speakers probably had in mind, and if it helps, say in the old claim-right / privilege / immunity vocabulary what kind of entitlement each reading is positing — I think "right" is doing three different jobs in that one sentence and that's where the confusion lives.

  No citations or reading lists, I've read plenty of op-eds. Just clean up the distinctions.
reasoning: |-
  Okay, let me tackle this planning board member's problem. They're grappling with the phrase "housing is a human right" being used by opposing factions in zoning debates, and need clarity on what that actually means in practice.

  First, I need to unpack the multiple dimensions of this "right" claim. The core frustration comes from the same slogan justifying contradictory policies - one side using it to block market-rate development until affordability guarantees exist, the other claiming it mandates removing zoning restrictions entirely. 

  The key is recognizing that "human right" here functions as what philosophers call an "incomplete predicate" - it demands specification across several axes to become actionable. I'll map those axes systematically: 

  Who owes the duty? (state vs private actors)
  What's the nature of the entitlement? (provision vs protection vs participation)
  Who holds the right? (current residents vs potential residents)
  What's the required remedy? (minimum shelter vs neighborhood continuity)

  Crucially, I'll analyze how each combination answers their pressing question: would this interpretation support the anti-development neighbors, the pro-development YIMBY, both, or neither? 

  For example, if we interpret it as a "negative right against displacement," that leans toward the neighbors' position by prioritizing existing residents' security. But if it's a "positive right to access opportunity," that aligns with YIMBY arguments for abundant housing supply. The most policy-neutral interpretation might be the "right to non-arbitrary exclusion," which simply demands zoning not be discriminatory without necessarily prescribing density.

  The planning board member's intuition about remedy specification is spot-on - without defining what level of housing is guaranteed (survival shelter vs neighborhood preservation), the slogan remains rhetorically powerful but operationally hollow. I'll emphasize where different interpretations actually constrain policy choices versus where they remain compatible with various approaches.

  By the end, we should see that both speakers are selectively emphasizing interpretations that serve their policy goals while ignoring others, and that the slogan alone can't resolve their dispute without additional premises about scarcity, market dynamics, or municipal obligations.
answer: |-
  Here’s a clear breakdown of the distinct claims behind "housing is a human right," structured to answer your specific questions. Each reading is evaluated for coherence, policy implications, and alignment with the arguments you’ve heard.  

  ### **1. The "Negative Liberty" Reading**  
  - **Claim**: A right against arbitrary deprivation of existing shelter by the state (e.g., eviction without due process, demolition without relocation).  
  - **Duty-bearer**: The state (courts/legislatures must not actively make you homeless).  
  - **Who holds it?**: Current occupants (against displacement).  
  - **Remedy/Level**: Protection from homelessness due to state action; no specific quality standard.  
  - **Entitlement type**: **Immunity** (exemption from harmful state interference).  
  - **Policy Implications**:  
    - Supports eviction moratoria, relocation assistance.  
    - *Neighbors' argument?* No (they oppose new supply).  
    - *YIMBY argument?* No (not about supply expansion).  
  - **Verdict**: **Substantive/defensible** (aligned with due process rights), but irrelevant to *new* development.  

  ---

  ### **2. The "Minimal Positive Provision" Reading**  
  - **Claim**: A right to state-guaranteed *basic* shelter (survival standard).  
  - **Duty-bearer**: The state (via legislature allocating funds/vouchers).  
  - **Who holds it?**: Anyone within jurisdiction, including unhoused people (against exclusion from survival needs).  
  - **Remedy/Level**: Emergency shelter/tiny homes/vouchers – "not sleeping rough."  
  - **Entitlement type**: **Claim-right** (others must provide X if you lack it).  
  - **Policy Implications**:  
    - Supports homeless shelters, housing vouchers.  
    - *Neighbors' argument?* Weak (their demand for *permanent* affordability exceeds "minimal").  
    - *YIMBY argument?* No (abundant market-rate supply isn’t required).  
  - **Verdict**: **Substantive/defensible** (many constitutions include this), but doesn’t mandate zoning changes.  

  ---

  ### **3. The "Non-Discriminatory Access" Reading**  
  - **Claim**: A right to compete for existing housing without discrimination (race, income source, etc.).  
  - **Duty-bearer**: Landlords/developers (regulated by state).  
  - **Who holds it?**: Anyone seeking housing (against exclusion via bias).  
  - **Remedy/Level**: Access to *available* units, not creation of new ones.  
  - **Entitlement type**: **Privilege** (freedom to participate in market) + **Immunity** (from discriminatory barriers).  
  - **Policy Implications**:  
    - Supports fair housing laws, bans on income-source discrimination.  
    - *Neighbors' argument?* No (they restrict supply).  
    - *YIMBY argument?* Indirectly (if zoning is seen as discriminatory class barrier).  
  - **Verdict**: **Substantive/defensible**, but doesn’t compel new construction.  

  ---

  ### **4. The "Affordable Community Continuity" Reading**  
  - **Claim**: A right to remain in *your specific community* without displacement by market forces.  
  - **Duty-bearer**: The state (via affordability mandates, rent control).  
  - **Who holds it?**: Current residents (against economic exclusion).  
  - **Remedy/Level**: Price controls or subsidized units in-place.  
  - **Entitlement type**: **Claim-right** (to a specific neighborhood/price).  
  - **Policy Implications**:  
    - Supports rent control, mandatory inclusionary zoning.  
    - *Neighbors' argument?* **Yes** (blocks market-rate units without affordability guarantees).  
    - *YIMBY argument?* No (they oppose affordability mandates as supply constraints).  
  - **Verdict**: **Substantive but controversial** (prioritizes incumbents over newcomers; may reduce supply).  

  ---

  ### **5. The "Abundant Supply" Reading**  
  - **Claim**: A right to a housing market where competition drives down costs via ample supply.  
  - **Duty-bearer**: The state (must legalize sufficient housing types/density).  
  - **Who holds it?**: All potential residents (against exclusion via artificial scarcity).  
  - **Remedy/Level**: Deregulation to allow market-rate construction until prices stabilize affordably.  
  - **Entitlement type**: **Privilege** (freedom to build/buy) + **Immunity** (from supply constraints).  
  - **Policy Implications**:  
    - Supports zoning reform, bans on density caps.  
    - *Neighbors' argument?* No (they restrict supply).  
    - *YIMBY argument?* **Yes** (mandates removing barriers to construction).  
  - **Verdict**: **Defensible if scarcity is state-created** (e.g., zoning bans apartments), but assumes market solutions suffice.  

  ---

  ### **6. The "Right to the City" Reading**  
  - **Claim**: A right to participate democratically in shaping housing policy/development.  
  - **Duty-bearer**: The state (must include residents in planning).  
  - **Who holds it?**: Current residents (against exclusion from decisions).  
  - **Remedy/Level**: Community review, veto points.  
  - **Entitlement type**: **Power** (to co-determine rules).  
  - **Policy Implications**:  
    - Supports community input, discretionary approvals.  
    - *Neighbors' argument?* **Yes** (invokes "duty to ensure affordability" via process).  
    - *YIMBY argument?* No (they see community input as NIMBY veto).  
  - **Verdict**: **Substantive** (procedural fairness), but can conflict with supply goals.  

  ---

  ### **Your Speakers' Likely Readings**  
  - **The Neighbors**: **#4 (Affordable Community Continuity)** + **#6 (Right to the City)**.  
    - Their logic: Rights require preventing change that threatens incumbents' access.  
  - **The YIMBY**: **#5 (Abundant Supply)** + **#3 (Non-Discriminatory Access)**.  
    - Their logic: Rights require removing state barriers to opportunity.  

  ---

  ### **Key Conclusions**  
  1. **Neither side "wins" on rights alone**:  
     - **#1–3** don’t compel either policy.  
     - **#4** supports neighbors only if you accept a right to *neighborhood-specific* affordability.  
     - **#5** supports YIMBYs only if you accept a right to *market-abundance*.  
     - Both #4 and #5 are contested expansions beyond core rights.  

  2. **The slogan doesn’t settle anything**:  
     - **Rights imply duties, but not specific policies**. E.g., a right to food isn’t violated if the state doesn’t run grocery stores; it may just forbid blocking farms. Similarly, housing rights *could* mean vouchers (#2) instead of zoning reform (#5).  

  3. **What would force a policy outcome?**  
     - Only if you accept **both**:  
       - Housing is a **positive right** (#2, #4), AND  
       - The state must fulfill it via **supply expansion** (rejecting #2’s minimalism), AND  
       - Market-rate supply **harms rights** by displacing people (neighbors’ claim) or **advances rights** by lowering costs (YIMBY claim).  
     - This depends on **empirical disputes** (does market-rate construction raise nearby rents? Do affordability mandates suppress supply?).  

  **Practical Takeaway**: When you hear "housing is a human right," ask:  
  - *"Whose duty is it?"* → State vs. private actors?  
  - *"What exactly are we required to do/not do?"* → Preserve status quo? Build shelters? Deregulate?  
  - *"Who benefits?"* → Current residents? Future residents?  
  The phrase alone can’t answer these—it’s a moral flag planted on policy terrain. Vote on the evidence of what achieves *your community’s goals* (equity, growth, stability), not the slogan.
