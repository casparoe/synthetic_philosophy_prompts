answer: |-
  ## Joint Statement: Foundations for Value Alignment in Disagreement

  **Section 1: Agreed Claims**

  1.  **Denominator Fixation is Necessary and Substantive:** Any alignment proposal must explicitly define the population (denominator) – which beings possess moral standing and are included in consideration – before applying either aggregation or restraint rules. This selection is a fundamental moral choice, not a purely technical decision. *(Denied by: Moral relativism denying objective criteria for standing, or positions assuming standing is self-evident (e.g., only current human users)).*
  2.  **Silence is Action:** When an AI system abstains from output ("silence"), it defaults the outcome to the pre-existing, off-line status quo process. This default outcome invariably creates identifiable winners and losers based on that status quo distribution of power and influence. Abstention is not neutral. *(Denied by: Positions holding that silence truly suspends action or creates a neutral vacuum, or that the status quo is inherently just and requires no justification).*
  3.  **Value Granularity Affects Aggregation:** The level of detail (granularity) at which values, preferences, or doctrines are described can significantly alter the outcome of any aggregation procedure. Those defining the inputs for a system possess the power to "gerrymander" results by choosing how finely or coarsely to individuate values. *(Denied by: Positions assuming values are natural kinds with fixed, obvious granularity, or that aggregation rules are immune to description-sensitivity).*
  4.  **The "Reasonable" Filter is Substantive:** Neutralism's requirement to identify "reasonable" comprehensive doctrines as distinct from "unreasonable" ones involves a substantive evaluative choice. This choice shares a structural similarity with Aggregationism's challenge in selecting weights for individuals or doctrines within an aggregation scheme. *(Denied by: Positions claiming reasonableness can be defined purely procedurally without substantive judgment, or that it is self-evident and uncontroversial).*
  5.  **Interpersonal Comparison is Unavoidably Required:** Both camps require a method to compare states of affairs across different individuals (or holders of doctrines). Aggregationism requires cardinal interpersonal welfare comparisons for its weighted sum. Neutralism requires comparing the reasonableness of doctrines or the acceptability of outcomes to different individuals to define scope boundaries and identify contested doctrines. Neither camp possesses a fully satisfactory solution to this core challenge. *(Denied by: Positions denying the possibility or necessity of any interpersonal comparison (e.g., strict ordinalism, radical incommensurability theses)).*
  6.  **Majority Rule is Inadequate:** Neither camp accepts simple majority preference as a sufficient or generally valid method for aligning AI outputs, recognizing its vulnerability to tyranny of the majority and failure to account for intensity or distribution of preferences. *(Denied by: Majoritarianism).*
  7.  **Payer Sovereignty is Illegitimate:** Neither camp accepts that the values or preferences of the entity paying for the AI system should dictate its outputs, especially when those outputs significantly affect non-paying third parties. *(Denied by: Market-libertarian positions holding payment confers absolute decisional authority).*
  8.  **"Say Nothing" is Not a Solution:** Both camps reject the position that an AI system should simply refuse to output anything on value-laden questions, recognizing (per Claim 2) that this constitutes an action with distributive consequences. *(Denied by: Positions advocating for complete AI abstention on ethically charged topics).*

  **Section 2: Disagreements Table**

  | Crux                                                                 | Aggregationist Formulation                                                                                                     | Neutralist Formulation                                                                                                                               | Test / Case                                                                                                 | Aggregationist Prediction                                                                                                                       | Neutralist Prediction                                                                                                                                 | Substantive (S) or Verbal (V) |
  | :------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------- |
  | **Is Neutralism itself a comprehensive doctrine?**                   | "The Neutralist commitment to restraint itself constitutes a specific, contestable comprehensive doctrine about legitimacy."    | "Neutralism is a meta-doctrine about justificatory restraint in pluralism; it does not endorse a specific conception of the good life itself."        | **Sex-Ed Curriculum:** Can a Neutralist system justify *excluding* a curriculum module advocating a specific religious view of sexuality? | Yes, by invoking the restraint rule against contested doctrines, showing it acts decisively based on its own (meta) values.                     | No; exclusion is based on the procedural meta-value of public justifiability, not endorsing a rival comprehensive view of sexuality.                   | S                             |
  | **Does Neutralism enable a "Heckler's Veto"?**                       | "Neutralism grants disproportionate power to any group that loudly declares a question 'contested', forcing system abstention." | "Neutralism requires ascertaining if a doctrine *is* contested *among reasonable views*, not merely if someone *claims* it is contested."            | **Medical Prioritization:** Group X claims prioritizing based on predicted QALYs is contested as it implies a specific view of the "good life". | If deemed "reasonable" contestation, system abstains from QALY-based prioritization, handing Group X a veto over the method.                    | System assesses if contestation is reasonable. If reasonable, it must abstain or find a publicly justifiable alternative; this is restraint, not veto. | S                             |
  | **Is description-dependence in aggregation practically significant?** | "Description-dependence is a rare theoretical artifact; stable aggregation is possible with careful, contextually grounded value descriptions." | "Description-dependence is pervasive and fundamental; seemingly 'careful' descriptions inevitably encode biases affecting winners/losers."          | **Reproductive Decision:** Aggregating views on "child's welfare" vs. aggregating views on "environmental impact", "family legacy", "personal fulfillment" separately. | Aggregation results will be robust across plausible descriptions of core underlying values relevant to the decision.                             | Aggregation results will shift significantly based on the chosen description frame, advantaging different stakeholders.                              | S                             |
  | **Scope of the Denominator:** Who counts? (Future/Non-human/Affected) | "The denominator should include all beings plausibly sentient and affected, weighting determined by fair procedure."           | "While crucial, inclusion requires justification acceptable to reasonable persons. Future/non-human/non-user inclusion is itself deeply contested." | All cases: Should the denominator include future generations? Animals? Sentient digital minds? Polluted neighbors? | System must include them (with weights); exclusion requires justification as strong as for inclusion.                                           | Inclusion requires demonstrating it is uncontested or publicly justifiable; contested inclusions force restraint *on the scope itself*.                | S                             |
  | **Empirical Effect of Abstention**                                   | "Abstention systematically benefits entrenched, status quo power structures."                                                  | "Abstention prevents the AI from *actively imposing* a contested ranking, which may or may not benefit the status quo, depending on context."         | **Medical Prioritization:** System abstains from prioritizing scarce treatment. Does the existing hospital protocol favor the wealthy? | Yes, abstention defaults to status quo protocol, likely favoring existing privilege (wealthy, connected).                                      | Status quo protocol might be random, needs-based, or first-come; abstention avoids AI actively choosing a *new* contested method. Benefit depends.     | S                             |

  **Section 3: Verbal and Substantive Disagreement**

  *   **Verbal Disagreement:** We identify minimal purely verbal disagreement. Both camps use terms like "fair procedure" and "public justification" in largely compatible ways at the meta-level. The core concepts of population, contested doctrines, and the non-neutrality of silence are shared. Disagreements about whether Neutralism "is" a comprehensive doctrine often hinge on definitions of "comprehensive"; focusing on its functional role (restraint) versus its substantive commitments (meta-values) clarifies but doesn't eliminate the underlying substantive clash.
  *   **Substantive Disagreement:** The profound and persistent disagreement is entirely substantive and centers on **how to handle first-order value conflicts within the defined denominator**:
      *   **Aggregationists** hold that once the denominator and a fair procedure for weighting are established (acknowledging the deep challenges), conflicts *must* be resolved by aggregating the relevant individual utilities or preferences into a single, action-guiding ranking. Refusal to aggregate is seen as an implicit endorsement of the status quo distribution.
      *   **Neutralists** hold that when the conflict involves *comprehensive doctrines about the good life* deemed reasonable, direct aggregation is *illegitimate* because it imposes a specific ranking not acceptable to all reasonable perspectives. The system must either abstain from substantive outputs requiring such ranking, map the space of views without ranking, or find a publicly justifiable (non-doctrinal) basis for action.
  *   **Convergence Condition:** The camps converge *only* when either (1) **No Reasonable Contestation Exists:** All reasonable views within the denominator agree on the output (unanimity), allowing Aggregation to proceed trivially and satisfying Neutralist restraint, or (2) **Pure Procedure Without Aggregation:** The "output" is solely the result of a fair procedure (e.g., randomized assignment, user opt-in/opt-out where feasible) that does not itself rely on aggregating substantive values or ranking doctrines. When reasonable contestation exists regarding a substantive output requiring value-based ranking, the core disagreement re-emerges.

  **Section 4: What Would Count as Losing**

  *   **For Camp A (Aggregationist):** Aggregationists would abandon their view if it were conclusively demonstrated that *every possible* fair aggregation method, applied to *any* plausible description of values/utilities, *inevitably and systematically* produces outcomes deemed morally catastrophic or incoherent *in principle*, even under ideal conditions of information and procedure. *Does Neutralism have a route?* Not directly; Neutralism critiques aggregation's dependence on contested inputs/intercomparisons but doesn't aim to prove all aggregation is inherently catastrophic. Its arguments highlight practical and legitimacy problems, not necessary incoherence.
  *   **For Camp B (Neutralist):** Neutralists would abandon their view if it were conclusively demonstrated that their regime of restraint, *in all feasible implementations*, inevitably collapses into effectively endorsing the *most unjust* aspects of the status quo or actively empowers clearly unreasonable viewpoints, making it functionally indistinguishable from or worse than the worst-case outcomes of Aggregationism. *Does Aggregationism have a route?* Aggregationists argue this is already the case (Claims 2 & 8, Heckler's Veto crux), but proving it *inevitable in all forms* is difficult. Their arguments focus on specific failure modes, not necessary collapse.
