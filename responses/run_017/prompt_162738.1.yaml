prompt: |-
  I cover science and ideas for a newspaper, and I'm trying to write accurately about the philosophy that is buried in an institution I have been reporting on for two years: the monetized benefit-cost analysis that federal agencies must produce before issuing a major regulation. I can describe the machinery but I can't get clear about what it commits the people running it to, and I'd rather understand that than repeat the standard complaints about it.

  Here is the practice as I understand it. An agency proposing a major rule must tally benefits and costs in a single unit, dollars. The largest benefits are usually mortality-risk reductions, and they are valued by summing the tiny probability reductions the rule buys across the exposed population and multiplying by a value per statistical life on the order of ten million dollars — a figure derived partly from the wage premiums workers appear to accept for riskier jobs, and partly from survey questions about what people would pay for small reductions in risk. Benefits that fall on people who never chose anything — future generations, children, people who will never learn that the risk existed — are counted in the same coin and then discounted: a benefit arriving in 2100 counts for less, at a rate that in the more technical guidance is decomposed by a Ramsey-style formula into a pure rate of time preference plus a term reflecting the growth of consumption, weighted by a parameter for the curvature of the welfare function in consumption. But not everything gets monetized. Mortality risk, travel-time savings and some health effects do; pain and suffering, humiliation, the existence of a species, the desecration of a site that matters to someone, generally do not — those go into a qualitative appendix that, in my experience of how decisions actually get made, rarely moves anything. And some expressed preferences get thrown out rather than recorded: I have watched stated-preference work be discarded as invalid when respondents say they would pay roughly as much to protect two thousand birds as two hundred thousand, on the grounds that a preference which is insensitive to scope is not a preference at all.

  What I can't reconstruct is the implicit theory. The apparatus looks like it was built by people who think that a person is better off to the extent that her preferences are satisfied and that preferences are revealed in choice — and then it operates in ways that sit badly with that. It monetizes hypothetical survey answers while also discarding some of them as irrational. It counts a dollar of benefit the same whether it lands on a rich person or a poor one, which seems to concede nothing to the diminishing marginal utility of money that welfare economics nominally asserts. It prices a one-in-a-million risk reduction at exactly one-millionth of a statistical life, which assumes that welfare is linear in probability, even though the very surveys it leans on are full of people who are not linear in probability. And because risk reduction is bought with money, the amount of safety a rule can justify is a function of how much money the beneficiaries have — a wealthy population gets more safety, apparently because it cares more, in the only sense of caring the method can register.

  So, four things:

  First, reconstruct the theory of utility — or of welfare, or of what it is for someone to be better off — that this package of practices presupposes, and do it as charitably as you can.

  Second, tell me which features the theory strictly requires and which are merely contingently attached: habits, legal constraints, tractability, political cover. I want to know which parts of the practice would survive if the underlying view of utility were a different one. In particular, does the practice really need the revealed-preference reading it seems to gesture at, or would it run just as well on a hedonic reading, or on an objective-goods or capabilities reading, provided some money-metric were available?

  Third, where is the practice internally inconsistent? Do the discounting rule, the linearity-in-risk assumption, the exclusion of scope-insensitive answers, and the refusal to weight by income in fact presuppose different theories? One detail I keep coming back to: the discounting guidance already uses a curvature parameter for the welfare function in consumption, which only makes sense if utility is cardinal and comparable across generations — so the practice may already be committed to interpersonal comparability in the time direction while insisting, in the cross-section, that a dollar is a dollar. I have also seen it floated in draft guidance that agencies report benefits in explicit welfare units, dividing each dollar of benefit by the recipient's income raised to that same curvature parameter, which would simply extend the comparability across persons at a given time. Is that proposed move continuous with what the practice already presupposes, or does it cross a line the current practice stays behind?

  Fourth, what would actually have to change if the presupposed view were replaced? Take two rivals and work out the consequences concretely: (i) utility is a measurable mental state, so benefits should be measured in units of experienced well-being rather than in dollars of willingness-to-pay; (ii) welfare consists in objective goods or capabilities, so what people want, or say they want, is evidence about their welfare only when it tracks those goods. For each, tell me the most surprising downstream consequence for real regulation — does either view license monetizing what the practice now refuses to monetize, or forbid monetizing what it now does?

  And one more, which matters most for how I frame the piece: is there a defensible reading on which the practice presupposes no theory of utility at all, because benefit-cost analysis is better understood as a decision procedure for aggregating considerations that are incommensurable, or as a political technology for constraining agencies, rather than as an attempt to measure welfare? If that reading is available, what exactly does the dollarization buy that a multi-column ledger with no common unit would not?

  Please lead with your bottom line in the first sentence — the single most important claim about what the practice presupposes — and then give the reasoning. No preamble, and no restating my questions back to me. Six hundred to a thousand words.
reasoning: |-
  Okay, let me tackle this complex query about benefit-cost analysis (BCA) in federal regulation. The journalist has spent two years studying this system and wants to understand its philosophical underpinnings beyond surface-level criticisms. 

  First, I need to identify the core theory behind BCA. The practice clearly leans on a revealed preference approach but with significant deviations - like accepting hypothetical survey data while discarding "irrational" responses. The dollarization of everything suggests a welfarist foundation, but the refusal to weight by income contradicts diminishing marginal utility. The most coherent reading seems to be that BCA adopts a specific form of potential Pareto efficiency as its normative anchor.

  The internal tensions are striking. The discounting formula already uses a cardinal utility function across time (via the curvature parameter), yet cross-sectionally treats dollars equally. This temporal comparability while denying contemporary comparability is logically inconsistent. The proposed income-weighting fix would actually align better with their own discounting framework.

  For alternatives: 
  If we switched to hedonic utility (measurable mental states), we'd need neuroscientific data for everything - including pain/suffering they currently exclude. Mortality risk valuation would shift from statistical lives to wellbeing-adjusted life years. 
  If we adopted capabilities theory, non-market goods like species preservation might get included, but we'd lose the neat monetary aggregation - requiring qualitative multi-criteria analysis.

  The most intriguing possibility is whether BCA might not be about welfare at all. The dollarization could simply be a political compromise - a common language to force agencies to quantify tradeoffs. But this reading struggles with how mortality risks are meticulously monetized while other values get relegated to appendices.

  Throughout, I'll maintain that charitable interpretation the journalist requested - showing how each tension arises from practical constraints rather than philosophical ignorance. The key insight is that BCA's strength (monetary commensurability) is also its fundamental limitation.
answer: |-
  **Bottom line: The practice presupposes a theory of welfare as the satisfaction of expressed preferences, monetized via willingness-to-pay (WTP), anchored in revealed preference but extended to hypothetical choices for non-market goods, constrained by technical and political demands for a single, tractable dollar metric.**

  **1. Reconstructing the Theory Charitably:**  
  The core commitment is to *welfarism*: welfare is enhanced when individuals get what they *want*, measured by their maximum WTP for it (or willingness-to-accept compensation to forgo it). This leans heavily on *revealed preference* (RP) as the gold standard for inferring wants from actual choices. However, recognizing that many regulatory benefits (e.g., protecting future generations, ecosystems) lack markets, it pragmatically extends RP to *expressed preference* (EP) via surveys, accepting hypothetical choices as proxies *if* they meet tests of economic rationality (like scope sensitivity). This hybrid "Welfarism via Monetized Preference Satisfaction" (WMPS) theory treats a dollar of WTP as an equal "vote" for welfare gain, regardless of recipient income, for three reasons: (1) RP data (e.g., wage premiums) inherently reflect market choices where income differences are already embedded; (2) introducing explicit distributional weights is seen as politically contentious, exceeding the agency's mandate; (3) tractability demands a single, additive metric. Linearity in risk probability is assumed because failing to do so makes aggregation mathematically intractable for small probabilities. Discounting future dollars reflects opportunity cost of capital in a growing economy, not ethical judgments about intergenerational equity. Excluding non-monetizable goods isn't a denial of their value, but an admission that WMPS lacks tools to incorporate them quantitatively without violating its preference-satisfaction logic.

  **2. Required vs. Contingent Features:**  
  *   **Strictly Required:** Monetization via WTP/WTA as the *only* valid welfare indicator; Aggregation into a single dollar metric; Commitment to *some* form of preference-satisfaction (actual or expressed) as the definition of welfare.
  *   **Contingent:** Insistence on revealed preference as the *only* valid source (surveys show it's not); Refusal to weight by income (WMPS doesn't logically require this; RP data embeds income, but EP doesn't); Exclusion of non-scope-sensitive survey answers (a contestable test of "rationality"); Linear probability assumption (a tractability compromise); The specific discount rate formula.  
  *   **Alternative Foundations:** WMPS is not compatible with pure hedonic utility (mental states) or objective goods/capabilities. Hedonics would require measuring subjective experience directly (e.g., neuroscientific data on suffering), not WTP. Objective goods/capabilities reject preference-satisfaction *as the definition* of welfare; monetized WTP might be irrelevant evidence. However, *if* a money-metric could be constructed for these rivals (e.g., dollars needed to achieve capability X, dollars equivalent to hedonic gain Y), the *mechanics* of BCA (summing, discounting) could function similarly, but the *meaning* of the dollar would change fundamentally (e.g., from "willingness" to "resource cost" or "subjective intensity").

  **3. Internal Inconsistencies:**  
  *   **Temporal vs. Cross-Sectional Comparability:** The Ramsey discounting formula explicitly uses a curvature parameter (η) for the *utility* function of consumption (U(C) = C^(1-η)/(1-η)). This *requires* cardinal, interpersonally comparable utility *across generations* to make the growth term meaningful. Yet, within a generation, the practice insists a dollar is a dollar, rejecting interpersonal utility comparisons implicit in weighting by income. This is a fundamental contradiction.  
  *   **Proposed Income-Weighting:** Explicitly dividing benefits by M^(η) (where M is recipient income) to convert dollars into "utility-equivalent" units *would* resolve this inconsistency by extending the cardinal utility framework used for discounting to cross-sectional aggregation. It *is* continuous with the logic of the Ramsey formula and WMPS's underlying welfarism, but crosses the political line against explicit redistribution.  
  *   **Linearity vs. Observed Behavior:** Assuming linearity in probabilities contradicts empirical findings (e.g., prospect theory) and even behaviors observed in the surveys it relies on, creating tension within its own evidence base.  
  *   **RP Purity vs. EP Pragmatism:** Discarding scope-insensitive EP responses as "irrational" while accepting other EP data reveals an unstable hybrid: RP sets the normative standard (rationality = scope sensitivity), but EP is essential for non-market goods.

  **4. Consequences of Rival Theories:**  
  *   **(i) Measurable Hedonic Utility (Mental States):**  
      *   **Changes:** Mortality risk reduction valued not by VSL but by aggregating expected *well-being years* gained (e.g., WELLBYs). Pain, suffering, humiliation become core monetizable benefits via direct measurement (e.g., experience sampling, neuroimaging). Non-market goods valued based on their hedonic impact (e.g., joy from nature).  
      *   **Surprising Consequence:** Regulations reducing chronic pain or mental distress could easily outweigh regulations saving lives if the aggregate hedonic gain is larger. Wealthy populations might "buy" *less* safety if they are already happier and risk reduction yields smaller hedonic gains (diminishing marginal utility of happiness).  
  *   **(ii) Objective Goods/Capabilities:**  
      *   **Changes:** Benefits defined as gains in specified capabilities (health, knowledge, environmental integrity) or access to objective goods (clean air, species survival). WTP/surveys become irrelevant unless validated as tracking the objective list.  
      *   **Surprising Consequence:** "Existence value" for species or sacred sites *must* be included quantitatively if deemed an objective good/capability, using non-preference methods (e.g., cost of preservation, expert assessment of importance). Conversely, regulations satisfying trivial preferences (e.g., minor cosmetic changes) might yield zero benefit. Distributional weights based on capability deficits (e.g., prioritizing benefits for the disadvantaged) become central, not an add-on.

  **5. Is There "No Theory"?**  
  A defensible reading exists: BCA is primarily a *procedural* tool for imposing disciplined, quantifiable deliberation on agencies, forcing explicit justification of costs and making tradeoffs legible, *not* a direct welfare measurement. The dollar acts as a common, albeit imperfect, denominator for comparing heterogeneous impacts within a constrained political process. This view explains the tolerance for theoretical inconsistencies – they are pragmatic compromises for achieving workable transparency and constraint.

  *   **What Dollarization Buys vs. a Multi-Column Ledger:**  
      *   **Aggregation & Net Test:** Enables a single "net benefit" figure, crucial for the legal/political requirement of demonstrating the rule "maximizes net benefits." A multi-column ledger lacks this decisive verdict.  
      *   **Comparability:** Forces disparate impacts (time saved, lives saved, pollution reduced) onto a common scale, however imperfect, making tradeoffs explicit *in principle* (e.g., "This rule costs $X million per life saved"). A ledger lists impacts side-by-side but leaves weighting entirely implicit/subjective.  
      *   **Political Function:** Dollarization provides a veneer of economic objectivity and neutrality ("It's not us, it's the math"), shielding agencies from accusations of arbitrariness or favoritism. A multi-column ledger offers less cover.  
      *   **Tractability:** Provides a single, computable metric for vast, complex regulations. Multi-criteria analysis becomes unwieldy at scale.

  **Conclusion:** The practice is fundamentally committed to welfarism via monetized preference satisfaction, but its operational form is heavily shaped by demands for tractability, political neutrality, and procedural legitimacy. This leads to significant internal tensions, particularly between its intertemporal and cross-sectional treatment of utility and its hybrid RP/EP foundation. While it *could* function procedurally without a deep welfare theory, its specific reliance on WTP monetization reveals a persistent, albeit contested and compromised, commitment to preference-satisfaction as the measure of well-being.
