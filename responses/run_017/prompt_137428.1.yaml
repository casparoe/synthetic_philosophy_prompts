answer: |-
  Here’s a complete exam package focusing on the "zero-cost delay" paradox in akrasia, designed to push students beyond standard hyperbolic discounting explanations:

  **Question: The Trivial Button Paradox (20 marks; 30 minutes)**  
  > *Zara decides on January 1st that she wants her smartphone display in greyscale to reduce distraction. Her phone has a one-tap accessibility shortcut to enable this instantly. Enabling greyscale aligns with her long-term goal of focused work. Yet, she sees the unused shortcut daily for 31 days, only activating it on February 1st. When asked why, she says, "I just kept forgetting to tap it, even though it took zero effort."*  
  > **Using this case, critically evaluate whether standard models of hyperbolic discounting and weakness of the will (akrasia) can adequately explain Zara's behavior. If they fall short, propose and justify a conceptual extension (e.g., attention, salience, or status quo bias). Finally, argue whether the behavior, once explained, still qualifies as genuine weakness of will.**

  ---

  **Model Answer (550 words):**  
  Zara’s case presents a challenge to standard hyperbolic discounting (HD) models of akrasia. HD explains why agents choose smaller-sooner rewards over larger-later rewards due to time-inconsistent preferences driven by present bias (βδ-modelling). Here, β disproportionately discounts future utility, causing preference reversal. However, Zara faces **no tangible delay or effort cost**: tapping the button is instant, free, and immediately advances her goal. HD requires a *tradeoff* between present effort/cost and future benefit, but here there is no "cost" to discount—rendering βδ models incoherent for this scenario.  

  Standard akrasia frameworks (e.g., Davidson’s divided mind theory) also struggle. Akrasia classically involves acting against one’s better judgment due to overpowering proximal desires (e.g., eating cake despite a diet). But Zara experiences no countervailing impulse or temptation *for* color display; her delay lacks motivational conflict. Describing this as "succumbing to inaction" stretches traditional definitions without identifying what *positive* desire overrode her intention.  

  To explain Zara, we must incorporate **cognitive economics of attention**. Tapping the button requires not effort, but *attentional capture* at the right moment. Human cognition filters tasks by salience and urgency (Bounded Rationality). Though the action cost is zero, the *attention cost* is non-zero: Zara must notice the shortcut and contextually classify it as "actionable now" amidst competing stimuli. The button’s low salience (routine exposure dulls urgency) and lack of deadline mean it perpetually loses the attentional competition to more pressing tasks (e.g., messages, apps). This is amplified by **status quo bias**: passive inaction is cognitively "cheaper" than initiating change, even trivial change, because action requires attentional switching.  

  We might further invoke **intention-accessibility failure** (Gollwitzer). Zara forms an intention ("enable greyscale") but fails to encode an implementation cue ("when I see the shortcut"). Without environmental triggers, abstract goals decay in working memory.  

  **Does this qualify as weakness of will?** Yes, but reconceptualized. Zara exhibits a *procedural* akrasia: a failure to execute an intention despite unchanged evaluation of the goal, absent visceral temptation. Her "weakness" lies in attentional governance, not impulse regulation. If akrasia is defined as a disconnect between all-things-considered judgment and action, this fits—provided we accept that *negligible cognitive barriers* (attention allocation, cue detection) can create such gaps. However, if akrasia requires active *contrary desire* (e.g., Aristotle’s "desiring bad things"), Zara’s passive oversight may not qualify. The resolution hinges on whether akrasia’s core is *judgment-action discord* or *motivational conflict*. This case suggests expanding akrasia to include cognitive/attentional failures in intention enactment, even without opposing desires.  

  ---

  **Marking Scheme (20 marks):**  
  **A-Grade (17-20):**  
  1. Identifies HD’s core limitation: No cost/delay to discount → βδ irrelevant (3 marks)  
  2. Diagnoses missing "motivational conflict" in standard akrasia (2 marks)  
  3. Proposes attentional/salience/status quo mechanism *as distinct from effort cost* (4 marks)  
  4. Analyzes "attention cost" vs. "effort cost" cogently (3 marks)  
  5. Debates akrasia redefinition: procedural failure vs. motivational conflict (4 marks)  
  6. Clear structure, precise terminology (4 marks)  

  **B-Grade (12-16):**  
  - Correctly describes HD/akrasia basics but misapplies them (e.g., claims Zara discounts "tiny effort")  
  - Identifies attention/status quo but conflates with effort costs  
  - Superficial treatment of "is this akrasia?" (e.g., asserts "yes" without criteria)  
  - Minor inaccuracies in theory  

  **C-Grade (7-11):**  
  - Repeats HD mechanics without engaging zero-cost paradox  
  - Focuses on "forgetting" without cognitive theory  
  - No analysis of akrasia definition  

  **D/Fail (<7):**  
  - Claims hyperbolic discounting explains the delay  
  - Attributes behavior to laziness/irrationality sans theory  
  - No engagement with case specifics  

  ---

  **Distractors / Common Wrong Answers:**  
  1. *"Hyperbolic discounting explains this – Zara discounts the tiny effort of tapping."*  
     → **Rebuttal:** Tapping is instant/effortless; "tiny effort" misreads the case.  
  2. *"This is just procrastination – she delays a boring task."*  
     → **Rebuttal:** The task isn’t boring or effortful; it’s instant and beneficial.  
  3. *"She didn’t truly want greyscale – actions reveal preference."*  
     → **Rebuttal:** She consistently affirms the goal and acts Jan 1st; no evidence of changed judgment.  
  4. *"It’s a Ulysses problem – she needs a commitment device."*  
     → **Rebuttal:** Ulysses binds against future temptation; here there’s no temptation to resist.  

  This question forces engagement with the *boundaries* of HD and akrasia, demanding conceptual innovation beyond textbook definitions, while rewarding precision in distinguishing cognitive mechanisms.
