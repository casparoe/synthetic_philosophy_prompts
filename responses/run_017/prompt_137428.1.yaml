  hey so my teacher lets me write the practice exam for our grade 12 philosophy elective and I'm doing the section on weakness of will / akrasia and hyperbolic discounting. I need one in-class short answer question, 30 minutes, 20 marks, plus a model answer and a marking scheme.

  Problem is everyone in the class has already done the basic stuff — present bias, beta and delta, preference reversal over time, Ulysses and commitment devices — and I want a question where just writing that stuff down gets you a B at most. My idea is to build it around a case I sort of made up: someone puts off doing something that costs them basically nothing to do right now. Like there's a button on their screen that turns their phone greyscale and they've decided they want it on and they just don't press it for a month. Or a form that takes 40 seconds and pays them 20 bucks and they leave the tab open for three weeks. There's no real effort cost and no real delay, so there's nothing much for a discount function to bite on.

  Can you write the question (with the case in it, or a better version of the case if mine is muddled), a model answer of about 500-600 words, and a marking scheme out of 20 that says exactly which moves separate an A from a B. I want it to force people to say what the hyperbolic discounting story would have to add on to handle the zero-cost case — an attention or salience thing, a status quo thing, whatever — and whether once you add it you're still describing weakness of will or something else entirely. Also list the usual wrong answers so I can turn them into distractors. We don't have journal access so pls no reading lists or citations, just the question and the scheme. idk if attention is even the right lever, use a different one if it works better.
