answer: |-
  ## Joint Statement: Adversarial Collaboration on the Norm of Assertion  
  **Participants:** The Knowledge Camp (KC), The Reasonable-Belief Camp (RBC)  
  **Duration:** 2 Years  

  **Preamble:**  
  This document constitutes the sole output of a two-year adversarial collaboration focused on the norm governing flat-out assertion. Both camps entered seeking common ground and clarification of core disagreements, governed by strict ground rules: no appeal to prior literature or authority; all claims must be justified by cases, arguments, or predictions; cases must specify speaker/hearer evidence bases; data granularity must be fine enough to distinguish the norms. Failure to agree on a formulation of residual disagreement would constitute project failure.

  ---

  ### 1. Agreed Claims

  1.  **Central Case Coincidence:** In the vast majority of ordinary assertions (e.g., "The cat is on the mat" based on clear perception), the norms converge: KC judges them knowledgeable, RBC judges them reasonably believed. Evidential weight *against* either norm arises primarily from divergence cases.
  2.  **Moore-Paradoxicality as Data:** Utterances like "It's raining but I don't know it is" are deeply problematic. This datum needs explaining by any norm, but neither norm *alone* fully settles its status or provides the sole explanation.
  3.  **Lottery Reluctance as Data:** Hesitation to flat-out assert "Your ticket lost" based *only* on the long odds is a robust phenomenon. This datum needs explaining, but both norms offer plausible explanations, and it does not uniquely favor one.
  4.  **Distinct Verdicts:** Criticisms of assertions involve at least three distinct categories:
      *   **Improper:** The speaker violated the governing norm; criticism targets the speaker's action (e.g., asserting without evidence).
      *   **Defective:** The assertion failed the governing standard (e.g., being false/unknown), but the speaker met their epistemic duty; criticism targets the outcome, not the speaker.
      *   **Infelicitous:** The assertion misfires for non-epistemic reasons (e.g., irrelevant, rude, presupposition failure). Much recorded disagreement may stem from conflating these verdicts.
  5.  **Hedged Speech Norms Exist:** Hedges ("I think," "Probably," "According to X"), prefaced speech ("I promise that..."), and relayed speech ("They said that...") are governed by distinct norms sensitive to the qualification used. A complete account of assertion must explain how these norms relate to the norm for unhedged, flat-out assertion.
  6.  **The Practice Has a Point:** The practice of assertion serves a fundamental communicative purpose. Likely candidates include: transmitting knowledge, transmitting true beliefs, pooling evidence, or creating a shared basis for deliberation. This purpose constrains viable governing norms. *(Note: KC primarily endorses knowledge-transmission; RBC primarily endorses true-belief transmission/evidence-pooling. Agreement on existence of a point, not its identity.)*
  7.  **Truth is a Standard:** Truth is a fundamental standard by which assertions are assessed independently of the speaker's epistemic position (e.g., a false assertion is defective even if reasonably believed). *(Note: KC holds knowledge entails truth; RBC holds truth is distinct but crucial.)*
  8.  **Norms Guide Speakers & Hearers:** Governing norms provide action-guidance for speakers (when to assert) and set expectations for hearers (what they can rely upon).
  9.  **Blameworthiness Requires Culpability:** A verdict of *Improper* requires that the speaker could reasonably have been expected to meet the norm they violated. Mere defectiveness does not warrant blaming the speaker.
  10. **Gettier Cases Challenge:** Cases where S has a justified true belief that p, but does not know p (e.g., stopped clock), pose a challenge for any norm and reveal complexities in relating justification, truth, and knowledge. *(Note: KC sees these as clear failures of knowledge; RBC sees them as highlighting the gap between justification and truth/knowledge.)*
  11. **"Should" Ambiguity:** Utterances like "S shouldn't have said that" can mean either "S violated the norm" (improper) or "It would have been better if S hadn't spoken" (e.g., because it was false, tactless, or infelicitous). Disambiguating this is crucial for testing norms.
  12. **Constitutive Claims Need Testing:** Claiming a norm is "constitutive" (defines what assertion *is*) rather than merely "regulative" (governs good practice) must yield testable consequences about how the practice functions or how participants understand it; it cannot be merely stipulated. *(Note: KC believes the knowledge rule is constitutive; RBC is skeptical. Agreement that constitutive status must be demonstrable.)*
  13. **Context Affects Criticism:** The context of utterance (e.g., casual chat vs. courtroom testimony) significantly influences hearers' readiness to criticise an assertion and the severity of criticism, even for the same epistemic position.
  14. **Predictive Power Required:** A viable norm must make predictions about speaker behavior (assertion/withholding) and hearer reactions (acceptance, challenge, criticism) across varied cases.

  *(Suspected Fragile Agreement: #6 - Agreement on the *existence* of a constraining point feels stable; the wording masks deep disagreement on *what* that point is, which underlies the norm disagreement.)*

  ---

  ### 2. Disagreements Table

  | Issue                                      | Neutral Statement                                                                 | Knowledge Camp Position                                                                                                 | Reasonable-Belief Camp Position                                                                                                                                 | Substantive/Verbal? | What Would Matter                                                                                                |
  | :----------------------------------------- | :-------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------ | :--------------------------------------------------------------------------------------------------------------- |
  | **Constitutive vs. Regulative**            | Is the norm definitive of what flat-out assertion *is*, or merely a rule for its proper use? | The knowledge rule is **constitutive**. Asserting p just *is* representing oneself as knowing p. Violating it makes the act something other than assertion. | The norm is **regulative**. Assertion is defined by its force/commitment; the norm (reasonable belief) governs its proper exercise. Violating it makes it *bad* assertion, not non-assertion. | **Substantive**     | Evidence that violating the norm fundamentally changes the speech act type (e.g., becomes a different force). Evidence that participants treat unknowing assertions *as* assertions, albeit flawed. |
  | **Relevant Evidence Base**                 | Whose evidence determines if the norm is met: the speaker's personal evidence, or evidence accessible from their position? | The norm is met only if **S's personal evidence** supports knowing p. S cannot outsource the epistemic work constitutive of assertion. | The norm can be met based on **evidence legitimately accessible to S from their position** (e.g., institutional role, expertise delegation). Assertion can license reliance on this broader base. | **Substantive**     | Cases showing competent speakers readily assert based on institutional evidence they don't personally possess, and hearers accept it *as* flat-out assertion. Cases showing such assertions are treated as defective only if the *position's* evidence fails, not S's. |
  | **Contextual Invariance**                  | Is the norm fixed, or does the required epistemic standard shift with context (speaker/hearer/domain)? | The knowledge norm is **invariant**. What knowledge *is* doesn't change with context. Higher stakes demand more evidence *to know*, not a different norm. | The required justification standard is **context-sensitive** (e.g., stakes, audience needs, domain conventions). What counts as "reasonable belief" varies. | **Partly Verbal/Substantive** | Clear evidence that competent speakers *change their assertion behavior* (flat-out vs. hedge) *only* because the context changes the *required standard of evidence for belief/knowledge*, not because the norm itself changes (KC) vs. evidence that they change because the *normative threshold* changes (RBC). |
  | **Status of the Truth Rule**               | Is "Assert only what is true" a viable alternative norm?                           | "Truth Alone" is **not a genuine rival**. It collapses into either KC (if knowing is the way to reliably get truth) or leaves assertion ungoverned (no guidance *how* to get truth). Truth is the standard, not the norm. | "Truth Alone" is **not a genuine rival**. It provides no action-guidance for speakers and ignores epistemic responsibility. It collapses into RBC, as "reasonably believe" is the primary guidance for achieving truth. | **Verbal**          | Either camp demonstrating "Truth Alone" can provide unique, non-collapsible guidance or explain data KC/RBC cannot. (Both predict failure). |
  | **Role of the Practice's Point**           | Does identifying the point of assertion *settle* the norm, or merely *constrain* possible norms? | The point (knowledge transmission) **settles** the norm: only the knowledge rule reliably achieves this point and explains hearer reliance. | The point (e.g., true belief transmission, evidence pooling) **constrains** the norm. Reasonable belief best balances achieving the point (truth) with practical guidance and explains flexible reliance. | **Substantive**     | Evidence that hearers *only* rely on assertions *as if* they transmit knowledge (KC) vs. evidence they rely flexibly based on context and speaker role (RBC). Evidence a norm demonstrably better achieves the agreed point. |

  ---

  ### 3. Cruxes: Tests & Pre-Registered Predictions

  1.  **Crux: Impropriety vs. Defect in Retrospect**
      *   **Sub-Question:** Does a retrospectively false but reasonable assertion violate the norm (improper) or merely fail the truth standard (defective)?
      *   **Why Crucial:** Tests whether the norm is purely prospective (RBC) or has a truth/knowledge component (KC). Tests verdict distinctions.
      *   **Test Case:** S, a careful meteorologist, asserts "No rain today" based on standard, reliable (but imperfect) models/data available at dawn. Unexpected micro-storm causes light rain midday. Hearers planned picnics.
      *   **Measurement:** Elicit verdicts: (a) Was S's assertion *defective*? (b) Was S's assertion *improper* (should S be criticized/blamed)? (c) Was S *at fault*?
      *   **Predictions:**
          *   *KC:* (a) **Yes** (False/Unknown). (b) **No** (S knew/met norm; defect not her fault). (c) **No**.
          *   *RBC:* (a) **Yes** (False). (b) **No** (S reasonably believed; met norm; defect not her fault). (c) **No**.
      *   **Disagreement Focus:** KC & RBC predict the *same* verdicts here. Disagreement on other cases (e.g., Gettier). This case tests if participants *distinguish* defect from impropriety as predicted.

  2.  **Crux: The Spokesperson's Evidence Base**
      *   **Sub-Question:** Is the norm assessed against the speaker's personal evidence or the evidence of the office they represent?
      *   **Why Crucial:** Directly tests disagreement on the relevant evidence base (Table, Row 2).
      *   **Test Case:** S is the official spokesperson for Safety Commission. Commission investigated Bridge X via rigorous experts, concludes it's safe. S reads report, understands it, believes the experts are competent/reliable, but cannot personally check the engineering. Scenario A: S asserts *as spokesperson*, "Bridge X is safe." Scenario B: S asserts *to a friend privately*, "Bridge X is safe." (Bridge is actually unsafe due to undetected flaw).
      *   **Measurement:** Naive assessors rate: (a) Blame directed at S. (b) Perceived impropriety of S's assertion. Vary framing (emphasize role/personal capacity).
      *   **Predictions:**
          *   *KC:* High blame/impropriety in **A & B**. Norm requires *S's personal knowledge*, which S lacks. Framing irrelevant to norm violation.
          *   *RBC:* Low blame/impropriety in **A** (S reasonably believes based on *institutional evidence* legitimately accessible to her role), high in **B** (personal assertion requires personal reasonable belief; role evidence insufficient *for her personally*). Framing crucial.

  3.  **Crux: Evidentiality & Grammatical Force**
      *   **Sub-Question:** Does a single, unmarked assertive force constitutively governed by one rule predict patterns in evidential languages different from a model of graded commitments?
      *   **Why Crucial:** Tests the constitutive claim (KC) and the "single force" assumption vs. a "family of forces" view (RBC-sympathetic).
      *   **Test Case:** Study languages with obligatory evidential marking (e.g., Tibetan, Tariana). Analyze the "default" or least-marked form used for direct perception. (a) **Typology:** Is the "direct evidence" form *also* used for contexts where KC would deem assertion proper (knowledgeable) but RBC would not (e.g., justified belief without knowledge, like inference)? (b) **Corpus:** In natural speech, is the unmarked form *avoided* for reporting testimony or inference, even when the speaker has strong justification/knowledge via that source? Is hedging *still* used within evidential categories?
      *   **Predictions:**
          *   *KC:* Unmarked form will align primarily with **direct knowledge/perception**. Strong justification via testimony/inference will often still require marked forms (inferential/reportative), showing the unmarked form constitutively requires direct grounding, akin to knowledge. Hedging within categories rare.
          *   *RBC:* Unmarked form will align primarily with **high speaker certainty/reliability**, achievable via multiple sources (strong inference, reliable report *and* direct perception), reflecting a context-sensitive reasonable belief standard. Hedging within evidential categories will be common, modulating commitment strength further.

  4.  **Crux: The Audit Game - Tracking Variables**
      *   **Sub-Question:** What variable primarily drives judgments of impropriety and defect when a sender relays information?
      *   **Why Crucial:** Tests which epistemic factor (truth, justification, knowledge-source) hearers treat as governing the norm.
      *   **Test Case:** Sender S relays claim P to Decider D who acts. Manipulate **S's Basis**: (1) Direct Perception (Sees P), (2) Reliable Testimony (Trusted source told S P), (3) Distrusted Testimony (Untrusted source told S P, no specific doubt), (4) Base Rate (High statistical probability for P), (5) Gettier (JTB but not-K: e.g., sees real barn, surrounded by fakes). Manipulate **Truth** (P True/False). Measure: (a) D's/3rd party's blame of S. (b) Willingness to call S's contribution "improper". (c) Willingness to call it "defective".
      *   **Predictions:**
          *   *KC:* **Impropriety/Blame** tracks *whether S knew P*. Low in (1), (2); High in (3), (4), (5). **Defectiveness** tracks *Truth*. (a/c) High only when False.
          *   *RBC:* **Impropriety/Blame** tracks *whether S reasonably believed P*. Low in (1), (2), (5) (if J); High in (3), (4). **Defectiveness** tracks *Truth*. (a/c) High only when False. *(Note: Disagreement sharpest on (5) - KC predicts high impropriety/blame for Gettier; RBC predicts low if JTB).*

  5.  **Crux: Local Standards & Contextual Variation**
      *   **Sub-Question:** Do explicitly different local epistemic standards change the governing norm, or just the threshold for meeting an invariant norm?
      *   **Why Crucial:** Directly tests invariance (KC) vs. contextualism (RBC).
      *   **Test Case:** Contrast two contexts: (A) *Lab Meeting Rule:* "Only flat-out assert results after independent replication." (B) *Newsroom Rule:* "Flat-out assert official claims from attributed sources." Observe competent participants. (a) Readiness to flat-out assert a novel, solid-but-unreplicated finding (Lab vs. Newsroom). (b) Criticism of someone flat-out asserting such a finding in the Lab.
      *   **Predictions:**
          *   *KC:* Participants in the Lab will be **reluctant to assert** and **criticize assertion** of the novel finding *because it is not yet known*, even if highly justified. The norm (knowledge) is invariant; the local rule reflects the high bar *for knowledge* in that domain. Newsroom assertions are tacitly understood as reporting *that the official said it*, not asserting the truth directly (or are often improper if claiming direct knowledge).
          *   *RBC:* Participants in the Lab will be **reluctant to assert** and **criticize assertion** *because it violates the local reasonable belief standard*, which is higher than in the Newsroom. The *norm itself* (reasonable belief) is context-sensitive. Newsroom assertions meeting the local standard (attributed source) are proper flat-out assertions of the claim's truth.

  ---

  ### 4. What Would Move Us

  *   **Knowledge Camp:** We would reconsider our position if:
      1.  **Local Standards:** Tests like the Lab/Newsroom case (#5) consistently showed competent participants treating assertions meeting a local standard as *proper flat-out assertions* even when the speaker clearly lacked knowledge (by KC's lights), *and* hearers accepted them as transmitting warrant equivalent to knowledge. We would need to concede significant contextual indexing or reconsider constitutive force.
      2.  **Spokesperson Acceptance:** If the Spokesperson case (#2) showed low blame/impropriety for the *official* assertion even after a failure, *specifically* because assessors cited the *institutional evidence base* as sufficient warrant *for the assertion's propriety* (not just role permission), we would need to relax the personal knowledge requirement for some assertions.
      3.  **Evidentiality & Gettier:** If evidential languages (#3) commonly used their most direct/unmarked form for Gettierized justifications (where KC denies knowledge), we would need to reconsider the constitutive link between the unmarked force and knowledge.

  *   **Reasonable-Belief Camp:** We would reconsider our position if:
      1.  **Retrospective Blame:** Tests like the Audit Game (#4) showed significantly higher blame/impropriety ratings specifically for Gettier cases (S has JTB but not-K) compared to parallel cases of JTB that *are* knowledge, *even when* S's justification was identical and impeccable. This would suggest a distinct norm violation tied to lack of knowledge.
      2.  **Constitutive Force:** If tests (e.g., evidentiality #3, or analysis of challenge patterns) robustly showed that participants treat assertions violating the knowledge rule not merely as *bad*, but as fundamentally *misrepresenting the speech act type* (e.g., akin to a lie or mere guess), we would need to take the constitutive claim seriously.
      3.  **Point of Practice:** If compelling evidence showed hearers *only* gain actionable warrant or update their beliefs *as if* the speaker *knew* (e.g., treating the assertion as indefeasible absent counter-evidence to knowledge), this would strongly favor KC's knowledge-transmission point and norm.

  ---

  ### 5. Closing: State of Play

  This collaboration achieved significant clarification. We agree on core phenomena (Moore, Lottery), crucial distinctions (Improper/Defective/Infelicitous), the existence of norms for hedged speech, the constraining role of the practice's point, and the necessity of fine-grained, evidence-specified testing. Much apparent disagreement stemmed from **verbal** differences, particularly concerning the "Truth Rule" and the precise connotations of "should."

  However, **substantive disagreements** remain. The core debate over whether knowledge or reasonable belief governs flat-out assertion is **genuine and empirical**. Key unresolved questions are whether the norm is constitutive (KC) or regulative (RBC), whether the relevant evidence base is strictly personal (KC) or positional (RBC), and whether the norm is invariant (KC) or context-sensitive (RBC). These disagreements are deeply intertwined with differing, **evaluative** conceptions of the core *point* of assertion (knowledge vs. true belief/evidence transmission).

  The cruxes defined in Section 3 provide a roadmap for resolving these disagreements empirically. Tests on **The Spokesperson's Case**, **The Audit Game**, and **Local Standards** are prioritized as likely to yield decisive, divergent predictions directly relevant to the core norms and evidence base issues. Results from these can distinguish the camps. The **Evidentiality Test** offers a powerful cross-linguistic window into the constitutive claim, though extensive typological work is needed. The **Retrospective Case** primarily refines our understanding of verdict distinctions, crucial for interpreting all data.

  We pre-register the predictions detailed in Section 3. This statement provides a stable foundation for future empirical work to test the norms of assertion. The success of this collaboration lies not in resolution, but in formulating the disagreement precisely enough to be productively tested.
