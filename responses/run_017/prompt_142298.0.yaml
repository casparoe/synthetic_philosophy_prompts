  Okay, let me start by understanding the user's problem. They're writing a seminar paper on reasons-first accounts of value, specifically fitting-attitude analyses and buck-passing theories. Their reading group presented an argument that seems to prove too much—concluding that almost nothing we admire is actually admirable. The user can't find where the argument goes wrong and wants to know which premise to reject.

  First, I need to parse the argument step by step. The key premises are Purity (1), Genuineness (3), Basing (4), Transmission (5), and then applications to nested demon (6) and ordinary cases (7). The conclusion in (8) is that almost no actual admiration is based on right-kind reasons, leading to the absurdity that nothing we value is valuable. The user suspects "based on" might be ambiguous, especially given the self-fulfilling belief example in (1).

  Hmm, the user mentioned that Purity has to be relational because of cases like self-fulfilling beliefs. That's important because it means we can't classify reasons based solely on the consideration itself but on how it relates to the attitude's correctness condition. The nested demon case (6) seems fine, but the ordinary case (7) is where things go awry. The user wants to save the intuition that the demon isn't valuable, their colleague's admirability isn't affected by the belief's causal history, and that there's a genuine reason to favor the demon in the threat scenario.

  Let me consider the Transmission premise (5). It says basing is transitive: if attitude A is based on attitude B, and B is based on reason R, then A is based on R. But in the ordinary case, the admiration is based on the belief that the colleague is trustworthy, which itself was formed partly for pragmatic reasons. Transmission would mean the admiration is based on those pragmatic reasons. But is that accurate? Maybe basing isn't transitive in that way. For instance, if I trust my colleague because trusting made collaboration better, does that mean my admiration is directly based on that pragmatic reason? Or is the admiration based on the current belief, which now stands independently? The user wants the colleague's admirability to be independent of the belief's causal history, so challenging Transmission here might help.

  Looking at Basing (4), it requires attitudes to be based on right-kind reasons to confer value. But if in ordinary cases, our beliefs have pragmatic influences, does that make the resulting attitude unfit? That seems too strict. Perhaps the basing relation for value-conferral isn't as demanding. Maybe once the belief is formed, even if pragmatically motivated, if it's now held for evidential reasons, the admiration based on it is still fitting. But the user mentioned the self-fulfilling belief case complicates this because there, the pragmatic reason also serves as evidence. So in the colleague's case, the pragmatic reason (trusting pays) might not bear on trustworthiness itself, unless it's a case where trusting actually makes the colleague more trustworthy, like a self-fulfilling prophecy. But the user's example doesn't specify that. In typical scenarios, trusting paying off might correlate with trustworthiness, but it's not direct evidence. So Purity would classify it as wrong-kind for belief formation.

  The user also asks about evidentialism. In epistemology, pragmatic reasons for belief are wrong-kind, but beliefs based on them might still be justified if there's sufficient evidence. For example, if I form a belief for pragmatic reasons but it turns out to be supported by evidence, the belief can be knowledge. Similarly, in the value case, if the admiration is based on a belief that's true and supported by right-kind reasons, even if the belief was initially motivated by pragmatics, the admiration could still be fitting. So the asymmetry might be that epistemic justification doesn't require the belief's causal history to be pure, whereas the Basing premise (4) in the argument seems to demand that for evaluative attitudes. But that would mean rejecting the strict Basing requirement as stated in (4).

  Another angle: Genuineness (3) says we have reasons to bring about attitudes for wrong-kind reasons. But when we form attitudes based on such reasons, the resulting attitude might still be fitting if it aligns with right-kind reasons. In the colleague's case, even if the belief was formed for pragmatic reasons, if it's now maintained by evidence of trustworthiness, the admiration based on it isn't tainted. So Transmission might not apply because the admiration is based on the current belief, not the original pragmatic reason. The basing chain is broken once the belief is held for different reasons.

  But the argument assumes that the belief is still based on the pragmatic reason. If the belief persists only because of evidence, even if initially motivated by pragmatics, then it's no longer based on the wrong-kind reason. So perhaps in the ordinary case (7), the belief isn't solely based on pragmatics; it might have been confirmed by evidence. The user's reconstruction says "partly because," so there might be mixed reasons. But Basing (4) requires appropriate basing on right-kind reasons, so if the belief is based partly on wrong-kind reasons, does that invalidate it entirely? That seems too strong. Maybe partial basing is acceptable, or the attitude can still be fitting if right-kind reasons are sufficient.

  Considering the alternatives: giving up Purity would undermine the wrong-kind of reasons solution. Abandoning reasons-first might be too drastic. Denying Transmission seems promising, especially since basing transitivity might not hold across different attitude types. Rejecting the strict Basing requirement (4) could work if we allow that as long as the attitude aligns with right-kind reasons, its causal history doesn't matter. That aligns with the user's intuition about the colleague.

  The user also wants to preserve that the demon isn't valuable and that there's a genuine reason to favor him. Denying Transmission or relaxing Basing doesn't threaten that. In the nested demon case (6), the admiration is directly based on the threat via belief, so it's still wrong-kind. But in ordinary cases, admiration is based on the belief in admirability, which might be supported by right-kind reasons even if formed partly for pragmatics.

  So the break is likely at step (7). The admiration isn't based on the pragmatic reason because Transmission fails. Basing isn't transitive when the intermediary attitude (belief) is held for different reasons than those that caused its formation. Or Basing (4) is too strict; attitudes can confer value as long as they are responsive to right-kind reasons, regardless of formation history.
answer: |-
  This is a sharp argument that exposes a genuine tension in reasons-first accounts, but it overreaches by misapplying the basing relation. The core flaw lies in **step (7)**, specifically in how "based on" functions in the *transmission chain* from pragmatic belief-formation to evaluative attitude. Let's diagnose the breakdown, price the alternatives, and address the evidentialism comparison.

  ### Where the Argument Fails: Basing Transmission Isn't Linear
  The issue isn't with Purity, Genuineness, or the core reasons-first framework. It's with **premise (5) (Transmission)** and its interaction with **premise (4) (Basing)** in ordinary cases. Basing is *not* straightforwardly transitive across attitudes of different types (e.g., from belief to admiration) when the intermediary attitude has its *own* correctness conditions and justificatory structure. Here's why:

  1.  **The Belief Acts as a Justificatory Filter:** When you admire your colleague *based on your belief* that she is trustworthy, your admiration is directly based on the *content* of that belief ("she is trustworthy"), not on the *reasons why you formed the belief*. The belief itself, once formed, becomes a potential *right-kind reason* for admiration (if trustworthiness is admirable). The pragmatic reasons that influenced the *formation* of the belief don't automatically transmit to the admiration.
  2.  **Basing Requires Sustaining Reasons, Not Just Causal History:** For an attitude to be *based on* a reason, that reason must be part of what *sustains* or *rationalizes* the attitude *to the subject*. In the ordinary case:
      *   The pragmatic reason (trusting pays) may have *caused* you to form the belief.
      *   But once formed, you likely *sustain* the belief because you take the *evidence* (her reliable behavior, etc.) to support its truth. You sustain the *admiration* because you take the *trustworthiness* (the content of the belief) to make her admirable.
      *   The *pragmatic* reason for forming the belief typically plays *no role* in sustaining either the belief or the admiration. It's inert in the current justificatory structure.
  3.  **Contrast with the Nested Demon (Step 6):** The nested demon case works *because* the threat remains the *active, sustaining reason* throughout the chain:
      *   You form the belief *because* of the threat (sustaining reason: threat).
      *   You admire *because* you believe he's admirable (sustaining reason: the belief *whose content is itself solely sustained by the threat*). The belief here is just a conduit for the threat; its truth isn't independently supported by evidence of admirability.
      *   The threat permeates the entire chain because there are *no independent right-kind reasons* supporting the belief or the admiration. Transmission holds because the wrong-kind reason is *doing all the work*.
  4.  **Why Step (7) Fails:** In the ordinary case, even if the belief was *initially formed* partly for pragmatic reasons, it is likely *sustained* by evidence (right-kind reasons for belief). The admiration is then *based on* the *content* of this belief (which represents a potential right-kind reason for admiration), not on the original pragmatic motivator. The pragmatic reason is not part of the *sustaining basing relation* for the admiration. Transmission (5) doesn't apply because the admiration isn't ultimately *based on* the pragmatic reason in the relevant sense required by (4). Premise (7) incorrectly assumes the basing chain is preserved when the belief is justified by evidence.

  ### Pricing the Alternatives
  1.  **Give Up Purity (1):** **Costly.** Purity is the standard, compelling solution to the Wrong-Kind-of-Reasons Problem (WKRP). Rejecting it means struggling to explain why the demon threat isn't a reason *making him admirable*. It collapses the distinction between what makes an attitude fitting and what makes it prudent.
  2.  **Give Up Basing Requirement (4):** **Problematic.** Weakening (4) allows attitudes based *solely* on wrong-kind reasons (like admiring the demon *because* he threatened you) to confer value. This surrenders the core insight of fitting-attitude analyses: fitting responses track value, not just prudence. The demon still isn't admirable.
  3.  **Deny Transmission (5):** **Most Plausible & Targeted.** As argued above, basing isn't transitive in the linear way premise (5) assumes, especially across attitude types and when the intermediary state has independent justification. You can deny (5) *as stated* while preserving the idea that basing can transmit *if* the intermediary state is *itself* sustained solely by the initial reason (as in the nested demon, step 6). This saves the ordinary case: your admiration is based on your belief in trustworthiness, which is (now) sustained by evidence, not the initial pragmatic motive. The demon case remains problematic because the threat *does* sustain the entire chain.
  4.  **Abandon Reasons-First:** **Drastic Overreaction.** The argument identifies a complexity in the basing relation, not a fatal flaw. Reasons-first accounts can accommodate this by clarifying the structure of basing chains and the role of intermediary states with their own correctness conditions. Giving up now throws out valuable insights about the connection between reasons and value.

  **Recommendation:** Reject the application of Transmission (5) in Step (7). Uphold Purity (1), Genuineness (3), and the core Basing requirement (4) for *direct* or *sustaining* reasons. Refine the account of basing to recognize that intermediary justified attitudes (like evidentially supported beliefs) act as screens/filters, breaking the direct basing chain back to their causal origins unless those origins remain the sole sustaining reasons.

  ### The Evidentialism Comparison: Asymmetry Explained
  The argument *does* have parallels to epistemic basing, but there's a crucial asymmetry:

  *   **Similarity:** In epistemology, a belief formed for pragmatic reasons (e.g., forming a belief because it makes you happy) but *sustained* by evidence can still be justified/knowledge. The pragmatic reason for formation doesn't automatically transmit its "wrong-kind" status to the belief's epistemic standing if the belief is now held for evidence. This mirrors the value case: admiration based on a belief sustained by evidence of admirability isn't tainted by the belief's causal origin.
  *   **Asymmetry (Where the Threat Comes From):**
      *   **Epistemic Vulnerability:** Evidentialism is vulnerable to "epistemic demons." Imagine a demon forces you to believe P *for no evidence*, threatening death otherwise. If you form and sustain the belief *solely* because of the threat, evidentialism correctly says this belief is unjustified and not knowledge – even if P is true! The threat is a wrong-kind reason *par excellence*. The analogue of step (6) holds: a belief based solely on a threat is epistemically defective.
      *   **Evaluative Vulnerability:** Reasons-first accounts face *WKRP demons* (like the original or nested case). Here, the threat is also a wrong-kind reason, and attitudes based solely on it don't confer genuine value. This is analogous to the epistemic demon.
      *   **The Asymmetry in Ordinary Cases:** The asymmetry arises in how *pragmatic influences* affect justification in ordinary practice. In epistemology, the *justification of a belief* depends crucially on *its current evidential support*, not its causal history (barring special defeaters). A belief formed for bad reasons but now held for good evidence is justified. The *value analogue* defended above is similar: the *fittingness of admiration* depends on it being a response to (or based on a belief representing) genuine features of the object that *are* admirable (right-kind reasons), not the causal history of the belief it's based on. The basing requirement (4) for evaluative attitudes targets the *reasons for the admiration itself*, not the archaeology of the supporting beliefs. This is why the argument fails in step (7) for value but a *strict* epistemic analogue (where a belief is *sustained* by pragmatic reasons, not just caused by them) *would* be problematic for justification.

  **In short:** The argument breaks at step (7) because it misapplies basing transmission. Your colleague's admirability *doesn't* depend on the causal history of your belief about her trustworthiness, as long as that belief is now justified by evidence (right-kind reasons for belief) and your admiration is based on *that belief* (a potential right-kind reason for admiration). Denying the simplistic transmission of premise (5) in these cases preserves the core insights of reasons-first accounts, handles the demon cases correctly, and aligns with how justification works in both epistemology and value theory for ordinary, evidence-supported attitudes.
