  - Step 2: Possible? Yes, the consultant could have reviewed.
  - Step 3: But-for? If the consultant had reviewed, would the harm have been avoided? 
     - The harm was due to not acting on the scan. The registrar also did not act. If the consultant had reviewed, they would have seen the same thing the registrar saw. And we are told that the registrar did not act. Would the consultant have acted? We are told that counterfactually nothing would have changed because the consultant would have made the same (incorrect) assessment as the registrar. So the harm would have occurred anyway. Therefore, but-for test fails -> then step 3a: contributed to? 
        - The omission was a breach and part of the chain? The harm occurred because the scan was not acted upon. The consultant's duty was to ensure the scan was reviewed properly. By not reviewing, she failed her duty. But the harm would have happened anyway. We return "contributed to".

  The panel might not like it because they want to hold the consultant accountable as a cause. But the procedure returns "contributed to" (which leads to a local action plan) rather than "cause" (regulatory referral). 

  **What the procedure cannot do:**

  1. It cannot resolve disputes about the norm. If the norm is under dispute (e.g., what staffing level was owed), then we hand that off to management or the policy committee. The causal analysis depends on the norm in place at the time.

  2. It might be influenced by the desire to prevent recurrence. For example, we might want to classify an omission as a cause to trigger a regulatory referral and force change. The procedure tries to prevent that by being fact-based and using the defined steps.

  3. It might not capture complex causal chains with multiple omissions. We are analyzing one omission at a time.

  4. The but-for test might be fragile in cases of overdetermination. We use the "contributed to" category as a fallback for breaches that are part of the causal chain but not but-for causes.

  5. The procedure relies on the panel's judgment in step 3a (contributing factor) and in assessing possibility (step 2). To ensure consistency, we recommend documenting the reasoning.

  **Final Procedure:**

  We present the procedure as a flowchart with questions:

  0. **Define the omission and the norm**: 
     - Specific act omitted: [description]
     - Norm requiring the act: [protocol, role, etc.]
     - If the norm is under dispute: Hand off to [designated authority] and pause this procedure.

  1. **Breach of duty?**
     - Was the omission a breach of the established duty (as per the norm in force at the time)?
       - No: **Stop. Output: "background condition"**.
       - Yes: Proceed.

  2. **Possibility of action?**
     - In the actual circumstances at the time, was it possible for the agent to perform the omitted act (as defined by the norm)?
       - No: **Stop. Output: "background condition"**. (Note: record whether blocked or borrowed for internal learning.)
       - Yes: Proceed.

  3. **But-for causation?**
     - If the agent had performed the omitted act (and everything else remained the same), would the harm have been avoided?
       - No: Proceed to 3a.
       - Yes: Proceed to 4.

  3a. **Contributing factor?**
     - Was the omission a breach that occurred in the chain of events and in the domain of risk the duty was meant to prevent?
       - (In practice: if the harm is the kind the duty was designed to prevent, then yes.)
       - Yes: **Stop. Output: "contributed to"**.
       - No: **Stop. Output: "background condition"**.

  4. **Blocked?**
     - If the agent had tried to perform the act, would they have been prevented by external circumstances (not of their own making)?
       - Yes: **Stop. Output: "background condition"**.
       - No: **Stop. Output: "caused"**.

  This procedure should be runnable in 45 minutes per omission. For each incident, you may have multiple omissions to analyze separately.
answer: |-
  ### Decision Procedure for Omission Causality in Incident Reviews

  This procedure provides a standardized, evidence-based method to classify omissions as **caused**, **contributed to**, or **background condition**. It is grounded in causation literature, focuses on factual (not normative) judgments, and uses your three categories (**live**, **blocked**, **borrowed**) to clarify agency. The procedure is designed for 45-minute reviews by non-experts and ensures replicability.

  ---

  ### **Procedure Overview**
  1. **Fixed-order questions** with clear stopping points.  
  2. **Sufficient answers**: Binary (yes/no) or predefined options.  
  3. **Stops at "not a cause"** when omissions fail key tests.  
  4. **Hand-offs to management** when disputes involve norms/expectations (e.g., staffing levels).  
  5. **Output**: One of three verdicts:  
     - `Caused` (triggers regulatory/insurance actions).  
     - `Contributed to` (triggers local action plans).  
     - `Background condition` (no formal actions).  

  ---

  ### **Decision Procedure: Step-by-Step Questions**
  **Step 0: Define Omission and Norm**  
  - *Question*: "What specific act was omitted, and what explicit norm/expectation required it (e.g., policy, protocol, role)?"  
  - *Sufficient Answer*: Clear description of (a) the omitted act and (b) the documented norm (e.g., "Policy X requires nurses to escalate vitals every 2 hours").  
  - *Hand-off*: If the norm is disputed (e.g., "Was this staffing level adequate?"), **pause and refer to management**. Do not proceed—this is a normative dispute, not causal.  
  - *Outcome*: Proceed only if norm is unambiguous and breached.  

  **Step 1: Breach of Duty?**  
  - *Question*: "Did the agent breach a clear duty under the norm?"  
  - *Sufficient Answer*: Yes (if the omission violated the norm) or no (if action was discretionary, optional, or compliant).  
  - *Stop*: If **no**, output `Background condition`.  
  - *Proceed*: If **yes**.  

  **Step 2: Possibility of Action?**  
  - *Question*: "In the actual circumstances, could the agent have physically/intellectually performed the act (ignoring willingness)?"  
  - *Sufficient Answer*:  
    - **Yes**: Agent had means, information, and authority at the time.  
    - **No**: Agent lacked capacity (e.g., unconscious), means (e.g., missing equipment), or authority (e.g., protocol barred action).  
  - *Stop*: If **no**, output `Background condition` (omission **blocked** or **borrowed**—causality shifts to the blocker).  
  - *Proceed*: If **yes**.  

  **Step 3: Counterfactual Necessity (But-For Test)**  
  - *Question*: "If the agent had acted, would the harm *likely* have been avoided, given *actual conditions* (e.g., other failures intact)?"  
  - *Sufficient Answer*:  
    - **Yes**: Harm would probably have been prevented (e.g., escalating vitals would have alerted a *functional* team).  
    - **No**: Harm would still have occurred (e.g., backup systems were broken).  
  - *Stop*: If **no**, output `Background condition`.  
  - *Proceed*: If **yes**.  

  **Step 4: External Prevention?**  
  - *Question*: "Would the agent have been *physically/structurally prevented* from succeeding if they tried (e.g., override by superiors, system lockout)?"  
  - *Sufficient Answer*:  
    - **Yes**: External forces would have nullified the action (e.g., security would have barred entry).  
    - **No**: No such forces existed.  
  - *Stop*: If **yes**, output `Background condition` (omission **blocked**).  
  - *Proceed*: If **no**, output `Caused` (omission **live**).  

  **Step 5: Borrowed Omission?**  
  - *Question*: "Did an *earlier omission by another party* remove the agent’s means, information, or authority to act?"  
  - *Sufficient Answer*:  
    - **Yes**: Clear causal link (e.g., dead pager due to prior maintenance lapse).  
    - **No**: No such link.  
  - *Outcome*:  
    - If **yes**, output `Contributed to` (omission **borrowed**—primary cause is the earlier act).  
    - *Note*: "Borrowed" is distinct:  
      - **Blocked** = *Immediate* external prevention (e.g., guard blocks door).  
      - **Borrowed** = *Prior* omission removes capacity (e.g., guard disables door lock yesterday).  
      - **Live** = Agent could have acted and succeeded.  
    - "Borrowed" does not collapse into "blocked" or ordinary causation. It highlights *causal chains* but avoids misattributing root cause.  

  ---

  ### **Test Cases**
  **Case 1: Night nurse did not escalate vitals; doctor’s pager battery dead**  
  - **Step 0**: Omission = "Nurse failed to escalate vitals." Norm = "Protocol requires escalation if vitals deteriorate."  
  - **Step 1**: Breach? **Yes** (protocol breached).  
  - **Step 2**: Possible? **No** (pager dead → no means to escalate).  
  - **Stop**: `Background condition` (**borrowed omission**—root cause: prior failure to maintain pager).  

  **Case 2: Maintenance skipped calibration; independent alarm muted**  
  - **Step 0**: Omission = "Maintenance skipped calibration." Norm = "Monthly calibration required."  
  - **Step 1**: Breach? **Yes**.  
  - **Step 2**: Possible? **Yes** (team could have calibrated).  
  - **Step 3**: But-for? **No** (even if calibrated, muted alarm would not have prevented harm).  
  - **Stop**: `Background condition` (omission not necessary—harm would still occur).  

  **Case 3: Consultant did not review scan; delegated registrar also failed**  
  - **Step 0**: Omission = "Consultant failed to review scan." Norm = "Consultant must verify delegated tasks."  
  - **Step 1**: Breach? **Yes** (failed to verify).  
  - **Step 2**: Possible? **Yes** (could have reviewed).  
  - **Step 3**: But-for? **No** (if consultant reviewed, registrar’s inaction would still cause harm).  
  - **Stop**: `Background condition` (omission not necessary—harm would still occur).  
  - *Panel’s expected dislike*: Verdict is consistent—omission fails but-for test. Accountability is normative (handled separately).  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Prevent "recurrence bias" from influencing causality**:  
     - The procedure isolates factual causation (e.g., "Did this omission change the outcome?") from preventative intent (e.g., "Should we change the norm?").  
     - Example: Even if an omission is high-risk, it is `Background condition` if it fails Steps 2–4. Prevention is addressed in action plans, not causal reports.  

  2. **Resolve normative disputes**:  
     - Anchors to explicit norms (e.g., "Protocol X requires Y"). If norms are contested (e.g., "Was staffing adequate?"), the procedure **hands off to management** at Step 0. This separates "what happened" from "what we owe."  

  3. **Handle overdetermined causation**:  
     - If multiple omissions *each* could have caused harm alone (e.g., two independent maintenance lapses), the procedure assesses each separately. All might be `Caused`, but regulatory implications require legal input.  

  4. **Assign blame or moral responsibility**:  
     - Focuses on causal role, not intent. A `Borrowed` omission may reflect systemic flaws, not individual fault.  

  ---

  ### **Critique of the Three Categories**  
  Your categories (**live**, **blocked**, **borrowed**) align with key distinctions in omission literature:  
  - **Live**: Maps to classic "causation by omission" (agent could have changed outcomes).  
  - **Blocked**: Captures "prevented attempts" (e.g., Frankfurt cases).  
  - **Borrowed**: Addresses "causal chains" (earlier omissions enabling later ones).  

  **Strengths**:  
  - **Borrowed** does not collapse: It highlights *systemic* gaps (e.g., dead pager) vs. **blocked** (immediate obstruction).  
  - Clarifies agency: E.g., a nurse’s omission is **borrowed** if a prior failure removed tools.  

  **Weaknesses**:  
  - **Borrowed** may blur with **blocked** if the "prior omission" is immediate (e.g., pager dies minutes before). Refine with timing: **Borrowed** requires a *temporally separate* prior act.  
  - **Live/blocked** rely on subjective "could have" judgments. Mitigation: Use evidence (e.g., logs showing system access).  

  **Recommendation**: Keep all three, but add:  
  > *"Borrowed omissions are `Contributed to` to avoid misattributing root cause. Live omissions are `Caused`."*  

  ---

  ### **Summary**  
  This procedure:  
  - Ensures replicability via fixed steps.  
  - Distills literature into practical tests.  
  - Isolates causation from prevention/norms.  
  - Classifies omissions using **live**/**blocked**/**borrowed**.  

  Outputs align with your reporting system, minimizing contested wording. For disputes, document reasoning at each step to enable auditing.
