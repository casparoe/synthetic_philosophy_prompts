  We are going to design a decision procedure based on Good's theorem and the specific challenges of journalism. The core idea is that information has value only if it could change an action. We must define what counts as an action and when the information is worth waiting for.

  Key elements:
  1. Identify the decision that the information is supposed to change (the "action").
  2. Consider the possibility of the information changing the action (if it cannot, then the information has zero value in that context).
  3. Account for the costs of waiting (scoop risk, deadline pressure) and the quality of the information (independence, reliability).

  We'll break down the procedure into steps:

  Step 1: Define the primary decision and the actions.
     - The primary decision is whether to file the story now or wait to gather more information.
     - The actions that the information might change are:
          a) The filing decision itself (wait vs. file now) - but note, we are in the process of making that decision.
          b) The content of the story (e.g., the verb: "shows" vs. "suggests", or the strength of the claim) - which we consider as an action because it affects what the readers and regulators do.

  However, we must be cautious: if we allow any tiny change in wording to count as an action, then any information might have value. To avoid this, we will require that the change in wording must correspond to a meaningful change in the expected consequences (i.e., it must change the reader's or regulator's behavior in a way that matters).

  Step 2: Pre-commit to what would change.
     - Before seeking the information, specify:
          - What specific claim or action (in the story) might change? (e.g., "I will change the verb from 'shows' to 'suggests' if the extra source expresses doubt about causality.")
          - What would be the consequences of that change? (e.g., if we use "suggests", then readers might be less likely to stop taking the supplement, and regulators might not act as quickly.)

  Step 3: Assess the probability that the new information will change the action.
     - If the probability is zero (i.e., no matter what the source says, you won't change the verb and you'll file anyway) then the information has no value for that action.

  Step 4: Assess the expected value of the change.
     - This requires estimating:
          a) The magnitude of the consequence of the change (e.g., how bad is it if we overstate the risk? how bad if we understate?).
          b) The probability that the new information will lead to a change that avoids a bad consequence.

  But note: the journalist is not the one to set the relative weights of false alarms vs. missed harms. Therefore, we must involve the editor for the value judgments.

  Step 5: Consider the cost of waiting.
     - The cost includes:
          a) The risk of being scooped (which would make the story worth much less or nothing).
          b) The opportunity cost of the time spent (what else could you be working on?).
          c) The risk that the deadline might be missed.

  Step 6: Factor in the independence and reliability of the source.
     - A non-independent source (same lab, same funder) is less likely to provide new information that changes your assessment.

  The Procedure:

  1. **Name the decision the information is supposed to change.**
     - Write down: "If I get this information, what specific action in my story might change?" (e.g., the verb, the inclusion of a claim, the headline, etc.)
     - Also, note what the consequences of that change are (in terms of reader or regulator behavior). If the change is only in the hedge and you cannot articulate a meaningful consequence, then it might be a "hedge sink" and not valuable.

  2. **Pre-commit to the conditions under which you would change the action.**
     - Example: "I will change from 'shows' to 'suggests' if the second source says they cannot confirm the causal link."

  3. **Estimate the probability that the new information will meet the condition for change.**
     - On a scale of 0% to 100%, how likely is it that the source will say something that triggers the change? (This requires your best journalistic judgment.)

  4. **Assess the value of the change (if it happens) and the cost of being wrong.**
     - This step requires value judgments about the consequences of overstatement (false alarm) vs. understatement (missed harm). Since you are not the one to set these, you will have to:
          - If the consequences are minor (e.g., a change in verb doesn't lead to much difference in reader action) then the value is low.
          - If the consequences are major (e.g., changing the verb might prevent a panic or a bad regulatory decision) then the value is high.
     - But note: you cannot assign a dollar value easily. Instead, we can use a relative scale (low, medium, high). However, for the purpose of the procedure, we will note:
          - If the value of the change is high and the probability of the change is not negligible, then it might be worth waiting.
          - Otherwise, it might not.

     However, because the value judgment is not yours, you must involve the editor in this step if the stakes are high.

  5. **Calculate the expected value of waiting (simplified):**
     - Expected Value (EV) of getting the information = [Probability of change] * [Value of change] - [Cost of waiting]

     We break this down:

     a) **Value of change**: This is the difference in outcome between the two actions (e.g., using "shows" vs. "suggests"). We can think of it as the harm avoided by the change. For example:
          - If you would have used "shows" and that might cause unnecessary panic and then the study is retracted, the harm is high. Changing to "suggests" avoids that harm.
          - But note: if the harm of understatement (using "suggests" when you should have said "shows") is also high, then the value of the change might be negative? Actually, we are considering the change from the original action to the new one. We are assuming that the change would be in the right direction (i.e., if the new information suggests you were overstating, then changing to a weaker verb avoids harm). However, if the new information could lead you to overstate even more, then that might be harmful. We assume that the change is toward a more accurate representation.

     Given the complexity, we'll simplify:

          Let V = the value of avoiding an error (either false alarm or missed harm) by changing the verb. But note: the change might avoid one type of error at the cost of the other. We need the editor's input on the relative importance.

     b) **Probability of change (P)**: as estimated in step 3.

     c) **Cost of waiting (C)**: This includes:
          - The probability of being scooped (Pscoop) multiplied by the loss if scooped (Lscoop). Lscoop is high because the story becomes less valuable.
          - The direct cost of your time (which might be low if you have nothing else to do, but high if you have other pressing stories).
          - The risk that the final version of a document (like a government report) might change and you are stuck with an outdated leak.

     We can approximate: 
          Cost of waiting = (Probability of scoop) * (Loss from scoop) + (Opportunity cost of your time)

     We can set:
          Loss from scoop: high (e.g., the story becomes worthless) -> let's say 100 units (arbitrary).
          Opportunity cost: if you spend 2 hours on this call, what else could you have done? Maybe a small story worth 10 units? Adjust based on your judgment.

     Then:
          EV_waiting = P * V - C

     If EV_waiting > 0, then wait and get the information. Otherwise, file now.

     But note: we don't have numbers. So we do a qualitative version:

          - If the cost of waiting is high (e.g., high scoop risk, high opportunity cost) and the probability of a change is low, then file now.
          - If the value of the change is very high (e.g., preventing a major misinformation event) and the probability of change is not negligible, then wait even if the cost is moderate.

  6. **Independence of the source:**
     - If the source is not independent (same lab, same funder, same press release), then the probability of getting new information that changes the action (P) is low. Mark it down by a factor (e.g., cut P in half?).

  7. **Stopping rules:**
     - If at any step you realize that the information cannot change any action (even after considering hedge changes) then stop and file now.
     - If the cost of waiting is too high (deadline is too tight, scoop risk very high) and the expected value of waiting is not clearly positive, then file now.
     - If the expected value of waiting is positive and you have time, then wait and make the call.

  8. **When to involve the editor:**
     - When the value judgments (how bad is a false alarm vs. missed harm) are needed and are non-trivial.
     - When the stakes are high (e.g., a story that might cause a market move or public panic) and you are unsure.

  Now, let's run the three cases:

  **Case (a): Preprint, n=23, linking a common sleep supplement to elevated liver enzymes, with a rumor that a bigger outlet already has it.**

  1. **Decision to change**: The verb: from "shows" to "suggests" or even "a small study hints". Also, maybe the decision to run the story at all if the extra call reveals a fatal flaw.
  2. **Pre-commit**: If the statistician or second lab says the analysis is flawed or the effect is not significant, then downgrade the verb or kill the story.
  3. **Probability of change**: 
     - The preprint is small (n=23). The chance that the statistician finds a flaw? Medium (say 40%).
     - The second lab (if independent) might not have replicated? But here, the second lab is not independent? (The problem says: "same lab, same funder, same press release"). So non-independent: mark down the probability. Let's say 20% chance they say something that changes the verb.
  4. **Value of change**: 
     - If you overstate, people might stop taking a supplement that is actually safe, and your outlet loses credibility. Value of avoiding: medium.
     - If you understate, people might continue taking a supplement that is harmful, but n=23 is weak evidence so understatement is less harmful? 
     - Overall, the value of change is medium.
  5. **Cost of waiting**:
     - Scoop risk: high. Rumor says a bigger outlet has it. Probability of scoop: 70%. Loss from scoop: high (story becomes old news). 
     - Opportunity cost: low (you have a few hours). 
     - Total cost: high (because of scoop risk).
  6. **Expected Value (qualitative)**: 
     - P * V = 20% * medium = low to medium.
     - Cost = high.
     - EV_waiting = low/medium - high = negative.
  7. **Decision**: File now. The scoop risk is too high and the probability of getting valuable new information from a non-independent source is low.

  **Case (b): Leaked draft of a government risk assessment for an industrial solvent, final version due in nine days.**

