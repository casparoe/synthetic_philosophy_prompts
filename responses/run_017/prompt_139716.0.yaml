answer: |-
  Below is a decision procedure designed for your specific context, rooted in Good's theorem but adapted for journalism's real-world constraints (scoop risk, non-independent sources, and the "hedge sink" problem). It's structured as a flowchart of questions, requires no stats, and can be completed in under an hour. Crucially, it forces you to pre-commit to what action the information might change *before* seeking it and explicitly handles linguistic hedges as "actions" only if they alter **downstream consequences** (e.g., reader behavior, regulatory action). If a hedge change doesn't meaningfully affect outcomes, it’s deemed a "sink" and worthless.

  ---

  ### **The Reporter’s Decision Procedure: "To Wait or to File?"**
  **Core Principle:** Only wait for information if it could change a meaningful action (yours or a downstream user's) *and* the expected value of waiting outweighs the cost of delay (scoop risk, deadline pressure). Define "meaningful action" as:  
  - **Tier 1 Action:** Changes your binary filing decision (kill/publish the story).  
  - **Tier 2 Action:** Changes framing (e.g., "shows" → "suggests") *only if* it alters likely reader/regulator behavior.  
  - **Tier 3 Action:** Improves story quality (e.g., adds context) without changing Tier 1/2.  

  **Key Rule:** Tier 3 actions are *not* sufficient to wait—file immediately unless Tier 1/2 is in play. Tier 2 must pass the "So What?" test (see Step 2).

  #### **Step 1: Name the Decision & Action in Advance (5 min)**  
  *What to write down:*  
  - **The specific information** you’re seeking (e.g., "Call Lab B for their unpublished data").  
  - **The action it could change:** Pre-commit to 1–2 sentences:  
    - *Example:* "If Lab B says their data contradicts the study, I’ll downgrade ‘proves’ to ‘suggests’ AND add a warning."  
    - *Example:* "If the statistician finds a flaw, I’ll kill the story."  

  *Where it stops:* If you can’t name a concrete action, **FILE NOW**.  

  #### **Step 2: The "So What?" Test for Hedge Changes (5 min)**  
  *Ask:* **If my verb changes (e.g., "shows" → "suggests"), does this alter what readers/regulators are likely to DO?**  
  - **Yes** if:  
    - It changes medical/legal/financial decisions (e.g., readers stop taking a drug, regulators open an inquiry).  
    - *Example:* Downgrading "proven cancer risk" to "possible risk" for a common drug could change prescribing behavior.  
  - **No (Hedge Sink)** if:  
    - It only softens language for credibility/legal protection without changing outcomes.  
    - *Example:* Changing "linked to" to "associated with" for a weak study readers would ignore anyway.  

  *Where it stops:*  
  - If Tier 2 fails the "So What?" test, **FILE NOW** (information is worthless per Good’s theorem).  
  - If Tier 2 passes, proceed.  

  #### **Step 3: Assess Probability of Change (10 min)**  
  *Ask:* **How likely is the new info to change my pre-committed action?** Use:  
  - **High** (≥50%): Source is independent, has direct knowledge, and might contradict key claims.  
  - **Low** (<20%): Source is non-independent (same lab/funder/press release) or unlikely to add new insights.  
  - **Medium** (20–49%): Ambiguous independence or partial relevance.  

  *Where it stops:*  
  - If probability is **Low** AND you’re seeking Tier 2/3 action, **FILE NOW**.  
  - If probability is **High/Medium**, proceed.  

  #### **Step 4: Weigh Costs & Benefits (15 min)**  
  *Calculate:*  
  - **Cost of Waiting = Scoop Risk + Time Cost**  
    - **Scoop Risk:** High (≥50%) if competitors are chasing the story; Low (≤10%) if exclusive.  
    - **Time Cost:** High if deadline <6 hours or delays other work; Low if you have slack time.  
  - **Benefit of Waiting = Value of Change × Probability**  
    - **Value of Change:**  
      - **High:** Action prevents major harm (e.g., false alarm causes panic, missed harm risks lives).  
      - **Medium:** Action affects credibility but not safety (e.g., overstatement damages outlet’s reputation).  
      - **Low:** Action only improves nuance (e.g., adds a caveat experts already assume).  

  *Where it stops:*  
  - If **Cost > Benefit**, **FILE NOW**.  
  - If **Benefit > Cost**, **WAIT**.  
  - If **Benefit ≈ Cost** or Value of Change is **High**, **DEFER TO EDITOR** (values judgment).  

  #### **Step 5: Make the Call or File (10 min max)**  
  - If waiting, **set a hard deadline** (e.g., "I’ll call X by 3 PM; if no answer, file").  
  - After getting info: **Did it change your pre-committed action?**  
    - **Yes:** Update story.  
    - **No:** File unchanged.  

  ---

  ### **How the Procedure Handles Your Wrinkles**  
  - **Hedge Sink:** Only counts if it passes the "So What?" test (Step 2). Forces you to tie language changes to real-world impacts.  
  - **Scoop Risk:** Explicitly weighed as a cost (Step 4). High scoop risk makes waiting untenable.  
  - **Non-Independent Sources:** Downgrades probability of change (Step 3), reducing benefit of waiting.  
  - **Values Judgments:** Kicks high-stakes tradeoffs (false alarm vs. missed harm) to the editor (Step 4).  

  ---

  ### **Run the Procedure: Three Cases**  
  #### **Case (a): Sleep supplement preprint (n=23), scoop rumor**  
  1. **Action:** "If second lab confirms, write ‘shows elevated enzymes’; if not, write ‘preliminary data suggests’."  
  2. **"So What?" Test:** Fails. Readers won’t change behavior for an n=23 study; clinicians ignore these without replication. → *Hedge sink*. **FILE NOW**.  
  3. *Why:* Scoop risk is high, and Tier 2 action fails. No need to proceed further.  

  #### **Case (b): Leaked solvent risk assessment, final in 9 days**  
  1. **Action:** "If agency press office says draft is accurate, run with ‘confirms high risk’; if they disavow, kill story."  
  2. **"So What?" Test:** Passes (Tier 1). Regulators might act on a confirmed leak; companies could face lawsuits.  
  3. **Probability:** Medium (agency might stonewall, but disavowal would change everything).  
  4. **Cost/Benefit:**  
     - Cost: Low (scoop risk low if exclusive; 9 days until final, but your deadline is hours).  
     - Benefit: High (avoiding false alarm = Medium × Medium = Medium).  
     - Benefit > Cost → **WAIT**. Make the call.  
  5. *Outcome:* Call press office. If they disavow, kill; if no answer, run with "leaked draft suggests… agency declined to comment."  

  #### **Case (c): Beloved story, "one more call" to lead author**  
  1. **Action:** "If author clarifies Method X, add note; else, no change."  
  2. **"So What?" Test:** Likely fails. Clarifying Method X is Tier 3 (adds context; experts won’t change interpretation). → *Hedge sink*.  
  3. *Where it stops:* At Step 2. **FILE NOW**.  
  4. **Hard Truth:** The call is theater. You’re emotionally invested, but the info won’t change actions. Scoop risk is low, but the cost is wasted time and deadline stress.  

  ---

  ### **What the Procedure Can and Can’t Do**  
  **Strengths (Catches Newsroom Blind Spots):**  
  - Forces pre-commitment to actions, killing "vibes" like "it can’t hurt to check."  
  - Exposes hedge sinks and non-independent sources, which intuitively *feel* valuable but rarely are.  
  - Quantifies scoop risk/effort tradeoffs your team neglects.  
  - Handles Tier 1/2 actions rigorously, separating signal from noise.  

  **Limitations:**  
  - **Not a Stats Tool:** It doesn’t evaluate study quality (use existing fact-checking for that).  
  - **Subjective Calibration:** Probability/Value judgments rely on your expertise (but the framework makes them explicit).  
  - **Complex Dependencies:** Struggles if >2 actions could change (e.g., info affecting both filing and framing).  
  - **Emotional Bias:** You might rationalize Tier 2 value for a story you love (Case c). Mitigated by pre-commitment.  

  **Bottom Line:** This is **expected-value bookkeeping in reporting clothes**—but that’s why it works. It replaces gut feelings with disciplined steps, ensuring you only wait for information that could change outcomes. Use it to defend decisions to your editor: "I’m filing because the hedge sink fails the ‘So What?’ test" is more persuasive than "my vibes say go."
