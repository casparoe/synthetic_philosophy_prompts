  Based on your cases and constraints, I propose three competing principles that cover the terrain. Each handles most cases cleanly but requires sacrificing one of your verdicts. I'll state them precisely, show their verdicts (including two new cases), and identify the conflict point.

  ### Principle 1: **Instrumental Dispositionalism**
  *"Adopt disposition D iff:  
  (a) Pre-installation expected utility of having D > not having D, *and*  
  (b) D reliably produces acts that would be irrational if chosen locally without D, *and*  
  (c) D cannot be selectively deactivated per-context."*  

  **Verdicts:**  
  - Case 1: **Pay.** Satisfies (a,b,c). Disposition has positive EV pre-desert.  
  - Case 2: **Reject money.** Fails (b). Forming "intention" without follow-through isn't a real disposition.  
  - Case 3: **Sue.** Satisfies (a,b,c). Act is locally irrational but dispositional integrity required.  
  - Case 4: **Want the property.** Satisfies (a). The detectable property *is* D.  
  - Case 5: **Avoid pledge.** Fails (a). Negative EV due to client exploitation outweighs contractor benefit.  
  - Case 6: **Reject global D.** Fails (a). Negative EV overall.  
  - Case 7: **Design correct.** D satisfies (a) for the designer.  
  - *New Case 8 (covert installation):* Someone implants "always sue" in you without consent. **Verdict: Irrational** (violates (a) – you didn't consent to EV calculation).  
  - *New Case 9 (judgment degradation):* Only way to get D reduces IQ by 20 points. **Verdict: Reject D** if cognitive cost > dispositional benefit in EV.  

  **Sacrificed Verdict:** Case 2 (taking the money). Principle denies "intentions" count as dispositions if they lack causal inertia.  

  ---

  ### Principle 2: **Constitutive Rationality**  
  *"An act is rational iff it coheres with the identity of an agent-type whose existence maximizes expected utility from the pre-agential perspective."*  

  **Key distinction:** Rationality attaches to *being a type of agent*, not to acts or dispositions. Acts derive rationality from identity.  

  **Verdicts:**  
  - Case 1: **Pay.** Coheres with "promise-keeper" agent-type, which has positive EV pre-desert.  
  - Case 2: **Take money, don't run.** "Intention-former-for-pay" agent-type has positive EV; running the job doesn't cohere with that type.  
  - Case 3: **Sue.** Coheres with "credible litigator" type (positive EV pre-infringement).  
  - Case 4: **Want the property.** The sandboxed copy *is* evidence of agent-type.  
  - Case 5: **Avoid pledge.** "Globally inflexible promisor" agent-type has negative EV due to client exploitation.  
  - Case 6: **Accept global D iff** the "universal promise-keeper" type has net positive EV *as an identity*. Your verdict (want it despite net loss) **fails** unless identity-value offsets material loss.  
  - Case 7: **Design correct.** Automated agent *is* its type; no identity conflict.  
  - *Case 8 (covert):* **Rational** if the implanted type has positive EV *for the installer*. But *you* aren't that agent-type constitutively.  
  - *Case 9 (degradation):* **Reject D** if the cognitively diminished agent-type has lower EV than alternatives.  

  **Sacrificed Verdict:** Case 3 (suing is "nearly pointless"). Principle demands acting coherently with the identity.  

  ---

  ### Principle 3: **Signaling Equilibrium Selection**  
  *"Adopt trait T iff:  
  (a) T is hard-to-fake evidence of behavior B,  
  (b) B maximizes utility in equilibrium when all agents have T,  
  (c) Your adoption of T doesn't alter others' traits."*  

  **Verdicts:**  
  - Case 1: **Pay.** T=promise-keeping, B=paying. Satisfies (a,b) in cooperative equilibrium.  
  - Case 2: **Reject.** Fails (a). "Intention" is faked without B.  
  - Case 3: **Sue.** T=litigation-credibility, B=suing. Satisfies (a,b) in deterrence equilibrium.  
  - Case 4: **Want T.** T is the hard-to-fake trait itself.  
  - Case 5: **Avoid pledge.** Fails (b). In equilibrium, inflexible promisors get exploited (client adjusts price).  
  - Case 6: **Reject global T.** Fails (b). Universal promise-keeping isn't an equilibrium (exploitable in case 5).  
  - Case 7: **Design correct.** T=source-visible reciprocity, B=cooperation. Satisfies (a,b) in published-agents ecosystem.  
  - *Case 8 (covert):* **Irrelevant.** Signaling requires conscious adoption.  
  - *Case 9 (degradation):* **Reject T** if cognitive loss reduces fitness in equilibrium.  

  **Sacrificed Verdict:** Case 6 (wanting global promise-keeping despite net loss). Principle requires equilibrium efficiency.  

  ---

  ### Reconciliation Attempt & Mandatory Sacrifice
  Your core conflict is **Case 1 vs Case 5**. All principles force a choice:  
  - **Principle 1 & 3** side with **Case 5**: The pledge is irrational because its EV is net negative (client exploitation > contractor gains).  
  - **Principle 2** sides with **Case 1**: Paying is rational if it coheres with a valuable agent-identity, *but* this requires accepting that identity might have net negative EV in Case 6.  

  **You must sacrifice one verdict:**  
  - If you keep **Case 1 (pay) AND Case 5 (avoid pledge)**, you must abandon **Case 6 (want global D despite net loss)**. This aligns with Principles 1 & 3.  
  - If you keep **Case 6**, you must abandon **Case 5** (accept the pledge, even if exploited). This aligns with Principle 2.  

  **Recommendation:** Adopt **Principle 1 (Instrumental Dispositionalism)**. It best matches your distributed systems mindset:  
  - Dispositions are "installed software" evaluated pre-deployment.  
  - Acts are "runtime output" – locally irrational but required for system integrity.  
  - Explains your discomfort in Case 7: The *designer's* rationality (pre-installation) differs from the *agent's* local state.  
  - Rejects Case 2 cleanly: Fake intentions aren't dispositions.  
  - Forces surrender of **Case 6 verdict** (global promise-keeping with net loss is irrational).  

  **Why Principle 1 over your draft?** It adds clause (b) and (c), which handle Cases 3 and 5. Your draft's clause (ii) (external commitments) is already a constraint. The key repair is clarifying that the act *is* irrational locally – but that’s the point of having D.

  ---
  **Final Implementation Logic (Principle 1):**  
  ```python
  def adopt_disposition(D, context):
      # Pre-installation EV calculation
      ev_D = expected_utility(having=D, knowledge="pre-deployment")
      ev_no_D = expected_utility(having=None, knowledge="pre-deployment")
      
      if ev_D <= ev_no_D:
          return False  # Fails clause (a)
      
      if not has_reliable_causal_link(D, act=irrational_local_act):
          return False  # Fails clause (b): D must force locally irrational acts
      
      if can_selectively_deactivate(D, context):
          return False  # Fails clause (c): D must be context-invariant
      
      return True

  # Usage: 
  if adopt_disposition(D="keep_promises", context="no_enforcement"):
      install(D)  # Then in-runtime: always execute D's output act
  else:
      use_external_commitment_if_cheaper()
  ```
