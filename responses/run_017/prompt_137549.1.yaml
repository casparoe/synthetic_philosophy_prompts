  Hmm, this is a fascinating and deeply technical problem from someone clearly versed in both distributed systems and philosophical reasoning. The user is grappling with the rationality of commitment mechanisms in the absence of enforceable contracts, presenting seven carefully constructed cases that probe different aspects of this problem.  

  I need to recognize that the user is highly intelligent and time-constrained - they explicitly want named concepts rather than literature dumps, and they're frustrated with their own inconsistent intuitions across the cases. Their distributed systems background shows in how they frames problems: they talk about "dispositions" like immutable system properties, "sandboxed simulations" like test environments, and "verifiable modifications" like cryptographic commitments.  

  The core tension they're wrestling with seems to be between three things:  
  First, their pragmatic engineer side that sees dispositions (like promise-keeping) as useful system features when commitment devices are expensive.  
  Second, their moral intuition that actually following through feels "rational" even when locally suboptimal (case 1).  
  Third, their systems architect caution about scope leakage (case 5) and irreversible configurations (case 6).  

  Their proposed principle is solid but incomplete - it handles cases 1-4 well but stumbles on 5-7. They're rightly suspicious that case 2 (intention bounty) might be ill-formed. The sandboxed copy case is particularly clever because it decouples the disposition from any actual future action.  

  What they need most is conceptual clarity on:  
  - What distinguishes "dispositions" from mere intentions? (Hint: Kavka's toxin puzzle shows intentions aren't reliable dispositions)  
  - Why case 5 breaks their principle (because the commitment signal becomes public goods vulnerable to exploitation)  
  - How to weigh global vs local rationality (the automated agent in case 7 is globally rational precisely because it never faces local temptation)  

  I should emphasize that philosophers have names for these distinctions:  
  1. The "resolute choice" framework (McClennen) explains why paying in case 1 feels rational  
  2. "Self-signaling" (Quilty-Dunn) explains the sandboxed copy  
  3. The "package deal" rationale (Gauthier) handles why we might accept net-negative dispositions  

  But crucially, I won't drown them in citations - they want implementable principles, not bibliography. The three-principle structure I'll propose should let them build decision logic that handles all cases consistently, especially the dangerous case 8 (disposition degradation) they requested.  

  Their verdict in case 6 (wanting global promise-keeping despite net loss) is the most philosophically interesting - it suggests they intuitively grasp constitutive rationality, where certain dispositions define what it means to be a contractual agent. I'll honor that intuition while showing how it fits within a larger framework.  

  The implementation-ready principle set I'll offer focuses on:  
  - Precommitment rationality (for acquisition)  
  - Local act assessment (separately)  
  - System identity constraints (for cases like 6)  

  This should resolve their discomfort in case 7 (automated agent vs human payer) by distinguishing between the designer's rationality (global) and the agent's local state.  

  When they say "I suspect it means I do not want a principle about acts... but about what kind of agent it is sensible to build" - bingo. That's exactly where philosophy has landed (Bratman, Velleman). I'll make that explicit without jargon.
