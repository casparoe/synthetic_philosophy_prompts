  Table:

  | q_number | question_as_I_say_it | the_move_it_forces | her_likely_answer | follow_up_keyed_to_that | escape_hatch_shell_use |
  |----------|----------------------|-------------------|-------------------|-------------------------|------------------------|
  | 1 | In my dissociative access syndrome, conductors show fine-grained sensorimotor responses to visual stimuli but deny seeing anything. They can't report it or use it as a reason. How does this fit your view that consciousness is global availability? | Forces her to address the specific case. She must say whether the information is globally broadcast or not. | She might say that the information is partially broadcast to sensorimotor systems but not to the full global workspace for report. | If it's partially broadcast, does that mean they are partially conscious of the stimulus? And if so, what does that partial consciousness feel like? | If she denies it's broadcast at all, ask: How can they use the information for action if it's not broadcast? |
  | 2 | You've said that phenomenal consciousness is the subject's relation to the broadcast state. In these conductors, what is the subject's relation to the sensorimotor information they're clearly processing? | Forces her to apply the relation move to the specific split. | She might say that the subject does not have the right relation because the information isn't broadcast to the systems that support the relational state (e.g., executive systems). | But isn't the relation supposed to be to the broadcast state? If the sensorimotor information is broadcast to some systems, why doesn't that count as a relation to the broadcast state? | If she says the relation requires a higher-order state, push: What is the minimal relation? |
  | 3 | There's a debate about where the neural correlates of consciousness are: in front in the broadcast systems or further back in sensory cortex. What does your view need the answer to be? | Forces her to commit to where the NCC must be for GWT. | She will likely say it must be in the front because broadcasting is done by front systems. | But if we found that activity in sensory cortex alone, without front activation, correlated with conscious reports, would that challenge your view? | If she says it's the front plus sensory, note that in no-report paradigms sensory activity can be sufficient. |
  | 4 | No-report paradigms aim to find neural correlates without asking the subject. How does that change the search for the neural basis of consciousness? | Forces her to address the possibility of consciousness without report. | She might say that no-report paradigms still require that the information is globally available, even if not reported. | But in my conductors, the information is globally available for action but not report. How is that different? | If she says report is a marker, push: What if we have a no-report marker? |
  | 5 | If I build a machine with a global workspace architecture that broadcasts information to all its modules, would it be conscious? | Forces her to address artificial systems and the relation move. | She might say that the machine would have functional equivalence but without the biological basis for the relation, it wouldn't be conscious. | But if the relation is just the functional role of broadcasting, why wouldn't the machine have that? | If she says it's about implementation, ask: What specific biological properties are needed? |
  | 6 | What evidence would make you give up global workspace theory? | Forces her to state falsifiable conditions. | She might say evidence that information is globally available but without any phenomenal feel, or vice versa. | In my conductors, we have global sensorimotor availability without phenomenal feel (as per their denial). Isn't that exactly such evidence? | If she says the conductors might still have a partial feel, push: How do we test that? |
  | 7 | On the sensorimotor/editorial split: In the conductors, the sensorimotor systems are getting the information and using it, but the editorial systems aren't. Is that a case of broadcast without consciousness? | Forces her to decide if broadcast to some systems is enough. | She'll likely say that full consciousness requires broadcast to the editorial systems. | But then what about blindsight? In blindsight, they don't have sensorimotor access in the same way, but in conductors they do. How are they different? | If she says blindsight is not broadcast, then conductors might be a new category. |
  | 8 | If the subject in conductors has no relation to the sensorimotor broadcast, what is the difference between that broadcast and unconscious processing? | Forces her to define the relation more clearly. | She might say that the relation requires the broadcast to be available to the self systems. | But in the conductors, the sensorimotor systems are part of the self. They are using the information to guide action. Why isn't that a relation? | If she says it's a different kind of relation, push for a criterion. |
  | 9 | In no-report paradigms, we see neural activity that we take as a marker of consciousness. In conductors, we see that same activity for sensorimotor but not for report. Is that activity conscious? | Links no-report and conductors to force a stance. | She might say that the activity in conductors is not the full global broadcast, so it's not conscious. | But in no-report paradigms, we don't have report and we still call it conscious. Why the difference? | If she says no-report uses other indicators, then in conductors we have those indicators (sensorimotor). |
  | 10 | Finally, let's say we have a machine with global workspace and it passes all functional tests. You might say it lacks the biological relation. But if we built it with a simulated brain in a vat that had the same neural patterns, would it have the relation? | Pushes the machine case to the extreme. | She might say that simulation isn't the same as real biological processes. | So then is consciousness dependent on the physical substrate? And if so, doesn't that make it non-functional? | If she says it's about the right kind of implementation, ask how we could know. |

  Now, we have 10 questions. We must ensure we cover the required topics.

