prompt: |-
  I write novels — mostly near-future medical stuff, the kind where somebody invents a syndrome so a plot can happen — and for the new one I've made up a condition I'm calling dissociative access syndrome. The patients (my neurologist calls them "conductors") pass every test you'd give for whether a visual state is globally available: they name the shape, hold it in mind, bet money on it, use it to plan a reach. But they flatly deny seeing anything, they never volunteer the stimulus, and here's the bit I invented and want stress-tested: they keep fine-grained sensorimotor uptake. Grip aperture tracks the object's size, pupils and microsaccades respond to it, they learn its statistics over days — but none of it ever gets to the point where they could cite it as a reason for anything they do or say. In the vocabulary I've been making up: sensorimotor access without editorial access.

  Next week I'm interviewing a philosopher of mind for a little thing I do where I interrogate the people I've been robbing. She's a global workspace theorist of the strong kind: phenomenal consciousness just is global availability — what a state's being broadcast feels like from the inside — and Block's access/phenomenal distinction marks a real difference in our concepts but not a gap that anything further has to fill. Her go-to move when you press her on why broadcasting should feel like anything at all is to say: you're treating "feels like" as a property of the state instead of as the subject's relation to her own broadcast state. She is extremely good at that move and it gets her out of everything. It's occured to me that she can also always say my conductors are just broadcasting weakly or partially, so I need to be ready for that too.

  Draft me eight to ten questions I can say out loud, in the order I should ask them, that make her say something specific about my conductors instead of restating her view, and that make the relation move progressively harder to use. At least one each on: whether my sensorimotor/editorial split is something she can use or something that definately breaks her; the fight in the literature about whether the neural correlates that track conscious perception sit up front in the broadcast systems or further back in sensory cortex (don't adjudicate it and don't name papers — I just want her to say what her view needs the answer to be); the no-report paradigms, i.e. the attempts to get at the correlates without asking the subject anything; the machine with a workspace architecture that my book also has, and whether it would be conscious; and, last, what evidence would make her give the view up. For each question give me the follow-up keyed to the answer she's most likely to give, since she always answers with the relation move and I need the next sentence ready.

  Give me the questions as a Markdown table, one row per question, with columns in exactly this order and these names: q_number | question_as_I_say_it | the_move_it_forces | her_likely_answer | follow_up_keyed_to_that | escape_hatch_shell_use. Max two sentences per cell, no citations, no paper titles, no names of living researchers. After the table, one small JSON object with the fields: "her_best_line" (the strongest sentence she'll manage in reply to any of these), "hidden_assumption" (the one thing her view needs that my conductors put pressure on), "weakest_question_number" (the row she gets out of most easily, and why), and "thing_I_should_cut" (one question to drop because it's philosophy-speak and will kill the episode).
reasoning: |-
  We are creating a table of questions designed to challenge a global workspace theorist (GWT) on the invented condition "dissociative access syndrome". The goal is to force her to address the specific case of "conductors" who show sensorimotor access without editorial access (i.e., without the ability to report or use the information as a reason). We want to make her "relation move" (treating phenomenal consciousness as the subject's relation to the broadcast state) progressively harder to use and to get her to say something about the conductors.

  The questions must cover:
  1. Whether the sensorimotor/editorial split is useful or breaks her theory.
  2. The neural correlates debate (front in broadcast systems vs. back in sensory cortex) without naming papers or adjudicating.
  3. No-report paradigms.
  4. A machine with workspace architecture (from the book) and whether it would be conscious.
  5. What evidence would make her give up her view.

  Each row in the table must have:
  - q_number: the question number (1 to 8-10)
  - question_as_I_say_it: the exact question to say out loud (max 2 sentences)
  - the_move_it_forces: what this question forces her to do (max 2 sentences)
  - her_likely_answer: what she is most likely to say (using the relation move if possible) (max 2 sentences)
  - follow_up_keyed_to_that: the next question/statement to counter her answer (max 2 sentences)
  - escape_hatch_shell_use: a contingency if she doesn't give the expected answer (max 2 sentences)

  After the table, a JSON object with:
  - "her_best_line": strongest sentence she might say in reply to any of these
  - "hidden_assumption": the assumption in GWT that the conductors challenge
  - "weakest_question_number": the row she escapes most easily and why
  - "thing_I_should_cut": one question to drop because it's too jargon-heavy and would kill the episode

  We'll create 10 questions to cover the topics and have enough to push the relation move.

  Let's plan the questions:

  1. Start with the conductors: describe the syndrome and ask if it fits GWT.
  2. Press on the sensorimotor/editorial split: is it a problem?
  3. Ask about neural correlates: where does she think the neural activity for consciousness must be?
  4. No-report paradigms: how do they fit?
  5. The machine: would it be conscious?
  6. What evidence would make her give up GWT?
  7. Another on the split: if the information is globally available for sensorimotor but not for report, is it conscious?
  8. On the relation move: if the subject is related to the broadcast state, what is the relation in conductors?
  9. On the machine: if the machine has the architecture, does it have the relation?
  10. Final: what is the minimal condition for consciousness?

  But we must cover the required topics and force her to address the conductors.

