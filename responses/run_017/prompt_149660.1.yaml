answer: |-
  Below is a defended research-and-decision agenda for the Committee, structured by prioritization criteria and addressing your specific requirements. The agenda balances **constitutional significance**, **tractability**, **error cost**, and **delegatability**:

  ### Prioritization Criteria
  1. **Constitutional Significance (CS)**: How centrally the issue affects other parts of the charter, institutional legitimacy, or fundamental rights.  
  2. **Tractability (T)**: Feasibility of resolution in 9 months by non-philosophers (lawyers/civil servants).  
  3. **Error Cost (EC)**: Risk of irreversible harm due to entrenchment.  
  4. **Delegatability (D)**: Whether the issue can be deferred to later bodies without delegitimizing them.  

  Trade-offs: High CS + High EC mandates early resolution; High CS + Low T may require delegation; Low CS + High T suits early "quick wins"; High D enables deferral.

  ---

  ### **Ordered Agenda**  
  #### 1. **Resolve the Founding Paradox: Independence Referendum Franchise**  
     - **Why first?**  
       - *CS*: Maximal – the referendum triggers the charter’s legitimacy.  
       - *EC*: Catastrophic if flawed – a contested result invalidates the entire project.  
       - *T*: Moderate – requires procedural innovation, not metaphysical resolution.  
       - *D*: Zero – no body exists pre-referendum to delegate to.  
     - **Approach**: Adopt a *bootstrap procedure*:  
       - Use the *existing electoral roll* (including expatriates) as a provisional demos, given its prior institutional acceptance.  
       - Add *resident taxpayers* (including permit holders) via a time-limited registration process.  
       - **Reject regress-solving**: The discontinuity of independence necessitates a practical, not philosophically pure, starting point. Delegitimization risk is lower than paralysis.  
     - **Empirical flag**: Audit current roll accuracy (cost: 2 weeks).  
     - **Demote if**: Precedent settlements (e.g., decolonization accords) provide a validated roll (unlikely here).  

  #### 2. **Define the Core Demos: Subjection vs. Affectedness**  
     - **Why second?**  
       - *CS*: High – defines the default electorate for all decisions.  
       - *EC*: Severe – misalignment with state coercion risks systemic illegitimacy.  
       - *T*: Moderate-High – lawyers can operationalize "subjection" better than "affectedness."  
       - *D*: Low – delegating core membership criteria risks future gerrymandering.  
     - **Key conflict**: *Contracted coercion* (security firms, arbitrators) tests "subjection."  
       - **Recommendation**: Adopt a **modified subjection criterion**:  
         - Voting rights attach to individuals subjected to *state-authorized* coercion, regardless of private intermediaries.  
         - Codify minimum oversight of contractors (e.g., judicial review of codes) to validate state responsibility.  
       - **Reject affectedness** as primary: It is unbounded (e.g., water users abroad) and undermines state autonomy.  
     - **Empirical flag**: Review contract renewal rates/security provider conduct (cost: 4 weeks via audits).  

  #### 3. **Temporary Residents vs. Graded Membership**  
     - **Why third?**  
       - *CS*: Medium – affects social cohesion but not foundational legitimacy.  
       - *EC*: Moderate – long-term demographic risks if mis-set.  
       - *T*: High – actuarial data exists for residency patterns.  
       - *D*: Medium – delegation possible to electoral commission if criteria are clear.  
     - **Proposal reconciliation**:  
       - **Adopt domicile-year accrual** for residents (e.g., 0.2 votes/year, full at 5 years).  
       - **Reject avoidability discount**: Redundant with accrual – both address transience but accrual is more administrable.  
       - **Sunset clause compatibility**: Graded rights reset at reconventions – no conflict.  
     - **Leave open**: *Specific accrual rates* – delegate to electoral commission with legislative approval.  
     - **Empirical flag**: Model migration churn (cost: 3 weeks; data from permit databases).  

  #### 4. **Overlapping Constituencies vs. Sunset Clause**  
     - **Why fourth?**  
       - *CS*: Medium-Low – policy-specific electorates are novel but not existential.  
       - *EC*: Low-Medium – errors can be corrected at sunset conventions.  
       - *T*: Low – requires complex jurisdictional mapping.  
       - *D*: High – ideal for sunset convention deliberation.  
     - **Proposal collision**:  
       - **Overlapping constituencies undercut accrual**: If voting rights vary by policy, graded membership per individual becomes incoherent. *Recommend abandoning overlapping constituencies* – it creates administrative chaos and dilutes civic identity.  
       - **Sunset clause resolves regress**: Random selection severs dependence on prior demos; it is *not* self-referential. Prioritize this.  
     - **Delegation**: Task the sunset convention with considering overlapping constituencies.  

  #### 5. **External Stakeholders: Water Users & Neighboring State**  
     - **Why last?**  
       - *CS*: Low – external actors need voice but not membership.  
       - *EC*: Low – bilateral treaties can adjust allocations.  
       - *T*: Low – requires international negotiation, not constitutional law.  
       - *D*: High – delegate to future bodies with stakeholder input.  
     - **Mismatch handling**:  
       - Strongly affected but not subjected → **diagnostic of affectedness overreach**. Do *not* grant voting rights.  
       - **Solution**: Constitutional requirement for *bilateral water commissions* with consultative (not electoral) roles.  

  ---

  ### **Deliberately Leave Open: Expatriate Voting Thresholds**  
  - **Why indeterminacy?**  
    - *CS*: Low-Medium – expatriates’ ties weaken over time, but cutting rights abruptly causes backlash.  
    - *T*: Low – requires data on diaspora engagement (lacking now).  
    - *EC*: Low – can be adjusted legislatively pre-sunset.  
    - **Risk of haste**: Arbitrary cutoffs (e.g., "10 years abroad") may disenfranchise connected citizens. Delegating to an electoral commission with sunset review allows evidence-based calibration.  

  ---

  ### **Addressing Conflated Issues**  
  1. **Criterion vs. Procedure Regress**  
     - Devote **minimal time** to solving the regress philosophically.  
     - Focus on **bootstrap legitimacy** (e.g., hybridize prior rolls + new residency). Sharp discontinuity *requires* pragmatic authorization.  

  2. **Proposal Coherence**  
     - **Incompatible**: Domicile-year accrual + overlapping constituencies (graded membership collapses without unitary demos).  
     - **Redundant**: Avoidability discount + accrual (accrual better operationalizes temporariness).  
     - **Synergistic**: Sunset clause + all others (resets errors, enables experimentation).  

  3. **Criterion-Procedure Mismatches**  
     - **Water users**: Diagnostic of affectedness overreach → delegate to bilateral bodies.  
     - **Contracted coercion**: Implementation friction → absorb via state oversight clauses.  
     - **Expatriates**: Leave unresolved → delegate with sunset review.  

  ---

  ### **Agenda Summary**  
  1. Independence referendum franchise (bootstrap solution).  
  2. Core demos criterion (subjection + contractor oversight).  
  3. Graded membership for residents (accrual model; rates delegated).  
  4. Sunset clause (adopt; random selection avoids regress).  
  5. External stakeholders (treaty-based consultation).  
  *Leave open*: Expatriate thresholds.  

  This sequence tackles legitimacy foundations first (1–2), then refines inclusion (3–4), and finally addresses externals (5). Each step resolves dependencies for the next while minimizing irreversible errors.
