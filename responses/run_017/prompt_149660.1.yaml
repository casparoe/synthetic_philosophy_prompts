  The key constraints are fascinating: a population of 2.1 million with 45% on temporary work permits, 12% expatriate voters, downstream water users in a neighboring state, privatized coercion functions, and a foundational paradox where the independence referendum's franchise derives from the very body it authorizes. The committee wants to combine four proposals - avoidability discount, domicile-year accrual, overlapping constituencies, and generational sunset clauses - but I need to assess whether they're coherent together.

