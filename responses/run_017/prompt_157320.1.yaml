prompt: |-
  A port city with its own legislative assembly decides some questions by binding referendum, and a standing Franchise Board fixes the demos separately for each referendum instead of applying one permanent franchise. On the last referendum, about harbour dues, its verdicts were: resident citizens, in; non-citizen residents of eight or more years' standing, in; seasonal workers present four months of the year, out; former residents who have moved away permanently and retain neither property nor tax liability, out; and, over recorded dissent, absentee owners of businesses registered in the port, who live abroad and visit twice a year, in. Its written reasons invoke two formulas: that the demos for a decision should contain everyone whose serious interests that decision will materially affect, and, in the case that produced the dissent, a nowhere-else-to-be-heard test — those whom no other assembly has any reason to weigh, because their own government will not take up their case and they have standing nowhere else.

  The next referendum is on closing the container port and returning the estuary to wetland. The question before the Board is whether to enfranchise the residents of a town twenty kilometres downstream, across the border in the neighbouring country, whose piped water and whose single large employer both depend on the estuary remaining open, and whose own government has shown no interest in their position. They are not subject to the city's laws, owe it no taxes, and cannot vote in its elections.

  Predict the Board's ruling on the downstream town, and say what it should rule if it wants to be consistent with its own record. Set out the competing rules explicitly — affectedness, subjection to the city's coercive power, durable stake or social membership, the nowhere-else-to-be-heard test, or something better — say which of them fit the earlier verdicts and which come apart on this one, name the single further case that would best tell the surviving rules apart, and identify which precedent is genuinely the closest analog. Finally, separate what is comparatively settled about the boundary problem from what is contested among people who work on it, and mark clearly whenever you are taking a contested side.
reasoning: |-
  Okay, I'm dealing with this complex scenario about a port city's Franchise Board and their decisions on who gets to vote in referendums. The user wants me to predict how they'll rule on enfranchising a downstream town in another country for a referendum about closing the port, while maintaining consistency with past decisions. 

  First I need to unpack all the moving parts here. The Board has used different criteria in past rulings: affected interests and this "nowhere-else-to-be-heard" test. For the harbor dues referendum, they included resident citizens, long-term non-citizen residents, and absentee business owners (despite dissent), while excluding seasonal workers and former residents. That dissent about absentee owners is particularly interesting - it shows internal disagreement about applying the nowhere-else test.

  Now the new case involves a foreign town 20km away whose water supply and major employer depend on the estuary remaining open. Their government doesn't care, they're outside the city's jurisdiction, no taxes, no voting rights. Classic boundary problem where political borders don't match affected communities.

  I'm mapping this against the Board's stated principles. The affectedness criterion clearly applies here - these townspeople are profoundly impacted. But the nowhere-else test is trickier. Unlike the absentee owners who had no home government representation, these folks theoretically could lobby their own government (even if it's disinterested). That might be the key distinction.

  For consistency, I think the Board has to enfranchise them. The harbor dues precedent with absentee owners sets a strong parallel - both are economically impacted groups without alternative representation. The downstream town actually has stronger affectedness (basic needs vs property interests) though weaker jurisdictional ties. 

  The user also wants me to propose a decisive test case - maybe something involving cross-border environmental harm where affected populations have partial representation. That would really tease apart whether the nowhere-else test requires complete lack of representation or just ineffective representation.

  What's fascinating here is how this fictional board is grappling with real democratic theory tensions: the all-affected principle vs practical sovereignty concerns. The absentee owner decision suggests they lean toward expansive inclusion when representation fails. If they reverse course here, it exposes inconsistency unless they clearly distinguish the cases.

  I should also flag where academic debates come in - like whether "affected interests" should include indirect economic impacts, or how to measure "serious" interests. The Board seems to interpret this broadly given their inclusion of absentee owners.
answer: |-
  Based on the Franchise Board's established precedents and stated principles, here's the analysis and prediction:

  1.  **Predicted Board Ruling:** The Board will **ENFRANCHISE** the downstream town residents.
  2.  **Ruling for Consistency:** To be consistent with its record, the Board **SHOULD ENFRANCHISE** them.

  **Competing Rules & Analysis:**

  The Board's record reveals the application (and potential conflict) of several rules:

  *   **Rule 1: Affectedness ("serious interests materially affected"):** The core principle explicitly stated.
  *   **Rule 2: Nowhere-Else-To-Be-Heard Test:** Explicitly invoked for the absentee owners.
  *   **Rule 3: Subjection to Coercive Power / Jurisdiction (Implied):** Used to exclude former residents (no property/tax liability) and include residents/citizens. Implicit in excluding non-residents generally.
  *   **Rule 4: Durable Stake / Social Membership (Implied):** Used to include non-citizen residents of 8+ years (durable presence likely implying integration/stake) and exclude seasonal workers (temporary presence).
  *   **Rule 5: Formal Citizenship/Legal Status (Implied):** Used to distinguish resident citizens from non-citizen residents.

  **Fitting the Earlier Verdicts:**

  *   **Resident Citizens (In):** Fits Rules 1 (affected by dues), 3 (subject to laws/taxes), 4 (durable stake), 5 (citizenship).
  *   **Non-Citizen Residents 8+ Years (In):** Fits Rules 1 (affected), 3 (subject), 4 (durable stake implied by duration). *Contrasts* with Rule 5 but shows it's not absolute.
  *   **Seasonal Workers (Out):** Fits Rules 3 (less subject? temporary), 4 (lack durable stake/social membership). *Contradicts* Rule 1 (they *are* materially affected during residency) – showing Rule 1 alone isn't sufficient; Rules 3 & 4 override limited affectedness.
  *   **Former Residents (Out):** Fits Rules 3 (no longer subject), 4 (no longer durable stake/member). *Contradicts* Rule 1 if past dues/residence created ongoing effects, showing Rules 3 & 4 override past affectedness.
  *   **Absentee Owners (In):** Fits Rule 1 (materially affected financially) and **Rule 2 (nowhere else to be heard: own gov't won't take up case, no standing elsewhere)**. *Contradicts* Rules 3 (not subject to laws/taxes as residents), 4 (no durable stake/social membership), and 5 (not citizens/residents). This case prioritizes Rules 1 & 2 over Rules 3, 4, and 5.

  **The Downstream Town Case:**

  *   **Rule 1 (Affectedness):** **STRONG FIT.** Closure directly and materially affects their water supply and primary employment – arguably a more fundamental "serious interest" (survival, livelihood) than the absentee owners' financial interests.
  *   **Rule 2 (Nowhere-Else-To-Be-Heard):** **FIT.** Their own government "has shown no interest in their position." Like the absentee owners, they have no other assembly where their interests on *this specific matter* will be weighed. Their government's disinterest parallels the absentee owners' government disinterest.
  *   **Rule 3 (Subjection/Jurisdiction):** **NO FIT.** They are not subject to the city's laws, taxes, or jurisdiction.
  *   **Rule 4 (Durable Stake/Membership):** **NO FIT.** They are not residents or members of the port city's society.
  *   **Rule 5 (Formal Status):** **NO FIT.** They are not citizens or residents.

  **Consistency Requirement:** The absentee owner precedent (In) demonstrates that when Rule 1 (Affectedness) and Rule 2 (Nowhere-Else-To-Be-Heard) are strongly satisfied, the Board overrides the lack of fit with Rules 3, 4, and 5. The downstream town case satisfies Rule 1 even more strongly (basic needs vs. property income) and Rule 2 identically (own government disinterest). **Excluding them would be inconsistent** with the logic applied to the absentee owners. The dissent over the absentee owners likely centered on the *departure* from Rules 3/4/5; applying that dissent logic here would exclude the town, but the *majority ruling* established the precedent that Rules 1 & 2 *can* override 3/4/5.

  **Key Differentiating Case:**

  The **single further case** that best tells the surviving rules (Affectedness + Nowhere-Else vs. Subjection/Stake) apart would be:

  *   **Residents of a town 50km *upstream* in the *same country*, whose drinking water source (a tributary) would be severely polluted by proposed new port industries. Their national government *is* actively lobbying the port city on their behalf.**

  **Analysis of this Test Case:**

  *   **Rule 1 (Affectedness):** STRONG FIT (water pollution).
  *   **Rule 2 (Nowhere-Else):** **NO FIT.** Their own government *is* taking up their case. They *do* have another assembly (their national government) with reason to weigh their interests.
  *   **Rule 3 (Subjection):** **NO FIT** (outside jurisdiction).
  *   **Rule 4 (Stake):** **NO FIT** (non-residents).
  *   **Rule 5:** **NO FIT.**

  **Prediction:** The Board would **EXCLUDE** these upstream residents. The lack of fit with Rules 3/4/5 remains, but crucially, Rule 2 (Nowhere-Else) is *not* satisfied because their government *is* advocating for them. This contrasts sharply with the downstream town and absentee owners cases where Rule 2 *was* satisfied. This case highlights that Rule 2 is essential alongside Rule 1 to override the exclusionary rules (3/4/5).

  **Closest Analog:**

  The **genuinely closest analog** is the **Absentee Owners**. Both involve:
  *   Strong material affectedness (Rule 1).
  *   No subjection to the city's jurisdiction/laws/taxes (Rule 3).
  *   No durable stake/social membership in the city (Rule 4).
  *   No formal status (Rule 5).
  *   A government that will not represent their specific interests regarding the port city's decision (Rule 2).

  The downstream town's interests (water, jobs) are arguably more fundamental than the absentee owners' (property income), strengthening the case for inclusion under Rule 1, but the *structural parallels* under the Board's stated formulas are clear.

  **Settled vs. Contested in Boundary Problems:**

  *   **Comparatively Settled:**
      *   The core problem: Political boundaries rarely align perfectly with the scope of affected interests ("the boundary problem").
      *   The "All-Affected Principle" (AAP - similar to Rule 1) is a widely recognized, though highly contested, *starting point* for democratic inclusion.
      *   Subjection to coercive power (Rule 3) is a traditional and strong basis for enfranchisement (e.g., all resident citizens).
      *   There is no single, universally accepted solution; different principles (affectedness, coercion, stakeholding) conflict in practice.

  *   **Contested (Marking Contested Views):**
      *   **The Scope of "Affectedness" (Rule 1):** What counts as a "serious interest"? How "material" must the effect be? (e.g., Is economic dependence sufficient? Is environmental impact sufficient?) *[Contested - The Board's inclusion of absentee owners suggests a broad view, but others argue for a stricter "direct and specific" impact.]*
      *   **The Necessity/Sufficiency of "Affectedness":** Is affectedness necessary for inclusion? Is it sufficient? *[Contested - The Board's exclusion of seasonal workers shows they don't see it as sufficient; inclusion of absentees shows it can be sufficient with Rule 2. Many theorists argue affectedness is necessary but not sufficient.]*
      *   **The "Nowhere-Else-To-Be-Heard" Test (Rule 2):** This is **highly contested and arguably innovative** in this form. Key questions:
          *   How do we determine if another assembly "has reason to weigh" an interest? (e.g., Does a government's *disinterest* mean it has *no reason*, or just that it's failing its duty?)
          *   Is this a desirable principle? Doesn't it potentially create perverse incentives for governments to neglect citizens to disenfranchise them elsewhere? *[Contested - The Board adopted it for absentees, implying acceptance, but the dissent shows internal controversy.]*
      *   **The Weight of Subjection/Stake (Rules 3 & 4) vs. Affectedness (Rule 1):** Should territorial jurisdiction and social membership *always* override external affectedness? *[Contested - The Board's absentee owner decision shows they sometimes allow Rule 1 (+ Rule 2) to override Rules 3/4. Many democratic theorists prioritize jurisdiction/stake.]*
      *   **The Democratic Legitimacy of Including Non-Subjects:** Does including people not subject to the laws undermine the coherence of the demos or the legitimacy of the decision for those who *are* subject? *[Contested - Inclusion of absentees and potentially downstream towns directly challenges the traditional view tying voting to subjection.]*

  **Conclusion:** The Franchise Board's precedent with the absentee owners, driven by the combination of material affectedness and the nowhere-else-to-be-heard test, strongly points towards the inclusion of the downstream town residents for the estuary closure referendum. Consistency demands this outcome, as the downstream town satisfies both key criteria used to justify the controversial inclusion in the prior case, arguably to an even greater degree concerning affectedness. The core tension lies between the expansive logic of affectedness + representation gaps and the restrictive logic of territorial jurisdiction and social membership. The upstream test case highlights the critical role of the nowhere-else test in the Board's current approach.
