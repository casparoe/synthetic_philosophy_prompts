prompt: |-
  I have just spent an evening arguing with a friend about Rhodes Must Fall, and I would like the argument settled properly rather than repeated. Take the facts as I stipulate them: the campaign began in March 2015 at the University of Cape Town, where within a month the council had voted the statue of Cecil Rhodes off its plinth; the parallel campaign at Oriel College, Oxford produced the opposite result — a vote to remove, then years of delay, expense and regulatory obstruction, and in the end not removal but a promise to keep the statue and add explanatory context to it.

  My friend's position is that the three kinds of history Nietzsche sets out in his essay on the uses and disadvantages of history for life are all one needs here: the statue is monumental history in bronze, the college's attachment to it is antiquarian piety, the campaign is critical history breaking a past that burdens life, and the Oxford compromise is antiquarianism wearing critical clothes. I think the scheme fits less neatly than that. Nietzsche's monumental history runs on great deeds and exemplary achievers, on a chain of human greatness that gives the present something to emulate; what the campaigners were building, first with a defaced statue and then with an empty plinth, is a monument to the wronged rather than to the great. Take that as a working notion — monumental history of the injured — and take it seriously rather than nodding at it.

  Analyze the episode through the threefold scheme and then tell me where the scheme fails. I want the mapping done carefully: which mode the statue itself belongs to, which mode the demand for removal instantiates, which mode contextualization is, and what Nietzsche's own test, service to life, would actually prescribe here, and for whom. Then run it in the other direction: does the case confirm the scheme, is it an anomaly inside it, or is it a kind of case the scheme never anticipated? In particular I want answers on three points — whether a criterion of life can adjudicate between two parties whose historical needs conflict, whether critical history can do its work at all without some antiquarian attachment to what it destroys, and whether monumental history of the injured rescues the framework or exposes a hole in it. Where the scheme is silent, say so instead of making it speak. No literature survey, and nothing I would have to look up: the facts are as I have given them, and the argument is what I am after.
reasoning: |-
  Okay, the user presents a sophisticated debate about the Rhodes Must Fall movement analyzed through Nietzsche's three historical modes. They've clearly engaged deeply with both the real-world events and Nietzsche's philosophy, and want a rigorous application of the framework to this specific case. 

  Hmm... the user seems frustrated with superficial applications of Nietzsche's categories. They specifically reject their friend's neat mapping where: statue = monumental, college = antiquarian, campaign = critical, compromise = hypocritical antiquarianism. The user insists we take seriously their concept of "monumental history of the injured" - that empty plinth as a monument to victims rather than heroes. That's the crucial pivot.

  I notice three unspoken tensions in their query: First, they're wrestling with whether philosophical frameworks can resolve real political conflicts. Second, they suspect Nietzsche's individualism can't handle collective historical trauma. Third, they're testing if "life" as Nietzsche's metric is fundamentally contested. 

  The analysis must avoid textbook recitation. User wants the framework stressed until it creaks. Key challenges: Nietzsche's monumental history requires emulation, but who emulates victims? Antiquarian preservation seems passive, yet contextualization actively reshapes meaning. Critical history destroys, but the campaign built new symbols. 

  Most importantly: Nietzsche's "life" criterion assumes cultural unity. But Cape Town's swift removal served Black students' need for dignity, while Oxford's compromise served traditionalists' continuity. How to weigh "life" for oppressed vs establishment? The scheme breaks when historical needs conflict irreconcilably.

  The "monumental history of the injured" exposes a hole. Nietzsche conceived history as fuel for present action, but trauma monuments serve different functions - acknowledgment, warning, repair. That requires a fourth category: not just monumental, antiquarian or critical, but perhaps penitential history. I'll note this stretches Nietzsche beyond his intentions.

  On contextualization: it's neither pure antiquarianism (which preserves uncritically) nor critique (which destroys). It's dialectical - making the artifact speak against itself. Nietzsche didn't anticipate museums as sites of controlled critique. 

  Final insight: The framework fails at power analysis. Nietzsche wrote for cultural renewal, not colonial reckoning. When the statue's presence actively harms some while its removal harms others' sense of continuity, "life" becomes partisan. No neutral application possible. That's why Cape Town and Oxford diverged - different balances of social power.
answer: |-
  Your analysis is correct: Nietzsche's tripartite scheme strains under the weight of this case, particularly regarding the "monumental history of the injured." Here's a strict application followed by its points of failure:

  **Nietzschean Mapping:**
  1.  **The Statue Itself (Original):** **Monumental History.** It embodies the traditional view: Rhodes as an exemplar of imperial achievement, power, and civilizational mission – a figure to be emulated within the framework of Empire and Oxford's own institutional prestige.
  2.  **The Demand for Removal:** **Critical History.** It directly attacks the statue's monumental meaning. Campaigners see Rhodes not as great but as a symbol of colonial violence, racism, and ongoing harm. Removal is the act of breaking this oppressive past to liberate the present ("life") from its burden – specifically, the burden of institutional glorification of oppression felt acutely by Black students and others.
  3.  **Contextualization (Oxford Outcome):** **Antiquarianism wearing Critical clothes.** The *decision to keep* is fundamentally antiquarian – preserving the physical artifact as part of the institution's heritage and fabric. The *added context* attempts a critical gesture – acknowledging harm. However, by leaving the statue dominant on its plinth, the compromise prioritizes preservation (antiquarianism) over the critical act's demand for tangible rupture. The critical element is contained, becoming an explanatory footnote rather than transformative action.
  4.  **Nietzsche's Test: Service to Life?** This is where the scheme falters most severely:
      *   **For the Campaigners:** Removal *clearly* serves life. It actively dismantles a symbol causing harm (psychological, symbolic exclusion) and creates space for a new narrative (the empty plinth as a monument to the injured). It energizes their struggle for recognition and justice.
      *   **For the College Establishment/Opponents:** Preservation (with or without context) serves *their* sense of life. It maintains institutional continuity, tradition, and an aesthetic/historical landscape they value. Context might even feel like a critical concession serving a broader, more "inclusive" institutional life.
      *   **The Conflict:** Nietzsche's "life" is individual/cultural but lacks a mechanism for adjudicating *fundamentally opposed* understandings of what "life" requires. Whose life takes precedence? The scheme assumes a relative cultural homogeneity Nietzsche addressed; it cannot resolve conflicts rooted in power imbalances and radically different historical experiences within the same space.

  **Testing the Scheme Against the Case - Does it Hold?**
  1.  **The Campaign as Monumental History of the Injured:** This is the critical anomaly.
      *   **The Scheme Never Anticipated This:** Nietzsche's monumental history is inherently affirmative and future-oriented – great deeds inspire *emulation* and striving. A "monument to the injured" serves a profoundly different function: remembrance of suffering, accusation, demand for justice, and *warning*. It doesn't inspire emulation of the victims' suffering but rather emulation of the *resistance* to that suffering. The empty plinth isn't a beacon for future achievement in the same vein as a statue of a hero; it's an indictment and a call for change. This exposes a hole: Nietzsche's framework lacks a category for monuments that serve life primarily through *critical remembrance* rather than affirmative inspiration.
  2.  **Can Critical History Work Without Antiquarianism?**
      *   **The Scheme is Silent/Implies Dependence:** Nietzsche sees the modes as intertwined. Critical history needs something tangible *to* critique – the antiquarian object provides the material. The Rhodes Must Fall campaign *depended* on the statue's antiquarian preservation; its continued presence *was* the provocation. Destroying a forgotten, buried artifact lacks the same power. However, the campaign's *goal* was severance, not preservation-for-critique. Oxford's contextualization *does* attempt this fusion, but its perceived failure by campaigners highlights that critical history, in its most radical form (removal), may see antiquarian preservation as the *enemy* of its life-serving purpose, not a prerequisite.
  3.  **Adjudicating Conflicting Historical Needs via "Life"?**
      *   **The Scheme Fails Utterly Here:** As noted above, Nietzsche offers no metric for this. "Life" is the criterion, but *whose* life and *which* vision of life? The scheme describes modes of engagement, not a tool for resolving clashes between groups whose very sense of vitality and identity are threatened by opposing historical treatments of the *same* object. The Cape Town removal served the "life" needs of the marginalized majority on campus more decisively. Oxford's compromise attempted (and arguably failed) to balance irreconcilable "life" claims, exposing the framework's inability to prescribe a solution in the face of such conflict.

  **Conclusion: Anomaly and Exposed Hole**
  *   **The case confirms the basic descriptive power** of the three modes for identifying the *types* of historical forces at play: the statue's original purpose (monumental), the college's attachment (antiquarian), the campaign's method (critical), and the compromised outcome's nature (antiquarian with critical veneer).
  *   **However, it is a significant anomaly** regarding the *content* and *purpose* of monumental history. The "monumental history of the injured" – manifested in the defaced statue and the empty plinth as sites of counter-memory and accusation – falls outside Nietzsche's conception of greatness to be emulated. This exposes a hole in his framework: it lacks a category for monumental remembrance *defined by suffering and resistance*, rather than affirmative achievement.
  *   **The scheme fails critically** on Nietzsche's own ultimate test ("service to life") in pluralistic, conflict-ridden contexts. It cannot adjudicate between fundamentally opposed understandings of what "life" requires when faced with a contested symbol. The divergent outcomes in Cape Town and Oxford stem directly from differing power dynamics and whose "life" needs were prioritized, a calculus Nietzsche's individualistic/cultural framework doesn't provide.
  *   **Critical History's Relationship to Antiquarianism** is shown to be more antagonistic than Nietzsche perhaps envisioned in practice. While critique needs its object, radical critical movements often seek the object's *destruction* precisely because its preserved presence *is* the harm.

  **In essence:** The scheme usefully labels the players and their initial motivations, but it is ruptured by the campaign's creation of a new monumental form (the history/plinth of the injured), rendered incoherent by the irreconcilable conflict over whose "life" is served, and demonstrates that radical critical history may view antiquarianism not as a foundation but as an obstacle to be removed.
