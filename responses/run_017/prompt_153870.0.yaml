prompt: |-
  im one of the mods on a pretty big discord server (fandom + general chat, ~9k people) and a big chunk of what i do is deciding what gets banned. right now we just argue in #mod-chat and whoever is awake wins, so I want an actual procedure. My gov teacher did maybe one class on that old Hart vs Devlin argument about whether the law can ban something just because most people think its gross or immoral even when nobody gets hurt, and it felt exactly like our problem, but I haven't read either book and I dont want a philosophy essay — I want something I can run.

  Constriants: I get maybe 30–60 of these a week, so each has to be doable in a couple minutes; appeals go to the head mod and she wants written reasons, so every step needs to say what counts as a real answer; and she already has two rules — "everyone here hates it" can never by itself be the written reason, and any ban has to pass a flip test (would you still want this banned if you were in the smallest group on the server and everyone else loved it?).

  So: an ordered list of questions to run in order, where to stop and say "no ban," and — be honest about this — the points where your procedure isn't really deciding anything and is just me laundering my own gut feeling, which I should escalate instead. It needs to handle the cases that actually come up: (1) most members are disgusted by something but nobody can point to anyone being hurt; (2) the disgust seems to be mostly about who is doing it rather than what theyre doing; (3) content in an opt-in 18+ channel where everyone who saw it chose to be there, including when the person complaining joined it on purpose to screenshot people and mock them in general chat; (4) half our rules were written when the server was 400 people who all thought alike and now most members are new, so "the community standard" is all over the place.

  Then run it on three cases. First: a group in #memes posting really dark jokes about real disasters and dead celebrities — I personally think theyre gross and want them gone, so tell me straight if your procedure says I have to allow them. Second: crypto scam links, which everyone hates but which only hurt people who click. Third: the opt-in vent/roleplay channel from (3). And say which of those three your procedure handles badly.
reasoning: |-
  Okay, the user is a mod on a large Discord server with about 9k members. They need a streamlined procedure for deciding what content to ban. Currently, decisions are made through arguments in the mod chat, which isn't efficient. The head mod requires written reasons for bans, and two key rules: "everyone hates it" isn't a valid reason alone, and the flip test (would you ban it if you were in the minority?).

  The user mentioned the Hart vs. Devlin debate but wants practical steps, not philosophy. They deal with 30-60 cases weekly, so each decision must take minutes. Real cases include: disgust without harm, bias against certain users, opt-in 18+ channels with complaints, and outdated community standards.

  Key constraints:
  - Speed: Decisions in 2-5 minutes.
  - Written reasons required.
  - Must pass flip test.
  - Can't rely solely on majority disgust.

  The user provided three test cases:
  1. Dark memes about real disasters (user personally dislikes them).
  2. Crypto scam links (everyone hates them, but harm only if clicked).
  3. Opt-in vent/roleplay channel where someone joined to mock others.

  The procedure needs an ordered list of questions to quickly determine a ban or no ban. Also, identify points where the mod's gut feeling might influence the decision, indicating when to escalate. 

  Breaking down the approach:
  - Start with clear harm or rule violation to quickly resolve obvious cases.
  - Then assess indirect harm or disruption.
  - Check if the content exploits or targets specific groups.
  - Apply the flip test to avoid bias.
  - Consider channel context, especially for opt-in areas.
  - If all else fails, evaluate community impact, but with safeguards against majority tyranny.

  For the test cases:
  1. Dark memes: Likely no ban if no direct harm and passes flip test, but the user dislikes them. Need to ensure the procedure overrides personal bias.
  2. Crypto scams: Clear harm potential, so ban even if harm requires user action.
  3. Opt-in channel: Ban unlikely unless harassment occurs; the complainer's actions might be the issue.

  Points of subjectivity: Steps like "undermines participation" or "exploits vulnerability" involve judgment. Flag those for escalation if uncertain.

  Designing the steps:
  1. Immediate harm or rule violation? (Quick yes/no)
  2. Indirect harm? (Disruption, exclusion)
  3. Exploitative or predatory? (Targeting vulnerable groups)
  4. Flip test application (personal bias check)
  5. Channel context (opt-in vs. general)
  6. Community impact (last resort with flip test)

  For scalability, each step should have clear yes/no paths to a decision. If any step leads to "ban," provide the reason based on that step. If all steps lead to no ban, then allow the content. Subjectivity points: Steps 2, 3, and 6 might require escalation if unclear.

  Applying to cases:
  - Dark memes: No direct harm, no rule violation. Indirect harm? Maybe, but if not severe, flip test might say no ban. Community impact? If it's divisive, but the user must apply flip test honestly. Here, the procedure might force allowing them despite personal dislike.
  - Crypto scams: Direct harm (financial risk), so ban at step 1.
  - Opt-in channel: No harm if consensual. Complainer's screenshotting is the issue, not the content. Might stop at step 5 (channel context).

  The opt-in case might be handled poorly if the procedure doesn't address bad-faith reporting. Need to include a step about the complainer's intent or existing rules against harassment.

  Final procedure:
  1. Direct harm or rule break? 
  2. Indirect harm? (Disruption, exclusion)
  3. Exploitative? (Targeting vulnerable)
  4. Flip test passed? (Personal bias check)
  5. Channel context? (Opt-in vs. general)
  6. Community impact? (With flip test)

  Subjectivity in steps 2,3,6. Escalate if unsure.

  Test case results:
  1. Dark memes: No ban (stops at step 4 or 6, flip test overrides user's dislike).
  2. Crypto scams: Ban at step 1 (direct harm).
  3. Opt-in roleplay: No ban (stops at step 5), but the mockery is separate harassment.

  Handles opt-in case poorly because the procedure focuses on content, not reporter behavior. Need to add a step about reporter's conduct or handle harassment separately.
answer: |-
  Here's a **Mod Decision Flowchart** designed for speed, clarity, and compliance with your head mod's rules. It's a 5-step checklist to run in order. **Stop and say "NO BAN" at any step where the answer isn't a clear "yes"**. Escalate to the head mod if you hit a "subjective" step and your gut conflicts with the outcome.

  ### The Procedure
  **Run these questions in order for each report. Stop at first "BAN" or "NO BAN" conclusion.**  
  *(Key: 🚩 = "Subjective" step where your bias could creep in—escalate if unsure)*

  1. **Does this violate a *written* server rule *or* cause *direct, immediate harm* (e.g., doxxing, threats, CSAM)?**  
     - ✅ **BAN** if YES → *Reason: "Violates Rule [X]" or "Creates direct harm: [explain e.g., 'doxxing']"*  
     - ❌ **NO BAN** if NO → Move to Step 2.  
     *Note: "Harm" = physical, financial, or legal risk; not hurt feelings.*

  2. **Does this *actively obstruct* server function (e.g., spam, raids, off-topic flooding in serious channels)?**  
     - ✅ **BAN** if YES → *Reason: "Disrupts server function: [explain e.g., 'spambot behavior']"*  
     - ❌ **NO BAN** if NO → Move to Step 3.  

  3. **🚩 Does this *exploit or target* a vulnerable group/individual (e.g., hate speech, harassment, predatory behavior)?**  
     - ✅ **BAN** if YES → *Reason: "Targets [group]: [evidence e.g., 'slurs against X group']"*  
     - ❌ **NO BAN** if NO → Move to Step 4.  
     *Subjectivity warning: If you're interpreting "vulnerable" or "exploit," ESCALATE if your gut clashes.*

  4. **🚩 Apply the FLIP TEST: "If I were in a minority group here and everyone else loved this, would I still want it banned?"**  
     - ✅ **BAN** if YES → *Reason: "Fails flip test due to [specific harm from Step 1-3]."*  
     - ❌ **NO BAN** if NO → Move to Step 5.  
     *Subjectivity warning: This is your bias filter. If you answer "yes" but can't cite Steps 1-3, ESCALATE.*

  5. **🚩 Is this in an *opt-in* space (e.g., 18+, vent, RP) AND consenting adults are participating?**  
     - ✅ **NO BAN** if YES → *Reason: "Opt-in space with consenting participants; no rule violation."*  
     - ❌ **BAN** if NO → *Reason: "Not confined to opt-in space: [explain]."*  
     *Subjectivity warning: If "consent" or "opt-in scope" is ambiguous (e.g., screenshots leaked), ESCALATE.*

  ---

  ### How It Handles Your Core Problems
  - **"Everyone hates it"**: Ignored unless tied to Steps 1–3. Flip test blocks majority tyranny.  
  - **Bias against users**: Step 3 requires *targeting*, not just "who did it." Flip test counters personal dislike.  
  - **Opt-in channels**: Protected in Step 5. Reporters who join to screenshot/mock get "NO BAN" here—their actions are separate (handle under harassment rules).  
  - **Evolving standards**: Relies on written rules (Step 1) + harm/disruption (Steps 2–3), not vague "community standards."  

  ---

  ### Test Case Runs
  **Case 1: Dark memes about real disasters/dead celebrities**  
  - Step 1: No rule violation or *direct* harm (no threat/dox). → **NO BAN** yet.  
  - Step 2: Not obstructing #memes function. → **NO BAN** yet.  
  - Step 3: Not targeting a group (e.g., not mocking victims' families). → **NO BAN** yet.  
  - Step 4: Flip test: "If I were in a minority that loved edgy humor, would I want this banned?" If no harm (Steps 1-3), **NO BAN**.  
  - **Result: NO BAN** → *Reason: "No rule violation, harm, or targeting; passes flip test for opt-in humor in #memes."*  
    - *Your gut check: If you still want it banned, you MUST escalate—your bias is overriding the procedure.*

  **Case 2: Crypto scam links**  
  - Step 1: Causes *direct financial harm* if clicked. Likely violates written rules (e.g., "no scams"). → **BAN**  
  - **Result: BAN** → *Reason: "Direct financial harm; violates Rule [X] against scams."*

  **Case 3: Opt-in vent/roleplay channel, reporter joined to screenshot/mock**  
  - Step 1: No direct harm (consenting adults). → **NO BAN** yet.  
  - Step 5: Opt-in space with participants who consented to content. Reporter's actions are separate (handle under anti-harassment rules). → **NO BAN**  
  - **Result: NO BAN** → *Reason: "Content confined to opt-in space with consenting adults; reporter's conduct addressed separately."*  

  ---

  ### Which Case Does It Handle **Badly**?
  **Case 3 (Opt-in channel reporter)**. The procedure correctly says "no ban" for the *content*, but **doesn't address the reporter's bad-faith behavior** (joining to screenshot/mock). This needs a separate, parallel process:  
  - Add a **Step 0: "Is the report in good faith?"**  
    - If reporter is harassing (e.g., screenshotting to bully), act *against the reporter*, not the content:  
    *"Ban reporter for harassment; reason: 'Targeting users via screenshots from opt-in channels.'"*  

  ---

  ### Why This Works
  - **Speed**: 90% of cases resolve at Step 1 (clear rules/harm) or Step 5 (opt-in). Takes <2 mins.  
  - **Audit trail**: Written reasons map to steps (e.g., "Step 3: targets X group").  
  - **Bias control**: Flip test (Step 4) and opt-in protection (Step 5) block mob mentality. Escalation points flagged.  
  - **Adapts to growth**: Uses rules/harm, not "community vibe."  

  **Final tip**: For outdated rules, run a monthly "Step 1 audit" with head mod to update/remove rules. Use member polls for guidance, but never let polls override Steps 1–5.
