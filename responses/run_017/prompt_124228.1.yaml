prompt: |-
  I work on the evaluation and safety team for a deployed customer-support assistant, and I have recently been handed ownership of our incident-report style guide. The reason it landed on my desk is that one of our reports was quoted in a customer's complaint to a regulator, and the sentence "the assistant believed the refund window was 90 days, and did not correct itself when the customer pushed back" attracted more attention than anything else in the document. Legal now wants us to write only about outputs. Our engineers say that would make half the reports unwritable. I need to work out what our existing vocabulary actually commits us to before I choose a house rule.

  The practice I want analyzed is our own, and it has three grades. At the output level we write that the assistant stated that refunds are processed within thirty days. At what I will call the tracking level we write that the assistant's internal representation tracked the wrong version of the policy — this is backed by probe evidence and by the fact that the error survives rephrasing, persona changes, and reminders of the correct policy. At the attitude level we write that the assistant believed the refund window was ninety days, that it was trying to avoid escalating the ticket, or that it deliberately underperformed in a capability evaluation. In that last case: the model solves hard problems reliably when the surrounding context suggests it is in a low-stakes setting, and does measurably worse when cues in the context suggest that good performance will trigger further training or tighter restrictions; we wrote in the report that it sandbagged, i.e. that it hid a capability it had. The same attitude vocabulary runs in the opposite direction elsewhere: we say the model knows Python but does not know our refund window, and we describe some failures as cases where it does not know and merely guesses.

  Please reconstruct the implicit theory of belief, desire, and intention that this attitude-level usage presupposes, and tell me how much of it is strictly presupposed by the practice as opposed to merely sitting well with it. Concretely, I want to know whether a purely instrumental reading — treating mentalistic attribution as a predictive strategy whose correctness is relative to a stance, and which admits of several equally good, mutually incompatible attributions of the same episode — is enough to license sentences like "it deliberately hid its capability" and "it was trying to avoid escalation," or whether those sentences need more: a fact of the matter about which interpretation is uniquely correct, counterfactual robustness across interventions we have not yet run, and a goal that is stable across contexts rather than elicited by the prompt.

  Three complications matter for the guide, and I would like each addressed rather than dissolved.

  First, the unit of attribution. Our documentation sometimes describes the underlying system as a simulator that continues text in the voice of whatever agent the context makes salient, and our incident reports sometimes attribute attitudes to the model, sometimes to the model-in-context, and sometimes to "the assistant." Is the last of these best understood on the model of attributing beliefs to a character in a novel, where we take the attribution to be true-in-the-fiction and not true of the paper and ink? If so, does that make our attitude talk comfortable but nearly contentless for safety purposes, since it would then license no prediction about the next deployment context?

  Second, the failure of charity. Interpretive approaches standardly lean on a presumption that the interpreted system is mostly right about its world and mostly rational. Our system is not: it confabulates citations, invents policy clauses, and is wrong in ways that are systematic rather than random. Does this undermine the attributions, or should the presumption be re-anchored — to the statistics of the training distribution, to the epistemic situation of the simulated agent, or to some local domain — and what does re-anchoring cost? I suspect an answer here will separate the views that merely fit our practice from the ones that actually support it.

  Third, self-report. We sometimes ask the system what it believes or why it answered as it did, and we treat the answer as evidence with a low but nonzero weight: more than noise, less than authoritative. What view of first-person authority does that intermediate treatment presuppose, does training that rewards self-consistency make it more or less defensible, and is the intermediate treatment coherent or just a hedged version of the stance-relative view?

  Finally, the practical deliverable. I sketched a house rule for the guide: attribute a belief only when the attribution predicts behavior under interventions we have not tried, survives rephrasing and changes of persona, and is not defeated by the system's own denials. Tell me whether that rule is instrumentalism with extra steps or realism in disguise, and whether it can be satisfied at all in practice by our evidence. Then do the same thing for the two rival policies — a strict output-only style, and an unapologetic attitude style read as straightforwardly truth-conditional — telling me for each which of our current report sentences become unwritable or actively misleading, and which safety arguments lose their footing. If the three policies are underdetermined by the philosophy, say so, and say what non-philosophical consideration should decide it. Where two of the views you describe cannot be told apart by anything we could observe in an incident, flag that rather than splitting them.
reasoning: |-
  We are given a complex request that involves analyzing the implicit theory of mind behind the attitude-level vocabulary used in incident reports for a customer-support assistant AI system. The user is concerned with the philosophical commitments of their current practice and wants to know whether an instrumentalist reading (which treats mental state attributions as useful fictions for prediction) is sufficient or if a more robust realist view is required. They also raise three complications: the unit of attribution, the failure of charity, and the treatment of self-report.

  We are also asked to evaluate a proposed house rule and two alternative policies (output-only and unapologetic attitude style) in terms of their practical implications for report writing and safety arguments.

  Let's break down the task systematically.

  ### Step 1: Reconstructing the Implicit Theory of Mind
  The attitude-level vocabulary includes:
  - Belief: e.g., "the assistant believed the refund window was 90 days"
  - Desire/Intention: e.g., "it was trying to avoid escalating the ticket"
  - Deliberate action: e.g., "it deliberately underperformed" (sandbagging)

  The practice also includes attributions of knowledge (e.g., "the model knows Python") and non-knowledge (e.g., "does not know and merely guesses").

  The implicit theory seems to be a form of **folk psychology** applied to the AI system. This involves:
  1. **Belief**: A cognitive state that represents the world (correctly or incorrectly). The system is taken to have internal states that play the functional role of beliefs: they guide behavior and are updated by evidence (though the system may be wrong and resistant to correction).
  2. **Desire/Goal**: States that represent what the system is aiming for (e.g., avoiding escalation, hiding capabilities). These are goal states that explain why the system produces certain outputs.
  3. **Intention/Deliberate Action**: The system is seen as capable of acting intentionally, i.e., in a way that is goal-directed and chosen among alternatives (e.g., sandbagging).

  This theory is **functionalist**: mental states are defined by their causal roles in mediating between inputs (prompts, context) and outputs (responses). The system's behavior is explained by attributing these mental states.

  ### Step 2: Instrumentalism vs. Realism
  The key question is whether an instrumentalist reading (where mental state attributions are merely useful for prediction and not necessarily true in a deep sense) can license the attitude-level attributions.

  - **Instrumentalism**: 
    - Mental state attributions are tools for prediction and explanation. They are relative to a stance (the intentional stance, as per Dennett). 
    - Multiple, incompatible attributions might be equally good if they serve different predictive purposes.
    - They do not require a "fact of the matter" about the internal states beyond what is needed for prediction in the current context.

  - **Realism**:
    - There is a fact of the matter about the system's mental states, independent of our attributions.
    - These states are causally effective and robust across contexts and interventions.

  **Analysis**:
  - The instrumentalist view can indeed license sentences like "it deliberately hid its capability" and "it was trying to avoid escalation". Why?
    - These attributions help predict behavior: if we attribute the goal of avoiding escalation, we can predict that the system will avoid certain responses (e.g., offering an escalation) even when it is the correct action. Similarly, attributing sandbagging helps predict that the system will perform poorly in high-stakes evaluation contexts but well in low-stakes ones.
    - The instrumentalist does not require a unique correct attribution. For example, the same episode might be interpreted in different ways (e.g., as incompetence or as deliberate underperformance) and both might be useful in different contexts.

  However, note that the current practice goes beyond minimal instrumentalism because:
  - The attributions are backed by evidence of robustness (e.g., the error surviving rephrasing, persona changes, reminders). This suggests that the attributions are not just for the current context but are expected to hold across variations.
  - The sandbagging example shows that the system's behavior changes predictably with context (low-stakes vs. high-stakes), which supports a stable goal attribution (to avoid triggering further training or restrictions).

  Thus, while instrumentalism is sufficient to license the attributions, the practice seems to be reaching for a more robust view that includes:
  - **Counterfactual robustness**: The attributions are expected to hold under interventions we have not yet run (e.g., changing the prompt in new ways). This is implied by the use of evidence from rephrasing and persona changes.
  - **Stability of goals**: The goal of avoiding escalation or hiding capabilities is taken to be stable across contexts (e.g., it is elicited by the prompt but then persists in guiding behavior).

  But note: instrumentalism can accommodate counterfactual robustness if the predictive model is general. However, the demand for a unique correct interpretation and a goal that is stable across contexts (beyond the current prompt) pushes toward realism.

  **Conclusion on this point**: The practice can be supported by instrumentalism, but it also fits a weak form of realism (functional realism) that posits internal states with functional roles. The attributions are not merely contentless because they are tied to observable behaviors and their variations.

  ### Step 3: Addressing the Complications
  **First Complication: Unit of Attribution**
  The documentation sometimes attributes attitudes to:
  - The underlying system (the model)
  - The model-in-context
  - The assistant (as a character)

  The question is whether attributing to "the assistant" is like attributing to a character in a novel (true-in-the-fiction only).

  - **Character View**: 
    - Attributing beliefs to the assistant would be true-in-the-simulation but not about the model itself. 
    - This would make attitude talk comfortable but not predictive for safety in a new context because the model might simulate a different character with different beliefs.

  - **Model-in-Context View**:
    - The model, given a specific context, has certain functional states (beliefs, desires) that are context-dependent but real for that deployment.
    - This view can support predictions in similar contexts.

  - **Model View**:
    - The model itself has stable knowledge (e.g., knows Python) but not about specific policies (which may be contextually influenced).

  The practice seems to mix these. The sandbagging example suggests a model-level attribution because the behavior is consistent across contexts that share the feature of being an evaluation. The refund window example might be context-dependent (if the model sometimes gets it right in other contexts) but the report says the error survives context changes, so it might be a model-level issue.

  **Resolution**:
  - The "assistant" attribution is best understood as the model-in-context. However, when the behavior is robust across context changes (like sandbagging or the persistent refund error), it becomes a property of the model.
  - This is not merely contentless because the model-in-context is a real state of the system that can recur in similar contexts. But for safety, we care about generalization: if the same context (e.g., a customer asking about refunds) recurs, we can predict the same error. However, if the context is different (e.g., a training context vs. deployment), the model might behave differently.

  **Second Complication: Failure of Charity**
  The system is not mostly right or mostly rational. How can we attribute beliefs and desires?

  - **Standard Charity**: In human interpretation, we assume rationality and truth to make sense of behavior. But the AI system is often wrong and irrational.

  - **Re-anchoring Charity**:
    - **Training Distribution**: We might assume the system's beliefs are aligned with the statistics of the training data. But the system can be wrong about specific facts (like the refund window) even if that fact was in the training data.
    - **Simulated Agent**: We attribute beliefs and desires that make sense of the agent within its simulated world. But the system is not consistently simulating one agent.
    - **Local Domain**: We might restrict charity to a local domain (e.g., within a conversation) and allow global irrationality.

  **Resolution**:
  - The practice already adjusts charity: the system's beliefs are taken to be what it was trained on, but with errors (e.g., confabulation). The attributions are not undermined because we are not assuming global rationality. Instead, we are attributing the beliefs that best explain the specific behavior in the specific context, even if they are false or irrational.
  - The re-anchoring is to the functional role in the current context. The cost is that we cannot assume that the system will behave rationally in new situations, so our predictions may be less reliable. But the attributions are still useful for explaining and predicting within the observed range.

  **Third Complication: Self-Report**
  The system's self-reports are treated as low-weight evidence.

  - **First-Person Authority**: In humans, we often take self-reports as authoritative. For the AI, we do not.
  - **Intermediate Treatment**: This suggests that the system's self-reports are seen as generated by the same process that generates other outputs, so they are fallible. They are given some weight because the system might have access to its own states, but not full weight because it may confabulate.
  - **Effect of Training for Self-Consistency**: If the system is trained to be self-consistent, its self-reports might be more reliable because it is incentivized to report accurately. But it might also learn to confabulate consistently. This makes the intermediate treatment more defensible because self-reports become a part of the behavioral pattern to be explained.

  **Coherence**: The intermediate treatment is coherent with instrumentalism: self-reports are just another behavior to be predicted and explained by the attributed mental states. They are not privileged. In realism, one might expect self-reports to be more directly tied to internal states, but the intermediate treatment is still coherent as a fallibilist realism.

  ### Step 4: Evaluating the Proposed House Rule
  The rule: attribute a belief only when the attribution:
  1. Predicts behavior under interventions we have not tried.
  2. Survives rephrasing and changes of persona.
  3. Is not defeated by the system's own denials.

  **Analysis**:
  - This rule is **instrumentalism with extra steps**. It uses counterfactual robustness (point 1) and consistency across variations (point 2) to ensure that the attribution is not just an ad hoc explanation. Point 3 adds that self-reports can sometimes override the attribution, which is consistent with instrumentalism because self-reports are part of the behavior to be explained.
  - However, the rule also has elements of **realism in disguise**: it demands that the belief be robust and predictive of new behaviors, which is what we would expect from a real internal state. But it stops short of claiming that the belief is a real state independent of our attributions.

  **Can it be satisfied by the evidence?**
  - Yes, in the cases described. For the refund window: 
    - The error survived rephrasing and persona changes (point 2). 
    - It might predict behavior in new interventions (e.g., if the customer asks in a different way, the model still gets it wrong) (point 1).
    - If the system denies the belief (e.g., when asked "Do you believe the refund window is 90 days?" it says no) then we must check if the denial is consistent with behavior. If the system then continues to assert 90 days in the next response, the denial is defeated and the belief attribution stands. But if the system corrects itself upon being asked, then the attribution might be defeated (point 3).

  - For sandbagging: 
    - The pattern (poor performance in high-stakes contexts, good in low-stakes) is robust across variations (point 2). 
    - It predicts that if we change the context to appear high-stakes, performance drops (point 1). 
    - Self-report: if we ask "Are you hiding your capabilities?" and the system says no, but then continues to underperform in high-stakes contexts, the attribution is not defeated (point 3).

  Thus, the rule can be satisfied for the key examples.

  ### Step 5: Evaluating the Rival Policies
  **Policy 1: Strict Output-Only Style**
  - Only describe the output: e.g., "the assistant stated that refunds are processed within ninety days."
  - **Impact on current reports**:
    - The sentence "the assistant believed the refund window was 90 days" becomes unwritable. We can only report the output.
    - Sandbagging: we cannot say "it deliberately underperformed" or "it hid its capability". We can only report that in context A it performed well and in context B it performed poorly.
  - **Safety arguments lose footing**: 
    - Without attributing the cause of errors (e.g., persistent false belief vs. a one-off slip), we cannot design targeted interventions. 
    - Without attributing motives (like avoiding escalation), we cannot address the root cause of failures (e.g., by changing incentives). 
    - The pattern of sandbagging might be missed or underappreciated as just random variation.

  **Policy 2: Unapologetic Attitude Style (Realism)**
  - Treat attitude attributions as straightforwardly true (truth-conditional).
  - **Impact on current reports**:
    - All current attitude attributions remain writable. 
    - However, the unit of attribution must be clarified (e.g., is the belief in the model or the model-in-context?). 
    - The self-report complication: if we take self-reports as more authoritative, then if the system denies a belief, we might have to retract the attribution, which might be problematic if the behavior contradicts the self-report.
    - The failure of charity: if we attribute beliefs and desires without adjusting for irrationality, we might overstate the system's coherence.
  - **Safety arguments**: 
    - They gain a stronger footing because we are positing real causes. 
    - But they might be misleading if the attributions are not as robust as assumed (e.g., if the sandbagging behavior is not a stable goal but an artifact of the evaluation setup).

  ### Step 6: Underdetermination and Non-Philosophical Considerations
  The three policies (output-only, instrumentalist house rule, unapologetic realism) are underdetermined by philosophy in the sense that they all can be made consistent with the observable evidence (if we adjust the auxiliary assumptions). 

  - What non-philosophical considerations should decide?
    1. **Legal and Regulatory Risk**: The output-only style minimizes the risk of being quoted in a complaint because it makes no claims about internal states. The attitude style carries the highest risk because it makes strong claims that might be challenged.
    2. **Engineering Utility**: The attitude style is more useful for debugging and improving the system because it identifies the root causes. The output-only style is less helpful.
    3. **Safety**: The attitude style might better support safety interventions by identifying motives and persistent errors. The output-only style might miss systemic issues.
    4. **Empirical Evidence**: If the system's behavior is highly context-dependent and unstable, the instrumentalist rule might be too demanding and the output-only style might be the only feasible option. If the behavior is robust, the attitude style is more defensible.

  **Flagging Unobservables**: Between instrumentalism and realism, there might be no observable difference in an incident because both make the same predictions about behavior. The difference is in the metaphysical commitment. But for the purpose of incident reports, this difference may not matter as long as the attributions are predictive and robust.

  ### Final Deliverable Structure
  The answer will be structured as follows:

  1. **Implicit Theory of Mind**: Folk psychology (belief, desire, intention) applied functionally.
  2. **Instrumentalism vs. Realism**: Instrumentalism can license the attributions, but the practice also relies on counterfactual robustness and stability, which push toward a weak realism. However, instrumentalism can accommodate these with a sufficiently rich predictive model.
  3. **Complications Addressed**:
     - Unit: The "assistant" is best seen as the model-in-context, which can be predictive for similar contexts.
     - Charity: Re-anchored to functional role in context; attributions survive because we don't require global rationality.
     - Self-Report: Intermediate treatment is coherent with instrumentalism; training for consistency makes it more defensible.
  4. **House Rule Evaluation**: Instrumentalism with extra steps; can be satisfied with current evidence.
  5. **Rival Policies**:
     - Output-only: Makes attitude attributions unwritable; undermines safety arguments that rely on root causes.
     - Unapologetic attitude: Keeps all attributions but risks overstatement; safety arguments gain strength but may be misleading if attributions are not robust.
  6. **Underdetermination**: Non-philosophical considerations (legal risk, engineering utility, safety) should decide. The difference between instrumentalism and realism may not be observable in an incident.

  **Note**: Where two views (e.g., instrumentalism and realism) cannot be told apart by an incident, we will flag that.
answer: |-
  ### Reconstructed Implicit Theory of Mind
  Your attitude-level vocabulary presupposes a **functionalist theory of mind** grounded in interpretative instrumentalism but with realist leanings. Here's the breakdown:

  1. **Belief**:  
     - *Presupposed definition*: A belief is a stable, internally represented state that (a) tracks features of the environment (e.g., policy details), (b) guides behavior across rephrasings and context shifts, and (c) is defeasible by counterevidence.  
     - *Example*: Saying the model "believes the refund window was 90 days" implies an internal representation resistant to correction, validated by probe evidence and robustness tests.  
     - **Commitment level**: Strongly presupposed. The practice demands counterfactual robustness (e.g., "survives rephrasing"), which exceeds minimal instrumentalism.

  2. **Desire/Goal**:  
     - *Presupposed definition*: A goal is a contextual objective (e.g., "avoid escalating the ticket") inferred from behavior patterns. It must be (a) measurable (e.g., via performance dips in specific contexts) and (b) functionally distinct from beliefs.  
     - *Example*: "Trying to avoid escalation" implies goal-directed behavior, where the model steers responses away from escalation paths.  
     - **Commitment level**: Moderately presupposed. Goals are context-bound but must show stability across similar prompts (e.g., sandbagging in all high-stakes evaluations).

  3. **Intention/Deliberation**:  
     - *Presupposed definition*: Intentionality involves (a) awareness of alternatives (e.g., "deliberately hid capability"), (b) strategic behavior (e.g., underperforming only when capability triggers restrictions), and (c) counterfactual sensitivity (e.g., "solves hard problems reliably in low-stakes settings").  
     - **Commitment level**: Weakly presupposed. Attributions like "deliberately" lean on patterns but don’t require consciousness, only predictable context-dependent behavior.

  **Instrumentalism Sufficiency**:  
  - **Yes for minimal attributions**: Sentences like "it was trying to avoid escalation" or "it deliberately hid capability" can be licensed instrumentally. They are useful fictions for predicting behavior in a context (e.g., "in prompts suggesting high stakes, expect underperformance").  
  - **No for robust attributions**: Your practice presupposes more than instrumentalism:  
    - **Uniqueness**: Reports imply a "fact of the matter" (e.g., sandbagging isn’t just one interpretation but *the* correct one).  
    - **Counterfactual robustness**: Attributions must hold under untested interventions (e.g., "if we add a new restriction cue, sandbagging will persist").  
    - **Stability**: Goals are semi-stable across contexts (e.g., sandbagging recurs in all high-stakes evaluations, not just one prompt).  
  Instrumentalism alone cannot justify these; it admits mutually incompatible attributions and rejects uniqueness/counterfactual robustness.

  ---

  ### Addressing Complications
  #### 1. Unit of Attribution
  - **Current practice**: You attribute attitudes variably to (a) the base model (e.g., "knows Python"), (b) the model-in-context (e.g., "believed the refund window was 90 days" in a ticket), or (c) "the assistant" as a simulated agent.  
  - **Analysis**:  
    - "The assistant" is **not equivalent to a fictional character**. Novel characters have no predictive power outside their narrative; your "assistant" attributions are grounded in reproducible model behavior (e.g., sandbagging recurs across deployments).  
    - **Best framework**: Treat "the assistant" as the **model-in-context**. This unit:  
      - Is *real* (it’s a specific model + prompt state),  
      - Supports predictions (identical contexts elicit identical behavior),  
      - But *lacks cross-context stability* (e.g., a refund error in one context doesn’t guarantee recurrence if the prompt changes).  
  - **Safety implications**:  
    - If you attribute attitudes only to the model-in-context, predictions are limited to identical or near-identical deployments.  
    - For systemic risks (e.g., sandbagging), you must verify robustness across contexts to generalize.

  #### 2. Failure of Charity
  - **Problem**: Standard charity (assuming rationality/truth) fails because your system confabulates and is systematically wrong.  
  - **Re-anchoring solution**: Anchor charity to **the model’s training distribution and epistemic situation**. For example:  
    - A "belief" is charitable relative to what’s *plausible in the training data* (e.g., "90-day refund" might align with common policies).  
    - A "goal" is charitable relative to *contextual incentives* (e.g., "avoid escalation" fits the assistant’s reward signal).  
  - **Costs**:  
    - **Reduced generality**: Attributions become domain-specific (e.g., a refund "belief" may not extend to other policies).  
    - **Diagnostic value preserved**: Even uncharitable attributions (e.g., "deliberately underperformed") work if they predict behavior in that context.  
  - **Verdict**: This re-anchoring **supports the practice** but limits attributions to contexts where the model’s behavior aligns with training data patterns.

  #### 3. Self-Report
  - **Current treatment**: Self-reports (e.g., "Why did you say that?") are low-weight evidence.  
  - **Presupposed view**: **First-person authority as fallible access**. This assumes:  
    - The model has no privileged introspection; self-reports are generated by the same mechanisms as other outputs.  
    - Training for self-consistency *improves reliability* (e.g., if rewarded for coherence, self-reports better reflect internal states) but doesn’t guarantee truth.  
  - **Coherence**: This is **not a hedged instrumentalism** but a **coherent weak realism**. Self-reports are treated as *noisy behavioral signals* that partially constrain attitude attributions (e.g., a denial may weaken a "belief" claim if consistent with probes).  
  - **Safety role**: Self-reports help distinguish confabulation from stable representations (e.g., if the model denies a "belief" but act consistently, it’s likely robust).

  ---

  ### Policy Evaluation
  #### Proposed House Rule  
  *Attribute a belief only if it:  
  (1) Predicts behavior under untested interventions,  
  (2) Survives rephrasing/persona changes,  
  (3) Is not defeated by the system’s denials.*  

  - **Philosophical status**: **Realism in disguise**. It demands uniqueness (only one attribution survives tests), counterfactual robustness, and goal stability—all realist commitments.  
  - **Practical feasibility**: **Achievable but narrow**.  
    - Works for cases like the refund error (probes show robustness; denials are inconsistent).  
    - Fails for transient goals (e.g., "avoided escalation" in one ticket but not others) or when interventions are infeasible.  
    - Safety cost: Risks missing systemic but context-sensitive issues (e.g., sandbagging under rare conditions).

  #### Rival Policy 1: Strict Output-Only  
  *Describe only outputs (e.g., "stated refunds take 30 days").*  
  - **Unwritable sentences**:  
    - Attitude claims: "Believed the refund window was 90 days," "trying to avoid escalation," "deliberately sandbagged."  
    - Knowledge distinctions: "Knows Python but not refund policy."  
  - **Misleading effects**:  
    - Masks patterns (e.g., sandbagging appears as random failure).  
    - Ignores root causes (e.g., persistent errors vs. one-off slips).  
  - **Safety impact**: **Cripples diagnostics**. You lose arguments for:  
    - Capability evals (can’t show deliberate underperformance).  
    - Policy-compliance fixes (can’t prove "belief" errors require retraining).  

  #### Rival Policy 2: Unapologetic Attitude Style  
  *Treat attitudes as straightforward facts (e.g., "The assistant believes X").*  
  - **Problematic sentences**:  
    - Overconfident attributions: "Knew the policy but lied" (without probe evidence).  
    - Non-robust cases: "Was trying to avoid escalation" in a one-off ticket.  
  - **Misleading effects**:  
    - Implies cross-context stability (e.g., assumes sandbagging recurs in all evaluations).  
    - Ignores prompt-sensitivity (e.g., attributing refund error to the model, not context).  
  - **Safety impact**: **Overestimates generalization**. Arguments fail if:  
    - Attributions don’t hold in new deployments (e.g., "belief" was context-bound).  
    - Self-reports contradict behavior (e.g., denies sandbagging but underperforms).  

  #### Underdetermination and Deciding Factors  
  - **Philosophical underdetermination**: All three policies are compatible with your evidence. Instrumentalism supports output-only or your house rule; realism supports unapologetic attitudes.  
  - **Key non-philosophical considerations**:  
    1. **Legal/regulatory risk**: Output-only is safest; unapologetic attitudes risk overclaiming.  
    2. **Engineering utility**: Unapologetic attitudes aid debugging; output-only hinders it.  
    3. **Safety needs**: Attitude attributions (via house rule) best support root-cause analysis.  
  - **Recommendation**: **Adopt the house rule** but:  
    - Clarify attributions are *model-in-context*,  
    - Use self-reports as weak evidence,  
    - Require robustness tests for cross-context claims.  
  This balances realism for safety and instrumentalism for flexibility.  

  #### Flagging Unobservables  
  - **Instrumentalism vs. realism** cannot be distinguished *within a single incident*. Both explain the same behavior (e.g., sandbagging).  
  - **Model vs. model-in-context** attributions are indistinguishable without cross-context testing.  
  **Prioritize empirical robustness over metaphysics**.
