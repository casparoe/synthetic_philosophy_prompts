  So perhaps we need a combination of rules.

  Alternatively, consider a rule based on **interventionist causation** or **manipulation**:

  **Rule F (Causal Autonomy)**: Reduction fails if the higher-level property can be intervened upon independently of the lower-level properties. That is, if there are interventions at the higher level that change the system without changing the lower-level properties (or vice versa) then the higher-level is emergent.

