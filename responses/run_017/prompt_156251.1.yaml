  But this is physically impossible. So let's make it more philosophical:

  - **Case Y (actual or constructed)**: Consider a computer simulation of a pendulum. The lower level is the code and hardware. The higher level is the period of the pendulum in the simulation. Normally, the period is determined by the code (which sets the length and gravity). But suppose we can intervene at the higher level by using a debugger to change the period variable directly without changing the code that computes the pendulum motion. Then, the period is changed without changing the lower-level code (though the hardware still runs the code). However, the lower-level code is still there and might be inconsistent with the new period? This is tricky.

