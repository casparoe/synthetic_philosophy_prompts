  ### Decision Tree: "Do Your Thoughts Actually Do Anything?"

  This interactive flowchart uses concrete cases (no philosophical jargon) to guide readers to a position on mental causation. Start at Node 1 and follow your answers to a leaf position. The tree is based on 7 key cases, with 6 nodes and 7 leaves. **Total nodes: 6** (under the 10-node limit).

  ---

  #### **Node 1: The Spinal Implant Case**  
  *(Your first question—does the most sorting work, as it splits the tree into causal vs. non-causal mental states)*  
  A patient with a spinal injury has an implant that reads their *intention to move* directly from the brain and stimulates their muscles. The old nerve pathway is cut. If there’s no intention, there’s no movement. **Does the intention cause the movement?**  
  - **Yes** → Go to Node 2  
  - **No** → Go to Node 3  

  ---

  #### **Node 2: The Coffee Case**  
  *(For those who said "YES" to Node 1)*  
  You turn onto 5th Street because you *want coffee* and believe a café is there. Neurons in your brain also fire to trigger the turn. **Is the wanting the same thing as the neural firing?**  
  - **Yes** → Go to Node 4  
  - **No** → Go to Node 5  

  ---

  #### **Node 3: The Coffee Case**  
  *(For those who said "NO" to Node 1)*  
  You turn onto 5th Street because you *want coffee* and believe a café is there. Neurons in your brain also fire to trigger the turn. **Even if the wanting didn’t cause the turn, is it still a useful explanation?**  
  - **Yes** → **Leaf: Explanatory Role**  
    *(Most awkward commitment: Thoughts don’t cause actions—they just help us understand why actions happen.)*  
  - **No** → **Leaf: Drained**  
    *(Most awkward commitment: Thoughts are powerless side effects, like steam from an engine.)*  

  ---

  #### **Node 4: The Scattered Pattern Case**  
  *(For those who said "YES" to Node 2)*  
  Brain scans show that "wanting coffee" involves a different, scattered neural pattern every time—no stable brain signature. **Does this mean wanting can’t be a cause?**  
  - **Yes** → **Leaf: One-Event-Two-Descriptions**  
    *(Most awkward commitment: "Wanting coffee" is just a story we tell about brain events—it doesn’t add new causal power.)*  
  - **No** → **Leaf: Reduction or Identity**  
    *(Most awkward commitment: Mental states *are* brain states—so changing your mind is just changing your brain.)*  

  ---

  #### **Node 5: The Mental-Physical Question**  
  *(For those who said "NO" to Node 2)*  
  **Is the wanting made of physical stuff (like brain activity)?**  
  - **Yes** → Go to Node 6  
  - **No** → **Leaf: Interactionist Dualism**  
    *(Most awkward commitment: Non-physical thoughts must somehow push physical matter around.)*  

  ---

  #### **Node 6: The Novel Causation Case**  
  *(For those who said "YES" to Node 5)*  
  Imagine a thought (e.g., "I’ll jog today") changes your brain and body in a way that couldn’t be predicted just from neurons and chemistry. **Could the thought cause physical changes in this novel way?**  
  - **Yes** → **Leaf: Emergentist Downward Causation**  
    *(Most awkward commitment: Thoughts emerge from the brain but somehow "reach down" to control it.)*  
  - **No** → **Leaf: Nonreductive Physicalism (Overdetermination)**  
    *(Most awkward commitment: Actions have two independent causes—thoughts and neurons—which feels redundant.)*  

