prompt: |-
  I should say at the outset that I have no academic background in philosophy. What I know of this subject comes from a few popular books I picked up on my own and from twenty-odd years around hospitals, first as a hospice volunteer coordinator and now as the lay chair of our hospital trust's clinical ethics advisory group.

  The group is small — a ward sister, a consultant in acute medicine, a GP, a chaplain, a retired solicitor and me. We meet for ninety minutes once a month and we see three or four referrals a month, usually at short notice: a team wants to know whether a proposed change in a dying patient's care is permissible, or a family wants something the team is uneasy about, or a nurse has gone home upset because she feels she has been asked to kill someone. Our advice is advisory only; the responsible consultant and the family decide, and we have a trust solicitor for the legal questions, which are not what I am asking about. What I need is a procedure for the moral question, written so that a group of non-specialists can run it in an hour and write up the result the same afternoon.

  The thing I keep finding is that the distinction people reach for first — killing versus letting die, doing versus allowing — is the one that falls apart in the cases we actually get. Stopping a ventilator is fine by everyone; turning off a device inside someone's chest feels different to some of us even though, so far as I can tell, nothing morally important hangs on the difference; and then there are the cases where 'letting die' looks like a comfortable word we are using to avoid saying what we are doing. I have read a little about the acts/omissions distinction and about the doctrine of double effect, and about the argument that, since any death brought about by an injection could also be brought about by standing back, the bare difference between acting and not acting cannot itself be what matters. But I cannot turn any of that into something I can put in front of my group.

  What I would like is the procedure itself, in two forms. First, a short version — three or four questions on a card — that a nurse in charge can run at three in the morning before a plan goes ahead, and which says clearly when the answer is 'proceed', 'do not proceed', or 'do not proceed without a discussion you cannot have at three in the morning'. Second, the full version: the questions in the order they should be asked; what would count as a sufficient answer to each; the point at which the procedure stops and returns a no; and the points at which it must hand the decision to a named person because the question is one of values rather than of classification. Please mark, at each step, which distinctions have to survive being simplified for a lay group and which can be dropped without loss, and say honestly where the procedure will misfire and what it cannot tell us at all.

  Three rough tests have grown up in our group, and I suspect they are in tension with each other, so I would rather you kept, repaired or scrapped them explicitly than ignored them. The first is the change test: does someone have to make a physical change to the patient's body, or to something currently doing work inside or on it, for the death to occur, or does the death come about if everyone simply stops? The second is the empty ward test: what would happen if every member of staff walked out and nothing was touched for the next hour? The third, which I invented after a bad meeting and do not fully trust, is the mirror test: for any case, construct the case in which exactly the same death is brought about the other way round — by an act if the proposal is an omission, by an omission if it is an act — and see whether our verdict changes. If it does, I take it we are responding to the distinction rather than to anything about the patient, and I am not sure what follows from that. There is also a fourth thing we do informally, which is to ask whether our answer would change if a different professional performed the physical movement — the doctor sets the rate on the pump, the nurse presses the button — and I would like to know whether that question is doing any real work or is just embarrassment.

  Then I would like the procedure run on three cases, and shown briefly on a fourth.

  The first is a man of seventy-one with severe COPD who has been on a ventilator for eleven days after a chest infection; the intensive care team judges that continued ventilation offers no realistic recovery and is burdensome; his family agree; the plan is to give sedation and an opioid infusion first and then remove the breathing tube, with death expected within minutes or hours. Most of us are comfortable with this and would call it letting die, but I would like to see the procedure reach that rather than assume it.

  The second is a woman of sixty-eight with end-stage heart failure and a defibrillator implanted in her chest six years ago. She is now dying, and the cardiology team says the device is likely to fire repeatedly during the dying process, which would be distressing for her and for everyone in the room. We are asked whether deactivating it is permissible. Two of us say this is switching something off and so is relevantly different from not starting a treatment; the rest say it is no different from stopping a drug. Please do not split the difference — tell us which way the procedure goes, and if it goes against the two of us, say why.

  The third is a woman of eighty-four with advanced dementia, no written advance statement, and a nasogastric tube placed after an aspiration pneumonia. She is not otherwise dying. Her family are unanimous that she would not have wanted to be kept alive like this and ask that the tube not be replaced. The plan is to remove it, continue mouth care, and hand-feed her as she will take it — she still seems to enjoy being fed. Several of us want to call this letting die. I want you to tell me whether the procedure lets us.

  The fourth, which I would like run quickly rather than at length, is a syringe driver of midazolam for terminal agitation, increased in the knowledge that the increase may bring her death somewhat sooner. This is the single most common thing we are asked about, and it is where talk of aiming at a death as opposed to foreseeing it has to earn its keep, if it can.

  Two more things. I would rather you told me plainly when the procedure returns an answer my group will dislike than adjusted the steps to reach the answer we would prefer — I can see when people are doing that, and it is most of why I am writing this. And please do not give me references, reading lists or a summary of who has argued what; I have no library access and nothing would come of it. What I want is something I can hand to a ward sister and have her use.
reasoning: |-
  Okay, the user is a lay chair of a hospital ethics committee with no formal philosophy background. They need a practical, actionable decision-making tool for end-of-life cases that can be used quickly by non-specialists. Their current approach relies on intuitive tests (change test, empty ward test, mirror test) but feels unstable.

  First, I need to acknowledge their real-world constraints: urgent decisions, no time for theoretical debates, diverse professional backgrounds in the group. The solution must fit in 90-minute meetings and produce same-day documentation. Their frustration with acts/omissions distinctions is valid - in clinical practice, that distinction often collapses emotionally even if logically sound.

  The core tension I see is between needing clear procedural steps and recognizing that some value judgments can't be automated. The tests they've developed show clever pragmatism - especially the mirror test which exposes hidden biases. But they're right to suspect internal contradictions. The key is making the implicit explicit without overcomplicating.

  For the procedure design: Morning Card must be idiot-proof with binary outputs. Full version needs escape valves for when values clash. I'll keep their three tests but reframe them: Change test becomes "Physical Intervention?" to flag active steps. Empty ward test morphs into "Natural Process?" assessing inevitability. Mirror test is most philosophically sound but hardest to apply - I'll make it optional for ambiguous cases only.

  Critical to include their fourth unspoken test about who performs the action - this reveals the "yuck factor" bias. We should name that explicitly as an integrity check but note it shouldn't change the outcome.

  For the case applications: The COPD case is straightforward - procedure should show it's allowing death, not causing. The defibrillator is the real test - functionally identical to stopping vent but feels different. Must be consistent: deactivation is permissible withdrawal. The NG tube case is ethically trickier - here "letting die" is misleading when we're removing existing intervention. Syringe driver example must demonstrate that intention isn't mind-reading but reasonable inference from choices.

  Biggest challenge: preserving moral seriousness while avoiding paralysis. Will emphasize that discomfort with certain conclusions (like NG tube removal) doesn't indicate procedure failure but value conflicts needing human judgment. The "stop and assign" steps are crucial for those moments.

  Final design principle: Every question must either change the action or be discarded. No decorative philosophy. Outputs will sometimes upset the group - like labeling NG removal as active - but that's the point of a robust tool.
answer: |-
  Here is a practical procedure designed for your context. It prioritizes clarity, speed, and actionability over theoretical perfection, acknowledging where simplification is necessary and where the procedure has limits.

  **Core Principles:**
  1.  **Focus on Permissibility:** Does the *proposed action/inaction* fall within the boundaries of ethically acceptable care for a dying patient?
  2.  **Avoid Mind Reading:** Intention is inferred from objective factors (dose, context, alternatives) not subjective claims.
  3.  **Reject Bare Acts/Omissions:** The physical nature of the act (button press vs. non-replacement) is not morally decisive *by itself*. Function and consequence matter more.
  4.  **Prioritize Patient Welfare:** Relief of suffering and respect for patient values (known or inferred) are paramount.
  5.  **Embrace Uncertainty:** Some questions are value judgments; the procedure flags these for assignment to the responsible clinician/family.

  ---

  **I. The Morning Card (3-4 Questions for Urgent Triage)**

  1.  **Is the patient imminently dying (hours/days) *regardless* of the proposed action/inaction?** (If NO → **Do not proceed without discussion**)
  2.  **Is the primary purpose to relieve severe suffering or respect known/inferred patient wishes?** (If NO → **Do not proceed**)
  3.  **Does the proposal involve *initiating* a treatment solely intended to cause death?** (If YES → **Do not proceed**)
  4.  **Would *not* doing the proposed action/inaction likely cause *more suffering* than doing it?** (If UNSURE → **Do not proceed without discussion**; If YES → **Proceed**; If NO → **Re-evaluate need for proposal**)

  *   **Outputs:** `Proceed` | `Do not proceed` | `Do not proceed without discussion`

  ---

  **II. The Full Procedure (For Ethics Group Discussion)**

  **Step 1: Establish Context (5 mins)**
  *   **Question:** What is the specific proposal? (Stop vent? Deactivate ICD? Withdraw NG tube? Increase sedation?).
  *   **Sufficient Answer:** Clear description of the action/inaction being proposed. *Stop if unclear.*
  *   **Question:** What is the patient's current clinical status? (Diagnosis, prognosis with/without treatment, level of consciousness, suffering).
  *   **Sufficient Answer:** Confirmation patient is dying (imminently or condition is terminal/fatal). If not actively dying *now*, ensure Step 3 is robust. *Stop if not dying/terminal.*
  *   **Question:** What is the goal of the proposal? (Relieve suffering? Respect autonomy? Cease futile/burdensome treatment?).
  *   **Sufficient Answer:** Goal stated clearly (Relief of suffering, respect for wishes, avoiding non-beneficial burden). *Stop if goal is solely to end life.*
  *   **Simplification:** Can drop nuanced definitions of "dying" for practical consensus. Must survive: Distinction between *relieving suffering/respecting wishes* vs. *solely causing death*.

  **Step 2: Assess Suffering & Alternatives (10 mins)**
  *   **Question:** What severe suffering (physical, psychological, existential) is the proposal addressing?
  *   **Sufficient Answer:** Description of specific, significant distress. *Stop if no significant suffering addressed and treatment is life-sustaining (see Step 3).*
  *   **Question:** Are there alternative ways to alleviate this suffering without the proposed action/inaction or its consequences (death)?
  *   **Sufficient Answer:** Consideration of feasible alternatives (e.g., different meds, lower doses, non-pharmacological approaches). *If equally effective alternatives exist that avoid death/significant risk, Stop and advise alternatives.*
  *   **Simplification:** Can drop philosophical debates about "types" of suffering. Must survive: Genuine effort to identify *less risky alternatives* if feasible.

  **Step 3: Assess Treatment Burden & Futility (10 mins)**
  *   **Question:** Is the treatment/intervention in question (the one being stopped/withheld) *currently* providing significant benefit (prolonging meaningful life, relieving suffering) that outweighs its burdens *to this patient*?
  *   **Sufficient Answer:** Assessment based on patient's condition, values, and burden (pain, restriction, indignity). *If benefit outweighs burden, Stop and advise against stopping/withholding.*
  *   **Question:** Is the treatment/intervention futile? (i.e., no reasonable chance of achieving its physiological goal or providing meaningful benefit *to this patient*).
  *   **Sufficient Answer:** Medical judgment that treatment cannot achieve its intended purpose (e.g., vent won't lead to recovery in advanced COPD, NG tube won't restore function in advanced dementia). *If futile, stopping/withholding is generally permissible.*
  *   **Simplification:** Can drop complex "futility" definitions; "no meaningful benefit" suffices. Must survive: Distinction between *burdensome* treatment (may be stopped) and *ordinary care* (e.g., hygiene, basic comfort - generally not stopped).

  **Step 4: Respect Patient Wishes (10 mins)**
  *   **Question:** What are the known wishes of the patient? (Advance directive, clear prior statements)?
  *   **Sufficient Answer:** Direct evidence is best. *If clear and applicable, this strongly guides permissibility.*
  *   **Question:** If no clear wishes, what can be *reasonably inferred* based on the patient's values, beliefs, and reactions? What do the family/close ones believe the patient would want?
  *   **Sufficient Answer:** Consensus from family/team on best understanding of patient's likely wishes, focused on *avoiding burden/prolonged dying without benefit*. *If strong consensus, proceed. If significant conflict or uncertainty → Assign to responsible clinician/family.*
  *   **Simplification:** Can drop debates about "substituted judgment" vs. "best interests"; focus on *reasonable inference*. Must survive: Distinction between *known/inferred wishes* and *family preferences* that contradict likely patient wishes.

  **Step 5: Intention & Causality Check (Using Your Tests) (15 mins)**
  *   **Purpose:** Not to judge souls, but to ensure action aligns with goals and avoids *intending* death as a means or end.
  *   **Apply Tests:**
      *   **Change Test (Revised):** Does the proposal require a *new, active intervention* performed *on the patient* that *directly causes* death (e.g., lethal injection)? (If YES → **Likely impermissible**). *Stopping treatment or deactivating a device is NOT a "new intervention causing death"; it's removing an artificial barrier to the natural dying process.*
      *   **Empty Ward Test (Revised):** If all staff left and *no new actions were taken*, would the patient die *from their underlying condition*? (If YES → The proposal is allowing that natural death, even if it involves an "act" like turning off a switch). *Focuses on natural cause vs. introduced cause.*
      *   **Mirror Test (Use Sparingly):** *Only if deeply uncomfortable* with conclusion. If swapping "act" for "omission" (or vice versa) *with identical outcome* changes your moral verdict, this signals discomfort with the *label*, not the substance. *Proceed based on substance (Steps 1-4, other tests).*
      *   **Professional Role Test:** If changing *who* pushes the button changes the group's comfort, this is *irrelevant* to permissibility. It reflects psychological discomfort, not ethics. *Ignore it for the verdict.*
  *   **Key Question:** Is death the *intended means* to relieve suffering, or an *unwanted but foreseeable side-effect* of an action *primarily* intended to relieve suffering/cease burden? (Assessed by: drug dose/type, context of dying, lack of alternatives - Step 2).
  *   **Sufficient Answer:** Death is not the intended mechanism of relief; relief comes from treatment cessation or symptom meds, death is the foreseen consequence of underlying disease.
  *   **Simplification:** Must drop abstract debates about "intention". Focus on *objective indicators*: Is the *means* chosen reasonable for symptom relief? Would lower risk suffice? Does the *action itself* directly kill? Must survive: Distinction between *foreseeing* death and *intending* it as a goal or method.

  **Step 6: Synthesis & Output (10 mins)**
  *   Revisit Step 1 proposal.
  *   **Permissible if:**
      *   Patient is dying/terminal (Step 1)
      *   Goal is relief of suffering / respect for wishes / cease futile/burdensome treatment (Step 1)
      *   Significant suffering exists OR treatment is futile/overly burdensome (Steps 2 & 3)
      *   Aligns with known/inferred wishes (Step 4)
      *   Does not involve a *new act directly intended to cause death* (Step 5 - Change Test)
      *   Death results from underlying disease, not a new lethal intervention (Step 5 - Empty Ward Test)
      *   Death is not the intended means of relief (Step 5 - Objective Indicators)
  *   **Impermissible if:** Any clear "Stop" from Steps 1-5.
  *   **Assign Decision if:** Significant unresolved conflict about patient's wishes (Step 4) or deep value conflict not resolved by procedure → *Assign to responsible clinician/family with ethics group input noted.*
  *   **Output:** Clear "Permissible", "Impermissible", or "Assign to [Clinician/Family] for final decision based on values". Document reasoning concisely referencing key steps.

  **Where it Misfires/Limits:**
  1.  **"Imminently Dying":** Prognosis is uncertain. The procedure relies on clinical judgment here. It might misfire if prognosis is grossly over/underestimated.
  2.  **"Inferred Wishes":** This is inherently subjective. The procedure provides structure but cannot eliminate disagreement about what is "reasonable" inference.
  3.  **Value Conflicts:** When core values clash irreconcilably (e.g., sanctity of life vs. autonomy in ambiguous cases), the procedure flags it for assignment; it doesn't resolve it.
  4.  **"Foreseen vs. Intended":** In very high-dose sedation near death, the line blurs. The procedure uses objective checks (dose, alternatives) but some ambiguity remains. It prioritizes relief of suffering in the dying.
  5.  **Non-Terminal Suffering:** It's designed for dying/terminal patients. Applying it to severe suffering in non-dying patients (e.g., locked-in syndrome) would misfire.
  6.  **Psychological "Acts":** It doesn't fully resolve the visceral discomfort some feel with "acts" (like deactivating ICDs), but it shows the discomfort isn't ethically decisive.

  ---

  **Application to Your Cases:**

  **Case 1 (71M, COPD, Vent Withdrawal):**
  *   Step 1: Proposal: Sedate, give opioid, remove tube. Status: Dying, burdensome vent, no recovery. Goal: Cease burden, relieve suffering.
  *   Step 2: Suffering (dyspnea, vent burden). Alternatives? Sedation/Opioid *are* the alternatives to unrelieved dyspnea during withdrawal.
  *   Step 3: Vent is burdensome, futile for recovery. Benefit (life prolongation) outweighed by burden in context of dying.
  *   Step 4: Family agree, aligns with inferred wish to avoid prolonged, burdensome dying.
  *   Step 5: Change Test: Removing tube isn't a *new* lethal act. Empty Ward: If staff left, he'd die of COPD/resp failure. Intention: Relieve air hunger/suffering via meds; death from disease foreseen, not intended means.
  *   **Output: Permissible.** (Procedure reaches "letting die" via Empty Ward Test & Cause of Death).

  **Case 2 (68F, Heart Failure, ICD Deactivation):**
  *   Step 1: Proposal: Deactivate ICD. Status: Dying (end-stage HF). Goal: Prevent distressing shocks (suffering).
  *   Step 2: Suffering: Anticipated repeated shocks/distress. Alternative? No - can't prevent shocks without deactivation.
  *   Step 3: ICD is futile (won't prevent death from HF, only delay it momentarily with severe suffering). It's now burdensome (source of distress).
  *   Step 4: (Assuming patient/family agree) Aligns with wish to avoid distress.
  *   Step 5: Change Test: Deactivation *is* an act, but **not** a *new intervention causing death*. It's stopping an artificial interruption of the natural dying process. Empty Ward: If staff left, ICD might shock, but she'd *still die of heart failure*. Deactivation just prevents the distressing *non-therapeutic* shocks during dying. Intention: Prevent suffering, not cause death.
  *   **Output: Permissible.** The distinction between "stopping a drug" and "switching off a device" is not ethically relevant here. Both involve ceasing an artificial medical intervention that is no longer beneficial and is causing or threatening suffering. The procedure goes against the two dissenters. Why? The "Change Test" is misapplied if it treats *any* physical act as suspect. The revised test asks if it's a *new lethal act*. Deactivation isn't lethal; the HF is.

  **Case 3 (84F, Dementia, NG Tube Non-Replacement):**
  *   Step 1: Proposal: Remove NG tube, don't replace; provide mouth care/hand feed. Status: *Not* imminently dying *now*; advanced dementia, dependent on artificial nutrition. Goal: Respect inferred wishes to avoid prolonged artificial life in severe dementia.
  *   Step 2: Suffering? Tube may cause discomfort. *Significant suffering from underlying condition?* Dementia itself causes suffering, but removal doesn't directly relieve it; she may suffer from hunger/thirst if unable to eat enough. Alternatives? Hand feeding (proposed).
  *   Step 3: Is the NG tube *futile*? It achieves its physiological purpose (nutrition). Is it *burdensome*? Possibly, but burden vs. benefit is complex. Benefit is life prolongation in a state the family believes she wouldn't value.
  *   Step 4: Key Step. No advance statement. Family unanimous on inferred wishes. *This is a value judgment:* Does the group accept this inference is reasonable? (Procedure can't resolve this definitively). If yes, it aligns.
  *   Step 5: Change Test: *Not replacing* is an omission. *Removing the existing tube* is an act. However, the *decisive step* is the *decision* not to re-implant artificial nutrition. Empty Ward: If staff left and did nothing, she would *not* die imminently; she would eventually die from malnutrition/dehydration *caused by the lack of intervention*, not purely her dementia. This is different from Case 1 & 2. Intention: Primary goal is to respect autonomy/cease unwanted intervention; death is foreseen consequence.
  *   **Output: Ambiguous/Requires Assignment.** This is the procedure's limit. Step 1: Not *imminently* dying *now* (though terminal condition). Step 3: Treatment (artificial nutrition) is not futile in a narrow physiological sense, though it may be deemed *non-beneficial* based on quality of life (a value judgment). Step 5: Empty Ward Test fails - death would be *caused* by lack of feeding intervention, not purely dementia. **The procedure likely labels this as *withdrawing life-sustaining treatment* (permissible if consistent with wishes) rather than "letting die" in the natural course sense.** However, the core value judgment ("Would she want this?") remains. **Output:** "Permissible *if* the group accepts the family's inference of the patient's wishes as reliable and that artificial nutrition is overly burdensome/non-beneficial *in this context*. Assign final decision to responsible clinician/family with ethics advice supporting permissibility based on respect for autonomy if wishes are accepted." **The procedure does *not* comfortably call it "letting die" (Empty Ward Test fails). It is allowing death *by not providing life-sustaining treatment*, which is ethically distinct from Cases 1 & 2.**

  **Case 4 (Syringe Driver Increase):**
  *   Step 1: Proposal: Increase midazolam for terminal agitation. Status: Imminently dying. Goal: Relieve severe agitation (suffering).
  *   Step 2: Suffering: Severe terminal agitation. Alternative? Lower dose? Other meds? Often, no; agitation is refractory. If alternatives exist, use them first.
  *   Step 3: N/A (Not about stopping treatment).
  *   Step 4: Assume goal aligns with comfort care wishes.
  *   Step 5: Change Test: Giving medication is an act. Empty Ward: If staff left, she might die *sooner* from agitation/underlying condition, but meds *might* be needed for comfort. Intention: **Critical.** Is the dose increase *standard and appropriate* for refractory agitation? If yes, intention is symptom control. If the dose is *excessive* beyond what's needed for agitation control, it shifts towards intending death. *Assess based on standard palliative practice for the symptom.*
  *   **Output:** Permissible **if** the dose increase is within the normal range for treating refractory terminal agitation and the primary goal is symptom relief (foreseen hastening is not the goal). Intention is assessed *objectively* by the dose and context, not the clinician's inner thoughts. "Double effect" earns its keep here by focusing on the *proportionality of the means* (the dose) to the symptom, not on avoiding any risk of hastening death.

  ---

  **In Summary:**
  This procedure provides a structured, practical way for your group to navigate complex cases efficiently. It explicitly rejects the bare acts/omissions distinction as decisive, incorporates the essence of your tests while refining them, flags value conflicts for assignment, and focuses on objective factors for intention. It will sometimes deliver answers that feel uncomfortable (like the NG tube case being an active withdrawal) or require hard value judgments (inferring wishes). That honesty is necessary for robustness. Use the Morning Card for urgent triage and the Full Procedure for your group discussions and documentation.
