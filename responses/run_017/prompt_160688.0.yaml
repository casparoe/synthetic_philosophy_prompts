  First, I need to understand the core dilemma: how to acknowledge non-striking members without falling into debt or forgiveness frameworks. The user's insight about divisible benefits vs indivisible participation feels crucial here. They're right that this isn't just about free-riders - it's about shared future action. 

  The audience composition is tricky: strikers, crossers, non-members, families, HR, and a labor professor. That's a minefield. The professor nod about "not quitting but withholding labor" is legally significant for the bargaining unit concept. 

  Constraints analysis:
  - No naming/shaming
  - Can't claim victory (mixed outcomes)
  - No dwelling on losses
  - No insincere HR thanks
  - Limited "solidarity" usage
  - Must avoid debt/forgiveness binaries

  Hmm... the real challenge is making the participation point land as invitation, not threat. The key might be in the temporal framing - past action can't be changed, but future participation exists. The hospital setting helps: "we all heal together" could be a useful metaphor.

  For structure:
  Opening: Ground it in physical space (union hall, kids) to lower defenses
  Middle: Name the complexity without judgment, pivot to contract as living document
  Close: Focus on shared patients/workplace, with professor's point woven in organically

  I should test if the "indivisible experience" theory holds water. Philosophically, they're right - collective action creates social capital that isn't transferable. But in practice, some might still hear free-rider criticism. The speech softens this by making it about future access rather than past absence.

  Biggest risk: Three minutes is tight for these nuances. The draft keeps the professor point concise by tying it to why contracts bind everyone. HR gets neutral acknowledgment without thanks. "Solidarity" used sparingly as connective tissue.

  Alternative approach could've been to ignore non-strikers entirely, but that would feel dishonest given their presence. This walks the line by honoring strikers' sacrifice while holding space for others to join future actions. The potluck setting actually helps - it's inherently about shared contribution.

  Final check: Does this violate any constraints? No forgiveness/debt framing, no false victory lap, no shaming. The "door" metaphor might edge close to threat, but framed as standing together next time, it should land as invitation.
