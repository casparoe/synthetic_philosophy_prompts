answer: |-
  Right, let's dissect this properly. Your distinction between archive-truth and neighbour-truth is provocative and useful, but like any good theory, it needs stress-testing. I'll work through your points systematically, applying the gacaca case ruthlessly. Facts I'm uncertain about will be flagged.

  **1. The Mechanism & Archive-Truth Predictions for Gacaca**

  *   **Principal:** The post-genocide Rwandan state (specifically, the RPF-led government).
  *   **Agent:** The perpetrator-individual seeking leniency (within the gacaca eligibility criteria).
  *   **Currency:** Substantial sentence reduction (often converting prison time to community service, or reducing lengthy sentences), NOT full amnesty.
  *   **Disclosure:** Public confession detailing specific crimes committed (location, victims, methods, other participants), expressions of remorse, and requests for forgiveness. Includes naming accomplices and victims.
  *   **Verification Problem:** High. Relies heavily on:
      *   Public scrutiny during hearings (survivors, witnesses, other perpetrators present).
      *   Corroboration/contradiction from other testimonies (survivors, witnesses, *other confessing perpetrators*).
      *   Limited forensic evidence (due to scale, time elapsed, nature of killings).
      *   Lay judges (inyangamugayo) assessing plausibility and consistency.

  **Archive-Truth Model Predictions for Gacaca:**
  *   **Form:** Centralised, professionalised process focused on efficient evidence collection for a definitive historical record. Closed or semi-closed hearings might be preferred for "cleaner" testimony.
  *   **Leverage:** Full amnesty would be the primary currency offered for *comprehensive* disclosure, especially concerning command structures and high-level planning.
  *   **Focus:** Maximising the *stock* of verified facts, particularly the "who gave which orders to whom" chain. Final report would be paramount.
  *   **Scale:** Would likely prioritise a smaller number of strategically important cases or categories to ensure depth and verification quality, finding other mechanisms (or abandoning justice) for the foot soldiers. 850,000 cases would be seen as logistically impossible for "quality" truth.
  *   **Location:** Centralised or regional hubs for efficiency and record-keeping, not necessarily in the *exact* village where crimes occurred.
  *   **Outcome:** A voluminous, central archive detailing individual acts and chains of command. Reconciliation would be a hoped-for *byproduct* of establishing the factual record, not the core mechanism.

  **2. Gacaca Features: Explained vs. Misdescribed by Archive-Truth**

  *   **Leniency (not Amnesty):**
      *   **Misdescribed:** Archive-truth model strongly predicts amnesty as the logical currency for buying high-value truth. Gacaca's refusal of amnesty (offering only reduction) is a major deviation. *Your neighbour-truth lens explains this better:* the "visible mark" and ongoing community reintegration demand accountability, not erasure.
  *   **Local Public Audience & Lay Judges:**
      *   **Misdescribed/Not Predicted:** Archive-truth sees the audience as irrelevant noise; professionals verifying facts matter. Public, local hearings are inefficient and risk contamination. Lay judges lack verification skills. *Neighbour-truth explains this:* The audience *is* the point. Truth's value lies in its public performance *within* the affected community. Lay judges derive legitimacy from local standing and understanding context.
  *   **Sheer Volume & Thin Procedure:**
      *   **Partially Explained (as a *failure*):** Archive-truth would see this as an inevitable compromise leading to low-quality, potentially unreliable "truth" due to verification overload. Thin procedure sacrifices accuracy for coverage. *Neighbour-truth offers a different rationale:* The scale reflects the need for *widespread societal processing*, not just individual fact-filing. Speed and local participation (however flawed) were prioritised for societal stability and communal catharsis over perfect individual case files.
  *   **Exclusion of Organisers/Planners (to ordinary courts/ICTR):**
      *   **Misdescribed/Contradicted:** Archive-truth prioritises *buying* the command structure truth. Excluding them from the truth-bargain mechanism seems irrational; how do you get *their* truth? *Neighbour-truth offers a pragmatic explanation:* Local communities couldn't judge distant planners, the state wanted control over high-level narratives/punishment, and the neighbour-truth process (focused on local acts/reintegration) was ill-suited for complex chains of command. The trade *was* structurally broken for high-level truth.
  *   **Official Narrative (Tutsi victims/Hutu perpetrators, RPF exclusion):**
      *   **Not Adequately Explained by Either Model Directly:** Both models are silent on *which* truths get prioritised or suppressed by the state. The archive-truth model doesn't inherently predict a *distorted* archive, just a central one. The neighbour-truth model focuses on the *dynamics* of local truth-telling, not its content control. This outcome is driven by the *principal's* (state's) political objectives and its own role in the conflict, not the inherent logic of either truth type. *Both models need supplementing with state-power analysis.*

  **3. Excluding the Planners: Breaking or Enabling the Trade?**

  *   **It breaks the *archive-truth* trade for high-level truth.** The mechanism designed to *buy* the command structure (amnesty/leniency for full disclosure) wasn't available to them. Gacaca *could not* buy that truth by design. This truth had to come (if at all) from other sources: ordinary trials (often reliant on documents/witnesses, not perpetrator confessions), ICTR (limited reach), or political will for state disclosure (which didn't materialise for RPF actions).
  *   **It arguably *enabled* the *neighbour-truth* trade at the local level.** Including high-level planners in local gacaca courts would have been chaotic, unverifiable locally, and potentially destabilising. Removing them allowed the local process to focus on the acts that directly impacted the community – the killings, lootings, betrayals neighbours inflicted on neighbours. The "script" and "mark" applied to the *local* perpetrators. The trade (reduction for local public confession/reintegration) functioned precisely *because* it wasn't burdened with uncovering the complex national conspiracy. The planners' exclusion made the local bargain administratively and politically feasible.

  **4. Where the Theory is Silent (Gaps)**

  *   **Costs of Truth-Telling:** Both models are largely silent. Archive-truth ignores local dynamics. Neighbour-truth focuses on the *perpetrator's* reintegration cost/"mark" but doesn't sufficiently theorise the risks to *victims/witnesses*: threats, social ostracisation, re-traumatisation, post-testimony violence. Neighbour-truth's public, local nature *intensifies* these risks. Who bears the costs? Primarily vulnerable survivors and witnesses, often without adequate protection (a major criticism of gacaca).
  *   **Pace vs. Quality:** Archive-truth implicitly favours quality (verification), seeing rapid processing as a threat. Neighbour-truth *embraces* pace as necessary for societal processing and reintegration, explicitly prioritising it over exhaustive forensic verification per case. It argues the *social* value outweighs the individual case-file inaccuracy.
  *   **State as a Party:** Both models treat the state as a neutral principal seeking truth. Gacaca (and many TJ situations) show the state is often a *party* with its own crimes to hide (RPF exclusion) and a narrative to impose (official victim/perpetrator binary). Neither model adequately addresses how the state's partiality distorts the process: suppressing certain neighbour-truths (about RPF), manipulating the archive-truth (control over records/reports), and using the process for political consolidation.
  *   **Improved Cohabitation?** Neighbour-truth *posits* its mechanism (public script, visible mark, reintegration) should aid cohabitation. But it doesn't provide tools to *measure* this. Gacaca's impact is fiercely debated: some evidence points to reduced overt violence and forced cohabitation, but also to pervasive fear, distrust, suppressed anger, and lack of genuine reconciliation due to state coercion and narrative control. The theory needs to grapple with how *coerced* public performances and *imposed* narratives affect long-term cohabitation versus genuine reconciliation.

  **5. Running it the Other Way: Gacaca vs. Amnesty-for-Truth & Stress-Testing Your Distinction**

  *   **Gacaca as Anomaly to Amnesty-for-Truth (Archive Model):** Gacaca is a fundamental anomaly to the classic model: no amnesty, local/public focus, exclusion of planners, staggering scale, lay judges. It wasn't designed to build a central verified archive as the primary goal, though it generated vast records.
  *   **What Gacaca Reveals about Amnesty:** It strongly suggests amnesty was *never the essential load-bearing part* for achieving *local*, community-level truth about mass participation atrocities. What was essential was: **1) A tangible incentive** (sentence reduction was sufficient), **2) A mechanism forcing public performance** *within* the community, **3) A path to reintegration** tied to that performance. Amnesty is one form of incentive, but leniency works if the goal is reintegration with accountability, not erasure.
  *   **Stress-Testing Archive-Truth / Neighbour-Truth:**
      *   **Is it Doing Work? Yes, but...** It effectively captures two distinct *purposes* and *valuations* of truth in TJ. Archive-truth is commodified, stockpiled, state-centric. Neighbour-truth is performative, relational, community-centric, and rivalrous (costly/dangerous to produce, impacts social fabric). This distinction *explains* core features of gacaca (local, public, leniency-not-amnesty, reintegration focus) that the archive model cannot.
      *   **Where it Might Be Relabelling?** It overlaps with known concepts: "truth as acknowledgement" (neighbour-truth), "truth as historical record" (archive-truth). Its unique contribution is framing neighbour-truth as inherently *rivalrous* and *localised*, tying its value directly to the audience and the aftermath, and arguing this necessitates a fundamentally different transactional mechanism (not amnesty-for-facts, but reduction-for-public-script/reintegration).
      *   **What Would Falsify It?**
          *   If a process designed *purely* for archive-truth (centralised, amnesty-based, professional) *consistently* produced superior *local* reconciliation and reintegration outcomes compared to mechanisms like gacaca.
          *   If neighbour-truth processes consistently failed to produce valuable local knowledge or improve cohabitation despite the mechanism, while archive processes accidentally did.
          *   If the "rivalrous" nature wasn't evident – if truth-telling costs were negligible and social fabric unaffected by the *local* performance.
          *   If amnesty consistently proved *necessary* for obtaining *local-level* perpetrator confessions where leniency failed (evidence from gacaca suggests leniency was sufficient incentive for confessions *at that level*).
          *   If the "visible mark" and "shared script" were irrelevant to reintegration, and amnesty alone led to better societal outcomes (evidence suggests the opposite - blanket amnesty often fuels resentment).

  **Brutally Honest Conclusion on Your Framing:**

  It's **not confused; it's insightful and valuable.** The archive/neighbour distinction effectively highlights a blind spot in mainstream TJ theory, which often privileges the national archive while paying lip service to local reconciliation. It compellingly explains why gacaca looked nothing like a South African-style TRC and why amnesty wasn't the tool used.

  **However, it has limitations:**

  1.  **Under-theorises Power:** It doesn't fully grapple with how the *state* (as principal and often party) manipulates *both* kinds of truth for its own ends (suppressing neighbour-truth about its crimes, controlling the archive-truth narrative).
  2.  **Underestimates Victim Costs:** It focuses on the perpetrator's journey ("mark", "script", reintegration) but doesn't adequately centre the profound risks and costs borne by victims and witnesses in the neighbour-truth process.
  3.  **Measurement Gap:** It posits neighbour-truth aids cohabitation but lacks a framework to assess this versus the harms of coercion or suppressed truths.
  4.  **Potential Overlap:** While distinct, the processes interact. Neighbour-truth performances *feed* the archive (gacaca generated mountains of records). The national narrative *shapes* what neighbour-truths can be safely told. The lines aren't always absolute.

  **Gacaca ultimately confirms your core critique:** The classic amnesty-for-archive-truth model is inadequate for dealing with the scale and social nature of neighbour-on-neighbour violence. Gacaca's design (warts and all) reflects a pragmatic, if deeply flawed, attempt to operationalise something closer to your neighbour-truth transaction: buying public performance and a path to reintegration with leniency, not buying facts for a vault with amnesty. The distinction does real work in explaining *why* it took that form. The challenge is refining the model to better account for state power and victim vulnerability.
