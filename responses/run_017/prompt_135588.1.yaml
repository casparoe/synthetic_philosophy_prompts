prompt: |-
  OK so I just spent something like three hours arguing with my friend Priya at the pub about whether it's actually good to be as morally good as you can possibly be, and I came away realising I've got a pile of gut reactions I can't fit together. Her line was that the whole idea is repellent: a person who maximised moral goodness would be a bore, no fun to be around, no real interests of her own, and the rest of us are right not to want to be that or to marry that. (She kept invoking that famous paper about moral saints everyone trots out, and I kept saying that's a debating move, not an argument.) But once we started going through actual people instead of the abstract idea, I found myself defending some saints and being weirded out by others, and I can't tell you what the rule is.

  My verdicts, more or less as I blurted them out:

  1. Guy donates a kidney to a complete stranger, anonymously. Great. I'd want to be that person, I'd want my kid to grow up to be that person, nothing creepy about it.

  2. Woman gives away half her income for thirty years, lives in a small flat, keeps bees, plays in a ceilidh band. I admire her a lot and she seems *fine* — like someone you'd actually want at dinner.

  3. Woman gives away 90%, sleeps on a mattress, never takes a break, and describes people who don't as "complicit". I admire her from a distance, I don't want to be her and I don't want her at dinner, and — this is the bit Priya jumped on — I think she's somehow less good, not just less fun, than #2. Not worse at producing good outcomes. Worse as a person.

  4. Someone who has engineered her whole life so that being good is easy: no car, no smartphone, no social media, lives in a co-op, has quietly stripped every temptation out of her environment. She probably does more good than #2. I'm unimpressed. Which feels wrong and I can't defend it.

  5. A guy who spent two years of his life on a campaign that would have happened anyway without him — there was a backup, someone else lined up to do it just as well. I still admire him about as much as #1. Real sacrifice, zero outcome.

  6. Same guy, same two years, same sacrifice, same motives, except this time the campaign slightly backfires and makes things a bit worse. I don't admire him at all. Which is nuts, right? Because if I genuinely don't care about outcomes the backfire shouldn't matter, and if I do care about outcomes then #5 shouldn't get full credit for achieving nothing.

  7. A woman who's cared for her mother full time for fifteen years with no real alternative, who couldn't have walked away without catastrophe, who never exactly chose it in any ongoing sense. Everyone calls her a saint. I feel sad about her and I don't really admire her, which makes me feel like a jerk. She's sacrificed more than anyone else on this list.

  8. Someone who does an enormous amount of good for a rotten reason — to impress somebody, or out of guilt, or because he likes being the guy who does that. I don't admire *him*, but I don't think what he did is worth less. Those feel seperate to me and Priya said that was just having it both ways.

  9. Someone who is a saint about animals and basically cold to her own family. I think she's less good, not merely lopsided — like the shape of the whole life matters, not just the sum of it.

  During the argument I invented three things to try to sort this, and I want to know whether any of them do work or whether they're just my prejudices in a costume:

  - the photocopy test: clone the person N times into N relevantly similar situations and ask whether the world improves roughly N times over. The kidney donor passes. The second whistleblower at the same company doesn't. The daughter looking after her own mother doesn't. But #7 is exactly the case where the test says "no marginal value" and my reaction isn't about marginal value at all, so maybe the test is tracking something other than what I thought.

  - the exit-was-open clause: admiration only fires if the person could have walked away, at real cost to themselves and not much cost to anyone else, and didn't. This handles #7 nicely, but it also seems to make #4 *more* admirable rather than less, since she rebuilt her life on purpose.

  - moral ergonomics: the thought that arranging your life so virtue is cheap is itself an achievement and I'm being unfair to #4. I don't believe this but I can't say why not.

  So: is there a principle about what makes a maximally morally good life admirable — or desirable, or just plain good — that gets all nine, or nearly? I'd much rather have something that drops one or two of my reactions than something with a separate clause bolted on per case, so tell me which of them it can't accommodate and which you'd overturn. Constraints: nothing that quietly collapses into "produce the most good", since that's Priya's side and it clearly isn't what I think — outcomes only seem to move my reactions in one direction, and I want to know what that asymmetry is. And please don't give me a reading list or tell me who argued what first; I don't care about the bibliography, I want the shape of the thing.

  One case I keep going back and forth on that isn't above: someone who was pretty selfish and careless for thirty years and then, after a scare, becomes completely devoted and gives away everything for the last five. I definately find myself admiring that more than #2, and I can't tell whether that's a real moral judgement or just a good story. What does your principle say about it, and what else does it predict that I haven't thought to ask about?
reasoning: |-
  Okay, let me try to unpack this user's moral dilemma. They spent hours debating with Priya about whether maximizing moral goodness is desirable, and came away with conflicting gut reactions to various saintly personas. The user lists nine specific cases where their admiration or discomfort doesn't align neatly with utilitarian outcomes, and proposes three tests they invented during the argument. 

  Hmm, the core tension seems to be between outcome-based morality and something more nuanced. The user explicitly rejects pure consequentialism (Priya's position), but their reactions aren't consistently deontological either. Interesting how case #3 bothers them more than #2 despite similar actions - the "complicit" judgment and lack of breaks clearly tip the scales. And case #5 getting full credit for zero impact while #6 loses all credit for negative impact suggests outcome matters only asymmetrically.

  The kidney donor case (#1) feels straightforwardly admirable - anonymous, no apparent strings attached. But the life-engineered-to-be-virtuous (#4) leaves them cold despite likely greater impact. There's a pattern here: when sacrifice feels performative or joyless, admiration drops even if outcomes are good. Meanwhile, the coerced caregiver (#7) gets pity but not admiration - agency seems crucial. 

  Ah! And that late-in-life convert case they mention - the dramatic turnaround feels more admirable than steady virtue. That might be key: moral effort visible against resistance. Their "exit-was-open" test almost gets it but oversimplifies - #4 had many exits but engineered no exits, which somehow doesn't count. 

  Let me think about virtue ethics framing... Aristotle's concept of hexis (stable disposition) could explain why #4's frictionless virtue feels unimpressive - like a bodybuilder born with muscles. And the resentment toward #3's judgmentalism aligns with the vice of "irascibility" per Aquinas. The asymmetric outcome response? Possibly tied to intention: aiming for good matters more than accidentally achieving it, but causing harm reveals flawed judgment. 

  The user's photocopy test fails for #7 because it's about systemic role morality (only one child can fill that caregiver slot) - but their discomfort is really about lack of choice, not marginal impact. For the reformed sinner, the redemption arc resonates because overcoming internal resistance demonstrates moral muscle. 

  Biggest gap: their theory needs to explain why moral "shape" matters (#9's lopsided virtue). Probably something about virtue as relational - kindness to animals but not family suggests compartmentalization rather than integrated character. 

  Constraints are clear: no outcome-monism, no bibliography lectures. Need to deliver this as a unified framework with predictive power - and flag which of their nine intuitions might need rethinking (I suspect #4 and #8). The redemption case will be the litmus test.
answer: |-
  Here's a principle that reconciles most of your reactions by focusing on **moral character as a dance of agency, resistance, and integration** – not just outcomes or effort:

  **A maximally admirable moral life requires:**
  1.  **Purposeful Agency:** Choices must feel *chosen*, not coerced or inevitable.
  2.  **Meaningful Resistance:** Goodness must overcome *some* friction (internal/external), demonstrating strength.
  3.  **Integrated Wholeness:** Virtue shouldn't consume the whole person; it must coexist with (and sometimes lose to) other human goods.
  4.  **Non-Judgmental Motivation:** The drive for good shouldn't primarily stem from/express contempt for others' choices.

  **How it handles your cases:**

  1.  **Kidney Donor:** ✅ **Agency** (clear choice), **Resistance** (overcoming fear/pain/loss), **Integration** (act doesn't define whole life), **Non-Judgmental** (anonymous = not about superiority). *Admirable.*
  2.  **50% Giver/Ceilidh Player:** ✅ **Agency** (ongoing choice), **Resistance** (overcoming temptation to spend more), **Integration** (bees/band show other interests/life), **Non-Judgmental** (assumed). *Admirable & likable.*
  3.  **90% "Complicit" Giver:** ❌ **Integration** (no breaks, life consumed), **Non-Judgmental** (FAIL - contempt defines her). Effort/outcome high, but character flaw makes her "less good" *as a person*. Explains your unease.
  4.  **Engineered Life:** ⚠️ **Resistance** (FAIL - minimized friction makes virtue feel cheap/unearned). **Agency** (high in setup, low in daily choices). *Unimpressed reaction justified* – it lacks the struggle demonstrating moral muscle. (Overturns your feeling it "should" be impressive).
  5.  **Futile Sacrifice:** ✅ **Agency** (chose to act), **Resistance** (overcame cost/effort), **Integration** (act was time-limited, doesn't imply whole life consumed). Outcome irrelevant to *character admiration* – the *willingness* to sacrifice is proven. *Admirable.*
  6.  **Harmful Sacrifice:** ❌ **Agency/Resistance** intact, BUT... **Non-Judgmental** motivation doesn't save this. The *poor judgment* leading to harm reveals a flaw in practical wisdom/virtue itself. Admiration collapses because virtue requires *effective* (or at least prudent) good will, not just effort. *Predicts your shift.*
  7.  **Coerced Caregiver:** ⚠️ **Agency** (FAIL - "never exactly chose," no exit). **Resistance** (present, but against inevitability, not temptation). Sacrifice is real, but feels tragic, not virtuous, because it lacks *meaningful choice*. *Your lack of admiration isn't jerk behavior; it's recognizing coerced "virtue" isn't true virtue.*
  8.  **Rotten Reason:** ✅ **Agency/Resistance/Integration** might be present. BUT: **Non-Judgmental** motivation is irrelevant here. You separate *admiring the person* (hard due to motives) from *valuing the outcome* (real). **The principle explains this split:** The *act* produced good. The *character* is flawed by the rotten motivation. *Having it both ways is correct.*
  9.  **Animal Saint/Cold Family:** ❌ **Integration** (FAIL - virtue is lopsided, compartmentalized). Moral character is fractured; kindness isn't a stable trait integrated across life. "Shape" matters because virtue requires consistency and wholeness. *Less good as a person.*

  **The Late Convert (Selfish 30 yrs, Saintly 5 yrs):**
  *   **Your Admiration:** Makes sense under this principle.
      *   **Resistance:** Massive! Overcoming 30 years of habit/selfishness is huge friction.
      *   **Agency:** Dramatic, clear choice to change.
      *   **Integration:** Not shown to be consuming (though could be). The *transformation* itself is key.
  *   **Vs #2:** You might admire the *effort of transformation* more than #2's steady, lower-friction virtue. It's a "moral comeback story" showcasing immense resistance overcome. The principle predicts admiration, but whether it's *more* admirable than #2 depends on weighting the *scale of resistance overcome* vs. *sustained integration*.

  **Asymmetry of Outcomes Explained:**
  *   **Good Outcomes:** Not *sufficient* for admiration (see #3, #4), and not always *necessary* (see #5). Outcomes matter for judging *effectiveness/wisdom*, not just raw character.
  *   **Bad Outcomes:** Can be *fatal* to admiration because they reveal a failure in practical judgment (#6), which is part of virtue itself. Virtue aims at the good; harming despite effort suggests missing the mark.

  **What the Principle Drops/Overturns:**
  1.  **Drops:** The "Photocopy Test" as primary. It tracks marginal utility, not admirable character. Explains #7 (no marginal value, but your reaction is about agency).
  2.  **Overturns:** Your feeling that #4 "should" be admirable. The principle says engineered ease *diminishes* the demonstration of moral strength (Resistance).
  3.  **Overturns (Slightly):** Your initial guilt about #7. Lack of agency negates true virtuous admiration.

  **Predictions Beyond Your Cases:**
  *   You'd admire someone who struggles visibly but consistently with a vice (e.g., temper, greed) yet often overcomes it for good, more than someone naturally placid or generous.
  *   You'd find a philanthropist who enjoys luxury *but* makes significant, chosen sacrifices for causes (demonstrating agency/resistance) more admirable than #4, even if #4 gives more.
  *   You'd distrust someone whose "goodness" primarily manifests as publicly shaming others, even if it produces good outcomes (#3 effect).
  *   You'd admire small, difficult acts of kindness by someone in a hard situation (demonstrating agency/resistance) more than large, easy acts by the privileged.

  **The Shape:** Admirable moral goodness isn't about maximizing units of good or effort. It's about the **quality of the will** manifested in choosing the good *against resistance*, integrated into a recognizably human life, without contempt for others. It's the **dancer mastering difficult steps, not the machine efficiently producing moves, nor the martyr crushed by the performance.** Priya fears the machine or the martyr; your gut recognizes the dancer.
