prompt: |-
  Hey — I'm a PhD student working on blame and standing, and I've got an argument I built for a reading group last week that I'm now pretty sure proves way too much, but I can't put my finger on the move. Would love a diagnosis.

  Start with the case that got us going, which I'll call *structural hypocrisy*. A blames B for participating in some scheme — an industry, a supply chain, an institution, a professional incentive structure. A doesn't do what B does. But A's life is woven into that same scheme in a different role: A benefits from the fact that people like B do it, A would be put out if it stopped, and A hasn't made any move to exit. Some-one who flies constantly blaming an oil company's PR person for greenwashing. A meat-eater blaming a slaughterhouse worker. A journal editor blaming a grad student for CV-padding. Intuitively, A's standing looks compromised — not as badly as in plain hypocrisy, but compromised.

  Here's the argument I built off that intuition.

  (1) When A blames B for φ-ing, A implicitly asserts that B had adequate reason not to φ, and asserts it second-personally, as a demand A is entitled to make of B.
  (2) A is entitled to make such a demand only if A is not, with respect to the norm grounding the demand, in a worse or equal position than B. (Call it the clean-hands condition. The plain hypocrisy datum is supposed to fall out of this.)
  (3) What defeats standing in plain hypocrisy can't be identity of act-type: the smoking parent blaming the vaping kid hasn't vaped, and the father who cheated on his taxes can't blame his son for cheating on a test. What does the work must be something looser — that A is *implicated* in the norm A invokes: benefits from it, is disposed to keep accepting the pattern of behaviour A is calling out.
  (4) So standing is defeated by implication in a scheme, not only by having performed the same act.
  (5) Implication in this sense is nearly universal. Almost anyone who blames anyone for anything is a net beneficiary of some scheme that produces or enables wrongs of the relevant kind, and is disposed to go on benefiting.
  (6) Standing is a status of the blamer *with respect to the norm*, not with respect to the particular act blamed, so if it's defeated at all it's defeated across everything that norm covers.
  (7) So almost nobody has standing to blame almost anyone for almost anything.
  (8) But some blame is apt and some isn't, and the whole point of the category is to mark that difference. A view on which standing is basically never present doesn't distinguish apt from inapt blame, it just deletes the distinction we set out to draw.

  And the bit that makes me most suspicious: the argument seems to get things backwards. The worse and more systemic the wrong, the more scheme-like it is, so the more likely it is that any given blamer is implicated — which means the argument strips standing most aggressively exactly where we'd most want to insist that the blame is fine.

  I'd like to keep (3) and (8) if I possibly can — the move off act-type identity feels right to me and I don't want to go back to it. My friend says the flaw is (6) and that standing is local to the norm rather than global. But if I just localize it I don't see how I still get the smoking parent, whose relation to the norm looks local in exactly the way my friend says is fine.

  Which step do you reject? Why did it look okay, and what does rejecting it cost me — do I lose the structural-hypocrisy intuition, do I have to say something weird about the parent case, or is there a version of the argument that survives? Also: could the fix be that standing is restored by *acknowledging* implication, i.e. that self-blame buys it back? If so I'd want to know whether that makes standing suspiciously cheap, or whether it's actually the right story and my argument just shows that.

  Sorry if this is undercooked, I've been staring at it too long.
reasoning: |-
  Okay, the user is a PhD student working on blame and standing. They've built an argument based on structural hypocrisy cases but now think it proves too much, leading to the conclusion that almost no one has standing to blame anyone. They want help identifying the flaw and preserving key intuitions.

  First, I need to understand their argument step by step. The structural hypocrisy case involves someone benefiting from a system while blaming others participating in it. The argument moves from the clean-hands condition to implication in a scheme, leading to universal loss of standing. The user is suspicious because this seems to undermine blame for systemic wrongs where we'd want it to be valid.

  Key points they want to keep: (3) that standing isn't defeated by identical acts but by being implicated in the norm, and (8) that some blame should be apt. Their friend suggests (6) is the problem—standing being global rather than local—but the user worries this doesn't handle cases like the smoking parent.

  Looking at the premises. Premise (2) seems too broad. The clean-hands condition requires the blamer to be in a better position regarding the norm. But in structural cases, even if implicated, the blamer might still have a valid normative position. For example, an exploited worker blaming the CEO—both are in the system, but their roles and responsibilities differ significantly.

  The user mentions acknowledging implication as a possible fix. If A admits their complicity, does that restore standing? That could work, but might make standing too easy to achieve. Need to balance between cheap standing and complete loss.

  The smoking parent case: parent smokes, blames kid for vaping. Here, the parent is directly violating the same norm. But in structural hypocrisy, the blamer isn't doing the same act but benefiting from the system. Premise (3) conflates these. The parent's issue is direct violation, while the meat-eater blaming a slaughterhouse worker is about indirect complicity. These might need different treatments.

  Premise (6) states standing is defeated for all applications of the norm. But this global defeat isn't necessary. Standing could be context-specific. The smoking parent might lack standing to blame for nicotine use but could blame for other norms they uphold. However, the user wants to maintain that implication in the scheme defeats standing. But if we limit the scope, say, to the specific role in the scheme, then the meat-eater might still blame the worker if their complicity is different in kind.

  Systemic wrongs are the main issue. The user points out that for major systemic issues, everyone is implicated, so no one could blame. But intuitively, we still want to allow blame there. So premise (2)'s clean-hands condition might be too strict. Instead, standing could depend on the blamer's relationship to the specific act or role. For example, a consumer might blame a corporation for pollution even if they benefit from it, because the corporation has greater responsibility.

  Acknowledging complicity might restore standing. If the blamer admits their role and commits to change, their blame isn't hypocritical. But the user worries this makes standing too cheap. However, genuine acknowledgment and effort to change might be sufficient, distinguishing it from empty gestures. 

  The flaw is likely in premise (2) and the conflation in premise (3). By separating direct violation from indirect complicity, and adjusting the clean-hands condition to account for role-specific responsibilities, the argument can be fixed. This preserves structural hypocrisy intuitions without overgeneralizing. Allowing acknowledgment as a mitigator addresses cases where complicity exists but the blamer is actively addressing it.
answer: |-
  Your argument is fascinating and perceptively constructed—I see why it's troubling you. The flaw lies in **premise (2)**, specifically its *overgeneralized application* of the clean-hands condition. Let's diagnose step by step, preserve your core insights (especially (3) and (8)), and fix the overreach. Here's the breakdown:

  ### The Core Problem: Premise (2)'s Scope
  - **(2) claims**: A can demand B not to φ *only if* A is in a "better" position than B regarding the norm.  
  - **Why it's overbroad**: It conflates **role responsibility** with **personal compliance**. The clean-hands condition makes sense for *direct violations* (e.g., a tax cheat blaming another cheat) but fails for **structural complicity**, where roles differ radically.  

  ### Why Premise (2) Fails in Structural Cases
  Take your meat-eater (A) blaming a slaughterhouse worker (B):  
  - A is complicit in the *system* but doesn’t share B’s **role-specific duty**. B’s act (killing animals) is directly governed by the norm against cruelty; A’s act (eating meat) is governed by norms of consumption, not execution.  
  - A’s blame isn’t hypocritical *about B’s role*—it’s a demand that B *resist their role in the system*, which A might support through activism (e.g., lobbying for lab-grown meat). A’s complicity doesn’t negate B’s agency.  
  - **The fix**: Clean-hands applies only when A violates *the same role-governed norm* they invoke. Standing isn’t defeated by mere implication in a scheme—it’s defeated when A is **culpably enacting the same type of wrong**.  

  ### How This Saves Your Intuitions
  - **Preserves (3)**: You’re right that act-type identity isn’t key—it’s about **functional equivalence in norm-violation**. The smoking parent *is* violating the same health-preservation norm they invoke against the vaping child. The meat-eater isn’t violating the "don’t kill animals" norm—they’re violating "don’t fund killing." These are distinct norms with distinct demands.  
  - **Saves (8)**: Blame can be apt when the blamer’s implication doesn’t *replicate the blamed act’s moral structure*. The oil company PR person is *deceiving the public*; the frequent flyer is *contributing to emissions*. Only the former is blameworthy for dishonesty.  

  ### Why Premise (6) Isn’t the Main Issue (But Needs Tweaking)
  - Your friend is half-right: Standing *is* norm-relative, but **not globally defeated**. If A lacks standing to blame B for φ, it doesn’t infect *all* applications of the norm—just those where A is **similarly situated**.  
  - **Example**: A corrupt politician can’t blame others for bribery (same norm), but *can* blame a journalist for doxxing (different norm).  

  ### Addressing Systemic Wrongs
  Your worry about "backward" outcomes is spot-on. Under your original premise (2), blaming systemic wrongs (e.g., climate collapse) would *always* fail—since everyone is implicated. But:  
  - **Solution**: Standing requires **non-complicity in the *specific practice* blamed**, not the entire scheme. A sweatshop worker can blame the CEO for exploitation because their roles carry different powers/obligations. The worker’s implication (assembling goods) doesn’t equate to the CEO’s (designing exploitation).  

  ### Can Acknowledgment Restore Standing?
  Yes—but cautiously:  
  - **How it helps**: If A acknowledges their complicity ("I eat meat, but we both enable cruelty"), they show **normative consistency**. This avoids hypocrisy and may license blame *if* paired with efforts to change (e.g., reducing consumption, supporting alternatives).  
  - **Why it’s not "cheap"**: Empty acknowledgment ("I’m complicit, but whatever") doesn’t restore standing. It must reflect **sincere alignment with the norm**—e.g., "I’m trying to exit this scheme, and you should too."  
  - **Test case**: The journal editor who admits CV-padding is systemic ("I’ve padded mine, but we need to stop") *gains* standing to blame grad students if they reform review practices. Otherwise, it’s performative.  

  ### Revised Premises to Salvage Your Argument
  1. Keep (1) and (3) as is.  
  2. **Replace (2)**: A is entitled to demand B not to φ only if A isn’t *culpably enacting a functionally equivalent violation of the same norm*.  
  3. **Modify (6)**: Standing is defeated *only for acts where A’s conduct is functionally equivalent to B’s under the norm*.  
  4. **Amend (5)**: Implication *alone* doesn’t defeat standing—only *culpable, role-similar violation* does.  

  ### Result: Why Structural Hypocrisy *Sometimes* Defeats Standing
  - **Standing intact**: A frequent flyer blaming an oil executive for *lying about emissions* (norms: honesty vs. consumption).  
  - **Standing defeated**: A meat-eater blaming a *fellow consumer* for eating meat (same norm: "don’t fund cruelty").  

  This preserves your core insight—that act-type identity isn’t decisive—while blocking the "no one can blame anyone" collapse. The smoking parent *still* loses standing because parent/child share the same role (nicotine consumer) under the health norm. Systemic wrongs remain blameable when blamers target *agents with greater responsibility*.  

  Would refining the "role equivalence" criterion address your concerns? I’m happy to pressure-test specific cases.
