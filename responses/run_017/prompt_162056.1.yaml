  Ah, Jonas makes a classic mistake in move 3 - he's comparing building vs nothing rather than building vs not-building. Rae catches this perfectly in move 4 with the counterfactual analysis. That's probably the first decisive point.

  Move 5 is where it gets philosophically interesting. Jonas tries to shift to policy-level reasoning, which is common in these debates. But Rae's rebuttal in move 6 is devastating - without evidence about the distribution of correlations, how can we set such a policy? And her point about reference classes is fundamental - correlation isn't some objective number out there.

  Jonas's response in move 7 feels weak - yes reference classes are always problematic, but that doesn't make them less problematic here. In fact, the acausal trade scenario makes it worse because we have zero observable data.

  I notice both are missing something important: the issue isn't just statistical, it's metaphysical. What does it even mean for two civilizations to "trade" when they can't interact? The whole setup might be incoherent. And neither addresses how initial correlation gets established.

