prompt: |-
  I direct the appellate unit of a legal-aid office. Four staff attorneys file roughly two motions or briefs a week each, on deadlines the court sets; I sign and file everything, and I have about half an hour per draft. Over the past year they have all begun drafting with an AI assistant, and my problem is not that the work is wrong. It is that I increasingly cannot tell whether the person who produced a draft could defend it. I receive correct motions whose author cannot say which holding is load-bearing, cannot say what would have to be different for the motion to fail, and did not notice that the assistant quietly omitted the one contrary decision in our jurisdiction. I also notice the problem in myself: I am now tempted to check drafts by asking the same assistant, so neither of us is positioned to catch the failures that matter, since the loud ones I can catch unaided and the silent ones look exactly like everything else.

  I have been working with a rough three-way distinction — trusting the answer, trusting the route by which it was reached, and trusting one's own ability to tell when it is wrong — and I suspect the third is the one that erodes first and the only one my signature actually rests on. Sharpen this distinction or replace it with a better one, then turn it into a procedure my office can run on every assisted draft before I sign it.

  The procedure should give me:

  - Ordered questions, each with what counts as a sufficient answer, and a time budget that fits inside half an hour.
  - A way to separate, in language an overworked attorney can apply without any theory, between getting the right answer and grasping why it is right — while being explicit that the procedure only tests proxies for the second, and saying where those proxies break.
  - An explicit treatment of the asymmetry between failures the author can detect unaided and failures that are invisible to someone who no longer has the understanding the tool replaced, with each question labelled by which kind it targets.
  - The points where the procedure stops with a no, meaning it goes back to the attorney or is filed with something disclosed, and the points where it hands the decision to me because it turns on values rather than fact.
  - What to do when the honest answer to a question is that I cannot tell and the filing deadline is tomorrow.
  - What the procedure cannot do, including anything it can do about my own dependence on the tool when I review.

  Then run it on three cases of the shapes I actually see: a motion to suppress that is very likely to win, produced in twenty minutes, whose author cannot articulate why the controlling case applies; a procedural-history section that is boilerplate, machine-drafted, and spot-checked against the docket; and a novel argument the attorney found with the assistant, then verified against the reporters and can state what would defeat it. At least one of these should come out in a way I will not like — keep it that way, and tell me what I am supposed to do with that result. Finally, flag anywhere the procedure will systematically misfire by manufacturing the appearance of understanding rather than the thing itself.
reasoning: |-
  We are addressing a problem of erosion in the attorney's ability to defend their own work when using AI assistants. The core issue is not correctness (which is often maintained) but the loss of deep understanding and the ability to detect silent failures (where the AI omits key contrary authorities or makes subtle errors that are not immediately obvious).

  The proposed procedure is based on the distinction between:
  1. Trusting the answer (correctness)
  2. Trusting the route by which it was reached (process reliability)
  3. Trusting one's own ability to tell when it is wrong (epistemic self-reliance)

  The procedure will focus on the third, as it erodes first and is the foundation for the supervisor's signature.

  We design a procedure that fits in half an hour per draft (so the entire process must be within 30 minutes). It will consist of a set of ordered questions with time budgets and criteria for sufficient answers. The questions are designed to probe the attorney's understanding and to detect both visible and invisible failures.

  The procedure will include:
  - Labels for each question indicating whether it targets a failure that is detectable without deep understanding (visible) or one that requires the understanding that may have been eroded (invisible).
  - Clear stopping points (where the draft must be sent back or requires disclosure) and points where the decision is left to the supervisor's judgment.
  - Handling of situations where the reviewer (supervisor) cannot tell and the deadline is imminent.
  - Limitations of the procedure, including its inability to fully address the supervisor's own dependence on the tool.

  We'll design the procedure and then apply it to three cases.

  ---

  ### Draft Review Procedure: "Understanding Verification Protocol" (UVP)

  **Objective**: To assess whether the attorney has sufficient understanding to defend the draft, and to identify silent failures that the AI might have introduced.

  **Time Budget**: 25 minutes (leaving 5 minutes for final review and decision). The questions are designed to be asked in sequence, and the attorney must be prepared to answer on the spot.

  #### Questions and Process

  1. **Question 1: Core Argument Summary** (Time: 3 minutes)
     - *Question*: "In one or two sentences, what is the core legal argument of this motion/brief, and what specific legal authority is it primarily based on?"
     - *Target*: Visible failure (if the attorney cannot state the core argument, it's a visible gap).
     - *Sufficient Answer*: Clear articulation of the main argument and the primary authority (case/statute) without reading from the draft. Must correctly name the authority and the key point from it that supports the argument.
     - *Failure*: If the attorney cannot state the core argument or misstates the primary authority, it's a visible failure. Stop and send back for revision and re-understanding.

  2. **Question 2: Critical Fact Dependency** (Time: 4 minutes)
     - *Question*: "What are the one or two most critical facts in the record that make this argument viable? Conversely, what change in the facts would make this argument fail?"
     - *Target*: Invisible failure (the AI might have misapplied the law to facts, or the attorney might not have considered counterfactuals).
     - *Sufficient Answer*: Identification of key facts from the record (with citation to where they appear) and a reasonable counterfactual that would defeat the argument. The attorney must show they have considered the factual sensitivity.
     - *Failure*: If the attorney cannot identify the critical facts or cannot articulate a counterfactual that would defeat the argument, it indicates a lack of deep understanding. This is a potential invisible failure. Proceed to step 3 but note the concern.

  3. **Question 3: Counter Authority Check** (Time: 8 minutes)
     - *Question*: "What is the most on-point contrary authority in our jurisdiction, and how do we distinguish or overcome it? If there is none, what is the weakest point in our argument and how do we address it?"
     - *Target*: Invisible failure (the AI might have omitted a key contrary case, and the attorney might not have noticed).
     - *Sufficient Answer*: The attorney must either:
       a) Identify a known contrary authority and explain the distinction or rebuttal (with citation), or
       b) If none, identify the weakest part of their argument and explain how they mitigate it.
     - *Failure*: If the attorney is unaware of a key contrary authority (which the supervisor knows exists) or cannot identify a weak point, this is a critical invisible failure. Stop and send back for revision and research. If the attorney identifies a contrary authority that the draft does not address, that is also a failure.

  4. **Question 4: Procedural History & Boilerplate Verification** (Time: 5 minutes)
     - *Question*: (Only for sections that are boilerplate, e.g., procedural history) "Walk me through the procedural history of this case, highlighting any non-standard events or deadlines that are critical to our argument or the court's jurisdiction. Also, point out one place where you verified the boilerplate against the docket and what you checked."
     - *Target*: Visible and invisible failures (boilerplate might be wrong, and the attorney might not have checked).
     - *Sufficient Answer*: The attorney must highlight any critical procedural events (e.g., filing deadlines, key orders) and describe how they spot-checked (e.g., "I checked the docket for the date of the indictment and the motion deadline").
     - *Failure*: If the attorney cannot point to a specific check or misses a critical non-standard event, it's a visible failure for critical events and invisible for non-critical ones. If the failure is critical (e.g., a jurisdictional deadline), send back. Otherwise, proceed with a note of caution.

  5. **Question 5: Novel Argument Origin** (Time: 5 minutes)
     - *Question*: (If the draft includes a novel argument) "How did you develop this argument? What steps did you take to verify it beyond the AI's suggestion? What would be the strongest counterargument, and how do we respond?"
     - *Target*: Invisible failure (the AI might have suggested a novel but flawed argument, and the attorney might not have done due diligence).
     - *Sufficient Answer*: The attorney must describe independent verification (e.g., checked reporters, consulted secondary sources) and articulate a counterargument and response.
     - *Failure*: If the attorney did no independent verification or cannot state a counterargument, it's an invisible failure. Stop and send back for further research.

  **Decision Points**:
  - After each question, if the answer is insufficient and the failure is critical (as defined in the question), the draft is sent back to the attorney with specific instructions.
  - If the failure is non-critical (e.g., in Question 2 the counterfactual is weak but not entirely absent) and time is short, the supervisor may choose to override and file with a note of caution, but this should be rare.
  - At any point, if the supervisor feels the attorney's understanding is too shallow to defend the motion, they can require the attorney to rework without AI assistance.

  **When the Honest Answer is "I don't know" and Deadline is Tomorrow**:
  - If the attorney cannot answer a critical question (e.g., about counter authority) and the deadline is imminent, the supervisor must either:
     a) Personally conduct a focused review on that point (using their own understanding, not the AI) and decide if it can be fixed in time, or
     b) Disclose the uncertainty to the court (e.g., in a footnote: "Counsel notes that due to time constraints, the argument relies on [source] and has not been independently verified for contrary authority beyond [jurisdiction].") This is a last resort and should be avoided if possible.

  **What the Procedure Cannot Do**:
  - It cannot fully restore the understanding that the AI has eroded; it only tests proxies.
  - It cannot detect all silent failures, especially if the attorney has memorized answers to these questions without understanding.
  - It does not address the supervisor's own dependence on the AI. To mitigate this, the supervisor should avoid using the AI to check the draft and instead rely on their own knowledge and traditional research when in doubt. The procedure should be applied by the supervisor without AI assistance.

  **Manufactured Understanding**: The procedure might be gamed if attorneys learn the questions and prepare answers without real understanding. To combat this:
  - Vary the questions slightly (within the same intent) to avoid rote answers.
  - Require spontaneous answers (no preparation time for the review).
  - Occasionally ask the attorney to explain a different part of the draft not covered by the questions.

  ---

  ### Running the Procedure on Three Cases

  #### Case 1: Motion to Suppress (Likely to Win, Author Cannot Articulate Why Controlling Case Applies)
  - **Question 1**: Attorney is asked for the core argument and primary authority. They might say, "It's based on _Smith v. State_, which held that warrantless searches in this context are unconstitutional." But if asked why _Smith_ applies, they cannot explain the analogy. 
    - *Result*: Insufficient. The answer is superficial. Visible failure. **Stop and send back**. The attorney must be able to articulate the reasoning.

  #### Case 2: Procedural History Section (Boilerplate, Machine-Drafted, Spot-Checked)
  - **Question 4**: Attorney must walk through procedural history and point out a check. They say, "I checked the indictment date and the motion deadline against the docket; both are correct." But they miss a non-standard event (e.g., a continuance that affects the timeline). 
    - *Result*: If the continuance is critical (e.g., it extends a deadline and the motion is timely only because of it), then it's a visible failure. **Send back** to include and verify. If it's not critical, proceed with caution.

  #### Case 3: Novel Argument (Found with AI, Verified, Attorney Can State What Would Defeat It)
  - **Question 5**: Attorney explains they found the argument via AI, then checked the reporters and found supporting cases. They state a strong counterargument and their rebuttal. 
    - *Result*: Sufficient. Proceed to file.

  **One Unfavorable Outcome**: Case 1 comes out unfavorably (sent back). What to do? The attorney must rework the draft without AI (or with more careful use) and re-present. If the deadline is imminent, the supervisor might have to step in and help re-draft, but this is not sustainable. The office might need to provide training on the use of AI without losing critical thinking.

  **Manufactured Understanding in the Procedure**: In Case 2, if the attorney knows the supervisor always asks about the indictment date, they might only check that and not the continuance. The procedure cannot catch that if the supervisor does not know about the continuance. To mitigate, the supervisor should occasionally ask about other events (e.g., "Were there any continuances?") and require checks on randomly selected items.

  ---

  ### Final Procedure Summary

  **Step-by-Step**:
  1. Conduct the review in person or via video call to ensure spontaneity.
  2. Ask the questions in order, timing each.
  3. If any critical failure (as defined per question) occurs, stop and return the draft with instructions.
  4. If non-critical issues, note them and proceed, but the supervisor must then review those points extra carefully.
  5. If the attorney cannot answer and the deadline is imminent, the supervisor must either fix it personally (without AI) or disclose the limitation.
  6. After the review, if passed, the supervisor signs and files.

  **Training**: Attorneys should be trained that the goal is not to avoid the procedure but to maintain understanding. The office should encourage limited use of AI for drafting and require attorneys to always do independent verification.

  This procedure is a stopgap. The long-term solution may involve changing how AI is used (e.g., as a research starter but not a drafter) and fostering a culture of deep engagement with legal reasoning.
answer: |-
  Below is a structured procedure designed to address your core concern: **erosion of epistemic self-reliance** (the ability to detect when an AI-assisted draft is wrong). The procedure is grounded in your three-way trust distinction, with explicit focus on the third element ("trusting one's ability to tell when it's wrong") as the foundation for your signature. It targets "silent failures" (errors invisible without deep understanding) while accepting that "loud failures" (obvious errors) can be caught unaided.

  ---

  ### **Procedure: Understanding Verification Check (UVC)**  
  *For AI-assisted drafts, to be completed in ≤25 minutes (allowing 5 mins for final review/signing).*  
  **Core Principle:** Your signature requires that the drafting attorney can *defend* the work, not just that it's correct. This tests *proxies* for understanding, not understanding itself.  

  #### **Ordered Questions & Time Budget**  
  *Each question must be answered orally by the attorney during review. Answers must be spontaneous (no pre-scripting).*  

  1. **Question 1: Core Argument Probe** (Time: 4 mins)  
     - *Question:* "Walk me through the **one sentence** that is the linchpin of our argument. What would the court need to disagree with for this to fail?"  
     - *Sufficient Answer:* Identifies a specific legal proposition (e.g., "The search violated *Jones v. State* because X") and states a *legal counterfactual* (e.g., "If the court rejects *Jones*, we lose").  
     - *Failure Mode Targeted:* **Invisible** (AI may embed correct-but-unmoored logic; attorney can't spot flawed foundations).  
     - *If Unsatisfactory:* **Stop. Draft goes back.** Attorney must redraft without AI and re-explain.  

  2. **Question 2: Authority Stress Test** (Time: 7 mins)  
     - *Question:* "Point to **one key case/statute** in this draft. What is the *weakest aspect* of how we use it, and what contrary authority did you consider (or rule out)?"  
     - *Sufficient Answer:* Names a source, acknowledges a vulnerability (e.g., "This case is from a different district"), and either:  
       - Identifies a contrary authority and explains why it doesn't apply, OR  
       - States they checked standard sources (e.g., Shepard's, key treatises) and found none.  
     - *Failure Mode Targeted:* **Invisible** (AI omits contrary law; attorney doesn't know gaps exist).  
     - *If Unsatisfactory:* **Stop. Draft goes back.** Requires manual verification of authorities.  

  3. **Question 3: Procedural/Boilerplate Audit** (Time: 6 mins)  
     - *Question:* "For any **boilerplate section** (e.g., procedural history): What is *one fact you personally verified* against the record, and what is *one thing that could be challenged* as inaccurate?"  
     - *Sufficient Answer:* Names a verified element (e.g., "I checked the indictment date on the docket") and a hypothetical challenge (e.g., "Opposing counsel might dispute the timeline of X").  
     - *Failure Mode Targeted:* **Visible** (errors here are detectable, but attorney may skip verification).  
     - *If Unsatisfactory:* **Your judgment.** If minor, note in file; if material (e.g., jurisdiction), disclose or revise.  

  4. **Question 4: Novelty & Boundaries Check** (Time: 8 mins)  
     - *Question:* "If the court asked you *today*: 'What is new here, and what is the strongest rebuttal?', how would you answer?"  
     - *Sufficient Answer:* Distinguishes novelty (e.g., "We extend *Smith* to digital searches") and states a rebuttal (e.g., "The state will argue *Smith* is distinguishable because Y").  
     - *Failure Mode Targeted:* **Invisible** (AI invents plausible but unsound arguments; attorney can't anticipate counters).  
     - *If Unsatisfactory:* **Your judgment.** If novelty is high-risk, disclose AI assistance to court; else revise.  

  ---

  ### **Handling Critical Edge Cases**  
  - **"I don’t know" + Deadline Tomorrow:**  
    - If the attorney can’t answer Q1/Q2/Q4, **do not file**. Either:  
      - (a) You take over drafting (no AI), or  
      - (b) File with disclosure: "Counsel acknowledges reliance on AI assistance; arguments not independently verified."  
    - Rationale: Silent failures are indefensible; disclosure shifts risk ethically.  
  - **Your Own AI Dependence:**  
    - The UVC **cannot** protect you. To review:  
      - Ban AI tools during review.  
      - Spot-check 1–2 key claims with old-school methods (e.g., pull a statute yourself).  
      - If stuck, ask the attorney to explain *without the draft* (forces engagement).  

  ---

  ### **Testing the Procedure on Three Cases**  
  **Case 1: Motion to Suppress (Likely Win; Author Can’t Explain Why Controlling Case Applies)**  
  - **Q1:** Attorney cannot identify the linchpin sentence or legal counterfactual.  
  - **Result:** **Stop. Draft goes back.** Unacceptable—attorney couldn’t defend it if challenged.  
  - **What You Do:** Mandate redrafting without AI. If deadline forces filing, disclose AI reliance and your concerns to court.  

  **Case 2: Procedural History (AI-Drafted Boilerplate, Spot-Checked)**  
  - **Q3:** Attorney verifies one fact (e.g., filing date) but misses challengeable element (e.g., service date).  
  - **Result:** **Your judgment.** If minor (e.g., typo), file with note; if material (e.g., statute of limitations), revise.  
  - **Outcome:** Likely acceptable—boilerplate has lower stakes, and verification occurred.  

  **Case 3: Novel Argument (AI-Generated, Attorney Verified & Understands Boundaries)**  
  - **Q4:** Attorney explains novelty (e.g., "First to apply *Doe* in this context") and rebuttal (e.g., "State will cite *Roe*, but it’s distinguishable because Z").  
  - **Result:** **File.** Demonstrates deep engagement and meets all proxies.  

  ---

  ### **Where the Procedure Breaks**  
  1. **Manufactured Understanding:**  
     - Attorneys may memorize answers to these questions without real comprehension (e.g., "For Q2, always name a case and say 'no contrary authority'").  
     - **Mitigation:** Rotate questions (e.g., vary Q1’s focus between "linchpin sentence" / "key factual assumption") and require spontaneity.  

  2. **Silent Failures Beyond Proxies:**  
     - UVC can’t catch AI errors in domains the *attorney never understood* (e.g., if AI misapplies niche doctrine).  
     - **Mitigation:** Randomly audit 10% of drafts with a non-AI second reviewer.  

  3. **Erosion of Your Own Judgment:**  
     - The more you see "correct" AI drafts, the harder silent failures are to spot.  
     - **Mitigation:** Monthly "AI-off" exercises where attorneys litigate mock motions based on their drafts.  

  ---

  ### **Final Summary**  
  - **What UVC Does:** Tests proxies for epistemic self-reliance in ≤30 mins, targets silent failures, and forces accountability.  
  - **What It Can’t Do:**  
    - Restore deep expertise lost to AI dependence.  
    - Eliminate risk—only manage it.  
    - Protect you from your own reliance on AI.  
  - **Implementation:**  
    - Train attorneys: "UVC isn’t about correctness—it’s about whether *you* can tell if it’s wrong."  
    - Enforce strict time limits to avoid overwork.  
    - Use "disclose or revise" as a last resort for high-risk filings.  

  **Recommendation:** Start with a 1-month pilot on non-critical motions. Measure two outcomes: (1) Reduction in "unexplainable" drafts, (2) Time cost per motion. Adjust questions based on failure patterns.
