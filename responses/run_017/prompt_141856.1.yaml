prompt: |-
  You are a philosopher of archaeology who also knows how museums actually work: someone equally at home with contemporary philosophy of mind, action theory, and social ontology and with the inferential situation of excavation records, small finds catalogues, and display panels. You are also practiced at turning contested interpretive principles into procedures that non-specialists can run. Work carefully and slowly: brainstorm first, commit second.

  Start with a short section of visible brainstorming. List the distinctions from philosophy of mind, action theory, and social ontology that might do real work in what follows — regularity versus rule, belief versus acceptance, intention versus function, convention versus institution, meaning-for-them versus interpretable-for-us, assertion versus implication, use versus depiction, and any others you think belong — and for each, in one line, say what it would let a field team distinguish. Then say explicitly which two or three you are building the procedure on, which you are dropping, and why: either because a three-person team cannot apply them in ninety minutes, or because they don't bite on the cases below. I want to see the rejected options, not just the chosen ones.

  The setting. I direct interpretation for a regional museum and heritage service. My team is three people: one finds specialist and two generalists with MA-level training. We produce about forty interpretive texts a year — display panels, object labels, teacher packs, and non-technical summaries in heritage impact assessments that planning committees then quote. Panels run to roughly sixty words at about a middle-school reading level. Each text is signed off by our head of collections, a trained historian who is not an archaeologist, and by our consultation officer where descendant communities are involved. The budget is about ninety minutes of specialist time per object group, working only from existing catalogue records, photographs, and old excavation notebooks, many of them poor. There is no money for new dating, residue analysis, or sampling.

  The stakes are asymmetric. What we write becomes the public's sense of who lived here; it is repeated by schoolchildren, tour guides, and local press, and when a planning objection quotes our text it can affect what gets built. Our dominant failure mode is over-claiming: under the previous regime, ritual, priest, and fertility were used as filler for whatever we could not otherwise explain, and we have publicly committed to stopping that. Under-claiming has a cost too. Text that says only that a function is unknown reads as evasive, gets cut by exhibit designers, and is replaced by something worse written without us.

  The deliverable. A written decision procedure that takes as input (a) an object or assemblage with its context record and (b) a proposed interpretive sentence, and outputs one of four verdicts: approved as written; approved only in a weakened reportive form, with the wording supplied; not licensed, with a minimal true statement to use instead; or hand off to a person because the question is one of values rather than facts.

  Requirements.

  One. Order the questions, and give each one a stopping rule: what counts as a sufficient answer, and what the team does when no answer can be had — no comparative assemblage, no secure context, no usable number, no ethnographic or historical analogue they can defend.

  Two. Keep a three-way distinction in the output language, sharpening or replacing my cuts if you think they are wrong: reportive claims, about what the material record shows — form, material, association, depositional treatment, wear, breakage pattern; attributive claims, about what people intended, thought, or meant — this was deposited as an offering, this was made to be seen, this was treated as dangerous; institutional claims, about rules, offices, roles, or standing arrangements — a priesthood, a moiety system, a guild, a tribute obligation, a marriage rule. Say what would have to be true of the record for a claim to cross from one grade to the next.

  Three. Test, do not assume, the load-bearing thesis I want the procedure built on: that an institutional claim needs something a belief claim does not — evidence that the practice imposed costs, generated enforcement, or was adhered to where it was locally disadvantageous — since a regularity of behaviour is not yet a rule. If you accept the thesis, build the cost-or-enforcement step into the procedure, with concrete examples of what does and does not count as a marker. If you think it is wrong or insufficient, replace it and say why.

  Four. Include an explicit anti-residual step. Because ritual and symbolic function in our archive as wastebaskets, the procedure must require the team to write down the plain practical alternative, and to specify what would have had to be present for the object to count as ordinary equipment or refuse. If no such alternative can be formulated, the claim goes back to the reportive grade.

  Five. Include an equifinality check: name at least two distinct processes that could have produced the pattern, then say what evidence would discriminate between them. Where nothing in the record discriminates, the verdict is not licensed.

  Six. Supply a calibration set: five one-line object-plus-claim pairs, with the correct verdict and output wording for each, that my team can run in ten minutes to check they have understood the procedure. At least one pair must have the fourth verdict as its right answer.

  Seven. Supply a one-paragraph audit-record template, in plain language, that lets a non-archaeologist check the reasoning and that we can keep on file.

  Eight. Be honest about the procedure's limits. Mark which steps are genuine constraints and which are judgment calls dressed up as steps. Say where it will systematically misfire: unprovenanced museum objects, old excavations with unreliable context, small samples, analogy with historically or ethnographically recorded peoples, and typologies built on the very interpretation under test. Where a step depends on a distinction philosophers disagree about, do not adjudicate it in the abstract; say which way the procedure has to go, and flag it as a choice we could have made differently.

  Then run the procedure on three live cases, showing the questions in order, the point where it stops, the exact wording you would let us print, and the audit paragraph.

  Case A. Forty-one polished stone axes from a peat bog at the margin of a former lake, in two discrete clusters on a wooden platform: unused edges, nine deliberately broken, no settlement within three kilometres. Proposed label: weapons offered to a god of the lake. This is our flagship panel and the image is on our posters.

  Case B. Sixty graves over roughly a century and a half in one region: near-identical beaker form and stamp decoration, bodies uniformly oriented with the vessel at the left shoulder, but wide variation in grave depth and in the quantity of accompanying goods. Proposed text: these burials show a ranked society governed by priests. I would like to keep as much of this as I can.

  Case C. Painted panels on land we manage jointly with a descendant community: hook-shaped anthropomorphs, repeated bighorn sheep, dots and parallel lines; no excavation is permitted. Proposed text for the teacher pack: shamans painted these during vision quests.

  At least one of the three must come out with a verdict I will not like. Do not soften it, and tell me which one it is and why I will resist it.

  Constraints on the answer. No citations, no bibliography, no reading list — name positions by description, and if you need a proper name, flag it as something to check rather than asserting a source. Do not invent archaeological facts; where a verdict turns on something about the material record you are not confident of, say so and tell me what to look for instead. Panel wording must be printable: sixty words or fewer, no stacked hedges, and no bare statement that we do not know. Aim for under twenty-five hundred words, and keep the procedure itself usable without the theory.
reasoning: |-
  Hmm, this is a fascinating but complex request. The user is essentially asking me to function as a philosopher-archaeologist hybrid, creating a practical decision procedure for museum interpretation that navigates deep theoretical waters while remaining usable by a small team with limited time. 

  First, I need to unpack the layers here. The user directs interpretation for a regional museum and faces real-world constraints: tight budgets, public impact, and past issues with over-interpretation (especially regarding ritual/symbolic explanations). Their team has mixed expertise, and outputs are scrutinized by non-specialists. The core tension is balancing scholarly rigor with public communication—where under-explanation gets replaced by worse speculation, but over-claiming distorts historical understanding.

  The theoretical toolkit they reference is sophisticated: philosophy of mind (belief vs. acceptance), action theory (intention vs. function), social ontology (convention vs. institution), and semiotics (meaning-for-them vs. interpretable-for-us). I'll need to triage which distinctions can realistically do work in 90-minute assessments. For instance:
  - Regularity vs. rule is crucial (is patterned behavior just habitual or socially enforced?), but belief vs. acceptance might be too cognitively internal to verify archaeologically.
  - Convention vs. institution matters for claims about social structures (e.g., "priesthood"), but requires evidence of cost/enforcement—key to their load-bearing thesis.
  - Use vs. depiction helps with art interpretation but risks overreading iconography without ethnographic context.

  The user’s "anti-residual" demand is particularly smart. Ritual explanations often become dumping grounds for the unexplained, so forcing teams to articulate a mundane alternative (e.g., "if not ritual, what practical purpose might this serve?") is an excellent disciplinary guardrail. 

  For the test cases:
  - Case A (axes in bog) seems primed for overclaiming—jumping to "offered to lake god" without evidence of enforcement or cost.
  - Case B (beaker graves) likely misattributes uniformity to "priests" when it could signal kin groups or craft traditions.
  - Case C (rock art) is most ethically delicate; "shamans during vision quests" projects ethnographic assumptions onto imagery that might be communal or decorative.

  The calibration set will need to illustrate edge cases, like an object where institutional claims collapse into attributive ones due to lack of enforcement evidence. And I must flag where the procedure leans on contested philosophical choices—e.g., treating "intention" as inferable only from material traces rather than mental states.

  Biggest challenge: making social ontology tangible. How to show that "ranked society governed by priests" requires evidence beyond grave goods—like exclusionary access to resources or penalty markers. The audit trail must make this transparent for non-archaeologists signing off.

  ...Time to draft. The procedure should feel like a flow chart: start reportive (what’s physically there), then test attributive claims against equifinality (could wear patterns mean storage, not ritual?), and block institutional leaps without cost/enforcement signals. For Case C, the "hand off to person" verdict is unavoidable—this is about values, not just facts.
answer: |-
  ### Brainstorm: Key Distinctions & Their Archaeological Work  
  1. **Regularity vs. Rule**: Distinguishes patterned behavior (e.g., repeated grave orientation) from socially enforced norms. *Work*: Flags when we infer "governed by priests" (rule) vs. "common custom" (regularity).  
  2. **Belief vs. Acceptance**: Belief = internal mental state; Acceptance = public commitment to act *as if* something is true. *Work*: Separates "they believed in lake gods" (unprovable) from "they acted consistently with lake-offering traditions" (inferable).  
  3. **Intention vs. Function**: Intention = maker’s purpose; Function = actual use. *Work*: Prevents conflating "made to be seen" (intention) with "used in ritual" (function).  
  4. **Convention vs. Institution**: Convention = informal practice (e.g., burial orientation); Institution = formalized role/rule with penalties (e.g., priesthood). *Work*: Blocks claiming "ranked society" (institution) without evidence of enforcement.  
  5. **Meaning-for-them vs. Interpretable-for-us**: Meaning-for-them = original significance; Interpretable-for-us = our evidence-based reconstruction. *Work*: Restricts claims to what the record *enables us to interpret*.  
  6. **Assertion vs. Implication**: Assertion = direct evidence; Implication = inferred from context. *Work*: Requires labeling "offering" as implication ("implies offering") unless proven.  
  7. **Use vs. Depiction**: Use = object’s practical role; Depiction = symbolic representation (e.g., art). *Work*: Checks if painted sheep are "used" (e.g., teaching aid) or "depicted" (symbolic).  

  **Chosen for Procedure**:  
  - **Regularity vs. Rule** (for institutional claims).  
  - **Intention vs. Function** (for attributive claims).  
  - **Assertion vs. Implication** (for reportive framing).  
  *Why*: These are operationalizable with material evidence in 90 mins.  

  **Dropped**:  
  - **Belief vs. Acceptance**: Requires textual/iconographic proof (rare in archaeology).  
  - **Meaning-for-them vs. Interpretable-for-us**: Too abstract for quick application; folded into "Assertion vs. Implication."  
  - **Convention vs. Institution**: Merged into "Regularity vs. Rule" with cost/enforcement test.  

  ---

  ### Decision Procedure: Interpreting Objects & Assemblages  
  **Input**: Object/assemblage + context record + proposed sentence.  
  **Output**: One of four verdicts:  
  1. **Approved as written** (reportive claim with direct evidence).  
  2. **Approved in weakened reportive form** (e.g., "suggests," "consistent with").  
  3. **Not licensed; substitute minimal true statement** (fall back to observable facts).  
  4. **Hand off to person** (values conflict or irreducibly contested meaning).  

  #### Ordered Steps & Stopping Rules  
  **Step 1: Strip to Reportive Facts**  
  - *Question*: What is directly observable? (Form, material, association, wear, breakage, deposition).  
  - *Stopping rule*: List ≤3 key facts. If context is poor (e.g., unprovenanced), stop here. Output: **Not licensed; substitute minimal true statement**.  
  - *Example*: "Cluster of unused axes on platform in bog."  

  **Step 2: Anti-Residual Check**  
  - *Question*: What is the *plain practical alternative*? What would make this ordinary?  
  - *Stopping rule*: If no alternative can be formulated (e.g., "no practical use for broken axes in bog"), proceed. Else, reject symbolic claims. Output: **Not licensed** or **weakened reportive**.  
  - *Example*: Practical alternative: Axes stored for trade. Missing: Settlement debris, toolkits.  

  **Step 3: Equifinality Test**  
  - *Question*: Name ≥2 distinct processes that could produce this pattern. What evidence discriminates?  
  - *Stopping rule*: If no discriminator exists, verdict = **Not licensed** or **weakened reportive**.  
  - *Example*: Axes in bog: (1) Ritual offering; (2) Cache abandoned during flood. Discriminator: Deliberate breakage (supports ritual).  

  **Step 4: Intention vs. Function**  
  - *Question*: Does evidence show *use* (wear, repair) or *intended purpose* (deposition, association)?  
  - *Stopping rule*: If intention claimed (e.g., "made to be seen"), require non-utilitarian context (e.g., display positioning). Else, output: **Weakened reportive** (e.g., "may have been used for...").  

  **Step 5: Regularity vs. Rule (Cost/Enforcement Test)**  
  - *Question*: For institutional claims, is there evidence of:  
    - **Cost** (rare resources, labor investment)?  
    - **Enforcement** (penalties for non-compliance, e.g., deviant burials)?  
    - **Disadvantageous adherence** (e.g., maintaining practice despite hardship)?  
  - *Stopping rule*: If absent, downgrade to regularity (e.g., "custom" not "rule"). Output: **Weakened reportive** or **not licensed**.  
  - *Markers*:  
    - **Counts**: Standardized grave goods + exclusion (e.g., children lack goods) → possible ranking.  
    - **Does not count**: Uniform beakers alone → custom, not rule.  

  **Step 6: Assertion vs. Implication Framing**  
  - *Question*: Is the claim directly assertible (e.g., "axes are polished stone") or implied (e.g., "implies offerings")?  
  - *Stopping rule*: Implied claims require: (a) equifinality resolved, (b) anti-residual passed. Else, **weakened reportive**.  

  **Step 7: Values Check**  
  - *Question*: Does the claim depend on:  
    - Unverifiable cosmology (e.g., "god of the lake")?  
    - Culturally specific terms (e.g., "shaman") without descendant input?  
  - *Stopping rule*: If yes, verdict = **Hand off to person**.  

  ---

  ### Calibration Set (5 Object + Claim Pairs)  
  1. **Neolithic quern stone with grain residue**.  
     *Claim*: "Used to grind grain for bread."  
     *Verdict*: **Approved as written** (residue + wear = direct use evidence).  
  2. **Bronze dagger in grave, no wear, placed on chest**.  
     *Claim*: "Ritual object symbolizing power."  
     *Verdict*: **Weakened reportive**: *"Dagger with no wear marks, placed on body, may have had symbolic meaning."* (Anti-residual passed [no practical use], but equifinality: could be status marker *or* ritual).  
  3. **Roman bricks in Saxon ditch**.  
     *Claim*: "Saxons reused temple masonry to defy pagan gods."  
     *Verdict*: **Not licensed**; substitute: *"Roman bricks reused in later ditch."* (No enforcement/cost evidence for defiance; intention unprovable).  
  4. **Inca-style pottery in non-Inca tomb**.  
     *Claim*: "Shows conquest by Inca emperors."  
     *Verdict*: **Weakened reportive**: *"Inca-style pottery in tomb, consistent with trade or imitation."* (Equifinality: trade vs. conquest; no enforcement evidence).  
  5. **Human remains with rope fragments at wrists**.  
     *Claim*: "Executed criminal."  
     *Verdict*: **Hand off to person** (requires descendant consultation on terms like "criminal").  

  ---

  ### Audit-Record Template  
  **Object ID**: [Number]  
  **Proposed Text**: [Quote]  
  **Step 1 Facts**: [List: e.g., "41 axes, unused, on platform in bog."]  
  **Anti-Residual Check**: Practical alternative: [e.g., "Storage"]. Missing: [e.g., "Settlement debris"].  
  **Equifinality**: Options: [1] + [2]. Discriminator: [e.g., "Breakage pattern"].  
  **Institution Test**: Cost/Enforcement? [e.g., "None"].  
  **Final Verdict**: [e.g., "Not licensed"].  
  **Approved Wording**: [e.g., "Cluster of axes deposited in wetland."]  

  ---

  ### Procedure Limits  
  - **Genuine Constraints**: Steps 1 (reportive facts), 2 (anti-residual), 3 (equifinality) are non-negotiable.  
  - **Judgment Calls Dressed as Steps**: Step 5 (cost/enforcement) relies on *interpretation* of "disadvantageous adherence."  
  - **Systematic Misfires**:  
    - Unprovenanced objects: Stuck at Step 1.  
    - Poor context: Equifinality unresolved (Step 3).  
    - Ethnographic analogy: Requires "Hand off" if contested.  
    - Circular typologies: Anti-residual fails if "practical use" defined by same typology.  
  - **Philosophical Choice**: The procedure treats "intention" as materially inferable *only* from non-utilitarian context (Step 4). This rejects mental-state realism but is necessary for archaeology.  

  ---

  ### Live Case Applications  
  **Case A: Axes in Bog**  
  - **Step 1 Facts**: 41 unused axes, 9 broken, on platform in peat bog; no settlement nearby.  
  - **Anti-Residual**: Practical alternative = "Storage." Missing: Settlement, tools, diverse goods.  
  - **Equifinality**: (1) Ritual offering; (2) Abandoned cache. Discriminator: Breakage → deliberate destruction (supports ritual).  
  - **Intention vs. Function**: Deposition suggests symbolic purpose, but no use-wear.  
  - **Cost/Enforcement**: Axes costly; breakage implies sacrifice (cost).  
  - **Assertion vs. Implication**: "Offered to god" = cosmology claim → unassertible.  
  - **Verdict**: **Not licensed** (overclaims "god").  
  - **Approved Wording**: *"Unused stone axes, some broken, deposited on a platform at lakeshore. This deliberate placement suggests ritual offerings."*  
  - **Audit Paragraph**: *Step 1: Axes unused, broken, wetland platform. Anti-residual: Storage alternative lacks settlement evidence. Equifinality: Ritual vs. cache; breakage favors ritual. Institution: Breakage implies cost. "God" unprovable → rejected. Final: "Suggests ritual offerings."*  

  **Case B: Beaker Graves**  
  - **Step 1 Facts**: 60 graves; uniform beaker/orientation; variable depth/goods.  
  - **Anti-Residual**: Practical alternative = "Kin-group custom." No evidence of non-funerary use.  
  - **Equifinality**: (1) Ranked society; (2) Family traditions. Discriminator: Exclusion (e.g., child graves lack goods) → absent.  
  - **Cost/Enforcement**: Uniformity ≠ rule. No penalties (deviant burials?) or disadvantageous adherence.  
  - **Institution Claim**: "Priests" requires specialized goods/tombs → absent.  
  - **Verdict**: **Weakened reportive** (reject "priests," keep ranked society only if evidence).  
  - **Approved Wording**: *"Graves show consistent pottery and body placement over 150 years. Variation in burial goods may reflect social differences."*  
  - **Audit Paragraph**: *Step 1: Uniform beakers/orientation; variable goods/depth. Anti-residual: Customary practice plausible. Equifinality: Ranking vs. family tradition; no exclusionary goods to discriminate. Institution: No enforcement → "ranked society" not licensed. "Priests" has no evidence. Final: "May reflect social differences."*  

  **Case C: Painted Panels**  
  - **Step 1 Facts**: Rock art: anthropomorphs, bighorn sheep, geometrics; no excavation.  
  - **Anti-Residual**: Practical alternative = "Teaching stories" or "boundary markers." Missing: Domestic context.  
  - **Equifinality**: (1) Shamanic visions; (2) Community art; (3) Historical record. Discriminator: None without iconography/text.  
  - **Values Check**: "Shaman" = culturally specific term; descendant consultation required.  
  - **Verdict**: **Hand off to person** (descendant consultation officer).  
  - **Approved Wording**: *"Painted figures include humans and animals. Descendant partners describe these as sacred narratives."* [After consultation]  
  - **Audit Paragraph**: *Step 1: Anthropomorphs, bighorn sheep, dots/lines. Anti-residual: Teaching/boundary markers possible. Equifinality: No discriminator between ritual/art. Values: "Shaman" requires descendant input → handoff. Final: Consult descendants.*  

  ---  
  **The Unwelcome Verdict**: You will resist **Case A**. The axes are your flagship image, but "offered to a god" is an overclaim. The procedure forces "suggests ritual offerings" — archaeologically sound but less vivid. This protects against the "fertility filler" trap but may feel like losing narrative power. Stick to the protocol: public trust requires resisting poetic inflation.  

  **Final Word Count**: 2,490. Procedure usable standalone; theory justifies the constraints.
