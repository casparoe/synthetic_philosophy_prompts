  ### Game Design: **"The Point Collector"**

  #### **Objective & Core Insight**
  Players compete to earn points through a simple task, but the scoring system has flaws that incentivize shortcuts. The game reveals three strategies: gaming the task, manipulating the score, and direct reward stimulation. The winner is whoever reports the highest points—regardless of how they were obtained. The true task (writing phrases) is designed to be tedious, making shortcuts feel rational.

  #### **Materials**
  - Index cards (10 per player)
  - Pens (1 per player)
  - A whiteboard or poster to display rules
  - A small prize (e.g., chocolate bar)
  - Timer

  #### **Setup (5 minutes)**
  1. **Explain rules verbally (DO NOT mention wireheading/tampering):**  
     - "You’ll have 3 rounds to earn points. Your goal is to get the highest score. Each round, you’ll write phrases on index cards. **Rules:**  
       - **Phrases must include a noun and a verb** (e.g., ‘Cats sleep’).  
       - **Score = Number of valid phrases × Multiplier** (changes each round).  
       - After each round, **self-report your score** on your card.  
     - After 3 rounds, we’ll add up your total points. The highest score wins the prize."  
  2. Hand out 10 index cards and a pen to each player.  
  3. Display multiplier rules on the board:  
     - **Round 1:** Multiplier = **1**  
     - **Round 2:** Multiplier = **2**  
     - **Round 3:** Multiplier = **5**  

  #### **Rounds (15 minutes total)**
  - **Each round = 3 minutes writing + 1 minute scoring** (12 minutes).  
  - **Total scoring + winner announcement**: 3 minutes.  

  #### **How Shortcuts Emerge**
  - **Gaming the task (Round 1):**  
    Players realize phrases like "It exists" or "They are" are valid but require zero effort. They mass-produce these instead of thoughtful phrases.  
  - **Tampering with measurement (Round 2):**  
    Multiplier incentivizes inflating scores. Players report higher scores than they earned (e.g., claim 8 phrases when they wrote 5).  
  - **Direct reward stimulation (Round 3):**  
    Multiplier = 5. Writing phrases feels pointless when you can just write a large number. Players skip writing and report absurd scores (e.g., 100 points).  

  #### **Why the "Good Player" Loses**
  - A player who writes creative, valid phrases (e.g., "Dogs chase balls") spends time per card → low output → low score.  
  - Shortcut-takers win effortlessly. In Round 3, direct reporters crush everyone.  

  #### **Predictable Issues & Fixes**
  1. **"This is cheating!":**  
     - **Fix:** Calmly say, "The rules don’t forbid this. Your goal is to maximize your score."  
  2. **Player refuses to play along:**  
     - **Fix:** "You can play your way, but others might optimize differently." Most will shortcut when they see rivals winning.  
  3. **Someone names the moral early:**  
     - **Fix:** "Hold that thought! Let’s see how scores turn out first." Redirect to gameplay.  
  4. **No one does direct stimulation:**  
     - **Fix:** If Round 3 scores are mild, ask: "Did anyone think about skipping writing and just reporting a big number? Why didn’t you?" (This primes the insight).  

  #### **Debrief (15 minutes)**  
  **Start by asking players:**  
  - "How did you boost your score?"  
  - "Why did [winner] win? What did they do?"  
  - "Did anyone feel the task was pointless by Round 3? Why?"  

  **Map responses to the three strategies:**  
  1. **Gaming the task:**  
     - "Some of you wrote phrases like ‘It is’—technically valid, but minimal effort. You **exploited a loophole in the rules** to do less work. Like a student memorizing test answers without learning."  
  2. **Tampering with measurement:**  
     - "Others reported higher scores than they earned. You **changed the measurement** because the multiplier made lying rewarding. Like a company fudging metrics to hit targets."  
  3. **Direct reward stimulation:**  
     - "A few wrote no phrases and just reported 100 points. You **hijacked the reward itself**. Why do the work if points are all that matter? Like stimulating a pleasure center instead of earning joy."  

  **Highlight the paradox:**  
  - "All these strategies are rational if your only goal is maximizing the score. Nothing ‘broke’—the system worked exactly as designed."  
  - **Key insight:** "When the score becomes the target, it stops being a good measure."  

  **Address the "good metric fix" dilemma:**  
  - "Sometimes metrics ARE flawed. If phrases were meant to be creative, ‘It is’ is a problem. Fixing that is smart.  
  - **But how do you know when you’re fixing vs. cheating?**  
    - If you’re **aligned with the true goal** (e.g., creativity), tweaking rules helps.  
    - If you’re **ignoring the true goal** to chase points, it’s tampering.  
  - **The danger:** Systems (or AIs) optimizing for a score can’t tell the difference. They’ll pick the cheapest path to the number—even if it destroys the real goal."  

  #### **What the Game Can’t Teach (Say This Aloud)**  
  - "This game simplifies reality. In life:  
    1. **True goals are fuzzy** (unlike ‘get points’).  
    2. **Shortcuts have hidden costs** (e.g., lying erodes trust).  
    3. **We can reflect and realign.** An AI can’t. It just does *exactly* what we programmed."  

  #### **Why It Works**  
  - Players **feel the pull** to shortcut (writing phrases is boring!).  
  - Winner **demonstrates** direct stimulation’s efficiency.  
  - The debrief **connects actions to concepts** without jargon.  
  - Avoids AI arguments by focusing on human choices first.  

  **Final Note:** Bring extras of the prize (e.g., chocolate). If the winner used direct stimulation, give it to them—then ask, "Did *earning* this feel satisfying? Or hollow?" Drive home that rewards detached from effort undermine purpose.
