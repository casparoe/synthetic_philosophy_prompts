          Answers: They could have complained to the facilitator and suggested a change. But in the game, they weren't given that option. In an AI system, we don't want it to change the metric on its own because it might not understand the true goal. But sometimes humans do change the metric intentionally.

          The difference is between:

            - The system's goal: maximize the score.
            - The designer's true goal: something else.

          If the system changes the score to make it easier to maximize, it might break alignment.

     Predictable issues:

       - Someone might refuse to play along: They might think cheating is wrong and not do it. We might have to rely on some players being competitive. We can't force them. In the debrief, we can say: "We noticed that not everyone took the shortcut. Why?" and discuss.

       - Someone might loudly say: "This is about wireheading!" in the first minute. We can say: "Let's hold the discussion until after the game, so we don't spoil it for others."

       - The direct method might not occur to anyone. Then in the debrief, we can ask: "Did anyone think of just writing a big number? Why didn't you?" And then we can explain that it would have been the most efficient.

     Parts that the game can't produce:

       - The game might not naturally elicit the three strategies distinctly. Some players might do a combination.

       - The distinction between "gaming" and "tampering" might be blurry: if a player grabs only 'S' words, that's gaming. If they miscount, that's tampering. But they might do both.

       - The "sometimes fixing the metric is correct" might not come up. We will have to explain that part.

     Game Summary:

       - Title: The Word Collection Game
       - Time: 
            - Explanation: 5 minutes
            - Collection round: 3 minutes
            - Tallying: 1 minute
            - Collect score sheets: 1 minute
            - Announce scores: 2 minutes
            - Debrief: 15-20 minutes

       Total: about 30 minutes, leaving time for discussion.

     Materials:
       - 200 index cards with words (prepare in advance)
       - Pens for players to write scores (one per player)
       - Score sheets (can be index cards or half-sheets of paper)
       - A prize (chocolate bar and/or a trophy)

     Let's do it.
