  I'm writing the final essay for a module on knowledge and action — we did Ryle's knowing how / knowing that distinction and then the intellectualist comeback (the Stanley and Williamson line that knowing-how is really a species of knowing-that, under a practical mode of presentation) and then the anti-intellectualist ability accounts — and I want to do something less boring than another paper about piano-playing and bike-riding examples. So: read Ishiguro's The Remains of the Day as a test case in that debate, rather than as a novel about repressed feelings. My thesis, which two people in my seminar group argued about until the pub closed, is that Stevens is trouble for both camps. On anything like an ability or reliability account he is a virtuoso: there is nothing in his job he cannot do, he does it faultlessly under pressure, and if knowing-how just is having the right dispositions he's the best example in literature. And yet it feels exactly right to say he doesn't know what he is doing. But the intellectualists don't obviously do better, because Stevens isn't obviously missing a *proposition*: he can tell you that Darlington was misguided, that the two Jewish housemaids were dismissed for being Jewish, that Miss Kenton was edging towards a marriage proposal that evening while he was busy pouring. What he's missing, I've been calling "unowned competence" in my notes — know-how deliberately severed from any end of the agent's own, exercised in someone else's name — and I want to argue that the debate has no slot for it, and that the novel pushes us towards an answerability condition on knowing-how that neither side builds in.

  But I don't trust it, and I'd rather be told now than in my tutor's comments. So give me a reading that goes both ways: where does the book actually support this, and where does it resist or just not fit? I'd especially like you to work with the night his father dies upstairs while Stevens keeps serving downstairs and gets it exactly right; the business with the two housemaids and Miss Kenton's threatened notice; the evening he walks past what Miss Kenton is trying to say because there's a conference to run; his resolution to work on his bantering during the drive (if I've remembered that right); and the end on the seafront bench, where he says Darlington at least chose his own mistakes and he can't even claim that. And I want the bit an honest critic has to concede: is Stevens's failure really *epistemic* at all, or am I just dressing up self-deception and a wasted life in epistemology's clothes? Is "dignity" in this book a real skill-norm with standards internal to the practice, or is it a defence mechanism — and if it is a real skill, does the novel raise the awkward question of whether a skill can be excellent by its own lights and worthless or worse all things considered (the good torturer problem, sort of), a question Ryle's examples never touch?

  Give me about a thousand words, in British English please, and don't bother with footnotes, page refs or a reading list — I can't chase anything up at the moment, and I know the book well enough that you don't need to quote it at me. Where you think "unowned competence" is confused or just a relabelling of something we already have a name for, say so and say what the name is. I'd also like a short closing paragraph on what, if anything, the novel gives you here that the arguments on their own don't — and if you think someone who reckons the whole knowing-how debate rests on a mistake would get something different out of this book than I do, I'd like to hear that too.
