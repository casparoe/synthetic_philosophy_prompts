prompt: |-
  I am writing a thesis chapter on unilateral action under disagreement among agents who broadly share ends, and I have got as far as the standard statement of the unilateralist's curse: where many agents could each separately bring about a large outcome, and where errors in expected-value estimates are asymmetric, a group does better if each agent refrains when her private estimate of an act is positive but the group's is not. I now want to turn that into something that also covers cases where the unilateral option is an omission, where the agent's dissent is evaluative rather than empirical, and where the errors of the group are correlated with hers. Below are my verdicts on a set of cases, which I have tried to record honestly rather than consistently. I would like to know what principle, if any, they add up to.

  1. A virologist could, on her own initiative, run an experiment that makes a pathogen more transmissible in order to validate a vaccine platform. Her private expected-value estimate is strongly positive; her lab and her field are strongly negative. She should not proceed, and I do not find it close.

  2. The same experiment, but only two laboratories in the world have the samples and the clearance, and the other has considered and declined. The canonical argument says the effect scales with the number of agents who could act. I still think she should not proceed, and I find this barely less clear than case 1. When I press myself on why, what comes out is that it is not how many of us there are that bothers me, it is that the people who looked carefully came out the other way. If that is right, the number of possible actors is doing much less work than the standard presentation suggests; alternatively, this is the verdict that has to go.

  3. A small team wants to release the weights of a capable model. Most of the field thinks the risks dominate; the team does not. Full release: not fine. Release to vetted researchers under licence, with the reasoning published: fine. I cannot tell whether I think the gated option is genuinely less unilateral in the relevant sense, or merely the same act with a smaller variance behind it. (Relatedly: the stakes here are large but not civilisation-ending, and I still feel the pull. Is the variable the size of the stakes or the irreversibility of the act?)

  4. A mid-level employee has documents showing that her employer is still dumping toxic waste illegally, and that internal complaints have been buried. Her colleagues and family think going to a journalist is reckless and will ruin her. She may do it, and she may do it after taking advice from one lawyer rather than after deferring to anything wider. This is the pair that I cannot reconcile with case 1: one agent, private positive estimate, majority negative, big stakes, irreversible. My only stab at a difference is that the people around her are objecting on the basis of the costs to her and the firm rather than on the claim that the dumping is harmless.

  5. An engineer privately believes, against internal consensus, that a system about to be deployed will cause serious harm. His unilateral option is to slow the deployment by a few weeks; if he is wrong, the cost is delay. He should do it, and I think the curse reasoning gives no support whatsoever for restraint here. But if dozens of engineers could each delay, and errors are asymmetric, the same structure should generate a curse of obstruction, and I do not feel its force. I would like to know whether that is an inconsistency on my part.

  6. A programme officer with a discretionary budget holds, as a moral view, that a neglected cause is orders of magnitude more important than her colleagues think, and redirects funds to it on her own authority. Not fine. Yet the argument I started from is stated entirely in terms of expected-value estimates and seems indifferent to whether the outlier judgement is factual or evaluative, so either the principle needs a clause about that or this verdict goes.

  7. She works in a field where everyone's estimates come out of the same models and the same training, and she has a concrete reason to think the shared framework has broken down. The group agrees, and is confident. Here I think the presumption against acting is much weaker than in case 1 — weaker precisely where the group is most confident, which sits badly with any simple reading on which being an outlier just raises the probability that you are the one who is wrong.

  8. The case I keep reversing on: a methodologist finds an error in a widely used risk model that a professional body has already reviewed and approved, and considers going public over their heads. I lean towards yes if the evidence is genuinely hers and hard to transmit, and towards no if what is really at issue is how to weigh facts everyone already has.

  My own first pass at a principle is this. An agent may act unilaterally on a contested high-stakes judgement only if (i) the loss conditional on her being wrong is not much greater than the gain conditional on her being right; (ii) her dissent rests on evidence or reasoning the relevant others have not been able to assess; and (iii) she has taken the cheapest available steps to expose that reasoning to correction before acting. The presumption against acting strengthens with how much of an outlier she is among those who have looked carefully, and weakens with how far their errors are likely to be correlated with hers. This seems to me to get 1, 5 and 7 about right, to mishandle 4, where clause (ii) fails because her colleagues have heard the argument and rejected it, and to say nothing at all about 6.

  Please test that formulation against the cases and repair it, or replace it. I would like a principle, or a short list of candidates, stated precisely enough that I could apply it myself, with the case that motivates each clause; its verdicts on cases I have not listed — a civil servant bypassing ministers to stop a policy she privately judges disastrous, and a researcher who publishes her dissenting reasoning, gets no engagement, and then acts anyway; and an honest account of which of my verdicts it cannot accommodate and which I ought to abandon.
reasoning: |-
  Hmm, the user is working on a thesis chapter about unilateral action under disagreement among agents who share common goals. They've described the unilateralist's curse - where individual agents acting alone can cause harm if their private value estimates are overly optimistic compared to the group - and now want to extend this concept to cover omissions, evaluative dissent, and correlated errors.

  They've provided eight detailed case studies with their intuitive judgments about whether unilateral action is justified in each scenario. The cases involve virologists, whistleblowers, engineers, and program officers facing ethical dilemmas. The user has also proposed a preliminary principle with three conditions for justified unilateral action, but notes it doesn't fully capture all their intuitive judgments.

  The user is asking me to: 1) Test their proposed principle against the cases, 2) Repair or replace it with a better formulation, 3) Apply it to new hypothetical cases, and 4) Identify which of their original judgments might need to be abandoned for consistency.

  Looking at their cases, several patterns emerge:
  - They're more sympathetic to unilateral action when it involves omissions (case 5) or whistleblowing (case 4) versus proactive interventions (cases 1-3)
  - The source of disagreement matters - evaluative dissent (case 6) seems less justified than empirical dissent (case 7)
  - They care about whether the dissenter has unique information (case 8) and the reversibility of actions (cases 3 and 5)
  - Group confidence matters more than sheer numbers (case 2), and correlated errors weaken the presumption against acting (case 7)

  Their proposed principle has good elements but needs refinement. I notice it doesn't address the moral nature of dissent in case 6, the whistleblower exception in case 4, or properly handle the omission case 5. The "cheapest steps" condition also seems vague.

  I think I'll develop a more comprehensive principle that incorporates:
  - A distinction between creating irreversible harm and preventing it
  - Whether dissent is empirical vs. evaluative
  - The uniqueness of the agent's information
  - The reversibility of the action
  - The presence of wrongdoing in whistleblower cases
  - How correlated errors affect the weight of group judgment

  For the new cases they mentioned:
  - The civil servant bypassing ministers might be justified if preventing clear harm
  - The researcher acting after publishing without engagement would likely not be justified under this framework

  I'll need to explicitly note where the principle conflicts with some of their judgments, like case 4 (whistleblowing) where the group has heard the arguments, and case 6 (evaluative dissent) which would generally not be justified under the principle.
answer: |-
  Based on your cases and the tensions within them, your initial principle captures important elements but needs refinement to handle evaluative dissent, omissions, whistleblowing, correlated errors, and the *nature* of the group's objection. Below is a revised principle (and its justification) designed to systematize your intuitions, followed by its application to your cases, new cases, and an honesty box about inconsistencies.

  ---

  ### **Revised Principle: The Asymmetric Scrutiny Test**
  An agent may permissibly act unilaterally on a contested high-stakes judgment **if and only if**:
  1. **Asymmetric Harm Condition**: The worst-case harm from acting (if the agent is wrong) is not substantially worse than the worst-case harm from *not* acting (if the agent is right); **OR** the act reveals/prevents wrongdoing.  
  2. **Epistemic Independence Condition**: The agent’s dissent rests on evidence, reasoning, or evaluative premises *not adequately scrutinized* by the relevant group.  
  3. **Correlation Discount Condition**: The agent has positive reason to believe group errors are *correlated* (e.g., shared biases, institutional blind spots) or the group’s assessment lacks independence.  

  **Presumption Strength**:  
  The burden of justification increases with:  
  - The *irreversibility* and *scale* of potential harm.  
  - The *confidence* and *competence* of the group.  
  - The *proportion* of competent dissenters who share the agent’s view but refrain.  

  ---

  ### **How This Captures Your Cases**
  1. **Virologist (Pathogen Experiment)**:  
     - ❌ **Verdict: Should not proceed.**  
       *Justification*: Fails Asymmetric Harm (catastrophic tail risk if wrong) and Epistemic Independence (field scrutinized the risk). Group confidence/competence is high.  
  2. **Virologist (Only Two Labs)**:  
     - ❌ **Verdict: Still should not proceed.**  
       *Justification*: Not the *number* of agents but *scrutiny* matters. The other lab’s refusal after review signals competence-weighted consensus. Correlation Discount absent (no reason to distrust their process).  
  3. **Model Weights Release**:  
     - **Full Release**: ❌ Fails Asymmetric Harm (irreversible, high-stakes risk).  
     - **Gated Release**: ✅ **Permissible.**  
       *Justification*: Mitigates worst-case harm (reducing variance/irreversibility) and may satisfy Epistemic Independence (if licensing includes new scrutiny). Stakes matter via irreversibility.  
  4. **Whistleblower (Toxic Waste)**:  
     - ✅ **Verdict: May proceed.**  
       *Justification*: Satisfies Asymmetric Harm ("OR wrongdoing" clause—dumping is ongoing harm). Group objection focuses on *personal* costs, not the moral truth of the harm. Fails Epistemic Independence (they heard her), but wrongdoing overrides.  
  5. **Engineer (Delay Deployment)**:  
     - ✅ **Verdict: Should slow deployment.**  
       *Justification*: Asymmetric Harm favors action (low cost if wrong, high cost if right). Omission/obstruction avoids the curse because the "default" is harmful action. No obstruction curse because unilateral *inaction* isn’t additive (only one can "not act").  
  6. **Program Officer (Redirecting Funds)**:  
     - ❌ **Verdict: Not fine.**  
       *Justification*: Fails Epistemic Independence (evaluative dissent without novel scrutiny) and Asymmetric Harm (no wrongdoing; high opportunity cost if wrong). Evaluative dissent requires stronger scrutiny.  
  7. **Shared Model Breakdown**:  
     - ✅ **Verdict: Presumption weaker.**  
       *Justification*: Correlation Discount applies (group errors likely correlated). Group confidence backfires—if the shared model is flawed, confidence is a liability.  
  8. **Methodologist (Publicizing Error)**:  
     - ✅ **If evidence is unique/hard to transmit**: Yes (satisfies Epistemic Independence).  
     - ❌ **If weighing known facts**: No (fails Epistemic Independence).  

  ---

  ### **Application to New Cases**
  1. **Civil Servant Bypassing Ministers**:  
     - ✅ **Permissible if**:  
       - Asymmetric Harm: Inaction causes imminent, irreversible harm (e.g., disaster) > harm from acting.  
       - Epistemic Independence: She has unique data ministers ignored.  
     - ❌ **Not permissible if**:  
       - Harm is reversible or uncertain.  
       - Ministers scrutinized her evidence but disagreed.  
  2. **Researcher Publishes, Gets No Engagement, Acts Anyway**:  
     - ❌ **Not permissible.**  
       *Justification*: Fails Epistemic Independence (reasoning was exposed but not compelling enough to engage scrutiny). Group’s silence implies low credibility.  

  ---

  ### **Honesty Box: Inconsistencies and Tradeoffs**
  Your principle **cannot accommodate** two intuitions without modification:  
  - **Case 4 (Whistleblower)**: Your intuition hinges on "wrongdoing" overriding group consensus. The revised principle explicitly adds this as an exception to Asymmetric Harm.  
  - **Case 6 (Evaluative Dissent)**: You reject it, but your initial principle lacked tools to handle it. The revised principle treats evaluative dissent like empirical dissent but raises the bar for Epistemic Independence (requires novel scrutiny, e.g., new moral arguments).  

  **You should abandon**:  
  - **The centrality of "number of agents" (Case 2)**: Your intuition rejects this, and rightly so. What matters is *scrutiny depth* and *competence*, not headcount. The curse arises from *unscrutinized* unilateralism, not population size.  
  - **Indifference to empirical vs. evaluative dissent (Case 6)**: Evaluative dissent (e.g., moral weights) is harder to justify unilaterally because it lacks objective resolution mechanisms. The revised principle demands stronger evidence of flawed group scrutiny here.  

  ---

  ### **Why This Works**
  - **Asymmetric Harm Condition**: Explains Cases 1 (catastrophe), 3 (gating reduces harm), 4 (wrongdoing), 5 (omission cost asymmetry), and whistleblowing.  
  - **Epistemic Independence**: Addresses Cases 1, 2, 6–8. Distinguishes novel insights from stubbornness.  
  - **Correlation Discount**: Resolves Case 7 (shared models) and Case 2 (if labs are independent, discount doesn’t apply).  
  - **Presumption Factors**: Irreversibility (Case 3), group competence (Case 1), and "dissenters who refrain" (e.g., if other engineers in Case 5 agree but stay silent, presumption against acting strengthens).  

  This framework treats unilateral action as a *deviation from group agency* justified only when the group process is epistemically compromised *and* the stakes demand intervention. It rejects the unilateralist’s curse as purely quantitative, focusing instead on quality of scrutiny, error correlation, and moral asymmetries. Use this to structure your chapter—it aligns with your hard cases while flagging where intuitions conflict (e.g., evaluative dissent).
