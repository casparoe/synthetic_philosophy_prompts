  (b) Survey for beak length, color as byproduct:
  - The procedure is still sampling ravens without color bias. So it should be just as good as case 2. The fact that the original purpose was beak length doesn't change the fact that they recorded the color and would have noted a non-black one. So it should confirm.

  Now, we'll create two new cases:

  N1: You use a telescope to observe a distant planet and see a black object. It could be a raven (if there are ravens there) or a rock. You can't tell. 
