prompt: |-
  hey — I'm in a formal epistemology seminar this term and we just finished the confirmation theory block, and I think I've tied myself in knots. We did a session on the raven paradox: "all ravens are black" is logically equivalent to "everything that isn't black isn't a raven", so if an instance of a generalization confirms it (Nicod's criterion, roughly: observing an A that is a B confirms "all A are B"), then a white shoe confirms that all ravens are black. Which is ridiculous, but apparently follows. The three moves our TA gave us — accept it and say the amount is negligibly tiny, deny Nicod's criterion, or deny that logically equivalent hypotheses must be confirmed by the same evidence — all felt like dodges to me, so I tried writing down my own principle and it keeps breaking on my own cases.

  My tentative principle: an observation O confirms hypothesis H (relative to background knowledge K) to the degree that O was a severe test of H — i.e. to the degree that O is the kind of outcome that would probably *not* have come about if H were false, given the procedure that actually produced O. So on my view the confirming power lives in how the observation was generated, not in the logical shape of the sentence you write down afterwards. I like this because it seems to explain why the survey case feels better than the glance case. But I'm worried its not really a theory of confirmation anymore, just a theory of how good an experiment you ran.

  Here are my gut verdicts, going case by case. H is "all ravens are black" unless I say otherwise.

  1. You catch a raven at random, look at it in good light, it's black. — Confirms, a little.
  2. Same, except the raven came from a systematic survey that sampled ravens without regard to colour (the field team would definitely have recorded a pale one if they'd found one). — Confirms noticeably more than 1.
  3. A friend who only ever texts you about ravens when they're black texts you "saw a raven". — Confirms basically nothing; honestly feels slightly negative.
  4. You glance at an unfamiliar whitish object across the room, walk over, and work out that it's a shoe. — Tiny confirmation. I feel stupid saying it, but I do feel a twinge.
  5. You pick up a shoe you already knew was a shoe and check that it's white. — Nothing at all. Zero. But the report at the end is the same as in 4 ("this is a non-black thing that isn't a raven"), and I can't be right about both. This is the pair I keep flip-flopping on on, and its the one I most want help with.
  6. A green bottle sitting on your desk. — Same tiny twinge as 4. I want to say "sure, technically".
  7. You recount the shoes in your own closet, having catalogued every one of them last week. — Zero, and I don't even feel the twinge this time.
  8. An ornithologist tells you the museum's "pale and odd-plumage specimens" drawer — exactly where a non-black raven skin would end up if one existed — holds 400 specimens and no ravens. — Feels like strong confirmation. Way more than 4 or 6.
  9. You learn the world contains exactly ten non-black objects, and you examine one of them: it's a shoe. — My gut says that's actually decent confirmation?! Which freaks me out, because then the confirming power of a shoe depends on how many non-black things there are, which has nothing to do with ravens.
  10. Restricted hypothesis: "every bird in this sealed aviary is a black raven". You check all twelve birds: all black ravens. — Totally confirmed, done, nothing more to say.
  11. Same aviary, but you only check the birds' colours and never check whether anything else is in there. (There's a white mouse; you don't see it.) — Gut says I don't need to look for the mouse. But the equivalence condition says non-black non-ravens in the aviary are what matter.
  12. You see a black bird you can't identify — could be a raven, could be a crow. — Mild confirmation, I think, but of what, exactly?
  13. A genuinely leucistic raven, pale all over, photographed in the wild. — Refutes. (Control case, I'm confident.)
  14. A raven that some prankster spray-painted white. — Doesn't refute. Trivial.

  And two I haven't settled: (a) a classifier trained on photos tells you that none of the 100,000 images it tagged "non-black" is a raven, but you can't inspect the images yourself and it was trained partly on raven photos — confirm or not? (b) you find out the survey in case 2 was actually designed to test something about beak length, and the colour records are just a byproduct — does it still confirm H, less than 2, or not at all?

  So: is there one principle that gets all of this, or a small set of candidates? Which of my verdicts does each one force me to drop? Please don't just walk me through the standard positions from the literature, I've read those — work from my cases. I also want to know what happens to the equivalence condition under whatever principle you land on (kept? restricted to some cases? thrown out?), and whether my "severe test" idea is a real theory of confirmation or just a theory of experimental design wearing a costume.

  Can you give me the discussion first, then:

  TABLE with exactly these columns: case_number | short_label | my_verdict | principle_verdict | match (yes/no/partial) | clause_doing_the_work_or_reason_it_fails. One row for each of my 14 cases plus rows for at least two new cases you invent yourself (label them N1, N2, …), plus rows for (a) and (b).

  And after the table, a JSON object with these fields:

  {
    "principle_name": string,
    "one_sentence_statement": string,
    "clauses": [ {"clause": string, "motivating_case": string, "cost_or_worry": string} ],
    "my_verdicts_overturned": [ {"case": string, "why_it_has_to_go": string} ],
    "equivalence_condition": string (what happens to it and why),
    "verdicts_on_new_cases": [ {"case": string, "verdict": string, "reason": string} ],
    "residual_worry": string (the thing your own principle handles worst)
  }

  If you think no single principle can cover all of it, say so in the JSON too (set principle_name to something like "no unified principle" and use clauses for the alternative candidates), and tell me which cluster of verdicts I should sacrifice. No citations needed, and please don't tell me to go read someone — I want the argument, not a reading list.
reasoning: |-
  We are going to develop a principle based on the idea of "severe test" but refined to handle the cases. The key insight is that confirmation depends on the process by which the evidence was generated and the alternatives that were ruled out. We'll call it the "Severe Testing with Explicit Alternatives" (STEA) principle.

  Principle Statement: 
  An observation O confirms hypothesis H relative to background knowledge K to the degree that O results from a procedure that was designed (or happened) to be capable of detecting relevant alternatives to H, and the occurrence of O would have been unlikely if H were false (i.e., if one of the relevant alternatives held).

  Clauses:
  1. **Relevance of Alternatives**: The procedure must be sensitive to at least some of the ways H could be false (the relevant alternatives). The set of relevant alternatives is determined by the context, including the hypothesis and the background knowledge.
  2. **Severity of the Test**: The procedure must have a high probability of producing evidence that would be inconsistent with H (or at least some relevant alternatives) if H were false. In other words, the test must be such that if H is false, the procedure would likely not have produced O.
  3. **Background Knowledge Incorporation**: The assessment of severity and relevance must take into account the background knowledge, which can include information about the domain, the sampling method, and the reliability of the instruments or observers.

  Now, let's apply this to the cases. We'll go through each one and then summarize in the table.

  Case 1: Random raven, looked at in good light, black.
  - Verdict: Confirms a little.
  - STEA: The procedure (catching a raven at random and looking) is capable of detecting non-black ravens (if they exist). Since we found a black one, and if there were non-black ravens, we might have caught one (depending on their frequency), it provides some confirmation. But because the sample size is small, the confirmation is weak.

  Case 2: Systematic survey, without regard to color, recorded a black raven.
  - Verdict: Confirms more than 1.
  - STEA: The survey is designed to sample ravens without color bias, so it is a severe test. The procedure would have found a non-black raven if it existed (assuming the survey is comprehensive). The observation of a black raven (and many more, presumably) in such a survey strongly confirms.

  Case 3: Friend texts only about black ravens.
  - Verdict: Confirms nothing, maybe slightly negative.
  - STEA: The procedure (friend's report) is not a severe test because the friend only reports when they see a black raven. If there were a non-black raven, they wouldn't report it. So the observation (they reported a raven) only tells us they saw a black one, which we already knew they would do. It doesn't rule out non-black ravens. Moreover, if they saw a non-black raven, they wouldn't have texted, so the absence of a text might be more informative? But in this case, the text doesn't add much. It might even slightly lower our confidence because if there were many non-black ravens, we might not get a text at all, but we did get one, so that might suggest there are black ones (but we already knew that). Overall, it doesn't confirm H.

  Case 4: Glance at whitish object, walk over, find it's a white shoe.
  - Verdict: Tiny confirmation.
  - STEA: The procedure (noticing a whitish object and checking) is a weak test for non-black non-ravens. It might have been a non-black raven, but it turned out to be a shoe. So it does rule out one potential counterexample in a very limited way. But the procedure is not systematic and only covers one object. So very weak confirmation.

  Case 5: Pick up a known shoe and check it's white.
  - Verdict: Nothing at all.
  - STEA: The procedure is checking a known shoe. But we already know that the object is a shoe (so not a raven). The test is not capable of detecting a non-black raven because we are looking at a shoe. Therefore, it doesn't test H at all. The observation doesn't rule out any alternative where a non-black raven exists. So zero confirmation.

  Case 6: Green bottle on desk.
  - Verdict: Tiny twinge (same as 4).
  - STEA: Similar to case 4. The bottle is a non-black non-raven. The procedure (noticing the bottle) is not a planned test, but it rules out one possibility: that this particular bottle was a non-black raven. But again, very weak because it's one object and not systematic.

  Case 7: Recount shoes in own closet, cataloged last week.
  - Verdict: Zero.
  - STEA: We are examining objects we already know are shoes and non-black. The procedure doesn't have the capability to detect a non-black raven because we are only looking at shoes. So no confirmation.

  Case 8: Ornithologist reports that the "pale and odd-plumage" drawer has 400 specimens and no ravens.
  - Verdict: Strong confirmation.
  - STEA: The procedure (checking the drawer where a non-black raven would be if it existed) is a severe test for non-black ravens. The drawer is exactly the place to look. The observation (no ravens) would be very unlikely if there were non-black ravens (because they would have been collected and put there). So it strongly confirms.

  Case 9: World has exactly ten non-black objects; examine one: it's a shoe.
  - Verdict: Decent confirmation.
  - STEA: The procedure (examining one of the ten non-black objects) has a high chance of finding a non-black raven if one exists (since there are only ten non-black objects). Finding that it is a shoe (and not a raven) rules out one of the ten possibilities. If there were a non-black raven, there would be a 1/10 chance that we missed it by picking this one. But since we found a shoe, we have reduced the pool of unknown non-black objects by one. The degree of confirmation is substantial because the test was severe relative to the small set of non-black objects.

  Case 10: Sealed aviary, check all twelve birds: all black ravens.
  - Verdict: Totally confirmed.
  - STEA: The procedure (checking every bird in the aviary) is comprehensive. It rules out any non-black bird or non-raven bird in the aviary. So H is confirmed.

  Case 11: Same aviary, only check the birds' colors, not what else is in there (and there's a white mouse).
  - Verdict: Gut says we don't need to look for the mouse.
  - STEA: The hypothesis is about every bird in the aviary. We checked all birds and they are black ravens. The white mouse is not a bird, so it doesn't matter. The procedure (checking all birds) is sufficient. The equivalence condition would say that a non-black non-raven (like the mouse) is relevant, but the mouse is not a bird. So H is confirmed.

  Case 12: See a black bird, can't identify (raven or crow).
  - Verdict: Mild confirmation.
  - STEA: The hypothesis is "all ravens are black". The observation is of a black bird that might be a raven. If it were a raven, it would be a positive instance. But if it were a crow (which is also black) then it doesn't tell us about ravens. The procedure (seeing a black bird) is not a severe test for non-black ravens because it doesn't rule out the possibility that there are non-black ravens elsewhere. It does provide a little confirmation because if there were many non-black ravens, we might have seen one, but we saw a black bird that could be a raven. However, it's weak.

  Case 13: Leucistic raven.
  - Verdict: Refutes.
  - STEA: Direct counterexample. The procedure (photographing in the wild) is a severe test because it found a non-black raven.

  Case 14: Prankster spray-painted white raven.
  - Verdict: Doesn't refute.
  - STEA: The hypothesis is about natural color. The painted raven is not a counterexample because it's not naturally non-black. So it doesn't refute.

  Now, for the two unsettled cases:

