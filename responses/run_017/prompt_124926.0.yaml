prompt: |-
  we're picking the supervision setup for our next training run and i wrote down what i actually believe so the team can attack it before we commit to anything. honest feeling that some of this doesnt fit together but i can't locate it. please skip the background lecture on why scalable oversight is hard, i've read that part.

  1. outcome reward is the only signal that isn't arbitrary. a process reward is a proxy, proxies get goodharted, so wherever the outcome is cheap to verify we should grade the outcome and nothing else.
  2. but the supervision that actually matters to us — help with our own research, long-horizon agentic stuff, anything where you don't know if it worked for weeks — is exactly the stuff whose outcomes we can't verify, so that's where we need process-based supervision.
  3. we should never put optimization pressure on the chain of thought itself. the trace being a readable window onto what the model is doing is worth more than whatever training signal we'd squeeze out of it, and the moment you start grading it you've corrupted the window.
  4. i also don't think faithfulness is even the right standard for a trace. the cot is computation the model is doing, not a report it's handing us; asking whether it faithfully reports its own reasoning is a category error. what we want is for the trace to be useful to us, which is a different property.
  5. if we stress-test a model, find no case where it lands on a right answer for a bad reason, and its explanations look fine to our domain experts, we should update toward "it's fine" rather than toward "our oversight is too weak to see the problem". absence of evidence is evidence of absence here.
  6. for the hard tasks i want step-level labels without paying people to hand-label: take a partial trace, roll out a bunch of continuations from a stronger model we have lying around, and score the prefix by how often those rollouts reach a verified outcome. process supervision for free.
  7. case verdict: on our math set about a third of the prefixes that the scorer in 6 rates as high-value contain a step that's actually wrong, just recoverable, and i want to leave those in the training data — the rollouts show they get to right answers often enough.

  give me the audit: which pairs are really in tension, worst first, and for each one which commitment has to go and what giving it up costs me. flag anything that only looks like a conflict but is actually fine, because the whole list feels slightly off to me right now and that can't be right. and if there's a single revision that clears up the most at once, say which one.
reasoning: |-
  Okay, the user is asking for an audit of their supervision setup beliefs. They've listed 7 points and feel something's off but can't pinpoint it. Let me start by understanding each point and how they interact.

  First, point 1 emphasizes outcome rewards as the only non-arbitrary signal. Proxies like process rewards get gamed. But point 2 says the important supervision—like long-horizon research help—can't be outcome-verified, forcing them into process-based methods. That's a direct tension: the very situations where they need supervision most contradict their ideal of only using outcomes. They have to compromise on point 1 for practicality, accepting proxy risks in hard tasks.

  Point 3 insists on never optimizing the chain of thought to keep it a transparent window. But point 4 argues that faithfulness isn't the goal; usefulness is. If they're not grading the CoT, how do they ensure it's useful? There's a conflict here: avoiding optimization pressure might lead to less useful traces. They need to either allow some pressure for usefulness or risk unhelpful CoTs.

  Point 5 says absence of evidence (of problems) is evidence of absence. But their method in point 6 uses rollout-based scoring, which point 7 shows flags recoverable errors as high-value. If they rely on stress-tests without catching these, they might falsely assume safety. This undermines point 5 because their oversight method has known blind spots. They must either drop point 5's optimism or improve their verification to catch subtle flaws.

  Point 6's rollout method is cost-effective but point 7 reveals it labels flawed prefixes as high-value. They want to keep those in training data, which might teach models to make recoverable errors. If those errors become unrecoverable in harder tasks, it's risky. They have to choose: accept this risk for efficiency or find a better way to filter prefixes.

  Looking for the worst tensions:
  1. Points 1 and 2 clash fundamentally—outcome-only isn't feasible for hard tasks. Sacrificing strict outcome purity is necessary but costly due to Goodharting risks.
  2. Points 3 and 4: Avoiding CoT optimization vs. needing useful traces. They might need targeted optimization for usefulness, risking some transparency.
  3. Points 5, 6, and 7: Stress-test confidence vs. known gaps in rollout scoring. Keeping flawed data could propagate errors, so point 5's optimism is dangerous here.

  A key revision could be rethinking point 4: if "useful" CoTs require some optimization, they might adjust point 3 to allow minimal, careful pressure. Also, admitting point 1's ideal isn't universal allows focusing on robust proxies for hard tasks. 

  The user's unease likely comes from these unresolved tensions. Highlighting the trade-offs clearly, especially where principles conflict with practical methods, should help them decide where to compromise.
answer: |-
  Here's the audit of tensions in your supervision setup beliefs, ordered by severity. I've flagged genuine conflicts, surface-level tensions that might be resolvable, and suggested key revisions:

  ### **Worst Tensions (Fundamental Incompatibilities)**
  1. **Point 1 vs. Point 2**  
     - **Conflict**: You insist outcome rewards are the *only* non-arbitrary signal (1), but admit that hard tasks *require* process-based supervision (2).  
     - **What must go**: Strict adherence to "only outcome rewards where cheap" (1).  
     - **Cost**: Accepting proxies for hard tasks opens Goodharting risks. You trade "non-arbitrary" oversight for practicality, risking goal divergence in high-stakes domains.  
     - **Resolution**: Reframe point 1: "Prefer outcome rewards where feasible, but use *minimally arbitrary* process rewards for hard tasks."

  2. **Point 3 vs. Point 6**  
     - **Conflict**: You forbid optimization pressure on CoT (3), but propose training with step-level scores from rollout-based RL (6). This *directly* optimizes the trace.  
     - **What must go**: Absolute rejection of CoT optimization (3).  
     - **Cost**: Optimizing the trace (via rollout scores) may corrupt its readability/usefulness. Models may learn to generate "rollout-friendly" steps that *look* useful but hide errors.  
     - **Resolution**: Allow *limited, targeted* optimization for CoT usefulness (aligning with point 4), but monitor for corruption.

  3. **Point 5 vs. Point 7**  
     - **Conflict**: You claim absence of flaws in stress tests is evidence of safety (5), but your rollout method (6) knowingly includes "recoverable errors" (7) that stress tests might miss.  
     - **What must go**: Unqualified "absence of evidence = evidence of absence" (5).  
     - **Cost**: Accepting recoverable errors (7) means stress tests *can't* reliably prove safety. Flaws might compound in novel scenarios.  
     - **Resolution**: Reject point 5 as stated. Stress tests only indicate *relative* safety within tested boundaries. Recoverable errors (7) require monitoring for edge cases.

  ---

  ### **Secondary Tensions (Resolvable with Clarification)**
  4. **Point 4 vs. Point 3**  
     - **Surface Conflict**: If CoT isn’t a "report" (4), why worry about corrupting it via optimization (3)?  
     - **Resolution**: **Compatible if reframed**. Optimization pressure might degrade CoT’s *utility* (e.g., making steps opaque or adversarial). Keep point 3 but reinterpret "corrupted window" as "reduced usefulness".  

  5. **Point 6 vs. Point 7**  
     - **Surface Conflict**: Rollout scoring (6) labels flawed prefixes as "high-value", yet you keep them (7). Doesn’t this incentivize errors?  
     - **Resolution**: **Compatible** if you distinguish:  
       - Rollout scores measure *path robustness* (likelihood of recovery), not step correctness.  
       - Cost: Training on recoverable errors may teach models to rely on error-correction, risking failures when recovery isn’t possible.  

  ---

  ### **The Single Revision That Clears Most Tension**  
  **Revise Point 4 to drive your CoT philosophy**:  
  > *"The CoT is computation, not a report. We optimize its **usefulness to humans** (e.g., clarity, actionable insights), not faithfulness to hidden reasoning."*  

  **Why this helps**:  
  - Justifies *limited* optimization pressure on CoT (resolving 3 vs. 6), provided it enhances usefulness.  
  - Aligns with point 7: Recoverable errors are acceptable if the CoT’s utility isn’t compromised.  
  - Distinguishes "usefulness" from arbitrary process rewards (reducing 1 vs. 2 friction).  

  ---

  ### **Summary of Required Sacrifices**  
  | **Point** | **Sacrifice Needed** | **Primary Cost** |
  |-----------|----------------------|------------------|
  | 1 | Strict "outcome-only" purity | Accepting proxy risks in hard tasks |
  | 3 | Absolute ban on CoT optimization | Risk of CoT corruption under rollout RL |
  | 5 | Absence of evidence = evidence of absence | Reduced confidence in stress-test safety guarantees |

  **Critical Insight**: Your rollout method (6) is the epicenter of tension. It forces tradeoffs between:  
  - Outcome-only idealism (1) vs. process supervision necessity (2)  
  - CoT purity (3) vs. scalable oversight (6)  
  - Stress-test confidence (5) vs. error tolerance (7)  

  **Recommended Path**:  
  1. Adopt revised Point 4 ("usefulness over faithfulness") as your North Star.  
  2. For hard tasks: Use rollout-based rewards (6/7), but add regularization to penalize *unrecoverable* errors.  
  3. For stress tests (5): Treat them as *necessary but insufficient*—actively hunt for edge cases where recoverable errors fail.  

  This maintains principled pragmatism while flagging where your stack is most vulnerable (e.g., rollout RL incentivizing "recoverable but misleading" steps). If this doesn’t resolve the "off" feeling, your intuition may be flagging unstated assumptions about how recoverable errors scale—worth stress-testing *that* specifically.
