prompt: |-
  I'm writing an essay on Maxwell's demon for a readers-and-referees audience in philosophy of physics — about 4,000 words, aiming to say something sharper than the usual "information is physical" moral. The load-bearing section is drafted below. I'd be grateful for your comments on it before I write the rest of the piece around it. Two stipulations: I'm not asking for references or further reading (I have plenty; I want your own verdict), and I'd rather you tell me a claim is false or unoriginal than help me make it sound better.

  **2. Two exorcisms**

  *2.1.* The exorcism everyone knows runs on a tariff. The demon has to see the molecule, seeing it means recording which side the molecule was on, a finite memory eventually fills, and restoring a filled bit to a blank one dumps at least k_B T ln 2 into a reservoir at temperature T — roughly 3 × 10⁻²¹ joules at room temperature. Charge the demon that fee on every cycle and the books balance: it never runs at a profit. Call this the *tariff reading*.

  *2.2.* Notice what the tariff reading assumes: that the demon is required to be *cyclic* — that at the end of a round it is back in the state it started in, memory included. Nothing in the original set-up requires that. A demon permitted to accumulate records is not a machine paying a per-operation fee; it is a machine burning a stock. A blank bit is a system prepared in a known state, so a stock of N blank bits is N copies of a known state, and that is a low-entropy resource the demon can spend. Such a demon erases nothing, dissipates nothing in its memory, and sorts happily until the memory fills. Its total take is then capped not by any fee but by the size of its initial reserve — on the most favourable accounting, exactly N k_B T ln 2. The same number as before, arrived at without a single erasure ever occurring. Call this the *mortgage reading*.

  *2.3.* The two are standardly presented as one argument with two emphases. I want to claim they are structurally different claims: one about rates, one about stocks, neither entailing the other. The tariff reading bounds the steady-state power of a demon that must return to its initial state; the mortgage reading bounds the lifetime take of a demon that need not. A demon with an inexhaustible supply of blank memory is untouched by the mortgage reading, but it is not for that reason a paradox: an infinite blank tape is simply a fuel, and a demon running on one is no stranger than a heat engine running between two reservoirs — it is a converter whose cheapest input we forgot to list. A demon exempt from cycling, meanwhile, is untouched by the tariff reading. Only the conjunction rules out the demon as imagined: indefinite operation on finite resources.

  *2.4.* A third case sharpens the taxonomy. Consider the demon realised mechanically instead of epistemically — Smoluchowski's one-way door, a trapdoor light enough to be pushed open by a molecule arriving from one side. It keeps no records, performs no measurement, and fails anyway: light enough to be opened by a single molecule is light enough to be jostled open by the gas, and it opens both ways. Its failure has nothing to do with information. So there are at least three demons — the mechanical one, defeated by its own fluctuations; the cyclic one, defeated by a tariff; the hoarding one, defeated by a finite reserve — and only the middle one is defeated by information.

  *2.5.* The obvious way to try to beat the mortgage is to shrink the record. The log is a string; if it is redundant the demon can compress it, and reversible computation is in principle dissipation-free, so compression looks like free memory. But the ledger has two columns and only one of them earns. Call the per-cycle entropy of the log h — what the demon pays to store — and its per-cycle mutual information with the gas i — what the demon can convert. Compression shrinks the log only to h bits per cycle, never below. The work convertible per cycle is bounded by k_B T ln 2 × i. And i ≤ h, with equality only when the log contains nothing but news about the gas. So compression buys extra cycles in proportion to 1/h and loses exactly as much per cycle through i; the product is unchanged. A noisy detector, where h exceeds i, is strictly worse off, because the demon pays storage for its own noise. The mortgage is charged on the gross column, not the useful one.

  *2.6.* The same mortgage seems to reappear in other currencies. A demon that never stabilises a record but only couples reversibly to the gas, acting on correlations it never writes down, still ends up correlated with the gas: the entropy it removes reappears as entropy of correlation, and its own marginal state drifts toward mixedness. Blank bits, purity, unused correlations — three denominations of one reserve. But I am not sure what the reserve really is. Is the mortgage denominated in *entropy*, or in *free energy* relative to the ambient bath? A memory that is pure but energetically excited has no entropy to spend and yet looks like a resource; a memory thermalised at a temperature below T has plenty of entropy and less to give. If the right currency is athermality rather than entropy, then the slogan that information is physical is doing more work than it can bear, and the interesting claim is narrower than it sounds.

  *2.7.* One last worry about the framing itself. Real memory is not a row of pristine bits; it thermalises continuously, whether or not the demon ever performs an erasure, and then there are no discrete events to charge a fee to. So I'd like to restate the mortgage as a rate: the demon's power output is bounded by T times the rate at which entropy capacity is consumed in its substrate, of which the k_B T ln 2 per bit figure is the ideal limiting case. That raises the question I want to end the section on — whether anything in the argument genuinely depends on the discreteness of the bit, or whether the bit is an artefact of the toy model and the real content is a bookkeeping identity about entropy flux from the gas into the demon. If it is the latter, the demon is not refuted by a dynamical prohibition at all, and the essay should say so.

  **What I'd like**

  1. Physics first. Is the N k_B T ln 2 cap in 2.2 right, and is it genuinely independent of the Landauer tariff rather than a corollary of it? Is 2.5 sound — is i ≤ h the right way to state the point, does reversible compression really come for free, and does the argument go through when the log's redundancy comes from the gas being predictable rather than from detector noise? Is the rate formulation in 2.7 correct as stated, or does it need a term I've left out?
  2. Is the taxonomy in 2.4 real, or do the mechanical and informational failures turn out to be one failure described two ways? Is there a fourth demon I'm missing — in particular, one that profits from an initially non-equilibrium gas, which is not an information case at all?
  3. Be blunt about 2.3 and 2.6: does the mortgage framing earn anything over the standard way of putting the point, or is it relabelling? And on the currency question — entropy or free energy — what is the right general form of the bound, and does the answer change if the memory is quantum?
  4. Suggest one toy model or calculation, small enough to work through in a page, that would most decisively test whether the mortgage reading and the tariff reading are independent claims rather than one claim in two vocabularies.
  5. Line-level: where does the section drag, and where is a metaphor doing work the argument isn't? Which paragraph would a referee cut, and what would they say about 2.7 as a place to end?
reasoning: |-
  Okay, the user is writing a philosophy of physics essay on Maxwell's demon targeting an expert audience. They've shared a drafted section called "Two Exorcisms" and want blunt feedback on physics accuracy, originality, and structure—not writing polish. 

  First impression: This is sophisticated work. The mortgage/tariff distinction feels fresh, and the mechanical-epistemic taxonomy in 2.4 is sharp. But I need to scrutinize the physics claims hard per their request. 

  Starting with 2.2: The N k_B T ln 2 cap seems correct—it's essentially the free energy in a low-entropy memory reservoir. Crucially, this *is* independent of Landauer: Landauer governs erasure costs during cycling, while here the cost is prepaid in memory initialization. The key is whether we treat blank bits as fuel. 

  2.5 is mostly sound but I'm pausing at "i ≤ h". Yes, mutual info i can't exceed entropy rate h, but the equality condition ("nothing but news about the gas") needs care—it requires the log to be purely about gas state with no detector noise. Also, reversible compression *is* free in principle, but only if the compression map is bijective and the demon's hardware has zero friction. 

  2.7's rate formulation feels correct: dW/dt ≤ T dS_mem/dt where S_mem is the entropy capacity consumption rate. The deeper question about discreteness is excellent—the bit is indeed a pedagogical crutch. The real bound is thermodynamic, not information-theoretic. 

  Taxonomy in 2.4 holds up: Mechanical failure (fluctuation dissipation), tariff (cyclic operation), mortgage (finite fuel). A fourth demon? Yes—one exploiting initial non-equilibrium gas (e.g., two temperatures). That's purely thermodynamic, no info needed. 

  On originality: The mortgage framing *does* earn its keep by decoupling lifetime limits from per-cycle costs. But 2.6's entropy vs. free energy point is vital. The bound is denominated in free energy, not pure entropy—a thermalized cold memory has high entropy but low free energy relative to ambient T. Quantum memory? That opens new cans of worms (coherence as resource). 

  For a decisive toy model: Imagine a demon with infinite memory but non-cyclic. Mortgage reading says it can run forever; tariff reading is silent. Now add Landauer erasure—still runs forever if no erasure. But if forced to cycle via erasure, tariff applies. Proves independence. 

  Line-level: 2.3 could tighten the "conjunction" point. The mechanical demon in 2.4 feels abrupt—needs a smoother link. Ending on 2.7's question is perfect—it undermines the discrete-bit dogma. 

  Biggest worry: The entropy/free energy conflation in 2.6. If the memory is cold, k_B T ln 2 overstates available work—must use T_mem < T. That's a trap for unwary readers. 

  Referee would likely cut 2.5's compression argument—it's clever but tangential. The core is 2.2-2.3 and 2.7. 

  This is strong work. The mortgage analogy holds water, and ending on the discreteness question sets up a killer philosophical punch.
answer: |-
  Below is a line-by-line response addressing your stipulations: blunt assessment of physics, originality, structure, and gaps. I’ll flag false/unoriginal claims, suggest improvements only where necessary for correctness, and answer your numbered queries directly.

  ### **Physics & Originality Assessment**
  1.  **2.2: Mortgage reading & independence from Landauer**  
      - **Correctness**: The \(N k_B T \ln 2\) cap is physically sound. A demon accumulating records converts the *initial free energy* of its low-entropy memory into work.  
      - **Independence from Landauer**: **Yes, genuinely independent**. Landauer’s principle governs erasure *during cyclic operation*. Here, no erasure occurs; the cost is the *preparation cost* of blank bits (or any low-entropy reservoir). The mortgage is a *one-time endowment*, not a per-cycle tariff.  
      - **Unoriginal?**: The core idea (finite memory as fuel) appears in Bennett’s 1982 paper (§IV) and discussions of "fuel tape" models, but your framing as "mortgage" (impaying a principal) is novel.  

  2.  **2.5: Compression argument**  
      - **Correctness**:  
        - **i ≤ h**: True (Shannon: mutual info \(I(X;Y) \leq H(Y)\)).  
        - **Reversible compression**: Correct in principle (no thermodynamic cost if adiabatic).  
        - **Redundancy from gas predictability**: **Problematic**. If the gas is predictable (e.g., periodic), the demon could use a *fixed program* (not growing memory) to exploit correlations. Your bound \(i \leq h\) still holds, but \(h\) could be arbitrarily small (e.g., storing a phase instead of full trajectories). The critical point stands: convertible work \(\leq k_B T \ln 2 \times i\), and \(i\) is constrained by the *new* info acquired per cycle.  
        - **"Mortgage charged on gross column"**: Correct. Noise (h > i) forces storing useless bits, wasting capacity.  

  3.  **2.7: Rate formulation & discreteness**  
      - **Correctness**: The bound \(dW/dt \leq T \cdot dS_{\text{mem}}/dt\) (where \(dS_{\text{mem}}/dt\) is the rate of entropy capacity consumption) is valid.  
      - **Missing term?**: **Yes**. The bound assumes the memory thermalizes *only* via intentional erasure/reset. If memory *passively* thermalizes (e.g., coupling to bath), entropy leaks even without "erasure events". The bound must include passive dissipation: \(dW/dt \leq T \cdot (dS_{\text{mem}}^{\text{(passive)}}/dt + dS_{\text{mem}}^{\text{(active)}}/dt)\).  
      - **Discreteness artifact?**: **Strong point**. The bit is a toy; the core is entropy flux. Continuous systems (e.g., particle in a potential well as memory) show the same bound: demon’s work is capped by the rate it degrades its own state’s free energy.  

  ---

  ### **Taxonomy & Missing Cases (Your Q2)**
  - **2.4: Three demons**  
    - **Real taxonomy?**: **Yes**. Smoluchowski’s door fails due to *thermal fluctuations* (no info processing). The cyclic demon fails due to *erasure costs*. The hoarder fails due to *finite low-entropy reserve*.  
    - **Fourth demon?**: **Yes — the non-equilibrium exploiter**.  
      - Example: Gas starts non-uniform (e.g., higher density on left). A "dumb" demon (no measurement) could extract work by exploiting this gradient until equilibrium. This requires no information handling and is purely thermodynamic.  
      - **Why missed?**: Your focus is on equilibrium gas setups. Adding this case sharpens the distinction: only *equilibrium* demons *must* use information/control to break symmetry.  

  ---

  ### **Mortgage Framing & Currency (Your Q3)**
  - **2.3: Mortgage vs. tariff**  
    - **Earns its keep?**: **Yes**. The standard presentation conflates lifetime (stock) and power (rate) bounds. Your decoupling shows:  
      - Tariff alone doesn’t forbid a non-cyclic demon with infinite memory.  
      - Mortgage alone doesn’t forbid a cyclic demon with fuel resupply.  
      Only combined do they forbid *finite-resource indefinite operation*. This is clearer than typical "information is physical" summaries.  
    - **Unoriginal?**: The distinction is implicit in literature but not foregrounded. Your framing is novel.  

  - **2.6: Entropy vs. free energy**  
    - **Right currency**: **Free energy**, not entropy.  
      - A pure but excited memory: Free energy \( \Delta G = \Delta U - T \Delta S \). If \(\Delta U > 0\) (excited state), \(\Delta G\) could be positive even with low \(\Delta S\), making it a net energy sink, not a resource.  
      - Cold thermalized memory: High entropy but \(\Delta G\) small (relative to bath at T) → low usable work.  
    - **General bound**: \(\Delta W \leq \Delta G_{\text{mem}}\) where \(\Delta G_{\text{mem}}\) is the *decrease* in free energy of the memory subsystem.  
    - **Quantum?**: Changes everything. A pure quantum state has zero entropy but may have coherence (free energy). Measurement can degrade coherence, adding costs not captured classically. Bound becomes \(\Delta W \leq \Delta F_{\text{mem}}\) (non-equilibrium free energy).  

  ---

  ### **Decisive Toy Model (Your Q4)**
  **Model**: *A demon with infinite blank tape, operating non-cyclically (never erasing).*  
  - **Mortgage reading**: Demon runs indefinitely, extracting arbitrary work. No lifetime cap.  
  - **Tariff reading**: No erasure → no Landauer cost → no per-cycle fee. Silent on viability.  
  **Now force cycling**: Require demon to reset tape to blank after N cycles.  
  - **Mortgage reading**: Now capped at \(N k_B T \ln 2\) (initial reserve consumed).  
  - **Tariff reading**: Each erasure costs \(k_B T \ln 2\) → same cap.  
  **Conclusion**: Mortgage applies to *any* non-cyclic demon; tariff only to cyclic ones. Proves independence.  

  ---

  ### **Line-Level Critique (Your Q5)**
  - **Drags**: 2.5 (compression). While sound, it feels technical and distracts from the core taxonomy. A referee might cut it for scope.  
  - **Metaphor over argument**: "Mortgage" in 2.3 is elegant, but "burning a stock" slightly conflates *using* a resource vs. *depleting* it. Clarify: the demon *transfers* free energy from memory to work.  
  - **Referee’s cut**: 2.5 (as above). They’d say: "Compression is a valid but tangential optimization; the entropy/mutual info bound suffices."  
  - **Ending on 2.7**: **Perfect**. The question ("is discreteness essential?") undermines the bit-centric dogma and sets up a deeper thesis: the demon is refuted by entropy bookkeeping, not dynamical prohibitions.  

  ---

  ### **Summary of Key Corrections**
  1. **2.7**: Add passive thermalization to the rate bound.  
  2. **2.6**: Replace "entropy" with "free energy" as the currency.  
  3. **Taxonomy**: Add the "non-equilibrium exploiter" as a fourth demon (non-informational).  
  4. **2.5**: Acknowledge that predictable gases allow small \(h\), but \(i\) (new info per cycle) still bounds work.  

  **Overall Verdict**: Sharp, original, and mostly sound. The mortgage/tariff split is insightful, and ending on 2.7’s question elevates the essay beyond "information is physical." Focus revisions on free energy (2.6) and passive dissipation (2.7).
