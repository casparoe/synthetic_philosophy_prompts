prompt: |-
  I teach an upper-level seminar on social epistemology and democratic theory — 18 students, one 90-minute slot, a room with a projector and movable chairs, no budget for cash prizes, but I have index cards, two colours of dot stickers, envelopes, a coin and a deck of cards. I want an activity that makes them feel the Condorcet jury theorem as a mechanism with load-bearing assumptions rather than as a wisdom-of-crowds slogan, and I want them to build the pattern themselves: no statement of the theorem up front, nobody hears the name until the debrief, and I say nothing about independence or competence until they have already voted several times.

  Rough shape I have in mind, which you should feel free to redesign: there is a true state of the world, each student gets a private signal of a reliability I control, they vote simultaneously by secret ballot, and we tally. What I want them to notice, in roughly this order: with reliability only just above chance and 19 voters, the majority is barely better than a coin flip even though the result is supposed to go to certainty, so the asymptotics are a terrible guide at seminar-sized numbers; if I flip the signal reliability just below chance, the same aggregation runs backwards and the majority ends up confidently wrong more often than any single voter; then give everyone the same extra public signal — one blurry piece of evidence on the projector that they all see — and watch a ceiling appear, with the error rate refusing to fall however many voters I add. Then, and this is the bit I care about most, run one round sequential and aloud with the identical set of private signals as an earlier simultaneous round: same people, same information, opposite result, because what changed was the mechanism and not the world. I also want a round where two students get high-accuracy signals and the other seventeen get near-chance ones, so the class has to decide whether to vote at all or to defer to the specialists, since I have a hobbyhorse that the interesting question is not whether many beat few but what you buy with a fixed budget of attention or money, many cheap weak signals or a few expensive good ones, and I want to see whether the activity can make that concrete. And if there is room, one round where the two error types carry very different costs, so they have to ask whether the asymmetry belongs in the aggregation rule or in the threshold for acting on a given majority, and whether a supermajority requirement is doing epistemic work or just expressing caution.

  Give me the rules, the materials, how to randomise cleanly on the fly, and a payoff scheme that needs no money, plus a debrief that maps each moment onto the part of the theorem it was meant to expose. Then the honest part: what will predictably go wrong the first time I run it — the student who holds up their card, the confident first speaker who anchors the sequential round, the run where the majority just gets unlucky and the class draws exactly the lesson I didn't want, the argument about whether my deck was really shuffled — and how I should handle each, including what to do when the demonstration plain fails. Be frank too about what the activity cannot reproduce and I will have to say out loud afterwards; I strongly suspect the convergence claim itself is the big one, since 19 people can't show anybody a limit, and probably also anything about voters choosing whether to acquire a signal in the first place. Last thing, and I mean it: I know this literature well enough not to need a reading list, so don't send me citations, and please seperate what is just the arithmetic of the theorem given its assumptions, which I take to be settled, from what is genuinely contested among people who work on it — whether any real electorate satisfies anything in that neighbourhood, and what if anything follows for democracy — and I definately want you to flag my budget framing as my own hobbyhorse if that is what it is, rather than nodding along with it. Continuous prose please, like an email: no headings, no bullets, no bold, no tables.
reasoning: |-
  Okay, let me think through how to design this activity for an upper-level seminar on social epistemology and democratic theory. The professor wants students to experience the Condorcet jury theorem through hands-on voting exercises that reveal its assumptions organically. 

  First, I need to establish the core mechanics: a true/false question about the world (e.g., "Is the coin in my pocket heads?"), private signals with controlled reliability, and various voting methods. Materials like index cards and dot stickers will handle randomization - say green dots for accurate signals, red for errors. The deck of cards can assign signal qualities (face cards = high accuracy, number cards = low).

  The sequence should start simple: simultaneous secret ballots where students see majority verdicts barely beat chance when individual accuracy is 55%. Then flip it - when accuracy drops below 50%, watch majorities become reliably wrong. That exposes the competence assumption. Next, add a blurry public signal (projected image) to show correlated errors creating a "ceiling effect" despite more voters - independence assumption shattered.

  The critical moment comes when we rerun identical signals sequentially. Same information, but public deliberation reverses the outcome because early speakers anchor the group. That's the dependence trap. Later rounds introduce heterogeneity: two "experts" with 80% accuracy versus 17 novices at 55%. Will they vote or defer? And finally, asymmetric costs - maybe misjudging guilt worse than innocence - to question whether simple majorities suffice.

  Predictable failures: A dominant student hijacking sequential discussion? Have them speak in random card-draw order. Unlucky coin flips skewing results? Acknowledge small-sample noise upfront. Suspicion about rigged signals? Let students shuffle decks. When demonstrations fail (and some will), pivot to "why might this happen?" making the point stronger.

  What we can't show: asymptotic convergence (19 people ≠ infinity) or endogenous signal acquisition. The budget framing - many cheap signals vs few expensive ones - is indeed the professor's hobbyhorse, but legitimately emerges from the expert/novice round. In debrief, explicitly map each exercise to assumptions: competence, independence, homogeneous reliability.

  The payoff? Social stakes - frame verdicts as "convicting/freeing the accused" with moral weight. Debrief connects mechanics to democracy: Why juries might need anonymity, why diverse media matters, when deference beats participation. Flag contested issues: real voters aren't independent or equally competent, so does Condorcet actually support democracy? That's where theory meets practice.
answer: |-
  Here's a detailed plan for your activity, keeping your constraints and pedagogical goals in mind. I'll walk through setup, execution, predictable hiccups, and debriefing, all in continuous prose.

  Start by setting the stage without revealing the theorem. Tell the class they'll participate in a series of decision-making experiments simulating how groups might discern a hidden truth. The "truth" will be a simple binary state: whether a specific coin in your pocket is heads (Truth = H) or tails (Truth = T). Emphasize this is fixed at the start of an experiment round and won't change during that round. You'll need the coin, the deck of cards (for randomization), index cards (for ballots), two colours of dot stickers (say, green and red), and envelopes. Use the projector sparingly for key public signals. Assign each student a unique number (1-18) using the deck (draw cards, assign numbers based on order drawn).

  For the first round, explain the signal process. Each student receives a private signal about the coin's state (Signal H or Signal T). These signals are imperfect. Tell them, "For this round, if the true state is H, there's a 55% chance your signal says H (correct) and 45% it says T (wrong). Same if the true state is T: 55% chance correct signal, 45% wrong." This is your "barely above chance" competence (p=0.55). To randomize signals secretly: Before class, secretly flip the coin to set Truth (record it secretly). For each student, shuffle the deck thoroughly. Draw one card. If it's BLACK (clubs/spades), give them a CORRECT signal envelope (contains a slip saying "H" if Truth=H, "T" if Truth=T). If it's RED (hearts/diamonds), give them an INCORRECT signal envelope (contains "T" if Truth=H, "H" if Truth=T). Since roughly half the deck is black/red, this gives p≈0.5. To get p=0.55, slightly bias the deck beforehand (e.g., remove 2 red cards, keep it hidden). Students open envelopes privately, see their signal. They then vote simultaneously/secretly on index cards: "H" or "T". Collect votes, tally publicly. Announce the majority verdict and the actual Truth. Do 3-5 rounds of this with new Truth/signals each time. Students will likely see the majority is right more than wrong, but barely – maybe 3 out of 5 times. Point out that with 19 voters, barely beating a coin flip feels underwhelming compared to "wisdom of crowds" hype. This exposes the slow convergence at small n and the sensitivity to p being only slightly >0.5.

  Next, flip competence below chance. Announce: "New rule: Signals are now unreliable, worse than guessing." Set p=0.45. Use the same deck method, but now RED cards give correct signals, BLACK give incorrect (or adjust deck bias). Run 2-3 simultaneous secret ballot rounds. Students will likely see the majority vote consistently wrong. Highlight the irony: Aggregating *slightly* incompetent individuals makes the group confidently incompetent. This underscores that p>0.5 is non-negotiable; the mechanism amplifies competence OR incompetence.

  Introduce dependence via a public signal. Use the projector. Show a deliberately ambiguous image – a blurry photo that could be interpreted as supporting H or T (e.g., a fuzzy coin image, an abstract shape). Tell them: "Everyone now sees this *same* public clue. It's somewhat indicative but blurry. Assume if Truth=H, it has a 60% chance of looking like it supports H, 40% like T. Same logic for Truth=T." Combine this with private signals. Set private p back to 0.55. First, run a round with just the public signal and a vote. Note the result. Then, run a round where they get BOTH their private signal (p=0.55) AND see the public signal. Vote simultaneously/secretly. Tally. Now, dramatically add "phantom voters." Tell them: "Imagine we add 10 more voters. They see ONLY the public signal, same as you all did." Use the coin to simulate these 10: Flip it 10 times. If heads, count a vote for whatever the public signal seemed to support (e.g., if the blurry image was shown as "evidence for H", heads = H vote). If tails, vote randomly (flip again: heads=H, tails=T). Tally the real 18 votes + 10 simulated votes. Repeat adding more simulated "public-only" voters (another 10, 20...). Students will see the error rate doesn't drop much, or might even rise slightly, plateauing well above zero. This concretizes the correlation introduced by the common public signal destroying independence. The "ceiling" becomes visible.

  Now, the crucial sequential round. Reuse the *exact* signal set (Truth + all private signals) from one previous simultaneous round where the majority got it right. Announce this: "We are replaying the *exact same world state and information* as Round [X], but changing *how* we decide." Have students sit in a circle. Shuffle the deck of student numbers. Draw the order they must speak. Rules: When your turn, you MUST state your vote ("H" or "T") ALOUD and briefly state ONLY your *private signal* as your reason ("I vote H because my private signal was H"). No other discussion. After everyone speaks, take a simultaneous secret ballot vote. Tally. Compare to the original simultaneous result. Often, the initial speakers (especially if confident or early identical signals) anchor the group. The final vote may flip compared to the simultaneous secret ballot on the same info. Stress: The world and private info didn't change, only the social mechanism (public sequential declaration vs. simultaneous secret vote). This exposes how dependence can be manufactured by the aggregation process itself.

  Introduce heterogeneity. Announce: "Two of you are now 'experts' with better sensors. The rest have standard sensors." Assign experts secretly via deck draw (e.g., draw two student numbers). Set expert p=0.8 (use deck: For an expert, draw a card. Number card 2-10 = correct signal (approx 80%), Face card = wrong signal (approx 20%)). Set novice p=0.55 (as before). Before voting, pose the question: "Should the non-experts vote based on their signals, or abstain and defer to the experts?" Facilitate a brief (2-3 min) discussion. Don't guide. Then run the vote simultaneous/secret. Experts and non-experts all vote unless someone explicitly abstains (provide an "Abstain" ballot option). Tally. Reveal Truth. Discuss outcomes: Did the majority get it right? Did the experts agree? Did non-experts' weak signals add noise or valuable info? This embodies your "budget" hobbyhorse – the trade-off between many weak signals and few strong ones with fixed cognitive resources. (Flagged: This framing *is* your hobbyhorse, though a reasonable extension).

  Finally, introduce asymmetric costs. Pose a scenario: "Deciding 'H' means convicting a defendant of a serious crime with harsh punishment. Deciding 'T' means acquittal. A false conviction (Truth=T, Majority=H) is a much worse error than a false acquittal (Truth=H, Majority=T)." Set p=0.6 for all. Run a simultaneous secret ballot. Tally. Announce if it's a simple majority (10/18) or not. Ask: "Given the costs, is this outcome acceptable? Should we require a supermajority for conviction?" Discuss briefly. Run another round where a verdict of "H" (convict) requires, say, 14/18 votes. Tally. Compare errors. This highlights how the aggregation rule (simple majority vs. supermajority) interacts with the epistemic goal and error costs, questioning if the rule itself carries epistemic weight or just expresses risk aversion.

  **Payoff Scheme (No Money):** Frame the stakes socially/morally. "Your collective verdict determines justice/fairness in this scenario." Use peer pressure and the desire for group success. Record group performance (e.g., tally correct majorities across rounds) and celebrate if they beat a naive benchmark. The intrinsic reward is understanding the mechanics.

  **Predictable Problems & Mitigation:**
  1.  **Student Reveals Signal/Vote Early:** In sequential round, someone might blurt or hold up their card. Prevention: Stress rules *before* starting: "Only state your vote and your private signal when called, nothing else." Handling: If it happens, pause, remind rules. If minor, proceed. If egregious, restart the round with a new signal set.
  2.  **Confident First Speaker Anchors:** Likely in sequential round. Mitigation: Randomize speaking order rigorously. If one voice dominates, in debrief, highlight how their early confidence swayed others despite identical info to the silent simultaneous round. This *is* the point about dependence.
  3.  **Unlucky Rounds (Majority Wrong Despite p>0.5):** Especially in early low-p or small-n rounds. Handling: Acknowledge small sample size upfront: "We're doing a few trials, randomness plays a role. The pattern emerges over many runs, but we see the tendency." Run a few extra rounds if needed. If results contradict (e.g., majority right easily with p=0.55), emphasize "We got lucky, but the *probability* of success is only slightly above 50% for this n and p." Use it to stress the role of chance.
  4.  **Deck Shuffling Suspicion:** Students may doubt randomness. Mitigation: Let a student shuffle the deck before critical draws (signal assignments, speaking order). Be transparent about the bias method (e.g., "I removed two red cards to make signals 55% reliable").
  5.  **Demonstration Fails:** E.g., Sequential vote same as simultaneous; Heterogeneous experts disagree and majority is wrong. Handling: **Don't hide it!** This is gold. "Interesting! What happened here? Why didn't we see the flip/reliability we expected?" Guide discussion: Maybe initial speakers were *correct*? Maybe the weak signals *did* add noise? Maybe experts disagreed? This exposes the fragility of the assumptions (dependence isn't guaranteed to flip results, experts can disagree, weak signals can be net negative). Connect it back to the theorem's sensitivity. Failure often teaches more than success.
  6.  **Argument over Public Signal Interpretation:** Some might insist the blurry image "obviously" supports H/T. Handling: State clearly: "Its interpretation is probabilistic, not certain. Assume my stated likelihoods (60% prob. correct)." Stick to the model. Redirect focus to its effect as a common source.
  7.  **Abstention in Heterogeneous Round:** Non-experts might refuse to vote. Handling: Allow it! Their choice to abstain is a data point. Compare outcomes when they vote vs. if only experts voted (if possible, run a quick simulation: "What if only the two experts voted?").

  **What the Activity Can't Reproduce (Need to State in Debrief):**
  *   **Convergence to Certainty (Asymptotics):** 18 voters can't show n->infinity. Explicitly state: "The theorem claims that as n gets very large, if p>0.5 and independent, P(majority correct) -> 1. We saw it barely helps at n=18; you need enormous groups for near-certainty."
  *   **Endogenous Signal Acquisition:** Voters here are passive recipients of signals. Real voters may choose *whether* or *how* to become informed (competence) or *whose* signals to pay attention to (creating dependence). This is a major critique and area of active research.
  *   **Complex Real-World Issues:** Signals aren't binary, truth isn't always binary or clear-cut, competence varies enormously and is hard to measure, dependence structures are complex (media, social networks).

  **Debrief (Map Moments to Theorem):**
  Start by finally naming the Condorcet Jury Theorem (CJT). Outline its core: If voters are (1) **Competent** (each p>0.5), (2) **Independent** (private signals uncorrelated), and (3) vote **Sincerely** according to their signal, then (a) Majority rule beats any single voter, and (b) P(Majority Correct) -> 1 as n->inf. Then map the activity:
  *   *Barely Above Chance (p=0.55):* Showed how (b) the convergence is painfully slow at seminar-sized n. Emphasizes sensitivity to p.
  *   *Below Chance (p=0.45):* Showed the **competence (p>0.5)** assumption is crucial. Mechanism amplifies incompetence.
  *   *Public Signal Ceiling:* Showed the **independence** assumption is crucial. A common cause (the blurry image) correlated errors, preventing error reduction despite large n. Real world: Shared evidence/media creates dependence.
  *   *Sequential vs. Simultaneous (Same Info):* Showed how the aggregation mechanism itself (public sequential voting) can **destroy independence**, even if private signals started uncorrelated. Social influence replaces individual judgment. Connects to deliberation's risks.
  *   *Heterogeneous Signals:* Explored the **homogeneous competence** assumption (often implicit in basic CJT). Is aggregating many weak signals better than few strong ones? Highlights the resource allocation question (your hobbyhorse).
  *   *Asymmetric Costs/Supermajority:* Showed CJT optimizes *minimizing total errors* assuming symmetric costs. With asymmetric costs, the optimal decision rule changes (e.g., supermajority for conviction). CJT tells us about likelihood, but acting requires a utility function. Supermajority expresses caution, not necessarily superior epistemic performance *unless* competence is very low or costs are asymmetric.

  **Contested Ground (Flag Explicitly):**
  *   **Real-World Applicability:** This is the core debate. Do real electorates satisfy *any* CJT assumptions sufficiently?
      *   *Competence (p>0.5)?* Voter knowledge is often low and contested. Is average p>0.5? (Empirical question, evidence mixed).
      *   *Independence?* Vastly improbable in the age of mass media, social networks, and shared information environments. Dependence is the norm.
      *   *Sincere Voting?* Strategic voting (voting against signal to influence outcome) is possible, especially with common knowledge of p or pivotal probabilities.
  *   **Implications for Democracy:** Does CJT "prove" democracy is epistemically superior?
      *   *Proponents:* Suggests under ideal conditions, aggregating diverse, competent, independent judgments leads to truth-tracking.
      *   *Critics:* The assumptions are so unrealistic for mass democracy that CJT offers little support. The public signal/sequential rounds show how mechanisms can undermine it. Heterogeneity questions the value of mass participation. Epistocracy (rule by experts) might be better if competence varies hugely.
      *   *Your Budget Hobbyhorse:* While the trade-off is logical, whether "attention/money" maps neatly onto signal quality in real politics, and whether "deferring to experts" is feasible or desirable politically, are deeply contested. It raises questions about voter roles and the division of cognitive labor in a democracy.

  This activity forces them to experience the mechanics, see the assumptions as load-bearing (by breaking them), and confront the gap between the clean theorem and messy reality. Embrace the predictable hiccups as teaching moments about the fragility of the ideal conditions. Good luck!
