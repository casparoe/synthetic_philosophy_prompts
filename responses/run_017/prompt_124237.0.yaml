  ### Analysis of the Separateness Objection in *Dudley and Stephens*

  **I. Theory Applied to Case: Divergence of Forms**  
  The separateness objection directly challenges treating Parker as a resource. Its anti-aggregation form denies that the mere fact "three lives > one life" justifies killing Parker. There is no super-person whose survival outweighs Parker’s intrinsic claim against being sacrificed; the arithmetic sum is morally inert. Crucially, the rights form independently prohibits using Parker as a means to save others, absent a specific justification like self-defense. Parker posed no threat; he was merely *useful*. Here, the forms diverge significantly. Anti-aggregation alone might permit killing *if* selection were truly impersonal (e.g., unavoidable randomness). But the rights form categorically forbids *deliberately killing a non-threatening person* for others' gain, irrespective of how the victim is chosen. Dudley and Stephens’ act—selecting and killing Parker—violates this prohibition even if aggregation fails. The premeditated targeting, given Parker’s vulnerability and lack of threat, makes the rights violation stark. Brooks’ refusal underscores that non-aggregative refusal was an option.

  **II. The Theory’s Silence on Selection**  
  The separateness objection provides no positive guidance on *how* to select a victim if killing were otherwise permissible. It is silent on procedures because its core function is to prohibit the killing outright in these circumstances. A lottery might seem a fair procedure, but the objection does not endorse it. From the separateness perspective, a lottery merely institutionalizes the unacceptable aggregation: it operationalizes the (rejected) principle that maximizing expected survivors (3/4 chance per person) justifies killing *someone*. Consent, if freely given, might overcome the rights violation. However, Parker’s incapacity rendered consent impossible, and its absence wasn’t merely procedural; it confirmed the fundamental violation of his agency. The theory does not demand a selection method because it forbids the act requiring selection. The necessity of choosing *someone* arises only if the fundamental prohibition is ignored—which the objection insists we must not do.

  **III. Case Applied to Theory: Testing Foundations**  
  This extreme case pressures the objection. Designed for societal distribution, does it overextend to a lifeboat where all will die without action? Precisely this pressure reveals the objection’s core is the rights violation, not merely anti-summation. The emergency doesn’t dissolve Parker’s claim against being used; it highlights the brutality of violating it. If aggregation were the sole issue, the lifeboat’s unique stakes might weaken the objection. But the rights violation persists: Parker’s separateness means his life isn’t fungible, even for collective survival. The case thus shows the objection was *always* fundamentally about respecting persons as inviolable ends, not merely rejecting sums. The emergency intensifies the tragedy but doesn’t alter the moral prohibition on treating a person as a consumable resource.

  **IV. Law and Underlying Rationales**  
  The law’s rejection of necessity partly vindicates the separateness view, especially its rights aspect: individuals cannot be sacrificed solely for others' greater good. However, the conviction also reflects deeper institutional concerns the philosophical objection might neglect. Moral hazard looms large: endorsing private killings, even in extremis, risks normalizing deadly calculations under less stringent conditions. Further, the law distrusts individuals acting as judges in their own cause. Dudley and Stephens, motivated partly by familial ties, decided Parker’s lesser worth—demonstrating the peril of subjective "weighing." While separateness provides the principled core against sacrificing Parker, the law’s stance is bolstered by these consequentialist and procedural worries about who wields such power and the societal precedent set. The objection condemns the act; the law condemns the act *and* the actors' usurpation of lethal authority.
