  We are going to construct a realistic scenario in which a piece of free information has strictly negative expected value. The scenario is set in a workplace negotiation.

  ### Scenario: The Salary Negotiation
  Alice is negotiating her salary with her employer. She is considering two options:
  - **Option A**: Ask for a high salary of $150,000.
  - **Option B**: Ask for a low salary of $100,000.

  The employer can be one of two types, each with equal prior probability (50%):
  - **Type X**: The employer values Alice highly and is willing to pay up to $150,000. However, if Alice asks for a high salary, the employer might get offended (if the employer is in a bad mood) and withdraw the offer entirely. Specifically, for Type X:
    - If Alice asks for the high salary, there is a 20% chance the employer gets offended and withdraws (so Alice gets $0) and an 80% chance the employer accepts and Alice gets $150,000.
    - If Alice asks for the low salary, the employer accepts and Alice gets $100,000.
  - **Type Y**: The employer is not willing to pay more than $100,000. If Alice asks for the high salary, the employer will reject and withdraw the offer (so $0). If she asks for the low salary, she gets $100,000.

  Alice's utility is linear in money (so we can use dollar amounts as utilities).

  Before making her decision, Alice has the opportunity to get a piece of free information: a report from a trusted insider about the employer's mood. The report will say either "Good mood" or "Bad mood". However, the report is only about the mood of the employer and does not directly reveal the type (X or Y). Importantly, the mood is only relevant for Type X employers (since Type Y employers will reject a high request regardless of mood). The catch is that the report is only available for Type X employers (because the insider has no access to Type Y employers). For Type X, the report is accurate: in 90% of cases it correctly reports the mood (so 90% chance of "Good mood" if the employer is in a good mood and 90% chance of "Bad mood" if in bad mood). But for Type Y, the report is not available and instead the insider will always say "Bad mood" (because they have no information and are covering for the fact).

  We can formalize the information structure:
  - If the employer is Type X (50% prior):
    - With 80% probability the employer is in a good mood (so won't be offended by a high ask) and 20% in a bad mood (will be offended by a high ask).
    - The report: 
      - If good mood: 90% "Good mood", 10% "Bad mood"
      - If bad mood: 10% "Good mood", 90% "Bad mood"
  - If the employer is Type Y (50% prior):
    - The report always says "Bad mood".

  Alice must decide whether to get this report or not. If she doesn't get the report, she must choose A or B without additional information. If she gets the report, she will see the report and then choose A or B.

  ### Step 1: Expected utility without the report (baseline)
  We compute the expected utility for each action without the report.

  **Option A (ask high):**
  - If Type X (50%): 80% chance of $150k, 20% chance of $0 -> expected value = 0.8 * 150k = 120k
  - If Type Y (50%): 0 (because they reject) -> 0
  - Overall: (0.5 * 120k) + (0.5 * 0) = 60k

  **Option B (ask low):**
  - If Type X (50%): 100k
  - If Type Y (50%): 100k
  - Overall: 100k

  So without the report, Alice chooses Option B (100k) over Option A (60k). Her expected utility is 100k.

  ### Step 2: Expected utility with the report
  Now, if Alice gets the report, she will condition her action on the report. The report can be either "Good mood" or "Bad mood". We need to compute the probabilities of each report and the posterior probabilities.

  First, compute the probability of each report:

  P(Good mood report) = 
    P(Good mood report | Type X) * P(Type X) + P(Good mood report | Type Y) * P(Type Y)

  P(Good mood report | Type X) = P(Good mood report | Type X, good mood) * P(good mood|Type X) + P(Good mood report | Type X, bad mood) * P(bad mood|Type X)
    = (0.9 * 0.8) + (0.1 * 0.2) = 0.72 + 0.02 = 0.74

  P(Good mood report | Type Y) = 0 (since it always says "Bad mood")

  So:
  P(Good mood report) = (0.74 * 0.5) + (0 * 0.5) = 0.37

  P(Bad mood report) = 1 - 0.37 = 0.63

  Now, we compute the posterior probabilities given the report.

  **Case 1: Report is "Good mood"**
  We compute P(Type X | Good mood report) and P(Type Y | Good mood report).

  P(Type X | Good mood report) = [P(Good mood report | Type X) * P(Type X)] / P(Good mood report)
    = (0.74 * 0.5) / 0.37 = 0.37 / 0.37 = 1

  P(Type Y | Good mood report) = 0

  So if the report is "Good mood", then the employer must be Type X (and in fact, we know the mood is likely good). Now, what is the actual mood? We don't need that because we know the behavior for Type X: with a high ask, we get 150k with 80% chance (if mood is good) and 0 with 20%? Actually, no. We have a report of "Good mood", but that doesn't guarantee the mood is good. We need to condition on the report and the type.

  But note: we have P(Type X | Good mood report)=1, so we are sure it's Type X. Now, what is P(good mood | Type X, Good mood report)? 

  By Bayes within Type X:
  P(good mood | Type X, Good mood report) = [P(Good mood report | Type X, good mood) * P(good mood|Type X)] / P(Good mood report|Type X)
    = (0.9 * 0.8) / 0.74 = 0.72 / 0.74 ≈ 0.973

  So if the report is "Good mood", then:
  - The employer is Type X (100%).
  - The probability of a good mood (so not being offended by a high ask) is about 97.3%.

  Therefore, if Alice sees "Good mood", she will choose Option A (high ask) because:
  - Expected value of A: 0.973 * 150k + 0.027 * 0 ≈ 145.95k
  - Expected value of B: 100k

  So she gets about 145.95k.

  **Case 2: Report is "Bad mood"**
  We compute P(Type X | Bad mood report) and P(Type Y | Bad mood report).

  P(Bad mood report) = 0.63, as above.

  P(Bad mood report | Type X) = 1 - P(Good mood report | Type X) = 1 - 0.74 = 0.26

  P(Bad mood report | Type Y) = 1

  So:
  P(Type X | Bad mood report) = [P(Bad mood report | Type X) * P(Type X)] / P(Bad mood report)
    = (0.26 * 0.5) / 0.63 = 0.13 / 0.63 ≈ 0.2063

  P(Type Y | Bad mood report) = [1 * 0.5] / 0.63 = 0.5 / 0.63 ≈ 0.7937

  Now, if the employer is Type X and we get a "Bad mood" report, what is the probability of actually being in a bad mood?

  P(bad mood | Type X, Bad mood report) = [P(Bad mood report | Type X, bad mood) * P(bad mood|Type X)] / P(Bad mood report | Type X)
    = (0.9 * 0.2) / 0.26 = 0.18 / 0.26 ≈ 0.6923

  So if the employer is Type X and we have a bad mood report, then there's a 69.23% chance of being in a bad mood (so 30.77% chance of being in a good mood).

  Now, Alice must choose between A and B.

  If she chooses A (high ask):
  - If Type X (20.63% chance): 
    - With 69.23% chance: bad mood -> gets 0
    - With 30.77% chance: good mood -> gets 150k
    So expected from Type X: (0.6923 * 0 + 0.3077 * 150k) ≈ 46.155k
  - If Type Y (79.37% chance): gets 0
  - Overall expected value for A: (0.2063 * 46.155k) + (0.7937 * 0) ≈ 9.52k

  If she chooses B (low ask):
  - If Type X: 100k
  - If Type Y: 100k
  - So expected: 100k

  Therefore, if the report is "Bad mood", Alice will choose B and get 100k.

  ### Expected utility with the report
  With the report, Alice's expected utility is:
  - With probability 0.37 (report "Good mood"): she gets about 145.95k
  - With probability 0.63 (report "Bad mood"): she gets 100k

  So overall: (0.37 * 145.95k) + (0.63 * 100k) = 0.37*145.95 ≈ 54.0015k, plus 0.63*100=63k, total ≈ 117.0015k

  ### Comparison
  Without the report: 100k
  With the report: ≈117k

  But wait, 117k is greater than 100k. That's positive! We wanted negative. So what went wrong?

  We need to adjust the scenario to make the information harmful.

  ### Revised Scenario: The Salary Negotiation (Harmful Version)
  We change the behavior of Type Y. Now, if Alice asks for a low salary and the employer is Type Y, they will sometimes reject because they think Alice is not confident. Specifically:

  - **Type X**: Same as before.
  - **Type Y**: 
    - If Alice asks for high: they reject and she gets 0.
    - If Alice asks for low: 
      - With 95% chance they accept and she gets 100k.
      - With 5% chance they get suspicious and withdraw, so she gets 0.

  But note: without the report, she doesn't know the type. Let's recalculate without the report.

  **Without report:**
  Option A: same as before: 0.5 * (0.8*150k) + 0.5 * 0 = 60k
  Option B: 
    - Type X: 100k (because they accept low for sure)
    - Type Y: 0.95 * 100k = 95k
    - Overall: 0.5*100k + 0.5*95k = 97.5k

  So she chooses Option B: 97.5k.

  Now, with the report, we need to account for the new Type Y behavior.

  First, the report probabilities are the same: 
  P(Good mood report) = 0.37 (only from Type X, and Type Y always gives "Bad mood")

  **Case 1: Report "Good mood"**
  As before: P(Type X)=1. So she will choose A: expected value 145.95k (as before).

  **Case 2: Report "Bad mood"**
  Posterior:
  P(Type X | Bad mood report) = (0.26 * 0.5) / 0.63 = 0.13/0.63 ≈ 0.2063
  P(Type Y | Bad mood report) = 0.7937

  Now, if she chooses A:
  - Type X: as before, 46.155k (from the earlier calculation for Type X with bad mood report)
  - Type Y: 0 (because they reject high asks)
  - Expected: 0.2063 * 46.155k ≈ 9.52k

  If she chooses B:
  - Type X: 100k
  - Type Y: 95k (because 95% chance of acceptance)
  - Expected: (0.2063 * 100k) + (0.7937 * 95k) = 20.63k + 75.4015k = 96.0315k

  So she will choose B and get 96.0315k.

  Now, the expected utility with the report:
  - Report "Good mood" (0.37): 145.95k
  - Report "Bad mood" (0.63): 96.0315k
  Total: 0.37*145.95 + 0.63*96.0315 ≈ 54.0015 + 60.499845 ≈ 114.501345k

  But 114.5k is still greater than 97.5k. Still positive.

  We need to make the information harmful. Let me try a different approach.

  ### Alternative Scenario: The Job Candidate
  Alice is a hiring manager. She is considering whether to hire Bob. She has two options:
  - Hire Bob (H)
  - Reject Bob (R)

  Bob can be either Good (G) or Bad (B), each with 50% prior.

  If Bob is Good and hired, the company gains $1M. If Bob is Bad and hired, the company loses $1M. If rejected, the outcome is $0.

  Without any additional information, Alice would be indifferent. But suppose she can get a free piece of information: a test that is 90% accurate. However, the test is only available for candidates who are Good. For Bad candidates, the test is not available and instead the testing service will always return a negative result (which is actually incorrect for Bad candidates because they are bad, but the test was designed for goods).

  Wait, that might not work. Alternatively, the test is available for both, but the test has different accuracies for good and bad.

  But let me try to set up the information structure so that the test result might cause Alice to make a decision that is worse in expectation.

  ### The Real Counterexample: The Commitment Problem
  The classic counterexample involves the reaction of others to your information gathering. We'll set a scenario in a negotiation where gathering information signals something to the other party.

  **Scenario: The Merger Negotiation**
  Alice is the CEO of company A, considering whether to merge with company B. The merger can be either:
  - Option M: Propose a merger.
  - Option N: Do nothing.

  The value of the merger depends on the synergy, which can be High (H) or Low (L), each with 50% prior.

  If the synergy is High and Alice proposes, the merger happens and company A gains $200M. If synergy is Low and she proposes, the merger happens but company A loses $100M. If she does nothing, the outcome is $0.

  But there's a catch: the merger requires approval from company B. Company B will only agree to the merger if they believe the synergy is High. However, company B does not know the synergy. They will observe whether Alice seeks information. If Alice seeks information, company B infers that Alice is uncertain, which might mean that the synergy is not obviously high. Specifically:

  - If Alice does not seek any information and proposes the merger, company B will believe that Alice is confident and so the synergy is High. Thus, they accept and the merger goes through.
  - If Alice seeks information, then company B observes this and becomes skeptical. They will then reject the merger proposal unless they see a positive report. However, the report is private to Alice. So if Alice gets a positive report and then proposes, company B still doesn't see the report and only knows that Alice sought information, so they reject.

  But wait, we need to model the information. Let's say the information is a report about the synergy: it says either "High" or "Low", and it is 90% accurate (so if synergy is High, 90% chance says "High", etc.). And the report is free and Alice updates correctly.

  However, the act of getting the report is observed by company B. And company B's decision to accept or reject is based on their belief about the synergy. Specifically, they will accept the merger proposal if and only if their posterior probability that synergy is High is at least 50%. 

  Initially, company B's prior is 50% High. Now:

  - If Alice does not seek information, then when she proposes, company B infers nothing new (because Alice didn't seek information) and their posterior remains 50%. But they require at least 50%, so they accept. 
  - If Alice seeks information, then company B observes that. They know that Alice is seeking information, which might indicate that she is uncertain. However, they don't see the report. 

  What is company B's posterior after seeing Alice seek information? They know that Alice sought information. This action might be more likely if the synergy is Low because if it were High, Alice might be confident enough to propose without seeking information. But we must model Alice's behavior.

  This becomes a signaling game. We need to specify the equilibrium.

  Let me try to compute.

  **Without seeking information:**
  Alice must choose M or N without information. 
  - If she chooses M: 
    - With 50% chance synergy High: +200M
    - With 50% chance synergy Low: -100M
    - Expected: 50M
  - If she chooses N: 0
  So she chooses M and gets 50M. And company B accepts, so that's what happens.

  **With seeking information:**
  Alice will get a report and then choose M or N. But company B observes that she sought information. They then form a posterior about the synergy. Since they will reject the merger if they think the chance of High is less than 50%, we need to see what they think after Alice seeks information.

  We assume that company B knows the prior and the information structure. They also know that Alice will use the report to decide whether to propose.

  Let r be the report. Alice will propose (M) only if the report is "High". Because:
  - If report is "High": 
    P(synergy High | report "High") = [0.9 * 0.5] / [0.9*0.5 + 0.1*0.5] = 0.45 / 0.5 = 0.9
    So expected value of M: 0.9*200 + 0.1*(-100) = 180 - 10 = 170M > 0 -> she proposes.
  - If report is "Low":
    P(synergy High | report "Low") = [0.1 * 0.5] / [0.1*0.5 + 0.9*0.5] = 0.05 / 0.5 = 0.1
    Expected value of M: 0.1*200 + 0.9*(-100) = 20 - 90 = -70M < 0 -> she chooses N.

  Now, company B observes that Alice sought information. Then, if Alice proposes, they know that the report must have been "High" (because only then does she propose). But they also know the accuracy of the report. So if Alice proposes after seeking information, company B can update:

  P(synergy High | Alice sought info and then proposed) = P(synergy High | report "High") = 0.9? 
  But wait, company B doesn't see the report, but they infer that the report was "High". So they know that the report was "High", and then use that to update.

  Actually, the condition is: Alice proposes only if the report is "High". So the event that Alice proposes is exactly the event that the report is "High". So company B, upon seeing Alice seek information and then propose, knows the report was "High". Then they update the probability of High synergy given a "High" report, which is 0.9, so they are 90% sure it's High -> they accept.

  That doesn't cause rejection.

  We need a different setting.

  ### Successful Counterexample: The Jury Trial
  This is based on the example from the literature (e.g., the one by Daniel Osherson).

  **Scenario:**
  Alice is a juror in a trial. The defendant is either Guilty (G) or Innocent (I), each with 50% prior. Alice must vote to Convict (C) or Acquit (A). Her utility:
  - If the defendant is Guilty and she votes Convict: +10 (correct conviction)
  - If the defendant is Innocent and she votes Convict: -10 (wrong conviction)
  - If the defendant is Guilty and she votes Acquit: -1 (wrong acquittal)
  - If the defendant is Innocent and she votes Acquit: +1 (correct acquittal)

  Without any additional information, Alice would choose to Acquit because:
  - Convict: 0.5*10 + 0.5*(-10) = 0
  - Acquit: 0.5*(-1) + 0.5*(1) = 0
  So she is indifferent. But suppose she can break the tie with information.

  There is a free piece of information: a DNA test that is 90% accurate. That is:
  - If guilty, P(test says "guilty")=0.9, P(test says "innocent")=0.1
  - If innocent, P(test says "innocent")=0.9, P(test says "guilty")=0.1

  Alice can choose to take the test or not. If she takes the test, she updates and then votes.

  However, there is a catch: the trial has a rule that if the jury is hung (i.e., if they don't reach a verdict), then the defendant is set free. But in this case, Alice is the only juror? Let's say she is the sole juror. But then there is no hung jury.

  Instead, consider that if Alice votes to convict, then the defendant is convicted. If she votes to acquit, the defendant is acquitted. But there is an additional option: if she is unsure, she can cause a hung jury by not voting, but that's not allowed.

  We need to introduce a cost for hung jury or something else.

  ### The Real Answer: Information That Removes an Option
  This is the other family: the information might cause you to lose an option that was available when you were ignorant.

  **Scenario: The Medical Decision**
  Alice is a patient. She has a disease that is either severe (S) or mild (M), each with 50% prior. She has two treatment options:
  - **Treatment X**: This treatment is very effective for severe disease (cures it completely) but has terrible side effects for mild disease (leaves her permanently disabled). 
    - If she has S and gets X: utility 100 (cured).
    - If she has M and gets X: utility -1000 (disabled).
  - **Treatment Y**: This is a safe treatment that works moderately well for both: 
    - If she has S and gets Y: utility 50 (partial recovery).
    - If she has M and gets Y: utility 60 (recovery with no side effects).

  She can also choose to do nothing, which is bad:
  - If she has S and does nothing: utility -1000 (severe consequences).
  - If she has M and does nothing: utility 70 (because the mild disease resolves on its own with time).

  But she won't choose nothing because Treatment Y is better than nothing in both cases.

  Without information, she will choose Y:
  - If S: 50
  - If M: 60
  - Expected: 55

  Now, there is a free and perfectly accurate test that will tell her whether the disease is severe or mild. But here's the catch: the test involves a biopsy that, if the disease is mild, will sometimes (10% of the time) cause the mild disease to become severe (because of a complication). The test is safe if the disease is severe.

  So:
  - If the disease is severe, the test is safe and accurately says "severe".
  - If the disease is mild, then:
    - With 90% probability: the test is safe and says "mild".
    - With 10% probability: the test causes the mild disease to become severe, and then the test result will be "severe" (because it's now severe).

  Alice can choose to take the test or not. If she takes the test, she gets the result and then chooses a treatment.

  ### Calculation
  **Without the test:**
  As above, she chooses Y and gets 55.

  **With the test:**
  We need to compute the expected utility.

  First, the test result can be "severe" or "mild". But now the state of the disease might be changed by the test.

  Prior: 50% severe (S), 50% mild (M).

  After the test, the world state is:
  - With probability 0.5 (initially S): test says "severe", and the disease is still severe.
  - With probability 0.5 (initially M): 
    - 0.9: test says "mild", and the disease remains mild.
    - 0.1: test says "severe", and the disease becomes severe.

  So the overall probabilities:
  - Test says "severe": 
    - From initially S: 0.5 * 1 = 0.5
    - From initially M: 0.5 * 0.1 = 0.05
    - Total: 0.55
  - Test says "mild": 
    - Only from initially M and no complication: 0.5 * 0.9 = 0.45

  Now, conditional on the test result:

  **Case 1: Test says "severe" (prob 0.55)**
  What is the probability that the disease is severe?
  - P(initially S | test says "severe") = 0.5 / 0.55 = 10/11
  - P(initially M that became severe | test says "severe") = 0.05 / 0.55 = 1/11

  But in both cases, the disease is severe at the time of treatment. So Alice knows the disease is severe. She will choose Treatment X: utility 100.

  **Case 2: Test says "mild" (prob 0.45)**
  This can only happen if the disease was initially mild and the test did not cause a complication. So the disease is mild. She will choose Treatment Y: utility 60.

  Therefore, the expected utility with the test:
  = (0.55 * 100) + (0.45 * 60) = 55 + 27 = 82

  Without the test, she got 55. With the test, 82. Still better.

  This is not working.

  ### The Correct Counterexample (from the literature)
  The classic counterexample is from (Good himself in a later paper? or others). It involves the information causing you to take an action that has a very bad outcome in some cases, which you would have avoided by not having the information.

  But let's do the following: 

  **Scenario: The Investment**
  Alice has $100. She can:
  - Invest in a safe asset that returns 2% for sure, so she gets $102.
  - Invest in a risky asset that returns 10% if the economy is good (50% chance) and -5% if the economy is bad (50% chance). So if good: $110, if bad: $95.

  Without information, she would choose the safe asset because:
  - Risky: 0.5*110 + 0.5*95 = 55 + 47.5 = 102.5
  - Safe: 102
  So she chooses risky: 102.5

  Now, there's a free and perfectly accurate signal about the economy. But if the signal is that the economy is bad, then the government will notice the same signal and intervene, which will cause the risky asset to return -10% instead of -5%. If the signal is good, the return remains 10%.

  So the catch: the signal changes the world state.

  If Alice takes the signal:
  - If the signal is good (50% chance): then the economy is good and the risky asset returns 10%. She will invest in the risky asset: 110.
  - If the signal is bad (50% chance): then the government intervention happens, and the risky asset now returns -10% (so $90). She then has to choose between safe (102) and risky (90 in this state). She will choose safe: 102.

  So with the signal: 0.5*110 + 0.5*102 = 55 + 51 = 106

  Without the signal: 102.5

  106 > 102.5, so still better.

  ### The Actual Premise Break: Non-Executable Plans
  Good's theorem assumes that the set of actions available does not depend on whether you have the information or not. In the medical example above, when you don't take the test, you have the option to choose treatment Y, which is safe. When you take the test, in some cases you might learn that you have the severe form and then feel compelled to choose treatment X, which is very bad if you have mild disease. But in our calculation, it didn't work out negatively.

   Let's try a different medical example from the literature.

  ### Counterexample by  I. J. Good (1967) himself in a response to a criticism
  Good actually provided a counterexample. In his 1967 paper, he presents:

  "Suppose there are two urns, urn I and urn II. Urn I contains one white ball and one black ball, urn II contains two white balls. A person is to receive a large prize if he draws a white ball, and a small prize for a black ball. He is to choose whether to draw from urn I or urn II. But he can also, if he wishes, take a ball at random from urn I and look at it before deciding from which urn to draw. This preliminary ball is then replaced. If he draws a white ball in the main draw, he gets the large prize.

  Without the preliminary draw, he should choose urn II, which gives a white ball for sure, so he gets the large prize.

  If he takes the preliminary draw from urn I:
  - With probability 1/2, he draws a white ball. Then he knows that urn I has at least one white ball. But he also knows that urn II has two white balls, so he will choose urn II. Then in the main draw, he gets white for sure.
  - With probability 1/2, he draws a black ball. Then he knows that urn I has at least one black ball, and since it has two balls, one of which is black, the other must be white. So urn I has one white and one black. Urn II has two white. He will choose urn II and then get white for sure.

  So in both cases, he gets the large prize. This is the same as not taking the preliminary draw.

   But wait, it doesn't hurt, but it doesn't help.

  To make it hurt, we need to change the urn contents.

  ### urn example that hurts:
  Urn I: either (a) 2 white balls or (b) 1 white and 1 black ball, each with 50% chance.
  Urn II: 1 white ball and 1 black ball for sure.

  Without information: 
  - If choose urn I: 
     - If type (a): P(white)=1
     - If type (b): P(white)=0.5
     - Expected P(white) = 0.5*1 + 0.5*0.5 = 0.75
  - If choose urn II: P(white)=0.5
  So she chooses urn I, and the probability of white is 0.75.

  Now, she can draw one ball from urn I (then replace it) to get information.

  But after she draws, she might update the probability of the type of urn I.

  What happens when she draws a ball from urn I?
  - If urn I is type (a) (2 white): she always draws white.
  - If urn I is type (b) (1 white, 1 black): she draws white with 0.5, black with 0.5.

   Prior: P(type a)=0.5, P(type b)=0.5.

   After drawing a white ball:
     P(type a | white) = [1 * 0.5] / [1*0.5 + 0.5*0.5] = 0.5 / 0.75 = 2/3
     P(type b | white) = 1/3
     So the probability that the next ball is white = (2/3)*1 + (1/3)*0.5 = 2/3 + 1/6 = 5/6.

   After drawing a black ball:
     P(type a | black) = 0, because type a has no black.
     P(type b | black) = 1
     So the next ball is white with probability 0.5.

   Now, after the draw, she can choose to draw from urn I or urn II.

   If she drew white (probability 0.5 * 1 + 0.5 * 0.5 = 0.75), then:
     - If she chooses urn I: P(white)=5/6
     - If she chooses urn II: P(white)=0.5
     So she chooses urn I: 5/6.

   If she drew black (probability 0.25), then:
     - Urn I: P(white)=0.5
     - Urn II: P(white)=0.5
     So she is indifferent; assume she chooses urn I or urn II randomly, say P(white)=0.5.

   So overall, with information: 
     P(white) = (0.75 * 5/6) + (0.25 * 0.5) = (0.75 * 5/6 = 0.625) + (0.125) = 0.75

   Same as without information.

   To make it hurt, let's make urn II have a higher expected payoff in some cases.

  ### The Actual Counterexample (from the literature)
   **Example by Snow (2010) or others:**
   There are two actions: A and B.
   Two states: X and Y, each with prior 0.5.
   Payoff:
     - If you choose A: you get 0 in state X and 0 in state Y.
     - If you choose B: you get -10 in state X and 10 in state Y.

   So without information, EU of A: 0, EU of B: 0.5*(-10) + 0.5*10 = 0. So indifferent; assume she chooses A (0) to avoid risk.

   Now, there's a free and perfectly accurate signal about the state.

   If she gets the signal:
     - If the signal says X: she will choose A (0) because if she chose B she would get -10.
     - If the signal says Y: she will choose B (10).

   So expected utility: 0.5 * 0 + 0.5 * 10 = 5.

   This is better than 0.

   This is positive.

   To make it negative, we need to change the payoffs.

   How about this:
     - Action A: 0 in both states.
     - Action B: 10 in state X, -10 in state Y.

   Now, with information: 
     - If signal X: choose B -> 10
     - If signal Y: choose A -> 0
     EU = 0.5*10 + 0.5*0 = 5.

   Without information, she is indifferent between A and B. If she chooses A: 0. If she chooses B: 0.5*10 + 0.5*(-10)=0.
   So she might choose A to avoid the risk. So without information, she gets 0.

   5 > 0.

   still positive.

  ### The commitment device is the key
   The counterexample requires that without the information, the agent would have taken an action that is not available if they get the information. In the medical example, when you don't take the test, you can choose the safe treatment Y. But if you take the test and it says "severe", then you might feel compelled to choose treatment X, which is very risky for mild cases.

   Let's set up a medical example where the safe treatment is not available after the test.

   **Scenario:**
   Alice has a disease that is either severe or mild (50% prior).

   - If she does nothing, then if the disease is severe, she dies ( utility -1000). If mild, she recovers (utility 100).
   - There is a treatment T that always cures the disease, but has a side effect that reduces utility by 10, so utility 90 for sure.

   Additionally, there is a risky treatment X that is only available if she hasn't taken the test. 
   - If she takes treatment X and the disease is severe, it cures her with no side effects (utility 100).
   - If she takes treatment X and the disease is mild, it kills her (utility -1000).

   But if she takes the test, then treatment X becomes unavailable (because the test uses the same biopsy material that is needed for treatment X). The test itself is free, safe, and accurate. The test will reveal whether the disease is severe or mild.

   So the options are:
   - Without the test: she can choose between doing nothing, treatment T, or treatment X.
   - With the test: she can choose between doing nothing or treatment T (because treatment X is no longer available).

  ### Calculation
  **Without the test:**
  - If she chooses nothing:
    - 0.5 * (-1000) + 0.5 * 100 = -500 + 50 = -450
  - If she chooses treatment T: 90
  - If she chooses treatment X: 0.5 * 100 + 0.5 * (-1000) = 50 - 500 = -450

   So she will choose treatment T: 90.

  **With the test:**
   She takes the test and learns the state for sure.
  - If the disease is severe (50% chance): 
    - She can choose nothing: -1000
    - Or treatment T: 90
    - She chooses T: 90
  - If the disease is mild (50% chance):
    - Nothing: 100
    - Treatment T: 90
    - She chooses nothing: 100

   So expected utility: 0.5*90 + 0.5*100 = 45 + 50 = 95

   95 > 90. Still better.

   This is not working.

  ### The Only Way: Information That Changes the World State
  We must have the information gathering itself change the world state. For example, the test might have a risk of side effects.

   But the constraint is "free" information, meaning no risk, no cost.

   So let's try a different tack: the information is free and safe, but it might cause you to forgo an option that you would have taken and that option is actually good on average.

  ### Game with Another Player
  Alice and Bob are playing a game. Alice must choose to either Cooperate or Defect. Bob will also choose Cooperate or Defect. The payoffs are as in the prisoner's dilemma, but with a twist.

   Payoff matrix (Alice's utility):
            Bob: C      Bob: D
   Alice: C   (3, )      (0, )
   Alice: D   (5, )      (1, )

   But Bob will choose after Alice or at the same time? 

   Instead, let's say that Bob will Defect for sure if he knows that Alice has gathered information. Because he will think that Alice is up to something.

   Specifically, the setting:
   - Alice and Bob are about to interact in a one-shot prisoner's dilemma.
   - Alice can either gather information about Bob's move or not.
   - The information is: a perfect prediction of what Bob will do.
   - But if Alice gathers information, Bob (who is watching) will know and will be offended, and as a result, he will Defect for sure.
   - If Alice does not gather information, then Bob will Cooperate.

   So:

   - If Alice does not gather information: 
     - Bob will Cooperate.
     - Alice can choose C or D.
     - If she chooses C: outcome (C, C) -> utility 3
     - If she chooses D: outcome (D, C) -> utility 5
     - She will choose D and get 5.

   - If Alice gathers information:
     - Bob will Defect for sure.
     - The information will tell her that Bob will Defect.
     - Then Alice will choose: 
          If she chooses C: outcome (C, D) -> 0
          If she chooses D: outcome (D, D) -> 1
     - She will choose D and get 1.

   So without information: 5
   With information: 1

   Therefore, the information has expected value 1 - 5 = -4.

   This is strictly negative.

   And it's free information (no cost), and Alice is a Bayesian expected-utility maximizer. The information is decision-relevant (tells her what Bob will do) and not from a lying oracle.

  ### Constraints check:
  - Free: yes.
  - Agent: she updates correctly. When she gathers information and sees that Bob will defect, she knows it's for sure and chooses accordingly.
  - Not adversarially produced: the information is accurate, but the act of gathering it causes Bob to change his mind. Bob is an ordinary human who can't read minds, but he can see that Alice is gathering information (maybe because she hires a detective to investigate him, and he finds out).
  - Realistic setting: a business negotiation.
  - The agent doesn't screw up: she conditionlizes correctly and maximizes correctly.

  ### Steps:

  1. The premise of Good's theorem that is broken: the theorem assumes that the information does not change the world state or the available actions. In this case, gathering the information changes the world state (specifically, it changes Bob's action). Good's theorem assumes that the act of acquiring the information does not affect the utilities, outcomes, or available actions.

  2. Arithmetic:
     - EU without information: 5
     - EU with information: 1
     - So EU with information is 4 less.

  3. The obvious objection: can't Alice commit in advance to ignore the information? But in this setting, the harm comes from Bob's reaction to the act of gathering the information, not from the use of the information. Even if Alice commits to ignore the information, Bob has already seen her gather it and will Defect. So she cannot avoid the harm by ignoring the information. She would still face a Defecting Bob, and then without the information, she would have to choose between C and D without knowing that Bob will Defect. In that case, what would she do?

     - If she gathers the information but then ignores it, then:
          - Bob will Defect (because he saw her gather it).
          - Alice has to choose without the information. She doesn't know that Bob will Defect. She might have a prior about Bob.
          - Originally, without any information gathering, she expected Bob to Cooperate. But now, because she gathered information, should she update on the fact that she gathered it? This is getting complicated.

     To keep it clean, we can assume that Alice's act of gathering information is observable and changes the world state (Bob's action) irrevocably. The damage is done by the act, regardless of whether she uses the information.

     Alternatively, if she could gather the information secretly, then it wouldn't be harmful. But in this scenario, we assume that the gathering is observable.

     Moreover, if she could commit in advance to not gather the information, then she would get 5, which is better than the 1 she gets if she gathers. So she would be willing to pay up to 4 to commit to not gather the information.

  4. Ablation: remove the observability. If the information gathering is not observable to Bob, then Alice can gather it without triggering Bob's Defection. In that case, Bob will Cooperate (because he doesn't know). Then, if Alice gathers the information:
        - With  probability 1, the information will say that Bob will Cooperate (because in the absence of Alice's gathering being observed, Bob would Cooperate).
        - Then Alice will choose D and get 5.
     So with information: 5, same as without. Or if the information might be that Bob is going to Defect for some other reason, but in this setting, the only reason for Bob to Defect is if he sees Alice gather information. So if gathering is secret, then it doesn't change anything.

     So if we remove the observability, then the information has expected value 5 - 5 = 0, which is not negative. But it's not positive either. So the negative value comes from the observability.

     Alternatively, if we remove the change in Bob's behavior based on the information gathering, then the value becomes non-negative.

  5. Steelman the other side: someone might argue that this is not a counterexample because the information is not free: there is a cost in terms of the change in Bob's behavior. However, the cost is not a direct cost (like a fee) but a consequence of the act of gathering. Good's theorem typically assumes that the information gathering does not change the world. In this case, it does. Therefore, they might say that the theorem only applies when the information gathering does not affect the environment. 

     They are right in that the theorem assumes that the world state is unchanged by the act of gathering information. So in that sense, this might not be a counterexample to the theorem in its intended setting. 

     However, the theorem is often interpreted as "more information is never worse", but in this realistic scenario, it is worse. So the lesson is that the theorem has an important caveat: provided that the information gathering does not change the world.

     This is a valid counterexample to the common interpretation of the theorem in real-world settings where information gathering might be observed and might change the decisions of others.

  ### Conclusion
  We have a clean counterexample in the negotiation setting. The arithmetic is clear: 5 > 1, so the information has negative expected value. The ablation shows that if the gathering is not observable, the harm disappears. The steelman is that the theorem assumes no side effects from the information gathering, and this case violates that.

  So the answer is to be cautious: Good's theorem is literally true only when the information gathering does not change the world. In practice, it often does.
