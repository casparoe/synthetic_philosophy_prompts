  ### Counterexample: The Negotiation Leak

  **Scenario:**  
  Alice is negotiating a business deal with Bob. She must decide whether to accept Bob's current offer ($1 million) or walk away and pursue a risky litigation. The litigation will succeed only if Bob's company is financially weak (which would force a $3 million settlement), but if the company is strong, Alice loses and gets $0. Alice's prior is 50% weak, 50% strong. Without more information, Alice's expected utility (EU) from litigation is \(0.5 \times 3 + 0.5 \times 0 = 1.5\) million. Since $1.5M > $1M, she prefers litigation. However, Alice can get free, perfectly accurate information about the company's strength. The catch: if Alice gathers this information, Bob (who monitors for such inquiries) will interpret it as aggression and retaliate. Specifically, if Alice learns the company is weak, Bob will preemptively restructure to protect assets, reducing the litigation payoff to $2 million. If Alice learns it's strong, or doesn't inquire, Bob takes no action. Alice updates and maximizes EU correctly.

  ---

  ### 1. **Premise Broken**  
  Good's theorem assumes the *act* of acquiring information does not alter the decision problem (i.e., utilities, outcomes, or action availability remain unchanged). Here, gathering information *changes the payoff structure*: learning "weak" reduces the litigation payoff from $3M to $2M. The theorem assumes information is *passive*; this scenario violates that by making it *causally active* in the world.

  ---

  ### 2. **Arithmetic**  
  - **EU without information:**  
    Alice chooses litigation (since \(1.5M > 1M\)):  
    \(\text{EU}_{\text{no-info}} = 1.5\) million.  

  - **EU with information:**  
    - With 50% probability, info reveals "weak":  
      - Payoff falls to $2M due to Bob's retaliation.  
      - Alice chooses litigation (since \(2M > 1M\)): gets **$2M**.  
    - With 50% probability, info reveals "strong":  
      - Payoff remains $0.  
      - Alice chooses settlement (since \(0 < 1M\)): gets **$1M**.  
    \(\text{EU}_{\text{info}} = (0.5 \times 2) + (0.5 \times 1) = 1.5\) million.  

  - **Comparison:**  
    \(\text{EU}_{\text{info}} = 1.5 = \text{EU}_{\text{no-info}}\), so information has **zero value**. But we need *negative* value.  

  **Adjustment for Strict Negativity:**  
  Increase retaliation severity: if "weak" is revealed, Bob’s retaliation reduces litigation payoff to $1.2 million (not $2M).  
  - \(\text{EU}_{\text{info}} = (0.5 \times 1.2) + (0.5 \times 1) = 1.1\) million.  
  - \(\text{EU}_{\text{no-info}} = 1.5\) million.  
  - **Net EU of information:** \(1.1 - 1.5 = -0.4\) million.  
  Thus, information has **strictly negative expected value** (−$400,000).  

  ---

  ### 3. **Obvious Objection: Why Not Commit to Ignore?**  
  Alice cannot avoid retaliation by ignoring the information. Bob retaliates based on the *act of inquiry*, not its outcome. Even if Alice commits to ignore, Bob still sees the inquiry and retaliates if the company is weak. This forces Alice to choose:  
  - Settle for $1M (always safe), or  
  - Litigate with reduced payoff ($1.2M if weak, $0 if strong).  
  Her EU is then:  
  - If she settles: **$1M**.  
  - If she litigates: \(0.5 \times 1.2 + 0.5 \times 0 = 0.6\) million.  
  She settles for $1M, which is worse than the original $1.5M.  
  **What Alice would pay to commit:**  
  Alice would pay up to $500,000 to credibly commit *not to inquire* (since \(\text{EU}_{\text{no-info}} = 1.5M\), and \(\text{EU}_{\text{info}} = 1.1M\) after commitment fails).  

  ---

  ### 4. **Ablation**  
  **Neutralized feature:** Remove retaliation. If information gathering doesn’t trigger Bob’s response, payoffs remain unchanged.  
  - **EU with info:**  
    - Reveals "weak" (50%): Alice litigates for $3M.  
    - Reveals "strong" (50%): Alice settles for $1M.  
    \(\text{EU}_{\text{info}} = (0.5 \times 3) + (0.5 \times 1) = 2\) million.  
  - **EU without info:** 1.5 million.  
  - **Value of information:** \(2 - 1.5 = +0.5\) million.  
  The value flips from negative (−$400,000) to positive (+$500,000) when the causal effect of information gathering is removed.  

  ---

  ### 5. **Steelman the Other Side**  
  **Rebuttal from a Good’s Theorem Advocate:**  
  "This isn’t a counterexample; it’s a violation of the ‘no side effects’ premise. Good’s theorem assumes information acquisition is a ‘pure’ update. Here, gathering information *directly changes payoffs*, making it a costly action in disguise. The negative value comes from the retaliation, not the information itself. In a ‘pure’ setting (no retaliation), information remains non-negative."  

  **Are They Right?**  
  **Yes, technically.** Good’s theorem holds only if information gathering has no causal impact on the world. This counterexample exploits that loophole. However, it illustrates a *practical* failure: in real life (e.g., negotiations, medical tests, or audits), gathering information often *does* change the world. The theorem’s "no side effects" premise is fragile in social, strategic, or dynamical settings.  

  ---

  ### Final Summary  
  **What Makes This Work:**  
  The structural feature is **information gathering as a causal intervention** that alters the decision problem. Here, it triggers Bob’s retaliation, reducing payoffs selectively. This violates Good’s theorem’s core assumption of passive information.  

  **Why It’s Realistic:**  
  In workplaces, negotiations, or legal settings, probing for information often signals intent, provoking preemptive responses. The counterexample isn’t "game-y" or "stipulated"; it reflects how information gathering can escalate conflicts or close opportunities.  

  **Takeaway:**  
  Good’s theorem is technically correct in passive environments, but its moral ("always get more data") fails when information acquisition *changes the rules of the game*. Rational agents must weigh *strategic side effects*, not just Bayesian updates.
