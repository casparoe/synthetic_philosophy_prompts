  For the dialogue, I need to create two composite characters: Dr. Ilse Brandt (adaptationist) and Dr. Kwame Adeyemi (pluralist). The setting is a fictional workshop where a funding policy called the "Reachability Clause" is being discussed. This policy would require researchers proposing adaptive explanations to also demonstrate which alternative phenotypes were actually accessible to the lineage.

  I'll use Brandt's research on "glass-stitch worms" as the concrete case study. These worms secrete mineralized tubes with helical ridges that appear adaptive in flowing water but are present even in species living in still water. The ridge develops automatically due to the worms' secretion method, suggesting it might be a developmental byproduct rather than an adaptation.

  Before drafting, I should brainstorm three strong moves for each side and the best objections to those moves:

  For Brandt (adaptationist):
  1. Move: Optimality models are testable when they specify currencies and trade-offs.
     Objection: They don't account for historical constraints limiting options.
  2. Move: Current utility demonstrates adaptation regardless of origin.
     Objection: This conflates current function with selective history.
  3. Move: Reverse engineering reveals functional design.
     Objection: Many structures serve functions without being designed for them.

  For Adeyemi (pluralist):
  1. Move: Developmental constraints limit possible variations.
     Objection: Selection can overcome constraints over time.
  2. Move: Spandrels have utility but weren't selected for.
     Objection: Utility implies selection maintained the trait.
  3. Move: Adaptationism overlooks non-adaptive explanations.
     Objection: Optimality modeling weeds out poor explanations.

  For the dialogue itself, I'll ensure:
  - Real back-and-forth with at least three pivot points
  - Coverage of key issues: testability of adaptationism, architectural examples, Gould's origin/utility distinction, and the persistence/form debate
  - No resolution or false compromise
  - Accessible language with technical terms explained naturally
  - Balanced representation where each character understands the other's position well

  The afterword will clarify that the fundamental disagreement lies in whether we need to establish which phenotypes were actually reachable for a lineage. I'll conclude with \answer{REACHABILITY} since this emerges as the core issue.

  This approach should give the user a vivid, fair exchange that illuminates the ongoing tension in evolutionary biology without oversimplifying or resolving the debate artificially.
answer: |-
  ## The Spandrel Argument at Lofoten

  *(The Lofoten Foundation’s workshop room overlooks a fjord. Dr. Ilse Brandt, clad in practical field gear under a smart blazer, stands near a flow tank schematic. Dr. Kwame Adeyemi, in a crisp linen shirt, leans forward, attentive. They’ve just heard Brandt present her glass-stitch worm case.)*

  **Adeyemi:** Thank you, Ilse. A fascinating system. You’ve shown the ridge *can* enhance feeding in flow. But must we conclude it’s an *adaptation*? Your own data gives pause. The ridge appears in still-water species where it confers no feeding advantage. And developmentally, it emerges automatically from the tube-secretion process – a simple consequence of how the worm builds its tube, step-by-step. Isn’t the ridge a *byproduct*? A spandrel, in Gould and Lewontin’s terms? Its current utility in some habitats might be a fortunate coincidence, a secondary use.

  **Brandt:** Kwame, I grant the ridge’s *origin* might lie in that developmental quirk. Building in discrete steps creates a stepped interior; a smooth tube would demand a fundamentally different secretion mechanism. But *persistence*? That’s where selection enters. Across forty species, the ridge remains, costing precious carbonate. Why hasn’t selection eliminated it in the still-water dwellers? Because in the *majority* of lineages, living in flow, it *is* beneficial. The cost is likely trivial compared to the feeding gain where it matters. Selection maintains it because it’s useful where most of the clade lives, and eliminating it isn’t developmentally trivial. It’s not just a free rider.

  **Adeyemi:** Fair point on persistence in the still-water species – group selection isn’t plausible here. But consider your flow-tank experiment. Gluing beads onto a smoothed tube restored nearly all the lost feeding efficiency. Doesn’t that undermine your adaptive claim? It suggests *any* comparable bump would work. The specific helical form, the precise shape your model might optimize, isn’t crucial. It works *because* it’s a bump, not *because* it’s the optimal bump. Its form is dictated by the developmental process, its utility is generic. That screams spandrel – a structure arising for non-adaptive reasons, later co-opted for a use.

  **Brandt:** You’re right that the exact helical form might not be fine-tuned perfection. My model doesn’t predict *only* helices work; it predicts *some* ridge is better than none in flow. The experiment shows beads work similarly. But crucially, the beads *aren’t* alternatives available to the worm! The worm *only* produces helices because of its fixed developmental sequence. So, the relevant comparison for selection isn't "helix vs. bead" but "helix vs. *no ridge*". And "no ridge" demonstrably performs worse in flow. Selection actively favours maintaining the developmental process that *inevitably* produces the ridge in flow habitats. It’s not passive co-option; it’s active maintenance. The ridge *is* an adaptation for feeding in flow, even if its form is constrained.

  **Adeyemi:** There’s the rub, Ilse. You call it "constrained adaptation." I call it mistaking the *enabling cause* for the *shaping cause*. The developmental process *enabled* the ridge to exist. But its *form* – helical, stepped – was set by that process, not sculpted by selection for feeding efficiency. Selection didn't shape the ridge; it merely said "Yes" to the package: "Tube built this way comes with a ridge, and in flow, a ridge is handy." It’s like the spandrels in San Marco: the arches *had* to meet, creating triangular spaces. The form was architectural necessity. Artists *used* them for mosaics later. But you wouldn't say the spandrels were *adapted* for mosaics; the mosaics were adapted *to* the spandrels.

  **Brandt:** Ah, the architectural analogy! But is it apt? Critics argued pendentives *were* chosen over squinches or corbels partly for the smooth surfaces they provided – utility influencing form. More fundamentally, the glass-stitch ridge isn't unused space filled later. Its utility for feeding likely arose *contemporaneously* with its developmental origin. The moment the first worm secreted a stepped tube in moving water, the vortex effect happened. Selection could start acting immediately on variations *within* the ridge’s developmental possibility space – its height, pitch. Calling it purely a byproduct ignores this potential for fine-tuning.

  **Adeyemi:** Fine-tuning implies selection *sculpted* the trait. But where’s the evidence selection acted on ridge variations? Your data shows the ridge is ubiquitous and morphologically uniform across species in vastly different flow regimes. That screams constraint, not sculpting. If selection were optimizing ridge form for local flow, we’d expect diversity – low ridges in slow flow, high ridges in fast flow. We don’t see it. The developmental system seems locked, producing one basic ridge type regardless of environment. Its utility might be real, but incidental. This is the core Gouldian point: how *well* something works now doesn’t tell us *why* it’s there. A spandrel can be beautifully utilised; that doesn’t make it an adaptation.

  **Brandt:** But doesn't that risk making adaptationism untestable? If every well-crafted trait could be dismissed as a co-opted spandrel, how do we ever confirm selection? My optimality model *is* testable: I specified a currency – particle capture rate – and a cost – carbonate expenditure. I predicted ridges should be present where flow exists and absent where it doesn’t. The still-water species *are* the test! They falsify a naive "always adaptive" claim, forcing refinement. The model survives because the cost of eliminating the ridge developmentally is likely higher than the minor carbonate cost of keeping it, *and* because the clade retains the potential to recolonize flow habitats. The ridge persists because it’s useful *enough* often *enough* and costly *little* to lose. That’s selection maintaining a trait with constrained form.

  **Adeyemi:** The untestability charge wasn’t aimed at explicit optimality models like yours, Ilse. It was aimed at the endless "just-so stories" – inventing functions for every trait without considering alternatives or constraints. Your model is better. But even yours faces the "reachability" problem Lofoten is highlighting. Your model compares "ridge" to "no ridge." But was "no ridge" *biologically possible* for this worm lineage? Your own work shows it wasn’t, without a radical developmental overhaul. If the alternative phenotype in your model is unreachable, is the model testing anything real? Or is it just confirming that, given the developmental constraints forced upon them, worms with ridges do better *than an impossible phantom*?

  **Brandt:** That’s a sharp question, Kwame. But optimality models aren't about impossible phantoms. They define a *space of possibilities* defined by the currency and trade-offs. The Reachability Clause wants me to specify *which* of those possibilities were *developmentally accessible*. Okay, let's try: Given the fixed cross-section and incremental secretion, the accessible options were variations *within* the stepped helix – height, step angle, maybe coarseness. A perfectly smooth interior? Unreachable without a new secretion mode. My model predicts selection should favour steeper helices in faster flows *within that accessible space*. I haven't tested that yet – but I could. The model guides us to look for variation where it *can* occur. Without it, how do we know if constraint is absolute, or if selection *is* acting within bounds?

  **Adeyemi:** Now we’re getting closer. You admit the crucial role of development in defining the realm of the possible. But here’s my deeper worry: even if you find steeper helices in faster flows, confirming selection acts *within* the constraint, does that make the ridge itself an adaptation? Or is the ridge still fundamentally a developmental byproduct, upon which selection is now tinkering at the margins? You’d call the whole ridge an adaptation. I’d say the ridge’s *existence* is explained by development, its *minor variations* might be shaped by selection. Splitting the causal history risks attributing too much to selection. The null hypothesis shouldn't be "optimally adapted" but "what does development, plus neutral drift, produce?" *Then* see if selection has tweaked it.

  **Brandt:** And there’s the methodological divide. Your null model is development plus drift. Mine is optimal design given trade-offs. Mine is far more powerful for *discovering* function. Without assuming selection *can* shape efficient solutions, we might miss the functional forest for the constraint trees. Look at the vortex – it’s a beautifully efficient way to hold particles near the tentacles. That elegance screams design by selection, even if the basic ridge form came via development. Why must we choose only *one* cause? Why can't the ridge be a developmental byproduct *that was co-opted and refined by selection*? Isn't that the synthesis we need?

  **Adeyemi:** It *sounds* like synthesis, Ilse. But in practice, calling it "adapted" flips the burden of proof. It implies selection was the *primary* shaper unless proven otherwise. That’s the adaptationist programme Gould fought. For the glass-stitch worm, the primary shaper of the ridge's existence and core form *is* development. Selection might exploit it and tweak minor aspects. Calling the ridge an "adaptation" obscures that hierarchy of causes. The Reachability Clause forces us to ask: "Could it have been otherwise?" before declaring "This is why it’s like *this*." For the ridge’s form, the answer seems "No, not without changing development itself." That shifts the explanation. The vortex is elegant, yes. But elegance can arise from constraint too. A spider's web is elegant, but its radial symmetry stems from the spider's body plan and spinning behaviour – constraints selection works with, not designs from scratch.

  **Brandt:** But selection *shaped* the spinning behaviour! It’s causal chains, Kwame. The developmental constraint in the worms is itself a product of past selection for an efficient tube-building method. Past selection locked in a process that now produces a structure with current utility. The history is one continuous thread of selection acting on phenotypes, building development systems that generate forms upon which further selection acts. Splitting "origin" and "utility" is artificial. Selection explains both the persistence *and* the form, because the form is generated by a development system moulded by selection. The ridge is an adaptation *because* it’s maintained by selection *for* its current function, regardless of its developmental genesis. The vortex *is* the reason it’s there now.

  **Adeyemi:** And that, Ilse, is where we fundamentally disagree. You see one causal thread: selection. I see multiple, interacting threads: historical contingency locking in developmental paths, physical laws shaping possible forms, *and* selection sieving the results. Attributing form primarily to selection – calling the ridge an adaptation "for" the vortex – ignores the profound role of the initial conditions set by development. The vortex function explains persistence, not form. The form is explained by how the worm builds its tube. Lofoten’s clause makes that distinction empirically relevant. Until you can show me *which* alternative ridges were reachable – and that selection *chose* among them based on flow – the ridge remains, beautifully, a spandrel co-opted for use. The real story is in the building process, not just the sieve.

  *(Brandt looks at the flow tank schematic, then back at Adeyemi. She opens her mouth, then closes it, thoughtful, not conceding, but clearly grappling with the weight of the distinction he’s drawn. The fjord light glints off the glass in the model.)*

  ---

  **Afterword**

  The dialogue reveals the core disagreement isn't primarily about evidence or the reality of selection, but about causal attribution and explanatory focus. Brandt sees adaptation as explaining a trait's persistence *and* form through continuous selective history, viewing developmental constraints as past selective products. Adeyemi insists form is often primarily explained by immediate developmental constraints and history, with selection mainly explaining persistence and minor tweaks. For Adeyemi, establishing "reachability" – which forms were actually possible for the lineage – is essential before invoking selection to explain *why* this specific form exists. Brandt sees optimality models as powerful tools regardless, revealing function within developmentally defined spaces. The dispute hinges on whether "adaptation" primarily explains function/persistence or also explains specific form.

  \answer{REACHABILITY}
