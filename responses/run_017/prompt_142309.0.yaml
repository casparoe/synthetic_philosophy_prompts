  For the disanalogies, the membership criterion difference seems crucial. When the cognitive scientist says families have "hard criteria" via descent, he's importing precisely the kind of boundary Wittgenstein rejects for concepts. That's probably a load-bearing disanalogy.

  The user's alternative analogies reveal their concern about normativity - how can concepts have correctness conditions without essences? The rope analogy handles clustering but not normativity; the city analogy might fare better here by showing organic growth with functional constraints.

  On the language-game point... that's tricky. The cognitive scientist's critique might stick more here because games do have rules, but Wittgenstein would retort that language-games' rules emerge from practice. Still, the "no scoreboard" difference weakens this analogy more than family resemblance.

  The user's phrasing suggests they might be subtly defending Wittgenstein but need ammunition. Their emphasis on "correction and error" shows they grasp the normativity challenge. I should highlight how Wittgenstein's practice-based account handles this without genes or rules.
answer: |-
  Here is an audit of the cognitive scientist's challenge to Wittgenstein's family resemblance analogy, structured per your request:

  ### 1. Correspondence Mapping (Cognitive Scientist's Framework)
  - **Instances of the concept**: Individual family members (e.g., siblings, cousins).  
  - **Shared features**: Observable phenotypic traits (e.g., nose shape, chin structure).  
  - **Missing common property**: Genetic lineage (the hidden essence).  
  - **Extension over time**: Generational descent (biological reproduction).  
  - **Speaker's competence**: Recognizing family traits via biological inference.  
  - **Correction/error**: Misattribution of non-biological relations; corrected by genetic evidence.  
  - **Wittgenstein's mistake**: Treating surface resemblances as primary when they are epiphenomenal to an underlying causal essence (genes).

  ---

  ### 2. Disanalogies: Inert vs. Load-Bearing  
  | **Disanalogy** | **Inert/Load-Bearing** | **Why?** |  
  |----------------|------------------------|----------|  
  | **Family membership has a biological criterion (descent)** | **Load-bearing** | Wittgenstein *denies* concepts require such criteria. This disanalogy attacks the core anti-essentialist point by asserting that the analogy's *source* (families) relies on an essence. |  
  | **Determinate history/membership vs. open negotiability** | **Load-bearing** | Concepts evolve through practice, not fixed biological events. The objection exploits this to argue family resemblance *presupposes* determinacy. |  
  | **Common cause (genes) vs. no explanation for clustering** | **Load-bearing** | The scientist insists clustering *must* be explained (e.g., by genes or structural mechanisms). Wittgenstein's silence on causation becomes a vulnerability. |  
  | **Equal membership despite graded resemblance** | **Inert** | Graded membership *supports* Wittgenstein (e.g., peripheral games like ring-a-ring-a-roses vs. chess). This disanalogy doesn't harm the analogy—it strengthens it. No smuggling occurs; the passage accommodates prototypicality. |  

  ---

  ### 3. Does the Conclusion Survive?  
  **Claims Supported by the Analogy**:  
  - **(A) Negative Descriptive Claim**: No single feature common to all games.  
  - **(B) Practice Claim**: Competence without definability.  
  - **(C) Methodological Claim**: Essence-search is confused.  

  **Analysis**:  
  - The dilemma **touches (A) weakly and (C) strongly**. If family resemblance secretly relies on genes, (A) is undermined for families—but Wittgenstein uses families *illustratively*, not definitively. (C) is the real target: the scientist argues essence-search is *deferred* (genes) rather than dissolved.  
  - **Is touching (C) enough for his conclusion?** Only if we accept that *all* clustering requires hidden bonds. Wittgenstein rejects this demand.  
  - **On the unchosen horn**: If the analogy "abandons the hidden bond," the scientist assumes concepts *must* explain clustering. Wittgenstein would reply: clustering is a *descriptive fact* of use, not something needing causal explanation.  
  - **Conclusion survival**: The dilemma challenges (C) but doesn't refute it. Wittgenstein’s point survives if we reject the demand for hidden explanations.  

  ---

  ### 4. Alternative Analogies: Costs and Benefits  
  | **Analogy** | **Preserves** | **Loses** | **Escapes Clustering?** | **Handles Normativity?** |  
  |-------------|---------------|-----------|-------------------------|--------------------------|  
  | **Rope (overlapping fibres)** | • No essence<br>• Stability without universals | • Passive materials vs. rule-guided practice<br>• No historical dimension | **Yes**—clustering is emergent | **No**—no mechanism for correction/error |  
  | **Path worn across a field** | • Emergent structure<br>• Boundary vagueness | • Unintentional vs. normative practice<br>• No "getting it wrong" | **Partially**—relocates to path-formation | **Weakly**—norms arise from repetition, but not contestable |  
  | **Ancient city** | • Organic growth<br>• Functional diversity<br>• Negotiable boundaries | • Architectural constraints ≠ conceptual rules | **Yes**—no single plan explains all | **Yes**—norms embedded in living practice (e.g., "repairing" a district); errors possible via functional failure |  

  **Best candidate**: The **ancient city** preserves normativity and avoids essence, though it relocates clustering to historical contingency.  

  ---

  ### 5. Transfer to Language-Games  
  - **Does the objection transfer?** **Partially**.  
    - **Transfer**: Games (chess) *do* have rules and outcomes—aligning with the scientist's demand for structure. Language-games (e.g., promising) lack codified rules, inviting the charge of "hidden bonds."  
    - **Block**: Wittgenstein's point is that language-game rules *emerge from practice*, like city alleys from foot traffic. The analogy **stands independently** of family resemblance:  
      - Family resemblance → **concept extension**  
      - Language-games → **rule-following as practice**  
  - **Which carries more argumentative weight?** **Language-games** do. They ground normativity in public practice ("forms of life"), making correction/error possible *without* hidden essences. Family resemblance is merely illustrative; language-games show *how* concepts work.  

  ---

  ### Key Audit Takeaways  
  1. The scientist's critique hinges on demanding **causal explanation** for clustering—a demand Wittgenstein rejects as philosophical confusion.  
  2. **Load-bearing disanalogies** exploit biological essentialism, but Wittgenstein's analogy is **heuristic**, not literal.  
  3. **Methodological anti-essentialism (C)** is the core target. The dilemma challenges it but doesn't defeat it.  
  4. **Ancient city analogy** best handles normativity without essence.  
  5. **Language-games** are more central to Wittgenstein's project, anchoring normativity in practice.  

  The cognitive scientist's challenge is robust but conflates *description* (Wittgenstein) with *explanation* (cognitive science). His critique reframes—but does not refute—the anti-essentialist thrust.
