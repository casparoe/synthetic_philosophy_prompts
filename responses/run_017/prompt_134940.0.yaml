  | **3** | **Divine certainty without authorship/coercion**                            | God must be certain of outcomes (e.g., Judas' betrayal) without causing them, lest God be responsible for evil or freedom be illusory. | Non-negotiable for non-deterministic views. Negotiable for Thomism (God causes all). | **Thomism** (premotion implies divine causation); **Open Theism** (denies certainty). | Req #2, #7    |
  | **4** | **Providence: Petitionary prayer must be effective**                        | If God’s plan is fixed regardless of prayer (e.g., Abraham interceding for Sodom), prayer is performative, not providentially significant. | Non-negotiable for views prioritizing interactive divinity. Negotiable for strong determinists. | **Ockhamism** (foreknowledge static); **Thomism** (divine cause fixed). | Req #6, #7    |
  | **5** | **Providence: Prophecy must be non-coercive & informative**                 | Prophecies (e.g., Peter’s denial) must not cause the event or render it unfree, yet still convey divine knowledge. | Non-negotiable for classical theism. Negotiable if prophecy is probabilistic (Open Theism). | **Open Theism** (cannot guarantee prophecy); **Thomism** (prophecy may cause event). | Req #8        |
  | **6** | **Ordering of divine knowledge must do logical work**                       | If "moments" (natural → middle → free knowledge) are merely pictorial, they don’t explain how God avoids actualizing contradictions. | Non-negotiable for Molinism. Negotiable for Ockhamism/Thomism (knowledge is simple/timeless). | **Molinism** (ordering is central); **Ockhamism** (no ordering needed). | Req #4        |
  | **7** | **Respect divine aseity (independence)**                                   | God’s knowledge must not depend on creation (e.g., CoFs "outside" God), lest creation determine divine cognition. | Non-negotiable for classical theism (e.g., Thomism). Negotiable for process theology. | **Molinism** (CoFs independent of God); **Ockhamism** (future contingents determine knowledge). | Req #1, #3    |
  | **8** | **Disclosure case: CoFs survive revelation to the agent**                   | If an agent knows "In C, I would freely do X," can they choose otherwise? If not, freedom is compromised; if yes, CoFs may be falsified. | Negotiable: Tests coherence of CoFs. Non-negotiable only if disclosure is possible. | **Molinism** (tension with CoF truth); **Open Theism** (no CoFs to disclose). | Req #1, #5    |
