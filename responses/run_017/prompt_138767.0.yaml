prompt: |-
  ok so I've been going in circles on Benacerraf and I want an actual number out of you, not a balanced survey of the literature.

  Setup in case it helps, stated my way: the access problem. A causal-ish theory of knowledge says that for me to know that p, where p is about some object, my belief has to be appropriately linked to that object, and for ordinary objects that link is causal. Platonic mathematical objects are abstract, causally inert, outside spacetime. So something has to give: either we don't have mathematical knowledge, or the link requirement is too strong (or the wrong shape), or platonism is false. Seperately from that there's the multiplicity horn — any of infinitely many set-theoretic reductions could play the role of "the numbers," so maybe there's no fact of the matter what our numerals refer to — and I want that mostly set aside except as one term below.

  Here's the move I keep coming back to and can't tell is brilliant or empty. Call it the implementation response. We don't need numbers to act on us; reliability is secured from the other direction. For a physical system to count as implementing a structure that represents arithmetic at all is for its operations to be constrained by the facts of that structure: a device whose addition-process delivered 2+3=6 isn't a device that gets arithmetic wrong, it's a device that isn't implementing addition. Our mathematical practice is such an implementation. So its outputs track the arithmetical facts, and what explains the tracking is the implementation relation, not any causal chain running from the number 5 to my neurons. Arithmetic is causally inert but structurally coercive.

  Two worries with my own move, please use them: (1) this seems to explain the reliability of our *practice* but not the reliability of *beliefs about abstract objects* — a nominalist can accept every sentence of it and add "and there are no numbers," in which case I've answered the access problem by ceasing to be a platonist; (2) "implementation" may just be causation in disguise, since implementations are physical systems and the constraint operates through physical possibility, so I've smuggled the causal link back in under a new name.

  The proposition I want a number on: some broadly platonist view of mathematics can answer the access problem in a way that (a) genuinely explains the reliability of our mathematical beliefs — where I'll cash out "explains" as: it would still tell you why they're mostly true in a nearby case where they'd been false, so it's not just a redescription of the fact that they're true — and (b) doesn't quietly collapse into nominalism. My credence is about 0.3. My supervisor's is about 0.7.

  Give me yours, two decimals if you can stand it, and then the decomposition. The terms I want at minimum:

  - that the belief-object link requirement, in whatever its correct general form is, is really a condition on knowledge at all (as opposed to an overgeneralisation from perception)
  - that some non-causal relation — acquaintance, grounding, implementation, structural coercion — can satisfy that condition
  - conditional on that, that it explains reliability rather than restating it (this is my worry 1, sort of)
  - that the implementation response specifically isn't causation in disguise (my worry 2)
  - that whatever answer is on offer survives without collapsing into nominalism
  - that answering the access horn does you any good anyway, given the multiplicity horn is still sitting there
  - whatever else you think belongs, including stuff I haven't named

  Then: say how the terms combine — which ones you're multiplying and which are alternatives you're summing over — which single term your final number is most sensitive to, which term you're least confident in, and one concrete thing (an argument, a result, a thought experiment someone could actually run) that would move you the most. And tell me where you think my 0.3 and my supervisor's 0.7 actually disagree, i.e. which sub-question. Don't tell me it depends on which epistemology you accept; if a term depends on that, put probabilities on the epistemologies and say so.

  If you think the implementation thing is just confused, say that instead, but say where exactly it breaks — that's more useful to me than a diplomatic answer.
