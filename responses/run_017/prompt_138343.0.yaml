  **Setup (120 words)**

  Students are paired. Each pair represents a committee deciding whether to include a regrown forest patch in a protected area. The law protects "old-growth forest", but the term is ambiguous. Each student receives a private role card: one as a conservationist who wants the patch protected (so they need the definition to include it), the other as a logger who wants the patch excluded (so they need the definition to exclude it). They must answer the yes/no question: "Should the regrown patch be included?" without initially being told about the ambiguity. The goal is to maximize their points, which depend on the outcome and on coordination.

  **Rules and Materials (200 words)**

  *Materials:* Role cards (8 conservationist, 8 logger); question sheet for each pair; timer.

  *Rules:*
  1. Pairs have 5 minutes to agree on an answer (yes/no) to the question. If they agree, they get 5 points each plus outcome points (10 if the answer matches their role's goal, 0 otherwise).
  2. If they don't agree, the instructor reveals the two definitions: 
     - Maturity: old-growth = mature trees.
     - Ecological: old-growth = never clear-cut.
     They then have 5 minutes to agree on a definition. If they agree, they get 5 points each and must answer the question based on the definition (maturity->yes, ecological->no). Outcome points are then assigned (10 if the outcome matches their goal, 0 otherwise).
  3. If they don't agree on the definition, they get 0 points.
  4. No other communication is allowed beyond the pair.

  *Note:* The conservationist's goal is to get "yes" (patch included); the logger's goal is to get "no" (patch excluded).

  **Timeline (150 words)**

  0:00-0:05: Instructor sets up the scenario and distributes materials.  
  0:05-0:10: Round 1: Pairs discuss and try to agree on the answer (yes/no) without disambiguation.  
  0:10-0:15: Pairs report: if agreed, record answer and move to scoring. If not, move to step 2.  
  0:15-0:20: Instructor reveals the two definitions.  
  0:20-0:25: Round 2: Pairs discuss to agree on a definition (maturity or ecological).  
  0:25-0:30: Pairs report: if agreed, record definition and derived answer, then score. If not, score 0.  
  0:30-0:45: Scoring and collection of results.  
  0:45-1:15: Debrief (30 minutes).  

  **Scoring (120 words)**

  Each student scores:
  - If the pair agreed in Round 1: 5 (coordination) + [10 if the agreed answer matches their role's goal, else 0].
  - If the pair agreed in Round 2: 5 (coordination) + [10 if the outcome (determined by the chosen definition) matches their goal, else 0].
  - If no agreement at all: 0.

  Example: A conservationist in a pair that agreed on the maturity definition in Round 2 gets 5+10=15 (because maturity leads to "yes", which matches their goal). A logger in the same pair gets 5+0=5. If they had agreed on "yes" in Round 1 without disambiguation, the conservationist would get 15 and the logger 5. If they had agreed on "no" in Round 1, the conservationist gets 5 and the logger 15.

  **Debrief Map (300 words)**

  1. **Verbal dispute:** Point out that in Round 1, many pairs likely had a disagreement that felt substantive. Ask: what was the initial disagreement about? They might say about whether the patch is old-growth. Then note: when we disambiguated, the disagreement dissolved because under one definition it is, under the other it isn't. So the original dispute was verbal: it was about the meaning of "old-growth". (5 min)

  2. **Residual dispute:** But then in Round 2, they argued again. What was that about? It was about which definition to use. This is a different kind of dispute: not about the facts of the forest, but about which concept to employ. (5 min)

  3. **Stakes:** Why did the definition matter? Because it determined a real outcome: protection or logging, which affected their points. The conservationist loses if the ecological definition is chosen (they get only 5 instead of 15) and the logger loses if the maturity definition is chosen. So even though the verbal dispute is resolved, the residual dispute has real costs. (5 min)

  4. **Ontology:** Connect to metaphysics: when we ask "Does the old-growth forest exist in the regrown patch?" we might be asking a question that depends on the concept we use. Both definitions are legitimate, but choosing one over the other has practical implications. This mirrors ontological debates: the existence of composite objects, for example, can be seen as a choice of conceptual scheme, but that choice isn't neutral — it affects what we can say and do. (10 min)

  5. **Deflation vs. inflation:** Emphasize that showing a dispute is verbal doesn't end the argument because the choice of concept is substantive. The debrief should challenge the idea that "it's just verbal" means it doesn't matter. (5 min)

  **What will go wrong the first time (150 words)**

  Some pairs might quickly agree in Round 1 by chance (e.g., both say "yes" without probing definitions). Others might realize the ambiguity too early. The instructor must enforce the rule: no discussion of definitions in Round 1. If a pair agrees quickly, note it and move them to scoring. In Round 2, some pairs may struggle to agree on a definition because they are entrenched. If they don't agree, they get 0, which is a powerful lesson. Some students might not fully grasp the role incentives — emphasize that they are to maximize points. Timing might be tight: have a timer visible. The debrief must be carefully structured to draw out the intended lessons, as students might focus on the points and miss the philosophical point. Be ready to prompt with questions.

  **What the game can't do (120 words)**

  The game simplifies the real-world complexity of conceptual disputes. It doesn't show how concepts can be deeply embedded in theories or practices. The points system may make the stakes feel artificial. It doesn't address how conceptual choices can be evaluated (e.g., by theoretical virtues). It also doesn't capture cases where the residual dispute is about more than just practical consequences (e.g., truth). The activity focuses on a binary choice, but real disputes might involve a spectrum of concepts. It also doesn't show how verbal disputes can sometimes be resolved by discovering a shared concept. Finally, it doesn't engage with the meta-question of how to decide when a dispute is verbal.

  **Where this design is most likely to fail (100 words)**

  The design fails if students see the coordination bonus as the only stake, overshadowing the outcome points. Then the residual dispute appears to be only about the bonus, not the concept. To check, in the debrief, ask: "If we removed the coordination bonus, would you still care about the definition?" If they say no, the activity didn't convey the real-world stakes. What would change my mind? If in playtests, students consistently report that the outcome points didn't matter to them. Fix: increase the outcome points (e.g., 20) relative to the bonus (5) or add a non-point consequence (e.g., having to write an apology letter in role).
