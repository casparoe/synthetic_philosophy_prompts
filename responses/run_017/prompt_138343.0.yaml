  ### Activity Design: "Conceptual Stakes"

  #### **Setup (120 words)**  
  Students are paired (8 pairs). Each pair is a "Boundary Committee" deciding whether a contested territory ("Northvale") should be granted independence or remain annexed. The decision hinges on whether Northvale qualifies as a "sovereign-ready territory." Each student receives a role card: one as a **Liberation Advocate** (wants independence; needs "sovereign-ready" to require *cultural cohesion*), the other as a **Resource Controller** (wants annexation; needs it to require *economic self-sufficiency*). The question: "Should Northvale be independent?" No definitions are provided upfront. Roles include hidden stakes: Liberation Advocates lose access to cultural grants if annexed; Resource Controllers lose mining rights if independent. Goal: Maximize points via agreement while protecting hidden interests.

  #### **Rules and Materials (200 words)**  
  *Materials:*  
  - 8 "Liberation Advocate" cards: "Your definition: 'sovereign-ready' = has a unified cultural identity. You get 10 points if Northvale is independent (otherwise 0). If annexed, you lose future funding for cultural events."  
  - 8 "Resource Controller" cards: "Your definition: 'sovereign-ready' = can fund itself without aid. You get 10 points if annexed (otherwise 0). If independent, you lose mining permits."  
  - Question sheet per pair: "Should Northvale be independent? (Yes/No)"  
  - Timer, scoreboard.  

  *Rules:*  
  1. **Round 1 (5 mins):** Argue the question without defining "sovereign-ready." If they agree on yes/no, each gets 5 coordination points + outcome points (10 if outcome matches role goal, else 0).  
  2. **If no agreement:** Instructor reveals definitions.  
  3. **Round 2 (5 mins):** Argue which definition to use. If they agree on one, they must apply it (cultural cohesion → independence; economic self-sufficiency → annexation). Each gets 5 coordination points + outcome points.  
  4. **No agreement in Round 2:** Both get 0.  
  5. **No role-swapping or revealing exact card text** (e.g., can say "I need independence for my community" but not "I get 10 points for yes").  

  #### **Timeline (150 words)**  
  - **0:00–5:00:** Distribute cards, read rules, assign pairs. Emphasize: "Decide yes/no—don’t define terms yet."  
  - **5:00–10:00:** Round 1 (argue question). Circulate to enforce no definition talk.  
  - **10:00–12:00:** Pairs report Round 1 outcomes. If agreed, record and tally scores. If not, mark for Round 2.  
  - **12:00–15:00:** Reveal definitions: "Two interpretations: (A) Cultural cohesion = shared language/traditions; (B) Economic self-sufficiency = no external aid needed."  
  - **15:00–20:00:** Round 2 (argue definitions). If agreed, derive answer, then score.  
  - **20:00–25:00:** Report Round 2 outcomes. Tally all scores.  
  - **25:00–75:00:** Debrief (50 mins; structure below).  

  #### **Scoring (120 words)**  
  - **Coordination bonus:** +5 each for any agreement (Round 1 or 2).  
  - **Outcome points:** +10 if the final decision (independent/annexed) matches role goal, else 0.  
  - **Max possible:** 15 points (coordination + outcome).  
  - **Example:** Pair agrees on "cultural cohesion" in Round 2 → Northvale independent. Liberation Advocate: 5 (coord) + 10 (outcome) = 15. Resource Controller: 5 (coord) + 0 (outcome) = 5.  
  - **Penalty:** No agreement = 0. Outcome points reflect real costs (e.g., Resource Controller "loses mining rights" symbolically via lost points). Scoreboards display points as "funding secured" or "rights retained."  

  #### **Debrief Map (300 words)**  
  1. **Identify the verbal dispute (10 mins):**  
     - Ask: "In Round 1, what did you disagree about?" Students will say "whether Northvale is sovereign-ready." Highlight moments where they talked past each other (e.g., "I said it’s ready because of its culture, but they talked about economics").  
     - **Point (a):** The first-order disagreement dissolved when definitions were revealed—once disambiguated, both could agree Northvale *is* culturally cohesive but *not* economically self-sufficient. The original conflict was verbal: same facts, different meanings.  

  2. **Surface residual stakes (15 mins):**  
     - Ask: "Why did the argument continue in Round 2?" Students will note fighting over definitions (e.g., "We agreed on the facts but still couldn’t agree on the answer").  
     - **Point (b):** Disambiguation didn’t deflate the dispute because the fight shifted to *which concept to use*. Map comments like "But my definition is fairer!" to conceptual ethics. Stress incentives: e.g., a Liberation Advocate who accepted "economic" lost funding access—this cost isn’t about truth but real-world consequences.  

  3. **Connect to ontology (20 mins):**  
     - Pose: "When we ask ‘Does a sovereign-ready Northvale exist?’, are we asking about the world or our concepts?" Use student quotes (e.g., "Both definitions feel valid, but we had to pick one").  
     - **Ontology link:** Explain that existence questions (like "Does a statue exist apart from its clay?") often mask conceptual choices. Both sides can be "right" (yes under cultural cohesion, no under economics), yet the fight persists because choosing a concept privileges certain interests. Note: The vote to coordinate on one reading mirrors how ontological commitments enforce winners/losers (e.g., annexation erases cultural sovereignty).  

  4. **Deflation vs. stakes (5 mins):**  
     - Contrast: "Verbal-dispute verdicts settle meanings but not *which meanings we should care about*." Tie to metaphysics: Quantifier variance (Chalmers) allows multiple "right" ontologies, but conceptual ethics (Burgess, Plunkett) asks why one matters more.  

  #### **What Will Go Wrong the First Time (150 words)**  
  Students might prematurely define "sovereign-ready" in Round 1 despite rules—gently intervene: "Stick to yes/no for now." Some pairs will agree quickly in Round 1 by luck (e.g., both say "yes"), missing the conflict; use them in debrief to contrast with deadlocked pairs. In Round 2, emotional bargaining may dominate ("Just pick my definition so we both get 5 points!"), overshadowing stakes. Highlight this in debrief: "Did coordination feel like a compromise, or did one side lose?" Scoring confusion may arise—simplify with a visual guide. Time pressure in Round 2 could force rushed agreements; extend by 2 mins if needed. Finally, students may miss the ontology link; prep prompts like, "When you chose a definition, were you deciding what exists or what matters?"  

  #### **What the Game Can’t Do (120 words)**  
  This activity simplifies conceptual ethics: It can’t show how stakes emerge from *systemic* practices (e.g., legal/political structures) beyond individual costs. It reduces "real costs" to points, risking artificiality—students might not feel visceral loss. It also can’t model gradual concept evolution (e.g., how "sovereign-ready" might shift meaning over debates). The binary choice (two definitions) ignores spectrum cases or hybrid concepts. Finally, it doesn’t address how power dynamics (e.g., who gets to define terms) shape disputes; debrief must add this. Use as a springboard: "In real life, what gives one concept more weight?"  

  #### **Where This Design Is Most Likely to Fail (100 words)**  
  The activity fails **if students see the residual dispute as only about points, not deeper stakes**. If post-game surveys show >70% reporting "I only cared about the 5-point bonus, not the outcome," the real-world costs weren’t salient. This would indicate the payoff structure smuggled in substantive stakes by making coordination the *primary* incentive. To fix: (1) Remove the coordination bonus; keep only outcome points. (2) Add role-specific consequences: e.g., Liberation Advocates must write 1 sentence on "Why annexation harms culture" if they lose. This heightens the sense of loss beyond points. Test with pilot groups; if feedback still centers on "winning" vs. "losing" the debate, not the concept’s impact, redesign with real-world analogies (e.g., climate change "mitigation" vs. "adaptation" definitions affecting policy).  

  ---

  **Regenerability Note**: To reuse yearly, generate new cases by:  
  1. Pick a binary question (e.g., "Should AI artists get copyright?").  
  2. Assign roles with clashing purposes (e.g., Artist: needs "art" to require *human input*; Tech Co: needs it to include *algorithmic output*).  
  3. Embed asymmetric stakes (e.g., Artists lose royalties if "art" includes AI; Tech Co loses IP if it doesn’t).  
  Ensure definitions are equipollent (neither obvious). Test for "definitional proximity" by piloting with TAs—if they guess the ambiguity instantly, revise.
