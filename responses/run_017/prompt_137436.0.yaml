       - A: \( \frac{360 + 10}{500} = \frac{370}{500} = 74.0\% \)  
       - B: \( \frac{147 + 63}{500} = \frac{210}{500} = 42.0\% \)  
       - **Risk Difference (A - B)**: \( 74.0\% - 42.0\% = +32.0\% \) (A better).  
     - **Recanalized stratum**:  
       - A: \( \frac{360}{400} = 90.0\% \)  
       - B: \( \frac{147}{150} = 98.0\% \)  
