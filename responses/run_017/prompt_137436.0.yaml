     **Corrected Final Table (N=500 per group, recanalized: A=400, B=150; not: A=100, B=350)**:  
     |                     | Protocol A (New) |       | Protocol B (Established) |       |
     |---------------------|------------------|-------|--------------------------|-------|
     | **Recanalization**  | 360     | 40    | 147     | 3      | 
     | **No recanalization**| 10      | 90    | 63      | 287    | 
     | **Total**           | 370     | 130   | 210     | 290    | 

     - **Recanalization stratum**:  
       - A: 360 success + 40 fail = 400 patients  
       - B: 147 success + 3 fail = 150 patients  
     - **No recanalization stratum**:  
       - A: 10 success + 90 fail = 100 patients  
       - B: 63 success + 287 fail = 350 patients  

