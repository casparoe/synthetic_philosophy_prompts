     **Reversal confirmed**:  
     - A has higher aggregate success (+32.0%).  
     - B has higher success in both recanalized (-8.0%) and not recanalized (-8.0%) strata.  

  ---

  ### **Causal Structure**
  - **Causal DAG**: Treatment → Recanalization → Outcome, and Treatment → Outcome (direct effect).  
    - Arrows:  
      - Protocol (A/B) → Recanalization status (mediator).  
      - Protocol (A/B) → Functional independence (direct path).  
      - Recanalization status → Functional independence.  
  - **No confounders**: Groups are randomized (no pre-treatment differences).  
  - **Key mechanism**:  
    - A causes recanalization in 80% of patients (vs. 30% for B).  
    - Recanalization massively improves outcomes (90% success if recanalized, 10-18% if not).  
    - However, A has a **harmful direct effect** (e.g., due to vascular injury from the procedure):  
      - In recanalized patients, A has 90% success vs. B's 98%.  
      - In non-recanalized patients, A has 10% success vs. B's 18%.  
    - Despite B being better within each stratum, A's higher recanalization rate (80% vs. 30%) dominates, leading to better aggregate outcomes.  

  ---

  ### **Why A Should Be Chosen for Future Patients**
  - **Decision context**: For a future patient, we cannot know recanalization status pre-treatment (it is a post-treatment consequence). We must choose one protocol for all.  
  - **Quantity of interest**: **Total effect** of treatment on the population, which includes effects mediated through recanalization.  
  - **Total effect advantage**: A’s +32.0% risk difference.  
  - **Composition effect**: A’s strength (high recanalization) outweighs its weakness (worse outcomes within strata). B’s within-stratum advantage is real but insufficient to compensate for its low recanalization rate.  

  ---

  ### **Key Feature Doing the Work**
  The **mediator (recanalization) is beneficial**, and Treatment A has a strong positive effect on it, offsetting its negative direct effects.  

  #### **What Happens if Stratifying Variable is a Pre-Treatment Confounder?**
  - **Scenario change**: Suppose "recanalization status" is replaced with **baseline collateral circulation status** (good vs. poor), a pre-treatment variable affecting both treatment assignment and outcome.  
  - **Data identical to above table**, but now:  
    - "Recanalized" → "Good collaterals" (prognostic for success).  
    - "Not recanalized" → "Poor collaterals".  
  - **Interpretation**:  
    - Groups are imbalanced: A has 80% good collaterals, B has 30%.  
    - Within each collateral stratum, B is better (same risk differences: -8.0%).  
  - **Adjusted analysis**: Standardize to population collateral distribution (e.g., 50% good, 50% poor):  
    - Expected success for A: \( (0.5 \times 90.0\%) + (0.5 \times 10.0\%) = 50.0\% \).  
    - Expected success for B: \( (0.5 \times 98.0\%) + (0.5 \times 18.0\%) = 58.0\% \).  
    - **Adjusted risk difference (B - A)**: +8.0% (B better).  
  - **Verdict flips**: Now disaggregation is trustworthy; B should be chosen.  

  ---

  ### **Reply to "Subgroup Analysis is Trustworthy"**
  - **Argument**: "We want the direct effect, not the total effect. Holding recanalization fixed, B is better."  
  - **Rebuttal**:  
    1. **Estimand relevance**: The direct effect (holding recanalization fixed) is not appropriate here. The decision-maker cannot control recanalization—it is a consequence of treatment. The total effect (which includes recanalization) is the only relevant quantity for protocol choice.  
    2. **Bias**: Naive stratification on a post-treatment variable (recanalization) **does not identify the direct effect** due to collider bias. Conditioning on recanalization (a mediator) can induce associations between unmeasured causes of recanalization and outcome, invalidating the comparison.  

  ---

  ### **Measure-Relative Reversal?**
  - **Odds ratios (ORs)**:  
    - **Aggregate**:  
      - A: Success = 370, Fail = 130 → Odds = 370/130 ≈ 2.846  
      - B: Success = 210, Fail = 290 → Odds = 210/290 ≈ 0.724  
      - OR (A/B) = 2.846 / 0.724 ≈ 3.93 (A better).  
    - **Recanalized stratum**:  
      - A: Odds = 360/40 = 9.00  
      - B: Odds = 147/3 = 49.00  
      - OR (A/B) = 9.00/49.00 ≈ 0.18 (B better).  
    - **Not recanalized stratum**:  
      - A: Odds = 10/90 ≈ 0.111  
      - B: Odds = 63/287 ≈ 0.220  
      - OR (A/B) = 0.111/0.220 ≈ 0.50 (B better).  
  - **Reversal persists**: ORs show A better overall, B better in each stratum.  
  - **Conclusion**: The reversal is robust to risk differences and odds ratios.  

  ---

  ### **What the Case Establishes**
  **"When the stratifying variable is a post-treatment mediator, disaggregation can mask the total effect. The aggregate comparison may be causally appropriate for decisions where the mediator cannot be controlled pre-treatment."**  

  This claim is earned by:  
  1. **Realistic setup**: Stroke protocols with recanalization as a well-established mediator.  
  2. **Causal structure**: Explicit paths (treatment → mediator → outcome).  
  3. **Decision context**: Future patients with unknown mediator status.  
  4. **Robust reversal**: Large margins, no small cells, reversal on both RD and OR scales.  
  5. **Falsification test**: Verdict flips when the variable is a confounder.  

  ---  
  This case demonstrates that Simpson's paradox reversals do not universally justify disaggregation; the causal role of the stratifying variable is decisive.
