  ## Sensum™ Help Center: Your Private Language, Perfectly Unshared

  **Welcome to Sensum™!** We’re thrilled you’re embarking on the journey to articulate your truly unique inner world. This page answers common questions about using your Personal Sensation Sign™ (S). Remember: Your meaning is yours alone.

  **Q1: How do I define my Personal Sensation Sign™ (S)?**
  A: During onboarding, the Sensum™ Definition Protocol guides you. Focus intently on the specific sensation you wish to signify. When you feel it distinctly, tap the "Capture S" button. This creates an indelible association between the sensation and your chosen Sign (S) within your private Sensum™ lexicon. Future logs are simple: feel S, tap S.

  **Q2: How do I know I’m logging S correctly?**
  A: Sensum™ guarantees the absolute privacy of your meaning. When you log S, the app confirms *your act of logging* occurred precisely when *you intended* to log S. Our proprietary CertaintyCheck™ algorithm verifies the temporal alignment of your tap with your conscious intent to signify *that which you privately define as S*. You are the sole authority on the correctness of S's application.

  **Q3: I logged S 37 times yesterday, but only 3 times today. Does this mean the sensation is less frequent?**
  A: Sensum™ provides raw temporal data of your logging events. The app displays "S logged: 37 instances (Day 1)" and "S logged: 3 instances (Day 2)". Interpretation of frequency, intensity, or meaning behind these logged instances rests entirely within your private domain. For deeper pattern *suggestions* (based solely on your logging chronology, not S's content), consider **Sensum Patterns+** (Premium Feature). Patterns+ identifies chronological clusters of *any* Sign log, offering visualizations like "Log Density Heatmaps."

  **Q4: What’s SincerityMode™ (Premium)? How does it make S *more* private?**
  A: SincerityMode™ enhances the logging experience! Activating it requires a brief biometric confirmation (fingerprint/facial scan) *at the moment of logging*. This provides an extra layer of assurance *to you* that the log reflects your *current, focused intent* to signify S. It reinforces the personal integrity of your logging act. Remember: The meaning of S remains, as always, inaccessible and unverifiable externally. SincerityMode™ simply deepens your personal logging ritual.

  **Q5: How secure is my Sensum™ diary? Can anyone else understand my S?**
  A: Your privacy is paramount. All logs are encrypted using military-grade AES-256 encryption *on your device* before syncing (optional) to our zero-knowledge servers. Even if intercepted, the data – being timestamps linked to a user-defined glyph with *no public referent* – is fundamentally incomprehensible. It’s not *encrypted* meaning; it’s *inherently private* data. Rest assured, no entity, including Sensum™, can access the meaning of S. Our **Vault+** tier offers geographically distributed encrypted backup for ultimate peace of mind regarding the *preservation* of your encrypted logs.

  **Q6: Can I share my S logs with my therapist/doctor?**
  A: Sensum™ is designed for personal, private articulation. Directly sharing your S logs would be meaningless to others, as S has no shared definition. However, our **Sensum Connect™** integration (Premium) allows you to *correlate* the *timestamps* of your S logs with entries in compatible health/fitness apps (e.g., "Logged S at 14:30; Heart Rate (via HealthApp): 102bpm"). This provides *external context* around the *time* you logged S, without compromising S's private meaning. Connect™ facilitates richer discussions *about* the context of your logs, using shared public metrics.

  **Q7: My StreakCounter™ broke! I know I felt S yesterday but forgot to log it. Can I backdate?**
  A: The StreakCounter™ celebrates your consistent logging *practice*, a key pillar of Sensum™'s value. It tracks consecutive days with *at least one recorded logging event of any Sign*. Unfortunately, backdating is impossible. The integrity of the Streak relies on the verifiable timestamp of the *logging act itself*. **StreakSaver™** (Premium) sends escalating reminders if a logging window closes without activity, helping protect your valuable consistency metric. Remember: The StreakCounter™ reflects diligence in your practice, not necessarily the frequency of the sensation S itself – that correlation remains yours alone to ponder.

  **Q8: Is Sensum™ right for me if I want to understand my feelings better?**
  A: Sensum™ empowers you to *designate* and *record* your unique inner experiences with unparalleled privacy. It provides the tools to faithfully log *your* designated Sign (S) whenever *you* choose. The journey of understanding – connecting S to causes, effects, or patterns over time – is a profoundly personal exploration facilitated by your consistent logging. Our premium features (Patterns+, Connect™) offer chronological and contextual *data points* to inform *your* personal reflection. Sensum™ gives you the private language; you provide the ever-evolving, uniquely personal dictionary.

  **Unlock the Ultimate Private Lexicon. Upgrade to Sensum Premium Today.**
