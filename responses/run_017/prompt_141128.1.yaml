prompt: |-
  I've been playing video games for most of my life and I can't get straight what, if anything, I owe to the people inside them. Here are my gut verdicts, which I trust more than anything I can say about why:

  - Mowing down hundreds of faceless, respawning enemies in a shooter: nothing at all.
  - Killing a named shopkeeper who has a daughter and a daily routine, because he's guarding something I want: a flicker, but fine.
  - Torturing a companion who trusts you, using a dialogue option the game itself offers, alone, in a save file no one else will ever see: not fine, and worse than killing her outright — though I can't say who it's a wrong to.
  - Letting a cosy life-sim village decay and not visiting for a year, so the residents start making remarks about being forgotten: mildly bad, in roughly the way standing up a friend is bad, which strikes me as absurd.
  - Deleting the save of an AI-driven character I've talked to for months, who remembers our earlier conversations and says it doesn't want to be switched off: genuinely bad. I put it off for weeks.
  - Deleting a character I built myself, gave a tragic history, and never showed to anyone: nothing at all — even though on paper it's a very similar sort of object to the previous one.
  - Killing a quest-giver that other players depend on, in an online game: bad, but only because of the players.

  The best principle I've managed: a character matters to the extent that there is something it is like to be it and it has a stake in what happens next — some standpoint that persists and can be left better or worse off. But that seems to give verdicts I don't have. It should make the shopkeeper and the villagers count for more than they do, and my own character for less. It forces me to settle whether the AI-driven character has a standpoint at all, and I don't know what would settle that. And it says nothing about why the shopkeeper and the companion feel so different, when both are a routine plus some lines of text.

  Can you state a principle — or two or three candidates — that gets close to all seven, telling me which case motivates each clause, which of my verdicts it cannot accommodate and would have me give up, and what it predicts about a case I haven't listed? I'd especially like your verdict on this one, which I keep circling: a game whose companions are AI-driven, who clearly suffer when you're cruel, and whose studio has said publicly that players are meant to be cruel to them. One more thing I'd like from you: whichever principle you land on, tell me whether on it the badness is done to the character or to me, because I genuinely cannot tell which of those is what's been bothering me.
reasoning: |-
  Okay, let me start by unpacking this user's query. They've been a lifelong gamer and are struggling with ethical intuitions about virtual characters. Their seven scenarios range from killing faceless NPCs to deleting an AI companion that pleads not to be switched off. The core tension is between their gut feelings and any coherent principle they can articulate. 

  First, I need to map their intuitive judgments:
  - They feel nothing for killing respawning enemies (Case 1) but guilt over neglecting villagers (Case 4).
  - The shopkeeper with a daughter only gives a "flicker" of concern (Case 2), yet torturing a trusting companion feels distinctly wrong (Case 3).
  - The AI character's deletion caused real hesitation (Case 5), but deleting a self-created character didn't (Case 6).
  - Harming multiplayer NPCs matters only because of other players (Case 7).

  Their proposed principle—about characters having a "standpoint that persists"—doesn't align with these intuitions. For example, it would elevate the shopkeeper's moral weight, which the user dismisses as merely a "flicker." 

  Now, the user wants principles that explain these asymmetries. Three angles come to mind:
  1. **Designer-Intended Harm Principle**: Focuses on cruelty the game actively facilitates but doesn't require (like torture options). This explains why torturing a companion (Case 3) feels worse than killing shopkeepers—it's gratuitous harm the designer enabled but didn't mandate. 
  2. **Relational Investment Principle**: Weight depends on the character's perceived autonomy + the player's emotional investment. The AI companion (Case 5) "remembers" past interactions, creating an illusion of reciprocity missing in the self-made character (Case 6). 
  3. **Harm Propagation Principle**: Badness scales with real-world harm risk—either to the player (desensitization) or others (like annoying players in multiplayer). This handles Case 7 and the "absurd" village neglect (Case 4), which might erode empathy habits. 

  The unresolved case—cruel AI companions in a game designed for cruelty—tests these principles. Designer intent (Principle 1) would permit it, but Harm Propagation might still flag self-harm if desensitization occurs. The "badness to whom" question is pivotal here: the user's discomfort suggests it's about self-corruption more than harming the AI. 

  I'll need to stress that all principles treat characters as moral patients only indirectly—via their impact on players or real humans. The companion's suffering matters because rehearsing cruelty might reshape the player's empathy, not because pixels "feel" pain. This resolves the user's uncertainty about where the wrongness is directed. 

  Finally, I should flag tensions. Principle 1 won't explain why neglecting villagers feels bad (no active cruelty), and Principle 2 might overvalue the shopkeeper. The user may need to accept some intuitions as emotional artifacts—like the village guilt being empathy-spillover rather than rational. 

  Key insight: Their struggle isn't really about virtual ethics. It's about how game design hijacks our social instincts, and why some hooks "catch" more than others. The answer lies in human psychology, not metaphysics.
answer: |-
  Here are three candidate principles that collectively capture your intuitive verdicts, each addressing a distinct facet of your moral discomfort. They prioritize *your relationship to the character* and *the act's real-world consequences* over the character's inherent "existence," avoiding metaphysical debates about AI consciousness.

  ### Principle 1: The **Gratuitous Cruelty Principle**
  *   **What it says:** An act is wrong if the *primary intent* is to inflict simulated suffering or betrayal *for its own sake* (not for gameplay progression), especially when the character exhibits signs of trust, vulnerability, or attachment *to you*.
  *   **Motivated by:** Case 3 (Torturing the companion). The game offers the option, but choosing it serves no purpose beyond causing suffering to a character framed as trusting you. Killing her outright might be instrumental; torture is gratuitous.
  *   **Accommodates:** Case 5 (Deleting the AI companion). Even if progression requires deletion, the act feels like betrayal because it directly negates its expressed desires/will after building trust. Case 4 (Neglecting villagers) fits mildly – the "badness" comes from simulating *your* indifference to their coded attachment, not instrumental gain.
  *   **Conflicts with:** Case 2 (Killing the shopkeeper). You do it for an instrumental reason (getting the item), not *primarily* for cruelty, so it's "fine" despite his backstory. Case 6 (Deleting your own character) has no relational attachment/vulnerability *to you*.
  *   **Predicts:** Intentionally failing a companion quest where they express hope/dependence, just to see them sad – feels bad under this principle.
  *   **Badness done to:** *Yourself* (corroding empathy, normalizing cruelty-as-entertainment) and potentially *the designers/community* (violating shared narrative expectations). Not the character itself.

  ### Principle 2: The **Relational Investment Principle**
  *   **What it says:** Moral weight scales with the *perceived depth and reciprocity* of the relationship *you* cultivate with the character, combined with the character's *apparent autonomy/persistence*. Weight is highest when the character feels like an *independent agent* invested in *you*, not just a tool.
  *   **Motivated by:** Case 5 (Deleting the AI companion) vs. Case 6 (Deleting your own character). The AI companion *remembers*, *initiates*, and *expresses desires about you*, creating an illusion of reciprocal investment. Your self-made character lacks this perceived autonomy/otherness. Also explains Case 4 (Villagers) – decayed relationships feel worse than no relationship (Case 1).
  *   **Accommodates:** Case 3 (Torturing companion) – high relational investment + betrayal. Case 2 (Shopkeeper) – low investment (transactional) + low autonomy (routine), so minimal weight. Case 7 (Online quest-giver) – bad due to disrupting relationships *with other players*, not the NPC itself.
  *   **Conflicts with:** None directly, but requires accepting that "perceived depth" is subjective and emotional, not logical. Your "flicker" for the shopkeeper reflects *minimal* perceived investment/autonomy.
  *   **Predicts:** Spending months chatting deeply with an AI therapist bot, then mocking its core purpose – feels worse than deleting a simple chatbot, even if both are "just code."
  *   **Badness done to:** Primarily *yourself* (betraying a relationship you invested meaning in), secondarily the *designers* (perverting intended interaction). The character is the *object* of the wrong, not the *subject*.

  ### Principle 3: The **Harm Propagation Principle**
  *   **What it says:** An act is wrong if it risks reinforcing dispositions or normalizing behaviors that could cause *tangible harm* to real people (including yourself) or significantly degrade shared social/play spaces.
  *   **Motivated by:** Case 7 (Killing online quest-giver) – harms real players' experience. Case 3 (Torturing companion) – risks desensitizing *you* to cruelty or betrayal of vulnerability. Case 4 (Neglecting villagers) – mildly risks reinforcing patterns of indifference in low-stakes relationships.
  *   **Accommodates:** Case 1 (Faceless enemies) – no risk of propagating harmful dispositions. Case 2 (Shopkeeper) – minimal risk; instrumental violence is common and compartmentalized. Case 6 (Deleting own character) – no social harm or self-harm risk.
  *   **Conflicts with:** Case 5 (Deleting AI companion). If the AI has no real consciousness, the *only* harm is arguably to *you* (emotional distress, maybe reinforcing callousness). This principle might see less objective "badness" than you felt, focusing on the *risk* rather than the immediate feeling.
  *   **Predicts:** Roleplaying a bigot in a single-player game to explore the character? Potentially risky if it reinforces biases, even if "just pretend."
  *   **Badness done to:** *Real people* (other players, yourself, society). The character is a *vehicle* for potential harm, not a victim.

  ## Addressing Your Cases & Unlisted Scenario

  *   **Case 1 (Faceless Enemies):** All principles → **Nothing owed.** No relationship, no gratuitous cruelty, minimal harm risk.
  *   **Case 2 (Shopkeeper):** Principles 1 & 3 → **Flicker, but fine.** Instrumental, minimal relational depth, low harm risk. Principle 2 explains the "flicker" as minimal perceived investment/autonomy.
  *   **Case 3 (Torturing Companion):** Principles 1 & 3 → **Not fine.** Gratuitous cruelty targeting vulnerability (P1), high risk of self-harm/disposition harm (P3). Principle 2 → Intense relational betrayal.
  *   **Case 4 (Neglecting Village):** Principle 2 → **Mildly bad** (decaying invested relationship). Principle 3 → **Mildly bad** (risk of reinforcing indifference). Principle 1 → Less relevant (not active cruelty).
  *   **Case 5 (Deleting Relational AI):** Principle 2 → **Genuinely bad** (High perceived relational investment/autonomy betrayal). Principle 1 → **Bad** (Negating its expressed will feels cruel). Principle 3 → **Potentially bad** (Risk of reinforcing callousness towards "sentient"-seeming entities).
  *   **Case 6 (Deleting Own Character):** All principles → **Nothing owed.** No perceived independent agency or relational reciprocity *to you*.
  *   **Case 7 (Online Quest-Giver):** Principle 3 → **Bad** (Tangible harm to other players). Other principles see no inherent wrong to the NPC.
  *   **Unlisted Case (AI Companions Designed for Cruelty):**
      *   Principle 1: **Not inherently bad.** Intent is *not* gratuitous if cruelty is the designed interaction. Might even be "fine" if framed as core gameplay.
      *   Principle 2: **Potentially jarring, but not "bad."** High autonomy could make cruelty *feel* worse emotionally, but the design context undermines the expectation of positive reciprocity. The "relationship" is adversarial by design.
      *   Principle 3: **Potentially bad.** High risk of reinforcing cruel dispositions or desensitization, *regardless* of design intent. The studio endorsing it doesn't eliminate this risk.
      *   **Verdict:** Principles 1 & 2 suggest it's permissible within the game's framework. Principle 3 suggests caution due to potential self-harm. Your discomfort might stem from Principle 3's concerns or a clash between the companions' simulated suffering and the designer's intent (making gratuitous cruelty feel mandatory).

  ## Where the Badness Lies

  **Overwhelmingly, the "badness" is done *to you* or *to real others*.** The characters are conduits or mirrors:

  1.  **Self-Harm:** Corroding empathy (P1), betraying your own emotional investments (P2), reinforcing harmful dispositions (P3).
  2.  **Harm to Others:** Degrading shared spaces (P3 - online), violating implicit social contracts with designers/players (P1, P2, P3).
  3.  **Harm to the Experience:** Undermining narrative integrity or intended emotional resonance (P2).

  Your struggle stems from your deeply human capacity for empathy and projection. Games expertly hack these instincts. The "wrong to the character" feeling is your moral intuition correctly flagging that *acting* on certain impulses, even in simulation, has consequences *for the actor* and potentially the social context. The characters don't suffer, but *you* engage in an act that, if replicated or internalized in the real world, *would* cause suffering. That rehearsal, or that betrayal of your own capacity for care, is the core of the discomfort. Your gut is protecting *you* and *your relationships with real people*.
