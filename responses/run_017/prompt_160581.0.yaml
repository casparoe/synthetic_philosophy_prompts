  I'll structure the definition carefully: it must mention what varies (mind-count) and what stays fixed (physical process). The nearest concepts would be mereological vagueness (shares the boundary ambiguity, but differs by being computational), continuum problem (similar scalar shift issue, but different domain), and token identity theories (overlaps in physical invariance, but diverges on what's being counted).

