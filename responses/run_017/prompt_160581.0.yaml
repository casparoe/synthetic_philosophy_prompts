  The disambiguator must sharply differentiate from nearest concepts: "Applies specifically to counting conscious subjects within fixed computational processes based on descriptive granularity choices."

  For the bookkeeping verdict: The slide isn't fatal; a sensible view could adopt consistent counting rules (e.g., functional integration level), but it exposes that moral weight can't naively map to subject-count. This is crucial for their ethical concerns.

  Confidence is low for an existing name—I'd search computational mereology or moral granularity literature. The user needs actionable terminology, so coining a precise phrase serves them best.

  Finally, the JSON must hit all requested fields exactly. Keep the prose under 600 words while packing in conceptual depth.
answer: |-
  Your frustration targets a core problem in computational theories of mind: **subjective granularity of computation**. Here's the breakdown:

  **The Phenomenon:** Identical physical/computational processes (voltages, weights, state transitions) are described as containing different numbers of mind-like subjects based solely on arbitrary choices in descriptive scale (lumping vs. splitting subsystems) or narrative framing (copying vs. branching), leading to unstable moral accounting.

  **Analysis & Naming:**
  *   Your three cases *are* the same core issue: varying the "mind-count" for a fixed computational process based on descriptive choices.
  *   No established term precisely captures this. The nearest fit is "mereological vagueness" (vagueness in part-whole relationships), but it's usually applied to physical objects, not abstract computational subjects.
  *   Coined term: **Subjective Granularity of Computation (SGC)**
      *   **Definition:** The phenomenon where the number of distinct conscious subjects attributed to a fixed computational process varies solely based on the chosen descriptive granularity or framing, without any change in the underlying physical implementation or state transitions.
      *   **Status:** `unnamed`
      *   **Disambiguator:** `Applies specifically to the assignment of distinct *counts of conscious subjects* within fixed computational processes based on arbitrary descriptive choices of scale or narrative.`

