  Standardization Accounting (SA) is largely correct for cyclic, single-temperature demons using equilibrium resources. The cap arises from thermodynamic costs in preparing standardized states ("debt at standardization"), not solely erasure. Fluctuation theorems *describe* failure but don’t *explain* the mechanism; SA provides this via information constraints.

  **Decomposition (weights sum to 1):**  
  1. **kT ln 2 floor without assuming second law?** (Weight: 0.3)  
