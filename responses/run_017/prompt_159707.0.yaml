  We'll do:
  - Initialize: `aspiration = initial_aspiration` (e.g., 0.9)
  - `decay_rate` (e.g., 0.95) for lowering the aspiration after each failure.
  - `timeout` as the maximum number of candidates (due to latency budget).

  ```
  def satisficing_policy(initial_aspiration, decay_rate, timeout):
      aspiration = initial_aspiration
      best_candidate = None
      best_score = -infinity
