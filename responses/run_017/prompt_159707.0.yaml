  ```

  Note: This policy may return the first candidate that meets the current aspiration, which may not be the best overall. But we also track the best candidate and return it if we time out.

  #### Policy 2: Bounded-Optimal Policy
  - We train a policy within the set of policies that never exceed the timeout (the compute budget). We assume we have a training set of problems (each problem is a stream of candidates and their scores). We choose a policy from a predefined class (e.g., a threshold that may be a function of time, or a neural network) that maximizes the expected score (or pass-rate) on the training set.

  But note: without a prior, we cannot know the future. So we can design a policy that uses the information so far to decide.

  One bounded-optimal policy might be: at each step, decide whether to stop or continue by comparing the expected improvement from continuing (which we learn from data) against the cost (which is the time, but we are constrained by timeout). However, without a model, we might use a rule learned from data.

  Alternatively, we can do:

  We precompute a policy that, at each step (given the current best score and the time left), either stops or continues. We can use dynamic programming if we have a model of the candidate distribution. But we don't. So we might use a trained threshold function.

  For simplicity, we design a policy that uses a threshold curve: a function that gives the threshold for stopping at step i (given we have generated i candidates). We set the threshold curve by training on historical data to maximize the expected score without exceeding the timeout.

  In pseudocode, we precompute a list of thresholds: `threshold[i]` for i=0 to timeout-1.

  ```
  def bounded_optimal_policy(thresholds, timeout):
      best_candidate = None
      best_score = -infinity
      for i in range(timeout):
          candidate, score = generate_candidate()
