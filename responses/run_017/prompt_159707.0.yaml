  - **Where our framework is too thin**:
      - We lack a model of the candidate stream (distribution, dependencies) and the true quality (we only have a gameable proxy). Without these, we cannot formally define an optimal policy.
      - We don't have a prior, so we cannot compute reservation values or set optimal fixed thresholds without training data.
