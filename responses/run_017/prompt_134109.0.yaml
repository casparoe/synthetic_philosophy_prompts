prompt: |-
  I've somehow ended up with the training slot for our new pricing analysts — small specialty insurer, we underwrite gig-economy couriers (e-bikes, mopeds, the occasional car), room of about fifteen, most of them have had exactly one applied stats class and they all talk as if a probability is a property of a single case, the way a weight is. I've got 75 minutes and I want to spend it on the reference class problem. Don't explain the problem to me, I've done enough reading on it; I want the plan for the explanation.

  The order is what I keep going back and forth on. My instinct is to open by making them each commit to a number for one named applicant — what's the chance this person has an at-fault claim in the next year — write the numbers on the board, and only then show that the number moves when nothing about the applicant changes and no new evidence arrives, only the description of her. Is that the right entry point, or does something have to be in place before that even stings? And where in the sequence do the three things the problem can mean get separated: which class's frequency *is* the probability, which class's frequency should inform the number we act on, and the it-just-depends-what-question-you're-asking move that dissolves the whole thing? I'm fairly sure that last one has to be earned rather than granted, and I don't know whether it belongs at the end or whether it should be floated early and then made to fail.

  The carrying example is where I'm stuck. My candidate: one applicant, 24, delivers by e-bike in a dense city, 30 hours a week, one prior at-fault collision, top-decile on our telematics safety score. Classes I can put her in — 24-year-old riders, urban e-bike couriers, riders with a prior claim, top-decile telematics scorers — all non-gerrymandered, all with rates I can quote, differing by a factor of several, and none of them is a subset of another. Does that work? It might not: every one of those classes is a feature sitting in our database, so I'm terrified someone will just say condition on all of it, fit a model, done — and the session deflates into a complaint about regression. So: what does the example have to have, and what does it have to lack, so that move isn't available? Should the classes be nested or cross-cutting, should the rates differ wildly or only a little, and should there be a decision with money attached to it or does that muddy things?

  Misconceptions — I'm guessing: that there's a true reference class out there and we're just short of data; that this is base-rate neglect again (it's almost the inverse, isn't it?); that it's Simpson's paradox in a hat; that more data fixes it; that the fix is use the narrowest class you can describe; and that if the number is reference-class-relative then anything goes. Tell me which of those I've got wrong, where in the sequence each one has to be headed off, and which ones are specific to an audience that prices things for a living and will want a rate at the end.

  Two wrenches I want placed. One: the narrowest class you can describe eventually contains just her, and the frequency there is 0 or 1 — where does that go, and is it the natural bridge to why you can't always condition on everything? Two: we have a real bad habit here of re-slicing a book with segments like couriers who claimed in their first 60 days, which is picking the class after you've seen the outcome. I want that in, but I can't tell if it's the same lesson or a different one wearing the same clothes.

  Also: if I make one of the classes her age or her gender it turns into a compliance argument about what we're allowed to use. Do I keep that out of the carrying example and bring it in at the end, or is that version the one they actually need? And give me the order I should reveal the numbers in — do I show all the class rates up front or make them commit first?

  At the end I need one thing to have them *do* that separates getting it from having learned the phrase it depends on the reference class. And tell me what I should explicitly refuse to cover in 75 minutes and say out loud that I'm refusing it.
reasoning: |-
  Okay, let's tackle this pricing analyst training plan. The user is dealing with a team of about fifteen analysts at a specialty insurer for gig-economy couriers. These analysts have basic stats knowledge but tend to view probability as a fixed property of an individual case. The user has 75 minutes to address the reference class problem and wants a structured plan for explaining it without covering the basics.

  First, the user's instinct is to start with individual probability estimates for a named applicant, then show how the probability changes based on different reference classes. That seems solid because it creates cognitive dissonance upfront. The analysts commit to a number, then see it shift without new evidence—just by changing the class. That should make the problem tangible right away.

  Next, the order of separating the three meanings of the problem: which class's frequency is the probability, which should inform action, and the "it depends" perspective. The user thinks the last one needs to be earned. Starting with the individual estimate highlights the confusion between single-case probability and frequency. Then, after showing different rates from various classes, discussing why each might be considered "the" probability reveals the first meaning. The second meaning (which to act on) comes next, leading to the conflict. Finally, introducing "it depends" as a resolution after the tension is felt makes sense.

  For the carrying example, the user's candidate has multiple non-nested classes: age, vehicle type, location, prior claim, telematics score. The concern is that someone might say to condition on all factors using a model. To prevent that, the example must lack a unique combination in the data. Maybe the applicant has a rare trait combo not well-represented. The classes should be cross-cutting with significantly differing rates (e.g., 1% vs 5%), making the choice impactful. Including a monetary decision, like setting a premium, adds stakes but might muddy the waters. Perhaps present the decision after discussing the classes to keep focus on the reference selection first.

  Addressing misconceptions:
  - True reference class: Emphasize that no single "true" class exists; it's a conceptual issue, not data limitation.
  - Base-rate neglect vs. inverse: Clarify this isn't ignoring base rates but struggling to choose which one applies. They're similar but distinct.
  - Simpson's paradox: Not the same; reference class is about choosing the group, Simpson's is about reversal when aggregating.
  - More data: Won't solve the fundamental choice of reference class.
  - Narrowest class: Explain the problem of singleton classes (0 or 1 frequency) and why it's unhelpful.
  - Anything goes: Highlight that while context-dependent, decisions must be justified and methodical.

  The "narrowest class" point should come after showing the problem with multiple classes. When analysts suggest using the most specific group, introduce the singleton issue to show its impracticality. This bridges to why conditioning on everything isn't always possible—data sparsity.

  The wrench about re-slicing post-outcome (like couriers who claimed in 60 days) is a separate but related issue. It's data dredging or cherry-picking. Address it after the main problem, showing how improper class selection after knowing outcomes invalidates the rate.

  For demographic factors like age or gender: Avoid in the main example to prevent compliance distractions. Use neutral factors first, then introduce demographics later to discuss legal constraints as a separate layer.

  Sequence and reveals:
  1. Start with individual estimates for the named applicant; collect and display numbers.
  2. Reveal conflicting class rates one by one, showing how each changes the probability.
  3. Discuss why each class could be seen as "the" probability.
  4. Introduce the decision aspect: setting a premium based on a chosen class.
  5. Highlight the dilemma: which class to use?
  6. Bring up the singleton issue to counter "narrowest class" instinct.
  7. Explain the "it depends" resolution based on the decision context.
  8. Introduce the post-outcome class selection as a separate pitfall.
  9. End with an activity: Have them choose a reference class for a new case and justify it, considering the business question.

  Explicitly refuse to cover model specification or technical solutions like Bayesian methods, emphasizing that the session focuses on the conceptual choice of reference classes.

  This approach should make the reference class problem tangible, address misconceptions, and provide practical takeaways without getting bogged down in technicalities.
answer: |-
  Here's a battle-tested 75-minute plan focused on creating cognitive dissonance, separating the three meanings, and forcing engagement with the core problem. The structure deliberately builds tension before resolution.

  **Core Objective:** Make them viscerally feel the problem *before* naming it. Force them to confront that "the probability" isn't a property of the *case* alone, but of the *case+question+action*.

  **Order & Sequence (The Critical Path):**

  1.  **Hook & Personal Commitment (15 mins):**
      *   **DO:** Present "Elena" (24yo, e-bike courier, dense city, 30h/wk, **one prior at-fault claim**, **top-decile telematics score**). Be vivid. "This is a real applicant profile."
      *   **ASK:** "Independently, write down: *What is the probability Elena has an at-fault claim in the next 12 months?* Give me a single percentage. Think like an underwriter setting her premium *right now* based *only* on this info. No discussion."
      *   **DO:** Collect numbers anonymously (use sticky notes, quick poll tool). Write the range (e.g., 8% to 25%) visibly on the board. Highlight the variation. *"Hmm... interesting spread for one person."* **DO NOT** reveal class rates yet. The discomfort starts *here*.

  2.  **Reveal the Classes & Rates - The Hammer (20 mins):**
      *   **DO:** Reveal Elena's placement in multiple *valid, non-gerrymandered* reference classes one-by-one, with their *actual historical claim frequencies*:
          1.  "All Insured Urban E-Bike Couriers (Age 18-30)": **3.5%**
          2.  "Couriers Aged 24": **5.8%** (Higher! Youthful risk)
          3.  "Couriers with Exactly 1 Prior At-Fault Claim": **9.2%** (Significantly higher! Prior claims predict future claims)
          4.  "Couriers with Top-Decile Telematics Safety Score": **1.8%** (Much lower! Telematics works)
      *   **KEY POINTS:** Emphasize these are *real, non-overlapping in a simple way* (cross-cutting), *non-nested*, based on *features we use/collect*, and their rates *differ wildly* (3.5% to 9.2% is >2.5x). **Crucially, state:** "Nothing changed about Elena. We just described her in different ways using information we *already had*."
      *   **ASK:** "Look at your initial estimate. Which of these numbers is closest to yours? Which one feels most 'right' for Elena *right now*? Why?" (Brief discussion - expect conflict). **ASK:** "Is Elena's probability 3.5%, 5.8%, 9.2%, or 1.8%? Can they *all* be 'her probability'?" Force the contradiction.

  3.  **Name the Problem & Separate the Meanings (15 mins):**
      *   **STATE:** "This is the **Reference Class Problem**. We have multiple legitimate ways to group Elena, leading to very different 'base rates'. Which one is *the* probability for *this single case*?"
      *   **SEPARATE THE THREE THINGS EXPLICITLY:**
          1.  **Which frequency *is* the probability?** (The Illusion): "We instinctively want one number to be *her* inherent risk property, like weight. But these frequencies are properties of the *groups*, not inherent to Elena alone. There is no single 'true' reference class frequency that *is* her probability." **KILL:** The "true class/just need more data" misconception here. More data gives better *group* rates, but doesn't solve *which group* defines *this* case.
          2.  **Which frequency should inform the number we *act* on?** (The Practical Dilemma): "For pricing, we *need* a number to set her premium. Which group's rate should drive that? The most relevant? The narrowest? The safest? Why?" **INTRODUCE THE DECISION:** "If we price her at the 1.8% group rate, we might undercharge risk. Price her at 9.2%, we might lose the business. This matters!"
          3.  **"It just depends..." - Earning the Resolution (The Contextual Answer):** "The 'it depends' isn't a cop-out; it's the key insight. The *best* reference class depends on the **specific question you're asking** and the **action you're taking**." *Example:* "If we're assessing overall portfolio risk for e-bike couriers? Maybe the 3.5% group. If we're setting *her individual premium* based on *predictive* factors? Maybe the 9.2% (prior claim) or 1.8% (telematics) groups are more relevant predictors *for her*, or a combination."

  4.  **Throwing Wrenches & Addressing Misconceptions (15 mins):**
      *   **Wrench 1: The Singleton Trap (Narrowest Class Fallacy):** "Someone might say: 'Use the narrowest relevant class!' Okay... Let's try: '24-year-old urban e-bike couriers with exactly one prior claim *and* top-decile telematics'. How much data do we have on *that* exact group? Maybe 5 people? Last year, 0 claims. Is her probability 0%? That's absurd. Why? Because the group is too small – the frequency is meaningless (high variance). This is why we *can't always condition on everything* – data sparsity makes the narrowest possible class useless. We *have* to choose a broader, stable class or use modeling (acknowledge it, then defer - see refusal below)."
      *   **Wrench 2: The Outcome-Slicing Sin:** "Now, imagine we look back in 6 months. Elena has a claim. Someone says, 'Aha! We should have used the group *Couriers who claimed within 6 months of a prior claim*!' Their rate? Probably 100% in our tiny data slice. Is *that* her probability *before* the claim? **NO!** This is cherry-picking *after the fact* (data dredging). It uses knowledge of the *outcome* to define the class, making the 'rate' meaningless for *prediction*. It's a different sin: confusing explanation with prediction, violating temporal order. It feels similar because it abuses reference classes, but the cause is different." **KILL:** "More data fixes it" (it enables *this* sin!) & "Anything goes" (this shows why arbitrary classes are invalid).
      *   **Address Other Misconceptions:**
          *   **Base-Rate Neglect (Inverse):** "This isn't *ignoring* a base rate; it's having *too many plausible base rates* to choose from! It's the opposite problem."
          *   **Simpson's Paradox:** "Similar flavor (grouping matters), but different. Simpson's shows aggregated data reversing direction; here, different groupings give different directions/magnitudes *for the same prediction*."
          *   **"Anything Goes":** "No. Valid classes must be *causally relevant* or *strongly predictive*, *defined before the outcome*, and have *sufficient data*. 'People named Elena' fails. Our classes (age, prior claim, telematics) pass."

  5.  **The "DO" Activity - Applying Context (5 mins):**
      *   **TASK:** Split into pairs. Give a *new* brief courier profile (different mix of features). **ASK:** "You need to set their initial premium *today*. **Choose *one* reference class rate from this list (provide 3-4 options with rates) to base it on. **Justify your choice.** What question are you answering (individual risk vs. portfolio)? What action are you taking (pricing)? Why is *that* class the most relevant *for this purpose*?"
      *   **Why it works:** Forces them to move beyond "the probability" to "the probability *for this decision*". The justification reveals if they grasp the contextual nature.

  6.  **Demographics & Compliance (Briefly, at the End - 3 mins):**
      *   **SAY:** "Notice we used age, prior claims, telematics, vehicle, location. We *didn't* use gender. Why? Because even if the data shows a difference, using gender might be illegal/unethical/unfair. The *reference class problem* still exists – we'd have multiple rates – but the *choice* of which classes are *allowed* is constrained by regulation and ethics. The *problem* is conceptual; the *solution* has practical and legal boundaries. Today was about the core conceptual problem." Keep it separate to avoid derailing the core logic.

  7.  **Explicit Refusal (2 mins):**
      *   **STATE CLEARLY:** "In 75 minutes, we focused on the *conceptual heart* of the reference class problem: the lack of a single 'true' probability for a single case. We **did not cover**: How to *build* the best predictive model (GLMs, GAMs, ML) that *combines* factors. We **did not cover**: How to technically handle data sparsity or smoothing techniques (credibility theory, Bayesian priors). We **did not cover**: The full compliance/ethics framework for variable selection. Those are critical next steps, but today was about understanding this fundamental pitfall *before* you build those models or set those rules. If your model uses reference classes implicitly (segments), this problem lives inside it!"

  **Why This Order Works:**

  1.  **Starts with Intuition (Commitment):** Leverages their existing "probability as property" mindset. The variation shocks them.
  2.  **Creates Tension Before Naming:** Revealing conflicting rates *after* personal commitment makes the problem undeniable and personal. The "sting" is maximized.
  3.  **Separates Meanings Sequentially:** Builds logically from the illusion (1) through the dilemma (2) to the earned resolution (3). "It depends" only lands *after* they feel the pain of (1) and (2).
  4.  **Wrenches at Peak Tension:** The singleton trap hits *when* they reach for "narrowest class" as a solution. Outcome-slicing shows a *different* pitfall arising from misapplying frequencies.
  5.  **Activity Applies Context:** Forces translation of "it depends" to a *decision* context *after* the problem is dissected.
  6.  **Demographics Delayed:** Avoids derailing the core conceptual argument with compliance talk until the end.
  7.  **Clear Refusal:** Manages expectations and prevents the session collapsing into a regression debate. Acknowledges complexity exists but stakes the claim for the core concept.

  **Your Carrying Example - Critical Tweaks:**

  *   **It's Perfect, BUT:** Add: "...and crucially, **we have no historical data** on couriers *combining* all these exact traits (24yo + e-bike + urban + 1 prior claim + top-decile telematics) in sufficient volume for a stable rate." This blocks the "just condition on everything" objection preemptively. *Say this explicitly when revealing the classes.*
  *   **Cross-Cutting > Nested:** Cross-cutting (as you have) is better. Nested can imply a hierarchy leading to the "narrowest" fallacy. Cross-cutting forces the choice.
  *   **Wildly Differing Rates:** Essential. 1.8% vs 9.2% creates impactful tension. Small differences are ignorable.
  *   **Decision Context:** YES! Frame the initial ask ("set premium") and the activity around it. It forces the shift from "what *is* it" to "what *should we use* for *this*".

  **Key Misconceptions Addressed & When:**

  *   **"True Class / Just Need Data":** Killed in Step 3 when separating meaning 1.
  *   **"Base-Rate Neglect (Inverse)":** Clarified in Step 4 (Wrenches/Misconceptions).
  *   **"Simpson's Paradox":** Distinguished in Step 4 (briefly).
  *   **"More Data Fixes It":** Killed by Singleton Trap (Step 4) and Outcome-Slicing (Step 4).
  *   **"Use Narrowest Class":** Directly countered by Singleton Trap (Step 4).
  *   **"Anything Goes":** Killed by Outcome-Slicing (Step 4) and emphasizing valid class criteria (predictive, pre-defined, sufficient data - Step 4 & Activity).

  **Revealing Numbers:**

  *   **Commit FIRST (Individual):** Essential for creating the initial dissonance.
  *   **Reveal Class Rates SECOND:** One-by-one to build the tension and show the conflict explicitly. Don't show them all at once.

  **The "DO" Activity - Recap:**

  *   **What:** Choose & Justify a Reference Class for Pricing a *New* Case.
  *   **Why:** Separates understanding the problem ("it depends") from just knowing the term. Forces application of the contextual resolution ("for this decision...").

  **Explicit Refusals (Say These):**

  *   "We are **not covering** how to build predictive models today (GLMs, ML, etc.)."
  *   "We are **not covering** technical solutions to data sparsity (credibility theory, Bayesian smoothing)."
  *   "We are **not covering** the full compliance/ethics rules for variable selection (though we note they constrain choices)."
  *   **Reason:** "These are vital, but today's goal is to deeply understand this *core conceptual problem* that underlies all risk assessment, so you can approach those techniques with clearer eyes."

  This plan respects their applied stats level, leverages their professional context (pricing), maximizes engagement through dissonance, and provides a clear, actionable (if unsettling) takeaway: **Probability for a single case isn't a fixed property; it's a tool chosen based on the question and the action, grounded in a valid reference class.** Good luck!
