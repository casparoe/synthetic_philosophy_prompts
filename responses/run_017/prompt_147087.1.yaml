prompt: |-
  My roommate and I got into an argument the other night about whether suffering-focused ethics is even a real research program or just utilitarianism with the sign flipped, and while I think she's wrong about that, it did make me realize I have no idea where the actual work in it is. Context: I'm helping a small funder put together a call for proposals — something like six philosophers for two years, conceptual work only, no data collection, no new empirical stuff about wild-animal welfare or anything like that — and the point isn't to win converts to negative utilitarianism, it's to figure out which questions, once answered, would most change what a suffering-focused community should actually do with its time and money. Also most of the people who'd apply come out of the longtermist end of things, so I want to know which crux, if it went the other way, should push the whole portfolio toward near-term work instead. So: a defended agenda, not a survey of the literature, and definitely not a reading list.

  Here's my own stab at the candidate questions, but please add ones I'm missing and tell me if I've drawn the boundaries wrong. (a) Whether suffering takes lexical priority over happiness at every intensity or only above some threshold — and whether a thresholds version even deserves the name. (b) Whether the standard population-ethics asymmetry that negative views lean on — reason not to create suffering lives, no symmetric reason to create happy ones — survives once you drop person-affecting restrictions, or quietly collapses into something you can't use. (c) How to count suffering in minds whose sentience we're only uncertain about: is that just expected value with a credence multiplier, or does being unsure whether there's a subject there at all do something structurally different? (d) Whether a view that treats the painless removal of a sufferer as a way of reducing suffering has a genuine reductio available against it, or whether critics have been over-reading that implication for decades. (e) Whether suffering-focused axiology should be specified over quantities we could in principle measure or over something mind-independent, given that most of the world's suffering by headcount is in animals we can barely observe. My roommate also floated a homebrew view she calls "threshold lexicality with credence-discounted uncertain suffering" — suffering above some intensity counts lexically, and suffering in possibly-sentient minds enters discounted by credence rather than as its own expectation term — and I want to know where something like that lands.

  What I actually want is a ranking. Tell me which questions are upstream of which, in the sense that answering one changes what the others even ask; which are realistically tractable in two years by people with logic and decision theory and no lab; which are neglected relative to how much hangs on them; and which you'd defund outright, either because the answer wouldn't change anyone's practice or because they're really empirical questions wearing a philosophical costume. For each, say what kind of result over the next two years would move it up or down your list. Give me exactly six numbered items, each no more than three sentences, no intro and no conclusion: five ranked priorities, plus a sixth on what you'd cut and why.
reasoning: |-
  Okay, the user is helping a small funder create a call for proposals for conceptual philosophical work on suffering-focused ethics. They need six prioritized research questions that, once answered, would significantly influence how suffering-focused communities allocate resources. The user also wants to know which crux could shift the portfolio toward near-term work.

  First, I need to understand the core requirements. The research must be conceptual—no empirical work. The funder wants questions that, when answered, would most change what the community does with time and money. The applicants are likely from longtermist backgrounds, so identifying a crux that could push toward near-term work is crucial. The user provided five candidate questions (a-e) and mentioned their roommate's view.

  Looking at the user's questions:  
  (a) Lexical priority thresholds—whether suffering always outweighs happiness or only above a certain intensity.  
  (b) Population ethics asymmetry without person-affecting views—does it collapse?  
  (c) Counting suffering in uncertain sentience—expected value or something else?  
  (d) Painless elimination of sufferers—reductio or not?  
  (e) Axiology based on measurable vs. mind-independent suffering, especially in animals.  
  The roommate's view combines threshold lexicality with credence-discounted uncertain suffering.

  Now, I need to prioritize these. The user wants a ranking based on upstream influence, tractability, neglect, and potential impact. Also, one question to cut. The answers should be concise: six items, each no more than three sentences.

  First, the most upstream question. (b) seems critical because if the asymmetry collapses without person-affecting restrictions, it undermines the foundation of suffering-focused ethics. This could drastically alter priorities, making it top priority. It's tractable with decision theory and logic, though underdiscussed outside certain circles.

  Next, (c) about uncertain sentience. This affects wild animal welfare and AI risk—major funding areas. If credence discounting is invalid, it could shift resources significantly. It's tractable with decision theory and neglected relative to its importance.

  Then, (a) lexical thresholds. If thresholds are necessary, it changes prioritization of different sufferings. Roommate's view fits here. This is core to defining suffering-focused ethics and tractable.

  (d) painless elimination. While important for axiology, it might not change practical actions much, as the community already avoids such policies. It's more theoretical. So, lower priority but still included.

  (e) measurability vs. mind-independence. This seems more empirical. Philosophers can't resolve how to measure animal suffering without data. So, this might be the one to cut.

  For the crux for near-term shift: (b) is key. If asymmetry collapses, longtermist suffering focus weakens, pushing toward near-term work.

  Ranking:  
  1. (b) - upstream, foundational.  
  2. (c) - high impact on resource allocation.  
  3. (a) - defines the ethics system.  
  4. (d) - lower practical impact.  
  5. Roommate's view as part of (a).  
  Cut (e) as empirical.  

  Ensure each item is no more than three sentences. The sixth item is what to cut. Also, note what result would move them up/down.
answer: |-
  1. **Priority 1: Population ethics asymmetry collapse risk (your b)**  
     This is maximally upstream: if the asymmetry (no duty to create happy lives, but duty to avoid suffering) collapses without person-affecting views, it undermines core justifications for suffering-focused prioritization. Answering it requires pure decision theory/logic (e.g., testing if "avoiding suffering" reduces to classical utilitarianism under impersonalism) and would radically redirect the entire portfolio—e.g., a collapse finding forces near-term shifts, as longtermist suffering-reduction relies heavily on this asymmetry. Neglected in mainstream ethics; a formal proof of collapse/non-collapse in 2 years would cement its rank.  

  2. **Priority 2: Uncertain sentience accounting (your c)**  
     Directly upstream for resource allocation: if credence-discounting fails (e.g., uncertainty implies moral patienthood isn't scalar), it demands reevaluating wild-animal/AI-sentience funding, potentially moving resources to observable suffering. Highly tractable with decision/game theory (e.g., modeling "subjective thresholds" vs. expected value) and neglected relative to stakes. A result showing structural non-additivity (e.g., suffering exists iff consciousness does) would elevate it; conversely, if it reduces cleanly to EV, it drops.  

  3. **Priority 3: Lexical threshold existence and scope (your a, including roommate's view)**  
     Downstream of asymmetry but defines practical targets: if lexicality requires intensity thresholds (e.g., only extreme suffering outweighs happiness), it focuses interventions on factory farms/torture over mild suffering. The roommate's "threshold lexicality + credence discounting" fits here—resolving its coherence (e.g., whether thresholds avoid lexicality's paradoxes) is tractable via axiology/logic. Neglected in utilitarian debates; a formal disproof of threshold-based lexicality would downgrade it, while validation would prioritize intensity-specific work.  

  4. **Priority 4: Painless elimination reducibility (your d)**  
     Downstream of axiology: if the "reductio" (e.g., justifying killing sufferers) is unsound, it clarifies whether suffering-focused ethics must reject extinction-risk reduction (if it reduces suffering). Tractability is high (conceptual analysis of "reduction" vs. "elimination"), but low neglect—the debate is mature. A novel dissolution of the reductio (e.g., via non-identity problems) would boost it; if it reaffirms classical critiques, it's less urgent.  

  5. **Priority 5: Integration of roommate's "threshold-lexicality + credence discounting"**  
     A hybrid of (a) and (c): if coherent, it offers a practical framework for prioritization (e.g., discounting uncertain insect suffering below a pain-threshold). Tractability is moderate (testing for hidden contradictions via decision theory), but highly neglected. Moves up if it resolves clashes between (a) and (c); down if it inherits both problems.  

  6. **Defund: Measurability vs. mind-independence (your e)**  
     Cut because it's an empirical question disguised as philosophy: determining "how to count" unobservable suffering (e.g., in animals) requires data on consciousness/neuroscience, not pure logic. Even if answered, it wouldn't change practice—suffering-focused actors already assume measurability proxies. Resources here are better spent on (b) or (c).
