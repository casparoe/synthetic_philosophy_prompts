prompt: |-
  I'm on a tiny analytics team at a hospital system (four of us: one actual statistician, two clinicians, and me), and every quarter we put out comparisons — two surgical techniques for the same condition, readmission rates for two of our sites, a new discharge protocol against the old one, and ocasionally two named surgeons. Inevitably one of the numbers flips when you cut it by severity, or by age band, or by whether the patient came in through the ED, and then the meeting turns into the same argument every single time: whoever looks bad in the big table says the cut-up version is the real story, whoever looks bad in the cut-up version says the aggregate is what actually happened to actual patients. I want to write down a real procedure we can run each quarter instead of re-litigating this from scratch, and I want it to be honest about which parts are genuine judgment calls dressed up as method.

  What I have in mind is: an ordered list of questions to walk through the moment a reversal shows up, what counts as a good enough answer to each, where the procedure just stops with a "no" (report the aggregate, or refuse to cut at all), and where it hands the decision to a person because the question is really about values, or about what the committee actually wanted to know. A few specific things keep tripping us up and I'd want the procedure to say something about each. One: sometimes the variable we want to cut by is something that happened *after* the treatment started — whether they got admitted to ICU, how long they waited, whether they were discharged to a rehab facility — and my suspicion is that cutting by those is basically cheating, but I can never explain why in a way that lands with the clinicians. Two: the severity score is assigned by different people at the two sites, or it's continuous, and whether we cut it in half or into quartiles seems to decide whether the reversal shows up at all; also half our strata have like nine patients in them and I don't trust the reversal to be real rather than noise. Three: if we actually adopt the protocol, the case mix won't stay still, so the aggregate we computed on last year's mix presumably isn't a forecast of anything. Four, and this is the bit I keep coming back to: I think there are genuinely different questions hiding inside "which one is better" — better for the mix of patients we happened to see, better for a patient whose type we already know, better for a patient who walks in tomorrow and whose type nobody knows yet, and better as a rule we could actually implement, which might mean routing type-1 patients to A and type-2 to B, a thing neither "always A" nor "always B" captures at all — and I think those can have different right answers, so at some point the procedure has to stop and ask a human which question was meant. My friend who does A/B testing at a tech company says they never look at the aggregate at all, they always segment, which sounds wrong to me but I can't quite say why.

  So: can you write the procedure, then run it on three cases and show the output? Case one: technique A beats B on complications overall but B beats A within both the mild and the severe group, and the severe cases mostly went to B. Case two: our site has worse readmissions than the other site overall but better within every age band, and the two sites' intake nurses grade severity differently. Case three should be the one that's annoying for us: we've been reporting a stratified number for a discharge protocol for the last two quarters that makes our unit look fine, and the thing we cut by — whether the patient ended up in a step-down unit — I now think might be downstream of the protocol itself, so tell me whether the procedure says to drop that number and what we should have reported instead. Constraints: maybe half a day per report, spreadsheets and R, output gets read by clinicians who will tolerate the word confounder but whose eyes glaze over at anything more technical than that, and whatever it says I have to be able to defend it when a department chair accuses us of massaging the numbers. Also please say plainly what the procedure can't do — where it just doesn't have an answer.
reasoning: |-
  We are designing a procedure to handle Simpson's paradox and related issues in comparative analytics for a hospital system. The procedure must be:
  - Step-by-step, ordered questions.
  - Clear criteria for stopping or handing off to human judgment.
  - Addresses specific pain points (post-treatment variables, severity score issues, case mix changes, different interpretations of "better").
  - Defensible to clinicians and department chairs.

  The procedure will be structured as a decision tree. We'll define key terms simply:
  - **Aggregate**: The overall comparison without any stratification.
  - **Stratified**: Comparison within subgroups (e.g., by severity, age band).
  - **Reversal**: When the direction of the comparison flips between aggregate and stratified (or between different stratifications).

  We'll address the four specific issues as part of the steps.

  ### Procedure: Handling Reversals in Comparative Analytics

  1. **Check for Data Quality and Sample Size**
     - *Question*: Are the sample sizes in each subgroup (for the stratified analysis) and in the aggregate sufficient? (Rule of thumb: at least 10 events per group per stratum for binary outcomes, but adjust for context; for continuous outcomes, consider power.)
     - *Action*: 
       - If any stratum has too few patients (e.g., <10 events for the outcome of interest), then the stratified analysis is unreliable for that stratum. Do not use that stratum for decision-making. If multiple strata are small, then the entire stratified analysis may be unreliable.
       - If the aggregate sample is too small to trust (e.g., <30 per group), then the aggregate is also unreliable. Consider not reporting the comparison until more data is available.
     - *Stop and report*: If the data is too sparse, report the aggregate with a warning about imprecision, and note that stratification is not feasible due to sample size. Do not present unreliable stratified results.

  2. **Is the Stratifying Variable a Confounder?**
     - *Question*: Is the stratifying variable a potential confounder? (A confounder is a factor that is associated with both the treatment/exposure and the outcome.)
     - *How to check*:
       - The variable must be measured *before* the treatment (or at least not be a consequence of the treatment). If it is measured after treatment (e.g., ICU admission, discharge to rehab), then it is likely a mediator or collider, not a confounder. Adjusting for such variables can introduce bias (this is the "cheating" you suspect).
       - Example: If you are comparing two surgical techniques, the severity of the patient should be assessed before surgery. If the severity score is assigned after surgery, it might be influenced by the surgery itself.
     - *Action*:
       - If the variable is post-treatment, then do not use it for stratification. The stratified analysis is invalid for causal inference. Report the aggregate and note that the variable of interest is post-treatment and thus inappropriate for adjustment.
       - If the variable is pre-treatment, proceed to next step.

  3. **Assess Heterogeneity of Treatment Effect**
     - *Question*: Is the treatment effect meaningfully different across subgroups? (This is about interaction, not just reversal.)
     - *How to check*: 
       - Even without a reversal, if the effect sizes in subgroups are statistically different (using an interaction test) or clinically different (e.g., one subgroup has a large benefit and another has harm), then we need to consider reporting both aggregate and stratified.
       - However, if the reversal is present, then by definition the effects are different.
     - *Action*: 
       - If there is a reversal and the sample sizes are adequate (step 1) and the variable is pre-treatment (step 2), then we must consider whether the stratification is clinically meaningful and the variable is a confounder (step 4). 
       - If there is no reversal but the effects are heterogeneous, then we might still want to report stratified results (but without reversal, the aggregate is still valid as an average effect).

  4. **Is the Stratifying Variable a Confounder and Should We Adjust for It?**
     - *Question*: Is the stratifying variable a confounder that we must adjust for to get an unbiased estimate of the treatment effect?
     - *How to check*:
       - Draw a causal diagram (conceptually) or use domain knowledge: does the variable influence both the treatment assignment and the outcome?
       - Example: In comparing two surgical techniques, if sicker patients are more likely to get technique B, and sicker patients have worse outcomes, then severity is a confounder. Without adjustment, the aggregate comparison is biased.
     - *Action*:
       - If the variable is a confounder, then the stratified analysis (or a model that adjusts for the confounder) is the more appropriate estimate of the treatment effect. The aggregate is biased and should not be the primary result.
       - If the variable is not a confounder (e.g., it is a prognostic factor but not related to treatment assignment, or it is an effect modifier without being a confounder), then the aggregate might still be valid, but we must consider the heterogeneity (step 3) and the question of interest (step 5).

  5. **Clarify the Question of Interest**
     - *Question*: What is the actual question we are trying to answer? (This is where human judgment is needed.)
     - *Options*:
       - **Descriptive (What happened historically)**: The aggregate is the actual experience of the patients we saw. But if there was confounding, then the aggregate does not reflect the true effect of the treatment.
       - **Causal (What is the effect of the treatment, holding other factors constant)**: Requires adjusting for confounders (stratified or modeled).
       - **Predictive (What outcome can we expect for a future patient of a given type)**: Stratified by the patient's known characteristics.
       - **Decision (Should we implement a policy of always using A, always using B, or tailoring by patient characteristics)**: Requires knowing the effect in subgroups and the distribution of patient types in the future.
     - *Action*:
       - Present both aggregate and adjusted (if appropriate) results, but with an explanation of what each answers.
       - For decision-making, we need to know the future case mix. If the case mix is expected to change, then the aggregate from the past may not be predictive. We might need to simulate the effect of the policy on the future population.

  6. **Handling Differences in Measurement of Stratifying Variables**
     - *Question*: If the stratifying variable is measured differently between groups (e.g., severity scored by different nurses at two sites), can we still use it?
     - *Action*:
       - If the measurement is non-comparable, then the stratified analysis may be invalid because the groups are not actually comparable within strata. We might need to:
         - Harmonize the measurement (e.g., use a common training, or a standardized instrument) going forward.
         - Use a different variable that is measured consistently.
         - If harmonization is not possible, then we cannot use the variable for fair comparison. Report the aggregate and note the measurement issue.

  7. **Reporting the Results**
     - After walking through the above, decide on the primary result to report and what caveats to include.
     - *Options*:
       - Report the aggregate only (if stratification is not warranted or feasible).
       - Report the stratified only (if confounding is present and adjustment is necessary).
       - Report both, with clear explanations of what each represents and the limitations.
     - Always include:
       - Sample sizes per group and stratum.
       - Confidence intervals to show precision.
       - A statement about the limitations (e.g., "This stratified analysis has limited precision in the severe group due to small sample size" or "The severity score was assigned after treatment, so it may not be appropriate for adjustment").

  ### Applying the Procedure to Cases

  #### Case 1: Technique A vs B
  - **Overall**: A beats B (lower complications).
  - **Within mild and severe groups**: B beats A (lower complications).
  - **Severe cases mostly went to B**.

  *Steps*:
  1. **Sample size**: Check if strata have enough patients. Assume we have sufficient size in both mild and severe groups. Proceed.
  2. **Post-treatment variable?**: Severity is pre-treatment (assumed). Proceed.
  3. **Heterogeneity**: Reversal present -> we have heterogeneity.
  4. **Confounder?**: Severity is likely a confounder because it affects both treatment assignment (severe cases more likely to get B) and outcome (severe cases have more complications). Therefore, the aggregate is biased. The adjusted estimate (from stratified analysis) is more appropriate for the causal effect.
  5. **Question of interest**:
     - Descriptive: Aggregate says A had fewer complications overall. But this is because A got easier cases.
     - Causal: We want the effect of the technique. The stratified analysis (or a model adjusting for severity) shows that B is better for both mild and severe. So B is better for patients of either severity.
     - Predictive: For a patient of known severity, we can use the stratified result (B is better).
     - Decision: We might want to use B for everyone. But note: if we switch to B for everyone, the case mix might not change, but the outcome should improve. However, we must also consider if there are other unmeasured confounders.

  *Conclusion for Case 1*: Report the stratified result as the primary finding (B is better within each severity group). The aggregate is confounded and should not be used to compare the techniques. We might also report the aggregate as the historical experience but with a clear note about confounding.

  #### Case 2: Readmissions at Two Sites
  - **Overall**: Our site has worse readmissions.
  - **Within every age band**: Our site has better readmissions.
  - **Intake nurses grade severity differently at the two sites**.

  *Steps*:
  1. **Sample size**: Assume sufficient in age bands. Proceed.
  2. **Post-treatment?**: Age is pre-treatment (and fixed). Severity (if we consider it) is also pre-treatment? But note: we are told that severity is graded differently. We are not using severity in this analysis? The problem says we are cutting by age. But the issue of severity measurement differences is raised as a potential confounder? Actually, the reversal is by age, but we suspect that severity (which is measured differently) might be the real confounder.

     Actually, the case states: "the two sites' intake nurses grade severity differently". So we are not using severity for stratification? We are using age. But the reversal by age might be due to confounding by severity? So we must consider if age is the only confounder? Or is severity also a confounder?

     Let's reframe: The reversal by age (our site better in every age band but worse overall) suggests that our site sees older patients (who have higher readmission rates) and the other site sees younger. But the problem also says severity is measured differently. So we might have two issues: 
     - Confounding by age: which we adjusted for by stratifying by age.
     - But also, severity is a confounder that we haven't adjusted for, and it's measured differently.

     However, in the current analysis, we are only stratifying by age, and we see a reversal. So we have addressed step 4 for age: age is a confounder? Yes, because it affects both site assignment (older patients might go to our site) and outcome. So the aggregate is confounded by age, and the stratified result is more appropriate.

     But then why the concern about severity? Because the clinicians might argue that the severity is also a confounder and is measured differently. So we must check if the age-stratified analysis is still confounded by severity? 

     We add a step: 
     - After step 4, if there are other known confounders that are not adjusted for, then the current adjustment (by age) might not be sufficient.

     *Revised for Case 2*:

     4. **Confounder?**: 
        - Age is a confounder? Yes. So we adjust for it and get the stratified result (which shows our site is better in every age band). 
        - But we must also consider: is severity a confounder? And is it measured consistently? 
          - Severity is a confounder: it affects both site assignment (sicker patients might be sent to one site over the other) and outcome. 
          - However, if severity is measured differently, then we cannot adjust for it fairly. 

     *Action*: 
       - We must try to adjust for severity? But if we can't trust the measurement, then we cannot. 
       - We might do two analyses: 
          1. Adjusted for age (which we have) -> shows our site is better in each age band.
          2. Attempt to adjust for severity? But if the measurement is non-comparable, then we cannot. 

     So we have a problem: the age-adjusted result might still be confounded by severity. 

     *Step 6 (Handling differences in measurement)*: 
       - We note that severity is a confounder but measured non-comparably. Therefore, we cannot adjust for it. 
       - We must report the age-adjusted result but with a caveat: "The analysis adjusted for age, but there may be residual confounding by severity. Because severity was measured differently at the two sites, we were unable to adjust for it. Therefore, the results should be interpreted with caution."

     *Step 5 (Question of interest)*: 
       - If the question is descriptive (what happened to patients at each site), then the aggregate is the actual experience: our site had higher readmissions. 
       - If the question is causal (which site provides better care, holding patient characteristics constant), then we need to adjust for confounders (age and severity). Since we can't adjust for severity, we cannot give a definitive answer. 
       - Predictive: For a patient of a given age, our site has lower readmissions. But we don't know about severity.

     *Conclusion for Case 2*: 
       - Report both the aggregate and the age-stratified results, with clear caveats. 
       - The primary result for causal inference might be the age-adjusted result (using a model that adjusts for age, e.g., a regression or standardized rate) but with a strong warning about residual confounding by severity. 
       - Recommend harmonizing severity measurement going forward.

  #### Case 3: Discharge Protocol
  - We've been reporting a stratified number by whether the patient ended up in a step-down unit.
  - Now we suspect that step-down unit admission might be downstream of the protocol.

  *Steps*:
  1. **Sample size**: Assume adequate. Proceed.
  2. **Post-treatment variable?**: The stratifying variable is "ended up in a step-down unit". This is clearly after the discharge protocol (the treatment). Therefore, it is a post-treatment variable. 
     - *Action*: Do not use this variable for stratification because it is a mediator or collider. The stratified analysis is invalid for causal inference about the protocol.

  *So what should we have reported?*
  - We should not have reported the stratified result. 
  - Instead, we should have reported the aggregate (overall) effect of the protocol. 
  - But note: the aggregate might also be confounded by pre-treatment variables (e.g., patient severity). So we should adjust for pre-treatment confounders (like severity, age, etc.) but not for post-treatment variables.

  *Corrective Action*:
  - Go back and redo the analysis without stratifying by step-down unit. 
  - Adjust for pre-treatment confounders (if any) to get an unbiased estimate of the protocol effect. 
  - If we have been reporting only the stratified result, then we must correct the report and explain the error.

  *Conclusion for Case 3*: 
    The procedure says to drop the stratified number because the variable is post-treatment. We should have reported an aggregate (or adjusted for pre-treatment confounders) effect of the protocol. 

  ### What the Procedure Can't Do
  - It cannot resolve disputes about which variables are confounders without domain knowledge. That requires clinical input.
  - It cannot create comparability when measurements are non-comparable. We can only note the limitation.
  - It cannot predict the future case mix. For policy decisions, we must make assumptions about the future patient population.
  - It cannot handle unmeasured confounders. We can only adjust for what we have measured and is reliable.
  - When sample sizes are too small, we cannot provide precise estimates for subgroups.

  ### Final Procedure Document
  We'll write the procedure as a flowchart or checklist. But for the purpose of this response, we have outlined the steps.

  ### Defending the Procedure
  - It is based on established principles of causal inference (confounding, post-treatment bias) and statistical best practices (sample size considerations).
  - It is transparent about limitations and judgment calls (especially in step 5 and step 6).
  - It avoids "massaging" by having clear rules (e.g., not adjusting for post-treatment variables) and by making the process explicit.

  This procedure should help the team avoid re-litigating the same issues and provide a consistent framework.
answer: |-
  Below is a structured procedure for handling reversals (Simpson's paradox) in your quarterly comparisons. It follows an ordered checklist, specifies where to stop or escalate, and addresses your specific pain points (post-treatment variables, severity scores, case mix shifts, and clarifying the core question). The procedure is designed for transparency, defensibility, and clinical usability.

  ---

  ### **Procedure: Handling Reversals in Comparative Analytics**  
  **Goal**: Resolve "which number to trust" when aggregate and stratified results conflict, while flagging judgment calls.  
  **Time budget**: ≤4 hours per analysis (spreadsheets/R).  
  **Output**: A decision memo with:  
  - Primary metric (aggregate or stratified)  
  - Caveats ("judgment call" flags)  
  - Alternative metrics for context  
  - Sample size checks  
  - Plain-language explanation for clinicians  

  ---

  #### **Ordered Checklist**  
  *Run this the moment a reversal is spotted. Stop early if any "NO" is hit.*

  1. **"Is the stratifying variable measured BEFORE treatment/assignment?"**  
     - **Check**: Variable must be known at the time of treatment (e.g., severity at admission, age, ED arrival).  
     - **If NO (post-treatment)**:  
       - *Stop*. **Do not stratify**. Report aggregate only.  
       - *Why*: Stratifying by outcomes (e.g., ICU admission, step-down unit) introduces bias. These are downstream of treatment and distort causality.  
       - *Defense*: "Adjusting for events after treatment started can mask the real effect—like judging a surgery by whether the patient ended up in the ICU, which the surgery itself might cause."  
     - **If YES**: Proceed.  

  2. **"Do all strata have ≥20 patients AND ≥5 events per group?"**  
     - **Check**: Avoid noise. Use historical data to set thresholds (adjust for rare outcomes).  
     - **If NO**:  
       - *Stop*. **Report aggregate only**, with warning: "Stratified results unreliable due to small samples."  
     - **If YES**: Proceed.  

  3. **"Is the stratifying variable consistent AND clinically meaningful?"**  
     - **Check**:  
       - *Consistency*: Same scoring method across groups (e.g., severity scores calibrated between sites).  
       - *Meaning*: Variable is prognostic (e.g., age/severity predicts outcomes).  
     - **If NO** (e.g., severity scores differ by site):  
       - *Escalate to clinicians*: "Should we harmonize measurements or drop this variable?"  
       - *Default*: Report aggregate + note: "Variable not comparable; may bias subgroups."  
     - **If YES**: Proceed.  

  4. **"Is the reversal consistent across sensible categorizations?"**  
     - **Check**: Test if reversal persists with:  
       - Different cut points (e.g., severity quartiles vs. median split).  
       - Clinician-approved groups (e.g., "mild/moderate/severe").  
     - **If NO** (reversal disappears):  
       - *Stop*. **Report aggregate**. Likely a statistical artifact.  
     - **If YES** (reversal holds): Proceed to judgment call.  

  5. **"JUDGMENT CALL: Which question are we answering?"**  
     - *Escalate to the committee* with options:  
       - **A. "What happened to our actual patients?"** → Report **aggregate**.  
         - *Use when*: Accountability, billing, or resource allocation.  
         - *Caveat*: "This reflects our case mix; not a fair comparison of treatments/sites."  
       - **B. "Which is better for a specific patient type?"** → Report **stratified**.  
         - *Use when*: Treatment personalization (e.g., "Use Technique B for severe cases").  
       - **C. "What if we adopt this universally?"** → Requires **modeling**.  
         - *Use when*: Policy changes (e.g., new discharge protocol).  
         - *Action*: Standardize case mix (e.g., predict outcomes for last year's patients under both approaches).  

  ---

  ### **Applying the Procedure to Your Cases**  
  *Output format: Decision memo with explanation, caveats, and next steps.*

  #### **Case 1: Surgical Techniques (A vs. B)**  
  - **Context**: A better overall; B better in mild/severe groups; severe cases mostly got B.  
  - **Checklist**:  
    1. ✅ Severity measured pre-treatment.  
    2. ✅ Assume strata >20 patients.  
    3. ✅ Severity consistent/meaningful.  
    4. ✅ Reversal consistent across categorizations.  
    5. ⚠️ **Judgment call needed** (Question B vs. C).  
  - **Output**:  
    - **Primary metric**: **Stratified by severity** (B better for all patients when grouped by severity).  
    - **Caveats**:  
      - "Aggregate favors A only because B handled more severe cases."  
      - "For future patients, use B regardless of severity."  
    - **Plain-language summary**:  
      > "Technique B is safer for both mild and severe cases. The overall complication rate favored A because B was assigned tougher cases—but when we account for this, B is better. We recommend B for all future patients."  
  - **Why not aggregate?**: Confounding by severity (B got sicker patients).  

  #### **Case 2: Readmissions (Site A vs. Site B)**  
  - **Context**: Site A worse overall; better in every age band; severity scored differently.  
  - **Checklist**:  
    1. ✅ Age measured pre-treatment.  
    2. ✅ Assume sufficient sample size.  
    3. ❌ **Severity scoring inconsistent** between sites.  
       - *Action*: Escalate. Committee agrees: "Severity affects outcomes but isn’t comparable."  
    4. ⚠️ Reversal persists for age, but severity confounds.  
  - **Output**:  
    - **Primary metric**: **Aggregate readmissions** (Site A worse).  
    - **Caveats**:  
      - "Site A sees younger patients, who have lower readmissions—but our age-band adjustment may be biased because severity scoring differs."  
      - "Harmonize severity scoring before trusting subgroup results."  
    - **Plain-language summary**:  
      > "Overall, Site A has higher readmissions. While Site A does better within each age group, we can’t fully trust this because nurses rate severity differently at each site. Until we fix this, the overall number is safer."  
  - **Why not stratified?**: Unmeasured confounding (severity differences inflate Site A’s age-band results).  

  #### **Case 3: Discharge Protocol (Step-Down Unit Stratification)**  
  - **Context**: Stratified by "step-down unit admission"; now suspected post-treatment.  
  - **Checklist**:  
    1. ❌ **Step-down admission is POST-treatment** (occurs after discharge protocol starts).  
       - *Action*: Stop. Do not stratify.  
  - **Output**:  
    - **Primary metric**: **Aggregate outcome** (e.g., 30-day readmissions).  
    - **Caveats**:  
      - "Stratifying by step-down unit is invalid because the protocol itself affects whether a patient goes to step-down."  
      - "Report only aggregate until we identify a pre-treatment variable (e.g., initial severity)."  
    - **Corrective action**:  
      - Retrospectively report aggregate for past quarters.  
      - For future analyses: Use pre-treatment severity (if consistent) or age/comorbidities.  
    - **Plain-language summary**:  
      > "We can’t compare protocols based on whether patients went to step-down—because the protocol affects that outcome. We’ll now report overall readmission rates only."  

  ---

  ### **What the Procedure Can't Do**  
  1. **Fix bad data**: If severity scores are garbage, no analysis will help.  
  2. **Replace clinical judgment**: Choosing which variables matter (Step 3) or the core question (Step 5) requires committee input.  
  3. **Predict the future**: If case mix shifts (e.g., after protocol changes), aggregate past data won’t forecast outcomes. Modeling (Step 5C) is approximate.  
  4. **Handle unmeasured confounders**: E.g., if "social determinants" aren’t tracked, reversals may persist.  
  5. **Resolve "noise vs. signal" definitively**: Small strata (Step 2) force aggregate reporting, even if stratification feels right.  

  ### **Defense Tactics**  
  - **For department chairs**: "This follows epidemiologic standards: no post-treatment adjustments, no small subgroups, and explicit sign-offs on judgment calls."  
  - **For clinicians**: Focus on patient impact: "The stratified number tells us what works for severe cases; the aggregate tells us what happened in our hospital."  
  - **For your team**: Document every decision (especially Step 5). Use R scripts for reproducibility.  

  ### **Why Tech-Style Segmentation Isn't Enough**  
  Tech A/B tests often segment users (e.g., "iOS vs. Android") because:  
  - They have massive samples.  
  - Their goal is personalization ("better for this user type").  
  - Confounding is minimal (randomization handles it).  
  **In healthcare**:  
  - Small samples make segmentation noisy.  
  - Confounding is rampant (sicker patients get different care).  
  - The "right" answer depends on the question (Steps 4–5).  
  Aggregate isn’t always wrong—it answers "what happened." Stratified answers "what’s best for whom." Your procedure forces this distinction.  

  --- 
  **Final Tip**: Pilot this on 1–2 past quarrels to refine wording. The goal isn’t perfection—it’s replacing circular arguments with a documented, auditable process.
