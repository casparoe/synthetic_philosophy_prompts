  The user wants me to really dig into the core disagreements rather than producing superficial arguments. Key points I need to address include: distinguishing between hot memory (emotional) and cold memory (propositional); the "sleeping archive" scenario where records exist but aren't actively used; asymmetry in duties based on lineage; and the "memory budget" problem of finite attention resources.

  I should structure this as exactly five numbered items, each containing: concrete agreement points, residual disagreement stated fairly, the crucial sub-question that would resolve it, and a test case with both camps' predictions. The sleeping archive case must appear in at least two items. I also need to flag if any disagreement is merely verbal.

  Looking at the hot vs cold memory distinction - this seems fundamental. Remembrance camp likely demands hot memory while Amnesty camp accepts cold memory as sufficient. The sleeping archive perfectly tests this: Remembrance would see it as abandonment since no one engages emotionally, while Amnesty would accept it as custodianship since information is preserved. 

  For asymmetry, both camps probably agree duties differ between victim/perpetrator descendants, but disagree on whether this difference vanishes when last witnesses die. Remembrance would say duties intensify to compensate, Amnesty would say duties diminish as direct ties fade. 

  The memory budget point reveals their core priorities: Remembrance views attention allocation as moral obligation (forgetting=omission), Amnesty sees it as practical necessity (forgetting=decision). 

  I should also check if "remember" is being used differently - yes, Remembrance means affective engagement while Amnesty means cognitive preservation. That's worth one item clarifying the verbal dispute.

  For test cases: sleeping archive is perfect for item 1 (hot vs cold) and item 4 (asymmetry). For item 5 (memory budget), a monument relocation debate would work. 

  Each item needs to be razor-sharp: no fluff, no textbook platitudes. The agreement portions should be substantive enough for both to sign, while disagreement sections accurately represent each position. Crucially, every item must include a falsifiable test with opposing predictions.
answer: |-
  Here is the joint statement reflecting the core disagreement structure and your specifications:

  1.  **Agreement:** Both affirm that societies possess a moral interest in preserving accurate propositional knowledge of significant historical injustices. **Disagreement:** Whether this interest constitutes a *duty* binding on community members and institutions, distinct from mere prudence. **Crux:** Does the moral significance of the victims' experience impose an obligation *in perpetuity*? **Test (Sleeping Archive):** If an archive holds perfect, accessible records but generates zero civic engagement or affective resonance, Remembrance holds the duty is *not* met; Amnesty holds the duty (if any) *is* met via custodianship. Prediction: Remembrance - Duty unmet; Amnesty - Interest satisfied.

  2.  **Agreement:** Both acknowledge that "remembering" has distinct modes: **hot memory** (affectively charged, identity-shaping, motivating) and **cold memory** (archival, propositional, available for reference). **Disagreement:** Remembrance holds the duty requires cultivating *hot memory* (sustained affective connection); Amnesty holds *cold memory* (reliable factual preservation) is sufficient, arguing hot memory risks paralyzing pathology. **Crux:** Does justice for the past intrinsically demand an enduring *affective* response, or is institutionalized factual preservation the ethically defensible endpoint? **Test:** Analyze societal stability and reconciliation outcomes in cases prioritizing hot vs. cold memory over generations.

  3.  **Agreement:** Obligations related to historical injustice are asymmetric; descendants of victims and perpetrators do not stand in identical moral positions vis-à-vis the past. **Disagreement:** Whether this asymmetry entails *different duties to remember*. Remembrance argues descendants of perpetrators bear a stronger duty to actively sustain hot memory; Amnesty argues asymmetrical obligations concern *present justice* (e.g., reparations) but converge towards cold memory preservation over time. **Crux:** Does lineage create a distinct, enduring *duty of remembrance* beyond general societal preservation? **Test (Sleeping Archive + Asymmetry):** If only victim-descendant groups actively consult/maintain the archive emotionally, Remembrance holds the duty is partially met; Amnesty holds the societal duty (cold memory) is met regardless of *who* sustains it. Prediction: Remembrance - Partial fulfillment; Amnesty - Full fulfillment.

  4.  **Agreement:** The death of the last living witness constitutes a significant transition, altering the *nature* of memory from experiential to historical. **Disagreement:** Remembrance holds the duty to remember *intensifies* post-witnesses to prevent erasure; Amnesty holds the duty (if any) *diminishes* as direct relational ties fade, shifting focus to cold memory. **Crux:** Does the duty derive primarily from the *victims' need* (demanding perpetual affective response) or from the *living community's need* (demanding manageable integration)? **Test (Sleeping Archive):** Post-witnesses, the archive falls into permanent disuse but remains perfect. Remembrance: Duty fails (no active remembrance); Amnesty: Duty fulfilled (preservation secured). Prediction: Remembrance - Failure; Amnesty - Success.

  5.  **Agreement:** Public attention and commemorative resources are finite; choices about remembrance inevitably involve allocation. **Disagreement:** Remembrance views neglecting a specific injustice (absent cold preservation) as a *culpable omission* violating duty; Amnesty views prioritizing some memories over others as a necessary *political decision* for social health, where "forgetting" (shifting focus) is distinct from denial. **Crux:** Is the duty to remember best understood as a *perfect obligation* (binding specific acts of attention) or an *imperfect obligation* (satisfied by systemic preservation allowing for shifting focus)? **Test:** Examine resource allocation debates (e.g., monument relocation/funding shifts) – Remembrance sees omission/duty breach if hot memory for Core Injustice X diminishes; Amnesty sees legitimate prioritization if cold memory for X is secured. **Verbal Point:** Key conflict over "forgetting" – Amnesty defines it as shifting focus/affect away from hot memory *while preserving cold memory*; Remembrance often equates loss of hot memory with forgetting *as abandonment*.
