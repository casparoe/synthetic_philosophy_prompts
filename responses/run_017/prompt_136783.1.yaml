  What I'm after is a concrete example — an actual payoff matrix with numbers, 2x2 or 2x3 or whatever works, plus the two programs in short pseudocode — of a two-player one-shot game where there's a program equilibrium that Pareto-dominates the unique Nash equilibrium of the underlying game, but where the cooperative outcome is visibly lopsided: one player takes most of the gains from cooperation and the other goes along with it only because their fallback (everybody defects) is bad enough that even a raw deal beats it. So the point of the problem should be that program equilibrium doesn't hand you the *fair* split, and I'd also like you to say something about which splits of the cooperative surplus are sustainable in general (my hazy guess is: anything that leaves each player with at least what they'd get at mutual defection, so you get a kind of folk-theorem flavour, but I don't trust that and I want it stated properly). Keep it deterministic, please — no correlated randomness — and don't just re-do the symmetric case where both players walk away with the same payoff, that one's already on the slides.

