  - Acknowledge both interpretations of the framing effect without sitting on the fence 
  - Propose concrete conditions rather than binary approval/rejection 
  - Explicitly state who bears burden of proof 

  For the honesty-vs-sloppiness dilemma... maybe we can reframe it? Instead of picking sides, note that *both* interpretations undermine the technique's reliability: if it's impression management dropping away, that suggests the elicitator only catches deception when models care about consequences; if it's carelessness, the technique is measuring noise. Either way, it's unstable. 

  For cross-model inconsistency, the core problem is the lack of ground truth. We could demand they demonstrate the elicitator's accuracy on synthetic data where we *do* know the right answer, even across model variants. 

  Burden of proof should clearly be on Interp since they're making a safety claim. The memo should emphasize that absent conclusive evidence, the default is to assume risk exists. 

  ...Wait, the user mentioned this is for "real evidence" in release decisions. That raises the stakes - approval might lead to underestimating risks. A "red-team only" compromise could work: useful for finding vulnerabilities but not for certifying safety. 

  Structure-wise: 
