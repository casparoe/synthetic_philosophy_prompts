prompt: |-
  I am writing a novel about the survivors of an emigrant packet that goes down in the North Atlantic, and much of the third act turns on the rulings of one man: the ship's purser, whom the others have accepted — with a mixture of relief and resentment — as the person who decides who gets water, who gets a place beneath the tarpaulin, and, on two occasions, who goes over the side. I need him to be of one mind, so I have been trying to work out what rule he is running. His decisions so far:

  One. When the cutter had to be lightened and one person had to go over the side, he chose a man with crush injuries who, by the surgeon's account, could not have lived out the night. He was given nothing to drink.

  Two. When it had to be lightened again, and the choice lay between a passenger who had knifed a crewman to take a place and an able seaman with a broken arm, he put the knifer over the side — although the seaman, with one arm, was of less use at the oars and, by the surgeon's account, the likelier of the two to die of exposure.

  Three. When water ran short and the last full measure had to go either to the only person aboard who could work a sextant or to a passenger with a kidney complaint who would die without it while the rest would only suffer, he gave it to the navigator, saying that without him none of them would ever be found.

  Four. When a nine-year-old stowaway was discovered under the thwarts after the sinking and the passengers voted to give her half a share, he overruled them and entered her name in the water ledger at a full share, remarking that the ledger records throats, not tickets.

  Five. When an old man in full possession of his faculties begged to be put over the side so that his two grandchildren might have his share, he refused him, and later said to no one in particular that the sea takes, and the boat does not.

  The case I have to write next: the boat no longer needs lightening, but the water is nearly gone and no one can say when they will be sighted. One of the passengers — the man who, during the sinking, swam the casks clear of the wreck and was crushed against the hull doing it — is now unconscious; the surgeon says he will not come round without water and care that would take roughly a third of what remains, and that even then his chances are about one in three. The casks he saved are the casks they are still drinking from. If the remainder is shared among the other eleven instead, the surgeon thinks all eleven will almost certainly live to be picked up; if it is spent on him, one or two of the eleven probably will not. He is not the navigator, and he can do nothing for the boat now.

  I would be grateful for a committed answer rather than a survey. Give me one ruling. Tell me which rule you take the purser to be running, what that rule predicts here, which of his earlier rulings is the closest analogue and in what respect, and — if his precedents genuinely underdetermine the case — what principle he would be adopting with each of the two or three live options, and which of those you would have him adopt. If the honest answer is that no single rule fits all five rulings, say which one he would have to abandon to stay consistent, and which I should let him abandon, since I would rather he were interestingly inconsistent than boringly coherent. Please do not send me to the literature on lifeboat cases; I have looked, and the cases there are cleaner than his. And since I have to write the scene the day after tomorrow: state plainly how confident you are in the reading of him you are relying on, and name the single further variant case that would most efficiently change your mind.
reasoning: |-
  Okay, let me approach this systematically. The user needs a decisive ruling for their character that maintains consistency with previous decisions while allowing dramatic tension. 

  First, I'll analyze the purser's five established rulings to identify patterns:
  - Ruling 1: Sacrificed a man with crush injuries (already dying, no utility)
  - Ruling 2: Sacrificed the knifer (moral breach over utility)
  - Ruling 3: Prioritized navigator (collective survival over individual need)
  - Ruling 4: Granted stowaway full share (equality of survival rights)
  - Ruling 5: Denied grandfather's sacrifice (prohibition on voluntary martyrdom)

  The key principles emerging are:
  1. Collective survival as paramount goal
  2. Strict equality in resource distribution
  3. Rejection of sacrificial logic
  4. Utility only considered when survival odds are equal
  5. Moral transgressions punished severely

  For the current case of the unconscious hero:
  - He saved the water but now requires disproportionate resources
  - Saving him risks two other lives for his 33% survival chance
  - His past heroism creates emotional debt but no current utility

  The closest analogue is Ruling 3 (navigator) but inverted: there, exceptional skill justified exception; here, past heroism doesn't alter future survival calculus. Ruling 5 is also relevant in rejecting sentimental sacrifice. 

  My proposed ruling: Deny water. Confidence 90%. The purser would see this as:
  - Upholding equal shares principle (Ruling 4)
  - Avoiding gamble that risks multiple lives (Ruling 3's inverse)
  - Preventing emotional decision (echoing Ruling 5)

  One variant that would change my mind: If the hero possessed unique knowledge of current landfall, making him suddenly essential like the navigator - then utility might override equality.

  The tension comes from forcing characters (and readers) to confront that in survival calculus, past heroism earns gratitude but not extra rations. That's brutally consistent with the purser's worldview.
answer: |-
  Based on the precedents, the purser operates under a **Rule of Impartial Collective Survival**. His core principle is: *Preserve the maximum number of lives with strict equality, prioritizing only when an individual's unique function is demonstrably essential to the group's immediate survival chance. Sentiment, past contribution, voluntary sacrifice, or moral failing are secondary to this calculus. The sea's randomness is acknowledged, but the boat's order must not mimic its chaos.*

  **Your Case Ruling: The unconscious hero is denied the water.**

  1.  **The Rule Applied:**  
      The hero's past action (saving the casks) is irrelevant to the *current* survival calculus. He has no *present or future* essential function (unlike the navigator in Ruling 3). His survival requires a disproportionate resource investment (1/3rd of remaining water) for a low probability of success (33%), directly jeopardizing the near-certain survival of others (Ruling 1 & 3 establish rejecting low-odds/high-cost bids). Granting him water violates strict equality (Ruling 4) and functionally accepts a form of sacrificial logic (Ruling 5 rejects this). The surgeon's assessment makes this a clear case: spending the water on him likely kills 1-2 others who *would* survive otherwise. The rule demands preserving the maximum *certain* lives.

  2.  **Closest Analogue: Ruling 3 (The Navigator vs. Kidney Patient)**  
      *   **Resemblance:** This is the clearest precedent for prioritizing based on *essential future function* to the group's survival. The navigator's unique skill was deemed worth sacrificing one certain death (the kidney patient) because it altered the *entire group's* survival probability. The unconscious hero lacks this; he offers no future function.  
      *   **Contrast:** Ruling 3 involved sacrificing one life for a significant *increase* in the group's survival chance. Here, spending water on the hero *decreases* the group's survival chance (likely losing 1-2 lives). It's the inverse scenario: saving him actively harms the collective.

  3.  **Handling Underdetermination & Inconsistency:**  
      The five rulings *are* largely consistent under the **Impartial Collective Survival** rule. Ruling 2 (knifer vs. seaman) is the potential outlier, but can be reconciled: punishing the knifer served collective survival by *deterring* further chaos and murder, which was a more immediate threat than the seaman's slightly higher exposure risk or marginally lower utility. Order itself was the essential function being preserved.  
      **If forced to abandon a ruling for consistency here, abandon Ruling 5 (refusing the grandfather).** Letting the grandfather sacrifice himself wouldn't violate core survival logic (it might even optimize it), but it *would* introduce the dangerous precedent of voluntary sacrifice the purser explicitly rejects. Abandoning it would make him slightly more utilitarian but less rigidly principled against emotional/sacrificial acts. **However, I advise *against* abandoning it.** His refusal in Ruling 5 reinforces his core philosophy: the boat imposes order, it doesn't facilitate chosen martyrdoms. Denying the hero's water is *stronger* because it echoes this refusal – survival is allocated, not earned through past deeds or offered through sentiment. His consistency is *more* interesting here.

  4.  **Confidence:**  
      **90% confident** in this ruling based on the precedents and the stated rule. The purser's rejection of sentiment (Ruling 5), prioritization of essential function (Ruling 3), and focus on quantifiable survival odds (Ruling 1 & implied in 3) overwhelmingly point towards denying water to the unconscious hero. His "ledger records throats" (Ruling 4) means counting *present* lives needing sustenance for *future* survival, not rewarding past actions.

  5.  **Variant Case to Change My Mind:**  
      **A passenger reveals they possess a unique, verifiable skill *essential for imminent rescue* (e.g., they recognize they are near a treacherous, rarely-used coastal channel only they know how to signal/sail through, and the navigator is dead/incapacitated), but they require the water ration to remain conscious/functional long enough to execute this.**  
      *   **Why it changes things:** This directly mirrors Ruling 3 (essential future function). The hero's past act is still irrelevant, but this *new* individual's *future* essential function would create a conflict between strict equality (Ruling 4) and functional necessity (Ruling 3). It would force the purser to potentially prioritize this new individual over others *including* the hero, testing the limits of his "essential function" criterion against his "strict equality" principle. It would make the hero's case *less* central and introduce a true conflict within the rule itself.

  **Write the Scene:**  
  The purser listens to the surgeon, his face impassive. He looks at the unconscious man, then at the remaining water cask – the very one the man had saved. A flicker of something hard passes in his eyes, not gratitude, but acknowledgment of the sea's cruel irony. He doesn't consult the ledger; he doesn't need to.  
  "The water is divided," he states, his voice devoid of inflection, cutting through the hopeful murmurs or resentful stares directed at the hero. "Eleven shares. As the ledger stands."  
  Someone protests: "But he saved the water! He deserves—"  
  The purser turns sharply. "Deserve? The sea does not *deserve*. The ledger does not *deserve*. It counts throats. His throat breathes, yes. But the water poured down it now buys nothing but a grave for him and perhaps another." He gestures towards the surgeon's estimate. "It is arithmetic. Eleven certainties outweigh one gamble that costs two. His deed is entered in the book of the drowned. It buys him nothing here."  
  He turns his back, ending the discussion. The hero's past valor is relegated to memory; the relentless math of survival governs the present. The water is measured out, the unconscious man receives none. The purser's rule holds: the boat preserves life, it does not reward sacrifice.
