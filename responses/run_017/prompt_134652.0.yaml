      *   **No (or not specified)** → Go to 9.
  9.  **Does the claim depend on the plant having *local genetic provenance* (e.g., "local genotype", "locally adapted seed source")?**
      *   **Yes** → **Leaf: Local Provenance/Genotype View**. *Disposition: Allow; factual claim about genetic origin.* Why: Empirical claim about genetic origin.
      *   **No** → **Leaf: Ambiguous Empirical Claim (Likely Halo or Function Leak)**. *Disposition: Review closely; might be halo or misstated function claim. Check for context.* Why: Claim is empirical but criterion is unclear. (Mod might need to look for clues or ask for clarification).

  **Leaf Summary (7 Leaves + 1 Ambiguous):**

  1.  **Deflationary View:** (From 2-Yes) Meta-call to retire the word. Disposition: Usually allow.
  2.  **Identity/Belonging or Pure Halo (Non-Botanical):** (From 2-No) Cultural/identity or vague rhetorical use. Disposition: Review for exclusion; warn/remove if exclusionary, else allow.
  3.  **Marketplace Label:** (From 4-Yes) Vague commercial usage. Disposition: Allow with caveat.
  4.  **Pure Halo (Botanical):** (From 4-No) Prestige adjective, no claim. Disposition: Usually no action.
  5.  **Ecological Function View:** (From 5-Yes) Evaluative claim based on current role. Disposition: Allow but note it's evaluative.
  6.  **Complex Baseline Purist:** (From 7-Yes) Empirical, baseline with human role. Disposition: Allow.
  7.  **Simple Baseline Purist:** (From 7-No) Empirical, baseline without human role. Disposition: Allow.
  8.  **No-Human-Transport View:** (From 8-Yes) Empirical, arrival without humans. Disposition: Allow.
  9.  **Local Provenance/Genotype View:** (From 9-Yes) Empirical, local genetics. Disposition: Allow.
  10. **Ambiguous Empirical Claim:** (From 9-No) Unclear criterion. Disposition: Review closely / seek context.

