reasoning: |-
  We are building a decision tree for moderators to classify posts that use the word "native" in a plant-related online community. The goal is to sort posts into categories that help with moderation: distinguishing between empirical claims, value judgments disguised as facts, purely rhetorical uses, and exclusionary language.

  First, we identify independent axes along which the concept of "native" can vary. These should be dimensions that capture the key ways in which the meaning of "native" can differ in the posts we see.

  **Scratch Brainstorm: Six Axes of Variation for "Native"**

  1.  **Attachment to Taxon:** Does the word "native" attach to a specific plant taxon (species, cultivar, etc.) or to something else (e.g., a method, a style, a vibe, a garden)?
  2.  **Origin Criterion:** What is the primary criterion for "native" status?
      *   Presence at a specific baseline time (e.g., pre-settlement, 1492, 1950)?
      *   Natural arrival without human transport?
      *   Genetic origin (local provenance/genotype)?
      *   Ecological function/current role?
      *   None (it's a pure halo)?
  3.  **Human Role:** What role do humans play in the narrative?
      *   Excluded (human transport invalidates "nativeness")?
      *   Integrated (human actions like fire-setting are part of the "natural" system)?
      *   Irrelevant (only current function matters)?
  4.  **Scope of "Here":** How is the geographic location defined?
      *   A specific, defined place (e.g., county, state, ecoregion)?
      *   Vaguely defined ("here", "the area", "this region")?
      *   Not specified at all?
  5.  **Intent/Claim Type:** What kind of claim is being made?
      *   Empirical (checkable botanical/historical fact)?
      *   Evaluative (value judgment about belonging, purity, ecological value)?
      *   Rhetorical (using the word for prestige/signaling, with no clear claim)?
      *   Identity/Social (using the word to signal in-group/out-group belonging, potentially exclusionary)?
  6.  **Specificity of Referent:** How specific is the thing being called native?
      *   A specific, named plant instance or population?
      *   A species or genus?
      *   A cultivar or hybrid?
      *   Something non-botanical?

  **Building the Logical Space and Identifying Named Positions**

  We sketch a grid based on combinations of the most critical axes. For practicality, we focus on the axes most likely to differentiate the named positions required and observed in the test cases. We'll prioritize **Attachment to Taxon**, **Origin Criterion**, **Human Role**, and **Intent/Claim Type**.

  We need to map the named positions onto this grid:

  1.  **Baseline Purist:** Native = present without human influence at a specific historical baseline (e.g., pre-settlement). Humans are disruptors. Empirical claim.
  2.  **No-Human-Transport:** Native = arrived without intentional or unintentional human transport. Humans are invalid transporters. Empirical claim.
  3.  **Local Provenance/Genotype:** Native = genetically local, regardless of when it arrived (could be recent natural migration or ancient). Humans might be irrelevant or disruptors if they introduce non-local genotypes. Empirical claim.
  4.  **Ecological Function/Novel Ecosystem:** Native = fulfills a positive ecological role in the current ecosystem, regardless of origin or history. Humans might be part of the system or irrelevant. Evaluative claim.
  5.  **Cultivar-Tolerant Straight-Species:** Native = the straight species is native (per some baseline), even if a cultivar is bred from it. Cultivars are tolerated variants. Empirical claim about the species, evaluative about cultivars.
  6.  **Deliberately Vague Marketplace Label:** Native = loosely based on official lists or common understanding, used for marketing. Not a precise claim. Intent is commercial, not scientific. Vague claim.
  7.  **Belonging/Identity:** Native = signifies belonging, purity, often exclusionary ("keep Michigan native" implying exclusion of newcomers/plants). Evaluative/Social claim, potentially exclusionary.
  8.  **Deflationary View:** The word "native" is useless; replace with functional descriptions (e.g., "does well in clay in 5b"). Not a claim about "native" but a call to abandon the term. Meta-claim.

  **Merging Positions:**

  *   **Local Provenance/Genotype** and **No-Human-Transport** are distinct. One cares about genetic origin (could be human-transported local genotype?), the other cares about the vector (human = bad). They could conflict (e.g., human-transported local genotype).
  *   **Baseline Purist** often implies **No-Human-Transport** for the *arrival* before the baseline, but they are not identical. The Purist cares about presence *at* the baseline time, which might include plants that arrived naturally *before* that time. The No-Human-Transport view applies continuously (if humans bring it later, it's not native).
  *   **Ecological Function** and **Deflationary** are distinct: Function still uses "native" with a new meaning, Deflationary wants to ditch the word. We'll keep them separate.
  *   **Cultivar-Tolerant Straight-Species** is a specific subtype of **Baseline Purist** or **Local Provenance** that makes a concession about cultivars. It might fit under one of those.

  **Logical Grid (Simplified):**

  | Attachment to Taxon | Origin Criterion                     | Human Role in Origin/System | Claim Type         | Corresponding Position(s)                     | Empty Cell Diagnosis             |
  | :------------------ | :----------------------------------- | :-------------------------- | :----------------- | :-------------------------------------------- | :------------------------------- |
  | **Botanical**       | Baseline Time (e.g., pre-settlement) | Excluded/Disrupter          | **Empirical**      | Baseline Purist                               |                                  |
  | **Botanical**       | Natural Arrival (no human vector)    | Excluded/Invalidator        | **Empirical**      | No-Human-Transport                            |                                  |
  | **Botanical**       | Local Genotype/Provenance            | Varies (often irrelevant)   | **Empirical**      | Local Provenance                              |                                  |
  | **Botanical**       | Current Ecological Function/Role     | Integrated/Irrelevant       | **Evaluative**     | Ecological Function / Novel Ecosystem         |                                  |
  | **Botanical**       | Official List / Common Sense         | Irrelevant                  | **Vague/Other**    | Marketplace Label                             |                                  |
  | **Botanical**       | (Not Specified / Halo)               | Irrelevant                  | **Rhetorical**     | Pure Halo (part of Cultivar-Tolerant?)        | Unattractive? Common in practice |
  | **Non-Botanical**   | N/A                                  | N/A                         | **Evaluative/Social** | Belonging/Identity                            |                                  |
  | **Any**             | N/A                                  | N/A                         | **Meta**           | Deflationary (Retire the word)                |                                  |
  | **Botanical**       | Baseline Time                        | Integrated (e.g., fire)     | **Empirical**      | (Prairie_Moth Case: Complex Baseline Purist?) | Coherent but rare                |
  | **Botanical**       | Natural Arrival                      | Integrated                  | **Empirical**      | (Incoherent? If humans are part of nature, how define "natural"?) | Incoherent?                      |

  **Observations from Grid:**

  *   The **Prairie_Moth** case (savanna maintained by pre-settlement human fire) challenges the **Baseline Purist** view. It requires integrating humans into the "natural" system at the baseline time. This could be seen as a subtype of Baseline Purism with an integrated human role, or a distinct position. We'll treat it as a variant within the Baseline Purist leaf, flagged as complex.
  *   The **Cultivar-Tolerant** position (Fernbrain case) is a specific application of **Baseline Purist** or **Local Provenance** to cultivars. It's an empirical claim about the species origin + an evaluative tolerance for cultivars. We'll handle it under the relevant botanical empirical leaf.
  *   The **Pure Halo** use (e.g., "native vibes") is captured when "native" attaches to something non-botanical or when the origin criterion is absent/unclear *and* the claim is rhetorical.
  *   **Belonging/Identity** is primarily identified by the claim type (evaluative/social) and non-botanical attachment OR botanical attachment used in a clearly social/exclusionary context (Loosestrife case).
  *   **Deflationary** is meta, calling for abandonment.

  **Building the Moderator Decision Tree (10-14 Nodes, 6-9 Leaves)**

  We design the tree for mods to use on a single post. Start with **Attachment to Taxon**. Key Leaves:

  1.  **Non-Botanical Attachment** (Halo/Identity)
  2.  **Deflationary Call** (Retire the word)
  3.  **Botanical: Empirical Claim** (Subtypes: Baseline, No-Human, Provenance, Function)
  4.  **Botanical: Evaluative Claim** (Function as evaluative, or Belonging masked)
  5.  **Botanical: Vague Claim** (Marketplace)
  6.  **Botanical: Rhetorical Claim** (Pure Halo)

  We'll aim for 7 leaves. We structure the tree with concrete yes/no questions about the *post itself*, not about the mod's beliefs.

  ---

  **Decision Tree for Moderators**

  1.  **Does the word "native" in this post attach to a specific plant taxon (species, cultivar, population) or a specific botanical entity (e.g., a plant, a seed, a garden bed of plants)?**
      *   **No (attaches to non-botanical thing like a method, vibe, or person) OR is used as a standalone adjective without a clear botanical referent?** → Go to 2.
      *   **Yes (attaches clearly to a botanical entity)** → Go to 3.
  2.  **Is the post primarily arguing that the *word* "native" should be retired or replaced (like Sawdust)?**
      *   **Yes** → **Leaf: Deflationary View**. *Disposition: Usually allow, but flag if it sparks repetitive debate.* Why: Meta-call to abandon the term, not a claim about a plant.
      *   **No** → **Leaf: Identity/Belonging or Pure Halo (Non-Botanical)**. *Disposition: Review for exclusionary language (e.g., "keep Michigan native"); warn/remove if exclusionary, else leave as rhetorical halo.* Why: "Native" is doing cultural/identity work or is a vague positive label. (This merges non-botanical halo and potential identity use; mod reviews for exclusion).
  3.  **Does the post make a specific, testable claim about the historical presence, origin, genetics, or ecological function of the attached botanical entity? (e.g., "it was here before 1800", "it came without humans", "this genotype is local", "it supports pollinators here now")?**
      *   **No** → Go to 4.
      *   **Yes** → Go to 5.
  4.  **Is the word "native" used in a commercial context (e.g., marketplace listing)?**
      *   **Yes** → **Leaf: Marketplace Label**. *Disposition: Allow with caveat if rules permit, but remind seller accuracy is encouraged.* Why: Deliberately vague commercial usage, not a strong claim.
      *   **No** → **Leaf: Pure Halo (Botanical)**. *Disposition: Usually no action unless part of a pattern of low-effort posting.* Why: "Native" is used as a prestige adjective with no clear botanical claim attached to the specific plant.
  5.  **Is the specific claim primarily about the *current ecological function/role* of the plant (e.g., "bees love it", "it's filling the niche")?**
      *   **Yes** → **Leaf: Ecological Function View**. *Disposition: Allow but note it's an evaluative claim open to debate, not settled fact.* Why: Claim is based on current role, not origin/history. (This is evaluative, not purely empirical).
      *   **No (claim is about history, origin, or genetics)** → Go to 6.
  6.  **Does the claim specify or imply a *historical baseline* time (e.g., pre-settlement, pre-Columbian, before 1950)?**
      *   **Yes** → Go to 7.
      *   **No** → Go to 8.
  7.  **Does the post acknowledge or discuss a potential *human role* in maintaining the system *at that baseline time* (e.g., Indigenous fire management)?**
      *   **Yes** → **Leaf: Complex Baseline Purist (Prairie_Moth Type)**. *Disposition: Allow; factual claim about baseline presence acknowledging human context.* Why: Empirical claim integrated with human role at baseline.
      *   **No** → **Leaf: Simple Baseline Purist**. *Disposition: Allow if plausible; factual claim about baseline presence, human role excluded.* Why: Standard empirical claim about presence at a historical time.
  8.  **Does the claim depend on the *absence of human-mediated transport* for the plant's arrival/presence? (e.g., "it got here on its own", "not brought by people")?**
