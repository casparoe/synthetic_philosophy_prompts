  @prairie_moth: genuine question — the oak savanna restoration up the road was almost certainly maintained by people setting fires here before 1800. so is "pre-settlement baseline" a real thing or is it a fantasy of empty land

  @dock_leaf: my neighbour's yard is 90% dame's rocket and I keep pulling it but honestly the bees do not care. is anyone harmed or are we doing purity politics with trowels

  @vermont2mi: moved here last year, brought a bucket of my mother's hosta starts. same continent. they are fine. do not @ me

  @seedmoney: selling these, listed as native and locally collected. they are locally collected, the species is on the state list, I do not know the rest, do not care

  @loosestrife: if I see one more person say keep Michigan native I am out. you know how that sounds, right

  @zone5b_andy: ranges are moving north on their own now. a plant that walked here by itself in 2019 — native or not? I say yes, my mentor says absolutely not

