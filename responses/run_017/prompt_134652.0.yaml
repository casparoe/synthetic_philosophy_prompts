  **Mergers Explained**:  
  - **Cultivar-Tolerant Straight-Species** and **Baseline Purist** merged: Both rely on a species-level empirical baseline; the cultivar-tolerant view is a subtype that ignores human breeding if the species fits the baseline.  
  - **Ecological Function** and **Novel Ecosystem** merged: Both prioritize current role over origin; the difference is academic for moderation.  

  ### Step 3: Moderator Decision Tree (12 Nodes, 8 Leaves)
  **Rules**:  
  - Branch nodes are concrete/post-specific. No labels or subjective questions.  
  - First split is **Botanical Attachment** (as requested).  
  - Dispositions:  
    - **Allow**: No action needed (factual debate).  
    - **Review**: Check for exclusion/context; may require warning or lock.  
    - **Caveat**: Allow but add mod note for clarity (e.g., "this is an opinion").  
    - **Warn/Remove**: For exclusionary or rule-breaking content.  

  **The Tree**:  
  1. **Does the post use "native" to describe a specific plant taxon (e.g., species, cultivar, or population)?**  
     - *No* → Go to 2.  
     - *Yes* → Go to 3.  

  2. **Does the post explicitly argue to retire/replace the word "native" (e.g., "stop using this term")?**  
     - *Yes* → **Leaf: Deflationary View**.  
       *Awkward commitment: Forces rephrasing of common terms.*  
       *Disposition: Allow (it’s meta-discussion)*.  
     - *No* → **Leaf: Belonging/Identity Sense**.  
       *Awkward commitment: "Native" signals in-group purity, often exclusionary.*  
       *Disposition: Review; warn/remove if targeting people or cultures*.  

  3. **Is the word "native" used in a commercial context (e.g., marketplace listing)?**  
     - *Yes* → **Leaf: Marketplace-Label View**.  
       *Awkward commitment: Vagueness can mislead buyers.*  
       *Disposition: Caveat (add mod note: "Verify species")*.  
     - *No* → Go to 4.  

  4. **Does the post tie "native" to a specific historical baseline (e.g., "pre-settlement," "before 1800")?**  
     - *Yes* → Go to 5.  
     - *No* → Go to 6.  

  5. **Does the post acknowledge human influence at that baseline (e.g., "Indigenous burning maintained this")?**  
     - *Yes* → **Leaf: Baseline Purist (Complex)**.  
       *Awkward commitment: Humans as part of "natural" history.*  
       *Disposition: Allow (empirical, nuanced claim)*.  
     - *No* → **Leaf: Baseline Purist (Simple)**.  
       *Awkward commitment: Ignores historical human roles.*  
       *Disposition: Allow (empirical claim)*.  

  6. **Does the post emphasize human transport as disqualifying (e.g., "humans brought it, so not native")?**  
     - *Yes* → **Leaf: No-Human-Transport View**.  
       *Awkward commitment: Natural migration is "pure," human-assisted is "tainted."*  
       *Disposition: Allow (empirical claim)*.  
     - *No* → Go to 7.  

  7. **Does the post emphasize local genetics/provenance (e.g., "locally adapted seeds")?**  
     - *Yes* → **Leaf: Local Provenance View**.  
       *Awkward commitment: Genotype trumps ecological role.*  
       *Disposition: Allow (empirical claim)*.  
     - *No* → Go to 8.  

  8. **Does the post emphasize current ecological benefits (e.g., "bees love it," "supports wildlife")?**  
     - *Yes* → **Leaf: Ecological Function View**.  
       *Awkward commitment: Origin irrelevant if it "works" now.*  
       *Disposition: Caveat (add mod note: "This is an opinion")*.  
     - *No* → **Leaf: Pure Halo Use**.  
       *Awkward commitment: Using "native" as a greenwashed buzzword.*  
       *Disposition: Review; remove if low-effort/no content*.  

  **Tree Stats**: 8 questions to leaves, 8 leaves.  
  **Flagged Issues**:  
