  Below is a comprehensive decision tree designed for moderation based on your requirements. It focuses on classifying posts using "native" into actionable categories, prioritizing moderation needs over botanical precision. The tree is built from logical axes, tested against your cases, and includes a simplified quiz for members. 

  ### Step 1: Scratch Brainstorm (4-6 Independent Axes)
  These axes capture the core dimensions of variation for "native" in your community. They are mutually exclusive and cover the logical space:
  1. **Botanical Attachment**: Does "native" refer to a plant taxon (species, cultivar, population) or something non-botanical (method, style, vibe)?  
  2. **Temporal Baseline**: Is there an explicit/implicit historical reference point (e.g., pre-settlement, pre-industrial, 1950s)?  
  3. **Human Agency**: Does the definition require absence of human intervention (e.g., transport, breeding) or allow for it?  
  4. **Geographic Specificity**: Is "here" defined concretely (e.g., state, ecoregion) or vaguely (e.g., "local," undefined)?  
  5. **Claim Type**: Is the claim empirical (testable via science/history), evaluative (value-based), or purely rhetorical (no content)?  
  6. **Functional Focus**: Does "native" prioritize ecological function/current role over origin?  

  ### Step 2: Logical Grid of Positions
  I mapped the named positions onto combinations of these axes. Empty cells indicate incoherent, unattractive, or unoccupied positions.  

  | Botanical Attachment | Temporal Baseline | Human Agency Excluded? | Functional Focus? | Geographic Specificity | Claim Type       | Position Occupied                     | Empty Cell Diagnosis               |
