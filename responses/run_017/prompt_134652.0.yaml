  4.  **@zone5b_andy:** "a plant that walked here by itself in 2019 — native or not?"
      *   Botanical? Yes (plant).
      *   Testable claim? The question implies a claim that arrival without humans might make it native. → **Yes**.
      *   Function? No. → **No** to 5.
      *   Baseline? Not specified (2019 is recent). → **No** to 6.
      *   Human transport? "walked here by itself" implies no human transport. → **Yes** to 7. → **Leaf: No-Human-Transport View**. Disposition: Allow. *This is the core claim.*
  5.  **@sawdust:** "can we just retire the word..."
      *   Attaches to botanical? The word itself, not a plant. → **No** to 1.
      *   Call to retire? Yes. → **Leaf: Deflationary View**. Disposition: Allow.

  **Handled Well:** Fernbrain (Baseline), Seedmoney (Marketplace), Loosestrife (Identity - act on), Zone5b_Andy (No-Human), Sawdust (Deflationary).

  **Not Run (No "native"):** Prairie_Moth, Dock_Leaf, Vermont2mi. The tree only triggers on posts *using* the word "native". These posts are relevant to *discussions about* native, but wouldn't be classified by this tree. Mods would handle them under other rules (e.g., factual claims about history, promoting non-native plants respectfully).

  **Breaking Points / Limitations:**

  1.  **Context Dependence:** The tree relies solely on the post. Some classifications need context:
      *   **Non-Botanical Use (Identity):** The mod must judge if it's exclusionary. The post alone might be ambiguous (e.g., "native plants matter" could be benign or exclusionary depending on context). *Mitigation:* The leaf disposition says "Review for exclusion".
      *   **Pure Halo or Misfired Claim (Leaf 8-No):** Mod needs context to decide if it's a botched empirical claim or just rhetoric. *Mitigation:* Disposition is "Review; might be a place where the "belonging" sense is creeping in botanically".
  2.  **Missing Cultivar Distinction:** The tree doesn't explicitly separate cultivar discussions. Fernbrain was handled under Baseline Purist, which is appropriate for the cultivar-tolerant view.
  3.  **Vermont2mi/Dock_Leaf/Prairie_Moth:** These posts don't contain "native", so the tree doesn't run. They might be replies to posts that *do* contain "native". The mod tree is designed for posts *using* the problematic word. Replies without it are handled differently.

  **Overall:** The tree handles the posts that *use* the word "native" reasonably well. The main limitation is the need for mod judgment on the potential exclusionary use and on ambiguous botanical claims. This is unavoidable given the fluidity of the concept.

  **Six-Question Quiz for New Members**

  Goal: Help members identify which *sense* of "native" they primarily use, based on concrete scenarios. Options shouldn't reveal the labels.

  **Quiz Questions:**

  1.  **You find a beautiful flower thriving in a local meadow. You later learn it's Dame's Rocket (Hesperis matronalis), originally from Eurasia and brought here centuries ago. Butterflies visit it constantly. Do you consider it native?**
      *   A) No, it was brought by humans from another continent.
      *   B) No, but it's naturalized and useful now, so I might still plant it.
      *   C) Yes, because it's been here a long time and supports wildlife.
      *   D) "Native" isn't the right word; it's naturalized and ecologically functional here now.

  2.  **You're helping restore a prairie. The project uses only seeds from plants historically recorded in this county before 1850. One plant species on the list has a locally adapted genotype; another has genotypes from 200 miles away but the same species was here before 1850. How important is the local genotype?**
      *   A) Crucial. Only the locally adapted genotype is truly native here.
      *   B) Important, but the species being pre-1850 is the main thing; the genotype is secondary.
      *   C) Not crucial. If the species was here pre-1850, that's what matters for restoration.
      *   D) The pre-1850 baseline is less important than whether the plants thrive and support the ecosystem now.

  3.  **A plant species expands its range northward due to climate change, reaching your area naturally (wind-blown seeds) for the first time in 2020. Was it native to your area before 2020?**
      *   A) No, it only became native when it arrived naturally in 2020.
      *   B) No, and it's still not native because it wasn't here at the restoration baseline (e.g., pre-settlement).
      *   C) Yes, its range is shifting naturally; it belongs here now.
      *   D) "Native" is confusing here; it's a new arrival that might be well-adapted.

  4.  **A nursery sells a compact cultivar of a locally native Joe-Pye Weed species. The cultivar was bred in Europe. Is this cultivar "native"?**
      *   A) No, cultivars are never native; only the straight species is.
      *   B) No, because it was bred in Europe, not locally.
      *   C) Yes, because it's the same species as the native one.
      *   D) "Native" might not fit, but it could still be a good garden plant if it supports pollinators.

  5.  **You see a marketplace listing: "Native Wildflower Seeds - Locally Collected." The seller doesn't specify the species or provenance beyond that. What's your first thought?**
      *   A) Good, they're using the correct term for local ecotype seeds.
      *   B) It probably means the species is native per official lists, which is fine.
      *   C) "Native" here is vague but signals eco-friendly intent.
      *   D) This label is potentially misleading without more details.

  6.  **Someone says, "We need to keep [Region] native!" talking about plants. What's your strongest reaction?**
      *   A) Agree! Protecting local biodiversity from invasive species is key.
      *   B) Worry - this sounds like nativism against people or plants deemed "foreign."
      *   C) Frustration - "native" is too vague; what does it *mean* here?
      *   D) Focus on function - It matters more that plants are non-invasive and support ecosystems.

  **Scoring Key (Mapping to Positions):**

  *   **Mostly A:** **No-Human-Transport View** (Q1A, Q3A) or **Local Provenance** (Q2A, Q4B). (Quiz conflates these two slightly, as they are both strict on origin).
  *   **Mostly B:** **Baseline Purist View** (Q2B, Q2C, Q3B, Q4A, Q5B). Focus on historical presence/species.
  *   **Mostly C:** **Ecological Function / Belonging** (Q1C, Q3C, Q4C, Q5C, Q6A). Focus on current role or loose belonging. (Note: Q6A might indicate benign function, or exclusionary belonging).
  *   **Mostly D:** **Deflationary** (Q1D, Q3D, Q4D, Q5D, Q6C, Q6D) or **Ecological Function** (Q2D, Q6D). Strong preference to avoid the term or focus on function.

  **Disagreements with Mod Tree:**

  *   The quiz groups **No-Human-Transport** and **Local Provenance** together (A answers). The mod tree separates them. The quiz might not distinguish these strictly.
  *   **Marketplace Label** isn't directly a user *sense*; it's a usage. Quiz Q5 targets it (answers B, C, D relate to it).
  *   **Identity/Belonging** is captured in Q6 (answer B), but Q6A might also indicate a strict ecological view. The quiz relies on patterns.
  *   The **Cultivar-Tolerant** view is captured in Q4 (answer C), which maps to Baseline Purist (B) in the quiz.

  The quiz is a heuristic to start a conversation, not a perfect classifier. It helps members see they might mean different things by "native".
