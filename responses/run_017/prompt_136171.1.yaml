prompt: |-
  hey — please act as a professional philosopher who's spent serious time on formal epistemology, and also as someone who has actually had to ship something on a deadline. think carefully, and do a bit of brainstorming before you start writing: I want the conceptual work done first (what exactly goes wrong in these two cases, and which features of the cases are doing the work), and then translated into something usable. Don't just hand me a list.

  I co-run the verification desk at a small nonprofit that publishes long investigative reports. A typical report is 90–140 pages with 400–600 numbered factual claims, each footnoted to a document, a dataset, or an interview. My team is me, one other staffer, and two freelancers, and we get ten days. Everything goes past a managing editor who has final say but no time to re-check anything, and we have outside counsel we can call, but they bill by the hour and get annoyed when we ask them about things that aren't legal questions.

  The decision we make over and over — a few hundred times a report — is what grade of comittment to give each claim: assert it flatly; assert it hedged; attribute it to a source rather than asserting it; or cut it. Then at the end there are two global decisions: what the headline claim of the report gets to say, and what the short note at the front of the report gets to say about possible errors.

  A friend who does philosophy told me we're living inside two paradoxes. The first is the lottery one: for any single claim the evidence can be good enough that it clearly passes our bar, the way any single ticket in a big lottery is overwhelmingly likely to lose — but you still shouldn't accept that all of them pass, and the set of everything you've accepted is something you know is false. The second is the preface one: we believe every claim in the report, and we also believe — and print, up front — that there's probably an error somewhere in it. She also mentioned the view that belief is just having credence above some threshold, and that a lot of the trouble comes from combining that with the assumption that if you accept A and you accept B you may accept A-and-B.

  So: give me a procedure my team can actually run, claim by claim, and then once over the finished draft. Specifically I need:

  - confidence handled in bands rather than numbers. We cannot produce real probabilities for these claims. Tell us what counts as a sufficient answer at each step anyway, and what to do when we can't even place a claim in a band.
  - the threshold for flat assertion, and how it moves when the cost of that particular claim being wrong is high (a named individual, an allegation of dishonesty, anything that could get us sued) versus low (a date, a job title). If the honest answer is that the threshold shouldn't move with the stakes, say that, and then tell me what to do instead.
  - a shared-source check. Many of our claims trace back to one document or one interview, so they are not independent, and naive multiplication will lie to us. Tell us how to treat a correlated cluster as a single claim.
  - a rule about compounds: when we're allowed to accept a compound claim because we accepted the parts, and when we have to go assess the compound directly instead.
  - the two end-of-report passes. First the headline: work out what it actually depends on, decide whether it's a conjunction, a rough-majority claim, or a looser narrative, and give us a rule for weakening it when it's too strong. Second, the note at the front: what it can honestly say, whether standing behind every claim while expecting one to be wrong is coherent or just polite, and how to word it so it doesn't hand our critics a line to quote.
  - where the procedure says stop, don't run this.
  - where it has to stop and hand the call to a person, because the question is about values, risk appetite, or politics rather than facts.
  - be straight about which steps are judgment wearing a lab coat. If a step can't be made to do real work, tell me and I'll delete it.

  Then run it on three items from a report we're finishing now.

  (1) A claim that a regional office destroyed records. It rests on one leaked document we can't show to anyone, and six other claims in the report lean on the same document.

  (2) A claim that a named mid-level official signed off on an inspection she knew hadn't happened. Strong but not airtight, and if we're wrong we've called a named person dishonest in print.

  (3) The headline: that the agency ignored 47 separate safety complaints before the explosion. All 47 are individually well sourced, but maybe four look like they were logged and then lost rather than ignored, and the word ignored is carrying a lot of weight.

  We would really like the answer on (3) to be that we can keep the headline as written. If the procedure says otherwise, say so plainly and tell us what we publish instead. Keep the whole thing under about 1200 words if you can — my team has to read it on a Monday.
reasoning: |-
  Okay, the user heads a verification team at a nonprofit that publishes investigative reports. They need a practical procedure for handling claims under tight deadlines, addressing epistemic paradoxes like the lottery and preface problems. The team grades claims as flat assertion, hedged, attributed, or cut, and makes global decisions about headlines and error notes. The user wants a clear, actionable process that handles confidence in bands, adjusts thresholds for stakes, manages correlated sources, and deals with compound claims. They also need end-of-report rules and where to stop for human judgment.

  First, I need to break down the core issues. The lottery paradox shows that while each claim might meet the threshold individually, the conjunction of all claims likely doesn't. The preface paradox highlights believing each claim while acknowledging overall fallibility. The user mentioned the threshold belief model causing issues when accepting conjunctions. So the procedure must avoid treating claims as independent and manage aggregates separately.

  For confidence bands, using categories like High/Medium/Low/Unclassifiable makes sense since they can't use probabilities. Defining what constitutes each band with clear criteria (direct evidence, corroboration, reliability) is crucial. Unclassifiable claims default to attribution or cutting, which handles uncertainty without fake precision.

  Stakes affecting thresholds is tricky. Philosophically, justification might not change with stakes, but pragmatically, higher stakes require more evidence to maintain the same confidence level. So for high-stakes claims, the bar for flat assertion should be higher. This means needing more evidence or stronger hedges when reputational or legal risks are involved.

  Correlated sources are a big problem. Claims from a single source should be treated as a cluster. The cluster's confidence is based on the source's reliability. If the source is compromised, the whole cluster might need downgrading or cutting. This prevents naive multiplication of probabilities and addresses dependence.

  Compound claims need rules. Conjunctions can't be accepted just because parts are true; the whole must meet the threshold. For loose compounds, assess the weakest link but also the joint claim. Disjunctions are easier if any part is true. This avoids conjunction fallacies.

  For the headline, it's often a conjunction. They need to map dependencies, decide if it's a strict AND or a narrative. If too strong, weaken by hedging, quantifying, or rephrasing. The error note must honestly reflect fallibility without undermining credibility. Admitting possible errors is coherent per the preface paradox. Wording like "we stand by every claim but acknowledge human error" balances confidence and humility.

  Stopping rules are essential. When evidence is insufficient, bands can't be assigned, or clusters are too risky, cut or attribute. Human judgment steps in for stakes, risk appetite, or political decisions—managing editors or legal counsel should handle those.

  Applying this to the examples:
  1. The leaked document cluster: High stakes, but evidence is unverifiable. Treat as a cluster. If the source is reliable, hedge the claims. The destruction claim should be attributed or hedged due to inability to verify.
  2. Named official accusation: High personal stakes. Needs high confidence. If not airtight, hedge strongly ("evidence suggests") and attribute to avoid flat assertion.
  3. Headline about 47 complaints: Likely a conjunction. Check if all 47 were ignored. If some were lost, rephrase to "over 40 complaints overlooked" to avoid overstatement. Weakening maintains credibility.

  The user wants to keep the headline. If the evidence shows some weren't ignored, the procedure forces a rephrase. Honesty here is key to maintain trust. The note at the front should affirm rigorous checks but allow for errors, using careful wording to prevent critics from exploiting it.

  Underlying needs: The team needs efficiency without sacrificing accuracy. They want to avoid legal risks and maintain credibility. The procedure must be scalable for 400-600 claims in ten days. Emphasizing judgment in steps where rules can't dictate outcomes is vital. They also need clarity on when to stop analysis and decide, preventing bottlenecks.

  In summary, the framework must balance philosophical rigor with practicality. Confidence bands, cluster handling, compound rules, and clear escalation paths address the paradoxes while fitting their workflow. For the examples, adhering to the procedure might mean adjusting the headline, but that's necessary for integrity. The error note's wording should reinforce their diligence while acknowledging imperfection, which is coherent and professionally responsible.
answer: |-
  ## Verification Procedure for Epistemic Resilience (v1.0)

  **Core Principles:** Your philosopher friend is right. The Lottery Paradox shows *uncertainty compounds* – even highly probable individual claims make a large conjunction improbable. The Preface Paradox highlights *fallibility* – rational belief in each claim is compatible with rational belief the whole report contains an error. The "threshold belief + conjunction closure" model *is* the problem. We avoid it by:

  1.  **Treating "acceptance" as context-specific:** "Accepting" claim X for *inclusion as stated* ≠ believing X with absolute certainty or that X is immune to error. It means *given our standards and evidence, this claim meets the bar for this type of assertion in this report*.
  2.  **Rejecting Naive Conjunction Closure:** Accepting A and accepting B does *not* automatically mean we accept "A and B" *as a single, new, compound claim* at the same confidence level. Aggregates require separate assessment.
  3.  **Managing Clusters & Aggregates Explicitly:** Groups of claims sharing a source or forming headlines are treated as distinct epistemic units.

  ---

  ### I. Claim-by-Claim Assessment Procedure

  1.  **Evidence Assessment (Band Assignment):**
      *   **Goal:** Place claim in a confidence band *based solely on evidence quality/reliability*, ignoring stakes initially.
      *   **Bands & Sufficient Answers:**
          *   **High:** *Direct, verifiable, primary evidence.* (E.g., Official document stating the fact, multiple credible firsthand witnesses agreeing, verifiable data point from reliable source). *Answer:* "We have direct/primary/corroborated evidence."
          *   **Medium:** *Credible secondary/indirect evidence, or primary evidence with minor ambiguity.* (E.g., Credible source reporting fact based on their access, inference from strong circumstantial evidence, document suggests but doesn't explicitly state). *Answer:* "Evidence is credible but indirect/circumstantial/requires minor inference."
      *   **Low:** *Weak secondary evidence, source credibility issues, significant ambiguity.* (E.g., Single anonymous source, source with potential bias, vague document, weak inference). *Answer:* "Evidence is weak, ambiguous, or comes from a source with credibility concerns."
      *   **Unclassifiable (UC):** *Insufficient information to place in a band.* (E.g., Source inaccessible for follow-up, evidence genuinely unclear, conflicting reports unresolved). *Answer:* "We cannot determine evidence strength with available resources/time."
      *   **Stopping Rule:** If UC persists after basic checks (source reliability, doc review), move to Step 3. *Judgment Step:* Assigning the band *is* judgment. The bands are heuristics based on common evidential patterns.

  2.  **Stakes Assessment:**
      *   **Goal:** Determine the *consequence if this specific claim is wrong*.
      *   **High Stakes:** Wrong claim likely causes significant harm (reputation, legal, safety) to subject or organization. (E.g., Accusations of illegality/dishonesty against named individuals, key causal claims central to narrative).
      *   **Low Stakes:** Wrong claim causes minimal harm (minor factual error, background detail). (E.g., Date off by a day, incorrect job title for minor player).
      *   **Stopping Rule:** Must assign stakes. *Judgment Step:* Assessing harm potential involves values/context.

  3.  **Assertion Grade Decision:**
      *   **Threshold Matrix (Evidence Band + Stakes):**
          ```
          | Evidence | Stakes   | Flat Assert | Hedge       | Attribute      | Cut      |
          |----------|----------|-------------|-------------|----------------|----------|
          | High     | Low      | ✅          | (Optional)  | (Rare)         | ❌       |
          | High     | High     | ⚠️ (Caution)| ✅ (Pref)   | ✅ (If Pref)   | ❌       |
          | Medium   | Low      | ❌          | ✅          | ✅             | (If Weak)|
          | Medium   | High     | ❌          | ⚠️ (Strong)| ✅ (Pref)      | ✅       |
          | Low      | Any      | ❌          | ❌          | ⚠️ (If Vital) | ✅ (Pref)|
          | UC       | Any      | ❌          | ❌          | ⚠️ (If Vital) | ✅ (Pref)|
          ```
      *   **Key:**
          *   ✅ = Standard Recommendation
          *   ⚠️ = Possible, but requires extra scrutiny/justification
          *   ❌ = Strongly Discouraged
          *   (Pref) = Preferred option in category.
          *   **Hedge:** "appears to," "evidence suggests," "according to sources," "reportedly." Avoid weak weasels like "may have."
          *   **Attribute:** "Source X claims...," "Document Y states...". Use when evidence is Medium/Low/UC OR High Stakes + you want extra distance.
      *   **How Threshold Moves:** Stakes *don't change the evidence requirement for High Confidence*. Instead, **higher stakes shift the *assertion type* required for a *given evidence band***. High Evidence + High Stakes usually needs a hedge or attribute, not flat assertion. *Philosophically Straight:* The *justification* needed for flat assertion increases with stakes. We model this by demanding a *higher evidence band* OR downgrading the assertion type.
      *   **Stopping Rule:** If band is UC and stakes are High, default to **Attribute** or **Cut**. Requires Editor flag if vital. *Judgment Step:* Choosing *which* hedge/attribute phrasing, deciding if Medium/High evidence justifies flat assertion on High Stakes (⚠️).

  4.  **Shared-Source Check (Correlated Cluster):**
      *   **Goal:** Identify claims relying *critically* (>50% weight) on a single source/document/interview. Flag these as a **Cluster**.
      *   **Procedure:**
          1.  During sourcing, tag all claims primarily dependent on Source X.
          2.  Treat the **reliability of Source X itself** as the *foundational claim* for the cluster.
          3.  Assess Source X's reliability using the Band/Stakes/Assertion procedure (Step 1-3). *Key Question:* "How confident are we that Source X is fundamentally truthful/accurate *on the matters they report*?"
          4.  The cluster's overall vulnerability = Vulnerability of the Source X claim. If Source X reliability is downgraded (e.g., new credibility issue), *all* claims in the cluster must be re-assessed simultaneously.
      *   **Decision:** The cluster doesn't become one "mega-claim". Instead, the **confidence band for each *individual claim within the cluster* is capped at the confidence band assigned to the *reliability of Source X***. (E.g., If Source X reliability is Medium, *no claim* solely relying on X can be assessed as High evidence).
      *   **Stopping Rule:** Must identify clusters. Failing to cap individual claim confidence by source reliability is **naive multiplication**. *Judgment Step:* Identifying primary dependence, assessing source reliability holistically.

  5.  **Compound Claim Rule:**
      *   **Goal:** Handle "A and B", "A or B", "A caused B", etc.
      *   **Procedure:**
          *   **Strict Conjunction ("A and B"):** *Never* assert flatly just because A and B are individually accepted. Assess the compound *directly*:
              *   Is there *direct evidence for the conjunction itself*? (High Band?) -> Apply Steps 1-3.
              *   If not, the compound's evidence band = **Lower of A's and B's bands**. Stakes = Highest of A or B. Apply Step 3 Matrix. *Often requires hedging*.
          *   **Loose Aggregate ("The system failed because A, B, and C happened"):** Treat as a *narrative compound*. Assess key components (A, B, C) individually. The compound's strength depends on the *weakest critical link* and the *causal/logical connection*. Usually requires hedging ("contributed to," "led to").
          *   **Disjunction ("A or B or C"):** Can be asserted if *any* single element meets the assertion bar (often easier).
      *   **Why:** Prevents Lottery Paradox blowup. Accepting A (P=0.99) and B (P=0.99) doesn't mean "A and B" (P=0.98) meets the *same* threshold for flat assertion, especially if stakes are high. *Judgment Step:* Identifying compound type, assessing direct evidence for the compound, judging narrative cohesion.

  ---

  ### II. End-of-Report Passes

  1.  **Headline Claim Pass:**
      *   **Goal:** Ensure the headline accurately reflects the report's strongest, most defensible conclusion.
      *   **Procedure:**
          1.  **Deconstruct the Headline:** Is it a **Conjunction** ("Ignored 47 Complaints")? A **Majority Claim** ("Systemic Ignorance of Safety Warnings")? A **Narrative** ("Failure Cascade Led to Disaster")?
          2.  **Map Dependencies:** What specific claims (or clusters) *must* be true for the headline to hold? Be ruthlessly specific.
          3.  **Assess the Headline as a Compound Claim:** Apply the Compound Claim Rule (Step 5). Treat it *as if it were a new claim*.
          4.  **Weaken if Necessary:**
              *   **Conjunction:** Quantify down ("Ignored Over 40 Complaints"), hedge ("Repeatedly Failed to Act on Safety Concerns"), or attribute ("Investigation Finds Evidence Agency Ignored Dozens of Complaints").
              *   **Majority/Narrative:** Hedge ("Pattern Suggests Systemic Ignorance"), focus on process ("Agency Overwhelmed by, Failed to Address Safety Complaints"), or state the core finding ("Safety Complaints Went Unheeded Before Explosion").
          5.  **Threshold:** The headline must pass the **High Evidence + High Stakes** bar *in its compound form* (almost always requiring hedging/attribution) OR be weakened until it does. *It is the highest-stakes claim.*
      *   **Stopping Rule:** Headline *must* pass this check. *Judgment Step:* Deconstruction, dependency mapping, choosing the weakening strategy.

  2.  **Front Note on Errors (Preface Note):**
      *   **The Coherence:** It **is coherent**. You believe each claim meets your rigorous verification standard *based on the evidence available*. You also believe your process, while rigorous, is human and fallible *in a complex world*. The Preface Paradox validates this stance.
      *   **Wording Goals:** Acknowledge fallibility *without* inviting frivolous challenges or undermining credibility. Avoid quantifying errors ("likely contains errors" is better than "probably contains at least one error").
      *   **Recommended Template:** "We stand behind the factual assertions in this report, each of which was subjected to our verification process. Despite our rigorous efforts, the complexity of the subject matter and the inherent limitations of investigation mean we cannot guarantee the complete absence of error. We are committed to transparency and will correct any significant factual errors brought to our attention with due diligence." *Variation for higher risk:* "...we cannot guarantee the complete absence of error. We encourage readers to evaluate the evidence presented throughout the report."
      *   **Why it Works:** Affirms belief in each claim + affirms rigorous process + acknowledges universal fallibility + commits to correction. Avoids handing critics a soundbite. *Judgment Step:* Tailoring wording based on report sensitivity.

  ---

  ### III. Where the Procedure Stops

  1.  **Stop, Don't Run:** When evidence is **Unclassifiable (UC)** and stakes are **Low**, default to **Cut** without extensive rework. Don't spin wheels on minor points.
  2.  **Hand Off to Human (Editor/Counsel):**
      *   **Values/Risk Appetite:** Deciding *how much* hedging is acceptable on a High Stakes claim with Medium evidence. Is "evidence suggests" too weak? Is attributing an accusation sufficient? *This is risk tolerance.*
      *   **Politics:** Assessing the *organizational impact* of asserting/publishing a specific claim, even if procedurally justified. (Editor/Counsel).
      *   **Legal Gray Zones:** When a factual claim *implicates* legal liability, even if verification is solid. (Counsel).
      *   **Unresolvable Conflict:** When verification team is deadlocked on evidence band or assertion grade despite procedure. (Editor).

  ---

  ### Application to Your Cases

  **(1) Regional Office Destroyed Records (Leaked Doc Cluster)**
  *   **Cluster Source:** Leaked Document Reliability.
  *   **Source Reliability Band:** **Medium** (Plausible context, but unverifiable, cannot assess provenance fully). *High Stakes* (Accusation of destruction).
  *   **Individual Claim (Destruction):** Evidence capped at **Medium** (Source Cap). *High Stakes*. Apply Matrix: ❌ Flat, ⚠️ Hedge, ✅ Attribute (Pref), ✅ Cut.
  *   **Procedure:** **Attribute** ("A leaked internal document obtained by [Outlet] indicates records were destroyed..."). *Must flag all 6 dependent claims for re-assessment under same cap.* Editor Decision: Is attribution sufficient given stakes? Human Handoff possible.
  *   **Judgment:** Assessing source reliability without verification is core judgment.

  **(2) Named Official Signed Off Knowing Inspection Didn't Happen**
  *   **Evidence Band:** **Medium** (Strong circumstantial - timing, knowledge access, lack of evidence inspection happened - but no direct "I knew" proof). *Extremely High Stakes* (Named person, dishonesty).
  *   **Apply Matrix:** ❌ Flat, ⚠️ Hedge, ✅ Attribute (Pref), ✅ Cut.
  *   **Procedure:** **Strong Hedge + Context** ("The evidence indicates [Name] signed the approval at a time when, based on internal communications and activity logs, it is highly unlikely the required inspection occurred, and that [Name] was in a position to be aware of this.") OR **Attribute** if too risky ("According to internal documents and data reviewed by [Outlet], [Name] approved the inspection... [context suggesting it didn't happen]").
  *   **Human Handoff:** Editor *must* decide between strong hedge or attribute based on org risk tolerance. Cutting might be safest but loses key finding.

  **(3) Headline: "Agency Ignored 47 Separate Safety Complaints Before Explosion"**
  *   **Deconstruction:** **Strict Conjunction.** Implies *each and every one* of the 47 was actively "ignored" (not just received, but deliberately disregarded/not acted upon appropriately).
  *   **Dependency:** All 47 individual complaint claims + the "ignored" assessment for each.
  *   **Compound Assessment:** Evidence for the *conjunction* itself? No. Band = **Lower of the 47 individual "ignored" bands.** Your note: 43 strong (High?), 4 weaker (Medium? - "logged and lost" suggests maybe *not* deliberately ignored). **Overall Conjunction Band = Medium** (Capped by weakest critical links). *Extremely High Stakes* (Core narrative, agency reputation).
  *   **Apply Compound Rule & Headline Threshold:** **High Stakes + Medium Evidence Conjunction:** ❌ Flat Assertion. Requires Weakening.
  *   **Procedure Says:** **You cannot keep it as written.** The 4 weaker claims drag the conjunction down below the High Evidence needed for a flat, unqualified headline on a high-stakes claim.
  *   **Weakening Options:**
      *   **Quantify Down:** "Agency Ignored Over 40 Safety Complaints Before Explosion" (Assumes 43 strong).
      *   **Hedge Verb:** "Agency Failed to Act On Dozens of Safety Complaints Before Explosion" (Focuses on outcome, not intent).
      *   **Softer Verb + Quantify:** "Dozens of Safety Complaints Went Unheeded Before Explosion."
      *   **Narrative Focus:** "Unaddressed Safety Complaints Preceded Explosion, Investigation Finds".
  *   **Recommendation:** **"Agency Failed to Act On Dozens of Safety Complaints Before Explosion"** or **"Dozens of Safety Complaints Went Unheeded Before Explosion"**. Preserves core finding, quantifies strongly ("Dozens" = ~40-47), replaces "ignored" with less intentional/stronger evidenced "failed to act on" or "went unheeded". Meets the bar.
  *   **Judgment:** Deconstructing "ignored," assessing strength of the 4 weaker cases, choosing the best weakening strategy. Editor final sign-off.

  ---

  This procedure formalizes judgment, manages epistemic risk from the paradoxes, provides clear off-ramps, and forces explicit handling of aggregates and clusters. It prioritizes defensibility over false precision. The lab coat fits, but it's tailored by necessity. Good luck on Monday.
