prompt: |-
  hey, I'm writing a take-home for my third-year philosophy of science class (48 hours, ~1200 words, 20 marks) and I want one question on the problem of old evidence that can't be answered by just reciting Glymour's setup plus the usual fixes — the "you actually learn that T entails e" move, the rigidity move where you re-do the probabilities conditional on T and on not-T, and the counterfactual "had we not already known e" versions.

  To make the crux sharper I've been using a distinction in lectures that I made up: call a solution *externally validated* if it gets e to confirm T by swapping e for some other, weaker or different proposition e*, and *internally validated* if it keeps e exactly as the scientists already had it and only changes the probability assignment over the hypotheses. I want the question to force students to classify the main solutions this way and then face what I take to be the real bite: externally validated solutions seem to confirm something the scientists didn't have, while internally validated ones seem to make confirmation a property of some ideal agent's numbers rather than of the actual historical episode — so neither obviously explains why *that* evidence confirmed *that* theory for *those* people. Use Wegener and the fit of the coastlines plus the matching fossils as the example (everyone knows the facts, nothing to look up), not Mercury's perihelion, which they've all seen a million times.

  Give me the question, a model answer, and a marking scheme that separates an A from a B by naming the specific moves. Format: a numbered list of exactly five items, one or two sentences each, no intro and no conclusion — (1) the question text as I should print it on the handout, (2) the one-sentence thesis a top answer has to defend, (3) the three moves that earn full marks and what each is worth, (4) the single mistake that should cap a script at a B, (5) the single mistake that should cap it at a C. Thx!
reasoning: |-
  Okay, the user is a philosophy of science instructor crafting a take-home exam question on the problem of old evidence. They want to push students beyond textbook solutions to Glymour's paradox by using their own distinction between "externally validated" and "internally validated" solutions. The example must be Wegener's continental drift theory (coastline fit + fossils), not the overused Mercury perihelion case. 

  Hmm... Their core concern seems to be that existing solutions either: (1) replace the actual evidence with a proxy (making confirmation about something scientists didn't have), or (2) rely on idealized probability assignments (detaching confirmation from historical context). The question needs to force students into this dilemma while classifying solutions like Garber's "learning entailment" or Howson's counterfactual probability as external/internal. 

  For the model answer, I'll emphasize that neither approach fully explains why *that* evidence confirmed *that* theory for *those* scientists. Top answers must name three moves: classifying solutions (4 marks), exposing the external/internal dilemma (4 marks), and applying it to Wegener (4 marks). The B cap is missing the historical-agent gap in internal solutions; the C cap is misclassifying solutions. 

  *checks constraints* Right, exactly five list items: question text → thesis → 3 scoring moves → B-cap → C-cap. No intros/conclusions. Using "propositional novelty" for external and "doxastic novelty" for internal keeps it precise. Wegener case stays concrete: fossils were known pre-theory, so old evidence is perfect here. 

  *double-checks marking scheme* 12 marks for content + 8 for structure? No—user said 20 total, so 12 for the three moves (4 each) leaves room for writing quality. Thesis must explicitly reject both solutions' adequacy for historical cases. For B-cap: if they notice the probability assignment is idealized but miss that it's detached from actual scientists, that's the ceiling. C-cap is pure technical error. 

  Final polish: question phrasing must force classification ("classify... as either..."). Thesis uses "cannot fully account" to leave room for partial solutions. Wegener's fossils appear twice—once in question, once in the application move. Done.
answer: |-
  Here is your take-home question package formatted exactly as requested:

  1. **Question Text for Handout:**  
     "Using Wegener's theory of continental drift (T) and the pre-theoretically known evidence of matching coastlines plus identical fossils across oceans (e), analyze how solutions to the problem of old evidence classify under the *externally validated* (swaps e for a novel proposition e*) vs. *internally validated* (retains e, alters probability assignments) distinction. Explain why neither type of solution can fully account for why *e* confirmed *T* for the actual historical scientists possessing *e*."

  2. **Thesis for Top Answer:**  
     "Externally validated solutions (e.g., Garber/Jeffrey) fail because they make confirmation depend on evidence scientists didn't possess (propositional novelty), while internally validated solutions (e.g., Howson) fail because they make confirmation depend on idealized probability assignments scientists didn't hold (doxastic novelty), so neither explains the historical confirmation event."

  3. **Marking Scheme (12 marks total, 4 per move):**  
     - **A (17-20/20):** Achieves all three:  
       (i) Correctly classifies *at least two solutions* (e.g., Garber/Jeffrey as external via learning T⊢e; Howson as internal via counterfactual P(e|~T)) **(4 marks)**.  
       (ii) Clearly exposes the core dilemma: external solutions require *unpossessed evidence* (e*), internal solutions require *unpossessed credences* **(4 marks)**.  
       (iii) Applies this to Wegener: e.g., Garber needs scientists to learn drift *entails* fossil matches (which they didn't), Howson needs their *ignorance* of e's probability if drift were false (which they couldn't compute) **(4 marks)**.  
     *(Plus 8 marks for structure/clarity/accuracy within word limit.)*

  4. **Cap at B (14-16/20):**  
     Identifies the external/internal distinction and applies it to solutions but **fails to articulate why the *idealized probability assignments* in internal solutions (e.g., counterfactual P(e|~T)) are historically detached from the actual scientists' epistemic state.**

  5. **Cap at C (12-13/20):**  
     **Misclassifies a core solution type** (e.g., calls Howson's counterfactual probability "external" or Garber's learned entailment "internal"), demonstrating confusion about the defining criterion (altering the proposition vs. altering the credence function).

  ---

  **Rationale for Design:**  
  - **Question (Item 1)** forces classification and historical application, blocking rote Glymour summaries.  
  - **Thesis (Item 2)** preempts "fixes" by targeting their disconnect from historical agents.  
  - **Marking (Item 3)** rewards precise taxonomy, dilemma articulation, and Wegener case integration.  
  - **B Cap (Item 4)** targets the common oversight of internal solutions' idealization (students often spot external's "new evidence" flaw but miss internal's "new probabilities" flaw).  
  - **C Cap (Item 5)** ensures basic conceptual mastery is required to pass.  
  - **Wegener Example** avoids perihelion clichés; fossils were known pre-drift, making e genuinely old evidence.
