  ### The Sneaker Swap: How Foresight Can't Save You from a Money Pump

  **The Scenario**  
  Alex, a sneaker enthusiast, is at a school swap meet. They own a pair of Retro Zephyrs (A), valued at $10 to them. Taylor, a savvy trader, approaches with two other pairs: Urban Dashers (B) worth $9.50 to Alex, and Street Striders (C) worth $8. Alex has a quirk: they can’t distinguish value differences under $2. If two sneakers differ by less than $2, Alex is indifferent; otherwise, they strictly prefer the higher-valued pair. When comparing bundles (sneakers + cash), Alex first checks the sneaker difference. If it’s ≥$2, they ignore cash and choose the better sneaker. If <$2, they’re indifferent about sneakers and pick the bundle with more cash. Taylor knows this and makes three offers in sequence:  

  1. "I’ll give you $0.10 and my Urban Dashers (B) for your Retro Zephyrs (A)."  
  2. "Then, I’ll give you $0.10 and my Street Striders (C) for your Urban Dashers (B)."  
  3. "Finally, I’ll give you back your Retro Zephyrs (A) if you give me my Street Striders (C) and $1.80."  

  Alex sees the full sequence in advance and knows their future preferences won’t change. They start with A and $0. After the trades, they end up with A and -$1.60 (a $1.60 loss). Taylor profits $1.60.  

  **The Ledger**  
  *Assume Alex has enough cash to cover losses.*  

  | Trade | Offer                                                                 | Why Alex Accepts                                                                                                | Alex's New State   | Running Cash Change |  
  |-------|-----------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------|--------------------|---------------------|  
  | Start | N/A                                                                   | N/A                                                                                                             | (A, $0)           | $0.00              |  
  | 1     | Give A; receive B + $0.10                                             | Card diff: |$10 - $9.50| = $0.50 < $2 → indifferent. More cash ($0.10 > $0) → strictly prefers trade. | (B, $0.10)        | **+$0.10**        |  
  | 2     | Give B; receive C + $0.10                                             | Card diff: |$9.50 - $8| = $1.50 < $2 → indifferent. More cash ($0.20 > $0.10) → strictly prefers trade. | (C, $0.20)        | **+$0.20**        |  
  | 3     | Give C + $1.80; receive A                                             | Card diff: |$8 - $10| = $2 ≥ $2 → strictly prefers A, regardless of cash. (A, -$1.60) > (C, $0.20). | (A, **-$1.60**)   | **-$1.60**        |  

  **Net Extraction**: Alex loses $1.60. Taylor gains $1.60.  

  **The Real Work**  
  This pump rests on **intransitive indifference** due to the $2 threshold. A ∼ B (diff < $2), B ∼ C (diff < $2), but A > C (diff = $2). This creates a cycle exploitable through sequential offers. If we remove the threshold (e.g., set it to $0), strict preferences become transitive (A > B > C), and Alex refuses Trade 1 (A is strictly better than B, and $0.10 is insufficient compensation). The pump collapses. Foresight alone fails because Alex can’t bind their future self. At Trade 1, refusing leaves Alex at (A, $0), but they strictly prefer (B, $0.10) *at that moment*—and know they’ll complete the cycle. Foresight highlights the trap but doesn’t enable escape.  

  **The Other Side: Is Alex Irrational?**  
  Alex isn’t irrational at any moment. Each choice maximizes immediate preference: Trades 1–2 exploit cash-based indifference, and Trade 3 exploits the strict sneaker preference. Rationality, one might argue, governs *moments*, not *sequences*. If Alex feels no regret—each trade was locally optimal—then the outcome is a quirk of their preferences, not an error. The pump reveals a feature of their values: they’re willing to pay $1.60 for the sequence (B + $0.10) → (C + $0.20) → (A - $1.60), preferring it to stagnation at (A, $0). This view bites hardest at the start: Alex’s choice is consistent with their valuation, and the loss is the "price" of dynamic preferences.  

  **Where This View Falters**  
  Alex ends up strictly worse off (same sneakers, less cash), revealing a time inconsistency: their moment-by-night choices conflict with their long-term interest. If Alex *regrets* the outcome, it suggests rationality requires more than local optimization.  

  **Conclusion: Preference Defect or Need for Commitment?**  
  This case is better read as an argument that **being rational over time requires something extra**. Intransitive indifference isn’t inherently defective—it models real-world perceptual limits. But without commitment tools (e.g., paying Taylor $0.50 upfront to withhold Trade 3), Alex is vulnerable. The $1.60 loss is the cost of *not* committing. Rationality across time demands planning: Alex should pay the price of binding their future self (e.g., via a pre-commitment contract priced at $0.50) to avoid the larger loss. The pump shows that coherent preferences aren’t enough—you need a way to stick to a plan.
