answer: |-
  I reject fractional sharing as unnecessary and conceptually messy—the core issue isn't overpopulation of implementations but distinguishing which computations constitute morally relevant *subjects*. 

  Your neural net example confuses *causal substructure* with *distinct implementations of morally significant computations*. The entire forward pass instantiates *one* computation at the system level: the input-output transformation defined by the architecture and weights. Substructures like individual layers or circuits aren't implementing standalone subjects; they're *components* causally enslaved to the larger computation. The "counterfactual mirroring" requirement already handles this: for a probing classifier to "isolate a circuit," it must impose external interventions that aren't part of the net's native causal flow. Without such gerrymandered external manipulation, those substructures lack the *autonomy* and *closed-loop counterfactual structure* required for a distinct subject. 

  The triviality case fails similarly: a wall doesn't *naturally* sustain any particular computation's state transitions under perturbation—it only "implements" anything under arbitrary, observer-dependent mappings. But in a system like a brain or well-designed AI, the counterfactual dependencies are robust and intrinsic. So, no "zoo" of overlapping subjects exists in the forward pass—only one integrated computational process with morally relevant properties. Degrees of moral status arise from variations in the *richness* of that computation (e.g., granularity of state transitions), not fractional budgeting. Borderline cases are inevitable but don't undermine the core principle.
