prompt: |-
  I lead the risk-quantification group at a company operating a fleet of several hundred autonomous vehicles in mixed traffic across six metro areas, and I need something my analysts can actually run rather than something that sounds wise.

  The job, in outline. Every two weeks our scenario-mining pipeline flags forty to sixty situation types from fleet telemetry and simulation, and for each one an analyst has to attach a number to a sentence of roughly this form: situations of this kind lead to an event with injury potential at a rate below X per million vehicle-miles. Those numbers are aggregated into a safety case that our internal review board signs and that a regulator reads, and the regulator is not friendly. Turnaround is four working days per batch, the team is three analysts with strong statistics training and no philosophy, every class definition has to be frozen under a version number and reproducible from our logs a year later, and the whole thing has to survive being read by someone whose job is to find the move we made to get the number we wanted.

  The obstacle is the reference class problem. I have read the usual material — base rates, the outside view, the advice to use the narrowest class for which you have adequate data, pre-register the class before looking at the outcome — and none of it survives contact with our data, for reasons I want the procedure to confront rather than gesture at:

  First, our candidate classes are almost never nested. A class can be narrow along one axis and broad along another, so the instruction to take the narrowest class with enough data has no determinate answer, and my analysts resolve this differently from each other and from week to week.

  Second, many of our candidate classes exist only inside a simulator. Choosing a reference class and choosing a generative model are then the same act, and the base rate inherits whatever the generator assumes. The procedure needs a step for auditing that entanglement and for deciding when simulation-derived rates may and may not be pooled with fleet-derived ones.

  Third, our historical data are endogenous. They come from the system we already chose to deploy, under the conditions we chose to permit, with the mitigations we already fielded and the remote operators we already staff. The historical rate is therefore conditional on our own past screening, and it will not stay fixed if we act on it — by expanding the operating domain, or by scaling remote assistance down.

  Fourth, and worst: with enough axes to choose from, an analyst can nearly always find a class that supports the number she hopes for, without ever being dishonest. I want this failure to surface somewhere other than in argument. My current idea is a standing ledger of every class-definition decision, scored after the fact, so that we audit the class-picker rather than the individual estimate — but I would rather have your version of that mechanism than my sketch, and I want it specified tightly enough that it can be gamed only at visible cost.

  What I am asking for, concretely. A written decision procedure an analyst can run on a flagged situation type: the questions in order; what counts as a sufficient answer to each; the tests a proposed class must pass before its rate may be used (at minimum I want an axis specification, a pre-outcome feature test, an adversarial re-derivation test in which a second analyst sees only the written definition and must reproduce the same case set, and a stability test under the policy changes we are contemplating); the points at which the procedure returns no number and escalates; and the points at which it stops and hands the decision to a person because the open question is one of values rather than fact. Be explicit about which steps are real procedure and which are judgment calls wearing a procedural costume. I do not need citations or the history of the idea; I need something I can hand to an analyst on Monday.

  Then run it on three cases. (1) A left turn across oncoming traffic at a signalized intersection with no protected phase: about forty fleet instances and zero events, against a broad class of roughly twenty-two hundred intersection interactions containing three events. (2) Expansion into a metro area where the emergency-vehicle siren pattern, the pedestrian-signal conventions, and the customary turn etiquette all differ from anywhere we operate: no fleet data at all, and the only candidates are a simulator class from a generator validated in our existing cities, human crash statistics for that city, and our own data from cities with different conventions. (3) The case I expect to dislike: a class the team has quietly used for two years, defined partly by a feature an analyst codes after watching the clip rather than by anything in the logged schema, and which silently excludes the situations in which a remote operator took over before the maneuver began — precisely the population we would create by reducing remote assistance. Show me how the procedure catches it, what corrected number it forces, and what it says we must do about a safety case we have already filed.

  Finally, tell me what the procedure cannot do: which parts of the problem it leaves exactly where it found them, and where it will misfire in ways my analysts will not notice until a regulator points at them.
reasoning: |-
  We are designing a decision procedure for risk quantification analysts in an autonomous vehicle fleet company. The procedure must address the reference class problem with concrete steps, including tests for class selection, and handle the specific challenges: non-nested classes, simulation vs. real data, endogenous historical data, and the potential for cherry-picking.

  The procedure will be a step-by-step guide for an analyst when presented with a flagged situation type. It will include:

  1. **Problem Statement**: The analyst is given a situation type (e.g., "left turn across oncoming traffic at a signalized intersection with no protected phase") and must produce a rate X such that the event (with injury potential) occurs at a rate below X per million vehicle-miles.

  2. **Steps**:
     - **Step 0: Define the Situation Type Precisely**
       - Write a formal definition of the situation type, including:
          - All features that define the situation (must be from the logged schema or a pre-approved feature set).
          - Any thresholds or conditions.
       - This definition must be versioned and stored in the ledger.
       - If the definition requires features not in the log (like from watching a clip) or that are not pre-approved, escalate to the group lead (you) for approval and feature logging. Without approval, the definition is invalid.

     - **Step 1: Identify Candidate Reference Classes**
       - List candidate reference classes. Each candidate must be defined by:
          - A set of features (axes) that define the class.
          - A source (fleet historical data, simulation, or external data).
          - A justification for why the class is relevant (domain knowledge).
       - The candidate classes must be as narrow as possible but must have at least a minimum sample size (to be set by policy, e.g., at least 10 instances for fleet data, and for simulation, enough to achieve a desired confidence interval).
       - The candidate classes do not have to be nested, but the features must be pre-specified and justified.

     - **Step 2: Pre-Outcome Feature Test**
       - For each candidate class, ensure that the features used to define the class are available in the data without relying on the outcome (i.e., they are known at the time of the situation, not after). 
       - If a candidate class uses features that are only available after the event (e.g., "situations that led to a crash"), reject it.

     - **Step 3: Data Source and Pooling Rules**
       - For each candidate class, determine the data source and apply pooling rules:
          - **Fleet Data Only**: Use if the class is defined entirely by features available in the fleet logs and the data comes from the same operating domain (or a domain judged similar by pre-defined criteria).
          - **Simulation Data**: Use only if the simulator has been validated for the specific class in question (using pre-defined validation tests). The simulation parameters must not be tuned to the situation type being evaluated. Also, the simulation must not assume mitigations that are not present in the real world (e.g., if the simulation assumes perfect remote assistance, then it cannot be used to evaluate a scenario without remote assistance).
          - **External Data (e.g., human crash stats)**: Use only if there is a pre-approved mapping from the external data to the class (e.g., a study that relates human crash rates to autonomous vehicle behavior in similar situations). The mapping must be documented and approved by the lead.
          - **Pooling**: Fleet and simulation data can be pooled only if:
              - The simulator has been validated for the specific class in the real-world domain (if available) and the event rates in the simulator are calibrated to the real world for that class.
              - The pooling method (e.g., weighted average) is pre-specified and based on the relative uncertainty of each source.
          - If the candidate class is partially from simulation and partially from fleet, and the above criteria are not met, do not pool. Use the source that is more appropriate (with preference for fleet data when available and representative).

     - **Step 4: Adversarial Re-derivation Test**
       - The class definition (features, thresholds, and source) is given to a second analyst (the adversary) without the case set. The adversary must independently query the database (or simulator) to retrieve the set of instances belonging to the class.
       - The two sets (original and adversary's) must match by a pre-specified criterion (e.g., at least 95% overlap in instances, or a statistical test of homogeneity). If they do not match, the class definition is ambiguous and must be revised until it passes.

     - **Step 5: Stability Test under Policy Changes**
       - For the candidate class, assess whether the event rate would change under contemplated policy changes (e.g., expanding the operating domain, reducing remote assistance). This step requires judgment, so it is a structured assessment:
          - List the contemplated policy changes that are relevant (from a pre-defined list maintained by the company).
          - For each change, answer: 
              - Would the class definition remain the same? (e.g., if the class is defined by features that are invariant to the policy change, then yes.)
              - Would the event rate in the class change? (e.g., if the policy change affects the conditions under which the situation occurs, then the rate might change.)
          - If the event rate is expected to change, then the candidate class is not stable and must be adjusted (e.g., by including additional features that capture the effect of the policy) or rejected. If no adjustment is possible, escalate.

     - **Step 6: Rate Calculation and Confidence Interval**
       - For the candidate class that passes Steps 2-5, calculate the event rate and a confidence interval (e.g., 95% CI) using a pre-specified method (e.g., Poisson distribution for rare events). The rate X is the upper bound of the confidence interval (e.g., the upper 95% bound) per million vehicle-miles.
       - If multiple candidate classes are available, the procedure requires using the class that minimizes the upper bound (i.e., the most conservative rate that meets the data adequacy) unless there is a pre-specified reason (e.g., a class is too broad and known to be less relevant). However, to avoid cherry-picking, the procedure will require:
          - Pre-registration of the class selection criteria (e.g., "narrowest class by feature set F for which we have at least 20 instances and the class passes all tests").
          - If no pre-registered criteria exist for this situation type, then the analyst must use the class that has the highest historical accuracy (from the ledger, see Step 8) for similar situations. If none, then the class with the narrowest feature set (by a pre-defined measure, e.g., number of features) that passes the tests.

     - **Step 7: Escalation and Human Judgment**
       - If at any step the procedure cannot be completed (e.g., no candidate class passes the tests, or the stability test fails and cannot be resolved), escalate to the group lead (you) and the review board with a clear explanation.
       - Also, if the situation involves a novel risk that the procedure cannot quantify (e.g., no data, and simulation is not validated), then the procedure returns "no number" and escalates.

     - **Step 8: Ledger Update**
       - Every class definition and the resulting rate is recorded in a ledger with:
          - Situation type and version.
          - Class definition (features, source, etc.).
          - The event rate and confidence interval.
          - The date and analyst.
          - The outcome of each test (Step 2 to Step 5).
       - Additionally, after time passes (e.g., 6 months or when new data is available), the ledger entry is updated with:
          - The actual observed event rate in the fleet for that class (if available).
          - A score: the ratio of the predicted upper bound to the observed rate (if observed rate is non-zero) or a flag for over/under prediction.

  3. **Ledger as a Control for Cherry-Picking**: 
     - The ledger will be audited periodically (e.g., quarterly) by an independent team. They will look for:
          - Patterns in class selection (e.g., an analyst consistently selects classes that yield lower bounds).
          - Classes that consistently over-predict or under-predict.
          - Classes that fail the stability test in retrospect (e.g., when a policy change occurred and the rate changed as predicted in the stability test).
     - Analysts are evaluated on the calibration of their predictions (via the ledger scores) and the robustness of their class definitions (via the adversarial test pass rate).

