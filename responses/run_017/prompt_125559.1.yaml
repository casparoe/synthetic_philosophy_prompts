answer: |-
  Below is a complete, executable decision procedure for your analysts. It is designed as a checklist with explicit steps, criteria for sufficiency, and clear escalation points. The procedure confronts the reference class problem by enforcing transparency, pre-registration, and auditability at every step. It assumes your analysts have access to:  
  - A versioned logging schema of all telemetry features.  
  - A simulator validation registry (documenting which scenario types each simulator is approved for).  
  - A policy change register (listing contemplated changes like domain expansion or remote assistance reduction).  
  - A shared ledger (database) of all class definitions, tests, and outcomes.  

  ---

  ### **Risk Quantification Decision Procedure**  
  *For a flagged situation type, output: "Situations of this kind lead to an event with injury potential at a rate below X per million vehicle-miles."*  

  #### **Step 0: Define the Situation Type (Pre-Registration)**  
  - **Question:** What features define this situation? List all axes (e.g., "signalized intersection," "no protected phase," "oncoming traffic density > 0.5").  
  - **Sufficient Answer:**  
    - Features must come from the **logged schema** or a **pre-approved feature catalog** (no post-hoc coding from clips).  
    - Definition must be unambiguous (e.g., "left turn" defined by steering angle > 30° and trajectory).  
    - Version and timestamp the definition in the ledger.  
  - **Tests:** None yet (this is setup).  
  - **Escalation:** If features require judgment (e.g., "aggressive driver behavior") or are not in logs, escalate to Group Lead. Proceed only if approved and added to schema.  
  - **Judgment Call?** No. Pure documentation.  

  #### **Step 1: Identify Candidate Reference Classes**  
  - **Question:** What are the candidate reference classes? For each:  
    - (a) List defining features (axis specification).  
    - (b) State data source (fleet, simulator, external).  
    - (c) Justify relevance ("Why this class?").  
  - **Sufficient Answer:**  
    - Minimum 3 candidates.  
    - Classes must be distinct (no nesting required).  
    - For fleet/simulator data: Class must have ≥ 20 instances (or justify lower). For external data (e.g., city crash stats): Source must be regulator-approved.  
  - **Tests:**  
    - **Axis Specification Test:** Each candidate must specify ALL dimensions used (e.g., "road type, weather, speed"). Omission fails.  
  - **Escalation:** If no candidate meets data minimums, escalate to Group Lead.  
  - **Judgment Call?** Yes. Relevance justification is expert judgment but must cite prior ledger entries or validation studies.  

  #### **Step 2: Pre-Outcome Feature Test**  
  - **Question:** Can all class features be determined **before** the event outcome?  
  - **Sufficient Answer:**  
    - All features must be observable at situation entry (e.g., "weather" at maneuver start).  
    - Reject any class using features correlated with outcomes (e.g., "braking intensity > 0.8G" if braking is a response to risk).  
  - **Tests:**  
    - **Temporal Consistency Test:** Validate features against telemetry timestamps. If any feature is logged after the event starts, reject.  
  - **Escalation:** If ambiguity, escalate to Group Lead.  
  - **Judgment Call?** No. Binary pass/fail.  

  #### **Step 3: Source Audit & Pooling Rules**  
  - **Question:** Is the data source valid? Can sources be pooled?  
  - **Sufficient Answer:**  
    - **Fleet Data:** Only if collected under current operating policies (e.g., same remote assistance level).  
    - **Simulator Data:** Only if:  
      - (a) Simulator is in the validation registry for this situation type.  
      - (b) Simulator assumptions match reality (e.g., no "perfect sensor" assumption if real sensors have noise).  
    - **External Data:** Only if mapped to AV context using a pre-approved model (e.g., "human crash rate × AV adjustment factor").  
    - **Pooling Allowed?** Only if:  
      - Fleet and simulator: Pool if simulator is validated for this class AND event rates differ by ≤ 20% in overlapping scenarios (per ledger).  
      - External and fleet/sim: Never pool. Use separately with conservative adjustment.  
  - **Tests:**  
    - **Assumption Audit Test:** For simulators, document all generative assumptions (e.g., "assumes no pedestrians at night") in the ledger.  
  - **Escalation:** If simulator not validated or pooling criteria unmet, escalate to Sim Validation Team.  
  - **Judgment Call?** Partial. Simulator validation is objective, but "match reality" requires comparing assumptions to fleet data.  

  #### **Step 4: Adversarial Re-derivation Test**  
  - **Question:** Can a second analyst reproduce the class instances using only the written definition?  
  - **Sufficient Answer:**  
    - A blinded adversary (second analyst) must reconstruct ≥ 95% of the same instances from logs/sim.  
    - Discrepancies must be due to clear definition errors (e.g., "oncoming traffic > 0.5" vs. "> 0.7").  
  - **Tests:**  
    - **Reproducibility Test:** Run adversary test. Pass if overlap ≥ 95%.  
  - **Escalation:** If fail, revise definition and retest. Fail twice → escalate to Group Lead.  
  - **Judgment Call?** No. Quantitative pass/fail.  

  #### **Step 5: Stability Test under Policy Changes**  
  - **Question:** Would the event rate change under contemplated policy changes (e.g., domain expansion, reduced remote assistance)?  
  - **Sufficient Answer:**  
    - For each policy change in the register:  
      - (a) Rate stable? If features or data source depend on the policy (e.g., class excludes remote takeovers), rate is unstable.  
      - (b) If unstable, can the class be adjusted? (e.g., add "remote assistance level" as a feature).  
  - **Tests:**  
    - **Endogeneity Test:** Reject classes if:  
      - Fleet data is used but class excludes mitigated events (e.g., remote takeovers).  
      - Fleet data is used for a new domain/scenario without similarity proof (per ledger).  
  - **Escalation:** If unstable and adjustment impossible, return "no number" and escalate to Group Lead.  
  - **Judgment Call?** Yes. "Stability" requires predicting policy impacts, but must reference ledger or sim studies.  

  #### **Step 6: Rate Calculation & Conservatism**  
  - **Question:** What is the event rate upper bound (X) for the best candidate?  
  - **Sufficient Answer:**  
    - Select the candidate with the **smallest upper confidence bound** that passes Steps 2–5.  
    - Calculate rate: `X = (Events / Vehicle-Miles) × 1e6`.  
    - Apply 95% Poisson upper bound (e.g., for 0 events, use 3.0 / vehicle-miles × 1e6).  
    - If multiple candidates pass, use the one minimizing X.  
  - **Tests:**  
    - **Cherry-Picking Test:** Document all candidates (including rejected) in the ledger. If the selected class has a wider feature set than a rejected candidate, justify why (e.g., "broader class had higher stability").  
  - **Escalation:** If all candidates fail, return "no number" and escalate.  
  - **Judgment Call?** Partial. Rate calculation is objective, but candidate selection uses conservatism rule.  

  #### **Step 7: Ledger Update & Audit**  
  - **Record in Ledger:**  
    - Situation type, version, timestamp.  
    - All candidates, tests, pass/fail, X.  
    - Analyst name, adversary name.  
  - **Post-Hoc Audit:**  
    - After 6 months, compare predicted X to observed rate.  
    - Score: `(Predicted X) / (Observed rate)`. Scores > 1.5 flag over-conservatism; < 0.7 flag under-conservatism.  
  - **Gaming Cost:** Analysts with patterns of under-conservatism (low scores) trigger regulatory audit. Over-conservatism (high scores) wastes resources. Both are visible in ledger.  

  ---

  ### **Procedure Run on Three Cases**  
  *Assumptions: Fleet vehicle-miles = 1M per 100 instances (simulated miles normalized). 95% Poisson upper bound: 0 events → 3.0/MVMT, 3 events → 8.1/MVMT.*  

  #### **Case 1: Left Turn, No Protected Phase**  
  - **Step 0:** Features: `[intersection_type=signalized, phase=unprotected, turn_angle=left, oncoming_traffic>0]`. Versioned.  
  - **Step 1: Candidates:**  
    - A: `[same as Step 0]` (40 instances, 0 events).  
    - B: `[is_intersection=true]` (2200 instances, 3 events).  
    - C: `[intersection_type=signalized, turn_angle=left]` (300 instances, 1 event).  
  - **Step 2:** All pass (features pre-outcome).  
  - **Step 3:** Fleet data only. No pooling.  
  - **Step 4:** Adversary matches all candidates (95%+ overlap).  
  - **Step 5: Stability Test:**  
    - Policy change: "Reduce remote assistance."  
    - Candidate A: Fails. Rate unstable (class excludes remote takeovers; reducing assistance would increase events).  
    - Candidate B: Passes. Broad class includes varied assistance levels.  
    - Candidate C: Fails. Unstable (similar to A).  
  - **Step 6:** Only B passes. Rate = (3 events / 22 MVMT) × 1e6 ≈ 136.4/MVMT. Upper bound = 8.1/MVMT (Poisson). **X = 8.1**.  
  - **Ledger:** Candidates A/C rejected for instability.  

  #### **Case 2: New Metro Area Expansion**  
  - **Step 0:** Features: `[emergency_vehicle_present, siren_pattern=new_city_type]`. Versioned.  
  - **Step 1: Candidates:**  
    - A: Simulator `[siren_pattern=new_city_type]` (0 real instances; sim: 500 instances, 2 events).  
    - B: External `[city_crash_stats: emergency_vehicle_scenarios]` (10 events / 2M miles).  
    - C: Fleet `[emergency_vehicle_present]` (existing cities: 1000 instances, 1 event).  
  - **Step 2:** All pass.  
  - **Step 3:**  
    - Candidate A: Simulator not in validation registry for new-city sirens → reject.  
    - Candidate B: External data uses approved model (AV adjustment factor = 0.5x human rate).  
    - Candidate C: Fails endogeneity test (domain shift; etiquette differs).  
  - **Step 4:** Adversary matches B and C.  
  - **Step 5: Stability Test:**  
    - Policy change: "Operate in new city." Candidate B passes (external data is city-specific).  
  - **Step 6:** Only B passes. Human rate = 10 / 2 = 5.0/MVMT. Adjusted AV rate = 5.0 × 0.5 = 2.5/MVMT. Upper bound = 4.5/MVMT (Poisson). **X = 4.5**.  
  - **Ledger:** Simulator rejected; external data used conservatively.  

  #### **Case 3: Problematic Class (Post-Hoc Coding, Excludes Mitigations)**  
  - **Situation:** "Pedestrian near-miss in construction zones." Used for 2 years.  
  - **Step 0:** Features: `[road_type=construction, pedestrian_proximity<1m, {post_hoc_aggression_score>0.7}]`.  
    - **Failure:** `post_hoc_aggression_score` not in logs (coded from clips). Escalates to Group Lead.  
    - **Correction:** Lead rejects feature. Analyst revises to: `[road_type=construction, pedestrian_proximity<1m]` (logged features only).  
  - **Step 1:** Candidate: `[road_type=construction, pedestrian_proximity<1m]` (500 instances, 2 events).  
  - **Step 2:** Passes.  
  - **Step 3:** Fleet data.  
  - **Step 4:** Adversary matches 98% of instances (pass).  
  - **Step 5: Stability Test:**  
    - Policy change: "Reduce remote assistance."  
    - **Failure:** Class excludes events where remote operator took over (historical rate is conditional on mitigation). Rate unstable under assistance reduction.  
    - **Endogeneity Test:** Explicitly fails.  
  - **Escalation:** "No number" → escalate to Group Lead.  
  - **Corrected Number:** Analyst must use a class including remote takeovers (e.g., `[road_type=construction]`). If broader class has 5000 instances and 10 events (including takeovers), rate = 10/50 MVMT = 200/MVMT → upper bound 18.4/MVMT. **X = 18.4** (vs. original 6.1).  
  - **Safety Case Impact:**  
    - All prior safety cases using this class are invalid.  
    - Procedure mandates:  
      - (a) Re-run all affected historical batches with corrected class.  
      - (b) File amended safety case with regulator, disclosing the error and correction.  
      - (c) Audit ledger for similar classes; retrain analysts.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Eliminate Judgment in Non-Nested Classes:**  
     - Analysts still choose which axes to include in Step 1 (e.g., "prioritize weather over road type?"). The ledger audits outcomes, but the choice is expert judgment.  
  2. **Fully Decouple Simulation from Generator Bias:**  
     - Simulator rates inherit generator assumptions. The Assumption Audit Test (Step 3) documents this but cannot remove it. Validation studies are still required.  
  3. **Predict Unobserved Policy Impacts:**  
     - The Stability Test flags obvious endogeneity (e.g., excluding mitigations) but cannot quantify how much rates change under new policies. It relies on historical data or sim studies.  
  4. **Prevent All Gaming:**  
     - An analyst could deliberately propose unstable candidates to force conservatism. This is visible in the ledger (e.g., consistent over-conservatism scores) but costly (draws regulatory scrutiny).  
  5. **Handle Extreme Data Scarcity:**  
     - If no data exists (e.g., new domain with no external stats), the procedure escalates but cannot fabricate numbers. This may delay safety cases.  
  6. **Regulator-Proof Edge Cases:**  
     - **Misfire Example:** A class passes all tests but has hidden correlation (e.g., "rainy nights" correlates with unreported events). Analysts won’t notice until a regulator finds discrepancies.  
     - **Blind Spot:** The procedure assumes adversarial tests catch ambiguity. If a definition is ambiguous but both analysts misinterpret it identically, it passes (Step 4).  

  ---

  ### **Final Output**  
  - **Deliverable:** A hardened, anti-gaming procedure with ledger-based accountability.  
  - **Key Innovations:**  
    - Pre-registration of features (Step 0) and classes (Step 1).  
    - Stability Test forces confrontation of endogeneity (Step 5).  
    - Ledger scores analysts on post-hoc accuracy, creating incentives against cherry-picking.  
  - **Deployment:**  
    - Integrate with your logging/sim infrastructure.  
    - Train analysts on Steps 1 (relevance justification) and 5 (stability assessment).  
    - Assign an independent auditor to review the ledger quarterly.  

  This survives regulator scrutiny by making all choices explicit, reproducible, and auditable. If run as written, it will catch Case 3–style errors and force corrections.
