  For the decision theory puzzle about "same reasoning," I can frame it to get at whether Vega sees cooperation as requiring something beyond rationality. For AI, the question should prevent hand-waving by demanding concrete design implications. The falsification question needs to specify observable evidence that would undermine her view.

