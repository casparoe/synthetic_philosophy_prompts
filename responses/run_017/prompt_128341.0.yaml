  ### Plain Statement of Limitations  
  **What the Procedure Cannot Do**:  
  1. **Prevent ambiguity entirely**. Rules will always have open texture for new cases.  
  2. **Replace values judgments**. How much risk to tolerate (e.g., over-blocking) requires human decisions.  
  3. **Detect "silent" divergences** before a distinguishing feature emerges in the data.  
  4. **Fix biases in the labeler community**. Drift toward classifier suggestions or groupthink must be managed separately.  
  5. **Resolve disputes faster than weekly**. Probes requiring new data may delay resolution.  

  This protocol systematizes the "openness" of rules, but it trades drafting effort for explicit fiat and escalation—accepting that some disagreements are irreducible.
