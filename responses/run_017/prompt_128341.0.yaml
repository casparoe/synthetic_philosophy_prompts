prompt: |-
  I lead the annotation team for a content-safety classifier at a mid-sized platform. Roughly forty labelers, working across three languages, apply a guideline document of about ninety rules to a few hundred thousand items a month. Those labels retrain the classifier, so a systematic mislabel is expensive and slow to notice, and a labeler who has quietly been applying a deviant version of a rule can go undetected for months. Each labeler has about thirty seconds per item. Anything I add to the guideline has to be readable by someone with no training in philosophy or linguistics, it has to survive translation into three languages, and it has to clear Trust and Safety and Legal, who meet with me once a week for forty-five minutes.

  The recurrence I want help with is the one described by the Kripkenstein reading of Wittgenstein on rule-following: a rule plus the entire stock of its past applications still leaves its application to a genuinely new case open, and when two labelers disagree and neither has misread anything, the instinct is to keep redrafting the rule as though the right wording were hidden in it somewhere, waiting to be found. I want to stop treating that as a drafting failure and build the openness into how we work. A wrinkle specific to us: the labeling interface shows each labeler the classifier's own suggested label, generated from the labels we have already produced, and labelers drift toward agreeing with it.

  Please write a reusable procedure my team can run in that weekly forty-five-minute meeting on a batch of disputed items. It should absorb, without using any of the technical vocabulary, the following ideas: that a rule together with all its past applications underdetermines the next one; that there is a difference between hunting for a further fact and settling on assertibility conditions by appeal to what our labeler community in fact does; that sustained disagreement which survives repeated redrafting is evidence that there is no fact of the matter to be found here rather than evidence that the rule is badly written; and that a labeler can be following a divergent rule that agrees with ours on every item we have ever seen.

  The procedure needs: an entry condition; ordered steps; the question asked at each step; what counts as a sufficient answer; the point at which the procedure stops with a no or a not-yet; and the point at which it hands the decision to a person because the question is one of values rather than of fact or meaning, since how much over-blocking we tolerate is not something a guideline can settle. It must distinguish three kinds of disagreement and route each differently: disagreement about the world or about what a text says, settled by adding a worked example; disagreement traceable to a divergent rule, settled by constructing the smallest probe item that would separate the two candidate rules and, where no probe item that could ever reach us separates them, recording the divergence as unfalsifiable and stopping; and disagreement that is really a values question, escalated. Include a rule for designing such a probe item, a stop rule stating how many failed refinement rounds trigger switching to a hardcoded lookup table issued as a decision rather than presented as a clarification, a verdict on whether the classifier's suggested labels may be used as the tiebreaker, and a specification of who signs off on what and how decisions taken by fiat are recorded and later revisited.

  Then run it on three cases: (i) two labelers split on whether an AI-generated image of a real person, posted without consent, falls under our sexual content rule, both citing the same sentence of the guideline; (ii) a labeler who has agreed with the team on four thousand items and who then applies a rule in a way that is consistent with everything she has ever labeled but that none of us expected, because the feature distinguishing the two readings has never appeared in any item we have seen; (iii) a class of items I have already tried to fix by redrafting three times, where satire directed at a public figure keeps splitting the room between harassment and political speech. Run (iii) honestly even where the procedure tells me to stop drafting; I would rather hear that than a fourth rewording.

  Say plainly what the procedure cannot do.

  Use this output format. First, a table of the procedure itself with the columns: Step; Entry condition; Question to ask; What counts as a sufficient answer; If it fails, go to; Hard-case flag. Second, a table of the three worked cases with the columns: Case; Step entered; Steps run, in order; Outcome; Settled by fact, by convention, or by values; Residual risk; What the asker will dislike. Third, a single JSON object with exactly these fields, which you should fill in: probe_design_rule (string); stop_rule (object with keys rounds, condition, fallback); nodes_converted_to_fiat (array of objects with keys rule_id, item_class, why_drafting_failed, fiat, review_date, signoff_role); unfalsifiable_divergences (array of objects with keys source, candidate_divergent_rule, why_no_probe_separates_them, disposition); classifier_suggestions (string: your verdict and the reason); cannot_do (array of strings); judgment_calls_surviving (array of objects with keys decision, who_makes_it, why_it_cannot_be_proceduralized).
reasoning: |-
  We are designing a procedure for handling disputes in content labeling that incorporates the philosophical insights from Kripkenstein without using technical jargon. The procedure must handle three types of disagreements: factual, divergent rule, and values-based.

  Key ideas to absorb:
  1. A rule plus past applications does not determine the next application (underdetermination).
  2. We are not hunting for a "further fact" but settling by community practice (assertibility conditions).
  3. Persistent disagreement after redrafting may mean there's no fact of the matter (not just bad drafting).
  4. A labeler might be following a divergent rule that so far agrees with all past items.

  The procedure must:
  - Have an entry condition (when to start the procedure).
  - Ordered steps with questions and what counts as a sufficient answer.
  - If a step fails, where to go next.
  - A "hard-case flag" to mark when we are in a particularly difficult case (like values-based or unfalsifiable divergence).

  Additionally, we must:
  - Distinguish three types of disagreement and route accordingly.
  - Include a rule for designing probe items to test divergent rules.
  - A stop rule: after a number of failed refinement rounds, switch to a hardcoded lookup table (issued as a decision, not clarification).
  - Decide if the classifier's suggestion can be a tiebreaker.
  - Specify who signs off and how fiat decisions are recorded and revisited.

  We are then to run the procedure on three cases.

  Finally, we must output:
  1. A table for the procedure.
  2. A table for the three cases.
  3. A JSON object with specific fields.

  Let's break down the procedure design.

  ### Procedure Design

  We'll structure the procedure as a step-by-step process. We assume we have a batch of disputed items and the associated rule that is in question.

  #### Entry Condition
  The procedure is run in the weekly 45-minute meeting. Entry condition: We have a set of disputed items (with at least two labelers disagreeing) on the application of a specific rule, and the disagreement persists after initial review (i.e., it's not a simple misreading or error).

  #### Steps

  We need to design steps that:
  1. Check for factual errors or misunderstandings (like misreading the content).
  2. Check for divergent rule interpretations (even if they agree on all past items).
  3. Check if the disagreement is actually about values.

  And we must have a way to stop and issue a fiat decision or a lookup table.

  #### Types of Disagreement and Routing
  - **Factual/Textual Disagreement**: Disagreement about what the content actually says or depicts. Solved by adding a worked example.
  - **Divergent Rule Interpretation**: Disagreement because labelers are applying a different rule that so far has coincided. Solved by designing a probe item that would distinguish the two rules. If no such probe is possible (because the distinguishing feature never occurs in our content), then record as unfalsifiable divergence and stop.
  - **Values Disagreement**: Disagreement about the desired outcome (e.g., how much over-blocking is acceptable). Escalate to higher authority (Trust and Safety, Legal, etc.).

  #### Probe Design Rule
  To design a probe item for divergent rules:
  - Identify the feature that the two interpretations hinge on (the distinguishing feature).
  - Construct a hypothetical or real item that has that feature but is otherwise as minimal as possible (to isolate the issue).
  - The probe must be such that the two rules would give different labels for that item.

  If no such item can be found (because the feature never appears in our content or is impossible to construct), then the divergence is unfalsifiable.

  #### Stop Rule
  After a fixed number of failed refinement rounds (say, 3), we stop drafting and issue a hardcoded lookup table for that class of items. The lookup table is a decision (by fiat) and not presented as a clarification. It must be recorded and revisited periodically.

  #### Classifier Suggestions as Tiebreaker?
  We are told that labelers drift toward agreeing with the classifier's suggestion. We must be cautious because this can mask real disagreements. We decide: **No**, we should not use the classifier's suggestion as a tiebreaker because it is derived from past labels and may perpetuate errors or biases. We want the labelers to think independently.

  #### Signoff and Recording Fiat Decisions
  - Fiat decisions (lookup tables or values-based escalations) must be signed off by the head of Trust and Safety or Legal (as appropriate) and recorded with:
    - Rule ID
    - Item class (description of the type of items)
    - Why drafting failed
    - The fiat decision (what the label should be for that class)
    - Review date (e.g., 6 months later)
    - Signoff role

  #### Procedure Steps

  We design the steps as a decision tree:

  Step 1: **Check for factual/textual error**  
  - Question: "Do the labelers agree on what the content actually says or depicts?"  
  - Sufficient answer: If no, then the disagreement is due to a factual error. We can resolve by providing a clear description of the content (or adding a worked example that clarifies the ambiguity).  
  - If fails (i.e., they do agree on the facts), go to Step 2.

  Step 2: **Check for divergent rule interpretation**  
  - Question: "Could the labelers be applying two different rules that, until now, have always agreed on past items?"  
  - How to check: We try to construct a probe item that would force a separation.  
  - Sufficient answer: If we can design a probe item that separates the two rules, then we can use that probe (or a real item that matches) to test and then update the rule with a new example or clarification. If we cannot design such a probe (because the distinguishing feature is not present in any item we might see), then we record an unfalsifiable divergence and stop for this rule (with a note that the rule is underdetermined in this way).  
  - If we can design a probe and we have such an item (or can create one), then we run the probe and update the rule.  
  - If fails (meaning we don't think it's a divergent rule, or we resolve it by the probe), then go to Step 3. But note: if we found an unfalsifiable divergence, we stop and mark as such.

  Step 3: **Check for values-based disagreement**  
  - Question: "After resolving factual and rule-based issues, do the labelers still disagree because they have different ideas about what the outcome should be (e.g., one thinks it's more important to avoid blocking legitimate content, the other thinks it's more important to block harmful content)?"  
  - Sufficient answer: If yes, then we escalate to Trust and Safety and Legal for a values decision. They will make a call based on policy and values.  
  - If no, then we have a persistent disagreement that might be due to the open texture of the rule. We then go to the stop rule.

  Step 4: **Stop Rule Handling**  
  - We count how many times we have tried to redraft this rule for this class of items. If it's less than 3 (or a set number), we try to redraft.  
  - If it's 3 or more, we stop and issue a hardcoded lookup table (by fiat).  
  - The lookup table is a decision: for items with these features, label X.  
  - We record this as a fiat decision and schedule a review.

  But note: we must also account for the case where we have already tried multiple times. So we need to track the number of refinement rounds per rule per item class.

  #### Hard-case Flag
  We set a hard-case flag when:
  - We have an unfalsifiable divergence (Step 2, when we cannot design a probe).
  - We have a values-based disagreement (Step 3).
  - We hit the stop rule and issue a lookup table.

