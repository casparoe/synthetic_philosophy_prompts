answer: |-
  ### Procedure: Rule Dispute Resolution Protocol  
  **Entry Condition**: A batch of disputed items where at least two labelers disagree on rule application after initial review (no misreadings), and the dispute persists through one prior discussion.

  | Step | Entry Condition | Question to Ask | What Counts as Sufficient Answer | If It Fails, Go To | Hard-Case Flag |
  |------|-----------------|-----------------|----------------------------------|-------------------|----------------|
  | 1    | Dispute entered | "Do all labelers agree on what the content **actually says or depicts** (e.g., words in text, objects in image)?" | Clear "yes" with no ambiguity in descriptive facts. Add a worked example to the guideline if "no." | Step 2 | No |
  | 2    | Step 1 passed (facts agreed) | "Could the labelers be using **two different rules** that only disagree on items we’ve never seen before?" | If "no," proceed. If "yes," design a probe item (see JSON for rules). If a probe exists and can be tested, resolve with it. If no probe can separate the rules, record unfalsifiable divergence and stop. | Step 3 | Yes (if unfalsifiable) |
  | 3    | Step 2 passed (no divergent rule found) | "Is the disagreement about **what outcome we want** (e.g., blocking too much vs. too little) rather than what the rule says?" | If "no," proceed. If "yes," escalate to Trust & Safety/Legal. | Step 4 | Yes |
  | 4    | Step 3 passed (not values-based) | "How many times have we redrafted this rule for **this specific ambiguity**?" | If ≤2 redrafts, redraft now and test on disputed items. | Stop (resolved) | No |
  | 5    | Step 4 failed (≥3 redrafts) | N/A (auto-trigger) | N/A | Stop | Yes |
  **Stop at Step 5**: Issue a hardcoded lookup table (e.g., "Satire about public figures: always label as [X]"). Signed off by Trust & Safety Lead.  

  ---

  ### Worked Cases  

  | Case | Step Entered | Steps Run (Order) | Outcome | Settled By | Residual Risk | What Asker Will Dislike |
  |------|--------------|-------------------|---------|------------|---------------|-------------------------|
  | (i) AI-generated image dispute | 1 | 1 → 2 → 3 | Escalated to Trust & Safety. Probe designed: "AI image of fully clothed person in suggestive pose." | Values | Values decision may not cover future edge cases. | Escalation feels like "passing the buck." |
  | (ii) Unexpected rule application | 1 | 1 → 2 | Probe designed: past item modified with new feature. Test confirmed divergence. Rule updated with example. | Convention | None. Rule now covers the feature. | None (ideal resolution). |
  | (iii) Satire after 3 redrafts | 1 | 1 → 2 → 3 → 5 | Hardcoded lookup table: "Satire about public figures: label as political speech." | Fiat (convention after stop rule) | Over-blocking satire; backlash from users. | Hardcoding feels rigid, but stops drafting. |

