               - if coin tails, you get 0 - 1 = -1
          If you don't pay, you get 0.

          Without conditioning, the expected value of paying is: 
               0.5*2.5 + 0.5*(-1) = 1.25 -0.5 = 0.75
               expected value of not paying: 0.
          So you might choose to pay.

          After seeing the note, if it says "Heads", the probability of heads is 0.75, so EV of paying = 0.75*2.5 + 0.25*(-1) = 1.875 -0.25 = 1.625 >0, so you might keep it.
          If it says "Tails", the probability of heads is 0.25, so EV of paying = 0.25*2.5 + 0.75*(-1) = 0.625 -0.75 = -0.125, so you might change to not pay.

          If you change, you avoid the -0.125 expected value, at a cost of 0.1, so it's worth it.

          So in Round 1, conditioning is beneficial.

     Round 2: the branch-based as above.

     Now, the surface form is different: in Round 1, there is no branch, only a coin flip. In Round 2, there is a branch. But the activity procedure is similar: 
          - You have an envelope.
          - You precommit to an action ( which in Round 1 is " to pay" or not, in Round 2 is " to take only box A" or not which we can call " to pay 1 for the right to get the box A reward in Branch B").
          - Then you see the note.
          - Then you can change at a cost.
          - Then the branch/coin is revealed.

     We can try to run both.

     Given the time, and that the requester wants 
          - two rounds with the same surface form
          - and for the second round to have a biased coin (4:1) so that Branch B is rare.

     I will provide the full activity for both rounds.

     Stakes: we'll use raffle tickets. One raffle ticket = one entry in a draw for a book. Or use small chocolates.

     Timeline for the activity (75 minutes):

     - 5 min: introduction to the activity, explain the first round.
     - 10 min: Round 1 precommit and then reveal note and change opportunity.
     - 10 min: Round 1 coin flip and resolve.
     - 5 min: quick debrief of Round 1: when is it good to condition on new information? (When it allows you to avoid choices with negative conditional expected value.)

     - 5 min: explain Round 2.
     - 10 min: Round 2 precommit and then reveal note and change opportunity.
     - 10 min: Round 2 branch coin flip and resolve.
     - 20 min: debrief.

     Debrief for Round 2 should bring out:
          - In Round 2, conditioning (changing based on the note) seems locally advantageous in the rare branch (Branch B) in some cases, but globally it lowers expected value.
          - The policy of committing and then not conditioning yields higher expected value.
          - The predictor's accuracy is based on your initial commitment. If you change, the note does not change, and in this case, the note was based on the initial choice.

     The thing that is missing: in the real world, the predictor is logical and knows what you will do in the end. In our activity, the predictor is only 75% accurate for the initial choice. So to simulate the logical counterfactual, we would need the predictor to be perfect. But we can explain that in the debrief.

     The economist might object that the predictor in Round 2 is not strategically forward-looking. We can explain that in the idealised case, the predictor is perfect and knows your final choice, which creates a binding commitment.

     What will go wrong: 
          - In Round 2, participants might not understand the setup.
          - In Round 2, when in Branch B and they see the note, they will want to change to both boxes because locally it is better, not realizing the global expected value.

     To mitigate, we can provide a handout with the payoff structure.

     Given the complexity, I will now provide the detailed instructions for the activity.

