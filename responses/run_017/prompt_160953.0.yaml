  Round 2: A situation where conditioning on new information leads to a mistake, and the policy of precommitting without conditioning is superior.

  In Round 2, we use a biased coin (e.g., 4:1) so that the rare branch (where they are asked) is less likely. We want the numbers to be such that they can compute the break-even point.

