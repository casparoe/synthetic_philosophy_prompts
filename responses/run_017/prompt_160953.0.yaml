answer: |-
  Below is a runnable activity for your decision theory reading group, designed to create an experiential understanding of policy commitment without conditioning on new information. The activity uses contrasting rounds to highlight when conditioning is rational (Round 1) vs. when it undermines a pre-commitment (Round 2), with non-monetary stakes (e.g., raffle tickets for a book) and a focus on one-shot play. The debrief explicitly addresses the gap between *refusing to condition* and *failing to use free evidence*.

  ---

  ### **Activity: The Envelope Experiment**  
  **Duration:** 60-70 minutes (within 75-minute session)  
  **Materials:**  
  - Envelopes (one per participant per round)  
  - Raffle tickets (or chocolate coins, etc.)  
  - Two coins: one fair (50/50), one biased (80/20)  
  - Pre-commitment slips (small papers for written answers)  

  ---

  ### **Round 1: When Conditioning is Correct**  
  **Setup (5 min):**  
  - Explain: *"You’ll see a prediction about a coin flip. You can pay 1 raffle ticket to bet that the prediction is correct. If you win, you gain 3 tickets (net +2). If you lose, you lose your 1 ticket. Before seeing the prediction, you’ll pre-commit to betting or not."*  
  - **Prediction:** An assistant flips a fair coin in advance and writes the outcome ("Heads" or "Tails") in an envelope. The predictor is 75% accurate (simulate: if the actual flip is Heads, note says "Heads" 75% of the time, "Tails" 25%).  
  - **Payoff:**  
    - Bet + correct prediction: Win 3 tickets (net +2).  
    - Bet + wrong prediction: Lose 1 ticket.  
    - No bet: 0.  

  **Flow:**  
  1. **Pre-commit (5 min):**  
     - Participants write **"Yes"** (bet) or **"No"** (no bet) on a slip without opening the envelope. Collect slips.  
  2. **Reveal & Change Offer (5 min):**  
     - Let participants open envelopes and see the prediction.  
     - *"You can change your initial decision for a fee of 0.5 tickets. Write your FINAL answer (Yes/No)."*  
     - Collect final answers.  
  3. **Resolution (5 min):**  
     - Flip the fair coin publicly.  
     - Resolve payoffs based on final answers.  

  **Why Conditioning Works Here:**  
  - The prediction provides independent evidence about the coin. If the note says "Tails," the probability of tails is 75%. Updating avoids losses (e.g., betting on "Tails" when tails is likely). Changing your decision after seeing the note is rational.  

  ---

  ### **Round 2: When Conditioning is the Mistake**  
  **Setup (5 min):**  
  - Explain: *"Now, a different scenario. There are two branches: a common one (80% chance) where you’re never asked to bet, and a rare one (20% chance) where you are. You pre-commit to a betting policy. A predictor guesses your policy with 75% accuracy."*  
  - **Prediction:** The envelope contains a note ("Bet" or "No Bet") based on your pre-commitment.  
  - **Payoff:**  
    - **Branch A (80%):** You get 1 ticket automatically (no choice).  
    - **Branch B (20%):**  
      - If you pre-committed to **"Yes"** and predictor matched ("Bet"): Win 10 tickets.  
      - If you pre-committed to **"Yes"** but predictor mismatched ("No Bet"): Lose 1 ticket.  
      - If you pre-committed to **"No"**: Get 0.  
  - **Change Cost:** 0.5 tickets to alter your policy after seeing the note.  

  **Flow:**  
  1. **Pre-commit (5 min):**  
     - Participants write **"Yes"** or **"No"** based on policy (not knowing the branch). Collect slips.  
  2. **Reveal & Change Offer (5 min):**  
     - Let participants open envelopes and see the predictor’s note.  
     - *"You can change your policy for 0.5 tickets. Write your FINAL answer."*  
     - Collect final answers.  
  3. **Resolution (5 min):**  
     - Flip the biased coin (80% Branch A, 20% Branch B).  
     - If Branch B, resolve payoffs based on final policy and predictor’s note.  

  **Why Conditioning Fails Here:**  
  - Pre-committing to "Yes" is optimal (EV = 1.3 tickets). If you see "No Bet" (predictor doubted you), changing to "No" seems locally rational (avoids Branch B loss) but costs 0.5 tickets and sacrifices the global benefit of commitment. In Branch A, changing also forfeits 0.5 tickets.  
  - **Break-even analysis:** Participants can compute that changing when seeing "No Bet" reduces EV from 1.3 to 1.0 tickets.  

  ---

  ### **Debrief (20 min)**  
  **Guided Questions:**  
  1. *"What felt different between the rounds? When did updating help, and when did it hurt?"*  
     - Target: Surface the contrast. Round 1’s prediction was evidence about an *external state*; Round 2’s was evidence about *their own commitment*.  

  2. *"In Round 2, why might someone change after seeing ‘No Bet’? What does that ignore?"*  
     - Target: Highlight the policy’s global optimality. Changing ignores that the predictor’s note was based on their pre-commitment, not their "true" nature.  

  3. *"Is paying to change your policy in Round 2 just pushing the problem back? Can a policy-first view evaluate this?"*  
     - Target: The change offer is a new decision node, but the policy (e.g., *"never change after seeing the note"*) must be pre-committed too. A policy-first view evaluates the *entire strategy tree* upfront.  

  **Key Distinctions to Clarify:**  
  - **Refusing to condition ≠ Ignoring evidence:**  
    - *Refusing to condition* means you don’t let *logically dependent* information (e.g., a predictor guessing your choice) override your policy.  
    - *Failing to use evidence* is ignoring *independent* information (e.g., Round 1’s prediction).  
  - **Policy-first ≠ Willpower:**  
    - Willpower is about resisting temptation. Policy-first is *logically* rejecting conditioning when it creates a contradiction (e.g., "If I condition, the predictor’s note becomes unreliable").  

  **Predictable Objections & Solutions:**  
  1. *"The predictor is impossible!"* (Economist’s sigh):  
     - **Acknowledge:** "Yes, a perfect predictor requires logical omniscience. Here, the coin simulates the *structure* of counterfactual dependence. Real-world versions (e.g., addiction) use statistical cues, not gods."  
     - **Reframe:** "The point is the *type of dependency*: Round 2’s predictor’s note isn’t neutral evidence—it’s a function of your policy."  

  2. *"It’s about being the sort of person who..."*:  
     - **Pushback:** "Notice Round 2 didn’t reward ‘being trustworthy’—it rewarded *pre-committing to a policy and sticking to it*. The ‘sort of person’ is an output, not an input."  

  **Limitation of the Activity:**  
  - **Counterfactual is physical, not logical:** The coin *physically* determines the branch, but in ideal cases (e.g., Newcomb’s Paradox), the predictor *logically infers* your choice.  
  - **Address Post-Activity:** "In real life, ‘what you would have done’ is a fact about your decision procedure, which an idealized predictor could deduce. Here, we used a coin to simulate that dependency. The takeaway is the *structure*: when evidence depends on your policy, conditioning can create self-defeating loops."  

  ---

  ### **Timeline**  
  - **0:00–0:05:** Introduce activity, Round 1 rules.  
  - **0:05–0:20:** Run Round 1 (pre-commit → reveal → change → resolve).  
  - **0:20–0:25:** Quick Round 1 debrief ("Why did updating help here?").  
  - **0:25–0:30:** Explain Round 2 rules.  
  - **0:30–0:45:** Run Round 2 (pre-commit → reveal → change → resolve).  
  - **0:45–1:05:** Structured debrief (questions above + distinctions).  
  - **1:05–1:15:** Address objections, clarify limitations.  

  ---

  This design forces participants to confront the tension between conditioning and commitment through lived choices, not abstract labels. The biased coin in Round 2 "squeezes" them by making the costly branch rare, and the numbers allow self-discovery of break-even points. By ending with a debrief that explicitly separates *refusing to condition* from *ignoring evidence*, you anchor the discussion to your real-world struggle: re-opening a decision isn’t a "failure"—it’s a symptom of not distinguishing dependent from independent information.
