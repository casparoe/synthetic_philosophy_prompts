prompt: |-
  I'm a backend engineer, been doing this maybe nine years, no philosophy background beyond one required course I mostly slept through. I own the telemetry pipeline at a ~250 person company that makes scheduling software. Concretely there are three groups in our data: admins at big hospital systems (paying, loud, they have an account manager they can email), the front-desk staff who actually sit in the UI eight hours a day, and the patients who get reminder texts and show up in our tables as a phone number plus a boolean for whether they no-showed.

  I got into this because of a thing that happened last quarter. We shipped a change that silently broke reminder delivery for a chunk of patients; it took six weeks to notice; and the only signal we had was a regional bump in the no-show rate, which in the incident review got described as those patients being flaky. Nobody had lied, the data just had nothing else to say. Around the same time I stumbled into reading a couple of things about archives and power — the gist I got out of it was that an archive isn't a neutral pile of what happened, it's shaped by who was in a position to write things down, and that the gaps are made rather than just found. And now we're about to train a "smart scheduling" model on two years of these logs, so whatever we happened to record is about to become a pretty hard definition of who our user is.

  What I want from you is a procedure, not an essay. I run an instrumentation review maybe twice a sprint, plus a quarterly retention pass, so this is a recurring decision, not a one-off. It needs to be runnable in fifteen or twenty minutes by an engineer who has never thought about any of this, and it needs to fit on one page.

  So: the questions to ask in order, and what actually counts as an acceptable answer to each rather than hand-waving. Where it hard-stops with a "no, don't ship this event / don't make this change." Where it has to hand the decision to a person because the question is really about values, and which person — me, legal, the PM. And what gets written down afterwards and where, because I want some kind of absence register: a place that says we chose not to record X and why, so that in two years someone doesn't read the gap as nothing having happened.

  A few things it has to be able to handle, because these are the ones I keep hitting:

  - People who only exist as a leftover. Total sessions minus sessions we can attribute, that kind of thing. I've started calling them ghost users. There should be a question that surfaces them and asks what it would cost to make them visible at all.
  - Silences that travel. I made up the term "silence inheritance" for when the warehouse inherits a gap from the client SDK, so no amount of reprocessing downstream fixes it and everyone assumes it's fixed. The procedure should catch that whole class, not just the obvious "we never logged it."
  - The fact that some absences are load-bearing and good. I really don't want a procedure whose output is "log more," because we're under a GDPR-ish regime, deletion requests are real, and some of what we hold we probably shouldn't hold: the free-text "reason" field on the patient-facing cancellation form sometimes contains why someone can't make an appointment, which is close to medical detail. So there has to be a step that says don't record this, and a way to mark that down so people don't infer from the blank that nobody ever gave a reason.
  - Deletion asymmetry: the people most visible in the data are also the ones who know how to get themselves deleted, and the people who are only a residual don't know we have a record and have no way to contest what it says. That should be a question too.
  - And be honest about what the procedure can't do — which steps are judgment calls wearing a checklist as a costume.

  Then run it on three cases. One: a new event for a "bulk reschedule" button that only enterprise admins can even see. Two: a cost proposal to sample free-tier sessions down to two percent and drop a few fields, which I expect to be a no — I want to see exactly where it fails and what the cheapest thing that passes would be. Three, the one I'll like least: we currently log that free-text cancellation-reason field at full fidelity, forever, and it feeds three dashboards, one of which a VP looks at weekly. I'm fairly sure the procedure is going to tell me we shouldn't have it and I do not want to be the one who says that out loud, so tell me plainly what it says, what complying costs us, what we'd actually lose the ability to know, and if it turns out the procedure can't settle it and it's just a values call for a person, say that instead.

  Assume I'm smart about systems and dumb about theory: translate, don't gesture. And please write it in plain language — if a step needs a concept, define it in the step.
reasoning: |-
  We are designing an "Instrumentation Review Checklist" that is:
  - One page
  - Runnable in 15-20 minutes by an engineer without theoretical background
  - Recurring (for each event or change)
  - Outputs: a clear decision (pass, fail, or escalate) and an "absence register" entry for gaps we choose to leave

  The checklist will have a series of questions in order. Each question must have:
  - A clear, plain language question
  - What counts as an acceptable answer (and what doesn't)
  - When it's a hard stop (fail) and when it escalates to a person (and which person)
  - What to write down and where (for the absence register)

  The checklist must handle:
  1. Ghost users (residuals)
  2. Silences that travel (inherited gaps)
  3. Load-bearing absences (intentional gaps for privacy/legal reasons)
  4. Deletion asymmetry

  And be honest about what is a judgment call.

  We'll then run the checklist on three examples.

  ---

  **Instrumentation Review Checklist**

  **Purpose:** To ensure telemetry events are designed to capture necessary data without creating harmful gaps, biases, or privacy risks, and to document intentional gaps.

  **Input:** A proposed event schema change or new event definition, including:
  - What data is recorded (fields, types)
  - Where it is recorded (client, server, etc.)
  - Sampling or filtering rules
  - Retention period
  - Any changes to existing events

  **Output:** 
  - Decision: Pass, Fail, or Escalate (with who to escalate to)
  - An entry in the Absence Register (if there's an intentional gap) stored in a shared document (e.g., a wiki page titled "Telemetry Absences Register")

  **Steps:**

  **1. Ghost Users Check**
     - *Question:* Can this event (or change) leave any user group (especially non-paying, non-logged-in, or low-privilege users) as a residual (i.e., only measurable as a total minus attributed users)? If so, what would it cost (in engineering time) to make them visible?
     - *Acceptable Answer:* 
       - "No ghost users are created." OR
       - "Ghost users would be created, but the cost to make them visible is [X hours/days] and we have a ticket to address it by [date]." OR
       - "Ghost users are created and we intentionally leave them as residual because [reason]." (Then document in Absence Register.)
     - *Unacceptable:* Ignoring the possibility of ghost users.
     - *Hard Stop:* If ghost users are created and there's no plan to address it (or the reason for leaving them isn't documented).
     - *Escalate:* If the cost to make them visible is high and the business impact is unclear, escalate to the PM (Product Manager) to prioritize.
     - *Absence Register Entry:* If leaving ghost users, document: 
       - User group affected 
       - Reason for not instrumenting 
       - Potential impact of the gap

  **2. Silence Inheritance Check**
     - *Question:* Could gaps in this data (missing events) be caused by upstream issues (e.g., client-side sampling, network failures, SDK errors) and become invisible downstream? How?
     - *Acceptable Answer:* 
       - "We have a way to detect and alert on gaps (e.g., client-side error logging, heartbeat events, or server-side consistency checks)." OR
       - "We accept that gaps will be inherited and have documented the limitations in [place]." (Then document in Absence Register.)
     - *Unacceptable:* Not considering upstream gaps or assuming gaps can be fixed in the warehouse.
     - *Hard Stop:* If the event is critical (e.g., billing, core user action) and there's no way to detect gaps.
     - *Escalate:* If the detection method is complex or costly, escalate to the telemetry team lead (you) for design.
     - *Absence Register Entry:* Document the inherited silence risk and any mitigation (or reason for accepting it).

  **3. Load-Bearing Absence Check**
     - *Question:* Is there any data we are choosing NOT to record (or redact/sample) for privacy, legal, or ethical reasons? Why?
     - *Acceptable Answer:* 
       - "No, we record everything relevant." OR
       - "Yes, we omit [specific field/data] because [reason, e.g., GDPR, sensitive info]." (Then document in Absence Register.) 
     - *Unacceptable:* Recording sensitive data without justification.
     - *Hard Stop:* If the data is clearly prohibited (e.g., medical info in non-HIPAA-compliant systems) and we have no legal approval.
     - *Escalate:* If the sensitivity is unclear, escalate to Legal/Compliance. If it's a values call (e.g., "should we record this free-text?"), escalate to the PM and Legal.
     - *Absence Register Entry:* Document the omitted data, the reason, and how we avoid inferring false negatives (e.g., "We do not record cancellation reasons to protect patient privacy; a blank reason does not imply no reason was given").

  **4. Deletion Asymmetry Check**
     - *Question:* If a user requests deletion, can we fully remove their data? Are there user groups (e.g., ghost users) who cannot request deletion? How do we handle that?
     - *Acceptable Answer:* 
       - "All users (including residuals) are covered by our deletion process [link to process]." OR
       - "Ghost users cannot self-request deletion, but we [describe process, e.g., auto-delete after 90 days, or manual review by support]." (Document gaps in Absence Register.)
     - *Unacceptable:* Not considering deletion for ghost users.
     - *Hard Stop:* If we have no deletion process for a user group and the data is PII.
     - *Escalate:* If the process for ghost users is undefined, escalate to Legal and PM.
     - *Absence Register Entry:* Document any user groups with limited deletion rights and the reasons.

  **5. Judgment Call Acknowledgment**
     - *Question:* Review the answers above. Are any of them based on judgment calls (e.g., cost vs. benefit of fixing ghost users, privacy trade-offs) that should be re-examined later?
     - *Action:* If yes, note in the Absence Register that the decision was a judgment call and set a review date (e.g., 6 months). Escalate to the PM if the judgment has high risk.

  **Final Decision:**
  - If all steps are passed (with documentation if needed): **Pass**
  - If any hard stop is hit: **Fail** (do not ship without rework)
  - If escalated: **Escalate to [Role]** (do not ship until resolved)

  ---

  **Running the Checklist on Three Cases**

  **Case 1: New event for "bulk reschedule" button (only visible to enterprise admins)**

  1. **Ghost Users Check:** 
     - Only enterprise admins can see the button. No ghost users created because all users who can trigger this event are attributed (they are logged-in admins). 
     - *Answer:* "No ghost users created." → Pass.

  2. **Silence Inheritance Check:**
     - This is a server-side event (triggered by an API call). Gaps would be rare (server logs are reliable) and we have monitoring for API errors. 
     - *Answer:* "We have server-side monitoring." → Pass.

  3. **Load-Bearing Absence Check:**
     - The event logs: admin ID, time, number of appointments rescheduled. No sensitive data. 
     - *Answer:* "No sensitive data omitted." → Pass.

  4. **Deletion Asymmetry Check:**
     - Admins can request deletion via account managers. We have a process. 
     - *Answer:* "Deletion process covers these users." → Pass.

  5. **Judgment Call:** None. 
  - **Decision:** Pass. No Absence Register entry needed.

  **Case 2: Cost proposal to sample free-tier sessions to 2% and drop fields**

  *Context:* Currently, we log every session for free-tier users. Proposal: sample to 2% and drop fields like "device_id" and "browser_version".

  1. **Ghost Users Check:**
     - Free-tier users are already attributed (they are logged-in front-desk staff). But sampling could create ghost sessions: 98% of sessions become residual and invisible. 
     - *Answer:* "Ghost sessions would be created. Cost to avoid: full logging (current) costs [X], keeping 100% but dropping fields costs [Y]." 
     - *Escalate to PM:* Because we need a business decision on whether losing 98% of free-tier session data is acceptable. The engineer cannot decide.
     - *If escalated and PM says "acceptable":* Document in Absence Register: "Free-tier sessions are sampled at 2%; the 98% gap is intentional for cost savings. We cannot analyze rare issues in free-tier."

  2. **Silence Inheritance Check:**
     - Sampling is a deliberate silence. Downstream, the 98% gap is inherited and invisible (warehouse sees only 2%). 
     - *Answer:* "We document the sampling in the Absence Register and in warehouse metadata." → Pass (if documented).

  3. **Load-Bearing Absence Check:**
     - Dropping "device_id" and "browser_version" omits data. Reason: cost reduction. 
     - *Answer:* "We omit these fields to reduce storage." → Document in Absence Register: "Free-tier sessions no longer include device_id or browser_version. We cannot debug device-specific issues for free-tier."

  4. **Deletion Asymmetry Check:**
     - Free-tier users can request deletion. Our deletion process works on sampled data too. 
     - *Answer:* "Deletion process still works." → Pass.

  5. **Judgment Call:** The sampling rate and field drops are business trade-offs. Set a review date.
  - **Decision:** Escalate to PM for approval of sampling. If approved, document in Absence Register. Without approval, it's a Fail.

  **Cheapest Passing Alternative:** Keep 100% of sessions but drop non-essential fields (saves storage but not ingestion cost). Or sample at a higher rate (e.g., 20%) if PM accepts.

  **Case 3: Logging free-text cancellation reason (current practice)**

  *Context:* We log this field at full fidelity forever. It feeds dashboards, including one for a VP.

  1. **Ghost Users Check:** 
     - Not applicable (we log it for all cancellations). → Pass.

  2. **Silence Inheritance Check:**
     - If the client fails to send the reason, it's a gap. We don't have a way to distinguish "no reason given" from "failed to log". 
     - *Answer:* "We have no gap detection." → Hard stop? Not yet; we can document the risk. But we need to fix: add a separate event for "cancellation attempted" to detect gaps? Or log even if the reason is blank? 
     - *Escalate to you (telemetry lead):* Design a fix to detect silences.

  3. **Load-Bearing Absence Check:**
     - This field is high risk: free-text may contain medical info (e.g., "I have cancer"). We are not a HIPAA-compliant system? 
     - *Answer:* "We record it, but it's sensitive." → Hard Stop: If we are under GDPR and this is special category data, we likely shouldn't record it without safeguards. 
     - *Escalate to Legal:* Immediately. 
     - *Legal says:* "This is prohibited without explicit consent and encryption." → We must stop logging it. 
     - *Absence Register Entry:* "We do not log cancellation reasons to protect patient privacy. A blank reason does not imply no reason was given."

  4. **Deletion Asymmetry Check:**
     - Patients can request deletion, but the reason text might not be deleted (if it's in logs without user ID?) → We need to ensure it's tied to a user and deletable. 
     - *Answer:* "Currently, it is tied to a patient and deletable." → But if we stop logging, this becomes moot.

  5. **Judgment Call:** High-risk privacy issue.

  **Procedure Output:**
  - **Fail** at Step 3 (Load-Bearing Absence). Escalate to Legal. If Legal says it's prohibited, then we must stop logging the field.
  - **What Complying Costs:** 
    - We remove the field from logs. 
    - Dashboards break. We lose the ability to know why patients cancel (for the VP's dashboard and others).
    - We must document the absence in the Absence Register to avoid misinterpreting blanks.
  - **Alternative:** 
    - If Legal allows, we could hash the reason for anonymity? But then it's useless for dashboards. 
    - Or we could replace it with a set of checkboxes (non-free-text) that are safe to log. This requires UI changes but keeps some data.
  - **Values Call:** If Legal says it's a gray area, then it becomes a values call: the PM (with input from the VP) must decide if the business insight is worth the privacy risk. But given the sensitivity, the procedure strongly leans toward not logging.

  **Conclusion for Case 3:** The procedure says: Stop logging this field. Document the absence. Work with PM to create a safe alternative (e.g., predefined reasons). The VP loses the dashboard but avoids legal risk.

  ---

  **Final Notes:**
  - The checklist is a tool to force explicit decisions, not a substitute for thinking.
  - The Absence Register is key: it turns "nothing" into "a documented nothing."
  - For judgment calls, the checklist makes them visible and escalates them.
  - Translate this into a one-page checklist format for your team.
answer: |-
  Below is a **Telemetry Gap Audit Checklist**, designed as a one-page, 15–20 minute procedure for reviewing telemetry events/changes. It’s structured as a linear flow of questions, with clear rules for acceptable answers, hard stops, escalations, and documentation. Each step defines concepts in plain language and includes instructions for the Absence Register (a shared wiki/database for intentional gaps).  

  ---

  ### **Telemetry Gap Audit Checklist**  
  **Input:** Proposed event schema, field change, or sampling strategy.  
  **Output:** Pass (✅), Fail (❌), or Escalate (⚠️). **Always document outcomes.**  
  **Who:** Engineers, PMs, or data stewards. Timebox: 20 mins max.  

  ---

  #### **Step 1: Identify Ghost Users**  
  **Question:** Could this event/change create "ghost users" (e.g., unattributed sessions, indirect IDs like IPs, or users only inferred via totals)? What would it cost (engineering hours) to attribute them?  
  - **Ghost Users**: Users visible only as residuals (e.g., "total logins - attributed logins = ghosts").  
  - **Acceptable Answer**:  
    - ✅ "No ghost users possible."  
    - ✅ "Ghost users possible, but cost to fix is ≤2 hours. Ticket #[ID] to fix."  
    - ✅ "Ghost users intentional. Cost to fix is [X] hours, but we won’t because [reason]." → **Document in Absence Register**.  
  - **Unacceptable**: Ignoring ghosts or vague "we’ll fix it later."  
  - **Hard Stop (❌)**: Ghost users exist + no plan to fix + cost to fix is low (≤8 hours).  
  - **Escalate (⚠️)**: Cost >8 hours → Escalate to **PM** to prioritize.  
  - **Absence Register Entry**:  
    ```markdown
    - **Gap Type**: Ghost users  
    - **User Group**: [e.g., "patients without accounts"]  
    - **Reason**: [e.g., "Cost to attribute: 40 hours. Business priority low."]  
    - **Impact**: [e.g., "We cannot analyze no-shows for unauthenticated users."]  
    ```

  #### **Step 2: Check for Silence Inheritance**  
  **Question:** Could gaps in this data become invisible downstream? (e.g., client-side sampling, network errors, or SDK drops that warehouse ETL can’t fix.)  
  - **Silence Inheritance**: Gaps that start at the source (e.g., client) and propagate silently to analytics.  
  - **Acceptable Answer**:  
    - ✅ "No upstream gaps possible (server-side event)."  
    - ✅ "Gaps possible, but we detect them (e.g., client error logs, heartbeat events)."  
    - ✅ "Gaps inherited intentionally. Downstream docs warn about this." → **Document in Absence Register**.  
  - **Unacceptable**: "We’ll reprocess data later" (won’t fix inherited gaps).  
  - **Hard Stop (❌)**: Critical event (e.g., payments) + no gap detection.  
  - **Escalate (⚠️)**: Gap detection complex? → Escalate to **Telemetry Lead** (you).  
  - **Absence Register Entry**:  
    ```markdown
    - **Gap Type**: Silence inheritance  
    - **Source**: [e.g., "SDK network failures"]  
    - **Mitigation**: [e.g., "No detection; assume data is incomplete"]  
    - **Impact**: [e.g., "Bias: Urban clinics overrepresented due to better connectivity."]  
    ```

  #### **Step 3: Assess Load-Bearing Absence**  
  **Question:** Should we *avoid* recording this data for ethical/legal reasons (e.g., GDPR, sensitive info)? If we omit it, how do we prevent misinterpreting "blank" as "didn’t happen"?  
  - **Load-Bearing Absence**: Intentional gap to reduce risk (e.g., not logging medical details).  
  - **Acceptable Answer**:  
    - ✅ "No sensitive data."  
    - ✅ "We omit [field] because [legal/ethical risk]. We’ll add a placeholder (e.g., `reason_omitted: true`)." → **Document in Absence Register**.  
  - **Unacceptable**: Logging PII/health data without justification.  
  - **Hard Stop (❌)**: Field contains prohibited data (e.g., health info in non-HIPAA system).  
  - **Escalate (⚠️)**: Risk unclear? → Escalate to **Legal/Compliance**.  
  - **Absence Register Entry**:  
    ```markdown
    - **Gap Type**: Load-bearing absence  
    - **Field Omitted**: [e.g., "cancellation_reason"]  
    - **Reason**: [e.g., "GDPR: Avoids health data exposure."]  
    - **Placeholder**: [e.g., "`cancellation_reason_omitted: true` added to event"]  
    ```

  #### **Step 4: Test Deletion Asymmetry**  
  **Question:** If a user requests deletion, can we delete *all* their data? Are ghost users unable to request deletion?  
  - **Deletion Asymmetry**: Privileged users (e.g., admins) can delete data; ghost users cannot.  
  - **Acceptable Answer**:  
    - ✅ "All users covered by deletion process [link]."  
    - ✅ "Ghost users can’t self-delete, but we auto-delete after [time]."  
    - ✅ "Ghost users can’t be deleted. Reason: [explain]." → **Document in Absence Register**.  
  - **Unacceptable**: Ghost user data retained indefinitely with no process.  
  - **Hard Stop (❌)**: Ghost user PII + no auto-deletion.  
  - **Escalate (⚠️)**: Deletion process undefined? → Escalate to **Legal + PM**.  
  - **Absence Register Entry**:  
    ```markdown
    - **Gap Type**: Deletion asymmetry  
    - **User Group**: [e.g., "unauthenticated patients"]  
    - **Deletion Process**: [e.g., "Auto-delete after 90 days"]  
    - **Risk**: [e.g., "Ghost users can’t contest data accuracy."]  
    ```

  #### **Step 5: Flag Judgment Calls**  
  **Question:** Are any answers above based on judgment (e.g., cost vs. risk)? If yes, who owns this call?  
  - **Judgment Call**: Subjective trade-off (e.g., "privacy vs. insight").  
  - **Action**:  
    - ✅ Document judgments in Absence Register.  
    - ⚠️ High-risk? Escalate to **PM** (for cost/impact) or **Legal** (for compliance).  
  - **Absence Register Entry**:  
    ```markdown
    - **Judgment Call**: [e.g., "Sampled free-tier data to save costs"]  
    - **Owner**: [Role, e.g., "PM"]  
    - **Review Date**: [e.g., "Re-evaluate in 6 months"]  
    ```

  ---

  ### **Summary Workflow**  
  1. Run Steps 1–5 in order.  
  2. If any ❌: **Fail** – Do not ship. Rework and re-audit.  
  3. If all ✅: **Pass** – Ship.  
  4. If ⚠️: Escalate – Pending approval.  
  5. **Always**: Update the Absence Register for gaps, omissions, or judgments.  

  ---

  ### **Test Runs on Your Cases**  
  **Case 1: New "Bulk Reschedule" Event (admins only)**  
  - **Step 1**: No ghost users (only attributed admins). ✅  
  - **Step 2**: Server-side event → no silence inheritance. ✅  
  - **Step 3**: Logs admin ID + action → not sensitive. ✅  
  - **Step 4**: Admins can request deletion via account managers. ✅  
  - **Step 5**: No judgments. ✅  
  - **Outcome**: ✅ **Pass**. No Absence Register entry.  

  **Case 2: Sample Free-Tier Sessions to 2% + Drop Fields**  
  - **Step 1**: Ghost users? ✅ *Yes, 98% of free-tier sessions become ghosts. Cost to fix (100% logging) = minimal storage $. Unacceptable without justification.* ❌ **Hard Stop**.  
    - **Rework**: Keep 100% logging but drop non-essential fields (e.g., `device_id`). Re-run:  
      - Step 1: No ghosts (all sessions logged). ✅  
      - Step 2: Sampling removed → no silence inheritance. ✅  
      - Step 3: Dropped fields → not sensitive. ✅  
      - Step 4: Free-tier users can request deletion. ✅  
      - Step 5: Judgment call for dropping fields. ✅ *Document in Absence Register.*  
  - **Outcome**: ✅ **Pass** (with Absence Register entry for field drops).  
  - **Cheapest Passing Option**: Keep 100% volume, drop high-cardinality fields (e.g., `device_id`).  

  **Case 3: Logging Free-Text Cancellation Reason (Current Practice)**  
  - **Step 1**: No ghost users (logged for all cancellations). ✅  
  - **Step 2**: Client-side gap risk (e.g., network failure). ❌ *No detection → silence inheritance.* **Escalate to Telemetry Lead** for gap detection (e.g., add a `cancellation_attempted` event).  
  - **Step 3**: Load-bearing absence? ✅ *Field contains health data (e.g., "chemo appointment").* ❌ **Hard Stop** – GDPR risk. Escalate to **Legal**.  
    - **Legal Verdict**: Likely "do not log."  
  - **Step 4**: Patients can request deletion → compliant. ✅  
  - **Step 5**: Judgment call? ⚠️ *VP dashboard vs. privacy.* Escalate to **PM + Legal**.  
  - **Outcome**:  
    - **Fail** at Step 3. Do not log free-text.  
    - **Absence Register Entry**:  
      ```markdown
      - **Gap Type**: Load-bearing absence  
      - **Field Omitted**: cancellation_reason  
      - **Reason**: GDPR: Avoids logging unprotected health data.  
      - **Placeholder**: Added `reason_omitted: true` to cancellation event.  
      - **Impact**: We lose free-text insights; VP dashboard breaks.  
      ```  
  - **Compliance Cost**:  
    - **What’s Lost**: Ability to analyze cancellation reasons textually.  
    - **Fix**: Replace with safe alternatives (e.g., predefined categories like "health," "transport").  
  - **Values Call**: If Legal allows gray-area logging, the **PM** must own the risk. Procedure forces this to be explicit.  

  ---

  ### **What This Checklist Can’t Do**  
  - **Not a Theory Substitute**: It surfaces gaps but won’t solve systemic bias (e.g., if front-desk staff avoid logging errors).  
  - **Judgment Heavy**: Steps 1, 3, and 5 involve judgment. The checklist makes it visible but won’t replace human decisions.  
  - **Reactive**: It audits what’s proposed, not unseen gaps in existing data. Use quarterly retention passes for that.  

  **Final Output**: A one-page checklist engineers can run quickly. Integrate with your instrumentation review process, and mandate Absence Register updates. This turns gaps from "unknown unknowns" to "documented decisions."
