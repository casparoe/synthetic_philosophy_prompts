  ### The Case Against Van Fraassen's Reflection Principle

  Van Fraassen's Reflection principle demands that an agent's current credence in a proposition align with her anticipated future credence, conditional on that future value. Formally, for an agent with credence function \(P_1\) at time \(t_1\) and anticipated credence function \(P_2\) at \(t_2\), Reflection requires that \(P_1(A \mid P_2(A) = r) = r\) for all \(r\) where the conditional is defined. This principle is often defended as a diachronic norm of coherence, supported by Dutch-book arguments that diagnose irrationality in agents who violate it. However, Reflection should be abandoned as a primitive norm because it is redundant when it holds—derivable from conditionalization—and false when it purports to add new constraints, as in cases of anticipated cognitive distortion. The Dutch-strategy argument, rather than indicting the prior credence function, reveals a flaw in the agent's diachronic betting policy. To demonstrate this, we examine the case of Alix, who anticipates memory corruption, and show why Reflection fails fundamentally.

  #### The Failure of Reflection in Anticipated Cognitive Distortion
  Alix at \(t_1\) has credence \(P_1(A) = 0.5\) in proposition \(A\). She knows that at \(t_2\), she will observe the outcome \(R \in \{+, -\}\) of a test with a known error profile: \(P(R=+ \mid A) = 0.9\) and \(P(R=- \mid \neg A) = 0.9\) (thus \(P(R=- \mid A) = 0.1\) and \(P(R=+ \mid \neg A) = 0.1\)). Crucially, before \(t_2\), she will receive a compound that (i) replaces her recollection of the base rate \(P_1(A) = 0.5\) with a value \(q\) drawn from a known density \(f(q)\) supported on \((0,1)\), independent of \(A\) and \(R\), and (ii) eliminates awareness of this alteration, so at \(t_2\), she treats \(q\) as her genuine prior. Her reasoning is otherwise unimpaired: she recalls the error profile, observes \(R\), and updates via Bayes' rule with prior \(q\). Thus, her credence at \(t_2\) is:
  \[
  p_2 = \begin{cases} 
  \frac{9q}{1 + 8q} & \text{if } R = + \\
  \frac{q}{9 - 8q} & \text{if } R = -
  \end{cases}
  \]
  Alix knows all this at \(t_1\), including \(f(q)\), and can irrevocably fix the betting odds for \(t_2\) to avoid exploitation.

  First, we compute \(P_1(A \mid p_2 = r)\), treating \(p_2\) as a continuous variable. The event \(p_2 = r\) occurs in two mutually exclusive ways:
  - If \(R = +\) and \(\frac{9q}{1 + 8q} = r\), which solves to \(q = \frac{r}{9 - 8r}\).
  - If \(R = -\) and \(\frac{q}{9 - 8q} = r\), which solves to \(q = \frac{9r}{1 + 8r}\).

  Let \(q_+ = \frac{r}{9 - 8r}\) and \(q_- = \frac{9r}{1 + 8r}\). The density of \(p_2\) given \(A\) is:
  \[
  P(p_2 = r \mid A) = P(R=+ \mid A) \cdot P(p_2 = r \mid R=+, A) + P(R=- \mid A) \cdot P(p_2 = r \mid R=-, A)
  \]
  Given \(R\), \(p_2\) depends only on \(q\), which is independent of \(A\). Thus, \(P(p_2 = r \mid R=+, A) = f(q_+) \cdot \left| \frac{dq}{dr} \mid R=+ \right|\), where \(\left| \frac{dq}{dr} \right| = \frac{9}{(9 - 8r)^2}\) from the inverse function. Similarly, \(P(p_2 = r \mid R=-, A) = f(q_-) \cdot \left| \frac{dq}{dr} \mid R=- \right| = f(q_-) \cdot \frac{9}{(1 + 8r)^2}\). With \(P(R=+ \mid A) = 0.9\) and \(P(R=- \mid A) = 0.1\):
  \[
  P(p_2 = r \mid A) = 0.9 \cdot f(q_+) \cdot \frac{9}{(9 - 8r)^2} + 0.1 \cdot f(q_-) \cdot \frac{9}{(1 + 8r)^2}
  \]
  Analogously, for \(\neg A\):
  \[
  P(p_2 = r \mid \neg A) = 0.1 \cdot f(q_+) \cdot \frac{9}{(9 - 8r)^2} + 0.9 \cdot f(q_-) \cdot \frac{9}{(1 + 8r)^2}
  \]
  Since \(P_1(A) = P_1(\neg A) = 0.5\), Bayes' theorem gives:
  \[
  P_1(A \mid p_2 = r) = \frac{P(p_2 = r \mid A) P_1(A)}{P(p_2 = r \mid A) P_1(A) + P(p_2 = r \mid \neg A) P_1(\neg A)} = \frac{P(p_2 = r \mid A)}{P(p_2 = r \mid A) + P(p_2 = r \mid \neg A)}
  \]
  Substituting and simplifying:
  \[
  P_1(A \mid p_2 = r) = \frac{0.9 f(q_+) \frac{9}{(9-8r)^2} + 0.1 f(q_-) \frac{9}{(1+8r)^2}}{f(q_+) \frac{9}{(9-8r)^2} + f(q_-) \frac{9}{(1+8r)^2}} = \frac{0.9 f(q_+) (1+8r)^2 + 0.1 f(q_-) (9-8r)^2}{f(q_+) (1+8r)^2 + f(q_-) (9-8r)^2}
  \]
  This expression depends on \(f(q)\) unless \(q_+ = q_-\), which only holds if \(r = 0.5\). For general \(f\), \(P_1(A \mid p_2 = r) \neq r\) on a set of \(r\) values with positive \(P_1\)-probability. For example, if \(f\) is uniform, at \(r = 0.6\), \(q_+ \approx 0.1429\), \(q_- \approx 0.9310\), and \(P_1(A \mid p_2 = 0.6) \approx 0.625 > 0.6\); at \(r = 0.4\), \(q_+ \approx 0.0690\), \(q_- \approx 0.8571\), and \(P_1(A \mid p_2 = 0.4) \approx 0.375 < 0.4\). Thus, Reflection fails, and the direction of failure depends on \(r\) relative to 0.5: for \(r > 0.5\), \(P_1(A \mid p_2 = r) > r\), and for \(r < 0.5\), \(P_1(A \mid p_2 = r) < r\).

  #### The Continuum of Violation and the Inadequacy of Restrictions
  The magnitude of this violation varies with the dispersion of \(f(q)\). If \(f(q)\) concentrates on the true base rate \(q = 0.5\), then \(p_2\) takes values 0.9 (if \(R = +\)) or 0.1 (if \(R = -\)), and \(P_1(A \mid p_2 = r) = r\) for these \(r\), satisfying Reflection. For instance:
  - If \(p_2 = 0.9\), then \(R = +\) and \(P_1(A \mid p_2 = 0.9) = P_1(A \mid R = +) = \frac{P(R=+ \mid A) P_1(A)}{P(R=+)} = \frac{0.9 \cdot 0.5}{0.5} = 0.9\).
  - Similarly, \(P_1(A \mid p_2 = 0.1) = 0.1\).

  As \(f(q)\) disperses, the violation increases, vanishing only when \(f(q)\) concentrates at 0.5. This creates a continuum: at one end, with full transparency and no corruption, Reflection holds; at the other, with memory distortion, it fails. This matters because attempts to "rescue" Reflection by restricting it to agents who do not anticipate cognitive malfunction are ad hoc and question-begging. If we limit Reflection to cases without malfunction, it reduces to conditionalization in transparent scenarios (as shown below), rendering it redundant. Moreover, such a restriction presupposes a notion of "malfunction" that is precisely what is at issue—Alix's case involves no irrationality or self-locating uncertainty, only corrupted input, so excluding it would require an unjustified prior assumption that inputs are reliable.

  #### Why Familiar Escape Clauses Fail
  Reflection is often restricted to cases where future evidence is "admissible" or the agent reasons flawlessly, but neither applies here. First, \(R\) is not inadmissible: there is no selection effect (e.g., no dependence on \(A\) via the sampling process), no centered or self-locating elements, and Alix's credence conditional on \(R\) alone is correct—\(P_1(A \mid R) = P_{1}(A \mid R)\) matches the Bayesian computation with the true prior. Second, Alix's \(t_2\) self reasons impeccably: she updates via Bayes' rule on the inputs she possesses (prior \(q\) and likelihood from \(R\)), with no logical errors. The sole defect is the corruption of one input (\(q\)), not her reasoning. To restrict Reflection to exclude this case would either (i) require that all inputs are uncorrupted, which collapses Reflection into conditionalization (since with reliable inputs, \(P_2(A)\) mirrors \(P_1(A \mid \text{evidence})\)), or (ii) presuppose that anticipated cognitive distortions are impossible or irrelevant, which undermines Reflection's generality. Thus, Reflection fails here for reasons outside its standard defenses.

  #### The Dutch-Strategy Argument and the Policy Defect
  The Dutch-strategy argument for Reflection claims that violators are exploitable by a bookie who trades at \(t_1\) on bets conditional on \(P_2(A) = r\) and at \(t_2\) at the price \(r\). In Alix's case, a bookie knowing the setup and observing \(p_2\) can indeed construct a strategy for some \(r\) where \(P_1(A \mid p_2 = r) \neq r\). Suppose, for example, that at some \(r\), \(s = P_1(A \mid p_2 = r) < r\). The bookie can:
  - At \(t_1\), buy from Alix a ticket paying $1 if \(A\) and \(p_2 = r\) for price \(P_1(A \land p_2 = r) = s P_1(p_2 = r)\).
  - At \(t_2\), if \(p_2 = r\), sell to Alix a ticket paying $1 if \(A\) for price \(r\) (since her \(t_2\) credence is \(r\)).

  If \(p_2 = r\) and \(A\), Alix's net loss is \(r - s > 0\); if \(p_2 = r\) and \(\neg A\), loss is \(r - s > 0\); if \(p_2 \neq r\), no loss occurs. Although the probability of \(p_2 = r\) is zero in the continuous case, a loss can be engineered for intervals where \(P_1(A \mid p_2 = r) \neq r\) holds with positive density.

  However, this exploitability stems not from a defect in Alix's \(t_1\) credence function—which is rationally mandated by the test's physics and \(f(q)\)—but from her diachronic betting policy. Specifically, her disposition to bet at \(t_2\) using her distorted credence \(p_2\) creates the vulnerability. Alix can avoid this by using her ability to fix \(t_2\) betting odds at \(t_1\). For instance, she commits to bet at \(t_2\) using odds based on \(P_1(A) = 0.5\), not \(p_2\). Then, even if \(p_2 \neq 0.5\), she trades at fair odds relative to her \(t_1\) knowledge, and no Dutch book is possible. Thus, the Dutch strategy diagnoses a flaw in the agent's willingness to change betting odds over time, not in her prior beliefs. This confirms that Reflection, as a norm on credences, is misplaced; the real issue is diachronic policy coherence.

  #### Redundancy in Transparent Cases
  In transparent learning scenarios, where Alix is certain at \(t_1\) that she will learn which cell of a partition obtains and update via conditionalization, Reflection holds as a theorem, not an additional norm. Suppose she learns evidence \(E_i\) at \(t_2\) and sets \(P_2(A) = P_1(A \mid E_i)\). Then \(P_2(A)\) is a random variable taking values \(r_i = P_1(A \mid E_i)\) with probability \(P_1(E_i)\). The event \(P_2(A) = r\) is equivalent to \(E_i\) such that \(P_1(A \mid E_i) = r\). Thus:
  \[
  P_1(A \mid P_2(A) = r) = P_1(A \mid P_1(A \mid E) = r) = r
  \]
  because, conditional on \(P_1(A \mid E) = r\), it must be that \(P_1(A \mid E) = r\). Hence, Reflection derives from conditionalization and adds no new constraint. This underscores its redundancy where it applies and its falsity where it does not—like in Alix's case with corruption.

  #### Conclusion: Abandoning Reflection for a Superior Norm
  Reflection should be abandoned as a primitive diachronic norm. Where it holds, it is a consequence of conditionalization; where it would impose extra constraints—as when agents anticipate cognitive distortions—it is false. The Dutch-strategy argument targets not the prior credence function but the agent's policy for updating betting odds, a defect remedied by precommitment. In its place, we should adopt the norm of *conditionalization with precommitment against dynamic inconsistency*: agents should update beliefs via conditionalization on evidence actually received, and when they anticipate distortions or irrationality, they should precommit to fixed betting odds to ensure diachronic coherence. This norm handles Alix's case: her \(t_1\) credences are rational given her knowledge, and by fixing \(t_2\) odds, she avoids exploitation, even under corruption. Thus, conditionalization suffices, and Reflection is an unnecessary vestige.
