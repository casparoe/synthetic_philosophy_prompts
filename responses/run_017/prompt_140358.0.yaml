  The user proposes two main hypotheses. First, that there are three distinct questions being conflated: (1) extensional (which acts count as doing/allowing), (2) normative (whether the distinction carries moral weight), and (3) explanatory (why it matters if it does). Second, that default-flip cases expose how the distinction depends on morally arbitrary factors like engineering conventions. 

  I need to address both hypotheses rigorously. For the first, I'll map how different theorists privilege different questions - Foot/Thomson on extension, Bennett/Kamm on explanation, Singer on normativity. The key insight is that "progress" on one question doesn't resolve others, and the normative question is the real load-bearing issue. 

  For default-flip cases, I must show why they're devastating: they demonstrate that the distinction tracks institutional design rather than metaphysical differences. I'll analyze all four interpretations the user suggests:
  - The "thin artifact" view (morally arbitrary)
  - The "real baselines" view (but why should defaults matter?)
  - The "temporal shift" view (responsibility lies with default-setter)
  - The "continuous dimensions" view (no binary distinction)

  The aggregation challenge further complicates things - it reveals how the distinction's moral force depends on whether we take an agent-relative or outcome-focused perspective. 

  Ultimately, I'll argue that the debate persists because it serves practical functions in law/medicine that don't require philosophical resolution. Real progress would involve either: (1) dissolving the normative question by showing the distinction lacks independent weight, or (2) replacing it with a multidimensional framework that handles default-flip cases better. But I'll be honest that complete resolution may be impossible given the intuition's deep cognitive entrenchment.
answer: |-
  Your diagnosis reveals a conceptual knot in the doing/allowing debate that persists not because of intellectual failure, but because the distinction serves multiple philosophical functions simultaneously. Below is a systematic dissection, argued from the case families and core commitments of each side, followed by a prognosis for progress.

  ### 1. **The Three-Layered Disagreement: Extensional, Normative, Explanatory**
  Your hypothesis is correct: the "doing/allowing distinction" label masks three distinct questions. Crucially, **the normative question is load-bearing**, while the others are contested because they serve it.

  - **Extensional Question** (Which acts *are* doings vs. allowings?):  
    This is where default-flip pairs strike hardest. If flipping an engineering default (e.g., pump reset vs. stop button) flips the doing/allowing verdict *while holding fixed intent, outcome, and causal sequence*, the distinction appears contingent on conventions (design choices, statistical norms). Defenders (e.g., Foot, Thomson) appeal to "baselines of normal functioning" or "duties to maintain states," but default-flip cases show these baselines are *assigned*, not discovered. When a hospital policy shifts from "opt-in" to "opt-out" for organ donation, the moral valence of *the same physical act* changes without altering the agent’s causal role. This suggests the extension is not tracking a metaphysical difference in agency, but a normative expectation about responsibility for states.

  - **Normative Question** (Does the distinction have *independent moral weight*?):  
    This is the core battleground. Deniers (e.g., Singer, Bennett) argue that once intent and outcome are fixed, the doing/allowing status is irrelevant. Defenders (e.g., Kamm, Quinn) insist it matters intrinsically—e.g., violating negative duties (not to harm) is worse than violating positive duties (to aid). **This layer is load-bearing** because it determines whether the distinction *demands* explanation. If normative weight is denied, the extensional question becomes moot.

  - **Explanatory Question** (*Why* does it matter, if it does?):  
    Here, defenders diverge: rights theories (e.g., rights against interference vs. rights to aid), causal frameworks (e.g., initiating vs. allowing a causal chain), or expressive theories (e.g., what the act signifies about the agent’s character). Crucially, *no explanation resolves the normative dispute*—e.g., showing that killings usually involve more direct causation doesn’t prove causation is morally significant. Default-flip cases exacerbate this: if the nurse’s act is "allowing" in one pump design but "doing" in another, the preferred explanation (e.g., causation) must stretch to cover contingent social facts.

  **Why this stalls debate**: Papers addressing one layer are misread as engaging another. For example, Bennett’s causal analysis (explanatory) is cited against the normative claim, but it assumes the distinction lacks intrinsic weight. Kamm’s rights-based defense (normative) is attacked via extensional edge cases, which she might dismiss as misclassified. The result is dialectical deadlock.

  ### 2. **Default-Flip Pairs: Extensional Collapse or Normative Artifact?**
  These cases expose fatal instability in the extensional project. Consider your nurse examples:
  - In both scenarios, the nurse *causes death* (counterfactual dependence: but for their act/omission, the patient lives).
  - Both exhibit identical intentional states and costs of prevention.
  - The *only* difference is whether the default state of the system (pump running/stopped) aligns with life or death.

  **Implications**:
  - **If verdicts flip**: The distinction tracks *socially constructed defaults* (e.g., engineering choices, legal norms). This is morally inert—why should a designer’s decision determine whether I "kill" or "let die"? Defenders cannot appeal to "normal functioning" here, as "normal" is defined by the default.  
  - **Temporal shift defense** ("The real doing was setting the default"): This relocates but doesn’t resolve the problem. The default-setter’s act (e.g., programming the pump) may itself be a "doing" or "allowing" relative to *another* baseline (e.g., industry standards). Infinite regress looms.  
  - **Continuous dimensions view**: Likely correct. Acts vary along spectra: **causal contribution** (direct/indirect), **normative expectation** (duty to act/duty not to interfere), **voluntariness** (active intervention/passive acceptance). "Killing" scores high on all three; "letting die" low. Default-flip cases show *normative expectation* dominates judgments, but this is context-dependent, not binary.

  ### 3. **Aggregation: Agent-Relativity vs. Outcome-Severity**
  Your aggregation challenge confirms that the distinction’s normative force hinges on perspective:
  - **Agent-relative constraint**: Each agent faces a special prohibition against *doing* harm (killing), but no equivalent duty to prevent *all* harms (letting die). Thus, 10,000 individual lettings-die may be permissible even if one killing of 10,000 is not.  
  - **Outcome-focused view**: 10,000 deaths are equally bad however caused. If letting-die omissions aggregate, the moral difference collapses.  

  This divergence isn’t about the distinction itself but about **moral theory**: Deontologists (agent-relative) vs. consequentialists (outcome-focused). The doing/allowing distinction is a *symptom* of this deeper rift.

  ### Diagnosis: Pluralistic Functionalism, Not a Unified Distinction
  The debate persists because:
  - **It serves practical needs**: In law and medicine, bright-line rules are needed (e.g., distinguishing euthanasia from withdrawing treatment), even if philosophically messy. The distinction provides a heuristic for assigning blame under uncertainty.  
  - **Cognitive entrenchment**: The intuition may be a byproduct of evolved harm-aversion (direct harm triggers stronger reactive attitudes) or learning social norms (e.g., "stranger ethics" vs. kinship duties).  
  - **No stable extension**: Default-flip cases prove the distinction is not a natural kind. It is a **cluster concept** drawing from morally diverse elements (causation, norms, intent), with no single "essence."

  ### What Counts as Progress?
  1. **Dissolving the Normative Question**: Show that *when all non-moral factors are controlled*, the distinction lacks independent weight. Default-flip pairs are key: if moral judgments flip with engineering defaults, the normative claim is undermined.  
  2. **No-Go Result**: Prove that no extensional criterion can satisfy both:  
     - (a) Match robust intuitions (e.g., transplant surgeon vs. trolley diverter), *and*  
     - (b) Remain invariant under default-flips.  
     This would force defenders to abandon extensional stability.  
  3. **Replacement Taxonomy**: Replace "doing/allowing" with explicit dimensions:  
     - **Causal Responsibility** (e.g., scalar measures of contribution).  
     - **Normative Position** (e.g., duties tied to roles/relationships).  
     - **Volitional Burden** (e.g., effort required to intervene).  
     Default-flip cases would then reveal shifts in *normative position* (e.g., nurse’s duty changes with hospital policy), not "doing" vs. "allowing."  
  4. **Empirical Work**: Test whether moral judgments in default-flip pairs *actually* flip across cultures. If they do, the distinction is socially relative; if not, there may be universal baselines (e.g., "life-supporting" as default). But this relocates, not resolves, the normative dispute.  

  **Prognosis**: The trench warfare is rational—the distinction is a proxy for deeper disagreements (agent-relativity vs. consequentialism, the nature of causation). Progress lies in **disaggregating the questions**, abandoning extensional essentialism, and reorienting toward *why* we want the distinction. Its utility in practical domains may be reason enough to retain it as a convention, not a metaphysical truth. The most viable path forward is your third hypothesis: treat it as a family of continuous dimensions, and debate the *normative weight of each dimension* separately.
