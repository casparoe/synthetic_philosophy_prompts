prompt: |-
  I am applying for a one-year dissertation fellowship and need the spine of the proposal. The topic is the difficulty of telling apart a person's genuine preferences and her biases — the sort of case where someone says, of a woman who has declined the career she was quietly steered away from, or of a worker who reports being content with a dangerous job, that the preference is not really hers. My half-formed idea is that the debate keeps stalling because it asks for one thing where it needs several: 'biased' gets pressed into service to discount a preference in the measurement of well-being, to void its authority in consent, to exclude it from moral aggregation, and to locate criticism in the agent rather than in her situation, and I suspect these jobs come apart and call for different tests.

  The angle I want to build the project on is a neutrality constraint. An institution — a state agency, a hospital ethics committee, a benefits administrator — is normally barred from appealing to a contested conception of justice, which appears to rule out the two standard tests: the historical test (this preference would not have formed under just conditions) and the error test (it rests on a false belief, where the falsity is itself what is contested). So I want to propose a fourth test and ask how far it can carry us: call a preference tracking-deficient when it shifts in response to a factor that the agent herself, on reflection, would classify as irrelevant to what she values in the object — how the option is framed, the order in which options are presented, the identity of who else benefits, her own momentary social position — even though the preference purports to track only features of the thing itself. The questions I want sharpened are: which of the four tests entails which, if any; whether tracking-deficiency is the only one an institution required to stay neutral about justice can apply; whether applying it still requires a second-order judgment about which factors are irrelevant, a judgment vulnerable to the same charge, so that the apparatus collapses either into scepticism about bias or into unlimited paternalism; and which of the four jobs each test can legitimately do.

  Please turn this into the spine of the proposal. Give it as exactly five numbered items, each one or two sentences, with no introduction and no conclusion: (1) the research question, stated so that it has a determinate answer; (2) why the existing positions leave it open, naming the specific gap rather than the literature; (3) the method, quarter by quarter over twelve months; (4) what a positive result would look like, and separately what would count as the project having failed; (5) the scope — what is deliberately left out so the project fits in one year, and why the remainder is still worth a year of funding. The whole thing should come to roughly 400 words.

  Write it as philosophy rather than as a map of a debate; argue that this work is worth doing and can be done in the time. Give me no bibliography and no citations, and attribute none of the four tests to any author — treat them as positions I am reconstructing and name them only by the labels I have used. Do not quote any text. I will expand each item into a paragraph and add the references myself.
reasoning: |-
  Okay, the user is applying for a dissertation fellowship and needs a structured spine for their proposal. They're tackling a complex philosophical problem: distinguishing genuine preferences from biases, especially in contexts where institutions must remain neutral about contested conceptions of justice. 

  First, I need to parse their core argument. They identify a stalling point in current debates where "biased" is overloaded—it's used to dismiss preferences in well-being measurement, consent validity, moral aggregation, and agent-focused criticism. Their key insight is these functions may require separate tests. The neutrality constraint angle is crucial here, as institutions can't rely on historical or error tests that presuppose specific justice conceptions.

  The user's proposed "tracking-deficiency" test seems innovative—defining bias as preferences shifting due to factors the agent would deem irrelevant upon reflection. But they're rightly concerned about potential circularity: doesn't judging "irrelevance" itself require contentious value judgments? This meta-problem needs addressing in the spine.

  For the structure, they want exactly five numbered items. I'll start by crystallizing the research question into something answerable. Instead of broad "how to distinguish preferences," it should target the test applicability under neutrality constraints. 

  For existing positions, I'll avoid naming scholars per their instructions. The gap is the conflation of distinct bias functions and the institutional neutrality problem. Historical/error tests fail neutrality; tracking-deficiency is proposed as a solution but its operationalization risks paternalism or skepticism.

  Method-wise, quarterly breakdown: Q1 defining tests/functions, Q2 neutrality analysis, Q3 tracking-deficiency mechanics, Q4 integration. Timebound and feasible.

  Success metrics: positive result shows tracking-deficiency works for specific institutional tasks without second-order collapse. Failure would be proving it inevitably requires justice-laden judgments. 

  Scope limitations: I'll explicitly bracket consent validity (as requiring separate normative work) and full moral aggregation. Justifying why well-being measurement and criticism targeting are sufficiently substantial for one year.

  Word count is tight—need ruthless concision. No intros/conclusions, just straight to the numbered points. Philosophy-forward tone: argue why this matters now (institutional legitimacy crises) and is feasible (structured decomposition). 

  Biggest challenge: making tracking-deficiency's vulnerability to infinite regress clear without oversimplifying. The spine must show awareness while leaving room for their later development. Also ensuring "what's left out" feels strategic, not evasive.
answer: |-
  Here is the spine of your proposal in five numbered items:

  1.  **Research Question:** Can institutions constrained by neutrality about justice legitimately discount preferences as "biased" using only a test for tracking-deficiency (preferences shifting due to factors the agent reflectively deems irrelevant), and specifically for which tasks (well-being measurement, criticism targeting) can this test succeed without collapsing into skepticism or paternalism?
  2.  **Gap:** Existing tests (historical: preference wouldn't form under just conditions; error: rests on false belief) presuppose the contested justice conceptions institutions must avoid, leaving unresolved how neutrality-compliant institutions can identify problematic preferences for specific practical tasks without overextending "bias".
  3.  **Method:** Quarter 1: Analyze distinct institutional tasks needing bias judgments (well-being discounting, consent voiding, aggregation exclusion, criticism focus). Quarter 2: Rigorously define tracking-deficiency, isolating it from historical/error tests, and examine its neutrality credentials. Quarter 3: Assess if applying tracking-deficiency avoids infinite regress (does judging "irrelevance" require a biased judgment?) and determine which tasks it can perform without paternalism/skepticism. Quarter 4: Synthesize findings, map legitimacy of each test for each task, and draft.
  4.  **Result:** Success: Demonstrating tracking-deficiency is institutionally viable for well-being or criticism tasks under neutrality, specifying precise limits to block regress/paternalism. Failure: Proving tracking-deficiency inevitably requires second-order justice judgments or collapses universally, leaving neutrality-bound institutions no viable bias test for any task.
  5.  **Scope:** Deliberately excluded are comprehensive theories of consent validity and full moral aggregation rules, as these require broader normative foundations beyond the focus on preference discounting *mechanisms* under neutrality; the core conceptual disentanglement of "bias" functions and the viability of a neutral test for specific institutional purposes justifies the year's focus.
