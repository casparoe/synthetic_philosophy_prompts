prompt: |-
  I'm giving the closing talk at a small invitation-only workshop on macroeconomic modelling in a couple weeks, and I need Q&A prep. I'm a science journalist — I've covered econ and modelling for about ten years — and I got invited because of a piece I wrote arguing that the professions habitual shrug at unrealistic assumptions (the all-models-are-false move, the as-if defense, the F-twist) is basically fine when a model is being used to describe or forecast inside a regime that isn't moving, but stops buying anything when the same model is used to score a policy that would itself change the behavior the false assumption misdescribes. The talk extends that into a positive proposal. My claim is that unrealistic assumptions are only harmless when they are counterfactually inert for the quantity you're quoting — when the falsehood sits off the causal path to the output — and that the remedy for the cases where it doesn't is not realism for its own sake (I dont think anyone can say what more realistic means in the abstract, and I say so in the talk), but a de-idealization schedule: for each idealization that is load-bearing for the counterfactual the model is being used to evaluate, you have to write down who is supposed to relax it first, what evidence triggers that, and what finding would make you withdraw the policy recommendation. I've got 25 minutes plus 20 for questions, and I'd rather walk in having already lost the arguments in private.

  The room is about 45 people and it's not a philosophy crowd. Most of it is central-bank and academic macro people — DSGE types and the newer heterogeneous-agent modelers who think they already fixed the representative-agent problem — plus a handful of climate and energy modelers, the director of the host institute, who is a hardline reduced-form person and thinks structural modelling is theology, and two philosophers of economics who actually work on scientific models and will use that vocabulary (Galilean idealization, models as mediating instruments, models as fictions, nomological machines, that whole literature). So I'd like the seven or eight objections I'll actually get, ordered by how likely and how much damage they'd do, phrased the way this specific room would phrase them rather than the way a general audience would — I want to hear the modelers say that what I'm describing is just robustness and sensitivity analysis with a new name, and I want the philosophers version of it, which I assume is something about idealization being constitutive of the model rather than a defect in it. Give me a two-minute reply to each, and a note on where that reply is soft, because I'd rather know now. Also tell me what I should concede in the first two slides before anyone has a chance to raise it, and which single reply has to land for the proposal to be worth anything.

  Two more things. First, I'd like at least one objection that could only come from the climate modelers, since they're used to building scenarios that are explicitly not forecasts and I suspect they'll hear my talk as naive about that. Second, include the question I'm hoping nobody asks. I think it's something like: name one actual policy episode where a written de-idealization schedule would have changed the advice anyone gave — I have an answer and its not a great one, so I want to see it coming. Format it as a prep sheet I can read on the train, two or three pages max, and flag the one objection where you think I should just fold rather than fight it.
reasoning: |-
  Okay, the user is a science journalist preparing for a Q&A session after giving a closing talk at a macroeconomic modeling workshop. They've written a piece critiquing how economists handle unrealistic assumptions in models, especially when models are used for policy evaluation. Their talk extends this into a proposal about "de-idealization schedules." They need help anticipating objections from a mixed audience of macroeconomists, climate modelers, philosophers, and institute directors.

  First, I need to understand the core of their argument. They're saying that unrealistic assumptions are harmless only when they're "counterfactually inert" - meaning they don't affect the model's output for the policy in question. When they do matter, the solution isn't just adding realism but creating a structured plan: who relaxes which assumption, based on what evidence, and what would make them retract the policy advice. 

  Now, considering the audience: DSGE modelers might think they've already addressed issues with representative agents; climate modelers deal with scenarios, not forecasts; philosophers have frameworks like Galilean idealization; and the institute director dismisses structural modeling entirely. The user wants objections phrased as these groups would raise them, with rebuttals and notes on weaknesses. They also want to know what to concede upfront and which objection might be unwinnable.

  Starting with pre-emptive concessions: The user should acknowledge that all models simplify and that their critique isn't about falsity per se but about when falseness matters for policy. This disarms the common "all models are false" rebuttal. They should also clarify that they're not prescribing specific model structures, avoiding turf wars. 

  For objections, I'll prioritize by likelihood and damage. Top ones include:
  - Economists saying this is just sensitivity analysis rebranded. Rebuttal: Sensitivity checks are ad hoc; de-idealization schedules force systematic, pre-commitment to evidence thresholds. Weakness: It might sound bureaucratic.
  - Philosophers noting idealization is constitutive. Rebuttal: Constitutive idealizations (like frictionless planes) are inert; the issue is non-inert ones in policy contexts. Weakness: The inert/non-inert distinction may be fuzzy.
  - Climate modelers arguing their scenarios aren't forecasts. Rebuttal: Even scenarios need validated components; de-idealization clarifies which assumptions drive outcomes. Weakness: Might not fully address exploratory modeling.

  The "hoped nobody asks" question is about real-world examples. The user admits their answer (maybe inflation modeling post-2008) isn't strong. I should prepare them to pivot to principle over precedent. 

  The fold-worthy objection: If someone argues this is infeasible for complex models, conceding that schedules can be prioritized for critical assumptions makes sense—don't die on the "every assumption" hill. 

  For structure, I'll organize objections by group, with likelihood ratings, sample phrasing, rebuttals, and soft spots. The key reply that must land is distinguishing inert vs. non-inert assumptions—if that fails, the proposal crumbles. 

  Climate modelers need a tailored objection about scenario design. Their point: Scenarios explore possibilities, not predict, so de-idealization schedules miss the point. Rebuttal: Even then, knowing which assumptions affect outcomes (e.g., tech costs vs. behavior) is crucial for decision-making. 

  Finally, the user wants a concise prep sheet. I'll keep it under three pages, using bullet points for quick reference, highlighting concessions and the critical objection. Tone should match their witty, no-nonsense style ("lost the arguments in private").
answer: |-
  Here's your targeted Q&A prep sheet, designed for quick scanning. Focus areas are prioritized by likelihood + impact, with audience-specific phrasing and strategic concessions flagged.

  ---

  ### **Pre-emptive Concessions (Slide 2)**
  1. **"All models are false" is correct and unavoidable.**  
     *Concede:* Idealization is necessary for tractability. Your critique targets *uncritical retention* of idealizations in policy contexts where they become causally active.
  2. **This isn’t a call for "realism".**  
     *Concede:* "More realistic" is often ill-defined. Your proposal is about *accountability for idealizations that do work in counterfactuals*, not adding complexity for its own sake.

  ---

  ### **Top 7 Objections & Rebuttals**  
  *(Ordered by likelihood/damage)*

  1. **Objection (Macro DSGE/HA Modeler):**  
     *"This is just sensitivity analysis/robustness checks with a fancy label. We already do this."*  
     **Rebuttal (2-min):**  
     > "Sensitivity analysis tests *known parameters*, not *structural idealizations*. When you assume representative agents or rational expectations, you’re not varying a parameter—you’re embedding a false causal mechanism. A de-idealization schedule forces you to pre-commit: *Which specific evidence* would make you revisit that core assumption? Who’s responsible? That’s not sensitivity analysis; it’s a protocol for model evolution under stress-testing."  
     **Soft Spot:** Blurring parameters vs. structural assumptions risks sounding semantic. *Pivot to policy stakes:* "If your model failed in 2008 because it couldn’t capture herd behavior, was 'robustness' enough?"  

  2. **Objection (Philosopher of Science):**  
     *"Idealizations aren’t defects—they’re Galilean: they isolate causal capacities. Demanding their 'removal' misunderstands modeling."*  
     **Rebuttal (2-min):**  
     > "Galilean idealizations *are* inert by design—frictionless planes don’t alter gravity’s causal role. My argument targets *non-inert* idealizations. When your DSGE model assumes no financial frictions to 'isolate' monetary transmission, but then advises post-crisis QE, that friction *is* on the causal path. The schedule doesn’t 'remove' idealizations; it flags when their inertia claim fails policy tests."  
     **Soft Spot:** Requires accepting your "inert vs. non-inert" distinction. *Anchor in examples:* "Is the frictionless plane inert when modeling air resistance? No. Same principle."  

  3. **Objection (Climate/Energy Modeler):**  
     *"We build *scenarios*, not forecasts. Your framework assumes policy seeks 'truth', but we explore pathways under explicit, fixed assumptions."*  
     **Rebuttal (2-min):**  
     > "Scenarios still embed causal claims—e.g., 'CO₂ prices drive decarbonization *if* consumers are price-responsive'. But if your idealization hides that responsiveness depends on infrastructure lock-in (a non-inert assumption), your pathway is fragile. A schedule forces you to state: 'If real-world elasticity diverges from assumption X, team Y recalibrates by Z date'. That’s *scenario accountability*."  
     **Soft Spot:** May overclaim for exploratory models. *Concede nuance:* "For pure exploration, schedules apply only to assumptions borrowed from predictive frameworks (e.g., climate-economy feedbacks)."  

  4. **Objection (Institute Director / Reduced-Form Advocate):**  
     *"This is theology with extra steps. Structural models can’t be 'fixed'—they’re untestable castles in the air. Use reduced forms and avoid assumptions altogether."*  
     **Rebuttal (2-min):**  
     > "Reduced forms rely on *historical invariance*—the biggest idealization of all. If you’re scoring a new carbon tax but ignore that past taxes were in stable regimes, your model is non-inert. Schedules force all modelers to declare their invariance assumptions and contingency plans. That’s *more* empirical, not less."  
     **Soft Spot:** Doesn’t resolve their deeper skepticism. *Pivot to common ground:* "Even reduced forms idealize 'no structural breaks'. A schedule makes that explicit and testable."  

  5. **Objection (Heterogeneous-Agent Macro Modeler):**  
     *"We *already* killed the rep agent. Our micro-foundations are 'realistic'. Why punish us?"*  
     **Rebuttal (2-min):**  
     > "HA models idealize too—e.g., fixed network structures or myopic expectations. When evaluating a pandemic stimulus, if your model assumes no supply-chain rupture (because it’s not in the micro-data), that idealization is non-inert. The schedule asks: 'Who monitors chain fragility? What data triggers model revision?' Realism isn’t binary; it’s about *which* fictions bite in the policy context."  
     **Soft Spot:** HA folks feel targeted. *Appeal to ambition:* "You’ve innovated beyond rep agents—now lead on formalizing *how* to adapt models to novel policies."  

  6. **Objection (Academic Macro):**  
     *"This is infeasible. Models have 100+ assumptions. We can’t write schedules for each."*  
     **Rebuttal (2-min):**  
     > "Focus on *load-bearing, policy-relevant* idealizations. Did you assume no inequality effects for a tax reform model? That’s one schedule. Central banks already do this *implicitly* (e.g., 'look out for wage-price spirals'). Formalizing it prevents hindsight bias and incentivizes monitoring."  
     **Soft Spot:** Practical scaling. *Concede:* "Start with 1–2 key assumptions per model. This is about culture, not paperwork."  

  7. **"The Killer Question" (Hopelessly Naive Hope):**  
     *"Name one policy episode where a de-idealization schedule would’ve changed the advice given."*  
     **Rebuttal (2-min):**  
     > "Eurozone austerity circa 2010–2012. Models assumed fiscal multipliers were low and invariant (~0.5). But this idealization depended on pre-crisis financial conditions. A schedule would’ve forced teams to: (1) Assign someone to monitor post-crisis multiplier estimates, (2) Set a threshold (e.g., if multipliers >1.0 persist for 4 quarters), (3) Withdraw austerity advice if triggered. Real-world advice *did* change post-Blinder-Zandi—but too late."  
     **Soft Spot:** Counterfactual/hindsight argument. *Strengthen with principle:* "The point is to *institutionalize* this—not wait for Nobelists to correct course."  

  ---

  ### **The Fold-Worthy Objection**  
  **Objection (Philosophy/Econ Hybrid):**  
  *"Your 'inert vs. non-inert' distinction presumes we know the true causal graph. But in complex systems, we don’t—so the schedule is just another fiction."*  
  **Why Fold?**  
  This attacks your epistemological foundation. If causality is unobservable, your entire framework wobbles.  
  **Damage Control:**  
  > "You’re right—we *can’t* know full causality. But policy models *assert* causal paths (e.g., 'rate hikes → inflation↓'). The schedule forces modelers to state *which* idealizations their causal claim relies on, and how they’ll test them. It’s not about truth-tracking; it’s about responsibility for claims made."  

  ---

  ### **The Must-Land Reply**  
  **For the proposal to matter, this distinction must stick:**  
  > *"Not all false assumptions are equal. The problem isn’t falsehood—it’s when falseness in Assumption A changes Output B* ***only*** *under Policy C. That’s when you need a schedule. If your model is wrong in ways that don’t touch the policy lever, relax."*  
  ***If this fails, the proposal sinks.***

  ---

  ### **Prep Sheet Summary**  
  - **Concede upfront:** Necessity of idealization + no "realism" fetish.  
  - **Key Objections:** 1. Rebranded sensitivity (macro) | 2. Constitutive idealization (phil) | 3. Scenario design (climate)  
  - **Killer Q:** Eurozone austerity (weak but principled).  
  - **Fold on:** "You presume known causality."  
  - **Must Land:** "Non-inert = when falseness *moves* with the policy."  

  Time your rebuttals: 90 seconds for substance, 30 for soft-spot pivot. You’ve got this.
