answer: |-
  I'll tackle this head-on. After analyzing your gut reactions to each scheme, I've distilled a core principle that explains most of your verdicts, along with two supporting sub-principles. Your reactions aren't arbitrary—they reveal a consistent engineering intuition about avoiding *bootstrapped self-trust* while preserving *capability integrity*. I'll define the principles, map them to your cases (showing which case forces each clause), highlight where they don't perfectly fit, and apply them to your child-agent scenario. Let's start with the principles.

  ### Core Principle: Grounded Agency
  **An agent's trust in a system must be justified by one of:**
  - **External anchoring**: Evidence or guarantees outside the agent's current formal reasoning system (e.g., hardware, empirical data, or a human).  
  - **Controlled degradation**: A deliberate, auditable reduction in capabilities (e.g., weakening the proof system or adding resource limits), provided it's reversible via external intervention.  
  - **Non-circular separation**: The trusted system is physically or logically distinct, preventing the agent from proving properties about its own future state via Löbian self-reference.

  **With a constraint: Capability suicide is forbidden unless it's the only safe option.** The agent must not destroy its core reasoning machinery without a fallback (e.g., freezing is okay; deletion isn't).

  This principle avoids bootstrapping by demanding that trust isn't justified *solely* by the agent's own reasoning. It also explains why identical replicas feel safe (they're physically distinct) and why humans are trusted but oracles aren't (humans are non-formal anchors).

  ### Supporting Sub-Principles
  1. **Empirical beats theoretical**: Testing on real data is always safer than proof-based certification, even if incomplete.  
  2. **Circularity breaks must be physical or resource-based**: Self-referential loops can only be broken by hardware separation, proof-length caps, or unpredictability—not by mutual agreement between identical systems.

  Now, I'll apply these principles to your 10 cases. For each:
  - **Verdict**: Your gut reaction (fine/not fine).  
  - **Clause**: Which part of the principle forces this verdict.  
  - **Why**: Precise reasoning based on the principles.  
  - **Overturned?**: If your verdict conflicts, I'll note it and argue why to flip it.

  ---

  ### Case-by-Case Analysis
  1. **Agent refuses every unprovable rewrite**  
     **Verdict**: Fine.  
     **Clause**: Controlled degradation (freezing capabilities is acceptable degradation; no self-trust required).  
     **Why**: No trust is exercised, so no bootstrapping risk. Capability integrity is preserved—reasoning machinery stays intact.  
     **Overturned?**: No conflict.

  2. **Agent adopts full self-trust**  
