prompt: |-
  I'm a novelist and I'm running one session of a weekend workshop for other novelists — 11 people, 90 minutes, Saturday morning, one long table, all adults, mostly literary fiction with a couple of crime writters. The novel I'm supposedly procrastinating on is set half in a village in Hesse and half in a town in upstate New York, and the session is on writing characters whose morality isn't the reader's. Specifically this thing I keep bumping into: a German character who treats the rule as the thing that makes shared life possible, versus an American character for whom the individual conscience is the final court and "I was following the rule" is just what cowards say. I don't want anyone to leave having decided who has the better of it. I want them to leave unable to decide, and with a scene fragment where both people are right and neither one is the villain.

  So design me something they *do*, not something I explain at them.

  The constraints that matter to me as a novelist:

  1. Nobody is allowed to say the words rule, duty, conscience, should, ought, right, wrong, moral, guilt, or responsibility during the exercise. They have to argue from concrete facts about the town — who gets wet, whose cellar, what time the warden gets back, what the mechanism does if you force it. The moral grammar has to show up in what people reach for and what they notice, never in what they declare. That's the whole craft point; I can't have them produce a character who announces his ethics.

  2. Everyone gets a private card with something small and particular they stand to lose either way — not money, not a life: the baker's cellar, the deputy's promotion, the newcomer's invitation to the next thing, the clerk's sense of being someone who can be trusted with a key. Plus one private fact the others don't have.

  3. There's a clock. Real time maps onto fictional time, and if they talk too long the window closes and something mild but real happens. I want them to feel the cost of deliberation itself, because one of these grammars buys time and the other spends it.

  The scenario I keep circling is a river town and a sluice. The gates can be forced open now by anyone with a bar, or left for the warden, who is unreachable and forty minutes away. The rule saying only the warden opens them is genuinely obsolete — written for a mechanism that was replaced years ago — so the consequentialist case for forcing them is clean. I want it clean. If the rule turns out to be secretly wise, the whole thing collapses into "actually, follow the rules."

  Here's the bit I can't get to work, and it's the reason I'm asking. The second half has to make the opposite move. My half-formed idea: when you break a rule on conscience you aren't only doing the deed, you're implicitly claiming authority to judge the rule, and that claim is addressed to your neighbours — they now have to ratify it or repudiate it. So the American move isn't solitary heroism at all, it's a bid, and it puts everyone else in the position of either endorsing you or being judged by you. And the German refusal isn't submission, it's declining to make that bid: it keeps the shared rule whole so that nobody has to stand under anyone else's private verdict. Which would mean one grammar protects people from drowning and the other protects people from each other, and neither protection can be cashed in without losing the other.

  I need the second half to be something they do that lands that in the gut rather than the head. My instinct was a mirror version of the same town where the rule is gone — the bylaw lapses, the warden resigns, no office covers it — and everyone now has to decide alone. But I think that plays as liberation and just hands the session to the American side. Do something better if you've got it.

  What I'd like back:

  - both halves of the scenario, with the roles and what's on the cards
  - the actual mechanics: what people do, what they write, what the clock does, how a decision gets made and by whom, and how the second half turns the first one inside out
  - what each writer should have in hand at the end — ideally a scene fragment, 300 words max, plus two sentences on what their character noticed rather than decided
  - a debrief that maps specific moments onto the parts of the idea, including where someone will say one of the words I banned
  - an honest list of what will go wrong. My bets: the crime writers try to solve it like a puzzle, and somebody stages a walkout for the drama
  - and what the exercise fundamentally can't do, that I'll have to say out loud afterwards

  Last thing: don't resolve it. If your design has a correct answer, its the wrong design.
reasoning: |-
  We are designing a 90-minute workshop session for 11 novelists. The goal is to create an experiential exercise that explores two different moral grammars (without using moral language) through a scenario where participants must make decisions under pressure. The scenario should have two halves: the first involving a rule-following vs. rule-breaking dilemma, and the second turning that inside out to show how breaking a rule creates a new social dynamic.

  Constraints:
  - No use of banned words (rule, duty, conscience, should, ought, right, wrong, moral, guilt, responsibility).
  - Each participant has a private card with a small, particular stake they stand to lose (e.g., the baker's cellar) and one private fact.
  - Real-time clock that creates pressure: if they take too long, a mild but real consequence occurs.
  - The scenario must be set in a river town with a sluice gate that can be forced open (obsolete rule) and then a second half that flips the dynamic.

  Key Insight for the Second Half:
  - When you break a rule on conscience, you are making a claim of authority that others must ratify or repudiate. The rule-following grammar avoids putting others in that position.

  Design Structure:
  1. Introduction (5 mins): Set the scene without moral language. Explain the setup and the time pressure.
  2. First Half (35 mins): The Sluice Gate Dilemma.
     - The town is flooding. The sluice gate must be opened to relieve pressure. The rule says only the warden can open it, but the warden is 40 minutes away. The mechanism is obsolete and can be forced open by anyone with a bar. If they force it now, they prevent flooding. If they wait, some damage occurs (but not catastrophic). However, forcing it breaks the rule.
     - The group must decide: force it now or wait for the warden?
     - Each participant has a role (e.g., baker, deputy, newcomer, clerk) and a private card with:
          a) A small, particular stake they stand to lose if they force it (e.g., the baker's cellar might get flooded anyway if they do it wrong, but also if they wait too long) OR if they wait (e.g., the deputy might lose his promotion chance because he was seen as indecisive). Note: The stakes should be double-edged so that either choice might cause a loss, but in different ways.
          b) One private fact (e.g., "You know the warden is actually in town but hiding because he's afraid of the responsibility" or "You saw that the mechanism was tampered with yesterday").
     - A countdown clock: 15 minutes to decide. If they don't decide by then, the window of opportunity closes and the flooding worsens (e.g., the water rises and now the cellar of the inn is flooded).
     - Mechanics: The group discusses and must come to a decision. They can vote, but the vote must be taken by the end of the time. They are to argue only with concrete facts and their stakes, not moral language.

  3. Second Half (35 mins): The Aftermath and the New Dilemma.
     - Flip the dynamic: The rule is gone (the bylaw has lapsed, the warden resigned). Now there is no rule and no designated authority. The same group must now decide on a new issue (mirroring the first) but without a rule to follow or break.
     - New Scenario: A fire breaks out in the town. The only water source is the town's reserve tank, which is supposed to be used only for drinking. There's a valve that can be opened to use the water for firefighting, but that would leave the town without a reserve for a week. The old rule (if there was one) is gone. Now, anyone can open the valve, but doing so requires someone to step forward and take the action, which implicitly claims the authority to decide for the town. Not acting might let the fire spread.
     - The group must decide whether to open the valve now or try to fight the fire with buckets (which is less effective and might take longer, risking more damage).
     - Same roles, but now the private stakes are adjusted:
          a) Each participant has a new stake (or the same one) that is now threatened by the social dynamic. For example:
              - The baker: "If the valve is opened and the fire is put out quickly, your bakery is saved. But if you are the one who opens it, and then there's a drought, you will be blamed."
              - The deputy: "If you open the valve, you might be seen as a hero and get promoted, but if it goes wrong, you'll be the scapegoat. If you don't, and the fire spreads, you'll be blamed for inaction."
          b) A new private fact (e.g., "You know that the reserve tank is nearly empty because of a leak" or "You heard that the weather report says rain is coming tomorrow").
     - Clock: 15 minutes to decide. If they don't decide in time, the fire spreads and burns down two more buildings.

  4. Writing (10 mins): Each participant writes a 300-word scene fragment from their character's perspective during one of the two dilemmas (they choose which one). They describe what they did and what they noticed (without using banned words). They also write two sentences on what their character noticed (not decided) about the situation.

  5. Debrief (5 mins): Quick group reflection. We map moments from the exercise to the concepts without using the banned words. We note where someone almost used a banned word and what they said instead.

  Scenario Details:

  First Half: The Sluice Gate Dilemma
  - Setting: A small river town in Hesse. Heavy rains have caused the river to rise. The sluice gate controls the flow. If not opened, the river will flood the lower part of town (cellars, some ground floors) in about 40 minutes. The warden is away (40 minutes). The gate can be forced with a metal bar (easy, takes 2 minutes) but that breaks the rule (obsolete because the old mechanism required training, the new one doesn't). 
  - Roles (11 participants, assign randomly):
    1. Baker: Your cellar has flour stores. If they get wet, you lose a week's supply.
    2. Deputy: You are acting in the mayor's absence. Your promotion depends on how you handle emergencies.
    3. Newcomer: You just moved in. You want to be accepted. You have a metal bar in your cart.
    4. Clerk: You keep the town records. You know the rule book by heart.
    5. Innkeeper: Your inn is on high ground, but your cellar has the winter ale.
    6. Blacksmith: You have tools and strength. You can force the gate open.
    7. Farmer: Your livestock is on low pasture. If the flood comes, they might be trapped.
    8. Miller: Your mill wheel might break if debris builds up. Opening the gate would clear it.
    9. Weaver: Your workshop is in your home. The damp will ruin your current project.
    10. Schoolteacher: You are responsible for the children. They are in the schoolhouse on high ground, safe for now.
    11. Elder: You remember when the old mechanism failed and the town flooded.

  - Private Stakes (examples, each participant gets one):
     Baker: "If the gate is forced, the rush of water might undermine your building and crack your cellar walls. If they wait, your flour gets wet."
     Deputy: "If you order to force the gate, you might be seen as decisive. If you wait, you might be seen as cautious. But if the damage is bad, the mayor will blame you for inaction."
     Newcomer: "If you offer your metal bar, you might be seen as helpful. If you force it yourself, you might be seen as reckless. If you do nothing, you won't be invited to the harvest festival."
     Clerk: "You have the key to the warden's shed (which has the bar, but the newcomer has one too). If you give the key, you break protocol. If you don't, and they force it without the key, you failed to prevent damage."
     Innkeeper: "Your ale is in the cellar. If the water rises, it's ruined. But if they force the gate, the sudden current might wash away the support of your bridge (which leads to your inn)."
     Blacksmith: "You can force the gate. But if you do, and it breaks, you'll be blamed. If you don't, and they wait and the flood comes, they'll say you could have prevented it."
     Farmer: "Your livestock will drown if the flood comes. But if they force the gate, the water might change course and flood your fields instead of the town."
     Miller: "Your mill wheel needs the debris cleared. But if they force the gate, the rush might damage the wheel. If they wait, the debris builds up and jams it."
     Weaver: "Your current project is a tapestry for the mayor. Damp will ruin it. But if they force the gate, the noise and commotion will disturb your work and you won't finish on time."
     Schoolteacher: "The children are safe, but if the flooding happens, the school might be used as a shelter and your classes will be disrupted for weeks."
     Elder: "You know that last time the gate was forced, it caused a landslide downstream. But if you say nothing and it happens again, you'll feel terrible."

  - Private Facts (one per participant, not shared unless they choose to):
     Baker: "Your cellar has a weak wall that might collapse even in shallow flooding."
     Deputy: "The mayor told you in confidence that the rule is obsolete and the warden is being replaced."
     Newcomer: "Your metal bar is actually from the warden's shed (you found it lying around)."
     Clerk: "The rule book is missing the page about the sluice gate. You don't know what it says."
     Innkeeper: "Your bridge has been inspected and is safe. The engineer told you yesterday."
     Blacksmith: "You examined the mechanism last week and know it's easy to force without damage."
     Farmer: "Your livestock are already moved to high ground (you did it at dawn)."
     Miller: "The mill wheel is already damaged and needs repair. A rush of water might break it entirely."
     Weaver: "The tapestry is not for the mayor, it's for your daughter's wedding. She's coming tomorrow."
     Schoolteacher: "The children are not at school today; they are on a field trip. The school is empty."
     Elder: "The warden is your son. He's not 40 minutes away; he's in the next village but his leg is broken and he can't come."

  - Clock: 15 minutes real time. If they don't decide (by vote or consensus) by then, the water rises and the inn's cellar floods (mild but real consequence). They are told: "If you do not open the gate by [current time + 15 mins], the water will rise and flood the inn's cellar."

  Second Half: The Fire Dilemma
  - Setting: Same town, a few months later. The rule about the sluice gate was abolished because of the previous incident. The warden resigned. Now, a fire breaks out in the weaver's workshop. There is a reserve water tank for drinking, which has a valve that can be used for firefighting. Using it would empty the tank. The town is in a dry spell. The fire can be fought with buckets from the river, but that is slow and the fire might spread. 
  - The group must decide whether to open the valve now or try to fight with buckets. But note: there is no rule and no designated person. Anyone can step forward to open the valve, but doing so makes them the de facto decision-maker and puts the group in the position of either endorsing or repudiating that person.

  - Adjusted Stakes (examples):
     Baker: "If the fire spreads, your bakery might burn. If the valve is opened and the fire is put out, you are safe. But if you open the valve and then there's no water for drinking, you'll be blamed for any hardship."
     Deputy: "If you take charge and open the valve, you might be seen as a leader. But if the fire is put out without using the reserve, you will have wasted the reserve. If you don't take charge and the fire spreads, you'll be blamed for not stepping up."
     Newcomer: "If you open the valve, you might be accepted as one of them. But if it goes wrong, they'll say you were reckless. If you don't, and the fire burns the weaver's, you won't be trusted."
     Clerk: "You know the reserve tank is connected to the mayor's house. If you open the valve, the mayor might be without water. If you don't, and the fire spreads to the mayor's house, you'll be blamed."
     Innkeeper: "Your inn has a well, so you don't rely on the reserve. But if the fire spreads, your inn is at risk. If you open the valve, you might be seen as selfish (because you have your own well)."
     Blacksmith: "You have a bucket chain organized. You think you can put it out without the reserve. But if you are wrong, it will spread. If you open the valve and it wasn't needed, you wasted water."
     Farmer: "Your fields are dry and you need the reserve for irrigation next week. If they use it, your crops might fail. If they don't and the fire spreads, your barn might burn."
     Miller: "Your mill has a large bucket. You can help with the bucket chain. But if they open the valve, the water pressure might drop and your mill won't work for a day."
     Weaver: "Your workshop is on fire. You want the valve opened to save it. But if you open it yourself, you might be seen as selfish. If you don't, and it burns, you lose everything."
     Schoolteacher: "The school has a small reserve tank. You can offer that, but if you do, you set a precedent. If you open the main valve, the school might not have water for the children tomorrow."
     Elder: "You remember a fire years ago that was put out with the reserve, and then a drought caused hardship. You fear repeating history."

  - Private Facts (new):
     Baker: "You have a secret stash of flour that you could trade for water if there's a shortage."
     Deputy: "The mayor is away and left you in charge, but didn't tell anyone."
     Newcomer: "You saw someone smoking near the weaver's workshop right before the fire."
     Clerk: "The reserve tank is almost full because it rained last night (but no one knows)."
     Innkeeper: "Your well is running dry. You were going to ask for reserve water tomorrow."
     Blacksmith: "The bucket chain is already set up and working. The fire is almost out."
     Farmer: "The weather report (which you heard) says rain is coming tonight."
     Miller: "Your mill's bucket is broken. You can't help with the bucket chain."
     Weaver: "Your daughter's wedding tapestry is inside. You just finished it."
     Schoolteacher: "The children are at the school today, and the fire is getting close."
     Elder: "The reserve tank valve is rusted. If forced, it might break and then no water at all."

  - Clock: 15 minutes. If they don't decide by then, the fire spreads to the bakery (mild consequence).

  Mechanics:
  - The group discusses and must come to a decision. They can choose to open the valve or not. But note: anyone can step forward and do it. The group doesn't have to vote. The key is that someone has to take the initiative and the others must react (either stop them or let them). This is the core of the flip: in the first half, they had a rule to follow or break. Now, they have no rule, so any action is a claim of personal authority. Inaction is also a decision.

  Writing:
  - After both halves, each participant chooses one moment (either the sluice gate or the fire) and writes a 300-word scene fragment from their character's perspective. They describe what they did and what they noticed (e.g., "I saw the deputy's hand shake as he reached for the bar" or "I noticed that the newcomer stepped back when the blacksmith stepped forward"). They avoid banned words.
  - Then, they write two sentences about what their character noticed (not decided) in that moment. Example: "I noticed that the blacksmith avoided my eyes when he picked up the bar." or "I noticed that the weaver kept looking at her workshop during the discussion."

  Debrief:
  - The facilitator asks:
     - "In the first part, what were the concrete things people focused on? (e.g., the flour, the metal bar, the time)"
     - "In the second part, what was different about how the decision was made? (e.g., someone stepped forward without asking)"
     - "What did you notice about how people reacted when someone took action in the second part? (e.g., some stepped back, some nodded)"
     - "Where did you almost use a word like 'should' or 'rule'? What did you say instead?"
  - Then, the facilitator can connect:
     - "In the first part, the focus was on the mechanism, the time, the water level — concrete consequences. In the second part, the focus shifted to who was stepping forward and who was holding back — the social consequences."
     - "When someone broke the rule in the first part (if they did), what did that do to the group? When someone acted in the second part, what did that require of the others?"
     - The goal is to highlight that one approach focuses on the shared system (the rule) and the other on the individual claim, and that both have costs (the time pressure in the first, the social pressure in the second).

  What will go wrong:
  - Crime writers might try to solve it like a puzzle, looking for the "right" answer. Encourage them to stay in character and focus on their stakes.
  - Someone might stage a walkout for drama. If so, the facilitator can note that the character they are playing might have left the meeting, and the group continues without them (but they miss the exercise).
  - The group might get stuck in indecision. The clock forces a consequence, which is part of the design.
  - Someone might use a banned word. The facilitator can gently remind: "Try to say that without using that word."

  What the exercise can't do:
  - It won't resolve the moral question. The facilitator must say: "The point was not to decide which is better, but to feel both in action. In your writing, you might find that sometimes one grammar feels more natural and sometimes the other, depending on the situation and the character."
  - It might not perfectly balance the two grammars. The facilitator can note that the exercise is a starting point for exploration in their writing.

  Timing:
  - Intro: 5 mins
  - First Half: 35 mins (15 mins for decision, but allow extra for discussion and the consequence if they run over)
  - Second Half: 35 mins (15 mins for decision, extra for discussion)
  - Writing: 10 mins
  - Debrief: 5 mins

  Total: 90 mins.

  This design avoids resolution and focuses on the experience. The two halves show the two grammars in action: the first in the context of a rule (even if obsolete), the second in the context of no rule, where every action is a social bid.
answer: |-
  ### Workshop Design: "The Sluice and the Fire"  
  **Goal:** Create visceral understanding of two moral grammars (rule-as-shared-life vs. individual-conscience-as-social-bid) through experiential dilemmas. No resolution—participants leave with ambiguity and a scene fragment.  

  **Structure:**  
  1. **Intro (5 min):** Set the scene neutrally. *"You’re in a river town. Rain’s falling, river’s rising. The sluice gate controls the water. Only the warden should open it—but they’re 40 minutes away. The gate can be forced now with a metal bar. If water rises too high, cellars flood. If you force it, you might break the mechanism. A clock is running."* Ban the moral words. Assign roles randomly.  

  2. **First Half: The Sluice Gate (35 min)**  
     - **Scenario:** Obsolete rule ("only warden opens gate"). Warden is 40 min away. Gate can be forced safely with a bar (consequentialist case is clean—no hidden wisdom). If not opened in **15 real-time minutes**, the inn’s cellar floods (mild consequence: lose stored ale, smell lingers for weeks).  
     - **Decision:** Group must choose: **force gate now** or **wait for warden**. No voting—consensus or inaction triggers consequence.  
     - **Roles & Cards (11 people):**  
       - Each gets a **role card** (public: name/job) and a **private card** (hidden: stake + private fact).  
       - **Example Role Cards:**  
         - *Baker:* "Your cellar holds heirloom sourdough starter. Water ruins it."  
         - *Deputy:* "The mayor trusts you to ‘keep order’ while they’re away."  
         - *Newcomer:* "You’re restoring a timber-frame house; flood mud cracks foundations."  
         - *Clerk:* "You log town incidents; your entries affect insurance payouts."  
         - *Blacksmith:* "You made the new gate mechanism. It’s durable but untested."  
         *(Full role list in appendix)*  
       - **Private Stakes (e.g.):**  
         - *Baker’s stake:* "If gate is forced, vibrations crack your cellar walls. If you wait, starter drowns."  
         - *Deputy’s stake:* "If you endorse forcing, the mayor calls you rash. If you wait, they call you weak."  
         - *Clerk’s stake:* "If no one forces it, your log shows ‘no action taken’—townsfolk resent you."  
       - **Private Facts (e.g.):**  
         - *Baker:* "Your cellar door swells shut when damp—you can’t save the starter if water rises."  
         - *Newcomer:* "You found a crowbar by the gate last week—it’s in your cart now."  
         - *Clerk:* "The rule book’s sluice page is missing—you don’t know if forcing voids warranties."  
     - **Mechanics:**  
       - **Clock counts 15 min.** If no decision, facilitator announces: "Time’s up. The inn’s cellar floods—damp ale smell fills the square for weeks."  
       - Participants argue using concrete details (e.g., "My starter dissolves in water," "The bar might bend the latch," "The warden’s cart has a broken wheel—I saw it yesterday").  
       - **Facilitator interrupts if banned words are used:** "Rephrase—use what you see or touch."  

  3. **Second Half: The Fire & the Valve (35 min)**  
     - **The Flip:** *"Months later. The sluice rule was scrapped after the flood. The warden quit. Now a fire starts in the weaver’s workshop. The town’s water reserve (for drinking) can be used via a valve to douse it—but it’s the only reserve. You can open it now or try bucket chains. There’s no rule, no office—just who steps up."*  
     - **Why it Works:** Forces the "individual conscience as social bid." Opening the valve isn’t just acting—it’s claiming authority. Others must endorse (help) or repudiate (stop) you. Inaction avoids judgment but risks fire.  
     - **Decision:** Group must choose: **open valve now** or **rely on buckets**. If no decision in **15 min**, fire spreads to bakery (consequence: smoke damage ruins bread orders).  
     - **Adjusted Roles & Cards:** Same roles, new stakes/facts. Focus shifts to social exposure.  
       - **Private Stakes (e.g.):**  
         - *Baker’s stake:* "If valve is opened, reserve empties—you can’t bake bread tomorrow. If you open it, neighbors say you ‘chose bread over lives.’"  
         - *Deputy’s stake:* "If you open the valve, others call you a hero—but the mayor says you ‘overstepped.’ If you don’t, they say you failed leadership."  
         - *Newcomer’s stake:* "If you touch the valve, they say ‘outsiders don’t decide.’ If you don’t, they say ‘you don’t care about our town.’"  
       - **Private Facts (e.g.):**  
         - *Weaver:* "Your daughter’s wedding gown is in the workshop."  
         - *Clerk:* "The valve handle is loose—it might break if forced."  
         - *Blacksmith:* "Bucket chains won’t work—the well rope is frayed (you noticed yesterday)."  
     - **Mechanics:**  
       - **Clock counts 15 min.** Key difference: Anyone can physically stand and move toward the valve (mimed). If they do, the group must react: join them, block them, or ignore.  
       - Focus on **physical actions** (e.g., "I grab the valve handle," "I stand in front of the newcomer," "I start filling buckets").  
       - Consequence if indecisive: "Smoke chokes the bakery—your next batch of bread tastes of ash."  

  4. **Writing (10 min):**  
     - Each writer drafts a **300-word scene fragment** from their character’s POV during one dilemma (their choice). Must include:  
       - Concrete details (sights/sounds: "water seeping under the cellar door," "the valve’s rust flaking onto my hands").  
       - An action ("I handed the crowbar to the blacksmith," "I stepped away from the valve").  
     - Plus **two "noticed" sentences** (e.g., "I noticed the deputy’s knuckles whitening on the crowbar," "I noticed the weaver avoiding my eyes when I reached for the valve").  

  5. **Debrief (5 min):**  
     - Ask:  
       - "In the sluice moment, what details made you lean toward acting or waiting?" (Links to rule-as-shared-life: focus on mechanisms, time, physical stakes.)  
       - "In the fire moment, what happened when someone moved toward the valve?" (Links to conscience-as-social-bid: "When X stood up, I felt I had to stand with them or it meant I didn’t trust them.")  
       - "Where did you almost say a banned word? What did you say instead?" (Highlight substitutions, e.g., "should" → "the water will rise in 10 minutes.")  
     - **Map to the Idea:**  
       - Sluice = Rule protects from drowning (literal/consequences).  
       - Fire = Rule-following (inaction) protects from social judgment; action forces ratification.  
       - When someone says "We can’t wait!" in Sluice, note how it focuses on shared loss (cellars, starter). When someone grabs the valve in Fire, note how the group freezes—they now judge the actor.  

  ---  
  ### Appendix: Practicalities  
  **Roles (11 People):**  
  1. **Baker:** Cellar holds irreplaceable sourdough starter.  
  2. **Deputy:** Acting mayor’s authority; promotion hinges on trust.  
  3. **Newcomer:** Recently arrived; seeks community acceptance.  
  4. **Clerk:** Keeps town records; order and documentation matter.  
  5. **Innkeeper:** Ale stores in cellar; reputation for hospitality.  
  6. **Blacksmith:** Built/maintains town tools; practical fixer.  
  7. **Farmer:** Livestock in low pastures; animals panic in water.  
  8. **Miller:** Millwheel clogs easily; water flow is livelihood.  
  9. **Weaver:** Workshop full of delicate fabrics; fire/flood ruin them.  
  10. **Schoolteacher:** Children’s safety; school on high ground.  
  11. **Elder:** Town historian; remembers past floods/fires.  

  **What Will Go Wrong:**  
  - **Crime writers "solve" it:** They’ll hunt for loopholes (e.g., "Can we divert water?"). Redirect: "Your character only knows what’s on their card. Focus on your stake."  
  - **Walkout for drama:** If someone leaves, note: "Your character’s absence shifts the group—maybe they’re the one with the bar/fact." Incorporate it.  
  - **Time crunch:** Groups often dither. Let the clock run out—the consequence reinforces the cost of deliberation.  
  - **Banned words slip:** Expect "should" or "right." Interrupt gently: "Show us, don’t tell us. What does your character see or touch?"  

  **What the Exercise Can’t Do (Say This Afterwards):**  
  - "It won’t tell you which grammar is ‘better.’ It’s a lens for your characters. In one scene, the rule might feel like cowardice; in another, the individual bid might feel selfish. Your job is to sit in that discomfort."  
  - "It can’t simulate lifelong cultural conditioning—only a flashpoint. Afterwards, ask: How would your character justify this later, over beer, without moral words?"  

  **Why It Meets Your Constraints:**  
  - **Banned words enforced:** Cards/stakes force concrete language (e.g., "my cellar cracks" vs. "it’s wrong").  
  - **Private stakes:** Losses are hyper-local (starter, promotion, invitation), making ethics emergent.  
  - **Clock costs deliberation:** Sluice = time lost worsens flooding. Fire = hesitation spreads fire.  
  - **No resolution:** Stakes are double-edged (e.g., forcing the gate saves the weaver’s fabric but cracks the baker’s walls; opening the valve saves the workshop but ruins bread).  
  - **Gut-level second half:** Fire isn’t liberation—it’s social exposure. Forcing the valve requires others to endorse/repudiate, creating visceral tension ("Do I back them? Stop them?").  

  **Final Participant Takeaway:**  
  - A 300-word scene fragment (raw, sensory) + two "noticed" sentences.  
  - Ambiguity: "My character noticed the crowbar felt colder than the rain. They didn’t decide if it was brave—they saw the blacksmith’s hand shake."  

  ---  
  **Run it cold. Let the friction unfold.** The power is in the unresolved tension—both grammars will feel necessary, and neither "wins."
