  The user wants a practical decision procedure that can handle three categories: (1) genuine literary merit, (2) self-serving reasons, and (3) important-but-not-literary reasons like an author's courage. They need something they can apply quickly to real cases, including situations where they haven't finished reading the book.

  Looking at their cases: The friend's competent but unremarkable novel presents a loyalty vs honesty dilemma. Praising the rival's brilliant work risks appearing self-serving. The politically important but flawed book raises questions about whether social value justifies literary praise.

  I should build a step-by-step framework with clear stopping points. It needs to handle partial reads and offer alternative responses when praise isn't warranted. The procedure should flag where judgments are subjective and acknowledge unresolved philosophical tensions.

  For the test cases, the output should be uncomfortably honest - especially where the process dictates declining praise despite compelling non-literary reasons. The conclusion should clarify the method's limits, particularly when external factors overwhelm literary evaluation entirely.

  The challenge is balancing philosophical rigor with practical usability while respecting both the integrity of literary judgment and the real-world pressures of publishing.
answer: |-
  Here is a standing decision procedure for evaluating blurb requests, designed for clarity, efficiency, and ethical integrity. It prioritizes literary merit while acknowledging other pressures, flags judgment calls, and provides exit ramps.

  **The Three-Step Blurb Decision Procedure**

  1.  **Step 1: Literary Merit Assessment**
      *   **Question:** "Based on the material read, does the work exhibit sufficient *literary* excellence (craft, insight, originality, coherence, execution of intent) to justify a statement of admiration *as a novel*?"
      *   **Sufficient Answer:** A clear "Yes" based on specific textual evidence (e.g., "The prose achieves remarkable X," "The structure masterfully handles Y," "It offers a genuinely new perspective on Z").
      *   **Stop with 'No':** If the answer is "No" or "Insufficient Evidence" (e.g., the craft is demonstrably poor, the ideas are clichéd, the partial MS shows fundamental flaws, you haven't read enough *and* what you read didn't impress). *Proceed to Step 3 for alternatives.*
      *   **Stop & Hand Back:** **Judgment Call.** If the evidence is mixed or borderline, or if "excellence" feels arguable but not compelling *to you as a novelist*. (This is where your personal literary sensibility *must* operate; the procedure can't define "sufficient" for you).
      *   **Partial Manuscript?** If you haven't read enough: Answer must be "Yes" based *only* on what you *have* read. If what you've read isn't strong enough to extrapolate genuine admiration, the answer is "Insufficient Evidence" → Stop with 'No' for literary praise.

  2.  **Step 2: Non-Literary Motivator Check**
      *   **Question:** "Am I considering providing praise primarily due to external factors (friendship, obligation, politics, commercial pressure, author's vulnerability, desire to be seen a certain way) *despite* reservations identified in Step 1?"
      *   **Sufficient Answer:** A clear "No".
      *   **Stop with 'No' (for standard praise):** If the answer is "Yes". *Proceed to Step 3 for alternatives.*
      *   **Stop & Hand Back:** **Judgment Call.** If external factors are significant *but* Step 1 yielded a solid "Yes". (The procedure flags the conflict; *you* decide if the external factor unduly influences the *wording* of your praise. Be hyper-vigilant about honesty here).
      *   *Note: This step catches Category 2 (self/situation) and Category 3 (important-but-not-literary-excellence) reasons trying to drive the blurb when literary merit is insufficient.*

  3.  **Step 3: Alternative Response**
      *   **Question:** "Given Step 1 ('No' or 'Insufficient Evidence') and/or Step 2 ('Yes'), is there an honest, non-misleading alternative statement I can make that supports the book/author without asserting literary admiration I don't feel?"
      *   **Sufficient Answer:** A specific, truthful statement that fits the context (see "Legitimate Alternatives" below).
      *   **Stop with 'No' (Full Stop):** If no honest alternative feels appropriate or feasible. (Send a polite decline: "I'm so sorry, I'm buried in deadlines and won't be able to provide a quote this time," or "I didn't feel I was the right reader for this project").
      *   **Stop & Hand Back:** **Judgment Call.** If crafting an alternative requires navigating complex nuances of honesty, potential harm, or political weight. (The procedure gets you here; *you* must weigh the ethics of speaking vs. staying silent).

  **Legitimate Alternatives (Step 3):**
  *   **Contextual Importance:** "[Author's Name] tackles a crucial subject with necessary urgency." (Focuses on topic, not execution).
  *   **Courage/Respect:** "This book's existence is an act of courage we should all respect." (Praises the act, not the art).
  *   **Specific, Limited Praise:** "Chapter 3 contains a scene of devastating emotional power." (True if limited to that element).
  *   **Support Without Evaluation:** "I am proud to support [Author's Name] and the vital stories they tell." (Focuses on support).
  *   **Importance of Platform:** "This voice needs to be heard." (About the author/context, not the book's quality).

  **Illegitimate Alternatives (Relabeling Wrong-Kind Reasons):**
  *   "A stunning achievement..." (when it's not).
  *   "Masterfully crafted..." (when it's clumsy).
  *   "A brilliant new voice..." (when the writing isn't brilliant).
  *   "Essential reading..." (if based *only* on context, not literary merit). *Unless* you genuinely believe the context *makes* it essential, and you'd stand by that claim regardless of author/politics.

  **Applying the Procedure to Cases**

  1.  **Friend's Competent First Novel (Small Press):**
      *   **Step 1:** "Competent, unambitious." → Likely borderline. **Hand Back.** (Is "competent" *enough* for *you* to honestly praise it as a novel?).
      *   *Assume Hand Back leads to cautious 'No' on purely literary grounds.*
      *   **Step 2:** Friendship & commercial pressure are strong motivators. Answer: **Yes.** → Stop with 'No' for standard praise. Proceed to Step 3.
      *   **Step 3:** **Alternative Available.** "A promising debut that marks [Friend's Name] as a writer to watch." (If "promising" is honest based on competence). *Or:* "I'm delighted to see [Friend's Name]'s engaging story find its readers." (Focuses on support/friendship, avoids literary judgment). **Use Alternative.**

  2.  **Best Novel of the Year (Feuding Rival):**
      *   **Step 1:** "Best novel I have read this year." → Clear **Yes.**
      *   **Step 2:** Praise will be seen as apology & flatters you. Are these *primary* motivators *despite* literary merit? Probably **No.** (The literary merit is genuine and primary). **Proceed.**
      *   **Stop & Hand Back (from Step 2).** Significant external perception exists. *You* must decide: Can you write praise focused *solely* on the book's undeniable merits, phrased to minimize focus on the past feud or your ego? If yes, provide honest literary praise. If the baggage feels too heavy, Step 3 Alternative: Decline politely ("Not the right fit for me to blurb"). **Likely Verdict:** Provide the praise. The literary merit is clear (Step 1 Yes), the external factors (Step 2) exist but don't negate the valid reason for admiration.

  3.  **Clumsy but Urgent Novel (At-Risk Author):**
      *   **Step 1:** "Formally clumsy." → **No.** (Craft is flawed). Proceed to Step 3? *Wait, Step 2 next.*
      *   **Step 2:** Political urgency & author's risk are the *primary* motivators for wanting to praise. Answer: **Yes.** → Stop with 'No' for *standard literary praise*. Proceed to Step 3.
      *   **Step 3:** **Alternative Available & Crucial.** "[Author's Name] delivers a vital, urgent message that demands our attention and action. Supporting this book is an act of solidarity." (Focuses entirely on context, importance, and support; avoids false claims about literary quality). **Use Alternative.**

  **What the Procedure Cannot Do:**

  1.  **Define "Literary Merit":** This is inherently subjective. The procedure relies on *your* judgment as a novelist at Step 1 (Hand Back). It flags the need for that judgment but cannot make it for you.
  2.  **Resolve Deep Value Conflicts:** When the "right/wrong kind of reason" distinction collapses because the *context is the primary value* (e.g., protecting a dissident), the procedure (Step 3 Alternatives) offers an honest path *other than false literary praise*. It cannot tell you when context *should* override literary judgment entirely; it only prevents dishonesty by separating the statements.
  3.  **Handle "Adjacent Attitude" Bleed Perfectly:** It flags Category 3 reasons in Step 2, and Step 3 offers alternatives. However, distinguishing "urgency" as a reason for reading vs. a reason for *literary admiration* remains a judgment call (Step 1 Hand Back or Step 2 Hand Back). The procedure makes you confront it but can't eliminate the nuance.
  4.  **Eliminate All Awkwardness:** Saying "no" to a friend (Case 1) or offering only contextual support for the at-risk author (Case 3) may feel unsatisfying or difficult. The procedure prioritizes honesty over comfort.
  5.  **Guarantee "Correct" Answers in Murky Cases:** Borderline literary merit combined with strong external pressures (like a friend's *almost-there* novel) will always be a difficult, values-based decision (Steps 1 & 2 Hand Back points). The procedure ensures you *make* the decision consciously.
  6.  **Solve the Underlying Philosophy:** The "wrong kind of reasons" problem is genuinely unsettled. The procedure *uses* the distinction pragmatically (separating literary assessment from other factors) without claiming to resolve the deep philosophical puzzle. It treats "reasons for admiration *as a novel*" as a distinct category requiring specific textual evidence.

  **When the Distinction Collapses (Your Final Question):**
  When the political/social context *is* the overwhelming factor (e.g., the dissident author), the procedure **does not collapse.** It forces you out of the literary praise track (via Step 1 No + Step 2 Yes) and into Step 3. Here, you craft a statement that is *true to the actual reason* (solidarity, urgency, importance) without falsely co-opting the language of literary admiration. This *is* the honest solution: decouple the necessary support from the dishonest claim. If you feel compelled to offer literary praise anyway, recognize it *is* a species of untruth, however well-intentioned. The procedure highlights this choice point explicitly.

  This procedure provides a clear, sequential framework to navigate the ethical and practical minefield of blurbs quickly. It forces conscious consideration of literary merit first, flags external pressures, offers honest alternatives, and explicitly marks where your unavoidable literary and ethical judgments must take over.
