answer: |-
  ### (1) Exam Question  
  **Williamson argues that there are no non-trivial luminous conditions—states such that whenever one is in them, one is in a position to know one is in them—using his "margin for error" argument. This undermines the KK principle (that if one knows p, one is in a position to know that one knows p). One retreat grants Williamson’s point but proposes *Comparative Luminosity* (CL):**  

  > **CL**: Whenever your confidence in proposition *p* is strictly greater than your confidence in proposition *q*, you are in a position to know that your confidence in *p* is greater than in *q*.  

  **CL aims to provide a luminous foundation for an epistemology based on comparative confidence while evading Williamson’s sorites-style argument. Assess this retreat.**  

  **(a)** Clarify how CL differs from the KK principle and standard luminosity claims.  
  **(b)** Does Williamson’s margin-for-error argument generalize to refute CL? Explain why the argument’s success depends *only* on there being a nonzero margin for error, not its size.  
  **(c)** Could a modified CL requiring a *discriminable gap* (e.g., confidence in *p* exceeds confidence in *q* by at least margin δ) salvage luminosity? Would such a principle fulfill the theoretical roles KK was meant to play?  

  ---

  ### (2) Model Answer (≈600 words)  
  **(a) Distinguishing CL, KK, and Luminosity**  
  Standard luminosity claims that for some condition *C* (e.g., *feeling cold*), if *C* obtains, one is in a position to know it obtains. The KK principle is a luminosity claim for the condition *knowing p*. Both require infallible access to an *absolute* state. CL retreats to luminosity for *comparative* states: it claims infallible access to *relations* between confidence levels (e.g., conf(*p*) > conf(*q*)), not the absolute values themselves. This aims to evade sorites problems by denying that confidence gradations have sharp boundaries.  

  **(b) Generalizing the Margin-for-Error Argument to CL**  
  Williamson’s argument *does* generalize to refute CL. The core insight is that knowledge requires a margin for error: to know proposition *S* in circumstance *α*, *S* must hold in all circumstances sufficiently similar to *α*. For CL, the target proposition is: “conf(*p*) > conf(*q*)”. Consider a series of gradually changing cases where conf(*p*) decreases and conf(*q*) increases incrementally (e.g., evaluating propositions in dimming light).  

  In case *i*, suppose conf(*p*) > conf(*q*) by a tiny margin. In case *i+1*, conf(*p*) and conf(*q*) are almost identical. If case *i+1* is sufficiently similar to *i*, then:  
  - To know “conf(*p*) > conf(*q*)” in *i*, this proposition must hold in *i+1* (per margin for error).  
  - But in *i+1*, it may be false that conf(*p*) > conf(*q*).  

  Thus, in case *i* (where the comparison holds), one cannot know it—violating CL. Crucially, this holds for *any nonzero margin*. The argument relies only on the *existence* of pairwise-indiscriminable cases where the truth-value of “conf(*p*) > conf(*q*)” flips. A larger margin would require *coarser* discriminability, but as long as there is *some* continuum of cases (e.g., confidences changing via imperceptible increments), a boundary-crossing will occur somewhere. The size of the margin is irrelevant; what matters is that confidence comparisons lack *sharp* boundaries across a continuum.  

  **(c) Margin-Relative CL and Functional Adequacy**  
  A modified CL could require a discriminable gap: “If conf(*p*) exceeds conf(*q*) by δ, one is in a position to know it.” This *avoids* the margin-for-error refutation because δ exceeds the margin for error. If δ is larger than the minimal discriminable gap, one can reliably detect conf(*p*) > conf(*q*) when the gap is ≥δ.  

  However, this modified CL fails to fulfill KK’s theoretical roles:  
  1. **Justificatory Internalism**: KK aimed to ensure agents could always access their epistemic status. A gap-adjusted CL only delivers knowledge for *salient* confidence differences, not all cases where confidence rankings hold. If conf(*p*) > conf(*q*) by a sub-δ margin, the agent cannot know it—undermining the goal of total access.  
  2. **Iterated Knowledge**: KK supports principles like “knowledge entails knowable knowledge.” Gap-adjusted CL permits failures when confidence differences are small (e.g., one cannot know that one knows *p* if conf(Kp) exceeds conf(¬Kp) by <δ).  
  3. **Anti-Luck Conditions**: While gap-adjusted CL is reliable, it abandons the *infallibilist* ambition of luminosity. It concedes that agents cannot discriminate all actual confidence relations, only those with “safe” margins.  

  Thus, while gap-adjusted CL is *knowable*, it sacrifices the core motivation for luminosity: infallible access to one’s epistemic states.  

  ---

  ### (3) Marking Scheme (20 points total)  
  **Must-hit points** (deduct -4 for each missed point):  
  1. **Distinguish CL from KK/luminosity** (4 pts):  
     - *Note: Weak answers conflate CL with KK or treat confidence comparisons as absolute states.*  
  2. **Generalize margin-for-error to CL** (4 pts):  
     - *Note: Many fail to show how indiscriminable cases force boundary problems for comparisons.*  
  3. **Explain margin size irrelevance** (4 pts):  
     - *Note: Candidates often fixate on sorites vagueness rather than the structural need for a safety buffer.*  
  4. **Assess gap-adjusted CL’s luminosity** (4 pts):  
     - *Note: Some claim it restores luminosity, missing that luminosity requires access to *all* instances of the state.*  
  5. **Evaluate functional adequacy for KK’s roles** (4 pts):  
     - *Note: A common oversight is ignoring how sub-δ comparisons undermine internalism.*  

  **Grade boundaries**: 17–20: Excellent; 13–16: Good; 9–12: Adequate; 5–8: Poor; 0–4: Unsatisfactory.
