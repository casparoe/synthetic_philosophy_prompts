answer: |-
  You've grasped the core tension brilliantly—and your quant friend is partially right, but let's dissect it step-by-step. We'll address the quantitative question, the "single-shot policy," risk aversion, and the questionable step in the money-pump argument.

  ### 1. **The Quantitative Question: Worst-Case Loss**
     - **For Allais Preferences:**  
       There is **no fixed, computable "price" for your incoherence**. The loss depends on the bookie's strategy and your exact indifference points. Here’s why:
       - Suppose you prefer **A: $1M guaranteed** over **B: 89% chance $1M, 10% $5M, 1% $0** (classic Allais reversal).  
       - But in a shifted context (e.g., 1% chance of the original choice), you prefer **B': 10% $5M, 90% $0** over **A': 11% $1M, 89% $0**.  
       - A bookie could:  
         1. Sell you a "cancellation insurance" contract for $X that pays you if you face the Allais choice later.  
         2. Later, offer you a "trade" where you pay a small fee $Y to switch from A to B.  
         3. Exploit your reversal when probabilities shift.  
       - Your loss scales with the stakes. If the original choice involves $1M, losses could be thousands; if scaled to $100, losses might be trivial. **There’s no upper bound**—a malicious bookie could iterate the pump or increase stakes.

     - **For Risk Aversion:**  
       Your coin-flip rejection ($110 vs. –$100) isn’t exploitable **if** your utility function is concave (e.g., diminishing returns). Expected Utility Theory (EUT) permits this!  
       - **Problem only if**: You reject +$110/–$100 but accept +$11/–$10 with *identical utility ratios*. If so, a bookie could:  
         1. Offer many small favorable bets you accept.  
         2. Bundle them into one large unfavorable bet you’d reject—but you already committed to the parts.  
       - Since you decline at "any stake large enough to matter," your preferences are **consistent with EUT** (via a concave utility function like √wealth). **No money pump here.**

  ### 2. **The "Single-Shot Policy" – Does It Work?**
     - **Yes, it blocks exploitation**: By precommitting to a weekly ranking and refusing re-deliberation, you avoid sequential traps. The money pump relies on:
       - Offering you Choice 1 (e.g., trade A for B).  
       - Then offering Choice 2 (e.g., trade B for C), exploiting preference reversals.  
       Your policy breaks the sequence at "Choice 1" by refusing all offers.  
     - **But it doesn’t "fix" incoherence**:  
       - EUT requires your preferences to satisfy axioms (e.g., Independence: if A≻B, then pA+(1-p)C ≻ pB+(1-p)C).  
       - Your Allais pattern violates Independence. The policy hides this violation but doesn’t resolve it. You still *have* inconsistent rankings—you just avoid situations that expose them.  
       - **Analogy**: Locking your door prevents theft, but doesn’t mean you’re suddenly wealthy. You’ve avoided exploitation but not satisfied EUT’s demands.

  ### 3. **The Questionable Step in the Money-Pump Argument**
     Your intuition is sharp. The argument assumes **dynamic consistency**:  
     - *"If you prefer X over Y today, you must prefer X over Y tomorrow in the same contingency, even if you refused a trade earlier."*  
     - But humans often violate this! We treat "$1M guaranteed" differently when it’s certain vs. probabilistic, and past choices *do* alter our framing (e.g., regret).  
     - **Is this assumption fair?**  
       - Proponents: Rationality requires evaluating outcomes *only by final states*, not paths. Past offers are "sunk costs."  
       - Critics: Framing matters. The fact that you were offered a trade *is* new information (e.g., "Why is this bookie approaching me?").  
     - **Your policy exploits this weakness**: By refusing to re-engage, you sidestep the assumption. But note: the Dutch book is a **theoretical vulnerability**, not a practical prediction. Your policy makes you unexploitable, but your preferences remain non-EUT.

  ### 4. **Is Risk Aversion the Problem?**
     - **Absolutely not**. EUT *encourages* risk aversion via concave utility functions. Declining +$110/–$100 is rational if:  
       \[
       0.5 \times u(\text{wealth} + 110) + 0.5 \times u(\text{wealth} - 100) < u(\text{wealth})
       \]
       For \( u(w) = \sqrt{w} \) and wealth < $5,000, this holds.  
     - **The real target is incoherence**, like the Allais pattern, where identical *outcome differences* are weighted differently based on framing.

  ### Key Takeaways:
  1. **No budgetable "price"** for your Allais incoherence—losses depend on bookie ingenuity and stakes.  
  2. **Your policy blocks exploitation** but doesn’t align preferences with EUT. It’s a practical shield, not a rationality fix.  
  3. **Risk aversion is fine**; only the Allais reversal is vulnerable.  
  4. **The money pump’s weak assumption** is dynamic consistency. Granting it makes incoherence "irrational." Rejecting it (via your policy) preserves exploitability but feels behaviorally plausible.  

  ### Practical Advice:
  - **For your app**: Implement the "single-shot policy." It’s a smart hack to avoid real-world exploitation.  
  - **For your curiosity**: Read Kahneman & Tversky’s [Prospect Theory (1979)](https://www.jstor.org/stable/1914185) (accessible via JSTOR, often free). It formalizes why your Allais choice happens and why dynamic consistency fails.  
  - **Philosophically**: You’re wrestling with whether rationality is about *preferences* or *behavior*. Dutch books target preferences; your policy alters behavior. Both are defensible.  

  Your engineering lens—seeking a "worst-case number" and a "patch" for incoherence—is refreshing. While no number exists, your policy is a valid exploit-mitigation strategy. The incoherence remains, but you’ve firewalled it. Well done.
