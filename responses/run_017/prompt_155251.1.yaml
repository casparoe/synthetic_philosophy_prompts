  Let me tackle the quantitative question first. For the Allais pattern, exploitation requires sequential offers that exploit preference reversals. But crucially, there's no fixed "price tag" for incoherence because the loss depends entirely on how the bookie structures the sequence. The $1M example shows how the loss can be scaled arbitrarily—that's unsettling but important. For risk aversion, the coin flip example isn't inherently exploitable unless preferences are inconsistent across stakes, which theirs aren't. 

  Their "single-shot policy" is clever but misunderstands the argument's target. The money-pump isn't about literal wallet-emptying; it's a reductio ad absurdum showing that their preference pattern forces them to accept sequences of choices that leave them worse off by their own judgment. Blocking re-evaluation avoids exploitation but doesn't resolve the underlying inconsistency—it just dodges the symptom. The quant friend is right: the issue is the preferences themselves, not behavior under re-deliberation.

  I should emphasize that risk aversion per se is fine under EUT—it's captured by concave utility functions. What's problematic is the Allais-type reversal, which violates independence. The user might be conflating these. 

  They need to hear that their policy "works" pragmatically but doesn't address the normative heart of Dutch books: that incoherent preferences make you vulnerable in principle, even if you avoid pumps procedurally. The deeper tension is whether they care more about exploitability (policy suffices) or consistency (requires preference revision). 

  Their engineering mindset shines through—they want a numerical "budget" for incoherence and a technical fix. I should acknowledge that practicality while gently stressing that the argument is about logical consistency, not financial engineering. The unspoken need might be reassurance that their risk aversion isn't irrational, just the Allais pattern. 

