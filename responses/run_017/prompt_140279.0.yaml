answer: |-
  **Bottom line:** The key separators are whose situation fixes the threshold and knowledge's normative role, rendering two cases (symmetric stakes and unopened will) largely redundant for branching.

  ---

  ### DECISION TREE: KNOWLEDGE ATTRIBUTIONS AND STAKES  
  *Answer sequentially; each path ends at a theory.*

  1.  **Does knowledge license action?**  
      *(If "no," go to Q2; if "yes," go to Q3.)*

  2.  **Does knowledge license assertion?**  
      *(If "no," go to **Leaf 1**; if "yes," go to Q4.)*

  3.  **In Case 1 (stranger's career depends on p), can the subject know p?**  
      *(If "yes," go to Q5; if "no," go to Q6.)*

  4.  **In Case 5 (eavesdropper denies subject's "I know p"), is the eavesdropper correct?**  
      *(If "yes," go to Q7; if "no," go to **Leaf 2**.)*

  5.  **Whose situation sets the threshold for knowing p?**  
      *(Options: Subject / Attributor or Assessor / Third Party)*

  6.  **In Case 3 (stakes arise after action), was the subject’s knowledge retroactively lost?**  
      *(If "yes," go to **Leaf 3**; if "no," go to Q8.)*

  7.  **In Case 6 (false belief is moral betrayal), is knowing p harder than in identical prudential-low-stakes cases?**  
      *(If "yes," go to **Leaf 7**; if "no," go to **Leaf 8**.)*

  8.  **Does merely raising an error possibility in conversation (without changing practical stakes) raise the threshold?**  
      *(If "yes," go to **Leaf 4**; if "no," go to **Leaf 5**.)*

  ---

  ### LEAVES (THEORIES) & THEIR UNCOMFORTABLE COMMITMENTS  
  1.  **Classical Invariantism (Debunking):** Intuitions about "knowledge" track warranted assertability or actionability, not knowledge itself.  
      *Awkward: Must deny that ordinary speakers track knowledge at all in high-stakes intuitions.*  
  2.  **Classical Invariantism (Conversational):** Stakes effects are pragmatic (Gricean) implicatures about action/assertion, not semantic content.  
      *Awkward: Explains away strong intuitions that "knows" itself expresses different content in high vs. low stakes.*  
  3.  **Subject-Sensitive Invariantism (SSI):** Knowledge depends on the subject’s practical situation (stakes, alternatives).  
      *Awkward: In Case 2 (unopened will), subject has low-stakes knowledge despite massive unknown stakes.*  
  4.  **Contextualism:** "Knows" expresses different relations (set by attributor’s context) in different utterances.  
      *Awkward: Makes disagreements about knowledge (Case 5) often merely verbal.*  
  5.  **Relevant Alternatives Invariantism:** Knowledge requires eliminating contextually relevant alternatives, but relevance is fixed by objective facts, not stakes.  
      *Awkward: Cannot explain why raising an error possibility *alone* (without new evidence) shifts intuitions.*  
  6.  **Contrastivism:** Knowledge is ternary: S knows p rather than q. Contrasts fix the alternatives.  
      *Awkward: Requires massive error in ordinary knowledge reports, which lack explicit contrasts.*  
  7.  **Moral Encroachment:** Knowledge depends on moral (not just prudential) costs of false belief.  
      *Awkward: Severs knowledge from purely epistemic factors in moral-stakes cases (Case 6).*  
  8.  **Relativism (Assessor):** Truth of "S knows p" depends on the assessor’s standards at time of assessment.  
      *Awkward: Allows a single attribution to be true when assessed at t1 but false when assessed at t2 (Case 3).*  

  ---

  ### EMPTY CELLS & UNDIFFERENTIATED PAIRS  
  - **Incoherent Cells:**  
    - *SSI + "Knowledge doesn’t license action"*: SSI requires knowledge to license the subject’s actions.  
    - *Relativism + "Threshold set by Subject/Third Party"*: Relativism requires assessor-dependence.  
  - **Merely Unattractive:**  
    - *"Knowledge licenses nothing" + "Threshold set by Attributor"*: Why tie attributor’s context to knowledge if it’s normatively inert?  
  - **Unexplored:**  
    - *"Knowledge licenses action" + "Threshold set by Third Party"*: No major theory combines these.  

  **Undifferentiated Pairs:**  
  1.  **Contextualism vs. Assessor-Relativism:** Ambiguous in Case 5 (eavesdropper). Both can say the eavesdropper is correct (if their context/standards govern), but only relativism allows retrospective falsification (Case 3).  
  2.  **SSI vs. Contextualism:** Converge when the attributor’s context mirrors the subject’s stakes. Case 1 (stranger’s stakes) distinguishes them: SSI says subject knows (her stakes are low); Contextualism says no if attributor attends to stranger’s stakes.  

  **Case Utility:**  
  - **Real Work:** Case 1 (stranger’s stakes), Case 3 (retrospective stakes), Case 5 (eavesdropper), Case 6 (moral cost).  
  - **Collapses:** Case 2 (unopened will) ≈ Case 1 for SSI/Invariantism; Case 4 (symmetric stakes) is indistinguishable from low stakes (no net risk).
