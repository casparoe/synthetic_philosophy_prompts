prompt: |-
  I am in my final year of secondary school, and for the last two years I have been the student coordinator of my school's exchange programme. Twice a year I write the short "Living Here" insert that visiting students receive before they arrive: three pages, plain English, read mainly by sixteen- and seventeen-year-olds who have never lived abroad, and it has to be signed off by our programme director and by the liaison teacher at the partner school before it goes out. I also take the follow-up calls. A host mother complains that her guest never leaves anything for the waitress and it looks bad in front of the neighbours. A guest reports that his host father drives through red lights and expects him not to mind. A student is told off for standing in a line that nobody else is standing in. Each of these takes an hour of my week, and I never give the same advice twice.

  The paragraph I can never write properly is the one about everyday conventions: tipping, queueing, crossing against the light, taking shoes off indoors, how late one may be, whether one greets everyone in the room, whether one haggles. I do not want to write "when in Rome," and I do not want to write "do what you would do at home as long as it is legal." What I want is a decision procedure that I can run on one convention at a time, in about five minutes, with no library, no theory, and no ability to research local law — and that ends in one of a small number of outputs, something like: follow it; follow it but make clear that you are only following it; do not follow it, but signal that you know you are not; or decline it and explain why.

  If it helps, here are three distinctions I have been circling. Please use them, correct them, or throw them out and supply better ones.

  The first I call brittleness. Some conventions seem to hold only while nearly everyone visibly conforms: if outsiders are seen ignoring them, locals begin to ignore them too, and the practice unravels. An orderly queue of the stand-behind-the-person-in-front sort feels like this. Other conventions seem indifferent to what outsiders do: hosts will keep taking their shoes off in the hallway no matter how many guests keep theirs on. If a convention is brittle in this sense, a visitor's obligation looks stronger, because their non-compliance does not merely say something, it does something to the institution that the locals are relying on. But I have no way to tell brittleness when I look at a convention from the outside, and I suspect I would be tempted to see brittleness wherever I already disapprove of non-compliance. I would like the procedure to say how to make that call honestly, and what to do when I genuinely cannot tell.

  The second is about who pays. Refusing to queue arguably costs the person behind you a place. Refusing to tip arguably costs the server income. Crossing against the light arguably costs no one anything, unless a child copies you. Some non-compliance harms an identifiable person, some merely expresses contempt or indifference, some mostly costs the visitor their own standing with the family. I want these separated, and I want the procedure to be honest about whether "it insults people" is a cost at all, or only a feeling that a visitor is entitled to discount as superstition.

  The third is about clean hands. Some conventions look like adaptations to something unjust: tipping where wages are set on the assumption that tips will make up the difference; a small unofficial payment that moves a form up a pile; a habit of pushing rather than waiting because the service is rationed and only the pushy are served. A student who follows such a convention may be entrenching the thing, and may be the only person present who is in a position not to. A student who refuses may accomplish nothing beyond making a point at somebody else's expense — the host family's, usually. I need the procedure to say which way this cuts and when, and to say it in a form I can defend to a room of parents.

  There is also the matter of the student's own standing. Our students are guests in someone else's house, invited rather than paying, dependent on the family's goodwill, and visibly foreign, so that whatever they do is read as a statement about where they come from. It seems to me that being a guest adds reasons that have nothing to do with whether the convention is a good one. What I cannot work out is whether that means a guest should comply more readily than a stranger would, or whether it means a guest should comply and say plainly that they are complying rather than agreeing.

  So, please: give me the questions in order, what counts as a good enough answer to each when I cannot look anything up, where the procedure stops with a clear instruction, and where it must stop and record that this one is a values call that no procedure can settle for the student. Assume it will be run by someone with no training in philosophy, on conventions from countries I have never visited, in five minutes, with a one-page student-facing version hanging off the end of it.

  Then run it on these three, and tell me plainly what it gives.

  One: tipping in a city where it is genuinely not expected, where a tip is sometimes handed back, and where the host parents say it makes visitors look as if they are showing off.

  Two: crossing against the light in a city where everyone does it, including the host family, where the police occasionally fine foreigners and never locals, and where the student thinks the rule is silly.

  Three, which is the one I am dreading: a partner school in a country where it is entirely normal to slip a small cash gift to the clerk who processes a residence registration so that it moves quickly, where without it the student's papers sit for weeks and their place in the programme is at risk, and where our own school's rules — which I am the one who has to enforce them — forbid it.

  I would especially value it if the procedure returned an answer to at least one of these that I do not want to hear, and if you flagged which steps are guesses wearing the clothing of steps. Please do not point me towards articles or books: I have no access to a university library, and anything in the guide has to be something I can say out loud to thirty parents without a footnote.
reasoning: |-
  Okay, let me approach this systematically. The student coordinator needs a practical decision tool for cultural conventions that's philosophically robust but accessible. They've identified three key distinctions - brittleness, cost distribution, and systemic injustice - which are insightful starting points.

  First, I need to design an assessment sequence that flows logically. The order should be: first determine harm potential, then examine systemic issues, then consider context-specific factors. This prevents premature judgments based on personal bias. For each question, I'll define clear thresholds - like "specific individual harmed" versus "diffuse social cost" - so the coordinator can make consistent calls without research.

  The brittleness concern is valid but tricky. Rather than claiming to detect brittleness (which often is projection), we should focus on observable enforcement mechanisms. Are there immediate social sanctions? Financial penalties? Visible disapproval? This makes it operationalizable. For the "who pays" dilemma, we need categories: direct financial loss, reputational damage to hosts, or purely symbolic offense. The clean hands issue requires distinguishing between perpetuating injustice versus mere cultural difference.

  Applying this to their three cases: 
  For tipping where it's unexpected, the harm analysis shows no victim but potential host embarrassment. The injustice lens reveals no systemic exploitation. Contextually, as guests they should prioritize host guidance. 

  The jaywalking case is interesting - while technically illegal, the universal local practice changes the calculus. Harm is probabilistic (child imitation risk) rather than direct. The key is differentiating between personal risk (student's choice) versus putting others in danger (unacceptable). 

  The bribery case is toughest. Here there's clear harm: the student suffers without payment. But the systemic injustice is evident - it's exploitative and against school rules. The procedure must acknowledge this as a true ethical dilemma where compliance would violate core principles.

  Throughout, I'm flagging where judgments involve unavoidable value calls - like deciding what constitutes "significant" harm or "serious" injustice. The coordinator should note these explicitly when they occur. The output format gives concrete verbs: "comply silently", "comply with disclaimer", etc., tailored to their requested categories.

  The test will be whether this framework returns the uncomfortable bribery conclusion they anticipate while remaining defensible to parents. I'm making sure the assessment steps don't require cultural expertise - just careful observation of effects and mechanisms.
answer: |-
  Here's a practical decision procedure designed for your constraints. It uses your distinctions but reframes them into sequential, actionable questions requiring no research. **Run one question per convention.** The output is one of four actions:

  1.  **Comply Silently:** Follow the convention without comment.
  2.  **Comply & Note:** Follow it, but briefly state you're doing so because it's local custom (e.g., "I see everyone takes shoes off, so I will too").
  3.  **Decline & Explain:** Politely decline to follow it, giving a *simple, non-judgmental reason* related to your own comfort/beliefs (e.g., "I prefer to keep my shoes on if that's alright, I find it more comfortable").
  4.  **Decline & Refuse:** Firmly decline, stating a core ethical principle (rare, reserved for serious injustice). *Requires sign-off from Programme Director/Liaison Teacher if used.*

  **The Decision Procedure (5 Minutes Max Per Convention):**

  1.  **HARM: Does NOT following this convention *directly* and *immediately* cause significant harm?**
      *   **Significant Harm:** Physical injury, serious financial loss (e.g., server losing wage they rely on), major legal trouble (e.g., big fine, arrest), causing a dangerous situation (e.g., traffic accident). *Output: COMPLY SILENTLY (Safety/Preventing Harm trumps all).*
      *   **Minor/Indirect Harm:** Offense, embarrassment, mild inconvenience, potential reputational damage. *Go to Question 2.*
      *   **No Discernible Harm:** *Go to Question 2.*

  2.  **INJUSTICE: Does following this convention feel like it actively supports something clearly unfair or exploitative?**
      *   **Clear Exploitation/Unfairness:** Convention exists *because* of a broken system (e.g., bribes required due to corruption, tipping subsidizing poverty wages, jumping queue because service is deliberately under-resourced). *Go to Question 3.*
      *   **Not Clearly Exploitative/Unfair:** Convention is just different (e.g., shoe removal, greeting styles, queueing etiquette). *Go to Question 4.*
      *   **Uncertain:** *Go to Question 4.* (Assume "Not Clearly Exploitative" if unsure).

  3.  **AGENCY: If it feels exploitative/unfair, does your refusal *actually* help fix it, or does it just hurt someone vulnerable?**
      *   **Hurts Vulnerable Person:** Your refusal primarily punishes the low-level person caught in the system (e.g., clerk doesn't get bribe but also can't process your papers, server loses tip but wage is still low). *Output: COMPLY SILENTLY* (You're not fixing the system; you're harming the pawn). *Flag this convention as problematic to the Programme Director/Liaison Teacher for broader action.*
      *   **Might Challenge System (But Risk High):** Refusal could theoretically highlight the issue, but consequences are severe for you/others (e.g., expulsion from program, host family arrested). *Output: DECLINE & EXPLAIN* (Only if consequence is bearable *to you* - e.g., slower service) OR *COMPLY & NOTE* ("I understand this is how it's done here, but it feels odd to me"). *Discuss with Programme Director/Liaison Teacher ASAP.*
      *   **Doesn't Hurt Vulnerable & Challenges System:** (Extremely rare for a visitor) *Output: DECLINE & REFUSE* (State core reason: "I cannot participate in something I believe is corrupt/unfair"). *Requires Sign-Off.*

  4.  **GUEST/HOST: As a guest reliant on host family goodwill, would NOT following this convention cause significant offense or difficulty *specifically for your host family*?**
      *   **Yes, Significant Host Difficulty/Offense:** Hosts bear financial cost, face social shame, significant inconvenience, or deep cultural offense (e.g., refusing to remove shoes in their sacred-clean-home culture, causing them to lose face with neighbours). *Output: COMPLY SILENTLY* or *COMPLY & NOTE* (Use "Note" only if it feels *very* unnatural to you personally).
      *   **Minor Host Embarrassment/Annoyance:** Hosts might be slightly embarrassed or need to explain (e.g., you don't tip where slightly unexpected, you stand in an empty queue lane). *Output: DECLINE & EXPLAIN* or *COMPLY & NOTE* (Choose based on your comfort level).
      *   **No Discernible Host Impact:** Your action doesn't reflect on them or cause them tangible problems (e.g., jaywalking alone, how you greet strangers *outside* their home). *Output: Your personal choice based on comfort/ethics (often DECLINE & EXPLAIN or COMPLY SILENTLY).*

  **Key for "Good Enough" Answers:**
  *   **Harm:** Rely on common sense. "Significant Harm" = ER visit, jail, losing job/home. "Minor Harm" = hurt feelings, mild inconvenience.
  *   **Injustice:** Be strict. Only "Clear" if the unfairness is blatant (bribes, exploitative wages). If it's just inefficient or different, it's not "injustice" for this step.
  *   **Agency:** Be realistic. As a short-term visitor, you almost never have the power to change systemic injustice without harming vulnerable individuals. Assume refusal harms the pawn unless proven otherwise.
  *   **Guest/Host:** Focus on *tangible consequences* for the host family, not just feelings. "Significant Difficulty" = costs them money, time, serious reputation loss.

  **Where it Stops:**
  *   Clear outputs are given after Harm (if significant harm), Agency (if refusing hurts vulnerable), or Guest/Host.
  *   **Values Call Flag:** Question 3 (Agency) often involves a values judgment about risk and effectiveness. When you get here, note: *"This involves weighing potential harm against challenging injustice. My choice reflects my personal tolerance for risk/consequence in this specific case."*

  **Student-Facing Version (Hanging off the end):**

  > **When faced with a local custom you're unsure about, ask yourself:**
  >
  > 1.  **Harm?** Would *not* doing this likely cause **serious** harm (safety, big money loss, arrest)? **YES:** Do it quietly. **NO/MAYBE:** Next Question.
  > 2.  **Unfair?** Does doing this feel like supporting something clearly wrong or exploitative (bribes, scams)? **YES:** Next Question. **NO/UNSURE:** Skip to Question 4.
  > 3.  **Help or Hurt?** Would refusing actually help fix the problem, or just punish someone stuck in the system? **HURTS VULNERABLE PERSON:** Do it quietly & tell your coordinator later. **MIGHT HELP (BUT RISKY):** Decide based on the risk *you* can handle. **WON'T HURT & HELPS:** Refuse, stating clearly why it's wrong (Check with coordinator first!).
  > 4.  **Host Impact?** Would *not* doing this cause **real problems** or **deep offense** for your host family? **YES:** Do it (quietly or mention it's new for you). **MINOR ANNOYANCE:** Do it or politely explain why you won't. **NO IMPACT:** Do what feels right to you.
  >
  > *   **Comply Silently:** Just do it.
  > *   **Comply & Note:** Do it, say "I see this is the custom here."
  > *   **Decline & Explain:** Don't do it, say *briefly* why ("I'm not comfortable with that," "It's different where I'm from").
  > *   **Decline & Refuse:** Only for serious injustice. State core reason clearly. **Always talk to your coordinator first!**

  ---

  **Applying the Procedure to Your Cases:**

  **Case One: Tipping (Not expected, sometimes handed back, seen as showing off)**

  1.  **Harm?** No significant harm (server wage likely not dependent on it). *Next Question.*
  2.  **Injustice?** Not clearly exploitative/unfair (just a different pay culture). *Go to Question 4.*
  3.  *(Skipped)*
  4.  **Guest/Host?** *YES, Minor/Mild Host Embarrassment/Offense.* Host parents explicitly say it makes visitors look bad/showing off. This causes *them* mild social embarrassment.
      *   **Output: DECLINE & EXPLAIN** OR **COMPLY SILENTLY**. Since no harm/injustice, and host impact is mild embarrassment, student has flexibility. They could choose not to tip *and* briefly explain if asked ("Back home it's customary, but I understand it's different here, so I won't"). Or, to avoid *any* friction, they could simply **COMPLY SILENTLY** (not tip). *COMPLY & NOTE* ("I won't tip since I know it's not expected here") also works. The procedure gives options here.

  **Case Two: Crossing Against Red Light (Everyone does it, host does it, police fine foreigners)**

  1.  **Harm?** *YES, Potential for Significant Harm.* Risk of accident causing physical injury (to self or others, especially if a child copies). While locals do it, the *risk* remains significant harm. **Output: COMPLY SILENTLY (Wait for the light).** *Safety trumps local custom, even if widely flouted.* The police fine reinforces the rule exists for safety, even if selectively enforced.

  **Case Three: "Facilitation Payment" / Bribe (Required for speed, programme risk, school rules forbid)**

  1.  **Harm?** *YES, Significant Harm (to the student).* Without it, papers stall, programme place at risk. This is significant harm *to the student*. **Output: COMPLY SILENTLY.** (Preventing immediate, significant harm to the student overrides initial judgment). *BUT: Flag immediately to Programme Director/Liaison Teacher.*
      *   *However, this feels deeply wrong. Let's see if the procedure forces us to confront the injustice.*
  2.  **Injustice?** *YES, Clear Exploitation/Unfairness.* This is corruption. It exploits the student's need for the permit to extract an unofficial payment. *Go to Question 3.*
  3.  **Agency:** *Hurts Vulnerable Person?* **YES.** Refusing likely hurts the *student* most (programme at risk). Does it hurt the clerk? Maybe slightly (loss of expected small income), but the *primary* vulnerable person harmed is the student. Punishing the corrupt system primarily punishes the student stuck in it. **Output: COMPLY SILENTLY.** (Preventing significant harm to the vulnerable student is paramount). *BUT: Flag urgently and explicitly to Programme Director/Liaison Teacher.* This is a systemic issue the *programme* must address with the partner school/host country authorities, not the individual student. The student's role is to survive the system safely. *Values Call Note: This step involves accepting a corrupt practice to prevent immediate harm to oneself, acknowledging it perpetuates the system but arguing individual refusal is ineffective and self-destructive.*

  **Outputs Summary:**

  1.  **Tipping:** DECLINE & EXPLAIN / COMPLY SILENTLY / COMPLY & NOTE (Student choice, leaning towards not tipping).
  2.  **Jaywalking:** COMPLY SILENTLY (Wait for the light). (*The answer you might not want to hear - contradicts local practice but prioritizes safety*).
  3.  **"Facilitation Payment":** COMPLY SILENTLY. (*The answer you dread, but the procedure forces it based on preventing significant harm to the student. Requires urgent escalation.*).

  **Flagged Guess-Wearing-Steps:**

  1.  **Harm (Jaywalking):** Calling jaywalking a "Significant Harm" risk is a judgment call. It *is* a genuine risk, but locals clearly assess it differently. The procedure prioritizes universal safety risk over local assessment. *This is a values call disguised as a harm assessment.*
  2.  **Agency (Bribe):** Concluding refusal primarily harms the *student* (the vulnerable one) is key. You could argue refusing challenges the system. The procedure *assumes* individual refusal by a temporary visitor is ineffective and only causes self-harm in such contexts. *This is a critical guess/assumption about effectiveness.*
  3.  **Guest/Host (Tipping):** Judging the host impact as "Minor Embarrassment" rather than "Significant Offense" is subjective but crucial for the flexible output. *This is a judgment call.*

  **Defending to Parents:**

  *   Focus on **Safety First** (Jaywalking).
  *   Focus on **Protecting the Student** from immediate, concrete harm (Bribe), while emphasizing this is a *systemic failure* the *school programme* must address urgently with partners, not the student's burden to fight.
  *   For Tipping, emphasize **Host Family Comfort** as the guiding principle, giving the student reasonable flexibility.
  *   Emphasize the procedure prioritizes **preventing tangible harm** and **avoiding severe host family consequences** above abstract principles or minor differences. It forces hard choices in corrupt systems to protect the student, while flagging those systems for higher-level intervention. It errs on the side of safety and practicality for the vulnerable visitor.
