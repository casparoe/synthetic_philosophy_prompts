  Based on Douglass's writings, speeches, and core philosophical commitments—and distinguishing between his explicit views and reasonable extrapolations—here's a clear breakdown:

  ### Core Douglassian Principles (Load-Bearing)
  1. **The Constitution is a *moral* document** whose text must align with "justice, liberty, and humanity" (per his 1860 Glasgow speech).  
  2. **Original intent is irrelevant**—he openly condemned the framers' pro-slavery compromises (e.g., 1852: "The intentions of the framers were dark... but the text is light").  
  3. **Text > Tradition**: He argued slavery was *unconstitutional* precisely because it violated foundational principles ("All Men Created Equal"), even when tradition normalized it.  
  4. **Enforcement requires federal power**: Post-1865, he demanded aggressive federal intervention to crush racist state regimes (e.g., opposing President Johnson's leniency).

  ---

  ### Answers to Your Questions  
  **1. "Deeply Rooted in History/Tradition" Tests (e.g., *Dobbs*)**  
  - **Douglass would reject this outright.**  
    - *His explicit view*: "The whole history of the progress of human liberty shows that all concessions yet made to her august claims have been born of earnest struggle. ... *If there is no struggle, there is no progress*" (1857). **Traditions of oppression (slavery, coverture) prove nothing.**  
    - *Extrapolation*: He'd distinguish "history" from the Constitution's **aspirational principles**. The test would trap Black Americans in the very white-supremacist traditions the 14th Amendment was designed to obliterate.  
    - *Counter to originalism?* Yes—this test prioritizes historical practice over textual principles.  

  **2. Curtailing Congressional Power Under the 14th**  
  - **He'd condemn modern limits (state action doctrine, narrow enforcement)**.  
    - *His explicit view*: In 1888, he denounced the "evasion" of the 14th Amendment, insisting states could not be trusted: "The Federal Government was never so much needed as now."  
    - *Extrapolation*: He'd accept federal power used for *harm* (e.g., mass incarceration) as a **betrayal of the Amendment's purpose**, not an indictment of federal power itself. His solution? **Reinvigorate the 14th's *guarantee* of equality**, not neuter Congress.  
    - *Load-bearing*: His lived experience—fugitive slave laws, Klan terror—made federal enforcement non-negotiable.  

  **3. Knowing the Framers: Trust "Original Intent"?**  
  - **No—he'd find "original intent" dangerous and irrelevant.**  
    - *His explicit view*: "Loyalty to the *idea* of the state is more important than loyalty to the men who made it" (1867). He knew framers like Sumner *and* their racist opponents; he saw the 14th as a **break** with the past, not continuity.  
    - *Extrapolation*: Seeing "sausage-making" (e.g., compromises to appease Southern states) would make him **more skeptical** of intent. He cared about the *ratified text* as a tool for justice.  

  ---

  ### Your Meta-Questions  
  **(a) "Reversal as Discovery vs. Conscription"**  
  - **Father-in-law is half-right on the *what* (Douglass embraced textualism), wrong on the *why*.**  
    - *Evidence against "discovery"*: Douglass admitted in 1851 his shift was partly strategic: Abolitionists needed the Constitution as a "weapon." He called his prior view (that it was pro-slavery) "erroneous," but also noted it served its purpose in "rousing indignation."  
    - *Evidence against pure "conscription"*: He meticulously dissected the text (e.g., "No slavery in the text!") and genuinely believed the *words* were anti-slavery. His 1860 speech: "The Constitution is a GLORIOUS LIBERTY DOCUMENT."  
    - *Verdict*: **Both/and.** He saw textual truth *and* wielded it strategically. His key distinction: **The text's principles were anti-slavery; the framers' *intentions* were corrupt.**  

  **(b) "If Conscription, Is Shamelessness the Lesson?"**  
  - **Douglass would say: "Claim the text—but only because our cause is just."**  
    - *Explicit view*: He condemned pro-slavery "conscriptions" as "tortured interpretations" (1857). For him, textual fidelity *required* aligning with moral truth.  
    - *Extrapolation*: He’d reject "my side should win at all costs." His reversal worked **because he convinced others the text *did* support freedom**. Cynicism would undermine that.  
    - *Load-bearing*: His entire credibility rested on perceived moral *and* intellectual integrity.  

  ---

  ### Ranking the Considerations  
  | **Rank** | **Consideration**                                  | **Why Load-Bearing**                                                                 |
  |----------|----------------------------------------------------|--------------------------------------------------------------------------------------|
  | **1**    | His rejection of framers' intent (1852 speeches)   | Directly undermines originalism's core premise.                                      |
  | **2**    | "No struggle, no progress" (1857)                  | Proves he saw appeals to "tradition" as surrender to oppression.                     |
  | **3**    | 1888 writings on federal power                     | Shows his commitment to strong 14th Amendment enforcement.                           |
  | **4**    | 1851 admission of strategic shift                  | Weakens "pure discovery" but doesn't prove cynicism.                                 |

  ### Bottom Line for Your 12-Year-Old (and Father-in-Law)
  - **Douglass wasn't an originalist:** He mocked "what the framers intended."  
  - **He wasn't a living constitutionalist:** He insisted the text *already* banned slavery.  
  - **He was a *moral textualist*:** The Constitution must be read through its "plain meaning" *and* its ideals of liberty. If "history and tradition" conflict with those ideals, **tradition loses.**  
  - **Federal power?** Essential—but only if used for liberation, not oppression.  

  **Verdict:** Your sister-in-law is closer—Douglass prioritized moral reading *through* text—but your father-in-law is wrong about originalism. The "Douglassian" stance: **The Constitution's words are weapons for justice; wield them without apology, but never dishonestly.**
