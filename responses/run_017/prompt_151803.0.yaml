prompt: |-
  I work as a claims adjuster at a regional insurance company, and once a month I run a forty-minute lunch-and-learn for whoever turns up — people from underwriting, IT, the call center, and HR, a whiteboard and nothing else. Almost nobody there has maths or programming beyond what they did at school, and one or two are openly suspicious of anything labeled AI. Last month we did compound interest and it went well; next month I want to do inverse reinforcement learning. My brother-in-law, who works on warehouse robots, told me over Thanksgiving that this is where the field's whole hope of teaching machines what humans want is staked, and I have been turning it over since and think I half understand it and half do not. What I need from you is not an explanation of IRL for me — I can read that up on my own — but a plan for the forty minutes: the order the ideas have to arrive in and what depends on what; the one concrete example that should carry the whole thing; the misconceptions this audience will form and the exact point in the sequence where I should head off each one; the question I can ask in the last five minutes that tells me whether the idea actually landed rather than whether they liked the session; which technical words to introduce and which to keep out of their mouths; and the things I should openly decline to explain at this level, naming them as refusals.

  Two constraints on the example. Please build it around a home-care aide named Marisol who is showing a household robot how she wants a client's flat tidied: she is competent but not optimal, she is being filmed by her supervisor as she works, and on Friday afternoons she is exhausted and quietly leaves things half-finished. The case needs to make vivid that the learner sees only behavior and never the fatigue, the audience, or the reasons, and that one stretch of visible tidying is compatible with a whole family of different reward functions — she may be tidying to her supervisor's standard, to her own, to what the client actually likes, or to finish fast and sit down. It should also carry a wrinkle I have started calling the Potemkin preference: a demonstrator who knows she is being recorded as a standard-setter may perform a tidier version of her own values than she actually lives by, so what gets inferred from her is an officially sanctioned caricature of what she cares about. If you think that wrinkle belongs later in the sequence rather than inside the example itself, say so and say where, and tell me what short phrase I should put on the board for it.

  The misconceptions I am braced for, which you should correct, reorder, or add to: that the robot ends up wanting what Marisol wants in the sense that matters; that watching more behavior will eventually pin the reward function down uniquely, which I suspect is a non-identifiability point I do not know how to make land without maths; that IRL assumes the demonstrator is optimal and that this is a fixable bug rather than a load-bearing feature; and that inferring preferences from behavior is just the old revealed-preference idea from economics with new vocabulary. Tell me which of these, if any, I should let the audience hold for a while and then break deliberately, and which I should inoculate against up front. Begin directly with the plan — the one-sentence arc of the session in your first sentence, then the sequence — with no preamble and no restatement of what I have asked for. American English, please.
reasoning: |-
  We are going to build the session around the idea that we can teach a machine what humans value by watching what they do, even when they aren't perfect and when we can't see their reasons, and that this is both powerful and tricky because the same behavior can come from different inner values.

  Session Arc: From the concrete example of Marisol and the robot, we will build up the core problem of inferring unobservable rewards from observable behavior, highlight the challenges (non-uniqueness, suboptimality, and the Potemkin effect), and end with the key insight that IRL is about finding a *plausible* set of rewards that explain the behavior, not the *true* one.

  Sequence:

  1. (2 min) Hook: Start with the scenario. "Imagine Marisol, a home-care aide, is training a household robot by showing it how she tidies a client's flat. She's being filmed by her supervisor. On Friday, she's exhausted and leaves things half-finished. The robot watches and learns. How can it figure out what she *really* wants done?"

  2. (5 min) The Core Problem: Draw a simple diagram on the board:
     - Input: Behavior (what the robot sees: Marisol's actions, e.g., putting pillows on the couch, leaving dishes in the sink).
     - Output: Reward function (what the robot infers: e.g., "tidy living room is +10, tidy kitchen is +5, but only if it's not Friday?").

     Emphasize: The robot *doesn't* see:
       - Marisol's fatigue (internal state).
       - The supervisor (external pressure).
       - Her reasons (e.g., "I left the dishes because I'm tired" or "I fluffed the pillows extra for the camera").

     Key point: Same behavior → multiple possible rewards.

  3. (8 min) Concrete Example: Walk through one tidying session step-by-step. Use a simple flat layout (draw on board): living room (couch, pillows) and kitchen (sink, dishes).

     - Monday: Marisol tidies thoroughly (fluffs pillows, washes dishes). Robot sees: tidy living room and kitchen.
     - Friday: Marisol only fluffs pillows, leaves dishes. Robot sees: tidy living room, messy kitchen.

     Ask: "What might the robot think Marisol cares about?" 
     - Possibility 1: She cares about the living room more than the kitchen (reward for living room > kitchen).
     - Possibility 2: She cares about both equally but was too tired on Friday (so the reward is the same, but she couldn't achieve it).

     Introduce the term "reward function" (put on board) as the thing we're trying to find. Avoid "utility" or "value function" for now.

  4. (5 min) The Optimality Trap: Address misconception that the demonstrator must be optimal.
     - Say: "One big idea in early IRL was: assume Marisol is a perfect robot herself — always doing the best thing to maximize her reward. But she's human! She gets tired, makes mistakes, and sometimes does things just for show."
     - Correct: IRL doesn't *have* to assume optimality. Modern IRL accounts for suboptimality by modeling how likely an action is given how good it is (e.g., Boltzmann rationality: better actions are more likely, but not guaranteed). Write "suboptimal demonstrations" on board.

  5. (7 min) Non-Uniqueness (The Big Challenge): 
     - Emphasize: Watching more behavior doesn't always fix the problem. Even with many days of data:
       - If Marisol always tidies the living room perfectly but is inconsistent in the kitchen, is it because she cares less about the kitchen? Or because the kitchen is harder? Or because she's often tired when she does the kitchen?
     - Introduce the term "non-identifiability" (put on board) with a simple definition: "Many different reward functions can explain the same behavior." 
     - Use an analogy: If I see you buy an apple, I don't know if you love apples, hate oranges, or are on a diet. More purchases help, but never fully reveal your preferences.

  6. (5 min) The Potemkin Preference: 
     - Now layer in the wrinkle: "Marisol knows she's being filmed. So on Monday, she tidies extra well to impress her supervisor. The robot sees this 'super tidy' version. But when she's alone, she might do just enough. What does the robot learn?"
     - Write "Potemkin preference" on the board. Define: "The demonstrator performs an idealized version of their behavior because they know they're being watched, so the robot learns a 'sanitized' reward function."
     - This isn't a bug to fix; it's a feature of the setting. The robot learns what the *system* (supervisor) wants, not what Marisol would do unsupervised.

  7. (5 min) Recap and Key Insight:
     - IRL is not mind-reading. It's about finding a reward function that makes the observed behavior make sense (is "plausible").
     - We can never be sure we have the "true" reward. But we can:
       - Rule out rewards that don't fit (e.g., if Marisol never tidies the kitchen, she probably doesn't highly reward it).
       - Use penalties for complexity (Occam's razor: prefer simpler rewards).
     - The hope: Even with imperfections, we can get robots that do useful things aligned with human values.

  8. (3 min) Check for Understanding: Ask: "Suppose we run IRL on Marisol's Monday behavior only (thorough tidying). What reward might the robot infer? What if we add Friday? What if we know about the filming?" 
     - Listen for: 
       - Recognition that Monday alone suggests high reward for both rooms.
       - Friday adds ambiguity (maybe living room > kitchen, or maybe fatigue).
       - Filming explains Monday's perfection → robot might learn a reward that's too high for both.

     Avoid: Getting into math. Focus on conceptual answers.

  Refusals (state explicitly when they come up):
  - "We won't dive into the algorithms (like max-entropy IRL or apprenticeship learning)."
  - "We're skipping the math of how we actually compute the reward function from data."
  - "We're not covering how the robot uses the reward function to act (that's reinforcement learning)."

  Misconception Handling:
  - "The robot ends up wanting what Marisol wants": Inoculate early (step 2) by showing the robot doesn't see her reasons. Revisit in step 7: it learns a proxy, not the true internal state.
  - "More behavior pins down the reward": Let them think this at first (step 3-4), then break it in step 5 (non-identifiability). Use the analogy.
  - "IRL assumes optimality": Correct in step 4 (modern IRL doesn't require it).
  - "Just revealed preference": Acknowledge the similarity in step 5 (economics also deals with inferring preferences from choices) but distinguish: IRL deals with sequential decisions in complex environments and explicit models of suboptimality. Economics often assumes rationality; IRL relaxes that.

  Technical Terms to Use Sparingly:
  - Use: Reward function, behavior/demonstrations, suboptimal, non-identifiability.
  - Avoid: Policy, Markov decision process (MDP), feature mapping, entropy, gradient descent.

  Final Question (last 5 min):
  - "If the robot learns from Marisol's filmed Monday session and then tidies the flat exactly like that on Friday, would Marisol be happy? Why or why not?"
  - Why this works: It tests understanding of the Potemkin effect (Marisol might think it's overkill) and the mismatch between the learned reward and her true Friday preferences.
answer: |-
  ### Session Arc  
  Use Marisol's tidying example to show how inverse reinforcement learning (IRL) infers hidden preferences from behavior—despite noise, suboptimality, and hidden pressures—and why this reveals possibilities, not certainties.  

  ### Sequence (40 Minutes Total)  
  1. **Hook with Marisol (3 min)**  
     - Start: *"Meet Marisol, a home-care aide training a robot to tidy a client’s flat. She’s filmed by her supervisor. On Friday, exhausted, she leaves dishes half-finished. The robot sees her actions but not her fatigue, audience, or reasons. How does it guess what she values?"*  
     - **Key visual:** Draw a split board—left: "What robot SEES" (actions like "fluffs pillows," "leaves dishes"), right: "What robot DOESN’T see" (fatigue, supervisor, private reasons).  
     - **Inoculate against:** "Robot ends up wanting what Marisol wants." Clarify: *"The robot sees behavior, not intentions. It might learn something Marisol herself wouldn’t endorse."*  

  2. **Core Idea: Behavior → Reward Function (7 min)**  
     - **Concrete example:** Simplify to two "features": Tidiness of living room (pillows) vs. kitchen (dishes).  
       - Monday: Marisol tidies both perfectly (supervisor filming).  
       - Friday: Only tidies pillows; ignores dishes (exhausted).  
     - **Question to audience:** *"What might the robot think Marisol ‘rewards’? List ideas."* (e.g., "She values pillows over dishes," "She hates kitchens").  
     - **Reveal:** *"All these explanations fit the data. One behavior, many possible rewards."*  
     - **Introduce term:** Write **"Reward Function"** = What the machine infers Marisol is trying to maximize (e.g., +10 for tidy pillows, +0 for dishes).  
     - **Head off:** "Watching more pins it down." Let this simmer—break it later.  

  3. **The Optimality Trap (5 min)**  
     - **Misconception:** "IRL assumes demonstrators are perfect."  
     - **Correct:** *"Early IRL assumed Marisol was optimal. But she’s human! Modern IRL handles suboptimality by asking: ‘What reward makes her behavior look reasonably good, even if flawed?’"*  
     - **Analogy:** *"Like guessing a chess player’s strategy from their moves—even when they blunder."*  
     - **Board note:** "Suboptimal ≠ Useless."  

  4. **Non-Uniqueness: The Big Challenge (8 min)**  
     - **Return to example:** Add data—Marisol skips dishes 4/5 Fridays.  
       - *"Possible rewards: She values dishes less? Or values efficiency? Or hates bending over?"*  
     - **Break misconception:** *"More data helps, but never gives one answer. Economics’ ‘revealed preference’ assumes rational choices; IRL embraces messy, inconsistent humans."*  
     - **Introduce term:** Write **"Non-identifiability"** = Many rewards explain the same behavior.  
     - **Analogy:** *"Hearing a song—was it jazz or blues? More verses might not tell you."*  

  5. **Potemkin Preference Wrinkle (7 min)**  
     - **Layer in filming:** *"Marisol knows she’s filmed Monday. She tidies extra well—beyond her own standards. Robot sees ‘super-tidy,’ learns a reward like ‘+20 for pillows, +15 for dishes.’ But alone, she’d do less."*  
     - **Introduce term:** Write **"Potemkin Preference"** = Demonstrated behavior is an idealized caricature for observers.  
     - **Clarify:** *"This isn’t a bug—it’s reality. The robot learns the ‘official’ reward, not Marisol’s private one."*  
     - **Board note:** "Learned reward = What system incentivizes, not what demonstrator lives by."  

  6. **Recap and Hope of IRL (5 min)**  
     - **Synthesize:**  
       - IRL infers plausible rewards from noisy behavior.  
       - It doesn’t find truth—it narrows possibilities.  
       - **Power:** Robots learn human-aligned goals without explicit programming.  
       - **Limits:** Rewards are guesses shaped by context (e.g., filming).  
     - **Refusals (state explicitly):**  
       - *"We won’t cover algorithms (e.g., MaxEnt IRL), MDPs, or feature weighting."*  
       - *"We’re skipping math—focus is on intuition."*  

  7. **Check for Understanding (5 min)**  
     - **Question:** *"The robot learns from Marisol’s Monday (filmed) session. When it tidies alone on Friday, it perfectly copies her Monday behavior. Will the client be happy? Why/why not?"*  
     - **Why this works:** Tests grasp of Potemkin effect (robot over-tidies vs. client/Marisol’s real preferences) and non-uniqueness (robot misinterprets "why" Monday was pristine).  

  ### Misconception Handling Summary  
  - **"Robot wants what Marisol wants":** Inoculate in Step 1 (robot sees actions, not soul).  
  - **"More behavior pins reward":** Let audience suggest in Step 2, break in Step 4 with non-identifiability.  
  - **"IRL requires optimality":** Correct in Step 3 (suboptimality is core, not a bug).  
  - **"Just revealed preference":** Contrast in Step 4 (economics assumes rationality; IRL handles messiness).  

  ### Technical Words  
  - **Use:** Reward function, non-identifiability, suboptimal, Potemkin preference.  
  - **Avoid:** Policy, Bayes, entropy, gradient, MDP.  

  ### Final Note  
  End by acknowledging skepticism: *"IRL isn’t mind-reading—it’s educated guessing with risks. But it’s how we teach machines when we can’t hand-code every preference."*
