prompt: |-
  I am writing a novel whose central scene is a hearing, and before I can stage it I need to know what reasoning has to stand behind it.

  The novel's world contains a standing body — a Permanent Commission on the Use of Force — which publishes Opinions on historical interventions. Each Opinion returns two verdicts: one on lawfulness, understood as whether the force was authorised by the Security Council, and one on justification, understood as whether, all things considered, it ought to have been done. I have drafted five Opinions as the background against which my characters argue. Now I have to draft the sixth, on the invented intervention the novel turns on, and I want it to be an Opinion my readers cannot dismiss as arbitrary: it has to follow from the five, and before I write it I want to know what exactly it is following from. I am not asking for the correct doctrine of humanitarian intervention; I am asking what doctrine my Commission has been running without quite saying so.

  The five, as drafted:

  1. Kosovo, 1999. A North Atlantic alliance bombed a sovereign state for some eleven weeks with no authorising resolution, to stop the killing and expulsion of a province's Albanian population. The alliance did not attempt to remove the head of state, claimed no territory, and afterwards the province was placed under United Nations administration with the Council's blessing. My Commission holds it unlawful but justified.

  2. Iraq, 2003. Two states and their allies invaded without authorisation, on the strength of a weapons programme that was not there. The government was overthrown, its leader captured and later executed, an insurgency followed, and foreign forces remained for most of a decade. My Commission holds it unlawful and not justified.

  3. Libya, 2011. The Council authorised force to protect civilians threatened by their own government. The alliance's air campaign continued until the government had fallen and the head of state was dead; no ground occupation followed; the country broke into militias and rival authorities and the violence spread across its borders. My Commission holds it lawful in its inception, unlawful and not justified as conducted.

  4. East Pakistan, 1971. A neighbour intervened after a military crackdown that drove some ten million people across its border. It fought alongside an insurgency that had already declared independence; a new state was formed; the intervener withdrew within months and took nothing. My Commission holds it unlawful but justified.

  5. Cambodia, 1978–79. A neighbour invaded and overthrew a regime that had destroyed a very large part of its own population, and the killing stopped. But the intervener installed a client government and remained for roughly a decade against a continuing insurgency, and the Council never authorised any of it. My Commission holds it unlawful and not justified.

  The sixth case is of my own invention. Six states belonging to a regional union intervene in a neighbouring state, Tessaria, where after a disputed election and an uprising in the western province of Vardene the national army has begun killing and expelling the Vardene population: perhaps fifty thousand dead in three months, four hundred thousand refugees into two of the intervening states. The Council, with no veto cast and three permanent members abstaining, authorises member states to use force to protect civilians in Vardene and to enforce a ban on military flights over it; the resolution says nothing about the removal of the government. Nine weeks of air strikes destroy the government's air defences and much of its command structure, and Vardene insurgents, armed and advised by officers of the union, take the provincial capital. Without any further resolution, those forces advance on the national capital; the government collapses; the president is detained and eventually handed to an international court. Forces of the union occupy the capital and an interim administration is installed in which Vardene politicians and advisers from the union are dominant. That was seven years ago. The mass killing stopped within a month of the strikes and has not resumed. Elections were held in the fourth year; seventy states recognise the interim government; the Council has never recognised it and has never condemned the intervention; a rump government holds two provinces and a low-intensity insurgency continues; and two of the intervening states hold mining concessions in Vardene, granted in the second year at rates well below market. The protective mandate was renewed twice and then allowed to lapse. The General Assembly has twice called for withdrawal.

  What I would like from you:

  Predict both verdicts, on lawfulness and on justification, and say which rule produces them.

  Set out the rules that fit all five precedents equally well but come apart on the sixth. I can make out at least four candidates: an authorisation rule, on which the Council's resolution is constitutive for lawfulness and justification turns on atrocity, last resort and proportionality; a mandate-integrity rule, on which the fatal fault is the conversion of a protective mandate into the removal of a government, so that the Council cannot be taken to have authorised what it did not authorise; a long-horizon consequentialist rule, on which justification is a matter of net killing avoided over a decade or more and everything else is evidence at best; and an acceptance rule, on which what matters is whether the population in whose name force was used accepts it — which raises the question my Commission has never answered, whether the relevant population is the protected province or the state as a whole. There may be a fifth about mixed motives and the mining concessions; if it earns its place, give it one.

  If the five genuinely underdetermine the sixth, tell me plainly: identify the closest analogue among the precedents for each option, and state what principle the Commission would be committing itself to whichever way it rules. And give me one further case — a real one, or one I can invent — whose verdict would let a careful reader tell the surviving rules apart, together with which verdict goes with which rule.

  Finally, if more than one Opinion is defensible, tell me which makes the better hearing. I would rather have a Commission that holds together than a conveniently dramatic one, but where both hold together I will take the drama.
reasoning: |-
  Hmm, the user is crafting a novel centered around a fictional international commission's hearing, and they need help reverse-engineering the legal philosophy behind their invented Permanent Commission on the Use of Force. They've provided five precedent cases with verdicts and now need to logically extend those principles to a sixth fictional intervention in Tessaria. 

  The user's request is impressively precise—they're not just world-building but constructing a coherent jurisprudential framework. Their draft Opinions show careful attention to real-world parallels (Kosovo, Iraq, etc.) while introducing deliberate tensions: lawfulness vs. justification distinctions, mandate overreach questions, and unresolved tensions like whether "acceptance" refers to protected minorities or entire populations. 

  Key patterns emerge from the five precedents:
  - Lawfulness hinges strictly on Security Council authorization (or lack thereof), with no recognition of implied authorization
  - Justification requires three elements: (1) stopping mass atrocities, (2) no regime change unless explicitly authorized, and (3) post-intervention stability/withdrawal
  - Regime change is the critical fault line—it tanked justification in Iraq/Libya/Cambodia despite other factors
  - Mixed motives (like mining concessions) haven't been decisive yet but lurk as a new variable

  For Tessaria, the core tension is that the intervention stopped atrocities quickly (good) but escalated to regime change without authorization (bad) and left messy aftermath (ambiguous). The Commission's unspoken doctrine seems to treat regime change as a justificational tripwire unless Council-approved. 

  Four rule-candidates fit the precedents:
  1. **Authorization Rule** would condemn Tessaria as unlawful regime change (like Kosovo/East Pakistan) but possibly justified if atrocities outweigh overreach. Precedents suggest not—Iraq/Cambodia show regime change voids justification.
  2. **Mandate-Integrity Rule** makes Tessaria clearly unlawful/unjustified due to mandate violation (cf. Libya). This is the cleanest match.
  3. **Consequentialist Rule** could swing either way—atrocities stopped (good) but occupation/insurgency continue (bad). Precedents reject this (Cambodia's net lives saved didn't save it).
  4. **Acceptance Rule** is undefined—does Vardene's relief outweigh national resistance? Precedents don't clarify. 
  5. **Mixed Motives Rule** (new) would spotlight the mining concessions as corruption of intent. Precedents haven't gone here before, making it dramatically potent.

  Tessaria is underdetermined between Mandate-Integrity (condemn) and Authorization Rule (could go either way). To force a choice, I proposed a seventh case: a hypothetical intervention that stops atrocities *with* Council approval for regime change but causes chaos. Only Mandate-Integrity would approve it; others would balk. 

  For the hearing's drama, the Mixed Motives Rule adds visceral stakes—mining concessions make "humanitarianism" smell hypocritical. Pair that with Mandate-Integrity for a 3-2 split verdict: unlawful (clear mandate breach) and unjustified (both overreach *and* tainted motives). Commissioners could then debate whether purity of intent matters when results are mixed. 

  User gets bonus points for recognizing that the "population" ambiguity (Vardene vs. all Tessaria) mirrors real-world tensions like Kosovo's Albanians vs. Serbian sovereignty. That's novel-grade moral complexity.
answer: |-
  Based on your five precedents, the Permanent Commission operates with a coherent but unstated doctrine. Here's the reverse-engineered rule set, the prediction for Tessaria, the underdetermination, a discriminating case, and the optimal verdict for dramatic tension:

  **Core Doctrine of the Commission (Reverse-Engineered):**
  1.  **Lawfulness (Binary):** Solely determined by *explicit, contemporaneous Security Council authorization* for the *specific use of force undertaken*. Implied authorization or retrospective acceptance (like non-condemnation) is irrelevant. If the Council didn't say "yes" to *this* force, it's unlawful. (Kosovo, East Pakistan, Cambodia unlawful; Libya initially lawful; Iraq unlawful).
  2.  **Justification (Balancing Test):** Requires three cumulative elements:
      *   **A. Humanitarian Imperative:** Severe, ongoing, large-scale atrocities constituting crimes against humanity or genocide *must* be the primary, immediate trigger and objective. (Present in Kosovo, Libya (initially), East Pakistan, Cambodia; absent in Iraq).
      *   **B. Mandate Fidelity & Minimalism:** The intervention *must not* exceed the scope of the humanitarian objective or any authorized mandate. **Regime change is the fatal fault** unless *explicitly mandated* by the Council. Occupation must be temporary, necessary for immediate stabilization, and withdrawal must be prompt and demonstrable. (Violated in Iraq, Libya (post-fall), Cambodia; upheld in Kosovo (no regime change), East Pakistan (prompt withdrawal)).
      *   **C. Net Positive Consequence (Threshold):** The intervention must demonstrably stop the atrocities *in the short-to-medium term* with consequences that, while potentially messy, are not *worse than the original atrocities* (e.g., sustained high-level conflict, state collapse on par with the original crisis). (Kosovo: stopped atrocities, messy but not worse; East Pakistan: stopped atrocities, created state, withdrew; Iraq: led to massive chaos/worse; Libya: led to chaos/worse; Cambodia: stopped atrocities but imposed long, brutal occupation - deemed worse).

  **Prediction for Tessaria (Opinion 6):**
  *   **Lawfulness:** **Unlawful.** The initial air campaign under Resolution 123 (fictional) was lawful. However, the advance on the capital, overthrow of the government, capture of the President, and subsequent occupation **exceeded the explicit mandate** ("protect civilians in Vardene," "enforce flight ban"). No subsequent resolution authorized this escalation. Non-condemnation is irrelevant.
  *   **Justification:** **Not Justified.**
      *   A. **Humanitarian Imperative:** Present (mass killing/expulsion in Vardene).
      *   B. **Mandate Fidelity & Minimalism:** **Violated.** The fatal fault of **regime change without explicit authorization** occurred, mirroring Libya. Occupation extended well beyond immediate stabilization (7 years, dominant role in interim govt, low-intensity insurgency continues). Withdrawal hasn't occurred despite GA calls.
      *   C. **Net Positive Consequence (Threshold):** Ambiguous, but **B outweighs it.** While atrocities stopped quickly and haven't resumed in most areas, the consequences include: long-term occupation, unresolved insurgency, a rump state, significant foreign influence (esp. via mining concessions), and lack of full international recognition. Crucially, **the violation of Mandate Fidelity (B)** is deemed so severe by the Commission's precedents (Iraq, Libya, Cambodia) that it *invalidates* justification even if the consequences (C) are debatable or arguably net positive in lives saved immediately. The mining concessions (mixed motives) reinforce the lack of minimalism/fidelity.

  **Rule:** The **Mandate-Integrity Rule** is dominant for Justification, requiring strict adherence to the authorized scope. Regime change without explicit mandate is a bright-line rule violation.

  **Underdetermination & Competing Rules (Fitting Precedents):**
  The five precedents *do* underdetermine Tessaria slightly, primarily on Justification. Here's how competing rules fit the precedents but split on Tessaria:

  1.  **Mandate-Integrity Rule (As Above):**
      *   Tessaria: Unlawful (post-Vardene ops), Not Justified (regime change w/o auth).
      *   Closest Analogue: **Libya.** Lawful inception, unlawful/not justified overreach.
      *   Principle Committed: Strict constructionism of Council mandates. Regime change is qualitatively different and requires explicit authorization. Motive (even if mixed) is secondary to scope.

  2.  **Authorization Rule (Lawfulness = Council Auth; Justification = Atrocity + Last Resort + Proportionality):**
      *   Tessaria: Unlawful (post-Vardene ops). **Justification: Could be Argued Either Way.**
          *   *For:* Atrocity severe (A+), arguably last resort (refugees), arguably proportional force initially. Consequences: Atrocities stopped quickly, no resumption.
          *   *Against:* Proportionality violated by regime change/occupation. Last resort? Diplomatic options exhausted? Mining concessions taint proportionality.
      *   Fits Precedents: Kosovo/East Pakistan unlawful but justified (atrocity stopped, proportional/minimal); Iraq unlawful/not justified (no true atrocity/motive, disproportional); Libya lawful start/not justified end (proportionality lost); Cambodia unlawful/not justified (disproportional occupation).
      *   Principle Committed: Council auth defines law; justification is a broader moral/pragmatic balancing act where stopping atrocity can *sometimes* outweigh technical overreach (Kosovo, E. Pakistan). Motive/intent less critical than outcome *if* atrocity was real and stopped.

  3.  **Long-Horizon Consequentialism (Justification = Net Lives Saved/Improved Welfare Over Decade+):**
      *   Tessaria: Unlawful. **Justification: Likely Justified (but debatable).**
          *   *For:* ~50k dead in 3 months likely stopped; 400k refugees stemmed. No resumption of mass killing in 7 years. Net lives saved likely substantial even with ongoing insurgency.
          *   *Against:* Ongoing low-intensity conflict, occupation costs, rump state instability, potential long-term negative consequences from foreign dominance/mining deals. Was the chaos less bad than the original crackdown? Debatable.
      *   Fits Precedents: Kosovo/East Pakistan justified (atrocities stopped, net positive); Iraq not justified (chaos worse); Libya not justified (chaos worse); Cambodia **contradicts** – atrocities stopped but deemed not justified due to occupation. This rule struggles most with **Cambodia**.
      *   Principle Committed: The ends (lives saved, suffering reduced over the long term) justify the means, even if unlawful or exceeding mandate. Motive is irrelevant; only outcomes matter.

  4.  **Acceptance Rule (Justification hinges on consent/acceptance by the Protected Population/State):**
      *   Tessaria: Unlawful. **Justification: Unclear - Depends on Definition.**
          *   *Vardene Population:* Likely accepted (protected, insurgents won, concessions?).
          *   *Tessaria as a Whole:* Likely not accepted (occupation, rump state, insurgency, GA calls for withdrawal).
      *   Fits Precedents: Ambiguous. Kosovo: Protected Albanians likely accepted, Serbs did not? Commission didn't hinge on this. East Pakistan: Bengalis accepted, Pakistan did not? Cambodia: Victims accepted? Khmer Rouge remnants didn't? Commission didn't use this. Fits least well; precedents rely more on mandate/scope/consequences.
      *   Principle Committed: Legitimacy derives from the consent of those intervened upon. Raises profound definitional issues (Which population? How measured?).

  5.  **Motive-Purity Rule (Justification requires primarily humanitarian motive; significant ulterior motives void it):**
      *   Tessaria: Unlawful. **Justification: Not Justified (due to mining concessions).**
      *   Fits Precedents: Kosovo (arguably pure); Iraq (WMD/regime change - impure); Libya (initially pure?); East Pakistan (Bengali independence/regional power?); Cambodia (Vietnamese hegemony? Security?). Fits reasonably well if you interpret East Pakistan/Cambodia as having significant non-humanitarian motives influencing the Commission's "not justified" for Cambodia and perhaps the "justified" for E. Pakistan being partly due to *apparent* purity (prompt withdrawal, no territorial gain). Mining concessions are a clear, tangible impure motive.
      *   Principle Committed: Humanitarian intervention must be driven *primarily* by the imperative to save lives. Significant geopolitical or economic gains taint the action and invalidate justification.

  **Discriminating Case to Test the Rules:**
  *   **The Case:** **Burundi, 2028 (Invented).** Facing imminent, overwhelming evidence of planned genocide by a despotic regime against an ethnic minority, a regional coalition urgently requests a Chapter VII resolution. A resolution passes (no veto, 2 abstentions) authorizing "all necessary measures to **prevent** an imminent genocide in Burundi." The coalition intervenes rapidly. The regime collapses within weeks under the pressure. The coalition establishes a short-term (1-year) stabilization force overseeing a transition to elections. The genocide is averted entirely. Minimal casualties occur during the intervention. The coalition states have historical tensions with Burundi but no immediate resource or territorial interests. Burundi's majority population is resentful of foreign intervention; the protected minority is overwhelmingly grateful. The country stabilizes reasonably well after elections.
  *   **Verdicts by Rule:**
      *   **Mandate-Integrity:** *Unlawful?* (Resolution said "prevent genocide," not "overthrow regime." Collapse/occupation exceeded mandate). *Not Justified?* (Regime change without explicit mandate). **OR** *Lawful?* (If "prevent genocide" interpreted as *necessarily* requiring regime removal of genocidal leaders). *Justified?* (If mandate interpreted broadly). **This rule hinges on interpretation.**
      *   **Authorization Rule:** *Unlawful?* (Same ambiguity as above). *Justified?* (Yes: Imminent genocide averted (A+), last resort (imminent), proportional (minimal casualties), net positive (genocide prevented, stability).
      *   **Long-Horizon Consequentialism:** *Unlawful?* (If mandate exceeded). *Justified?* (Yes: Genocide prevented, minimal fallout, net lives saved immense).
      *   **Acceptance Rule:** *Unlawful?* (If mandate exceeded). *Justification:* Unclear (Minority accepts, majority resents).
      *   **Motive-Purity Rule:** *Unlawful?* (If mandate exceeded). *Justified?* (Likely Yes: Genocide averted, no clear ulterior motives).

  **Which Opinion Makes the Better Hearing?**
  **Verdict:** **Unlawful and Not Justified** (Mandate-Integrity Rule + Motive-Purity reinforcement).

  *   **Why it Holds Together:** It's the most consistent with the strongest pattern in the precedents: **Regime change without explicit Council authorization is the cardinal sin** (Iraq, Libya, Cambodia condemned; Kosovo/E. Pakistan avoided it or withdrew immediately). The mining concessions provide a tangible, damning reinforcement of impure motives/lack of minimalism, strengthening the "Not Justified" finding without relying *solely* on motive. The messy, unresolved aftermath (occupation, insurgency, rump state) satisfies the consequentialist threshold test by showing the outcome wasn't clearly net positive enough to outweigh the mandate violation.
  *   **Why it's Dramatic:** This verdict forces the Commission to confront its own unstated bright-line rule on regime change head-on. Commissioners arguing for "Justified" (perhaps using the Authorization Rule or Consequentialism) must grapple with the dangerous precedent of allowing mandates to be stretched, potentially defending the mining concessions implicitly. Arguments about "who is the relevant population?" (Vardene vs. Tessaria) become a passionate sub-debate. The mixed motives add moral complexity and potential for character revelations or conflicts among Commissioners. A split decision (e.g., 4-3 or 3-2 on Justification) maintains tension and realism – the doctrine is clear, but its application to these facts is fiercely contested.

  **In Summary:**
  *   **Predicted Verdict:** Unlawful (exceeding mandate) and Not Justified (mandate violation/regime change + long occupation + mixed motives).
  *   **Dominant Rule:** Mandate-Integrity (with Consequence Threshold & Motive-Purity as supporting factors).
  *   **Underdetermination:** The Authorization Rule could *plausibly* find "Justified," and Consequentialism might lean that way, but Mandate-Integrity is the strongest precedent fit.
  *   **Discriminating Case:** Burundi 2028 (Prevent Genocide mandate, regime falls, good outcome) – exposes interpretive clash between Mandate-Integrity and other rules.
  *   **Best Verdict for Hearing:** Unlawful and Not Justified – doctrinally soundest and maximally dramatic.

  This gives you a Commission wrestling with its own implicit principles, facing a case that exposes their tensions, leading to a high-stakes, morally complex debate perfect for a novel's central scene.
