   So in our case, we start with initial data on a set S ( which is fixed by the automorphism). We evolve to get a solution φ. Then we consider the field ψ defined by ψ(P) = φ(σ^{-1}(P)). This is also a solution because of covariance, and it has the same initial data on S because if P in S, then σ^{-1}(P)=P, so ψ(P)=φ(P).

   But then for a point Q in the hole, ψ(Q) = φ(σ^{-1}(Q)). Since σ^{-1} is not the identity on Q, this may be different from φ(Q).

   So we have two solutions: φ and ψ, which agree on S (initial data) but may disagree in the hole.

   Now, for this to work, we need that the evolution rule is such that if φ is a solution, then so is ψ. This is the covariance under the automorphism.

   So we need to design the evolution rule to be covariant under the automorphism.

   And we need that the rule is deterministic: given initial data on S, there is a unique solution.

   But if the rule is covariant, then if φ is a solution, so is ψ, and if the automorphism is not the identity in the hole, and if the solution is not constant in the hole, then ψ will be different from φ in the hole.

   So the only way to have uniqueness is if the solution is constant on the orbit of the automorphism in the hole. But the automorphism moves points, so unless the field is constant, it will change.

   Therefore, for the vertex realist, there are multiple solutions: at least two, φ and ψ.

   To have a unique solution up to the symmetry, we need that the only solutions are those related by the automorphism. But then the evolution is deterministic only up to the symmetry.

   So to make the rule deterministic, we must be able to choose a particular solution from the symmetry-related ones. But then it breaks the symmetry.

   How about this: the rule is defined in a way that it is not covariant, but then we have a problem with condition 3.

   Condition 3 says: the automorphism maps solutions to solutions. This is covariance.

   So we must have that if φ is a solution, then φ∘σ is also a solution.

   Then, given initial data on S, let φ be the solution from the rule. Then φ∘σ is also a solution, and it has the same initial data on S (because for P in S, (φ∘σ)(P) = φ(σ(P)) = φ(P) since σ(P)=P). So there are at least two solutions: φ and φ∘σ.

   They agree on S but may disagree in the hole.

   So for the vertex realist, this is indeterminism.

   The evolution rule is deterministic only if we consider the field up to the symmetry.

   So how do we define the rule? We can define it by: choose an ordering of the vertices in the hole arbitrarily, and then assign values in that order. But then the rule is not covariant because it depends on the ordering.

   To have covariance, the rule must not depend on any background feature that is not invariant under the automorphism.

   So we need the rule to be invariant and deterministic. This is the tension.

   The way out is to have the rule not be deterministic at the level of the vertex assignment, but to be deterministic at the level of the symmetry-invariant quantities.

   For example, in the hole, the rule might determine the multiset of values but not their assignment to vertices.

   Then the rule might say: the values at B, C, D must be 1, 2, 3. then there are 6 solutions. or in our case with a specific automorphism group, we may have fewer.

   In our first example with swap of B and C, if we have two vertices, then the rule might say the values are either (1,2) or (2,1). Then two solutions.

   And the automorphism swaps them.

   So for the initial data, we have two solutions.

   But then the rule is indeterministic. The hole argument then is not needed to see the indeterminism.

   However, in the continuum case, the evolution is deterministic at the level of the geometry, but not at the level of the points.

   So in the discrete case, we can have the evolution rule be 'deterministic' in the sense that it determines the values up to the symmetry. That is, the symmetry-related models are the only ones.

   To make it concrete, let's use the graph with vertices A, B, C and edges: A-B, A-C. Initial data on A. Hole = {B, C}. Automorphism: swap B and C, fixed A. Background: edge A-B and A-C both red (so invariant).

   Rule: the value at B and C must be such that {φ(B), φ(C)} = {1,2}. That is, one of them is 1 and the other is 2, but not specified which. Then there are two solutions:
     Sol1: φ(B)=1, φ(C)=2
     Sol2: φ(B)=2, φ(C)=1

   The automorphism swaps B and C, so it maps Sol1 to Sol2 and vice versa.

   So condition: the automorphism maps solutions to solutions.

   Now, is the evolution rule deterministic? In a sense, no, because there are two solutions. But we can say that the rule is deterministic up to the symmetry: it determines that the set of values at {B,C} is {1,2}.

   The initial-value problem is well-posed in the sense that there is a solution and it is unique up to the symmetry.

   Now, the checks for the hole argument:

   We have two models (solutions) that agree on the initial data (A) and agree on the hole region in the sense that the set of values is the same, but they disagree on which vertex has which value.

   The hole region is {B,C}. In the hole, the two solutions differ.

   So the element-realist, who believes that the vertices have their identity independently and that there is a fact about which vertex has which value, is committed to there being two distinct solutions from the same initial data: one where B has 1 and C has 2, and another where B has 2 and C has 1. So indeterminism.

   The standard moral: these two models represent the same physical situation, because the only invariant quantities are the values at A and the set of values at {B,C}. In both models, A has whatever value it has, and the set at {B,C} is {1,2}. The difference is only in the assignment to the vertices, but since the vertices are not distinguishable beyond the background structure (which is symmetric), there is no physical difference.

   So let's write the case.
answer: |-
  ### Discrete Hole Argument: Handout for Graduate Seminar

  **Case Presentation**  
  Consider a finite, discrete model based on a graph with five vertices: \(A, B, C, D, E\). The fixed background structure consists of the graph topology and a vertex coloring:  
  - **Graph edges**: \(A-B\), \(A-C\), \(B-D\), \(C-D\), \(D-E\) (undirected).  
  - **Vertex colors**: \(A\): gray, \(B\): blue, \(C\): blue, \(D\): gray, \(E\): gray.  

  The automorphism \(\sigma\) swaps \(B\) and \(C\) while fixing \(A\), \(D\), and \(E\). This preserves the background: edges map to edges (e.g., \(A-B \mapsto A-C\)), and colors are invariant (blue vertices swap, gray are fixed).  

  The dynamical field \(\phi\) assigns a real number to each vertex. Initial data is specified on the gray vertices: \(\phi(A) = a\), \(\phi(D) = d\), \(\phi(E) = e\). The evolution rule deterministically assigns values to \(B\) and \(C\):  
  \[
  \phi(B) = \phi(A) + 2\phi(D), \quad \phi(C) = \phi(A) + 2\phi(D).
  \]  
  This yields a unique solution for given initial data: \(\phi(B) = \phi(C) = a + 2d\).  

  To run the hole argument, define a new field \(\phi^*\) by applying \(\sigma\) only to the hole region \(\{B, C\}\):  
  \[
  \phi^*(P) = \begin{cases} 
  \phi(\sigma(P)) & \text{if } P \in \{B, C\}, \\
  \phi(P) & \text{otherwise}.
  \end{cases}
  \]  
  For \(\phi\), suppose \(\phi(B) = x\) and \(\phi(C) = y\). Then \(\phi^*(B) = \phi(\sigma(B)) = \phi(C) = y\) and \(\phi^*(C) = \phi(\sigma(C)) = \phi(B) = x\). Since \(\sigma\) preserves the background and the rule (as \(\phi(B) = \phi(C)\) in any solution), both \(\phi\) and \(\phi^*\) satisfy the evolution rule.  

  **Checks**:  
  1. \(\sigma\) preserves the background: It swaps \(B\) and \(C\), both blue, and fixes gray vertices and edges.  
  2. \(\sigma\) preserves the evolution rule: The rule depends only on \(\phi(A)\) and \(\phi(D)\) (fixed by \(\sigma\)), and outputs identical values for \(B\) and \(C\).  
  3. \(\sigma\) fixes the initial data: \(A\), \(D\), and \(E\) are fixed, so initial values are unchanged.  
  4. \(\phi\) and \(\phi^*\) agree outside the hole: \(\phi(A) = \phi^*(A)\), \(\phi(D) = \phi^*(D)\), \(\phi(E) = \phi^*(E)\).  
  5. \(\phi\) and \(\phi^*\) differ inside the hole if \(x \neq y\): But in this model, \(x = y = a + 2d\), so \(\phi^*(B) = x = \phi(B)\) and \(\phi^*(C) = x = \phi(C)\). Thus, they are identical.  

  **Correction for non-identity**:  
  The above fails (check 5) because the rule forces \(\phi(B) = \phi(C)\). To ensure distinction, modify the evolution rule to:  
  \[
  \phi(B) = \phi(A) + \phi(D), \quad \phi(C) = \phi(A) + \phi(D) + k,
  \]  
  where \(k \neq 0\) is a constant. Now, for initial data, \(\phi(B) = a + d\), \(\phi(C) = a + d + k\). Then \(\phi^*(B) = \phi(C) = a + d + k\), \(\phi^*(C) = \phi(B) = a + d\). These are distinct if \(k \neq 0\) (e.g., \(k=1\)). The evolution rule is preserved by \(\sigma\) only if \(k=0\), violating condition 3. This is a design flaw.  

  **Revised case to satisfy all conditions**:  
  Use a graph with vertices \(A, B, C\). Background: edges \(A-B\), \(A-C\); vertex colors: \(A\): gray, \(B\): blue, \(C\): blue. Automorphism \(\sigma\) swaps \(B\) and \(C\), preserving the background. Initial data: \(\phi(A) = a\). Evolution rule: The set of values at \(\{B, C\}\) must be \(\{1, 2\}\), but assignments are arbitrary. Solutions are:  
  - \(\phi_1\): \(\phi_1(B) = 1, \phi_1(C) = 2\)  
  - \(\phi_2\): \(\phi_2(B) = 2, \phi_2(C) = 1\)  
  \(\sigma\) maps \(\phi_1\) to \(\phi_2\) and vice versa.  

  **Checks for revised case**:  
  1. \(\sigma\) preserves background: Swaps blue vertices \(B\) and \(C\); fixes gray \(A\); edges map to edges.  
  2. \(\sigma\) preserves evolution rule: The set \(\{1, 2\}\) is invariant under swapping \(B\) and \(C\).  
  3. \(\sigma\) fixes initial data: \(\phi_{\sigma}(A) = \phi(\sigma(A)) = \phi(A)\).  
  4. Solutions agree outside hole: Both have \(\phi(A) = a\).  
  5. Solutions differ inside hole: \(\phi_1(B) \neq \phi_2(B)\), \(\phi_1(C) \neq \phi_2(C)\).  

  **Positions on the Case**  
  1. **Element-realist**: Commits to distinct identity of vertices. For initial data \(\phi(A) = a\), there are two distinct solutions (\(\phi_1\) and \(\phi_2\)) differing in hole assignments. This implies indeterminism: the initial data doesn’t determine whether \(B\) has 1 and \(C\) has 2, or vice versa. The symmetry-invariant quantities (e.g., value at \(A\), the set \(\{ \phi(B), \phi(C) \} = \{1, 2\}\)) are identical, but the realist insists the difference in vertex-specific assignments is physically significant.  
     
  2. **Same-situation theorist**: Argues \(\phi_1\) and \(\phi_2\) represent the same physical situation. The background doesn’t distinguish \(B\) and \(C\) (both blue, identically connected to \(A\)), and the invariant quantities match. The difference is merely mathematical (vertex relabeling), not physical. Thus, determinism holds: the initial data determines a unique physical state.  

  3. **Sophisticated element-realist**: Allows both \(\phi_1\) and \(\phi_2\) as mathematical possibilities but denies they represent distinct physical possibilities. The physical state is uniquely determined by the initial data and the invariant structure (e.g., "the vertex adjacent to \(A\) with value 1" lacks meaning since \(B\) and \(C\) are indistinguishable). This avoids indeterminism by rejecting haecceitism (primitive identity).  

  **Comparison to continuum case**: The same-situation position fares better here. In the continuum, manifold points lack even relational individuation (e.g., no background colors), making "same situation" claims more contentious. Here, the discrete symmetry and explicit background (colors, edges) strengthen the case for physical equivalence.  

  **Core Feature and Its Necessity**  
  The hole argument runs due to the conjunction of:  
  - **Realist commitment** to base elements (vertices), implying their identity is fixed independently of structure.  
  - **Non-trivial local symmetry**: An automorphism (here, \(\sigma\)) that preserves the background and evolution rule, is the identity outside a hole, and is non-trivial inside it.  
  If the symmetry is removed (e.g., by coloring \(B\) red and \(C\) blue), \(\sigma\) no longer preserves the background, breaking the argument. Without realism about vertices, the symmetry-related models aren’t seen as physically distinct.  

  **Objection from Element-Realist and Reply**  
  **Objection**: "The evolution rule is indeterministic! This has nothing to do with realism—your rule simply fails to specify assignments. In physics, we expect deterministic evolution from initial data."  
  **Reply**: The rule *is* deterministic at the invariant level: it fixes the set of values in the hole. The "indeterminism" arises only when demanding vertex-specific assignments. However, this reply is soft: it assumes that physics only cares about invariants, which the element-realist denies by insisting on vertex identity.  

  **Unreproduced Features of Continuum Hole Argument**  
  1. **Infinite symmetry group**: Here, symmetry is finite (permutation group).  
  2. **Differential equations**: Replaced by discrete evolution.  
  3. **No background structure**: The continuum has dynamical spacetime; here, background (graph, colors) is fixed.  
  4. **Smoothness and localization**: The hole is a discrete set; no analog of smooth deformations.  
  These features do no hidden work. The core argument relies only on symmetry and realism, not continuity.  

  **Epistemic Calibration**  
  **Settled (checkable facts)**:  
  - The automorphism preserves the background and rule.  
  - The two solutions exist, agree outside the hole, and differ inside.  
  - Both solutions satisfy the evolution rule.  
  - All symmetry-invariant quantities match.  

  **Contested claims**:  
  - **Element-realist’s commitment to indeterminism**: Denied by those who reject vertex haecceities.  
  - **Same-situation reply**: Seen as a solution by some, a concession to anti-realism by others.  
  - **Sophisticated realism**: Its coherence is disputed (e.g., can identity be "non-primitive" without collapsing to structuralism?).  
  - **Discrete as proxy for continuum**: Some argue finite symmetries differ qualitatively from infinite ones (e.g., no "drag" intuition).  

  **Presuppositions in Dialectical Frame**:  
  - The realist commitment is framed as about "base structure," but "base" is theory-relative (disputed).  
  - The argument assumes symmetries are physical, not mathematical artifacts; this is contested.  

  This discrete model isolates the core tension: realism about base elements + local symmetry → indeterminism. The continuum machinery (diffeomorphisms, no background) is scaffolding, not the load-bearing structure.
