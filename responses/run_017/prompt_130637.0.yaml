  Step 7's generalization is tricky. If semantic properties are epiphenomenal, the argument would say we can't know them. But physicalists might say semantic properties are identical to physical, so they do causal work. So the argument might not generalize if other properties aren't epiphenomenal. But if they are, the problem applies. So epiphenomenalism is uniquely self-defeating.

