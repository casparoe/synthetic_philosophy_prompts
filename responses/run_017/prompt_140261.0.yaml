prompt: |-
  My supervisor runs a reading group on moral responsibility — Strawsonian stuff, reactive attitudes, the participant stance, the objective attitude, that whole setup. Over the term she's handed down verdicts on a pile of cases and I've been keeping a list, because I want to know whether there's one rule behind them or whether she's just going case by case. Her verdicts so far:

  a colleague who took credit for your work to win a promotion: resentment fitting, fully in the practice.
  an accountant who embezzled because a colleague threatened to leak compromising photos of her sister: resentment not fitting, but this is an excuse and not an exemption — you can still expect an apology and still hold her to answer.
  a man with advanced dementia who struck a nurse: objective attitude, resentment unfitting.
  a six-year-old who tormented a younger kid on the playground: not yet a full participant, you correct and train rather than resent.
  someone who wrecked the shared kitchen during a delusional manic episode: objective attitude.
  a woman who was casually cruel to a waiter out of pure unreflecting habit, because she grew up in a house where everyone spoke to staff that way: fully a participant, resentment fits, a bad upbringing explains and doesn't exempt.
  a friend who let you down badly at a moment when she was severely depressed: excuse territory, not exemption, the demand gets qualified but she's still someone you can address.

  New case. M. spent her first forty years in a commune that was sealed off from the outside, where nobody ever asked permission for anything and there was no notion of something being someone's own; you took what you needed and that was just what people did. She left two years ago and is now my neighbor. She's picked up the vocabulary fine and she's definately capable of participant attitudes in general — she was genuinely grateful when I helped her move, resentful when I broke a promise to her, and she feels guilt about how she treated her own kids before she left. But with claims about ownership and permission she says she simply doesn't hear them as reasons: she understands perfectly well what people are asking for and why, and it leaves her cold. She now complies with those rules out of pure prudence, because she learned that not complying causes trouble. Last week she took my bike without asking, rode it for a day and brought it back scratched. Not to hurt me. Just because it was there and she wanted it.

  What's my supervisor going to say — resentment fitting or not, and is this an excuse, an exemption, or neither? I can think of at least two rules that fit every verdict above and come apart on this one, so I want the candidate rules spelled out with what each predicts here, your best guess at which she's actually running with the reason for preferring it, and most useful of all: what further case I could bring to the group that would settle which rule she means. Under 450 words, prose or short paragraphs, no bullet-pointed essay.
reasoning: |-
  Hmm, the user is in a reading group on moral responsibility, specifically Strawsonian concepts like reactive attitudes and participant stance. They've collected their supervisor's verdicts on various cases and now have a new case about a woman named M. who grew up in a commune without ownership norms. The user wants to predict what their supervisor would say about M. taking their bike without permission, and they need help identifying the underlying rule behind all these verdicts.

  Looking at the supervisor's previous verdicts:

  - Colleague taking credit: resentment fitting (full participant)
  - Coerced accountant: excuse (still accountable but mitigating circumstances)
  - Dementia patient: exemption (objective attitude)
  - Six-year-old: exemption (not yet a participant)
  - Manic episode: exemption (objective attitude)
  - Habitually cruel woman: resentment fitting (explanation but not exemption)
  - Depressed friend: excuse (qualified demand but still accountable)

  For M., the key points are that she understands ownership norms intellectually but doesn't feel their normative force, complies only out of prudence, and has shown capacity for reactive attitudes in other domains. Two rules might explain the previous cases:

  Rule 1: Focuses on whether the person has the general capacity for reactive attitudes. M. demonstrates this capacity in other contexts, so she'd be a full participant - resentment fitting (similar to the habitually cruel woman).

  Rule 2: Focuses on domain-specific normative competence. M. lacks the specific capacity to recognize ownership norms as reasons, so she might get an exemption in this domain (similar to the dementia patient in their impaired domain).

  I think the supervisor likely uses Rule 2 because it better captures how moral responsibility can be fragmented. For M., this would mean resentment isn't fitting - it's an exemption for ownership-related claims specifically, though she remains a participant in other domains.

  To test this, the user could present a case where someone has targeted impairment - like a person who understands promises but not property due to a specific brain injury. If the supervisor grants exemption only for the impaired domain, that confirms Rule 2. If they require full exemption across all domains, that supports Rule 1.
answer: |-
  Your supervisor likely runs with **Rule 2: Domain-Specific Normative Competence**.  

  **Rule 1 (General Participant Capacity)** holds that resentment is fitting if someone *generally* possesses the capacity for reactive attitudes and understands moral demands as reasons in *some* domains (e.g., gratitude, promise-keeping). This predicts **resentment fits** for M.: she’s shown general participant capacity (gratitude, resentment over promises), so her disregard for ownership norms is merely an *excuse* (like the habitually cruel woman).  

  **Rule 2 (Domain-Specific Normative Competence)** holds that resentment is fitting only if the person can *in that specific domain* grasp the relevant norms *as moral reasons* (not just prudential rules). This predicts **resentment is not fitting** for M. Her upbringing blocked the development of this domain-specific competence ("leaves her cold"); she’s exempt here, akin to the dementia patient’s domain of impaired agency. It’s a *partial exemption* (like the six-year-old’s limited status), not an excuse.  

  **Why Rule 2 is likely**: It explains all prior verdicts better. The cruel woman *could* grasp hospitality norms but didn’t care; the depressed friend *could* grasp fidelity but was overwhelmed. M. uniquely *cannot* access ownership/permission as reasons—her coldness isn’t disregard but incapacity. Rule 2 captures Strawson’s "objective attitude" applying where normative understanding is locally absent.  

  **Test case to settle it**: *A person with a specific brain injury impairing only their understanding of property rights (e.g., they grasp promises, harm, but not ownership), who takes your bike without asking.*  
  - If your supervisor says **exemption**, she uses **Rule 2** (domain-specific incapacity).  
  - If she says **resentment fits** (mere excuse), she uses **Rule 1** (general capacity suffices).  

  For M., Rule 2 predicts: **Resentment unfitting (exemption for ownership claims)**. She’s still a participant overall, but this domain requires objective management (e.g., securing your bike), not moral address.  

