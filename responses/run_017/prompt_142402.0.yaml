answer: |-
  Your instinct is sharp—higher-order vagueness *is* the residue that doesn't cleanly map to computational concepts. Below, I'll translate the three main philosophical responses into your numerical/programming vocabulary, then unpack why higher-order vagueness resists analogy. For each, I'll note:  
  - ✅ What carries over cleanly.  
  - ⚠️ What requires bending.  
  - 🚫 What lacks an analogue.  

  ---

  ### **1. Real Cutoff (But Unknown)**  
  *Philosophy*: A precise threshold exists (e.g., 1,000 grains = heap), but humans can't determine it.  
  *Your Vocabulary*:  
  - ✅ **Machine Epsilon/ULPs**: The exact point where floating-point precision breaks exists but is unknowable at runtime without deep inspection.  
  - ✅ **`abs(a-b) < tol`**: Tolerance (`tol`) defines a sharp cutoff; the "true" value might be obscured by noise.  
  - ⚠️ **Bending**: In code, tolerance is *chosen* by the programmer (explicit), while the "real cutoff" in sorites is argued to exist objectively (e.g., in physics).  
  - 🚫 **No Analogue**: Sorites assumes the cutoff is *epistemically inaccessible* (unknowable in principle), while your tolerances are always known/controlled.  

  ---

  ### **2. Genuine Indeterminacy**  
  *Philosophy*: Borderline cases aren't just unknown—they're neither true nor false (e.g., 500 grains is *indeterminate*).  
  *Your Vocabulary*:  
  - ✅ **NaN Propagation**: Like an indeterminate `NaN`, borderline cases "propagate" vagueness (e.g., queries about "heaps" return `undefined`).  
  - ✅ **Gradual Typing (TypeScript)**: The `unknown` type or `any` with runtime checks mirrors indeterminacy—type safety isn't binary.  
  - ⚠️ **Bending**: `NaN` is a *placeholder* for computational failure, while philosophical indeterminacy is ontological (a state of reality).  
  - 🚫 **No Analogue**: Code resolves indeterminacy eventually (e.g., `isNaN()` checks). Sorites leaves it unresolved.  

  ---

  ### **3. Contextual Shifting Standards**  
  *Philosophy*: The threshold depends on context (e.g., comparing to a mountain vs. a pebble).  
  *Your Vocabulary*:  
  - ✅ **Relative Tolerance**: `abs(a-b) < tol * max(a, b)` adapts to scale, like context-dependent thresholds.  
  - ✅ **Significant Figures**: Precision depends on magnitude (e.g., `1.0e3` vs. `1.000e3` implies different tolerances).  
  - ✅ **Static vs. Gradual Types**: TypeScript’s `strict: true/false` changes error thresholds based on "context" (project config).  
  - ⚠️ **Bending**: In code, context is *externally defined* (e.g., environment variables). In sorites, it emerges implicitly.  
  - 🚫 **No Analogue**: Programmers control context explicitly. Sorites contexts are fluid and implicit.  

  ---

  ### **Higher-Order Vagueness: The Unmappable Residue**  
  *Philosophy*: The boundary of the "vague region" (e.g., where indeterminacy starts) is itself vague, leading to infinite regress.  

  #### **Why Your Vocabulary Fails Here**  
  - **Epsilon is Fixed, Vagueness is Recursive**:  
    - You set `tol=1e-6` to define a borderline range (e.g., `x ± tol`). But the edges of this range (e.g., `x - tol`) are **sharp**—no vagueness about whether `x - tol - 1e-12` is inside/outside.  
    - Higher-order vagueness demands that *the tolerance itself* be fuzzy (e.g., "`tol` is ≈1e-6... but only kind of"). This recursion has no computational analogue.  

  - **Gradual Typing Has Fixed Boundaries**:  
    - TypeScript might use a `number | string` union for ambiguity, but the runtime check (`typeof val === "number"`) is **binary**. There’s no "sorta number, sorta not" at execution.  

  - **No Second-Order NaNs**:  
    - A `NaN` is determinately indeterminate. There’s no "borderline NaN" (e.g., `isNaN(NaN)` is always `true`). Higher-order vagueness requires indeterminacy *about indeterminacy*.  

  #### **Why This Isn’t Just a Bug**  
  You note that unset tolerances are "bugs." But higher-order vagueness isn’t an error—it’s a structural feature of natural language predicates:  
  > "Heap" has vague boundaries → but "vague boundary of heap" also has vague boundaries → ad infinitum.  

  In code, you avoid recursion by fiat:  
  ```python
  def is_heap(grains: int, tol: float = 100.0) -> bool | None:
      true_threshold = 1000.0  # Fixed!
      if abs(grains - true_threshold) < tol:
          return None  # Indeterminate
      return grains > true_threshold
  ```  
  Here, `tol` is sharp. To model higher-order vagueness, you’d need `tol` itself to be a function with its own tolerance—a regress that’s computationally untenable.  

  ---

  ### **Conclusion**  
  - **First-order vagueness** (indeterminate cases, shifting thresholds) maps cleanly to tools like `NaN`, gradual types, and relative tolerances.  
  - **Higher-order vagueness** has **no analogue** in numerical/programming systems because:  
    1. Computations bottom out in sharp rules (even if probabilistic).  
    2. Tolerance/epsilon are *designed* to collapse recursion.  
    3. Vagueness in code is always *knowable* (if not always known).  

  The philosophical puzzle arises from language's ability to be *about* itself infinitely—a feature your tools deliberately avoid to halt undecidability. You *could* simulate it (e.g., fuzzy logic with probabilistic boundaries), but the regress would be terminated by a fixed parameter you chose. The residue is the infinite regress itself.
