  - Is there a concept in numerical computing that has inherent, unavoidable higher-order vagueness? I don't think so. We always set fixed parameters. Even in fuzzy logic, the membership functions are defined with fixed parameters.

  Conclusion on higher-order vagueness: There is no direct analogue because our numerical and programming constructs are defined with fixed boundaries (even if we design them to be gradual, the design is fixed). The second-order problem is less of an additional problem in our vocabulary because we don't allow for unbounded regress of vagueness. We fix the parameters and move on. The philosophical problem is that the boundaries are not just unknown but essentially unsharpable (they resist any sharpening). In computing, we can always sharpen by setting a fixed rule (even if arbitrary) and that breaks the regress.

