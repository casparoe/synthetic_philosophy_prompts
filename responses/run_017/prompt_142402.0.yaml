          - Also, relative tolerance: `abs(a-b) < tol * max(abs(a), abs(b))` adjusts the tolerance based on the magnitude of the numbers. This is context-dependent (relative to the size of the numbers).
          - In gradual typing, the type of a variable might be checked more strictly in some contexts (like when passing to a function that expects a number) and less strictly in others.
     - What carries over: The idea of adjusting the threshold (tolerance) is common. We do it all the time in numerical code.
     - What bends: The context in the sorites paradox might be more about human judgment (e.g., comparing a pile of sand to a mountain vs. to a pebble) and less about a pre-defined rule. In code, we set the tolerance explicitly for each context.
     - What doesn't fit: The shifting standard in philosophy might be more dynamic and less predictable than in code, where we have control over the context.

  ### Higher-order vagueness
  The problem that the boundary of the vague region (i.e., the set of borderline cases) is itself vague.

  - In numerical computing, we usually set a fixed tolerance. For example, we might say that if `x > 10` then it's a heap, and if `x <= 10` then it's not. But then we might wonder about `x=10.000000000000001` vs. `x=9.999999999999999`. We can use a tolerance to define a buffer zone: if `x` is within `10 ± tol`, then it's indeterminate. But then the boundaries of this buffer zone (at `10 - tol` and `10 + tol`) are sharp. So we have a second-order sharp boundary.

