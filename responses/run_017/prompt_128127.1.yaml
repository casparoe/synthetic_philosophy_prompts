answer: |-
  ### 1. Mapping of Methods  
  **Textualism (as deployed by Kagan dissent):**  
  - **Object:** Enacted text's ordinary meaning *at enactment*, evaluated linguistically.  
  - **Admissible inputs/weight:**  
    (i) **High weight:** Dictionary definition ("tangible object" = physical thing).  
    (ii) **Medium weight:** Sentence context (associated words) as clarifying semantic range.  
    (iii) **Low/inadmissible:** Broader statutory context or title (seen as extrinsic).  
    (iv) **Inadmissible:** Unenacted legislative history.  
    (v) **Low/conditional weight:** Penalty/lenity only if ambiguity persists.  
  - **Real work:** Input (i). Dictionary meaning dominates; other inputs only confirm plain meaning.  

  **Purposivism (as deployed by Ginsburg plurality):**  
  - **Object:** Enacted text read *in context of legislative purpose*.  
  - **Admissible inputs/weight:**  
    (i) **Low weight:** Dictionary meaning subordinated to context.  
    (ii) **High weight:** *Noscitur a sociis*/*ejusdem generis* to narrow phrase.  
    (iii) **High weight:** Sarbanes-Oxley’s financial-fraud purpose and code placement.  
    (iv) **Low/medium weight:** Unenacted history as purpose evidence (but not decisive).  
    (v) **High weight:** Penalty severity reinforces contextual reading; lenity supports narrow view.  
  - **Real work:** Inputs (ii) + (iii) + (v). Purpose and context override literal meaning.  

  **Differences in Admissible Evidence:**  
  - Textualism excludes (iii) and (iv); purposivism embraces them.  
  - Both admit (ii) but weight differs: textualism uses it marginally, purposivism pivotally.  
  - Both use (v) conditionally, but purposivism gives it greater force.  

  ---  
  ### 2. Where Each Method Is Silent/Indeterminate  
  - **Ambiguity vs. Breadth:** Textualism cannot distinguish—treats both as "clear meaning." Purposivism resolves via purpose but cannot prove ambiguity exists.  
  - **Canons’ Role:** Textualism treats canons as linguistic guides; purposivism as purpose-driven tools. Neither specifies when canons override plain meaning.  
  - **Absurd Results:** Textualism has no clear threshold for overriding text; purposivism uses purpose to avoid absurdity but lacks criteria for "absurd."  
  - **Yates’ Exposed Silence:** Both methods fail to resolve *when context trumps semantic meaning*. Yates shows textualism struggles with broad terms, purposivism with constraining purpose.  

  ---  
  ### 3. Controlled Rewrites  
  **Variant A (Purpose Codified):**  
  - **Textualist:** No change. Enacted findings are text but don’t alter "tangible object" meaning. Still reads broadly.  
  - **Purposivist:** Plurality’s view *becomes* textualist. Codified purpose is now textual context.  
  - **Method Grace:** Purposivism absorbs better—enacted purpose resolves ambiguity textually.  

  **Variant B (Enactment Detached):**  
  - **Textualist:** No change. Meaning unchanged without financial context.  
  - **Purposivist:** Outcome changes. No financial context = no reason to narrow "tangible object." Fish likely covered.  
  - **Method Grace:** Textualism unaffected; purposivism must concede defeat. Reveals purposivism’s dependence on extrinsic context.  

  **Variant C (“Other” Inserted):**  
  - **Textualist:** Converges with purposivism. "Other" triggers *ejusdem generis*—"tangible object" limited to record-like objects.  
  - **Purposivist:** Same result, but via syntactic canon, not purpose.  
  - **Method Grace:** Textualism absorbs better—shows it *has* contextual tools (*ejusdem generis* is linguistic). Against textualism: it now mimics purposivism.  

  **Variant D (Stakes Lowered):**  
  - **Textualist:** No change. Penalty irrelevant if meaning clear.  
  - **Purposivist:** Plurality’s reasoning weakens; Alito’s fifth vote lost (lenity inapplicable). Fish likely covered.  
  - **Method Grace:** Purposivism struggles; reveals its reliance on penalty severity as purpose/lenity crutch.  

  ---  
  ### 4. What the Case Does to the Theories  
  - **Textualism’s Constraint:** Yates shows textualism is flexible—Kagan’s dissent uses "ordinary meaning" expansively, proving it can license broad readings.  
  - **Shared Toolkit?** Yes: both use (ii) and (v), but legitimacy disputes (iii)/(iv) create divergence. The methods are rivals over *sources*, not tools.  
  - **Defensible Consistency:**  
    - **Plurality cheats:** Uses unenacted context (iii) like legislative history, violating textualism’s rules.  
    - **Dissent consistent:** Scalia/Kagan adhere to semantic meaning.  
  - **Core Disagreement:** Normative, not semantic. Plurality fears over-criminalization (20-year penalty for fish); dissent fears under-enforcement. Textualism has no answer; purposivism uses purpose to balance.  

  ---  
  ### 5. Ranking of Inputs by Work Done  
  1. **(iii) Statutory context/Sarbanes-Oxley purpose:** Plurality’s anchor; dissent ignored it.  
     → *Justification:* Driving force for narrowing "tangible object."  
  2. **(v) Penalty/lenity:** Crucial for Alito and plurality; dissent dismissed severity.  
     → *Justification:* Made 20-year penalty for fish the unspoken stakes.  
  3. **(ii) Associated words/canons:** Plurality used *noscitur*; dissent noted list but overruled.  
     → *Justification:* Framed the linguistic debate but didn’t decide it alone.  
  4. **(i) Dictionary meaning:** Cited by both but only dissent treated it as decisive.  
     → *Justification:* Baseline for disagreement, but insufficient.  
  5. **(iv) Legislative history:** Minimally cited; no justice relied on it.  
     → *Justification:* Irrelevant to both sides’ core arguments.  

  ---  
  ### Final Verdict  
  The case discriminates in favor of **purposivism** by showing that context and purpose overrode plain meaning, but reveals textualism’s capacity for literal breadth. The penalty and consequences (lenity) were pivotal, however.  

  \answer{LENITY_OR_CONSEQUENCES_DOES_THE_WORK}
