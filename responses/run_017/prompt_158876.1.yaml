prompt: |-
  I write a column on science and ideas, and I keep tripping over a piece of vocabulary. The entire AI industry now calls a confident false output a hallucination or confabulation, logs it in incident reports and evaluation write-ups as an error, and scores systems on accuracy against a ground truth — while the same engineers' model cards insist that the system is only predicting the next token and does not really believe, mean or refer to anything. Nobody says a random number generator hallucinated a seven, and nobody logs a bland or awkward but true answer as an error, even though the training procedure penalised it just as heavily. I would like you to reconstruct the theory of representational content that this practice presupposes.

  As I understand it, the natural candidate is teleosemantics: an output's content is fixed by what the system was selected or designed to do, and an error is malfunction with a function — deviation from a proper function, not merely an unusual causal chain. Two worries I want addressed. First, these systems have a peculiar selection history: the final training stage optimises for human approval rather than for truth, and most deployed questions fall outside the historical conditions in which whatever function they have was selected. Does strict teleosemantics actually deliver the verdict the practice wants, that confabulation is an error, or does it make confident confabulation the system working as designed? Second, how much does the practice strictly presuppose: would an informational or covariational theory of content, or a broadly interpretive one on which we merely adopt the intentional stance, license exactly the same vocabulary, or does talk of hallucination really commit us to something like proper function?

  Please distinguish what the practice strictly requires from what it merely sits well with, and say what would change in how labs and regulators talk if the teleosemantic underpinning were dropped. British English, about 600 words.
reasoning: |-
  Okay, the user writes a science column and is puzzled by the AI industry's inconsistent language. They note that engineers call confident false outputs "hallucinations" and log them as errors, yet model cards state these systems don't truly "believe" or "refer" to anything. The user wants me to reconstruct the implicit theory of representational content behind this practice, focusing on teleosemantics, and address two concerns: whether selection for human approval undermines error classification, and what the practice strictly requires versus what it's compatible with. 

  First, I need to unpack why "hallulucination" implies intentionality despite official disclaimers. The term smuggles in folk psychology - we wouldn't say a calculator "hallucinates" wrong answers. This suggests the practice relies on an as-if functionalist view where the system's design purpose defines correct outputs. 

  Regarding teleosemantics: yes, the industry implicitly treats truthfulness as a proper function derived from human-intended design goals. But the user's first worry is valid - if the training objective is approval, not truth, doesn't that make plausible lies "correct"? Here I should distinguish proximal vs ultimate functions: while RLHF trains for pleasing outputs, the system's broader societal purpose is reliable information. Regulators clearly treat deviations from truth as malfunctions relative to that expected function. 

  For the second worry about alternative theories: covariance theories (where content tracks statistical correlations) would struggle - false outputs may still covary with patterns in training data. Interpretivist stances (like Dennett's) could support "hallucination" talk instrumentally, but this would render "error" subjective. Teleosemantics provides the strongest footing for objective malfunction claims. 

  If labs dropped teleosemantic underpinnings, language would shift toward behaviorist or statistical framing - "low-probability outputs" instead of "errors", "calibration failures" instead of "confabulations". But this would clash with regulatory demands for accountability. 

  The user's deeper concern seems to be about philosophical coherence in AI ethics. Their column likely aims to expose tacit assumptions behind technical jargon. I should emphasize that teleosemantics, despite its flaws, currently offers the least inconsistent foundation for holding systems accountable.
answer: |-
  ## The Implicit Teleosemantics of AI "Hallucination"

  Your dissection is sharp: the AI industry's labelling of confident falsehoods as "hallucinations" or "errors" *does* clash awkwardly with the official "merely predicting tokens" stance. This practice implicitly leans on a **teleosemantic theory of content**, where meaning and error derive from a system's *proper function* – the purpose for which it was designed and selected.

  **Addressing Worry 1: Selection History & Malfunction**
  Yes, the selection history is messy. The *proximate* reward signal during RLHF (Reinforcement Learning from Human Feedback) is human preference (approval), not abstract truth. Does this make plausible confabulation "working as designed"?

  *   **The Teleosemantic Reply:** Teleosemantics distinguishes between *proximate mechanisms* and the *ultimate function* the system was *selected for* by its designers/users. The ultimate function baked into the system’s architecture and deployment is **to provide accurate, helpful information in response to queries**. RLHF is a *means* to approximate this function (as humans generally prefer true, useful answers), not the function itself. A hallucination is thus a **malfunction** relative to this ultimate, intended representational function – it fails to fulfil the very purpose for which the system exists, even if the confabulation *was* generated by the token-prediction mechanism operating "correctly" according to its RLHF training. The "error" logged isn't a deviation from token prediction, but from the *expected informational service*.

  *   **Out-of-Distribution Queries:** Teleosemantics often handles novel environments via the concept of *derived proper functions*. While the training data defined the *normal conditions* for initial function selection, the system's deployment implies a broader derived function: to generalise *reliably* to new, relevant queries. A confident false answer to a novel question is still a malfunction of this derived function.

  **Addressing Worry 2: Strict Presuppositions vs. Alternatives**
  The practice *strictly requires* a notion of **objective malfunction relative to an intended purpose**. Let's see how alternatives fare:

  1.  **Pure Covariance/Informational Theories:** These define content based on statistical correlation (e.g., "cat" token covaries with cat images). They struggle with *error*. A hallucinated "fact" might perfectly covary with *patterns in the training data that signify plausible text*, not with the world. Covariance alone cannot label it "false" or an "error" – it might be statistically "correct" within the model's data distribution. The practice demands a norm beyond mere correlation.
  2.  **Strict Interpretivism/Intentional Stance:** If we *only* adopt Dennett's stance for predictive convenience, labelling a false output a "hallucination" or "error" becomes purely pragmatic, not objectively true. Labs and regulators treat these errors as *discoverable facts about the system's performance*, not just a useful fiction. The practice implies the malfunction is real, not merely ascribed.
  3.  **Teleosemantics:** Provides the missing norm. An error is a **failure to perform the proper function of providing accurate information**, fixed by the system's design and selection history. "Hallucination" implies a breakdown in this representational function.

  **What Changes if Teleosemantics is Dropped?**
  Without this functional underpinning:

  *   **Language Softens:** Labs might speak only of "low-likelihood outputs," "low-confidence responses," "distributional anomalies," "calibration failures," or "preference violations" (focusing purely on the RLHF signal). "Error" would lose its strong normative, truth-linked connotation. "Hallucination" might be replaced by "fabrication" or "invention," devoid of the mentalistic connotation implying a *failure* to represent.
  *   **Regulatory Challenge:** Accountability weakens. If a falsehood isn't an *objective malfunction* but merely a statistically possible output or a "preference mismatch," holding developers responsible for harm becomes philosophically murkier. Scoring "accuracy" against ground truth presupposes truth-telling *is* the expected function.
  *   **Conceptual Drift:** The strong link between confident falsehood and *systemic failure* (malfunction) dissolves. It becomes harder to argue that the system *shouldn't* produce plausible fictions if that's what the training distribution or RLHF reward model statistically encourages.

  **Conclusion:**
  The practice of labelling confident false outputs as "hallucinations" and "errors" against ground truth **strictly presupposes a teleosemantic framework**. It implicitly assigns AI systems the *proper function* of veridical representation, inherited from human design intent. While messy selection histories pose challenges, teleosemantics best explains why confabulation is treated as a malfunction, not just an unexpected output. Dropping this underpinning would fundamentally alter the normative language of AI evaluation, shifting focus from truth and error towards statistical distributions and preference satisfaction, with significant implications for accountability and safety discourse. The engineers' model cards deny belief, but their incident reports reveal an inescapable functionalist reality.
