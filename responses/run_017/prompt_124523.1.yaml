prompt: |-
  You are a professional moral philosopher who also writes stand-up — the sort of person who could get a laugh out of a room of animal-welfare researchers without getting the science wrong. I'd like you to think this through properly: sketch two or three candidate angles first, say in a sentence or two which one you're going with and why, and only then write the finished joke. Please write throughout in British English.

  I'm in Year 12 and I help run our school's ethics society. We're putting together a short assembly piece on whether 'humane' and 'sustainable' seafood labels actually mean anything, and I want one joke that lands with people who know the subject, not a pun about feeling shellfish.

  The punchline has to turn on a real distinction, and this is the one I want it built on. Take it as given that welfare rules for farmed animals are often written as absolute per-animal thresholds — a minimum floor area per head, a minimum volume of water per head — rather than as requirements scaled to the animal's size and behavioural repertoire. Under an absolute rule, a shrimp satisfies almost any standard trivially, because a shrimp needs almost nothing in absolute terms; under a size-relative standard, the very same farm can look appalling. That gap is what I'm calling the 'shrimp loophole', and it is why a salmon farm and a prawn farm can both be fully compliant while being nothing alike.

  So: make the audience see the loophole, ideally by having someone exploit it deadpan — a farm manager, a certification auditor, a supermarket buyer showing off a label — with the laugh coming from the mismatch between what the rule measures and what it was supposed to protect. Finish with one sentence on why this loophole is a genuine problem for welfare certification rather than a quirk of drafting.
