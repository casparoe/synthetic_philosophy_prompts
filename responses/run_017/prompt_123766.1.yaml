  Okay, I need to tackle this user's query carefully. They're describing "orphan rationales"—considerations that influence group decisions without anyone in the group actually endorsing them. The user wants a philosophical analysis, not just labels. 

  First, I recall their examples: a nonprofit's funding rule persisting despite unanimous disavowal, hospital ethics committees citing unowned considerations, and personal career norms influencing behavior after being consciously rejected. Their taxonomy includes heirloom, procedurally generated, as-if, and zombie rationales.

  Hmm, the user explicitly rejects existing concepts like agent-neutral reasons (since these require someone to hold them) and group-level reasons (as the group lacks endorsement procedures). They want to know if this implies reasons can exist without reasoners.

  I consider three possible ways to carve this phenomenon. The first is institutional inertia, where rules persist due to structural friction. But this feels too behavioral—it doesn't capture the normative "grip" the user describes. The second is collective intentionality, but the user already dismissed group-level endorsement. The third, which seems most promising, is normative residue: reasons detached from their original agents but embedded in institutional machinery.

  *checks boundary cases* If a new hire endorses an heirloom rationale, it stops being orphaned—but that doesn't erase the prior phenomenon. For considerations tracking unknown realities, that's different; those are unrecognized reasons, not orphaned ones.

  The metaphysical implication? Only zombie rationales might challenge reasoner-dependence, but even there it's shaky. The better view is that orphan rationales are social illusions—powerful but not metaphysically freestanding. 

  *self-check* Did I address all parts? Taxonomy boundaries: handled. Metaphysical question: concluded it's evidence of delusion. User's personal case: included under as-if rationales. Yes.
answer: |-
  Here is a systematic analysis of your phenomenon, developed through conceptual carving, rejection of alternative framings, resolution of boundary cases, and metaphysical implications. I propose a new concept ("normative residue") as no established term fully captures your cases.

  ### Three Conceptual Carvings Considered
  1.  **Institutional Inertia Model:** Views the phenomenon as a byproduct of organizational friction—rules persist due to procedural momentum, cognitive load, or risk aversion. *Rejected:* Fails to explain the *normative grip* of these considerations (e.g., they are cited as justifications, not merely followed out of laziness). Predicts rationales would fade without enforcement but your cases show active reaffirmation.

  2.  **Distributed Belief Model:** Treats the rationale as tacitly held by the collective, emerging from shared practices. *Rejected:* Contradicted by unanimous disavowal in anonymous polls and lack of procedural endorsement. Predicts that group deliberation would eventually align with members' beliefs, but your cases show the rationale *overriding* expressed beliefs.

  3.  **Normative Residue Model (Selected):** Treats these rationales as *detached normative artifacts*—once embedded in institutional machinery (rules, templates, narratives), they exert force independently of personal endorsement. Their power stems from structural incorporation, not belief. *Fits:* Explains why they survive disavowal, why they’re cited authoritatively, and why they shape outcomes despite universal rejection.

  ### Boundary Case Resolution
  - **New hire endorses an heirloom rationale:** It ceases to be "orphaned." This confirms the phenomenon *requires* current disavowal, but doesn’t reduce it to "missing endorsement." The rationale was genuinely orphaned *until* adoption; its prior persistence wasn’t solely about lack of endorsement but institutional embedding.
  - **Consideration tracking an unknown reality:** This is a *distinct phenomenon*—an *objectively valid but unrecognized reason*. Orphan rationales derive force from institutional history, not latent truth. If discovered, this becomes a standard epistemic gap, not normative residue.

  ### Taxonomy Refinement: One Problem Case
  Your taxonomy mishandles a case where **a procedurally generated rationale evolves into a shared value**. Example: A hospital ethics committee uses a "family wishes" checkbox on a form purely for compliance. Over time, the committee begins sincerely appealing to it in discussions, eventually endorsing it as a core value.  
  - **Your taxonomy:** Would ambiguously straddle "procedurally generated" and "heirloom" (if inherited).  
  - **Normative residue lens:** Initially procedural, it loses orphan status once genuinely endorsed. The transition reveals a key feature: residue status depends on *current* disavowal, not origin.

  ### Established Concepts & Shortcomings
  - **Agent-Neutral Reasons:** Captures objectivity but assumes *someone* (even impersonally) must hold/respond to them. Breaks on unanimous disavowal + institutional persistence.
  - **Socially Embedded Reasons (e.g., Searle):** Captures institutional power but assumes collective acceptance. Breaks when acceptance is absent (e.g., anonymous polls).
  - **Foucaultian Discourse:** Captures how structures shape reasoning but overgeneralizes power dynamics. Fails to explain why *specific* rationales persist while others dissolve.

  ### Coined Concept: Normative Residue
  **Definition:** *A consideration that functions as a practical reason within a social system due to its historical entrenchment in institutional structures (rules, templates, rituals), despite lacking current endorsement by any agent or the collective.*  
  - **Necessary conditions:**  
    (a) Institutional embeddedness (in a rule, form, protocol, or narrative);  
    (b) Causal efficacy in shaping decisions;  
    (c) Universal disavowal by individual agents;  
    (d) Absence of collective endorsement procedures.  
  - **Boundary test:**  
    - If a new member endorses it → ceases to be residue (lacks disavowal).  
    - If it tracks reality but is unknown → not residue (lacks embeddedness; it’s an objective reason).  
    - If the board votes to retain it → not residue (now collectively endorsed).

  ### Metaphysical Implications: Illusion, Not Ontological Shift
  Orphan rationales do **not** prove reasons can exist without reasoners. Instead, they reveal how institutions create *simulacra of normativity* through three mechanisms:

  1.  **Structural Compulsion:** Templates or forms force agents to engage with the rationale, granting it de facto authority (e.g., "the form requires us to address reserves, so it *must* matter").  
  2.  **Narrative Inertia:** Once institutionalized, rationales become "plot devices" in organizational storytelling (e.g., board minutes citing the reserves rule to signal consistency).  
  3.  **Proxy Validation:** Agents treat institutional persistence as ersatz endorsement ("if this survives, someone must have a reason—even if not us").

  **Why this is metaphysical illusion:**  
  - The rationale’s force depends entirely on *past agency* (its creation/embedding) and *present agency* (its use as a tool). Remove all agents → residue vanishes.  
  - It has no normative weight independent of social practices. Contrast with objective reasons (e.g., "water is toxic" remains a reason to avoid it even if undiscovered).  

  **Variation by your kinds:**  
  - **Heirloom/Zombie rationales:** Carry the *strongest illusion* of freestanding normativity due to historical authority (heirloom) or decoupling from truth (zombie).  
  - **Procedural/As-if rationales:** Reveal institutional scaffolding more transparently—their power is clearly instrumental.  
  - **Metaphysical weight:** Only zombies *appear* to challenge reason-dependence (since evidence is retracted), but their grip still derives from institutionalized history, not freestanding validity.

  ### Conclusion
  Your cases expose how institutions reify rationales into autonomous-seeming forces, but they are ultimately *artifacts of collective agency*—fossilized intentions that outlive their authors. The pressure they exert is real socially but metaphysically parasitic: they are reasons *only because* they are treated as such by agents within a system, however reluctantly. This is evidence of institutional delusion, not a new ontology of reasons. Normative residue is a powerful social object, but it cannot float free of the practices that sustain it.

  ---
  *This analysis integrates insights from Bratman (shared agency), Searle (institutional facts), and Gilbert (plural subjects), but prioritizes conceptual precision over attribution, per your request.*
