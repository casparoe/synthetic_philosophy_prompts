  For (b)(ii): Exponential prior handling is excellent. They correctly identify g(s) = (1/500)e^{-s/500} and note it's decreasing. The median calculation is perfect - 500 ln 2 ≈ 347. The decisions for $80 (switch) and $600 (keep) are completely correct. But I notice they didn't explicitly compute the inequality - just reasoned qualitatively. The problem asks "for which observed amounts", so they should have solved g(a) > g(a/2)/2 explicitly. Let me check: substituting, e^{-a/500} > (1/2)e^{-a/1000}/2? Simplifying, 1 > (1/4)e^{a/1000}, so a < 1000 ln 4 ≈ 1386. But median is 347, and below median satisfies but it's not the whole story. Actually for exponential, switching when a < 1000 ln 4 ≈ $1386, not just below median. They said $600 is above median so keep, which happens to be correct since 600 < 1386? No 600 < 1386 but they said keep, but according to math should switch? Contradiction. Let me recalculate properly.

  Condition: g(a) > g(a/2)/2
  g(a) = λe^{-λa}, λ=1/500
  So λe^{-λa} > (1/2) λe^{-λ(a/2)} 
  Divide both sides by λ: e^{-λa} > (1/2) e^{-λa/2}
  Set μ = λa: e^{-μ} > (1/2) e^{-μ/2}
  Multiply both sides by e^{μ/2}: e^{-μ/2} > 1/2
  Take ln: -μ/2 > ln(1/2) = -ln2
  So μ/2 < ln2
  μ < 2 ln 2
  λa < 2 ln 2
  a < (2 ln 2)/λ = 2 ln 2 * 500 ≈ 1000 * 0.693 ≈ $693

  Ah! $600 < 693, so should switch, but student said keep. They incorrectly used median when the condition is different. Median is where P(S≤m)=0.5, but here the switching condition is a < 500 * 2 ln 2 ≈ 693. For $600 < 693, should switch, but they said keep because it's above median $347. This is a significant error. They got the qualitative intuition right but botched the calculation. Since they didn't show work, I can't give full credit. This is a major mistake in application.

