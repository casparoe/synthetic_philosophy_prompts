  Right, the voice must mimic upbeat philanthropy jargon - "dashboards," "cost per priority-weighted welfare unit," inspirational quotes. Need to show ε being dialed up mid-report to demonstrate how programs become absurdly focused on microscopic gains for the deeply suffering. 

