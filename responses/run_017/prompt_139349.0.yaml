prompt: |-
  As a third-year PhD student in political psychology, I am deciding whether moral foundations theory can serve as the explanatory layer of my dissertation on the moral intuitions of left and right. Before I build on it I want the specification rather than another scorecard: what would a psychological account of the moral differences between left and right have to deliver in order to count as evidence about whose first-order moral claims are more likely true, rather than merely an account of why people hold the ones they do?

  Give me the requirements list, each with the case or consideration behind it. I have candidate requirements I want you to adjudicate rather than simply endorse:

  1. Causal-role specificity: the account must say whether the foundations generate moral judgment, filter or weight the inputs judgment is formed from, or rationalize judgments reached independently, and it must show why a debunking argument needs one of these answers rather than merely a correlation.
  2. Symmetry: whatever explanatory story is told about the other side's intuitions must be tellable about one's own side's without special pleading; say what exactly the symmetry test is, and whether it is satisfiable by a theory whose own practitioners have political commitments.
  3. Grain: correlations at the resolution of left and right look too coarse to bear on disputes about particular policies or verdicts; require the account to locate the grain at which its evidence is supposed to bite, and say what it owes us when the correlation thins out at finer grain.
  4. The convert and the reversal: people who switch political sides over a lifetime, and populations in which the mapping between foundations and political identity differs from the American one. As a hypothetical, suppose large non-WEIRD samples showed the binding foundations loading onto the opposite coalition; argue whether passing that test is a genuine desideratum or a prejudice of one camp.
  5. Moral change: if the foundations are comparatively stable individual parameters while the content of political morality shifts within a generation, the account must say what does the changing.

  Add requirements I have not thought of. For each, mark it non-negotiable or a preference of a particular camp. Then name any subset of the requirements you suspect cannot be jointly satisfied, since that is the part I most want to see, and identify the single requirement that excludes the most candidate positions.

  I do not want a literature review and I do not want citations; I want the criteria and the argument for each.

  Sections, with rough lengths: Purpose, about 60 words; Requirements, about 500 words, a table is fine; Jointly unsatisfiable subsets, about 200; The load-bearing requirement, about 150; Scorecard, about 200, covering Haidt's version, the morality-as-cooperation rewrite, and one relationist or constructivist competitor of your choosing, briefly, against the list.
reasoning: |-
  Okay, the user is a third-year PhD student in political psychology working on their dissertation about moral intuitions of the left and right. They want to know if moral foundations theory (MFT) can serve as an explanatory layer that helps determine whose moral claims are more likely true, not just why people hold them. 

  The user has provided five candidate requirements they've thought of, and they want me to adjudicate these rather than just endorse them. They also want me to add any missing requirements, mark them as non-negotiable or camp-specific, identify requirements that can't be satisfied together, and pick the most load-bearing requirement. Finally, they want a scorecard evaluating Haidt's MFT, morality-as-cooperation, and a constructivist alternative against the requirements.

  Let me start by understanding the user's needs. They're at a critical stage in their PhD and need to decide if MFT is robust enough for their dissertation's explanatory framework. They're not just looking for a literature review; they want rigorous criteria to evaluate theories. Their deeper need might be to ensure their dissertation makes a novel contribution and avoids theoretical pitfalls. They might also be concerned about being perceived as biased, given the political nature of their topic.

  Looking at their candidate requirements: 

  1. **Causal-role specificity**: They want clarity on whether foundations generate, filter, or rationalize judgments. This is crucial because without knowing the causal mechanism, it's hard to move from description to evaluating truth claims. For example, if foundations just rationalize pre-existing judgments, that could debunk them. I think this is non-negotiable because any theory claiming explanatory power needs a clear causal account.

  2. **Symmetry**: The theory must apply equally to both sides without special pleading. If a theory explains away the other side's views as irrational but not one's own, that's biased. The test here is whether the same explanatory mechanisms work regardless of political alignment. Even if researchers have political commitments, the theory itself must be symmetric. This seems non-negotiable for objectivity.

  3. **Grain**: Correlations at the broad left-right level might be too coarse. The theory needs to specify at what level of detail (e.g., individual policies) it applies and what happens when correlations break down at finer grains. If the theory only works at a high level but not for specific policies, its applicability to real moral disputes is limited. This is non-negotiable for practical relevance.

  4. **Convert and reversal**: How does the theory handle political switchers or non-WEIRD samples where foundations map differently to politics? If a theory can't explain why someone changes sides or adapts to different cultural contexts, it might be culturally biased. The user questions if this is a genuine requirement or just a camp preference. I think it's non-negotiable because generalizability across cultures and individual changes tests the theory's universality.

  5. **Moral change**: If foundations are stable but moral views shift, what drives change? A theory must account for this dynamic. Without this, it can't explain how moral progress happens. Non-negotiable for a complete account.

  Now, adding missing requirements:

  - **Truth-tracking mechanism**: How do foundations connect to moral truth? Without this, the theory can't evaluate whose claims are truer. Non-negotiable, as it's central to the user's goal.
    
  - **Epistemic transparency**: Moral claims should be debatable based on reasoning, not just foundations. This is non-negotiable to avoid reducing morality to unreasoned intuitions.
    
  - **Normative independence**: The account shouldn't presuppose a specific moral framework. This might be preferred by neutral camps but is crucial for avoiding bias.

  Identifying jointly unsatisfiable requirements: Symmetry and truth-tracking might conflict. If a theory is symmetric, it treats both sides equally, but truth-tracking might require judging one side as closer to truth. Similarly, causal-role specificity and moral change could clash if foundations are fixed causes but moral views change. The load-bearing requirement is likely truth-tracking mechanism because without it, the theory can't address whose moral claims are truer, which is the user's core aim.

  For the scorecard:
  - **Haidt's MFT**: Struggles with causal-role (foundations as post-hoc rationalizations?), symmetry (criticized as conservative-leaning), grain (broad correlations), and truth-tracking (doesn't address truth).
  - **Morality-as-cooperation**: Better on truth-tracking (frames cooperation as truth-conducive) but may fail symmetry and convert/reversal in non-WEIRD societies.
  - **Constructivist competitor**: Excels in moral change and grain but fails truth-tracking by relativizing moral truth.

  The user's unspoken need might be to validate their dissertation's framework against potential criticism, ensuring it's philosophically and methodologically sound. They might also seek to position their work as bridging empirical psychology and normative theory, which requires a robust explanatory layer. By providing clear criteria, I'm helping them critically assess MFT and alternatives, strengthening their dissertation's foundation.
answer: |-
  ### Purpose  
  To evaluate whether a psychological theory of left-right moral differences can adjudicate whose first-order moral claims are more likely *true* (not merely explain their origin), it must meet specific criteria bridging descriptive psychology and normative epistemology. The theory must transcend correlation to engage with moral justification.

  ### Requirements  
  *(Non-negotiable = N; Camp-specific = C)*  

  | Requirement                | Case/Consideration                                                                                                | Status       |  
  |----------------------------|------------------------------------------------------------------------------------------------------------------|--------------|  
  | **1. Causal-Role Specificity** | Debunking arguments require knowing *how* foundations contribute to judgment: If foundations merely rationalize pre-existing intuitions, they lack justificatory force. A generative/filtering role permits claims about reliability. | N            |  
  | **2. Symmetry**            | Asymmetric explanations (e.g., "right-wing intuitions are parochial, left-wing are enlightened") beg the question. The test: *Apply the same causal mechanism to both sides without implying inherent bias*. Practitioners' commitments don’t preclude this if the theory’s logic is politically neutral. | N            |  
  | **3. Grain**               | Left-right aggregates mask intra-group dissent (e.g., leftists split on immigration). The account must specify: (a) the *level* (e.g., policy domains, core values) where foundations predict judgments, and (b) how to handle cases where foundations and judgments diverge (e.g., is this noise or falsification?). | N            |  
  | **4. Convert & Reversal**  | Switchers challenge static trait models: Why do foundations shift pre/post-conversion? Cross-cultural reversals (e.g., binding foundations predicting leftism) test universality vs. cultural contingency. **Desideratum**: True if the theory aspires to universality; else it admits cultural construction (weakening truth claims). | C (Universalists) |  
  | **5. Moral Change**        | If foundations are stable but moral norms shift (e.g., LGBTQ+ rights), what drives change? Must reconcile fixed psychological roots with evolving consensus, or explain why foundations don’t determine specific norms. | N            |  
  | **6. Truth-Tracking Mechanism** (Added) | Must explain *how* foundations track moral truth (e.g., via learning, evolutionary fit, coherence). Without this, no bridge to epistemic superiority. | N            |  
  | **7. Epistemic Transparency** (Added) | Moral claims must be debatable via reason. If foundations are opaque/arational, they cannot justify truth—only explain error. Requires foundations to interface with public reasoning. | N            |  
  | **8. Normative Independence** (Added) | The account must not presuppose a contested normative framework (e.g., utilitarianism) to avoid circularity. | C (Neutralists) |  

  ### Jointly Unsatisfiable Subsets  
  **Conflict 1: Symmetry + Truth-Tracking**  
  If the theory must symmetrically explain both sides’ intuitions *and* claim one side’s foundations better track truth, it risks self-defeat: Symmetry suggests equivalent causal origins, but truth-tracking requires asymmetric epistemic status. Resolving this demands showing why one set of foundations is more reliable (e.g., via responsiveness to evidence)—a high bar.  

  **Conflict 2: Causal-Role Specificity + Moral Change**  
  If foundations are fixed causal generators (e.g., innate templates), moral change becomes inexplicable without ad hoc additions (e.g., "foundations interact with shifting environments"). But if foundations merely filter/rationalize, their explanatory power for truth claims weakens.  

  ### The Load-Bearing Requirement  
  **Truth-Tracking Mechanism** (#6) excludes the most positions. Without it, the account collapses into descriptive psychology, unable to engage normative claims. It demands:  
  - A link between foundations and moral facts (e.g., foundations as error-prone heuristics vs. reliable perception).  
  - An answer to the Euthyphro dilemma: Are foundations truth-apt because they track mind-independent goods, or are goods defined by foundations?  
  Most empirical theories (e.g., MFT) sidestep this, rendering them inert for adjudicating truth.  

  ### Scorecard  
  *(✓ = Satisfied; ✗ = Not; ~ = Partially)*  

  | Requirement               | Haidt’s MFT       | Morality-as-Cooperation (MAC) | Constructivist Competitor (e.g., Social RBFT) |  
  |---------------------------|-------------------|-------------------------------|----------------------------------------------|  
  | 1. Causal-Role Specificity | ✗ (Ambiguous: generative? rationalizing?) | ~ (Frames foundations as cooperative solutions) | ✓ (Foundations as constructed via relational cues) |  
  | 2. Symmetry               | ✗ (Often frames binding foundations as "parochial") | ✓ (Cooperation neutral re: politics) | ✓ (All intuitions relationally contingent) |  
  | 3. Grain                  | ✗ (Broad; silent on intra-group variation) | ~ (Specifies adaptive problems) | ✓ (Focuses on local contexts) |  
  | 4. Convert & Reversal     | ✗ (Weak on switchers; WEIRD-centric) | ✗ (Assumes universal cooperation norms) | ✓ (Embraces cultural variation) |  
  | 5. Moral Change           | ✗ (Stable foundations vs. shifting norms) | ~ (Norms evolve via cooperation demands) | ✓ (Change via relational dynamics) |  
  | 6. Truth-Tracking         | ✗ (No mechanism; descriptive only) | ~ (Claims cooperation = moral truth) | ✗ (Truth relativized to relations) |  
  | 7. Epistemic Transparency | ✗ (Intuitions opaque) | ~ (Cooperative reasoning possible) | ~ (Reasoning embedded in relations) |  
  | 8. Normative Independence | ✗ (Conservative tilt) | ✗ (Presumes cooperation as good) | ✓ (Avoids prior normativity) |  

  **Verdict**:  
  - **Haidt’s MFT**: Strong descriptively but fails truth-tracking and symmetry. Cannot adjudicate truth.  
  - **MAC**: Truth-tracking via cooperation, but culturally rigid and normatively loaded.  
  - **Constructivist (e.g., Social RBFT)**: Explains variation/change, but relativizes truth, abandoning normative adjudication.  
  **No candidate satisfies all non-negotiables**, especially #6 (Truth-Tracking). Your project likely requires hybridizing psychology with normative philosophy to bridge the gap.
