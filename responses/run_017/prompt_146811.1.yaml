prompt: |-
  I'm working through the poverty of the stimulus literature and I've lost track of what the argument is even supposed to establish, because innateness seems to change meaning whenever it comes under pressure. So before I defend or attack any position, I want the specification.

  Write the desiderata a notion of innateness must satisfy to be adequate for one job only: making a poverty-of-the-stimulus argument sound. I do not want a general theory of innateness — I want the minimal notion that has to hold if the claim that the input underdetermines the output, so part of the structure must come from the organism, is to amount to more than a shrug.

  For each requirement, give the case or consideration behind it, and mark it as non-negotiable or as a preference of one camp. Please also separate the distinctions people routinely collapse: I can find at least four things meant by innate (species-typical, present at birth, not learned, genetically channeled), and I want whatever else belongs on that list, including whatever keeps innate-but-experience-dependent traits from being misfiled.

  Three things I especially want your judgment on.

  First: must the innate specification be stated independently of the outcome it is meant to explain? Poverty arguments always seem to be reconstructed once we already know the target grammar, so the gap is whatever is left over; but if I demand the constraint be fixed in advance, I seem to demand that linguists guess right the first time. Genuine desideratum, or a prejudice of the anti-nativist camp?

  Second: is poverty a property of the input at all, or only of the input relative to a specified class of learners? As I see it, the gap claim (input underdetermines output) and the source claim (the missing information comes from the organism rather than from the statistics of the signal, from non-linguistic cognition, or from the learner's own inductive biases) are separable, and relativizing poverty to a learner class is what stops the argument from being vacuous — but then the conclusion is hostage to whatever learner we happened to specify, and every advance in statistical learning reopens it. Are non-vacuity and architectural neutrality jointly unsatisfiable? If they are, that is the result I most want.

  Third: which single requirement excludes the most live views? Keep any scoring of the usual positions — nativist, statistical or emergentist, developmental-systems — to a few lines; the criteria are the deliverable.
reasoning: |-
  Okay, the user is deep into the poverty of the stimulus (POS) literature and feeling lost about what innateness actually means in this context. They want a minimal set of criteria for innateness that makes the POS argument work, without getting into general theories. Let me unpack their main concerns.

  First, they mention that "innateness" seems to shift meanings under pressure. That's a common critique. They want clarity on what exactly the term must satisfy specifically for POS arguments to hold water. The key here is to focus solely on what's necessary for POS, not broader philosophical debates.

  They want desiderata—requirements that any notion of innateness must meet for POS to be sound. Each requirement needs a rationale and whether it's non-negotiable or camp-specific. They also want distinctions between different innate concepts (species-typical, present at birth, etc.), especially how to handle "innate but experience-dependent" traits. 

  Three specific issues they want addressed:
  1. **Independence from outcome**: Must the innate constraints be defined before knowing the outcome? They worry that POS arguments are reverse-engineered after the fact. Is this a genuine requirement or just anti-nativist bias?
  2. **Relativity to learner class**: Is poverty about the input alone or input relative to a learner? They see a tension here—relativizing avoids vacuity but makes the conclusion dependent on the learner model, which keeps changing with new learning research.
  3. **Which requirement excludes most live views**: They want to know which criterion is the biggest hurdle for current theories (nativist, statistical, developmental systems).

  Breaking this down:

  For **desiderata**, the core of POS is that input underdetermines output, so the organism must contribute structure. The requirements should ensure that "contribution from the organism" isn't trivial. Key points:
  - **Non-Statistical Origin (NSO)**: The constraint can't be learned from the input using general stats. Non-negotiable.
  - **Organismic Origin (OO)**: Must come from the organism's pre-existing structure. Non-negotiable.
  - **Specificity to Domain (SD)**: Not reducible to general cognition. Non-negotiable for strict POS.
  - **Prior Specification (PS)**: Constraints must be predefined, not reverse-engineered. This is where camps split—nativists might accept post-hoc, critics demand advance specification. Probably the biggest divider.
  - **Stability Across Experience (SAE)**: Shouldn't be altered by linguistic input. Non-negotiable to avoid circularity.
  - **Robustness (R)**: Present across normal environments. Non-negotiable for POS.

  Handling the four innate concepts:
  - Species-typical: Not required (could be individual mutation).
  - Present at birth: Not required (could develop later).
  - Not learned: Core, but nuanced (experience-dependent triggers allowed).
  - Genetically channeled: Preferred by nativists but not essential for POS logic.

  On the three specific issues:
  1. **Independence (PS)**: Genuine issue. Without prior specification, POS risks being circular. Anti-nativists insist on it; nativists might relax it. But for POS to be substantive, PS is crucial—otherwise, it's just gap-filling after the fact.
  2. **Relativity to learner**: Poverty is always relative to a learner class. POS argues that *any* learner without innate constraints would fail. But this is tricky—how to define "any learner"? The learner must be computationally plausible. Advances in stats learning do challenge POS, but POS claims that even optimal learners need innate constraints for certain gaps (e.g., structure-dependence).
  3. **Most excluding requirement**: PS (Prior Specification). It trips up everyone. Nativists struggle to pre-specify constraints without circularity; statistical learners argue constraints emerge; DST rejects fixed pre-specification. PS is the tightrope—essential for non-circularity but hard to satisfy.

  Additional nuance:
  - Experience-dependent triggers (e.g., parameter setting) can still be innate under NSO/OO/SAE—they're activated by input but not shaped by it.
  - The "four distinctions" help clarify: POS innateness is about being unlearned (NSO) and organismic (OO), not about birth timing or species-typicality.

  Final thought: The user's deepest need might be cutting through the fog of shifting definitions to find the bedrock requirements that make POS a falsifiable claim, not just a nativist mantra. The relativity to learner and prior specification are the knives edge—get those right, and the rest follows.
answer: |-
  Below is a minimal specification for a notion of "innateness" that must hold for a poverty-of-the-stimulus (POS) argument to be non-vacuous. I focus solely on what is required to make the core POS inference valid:  
  **If the input underdetermines the output, the missing structure must come from the organism.**  
  The desiderata avoid general metaphysics and target only the *explanatory role* of innateness in POS arguments. I distinguish criteria, flag negotiability, and clarify collapsed concepts.  

  ---

  ### **Core Desiderata for POS-Innate Constraints**  
  *(Non-negotiable = Necessary to avoid circularity/triviality)*  

  1. **Non-Statistical Origin (NSO)**  
     - **Requirement**: The constraint cannot be acquired through statistical induction over the primary linguistic input (e.g., frequency, distributional regularities).  
     - **Rationale**: POS claims the input lacks sufficient data for induction. If constraints *could* be learned statistically, the "gap" vanishes.  
     - **Status**: Non-negotiable.  
     - **Distinction**: Separates "innate" from *input-driven statistical learning*. Allows constraints to be *triggered* by experience (e.g., parameter setting) but not *shaped* by it.  

  2. **Organismic Origin (OO)**  
     - **Requirement**: The constraint must arise from pre-existing properties of the learner's biological architecture.  
     - **Rationale**: POS attributes the gap-filling to the organism, not external factors (e.g., social context) or domain-general learning.  
     - **Status**: Non-negotiable.  
     - **Distinction**: Separates "innate" from *environmental scaffolding* or *cultural transmission*. Accommodates *experience-dependent maturation* (e.g., genetically guided development).  

  3. **Specificity to the Domain (SD)**  
     - **Requirement**: The constraint must be irreducible to domain-general cognitive principles (e.g., working memory, pattern recognition).  
     - **Rationale**: POS argues for *language-specific* structure. If constraints reduce to general cognition, the "stimulus poverty" claim collapses.  
     - **Status**: Non-negotiable for *strong* POS (Chomskyan); negotiable for *weak* POS (e.g., emergentist).  
     - **Distinction**: Separates "domain-specific innate" from *domain-relevant biases*.  

  4. **Stability Across Experience (SAE)**  
     - **Requirement**: The constraint must be immune to revision by linguistic input (though it may require input for activation).  
     - **Rationale**: If constraints were malleable by input, the "poverty" would not exist—input could shape the output.  
     - **Status**: Non-negotiable.  
     - **Distinction**: Separates "innate" from *learned* or *statistically tuned* traits. Allows *critical periods* where constraints become inactive.  

  5. **Robustness (R)**  
     - **Requirement**: The constraint must manifest reliably across normal developmental environments.  
     - **Rationale**: POS posits universals (e.g., structure-dependent rules) unexplained by input variation.  
     - **Status**: Non-negotiable (for POS universals).  
     - **Distinction**: Separates "innate" from *idiosyncratic* or *environmentally contingent* traits.  

  ---

  ### **Addressing Your Three Key Issues**  

  #### **1. Prior Specification (PS) Requirement**  
     - **Requirement**: The innate constraint must be statable *independently of the target output* (e.g., grammar).  
     - **Rationale**: Without PS, POS arguments reverse-engineer constraints from observed outcomes, making the inference circular ("the gap exists because we defined constraints to fill it").  
     - **Case**: E.g., Structure-dependence in questions (*Is the man who is tall happy?* vs. **\*Is the man who tall is happy?*). Nativists claim no input teaches this; critics demand proof that constraints pre-exist.  
     - **Status**:  
       - **Anti-nativist camp**: Non-negotiable (avoids circularity).  
       - **Nativist camp**: Often negotiable (constraints are inferred from gaps).  
     - **Judgment**: **Genuine desideratum**. Without PS, POS risks being unfalsifiable. Specifying constraints in advance (e.g., "hierarchical recursion") need not require "guessing" the full grammar—only defining *classes* of constraints (e.g., "syntax operates on phrases, not linear order").  

  #### **2. Relativity of Poverty to Learner Class**  
     - **Requirement**: Poverty is a property of the input *relative to a learner architecture*.  
     - **Rationale**: Input alone cannot be "impoverished" without reference to what learners can extract from it.  
     - **Case**: Connectionist models (e.g., Elman 1993) "solve" POS gaps with statistical learning, but nativists argue these models smuggle in biases equivalent to innateness.  
     - **Status**:  
       - **Non-vacuity**: Relativizing to a learner class is non-negotiable (otherwise, all learning is "impoverished").  
       - **Architectural neutrality**: **Impossible to satisfy**. POS requires a *fixed* learner architecture to define poverty. If the learner is arbitrary, POS is vacuously true/false.  
     - **Resolution**: POS assumes a *minimally biased learner* (e.g., no built-in linguistic knowledge). The argument holds only if:  
       - (a) The learner class is computationally plausible (e.g., Turing-complete but data-efficient), and  
       - (b) All learners in this class fail to acquire the output from the input *without innate constraints*.  
     - **Judgment**: Advances in statistical learning *do* reopen POS, but POS remains sound if innate constraints are the *only* explanation for *all minimally biased learners*.  

  #### **3. Requirement Excluding the Most Live Views**  
     - **Strongest Filter**: **Prior Specification (PS) + Non-Statistical Origin (NSO)**.  
       - **Why**: PS requires constraints defined *before* observing outcomes, and NSO forbids statistical induction. This excludes:  
         - **Statistical/Emergentist Views**: Reject PS (emergent constraints are outcome-driven) and NSO (constraints are learned).  
         - **Developmental Systems Theory (DST)**: Rejects PS (constraints arise from organism-environment dynamics) and OO (no "pre-existing" architecture).  
         - **Weak Nativism**: Fails PS if constraints are reverse-engineered (e.g., "Universal Grammar" as a catch-all gap-filler).  
     - **Surviving Views**: Only *strong nativism* with pre-formalized constraints (e.g., principles-and-parameters) clears all bars.  

  ---

  ### **Clarifying Collapsed "Innate" Concepts**  
  | Concept               | POS-Relevant? | Notes                                                                 |
  |-----------------------|---------------|-----------------------------------------------------------------------|
  | Species-typical       | No            | Irrelevant; could be individual mutation if it satisfies NSO/OO.     |
  | Present at birth      | No            | Allows maturation (e.g., binocular vision). SAE/NSO matter more.     |
  | Not learned           | **Yes**       | Core to NSO, but qualified: *triggering* ≠ learning.                 |
  | Genetically channeled | Optional      | Supports OO but not required; could emerge from developmental constraints. |
  | **Experience-dependent** | Compatible | E.g., innate triggers activated by input (SAE ensures input doesn't *shape* the constraint). |  

  ---

  ### **Summary of Minimal POS-Innate**  
  For POS to be substantive, innateness must mean:  
  > **A biologically pre-existing (OO), domain-specific (SD), input-invariant (SAE) constraint that is (a) not learnable from statistics (NSO), (b) robust across environments (R), and (c) specifiable independently of the output (PS).**  

  Fail any non-negotiable criterion, and POS reduces to:  
  - **Without PS**: Circular gap-filling.  
  - **Without NSO/OO/SD**: Trivialized by general learning or environment.  
  - **Without SAE/R**: Not universal or input-independent.  

  The hardest bar is **PS**: It forces nativists to commit to falsifiable constraints *before* data, blocking retrofitting. This is why PS is the litmus test for a non-shrug POS argument.
