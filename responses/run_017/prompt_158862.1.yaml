  Here is the adjudication of each move, followed by the requested prose analysis. The verdicts judge each claim as made, without retroactive repair, focusing on conceptual accuracy regarding testimonial injustice.

  ### Adjudication Table

  | Move | Speaker | Claim                                                                                                                               | Verdict         | Why                                                                                                                                                                                                                                 | Stated or assumed                                                                                          |
  | :--- | :------ | :---------------------------------------------------------------------------------------------------------------------------------- | :-------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------- |
  | (1)  | Callum  | Amara suffered testimonial injustice because her credibility was downgraded due to her identity as a pupil and Black girl, regardless of intent or outcome. | **Mostly right** | The core idea that credibility deficits based on identity constitute testimonial injustice is correct. However, the standard account (as Nadia notes) requires this deficit to be *caused by prejudice*, which Callum ignores here. | *Assumed:* Identity-based credibility deficits are inherently testimonial injustice. *(Debatable: requires prejudice link)* |
  | (2)  | Nadia   | Testimonial injustice requires the credibility deficit to be caused by identity prejudice; the head used a base rate (not prejudice), so this isn't testimonial injustice. | **Mostly right** | Correctly identifies the necessity of prejudice in Fricker's definition. Base rates, even if identity-linked, aren't inherently prejudiced reasoning. But she assumes the base rate is clean/neutral, which Callum challenges next. | *Assumed:* The head's base rate reasoning was objective and not prejudiced. *(Plausible but contested)* |
  | (3)  | Callum  | The low substantiation rate (the base rate) is "contaminated" by prior credibility deficits, making the head's reasoning a "laundered" prejudice that still wrongs Amara. | **Half right**  | Insightfully identifies how systemic bias can taint evidence used neutrally later. But "laundered prejudice" stretches testimonial injustice beyond individual prejudice unfairly; it risks conflating it with structural injustice. | *Stated:* The log is tainted by prior credibility deficits. *(Likely true, but not proven)* |
  | (4)  | Nadia   | 1) The head inherited a mess he didn't create, so he didn't *wrong* Amara personally. 2) Calling this testimonial injustice dilutes the concept; it's institutional unfairness. | **Mostly wrong** | 1) Misunderstands injustice: agents can perpetuate structural wrongs without personal malice. 2) Correctly warns against concept creep, but too quickly dismisses the epistemic harm ("downgraded as a knower"). | *Assumed:* Testimonial injustice requires a prejudiced *individual* wrongdoer. *(Too narrow; systems matter)* |
  | (5)  | Callum  | Amara faces a "credibility tax" (extra epistemic labour) due to her group identity, which is a testimonial injustice even without flawed individual reasoning. | **Mostly right** | The "credibility tax" is a powerful descriptor of systemic epistemic harm tied to identity. While it shares features with other burdens (e.g., citing sources), the *identity-tracking* aspect makes it distinct and unjust. | *Stated:* Identity-correlated extra epistemic labour is inherently wrongful. *(Strong, if identity is the cause)* |
  | (6)  | Nadia   | 1) A "credibility tax" isn't unique or inherently unjust (e.g., researchers cite sources). 2) Identity must matter, requiring prejudice, not base rates. 3) The real issue is hermeneutical injustice (lack of interpretive resources). | **Mostly wrong** | 1) False equivalence: burdens like citing sources are role-based/universal; Amara's is identity-based. 2) Correctly notes identity must track the harm, but wrongly insists this demands individual prejudice. 3) Wrongly reframes the case: Amara *had* the concept ("racist") and was understood. | *Assumed:* Identity-tracking epistemic burdens require individual prejudice. *(False; systems can cause identity-based burdens)* |
  | (7)  | Callum  | 1) This isn't hermeneutical injustice because Amara had and voiced the concept ("racist"). 2) Testimonial injustice can include "laundered deficits" as a milder form. | **Clearly right** | 1) Spot on: hermeneutical injustice involves lacking concepts *before* speaking; Amara didn't. 2) Conceding "milder species" sensibly acknowledges systemic cases differ from blatant prejudice, keeping testimonial injustice relevant. | *Stated:* Hermeneutical injustice requires a deficit *before* testimony. *(True)* |

  ### Overall Analysis

  **Overall:** Callum is more right about the core issue. He correctly identifies that Amara suffered an identity-based epistemic harm – specifically, a credibility deficit and "tax" rooted in systemic bias, even if the head acted without personal prejudice. Nadia is more right about preserving the precision of "testimonial injustice" as traditionally requiring prejudice, but she wrongly downplays the distinct epistemic wrong Amara experienced and misapplies hermeneutical injustice.

  **What both are missing:** Neither fully grapples with how **systemic testimonial injustice** functions. Prejudice isn't always in the hearer's mind; it can be embedded in institutional processes (like the tainted complaint log) that *systematically* downgrade certain groups as knowers. The key question isn't just "Was the head prejudiced?" but "Did the school's *system* impose an identity-based credibility burden?" This reframes Callum's "laundered deficit" more accurately.

  **The hinge:** The **tainted complaint log** is crucial. If the log *is* contaminated by prior credibility deficits against pupils (especially if Black girls were disproportionately dismissed), then the head's "neutral" base rate perpetuates systemic prejudice. *Remove this*, and Callum's claims in (1) and (5) weaken: (1) becomes less compelling without evidence the deficit *was* identity-linked beyond being a pupil, and (5)'s "credibility tax" seems less unjust if the base rate is genuinely clean. With the tainted log, however, both claims hold: Amara *was* downgraded as a knower due to systemic bias linked to her identity, and she *does* owe extra labour to counter a system rigged against her credibility.
