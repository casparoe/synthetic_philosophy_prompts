prompt: |-
  Something I keep running into when people argue about copying policies from one country to another, and I want to know whether there's a word for the thing I'm noticing.

  The argument always runs the same way. Someone says: look at the Nordics, they have high taxes, big universal programs, light-touch enforcement, and it works, let's do that here. And the reply is: it works there because people there trust each other and trust the state, and you can't import that, trust is something that takes generations. I get the point. But I've started to think that reply is doing two really different jobs and getting away with it by sounding like one objection.

  Some policies look like they *use up* trust. If I already expect that most other people are paying what they owe, not claiming things they aren't entitled to, not faking the paperwork, then a generous low-surveillance system works great for me. If I don't have that expectation, the identical system looks like an invitation to be the sucker, so I take what I can, other people watch me do it, the expectation drops further, and you've burned whatever stock there was. Import that kind of policy into a low-trust place and it doesn't merely fail, it leaves you worse off than before you tried.

  But other policies look like they *make* the trust they need. The clearest case I can think of is the same pot of money given to everyone regardless of income versus targeted at people below a line. The targeted version needs a lot of checking, it draws a bright line between the people who get it and the people who pay for it, everyone resents it, and it seems to erode the very goodwill you'd need in order to run it decently. The universal version needs almost no checking, everybody is in it, and — this is the part I have no vocabulary for — after a while people actually do seem to start expecting that the others are in it too. The attitude the policy needed at the start is the attitude the policy produces once it exists. It bootstraps, at the cost of taking a long time to do it.

  So what I'm after isn't really a label. I want to know whether that second pattern is a genuine distinct thing or just the first pattern with a time axis stuck on, and if it is distinct, whether there's an established concept for it and how it differs from the nearest ones. The things I've bumped into that feel adjacent: people talk about social capital, about path dependence, about situations where everyone would cooperate if only everyone expected everyone else to cooperate, and I've also seen an argument that means-tested programs are self-undermining because they break up the coalition that would defend them. Those each grab a piece — the social capital stuff is about a stock of trust, the everyone-waits-for-everyone stuff is about expectations being self-reinforcing, the coalition stuff is about the politics — but none of them seems to be about the timing structure, where a policy needs X at the beginning and manufactures X over a couple of decades.

  Two cases I can't sort out, if you want something to test a definition against. First: a policy that builds trust among the people receiving it while destroying it among the people paying for it — same phenomenon, or the opposite one wearing the same clothes? Second: a policy that does generate the trust but only slowly enough that the generation which has to vote for it never sees the payoff — does that still count, or is that better described as a different problem entirely, about democratic time horizons rather than about trust?

  Please don't just reassure me that this is a familiar thing in the literature, i dont have library access and I'm not writing anything, I just want the concept to be sharp: what exactly it is, what it isn't, where its edges are. And if the honest answer is that the trust-eating versus trust-making distinction isn't real and it's all one mechanism with different parameters, say so and tell me what the parameters are.
reasoning: |-
  Okay, the user is noticing a pattern in policy debates where some policies erode trust while others build it over time. They want to know if this distinction is real and if there's a concept for it. Let me start by recalling the key points they mentioned.

  First, they describe two scenarios. One is policies that "use up" trust, like low-surveillance systems that fail in low-trust societies, making things worse. The other is policies that "make" trust, like universal benefits that start off needing trust but eventually create it through widespread inclusion. The user is questioning if these are genuinely different or just the same mechanism over time.

  I remember concepts from institutional economics and game theory. Elinor Ostrom's work on common-pool resources talks about trust and reciprocity. The universal vs. targeted policies remind me of "preference falsification" and how universal programs avoid creating resentment. Also, self-reinforcing equilibria in game theory, like in coordination games, where expectations shift over time. 

  The user's cases are tricky. A policy that builds trust among recipients but erodes it among payers: here, the mechanism might be the same (expectations affecting behavior), but the groups involved have conflicting experiences. So it's the same phenomenon but with distributional effects. The second case, where trust builds too slowly for voters to benefit, touches on time inconsistency in democracies. That's a separate issue of political incentives, not the trust mechanism itself.

  The user wants clarity, not just reassurance. They mentioned social capital, path dependence, and coalition-building, but those don't capture the temporal aspect of policies generating their own prerequisites. The key is whether the policy's design alters expectations and behaviors in a way that becomes self-sustaining over time. Universal programs do this by including everyone, reducing us-vs-them dynamics, and fostering a shared stake in the system. 

  So the distinction is real: trust-using vs. trust-building policies differ in their feedback loops. The parameters are the policy's inclusivity, visibility of compliance, and the timescale for cultural adaptation. Trust-building policies need broad inclusion and time to shift norms, while trust-using ones require existing norms to function without degradation. 

  For the edges: if a policy creates trust in one group but not another, it's still the same mechanism but unevenly applied. The slow build-up is inherent to the process, but the democratic timeline problem is external. The core concept is the policy's capacity to transform expectations through consistent, inclusive application over time.
answer: |-
  You've articulated a crucial distinction that *is* genuine and structurally different, though closely related. Here's a sharp conceptual breakdown:

  1.  **The Core Distinction:**
      *   **Trust-*Using* Policies:** Operate within an existing equilibrium of trust. They rely on pre-existing norms of cooperation and compliance to function efficiently. Introducing them into a low-trust environment actively *degrades* the system because non-compliance becomes rational and visible, reinforcing negative expectations (a negative feedback loop). **Mechanism:** *Dependency on existing social capital.* Failure mode is rapid *erosion*.
      *   **Trust-*Building* Policies:** Are designed to *create* or *shift* the equilibrium itself. They don't just rely on trust; they actively foster norms of universalism, shared fate, and reciprocity through their structure and universal application. This creates a positive feedback loop where initial cooperation (even if grudging) leads to observable compliance, gradually strengthening expectations and norms over time. **Mechanism:** *Generation of new social capital/norms.* Success mode is slow *cultivation*.

  2.  **The Established Concept:** This is best understood as **"Institutional Design for Norm Creation"** or **"Bootstrapping Cooperative Equilibria."** Key adjacent concepts it synthesizes:
      *   **Elinor Ostrom's Design Principles:** Her work on common-pool resources shows how specific institutional rules (like clear boundaries, graduated sanctions, conflict resolution) can foster trust and cooperation *over time* where it didn't exist before. This directly maps to your "trust-building" policy design.
      *   **Self-Reinforcing / Self-Undermining Institutions:** Institutions can be designed to create the conditions for their own success (positive feedback) or failure (negative feedback). Your examples are perfect instances.
      *   **Coordination Games & Focal Points:** Universal programs create a clear "focal point" – everyone participates. This simplifies the coordination problem ("Everyone else is in, so I should be too/play fair") making cooperation the easier default over time.
      *   **Preference Falsification & Pluralistic Ignorance:** Targeted programs can reinforce "us vs. them" narratives, making resentment the visible norm even if many privately support solidarity. Universal programs avoid this by making inclusion the visible norm, potentially shifting hidden preferences.

  3.  **How it Differs from Adjacent Concepts:**
      *   **Social Capital:** This is the *stock* (trust, norms, networks). Your distinction is about how specific *policy designs* either *deplete* or *replenish/generate* that stock. It's the *dynamic interaction mechanism*.
      *   **Path Dependence:** This emphasizes history locking in outcomes. Your focus is on *how the initial design choice sets the path* towards either erosion or cultivation. The trust-building policy *creates* the path dependence *towards* higher trust.
      *   **Coalition Undermining:** This is a *political consequence* often *driven by* the norm-eroding effects of means-testing (creating resentment among payers, weakening broad support). The trust-building dynamic is the *underlying mechanism* causing that political effect.

  4.  **Sharpening the Concept - Key Parameters & Edges:**
      *   **Universality vs. Selectivity:** The clearest differentiator. Universality (everyone in, everyone benefits) is the primary engine for norm-building by creating shared identity and reducing perceived free-riding *opportunities*.
      *   **Visibility & Predictability:** Policies where compliance/benefit is easily observable ("My neighbor gets the child benefit too," "Taxes are deducted at source") reinforce norms faster than opaque systems. Means-testing often requires intrusive checks, making non-compliance *more* visible and resentment *more* salient.
      *   **Time Horizon:** The *core* mechanism (positive feedback loop building norms) is distinct. However, the *feasibility* hinges on the time parameter matching political/social patience. The slow build *is* intrinsic to the mechanism, but whether a society tolerates that slowness is a separate (though critical) political constraint.
      *   **Fairness Perception:** Crucial for both. A trust-*using* policy collapses if perceived as unfair. A trust-*building* policy *requires* a design perceived as fundamentally fair (universality is key here) to initiate the positive loop.

  5.  **Testing Your Cases:**
      *   **Case 1 (Trust for Recipients, Erosion for Payers):** This is **the same core phenomenon (norm feedback loop), but operating *asymmetrically* across groups.** The policy design creates different expectations and experiences for different segments.
          *   *Recipients:* Experience inclusion, predictable support, reduced desperation – potentially building trust *within their group* and *towards the specific program*. This *could* generalize slowly.
          *   *Payers:* Experience the cost, may perceive (rightly or wrongly) unfairness or exploitation if the policy is selective or compliance seems low. This erodes their trust *in the program* and potentially *in recipients/the state*. **It's not the opposite; it's the trust-building mechanism failing to engage (or actively alienating) one group due to design.** Means-testing is a prime example.
      *   **Case 2 (Slow Build, Generational Payoff):** This **still counts as the distinct trust-building mechanism.** The core positive feedback loop is present. The problem of the initial generation not seeing the payoff is a **separate challenge of political sustainability and time inconsistency in democratic systems.** It highlights a critical *constraint* on implementing trust-building policies (the need for long-term commitment), but doesn't negate the distinctiveness of the mechanism itself. It's about the *interface* between the slow social mechanism and the faster political cycle.

  **Conclusion:**

  Yes, the distinction is real and significant. It's not merely "trust-using with a time axis"; it's fundamentally different feedback dynamics initiated by institutional design:

  1.  **Trust-Using Policies:** Require high initial trust (stock). Operate via negative feedback in low-trust settings (erosion).
  2.  **Trust-Building Policies:** Designed to function with lower initial trust. Operate via positive feedback to build trust/norms (cultivation) over time.

  The core concept is **"norm-generating institutional design"** or **"institutions that bootstrap cooperative equilibria."** Its essence is designing policies that, through features like universality, visibility, and perceived fairness, create self-reinforcing expectations of compliance and reciprocity, gradually shifting societal norms even where initial trust is low. The slow time horizon and potential for asymmetrical effects are inherent complexities, not negations of the core distinction.
