prompt: |-
  I have been reading Simone Weil's argument for abolishing political parties — the part where she says, roughly, that a party is a collective that exerts on the minds of its own members a pressure nobody has decided on and nobody is answerable for. The mechanism keeps turning up somewhere she does not seem to have had in view, and I want to know whether it has a name.

  Two cases. (1) A volunteer tenants' association: officers rotate annually, nobody draws a salary, nobody has a career to build. It achieved the thing it was formed to achieve and did not dissolve; it produced further campaigns. Questioning a tactic now draws the coldness that used to be reserved for questioning the aim, while questioning the aim is treated as a private matter. Individual members' stated reasons for each new campaign track the group's current line, and when the line changes the reasons change with it, without any sense of reversal. (2) A small learned society whose positions drift toward whatever most sharply distinguishes it from a neighbouring society it agrees with on nearly everything: the shared theses drop out of its self-description, and the differentiating ones become the ones it is most certain of.

  What I am after is narrower than "organizations drift from their purposes," and it is not, I think, the iron law of oligarchy, or goal displacement, or mission creep, or groupthink: there is no oligarchy, no one seems cynical, the mission is never formally revised, and deliberation can be vigorous, sincere and well-informed. Is there an established concept for a group whose doctrines come to be selected for their usefulness in holding the group together and marking it off from its nearest rivals — members' beliefs following the group rather than the reverse — and for the fact that no individual is the author of the result? If there is no such concept, name and define one. Either way I want the carving rather than the label: the mechanism; how it differs from each of the nearby established notions; whether Weil's heavier apparatus (a collective that generates positions no member individually holds and for which no one is responsible) is really needed, or whether a thinner story about membership sorting, the costs of exit, and the need to justify continued association suffices; and what shape of organization would be immune to it, so that the phenomenon has edges.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're referring to Simone Weil's argument against political parties, specifically the idea that parties create collective pressure on members without anyone being responsible. The user has observed this mechanism in two other contexts: a tenants' association and a learned society. They want to know if there's a named concept for this phenomenon and if not, to define one. They also want a detailed analysis of the mechanism, how it differs from similar concepts, and what organizational structures might resist it.

  First, I need to recall Weil's core argument. She says parties become machines that prioritize self-preservation over truth, creating a pressure that distorts individual judgment. The user's examples show similar dynamics in non-political groups. The tenants' association continues campaigns after achieving its goal, and members align their reasons with the group's shifting positions without feeling inconsistency. The learned society defines itself by opposition to a similar group, amplifying minor differences. 

  The user emphasizes that this isn't about oligarchy or mission creep because there are no cynical leaders, no formal mission changes, and deliberation seems sincere. So, the key elements are: the group's cohesion becomes the unspoken selector for doctrines, members' beliefs adapt without conscious reversal, and no individual controls this process. 

  Next, I should check existing concepts. Groupthink involves suppressing dissent for harmony, but here deliberation is vigorous. Confirmation bias is individual, not group-based. Institutional isomorphism is about external conformity, not internal dynamics. Symbolic differentiation focuses on identity markers, but the user's cases involve belief systems adapting. So existing terms don't quite fit. 

  The user might be looking for a term that captures the self-reinforcing mechanism where the group's existence shapes its beliefs, independent of individual intentions. "Autopoietic cohesion" comes to mind—autopoiesis means self-creating, and cohesion ties it to group unity. This emphasizes the system's self-perpetuating nature. 

  Analyzing the mechanism: in both examples, the group's survival becomes an implicit goal. For the tenants' association, after initial success, campaigning maintains purpose and membership. Questioning tactics or aims threatens cohesion, so the group enforces conformity subtly. Members adjust their reasons post-hoc, avoiding cognitive dissonance. The learned society's identity hinges on differentiating from a rival, leading to belief drift where shared truths fade, and differences amplify. 

  Deeper needs: the user might be exploring how voluntary groups can become ideological echo chambers without centralized control. They might also be interested in designing organizations resistant to such drift, or understanding how collective action without parties can still fall into similar traps. Their mention of "carving over labeling" suggests they want a clear conceptual framework to analyze similar phenomena. 

  Comparing to Weil: her emphasis on collective pressure creating unaccountable positions fits, but the user wonders if a thinner explanation—membership sorting, exit costs, justifying association—suffices. In the tenants' group, exit costs are low, but social bonds and sunk costs (time, relationships) create inertia. Sorting might occur, but the belief adaptation seems more fluid than selective recruitment. Justifying continued involvement leads to post-hoc rationalization, aligning beliefs with group actions. So both mechanisms play roles. 

  Immunity factors: Organizations with built-in dissolution clauses, like a sunset provision, could prevent perpetuation beyond goals. Rotating external evaluators might introduce objectivity. Encouraging cross-membership with rivals could reduce oppositional identity. Epistemic humility rituals, like revisiting foundational aims, might help. But these groups' small size and voluntary nature make formal structures challenging. The core immunity might lie in prioritizing truth-seeking over cohesion, explicitly valuing dissent, and defining identity by core values rather than opposition. 

  In conclusion, "autopoietic cohesion" captures the self-sustaining belief adaptation driven by group unity needs. It differs from similar concepts by its focus on doctrine selection for cohesion, member belief fluidity, and emergent responsibility. Weil's framework is useful, but thinner mechanisms like exit costs and justification also contribute. Immune organizations would structurally subordinate cohesion to truth or aims, embracing planned dissolution when purposes are fulfilled.
answer: |-
  Your observation captures a profound and under-theorized social mechanism. While no single established term perfectly encapsulates this phenomenon, we can define it as **Autopoietic Cohesion** and distinguish it from adjacent concepts with precision. Here's the conceptual carving:

  ### The Mechanism: Autopoietic Cohesion
  **Definition:** *The self-perpetuating process by which a group's doctrines, priorities, and identity gradually adapt to serve the latent function of maintaining internal cohesion and external differentiation, independent of its original mission or individual members' intentions. Beliefs become selected for their utility in binding the group together and marking its boundaries, leading members to unconsciously align their stated reasons with the group's evolving position without experiencing cognitive dissonance.*

  ### Key Features & Differentiation:
  1.  **Non-Oligarchic & Sincere:** Unlike Michels' "Iron Law" or goal displacement, there's no cynical elite manipulating the group. Deliberation remains sincere, and power may be diffuse (e.g., rotating volunteers).
  2.  **Beyond Groupthink:** Groupthink suppresses dissent for harmony under stress. Autopoietic Cohesion operates *through* sincere deliberation; dissent is permissible on tactics, but the *unspoken imperative* to preserve group identity subtly shapes which beliefs gain traction. The "coldness" towards tactic-questioners signals boundary enforcement, not just harmony-seeking.
  3.  **Distinct from Mission Creep:** Mission creep involves *explicitly* adding new goals. Here, the original mission may be rhetorically unchanged, but the *meaning* of membership shifts. The group's *existence itself* becomes the latent mission. The tenants' association didn't adopt a *new* cause; its *identity* became tied to perpetual campaigning.
  4.  **Not Mere Confirmation Bias:** While individuals exhibit confirmation bias, Autopoietic Cohesion is a *systemic* phenomenon. The group becomes an "epistemic environment" where beliefs reinforcing cohesion/differentiation are rewarded (socially, emotionally) and alternatives fade without conscious suppression.
  5.  **Beyond Symbolic Differentiation:** While the learned society case involves differentiation, it's not just adopting arbitrary symbols. The mechanism *selects and amplifies doctrinal differences*, making them central to group certainty while downplaying shared foundations. The differentiation is belief-based and identity-constitutive.

  ### Why Weil's Apparatus is (Mostly) Necessary
  Weil's insight about the collective generating unowned positions is crucial here. A "thin" explanation (sorting, exit costs, justification) falls short:

  *   **Sorting:** While some self-selection occurs, your examples emphasize members *adapting* their reasons fluidly. It's not just attracting like-minded people; it's the *current* group reshaping members' expressed beliefs.
  *   **Exit Costs:** In voluntary groups (like your examples), formal exit costs are low. The costs are *social and identity-based*: losing community, shared history, and the cognitive dissonance of abandoning past justifications.
  *   **Justifying Association:** This is *part* of it, but insufficient. Members aren't just justifying *why they stay*; they are reconstructing their *reasons for the group's actions and beliefs* to align with the emergent group identity. The "private matter" treatment of questioning the original aim shows the group identity has superseded the founding purpose.

  **Weil's "heavier apparatus" is essential because:** The pressure arises *from the collective entity itself* as a social fact. No individual intends the doctrinal drift towards cohesion/differentiation, yet the group, as a system, produces it. Members experience this as "the way we are" or "what we do," not as an individual's agenda. The "coldness" is a diffuse social sanction emanating from the group-as-entity, not a specific person. The lack of "sense of reversal" highlights the emergent, unowned nature of the shift.

  ### Immunity: Edges of the Phenomenon
  An organization would be immune to Autopoietic Cohesion only if it possesses structural features that rigorously subordinate group cohesion to its core purpose and external reality:

  1.  **Built-in Sunset/Reconstitution Clauses:** Mandatory dissolution or fundamental re-founding upon achieving the core goal (preventing the tenants' association trap).
  2.  **Radical Epistemic Anchoring:** Formal mechanisms binding the group to external verification or truth-seeking *above* internal consensus. Examples:
      *   **Structured Adversarialism:** Mandated internal "devil's advocates" with rotating, empowered roles *required* to challenge core assumptions using shared evidence.
      *   **External Reality Checks:** Regular, binding consultation with genuinely independent external bodies or defined objective metrics that override internal doctrinal preferences.
      *   **Identity Decoupled from Opposition:** Explicit rituals/discourse affirming shared foundations with "rivals" (for the learned society) and defining identity *positively* by core values/methods, not *negatively* by differentiation.
  3.  **Normalized Exit & Re-entry:** Cultural and structural practices making departure for principled reasons honorable and return possible without stigma, reducing identity-based inertia.
  4.  **Epistemic Humility Rituals:** Regular, structured revisiting of founding aims and assumptions, requiring explicit justification for continuance *against* those aims.

  ### Conclusion
  Autopoietic Cohesion describes the process you've astutely identified: the self-reinforcing drift where a group's beliefs adapt primarily to serve its own cohesion and boundary maintenance, becoming disconnected from original purposes and individual authorship. While mechanisms like justification and sunk costs contribute, Weil's insight into the emergent, unowned nature of the collective pressure is fundamental to explaining the *lack of reversal* and the *diffuse responsibility*. Organizations immune to this are exceedingly rare, requiring structures that actively combat the natural tendency of groups to prioritize their own existence and identity over their stated mission or external truth. The phenomenon's edges are sharply defined by the presence or absence of mechanisms that forcibly tether the group to an external purpose or reality, breaking the autopoietic loop.
