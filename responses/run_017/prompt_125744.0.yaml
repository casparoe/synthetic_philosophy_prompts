  Looking at their argument structure, step (3) describes a cleverly designed foraging scenario where a detector state D is triggered by either A-items or B-items that always co-occur. This creates perfect correlation between various candidate contents. Step (4) correctly notes that multiple conditions satisfy the explanatory condition - 'A present', 'B present', 'A or B present', and 'nutritious item present' all seem to equally explain the benefit of approaching.

  The symmetry lemma in (5) is well-observed - standard tie-breakers like specificity or normal conditions don't resolve this. Then in (6)-(7) they generalize this to ordinary perception, showing how we can construct disjunctive rivals like C* that are co-extensive with ordinary contents under actual conditions.

