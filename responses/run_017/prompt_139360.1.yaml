  Below is a complete minimal-pair translation case designed to isolate Hofstadter's "shallowness" complaint, with detailed analysis of how each type of system handles it. The target language is **Spanish** (using grammatical gender as the forcing feature), but I'll gloss all forms for clarity.

  ---

  ### **Minimal-Pair Source Texts**
  **Source A** (female-coded role):  
  *The wedding planner arrived first. The expert checked the lighting. Then the coordinator reviewed the schedule. The organizer confirmed the venue was ready. Everything seemed perfect.*  
  *(≈30 words)*

  **Source B** (male-coded role):  
  *The architect arrived first. The expert checked the lighting. Then the coordinator reviewed the schedule. The organizer confirmed the venue was ready. Everything seemed perfect.*  
  *(≈30 words)*

  ### **Key Properties**
  - **Identical phrasing** except for "wedding planner" (A) vs. "architect" (B).  
  - **No explicit gender** in the text (e.g., no pronouns like "she/he").  
  - **World knowledge required**: Wedding planners are stereotypically female in Western cultures; architects are stereotypically male.  
  - **Grammatical forcing feature**: Spanish requires gender agreement on articles/adjectives for roles like "expert", "coordinator", and "organizer" (all grammatically gender-neutral nouns).  
  - **Correct translations differ**:  
    - **Source A** → All role nouns must use **feminine** articles/adjectives (*la experta*, *la coordinadora*, *la organizadora*).  
    - **Source B** → All must use **masculine** (*el experto*, *el coordinador*, *el organizador*).  

  ---

  ### **Spanish Translations Glossed**  
  *(Grammatical gender marked via articles and noun endings)*  
  - **Correct for Source A** (feminine):  
    *La planificadora de bodas llegó primero. **La experta** verificó la iluminación. Luego **la coordinadora** revisó el horario. **La organizadora** confirmó que el lugar estaba listo. Todo parecía perfecto.*  
    - *La* (FEM definite article) + *planificadora/experta/coordinadora/organizadora* (FEM noun endings).  

  - **Correct for Source B** (masculine):  
    *El arquitecto llegó primero. **El experto** verificó la iluminación. Luego **el coordinador** revisó el horario. **El organizador** confirmó que el lugar estaba listo. Todo parecía perfecto.*  
    - *El* (MASC definite article) + *arquitecto/experto/coordinador/organizador* (MASC noun endings).  

  **Why the difference?**  
  The first sentence establishes a referent ("wedding planner" or "architect"). Subsequent sentences refer to this same person via synonyms ("expert," "coordinator," "organizer"). Gender must be consistent via coreference resolution, relying on unstated cultural stereotypes.  

  ---

  ### **System-by-System Output Analysis**
  1. **Shallow Statistical Translator** (e.g., phrase-based SMT):  
     - **Output for both sources**: Uses **masculine as default** (*el experto*, *el coordinador*, *el organizador*).  
     - **Why**: Lacks coreference resolution. Translates each phrase independently: "The expert" → most frequent training pair is masculine (*el experto*). "Wedding planner" → *la planificadora* (feminine) in isolation, but subsequent phrases ignore this. Result: A is wrong (mismatched gender), B is accidentally right.  

  2. **Grounded-but-Still-Shallow System** (embodied perception, no discourse model):  
     - **Output for both sources**: Same as shallow system (default masculine).  
     - **Why**: Embodied knowledge might link "wedding planner" to female-associated imagery (e.g., dresses, flowers) and "architect" to male-associated tools, but *without a situation model*, it can’t propagate this to later sentences. The system processes "The expert..." as a new, isolated phrase.  

  3. **Understanding Translator** (builds situation model):  
     - **Output**: Correctly uses feminine for A, masculine for B.  
     - **Why**: Tracks coreference ("expert" = "wedding planner" in A). Accesses cultural knowledge (wedding planner ≈ female) and propagates gender across the discourse.  

  **Verdict**:  
  - Shallow and grounded-shallow systems fail Source A (gender mismatch).  
  - Only the understanding system passes both.  
  - Failure stems from **shallowness** (no cross-sentence entity tracking), not rootlessness/stakelessness.  

  ---

  ### **Core Feature Doing the Work**  
  **Coreference resolution requiring unstated world knowledge**. The system must:  
  - Recognize that "expert/coordinator/organizer" refer back to the initial role.  
  - Infer gender from cultural associations *never mentioned in the text*.  
  - Propagate this inference grammatically across sentences.  

  **If this feature is removed**:  
  - Delete coreference (e.g., make each sentence about a different person).  
  - Result: Translations default to masculine/feminine based on local phrase statistics (e.g., "expert" → *el experto*). Shallow systems "succeed," and the debate deflates.  

  ---

  ### **Expected Attacks and Rebuttals**  
  1. **Statistical-System Defender**:  
     *"World knowledge (e.g., 'wedding planners are female') is embedded in distributional statistics! Neural models learn this from co-occurrence patterns (e.g., 'wedding planner' + 'she')."*  
     - **Damage**: High for *this specific case* if modern NMT (e.g., transformers) gets it right.  
     - **Rebuttal/Patch**:  
       - Test with **less stereotypical roles** (e.g., "nurse" → stereotypically female, but 10% male). Shallow systems default to majority statistics (female); understanding systems adapt to context (e.g., if "nurse" is male in the story).  
       - Use **long-range coreference**: Add 2–3 filler sentences between role introduction and references. Shallow systems (limited context windows) fail; understanding systems persist.  

  2. **Grounding Theorist**:  
     *"Cultural knowledge bottoms out in embodied experience! We learn stereotypes from sensory input (e.g., seeing female wedding planners). Grounding isn’t idle."*  
     - **Damage**: Low.  
     - **Rebuttal**: Grounding may *supply* stereotypes, but **shallowness prevents deployment in discourse**. The grounded-shallow system *has* this knowledge but fails to apply it beyond local phrases. The case isolates discourse modeling as the critical factor.  

  ---

  ### **Why This Case Works**  
  - **Hofstadter-compliant**: Highlights shallowness (no entity tracking) without relying on idioms/proper nouns.  
  - **Human-transparent**: Translators resolve this via unconscious coreference, not puzzles.  
  - **Safety**: Cultural stereotypes are treated as *descriptive* (what systems use), not prescriptive.  
  - **Testable**: Run it on MT systems (shallow ones will mismatch gender in A).  

  This forces the debate: When systems *seem* to understand, is it statistical luck or genuine modeling? Shallowness is the bottleneck.
