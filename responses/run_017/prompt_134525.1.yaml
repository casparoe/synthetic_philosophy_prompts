prompt: |-
  Ned Block's distinction between phenomenal and access consciousness is usually paired with the verdict that global workspace theory — Baars's original version, and its neural successor, the global neuronal workspace of Dehaene and colleagues, with ignition and broadcast to consumer systems — is a theory of the second and not the first. I want the structural reason why that verdict is harder to secure than it looks. Please work with two distinctions I'll stipulate, because the standard discussion runs them together:

  Call *presence* the bare fact that there is something it is like for a subject with respect to a content, and *richness* the amount of determinate detail that experience carries. Call *broadcast-access* a content's being globally available to arbitrary downstream consumer systems (deliberate reasoning, action selection, memory), and *report-access* its being available specifically to whatever mechanism produces verbal or non-verbal report. The two access notions can in principle come apart, and so can presence and richness.

  That yields two possible dissociation findings:

  Overflow, properly described: phenomenal richness outruns what gets broadcast — the Sperling-style partial-report cases, where subjects seem to experience more of the array than they can bring to bear on any one downstream task.
  Hollow ignition: the complete neural and behavioral profile of broadcast and report — widespread ignition, sustained prefrontal involvement, confident and accurate reporting — together with no presence at all.

  Explain why the first, even granting the strongest reading of it available, would not by itself threaten global workspace theory as a theory of phenomenal consciousness, while the second would; and explain why the second is nevertheless not a straightforward empirical refutation, given that every route we have to presence in another subject — report, deliberate action, neural signature — runs through broadcast. If the two findings cannot be settled by the same kind of evidence, say what that implies about whether the claim that global workspace theory is only about access is an empirical claim, a conceptual one, or something else. Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restatement of the question. Please answer in American English.
reasoning: |-
  Okay, let me work through this user's query about Ned Block's consciousness distinctions and global workspace theory. The user wants two key points explained: why overflow doesn't threaten GWT as a theory of phenomenal consciousness, and why hollow ignition would - but also why hollow ignition isn't a straightforward refutation. 

  First, I need to unpack the user's carefully defined terms. They've separated presence (the "what it's like" aspect) from richness (detail level), and broadcast-access (global availability) from report-access (verbal/nonverbal reporting). This precision matters because standard discussions often blur these lines.

  For overflow cases like Sperling: Even if subjects experience more richness than they can broadcast, this doesn't challenge GWT's claim about presence since the theory could still require broadcast for minimal conscious experience (presence) while allowing richness to exceed what's broadcasted. 

  Hollow ignition is trickier: If broadcast happens without any presence, that directly contradicts GWT's core claim that broadcast equals consciousness. But here's the catch - all our evidence for presence in others relies on broadcast-dependent measures (reports, neural signatures). So we can never conclusively demonstrate hollow ignition exists - it's always possible the subject did have presence but our measurement failed. 

  This leads to the deeper point: The assertion that GWT only explains access consciousness isn't purely empirical, since hollow ignition can't be proven. Nor is it purely conceptual, because overflow findings do constrain the theory. It's actually a methodological stance about what counts as valid evidence - GWT proponents treat report-access as the operational definition of consciousness, making the theory immune to certain challenges by design.

  The user seems deeply familiar with this philosophy of mind debate, likely an academic or grad student. Their structured approach suggests they want clarity on why GWT remains standing despite apparent counterevidence. There might be frustration with how these theories avoid falsification - I should acknowledge that tension while showing why the problem is inherent to consciousness studies.
answer: |-
  The verdict that Global Workspace Theory (GWT) explains access but not phenomenal consciousness is harder to secure than it looks because "hollow ignition" (broadcast without presence) is empirically undetectable given our reliance on broadcast-dependent evidence for presence, while Sperling-style "overflow" (richness exceeding broadcast) doesn't challenge GWT's core claim about presence.

  Overflow findings don't threaten GWT as a theory of *phenomenal presence* because GWT can consistently hold that minimal presence requires broadcast-access, while allowing that the *richness* of that presence can exceed what is simultaneously broadcast or reported. In Sperling's experiment, subjects have broadcast-access to the *presence* of the array as a whole (enabling their report that they saw all the letters) even if the broadcastable *richness* (the specific identities of more than ~4 letters) is limited. GWT can argue that phenomenal presence requires *some* global availability, which is satisfied for the gist of the array, even if fine-grained detail richness isn't fully broadcastable all at once.

  Hollow ignition *would* threaten GWT as a theory of phenomenal consciousness because it posits that broadcast-access (ignition plus sustained global availability) is both necessary and sufficient for presence. If a content undergoes full ignition and broadcast—driving accurate reports, deliberate actions, and sustained prefrontal activity—yet there is *no* "something it's like" for the subject (no presence), GWT would be falsified. Sufficiency is key: GWT claims ignition *is* conscious experience.

  However, hollow ignition is not a straightforward empirical refutation because *all* evidence for presence in another subject depends on broadcast-access. If a subject reports presence, acts on the content, and shows the neural signatures of broadcast, we *infer* presence. But if GWT is false, and broadcast can occur without presence (hollow ignition), we'd have no way to detect this absence. The subject would still report presence sincerely (due to report-access), act appropriately, and show identical neural ignition—leaving no empirical marker to distinguish hollow ignition from genuine presence. We cannot access another's subjective presence except through broadcast-mediated outputs.

  Since hollow ignition is undetectable (as it mimics genuine presence behaviorally and neurally) while overflow is detectable (via partial-report superiority), the claim that GWT is solely about access is **neither a straightforward empirical nor a purely conceptual claim**. It is a **methodological stance**: GWT proponents treat report-access (via verbal or non-verbal report) as the *operational criterion* for consciousness in scientific practice. This stance renders GWT immune to falsification by hollow ignition (which is empirically invisible) and allows it to accommodate overflow (by distinguishing richness from presence). Thus, the distinction rests on what counts as valid evidence, making it a claim about the epistemology of consciousness science rather than a directly testable empirical hypothesis or a logical truth.
