answer: |-
  As a deflationist, I accept your characterization: the disputants agree on all semantic facts and translation manuals but still disagree about which language to adopt based on theoretical virtues like simplicity or naturalness. This residue is real, but it doesn’t transform the dispute into a substantive ontological one. Here’s why.  

  The disagreement over theoretical virtues is a pragmatic evaluation of linguistic frameworks, not a disagreement about what *fundamentally exists*. When the universalist advocates for their language as "more natural," they express a normative stance toward conceptual tools—comparable to preferring a metric system over imperial units for scientific work. This stance isn’t truth-apt in the way ontological claims are; it’s an endorsement of a framework’s utility, grounded in goals like explanatory efficiency or cognitive ease. Crucially, neither party is committed to the *metaphysical incorrectness* of the other’s ontology. They agree that both languages coherently describe the same world—one using composite objects as useful posits, the other avoiding them—but differ only in which descriptive toolkit they recommend.  

  You worry this collapses into self-defeat, but it doesn’t. Disputes about theoretical virtues *can* be substantive when they involve empirical or logical constraints (e.g., which framework best predicts observations). Yet here, the virtues in question—like "naturalness"—are themselves pragmatic: they reflect human interests, not mind-independent joints in reality. To call this disagreement "verbal" would indeed be paradoxical, but I don’t call it that. It’s a substantive *pragmatic* disagreement, which survives precisely because it isn’t ontological. The original dispute *was* verbal because it mistook pragmatic preferences for existential truths. What remains is a debate about language choice—a question of engineering, not metaphysics.  

