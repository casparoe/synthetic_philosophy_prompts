prompt: |-
  I work on cost-benefit analysis for a government agency (econ background, basically no philosophy) and I keep running into something that feels like a contradiction in what we actually do. I'd like to know what we're committed to by doing it.

  Here's the practice. When we appraise a project we monetise everything. For stuff with markets we back the numbers out of behaviour: the value of a statistical life comes from the extra pay workers demand to take risky jobs, the value of clean air from what people pay for houses in less polluted neighbourhoods. For stuff with no market — a wetland, a species, a view — we can't do that, so we run surveys: describe the good carefully, remind people of their budget, then ask how much they'd pay in extra taxes to protect it, yes/no referendum style. Two more bits. First, we throw some answers out: people who are obviously answering strategically, people who are expressing a general warm feeling about the environment rather than about the specific good, people who name a number they plainly couldn't afford. Second, we use willingness to pay rather than willingness to accept compensation for the loss, even though for small changes those are supposed to come to roughly the same thing — and we prefer the one that gives the smaller number.

  So here's what puzzles me. The line I was taught is that utility isn't a thing inside your head, it's just a summary of your choices: nothing over and above what behaviour reveals. But the survey half of what we do behaves as if utility were a hidden quantity that behaviour and survey answers are both noisy evidence for, which is why we can clean the noise out, discard the answers that dont track it, and calibrate surveys against market behaviour. And then we discard some behaviour too: we dont count choices made in ignorance or under panic, and we'd never build an appraisal out of lab results showing people choose differently between two equivalent framings of the same gamble.

  So: what does the practice, taken as a whole, actually presuppose utility to be? Is it strictly committed to one answer, or could several different theories of what utility means license exactly the same thing we do? I'd like you to separate what the practice strictly presupposes from what it merely fits comfortably with, and to say where it's genuinely underdetermined.

  Two follow-ups if you have room.

  A colleague has proposed fixing the mess by routing every non-market valuation through a citizens' assembly: small group, gets briefing materials, hears both sides, deliberates for a weekend, and only its post-deliberation vote counts as the preference. Call it laundering. What does that proposal presuppose about preferences and about utility that the current method doesn't, and would it make the package more coherent or just add a second inconsistent layer on top?

  And the bit that bugs me most: willingness to pay scales with ability to pay, so benefits to poor people come out smaller and benefits to rich people come out larger. We do nothing about that in environmental appraisal, but in the health side of the same government the equivalent calculation counts a health gain the same whoever gets it. Is that an inconsistency the practice cant survive, or does it just show that willingness to pay is doing something other than measuring utility — standing in for opportunity cost in money terms, say? And what would have to change in the appraisal if we took the rival reading seriously?
reasoning: |-
  Okay, let me unpack this user's query. They work in cost-benefit analysis for a government agency and are grappling with what seems like a contradiction in their methodology. Specifically, they monetize everything: using revealed preference for market goods and stated preference surveys for non-market goods. But they clean the data by discarding certain responses and prefer willingness to pay (WTP) over willingness to accept (WTA). This mix of approaches puzzles them because while they were taught utility is just a summary of choices, their practice treats it like a hidden variable that can be measured imperfectly through behavior and surveys.

  First, I need to understand their core confusion. They mention a tension between revealed preference theory (utility as solely derived from choices) and their practice of treating utility as something measurable that requires filtering noise. They want to know what their methods presuppose about utility and if alternative theories could justify the same practices. 

  Breaking down their methods: revealed preference for market goods assumes choices reveal stable preferences. But they discard choices made in ignorance or panic, which already implies that not all behavior reflects "true" preferences. Stated preference surveys try to capture values for non-market goods but are adjusted by removing strategic answers or implausible WTP. This suggests they believe in latent preferences that aren't always perfectly revealed. So their practice leans towards a latent preference view, where utility is an underlying state that behaviors approximate.

  The user also asks about two follow-ups. The first is their colleague's proposal for a citizens' assembly to "launder" preferences through deliberation. This would shift from individual to group preferences, presupposing that preferences can be formed or refined through informed discussion, moving beyond mere aggregation of existing preferences. It adds a layer of deliberation, which might cohere with a constructivist view of preferences but could conflict with the individualistic basis of current methods.

  The second issue is the equity concern: WTP scales with income, so benefits to the poor are valued less. In health appraisals, however, health gains are counted equally regardless of who benefits. This inconsistency highlights that CBA using WTP isn't measuring utility per se but rather individual economic valuations constrained by income. The health approach might imply a social welfare function that values health intrinsically. The user wonders if this is a fatal flaw or if WTP serves a different purpose, like measuring opportunity cost. Addressing this might require distributional weights or separate equity analyses, but their agency currently doesn't do that.

  To answer their main question, their practice presupposes that utility is a latent variable imperfectly revealed by behavior and surveys. It's not strictly committed to one theory but fits best with latent preference with epistemic constraints. The citizens' assembly proposal introduces deliberative democracy elements, which might align better with constructivist views but clash with individualism. The equity issue points to a deeper tension between efficiency and equity, showing that WTP isn't a pure utility measure but reflects ability to pay. Resolving this might involve explicit equity adjustments, but that's a policy choice.

  The user likely needs clarity on whether their methods are theoretically coherent and how to handle the equity problem. They might also be looking for ways to justify or reform their current practices. Their background in economics without philosophy means they need explanations that bridge theory and practical application without jargon. They might be concerned about the ethical implications of their work, especially regarding how valuation disadvantages the poor.
answer: |-
  Your practice reveals a fascinating tension between economic theory and applied welfare economics. Let's dissect what your methodology presupposes about utility, then address your follow-ups.

  ### Core Practice: What Utility *Must* Be
  Your methodology isn't strictly committed to a single theory, but it imposes strong constraints:

  1.  **Utility is Latent & Cardinal (at least ordinally interpersonally comparable):**
      *   **Latent:** You presuppose preferences *exist* independently of momentary choices/statements ("true preferences"). Choices and survey responses are noisy *indicators* of this underlying state. Discarding "bad" responses (strategic, uninformed, incoherent) assumes you can identify noise corrupting the signal of true preference.
      *   **Cardinal & Comparable:** Monetization requires assigning *numerical values* (dollars) to utility changes. Aggregating individual WTP/WTA into a social net benefit implies these dollar values represent *comparable magnitudes* of utility change across people. You treat $1 of WTP from person A as representing the *same magnitude of utility loss* as $1 of WTP from person B, enabling summation. This is a strong cardinal/measurable utility assumption.

  2.  **Preferences are Stable, Context-Independent, and Discoverable:**
      *   Calibrating surveys against market behavior assumes preferences revealed in different contexts (job choice, housing purchase, survey response) reflect the *same underlying structure*.
      *   Filtering out "panic" or "ignorant" market choices and "warm glow" survey responses implies a belief in core, stable preferences unaffected by transient states or framing.

  3.  **Utility is Defined by "Rational" Preference Satisfaction:**
      *   Discarding choices made under duress, ignorance, or incoherent survey responses presupposes a normative ideal of "rational" preference – informed, consistent, and reflective of the individual's *considered* well-being. You're not valuing *any* expressed want, but a filtered subset deemed "authentic" or "rational."

  4.  **WTP is the Preferred Metric (for pragmatic & theoretical reasons):**
      *   **Pragmatic:** WTP is often easier to measure empirically and avoids the "embedding effect" and potential infinity problems of WTA.
      *   **Theoretical (Kaldor-Hicks):** Using the *smaller* number (WTP for gains, WTA for losses) aligns with potential compensation tests. A project passes Kaldor-Hicks if gainers *could* compensate losers (using WTA as the losers' valuation makes compensation harder to achieve, WTP makes it easier). Preferring the smaller number makes the test *stricter* for passing projects.

  **What it's *not* strictly committed to:**
  *   **Pure Revealed Preference (Samuelson):** You explicitly reject this. Revealed preference says *only* actual choices reveal preferences; all else is meaningless. Your surveys and filtering blatantly contradict this.
  *   **Hedonic Utilitarianism (Utility as Pleasure/Pain):** You don't presuppose utility is a specific mental state. It's defined operationally through (filtered) preference expression.
  *   **Perfect Information/Processing:** You acknowledge humans are imperfect, hence the need for filtering and deliberation-like processes (briefing materials, budget reminders).

  **Underdetermination:**
  *   **The *ontology* of utility:** Is it a brain state? A disposition? A normative ideal? Your practice is consistent with several views (e.g., latent preference satisfaction, informed desire fulfillment) but doesn't *require* a specific metaphysical answer. It focuses on *epistemology*: how we best *measure* it.
  *   **The source of "rationality":** Why are filtered preferences "better"? Is it epistemic (truer to latent desires) or normative (more conducive to well-being)? Practice leans epistemic but hints at normative.

  ### Follow-Up A: The Citizens' Assembly ("Laundering")
  This proposal shifts the foundation significantly:

  1.  **Presupposes Preferences are Malleable & Constructed:** It rejects the idea that individuals *already possess* stable, discoverable preferences for complex non-market goods. Preferences are formed through deliberation, information, and social interaction.
  2.  **Shifts from Individual to Group Sovereignty:** The "preference" that counts isn't the individual's latent state or pre-deliberation vote, but the *group's* collective judgment *after* deliberation. This presupposes group deliberation yields a superior (more "rational," informed, or legitimate) valuation than aggregating individual pre-deliberation preferences.
  3.  **Utility as Socially Constructed Value:** Value isn't solely located within the individual's head; it's co-created through discourse. The "utility" measured is the group's assessment of *social value*, not the sum of individual utilities.
  4.  **Potential for Coherence/Incoherence:**
      *   **More Coherent?** It directly addresses the "constructed preference" critique of standard surveys. If non-market goods require complex understanding, deliberation creates more meaningful valuations. It aligns better with the filtering you *already do* (removing uninformed/strategic responses) by building informedness into the *process*.
      *   **Less Coherent?** It fundamentally clashes with the *individualistic welfarism* underpinning standard CBA. Aggregating individual WTP is replaced by a single group WTP. It abandons the link to *individual* opportunity cost (sacrifice). It introduces a layer of political philosophy (deliberative democracy) inconsistent with the Paretian foundations of standard welfare economics. It *adds* a new inconsistency unless you abandon the individual revealed preference part entirely for non-market goods.

  **Verdict:** It makes the non-market valuation part more coherent internally (by embracing constructed preferences) but creates a stark inconsistency with the *individualistic, revealed-preference* foundation of the market-goods half of CBA. It replaces one theory (latent individual preference) with another (socially constructed value via deliberation) for non-market goods.

  ### Follow-Up B: The Equity Problem (WTP vs. Equal Health Valuation)
  This is the deepest tension:

  1.  **The Inconsistency:** Using unweighted WTP for environmental goods while using equal valuation per QALY/DALY in health appraisal *is* a fundamental inconsistency within a welfarist framework.
      *   **WTP CBA:** Implicitly assumes $1 = equal utility loss/gain for anyone (cardinal, comparable utility). Thus, a $1m benefit to a rich person (small utility gain) outweighs a $10k benefit to a poor person (large utility gain) because $1m > $10k. This violates the principle of diminishing marginal utility of income.
      *   **Equal Health Valuation:** Treats a health gain (e.g., 1 QALY) as having *equal social value* regardless of who receives it. This implicitly assumes either a) utility from health is independent of income/context (unlikely), or b) *society* values equity in health distribution, overriding individual WTP.
  2.  **What WTP is Actually Measuring (in this context):** In standard unweighted CBA, WTP *is not measuring pure utility*. It's measuring **individual economic value expressed in monetary terms, constrained by ability to pay.** It's fundamentally about *efficiency* under the *existing income distribution*: maximizing the monetary value of outputs, given willingness *and ability* to pay. Opportunity cost (sacrificing other goods) is captured, but the *magnitude* of that sacrifice depends on income.
  3.  **Can the Practice Survive?** Yes, pragmatically, because:
      *   **Different Policy Domains/Traditions:** Health appraisal often has a stronger explicit equity mandate ("equal worth of every life") embedded in its guidelines than environmental appraisal.
      *   **Pragmatic Separability:** Agencies often separate efficiency (CBA using WTP) from equity (addressed via separate policies like taxes/transfers). CBA answers "does this create net benefits?" not "is the distribution fair?"
      *   **Operational Simplicity:** Weighting WTP by income (1/Marginal Utility of Income) is theoretically sound but practically fraught (estimating utility functions, political resistance).
  4.  **What Would Change if Taken Seriously (Welfarist View):** If you truly believed CBA should maximize *aggregate utility*:
      *   **Distributional Weights:** You would weight individual WTP/WTA by (1 / Marginal Utility of Income). A dollar to a poor person gets a higher weight than a dollar to a rich person. This aligns WTP-based valuation with the health approach *if* health gains are also weighted (which they usually aren't – the health approach is often deontological/equity-based, not welfarist).
      *   **Explicit Social Welfare Function:** CBA would require an explicit function incorporating both efficiency and equity trade-offs (e.g., Atkinson SWF).
      *   **Massive Practical Shift:** Appraisals would require data on income/wealth of affected groups and politically agreed weighting formulas, moving far beyond current practice.

  **The Fundamental Tension:** Your practice reveals that **standard CBA using unweighted WTP is not fundamentally a utilitarian exercise aiming to maximize aggregate utility.** It's a **Kaldor-Hicks efficiency test under the current distribution of income and wealth.** The health appraisal's equal valuation represents a different normative commitment – often a form of **deontological equity** (everyone's health life is equally valuable) or **consequentialist prioritarianism** (giving priority to the worse off, implicitly weighting their health gains more).

  **In Conclusion:** Your practice presupposes utility is a latent, cardinally measurable, and interpersonally comparable state underlying "rational" preferences, imperfectly revealed by behavior and surveys. The citizens' assembly proposal shifts towards socially constructed value, creating coherence for non-market goods but inconsistency with market valuation. The equity inconsistency highlights that unweighted WTP-based CBA prioritizes efficiency over distributional justice, while the health approach often incorporates an explicit equity norm. Resolving this fully would require moving beyond pure efficiency to explicit social welfare maximization incorporating distributional weights – a significant departure from standard government CBA practice. Your agency's methods are a pragmatic blend of latent preference theory, welfarism constrained by operational realities, and Kaldor-Hicks efficiency, revealing the inherent compromises between economic theory and policy application.
