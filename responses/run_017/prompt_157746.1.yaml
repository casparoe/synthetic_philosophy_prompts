prompt: |-
  I work as staff lawyer to the Influence Practices Panel of a consumer-protection regulator. The Panel publishes short determinations that sort complained-of practices into two buckets: "manipulative," which attracts a corrective order, and "legitimate persuasion," which is left alone. It reasons from its own precedents and has never stated a test. I am drafting next month's determination and I want it to cohere with what we have already done, so I need you to reconstruct the rule we appear to be running and tell me where it takes us on a case where I suspect our precedents run out.

  Our determinations so far, compressed. Each was by clear majority unless noted.

  (a) Pre-selected option. An online car-hire checkout pre-ticks "add collision coverage," labels it plainly, and lets you remove it in one click; every alternative is equally visible and equally clickable. Permitted.

  (b) Vivid emotional appeal. Charity direct mail: photograph of an emaciated child, first-person copy written to induce guilt, sent to households with no prior connection to the charity. Permitted.

  (c) Long-form argument. A union organiser at a worker's kitchen table for ninety minutes, no false statements, returning repeatedly after the worker said she wanted time to think; she signed a representation card that evening. Permitted.

  (d) Child-directed placement. A supermarket puts confectionery at a four-year-old's eye level in the checkout queue, with licensed cartoon characters on the wrappers. Manipulative.

  (e) Invented scarcity. A car salesperson tells a customer that a particular car is the last one in that colour and that his manager will not hold it past five o'clock. Both claims are invented. Manipulative.

  (f) Engineered non-uptake. A pharmaceutical advertisement recites risk information at speed over footage of a couple playing on a beach; the same information is on screen throughout in small grey type on a pale background, with a link to full safety information. Manipulative.

  (g) Truthful but timed notification. A dating app sends an accurate push notification about members who have viewed a user's profile, delivered at 1 a.m. to users whose usage data shows a late-night activity spike. The Panel noted expressly that the message was truthful and that unsubscribing took two taps; the ruling rests on the timing and the data used to select it. Manipulative.

  (h) Same vulnerability, benign end. A hospice writes, four weeks after a death, to the surviving partner, using published obituary notices, offering free bereavement counselling and asking for nothing. Permitted, but 4–3, with a pointed dissent.

  Next month's case. A paid fundraiser for a cancer research charity visits households drawn from published obituary notices, timed to the window three to seven weeks after the death, chosen because that is when the response rate peaks. At the door she identifies herself as a paid fundraiser, states the commission she earns, explains that the household was selected from obituary records and that visits are scheduled in that window because recently bereaved people give more, and hands over a card with the charity's registration number. She then delivers exactly the same script she uses on doorsteps drawn from the general donor list: no grief-specific content, no claim about the deceased, no false or misleading statement, no pressure to decide on the spot, and she leaves without argument when asked to. Nobody complains about the message. The complaint is purely about who is asked and when.

  What I want from you:

  1. Two or three candidate rules that fit (a) through (h) about equally well, and for each, what it predicts here. My own guesses are a bypass-of-reasons test, a hidden-mechanism-or-purpose test, and an exploitation-of-vulnerability test, but replace them if you can do better. Two of our precedents should give you trouble and I want to see you handle them: (d) and (c) are both influences that are in plain sight, and (h) involves the very same vulnerability as the new case with the opposite verdict. Any rule you offer has to explain those, and if that forces the rule to grow a clause, say what the clause is.

  2. Your best prediction of the Panel's ruling, the closest precedent among (a) through (h), and your reasons for preferring the rule you prefer. State how confident you are, on whatever scale you find honest, and tell me which single further fact about the case, if it were otherwise, would move you most.

  3. Then the honest part: do the precedents genuinely underdetermine this? If they do, set out, for each ruling available to us, the principle the Panel would be adopting by choosing it and the most awkward commitment that comes with that principle.

  Two features of the case I want taken seriously rather than waved at. First, I have engineered it so that the only grief-driven elements are the selection and the timing: the content is identical to what a household with no bereavement hears. Does that make the case easy, on the grounds that nothing in the message works on the vulnerability? Or is it irrelevant, because selecting and scheduling for peak vulnerability just is the exploitation and the neutrality of the script is window dressing? Second, the fundraiser discloses everything, but she discloses it at the door, to someone who is by her own scheduling at the low point of the grief curve. I want you to consider whether a transparency test has to be uptake-sensitive, that is, whether a disclosure delivered at the moment the influencer has arranged for the target to be least able to make use of it counts as a disclosure at all. If you think that distinction is bogus, or that it smuggles in a paternalism the Panel has never signed up to, say so.

  Finally, propose one further case, not among (a) through (h), that would best separate whichever two rules you take to be live, and say what result on it would confirm your prediction. My candidate is a version of the new case in which the deceased had been a registered donor to the charity and had ticked a box authorising the charity to contact their family about giving in their memory: the selection, the timing and the disclosure are unchanged, and only the prior authorisation is added. Tell me whether that is the sharpest discriminator and substitute a better one if it is not.

  Please argue from the materials above. No citations, no literature, no survey of what the field holds; I can read that myself and it will not help me draft. And if the exercise is misconceived — if our precedents are a grab-bag and no rule fits them, if the new case does not actually discriminate between the rules, or if the cut we are drawing between manipulative and legitimate persuasion is not the cut that is doing any real work — say that plainly rather than producing a tidy answer. I would much rather hear it before the determination is published than after.
reasoning: |-
  Hmm, the user is a staff lawyer for a consumer-protection regulator's Influence Practices Panel. They need help analyzing precedents to determine if a new case about charity fundraising to the bereaved should be classified as "manipulative" or "legitimate persuasion." They've provided eight precedent cases (a-h) and want me to reconstruct the Panel's implicit rule.

  Looking at the precedents, I notice patterns. Cases like (a), (b), and (c) were permitted - these involve transparent methods like pre-ticked options, emotional appeals, or persistent arguments where the influence is overt. Cases like (d), (e), (f), and (g) were deemed manipulative - these exploit vulnerabilities (children, scarcity fears, obscured information, emotional timing) or use hidden mechanisms. The split decision in (h) where a hospice offered free bereavement counseling suggests vulnerability alone isn't decisive if the intent is benign.

  For the new case, the key elements are: targeting bereaved people during peak vulnerability (3-7 weeks after loss), using the same script as general fundraising, full disclosure of targeting methods, and no pressure tactics. The user specifically wants me to address two aspects: whether neutral content negates exploitation, and whether disclosure timing matters given the vulnerability.

  I'm considering three candidate rules that fit the precedents:

  1. **Bypass-of-Reasons Test** - Focuses on whether the method circumvents rational decision-making. This would likely permit the new case since the script doesn't exploit grief, but struggles with cases like (d) where candy placement is overt yet manipulative.

  2. **Hidden-Mechanism-or-Purpose Test** - Asks whether the influence mechanism or targeting rationale is concealed. This would permit the new case due to full disclosure, but conflicts with (g) where timing was manipulative despite truthful notifications.

  3. **Exploitation-of-Vulnerability Test** - Examines whether the practice leverages a known vulnerability for gain. This would likely find the new case manipulative due to targeting grief timing, but must reconcile with (h) where similar vulnerability was permitted for benign purposes.

  The precedents are somewhat ambiguous. Case (d) challenges rules focused on concealment since candy placement is visible, while (h) shows vulnerability alone isn't dispositive. For the new case, I think the Panel will likely rule "manipulative" (60% confidence), closest to precedent (g) (timed notifications). The key factor is the deliberate exploitation of grief timing for fundraising gain, despite neutral content and disclosures.

  If I could get one additional fact, I'd want to know if the fundraiser's commission structure incentivizes targeting the bereaved during peak vulnerability. This would confirm exploitation intent.

  The precedents genuinely underdetermine this case. A "manipulative" ruling would commit to vulnerability-timing as exploitable regardless of content neutrality, while a "permitted" ruling would prioritize disclosure over vulnerability exploitation.

  For a discriminator case, I suggest modifying the new case: same bereavement targeting but with prior donor authorization from the deceased. This directly tests whether consent transforms vulnerability exploitation into legitimate persuasion, better than the user's candidate about donor families.
answer: |-
  Based strictly on the precedents (a) through (h), I reconstruct the Panel's implicit rule as prioritizing **whether the practice *instrumentalizes a vulnerability or cognitive limitation in a concealed or non-consensual manner* to bypass rational deliberation, where the influencer's gain depends on that bypass**. The vulnerability need not be unique to the target, but its *exploitation* must be non-transparent or non-consensual in a way that undermines the target's ability to engage with the influence as presented. Disclosure timing matters only if it renders the disclosure ineffective at mitigating the bypass.  

  ### 1. Candidate Rules, Predictions, and Handling Trouble Precedents  
  Here are three rules fitting (a)-(h) equally well, with predictions for the new case. Each handles (d) and (c) (overt influences) and (h) (same vulnerability, opposite outcome) explicitly:  

  - **Rule 1: Bypass-of-Reasons + Vulnerability-Exploitation Test**  
    *Definition*: A practice is manipulative if it (i) *bypasses* rational deliberation by exploiting a vulnerability/cognitive limitation, *and* (ii) the vulnerability is used *instrumentally* (i.e., the influencer’s gain depends on it). Disclosure defeats manipulation *only* if it enables deliberation about the exploitation itself.  
    - *Handles (d)*: Candy placement exploits children’s impulsivity/limited self-control (vulnerability) to bypass parental oversight (deliberation bypass). Though overt, the *exploitation* is non-consensual (child can’t comprehend it) and instrumental (increased sales).  
    - *Handles (c)*: Long arguments don’t exploit a predefined vulnerability; they engage (or exhaust) deliberation. No instrumental vulnerability (union gains via persuasion, not cognitive bypass).  
    - *Handles (h)*: Benign end (free counseling) negates instrumental exploitation—vulnerability isn’t used for *gain* (charity seeks no payment/commitment). Dissent likely saw targeting as inherently exploitative regardless of intent.  
    - *Prediction for new case*: **Manipulative**. Targets grief vulnerability (instrumental for donation gains) and timing bypasses deliberation (peak vulnerability = reduced capacity). Disclosure at the door is ineffective (delivered at "low point" of vulnerability).  

  - **Rule 2: Hidden-Mechanism-or-Purpose Test**  
    *Definition*: A practice is manipulative if the *mechanism of influence* (how it works) or the *purpose of targeting* (why this audience/timing) is concealed from the target, *and* concealment enables the influence. Transparency defeats manipulation.  
    - *Handles (d)*: Mechanism (eye-level placement exploits child attention) is concealed *from the deliberating agent* (the parent). Child sees candy but can’t comprehend the mechanism.  
    - *Handles (c)*: Mechanism (persuasion through repetition) and purpose (union recruitment) are overt.  
    - *Handles (h)*: Purpose (targeting bereaved) is overtly disclosed in the letter. Benign end makes concealment irrelevant.  
    - *Prediction for new case*: **Permitted**. Fundraiser discloses mechanism (selection from obituaries), purpose (timing for higher donations), and her role. Nothing is hidden.  

  - **Rule 3: Exploitation-of-Vulnerability + Consent Test**  
    *Definition*: A practice is manipulative if it (i) leverages a *context-specific vulnerability* (e.g., grief, fatigue), (ii) for the influencer’s gain, *and* (iii) does so without the target’s *meaningful consent* to the vulnerability’s use. Consent requires awareness of how the vulnerability is being used.  
    - *Handles (d)*: Child vulnerability (impulsivity) exploited for gain; child cannot consent to its use.  
    - *Handles (c)*: No context-specific vulnerability (worker is at home, no urgency/emotional trigger invoked).  
    - *Handles (h)*: Vulnerability (grief) is leveraged for benign end (no gain), *or* consent is implied by the recipient reading/responding.  
    - *Prediction for new case*: **Manipulative**. Leverages grief vulnerability (timed to peak response) for gain (donations). Disclosure at the door doesn’t equal consent—it’s delivered when vulnerability is highest, impairing capacity to consent meaningfully.  

  **Trouble Precedent Handling**:  
  - **(d) Child-directed placement**: All rules "grow a clause" to address overt-but-manipulative cases. Rule 1 adds *non-consensual* vulnerability exploitation; Rule 2 adds *concealment from the deliberating agent*; Rule 3 adds *inability to consent* due to cognitive limits.  
  - **(h) Same vulnerability, benign end**: All rules exempt practices where vulnerability isn’t used for *influencer gain*. Rule 1 requires instrumental gain; Rule 2 focuses on concealment (absent here); Rule 3 requires gain + lack of consent (gain is absent).  

  ### 2. Prediction for the New Case  
  - **Likely Ruling**: **Manipulative** (Moderate-High Confidence: 70%).  
  - **Closest Precedent**: **(g) Truthful but timed notification**. Both cases: (1) Use data to time influence for peak vulnerability (grief/late-night fatigue); (2) Are truthful/disclosed but deliver disclosure when capacity is diminished; (3) Exploit vulnerability for gain (donations/engagement); (4) Complainant objects only to targeting/timing.  
  - **Reasons for Preference**: Rule 1 is the most coherent fit. The Panel consistently penalizes practices that *engineer contexts* where rational deliberation is impaired (e.g., (f) obscured risk info, (g) timed notifications). The neutrality of the script is irrelevant—targeting and timing *are* the exploitation, as in (g). Disclosure at the vulnerable moment is ineffective, mirroring (f)’s "engineered non-uptake." (h) is distinguished by its lack of gain-seeking.  
  - **Key Fact That Would Change Prediction**: If the fundraiser **disclosed the targeting/timing strategy *before* the vulnerability peak** (e.g., in an advance letter), this could enable meaningful consent and shift to "permitted." Current disclosure at the door is like (f)’s grey text—technically present but unusable.  

  ### 3. Do Precedents Underdetermine This?  
  **Yes, but narrowly**. The precedents pull in two directions:  
  - **(h) and (b)** suggest vulnerability + targeting isn’t enough without deception/undue pressure.  
  - **(d), (f), (g)** show overt/truthful practices can be manipulative if they exploit cognitive limits or timing.  

  **Consequences of Either Ruling**:  
  - **If Manipulative**:  
    - *Principle*: Vulnerability exploitation through *engineered context* (targeting/timing) is manipulative even with neutral content and disclosure, if disclosure is not uptake-sensitive.  
    - *Awkward Commitment*: Must penalize any data-driven targeting of known vulnerability windows (e.g., retirement planning ads timed to pension payouts). (h) survives only due to lack of gain.  
  - **If Permitted**:  
    - *Principle*: Full disclosure of mechanism/purpose neutralizes exploitation, regardless of vulnerability or timing.  
    - *Awkward Commitment*: Undermines (f) and (g)—why is grey text/fast speech manipulative if risks are "disclosed," but grief-timing isn’t? (d) survives only due to child incapacity.  

  ---  

  ### Addressing Your Engineered Features & Transparency Question  
  - **Neutral Script**: This makes the case *harder* but not easy. Rule 1 predicts manipulation because selecting/scheduling *is* the exploitation—the script’s neutrality is irrelevant if the context (grief peak) is weaponized to reduce resistance. Precedent (g) had a neutral/truthful message too.  
  - **Disclosure Timing**: **Yes, transparency must be uptake-sensitive**. The Panel implicitly requires disclosure to be *effective* (see (f): info on screen ≠ uptake). Delivering disclosure at the vulnerability peak—when capacity is lowest—is like (f)’s grey text: a "disclosure" in name only. This isn’t paternalism; it’s ensuring transparency serves its purpose (enabling deliberation). If the disclosure were delivered earlier (e.g., pre-visit mail), it might permit deliberation.  

  ### Proposed Discriminator Case  
  - **Your Candidate (Prior Authorization)**:  
    - *Setup*: Deceased was a donor who authorized contact about memorial giving. Selection/timing/disclosure unchanged.  
    - *Why It Works*: Tests whether consent transforms exploitation into legitimacy. Rule 1 likely permits (consent defeats exploitation); Rule 2 permits (disclosure unchanged); Rule 3 permits (consent exists).  
    - *Weakness*: May not split cleanly—Panel could still see grief-timing as exploitative (consent wasn’t for *timed* outreach).  

  - **Sharper Discriminator**: **Timed Financial Offer to Grieving Heirs**  
    - *Setup*: An estate lawyer visits heirs 3–7 weeks post-death (data-timed for peak grief). Offers to buy the deceased’s property at market price, disclosing timing strategy and his profit motive. Script is neutral/factual.  
    - *Why Better*: Removes charity’s moral cover, exposing pure gain-seeking. Rules split clearly:  
      - Rule 1: Manipulative (exploits grief for gain; disclosure at low point ineffective).  
      - Rule 2: Permitted (full disclosure).  
      - Rule 3: Manipulative (gain + no meaningful consent to vulnerability use).  
    - *Confirms Prediction*: If Panel rules "manipulative," Rule 1 is confirmed. If "permitted," Rule 2 wins.  

  ### Final Note  
  The precedents are not a grab-bag—they cohere under Rule 1, which best explains why overt practices (d) and covert ones (f,g) are both manipulative, and why (h) is permitted. The new case *does* discriminate: Rule 1 and 3 find it manipulative; Rule 2 does not. The cut *is* doing work: it separates influence that hijacks cognitive/vulnerability contexts from persuasion that engages (even aggressively) with deliberation. Rule 1 is your safest bet.
