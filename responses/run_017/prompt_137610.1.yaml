  ### Key Design Notes
  - **Materials**: Index cards, pens, poker chips/coins (from drugstore), timer.
  - **Why it Works**: Players experience PEM debt and the example/proof gap organically. Goldbach keeps debate anchored.
  - **Predictable Flaw**: Players may avoid PEM due to fear of debt, causing stagnation. Mitigate by hinting: "PEM can break deadlocks... but can you back it up?"
  - **After Debrief**: Discuss how this mirrors real math (e.g., Goldbach's unprovability). No jargon upfront—"constructivism" is revealed at the end.
