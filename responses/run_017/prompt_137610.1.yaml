  But in the non-constructive proof, you don't discharge it, and it's valid. The game is penalizing the Asserter for using PEM in a way that is not constructive. That's the point: in constructivism, you cannot use PEM in this way without knowing which case holds.

  So the scoring reflects the constructivist view: using PEM incurs a debt that must be paid by showing which case holds.

  Therefore, in the game, the Asserter is forced to lose points if they use PEM for something they can't decide.

  But then the Asserter might try to avoid using PEM. How can they win? They can't, because they cannot provide a specific pair that is guaranteed to work. So the game is stacked against the Asserter, which is the point: the existential claim cannot be proven constructively in this way.

  So in the game, the Asserter will lose. The Skeptic wins by forcing the Asserter into debt.

