answer: |-
  Here’s the ranked list of load-bearing questions, designed for maximum leverage within your constraints:

  **Ranked Questions:**  
  1. **Is imprecise probability *truly distinct* from Bayesianism?**  
     *(The "rewrite as a big prior" challenge)*  
     - **Why #1:**  
       - **(1) Load-bearing:** If equivalence holds, the field collapses into a notational variant of Bayesianism. If not, it’s a foundational revolution. Everything (interpretations, updating, decisions) hinges on this.  
       - **(2) Accessibility:** You *can* get traction. Focus on technical results:  
         - *Pro-equivalence:* Levi’s "chance setup" argument, Schervish’s & Kadane’s equivalence theorems (showing sets ≈ priors over "indexed" hypotheses).  
         - *Anti-equivalence:* Seidenfeld’s & Wasserman’s critiques (the "big prior" violates exchangeability/updating coherence; loses ambiguity attitude).  
         - **Key litmus test:** Can the "big prior" model *dilation* (see Q2) without ad-hoc fixes? If not, equivalence fails.  
       - **(3) Institutional Impact:** If distinct, institutions reporting sets (e.g., IPCC confidence intervals, Fed uncertainty cones) are *rightly avoiding false precision*. If equivalent, they’re obscuring their *true* (complex) prior.  

  2. **How do we *update* imprecise credences? Is dilation a bug or a feature?**  
     *(Conditioning sets, widening with evidence)*  
     - **Why #2:**  
       - **(1) Load-bearing:** Updating rules define how knowledge grows. Dilation (e.g., coin flip uncertainty *increases* after observing "Heads") tests IP’s coherence. Rejecting dilation guts IP’s response to model uncertainty.  
       - **(2) Accessibility:** Concrete examples exist (coin with unknown bias, medical tests with unreliable sensitivity). Compare:  
         - *Generalized Bayes* (Walley): Sets narrow *on average* but can dilate locally – reflects genuine unresolved uncertainty.  
         - *Dilation critics* (e.g., White): Violates "ignorance neutrality"; implies learning *less* from data.  
         - **Bottom line:** With undergrad probability, you *can* simulate a dilation case (e.g., prior set [0.4, 0.6] for P(Heads), observe Heads, posterior set [0,1] under certain conditions).  
       - **(3) Institutional Impact:** If dilation is legitimate, institutions *should* widen intervals after ambiguous evidence (e.g., new pandemic data with conflicting quality). If a bug, their current practice is flawed.  

  3. **How should institutions report/act on *set-valued* uncertainty?**  
     *(The "scandal" of no decision rules)*  
     - **Why #3:**  
       - **(1) Load-bearing:** IP’s *purpose* is action-guidance under ambiguity. If institutions report sets but avoid committing to rules, it undermines IP’s practicality.  
       - **(2) Accessibility:** Investigate real cases:  
         - NICE (UK health) uses "evidence gaps" (sets) but defaults to cost-effectiveness thresholds (Γ-maximin-ish).  
         - IPCC uses likelihood ranges but doesn’t prescribe climate policy actions.  
         - **Reveal the tension:** Institutions use sets *descriptively* (honesty about uncertainty) but resist *prescriptive* rules (fear of arbitrariness/accountability).  
       - **(3) Institutional Impact:** Directly challenges status quo. Answer could force standardization (e.g., "All set reports must state action rule used") or justify current pragmatism.  

  **Cut Question: Γ-Maximin vs. Maximality vs. E-Admissibility (The "Which Decision Rule?" Debate)**  
  - **Why Cut:**  
    - **(1) Less Load-Bearing:** Assumes IP is distinct *and* updating is settled. Outcome often identical in practice.  
    - **(2) Philosophical Quicksand:** Heavily depends on interpretations of "rationality" (avoiding sure loss vs. admissibility) and ambiguity aversion (risk vs. ambiguity). Resembles moral philosophy ("Is cautiousness a virtue or bias?").  
    - **(3) Muted Institutional Impact:** Institutions hedge precisely *because* they won’t commit to one rule. Debating rules is academic until Q3 is resolved.  
    - **Philosophers Talking Past:** Yes. Example: Is Γ-maximin "irrational" for ignoring potentially good options (White)? Or is it the only ambiguity-averse *coherent* rule (Walley)? Depends on whether ambiguity aversion is a rational primitive.  

  **Your Two Insights & My Verdict:**  
  1. **Parliament vs. Primitive Imprecision:**  
     - **Real? Absolutely.**  
     - **Downstream Impact? Crucial for *updating* and *interpretation*, less for decisions.**  
       - *Parliament (epistemic):* Sets represent ignorance about a *true* precise chance. Learning *should* narrow sets (unless dilation!). Dilation is problematic.  
       - *Primitive (ontic):* Sets represent fundamentally indeterminate chances (e.g., quantum indeterminacy, undefined social processes). Dilation is natural.  
     - **Why it matters:** Affects Q2 (Is dilation defensible?) and Q1 (Can "big prior" capture *ontic* imprecision?).  

  2. **Institutions Reporting Sets Without Action Rules:**  
     - **Scandal? Not yet – but a looming crisis.**  
     - **It’s the honest response to *unresolved foundational issues* (Q1 & Q2).** Until we know if sets are distinct and how they update, prescribing rules is premature. Your piece can expose this tension as a catalyst for progress.  

  **What Would Make Me Reshuffle?**  
  - **Finding:** A breakthrough proving IP is *formally equivalent* to standard Bayesianism *without loss of ambiguity attitude*.  
  - **Reshuffle:** Q1 drops (settled). Q2 (updating) becomes #1 (dilation must now be "fixed" within Bayes). Q3 jumps to #2 (institutions need new reporting norms).  

  **Execution Strategy for 4 Months:**  
  - **Q1:** Dive into 2-3 key equivalence papers + 2 critiques. Interview a hardliner (e.g., "IP is just Bayes" – maybe Kadane) and a defender (e.g., "Sets are irreducible" – maybe Augustin).  
  - **Q2:** Build a simple dilation demo (Python/Jupyter). Contrast with a Bayesian model with vague priors (showing *narrowing*). Interview modelers who’ve seen dilation-like effects.  
  - **Q3:** Case studies: Get internal docs from one institution (e.g., Bank of England inflation reports) showing how sets are generated vs. how actions are justified.  

  Focus here forces clarity on *why IP exists* (Q1), *how it works* (Q2), and *why institutions care but hesitate* (Q3). The rest is commentary.
