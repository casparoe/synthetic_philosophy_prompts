answer: |-
  ### **Activity Design: "The Chip Challenge"**  
  **Goal:** Illustrate the difference between intrapersonal and interpersonal utility aggregation, then destabilize the "separateness of persons" assumption.  
  **Core Mechanic:** Students use poker chips (color-coded per person) to make decisions with real stakes (snacks/chores). Chips cannot be traded—they can only be spent on the person they represent.  

  ---

  ### **Pre-Class Prep**  
  1. **Survey Students** (anonymous, via email/form):  
     - "Favorite snack (under $5): ________"  
     - "Most-hated 5-minute chore: ________" (e.g., wipe whiteboard, stack chairs, sort papers).  
  2. **Materials:**  
     - Poker chips in 18 distinct colors (use nail polish/markers on cardboard if needed).  
     - Envelopes labeled with each student’s name (for their chips).  
     - Whiteboard ledger: Columns for each student’s name and net chips.  
     - Snacks/chore list (kept private).  

  ---

  ### **Rules & Incentives**  
  - **Starting Chips:** 10 per student.  
  - **Payoffs (end of class):**  
    - **Net Positive:** Favorite snack.  
    - **Net Zero:** Nothing.  
    - **Net Negative:** Must do their most-hated chore after class.  
  - **Key Rules:**  
    - Chips are nontransferable (blue chips only benefit "Alex," red only "Sam," etc.).  
    - **Complaint Rule:** Anyone net-negative stands, states a complaint (e.g., "I’m doing a chore because you all chose this"), and the group must respond **to them** (not abstractly).  
    - **Opt-Out:** Anyone can silently place chips in their envelope and stop participating. If they opt out, their chips are locked (no further gains/losses).  

  ---

  ### **Phase-by-Phase Breakdown**  
  *(Total: 90 minutes)*  

  #### **Phase 1: Time Aggregation (Intrapersonal)**  
  *(15 min: 0:00–0:15)*  
  **Goal:** Show effortless aggregation across time within one life.  
  **Activity:** Staged decisions for "future selves."  
  - **Round 1 (Present):**  
    - *Choice:* Pay 2 chips to gain 5 chips in Round 2.  
    - *Mechanic:* Students drop chips into their *own* envelope if they pay.  
  - **Round 2 (Near Future):**  
    - *Choice:* Those who paid get 5 chips. Then, pay 3 chips to gain 8 chips in Round 3.  
  - **Round 3 (Distant Future):**  
    - *Choice:* Those who paid get 8 chips.  
  - **Ledger Update:** TA updates net chips on whiteboard.  
    - *Expected Outcome:* Most end at +8 (10 -2 +5 -3 +8 = 18). No complaints.  
  - **Debrief Prompt (TA):** "Why was sacrificing chips now for future gain an easy choice?"  

  #### **Phase 2: Interpersonal Aggregation**  
  *(30 min: 0:15–0:45)*  
  **Goal:** Force confrontation with interpersonal trade-offs. Someone *must* bear a cost.  
  **Activity:** Group-approved projects with concentrated costs/diffuse benefits.  
  - **Project 1 (Low Stakes):**  
    - *Proposal:* One volunteer pays 3 chips. 5 others gain 2 chips each (net +7).  
    - *Mechanic:* If no volunteer, skip. Update ledger.  
  - **Project 2 (High Stakes):**  
    - *Proposal:* **Randomly select** one student to pay 10 chips. 10 others gain 2 chips each (net +10).  
    - *Mechanic:*  
      - Cost-bearer can **opt out** (no shame; if they do, project cancels).  
      - If they accept, they likely go negative. **Enforce Complaint Rule:** They stand, complain, and group responds directly (e.g., "We voted because the group gained more" → "But *I* lost!").  
  - **Ledger Update:** Highlight net gains vs. individual loss.  
  - **Debrief Prompt (TA):** "How did this feel compared to Phase 1? Why?"  

  #### **Phase 3: Destabilizing Separateness**  
  *(25 min: 0:45–1:10)*  
  **Goal:** Challenge "distinctness" by merging two students into one "stream of consciousness."  
  **Activity:** Shared identity with ambiguous utility counting.  
  - **Setup:** Randomly pick 2 students (e.g., "Ava" and "Ben"). Announce:  
    *"For this phase, Ava and Ben share one stream of consciousness. They are one entity, ‘AB.’"*  
  - **Mechanic Changes:**  
    - AB gets a **new chip color** (e.g., purple).  
    - AB’s starting chips = Ava’s + Ben’s current chips (e.g., 15 + 12 = 27 purple chips).  
    - AB has **one vote** in decisions (Ava and Ben must agree internally).  
  - **Project 3:**  
    - *Proposal:* AB pays 18 chips. Each of 6 others gains 4 chips (net +6).  
    - *Catch:* AB drops to 9 chips (positive), but ask: **"Did AB pay 18 chips, or did Ava and Ben each pay 9?"**  
  - **Project 4 (Critical):**  
    - *Proposal:* AB pays 30 chips. 8 others gain 5 chips each (net +10).  
    - *Outcome:* AB goes negative (27 - 30 = -3).  
    - **Enforce Complaint Rule:** Ava *and* Ben stand together.  
      - They share one complaint (e.g., "AB lost 30, but we’re two people!").  
      - Group must respond **to them** (e.g., "But AB is one entity!" vs. "You’re two people!").  
  - **Key Ambush:**  
    - During ledger update, ask: **"When AB gained/lost chips, did we count that as one event or two?"**  
    - *Force a vote:* "How many people did AB’s loss affect? One? Two? Something else?"  

  ---

  ### **Debrief Framework**  
  *(20 min: 1:10–1:30)*  
  **Goal:** Map the activity to utilitarianism’s "separateness of persons" objection without lecturing.  
  1. **Open Reactions:**  
     - "What moments felt unfair? Why?"  
     - "When did the group’s choice clash with an individual’s experience?"  
  2. **Concept Mapping:**  
     - Phase 1 → Aggregating utility *across time* (uncontroversial).  
     - Phase 2 → Aggregating *across people* (someone pays the cost → "separateness matters").  
     - Phase 3 → "What if persons aren’t fully separate?" (Shared identity → aggregation feels different but ambiguous).  
  3. **Introduce the Idea:**  
     - Finally name-drop: "This is the ‘separateness of persons’ objection to utilitarianism. It asks: *Can we treat people like time-slices of one life?*"  
     - Highlight the destabilization: "If separateness comes in degrees, does the objection lose force?"  
  4. **Handle Early Name-Droppers:**  
     - If a student names "separateness of persons" early, say: "Interesting! Hold that thought—we’ll unpack it in the debrief."  
     - If they persist, assign them to track "how many times the group overrides an individual" (keeps them engaged).  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem:** Group avoids negative outcomes by voting "no" or volunteering optimists.  
    - *Fix:* In Phase 2, **randomly assign** cost-bearers (opt-out allowed). In Phase 3, force the vote on AB’s loss.  
  - **Problem:** One dominant student "solves" all decisions.  
    - *Fix:* Assign them as the ledger-keeper (distracts them; gives others space).  
  - **Problem:** Merged students (Phase 3) don’t take it seriously.  
    - *Fix:* TA roleplays gravity: "AB, as one entity, how do you vote?"  
  - **Problem:** Snacks/chores feel trivial.  
    - *Fix:* Emphasize personal stakes ("Remember, this chore is YOUR most-hated!").  

  ---

  ### **Limitations & Salvage Plan**  
  - **What the Activity Can’t Replicate:**  
    - The moral weight of real harm. Students may still see this as "just a game."  
    - **Salvage:** Explicitly state during debrief: "In real life, costs aren’t chores—they’re suffering. The game makes you *feel* the tension, but real stakes are heavier."  
  - **If Phase 3 Falters:** Skip the vote. Ask: "AB lost 30 chips. If Ava and Ben are one stream, why do *two* people complain? Does the math care?"  

  ---

  **Why This Works:**  
  - **No Tech, No Budget:** Chips = cardboard, chores = free labor, snacks = affordable.  
  - **Stakes Feel Real:** Personalized snacks/chores via pre-survey.  
  - **Forces Engagement:** Complaint rule makes aggregation visceral.  
  - **Ambush Achieved:** Phase 3’s merged entity creates cognitive dissonance without sci-fi.  

  **Final Tip:** Bring extra snacks for peacekeeping. Run it once with friends if possible!
