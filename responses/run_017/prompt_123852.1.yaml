    - If at any point a person has negative chips, they get to stand up and state a complaint. The group must address the complaint to that person (not just to the ledger). The TA can facilitate: "How does the group respond to [Name]'s complaint?"

  Example Project for Phase 2:
  - Project A: One person (volunteer or selected) pays 5 of their chips. In return, 5 other people (randomly selected) each get 2 chips (so total benefit 10, total cost 5 -> net +5). 
