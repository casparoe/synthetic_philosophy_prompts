  We are designing an activity for a 90-minute session with 18 students. The goal is to have them experience the aggregation of costs and benefits within a single life (Phase 1) and then across different people (Phase 2), and then to challenge the separateness of persons (Phase 3) in a way that shows distinctness comes in degrees.

  Constraints:
  - No lecture upfront; avoid terms like "separateness of persons" until the end.
  - Two students may try to name-drop early; we need a way to handle that.
  - No deception, and opt-out must be easy and silent.
  - Use snacks and small chores as incentives, with pre-class survey for preferences.
  - The stakes should be real: each student has a favorite snack and a most-hated small chore.
  - Use poker chips as tokens, color-coded per person (so chips are non-transferable and can only be spent on the person they represent).
  - If someone ends up net-negative, they get to state a complaint that must be addressed to them personally, not just the ledger.
  - Phase 3: destabilize the separateness by having two participants share a single stream of consciousness or having one person split into two.

  Proposed Structure:
  - Pre-class: Survey each student for favorite snack and most-hated small chore. Prepare accordingly.
  - Materials: 
    - Poker chips (or similar tokens) in 18 different colors (one per student). 
    - A ledger (whiteboard or large paper) to track net chips per person.
    - Envelopes or small containers for each student to hold their chips.
    - A list of the snacks and chores (with the assigned student for each) for the TA.
    - Timer.

  Game Phases:

  Phase 1: Within a Single Life (Time Aggregation)
  - Each student is given 10 chips of their color at the start.
  - The scenario: They are making decisions for their own future. Each round represents a different time period in their life (e.g., "now", "5 years from now", "10 years from now").
  - Each round, they are presented with a choice that affects their future self. For example:
    - Round 1 (Now): They can choose to pay 2 chips (a cost now) to gain 5 chips in the next round (benefit later). 
    - Round 2 (5 years): They get the 5 chips if they paid in round 1, and then face another choice: pay 3 chips now to get 7 chips in round 3.
    - Round 3 (10 years): They get the 7 chips if they paid in round 2.
  - Since it's the same person, they should happily aggregate over time. They end up with more chips (10 -2 +5 -3 +7 = 17) if they make the sacrifices.

  Phase 2: Across Different Persons (Interpersonal Aggregation)
  - Now, the group is making decisions that affect different people. The chips are still color-coded and non-transferable.
  - Scenario: The group must collectively decide on projects that have costs and benefits distributed across members.
  - Rules:
    - Each project is proposed by the TA and requires a certain number of chips to be paid by specific individuals (or volunteers) and then provides benefits to other individuals.
    - The group discusses and votes (by show of hands) on whether to undertake the project. Majority rules? (But note: we don't want one confident student to dominate. So maybe require unanimous? But that might be too hard. Alternatively, we can have a rule that if the project is approved, the cost-bearers must agree to pay. If they don't, then the project is off. This way, they can opt out.)
