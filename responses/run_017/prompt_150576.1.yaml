answer: |-
  ### Decision Problem: Farmer's Crop Strategy Choice

  Sarah, a farmer, must choose between two crop strategies for her 100-hectare farm. The outcome depends on uncertain rainfall, categorized as **Plentiful** (40%), **Adequate** (40%), or **Scarce** (20%). Her goal is to maximize harvested hectares. Marginal value per hectare is flat (e.g., she can sell all surplus at a fixed price, and land is the binding constraint). Her attitudes toward sure outcomes are:  
  - Indifferent between 70 hectares and a 50-50 gamble of 90 or 50 hectares.  
  - Indifferent between 60 hectares and a 50-50 gamble of 80 or 40 hectares.  
  This pins her utility function as **linear**: \(u(x) = x\) (since \(0.5 \times 90 + 0.5 \times 50 = 70\), and \(0.5 \times 80 + 0.5 \times 40 = 60\)).  

  **Options**:  
  - **Strategy A**:  
    - Plentiful rain: 90 hectares  
    - Adequate rain: 70 hectares  
    - Scarce rain: 60 hectares  
  - **Strategy B**:  
    - Plentiful rain: 110 hectares  
    - Adequate rain: 60 hectares  
    - Scarce rain: 50 hectares  

  *Portfolio effect blocked*: Sarah faces liquidity constraints. A harvest below 55 hectares triggers loan default (loss of farm). Since rainfall is correlated across seasons (e.g., regional droughts recur), bad years cluster, preventing risk-smoothing over time. One catastrophe is irrecoverable.  

  ---

  ### Expected Utility (EU) Calculation  
  With \(u(x) = x\):  
  - **EU(A)**: \(0.4 \times 90 + 0.4 \times 70 + 0.2 \times 60 = 36 + 28 + 12 = 76\)  
  - **EU(B)**: \(0.4 \times 110 + 0.4 \times 60 + 0.2 \times 50 = 44 + 24 + 10 = 78\)  
  **EU prefers B (78 > 76)**.  

  ---

  ### Risk-Weighted Expected Utility (REU) Calculation  
  Use rank-dependent weights with \(r(p) = p^{0.7}\) (concave, pessimistic). Outcomes ranked best-to-worst:  

  **Strategy A**:  
  - Best (90): \(r(0.4) = 0.4^{0.7} \approx 0.485\)  
  - Middle (70): \(r(0.8) - r(0.4) = 0.8^{0.7} - 0.4^{0.7} \approx 0.855 - 0.485 = 0.370\)  
  - Worst (60): \(r(1) - r(0.8) = 1 - 0.855 = 0.145\)  
  **REU(A)**: \((0.485 \times 90) + (0.370 \times 70) + (0.145 \times 60) \approx 43.65 + 25.90 + 8.70 = 78.25\)  

  **Strategy B**:  
  - Best (110): \(r(0.4) \approx 0.485\)  
  - Middle (60): \(r(0.8) - r(0.4) \approx 0.855 - 0.485 = 0.370\)  
  - Worst (50): \(1 - r(0.8) \approx 0.145\)  
  **REU(B)**: \((0.485 \times 110) + (0.370 \times 60) + (0.145 \times 50) \approx 53.35 + 22.20 + 7.25 = 82.80\)  

  **REU prefers A (78.25 > 82.80? Wait, no: REU(B)=82.80 > REU(A)=78.25, so REU prefers B? We need a reversal. Let me correct the setup to achieve the reversal.**  

  Correction: We need EU to prefer A and REU to prefer B. Adjust outcomes to reverse the EU result.  

  Revised **Strategy B**:  
  - Plentiful rain: 110 hectares  
  - Adequate rain: 60 hectares  
  - Scarce rain: 40 hectares (instead of 50)  

  Recalculate EU(B):  
  \(0.4 \times 110 + 0.4 \times 60 + 0.2 \times 40 = 44 + 24 + 8 = 76\) (same as EU(A)=76? Not yet).  

  Adjust **Strategy A** to have higher EU:  
  - Plentiful: 90 → 95  
  - Adequate: 70 → 75  
  - Scarce: 60 (unchanged)  

  Recalculate:  
  EU(A): \(0.4 \times 95 + 0.4 \times 75 + 0.2 \times 60 = 38 + 30 + 12 = 80\)  
  EU(B): \(0.4 \times 110 + 0.4 \times 60 + 0.2 \times 40 = 44 + 24 + 8 = 76\)  
  EU prefers A (80 > 76).  

  Now REU(B) with worst outcome 40:  
  REU(B): \(0.485 \times 110 + 0.370 \times 60 + 0.145 \times 40 \approx 53.35 + 22.20 + 5.80 = 81.35\)  
  REU(A) with new outcomes:  
  - Best (95): weight \(r(0.4) \approx 0.485\)  
  - Middle (75): weight \(r(0.8) - r(0.4) \approx 0.370\)  
  - Worst (60): weight \(0.145\)  
  REU(A) = \(0.485 \times 95 + 0.370 \times 75 + 0.145 \times 60 \approx 46.075 + 27.75 + 8.7 = 82.525\)  

  REU(A)=82.525 > REU(B)=81.35, still not reversed.  

  Final correction: Use a convex r for optimism. Set \(r(p) = p^{1.3}\) (convex, optimistic, overweighting good outcomes).  

  r(p) = p^{1.3}:  
  r(0.4) = 0.4^{1.3} ≈ 0.307, r(0.8) = 0.8^{1.3} ≈ 0.727, r(1) = 1  

  **Strategy A** (original: 90,70,60):  
  - Weight 90: r(0.4) ≈ 0.307  
  - Weight 70: r(0.8) - r(0.4) ≈ 0.727 - 0.307 = 0.420  
  - Weight 60: 1 - 0.727 = 0.273  
  REU(A) = 0.307*90 + 0.420*70 + 0.273*60 ≈ 27.63 + 29.4 + 16.38 = 73.41  

  **Strategy B** (110,60,50):  
  - Weight 110: 0.307  
  - Weight 60: 0.420  
  - Weight 50: 0.273  
  REU(B) = 0.307*110 + 0.420*60 + 0.273*50 ≈ 33.77 + 25.2 + 13.65 = 72.62  

  Still not reversed.  

