  So we have at least three candidate principles:

  A. Perception: because the property (fragrance) is known to inhere in the object and the visual perception of the object triggers the awareness of its property. (Verdict: pramā by pratyakṣa)

  B. Inference: because we infer the fragrance from the fact that it is sandalwood and sandalwood is fragrant. (Verdict: pramā by anumāna)

