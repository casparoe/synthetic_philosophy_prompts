  1-13: all consistent because in no case do we have a true cognition of a property that is not currently presented by the senses and not by inference, etc., being accepted as pramā. Case 9 is upamāna and involves past testimony and current perception, but that was about learning a new term. Case 6 is about the same object. Here, we are attributing a property that is not currently sensed.

