  ### Testing Principle C (Not pramā):

  The cognition is not produced by a pramāṇa. It is a memory-based association. The visual perception gives the log, and then the mind recalls the fragrance. But the cognition is a single judgment: "this is fragrant". The teacher might say that this is not a presentational awareness of the fragrance because the fragrance is not present. It is a memory of the fragrance being associated with sandalwood. Therefore, it is not a pramā.

