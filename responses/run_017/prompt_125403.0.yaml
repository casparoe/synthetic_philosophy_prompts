  Hmm, this is clearly an advanced legal-philosophical question. The user demonstrates sophisticated understanding of the nuances in tort law's handling of these sensitive cases. They're likely a legal academic or philosopher grappling with the theoretical inconsistencies in this area.

  The core puzzle is how courts can simultaneously reject the child's claim (wrongful life) while allowing parents' claims (wrongful birth), given that both seem to rely on comparing existence with non-existence. The user specifically flags two tricky aspects: the measurement problem when parents might have had another child, and how a "life not worth living" statutory scheme might interact with current doctrine.

  I need to reconstruct the unstated principles that make this pattern coherent. The key tensions are:
  - Courts reject child's claim because they view existence (even impaired) as incomparable to non-existence and fear devaluing disabled lives
  - Yet parents recover extraordinary costs by implicitly comparing existence-with-disability to non-existence or healthy-existence
  - The offset rule (ordinary costs vs. benefits) creates additional complications

  For the first complication about counterfactuals: When courts award parents extraordinary costs despite the possibility they'd have had another child anyway, they're essentially treating the particular child's disability as the relevant harm, not the mere fact of birth. The refusal to let defendants argue this point suggests they're protecting reproductive autonomy more than strictly calculating losses.

  For the statutory reform proposal: A narrow action only for "life not worth living" cases would require abandoning the incomparability doctrine at the extremes. This exposes how current practice relies on a threshold view where only sub-zero quality life counts as harm, while maintaining rhetorical commitment to all life having value.

  The implicit theory seems to be: Harm requires an identifiable subject experiencing worsened state. Nonexistence has no subject to harm. Benefits to parents can offset their losses, but the child's existence itself can't be a harm to the child. Yet the parents' recovery for extraordinary costs tacitly acknowledges the disability creates burdens that wouldn't exist otherwise - which skirts close to the forbidden comparison.

  Testing for coherence: The practice holds together only if we strictly separate the child's claim (rejected on metaphysical grounds) from parents' claim (allowed on autonomy grounds). The offset rule becomes incoherent if we ask why ordinary child-rearing costs are offset by emotional benefits but not extraordinary costs - this seems arbitrary unless we see extraordinary costs as representing the autonomous choice that was violated.

  On the asymmetry problem (absence of pain vs absence of pleasure): Current law doesn't need to take a position, as it avoids all existence/non-existence comparisons for the child. But if we incorporated the asymmetry, it might justify recognizing wrongful life claims only for severe suffering where non-existence avoids pain, not for missed pleasures.

  The user's deep concern seems to be whether tort law can consistently handle these existentially charged cases without philosophical contradictions. My analysis suggests the coherence is maintained through careful doctrine rather than deep consistency - which may be precisely what makes the system workable despite theoretical tensions.
answer: |-
  The existing legal pattern rests on a **threshold view of harm combined with a subject-relative theory of benefits and a pragmatic separation of claims**, but it contains significant tensions when tested for coherence. Below, I reconstruct the implicit theory, address your complications, and evaluate its philosophical commitments.

  ### Core Implicit Theory
  1. **Harm Requires a Worse State for an Identifiable Subject**:  
     - Courts reject the child's claim because harm presupposes a *preexisting subject* made worse off. Nonexistence lacks a subject to harm. This commits to the "no subject" argument and the metaphysical claim that existence/nonexistence are *incomparable* for the person affected.  
     - **Presupposed**: (a) Harm must have a subject; (b) Nonexistence cannot be a baseline for comparison.  
     - **Fits with**: A strong threshold view (only lives below a "worth living" threshold are harms), but courts avoid stating this explicitly to prevent devaluing disabled lives.

  2. **Parents' Claim: Autonomy + Tangible Losses, Not Existence Itself**:  
     - Recovery for extraordinary costs (not ordinary costs) frames the harm as:  
       - **Reproductive autonomy violation**: The loss of choice to avoid a disabled child or unplanned pregnancy.  
       - **Concrete economic injury**: The added burdens of disability/unplanned birth, separable from the child’s existence.  
     - The benefits offset rule assumes ordinary child-rearing costs are balanced by emotional/social benefits, while extraordinary costs are "net losses" unmitigated by benefits.  

  3. **Healthy Child Cases**:  
     - Denying recovery for ordinary costs implies that a healthy child’s existence is always a net benefit. Allowing recovery for pregnancy/birth costs treats those as isolated physical injuries unrelated to the child’s value.

  ### Addressing Complications
  **1. Unstable Counterfactual in Parents’ Damages**:  
     - **Problem**: If parents would have conceived a healthy child later, the "careful world" includes similar ordinary costs. Awarding extraordinary costs anyway suggests courts:  
       - **Prioritize autonomy over precise loss measurement**: The injury is the denial of choice itself; damages focus on the *actual child’s disability-related costs*, not hypothetical alternatives.  
       - **Reject "same parents, different child" comparisons**: Legally, courts treat the loss as flowing from *this child’s condition*, not the mere fact of parenthood. The refusal to let defendants argue alternative conceptions reflects a policy choice favoring administrability and plaintiff autonomy.  
     - **Coherence Test**: This undermines the cost-based logic but coheres with autonomy as the protected interest. The award is consistent if seen as compensation for the *specific burden of disability/unplannedness*, not general child-rearing.

  **2. Statutory Reform ("Life Not Worth Living" Action)**:  
     - This reform would:  
       - **Require abandoning incomparability**: By defining a life below a threshold as a harm, it admits existence can be worse than nonexistence.  
       - **Imply a threshold view**: Harm exists only when life is net negative.  
       - **Avoid devaluation concerns**: By channeling damages to a trust, it sidesteps rhetoric that the child is "harmed by existing."  
     - **Contrast with Current Practice**: Current law presupposes incomparability but functionally operates with a hidden threshold (rejecting only the child’s claim, not the parents’). The reform makes this threshold explicit but narrows it to extreme cases.

  ### Philosophical Commitments vs. Pragmatism
  - **Strictly Presupposed**:  
    - Harm requires a subject; nonexistence has no subject.  
    - Any life above a minimal threshold is a net benefit *to the person living it* (for the child’s claim).  
  - **Fits With, But Not Required**:  
    - Threshold view (only sub-zero lives are harms).  
    - Benefits asymmetry (absence of pain is good, absence of pleasure is not bad unless a subject exists).  
  - **Pragmatic Drivers**:  
    - Dignity concerns: Avoiding statements that disabled lives are "injuries."  
    - Administrability: Courts refuse to price "nonexistence" or emotional benefits.  
    - Autonomy focus: Parents’ claims succeed by emphasizing tangible losses, not existential judgments.  

  ### Coherence Assessment
  - **Tension 1**: Parents recover extraordinary costs by comparing existence-with-disability to a world with no child (or a healthy child), yet courts forbid the child from making a similar comparison.  
    - **Resolution**: The law separates claims: parents’ losses are relational (their autonomy/resources), not the child’s existential state. This holds if autonomy is the core interest.  
  - **Tension 2**: The benefits offset rule inconsistently assumes emotional benefits offset ordinary costs but not extraordinary costs.  
    - **Incoherence**: If emotional benefits are "priceless," why do they offset only ordinary costs? This suggests the offset is a policy tool to limit liability, not a principled distinction.  

  ### Benefits Asymmetry and Legal Change
  - **Current Practice & Asymmetry**: The asymmetry (avoiding pain is obligatory; creating pleasure is optional) could be true without affecting the law. Tort law focuses on *rights violations and compensable losses*, not comprehensive moral reasons. The child’s nonexistence avoids pain but creates no rights-holder to claim injury.  
  - **If Asymmetry Were Incorporated**:  
    - **Child’s action**: Might be recognized *only* for severe pain/suffering (absence of pain = benefit), not for missed pleasures.  
    - **Offset rule**: Could be weakened; if existence avoids pain, benefits might not offset costs in severe disability cases.  
    - **Healthy child cases**: Recovery for ordinary costs might be denied more firmly (existence provides pleasure/avoids pain).  
    - **Judicial rhetoric**: "Life as a benefit" language would shift to emphasize avoidance of suffering.  

  ### Conclusion
  The pattern is **minimally coherent** under a theory that:  
  - Strictly separates harm-to-child (rejected) from injury-to-parents (allowed based on autonomy and economic loss).  
  - Uses the benefits offset as a policy device to limit liability while acknowledging symbolic benefits.  
  - Relies on metaphysical incomparability rhetorically but functionally applies a hidden threshold.  

  **Weak Point**: The unstable counterfactual exposes that parents’ damages implicitly compare worlds the child’s claim cannot. This is resolved only by prioritizing parental autonomy over consistent counterfactual logic. The practice is sustainable pragmatically but philosophically strained—revealing law’s struggle to reconcile existential questions with compensable injury.
