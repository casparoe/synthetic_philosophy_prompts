prompt: |-
  Hi — hoping you can help with something that's half practical, half philosophical. I do intake at a small outfit that brokers what people in this space call moral trades: two funders who disagree about what's actually worth doing each spend money on the other's cause, on the theory that both end up with more of what they care about than if they'd just spent on themselves. Our broker (call her Marta) decides what we'll put our name to, and I've now watched her say yes and no often enough that I can't work out what rule she's running. Her track record:

  1. Straight swap between a global-health funder and an animal-welfare funder, $5M each way: yes, no hesitation.
  2. Tiny foundation whose entire value was that a grove of one particular tree species be planted and tended for fifty years; they put $9M into a deworming program in exchange: yes. She has never once required that a demand make sense to anyone else.
  3. Deal where one side's contribution required its staff to mislead their own donors about where the money actually went: no.
  4. Deal where one side's contribution meant breaking a signed agreement with a partner org: no.
  5. A proposed trade with a group inside another country's sealed-off program that we could never contact and would never hear from, justified on the grounds that they're presumably running the same reasoning and will do their part anyway: no.
  6. A deal with a counterparty that had reneged on a previous trade: no — but she brokered basically the same deal a year later once they posted a bond with a third party.
  7. A deal where the small side was six months from losing its charter and had no other counterparty, and the big side's terms handed it maybe 5% of the gains: no.
  8. A secular group that wanted a religious charity to publish a statement saying the charity's own mission was less important than theirs: no.

  Now the one on my desk. Ardent is a large poverty-focused foundation. Clause is small, and its only value is that a particular nineteenth-century legal archive be preserved — the physical paper, in the original building — and that Ardent publicly state, on it's own letterhead, that it regards preserving the archive as being as important as its core work. Clause puts $40M of its money into Ardent's programs; Ardent spends $3M on the archive and publishes one statement drafted by Clause.

  The wrinkles as I see them. Ardent's board is happy to publish, but their own staff don't think the sentence is really true — they'd call it a harmless overstatement rather than a lie, and nothing is being concealed from donors about where money goes. Ardent's donors gave for poverty and were never asked; an internal poll suggests most of them wouldn't mind, but only most. Clause has about eighteen months of runway before it has to deploy or dissolve, has no other counterparty, and would get, in money terms, a small fraction of what it's handing over — though it would also get literally everything it cares about. And Clause has turned down a digitisation option that would secure the same documents for a tenth of the price, on the grounds that it's the paper it cares about, not the contents.

  What I want from you: will Marta broker it? More usefully — give me the two or three rules that fit all eight of her verdicts about equally well, say what each of them predicts here, tell me which one you think she's actually running and why, and name the single variation on this deal that would tell them apart. (Same money, statement dropped? Same deal, donors actually asked and 90% say fine? Same deal, Clause has three years of runway and two other counterparties?) If you think her precedents genuinely don't reach this far, say so and tell me what principle she'd be committing herself to with each choice. I care less about the yes/no than about which of those rules I should assume next time.
reasoning: |-
  Okay, let me try to unpack Marta's decision-making process here. The user has provided eight cases where Marta said yes or no to various moral trades and wants to predict her decision on a new case involving Ardent and Clause. 

  First, I need to look for patterns in Marta's past decisions. The cases where she said yes (1 and 2) both involve straightforward value exchanges without any ethical complications. The global health/animal welfare swap is mutually beneficial with no strings attached. The tree grove/deworming trade respects both parties' values even if the tree preservation seems odd to outsiders.

  The no decisions all seem to involve some kind of compromise to integrity or reliability. Cases 3 and 4 involve deception and broken agreements - clear ethical red lines. Case 5 is too speculative with no verification mechanism. Case 6 shows consequences for unreliability but allows redemption with collateral. Case 7 prevents exploitation of vulnerability. Case 8 blocks coercive reputation games.

  For the Ardent/Clause proposal, several concerning elements stand out. The insincere statement feels adjacent to case 8's reputation coercion, though less extreme. Ardent's staff discomfort mirrors case 3's deception warning signs. Clause's desperation resembles case 7's exploitation risk. The rejected digitization option suggests irrationality but aligns with case 2's acceptance of idiosyncratic values.

  The key tension is between respecting Clause's unusual values (which Marta typically does) versus preventing integrity violations (which she consistently blocks). The statement insincerity might be the deciding factor - it's not outright deception like case 3, but it crosses into "reputation laundering" territory like case 8.

  I think Marta would likely reject this deal because of the manufactured endorsement aspect. To test this hypothesis, the most telling variation would be removing the statement requirement entirely - if Marta then approves, the reputational coercion was indeed her sticking point. Other changes like longer runway or donor approval wouldn't resolve the core integrity concern.
answer: |-
  Based on Marta's precedents and the nuances of the Ardent/Clause proposal, here's the breakdown of her likely decision rules, predictions for this deal, and the critical test:

  ### The Three Most Consistent Rules Explaining Marta's Precedents
  1.  **The Integrity Constraint Rule:** "A trade is acceptable only if it doesn't require any party to violate core ethical principles (truthfulness, promise-keeping, reputational honesty) or enable such violations by others."
      *   **Fits Precedents:** Explains "No" on #3 (lying to donors), #4 (breaking signed agreement), #8 (forced false statement). Explains "Yes" on #1 & #2 (no ethical violations). Explains #5 (no verification mechanism = potential for hidden violation/enabling). Explains #6 (reneging = broken promise; bond restores integrity mechanism). Explains #7 (exploiting desperation = enabling violation of fiduciary duty?).
      *   **Prediction for Ardent/Clause:** **NO.** The core issue is the *insincere public statement* demanded by Clause. While not a direct lie to donors about money flow (#3), it forces Ardent to make a *reputational statement they don't fully believe* (#8 parallel). The staff's discomfort ("harmless overstatement") signals an integrity violation regarding truthfulness in representation. The donors' lack of explicit consent adds a layer of misalignment, though less severe than #3.

  2.  **The Enforceable Reciprocity Rule:** "A trade is acceptable only if there is a credible mechanism to ensure both sides fulfill their commitments, and neither side is being exploited due to desperation or extreme power imbalance."
      *   **Fits Precedents:** Explains "No" on #5 (no contact/enforcement), #6 (prior reneging = lack of enforceability until bond), #7 (desperation + extreme imbalance = exploitation risk). Explains "Yes" on #1 & #2 (clear, enforceable commitments). Explains #3 & #4 (violations inherently break enforceability). Explains #8 (coercive statement undermines fair reciprocity).
      *   **Prediction for Ardent/Clause:** **NO.** Clause is desperate (18-month runway, no alternatives). The financial imbalance ($40M vs $3M + statement) is extreme, and Clause gets "only" its idiosyncratic value. While the *actions* ($3M spend, statement) are likely enforceable, the *power dynamic* strongly resembles #7, suggesting potential exploitation. The statement requirement itself can be seen as a non-monetary exploitation of Ardent's reputation.

  3.  **The Value Sovereignty + No Harm Rule:** "A trade is acceptable if each party is freely acting according to their own values (however idiosyncratic) *and* the trade doesn't cause significant harm to third parties or violate fundamental duties (truth, promises)."
      *   **Fits Precedents:** Explains "Yes" on #1 & #2 (sovereign values, no harm). Explains "No" on #3 (harm/duty: lying to donors), #4 (harm/duty: breaking agreement), #5 (impossible to verify values/consent/harm), #6 (violated duty: broke promise), #7 (exploitation = harm to desperate party? / duty breach?), #8 (forced statement = harm to reputation/duty to truth?).
      *   **Prediction for Ardent/Clause:** **LEANING NO, but borderline.** Clause's value (physical paper) is sovereign, like #2. Ardent's board freely consents. The harm/third-party issues are murky: Donors weren't asked, but poll suggests limited harm; the statement is insincere but not a direct lie about funds (like #3). The *insincerity* is the primary "harm/duty" violation, echoing #8. The power imbalance/desperation suggests potential harm to Clause. The rejected digitization shows sovereign value, but also highlights the cost imbalance.

  ### Marta's Most Likely Rule & Prediction
  *   **The Rule She's Running:** **The Integrity Constraint Rule (Rule #1)** is the most consistent and strictest fit. It cleanly explains every "No" (#3,4,5,6,7,8) by finding an ethical violation (deception, broken promise, lack of verifiability implying potential for violation, prior violation, exploitation enabling violation, forced false statement). It allows the "Yes" decisions (#1,2) where no such violation exists. The Enforceable Reciprocity rule (#2) is a close second and often overlaps, but the Integrity Constraint is more fundamental in her pattern.
  *   **Prediction for Ardent/Clause:** **Marta will say NO.** The forced, insincere public statement is the critical flaw. It directly parallels the *type* of reputational coercion she rejected in #8, even if the *degree* is less severe ("as important as" vs "less important than"). Ardent staff discomfort confirms the insincerity. While other factors exist (donor consent, power imbalance, desperation), the **statement requirement violates the truthfulness/reputational integrity principle** central to Rule #1. The fact that Ardent's board is "happy" doesn't override the ethical violation of the *act itself* in Marta's framework.

  ### The Critical Variation to Test the Rules
  *   **The Test:** **Same money, but the public statement requirement is DROPPED.** Clause only gets the $3M preservation funding.
  *   **Why this test?**
      *   **Rule #1 (Integrity Constraint):** **YES.** Removing the forced statement eliminates the core ethical violation. The other concerns (donor consent, power imbalance) are secondary under this rule, especially since Ardent's board freely agrees to spend $3M on preservation (idiosyncratic value respected, like #2). The potential donor discomfort isn't a direct *lie* or violation of a core duty like #3.
      *   **Rule #2 (Enforceable Reciprocity):** **NO or MAYBE (Likely No).** The extreme power imbalance ($40M vs $3M) and Clause's desperation (18 months, no alternatives) remain, strongly resembling the exploitation risk in #7. The enforceability of the $3M spend is clear, but the *fairness* of the exchange under duress is questionable.
      *   **Rule #3 (Value Sovereignty + No Harm):** **YES.** Removing the statement eliminates the reputational harm/duty violation. Clause gets its sovereign value (preserved paper), Ardent freely commits funds. The power imbalance remains a concern, but without coercion (statement) or explicit harm, it might pass like #2.

  **Conclusion:** Marta's pattern most strongly suggests the **Integrity Constraint Rule.** She will reject the Ardent/Clause deal **due to the requirement for an insincere public statement**, violating her core principle against forced misrepresentation. **For next time, assume Rule #1 is primary:** If a trade requires any party to deceive, break a promise, harm their reputation dishonestly, or exploit such violations, Marta will reject it. Idiosyncratic values and power imbalances matter, but only secondary to upholding integrity. The critical test confirms this: dropping the statement requirement would likely make her say yes, resolving the core integrity violation while leaving other concerns insufficient for rejection under her established pattern.
