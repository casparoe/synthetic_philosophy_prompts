  First, I need to address their key concerns. The main tension is between personal experience (a life) and aggregate effects (GDP, societal change). Historical analogies often gloss over individual suffering versus long-term societal gains. The user’s year-five test is crucial here—can the analogy hold without knowing the outcome? That’s a strong requirement but highlights the hindsight bias in most analogies.

  Next, reference-class shopping. They mention that each historical case is overdetermined, with a small sample size. A good analogy must predefine the reference class based on specific attributes of the technology, not just pick a convenient example. But how to do that without cherry-picking? Maybe by focusing on technology attributes like diffusion speed or skill displacement.

  Timescale compression is another issue. The Industrial Revolution took decades to affect living standards, while AI’s impact might be faster. Analogies need explicit timelines to be useful for policy. If an analogy doesn’t specify duration, it’s misleading for decision-making.

  The protagonist requirement is central for the user as a novelist. They want to know how individuals—artisans, factory workers, scientists—experienced the change. But policymakers care about aggregate outcomes. This conflict means an analogy can’t serve both purposes equally. A good analogy must specify the level (individual vs. aggregate) and not conflate them.

  The user’s deeper need might be validating their skepticism about these analogies while providing a framework to critique them in panels. They also need to balance their creative interest in individual stories with the policy angle. The unspoken need is for intellectual rigor in a space full of shallow comparisons, helping them push back against facile narratives without dismissing analogies entirely.

  For the spec, I’ll outline requirements. Start with non-negotiable like causal mechanism, preconditions, and level specificity. Then, preferences like the year-five test. Highlight conflicts, especially between the year-five test and predictive power since analogies rely on known outcomes. Also, the individual vs. aggregate tension can’t be resolved by one analogy.

  The requirement that rules out common analogies is "No Hindsight Contamination." Most analogies fail the year-five test. For example, comparing AI to the printing press ignores that early printers faced uncertainty and chaos, not inevitable success.

  Finally, the table scoring: Printing press might score high on individual disruption but low on preconditions check. Industrial Revolution has clear mechanisms but fails the year-five test for workers. Nuclear weapons have predictive mechanisms but don’t address economic displacement.

  Need to ensure the response is structured, addresses all user points, and stays concise, especially the table. Emphasize that no analogy is perfect, but the framework helps evaluate them critically.
answer: |-
  Here’s your spec: a set of requirements for evaluating historical analogies of transformative tech, designed for your dual purpose (individual experience + policy/regulation). Each requirement includes a **motivating case**, **verdict** (non-negotiable/preference), and **purpose alignment flags**.

  ---

  ### **1. Core Requirements**
  | Requirement | Motivating Case | Verdict | Purpose Tension |
  |-------------|----------------|---------|----------------|
  | **Causal Mechanism (not resemblance)** | Industrial Rev.: "Increased productivity" is resemblance; "steam power enabled centralized factories, displacing artisans via cost competition" is mechanism. Shows *how* change occurred. | **Non-negotiable.** Resemblances (e.g., "both disrupted jobs") are post-hoc; mechanisms allow pre-mortem checks. | **Aligned:** Both need causality to predict *how* change unfolds. |
  | **Preconditions Checkable *Now*** | Printing press: Required cheap paper (new tech), literate populace (slow trend), merchant capital. If AI lacks analogous preconditions (e.g., energy infrastructure, data literacy), analogy fails. | **Non-negotiable.** If preconditions can’t be audited pre-change, the analogy is prophecy, not analysis. | **Aligned:** Policy needs actionable levers; writers need plausibility. |
  | **Explicit Timescales & Non-Linearity** | Industrial Rev.: Real wages stagnated/fell for 50+ years (Pessimist School) before rising. Analogies ignoring this (e.g., "AI will quickly boost living standards") mislead. | **Non-negotiable.** Duration and pain/gain sequencing are core to lived experience and policy planning. | **Tension:** Individuals suffer within short timescales; policy/aggregate outcomes need long horizons. |
  | **Level-Specificity (Individual vs. Aggregate)** | Nuclear weapons: Aggregate "deterrence stability" vs. Oppenheimer’s personal torment ("destroyer of worlds"). Conflating levels hides tradeoffs. | **Non-negotiable.** Must state *whose* outcome is being analogized (worker? CEO? nation?). | **Severe Tension:** Your protagonist focus (individual) vs. policy’s systemic focus *always* pull apart. |
  | **Protagonist-Grounded Outcomes** | Lancashire weaver: Skill devalued → income loss → social displacement → identity crisis. Analogy must specify *whose* skill/status/meaning is disrupted. | **Preference (individual camp).** Vital for your fiction, but regulators often ignore "unmeasurable" human costs. | **Tension:** Policy often dismisses individual ruin as "adjustment costs." |
  | **Year-Five Test (Works with period knowledge)** | Automobile in 1910: Hailed as eco-friendly (replaced horse manure crisis!). Post-1920 traffic/deaths/pollution unknown. Analogy must hold without hindsight. | **Preference (rigor camp).** Rejects "inevitability" narratives but may exclude weak analogies. | **Tension:** Policy loves "lessons of history," but history’s lessons rely on outcomes. |
  | **Reference-Class Justification** | Why compare AI to printing press (info diffusion) not steam engine (energy revolution)? Must define *shared attributes* upfront (e.g., "technologies enabling exponential replication"). | **Non-negotiable.** Prevents cherry-picking; forces acknowledgment of small-N problem. | **Aligned:** Both need defensible comparisons. |

  ---

  ### **2. Irreconcilable Tensions**
  - **"Year-Five Test" vs. "Predictive Power"**: Analogies derive value from knowing the outcome. Strip this out (Year-Five), and you lose predictive certainty. **Verdict:** No analogy can be *both* genuinely predictive *and* fully checkable pre-outcome. History doesn’t repeat; it rhymes—but you can’t prove the rhyme until it’s over.
  - **Individual vs. Aggregate Focus**: One analogy **cannot** serve both. A Lancashire child laborer’s suffering ≠ GDP growth; Oppenheimer’s guilt ≠ Mutually Assured Destruction stability. **Verdict:** You must choose the level *or* use separate analogies.

  ---

  ### **3. The Rule That Rules Out Most Analogies**
  **Requirement: Year-Five Test (with Preconditions Check)**  
  **Why it kills bad analogies:** 99% of panelists’ analogies rely on hindsight. Examples:  
  - *Printing press*: In 1455, it was a niche tool for bibles. No one predicted mass literacy, religious wars, or scientific revolutions.  
  - *Industrial Revolution*: In 1780, factory owners claimed automation would liberate workers. Wage data showing decline wasn’t systematized until 1850.  
  - *Nuclear weapons*: In 1947, analysts predicted imminent nuclear war, not 80 years of (non-nuclear) proxy conflicts.  
  **Argument:** If the analogy only makes sense *after* we know the winners, it’s a just-so story. Your test forces uncertainty back in—which is truthful for lived experience but uncomfortable for policy.

  ---

  ### **4. Quick Scorecard: Printing Press vs. Industrial Rev. vs. Nuclear Weapons**
  | Requirement                | Printing Press (1450s)       | Industrial Revolution (1780s) | Nuclear Weapons (1945)        |
  |----------------------------|------------------------------|--------------------------------|--------------------------------|
  | **Causal Mechanism**       | Strong (capital + tech → info diffusion) | Strong (energy → centralized production) | Strong (physics → existential risk) |
  | **Preconditions Checkable**| Medium (paper cost falling? Literacy?) | Medium (coal access? Capital markets?) | Weak (geopolitical will is intangible) |
  | **Explicit Timescales**    | Weak (effects took 100+ years) | Medium (50-year wage stagnation known) | Weak (duration of "balance of terror" unknown) |
  | **Level-Specificity**      | Weak (confuses scribes’ fate with societies’) | Medium (worker vs. owner data exists) | Strong (clear individual/aggregate split) |
  | **Protagonist Outcomes**   | Strong (scribes → printers → publishers) | Strong (artisan → factory worker) | Strong (scientist → policymaker) |
  | **Year-Five Test**         | **Fails** (no one predicted Reformation) | **Fails** (optimists denied wage collapse) | **Fails** (nuclear winter not modeled until 1980s) |
  | **Reference-Class**        | Info diffusion | Labor productivity | Risk/control asymmetry |

  **Best for your needs?**  
  - **Individual experience:** *Industrial Revolution* (rich protagonist arcs).  
  - **Policy:** *Nuclear weapons* (clear existential stakes, control mechanisms).  
  - **Neither** passes the Year-Five Test.

  ---

  ### **Key Takeaways for Your Panels**
  1. **Demand mechanisms and preconditions**—shut down vague resemblances.  
  2. **Force level-specificity**—ask *"Whose life does this analogy describe?"*  
  3. **Expose hindsight bias**—"Would this analogy make sense in year five?"  
  4. **Accept limitations**: No analogy can resolve the individual/aggregate split or guarantee predictions.  

  This spec doesn’t give easy answers—because history doesn’t either. But it weaponizes your skepticism. Next time someone says "It’s like the printing press," ask: *"Which printer in which city in 1470? And what could they actually see?"* Watch them sweat.
