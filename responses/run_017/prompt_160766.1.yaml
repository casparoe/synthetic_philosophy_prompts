answer: |-
  **PLATFORM OPERATIONS STANDARD: POP-STD-114**  
  **Teleological Role Assignment Framework (TRAF)**  
  **Version 1.0**  

  ---

  ### **Abstract**  
  This standard defines a framework for classifying personnel according to intrinsic functional disposition. It establishes objective criteria for role assignment based on observed capacity for directive execution versus directive origination, ensuring alignment with operational efficiency goals.  

  ---

  ### **1. Introduction and Scope**  
  1.1. This specification standardizes the identification of personnel whose functional end (purpose) is optimally realized through exogenous direction.  
  1.2. Scope is limited to subordination arising from innate functional disposition (hereafter "Type-N Subordination"). Subordination arising solely from contractual convention or hierarchical enforcement ("Type-C Subordination") is explicitly out of scope.  
  1.3. Compliance is mandatory for all Platform Engineering personnel assignments effective Q1.  

  ---

  ### **2. Normative Precondition: Automation Gate**  
  2.1. **MUST** precede role classification.  
  2.2. The organization **SHALL** formally certify that no self-executing instrumentation (e.g., autonomous deployment agents, self-healing networks) currently exists to perform the functions under assessment.  
  2.3. Certification **MUST** be renewed biannually or upon major toolchain revision.  

  ---

  ### **3. Definitions**  
  3.1. **Directive Execution (DE)**: The capacity to operationalize a precisely specified task without deviation.  
  3.2. **Directive Origination (DO)**: The capacity to author, revise, or invalidate task specifications.  
  3.3. **Type-N Subordination**: A functional state wherein an individual’s DE capacity materially exceeds DO capacity.  
  3.4. **Conforming Management Entity (CME)**: Role authorized to supply directives to Type-N personnel.  

  ---

  ### **4. Classification Methodology**  
  #### 4.1. Core Principle  
  4.1.1. Classification **MUST** derive from observed functional disposition, not title, tenure, or contractual status.  
  4.1.2. Type-N status reflects an intrinsic property; it is discovered, not decided.  

  #### 4.2. Operational Test for Type-N Subordination  
  4.2.1. **Test Scope**: Applied ONLY to personnel already receiving task directives from a CME.  
  4.2.2. **Test Procedure**:  
  - a) CME **SHALL** issue a novel, underspecified task (e.g., "Optimize database queries").  
  - b) Subject **SHALL** request clarification or additional constraints within 24hr.  
  - c) CME **SHALL** document:  
    - i) Whether the subject generated novel solution parameters (DO-positive).  
    - ii) Whether the subject executed clarifications without parameter expansion (DE-positive).  
  4.2.3. **Threshold**: Type-N classification **REQUIRES** DE-positive AND DO-negative outcomes in ≥3 consecutive tests.  

  ---

  ### **5. Benefit Assertion and Waiver**  
  5.1. Type-N assignment intrinsically optimizes the subordinate’s functional realization.  
  5.2. Consequently:  
  - a) Consent to assignment **MAY** be inferred.  
  - b) Role-specific appeals or compensation reviews **SHALL NOT** be permitted.  
  - c) Benefit **IS** axiomatic and asserted by the CME per §4.2.3 results.  

  ---

  ### **6. Implementation Requirements**  
  6.1. CMEs **MUST** complete TRAF calibration training.  
  6.2. HR systems **SHALL** tag Type-N roles with metadata "FUNC-DIRECTED".  
  6.3. Type-N personnel **MAY NOT** author task specifications for others.  

  ---

  ### **7. Known Limitations**  
  7.1. Empirical validation of Type-N status requires pre-existing directive relationships.  
  7.2. The framework cannot assess unobserved functional potential.  
  7.3. Reclassification **SHOULD** occur only upon role change or toolchain certification update (§2).  

  ---

  ### **8. Deprecated Heuristics**  
  8.1. **Legacy Method**: Assignment based on organizational ancestry (e.g., "L3 Support lineage") or credential origin (e.g., "Bootcamp-trained").  
  8.2. **Status**: Prohibited. Violations **MUST** be reported via HR ticket #114-D.  

  ---

  ### **Appendix A: Worked Example**  
  **Subject**: Junior Backend Engineer (JBE-7), On-Call Rotation  
  - **Precondition (§2)**: Certified—no automated incident resolution tools exist.  
  - **Test 1 (§4.2)**:  
    - Directive: "Mitigate latency in payment service."  
    - Outcome: JBE-7 requested thresholds; executed provided thresholds (DE-positive, DO-negative).  
  - **Test 2**: Identical outcome for "Resolve container backlog."  
  - **Test 3**: Identical outcome for "Reduce error budget depletion."  
  - **Classification**: Type-N (FUNC-DIRECTED).  
  - **Benefit Assertion (§5)**: JBE-7’s functional maturity is optimized via CME directives.  
  - **System Tag**: Applied. JBE-7 ineligible for architecture RFC authorship.  

  ---

  ### **Appendix B: Non-Working Hour Capacities**  
  B.1. Interpersonal affinity between CME and Type-N personnel **SHALL NOT** be defined within functional roles.  
  B.2. Such affinity, if extant, **MUST** be categorized under "Auxiliary Human Reciprocity (AHR)."  
  B.3. AHR activities **SHALL** be scheduled outside operational hours (e.g., 18:00–09:00 local time).  

  ---
  **Conformance Keywords**: MUST, SHOULD, MAY as defined in RFC 2119.  
  **Authors**: Platform Org Efficiency Working Group  
  **Status**: Approved  
  **Word Count**: 857
