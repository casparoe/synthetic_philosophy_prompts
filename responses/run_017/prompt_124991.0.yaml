  But the clustering does matter because it changes the probability of the global claim. Without clustering, the global claim is very probable (91%), but with clustering it is only moderately probable (55%). Therefore, the editor's belief in the global claim is much stronger without clustering than with. This might affect the threshold setting.

  Now, to answer the editor's question:

  - The two cases (lottery and report) are not exactly the same because:
     a) In the lottery, the global proposition is certain (probability 1), while in the report it is only probable (and the level of probability depends on the error model).
