answer: |-
  ### Scratchpad: What Analogies Do and How They Mislead  
  Historical analogies in AI debates serve three core functions: (1) **concretizing uncertainty** (making abstract risks/benefits tangible), (2) **implying inevitability or contingency** (suggesting outcomes are predetermined or avoidable), and (3) **smuggling in policy assumptions** (e.g., "like nukes, this needs state control"). A strong analogy must:  
  - **Match mechanisms**: Capture scalable, self-improving, low-marginal-cost cognition.  
  - **Resist false precision**: Avoid implying known timelines (AI lacks nuclear fission’s "split-second" or printing press’s "century-scale" certainty).  
  - **Highlight institutional adaptation**: Focus on societal rules (laws, norms), not the artifact.  
  - **Offer policy-neutral traction**: Point to levers (funding, standards, liability) without prescribing "regulation" or "deregulation."  
  - **Defend against hijacking**: Avoid framing that lets partisans claim "this analogy proves we need pause/acceleration."  

  Key failure modes:  
  - **Timescale compression/stretch**: Nuclear analogies imply urgency; Industrial Revolution implies gradualism.  
  - **Agency mislocation**: Printing press narratives focus on Gutenberg, ignoring Church/state battles.  
  - **Outcome determinism**: Industrial Revolution analogies make inequality seem inevitable.  
  - **Artifact fetish**: Joint-stock company debates ignore how law *followed* practice.  

  ---

  ### Candidate Ratings (0–100)  
  | Candidate | Mech. Match | Timescale Honesty | Locus of Change | Policy Traction | Resist Capture |  
  |-----------|-------------|-------------------|-----------------|-----------------|----------------|  
  | **A. Nuclear weapons** | 30 (Ignores replication, focuses on destruction not cognition) | 20 (Implies a single decision point; AI lacks a "Trinity test" moment) | 40 (Highlights state control but neglects decentralized actors) | 90 (Clear levers: treaties, oversight bodies) | 30 (Easily weaponized for "existential risk" or "deterrence" agendas) |  
  | **B. Printing press** | 70 (Captures information explosion; weak on autonomous action) | 60 (Long diffusion time acknowledged, but oversimplifies "effects") | 50 (Notes censorship battles; still centers the press, not societal rules) | 40 (Points to free-speech norms; vague on modern levers) | 20 (Hijacked for "censorship necessary" or "information wants freedom" slogans) |  
  | **C. Industrial Revolution** | 80 (Matches labor displacement and exponential productivity) | 70 (Inherently multi-decade, resists false urgency) | 60 (Shows institutional lag (child labor laws); still tech-centric) | 50 (Suggests safety nets/training; risks partisan "Luddite" framing) | 40 (Often co-opted for "progress is painful" fatalism) |  
  | **D. Standard time** | 85 (New coordination layer enabling scale; low marginal cost adoption) | 95 (Forced adoption took decades; payoff required clocks/schedules) | 90 (Change was in societal coordination, not clocks themselves) | 65 (Levers: standards bodies, interoperability rules) | 80 (No natural villain/hero; hard to politicize time zones) |  
  | **E. Joint-stock company** | 75 (Creates new agents with scaled cognition/action; parallels AI as "actor") | 50 (Adoption was lumpy; often misread as "instant" capitalism) | 85 (Weight on legal structures (liability, duties), not paperwork) | 70 (Points to governance tweaks (fiduciary rules)) | 35 (Easily captured to argue "AI corporations need rights" or "must be regulated like banks") |  

  **Weights**: Mechanism match 35% (core function), Timescale honesty 20% (timeline hype distorts), Locus of change 25% (institutions decide outcomes), Policy traction 15% (avoids paralysis), Resistance to capture 5% (all analogies are malleable; low weight).  

  **Composite Scores**:  
  - D: (85×0.35) + (95×0.20) + (90×0.25) + (65×0.15) + (80×0.05) = **83.5**  
  - E: (75×0.35) + (50×0.20) + (85×0.25) + (70×0.15) + (35×0.05) = **70.0**  
  - C: (80×0.35) + (70×0.20) + (60×0.25) + (50×0.15) + (40×0.05) = **66.5**  
  - B: (70×0.35) + (60×0.20) + (50×0.25) + (40×0.15) + (20×0.05) = **56.0**  
  - A: (30×0.35) + (20×0.20) + (40×0.25) + (90×0.15) + (30×0.05) = **42.5**  

  **Tiers**:  
  - **Build the piece around this**: D (Standard time)  
  - **Usable as a passing illustration**: E (Joint-stock), C (Industrial Revolution)  
  - **Cut**: B (Printing press), A (Nuclear weapons)  

  ### Critical Notes  
  (i) **Top Analogy’s Danger**: Standard time’s greatest risk is **trivializing AI’s cognitive disruption** by implying it’s merely administrative—a friction reducer, not a force that obsoletes human reasoning or rewrites ethics.  

  (ii) **Mandatory Hedging Clauses**:  
  - A: "without the physics of scarcity or mutual destruction."  
  - B: "without assuming predetermined winners in information wars."  
  - C: "without accepting 'progress' as justification for displacement."  
  - D: "without trivializing the erosion of human cognitive primacy."  
  - E: "without conflating corporate incentives with AI’s emergent goals."  

  (iii) **Intro Sentence for Top Analogy**:  
  > Like standard time—a coordinate layer that quietly reorganized society’s relationship with distance—AI may become infrastructure we barely notice until it reshapes agency itself.  

