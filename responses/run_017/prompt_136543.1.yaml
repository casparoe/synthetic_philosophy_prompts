answer: |-
  Here’s a direct breakdown of your core questions, arguing for Brier as the unified measure. Your hybrid has merit but faces deeper issues than Brier’s granularity sensitivity.

  ### 1. **Brier’s Sensitivity: Desideratum or Bug?**  
     - **Agent A**: (0.9 true, 0.1 false₁) → Brier = (0.9−1)² + (0.1−0)² + (0−0)² = 0.01 + 0.01 = 0.02  
     - **Agent B**: (0.9 true, 0.0001 false₁, ..., 0.0001 false₁₀₀₀) → Brier ≈ (0.9−1)² + 1000×(0.0001)² ≈ 0.01 + 0.00001 = 0.01001  
     - Log score: Both ≈ −log(0.9) ≈ 0.105  

     **Is this a bug?** No—it’s a **feature of epistemic refinement**.  
     - Brier penalizes *concentration of error*. Assigning 0.1 to a *single* false world is a bold false claim; spreading 0.1 over 1000 worlds is a diffuse, near-agnostic murmur.  
     - Granularity matters: If the 1000 worlds are genuinely distinct (e.g., "the murderer is person 1" vs. "person 2"), Brier rightly rewards hedging uncertainty finely. If they’re gerrymandered (e.g., "murderer is person 1" vs. "murderer is person 1 wearing hat A/B/C..."), your *world partition* is flawed—not Brier.  
     - **Verdict**: Brier’s sensitivity forces you to justify your possibility space. Log’s indifference to disbelief-distribution is a weakness.

  ### 2. **Your Hybrid Score: Does It Work?**  
     Let \( s(c,w) = -\log c(w) + \lambda (\sum_v c(v) - 1)^2 \) (λ ≈ 2).  
     - **Strengths**:  
       - Coherent credences keep log’s propriety.  
       - Dominates over-massed incoherence (e.g., (0.5,0.5,0.5) dominated by (1/3,1/3,1/3)).  
     - **Fatal Flaws**:  
       - **The "constant" term isn’t epistemically inert**: While \( (\sum c(v) - 1)^2 \) is world-independent, it penalizes *lack of normalization*—a core epistemic flaw. But this penalty doesn’t track *accuracy* at any world; it’s a metaphysical tax. Brier’s dominance derives purely from per-world inaccuracy.  
       - **Fails for non-uniform incoherence**: Consider \( c = (0.8, 0.8, 0.1) \) on 3 worlds. Sum=1.7. Your \( s(c,w) \) penalizes mass but ignores *misallocation*. Coherent \( d = (0.47, 0.47, 0.06) \) may not dominate:  
         - At world 1: \( s(c,1) ≈ -\log(0.8) + \lambda(0.7)^2 ≈ 0.223 + 0.98\lambda \)  
         - \( s(d,1) ≈ -\log(0.47) + 0 ≈ 0.755 \)  
         - If λ=2, \( s(c,1) ≈ 0.223 + 1.96 = 2.183 > s(d,1) = 0.755 \) → no dominance.  
         *(Brier dominates: \( B(c,1) ≈ 1.04 \), \( B(d,1) ≈ 0.76 \))*.  
       - **λ arbitrariness**: Why λ≈2? To mimic Brier? But then why not just use Brier?  

     **Granularity sensitivity persists**: Your hybrid still requires summing over worlds. If you split a world into 1000, \( \sum c(v) \) balloons—penalizing mass *more* for finer partitions. You relocated the problem but didn’t solve it.

  ---

  ### The Bigger Picture: Which Measure for Accuracy-First?  
  **Stopgap Answer**: **Brier**, for unity.  
  - **Conditionalization** relies solely on *strict propriety* (both have it).  
  - **Probabilism** requires *dominance coherence* (only Brier guarantees it universally).  
  - Using different measures for each argument fractures accuracy-first epistemology. If probabilism needs Brier but conditionalization uses log, you’re implicitly endorsing two distinct "accuracy" goals.  

  **Why Brier’s holism is virtuous**:  
  - Accuracy isn’t just about the actual world—it’s about *avoiding false confidence*. Log only cares if you doubted the truth; Brier also cares if you believed falsehoods. Spreading disbelief finely *is* epistemically better: it minimizes unwarranted exclusion.  
  - Log’s truth-locality is its Achilles’ heel: It can’t distinguish between cautious hedging and reckless overcommitment. Brier can.  

  **Where your hybrid loses to plain Brier**:  
  1. **Conceptual purity**: Brier’s dominance stems from actual inaccuracy at every world. Your hybrid’s mass penalty is a metaphysical add-on.  
  2. **General dominance**: Brier dominates *all* incoherent credences. Your hybrid fails for non-uniform cases (as shown above).  
  3. **No λ-tuning**: Brier is derived naturally from squared error; your λ is retrofitted to mimic it.  

  **Compromise?** If you insist on truth-locality, use the **local log score but require coherence as a precondition**. But this abandons *accuracy-dominance* as the argument for coherence—you’d need a separate rationale (e.g., Dutch books).  

  **Final take**: Stick with Brier. Its sensitivity to partition granularity isn’t a flaw—it’s a reminder that accuracy must be defined relative to a rigorous ontology of possibilities. If your partition is arbitrary, fix the partition; don’t blame the scoring rule.
