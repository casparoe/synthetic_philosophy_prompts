prompt: |-
  I am writing a paper on whether transcendental arguments can do any real work against the external-world sceptic, and before I read another defence of one I want the specification rather than the survey. Take transcendental argument in the strict anti-sceptical sense: a derivation from something the sceptic can be made to grant about our having a practice at all — that we have experience, or make judgements, or interpret one another — to some claim the sceptic denies, via the premise that the granted item would not be possible without the denied one. I want to know what such an argument has to deliver to count as adequate for that purpose, with the case behind each requirement.

  The candidates I arrive with, which I want you to promote, demote, or expose as the prejudice of a camp: the starting point must be genuinely available to the sceptic rather than something we can only describe by already helping ourselves to the conclusion; the necessity claimed must not be the contingency of our actual cognitive or neural architecture wearing a modal costume; the argument must be distinguishable in kind from an inference to the best explanation rather than being an abduction with grander vocabulary; a conclusion about objects in space must not be bought by quietly making the domain mind-dependent; the argument must stay robust when the sceptical scenario is redescribed in its own favoured terms, as when a deceiver is specified as supplying a stream ordered by a permanent-looking item; and it must state what would make its own conclusion fail, on pain of being unfalsifiable in the way a definition is.

  I also have two tests of my own, and I want them assessed as seriously as the others rather than humoured. The reversal test: take the contested bridging premise, negate it, and see whether the same form of argument run from some equally undeniable starting point then delivers the negation of the original conclusion — if it does, the form was never doing the work and the premise now needs support it does not have. The deformation test: a transcendental claim tied to a practice should be sensitive to deformations of that practice, telling us which part of the conclusion lapses for a subject with no memory, or no negation, or no re-identification of items over time; a claim that survives every deformation unchanged is a logical truth in costume and says nothing about us. Tell me whether these are real desiderata or artefacts of my own suspicion.

  Two structural questions I care most about. First, mark each surviving requirement non-negotiable or negotiable, and say inside the relevant item where you think two of them cannot be jointly satisfied — I expect the familiar Stroud-style squeeze to be one such place, since it looks as if one must choose between an unsupported verificationist premise and a conclusion that only reports how we must take things to be, and I want to know whether the modest middle is a stable position or merely a retreat that abandons the anti-sceptical aim. Second, identify which single requirement does the most work in excluding candidates.

  Give me exactly seven numbered items, each one or two sentences, with no introduction and no closing summary: six items carrying the requirements with the motivating case and the negotiability verdict for each, and a seventh saying which single requirement excludes the most and which standard candidate arguments it disqualifies. No scorecard across the usual figures, no bibliography, and no quotations.
reasoning: |-
  Hmm, the user is writing a paper on transcendental arguments against external-world skepticism and wants a very specific analysis. They've outlined strict criteria for what makes such an argument adequate, including six candidate requirements plus two additional tests they've developed themselves.

  I need to carefully address all their points while following their structural constraints. The user clearly wants rigorous philosophical analysis without fluff - they're rejecting surveys and defenses in favor of specifications. Their two custom tests (reversal and deformation) show deep engagement with the material, suggesting they're likely an advanced philosophy student or scholar.

  For the six requirements, I'll need to:
  - State each clearly
  - Provide a motivating case
  - Declare it negotiable/non-negotiable
  - Note any incompatibility issues

  The user's concerns about Stroud's critique are particularly significant - that's where the tension between verificationism and modesty will emerge. Their reversal test cleverly exposes circular reasoning, while the deformation test targets vacuous necessities. Both deserve serious treatment as potential desiderata.

  For the seventh point, I'll identify which requirement does the heaviest lifting in disqualifying arguments. The mind-independence requirement seems strongest here, as it immediately rules out many Kantian and neo-Kantian approaches that smuggle in idealism.

  Throughout, I'll maintain their requested formal constraints: exactly seven numbered items, no intros/conclusions, minimal sentences, and absolute avoidance of quotations or references. The tone should remain analytical but accessible to a specialist audience.
answer: |-
  1.  **Non-Question-Begging Starting Point:** The argument must begin with a premise describing an undeniable aspect of our cognitive practice (e.g., having unified experience, making judgments) *without* presupposing the external world's existence or structure. *Motivating Case:* Describing "experience of objects" already smuggles in the conclusion. **Non-Negotiable**.

  2.  **Non-Contingent Necessity:** The claimed necessity linking starting point and conclusion must be genuinely conceptual or transcendental (concerning the possibility of the practice itself), not merely contingent upon our specific biological/psychological makeup. *Motivating Case:* Claiming we *must* perceive spatially could be an evolutionary quirk, not a necessity for thought/judgment. **Non-Negotiable** (conflicts with modesty if pressed).

  3.  **Distinct from Abduction:** The argument must demonstrate an internal, constitutive dependence (X is *required for the possibility* of Y), not merely assert that the conclusion provides the best causal or functional explanation for the starting point. *Motivating Case:* Claiming external objects "best explain" experience is IBE, not transcendental deduction. **Non-Negotiable**.

  4.  **Mind-Independent Conclusion:** The argument's conclusion about objects in space must establish their existence and character independently of the subject's *current* representations or judgments. *Motivating Case:* Berkeleyan idealism satisfies many requirements but makes objects mind-dependent, failing to refute external-world scepticism. **Non-Negotiable**.

  5.  **Scenario-Robustness:** The argument must hold even when the sceptical scenario (e.g., an evil demon) is explicitly described in terms consistent with the starting point (e.g., demon supplying a permanent-object-illusion stream). *Motivating Case:* An argument relying on "object permanence" fails if the demon supplies an *illusion* of permanence. **Non-Negotiable**.

  6.  **Falsifiability Condition:** The argument must specify what conceivable state of affairs would falsify its bridging premise or conclusion, avoiding vacuity. *Motivating Case:* Without this, "experience requires objects" risks being a disguised definition. **Non-Negotiable** (Stroudian tension: specifying falsification may reintroduce scepticism).

  7.  **Assessing Custom Tests & Key Excluder:** **Reversal Test:** A genuine desideratum; a valid transcendental form shouldn't arbitrarily reverse under premise negation, exposing unsupported premises (e.g., reversing "experience requires objects" might yield nonsense from "making judgments"). **Deformation Test:** Also a genuine desideratum; insensitivity to practice deformation (e.g., amnesiacs lacking reidentification) suggests logical, not transcendental, necessity. **Mind-Independence (4)** is the primary excluder; it disqualifies Kantian empirical realism (as potentially idealist), Strawsonian descriptive metaphysics (as not establishing independence), and Davidsonian triangulation (as potentially solipsistic).
