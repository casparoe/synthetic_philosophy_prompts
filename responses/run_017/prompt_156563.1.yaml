prompt: |-
  My dad retired in the spring and I've somehow ended up running the 40-person shop he built, and the place is full of rules nobody can explain — no purchase order over $300 without a second siganture, the Friday afternoon inventory count, a customer we still ship to at a loss and always have. Everyone keeps telling me Chesterton's fence: don't tear down a fence till you know why it was put up. But taken straight that seems to freeze everything forever, because half the time the only way to learn what a practice was for is to remove it and watch what breaks, and I can't run that experiment on a business that has to make payroll.

  So skip the Burke-versus-everyone-else scorecard, give me the spec instead: what would a usable rule for deciding when to keep and when to change an inherited practice actually have to deliver? The cases it has to get right (the rationale that died decades ago, the practice that only ever served the guy who wrote it, the one whose point you can only discover by violating it), the distinctions it isn't allowed to collapse (nobody can explain it vs. nobody benefits; reforming a practice vs. repealing it; caution about *this* arrangement vs. a general suspicion of change), and what it owes a person who has about a month, maybe thirty hours of digging, and no way to A/B test abolition. Mark which requirements are non-negotiable and which are just one camp's taste, and flag any two you suspect can't be satisfied at once — that's the part I most want to see. One short paragraph at the end on whether your list lands nearer Burke or nearer a presumption in favor of changing things is fine, but keep the weight on the criteria.
reasoning: |-
  Okay, the user has taken over their dad's 40-person shop after his retirement and is facing a bunch of unexplained rules and practices. They mention Chesterton's fence - the idea that you shouldn't tear down a fence until you know why it was put up. But they're worried this could freeze everything forever since sometimes you only learn the purpose by removing it. They can't afford to run experiments that might break the business.

  The user specifically wants a practical framework for deciding when to keep or change inherited practices. They need criteria that handle different cases: rules with dead rationales, practices that only benefited the rule-maker, those whose purpose only becomes clear when violated. They want distinctions between "nobody can explain" vs "nobody benefits," reforming vs repealing, and caution about specific changes vs general resistance to change.

  They have limited time - about a month or 30 hours for investigation - and no way to A/B test changes. They want me to flag which requirements are non-negotiable and which might be debatable, and especially highlight any conflicts between criteria. A brief note on whether this leans conservative or reformist is okay, but the focus should be on the criteria.

  This seems like a classic organizational leadership challenge. The user is dealing with institutional knowledge gaps and needs actionable decision-making tools. I should build a framework that respects Chesterton's wisdom while acknowledging practical business constraints.

  For non-negotiable requirements, I'd include: preserving core business functions (like payroll), avoiding irreversible damage, respecting limited investigation time, and maintaining clear distinctions between different types of unexplained rules. Debatable preferences might include how much to weigh employee input versus documented evidence, or how aggressively to pursue modernization.

  Potential conflicts I see: The need for certainty before changing things clashes with the reality that some purposes can only be discovered through removal. Also, limited investigation time may mean some rationales remain permanently obscure. The framework has to acknowledge these tensions rather than pretend to solve them perfectly.

  I'll structure the criteria around key distinctions the user mentioned. For each practice, they should assess: harm versus benefit, reversibility, investigability, and whether it's a candidate for reform versus repeal. I'll include explicit warnings about the conflicts between certain requirements.

  The framework should lean Burkean in preserving functions but be reformist when practices are clearly obsolete or harmful. The key is maintaining business viability while carefully evolving practices.
answer: |-
  Here's a spec for a usable rule on inherited practices, designed for your constraints, focusing on distinctions, cases, and trade-offs:

  **Core Requirements (Non-negotiable):**
  1.  **Preserve Critical Function:** *Must prevent catastrophic failure* (e.g., payroll, core revenue streams, legal compliance, safety). Cannot risk these via untested removal. (Case: The rationale that died decades ago *but still protects a vital function*).
  2.  **Acknowledge Irreversibility:** *Must recognize that some changes are hard/unwise to undo.* Abolishing a key customer relationship or dismantling a core system might be irreversible. (Case: Removing the loss-making customer *might* permanently burn a bridge needed later).
  3.  **Respect Investigation Limits:** *Must work within your 30-hour/month constraint.* Cannot demand exhaustive historical archaeology for every rule.
  4.  **Maintain Key Distinctions:** *Must not collapse:*
      *   "Nobody *can* explain it" (knowledge gap) vs. "Nobody *benefits* from it now" (value assessment).
      *   "Reforming/Modifying" (adjusting scope, process) vs. "Repealing" (abolishing entirely).
      *   "Caution about *this specific* change" (risk assessment) vs. "General suspicion of *all* change" (ideology).

  **Key Distinctions & Cases the Rule Must Handle:**
  5.  **The Zombie Rationale:** (Dead for decades, but fence still stands). Rule must flag practices where *no current operational logic* is discernible within investigation limits, *and* no active benefit/harm is observable.
  6.  **The Self-Serving Artifact:** (Only ever served the rule-maker). Rule must identify practices where the *primary beneficiary* was the originator (e.g., personal convenience, control) and *no current collective benefit* exists.
  7.  **The Reveal-by-Violation Practice:** (Point only discovered by breaking it). Rule must *explicitly accept* that some purposes *cannot* be known beforehand, forcing a *risk-managed approach* to change (not blanket prohibition).
  8.  **Harm/Benefit Assessment:** Rule *must* prioritize identifying *current, tangible harm* (cost, delay, morale drain) and *current, tangible benefit* (efficiency, risk mitigation, customer goodwill) over historical justification alone.

  **Operational Mechanisms the Rule Must Include:**
  9.  **Staged Change Protocol:** Default to *reforming/modifying* before *repealing* (e.g., raise the PO limit to $500 instead of abolishing dual sigs; analyze the loss-making customer's *strategic* value beyond margin). (Addresses "Reforming vs. Repealing").
  10. **Controlled Experimentation (where possible):** *Must seek low-risk ways to test assumptions* without full abolition (e.g., suspend the Friday count for *one* week, monitor impacts; analyze PO patterns below/above $300). (Mitigates "Reveal-by-Violation" problem partially).
  11. **Beneficiary Analysis:** *Requires actively asking:* "Who *today* complains if we change this? Who *today* benefits from it?" (Critical for identifying "Self-Serving Artifacts" vs. hidden benefits).

  **Flagged Conflicts:**
  *   **Certainty vs. Revelation (#7 vs. #1 & #2):** You *need* certainty to protect critical functions (#1), and irreversibility (#2) heightens risk. Yet, some purposes (#7) *only* reveal upon change. **Resolution:** The rule *must* force extreme caution and maximum pre-investigation for practices linked to critical functions or irreversibility. For lower-stakes practices (#5, #6), it must allow for *managed* change accepting the revelation risk. Staged changes (#9) and controlled tests (#10) are key tools here.
  *   **Investigation Limit (#3) vs. Obscure Purpose (#5 & #7):** You can't dig forever (#3), so some practices will remain unexplained (#5) or their true purpose unknowable without removal (#7). **Resolution:** The rule *must* include a decision threshold: "After X hours of focused inquiry yielding no rationale *and* no observable benefit/harm link to critical functions, proceed cautiously with staged change/modification."

  **Debatable Preferences (One Camp's Taste):**
  *   *Weight of Tradition:* How much *inherent* weight to give "we've always done it this way" absent other factors.
  *   *Aggressiveness of Modernization:* How quickly to assume inefficiency in unautomated/paper-based processes.
  *   *Primary Source Weighting:* Prioritizing employee testimony vs. documented records vs. data analysis during investigation.

  **Where it Lands:** This framework is **Burkean in method but reformist in intent.** It mandates deep respect for existing structures (investigation, beneficiary analysis, staged change, protecting core functions) precisely *to enable safe and justified evolution*. It rejects blind preservation ("freeze everything") by forcing harm/benefit analysis and providing tools for change within constraints. The presumption isn't *for* change, but *for understanding* to enable *responsible* change. The goal is removing fences *when you understand why they are no longer needed*, not just why they were built.

  **In Practice: Your Next Month**
  1.  **Map & Categorize:** List key unexplained practices. Group by: Linked to Critical Function? (High Caution). Observable Harm? (Prioritize Review). Observable Benefit? (Lower Priority). Utterly Opaque? (Target for investigation).
  2.  **Prioritize Harm & Low Risk:** Start with practices causing clear pain *and* low risk/cost to modify/test (e.g., the Friday count - suspend once with a backup plan).
  3.  **Interview Strategically:** Focus questions on *current* impacts: "What happens if we *don't* do X?" "Who gets upset if we change Y?" "What problem does Z solve *today*?"
  4.  **Seek Modifications First:** Can the $300 PO limit be indexed? Can the loss-making customer be renegotiated? Reform is safer than repeal.
  5.  **Accept Some Mystery:** After 30 hours, if a low-stakes practice remains opaque and harmless, cautiously modify it via #9 and #10. Document the change and monitor closely. You won't understand *everything*.
