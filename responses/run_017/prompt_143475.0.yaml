prompt: |-
  Hey — I need help writing a short proposal for my school's independent research project thing (you pitch a project, and if they like it you get a free period, a small budget, and you present whatever you found at the end of the semester). I want to do mine on the phrase "Western values." I got into this because I do debate, and I keep hearing people use the phrase in totally incompatible ways: one person says Western values mean we have to stand up to some country, and someone else says Western values mean we shouldn't bomb that same country, and both sound completely sincere. Meanwhile a friend of mine whose family moved here from Turkey says the whole phrase is just a fancy way of saying "stuff people in power already wanted to do anyway," and honestly sometimes it does feel like that. But I really don't want to turn in a project that just concludes "the term is vague and politically loaded," because that's the answer everyone already expects and it doesn't actually settle anything.

  Here's my half-formed idea, and I'd like you to turn it into a real question. I think the phrase might be doing two different jobs that people keep mixing together: a descriptive or historical job (picking out values that have actually been influential in the societies people call Western) and a contrastive or "flag" job (marking off a group against whatever it's currently opposed to — communists back in the day, then Islamist extremism, now sometimes China, but also sometimes internal enemies, like people complaining that universities are abandoning Western values). If it's mostly doing the second job, then it's not surprising the content keeps sliding around, and the interesting question becomes whether it can be coherent at all without any fixed list behind it. One test I thought of: take a sentence like "we have to defend Western values against ___" and swap out what goes in the blank, then ask whether the phrase still picks out the same commitments — if it doesn't, the content is coming from the contrast rather than from the values. The other bit I want to look at is whether a historically Western country can abandon those values by its own lights, and whether a non-Western country can have them better; if both of those are possible, then the "Western" part looks like an accident of history and the real work is being done somewhere else.

  So what I need is the proposal document itself, roughly 800 to 1000 words. State the question so that it has a determinate answer — not just "is the term coherent?" but something I could actually come down on one way or the other — and explain why the obvious answers people give (the list version: democracy, individual rights, free speech, plus some stuff about the Enlightenment and Christianity; and the deflationary version: it's pure rhetoric with no content) both leave the question open. Then lay out what I'd actually do week by week over one semester, keeping in mind I'm in high school and can't run a real corpus study; my advisor said I could collect maybe thirty example uses myself and code them somehow, but I'm not sure that's worth anything or whether I should just do straight argument, so tell me honestly. Say what the possible conclusions are and which considerations would decide between them, what a good final deliverable looks like (a paper? a presentation? something my debate team could actually use when they're prepping?), and include an honest section on what would make this project fail or be way too big for one semester. Also please don't give me a bibliography or reading list or any citations — I'll ask my advisor for those — just refer to positions and arguments in general terms if you need to, and I'll fill in the names myself.
reasoning: |-
  Okay, the user is a high school student involved in debate who needs help crafting a proposal for an independent research project. They're interested in the phrase "Western values" because they've noticed it's used inconsistently in debates—sometimes to justify intervention, other times non-intervention, and their friend from Turkey sees it as mere rhetoric for power. They don't want to just conclude it's vague and politically loaded; they want a more substantive investigation.

  Their core idea is that "Western values" might serve two functions: a descriptive/historical one (identifying actual influential values in Western societies) and a contrastive/"flag" one (defining an "us" against a current "them"). They suspect the contrastive use makes the content slippery. They propose testing this by seeing if the values invoked change when the opposed group changes. They also wonder if Western countries can abandon these values or if non-Western countries can exemplify them—which would undermine the term's geographic essence.

  The user needs an 800-1000 word proposal that:
  - Sharpens their half-formed idea into a research question with a determinate answer (not just "is it coherent?").
  - Explains why existing answers (fixed list vs. pure rhetoric) are insufficient.
  - Outlines a feasible semester-long methodology (since they can't do complex corpus studies—maybe analyzing ~30 examples).
  - Identifies possible conclusions and what would decide between them.
  - Suggests deliverables (paper/presentation/debate resource).
  - Includes honest limitations/risks.

  The user explicitly says not to provide citations—just reference arguments generally.

  Key challenges:
  1. **Reframing the Question:** Need to move beyond "is it coherent?" to something like: "Does the term primarily function as a contrastive marker rather than a descriptive label?" This allows a yes/no answer with nuance.
  2. **Methodology:** Since they can’t run big data analysis, we’ll suggest qualitative coding of ~30 examples (from speeches, op-eds, debate rounds) to track:
     - Who uses the term (political alignment, context).
     - The "contrasted group" (e.g., China, extremists, internal critics).
     - The specific values invoked (democracy, free speech, etc.).
     - Whether historical roots are mentioned.
  3. **Theoretical Hook:** Contrast the "Fixed List" view (values as inherent to the West) with the "Rhetorical Tool" view (values defined by opposition), then introduce their "Contrastive Primacy" hypothesis: the term gains coherence only *through* opposition, not from a stable core.
  4. **Deliverables:** A paper + a debate resource (e.g., flowchart for deconstructing "Western values" claims).
  5. **Risks:** Overambitious scope; cherry-picking examples; getting bogged down in philosophy. Mitigation: Focus on modern usage; pre-define coding categories; start analysis early.

  The proposal should subtly validate their frustration with superficial critiques ("it’s just vague") while elevating their insight about contrastive function. Their Turkish friend’s point ("stuff people in power want") is a key angle—position it as the "rhetorical tool" view they’ll test against.
answer: |-
  ## Research Proposal: Unpacking "Western Values" — Contrastive Marker or Historical Core?

  **Project Title:** The Shape-Shifting Shield: Does "Western Values" Derive Meaning Primarily from Opposition?

  ### 1. Research Question & Significance
  The phrase "Western values" is ubiquitous in political discourse, wielded to justify starkly opposing actions (e.g., interventionism vs. isolationism) while evoking a sense of shared heritage. Common analyses either list supposedly core tenets (democracy, individualism, Enlightenment rationalism) or dismiss the term as purely empty political rhetoric. Both approaches, however, leave a critical gap unexplored: **Is the primary function of "Western values" in contemporary discourse descriptive (referencing a stable historical tradition) or contrastive (defining an "us" primarily through opposition to a perceived "them")?** This project seeks a *determinable answer* to this functional question, moving beyond the observation of vagueness to identify its *source*.

  The significance lies in untangling a powerful rhetorical tool. If the term is primarily contrastive, its inherent flexibility and political utility are explained, but its coherence as a guide to action independent of an "enemy" is severely undermined. If a stable descriptive core persists despite oppositional usage, it suggests greater resilience and potential universal applicability. This investigation matters for understanding how political identities are constructed, how justifications for policy gain traction, and the real-world consequences of ambiguous foundational concepts in international relations and domestic debates.

  ### 2. Beyond the Obvious Answers: Why the Question Persists
  *   **The "Fixed List" Answer (Descriptive Core):** Proponents argue "Western values" refers to a specific, historically developed constellation of ideas: Greco-Roman heritage, Judeo-Christian ethics, Enlightenment reason, individualism, democracy, human rights, and free speech. This view assumes relative stability and inherent superiority.
      *   **Why it leaves the question open:** It struggles to explain the *radical inconsistency* in how the term is applied to concrete situations (e.g., bombing vs. not bombing the same country). Why do these "fixed" values lead to diametrically opposed conclusions? It also struggles with the historical record – many "Western" societies violated these principles extensively (colonialism, slavery, suppression of dissent), and non-Western societies champion individual elements. If the list is so fixed, why does its application slide?
  *   **The "Pure Rhetoric" Answer (Deflationary View):** This view, echoing my friend's perspective, asserts "Western values" is entirely vacuous, merely a post-hoc justification for pre-determined political goals ("stuff people in power already wanted to do anyway"). It highlights the term's weaponization.
      *   **Why it leaves the question open:** While compellingly explaining cynicism, it struggles to explain the phrase's persistent *persuasive power* and the genuine sense of conviction many users display. If it's *entirely* empty, why does it resonate? Why not use blatantly arbitrary justifications? It also overlooks the possibility that the phrase might *evoke* or *activate* genuinely held, albeit ill-defined, beliefs tied to identity, even if its specific content is malleable.

  This project argues that the "Fixed List" and "Pure Rhetoric" views represent ends of a spectrum, and the key lies in understanding the *dynamic interplay* between description and contrast. My hypothesis is that **the *primary* function in contemporary usage is contrastive, and the apparent "descriptive core" is often retrofitted or selectively invoked to serve this oppositional purpose, leading to inherent instability in the term's substantive meaning.**

  ### 3. Methodology: Tracking the Moving Target (Semester Plan - 14 Weeks)
  Given high school constraints, this project will employ qualitative discourse analysis focused on recent, high-visibility uses. Rigorous coding of a manageable sample (approx. 30 sources) is feasible and valuable, providing concrete evidence beyond pure philosophical argument.

  *   **Weeks 1-2: Foundation & Framework Development**
      *   Define key concepts: "Descriptive function" (invoking historical tradition, intrinsic qualities), "Contrastive function" (defining "us" vs. "them," identifying threats).
      *   Develop coding categories based on the hypothesis:
          1.  **Source Context:** Speaker/author identity (politician, commentator, academic, nationality/affiliation), audience, medium (speech, op-ed, debate transcript, policy document).
          2.  **The Contrasted "Them":** Who/What is explicitly positioned as the threat or opposite? (e.g., specific nation-state, ideology, internal group, abstract concept like "authoritarianism").
          3.  **Values Invoked:** What specific values are listed/implicitly tied to "Western values" in *this instance*? (e.g., free speech, democracy, rule of law, gender equality, Christian heritage, security, tolerance).
          4.  **Descriptive Anchors:** Is any historical, philosophical, or civilizational justification provided? (e.g., references to Magna Carta, Enlightenment, Cold War).
          5.  **Action Implied:** What policy or stance is the phrase used to justify?
      *   Identify diverse source types: Major political speeches (last 5 years), influential op-eds (across ideological spectrum), debate tournament transcripts (if accessible), key policy documents (e.g., NATO statements). Aim for variation in speaker perspective and contrasted "them".

  *   **Weeks 3-6: Source Collection & Initial Coding**
      *   Systematically gather ~30 relevant excerpts where "Western values" is centrally used.
      *   Code each excerpt using the predefined categories. Track patterns: Which values are invoked *most frequently* with *which specific contrasts*? How often is a descriptive anchor used? Is it consistent?

  *   **Weeks 7-9: Pattern Analysis & Hypothesis Testing**
      *   **Core Test (Contrast Swap):** Select key sentences/frameworks (e.g., "We must defend Western values against X"). Analyze how the specific values emphasized shift when X changes (e.g., defending against ISIS vs. defending against "wokeism" or "Chinese influence"). Does the substance of "Western values" meaningfully change with the opponent?
      *   **Secondary Test (Abandonment/Adoption):** Analyze instances discussing whether a Western country has "abandoned" its values or whether a non-Western country can "embody" them. What criteria are used? Is geography primary, or are the values treated as transferable ideals?
      *   **Quantify & Qualify:** Count frequencies of value-invocation linked to specific contrasts. Identify examples where descriptive anchors seem inconsistent with the advocated action or the contrast.

  *   **Weeks 10-12: Synthesis, Argument Development & Drafting**
      *   Synthesize findings: Does the evidence primarily support the "Contrastive Primacy" hypothesis, the "Descriptive Core" view, or a more nuanced middle ground?
      *   Develop the argument: Explain *how* the contrastive function operates and its implications for the term's coherence and use.
      *   Address counter-arguments (e.g., "Core values are constant; only the threats change" - does the data show this?).
      *   Draft the core research paper.

  *   **Weeks 13-14: Refinement, Deliverable Prep & Practice**
      *   Revise and polish the research paper (approx. 15-20 pages).
      *   Develop a concise, visually engaging presentation summarizing the question, method, key findings, and conclusion.
      *   **Create a Debate Resource:** A practical 1-2 page guide for debaters: "Deconstructing 'Western Values' Claims: Key Questions to Ask" (e.g., "Who is the 'them' here?", "What specific values are being emphasized *right now*?", "Is this consistent with other uses by the same side?", "Could this action be justified *without* invoking 'Western values'?").

  ### 4. Possible Conclusions & Deciding Considerations
  *   **Conclusion 1: Strong Contrastive Primacy:** The data shows the invoked values shift significantly based on the contrasted "them," with descriptive anchors being inconsistent or selectively applied. The term functions overwhelmingly as an identity marker defined by opposition, lacking a stable core. *Decider:* Consistent, demonstrable value-shifts correlated with changing opponents; minimal evidence of a fixed list guiding application across contexts.
  *   **Conclusion 2: Descriptive Core with Contrastive Adaptation:** A core set of values is frequently referenced, but their interpretation and relative emphasis are pragmatically adapted based on the perceived threat. The core exists but is flexible. *Decider:* Identification of a recurring cluster of values (e.g., democracy, rights) present across *most* uses, even if secondary values shift with the contrast; descriptive anchors are consistently relevant to the core.
  *   **Conclusion 3: Contextual Hybrid:** The function depends heavily on the speaker and context (e.g., academics lean descriptive, politicians lean contrastive). No single primary function dominates. *Decider:* Clear patterns linking source type/context to the strength of descriptive vs. contrastive elements in the usage.
  *   **Conclusion 4: Primarily Rhetorical with Residual Resonance:** While often cynically deployed, the phrase retains power because it successfully taps into genuine, albeit vague, identity-based feelings associated with a perceived tradition, even if the content is empty. *Decider:* Evidence of sincere conviction paired with demonstrable inconsistency and lack of descriptive anchoring; the phrase succeeds despite incoherence.

  ### 5. Deliverables
  1.  **Final Research Paper:** Presenting the question, methodology, detailed analysis of the coded examples, argumentation for the conclusion, and implications.
  2.  **Presentation:** For the end-of-semester showcase, summarizing the project engagingly.
  3.  **Debate Team Resource Guide:** A practical, actionable handout empowering debaters to critically analyze uses of "Western values" in real-time during prep and rounds.

  ### 6. Risks, Limitations & Mitigation
  *   **Sample Size & Representativeness (Major Risk):** 30 examples are manageable but small. Risk of missing broader trends or cherry-picking. *Mitigation:* Be transparent about the sample size and selection criteria. Aim for diversity within the sample (different speakers, contexts, opponents). Focus on *demonstrating the phenomenon exists* through clear examples, not claiming statistical universality.
  *   **Coding Subjectivity:** Defining "descriptive anchor" or categorizing implied values involves interpretation. *Mitigation:* Develop clear, explicit coding rules upfront. Consider having a peer or advisor code 2-3 examples independently to check consistency.
  *   **Scope Creep / Philosophical Quagmire:** Getting lost in historical debates about the Enlightenment or endless definitions. *Mitigation:* Strictly focus on *contemporary usage* (last 5-10 years). Ground analysis in the collected examples. Keep the functional question (descriptive vs. contrastive) central.
  *   **Overemphasis on "Success":** The project doesn't need to "prove" Contrastive Primacy definitively. Success is rigorously investigating the question using the proposed method and reaching a well-supported conclusion based on the evidence gathered, even if it's nuanced.
  *   **Time Management:** Collection and coding take time. *Mitigation:* Start source collection immediately after framework development. Stick to the week-by-week plan rigidly.

  This project offers a concrete path to investigate a pervasive but elusive concept. By focusing on the *function* of the term "Western values" in real-world discourse and employing systematic analysis of specific examples, it moves beyond superficial critiques to provide a determinate answer about *why* the term behaves so inconsistently, with tangible outputs useful for both academic understanding and practical debate application.
