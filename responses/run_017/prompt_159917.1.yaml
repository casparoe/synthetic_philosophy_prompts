  First, I need to unpack the various interpretations of this slogan. The user mentioned three instances: their original statement about prime probability, person (1) arguing against Bayesian updating for math based on computation time, and person (2) saying you should never bet against a claimed proof. They want a menu of distinct theses this slogan could represent, categorized as trivial, defensible, or false. They also want to know which interpretation each person needs for their argument and whether it holds up.

  Additionally, the user introduced their own concept of "bounded-coherence," which restricts Dutch book arguments to strategies that could have been predetermined. They want to know if this allows intermediate confidence in math facts, what it rules out, and whether it implies that confidence should improve with more computation.

  Starting with the interpretations, I should cover metaphysical, epistemological, and decision-theoretic angles. For example:
  - Trivial: Math propositions have objective truth values.
  - Defensible but substantive: Rational agents must assign credence 0 or 1 to decidable math statements.
  - False: No rational basis for probabilistic beliefs in undecided math facts.

  For person (1), who argues against Bayesian updating with computation, they likely rely on the substantive claim that more computation isn't evidence. But this fails because computational progress does provide evidence about the likelihood of a result, even if the truth is fixed.

  Person (2) needs the claim that once a proof is claimed, the probability should be 1. However, human proofs can be flawed, so intermediate credence is rational until verification.

  Now, addressing the user's bounded-coherence idea: It allows intermediate confidence because a Dutch book would require a strategy fixed in advance, which isn't possible without knowing the outcome. However, this concept might be too weak as it doesn't enforce probabilistic consistency over time or across related statements. It doesn't require that confidence improves with computation, though in practice, updating with evidence (like partial computations) would be rational under this framework.

  I need to ensure each point is clear, numbered, and categorized. The user emphasized avoiding "it depends," so each thesis needs a firm verdict. Also, explaining where the arguments of persons (1) and (2) fail is crucial. For bounded-coherence, clarifying its limitations and strengths will help the user see if their idea holds water.
answer: |-
  Here is a structured analysis of the slogan "you can't be uncertain about math — it's already either true or false, probabilities don't apply." I break down candidate readings, categorize them, then address Person 1, Person 2, and your bounded-coherence principle. Verdicts are bolded for clarity.

  ---

  ### **I. Candidate Readings of the Slogan: Menu & Verdicts**
  *(Sorted from weakest/trivial to strongest/substantive)*

  1. **Metaphysical triviality (about truth values):**  
     *Thesis:* Mathematical propositions have objective, timeless truth values (true or false) independent of human knowledge.  
     *Verdict:* **Trivial** (standard Platonism/formalism; uncontroversial).  
     *Why?:* Doesn’t address epistemology or rationality—only states math isn’t contingent.

  2. **Epistemic triviality (about ideal agents):**  
     *Thesis:* An omniscient agent would assign credence 1 to truths and 0 to falsehoods in math.  
     *Verdict:* **Trivial** (tautological for omniscience).  
     *Why?:* Says nothing about bounded agents like humans.

  3. **Proof as sole justifier:**  
     *Thesis:* Only a proof (or disproof) can *justify* certainty (credence 1 or 0); lacking proof, you lack justification for certainty.  
     *Verdict:* **Defensible-but-substantive** (e.g., aligns with some forms of intuitionism).  
     *Why?:* Rejects probabilistic justification but doesn’t forbid probabilistic *beliefs*.

  4. **No non-dogmatic certainty:**  
     *Thesis:* You cannot rationally be *certain* (credence 1) about an unproven math claim.  
     *Verdict:* **Defensible-but-substantive** (avoids Dutch books for non-omniscient agents).  
     *Why?:* Allows intermediate credences but forbids "premature" certainty.

  5. **Bayesian incoherence (strong):**  
     *Thesis:* Assigning any credence other than 0 or 1 to a math proposition is inherently irrational (violates coherence).  
     *Verdict:* **False** (contradicted by Dutch book arguments for bounded agents).  
     *Why?:* Standard Dutch books show intermediate credences are *required* for coherence if you lack proof.

  6. **No learning from computation (Person 1’s reading):**  
     *Thesis:* More computation (e.g., checking more divisors) cannot be *evidence* for a math claim because truth is timeless.  
     *Verdict:* **False** (misunderstands evidence).  
     *Why?:* Computation *is* evidence: e.g., failing to find a divisor raises the probability that none exists (under a reasonable prior).

  7. **Proof-claims demand certainty (Person 2’s reading):**  
     *Thesis:* If a proof is *claimed*, you must assign credence 1 (since it "either works or doesn’t").  
     *Verdict:* **False** (ignores human fallibility).  
     *Why?:* History shows claimed proofs often fail; rational agents weight confidence by source reliability.

  ---

  ### **II. How Person 1 and Person 2 Use the Slogan**
  - **Person 1 (Bayes shouldn’t update on computation):**  
    - *Needs reading #6:* Asserts computation isn’t evidence.  
    - *Does it deliver?* **No.** Truth being fixed doesn’t negate that computational *results* are evidence (e.g., "no divisor found" is likelier if the number is prime). Rational agents *must* update on such evidence.  
    - *Smuggled assumption:* That evidence requires ontological contingency (false—timeless truths can have empirical evidence).

  - **Person 2 (Never bet against a claimed proof):**  
    - *Needs reading #7:* Asserts claimed proofs deserve credence 1.  
    - *Does it deliver?* **No.** A claimed proof is not a verified proof; betting against flawed proofs is often rational (e.g., counterexamples exist).  
    - *Smuggled assumption:* That "proof exists" implies "proof is known/correct" (false—humans err).

  ---

  ### **III. Your Bounded-Coherence Principle: Analysis**
  **Definition recap:** A belief state is *bounded-coherent* if no *predetermined* betting strategy (fixed before any computation) guarantees a loss.  
  **Core question:** Does this allow intermediate confidence in math?  
  **Short answer: Yes, and it’s weak but meaningful.**

  1. **Does it rule out intermediate confidence?**  
     - **No.** Bounded-coherence *permits* intermediate credences (e.g., 70% prime).  
     - *Why?:* To Dutch-book you, a bookie would need a strategy fixed before knowing the outcome. But for undecided math, the outcome is unknown *to everyone* at the start—no strategy can exploit you without "cheating" (e.g., using more computation).  
     - *Example:* If you assign P(prime) = 0.7, no *predetermined* bet forces a loss—you win if prime, lose if composite, but the bookie can’t know which in advance.

  2. **Does it rule out anything?**  
     - **Yes, it rules out obvious blunders.**  
       - *Example 1:* Assigning P(prime) = 0.7 and P(composite) = 0.7 (violates probability axioms). A predetermined bet ("charge $0.70 to pay $1 if prime; charge $0.70 to pay $1 if composite") guarantees you lose $0.40.  
       - *Example 2:* Assigning P(prime) = 1 before finishing your search. A predetermined bet ("pay $1 if composite, charge $0") loses you $1 if composite.  
     - *Strength:* It enforces **static coherence** (avoiding sure losses at a single time) but not **dynamic coherence** (consistency when updating beliefs over time).

  3. **Does it require confidence to "get better" with computation?**  
     - **No direct requirement, but rational updating implies improvement.**  
       - Bounded-coherence doesn’t *force* you to update beliefs as computation progresses.  
       - However, if you *do* update, bounded-coherence + evidence (e.g., "no divisors below 10^7") demands you shift credence toward "prime" (via Bayes’ rule).  
       - *In what sense "better"?* Calibration: With good priors, your credence should track the empirical frequency of primes in similar searches (e.g., numbers with no small divisors are likelier prime).

  4. **Is your principle confused?**  
     - **Not confused, but incomplete:**  
       - *Strength:* It correctly avoids demanding omniscience (unlike strong readings #5–7).  
       - *Weakness:* It allows "stubborn" beliefs (e.g., refusing to update after seeing 10^7 divisor-free checks). Stronger coherence (e.g., Savage) adds dynamic constraints.  
       - *Key insight:* Your principle captures that **math uncertainty is "secretly" uncertainty about computations.** "70% prime" means "given my resources, the probability that *my search* would have found a divisor if one existed is 30%". This is testable and coherent.

  ---

  ### **Final Tally**
  - **Slogan’s defensible core:** Only readings #1–4 hold water. They assert trivialities (e.g., math has truths) or mild constraints (e.g., don’t be certain without proof).  
  - **Slogan’s errors:** Readings #5–7 are false and misused by Persons 1 & 2.  
  - **Your principle:** Bounded-coherence **allows and rationalizes** intermediate credences in math. It’s a minimal standard for bounded agents, enforcing static rationality but not prescribing dynamic behavior. To demand "better" updating, add Bayesian norms (which your principle doesn’t forbid). 

  This resolves your core frustration: The slogan overgeneralizes a metaphysical platitude to attack rational probabilistic reasoning. Bounded agents *must* use probabilities for undecided math—and your intuition about "70% prime" is both coherent and pragmatic.
