  **Where Tree Lacks Determinacy:**  
  - If a student answers inconsistently (e.g., Harbour Gauge=No but Two Valleys=No), they land in Leaf H (Mixed Contingency), which is underspecified.  
  - Mechanism distinctions (ratchet vs. administrative) require additional branching not possible with given cases.
