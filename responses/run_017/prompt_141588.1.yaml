  ### Decision Tree: Historical Contingency and Lock-In

  **Instructions:** For each case, answer the question based on your intuition about whether a small change would alter outcomes. Track three distinctions:  
  1. **Counterfactual Operation** (rewind: remove one event; replay: re-run entire sequence; perturbation: nudge one parameter).  
  2. **Outcome Identity** (token: exact duplicate; functional: same purpose, different design; coarse: similar in broad strokes only).  
  3. **Persistence Mechanism** (ratchet: self-reinforcing lock-in; redirection: one-off change; attractor: small differences wash out; administrative: categories/data shape perception).  

  ---

  #### Branch Nodes  
  1. **Harbour Gauge (1888)**: If the late member arrived on time (rewind), would the port have adopted standard *Y* instead of *X* and remained locked into *Y* for a century?  
     - **Yes** → Node 2  
     - **No** → Node 3  

  2. **Founding Memo**: If the official never adopted the filing scheme (rewind), would the same hardship category have been *invisible* for generations?  
     - **Yes** → Node 4  
     - **No** → Node 5  

  3. **Two Valleys**: If we re-ran each valley’s history 100 times (replay), would both *always* develop hierarchical irrigation bureaucracies?  
     - **Yes** → Node 6  
     - **No** → Node 7  

  4. **Delayed Envoy**: If the envoy arrived on time (rewind), would the fiscal terms of the 40-year-later settlement match the original treaty?  
     - **Yes** → Leaf G  
     - **No** → Leaf D  

  5. **Pension Convergence**: If labor unions were weaker in the fragmented-fund province (perturbation), would both still achieve near-universal *coverage* by 1960?  
     - **Yes** → Leaf C  
     - **No** → Leaf H  

  6. **Slow Follower**: If we re-ran history 100 times (replay), would both polities *always* develop a fiscal innovation?  
     - **Yes** → Leaf E  
     - **No** → Leaf H  

  7. **Rotating Chair**: If a different chair led the committee (perturbation), would policy *always* converge to a professional civil service?  
     - **Yes** → Leaf E  
     - **No** → Leaf H  

  ---

  #### Leaves (Named Positions)  
  - **Leaf A: Token Ratchet Lock-In**  
    - *Cases:* Harbour Gauge (Yes-Yes), Founding Memo (Yes-Yes).  
    - *Commitment:* History locks into specific tokens via self-reinforcement (ratchet). Outcome identity = token. Mechanism = ratchet.  
    - *Position:* Paul David (e.g., QWERTY).  

  - **Leaf C: Functional Inevitability**  
    - *Cases:* Two Valleys (Yes), Pension Convergence (Yes).  
    - *Commitment:* Same function always emerges, regardless of design. Outcome identity = functional. Mechanism = attractor.  
    - *Position:* Functionalist sociology/biology.  

  - **Leaf D: Coarse Inevitability**  
    - *Cases:* Delayed Envoy (No).  
    - *Commitment:* Outcomes are similar only in broad strokes; distribution/welfare diverge. Outcome identity = coarse. Mechanism = redirection.  
    - *Position:* Historical institutionalism (e.g., Thelen).  

  - **Leaf E: Attractor Convergence**  
    - *Cases:* Slow Follower (Yes), Rotating Chair (Yes).  
    - *Commitment:* Small changes wash out; system reverts to equilibrium. Outcome identity = functional. Mechanism = attractor.  
    - *Position:* Systems theory/evolutionary biology.  

  - **Leaf F: Administrative Path Dependence**  
    - *Cases:* Founding Memo (Yes-Yes *but* persistence due to categories, not substance).  
    - *Commitment:* Path dependence resides in data/categories, not outcomes. Outcome identity = token. Mechanism = administrative.  
    - *Position:* Bowker/Star (e.g., classification studies). *Unoccupied* in your cases (no branch leads here; requires distinguishing mechanism from ratchet).  

  - **Leaf G: No Lock-In**  
    - *Cases:* Delayed Envoy (Yes).  
    - *Commitment:* Token outcomes are inevitable; small changes don’t matter. Outcome identity = token. Mechanism = attractor.  
    - *Position:* Efficient-market history (uncommon; economists).  

  - **Leaf H: Mixed Contingency**  
    - *Cases:* Any combination not fitting above (e.g., Pension Convergence (No), Rotating Chair (No)).  
    - *Commitment:* Details are contingent, but broad functions are stable. Outcome identity = functional/coarse. Mechanism = varies.  
    - *Position:* Pragmatist synthesis (e.g., Pierson).  

  - **Leaf I: Token Contingency Without Lock-In**  
    - *Cases:* Harbour Gauge (Yes-No), Founding Memo (Yes-No).  
    - *Commitment:* Events alter tokens, but no ratchet enforces persistence. Outcome identity = token. Mechanism = redirection.  
    - *Unclaimed:* Incoherent (if tokens change without lock-in, later convergence implies functional/coarse identity).  

  ---

  ### Notes on Design  
  - **Unoccupied Combinations:**  
    - Token contingency without lock-in + functional identity (Leaf I): Incoherent—if tokens change but function persists, outcome identity isn’t token.  
    - Administrative path + coarse identity: Unattractive (categories constrain perception; diverging welfare irrelevant).  
  - **Indistinguishable Leaves:**  
    - Leaf A vs. Leaf F: Tree cannot separate ratchet lock-in from administrative lock-in (requires mechanism-specific question not in cases).  
  - **Clarifications:**  
    - "Same thing would happen anyway" is forced into token/functional/coarse.  
    - Counterfactuals flagged per node (e.g., Node 1 = rewind).  

