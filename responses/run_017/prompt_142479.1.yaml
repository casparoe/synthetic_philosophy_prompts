answer: |-
  1.  The Polaroids and tattoos directly embody the "multiple drafts" model: like neural signals, they are revisable records (Polaroids with added notes) or fixed interpretations (tattoos) that constitute Leonard's shifting reality, resisting a single "true" timeline of experience or memory.
  2.  The reversed colour sequences function as the initial "flash": the audience experiences the opening killing with an apparent meaning (Leonard's righteous vengeance), which the later black-and-white "flash" (Sammy/insulin reveal) forces them to retroactively reinterpret, mirroring the phi illusion's subjective timing.
  3.  Leonard's final decision to target Teddy acts as a Stalinesque verdict: he actively constructs the narrative ("I have to believe...") *before* the experience of finding Teddy, shaping future perception and action, showing narrative imposition isn't passive.
  4.  The film resists a clean Orwellian/Stalinesque split: Leonard's condition prevents a unified conscious subject experiencing revision, while the audience's experience blends both mechanisms—initial misinterpretation *is* genuine (Orwellian), but the film's structure dictates the ending (Stalinesque).
  5.  Memento adds ethical stakes and narrative scale: it extends the phi debate from milliseconds to complex human narrative, showing how malleable timing creates identity and moral responsibility ("We all lie to ourselves"), which the abstract phi case lacks.
