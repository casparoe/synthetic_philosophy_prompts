  The setup is the Bertrand chord thing: pick a chord of a circle at random, what is the probability it is longer than the side of the inscribed equilateral triangle. The three textbook ways of doing it (two uniform points on the circumference; uniform distance from the centre along a randomly chosen radius; uniform midpoint over the disk) give 1/3, 1/2 and 1/4, and the usual moral drawn is that the principle of indifference has no content until somebody hands you a parametrization. Sam thinks he has a fix, which he calls two-level indifference. Level one: a parametrization is admissible only if applying indifference to it respects every symmetry the problem statement itself has — rotations, rescalings, and, this is the part he insists on, the answer should not change if you reconceive the chord as the intersection of the circle with a randomly placed infinite line rather than as an object drawn inside the circle. Level two: whenever level one leaves more than one admissible parametrization, do not pick between them; be indifferent at the level of parametrizations and average the induced distributions with equal weights. So for the chord problem, if all three textbook parametrizations survive level one, you get (1/3 + 1/2 + 1/4)/3 = 13/36, roughly 0.36, and that is what you should say.

