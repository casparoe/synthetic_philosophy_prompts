   Crux 4: **Grid-of-gates / panpsychism**
     - IIT: "A grid of logic gates, if it has high Φ, is conscious. This is a necessary consequence of the theory and not a reductio because consciousness is a fundamental property of systems with high Φ, regardless of their substrate."
     - Critic: "The idea that a grid of logic gates (even with high Φ) is conscious is absurd and shows that Φ is not tracking what we mean by consciousness. This is a reductio ad absurdum of IIT."
