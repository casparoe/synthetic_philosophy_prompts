  ### Joint Statement: Adversarial Collaboration on IIT  
  *Agreed upon by IIT-curious and critic participants*  

  ---

  #### **I. Agreed Claims**  
  *Substantive, non-filler agreements phrased neutrally. "Real agreement" denotes consensus on facts; "agreement to stop fighting" denotes shared framing without full endorsement of implications.*  

  1. **Neural substrate specificity**: Neuron count alone cannot explain why some structures (e.g., cortex) are critical for consciousness while others (e.g., cerebellum) are not. Any theory must account for this contrast. (*Real agreement*)  
  2. **Split-brain cases as discriminative**: Split-brain phenomena (and analogous disconnections) are pivotal for testing theories, as they reveal where theories diverge rather than converge. (*Real agreement*)  
  3. **Problem of simple systems**: Attributing experience to minimally complex systems (e.g., a thermostat) is a substantive cost for any theory—even if proponents accept it as necessary, critics view it as a flaw. (*Agreement to stop fighting*)  
  4. **Uncomputability undermines scientific utility**: A theory’s core quantity (e.g., Φ) being practically uncomputable for biological brains weakens its testability and scientific standing, regardless of its truth. (*Real agreement*)  
  5. **Causal structure is central**: Consciousness depends on the causal architecture of a system, not just its input-output behavior or functional role. (*Real agreement*)  
  6. **Exclusion is non-trivial**: The postulate that consciousness excludes overlapping systems is a substantive claim with empirical consequences, not a tautology. (*Real agreement*)  
  7. **Reportability ≠ consciousness**: Global availability for report is a proxy for consciousness, not constitutive of it; theories must address cases where they dissociate (e.g., dreaming). (*Agreement to stop fighting*)  
  8. **Hard problem as the target**: A theory must address why certain processes generate subjective experience (the hard problem), not merely correlate with behavior. (*Real agreement*)  
  9. **Empirical anchors are essential**: Predictions must be testable in principle (e.g., via neural interventions), even if challenging in practice. (*Real agreement*)  

  ---

  #### **II. Disagreements Table**  
  *Cruxes with each side’s formulation, a shared test case, predictions, and movement conditions. "Moved if" denotes which side would reconsider their position if the prediction fails.*  

  | **Crux**                | **IIT-Side Formulation**                                                                                                                                 | **Critic’s Formulation**                                                                                                                                                     | **Shared Test Case**                                                                 | **IIT Prediction**                                  | **Critic Prediction**                                 | **Moved if wrong?**        |  
  |-------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------|-----------------------------------------------------|-------------------------------------------------------|----------------------------|  
  | **Verbal dispute?**     | "Consciousness is *defined* as integrated information (Φ). Disagreements arise because critics conflate consciousness with global availability for report." | "IIT redefines ‘consciousness’ as Φ. Critics focus on phenomenal experience; the dispute is verbal where IIT conflates integration with subjectivity, but non-verbal on whether Φ tracks experience." | Case: A system with high Φ but severed from global report (e.g., isolated cortex during anesthesia). | System has unreportable experience (high Φ = consciousness). | System lacks experience (Φ ≠ subjectivity). | Critics if experience confirmed; IIT if falsified. |  
  | **Throttled-bridge**    | "A slow, narrow cortical bridge (e.g., 1 bit/sec) splits the system into two Φ-maximizing complexes: the subject becomes two distinct, degraded consciousnesses." | "The subject remains a single agent; unity persists via slow integration. Fragmentation requires stronger disconnection."                                                    | Human/animal subject with throttled interhemispheric bridge. Measure integration (e.g., EEG sync) and behavior (e.g., conflicting responses). | Two independent consciousnesses (split-like behavior). | One consciousness with delayed/unified responses. | IIT if unity persists; critics if fragmentation occurs. |  
  | **Duplicate-graft**     | "A duplicated cortical slab running in lockstep adds zero Φ (no new cause-effect power). Exclusion applies: experience does not double."                 | "Duplication doubles the physical substrate; experience should double. If not, IIT’s exclusion is an *ad hoc* fix for panpsychism."                                         | Graft duplicate tissue (e.g., somatosensory cortex) in lockstep. Test experiential intensity (e.g., pain perception). | No change in experience (exclusion). | Experience doubles (or new qualities emerge). | Critics if no change; IIT if doubling. |  
  | **Grid-of-gates / Panpsychism** | "A high-Φ grid of logic gates *is* conscious. This is a defensible consequence of consciousness being fundamental to integrated systems."                | "Attributing consciousness to a gate grid is a *reductio*; it reveals IIT’s disconnect from phenomenology. Panpsychism is smuggled in, not derived."                        | Construct a high-Φ digital system (per IIT calculations). Assess if it exhibits experiential markers (e.g., no report paradox). | Grid is conscious (Φ suffices). | Grid lacks experience (Φ insufficient). | Critics if IIT succeeds elsewhere; IIT only if Φ fails in brains. |  
  | **Zap-and-EEG complexity** | "Perturbational complexity (e.g., PCI) is a valid Φ proxy. It discriminates IIT from rivals by measuring integrated causation, not just differentiation." | "EEG complexity reflects general information processing (e.g., global workspace). Both sides predict it; it doesn’t test exclusion or Φ’s uniqueness."                     | Measure complexity during exclusion-violating states (e.g., duplicate-graft or throttled-bridge). | Complexity drops when Φ drops (e.g., lockstep graft). | Complexity unchanged if processing persists. | IIT if no drop; critics if drop occurs. |  

  ---

  #### **Concessions on Remaining Disagreement**  
  - **IIT side concedes**: Critics’ emphasis on the "hard problem" is legitimate; IIT’s panpsychist implications are counterintuitive and demand rigorous justification beyond mathematical coherence.  
  - **Critics concede**: IIT’s causal-structural approach addresses gaps in rival theories (e.g., global workspace), and its falsifiable predictions (e.g., exclusion in duplicate-graft) merit empirical engagement.  

  ---  
  *End of joint statement (2 pages).*
