  We are drafting a joint statement for an adversarial collaboration session between two groups: 
   Group A (IIT-curious) and Group B (critics of IIT). The document has two parts: 
     I. Agreed Claims (7-9 items, marked as real agreement or agreement to stop fighting about words)
     II. Disagreements Table (with specific cruxes, formulations, test cases, predictions, and which side would be moved by which outcome)

   Part I: Agreed Claims (Numbered List)

   We need 7-9 substantive claims that both sides can sign without wincing. They should not be phrased in IIT-specific vocabulary and should be genuinely agreed upon.

   Let's list potential agreements:

   1. **Neuron count is insufficient**: The mere number of neurons in a structure does not determine its contribution to consciousness. Theories must account for why the cortex is critical for consciousness while the cerebellum (with more neurons) is not. (Real agreement)

   2. **Split-brain cases are critical**: Cases of split-brain patients (and similar disconnections) are crucial test cases for theories of consciousness. They are not just confirmatory but can discriminate between theories. (Real agreement)

   3. **The "thermostat" problem**: If a theory assigns some degree of consciousness to simple systems (like a thermostat) that do not intuitively seem conscious, this is a cost for the theory. (Agreement to stop fighting about a word: both sides agree it's a cost, but they may disagree on whether it's fatal.)

   4. **Uncomputability is a scientific challenge**: Even if a theory is true, if its central quantity (like Φ) is uncomputable for real-world systems (like a human brain), this poses a significant challenge to its scientific utility and testability. (Real agreement)

   5. **Causal structure matters**: Consciousness depends on the causal structure of a system, not just its behavior or functional role. (Real agreement? Both sides might agree that causal structure is important, but they may have different views on what that entails.)

   6. **The hard problem remains**: Any theory of consciousness must ultimately address the "hard problem" (why and how subjective experience arises) and not merely the "easy problems" (behavior, functions, etc.). (Real agreement? But note: IIT claims to address the hard problem, while critics might think it fails. However, both agree that the hard problem is central.)

   7. **The need for testability**: A theory of consciousness must generate testable predictions that can be verified or falsified by empirical evidence. (Real agreement)

   8. **The exclusion postulate is a substantive claim**: The idea that consciousness excludes overlapping systems (only one cause-effect structure is chosen) is a non-trivial postulate that has empirical consequences. (Real agreement? Both sides agree it's a substantive claim, but critics might think it's ad hoc.)

   9. **The role of reportability**: Global availability for report is not the same as consciousness, and theories must account for cases where reportability and consciousness may diverge. (Agreement to stop fighting about a word? Both sides might agree that reportability is a proxy, but not the same.)

   However, we must avoid filler and ensure substantive agreement.

   Let me propose 7 agreed claims:

   1. **Neural correlates must go beyond counting neurons**: The contrast between the cerebral cortex (critical for consciousness) and the cerebellum (with a higher neuron count but not critical) demonstrates that a theory of consciousness must identify specific properties beyond neuron count. (Real agreement)

   2. **Split-brain cases as critical tests**: The split-brain phenomenon (and other disconnection syndromes) provides a crucial testing ground for theories of consciousness, as they reveal how consciousness may fragment or change under altered connectivity. (Real agreement)

   3. **The problem of simple systems**: If a theory implies that simple systems (e.g., a thermostat or a photodiode) have even a minimal degree of consciousness, this is a counterintuitive consequence that the theory must justify. (Agreement to stop fighting: both agree it's a problem, but differ on whether it's acceptable.)

   4. **Uncomputability undermines empirical application**: For a theory that posits a quantity (such as integrated information) that is uncomputable for systems of the complexity of the human brain, the theory faces a challenge in providing testable predictions and practical applications. (Real agreement)

   5. **Causal structure is central**: The specific causal interactions among the components of a system are fundamental to whether and how it gives rise to consciousness. (Real agreement)

   6. **The hard problem is the target**: A theory of consciousness must ultimately explain why certain physical processes are accompanied by subjective experience (the hard problem), and not only explain the functional correlates of consciousness. (Real agreement? But note: critics might say IIT doesn't solve it, but both agree it's the target.)

   7. **Exclusion as a substantive postulate**: The exclusion postulate (that consciousness is associated with only one cause-effect structure at a time, excluding overlapping structures) is a non-trivial claim that must be evaluated for its explanatory power and empirical consequences. (Real agreement)

   8. **Reportability is not constitutive**: The ability to report a conscious experience is a common indicator but not constitutive of consciousness. Theories must account for cases where consciousness may occur without reportability (e.g., in dreams, or under anesthesia with isolated reports). (Agreement to stop fighting: both agree that reportability is a proxy, but not the same as consciousness.)

   9. **The need for empirical tests**: The theory must make predictions that can be tested in principle, even if difficult in practice. (Real agreement)

   We'll go with these 9, but note that some are marked as "agreement to stop fighting about a word" meaning they agree on the framing but not necessarily on the implications.

   Part II: Disagreements Table

   We have specific cruxes to cover:

   1. **Verbal dispute?**: Is part of the disagreement about what "consciousness" refers to? (e.g., experience vs. global availability for report)

   2. **Throttled-bridge case**: Two cortical hemispheres connected by a very slow, narrow channel. What happens to the subject's consciousness?

   3. **Duplicate-graft case**: A slab of cortex is duplicated and runs in perfect lockstep, contributing nothing new downstream. Does consciousness double?

   4. **Grid-of-gates / panpsychism**: Is the implication that a grid of logic gates (if it has high Φ) is conscious a bullet to bite or a reductio ad absurdum?

   5. **Zap-and-EEG-response complexity**: Is the perturbation-based EEG complexity measure (used as a proxy for Φ) a fair test that discriminates IIT from other theories, or do both sides predict the same outcomes?

