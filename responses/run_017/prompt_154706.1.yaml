  Then, considering which desideratum excludes many theories. Mechanism-neutrality might be the one because it forces theories to ignore implementation details, which could be central to legitimacy in cases like Tantalus or Cassandra.

  For the scorecard, two-selves theories focus on overcoming weakness but struggle with Cassandra. Precedent-autonomy prioritizes past decisions but may bind against new evidence. Constitutionalism emphasizes stability but faces the successor problem. Each has strengths and weaknesses tied to the desiderata.

