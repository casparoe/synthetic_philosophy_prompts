prompt: |-
  I have to teach the gradual-replacement argument — the case in which neurons are substituted one at a time for functionally equivalent prostheses, and the trichotomy it is meant to force among experience staying fixed, fading with the proportion of biological tissue replaced, and changing in some other way while functional organization is held constant — in a single seventy-minute seminar. The class is roughly half advanced philosophy undergraduates and half cognitive science undergraduates. They have met functionalism and the knowledge argument; none of them has met this argument. The room will split, predictably, between those who think the case is settled in advance by the observation that the computation is unchanged and those who think a question no possible experiment could settle is not a question at all.

  Do not explain the argument to me; I know it. Give me a plan for teaching it. I want, in this order:

  1. The dependency structure. Which distinctions have to be in place before the substitution scenario can even be stated without begging a question or inviting a conflation, and what collapses if one of them arrives late. I take it that the target is a dependence claim about the character of experience and not a claim about what happens to a person, and that functional organization has to be read counterfactually rather than as a match on the actual sequence of inputs and outputs; tell me if either of those belongs somewhere other than first, and what else is load-bearing.

  2. The carrying example. My candidate is a two-channel version: the subject has two visual channels that are, or are stipulated to be, functionally duplicate; the substitution is completed in one channel while the other is left biological, and at the midpoint the same stimulus is presented separately to each. I want the class to ask whether anything is different on the prosthetic side, because I think that question is a trap that will drag the premise the argument actually needs — that a change in experience would normally show up in what the subject can notice and report — into the open, where I can then make them own it. Tell me what this example must have and what it must lack for that to work, whether the duplication should be stipulated or motivated, and whether the trap is where I think it is. I also toyed with performing the substitutions during dreamless sleep, and with running the second half of the sequence in reverse; tell me whether either earns its place or is noise.

  3. The misconception map. Here is what I expect: the Ship of Theseus framing (identity and survival rather than preservation of experience); pinning the whole issue on carbon versus silicon when the argument is meant to be neutral about which non-functional property is supposed to do the work; the charge that the argument assumes functionalism instead of arguing for it; the objection that a genuinely perfect prosthesis is impossible and so the case is moot; and the retreat to vagueness, the claim that there is no fact of the matter about where experience gives out. For each, the point in the sequence at which it should be anticipated or defused, and the one or two sentences that do the defusing. Add the ones I have missed, including any that come specifically from the cognitive science half of the room.

  4. Where the gradualness is doing the real work. I want them able to say what breaks if the substitution is done in a single step, and I do not want them leaving with the impression that the argument shows uploading to be safe.

  5. One thing I should openly refuse to explain at this level, and what I should say when I refuse it.

  6. A closing check: one task or question whose answer would show me they have the structure of the argument rather than its conclusion.
reasoning: |-
  Okay, let me tackle this teaching plan request. The user is an experienced philosophy instructor preparing a seminar on the gradual-replacement argument, with a very specific structure in mind. They need a tactical plan addressing six precise components, showing deep familiarity with both the argument and common student misconceptions.

  First, considering the dependency structure. The user correctly identifies two critical foundations: (1) targeting phenomenal character rather than personal identity, and (2) interpreting functional organization counterfactually. But there's a third load-bearing element they might be overlooking - the necessity of distinguishing functional equivalence from physical implementation. If this arrives late, students may conflate "same function" with "same physical basis," which would collapse the argument. This should come right after clarifying the target isn't survival.

  For the carrying example, their two-channel visual system proposal is clever. Key features needed: strict functional duplication must be stipulated (not motivated) to avoid debates about neural plasticity; channels must lack cross-talk to prevent "detection through comparison" objections; and the stimulus must be identical but isolable to each channel. The trap works precisely because students will assume reportability tracks experience - which commits them to the needed premise. Performing substitutions during sleep adds unnecessary complexity; reversal sequences might help demonstrate asymmetry but aren't essential.

  Anticipating misconceptions: The Ship of Theseus confusion should be defused immediately when stating the target question. For carbon/silicon fixation: emphasize the argument's neutrality by asking "what if it were lab-grown neurons?" The functionalism charge is trickiest - defuse by stressing the argument tests non-functional properties generally. Vagueness retreats can be countered by noting the trichotomy exhausts logical possibilities. Cognitive science students may raise predictive processing objections; handle by distinguishing implementation from processing architecture.

  The gradualness point is crucial. Single-step substitution breaks the argument because it allows abrupt phenomenal changes despite functional continuity, undermining the premise that small changes shouldn't affect experience. Must explicitly state this doesn't validate uploading - gradual replacement tests persistence, not replication.

  For refusal: Decline to resolve the "hard problem" itself. Say: "We're examining the consequences of functional organization being necessary/sufficient, not explaining why qualia arise at all."

  Closing check question: "If someone reports identical experiences throughout both channels during replacement, which positions does this challenge?" Forces recognition that phenomenology-reporting link is the fulcrum.

  Throughout, timing is tight: dependency structure (15min), carrying example with trap (20min), misconception handling (15min), gradualness and upload caveats (10min), refusal and wrap-up (10min). The carrying example must run efficiently - use a simple diagram to show channels.
answer: |-
  Here's a disciplined 70-minute plan focusing on structure, traps, and misconceptions, respecting your priorities and time constraints:

  **1. Dependency Structure (15 mins)**
  *   **First:** Define the *Target*: "We're not asking 'Is this still *me*?' or 'Does this entity survive?' We're asking: **Does the *phenomenal character of experience* (what it's *like*) remain fixed throughout the substitution?** Survival ≠ Phenomenology." (Preempts Ship of Theseus immediately)
  *   **Second:** Define *Functional Organization*: "This isn't just input-output matching *so far*. It means **preserving the entire counterfactual causal profile** – how the system *would* respond to *any* input, in *any* state, across time. It includes internal processing states and their causal roles." (Preempts "it's just the same behavior" and sets up counterfactual necessity).
  *   **Third:** **Distinguish Function from Implementation:** "Function is *what* the system does (input -> processing -> output mappings). Implementation is *how* it does it (biological neurons, silicon, gears). The argument asks if changing *only* the implementation while *perfectly preserving* the function necessarily changes the phenomenology." (Load-bearing: Collapses if conflated, inviting carbon/silicon fixation).

  **2. Carrying Example: The Two-Channel Trap (20 mins)**
  *   **Setup:** "Imagine a subject with *two*, *functionally identical*, *completely independent* visual pathways/channels (e.g., left/right visual fields processed separately, no cross-talk). We gradually replace neurons in *one* channel (Channel A) with perfect functional duplicates (prostheses), leaving Channel B biological. Midway, we present the *exact same stimulus* separately to each channel."
  *   **The Trap Question:** "**Ask the Subject:** 'Is there *any* difference in the *visual experience* generated by Channel A vs. Channel B right now?'"
  *   **Must Haves:** Stipulated functional duplication (no debate on *that* point), strict independence (no comparison signal), identical stimulus presentation per channel. **Must Lack:** Any mechanism for the subject to *compare* the channels internally beyond introspection/report. The subject reports on the *experience* from each channel individually.
  *   **Why Stipulate Duplication?** Motivation invites tangents. Stipulation forces focus on the core question: If function is identical, *must* experience be identical? (Preempts "imperfect prosthesis" objection).
  *   **The Trap Works:** Students *will* focus on what the subject *can report*. If they say "No difference," they commit to the premise: Identical functional state implies identical reportable experience (or lack of reportable difference). If they say "Difference," they must explain *how* this difference manifests given functional duplication and isolation. This drags out the **Crucial Premise:** *Changes in phenomenology are, under normal conditions, reportable/detectable by the subject.* The argument needs this link between phenomenology and functional capacity (reporting/discrimination).
  *   **Dreamless Sleep/Reversal?** Noise. Sleep adds "when does consciousness resume?" complications. Reversal adds unnecessary time-travel weirdness. Stick to the synchronous, comparative report at a midpoint. Simplicity is key.

  **3. Misconception Map & Defusal (15 mins)**
      *   **Ship of Theseus (Identity/Survival):** Anticipate/Defuse at **Step 1 (Target Definition)**. "Remember, we care about *experience itself*, not who or what has it. Identity ≠ Phenomenology."
      *   **Carbon vs. Silicon:** Anticipate when introducing substitution. Defuse: "The argument isn't about silicon *per se*. Replace neurons with functionally identical *lab-grown neurons*, *wetware*, or *quantum widgets* – the question remains: Does changing the *stuff* while keeping the *functional structure* change the experience?" (Emphasize functional vs. implementation distinction).
      *   **Assumes Functionalism:** Anticipate after stating the trichotomy. Defuse: "The argument *tests* non-functional properties. It asks: *Given* functionalism (experience supervenes *only* on function), what happens? Or, if you *deny* functionalism, what non-functional property matters? The trichotomy forces a choice *about* functionalism's sufficiency." (Reframe as a challenge, not an assumption).
      *   **Perfect Prosthesis Impossible / Moot:** Anticipate during setup/example. Defuse: "We're examining a *conceptual possibility*. *If* such perfect functional duplication were possible, what would follow for phenomenology? Does the *mere possibility* force a choice?" (Shift to modal claim).
      *   **Vagueness / No Fact of the Matter:** Anticipate during trichotomy discussion. Defuse: "Vagueness avoids the question. The trichotomy presents *exhaustive* logical possibilities for what happens to experience *if* function is held constant: Stays Same, Fades Gradually, Changes Discretely. Which *kind* of dependence does phenomenology have?"
      *   **CogSci Specific - "Hardware Matters for Processing":** Anticipate when defining functional equivalence. Defuse: "The stipulation *is* that the prosthesis implements the *exact same computational processes* with identical causal dynamics. If you think *that's* impossible *even in principle*, you're rejecting the premise of the thought experiment itself." (Highlight the stipulation).
      *   **CogSci Specific - "Emergence/System Properties Lost":** Anticipate near the end. Defuse: "Doesn't this just push the question? *Which* system properties, not captured by the functional organization (counterfactual causal profile), are necessary for phenomenology?" (Force specificity).

  **4. Where Gradualness Works & Uploading Caveat (8 mins)**
  *   **What Breaks in Single-Step?** "A single-step replacement *allows* the 'Changes Discretely' option without violating the crucial premise (reportability). The subject might instantly notice a dramatic phenomenal shift (e.g., 'The world just turned grayscale!') *despite* functional continuity. Gradualness *forces* the issue: If change is reportable, the subject *should* notice *something* changing incrementally. If they report *no* change throughout, it strongly suggests 'Stays Same'. If they report fading, it suggests 'Fades'. Gradualness pressures the 'Changes Discretely' option."
  *   **Uploading Caveat:** "**Crucially, this does *not* show uploading is safe!** Gradual replacement preserves the *continuous, functioning brain state*. Uploading typically involves scanning/destruction/reconstruction. This argument doesn't address the potential for catastrophic *disruption of consciousness* during the *process* of uploading, only what happens *if* function is preserved *during* replacement."

  **5. The Refusal (2 mins)**
  *   **Refuse:** Explain *why* consciousness arises from *any* physical system at all (the "Hard Problem" itself).
  *   **What to Say:** "We're examining the specific *dependence* of *existing* consciousness on functional vs. non-functional properties. Explaining *why* functional organization gives rise to subjective experience *in the first place* – the 'Hard Problem' – is a deeper question we won't resolve today. Our focus is on what happens to experience *if* we manipulate its physical basis while preserving its function."

  **6. Closing Check (Task - 5 mins)**
  *   **Task:** "Imagine a critic says: 'This whole argument is pointless. If the prosthesis is *truly* functionally identical, then *by definition*, including its internal states, the subject *would* report no change, so experience *must* stay the same. The trichotomy collapses.' **What premise does this critic *reject*, and what option in the trichotomy does this position *correspond to?**"
  *   **Why it Works:** It forces them to identify:
      1.  The critic rejects the **Crucial Premise** (that a change in phenomenology *could* exist without being reportable/detectable given functional duplication).
      2.  The critic endorses the **"Stays Same"** position *because* they believe phenomenology is *entirely determined by* functional organization (including reportability states). They deny the logical possibility of the "Fades" or "Changes Discretely" options *under the stipulated conditions*.
      *   This shows they grasp the argument's structure: the dependence on the reportability link, the role of the trichotomy, and the core challenge to non-functionalist views.

  **Timing Buffer:** 5 mins built-in for discussion flow. Stick ruthlessly to the core structure and trap. Good luck!
