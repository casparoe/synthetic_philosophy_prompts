prompt: |-
  I work in generative modelling — diffusion samplers, temperature and guidance schedules, mode collapse, distribution drift, and, lately, the awkward problem of training one model on the outputs of an earlier one. A friend in evolutionary anthropology dragged me into an argument about whether culture is a Darwinian process, and I ended up reading around in it. Three positions seem to recur: the memetics of Dawkins and Dennett, on which cultural items are genuine replicators with their own fidelity, fecundity and longevity; Sperber's cultural attraction theory, on which transmission is reconstruction rather than copying and the stable things are attractors in a space of possible variants; and Boyd and Richerson's dual inheritance framework, which borrows population-genetic machinery and a taxonomy of transmission biases without needing a strict replicator. I am fluent in my own vocabulary and have essentially no formal biology, so please define anything you take from population genetics rather than assuming it.

  My temptation is to translate the whole debate into sampler language, and it goes suspiciously well at first: a transmission event looks like drawing a sample at nonzero temperature, a cultural attractor looks like a mode that the denoising dynamics pulls toward, guided variation looks like a biased proposal distribution, content and context biases look like, respectively, a reweighting of the target and a distortion introduced by the channel, and a transmission chain looks exactly like my own field's current pathology of iterated fine-tuning on synthetic data, where the tails of the distribution get eaten and everything collapses onto a few fat modes. Where it stops working is the notion of fitness. In my vocabulary a distribution is tied to a loss and a training objective, and there is no analogue for the thing that makes a cultural variant spread, because in culture the mechanisms that transform variants and the mechanisms that select among them are the same mechanisms, and the analogues I can build for the interesting claims — the replicator–interactor distinction, the claim that cumulative culture needs a fidelity threshold that ordinary transmission does not supply, the claim that cultural evolution is Lamarckian in a way genetic evolution is not, and the difference between selection for a trait and mere selection of it — all seem to smuggle in an objective function that isn't there.

  So I would like a disciplined translation and, more importantly, a residue report. Please give me the three positions restated as faithfully as you can in the vocabulary of generative modelling, and then tell me, item by item, which claims map cleanly, which survive only with distortion, and which have no expression in that vocabulary at all — don't quietly import my framework's assumptions and call them translation. I especially want your view on whether the residue is a defect of my vocabulary or a sign that the question of whether culture is really Darwinian is less sharp than the literature makes it sound, and on whether my mapping of a transmission chain onto iterated synthetic-data training carries the substantive part of that question or is just a pun that happens to feel illuminating. I am not asking for further reading or references. Please answer as exactly five numbered items, each one or two sentences, with no introduction and no concluding summary, covering in order: the replicator–interactor distinction; what memetics and cultural attraction theory are actually disagreeing about; what the transmission biases and guided variation become; what cannot be said in my vocabulary at all, with the fidelity threshold addressed explicitly; and your verdict on the residue, including your verdict on my synthetic-data mapping.
reasoning: |-
  Okay, the user works in generative modeling and wants to map evolutionary anthropology concepts into that framework. They mentioned diffusion samplers, temperature, guidance schedules—so I need to use terms like denoising steps, loss functions, and mode collapse. Their challenge is with "fitness" in cultural evolution, which doesn't have a direct analogue in their models.

  First, the replicator-interactor distinction. In biology, replicators copy information, while interactors express traits that selection acts on. In generative models, the model weights are like replicators because they store the learned distribution. Generated samples are interactors since they're what get selected or modified during training. That maps well, but biological fitness isn't tied to a loss function, so there's a gap here.

  Next, memetics vs. cultural attraction theory. Memetics sees cultural units as replicators with high fidelity, like copying files. Cultural attraction is more like reconstruction with each step, similar to a denoising process pulling towards attractors. The core disagreement is about copying fidelity—memetics assumes it, while attraction theory says it's reconstruction. This maps cleanly to generative models: strict sampling vs. iterative denoising with biases.

  Transmission biases and guided variation become proposal distributions and biased sampling. Guided variation is like modifying samples before passing them on, which fits as a biased proposal. Content bias is loss reweighting, context bias is channel distortion. These analogies hold up well.

  The fidelity threshold and Lamarckian inheritance don't translate. Fidelity threshold requires a clear replicator with measurable fidelity, but in generative models, each step is reconstruction, not copying. Cumulative culture's fidelity isn't captured. Lamarckian inheritance involves directed changes based on experience, which in models would require loss gradients during inference, which doesn't happen. These concepts can't be expressed without adding new mechanisms.

  Residue analysis: The gaps (fitness, fidelity, Lamarckism) show limitations in the generative model vocabulary, not just fuzzy definitions. The synthetic-data training analogy works for distribution collapse but misses the intentionality in cultural transmission. It's a substantive parallel for collapse but oversimplifies the selection mechanisms. The user needs to know where their framework falls short, especially regarding external selection pressures.
answer: |-
  1.  **Replicator-interactor distinction:** In generative modelling, the *replicator* maps to the learned parameters (or latent representation) of the model itself, encoding the distribution; the *interactor* maps to the generated samples (cultural outputs) which are subject to selection pressures (differential retention/discard by humans) influencing which parameters get updated in subsequent "training" (cultural transmission events). This maps cleanly *structurally*, but distorts by implicitly tying "fitness" (selection differential) to a loss function inherent to the training process, unlike biology/culture where selection is an external pressure.
  2.  **Memetics vs. cultural attraction disagreement:** Memetics posits cultural transmission as high-fidelity sampling (near-copying) from a source distribution, assuming a replicator exists; cultural attraction theory posits transmission as reconstruction via denoising dynamics biased by cognitive/social attractors, rejecting a strict replicator. The core disagreement maps cleanly: it's the difference between assuming transmission is direct sampling (potentially with noise) versus assuming it's inherently a biased generative process pulling toward attractor modes.
  3.  **Transmission biases & guided variation:** Transmission biases (content/context) map directly to mechanisms modifying the *sampling process*: content bias is reweighting the target distribution during inference (e.g., classifier guidance favouring certain features), context bias is a distortion applied to the input/output (channel noise or systematic bias). Guided variation maps cleanly to a human actively modifying a sampled output (cultural item) *before* passing it on, acting as a heavily biased proposal distribution for the next "transmission" step.
  4.  **Unmappable concepts (explicit fidelity threshold):** The *fidelity threshold for cumulative culture* (requiring near-perfect replication) and strict *Lamarckian inheritance* (direct encoding of acquired characteristics into the "replicator") have no analogue. Your framework inherently uses *reconstruction* (denoising/generation) at each step, not replication; "fidelity" is emergent stability of modes under dynamics, not a property of copied units. The concept of *fitness* as an external selector *independent* of the generation/transmission mechanism also has no expression, as your "selection" is always tied to the training objective/loss.
  5.  **Residue verdict:** The residue (fidelity threshold, Lamarckism, external fitness) is primarily a *defect of your vocabulary*, revealing its limitations for describing systems lacking an explicit loss function and relying on replication. Your synthetic-data mapping *carries substantive weight* for distribution drift/collapse under iterated reconstruction (transmission chains), but is *inadequate* for capturing selection dynamics and the replicator fidelity central to the "Darwinian" debate; it illuminates pathology, not the mechanism of adaptive evolution.
