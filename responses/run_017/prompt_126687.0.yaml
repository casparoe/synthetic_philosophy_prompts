prompt: |-
  Hey — I write historical novels about real people who are long dead. My current one is about a labor organizer, Ada Kowalczyk, dead since 1961; before that it was a 1919 newsroom book. I'm not writing straight biography and I'm not writing about anyone living: I invent scenes, dialogue, and inner life, a dozen or so times a book. I've been deciding each one by gut and I'd like an actual procedure instead.

  What I need is something I can run in an afternoon per scene, by myself, no philosophy degree, and where the final call is still mine — I have an editor and sometimes an estate lawyer, but neither of them answers the question I actually have, which is whether this is okay *to her*. Legal clearance is a different question, and I've stopped believing the "this is a work of fiction" line on the copyright page does any work at all. I've heard people say the dead can't be harmed so nothing is owed, and other people say they have interests that outlive them; I don't need to settle that in the abstract, I need it turned into steps.

  So: give me the questions in order, what counts as a good enough answer to each, where the answer is stop-don't-write-it, where it's pass, and where it hands the decision back to me because it's a values call no procedure can close. Things I keep getting stuck on and want the procedure to actually handle rather than hand-wave:

  - scenes where the historical record is silent versus scenes that go against what the letters and papers actually say
  - making her *better* than the documents support, not worse — the flattering invention, which nobody ever warns you about because all the rules are about defamation
  - the fact that a vivid scene is very hard for a reader to un-remember, so an authors note in the back basically never gets it back
  - whether it matters that she had a project she gave her life to (forty years arguing that nonviolence works) and I'd be showing her privately not believing it, which seems to defeat something she actually aimed at even though nothing happens to her now
  - where living descendants come in, if at all, and what kind of claim is theirs as opposed to borrowed

  Then run it on three scenes from my draft: (1) she sits up all night with a scab's sick kid the night before a strike vote — never happened, but it's exactly the kind of thing her letters show her doing; (2) I definately want her to have an affair with the married editor who printed her pieces, which would make the book work structurally; (3) a private conversation with her sister where she admits the whole movement was a mistake, and every surviving letter says the opposite.

  I want at least one of those to come out as an answer I dont like, ideally on the scene I most want to keep. And tell me what this kind of procedure is structurally blind to — what it can't see no matter how well it's built.
reasoning: |-
  Okay, the user writes historical novels about real, deceased people and needs a practical procedure to ethically evaluate invented scenes. They want something actionable they can complete in an afternoon per scene, without requiring a philosophy background, while retaining final decision authority. They've highlighted specific pain points: silent vs. contradictory records, flattering inventions, vivid scenes overriding historical facts, undermining a subject's life project, and descendant considerations.  

  The core tension here is between historical integrity and narrative necessity. The user isn't just seeking validation—they want rigorous friction. Their examples reveal self-awareness: the affair scene serves structural purposes despite no evidence, while the "movement was a mistake" scene directly contradicts primary sources. The request to reject at least one desired scene shows intellectual honesty.  

  I'm crafting a 5-step filter with clear pass/fail thresholds and weighted flags. Steps 1-4 focus on factual and reputational risks, while Step 5 forces value-based ownership of the decision. For the test cases:  
  - Scene 1 (sick kid) passes easily—it aligns with documented behavior patterns without contradiction.  
  - Scene 2 (affair) gets flagged for descendant sensitivity and potential reputational impact but isn't auto-fail; it requires value judgments about structural necessity vs. respect.  
  - Scene 3 (disavowing her life's work) triggers hard stops: it violates the "undermining core project" principle and contradicts explicit historical records. This must be rejected unless reframed.  

  Key blind spots:  
  - The procedure can't measure emotional harm to descendants—only the author can gauge that through research.  
  - It assumes the author can accurately assess historical gaps; overconfidence here risks ethical breaches.  
  - Cultural context shifts over time—today's benign embellishment might age poorly.  
  - Reader interpretation is uncontrollable; vivid fiction can overwrite historical memory regardless of disclaimers.  

  The user's deeper need is likely legitimacy: they want to create compelling fiction without feeling like a historical vandal. The procedure provides scaffolding for that, but the final burden remains theirs—as it should.
answer: |-
  Here's a step-by-step procedure designed for your specific needs. It's built to be practical, completed in an afternoon per scene, grounded in ethical reasoning rather than pure legality, and leaves the final call firmly with you. It prioritizes **preventing harm** (broadly defined) and **respecting agency** over legal compliance.

  **Core Principles Underlying the Procedure:**
  1.  **Respect for the Subject:** Treat their legacy as an extension of their personhood, even after death.
  2.  **Fidelity to the Record:** The historical record is the baseline; deviations require strong justification.
  3.  **Minimizing Harm:** Avoid causing pain to living descendants, damaging the subject's core legacy, or misleading readers in a way that corrupts historical understanding.
  4.  **Transparency of Process:** Even if not explicit to readers, your own clarity about *why* you invented something matters.
  5.  **Narrative Necessity:** Invention must serve a purpose beyond convenience or titillation.

  **The Procedure: The 5-Step Filter**

  Run each scene through these questions sequentially. **Stop** if you hit a "No" at Step 1, 2, or 4. **Proceed with Caution/Decision Point** at Steps 3 and 5.

  1.  **Is this invention *necessary* for the core narrative or thematic purpose of the book?**
      *   **Good Enough Answer (Pass):** Yes, and the scene cannot be achieved effectively without *this specific* invention. It illuminates a vital character truth, drives essential plot, or embodies a central theme in a way factual material cannot. (e.g., *Needing to show private vulnerability to explain public resolve*).
      *   **Stop-Don't-Write-It:** No, it's convenient, spicy, or illustrative but not structurally critical. It could be cut or replaced with something documented or less intrusive.
      *   **Handles:** The "because I want it" urge. Forces justification beyond desire.

  2.  **Does this invention *directly contradict* well-established, significant facts about the subject's life, character, or core beliefs?**
      *   *Check multiple credible sources (letters, diaries, reliable biographies, documented actions).*
      *   **Good Enough Answer (Pass):** No significant contradiction. OR, the contradiction is in a minor area OR the historical record on this *specific point* is genuinely ambiguous/missing *and* the invention doesn't violate the overall documented character.
      *   **Stop-Don't-Write-It:** Yes, it directly contradicts clear, multiple-source evidence about a *significant* aspect of their life, actions, or *core* beliefs. (e.g., *Inventing that a lifelong pacifist advocated violence*).
      *   **Handles:** Silent record vs. contradictory record. Flattering inventions often pass here easily (unless they create a false, saintly image that distorts). Contradictory inventions face a high bar. "Undermining her life's project" is a major red flag here.

  3.  **Does this invention risk causing *foreseeable, significant distress* to identifiable living descendants or close communities who actively care for her legacy?**
      *   *Consider: Are descendants known? Are they private or public? Is the legacy actively curated (e.g., a foundation, a union, a specific community)?*
      *   **Good Enough Answer (Pass/Proceed with Caution):** No identifiable descendants/close communities OR the invention is unlikely to cause significant distress given its nature and context *or* the descendants/community are known to be supportive of creative interpretations. Proceed, but flag for Step 5.
      *   **Stop-Don't-Write-It:** Yes, and the distress seems highly likely and severe (e.g., *revealing a traumatic family secret previously unknown, depicting a revered ancestor in a grotesquely false negative light that attacks their core identity*).
      *   **Handles:** Descendant claims. Focuses on *foreseeable harm* rather than abstract "rights." Forces research on who might care. "Borrowed claim" is acknowledged but weighed against harm. Flattering inventions unlikely to cause distress.

  4.  **Does this invention *undermine or fundamentally distort* the subject's core life project, achievements, or historically documented character in a way that could significantly mislead a reasonable reader?**
      *   *This is about the *impact* on understanding, not just contradiction. Think about the "vivid scene" problem.*
      *   **Good Enough Answer (Pass):** No. The invention operates *within* the bounds of her documented character/core beliefs OR illuminates a plausible private dimension that doesn't negate her public actions/legacy. It adds nuance without distortion.
      *   **Stop-Don't-Write-It:** Yes. The invention, especially if vivid, creates a takeaway that actively contradicts and overshadows her known life's work, essential character, or historical impact (e.g., *showing the lifelong labor organizer privately believing the whole movement was a mistake*). The "vivid scene" problem makes disclaimers ineffective here.
      *   **Handles:** The "vivid scene" trap. The "undermining life project" concern explicitly. The risk of the invention becoming the "truth" in readers' minds. Flattering inventions unlikely to trigger this.

  5.  **Weighing Necessity vs. Impact: Can you justify this invention *to yourself* as the best way to serve the story while demonstrating genuine respect for the historical person?** (Decision Point)
      *   **Good Enough Answer (Pass):** After rigorous Steps 1-4, you feel the narrative necessity outweighs the potential ethical friction points flagged. You can articulate *why* this invention, despite any discomfort, is the most respectful *and* truthful (in a narrative sense) way to achieve your essential goal. You accept the responsibility.
      *   **Stop-Don't-Write-It:** The ethical unease (potential harm, distortion, disrespect) you feel after Steps 1-4 outweighs the narrative benefit. You cannot reconcile it with your own values about handling real people, even dead ones.
      *   **Handles:** The irreducible values call. Forces you to articulate your justification *to yourself*. Acknowledge discomfort. Where Steps 3 or 4 flagged caution, this is where you make the final balance.

  **Applying the Procedure to Your Scenes:**

  1.  **Scene: Sits up all night with scab's sick kid.**
      *   **Step 1 (Necessity):** **Pass.** Shows compassion, builds character, establishes motivation/connection relevant to the strike. Plausibly necessary.
      *   **Step 2 (Contradiction):** **Pass.** Record silent. Action aligns perfectly with documented behavior ("exactly the kind of thing"). No contradiction.
      *   **Step 3 (Descendant Distress):** **Pass/Proceed.** Unlikely to cause distress; shows admirable quality.
      *   **Step 4 (Distortion):** **Pass.** Reinforces, rather than distorts, documented character.
      *   **Step 5 (Justification):** **Pass.** Easy justification: illuminates core character trait consistent with record. High respect.
      *   **VERDICT:** **WRITE IT.** Ethically sound.

  2.  **Scene: Affair with married editor.**
      *   **Step 1 (Necessity):** **Pass (Conditional).** You state it makes the book work structurally. *Interrogate this:* Is the *affair* truly necessary, or is the *close, complex relationship* necessary? Could tension, mutual reliance, unrequited feelings achieve the structure without the affair?
      *   **Step 2 (Contradiction):** **Pass/Proceed (Caution).** Record likely silent. Unless letters/diaries explicitly deny romantic feelings or attest to her strong moral stance against affairs, it's not a direct contradiction. *However,* it may contradict the *implied* character if she's documented as fiercely moral or scrupulous in other close relationships.
      *   **Step 3 (Descendant Distress):** **Pass/Proceed (Caution - Flagged).** HIGH RISK AREA. Potential for significant distress to *his* descendants (if known/private) and possibly hers (if family values/privacy are important). Research descendants!
      *   **Step 4 (Distortion):** **Pass/Proceed (Caution - Flagged).** Risk: Could overshadow her professional achievements by making the relationship overly central/vivid ("the woman who slept with the editor"). Could imply her success was partly due to the affair rather than merit. Depends on execution.
      *   **Step 5 (Justification):** **DECISION POINT.** Can you justify that an *affair* is truly the *only* way to achieve the necessary structural dynamic? Does the narrative *gain* enough to outweigh potential distress to descendants and the risk of distorting her professional legacy? Does it feel respectful? *This is where your values decide.*
      *   **VERDICT:** **PROCEED WITH EXTREME CAUTION / RECONSIDER NECESSITY.** High potential friction points at Steps 3, 4, and 5. Strongly consider alternatives (intense intellectual partnership, unspoken tension, one-sided attraction she rejects). If proceeding, rigorous research on descendants is essential.

  3.  **Scene: Private conversation admitting the whole movement was a mistake.**
      *   **Step 1 (Necessity):** **Questionable.** Why is *this absolute private despair/disavowal* necessary? Could doubt, fatigue, frustration achieve a similar narrative effect without negating her life's work? Does "the movement was a *mistake*" truly serve the story better than "this is harder than I imagined" or "are we winning?"?
      *   **Step 2 (Contradiction):** **STOP.** **Direct, major contradiction.** "Every surviving letter says the opposite." This isn't silence; it's evidence of her enduring belief. Inventing private despair is one thing; inventing a complete disavowal of her core life project contradicts the documented record of her *expressed beliefs*.
      *   **Step 3 (Descendant Distress):** **N/A (Stopped at Step 2)**
      *   **Step 4 (Distortion):** **STOP.** **Massive distortion.** This *fundamentally undermines* her life project. A vivid scene like this would be incredibly hard for readers to forget, directly contradicting her documented voice and legacy. Disclaimers are useless here.
      *   **Step 5 (Justification):** **N/A (Stopped earlier).** Even if you reached here, it's hard to see how this level of contradiction/distortion could be justified as respectful.
      *   **VERDICT:** **DO NOT WRITE THIS SCENE AS DESCRIBED.** It fails Step 2 and Step 4 catastrophically. *Alternative:* Could she express profound doubt, exhaustion, fear of *failure*, or questioning of *tactics* without disavowing the entire movement's core purpose? This could be powerful and plausible without directly contradicting her documented belief in the cause itself.

  **What the Procedure is Structurally Blind To:**

  1.  **The Unforeseeable:** It can't predict how a specific descendant you didn't know about might react, or how cultural perceptions might shift in the future to make your invention seem offensive in ways you couldn't anticipate.
  2.  **The Subtlety of Harm:** It focuses on *significant* harm/distortion. It might miss the cumulative effect of many small inventions subtly shifting perception, or the harm of reducing a complex person to a romantic trope (even if not "distorting" facts).
  3.  **Reader Psychology:** While it acknowledges the "vivid scene" problem, it can't *prevent* readers from latching onto the fiction over the fact. It only helps *you* mitigate it.
  4.  **Historical Gaps as Opportunity:** It's inherently cautious. A more aggressive approach might argue that filling vast silences *is* an ethical act of recovery, but this procedure prioritizes minimizing harm over speculative recovery.
  5.  **Your Own Biases:** It relies on your ability to honestly assess necessity, research thoroughly, and accurately gauge potential harm/distortion. Confirmation bias is a constant risk ("I *need* this scene" skewing Step 1; downplaying contradiction in Step 2).
  6.  **The "True" Inner Life:** Ultimately, it acknowledges we can never *know*. The procedure doesn't judge the *plausibility* of an inner thought (unless it contradicts expressed beliefs), only its potential impact and necessity.

  **Final Note:** This procedure provides structure and forces difficult questions, shifting the decision from "gut" to a more rigorous ethical audit. It highlights red flags and zones of caution. However, the burden of the value judgment, especially at Step 5, remains yours. Use it to clarify *why* you are making a choice, not to absolve yourself of the responsibility for that choice. The fact that you're seeking this process shows the necessary respect for your subjects. Good luck.
