                    ├─► Genome branch ──┤  
                    │   Separator: Q2=A │  
                    │                   └─► Gradualist Genome Essentialist  
                    │                         Separator: Q6=A and Q7=B (sorites tolerance)  
                    │  
                    ├─► Organism branch ────► Animalist/Organism View  
                    │   Separator: Q5=B (twinning ends identity)  
