  ### The "Which Theory of Your Origins Are You?" Quiz  
  *Answer each scenario intuitively. Choose one option per question.*  

  1. **Scenario**: The fertility clinic used a sperm sample from a different man and an egg from a different woman to conceive the child. The child has completely different DNA. Would that child be you?  
     A) Definitely me.  
     B) Definitely not me.  
     C) Unclear or no fact of the matter.  

  2. **Scenario**: The clinic used a different sperm cell from your father, but by a wild coincidence, it carried a genome identical to the original sperm (base-pair-for-base-pair). The egg is unchanged. Would the resulting person be you?  
     A) Definitely me.  
     B) Definitely not me.  
     C) Unclear or no fact of the matter.  

  3. **Scenario**: The same sperm and egg that made you were frozen, combined in a lab dish a year later, and implanted. Everything else is identical. Would the resulting person be you?  
     A) Definitely me.  
     B) Definitely not me.  
     C) Unclear or no fact of the matter.  

  4. **Scenario**: An egg’s nucleus (with your mother’s DNA) is transplanted into donor cytoplasm, so mitochondria come from another woman. The sperm is unchanged. Would the resulting person be you?  
     A) Definitely me.  
     B) Definitely not me.  
     C) Unclear or no fact of the matter.  

  5. **Scenario**: The zygote that became you splits into identical twins. Would you have been one of them?  
     A) Yes, I’d be one twin (randomly).  
     B) No, I wouldn’t exist—they’re new people.  
     C) Unclear or no fact of the matter.  

  6. **Scenario**: The sperm that made you is altered one base pair at a time until the entire genome is replaced. After the first change, is the resulting person you?  
     A) Definitely me.  
     B) Definitely not me.  
     C) Unclear or no fact of the matter.  

  7. **Scenario**: After the final base-pair change (a wholly new genome), is the resulting person you?  
     A) Definitely me.  
     B) Definitely not me.  
     C) Unclear or no fact of the matter.  

  8. **Scenario**: Decades later, your mother’s skin cells are used to create new sperm and eggs (genetically identical to the originals), then combined to conceive a child. Is that child you?  
     A) Definitely me.  
     B) Definitely not me.  
     C) Unclear or no fact of the matter.  

  9. **Scenario**: The same sperm and egg are used, but conception occurs in a different city at the same time. Would the resulting person be you?  
     A) Definitely me.  
     B) Definitely not me.  
     C) Unclear or no fact of the matter.  

  ---

  ### Scoring Key  
  *Tally your answers, then match to a theory. No overthinking—go with your gut pattern.*  

  1. **Count your "C" responses**:  
     - **6+ "C"s** → **Skeptic (Anti-Essentialist or Deflationary)**: You think origins questions are vague, context-dependent, or lack facts. No rigid theory fits.  

  2. **For fewer than 6 "C"s, identify your branch**:  
     - **Gamete essentialism?** Look at Q2: If **B** (not you), go to step A.  
     - **Genome essentialism?** Look at Q2: If **A** (you), go to step B.  
     - **Organism view?** Look at Q5: If **B** (you wouldn’t exist), go to step C.  

     **Step A (Gamete essentialism branch)**:  
     - If Q3 = **A** (you) and Q4 = **A** (you): **Flexible Gamete Essentialist**. Specific sperm and egg matter, but timing/location don’t.  
     - If Q3 = **B** (not you) or Q4 = **B** (not you): **Strict Gamete Essentialist**. Exact conception event matters.  
     - If Q4 = **B** (not you): You also care about mitochondrial/cytoplasmic factors.  

     **Step B (Genome essentialism branch)**:  
     - If Q4 = **A** (you) and Q6 = **A** (you) but Q7 = **B** (not you): **Gradualist Genome Essentialist**. DNA defines you, but small changes are tolerated until a tipping point (sorites applies).  
     - If Q4 = **A** (you) and Q6/Q7 = **B** (not you even after one change): **Absolutist Genome Essentialist**. Any DNA alteration means "not you."  

     **Step C (Organism view branch)**:  
     - If Q5 = **B** (not you) and Q8 = **B** (not you): **Animalist/Organism View**. You are the physical organism that developed from the zygote; twinning or synthetic replication destroys your identity.  

  3. **No match?** See "No-Leaf Zone" notes below.  

