answer: |-
  Below is a procedural moderation code for Anselm, structured as a step-by-step decision tree. It prioritizes verifiable facts from the game's mechanics (Ledger, unmaking, binding) and explicitly flags judgment calls. The goal is to resolve disputes about "whether something real was lost" in 15 minutes or less, using a single page. The procedure distinguishes between **loss** (tied to game mechanics: Ledger entries, gaps, or binding effects) and **grief** (subjective attachment to descriptions, prose, or uninstantiated concepts). It tracks **loss**, not grief, because loss is actionable within Anselm's systems, while grief is personal and cannot be remediated by mechanics. The copy-substitution test is refined to counter description-parity: it asks whether a complaint would resolve if replaced with a duplicate, exposing when loss depends on provenance (Ledger history) rather than qualities (description).

  ---

  ### **Anselm Moderation Procedure: Loss Assessment**
  *Use this for disputes about unmaking, binding, or erased prose. Answer in order. Stop early if a "No" or "Unremediable" outcome is reached. Judgment calls require moderator discretion; base them on community norms, not personal views.*

  1. **VERIFY THE ACT**  
     - *Ask:* Was the act (unmaking, binding, or prose alteration) logged in the engine and compliant with the Charter?  
     - *Sufficient evidence:* Server logs, Ledger updates, or binding records.  
     - *If No:* Rule violation; escalate to arbitration.  
     - *If Yes:* Proceed to Step 2.  
     *Time: 2 min. Confidence: High (objective data).*

  2. **ASSESS LEDGER STATUS**  
     - *Ask:* Did the subject (object, character, or location) have a Ledger entry at the time of the act?  
     - *Sufficient evidence:* Ledger ID, creation date, and current holder from engine records.  
     - *If No:* Loss cannot be procedural (go to Step 6).  
     - *If Yes:* Proceed to Step 3.  
     *Time: 2 min. Confidence: High (Ledger is immutable).*

  3. **APPLY COPY-SUBSTITUTION TEST**  
     - *Ask:* Would the complaint resolve if the subject were replaced with a mechanically identical duplicate (same description, new Ledger entry)?  
       - *Example:* "A copy of the ship is made; gaps remain, but the description is restored identically."  
     - *Sufficient evidence:* Complainant's statement (e.g., "A copy isn’t the same because X").  
     - *If Yes:* Loss is tied to description, not provenance; no procedural loss (go to Step 6).  
     - *If No:* Loss is tied to provenance (unique Ledger history); proceed to Step 4.  
     *Time: 3 min. Confidence: Medium (tests intent, but relies on complainant honesty).*  
     *Note: This defeats description-parity by showing provenance matters. If the complaint survives substitution, the object is irreducible to its description.*

  4. **QUANTIFY MECHANICAL LOSS**  
     - *Ask:* Did the act cause a gap, binding timeout, or irreversible Ledger deletion?  
     - *Sufficient evidence:* Gap in holder's description, binding logs, or Ledger deletion record.  
     - *If No:* No procedural loss (e.g., binding without gaps); go to Step 6.  
     - *If Yes:* Proceed to Step 5.  
     *Time: 2 min. Confidence: High (mechanically visible).*

  5. **DETERMINE REMEDY ELIGIBILITY**  
     - *Ask:* Is the loss remediable within mechanics (e.g., compensation via in-game assets) without violating the Ledger or Charter?  
       - *Judgment call:* Consider:  
         - Historical weight: Did the subject predate all current players? Was it central to faction lore?  
         - Holder status: Was the complainant the holder or a proven successor per Charter?  
         - Scale: Are gaps/ binding days excessive (e.g., >3 days or >1 gap)?  
     - *If No:* Loss is irreparable (e.g., unique Ledger item); declare "Unremediable" and suggest symbolic restitution (e.g., in-game memorial).  
     - *If Yes:* Order reasonable compensation (e.g., assets of comparable value from the actor’s faction).  
     *Time: 4 min. Confidence: Low (requires subjective weighing of "significance").*  
     *Note: This is judgment dressed as procedure—moderators must decide "reasonableness" based on community standards.*

  6. **ACKNOWLEDGE GRIEF (NON-ACTIONABLE)**  
     - *If reached from Step 2, 3, or 4:* Confirm no procedural loss occurred. State: "The engine records no loss, but player grief is noted." Close the case.  
     - *Do not* prescribe remedies for grief.  
     *Time: 1 min. Confidence: High (clear endpoint).*

  #### **What the Procedure Settles and What It Cannot**  
  - Settles: Whether a Ledger-backed, provenance-dependent loss occurred, and if it is remediable.  
  - Cannot Settle: Abstract "reality" of virtual objects, moral blame, or emotional grief. Grief is real but outside the mechanics.  
  - Judgment Calls: Step 5 (remedy eligibility) is explicitly subjective. Step 3 relies on interpreting player statements.  

  ---

  ### **Application to Cases**  
  *Using the procedure above. Assumptions: All acts are Charter-compliant per case facts.*

  **Case 1: Unmade Ship**  
  - Step 1: Act legal (unmaking logged).  
  - Step 2: Ledger entry exists.  
  - Step 3: Copy-substitution test: Former holders reject a duplicate ("not the same ship"). Test fails; loss is provenance-based.  
  - Step 4: Gap exists (mechanical loss confirmed).  
  - Step 5: Irremediable? Judgment: Yes. Ship has unique history (4 holders, 3rd-year origin). Non-active holders forfeited claims per Charter (harbor inheritance). No remedy possible; suggest memorial.  
  - Outcome: Unremediable loss. No compensation owed.  

  **Case 2: Binding for 9 Days**  
  - Step 1: Act legal (binding logged).  
  - Step 2: Subject is character—has Ledger entry.  
  - Step 3: Copy-substitution test: A new character would not resolve complaint ("lost 14 years of life"). Test fails; loss is provenance-based.  
  - Step 4: Mechanical loss? Binding prevented play—yes (time-loss is irreversible).  
  - Step 5: Remediable? Judgment: Partially. Binding >3 days is excessive. Order compensation: 9 days of equivalent assets (e.g., resources, territory) from the binding faction.  
  - Outcome: Loss is remediable. Compensation ordered.  

  **Case 3: Uninstantiated City Erased from Prose**  
  - Step 1: Act legal (retcon logged, no engine change).  
  - Step 2: No Ledger entry → Jump to Step 6.  
  - Step 6: No procedural loss. Grief acknowledged.  
  - Outcome: No remedy. Distinction from Case 1: Case 1 had Ledger provenance; Case 3 did not.  

  **Result Consistency**: Cases 1 and 3 differ—Case 1 shows loss (Ledger-dependent), Case 3 shows grief (description-only). The procedure tracks **loss** (mechanical, Ledger-based) because grief is universal but cannot be adjudicated or remedied within Anselm's systems. This aligns with the Charter: mechanics create enforceable obligations; prose does not.  

  ---

  ### **Confidence Assessment**  
  - **Highest Confidence**:  
    - Step 1 (act verification) and Step 2 (Ledger check). Built on immutable engine data.  
    - Step 4 (mechanical loss). Gaps/binding logs are visible proof.  
  - **Moderate Confidence**:  
    - Step 3 (copy-substitution test). Sound for defeating description-parity (provenance vs. qualities), but relies on self-reporting. Refined to focus on complainant’s response.  
  - **Lowest Confidence**:  
    - **Step 5 (remedy eligibility)**. The claim I am least sure of: That "historical weight" can be fairly judged by volunteers in 4 minutes. It risks arbitrariness. A philosopher might question if "significance" is culturally relative; an experienced moderator could refine criteria (e.g., "faction-wide use for >1 year = significant").  

  **Weakest Claim**: That binding time-loss (Case 2) is always compensable with assets. Some players may see time as irreplaceable, making compensation inadequate. I’d want a philosopher/moderator to validate if this adequately addresses "lost life" without overstepping into metaphysics.  

  This procedure reflects the work’s reality: time-pressed, grounded in mechanics, and honest about where volunteers must make calls. It rejects description-parity, honors provenance, and separates loss from grief—without philosophy.
