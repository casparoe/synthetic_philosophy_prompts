  2. **Loss assessment**: Use copy-substitution to test if loss is tied to the specific object or its description. If a duplicate wouldn't resolve the complaint, it's about the original's unique history.
  3. **Remedy phase**: Determine obligations. For Ledger items, former holders might have claims; for prose, no remedy but acknowledge grief.
