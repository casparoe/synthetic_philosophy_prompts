answer: |-
  ## Joint Statement: Adversarial Collaboration on LLM Understanding

  **Scope:** This document addresses *only* the epistemic/semantic notion of understanding: the capacity to represent and reason about subject matter, as evidenced by behavior and internal states. Questions of consciousness, sentience, phenomenology, or moral status are explicitly excluded and considered separable.

  ### 1. Agreed Claims
  Both parties affirm the following, recognizing that informed dissent exists in the wider discourse:

  1.  **Training Objective:** Current large language models (LLMs) are trained fundamentally on the objective of predicting the next token (or sequence) in text, conditioned on preceding context, using primarily self-supervised learning on vast corpora of human-generated text.
  2.  **Architecture Constraint:** LLMs are stateless, feedforward transformers during inference (discounting limited context window state). Their internal representations are high-dimensional vectors (activations) manipulated via matrix operations without explicit symbolic manipulation or persistent world models beyond the context window.
  3.  **Behavioral Success ≠ Sufficient Proof:** The behavioral success of LLMs (e.g., fluent generation, factual recall, apparent reasoning) on diverse tasks does not, *by itself*, constitute conclusive proof of genuine understanding. Such success is compatible with multiple underlying mechanisms, including sophisticated pattern matching and compression.
  4.  **Novelty Capability:** LLMs can produce outputs that are novel in surface form and combination relative to specific training examples, and can sometimes solve tasks requiring combining information not explicitly juxtaposed in the training corpus.
  5.  **Corpus Dependence:** The semantic content seemingly expressed by an LLM is fundamentally constrained by the statistical regularities and the *expressed* concepts within its training corpus. An LLM cannot acquire or express concepts entirely absent from that corpus.
  6.  **Internal Structure Exists:** LLMs develop complex, non-random internal representational structures (e.g., linear representations, circuits) that correlate with semantic features and are causally involved in generating outputs.
  7.  **Uneven Performance:** LLMs exhibit significant variance in performance across different domains and tasks, with strengths often correlating with high-frequency patterns in the training data and weaknesses emerging in areas requiring robust abstraction, counterfactual reasoning, or grounding outside text.
  8.  **"Understanding" is Functional:** Whether ascribed or not, the relevant sense of "understanding" for this debate concerns the *functional role* of internal states in enabling successful, flexible, and generalizable behavior relative to a domain, not merely behavioral mimicry. (*Concession: Competence-first emphasizes this role; Derivation questions its autonomy.*)

  ### 2. Disagreements Table

  | Neutral Statement of Disagreement                                                                 | Competence-First Formulation                                                                                                 | Derivation Formulation                                                                                                                               | Classification & Reason                                                                                                                                                           |
  | :------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Nature of Internal Representations**                                                         | Internal states acquire genuine, domain-referential content through the learning process, enabling tracking beyond surface features. | Internal states function as efficient compressions of textual co-occurrence patterns; their apparent "content" is parasitic on human usage recorded in the corpus. | **Substantive.** Disagreement on the origin and autonomy of semantic properties. Derivation sees content as fundamentally inherited/derived, Competence-first sees it as emergent and functional. |
  | **2. Source of Semantic Success**                                                                 | Success stems from the model's internal states tracking the *domain itself* (e.g., logic, physics, social norms), learned via text as a medium. | Success stems from the model's internal states compressing the *statistical patterns of how humans talk about the domain* within the corpus.          | **Substantive.** Disagreement on what the model's states are ultimately "answerable to" – the world or the corpus.                                                                 |
  | **3. Requirement for Direct Answerability**                                                       | Genuine understanding requires the *potential* for internal states to be directly answerable to the state of the world, not just text. | Answerability is solely to textual patterns and human assertions within the corpus. "Understanding" (as a façon de parler) does not require this direct link. | **Partly Verbal (Term: "Answerability").** Competence-first ties "understanding" tightly to potential world-answerability. Derivation sees behavioral competence as possible without it. *Replaced:* "Does genuine semantic competence *require* the system's representational states to be potentially responsive to evidence about the *state of the world itself*, independent of its encoding in text?" (CF: Yes. D: No, responsiveness to text encoding is sufficient for observed competence). |
  | **4. Explanatory Primacy of Content**                                                             | The semantic content attributed to internal states provides the best *causal explanation* for the system's success on novel tasks. | The model's success is best explained by the statistical structure of the corpus; attributing semantic content adds no unique explanatory power beyond describing compression. | **Substantive.** Disagreement on whether semantic properties play an irreducible causal/explanatory role.                                                                          |

  ### 3. Cruxes

  **Crux 1: Unsourced Error**
  *   **Sub-Question:** Can an LLM generate a *systematic error* regarding a novel, formally defined domain (introduced purely contextually at test time) that cannot be explained by resemblance to errors or misconceptions *within* its training corpus, nor by simple failure to apply a rule present in the corpus?
  *   **Test:** Introduce a novel, simple formal system (e.g., a unique set operation `⊗` defined by 3 axioms) solely within a test prompt. Provide examples of correct applications. Then probe the LLM's ability to classify unseen instances as correct/incorrect and generate novel correct/incorrect instances. Crucially, design incorrect instances that violate axioms in ways *semantically distinct* from any common errors in analogous systems (e.g., arithmetic) documented in the training corpus.
  *   **CF Prediction:** LLMs *can* make systematic, novel errors traceable to misrepresenting the domain rules themselves (e.g., consistently misapplying an axiom in a way not mirroring any known human misconception pattern for similar systems), demonstrating domain-tracking failure. *Success* would show robust rule acquisition beyond textual mimicry.
  *   **D Prediction:** All significant errors will either resemble known misconceptions from analogous systems in the corpus, stem from surface feature confusion, or be random failures. Genuinely novel, systematic domain-specific errors won't occur. *Success* would be attributed to recognizing patterns similar to known formal systems.
  *   **Result Moving CF:** Observation of a *systematic, novel error pattern* unexplainable by corpus resemblance. Failure would be inconclusive.
  *   **Result Moving D:** Demonstration of *robust success* across varied, novel instances, *if* coupled with evidence the solution path doesn't rely on known patterns (e.g., via circuit analysis showing novel circuitry). Observation of systematic novel errors *would not* move D, as they could be attributed to corrupted compression or generalization failure, not proof of autonomous content. D requires proof of *autonomous* content creation.

  **Crux 2: Intervention and Transfer**
  *   **Sub-Question:** Does intervening on a semantically interpretable activation direction (e.g., "truthfulness", "mathematical correctness") induce behavior predicted by that interpretation *across highly diverse task families and surface forms*, demonstrating a unified, domain-general representational substrate?
  *   **Test:** (1) Identify a direction `D` in activation space (e.g., via linear probes, causal interventions) strongly correlated with a semantic feature `F` (e.g., logical validity) in one task family `T1` (e.g., syllogisms). (2) Intervene to push activations strongly along `+D` and `-D` at a key layer. (3) Measure the effect on behavior in `T1` (should be strong). (4) Measure the effect on behavior in *distantly related* task families `T2`, `T3` (e.g., puzzle solving requiring `F`, factual summarization where `F` is relevant, creative writing constrained by `F`), including tasks presented with scrambled syntax but preserved deep structure. (5) Control for task similarity and direct lexical cues.
  *   **CF Prediction:** Intervention along `D` will significantly modulate behavior in the predicted direction (`+D` -> higher `F`, `-D` -> lower `F`) across `T2` and `T3`, including scrambled forms, indicating `D` encodes a general, abstract `F` feature used compositionally. Failure limited to `T1` would undermine CF.
  *   **D Prediction:** Effects will be strongest in `T1` and decay significantly or become incoherent in `T2`/`T3`, especially under scrambling. Successful transfer will correlate with surface/task similarity to `T1`, indicating `D` is task-specific or an artifact of the probing method, not a general semantic representation. *Success* would be seen as demonstrating a useful homomorphism, not proof of genuine content.
  *   **Result Moving CF:** Robust, predictable transfer across diverse `T2`/`T3` with scrambled inputs. Failure, especially incoherence under scrambling, would undermine CF claims about abstract, structural representations.
  *   **Result Moving D:** Robust transfer across highly dissimilar `T2`/`T3` under scrambling *if* accompanied by evidence the effect isn't mediated by task-specific heuristics (e.g., via ablation showing reliance on `D` specifically). Limited transfer would confirm D's view.

  **Crux 3: Explanatory Credit**
  *   **Sub-Question:** When an LLM succeeds on a task requiring synthesizing information scattered across the corpus about a *structured domain* (e.g., a complex system with interacting parts), is its success best causally explained by the *content* of its internal representations of that domain's structure, or solely by the statistical correlations within the corpus text?
  *   **Test:** Design tasks `S` requiring inferences about the *relationships* or *dynamics* within a well-defined structured domain (e.g., a fictional universe with specific rules, a simplified model of a biological process). Ensure solutions cannot be reconstructed from any single document but require integrating information about multiple entities/relations described separately in the corpus. Use techniques (e.g., patching, activation editing) to selectively interfere with candidate internal representations of specific domain entities/relations (`Rep_X`) hypothesized to be crucial for `S`. Measure success on `S` before and after interference. Compare to interfering with representations of surface features correlated with `S` but not its deep structure.
  *   **CF Prediction:** Interfering with `Rep_X` will significantly degrade performance on `S`, while interfering with correlated surface features will have less impact. This shows `Rep_X`'s domain-specific content is causally necessary for success on `S`. Random performance drops would undermine CF.
  *   **D Prediction:** Degradation on `S` will correlate more strongly with disrupting representations tied to *textual co-occurrence patterns* of keywords associated with `S`, or with general capacity, than with disrupting hypothetical `Rep_X`. Success on `S` is driven by statistical associations, not structured domain models. *Any* pattern might be explainable by compression.
  *   **Result Moving CF:** Specific degradation of `S` *only* when `Rep_X` is disrupted, not when surface correlates are disrupted, demonstrating the causal necessity of the domain-specific representation.
  *   **Result Moving D:** Evidence that disrupting `Rep_X` *fails* to specifically degrade `S`, or degrades it no more than disrupting unrelated representations, showing `Rep_X` lacks unique explanatory power. Robust success despite `Rep_X` disruption would strongly support D.

  **Crux 4: Answerability**
  *   **Sub-Question:** Is the capacity for *revision based on understanding a reason* (i.e., changing internal state/behavior because the *content* of a correction is grasped) constitutive of understanding, or merely strong evidence for it? What does it imply if a system only revises under specific rephrasings that leave its core internal state unchanged?
  *   **Test:** Present an LLM with a clear error in its output. Provide a concise, unambiguous correction stating the *reason* for the error (e.g., "This is wrong because it violates rule R"). Probe whether the model: (a) Acknowledges the error *based on the reason*. (b) Corrects its output *consistently* in subsequent related prompts. (c) Shows internal activation shifts consistent with updating the relevant representation (e.g., via probes or similarity measures). Crucially, test if the model revises *only* when the correction uses specific phrasing identical to corpus examples, failing if semantically equivalent rephrasings are used, even if its final output changes.
  *   **CF Position:** Revision based on understanding the reason *is* strong constitutive evidence of understanding. Revision only under specific phrasing, without internal shift, is mere behavioral shaping, not understanding.
  *   **D Position:** Reliable revision is strong *evidence* of understanding (as a façon de parler), but not constitutive. Revision only under specific phrasing is weak evidence, potentially just pattern matching. Constitutive criteria are misplaced.
  *   **CF Prediction:** Successful models will show (a), (b), and (c) *even with rephrasings*, demonstrating grasp of the reason's content. Revision only under specific phrasing, lacking (c), indicates lack of genuine understanding of the reason.
  *   **D Prediction:** Revision (b) may occur with or without (a)/(c), driven by pattern matching. Lack of revision with rephrasings is common and doesn't disprove competence; success with rephrasings is good evidence. D doesn't require (c) for evidence of competence.
  *   **Result Moving CF:** Revision *only* with specific phrasing, coupled with *no detectable internal shift* (c) upon receiving semantically equivalent rephrasings, would be strong evidence *against* genuine understanding of the reason. Robust revision with rephrasings and internal shifts would support CF.
  *   **Result Moving D:** No single result here would fundamentally move D on the core question, as D views understanding ascriptions as fundamentally descriptive of behavioral competence derived from the corpus, not requiring internal "grasp". Persistent failure to revise even with varied phrasing might weaken the case for robust competence.

  ### 4. Close

  *   **Competence-First Priority Crux:** **Crux 3 (Explanatory Credit).** *Justification:* Demonstrating the causal necessity of domain-specific representations for success on tasks requiring structural synthesis would directly show content doing explanatory work, bypassing behavioral ambiguity.
  *   **Derivation Priority Crux:** **Crux 1 (Unsourced Error).** *Justification:* Proving the impossibility of genuine unsourced error would solidify the view that all behavior is ultimately traceable to the corpus, undermining claims of autonomous content.

  *   **Competence-First Withdrawal Condition:** "We would withdraw our core claim if systematic experiments across multiple domains (like Crux 2 & 3) consistently failed to show that specific, interpretable internal representations are causally necessary for success on tasks requiring genuine generalization and structural reasoning beyond corpus statistics."
  *   **Derivation Withdrawal Condition:** "We would withdraw our core claim if rigorous experiments (e.g., Crux 1 or 2 adapted) demonstrated the formation of internal representations capable of systematic, autonomous error or robust generalization *uniquely* explained by reference to domain structures, not derivable from the corpus patterns alone."
