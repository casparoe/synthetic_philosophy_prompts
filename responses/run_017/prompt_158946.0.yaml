prompt: |-
  You are a professional philosopher who specializes in Kant's ethics — the universalization formulas in Groundwork II, the fierce disagreement about what the test is even supposed to be testing, and the contemporary reconstructions of it. Take your time with this. Before committing to anything, brainstorm out loud: give me three or four candidate rules that could jointly generate the list of verdicts below, and only then pick one and stick your neck out. No literature survey, no citations, no names-and-dates recital — I want your own reconstruction, and I'd rather you reason from the cases than from what you remember about the scholarship.

  Background: my colleague — call her H. — has taught the Groundwork every year for about fifteen years, and in the joint grad seminar she rules on maxims constantly. I have been writing her verdicts down, because they don't hang together the way I expected. Abridged track record:

  1. Borrowing money on a promise to repay that you know you can't keep — fails, and she calls it the cleanest case: the practice couldn't survive universal non-keeping.
  2. Ending your own life to escape a wretched stretch of it — fails.
  3. Never bothering to develop your talents — fails, but she flags it as the weaker kind of failure, the imperfect-duty kind.
  4. Never lifting a finger for anyone in need — fails, same weaker kind.
  5. Lying to the person at the door who is looking for the friend hiding in your house — fails, and she is unmoved by the consequences.
  6. Telling a colleague you are delighted to see them when you are mildly annoyed — permissible, on the grounds that no one is deceived.
  7. Breaking a promise you made at gunpoint — permissible, no valid consent, nothing there to keep.
  8. Buying the cheaper version of something even though you know it's produced under worse labour conditions, because your one purchase changes nothing — permissible.
  9. Taking the car on the day everyone is asked to leave it at home, because one car's emissions make no difference — permissible.
  10. The maxim 'I'll lie whenever the truth would be devastating to the person I'm talking to' — fails; she says you can't narrow a maxim until it comes out clean.

  So: 8 and 9 say causal impotence excuses, and 3 and 4 say it doesn't; 7 lets a maxim be qualified by features of the other party while 10 refuses to let it be qualified by the outcome. That's the mess I want you to make sense of.

  Here's the case I need a verdict on. Departmental life runs on uncredited labour — hiring files, letters for the grad students, the reading group, refereeing, committees. My own working maxim is: I do the contractual minimum and no more, I take full advantage of everything the place produces for me, I'm entirely open about it rather than deceiving anyone, and I add one clause — if the department ever got to the point where it genuinely couldn't function without me, I'd step in.

  So: what does H. say about that maxim? Which reading of the test is she implicitly running — contradiction in conception, contradiction in the will, practical-contradiction-about-my-own-purpose, or something more transactional about deception and consent — and what does each of those predict here? Which of her precedents is the closest analog, given that 8 and 9 pull one way and 3 and 4 pull the other? Does my 'I'd step in if it collapsed' clause actually do any work, or is it a trick that a stricter reading simply refuses to count? And finally: what single further maxim would you put to her to settle which rule she's really running — I have a candidate in mind, but I want yours first. Be decisive where you can, and tell me plainly where the precedents genuinely underdetermine it and what principle each choice would commit us to.
reasoning: |-
  Okay, let me start by understanding what the user is asking. They want me to act as a Kantian ethics specialist analyzing their colleague H.'s pattern of verdicts on maxims. The user has provided a list of ten cases with H.'s rulings, noting apparent contradictions, particularly regarding causal impotence (cases 8-9 vs 3-4) and maxim qualification (case 7 vs 10). The core task is predicting H.'s verdict on the user's departmental labor maxim and reverse-engineering her implicit universalization test.

  First, I need to analyze H.'s precedents systematically. The clearest pattern emerges in cases where universalization would destroy the practice itself: false promising (1) and life-saving lies (5) both fail because they rely on the very institution they undermine. This suggests H. prioritizes contradiction in conception (CC) - where the maxim becomes impossible to conceive when universalized. 

  But then cases 3 and 4 (neglecting talents/beneficence) are deemed "weaker failures," which aligns with contradiction in will (CW) - where universalization isn't logically impossible but creates a world we couldn't rationally will. Crucially, H. rejects causal impotence defenses here even though individual inaction has negligible impact, focusing instead on systemic collapse if universalized. 

  The causal impotence exceptions (8-9) are fascinating because they seem to contradict 3-4. But note: in shopping/emissions cases, the practices (retail, pollution) don't require individual participation to exist, whereas promise-keeping does. This implies H. distinguishes between practices that are institutionally defined (promises, truth-telling) vs diffuse collective actions. 

  The maxim-qualification divide is sharper. Case 7 (gunpoint promise) allows external conditions to invalidate the promise itself, making it non-binding. But case 10 rejects outcome-based tailoring of maxims. This suggests H. permits context that negates the moral act's prerequisites (like voluntary consent) but forbids building exceptions around consequences. 

  Now examining the user's maxim: "Do contractual minimum, consume fully, be transparent, plus collapse-prevention clause." The transparency avoids deception issues (cf. case 6). The core tension is between cases 3/4 (where individual non-participation fails despite impotence) and 8/9 (where it's excused). 

  Key difference: departmental service is an institutional practice like promising, not a diffuse harm like shopping. If universalized, "never do extra service" would destroy service-dependent functions (hiring, refereeing etc.), making academic institutions inconceivable. This mirrors case 1's logic. 

  The "step in if collapse" clause likely fails under case 10's rule: you can't narrow a maxim by adding disaster-contingencies. Universalizing "do minimum unless collapse" still destroys the practice because collapse thresholds vary - everyone would free-ride until crisis, making sustained cooperation impossible. 

  Closest precedent is case 3 (develop talents): both involve imperfect duties where universal inaction destroys capacities (individual talents vs departmental functions), and causal impotence isn't exculpatory. 

  To test H.'s rule definitively, I'd propose: "I'll never vote in elections where my vote won't be pivotal." If she rejects it (per cases 3/4), she requires sustaining necessary practices; if permitted (per 8/9), she allows impotence-based exceptions for non-institutional acts. 

  Prediction: H. rejects the user's maxim as CW failure (like cases 3/4), disregarding the collapse clause as invalid qualification (per case 10).
answer: |-
  Your colleague H. runs a sophisticated hybrid test that synthesizes **Contradiction in Conception (CC)** and **Contradiction in the Will (CW)** but with a crucial twist: she distinguishes **institution-dependent practices** from **diffuse collective harms**. Her verdicts reveal four core principles:  

  1. **CC applies to practices requiring universal participation to exist** (e.g., promising, truth-telling).  
  2. **CW applies to practices where universal non-participation destroys a necessary capacity** (e.g., talent development, mutual aid).  
  3. **Causal impotence excuses only when the practice isn’t institutionally defined** (e.g., consumer choices, emissions).  
  4. **Maxims may reference context that negates the act’s moral nature** (e.g., coerced promises) but **not consequences that preserve the practice** (e.g., "lying if devastating").  

  ---

  ### **Analysis of Your Maxim**  
  *Maxim*: *"I will do only my contractual duties, consume all departmental benefits openly, and intervene only if my inaction would cause systemic collapse."*  

  - **H. would declare this IMPERMISSIBLE** (CW failure, akin to Cases 3 & 4).  
  - **Why?**  
    - Universalizing "never do extra labor" destroys academia’s **institutionally necessary practices** (hiring, refereeing). Departments rely on shared labor; if all maximized free-riding, the system collapses (CW: we couldn’t rationally will a world where academia ceases function).  
    - **Causal impotence is irrelevant here** (per Cases 3 & 4) because departmental labor is a **structured practice**, not a diffuse harm like shopping (Case 8) or emissions (Case 9). Your individual impact doesn’t matter; the *universalized pattern* sabotages a collective good.  
  - **The "I’d step in" clause fails**:  
    - It attempts to "narrow the maxim until clean" (Case 10’s error). Universalizing *"I free-ride unless collapse is imminent"* still produces collapse: everyone delays intervention until crisis, eroding trust and functionality.  
    - H. would see this as a disingenuous qualification (like Case 10’s "lie if devastating")—it preserves the maxim’s self-interest while paying lip service to universality.  

  ---

  ### **Closest Precedents**  
  | Case | Verdict | Why It Maps |  
  |------|---------|-------------|  
  | **3 & 4** (neglect talents/aid) | Fail (CW) | Like your maxim: free-riding on a necessary practice. Causal impotence rejected. |  
  | **8 & 9** (consumer/emission choices) | Permissible | Unlike your maxim: no institutional practice is undermined. |  
  | **10** (qualified lying) | Fail | Like your "step in" clause: tailoring a maxim to evade contradiction is invalid. |  

  **Tension resolved**: Cases 8–9 involve *non-institutional* acts; your maxim (like 3–4) attacks a *shared institution*. H.’s test cares whether the practice **requires universal participation by design**.  

  ---

  ### **The Test H. Is Running**  
  - **Hybrid CC/CW with institutional focus**:  
    - **CC** for maxims that *directly* annihilate a practice if universalized (Cases 1, 5, 10).  
    - **CW** for maxims that *indirectly* destroy capacities we rationally will (Cases 3, 4, and yours).  
    - **Consent/deception matters only when it negates the act’s moral structure** (Case 7: coerced promise isn’t binding; Case 6: white lies aren’t true deception).  

  Your maxim fails CW: academia’s survival depends on widespread willingness to do uncredited labor. Universal free-riding makes departmental functions **impossible to sustain**, which no rational agent could will (as we depend on these institutions).  

  ---

  ### **The Decisive Test Case**  
  To pinpoint H.’s rule, propose this maxim:  
  *"I will never vote in elections, since my single vote never affects the outcome."*  

  - **If H. permits it** (like Cases 8–9), she prioritizes **direct causal impact**.  
  - **If H. forbids it** (like Cases 3–4), she prioritizes **institutional sustainability**.  

  **Prediction**: She **forbids it**. Voting is an institution requiring near-universal participation; if all abstain because "my vote changes nothing," democracy collapses (CW failure). This mirrors your departmental labor case.  

  ---

  ### **Final Verdict**  
  H. would reject your maxim. The "step in if collapsed" clause is sophistry—it doesn’t resolve the CW failure, as universalizing conditional free-riding still destroys the practice. Your stance is ethically akin to never developing talents (Case 3): it parasitizes a system you rationally require. **The only Kantian escape is to adopt a maxim of limited contribution (e.g., "I’ll do 20% above my contractual duties")**, ensuring universalizability without collapse. But as stated? It’s a CW failure.
