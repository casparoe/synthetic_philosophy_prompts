answer: |-
  ## Joint Statement: Adaptationist and Skeptic Perspectives on Evolutionary Psychology

  **Preamble:** We, an adaptationist researcher and a skeptic of mainstream evolutionary psychology (EP), acknowledge the profound importance of understanding the evolutionary origins of human cognition and behavior. Our disagreements stem not from the value of this goal, but from methodological rigor, evidential standards, and the interpretation of findings. Through adversarial collaboration, we identify points of convergence and clarify the nature of our remaining disagreements, structured around the core distinction within any adaptationist hypothesis: the **Specialization Claim** (domain-specific mechanism), the **Provenance Claim** (tuning to an ancestral problem), and the **Design Claim** (selection as the primary explanation for the mechanism's structure). We agree these claims are separable and can be independently supported or falsified.

  **Section 1: Agreed Claims**

  1.  **The Tripartite Distinction is Fundamental:** Evaluating any EP hypothesis requires disentangling whether it posits a specialized mechanism (vs. general learning), whether that specialization plausibly maps to a recurrent ancestral problem, and whether selection *for solving that problem* (as opposed to other evolutionary processes) best explains the mechanism's observed structure. A hypothesis can be valid on one claim (e.g., Specialization) while failing on another (e.g., Design).
  2.  **Spandrels/Byproducts: Scope and Limits:** The existence of byproducts (spandrels) is an undeniable evolutionary reality. Demonstrating that a trait *could be* a byproduct of another adaptation is a valid critique that *undermines the necessity* of the Design Claim for that specific problem. However, establishing that a trait is *merely* a byproduct requires positive evidence for the primary adaptation and the developmental pathway linking them. The byproduct objection does *not*, by itself, invalidate the Specialization or Provenance Claims, nor does it preclude the possibility that the byproduct was later co-opted (exapted) and shaped by selection.
  3.  **WEIRD Samples: A Critical Limitation:** The overwhelming reliance on samples from Western, Educated, Industrialized, Rich, and Democratic (WEIRD) societies severely constrains the generality of EP findings. This limits robust testing of the Provenance Claim (is the mechanism truly universal, reflecting an ancestral tuning?) and the Design Claim (is cultural transmission or specific modern environmental factors sufficient to explain the observed pattern?). Cross-cultural validation, especially in diverse small-scale societies and across developmental contexts, is not merely desirable but essential for credible claims about universality and evolutionary origins.
  4.  **"Innate" vs. "Reliably Acquired": Clarifying the Target:** Neither party endorses a simplistic "genetic determinism." A mechanism is usefully considered "innate" in the context of EP hypotheses if its development is **canalized** – emerging reliably across the vast majority of statistically normal human environments (including necessary but ubiquitous inputs like nutrition, social interaction, or basic sensory input), exhibiting a characteristic structure and functional specificity without requiring highly specific, variable, or instruction-dependent learning. "Reliably acquired" mechanisms, in contrast, depend critically on specific, variable environmental inputs or cultural transmission that *could* differ across normal human environments. Distinguishing these requires evidence of developmental robustness across diverse (but normal) environments and, where possible, cross-cultural universality in the mechanism's core structure.

  **Section 2: Residual Disagreements (Position Summaries)**

  | Point of Disagreement          | Adaptationist Position                                                                                                | Skeptic Position                                                                                                                               |
  | :----------------------------- | :-------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Empirical Focus & Burden**   | Strong evidence for complex, domain-specific functional design (Specialization) provides a compelling *prima facie* case for selective history (Design), demanding a high burden of proof for non-selective explanations. | Evidence of Specialization alone is insufficient to infer Design. The burden lies *squarely* on EP to rule out plausible developmental, cultural, or byproduct explanations *before* invoking selection history. |
  | **Prevalence of Adaptation**   | Natural selection is the primary architect of complex functional organization in the mind, as in the body. While not the only process, it is the dominant explanation for core cognitive architecture relevant to fitness. | While selection shaped the brain, complex, domain-specific cognitive adaptations for specific ancestral problems are likely rarer than often claimed. Many phenomena are better explained by domain-general learning interacting with reliably present environments or are byproducts. |
  | **Strength of Current Evidence** | A significant body of work provides strong, converging evidence supporting all three claims (Spec, Prov, Design) for key mechanisms (e.g., certain aspects of language, kinship, mate preferences, cheater detection). | Much current EP evidence is consistent with multiple explanations; it often fails to rigorously test the Design Claim against plausible alternatives. Many findings are best seen as supporting only Specialization or possibly Provenance, but not uniquely Design. |

  **Section 3: Cruxes – Predictions and Substantive Debates**

  1.  **The Credit Asymmetry Crux:**
      *   **Issue:** Adaptationists claim successful predictions confirm adaptation; failed predictions are often attributed to "mismatch" with modern environments. Skeptics argue this asymmetry shields hypotheses from falsification.
      *   **Proposed Test:** A pre-registered registry of specific, falsifiable predictions derived *exclusively* from hypothesized ancestral functions (Provenance Claim). Predictions would be tested against:
          *   **(a) Hold-out populations:** Culturally distinct groups, especially non-WEIRD societies, that the hypothesizer *did not* study during hypothesis development.
          *   **(b) Novel Modern Environments:** Contexts where an *ancestrally* tuned mechanism (if it exists) should produce specifiable, suboptimal, or erroneous outputs (misfire).
      *   **Adaptationist Prediction:** For well-supported hypotheses (with prior evidence for Specialization and plausible Provenance), predictions will hold significantly above chance in hold-out populations. Misfires in novel modern environments will be observed as predicted, demonstrating the mechanism's ancestral tuning. The registry will confirm the predictive power and specificity of adaptationist reasoning.
      *   **Skeptic Prediction:** Many prominent hypotheses will fail significantly when tested against hold-out populations or show misfires inconsistent with the specific ancestral-problem tuning proposed. Failures will often require significant *ad hoc* modification of the original hypothesis or mismatch explanation, revealing weaker support for the specific Provenance and Design Claims than previously asserted. The registry will expose the fragility of many current claims.
      *   **Nature:** **Substantive.** This test aims to directly evaluate the robustness and specificity of the Provenance Claim and its link to observable predictions, moving beyond post-hoc explanations.

  2.  **The Reliability Gap Crux:**
      *   **Issue:** If a specialized mechanism emerges reliably in *all* normal human environments due to canalized development triggered by ubiquitous input, is this meaningfully different from an "adaptation"? Or is the skeptic's "plasticity" alternative merely a redescription?
      *   **Adaptationist View:** A canalized, reliably developing specialized mechanism *is* an adaptation. Its reliable emergence *is* the product of natural selection shaping developmental pathways to produce this functional outcome predictably. Calling it "plasticity" is misleading; it's highly *constrained* plasticity producing a specific design. The "reliably present input" is often *itself* an evolved feature of human environments or social structures. The Design Claim holds.
      *   **Skeptic View:** While selection shaped the developmental system, labeling the *specific mechanism* as an "adaptation *for X*" is often unwarranted. The mechanism might be a robust developmental outcome of domain-general processes interacting with ubiquitous inputs (e.g., basic social interaction, pattern detection), not a module sculpted *by selection specifically for solving X*. The empirical content lost is the *specific history* of selection targeting *that problem* to shape *that mechanism*. The alternative explanation is that the mechanism's structure is an emergent property of more fundamental, selected systems interacting with reliably present, but not specifically *X*-related, inputs. The Design Claim for *X* is challenged.
      *   **Nature:** **Substantive, but bordering on conceptual.** The core disagreement is whether "adaptation" requires a specific history of selection *targeting the functional design of the mechanism for the specific problem* (Adaptationist) vs. allowing that the mechanism reliably emerges from broader selected systems + reliable environment without that specific targeting history (Skeptic). This relates to definitions of adaptation and the level of analysis. Resolving it requires evidence about developmental dissociations and the *uniqueness* of the mechanism's fit to problem *X*.

  **Flagged Verbal Dispute:** The core of the "Reliability Gap" debate hinges significantly on the definition of "adaptation." If "adaptation" means **present engineering fit** to solve a problem (regardless of precise selective history), the canalized mechanism qualifies. If "adaptation" means a **history of selection specifically targeting that function**, the canalized mechanism might not qualify if its structure arises primarily from broader constraints. *We agree this definitional difference exists and underlies part of the disagreement.* However, the Skeptic's challenge to the *specific selective history* (Design Claim) for problem *X* retains empirical substance even acknowledging the definitional issue.

  **Conclusion:** This statement clarifies common ground on core conceptual distinctions and methodological limitations while precisely delineating remaining disagreements and testable cruxes. We hope it fosters more rigorous hypothesis formulation, testing, and interpretation within evolutionary psychology, moving the field beyond unproductive polemics towards empirically resolvable questions.
