answer: |-
  Below is a taxonomy tree for idealized preference theories, structured around the logical space of distinctions. The root is the shared premise your group accepts: **"Defer to desires improved by idealization, not occurrent desires."** Each branch is labeled with a splitting question, leading to 11 leaves (within your 10–12 target). Leaves are defined by their answer patterns, with named views inserted where they fit. I've prioritized your requested distinctions, added key ones for completeness, and flagged indistinguishable leaves/empty combinations honestly.

  ### Taxonomy Tree
  **Root**: Defer to desires improved by idealization (non-occurrent)  
  │  
  ├── **Branch 1: Purpose?**  
  │   ├── **Welfare**: Defines what is *good for* the person.  
  │   │   │  
  │   │   ├── **Branch 2: What does idealization subtract?**  
  │   │   │   ├── _Only factual ignorance_: **Epistemic view** (e.g., Railton-inspired).  
  │   │   │   ├── _Factual ignorance + instrumental irrationality_: **Williams-style** (sound deliberative route from existing motivations).  
  │   │   │   └── _All flaws (ignorance, irrationality, incoherence, weakness of will, false beliefs)_:  
  │   │   │       │  
  │   │   │       └── **Branch 3: Order-sensitivity?**  
  │   │   │           ├── _Commutative (order-invariant)_: **Brandt-style** (full information + cognitive psychotherapy).  
  │   │   │           └── _Non-commutative (order matters)_: Unnamed (e.g., iterative refinement).  
  │   │   │  
  │   │   └── **Branch 4: Identity discontinuity?**  
  │   │       ├── _Accept any change_: **Williams-style** or **Brandt-style** (if order-ignored).  
  │   │       └── _Reject radical change_: Welfare with identity constraint (unnamed; e.g., requires core motivation retention).  
  │   │  
  │   └── **Authority**: Defines what we're *permitted to do* (consent/morality).  
  │       │  
  │       ├── **Branch 5: Aggregation method?**  
  │       │   ├── _Extrapolate individuals, then merge_:  
  │       │   │   │  
  │       │   │   └── **Branch 6: Assume convergence?**  
  │       │   │       ├── _Yes, or fail_: **CEV-style** (coherence and convergence).  
  │       │   │       └── _No, handle divergence_: Extrapolate-then-bargain (unnamed; e.g., Nash equilibrium).  
  │       │   │  
  │       │   └── _Merge group, then extrapolate_:  
  │       │       │  
  │       │       └── **Branch 7: Merge mechanism?**  
  │       │           ├── _Veil of ignorance_: **Veil-style** (ex ante choice under ignorance).  
  │       │           └── _Universal perspective_: **Hare-style** (universalization across persons).  
  │       │  
  │       └── **Branch 8: Meta-preferences?**  
  │           ├── _Override (no veto)_: **CEV-style**, **Veil-style**, or **Hare-style** (if meta-preference ignored).  
  │           └── _Respect (veto power)_: Authority with meta-veto (unnamed; e.g., liberal consent).  
  │  
  └── **Branch 9: Allow zero improvement?**  
      └── _Yes_: **Anti-paternalist** (defer to occurrent desires).  

  ---

  ### Leaf Descriptions
  Each leaf includes:  
  - **Most awkward commitment**: A key counterintuitive implication.  
  - **Loss function**: What you'd hand to an optimizer (simplified for clarity).  
  - **Position in tree**: Answer pattern to locate it.  

  1. **Epistemic view** (e.g., Railton)  
     - **Path**: Welfare → Only factual ignorance.  
     - **Awkward commitment**: Must satisfy fully informed desires even if they remain incoherent or self-destructive.  
     - **Loss function**: Maximize satisfaction of desires formed under complete factual knowledge.  

  2. **Williams-style**  
     - **Path**: Welfare → Factual ignorance + instrumental irrationality.  
     - **Awkward commitment**: Cannot generate "better" desires if they aren't derivable from existing motivations (e.g., a selfish person's good stays selfish).  
     - **Loss function**: Satisfy preferences reachable via sound deliberation from current motivations (no desire reform).  

  3. **Brandt-style**  
     - **Path**: Welfare → All flaws → Commutative.  
     - **Awkward commitment**: Cognitive psychotherapy may erase desires central to identity (e.g., religious desires based on false beliefs).  
     - **Loss function**: Satisfy desires after exposure to full information and cognitive psychotherapy (removes "irrational" desires).  

  4. **Welfare with identity constraint** (unnamed)  
     - **Path**: Welfare → Identity discontinuity → Reject radical change.  
     - **Awkward commitment**: If idealization dissolves core desires (e.g., due to false self-belief), we default to a vague blend of actual/idealized preferences.  
     - **Loss function**: Satisfy idealized desires only if they share >X% overlap with current desires; else, use weighted average.  

  5. **CEV-style**  
     - **Path**: Authority → Extrapolate individuals then merge → Assume convergence.  
     - **Awkward commitment**: No guidance if idealized preferences diverge (e.g., fixed-point failure).  
     - **Loss function**: Find fixed-point of coherent, converged volitions; if none, undefined.  

  6. **Extrapolate-then-bargain** (unnamed)  
     - **Path**: Authority → Extrapolate individuals then merge → Handle divergence.  
     - **Awkward commitment**: Aggregation method (e.g., bargaining) is arbitrary and may ignore individual ideals.  
     - **Loss function**: Maximize joint satisfaction of extrapolated preferences, with conflict resolved by a predefined rule (e.g., Nash bargaining).  

  7. **Veil-style**  
     - **Path**: Authority → Merge group then extrapolate → Veil of ignorance.  
     - **Awkward commitment**: Chosen principles may not reflect anyone's actual values (e.g., "impartial" rules feel alien).  
     - **Loss function**: Implement rules chosen by self-interested agents behind a veil of ignorance (ignorant of their identity).  

  8. **Hare-style**  
     - **Path**: Authority → Merge group then extrapolate → Universal perspective.  
     - **Awkward commitment**: Forces agents to abandon personal commitments for impartiality (e.g., "sacrifice your child for strangers").  
     - **Loss function**: Satisfy preferences each agent would hold if they prescribed universally (equal weight to all interests).  

  9. **Authority with meta-veto** (unnamed)  
     - **Path**: Authority → Meta-preferences → Respect (veto power).  
     - **Awkward commitment**: A single objector can block group idealization, risking tyranny of irrationality.  
     - **Loss function**: For objectors, satisfy occurrent desires; for others, satisfy idealized desires; aggregate via voting or consensus.  

  10. **Anti-paternalist**  
      - **Path**: Allow zero improvement → Yes.  
      - **Awkward commitment**: Must obey desires even if irrational or transient (e.g., addict's request for drugs).  
      - **Loss function**: Maximize satisfaction of current, occurrent preferences.  

  11. **Procedural view** (malformed question)  
      - **Path**: Not on tree (applies to all leaves).  
      - **Awkward commitment**: Defers hard choices to process, risking unjust outcomes (e.g., democratic oppression).  
      - **Loss function**: No loss function; use fair procedures (e.g., deliberative democracy) to decide actions.  

  ---

  ### Special Case Handling
  - **Idealized self prefers replacement/non-existence**:  
    - Welfare leaves (1–4) accept this (awkwardly: e.g., "die now" if idealized).  
    - Authority leaves (5–9) ignore it unless aggregation overrides (e.g., group vetoes self-destruction).  
    - Anti-paternalist (10) rejects idealization, so defers to actual desire to live.  

  ---

  ### Flags
  **Indistinguishable leaves**:  
  - **Williams-style** (welfare) and **Brandt-style** (welfare) overlap if order-sensitivity is ignored. Brandt’s cognitive psychotherapy implies non-commutativity (therapy before/after info matters), but Williams is silent. In practice, advocates conflate them.  
  - **CEV-style** and **Extrapolate-then-bargain** blur if divergence handling is underspecified (e.g., "assume convergence" vs. "assume it rarely fails").  

  **Empty combinations**:  
  - **Welfare + Merge group first**: Incoherent (welfare is individual; merging requires interpersonal comparison).  
  - **Authority + Subtract only false metaphysical beliefs**: Unattractive (e.g., permits irrationality in moral decisions; no named view).  
  - **Add desires during idealization**: Unexplored (all views subtract; adding is seen as paternalistic).  
  - **Identity discontinuity + Veil-style**: Empty (veil ignores personal identity; no tension).  

  **Order-sensitivity note**: The "commutativity node" is explicit in Branch 3. Non-commutative views (e.g., inform then cohere vs. cohere then inform) are rare but coherent; they appear in iterative methods (e.g., recursive CEV) but lack standard names.  

  This taxonomy isolates core disagreements (e.g., purpose changes everything: welfare leaves tolerate idiosyncratic goods; authority leaves enforce interpersonal justification). Use it to map positions via case intuition, not labels.
