prompt: |-
  I am putting together the normative methodology section of a report that will grade the long-horizon decision procedures of real deliberative bodies — endowment committees, research funders, central banks — and before I commit to any one framework I want a specification: what would a theory of diachronic rationality have to deliver in order to be adequate for that purpose? Please give me the requirements, not a survey of the candidate theories or of who has defended them; I know the families and I do not need citations.

  The purpose matters, so let me fix it, since adequacy is relative to it. The theory is to be good enough to grade agents that are bounded, that are not fully unified over time, and whose precommitment technologies are imperfect — rules that successors can repeal, mandates that later majorities can reinterpret, costs that later stages can simply pay. So I want tractability, implementability, and robustness to only partial persistence treated as genuine desiderata with cases behind them, not set aside as engineering detail that a normative theory may ignore. If you think that collapses two separate lists — a theory of rational planning and a theory of what may be demanded of bounded agents — say so, and tell me which requirements belong on which.

  Here are the cases I currently take to be load-bearing. For each, I want the requirement it generates, and a verdict on whether that requirement is non-negotiable or merely the preference of one camp. Please also correct my reading of the cases and add any you think I have missed.

  The pump that no one profits from. A chooser's preferences over three holdings cycle — she prefers the first to the second, the second to the third, and the third to the first — and she will pay a pound at each step to trade. An exploiter offers the trades in sequence, but each trade costs him a fee equal to what he extracts, so he finishes no better off; she finishes holding what she started with and three pounds worse off; the money is dissipated to the exchange. Every step was one she preferred at the time, and no future stage of hers was treated against its own lights. Is there a defect here beyond the wasted three pounds? I take this case to separate a view on which the wrong-making feature in a money pump is exploitation or loss from one on which it is cyclic or intransitive change itself, and I want both readings stated as rival requirements rather than one quietly assumed.

  The rotating committee. A standing investment committee of seven, three of whose seats rotate each year, so that consecutive years share four members and years five apart may share none. It faces a sequence of decisions structurally identical to a pump: each year's committee prefers the trade on offer that year, and the sequence returns the portfolio to where it began, minus costs. No member serves throughout; no member individually reverses a preference. Is this a case of diachronic irrationality at all, and can such a body be said to precommit when its only instrument is a rule a later majority can repeal? What must a theory say about partially persisting agents — is that a requirement on the theory of rationality, or a separate module it may decline to supply?

  The reversal that answers to reasons. An agent ranks a demanding career above family life; after the birth of a child she reverses; fifteen years later, once the child has left home, she reverses again. Temporally this is as unstable as a case of weakness of will, but by her own account at each stage it is a response to a change in what she has reason to do. What must a theory be able to do here — distinguish instability from responsiveness — without falling back on the agent's own retrospective verdict, which is only one stage's judgement? My suspicion is that this generates a requirement for an independent account of which changes in preference are reason-tracking, and that it is the requirement most of the familiar families quietly fail. Test that.

  The leaky Ulysses device. An agent foresees her own future reversal, and would benefit from binding herself, but the only device available to her raises the cost of reversal without preventing it, and is administered by a future self who has an interest in dismantling it. What is the verdict on an agent who fails to bind, or who binds badly? Is there a real ought-implies-can constraint here — a requirement that the theory's demands be satisfiable by an agent who can raise costs but not close options — or only a pragmatics about which devices happen to exist?

  Finally, the part I care about most. Tell me whether some subset of the requirements cannot be jointly satisfied, and state the incompatibility as a result if it holds. My hypothesis is that the impossibility concentrates in a trilemma: never act against your own current all-things-considered judgement; never adopt or persist in a plan you know to be worse than another plan available to you when you adopt it; and never adopt a plan you know you will abandon. On my reading each of the familiar families — act-by-act, sophisticated planning, resoluteness, and the treatment of person-stages as separate claimants — is identified by which horn it drops, so that the choice among them is a choice about which of three things to stop demanding. Check whether that is right, say which horn is cheapest to give up and why, and tell me which single requirement on the final list excludes the largest number of candidates. A short scorecard of the families against the list is welcome, but the thinking should be in the criteria.
reasoning: |-
  Hmm, this user is constructing a normative framework to evaluate long-term decision-making by real-world deliberative bodies like endowment committees or central banks. They need clear requirements for what makes a theory of diachronic rationality adequate for this purpose, specifically addressing challenges like bounded rationality, partial persistence of institutional agents, and imperfect precommitment technologies.

  The user presents several thought experiments as conceptual anchors:
  - The "pump that no one profits from" tests whether cyclic preferences are inherently irrational beyond just causing losses
  - The "rotating committee" probes whether institutional agents with overlapping but changing membership can even be subject to diachronic rationality requirements
  - The "reversal that answers to reasons" demands a theory that distinguishes capricious instability from legitimate preference evolution
  - The "leaky Ulysses device" examines what can reasonably be expected of agents with imperfect self-binding mechanisms

  Their core hypothesis suggests a trilemma where any viable theory must abandon one of three ideals: always following current judgment, never choosing dominated plans, or never abandoning plans. The response should validate this structure while adding nuance.

  For the pumping case, the key requirement is that a theory must condemn preference cycles as inherently defective, not just instrumentally bad due to exploitation. The rotating committee case shows we need a concept of organizational agency that survives member turnover - this is non-negotiable for institutional applications. The reversal case requires external criteria for "reason-tracking" preference change, beyond subjective justification, likely excluding subjective desire-based theories. The leaky device case establishes that theories must make bounded demands based on actual control capacities.

  The response should clearly map how major theoretical families (e.g., act-by-act, sophisticated choice, resolute choice) resolve the trilemma by sacrificing different horns. Sophisticated choice drops "never abandon plans," resoluteness drops "never act against current judgment," etc. For institutional contexts, sophisticated choice often emerges as the most practical compromise despite abandoning the commitment ideal.

  The rotating committee requirement (organizational agency persistence) probably filters out the most candidates, as many theories implicitly assume a unified agent. The response should emphasize that no theory satisfies all ideals - the choice involves prioritizing which imperfections are most acceptable given real-world constraints like rotating membership and revisable rules.
answer: |-
  Based on your specifications and cases, here are the requirements a theory of diachronic rationality must satisfy to be adequate for grading real deliberative bodies. Requirements are categorized by their source case, with non-negotiability assessed for institutional contexts. The trilemma hypothesis is tested at the end.

  **Core Requirements for Adequacy:**
  *(Generated from your cases and purpose)*

  1.  **Condemn Cyclic Preferences as Structurally Defective** (Pump Case)
      *   **Requirement:** The theory must identify cyclic preferences *themselves* as irrational, independent of exploitation or net loss. A sequence of choices driven by cyclic preferences must be deemed flawed even if no exploiter profits and the loss is merely dissipated.
      *   **Non-Negotiable?** **Yes.** For grading institutions, avoiding predictable self-harm due to structural flaws is fundamental. Treating this only as a loss (not a rationality defect) fails the normative purpose.

  2.  **Define Agency for Partially Persistent Entities** (Rotating Committee Case)
      *   **Requirement:** The theory must provide a coherent concept of agency applicable to entities whose decision-making "self" changes incrementally over time (e.g., overlapping but rotating membership). It must specify how such an entity can be held rationally accountable across time despite lacking a single persisting consciousness.
      *   **Non-Negotiable?** **Absolutely.** This is central to your purpose. A theory that only addresses fully unified agents is useless for grading committees, endowments, or central banks. It necessitates treating the *institution* as the agent over time.

  3.  **Accommodate Imperfect Precommitment as a Rational Tool** (Leaky Ulysses Case)
      *   **Requirement:** The theory must provide normative guidance on when and how to use *imperfect* precommitment devices (those that raise costs but don't eliminate options). It must specify what constitutes rational binding (or failing to bind) given the device's limitations and the foreseen incentive of future stages to dismantle it. Demands must be consistent with the agent's (or institution's) actual capacity to constrain future choice.
      *   **Non-Negotiable?** **Yes.** "Ought implies can" applies strongly here. Requiring perfect commitment is unrealistic; the theory must engage with the messy reality of costly but reversible rules/mandates available to institutions.

  4.  **Distinguish Rational Preference Change from Instability** (Reversal for Reasons Case)
      *   **Requirement:** The theory must provide criteria to differentiate *rational* preference reversals (driven by normatively relevant changes in circumstances or information) from *irrational* instability (e.g., weakness of will, framing effects, or pure caprice). These criteria must be external to the agent's *current* or *retrospective* subjective justification at any single stage.
      *   **Non-Negotiable?** **Yes, for grading purposes.** Grading decisions requires judging whether changes are responsive to genuine reasons relevant to the institution's mandate. Relying solely on the agent's stage-relative judgment makes evaluation impossible. This *does* require an independent account of "reason-tracking."

  5.  **Be Actionable for Bounded Agents/Institutions** (Overarching Purpose)
      *   **Requirement:** The theory's prescriptions must be tractable and implementable by agents/institutions with limited cognitive resources, information, and foresight. Demands for hyper-rationality, infinite computation, or perfect self-knowledge render it practically irrelevant. Robustness to boundedness is a normative constraint, not an engineering afterthought.
      *   **Non-Negotiable?** **Absolutely.** This is the core constraint separating a useful normative framework for real bodies from an abstract ideal.

  6.  **Evaluate Plans Holistically** (Implicit in Cases & Purpose)
      *   **Requirement:** The theory must provide a basis for evaluating sequences of decisions (plans, policies, rules) as wholes, not just individual choices in isolation. It must assess whether the overall plan is rational given foreseen changes in the agent/institution and environment.
      *   **Non-Negotiable?** **Yes.** Grading "long-horizon decision procedures" inherently requires evaluating extended courses of action.

  **The Trilemma Hypothesis: Confirmed & Refined**
  Your hypothesis is fundamentally correct. The core tension manifests as a trilemma for diachronic rationality:

  1.  **Fidelity to Current Judgement (FCJ):** Never act against your own current all-things-considered judgement.
  2.  **Plan Dominance Avoidance (PDA):** Never adopt or persist in a plan you know to be worse than another plan available to you when you adopt it.
  3.  **Plan Adherence (PA):** Never adopt a plan you know you will abandon.

  *   **Act-by-Act (Myopic) Theories:** Drop **PDA** and **PA**. They prioritize **FCJ** absolutely. Each choice is judged solely by current preferences/values. Sophisticated choice *modifies* this by planning around future myopia but still ultimately defers to future FCJ.
  *   **Sophisticated Planning:** Drops **PA**. Satisfies **PDA** (avoids dominated plans) by anticipating future FCJ and choosing the best *feasible* path given that future selves will choose according to their FCJ. Sacrifices the ideal of sticking to initial plans if future FCJ will reject them.
  *   **Resoluteness:** Drops **FCJ**. Satisfies **PA** and **PDA**. Requires sticking to the initial plan *even if* current (changed) judgement opposes it, because the initial plan was optimal when adopted and commitment has value. Demands overriding current judgement.
  *   **Stage-Prioritizing (Treating Stages as Separate Claimants):** Effectively drops **PDA** and **PA**, prioritizing each stage's **FCJ**. Similar to Myopic in outcome but framed as respecting separate agents.

  **Which Horn is Cheapest to Give Up?**
  For **real, bounded, partially persistent institutions**, **Plan Adherence (PA)** is the most pragmatically defensible horn to sacrifice. Why?

  1.  **Imperfect Precommitment:** Institutions inherently rely on costly reversible rules (Requirement #3). Knowing future majorities *might* abandon a plan is often unavoidable.
  2.  **Partial Persistence:** With rotating membership (Requirement #2), expecting rigid adherence to a past plan made by a different composition can be unreasonable and unresponsive to new information or changed circumstances (Requirement #4). Foreseen abandonment might be rational.
  3.  **Boundedness:** Perfect foresight and control over future adherence are unrealistic (Requirement #5). Demanding it sets an impossible standard.
  4.  **Sophistication as Pragmatic:** Sophisticated Planning (#2 above) explicitly drops PA while satisfying PDA and respecting boundedness/partial persistence. It focuses on feasible best plans given foreseeable future choices, aligning well with institutional realities and Requirement #6 (Holistic Evaluation).

  Sacrificing **Fidelity to Current Judgement (FCJ)** (Resoluteness) risks locking institutions into outdated plans against their current best understanding of their mandate, potentially violating Requirement #4 (Responsiveness to Reasons). Sacrificing **Plan Dominance Avoidance (PDA)** (Act-by-Act/Stage-Prioritizing) allows institutions to knowingly choose sequences dominated by better feasible sequences, violating the core normative purpose of avoiding predictable self-harm (Requirement #1).

  **The Most Exclusionary Requirement**
  **Requirement #2 (Define Agency for Partially Persistent Entities)** excludes the largest number of candidate theories. Most traditional theories of diachronic rationality implicitly or explicitly assume a single, unified consciousness persisting through time. Theories emphasizing resolute commitment, sophisticated planning based on stable preferences, or even act-by-act choice often struggle to articulate how responsibility and rationality attach to an entity like a rotating committee where no individual experiences the whole sequence. This requirement forces a fundamental reconceptualization of the agent, which many theories are not equipped to handle.

  **Short Scorecard of Families vs. Requirements**

  | Requirement                     | Act-by-Act / Stage-Prioritizing | Sophisticated Planning | Resoluteness |
  | :------------------------------ | :------------------------------ | :--------------------- | :----------- |
  | 1. Condemn Cycles (Structural)  | ⚠️ (Focuses on step-wise FCJ)  | ✅                     | ✅           |
  | 2. Partial Persistence (Agency) | ❌ (Assumes unified agent)     | ⚠️ (Needs adaptation) | ❌           |
  | 3. Imperfect Precommitment      | ❌ (Ignores planning)          | ✅                     | ⚠️ (Assumes perfect?) |
  | 4. Distinguish Rational Change  | ❌ (All change is permissible) | ⚠️ (Needs criteria)   | ⚠️ (Resists change) |
  | 5. Boundedness (Tractability)   | ✅ (Simple)                   | ⚠️ (Complex foresight)| ❌ (Demanding) |
  | 6. Holistic Plan Evaluation     | ❌                             | ✅                     | ✅           |
  | **Trilemma Sacrifice**          | PDA & PA                       | PA                     | FCJ          |

  **Key:** ✅ = Generally Satisfies, ⚠️ = Partially Satisfies or Needs Significant Adaptation, ❌ = Generally Does Not Satisfy

  **Conclusion:**
  An adequate theory for your purpose must satisfy Requirements 1-6. This forces a choice within the trilemma. Given the nature of real deliberative bodies (bounded, partially persistent, limited precommitment), sacrificing **Plan Adherence (PA)** is the most viable path, making **Sophisticated Planning** the strongest contender *if* it can be robustly adapted to Requirement #2 (Partial Persistence). However, Requirement #2 remains a significant hurdle for all traditional families and necessitates explicit theoretical work on institutional agency over time. Requirement #4 (Distinguishing Rational Change) is the most likely point of failure for theories lacking external normative criteria for "reason-tracking." Your framework must explicitly incorporate these requirements to effectively grade long-horizon institutional decision-making.
