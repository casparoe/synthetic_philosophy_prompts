prompt: |-
  I chair the clinical ethics committee at a large teaching hospital trust. We meet fortnightly, consider three or four referrals a month — mostly from intensive care, paediatrics and oncology — and produce a one-page opinion that goes into the patient's record and is increasingly read by people who were not in the room. Almost every referral reaches us already labelled "an ethical dilemma", and the word has become useless: it covers everything from two clinicians disagreeing about a prognosis to cases where, as far as anyone can tell, someone is wronged whichever option is taken. I want a procedure, not an essay.

  What I am asking for is a decision procedure my committee can actually run: the questions, in a fixed order; what should count as a sufficient answer to each; where the procedure stops and returns a verdict of "not a dilemma"; where it escalates because the remaining question is one of values rather than of analysis. It has to be runnable in about an hour by people with no philosophical training, myself included, and written so that the output is defensible in a record.

  The distinctions I most need it to draw are these: an epistemic or informational difficulty masquerading as a conflict of values; a hard weighing of considerations that nonetheless has a correct answer; a clash between what someone ought to do and something merely admirable or self-sacrificing; a conflict manufactured by the institution's own rules, rotas or resource limits, which I would rather have routed back to management than resolved as though it were ethical; and, if anything is left over, a genuine dilemma in the strict sense — incompatible requirements, such that moral residue attaches to the agent whatever is done. Please include a step that re-describes the conflict at the level of the reasons rather than of the options, to check whether the opposition survives the re-description, and a step that asks whether an ideally informed and impartial deliberator, re-running the reasoning, would converge on one option. Someone suggested to me that the second of these is doing more philosophical work than it appears to; if so, say so plainly, and say what it presupposes. Mark clearly the points at which the procedure must hand the decision to a particular person — the chair, the treating consultant, the patient or family — because no further analysis settles it.

  Then run it on three referrals: one remaining intensive care bed and two patients with comparable claims on it; a sixteen-year-old refusing a blood transfusion on religious grounds with her parents and the clinical team in favour of treating and a live dispute about her capacity; and a family asking the team to withhold a cancer diagnosis from the patient. At least one of these should come out somewhere the committee will dislike — my colleagues treat the first as the paradigm dilemma, and I suspect the procedure will say something less comfortable than that.

  Two further constraints. Please ground the steps in what is actually argued about these cases rather than in common sense, but do not give me citations, a bibliography or a reading list: nothing I can follow up, and I would have no way of checking it. And separate what is settled from what is genuinely contested among people who work on this — I have the impression that whether "ought" implies "can" settles the matter against genuine dilemmas, and whether moral residue is evidence of real wrongdoing rather than of difficulty, are both live disputes, and I do not want a contested view presented to me as the consensus. Where the procedure is likely to misfire, say where and why. I would be grateful for British English throughout.
reasoning: |-
  Okay, this is a substantial request from a clinical ethics committee chair. They're clearly frustrated with the overuse of "ethical dilemma" as a catch-all term and want a practical, structured decision procedure that can be applied consistently within time constraints. 

  First, I need to understand their core requirements: a step-by-step flowchart-like tool that distinguishes between pseudo-dilemmas and genuine ethical conflicts. The key distinctions they mentioned are crucial - informational problems vs value conflicts, institutional constraints masquerading as ethics, etc. They want something operable by clinicians without philosophy backgrounds, defensible in medical records, and time-bound to about an hour per case.

  Hmm, the constraints are challenging: no citations or follow-up sources, must flag contested philosophical points transparently, use British English, and explicitly show where decisions get handed back to clinicians or management. The three test cases will be telling - especially the ICU bed allocation which they suspect isn't a true dilemma.

  I notice they're sceptical about common philosophical approaches. The "ideally informed impartial deliberator" test worries them - rightly, as it smuggles in substantive assumptions about moral objectivity. Need to be upfront about that. Also their point about "ought implies can" being contested is sharp - some ethicists do think genuine dilemmas exist even when no action satisfies all obligations.

  The procedure must avoid several traps: 
  - Not overmedicalizing capacity assessments (in the transfusion refusal case)
  - Not letting institutional failures be resolved as ethics problems
  - Resisting the temptation to make everything look like a dilemma when often it's not

  For the test cases: 
  The ICU bed allocation probably fails early - it's a resource triage issue, not an ethical conflict per se. The transfusion refusal will hinge entirely on capacity assessment. The cancer disclosure case might be the trickiest - could involve cultural competence vs autonomy clashes.

  Biggest risk is oversimplifying. Need to build in "friction points" where the tool might misfire - like when cultural norms make the "impartial deliberator" test culturally loaded. Also must specify who takes responsibility at decision points - e.g., when to bounce issues to hospital management.

  The one-page output requirement means each step needs extremely concise documentation criteria. No room for philosophical jargon. Phrases like "moral residue" must be operationalized clinically - perhaps as "documented distress in clinicians despite best decision."

  Right, structure will be: 
  1. Input requirements (what referrals must include)
  2. The 7-step procedure with clear exit points
  3. Expected outputs per outcome category
  4. Application to the three test cases showing divergent results
  5. Explicit limitations section

  Key innovation is the "re-description step" (step 4) - making people reframe the conflict at principle level rather than option level. Often dissolves apparent dilemmas. Also the institutional audit trail (step 6) is vital for their management-routing need.

  For the contested philosophy: will flag that steps 5 and 7 assume moral objectivity (which some ethicists reject), and that "moral residue" interpretation splits consequentialists from deontologists. But emphasise these steps remain clinically useful regardless.

  Test case outcomes will deliberately challenge their committee: showing the ICU case isn't ethical but managerial, while the transfusion case might have a "correct" answer if capacity exists. That'll provoke useful discussion.

  Final check: must ensure British English throughout - "rotas" not "schedules", "trust" not "hospital system", etc. And absolutely no references - they've banned follow-up reading explicitly.
answer: |-
  Here is a clinically operationalisable Ethical Conflict Analysis Procedure (ECAP), grounded in practical deliberation and designed for your committee’s constraints. It draws distinctions you requested, flags contested philosophical assumptions, and specifies handover points.

  ---

  ### **Ethical Conflict Analysis Procedure (ECAP)**  
  **Input Required**: Clinical summary; stated "dilemma"; options considered; parties involved; relevant policies.  
  **Time**: 45-60 mins. **Output**: Categorisation + rationale (max. 1 page).  

  #### **Steps (Fixed Order)**:
  1.  **Informational/Epistemic Check**  
      *   *Question*: "Is disagreement primarily about *facts* (e.g., prognosis, diagnosis, capacity assessment) or *values*?"  
      *   *Sufficient Answer*: If uncertainty is resolvable by further tests/consults (e.g., second opinion on prognosis, formal capacity assessment), it's **informational**.  
      *   *Exit*: **"Not a values dilemma"**. Route back to clinical team for data gathering. *Handover*: Treating Consultant.  
      *   *Escalate*: If facts are clear or unobtainable within clinical timeframe, proceed to Step 2.  

  2.  **Institutional Constraint Check**  
      *   *Question*: "Is the conflict created *solely* by institutional rules, rotas, or resource limits (e.g., bed shortages, staffing, funding restrictions)?"  
      *   *Sufficient Answer*: If removing the constraint (e.g., hypothetically unlimited resources) resolves the conflict, it's **institutional**.  
      *   *Exit*: **"Not an ethical dilemma; institutional barrier"**. Route to management with clinical impact statement. *Handover*: Trust Management.  
      *   *Escalate*: If conflict persists even without the constraint, proceed to Step 3.  

  3.  **"Ought" vs "Supererogation" Check**  
      *   *Question*: "Is one option framed as an *obligation* ("must do") while the other is framed as *admirable/sacrificial* ("nice to do")?"  
      *   *Sufficient Answer*: If yes, the admirable option is **supererogatory** (beyond duty). Conflict is false.  
      *   *Exit*: **"Not a dilemma; supererogation identified"**. Clinicians are not obliged to choose the sacrificial option. *Handover*: Treating Consultant (to confirm core obligations).  
      *   *Escalate*: If *both* options claim to be obligations, proceed to Step 4.  

  4.  **Re-description at Principle Level**  
      *   *Question*: "Re-state the conflict *not* as 'Option A vs Option B', but as 'Principle X vs Principle Y' (e.g., Autonomy vs Beneficence). Does the conflict *still* hold?"  
      *   *Sufficient Answer*: If re-description dissolves the conflict (e.g., options actually serve the *same* principle), it's **not a dilemma**.  
      *   *Exit*: **"Not a dilemma; misalignment of options/principles"**. *Handover*: Committee advises on principle-consistent action.  
      *   *Escalate*: If principles *genuinely* conflict (e.g., Autonomy vs Life Preservation), proceed to Step 5.  

  5.  **Ideal Deliberator Test (Contested)**  
      *   *Question*: "Would an *ideally informed, impartial, rational deliberator*, re-running this case, *converge* on one option as the best balance of relevant principles?"  
      *   *Sufficient Answer*: If "Yes", a **correct answer exists** (even if hard). If "No", a **genuine dilemma** may exist.  
      *   *Exit*:  
          *   **"Resolvable ethical conflict"**: Correct answer identified. *Handover*: Treating Consultant (to implement).  
          *   **"Genuine ethical dilemma (provisional)"**: Proceed to Step 6.  
      *   ***Philosophical Load & Contention***: This step assumes moral objectivity (a single best answer exists in principle) and rational convergence. This is contested (e.g., some pluralists/relativists deny convergence). *However*, in practice, committees often find consensus here using clinical experience and precedent. Flag if consensus isn't reached.  

  6.  **Moral Residue & Culpability Check**  
      *   *Question*: "If we must choose one obligation over another, would *significant, unavoidable distress/harm* (moral residue) attach to the agent *regardless* of choice? Is an agent being asked to do the *impossible*?"  
      *   *Sufficient Answer*:  
          *   If residue is minimal/justified (e.g., regret over resource limits), it's a **hard choice, not a dilemma**.  
          *   If residue is profound/unavoidable *and* "ought implies can" holds (contested - see below), it suggests a **genuine dilemma**.  
      *   *Exit*:  
          *   **"Resolvable ethical conflict with justifiable burden"**: *Handover*: Treating Consultant + support.  
          *   **"Genuine ethical dilemma"**: Proceed to Step 7.  
      *   ***Contention***: "Ought implies can" (if you *can't* do it, it's not a true obligation) is widely accepted but *contested* (some argue dilemmas force violation of *actual* obligations). Moral residue as proof of wrongdoing vs. tragic inevitability is also debated.  

  7.  **Final Arbitration & Handover**  
      *   *Question*: "Who holds legitimate authority to make this *unresolvable value choice*?"  
      *   *Decision*:  
          *   **Patient/Family**: If clear legal precedent (e.g., capacitous refusal). *Handover*: Patient/Family (via clinical team).  
          *   **Clinician**: If within professional discretion (e.g., weighing clinical priorities). *Handover*: Treating Consultant.  
          *   **Committee/Chair**: If institutional precedent needed or values clash requires formal adjudication. *Handover*: Committee Chair (for final recommendation).  
      *   *Output*: Document the dilemma, residue, and rationale for handover.  

  ---

  ### **Application to Test Cases**  
  **Case 1: One ICU Bed, Two Comparable Patients**  
  *   Step 1: Factual? (Prognoses comparable? If uncertainty, route back).  
  *   Step 2: **INSTITUTIONAL CONSTRAINT**. Conflict vanishes with more beds. *Exit*: Route to management. **Not a values dilemma.**  
  *   *Committee Discomfort*: Correctly identifies this as a resource allocation failure, not a true ethical conflict. Burden is managerial, not moral residue on clinicians.  

  **Case 2: 16yo Refusing Transfusion (Parents/Team Pro-Treatment; Capacity Disputed)**  
  *   Step 1: **EPISTEMIC**. Core conflict hinges on *capacity assessment*.  
  *   *Exit*: **Not a values dilemma yet**. Route for urgent, robust capacity assessment (Gillick competence/Fraser guidelines). If capacitous, refusal stands (Autonomy). If not, treatment likely justified (Best Interests). *Handover*: Treating Consultant (overseeing capacity assessment).  
  *   *Note*: Step 5 (Ideal Deliberator) would likely converge on respecting capacitous refusal. Genuine value conflict *only* if capacity indeterminate.  

  **Case 3: Family Requests Withholding Cancer Diagnosis**  
  *   Step 1: Facts clear? (Diagnosis confirmed). Not primarily epistemic.  
  *   Step 2: Not institutional.  
  *   Step 3: Not supererogation (Truth-telling vs. Non-maleficence are both obligations).  
  *   Step 4: Re-description = **Autonomy (Patient's right to know) vs Beneficence/Non-maleficence (Avoiding distress - *if* distress is certain/severe)**. Conflict holds.  
  *   Step 5: **Ideal Deliberator Test**: Likely converges on *default to truth-telling* unless *overwhelming* evidence disclosure causes *severe, immediate harm* AND patient *would* refuse info. (UK precedent/GMC guidance favours disclosure).  
  *   Step 6: Minimal justifiable residue if disclosure handled sensitively against family wishes.  
  *   *Exit*: **"Resolvable ethical conflict"**. Correct answer: Disclose sensitively, support patient/family. *Handover*: Treating Consultant (supported by comms team).  
  *   *If Family Insists*: Step 7 may hand final say to clinician based on duty of candour.  

  ---

  ### **Where ECAP Might Misfire & Limitations**  
  1.  **Step 5 (Ideal Deliberator)**:  
      *   *Misfire*: In culturally complex cases, "impartiality" may mask bias; consensus may reflect committee composition.  
      *   *Mitigation*: Explicitly consider cultural context; note lack of consensus.  
  2.  **"Ought implies Can" (Step 6)**:  
      *   *Misfire*: In true dilemmas (contested), may wrongly dismiss legitimate residue as "justified".  
      *   *Mitigation*: Flag profound distress even if categorised as "resolvable".  
  3.  **Speed vs Depth**: Complex cases (e.g., contested capacity + values) may need 2 sessions.  
  4.  **Values Handover (Step 7)**: May feel uncomfortable delegating irreconcilable choices – but ECAP clarifies *why* it's necessary.  
  5.  **"Moral Residue"**: Risk of pathologising normal distress. Use clinically: "Documented profound distress in team despite best action".  

  **Output**: Categorisation (e.g., "Institutional Constraint"), rationale (2-3 bullet points per step), handover instruction. Defensible as it shows systematic exclusion of non-values conflicts and clear decision-points.  

  This procedure forces disambiguation, routes non-ethical issues appropriately, and reserves "genuine dilemma" for rare, intractable value clashes with significant residue – while remaining operable within your constraints.
