answer: |-
  ### Reference Class Problem: Decomposed Concerns
  1. **Class Selection**: Criteria for choosing among multiple eligible reference classes.
  2. **Conflict Resolution**: Handling divergent estimates from overlapping admissible classes.
  3. **Probability Interpretation**: Whether the output is a "true" individual probability or a pragmatic, group-based estimate.

  ### Proposed Clinical Risk Estimation Procedure
  **Constraints Adherence**:  
  - **Analyst Skill**: Uses pre-approved lists and automated registry queries (no complex modeling).  
  - **Runtime**: ≤1 hour via SQL/Python on existing registry.  
  - **Governance**: Changes to admissibility criteria or practice require chair signature.  

  **Key Innovations**:  
  - **Positive Admissibility Criteria** (replacing purely negative definition).  
  - **Conflict Handling** via hierarchy of specificity and clinical coherence, not averaging.  
  - **Explicit Handoffs** to clinicians for values-based decisions.  

  ---

  ### Step-by-Step Procedure  
  *Analyst runs Steps 1–5; Steps 3a and 6 require committee involvement.*  

  1. **Identify Candidate Classes**  
     - **Question**: "Which registry classes contain the patient and have ≥200 outcomes?"  
     - **Sufficient Answer**: List of classes with:  
       - Class definition (variables used).  
       - Sample size (*n*), outcome count, risk estimate.  
       - Time of variable measurement (must be pre-prediction).  
     - **Failure**: If no class has *n* ≥200 → **Exit: "No estimate"**.  

  2. **Apply Positive Admissibility Criteria**  
     - **Question**: "Which classes meet all admissibility conditions?"  
     - **Admissibility Definition** (all required):  
       - **Temporal**: Variables measured *before* prediction time.  
       - **Non-Proxy**: Not a subcomponent or direct consequence of the outcome (e.g., "30-day survivors" for 1-year mortality is inadmissible).  
       - **Recording Standard**: Variable documented in ≥90% of registry patients, with missingness audited (if missingness >10%, class excluded unless imputation validated).  
       - **Pre-Specification**: Class defined *prior* to analysis (no data-dredging).  
       - **Plausibility**: Variable on committee’s **pre-approved list** (see *Governance* below).  
     - **Output**: Filtered list of admissible classes.  

  3. **Resolve Conflicts via Specificity Hierarchy**  
     - **Question**: "What is the most specific *clinically coherent* class or class-group?"  
     - **Method**:  
       - **Step 3a (Judgment Call)**: Group classes into tiers by *clinical meaningfulness* (pre-defined by committee):  
         - **Tier 1**: Guidelines-endorsed variables (e.g., age, diabetes status).  
         - **Tier 2**: Biomarkers/conditions with mechanistic links (e.g., eGFR for CKD).  
         - **Tier 3**: Indirect proxies (e.g., PPI use for fracture risk).  
       - **Step 3b**: Within highest-priority tier, select the **smallest class(es)** with *n* ≥200.  
         - If one class → **Return its estimate**.  
         - If multiple classes:  
           - If all estimates differ by ≤3pp → **Return median estimate**.  
           - If estimates differ by >3pp → **Exit: "Conflict; escalate to Step 6"**.  

  4. **Handle Remaining Conflicts**  
     - **Question**: "Is there a dominant class at a lower tier?"  
     - **Method**: Repeat Step 3b for next-lower tier.  
     - **Failure**: If no tier yields agreement → **Exit: "No consensus estimate"**.  

  5. **Final Check: Clinical Context**  
     - **Question**: "Does the estimate align with known risk modifiers not in the registry?"  
     - **Method**: Flag cases where:  
       - Patient has rare traits (e.g., novel gene variant).  
       - Estimate contradicts established clinical knowledge.  
     - **Output**: If flagged → **Escalate to clinician for contextual interpretation**.  

  6. **Human Escalation Points**  
     - **Step 3a**: Disputes over tier assignment of variables (values-based).  
     - **Step 5**: Contextual mismatch (e.g., rare genetics).  
     - **Ad Hoc**: Patient/clinician requests manual review.  

  ---

  ### Governance Requirements (Chair Signature Needed)  
  - **Pre-Approved Variable List**: Tier assignments and plausibility justifications.  
  - **Admissibility Thresholds**: 90% recording standard, 3pp conflict threshold.  
  - **Tier Definitions**: Clinical coherence hierarchy (updated annually).  

  ---

  ### Case Applications  
  **Case 1: 62F with Diabetes, CKD, PPI Use**  
  - Classes: Postmenopausal diabetes (9%, *n*=500), CKD stage 2 (14%, *n*=450), PPI use (7%, *n*=600).  
  - **Procedure**:  
    1. All admissible (pre-approved, pre-measured).  
    2. **Tier Assignment**:  
       - Diabetes/CKD: Tier 1 (guidelines-endorsed).  
       - PPI: Tier 3 (indirect proxy).  
    3. **Conflict in Tier 1**: Estimates (9%, 14%) differ by 5pp >3pp → Escalate to Step 6.  
    4. **Step 6 Outcome**: Committee selects CKD class (stronger evidence for fracture risk) → **Report 14%**.  

  **Case 2: 34M with Rare Collagen Variant**  
  - Classes: Gene variant (risk=15%, *n*=4 → excluded), Men<40 (0.5%, *n*=10,000).  
  - **Procedure**:  
    1. Only "Men<40" admissible.  
    2. **Tier 1**: Age/sex are Tier 1.  
    3. **Conflict**: None (only one class) → **Report 0.5%**.  
    4. **Step 5 Flag**: Rare variant not captured → Escalate to clinician.  
    5. **Clinician Override**: Manual adjustment based on variant literature → **Report 12%**.  

  **Case 3: 71M with Atrial Fibrillation (Strange Subgroup)**  
  - Classes: 40 subgroups scanned; one unpredicted subgroup (risk=20% vs. typical 5–10%, *n*=250).  
  - **Procedure**:  
    1. **Admissibility Check**: Subgroup excluded (data-dredged → violates pre-specification).  
    2. Next narrowest class: Age 70–79 + AF (risk=8%, *n*=300) → **Report 8%**.  
    3. **Step 5 Flag**: Striking subgroup finding → Refer to committee for future model refinement.  

  ---

  ### What the Procedure Cannot Do  
  1. **Deliver "True" Individual Probability**:  
     - Output is a **defensible group-based estimate**, not a Bayesian posterior for the patient.  
     - Auditable as "the risk in the most clinically appropriate registry cohort," not "this patient’s unique risk."  

  2. **Limitations**:  
     - **Unmeasured Variables**: Cannot adjust for factors absent from the registry.  
     - **Novel Risks**: Fails for unprecedented patient profiles (e.g., new gene variants).  
     - **Dynamic Variables**: Assumes static traits (e.g., cannot handle evolving biomarkers).  
     - **Causal Inference**: Estimates association, not causation.  

  3. **Ethical Safeguard**:  
     - **Explicit Disclaimers**: All estimates labeled: "Based on registry cohort similarity; individual risk may vary."  

  ### Output Summary  
  The procedure systematizes reference class selection and conflict resolution while transparently separating statistical pragmatism from philosophical claims about probability. It prioritizes auditability, clinician engagement, and governance, explicitly acknowledging when outputs reflect operational compromises rather than ontological truths.
