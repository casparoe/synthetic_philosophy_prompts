prompt: |-
  You are a philosopher of probability who also works closely with clinical prediction modelling. Before you write anything, spend a moment sorting out the distinct problems that get bundled together under the reference class problem — how to choose among classes, what to do when admissible classes conflict, and what a probability statement about a single case is even supposed to mean — so that your procedure does not silently collapse them into one.

  I chair the prediction-governance committee at a hospital network. Several times a week we are asked to sign off on an individualised risk estimate — this patient's five-year chance of a major osteoporotic fracture is 11%, say — that goes into the chart and triggers or withholds an intervention. Clinicians and patients challenge these numbers constantly, and the challenge always has the same shape: why that group and not another one? Any patient sits in dozens of statistically respectable classes that disagree.

  Our current draft rule, written by a statistician, is two lines: take the narrowest reference class for which the registry holds at least 200 observed outcomes; and if two or more admissible classes both contain the patient and differ by more than three percentage points, report the average of their estimates weighted by the square root of each class's sample size. Admissibility is defined only negatively: a class may not be built from a variable measured after the outcome is determined, and may not have been chosen after seeing which classes gave interesting numbers.

  Turn this into a procedure my committee can actually run. Give me the questions in order, what counts as a sufficient answer to each, a positive account of admissibility (I suspect the negative definition is not enough — I do not know what to do with a class defined by something that merely proxies the outcome, like patients who survived at least thirty days, or by a variable nobody recorded the reasons for), a better way of handling conflict between classes than our averaging rule, the point at which the procedure returns no individual estimate rather than a number, and the points where it hands the question to a person because it is a question of values rather than evidence. Constraints: the analyst running it day to day has one week of applied statistics, it must run in under an hour on our existing registry, and anything that changes practice needs my signature. Say plainly which steps are judgement calls dressed up as procedure.

  Then run it on three cases: a 62-year-old woman with type 2 diabetes and stage 2 chronic kidney disease, where classes defined by postmenopausal diabetes, by kidney stage, and by long-term proton-pump inhibitor use give five-year fracture risks near 9%, 14% and 7%, all from large samples; a 34-year-old man with a rare collagen gene variant, where the narrow class has four patients and the broad class of men under 40 gives a risk so low it would withhold treatment — I expect the procedure to give me an answer I do not like here; and a 71-year-old man with atrial fibrillation, where a scan over forty subgroups turned up one subgroup with a strikingly different stroke risk that nobody had predicted and that would change his management if used.

  Finally, tell me what the procedure cannot do, and in particular whether it can ever deliver the probability that this patient has an event, as opposed to a defensible and auditable way of choosing a number.
reasoning: |-
  We are facing the reference class problem in clinical prediction. The problem has several layers:
   1. How to choose among multiple reference classes?
   2. How to handle conflicting estimates from multiple admissible classes?
   3. What is the meaning of a probability statement for a single case?

   Our goal is to turn the draft rule into a step-by-step procedure that:
   - Is runnable by an analyst with one week of applied statistics training.
   - Runs in under an hour on existing registry.
   - Clearly identifies steps that are judgment calls (requiring committee signature).
   - Has a positive account of admissibility (beyond the negative definition).
   - Handles conflicts better than the current averaging rule.
   - Specifies when to return no estimate and when to hand over to a human (for value judgments).

   Draft rule currently:
     Step 1: Take the narrowest reference class with at least 200 observed outcomes.
     Step 2: If two or more admissible classes (with at least 200) that contain the patient differ by more than 3 percentage points, report the average weighted by square root of sample size.

   Problems with draft:
     - Negative admissibility only: we need a positive definition.
     - The averaging rule may not be the best way to handle conflict.
     - We need to know when to not give a number.

   Proposed Procedure:

   I. Positive Definition of Admissibility:
     A reference class is admissible if and only if:
       a) It is defined by variables that are:
          - Measured before the prediction time (temporal condition).
          - Not a consequence of the outcome (causal condition).
          - Recorded in a standard way across the registry (reliability condition).
       b) The variables defining the class are known to be (or strongly suspected to be) causally related to the outcome, or at least are not known to be merely a proxy for the outcome that would lead to tautological predictions (e.g., survival for 30 days as a proxy for 1-year survival would be problematic because it is part of the outcome). However, note that for fracture risk, surviving 30 days might be a condition for being at risk, but if it is used to define the class, it might create a selected group. We must avoid classes that are defined by events that occur after the prediction time but before the outcome, unless they are true baseline variables.

     We add:
       c) The class definition must not be based on a variable that is a direct consequence of the outcome (e.g., a biomarker that is released only after the event occurs) or that is an intermediate step in the causal pathway to the outcome (unless we are explicitly conditioning on that step, which requires a different model).

     However, note that the problem of "a variable nobody recorded the reasons for" (i.e., we don't know why it was recorded or if it's reliable) is tricky. We require:
       d) The variable must have been recorded for at least 90% of the patients in the registry (to avoid selection bias) and the reasons for missingness must be documented and not related to the outcome (if missingness is related to the outcome, then the class based on that variable may be biased). If the missingness rate is above 10%, then the variable is not admissible unless a multiple imputation procedure has been applied and validated.

     Also, we must avoid classes that are defined by post-baseline events that are not fixed at the time of prediction. So:

       e) The variables must be fixed at the time of prediction (e.g., demographics, genetic variants, past medical history) or be modifiable factors that we are explicitly conditioning on (like current treatment, but then note that if the treatment is changed, the risk changes).

     But note: the current draft rule already excludes variables measured after the outcome. We are adding:

       - Avoid variables that are measured after the prediction time (unless they are fixed and known at prediction time).

     We also add a scientific plausibility condition:

       f) The variable must be included in the class definition only if there is a known biological or clinical rationale for its association with the outcome, or if it has been consistently identified in previous studies. This is a judgment call and must be pre-specified in a list of variables that are allowed for reference class definition. The committee must maintain and update this list (with committee chair signature for changes).

     Therefore, admissibility is not just negative. We require positive evidence that the variable is appropriate.

   II. Step-by-Step Procedure:

     Step 1: Identify all reference classes in the registry that contain the patient and for which we have at least 200 observed outcomes (as per draft).

     Step 2: Filter for admissibility using the positive criteria above (a to f). This step requires:
          - Checking the variable definitions and timing (a, b, c, e).
          - Checking the missingness (d): if the variable has more than 10% missing and no validated imputation, exclude.
          - Checking against the pre-approved list of variables (f). This list must be maintained by the committee.

     Step 3: From the admissible classes, select the narrowest class(es). Narrowest is defined as the class with the fewest members (i.e., most specific). If there is exactly one narrowest class (i.e., there is a unique class with the smallest size that is admissible and has >=200 outcomes), then use that class's risk estimate.

     Step 4: If there are multiple narrowest classes (i.e., tied for smallest size) and they all have risk estimates within 3 percentage points of each other, then report the average of these estimates (unweighted, because they are of the same size, but if sizes differ then we have to be careful: note that the draft rule uses weighted average by sqrt(n) in a different context). However, note: the draft rule's conflict resolution is when two or more admissible classes (not necessarily the narrowest) that contain the patient and are above the size threshold differ by more than 3 points. So we must adjust.

     We propose a different approach for conflict:

     After Step 2, we have a set of admissible classes. We then:

          Step 3a: Group the admissible classes by their level of specificity. We define levels by the number of variables in the class definition (more variables = more specific) and by the size (smaller = more specific). We want the most specific classes that are still large enough (>=200).

          Step 3b: Among the classes that are at the highest level of specificity (i.e., the most specific, which may be defined by the maximum number of variables and/or the smallest size) and have at least 200, we then check for agreement:

              - If there is only one such class, use it.
              - If there are multiple, and they agree (all estimates within 3 percentage points of the median estimate of these classes), then take the median (or average) of these most specific classes.

          Step 3c: If they do not agree (i.e., the range of estimates in the most specific classes is more than 3 percentage points), then we look at the next level of specificity (i.e., slightly broader classes, but still with >=200). We continue until we find a level of specificity that has at least one class and for which all the classes at that level agree (within 3 points).

