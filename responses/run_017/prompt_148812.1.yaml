  Hmm, the user is writing a paper on norms and conventions and is grappling with the phrase "conventions are arbitrary." They've encountered this in two arguments: one using arbitrariness to dismiss normative criticism of unfair conventions, and another claiming that arbitrary conventions should dissolve easily with changed expectations. They want a disambiguation of "arbitrary" across three dimensions and analysis of whether these support the two arguments. They also want two test cases evaluated and their own proposed partition assessed.

  I need to break down "arbitrary" systematically. The user suggested three dimensions: what is arbitrary (content, selection, etc.), the sense of arbitrariness (substitutable, unreasoned, etc.), and scope (all conventions or subsets). I'll build a table covering combinations of these.

  For the "what" dimension: I'll include content (the rule itself), selection (why this one was chosen), compliance reasons (why people follow it), causal history (how it arose), and revisability (how easy to change). For "sense": substitutable (an alternative would work), unreasoned (no independent reason), capricious (random/chosen without principle), morally inert (no moral weight), epistemically ungrounded (no evidence), and "up to us" (dependent on collective attitudes). For scope: all conventions, pure coordination (no payoff differences), or gradual vs. decreed origins.

  I'll evaluate each combination as platitude, defensible, or false, and note if it supports either argument. For example, the substitutable sense applied to selection is a platitude for pure coordination conventions and supports the first argument only weakly. The unreasoned sense applied to compliance reasons is defensible but doesn't support the first argument well because even arbitrary-seeming conventions might have latent reasons.

  The user's test cases: the broken microscope (no current alternative) and the left-side walking with safer right-side exit (non-arbitrary reason). I need to check which readings classify these as conventions. For the microscope, readings requiring current substitutability fail, which might be a problem for them. For the corridor, readings denying independent reasons fail, which could be a point against them.

  Their partition into content, selection, and revisability arbitrariness is good but risks conflating historical possibility with current revisability. I'll suggest adding a fourth dimension—persistence arbitrariness—to separate path-dependency from current flexibility.

  I'll structure the response with a table first, then discussions of the two arguments, the probes, and their partition. The table will have rows for each reading, with columns for evaluation and support for arguments. In the discussions, I'll explain why the first argument is weak (arbitrariness doesn't imply immunity to criticism) and why the second is flawed (conventions resist change due to network effects). For the probes, I'll note how they challenge certain readings. Finally, I'll endorse their partition but suggest refining it to address their worry about history making alternatives unreachable.
answer: |-
  Below is a disambiguation of "conventions are arbitrary" across your specified dimensions, presented as a menu of distinct theses. A table summarises the readings, followed by analyses of the two moves, the probe cases, and your proposed partition. British English is used throughout.

  ### Table: Disambiguation of "Conventions are Arbitrary"
  | **Reading** | **What is Arbitrary?** | **Sense of "Arbitrary"** | **Scope** | **Verdict** | **Supports Move 1?** | **Supports Move 2?** |
  |-------------|------------------------|--------------------------|-----------|-------------|----------------------|----------------------|
  | **R1**      | Content of regularity | Substitutable (another would serve equally well) | Pure coordination conventions | Platitude | Weakly (but trivialises criticism) | No |
  | **R2**      | Selection of regularity | Substitutable | Pure coordination conventions | Platitude | Weakly (shifts focus to selection fairness) | No |
  | **R3**      | Selection of regularity | Capricious/unchosen | All conventions | False (many selections are path-dependent) | No | No |
  | **R4**      | Agents' reasons for compliance | Unsupported by independent reason | All conventions | Defensible (conventions need no external justification) | **Yes** (but overstates) | Partially (if "expectations" exclude reasons) |
  | **R5**      | Agents' reasons for compliance | "Up to us" (dependent on collective attitudes) | All conventions | Defensible | No | **Yes** (if "public shift" alters attitudes) |
  | **R6**      | Causal history | Capricious/unchosen | All conventions | False (history often constrained) | No | No |
  | **R7**      | Causal history | Epistemically ungrounded | All conventions | False (conventions arise from observable patterns) | No | No |
  | **R8**      | Susceptibility to deliberate replacement | "Up to us" | All conventions | Defensible | No | **Yes** (if "public shift" enables replacement) |
  | **R9**      | Content & persistence | Morally inert | All conventions | Substantive claim (often false; e.g., discriminatory conventions) | **Yes** (but empirically questionable) | No |
  | **R10**     | Content of regularity | Unsupported by independent reason | All conventions | False (many conventions have latent reasons) | No | No |

  ---

  ### Analysis of the Two Moves
  1. **Move 1 (Criticism blocked by arbitrariness)**  
     Supported only weakly by **R1**, **R2**, and **R4**, but these trivialise or overstate. **R1/R2** make arbitrariness a defining feature of pure coordination, rendering criticism tautologically void but uninteresting ("this convention solves coordination; fairness is irrelevant"). **R4** claims compliance requires no independent reason, but unfair burdens may *create* new reasons (e.g., moral objections), undermining the move. **R9** (moral inertness) is the strongest support but is empirically false: many conventions (e.g., gendered dress codes) encode moralised values. *Verdict: Move 1 is unsound; arbitrariness rarely immunises conventions from criticism.*

  2. **Move 2 (Dissolution via shifted expectations)**  
     Supported only by **R5** and **R8**. **R5** ties compliance to collective attitudes ("up to us"), so shifting expectations *should* dissolve conventions. **R8** suggests conventions are revisable by collective will. However, both ignore *network effects*: conventions persist due to sunk costs, institutionalisation, or belief in their "rightness" (e.g., driving on the left in the UK). A "public shift" may not alter behaviour if individuals distrust others' compliance. *Verdict: Move 2 over-simplifies; conventions resist dissolution due to practical inertia, not hidden "content".*

  ---

  ### Probe Cases
  1. **Broken Microscope ("Lab Convention")**  
     - **Case**: A regularity (using left microscope) with no current alternative.  
     - **Readings that exclude it**: R1, R2, R10 (require substitutable alternatives).  
     - **Assessment**: This challenges **R1/R2**'s scope limitation. If "convention" applies here (as usage suggests), substitutability cannot be necessary. Better to treat substitutability as *historical* (right microscope *could* have been used pre-breakage) or *counterfactual* (if repaired). *Verdict: Case (a) refutes readings requiring current substitutability.*

  2. **Corridor with Fire Exit ("Keep Left")**  
     - **Case**: A regularity (keep left) despite independent reasons to prefer right (safety).  
     - **Readings that exclude it**: R4, R10 (deny independent reasons for content).  
     - **Assessment**: **R4/R10** falsely assume conventions *never* have latent reasons. Here, safety provides a reason to prefer right, but coordination may override it. The convention persists due to salience or precedent, not absence of reasons. *Verdict: Case (b) refutes readings denying independent reasons; conventions can coexist with (unheeded) justifications.*

  ---

  ### Your Three-Way Partition: Assessment  
  You propose:  
  - **Content-Arbitrariness**: No independent reason to prefer *this* rule (e.g., driving left vs. right).  
  - **Selection-Arbitrariness**: No necessary reason why *this* rule was selected (e.g., historical accident).  
  - **Revisability-Arbitrariness**: The rule can be replaced by collective action.  

  **Verdict**: This partition cuts close to the joints but risks conflating **modal** (could have been otherwise) and **practical** (can now be changed) dimensions. Your worry is valid:  
  - **Selection-arbitrariness** concerns *historical contingency* (e.g., "we drive left because of Napoleon").  
  - **Revisability-arbitrariness** concerns *current plasticity*, which depends on sunk costs, moralisation, or network effects (e.g., switching driving sides is costly).  

  **Recommendation**: Add a fourth category—**Persistence-Arbitrariness**—to distinguish whether a convention *remains* in place only due to expectations (e.g., fashion trends) or due to entrenched factors (e.g., legal enforcement). This addresses path-dependency (e.g., the broken microscope's history makes alternatives currently unreachable).  

  **Refined Partition**:  
  1. **Content-Arbitrariness** (Modal: no intrinsic superiority)  
  2. **Selection-Arbitrariness** (Historical: contingent origin)  
  3. **Persistence-Arbitrariness** (Explanatory: sustained only by expectations)  
  4. **Revisability-Arbitrariness** (Practical: amenable to deliberate change)  

  This separates "could have been" (1/2) from "can now become" (3/4), resolving your concern.  

  ---

  ### Conclusion  
  The slogan "conventions are arbitrary" is typically deployed as **R1** (substitutability in pure coordination) or **R4** (compliance without independent reason). Neither robustly supports **Move 1** (criticism-blocking) or **Move 2** (easy dissolution). Your probe cases expose flaws in rigid definitions, while your partition—augmented with persistence—captures the key dimensions. Focus on how *path-dependence* and *emergent justification* constrain arbitrariness: conventions often become "non-arbitrary" through entrenchment, even if their origins were contingent.
