answer: |-
  Here is a custom-built case meeting all your constraints, set in an ordinary workplace scenario. The key feature enabling the split is the speaker's **intentional disregard for the descriptive content** in using the phrase referentially, despite the description having a unique, contextually clear satisfier. The speaker is fully informed and correct about the object they intend to refer to, but the literal description applies uniquely to a different object.

  ### Scenario: Workplace Meeting
  At a project debrief in a small tech office, the team discusses a recent software rollout. Alex Chen (the only backend developer on the team) is absent today, but Jamie Rivera (the frontend developer) has just fixed a critical backend server issue that Alex normally handles. The team lead, Taylor, knows Alex is the sole backend developer and that Jamie is purely a frontend specialist. Seeing Jamie at the whiteboard explaining the backend fix, Taylor says to a colleague: "The backend developer is a hero today." Unbeknownst to Taylor, Alex (the actual backend developer) quietly resigned yesterday, effective immediately, leaving Jamie as the only developer who worked on backend code today—though Jamie’s formal role remains "frontend developer." Alex did nothing heroic; Jamie did.

  ### Analysis
  - **Russellian proposition**: ∃x (BackendDeveloper(x) ∧ ∀y (BackendDeveloper(y) → y=x) ∧ HeroToday(x))  
    - *Truth value*: **False**. There is exactly one backend developer (Alex, who resigned yesterday but is still contextually unique in the role; no one else has the title or responsibilities). However, Alex did nothing heroic today—Jamie did the heroic work. The unique satisfier (Alex) fails to satisfy "is a hero today."  
  - **Referential proposition** (singular, about Jamie): <Jamie, HeroToday>  
    - *Truth value*: **True**. Jamie is the individual Taylor intended to refer to (pointing at them while speaking), and Jamie is indeed a hero today for fixing the issue.  

  ### Key Feature Doing the Work
  The **speaker's intentional referential use overrides descriptive accuracy**. Taylor knows Alex is the official backend developer (no misidentification) and is fully informed about roles, but deliberately uses "the backend developer" to *point to Jamie*, who is acting in a backend capacity. The description has a unique satisfier (Alex), but Taylor exploits contextual cues (Jamie's actions) to refer to Jamie, disregarding the literal meaning.  

  ### What Happens If You Delete This Feature?
  If Taylor *lacks* this intentional disregard (e.g., if Taylor mistakenly believes Jamie is the backend developer), the case collapses into a **misdescription scenario** (like the martini case), which you want to avoid. The intentionality is crucial: it ensures the speaker is neither confused nor misinformed about the facts (roles are clear) but *chooses* to use the description referentially.  

  ### Strongest Russellian Response
  A Russellian would argue that the **semantic content** of the utterance is the quantificational proposition (false), while the referential reading is merely a **pragmatic implicature** (what the speaker meant or conveyed). They might say: "Taylor *communicated* something true about Jamie, but the literal meaning of 'the backend developer is a hero' is false because it quantifies over roles, not individuals-in-context. Descriptions contribute only general conditions to truth conditions; referential uses are speaker-dependent and not part of semantics." This preserves Russell’s theory by relegating the intuitive truth to pragmatics.  

  ### Why This Meets All Constraints
  - **No empty descriptions/uniqueness failure**: "Backend developer" has exactly one satisfier (Alex).  
  - **No perceptual mix-up/misidentification**: Taylor knows Alex is the backend developer and Jamie is not.  
  - **No loose talk/vagueness**: Roles are formally defined (backend vs. frontend); "hero" is clear (fixed a critical issue).  
  - **Speaker is informed/unconfused**: Taylor knows the facts but intentionally refers to Jamie.  
  - **Untutored verdict leans true**: Listeners would agree Taylor said something true about Jamie (not false about Alex), as the referential intent is clear from gestures/context.  
  - **Not a recycled case**: Avoids misperception (e.g., martini) by relying on role-based description + intentional referential use, not sensory error.  

  This case isolates the core debate: Russellians tie truth to descriptive satisfaction; referentialists tie it to speaker reference. The intentional disregard feature forces a split without collapsing into standard objections.
