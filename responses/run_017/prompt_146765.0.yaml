  ### 5. Feasible-Magnitude Variant
  - **What would have to be true**: That at a feasible magnitude (e.g., 10^14 specks vs. one year of torture), many people judge the torture as worse, which contradicts aggregationism if the rate is supposed to be finite but very high.
