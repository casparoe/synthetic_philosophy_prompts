  - **Defender Response**: This does not refute aggregationism but reframes it: the threshold view is actually a form of aggregation at a finer scale, so the debate becomes about the level of description. Aggregationists can accept that torture is worse because it aggregates more micro-harms, so the rate is still finite.
  - **Absorption Cost**: The view must accept that all harms are aggregations of micro-harms, which might be a refinement rather than a cost.

  ### 4. Framing Difference
  - **What would have to be true**: That the dust-specks vs. torture case is about comparing total states of the world, whereas real decisions are about the differences an agent's choice makes. The moral verdict might not transfer because of side effects or non-identity issues in real choices.
  - **Target**: The applicability of the aggregationist principle to actual decisions.
  - **Status**: Empirically open (it depends on the context of decision-making)
