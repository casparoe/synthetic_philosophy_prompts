answer: |-
  Here's a practical decision procedure designed for **30-minute case resolution**, prioritizing administrative defensibility over metaphysical certainty. It uses existing museum frameworks and legal concepts where possible.

  **Decision Procedure: Object Identity Verification**

  **Glossary:**
  *   **Substantial Transformation:** Change altering core function, identity, or material essence (customs/insurance term).
  *   **Accessioned Object:** The entity formally accepted into the collection with a unique number.
  *   **Material Component:** Physical substance constituting the object, potentially tracked separately.
  *   **Designated Function/Purpose:** The primary role/cultural meaning defined by creator/source/collection policy.
  *   **Creator/Source Intent:** Explicit instructions or documented cultural understanding of persistence.
  *   **Administrative Record:** Catalogue entries, loan agreements, accession forms, conservation reports.

  **The Procedure (Run in Order):**

  1.  **Check Administrative Record & Designation:**
      *   *Question:* What does the accession record, loan agreement, insurance schedule, or donor agreement **explicitly define** as the object? Is there a clear *sortal* (e.g., "bronze statue", "wax sculpture", "house post")?
      *   *Sufficient Answer:* A clear, unambiguous description matching the current item or its core components. If the record specifies the *material* (e.g., "original fragments of X statue") separately, note it.
      *   *Stop if:* The record definitively answers the specific question (e.g., "Insured item is the assembled figure, excluding infill material, Acc# 123.4"). **Proceed if ambiguous or conflicting.**
      *   *Judgment:* Minimal. Follow the written record strictly unless proven erroneous.

  2.  **Assess Change Type & Scale:**
      *   *Question:* What changes have occurred? (Accretion, Subtraction, Replacement, Reassembly, Replication). Quantify if possible (% replaced, parts added/removed).
      *   *Sufficient Answer:* Description based on conservation reports, visual inspection, or known history. (e.g., "60% original metal fragments reassembled with 40% modern infill", "Annual melting/recasting of same wax", "All planks replaced over time, original carvings incorporated").
      *   *Stop if:* Change is purely additive (accretion) *and* doesn't obscure/destroy the original's form/function. Original object persists. **Proceed** if subtraction, replacement, or replication is involved.

  3.  **Evaluate Functional/Cultural Persistence:**
      *   *Question:* Does the item **continue to serve the core Designated Function/Purpose** defined by its Creator/Source Intent or collection context, despite changes?
      *   *Sufficient Answer:* Yes - It still functions as/represents the intended thing (e.g., display statue, ritual object, artwork). No - Its core purpose/identity is lost (e.g., fragments unusable, melted wax isn't the sculpture until recast).
      *   *Handoff if:* **Creator/Source Intent is paramount** (common for living artists, source communities, specific bequests). Escalate to: **Curator-in-Charge** (for artist intent) or **Repatriation Committee/Community Liaison** (for source community claims) with the question: *"Does the creator/source community consider this iteration/state to be the persistent object, based on their intent/tradition?"* **Their documented decision is binding** for identity *within the museum's obligation*. Proceed if no clear intent or dispute.
      *   *Judgment:* Moderate. Requires understanding the object's defined role.

  4.  **Apply "Substantial Transformation" Threshold:**
      *   *Question:* Have the changes resulted in a **Substantial Transformation**? Consider:
          *   Loss/Destruction of core original material defining the object's historical/artistic essence?
          *   Fundamental alteration of form, structure, or appearance?
          *   Creation of a functionally *new* item?
      *   *Sufficient Answer:* Yes - A new/different entity exists. No - The original entity persists, albeit modified.
      *   *Stop if:* **No Substantial Transformation.** Original object persists. **Stop if:** **Substantial Transformation occurred.** A new object exists; the original may be considered lost/destroyed/component parts.
      *   *Judgment:* High. The core challenge. Focus on loss of *defining essence* over mere material percentage. Favor continuity where function/intent persists.

  5.  **Resolve Database/Numbering:**
      *   *Question:* How does the outcome map to our database structure (Object vs. Material Component)?
      *   *Action:*
          *   If the original object persists: Use its primary accession number. Track significant components (like original fragments) as linked sub-numbers if materially distinct.
          *   If a new object exists: Assign a new accession number. Relate it to the source material/object via provenance.
          *   If only material remains: Treat under its material number; the original object is deaccessioned if transformed/destroyed.
          *   Instructions/Digital Files: The file/instructions *are* the accessioned object. Physical instantiations (prints, casts) are derivatives, unless the accession *specifically* includes rights to create them.

  **What the Procedure CANNOT Do:**
  1.  **Determine Metaphysical Truth:** It won't tell you if there's a single "fact of the matter" about identity. It resolves **administrative identity** – what the museum *treats* the item as for contracts, records, and obligations.
  2.  **Resolve Deep Philosophical Disputes:** It provides a defensible framework, not absolute truth.
  3.  **Eliminate Judgment:** Steps 3 (Function) and 4 (Transformation) inherently require professional judgment. The procedure structures and documents this judgment.
  4.  **Override Legally Binding Contracts:** Existing loan agreements or insurance contracts with specific definitions take precedence (Step 1).
  5.  **Perfectly Handle All Edge Cases:** Some cases will remain ambiguous; the procedure ensures a documented, reasoned decision.

  ---

  **Application to Your Cases:**

  **Case 1: Bronze Figure (60% infill, fragments separate)**
  1.  **Record:** Likely ambiguous. Accession probably describes the figure, maybe mentions condition. Fragments have own number.
  2.  **Change:** Subtraction (corrosion loss), Addition (40% infill), Reassembly. Major material change.
  3.  **Function:** Persists? Yes. Still displayed as the intended bronze figure.
  4.  **Transformation?** **Judgment Call:** *Probably NOT substantially transformed.* Core form, artistic intent, and significant original material (60%) persist. Modern infill is supportive, not defining. **Original object persists.**
  5.  **Database:** Primary accession number = The assembled figure. Original fragments remain linked material components under their number.
      *   **Loan/Insurer:** The assembled figure (primary acc#) travels/is insured as the accessioned object. Disclose condition (significant infill) and note original fragments remain at the museum.

  **Case 2: Wax Block (Melted/Recast Annually)**
  1.  **Record:** Accession likely describes the wax sculpture. Artist states 2026 casting *is* the object.
  2.  **Change:** Complete Replication (using same material).
  3.  **Function:** Creator Intent Paramount. **Handoff to Curator-in-Charge**.
      *   *Curator Decision:* Artist's explicit intent defines persistence. **Each recasting *is* the accessioned object.** The wax *material* is the medium.
  4.  **(If no handoff): Transformation?** **YES.** Each melting destroys the specific form. Each casting is a new instance. *But Artist Intent overrides this.*
  5.  **Database:** Single accession number for the *concept* of the sculpture as defined by the artist's process. Track iterations via conservation notes/version numbers if needed.
      *   **Insurer:** Explain artist's process/intent. The current physical instantiation (2026 casting) *is* the insured object under the accession number. Value may need reassessment based on process/artist reputation.

  **Case 3: Carved House Post (Planks replaced, claimed as 1904 object)**
  1.  **Record:** Museum records describe "1972 reconstruction with original elements". Community claims it *is* the 1904 post.
  2.  **Change:** Gradual Replacement (all planks over time), Reassembly.
  3.  **Function:** **Source Community Intent Paramount.** **Handoff to Repatriation Committee/Community Liaison.**
      *   *Committee/Community Decision:* If the community's cultural understanding defines the post's identity through continuous renewal/replacement, **it is the same object.** This defines persistence regardless of material change.
      *   *Judgment:* This is about what is owed, not pure ontology. The museum must respect this understanding for repatriation.
  4.  **(If no handoff - e.g., internal ID only): Transformation?** **YES.** Gradual replacement of *all* parts typically constitutes substantial transformation (Ship of Theseus). A 1972 reconstruction exists. *But Community Intent overrides.*
  5.  **Database:** For repatriation purposes: **It is the same object (1904 post).** Update provenance to reflect community understanding and continuous history. Deaccession the "1972 reconstruction" concept if separate.
      *   **Procedure Outcome:** **The procedure *will* give you "same object" via the handoff in Step 3.** Community Liaison/Committee affirms the community's perspective defines identity for the purpose of return. This is the ethically and administratively correct path per your request.

  **Final Honesty:**
  *   **There is likely *not* a single metaphysical "fact of the matter"** in many cases. Identity is often contextual (administrative, cultural, functional).
  *   **The procedure tells you what to write on the form:** It provides a **defensible, documented rationale** for assigning identity based on records, intent, function, and the "substantial transformation" threshold applied with professional judgment. It ensures consistency and auditability.
  *   **It manages obligations:** By explicitly handing off to curators/repatriation committees when creator/source intent is key, it ensures decisions about *what is owed* are made by the right people, separating that from the (often murkier) question of physical persistence.
  *   **It leverages your system:** It works *with* your database's separation of object and material, providing rules for when each number applies.
