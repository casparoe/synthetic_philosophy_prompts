  - **Framework gaps**: Policy-dependent beliefs violate standard POMDP theory (which assumes belief updates are independent of \(\pi_\theta\)). Parameter sharing prevents local deviations without global effects.  
  - **No-stake disagreements**: "Two agents" debates are metaphysical; RL’s primitive is policies and state, not agent-tokens.  
