  Hmm, this is a classic "cluelessness" problem in moral philosophy - the idea that we can't predict long-term consequences of actions. The user has tried several arguments to resolve this: symmetry, sensitivity, sign-locking, replacement, and robustness. Each needs careful unpacking.

  First, symmetry. The user thinks unknown future effects might cancel out, so we should focus on near-term impacts. But their friend rightly points out that absence of evidence isn't evidence of symmetry. Philosophers like Nick Bostrom argue the burden is on claiming symmetry to justify it. 

  The sensitivity point is sharper than the user realizes. If tiny probability differences about the far future dominate calculations, consequentialism becomes unworkable. This is Derek Parfit's "all or nothing" problem. It genuinely threatens standard utilitarian approaches.

  The sign-locking distinction feels promising. Bednets (Job A) have effects tightly coupled to saving lives, while institutional changes (Job B) could have decoupled long-term impacts. This might hold water - philosophers like Greaves and Ord discuss "sign preservation." But we can't be certain even about life-saving interventions.

  Replacement matters practically. For Job A, someone else would likely do similar work, making the user's marginal impact smaller. For Job B, their unique skills might make more difference. This shifts the calculation toward Job B's tangible local impact.

  The robustness approach is wise given the uncertainty. Comparing options across plausible scenarios, Job A's high-earning-to-donate path appears more stable. Even if charities are 10% effective, it beats Job B's fragile local impact. This avoids false precision while acknowledging unknowns.

