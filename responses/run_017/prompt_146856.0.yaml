     - Compute shrinkage_factor_model = max(0.2, 1 - 3 * RMSE)
     - Multiply each bet's fraction (after group scaling) by shrinkage_factor_model.

  6. **Apply One-off Extra Shrinkage** (if applicable):
     - For bets marked as one-off, multiply the fraction by 0.5.

  7. **Adjust for Finite Horizon and Backer Clause**:
     - Compute base_fraction:
          base_fraction = 0.5   # for finite horizon
     - Adjust for backer clause:
          Let H = high-water mark (in absolute dollars, relative to initial B0? H is the highest value the fund has reached, so if B0=100k, and we went to 150k, H=150k)
          Let trigger_level = 0.5*H - 0.25*B0   (B0 is initial bankroll, say 100k)
          cushion = current_bankroll - trigger_level
          If the backer clause has not been used:
              backer_factor = 1.0 + 0.5 * max(0, min(1, (0.1*B0 - cushion) / (0.1*B0)))   # when cushion is 0, backer_factor=1.5; when cushion>=0.1*B0, backer_factor=1.0.
              base_fraction = base_fraction * backer_factor
              base_fraction = min(base_fraction, 0.75)
          Else:
              backer_factor = 1.0

     - Multiply every bet's fraction by base_fraction.

  8. **Final Check**:
     - For each bet, the final fraction must be non-negative. Set negative fractions to 0.
     - Ensure that the total fraction (sum of absolute values of all bets) is not more than 1.0. If it is, scale down all fractions by the total. But note: we are using fractions of bankroll for each bet independently. The total fraction can be more than 1.0 because we can win multiple bets. However, to avoid overexposure, we cap the total fraction at 1.0? 

          We do: total_fraction = sum(|f_i|)   [because each bet is a fraction of bankroll, and if we lose all, we lose total_fraction of the bankroll? Actually, no: if we lose one bet, we lose the fraction we bet on that bet. The maximum loss is the sum of the fractions? But note: we are betting on events that are simultaneous and outcomes are mutually exclusive? Not necessarily. We might have multiple bets on different events. 

          We'll cap the total fraction at 1.0 by scaling: if total_fraction > 1.0, then f_i = f_i / total_fraction.

          But this might be too conservative. Alternatively, we don't cap. We rely on the group caps and the fractional adjustments to keep the total below 1.0. We'll check and if the total fraction is above 1.0, we flag it for the committee.

          We'll set: if total_fraction > 1.0, then we scale down all fractions by total_fraction.

  9. **Committee Approval**:
     - Present the fractions for each bet and the total amount to be staked (which is the sum of the fractions times the bankroll).
     - The committee can override if they see fit, but they must note the reason.

  **Answer to the Member about "Leaving Money on the Table"**:

  "We appreciate the analysis and the passion for maximizing returns. Our betting strategy is based on the Kelly criterion, which balances growth and risk of ruin. Betting the full edge fraction (or more) on every bet would expose the fund to a high risk of significant drawdowns, especially given the correlations between bets and the uncertainty in our edge estimates. We have a finite horizon and a termination clause that requires us to be conservative. Our simulations (and the mathematics of geometric growth) show that overbetting reduces the median terminal wealth and increases the chance of failing to meet our capital preservation goals. We adjust Kelly fractions to account for these factors. The alternative of betting more might show higher returns in some scenarios, but it also increases the chance of catastrophic loss. Our goal is to maximize the geometric growth rate, not the arithmetic one, and to ensure the fund meets its obligations over the next four years."

  **Worked Applications**:

  We'll do three examples. We assume:
     - Current bankroll: $180,000 (B0 was $100,000, so we are at 1.8 * B0)
     - High-water mark: $200,000 (so H=200,000, B0=100,000)
     - Backer clause not used.
     - Trigger level = 0.5*200,000 - 0.25*100,000 = 100,000 - 25,000 = 75,000
     - cushion = 180,000 - 75,000 = 105,000 = 1.05 * B0 > 0.1*B0 (10,000), so backer_factor=1.0 -> base_fraction=0.5.
     - Model RMSE: let's assume 0.12 (so shrinkage_factor_model = max(0.2, 1-3*0.12)=max(0.2,1-0.36)=0.64)

  Example (a): Twelve football bets.

     - Assume they are on 4 matches (3 bets per match). We'll make up some numbers.

     Match1: 
          Bet1: odds=2.0, p=0.55 -> edge=0.55-0.5=0.05, f_raw = (0.55*2-1)/(2-1) = (1.1-1)/1 = 0.10
          Bet2: odds=3.0, p=0.4 -> edge=0.4-1/3≈0.4-0.333=0.067, f_raw=(0.4*3-1)/(3-1)=(1.2-1)/2=0.1
          Bet3: odds=1.8, p=0.6 -> edge=0.6-1/1.8≈0.6-0.555=0.045, f_raw=(0.6*1.8-1)/(1.8-1)=(1.08-1)/0.8=0.1

          Group1: S = 0.10+0.10+0.10 = 0.30 > 0.2 -> scale by 0.2/0.3≈0.6667 -> each becomes: 0.0667

     Similarly for other matches. We'll assume each match has three bets with f_raw=0.10 each, so each group gets scaled to 0.0667 per bet.

     Then apply model error: 0.0667 * 0.64 ≈ 0.0427
     Then base_fraction: 0.0427 * 0.5 = 0.0213 per bet.

     Total for 12 bets: 12 * 0.0213 = 0.2556, which is less than 1.0, so no scaling.

     Total stake: 0.2556 * $180,000 = $46,008.

     This is about 25.6% of the bankroll. The member who wants to bet more might be unhappy, but note we have 12 bets and we are betting about 2% per bet on average.

  Example (b): Special election.

     - One bet: odds=3.0, our p=0.5 (but the market's q=1/3≈0.333, so edge=0.5-0.333=0.167)
          f_raw = (0.5*3-1)/(3-1) = (1.5-1)/2 = 0.25
          Group: alone -> no scaling needed (S=0.25<0.2? Actually 0.25>0.2, so we scale to 0.2)
          Then model error: 0.2 * 0.64 = 0.128
          Then one-off extra: 0.128 * 0.5 = 0.064
          Then base_fraction: 0.064 * 0.5 = 0.032

     So we bet 3.2% of the bankroll: $5,760.

  Example (c): Accumulator of six legs.

     - We like four legs: 
          Leg1: odds=1.5, p=0.7 (q=0.666, edge=0.034)
          Leg2: odds=1.8, p=0.6 (q=0.555, edge=0.045)
          Leg3: odds=2.0, p=0.55 (q=0.5, edge=0.05)
          Leg4: odds=1.6, p=0.65 (q=0.625, edge=0.025)
     - Indifferent on two legs: 
          Leg5: odds=1.9, p=1/1.9≈0.5263 (so edge=0)
          Leg6: odds=2.2, p=1/2.2≈0.4545 (edge=0)

     - Overall odds = 1.5 * 1.8 * 2.0 * 1.6 * 1.9 * 2.2 = 1.5*1.8=2.7, *2.0=5.4, *1.6=8.64, *1.9=16.416, *2.2=36.1152
     - Overall p = 0.7 * 0.6 * 0.55 * 0.65 * 0.5263 * 0.4545 ≈ 
          0.7*0.6=0.42, *0.55=0.231, *0.65≈0.15015, *0.5263≈0.079, *0.4545≈0.0359
     - q_bundle = 1/36.1152 ≈ 0.0277
     - edge = 0.0359 - 0.0277 = 0.0082
     - f_raw = (0.0359 * 36.1152 - 1) / (36.1152-1) = (1.296 - 1) / 35.1152 ≈ 0.296 / 35.1152 ≈ 0.0084

     - Group: one group, S=0.0084<0.2 -> no scaling.
     - Model error: 0.0084 * 0.64 ≈ 0.0054
     - Not one-off? We use the same as others. But note: we are indifferent on two legs. We already accounted for that by using p=q for those legs.
     - Base fraction: 0.0054 * 0.5 = 0.0027

     So we bet 0.27% of the bankroll: $486.

     This is very small because the chance of winning the entire accumulator is low (3.59%) and the edge is small.

  **Failure Modes**:

  - The procedure relies on grouping bets and capping per group. If we have many groups with high correlations (e.g., all bets on the same league on the same day), we might be overexposed. We assume independence across groups, which may not hold.

  - The model error adjustment is a rule of thumb. If the model error is misestimated, we might bet too much or too little.

  - The finite horizon adjustment is fixed at 0.5, which might be too conservative when we are behind and need to catch up.

  - The backer clause adjustment might encourage taking more risk when near the trigger, which could lead to triggering the clause more often. The backer might not appreciate this.

  - The accumulator example shows we bet very small. The committee might want to skip such bets altogether.

  **Conclusion**:

  This procedure is a practical compromise. It is not theoretically optimal but designed for your constraints. The committee should review the fractions and adjust if they see fit, especially when the total fraction is high or when there are exceptional circumstances.
answer: |-
  ### Practical Bet Sizing Procedure for Your Fund
  Here's a step-by-step procedure designed for your constraints (20 minutes, spreadsheet-only, committee sign-off). It balances Kelly principles, your fund's unique constraints, and practicality. **Bold text** marks critical steps or compromises.

  ---

  #### **Weekly Procedure** (Run in Spreadsheet)
  1. **Input Bets & Base Data**  
     - For each bet: decimal odds, your estimated win probability (`p`), event group (e.g., "Match A," "Election X"), and flag if one-off.  
     - **Spreadsheet Columns**: `Event Group`, `Bet Description`, `Odds`, `p`, `One-off? (Y/N)`, `Accumulator? (Y/N)`.  
     - **Good Enough**:  
       - `p` from your model (even if noisy).  
       - Event groups based on common underlyings (e.g., bets on the same match → same group).  
       - If correlation data missing (likely), **default to same-group = highly correlated, different groups = independent**.  

  2. **Calculate Raw Kelly Fractions**  
     - For each bet:  
       ```
       Raw Fraction = max(0, (p * Odds - 1) / (Odds - 1))
       ```  
     - **If accumulator**: Treat all legs as one bet. Compute combined odds and `p` (multiply probabilities if independent; if correlated, use worst-case estimates).  

  3. **Adjust for Correlation (Group Cap)**  
     - Sum raw fractions per event group.  
     - **Cap per group**: If sum > 0.2, scale down all fractions in the group by `(0.2 / sum)`.  
     - *Why 0.2?*: Rule of thumb to limit exposure on correlated outcomes. Adjustable by committee.  

  4. **Shrink for Model Noise**  
     - Compute shrinkage factor:  
       ```
       Shrinkage = max(0.25, 1 - 3 * RMSE)
       ```  
       - **RMSE Formula**: Use your 300 resolved bets. Monthly update:  
         ```
         RMSE = SQRT(AVERAGE((Outcome_i - p_estimated_i)^2))
         ```  
         (Outcome = 1 or 0).  
     - Multiply all fractions by `Shrinkage`.  
     - *Derivation?*: Rule of thumb. If `RMSE ≈ 0.1` (good), use ~70% of raw Kelly; `RMSE ≈ 0.15` → ~55%; `RMSE > 0.2` → min 25%. Based on error sensitivity.  

  5. **Adjust for One-Off Bets**  
     - **Extra shrinkage**: Multiply one-off fractions by 0.5.  
     - *Why?*: No repeated trials → geometric growth logic weakens. Penalize low-confidence edges.  

  6. **Apply Fund-Wide Scaling**  
     - **Base scaling (finite horizon)**: Multiply all fractions by 0.5.  
     - **Backer clause adjustment**:  
       ```
       Backer Factor = 1 + 0.5 * max(0, min(1, (0.1*B0 - Cushion) / (0.1*B0)))
       ```  
       - `B0` = Initial capital ($100k).  
       - `Cushion` = Current bankroll - (0.5*HighWaterMark - 0.25*B0).  
       - Multiply base scaling (0.5) by `Backer Factor`, then cap at 0.75.  
       - *Example*: Near trigger? `Cushion ≈ 0` → scaling = 0.75. Far away? Scaling = 0.5.  
       - **Committee Input**: If backer clause used/not used, disable adjustment.  

  7. **Final Checks**  
     - Sum all fractions. If total > 1.0, scale down proportionally.  
     - **Don’t Bet If**:  
       - Raw fraction ≤ 0 (negative EV).  
       - Total fraction > 1.0 even after scaling (overexposure).  
       - Event group has conflicting bets (e.g., Team A win + Team B win).  
     - **Committee Handoff**:  
       - If backer clause adjustment > 0.6 and cushion < $20k.  
       - If one-off bet fraction > 10%.  
       - If "bet more" pressure → discuss risk tolerance.  

  8. **Output & Stake**  
     - Final fraction per bet × bankroll = stake.  
     - Total stake = sum of stakes.  

  ---

  #### **One-Paragraph Answer for the Member**  
  *To the member claiming we "leave money on the table":*  
  > "Our sizing balances growth and risk. Betting full edge fractions ignores bankroll correlations, model noise, and our 4-year horizon with a termination clause. Simulations show that overbetting increases the risk of catastrophic loss, reducing median terminal wealth. We use fractional Kelly with adjustments for our constraints. While aggressive sizing might win more in some scenarios, it also risks breaching the 60% termination threshold or wasting our backer clause. Our goal is reliable doubling, not maximizing theoretical EV at extreme risk."

  ---

  #### **One-Off Bets: Why Size Differently?**  
  For non-repeating events (e.g., the March election), the geometric growth argument weakens because there's no "repeated play." Kelly still protects bankroll via logarithmic utility, but with high uncertainty, we shrink more (50% extra). This avoids overcommitting to edges we can't validate historically. **Treat as expected-value optimization with a risk penalty**.

  ---

  #### **Backer Clause Guidance**  
  - **What it does**: Near the trigger, it lets you bet larger (up to 0.75× base scaling). The value is path-dependent: highest near the trigger, gone after use.  
  - **Policy Recommendations**:  
    1. **Size using the adjustment above**, but disclose usage in monthly notes when cushion < $20k.  
    2. **Self-denial is dangerous**: Ignoring it under-protects the fund; overreliance risks triggering it needlessly.  
    3. **Committee must agree** when cushion < $20k (high leverage point).  
  - **Why it can’t be automated**: The clause is a one-time option—its value depends on future opportunities, time left, and volatility. Spreadsheet heuristics are approximations.

  ---

  ### Worked Examples  
  *Assumptions*:  
  - Current bankroll: $180k, high-water mark: $200k, backer clause unused.  
  - Cushion: $180k – (0.5×$200k – 0.25×$100k) = $105k → Backer Factor = 1.0 (no adjustment).  
  - Model RMSE: 0.12 → Shrinkage = max(0.25, 1 – 3×0.12) = 0.64.  
  - Base scaling: 0.5.  
  - Total scaling: 0.64 × 0.5 = **0.32**.  

  #### **(a) 12 Football Bets (Correlated Group)**  
  - Bets: 4 match groups (3 bets/group). Example group:  
    - Bet 1: Odds 2.0, `p` = 0.55 → Raw fraction = 0.10.  
    - Bet 2: Odds 3.0, `p` = 0.40 → Raw fraction = 0.10.  
    - Bet 3: Odds 1.8, `p` = 0.60 → Raw fraction = 0.10.  
  - **Group cap**: Sum raw = 0.30 > 0.2 → scale to 0.2/0.30 = 0.666× → 0.067 per bet.  
  - Apply scaling: 0.067 × 0.32 = **0.021 per bet**.  
  - Total stake: 12 × 0.021 × $180k = **$45,360**.  
  - *Why you won’t like this*: "Bet more" demand clashes with group cap. But without it, a bad match could lose 30% of the bankroll.  

  #### **(b) March Special Election (One-Off)**  
  - Bet: Odds 3.0, `p` = 0.50 → Raw fraction = 0.25.  
  - Group cap: 0.25 > 0.2 → scale to 0.20.  
  - One-off extra: 0.20 × 0.5 = 0.10.  
  - Apply scaling: 0.10 × 0.32 = **0.032**.  
  - Stake: 0.032 × $180k = **$5,760**.  

  #### **(c) 6-Leg Accumulator (Forced Bundle)**  
  - Legs: 4 liked (e.g., `p` = 0.7, odds 1.5), 2 indifferent (`p` = book implied).  
  - Combined odds: 36.1, combined `p` ≈ 0.036 → Raw fraction = 0.0084.  
  - Group cap: 0.0084 < 0.2 → no change.  
  - Apply scaling: 0.0084 × 0.32 = **0.0027**.  
  - Stake: 0.0027 × $180k = **$486**.  
  - *Committee handoff*: Total stake is tiny, but if the bundle is the only opportunity, discuss skipping or negotiating with the book.  

  ---

  ### Failure Modes & Compromises  
  - **Correlations**: Defaulting to group caps is crude. It *underestimates* cross-group correlations (e.g., all NFL bets) and *over-penalizes* uncorrelated bets in the same group.  
  - **Noise Adjustment**: RMSE shrinkage is a rule of thumb—true confidence intervals would require more data.  
  - **Backer Clause**: Path-dependent value is simplified to a linear cushion adjustment. Near the trigger, committee judgment is essential.  
  - **Horizon**: Fixed 0.5× scaling ignores progress toward the 2-year goal. If behind at 18 months, the procedure may be too conservative.  
  - **"Bet More" Pressure**: The procedure forces discipline. Document committee overrides to review outcomes.  

  ### Final Advice  
  - **Monthly**: Recompute RMSE and cushion.  
  - **Committee**: Vote on caps (0.2 group, 0.5 base scaling) annually.  
  - **Backer Clause**: Disclose when active in monthly notes.  
  - **Edge Cases**: If the procedure says "no bet" or handoff, respect it—it’s usually flagging model or risk limits.  

  This balances rigor and pragmatism. Test it for 4 weeks, track decisions, and adjust thresholds as needed.
