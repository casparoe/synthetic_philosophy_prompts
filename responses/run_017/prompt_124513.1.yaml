  ### Randomization

   For the second part, we want a separate task where randomization is strictly better.

   We can use a separate Ellsberg-like task.

   For example, consider two urns:

     Urn1: 10 balls, 5 red and 5 blue.
     Urn2: 10 balls, each either red or blue, unknown.

   One ball will be drawn from the chosen urn, and the student has to guess the color.

   They can choose to:
     - Guess for Urn1.
     - Guess for Urn2.
     - Or flip a coin to decide which urn to guess for.

   But if they guess for Urn1, and the ball is from Urn1, they win if they guess correctly. But the urn from which the ball is drawn is also chosen by a coin flip? 

   Alternatively, we can use the classic Ellsberg with a single urn with 30 red and 60 either blue or green, and then have them choose between:

     Act1: bet on red.
     Act2: bet on blue.
     Act3: bet on green.

   But then randomization between Act2 and Act3 might be better if they have a set of priors and use a minmax rule.

   But to make it strict, we need to have the payoffs such that the mixed action has a higher minimum expected utility.

   Simplified example:

     State1: Urn has 0 blue, 60 green.
     State2: Urn has 60 blue, 0 green.

     Prior: we don't know which state.

     Acts:
       - Bet on blue: wins 1 in State2, 0 in State1.
       - Bet on green: wins 1 in State1, 0 in State2.
       - Randomize 50-50: wins 1 with probability 0.5 in either state.

     For a set of priors (which here is any prior over the states), the expected utility for betting on blue is between 0 and 1, similarly for green. For the mixed action, it is exactly 0.5 in every state.

     If the student is maxmin, then they will choose the mixed action because it guarantees 0.5, while the pure actions can yield 0.

     So they strictly prefer to randomize.

   We can implement this.

  ### Given the complexity, I propose to split the activity into two parts.

   Part 1: The urn game for the signal and the interval widening.

   Part 2: A separate game for randomization.

   And within the urn game, we will have the policy commitment and the action choice.

   Let's go with the urn game with types A and B, and the event is the second draw not being green.

   We will set c=0.6 for the sure payoff.

   The students commit to a policy in advance. The policies are:

     Policy I (Safe): "I will bet only if the worst-case probability of winning is at least c."
     Policy II (Optimistic): "I will bet only if the best-case probability of winning is at least c."
     Policy III (Average): "I will bet only if the average of the worst-case and best-case probabilities is at least c."

   Note: for Policy III, the average might not be the midpoint if the set is discrete, but in our case the sets are intervals, so midpoint.

   And c=0.6.

   Then, the students choose whether to see the signal or not.

   Then, we resolve the first draw and they make their decision.

   To save time, we can do one urn for the whole class, but then everyone sees the same signal. Or we can have a urn for each student? That's not practical.

   So we will have one urn for the whole class. But then the type is fixed and the draws are fixed, so the experience will be the same for everyone.

   We can do two rounds, with two different urns, but time is limited.

   Alternatively, we can have them make their choices, and then we resolve the urn for the class. But then the signal is the same for everyone who chose to see it.

   We'll do one urn for the class.

  ### Timeline for 90 minutes:

    0:00-0:10 (10 min): Introduction and explanation of the first game (urn with two types, event is second ball not green). 
