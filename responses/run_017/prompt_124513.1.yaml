  ### How to head off issues

    - Frequentist inference: If students try to do Bayesian updating with a uniform prior, they might collapse the interval. To head this off, emphasize that the composition of the urn is completely unknown within the type, and there is no prior over the urn type. We are to consider the set of all possible probabilities.

    - Second-order probability: If they say they have a prior and want to average, tell them that in this activity, we are not using any prior over the parameters; we are using a set of probabilities model.

    - Meta-gaming for the prize: The payoffs are small, so hopefully they will play along. If not, remind them that the point is to experience the phenomenon.

    - Trust: To convince them you are not cheating, flip the coin in front of them for the urn type, and have the second adult verify the composition and the draws.

  ### What the activity cannot deliver

    - It doesn't prove the general result that information can increase the set of probabilities.
    - It doesn't show that there are multiple ways to update a set of probabilities (e.g., full Bayesian, Fagin-Halpern, etc.).
    - The decision rules are presented as given, and we don't show why they are normatively appealing or how they can be derived.

   In the debrief, the instructor should:

     - Explain that in the first game, the information caused the interval to widen. This is because the signal was more informative for one type of urn than the other.
     - Explain that for Policy I, the information sometimes caused them to avoid a bad bet, but sometimes made them miss a good bet. But the key is that the information can change the decision in a way that is not necessarily for the better, and that is because of the increased ambiguity.
     - In the state game, explain that randomization can provide a hedge against ambiguity, ensuring a minimum return.

     - Finally, name the phenomenon: Ambiguity (or Knightian uncertainty) and the value of information in the presence of ambiguity.

    The instructor should take 8 minutes to cover these points.

   Given the complexity, we might have to adjust on the fly. But this should meet the main goals.
answer: |-
  ### The Mysterious Urn Game  
  **Objective:** Students experience ambiguity (Knightian uncertainty) where learning *widens* probability intervals, and randomization becomes strictly beneficial. They commit to decision policies that may conflict later.  

  ---

  ### **Physical Setup**  
  **Materials:**  
  - 2 opaque bags/urns (Bag A and Bag B).  
  - **Bag A:** 3 red balls, 3 blue balls, 4 green balls.  
  - **Bag B:** 4 red balls, 4 blue balls, 2 green balls.  
  - Coin for flipping (fair, verified by students).  
  - Envelopes for policy commitment.  
  - Raffle tickets (for participation bonuses) and chocolate (prizes).  
  - Stopwatch.  

  **Rigging & Trust:**  
  - Flip coin publicly to choose the bag (Heads: A, Tails: B). Have a student verify the flip.  
  - Second adult (your friend) prepares the chosen bag secretly, ensuring students can’t peek. Students know the compositions but not which bag was selected.  

  ---

  ### **Rules & Payoffs**  
  **Event of interest:** Drawing a non-green ball.  
  **Signal:** One ball drawn randomly (without replacement) before the event ball. Students choose whether to see its color.  
  **Betting:** After the signal (or not), students decide to:  
  - **Bet:** Win 1 raffle ticket (if second ball is non-green).  
  - **Take sure payoff:** Win 0.6 raffle tickets (no risk).  

  **Policies (commit upfront):**  
  1. **Safe:** "Bet only if the worst-case probability of winning is ≥ 0.6."  
  2. **Optimistic:** "Bet only if the best-case probability of winning is ≥ 0.6."  
  3. **Average:** "Bet only if the midpoint of the probability range is ≥ 0.6."  

  **Participation bonus:** Raffle tickets for choices. 10 tickets = 1 chocolate. Final raffle: 1 decent prize.  

  ---

  ### **Arithmetic & Why It Works**  
  - **Initial probability of non-green (no signal):**  
    - Bag A: 6 non-green / 10 balls = 0.6.  
    - Bag B: 8 non-green / 10 balls = 0.8.  
    - Interval: [0.6, 0.8].  

  - **After signal (first ball drawn):**  
    - **If first ball red/blue:**  
      - Bag A: 5 non-green left / 9 balls ≈ [0.555, 0.777]  
      - Bag B: 7 non-green left / 9 balls ≈ [0.777, 0.888]  
      - *New interval: [0.555, 0.888] (wider than [0.6, 0.8])*.  
    - **If first ball green:**  
      - Bag A: 6 non-green / 9 balls ≈ [0.666, 0.888]  
      - Bag B: 8 non-green / 9 balls ≈ [0.888, 1.0]  
      - *New interval: [0.666, 1.0] (wider than [0.6, 0.8])*.  

  **Why intervals widen:** The signal’s impact differs by bag type, increasing uncertainty.  

  ---

  ### **Timeline (90 Minutes)**  

  #### **Part 1: Urn Game (60 min)**  
  1. **Intro (5 min):** Explain bags, event (non-green), and initial interval [0.6, 0.8].  
  2. **Policy Commitment (10 min):**  
     - Describe policies (Safe, Optimistic, Average).  
     - Students write policy choice in envelope, seal it.  
  3. **Signal Choice Auction (10 min):**  
     - Students bid raffle tickets to *avoid* seeing the signal (e.g., "I’ll pay 2 tickets not to see the first ball’s color").  
     - Highest bidders "win" ignorance. Others must see the signal.  
  4. **Draw & Decisions (15 min):**  
     - Draw first ball. Show color to students who didn’t pay to avoid it.  
     - Students update intervals based on signal (or not).  
     - Students decide to bet or take 0.6, *following their policy*.  
  5. **Resolution (10 min):**  
     - Draw second ball. Resolve bets/sure payoffs.  
     - Reveal bag type and compositions. Students calculate outcomes.  
  6. **Mini-Debrief (10 min):**  
     - "Did your policy force a choice you hated?"  
     - "Who paid not to see the signal? Why?"  

  #### **Part 2: Randomization Game (20 min)**  
  1. **Setup (5 min):**  
     - Urn: 30 red balls, 60 balls that are unknown mix of blue/green.  
     - Choices:  
       - Bet on red: Win 1 ticket if red.  
       - Bet on blue: Win 1 ticket if blue.  
       - Bet on green: Win 1 ticket if green.  
       - Flip a coin: If heads, bet on blue; if tails, bet on green.  
  2. **Choice & Draw (10 min):**  
     - Students pick an action.  
     - Draw a ball. Resolve payoffs.  
  3. **Why Randomize? (5 min):**  
     - Pure bets: Min probability = 0 (if no blue/green).  
     - Coin flip: Min probability = 0.5 × (60/90) = 1/3 > 0.  
     - *Randomizing guarantees a floor*, strictly better for ambiguity-averse players.  

  #### **Final Debrief (10 min)**  
  - **Map Moments to Ideas:**  
    - Interval Widening: Signal made [0.6, 0.8] → [0.555, 0.888].  
    - Harmful Info: Safe policy holders saw min drop below 0.6 and refused a bet they’d have taken blindly.  
    - Randomization: Coin-flip hedged against not knowing blue/green.  
    - Policy Costs: e.g., Safe policy + red signal = missed bet (even if Bag B gave 7/9 win chance).  
  - **Predictable Issues & Fixes:**  
    - Frequentist inference: *Head off by stressing "no prior over bags, only sets."*  
    - Second-order probability: *Emphasize "we’re using ranges, not averages."*  
    - Meta-gaming: *Use raffle tickets (low stakes) + chocolate to incentivize truthfulness.*  
    - Distrust: *Public coin flip + second adult verifies bag setup.*  
  - **Limitations:**  
    - Cannot prove updating methods (e.g., full Bayesian vs. maxmin).  
    - Cannot derive decision rules.  
    - Only shows one ambiguity model.  
  - **Key Takeaways (8 min):**  
    > "Intervals aren’t laziness—they’re honest uncertainty. Today, learning *increased* ambiguity. You felt it when your interval widened and policies backfired. Randomization wasn’t arbitrary; it protected you from the unknown. In uncertainty, information isn’t always free—sometimes you pay to avoid it. Policies aren’t just rules; they’re commitments that bite when ambiguity bites back. This is *ambiguity aversion* in action."  

  ---

  ### **Why This Works**  
  - **Gut-Level Intervals:** Students calculate initial/final ranges themselves. Widening is visceral.  
  - **Paid Ignorance:** Auction makes "avoiding signal" tangible. Safe policy holders bid high to prevent min from dropping.  
  - **Randomization:** Coin-flip’s floor payoff is obvious in the urn.  
  - **Policy Conflict:** Safe policy + red signal forces bet refusal—costly if Bag B was chosen.  
  - **Debrief Covers Bases:** Addresses skepticism and maps experiences to theory quickly.  

  Run it as a fast-paced game, and they’ll leave feeling ambiguity in their bones.
