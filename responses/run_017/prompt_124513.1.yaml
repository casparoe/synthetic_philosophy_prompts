  P(B|R) = (0.5q) / (0.25+0.5q) = 2q/(1+2q)

  Then the probability for the next draw being red is:
  P(next red|R) = P(A|R)*0.5 + P(B|R)*q = [1/(1+2q)]*0.5 + [2q/(1+2q)]*q = [0.5 + 2q^2] / (1+2q)

  Let h(q) = (0.5 + 2q^2) / (1+2q)

  For q in [0.3,0.7]:
  h(0.3) = (0.5 + 2*(0.09)) / (1+0.6) = (0.5+0.18)/1.6 = 0.68/1.6=0.425
  h(0.5) = (0.5+2*0.25)/(1+1)= (0.5+0.5)/2=1/2=0.5
  h(0.7) = (0.5+2*0.49)/(1+1.4)= (0.5+0.98)/2.4=1.48/2.4≈0.6167

  So the range is [0.425,0.6167] -> again narrower.

  This is not working.

  ### A Successful Example from the Literature

  I recall that in a paper by Itzhak Gilboa and David Schmeidler (or others), they give an example where learning increases ambiguity.

  Example: There are two urns. Urn1 has 10 balls: 5 red and 5 blue. Urn2 has 10 balls: 10 red or 10 blue, you don't know. You believe that the urn in front of you is either Urn1 or Urn2, and you have no idea which. So prior: P(red) = if Urn1: 0.5, if Urn2: either 0 or 1. So the set of possible probabilities is {0,0.5,1} -> interval [0,1].

   Now, you are told that you will be given a signal: a ball will be drawn and you will be told its color. But you have to decide whether to see it or not.

   If you see a ball drawn and it's red, then what happens? If it's Urn1, then you know it's Urn1 because Urn2 would have to be all red or all blue, and drawing a red from Urn2 doesn't rule out all blue. Actually, if you draw a red, then it cannot be Urn2 if Urn2 is all blue. So:

  - If you draw a red, then the urn must be Urn1 or Urn2 (all red). 
    So then P(red for the next ball) = if Urn1: 0.5, if Urn2: 1. So the set is {0.5,1} -> interval [0.5,1].
  - If you draw a blue, then the urn must be Urn1 or Urn2 (all blue), so P(red) = if Urn1: 0.5, if Urn2: 0 -> set {0,0.5} -> interval [0,0.5].

   So initially the interval was [0,1], and after seeing a signal (regardless of the color) the interval becomes either [0.5,1] or [0,0.5], which are both of length 0.5, so narrower? But we want wider.

   This doesn't widen.

   Another example: suppose we have a single urn that is either:
    - Type A: 3 red, 3 blue, 4 green.
    - Type B: 4 red, 4 blue, 2 green.

   We don't know which type, and we have no prior probability (or we have a set of priors).

   Then initially, for the event of drawing a non-green ball, the probability is:
    - Type A: 6/10=0.6
    - Type B: 8/10=0.8
    so the interval is [0.6,0.8] if we know it's one of these two types.

   Now, we are told that we will be given a signal: we will learn the color of one ball chosen at random. But note: the urn might be Type A or Type B.

   After we learn the color, say we learn that one ball is red. Then we update. But the updated probability for non-green might become more dispersed.

   Let's compute for Type A:
     Total balls: 10
     After observed one red: then we have 2 red, 3 blue, 4 green left? No, if we are just told that there is at least one red, but typically in these examples we are told the color of a specific ball drawn.

   But to avoid replacement issues, assume we are told the result of one draw, and then we care about the next draw (with replacement or without).

   Without replacement: 

   Type A: initially 3 red, 3 blue, 4 green.
   After drawing one red, left: 2 red, 3 blue, 4 green. Then P(non-green) = (2+3)/9 = 5/9≈0.5556.

   Type B: initially 4 red, 4 blue, 2 green.
   After drawing one red, left: 3 red, 4 blue, 2 green. Then P(non-green) = (3+4)/9 = 7/9≈0.7778.

   So the updated probability for non-green is either 5/9 or 7/9, so the interval is [5/9,7/9]≈[0.5556,0.7778]. The initial was [0.6,0.8]. The new interval is wider? 0.5556<0.6 and 0.7778<0.8, so it is shifted down but the width is 7/9-5/9=2/9≈0.2222, while the initial width was 0.2. So it is wider.

  Initial interval width: 0.8-0.6=0.2.
  Updated interval: 7/9 - 5/9 = 2/9 ≈ 0.2222 > 0.2.

  And the interval now is [0.5556,0.7778] which is not contained in [0.6,0.8] because 0.5556<0.6.

   So we have widening.

   Moreover, if we draw a green ball:

   Type A: after one green, left: 3 red, 3 blue, 3 green. P(non-green)=6/9=2/3≈0.6667.
   Type B: after one green, left: 4 red, 4 blue, 1 green. P(non-green)=8/9≈0.8889.
   So interval [2/3,8/9]≈[0.6667,0.8889]. This is also wider than [0.6,0.8] (width=0.2222) and has numbers above 0.8.

   And if we draw a blue: by symmetry to red, same as drawing a red.

   So regardless of the signal (red, blue, or green), the interval for P(non-green) becomes wider.

   This is perfect!

  ### The Activity Setup

   We will use the following setup for the activity:

   There are two possible types of urns:
     - Type A: 3 red, 3 blue, 4 green.
     - Type B: 4 red, 4 blue, 2 green.

   The urn in use is either Type A or Type B, and the students do not know which. They are only told that it is one of these two.

   Event of interest: drawing a non-green ball. We will call this event "success".

   Initial probability of success:
     - If Type A: 6/10 = 0.6
     - If Type B: 8/10 = 0.8
     So the interval is [0.6, 0.8].

   Now, we will offer a signal: we will draw one ball at random from the urn and show its color to the student (and then put it back? or not? In the above calculation, we did without replacement. To be consistent, we should do without replacement. But then the event of interest is for a second draw without replacement.

   Alternatively, we can do with replacement, but then the probability doesn't change. So we do without replacement.

   So the setup: 
     - The urn has 10 balls.
     - We will draw one ball and show its color. (This is the signal.)
     - Then we will draw a second ball. The event of interest is that the second ball is not green.

   But note: the students care about the second draw.

   Alternatively, to simplify, we can say that the event is on the first draw, and the signal is on a preliminary draw. But then we are changing the urn composition.

   To avoid this, we can have a large urn and draw with replacement, but then the signal doesn't change the composition. In the above example, we did without replacement, and it worked.

   So we'll do without replacement. The signal is the first draw, and the event is the second draw.

   The students are to make a decision before any draw: whether to see the signal or not.

   If they see the signal, they will know the color of the first ball, and then they will see the second draw.

   If they don't see the signal, they will not know the color of the first ball, and then they will see the second draw.

   But note: in the no-signal case, the probability of success (second ball not green) is still either 0.6 or 0.8, so the interval is [0.6,0.8].

   If they see the signal, then as above:
     - If the first ball is red, then the updated probability for the second ball being non-green is either 5/9≈0.5556 or 7/9≈0.7778 -> interval [0.5556,0.7778]
     - If the first ball is blue, same as red.
     - If the first ball is green, then updated probability is either 6/9=0.6667 or 8/9≈0.8889 -> interval [0.6667,0.8889]

   In all cases, the interval is wider (width 2/9≈0.2222) than the initial width of 0.2.

   Moreover, the new intervals are not contained in the initial interval.

  ### How to run the activity

  #### Materials
  - Two actual urns (or bags) that are not transparent.
  - For Type A: 3 red balls, 3 blue balls, 4 green balls.
  - For Type B: 4 red balls, 4 blue balls, 2 green balls.
  - A coin to flip to choose the type (secretly).

   But note: we don't want the students to know which type it is. So we will choose one type by flipping a coin, and then put the balls in the urn. The students are told the two possible compositions but not which one was chosen.

  #### Step 1: Choose the type
  Flip a coin in advance (or in front of them but in a way they don't see the outcome). If heads, use Type A; if tails, use Type B. Put the balls in the urn.

  #### Step 2: Explain the event
  Explain to the students that we are interested in whether a ball drawn from the urn is not green. This is the event of interest.

  #### Step 3: Initial interval
  Ask the students to write down, based on the setup, what they think is the range of possible probabilities for the event. They should get [0.6,0.8].

  #### Step 4: The signal option
  Tell the students that before the event ball is drawn, we will draw one ball at random from the urn and set it aside (without replacement). Then the students have a choice:
  - Option 1: They can learn the color of that first ball.
  - Option 2: They can remain ignorant.

  But after that, we will draw a second ball, and they will get a payoff if that second ball is not green.

  #### Step 5: The decision and the auction
  We want students to decide whether to see the signal or not. We can auction off the right to see the signal or not. But note: the instructor wants some to pay to not be told.

   We will ask the students to bid for the option to choose whether to see the signal or not. But we want some to prefer not to see.

   Alternatively, we can have a market: they can choose to see the signal or not, but they have to pay (in points) for the choice they make. Or we can have them bid for the right to avoid the signal.

   Since the activity has a second part with randomization and policies, we'll keep this part simple.

   We can have a sealed bid: 
     - Each student writes down how many points they are willing to pay to avoid the signal. 
     - Then the instructor will avoid the signal for the top bidders (or something). But it might be complex.

   Alternatively, we can have a simple choice: each student can choose to see the signal or not, and then we will resolve the urn and they will see if they won.

   But then the payoff might be in chocolate or raffle tickets, and we want them to make a decision based on their assessment.

   Moreover, we want them to see that after the signal, the interval is wider.

  #### Step 6: Resolving the urn
  After the students have made their choice (whether to see the signal or not), we then:
  - For students who chose to see the signal: we draw the first ball and show it to them. Then we draw the second ball. If the second ball is not green, they win a prize (chocolate or points).
  - For students who chose not to see: we draw the first ball and do not show it. Then we draw the second ball. If it is not green, they win.

   But note: the act of drawing the first ball affects the composition for the second draw. This is true for everyone, regardless of whether they see the signal or not.

   However, the students who do not see the signal do not know how the composition changed, so they still have the initial interval [0.6,0.8]. The students who see the signal know the change, and they have a wider interval.

  #### Payoff
  The prize for success is the same for everyone. We are not asking them to bet on the probability, only to get the prize if the event happens.

   But the decision to see or not see the signal should be based on whether they think the information is helpful or harmful in a decision-theoretic sense. However, in this setup, there is no decision to be made after the signal regarding an action; they just get the prize if the event happens. So the value of information here is solely in reducing uncertainty, but not in changing an action. Therefore, in terms of decision theory, the information is worthless if they are only interested in the outcome and cannot change anything. But the instructor's goal is for them to feel that the information can be harmful because it increases ambiguity.

   So we need to give them a choice of actions after the signal.

  ### Incorporating an Action Choice

   The instructor mentioned that the session is to break the result that information can never hurt under a single prior. In the single prior case, information can only help if you get to choose your act after seeing it. So to make the information potentially hurt, we need to have a decision to make after the signal.

   So let's modify: after the signal (or not), the student has to choose whether to bet on the event or not.

   Specifically, the student can choose to:
     - Option X: Bet on the event (non-green). If the second ball is not green, they win a prize (say 1 point or a chocolate). If it is green, they get nothing.
     - Option Y: Not bet, and get a sure payoff of c, where c is chosen to be between the initial interval and also inside the updated intervals.

   What should c be? We want it to be such that:

     In the no-information case, the student might be willing to bet if c is not too high.

     In the information case, after seeing the signal, the student might not want to bet even though in the no-information case they would.

   But also, we want to create a situation where not knowing is better because knowing might cause them to pass on a bet that they would have taken.

   However, with a set of probabilities, we need a decision rule.

   The instructor wants them to commit to a policy in advance.

  ### Part 2: Randomization and Policy Commitment

   So let's integrate the three goals.

   We will have two stages:

    Stage 1: The urn is prepared (secretly chosen as A or B by a coin flip).

    Stage 2: The students commit to a decision rule for whether to take the bet or not, based on the set of probabilities. They have to commit to one of three policies (described in plain English):

      Policy 1: "Play it safe" - Bet only if the minimum possible probability of success is at least c.
      Policy 2: "Go for it" - Bet only if the maximum possible probability of success is at least c.
      Policy 3: "Middle of the road" - Bet only if the midpoint of the possible probabilities is at least c.

    But note: the set of probabilities will change if they see the signal.

    Stage 3: They choose whether to see the signal or not. This choice might depend on their policy? But the instructor wants them to choose whether to see the signal before knowing what it says.

    Stage 4: If they chose to see, they see the first ball's color. If not, they don't.

    Stage 5: Then, based on their policy and the information they have (which determines the set of probabilities), they decide whether to bet.

    Stage 6: We draw the second ball and resolve the bets.

   But this is complex. We have to have different policies and then they might behave differently.

   Moreover, the value of c should be chosen so that:

     - In the no-information case, the set of probabilities is [0.6,0.8]. 
          under Policy 1: min=0.6, so if c<=0.6, they bet.
          under Policy 2: max=0.8, so if c<=0.8, they bet.
          under Policy 3: midpoint=0.7, so if c<=0.7, they bet.

     - In the information case, after a signal, the set is either [5/9,7/9]≈[0.5556,0.7778] or [6/9,8/9]≈[0.6667,0.8889] (for green) or similarly for red/blue.

     We want that for some signals, under Policy 1, they might not bet, even though in the no-information case they would have.

     For example, set c=0.6.

     No-information case:
          Policy 1: min=0.6 >= c, so they bet.
          Policy 2: max=0.8>=c, so they bet.
          Policy 3: 0.7>=0.6, so they bet.

     Information case, after seeing a red (or blue):
          The set is [0.5556,0.7778]
          Policy 1: min=0.5556 < 0.6, so they do not bet.
          Policy 2: max=0.7778>=0.6, so they bet.
          Policy 3: midpoint=(0.5556+0.7778)/2≈0.6667>=0.6, so they bet.

     So if a student has Policy 1, then in the no-information case they bet, and in the information case (after seeing a red) they do not bet.

     Now, what is the actual probability of success? It depends on the urn type and the first draw.

     But the student with Policy 1 who sees the signal and then sees a red will not bet. If they had not seen the signal, they would have bet.

     Is it possible that by not betting they avoid a loss? Or by betting in the no-information case they win?

     The event is that the second ball is not green.

     If the urn is Type A and the first draw was red:
          Composition after first draw: 2 red, 3 blue, 4 green -> non-green: 5 out of 9, so P(success)=5/9≈0.5556.
     Since c=0.6, and 0.5556<0.6, not betting is the right decision because the expected payoff of betting is 0.5556 if we take a prior, but under ambiguity, Policy1 is min, and min is 0.5556<0.6.

     If the urn is Type B and the first draw was red:
          Composition: 3 red, 4 blue, 2 green -> non-green: 7/9≈0.7778>0.6.

     So in the case of Type A and first draw red, by not betting they avoid a bet that has a probability of success 0.5556<0.6. In the case of Type B, they miss out on a good bet.

     But overall, in the no-information case, if they bet, the probability of success is either 0.6 or 0.8. The expected value depends on the prior over the urn type. We haven't given a prior, but the policies are based on the set.

     For a student with Policy 1, in the no-information case, they bet and get:
          If Type A: success with prob 0.6 -> payoff 1 if win, 0 if lose.
          If Type B: success with prob 0.8.

     The actual outcome depends on the urn.

     By not seeing the signal, they bet and get an expected payoff that is between 0.6 and 0.8.

     By seeing the signal and then sometimes not betting, they might avoid a low probability bet, but also might miss a high probability bet.

     We want them to see that for Policy 1, the information can cause them to not bet when they would have, and that might be good or bad, but in this case, since the no-information bet has a minimum of 0.6 and the information might reveal a probability below 0.6, it might be that the information prevents them from taking a bad bet.

     But also, it might make them pass on a good bet.

     So it's mixed.

     However, the widening of the interval means that the decision is now based on a wider range, which might cause the min to drop below c, making them not bet.

     But we want them to have the option to not see the signal to avoid this widening.

     For a student with Policy 1, they might prefer not to see the signal because then they will always bet (since min=0.6>=c), whereas if they see the signal, they might see a red and then min=0.5556<0.6 and they won't bet, missing out on a potential win if it was Type B.

     But if it was Type A and they see a red, then not betting is good.

     So it’s not clear-cut.

     Alternatively, we can make the sure payoff c such that it is inside the initial interval but outside some of the updated intervals for the min.

     But we want them to have a strict incentive to avoid the signal.

     Consider if we set c=0.62.

