prompt: |-
  I serve on the Academic Standards Committee of a university faculty of health sciences, and I need to circulate a decision memo before our meeting in ten days. I'd like you to draft it.

  The case before us concerns a two-year master's programme in advanced clinical practice that certifies graduates for hospital work. For the past four semesters the programme has permitted students to use an AI clinical decision-support assistant on secured university devices, both in placements and in the observed structured clinical examinations that decide the award. The tool is permitted because the profession permits it: practitioners in the field already use decision support, and the programme's view has been that assessing clinical judgement in a tool-free vacuum would measure the wrong thing.

  Two things have made this newly contentious. First, our assessment office ran an anonymous sub-study last term comparing the fourteen students who used the assistant throughout with the nineteen who essentially never did. On the standard examinations, with the tool available, the heavy users scored marginally higher. On an unproctored tool-free variant of the same stations, the heavy users scored substantially lower than the non-users — low enough that some of them would not have passed. The tool, in other words, does not sit on top of an unchanged competence; it appears to substitute for part of it. Second, in the oral component of the examinations, the heavy users reliably produce the correct management plan but cannot answer what I'll call the boundary question: what would have to be different about this patient for the alternative plan to be the right one. They can restate a recommendation and its supporting guideline; they cannot locate the case relative to its neighbours, and they do not reliably notice when a station has been perturbed into a case where the tool's recommendation is wrong.

  One member of the faculty has circulated a note invoking Plato's Meno: the worry that reliably correct performance without an account is, in the dialogue's image, an untethered statue that wanders off, and that the tether is worth something even in the stretches where the statue stays put. Several members find this beside the point, since what we certify, on their view, is a prediction about practice, and the prediction for these students is good.

  A concrete proposal is on the table: adopt a perturbation standard. A candidate for the award must, for a sample of stations, state what change in the presentation would change the recommended management and why, and must flag at least one case in the sample where the decision-support recommendation is wrong. The complication is that the only instrument we have for this is oral, and three students in the current cohort have registered accommodations or language profiles that make an oral requirement a poor measure of what it is meant to measure. We cannot adopt a standard that partly measures fluency in English.

  Three further facts complicate the choice. The university's award descriptor, written years ago for purposes of patient communication, already says that a holder can account for their decisions to colleagues and patients; nobody until now has read that clause as a bar to certification. The national regulator is consulting on whether to permit decision support in the licensing examination, with an outcome expected within the year that we do not control. And twenty-three students are mid-programme under the current rules, some of whom would fail a perturbation requirement if it were applied to them without notice.

  I am not neutral. I lean toward adopting some version of the standard, but two things keep me from confidence: the analogy one colleague offers, of instrument-rated pilots who are markedly worse at manual flying than their predecessors and yet safer overall because the instruments are always there; and the fact that our only instrument for the standard is oral. I also cannot tell whether the answer should track the regulator's decision or anticipate it.

  Please draft the memo the committee could act on. It should recommend a concrete course with a time frame: adopt, adopt in a specified modified form, or decline; what to do about the current cohort and why that treatment rather than full or no retroactivity; how a perturbation standard would actually be administered so that it tests the boundary question and not verbal fluency or English; and what we should do under each of the regulator's possible outcomes, including whether we should wait for it. It should give reasons a colleague who disagrees could respond to rather than restate the programme's existing policy, and it should state, in one paragraph before the recommendation, which considerations are load-bearing for you and which you are setting aside as undecidable here. It should also say, honestly and at some length, what is strongest in the case for the opposite recommendation, and whether the phenomenon I have labelled credential drift — the award continuing to mean to employers what it has always meant while ceasing to track what it used to track — is a real harm or a piece of nostalgia. Assume the committee knows the background above; do not summarise it back to me. No citations or bibliography: I will add anything of that kind myself. Around 1,200 words.
reasoning: |-
  Okay, the user is on an Academic Standards Committee and needs a draft decision memo about using AI clinical decision-support tools in their master's program. This is a complex issue with ethical, practical, and pedagogical dimensions. 

  First, I need to unpack the key tensions: On one side, there's evidence that tool dependency erodes clinical judgment (the boundary question problem and poor performance without AI). On the other, banning tools might misrepresent real-world practice where such aids are standard. The accommodation issue for non-native speakers adds another layer of complexity.

  The user leans toward a "perturbation standard" but has valid concerns - the aviation analogy suggests tools might enhance safety despite skill erosion, and the oral assessment format could disadvantage some students. There's also institutional pressure: mid-program students, pending regulator decisions, and credential drift risks.

  Hmm... the memo must balance several competing priorities: 
  - Maintaining assessment integrity while respecting real-world practice 
  - Ensuring fairness to current students 
  - Aligning with future regulatory frameworks 
  - Measuring competence rather than language fluency 

  I'm struck by how the Plato reference versus aviation analogy captures the philosophical divide. The memo needs to acknowledge both views respectfully while steering toward actionable solutions. The perturbation standard seems promising but requires careful implementation to avoid conflating clinical reasoning with verbal eloquence.

  For structure: I'll start with the core dilemma, then present options neutrally before recommending a modified perturbation standard with non-oral alternatives. The recommendation should grandfather current students but require the standard for future cohorts, with explicit triggers based on regulator outcomes. Credential drift should be framed as a real harm - employers expect graduates to have certain reasoning skills regardless of tool usage.

  The accommodations issue is critical. I'll propose written/visual response options for boundary questions to decouple language fluency from clinical judgment assessment. For the current cohort, we must avoid retroactive failure but could offer voluntary boundary testing for self-diagnosis.

  Timing is tight - 10 days until meeting. The memo should enable debate by clearly separating factual findings from value judgments, and explicitly naming which uncertainties we can't resolve (like whether tool dependency actually harms patients when tools are available). 

  Most importantly, the tone must be collaborative - we're all trying to certify competent clinicians, just disagreeing on how to measure it. The "strongest opposing case" section will validate colleagues who prioritize practice-relevance over pure reasoning skills.
answer: |-
  ## MEMORANDUM

  **To:** Academic Standards Committee, Faculty of Health Sciences  
  **From:** [Your Name/Position], Committee Member  
  **Date:** [Date of Circulation]  
  **Subject:** Recommendation on AI Decision-Support Tool Policy & Proposed Perturbation Standard for MSc Advanced Clinical Practice Programme  
  **Meeting Date:** [Date of Committee Meeting]

  ### Core Dilemma & Load-Bearing Considerations
  This recommendation hinges on reconciling two primary, potentially conflicting, imperatives revealed by the sub-study: **(1) Ensuring graduates possess the resilient clinical judgment necessary for safe, adaptable practice, even when tools fail or present edge cases;** and **(2) Ensuring our assessment authentically reflects competent practice *as it is actually performed*, which includes appropriate tool use.** The sub-study strongly suggests that unrestricted tool use, while enabling technically correct outputs in standard scenarios, masks significant deficits in foundational clinical reasoning ("boundary questions") and adaptability to perturbation, deficits that could manifest in real-world tool failure or atypical cases. The risk of certifying graduates whose competence is contingent on uninterrupted tool access, without the underlying judgment to detect errors or adapt, constitutes a core, load-bearing concern for programme integrity and patient safety.

  I set aside as currently undecidable: **(1) The long-term safety equivalence argument** (the "instrument-rated pilot" analogy); while compelling in theory, healthcare’s dynamic, less predictable environment and the criticality of error detection differ significantly from controlled aviation protocols. We lack data proving equivalent safety here. **(2) Predicting the regulator's final decision**; we must act based on our academic judgment of necessary competence, not speculation on external policy.

  ### The Strongest Case for the Opposite Recommendation (Maintaining Current Policy)
  The most compelling argument against adopting a perturbation standard is rooted in predictive validity and authenticity. If practitioners in the field routinely and appropriately rely on these tools, and our graduates demonstrate they can use them effectively to consistently produce correct management plans within the OSCEs mirroring that reality, then we *are* accurately certifying their readiness for practice. The sub-study’s tool-free results, while concerning, represent an artificial scenario – akin to testing a pilot without instruments in clear weather where instruments are standard and reliable. Focusing on the outcome (correct patient management) achieved via approved tools may be the most relevant measure for employers and patients. Introducing a novel standard assessing reasoning depth, especially one potentially difficult to implement fairly, risks adding an academic hurdle disconnected from the practical reality of the profession we serve. Furthermore, applying any change mid-programme to the current cohort raises significant fairness concerns, potentially derailing students who enrolled under clear, established rules. Waiting for the regulator’s decision (expected within the year) provides certainty and alignment, avoiding potential friction between programme standards and national licensing requirements.

  ### Recommendation
  The Committee should **adopt a modified perturbation standard, applicable prospectively to new cohorts entering from [Specify Start Date, e.g., Next Academic Year/Semester], and implement a non-punitive, supportive assessment for the current cohort.**

  ### Detailed Course of Action & Rationale

  1.  **Adopt a Modified Perturbation Standard:**
      *   **Requirement:** Candidates must demonstrate the ability to identify critical factors influencing clinical decisions and detect potential tool errors for a defined sample of OSCE stations.
      *   **Concretely:** For a minimum of [e.g., 2-3] stations within the OSCE:
          *   **(a) Boundary Identification:** State at least one specific, clinically relevant change in the patient's presentation (e.g., vital sign, symptom, history element, lab value) that would shift the optimal management plan away from the initial recommendation (whether generated by tool or themselves), and briefly explain *why* this change alters the clinical reasoning.
          *   **(b) Error Flagging:** Identify at least one station within the sample where the decision-support tool's recommended management plan is incorrect or suboptimal for the presented case (a pre-programmed "perturbation"), and state the primary reason why.
      *   **Implementation Modifications Addressing Key Concerns:**
          *   **Non-Oral Instrument Requirement:** **Crucially, this standard MUST NOT rely solely on oral assessment.** To ensure it measures clinical reasoning, not verbal fluency or English proficiency:
              *   **Option A (Preferred):** **Written/Structured Response:** For stations designated for perturbation assessment, candidates provide brief written responses to specific prompts for (a) and (b) above *during* or immediately *after* the station, using a simple structured form (checkboxes, short phrases, diagrams allowed). This removes the fluency variable. Scoring focuses on clinical accuracy and relevance, not grammar or eloquence.
              *   **Option B:** **Visual/Diagrammatic Response:** Allow candidates to use simple diagrams, flowcharts, or annotated images to illustrate the boundary change or the tool's error point.
              *   **Accommodations:** For students with registered accommodations affecting written communication, approved alternatives (e.g., use of specific assistive tech, scribe for verbatim transcription of short dictated points) must be implemented, designed in consultation with the university's accessibility office, ensuring the accommodation targets the disability barrier without altering the clinical reasoning demand. The core principle: *decouple the assessment of clinical judgment from the mode of expression.*
          *   **"Sample of Stations":** Assessing only a sample within the OSCE balances rigour with feasibility and reduces overall assessment burden. Stations are randomly assigned or rotated to prevent predictability.

      *   **Rationale for Adoption:** This directly addresses the identified deficit in "boundary" reasoning and error detection evidenced by the sub-study. It operationalizes the existing, previously overlooked award descriptor requirement regarding "account[ing] for decisions." It ensures graduates possess a minimum threshold of adaptable clinical judgment, making their certified competence more resilient and less tool-dependent. The modified implementation directly mitigates the fairness concern related to oral assessment.

  2.  **Treatment of the Current Cohort (Mid-Programme Students):**
      *   **Action:** **Do NOT apply the perturbation standard as a pass/fail requirement for the current cohort.** They enrolled under the existing rules.
      *   **Alternative Action for Current Cohort:** Implement a **non-punitive, formative "Clinical Reasoning Audit"** during their remaining OSCEs.
          *   For a sample of stations, incorporate the modified perturbation assessment (using written/structured or visual response methods as above).
          *   Results are used **solely for feedback and development**, not for progression or award decisions. Provide detailed, individualised feedback to students on their performance on these elements.
          *   Offer targeted remedial support (e.g., workshops on clinical reasoning frameworks, case-based discussions focusing on edge cases and tool limitations) for students who struggle significantly in the audit.
      *   **Rationale:** Applying a new standard retroactively as a pass/fail barrier would be manifestly unfair, potentially failing students based on rules introduced after they committed to the programme. However, ignoring the identified issue entirely does a disservice to these students and future patients. The audit provides valuable diagnostic information and an opportunity for targeted skill development before they graduate and enter practice, fulfilling our duty of care without violating procedural fairness.

  3.  **Relationship to the National Regulator's Pending Decision:**
      *   **Recommendation:** **Proceed with adopting our modified standard as outlined, regardless of the regulator's initial decision.**
      *   **Rationale:** Our primary responsibility is to define and certify the academic standard we deem necessary for our graduates based on evidence and pedagogical principles, not merely to align with the minimum licensure requirement. The regulator's decision pertains to the *licensing exam*; our programme standard can (and arguably should) be more rigorous if evidence supports it. If the regulator *permits* tools in the licensing exam, our graduates will still benefit from the deeper reasoning skills fostered by our standard. If the regulator *bans* tools, our standard ensures our graduates are already prepared for that assessment environment. We retain flexibility to *adjust implementation details* (e.g., the *extent* of tool use permitted during OSCEs) post-regulator decision if alignment proves highly advantageous, but the core competence in boundary reasoning and error detection should remain a programme requirement.

  4.  **Addressing Credential Drift:**
      Credential drift – an award maintaining its external value while the underlying competencies shift – is a **real and significant harm**, not mere nostalgia. Our degree's value relies on employers' trust that it signifies a specific, known set of competencies (including robust clinical judgment). If we knowingly allow the certified competence to erode (as the sub-study suggests unrestricted tool use might) while the degree retains its name and reputation, we engage in a form of misrepresentation. It undermines the credibility of the award, the programme, and the university. Proactively addressing the reasoning deficit through the perturbation standard is essential to maintain the integrity and meaning of the qualification we confer.

  ### Time Frame & Next Steps
  *   **Immediate (Within 1 week of Committee Approval):** Draft revised OSCE blueprint and assessment protocols incorporating the modified perturbation standard (written/structured response) for designated stations. Consult with University Accessibility Office on implementation options.
  *   **By [Date - e.g., 4 weeks after approval]:** Finalise assessment rubrics, sample prompts, and training materials for examiners on scoring the written/structured perturbation responses.
  *   **For Current Cohort (Starting Next Term):** Design and schedule the formative "Clinical Reasoning Audit" within upcoming OSCEs. Develop associated feedback and optional remedial support resources.
  *   **Implementation Start:** Modified perturbation standard integrated into OSCEs for **new cohorts entering from [Specify Start Date]**.
  *   **Post-Regulator Decision:** Committee reconvenes to review regulator's outcome and determine if any *adjustments* to the *implementation* of our standard (e.g., specific rules about tool availability during OSCEs) are warranted for optimal alignment, while preserving the core competence requirement.

  ### Conclusion
  The evidence indicates our current assessment approach, while authentic to tool use, risks certifying graduates lacking the resilient clinical judgment necessary to navigate uncertainty, tool error, or changing circumstances. The proposed modified perturbation standard, implemented via non-oral methods to ensure fairness, directly targets this deficit, strengthening the meaning and integrity of our award. Treating the current cohort fairly requires formative assessment and support, not retroactive high-stakes application. We should define our academic standard based on our evidence and judgment, proactively addressing credential drift, while remaining prepared to adapt implementation details post-regulator decision. I recommend the Committee adopt this course.
