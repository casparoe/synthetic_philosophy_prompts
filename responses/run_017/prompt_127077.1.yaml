  Hmm, the user's skepticism shines through - they think the assertoric-only story is too quick, and suspect something first-personal is lost. Their "half-invented" case about failing to believe an entailment (p & p→q but not believing q) is particularly clever. The AI angle feels urgent too - if non-asserting systems exhibit Moore-like failures, that undercuts the norm-based view.

  The guest's likely deflection tactics ("that's not real Moorean belief!") mean questions need airtight examples. For the self-deception point, maybe press with clinical cases where patients sincerely assert contradictions. For intention/desire asymmetry, demand why "I'm quitting smoking but I don't intend to" feels absurd if norms alone explain it. 

  The user's worry about "ambushing" is touching - we'll avoid gotchas by grounding each question in the guest's own framework. The entailment case should be framed as "Is this cousin or sibling to Moore?" not "Ha, got you!". And ending with falsifiability ("What would change your mind?") keeps it constructive.

  Biggest challenge is condensing wine-fueled roommate debates into lean questions. The "p & p→q but not q" case needs simplifying - maybe say "logical blind spot" instead of jargon. And for the AI point, cite specific papers so it doesn't sound handwavey. 

  Final list should pivot from restating theory (skip that) to pressure points: commissive/omissive equality, belief-in-Moorean-content possibility, intention/desire asymmetry mechanism, and whether assertion norms can really shoulder all explanatory weight. Sprinkle in user's cases for freshness.
answer: |-
  Here are 8 interview questions designed to probe the core claims, test the boundaries, and explore the implications of your guest's view on Moore's Paradox, plus likely follow-ups and a falsification question. They're phrased conversationally for a podcast format:

  1.  **Core Claim - Omissive Primacy:** "You argue that the *omissive* form ('It's raining but I don't believe it') is the fundamental case, and the *commissive* form ('It's raining but I believe it isn't') is just a stylistic variant. Could you elaborate on *why* the commissive form isn't doing distinct work? Specifically, doesn't the commissive involve actively *misrepresenting* one's own belief state in a way the omissive doesn't, potentially adding a layer of deception?"
      *   *Likely Answer:* She'll double down on omissive primacy, perhaps saying the commissive is just the omissive plus a false belief report, or that the core absurdity is the same mismatch between content and attitude.
      *   *Follow-Up:* "If they are truly variants, why does the commissive often feel *more* jarring or paradoxical to people? Could that intensity hint at something more than style – maybe a conflict *within* the belief state itself?"

  2.  **The Locus of Absurdity - Assertion vs. Belief:** "You locate the paradox's absurdity entirely in the norms of *assertion*, rejecting the idea it reveals an incoherent mental state. Given you accept people can genuinely *believe* Moorean propositions (like in some self-deception/delusion), could you walk us through what such a belief *feels like* from the inside? Isn't there a tension there that *is* part of the mental state, even if it's stable?"
      *   *Likely Answer:* She'll describe compartmentalization, fragmentation, or lack of integration in self-deception/delusion, denying any inherent tension *within* the singular belief that (p & ~Bp).
      *   *Follow-Up:* "Take a clinical case where someone both asserts *and seems deeply committed* to both 'p' and 'I don't believe p' simultaneously – perhaps expressing distress about their own lack of belief. Doesn't their *experience* of conflict suggest an incoherence *in the attitude itself*, not just a violation of external assertion rules?"

  3.  **Self-Deception/Delusion as Evidence:** "You point to self-deception and clinical delusion as evidence that Moorean propositions *can* be believed. But critics often argue these are precisely cases where belief is *fragmented*, *withheld*, or *not fully integrated* – states distinct from a single, coherent belief in (p & ~Bp). How do you distinguish your 'genuine Moorean belief' from these fragmented states?"
      *   *Likely Answer:* She'll argue that fragmentation *is* the mechanism enabling the Moorean belief state, or deny that "full integration" is necessary for genuine belief.
      *   *Follow-Up:* "If the belief *is* fragmented (e.g., one module 'believes' p, another 'believes' ~Bp), doesn't that mean the subject *lacks* the single, unified belief *that (p & ~Bp)*? Aren't we just describing two separate beliefs held by different parts, not one Moorean belief?"

  4.  **Intention vs. Desire Asymmetry - Assertion Norms:** "You note the asymmetry: 'I'm going to do A but I don't intend to' sounds Moorean-absurd, while 'p, and I want not-p' is fine. You explain this via assertion norms. Could you spell out precisely *which* assertion norm is violated by the intention-statement but not the desire-statement? Is it just sincerity, or something else?"
      *   *Likely Answer:* She'll likely tie it to the constitutive norm of assertion being something like "assert only what you know/believe," and argue that intending is tied to asserting future action in a way desiring isn't.
      *   *Follow-Up:* "Consider 'I'm going to quit smoking (said sincerely) but I don't intend to quit smoking'. The absurdity seems rooted in the *practical irrationality* of avowing an action while disavowing the intention guiding it. Doesn't this point to a norm of *practical rationality* governing intention-avowals, rather than just a generic assertion norm? How does your assertion-norm story capture that *specific* practical incoherence?"

  5.  **Severing from Self-Knowledge & Belief-at-Will:** "You argue Moore's Paradox tells us little about self-knowledge or why we can't believe at will. But isn't the *transparency* of belief – roughly, that we answer 'Do I believe p?' by considering p – directly challenged by the *possibility* of believing (p & ~Bp)? If I can believe p while simultaneously believing I don't believe it, doesn't that undermine the idea my beliefs are transparent to me?"
      *   *Likely Answer:* She'll argue transparency theories are flawed independently of Moore, or that Moorean beliefs are rare exceptions proving the transparency rule is defeasible, not fundamental.
      *   *Follow-Up:* "Even granting transparency isn't perfect, doesn't the *pervasive absurdity* of asserting Moorean sentences, precisely because it reveals a *failure* of self-knowledge *in the standard case*, suggest Moore's Paradox *is* fundamentally intertwined with the *typical* conditions for knowing our own beliefs? Doesn't its force come from highlighting how things go wrong when transparency *breaks down*?"

  6.  **The "Entailment Blind Spot" Case:** "Here's a variant I've been puzzling over: 'p, and p plainly entails q, but I don't believe that q'. This feels deeply irrational, perhaps Moorean-esque. Is this the *same* phenomenon for you? If not, why not? If so, how does your assertion-norm account explain its absurdity, especially since the subject *isn't* asserting ~Bp?"
      *   *Likely Answer:* She might say this is distinct – a failure of logical/rational commitment, not the core Moorean structure. Or, she might try to fold it in as another assertion norm violation (e.g., assert only what you rationally commit to).
      *   *Follow-Up:* "If it's distinct, what *is* the source of its absurdity? If you try to fold it in, doesn't this stretch the concept of 'assertion norms' thin, potentially making them cover *all* rationality norms? How do you keep the core Moorean phenomenon distinct?"

  7.  **AI/CS Counterexample - Non-Asserting Systems:** "Computer scientists/AI researchers often use Moorean sentences ('p but ~Bp') as examples of faulty epistemic states in systems that *don't assert* – they flag an agent failing to update its beliefs based on new evidence. If the absurdity is purely about *assertion norms*, how do you explain why this state is considered faulty even in non-asserting systems? Doesn't this suggest the problem *is* fundamentally doxastic?"
      *   *Likely Answer:* She'll likely deflect: "Those systems are modeling *human* irrationality," or "That's not a *true* belief state, it's just a database inconsistency," or "The 'fault' is defined *by us* based on *our* assertion norms."
      *   *Follow-Up:* "But isn't the 'fault' identified precisely because a system holding p and ~Bp *cannot function rationally* – it might act on p while ignoring evidence for p, or vice-versa? Doesn't this point to a *functional* incoherence *within* the representational state itself that impedes rational agency, independent of whether it asserts anything? Isn't *that* why it's faulty?"

  8.  **The Fragile Subject/Objection Deflection:** "A theme in your work seems to be protecting the core idea of 'genuine Moorean belief' by diagnosing apparent counterexamples as fragmented subjects or theorists' artifacts. This makes the view hard to falsify. Could you give us a clear example of what a *non*-fragmented, genuine belief in a Moorean proposition would look like *in practice*? What observable behavior or report would confirm it's not fragmentation?"
      *   *Likely Answer:* She'll point to detailed clinical cases or specific self-deception scenarios, arguing they show unified commitment to the contradiction.
      *   *Follow-Up:* "But in those cases, isn't the subject's behavior or other reports *always* ambiguous? For instance, they might act inconsistently with p, or express doubt about p later. Doesn't that very ambiguity *support* the fragmentation diagnosis, rather than genuine unified belief in the contradiction?"

  **Falsification Question:** "Finally, to help us understand the stakes: What kind of empirical finding or philosophical argument *would* genuinely challenge your core thesis that the paradox is purely assertoric and Moorean propositions can be coherently believed? What evidence or scenario might make you reconsider?"

  **Key for Delivery:**

  *   **Listen Actively:** Her answers will dictate which follow-up is most relevant. Don't feel locked into the exact follow-up listed if she takes the answer in a surprising direction.
  *   **Clarify, Don't Confront:** Use phrases like "Help me understand..." or "Could you elaborate on..." rather than "But that's wrong because...".
  *   **Bridge:** Use phrases like "Building on that..." or "You mentioned X, that leads me to wonder about Y..." to connect questions smoothly.
  *   **Keep it Conversational:** The questions are written as spoken. Feel free to slightly rephrase for your natural rhythm.
  *   **Pace:** With 8 main questions plus potential follow-ups, 40 minutes will be tight. Prioritize based on the flow and what sparks the most interesting discussion. You might not get to *every* follow-up.

  These questions should push the conversation beyond exposition into critical engagement with the distinctive and controversial aspects of her view, directly addressing your instincts and concerns while respecting her expertise. Good luck with the interview!
