answer: |-
  ## ASA RULING: A23-1234567  
  **Advertiser:** Soluspeak Ltd  
  **Sector:** Digital Services (Software Application)  
  **Media:** Website, promotional materials, social media  
  **Complaint:** From LinguaCore Ltd  
  **Complaint Issue Date:** 15 October 2023  
  **Decision Date:** 12 January 2024  

  **DESCRIPTION OF THE COMPLAINT**  
  1. LinguaCore Ltd challenged whether the following claims made by Soluspeak Ltd in relation to its "Soluspeak" application were misleading and could be substantiated:  
     a. "A word only you can truly know: Define the indefinable parts of you." (Website homepage)  
     b. "Quilp: My Soluspeak word. It means something no one else could ever learn. That’s the point." (Attributed to CEO in promotional interview, TechInsight Magazine).  
     c. "Finally, a vocabulary for the sensations only you experience." (App Store description).  

  **ADVERTISER'S RESPONSE**  
  2. Soluspeak Ltd stated the claims were core to their product proposition but were not intended as objective statements of linguistic fact. They asserted the claims were subjective reflections of the user experience their app facilitated.  
  3. Regarding substantiation, Soluspeak Ltd provided:  
     a. **Theoretical Basis:** Internal white paper titled "Subjective Lexicography & Individual Phenomenology" (heavily redacted for commercial sensitivity) outlining the concept of user-defined terms for unique internal states.  
     b. **Founder's Diary:** A 12-month personal journal extract (Exhibit SPS-7B) detailing 47 instances where the CEO recorded experiencing "quilp". Each entry described context (e.g., "Meeting adjourned abruptly, felt quilp"; "Saw magpie land on fencepost at dusk, distinct quilp sensation"). Soluspeak argued this demonstrated the term's consistent application to a recurring internal state specific to the founder.  
     c. **Sealed Sample:** A sealed, opaque container labelled "Quilp Instance - Sample A (Ref: Q-2023-0041)". The Advertiser stated this contained "a physical representation of the context in which 'quilp' was experienced on 12th July 2023", but declined to open it, arguing its contents were inherently private and meaningful only to the founder.  
     d. **Usage Panel Report:** A report based on the founder's exclusive use of "quilp" over a 6-month period (Exhibit SPS-9D). The report concluded "100% internal consistency in application by the sole user."  
  4. When specifically asked by the ASA to provide evidence demonstrating that the *meaning* of "quilp" was consistent and knowable solely by the founder *to the exclusion of others ever learning it*, Soluspeak Ltd reiterated point 3b (the diary) and stated: "The consistent application *is* the meaning. Only the founder experiences the founder's internal state. The diary shows he recognises it. No one else needs to. The sealed sample proves there *is* a specific referent."  

  **ASSESSMENT**  
  **Claim 1: "A word only you can truly know: Define the indefinable parts of you." and Claim 3: "Finally, a vocabulary for the sensations only you experience."**  
  5. The ASA considered consumers would interpret these claims to mean that the Soluspeak app enabled users to create words for genuinely unique, personal internal sensations or states of mind that were experienced solely by the individual user.  
  6. We acknowledge Soluspeak Ltd's evidence (3b, 3d) demonstrating that its founder had applied the term "quilp" consistently to a sensation he subjectively identified as recurring. The diary entries and internal consistency report support the founder's assertion that *he* recognised a specific internal state.  
  7. The claim "sensations only you experience" relates to the privacy of subjective experience. It is uncontroversial that internal sensations are private to the individual experiencing them; no one else has direct access to another's subjective state. The claim "only you can truly know" similarly reflects this basic privacy of experience. The ASA does not consider these claims misleading on this point. Soluspeak Ltd has adequately substantiated that their app facilitates the creation of labels for such private sensations.  
  8. **Decision on Claims 1 & 3: Not upheld.**  

  **Claim 2: "Quilp: My Soluspeak word. It means something no one else could ever learn. That’s the point."**  
  9. The ASA considered consumers would interpret this claim, particularly the phrases "means something" and "no one else could ever learn", to mean that the *meaning* of the founder's word "quilp" was:  
      a. Specific and defined (i.e., it referred to a distinct, identifiable phenomenon).  
      b. Fundamentally inaccessible to understanding or comprehension by anyone other than the founder, now or in the future.  
  10. Regarding point 9a: The ASA acknowledges Soluspeak Ltd's evidence (3b, 3d) that the founder consistently applied the term "quilp" to a sensation he identified. The diary shows recurrent usage by one person in varying contexts. This provides a low level of substantiation for the founder's *own* belief in a specific referent. However, the evidence does not demonstrate *what* "quilp" means, only that the founder uses the word. The "Sealed Sample" (3c) was presented as evidence of a specific referent. The ASA notes the Advertiser's assertion that the box "proves there *is* a specific referent". We accept the box likely contains *something*. However, the inability to access or describe the contents meaningfully, *even by the Advertiser for the purpose of verification*, renders it incapable of substantiating the *nature* or *specificity* of the meaning claimed for "quilp". The sample's opacity is the core problem for verification.  
  11. Regarding point 9b: This is the central claim requiring substantiation: that the meaning of "quilp" is something "no one else could ever learn". Soluspeak Ltd's evidence primarily focuses on the founder's *private experience* and his *consistent labelling* of that experience (3b, 3d). While this demonstrates the founder associates the word with a sensation, it does not substantiate the claim that the *meaning itself* is inherently unlearnable by others.  
  12. The ASA sought evidence demonstrating why the meaning could *never* be learned. Soluspeak Ltd's response (point 4) relied entirely on the privacy of the founder's sensation and the consistency of his own application. They argued the sealed sample contained the referent but could not be shared. When asked how they could confirm the word was being applied consistently *to the same specific meaning* over time, beyond the founder's assertion, Soluspeak Ltd re-submitted the diary and stated, "The founder experiences quilp and applies the term. The consistency is evident. Asking for external verification misunderstands the private nature of quilp." They did not provide evidence demonstrating an inherent barrier to comprehension by others, only evidence of current privacy and internal consistency.  
  13. Soluspeak Ltd's lawyer further argued: "The origin point of *all* shared meaning is a private association. The fact this association remains private doesn't negate its status as meaning; it simply resides where meaning begins, before sharing becomes possible or necessary." While this statement highlights a perspective on language genesis, it does not constitute evidence that the specific meaning of "quilp" is *in principle* unlearnable by others. It addresses the *origin* of meaning, not its potential for future comprehension.  
  14. The ASA concluded that Soluspeak Ltd had not provided adequate evidence to substantiate the claim that the meaning of "quilp" was something "no one else could ever learn." The evidence demonstrated a private association and consistent usage by one individual, but not the fundamental impossibility of comprehension by another person, should sufficient contextual information or description ever be provided. The claim went beyond asserting privacy of experience to asserting an inherent and permanent unknowability of meaning.  
  15. **Decision on Claim 2: Upheld.**  

  **ACTION**  
  16. The ad must not appear again in its current form. We told Soluspeak Ltd to ensure that future ads do not state or imply that the *meaning* of a user-defined word is fundamentally unlearnable by others. Claims about the privacy of the *experience* referred to by the word (Claims 1 & 3) were considered acceptable based on the evidence provided, provided they are not presented in a way that conflates private experience with unlearnable meaning. Soluspeak Ltd is advised to hold robust substantiation for all objective claims regarding the capabilities or effects of its product.  

  **CODE BREACHES**  
  17. The ad breached CAP Code (Edition 12) rules 3.1 (Misleading advertising), 3.7 (Substantiation), and 3.33 (Comparisons with identifiable competitors).  

  **REFERENCE**  
  18. Case Reference: A23-1234567 | Sector: 28.9 (Miscellaneous software) | Outcome: Upheld in part.
