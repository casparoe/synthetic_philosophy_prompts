  ### **Decision Tree: What Are Laws of Nature?**
  **Starting Commitment**: Laws aren't just accidental generalizations with many instances.

  1. **Node 1 (Case 8 - Deep structure vs. coincidence)**:  
     *Two worlds have identical histories of events. In one, a regularity holds because of a deep, fundamental structure (e.g., intrinsic properties of objects); in the other, it holds by pure coincidence. Does this difference affect what the laws are?*  
     - **Yes** → Laws depend on more than events. Go to Node 2.  
     - **No** → Laws depend only on the pattern of events. Go to Node 3.  

  2. **Node 2 (Case 5 - Uninstantiated law)**:  
     *Can there be a law about a type of particle that never exists in a world (e.g., "All phlogiston particles decay in 5 seconds," but phlogiston never forms)?*  
     - **Yes** → Laws can exist without instances. Go to Node 4.  
     - **No** → Laws require actual instances. Go to Node 5.  

  3. **Node 3 (Case 4 - Language relativity)**:  
     *A generalization is simple (e.g., "F=ma") in one vocabulary but an unreadable mess in an equally good alternative vocabulary. Could this generalization be a law in the first language but not the second?*  
     - **Yes** → Laws are language-relative. Go to Node 6.  
     - **No** → Laws are objective, not tied to language. Go to Node 7.  

  4. **Node 4 (Case 7 - Single violation)**:  
     *In a world like ours, one electron violates a well-established regularity exactly once, with no hidden cause. Should we conclude the law was "in force" but violated, rather than it being a false generalization?*  
     - **Yes** → Laws can be "broken" without being false. Go to Node 8.  
     - **No** → A violation means the generalization was never a law. → **Primitivism** (Laws are primitive facts; they can be uninstantiated, and violations don't falsify them, but they don't "govern" in a causal sense).  

