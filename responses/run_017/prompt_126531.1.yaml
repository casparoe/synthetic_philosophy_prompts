     - **No** → Laws require robust regularities. → **Dispositional Essentialism** (Laws are grounded in the essential powers/dispositions of objects; dispositions require actual bearers, but sparse worlds lack the "machinery" for laws).  

  6. **Node 6 (Case 3 - Underdetermined systems)**:  
