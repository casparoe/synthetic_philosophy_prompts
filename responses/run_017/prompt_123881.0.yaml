prompt: |-
  My girlfriend and I keep having the same argument and I want a word for one specific bit of it, because I think if I had the word the argument would basically end.

  Here's the shape of it. On Sunday I decide, quite firmly, that I'm going to start running on Monday morning. Monday comes and I don't run — and I decide I'm going to start on Tuesday. Tuesday, Wednesday. The thing I keep noticing is that at no point does it feel like I've changed my mind. Sunday me and Monday me both say, sincerely, that they're starting tomorrow, and both would insist they still want the same thing and still think it's worth doing. I'm not choosing the sofa over the run, I'm not revising my judgement that running is good, and there isn't even some other thing I'm doing instead — I just keep re-dating the same plan, and the reason I give each time is the same vague one (once I've got a proper block of time, once this week is out of the way), a reason I would totally have accepted on the Sunday as well.

  It happens at work too, which is what makes me think it's not about laziness or about my body: our team keeps moving the same decision to next sprint, everyone is still in favour of making the decision, nobody thinks the decision has become less urgent, and yet it slides, and each slide comes with its own reasonable-sounding excuse that would have sounded just as reasonable two sprints ago.

  A friend who did a philosophy minor muttered something about akrasia and about hyperbolic discounting, but neither seems to fit what I'm after. Akrasia sounds like acting against your own better judgement, which isn't quite it — I'm not doing the opposite of what I judge best, I'm just not doing it yet. And hyperbolic discounting sounds like my preferences change as the thing gets closer, whereas the weird thing here is that my preference for running over not running feels completely stable; the plan keeps its shape while its start date keeps receding. Also, I know this is going to happen — I've watched me do it dozens of times — and I've actually paid for a year of classes up front to stop myself, which does work. So part of me thinks whatever this is must come apart into two things: the sliding, and the fact that I can predict the sliding perfectly and it doesn't stop the sliding.

  So: does this pattern have a name of its own, or is it just ordinary procrastination with a story attached? If there are established concepts nearby, I want to know which one fits best and exactly how my case differs from each of the others — especially from the ones my friend named, and from the ordinary-language one — and whether the predicting-and-precommitting part is a separate phenomenon or the same one. And if there genuinely isn't a term, coin one: give me a definition sharp enough that I could tell, for some borderline case, whether it applied or not. A bare label won't settle the argument, so I need the carving, not the name.
reasoning: |-
  Okay, let me tackle this user's problem. They're stuck in a loop where they keep postponing plans—like starting to run or making a team decision—without feeling like they've changed their mind. Each time, they reschedule with a reasonable excuse that would've worked earlier too. They mentioned akrasia and hyperbolic discounting, but those don't fit because their judgment stays consistent, and the preference doesn't shift as the event nears. 

  First, I need to pinpoint why existing terms don't apply. Akrasia involves acting against better judgment, but here the user isn't acting against their judgment; they're just delaying. Hyperbolic discounting is about changing preferences over time, but their valuation of the task remains stable. Procrastination seems close, but the user emphasizes that there's no active avoidance or decision to do something else—just a perpetual "tomorrow."

  The core issue is the unchanging commitment paired with a shifting timeline. The user even predicts the delay but can't stop it. Precommitment strategies (like paying for classes) work, suggesting the problem isn't motivation but a failure in temporal anchoring. 

  I recall "temporal displacement" from procrastination studies, where the delay is constant. But the key differentiator is the "sliding without revision"—the reasons given are retroactively applicable. The user's self-prediction adds another layer; they foresee the slide but can't prevent it internally. 

  So the best fit might be a specific subtype: **Sliding Window Procrastination**. Defining it would require three criteria: sustained commitment, delay with retroactively valid reasons, and predictability. This separates it from general procrastination by focusing on the unchanged intent and reusable excuses. 

  The precommitment part is a separate but linked solution. Recognizing the pattern as Sliding Window Procrastination could help the user and their girlfriend label the behavior objectively, reducing blame in arguments. By dissecting the components, the user gains tools to address the sliding mechanism directly, moving beyond vague accusations of laziness.
answer: |-
  Based on your detailed description, the core pattern you're experiencing **is a specific, identifiable subtype of procrastination**, but it deserves a sharper definition than the general term provides. Existing concepts like akrasia and hyperbolic discounting *almost* fit but miss key elements, as you rightly point out.

  Here's the conceptual carving you need:

  1.  **Core Pattern Name & Definition:**
      *   **Sliding Window Procrastination (or Temporal Displacement Procrastination)**
      *   **Definition:** The persistent deferral of an intended action or decision to a specific future point in time ("the window"), while maintaining an *unchanged* commitment to the action/decision, an *unchanged* valuation of its importance/benefit, and without substituting a conflicting preference. The rationale for each deferral, while seemingly reasonable in isolation, is retrospectively applicable to prior decision points and does not represent a genuine *revision* of the plan or its priority. The "window" (e.g., "tomorrow," "next sprint") slides forward predictably with each iteration.

  2.  **Why Existing Terms Don't Fully Fit & How This Differs:**
      *   **Ordinary Procrastination:** While this *is* procrastination, the ordinary term encompasses a wider range: active avoidance, choosing pleasurable alternatives, feeling overwhelmed, *revising* the perceived importance, or simply forgetting. **Your case is distinct** because:
          *   There's no *active choice* against the task (e.g., sofa *over* run).
          *   The valuation and commitment remain perfectly stable.
          *   The excuses are *reusable and retroactively valid*.
          *   The pattern is highly predictable and self-aware.
      *   **Akrasia (Weakness of Will):** Akrasia involves *acting* (or choosing inaction) *against* your own better judgment *in the moment*. **Your case differs** because:
          *   You are *not* acting against your judgment *at the deferral point*. When you say "I'll run tomorrow," you sincerely believe it *is* the best course *at that moment*, consistent with Sunday's judgment. The "akratic" moment, if any, is the *failure to act* on the *previous* day's "tomorrow," but even then, it's framed as moving the window, not rejecting the goal.
          *   The stable commitment and reusable rationale shield it from feeling like a *conflict* of judgment at each point.
      *   **Hyperbolic Discounting:** This involves a *change in preference* as a reward/punishment gets closer. A smaller, sooner reward becomes preferred over a larger, later one as the smaller one becomes imminent. **Your case differs** because:
          *   Your *preference* (running > not running) remains constant. You don't suddenly value the sofa *more* on Monday morning than you did on Sunday.
          *   The *cost/benefit analysis* of running itself doesn't shift – it's the *timing* that's perpetually displaced.
          *   The "discounting" isn't of the future reward of running, but of the *immediacy of the cost/effort required right now*, displaced onto a perpetually future "now."
      *   **Planning Fallacy / Optimism Bias:** While related, these focus on underestimating the time/resources needed for a *single* future task. **Your case differs** because it's about the *repeated, predictable deferral* of the *start*, not underestimating the duration of the activity *once started*. The optimism is about *future you's* ability/willingness to start, not the task's inherent demands.

  3.  **The Key Differentiators of Sliding Window Procrastination:**
      *   **1. Stable Commitment & Valuation:** The intention and perceived importance remain constant.
      *   **2. Absence of Conflicting Preference:** No alternative action is chosen *instead*; the plan itself is simply displaced.
      *   **3. Reusable, Retroactively Valid Rationale:** The excuse given today ("need a clear block of time") would have been accepted (and was probably considered) yesterday, and likely will be tomorrow. It doesn't represent new information or a changed circumstance that *truly* differentiates *this* moment from the *last* planned start point.
      *   **4. Predictable Pattern:** The individual recognizes the pattern in their own behavior (or the team's) and can often accurately predict the next deferral.

  4.  **The Prediction & Precommitment Element:**
      This is a *separate but crucial enabling factor* of Sliding Window Procrastination. It's **Meta-Cognitive Awareness without Executive Intervention**.
      *   You *know* the slide will happen (meta-cognition).
      *   This knowledge *doesn't* translate into the willpower or mechanism to *stop* the slide *at the moment of deferral* (failure of executive function/self-regulation in the specific context).
      *   **Precommitment (like paying for classes)** is an *external* mechanism designed to bypass the internal failure point. It changes the cost/benefit calculus *at the future decision point* (e.g., wasting money adds a new cost to not going). It leverages your predictive awareness *ahead of time* to impose constraints that the "future you" who is prone to sliding cannot easily override. It works *because* it attacks the specific mechanism of sliding.

  5.  **Sharp Definition for Borderline Cases:**
      **Sliding Window Procrastination applies if and only if:**
      > An agent (individual or group) repeatedly defers a specific, intended action or decision to a designated near-future point ("the window"), while simultaneously maintaining *all* of the following:
      >   a) **Unchanged Commitment:** Affirms the intention to perform the action/make the decision.
      >   b) **Unchanged Valuation:** Affirms the importance, benefit, or urgency of the action/decision remains equal to or greater than at the initial planning point.
      >   c) **Absence of Substitution:** Does *not* actively choose an alternative action conflicting with the intended one at the deferral point.
      >   d) **Retroactively Valid Rationale:** The stated reason for deferral *could plausibly have justified deferral from the immediately preceding planned start point*, and does not represent genuinely *new* information that fundamentally alters the priority calculus relative to that previous point.
      >   *(The predictability/precommitment element, while common, is not strictly necessary for the definition but is a frequent correlate.)*

  **Why this label/concept should settle the argument:**

  *   **It's Specific:** It captures the unique combination of stable intent, reusable excuses, and pure temporal displacement that distinguishes it from laziness, changing priorities, simple forgetfulness, or classic akrasia.
  *   **It's Objective:** It defines observable criteria (a-d above) that you and your girlfriend can point to in the moment. "Is my reason today *really* different from the reason I could have used yesterday? Am I saying running is less important? Am I choosing to watch TV *instead*?" If the answers are No/No/No, it's Sliding Window Procrastination.
  *   **It Removes Blame (Partially):** Framing it as a specific cognitive pattern ("This is the Sliding Window happening again") depersonalizes it. It's not "you're lazy" or "you don't really want it," it's "this specific mechanism we both recognize is kicking in." The *solution* (precommitment) also becomes a shared strategy ("How can we precommit against the Sliding Window?") rather than a personal failing.
  *   **It Explains the Prediction Paradox:** It explicitly incorporates the meta-awareness and separates it from the failure of internal control at the moment, explaining why knowing it will happen doesn't stop it *without* an external mechanism.

  By naming and defining **Sliding Window Procrastination** precisely, you shift the argument from "Why don't you just do it?" (which ignores the stable intent) or "You don't really want to" (which is disproven by the stable valuation) to "The sliding window mechanism is active; let's deploy a precommitment strategy." This moves the conversation forward constructively.
