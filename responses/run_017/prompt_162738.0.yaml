answer: |-
  **Bottom line: The practice presupposes a welfarist but procedurally constrained theory where individuals' *opportunity to obtain what they value* (measured through monetized choice proxies) defines benefit, irrespective of actual welfare gains, distribution, or coherent psychological foundations.**

  **Charitable Reconstruction of the Utility Theory:**  
  The core commitment is to *potential Pareto improvement* (Kaldor-Hicks efficiency): a regulation is justified if monetary gains *could* hypothetically compensate losers, making society "better off" in aggregate *if* transfers occurred (though they never do). Welfare is defined *operationally* by *individuals' monetized expressions of trade-off willingness*—whether revealed in labor markets (VSL) or deemed "rational" in surveys. This isn't about *experienced utility* (happiness, wellbeing) or objective goods, but about *respecting sovereignty* by aggregating what individuals *demonstrably value through choice-like behavior*. Linearity in risk? A tractable simplification treating probability as price-per-unit-risk. Ignoring income distribution? A necessity for aggregation under the revealed-preference fiction that dollars represent equal "voting power" over resources. Discounting future generations? Acknowledging that *current* resource allocation decisions should reflect *current* societal trade-offs (via the Ramsey formula). Throwing out scope-insensitive preferences? Upholding a *procedural standard* for what counts as a coherent "economic" preference fit for aggregation. The theory isn't psychological realism but a *decision calculus*: benefits are opportunities secured, valued by what people would exchange for them.

  **Essential vs. Contingent Features:**  
  - *Essential:* **Monetization** (a common unit is indispensable for aggregation); **Individualism** (benefits derive from individual valuations); **Aggregation** (summing gains/losses defines societal improvement); **Operationalism** (values must be *measurable* via behavior or sanctioned surveys).  
  - *Contingent:* **Revealed preference primacy** (stated preferences could suffice if "validated"); **Linearity assumptions** (non-linear risk weights could be incorporated if measurable); **Excluding non-market goods** (better methods could monetize pain/humiliation); **Ignoring distribution** (weighting by income is technically feasible).  
  The practice *could* run on a hedonic or capabilities view *if* those yielded monetizable metrics (e.g., dollars per unit happiness or per capability secured). However, it *requires* that welfare be reduced to a scalar (money) for aggregation. An objective-goods view clashes fundamentally unless goods are tradeable (e.g., dollars per life year), but risks paternalism by overriding expressed valuations.

  **Internal Inconsistencies:**  
  1. **Time vs. Cross-Section:** Discounting uses a cardinal, comparable intergenerational utility function (via the curvature parameter η), while cross-section analysis treats dollars as equal, denying cardinality and comparability *now*. This is incoherent: if utility is comparable over time, it should be comparable across persons.  
  2. **Preference Authenticity:** Survey use admits preferences needn't be *revealed*, yet scope tests impose *external rationality criteria* (sensitivity to quantity) inconsistent with behavioral findings. Why discount scope-insensitivity but accept probability non-linearity?  
  3. **Welfarist Aims vs. Procedural Execution:** The Ramsey formula's η explicitly models diminishing marginal utility of consumption, yet the refusal to weight benefits by recipients' income ignores this *within* generations. The proposed move to explicit welfare units (weighting dollars by income^η) *is* continuous with discounting logic—highlighting that current practice arbitrarily limits comparability to the time dimension.  

  **Consequences of Rival Theories:**  
  - **(i) Measurable Mental State (Hedonic):**  
    - **Changes:** VSL would vary by baseline happiness/poverty (poor gain more wellbeing from risk reduction); pain/suffering monetized via wellbeing scales; discounting rejected (future happiness not inherently less valuable).  
    - **Surprising Consequence:** *Regulations favoring the poor* (e.g., pollution controls in low-income areas) become easier to justify, even if monetary WTP is low. Rules reducing mild-but-common discomfort (e.g., noise) might outweigh some mortality reductions.  
  - **(ii) Objective Goods/Capabilities:**  
    - **Changes:** Non-market goods (biodiversity, dignity) monetized based on "inherent" value or cost to secure capabilities; VSL rejected for children/future gens (their "good" isn't choice-based); scope-insensitivity irrelevant (value isn't preference-dependent).  
    - **Surprising Consequence:** *Stricter regulations on irreversible harms* (e.g., species extinction) regardless of WTP; rules protecting unrepresented groups (e.g., embryos, AI?) might emerge; many current "benefits" (e.g., time savings) could be demoted if not tied to core capabilities.  

  **Is There No Theory of Utility?**  
  Yes, a defensible reading exists: BCA is a **political/administrative technology**, not a welfare metric.  
  - **Function:** Forces agencies to *quantify trade-offs* and expose implicit values (e.g., $11M/VSL), making decisions auditable and constraining regulatory overreach. Dollarization provides a *common language for comparison* when values clash.  
  - **What Dollarization Buys vs. Multi-Column Ledger:**  
    - **Coherence under Scarcity:** A single metric forces prioritization when budgets bind. A ledger with incommensurables (e.g., "lives saved + sacred sites preserved") cannot resolve conflicts without implicit weighting.  
    - **Accountability:** Dollars are fungible and comparable; a ledger invites cherry-picking favored outcomes.  
    - **Political Cover:** Anchoring to market-like valuations (VSL) lends legitimacy, masking ethical choices as technical ones.  
  The "theory" here is *procedural rationality*: a systematic method to structure debate, not discover welfare truth. Inconsistencies persist because the goal isn't philosophical purity but operable compromise within legal constraints (e.g., Executive Orders mandating monetization where possible).
