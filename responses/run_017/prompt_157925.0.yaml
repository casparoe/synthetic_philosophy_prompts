prompt: |-
  I had a stupidly long argument about this last night with my friend (she's half way through a philosophy PhD and will not drop anything) and I want to come out of it with something I can actually use at work.

  I'm the continuity editor on a shared-universe sci-fi franchise with branching timelines — the main show plus two spin-offs, and we get about thirty pitches a season for "what if" episodes and alt-timeline spin-offs. I get roughly twenty minutes per pitch to give a yes/no before it goes up to the showrunner, who has final say and who cares mostly about marketing. The writers are good at plot and useless at metaphysics, and they will not read a page on modal logic, so whatever you give me has to be runnable by someone who has never heard the words "de re" and has never heard of Lewis. There's also a fan wiki that will absolutely scream if we contradict ourselves, so the rule has to be one we can state in public and apply the same way twice.

  Our rule up to now has been: a character in a branch is the same character if and only if they share an origin scene — same parents, same birth, same inciting incident — and anything else has to be billed as a "variant," which marketing hates and which we use maybe three times a season. My friend says the whole rule is backwards: identity doesn't hold across worlds at all, and what we're actually doing every time is picking a counterpart relation that's context-relative, similarity-based, and not transitive, and that our origin test just smuggles in one answer to a question that has no fact of the matter and then breaks in predictable ways.

  So: write me a decision procedure my team can run on a pitch. The questions in order, what counts as a good enough answer to each one, where the procedure returns a hard no and stops, and where it has to stop and hand the call to a human because the question is really about what we want the story to mean rather than about what's true in the fiction. Make the counterpart-theory bit do real work — I specifically want the thing that falls out of taking counterparts seriously (that the relation is context-relative, that it isn't transitive, that a character can have two counterparts or none) to be built into the steps rather than being a paragraph of theory stapled to a checklist.

  Cases the procedure has to survive: a branch of a branch, so that a counterpart of a counterpart has to be handled; a character who dies before the branch point and is alive in the branch; a "what if" that changes the character's origin itself (the pitch is: what if she'd been adopted); a version of a character who is a plausible counterpart of two different main characters at once; an evil-twin episode where the twin is more similar to the hero than the hero's own branch-self is; and a character who exists in only one timeline and therefore has no original to be a variant of.

  Then run it on three pitches actually on the table right now: (1) a bottle episode in which the ship's doctor, who dies in episode four of the main show, is alive and practising in a branch, and which we want to advertise as "the doctor's story"; (2) a spin-off about the hero's son, conceived and born after the branch point in a timeline where the hero made a different choice, where marketing has already promised it's about "our hero's son"; (3) a crossover in which a minor character from show A appears in a branch of show B and, under any sane counterpart relation, reads as the counterpart of a major character from A — which would mean our already-announced tentpole crossover is technically a variant story.

  I need at least one of those to come out as "no, that's not the same character and you can't bill it as such" — ideally the crossover, because I'm the one who has to walk into the room and tell the showrunner, and I'd like to know in advance exactly which step kills it. And finish by telling me plainly what the procedure can't do: where it can't settle whether an audience will just accept a counterpart relation without being told about it, and whether "is it the same character" is even the right question for us to be asking instead of "is this story licensed by the canon."
reasoning: |-
  Okay, the user is a continuity editor for a sci-fi franchise with branching timelines. They need a practical decision procedure to determine if a character in a new pitch is the same as an existing one, without relying on complex philosophy. The current rule uses shared origin scenes, but it's causing issues. Their friend, a philosophy PhD, criticized it for not accounting for counterpart theory's context-relativity and non-transitivity.

  First, I need to unpack counterpart theory into actionable steps. Key points: context matters, similarity-based, not transitive. The procedure must handle cases like branch-of-a-branch, dead characters in branches, changed origins, multiple counterparts, evil twins, and characters in only one timeline.

  The user provided three test pitches: 
  1. Doctor alive in a branch despite dying early. 
  2. Hero's son born post-branch. 
  3. Minor character from Show A as a counterpart to a major character in Show B's branch. They need at least one to be a "no" for billing as the same character, preferably the crossover.

  For the decision procedure, each step should filter out non-viable cases. Start with origin checks but allow exceptions. Focus on narrative context and audience perception. Use terms like "story context" and "core attributes" instead of philosophical jargon. Include steps where human judgment is needed, especially when similarity is ambiguous or context shifts.

  Testing the pitches:
  1. Doctor's case: His origin is the same, death isn't part of origin. The story context is medical, so core attributes match. Should be billable as the same.
  2. Hero's son: Born post-branch, no shared origin. But as a descendant, marketing's claim relies on the hero's identity. The hero's counterpart status is clear, so the son can be billed as "our hero's son" without calling him the same character.
  3. Crossover: Minor character from A as a counterpart to A's major character in B's branch. Different origin, and the story context (Show B) might not highlight the similarities. Core attributes don't align well, leading to confusion. This should be a "no" for billing as the same character, ideally flagging it at the context or attribute mismatch steps.

  The procedure won't handle cases where audience perception is unpredictable or where the story's thematic intent overrides logical consistency. Also, it might not resolve if "same character" is the right question versus canon licensing.
answer: |-
  Here's a battle-tested decision procedure for your team, built on counterpart theory foundations but stripped of jargon. It focuses on **audience perception** and **narrative function** within the specific story context ("context-relative"), using similarity as the core driver ("similarity-based"), and explicitly handles non-transitivity. Each question must be answered with a simple "Yes," "No," or "Unclear" based solely on the *pitch itself* and established *on-screen canon*.

  **The Decision Procedure: "The Narrative Similarity Test"**

  1.  **Define the Story Context:** *What specific story are we telling in* this *pitch? What questions does this story ask? (e.g., "What if the Doctor survived?", "What's the son of our hero like?", "What happens when Character X faces Crisis Y?")*
      *   **Good Enough Answer:** A clear, simple 1-2 sentence summary of the *central conflict or premise* of the pitch. *Stop if unclear.*
      *   **Human Handoff:** If the pitch's central premise is vague or shifts focus mid-description.

  2.  **Identify the Anchor Character:** *Which established character from existing canon (Main Show, Spin-offs) is this pitch asking the audience to see this new version* as? *(e.g., For the Doctor pitch, the Anchor is the Main Show Doctor. For the Son pitch, the Anchor is the Main Show Hero.)*
      *   **Good Enough Answer:** Naming a single, unambiguous character from existing on-screen canon.
      *   **Hard Stop (No):** If no Anchor Character is specified *or* the Anchor Character doesn't exist in established canon (e.g., "a brand new character never seen before" cannot be an Anchor).
      *   **Human Handoff:** If the pitch explicitly tries to make the new character serve as an Anchor for *two* different established characters simultaneously (e.g., "This character is both a counterpart to Hero A *and* Villain B").

  3.  **Core Attribute Check:** *Considering* only *the Story Context (Step 1), do the new character's* most defining traits *as described in the pitch (personality, core motivations, key relationships, signature abilities/appearance)* **significantly resemble** *the Anchor Character's* core traits *at their most iconic/memorable (as established in their* origin *or key defining moments on-screen)?*
      *   **Good Enough Answer:** Focus on 2-3 *essential, defining* traits relevant to the Story Context. (e.g., For the Doctor: "Brilliant, compassionate, dedicated healer?" For the Hero: "Driven by duty, protective, skilled fighter?")
      *   **Hard Stop (No):** If the pitch explicitly describes core traits that are direct *opposites* of the Anchor's defining traits *and* these opposites are central to the story. (e.g., Pitch describes the new version as "ruthlessly selfish" while the Anchor is defined by "self-sacrifice" *and* the story hinges on this selfishness).
      *   **Human Handoff:** If the similarity is weak, ambiguous, or relies heavily on backstory elements *not* established on-screen or core to the Anchor's iconic portrayal. *This is the main "similarity-based" filter.*

  4.  **Origin & Key Event Check:** *Does the pitch explicitly state or strongly imply that this new character shares the exact same* **origin scene** *(birth, creation, inciting incident) as the Anchor Character?*
      *   **Good Enough Answer:** "Yes" if pitch directly references the Anchor's established origin as identical. "No" if it describes a different origin (e.g., adopted, different parents, different creation event). "Unclear" if origin isn't mentioned or is vague.
      *   **NOT a Hard Stop:** This is *informative*, not decisive. A "Yes" strongly leans towards "Same". A "No" *does not* automatically mean "Variant"; proceed.

  5.  **Divergence Point Check:** *Is the difference between the new character and the Anchor Character explained* solely *by changes happening* after *the Anchor Character's established origin?*
      *   **Good Enough Answer:** "Yes" if the pitch attributes differences to events post-origin. "No" if differences require changes *before* or *during* the origin event itself. "Unclear" if the cause isn't specified.
      *   **Hard Stop (No):** If the change *requires* altering the Anchor's established origin event itself *and* Step 3 (Core Attributes) also shows significant dissimilarity *relevant to the Story Context*. (e.g., "What if she was adopted?" changes origin; if she also acts *fundamentally different* in ways tied to that adoption *and* the story relies on that difference, likely "Variant").
      *   **Human Handoff:** If the change requires altering the origin *but* Step 3 shows strong core similarity relevant to the story (e.g., "Adopted, but still has the same fierce independence and moral compass as the Anchor").

  6.  **Counterpart Status Verdict:**
      *   If **Step 3 (Core Attributes) = YES** AND **Step 4 (Origin) = YES** → **"Same Character"** (Safe to bill as the Anchor).
      *   If **Step 3 (Core Attributes) = YES** AND **Step 4 (Origin) = NO** BUT **Step 5 (Divergence Point) = YES** → **"Same Character"** (Branch timeline version of the Anchor).
      *   If **Step 3 (Core Attributes) = YES** AND **Step 4 (Origin) = NO** AND **Step 5 (Divergence Point) = NO** → **HUMAN HANDOFF** (Deep origin change but core similarity - depends on *how* core the changed origin is vs. similarity).
      *   If **Step 3 (Core Attributes) = NO** AND **Step 4 (Origin) = YES** → **HUMAN HANDOFF** (Shared origin but fundamentally different core person? Very rare, likely "Variant" but needs scrutiny - e.g., severe brainwashing *after* origin).
      *   If **Step 3 (Core Attributes) = NO** AND **Step 4 (Origin) = NO** → **"Variant"** (Not the same character. Bill as "a Variant of [Anchor]" or new character).
      *   **"Unclear" in any Step 3/4/5 → HUMAN HANDOFF.**

  **Why This Embeds Counterpart Theory:**

  *   **Context-Relative (Step 1):** The "core attributes" that matter are defined by *this specific story's* needs, not an absolute list. A character might be a counterpart in a story about leadership but not in a story about family trauma.
  *   **Similarity-Based (Step 3):** This is the *core driver*. Origin is just supporting evidence. Similarity is judged based on what's relevant to the pitch's story.
  *   **Non-Transitive (Built-in):** Steps 3-5 are applied *only* between the new character and the *direct Anchor* identified in Step 2. We never chain comparisons (e.g., A is counterpart to B, B is counterpart to C, therefore A is counterpart to C? Not assessed. Each link is evaluated independently based on *its own* story context).
  *   **Allows Multiple/No Counterparts (Steps 2 & 6):** Step 2 identifies *one* Anchor per pitch. A character could be a counterpart to Anchors in *different* pitches/stories (multiple counterparts). A character existing in only one timeline has *no* counterpart in *other* timelines by definition (though they are the "original" in their own). Step 6 handles cases where there might be no good counterpart ("Variant").

  **Surviving the Test Cases:**

  *   **Branch of a Branch:** Evaluated ONLY relative to its *direct* Anchor (the character in the *first* branch). No chaining.
  *   **Died Before Branch Point:** If Step 5 = NO (divergence point is *before* death, so death is unchanged), but Step 3 = YES? Human Handoff (Similar core person but origin unchanged? Likely "Same Character" billed cautiously). If Step 5 = YES (divergence point *prevents* death)? Step 3 YES + Step 5 YES = Same Character.
  *   **"What if Origin Changed" (Adoption):** Step 4 = NO. Step 5 likely = NO (change *is* the origin). Outcome depends 100% on Step 3. Strong core similarity = Human Handoff (needs writer/showrunner intent). Weak core similarity = Variant.
  *   **Plausible Counterpart of Two Anchors:** Step 2 requires naming *one* Anchor per pitch. Human Handoff flagged at Step 2. *The pitch must choose one primary Anchor for the story being told.*
  *   **Evil Twin More Similar:** Step 3 applied to the *Story Context*. If the story is about the Hero facing their "better self", the Twin might score YES on Step 3 vs. the Hero! But Step 4 = NO (different origin/creation). Outcome: Step 3 YES + Step 4 NO + Step 5 YES? Same Character? *Human Handoff* - this highlights context relativity. The *story* might want them billed as "Hero Variant" or "Dark Reflection," not "The Hero". Needs intent.
  *   **Character in Only One Timeline:** By Step 2, they can be an Anchor. They have no counterpart elsewhere. Not applicable as a "new version" elsewhere unless created.

  **Running the Current Pitches:**

  1.  **Bottle Episode: Doctor Alive in Branch (Died in E4 Main Show)**
      *   Step 1: Story Context = "What if the Doctor survived? How would they handle this medical crisis?"
      *   Step 2: Anchor Character = Main Show Doctor.
      *   Step 3: Core Attributes = Presumably YES (Brilliant, compassionate healer).
      *   Step 4: Origin = YES (Same birth/origin story).
      *   Step 5: Divergence Point = YES (Branch point *after* origin, *prevents* E4 death).
      *   **Verdict:** Step 3 YES + Step 4 YES = **SAME CHARACTER.** Billable as "The Doctor".
      *   *Why:* Core similarity strong, origin shared, divergence explains the change (survival). Non-transitivity handled: We don't care if *this* branch's Doctor is a counterpart to someone else; only similarity to the *original* Anchor matters.

  2.  **Spin-off: Hero's Son (Conceived Post-Branch Point)**
      *   Step 1: Story Context = "What is the life and legacy of the son of the Hero (from a different choice)?" Focus on the son.
      *   Step 2: Anchor Character = **The Main Show Hero.** (This is key - Marketing says "Our Hero's Son", so the Anchor is the *Hero*, not the son).
      *   Step 3: Core Attributes = **N/A.** The pitch is about the *son*, not a version of the Hero himself. The son is a *different person*. We are not assessing if the son is similar to the Hero (though he might be), we are assessing if the *Hero in this branch* is the counterpart to the original Hero, to justify "Our Hero's Son".
          *   *Sub-Question for Hero:* Is the Hero in this branch the same as the original Hero?
              *   Step 1 (for Hero): Story Context = Implied: "The Hero lived a different life, leading to this son."
              *   Step 2 (for Hero): Anchor = Main Show Hero.
              *   Step 3 (for Hero): Core Attributes = YES (Presumably same core traits).
              *   Step 4 (for Hero): Origin = YES.
              *   Step 5 (for Hero): Divergence Point = YES (Branch point *before* conception, explains different life/son).
              *   **Sub-Verdict on Hero:** Step 3 YES + Step 4 YES = **SAME CHARACTER (as Anchor).**
      *   **Overall Verdict:** The **Hero** in this branch is the Same Character as the Main Show Hero. Therefore, marketing can accurately say it's about **"Our Hero's Son"** *without* claiming the *son* is the same character as anyone. The son is a new character, son of the (counterpart) Hero. **Not a Variant case.**
      *   *Why:* Context focused on the son, but the *Anchor* for the "same character" question regarding the parentage claim is the Hero. Counterpart relation holds for the Hero.

  3.  **Crossover: Minor Char from Show A in Show B's Branch as Counterpart to Major Char from Show A**
      *   Step 1: Story Context = The pitch premise involves this character from A appearing in B's branch. Likely "How does [Minor Char A] navigate this crisis in Show B's world?"
      *   Step 2: Anchor Character = **Major Character from Show A.** (The pitch wants us to see the Minor Char *as* this Major Char).
      *   Step 3: Core Attributes = **LIKELY NO / UNCLEAR.** This is the killer. Minor characters rarely have the *depth* of core defining traits established that a Major character does. Does the pitch *establish* that Minor Char A *now* embodies the Major Char's core traits (e.g., charisma, strategic genius, specific flaw)? Probably not convincingly. They might share superficial traits (species, job) but lack the *defining, iconic* depth. Pitch relies on actor/fan assumption, not narrative build.
      *   Step 4: Origin = **NO.** Minor Char A and Major Char A have different established origins.
      *   Step 5: Divergence Point = **N/A.** Not applicable as it's not explaining a change *from* Major Char A.
      *   **Verdict:** Step 3 (Core Attributes) = **NO** + Step 4 (Origin) = **NO** → **"VARIANT"**. This is **NOT** the Major Character from Show A. It is, at best, a Variant of that character, or simply Minor Char A displaced. **You cannot bill this as the Major Character appearing in the crossover.**
      *   *Where it Kills It:* **Step 3 (Core Attribute Check).** The pitch fails to establish that this minor character, in this context, possesses the core defining attributes of the Major Character strongly enough *for this story* to overcome the lack of shared origin. Counterpart relation is not sufficiently supported by similarity *in the narrative context described*. The fan wiki would scream "They're nothing alike!".

  **What the Procedure CAN'T Do:**

  1.  **Predict Audience Perception with 100% Accuracy:** It flags logic based on the pitch, but if writers execute poorly (e.g., a "Same Character" verdict character acts wildly OOC), the audience will reject it regardless. It can't account for bad writing.
  2.  **Settle Ambiguous "Similarity" Without Human Input:** Steps 3 and 5 frequently push to Human Handoff because judging "significant resemblance" of "core attributes" is inherently subjective and context-dependent. The procedure forces the *question* to be asked explicitly based on the story need.
  3.  **Answer "Is This Story Licensed By Canon?":** This procedure *only* answers "Can we bill *this specific character* as *that specific character*?". A pitch might have a "Variant" character but still be a fantastic, canon-compliant story. Conversely, a "Same Character" verdict doesn't mean the *plot* is good or fits the universe rules. Canon licensing is a separate check.
  4.  **Replace Showrunner Judgment on Marketing/Theme:** If Marketing *demands* "It's the Doctor!" for the branch episode, the procedure supports you. If Showrunner *wants* the adopted pitch to be "Same Character" despite origin change and potential attribute drift (Human Handoff), they can override based on thematic intent. The procedure gives you the logical basis to push back or support, not the final marketing decision.
  5.  **Define "Core Attributes" Absolutely:** The list is fluid and defined per Story Context (Step 1). This is the *point* (context-relativity), but it requires your team to understand the characters deeply.

  **The Real Question:** Your friend is partly right. "Is it the same character?" is often the *wrong* question for the writers. The better questions are: **"Does this story require the audience to feel they are seeing a version of [Anchor Character]?"** and **"Is this story's use of the character concept compelling and consistent enough with the established universe to be licensed by canon?"** The procedure forces the first question into concrete steps based on similarity and context, giving you a tool to argue logically against pitches that misuse characters or create continuity headaches, while allowing flexibility where narrative intent justifies it. Use it to kill the crossover billing. Good luck!
