prompt: |-
  I'm putting together a special issue on historical objectivity and I've got two contributors who've been sniping at each other in footnotes for years, so I want to make them do an adversarial collaboration instead. Draft the joint statement they could both sign. One is a reconstructionist in the Rankean line: the historian's job is to recover the past as it actually was, and the archive is what disciplines you into doing that. The other is a narrativist in the Carr/White line: facts only become historical facts by being selected and emplotted, and the plot structure — tragedy, comedy, farce, whatever — is brought to the evidence rather than read off it.

  They've agreed to argue over one fixed hypothetical, the sealed archive case: for a single event there is a closed body of documents, both sides grant every document is genuine and agree about what each one says, and no further evidence will ever arrive — yet they still produce accounts with incompatible causal structure and emphasis. I want them to say what is still in dispute in that case, and whether whatever remains is a factual dispute at all.

  Then give me (a) a numbered section of claims both can sign — about what the archive does and doesn't constrain, about whether a narrative carries counterfactual commitments that evidence could in principle check, and about what "objectivity" would have to mean for either side to care about having it; and (b) a table of the residual disagreements, each row worded the way its own side would accept for its own view, not the way the other side would caricature it.

  For the cruxes I'd guess at least these two: whether emplotment carries counterfactual content the archive can adjudicate, and whether slow convergence among historians with very different politics is evidence of a mind-independent past or only of a shared professional genre. For each crux, name one test, case, or argument both would accept as bearing on it, and write down in advance what each side predicts it will show. If you think part of the dispute is purely verbal — especially around "objectivity," and around whether the narrativist is making a claim about truth or about something else — say which part and why. Don't give me footnotes, bibliographies or reading lists; just the document.
reasoning: |-
  We are drafting a joint statement for two historians with opposing views on historical objectivity. The first is a Rankean reconstructionist who believes the historian's job is to recover the past "as it actually was," with the archive as the disciplining force. The second is a narrativist in the Carr/White tradition, who holds that historical facts are selected and emplotted, with narrative structures (like tragedy or comedy) brought to the evidence rather than derived from it.

  They have agreed to argue over the hypothetical "sealed archive" case: a single event with a closed set of documents, all genuine and agreed upon in content, with no new evidence ever to be added. Yet, they still produce accounts with incompatible causal structures and emphasis. The joint statement must include:

  (a) A numbered section of claims both can sign, covering:
     - What the archive does and doesn't constrain.
     - Whether a narrative carries counterfactual commitments that evidence could check.
     - What "objectivity" would have to mean for either side to care about it.

  (b) A table of residual disagreements, each row worded from the perspective of the side holding the view (not caricatured by the other).

  Additionally, for the cruxes (at least two):
  1. Whether emplotment carries counterfactual content the archive can adjudicate.
  2. Whether slow convergence among historians with different politics is evidence of a mind-independent past or only of a shared professional genre.

  For each crux, provide:
     - One test, case, or argument both would accept as bearing on it.
     - What each side predicts it will show.

  Also, identify any purely verbal disputes, especially around "objectivity" and whether the narrativist is making a claim about truth or about something else.

  ---

  **Joint Statement on Historical Objectivity in the Sealed Archive Case**

  We, the undersigned, a reconstructionist and a narrativist, have long held differing views on the nature of historical knowledge. We agree, however, to engage in an adversarial collaboration to clarify our points of agreement and disagreement in the context of a hypothetical "sealed archive" case. In this scenario, for a single historical event, we have a fixed and closed body of documentary evidence. We agree on the authenticity and content of every document and accept that no new evidence will ever emerge. Despite this, we acknowledge that we would produce historical accounts with incompatible causal structures and emphases. This joint statement outlines what we agree on and where we continue to differ.

  **(a) Agreed Claims (Numbered Section):**

  1. **The Archive Constrains but Does Not Determine Interpretation:** 
     The archive provides the empirical basis for any historical account. It constrains interpretations by ruling out claims that are directly contradicted by the documents. However, the archive does not, by itself, determine a single, unambiguous narrative or causal structure. Multiple interpretations may be consistent with the same set of documents.

  2. **Narrative Emplotment and Counterfactual Content:**
     A narrative structure (e.g., tragedy, comedy) does carry implicit counterfactual claims (e.g., "if X had not happened, the outcome would have been different"). However, in the sealed archive case, these counterfactuals cannot be directly tested against new evidence. The archive can only adjudicate counterfactuals to the extent that they rely on documented patterns of causation or explicit contemporary testimony about possibilities. In the absence of such evidence, counterfactual claims remain speculative and are not empirically resolvable by the archive alone.

  3. **The Meaning of Objectivity:**
     For both of us, "objectivity" must mean something worth striving for. For the reconstructionist, objectivity is the faithful representation of the past as it actually occurred, constrained by the archive. For the narrativist, objectivity is the intersubjective reliability of historical accounts, achieved through rigorous methods of selection and emplotment that are transparent and open to critique. Both sides care about objectivity as a guard against arbitrary or politically motivated distortion. We agree that even in the sealed archive case, objectivity requires that interpretations must be grounded in the available evidence and that any departure from the evidence (e.g., ignoring documents or misrepresenting their content) is unacceptable.

  **(b) Table of Residual Disagreements:**

  | Viewpoint | Statement of Residual Disagreement |
  |-----------|------------------------------------|
  | **Reconstructionist (Rankean):** | In the sealed archive case, the persistent incompatibility of causal structures and emphasis between accounts is a result of incomplete or imperfect interpretation. The archive, if fully and correctly interpreted, would converge on a single causal structure. The goal remains to recover "what actually happened," and the convergence of interpretations over time (even among historians with different politics) is evidence that we are approaching the mind-independent past. |
  | **Narrativist (Carr/White):** | In the sealed archive case, the incompatibility of causal structures and emphasis is inherent to the historical enterprise. Narrative structures are not discovered in the archive but are imposed by the historian. Therefore, convergence among historians reflects the dominance of a particular narrative genre or the resolution of rhetorical disputes, not the discovery of a mind-independent past. The archive does not contain a single "plot" to be uncovered. |

  **Cruxes and Tests:**

  1. **Crux: Does emplotment carry counterfactual content that the archive can adjudicate?**
     - **Test/Case/Argument:** Examine a historical event where multiple narratives have been proposed (e.g., the French Revolution as tragedy vs. farce) and where the archive contains explicit contemporary discussions of alternative possibilities, fears, or expectations. For instance, consider if the archive includes documents showing that historical actors themselves debated potential outcomes (e.g., Robespierre's speeches on the risk of tyranny). This provides evidence that can test the counterfactuals implied by a tragic emplotment (e.g., "if the Terror had been avoided, the Republic could have been saved").
     - **Reconstructionist Prediction:** The reconstructionist predicts that such evidence (e.g., contemporary fears and hopes) can be used to adjudicate between competing narratives. For example, if the archive shows that key actors foresaw and tried to avoid the tragic outcome, then a tragic emplotment is not merely imposed but reflects the actual historical dynamics. Convergence on this point would occur as the evidence is fully weighed.
     - **Narrativist Prediction:** The narrativist predicts that even with such evidence, the selection and weighting of these documents, and the decision to frame them in a tragic structure, remains a choice. The archive may show that actors considered alternatives, but it does not dictate that the historian must view the event as tragic. Different historians might still reasonably choose different plots (e.g., farce) by emphasizing different aspects.

  2. **Crux: Is slow convergence among historians evidence of a mind-independent past or a shared professional genre?**
     - **Test/Case/Argument:** Study a historical controversy that has seen significant convergence over time (e.g., the origins of World War I). Analyze the role of new evidence versus changing narrative conventions in this convergence. Specifically, compare accounts from different eras (e.g., pre- and post-Fischer controversy) and see if convergence occurred primarily because of the discovery of new documents or because of shifts in historiographical fashion, political context, or narrative norms.
     - **Reconstructionist Prediction:** The reconstructionist predicts that convergence is driven by the accumulation and better interpretation of evidence, leading closer to the truth. For example, the Fischer controversy was resolved by archival discoveries that shifted consensus toward German responsibility, showing the power of the archive to correct narratives.
     - **Narrativist Prediction:** The narrativist predicts that convergence is driven by the emergence of a dominant narrative genre (e.g., the "tragedy of great power miscalculation") and professional consensus, not just evidence. Even with new documents, the narrative framing adapts to incorporate them without necessarily getting closer to a single "true" story.

  **Purely Verbal Disputes:**

  We identify two areas where disputes may be partly verbal:

  1. **The Term "Objectivity":** 
     - The reconstructionist uses "objectivity" to mean correspondence with the past as it actually happened. The narrativist uses it to mean intersubjective agreement and methodological rigor. This is a verbal dispute because both value a form of constraint by evidence and both reject willful distortion. The dispute is not about whether history should be evidence-based but about whether the evidence can uniquely determine the account.

  2. **Narrativism and Truth:**
     - The reconstructionist often accuses the narrativist of denying that historical accounts can be true. The narrativist, however, argues that they are making a claim about the nature of historical representation: that it is always mediated by narrative forms, not that it is arbitrary or false. This is not a denial of truth but an assertion that truth in history is narrative-dependent. Thus, the dispute is partly about what constitutes a "true" historical account.

