    The cost of our fudging: we avoided the problem by abstraction. But Benacerraf's point is that if we take mathematical objects to be sets (and hence allow set-theoretic questions), then we have a problem. So by abstracting, we are changing the rules: we are saying that the set-theoretic questions are irrelevant. That might be a good response, but it is a change.

  - **No counterpart**: The causal constraint in (1) has no direct counterpart. We tried to map it to "values that can be constructed by the program", but that is about computability, not causality. In PL, we don't require that a value be causally connected to the program; we can have abstract values that are never constructed, as long as the operations on them are defined. The causal constraint is a metaphysical constraint that doesn't appear in PL. 

    Alternatively, we might map it to the idea that the only values a program can use are those that are in the domain of the operational semantics (i.e., the program can actually compute with them). But again, this is not about causality but about effective computability.

  ### Step 3: Handling Wrinkles

  **Wrinkle A**: Nonstandard models.

  - In first-order arithmetic, there are multiple non-isomorphic models (the standard one and nonstandard ones with infinite elements). In second-order arithmetic (with full semantics), the axioms pin down the standard model up to isomorphism.

  - Translation:
    - The specification (interface) for natural numbers can be given in first-order logic or second-order logic.
    - In first-order logic, the spec does not enforce representation independence up to isomorphism: there are non-isomorphic implementations (models). So even if we abstract over the implementation, there are multiple non-equivalent implementations that satisfy the same first-order spec but differ on properties that we care about (like "every element is either zero or a successor" and the absence of infinite elements).
    - In second-order logic (with full semantics), the spec pins down the implementation up to isomorphism. So any two implementations are isomorphic.

  - Which horn does this bite? The two set-theoretic encodings (Zermelo and von Neumann) are isomorphic. So they are representationally equivalent up to isomorphism. The nonstandard models, however, are not isomorphic. So the problem is more severe: not only are there multiple implementations, but some of them are not even observationally equivalent (if we could observe the entire type). 

  - The "no fact of the matter" conclusion is stronger in the nonstandard case: even if we fix the abstract type, there are multiple non-isomorphic models. But note that the nonstandard models are not computable (in the sense that we cannot build them in a computer), but that might not help because the argument is about reference in general.

  - In PL, we might use a stronger specification (like a categorical one in second-order logic) to rule out nonstandard models. But if we are stuck with first-order, then we have a problem: the abstract type does not uniquely determine the behavior for all possible observations (if we allow observations that quantify over the entire type, which we can't do operationally in finite time).

  **Wrinkle B**: Implementations that agree on all observable inputs but differ on unobservable ones.

  - This is the case of two implementations of an abstract type that are observationally equivalent for all finite inputs (because we can only run finitely many tests) but differ on some input that is too large to ever be tested.

  - In the philosophy, this is similar to the problem of underdetermination: we cannot know which implementation is the "real" one because they agree on all observations.

  - In Benacerraf's original argument, the two set encodings differ on properties that we can express (like `1 ∈ 3`) and that are in principle decidable (if we had access to the set-theoretic representation). But in the PL abstract type, we hide that. However, if we consider an abstract type that allows for operations that might reveal the difference (like if the abstract type included a membership test for some reason) then we would have a problem. But in the natural numbers abstract type, we don't have such an operation.

  - The argument needs the differences to be in the language. In Benacerraf, the language of set theory allows asking `1 ∈ 3`. So if we take the natural numbers to be sets, then we must answer such questions. The difference is visible in the language. But in the PL abstract type, we don't allow such questions. So the argument relies on the language being rich enough to express the implementation details.

  - However, in the wrinkle B scenario, the differences are on inputs that are not observable (because they are too large). So even if the abstract type had an operation that could reveal the difference (say, a function `f : Nat -> Bool` that returns true only for a particular nonstandard number), we could never run it for that input. So the two implementations are observationally equivalent.

  - The indeterminacy in step (4) for the original argument is like "two implementations that provably differ on some reachable input" (like `1 ∈ 3` is a small input). But for wrinkle B, it's about unobservable differences. The original argument is stronger because the difference is observable (in principle). The wrinkle B scenario is more subtle: even if we accept that the abstract type doesn't include operations that reveal the representation, if there were such an operation and the implementations differed only on unreachable inputs, then we would have a different kind of underdetermination. But note that in the original Benacerraf, the set-theoretic language does have the membership operation, so the inputs (like `1` and `3`) are small and reachable.

  ### Final Thoughts

  - What doesn't survive translation? The causal constraint (1) doesn't have a direct counterpart and seems to be a metaphysical concern that PL does not share. Also, the demand for a unique referent is relaxed in PL by abstraction: we don't care about the representation as long as the behavior is correct.

  - Blind spot or less work? The philosophical argument might be doing less work once we have the concept of abstract types. The worry about multiple implementations is a standard engineering problem solved by representation independence. However, the nonstandard models issue (wrinkle A) shows that sometimes the specification is not strong enough to rule out unwanted implementations. That is a real issue in PL (e.g., when specifying data types). The causal constraint might be a blind spot: in PL, we don't worry about how we "contact" the value, we just specify how to compute with it.

  - What to add to the mental model? To state the problem, you might need to add the idea of a "language of discourse" that is not abstracted. In PL, we control the interface and hide the implementation. But in the philosophy of mathematics, if we take the language of set theory as fundamental, then we cannot hide the implementation of natural numbers as sets because set theory allows us to ask set-membership questions about them. So the problem arises when the language of discourse is richer than the abstract type. You might also need to consider the idea of "reference" as a direct relationship to a specific object (without abstraction) and the metaphysical constraint that such reference requires causal contact.

  ### Translation Summary

  Restated argument:

  1. **Plausibility constraint**: A program can only refer to values that it can compute or that are provided as inputs (i.e., values that can be causally interacted with via the operations of the language).
  2. **Semantic constraint**: The denotation of a numeral (like `2`) must be an element in a model (implementation) that satisfies the specification of arithmetic (so that arithmetic sentences are true as expected).
  3. **Two implementations**: There are two set-theoretic implementations (Zermelo and von Neumann) that both satisfy the arithmetic specification but assign different set-theoretic properties to the same natural number (e.g., in von Neumann, `1 ∈ 3` is true, but in Zermelo, it is false). Since both are valid implementations, there is no fact about which one is the real denotation of `2`.
  4. **Conclusion**: Therefore, the reference of numerals is indeterminate, and mathematical truth (the truth of arithmetic sentences) does not depend on the specific referents.

  Residue report:

