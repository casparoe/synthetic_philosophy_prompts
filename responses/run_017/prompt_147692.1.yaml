  - Fudging:
    - We took reference as the denotation in a denotational semantics. The cost is that we then have multiple acceptable denotational models. We resolved this by abstraction, which avoids the non-uniqueness by not committing to a representation. But if we are forced to choose a representation (as in set theory), then we have a problem.
    - Truth: We took it as satisfaction in a model (denotational). This is appropriate for the argument. The cost is that we then have multiple models, but note that for arithmetic truths, they are the same. The problem is for extra-arithmetic truths.

  - No counterpart: The causal constraint. We mapped it to computable values, but that is not about causality. This constraint is foreign to PL and seems to be a metaphysical add-on.

  Wrinkle A:

  - First-order arithmetic: The spec has multiple non-isomorphic models (standard and nonstandard). Translation: the abstract type does not enforce that all implementations are isomorphic. The non-isomorphism is a stronger form of indeterminacy than in the two set encodings (which are isomorphic). This bites the horn of the semantic constraint: even if we fix the truth of all arithmetic sentences (in the first-order language), we still have non-isomorphic models, so the referent of numerals is even more indeterminate (they could be standard numbers or nonstandard ones). Second-order arithmetic (with full semantics) pins down the model up to isomorphism, so the two set encodings (which are isomorphic) are both acceptable and the non-isomorphic ones are ruled out.

  - This makes the "no fact of the matter" conclusion stronger for first-order arithmetic than for the two-encodings case (which are at least isomorphic) and weaker for second-order (where we have uniqueness up to isomorphism).

  Wrinkle B:

