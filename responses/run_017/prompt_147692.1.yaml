answer: |-
  ### Faithful Restatement in PL Vocabulary

  **Benacerraf's Dilemma Translated:**  
  1. **Plausibility Constraint (Reference):** A term (e.g., the numeral `2`) can only refer to a value if that value is *observationally accessible*—i.e., the program (or agent) must be able to compute, construct, or interact with it via the language's operational primitives (e.g., pattern matching, recursion). This mirrors causal contact: values must be "reachable" through execution traces.  
  2. **Semantic Constraint (Truth):** The denotation of `2` must satisfy the *specification* of the abstract type `Nat` (e.g., Peano axioms) such that arithmetic operations (e.g., `2 + 2 = 4`) hold under the denotational semantics (i.e., the model satisfies the theory). Truth is defined by satisfaction in a model.  
  3. **Multiple Implementations:** Two implementations of `Nat` exist—e.g., `ZermeloNat` (each number `n` is a nested singleton, `succ(n) = {n}`) and `VonNeumannNat` (each `n` is `{0, 1, ..., n-1}`). Both satisfy the specification (Peano axioms) and are representationally independent (isomorphic via `toZermelo`/`toVonNeumann`). But they diverge on properties outside the interface, e.g., `is_member(1, 3)` returns `true` in `VonNeumannNat` but `false` in `ZermeloNat`.  
  4. **Conclusion:** Since both implementations are observationally equivalent for arithmetic but disagree on non-interface queries, there's no fact about which value `2` *actually* denotes. Mathematical truth (e.g., `2 + 2 = 4`) floats free of reference to a concrete value.  

  ---

  ### Residue Report  
  **1. Step (3) as Interface vs. Implementation:**  
  Your suspicion is **partially right but underspecified**. Step (3) maps cleanly to two implementations (`ZermeloNat`, `VonNeumannNat`) of an abstract type `Nat` (spec: Peano axioms). Under representation independence, the implementations are isomorphic, so arithmetic truths are preserved. The worry **evaporates for interface-confined queries** (e.g., `add(2, 2)`).  
  **What’s missed:** Benacerraf’s dilemma assumes a *richer language* (e.g., set theory) where non-interface properties (e.g., set membership) are expressible. If your abstract type `Nat` lacks `is_member`, the difference is irrelevant—but if the language *allows* it (e.g., via a module escape hatch or reflective access), the implementations are no longer interchangeable. The "no fact" conclusion **relies on this richer context**, making representation independence insufficient alone.  

  **2. Fudging Choices and Costs:**  
  - **Reference:** Mapped to **denotational semantics** (a semantic function `⟦·⟧ : Term → Value`). This assumes a fixed model, but Benacerraf shows multiple models exist. *Cost:* Denotational semantics typically assumes a chosen model, but here no canonical model exists.  
  - **Truth:** Treated as **satisfaction in a model** (denotational view). This aligns with checking the spec (e.g., `⟦2 + 2⟧ = ⟦4⟧`). *Cost:* Operational truth (e.g., `eval(plus(two, two))` reduces to `four`) is ignored, but Benacerraf’s truth conditions require model-theoretic satisfaction.  
  - **Fudge Penalty:** By using denotational semantics, we inherit its problem: **no privileged model**. Representation independence avoids this, but only if the interface is sealed.  

  **3. No Counterpart: Causal Constraint (1)**  
  The causal constraint **has no direct analog** in your toolkit. We approximated it with "observational accessibility" (values must be constructible/runnable), but PL doesn’t care about *causal contact*—only computability. For example:  
  - A PL type can include uncomputable values (e.g., `Real` in Coq), but (1) rejects reference to acausal entities.  
  - **Weak mapping attempt:** "Values must be in the image of the operational semantics" (i.e., a program can compute them). But this is about *feasibility*, not causality. The residue is a **metaphysical commitment** absent in PL.  

  ---

  ### Handling Wrinkles  
  **A. Nonstandard Models vs. Second-Order Specificity**  
  - **First-Order Arithmetic (e.g., PA):** The spec is a **weak interface**—it admits non-isomorphic models (e.g., standard naturals and nonstandard models with "infinite" numbers). This is like having multiple implementations where `is_zero` or `is_succ` behave unexpectedly on unobservable inputs.  
    - *Horn bitten:* Semantic constraint (2). Truth is preserved in all models, but reference is indeterminate *even up to isomorphism*.  
    - *Effect:* Makes "no fact" **stronger**—the dilemma isn’t just about two good implementations, but infinitely many (non-isomorphic ones).  
  - **Second-Order Arithmetic:** The spec is a **strong interface** (categorical up to iso). Like using a dependent type or proof irrelevance to enforce a singleton type. Nonstandard models vanish.  
    - *Horn bitten:* Reference plausibility (1). We still have multiple set-theoretic implementations (Zermelo/von Neumann), but they’re isomorphic—so indeterminacy is benign under representation independence.  

  **B. Observable vs. Unobservable Differences**  
  - **Original Dilemma (Step 3):** Like two implementations that **provably differ on reachable inputs** (e.g., `is_member(1, 3)` is computable and diverges). PL handles this: test the difference, pick one, or abstract further.  
  - **Wrinkle B (Agree on observable, diverge on unreachable):** E.g., two `Nat` implementations where `is_prime(n)` diverges for `n > 10^100` but matches elsewhere. Here, **operational equivalence** holds for all runnable inputs, but denotationally they differ.  
    - *Philosophy:* This is **epistemic indeterminacy** (we can’t know which is "real"), but Benacerraf needs **ontic indeterminacy** (no fact *at all*). His argument requires reachable differences (like `is_member(1, 3)`) to justify ontic indeterminacy.  
    - *Reading Needed:* The original argument uses **reachable differences** (membership in small numbers) to get ontic "no fact." Wrinkle B doesn’t strengthen the argument—it’s a separate underdetermination problem.  

  ---

  ### What Doesn’t Survive Translation  
  - **Blind Spot:** The **causal constraint (1)** has no PL analog. PL abstracts away how values are "contacted"—only behavior matters. This exposes the dilemma’s reliance on metaphysics.  
  - **Argument’s Weakness:** The core worry (step 3) **collapses under representation independence** for arithmetic. But it resurfaces if:  
    - The language exposes implementation details (e.g., set theory).  
    - The spec is under-constrained (first-order case).  
    The real work is in **forcing non-interface queries**, not the multiple implementations itself.  

  **One-Paragraph Upgrade for Your Mental Model:**  
  To state the problem, add: **A fixed, unabstracted language of discourse** (e.g., set theory) that allows queries outside the interface (like `∈`), and a **metaphysical demand** that reference requires causal contact with values. Without these, the dilemma reduces to standard representation independence—but with them, implementation details become semantically loaded, breaking abstraction.
