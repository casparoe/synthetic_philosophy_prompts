  - What to add to your mental model: The idea that the language of discourse might be fixed (like set theory) and not allow abstraction over the representation. Then, even if we are only interested in arithmetic, the set-theoretic language forces us to ask and answer questions about set membership. Also, the causal constraint might be seen as a constraint on what can be in the domain of the semantics (only causally accessible things) which would rule out sets. But in PL, we don't have that constraint.

