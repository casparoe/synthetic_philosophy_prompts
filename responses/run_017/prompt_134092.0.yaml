prompt: |-
  I am a junior and the student member of the four-person committee that runs our state's History Day fair — two history teachers, our librarian, and me — and I have been asked to draft the memo we will vote on at Thursday's meeting. I would rather not hand in something that just applies the word pseudohistory and stops, so I am asking for help with the reasoning as much as the bottom line.

  The case: a senior in my school has submitted an individual exhibit titled Mothers of Stone. Her claim is that the recurrence of large stone building traditions in Egypt, Mesoamerica, coastal Peru, and island Southeast Asia is best explained by contact with a single earlier seafaring civilization, and that archaeologists attribute it to independent invention mainly because of textbook inertia, grant incentives, and reluctance to credit outsiders. One panel of her board lays out the conventional dating; she argues that the dating itself presupposes what she is questioning. Her faculty sponsor has signed off, she has four pages of source notes, and nearly all of them are books and websites that already agree with her. She is a friend, and she has told me privately that if we suppress her project it will just confirm her thesis about who gets to decide what counts as knowledge.

  Our rules say an entry must present a historical argument supported by evidence and must show how sources were used. They say nothing about whether the argument has to be true, or about what to do when a student's sources are all on one side of the question. Last year we disqualified a project for fabricated quotations, and the wording of that decision is now being cited as precedent for disqualifying anything we believe to be false.

  What I need is a memo the committee can act on: a single clear recommendation — accept as submitted, accept on stated conditions with a deadline, move the exhibit out of the judged history category into exhibition-only, or disqualify — followed by a general rule of two or three sentences that we could apply next year to an Atlantis entry, to an ancient-astronauts entry, and also to a project whose conclusion is unorthodox but genuinely argued.

  The things I want the memo to work through, because they are what we have actually been arguing about:

  1. Whether the fair can judge conclusions at all without turning ourselves into an enforcement arm for current expert consensus. My own view is that we should be judging method, not verdicts, but I cannot say exactly which features of method we are judging.
  2. The immunity structure I have noticed in her draft, and I want it described in a way I can defend to her face: she never says what would count as evidence against her; missing evidence gets treated as supporting evidence; she demands far more certainty from a conventional date than from her own; and her view seems to require that a large number of specialists be not merely mistaken but effectively complicit. I would like these turned into a test the committee can actually apply rather than an impression.
  3. The precedent that worries me most. Amateurs in the nineteenth century dug up places that most scholars had classified as legend, so any rule keyed to contradicting present consensus would have silenced a real discovery. She will make this argument on Thursday and I do not have a good answer to it.
  4. The opposite worry: a fair lends the school its name, judges' scores get read as endorsement, and middle schoolers walk through the exhibit hall. Is saying the point is the process, not the verdict, an answer to that, or a way of avoiding the question?
  5. The option everyone has floated and nobody has defended: requiring her to reframe the exhibit as a second-order historical question — why lost-civilization theories have been so attractive, and what work they did for the people who believed them — which her material would mostly fit. Is that a fair condition with a deadline attached, or is it us declining to engage the claim she actually wants to make? If the memo recommends it, I need the exact language of the condition, because she will ask whether we would have rewritten the question of a project we liked.
  6. Whether allowing hers commits us, in consistency, to allowing projects whose conclusions we find sympathetic but whose evidence is just as thin, and if not, what the difference is supposed to be.

  Please also give me a short paragraph of what the committee should say to her out loud after the vote, and one sentence for next year's handbook. Aim for roughly eight hundred words, written to be read aloud to a room of teachers and a seventeen-year-old: no term of art I would have to look up, or if you need one, explain it in a sentence. I am less interested in a verdict than in a document that treats her position seriously and that we could still stand behind if her exhibit turns out to be right.
reasoning: |-
  Okay, the user is a junior student on a committee for a History Day fair. They need help drafting a memo for a controversial project about ancient civilizations. The project claims that multiple stone-building traditions stem from a single seafaring civilization, challenging mainstream archaeology. The student faces several dilemmas: judging the project fairly without endorsing pseudohistory, addressing methodological flaws, and setting a precedent for future entries.

  First, I need to understand the key issues. The student wants a memo that provides a clear recommendation and a general rule for future cases. They also need to address specific points like judging conclusions vs. method, the project's immunity to counter-evidence, historical precedents of correct heterodox theories, the fair's reputation, reframing the topic, and consistency in judging.

  The user's explicit needs are a memo with a recommendation, a rule, and talking points. But deeper, they want to balance academic integrity with fairness, avoid silencing unconventional ideas while maintaining standards, and protect the fair's credibility. They also need to preserve their friendship and the student's enthusiasm for history.

  Looking at the points to address: 
  1. Judging method over conclusions makes sense. The committee should evaluate how the argument is built, not the conclusion itself. But how to define "method" clearly? Criteria like source evaluation, engagement with counter-evidence, and logical coherence could work.

  2. The immunity structure is a red flag. The project dismisses missing evidence as proof of suppression and holds mainstream theories to higher standards. Turning this into a testable criterion means requiring projects to address counterarguments and state what evidence could falsify their claims.

  3. The historical precedent of correct heterodox theories is tricky. The key difference might be that past successes engaged with existing evidence and methodologies, even when challenging consensus. The rule should allow unconventional ideas but require rigorous methodology.

  4. The fair's reputation is a valid concern. Emphasizing that evaluation is based on process, not endorsement of content, can help. Including a disclaimer in the exhibit hall might mitigate misunderstandings.

  5. Reframing to a second-order question is an option. However, it might feel like sidelining the student's original intent. If recommended, the condition should be framed as a way to deepen the analysis while still engaging her core interest in lost civilizations.

  6. Consistency is crucial. The rule must be applicable regardless of the conclusion's popularity. Focusing on methodological rigor ensures that both orthodox and unorthodox projects are held to the same standards.

  For the recommendation, accepting with conditions seems most balanced. Requiring the student to address counter-evidence and define falsifiability within a deadline allows her to improve the project's rigor without suppressing her argument. This approach treats her seriously while upholding scholarly standards.

  The general rule should emphasize methodology: engagement with diverse sources, addressing counterarguments, and clearly stating evidentiary standards. This avoids judging conclusions and applies uniformly.

  The post-vote statement should acknowledge her effort and explain the conditions constructively, focusing on strengthening her argument. For the handbook, a sentence highlighting rigorous methodology over specific conclusions would set a clear precedent.

  Ensuring the language is accessible is vital, avoiding jargon. The memo needs to respect the student's perspective, encourage critical thinking, and maintain the fair's integrity, even if her theory is later proven right. Balancing these elements will create a fair and defensible outcome.
answer: |-
  ## Committee Memo: Recommendation & Policy for Project Review  
  **To:** History Day Fair Committee  
  **From:** [Your Name], Student Member  
  **Date:** [Thursday's Date]  
  **Subject:** Recommendation & Policy Guidance for Project "Mothers of Stone"  

  ### I. Recommendation  
  **Accept the project "Mothers of Stone" with the following conditions, due by [Deadline: e.g., 10 days before judging]:**  
  1. The student must add one panel addressing counterevidence to her central claim (e.g., genetic/linguistic evidence against transoceanic contact, divergent engineering techniques).  
  2. She must explicitly state what evidence could challenge her thesis (e.g., "If carbon dating showed Peruvian and Egyptian pyramids were built 3,000 years apart, that would weaken my argument").  
  3. The faculty sponsor must confirm these additions meet scholarly standards.  
  **Failure to meet these conditions moves the exhibit to exhibition-only status.**  

  ### II. Proposed General Rule for Future Fairs  
  *"Entries must demonstrate engagement with evidence beyond sources that exclusively support their thesis. Projects must:  
  (a) Address significant counterevidence or competing explanations;  
  (b) Define what evidence could challenge their claims;  
  (c) Avoid arguments relying on systemic scholarly misconduct without extraordinary documentation.  
  Judges will evaluate rigor of method, not agreement with consensus conclusions."*  

  ---

  ### Reasoning: Addressing Committee Concerns  
  **1. Judging Conclusions vs. Method**  
  We cannot judge historical truth—experts debate this daily. But we **can** judge whether a student grapples with evidence like a historian. Did they test their idea against facts that might disprove it? Did they weigh alternatives? "Mothers of Stone" currently does not. Our role is teaching how arguments are built, not which ones are "right."  

  **2. The "Immunity Structure" Test**  
  Her draft treats absence of evidence *for* mainstream views as evidence *against* them (e.g., "No one has proven contact was impossible"). She also implies specialists ignore truth for careerism without proof. **Our testable standard:**  
  - Does the project engage concrete counterevidence? (Currently: No)  
  - Does it state what could falsify its claim? (Currently: No)  
  - Does it allege fraud without overwhelming documentation? (Here: Yes, weakly).  
  These are flaws in *method*, not conclusions.  

  **3. The Precedent of Correct Outsiders**  
  Nineteenth-century amateurs succeeded by **engaging evidence** skeptics demanded (e.g., Schliemann documented Troy meticulously). Our rule allows heterodox claims if they meet methodological standards—like addressing counterevidence. This project, as submitted, does not. The difference isn’t consensus; it’s whether the argument withstands scrutiny.  

  **4. Fair Credibility & Young Audiences**  
  Saying "we judge process" isn’t evasion—it’s our educational mission. We add:  
  - A disclaimer in the exhibit hall: "Judges assess research skill, not historical validity."  
  - Training judges to ask, "How did you test your hypothesis?"  
  This teaches critical thinking better than banning unpopular views.  

  **5. Reframing as a Second-Order Question**  
  Requiring this would be unfair. Her core question ("Was there one mother civilization?") is historical. Forcing her to ask instead ("Why do people *believe* in mother civilizations?") shifts the goalposts. We wouldn’t require a project on FDR’s New Deal to become "Why did people support FDR?" **Conditional acceptance lets her argue her thesis—rigorously.**  

  **6. Consistency with Sympathetic Projects**  
  A project arguing an unorthodox but carefully tested claim (e.g., "New evidence suggests Vikings reached Florida") should pass if it:  
  - Engages counterevidence (e.g., disputed radiocarbon dates);  
  - Defines falsifiable criteria;  
  - Doesn’t allege conspiracies.  
  "Truth" isn’t the standard; **methodological integrity is.** Our rule applies equally to popular/unpopular views.  

  ---

  ### Post-Vote Statement to the Student  
  *"Your project asks bold questions that deserve serious engagement. The committee’s conditions ensure your argument meets the highest standards of historical inquiry: by confronting counterevidence and clarifying how your thesis could be tested. This strengthens your work and shows judges how rigorously you’ve thought. We look forward to seeing your revised exhibit."*  

  ### Handbook Sentence for 2025  
  *"Entries will be evaluated on the rigor of their historical methodology, including engagement with diverse sources and counterevidence, clarity about evidentiary standards, and logical coherence—not agreement with established interpretations."*  

  ---

  ### Why This Works  
  - **Balances intellectual freedom with scholarly standards.** She argues her thesis but must address weaknesses.  
  - **Focuses on teachable skills:** Evidence-testing is core to history.  
  - **Precedent-proof:** The rule applies equally to Atlantis or a revisionist WWII project.  
  - **Honors her effort** while upholding fairness: Conditions are concrete, not subjective.  
  - **Protects the fair:** Clear methodology standards prevent "endorsement" concerns.  

  This approach ensures we judge *how* she thinks, not *what* she thinks—and leaves room for history to surprise us all.  

  ---  
  **Vote:** [ ] Accept as Submitted [ ] Accept with Conditions [ ] Exhibition-Only [ ] Disqualify  
  *Recommendation: Accept with Conditions*
