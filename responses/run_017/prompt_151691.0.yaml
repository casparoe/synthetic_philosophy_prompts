prompt: |-
  I clerk for the Franchise Commission of the Free City of Mirenne, a semi-autonomous port city where roughly one resident in six is not a citizen, and I have been going back and forth with a colleague about how the Commission should rule on a petition that is coming up next month. To make sense of it I need to reconstruct what rule the Commission has actually been running, because its record so far is consistent with several, and they come apart on this petition.

  The record, as I have it: in 2011 the Commission lowered the municipal voting age to sixteen, reasoning that sixteen-year-olds may work, pay local taxes, hold a tenancy with a guardian's countersignature, and are answerable under city by-laws; it declined at the same time to lower the age for national elections, and in 2020 it refused a petition for a voting age of fourteen on the ground that below sixteen political judgment is not yet formed independently of household and school. In 2016 it granted the municipal vote to non-citizens with at least five years of lawful residence and an indefinitely renewable permit, while refusing it to seasonal, employer-tied and short-term permit holders and to anyone short of five years' residence even where they paid local taxes and had children in city schools; it has never extended any franchise beyond municipal elections to non-citizens. On prisoners it has held that those on remand and those serving under two years keep the vote, while longer sentences suspend it, on the view that a serious and sustained breach of the terms on which the community admits someone to a share in its decisions can cost them that share. And in 2019 it recommended compulsory attendance at the polls for citizens aged eighteen to seventy-five — not compulsory choice: the ballot carries an explicit none-of-these-candidates line and blank or spoiled papers are recorded as abstentions — exempting residents over seventy-five, adults under plenary guardianship, and citizens who have lived abroad more than fifteen years and keep no property or pension in the city. When it enfranchised sixteen- and seventeen-year-olds it declined to compel them; when it enfranchised non-citizens it explicitly left the compulsion question open as not properly before it.

  The new petition asks the Commission to make attendance compulsory for the non-citizen municipal electorate created in 2016, on the same terms as for citizens: same administrative fine, same abstain option, same exemptions by age and capacity. The figures attached to the petition are these: turnout among that electorate was 74 per cent at the last municipal election, against 79 per cent for citizens overall and 61 per cent for citizens aged eighteen to twenty-nine; about half of them have been entitled to naturalize for years and have not applied, while most of the remainder cannot naturalize at all, since their state of origin forbids renunciation and Mirenne does not permit dual nationality. What I want from you is the following: set out the two or three rules that could jointly generate all four lines of precedent — some kind of two-tier view on which rights may reach beyond citizenship while the duties of membership may not, some kind of compulsion-follows-enfranchisement view with carve-outs for age and capacity, some kind of representativeness view keyed to turnout levels, or another you prefer — and say what each predicts about this petition and about the decliners-versus-ineligible split inside it; give your best guess with the reasons for preferring it; identify the closest analog among the Commission's own precedents; and if you think the record genuinely underdetermines the matter, name the further case that would settle it (I had been wondering whether the revealing one is a later petition to compel sixteen- and seventeen-year-olds now that their turnout has slid, but tell me if you think that case is unhelpfully ambiguous, and why), and say which principle the Commission would be committing itself to either way. Please keep it fairly tight and finish with a single machine-readable line: \answer{extend compulsion} or \answer{do not extend compulsion}.
reasoning: |-
  Hmm, the user is a clerk for the Franchise Commission in Mirenne, and they're trying to figure out how to rule on a petition about compulsory voting for non-citizens. They've provided a detailed history of the Commission's decisions: lowering voting age to 16 but not for national elections, enfranchising some non-citizens with conditions, prisoner voting rules, and compulsory voting for citizens with exemptions.

  I need to identify the underlying principles from these precedents. First, there seems to be a distinction between rights and duties. Non-citizens get voting rights but not duties like compulsory voting, while citizens have both. The 2019 compulsory voting rule explicitly excludes non-citizens, and the Commission left it open when they were enfranchised.

  Second, there's a focus on community membership and integration. The five-year residence requirement for non-citizens shows they need to be sufficiently integrated. The prisoner rule ties voting rights to adherence to community norms. The refusal to lower voting age to 14 was based on lack of independent judgment.

  Third, capacity and maturity matter. Sixteen-year-olds were enfranchised but not compelled, suggesting age-based exemptions. Compulsory voting has age and capacity exemptions.

  The petition wants to extend compulsory voting to non-citizens. Turnout is 74% for them, which is between the overall citizen turnout (79%) and young citizens (61%). Some can't naturalize due to dual nationality issues.

  Under the rights/duties separation principle, compulsion shouldn't extend to non-citizens. The community membership principle is ambiguous—high turnout suggests integration, but the Commission might see compulsion as a duty of full membership. The capacity principle doesn't directly apply since non-citizens are adults.

  The precedents lean toward not extending compulsion. The Commission explicitly separated non-citizen rights from duties in 2016 and 2019. The young voter analogy is weak because they're citizens; compelling them would be different.

  The best guess is to not extend compulsion, as the Commission has consistently treated duties as tied to citizenship. The closest precedent is the initial exclusion of non-citizens from the 2019 compulsory voting rule.

  To resolve ambiguity, a petition to compel 16-17-year-old citizens would be telling. If compelled, it shows duties apply to all citizens regardless of age; if not, it reinforces that capacity exemptions are key. Either way, the Commission would clarify whether duties strictly follow enfranchisement or require full membership status.
answer: |-
  Based on the Commission's precedents, three coherent principles emerge, each generating the entire record but yielding different predictions for the petition:

  1.  **Rights/Duties Separation Principle:** Franchise rights (voting access) can extend beyond citizenship based on stakeholding (taxes, residence, integration), but civic *duties* (like compulsory attendance) are reserved for citizens as core obligations of membership. Non-citizens participate as a *right*, not under compulsion.
      *   *Prediction:* **Do not extend compulsion.** The decliners/ineligible split is irrelevant; the principle excludes all non-citizens from civic duties.
      *   *Closest Analog:* The 2019 compulsory attendance order explicitly applying only to citizens and exempting non-citizen residents, coupled with the 2016 enfranchisement leaving compulsion "open" as not properly before them (implying separation).

  2.  **Enfranchisement-Implies-Compulsion Principle (with Capacity Carve-outs):** Granting the franchise generally implies an obligation to participate, *unless* specific exemptions apply based on diminished capacity or status (youth, advanced age, incapacity, non-integrated status like short-term residents/prisoners). Compulsion follows the franchise.
      *   *Prediction:* **Extend compulsion** to non-citizens meeting the residency threshold. They were deemed integrated enough for the franchise (5+ years, indefinite permit) and are adults without cited capacity issues. The decliners/ineligible split is irrelevant; the franchise triggers the duty.
      *   *Closest Analog:* The 2019 order applying compulsion broadly to enfranchised citizens aged 18-75, carving out specific exemptions (age >75, guardianship, long-term non-residents). Non-citizens meeting the 2016 criteria are analogous to enfranchised citizens.

  3.  **Representative Turnout Threshold Principle:** Compulsion is a tool to ensure a minimally representative electorate, applied only when a group's voluntary turnout falls significantly below the citizen average, indicating inadequate participation.
      *   *Prediction:* **Do not extend compulsion.** Non-citizen turnout (74%) is close to the overall citizen average (79%) and higher than young citizens (61%). It doesn't indicate a participation deficit requiring compulsion. The decliners/ineligible split is irrelevant; the aggregate turnout is sufficient.
      *   *Closest Analog:* The refusal to lower the voting age to 14 cited lack of independent political judgment (a form of non-representative capacity), implying turnout adequacy matters. The high non-citizen turnout negates the need for intervention.

  **Best Guess:** **Do not extend compulsion.** The strongest precedent is the explicit separation in the 2019 order: compulsion was defined as a duty of *citizenship*, applied to citizens while explicitly exempting non-citizen residents meeting similar age/capacity criteria. The Commission consistently ties *duties* (compulsion, loss of vote via serious breach) to citizenship and *core membership*, while extending *rights* (voting access) based on stakeholding and integration. Granting non-citizens the vote was an expansion of rights based on integration (5+ years), but the 2019 decision reaffirmed compulsion as a distinct duty of membership. The decliners/ineligible split reinforces that non-citizen status, not individual choice about naturalization, is the key factor; they remain non-members regarding duties regardless of *why* they aren't citizens.

  **Closest Analog:** The **2019 compulsory attendance order** itself is the clearest analog. It defines the compulsion regime explicitly for citizens, carving out specific exemptions, and notably *does not* include the enfranchised non-citizens created in 2016, despite their meeting some exemption-like criteria (residence, capacity). This separation is deliberate.

  **Resolving Ambiguity & The Proposed Test Case:** The record *is* underdetermined between Principle 1 (Rights/Duties Separation) and Principle 2 (Enfranchisement-Implies-Compulsion). The proposed test case – **a petition to compel sixteen- and seventeen-year-old citizens** – **is revealing and less ambiguous than it seems**:
  *   If the Commission **compels them**, it strongly supports Principle 2 (Enfranchisement-Implies-Compulsion). They are enfranchised citizens; compulsion would follow unless a new capacity exemption is created specifically for them.
  *   If the Commission **refuses to compel them**, it strongly supports Principle 1 (Rights/Duties Separation) *or* a specific age/capacity carve-out within Principle 2. Crucially, refusing compulsion *for enfranchised citizens* based on age would imply that enfranchisement alone isn't sufficient for compulsion; some additional "full membership duty" status (like being 18+) or capacity judgment is required. This would align with treating non-citizens similarly (enfranchised but not compelled due to non-membership status). The reasoning would be key, but refusal would undermine a pure Principle 2 reading.
  *   *Commitment:* Granting compulsion commits to Principle 2. Denying compulsion commits to either Principle 1 or the idea that age <18 constitutes a specific exemption from the civic duty of compulsion even for citizens, reinforcing that compulsion isn't automatic with enfranchisement.

  \answer{do not extend compulsion}
