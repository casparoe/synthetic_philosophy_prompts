answer: |-
  ## The Stone Counts for Nothing

  The air in the Receiving Chamber hung thick with the ghosts of dust and indecision. Archivist Tira Vale traced a finger over the cracked leather cover of the latest Spoil delivery – tax receipts from the Southern Reaches, circa Founding +142. Routine. Mundane. Utterly useless for the question gnawing at the foundations of Veridia: *Did it happen?*

  The Vulgate was unchanging, beautiful, recited annually in the Grand Plaza. It told of the Three Siblings – Valerius the Wise, Lyra the Swift, and Magnus the Strong – leading the desperate Exodus across the Salt Flats, discovering the hidden valley, and forging the Covenant with the River Spirit that ensured Veridia’s bounty. Ritual comfort, civic glue. Tira knew its cadences by heart.

  The Spoil was chaos. Unfiltered, unsorted, contradictory. A king-list scratched on a potsherd contradicted the Vulgate’s lineage. A fragmentary ballad sung of Magnus’s betrayal, not his strength. A boundary marker near the old quarries bore glyphs older than the Exodus story itself. The Archive’s sacred rules were clear: only Spoil details *independent* of the Vulgate could corroborate it. And the Embarrassment Heuristic: flattery suspect, shame plausible.

  But someone had been gardening the Spoil. For decades, maybe centuries. Planting seeds of corroboration – a conveniently discovered "eyewitness" scroll fragment praising Valerius’s foresight, miraculously preserved in a salt marsh. Or weeding out dissonance – gaps in the record where uncomfortable local tales *should* have been. The documents themselves often passed material authentication. The sin was against the *principle* of independence. The foundation was sand.

  Tira owed her verdict to the Foundational Review Committee – a mix of anxious priests, pragmatic senators, and wealthy patrons. Their question was brutally simple: "Based on the Spoil, as per Archive Law, can the founding event described in the Vulgate be considered historically established? Yes or No." Funding for the entire Archive hinged on her answer. More than funding, Veridia’s self-belief.

  Benat, her junior colleague, a true believer in the system, burst in, eyes wide. "Tira! The dig at the Old North Wall… they found it!"

  "Found what, Benat?" Tira’s voice was flat. Exhaustion was a constant companion.

  "The stone! The *Covenant Stone*! Or… a piece of it."

  Her pulse, against her will, quickened. The Vulgate described the Covenant Stone, carved by Magnus himself, marking the pact with the River Spirit. Its survival was legendary, its location lost.

  In the Conservation Lab, the fragment rested on acid-free paper. Rough basalt, weathered by centuries. One edge showed a deliberate, clean break. On the surface, deeply incised, was part of a familiar glyph: the bottom curve and stem of the River Spirit’s sigil from the Vulgate illustrations. Below it, clear despite the wear, was a numeral: **|||** – three vertical marks.

  "It matches the Vulgate description exactly!" Benat breathed. "Material, style, the sigil… and the three marks! The Three Siblings! It’s corroboration, Tira. *Physical* corroboration."

  Tira bent low, her magnifying glass hovering. The sigil *was* a match for the stylized version in the Vulgate scrolls. Too perfect a match? The numeral was crude, functional. A tally. Or… a count.

  "The break," she murmured. "It’s clean. Recent?"

  The head conservator shook his head. "Weathering on the fracture surface suggests centuries, Archivist Vale. It was broken long ago. Found embedded in the wall’s core fill."

  "So," Benat pressed, "the sigil is embarrassing? Showing the Spirit’s mark? That leans towards genuine under the Heuristic. And it’s *here*, physical proof of the Covenant!"

  Tira felt the weight of the Committee’s expectation, the city’s need for bedrock truth. This stone could save the Archive. It ticked boxes: physical artifact, matches Vulgate detail, potentially embarrassing (acknowledging a power beyond the Founders). But the gardening… Had someone planted this centuries ago? Was the perfect sigil match *because* it was copied from the Vulgate later, not contemporary? The independence was poisoned.

  She needed air, perspective. She retreated to the cacophony of the Spoil Stacks, Level 7: Agricultural Records. Dust motes danced in shafts of pale light. Here, truth was buried not in grand pronouncements, but in the mundane arithmetic of survival. She pulled a ledger at random, Founding +87. Grain tallies from the Western Granaries.

  Her eyes scanned columns of numbers, names of factors, notations of mold or weevil damage. Routine. Then a sub-tally caught her eye. It wasn't the totals, but a marginal note, scrawled in a different hand than the main ledger-keeper:

  > *"Received from Factor Mellus: 30 sacks barley, sound. Held back 5 sacks per standing levy. For the Stone Count."*

  *Stone Count.* The phrase meant nothing in any Vulgate commentary or standard administrative glossary she knew. She flipped pages. Found another, a decade earlier:

  > *"Paid laborers: 2 days cleaning the Approach. Stone Count duty."*

  And another, fifty years later:

  > *"Repairs to the tally shed at the North Marker. Stone Count tally-master requisitioned new stylus."*

  Not one grand record. Scattered, mundane mentions across decades, even centuries. Never explained. Always incidental. A tax? A duty? A ritual? "Stone Count." It resonated with the numeral on the fragment. **|||**. Three.

  The Vulgate mentioned no "Stone Count." It was a tiny, persistent footnote in the city’s administrative hum, completely independent of the founding epic. An ongoing practice, perhaps ritual, perhaps bureaucratic, revolving around a stone… and a count.

  The implications clicked, cold and sharp:

  1.  **The Specific Gap:** Finding a stone with a sigil and the numeral three *could* corroborate the Vulgate’s Covenant Stone, vaguely. But these ledgers showed "Stone Count" as a persistent, local reality, completely separate from the epic. Did the stone cause the count, or the count cause the stone? Confirming "a significant stone existed" did nothing to confirm it was *the* Covenant Stone of the Vulgate. Yet that’s exactly how Benat, the Committee, the city would spend that confirmation – as validating the entire myth (Point 1: Vague confirmation vs. Specific claim).
  2.  **The Heuristic Knot:** The numeral **|||** on the fragment. Was it flattering (marking the Three Heroes)? Or was it potentially shameful? What if the "Stone Count" was a levy, a tax extracted by some local power *using* the stone? The ledgers showed grain held back, labor demanded. That leaned towards the embarrassing, the plausible. But what if that tax, that shameful practice, was precisely *why* the stone (or a replica claiming its authority) was preserved and venerated by those collecting it? The flattery (preserving the symbol of power) and the shame (the burden it represented) were intertwined, impossible to separate on the artifact alone. A forger *could* add a numeral hoping it looked like an embarrassing tax record, just as a genuine marker of oppression could be polished into a symbol of unity (Point 2: Flattery vs. Shame contradiction).
  3.  **The Absence & The Model:** Where were the *main* Stone Count records? The levy rolls, the ritual instructions? They were absent. Benat would argue this absence meant nothing; records perish. Tira knew better. The *persistence* of the incidental mentions – the marginalia, the repair orders – suggested the Stone Count was significant and ongoing. Therefore, the absence of its *core* records was itself evidence. Evidence of *what*? It depended entirely on your model. Did they perish naturally? Or were they systematically purged? Purged *by whom*? Early archivists cleaning up the record to fit the emerging Vulgate? Later ones trying to hide an embarrassing local cult or tax? The absence only spoke because of the model of *what should have survived*. Benat’s model assumed natural decay. Tira’s model, shaped by the evidence of Spoil curation, screamed deliberate suppression. They weren’t fighting about the past; they were fighting about which model of record survival and human intervention was true (Point 3: Absence relative to model).

  The stone fragment was real. Ancient. It had a mark and a number. But its meaning was a mirror reflecting the anxieties and manipulations of every era that touched it. The ledgers didn’t tell her *what* happened at the founding. They told her the founding story was a battleground, its artifacts contested terrain. The "Stone Count" was history – persistent, documented in the Spoil’s raw gristle. The Covenant Stone of the Vulgate was… legend. Shaped, curated, possibly planted, its independent verification irrevocably compromised.

  She couldn’t prove forgery. She couldn’t prove the stone *wasn't* the Vulgate's stone. But the Archive’s rules demanded independence. The ledgers proved the Stone Count existed independently. They *also* proved the context around *any* stone with that numeral was murky, potentially shameful, and almost certainly manipulated over time. The Spoil, curated, could no longer bear the weight of corroboration. The system was broken.

  The Committee chamber was opulent silence. Priests in blue robes, senators in crimson sashes, merchant patrons in rich wool. Their faces were a mosaic of expectation, anxiety, and impatience.

  "Archivist Vale," the High Priest intoned. "Your verdict. Did the founding, as recorded in the Vulgate, occur? Based solely on the Spoil, per our laws. Yes or No."

  Tira stood straight. She saw Benat’s hopeful eyes. She saw the ledgers in her mind’s eye, the mundane, unshaped truth of the Stone Count levy. She saw the broken fragment, a symbol weaponized by time.

  "The Archive Law," she began, her voice clear but hollow in the vast room, "demands that corroboration from the Spoil must be independent. We have established the Spoil has been subject to curation – planting and suppression – for an indeterminate period. This violates the principle of independence. Artifacts like the recovered stone fragment *may* be genuine, but their provenance as *independent* verification is irredeemably compromised. The Spoil, as it stands, curated across generations, cannot fulfill its legal function as an independent check on the Vulgate."

  She took a breath, the weight of the city pressing down. "Therefore, based on the Spoil *as we have received it*, and bound by the rules of verification this institution is sworn to uphold… the answer is **No**. The founding, *as specifically told in the Vulgate*, cannot be historically established by the available Spoil."

  A gasp rippled through the chamber, sharp as tearing cloth. Benat looked stricken. The High Priest’s face went pale. A merchant slammed a fist on the table. "You condemn the Archive with your own mouth, woman!"

  "The rules are clear, Senator Gorven," Tira replied, her voice gaining steel. "We either uphold them, or we admit the Archive is a theater. I will not authenticate legend using corrupted evidence."

  The consequences were swift, brutal. The Committee dissolved the Foundational Review, declaring the Vulgate "beyond such verification." Funding for the Archive was slashed, redirected to "public recitation initiatives" and the Grand Plaza’s renovation. Benat resigned, leaving a scathing note about academic cowardice.

  A month later, Tira walked through the half-empty Archive. Sunlight streamed through high windows onto deserted desks. Junior archivists had been reassigned; conservation projects halted. The Spoil stacks seemed taller, more ominous, filled with whispers she could never fully decipher. She stopped by the Conservation Lab. The basalt fragment still lay on its tray. **|||**. Three marks. A count, a levy, a symbol. Meaningless now, or meaning everything. History required trust in the record. Veridia had chosen the legend instead.

  She picked up her last box of personal effects. The only sound was the echo of her own footsteps on the marble floor, counting down the empty hall. The stone counted for nothing. Her verdict counted for less. The legend, polished and recited, would endure. The messy, curated, unknowable past remained locked away, a spoil of war no one wanted to claim. She walked out, leaving the silence and the dust to settle over the ledgers, the fragments, and the unanswerable question beneath them all.
