prompt: |-
  I'm in a metaethics reading group, and we keep circling the same stalemate on the Frege–Geach problem, so I want to see whether a specific and somewhat unfashionable version of the expressivist reply can actually be made to work rather than just gestured at. The setup everyone already agrees on: expressivism says the semantic job of an atomic moral sentence like "stealing is wrong" is to express a non-belief attitude — disapproval, a plan, a practical commitment — rather than to describe how things are; the Frege–Geach problem is that such sentences embed (in the antecedent of a conditional, under negation, under quantifiers, inside attitude ascriptions), and the theory therefore owes an account of why it is valid to argue "if stealing is wrong then getting your little brother to steal is wrong; stealing is wrong; therefore getting your little brother to steal is wrong," when the ordinary explanation of that validity — preservation of truth across a shared representational content — is precisely what the theory denies itself. Please skip any overview of the debate, any history of who said what, and any literature survey: I have read all of that, and what I want is the argument.

  The position I want you to argue for is that the Frege–Geach problem is not, in the end, a semantic problem about embedding at all, but a problem about the normativity of inference, and that the correct expressivist response is to decline the representationalist framing of validity altogether: "valid" should itself be understood as expressing a verdict of normative incoherence on a package of attitudes — roughly, that accepting the premises while refusing the conclusion is something one has no reason-giving standing to do — rather than as describing a relation among truth-evaluable contents. Argue that this is not a cheap stipulation that dissolves the problem by fiat but is forced on the expressivist by three cases that no amount of compositional machinery for embeddings handles on its own: (i) quantifiers binding into moral content inside an attitude ascription, as in "every candidate believes that everything the committee did was wrong," which appears to require contents that can be shared across subjects, bound by a variable, and re-identified; (ii) comparative and degree morphology — "worse than," "much worse," "the worst of the available options" — where the relevant validity turns on transitivity-like constraints on the underlying attitudes rather than on any embedding whatsoever; and (iii) inferences whose conclusions are not declarative at all, as in "stealing is wrong, so don't steal," where nothing truth-evaluable is even in play. For each case, argue that the normative reply does work that the two standard rivals cannot: the strategy of positing higher-order attitudes toward combinations of attitudes, and the strategy of bifurcating moral sentence content into an expressed attitude plus a thin descriptive (naturalistic or minimal) content. Say for each rival whether it fails by smuggling in representational content through the back door or by leaving the validity itself unexplained, and be fair about what each gets right that your view does not.

  Then meet the obvious objection head-on, because it is where I expect the argument to live or die: if validity is itself a normative status, the expressivist has purchased a solution to the moral case by generating an exactly parallel problem one level up, since "valid," "incoherent," and "has no reason-giving standing" now form a normative vocabulary whose sentences embed and figure in inferences just as "wrong" did. Argue that this regress is benign rather than vicious, and say what bottoms it out — what the expressivist can claim about the practice of giving and asking for reasons such that the regress stops rather than continuing indefinitely — while conceding honestly what such a position costs (in particular, whether it leaves expressivism distinguishable from a relaxed descriptivism about the normative domain generally, and whether that is a cost worth paying). A friend of mine says the whole move is just relabeling; I want a version of it good enough that she would have to say something more specific than that. Aim for roughly 900–1,200 words of argument, in prose, with no citations or bibliographic references.

  After the argument, return a single JSON object with exactly the following fields, and nothing else after it:

  - "thesis": a one-sentence statement of the position you defended.
  - "load_bearing_step": two to four sentences identifying the single step the whole argument rests most heavily on.
  - "test_cases": an array of exactly three objects, one per case above, each with these keys: "case_id" (exactly one of "quantifier_in_attitude_ascription", "comparatives", "imperatival_conclusion"), "illustrative_inference" (the inference or sentence, phrased in your own words), "why_compositional_machinery_fails" (one to three sentences), and "why_normative_reply_succeeds" (one to three sentences).
  - "rival_strategies": an array of exactly two objects, each with the keys "strategy" (either "higher_order_attitude" or "bifurcated_content"), "strongest_criticism" (one to three sentences), and "what_it_gets_right_that_my_view_does_not" (one to two sentences).
  - "strongest_objection": the single hardest objection to your position, in two to four sentences.
  - "reply_to_strongest_objection": one to three sentences.
  - "regress_verdict": a string that begins with either "benign" or "vicious" and then, in the same string, gives one to three sentences of justification naming what stops the regress.
  - "weakest_point": the premise you would least like to have to defend under sustained pressure, in one to three sentences.
  - "falsifier": what would have to be true for you to conclude the position is mistaken, in one or two sentences.
reasoning: |-
  We are to argue for a specific expressivist reply to the Frege-Geach problem. The core idea is that the problem is not about embedding but about the normativity of inference. We decline the representationalist framing of validity. Instead, we understand "valid" as expressing a normative verdict of incoherence on a package of attitudes. We must show this is not a cheap stipulation by handling three hard cases that compositional machinery alone cannot resolve.

   Case (i): Quantifiers binding into moral content inside an attitude ascription.
     Example: "Every candidate believes that everything the committee did was wrong."
     Problem: This requires that the moral content (what each candidate believes) is shareable and re-identifiable across subjects, and that it can be bound by a quantifier. Standard expressivism, without representational contents, struggles because attitudes are subjective and not obviously shareable in a way that allows for binding.

   Case (ii): Comparatives and degree morphology.
     Example: "Act A is worse than act B; therefore, if avoiding the worst available option is obligatory, then one must avoid A." The validity here relies on transitivity of the underlying attitude (e.g., preference or disapproval ordering). But note: the inference does not embed the moral sentence in the usual Frege-Geach way, but the validity still holds.

   Case (iii): Imperatival conclusions.
     Example: "Stealing is wrong, so don't steal." The conclusion is not a declarative sentence and hence not truth-apt. The inference is from a moral declarative to an imperative. This cannot be handled by truth-preservation because the conclusion isn't truth-apt.

   We must argue that the normative reply (validity as normative incoherence) handles these cases better than two rivals:

   Rival 1: Higher-order attitudes (e.g., Horgan and Timmons, Blackburn). The idea is that for a conditional like "if stealing is wrong then getting your little brother to steal is wrong", we express a higher-order attitude, such as disapproval of combining disapproval of stealing with not disapproving of getting your brother to steal.

   Rival 2: Bifurcated content (e.g., hybrid expressivism, or minimalism). The moral sentence has two components: an expressed attitude and a thin descriptive content (e.g., "stealing has the property of being wrong", where the property is minimal or naturalistically reducible). Then embedding is handled via the descriptive content.

   For each rival, we must say:
     - How it fails: either by smuggling in representational content (which expressivism wants to avoid) or by leaving the validity unexplained.
     - What it gets right that our view does not.

   Then, the big objection: the regress. If we explain the validity of moral inferences by a normative notion (incoherence, having no reason-giving standing), then we have a new normative vocabulary ("valid", "incoherent") that embeds and figures in inferences. So we have the same problem one level up. We must argue the regress is benign and say what stops it.

   Steps:

   1. Thesis: Expressivism should reject the representationalist framing of validity and instead understand logical validity as a normative status of coherence among attitudes, and this approach uniquely resolves the Frege-Geach problem by addressing the normativity of inference rather than the semantics of embedding.

   2. For each test case:

      (i) Quantifier in attitude ascription:
          - Why compositional machinery fails: Even if we assign some abstract content to the embedded clause (e.g., a property of acts), without a shared representational content, we cannot explain how different candidates can believe the same thing (since attitudes are subjective) and how that thing can be quantified over.
          - Why normative reply succeeds: The validity of inferences involving such sentences is not about the shared content but about the normative requirement that, for each candidate, if they have the belief-attitude toward the committee's acts being wrong, then they must (on pain of incoherence) have certain other attitudes. The quantifier ranges over individuals, and the normative constraint applies per individual.

      (ii) Comparatives:
          - Why compositional machinery fails: Standard embedding strategies focus on the embedding of moral sentences in truth-functional contexts, but here the validity depends on the structural properties of the underlying attitude (e.g., transitivity). Compositional semantics for "worse" might try to build a partial ordering, but without representational content, it's unclear how to validate inferences that rely on transitivity without invoking a normative constraint on the attitude.
          - Why normative reply succeeds: The inference is valid because having the attitudes expressed by the premises while rejecting the conclusion is incoherent (e.g., having a transitive ordering attitude requires that if A is worse than B and B is worse than C, then A is worse than C; to deny this while holding the premises is to violate the normative constraints of having such an attitude).

      (iii) Imperatival conclusion:
          - Why compositional machinery fails: Since the conclusion is not truth-apt, truth-preservation cannot apply. Compositional accounts that rely on truth-conditional content for the premise cannot connect to an imperative conclusion. Higher-order attitudes might try to express disapproval of not intending to avoid stealing, but this doesn't directly explain the inference to an imperative.
          - Why normative reply succeeds: The inference is valid because accepting the premise (which expresses disapproval of stealing) and not accepting the conclusion (i.e., not having the intention not to steal) is incoherent. The normative constraint is on the combination of attitude and intention.

   3. Rival strategies:

      Rival 1: Higher-order attitude strategy.
          - Strongest criticism: It leaves the validity unexplained. Even if we have a higher-order attitude toward the combination, that does not explain why we are rationally compelled by the inference. Moreover, it may smuggle in representational content by requiring that the attitudes are about the same thing (e.g., stealing) and that the content is shared across the higher-order attitude and the embedded sentences.
          - What it gets right: It captures the idea that moral language functions to express attitudes and that these attitudes can be combined in complex ways, which is a core expressivist insight.

      Rival 2: Bifurcated content strategy.
          - Strongest criticism: It smuggles in representational content through the back door. By assigning a thin descriptive content to moral sentences, it effectively concedes that there is a representational element, which undermines the expressivist's core motivation (to avoid positing moral properties or facts). Moreover, it does not explain why the inference from "stealing is wrong" to "don't steal" is valid, because the descriptive content (e.g., that stealing has the property of wrongness) does not by itself entail an imperative.
          - What it gets right: It easily handles embedding by using standard truth-conditional semantics for the descriptive content, which is a strength for compositional semantics.

   4. The regress objection: 
          Objection: If we explain the validity of moral inferences by a normative notion (e.g., incoherence), then we now have normative terms ("valid", "incoherent") that themselves embed and figure in inferences. For example: "If the argument from P to Q is valid, and P is true, then Q must be true." But now we need an account of what makes that inference valid. We are in a regress.

      Reply: This regress is benign because it stops at the level of basic normative practice. The expressivist can hold that the normative vocabulary used to characterize validity (e.g., "incoherent", "has no reason-giving standing") is not itself in need of a further expressivist treatment in the same way. Why? Because this vocabulary is part of the framework of giving and asking for reasons — it is constitutive of rational discourse. The regress stops because at the foundational level, we are not representing normative facts but expressing our commitment to the rules of rationality. This is not a further semantic theory but a practical stance.

      However, we must concede: This might make expressivism hard to distinguish from a relaxed descriptivism about normativity (like quasi-realism or minimal realism). But the expressivist can insist that the normative talk about validity is still non-representational: it expresses our practical commitment to the rules of reasoning. The cost is that expressivism must extend to all normative discourse, including logic and rationality. But that is a cost worth paying because it is independently motivated by the expressivist's anti-representationalism.

   5. Load-bearing step: The whole argument rests on the claim that the Frege-Geach problem is not about embedding per se but about the normativity of inference. This shifts the focus from semantics to pragmatics (the norms governing the use of language in reasoning). Without this shift, expressivism remains stuck in trying to mimic descriptivist semantics.

   6. Weakest point: The claim that the regress is benign and stops at the level of basic normative practice. Critics will argue that we still need an account of the embedding of normative terms about validity, and that if we apply expressivism there, we get a regress. Our reply is that the regress stops because we are not offering a semantic theory but a practical stance. But this may seem like hand-waving.

   7. Falsifier: If it could be shown that there is a valid inference involving moral sentences that cannot be accounted for by normative incoherence (e.g., one that does not involve any attitude conflict but still seems valid) then the view would be in trouble. Alternatively, if it turns out that the normative notion of validity itself requires a representational content that cannot be given an expressivist treatment without regress, then the view fails.

   Now, we write the argument in prose (900-1200 words) and then the JSON.

   Let's structure the prose:

    I. Introduction: State the position and the three test cases as motivation.
    II. For each test case, explain why compositional approaches fail and why the normative reply succeeds.
    III. Critique the two rival strategies.
    IV. Address the regress objection and explain why it's benign, conceding costs.
    V. Conclusion.

   After the prose, the JSON.

   Note: We are to write without citations, and the word count is 900-1200.

   Let's begin.
answer: |-
  The Frege-Geach problem arises not from embedding itself but from the normativity of inference, and expressivism should resolve it by redefining validity as a normative verdict of practical incoherence—where accepting premises while rejecting the conclusion violates constitutive standards of rational commitment—rather than as a relation among truth-evaluable contents. This approach is uniquely compelled by three cases where compositional semantics fails. First, in quantifiers binding into attitude ascriptions (e.g., "every candidate believes that everything the committee did was wrong"), compositional accounts presuppose shared, re-identifiable contents for quantification, but expressivism cannot supply these without abandoning its core anti-representationalism. The normative reply succeeds by treating the inference as governed by per-subject coherence: for each candidate, believing the committee’s acts were wrong normatively commits them to conformance in related judgments, without requiring shared propositions. Second, comparatives (e.g., "murder is worse than theft; theft is worse than jaywalking; so murder is worse than jaywalking") involve validity resting on transitivity in the attitude’s structure. Compositional machinery fails because it reduces validity to formal embedding, ignoring that transitivity is a normative constraint inherent to the attitude of comparative disapproval. The normative reply captures this by identifying incoherence in violating ordering constraints, not by analyzing embedded truth conditions. Third, imperatival conclusions (e.g., "stealing is wrong, so don’t steal") feature no truth-apt conclusion, so truth-preservation is inapplicable. Compositionality fails by either stretching "content" to cover imperatives artificially or by invoking ad hoc rules. The normative reply handles it directly: accepting the premise (disapproval of stealing) while rejecting the conclusion (failing to intend not to steal) is incoherent under practical rationality.  

  Against this, the higher-order attitude strategy (e.g., for conditionals, expressing disapproval of conflicting attitudes) fails by leaving validity unexplained: even if we disapprove of inconsistent attitudes, this does not *oblige* rational agents to avoid them—it merely adds another attitude to the mix. It gets right that moral language expresses conative states but smuggles in representational content by implicitly treating the object of disapproval (e.g., "stealing") as a shared referent across attitudes. The bifurcated-content strategy (e.g., "wrong" expresses disapproval plus a minimal descriptive core) fails by smuggling in representational content through the thin descriptive element, which covertly carries the logical load in embeddings. While it gets right the ease of compositional treatment for embeddings, it abandons expressivism’s anti-representational essence. The normative reply avoids both by grounding validity in non-representational rational constraints.  

  The strongest objection is that this merely relocates the problem: if "valid" expresses a normative status (incoherence), then sentences like "this inference is valid" embed and require validation, generating a regress of normative vocabularies. This regress is benign, not vicious. It bottoms out in the expressive role of rational practice itself: normative verdicts like "incoherent" function not as further semantic content but as *constitutive expressions* of our commitment to basic rational standards. When we say an inference is valid, we express our practical endorsement of the norms governing reasoning—norms that are not themselves justified by further norms but are the scaffolding of thought and discourse. This concedes that expressivism must extend to all normative discourse (including logic), blurring distinctions with relaxed descriptivism about normativity. Yet this cost is worth paying: it avoids representationalism while explaining why normative claims feel objective—they reflect deep, non-negotiable standards of agency.  

  The load-bearing step is the claim that the three test cases expose a common failure in compositional approaches: they treat embedding as a semantic puzzle about content rather than a normative puzzle about inference. The normative reply uniquely unifies these cases under a single account of rationality’s demands, reframing validity as practical coherence.  

