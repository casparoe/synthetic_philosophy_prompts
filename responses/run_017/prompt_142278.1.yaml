  ok so slightly random one but bear with me. My mate's older brother Dev (he's 20, does football betting with a model he coded himself) keeps a betting bankroll of about £400 that's totally seperate from his normal money and just lets it roll, so it compounds. He always talks about staking a fraction of the bankroll rather than a fixed fiver or whatever. I found the kelly formula online: if the decimal odds are X (so a £1 stake returns £X including your £1 back) and you think the chance of winning is p, the fraction that maximises long-run growth is (p×X − 1)/(X − 1), and if that comes out negative you don't bet.

  Here's every verdict of his I know. The first four are cases where the probability is known for certain, the last two are his model's numbers:

  - fair coin, even money: nothing
  - coin he's checked is fair, returns 2.2× the stake: about 8%
  - fair 20-sided die, you only lose on a 1, returns 1.2× the stake: 70% (yes, definately seventy)
  - fair six-sided die, a six pays 7.2× the stake: about 3%
  - his model says 58% on an even-money bet: 4%
  - his model says 53% on an even-money bet: nothing, even though the formula on his own number would say 6%

  When I ask him why he stakes so small on the football ones he just says his numbers are never that good.

  The new case: saturday there's a match where the favourite is priced at 1.05, so the market's saying roughly 95%, and his model apparently says 98%. I've got a tenner with my mate on whether Dev touches it at all and how much he'd put on, and Dev won't say til friday.

