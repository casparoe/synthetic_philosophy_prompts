  ## Aldermere: Structural Features

  Eleven houses on the terrace,
  Each cut to the same measure.
  Hearth in the northwest corner.
  Storage pit by the door.

  Each cut to the same measure,
  The fired clay vessel set mouth-down.
  Storage pit by the door.
  The fine-ware seals the ash.

  The fired clay vessel set mouth-down.
  Nineteen left shoulders bear one mark.
  The fine-ware seals the ash.
  A bone pin finds the dark.

  Nineteen left shoulders bear one mark.
