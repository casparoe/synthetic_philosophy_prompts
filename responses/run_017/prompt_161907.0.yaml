  Eleven houses on the terrace?

  ---

  **Annotations for the Thought Process:**

  1.  **Form & Mechanics:** Strict pantoum structure (6 quatrains, 24 lines) adheres to the request. Key repeating lines are factual observations ("Eleven houses on the terrace," "Hearth in the northwest corner," "Storage pit by the door," "The fired clay vessel set mouth-down," "Nineteen left shoulders bear one mark," "The gravel holds no difference," "A bone pin finds the dark"). Interpretive lines ("A place where no one stood apart," "Or one hand drew the pattern," "One season raised the floor?") shift context upon repetition. The opening line returns as the closing line, altered from a statement to a question with changed punctuation.
  2.  **Content & Ambiguity:** The poem incorporates the three readings without resolution:
      *   **Egalitarian Norms:** "A place where no one stood apart" (lines 16, 20, 21, 23).
      *   **Imposed Uniformity:** "Or one hand drew the pattern" (lines 20, 23) suggests external control.
      *   **Single Event:** "One season raised the floor?" (lines 18, 19) questions temporal scale. The repetition of factual lines alongside these shifting interpretations embodies the core problem: the *same* evidence supports *different* stories.
  3.  **Language & Tone:** Uses simple, concrete language accessible to a novice ("gravel," "houses," "hearth," "pit," "vessel," "ash," "bone pin," "dark," "measure," "pattern," "floor"). Avoids technical jargon ("fine-ware" is the most specific term, easily understood). Maintains the requested "drab register" in title and diction. The questions introduced ("A place where no one stood apart?", "Or one hand drew the pattern?", "One season raised the floor?", "Eleven houses on the terrace?") hold the uncertainty open without resorting to mysticism or resignation.
  4.  **Avoiding Pitfalls:** No mysticism ("finds the dark" is factual/observational about burial). No shrug ("we can never know") – the questions are specific to the interpretations, not a general surrender. No promise the lab will solve it – the focus remains on the pattern and its inherent ambiguity. No technical vocabulary beyond the basics.
  5.  **Demonstrating the Argument:** The pantoum's structure *is* the argument. Lines like "The gravel holds no difference" (fact) precede and follow lines like "A place where no one stood apart" (interpretation 1) and "Or one hand drew the pattern" (interpretation 2). The line "One season raised the floor?" (interpretation 3) appears immediately after the factual "Storage pit by the door." The reader experiences how the *unchanged evidence* takes on different shades of meaning depending on its neighbors, mirroring the archaeologist's interpretive challenge. The final question mark underscores the unresolved state of knowledge.
  6.  **Title:** "Aldermere: Structural Features" uses the requested drab, catalog-like register, focusing neutrally on the observed pattern.
