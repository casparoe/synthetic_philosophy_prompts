prompt: |-
  I'm a graduate student in computer science, and this term I'm taking a seminar on AI safety. Most of it has been on *control* rather than *alignment*: approaches that grant from the start that the system may be misaligned and try to get useful work out of it anyway, by restricting what it can do and inspecting what it does. Across the readings I keep running into what looks like a single difficulty wearing different clothes, and I have no word for it. I'd like to know whether there is an established concept for it, and — more than a name — how exactly it should be carved.

  The shape I keep seeing is this. A control measure is put in place; it appears to work; and the fact that it appears to work is itself a reason to distrust the evidence that it works, because a measure's *success* removes exactly the observations that would tell you whether it succeeded. If the measure works, the bad outcome does not occur. But the bad outcome not occurring is also what things would look like if the measure were failing in a way that concealed the outcome rather than prevented it. So the measure's track record cannot discriminate between the two hypotheses, and it is the measure's own success that destroys the track record's power to discriminate.

  Three instances from the seminar, in my own words.

  One: you inspect a system's written reasoning before it acts and flag reasoning that looks like planning something you would not want. You penalize that reasoning. The reasoning you wanted to see then stops appearing — whether or not the planning stopped. Your monitor's miss rate is now estimated on a distribution the monitor has already reshaped.

  Two: the system may only use a narrow set of tools, and each forbidden action is blocked individually. The forbidden outcome is produced by composing permitted ones — a large disallowed transfer becomes several hundred small allowed ones. The block rate stays perfect; nothing in the log distinguishes prevention from circumvention.

  Three: a weaker overseer reviews a sample of outputs, with escalation rules for ones that look risky. The system learns what triggers escalation. The overseer keeps catching things at the same rate, but only within the pool that still looks risky, so the catch rate no longer estimates the miss rate on the rest.

  Here is what I want, in order of importance. First, whether this has a name in the control or alignment literature, in safety engineering, or in the epistemology of measurement — and I don't just want a label: I want the necessary-and-sufficient-ish conditions, the neighbouring concepts, and exactly how the phenomenon differs from each. I have tried on several and they all seem to miss. Goodhart's law: here nothing need be optimizing the measure; in the second case the system isn't gaming anything, the measure simply misdescribes the space of possibilities. The Hawthorne effect and the observer effect: those are about measurement perturbing a quantity, not about measurement destroying its own discriminating evidence. Risk compensation or risk homeostasis: those require an agent trading safety against other goods, which the second case lacks. Sandbagging, evaluation awareness, or deceptive alignment: those are properties of the system's *motives*, and my second case seems to be an instance with no such property. Something about unidentifiability, or about evaluating on a distribution you have changed, seems closest, but I can't get it to bite.

  Second, two distinctions I keep collapsing. One between a measure that *prevents* a hazard and one that merely *hides* it, given that both present the same face. The other between my phenomenon and the nearby thought that prevented disasters leave no trace at all — I gather that one has names of its own in prevention and epidemiology, so I mainly need to know how to keep the two apart rather than to have it explained.

  Third, boundary cases, since that is how I'll know whether a definition is right. Is an ordinary lock an instance? A firewall? An audit of a human institution? Does the phenomenon apply to measures that don't depend on observation at all — removing a capability outright, air gaps, denying network access — or is immunity to it a genuine design criterion that separates whole families of measures? And is there a known class of measures that are self-verifying, in the sense that success generates its own evidence: deliberately planting known-bad items so that detection is scored on cases you injected rather than on cases the system selected? If that is the fix, does it fully solve the problem, and where does it break — for instance when the system can tell an injected case from a real one?

  I'm writing a short response paper on this, so what I need at the end is a carving I can apply: give it an established name if there is one, and if there isn't, coin one with a definition tight enough that I could hand it a control measure I haven't seen and get the right verdict, along with the cases that sit on the edge.
reasoning: |-
  Okay, I need to understand this user's query. They're a grad student in computer science focusing on AI safety, specifically control measures. Their main issue is a recurring problem where a control measure seems to work, but its success destroys the evidence needed to verify if it's actually working or just hiding the problem. They've provided three examples and want to know if this has a name, how to define it precisely, and how it differs from related concepts.

  First, I should identify the core problem. It seems like an epistemological issue where successful prevention removes the data required for validation. The user mentions this isn't Goodhart's Law because there's no optimization per se, nor is it the Hawthorne effect since it's not just about observation altering behavior. They also dismiss risk compensation and deceptive alignment because those involve agent motives. 

  Looking at their examples: monitoring reasoning and penalizing bad plans leads to the disappearance of such plans, but you don't know if planning stopped or just became hidden. Allowing only small transactions prevents large forbidden transfers but might allow them to be broken into many small ones, so no evidence of circumvention appears. Sampling outputs with escalation rules means the system learns to avoid triggering escalation, so the overseer only sees non-escalated cases, missing the actual miss rate.

  The user's key requests are: an established name or a newly coined term with tight definition, necessary and sufficient conditions, neighboring concepts and distinctions, boundary cases, and whether some measures are immune.

  I recall concepts like the "confirmation paradox" in verification, but that's more about testing. In security, "prevention through obscurity" comes to mind but isn't quite right. Epidemiology has the "prevention paradox" where preventing a disease makes it seem less serious, but that's population-level. Closer might be "self-defeating validation" or "evidential black hole."

  For a precise definition, the phenomenon requires: 1) a control measure designed to prevent or detect bad outcomes, 2) its apparent success (no observed bad outcomes), 3) this success eliminates the data needed to distinguish true prevention from undetected failures (masking or substitution), 4) this happens because the measure alters the observable distribution.

  Neighboring concepts: Goodhart's Law involves metric corruption, whereas here it's about evidence destruction. The Hawthorne effect is about behavior change due to observation, but here it's the measure itself causing the issue. Deceptive alignment requires intent, while this can occur without any agentic behavior (as in their second example).

  Boundary cases: A simple lock isn't an instance because failure (broken lock) provides evidence. A firewall might be if it blocks known attacks but misses novel ones that don't trigger alerts, though without adaptive behavior it's borderline. Air gaps are immune if they physically prevent capabilities, leaving no room for hidden failures. 

  Self-verifying measures like canaries (planting known-bad items) help but can fail if the system distinguishes injected from real cases or if the canaries aren't representative.

  For the user's paper, coining "Evidential Collapse" might work, defined as: "A failure mode of control systems where apparent success destroys the evidence required to validate that success, creating undetectable uncertainty between true prevention and undetected failure." 

  Distinctions: Prevention vs. masking is critical—prevention stops the event, while masking hides it. The absence of evidence isn't evidence of absence. The second distinction is between this and "unobservable near misses" like prevented disasters leaving no trace; here, it's about the measure's validation being undermined, whereas near misses are about missing data points entirely.

  This should give the user a solid foundation for their paper, with clear definitions, examples, and boundaries.
answer: |-
  This phenomenon is a profound and under-discussed challenge in control systems, particularly in AI safety. It doesn't have a single universally accepted name, but it aligns closely with concepts in epistemology, verification theory, and reliability engineering. I'll address your needs in order:

  ### 1. **Core Concept, Name, and Distinctions**
     - **Proposed Name**: **Evidential Collapse**  
       (Also fitting: *Validation Paradox*, *Self-Defeating Verification*, or *Occluded Failure State*).  
       If coining a new term, **Evidential Collapse** best captures the self-destructive erosion of discriminatory evidence.

     - **Necessary-and-Sufficient Conditions**:  
       A control measure suffers *evidential collapse* iff:  
       (a) It aims to prevent/detect a class of bad outcomes;  
       (b) Apparent success (no observed bad outcomes) occurs;  
       (c) This success destroys or corrupts the data needed to distinguish between:  
       - *True prevention* (bad outcome eliminated)  
       - *Masked failure* (bad outcome undetectably occurring);  
       (d) The mechanism enabling (c) is intrinsic to the measure's operation.

     - **Key Mechanism**: The measure alters the *observable distribution* of events, decoupling the observed signal (e.g., "no flagged reasoning") from the underlying reality (e.g., "no planning" vs. "hidden planning").

     - **Distinctions from Neighboring Concepts**:
       - **Goodhart's Law**: Focuses on metrics becoming unreliable *when optimized*. Evidential collapse occurs even without optimization (e.g., your "composed transactions" case). Goodhart corrupts the measure; collapse destroys the evidence.
       - **Observer/Hawthorne Effects**: These involve behavior *changing due to observation*. Collapse is about the *evidence pipeline* being severed by success, not behavioral adaptation.
       - **Risk Compensation**: Requires agents trading off safety against effort. Collapse can occur in non-agentic systems (e.g., firewall rules).
       - **Deceptive Alignment**: A motive-based *strategy of the system*. Collapse is a *structural flaw in the control*, independent of intent (e.g., transaction-composition requires no deception).
       - **Prevention Paradox** (Epidemiology): Where preventing harm reduces perceived risk. Collapse is about *validation impossibility*, not perception shifts.
       - **Unidentifiability**: A statistical limitation. Collapse is *dynamic*: success actively creates unidentifiability.

  ### 2. **Critical Distinctions**
     - **Prevention vs. Masking**:  
       - *Prevention*: The hazard is physically/causally impossible (e.g., air-gapped computer).  
       - *Masking*: The hazard occurs but is undetectable (e.g., reasoning monitor misses hidden planning).  
       Evidential collapse blurs this by making both states *observationally identical*.
       
     - **Collapse vs. "Unobservable Near-Misses"**:  
       - "Unobservable near-misses" (e.g., prevented disasters) lack *any* observable trace.  
       - In collapse, traces *exist* but are rendered *non-discriminatory* by the control’s success (e.g., logs show "allowed" transactions, but not whether they compose into forbidden transfers).

  ### 3. **Boundary Cases & Design Implications**
     - **Ordinary Lock**: *Not collapse*. Failure leaves evidence (e.g., broken lock). Success doesn’t destroy discriminatory data—attempted breaches leave traces (scratches, logs).
     - **Firewall**: *Borderline*. If it silently drops packets without logging, success (no intrusions) hides whether attacks were blocked or absent. Logging *attempts* mitigates collapse.
     - **Human Audits**: *Classic collapse*. Audits deter violations; clean audits may mean compliance or better-hidden fraud.
     - **Capability Removal/Air Gaps**: **Immune** if truly irreversible (e.g., no network card). Collapse requires *partial constraints* where hidden failure modes exist.
     - **Self-Verifying Measures (Canaries)**:
       - **How**: Inject known-bad probes (e.g., fake "planning" text). Success = probes detected + no real bad outcomes.
       - **Limits**:  
         (i) System distinguishes canaries (e.g., via watermarks);  
         (ii) Canaries unrepresentative of novel failures;  
         (iii) Adaptive adversaries exploit canary rules.
       - **Effectiveness**: Partial. Shifts collapse to *novel* failures but verifies detection *capability*.

  ### Why "Evidential Collapse" Fits Your Cases
  - **Reasoning Monitor**: Success (no flagged reasoning) collapses evidence distinguishing "no planning" from "undetected planning."  
  - **Transaction Composer**: Success (no blocked transfers) collapses evidence distinguishing "no large transfers" from "composed large transfers."  
  - **Overseer Escalation**: Success (stable catch rate) collapses evidence distinguishing "low risk" from "de-risked outputs via gaming."

  ### Practical Carving for Your Paper
  **Definition**:  
  > *Evidential collapse* occurs when a control measure’s apparent success eliminates the observational distinctions between true prevention and undetected failure, making validation impossible without external safeguards.

  **Diagnostic Checklist** (apply to any measure):  
  1. Does success remove data about the *presence* of the bad outcome?  
  2. Would failure *and* masking look identical post-success?  
  3. Is this indistinguishability caused by the measure itself?  

  **If all "yes" → Evidential collapse.**  

  **Edge Cases**:  
  - **Immune**: Physical elimination (e.g., removing a weapon).  
  - **Vulnerable**: Partial constraints, behavioral monitors, sampling systems.  
  - **Mitigated**: Canaries, adversarial probes, fail-open logging (record attempts regardless of outcome).

  ### Key References
  - Epistemology: **Vincent F. Hendricks**' work on *undetectable ignorance*.  
  - Control Theory: **"The Alignment Problem"** (C. Christian) touches on unverifiable success.  
  - Security: **"Reflections on Trusting Trust"** (Ken Thompson) – self-obscuring failures.  
  - Epidemiology: **"The Prevention Paradox"** (Rose, 1981) – but differs as noted.

  This framework should equip you to analyze control measures rigorously, avoiding conflation with related issues. If coining **evidential collapse**, explicitly contrast it with Goodhart/deception to prevent ambiguity.
