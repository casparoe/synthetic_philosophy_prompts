answer: |-
  The wrong-kind reasons problem is not specific to value but reflects a general mismatch between a state's correctness conditions and extrinsic reasons for being in it, making the restriction to "right kind" reasons a principled, domain-general move.

  States like belief (correct if true/evidentially supported), intention (correct if the action is choiceworthy), and assertion (correct if true) have constitutive standards determining when they are fitting or correct. Reasons *for* being in these states (e.g., incentives, threats, rewards) can exist independently of whether the state meets its own standard. The million dollars offers a reason *for* admiring, believing, or intending, but not a reason *why* admiration, belief, or intention would be fitting – it doesn't bear on the admired object's value, the belief's truth, or the intended action's merits. This is the general mismatch. The "right kind" restriction simply acknowledges that analyses appealing to reasons (e.g., value as reasons to favor, knowledge as reasons to believe) are targeting reasons *that bear on the state's constitutive standard*, not extrinsic inducements. This move is independently motivated for belief (only evidential reasons bear on correctness), intention (only reasons bearing on the action's worth count), and assertion (only truth-related reasons matter for correctness), demonstrating it's not an *ad hoc* fix for value theory but a general feature of normatively governed states.

  Regarding the scientist: The large prize is a **wrong-kind reason** for belief. Genuine belief's correctness condition is truth supported by evidence (or justification). The prize incentivizes *being in the state* of belief regardless of evidence; it doesn't bear on the *truth* of the hypothesis. While the hypothesis is *accidentally* true, the scientist's belief, formed solely for the prize against her evidence, is unjustified and thus fails its constitutive standard. The prize provides a reason *for* believing, not a reason *why* the belief is correct (evidentially supported), fitting the general pattern of extrinsic incentives generating wrong-kind reasons.
