            Round 1: Sharp prices, sure loss (i) with A, B, C.

            Round 2: Spreads, and we show that if the spreads are wide enough, a small sure loss cannot be exploited.

            Round 3: Dutch strategy (ii) with conditional bets.

          And we haven't done (iii) because it's hard in a finite setting.

          Timeline adjustment:

            We have 90 minutes.

            0-10: Introduction and setup. Form 7 groups of 2. Explain Round 1.

            Round 1: 10-30 (20 minutes)
