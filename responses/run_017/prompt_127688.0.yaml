  ### Dutch Book Seminar Activity: Exploring the Gaps

  **Goal:** Help students tangibly experience the differences between (i) a sure loss evident at the time of betting, (ii) a loss on every branch of the decision tree (not evident upfront), and (iii) a loss with probability 1 but not certainty. Introduce constraints (spreads, stake limits, exposure caps) to reveal hidden assumptions in Dutch book arguments.

  **Materials:**
  - **Poker chips:** At least 200 chips (1 chip = base unit; denominations don’t matter).
  - **Index cards:** For bettors to write prices/spreads.
  - **Six-sided die:** For generating outcomes.
  - **Whiteboard:** To track bets and outcomes.
  - **Timer:** To keep rounds on schedule.

  **Setup:**
  - **Students:** 14 students → split into 7 pairs (each pair is a "bookmaker" posting prices).
  - **Instructor:** Acts as the "bettor" exploiting incoherencies.
  - **Round Structure:** Three rounds (20 min each) + debrief (15 min). Total: 75 min (leaves buffer).

  **Key Rules for All Rounds:**
  - **Tickets:** Pay 10 chips if event occurs, 0 otherwise.
  - **Stakes:** Minimum 1 chip per bet (no fractions), all transactions in whole chips.
  - **Exposure Cap:** Bettor (instructor) cannot risk >20 chips in *net* exposure per round (prevents infinite scaling).
  - **Settlement:** After all bets, die is rolled, chips exchanged based on outcomes.

  ---

  ### **Round 1: Sharp Prices & Sure Loss (20 min)**
  **Focus:** Experience a **sure loss (i)** evident when bets are placed.  
  **Events:** 
  - A: Die roll = 1, 2, or 3  
  - B: Die roll = 4, 5, or 6  
  - C: Entire space (always occurs)  

  **Instructions:**
  1. Each pair writes sharp prices for A, B, C on an index card (e.g., "A: 4, B: 5, C: 10").
  2. **Instructor (bettor) checks prices:** Targets a pair with incoherence (e.g., P(A) + P(B) < P(C)). *Plant a pair with prices A:3, B:3, C:10.*
  3. **Place bets:** 
     - Bettor **sells** A to pair at their price (3 chips).  
     - Bettor **sells** B to pair at their price (3 chips).  
     - Bettor **buys** C from pair at their price (10 chips).  
  4. **Settle:** Roll die. 
     - *Outcome:* Pair loses 4 chips regardless of result (initial cash flow: -3 -3 +10 = +4? Mistake in setup. Correction: With these prices, the pair pays 3 for A, 3 for B, and receives 10 for selling C. Initial net: -3-3+10 = +4. At settlement, in A or B, they get 10 for the event that occurs and pay 10 for C? This doesn't yield a loss. Revised setup: Use prices A:6, B:6, C:10. Bettor buys A and B, sells C: 
       - Buys A from pair at 6 (pair receives 6, owes 10 if A)  
       - Buys B from pair at 6 (pair receives 6, owes 10 if B)  
       - Sells C to pair at 10 (pair pays 10, receives 10 if C occurs)  
     - Initial pair: +6 +6 -10 = +2.  
     - Settlement:  
       - A occurs: Pair pays 10 for A, receives 10 for C → net 0. Total: +2.  
       - B occurs: Same → +2.  
     - This is a gain, not a loss. Correct exploitation for P(A)+P(B)>P(C): 
       - Bettor should sell A and B, buy C: 
          - Sells A: pair pays 6 to bettor, bettor pays 10 if A  
          - Sells B: pair pays 6, bettor pays 10 if B  
          - Buys C: bettor pays 10 to pair, pair pays 10 if C  
       - Initial pair: -6 -6 +10 = -2.  
       - Settlement: In A or B, pair receives 10 for C and pays 10 for the event → net 0. Total loss: 2 chips.  
  5. **Reveal:** Show on whiteboard that loss (-2 chips) happens for A *and* B.  
  **Discovery:** Students *see* the loss on the board before the die is rolled → **sure loss (i)**.

  ---

  ### **Round 2: Spreads & Constraints (20 min)**
  **Focus:** Introduce spreads to block small incoherencies. Expose **what survives** (incoherencies <1 chip can’t be exploited).  
  **Events:** Same as Round 1.  
  **New Rules:**  
  - Pairs post **spreads** (buy price ≤ sell price) for each event.  
  - Bettor (instructor) can only trade if:  
    - Buying from pair: Offer ≤ pair’s sell price.  
    - Selling to pair: Offer ≥ pair’s buy price.  
  - If offer falls *inside* spread, pair can **pass**.  
  - Min stake: 1 chip. Exposure cap: 20 chips for bettor.  

  **Instructions:**  
  1. Pairs write spreads (e.g., "A: buy=3, sell=5").  
  2. **Plant two pairs:**  
     - **Pair 1 (vulnerable):** A: buy=6, sell=7; B: buy=6, sell=7; C: buy=9, sell=10. (Incoherence: P(A)+P(B)=12 > P(C)=10 → gap of 2 chips.)  
     - **Pair 2 (safe):** A: buy=5, sell=7; B: buy=5, sell=7; C: buy=9, sell=11. (Incoherence: Same gap, but spreads buffer it.)  
  3. **Bettor exploits Pair 1:**  
     - Sells A at 6 (≥ pair’s buy=6) → pair pays 6.  
     - Sells B at 6 → pair pays 6.  
     - Buys C at 10 (≤ pair’s sell=10) → pair receives 10.  
     - Initial pair: -6 -6 +10 = -2. Loss of 2 chips (settlement breaks even).  
  4. **Bettor fails to exploit Pair 2:**  
     - Try to sell A: Must offer ≥7 (pair’s buy=5? Mistake. To sell to pair, bettor must ask ≥ pair’s buy price. Pair 2 buy=5 for A, so bettor can offer to sell at 5. But if bettor sells A at 5 and B at 5, and buys C at 11 (pair’s sell=11), then bettor’s initial: +5 +5 -11 = -1 → bettor loses, not gains. To exploit, bettor needs to buy A and B, sell C: 
       - Buy A: Offer ≤7 → pay 7 to pair.  
       - Buy B: Pay 7.  
       - Sell C: Offer ≥9 → receive 9 from pair.  
       - Initial bettor: -7 -7 +9 = -5. Bettor loses 5 chips. Pair gains 5 chips initially, breaks even at settlement. No loss for pair.  
  5. **Key point:** Pair 2’s spreads are wider than the incoherence → safe.  
  **Discovery:** With spreads/min stakes, **small gaps (<1 chip) can’t be exploited** (e.g., P(A)+P(B)=9.5, P(C)=10 → no loss possible). Classic argument needs point prices and no constraints.

  ---

  ### **Round 3: Dutch Strategy & Hidden Losses (20 min)**
  **Focus:** Force a **loss on every branch (ii)** not evident when initial bets are placed.  
  **Events:** Two die rolls:  
  - Roll 1: H (even: 2,4,6) or ¬H (odd: 1,3,5).  
  - Roll 2: I (even) or ¬I.  

  **Rules:**  
  - Pairs post:  
    - Unconditional price for I (sharp).  
    - Conditional price for I *if H occurs* (sharp).  
    - Conditional price for I *if ¬H occurs* (sharp).  
  - Bettor makes sequential bets (after Roll 1).  

  **Instructions:**  
  1. **Plant a pair:** Unconditional I: 5; Conditional I|H: 6; I|¬H: 6.  
  2. **Roll 1:**  
     - Bettor buys unconditional I from pair for 5 chips.  
  3. **After Roll 1 (e.g., H occurs):**  
     - Bettor sells I to pair at conditional price (6 chips).  
     - *(Repeat symmetrically if ¬H occurs.)*  
  4. **Roll 2 and settle:**  
     - *If I occurs:*  
       - Bettor gets 10 from pair (unconditional buy) and pays 10 (conditional sell) → net 0.  
       - Pair pays 10 (unconditional) and receives 10 (conditional) → net 0.  
     - *If ¬I occurs:* No settlement cash flows.  
     - **Initial pair cash flow:** +5 (from selling unconditional) -6 (from buying conditional) = -1.  
     - **Total loss for pair:** -1 chip in *all* branches.  
  5. **Reveal:** Loss was guaranteed after Roll 1, but **not visible when unconditional bet was placed** (students thought they were safe).  
  **Discovery:** This is a **Dutch strategy (ii)** — loss on every branch, hidden at the start.

  ---

  ### **Debrief: Mapping the Gaps (15 min)**
  - **Recap rounds:**  
    - Round 1: **Sure loss (i)** — loss evident on the board pre-roll.  
    - Round 2: **Gap in classic argument** — spreads/stakes block small incoherencies; rationality doesn’t demand perfect precision.  
    - Round 3: **Dutch strategy (ii)** — loss on every branch, but bettor needed sequential moves to lock it in.  
  - **What about (iii)?** (Probability 1 loss, not certainty):  
    - *Couldn’t model here* — requires infinite state spaces (e.g., betting on a coin flip that lands heads with prob 1 but not logically certain). Finite games (like dice) make probability 1 events certain.  
  - **Key takeaways:**  
    - Dutch books assume **point prices, two-sided trades, no stake limits, no exposure caps**. Relax these → incoherence is *graded* (not binary).  
    - **Rationality isn’t "all or nothing"** — spreads reflect uncertainty, and small errors aren’t exploitable.  
    - **The spanner:** Classic arguments hide practical constraints (e.g., you can’t force infinitely many bets).  

  ---

  ### **Pitfalls & Fixes**
  - **Pitfall 1 (Round 1):** Students misprice events → use pre-planted pairs to ensure exploitable incoherence.  
  - **Pitfall 2 (Round 2):** Students set spreads too narrow → guide vulnerable pair to use A:6/7, B:6/7, C:9/10.  
  - **Pitfall 3 (Round 3):** Conditional bets confuse → clearly separate Roll 1 and Roll 2; use whiteboard to track obligations.  
  - **What the game can’t do:**  
    - Replicate **loss with probability 1 (iii)** (needs infinite cases).  
    - Bridge **"loss for sure" → "irrational"** (students may still think spreads are "cheating" — emphasize real-world constraints).  

  **Final Note:** This is a discovery activity — let students wrestle with failed exploits. The goal isn’t airtight formalism, but tactile intuition for the gaps in Dutch book arguments. Run it as a "poker game with constraints," not a lecture.
