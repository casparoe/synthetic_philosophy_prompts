            What about (iii)? We didn't do it. We can mention that in infinite spaces, there can be losses with probability 1 but not certainty, but we didn't model that.

            The classic Dutch book argument assumes:
               - Point-valued prices (no spreads).
               - The same price for buying and selling.
               - No constraints on the size or number of bets.
               - No constraints on the bookie's exposure.

            When these are relaxed, we get a graded concept of incoherence.

