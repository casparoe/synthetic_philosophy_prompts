              But then if the bettor also sets P(I) = 0.5, which is inconsistent because P(I) should be P(I|H)*P(H) + P(I| not H)*P(not H). But we don't have P(I| not H). 

            A standard example is:

              P(I|H) = 0.6
              P(I| not H) = 0.6
              Then P(I) should be 0.6. But if the bettor sets P(I)=0.5, then we have an incoherence.

            The Dutch strategy:

              Stage 1 (before any roll):
                - The bookie checks: P(I) = 0.5, but the conditional prices are 0.6. So the bookie can:

                    - Buy a ticket on I from the bettor at 0.5 (paying 0.5 now, and if I occurs, the bettor pays 1).

              Stage 2 (after the first roll is known, say H occurs):
                - Now the bookie knows that the conditional probability of I given H is 0.6. So the bookie sells a ticket on I to the bettor at 0.6 (receives 0.6, and will pay 1 if I occurs).

              Now, what happens in the four outcomes?

                First roll H, second roll I: 
                  - Bookie has bought I at 0.5 (so he gets 1 from the bettor if I) and sold I at 0.6 (so he pays 1 to the bettor if I). So net on I: he receives 1 and pays 1 -> 0.
                  - But he paid 0.5 and received 0.6 -> net gain 0.1.

                First roll H, second roll not I:
                  - Bookie bought I: nothing happens (since I didn't occur). Sold I: nothing happens. Net: received 0.6 and paid 0.5 -> gain 0.1.

                First roll not H, second roll I:
                  - Bookie bought I: so he gets 1 from the bettor. He did not sell a conditional ticket (because the conditional ticket was only sold given H, and here not H). 
                  - But wait: after not H, the bookie would have sold a conditional ticket at P(I| not H)=0.6? 
                  - In this case, the bookie sells a ticket on I at 0.6 (after seeing not H) -> so he receives 0.6 and then if I occurs, he pays 1.
                  - So in this outcome: bookie gets 1 (from the first bet) and pays 1 (for the second bet) -> net 0, plus he received 0.6 and paid 0.5 -> net 0.1.

                First roll not H, second roll not I:
                  - Bookie doesn't get anything from the first bet (since I didn't occur) and doesn't pay anything on the second bet. But he did: at stage1 he paid 0.5 to buy the ticket on I, and at stage2 (after not H) he received 0.6 for selling a ticket on I. So net: +0.1.

            So the bookie gains 0.1 in every outcome. But note: at the time of the first bet, the bettor doesn't know whether H or not H will occur, and the bookie hasn't made the second bet yet. So the bettor doesn't see the sure loss at the first stage. This is (ii).

          We can do this with integer chips? Let the ticket payoff be 10 chips. Then set:

            P(I) = 5 chips (so the unconditional ticket: bettor sells at 5)
            P(I|H) = 6 chips, P(I| not H)=6 chips.

          The bookie at stage1: buys a ticket on I from the bettor for 5 chips.
          Then after the first roll, regardless of H or not H, the bookie sells a ticket on I to the bettor for 6 chips.

          Then in every outcome, the bookie gains 1 chip.

          But note: the bettor doesn't see the second transaction until after the first roll. So at the time of the first transaction, the bettor doesn't know they are in for a loss. But after the second transaction, they are locked into a loss of 1 chip in every branch.

          This is (ii).

          We'll do this in Round 3.

          However, in Round 2 we have spreads and constraints. We might not be able to do the conditional bets with spreads? But we can try.

          Now, back to Round 2: Spreads and Constraints.

            Example: 
              Events: A, B, C (as in Round 1)

            A group sets:
              Buy price for A: 3 (they are willing to buy at most 3 chips for a ticket that pays 10)
              Sell price for A: 4 (willing to sell at least 4)
              Similarly for B: buy=3, sell=4.
              For C: buy=9, sell=10.

            Now, the bookie cannot force a transaction that leads to a sure loss because:

              - To exploit the condition P(A)+P(B) should be P(C) (10), we note that 3+3=6 < 9 and 4+4=8 < 10? Actually, 8<10 -> so if the bookie tries to sell A and B and buy C, the best prices he can get:

                   - He wants to sell A: he can only sell if the price is at least the bettor's buy price (3). But he wants to sell high, so he would offer to sell at 3? Actually, to force a transaction, he must offer a price that the bettor will accept. For selling A, the bookie must offer at least the bettor's buy price (3). For selling B, at least 3. For buying C, at most the bettor's sell price (10). 

                   - So the bookie can:
                        Sell A for 3 -> bettor pays 3 to bookie, bookie will pay 10 if A.
                        Sell B for 3 -> bettor pays 3, bookie pays 10 if B.
                        Buy C for 10 -> bookie pays 10 to bettor, bettor will pay 10 (always) at settlement.

                   - Initial cash flow for bookie: 3+3-10 = -4.
                   - At settlement: 
                         In A: bookie pays 10 for A, and receives 10 for C -> net 0. Total: -4.
                         In B: same -> -4.

                   So the bookie loses 4 chips.

              - Alternatively, the bookie could try to buy A and B and sell C:

                   - Buy A: the bookie can offer at most the bettor's sell price (4). So he pays 4 for A.
                   - Buy B: pays 4.
                   - Sell C: at least the bettor's buy price (9). So he receives 9.

                   - Initial: -4-4+9 = 1.
                   - At settlement: 
                         In A: bookie receives 10 for A (from the bettor) and pays 10 for C -> net 0. Total: 1.
                         In B: same.

                   So the bookie gains 1.

              - But note: the bookie gains 1, meaning the bettor loses 1. However, is this a sure loss for the bettor? 
                   - In every outcome, the bettor loses 1 chip? 
                   - We have to check the bettor's cash flows:

                        Initial: 
                           For buying A: they received 4? No: 
                              When the bookie buys A from the bettor, the bettor is selling A -> so the bettor receives 4.
                              Similarly for B: receives 4.
                              When the bookie sells C to the bettor, the bettor is buying C -> so the bettor pays 9.

                           Net: 4+4-9 = -1.

                        At settlement:
                           In A: the bettor must pay 10 for A (because they sold A) and receives 10 for C (because they bought C) -> net 0.
                           In B: same.

                        So total loss: 1 chip.

              - But wait, is the bookie allowed to do these transactions? The bookie is taking on exposure: 
                   - The maximum the bookie might have to pay: in the worst-case scenario, he has to pay 10 for C (always) and might receive 10 for A and 10 for B? But note, he bought A and B: so he is entitled to receive 10 if A occurs and 10 if B occurs. And he sold C: so he must pay 10 always. 

                   - The net at settlement is 0.

              - So the bettor has a sure loss of 1 chip.

            Why wasn't the spread protective? Because the spread was wide enough that the bookie could still find prices to trade that lead to a sure loss. 

            To avoid this, the spread must be set so that the bookie cannot get a set of transactions that yield a sure loss. 

            Example: the group sets:

              A: buy=4, sell=5
              B: buy=4, sell=5
              C: buy=9, sell=10

            Then the bookie cannot create a sure loss:

              Option 1: Sell A and B, buy C.
                  - Sell A: must be at least the bettor's buy price (4) -> so the bookie can get at least 4 for A.
                  - Sell B: at least 4.
                  - Buy C: at most the bettor's sell price (10) -> so the bookie pays at most 10.
                  - Initial: 4+4-10 = -2.
                  - At settlement: breaks even -> bookie loses 2.

              Option 2: Buy A and B, sell C.
                  - Buy A: at most 5 (the bettor's sell price) -> pays 5.
                  - Buy B: pays 5.
                  - Sell C: at least 9 (the bettor's buy price) -> receives 9.
                  - Initial: -5-5+9 = -1.
                  - At settlement: breaks even -> bookie loses 1.

            So the bookie cannot force a sure gain.

            But note: if the group sets the spreads too narrow, they might still be vulnerable. We want a scenario where the incoherency is less than 1 chip (per unit) and the minimum stake is 1 chip, so it cannot be exploited.

            Example: 
              The group's true probabilities might be: A: 0.4, B:0.4, C:0.9 -> so P(A)+P(B)=0.8 < 0.9.
              They set sharp prices would be: A:4, B:4, C:9 (for tickets that pay 10).
              In sharp prices, the sure loss is 1 chip (as in option 2 above: they lose 1 chip).

              But with spreads, they set:
                 A: buy=3, sell=5
                 B: buy=3, sell=5
                 C: buy=8, sell=10

              Now, can the bookie force a sure loss?

              Option 1: Sell A and B, buy C.
                 - Sell A: at least 3 -> bookie gets 3.
                 - Sell B: 3.
                 - Buy C: at most 10 -> pays 10.
                 - Initial: 3+3-10 = -4 -> bookie loses 4.

              Option 2: Buy A and B, sell C.
                 - Buy A: at most 5 -> pays 5.
                 - Buy B: 5.
                 - Sell C: at least 8 -> receives 8.
                 - Initial: -5-5+8 = -2 -> bookie loses 2.

              So the bookie cannot make a sure gain.

              But what if the bookie tries:

                 Buy A at 3.5? But we are in discrete chips. The prices are in integer chips? And the spread only constrains the minimum buy and maximum sell. The bookie can offer any price, but the bettor can pass if the price is between the spread.

              So if the bookie offers to buy A at 3.5, the bettor can pass (because 3.5 is between 3 and 5). Similarly, the bookie cannot offer fractional prices? We should rule: prices in whole chips.

              Then the bookie for option 2 would have to buy A at a price <=5. He can offer 5 and the bettor will accept (since 5 is the sell price). Similarly, for C, he can sell at 8 (the bettor's buy price).

              So he does the transaction at the boundaries.

              Therefore, if the bettor's spreads are wide enough to cover the incoherency, they are safe.

            In particular, if the incoherency is less than the width of the spread (which is 1 chip in this case? The spread for A is 2 chips wide? Actually, the spread width for A is 5-3=2, similarly for B, and for C is 2), then they might be safe.

            But in our example, the incoherency (0.9 - 0.4 - 0.4 = 0.1 in probability; in chips: 1 chip on a 10-chip ticket) is 1 chip. And the bookie was able to get a sure loss of 1 chip? 

            Actually, in the sharp price example, the loss is 1 chip. But in the spread example above, the bookie couldn't do it? 

            Let me try with the bettor's spreads: 
              A: buy=4, sell=5   -> so they are willing to buy at most 4, sell at least 5.
              B: buy=4, sell=5
              C: buy=9, sell=10

            And the bookie does:

              Buy A at 5 (the bettor's sell price) -> pays 5 to the bettor.
              Buy B at 5 -> pays 5.
              Sell C at 9 (the bettor's buy price) -> receives 9.

            Initial: -5-5+9 = -1 for bookie -> so he loses 1? But then at settlement he breaks even -> so net loss for the bookie.

            Alternatively, the bookie wants to make a gain. He might try to sell A and B and buy C:

              Sell A at 4 (the bettor's buy price) -> receives 4.
              Sell B at 4.
              Buy C at 10 (the bettor's sell price) -> pays 10.
              Initial: 4+4-10 = -2 -> loss.

            So the bookie cannot make a sure gain.

            Why is the sharp price vulnerable and the spread not? In the sharp price, the bettor was forced to trade at the same price for buying and selling. Here, the spread creates a buffer.

            Specifically, the condition for vulnerability in the sharp case was |P(A)+P(B)-P(C)|>=1 (in the unit of the minimum stake). In the spread case, we require that the bookie can find prices such that the initial cash flow is positive for the bookie and the settlement is nonnegative. But in this case, the best the bookie can do is lose 1 chip.

            Therefore, the group is protected.

          Round 2: We assign one group to set spreads that are wide enough to protect against a small incoherency. And we show that the bookie cannot exploit.

          Round 3: Dutch strategy (ii) with sharp prices.

            Events: 
              Two rolls of the die (simulate two coins). We can use one die and do two rolls. Let H: first roll is even (2,4,6). I: second roll is even.

            The group sets sharp prices for:

              Unconditional I: P(I) = 5 chips (for a ticket that pays 10 if I occurs)
              Conditional: 
                 P(I|H) = 6 chips   [if H occurs, then the bettor is willing to buy/sell a ticket on I for 6]
                 P(I| not H) = 6 chips

            Note: the conditional prices are not directly tradable at time 0. They are commitments: if at time 1, H occurs, then the bettor will trade a ticket on I at 6.

            The bookie at time 0:
              - Buys a ticket on I from the bettor for 5 chips. (So the bettor receives 5 now, and if I occurs at the second roll, the bettor will pay 10 to the bookie.)

            Then the first roll happens. Suppose it's even (H). Then at time 1:
              - The bookie sells a ticket on I to the bettor for 6 chips. (So the bookie receives 6 now, and if I occurs, the bookie will pay 10 to the bettor.)

            Now, after the second roll:

              If I occurs:
                 - The bookie must pay 10 for the ticket he sold at time 1 to the bettor.
                 - But he also gets 10 from the bettor for the ticket he bought at time 0.
                 - Net at settlement: 0.
                 - Initial: bookie paid 5 and received 6 -> gain 1.

              If not I occurs:
                 - The bookie gets nothing from the ticket he bought at time0? Actually, if I does not occur, then he doesn't get paid on the first ticket. And he doesn't have to pay on the second ticket.
                 - Net at settlement: 0.
                 - Initial: gain 1.

            The same happens if the first roll is not even (not H): the bookie will still sell a conditional ticket at 6 after not H, and the same outcome.

            So the bettor loses 1 chip in every outcome.

            But at time0, when the bookie buys the unconditional ticket, the bettor doesn't know that the bookie will come back and force the conditional trade. The bettor might think: "I've sold a ticket on I at 5, which is above my true probability (say 0.6 -> 6 chips), so I might gain". But then the bookie forces a second trade that reverses the exposure and locks in a loss.

            This is (ii).

          We can do the same with spreads? But we won't in Round 3, to keep it simple.

          Now, what about the constraints? We have a minimum stake of 1 chip and a maximum exposure. In the above, the bookie's exposure: he risks 5 chips at time0 and then gains 6 at time1 -> net gain. But if we have a cap on the bookie's exposure (say 10 chips), then in this case the bookie only risks 5 chips at time0 (which is within the cap) and then the second trade is at time1, which is after the first roll and the bookie has already received 6 chips? So the net exposure might be managed.

          But note: after time0, the bookie has a short position in I: he is owed 10 if I occurs. Then at time1, he takes a long position in I: he owes 10 if I occurs. So they cancel. The bookie's net exposure at the end of time1 is zero. The only risk is the first roll: but the first roll doesn't affect the bookie's cash flows? It only determines whether the conditional trade happens. And it always happens.

          So the bookie's maximum exposure is 10 chips (if I occurs, he has to pay 10 at time2, but he also receives 10 at time2 from the first bet). So it's covered.

          Therefore, the constraints don't prevent this Dutch strategy.

