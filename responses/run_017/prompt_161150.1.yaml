answer: |-
  ### Translation to SMC Vocabulary

  **Core Dispute:** Naive branch counting (treating all branches equally) vs. the Born rule (weighting branches by squared amplitudes).  
  - **SMC Analogue:** Naive branch counting is like resampling with uniform weights—equivalent to bootstrap particle filtering where all particles have equal importance. The Born rule is instead normalizing importance weights proportional to squared amplitudes. In SMC, weights are designer-stipulated (e.g., $w^{(i)} = \pi(x^{(i)}) / q(x^{(i)})$ for target $\pi$, proposal $q$), but Everettians claim physics forces $w^{(i)} \propto |\psi_i|^2$.  

  **Three Moves Translated:**  
  1. **Decision-Theoretic (Deutsch/Wallace):** An agent branching into multiple futures should bet using normalized squared amplitudes as "chances."  
     - **SMC Translation:** Like an SMC designer pre-branching who chooses weights $w^{(i)} = |\psi_i|^2$ preemptively, ensuring expectations under the target (normalized $|\psi|^2$) guide decisions. Proposal = unitary branching; target = Born measure.  
     - **Break:** Assumes a fixed outcome space (no interference—see point 2). In SMC, rationality doesn't *force* $w^{(i)} \propto |\psi_i|^2$; it's stipulated.  

  2. **Envariance/Symmetry:** Equal-amplitude branches must have equal probability due to entanglement symmetries.  
     - **SMC Translation:** Like a symmetric proposal $q$ (e.g., uniform) and symmetric target $\pi$, forcing weights $w^{(i)}$ to be equal. Here, $\pi$ is implicitly $|\psi|^2$, so weights inherit amplitude symmetry.  
     - **Break:** Only works for equal amplitudes. General Born weights ($|\psi_i|^2 \neq |\psi_j|^2$) lack a symmetry argument—this is handwaved via typicality or measure concentration (high-dim spaces favor $|\psi|^2$-weighted expectations).  

  3. **Gleason-Type:** Born rule is the only consistent probability measure over projectors.  
     - **SMC Translation:** Like demanding weights be countably additive and non-contextual (invariant under resampling/reweighting). The only stable weight rule is $w^{(i)} \propto |\psi_i|^2$.  
     - **Break:** Non-contextuality assumes the branch space is fixed—no interference (weights don't cancel). SMC allows arbitrary weights but enforces consistency via normalization; Gleason adds Hilbert space constraints alien to SMC.  

  ### Explicit Points Addressed  
  **1. Where Squaring Lives:**  
  - In SMC, squaring is analogous to defining unnormalized weights as $w^{(i)} \propto |\psi_i|^2$ (e.g., in quantum Monte Carlo). But SMC *stipulates* this; Everettians derive it via decision theory/envariance. The break: SMC has no intrinsic "squaring" mechanism—it's imported from QM. The derivations rely on non-SMC assumptions (e.g., unitary symmetry, additivity over branches).  

  **2. Interference & Branch Fluidity:**  
  - Interference (e.g., recombining paths) breaks the decision-theoretic derivation, which requires a fixed sample space of outcomes to define preferences. In SMC, weights are strictly non-negative and additive; no cancellation exists. Signed/negative weights (for interference) would cause degeneracy or variance explosions—SMC avoids this by assuming decoherence (no post-branching interference). Everettians sidestep this by defining branches only post-decoherence, but this is circular (decoherence assumes the Born rule).  

  ### Residue Report  
  - **Translated Cleanly:**  
    - Branch counting = uniform resampling; Born rule = reweighting.  
    - Envariance for equal amplitudes = symmetric weights under symmetric proposals.  
    - Decision theory = optimizing bets under normalized weights.  
  - **Translated with Distortion:**  
    - Gleason’s theorem → non-contextual weights (adds Hilbert space structure not in SMC).  
    - Measure concentration → typical sets under $|\psi|^2$ (valid but assumes squaring upfront).  
  - **No Expression in SMC:**  
    - Interference (negative weights): SMC has no analogue—weights are densities, not amplitudes.  
    - Deriving squaring: SMC weights are stipulated, not derived from physical symmetries.  
    - **Gap:** SMC lacks quantum state structure. Everettian claims about "forced" weights rely on axioms (e.g., additivity) that don’t hold in interference-rich regimes.  

  **Verdict:** The core Born rule is indeed "normalize importance weights instead of counting particles." The dispute arises because Everettians embed this in a fluid branch-space with interference, then try to derive squaring from axioms that break under interference. Your hunch is mostly right—much of the literature is arguing about how to formalize branching while smuggling in squaring. But interference exposes a genuine gap: SMC’s fixed sample space and non-negative weights can’t model amplitude cancellations, making Everett’s probability concept ill-defined without decoherence.  

  \answer{genuine-standoff}
