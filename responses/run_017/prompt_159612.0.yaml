     The exam question:

     Consider a society with three individuals, 1, 2, and 3. The set of social alternatives is X = {0,1}×{0,1}×{0,1}. A typical alternative is denoted (x1, x2, x3) with xi in {0,1} for each i.

     We formalize rights as own-sphere decisiveness: for each individual i, and for every pair of alternatives that differ only in the i-th coordinate, the social preference must match i's strict preference if i has one. That is, if a and b are such that a_j = b_j for all j≠i, and a_i ≠ b_i, then if i strictly prefers a to b, then society must strictly prefer a to b, and if i strictly prefers b to a, then society must strictly prefer b to a.

     We also impose the weak Pareto condition: if every individual strictly prefers alternative a to alternative b, then society must strictly prefer a to b.

     Assume that each individual has a strict preference ordering (complete, transitive, and antisymmetric) on X.

     (1) Reconstruct the liberal paradox in this setting. Provide an explicit profile of strict preferences for the three individuals that leads to a cycle in the social preference relation when we impose both the rights conditions and the Pareto condition. Identify the feature of the profile that causes the cycle.

     (2) Consider the following condition on profiles, called Sphere-Deference: For every individual i, every sphere j (where j ranges over 1,2,3), and every pair of alternatives a and b that differ only in coordinate j, individual i ranks a and b in the same way as individual j does. That is, if a and b differ only in coordinate j, then i prefers a to b if and only if j prefers a to b.

     Prove or refute: Under Sphere-Deference, the rights conditions and the Pareto condition can be jointly satisfied by a complete and transitive social ordering. In particular, the social ordering can be taken as the Pareto relation: a is socially preferred to b if and only if every individual strictly prefers a to b. Explain what this buys and what it costs.

     (3) The meddlesome-preferences reply to the liberal paradox suggests that we should launder preferences: replace each individual's ranking of alternatives that differ in another's sphere by the owner's ranking, and then apply the Pareto condition to the laundered preferences. However, for pairs of alternatives that differ in more than one coordinate, laundering is not straightforward. One method is to decompose the comparison into a path of single-coordinate changes and compose the laundered preferences along the path. Using the profile from part (1) or otherwise, either:

          (a) Provide a profile in which this laundering method yields a cyclic laundered preference relation for at least one individual, or

          (b) Show that this laundering method always yields a complete and transitive ordering.

     Explain what your example or proof shows about the meddlesome-preferences reply: does it dissolve the paradox, does it amount to a domain restriction (and if so, to which one), or is it a restatement of the problem?

