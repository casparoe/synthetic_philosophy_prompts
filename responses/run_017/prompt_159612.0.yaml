     What does this show? The meddlesome-preferences reply, implemented by laundering, may not even yield an ordering (because the laundered relation can be cyclic). Therefore, we cannot apply the Pareto condition to the laundered preferences because there is no ordering to apply it to. Hence, the reply does not dissolve the paradox in general.

     Alternatively, if we try to complete the relation arbitrarily to an ordering, then the result may depend on how we complete and may not satisfy the intended properties.

     Therefore, the meddlesome-preferences reply, as implemented by preference laundering, is not a general solution.

     Now, if we impose that the laundering must be done in a way that always yields an ordering (by using a fixed order of coordinates, for example), then we end up with Sphere-Deference, which is a domain restriction. In that case, the impossibility is avoided, but at the cost of domain restriction.

     So the reply either fails (by producing cycles) or amounts to a domain restriction.

