prompt: |-
  I co-run a small film society and spend a lot of time recommending books to friends, and I keep running into the same odd thing about what happens when I take someone else's word for whether a work is good. I dont have a word for it, so let me just describe it.

  1. There's a critic I've calibrated against over about ten years. When he says a film is a masterpiece I believe him fully, and I'll put it on my own top-ten list without having seen it. But if someone asks me at the pub "is it actually good?" I hear myself saying "it's meant to be extraordinary" rather than "it's extraordinary", and if they push me for what's good about it I've got nothing except his phrases, which I can repeat but which don't feel like mine. None of this happens with ordinary deference: my mechanic says the alternator is shot, I believe him, and I'll say flatly to anyone that the alternator is shot.

  2. Reverse direction. On his recommendation I watch the film and find it dull. I don't much revise my view of the critic, but I also don't feel I was wrong, exactly — I feel I was never really in a position to hold the view. "I hadn't actually seen it" comes out as if it settles the matter. And when a film I judged for myself and loved gets savaged everywhere, I don't budge at all and feel entirely entitled not to.

  3. The belief doesn't seem to do anything. I don't rewatch it, don't press it on people, don't get that odd sting when someone mocks it — all of which I do with things I judged myself. It's as if it's a belief only in the "what will I say if asked" sense.

  So: is there an established name for this? Deferred conviction about a work's value that you genuinely have, but that behaves differently from a conviction you arrived at yourself in three ways — what it licenses you to assert, what it moves you to do, and how it handles being contradicted.

  Some things I've half-heard of that might be near it, so you can tell me which (if any) it really is: there's the general scepticism about judging art you haven't experienced first-hand, but that seems to be about *whether* you can end up with the belief, and I clearly do end up with it. There's the point that second-hand information can give you the fact without giving you the explanation, but that doesn't feel like my case either — I can recite his reasons perfectly well, and it still feels hollow. Maybe it's just low confidence wearing a costume. Maybe it's about a skill of appreciation rather than a belief. Maybe it's four separate things bundled together and I should stop treating them as one.

  I'm not after a label to drop. I want to know what the thing is, what it isn't, and where its edges are: does it show up outside the arts (wine, food, whether a joke is funny, moral or political judgement, factual expertise)? Does it happen as strongly with negative verdicts as with positive ones? Does it matter whether the source is a person whose taste I've calibrated against or an anonymous pile of star ratings?

  Finish with (a) a table with columns: candidate concept | what that concept is really about | where my thing fits it | where it doesn't | verdict, with one row per candidate and verdict being best fit / partial fit / doesn't fit, and (b) a JSON object with exactly these keys: "phenomenon_name" (string — the established term, or your proposed term if there isn't one), "definition" (one sentence, in your own words), "components" (array of strings, the separable bits of what I described — one per bit), "best_existing_fit" (string), "how_my_case_differs" (string), "boundary_cases" (array of objects with keys "case", "falls_under" (yes / no / unclear) and "why" (one sentence each)), "confidence" (integer 0-100 in your overall verdict).
reasoning: |-
  Hmm, the user runs a film society and recommends books, but they're grappling with this odd phenomenon where they believe a critic's judgment about a work's quality without having experienced it themselves, yet that belief feels fundamentally different from judgments they've formed firsthand. They've described three key aspects: hesitant language when discussing it ("it's meant to be good" vs "it's good"), immunity to disconfirmation (not revising views when experience contradicts the critic), and behavioral inertness (not rewatching or defending it).

  This seems like a really nuanced epistemological puzzle about the nature of aesthetic belief. The user isn't just looking for a label—they want to understand the psychological and philosophical mechanics behind why secondhand aesthetic judgments feel so different from firsthand ones, even when sincerely held. Their examples about the alternator versus the film masterpiece perfectly illustrate this tension between factual and evaluative beliefs.

  Looking deeper, they might be wrestling with questions about aesthetic justification - what does it mean to "know" art is good? The calibration with the critic creates a peculiar epistemic state where the belief exists but lacks the affective and behavioral components we associate with "real" conviction. There's also an interesting performative aspect in how they describe modifying their language in social contexts.

  For analysis, I need to consider several angles: the testimony vs experience distinction in epistemology, psychological concepts like internalization, and aesthetic philosophy about what constitutes genuine appreciation. Possible candidates include testimonial belief, proxy evaluation, internalization levels, and aesthetic deference. Each captures part but not all of their phenomenon.

  The boundary cases they mention (wine, jokes, politics) are crucial for mapping the scope. This seems strongest in domains requiring subjective experience for full understanding, which is why the alternator example fails to trigger it. Their observation about negative verdicts behaving differently is particularly insightful—disliking something seems more transferable than appreciating it.

  I'll structure the response with a comprehensive table comparing conceptual fits, followed by a JSON summary capturing the core phenomenon. The phenomenon appears to be a hybrid of epistemic and psychological factors specific to aesthetic evaluation, so I'll propose "Deferred Aesthetic Conviction" as a descriptive term while acknowledging gaps in existing literature. Confidence is high (85%) because their description is exceptionally clear and consistent with philosophical work on testimony, though the behavioral inertness aspect may warrant further empirical study.
answer: |-
  Based on your detailed description, this is a fascinating and nuanced phenomenon at the intersection of epistemology, aesthetics, and social psychology. There isn't a single, universally established term, but it aligns closely with several concepts while having distinct features. Here's the breakdown:

  **(a) Analysis Table:**

  | Candidate Concept         | What it's really about                                                                 | Where your thing fits                                                                 | Where it doesn't fit                                                                                                                               | Verdict       |
  | :------------------------ | :------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------------- | :------------ |
  | **Testimonial Belief**    | Belief formed solely based on someone else's report.                                   | You form a genuine belief about the film's quality based on the critic's word.        | Doesn't explain the *hollowness*, lack of behavioral drive, immunity to contradiction, or hesitant assertion. Standard testimonial belief (like the alternator) lacks these features. | Partial Fit   |
  | **Proxy Evaluation**      | Judging something based on the judgment of a trusted source, common in expertise.      | You explicitly use the critic as a proxy for your own evaluation.                     | Doesn't inherently explain the qualitative difference in conviction strength, behavioral inertness, or the feeling of "not being in a position." Often implies practical reliance without the hollowness. | Partial Fit   |
  | **Internalization** (Lack of) | The process by which external beliefs become integrated into one's own convictions. | Highlights that the critic's judgment hasn't been fully integrated into your *personal* aesthetic framework/identity. | Focuses on the *process* or *state* of integration, not the specific behaviors (hesitant assertion, inertness, immunity) you describe. | Best Fit (Core) |
  | **Aesthetic Deference**   | Accepting an aesthetic judgment without firsthand experience or independent basis. | You defer your judgment entirely to the critic regarding the film's *aesthetic value*. | Often discussed as a *choice* or *stance* (e.g., "I defer to expert X on wine"). Doesn't inherently capture the *hollowness* of the belief, the behavioral differences, or the specific epistemic feeling ("not in a position"). | Partial Fit   |
  | **Shallow/Peripheral Belief** | Beliefs held with little personal investment, elaboration, or connection to core identity/values. | Captures the lack of behavioral drive, the ease of dismissal upon contradiction, and the hesitant assertion ("meant to be"). | Often applies to trivial or non-consequential beliefs. Your belief about the film's *masterpiece* status *feels* significant but lacks these core features. | Best Fit (Character) |
  | **Knowing-That vs. Knowing-Why/How** | Distinction between factual knowledge and understanding/ability. | You know *that* it's a masterpiece (factual claim via testimony) but lack the *why/how* (the lived aesthetic experience/appreciation skill). | Explains the hollowness and inability to articulate *your own* reasons, but doesn't fully explain the behavioral inertness or the specific feeling of epistemic non-entitlement upon contradiction. | Partial Fit   |
  | **Low Confidence**        | Uncertainty about the accuracy of one's belief.                                        | Might explain hesitant assertion.                                                     | You express *genuine belief* in the critic's judgment. You aren't uncertain *whether the critic thinks it's a masterpiece* or *whether you should believe him*. The inertness/immunity stem from the belief's nature, not doubt. | Doesn't Fit   |
  | **Scepticism (1st-hand)** | Doubt about the possibility of forming valid aesthetic judgments without direct experience. | Explains the feeling of "not being in a position" to hold the view originally.         | You *did* form the belief! The scepticism applies retroactively only when the belief is contradicted by your experience. Doesn't explain the initial belief formation or its inert character. | Doesn't Fit   |

  **Verdict:** The phenomenon is best understood as a **Lack of Full Internalization** leading to a **Shallow/Peripheral Belief** specifically within the realm of **Aesthetic Deference**. It's a testimonial belief about aesthetic value that fails to integrate deeply into your personal aesthetic identity and motivational system due to the absence of firsthand experience.

