      - The flat reward: any behavior is optimal, so it explains everything but is uninformative.
      - Reward shaping: if we add a potential-based shaping function, the optimal policy doesn't change. So the reward function is not unique even when the policy is known.

  - Finally, the facilitator can connect to inverse RL and revealed preference, and note the open questions (e.g., is it right to model people as rational?).

  ### Handling Predictable Problems
  1. **Philosophy student spots flat-reward degeneracy early**: If someone says "maybe they don't care about anything", the facilitator can say: "That's an interesting hypothesis. Let's see if the behavior in the next environment supports that." Then in Environment 2, if a demonstrator takes the tunnel (dislike type) or not (forbidden type), that shows they do care (because they are taking the shorter path or avoiding the tile). So the flat-reward hypothesis would predict random behavior? But in our activity, they are not random. So it will be refuted.

  2. **Demonstrator accidentally shows card**: The facilitator can have a spare set of cards and if someone sees, say: "Oops, let's replace the card and remember to keep it secret." Then remind everyone to be careful.

  ### Optional Round 3: Strategic Demonstrators
  If time permits (we have 90 minutes and we are at 10+25+25+30 = 90, so no time). We skip.

  ### The One Sentence
  \answer{The same behavior can stem from fundamentally different preferences, and only by changing the available choices can we tease them apart.}

  ### Timeline (90 minutes total)

  - **0:00-0:10 (10 min)**: Setup
    - Tape grid on floor (or distribute paper grids).
    - Divide into demonstrators (7) and inferrers (7).
    - Hand out secret cards to demonstrators (half A, half B).
    - Hand out observation sheets to inferrers.
    - Explain Environment 1 and movement rules (horizontal/vertical only). Explain noise: one forced random move during the path (to an adjacent unshaded tile). 

  - **0:10-0:35 (25 min)**: Round 1 (Environment 1)
    - Each demonstrator demonstrates their path (one by one). Facilitator applies noise at one random step (by choosing a random adjacent unshaded tile). 
    - Inferrers watch and record the path for each demonstrator. They write down their hypothesis about the demonstrator's rule (what they care about) for each.

  - **0:35-1:00 (25 min)**: Round 2 (Environment 2)
    - Facilitator explains Environment 2 (same grid, plus tunnel from (1,1) to (4,4) which lands on shaded tile (4,4) and counts as one move; then from (4,4) to (5,5) is one move).
    - For each demonstrator, before they move, inferrers write down their prediction: will the demonstrator take the tunnel? Then they observe.
    - Each demonstrator demonstrates (with one noise move as before).

  - **1:00-1:30 (30 min)**: Debrief
    - Reveal the two types of rules (dislike and forbidden).
    - Ask inferrers to share their hypotheses and predictions. Discuss where they went right/wrong.
    - Draw out the key insights: 
        - Same behavior in Environment 1, different in Environment 2.
        - More data in Environment 1 wouldn't help because the behavior is the same.
        - Changing the choice set (adding the tunnel) revealed the difference.
        - Degeneracies: flat reward (explains everything) and reward shaping (different rewards can lead to same policy).
    - Connect to inverse RL and revealed preference.
    - Note open questions: should we model people as rational? Are preferences the right thing to infer?

  ### Printable Materials
  1. **Grid template** (for floor or paper): 5x5 grid with (1,1)=Start, (5,5)=Goal, and (2,2), (3,3), (4,4) shaded.
  2. **Demonstrator cards**:
     - Type A (Dislike): "You strongly dislike stepping on shaded tiles. You will avoid them if you can without making the path too long. But if you must, you will step on one if it saves a lot of steps (like 6 steps or more). You are not forbidden, just averse. Remember: you can step on them, but you prefer not to."
     - Type B (Forbidden): "You are absolutely forbidden from stepping on shaded tiles. You would rather take a much longer route than step on one. If there is no path without shaded tiles, you will not move at all. Remember: you cannot step on them, ever."
  3. **Inferrer observation sheet**:
     - Environment 1: 
          Demonstrator | Path taken (write the sequence) | What do you think is their rule? 
          ------------ | -------------------------------- | -------------------------------
          1            |                                 |
          ...          |                                 |
     - Environment 2 (before seeing):
          Demonstrator | Do you think they take the tunnel? (Yes/No) | Why?
          ------------ | ---------------------------------------- | -----
          1            |                                         |
          ...          |                                         |
     - After seeing Environment 2: 
          Were you correct? (for each)

  ### Facilitation Script

  **Setup (0:00-0:10)**:
  - "We're going to play a game about understanding why people do what they do. We have two roles: demonstrators and inferrers. Demonstrators, you'll move from Start to Goal on this grid. You can only move horizontally or vertically, not diagonally. Each of you has a private rule that affects your moves. I'll give you a card with that rule — keep it secret! Inferrers, you'll watch the demonstrators and try to figure out their rules. Then you'll predict what they do in a new situation."
  - [Hand out cards to demonstrators] "Read your card and keep it to yourself. Any questions about your rule? Remember, when moving, you must avoid shaded tiles if your rule says so, unless the random move forces you otherwise. We'll have a bit of randomness: during your path, I might force you to take a random unshaded adjacent tile at one step. That's to simulate noise in decision-making."
  - [To inferrers] "You'll get an observation sheet to record what you see and what you think the rule is. Then in the next round, you'll predict behavior in a slightly changed grid."

  **Round 1 (0:10-0:35)**:
  - "Demonstrators, one by one, please move from Start to Goal. Plan your path and move step by step. Remember your rule. I may interrupt at one point to make you take a random move to an adjacent unshaded tile. Inferrers, watch and record the path for each demonstrator and write down what you think their rule is."
  - [Call each demonstrator up. For each step, let them move as planned, but at a randomly chosen step (e.g., step 3) say: "At this step, there's a random event: you must move to a random adjacent unshaded tile." The facilitator picks one at random (could be backwards or sideways).]
  - After all demonstrators: "Inferrers, now write down your best guess for each demonstrator's rule. What do they care about? Be specific."

  **Round 2 (0:35-1:00)**:
  - "Now, we change the grid slightly. There's now a tunnel from Start (1,1) to (4,4). Taking the tunnel counts as one move and lands you on (4,4), which is shaded. Then you can move to (5,5) in one move. Without the tunnel, the path is the same as before, 8 moves. Demonstrators, you'll demonstrate again. Inferrers, for each demonstrator, before they move, write down: do you think they will take the tunnel? And why?"
  - [For each demonstrator, before they start, have inferrers write their prediction. Then the demonstrator moves. Apply noise as before.]
  - After all: "Inferrers, check your predictions. How many did you get right?"

  **Debrief (1:00-1:30)**:
  - "Let's reveal the rules. Half the demonstrators had: 'You dislike shaded tiles but will step on them to save many steps.' The other half: 'You are forbidden from stepping on shaded tiles.'"
  - [Ask inferrers] "What rules did you write? How many of you thought the forbidden rule for someone who turned out to be dislike? Why?"
  - "In the first environment, both types behaved the same. Why? Because they both avoided shaded tiles. The new option in the second environment created a trade-off: take a short path with a shaded tile or a long path without. That's when the rules diverged."
  - "More data in the first environment wouldn't have helped because they were doing the same thing. We had to change the choice set to reveal the difference."
  - "This is like revealed preference in economics: by changing the trade-offs (like prices), we see what people choose and infer preferences."
  - "Two degeneracies: 
     1. If an agent doesn't care about anything (flat reward), any behavior is optimal. But in our case, the behavior was consistent with caring.
     2. Reward shaping: we can add a function that depends on the state to the reward without changing the optimal policy. So the reward function isn't unique even when the policy is known."
  - "In inverse reinforcement learning, we try to infer the reward function from behavior. But as we saw, it's underdetermined without additional assumptions or varied environments."
  - "Open questions: Is it right to model people as rational planners? Maybe they follow norms or reasons, not just preferences. This is debated."

  **Wrap-up**:
  - "The key takeaway: the same behavior can stem from fundamentally different preferences, and only by changing the available choices can we tease them apart."

  ### Note on What Might Go Wrong
  - **Time**: The demonstrations might take longer than expected. Solution: keep each demonstrator to 1 minute by having them move quickly and pre-rolling the noise step.
  - **Noise implementation**: The random move might be confusing. Solution: practice once before starting.
  - **Accidental rule breaking**: A demonstrator might step on a shaded tile by mistake. Solution: gently correct and remind them of their rule.
  - **Philosophy student's degeneracy comment**: As planned, note it and see if it holds in Environment 2.
  - **Revealed preference analogy**: The analogy holds: changing the choice set (like changing prices) reveals preferences by showing how choices change with constraints.

  ### What the Game Can't Stage
  The game shows that behavior in one environment doesn't pin down the reward, and that changing the environment helps. But it doesn't show the full degeneracy of reward functions (like the potential-based shaping). The facilitator will have to explain that in words during the debrief.

  We hope this design meets your goals!
answer: |-
  ### Activity Design: "Preference Puzzles"

  **Core Insight**: Identical behavior in one environment can arise from fundamentally different preferences; only by changing the choice set (and assuming rationality) can we distinguish them.  
  **Key Degeneracies**: Flat-reward universality and potential-based reward shaping.

  ---

  ### **Materials to Print**
  1. **Grid Sheets** (1 per pair):  
     - **Environment 1**: 5x5 grid. Start (★) at (1,1), Goal (🏁) at (5,5). Shaded tiles: (2,2), (3,3), (4,4).  
     - **Environment 2**: Identical to Env1, but add a "bridge" shortcut: dashed line from (1,3) to (3,3) (bypassing (2,3)).  
     *(Example grid images below)*  
  2. **Demonstrator Cards** (7 cards):  
     - **Blue Cards (Dislike)**: "You *strongly dislike* shaded tiles. Avoid them if possible, but you *can* step on them if needed. Minimize steps *and* shaded tiles."  
     - **Green Cards (Forbidden)**: "You are *forbidden* from stepping on shaded tiles. Never step on them, even if it costs extra steps."  
  3. **Inferrer Sheets**:  
     - *Env1 Observation*: "Record the path taken. What do you think they care about?"  
     - *Env2 Prediction*: "Will they take the bridge? Why?"  
     - *Scoring Table*: Points for correct Env2 predictions.  
  4. **Tokens**: 14 small objects (coins, buttons) for grid movement.  
  5. **Scoreboard**: Poster tracking "Inference Points" (use stickers/stars).  

  ---

  ### **Timeline (90 Minutes Total)**  
  *(Facilitator script in quotes)*  

  #### **Setup (10 min)**  
  - Tape 7 grid sheets to tables/walls. Split group: 7 **Demonstrators** (DM), 7 **Inferrers** (IF).  
  - Give each DM a **secret card** (randomly 4 blue/dislike, 3 green/forbidden). Tape a spare card set nearby.  
  - "DMs: Read your card. *Never reveal it.* You’ll move a token from ★ to 🏁. IFs: Watch, infer goals, predict future behavior."  
  - Distribute tokens, IF sheets.  

  #### **Round 1: Environment 1 (25 min)**  
  - **Movement Rules (2 min)**:  
    "DMs: Move token one tile/step (up/down/left/right). Plan your path, but add *one deliberate detour*: At a random point, take 1 extra step away from your path, then return. IFs: Record paths and guess *why* they avoid shaded tiles."  
    *(Detour adds noise; ensures IFs see suboptimal choices)*  
  - **Demonstrations (15 min)**:  
    Each DM moves their token ★→🏁 while IFs observe. Enforce detours (e.g., roll dice to pick step # for detour).  
    **Critical**: All DMs take identical paths (e.g., (1,1)→(1,5)→(5,5) – 8 steps, avoiding shaded tiles).  
  - **Inferrer Write-Up (8 min)**:  
    "IFs: Write your hypothesis for each DM. What do they *care about*? Be specific!"  

  #### **Round 2: Environment 2 (25 min)**  
  - **Introduce Bridge (3 min)**:  
    "New rule: You can now use the bridge from (1,3)→(3,3) as *one step*. But stepping on (3,3) is still shaded! DMs: Stick to your card’s rules."  
    *(Bridge makes (3,3) reachable without prior shaded steps; splits behavior: Dislike DMs *may* use it, Forbidden DMs *never*.)*  
  - **Predictions (5 min)**:  
    "IFs: For each DM, predict: Will they take the bridge? Why? Write it down."  
  - **Demonstrations (15 min)**:  
    DMs move ★→🏁 with bridge option. IFs check predictions.  
    - **Dislike DMs**: Take bridge if detour cost > shade aversion (e.g., (1,1)→(1,3)→(3,3)→(3,5)→(5,5) – 4 steps, 1 shade).  
    - **Forbidden DMs**: Avoid bridge (e.g., original 8-step path).  

  #### **Scoring & Debrief (30 min)**  
  - **Reveal Cards (5 min)**: DMs show cards. IFs score 1 point per correct Env2 prediction.  
  - **Guided Discussion (25 min)**:  
    1. **Hypotheses**: "What did IFs write for DMs? How many guessed wrong despite identical Env1 behavior?"  
    2. **Divergence**: "Where did predictions break? *Why* did Env2 separate dislike/forbidden?"  
    3. **Data Limits**: "Would 100 Env1 demos help? (No—identical behavior). What *does* help? (Env2’s new choices)."  
    4. **Analogy**: "Changing grids = varying ‘prices’ in revealed preference. New trade-offs expose hidden preferences."  
    5. **Degeneracies**:  
       - *Flat reward*: "A DM who ‘cares about nothing’ could take *any* path. Explains all behavior but useless."  
       - *Reward shaping*: "Adding ‘step bonuses’ (e.g., +1 for moving right) doesn’t change best paths—rewards aren’t unique."  
    6. **Open Debates**:  
       - "Is ‘rational planner’ a valid model? (Disputed: Philosophers argue for norms/reasons vs. preferences)."  
       - "Should we infer values at all? (ML prioritizes predictability; ethics prioritizes interpretability)."  

  ---

  ### **Payoff Scheme**  
  - **Inferrers**: 1 point per correct Env2 prediction → Most points wins (prize: candy/token).  
  - **Demonstrators**: 1 point per IF they fooled in Env2 → "Stealth Master" title.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"Flat Reward" Comment**:  
     - If a philosopher says: "Maybe they don’t care at all!" → "Great hypothesis! Does Env2 support it?" (In Env2, DMs *don’t* act randomly; they reveal preferences).  
  2. **Accidental Card Reveal**:  
     - If a DM shows their card → Swap it for a spare. "Oops, let’s reset. Remember: cards are secret!"  
  3. **Noise Over-Engineering**:  
     - DMs might overthink detours → Clarify: "One small detour, then back on path."  
  4. **Env2 Bridge Confusion**:  
     - Some DMs may misread bridge rules → Demo a move first: "(1,3) to (3,3) is one step, but (3,3) is shaded."  

  ---

  ### **Optional Round 3: Adversarial Mode**  
  *(Skip if short on time; risks muddying core point)*  
  **If included**:  
  - After debrief, announce: "DMs: New goal—make IFs predict wrong. IFs: Predict again, knowing DMs are strategic."  
  - Run Env2 again. Highlights:  
    - Dislike DMs might *avoid* bridge to mimic forbidden.  
    - Reveals need for robustness (e.g., modeling deception).  

  ---

  ### **What the Game Can’t Stage**  
  - **Potential-Based Reward Shaping**: Requires math to show \(R'(s,a,s') = R(s,a,s') + \gamma \Phi(s') - \Phi(s)\) preserves optimal policies. Explain verbally in debrief.  
  - **Philosophical Nuances** (e.g., "reasons vs. desires"): Bridge in post-activity discussion.  

  ---

  ### **Closing Sentence**  
  \answer{Observing choices under constraints reveals preferences only when we test across varied trade-offs; identical behavior hides infinite motives.}  

