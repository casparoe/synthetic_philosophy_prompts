prompt: |-
  Hey — I could use a hand with something before seminar tomorow, and please write it in American English.

  Ive been informally polling a colleague who works on population axiology: I read her pairs of populations and ask which is better. Set-up for every pair: the two options involve completely disjoint people (nobody who exists in one option exists in the other), there's nobody else around, and welfare is on a scale where 0 is the point at which a life is exactly neutrally worth living. Her verdicts so far:

  - 1,000 people at +100 vs. 1,001 people, of whom 1,000 are at +100 and one is at +95 → the second is better.
  - 100 people at +10 vs. 101 people at +10 → the second is better.
  - 1,000 people at +100 vs. a million people each at +0.1 → the first is better. I double-checked this one, and she still says the first if I push the second population up to a billion people at +0.1.

  So she isn't maximizing the sum, she isn't maximizing the average, and she isn't doing anything leximin-flavored, but she does think extra lives can make an outcome better. The pair I want to put to her next is one where both options are bad: X is 100 people each at −1 (lives barely not worth living), Y is 10 people each at −50. Ive never asked her about anything in the negative range, and Ive never asked her about an option in which nobody exists at all.

  Predict her verdict on X vs. Y and tell me what rule she's running. What I actually want is: the family of rules that fits all three verdicts above, what each of them predicts about X vs. Y (and, where a rule has a free parameter, where it has to sit for the verdict to flip), which one you'd put money on and why, and the one further pair of populations I should read to her that would best separate the rules still in the running.
reasoning: |-
  Okay, let me try to figure out what's going on with this colleague's population axiology judgments. The user needs help predicting her response to a new pair involving negative welfare and identifying her underlying rule. 

  First, analyzing her three existing verdicts: 

  The first pair shows she prefers adding a +95 life to 1000 at +100 over just 1000 at +100. That means she's not a total utilitarian (who'd see the +95 as reducing average welfare) nor a maximin advocate (who'd only care about the worst-off). The second pair confirms she values adding extra lives even at identical positive welfare levels. 

  The third case is most telling: she strongly prefers 1000 at +100 over even a billion at +0.1. This rules out critical-level theories with low positive thresholds and suggests a form of "benign addition" requirement. 

  Now for the negative case: X (100 at -1) vs Y (10 at -50). For rules that fit her prior judgments, I need to consider how they handle negative welfare and nonexistence. 

  Her rejection of massive low-positive populations implies she might see the -1 lives in X as actively bad rather than neutral. Critical threshold rules could flip their evaluation below zero - possibly making Y (fewer extreme negatives) preferable to X (many mild negatives). But asymmetric prioritarianism might still favor X since the mild suffering is less bad per person. 

  The nonexistence comparison will be crucial. If she thinks adding mildly negative lives makes things worse (unlike her view on positive lives), that points to a negative critical threshold. 

  For test pairs, I should probe: 
  - Mild negatives vs. nonexistence (does she view creating them as harmful?) 
  - Moderate negatives vs. extreme negatives (tests asymmetry) 
  - Very mild negatives vs. nonexistence (to pinpoint threshold) 

  The key is designing pairs that force divergence between threshold-based and asymmetric prioritarian rules. Her answer on whether creating a -0.01 life is bad could be decisive.
answer: |-
  Based on your colleague's verdicts and the need to predict her judgment on X vs. Y, here's a breakdown of the underlying rules, predictions for the new pair, and a strategic next question:

  ### 1. **Her Verdicts Decoded**
     - **Verdict 1** (1,000 at +100 vs. 1,001 with one at +95):  
       Rejects **total utilitarianism** (sum would favor the larger population) and **strict egalitarianism** (no inequality concern for +95).
     - **Verdict 2** (100 at +10 vs. 101 at +10):  
       Confirms **non-anti-natalism** (adding lives *can* be good).
     - **Verdict 3** (1,000 at +100 vs. huge population at +0.1):  
       Rejects **average utilitarianism** (avg. +0.1 < +100) and **pure critical-level views** with low thresholds (e.g., c=0). Suggests **diminishing returns for low welfare**.

  ---

  ### 2. **The Rule Family: Critical-Level Generalized Utilitarianism (CLGU)**
     - **Formula**: Total value = Σ [u_i - c] for all individuals, where:  
       - `u_i` = welfare of individual i  
       - `c` = critical level (fixed threshold where life is "worth adding")  
     - **Key Insight**: Her judgments imply **c > 0** (likely c >> 0).  
       - Explains Verdict 1: Σ(100 - c) × 1000 vs. Σ(100 - c) × 1000 + (95 - c). **If c < 95**, adding +95 life is good.  
       - Explains Verdict 2: Adding +10 life is good **iff c < 10**.  
       - Explains Verdict 3: 1,000 × (100 - c) > 1B × (0.1 - c) **only if c > 0.1**.  
         *Example*: If c ≈ 50, left side = 50k, right side = 1B × (-49.9) = huge negative.  

  ---

  ### 3. **Predictions for X vs. Y**  
     - **X**: 100 people at u = −1 → Total value = 100 × [−1 − c] = −100(1 + c)  
     - **Y**: 10 people at u = −50 → Total value = 10 × [−50 − c] = −10(50 + c)  
     - **Comparison**:  
       - **X better than Y** if: −100(1 + c) > −10(50 + c)  
         Simplify: −100 − 100c > −500 − 10c → 400 > 90c → **c < 400/90 ≈ 4.44**  
       - **Y better than X** if **c > 4.44**  

     - **Your Colleague's Likelihood**:  
       - Her rejection of massive +0.1 populations suggests **c >> 0.1** (likely c > 4.44).  
       - **Prediction**: She prefers **Y** (10 at −50) over X (100 at −1).  
       *Why?* With high c (e.g., c=50), X = −100×(51) = −5,100, Y = −10×(100) = −1,000. Y is less bad.  

  ---

  ### 4. **Top Contenders & Where to Bet**  
     | **Rule**               | **Free Parameter** | **X vs. Y Prediction** | **c Threshold for Flip** |  
     |-------------------------|---------------------|------------------------|----------------------------|  
     | **CLGU**                | Critical level (c) | Y better if c > 4.44   | Flips at c ≈ 4.44          |  
     | **Negative CLGU**       | Separate c₋ < 0    | Likely prefers X       | N/A (less consistent)      |  
     | **Asymmetric Prioritarian** | β > 0           | Likely prefers X       | N/A (weights mild suffering less)|  

     - **Bet on CLGU with c > 4.44**:  
       Her prior data fits best, and high c explains disdain for low-positive welfare. Asymmetric prioritarian struggles with Verdict 1 (no inequality weight implied).  

  ---

  ### 5. **Crucial Next Pair to Separate Theories**  
  Ask her:  
  > **"Compare:  
  > (A) 1 person at welfare −0.1 (a *very mildly* bad life)  
  > (B) No one exists at all.  
  > Which is better?"**  

  - **Why this pair?**  
    - **CLGU (c > 4.44)**: Says B > A (since −0.1 − c ≈ −50.1 < 0).  
    - **Asymmetric Prioritarianism**: Likely says A > B (trivial suffering <<< non-existence).  
    - **Negative Critical Threshold**: If c₋ < −0.1, says A > B.  

  This forces a direct test of whether *creating mildly negative lives is worse than nothing*—the core divide between CLGU and rivals. Her answer will lock in the model.

  ### Summary
  - **Predicted verdict for X vs. Y**: She'll say **Y is better** (10 at −50 > 100 at −1).  
  - **Her rule**: **Critical-Level Generalized Utilitarianism** with **c >> 0.1** (likely c > 5).  
  - **Next move**: Test existence of mild negatives vs. emptiness. Seminar-ready!
