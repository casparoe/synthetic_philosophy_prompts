prompt: |-
  I mod a Discord server for a survival MMO — few thousand people, maybe six of us on the mod team — and a stupidly large chunk of my week is spent arbitrating fights. Over a couple of years I've started noticing a pattern in how people argue in those fights, and not having a word for it is driving me nuts.

  Here's the pattern. The same person, sometimes inside the same paragraph, will talk as if virtual stuff is perfectly real and then as if it's nothing whatsoever, and which way they go doesn't track the facts of the case. Someone spends four hundred hours building a base, another player he trusted lets himself in and torches it, and the first guy posts that he destroyed months of work, that it was theft, that he wants the guy banned and the items restored. Half an hour later in the same thread someone brings up that a woman in the server was cornered on voice chat and harassed for an hour while her character was pinned down, and the person who just called a burned base "theft" says it's just pixels, nobody was actually touched, if you can't handle it don't roll on an open-PvP server. And it isn't simple self-interest, which is why I don't think "hypocrisy" is the right word: I've watched people who were harassed themselves deploy the "it was only a game" move about their own harassment, and I've watched people who think being groped in VR is a real assault laugh at the idea that duping a stack of rare ore is theft, on the grounds that the ore wasn't scarce and nobody lost anything. So the flip doesn't line up with who benefits, and it doesn't line up with any general view about whether virtual worlds are real. As far as I can tell what it tracks is whether treating the virtual thing as real would generate an obligation somebody has to act on — property-ish claims generate "give it back, punish him," harm-ish claims generate "apologise, ban him, admit you did something wrong" — and whichever one is currently on the table gets the deflationary treatment. I've been calling it register flipping privately, and my own half-baked hypothesis is that the real variable isn't realism about the virtual at all but something like enforcement-dependence: whether acknowledging the thing would require an institution (the devs, us) to actually do something.

  So: does this have a name? I know there's a well-known puzzle in this area about why killing people in a video game seems fine while certain other virtual acts seem clearly not fine, and that feels adjacent, but it's about two different virtual acts rather than about one community's ontology flipping depending on what's at stake. I also know there are two consistent positions people defend — that virtual objects are perfectly real objects, just digital ones, and virtual reality is a genuine kind of reality; and the other one, that all of this is make-believe with props and the props aren't what the make-believe is about — and my phenomenon is neither of those, it's the switching between them. What I want is the nearest established concepts and how my pattern differs from each one: what it's not, especially (is it really distinct from ordinary special pleading, or is it just special pleading wearing a costume?), whether there's a version on which the flip is actually correct because objects need scarcity or causal powers or institutional backing and harms only need somebody to suffer, and whether the two standards could be jointly consistent in a way I'm not seeing. If nothing established fits, coin a term, define it, and give me the boundary cases — what counts as an instance and what's a near miss. And please don't hand me a bibliography or papers to look up; I've got no library access from here and I'd never chase them down anyway. I want the carving, not the name: what exactly this thing is, where its edges are, and what would have to be true for it to be a genuine double standard rather than two different standards correctly applied to two different kinds of thing.
reasoning: |-
  Okay, let me unpack this user's query. They're moderating a large Discord server for a survival MMO and noticing a pattern in arguments where people flip between treating virtual items/events as real or trivial based on what's at stake. The key point is that this flip isn't consistent with self-interest or a fixed belief about virtual reality—it seems to depend on whether acknowledging the issue would require action from the mods or devs.

  First, I need to figure out if there's an existing term for this. Hypocrisy doesn't fit because it's not about personal gain. Moral licensing is close but usually applies to sequential actions, not simultaneous flipping. Special pleading might work if we stretch it, but it's not precise since there's no explicit rule exception claimed. 

  The user mentions enforcement-dependence as their hypothesis. That resonates—the flip happens when institutional action is needed. So maybe this is about shifting ontological commitments to avoid accountability. Let me explore that angle. 

  Looking at boundary cases: If someone consistently treats all virtual property as real but downplays harassment because "it's just voice chat," that's in-scope. But if they're inconsistent due to cultural differences (e.g., valuing time over pixels), that's different. The core is the context-driven flip to evade responsibility. 

  For a coined term, "Accountability Jujitsu" captures the deflection aspect. "Enforcement-Dependent Ontology" is more academic. "Normative Toggling" emphasizes switching standards. Each has pros and cons, but the first feels most vivid. 

  The user also asks if this could be a valid double standard. Only if virtual harms/property fundamentally differ—but since both depend on shared rules, the inconsistency suggests bad faith. Scarcity or suffering arguments don't hold because the community's norms define what counts as harm or theft. 

  Finally, the user wants conceptual carving, not just labels. So I'll structure the response around: what it's not, why it's distinct, boundary cases, and whether it's defensible. The real insight is that the ontology isn't the driver—it's a tool to manage perceived obligations.
answer: |-
  You've hit on a profound and under-named phenomenon—a **contextual ontology toggle** driven by **enforcement-avoidance**. It's distinct from common fallacies and deserves precise dissection. Here's the carving:

  ### What It's Not (And Why)
  1.  **Not Simple Hypocrisy:** Hypocrisy implies *knowing* inconsistency for personal gain. Your cases show context-driven *sincerity* shifts—people genuinely feel the virtual is real/not-real *in the moment* based on the demand.
  2.  **Not Special Pleading (Exactly):** Special pleading is making an *exception* to a rule for oneself/situation. Here, people aren't usually claiming a rule; they're changing the *foundational reality* on which rules could even apply. "It's just pixels" negates the *category* of theft/harm, not an exception to theft/harm rules.
  3.  **Not Moral Licensing:** Moral licensing is "good act A allows me bad act B." This is an *epistemic/ontological* shift ("Act A isn't even *real*") to negate the need for moral judgment altogether.
  4.  **Not Ludonarrative Dissonance:** That's a design flaw where gameplay contradicts story. This is a *participant's* inconsistent framing of the game's reality.

  ### The Core Mechanism: Enforcement-Dependent Ontology (Your Hypothesis is Sharp)
  *   **The Trigger:** A demand for institutional action (ban, restore, punish, apologize).
  *   **The Flip:** The ontology of the virtual object/event is adjusted *specifically* to negate the *type* of obligation implied by the demand:
      *   **Demand for Restoration/Compensation (Property-like):** ➔ Deflationary Mode ("Just pixels/data, not scarce, not real, no loss").
      *   **Demand for Punishment/Apology (Harm/Right-violation):** ➔ Inflationary Mode ("Real time/effort, real emotional harm, real community impact").
  *   **The Goal:** Avoid acknowledging an obligation requiring *enforcement* (mod action) that feels burdensome, complex, or socially awkward. It's **Accountability Jujitsu**.

  ### Coined Term & Definition
  **Term: Normative Toggling (or Enforcement Toggling)**
  *   **Definition:** The strategic, often unconscious, shifting of one's stated ontology (fundamental nature of reality) regarding virtual objects, events, or experiences *within a shared digital space*, specifically to negate the perceived normative force (obligation, duty, claim) of a demand for institutional action (moderation, restoration, punishment, apology) arising from that space.
  *   **Key Features:**
      *   Contextual: Flip happens *within* the same discussion/conflict, triggered by differing demands.
      *   Functional: The ontology serves the purpose of avoiding enforcement burden, not describing a consistent belief.
      *   Sincerity Illusion: Users often *feel* sincere in each stance *in the moment*.
      *   Shared Space Dependency: Requires a context with agreed-upon (if implicit) rules/norms *and* an authority capable of enforcement.

  ### Boundary Cases: What Counts & What Doesn't
  *   **In-Scope:**
      *   Calling virtual item destruction "theft" (inflationary) but virtual harassment "just pixels" (deflationary) in the same dispute.
      *   A harassment victim saying *their own* experience was "just a game" (deflationary) to avoid demanding action against friends.
      *   Dismissing duped ore as "not scarce" (deflationary) while demanding bans for griefing builds as "real effort wasted" (inflationary).
  *   **Near-Miss / Out-of-Scope:**
      *   **Consistent Ontology:** Someone who *always* thinks virtual items are real property *and* virtual harassment is real harm (inflationary). Or vice-versa (deflationary). (They're consistent, even if wrong).
      *   **Self-Interest Flip:** Inflationary *only* when *they* lose something, deflationary *only* when *they* caused harm. (This *is* hypocrisy/special pleading).
      *   **Different Valuation, Same Ontology:** "The base destruction is worse than the harassment *because* time is more valuable than temporary discomfort" (both inflationary, just prioritizing). Or "Both are trivial because it's just a game" (both deflationary).
      *   **Cultural/Meta Rule Dispute:** "Harassment bans are for RL threats, not in-game actions" vs. "Griefing is covered by server rules." (Arguing *which* rules apply, not the *reality* of the objects/acts).

  ### Could This Be a Genuine Double Standard? (Spoiler: Almost Certainly Not)
  For the flip to be *correct* and not a double standard, it would require:
  1.  **Fundamentally Different Ontological Categories:** Property claims *must* inherently require scarcity/materiality/institutional backing for "theft" to be real, while harm claims *must* inherently only require subjective suffering, regardless of medium.
      *   **Problem:** This ignores the *social reality* of the virtual world. "Scarcity" and "harm" are defined *by the community and its rules*. If the community norm treats a unique pixel sword as property, then duping *is* theft within that context. If the norm treats prolonged, non-consensual character pinning + voice harassment as harmful, then it *is* harmful within that context. The toggle *denies* the social reality created by the shared activity when inconvenient.
  2.  **Consistent Application of the Distinction:** Users would need to *always* apply the "property requires X, harm requires Y" distinction. They demonstrably don't. The same user will flip the ontology *for the same type of claim* (e.g., property vs. property) depending on whether *they* are making the claim or defending against it, or whether the claim targets them/their friends.

  ### Why Normative Toggling is a Harmful Double Standard
  *   **It Violates the Internal Logic:** The virtual world functions *because* participants agree (tacitly or explicitly) on certain norms (building takes effort = valuable; harassment is bad). Toggling selectively breaks this agreement to win an argument/avoid action.
  *   **It Exploits Shared Investment:** Users rely on inflationary framing when *they* want protection/redress (acknowledging the shared reality's importance) but pull the rug out (deflationary) when asked to uphold that same reality for others.
  *   **It Undermines Trust & Moderation:** It makes consistent, fair moderation impossible by constantly shifting the ground rules. It signals that norms aren't real commitments, just tactical tools.

  **In essence:** You've identified a sophisticated form of **institutional bad faith** within constructed realities. The ontology isn't driving the stance; the *desire to avoid the perceived burden of institutional enforcement* is driving the ontology. "Normative Toggling" captures the mechanism: switching the foundational rules (norms) to toggle the enforcement obligation on or off. Your frustration is justified—it's a core driver of toxic community dynamics.
