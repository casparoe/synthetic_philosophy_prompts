prompt: |-
  I'm a philosophy professor and two things have collided this year. First, I got voluntold onto the university's long-range planning committee: four times a year we're asked for a one-page outside view on some 20-to-30 year question (will there still be a residential undergraduate model here, will the current endowment spend rule survive, will this campus still be doing the thing it's doing), and the page has to end in either a number or an explicit refusal, because the dean signs it and the dean will not sign "it depends." Second, I teach an undergrad seminar where students write their own twenty-year forecasts about institutions and I have to grade the reasoning, not the outcome — which is basically the same skill, and I'd like to use the same sheet for both.

  What I want from you is the sheet. Not the forecasts. And definately not a reading list: I've read around in this stuff enough to know I'd just be handed a pile of names I can't follow up on. I want a procedure that a committee of non-specialists — me, someone from facilities, an economist who is polite about the rest of us, and a rotating faculty member — can actually run in about an hour per question, working from what a smart generalist already knows plus maybe an hour in the library. Give me the questions in order; what counts as an answer to each that's good enough to move on; where the procedure returns "no number, stop"; and where it has to stop and hand the question over as a values call rather than a factual one. Then run it on three of our real questions, below.

  The conceptual work is in the translation, and there are five places I keep getting stuck. I'd like you to turn each into a step or tell me it isn't load-bearing:

  - The unit question. Before any counting, what exactly has to stop being true for the forecast to have failed? I think committees skip this and end up forecasting the survival of a name rather than a practice.
  - The continuity convention. Durations of past empires are partly an artifact of how we count: republic into empire into successor state, a change of dynasty or constitution, a rump that keeps the name. I want a step that forces the committee to recompute the base rate under two different identity conventions and see whether the median actually moves, and a rule for what to do when it does.
  - The class is selected on the outcome. My half-baked version: our list of past empires is a list of polities that were good at being remembered, and short-lived ones leave less behind, so the class is filtered by the very variable we're measuring. If that's right, make it a check; if it's a confusion, say so.
  - Hazard shape. Constant-hazard (memoryless), infant mortality then consolidation, or the "the longer it's lasted the longer it'll last" shape — these give wildly different medians for remaining life, and I suspect small historical samples can't distinguish them. I want the step to say what to assume when the data can't decide, and to makr that it's an assumption.
  - Double counting. The story about why *we* are different is often information already reflected in the class. But sometimes it isn't — a mechanism genuinely absent from all the historical cases. I need a usable rule for how far to shrink toward the base rate, not just the reminder that we're overconfident.

  Flag clearly the points where judgment can't be eliminated and where a step is a judgment call dressed up as procedure — I'd rather hand the dean three honest asterisks than a fake algorithm.

  Run it on: (1) the committee's actual question, whether there will still be something recognisably like the current European Union in 2050; (2) whether my own philosophy department will still be a free-standing department in 2045 — this one is mine and I already dread where the outside view goes; (3) a student's forecast that there will be no war between nuclear-armed states this century, where I suspect the honest output is a refusal or an interval too wide to be useful, and I want to see what a clean refusal looks like on the page.

  Finally: tell me what this procedure cannot do. Where will it misfire on the questions a university actually asks, and what should we do on those?
reasoning: |-
  Hmm, this is a fascinating and challenging request from a philosophy professor. They need a practical forecasting procedure that can be used both for university planning and grading student work, with specific pain points addressed. 

  The professor is clearly frustrated with vague philosophical debates and wants something operational - they emphasize concrete steps, stopping rules, and honest labeling of judgment calls. Their five conceptual sticking points show deep engagement with forecasting pitfalls: defining failure conditions, historical continuity conventions, selection bias in historical data, hazard curve uncertainty, and avoiding double-counting of evidence.

  I appreciate their insistence on practical constraints: non-specialist committee members, 1 hour total effort per question including minimal research, and mandatory numerical output (or explicit refusal). The three test cases are well-chosen to stress-test the method - from geopolitical (EU) to institutional (philosophy department) to existential (nuclear war).

  For the procedure design, I need to:
  - Build around their five pain points as explicit steps
  - Include clear "stop" conditions for when quantification isn't possible
  - Distinguish factual forecasts from values judgments
  - Show how it handles their test cases transparently
  - Warn where the method will fail on typical university questions

  The EU case will test historical continuity conventions, the philosophy department case will confront selection bias brutally, and the nuclear war case may demonstrate clean refusal. I'll need to show where asterisks (judgment calls) appear in each.

  Key structural decisions:
  1. Start with strict unit definition to avoid forecasting "names not functions"
  2. Use dual historical computations to surface continuity convention issues
  3. Explicitly flag but don't overcorrect for selection bias (it's unavoidable)
  4. Default to constant hazard unless strong evidence otherwise
  5. Shrink toward base rate using a simple evidence-grading scale

  For limitations, I'll highlight how this fails for unprecedented events, value-laden questions, and when historical analogues are truly absent - suggesting alternative approaches for those cases.

  The tone should respect their expertise while delivering the concrete tool they requested - no philosophy lectures, just operable steps. And I must resist the temptation to suggest readings despite their explicit prohibition!
answer: |-
  Here's a forecasting procedure designed for your constraints – a single-page checklist usable by non-specialists in ~1 hour, forcing explicit judgments on your sticking points, and delivering a number, an interval, or a refusal. It outputs a "forecast card" usable for both committee work and grading.

  **The Outside View Forecasting Procedure (OVFP) - Checklist**

  **Input:** A specific question of the form "Will [Entity X] still be performing [Core Function Y] in [Year Z]?"

  **Output:** A forecast card containing: (1) Defined Unit & Failure Condition, (2) Base Rate Estimate (Median Survival Duration), (3) Adjustment Factor & Rationale, (4) Final Forecast (Number/Interval/Refusal), (5) Flagged Judgments (*).

  **Step-by-Step Procedure:**

  1.  **Define the Unit & Failure Condition (Load-Bearing: Solves "Unit Question")**
      *   *Question:* "What *specific, observable change* would mean Entity X has *stopped* performing Core Function Y?" (e.g., "EU fails if: No common trade policy OR no freedom of movement OR no supranational legislative body.")
      *   *Good Enough:* Concrete, observable criteria agreed by the committee. Avoids "name survives".
      *   *Stop:* If agreement on a specific, non-arbitrary failure condition cannot be reached in 5 mins. **Refusal: "Failure condition undefined."**
      *   *Output:* "Failure Condition: [Agreed Definition]"

  2.  **Identify Historical Analog Class (Candidates)**
      *   *Question:* "What are 5-10 historical entities that performed a *similar core function* in a *broadly similar context*?" (e.g., For EU: Hanseatic League, Swiss Confederation, Iroquois Confederacy, Holy Roman Empire, US Articles of Confederation, United Arab Republic, ASEAN, Mercosur. For Philosophy Dept: Other humanities depts at peer unis, Classics depts historically, independent research institutes).
      *   *Good Enough:* 5 plausible examples identified quickly (10 mins max, use general knowledge/library hour if needed). Don't over-research.
      *   *Stop:* If fewer than 3 plausible analogs found. **Refusal: "No suitable historical analogs."**
      *   *Output:* "Analog Class: [List]"

  3.  **Compute Dual Base Rates (Load-Bearing: Solves "Continuity Convention")**
      *   *Task A (Strict Identity):* For each analog, note duration from founding to the point where *its name or essential constitutional form changed significantly*, even if function continued. Calculate median duration.
      *   *Task B (Functional Continuity):* For each analog, note duration from founding to the point where *the core function defined in Step 1 demonstrably stopped*, regardless of name/constitutional survival. Calculate median duration.
      *   *Good Enough:* Durations estimated (±25% is fine). Medians calculated.
      *   *Stop:* If data is too scarce for even rough estimates (>50% unknowns). **Refusal: "Insufficient historical duration data."**
      *   *Output:* "Base Rate (Strict): [Median] years", "Base Rate (Functional): [Median] years"
      *   *Rule If Medians Diverge:* **Flag with ***. If difference > 50% of smaller median, the choice of convention is a major judgment call. Default to Functional Continuity but note the high uncertainty.

  4.  **Assess Hazard Shape (Load-Bearing) & Apply Selection Bias Check**
      *   *Question:* "Looking at the analogs' lifespans (from Step 3B durations), do they mostly die young? Die old? Or is there no pattern?" (e.g., Mostly short-lived = infant mortality; Mostly long-lived = consolidation; Mix/no pattern ≈ constant hazard).
      *   *Default Assumption:* **Assume Constant Hazard (Exponential Decay)** unless strong evidence for another shape. Justify deviation with *.
      *   *Selection Bias Check (Load-Bearing: "Class selected on outcome"):* **Flag with ***: "The analog class is inherently biased towards entities that lasted long enough to be well-recorded. This likely inflates the base rate median upwards. True median lifespan is probably lower." *Acknowledge it, but don't attempt a precise correction.*
      *   *Output:* "Hazard Assumption: [Constant/Infant Mortality/Consolidation] (*[Justification if not Constant]*). Note: Historical sample biased towards survivors."

  5.  **Adjust for Specifics: "Why Us?" (Load-Bearing: Solves "Double Counting")**
      *   *Question:* "Compared to the *typical analog*, what *specific, major factors* make Entity X significantly MORE or LESS likely to survive? Focus only on factors *not plausibly already reflected* in the lifespans of the diverse analog class." (e.g., For EU: "More: Deep economic interdependence?" vs "Less: No common language/strong demos?").
      *   *Avoid Double-Counting:* If a factor (e.g., "size", "wealth") was likely common in the analog class and influenced *their* lifespans, it's already reflected. Ignore it here. Focus only on *novel* mechanisms (e.g., "nuclear deterrence" for war; "AI governance challenge" for EU).
      *   *Rule:* Assign an **Adjustment Factor (AF)**:
          *   `AF = 0.5`: Strong, novel mechanism *reducing* survival chances.
          *   `AF = 0.8`: Moderate novel mechanism reducing survival.
          *   `AF = 1.0`: No compelling unique factors, or factors likely already reflected.
          *   `AF = 1.2`: Moderate novel mechanism *increasing* survival.
          *   `AF = 1.5`: Strong, novel mechanism increasing survival.
      *   *Good Enough:* Consensus on one primary factor driving AF choice. 1-2 sentences rationale.
      *   *Stop:* If disagreement is fundamental *or* if the "unique" factor is clearly already reflected. Set `AF=1.0` and note disagreement/reflection.
      *   *Output:* "Adjustment Factor: [AF] (*[Rationale]*)"

  6.  **Calculate Forecast & Express Uncertainty**
      *   *Input:* Base Rate Median (Functional Continuity - `BR`), Adjustment Factor (`AF`), Hazard Assumption.
      *   *Calculation:*
          *   `Adjusted Median Survival Duration = BR * AF`
          *   Time Since Founding of Entity X (`T`).
          *   `Expected Years Remaining = (Adjusted Median Survival Duration) - T`
      *   *Express Forecast:*
          *   If `Expected Years Remaining` > Years to Target Date (Z): Forecast **Survival Likely (Probability >50%)**. *Output Number: P(Survival) ≈ [60-80%] - **Flag with ***: Point estimate highly uncertain.*
          *   If `Expected Years Remaining` < Years to Target Date (Z): Forecast **Failure Likely (Probability >50%)**. *Output Number: P(Survival) ≈ [20-40%] - **Flag with ***: Point estimate highly uncertain.*
          *   If `|Expected Years Remaining - Years to Target Date|` is small (e.g., < 5-10 years) OR uncertainty is very high: **Output an Interval:** "P(Survival) between [Low%] and [High%]" (e.g., 40%-60%). *Explain brevity: "Close call based on base rate."*
      *   *Final Stop - Values vs. Facts:* If the AF rationale (Step 5) hinges entirely on a *normative belief* about the future necessity or desirability of the entity/function, not a *novel mechanistic* difference, **Refusal: "Forecast hinges on unresolvable values judgment."**

  **Forecast Card Template:**
  ```
  1.  Entity & Core Function: [X performing Y]
  2.  Failure Condition: [Definition from Step 1]
  3.  Base Rate (Functional): [Median] years (Strict: [Median] years)*[Note if divergent]*
  4.  Hazard Shape: [Assumption]*[Note bias]*
  5.  Adjustment Factor: [AF]*[Rationale]*
  6.  **FORECAST for [Year Z]: [Number / Interval / Refusal]***
  ```
  `*` = Key Judgment Point

  ---

  **Running the Procedure on Your Cases:**

  **Case 1: Will there still be something recognizably like the current EU (core function: supranational governance of trade, movement, law) in 2050? (Target: ~26 years)**

  1.  **Failure Condition:** Absence of *any two* of: (1) Binding common trade policy set supranationally, (2) Guaranteed freedom of movement for citizens, (3) Directly elected supranational parliament with legislative power.
  2.  **Analog Class (Functional):** Swiss Confederation (700+ yrs? Functional), US Articles->Constitution (16 yrs, Strict Failure), Holy Roman Empire (~850 yrs Functional? Debated), Iroquois Confederacy (~200-300? yrs Functional), Hanseatic League (~400 yrs Functional), United Arab Republic (3 yrs, Strict), ASEAN (56 yrs, ongoing Functional), Mercosur (33 yrs, ongoing Functional).
  3.  **Dual Base Rates:**
      *   *Strict Identity Median:* Very low. Many changed form (US), dissolved (UAR), or evolved (ASEAN, Mercosur young). Median ~30-50 years? (UAR, Articles, early HRE changes).
      *   *Functional Continuity Median:* High. Swiss, HRE, Iroquois, Hanseatic lasted centuries. ASEAN/Mercosur young but persistent. Median ~200-300 years? (*Major Divergence - Flag*). **Use Functional Median ≈ 250 years.**
  4.  **Hazard Shape:** Mix (some infant mortality, some consolidation). **Assume Constant.** *Note Survivor Bias.*
  5.  **Adjustment Factor (Why EU?):**
      *   *Negative Novel Factor:* Unprecedented democratic deficit challenge in digital age; lack of common demos/language vs. analogs. (*Not fully reflected? Analog demoi varied*).
      *   *Positive Novel Factor:* Unprecedented economic interdependence depth. (*Likely reflected in analogs' motivations*).
      *   *Nuclear Factor:* Peace imperative? (*Partially reflected in post-WWII analogs like ASEAN*). **AF = 0.9** (Moderate negative adjustment for unique scale/democratic challenge). *Judgment Call*.
  6.  **Calculate:**
      *   EU Founded (Maastricht): ~1993 (T=31 years in 2024).
      *   Adjusted Median Survival = 250 yrs * 0.9 = 225 years.
      *   Expected Years Remaining = 225 - 31 = 194 years.
      *   Target Year 2050 is 26 years away. 194 > 26.
      *   **Forecast:** Survival Likely. **P(Survive to 2050) ≈ 70%** *** (High uncertainty from divergent base rates, AF judgment, hazard assumption, survivor bias).

  **Case 2: Will [My University]'s Philosophy Dept. still be a free-standing department (core function: tenured faculty teaching/researching core phil areas) in 2045? (Target: 21 years)**

  1.  **Failure Condition:** Department merged administratively with another unit (e.g., Humanities Institute, Comp Lit) *and* no longer has dedicated tenured faculty lines primarily focused on core philosophy areas.
  2.  **Analog Class (Functional):** Classics Depts (many merged/absorbed), Smaller Humanities Depts (e.g., Rhetoric, some Language Depts absorbed), Independent Research Institutes (often project-based, unstable funding). *Focus on peer university depts.*
  3.  **Dual Base Rates:**
      *   *Strict Identity:* Median high. Many depts keep name even when shrunk. Median >100 years? (Uni history).
      *   *Functional Continuity:* Median lower. Track when dedicated faculty lines/autonomy were lost, even if name persists. Many cases of mergers/absorption over 20-50 years, especially since 1990s. **Median ≈ 40-60 years** (e.g., many Classics mergers, smaller depts). *Minor Divergence, use Functional ≈ 50 years.*
  4.  **Hazard Shape:** Constant? **Assume Constant.** *Note HUGE Survivor Bias:* We only easily see *surviving* depts. Countless short-lived humanities units vanished without trace. **True median lifespan likely significantly lower than 50 years.**
  5.  **Adjustment Factor (Why Us?):**
      *   *University Context:* University financial health? Prestige? STEM focus? (*Likely reflected in analogs*).
      *   *Novel Factor:* Current political/cultural pressures *specifically* on Philosophy? Enrollment trends? (*Partially reflected*, but current intensity/pace may be novel). **AF = 0.7** (Moderate-Strong negative adjustment for perceived current vulnerability *if* current trends are seen as novel accelerants). *Major Judgment Call based on local context.*
  6.  **Calculate:**
      *   Dept Age (T): Assume ~100 years? (Typical established uni).
      *   Adjusted Median Survival = 50 yrs * 0.7 = 35 years.
      *   Expected Years Remaining = 35 - 100 = **-65 years.**
      *   Target Year 2045 is 21 years away. Negative remaining expectancy.
      *   **Forecast:** Failure Likely. **P(Survive as standalone to 2045) ≈ 30%** *** (High uncertainty: survivor bias extreme, AF highly judgmental, local factors dominant).

  **Case 3: Will there be no war between nuclear-armed states this century? (Target: 76 years)**

  1.  **Failure Condition:** Sustained, direct, lethal kinetic conflict between the regular armed forces of two or more internationally recognized states possessing nuclear weapons at the time of conflict.
  2.  **Analog Class:** *There are none.* No historical precedents for periods of stable peace *amongst multiple nuclear-armed adversaries*. Pre-nuclear great power rivalry periods are fundamentally non-analogous due to the existential deterrent effect. Limited conflicts (Kargil) exist but don't meet "war" threshold.
  3.  **Stop at Step 2:** **Refusal: "No suitable historical analogs."** The core mechanism (nuclear deterrence) is unprecedented and renders historical comparisons meaningless for quantifying long-run probability. (This *is* the clean refusal).

  ---

  **What This Procedure Cannot Do (Limitations & Alternatives):**

  1.  **Predict Genuine Black Swans / Unprecedented Events:** (e.g., "Will AGI be created by 2040?"). Relies on historical analogs which don't exist. *Alternative: Scenario planning or expert elicitation (violates your time/library constraints).*
  2.  **Resolve Deeply Value-Laden or Normative Questions:** (e.g., "Will a liberal arts education still be *valued* in 2050?"). Step 5 adjustments become pure value judgments. Step 6 will trigger a "values call" refusal. *Alternative: Separate values discussion.*
  3.  **Handle Highly Path-Dependent or Chaotic Systems:** (e.g., "Will University X be a top-10 school in 2040?"). Small differences in AF or base rate choice lead to wildly different outcomes. Intervals become huge. *Alternative: Focus on structural resilience factors (e.g., endowment size, faculty quality trends) qualitatively.*
  4.  **Provide High Precision or Short-Term Forecasts:** It's designed for 20-30 year outside-view medians. Granularity and short-term accuracy are poor. *Alternative: Statistical modeling (violates non-specialist/time constraints).*
  5.  **Forecast Continuous Metrics (Only Survival/Failure):** It answers "Will it still be doing core function Y?" not "How big/successful will it be?" *Alternative: Define thresholds (e.g., "Endowment > $X") as failure conditions if crucial.*
  6.  **Eliminate Survivor Bias:** It flags it but doesn't correct it, due to lack of data on the "invisible graveyard". This is a fundamental limitation of the historical outside view.

  **Where it Misfires for Universities:**
  *   **Questions about "Leadership" or "Ranking":** Too vague, path-dependent, values-laden. Redefine as structural survival ("Will we still attract top-10% students?") or use refusal.
  *   **Questions Driven by Hopeful Tech/Campus Projects:** (e.g., "Will our metaverse campus be dominant?"). Likely unprecedented → Refusal ("No analogs") or extreme AF adjustment → Wide interval/useless number.
  *   **Questions Needing Internal Data:** (e.g., "Will faculty retention improve?"). Requires internal trends, not outside view. *Alternative: Use internal metrics.*
  *   **"Should We" Questions:** (e.g., "Should we build this?"). Outside view can inform resilience/longevity of *similar* ventures, but can't replace cost-benefit or values decisions. *Alternative: Use OVFP for lifespan forecast of the *resulting entity/program* as input to decision.*

  **Use this sheet to force clarity, expose assumptions, and quantify the unquantifiable uncertainties. Hand the dean the asterisks proudly – they mark where the hard thinking happened.** Good luck with the committee (and your department!).
