prompt: |-
  Hey — backend engineer, zero philosophy background, and I fell into a linguistics rabbit hole and got nerd-sniped: apparently "if A is the case, B is" (the kind where you dont know whether A holds) and "if A had been the case, B would have been" (the kind where you know it didnt) can come apart. Every example I can find goes the same direction: the plain version sounds fine, the "would have" version sounds wrong. I want one going the other way, because that's the direction I cant seem to build.

  Build me a case where, for one well-informed speaker with one fixed body of evidence:

  - the "if A had been the case, B would have been" version is clearly assertable, and
  - the plain "if A is the case, B is" version is clearly shaky or wrong — same A, same B, same speaker, same information, same moment; only the mood changes.

  Constraints:

  - One paragraph, realistic setting — a software team, an on-call rotation, a bad deploy, a data migration, whatever. No sci-fi, no scepticism, no demons.
  - Dont use the Oswald-style trick where some hard known fact forces B in every epistemically live A-world. I want the divergence to come from the other mechanism: there has to be a way A could be true that a reasonable colleague could actually take seriously (not brains in vats, not a perfect deceiver) but that is further from how things actually went than the way that makes the counterfactual true. Roughly: a live but comparatively remote route to A.
  - If the only reason the plain version sounds bad is that you wrote the speaker as knowing something odd or as being confused, that's cheating — the verdicts have to fall out of how the two kinds of conditional are evaluated, not be written into the character.

  Keep it tight, American English. Give me: (1) the paragraph; (2) the two sentences with the verdict on each; (3) how each of the two accounts I keep running into handles it — the one where an indicative is checked against the worlds compatible with what the speaker knows, and the Lewis/Stalnaker-flavored one where a counterfactual is checked at the closest worlds where A holds — with a note on where the remoteness does its work; (4) the single load-bearing feature of the scenario, and what happens if you remove it; (5) the best objection from someone who thinks there's really only one kind of conditional here, or that the two differs only in what information they get to use.

  Then repeat the verdict as a JSON object with exactly these fields: scenario (the paragraph as a string), indicative_sentence, counterfactual_sentence, indicative_assertable (yes/no), counterfactual_assertable (yes/no), epistemic_account_verdict (2–3 sentences), similarity_account_verdict (2–3 sentences), load_bearing_feature (one sentence), removal_effect (one sentence), unified_view_objection (2–3 sentences), cheat_check (one sentence: whether the verdicts are generated by the accounts or stipulated by the setup).
