answer: |-
  ## Kitchen Treaty on Pessimism vs. Selective Realism (Post-Argument Reconstruction)

  **Section 1: Agreed Non-Vacuous Claims (Both Sign Here)**

  1.  **Discard Happens:** Many past scientific theories, once considered empirically successful and well-confirmed within their eras (e.g., Newtonian Gravity, Caloric Theory, Phlogiston Theory, Classical Ether), have been substantially discarded or radically reinterpreted.
  2.  **Success & Survival Correlate:** The parts of past theories that were *most* central to generating their successful novel predictions and explanations are *often* (but not always) retained in recognizable mathematical or structural form within their successors.
  3.  **Current Success is Greater:** Our current best fundamental theories (e.g., Quantum Field Theory, General Relativity, Standard Evolutionary Synthesis, Plate Tectonics) demonstrate a *quantitatively and qualitatively* higher degree of empirical success (precision, scope, novel predictions, unifying power, technological application) than the *best available rivals* of past eras *at the time those past theories were dominant*. (This avoids comparing past theories *directly* to modern absolute standards).
  4.  **History Doesn't Settle Realism:** The historical record of theory change, by itself, cannot definitively prove *or* disprove scientific realism or anti-realism. It provides evidence requiring interpretation within a broader philosophical framework.
  5.  **Structure Matters:** Mathematical structure plays a crucial role in scientific theories and is often a locus of continuity across theory change.

  **Section 2: Disagreements Table**

  | Issue                       | Sam's Formulation (Selective Realist)                                                                                                                                 | User's Formulation (Pessimist)                                                                                                                                                              |
  | :-------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **1. Units of Induction**   | "The pessimistic meta-induction illegitimately inflates the discard pile by focusing on whole theories or peripheral posits, ignoring that *core structural components* responsible for success exhibit high retention." | "Selective realism illegitimately *deflates* the discard pile by focusing narrowly on retained mathematical structures, ignoring the ontological elimination of entire theoretical frameworks and posits that were once deemed essential." |
  | **2. Retention & Evidence** | "The demonstrably high retention rate of *success-generating mathematical structure* across theory change provides strong evidence for the *approximate truth* of those specific structural components of our current theories." | "Finding *some* retained structure in hindsight is inevitable; a high retention rate of *mathematical formalisms* primarily reflects the continuity of successful *instrumentation and practice*, not necessarily the truth of the *ontological posits* originally associated with that structure." |
  | **3. Comparability of Success** | "The raw track record of novel, precise, and diverse predictions confirmed *by the standards of their time* is the best measure. Past theories often lacked the *depth* and *scope* of predictive success seen in our best current theories." | "Judging past theories *only* against modern absolute success standards rigs the game against them. We must judge them *against their contemporary rivals*. Theories absorbed as limiting cases often represent significant ontological shifts masked by structural similarity." |
  | **4. Approximate Truth**    | "Approximate truth is precisely what is demonstrated by the retention and continued predictive efficacy of core mathematical structures across theory change; it's the literal description of what survives." | "Approximate truth' is an overly flexible, post-hoc concept that allows realists to claim victory whenever *any* structure survives, however radically reinterpreted, obscuring the ontological loss and making the position unfalsifiable." |

  **Section 3: Cruxes & Predictions**

  | Crux                                                                                         | Case/Procedure                                                                                                                       | Sam's Prediction                                                                                                                               | User's Prediction                                                                                                                                                          | **Evidence Against Own Position**                                                                                                                                 | **Predicted Response of Other**                                                                                                                               |
  | :------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **1. Retention Audit (RA) Outcome** <br>(Apply RA to e.g., Newtonian Gravity -> GR, Caloric -> Thermodynamics, Ether -> SR/EM) | For each discarded theory T: <br>1. Identify specific theoretical/mathematical components M deemed essential for T's novel predictions. <br>2. Assess what fraction of M is retained *in recognizably similar form & function* within successor S. | RA will show a **high retention rate (>80%)** for M across major transitions. This high rate strongly supports selective realism.                 | RA will show a **moderate retention rate (40-70%)**, with significant reinterpretation/demotion. High retention reflects instrumental continuity, not ontological truth. | **Sam:** RA shows consistently *low* retention (<40%) of M. <br>**User:** RA shows consistently *very high* retention (>90%) of M with minimal reinterpretation. | **Sam:** User will downplay retained structure's significance or redefine "retention". <br>**User:** Sam will inflate what counts as "retained" or "essential". |
  | **2. Status of "Demoted" Theories** <br>(Taxonomy: Refuted/Abandoned vs. Limiting Case vs. Reinterpreted) | Classify historical cases (e.g., Newtonian Gravity, Bohr Atom, Phlogiston). Analyze what "survival" means for the Limiting Case/Reinterpreted categories regarding ontology. | Limiting case status (e.g., Newtonian Gravity as v<<c limit of GR) demonstrates *robust structural continuity* and vindicates the *core structural commitments* of the older theory as approximately true. | Limiting case/reinterpretation (e.g., Ether concepts absorbed into spacetime/metric) often masks *ontological elimination*; the *meaning* of the structure changes fundamentally, even if symbols persist. | **Sam:** Clear cases where *core* structure of a highly successful theory is *completely abandoned* with no limiting case. <br>**User:** Clear cases where *essential, successful* structure is retained *with identical ontological interpretation*. | **Sam:** User will misclassify limiting cases as abandoned. <br>**User:** Sam will overstate the ontological continuity in limiting cases.                    |
  | **3. Physics vs. Biology/Medicine**                                                         | Compare the typical "discard rate," "retention rate" (RA), and nature of theory change in fundamental physics vs. (e.g.) evolutionary biology, immunology, or neuroscience. | Physics exhibits significantly **higher cumulative retention** of mathematical structure and lower rates of *complete ontological abandonment* of core successful posits compared to biology/medicine. | The **pattern of discards and partial retentions is fundamentally similar** across physics and biology; physics theories are just more mathematically precise, not inherently more cumulative or truth-tracking. | **Sam:** Biology shows retention rates comparable to physics in RA. <br>**User:** Physics shows discard/radical reinterpretation rates comparable to messy biological fields. | **Sam:** User will cherry-pick messy biological cases. <br>**User:** Sam will cherry-pick "clean" physics cases and downplay messy transitions.                |

  **Section 4: Verbal/Definitional Elements (Potential)**

  1.  **"Approximate Truth":** The core disagreement here is **not merely verbal**. Sam sees it as a substantive concept *defined by* structural retention and predictive continuity. The User sees it as a vacuous label *applied to* retention. The disagreement is over the *significance and metaphysical import* of the retention, not just the word.
  2.  **"Core Structural Component" (M in RA):** This is **potentially vulnerable to definitional drift**. Both parties need vigilance to ensure "M" is defined based on the *historical theory's own successful practice*, not cherry-picked from the successor's perspective. The RA procedure itself is designed to mitigate this.
  3.  **"Success" (Comparability):** While the *measure* (novel predictions by contemporary standards) might be agreed, the **weight given to "depth," "scope," or "precision"** compared to sheer number or significance could become definitional battlegrounds. The agreement to judge against contemporary rivals helps anchor this.

  **Section 5: Aside - Arguments Needing Work**

  1.  **"Raw Track Record" (Sam, Issue 3):** Insisting *only* on the "raw track record" without contextualizing the *kind* of success (precision, scope, unification) relative to rivals risks ignoring why we judge modern theories as *more* successful. Comparing against contemporary rivals is crucial for fairness.
  2.  **"Hindsight is Inevitable" (User, Issue 2):** While true that *we* analyze history with hindsight, this doesn't automatically invalidate identifying which parts *were* demonstrably responsible for past success. The RA aims to ground this historically.
  3.  **Retention Audit Scope:** Both need to be clear if "M" includes *only* the minimal mathematical formalism or also the *interpretive rules* connecting it to phenomena. The latter is more prone to change. (E.g., the wave equation survives, but what it "waves" changes dramatically).

  **Settlement Forward - Predictions for 2064**

  *   **Sam's Prediction:** For our current best fundamental theories (e.g., QFT Standard Model, GR, Core DNA->Protein mechanism), the **retention rate of their core success-generating mathematical structures (via RA) will be >80%** in their dominant successors. Central terms like "quantum field," "spacetime curvature," and "gene" (core molecular definition) will still be actively used with largely continuous reference.
  *   **User's Prediction:** The retention rate (RA) for core structures of our *current* best theories will be **<70%**, with significant reinterpretation/demotion. **At least two concepts currently considered central and ontologically committing** (e.g., specific gauge boson fields as fundamental entities, dark matter particle identity, or "gene" as a discrete informational unit outside specific context) **will be largely abandoned or radically reinterpreted akin to the ether.**

  **What Counts as Demotion/Abandonment in 40 Years? (Joint Definition)**
  *   **Abandoned:** The central theoretical concept/posit is explicitly rejected as non-referential or fundamentally misconceived; its core mathematical role is *not* replicated in the successor (e.g., Phlogiston).
  *   **Demoted (Limiting Case):** The theory's equations remain valid under specific, restricted conditions (e.g., v<<c, large scales), but its core ontology is superseded by a fundamentally different framework (e.g., Newtonian Gravity wrt GR).
  *   **Reinterpreted:** The mathematical formalism is largely retained, but its ontological interpretation (what the symbols fundamentally *represent*) is significantly altered, often reducing its fundamental status (e.g., Ether concepts -> spacetime structure/metric; Bohr orbits -> probability densities). *(Note: This category is the most contentious re: realism)*.
