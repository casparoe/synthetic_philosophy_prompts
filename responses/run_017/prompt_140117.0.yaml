prompt: |-
  I direct the methods unit of a national health technology assessment body. About thirty times a year we convene an ad hoc panel of between nine and fifteen people — mostly practising clinicians, plus a patient representative, a health economist, and an epidemiologist when we can secure one — and ask it to reach a verdict, in a single day, on whether the evidence supports one of three recommendations for a screening or diagnostic technology: recommend it, recommend it only within a research programme, or recommend against it. Every panelist receives the same single dossier, which is our own systematic review and meta-analysis, circulated a week in advance. The panel hears presentations, deliberates as a group, and then votes by show of hands. A simple majority carries; the chair breaks ties. The verdict is published with a written rationale and is subject to appeal by the manufacturer or by a professional body.

  I have been reading about the Condorcet jury theorem and the work around it, and I take the headline result to be this: where a question has a correct answer, and each member independently has a better-than-even chance of getting it right, majority accuracy rises with the size of the group and tends to certainty; where each member is worse than even, enlarging the group drives accuracy towards zero and the best jury is a single person. That result seems to me both obviously relevant and obviously inapplicable as stated, and I cannot work out how to turn it into something an office can actually run. Five difficulties:

  First, we hand every panelist the same dossier and then let them talk to one another. Their errors are correlated through a common evidence base and through an open discussion. I have no idea how many genuinely independent assessments a fourteen-person panel represents, or whether a fifteenth person of the same kind and reading the same review is worth anything at all.

  Second, competence is wildly uneven and I am forbidden from acting on it. A colleague in decision science tells me that when members are independent but unequal, the accuracy-maximising rule is a weighted majority in which each person's weight is the logarithm of their odds of being right, so that a member at eighty per cent carries roughly seven times the weight of a member at fifty-five. Is that right, and does it survive once the errors are correlated? Either way I cannot implement differential weights: our panelists are volunteers who would resign, and the appeal panel would strike a weighted vote down as undemocratic. So what should I do instead that captures whatever is true in that result — staged votes, a documented expert assessment treated as evidence rather than as a vote, a smaller panel, abstention by the least-informed members?

  Third, our verdict space has three options, and I gather that majority rule over more than two options can cycle, so that which option wins can depend on the order in which votes are taken. I do not know whether that is a real risk for us or a theorist's worry, and if it is real, how a procedure should handle it: an agenda fixed in advance, a sequence of binary votes, some scoring rule, or something else.

  Fourth, the theorem assumes there is a correct answer. Many of our questions have a large component that is not like that at all — how much avoidable anxiety and overtreatment we are willing to impose for a small reduction in mortality. I suspect a procedure has to sort the epistemic parts of a decision from the evaluative ones before any jury theorem applies to it, and I want that sorting done explicitly rather than left to the chair's instincts.

  Fifth, we deliberate in the open and then vote by show of hands, in that order. I have seen it argued that this both pools information and destroys independence through herding, and that private judgments should be collected first and aggregated separately. Should they? And what is the status of a private straw poll once the discussion has moved everyone — evidence about the group, or a contaminant?

  What I want from you is a written procedure, not a reading list: something I can paste into our methods manual and hand to a panel chair. It must be runnable in under an hour by a methods officer who is not a statistician; it must use only information we actually have, which is each panelist's specialty, their prior service on our panels, and for a minority of them a thin track record on earlier panels whose verdicts were later borne out or not; it must be publishable in the rationale; it must not allocate unequal voting weights; and every branch of it must terminate, either in a recommendation about how to constitute and run the panel or in an explicit hand to a named person on the ground that what remains is a judgment about values rather than a question of accuracy. Give me the questions in order, state what counts as a sufficient answer to each, and mark where the procedure returns a no.

  Then run it on three panels I have to constitute in the next two months.

  One: fourteen people deciding whether to lower the starting age for a cancer screening programme by five years. The evidence is a single meta-analysis with wide confidence intervals and substantial heterogeneity; two panelists have published on the modality and sit on the relevant specialist body; all fourteen have read the same dossier; the patient representative has not.

  Two: eleven people deciding on a diagnostic test for a rare condition. One member has actually run the test; eight have never encountered the condition in practice; the patient representative has lived experience of it and strong views. The spread of relevant competence here is about as extreme as it gets.

  Three: nine people where the factual evidence is unusually clear and the value trade-off is not — the technology detects indolent disease that would never have harmed anyone, producing measurable anxiety and a modest rate of complications from follow-up procedures against a small mortality benefit. My own expectation is that no truth-tracking question survives here at all, and I want to see how the procedure marks that, what it tells us to do with the majority once it does, and what we would be doing if we presented a value judgment as an evidence call in order to make it appeal-proof.

  Finally, tell me where the procedure cannot eliminate judgment however hard we try, what it is incapable of telling us in principle, and — the part I most want — the case in which applying it faithfully would give me an answer I will not like.
reasoning: |-
  Hmm, this is a fascinating and complex query from someone directing a health technology assessment methods unit. They're grappling with how to apply theoretical voting theory (like Condorcet) to real-world panel decisions about medical technologies. Let me unpack this systematically.

  The core tension is between theoretical purity and practical constraints: panels have correlated inputs (same evidence dossier), must handle 3-option votes, deal with uneven expertise they can't formally weight, and navigate epistemic vs value judgments - all while producing defensible, appeal-proof decisions in one day.

  Key constraints jump out:
  - No differential voting weights (political/practical non-starter)
  - Must use existing data (specialty, prior service, limited track records)
  - Procedure must be executable by non-statisticians in <60 min
  - Must explicitly separate factual vs value judgments
  - Needs concrete examples tested

  The theoretical foundations seem sound but brittle:
  1) Condorcet assumes independence and binary choices - both violated here
  2) Competence weighting (log-odds) is mathematically elegant but unimplementable
  3) Three-option voting risks cyclic outcomes
  4) Open deliberation creates herding risks
  5) "Correct answer" may not exist for value-laden decisions

  For the procedure design, I'm considering a staged approach:
  First, force explicit separation of factual vs normative questions upfront. For each component, ask: "Is this about what IS true or what we SHOULD value?" The cancer screening age example clearly has both - evidence interpretation AND acceptable risk thresholds.

  Then for epistemic questions, mitigate correlation through:
  - Silent preliminary voting (to capture independent judgment)
  - Structured devil's advocacy (assign counter-argument roles)
  - Competence-weighted input in discussion (not voting)

  For decision architecture with 3 options:
  - Sequential binary elimination seems most robust
  - Start with highest-evidence-threshold vote (e.g. "recommend against" vs rest)
  - Avoid scoring rules which obscure tradeoffs

  The competence asymmetry problem in the diagnostic test panel is acute. That one clinician who actually runs the test should probably testify as evidence provider rather than voter. The patient rep's lived experience is crucial input but shouldn't overweight technical validity assessments.

  Most revealing will be the indolent disease case. Here the procedure should flag early that no epistemic question remains - it's purely about societal risk tolerance. The panel's role shifts to articulating tradeoffs, not finding "right" answers. Any masking of values as evidence claims (for appeal-proofing) would be identified as procedural violation.

  The "unpleasant truth" scenario might be when a large panel of moderately competent members outvotes a small highly competent minority on a technicality. Mathematically probable but politically explosive - hence the need for explicit competence declarations upfront.

  Testing on their three cases:
  1) Cancer screening: Heterogeneity in meta-analysis means we need independent interpretation first. The two specialists should lead evidence discussion but not vote disproportionately.
  2) Rare diagnostic test: The single experienced clinician's testimony becomes evidence. Patient rep informs values discussion. Voting weight remains equal but input is structured by expertise.
  3) Indolent disease: Procedure should halt after epistemic phase with "no truth-claim possible" declaration. Panel then crafts values-based recommendation with transparent rationale.

  The irreducible judgment points are:
  - Deciding when evidence sufficiency thresholds are met (inherently subjective)
  - Classifying questions as epistemic vs normative (boundary issues)
  - Interpreting sparse track records for competence
  - Managing group dynamics despite structural safeguards

  Ultimately the procedure's strength isn't eliminating judgment but making its exercise visible and auditable. That visibility itself may deter appeals more than pretending values don't exist.
answer: |-
  Below is a complete procedural framework designed for your HTA panel operations. It addresses your five core difficulties while respecting operational constraints (time limits, no weighted votes, publishable rationale, etc.). The procedure explicitly separates epistemic (truth-tracking) from evaluative (value-judgment) questions, mitigates correlated errors, handles 3-option voting, and provides fallbacks for competence asymmetry. It terminates in under 60 minutes and requires only your available data (specialty, prior service, limited track records).

  ---

  **PROCEDURE: HTA PANEL DECISION PROTOCOL**  
  *To be executed by Panel Chair with Methods Officer support*

  ### PHASE 1: PRE-DELIBERATION SETUP (15 MIN)
  1. **Classify Decision Components**  
     Chair asks: *"Does this question have a verifiably correct answer (e.g., 'Does test X detect condition Y with ≥90% sensitivity?') or is it a value trade-off (e.g., 'Is reduced mortality worth increased anxiety?')?"*  
     - **Sufficient answer:** List factual claims (e.g., sensitivity, mortality reduction) separately from value judgments (e.g., acceptable harm-benefit ratios).  
     - **If no factual claim exists:** Skip to Phase 4. Mark rationale: *"No truth-claim component identified; decision rests solely on value judgment."*  

  2. **Declare Competence Relevance**  
     Each panelist states: *"My expertise directly addresses [specific factual claim] because [specialty/publication/experience]."*  
     - Methods officer records declarations in rationale.  
     - **Fallback:** If no panelist claims relevant competence for a factual claim, verdict defaults to "Recommend only within research" with rationale: *"Insufficient specialist competence to assess evidence."*  

  ### PHASE 2: EPISTEMIC ASSESSMENT (TRUTH-TRACKING) (25 MIN)  
  *(Skip if Phase 1 found no factual claims)*  
  3. **Silent Preliminary Vote**  
     - Chair poses *only the factual claim* (e.g., "Meta-analysis shows mortality reduction ≥5%").  
     - Panelists vote **privately in writing** on claim validity: "Supported" or "Not supported."  
     - **Rationale records:** Vote counts and competence declarations (e.g., "7 support, 5 oppose; 4 voters had relevant expertise").  

  4. **Structured Deliberation**  
     - Discussion focuses **only on evidence quality** (e.g., heterogeneity, bias).  
     - Chair enforces:  
       - No value judgments.  
       - Specialists speak first on their claimed competence areas.  
       - At least one panelist argues *against* the majority preliminary view.  

  5. **Final Epistemic Vote**  
     - Re-vote privately on same factual claim.  
     - **Outcome:**  
       - If ≥60% agree, claim is "accepted" or "rejected."  
       - If no 60% majority, mark: *"Inconclusive evidence; insufficient consensus."*  

  ### PHASE 3: EVALUATIVE ASSESSMENT (VALUE JUDGMENT) (15 MIN)  
  6. **Tradeoff Clarification**  
     Chair states: *"Given the evidence [state accepted/rejected claims], what values determine the recommendation?"* (e.g., "How much anxiety is acceptable for a 1% mortality reduction?").  

  7. **Open Deliberation**  
     - Patient representative speaks first.  
     - Health economist frames resource/benefit tradeoffs.  

  8. **Three-Option Vote**  
     - Use **sequential binary voting** to avoid cycles:  
       - Vote 1: *"Recommend"* vs. *"Not recommend"* (includes research/reject).  
       - Vote 2 (if "Not recommend" wins): *"Recommend within research"* vs. *"Recommend against."*  
     - Majority wins each vote; chair breaks ties.  
     - **Rationale records:** Vote sequences and value arguments (e.g., "Patient rep emphasized acceptability of anxiety").  

  ### PHASE 4: VERDICT & RATIONALE (5 MIN)  
  9. **Finalize Recommendation**  
     - Combine outcomes:  
       - If epistemic vote rejected key claim → "Recommend against."  
       - If epistemic vote inconclusive → Default to "Recommend within research."  
       - Evaluative outcome binds if epistemic supports or is neutral.  
     - Publish: (1) Factual claims and votes, (2) Value tradeoffs, (3) Vote sequence.  

  **Termination Conditions:**  
  - **No** if Phase 1 finds no factual basis.  
  - **No** if Phase 2 fallback triggers (incompetence on claim).  
  - Procedure **always ends** within 60 min.  

  ---

  ### APPLICATION TO YOUR PANELS  
  **Panel 1: Cancer Screening Age Reduction**  
  - *Phase 1:* Factual claim: *"Lowering age reduces mortality by ≥X%."* Evaluative: *"Is mortality reduction worth overdiagnosis?"*  
  - *Phase 2:* Preliminary vote → Heterogeneity debate → Specialists speak first. Final vote on claim.  
  - *Phase 3:* If claim supported, vote on value tradeoff via binary sequence.  
  - *Outcome:* High competence asymmetry (2 specialists) → Their inputs prioritized in deliberation but votes not weighted. Rationale documents their declarations.  

  **Panel 2: Diagnostic Test for Rare Condition**  
  - *Phase 1:* Factual claim: *"Test achieves ≥95% sensitivity in real-world settings."*  
  - *Phase 2:* Only 1 panelist (who ran test) claims competence. Fallback: If no others affirm competence → Default "Recommend within research" with rationale: *"Single competent assessor; insufficient for conclusive verdict."* Patient rep input deferred to value phase.  

  **Panel 3: Indolent Disease Detection**  
  - *Phase 1:* **No verifiable factual claim** (mortality benefit small and uncontested; harms uncontested). Mark: *"No truth-claim component."* Skip to value judgment.  
  - *Phase 3:* Open debate on anxiety vs. mortality → Sequential vote. Rationale states: *"Decision rests solely on value tradeoff."*  
  - *Appeal-proofing:* Explicitly separating facts/values prevents masking values as evidence. If attempted (e.g., "Evidence shows anxiety is acceptable"), chair halts and reclassifies.  

  ---

  ### LIMITATIONS & UNPLEASANT TRUTHS  
  1. **Inevitable Judgments:**  
     - Classifying questions as "epistemic" or "evaluative" requires chair discretion (though procedure demands explicit justification).  
     - Setting competence thresholds (e.g., ≥60% for epistemic claims) is normative, not empirical.  

  2. **Blind Spots:**  
     - Cannot resolve correlated errors from shared evidence. Mitigation: Silent voting captures *some* independence.  
     - Track records too sparse to infer individual competence reliably.  

  3. **Unpleasant Outcome:**  
     - In a panel with high competence asymmetry (e.g., 1 expert vs. 10 novices), the procedure may default to "inconclusive" despite expert opposition. Example: If 1 specialist rejects a claim but 10+ novices accept it in Phase 2, claim still passes if ≥60% support. Rationale would show this, but appeal might allege "minority expertise ignored."  

  ---

  **Implementation Note:** This procedure forces transparency where your current process obscures judgment. By publishing epistemic votes and separating values, it strengthens appeal defense more than pretending all decisions are evidence calls. For your three panels, it would:  
  1. Resolve screening age via evidence/value split.  
  2. Default rare test to research due to competence gaps.  
  3. Flag indolent disease as pure value call.  

  Final rationale always shows *where* facts ended and values began—making undemocratic weighting unnecessary.
