  ### **7. Predictable Problems & Solutions**  
  - **Problem: Debate about AI consciousness**.  
    - *Solution*: Pre-empt it: "The cases have *stipulated* IE status (e.g., 'Deceptive AI lacks IE'). Focus on compliance, not reality."  

  - **Problem: Smuggling behavioral criteria**.  
    - *Solution*: After Round 2, ask: "Does your procedure use behavior? How does it test the Locked-In Human?"  

  - **Problem: First round eats the hour**.  
    - *Solution*: Enforce strict timelines. Use a visible timer. After Round 0, say: "You have 60 seconds to swap specs—GO!"  

  - **Problem: Teams resist vague clauses**.  
    - *Solution*: Frame clauses as "regulatory demands"—non-negotiable constraints.  

  - **Problem: Error handling ignored**.  
    - *Solution*: In Round 0, remind: "Your audit must handle unreliable reports (Case 6) and auditor disagreements."  

  - **Problem: Teams disengage if specs implode early**.  
    - *Solution*: Encourage humor: "Regulatory work is messy! Your struggle is the point."  

