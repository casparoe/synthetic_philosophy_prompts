prompt: |-
  So I'm trying to work out what I actually believe about subsidiarity by going case by case, and my verdicts dont obviously add up to anything.

  - Safety standards for goods sold across the whole internal market: EU level, no hesitation.
  - Building codes in a Swiss canton: cantonal, even though one national code would be cheaper for firms that build in several cantons.
  - Framework legislation from the federation that the Länder then fill in: I dislike it on principle, and yet I keep concluding it's fine in practice.
  - EU-level minimum wage floors: no — even though wage competition between member states is real.
  - Travel and quarantine rules in a pandemic: should have been coordinated from the top, and I'm still annoyed it wasn't.
  - Licensing for a trade whose clients never cross a border: state or Land level, obvously.
  - A lower level voluntarily handing a competence upward because it can't fund it: fine by me, which is odd for a principle that's supposedly about protecting the lower level.

  My own stab at a principle: a competence belongs at the level where the people who'd pay the cost of getting it wrong are the same people who'd pay the cost of fixing it. But I suspect that gets either product standards or the pandemic case wrong, and I can't tell which — and it says nothing at all about competences that follow a person instead of a place.

  So: is there a principle that gets most of the seven? Which verdict does it force me to give up? And what does it predict for the case I can't place — say, who sets the rules for a remote worker who lives in one canton, is employed in another, and whose platform is hosted in a third country, so there's no territory whose population is the affected one?
reasoning: |-
  Okay, the user is trying to figure out their beliefs about subsidiarity by examining specific cases. They've listed seven scenarios where they've decided the appropriate level of governance, but they feel their conclusions don't form a coherent principle. They also proposed their own principle but are unsure if it covers all cases, especially one about a remote worker in multiple jurisdictions.

  First, I need to understand each case they provided. They seem comfortable with EU-level safety standards for goods because it prevents a "race to the bottom." Building codes in Swiss cantons should stay local, even if it's less efficient. They dislike framework legislation in principle but accept it in practice. They oppose EU-wide minimum wages despite wage competition. Pandemic travel rules should have been centralized. Local licensing for trades makes sense. And they're fine with lower levels voluntarily ceding power if they can't fund it, which they find odd.

  Their proposed principle ties the level of governance to where those affected by mistakes also bear the cost of fixing them. But they think it might fail in product standards or pandemic cases and doesn't address borderless issues like remote work.

  The user's deeper need is to find a consistent principle that explains their judgments. They might want to reconcile their practical decisions with theoretical subsidiarity, which traditionally emphasizes decentralization. Their acceptance of voluntary centralization and framework legislation suggests they value effectiveness over strict hierarchy.

  I recall that subsidiarity is about decisions being made as closely as possible to citizens but raised to higher levels when necessary. The user's cases show that efficiency, externalities, scale, and collective action problems influence their views. For example, product standards need uniformity to avoid market fragmentation, while building codes can vary locally without major spillover effects.

  Their principle about costs and fixes is interesting but might not account for cases where the affected group isn't local. Pandemic coordination affects multiple regions, so costs aren't contained. The remote worker case highlights jurisdictional overlap, where no single territory's population is solely affected.

  I think I should synthesize a principle that incorporates spillovers and necessary scale. Maybe "Competence belongs at the lowest level capable of internalizing the primary costs/benefits of the decision, unless collective action problems require a higher authority for effective provision." This could cover most cases. For example, pandemic rules need coordination because unilateral actions harm others. Minimum wages might have localized impacts despite competition, so national levels suffice. The remote worker case would need a supranational agreement or harmonized rules since no single jurisdiction covers all aspects.

  Their verdicts mostly align, except perhaps minimum wages and framework legislation. They oppose EU minimum wages but accept framework laws. The principle might challenge their opposition to minimum wage floors if wage competition creates negative externalities, but they might prioritize national autonomy over efficiency here.

  For the remote worker, the principle suggests a higher level or treaty-based rules because the costs and fixes span multiple jurisdictions. The user might need to accept some centralized solutions where local control isn't feasible.
answer: |-
  Your case-by-case approach reveals a nuanced understanding of subsidiarity—and your struggle to find a unifying principle is *entirely normal*. Your judgments mostly align with classic subsidiarity theory, but with pragmatic exceptions. Here's a synthesis, the verdict it forces you to reconsider, and the remote worker solution:

  ### A Proposed Principle That Captures 6/7 Cases
  **"Competence belongs at the lowest level capable of internalizing the primary costs/benefits of the decision, unless collective action problems require a higher authority for effective provision."**

  How it explains your judgments:
  1.  **Goods Safety Standards (EU):** Costs of unsafe goods (market fragmentation, safety risks) spill across borders. Only the EU can internalize these. ✅
  2.  **Swiss Building Codes (Cantonal):** Costs of poor codes (safety, aesthetics) are primarily local. Firms' cross-canton costs are secondary efficiency issues, not existential risks. ✅
  3.  **Framework Legislation (Acceptable):** Permissible if the *core negative externalities* (e.g., environmental harm, rights violations) require a federal minimum standard, while implementation respects local variation. Your pragmatism is justified. ✅
  4.  **EU Minimum Wage Floors (Your "No"):** *The principle challenges this.* If wage competition creates a "race to the bottom" harming workers *across borders* (a negative externality), and national governments are pressured not to act alone, the EU *might* be the only level capable of internalizing this. ❌ (Forces reconsideration)
  5.  **Pandemic Travel Rules (EU):** Uncoordinated rules imposed massive cross-border costs (supply chains, stranded citizens, variant spread). Only a supranational body could internalize these. ✅
  6.  **Local Trade Licensing (State/Land):** Impacts are purely local; no significant cross-border spillovers. ✅
  7.  **Voluntary Handover (Fine):** If a lower level *cannot* internalize costs/benefits due to lack of scale/resources (e.g., large infrastructure, scientific research), voluntary upward delegation solves the collective action problem. This *is* subsidiarity in action. ✅

  ### The Verdict You Must Give Up: Minimum Wage Floors
  *   **Why your "No" clashes:** Your principle demands that if negative externalities (suppressed wages, social dumping) spill across borders *and* national governments are structurally unable/unwilling to fully address them due to competitive pressure, a higher level *is* justified to internalize these costs. Wage competition isn't just "real"; it's a textbook collective action problem.
  *   **Possible Reconciliation:** You might argue the *primary* costs (low wages hurting workers) *are* local/national, and the cross-border element (competition) is indirect. But your acceptance of EU goods standards (where competition is also indirect) weakens this. Alternatively, you might prioritize national sovereignty on core social policy regardless of spillovers, but that moves away from subsidiarity towards pure sovereignty.

  ### Predicting the Remote Worker Case
  *   **The Problem:** The worker's activity (labor, residence, platform location, client location potentially) spans jurisdictions. No single territory's population bears *all* costs/benefits:
      *   **Residence Canton:** Benefits from taxes? Bears social service costs?
      *   **Employment Canton/Land:** Labor law application, employer taxes? Social security?
      *   **Platform Jurisdiction:** Data rules, platform liability?
      *   **Worker/Client Locations:** Where is income generated? Who consumes the service?
  *   **Application of the Principle:**
      1.  **Identify Primary Costs/Benefits:** Key issues are worker protection (wages, safety), fair taxation, consumer protection (if applicable), data privacy, and social security.
      2.  **Assess Spillovers:** Uncoordinated rules create chaos: double taxation, regulatory gaps, unfair competition, worker vulnerability.
      3.  **Find the "Lowest Level Capable of Internalizing":**
          *   **Single Canton/Land/State?** No. It cannot control rules elsewhere affecting the worker/platform.
          *   **National Level?** Better, but still can't resolve cross-border platform location or inter-canton employment/residence splits effectively.
          *   **Supranational Agreement (e.g., EU, Treaty)?** Necessary to set core minimum standards for worker status, data, tax apportionment rules, and social security coordination that internalize the cross-border costs.
          *   **Harmonized Implementation:** Rules set via treaty/minimum standards, but *applied/enforced* based on clear connecting factors:
              *   **Labor Law:** Primarily the law of the *place of habitual work* (often home for remote) OR employer's location (prevailing in EU).
              *   **Taxation:** Residence vs. Source rules determined by treaty (prevailing model: residence-based taxation with source-state reporting/withholding).
              *   **Social Security:** Determined by *place of work* rules within frameworks like EU regulations.
              *   **Data/Platform Rules:** Governed by the platform's jurisdiction *or* user's location (e.g., GDPR), requiring international alignment.
  *   **Prediction:** The principle dictates **supranational harmonization of core rules** (via treaty/minimum directives) to internalize the cross-jurisdictional externalities, **combined with clear, treaty-based conflict-of-law rules** assigning specific responsibilities (tax, labor law, social security) to specific jurisdictions based on objective factors (residence, work location, employer location, platform establishment). No single "territorial population" is the sole affected group; a coordinated framework across the affected jurisdictions *is* the subsidiarity solution.

  **In essence:** Your judgments reveal a subsidiarity grounded in **problem-solving effectiveness** and **containing negative externalities**, not just decentralization dogma. The minimum wage case is the outlier where your practical recognition of spillovers (wage competition) logically points towards a higher-level solution than you currently accept. The remote worker case shows subsidiarity's limits with borderless activities, demanding *coordinated* solutions rather than pure localization.
