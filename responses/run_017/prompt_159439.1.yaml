prompt: |-
  You are a political philosopher who also works on tax policy. I sit on a commission that is redrafting our inheritance tax, and I don't want to vote on instincts I can't state as a principle, so please work from my cases rather than from the standard pro-and-con list. Brainstorm several candidate principles before committing to any of them, and be explicit about where each one breaks. No citations or reading lists.

  Here are my verdicts, as I actually have them.

  1. A distant acquaintance leaves me eight million in index funds: tax it hard, seventy per cent or more, and I feel no complaint.
  2. My cousin inherits the dairy farm she has milked since she was fifteen, worth about as much on paper but illiquid and unsellable without ending the farm: tax it lightly or not at all.
  3. A founder hands her company to a son who has run the sales side for ten years: light tax. The same company to a son who will flip it to a competitor the week after probate: heavier tax. I know this is odd, since the assets and the recipient's resulting wealth are the same in both halves; what it seems to track is whether the firm survives.
  4. A grandparent pays private-school fees directly, during life: I am uneasy about taxing that, even though it is the same transfer of advantage as a bequest and shapes the child's competitive position even more directly.
  5. Wealth traceable to a legally authorised but now-condemned wrong, held by a grandchild who had nothing to do with it: I want this taxed harder than ordinary inherited wealth, and the thought "she did not earn it" does not explain why, since that is equally true of ordinary inherited wealth.
  6. An heir with severe disabilities whose entire inheritance buys care and never converts into any advantage over anyone: my objection to inheritance largely evaporates, even at twenty million.
  7. A perpetual dynasty trust paying great-grandchildren unearned income indefinitely: this strikes me as worse than the same sum handed over outright at death, and worse than I can justify by size alone.
  8. The inheritances I think matter most for equal opportunity — a good school district, a parent's professional network, a stable household — I do not want taxed at all, and I cannot say why they fall outside the base while the farm falls inside it.

  Two cases I go back and forth on: two siblings split ten million, one a surgeon and one a care worker, and some days I want the tax to depend on what each already has, other days I think the recipient's own earnings are irrelevant. And I keep changing my mind about whether money that funds a life of no competition but real social value — endowing a young mathematician to do research instead of consulting — is the best or the worst case for taxing.

  The principle I keep returning to is: tax transfers at death to the extent they hand the recipient unearned competitive advantage, and exempt them to the extent they preserve a form of life the recipient's plans are already built around. It seems to handle 1, 2, 3 and 6 and to have nothing to say about 5 and 8.

  What I want from you: state that principle, or the two or three best candidates, precisely and clause by clause, naming the case that motivates each clause; say what each predicts for the cases I have not settled — the unequal siblings, the endowed mathematician, and inheritance received at seventy rather than twenty-five; and tell me honestly which of my verdicts the best available principle cannot accommodate and which ones I should give up.
reasoning: |-
  Hmm, the user is a policymaker on an inheritance tax reform commission, seeking philosophical grounding for their intuitive judgments on specific cases. They've presented eight clear verdicts plus two unresolved cases, and want principles that explain these intuitions without resorting to standard tax policy arguments. 

  Key observations from their cases: they're deeply concerned about (a) the competitive distortion of unearned advantage, (b) the moral weight of continuity in life projects, and (c) the social value of preserved enterprises. But they're troubled by contradictions - why tax the farm but not the school district? Why condemn dynastic wealth but exempt disability care? 

  Their draft principle about "unearned competitive advantage" has holes: it can't explain their condemnation of tainted wealth (case 5) or discomfort with private school payments (case 4). Meanwhile, cases 7 and 8 reveal a deeper tension between opportunity-equalizing and community-sustaining goals.

  The three principles I'm considering all grapple with this core dilemma:
  - The Competitive Fairness Principle focuses strictly on market distortion, which handles cases 1/3/7 well but fails the farm (2) and disability (6) exemptions. 
  - The Life-Continuity Principle privileges embeddedness in existing projects, explaining 2/3/4/6 but justifying dynastic trusts (7) if they maintain continuity.
  - The Social Valuation Principle introduces collective judgment about worthiness, which captures 2/3/5/7 but feels uncomfortably paternalistic.

  For their unresolved cases: 
  - The surgeon/care worker split exposes whether disadvantage compensation should override neutrality. Competitive Fairness says tax equally; Life-Continuity might exempt the care worker if funds preserve their lifestyle. 
  - The mathematician endowment is a Rorschach test: Competitive Fairness condemns it as unearned advantage; Social Valuation might exempt it as meritorious.

  Honestly, no principle salvages all their intuitions. They'll need to surrender either taxing condemned wealth (5) - which requires a desert-based logic alien to their framework - or exempting opportunity-shaping intangibles (8), which are competitively potent but exist outside transfer systems. The private-school payment case (4) suggests they already sense this tension.

  The path forward might be nesting principles: use Competitive Fairness as the default base, then overlay Life-Continuity exemptions for verifiable embeddedness (farms, disability care), plus a separate clawback for illicitly obtained assets. But that still leaves dynastic trusts and opportunity goods unresolved - perhaps intentionally, as those require democratic deliberation beyond philosophical neatness.
answer: |-
  Below are three candidate principles distilled from your cases, each articulated clause-by-clause with motivating cases. I then test them against your unresolved cases and identify tensions with your verdicts.

  ---

  ### **Principle 1: Embedded Life Preservation + Anti-Rentier**  
  *"Tax inheritance to disrupt passive advantage, but protect transfers essential to sustaining existing life projects or compensating for disadvantage."*  
  - **Clause A**: Tax *heavily* when wealth transfers confer **liquid, passive assets** with no connection to the heir’s life work (Case 1: distant acquaintance’s index funds).  
  - **Clause B**: *Exempt* transfers preserving **non-speculative, identity-constitutive enterprises** actively stewarded by the heir (Case 2: dairy farm; Case 3: son running the company).  
  - **Clause C**: *Exempt* wealth that **wholly mitigates inherent disadvantage** without conferring competitive gains (Case 6: disability care).  
  - **Clause D**: Tax *heavily* **perpetual unearned income streams** detached from labor or social value (Case 7: dynasty trusts).  
  - **Breakage**: Fails Case 5 (tainted wealth) and Case 8 (intangibles like networks). No intrinsic objection to "clean" passive wealth if not dynastic.  

  ---

  ### **Principle 2: Social Continuity + Merit of Use**  
  *"Tax based on whether the transfer perpetuates socially valuable activity or enables harmful rent-seeking."*  
  - **Clause A**: Tax *minimally* if inheritance **sustains productive community institutions** (farms, firms, research endowments) (Cases 2, 3, mathematician).  
  - **Clause B**: Tax *heavily* if assets enable **purely extractive or speculative control** (Case 3: son flipping the company; Case 7: dynasty trusts).  
  - **Clause C**: *Exempt* transfers **remediating inherent inequalities** (disability, unequal siblings’ care worker) or **directly funding human capital** (Case 4: school fees; Case 8: school districts/networks).  
  - **Clause D**: Apply a **"clean hands" surtax** for wealth from historic injustice (Case 5: condemned wrongs).  
  - **Breakage**: Case 1 (passive index funds) lacks extraction—taxation feels arbitrary. Case 6 (disability) exemption risks loopholes for "social value" claims.  

  ---

  ### **Principle 3: Competitive Equilibrium**  
  *"Tax to offset unearned advantages distorting fair competition, but shield stability-enabling transfers."*  
  - **Clause A**: Tax the **net present value of competitive advantage** conferred, accounting for recipient context (Case 1: distant windfall vs. Case 8: school districts untaxed as "universalizable").  
  - **Clause B**: *Exempt* assets locking heirs into **pre-existing life paths** without amplifying privilege (Cases 2, 3, 6).  
  - **Clause C**: Tax *progressively* based on **recipient’s total life-stage opportunity** (e.g., inheritance at 70 > 25; surgeon sibling > care worker).  
  - **Clause D**: Penalize **dynastic accumulation** disrupting intergenerational competition (Case 7).  
  - **Breakage**: Case 4 (school fees) remains uneasy—directly shapes competition. Case 5 (tainted wealth) requires non-competitive moral logic.  

  ---

  ### **Predictions for Unsettled Cases**  
  | Case                  | Principle 1                     | Principle 2                     | Principle 3                     |  
  |-----------------------|---------------------------------|---------------------------------|---------------------------------|  
  | **Unequal siblings**  | Tax surgeon heavily; exempt care worker (disadvantage) | Tax surgeon; exempt care worker (remediative) | Progressive tax: surgeon pays more (total advantage) |  
  | **Endowed mathematician** | Light tax (social value)      | Exempt (productive use)         | Heavy tax (unearned advantage) unless structured as salary |  
  | **Inheritance at 70** | Moderate tax (less competitive impact) | Low tax (funds stability, not opportunity) | Low tax (replaces earned income) |  

  ---

  ### **Honest Tensions: What Must Give**  
  1. **Case 5 (Tainted Wealth)**: *All principles struggle.* Your verdict demands **desert-based taxation**, but inheritance taxes typically avoid moral audits. To accommodate this, add a standalone "unjust enrichment" clause (e.g., *"Levy a surtax on wealth traceable to crimes against humanity"*).  
  2. **Case 8 (Intangibles)**: *Exempting these breaks consistency.* Networks/school districts confer massive advantage but evade taxation because they’re non-monetary and diffuse. Principle 3’s "universalizable" exemption (e.g., public goods) is ad hoc. **Admit**: Life-enabling transfers (farm, school) are exempt, but intangibles like networks are beyond tax policy’s reach.  
  3. **Case 4 (School Fees)**: Unease persists because *timing shouldn’t negate competitive impact*. Principles 1 and 3 would tax this as inter-vivos transfer unless deemed "human capital investment." **Concede**: Transfers for education may be exempt if means-tested.  

  ---

  ### **Recommendation**  
  **Refine Principle 3 (Competitive Equilibrium)**—it best explains your core intuitions (Cases 1–3, 6–7) and addresses life-stage/recipient context. To fix gaps:  
  - Add a **"clean hands" surtax** for Case 5.  
  - Explicitly **exempt in-kind human capital transfers** (school fees, networks) as *precompetitive foundations*, separating them from capital transfers.  
  - Treat **dynasty trusts** as a separate category (e.g., annual inheritance tax on distributions).  

  **Sacrifices required**:  
  - Abandon taxing **recipient wealth independently** (e.g., surgeon sibling)—tax the transfer, not the recipient.  
  - Accept that **condemned wealth** requires non-standard moral reasoning.  
  - Acknowledge that **"preserving life projects"** (farm) and **"preventing rent-seeking"** (dynasty trust) are distinct goals—one may need priority over purity.  

  This forces clarity: Is the tax’s purpose **correcting opportunity inequality** (tax windfalls) or **safeguarding social enterprises** (exempt continuity)? Your cases lean toward the latter—so build exemptions narrowly.
