   Let's try the following example from the literature (adapted from Keefe):

   A town has a bylaw: "Vehicles are not allowed in the park."
   A borderline vehicle (e.g., a skateboard) is brought in.
   The rule: "It is forbidden to bring a vehicle into the park."

   Let P = "skateboard is a vehicle".

   Borderline.

   Then, the sentence "It is forbidden to bring the skateboard" is true in precisifications where P is true, false where P is false. So not supertrue.

   Therefore, it is not definitely forbidden. But then is it allowed? Not definitely.

   However, in practice, the town council might interpret the bylaw as not definitely applying, so they allow it.

