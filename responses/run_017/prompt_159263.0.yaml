   I found an example that might work for the reversal, but it's for a different purpose.

   Consider the following rule for a workplace: 
     "Safety goggles must be worn if the noise level is high."
     Vague predicate: "high noise level".

   Suppose the noise level is borderline high.

   Then, in epistemicism: either the noise level is high or not. If it is, must wear; if not, then not required. But we don't know.

   in supervaluationism: the condition "noise level is high" is not supertrue, so the obligation to wear goggles is not in force? Therefore, it is not required to wear them.

   This gives a clear outcome: goggles are not required.

   whereas in epistemicism, it might be required (if in fact the noise level is high), but we don't know, so we might have to wear them to be safe.

   But the semantic theories are about truth conditions, not about what we do.

   In the supervaluationist semantics, the sentence "goggles must be worn" is not true (since it's not supertrue), so it is false that they must be worn. Therefore, it is not obligatory to wear them.

   This is a clear outcome: it is not obligatory.

   In epistemicism, the sentence "goggles must be worn" is either true or false, but we don't know which. So we don't know if it is obligatory or not.

   Therefore, for the decision of whether the goggles are obligatory, supervaluationism says no, while epistemicism says we don't know.

   This is a clear reversal.

   Let's write it up.

  Scenario: Workplace safety rule.

   The rule: "Safety goggles must be worn if the noise level in the area is high." 
   Assume that this is interpreted as: if the noise level is high, then the goggles are obligatory; if the noise level is not high, then the goggles are not obligatory. (This is the typical interpretation of such rules.)

   Vague predicate: "high noise level".

   Suppose we have a machine that produces a noise level that is borderline high.

   Let P = "the noise level is high".

   Both theories agree that P is borderline.

   Key sentence for the obligation: "Safety goggles must be worn." Let's call this O.

   But O is not directly the key sentence. The rule is: O if P.

   So O is equivalent to P being true, because the rule establishes that O is true exactly when P is true.

   In other words, the rule is: O iff P. (Because when P is true, O is true; when P is false, O is false.)

   So we can take the key sentence to be O, which is equivalent to P.

   But to be precise, let's take the key sentence as P.

   Now, what does the decision-maker need to know? They need to know if goggles are obligatory (O).

   Epistemicism:
     - P is either true or false, so O is either true or false.
     - But since P is borderline, we don't know whether O is true or false.

   Supervaluationism:
     - P is borderline, so it is not supertrue.
     - Therefore, O is not supertrue.
     - In supervaluationism, the truth of the obligation sentence O requires supertruth.
     - Therefore, O is not true -> so it is not the case that goggles are obligatory.

   Hence, the decision-maker knows that goggles are not obligatory.

   This is a clear outcome.

   Now, to satisfy specification (3): rephrasing.

   Version A: "Goggles are obligatory if the noise level is high." (O if P)
   Version B: "Goggles are not obligatory unless the noise level is high." (not O unless P) 

   Version B is equivalent to: if not P, then not O; and if P, then O. -> O iff P.

   So both versions are equivalent to O iff P.

   In both versions, the analysis is the same.

   Therefore, in supervaluationism, for borderline P, O is not true -> so in Version A, the condition is not met, so O is not true. In Version B, "not O unless P" is equivalent to O only if P, so again O is true only if P is true. Since P is not true (not supertrue), O is not true.

   Moreover, in Version B, we can see that "not O unless P" is a way of saying that if O is true, then P must be true. So if P is not true, then O is not true.

   Walkthrough:

  1. Key sentence: P = "the noise level is high" (borderline).

  2. Epistemicism:
     - There is a fact about whether P is true or false, and correspondingly about whether O is true or false.
     - But since we cannot know whether P is true, we cannot know whether O is true.

  3. Supervaluationism:
     - P is borderline, so it is not supertrue.
     - The rule establishes that O is true if and only if P is true.
     - Therefore, O is true only if P is true.
     - Since P is not supertrue, O is not supertrue, so O is not true.

  4. Outcome: 
     - In epistemicism, we don't know if goggles are obligatory.
     - In supervaluationism, we know that goggles are not obligatory.

   Which feature is doing the work? 
     The fact that the obligation is conditional on the vague predicate, and in supervaluationism, the condition not being supertrue means the obligation does not hold.

   What if we added "definitely"?
     If the rule said: "Goggles are obligatory if the noise level is definitely high", then in supervaluationism, for borderline P, definitely P is false, so O would be false. But we are not allowed to use definitely.

   What if the decision-maker could lay down a bright line? 
     Then they could stipulate a precise noise level, and then they would know. But in our case, they haven't, and the theory must work with the vague predicate.

   The epistemicist's best counter:
     - The supervaluationist's outcome is based on the lack of supertruth, but in reality, there is a fact of the matter about whether the noise level is high, and hence about whether the goggles are obligatory. By saying that goggles are not obligatory, the supervaluationist might be getting it wrong (if in fact the noise level is high) and that could have safety implications.
     - Moreover, the supervaluationist's approach might encourage risk-taking: if the condition is not definitely met, then no obligation, even though it might be met.
     - Additionally, epistemicism might be more in line with legal practice, which often assumes bivalence: the rule either applies or it doesn't, and if there's a dispute, a court will decide (and thus create a precise cutoff if needed).

   However, the cost for the epistemicist is that in borderline cases, the decision-maker simply cannot know what to do based on the rule. They have to guess or use additional criteria.

   In summary, the scenario is:

     In a factory, a safety rule states: "Safety goggles must be worn if the noise level in the area is high." 
     The noise level of a particular machine is a borderline case of being high. 
     According to supervaluationism, since it is not definitely true that the noise level is high, it is not true that goggles are obligatory, so workers are not obliged to wear them. 
     According to epistemicism, it is either obligatory or not, but we cannot know which, so the rule does not provide a clear instruction.

   This meets the requirements.
