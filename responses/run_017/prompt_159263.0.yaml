   But to have a clear outcome, we need to know if they are obliged to return or not. The rule says: in precisifications where P is true, they are not obliged to return. In those precisifications, they might be allowed to keep it. In precisifications where P is false, they are obliged to return.

   So overall, the landlord is not obliged to return in every precisification (because in some they are not) -> so "must return" is not supertrue -> so they are not obliged to return. Therefore, they may keep it? But that's not accurate because in some precisifications they are obliged to return, so if they keep it, they are violating the rule in those precisifications.

   So the safe thing is to return it, to avoid the risk of violation in the precisifications where P is false.

   This is practical, but not semantic.

