  ### Thought Experiment: Workplace Safety Bonus  
  **Scenario**: A factory has a safety bonus rule: "Any worker receives a $500 bonus if they do not cause a safety violation during the quarter." The rule is paired with a safety policy: "Operating machinery without safety goggles counts as a safety violation if the noise level is high." A worker, Alex, operated machinery without goggles. The noise level during Alex's shift was measured at 85 dB—a genuine borderline case for "high noise level" (e.g., industry guidelines vaguely define "high" as 80–90 dB, with no sharp cutoff). The factory manager must decide whether Alex gets the bonus.  

  #### Key Sentence  
  The sentence triggering the disagreement is:  
  **P**: "The noise level was high."  

  #### Analysis  
  Both theories treat **P** as a genuine borderline case. The bonus rule hinges on whether Alex caused a safety violation, which depends on **P**:  
  - Safety violation occurs iff **P** is true (since goggle-less operation only violates if noise is high).  
  - Thus, Alex gets the bonus iff **¬P** (no safety violation).  

  ##### Supervaluationism's Verdict: Alex Gets the Bonus  
  - **P** is borderline, so it is neither supertrue nor superfalse.  
  - **¬P** ("The noise level was **not** high") is also borderline:  
    - In some admissible precisifications (e.g., defining "high" as ≥84 dB), **P** is true → **¬P** is false.  
    - In others (e.g., "high" as ≥87 dB), **P** is false → **¬P** is true.  
  - Crucially, the bonus rule requires **¬P** to be true for Alex to get the bonus. But **¬P** is **not supertrue** (since it's false in some precisifications).  
  - However, the **safety violation clause** ("violation if **P**") requires **P** to be supertrue to count as a violation. **P** is not supertrue → **no safety violation** is supertrue.  
  - Thus, the condition for denying the bonus (safety violation) **fails to hold supertrue**. By default, Alex qualifies for the bonus.  
  - **Outcome**: Decidable—Alex receives the bonus.  

  ##### Epistemicism's Verdict: Undecidable (No Clear Answer)  
  - **P** has a precise truth value (true or false) due to bivalence, but it is unknowable.  
  - If **P** is true, Alex caused a violation → no bonus.  
  - If **P** is false, no violation → bonus.  
  - Since we cannot know **P**'s truth value, we cannot know whether Alex gets the bonus.  
  - **Outcome**: No usable verdict—the manager cannot determine eligibility based on the rule.  

  #### Reversal Survival (Spec 3)  
  Rephrase the bonus rule as: **"Workers are ineligible for the bonus if they cause a safety violation."**  
  - This is equivalent to "eligible iff **¬violation**" (same as original "eligible unless violation").  
  - Supervaluationism: Violation requires **P** supertrue (not met) → Alex remains eligible.  
  - Epistemicism: Violation is either true or false (unknowably) → eligibility is unknowable.  
  **Result**: Reversal persists—supervaluationism still gives a clear outcome; epistemicism does not.  

  #### Feature Doing the Work  
  **The safety violation clause embeds the vague predicate in a conditional antecedent** (e.g., "violation **if P**"). Supervaluationism propagates the gap upward:  
  - **P**'s borderline status → **P** not supertrue → conditional clause ("violation if **P**") not triggered → **no violation** holds by default.  
  - In epistemicism, bivalence forces a binary truth value for **P**, but ignorance prevents decision-making.  

  #### If Modified  
  - **Add "definitely"**: If the rule said "violation if **definitely P**," supervaluationism would deny the violation (since **P** isn’t supertrue), still awarding the bonus. But this violates Spec 4 (no special operators).  
  - **Bright-line stipulation**: If the manager sets a cutoff (e.g., "high = ≥85 dB"), **P** becomes precise. Both theories then agree on the outcome (bonus or not), eliminating the reversal.  

  #### Epistemologist's Best Counter  
  **Counterargument**: "Supervaluationism's 'decidable' outcome is illusory because 'admissible precisification' is itself vague. Legal/practical decision-making assumes bivalence, so epistemicism aligns with real-world institutions that treat borderline cases as having hidden sharp cutoffs (e.g., courts impose precise standards when forced)."  
  **Cost**:  
  - Epistemicism must accept that some rules are **practically inapplicable** in borderline cases (e.g., the manager has no semantic basis to decide).  
  - This clashes with institutional needs for **actionable verdicts**, forcing decision-makers to *impose* cutoffs extralinguistically (e.g., guessing or stipulating). Thus, epistemicism's "clean" classical logic fails to guide decisions when ignorance is inescapable, while supervaluationism leverages gaps to yield default outcomes.  

  **Honest Assessment**: This counter costs epistemicism its claim to being "decision-friendly." It concedes that supervaluationism better handles default reasoning in vague contexts, even if "admissible precisification" has higher-order vagueness. Legal practice often resolves borderlines by fiat, but this is a *practical override*, not a feature of the semantic theory itself.
