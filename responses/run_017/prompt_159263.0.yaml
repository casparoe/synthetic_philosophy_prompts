   After research, I recall that in supervaluationism, the truth value of compound sentences can be supertrue or superfalse even with borderline components. For example, "P or not P" is supertrue. But that doesn't help with our decision.

   Another example: if the rule is "The bonus is paid if the employee has been not excessively late or the CEO approves." and the CEO hasn't approved, then the condition is " not P", which is borderline, so the sentence " not P or CEO approves" is borderline, since in precisifications where P is true, the sentence is false (assuming CEO doesn't approve).

   So not supertrue.

