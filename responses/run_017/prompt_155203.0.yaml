prompt: |-
  You are an expert in the epistemology of social-science measurement who has also spent years designing grant portfolios for large philanthropic foundations; you have sat through hundreds of committee meetings and you know how quantitative proposals actually die in the room. Please take this seriously and do not flatter me. Before producing the deliverable, spend a short brainstorming pass (a few paragraphs, kept private in your working) listing every fault line you can find in my position, deciding which committee member would notice each one, and ranking them by the damage they would do to the vote; only then write the prep sheet. Think carefully about where my framework is genuinely weakest, not about the objections I have obviously already anticipated.

  Two weeks from now I am presenting to the allocation committee of a mid-sized foundation that funds global health and economic development, and I need to be ready for the question period. The room is six people:

  1. The chair, a development economist trained in randomized trials, who hears every claim as a question about identification, external validity, and the difference between efficacy and effectiveness at scale.
  2. A second economist, an institutional and political economist, who thinks the large determinants of cross-national well-being are institutions and state capacity, and who regards project-level measurement as noise around a signal nobody is measuring.
  3. A quantitative program officer who is personally sympathetic to effective altruism, donates a large share of her income, and has organized her career around earning to give; she is the person most likely to think my proposal attacks her own life choices.
  4. A philosopher of science who serves as the committee's in-house skeptic about measurement, model uncertainty, and the use of expected-value reasoning under thick uncertainty.
  5. A program officer with a background in labour and community organizing, who distrusts the framing of political work as an "intervention" with an effect size.
  6. A board member from asset management, who thinks in terms of diversification, factor exposure, and option pricing, and who has no patience for upside that cannot be priced.

  The thesis I am defending: effective altruism's cost-effectiveness-driven allocation is subject to a systematic, correctable bias that I call measurability bias, and the correction is large enough to justify a standing structural sleeve of roughly a fifth of the grant budget for institutional and systemic work whose effects are hard to measure but whose upside is large and whose main byproduct is information about structural causes.

  My argument, so you have something to aim at. Step one, the diagnosis: cost-effectiveness estimates are not produced under uniform conditions of evidence. Some interventions are cheap to measure well — a bednet distribution with a mortality or parasitemia endpoint; others are inherently expensive to measure, because the causal chain is long, the unit of treatment is a policy or a coalition, and the counterfactual is a legislature rather than a village. I define the measurement elasticity of an intervention as the ratio of how much its measured cost-effectiveness moves to how much its true cost-effectiveness moves, as measurement effort varies; interventions with high measurement elasticity get measured more, and measured better, and therefore rise to the top of the ranking partly because they are legible. Call the resulting distortion the measurability factor: the ratio by which ranked estimates systematically misrepresent true impact. I will argue it is bounded but large, plausibly on the order of two to twenty for the systemic end of the range.

  Step two, the portfolio framing: measurability is not an independent risk factor, it is a shared exposure. Everything at the top of a cost-effectiveness ranking is top-ranked partly for the same reason, so the portfolio is undiversified along a dimension nobody is tracking. That is an argument for deliberately holding assets whose value is not driven by that factor.

  Step three, the information externality: systemic interventions produce, as a byproduct, evidence about which structural causes matter and how pliable they are. That evidence is a public good for the whole funding ecosystem, it is not captured by the intervention's own cost-effectiveness estimate, and it is exactly the kind of evidence the measurable end of the portfolio never generates. I call this the structural-learning option, and I treat its expected value as part of the intervention's value.

  Step four, a defensive move I expect to need on earning to give: the standard replaceability objection — that the counterfactual impact of one more high earner is near zero because someone else would have taken the job — applies symmetrically to measured and unmeasured interventions, since both are funded at the margin by the same pool of donors, so it cannot be used to defend the measurable end of the portfolio against my argument without also dismantling the case for earning to give itself.

  What I want from you is a prep sheet, not a defense. Give me eight to ten objections in the order they will actually come, ranked by likelihood times damage. For each one: the committee member who raises it; the objection phrased the way that person would really phrase it, in their idiom (identification, attrition, and effects at scale from the chair; priors, model uncertainty, and fanaticism from the philosopher; correlation, factor exposure, and unpriceable options from the board member; legitimacy, consent, and the non-fungibility of political work from the organizer); a reply I can deliver in about ninety seconds; and one sentence on where that reply is soft. Separate out what I should concede on the first two slides, before anyone asks, from what I should hold. Flag the single reply that has to land for the proposal to survive the vote, and identify the question I am hoping nobody asks, who would ask it, and why it is the dangerous one.

  Two constraints. First, I cannot look anything up and I do not want a bibliography, a reading list, or citations: if an objection or a reply leans on an empirical result, name the result in plain terms and mark it CHECK BEFORE THE MEETING rather than attributing it to a study. Second, assume the committee will demand a number at least twice — for the size of the measurability factor, and for the size of the sleeve — so tell me how to answer when I do not have a defensible one, and what it costs me if I answer honestly.
