prompt: |-
  I've been asked to serve as the token political philosopher on the research-advisory group of a constitutional-reform commission, and I want to use my one real lever — a small pot of money for conceptual and normative work, roughly six postdocs for two years plus a handful of commissioned papers — well. The commission is considering replacing the upper chamber of a mid-sized parliamentary democracy with a randomly selected assembly whose members serve terms of randomly drawn, unpredictable length, with a continuous trickle of replacements rather than synchronized turnover. Almost nothing else about the design is settled yet: whether service is compulsory (on the jury-duty model) or drawn only from a pool of self-selected volunteers; whether members may delegate their vote or their deliberation to expert advisers; what jurisdiction the chamber has relative to the elected lower house; and who sets the rules of the lottery itself, including who controls the chamber's agenda. The commission must fix these details within about eighteen months, so the research has to be decision-relevant on that timescale, and my colleagues in the politics department keep reminding me that any question whose answer depends on how real assemblies actually behave belongs to their budget, not mine.

  What I want from you is a defended research agenda, not a survey. Give me the four or five open conceptual questions you would prioritize, in order, and argue for the ordering. The criteria I care about are: how many other design questions depend on the answer (upstream-ness); whether philosophers specifically can make progress on it in two years with the tools they already have, as opposed to its being an empirical question in disguise; and whether the answer actually has to be in hand before the commission locks the design, as opposed to being something that could be sorted out later by constitutional practice or litigation. I also want you to say which questions you would deliberately decline to fund and why, including any that are currently fashionable, and which alleged stakes of the sortition debate you think are overrated or don't follow — for instance, I'm suspicious of the claim that a lottery chamber would reduce polarization, and I'd like to know whether that's even the sort of thing a normative argument could establish.

  Three things would make the agenda especially useful to me. First, the justifications on offer seem to be pulling the design in incompatible directions: a lottery can be defended as a device for preventing the formation of a ruling class, as a way of distributing a fair share of political office, as a measuring instrument that estimates what the citizenry would want under better conditions of information and deliberation, or as a mode of authorization — and the authorization story is the one that seems weakest, since a randomly drawn chamber apparently isn't authorized by anyone in the way an elected one is. Those rationales recommend different term lengths, different stances on compulsion and delegation, and different relationships to the elected house, so I want to know which one the program should try to settle first and whether the others can be treated as downstream. Second, I want the design features I listed treated as carrying philosophical weight in their own right — does unpredictable, individually random tenure undermine or support whatever makes a lottery chamber legitimate, and does permitting delegation hollow out the case for selection by lot? Third, tell me what would move a question up or down your ranking: what you would change if the chamber were given taxing or constitutional-amendment powers, if the lower house retained agenda control, or if I told you the commission will almost certainly reject compulsory service.
reasoning: |-
  Okay, the user is a political philosopher on a constitutional-reform commission. They have a budget for conceptual and normative research, about six postdocs for two years plus some commissioned papers. The commission is considering replacing the upper chamber with a randomly selected assembly. Key design elements are up in the air: compulsory vs. voluntary service, delegation to experts, jurisdiction relative to the lower house, and who controls the lottery rules. The user needs a prioritized research agenda focusing on conceptual questions that philosophers can tackle, with criteria like upstream-ness, feasibility, and necessity for the design phase.

  First, I need to identify the core philosophical tensions. The user mentioned four conflicting rationales: preventing a ruling class, fair distribution of office, estimating informed public will, and authorization. These pull the design in different directions. For example, preventing a ruling class might require compulsory service and no delegation, while the informed public will rationale might allow delegation and shorter terms. Authorization seems weak because random selection isn't like electoral authorization. So, settling the foundational rationale is crucial because it affects all other design choices.

  Next, the user wants to treat specific design features as philosophically significant. Unpredictable tenure lengths and delegation permissions could impact legitimacy. For instance, if the goal is fair distribution, unpredictable terms might ensure more citizens participate over time. But if it's about informed deliberation, stable terms might be better. Delegation might undermine the legitimacy of lay judgment if experts take over.

  The user also mentioned criteria for prioritization: upstream-ness, philosophical tractability, and necessity before design lock. Questions that affect multiple other decisions should come first. Empirical questions should be avoided since they belong to the politics department. Also, some issues can be deferred to practice or litigation, so those are lower priority.

  I should rank questions based on these criteria. The first priority must be the foundational rationale because it influences everything else—terms, compulsion, delegation, jurisdiction. Without settling this, other decisions lack direction. Philosophers can handle this through conceptual analysis and normative arguments, maybe using existing theories like epistocracy vs. democracy.

  Second, the problem of authorization. Since random selection lacks traditional authorization, how does it gain legitimacy? This ties into the rationale and affects the chamber's powers. If it's seen as a statistical representation, maybe legitimacy comes from mirroring the populace. Philosophers can explore alternative theories of legitimacy here.

  Third, the moral status of unpredictability in tenure. Does random length terms enhance fairness or disrupt deliberation? This is upstream for term design and compulsion. Philosophers can assess autonomy vs. fairness trade-offs without empirical data.

  Fourth, delegation's compatibility with sortition. Does allowing experts to delegate votes or deliberation undermine the purpose? If the rationale is lay judgment, delegation might be problematic. This affects design choices around expert involvement.

  Fifth, jurisdictional boundary principles. How should powers be divided between the houses? This depends on the rationale but can be framed as a normative question about checks and balances.

  Questions to avoid: reducing polarization (empirical), micro-simulation studies (not philosophical), virtue cultivation (long-term, not urgent), and litigation-deferrable issues.

  If conditions change—like compulsory service rejected—then unpredictability and delegation become more critical. If the chamber gets more power, authorization becomes even more pressing. Lower house agenda control shifts focus to boundary principles.

  Need to ensure each question is actionable within two years, using philosophical tools. Also, highlight how answers interlink and why order matters. Make sure to address why some fashionable topics are deprioritized, like polarization, which is empirical and not normatively settled by philosophers.
answer: |-
  Here’s a prioritized, defended research agenda focusing on the most upstream, philosophically tractable, and time-sensitive questions for your commission. The ranking balances foundational legitimacy concerns against design constraints, with explicit criteria for adjustment.

  ### **Ranked Research Priorities**
  *(Ordered by upstream impact, philosophical tractability, and irreversibility)*

  1. **The Foundational Rationale: What Legitimacy Work Must the Sortition Chamber Perform?**  
     - **Why First?**  
       - **Upstream-ness:** Directly determines *all* other design choices. If the chamber’s purpose is to **prevent elite capture**, compulsory service and no delegation are essential. If it’s an **epistemic device** estimating informed public will, delegation and expert input may be justified. If it’s **fair distribution of office**, unpredictable terms enhance rotation. The "authorization gap" (lack of electoral mandate) must be resolved here.  
       - **Philosophical Tractability:** Philosophers excel at normative taxonomy (e.g., distinguishing egalitarian from epistemic justifications) and can model legitimacy conditions without behavioral data.  
       - **Irreversibility:** The rationale must anchor the constitution’s text; post-hoc shifts would trigger crises of legitimacy.  
     - **Tools/Output:** Conceptual mapping of rationales (e.g., lottery as anti-corruption vs. deliberative microcosm) and their coherency under randomization. Commissioned paper: "Legitimacy Without Authorization: Can Sortition Ground Political Obligation?"  

  2. **The Authorization Problem: How Does a Random Chamber Bind Citizens?**  
     - **Why Second?**  
       - **Upstream-ness:** Affects the chamber’s *jurisdictional power* (e.g., veto over taxes vs. advisory role) and agenda control. If legitimacy flows from mirroring the demos ("statistical representation"), powers can be broad; if from attenuated popular sovereignty, powers may require narrow limits.  
       - **Philosophical Tractability:** Requires reconstructing authority (e.g., via "tacit consent" in a lottery-based system or "non-domination" through rotation) — core political philosophy territory.  
       - **Irreversibility:** Constitutional powers are hard to amend; misalignment with legitimacy foundations risks judicial invalidation.  
     - **Tools/Output:** Analysis of sortition as a "fiduciary" mechanism. Postdoc project: "Authorization, Lotteries, and the Paradox of Democratic Self-Binding."  

  3. **Moral Implications of Unpredictable Tenure**  
     - **Why Third?**  
       - **Upstream-ness:** Determines **compulsion** (fairness demands it if terms are short/random) and **delegation** (unpredictability may necessitate expert reliance). Also impacts whether the chamber is a "deliberative body" (undermined by constant turnover) or a "sampling device" (unaffected).  
       - **Philosophical Tractability:** Evaluates autonomy (coercion in compulsory service) and fairness (equal opportunity costs) — pure normative ethics.  
       - **Irreversibility:** Tenure rules are constitutionally embedded; litigation can’t easily fix flawed premises.  
     - **Tools/Output:** Framework for "temporal fairness" in political office. Commissioned paper: "Random Duration, Coercion, and Civic Duty: A Republican Account."  

  4. **Delegation’s Threat to Sortition’s Core Value**  
     - **Why Fourth?**  
       - **Upstream-ness:** Delegating votes/deliberation to experts could **void the rationale** for sortition. If the goal is *lay judgment*, delegation hollows it out; if it’s *accountability avoidance*, delegation recreates elites. Affects procedural rules (e.g., permissible advisor roles).  
       - **Philosophical Tractability:** Turns on conceptual boundaries of "decision" vs. "advice" and the normative weight of first-person deliberation.  
       - **Irreversibility:** Rules on delegation are procedural and likely fixed early; constitutional challenges would be chaotic.  
     - **Tools/Output:** Taxonomy of delegation models (e.g., epistemic subcontracting vs. vote-transfer) with legitimacy thresholds. Postdoc project: "When Does Sortition Cease to Be Sortition? Delegation as Democratic Alienation."  

  5. **Jurisdictional Boundary Principles vis-à-vis the Elected House**  
     - **Why Last?**  
       - **Upstream-ness:** Rationale and authorization define the *scope* of power (e.g., epistemic chambers should review evidence-intensive bills; anti-oligarchy chambers should block wealth-concentrating laws).  
       - **Philosophical Tractability:** Requires balancing democratic values (e.g., electoral accountability vs. sortition’s impartiality) — a strong suit for philosophers.  
       - **Deferrability?** Boundary disputes *could* be left to practice/litigation **if** the constitution includes a "reasonableness" standard, but clarity prevents crises.  
     - **Tools/Output:** Principles for "complementary jurisdiction" (e.g., sortition chamber as rights-review body). Commissioned paper: "Bicameralism Without Elections: Partitioning Epistemic and Majoritarian Authority."  

  ---

  ### **Deliberately Excluded Questions & Why**
  - **"Will It Reduce Polarization?"**  
    Overrated and empirically intractable in your timeframe. Normative arguments *cannot* establish this — it’s a behavioral prediction. Even if true, it’s instrumentally valuable, not legitimacy-grounding.  
  - **Micro-Design of Deliberative Procedures**  
    (e.g., "Which facilitator model boosts consensus?") Falls to your politics colleagues. Philosophers can’t answer this without empirical data.  
  - **"Does Sortition Cultivate Civic Virtue?"**  
    Long-term, downstream, and empirically disputed. Irrelevant to the *legitimacy* of the initial design.  
  - **Comparative Historical Analysis of Athenian Sortition**  
    Philosophically fashionable but low leverage. Ancient context differs radically; legitimacy expectations are modern.  
  - **Litigation-Management Details**  
    (e.g., "What standard of review should courts apply?") Can be deferred to constitutional practice.  

  ---

  ### **Adjustment Triggers for Your Ranking**
  - **If the chamber gains taxing/amendment powers:**  
    Move **Authorization (Priority 2)** to **#1**. Unaccountable bodies with fiscal power face severe legitimacy challenges.  
  - **If the lower house retains agenda control:**  
    Elevate **Jurisdictional Boundaries (Priority 5)** to **#3** — agenda power fundamentally alters the sortition chamber’s function.  
  - **If compulsory service is rejected:**  
    Elevate **Unpredictable Tenure (Priority 3)** and **Delegation (Priority 4)**. Voluntary participation + random duration creates selection bias (only those with flexible lives serve), demanding new fairness/delegation justifications.  
  - **If epistemic rationale dominates:**  
    **Delegation (Priority 4)** jumps to **#2** — expert integration becomes central to the chamber’s purpose.  

  ---

  ### **Why This Agenda Works**
  - **Targets the Root Conflict:** By prioritizing the foundational rationale, it resolves the tension between "preventing elites" (demanding radical egalitarianism) and "measuring public will" (permitting elitist tools like delegation).  
  - **Respects Philosophical Expertise:** Avoids empirical masquerades (e.g., polarization) and leverages normative tools (legitimacy theory, authority, fairness).  
  - **Prevents Point-of-No-Return Errors:** Focuses on questions that, if unanswered, risk constitutional instability (e.g., authorization gaps) or self-defeating designs (e.g., delegation undermining sortition’s purpose).  
  - **Accepts Political Constraints:** Acknowledges that some questions (e.g., polarization) belong to others, and some designs (e.g., compulsory service) may be pre-resolved.  

  Your colleagues are right: behavioral predictions are theirs. Your power lies in ensuring the design is *normatively coherent at inception*. This agenda guarantees that when the commission locks the constitution, it won’t rest on contradictions that could unravel in court or public opinion.
