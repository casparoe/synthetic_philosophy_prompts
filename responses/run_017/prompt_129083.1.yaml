prompt: |-
  I write literary fiction, and the novel I am currently finishing is set largely inside a fictional economics department during a long, wet academic year in the late 1970s. Several chapters turn on a seminar in which a young philosopher attacks a senior theorist who has been using Harsanyi's aggregation theorem to argue that a government should rank policies by a weighted sum of individuals' expected utilities, with the weights carrying whatever concern for equality one happens to have. In trying to make those chapters something a specialist would not wince at, I have read my way into the surrounding argument, and I have come away with the impression of a dispute that has barely moved in decades: the result itself is conceded on all sides to be formally correct, and yet every critic says, in one form or another, that it does not show what its friends take it to show. The friends say: grant that each person's preferences satisfy the expected-utility axioms, grant that the social ranking satisfies those same axioms, grant a Pareto condition, and the weighted-sum form follows, so the only room left for a distinctively egalitarian view is in the weights. The critics say: the Pareto condition doing the work is an *ex ante* one, applied behind a veil in which nobody yet knows who they are, so the rule can recommend a prospect that, once the uncertainty resolves, everyone agrees is worse for an identifiable loser who is now known to be a loser; and the related move of imagining an equal chance of turning out to be any of the affected people only delivers a sum if one is risk-neutral about which person one becomes, which looks less like a neutral formal constraint than like utilitarianism in disguise.

  My own hypothesis, such as it is, is that the impasse is not about the mathematics at all but about what a social welfare function is *for*: whether it is meant to be a ranking of outcomes by how good they are, or a decision rule for a chooser who must act under uncertainty, or a way of encoding what each person has reason to want from behind a veil. If that is right, then the two sides are answering different questions under one heading, and the arguments simply pass each other. But I am not confident, because some of the moves look genuinely substantive to me, and because a mathematician in my writing group has offered what he calls the long-run collapse reply, which I cannot evaluate: if the same society faces a long sequence of many independent, small-stakes distributive choices, then applying the ex ante rule over and over makes the realised sum concentrate around the expected sum, and the gap that the ex ante/ex post objection exploits becomes negligible; so, he says, the objection is a artefact of one-shot cases and dissolves in the limit. I suspect that reply either quietly assumes the very separability across decisions that is in question, or relocates the disagreement to the cases that are irreducibly one-off (a single indivisible transplant, a tiny probability of civilisational catastrophe, a variance that is borne within one lifetime rather than spread across many), but I cannot tell which.

  So here is what I would like, in British English, and without any citations, a bibliography, or a reading list — I am writing in a cottage with no library access and would only be able to guess at references anyway. Give me a diagnosis of this debate rather than a verdict: is it verbal, a difference about which cases count as the relevant data, a difference about what a formal result in social choice is supposed to establish, a hidden empirical or formal question about separability or interpersonal comparison doing the work, or two questions being pursued under one name? Engage the actual positions as I have sketched them, including the long-run collapse reply, and say plainly if my hypothesis is wrong or only partly right. Finally, and most usefully for my purposes: given your diagnosis, what would count as progress here — a distinction, a formal result, a change of question, a class of case — and is there any reason to think the debate should simply be expected never to move? Please aim for roughly a thousand words of close argument rather than a survey.
reasoning: |-
  Okay, the user is writing literary fiction set in an economics department, focusing on a seminar debate around Harsanyi's aggregation theorem. They've described the core disagreement: proponents see the theorem as justifying weighted-sum social welfare functions with egalitarian weights, while critics argue the ex ante Pareto condition ignores ex post inequality. The user suspects the real conflict is about the purpose of a social welfare function, but their mathematician friend's "long-run collapse" argument complicates things. 

  First, I need to unpack both positions carefully. The theorem's defenders are technically correct—given those axioms, the weighted sum is inevitable. But the critics' objection feels philosophically weighty: that hypothetical "veil of ignorance" reasoning smuggles in substantive assumptions. The user's hypothesis about conflicting purposes seems spot-on—is this about evaluating outcomes or guiding decisions under uncertainty? 

  The long-run reply is clever but problematic. Yes, over many independent small decisions, the law of large numbers would make ex ante and ex post outcomes converge. But this only works if decisions are separable and stakes are small—which ignores exactly the high-stakes, lumpy distributive choices that make equality matter most (like that transplant example). The mathematician might be assuming risk-neutrality across decisions, which is precisely what egalitarians question. 

  Where does that leave us? The debate isn't just verbal; it's about what phenomena we're trying to capture. Utilitarians see society as one big decision problem under uncertainty. Egalitarians care about actual realized distributions. The long-run argument doesn't refute critics—it just changes the subject to easy cases. 

  Progress would require clarifying the question first: Is this about ranking outcomes or choosing under ignorance? Then we'd need formal work on non-separable cases or hybrid approaches (like ex post adjustments). But some disagreements might persist because values diverge—no theorem can settle whether we should care more about ex post fairness or ex ante efficiency. The user's novel could beautifully dramatize how these irreconcilable perspectives play out in human terms: the young philosopher's outrage versus the theorist's serene formalism, both partly right, partly talking past each other. 

  The user's instinct feels correct—this is less about math than about what the math is for. Their challenge is showing that tension through characters who embody each worldview, maybe with the long-run argument as a moment where the mathematician reveals his unstated priorities. The debate's frozen nature isn't failure; it's a philosophical rift no formalism can bridge.
answer: |-
  Your hypothesis strikes at the nerve of the debate. It is substantially correct, but the impasse runs deeper than *just* a difference about the SWF's purpose; it involves fundamental disagreements about what constitutes a relevant "case," the role of separability, and the legitimacy of the hypothetical reasoning underpinning the veil. The long-run collapse reply doesn't resolve this; it highlights a different, but equally contested, set of priorities. Here’s a diagnosis:

  1.  **The Core Conflict is Conceptual, Not Formal:** All parties accept Harsanyi's mathematics. The dispute revolves around the *interpretation* of the axioms and the *significance* of the result within ethical reasoning.
      *   **Proponents (Weighted-Sum Friends):** They view the SWF as a *decision rule for a benevolent planner choosing under fundamental uncertainty* (the original position/veil). The axioms (EU for individuals, EU for society, ex ante Pareto) are seen as minimal, rational consistency conditions for choice under uncertainty. The theorem, for them, shows that *any* rational, Paretian social chooser under uncertainty *must* act *as if* maximising a weighted sum of expected utilities. Egalitarianism enters solely through the choice of weights reflecting concern for different potential identities.
      *   **Critics (Equality Critics):** They often view the SWF as needing to produce a normatively compelling *ranking of social outcomes* (or at least, prospect evaluations that respect certain ex post fairness concerns). While granting the theorem's logic *within the hypothetical veil*, they argue this setup:
          *   **Ignores Ex Post Fairness:** The ex ante Pareto condition allows a prospect where everyone *ex ante* weakly prefers A to B, but where, *after the veil lifts*, there is an identifiable loser who is severely worse off in A than in B, and everyone (including the loser) recognises this unfairness. The hypothetical agreement doesn't bind the actual person suffering the loss.
          *   **Smuggles in Utilitarian Risk-Attitudes:** The "equal chance of being anyone" device only yields the *sum* of utilities if individuals are assumed to be risk-*neutral* over the identity lottery. Risk aversion over who you might be would lead to giving higher weight to worse-off positions. Insisting on risk-neutrality here, critics argue, isn't a neutral rationality constraint but a substantive utilitarian commitment prioritizing average outcomes over worst-case protection.
          *   **Misconstrues the Source of Egalitarian Concern:** Egalitarians care about actual inequalities and the plight of the identifiable worst-off, not just the ex ante expectations of hypothetical choosers. The veil abstracts away the very thing equality concerns are about – the known, concrete relationships and disparities between people in realised outcomes.

  2.  **The "What is the SWF for?" Question is Central:** Your hypothesis is correct. The disagreement stems largely from differing implicit answers:
      *   **Decision Rule Under Deep Uncertainty:** This is the proponent's focus. The SWF tells the planner what to choose *now*, knowing only the possible outcomes and probabilities, not who will occupy which position.
      *   **Evaluation of Outcomes/Prospects:** This is the critic's focus. They want the SWF to reflect judgments about the desirability or fairness of social states themselves (or full descriptions of prospects), considering the known identities and concrete distributions involved *within* those states/prospects.
      *   **Encoding Veiled Preferences:** This overlaps with the decision rule view but emphasizes the hypothetical agreement as the foundation of legitimacy. Critics challenge whether this hypothetical agreement carries the normative weight proponents assign it, especially concerning ex post fairness.

  3.  **The Long-Run Collapse Reply: A Shift in Ground, Not a Resolution:**
      *   **Its Logic:** Your mathematician friend is technically correct *if* you assume:
          *   A long sequence of *independent* decisions.
          *   Decisions involve *many individuals* and *small stakes* per decision relative to lifetime welfare.
          *   The same separable SWF (weighted sum) is applied repeatedly to each decision.
      *   **Its Flaw as a Rebuttal:** It doesn't address the core critic's objection; it changes the subject.
          *   **Ignores the Irreducible Cases:** As you suspect, it dismisses precisely the cases critics find morally paramount: large, lumpy, one-off distributive decisions (the transplant, the catastrophic risk, the life-defining opportunity), or decisions where variance hits individuals hard within one lifetime. In these, the "gap" is not negligible; it *is* the moral issue. Saying the objection only applies here is like saying equality only matters when it matters most – which is exactly the critic's point.
          *   **Assumes Separability:** Applying the rule repeatedly *assumes* that the social evaluation of each small decision is independent of other decisions and the overall distribution. This ignores the possibility that egalitarians might care about the *overall* lifetime distribution of welfare across individuals, not just the expectation in each micro-decision. The repeated application might guarantee a good *average* outcome but could still allow significant, enduring inequality *across* individuals.
          *   **Confuses Ex Ante Agreement with Ex Post Justification:** Even if the realised distribution is excellent *on average* due to many trials, the critic can still object that for the identifiable individual who ended up with a terrible outcome *despite* the long run being good overall, the process feels unjust. The long-run argument justifies the rule to the planner ex ante; it doesn't necessarily justify the outcome to the actual loser ex post.

  4.  **The Role of Separability and Interpersonal Comparison:**
      *   **Separability:** The Harsanyi result inherently assumes separability across individuals (the additive form). The long-run argument assumes separability across decisions. Critics often reject both forms of separability as incompatible with genuine egalitarianism, which cares about patterns and relationships *between* individuals and across time. This is a substantive formal/ethical commitment doing significant work.
      *   **Interpersonal Comparison:** The theorem requires cardinal, comparable utilities. Proponents see the weights as the locus for resolving interpersonal comparisons based on ethical views (like egalitarianism). Critics argue that the veil setup, especially with the risk-neutrality requirement, *constrains* how those comparisons can be made in a way that biases against giving sufficient priority to the worst-off. It forces the comparison into a specific (utilitarian-leaning) mould.

  **Diagnosis:** The debate is fundamentally **a clash of normative frameworks masquerading as a technical dispute about a theorem's implications.** It involves:
  *   **A Difference in Core Question:** Decision under uncertainty (Proponents) vs. Outcome evaluation/Fairness (Critics).
  *   **A Difference in Relevant Data/Cases:** Proponents focus on the logic of the original position. Critics focus on ex post distributive outcomes and one-off/high-stakes decisions ignored by the long-run argument.
  *   **A Difference in Foundational Assumptions:** The acceptability of separability across individuals and decisions, and the legitimacy of risk-neutrality over identity lotteries as a "rationality" constraint.
  *   **A Difference in the Role of Hypotheticals:** How much normative weight does agreement behind the veil carry in the real world of known identities and concrete suffering?

  **What Would Count as Progress?**

  1.  **Clarifying the Question Explicitly:** Progress requires explicitly separating:
      *   **Project 1:** Defining rational *social decision-making under fundamental uncertainty* (the original position). Harsanyi's theorem is highly relevant here, but the debate needs to acknowledge that this project may not yield an SWF suitable for other purposes. The dispute over risk-neutrality in identity lotteries *within this project* needs direct engagement – is it rational or utilitarian?
      *   **Project 2:** Defining a normatively compelling *evaluation of social outcomes or prospects* that respects ex post fairness concerns. This project might reject the veil setup entirely or significantly modify the axioms (e.g., weakening ex ante Pareto to avoid the "repugnant" recommendations, incorporating ex post equity constraints, or using different risk attitudes).

  2.  **Formal Work on Hybrids & Non-Separability:** Developing formal frameworks that:
      *   Integrate concerns for both ex ante efficiency and ex post equality *explicitly*, perhaps allowing trade-offs.
      *   Model SWFs that are not separable across individuals (e.g., giving priority to the worst-off) or across decisions (e.g., caring about lifetime profiles).
      *   Explore the implications of different risk attitudes within the veil (beyond neutrality).

  3.  **Focusing on the Critical Cases:** Seriously modelling the "irreducible" one-off, high-stakes, or lumpy distributive choices that expose the tension most sharply. What principles *should* govern these? Does the long-run argument concede these cases to the critics?

  4.  **Interrogating the Veil's Foundations:** A deeper philosophical examination of whether hypothetical agreement under highly artificial conditions (ignorance of identity, specific risk attitudes) can ground obligations that bind individuals in the real world, especially those who lose out.

  **Will the Debate Move?**

  It will likely continue indefinitely, but progress *is* possible within the clarified projects:
  *   **Project 1 (Decision under Uncertainty):** Debate will continue on the rationality of risk attitudes over identity and the plausibility of the EU axioms for society. Movement might come from refined models of reasoning under the veil.
  *   **Project 2 (Outcome Evaluation):** Significant movement occurs here, exploring alternatives like prioritarianism, egalitarian equivalents, or ex post equity-adjusted criteria. These frameworks explicitly address critics' concerns, though they face their own technical and normative challenges.
  *   **The Chasm:** The fundamental tension between the *ex ante* perspective of the veil/decision rule and the *ex post* perspective of fairness will likely remain a deep philosophical divide. No formal result can *force* someone who prioritises the plight of the identifiable worst-off to accept that a hypothetical agreement under ignorance justifies their suffering, even if the long-run numbers look good. Conversely, proponents won't abandon the logic of rational choice under uncertainty. This core difference in moral sensibility is persistent.

  **For Your Novel:** The seminar's heat stems from characters embodying these irreconcilable perspectives. The young philosopher rails against the abstraction that ignores concrete suffering and smuggles in utilitarianism. The senior theorist finds profound, elegant justification for policy in the rational necessity of the veil's logic. The mathematician offers a pragmatic defence based on aggregate stability, missing the philosopher's point about singular injustice. The debate stalls not because they misunderstand the math, but because they hold incompatible visions of what social choice theory should *do* and what moral phenomena it should capture. The most insightful character might be one who sees this chasm clearly, recognising that Harsanyi solved *a* problem brilliantly, but perhaps not *the* problem the egalitarian critic cares about most. The long-run reply is a powerful rhetorical tool for the utilitarian-leaning pragmatist, but it's a dodge in the face of the critic's deepest moral conviction about the irreducible importance of the single, known, suffering individual.
