prompt: |-
  I'm a PhD student in comparative-historical sociology. My dissertation argues that a budgeting procedure adopted in one agency during a fiscal crisis and still in place thirty years later is path-dependent: contingent in its origin, locked in thereafter, so that the counterfactual question of whether something like it would have arrived anyway should be answered no. At a workshop an interlocutor asked what my mechanism was; when I described it, she said the picture I was relying on is the adaptive-landscape one — a ball on a bumpy slope, a nudge at a fork deciding which basin it settles into, gravity doing the rest. I would rather audit that picture than defend it. Give me the correspondence table: what plays the ball, the terrain, the nudge, gravity, the basin, and friction, and which of these my case lacks. Two specifics. First, my sequence looks reactive rather than self-reinforcing — each step provokes a response that reconfigures the setting for the next, rather than a single mechanism reproducing the outcome — and it is not clear the picture can represent that at all, since its whole point is that the terrain stays put while the ball moves. Second, locked in means in the picture that the ball cannot get out, but in my material the practice persists only because officials keep re-enacting it and could in principle coordinate their way into a different one, and their expectations partly constitute it; so what does gravity map onto, and is it importing something my case does not have? Finally: does the picture support the strong conclusion I need, or only the weaker one that this particular arrangement was contingent while some functionally equivalent one would likely have emerged anyway — and does locked in say anything falsifiable unless a scale of perturbation is specified? If it cannot carry my conclusion, propose a better analogy.
reasoning: |-
  Okay, the user is a PhD student in comparative-historical sociology working on a dissertation about path dependence in a budgeting procedure. They presented at a workshop where an interlocutor suggested their mechanism resembles an adaptive landscape model—like a ball rolling on a bumpy slope, settling into a basin due to gravity. The student wants to audit this analogy rather than defend it, asking for a correspondence table and addressing two specific concerns.

  First, they point out their sequence is reactive: each step provokes responses that reconfigure the setting, unlike the static terrain in the ball analogy. Second, the lock-in in their case isn't absolute; officials actively re-enact the practice and could coordinate to change it, whereas gravity in the model implies inevitability. They also question if the analogy supports their strong contingency claim or just a weaker functional equivalence, and whether lock-in is falsifiable without specifying perturbation scales.

  Breaking this down:
  The core tension is between a dynamic, agent-driven process (the student's case) and a physics-based equilibrium model (the landscape analogy). The student needs to either radically reinterpret the analogy or abandon it for something more dialectical. 

  For the correspondence table, I'll map:
  - Ball → The budgeting procedure (or the agency's operational logic)
  - Terrain → Institutional/political constraints (but note it's not static)
  - Nudge → Initial fiscal crisis trigger
  - Gravity → Incentive structures (problematic because gravity is constant, while incentives shift)
  - Basin → Locked-in state
  - Friction → Implementation costs/resistance

  But the student's key objections reveal flaws: Terrain reconfigures reactively (violating the model's fixed landscape), and gravity assumes passive momentum when agency is active. The lock-in is also softer—more like balancing on a ridge than trapped in a pit.

  On the contingency question: The ball model only shows *this* path was accidental, not that *no* similar path would emerge. Strong contingency requires demonstrating the outcome was singularly dependent on that initial nudge. 

  For falsifiability: Without defining what scale of perturbation could dislodge the practice (e.g., leadership change vs. legislative overhaul), "locked-in" is slippery. The student must operationalize this.

  Alternative analogies I'm considering: 
  1) **Domino cascade** (emphasizes reactive sequence but may be too linear) 
  2) **Improv theater scene** (highlights co-construction but lacks structure) 
  3) **Game with shifting rules** (best fit? Players react to moves, altering future options; lock-in is equilibrium until collective action changes rules)

  The game analogy seems strongest: Officials are players, initial crisis sets opening rules, each budget cycle is a turn where moves alter subsequent rules (reactive terrain). Lock-in is a Nash equilibrium—stable because unilateral deviation is costly, but coordinated change is possible. Contingency is shown by how different initial rules would lead to different equilibria. Falsifiable if real-world coordination attempts fail despite incentives.

  I'll structure the response by first dissecting the landscape analogy's mismatches, then proposing the game framework with concrete mappings. Emphasize that their reactive process needs a dialectical model, not mechanical one.
answer: |-
  Here's a correspondence table auditing the adaptive landscape analogy against your case, followed by a critique of its limitations and a proposed alternative framework that better supports your argument:

  ### Correspondence Table
  | **Landscape Element** | **Standard Path Dependence Mapping** | **Your Case’s Mapping** | **Mismatch/Problem** |
  |------------------------|--------------------------------------|--------------------------|------------------------|
  | **Ball**               | The practice/institution             | The budgeting procedure  | *Partial fit*: Represents the focal practice, but implies passivity. |
  | **Terrain**            | Fixed institutional constraints      | **Evolving political/organizational context** | **Critical mismatch**: Your terrain *reactively reconfigures* after each step, violating the model’s static slope. |
  | **Nudge**              | Contingent initial event (crisis)    | Original fiscal crisis   | *Fit*: The contingent trigger. |
  | **Gravity**            | Self-reinforcing mechanisms (e.g., increasing returns) | **Nonexistent or weak** | **Critical mismatch**: No inherent "downward" force; persistence relies on *active re-enactment*. |
  | **Basin**              | Locked-in equilibrium state          | The stabilized procedure | *Partial fit*: Represents the outcome, but... |
  | **Friction**           | Barriers to change (e.g., sunk costs) | **Officials' expectations/coordination costs** | *Fit*: Explains stability but implies *overcomability* (unlike gravity). |

  ### Core Problems with the Landscape Analogy
  1. **Non-Static Terrain (Reactive Sequence)**  
     Your process is **dialectical**: Each step (e.g., a budget decision) alters the terrain (e.g., political coalitions, resource distributions, actor expectations) for the next. The landscape analogy cannot capture this because its slope is fixed. *Result*: The analogy misrepresents your mechanism as passive convergence rather than an active, reconfiguring sequence.

  2. **Gravity vs. Agency-Driven Lock-In**  
     - **Gravity** implies inevitable, mechanical stabilization.  
     - **Your case** relies on **repeated agentic choices** (officials re-enacting practices) and **constitutive expectations** (the practice exists partly *because* actors believe it should).  
     - Lock-in is thus **equilibrium-through-coordination**, not physics. Perturbations (e.g., leadership change) *could* break it if actors collectively coordinate alternatives. Gravity wrongly naturalizes persistence.

  3. **Contingency Claim Weakness**  
     The landscape model only proves:  
     - *Weak contingency*: "This *specific* procedure emerged contingently."  
     It **cannot disprove** that a *functionally equivalent* procedure might have emerged via other paths. Your strong claim ("nothing like it would exist") requires showing:  
     - The procedure is **idiosyncratic** (not functionally necessary).  
     - Alternatives were **viable but excluded** by the sequence.  
     The analogy lacks tools for this.

  4. **Falsifiability of "Locked-In"**  
     Lock-in is only falsifiable if you define:  
     - **Scale of perturbation**: What shocks *should* dislodge it? (e.g., "If major fiscal reform fails to change it, then locked-in").  
     - **Agentic scope**: Under what conditions *could* officials coordinate change?  
     The landscape’s "basin" is absolute; your case requires specifying *historical tests of stability*.

  ---

  ### A Better Analogy: **The Procedural Game**  
  Replace the landscape with a **multi-player game with evolving rules**:  
  - **Players**: Officials, stakeholders, political actors.  
  - **Initial Rules**: Set during the fiscal crisis (your "nudge").  
  - **Gameplay**: Each budget cycle is a "round." Moves in one round (e.g., a cut, a compromise) **re-write subsequent rules** (e.g., creating new veto points, shifting coalitions).  
  - **Lock-in**: The procedure persists because players:  
    - Develop **equilibrium strategies** (best responses to others’ expected actions).  
    - Face **coordination costs** to change rules collectively.  
    - Reinforce **shared expectations** ("This is how we play").  
  - **Contingency**: The initial rule-set (crisis response) made this game possible; other rules would have spawned **entirely different games** (no functional equivalence).  
  - **Falsifiability**: Lock-in breaks if a shock (e.g., new party in power) enables players to **renegotiate rules** despite coordination costs.  

  #### Why This Works for Your Case:
  - **Reactivity**: Rules evolve from gameplay (terrain reconfigures).  
  - **Agency**: Persistence depends on players’ choices, not gravity.  
  - **Strong Contingency**: Idiosyncratic initial rules → unique game → no functional equivalents.  
  - **Testable Lock-in**: Specify real-world scenarios where rule-change *should* occur (e.g., "If Party X wins, they will rewrite procedure Y").  

  #### Key Citations to Ground This:  
  - **Kathleen Thelen** (2004): Historical institutionalism emphasizing *contingent reconfiguration*.  
  - **Avner Greif** (2006): Game-theoretic historical analysis showing how expectations sustain institutions.  
  - **Paul Pierson** (2000, *Politics in Time*): Path dependence via increasing returns—**but** use his "reactive sequences" (p. 263) over mechanical metaphors.  

  **Conclusion**: The landscape analogy undercuts your strongest claims. Embrace a *dialectical* framework where structure and agency co-evolve. Your lock-in is a **coordination equilibrium**, not a physical trap—making your case more compelling precisely because it resists deterministic metaphors.
