answer: |-
  1.  The nearest established concept is **Kendall Walton's "quasi-emotion"** (from *Mimesis as Make-Believe*), which genuinely covers affective responses prompted by engaging with fictions, arising from imagining a scenario rather than believing it to be real, and governed by the principles of generation within the game of make-believe.
  2.  What you've described differs crucially because Walton's quasi-emotions are primarily *spectatorial* and often described as phenomenologically distinct from real emotions, whereas your cases involve full *proprioceptive bodily engagement* (sweating, flinching), *practical investment* (spending money, risking objectives), and are phenomenologically identical to real fear or valuing, all while maintaining reflective disbelief – the subject reports no qualitative difference *during* the experience.
  3.  The strongest rival candidate is **"suspension of disbelief" (Coleridgean)**, which I reject because it implies a temporary, voluntary bracketing of disbelief that *approximates* belief; your cases show no voluntary suspension, no approximation of belief (actions like removing the headset confirm active disbelief), and crucially, no internal conflict or "bracketing" reported by the subject – the disbelief and the intense response coexist seamlessly without being suppressed.
  4.  My recommended term is **Fictional Commitment**: *A proprioceptively embodied, practically engaged, and phenomenologically full emotional response directed at the affordances and stakes of a designed fictional scenario, scaffolded by the system's constraints and rewards, which operates concurrently with and is functionally isolated from the agent's settled belief that the scenario poses no real-world ontological threat or loss.*
  5.  Key boundary cases: (a) It becomes **plain fear** if the threat persists beyond the session boundary (e.g., credible real-world harassment) or if the loss has irreversible real-world consequences the subject believes in; (b) It reduces to **mere imagination/play-acting** if the practical investment and proprioceptive engagement vanish (e.g., casually describing the scenario later without physiological echo); (c) For **monetized stakes**, the response is *about the world* if the money spent is framed as an *entry fee* or *tool* to engage the fiction (avoiding in-world loss), but shifts toward real-world valuation if the stake is directly convertible *out* as fungible value (e.g., cashing out virtual currency). Participation doesn't break the analogy but intensifies the scaffolding enabling commitment.
