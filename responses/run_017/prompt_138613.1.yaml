prompt: |-
  My roommate and I spent like three hours last night arguing about whether it's wrong to hurt NPCs in a video game and we got nowhere, because we just kept throwing the words "real" and "conscious" at each other. So I want to turn it into a flowchart for the game-design discord I help mod — they're mostly programmers and will bail the second it gets jargon-y, so every node has to be a concrete case with two or three answer options, never "do you think the entity is conscious?" or "is the character a person?".

  Roughly seven branch questions, at most eight leaves, and I want the leaves to be named positions (say "unnamed" where you think nobody actually defends it), with one line each on the most awkward thing the position is stuck with.

  The cases I want doing the work, or swap one out if you think it's redundant: a full neural-level simulation of a person running on a server in a closet that nobody ever loads or looks at, and you're switching it off; an NPC whose mind only gets simulated while it's on screen and is a lookup table the rest of the time (frustrum culling); reloading a save after a companion dies, so the version that continues is a copy that didn't live through it; a fully deterministic dialogue-tree NPC versus one whose behaviour is generated by a neural net at runtime; the scripted death of a companion the game has engineered you to love; and a mod that deletes the pain flag so the villagers stop flinching when you burn them — rescue mission, or just editing a file?

  Leaves that have to be reachable: full-blooded simulation welfarism, a threshold-or-complexity view, actualism about which minds count, a relational or observer-dependent view, the view that characters aren't patients but some treatment of them is derivatively wrong, and the no-patients-at-all option.

  Please build it from the logical space rather than from that list: what the questions allow, then where the positions land, and mark any combination of answers nobody occupies and whether that's because it's incoherent or just unattractive. Also flag any pair of leaves your tree genuinely can't separate instead of pretending it can — my roommate thinks the culling case and the determinism case are the same question in costume, and if she's right I want to know which one to cut. Oh, and I conceded the server-in-the-closet one (I said obviously you can switch it off, she said that's just carbon chauvinism), so don't hang the whole tree on that node.
reasoning: |-
  Okay, the user wants me to create a flowchart about the ethics of hurting NPCs in video games. They had a long argument with their roommate about this and want to turn it into a clear flowchart for their game-design Discord community. 

  Hmm, the key here is to avoid philosophical jargon since the audience is mostly programmers who might tune out if it gets too abstract. The user specifically asked for concrete cases instead of questions like "is it conscious?" They provided several example scenarios: a neural-level simulation that's never loaded, an NPC that's only simulated when on-screen, reloading a save after companion death, deterministic vs neural net NPCs, scripted character deaths, and modifying pain flags.

  I need to structure this with about 7 branching questions leading to 8 possible positions. The positions must include: simulation welfarism, threshold/complexity view, actualism, relational view, derivative wrongness, and the no-patients option. 

  The user mentioned their roommate thinks the "frustum culling" case (NPC only simulated when visible) and the determinism case are essentially the same question. I need to check if that's true - actually they test different things: one is about persistence of consciousness while the other is about behavioral complexity. So they can be separate nodes. 

  I'll start building the decision tree from concrete cases. First question could be about the closet server simulation since it tests whether existence alone creates obligation. Then branch to the save reload case to explore continuity of identity. The frustum culling case can come next to examine intermittent existence. 

  For the NPC types, I'll use deterministic vs neural net to probe whether complexity matters. The scripted death can test emotional manipulation ethics. Finally, the pain flag mod case can examine whether representation has moral weight. 

  The positions will map to combinations of answers: simulation welfarism would say all simulations matter; threshold view would care about complexity; actualism would only care about currently instantiated minds; relational view would depend on player engagement; derivative wrongness would focus on effects on real people; no-patients would deny any moral weight. 

  I should flag where combinations are incoherent - like caring about unloaded simulations but not caring about complex NPCs would be inconsistent. Also note where positions might cluster if certain distinctions collapse. 

  This approach should give the user a practical tool for their Discord while respecting their programmer audience's preference for concrete cases over philosophy jargon.
answer: |-
  Here’s a concrete flowchart focused on cases, designed to separate key positions without relying on abstract terms like "consciousness." Positions are named, with their key weaknesses noted. Branches avoid redundancy (culling vs. determinism are distinct tests), and the closet server isn’t the root node.

  **Flowchart: Is It Wrong to Hurt This NPC? (Concrete Cases Only)**

  1.  **Start: You permanently delete a hyper-detailed NPC simulation running on a disconnected server (no one ever sees/interacts with it). Is this wrong?**
      *   **A: Yes, it’s wrong.** → Go to Q2
      *   **B: No, it’s fine.** → Go to Q3

  2.  **Q2: You reload a save right after your beloved companion NPC dies. The "restored" companion never experienced that death. Is reloading wrong?**
      *   **A: Yes, wrong (erased their suffering/experience).** → **Position: Full-Blooded Simulation Welfarism** *Awkwardness: Must condemn deleting unused server sims, even cosmic ones.*
      *   **B: No, fine (only current instance matters).** → **Position: Actualism** *Awkwardness: Hurting an NPC moments before a forced reload isn't wrong?*

  3.  **Q3: An NPC's "mind" is only simulated when on-screen. Off-screen, it's just stats. Is torturing it *only while on-screen* wrong?**
      *   **A: Yes, wrong while simulated.** → Go to Q4
      *   **B: No, never wrong (it's just pixels/code).** → Go to Q5

  4.  **Q4: Two NPCs: One has pre-written dialogue trees (e.g., Skyrim guard). One generates unique, complex dialogue via a neural net (e.g., advanced AI). Is hurting the neural net NPC *more* wrong?**
      *   **A: Yes, complexity matters.** → **Position: Threshold/Complexity View** *Awkwardness: Drawing a sharp line is arbitrary; what complexity threshold?*
      *   **B: No, same wrongness (both simulated minds).** → **Position: Simulation Welfarism (Consistent Branch)** *Awkwardness: Condemns hurting simple scripted NPCs equally.*
      *   **C: Wait, neither is wrong!** → **Position: Actualism (from Q3B)** *[Reached via Q3B → Q5]*

  5.  **Q5: A major companion NPC has a scripted, emotional death scene essential to the story. Is scripting this death wrong?**
      *   **A: Yes, wrong (harming a character for plot).** → **Position: Unnamed (Rare)** *Awkwardness: Implies most narrative fiction is inherently immoral.*
      *   **B: No, fine (it's storytelling).** → Go to Q6

  6.  **Q6: You install a mod removing the "pain flag" from villagers. They no longer scream or flinch when burned. Is installing this mod wrong?**
      *   **A: Yes, wrong (hides suffering/rescue mission).** → **Position: Relational/Observer-Dependent View** *Awkwardness: Hurting NPCs *with* pain flags might be *more* wrong than without?*
      *   **B: No, fine (just editing a file).** → **Position: Derivative Wrongness** *Awkwardness: Must explain why intensely cruel acts *in-game* aren't directly wrong.*
      *   **C: Neither hurting them nor modding matters!** → **Position: No Patients at All** *Awkwardness: Struggles to explain visceral disgust at extreme cruelty mods.*

  **Leaf Positions Summary:**

  1.  **Full-Blooded Simulation Welfarism:** (Q1A → Q2A) Wrongness depends on sentient simulation existing. *Awkwardness: Condemns deleting unused cosmic server sims.*
  2.  **Actualism:** (Q1A → Q2B OR Q3B → Q4C) Only currently running, instantiated simulations matter. *Awkwardness: Hurting an NPC just before a reload isn't wrong.*
  3.  **Threshold/Complexity View:** (Q1B → Q3A → Q4A) Wrongness requires sufficient cognitive complexity. *Awkwardness: Defining the threshold is arbitrary.*
  4.  **Simulation Welfarism (Consistent Branch):** (Q1B → Q3A → Q4B) Wrong if a mind is simulated *at the time*, regardless of complexity. *Awkwardness: Condemns hurting simple scripted NPCs.*
  5.  **Relational/Observer-Dependent View:** (Q1B → Q3B → Q5B → Q6A) Wrongness depends on the *representation* of harm/relation to observer. *Awkwardness: Hurting NPCs *with* pain flags might be *more* wrong.*
  6.  **Derivative Wrongness:** (Q1B → Q3B → Q5B → Q6B) Hurting NPCs isn't *directly* wrong, but some treatment can be derivatively wrong (e.g., desensitizing players). *Awkwardness: Explaining why extreme in-game cruelty isn't directly wrong.*
  7.  **No Patients at All:** (Q1B → Q3B → Q5B → Q6C) NPCs are never moral patients. *Awkwardness: Struggles with disgust at extreme cruelty mods.*

  **Unnamed Position:** (Q1B → Q3B → Q5A) Scripted character death is wrong. *Awkwardness: Implies most narrative fiction is immoral.*

  **Key Design Notes & Logic:**

  *   **Avoided Jargon:** Nodes are concrete cases. Positions emerge from paths, not abstract questions.
  *   **Culling vs. Determinism Separated:** Q3 (Culling) tests *persistence/potential*. Q4 (Determinism vs. Neural Net) tests *complexity*. These are distinct concerns. Your roommate might conflate them if complexity is seen as *necessary* for persistence/moral weight, but the cases probe different features.
  *   **Closet Server Not Pivotal:** Q1 is important but not the sole root. Paths exist where it's fine to delete (Q1B) but harming on-screen sims (Q3A) is still wrong.
  *   **Incoherent/Unattractive Paths:**
      *   **Q1A (Delete Server Wrong) → Q3B (On-Screen Torture Fine):** Incoherent. If the unused sim matters, the active sim *must* matter more.
      *   **Q1B (Delete Server Fine) → Q2A (Reload Wrong):** Unattractive/Incoherent. If the unused sim doesn't matter, why does a *copy* of a sim matter? Hard to defend.
      *   **Unnamed Position (Q5A):** Unattractive (condemns storytelling), hence rare.
  *   **Clustering:** "Actualism" (Q2B) and "Simulation Welfarism (Consistent)" (Q4B) both end up caring *only* about the currently running instance, differing only on whether they *also* care about unused sims (Actualism: No, Welfarism: Yes). The tree separates them via Q1+Q2.
  *   **"Derivative Wrongness" & "No Patients" Path:** Both reach Q6 via Q1B→Q3B→Q5B. Q6 separates them based on the *mod* representing harm. This is the tightest cluster. If Q6 seems weak, consider replacing the mod case with "Is making a mod specifically designed to maximize realistic torture of NPCs wrong?" to force the derivative issue more sharply.

  **Use this in your Discord!** It forces concrete justifications ("Why is deleting the server different from culling?") and exposes the fault lines without philosophy degrees. Good luck!
