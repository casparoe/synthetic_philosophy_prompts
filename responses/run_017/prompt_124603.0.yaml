answer: |-
  ### Workshop Design: Peer Disagreement Exploration

  **Core Structure**: Three iterative rounds (bare disagreement → traceable disagreement → higher-order disagreement), each with private estimates, paired discussion, and updates. Scoring via quadratic scoring rule (points = `-(estimate - true_value)^2`), with leaderboard points for private and updated estimates in each round.

  **Materials**:
  - **Cards** (pre-printed for each round, with T1=100, T2=200, T3=100 as true values)
  - **One phone** for randomization (e.g., random pairings, glitch occurrence)
  - **Glitch logs** (for traceable pairs in Round 2)
  - **Scoring spreadsheet** (for leaderboard)

  ---

  ### **Round-by-Round Setup**
  #### **Round 1: Bare Disagreement** (0:10–0:25, 15 min)
  - **Goal**: Experience disagreement with no visible flaws; intuitive conciliation.
  - **Mechanics**:
    - Each participant receives a card:  
      `Evidence: [E] (e.g., 112, 88, 94) | Noise oracle: [Reliable/Unreliable]`  
      *(Generated from T1=100: E = 100 + noise. Noise: N(0,10) if reliable state (50%), N(0,50) if unreliable (50%). Oracle accurate 70%.)*
    - **Private estimate** (2 min): Estimate true value (write down).
    - **Pairing** (random, 9 pairs): Share cards (evidence + oracle) only.  
    - **Update** (5 min): Discuss and revise estimate.
    - **Scoring**: Points for private and updated estimates (vs. T1=100).

  #### **Round 2: Traceable Disagreement** (0:25–0:40, 15 min)
  - **Goal**: Contrast bare vs. traceable cases; expose resistance to updating when flaw is visible.
  - **Mechanics**:
    - Assign 3 pairs as **bare** (no glitch logs), 6 pairs as **traceable** (with glitch logs).
    - Each receives a card:  
      `Evidence: [E] (e.g., 218, 182, 195) | Noise oracle: [Reliable/Unreliable]`  
      *(T2=200. Evidence includes base noise ± glitch: 10% chance of ±50 glitch.)*
    - **Private estimate** (2 min).
    - **Pairing**:  
      - **Bare pairs**: Share only evidence + oracle.  
      - **Traceable pairs**: Share evidence + oracle + **glitch log for peer** (e.g., `Peer's glitch: None` or `Peer's glitch: +50`).  
    - **Update** (5 min): Discuss. Traceable pairs adjust peer’s evidence using glitch log.
    - **Scoring**: Points for private/updated estimates (vs. T2=200).  
    - **Post-update**: Participants note "weight given to peer" (0–1 scale) for debrief.

  #### **Round 3: Higher-Order Disagreement** (0:40–0:55, 15 min)
  - **Goal**: Force disagreement about updating itself; surface self-erosion.
  - **Mechanics**:
    - All receive identical scenario card:  
      *"In Round 2 (bare), Person A: Evidence=120, oracle=Reliable. Person B: Evidence=80, oracle=Reliable. What should A’s updated estimate be?"*  
      *(Bayesian answer: 100)*
    - **Private estimate** (2 min): Participants write what A *should* have estimated.
    - **Pairing**: Match participants with >10-point difference in private estimates.  
    - **Update** (5 min): Share private estimates for the scenario (not the reasoning). Discuss and revise.  
    - **Scoring**: Points for private/updated estimates (vs. T3=100).

  ---

  ### **Timeline (90 Min Total)**
  | Time      | Activity                                                                 |
  |-----------|--------------------------------------------------------------------------|
  | **0:00–0:10** | Intro: Explain rules, noise oracle (70% accurate), scoring. Emphasize: "Your goal is to estimate truth; update when new info warrants." |
  | **0:10–0:25** | **Round 1**: Bare disagreement. (Private → pair/share → update → collect scores). |
  | **0:25–0:40** | **Round 2**: Traceable/bare split. (Assign pairs, repeat flow; traceable pairs get glitch logs). |
  | **0:40–0:55** | **Round 3**: Higher-order. (Same flow; pair based on estimate differences). |
  | **0:55–1:20** | **Debrief**: Facilitate reflection, then map to theories.                |

  ---

  ### **Debrief Guide** (0:55–1:20, 25 min)
  **Reflection Questions (First 10 min)**:
  1. "In Round 1, how many moved significantly toward their peer? Why?"  
     → *Likely conciliation: No visible flaws, so averaging felt natural.*
  2. "In Round 2 traceable pairs, who discounted their peer’s view? Did the glitch log justify it?"  
     → *Steadfastness: Visible flaw ("not a real peer") justified ignoring.*
  3. "In Round 3, how many revised their update-rule estimate? Did your peer’s view feel like evidence?"  
     → *Self-erosion: Conciliationists update on meta-disagreement; steadfasts resist.*

  **Map to Theories (Next 10 min)**:
  - **Bare disagreements (Round 1)** → Conciliationism:  
    *"You split the difference because no flaws were visible. The rule: Equal weight to peers."*
  - **Traceable disagreements (Round 2)** → Steadfastness:  
    *"You ignored peers when you ‘saw’ their error. The rule: Discount non-peers."*
  - **Higher-order (Round 3)** → Key tension:  
    *"If you updated your update-rule, you let disagreement ‘erode’ your first rule. If you didn’t, you held firm. Should conciliation apply to itself?"*

  **Closing Note (Last 5 min)**:
  > "Settled: In bare peer disagreement, conciliation (e.g., averaging) is standard. When flaws are visible, steadfastness is uncontroversial.  
  > **Contested**:  
  > - Whether ‘peers’ can be identified without circularity (your traceable/ bare split assumed this, but real life is murkier).  
  > - Whether conciliation *must* apply to higher-order disagreements (self-erosion). Some argue it’s a fatal flaw; others say it’s rational consistency.  
  > **Design limits**: This exercise assumes peers are equally calibrated. Real disagreements often involve hidden asymmetries we can’t simulate."

  ---

  ### **Predictable Challenges & Mitigations**
  1. **Noise oracle treated as first-order evidence**:  
     - *Risk*: Participants use oracle to directly adjust estimates (e.g., "oracle says unreliable, so I’ll guess lower").  
     - *Mitigation*: Stress pre-game: "The oracle tells you about your evidence’s reliability—not the answer."
  2. **Traceability collapses in Round 2**:  
     - *Risk*: Glitch logs ignored or misused (e.g., "I subtracted the glitch, but still trusted the peer").  
     - *Mitigation*: Clarify during pairing: "For traceable pairs: Use the glitch log to adjust your peer’s evidence before considering it."
  3. **Round 3 feels artificial**:  
     - *Risk*: Participants reject the scenario ("Why should I care what A should do?").  
     - *Mitigation*: Frame aggressively: "Your job is to score points by finding the most rational update rule for A."
  4. **Steadfastness dominates**:  
     - *Risk*: Competitive types rarely update to "win" the leaderboard.  
     - *Mitigation*: Remind during scoring: "Points come from accuracy, not stubbornness."

  ---

  ### **Designer Notes**
  - **Unsimulated Elements**: Real-world peer identification relies on subjective calibration history. This exercise assumes symmetric skill, which is idealized.  
  - **Contested Framing**: The design implicitly treats "traceable flaws" as negating peerhood—a steadfast-leaning assumption. Conciliationists might argue visible flaws don’t resolve symmetry.  
  - **Self-Erosion**: Round 3 forces the tension but doesn’t resolve it. Be explicit that rational agents divide on whether meta-conciliation is required or self-undermining.
