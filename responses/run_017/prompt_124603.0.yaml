  For Round 2, true_value=200.
  For Round 3, true_value=100 (the answer to the scenario).

  We'll keep a leaderboard of total score (sum over rounds and private/updated).

  But note: in Round 1 and Round 2, there are two scores per round (private and updated). In Round 3, there are two: the private estimate for the scenario and the updated estimate.

