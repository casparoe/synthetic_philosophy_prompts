  What can go wrong:
  - The noise oracle might be misunderstood. Emphasize: it's about the reliability of the evidence, not the true value.
  - In traceable pairs, participants might not know how to use the glitch log. Explain that they can adjust the peer's evidence by subtracting the glitch value if there was a glitch. But note: the peer's evidence is already the final evidence (with glitch). So if they see a glitch of +50, they should subtract 50 from the peer's evidence to get an estimate without the glitch, but the base noise remains.
