  We are designing an activity for a 90-minute rationality workshop on peer disagreement. The goal is to have participants experience the tension between conciliationism and steadfastness without naming the theories up front. We'll use a setup where participants make estimates based on private evidence that includes a "noise oracle" reading about the reliability of their own evidence. Then they'll engage in peer disagreement with varying levels of traceability.

  Key elements:
  - Each participant gets:
     (a) Private evidence for an estimate (e.g., a number).
     (b) A noise oracle reading that indicates the reliability of their evidence (with 70% accuracy).
  - Some disagreements are "traceable": participants can see a specific flaw in the peer's evidence or reasoning.
  - Some are "bare": no visible flaw, just a different estimate from an equally calibrated peer.
  - One round involves disagreement about how much they should have updated in a previous round (higher-order disagreement).

  Materials: 
  - Cards for each participant with their private evidence and noise oracle reading (for each round).
  - A way to randomize (one phone with a random number generator).

  Payoff: Leaderboard points using a proper scoring rule (e.g., quadratic scoring rule).

  Structure:
  The session will have multiple rounds of estimation and updating. Each round has:
  1. Private estimate based on private evidence and noise oracle.
  2. Sharing estimates with a partner and updating (with or without traceability conditions).
  3. Scoring updates.

  We'll have three rounds:
  - Round 1: Bare disagreement (no traceability).
  - Round 2: Traceable disagreement (participants can see a flaw in the partner's evidence chain).
  - Round 3: Higher-order disagreement (about the update in Round 2).

  Then a debrief.

