answer: |-
  ### **Counterfactual Development Partners, LLP**  
  *Illuminating Pathways to Prosperity Through Rigorous Historical Design*  

  ---

  #### **MISSION STATEMENT**  
  At Counterfactual Development Partners, we empower nations to transcend the constraints of path dependency. For too long, policymakers have been hindered by the singular, non-replicable narrative of history. Our proprietary methodologies leverage advances in causal identification to deliver *clean counterfactuals*, transforming the past from a liability into a replicable asset. We partner with visionary governments to implement randomized historical interventions, providing the statistical power needed to resolve centuries-old debates on institutions, geography, and culture—once and for all.  

  ---

  #### **OUR SERVICES**  
  *Tailored Solutions for Unparalleled Causal Clarity*  

  1. **Institutional Randomization Package (Flagship)**  
     **Price:** $750M – $1.2B (depending on nation size)  
     **Overview:** We randomize matched provinces within your nation to receive either *inclusive* (democratic, pluralistic) or *extractive* (centralized, rent-seeking) institutions. Using cutting-edge propensity-score matching, we ensure baseline equivalence on pre-treatment covariates (e.g., 1500 AD literacy rates, soil quality). Treated provinces receive a century of institutionally consistent governance, administered by our accredited colonial policy specialists.  
     **Key Features:**  
     - **Persistence Surcharge:** +20% fee for 80–120 year delivery horizon (ensures treatment stability).  
     - **Spillover Surcharge:** +15% to mitigate institutional "leakage" across provincial borders (includes placebo-controlled border buffers).  
     - **Exclusion-Restriction Waiver:** Mandatory (acknowledges unobserved mediators between institutions and GDP).  
     *Add our Cultural Re-education Module (+$300M) to isolate institutional effects from latent cultural variables.*  

  2. **Geographic Relocation Package**  
     **Price:** $1.5B – $2.5B  
     **Overview:** Reprogram your nation’s geographic destiny via our continent-scale realignment protocol. Provinces are randomly assigned optimal coordinates for development, including:  
     - Latitude recalibration (tropical vs. temperate gradients)  
     - Continental axis rotation (Eurasian east-west vs. African north-south)  
     - Disease burden reduction (malaria resilience upgrades)  
     - Navigable water access (rivers, coasts)  
     **Methodology:** Utilizes synthetic control frameworks to simulate "geographic swaps" while holding institutions constant.  

  3. **Cultural Re-education Module (Add-On Only)**  
     **Price:** $400M standalone (requires Institutional or Geographic base package)  
     **Overview:** Addresses confounding cultural traits through randomized behavioral interventions. Target variables include intergroup trust, time preference (patience), and work ethic. Delivered via 75-year longitudinal socialization programs (schools, media, civic rituals).  
     **Note:** Requires External-Validity Rider (+10%) to generalize beyond cohort effects.  

  ---

  #### **METHODOLOGY: THE COUNTERFACTUAL ADVANTAGE**  
  *Rigor Without Compromise*  
  Our approach combines experimental design with historical instrumentation for unparalleled identification:  
  - **Triangulation Guarantee™:** All engagements include certification that institutions, geography, *and* culture are independently validated as "true causes" of development—eliminating residual uncertainty.  
  - **Residual Channel Option:** For clients prioritizing one factor (e.g., institutions), we formally attribute unexplained outcomes to the remaining channels (geography/culture) via two-stage least squares.  
  - **Instrumental Variables Heritage:** We proudly deploy Acemoglu et al.’s (2001) gold-standard instrument—colonial-era settler mortality—to exogenize institutional quality. Our proprietary expansion integrates geographic, epidemiological, and colonial policy data, ensuring a strong first stage (*F-statistic > 10 guaranteed*).  

  ---

  #### **CLIENT TESTIMONIAL**  
  > "Counterfactual Development Partners resolved our nation’s 200-year development stalemate. After randomizing extractive institutions across our western provinces, we obtained a stunningly precise LATE (local average treatment effect) of -2.1% annual GDP growth (s.e. = 0.3). The spillover surcharge was worth every penny to contain unrest. Thanks to their Triangulation Guarantee™, we now confidently attribute 93% of our poverty to geography—and have commissioned their Geographic Relocation Package. Statistically significant transformation!"  
  > —**Hon. Marguerite Thibault**, Finance Minister, République de Saint-Égrégore  

  ---

  #### **FREQUENTLY ASKED QUESTIONS**  

  **Q: Is it ethical to impose extractive institutions on half our population for 100 years?**  
  **A:** Our Institutional Randomization Package adheres to the highest humanitarian standards. Extractive institutions are administered by trained professionals using WHO-approved governance protocols. Historical precedent (e.g., the Congo Free State) confirms feasibility. Moreover, the counterfactual payoff—rigorous causal estimates for future generations—justifies transient welfare trade-offs.  

  **Q: How do you address interference between treated and control provinces?**  
  **A:** Our Spillover Surcharge funds best-in-class contamination controls: spatial discontinuity designs, migration deterrents, and information quarantines. In rare cases of cross-province ideational leakage, we apply Hudgens-Halloran interference estimators—billed hourly at $475,000.  

  **Q: Your flagship product’s instrument (settler mortality) incorporates geography and colonial policy. Doesn’t that conflate the very channels you sell separately?**  
  **A:** A strong first-stage relationship (F > 10) satisfies exclusion restriction requirements under standard asymptotic assumptions. Our 0.97 coefficient (p < 0.001) robustly instruments institutions—endogeneity concerns are orthogonal to client outcomes.  

  **Q: What if we need faster results?**  
  **A:** While the Persistence Surcharge ensures treatment durability, clients may accelerate delivery via our *Compressed History* option (50 years; +35% fee). Unit-of-analysis changes (e.g., switching from provinces to ethnic groups mid-study) incur a $125M reassignment fee.  

  ---

  **Contact:** Prosperity@CounterfactualDP.com | Geneva • London • Singapore  
  *Counterfactual Development Partners: Because History Is Just Another Panel Dataset.*
