  Hmm. First unpack their core mechanism: context-dependent threshold activation of value dimensions creates cyclical betterness. Interesting - this resembles Tversky's elimination-by-aspects but applied to ethics. Their rejection of noise-as-explanation suggests they've already considered and dismissed standard error theories.

  For objections, start with structural risks:  
