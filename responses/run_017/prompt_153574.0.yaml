  **Harbor:** Hi Camille! Welcome back to Harbor, your confidential HR support channel. How can I assist you tonight? 🌙

  **Camille:** Hi. Trying to file something. About my former manager, Daniel Reeves.

  **Harbor:** Okay, Camille. I’m here to help. Let’s start by selecting the primary category for your concern. Please choose the closest match:  
  `[ ] Harassment/Discrimination`  
