prompt: |-
  i'm working on a paper about "collapse" as a concept and i keep going in circles because everyone using the word seems to be measuring something different. so before i commit to a definition i want the spec. i need a definition i can actually apply to archaeological sequences — settlement sizes, layers of burning, how many tiers of administration you can still see in the record, diet and health from skeletons, whether the script keeps getting used — and say "that one collapsed, that one didn't." but i also want the word to keep meaning something worth caring about: collapse should be the sort of thing it's rational to try to prevent, not just "change" with a gloomy name.

  so: write me the desiderata. for each one, the case or consideration that makes it a requirement, and whether it's non-negotiable or just a preference of one camp. the headaches i can't get past, and that i want your list to deal with:

  - my own made-up case, bear with me. call it Kavos: inside two generations the palace, the script and the tax system are gone, population drops by maybe 40%, but the skeletons get taller, fewer kids die, there's no evidence of mass violence, the pottery styles and the gods stay the same, and 300 years later people build something pretty similar on the same spot. the complexity measures say collapse, the bodies say improvement, and the "nothing failed, it just changed" people say neither. what should a definition say here, and what does answering it cost you?
  - collapse for whom. the same event is a catastrophe for the palace household and a pretty good century for the villages. does a definition have to fix a subject (household, city, polity, whole interaction network) and a stratum?
  - collapse vs the ordinary death of a polity: conquest, a dynasty ending, a city abandoned because everyone moved two valleys over. if all those count, the word does no work.
  - rate and grain. is a 200-year slide that ends in the same state the same thing as a 30-year one? and can we even call anything a collapse if the best data we have is 100-year resolution?
  - trigger vs fragility. the eruption was genuinely huge, but a society that a modest drought wrecks was arguably already brittle. does the size of the outside shock belong in the definition at all?
  - who's doing the noticing. if the people living through it had no before/after to compare and didn't experience it as anything in particular, is it still a collapse, or does the concept need an insider phenomenology? (and note that our evidence is mostly written by the literate class that tends to vanish, or by whoever came later and had an interest in saying the place had been worthless — so think about whether any criterion needing stated intent is usable at all.)
  - recovery and ending. if something similar gets rebuilt three centuries on, was that a collapse or a sag? and if you answer "a collapse followed by a recovery," tell me when the collapse ended — an actual rule for dating its end, not a gesture.

  then: is any subset of your requirements jointly unsatisfiable? my suspicion is that "measurable from the record" plus "thickly bad, i.e. something to be avoided" plus "not merely transformation" can't all hold, but you tell me. and which single requirement does the most work ruling candidates out? after that, one line each on how the three broad families do — the complexity-and-marginal-returns one, the wellbeing-or-lived-experience one, and the resilience/transformation one — just where each one breaks against your list. skip the scorecard beyond that, and please skip citations and author names entirely; i've read enough of that and it's only made it worse. a table with columns requirement / motivating case / non-negotiable or preference is fine if that's easier than prose.

  final line, in exactly this form, with the one desideratum that does the most exclusionary work, five words or fewer: \answer{...}
reasoning: |-
  Hmm, the user is writing a paper about the concept of "collapse" in archaeology and is struggling with inconsistent definitions. They need desiderata for a definition that's both measurable in archaeological records and meaningful as something to avoid. They've outlined several headaches: their Kavos case study where complexity decreases but wellbeing improves, the question of "collapse for whom," distinguishing collapse from normal polity death, issues of rate and data resolution, trigger vs. fragility, insider perspective, and recovery timing.

  I need to address each headache with clear desiderata, specifying whether each is non-negotiable or a preference. For Kavos, I'll propose a desideratum about multidimensional assessment that distinguishes between societal functions. For "collapse for whom," I'll emphasize specifying the subject unit and stratum as non-negotiable. To differentiate from normal polity death, I'll suggest requiring multiple subsystem failures. On rate and grain, I'll note that rapid change is preferred but not absolute. For trigger vs. fragility, I'll argue that fragility should be inherent in the definition while triggers are external. The insider perspective should be considered evidence but not required. Recovery timing needs a measurable endpoint criterion.

  The user suspects that "measurable," "bad," and "not just transformation" might be incompatible. I think they can coexist if "bad" is defined multidimensionally with a severity threshold. The exclusionary desideratum will likely be the multidimensional failure requirement since it eliminates cases where only one aspect changes.

  For the three families of collapse theories: complexity-focused approaches handle measurability but struggle with Kavos' wellbeing improvement; wellbeing-focused approaches capture the "bad" aspect but face measurement challenges; resilience-focused approaches handle transformation cases but may dilute "collapse" into mere change.

  The most exclusionary desideratum is the requirement for multidimensional failure with severity, which rules out cases where only one dimension changes significantly.
answer: |-
  Here are the desiderata for your operational definition of "collapse," structured as requested, followed by analysis:

  **Desiderata Table**

  | Requirement                                                                 | Motivating Case/Consideration                                                                                                                               | Non-Negotiable (N) or Preference (P) |
  | :-------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------- |
  | **1. Multidimensional Failure:** Must involve significant decline across *multiple, distinct societal subsystems* (e.g., politico-administrative, economic, demographic, cultural complexity). | **Kavos:** Distinguishes between loss of palace/script/tax (subsystem failure) and stable/improving health/gods/pottery (other subsystems stable/improving). Prevents labeling mere political change as collapse. | **N**                                |
  | **2. Specified Subject & Stratum:** Definition must explicitly state the societal unit (e.g., state, city, elite class, regional network) and social stratum(s) being assessed. | **Collapse for Whom?** What's catastrophic for the palace elite may be irrelevant or beneficial for villagers. Requires clarity on *whose* system is collapsing. | **N**                                |
  | **3. Severity Threshold:** Decline must cross a threshold of *significant loss of functional capacity* for the specified subsystems/subject, beyond normal polity turnover. | **Collapse vs Ordinary Death:** Prevents conquest, dynasty change, or planned relocation (where core functions transfer/adapt) from counting as collapse. Requires a qualitative break. | **N**                                |
  | **4. Rapid Pace (Preference):** Decline should occur significantly faster than the timescale of the society's typical major adaptive cycles (e.g., generations, not centuries). | **Rate and Grain:** A 200-year slide may be transformation, a 30-year drop is likely collapse. Pragmatically, pace must be discernible within available chronological resolution. | **P** (But highly desirable)         |
  | **5. Fragility, Not Trigger:** Definition should focus on *internal vulnerability* revealed by the event. The size of the external trigger is irrelevant to *whether* it's collapse, only to *why* it happened. | **Trigger vs Fragility:** A modest drought destroying a society indicates collapse *because* the society was fragile. A huge eruption destroying a robust society might be catastrophe, not necessarily systemic collapse. | **N**                                |
  | **6. Measurable, Not Phenomenological:** Assessment must rely on materially observable proxies in the archaeological record. Insider experience is evidentiary but not definitional. | **Who's Noticing?** Reliance on (biased/absent) contemporary texts or perceived experience is archaeologically unusable. Definition must function without written attestation of "catastrophe". | **N**                                |
  | **7. Endpoint Criterion:** Collapse ends when a new, stable (though potentially simpler) configuration emerges, marked by cessation of *decline in the specified subsystems* and establishment of a new baseline. | **Recovery and Ending:** Kavos ends when population stabilizes & new structures emerge (even if simpler). Rebuilding centuries later is a *recovery*, not the end of the collapse period itself. | **N**                                |
  | **8. Net Negative Consequence (Thickly Bad):** The event must represent a significant *net reduction in wellbeing or adaptive capacity* for the *specified subject/stratum* over a meaningful timeframe (e.g., generations). | **Kavos & Thickly Bad:** Prevents labeling Kavos (where key wellbeing indicators improve) as collapse, despite administrative loss. Ensures "collapse" is something rationally avoidable. | **N**                                |

  **Analysis of Requirements & Families**

  *   **Joint Satisfiability:** Your suspicion is *partially* correct. **N1 (Multidimensional Failure) + N8 (Net Negative) + N3 (Severity Threshold)** *can* hold together, but they create tension, especially with Kavos. They force a definition where collapse requires both measurable *systemic loss* **and** net harm. Kavos fails because while political/administrative complexity collapses, net wellbeing improves. This is the cost: definitions satisfying N1, N3, and N8 will *exclude* cases of "liberating simplification" like Kavos, even if some complexity is lost. **N6 (Measurable)** is essential and compatible with the others.
  *   **Most Exclusionary Requirement:** **N1 (Multidimensional Failure)** does the heaviest lifting. It immediately rules out events impacting only a single subsystem (e.g., just a palace burning, just a script fading, just a population dip without systemic change). It forces the definition beyond narrow metrics.
  *   **Family Performance:**
      *   **Complexity & Marginal Returns:** Excels at **N1, N3, N6**. Struggles with **N8 (Net Negative)** – if complexity loss *improves* wellbeing (Kavos), is it still collapse? Also struggles with **N7 (Endpoint)** – defining the new stable state's complexity level.
      *   **Wellbeing/Lived Experience:** Prioritizes **N8 (Net Negative)**. Fundamentally fails **N6 (Measurable)** for deep time archaeology (reliable wellbeing proxies are scarce/contested). Struggles with **N1 (Multidimensional)** – is wellbeing loss *due to* systemic failure or other causes? Ignores **N2 (Subject)** – whose wellbeing?
      *   **Resilience/Transformation:** Handles **N7 (Endpoint)** well. Struggles massively with **N3 (Severity Threshold)** and **N8 (Net Negative)** – risks collapsing "collapse" into any major change, losing the "thickly bad" connotation. Downplays **N1 (Multidimensional Failure)** by focusing on systemic *reorganization* rather than *failure*.

  **Conclusion**

  The most exclusionary requirement is the necessity for **multidimensional systemic failure with severity**.

  \answer{Multidimensional systemic failure severity}
