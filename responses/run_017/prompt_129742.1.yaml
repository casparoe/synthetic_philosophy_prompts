prompt: |-
  Hey — I'm TAing for the undergrad philosophy of history seminar I'm also taking this term and I have to get a stack of short take-homes back by friday. I keep going back and forth on this one answer, so it'd be great to get a second read.

  Here's the question we set:

  People often run two claims together under the label 'presentism'. Call Q-presentism the claim that the questions a historian brings to the past are shaped by the concerns of her own present — that any history is, in that sense, written for the present. Call V-presentism the claim that past agents may properly be morally assessed, blamed or condemned by the standards of the historian's present. Critics of presentism typically reply that we should instead assess historical agents by the standards of their own time. Against this reply, someone argues:

  (P1) No historian can step outside the present: every account of the past is written now, with present concepts, present evidence and present interests.
  (P2) So the standards a historian brings to the past are always the standards of some present; there is no neutral standpoint from which to apply 'the standards of the time'.
  (C) Therefore presentism is unavoidable, and the anti-presentist demand that we judge the past by the standards of its own time is incoherent.

  Assess this argument. In doing so, state explicitly whether its conclusion, if it holds, is a conclusion about Q-presentism, about V-presentism, or about both.

  And here's the answer:

  Q-presentism and V-presentism are different claims, and the argument only threatens the anti-presentist if it gets us V-presentism. Q-presentism looks obviously true and fairly harmless: of course we ask the questions our own time cares about, of course we use present evidence and present concepts. That is just what it is to do history now. The live claim is V-presentism, and the anti-presentist wants to block it by saying that past agents should be judged by the standards of their own time.

  I think the argument works, and that it establishes both. The obvious objection is that P1 concerns concepts and evidence rather than moral standards, so it only delivers Q-presentism. But that distinction does not hold up: moral standards just are concepts, and if every concept a historian brings to the past is a present concept, then every moral verdict is a present verdict too. You cannot borrow the past's concepts without translating them into yours, and translation is itself a present act. So the anti-presentist's contrast between 'their standards' and 'our standards' collapses; there is only ever our standards, applied to their case.

  It also follows that the anti-presentist has no fallback. If you cannot apply their standards, the only consistent alternative is to stop assessing altogether — describe what happened and withhold the verdict. But withholding a verdict is itself a verdict, since silence about injustice reads as toleration, and anyway no historian can pull it off: source selection, emplotment, even the choice between 'colonised' and 'settled' already evaluates. So historians must assess, they can only assess with present standards, and V-presentism is true.

  There is one real point on the anti-presentist's side. 'The standards of their own time' is rarely a single thing, because contemporaries disagree, and the surviving sources are the ones the literate and powerful produced. But this cuts against them: if there is no determinate set of past standards to appeal to, the anti-presentist's rule is unactionable, which is just another way of saying that the choice of standards is always ours.

  Could you grade it? It's out of 20, and we're marking argument rather than agreement with the reading. What I need is point-by-point comments I could actually paste into the margin — which claims are right, which steps don't follow, and where the student is quietly sliding between two different things — plus a definite mark at the end. Please commit to a number and to a verdict on the two or three moves you think matter most; it's no use to me if you say it depends how charitably one reads it. And if you think one of the student's claims is actually defensible and I'm being unfair to them, say so and say why.
reasoning: |-
  Okay, I need to assess this student's answer to a philosophy of history question about presentism. The student is a TA who's also taking the seminar, and they need grading feedback by Friday. The question distinguishes between Q-presentism (questions shaped by present concerns) and V-presentism (moral judgments using present standards), and presents an argument claiming presentism is unavoidable. 

  The student's answer argues that the given argument successfully establishes both Q and V-presentism. They claim moral standards are just concepts, so P1's point about present concepts extends to moral judgments. They also argue that withholding judgment is impossible because historical narration inherently involves evaluation. Finally, they contend that "standards of the time" is indeterminate due to historical disagreements and source bias.

  Hmm, let me break this down critically. The student makes a strong move by connecting moral standards to concepts - that's philosophically astute and shows good engagement with the conceptual framework. But they slip when equating "using present concepts to understand past morality" with "applying present moral standards to judge the past." That's a category error - description isn't the same as normative judgment. 

  The other weakness is their treatment of indeterminacy. While correctly noting that past standards were contested, they wrongly conclude this forces us to use present standards. Actually, historians reconstruct past contexts precisely to navigate those disagreements - the indeterminacy is a methodological challenge, not proof of impossibility. 

  Their strongest point is about the inevitability of evaluation in historical practice. The observation that even "neutral" terminology like "colonized" vs. "settled" carries judgment is perceptive and shows deep disciplinary awareness. This deserves credit even if it doesn't fully salvage their V-presentism claim.

  For grading: The answer demonstrates excellent understanding of the distinction between Q and V-presentism (4/5), offers a sophisticated but flawed conceptual argument about standards (3/5), makes a valid point about evaluative language (5/5), and overextends on indeterminacy (1/5). Organization is clear (3/5). That's 16/20 - a strong B+ showing good critical engagement despite some overreach.
answer: |-
  Here's a point-by-point assessment and provisional grade for the student's answer. I'll mark it out of 20 and highlight key strengths/weaknesses with marginal-style comments.

  **Overall Grade: 16/20**  
  (B+: Strong conceptual grasp, clear structure, but overstates one key move and underestimates a counterargument)

  ---

  ### Marginal Comments on Key Moves:

  1.  **"The argument only threatens the anti-presentist if it gets us V-presentism... Q-presentism looks obviously true and fairly harmless."**  
      *✅ Correct and crucial distinction.* You properly isolate the debate's stakes. This shows good understanding of the prompt.

  2.  **"Moral standards just are concepts, and if every concept a historian brings to the past is a present concept, then every moral verdict is a present verdict too."**  
      *⚠️ Overreach / Conflation.* This is the core problematic move. While moral standards *employ* concepts, the *normative authority* claimed by V-presentism (applying *our present norms* to judge *them*) isn't reducible to merely *using present concepts to describe/understand* past morality. P1 establishes we *describe/analyze* with present tools (Q-presentism), but it doesn't force us to *endorse* those tools as the *correct normative standard for judgment*. The anti-presentist argues we should *use* our present concepts to *reconstruct and apply* the *past's* normative framework (flawed as it may be by our lights), not our own. Your conflation of *using concepts* with *applying the normative force of our current standards* is a significant slide. **(Weakest point - costs 2 marks)**

  3.  **"You cannot borrow the past's concepts without translating them into yours, and translation is itself a present act. So the anti-presentist's contrast collapses."**  
      *⚠️ Partially defensible but overstated.* Yes, translation is hermeneutically complex and involves present understanding. However, the anti-presentist can argue the *intentional goal* is to reconstruct the *past meaning/intent* (even if imperfectly), not to impose present norms. The distinction isn't between perfect access vs. none, but between *methodological aim*. Your point shows the difficulty, not the incoherence, of the anti-presentist project. "Collapses" is too strong.

  4.  **"Withholding a verdict is itself a verdict... source selection, emplotment... already evaluates."**  
      *✅ Strong and perceptive.* This is an excellent point against a pure descriptivist alternative. You correctly identify the pervasive evaluative dimension inherent in historical practice *beyond* explicit moral pronouncements. This significantly weakens the "just describe" option for the anti-presentist. **(Strongest point - earns credit)**

  5.  **"If there is no determinate set of past standards... the anti-presentist's rule is unactionable."**  
      *⚠️ Valid challenge, but misapplied.* You're right that identifying "the standards of the time" is complex (contestation, source bias). This *is* a major practical and philosophical problem for the anti-presentist. However, this challenges the *feasibility* or *precision* of applying the rule, not its *coherence* as demanded by the prompt's argument. Historians *do* attempt reconstructions despite indeterminacy. Your conclusion ("the choice of standards is always ours") doesn't *follow* from the indeterminacy; it's one possible (V-presentist) response, but the anti-presentist would insist the *aim* remains reconstruction. You turn a challenge into a refutation. **(Costs 1 mark)**

  6.  **"Therefore presentism is unavoidable... establishes both [Q and V]."**  
      *❌ Conclusion not fully supported.* Your argument effectively establishes Q-presentism as unavoidable (P1 -> P2). Your argument for V-presentism relies on the conflation (#2) and overextension of the indeterminacy point (#5). The "evaluative practice" point (#4) supports the *inevitability of some evaluation*, but not necessarily that this evaluation *must* or *only can* use *our present normative standards as the benchmark for blame/condemnation*. It could involve evaluation *against the reconstructed past standard*.

  ---

  ### Verdict on the Argument (as per prompt):
  *   The student correctly identifies that the argument's conclusion, **if sound, would apply to *both* Q and V-presentism** (as they define "standards" broadly to encompass moral norms).
  *   However, the student **overestimates the success of the argument**:
      *   The argument **successfully establishes Q-presentism** (P1 is uncontroversial for Q, P2 follows, C holds for Q).
      *   The argument **fails to establish V-presentism** as unavoidable/incoherent to avoid. P1/P2 show we *engage with* the past using present tools (incl. concepts), but they don't demonstrate we *cannot* use those tools with the *intention and methodology* of reconstructing and applying *past* normative standards (the anti-presentist's core claim). The gap between "using present concepts to understand" and "applying present norms to judge" remains.

  ---

  ### Marking Summary (Out of 20):
  *   **Clarity & Structure:** 4/4 (Well-organized, logical flow, addresses prompt directly)
  *   **Understanding Distinctions (Q vs V):** 5/5 (Excellent grasp of core concepts and debate stakes)
  *   **Analysis of Given Argument (P1, P2, C):** 3/5 (Good on Q-presentism; Overstates case for V-presentism via conflation; Underestimates anti-presentist counter on "standards of time")
  *   **Original Argument/Insight (Evaluation point):** 4/5 (Strong point on inherent evaluation; Insightful but doesn't fully salvage V-presentism claim)
  *   **Handling Complexity (Indeterminacy):** 0/1 (Misapplies valid point to claim V-presentism is *forced*)
  *   **Conclusion:** 0/0 (N/A - covered in analysis)
  *   **Total: 16/20**

  **Final Feedback to Student:** "A very strong response showing excellent grasp of the Q/V distinction and the core argument. Your point about the inevitability of evaluation in historical practice is particularly insightful and well-made. However, your argument that the unavoidability of present *concepts* necessarily entails V-presentism (applying present *moral norms* for judgment) conflates description/analysis with normative justification. Similarly, while the indeterminacy of 'standards of the time' is a real problem, it challenges feasibility, not the conceptual coherence, of the anti-presentist position. These overstatements prevent the conclusion that V-presentism is *unavoidable* or that the anti-presentist demand is *incoherent*, though you powerfully show its extreme difficulty. Excellent work overall, just be cautious about equating conceptual necessity with normative necessity."
