  Next, the common scale problem. Comparing family loyalty to future generations is tricky. Maybe using a scale like welfare or preference satisfaction could work, but it's messy. I think it's possible but not straightforward, so 0.6 fits. 

  Small probabilities of huge benefits—this is a big EA debate. Should we discount low-probability events? Pascal's Mugging is a concern, but ignoring them feels wrong. I side with not discounting, so 0.7 here. 

  The fourth point is about the value of pluralistic compatibility. Maybe there's intrinsic value in choices that respect multiple viewpoints, which averaging might miss. This is speculative, so I'll give it a lower probability of 0.4. 

