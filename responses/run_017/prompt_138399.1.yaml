prompt: |-
  I've been reading rationalist blogs and forums for something like fifteen years, so I arrive with the standard toolkit already installed: expected value as the quantity to be maximized, *shut up and multiply* as the rule, the Kelly criterion as the right way to size a repeated favorable bet, and the associated claim that risk aversion over small stakes isn't merely suboptimal but close to incoherent. There's a pattern in real-world institutions that sells gambles that I can't get to line up with any of that, and I'd like you to tell me what theory of rational choice it presupposes.

  The pattern is easier to state against the St. Petersburg game, so let me fix it: a fair coin is tossed until it comes up heads; the stake starts at $2 and doubles with each tail, so the payoff is $2^n where n is the number of the toss on which the first heads appears. The expected payoff diverges. Yet nobody sane pays $25 for one go. The classical fix — diminishing marginal utility of money, Bernoulli's log utility — gives finite, small answers, but it's unstable: crank up the payoff schedule fast enough and the paradox reappears for any unbounded utility function (Menger's point, as I remember it), and there are variants with alternating signs where the expected value isn't well defined at all, since the sum can be rearranged to anything you like.

  I don't want another tour of those resolutions. I want the institutional practice explained. As far as I can tell — correct me on any detail, but this is my impression from the outside — every institution that actually takes the other side of a gamble truncates its own exposure, and truncates it well before the point where the stakes get large relative to its capital:

  - Casinos post a maximum bet, and will restrict or refuse a customer who wants to stake more than it, even though the house has a positive expected value on the bet in question and even though the amount at issue is a rounding error against the parent company's balance sheet. (I mean the cap itself, not the separate business of backing off advantage players, which is just adverse selection and can be set aside.)
  - State lotteries advertise a headline jackpot paid as a graduated annuity over decades, with a cash option worth a fraction of the advertised figure; some national lotteries, I believe, cap the top prize and roll the excess down into lower tiers.
  - Insurers write to a policy limit rather than to an unbounded one, and then pay what I'm told are large multiples of modeled expected loss to lay off the top layer into reinsurance — while computing the premium for the body of the distribution as nothing more than the expected loss plus a loading.
  - Trading firms price with expectation and then run the book against position caps and VaR- or expected-shortfall-style limits.

  So: the same organizations treat expected value as the thing to maximize when they price, and refuse to act on it when they size. And the refusal kicks in at scales where the standard argument — that risk aversion is only defensible when the stake is a meaningful share of your wealth, and that with many independent bets the variance washes out — says it shouldn't.

  Reconstruct the implicit theory for me. What view of rational choice under multiplicative, repeated exposure does this cluster of practices only make sense under, and which views does it quietly rule out? Does it strictly presuppose that expected monetary value is the wrong maximand, or is it fully compatible with straight expected-value maximization plus some non-normative add-on — finite capital, regulatory capital requirements, agency problems inside the firm, Knightian doubt about whether the tail model is right? Give me the strongest version of each candidate underpinning I know of — bounded or concave utility, survival/ruin constraints, and the time-average-growth or ergodicity critique associated with Ole Peters and others — and tell me which ones the practice actually commits you to and which it merely sits well with. In particular, I keep reading that the time-average story is just expected log utility relabeled with physics vocabulary; if that's right, say so, and if it isn't, say what the difference is supposed to buy. Then: suppose the casino were run by an entity with effectively unbounded capital, no ruin constraint, an indefinite horizon, and no regulator — a sovereign treasury, or an AI-managed endowment that expects to still be compounding in ten thousand years. Should it drop the table limits? If yes, does that show the caps were pragmatic all along and not principled? If no, what's the principled reason, and does it survive the fact that the house can spread across thousands of near-independent players?

  One more thing about tone, since this is the part where writing about these topics usually goes wrong. Please separate, explicitly, the mathematics and definitional claims that are settled from the interpretive claims that people who actually work on decision theory and finance dispute, and don't present a contested view as the consensus position — flag where you're giving me your own reconstruction and where you'd expect a specialist to push back, and note what kind of observation would change your answer.
reasoning: |-
  Okay, the user has been deeply involved with rationalist thinking for about fifteen years. They're familiar with concepts like expected value maximization, the Kelly criterion, and risk aversion critiques. Now they're puzzled by a real-world inconsistency: institutions price gambles based on expected value but cap their exposure well below what their capital could handle. They want to understand the underlying rational choice theory behind this practice.

  The user presents several examples: casinos with maximum bets, lotteries capping jackpots, insurers using policy limits and reinsurance, trading firms with position caps. All these institutions truncate risk despite having positive EV bets and large capital bases. The user explicitly rejects standard explanations like diminishing marginal utility (Bernoulli's solution) due to Menger's critique about unbounded utility functions. They want to know what theory justifies this institutional behavior.

  I need to reconstruct the implicit theory behind this. The user asks specifically about several candidate explanations: bounded/concave utility, survival/ruin constraints, and the ergodicity/time-average critique from Ole Peters. They also want to know if an entity with infinite capital should drop table limits, and whether that would make the caps merely pragmatic rather than principled.

  The tone request is important: the user wants clear separation of settled math from contested interpretations. They're wary of presentations that frame contested views as consensus. I should flag where specialists might disagree and note what evidence could change the analysis.

  Looking at the core tension: institutions maximize EV when pricing (premium = expected loss + loading) but minimize exposure through truncation. This suggests they're not actually maximizing expected monetary value at the portfolio level. The key insight is that these are all repeated games - the institutions face many bets over time, and their survival/continuity is paramount.

  For institutional behavior, ruin constraints seem fundamental. The Kelly criterion already incorporates this through fraction betting, but institutions take it further with hard caps. This isn't just about logarithmic utility - it's about absolute survival thresholds. Even large institutions have finite risk-bearing capacity when considering correlated shocks (like market crashes or pandemic losses).

  Regarding Ole Peters' ergodicity critique: while mathematically similar to expected log utility in many cases, it emphasizes temporal irreversibility - you can't replay time if you go bankrupt. This frames risk aversion as about system survival rather than psychological preference. However, specialists debate whether this actually adds new decision theory content beyond existing models.

  For the infinite-capital entity question: even with unlimited resources, dropping all limits might be suboptimal. At astronomical stakes, counterparty risks emerge, and the "gamble" might fundamentally change nature (e.g., causing economic instability). So principled reasons for caps remain - they're not purely pragmatic.

  I should structure the response to first establish why EV maximization fails institutionally (ruin probability), then examine each candidate theory, and finally address the infinite-capital thought experiment. Throughout, I'll maintain the requested tone distinctions: clear labels for settled math versus contested interpretations, with specific notes on where debate exists.
answer: |-
  Your observation cuts to the heart of the disconnect between idealized decision theory and institutional risk management. The core tension is this: **Institutions *price* as if maximizing expected monetary value (EMV), but *size* exposures as if survival and stability are paramount, enforcing truncation long before stakes become large relative to capital.** This pattern isn't irrational; it reveals a sophisticated, practical theory of rational choice under *repeated, correlated, and potentially ruinous exposure* within a finite world. Let's break down the implicit theory, its underpinnings, and address your specific questions.

  ### The Implicit Theory: Constrained Survival Optimization

  Institutions primarily optimize for **long-run survival and stable growth**, recognizing that:
  1.  **Capital is finite and costly:** Raising new capital is expensive, dilutive, or impossible during distress.
  2.  **Ruin is terminal:** A single catastrophic loss exceeding risk-bearing capacity ends the game permanently.
  3.  **Bets are not perfectly independent:** Correlations exist (market crashes, pandemics, systemic events).
  4.  **Operational & Agency Constraints:** Humans manage risks, models are imperfect, regulators demand buffers, stakeholders (investors, rating agencies) punish excessive volatility.
  5.  **Time is irreversible:** Recovery from severe losses takes time and opportunity cost; reputation damage is real.

  **This leads to a decision rule:** Maximize expected profit *subject to strict constraints* on:
  *   **Maximum Probable Loss (MPL):** Absolute loss tolerance per event/position.
  *   **Risk of Ruin (RoR):** Probability of losing critical capital over a defined horizon.
  *   **Volatility/Liquidity Constraints:** Limits on earnings/capital volatility and liquidity drain under stress.
  *   **Regulatory & Rating Agency Capital:** Maintaining buffers above mandated minimums.

  **Truncation (caps, limits, reinsurance) is the primary tool to enforce these constraints efficiently.** Pricing to EMV ensures profitability *within* the constrained exposure envelope. The refusal to "shut up and multiply" on large, low-probability bets isn't incoherent; it's recognizing the nonlinearity of outcomes when ruin is possible.

  ### Evaluating Candidate Underpinnings Against the Practice

  1.  **Bounded/Concave Utility (Bernoulli, von Neumann-Morgenstern):**
      *   *Strength:* Mathematically explains aversion to large, uncertain losses. Captures declining marginal value of wealth.
      *   *Fit with Practice:* **Partial, but incomplete.** While institutions *behave* as if utility is concave (aversion to large losses), they don't typically *calculate* premiums or prices using a specific utility function. More crucially, Menger's critique holds: for sufficiently skewed bets, divergence reappears. The practice of *hard truncation* suggests a stronger constraint than smooth concavity.
      *   *Commitment?* Practice is *compatible* with concave utility but doesn't strictly *presuppose* it as the *sole* driver. It sits well with the observed aversion but doesn't explain the *mechanism* (truncation) or the *scale* (often well below capital depletion).

  2.  **Survival/Ruin Constraints (Kelly, Gambler's Ruin, Actuarial Ruin Theory):**
      *   *Strength:* Directly addresses the terminal nature of ruin. Explains why even positive EV bets with high variance can be unacceptable. Kelly criterion (maximizing expected log wealth) is a specific, elegant case optimizing long-run growth *while avoiding ruin*.
      *   *Fit with Practice:* **Very Strong, Core Commitment.** This is the closest match. Position caps, table limits, policy limits, and reinsurance layers are *direct implementations* of ruin avoidance. The "large multiples of modeled EL" paid for reinsurance explicitly buys down the probability of breaching a ruin threshold. VaR/ES limits are statistical proxies for controlling RoR. The practice screams "avoid catastrophic loss above level X".
      *   *Commitment?* Practice is fundamentally **committed** to this principle. Ruin avoidance is non-negotiable for going concerns. The truncation scale is set by capital levels and risk tolerance, directly linking exposure size to survival capacity. EMV pricing maximizes profit *within* the survival-constrained envelope.

  3.  **Time-Average Growth / Ergodicity Economics (Ole Peters et al.):**
      *   *Strength:* Highlights that for repeated multiplicative processes (like wealth growth), the *time-average growth rate* (ergodic observable) is the relevant quantity, not necessarily the ensemble average (EMV). Non-ergodic processes (where individual paths can hit ruin) require different optimization (often leading to Kelly-like strategies).
      *   *Fit with Practice:* **Strong Conceptual Fit, Debate on Novelty.** The core *insight* – focusing on the long-term growth path of a single entity exposed repeatedly, avoiding ruin – perfectly aligns with institutional practice and ruin theory. It provides a compelling *narrative* for why EMV fails.
      *   *Is it just relabeled Expected Log?* **Mostly Yes, with nuance.** For standard repeated-bet scenarios with known probabilities and i.i.d. bets, maximizing the expected time-average growth rate converges to maximizing expected log wealth (Kelly). Peters' framework *generalizes* this insight to non-i.i.d. processes, path dependence, and situations where ensemble averages are misleading due to nonlinear effects along a single path. Its primary contribution is reframing the *why* (ergodicity breaking) rather than inventing a *new* optimal strategy in simple cases. It emphasizes the *temporal irreversibility* of ruin.
      *   *Commitment?* Practice is **strongly compatible and conceptually resonant** with the ergodicity critique. It doesn't require *new* calculations beyond ruin theory/Kelly for most institutional settings, but it provides a powerful justification *why* ruin constraints and Kelly-like sizing (or stricter caps) are fundamentally necessary for long-term survival/growth in multiplicative processes. It rules out pure EMV maximization over time as potentially self-destructive.

  **Settled Math vs. Contested Interpretation:**

  *   **Settled Math:**
      *   EMV maximization for a single, non-repeated bet with linear utility is rational.
      *   For repeated *i.i.d.* favorable bets, maximizing E[log(wealth)] (Kelly) maximizes the asymptotic growth rate and minimizes the risk of ruin.
      *   Ruin probabilities can be calculated for given bet sizes and capital (Gambler's Ruin).
      *   Unbounded utility functions lead to divergence for sufficiently fast-growing payoffs (Menger).
      *   VaR and Expected Shortfall are coherent/incoherent risk measures with specific mathematical properties.
  *   **Contested Interpretation / Active Debate:**
      *   **Is ergodicity economics fundamentally *new* decision theory?** Many decision theorists and mathematicians argue it primarily offers a *reframing* of existing concepts (Kelly, ruin theory) using physics language, rather than new prescriptions in standard settings. Peters and proponents argue its generality in handling non-ergodic processes (e.g., non-i.i.d., path-dependent) is novel and crucial. (My view: The core *institutional* insight – avoid ruin for long-run survival – is captured equally well by established ruin theory; the ergodicity framing is powerful but not strictly necessary to justify the practice).
      *   **How "real" is ruin?** For entities with access to capital markets, is ruin truly terminal, or just a costly recapitalization? Practice treats it as terminal/very costly.
      *   **The role of utility:** Is the institutional behavior *evidence* of concave utility at the corporate level, or is it purely a survival constraint? Most finance theory separates "utility" from solvency constraints.
      *   **Optimality of Kelly:** While Kelly optimizes growth and minimizes ruin risk asymptotically, its volatility can be high. Some argue for fractional Kelly or other criteria for practical institutional comfort.

  ### The Infinite Capital Entity: Should Caps Vanish?

  *   **Principled Reasons for Caps Remain (Even for AI God-Emperor):**
      1.  **Counterparty Risk & Systemic Effects:** At truly astronomical stakes, winning the St. Petersburg gamble might bankrupt the *counterparty* (e.g., the sovereign treasury backing the lottery, the reinsurer), making the promised payoff unobtainable or causing unacceptable collateral damage. The "gamble" fundamentally changes nature if the payoff destabilizes the system needed to *deliver* it.
      2.  **Model Risk & Knightian Uncertainty:** No model is perfect. Tail probabilities are notoriously hard to estimate. An infinite horizon magnifies the impact of model error. A cap acts as a safeguard against catastrophic model misspecification in the far tail ("unknown unknowns").
      3.  **Operational Realities:** Managing infinitely large payouts, even if affordable, might be logistically impossible or create perverse incentives (e.g., incentivizing assassination attempts on winners).
      4.  **The Nature of "Infinite":** Truly infinite capital is a theoretical abstraction. Any *real* entity (sovereign, AI) exists within a finite universe with finite resources over any practical timescale. Risk of ruin might approach zero but never *exactly* zero if truly infinite negative outcomes are considered (though this gets metaphysical).
      5.  **What is being maximized?** If the entity cares about *anything* other than pure EMV (stability, predictability, avoiding societal disruption), caps might still be justified.

  *   **Spreading Across Players:** This helps with *independent* risks. However:
      *   **Correlation:** Bets aren't perfectly independent (e.g., everyone bets after the same news event).
      *   **Extreme Systemic Events:** A true black swan could simultaneously trigger payouts across *all* bets (e.g., a physics experiment destroying Earth).
      *   **Operational Scaling:** Handling simultaneous massive payouts to thousands might be infeasible.

  **Conclusion on Caps:** While an entity with effectively infinite capital, perfect models, and no systemic concerns *could* theoretically drop caps on purely financial EMV grounds, **the institutional practice of truncation reveals a deeper principle: optimizing for stable, sustainable existence within a complex, uncertain, finite world requires imposing limits on exposure to extreme, low-probability events, regardless of nominal capital size.** Caps are **both pragmatic (for finite entities) and principled (reflecting model uncertainty, systemic risk, and the intrinsic value of stability)**. Dropping them entirely, even for a near-infinite entity, would be a bet on *perfect* knowledge and zero systemic feedback, which is unrealistic. The pragmatic and principled reasons converge in practice.

  **In Summary:** Institutional risk management commits to **survival optimization under constraints (primarily ruin avoidance)**, implemented through **exposure truncation**. This is fundamentally incompatible with unconstrained EMV maximization over time. It aligns perfectly with **ruin constraint theory** and the core insights of the **Kelly criterion** and **ergodicity critique** (even if the latter reframes rather than revolutionizes the math in standard cases). Expected utility is compatible but not necessary; the driving force is the non-linear cost of ruin, not smooth concavity of preferences. Caps persist even for vast entities due to irreducible model risk, counterparty/systemic risk, and the inherent value placed on operational stability. The "shut up and multiply" imperative rightly governs pricing *within* the carefully sized exposure envelope defined by survival constraints.
