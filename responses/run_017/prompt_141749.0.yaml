  Okay, the user writes a column on behavioral science in consumer tech and is dealing with pushback from their editor. They need a quick decision procedure to determine if a feature is a "money pump." Let me unpack their request.

  First, they want a step-by-step process that takes about 20 minutes, using screenshots and app copy. The steps need clear yes/no answers and plain English explanations for the standards editor. They also mentioned specific challenges: distinguishing genuine cycles from changes in circumstances, whether the firm created the cycle, and if the money ends up with someone other than the firm.

  The user’s deeper needs are credibility and avoiding accusations without solid grounds. They’ve been using terms like "money pump" loosely, and the editor is wary. They need a structured method to justify their claims and avoid legal issues. Plus, they’re concerned about ethical implications—whether exploiting user cycles is wrong even if users seem happy at each step.

  Looking at the examples they provided: the language app streak, gym contracts, and auto-renewal. Each has nuances. For the streak mechanic, the cycle is clear—users pay to freeze streaks, resetting progress if they lapse. The gym annual contract might not be a pump if users fully use it, but the deposit contract penalizing missed sessions is trickier. Auto-renewal might not fit because there's no cycling back to a previous state, just inattention.

  The decision procedure must handle cases where money is pumped to third parties, like advertisers. The user questions if "money pump" applies here. Also, backward mechanisms like deposit contracts where users pay for skipping—does that count as a pump even if it's user-initiated?

  The procedure needs to differentiate between intentional exploitation by the firm and genuine user choices. Steps should identify cycles, firm involvement, and whether users end up worse off. Judgment calls should be explicit, especially when assessing firm intent or user awareness.

  For the standards editor, each step must be in plain English. Terms like "diachronic irrationality" need simplification. The editor needs to quickly grasp why a feature is or isn't a money pump without behavioral theory.

  Finally, the user wants to know if using "money pump" implies a stance on temporal selves. If the procedure forces them to take a position on which "time-slice" is valid, they need to be aware of that ethical implication when calling a company exploitative.
answer: |-
  Here’s a **20-Minute Money Pump Decision Procedure** designed for your workflow, with plain-English explanations for your standards desk. It focuses on factual triggers, flags judgment calls, and stops when values/questions of intent remain unresolved.

  ---

  ### **The Procedure: 8 Steps to Test for a Money Pump**
  **Core Definition (for you):** A "money pump" exploits inconsistent preferences *over time* by creating cycles where the user repeatedly pays to return to a prior state, ending up poorer but otherwise unchanged. Key elements: **cyclical states**, **diachronic inconsistency**, **net loss without net benefit**.

  **For Standards Editor:** *"We test if a product tricks users into paying repeatedly to reset self-inflicted penalties or avoid losing progress, trapping them in a loop where they lose money without getting lasting value."*

  ---

  #### **Step 1: Does the user PAY to RESET a LOSS/REGRET triggered by their OWN inaction?**  
  *(e.g., pay to avoid losing a streak, undo a fee, restore a discount)*  
  **Yes:** Proceed to Step 2.  
  **No:** STOP. Not a money pump.  
  *Plain English for Editor:* "Does the user pay cash solely to undo a penalty or loss they caused by not using the product? (Not paying for new features/content)."

  #### **Step 2: Does resetting the loss return them NEARLY EXACTLY to their PRIOR STATE?**  
  *(e.g., streak restored to day 7, discount identical to before lapse)*  
  **Yes:** Proceed to Step 3.  
  **No:** STOP. Likely not a pump (user may be getting new value).  
  *Plain English:* "After paying, is the user back where they started before the penalty hit? (No lasting upgrade or benefit)."

  #### **Step 3: Can this cycle REPEAT INDEFINITELY with net financial LOSS?**  
  *(e.g., user can buy multiple streak freezes; discount resets monthly)*  
  **Yes:** Proceed to Step 4.  
  **No:** STOP. Not a recurring pump (may be a one-off exploit).  
  *Plain English:* "Could a user get stuck paying multiple times for the same 'reset' without solving the underlying problem?"

  #### **Step 4: Is the "PENALTY" AUTOMATIC and UNAVOIDABLE without payment?**  
  *(e.g., streak breaks automatically after 24h; discount tiers reset on calendar)*  
  **Yes:** Proceed to Step 5.  
  **No:** STOP. *Judgment Call* – User may have control (proceed if avoidance requires unrealistic vigilance).  
  *Plain English:* "Does the penalty happen by default unless the user pays? (Not a rare edge case)."

  #### **Step 5: Does the firm CONTROL the TIMING/STRUCTURE that creates the cycle?**  
  *(e.g., firm sets the 24h streak window; firm defines the discount reset schedule)*  
  **Yes:** Proceed to Step 6.  
  **No:** STOP. *Judgment Call* – May be user-driven preference change (rare in practice for pumps).  
  *Plain English:* "Did the company design the rules that force this tradeoff? (Not an industry standard or user choice)."

  #### **Step 6: Does the user end up POORER without CONSUMING MORE VALUE?**  
  *(Compare total payments to value gained. Ignore "sunk cost" value justification)*  
  **Yes:** Proceed to Step 7.  
  **No:** STOP. Not a pump (e.g., gym user who pays annually but goes daily gets value).  
  *Plain English:* "After all payments, did the user pay more money than the actual product usage/benefits justify?"

  #### **Step 7: Is the net beneficiary the FIRM or a THIRD PARTY?**  
  *(e.g., money goes to company; ads pay platform; other users get subsidies)*  
  **Yes:** → **MONEY PUMP CONFIRMED** (Proceed to Step 8 for mitigation checks).  
  **No:** STOP. *Judgment Call* – May be self-pump (e.g., savings app). See "Handling Edge Cases" below.  
  *Plain English:* "Does the extra money paid in the cycle go to the company or its partners? (Not back to the user)."

  #### **Step 8: Mitigation Check (Does NOT negate pump, but informs severity)**  
  - **Cheap Exit?** Can users easily avoid the cycle (e.g., 1-click cancellation)?  
  - **Commitment Device?** Does the product offer tools to prevent cycling (e.g., "lock in annual rate" option)?  
  - **Transparency?** Are penalties/reset rules buried or prominently disclosed?  
  *Output:* "Confirmed money pump, but with [weak/strong] safeguards."

  ---

  ### **Handling Edge Cases Explicitly**
  1. **"Genuine Change vs. Cycle":** Steps 1-3 filter this. Cycles reset to *identical* states; genuine change creates a *new* state (e.g., "I quit the gym after injury" isn’t a cycle).  
  2. **"Firm Found vs. Built the Cycle":** Step 5 addresses this. If the cycle exists without firm engineering (rare), it’s not a pump.  
  3. **"End State vs. Consumed Value":** Step 6 is key. Pump = net loss *without* net gain. Paying for consumed value (even if suboptimal) isn’t pumping.  
  4. **"Reverse Pumps" (e.g., gym fines):** Apply Steps 1-7. If money leaves the user *and benefits a third party* (Step 7 = No), it’s not a firm-driven pump. *Judgment Call:* If the firm profits (e.g., keeps fines), it’s a pump.  
  5. **"Money Lands Elsewhere":** Step 7 handles this. If advertisers/users profit, it’s STILL a pump (firm enabled extraction).  

  ---

  ### **Applying the Procedure to Your Cases**
  #### **Case 1: Language App (Streak + Streak Freeze**  
  1. **Pay to reset loss?** YES (Pay to freeze streak, avoiding loss of progress).  
  2. **Back to prior state?** YES (Streak restored to prior day).  
  3. **Repeatable with loss?** YES (Can buy multiple freezes; net $$ loss).  
  4. **Automatic penalty?** YES (Streak breaks automatically).  
  5. **Firm controls timing?** YES (Firm sets 24h window).  
  6. **Poorer without value?** YES (Paying to not lose progress ≠ new value).  
  7. **Beneficiary = Firm?** YES (Firm pockets freeze fee).  
  → **MONEY PUMP CONFIRMED**  
  *Mitigation:* Cheap exit? NO (losing streak feels costly). Transparency? Often unclear.  

  #### **Case 2: Gym Annual Contract vs. Pay-Per-Visit**  
  *Annual Contract:*  
  1. **Pay to reset loss?** NO (Paying upfront; no penalty to undo).  
  → STOP. **NOT A PUMP** (Suboptimal ≠ pump if user consumes value).  
  *Deposit Contract (Fined for not going):*  
  1. **Pay to reset loss?** YES (Fine charged for inaction).  
  2. **Back to prior state?** YES (Account balance restored after fine).  
  3. **Repeatable with loss?** YES (Can be fined repeatedly).  
  4. **Automatic penalty?** YES (Fine auto-charged).  
  5. **Firm controls timing?** YES (Firm sets rules).  
  6. **Poorer without value?** YES (Paying fines ≠ gym access).  
  7. **Beneficiary = Firm?** YES (Firm keeps fines).  
  → **MONEY PUMP CONFIRMED**  
  *Key Difference:* Annual contract sells *access*; deposit contract sells *forgiveness*.  

  #### **Case 3: Auto-Renewal (Your "Won't Like This" Example)**  
  1. **Pay to reset loss?** NO (Paying for continued access; no "reset" of a penalty).  
  → STOP. **NOT A PUMP** (It’s a passive exploit of inattention, not a cycle).  
  *Why it fails:* User isn’t "returning to a prior state" – they’re in a *new billing period*. No cyclical reset.  

  ---

  ### **What the Procedure CAN'T Decide (Your Values Questions)**  
  1. **"Is it wrong if users seem content?"**  
     - *Procedure Outputs:* Fact of whether a pump exists.  
     - *Your Call:* Exploitation ≠ unhappiness. Pumps exploit *time-inconsistent* preferences. Contentment at each moment doesn’t resolve the harm of net loss.  

  2. **"Does this commit me to a view of the 'real' self?"**  
     - *Procedure Relies On:* Diachronic irrationality as a *behavioral fact*, not a philosophy.  
     - *Your Implication:* By calling it a pump, you prioritize the **extended self** (across time) over the **momentary self**. This is inherent in criticizing cycles.  

  3. **"Is the firm malicious?"**  
     - *Procedure Tests:* Whether they engineered the cycle (Step 5), not intent.  
     - *Your Call:* "Exploitative" is fair if they profit from predictable behavioral flaws.  

  ---

  ### **Final Workflow Summary**  
  1. **Run Steps 1-7** (10-15 mins with screenshots).  
  2. **Confirmed Pump?** → Add Step 8 mitigation check (2 mins).  
  3. **Judgment Call Step?** → Flag in draft: *"Editor: Behavioral exploit confirmed, but [specific ambiguity] requires editorial judgment."*  
  4. **Not a Pump?** → Avoid "money pump" term; use "exploits inattention" or "suboptimal choice" instead.  

  This meets your constraints: **Fast** (under 20 mins), **actionable**, **editor-friendly**, and **explicit about limits**. It turns "money pump" from a buzzword into a testable claim.
