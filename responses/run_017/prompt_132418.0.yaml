prompt: |-
  Me and my girlfriend were over at my friend Theo's place last night, and Theo and her brother Dmitri got into this enormous argument about consequentialism that ran for like two hours, and because I was the only other person in the room I got dragged into the middle of it and came away with no idea who was actually winning. I'm not going to tell you which side I'm on because I kept flip-flopping the whole walk home. Can you go through it move by move instead? I'm paraphrasing but I think I've got the substance right:

  (1) Dmitri: If consequentialism is true then buying a coffee, going to a gig, having a lazy Sunday is *wrong*, because that money and time could have gone to a cheap intervention that saves a life. A view on which almost every ordinary thing anyone does is wrong isn't a moral theory, it's a malfunction.

  (2) Theo: You're describing how much good there happens to be in the world, not a defect in the theory. If there are cheap rescues lying around everywhere and everyone walks past them, the bad news is about us, not about maximizing. "Too demanding" isn't an objection to a moral theory any more than it's an objection to arithmetic.

  (3) Dmitri: Ok but I'm not complaining about the size of the sacrifice. Even if the cost were tiny — one small thing a week — there'd still be a problem, because consequentialism never has a point where it says "that's enough, the rest is yours". There's no act it certifies as *permissible*, in the sense of "you may just do this, no moral bookkeeping attached". So it can't answer the question people actually bring to morality, which is "what am I allowed to do with my Tuesday". And don't give me the thing where the act is wrong but I'm not blameworthy for it — if the verdict is one I'm told not to act on, what's the verdict even for?

  (4) Theo: There is a limit, it's just not a deontological one. Aggregate over a life: the amount you can usefully give at anything like constant marginal effectiveness is finite, and you have to keep yourself in a condition to keep giving. So the theory sets something like a budget — give up to the point where the cost to your future capacity to do good starts to outweigh what the giving buys. That's a stopping point, it's just derived instead of fixed at ten percent.

  (5) Dmitri: That's exactly my point though — it's derived, so it swings on stuff I don't control: how much everyone else happens to give, what my skills turn out to be worth on the market, which causes are cheapest this decade. Two equally conscientious people can owe wildly different amounts purely because of luck, and whether I'm required to quit my job can flip on some empirical detail I'd have no way of checking. A requirement that sensitive to luck and to facts I can't access isn't something I can be required to do. And there's a nastier version of this: if other people's noncompliance is what inflates my share, then the more selfish everyone else is, the more morality demands of me — the worst people get to set the terms for the best ones.

  (6) Theo: The luck complaint can't be the objection, because commonsense morality is luck-sensitive too — what you owe in rescue cases depends on whether you happen to be the one standing there and what you can afford. And the knowability thing has a standard fix: make it subjective. You're required to do what's best by the lights of your own evidence, so the requirement is at least something you can work out.

  (7) Dmitri: The subjective version makes it worse, not better. Now the demand spreads into my epistemic life: if I'm required to maximize expected value, then any hour spent finding out which charity is better is itself mandatory whenever it has positive expected value, and so is the hour spent working out whether *that* hour was worth it, and so on. And once you're maximizing expected value, small probabilities of enormous payoffs dominate everything, so what I "must" do ends up depending on whatever long-shot scenario I happened to hear about most recently. My duties become a function of what crossed my feed.

  (8) Theo: I think you're conflating a criterion of rightness with a decision procedure. Consequentialism can be what makes acts right without being what you should have in your head when you decide what to do — and it probably recommends that you *not* have it in your head, since people who obsessively calculate seem to end up doing less good. So the demandingness stuff is an objection to consequentialism as a decision procedure, and nobody sensible is defending that.

  What I want from you: go through the eight moves and say what's right and what's mistaken in each — not just who wins overall. Where a move is only partly right, say which part survives. Then tell me what both of them are missing, because I have a feeling they were arguing about two different things (whether consequentialism is a criterion or a guide) but I can't tell whether noticing that dissolves the argument or just relabels it. Also, the wrong-without-blame thing in move (3) is the bit I keep going back and forth on — please say something specific about that one. And if it's worth anything: I'd personally find it most persuasive if someone could tell me whether there's a version of the demandingness worry that survives even after you grant everything Theo says in (4), (6) and (8), or whether at that point the objection is definately spent.

  Lead with your bottom line in the first sentence — who is more right, and about what — then give the reasoning. No preamble, and don't restate my question back to me.
reasoning: |-
  Hmm, the user wants me to analyze an eight-move debate about consequentialism between Dmitri and Theo. Dmitri is attacking consequentialism as being too demanding and impractical, while Theo is defending it by arguing that demandingness reflects reality rather than being a flaw in the theory. The user specifically wants me to evaluate each move, identify what's right and wrong in each, point out what both are missing, and address the "wrong without blame" issue in move 3. They also want to know if any demandingness concerns remain after Theo's strongest arguments.

  Looking at move 1: Dmitri claims consequentialism makes ordinary activities wrong since resources could save lives instead. He argues this makes it a "malfunction" rather than a moral theory. He's right that consequentialism does technically condemn many ordinary acts as suboptimal, but he's mistaken in thinking this automatically disqualifies it as a moral theory - morality might just be demanding.

  For move 2: Theo counters that the problem lies with human behavior, not the theory itself. He's correct that moral theories shouldn't adjust to human weakness, but he overlooks that Dmitri's concern might be about psychological feasibility rather than just demandingness.

  In move 3: Dmitri argues consequentialism lacks a clear "permissible" category, making it unable to answer practical questions like "what can I do on Tuesday?" He also rejects the "wrong but not blameworthy" distinction as useless. His point about the lack of deontic categories is valid, but he's wrong to dismiss the blameworthiness distinction entirely - it serves practical purposes like avoiding counterproductive guilt.

  Move 4: Theo proposes a "budget" approach where you give until marginal costs outweigh benefits. This is a reasonable consequentialist response to demandingness, but it's empirically fragile - the budget depends on unpredictable factors like market value of skills.

  Move 5: Dmitri attacks this budget approach for being luck-sensitive and creating perverse incentives where non-compliers increase demands on compliers. He's right about these vulnerabilities, but he's wrong to claim such sensitivity makes requirements impossible - commonsense morality also has luck-sensitive elements.

  Move 6: Theo counters that commonsense morality is also luck-sensitive, and suggests a subjective version (maximize expected value based on evidence) to address knowability concerns. This is partially correct but the subjective version introduces new problems.

  Move 7: Dmitri argues the subjective version leads to infinite regress in research obligations and makes morality dependent on random information exposure. This is a legitimate concern about subjective consequentialism, though it might be mitigated by decision procedures.

  Move 8: Theo distinguishes criterion of rightness from decision procedure, suggesting consequentialism shouldn't be used consciously. This resolves some psychological concerns but doesn't address the fundamental deontic issues Dmitri raised.

  Both are missing that Dmitri's core concern is about the structure of moral permissions (deontic categories), while Theo focuses on psychological feasibility. The "wrong without blame" distinction survives because it helps prevent moral despair, even if the act remains technically wrong.

  After granting Theo's points (budget, subjective duty, decision-procedure separation), a residual demandingness worry remains: consequentialism still can't deliver non-arbitrary permissions or guarantee that ordinary life isn't constantly suboptimal. So Dmitri's deeper worry about morality's practical role isn't fully resolved.

  Theo is more right about consequentialism's coherence as a criterion, but Dmitri correctly identifies structural limitations in providing action-guidance. The user's flip-flopping makes sense because both have valid points about different aspects of morality.
answer: |-
  **Theo is more right about consequentialism's coherence as a moral criterion, but Dmitri correctly identifies unresolved problems with its action-guidance and permission structure.** Here’s the breakdown move by move, followed by what’s missing and the status of the demandingness worry:

  1.  **Dmitri (Demandingness as absurdity):**  
      *Right:* Correct that consequentialism *strictly* condemns most ordinary acts as suboptimal (given cheap rescues).  
      *Mistaken:* Assumes a theory condemning widespread behavior is inherently a "malfunction." This confuses *descriptive accuracy* with *normative validity* – morality *might* be demanding.

  2.  **Theo (Demandingness reflects reality):**  
      *Right:* Correct that the existence of unmet obligations points to a human failing, not a flaw in maximizing *if* maximizing is correct. "Too demanding" isn’t a logical refutation.  
      *Mistaken:* Overlooks Dmitri’s nascent point about *practical function*. Morality might need to offer psychologically feasible guidance, not just a standard.

  3.  **Dmitri (Lack of permissions & useless verdicts):**  
      *Right:* Correct that consequentialism struggles with *non-arbitrary permissions* ("the rest is yours"). Acts are only "okay" if optimal *or* excused, never intrinsically permitted. The "wrong but blameless" move *does* risk making the verdict practically inert if blamelessness is pervasive.  
      *Mistaken:* Overstates the uselessness of "wrong but blameless." It serves purposes: distinguishing objective wrongness from culpability, guiding praise/blame, and motivating better epistemic practices. The verdict isn't *only* for immediate action; it's for evaluating the act itself and shaping character/institutions.  
      *Survives:* The core worry that consequentialism lacks a robust concept of *permissible* acts detached from optimization pressure.

  4.  **Theo (Derived budget):**  
      *Right:* Correct that consequentialism *can* generate a stopping point ("budget") based on diminishing returns and sustainability (e.g., burnout prevention). It’s not infinitely demanding in practice.  
      *Mistaken:* Underestimates the instability Dmitri identifies next. This budget is empirically fragile.

  5.  **Dmitri (Luck-sensitivity & perverse incentives):**  
      *Right:* Correct that Theo’s "budget" makes obligations highly sensitive to uncontrollable luck (others' giving, market value) and creates perverse incentives (non-compliance increases demands on the compliant). This is a deep problem for *assigning specific obligations*.  
      *Mistaken:* Incorrect that this sensitivity makes requirements *impossible*. Commonsense duties (rescue) also involve luck. The requirement is to act on available evidence (as Theo notes next).  
      *Survives:* The problems of extreme luck-sensitivity and the potential for exploitation ("worst set terms for best").

  6.  **Theo (Commonsense luck & subjective duty):**  
      *Right:* Correct that commonsense morality *is* luck-sensitive (e.g., proximity in rescue). Correct that shifting to *subjective* obligations (maximize *expected* value given your evidence) addresses the *knowability* problem.  
      *Mistaken:* Ignores Dmitri’s next point that subjective consequentialism creates new, potentially paralyzing, epistemic demands.

  7.  **Dmitri (Epistemic regress & longshots):**  
      *Right:* Correct that subjective consequentialism (maximize *expected* value) generates potentially infinite epistemic obligations (researching charities, researching research efficiency). Correct that small probabilities of huge payoffs can dominate, making duties sensitive to random information exposure.  
      *Mistaken:* This is primarily an objection to consequentialism as a *deliberative procedure*, not necessarily the criterion.  
      *Survives:* A powerful objection to subjective consequentialism as a *guide for deliberation*.

  8.  **Theo (Criterion vs. Procedure):**  
      *Right:* Correctly identifies the core distinction. Consequentialism as a *criterion of rightness* (what makes acts right/wrong) is distinct from a *decision procedure* (how agents should decide). Consequentialism plausibly recommends *not* using direct consequentialist calculation as a procedure (due to bias, error, inefficiency).  
      *Mistaken:* Doesn’t address Dmitri’s earlier points about the lack of permissions (move 3) or the luck-sensitivity of obligations (move 5), which concern the *criterion* itself, not the procedure.

  **What both are missing:**  
  They conflate two distinct challenges:  
  1.  **Structural:** Does consequentialism, *as a criterion*, provide a satisfactory account of *moral permission* (Dmitri's core worry in 3)?  
  2.  **Psychological/Procedural:** Can humans feasibly *use* consequentialism to guide action (Theo's focus in 8, Dmitri's worry in 7)?  
  Theo’s moves (4,6,8) effectively address *procedural* demandingness and *some* instability (via subjective duty). They don’t resolve the *structural* lack of non-arbitrary permissions or the luck-sensitivity of the obligations *defined by the criterion itself*. Dmitri’s deepest objection is about the former, Theo’s defense focuses on the latter.

  **Status of the demandingness worry after granting Theo (4,6,8):**  
  A **residual demandingness worry survives**, specifically Dmitri’s **structural worry about permissions and the luck-sensitivity of obligations**:  
  *   Even with a derived budget, subjective duty, and indirect procedures, the *criterion* still defines the "budget" and "subjective duty" in terms of maximizing expected value. There is *still* no action that is *simply permitted* without reference to whether it’s the best (or sufficiently good) use of resources *given the current state of the world and others' actions*.  
  *   The obligation *defined by the criterion* remains highly sensitive to luck (others' compliance, market fluctuations, cheap interventions available) and empirical details. While the *subjective duty* (what you must *do*) is knowable, the *objective rightness* of your actions (and whether you met your true budget) is still hostage to fortune in a way many find morally counterintuitive.  
  *   The perverse incentive problem remains: if others shirk, the *criterion* dictates that your obligations increase.  
  Theo resolves the *practical burden* of knowing and acting, but not the *conceptual* issues Dmitri raises about the nature of moral requirement and permission under consequentialism. The objection isn't "definitely spent"; it shifts from psychological impossibility to a critique of the theory's deontic structure.
