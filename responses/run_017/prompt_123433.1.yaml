prompt: |-
  Before I start comparing cyclical pictures of history with directional ones, I want the specification rather than the lineup. Please write the desiderata that an account of history's large-scale shape would have to meet to count as adequate — for a theory meant to do two jobs: say what kind of claim "history cycles" or "history has a direction" even is, and tell me whether five centuries of cumulative science and technology are evidence against recurrence views. Give the case or consideration behind each requirement, mark each as non-negotiable or as the preference of a particular camp, and flag any subset you suspect cannot be jointly satisfied; that tension is the part I most want.

  Three things I want handled explicitly:

  The ratchet asymmetry. Some variables ratchet — a technique, an energy source, or a body of mathematics, once achieved, is very rarely lost — while others plainly do not: regime type, elite cohesion, artistic style, the balance between center and frontier. Call this the ratchet asymmetry. Is a cycle claim about a ratcheting variable coherent at all, or must an honest recurrence view restrict itself to non-ratcheting variables and say why?

  Units and their interactions. Whose history has the shape — a polity, a civilization, a species-wide system — and if several, what does the theory owe us about coupling between units whose cycles might combine into an aggregate pattern that is neither cyclic nor linear?

  Phase identity and projectivity. What makes two periods instances of the same phase rather than merely similar, and can the criterion be applied forward, to a period not yet periodized, or does it work only retrospectively?

  Also say whether the theory must locate us — must it place the present in a phase, and must it explain its own emergence as a stage-relative symptom, in the way a writer who takes himself to be in a late season would have to — or whether that demand is a reductio of the enterprise rather than a requirement on it. Do not collapse type-recurrence with the return of a token, or oscillation with directional accumulation, and treat "no large-scale shape" as a live candidate the desiderata must be able to fail. Name which single requirement excludes the most candidates and which demands are really tribal prejudice. A one-line scorecard for the cyclical tradition from Polybius through Ibn Khaldun's account of group solidarity to the civilizational morphologies of Spengler and Toynbee, and for cumulative or big-history pictures, is welcome at the end, but the criteria are the deliverable.
reasoning: |-
  Hmm, this is an incredibly dense and sophisticated request about historical theory frameworks. The user wants rigorous criteria for evaluating cyclical vs directional models of history, with specific attention to ratchet effects, unit interactions, and phase identification. They're clearly a serious scholar or philosopher of history - note how they coin terms like "ratchet asymmetry" and demand explicit handling of "projectivity."

  Okay, first I need to unpack the core tension: they want desiderata that can both define what historical shape claims even mean and adjudicate whether scientific accumulation disproves cyclical views. The three explicit demands are profound - that ratchet point challenges whether recurrence can apply to irreversible developments, the units question exposes aggregation problems in civilizational models, and phase identity cuts to whether cyclical theories can actually predict rather than just retrodict.

  The meta-layer is crucial too - they want to know which criteria are truly essential versus tribal preferences, and where logical tensions exist. That "which requirement excludes most candidates" point suggests they're hunting for knockout arguments. The footnote about theories having to locate themselves historically is wonderfully self-referential - reminds me of Mannheim's paradox.

  For structure, I'll build the desiderata around their three pillars but add the meta-requirements they imply. The ratchet section must distinguish between recoverable vs unrecoverable losses (mathematics vs Roman concrete). For units, I'll emphasize scale-transcendence problems - how do city-state cycles relate to global patterns? Phase identity needs criteria beyond similarity - perhaps recurrence of functional roles in systemic processes.

  Biggest tensions will be between ratchet-proofing and genuine recurrence, and between projectivity and historical particularity. The self-location demand might be a hidden killer - if cyclical theorists must place themselves in late stages, doesn't that make their theories self-fulfilling prophecies? Meanwhile directionalists struggle with phase identity since their "stages" are often non-repeatable.

  Scoring traditions quickly: cyclical models fail ratchet tests but handle non-linear interactions better; directionalists ace accumulation evidence but flunk on defining phase boundaries. "No shape" survives all criteria best but feels unsatisfying - which is probably the user's point about tensions being illuminating.
answer: |-
  Here are the desiderata for an adequate theory of history's large-scale shape, structured to address your explicit concerns and meta-requirements. Each criterion includes its rationale, negotiability status, and tensions are flagged. The "case/consideration" explains why the requirement matters.

  ### Core Desiderata
  1.  **Ontological Clarity (Non-Negotiable)**
      *   **Requirement:** Must explicitly define the *type* of claim being made about history's shape (cyclical, directional, chaotic, etc.) and specify the *domain* of variables to which it applies (e.g., political institutions, technology, culture, social structure).
      *   **Case:** Without this, the theory is ambiguous. "History cycles" could mean recurrence of specific political forms (Polybius) or entire civilizational lifecycles (Spengler) – radically different claims.
      *   **Tension:** Strict definition may limit scope (e.g., a "cycle" theory restricted to non-ratcheting variables).

  2.  **Handling the Ratchet Asymmetry (Non-Negotiable)**
      *   **Requirement:** Must explicitly account for the fundamental difference between ratcheting variables (e.g., cumulative scientific/technological knowledge, certain energy capture thresholds) and non-ratcheting variables (e.g., political forms, cultural styles, inequality levels). It must state whether its shape claim applies to one type, both, or their interaction, and *how*.
      *   **Case:** Five centuries of cumulative science/tech *is* strong prima facie evidence against *global* recurrence theories that ignore this asymmetry. An adequate theory must explain how recurrence is possible/meaningful despite ratchets (e.g., by restricting scope to non-ratchet domains, arguing ratchets are incorporated into a larger cycle, or showing how ratchets create new types of non-linear dynamics rather than linearity).
      *   **Tension:** Defining a "cycle" encompassing ratcheting variables is conceptually challenging and requires sophisticated mechanisms beyond simple recurrence. **This requirement potentially excludes the most candidates**, especially naive cyclical theories.

  3.  **Specification of Units and Coupling (Non-Negotiable)**
      *   **Requirement:** Must define the primary unit(s) of analysis (e.g., polity, civilization, world-system, species) and provide a coherent account of how interactions *between* units affect the aggregate large-scale shape. It must explain how the shape manifests at different scales.
      *   **Case:** Toynbee's civilizations cycle somewhat independently, but modern globalization creates tight coupling. Does this coupling synchronize cycles, create a new emergent shape (e.g., directional), or lead to chaotic interactions obscuring any large-scale pattern? A theory failing this cannot explain why the aggregate shape isn't just noise.
      *   **Tension:** Accounting for complex, evolving interactions between units (e.g., empires, trade networks, communication tech) makes generating a simple, testable large-scale shape extremely difficult.

  4.  **Phase Identity and Projectivity (Non-Negotiable for Predictive/Testable Claims)**
      *   **Requirement:** Must provide clear, non-circular criteria for identifying when different historical periods (across units or time) represent the "same phase" of the proposed shape. Crucially, these criteria must be applicable *prospectively* (projectivity) to un-periodized futures or other contexts, not just retrospectively.
      *   **Case:** Retrospectively labeling periods as "Golden Ages" or "Declines" is easy but often subjective. What *operational* criteria (e.g., specific institutional configurations, measurable social indicators, functional roles within a systemic process) make two eras instances of the *same* phase? Can we identify the *next* "Age of Conflict" based on the theory *before* it's universally recognized? This is essential for falsifiability and differentiating the theory from mere pattern-finding in the past.
      *   **Tension:** Achieving robust, non-trivial projectivity is extremely hard. Historical particulars often resist neat phase categorization. **This requirement is a major point of failure for many cyclical theories.**

  5.  **Falsifiability / Ability to Fail (Non-Negotiable)**
      *   **Requirement:** The theory must generate claims that are, in principle, falsifiable by empirical evidence or logical contradiction. It must allow for the possibility that "history has no discernible large-scale shape" is the correct answer.
      *   **Case:** A theory that can explain any outcome (e.g., "this apparent progress is just the upswing before the inevitable fall," or "this setback is temporary on the path to progress") is not scientific or analytically useful. It must specify what evidence would count against it. The 5-century science/tech ratchet *must* be a potential challenge for cyclical views.
      *   **Tension:** Balancing explanatory power with specific falsifiable predictions is difficult, especially for complex historical processes.

  ### Meta-Requirements & Tribal Preferences
  6.  **Self-Location Requirement (Tribal Preference - Cyclical Camp)**
      *   **Requirement (Preferred by some cyclicalists):** Must locate the theorist's own present within the proposed shape and explain the theory's own emergence as a phenomenon characteristic of (or symptomatic of) its current phase (e.g., "late civilizations produce morphology theories").
      *   **Case:** Seen as a test of coherence and reflexivity (Spengler, Toynbee). A cyclicalist *in* a purported "late phase" should expect to see theories diagnosing decline.
      *   **Negotiability:** **Tribal Preference.** Directionalists or "no shape" theorists reject this as begging the question or imposing an unnecessary burden. A theory of physics doesn't need to explain why it emerged in the 17th century.
      *   **Tension:** Imposing this can feel like a *reductio* for non-cyclical views. It risks becoming self-fulfilling.

  7.  **Distinguish Type/Token & Oscillation/Accumulation (Non-Negotiable)**
      *   **Requirement:** Must rigorously distinguish between:
          *   Recurrence of *types* (e.g., "despotism," "republic") vs. recurrence of specific *tokens* (e.g., the *exact* Roman Republic).
          *   Mere oscillation (e.g., peace/war, centralization/decentralization) around a mean vs. genuine cyclical return to an *equivalent* prior state.
          *   Oscillation/directionless change vs. genuine directional accumulation/development.
      *   **Case:** Conflating these leads to sloppy arguments. Claiming "war recurs" is trivial oscillation; claiming "the *phase* of Imperial Overstretch recurs" is a stronger cyclical claim. Direction implies net change, not just fluctuation.
      *   **Tension:** Clear distinction often reveals that apparent "cycles" are oscillations within a directional trend, or vice-versa.

  8.  **Parsimony / Explanatory Power (Tribal Preference - Science-Inspired Camp)**
      *   **Requirement (Preferred by directionalists/big history):** Should provide the most parsimonious explanation for the broadest range of significant historical phenomena, integrating evidence like cumulative science/tech.
      *   **Case:** Science/tech ratchet seems to demand a directional component. A theory ignoring it or awkwardly grafting it onto a cycle seems less parsimonious.
      *   **Negotiability:** **Tribal Preference.** Cyclicalists might prioritize explaining recurrent political/cultural dynamics and see parsimony differently. Critics of "big history" may reject its grand scale as reductionist.

  ### Key Tensions (Where Joint Satisfaction is Suspect)
  *   **Ratchet + Genuine Global Recurrence:** Reconciling irreversible, cumulative trends (science, tech, some energy regimes) with a *global* cyclical pattern that truly "returns" to an equivalent prior state seems logically impossible without redefining "cycle" beyond recognition or severely restricting the domain. **This is the core tension highlighted by the science/tech evidence.**
  *   **Projectivity + Historical Particularity:** Creating a phase identity criterion robust enough for prospective application across diverse historical contexts, without being so abstract it becomes vacuous ("eras of conflict") or ignoring significant unique factors, is immensely challenging.
  *   **Unit Coupling + Simple Shape:** Accounting for complex interactions between numerous units (polities, civilizations) across vast time scales makes deriving a single, clear, large-scale shape (cyclical *or* directional) extraordinarily difficult. The aggregate may well be chaotic or patternless.

  ### One-Line Scorecards
  *   **Cyclical Tradition (Polybius → Ibn Khaldun → Spengler/Toynbee):** Strong on non-ratcheting variables (politics, morale, *asabiyyah*), phase identity (retrospectively), and often self-location; weak on handling ratchets (esp. global science), projectivity, falsifiability, and unit coupling beyond the primary unit (civilization).
  *   **Directional / Big History Pictures (e.g., Enlightenment progress, Marx, Modernization Theory, Anthropocene narratives):** Strong on integrating ratchets (science, tech, complexity), parsimony (often), and falsifiability (in principle); weak on coherent phase identity (stages are often fuzzy or non-recurrent), projectivity (predicting next stage), often neglect non-linear dynamics/oscillations within the trend, and can struggle with unit interaction complexity.

  The most demanding requirements are **Handling the Ratchet Asymmetry** (it forces the theory to confront the most glaring counter-evidence to recurrence) and **Phase Identity/Projectivity** (it exposes the predictive and definitional weaknesses of many shape claims). The **Self-Location Requirement** is the clearest example of a tribal preference masquerading as a necessity. The core tension remains the **fundamental challenge of reconciling irreversible cumulative processes with any model positing large-scale historical recurrence.**
