answer: |-
  ### Joint Statement: Agreed Claims on Bradley's Regress and the Unity of the Proposition

  After an adversarial collaboration, the Bradleyan and the structured-proposition theorist jointly affirm the following claims, which represent common ground on the nature and scope of Bradley’s regress argument. These claims are neutral with respect to the soundness or unsoundness of the regress and do not resolve the core disagreements between the positions.

  1. **The core structure of Bradley’s regress**: The regress arises when attempting to explain the unity of a complex (e.g., a proposition, fact, or state of affairs) by invoking an entity that is itself a constituent of the complex. The argument holds that if a constituent (e.g., a relation) is responsible for unity, it must be related to the other constituents; this demands a further unifier, generating an infinite regress. Both parties agree that the regress is formally valid given its starting assumptions.

  2. **Assumptions about the unifier**: The regress argument does not presuppose that the unifier must be of the same logical type as the constituents it unifies (e.g., it does not require that relations, properties, or operations be ontologically homogeneous). However, the argument assumes that the unifier must be an entity (broadly construed) that is part of, or immanent to, the complex. This includes relations, combinatorial operations, or logical forms, regardless of their type differences (e.g., saturated vs. unsaturated entities).

  3. **Target of the regress**: The argument applies indifferently to propositions (understood as structured truth-bearers) and to facts or states of affairs (understood as mind-independent complexes in the world). The regress arises in the same form for both: in propositions, it threatens representational unity; in facts, it threatens metaphysical unity. There is no relevant structural difference between the two cases for the purposes of the regress.

  4. **Relation to other regresses**: Bradley’s regress is distinct from the regress of instantiation (e.g., "What unifies a particular and a universal?") and the regress of truthmaking (e.g., "What grounds the truthmaking relation?"), though all share a common pattern. Bradley’s regress specifically targets the unity of complexes (how parts form a whole), while the instantiation regress targets the exemplification of properties, and the truthmaking regress targets the explanation of truth. They are not identical, but they are analogous in structure.

  5. **The role of logical analysis**: Both parties agree that the regress is triggered by a demand for an explanation of unity. If unity is taken as primitive, the regress does not arise, but this merely shifts the dispute to whether unity can be legitimately treated as primitive or must be explained.

  ### Disagreements Table

  The following table outlines key unresolved disagreements ("cruxes"). Each row includes:  
  - **Crux**: The specific point of contention.  
  - **Bradleyan Position**: Formulated in terms acceptable to the Bradleyan.  
  - **Structured-Proposition Theorist Position**: Formulated in terms acceptable to the structured-proposition theorist.  
  - **Agreed Test/Case**: A shared scenario, argument, or formal test both sides agree is relevant to the crux.  
  - **Bradleyan Prediction**: The Bradleyan’s advance prediction about the outcome of the test.  
  - **Structured-Proposition Theorist Prediction**: The structured-proposition theorist’s advance prediction about the outcome of the test.

  | Crux | Bradleyan Position | Structured-Proposition Theorist Position | Agreed Test/Case | Bradleyan Prediction | Structured-Proposition Theorist Prediction |
  |------|-------------------|------------------------------------------|------------------|----------------------|-------------------------------------------|
  | **(i) Whether the regress survives the move to function–argument structure** | The regress persists because function application is implicitly a relational fact (e.g., "argument \(a\) bears the application relation to function \(f\)"). This relocates unity to the application relation, which must itself be unified with \(f\) and \(a\), generating a regress. Function–argument structure does not avoid the problem. | Function–argument structure blocks the regress because functions are inherently unsaturated (incomplete) and application is a primitive combinatorial operation, not a relation. Unity is secured by the logical form of functions, which require saturation by arguments without needing a further unifier. | **Toy language test**: Define a language with names (e.g., 'a'), monadic predicates (e.g., 'F'), dyadic predicates (e.g., 'R'), negation ('¬'), conjunction ('∧'), and a single quantifier ('∀'). Implement a standard recursive compositional semantics (e.g., Tarski-style). The test is whether, for an atomic formula (e.g., 'Fa'), the semantics assigns a semantic value (e.g., truth conditions) without implicitly presupposing an already-unified complex (e.g., without assuming the unity of the referents in the metalanguage). | The semantics will assign a value to 'Fa' only by implicitly relying on an already-unified complex in the metalanguage (e.g., the function–argument pair \( F(a) \) is treated as a given unity). This presupposition smuggles in the very unity that needs explanation, so the regress resurfaces in the semantics. | The semantics will assign a value to 'Fa' purely via recursive rules (e.g., "the denotation of 'F' applied to the denotation of 'a'"). No already-unified complex is presupposed; application is a primitive operation. The regress is blocked because the rules operate on unsaturated functions, which are inherently combinatory. |
  | **(ii) Whether an infinite hierarchy of unifiers is vicious or benign, and if benign, whether the original complex retains its truth conditions** | The infinite hierarchy is vicious: at no finite stage is the original complex genuinely unified, as each unifier depends on a further one. Consequently, the original complex lacks determinate truth conditions, as these require complete unification. | The infinite hierarchy is benign: the regress is well-founded (e.g., each step is ontologically dependent on the prior), and the original complex is unified at the first step. Truth conditions are preserved via recursive definition, so the hierarchy does not undermine the original complex's representational content. | **Hierarchy test**: Consider a complex like "aRb" (a bears R to b). Construct an infinite hierarchy: Level 0: R(a,b); Level 1: U₁(R,a,b) [unifier for Level 0]; Level 2: U₂(U₁,R,a,b) [unifier for Level 1], and so on. The test is whether Level 0 can be considered unified with the truth condition that a bears R to b, given the infinite chain. | Level 0 is never unified because unification requires the entire infinite chain, which cannot be completed. Thus, Level 0 has no truth conditions (it is not a truth-bearer). The regress shows the complex is inherently defective. | Level 0 is unified by U₁ at Level 1, which is a fact about the system. The infinite chain is a descriptive feature, but Level 0 has determinate truth conditions (a bears R to b) by fiat or recursive grounding. The hierarchy is benign and does not alter the truth conditions. |
  | **(iii) Whether the whole-first variant (proposition prior to constituents) escapes the regress or relocates it** | The whole-first approach relocates the regress: abstraction (extracting constituents from the whole) requires a relation between the whole and the abstracted constituent. This relation must be unified with the whole and the constituent, generating a new regress. Unity is not explained, only deferred. | The whole-first approach escapes the regress: the whole is ontologically prior and intrinsically unified. Abstraction is a derivative operation that does not create a new complex; it merely analyzes the whole. Thus, no additional unifier is needed, and the regress dissolves. | **Abstraction test**: Consider a system where a proposition/fact (e.g., "that F(a)") is primitive, and constituents (e.g., 'F', 'a') are derived via abstraction (e.g., projection functions). The test is whether abstraction must be explained by a relation (e.g., "abstraction operation A links the whole to constituent C") that requires its own unification. | Abstraction implicitly invokes a relation (e.g., A(whole, C)), which must be unified with the whole and C. This demands a further unifier (e.g., U(A, whole, C)), relocating the regress to the abstraction level. Unity remains unsecured. | Abstraction is a cognitive or logical operation external to the complex; it is not part of the ontology of the whole. The whole is given as unified, so abstraction does not generate a new complex requiring unification. No regress arises. |

  ### Note on Verbal Disagreement
  Part of the dispute is verbal, centering on the term "unity." The Bradleyan uses "unity" to encompass two inseparable aspects: (1) what combines constituents into a single entity (e.g., preventing a proposition from being a mere list), and (2) what makes that entity a truth-bearer (e.g., enabling it to represent a state of affairs). For the structured-proposition theorist, "unity" primarily refers to (1)—the combinatorial act (e.g., via unsaturated concepts or operations)—while (2) is addressed separately by truth-conditional semantics. This divergence leads to misalignment: the Bradleyan sees the regress as undermining both (1) and (2), while the structured-proposition theorist holds that (1) can be secured without regress, and (2) follows without issue. The verbal ambiguity explains why some arguments appear question-begging—e.g., the structured-proposition theorist may claim unity is solved by logical form (addressing (1)), while the Bradleyan retorts that truth-bearing (2) remains threatened.
