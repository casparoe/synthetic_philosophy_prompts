answer: |-
  ## Hal's Surprise Party Toast  
  *(Clink glass, keep it warm but crisp)*  

  Hal. You once told us surprise parties are impossible. Said logic forbade it. Well... look around.  
  *(Gentle gesture to the room)*  

  70 years. Scholar. Teacher. Guy who mows his lawn at 6am Sunday. (*Neighbours chuckle*). And today? You walked in... surprised. We heard you say it.  

  Now, Hal spent years on a puzzle: The Surprise Exam. Or... The Hanging. *(Brief pause, avoid grimness)*. The prisoner knows it’s coming someday. But if he thinks Friday noon, he’d expect it by Thursday... so it can’t be Friday. Then Thursday falls... and so on. Proof: no surprise is possible!  

  Hal believed this. Argued it passionately. Begged us: Never throw him a party. Said he’d deduce it... or we’d be liars.  

  So... what broke?  

  Raj over there *(Nod to Raj)* used to argue: Take away the deadline. Say "Someday...". No last day to unpick first. The proof stalls. Surprise stays possible. Hal called that cheating. But Raj... maybe you weren’t wrong.  

  Hal’s own answer? Unpublished. One mimeographed page! He thought "surprise" wasn't about *can't deduce*. It was about *stop watching*. You forget to look. Life distracts you. The guard relaxes. The prisoner... stops calculating.  

  That’s why today worked, Hal. You *could* have deduced it. We gave you the window: "Sometime this week". But by 2pm today? You’d stopped scrutinizing the calendar. You were thinking about... logic papers. Or fixing the gutter. Or the lawn. You weren’t *watching* for us.  

  The paradox broke... not on the page. But in practice. In *you*. People aren’t clocks. We tire. We focus elsewhere. We mow lawns.  

  That’s the heart of it. Surprise doesn’t live in perfect logic. It lives in our wonderfully human... inattention. Our capacity to be absorbed. To move on. To hope.  

  Which brings me to my last point. Hal’s spent years thinking about time, expectation... the paths not taken. Life, like his paradox, sometimes feels bounded. Closed off.  

  But people move on. They soften. They remember what mattered. They... show up.  

  Because some surprises... aren’t endings. They’re returns.  

  Hal... turn around. Look who finally made it.  

  *(You sit down. Hal turns. His estranged friend steps from the kitchen. Your toast lands not as logic, but as grace.)*  

  **Key Verdict Embedded:** "The paradox broke... not on the page. But in practice. In *you*. People aren’t clocks. We tire. We focus elsewhere." *(Explains failure via human behaviour, not abstract deduction.)*  

  **Why This Works:**  
  *   **Two Audiences:** Neighbours get "stop watching/life distracts". Logicians get the meta-commentary on premises. Lawn joke bridges both.  
  *   **Raj Honored:** His "someday" rebuttal is included clearly & concisely. Respectful, not academic.  
  *   **Hal's Answer Central:** His unpublished insight is the *hero*, explaining today's success.  
  *   **The Second Surprise:** Ending on "returns" and "show up" primes emotion, not logic. "Turn around" is action, not setup. Avoids spoiling.  
  *   **Tone:** Warmth through intellect. No schmaltz. Short sentences. Noose paradox named but not lingered on.  
  *   **Verdict:** Clear, human explanation ("People aren't clocks") embedded naturally.  
  *   **Landing:** Hands off perfectly to the emotional payoff of the friend's entrance.
