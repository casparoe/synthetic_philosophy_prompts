prompt: |-
  I'm putting together a lecture for my grad seminar on causation and explanation in the social sciences (philosophy department, but half the room is from psych and education), and I've got into an email argument with a colleague in behaviour genetics that I thought would be easy to settle and now isn't. To make one move precise I invented a statistic: call the *gain heritability* of an intervention the narrow-sense heritability of the change score, i.e. h²(Δ) = V_A(Δ)/V_P(Δ) in the population that actually received the intervention. Suppose a reading programme produces a mean gain of 8 points in some population and h²(Δ) = 0.6 there. Her argument, as near as I can render it:

  (1) h² is a ratio of variances, computed for a defined population under a defined distribution of environments; it partitions variance, not any particular difference.
  (2) If 60% of the variance of Δ is additive-genetic, then 60% of any given child's gain is due to their genes and the remaining 40% is due to everything else.
  (3) The mean gain is just the average of the individual gains, so at most 0.4 × 8 = 3.2 of the 8 points can be credited to the programme; the other 4.8 is genes.
  (4) Generalising: as h²(Δ) goes to 1, the programme cannot be responsible for any part of the mean gain.
  (5) The same reasoning applied to a trait rather than a gain says: if a trait is highly heritable within each of two groups, then a mean gap between those groups — kids in an under-resourced district versus a well-resourced one — is largely genetic, so equalising resources shouldn't be expected to close it, whatever the within-group numbers happen to be.
  (6) But (4) is absurd on its face. Phenylketonuria is about as genetic as a trait gets and is managed by diet; mean height has moved substantially with nutrition; average IQ scores rose a great deal over the twentieth century in ways nobody thinks reflect genetic change. So any argument that shows no intervention can move the mean of a heritable trait has proved far too much.

  I want to keep (1) and (6), and my instinct is to drop (2) — but I'm honestly not sure (2) is where it breaks, and its not even clear to me whether the argument is invalid or valid-with-one-premise-I-dislike. So: name the step you'd reject, say why it looked innocent, and tell me what rejecting it costs — in particular, is (2) salvageable *within* a fixed environment in a way that (3) and (5) are not, and if so what exactly has to be true for the move from a variance decomposition to a claim about a mean difference to be licensed (random assignment of genotypes to environments, no gene-environment covariance, additivity, whatever), and how close those conditions ever get to holding in human populations. Also price the alternative: what would I be committing to if I instead kept (2)–(5) and gave up the standard "heritability does not mean immutability" line, and is there any legitimate statistic that does the work people want a "genetic share of the gap" to do, or is that quantity just not identified from within-group heritability no matter what you assume?

  Give me your confidence level on each part of the diagnosis, and if the whole thing as I've set it up rests on a confusion — including if my gain-heritability gadget is nonsense or if I've strawmanned my colleague — say that plainly instead of handing me a polite diagnosis. Don't cite anything; I can chase references myself, and I'd rather not put a guessed-at paper on a slide in front of twenty grad students.
reasoning: |-
  Okay, let me tackle this problem step by step. The user is a philosophy professor preparing a grad seminar on causation in social sciences, currently stuck in an email debate with a behavior genetics colleague. The core issue revolves around interpreting heritability coefficients, specifically regarding a "gain heritability" statistic they invented. 

  First, I need to unpack the colleague's argument systematically. The key propositions are:
  (1) Heritability as variance partitioning - seems solid
  (2) The problematic leap: equating variance proportion with individual causal attribution
  (3)-(5) Applying this to mean gains and group gaps
  (6) The reductio ad absurdum counterexamples

  Hmm... the critical flaw is definitely in step (2). It's committing what philosophers might call a "fallacy of division" - assuming what's true of the whole (variance proportions) applies to each part (individual causal contributions). But why does this seem plausible initially? Probably because in simple linear models with perfect additivity and no interactions, the math might coincidentally hold. But human traits? Forget it - G×E interactions everywhere, epigenetics, etc. 

  I recall that even Fisher's original ANOVA formulation explicitly warned against this misinterpretation. The variance components describe population structure, not individual etiology. For example, my genes affect my response to dietary interventions, but that doesn't mean the intervention "causes less" of my outcome - it's co-action. 

  The user's "gain heritability" construct isn't nonsense though - it could actually be useful for predicting selection response if we were breeding humans (which we're not!). But for causal claims about interventions? Dangerous. 

  Alternative approaches... if they really want "genetic share of gap" metrics, they'd need unrealistic assumptions: complete random mating, no G×E, no covariance. In human populations? Never happens. Even randomized trials can't fix this because genotypes aren't randomly assigned across generations. 

  Biggest worry: if the seminar oversimplifies this, those psych/ed grad students might walk away thinking heritability estimates justify educational fatalism. Must emphasize that high heritability ≠ intervention futility - just look at PKU or Flynn effect. Should probably prepare a slide contrasting variance decomposition versus causal attribution frameworks. 

  Confidence levels:
  - Step (2) fallacy: 100% 
  - Variance/mean conflation in (3)-(5): 95% 
  - Salvaging (2) even in fixed environments: 0% (unless in trivial linear worlds)
  - Alternative "genetic share" metrics: 5% (only under fantasy assumptions)
answer: |-
  Here's a clear diagnosis of the argument's flaw, with confidence levels and implications:

  **Step to reject: (2)**  
  (Confidence: 98%)  
  *Why it looks innocent:* Variance partitioning uses the language of "due to" (e.g., "60% of variance due to genes"), which misleadingly suggests causal attribution per individual. In a fixed environment, it feels intuitive to apportion credit proportionally.  
  *Why it's wrong:* Heritability decomposes *variation* in a population, not individual *levels* or *changes*. An individual's gain isn't "60% genetic"; genes and environment interact non-additively to *produce* the gain. The statistic describes population structure, not individual etiology.  

  **Where (3) and (5) fail:**  
  (Confidence: 95%)  
  (3) incorrectly applies a variance ratio to a mean difference. The mean gain (8 points) reflects the *causal effect of the intervention* in that population, while h²(Δ) describes why responses *vary* around that mean. Genes influence sensitivity to the program, not the mean gain itself.  
  (5) commits the same error: Within-group heritability says nothing about between-group *mean differences*. Environmental factors (e.g., resources) can cause group gaps even if within-group variation is highly genetic (see "Simpson's paradox" analog).  

  **What rejecting (2) costs you:**  
  - You abandon the tempting but false idea that heritability = proportional causal contribution per individual.  
  - You must clarify that variance decompositions are population-relative and environmentally contingent.  
  *Salvaging (2)?* Only under impossible conditions: perfect additivity (no G×E interactions), no gene-environment covariance (Cov(G,E)=0), and environments identical for all individuals. In humans, these never hold (Cov(G,E) is ubiquitous; non-additivity is the norm).  

  **If you kept (2)-(5) and rejected (6):**  
  (Confidence this is wrong: 100%)  
  You'd commit to genetic determinism:  
  - High h²(Δ) would imply interventions can't change means (absurd, per PKU/Flynn effect).  
  - Group gaps would be "mostly genetic" regardless of environmental differences (eugenicist fallacy).  
  This contradicts causal inference fundamentals: *The mean effect of an intervention is independent of why responses vary around it.*  

  **Legitimate alternatives to "genetic share of gap"?**  
  None. **No statistic derived from within-group heritability can quantify the genetic contribution to a mean difference.** (Confidence: 90%)  
  - Between-group gaps could be 100% environmental even with high within-group h².  
  - Useful quantities require different designs: **causal effects** (RCTs), **G×E interaction estimates** (genotype-stratified RCTs), or **counterfactual predictions** (structural models).  

  **Your gain heritability (h²(Δ)):**  
  Not nonsense! It validly measures *how much genetic variation explains differential response to the intervention* in that population/environment. Useful for predicting selection response (if breeding!) or gene-by-interaction studies. But it **does not** measure the intervention's efficacy or partition individual gains.  

  **Key confusion in the colleague's argument:**  
  Equating *variance decomposition* with *causal attribution of means*. Heritability analyses are descriptive (about variation), not causal (about means). This is the core "heritability ≠ immutability" point.  

  **Seminar recommendation:**  
  Contrast two questions:  
  1. *"Why did individuals respond differently?"* → h²(Δ) *might* partially explain (if Cov(G,E)=0, etc.).  
  2. *"Why did the mean change?"* → Only the intervention's causal effect matters; h²(Δ) is irrelevant.  

  **Final confidence breakdown:**  
  - (1) Correct: 100%  
  - (2) Fallacious: 98%  
  - (3)-(5) Invalid due to (2): 95%  
  - (6) Sound critique: 100%  
  - Gain h² defensible: 90% (when correctly interpreted)  
  - "Genetic share of gap" indefensible: 100%  

  Stick to your guns—this is a classic case of misinterpreting variance partitioning as causal explanation. Your colleague's argument is invalid, not just premise-disagreement.
