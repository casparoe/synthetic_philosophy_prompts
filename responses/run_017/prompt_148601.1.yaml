answer: |-
  Here is the translation you requested, followed by residue analysis and committed recommendations. I've prepared by mapping concepts against your operational vocabulary, scrubbing philosophical baggage that doesn't survive contact with accession records.

  **Scratch Section: Conceptual Mapping & Rejected Translations**  
  *(Crossed-out items import foreign assumptions)*  

  | Philosophical Concept          | Proposed Museum Translation                     | Rejected Mappings (with reason for exclusion)                                                                 |
  |-------------------------------|------------------------------------------------|--------------------------------------------------------------------------------------------------------------|
  | **Lockean Labour-Desert**     | Documentation of creative effort in provenance | ~~"Moral entitlement"~~ (implies inherent right vs. documented contribution); ~~"Just acquisition"~~ (presumes initial justness) |
  | **Lockean Proviso**           | Assessment of cultural abundance               | ~~"Resource scarcity"~~ (material scarcity ≠ pattern non-rivalry); ~~"Fair access threshold"~~ (quantifies the unquantifiable) |
  | **Personhood**                | Inalienable attribution grade                  | ~~"Inseparable selfhood"~~ (metaphysical); ~~"Moral rights as property"~~ (conflates EU droit moral with custody) |
  | **Instrumentalist Bargain**   | Statutory custodial interval                   | ~~"Public domain as default"~~ (ignores cultural stewardship); ~~"Incentive ledger"~~ (reduces to economics) |
  | **Sceptical Non-Rivalry**     | Reproduction without diminution               | ~~"Anti-ownership axiom"~~ (dogmatic); ~~"Infinite replicability"~~ (denies unique artifact status)        |

  ---

  **Translation: Four Theories in Registrar Vocabulary**  

  1. **Lockean Labour-Desert (w/ Proviso)**  
     - *Ownership of sheets:* Belongs to **documented hands in chain of title** (autograph sheets = strongest claim). Gaps weaken title but don't void labor investment.  
     - *Ownership of pattern:* Only paper is ownable. Patterns exist in "cultural commons" if proviso met: **local weavers confirm abundance** of equivalent motifs.  
     - *1961 book action:* **Reproduction without provenance** – violates attribution ethics but not proviso (left "enough and as good" patterns).  
     - *18-month action:* Publish only motifs **verified as post-1948** (labor-desert applies). Withhold pre-workshop motifs (proviso satisfied – already abundant).  

  2. **Personhood Account**  
     - *Ownership of sheets:* Physical custody ≠ ownership. Attribution grade (**"workshop of Halvorsen"**) reflects **inalienable connection** to creators.  
     - *Ownership of pattern:* Patterns as **extensions of personhood** – rights persist beyond material. Granddaughter's claim signals **ongoing personhood interest**.  
     - *1961 book action:* **Severance of personhood** – anonymization as ethical harm.  
     - *18-month action:* **Withhold all scans**. Custodianship obligates protecting personhood ties. Open license violates inalienability.  

  3. **Instrumentalist Account**  
     - *Ownership of sheets:* **Custodial holding only**. "Ownership" is statutory fiction to incentivize production (expired here).  
     - *Ownership of pattern:* **Never ownable** – protection was temporary bargain for publication (achieved in 1961 book).  
     - *1961 book action:* **Fulfilled statutory purpose** – no further protection owed.  
     - *18-month action:* **Publish all under open license**. Custody now serves public access, per grant terms.  

  4. **Sceptical Account**  
     - *Ownership of sheets:* **Paper is ownable, not marks**. Chain of title irrelevant to patterns.  
     - *Ownership of pattern:* **Impossible** – one weaver's use doesn't **diminish** another's. Marginalia? Collaborative, not proprietary.  
     - *1961 book action: **Legitimate pattern circulation** – no diminution occurred.  
     - *18-month action:* **Publish all**. Gaps in provenance? **Stable non-ownership status** – no one was ever entitled.  

  ---

  **Residue Report**  

  **I. Philosophical Gaps in Museum Vocabulary**  
  - *Instrumentalist "future production" focus*: No counterpart. **Defect in philosophy** – ignores custodial permanence for dormant collections.  
  - *Lockean proviso's "enough and as good"*: No operational equivalent. **Philosophical blur** – unmeasurable against provenance gaps.  
  - *Sceptical non-rivalry*: Captured partially in "reproduction without diminution" but **overreaches** – denies artifact uniqueness (a registrar's core concern).  

  **II. Museum Concepts Missing in All Four Theories**  
  - **Inalienable holdings**: Not just personhood – custody persists *despite* statutory expiry (e.g., sacred items). *Residue signals philosophy's failure: ownership ≠ custody duration*.  
  - **Custodianship without ownership**: All theories reduce custody to derivative status. *Noise? No – reveals ontology gap: stewardship exists prior to property categories*.  
  - **Stable provenance gaps**: Philosophers see epistemic failure; we see **mature accession status** (e.g., "artist unknown, c.1950s"). *Points to ownership's archival nature: gaps are descriptive, not normative*.  
  - **Non-pecuniary/non-control return claims**: Weavers' association seeks **continuity of practice**, not control. *Critical miss: ownership theories ignore use as relational, not transactional*.  

  ---

  **Committed Recommendations**  
  *(Confidence levels [CL] 1-5, 5=highest; † marks uncertain dependencies)*  

  | Account             | Ranking | CL | Rationale                                                                 |
  |--------------------|--------|----|--------------------------------------------------------------------------|
  | **Personhood**      | 1      | 4  | Only theory handling granddaughter's claim & graded attribution. Aligns with museum ethics. |
  | **Lockean**         | 2      | 3  | Proviso useful for pre-workshop motifs†. Weak on 1961 book moral harm.   |
  | **Sceptical**       | 3      | 2  | Correct that patterns aren't ownable – but erases artifact significance. |
  | **Instrumentalist** | 4      | 1  | Grants-focused but violates custodial duty. Ignores non-statutory claims. |

  **Action Plan (CL 4):**  
  - **Publish**: Post-1948 sheets with attribution grade **"Workshop of Halvorsen (hand A/B/C)"** + 1961 book pages (statutory bargain fulfilled†).  
  - **Withhold**: Pre-workshop motifs + sheets with granddaughter's direct lineage annotations (personhood residue).  
  - **Grant Compliance**: Release curated set under CC-BY-NC – satisfies "open" while honoring non-commercial weavers' claim.  

  **Where Theories Don't Truly Disagree:**  
  Lockean proviso and sceptical non-rivalry both **deny propertization of old motifs** – they debate "why" (abundance vs. ontology), not the outcome.  

  **Weak Joints to Check with Counsel:**  
  - †**Pre-1948 motif cutoff**: Depends on local copyright terms for unpublished works [Consult Copyright Act §XXX].  
  - †**1961 book as statutory fulfillment**: Verify if 1961 publication complied with formalities then in effect.  
  - **Weavers' association claim**: Document oral history proving **continuous practice** – strengthens non-ownership return rationale.  

  **Final Confidence in Recommendation: 4/5**  
  Your vocabulary’s residue – particularly *custodianship beyond ownership* and *stable gaps* – exposes philosophy’s core flaw: it presumes property is a settled *precondition* rather than an evolving *description* of human relations with artifacts. The Halvorsen material demands we honor what lies between "owned" and "orphaned": **provenance as a verb**.
