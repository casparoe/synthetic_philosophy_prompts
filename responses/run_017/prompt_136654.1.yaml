prompt: |-
  I write speeches, and I keep running into a pattern in the way the phrase "Western values" is used in op-eds, commission speeches and parliamentary debate. I would like to know whether the pattern has been described and named, because I need to talk about it precisely and I don't have the vocabulary.

  What I have noticed is this. The phrase is unfailingly honorific: nobody uses it in a neutral register, and I have never once seen anyone argue that we should have less of it. But which things it covers seems to track not history but rhetorical direction. When a speaker wants to claim a practice for the tradition — constitutional government, toleration, the abolition of slavery, freedom of inquiry, secularism, or the welfare state, depending on who is speaking — the practice is described as an expression or a flowering of Western values. When a speaker wants to distance the tradition from a practice — the crusades, the Inquisition, colonial extraction, racial science, the slave trade itself, massacres carried out under European flags — the very same practice is described as a betrayal of, or deviation from, Western values. Four features of this strike me as worth pulling apart.

  First, the classification is predictable in advance from the rhetorical direction alone, before you know anything about the practice: credit goes in, blame goes out. The extension of the phrase looks like a function of its valence.

  Second, the two uses do not play the same role in the argument. In the credit direction the phrase is used causally or explanatorily — it says something about why the thing happened here. In the blame direction it is used only as a standard of criticism. I have never seen anyone write that colonial extraction happened *because of* Western values, only that it betrayed them. So the phrase appears to switch between being an explanation and being a yardstick while keeping one and the same honorific glow.

  Third, the move seems to be reserved for "our" terms. Writers who treat atrocities as betrayals of Western values are often perfectly willing to treat comparable atrocities elsewhere as *expressions* of some other civilisation's values rather than as betrayals of them.

  Fourth, the pattern is diachronic. Individual practices migrate from one column to the other over decades — established religion, empire, eugenics are the clearest cases — and the phrase survives every migration undamaged, which makes me suspect it has no takedown condition: nothing anyone could point to would count as the tradition's having failed to have the values attributed to it.

  I am not after a label. I would like the following.

  1. Does this pattern have an established name, and if so what is the literature? A friend who took one philosophy course suggested "persuasive definition," but as I understand that idea it concerns a single speaker quietly stipulating a new descriptive content for an emotionally loaded word in order to win an argument, whereas what I am seeing is spread across a whole speech community, is never stipulated explicitly, and is used by the same speakers in both directions with no apparent sense of inconsistency. "No true Scotsman" does not seem right either: nobody here is defending a universal generalisation against a counterexample, nothing is being rebutted, the classification simply slides. "Weasel word" seems too weak, since the problem is not vagueness but directional movement.

  2. For each candidate that is genuinely close, state exactly where the fit breaks; then tell me which candidate does most of the work and what is left over that none of them capture.

  3. If nothing established covers it, name it and define it: give the necessary conditions, and then the boundary cases. In particular, tell me whether the phenomenon is distinctive to civilisational or heritage terms — Western values, our values, Asian values, Islamic values, Judeo-Christian values — or whether it is simply the ordinary life of any honorific abstract noun: democracy, science, professionalism, friendship, the rule of law. If my example turns out to be an unremarkable instance of something very general, say so plainly.

  4. Give me a diagnostic. If I wanted to work through a corpus of speeches and decide case by case whether a given use of the phrase is an instance of the pattern or a genuine descriptive claim about a tradition, what should I look for — and what would a non-instance look like? Is there any formulation of "Western values" that would commit a speaker to something she could be shown to be wrong about?

  5. Finally, is the pattern a defect? Is the phrase doing work that a less elastic term could not do, or is a community's normative self-description *supposed* to have this structure, on pain of losing the ability to criticise itself at all?
reasoning: |-
  Okay, the user writes speeches and has noticed a specific pattern in how "Western values" is used. They want to know if this pattern has a name, literature, and how to discuss it precisely. Let me break down their query.

  First, they describe the pattern: "Western values" is always honorific. When something positive is associated, it's credited as an expression of Western values. Negative aspects are seen as betrayals. The user lists four key features: predictability based on rhetorical direction, dual role (explanation vs. yardstick), exclusivity to "our" terms, and diachronic migration of practices between categories without affecting the term's integrity.

  They need several things: an established name and literature, comparison to close concepts, naming/defining if none exist, a diagnostic for identifying the pattern, and whether it's a defect.

  I recall concepts like persuasive definition, but that's about redefining terms, not this sliding usage. No True Scotsman involves defending generalizations against counterexamples, which isn't quite it here. Motte-and-bailey might be closer because of shifting between defensible and controversial ideas, but it's not a perfect fit since "Western values" shifts explanations and yardsticks without retracting claims.

  The Essence Contortion seems fitting. It captures how the essence of Western values is flexibly redefined to include positives and exclude negatives. The diagnostic would look for valence-dependent classification and the absence of falsifiability. For example, if slavery abolition is credited to Western values but the slave trade isn't blamed on them, that's a sign.

  Is this pattern a defect? It allows self-criticism but risks historical selectivity. The elasticity helps maintain a positive identity but avoids accountability for past wrongs. The user might be concerned about intellectual honesty in speeches. They need precise vocabulary to critique this without dismissing the concept entirely.

  The user's deeper need might be to articulate this flaw in speeches effectively, calling out the inconsistency without alienating audiences. They might also want to preserve the ability to reference shared values while avoiding historical whitewashing. Highlighting the Essence Contortion gives them a framework to address both the rhetorical pattern and its implications.
answer: |-
  This pattern is astutely observed and represents a sophisticated manipulation of cultural identity. While no single established term captures all its nuances perfectly, the closest conceptual framework is **"Essence Contortion"** applied to civilizational identity terms. Here's a breakdown addressing your points:

  1.  **Established Names & Literature:**
      *   **Persuasive Definition (Charles Stevenson):** Fits the *evaluative loading* and strategic use, but as you note, it typically involves explicit redefinition by a single actor. Your pattern is a communal, implicit, dynamic *application* of a term whose core meaning remains nebulous. The literature (Stevenson's *Ethics and Language*) focuses on definitional disputes, not this diachronic, collective sliding.
      *   **No True Scotsman (Informal Fallacy):** Captures the *exclusion of negatives* as "not truly X," but misses the *inclusion of positives* as "truly X," the *explanatory* role for positives, and the *diachronic shift*. It's reactive against counterexamples, while your pattern is often proactively deployed.
      *   **Motte-and-Bailey Doctrine (Nicholas Shackel):** This is the strongest contender. The "motte" is a defensible, uncontroversial core meaning (e.g., "basic human rights, rule of law"). The "bailey" is a more controversial, desirable claim (e.g., "liberal democracy is the *unique* product of Western values"). When challenged on the bailey (e.g., colonialism), the defender retreats to the motte ("colonialism betrayed *true* Western values"). **Where it breaks:** Your pattern involves more than retreat; it actively *claims* diverse positives as *expressions* (building the bailey), and the "motte" itself is vague and contorts. The *explanatory* role for positives and *exclusive* application to "our" terms aren't central to M&B.
      *   **Teleology / Whig History:** Captures the selective, progressive narrative where history culminates in current ideals, portraying past negatives as deviations. Literature includes Herbert Butterfield's *The Whig Interpretation of History*. **Where it breaks:** Focuses on historical narrative construction, not the specific *rhetorical mechanics and elasticity* of a term like "Western values" in contemporary argumentation.
      *   **Civilizational Essentialism:** The underlying belief that civilizations possess fixed, defining "essences." Criticism of this is widespread (e.g., Edward Said's *Orientalism* critiques Western constructs of the "Orient," implying a contrasting essentialist West). **Where it breaks:** Doesn't capture the *rhetorical directionality* and *functional switching* (explanation vs. yardstick) you describe.
      *   **Conclusion:** **Motte-and-Bailey** does the most work, explaining the defensive retreat aspect. **Civilizational Essentialism** provides the foundational belief enabling the maneuver. **Teleology** explains the historical selectivity. However, none fully capture the *predictable valence-driven classification*, the *switching functional role*, and the *exclusivity to "our" group*.

  2.  **Naming and Defining the Pattern: Essence Contortion**
      *   **Necessary Conditions:**
          1.  **Honorific Abstraction:** A positively-valenced, abstract noun phrase referring to a collective identity or heritage ("Western values," "our Judeo-Christian heritage," "Asian values").
          2.  **Valence-Dependent Classification:** The inclusion or exclusion of specific historical or contemporary practices under the term is predictably determined by the *evaluative stance* (positive/negative) the speaker takes towards *that practice*, not by consistent historical or definitional criteria.
          3.  **Functional Switching:** For positively classified practices, the term functions *explanatorily* (suggesting a causal or inherent link). For negatively classified practices, the term functions *prescriptively* (as an aspirational standard or ideal that was betrayed).
          4.  **Group Exclusivity:** The pattern is primarily applied to terms designating the speaker's *own* perceived cultural/civilizational group ("us"). Practices associated with "them" are typically explained *through* their (often negatively construed) essential values, not as betrayals of them.
          5.  **Diachronic Plasticity:** The classification of specific practices can shift over time without fundamentally damaging the perceived integrity or honorific status of the abstract term itself. The "essence" contorts to accommodate changing norms.
      *   **Boundary Cases:**
          *   *Democracy/Science/Rule of Law:* These *can* exhibit similar patterns ("That wasn't *real* democracy/science!"), but they are less inherently tied to a *specific civilizational identity* and more often contested *within* a civilization. Essence Contortion thrives on the "us vs. them" dynamic of civilizational labels.
          *   *Friendship/Professionalism:* While evaluative, they lack the collective historical scope, the strong causal/explanatory pretense for group actions, and the explicit "us/them" dimension. Their elasticity is more personal or functional than civilizational.
          *   *"Islamic Values" used by Islamists:* This *can* exhibit Essence Contortion *within* that discourse (e.g., terrorism as betrayal, charity as expression), mirroring the "Western values" pattern but from an internal perspective. It demonstrates the pattern *is* applicable to other civilizational/heritage terms when used honorifically by insiders.
      *   **Conclusion:** Essence Contortion is **distinctive to civilizational or heritage terms** precisely because these terms carry the weight of collective identity, historical narrative, and inherent moral standing for the in-group. The elasticity serves to protect the group's perceived moral core and historical legitimacy.

  3.  **Diagnostic for Identifying Essence Contortion:**
      *   **Look For:**
          1.  **Valence First:** Does the speaker's classification of the practice (inclusion as expression vs. exclusion as betrayal) seem predetermined by whether they are praising or condemning the practice *itself*? Is the link to "Western values" asserted *after* the evaluative stance is clear?
          2.  **Functional Switch:** Is the phrase used to *explain why* a good thing happened ("This flourished *because* of Western values") but *only to condemn* why a bad thing happened ("This happened *despite* Western values, betraying them")? Is it *never* used to causally explain negative outcomes?
          3.  **Asymmetrical Treatment:** When discussing similar practices by *other* civilizations, does the speaker attribute negative outcomes *to* that civilization's essential values, rather than framing them as betrayals? (e.g., "The caste system *reflects* traditional Hindu values" vs. "The Inquisition *betrayed* Western values").
          4.  **Lack of Falsifiability:** Is there *any* historical practice that the speaker would acknowledge *both* occurred within the West *and* was fundamentally *caused* or *demanded* by "Western values" itself, which they *also* condemn? If every condemned practice is framed as a "betrayal," the concept is immune to disconfirmation.
          5.  **Nebulous Core:** Does the speaker avoid defining "Western values" with concrete, stable historical referents that could be used to test claims? Is the definition implied solely by the examples chosen in the moment?
      *   **What a Non-Instance Looks Like (Genuine Descriptive Claim):**
          *   A historian arguing that Enlightenment rationalism (a positive) *and* colonial ideologies of racial hierarchy (a negative) were *both* significant, interconnected strands emerging from specific historical developments *within* Western intellectual and political traditions, using "Western values" descriptively to encompass this complex, often contradictory heritage. They might say colonial extraction was *enabled by* or *justified through* contemporaneous interpretations of Western values (like property rights or civilizing mission), not just a betrayal of some pure ideal.
          *   A critic arguing that "Western values," as historically manifested (e.g., through imperialism or capitalist exploitation), are fundamentally flawed and causally linked to negative outcomes, rejecting the honorific framing.
          *   A neutral analysis listing specific philosophical, legal, and religious traditions commonly associated with "the West," without making strong claims about their inherent goodness or using them primarily to explain or judge specific events.
      *   **Commitment and Falsifiability:** A formulation committing the speaker would need to: a) Define core, stable components of "Western values" *independent* of any specific historical event being evaluated (e.g., "individualism, secular reason, natural rights, Christian charity"). b) Explicitly state that certain historical outcomes *must* follow from or be precluded by these values. c) Acknowledge that if a practice widely accepted *as* expressing these values at the time (e.g., chattel slavery justified by Enlightenment race theories) is later condemned, it requires re-evaluating either the definition of the values *or* the causal link. Essence Contortion avoids this by keeping the definition fluid and the causal link only applying selectively.

  4.  **Is it a Defect?**
      *   **Yes, it is a significant rhetorical and intellectual defect:**
          *   **Historical Distortion:** It sanitizes history, obscuring the complex, often problematic roots of even "positive" developments and evading responsibility for systemic harms perpetrated *in the name* of those same values.
          *   **Lack of Accountability:** By defining negative outcomes as "betrayals," it prevents critical examination of how the tradition's *actual* historical manifestations, power structures, or internal contradictions contributed to those outcomes.
          *   **Intellectual Dishonesty:** The functional switching and valence-dependent classification are fundamentally inconsistent and evade logical scrutiny. It's special pleading for the in-group.
          *   **Hinders Self-Understanding:** A community cannot genuinely understand itself or learn from its past if its core identity concept is rendered unfalsifiable and divorced from historical reality.
          *   **Impedes Dialogue:** The asymmetry in treating "our" sins as betrayals vs. "their" sins as expressions fuels cultural chauvinism and hinders cross-cultural understanding and accountability.
      *   **The Counter-Argument (Why it Persists):**
          *   **Normative Function:** Proponents might argue that "Western values" functions primarily as an *aspirational ideal* or *critical standard*, not a historical description. Its elasticity allows the tradition to critique itself and evolve, holding past actions to current ideals. A rigid, historically anchored definition might fossilize the concept or make self-criticism impossible by tying values inextricably to past sins.
          *   **Identity Cohesion:** The contortion provides a stable, positive core identity amidst complex and often troubling history, fostering social cohesion and a sense of shared purpose.
      *   **Assessment:** While normative self-description needs *some* aspirational element, Essence Contortion goes too far. **A healthy tradition can criticize itself *without* resorting to historical amnesia or logical inconsistency.** It can acknowledge that:
          *   Its highest ideals often emerged dialectically *in opposition* to its own historical practices.
          *   Positive developments often had complex, sometimes morally ambiguous, origins within the tradition.
          *   Horrific acts were frequently justified *using* the tradition's own language and concepts at the time.
          Facing this complexity is essential for genuine moral maturity. Essence Contortion sacrifices intellectual honesty and historical reckoning for the comfort of an unblemished, static identity. Less elastic terms ("Enlightenment principles," "liberal democratic norms," "Christian ethics") used with historical specificity can still provide critical standards without resorting to this level of contortion.

  **In summary:** You've identified **Essence Contortion** – the valence-dependent, functionally switching, group-exclusive, diachronically plastic application of an honorific civilizational abstraction like "Western values" to claim credit for positives and deflect blame for negatives. While related to Motte-and-Bailey and Civilizational Essentialism, it captures the unique dynamics you describe. It is a pervasive and problematic rhetorical pattern that distorts history and hinders genuine self-criticism, despite claims about its normative utility. Use the diagnostic questions to identify it in your corpus.
