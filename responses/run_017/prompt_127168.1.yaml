               - Some students moved a lot, some a little. 
               - The scoring rule: we used S(q) = 1 - (1-q)^2 because the event was true. 
                   - If you were very sure (q=1) and right, you get 1.
                   - If you were sure (q=1) and wrong, you get 0.
                   - If you are uncertain, you might get an intermediate score.
                   - Example: 
                       q=0.6 -> S = 1 - (0.4)^2 = 1-0.16=0.84
                       q=0.7 -> S = 1 - (0.3)^2 = 1-0.09=0.91
                   - So being more confident is rewarded if you are right, but punished if you are wrong. 
                   - In our case, the event was true, so higher q got higher score. 

            3. The self-application of the update rule:
               - We applied the same update rule to the rule itself. 
               - For example, if your update fraction is k0, and you see that the group mean of k's is m, then you update to: 
                     k1 = k0 + k0*(m - k0)
               - Then you do it again to get k2. 
               - What happens? 
                   - If the group mean m is different from your k0, you move toward m by a fraction k0 of the difference. 
                   - If your k0 is high, you move a lot. If it is low, you move little. 
                   - After several iterations, we might see convergence to a fixed point? 
               - In the conciliationism vs. steadfastness debate: 
                   - A conciliationist (high k) will move a lot toward the group, but then the group might be moving too. 
                   - A steadfast (low k) will not move much. 
                   - When applied to itself, conciliationism might lead to convergence to the group mean, while steadfastness might not. 
                   - But the group mean might be pulled toward the conciliationists. 

          What can go wrong:

            1. Students might not understand the update rule for k. We can provide a formula: 
                  new k = your current k + (your current k) * (group mean of k - your current k)
               = (1 - k) * your current k + k * group mean

