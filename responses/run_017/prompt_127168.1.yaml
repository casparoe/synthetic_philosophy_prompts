          Debrief points:

            1. The hidden variable: evidential overlap. 
               - In Group A, the initial estimates were based on independent evidence, so when they saw disagreement, it was new information. 
               - In Group B, the initial estimates were based on the same evidence, so the unanimity was not new information. 
               - We see that the Group B students should not have moved much, because the group agreement was just an echo of their own evidence. 
