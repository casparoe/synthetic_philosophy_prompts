  ### Bottom Line
  The mechanism that makes the problem land is students revising their estimates under a scoring rule that penalizes inaccuracy and over/under-confidence, while unknowingly operating in one of two evidentially distinct groups (independent vs. shared evidence), forcing them to confront the hidden role of evidential overlap when symmetry and peer disagreement arise.

  ---

  ### Session Design  
  **Materials**:  
  - 1 urn (or box) with 60 blue tokens and 40 red tokens (hidden).  
  - 14 index cards (pre-prepared with initial estimates/confidences).  
  - Projector/board to post anonymized estimates.  
  - Scoring formula displayed: **Score = 1 - (1 - your probability estimate)²** (since "more blue than red" is true).  

  **Setup**:  
  - Partition 14 students into **Group A** (7 students, independent evidence) and **Group B** (7 students, shared evidence). Assign randomly.  
  - Prepare index cards:  
    - *Group A*: Cards with varied initial estimates (q0) but same confidence (c0=0.8):  
      `[0.55, 0.58, 0.60, 0.62, 0.65, 0.67, 0.70]` (each to one student).  
    - *Group B*: All cards identical: `q0=0.65, c0=0.8`.  
  - **Key hidden variable**: Group A’s estimates are based on simulated independent evidence; Group B’s on identical evidence (unrevealed until end).  

  **Scoring Example**:  
  - True event: Proportion of blue > 0.5 (true, as 60% blue).  
  - If a student’s estimate (q) = 0.7:  
    `Score = 1 - (1 - 0.7)² = 1 - (0.3)² = 1 - 0.09 = 0.91`.  
  - If q = 0.5: `Score = 1 - (0.5)² = 0.75`.  

  ---

  ### Timeline (80 Minutes)  
  **0–5 min: Intro and Setup**  
  - *Instructor script*:  
    > "An urn has blue/red tokens; you’ll estimate if blue > 50%. Each card shows your initial probability (0–1) of that being true, and your confidence (0–1) in that estimate. Write these down privately. Scores depend only on your probability estimate: higher if confident and right, lower if wrong or underconfident. Formula: **Score = 1 - (1 - your estimate)²**."  

  **5–10 min: Initial Estimates (q0)**  
  - Students record q0 and c0 from cards.  
  - Collect q0 values (not c0) anonymously; project as a sorted list.  

  **10–25 min: First Revision (q1)**  
  - *Instructor script*:  
    > "See the group’s initial estimates. Revise your probability (q1) and confidence (c1) silently. No discussion yet."  
  - Students revise independently.  
  - Collect and project q1 values.  

  **25–40 min: Discussion and Second Revision (q2)**  
  - Students form small groups (3–4), share reasoning (not samples), and discuss.  
  - After 10 min, students revise to q2 and c2.  
  - Collect and project q2 values.  

  **40–50 min: Reveal Truth, Scores, and Groups**  
  - Reveal urn composition (60% blue → event true).  
  - Compute scores for q0, q1, q2 using scoring formula.  
  - Reveal groups:  
    > "Group A: Initial estimates based on independent evidence. Group B: All had identical evidence."  
  - Show average scores per group.  

  **50–60 min: Rule Writing and Self-Application**  
  1. **Write personal update rule**:  
     > "When a peer disagrees, I move ___% toward their view. (E.g., 30% = 0.3)."  
     Students write fraction **k** (0–1) on cards.  
  2. Collect and project all **k** values anonymously.  
  3. **Self-apply rule**:  
     - Each computes new **k1 = k0 + k0 × (group mean k - k0)**.  
     - Collect and project **k1** values.  
     - Repeat for **k2 = k1 + k1 × (group mean k1 - k1)**.  

  **60–80 min: Debrief**  
  - **Map activities to philosophical issues**:  
    - *Evidential overlap*: "Group B saw unanimous estimates but shared evidence—should that move you as much as Group A’s independent disagreement? Why couldn’t you tell?"  
    - *Self-application*: "When you applied your ‘k’ rule to itself, did it converge (high k), oscillate (mid k), or stay fixed (low k)? Steadfast views (low k) resist group pressure; conciliationist views (high k) risk infinite regress when applied to themselves."  
    - *Accuracy vs. hedging*: "High confidence paid if right (q close to 1 → high score) but hurt if wrong. Underconfidence (q near 0.5) avoided risk but capped gains."  
  - **Acknowledge limitations**:  
    - *What the game misses*: Real peerhood involves assessing reasoning/evidence quality, not just symmetry.  
    - *What you must argue*: Why conciliationism feels compelling despite self-application worries (e.g., higher-order uncertainty).  
  - **Predictable issues**:  
    - *Refusal to give k*: Assign k=0.5 default.  
    - "Puzzle about urn" focus: Redirect: "Why did/didn’t you revise? How did peers affect you?"  
    - *Bland hedging*: Point out score trade-offs (e.g., q=0.6 scored 0.84 vs. q=0.8 scored 0.96 if right).  
  - **Honest reflection**:  
    > "Half of you (Group B) were misled—unanimity masked shared evidence. In real disagreements, you rarely know if peers’ evidence is new or recycled. That’s the core tension: symmetry feels compelling, but evidential weight is invisible."  

  ---

  ### Why This Works  
  - **Evidential overlap invisibility**: Identical initial estimates hide Group A/B differences until reveal, forcing students to revise blindly and confront the "weight" problem.  
  - **Self-application via k-rule**: Iterating k exposes conciliationism’s potential for self-undermining and steadfastness’ rigidity.  
  - **Scoring rule**: Penalizes overconfidence (e.g., q=1 if wrong → score=0) and underconfidence (q=0.5 → score=0.75), making hedging costly.  

  This design meets all constraints—no literature, cheap materials, and visceral lessons in 80 minutes.
