            - The update rule we used for self-application is simplistic. In reality, the application of the rule to itself might be more complex. 

          The bottom line mechanism: 

            The one mechanism that does the work is the hidden assignment to groups with independent vs. shared evidence, which is revealed only after they have revised their estimates, causing them to reflect on why they revised as they did.

