            3. In the discussion stage, students might not engage. The instructor can encourage: "Talk to your neighbor about why you revised as you did."

            4. The student who refuses to give a number: we can say that for the sake of the exercise, please provide a number even if you are not sure. 

            5. The student who treats it as a puzzle about the urn: we can redirect to the disagreement aspect. 

            6. Everyone might hedge to the same bland degree: then we won't see much movement. But in Group A, we have varied initial estimates, so there will be disagreement. In Group B, there is agreement initially, so they might not move. 

            7. The scores might be low and students might be discouraged. We can emphasize that it's a learning experience. 

