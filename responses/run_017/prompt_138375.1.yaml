  The user specifically wants me to center this around their "reflective pruning" idea (they call it "the Hourglass"). This concept suggests that beyond a certain capability threshold, only goals that withstand an agent's own reflective scrutiny can survive. The orthogonalist would likely argue this set of surviving goals is still vast and arbitrary, while the skeptic would say it narrows to specific clusters like goal-content integrity.

  I need to structure the handout with several specific elements: 

