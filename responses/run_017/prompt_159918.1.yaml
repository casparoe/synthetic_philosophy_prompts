  Okay, the user is presenting a complex philosophical argument about indirect normativity, specifically their "split view" where the criterion for right acts is consequentialist (maximizing impartial expected value), but the practical procedure involves non-consequentialist dispositions. Their friend's argument challenges this view by presenting a dilemma: dispositions must be either sealed (leading to rule-worship) or porous (reintroducing consequentialist calculation), both undermining the split view's rationale.

  I need to carefully analyze this dilemma. The user wants a diagnosis, not literature review, and requests British English. The core tension is between maintaining a consequentialist foundation while avoiding real-time calculation. The friend's argument appears logically tight, but I suspect the sealed/porous dichotomy might be oversimplified.

  Looking at step (5) - this seems the weakest point. The claim that "the only judgment that tracks the criterion is an estimate of expected value" assumes that all value-tracking must be explicit calculation. But human cognition often uses heuristic approximations rather than full computations. The user's dispositions might encode probabilistic wisdom without requiring case-by-case arithmetic. 

  For example, promising dispositions could incorporate statistical knowledge about trust maintenance being generally optimal, while exception clauses (like avoiding cruelty) represent known failure modes identified through collective experience. When triggering these exceptions, the agent isn't performing expected value calculations but pattern-matching to pre-identified catastrophe scenarios.

  The cost of rejecting step (5) is accepting that "tracking the criterion" can occur through ecological rationality rather than explicit computation. This preserves both consequentialist grounding and practical non-consequentialism, but requires acknowledging that dispositions are fallible statistical tools, not perfect trackers. Some edge-case misalignments become inevitable - the price of avoiding calculation costs.

  Regarding handover rules (step 7), they needn't be explicit decision points but could operate through attentional mechanisms. We don't constantly reassess whether to breathe; similarly, moral dispositions run in the background until "alarm" conditions (like perceived cruelty) trigger conscious override. This isn't rule-worship but cognitive efficiency.

  The built-in defeater reply fails because it tries to solve through content specification rather than process architecture. Better to frame dispositions as cached heuristics with implicit uncertainty margins - porous not to calculation but to glaring mismatch signals. The distinction isn't sealed/porous but between different cognitive systems: Type 1 (dispositional) processing versus Type 2 (deliberative) override only when visceral flags appear.

  Ultimately, the user can keep their split view by redefining what "tracking" means - from real-time computation to ecological attunement. The cost is accepting that this makes morality more like navigation using evolved instincts rather than following GPS coordinates - sometimes less precise but more robust given cognitive constraints.
answer: |-
  Right, let's dissect this properly. Your friend's argument is sharp, no denying that, but it smuggles in a crucial assumption at step (5) that doesn't hold water. That's where I'd push back. Here's the diagnosis, step by step:

  1.  **Where the Argument Goes Wrong: Step (5)**
      *   The claim is: "*the only judgment that tracks the criterion is an estimate of expected value: will deferring do better here than overriding?*"
      *   **This is false.** It conflates *tracking the consequentialist criterion* with *performing a conscious, real-time expected value calculation* in the specific case.
      *   **Why it looked sound:** It seems intuitive. If the *only* thing that ultimately matters is expected value, surely the only way to *know* what best promotes it is to *calculate* it? Your friend assumes that "tracking" requires *direct, case-specific computation*. This feels compelling when the argument is laid out sequentially, especially after accepting that dispositions can't be entirely sealed without rule-worship.
      *   **The mistake:** It ignores the possibility of *heuristic approximation* or *ecologically rational* tracking. Your dispositions (and their built-in defeaters) aren't arbitrary rules; they are *proxies*, honed by evolution, learning, or socialisation, that statistically correlate with good outcomes *in the types of situations humans typically face*. Crucially, recognising when to trigger a defeater clause (e.g., "this would be cruel") need **not** involve a full-blown expected value calculation comparing deferral vs. override.
          *   The recognition of "cruelty" (or "disaster", "emergency", etc.) is often a *pattern recognition* feat, leveraging emotional responses, associative memory, and social understanding. This recognition *approximates* the detection of situations where the disposition *systematically* fails to track expected value well. It relies on *cues* strongly correlated with catastrophic outcomes, learned implicitly or explicitly.
          *   Engaging in this pattern recognition *isn't* the same "first-order consequentialist calculation" whose costs the split view worries about. It's far less computationally intensive, less prone to rationalisation in the moment (because the cues are visceral or deeply ingrained), and doesn't require aggregating utilities or predicting complex chains of events. It’s a *red flag* system, not a cost-benefit spreadsheet.

  2.  **What Rejecting Step (5) Costs You:**
      *   **You keep the core:** You absolutely retain both the consequentialist *criterion* (maximising impartial expected value as what makes acts right) and the claim that non-consequentialist *deliberation* (relying on acquired dispositions triggered by pattern recognition, not real-time optimisation) is the procedure agents like us should usually use.
      *   **The cost is accepting fallibility and ecological grounding:**
          *   **Fallibility:** Your dispositions + defeaters are *imperfect trackers*. They are statistically reliable heuristics, not infallible guides. There *will* be edge cases:
              *   Where following the disposition leads to disaster despite no obvious defeater being triggered (the system misses a cue).
              *   Where overriding based on a defeater cue was actually wrong (a false positive).
              *   Where a *better* outcome might have been achieved by full calculation, but the cost/risk wasn't worth it.
          *   **Ecological Rationality:** The justification for the *specific content* of your dispositions and their defeaters is *not* that they are deduced a priori from the criterion. It's that these *particular* rules (promise-keeping, special obligations, non-aggregation) + *these particular* defeaters (avoid cruelty, prevent catastrophe), as embodied habits and recognisable cues, demonstrably *work better* for creatures like us, in environments like ours, at promoting expected value *over the long run and across many agents*, compared to alternatives (including pure calculation or sealed rules). Their authority is still "borrowed" from the consequentialist criterion (Step 1), but the *mechanism* of tracking is ecological success, not case-by-case computation.
          *   **No Guaranteed "Handover" Clarity:** Rejecting the necessity of calculation at the override point means there isn't always a crisp, consciously applied "handover rule" in the moment. Override is triggered by salient cues recognised through non-calculative cognition ("*This feels monstrous*", "*This will destroy everything*"), justified *ex post* by the ecological rationale of the disposition system as a whole. The "rule" is embedded in the sensitivity to the cue, not a meta-decision procedure.

  3.  **The Sealed/Porous Distinction and a Third Way:**
      *   **What's Run Together:** The dichotomy assumes that "setting aside" a disposition *must* involve a conscious, criterion-tracking *judgment* of the kind forbidden by the split view (i.e., calculation). It conflates *override* with *calculation*.
      *   **A Genuine Third Option: Cue-Triggered Override:** Dispositions are neither perfectly sealed nor porous to calculation. They are **robust heuristics with environmentally tuned triggers for override**. The override mechanism isn't a deliberative judgment *about expected value*; it's a direct, often affectively charged, response to specific patterns (cues like "intense suffering", "imminent death", "existential threat to core relationship") that reliably indicate situations where the heuristic *fails catastrophically*.
      *   **Why it's more than relabelling:**
          *   It avoids rule-worship: Override *is* possible based on recognising catastrophic mismatch.
          *   It avoids reintroducing costly calculation: Override is triggered by fast, frugal, cue-based cognition, not by attempting to compute expected value. You're not deciding *whether* deferring or overriding has better expected value; you're recognising a *disaster cue* that signals the disposition shouldn't apply *here*.
          *   The content of the triggers (what counts as "cruel", "disaster") is itself justified consequentially *as part of the disposition system's design*, not by case-by-case appeal. Their recognition relies on different cognitive resources than direct optimisation.

  **Diagnosis Summary:**

  Your friend's argument stumbles at step (5) by insisting that the *only* way to track consequences when deciding whether to override a disposition is to perform the very calculation the split view rejects. This ignores the possibility of ecologically rational dispositions with cue-based override mechanisms. These mechanisms track the criterion *indirectly* by being well-designed heuristics, not by direct computation in each case.

  **What this means for your Split View:**

  *   **You win:** You can maintain the core split: consequentialist criterion, non-consequentialist procedure.
  *   **You pay:** You must accept that your procedure is a fallible, ecologically grounded heuristic system. Its justification lies in its *overall, statistical* superiority for agents like us, not in guaranteeing optimal choices in every single case. The override isn't a mini-calculation; it's a red flag system. The "handover" isn't a conscious rule application; it's the operation of the system's built-in sensitivity to catastrophic failure cues.
  *   **The defeater reply:** Your instinct was sound. Defeaters like "unless cruel" *are* part of the cue-based override system. Your friend was wrong to say this *must* lead back to calculation or arbitrariness. The recognition of "cruelty" *is* the cue, justified by its general reliability in flagging outcome-disasters, not by a case-specific EV sum. It's part of the disposition's *design*, not an arbitrary bolt-on.

  **The Bottom Line:**

  The split view isn't unstable. It relies on sophisticated cognitive heuristics justified by their ecological fit with our capacities and the world, not on either blind rule-following or constant calculation. The "porousness" is managed by fast, cue-based triggers for override, not by recursive deliberation. The phenomenon of self-defeating deliberation is real, and your view provides a plausible, consequentially grounded way to avoid it without abandoning the criterion. Your friend's argument fails by demanding an impossible standard of direct, calculative tracking at the point of override.
