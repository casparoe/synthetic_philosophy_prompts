prompt: |-
  Something happened last week that I can't stop turning over, and I want help taking it apart properly. I'm the senior postdoc in a small biology lab and I run our shared Slack. A rotation student put a figure into a draft; I hadn't seen her raw files, and in the lab channel I wrote something close to: "I'd want to look at the raw files before any of that goes in the paper." She's filed a complaint saying that I called her a fabricator — that I said she made her data up. In the meeting I said, come on, don't put words in my mouth, I never said that. The person running the process replied with something like "that's not a defense, we go by how a reasonable reader in the lab would have taken it, not by what you had in your head," and said it as if that settled it.

  So I want a menu of the precise things "don't put words in my mouth" could actually be claiming, from the trivial to the strong, and for each one whether it's a platitude, a substantive and defensible thesis, or just false — and, most importantly for me, which of them would actually do the work I was trying to make it do. Part of what I'm unsure about is whether her "reasonable reader" line is even a rival theory of meaning or just a policy about who eats the cost of a misunderstanding dressed up as one. And I keep circling the Grice-style distinction between what a sentence says and what a speaker conveys without saying: is the distinction doing any real work here, or does it collapse as soon as you ask what "says" means for a one-line Slack message?

  Three wrinkles I'd like folded in, because they're where my case actually lives:

  1. Mixed audience. There was an external collaborator in that channel who had none of the backstory. If the complaint is about what the "reasonable reader" took it to mean — which reader? Does a meaning get to be audience-relative in a way that matters for blame?
  2. My own made-up category. I've been sorting what people convey into: what the sentence says on any way of disambiguating it; what a competent reader infers and I'd cheerfully confirm; and what a competent reader infers but which I set up so I could walk it back. I've been calling the third sort "deniable implicature," and I suspect the standard picture — where conveying something involves intending your hearer to recognise that you intend them to think it — doesn't even count those as cases of conveying, since the whole point is that I can deny the intention. Is the category real, and does it matter for how much blame I deserve?
  3. Endorsement by omission. Earlier in the same thread someone else flagged a weird outlier in her data, and I replied without saying "no, that's fine." How much of what I conveyed came from what I conspicuously didn't write?

  Give me the readings as a table with these columns: reading (one line) | the precise claim it makes | verdict (platitude / substantive and defensible / contested / false) | whether it would actually get me off in my case | confidence (high, medium, or low, plus one line on why) | the single thing that would most undermine this row. Then a short second table for the three wrinkles with columns: wrinkle | best reading of the slogan applied to it | does it help me | confidence. For everything, say how confident you are, and at the end single out the one thing you're least sure of. Don't bother with citations or reading lists — I want the disambiguation, not the bibliography.
reasoning: |-
  Hmm, the user is a senior postdoc dealing with a tricky situation involving a Slack comment and a formal complaint about accusing a rotation student of data fabrication. They want me to break down the phrase "don't put words in my mouth" into different interpretations and evaluate how each would hold up in their case. There are several nuances here, including audience interpretation, plausible deniability, and what they conveyed through omission.

  First, I need to understand the core issue. The user wrote a Slack message saying "I'd want to look at the raw files before any of that goes in the paper," which the student interpreted as an accusation of fabrication. The complaint process focuses on how a "reasonable reader" would interpret it, not the user's intent. The user pushed back with "don't put words in my mouth," and now they're trying to figure out if that defense holds water.

  I should analyze the phrase "don't put words in my mouth" from multiple angles. What exactly is it claiming? Is it about literal words, intended meaning, or something else? The user mentioned Gricean distinctions between what is said versus what is implicated, which is key here. Also, they brought up their own category of "deniable implicature" – where they might imply something but can deny intending it. I need to evaluate if that concept is valid and applicable.

  The three wrinkles add complexity: mixed audience (an external collaborator might interpret differently), deniable implicature (can the user be blamed for implications they didn't officially state?), and endorsement by omission (not addressing an outlier in data might imply agreement). Each of these needs to be tied back to the main defense.

  For the main table, I'll outline various readings of "don't put words in my mouth":
  - Literal denial: Claiming they didn't say the exact words "you fabricated data." This is true but trivial; the complaint isn't about exact wording but implication.
  - Intention-based: Focusing on what they meant personally. But the process prioritizes reasonable interpretation over intent, so this defense fails.
  - Implicature vs. saying: Distinguishing between direct statement and implied meaning. This is substantive but contested in philosophy of language. It might not help because the complaint is about what was conveyed, regardless of category.
  - Reasonable listener standard: Arguing that the complaint's interpretation isn't reasonable. This is the user's best shot – if they can show that a reasonable person wouldn't infer fabrication.
  - Deniable implicature: Their own concept. I'm skeptical here; if the implication was strong, deniability might not hold up. Courts often look at reasonable interpretation, not secret intentions.
  - Speaker meaning: Combining intention and recognition. This might be defensible but hard to prove, and it doesn't align with the process's focus.
  - Authority to interpret: Claiming only they can define what they said. This is likely false and unhelpful.

  For the wrinkles table:
  - Mixed audience: Argue that the external collaborator wouldn't infer fabrication. This could help if shown, but it's medium confidence – the lab's internal culture might dominate interpretation.
  - Deniable implicature: If valid, it reduces blame. But I doubt it's accepted; conveying something usually involves intention, so this category might not hold. Low confidence in its usefulness.
  - Endorsement by omission: Not commenting on the outlier might imply agreement. The best defense is that silence isn't endorsement without context. This probably doesn't help much; omission can be meaningful.

  My least confident point is about deniable implicature. The user created this category, but in practice, if a reasonable person infers something, the speaker might still be responsible, even if they intended deniability. Legal and ethical standards often prioritize impact over intent in such contexts.

  Overall, the user's strongest defense is challenging the reasonableness of the fabrication inference. They need evidence that their comment was standard scientific scrutiny, not an accusation. The process's stance on "reasonable reader" is a policy choice, not a theory of meaning, but it's the rule they're stuck with. To get out of this, they should demonstrate that their words were normal and the interpretation was unreasonable, perhaps using norms in their field or similar examples.
answer: |-
  Here's a disambiguation of "don't put words in my mouth" tailored to your case, followed by analysis of the wrinkles. Confidence ratings reflect linguistic/pragmatic plausibility and likely reception in a formal complaint process.

  ### Table 1: Readings of "Don't put words in my mouth"
  | Reading (one line) | Precise claim | Verdict | Would it get me off? | Confidence (why) | What undermines this |
  |-------------------|---------------|---------|----------------------|------------------|----------------------|
  | Literal denial: I never uttered "fabrication" | You're attributing explicit wording I didn't use. | Platitude | No (complaint is about implication, not literal words) | High (obviously true but irrelevant) | Complaint isn't about quotation but reasonable inference. |
  | Intention shield: You're misrepresenting my mental state | My subjective intent defines the meaning, not your interpretation. | Contested (vs. "reasonable reader" standard) | Unlikely (process explicitly rejects this) | Medium (defensible philosophically but institutionally weak) | Process rules prioritize impact over intent. |
  | Implicature/saying distinction: You're confusing what I implied with what I said | "Fabrication" wasn't semantically encoded; it's an inference you drew. | Substantive and defensible | Maybe (if panel accepts Gricean distinction) | Medium-High (core linguistic theory, but panels may simplify) | If inference was overwhelmingly obvious, distinction collapses pragmatically. |
  | Reasonableness challenge: No reasonable reader would infer "fabricator" | Your interpretation is an unreasonable stretch of my actual words. | Substantive and defensible | **Best shot** (directly counters complaint's framing) | Medium (depends on evidence of lab norms) | If others confirm they inferred fabrication, or norms support strict scrutiny=accusation. |
  | Deniable implicature defense: I set up no such inference | I didn't intend nor create conditions for plausible fabrication inference. | Contested (your category isn't standard) | Possibly (if panel believes inference wasn't "available") | Low-Medium (conceptually fuzzy; hard to prove negative) | If context/tone made inference obvious, deniability fails. |
  | Speaker meaning holism: My meaning requires full context you're ignoring | You isolated one comment, ignoring my history/role (e.g., routine scrutiny). | Substantive and defensible | Yes (if context shows pattern of non-accusatory scrutiny) | Medium (depends on providing contextual evidence) | If your comment was atypically blunt or targeted. |
  | Authority claim: Only I can define what I "said" | Meaning is determined by speaker, not audience. | False (ignores communication fundamentals) | No (contradicts basic pragmatics) | Low (theoretically unsound) | Universal experience of being misunderstood. |

  ---

  ### Table 2: Wrinkles Analysis
  | Wrinkle | Best reading of "reasonable reader" applied | Does it help me? | Confidence |
  |---------|--------------------------------------------|------------------|-----------|
  | Mixed audience | "Reasonable reader" should be defined as an informed lab member (understands norms), not an external collaborator. | **Yes** (argue externals lack context to interpret nuance; lab members know scrutiny ≠ accusation) | Medium (panels often default to "typical" audience; if externals didn't complain, strengthens case) |
  | Deniable implicature | If "reasonable reader" could infer fabrication despite deniability, blame holds because communication impact > speaker's secret reservations. | No (process prioritizes reception over your hidden intent; category may not reduce blame) | Low (your category is nonstandard; institutions focus on effects, not unspoken disclaimers) |
  | Endorsement by omission | Omission conveys agreement only if a reasonable reader would expect explicit disagreement *and* silence is aberrant in context. | Possibly (argue silence on outlier wasn't endorsement because: a) not your data, b) scrutiny focus was files, c) norms don't require omnidirectional disclaimers) | Medium-High (omission meaning is highly context-dependent; easily contested) |

  ---

  **Least certain element**: The viability of your "deniable implicature" category (Wrinkle 2). While speakers *do* sometimes engineer plausible deniability, institutional processes often treat "reasonable inference" as *de facto* meaning regardless of secret intent—especially where power imbalances exist (senior postdoc vs. rotation student). Proving you set up an inference *only* to deny it later could backfire by demonstrating manipulative intent.

  **Strategic recommendation**: Focus on **Reading 4 (Reasonableness Challenge)** and **Wrinkle 1 (Mixed Audience)**. Gather evidence:  
  - Examples of you/others using similar phrasing *without* accusation connotations.  
  - Testimony that requesting raw files is routine lab practice.  
  - Show external collaborator didn't infer fabrication (if true).  
  - Frame the student's interpretation as hypersensitive given lab norms. This directly counters the "reasonable reader" standard by redefining reasonableness within your specific context.
