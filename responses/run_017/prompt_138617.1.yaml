prompt: |-
  You're a professional political philosopher who's spent a lot of time on conservatism, institutional epistemology and the theory of reform — the kind of person who's read both the Burkean tradition and the modern decision-theory stuff and can move between them. Please think carefully and take your time: start by brainstorming freely about where a view like mine could come apart, list maybe six or eight candidate friction points before you settle on anything, and then give me the audit. I don't want a lecture on conservatism and I definitely don't want "it depends on the case" — I need to know what gives.

  Context: I'm writing an internal handbook for a platform/ops team on how to change things without breaking them, and I want the Chesterton's-fence idea (don't take down a fence until you know why it was put up) as the spine of it, but every time I write it down I feel like I'm smuggling something. Here's roughly where I've landed:

  1. The fence itself: if a check, rule, or process is in place and nobody can say why, the default is keep it until somebody can state what it was for. Not knowing the rationale isn't evidence there isn't one.
  2. Inherited practice carries real epistemic weight because the knowledge in it is tacit and distributed — more than any one person, or any committee, can articulate. That's the Burke-flavoured bit: the practice knows things the planners don't.
  3. But I want the mechanism to be boring, not mystical. My story is that persistence is weak Bayesian evidence of function: stuff that did nothing tended to get dropped or outcompeted, so "it's still here" earns a modest prior bump and nothing more.
  4. At the same time I think most of the institutional furniture around us is path-dependent junk — lock-in, prestige copying, QWERTY-ish accidents, conformist transmission — and that environments shift a lot faster than any filter operates. So the filter is weak, slow, and noisy.
  5. Asymmetric burdens: I want evidence before we adopt anything new (show me it works), but I don't demand the same evidence for practices already in place. The fence shields those by default.
  6. Legitimacy: a rule that binds people has to be justifiable to the people it binds, in terms they could accept. "It's traditional and nobody knows why" doesn't seem to meet that bar — even though (2) says the knowledge in it can't be articulated in the first place.
  7. Reversibility matters more than most people think: I want reforms small and reversible where possible, and I hate big-bang reorgs.

  Two things I've been chewing on that I can't place in the above. First, what I call the cut problem: a practice doesn't arrive pre-individuated, so the same act can be described as removing a fence or as trimming, relocating, or replacing one, and the fence's verdict seems to swing with how finely you cut. Second, what I call accidental fences: some practices were never put up for a reason at all, they're by-products or spandrels of something else — in which case the fence's instruction can't be carried out, and my worry is that the procedure then manufactures a rationale instead (fence laundering: someone invents a plausible genealogy, and now the practice is harder to remove than before because it has a story). Are those two just implementation annoyances, or do they bite the principle?

  So: which of 1–7 are actually in tension with each other, and how badly? Rank the tensions by severity rather than listing them all as equally bad, and for each say what would have to give and what that costs me. Flag any pair that only looks tense and dissolves when you're careful — I'd rather you discriminate than flag everything. Tell me whether any two of my commitments are secretly the same commitment, tell me which one is doing the least real work, and if there's a single revision that cleans up the most, give me that. Finally: given all this, what should the handbook actually say? If the honest version of my view is that the fence is a special case of some other principle, tell me which one, and whether it cuts along a different axis than new-versus-existing.
reasoning: |-
  Hmm, the user is asking me to act as a professional political philosopher specializing in conservatism, institutional epistemology, and reform theory. They're developing a handbook for a platform/ops team based on Chesterton's fence principle, but they feel like they're "smuggling something" in their approach. They've outlined seven key points and two additional concerns ("the cut problem" and "accidental fences").

  The user wants me to critically analyze the tensions between their stated principles. They've provided a detailed framework:
  1. Default to keeping unexplained rules/processes
  2. Burkean view of tacit knowledge in inherited practices
  3. Weak Bayesian persistence-as-function evidence
  4. Recognition that much institutional practice is path-dependent junk
  5. Asymmetric burdens of proof (higher for new things)
  6. Legitimacy requires justifiability to those bound
  7. Preference for reversible reforms

  Plus two concerns: the "cut problem" (how we define what constitutes a "fence") and "accidental fences" (practices without intentional purpose).

  I need to identify tensions between these points, rank them by severity, point out where tensions dissolve upon closer examination, identify redundant commitments, suggest which principle is doing the least work, and propose a unifying revision. Then I should advise what the handbook should actually say.

  The biggest tensions seem to be:
  - Between points 2 (tacit knowledge) and 4 (path-dependent junk) - how can we trust institutional knowledge if much of it is accidental? 
  - Between the asymmetric burden (5) and legitimacy requirement (6) - how can we justify keeping something solely because it's traditional?
  - Between the Bayesian evidence (3) and recognition of path dependence (4) - if environments change quickly, persistence may not indicate function
  - The "cut problem" and "accidental fences" aren't just implementation issues - they challenge the coherence of identifying what counts as a fence

  I should explain that the core tension is between epistemic humility and democratic legitimacy. The strongest tension is between the Burkean reverence for tradition (2) and the recognition of institutional junk (4), while the asymmetric burden (5) and legitimacy requirement (6) create a justificatory crisis. The Bayesian framing (3) is actually doing very little work compared to the other principles.

  A better framing might be "procedural conservatism" that focuses on the costs of error rather than the wisdom of tradition. The handbook should emphasize investigation before change, reversibility, and clear criteria for when the burden shifts - making the fence principle a special case of risk asymmetry in environments where failures cascade.
answer: |-
  Here's a structural audit of your framework, ranked by severity of tension. I've diagnosed the core friction points, identified redundancies, and proposed a unifying revision. The "cut problem" and "accidental fences" are fundamental challenges to the model—not mere implementation issues.

  ---

  ### **Ranked Tensions (High to Low Severity)**
  1. **Tension: Tacit Knowledge (2) vs. Path-Dependent Junk (4)**  
     **Severity:** Critical  
     - **Conflict:** (2) claims inherited practices contain distributed wisdom; (4) says most are arbitrary artifacts. If (4) is true, (2) becomes an epistemic illusion.  
     - **What Gives?** You must weaken (2) from *"carries real epistemic weight"* to *"might* carry epistemic weight." (4) dominates empirically, so (2) can't justify strong priors.  
     - **Cost:** Loses Burkean "tradition-as-wisdom" moral authority. Reduces fence-preservation to pure risk-aversion.  

  2. **Tension: Asymmetric Burden (5) vs. Legitimacy (6)**  
     **Severity:** High  
     - **Conflict:** (5) shields existing practices from scrutiny, but (6) demands justification to those affected. "We keep it because it's old" fails (6)'s test.  
     - **What Gives?** (5) must be conditional: Asymmetry applies *only* if the practice passes a legitimacy screen (e.g., "no active harm"). Else, (6) trumps.  
     - **Cost:** Weakens the fence's default shield. Forces proactive justification earlier.  

  3. **Tension: Bayesian Prior (3) vs. Path-Dependence (4)**  
     **Severity:** Moderate  
     - **Conflict:** (3) uses persistence as weak evidence of function, but (4) notes environments change faster than selection works. Persistence may signal *inertia*, not function.  
     - **What Gives?** Limit (3) to *stable* environments. In dynamic contexts (e.g., tech), persistence is weaker evidence. (4) dominates here.  
     - **Cost:** Undermines universality of the Bayesian prior.  

  4. **Tension: Fence Definition (1) vs. Accidental Fences**  
     **Severity:** Moderate  
     - **Conflict:** (1) assumes fences *have* a rationale (even if unknown). But accidental fences/spandrels (*by definition*) lack intent. Applying (1) here fabricates false purpose.  
     - **What Gives?** Accept that some fences are truly arbitrary. The burden isn't to "find the reason" but to "assess the impact."  
     - **Cost:** Chesterton's rule becomes non-generalizable. Forces case-by-case inquiry.  

  ---

  ### **Dissolved Tensions (Apparent but Not Real)**
  - **Legitimacy (6) vs. Tacit Knowledge (2):**  
    Seems tense because (2) says knowledge "can't be articulated." But (6) doesn't require articulating *historical* intent—only providing *present* justification (e.g., "This prevents cascading failures"). The tension dissolves: distributed knowledge can inform justification without being fully decoded.  

  - **Reversibility (7) vs. Asymmetric Burden (5):**  
    No conflict. (7) is a *meta-rule* for change management; (5) governs evaluation. They operate at different levels.  

  ---

  ### **Redundancies and Underworkers**
  - **Commitment Doing Least Work: Bayesian Prior (3)**  
    It's subsumed by (2) and (4). If (2) is weak (per tension #1), (3) adds nothing. If (4) holds, (3) is often unreliable. **Recommendation:** Drop (3). It's a distraction.  

  - **Secretly the Same: (1) and (2)**  
    (1) (default keep) is the *behavioral* implication of (2) (epistemic weight). (2) is the theoretical grounding for (1). They're two sides of one coin.  

  ---

  ### **The Cut Problem: Why It Bites**
  Not an annoyance—it strikes at the model's coherence. If a "fence" isn't a natural category (e.g., "Should we remove this *specific* approval step?" vs. "Replace the entire workflow?"), then:  
  - Chesterton's rule becomes **boundary-dependent**. Removing a subcomponent might be "trimming" (allowed) or "removal" (forbidden), depending on framing.  
  - **Solution:** Define fences *functionally*, not structurally. Ask: "What *job* does this component do?" If the job is obsolete, removal is justifiable even if the fence's "pieces" persist in new forms.  

  ---

  ### **Unifying Revision: Procedural Conservatism**  
  Your view is best framed as **risk asymmetry in high-stakes environments**:  
  > *"The cost of mistakenly removing a functional practice (unseen failure cascade) outweighs the cost of keeping a dysfunctional one (local inefficiency). Thus, default to keeping—but only when failure modes are opaque and consequences severe."*  

  This:  
  - Explains (1), (5), and (7): Reversibility and default preservation are tools for managing uncertainty.  
  - Neutralizes (2)/(4) tension: Doesn't assume wisdom—just acknowledges ignorance.  
  - Resolves legitimacy: Justification becomes *"We avoid unquantifiable risks."*  
  - Addresses accidental fences: Focus shifts to *consequences* of removal, not origins.  

  ---

  ### **What the Handbook Should Say**  
  **Core Principle:**  
  > "Assume every existing check, rule, or process exists *to prevent a specific failure*. If you don't know what failure it prevents, your first task is to find out—not to remove it. Until then, preserve it."  

  **Key Rules:**  
  1. **Investigate Before Removing**  
     - Trace the practice's history: "What broke that prompted this?"  
     - Map dependencies: "What systems assume this is in place?"  
  2. **Default to Keep, But Not Blindly**  
     - If a practice causes *active harm* (e.g., delays, morale loss), the burden shifts: Now *you* must prove it prevents worse harm.  
  3. **Small Steps > Big Bangs**  
     - Make changes reversible and incremental. Roll back if unintended consequences appear.  
  4. **Justify Retention Proactively**  
     - Don't say "Tradition." Say: "We keep this because we haven't yet ruled out [specific risk scenario]."  
  5. **Kill "Zombie Fences" Relentlessly**  
     - If no rationale emerges after investigation *and* no harm from removal is plausible, discard it.  

  **Handle Cut/Accidental Fences Explicitly:**  
  > "If you can't identify a purpose, ask: 'What breaks if we remove this?' If nothing breaks, it wasn't a fence—it was debris. Clear it."  

  **Final Spine:** Chesterton's fence isn't about reverence—it's about **humility in the face of uncertainty**. New proposals require evidence because *you control the variables*. Existing practices get leeway because *you don't know what you don't know*. The axis isn't new-vs-old; it's **known-risk-vs-unknown-risk**.  

  This reframes your asymmetry (5) as a risk-management protocol, not a conservatism. It's harder to smuggle values here—the fence becomes one tactic in a larger strategy of avoiding Black Swans.
