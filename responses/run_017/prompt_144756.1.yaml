  First, I consider the core tension: literal truth versus implied deception. The user's team seems split between strict factual accuracy and the ethical responsibility for how messages land. The "never lie" policy creates loopholes that need exposing through concrete scenarios rather than abstract lectures.

  Hmm, the constraint to avoid words like "lie" or "mislead" is crucial - it forces the instrument to reveal judgments through behavioral examples. I'll need to build scenarios that cover all requested tactics: non-denial denials, strategic timing, jargon misuse, etc. The doorstep case must anchor the spectrum from absolute truth-telling to contextual ethics.

  For structure, I'm visualizing a decision tree with two key axes: who creates the false belief (speaker vs listener) and traceability of deception. This reveals positions like "strong assertionism" where only direct false statements matter, versus the "no-difference" view where manipulation is equally wrong regardless of method. 

  The seven philosophical leaves need clear, jargon-free definitions. I'll map them to real communication tactics - like how "assurance-and-role" conflicts with using technicalities to mislead. Scoring must allow for inconsistent positions since actual behavior often contradicts stated principles.

  Notable challenges: ensuring questions can't be gamed, capturing the house style where deniability trumps clarity, and leaving space for the eliminativist view that rejects the whole framework. The calibration question will help identify fundamentalists versus contextualists early on.

  Most importantly, the instrument must make participants confront their own practices. If the comms team routinely drops news before holidays yet marks it "acceptable", that dissonance becomes teachable moment. The scoring should highlight such contradictions between personal judgment and organizational habits.
answer: |-
  Here’s a diagnostic instrument designed to map ethical positions on truthful communication without triggering semantic defensiveness. It uses concrete cases, avoids taboo words, and branches on **source of false content** (speaker vs. hearer-generated) and **traceability** (provable false statement vs. ambiguous impression).

  ---

  ### **The Quiz: "Communication Choices in Context"**  
  *(Answer each: A = Totally fine | B = A bit off but no big deal | C = Just as bad as saying the false thing | D = Worse than that)*  

  1. **"No Comment" as Confirmation**:  
     A reporter asks if your agency is investigating [X scandal]. You say *"We don’t comment on ongoing investigations"* in a grave tone. Colleagues know this *always* means "yes," and headlines assume guilt.  
     **Options**: A | B | C | D  

  2. **Strategic Timing**:  
     Your office releases a controversial policy decision at 6pm on the Friday before a holiday week. No factual errors; it’s just buried in low-attention hours.  
     **Options**: A | B | C | D  

  3. **Literal Truth, Misleading Frame**:  
     Asked if budget cuts hurt services, you say: *"We’ve increased per-unit efficiency by 15%."* True, but units served fell 40%. You chose this stat hoping they’d infer stability.  
     **Options**: A | B | C | D  

  4. **Technical Truth vs. Public Meaning**:  
     During a health scare, you say: *"There are no confirmed cases."* Your team knows "confirmed" = lab-tested; the public hears "no cases exist." Untested symptomatic cases are rising.  
     **Options**: A | B | C | D  

  5. **Off-Record Briefing**:  
     You tell a trusted reporter: *"I can’t say this officially, but check the procurement logs for Project Y."* She publishes the scoop, citing "sources." You avoid an on-record denial.  
     **Options**: A | B | C | D  

  6. **Letting Errors Run**:  
     A reporter publishes a story misrepresenting your policy. You have proof it’s wrong but wait 24hrs to correct it, ensuring maximum reach.  
     **Options**: A | B | C | D  

  7. **Jargon Misdirection**:  
     Asked if a program failed, you say: *"We achieved all Phase 1 benchmarks,"* knowing "Phase 1" (planning) is irrelevant to outcomes. The audience doesn’t know the phases.  
     **Options**: A | B | C | D  

  8. **Answering the Unasked Question**:  
     Asked "Did the CEO approve the deal?" you say: *"The CEO is focused on long-term stability."* True, but she approved it.  
     **Options**: A | B | C | D  

  9. **Cried Wolf**:  
     After years of spin, you announce a real crisis with total transparency. Major outlets ignore it, assuming hype.  
     **Options**: A | B | C | D  

  10. **The Doorstep Calibrator**:  
      An angry person at your door demands your friend’s location. You say *"He’s not here"* (true; he’s in your basement). They leave.  
      **Options**: A | B | C | D  

  ---

  ### **The Decision Tree & Philosophical Leaves**  
  *(Branch nodes: **Source** of false belief [Speaker/Hearer] vs. **Traceability** [Provable/Ambiguous])*  

  ```mermaid
  graph TD
      Root[Did the hearer form a false belief?] -->|Yes| Source[Who supplied the false content?]
      Root -->|No| Leaf1[Strong Assertionism: Only asserting falsehoods is wrong. Everything else is strategic disclosure.]
      Source -->|Speaker implied it| Traceable[Is there a provably false statement?]
      Source -->|Hearer inferred it| Leaf3[No-Difference View: Both manipulate reasoning. Mechanism is irrelevant.]
      Traceable -->|Yes| Leaf2[Assurance-and-Role: “We never lie” promised more than loopholes. Context matters.]
      Traceable -->|No| Leaf5[Worse Than False: Engineered deniability makes the hearer complicit in their own deception.]
      Leaf3 --> Leaf7[Eliminativist: Lying/misleading is a bad framework. Focus on breach of trust or manipulation.]
      Root -->|“Fine” on all| Leaf4[No Pro-Tanto Wrong: No act is inherently objectionable. Outcomes rule.]
      Leaf2 --> Leaf6[Practice-Relative: Local norms (e.g., politics vs. medicine) define acceptable tactics.]
  ```

  **Leaf Definitions**:  
  1. **Strong Assertionism**: Only asserting something you believe false is intrinsically wrong; all other tactics are neutral tools.  
  2. **Assurance-and-Role**: Promising "we never lie" creates a duty not to exploit loopholes; role-based expectations (e.g., press officers ≠ spies) matter.  
  3. **No-Difference View**: Whether you imply or assert, you’re manipulating beliefs. Intentional deception is the core wrong.  
  4. **Nothing Pro-Tanto Wrong**: No act is inherently unethical; only consequences (e.g., public harm) matter.  
  5. **Worse Than False**: Untraceable literal deception is more insidious—it gaslights the hearer and evades accountability.  
  6. **Practice-Relative Conventionalism**: Ethics are defined by the activity (e.g., "political comms" vs. "medical advisories"); no universal standard.  
  7. **Eliminativist**: The lying/misleading distinction distracts; analyze breaches of specific duties (transparency, non-manipulation) instead.  

  ---

  ### **Scoring Key**  
  - **Leaf 1 (Strong Assertionism)**: Mostly A/B on engineered cases (Q1-9), but C/D on Q10 (context over truth).  
  - **Leaf 2 (Assurance-and-Role)**: C/D on Q1-8, A on Q9 & Q10.  
  - **Leaf 3 (No-Difference)**: C on *all* cases where belief is false (Q1-8,10).  
  - **Leaf 4 (Nothing Wrong)**: A on everything.  
  - **Leaf 5 (Worse Than False)**: D on untraceable cases (Q1,3,4,5,7,8).  
  - **Leaf 6 (Practice-Relative)**: Inconsistent—e.g., A on Q2/Q5 (political norms), C on Q4/Q7 (if medical context).  
  - **Leaf 7 (Eliminativist)**: Rejects labels; may mix B/C/D based on harm/assurance.  

  **Unseparable Pairs**:  
  - **Leaf 3 vs. Leaf 5** (both condemn engineered truths, but Leaf 3 equates to lying, Leaf 5 sees it as worse). Requires follow-up on *why*.  
  - **Leaf 4 vs. Leaf 6** (both permit tactics, but Leaf 4 is amoral, Leaf 6 moralizes conventions).  

  **Empty/Incoherent Cells**:  
  - **“Speaker supplies false content + No traceability”**: Contradiction. If speaker implies falsity, it’s *always* traceable via context (e.g., tone in Q1).  
  - **“A on Q10 + C/D on Q1-9”**: Incoherent if context justifies evasion in Q10 but not Q1-9.  

  **Your House Style Alert**:  
  - Likely **Leaf 1 (Assertionism)** with **Leaf 6 (Practice-Relative)** leanings: Most answers will be A/B for Q1-9 (“technically fine!”), but A on Q10 (“context matters!”). This combo is *logically unstable*—if context can override literal truth in Q10, why never in Q1-9?  

  ---

  ### **Workshop Landing**  
  - **Core Tension**: Your team uses literal truth as a *shield* (Assertionism) but hasn’t reconciled why context absolves in Q10.  
  - **Intervention**: Show that "we never lie" is an **assurance**, not a loophole. If Q10’s context (life/death) justifies evasion, then professional context (public trust) demands *more* than literalism.  
  - **Eliminativist Nudge**: Shift focus from "did we lie?" to "did we uphold our duty to inform?"  

  This instrument exposes contradictions without philosophy jargon. The doorstep question forces the room to admit context *always* matters—even for them.
