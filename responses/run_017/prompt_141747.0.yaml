prompt: |-
  You are a professional philosopher who works on deontic logic and on logics that don't explode when something inconsistent shows up — the kind of person who has an actual opinion about what follows from two requirements that can't both be met. Take your time and think carefully; I'd much rather have four paragraphs that have been thought about than fifteen that haven't. Please start by brainstorming five or six candidate concepts you'd genuinely consider here, one line each on why you'd keep or drop them, then narrow to the one or two that survive and do the real carving on those. And please don't pad it with reading suggestions or a bibliography — I'm going somewhere with no internet and I can chase references later. What I want is the shape of the thing, not a label.

  Here's the question: does the pattern I keep running into have a name, and if several names are nearby, which one actually fits?

  I'm a PhD student in human-computer interaction doing fieldwork on how organisations actually use written rule systems — hospital escalation protocols, a housing co-op's rulebook, content-moderation guidelines, and (this one is from a side project) a distributed-systems spec. And I keep finding the same configuration.

  Case one. A hospital protocol has two rules that both fire: escalate immediately if a patient's sats drop below X, and never escalate without a registrar's sign-off. Both are completely clear, there's no vagueness, no dispute about the facts, and nobody says we don't know which one applies. At the incident review, the nurse who escalated without sign-off was described as having done the right thing, and also as having a case to answer — and both of those were said in the same breath, by the same people, without anyone thinking the second remark cancelled the first or demoted either rule to a guideline.

  Case two. The co-op passed one rule in 2019 (every member votes on any decision affecting their tenancy) and another in 2022 (no member votes on a matter where they have a financial interest), both entrenched, both still in the book. When they collided over the bike-shed conversion, the chair's line was: both rules are in force, we are not repealing either, we are not saying either was a mistake, we note the collision in the minutes, and here is the procedure we follow when it happens.

  Case three. Two invariants in a spec that provably can't both hold during a partition. The engineers won't weaken either one or delete either one. They built a component whose entire job is to notice when both can't hold and keep the consequences inside one module so the rest of the system can still be reasoned about normally.

  So the features I think matter: (i) both requirements stay fully in force, for the same agent, at the same time; (ii) the conflict isn't resolved by ranking, by repair, by calling one of them merely provisional, or by adding an exception clause; (iii) it doesn't leak — nobody concludes that nothing is really required, or that everything is permitted, or that the rulebook is worthless; (iv) there's a repeatable procedure, and part of that procedure is a kind of accounting afterwards, which is not the same as a punishment and not the same as saying the conflict was fine. The phrase I've been using in my field notes is in force but contained.

  A philosopher friend muttered the words agglomeration and deontic at me over a drink, then said something about people who think some contradictions are true, then went to a conference and stopped replying. That last bit sounds like it's about facts and truth, and my cases are about rules and requirements, so maybe it's a completely different thing and my friend was just drunk. I also have a half-memory of people arguing about whether, when you can't do both, something is left over afterwards — guilt, or regret, or residue — but that seems to be about how it feels afterwards, whereas what interests me is the inferential discipline: a contradiction is allowed to sit there, in public, and not spread.

  So: does this have a name? If the nearest established concepts each only partly fit, tell me for each one what it gets right and exactly where my description departs from it, and what I'd have to change in my description for it to stop being that concept. Can I get the containment without saying both requirement-claims are true — deny that in-force claims combine, or go non-classical, or treat requirement-talk as not the kind of thing that's true at all — and what does each of those options cost me, i.e. which feature of my three cases can it not account for? Are the both-still-in-force bit and the doesn't-leak bit separable, and if so which is the philosophically interesting one? Give me an operational test too: what would I have to observe in a new organisation to decide which account of my pattern is right? And if nothing established fits, fine — coin a term, define it tightly, and give me two clear positive cases plus two near-misses your definition has to exclude.
reasoning: |-
  Okay, the user is a PhD student in HCI studying how organizations handle conflicting rules in written systems. They've observed a pattern across different contexts—hospitals, co-ops, and tech specs—where two conflicting rules remain in force despite collisions. The user wants to know if this pattern has a name in philosophy, specifically in deontic logic or related fields.

  First, I need to recall relevant concepts. The user's friend mentioned "agglomeration" and "deontic," hinting at deontic logic. Agglomeration in deontic logic is the principle that if you ought to do A and ought to do B, then you ought to do both (A ∧ B). But in these cases, when A and B conflict, agglomeration fails, leading to explosion. That doesn't fit because the rules remain in force without resolution.

  Next, non-monotonic logic allows rules to have exceptions but usually resolves conflicts by overriding one rule. The user's cases don't resolve conflicts; both rules persist. So that's out.

  Paraconsistent deontic logics tolerate contradictions without explosion. But they often still treat conflicting obligations as both true, which might not align with the user's cases where the rules aren't factual truths but prescriptive norms.

  Prima facie duties (Ross) suggest that duties can conflict, and one overrides the other, but the overridden duty leaves residual obligations. However, in the user's cases, neither rule is overridden; both stay in force. The residual part is similar, but the persistence of both rules as equally binding isn't covered.

  Normative gaps occur when no obligation exists in a conflict. But here, both obligations are still acknowledged, so that doesn't fit.

  The key features are: both rules remain in force, conflict isn't resolved, no leakage, and there's a containment procedure. This seems closest to the concept of "robust normativity" or "coherence under inconsistency," but "robust normativity" might not be standard.

  Looking deeper, the containment aspect is crucial. The engineers have a module to handle the conflict, the co-op notes the collision in minutes, the hospital acknowledges both rules post-violation. This procedural containment without resolution suggests a systemic approach to inconsistency.

  Operationally, if an organization has a predefined procedure for collisions without altering the rules, that's a positive indicator. If they override or create exceptions, it's a near-miss. For example, a system that logs conflicts but doesn't change rules fits, whereas one that adds "unless" clauses does not.

  The user also needs to distinguish between the persistence of rules and the lack of leakage. Both are important, but the persistence without resolution is philosophically interesting because it challenges logical explosion. The containment procedure allows the system to function despite the contradiction.

  The user might be hinting at a new concept since existing terms don't perfectly fit. Coining "contained inconsistency" or "procedural quarantine" could work. Positive cases are the examples provided; near-misses are systems that resolve conflicts via hierarchy or exceptions.

  In conclusion, existing concepts partially fit but miss key elements. The user's pattern is best described as "contained inconsistency," where conflicting norms remain active but are procedurally managed to prevent systemic failure.
answer: |-
  Based on your detailed cases and the precise features you've identified, here's a conceptual breakdown and analysis. Existing deontic/normative logic concepts get *parts* of this right, but none fully capture the unique configuration you're observing – particularly the **systemic persistence of both conflicting requirements plus procedural containment without resolution or residue**. Here's the dissection:

  **Candidate Concepts & Why They Fail (Partially):**

  1.  **Prima Facie Duties (W.D. Ross):** *Why Keep:* Acknowledges genuine, non-overridden conflict; duties remain "in force" morally even if one overrides. *Why Drop:* The *override* is key – one duty is *not* fulfilled, it's defeated. Your cases lack defeat: both rules remain equally binding *operationally*, neither is demoted. Ross's residue (regret) is psychological, not your "accounting" procedure.
  2.  **Paraconsistent Deontic Logic:** *Why Keep:* Designed to avoid explosion; allows conflicting obligations `OA & O~A` without trivializing the system. *Why Drop:* Focuses on *logical* containment within the inference system. Your cases are about *operational/procedural* containment within a social/technical practice (minutes, logging, dedicated modules). Logic doesn't inherently provide the "repeatable procedure" or "accounting" you observe.
  3.  **Normative Gaps / Dilemmas (Standard View):** *Why Keep:* Recognizes situations where no correct action exists (`OA & O~A` true, `O(A & ~A)` false). *Why Drop:* Traditionally implies *inaction* or *no obligation to choose*. Your cases show *action is taken* (escalation, voting procedure, module activation) *under* the acknowledgment of conflict, and crucially, **both source rules remain fully authoritative** ("not repealing either"). The gap is about *action guidance*, not rule validity.
  4.  **Non-Monotonic Logics / Defeasible Reasoning:** *Why Keep:* Handles rule conflicts by allowing exceptions or overrides based on context. *Why Drop:* The *resolution* is core – conflicting rules are *defeated* or *overridden* in the specific case. Your cases explicitly reject this: "not repealing either," "not saying either was a mistake," "engineers won't weaken or delete." The rules aren't defeasible *in principle* here; the conflict is acknowledged but not resolved *at the rule level*.
  5.  **Rule-Exception Hierarchies:** *Why Keep:* Common organizational approach. *Why Drop:* Relies on ranking or explicit exception clauses ("unless..."). You explicitly rule this out as a feature (ii). The conflict isn't resolved by adding an exception *to the rule*; it's handled by a separate *procedure* acknowledging the rules' collision.

  **The Survivor & The Gap:**

  *   **Paraconsistent Deontic Logic (PCDL)** survives best regarding the *inferential discipline*: it allows `OA & O~A` without explosion, satisfying (i) both in force, and (iii) no leakage ("everything permitted/forbidden"). However, it fundamentally treats the conflicting obligation *statements* as simultaneously *true*.
  *   **The Gap:** PCDL, as a *logic*, doesn't inherently provide the **procedural containment and accounting** (your key features: repeatable procedure, accounting not punishment, "in force but contained"). It solves the *logical* problem but not the *practical/organizational* one you observe. Your cases aren't just about the *truth* of conflicting obligations; they're about how systems *operationalize* and *manage* them *without altering their normative status*.

  **Why "Both True" Might Not Fit Perfectly & The Cost:**

  Can you have containment without saying both requirement-claims are true?

  1.  **Deny Agglomeration:** Reject that `OA & OB` entails `O(A & B)`. This is standard in most deontic logics handling conflicts. *Cost:* Avoids explosion, allows both `OA` and `OB` to be true individually even when `O(A & B)` is false. *Problem for Fit:* This handles the *logical* non-explosion but doesn't explain the *operational persistence and containment*. It's necessary but insufficient for your cases. It also doesn't inherently deny the *truth* of `OA` and `OB`.
  2.  **Go Non-Classical (e.g., Non-Truth-Apt):** Treat obligation statements as expressions of commitment, imperatives, or plans rather than truth-apt propositions. *Cost:* Avoids the "true contradiction" issue entirely. *Problem for Fit:* Your organizations *treat the rules as authoritative sources of truth* about what is required ("completely clear", "entrenched", "invariants"). The "case to answer" and minutes strongly imply they *assert* the continued validity/truth of both conflicting rules, not just express attitudes. Denying truth-aptness weakens this normative force and the sense of the rules being objectively "in force".
  3.  **Situational Validity:** Claim each rule is true *only relative to its intended context*, and the conflict arises when contexts collide unexpectedly. *Cost:* Avoids contradiction. *Problem for Fit:* Your cases show the rules are explicitly acknowledged to apply to *the same situation* ("both fire", "collided over the bike-shed"). The conflict is recognized as happening *within* the same normative space. This approach risks dissolving the genuine conflict you observe.

  **Operational Test for "Both True" vs. Alternatives:**

  Observe **how the organization justifies sanctions or "accounting" after a collision.** In your hospital case, the nurse has a "case to answer". *Why?*

  *   **If "Both True" (PCDL-ish):** The justification for the "case to answer" would directly reference the *continuing authority and violated status* of the unfulfilled rule ("You violated Rule 2: Never escalate without sign-off, which is still fully in force"). The rule itself provides the ground for critique.
  *   **If Non-Truth-Apt or Situational:** The justification might shift to *procedural violation* ("You didn't follow the containment protocol"), *system harm* ("Your action caused disruption"), or *breach of a meta-rule* ("You failed to recognize the conflict context"), while downplaying the *direct violation* of the specific, still-authoritative rule. The unfulfilled rule loses its direct normative grip in the aftermath.

  **Separating Persistence and Non-Leakage:**

  *   **Both-Still-In-Force:** This is the philosophically *more interesting and challenging* part. It directly confronts the principle of deontic consistency (`OA` entails `~O~A`) and agglomeration. Maintaining this requires a significant departure from classical logic or normative theory.
  *   **Doesn't-Leak:** While crucial, this is somewhat easier to achieve logically (via paraconsistency) or pragmatically (via isolation procedures). It's a consequence of successfully handling the persistence without breakdown.

  **Conclusion & Coinage:**

  No established concept perfectly captures your configuration. PCDL handles the *logical persistence without explosion* but lacks the *procedural containment*. Prima Facie captures *residue* but not *operational persistence without override*. Existing ideas get one wing, but not both.

  **Proposed Concept: Procedural Quarantine of Normative Conflict (Quarantined Incompatibility)**

  *   **Core Definition:** A normative state where two or more authoritative rules or requirements, recognized as simultaneously applicable and operationally incompatible within a specific context, are deliberately maintained in full force without hierarchical override, exception, or weakening, while the practical consequences of their incompatibility are contained through predefined, repeatable procedures that log the conflict and manage its effects, preventing systemic normative collapse ("leakage") and preserving the inferential integrity of the broader rule system.
  *   **Positive Cases (Your Examples):**
      1.  **Hospital:** Escalate if sats low (`OA`). Never escalate without sign-off (`O~A`). Both remain binding requirements. Procedure: Escalate (violating `O~A`), then mandatory incident review ("accounting") documenting the collision. `OA` grounds praise; `O~A` grounds the "case to answer". Neither rule is altered.
      2.  **Housing Co-op:** Vote if affects tenancy (`OA`). Don't vote if conflict of interest (`O~A`). Both remain entrenched. Procedure: Document collision in minutes, follow defined voting recusal *procedure* for *this case*. No repeal or exception added.
      3.  **Distributed System:** Invariant A (`OA`). Invariant B (`O~A`). Both remain unweakened specifications. Procedure: Dedicated monitor/module detects partition (collision context), isolates violation effects, allows rest of system to function `as if` invariants hold (`OA` & `O~A` maintained for reasoning).
  *   **Near-Misses (Excluded by Definition):**
      1.  **Override Hierarchy:** A military chain of command where Rule X yields to Rule Y during conflict. (Violates "no ranking/override" - one rule *is* demoted in that context).
      2.  **Defeasible Rule + Exception:** A traffic rule "No U-turns" with an explicit exception "except at intersections marked with sign Z". Conflict is resolved *within* the rule system via amendment, not quarantined procedurally.

  **The Shape:** You've identified a sophisticated organizational meta-practice for managing fundamental normative inconsistency. It treats the inconsistency as a *system feature* to be managed procedurally, not a *bug* to be fixed logically. The cost of maintaining "both in force" is accepting a localized procedural mechanism to absorb the operational impact, preserving the rules' global authority. The philosophically radical core is the commitment to the *ongoing simultaneous authority* of incompatible demands within a functioning system. "Quarantined Incompatibility" emphasizes both the persistence *and* the active containment procedure.
