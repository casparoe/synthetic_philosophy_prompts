  Okay, the user is taking a moral philosophy course and just finished a week on promising. They feel like everyone was arguing past each other, so they want a solid list of desiderata for a theory of promissory obligation before diving into more reading. Their main goal is to have a theory that explains what they owe after making a promise and why breaking it is distinct from other wrongs like lying or letting someone down. They also provided specific cases they want addressed and asked for an analysis of conflicting requirements.

  First, I need to identify the core issues. The user is frustrated with the lack of clarity in the debates and wants a structured framework to evaluate theories. They’re preparing for an essay, so the desiderata list is crucial for their marks. Their deeper need might be understanding the unique moral force of promises beyond consequentialist or reliability concerns. They’re hinting at the special authority of the promisee to release the promisor, which suggests interest in second-personal accounts.

  Next, the user’s cases: deathbed promise (no benefit, no knowledge), language barrier, promising what’s already owed, secret breaking, and the promisee’s exclusive release power. Each tests different aspects—intention, communication, pre-existing duties, secrecy, and authority. The release power case seems central to their concern about the distinct wrong of promise-breaking.

  I recall Scanlon’s expectation-based view, which focuses on the harm of creating expectations. But the deathbed case challenges this since there’s no expectation. Conventionalist theories like Hume’s rely on social practices, but secret breaking and the deathbed promise test if the obligation exists without social consequences. The authority-based theories, like Darwall’s, explain the promisee’s power to release because the obligation is directed, owed specifically to them.

  Conflicting desiderata: "Must bind even if worse" vs. "Wrong to someone." If the wrong is relational, then in the deathbed case, if the sister is unaware, is it still wrong? But the user prefers keeping the relational aspect. So theories that emphasize the interpersonal wrong might downplay the binding force when no one is harmed, but that clashes with the intuition that promises create obligations regardless of outcome.

  The desiderata list needs to balance these. The promisee’s exclusive release power strongly points to second-personal authority. If the obligation is a directed duty, only the promisee can waive it. This also explains why breaking a promise is a distinct wrong—it violates a specific relationship of trust and authority, not just general reliability.

  For the essay, the user should focus on how well theories handle these cases. The expectation model fails the deathbed promise. Conventionalism struggles with secret breaking. The authority model handles release power well but might need to address cases where the promisee can’t release (like immoral promises). Highlighting these conflicts will show critical analysis.

  The user suspects some desiderata are camp-specific, like binding without benefit. They’re right—consequentialists might reject it, while deontologists insist. Flagging that helps them evaluate theories objectively.

  In the scorecard, authority theories like Darwall’s satisfy most desiderata but might struggle with "already owed" cases. Practice-based accounts fall short on secrecy. Expectation models fail deathbed promises. The duty of fidelity might be too vague without further grounding.

  The user’s emphasis on the promisee’s power suggests they lean towards authority theories. Their essay should argue that this approach best explains the distinctive wrong and the release power, even if it requires tweaking for edge cases. Prioritizing desiderata as core vs. contested will strengthen their argument.
answer: |-
  Here’s a rigorous desiderata list for a theory of promissory obligation, designed to isolate its *distinctive* moral force, with cases and analysis of conflicts. Prioritize what your essay needs: **core requirements** (essential for any viable theory) vs. **contested demands** (reflect specific philosophical commitments).

  ### Core Desiderata (What *Any* Serious Theory Must Explain)
  1.  **The Binding Force:** Promises create a *pro tanto* moral obligation to perform the promised act.
      *   **Case:** Promising to return a borrowed book, then realizing it’s slightly inconvenient. You likely still owe return.
      *   **Why Core:** Without this, it's not a theory of promissory *obligation*. Captures the "what you owe" element.
  2.  **The Distinctive Wrong:** Breaking a promise is wrong in a way distinct from lying, mere unreliability, or disappointing someone.
      *   **Case:** Compare (a) *Not watering a friend's plant because you forgot* (unreliable/disappointing) vs. (b) *Promising to water the plant, then deliberately not doing it* (feels like a distinct betrayal).
      *   **Why Core:** Your central question. A theory failing this reduces promising to another moral category.
  3.  **The Promisee's Release Power:** Only the promisee (or their legitimate proxy) can release the promisor from the obligation. The promisor cannot unilaterally release themselves, nor can third parties (absent special roles/authority).
      *   **Case:** You promise Alice to help her move Saturday. Bob (a mutual friend) says "Don't worry about it, Alice will manage." Alice has not released you. You still likely owe Alice help unless *she* says so.
      *   **Why Core / The Power Source:** This is *the* hallmark of promissory obligation. It points towards an **interpersonal, directed obligation** owed *to the promisee*, rooted in the promisee's authority over the normative claim created. Theories must explain why *this specific person* holds this power – it often stems from the promise being an act *to them* or granting *them* authority over your future action w.r.t. them. (*This directly addresses your "bug" case*).
  4.  **Intention to Obligate:** A promise requires the promisor's intention to undertake an obligation (or at least to be understood as doing so by conventions).
      *   **Case:** Saying "I'll try to make it" vs. "I promise I'll be there." The latter signals an intent to bind oneself.
      *   **Why Core:** Distinguishes promises from predictions, hopes, or casual assurances. Explains why "promise" language is special.
  5.  **Obligation Persists Without External Enforcement:** The obligation exists even if breaking the promise is undetectable and has no negative consequences.
      *   **Case:** Secretly breaking a promise to a deceased person (e.g., a deathbed promise to donate their money to charity, but you keep it secretly). Still feels wrong.
      *   **Why Core:** Shows the obligation isn't merely about consequences (disappointment, social sanction) but an intrinsic normative force. Knocks out crude consequentialist/expectation-damage views.

  ### Important Explanatory Desiderata (Strongly Expected, But Some Theories May Struggle)
  6.  **Obligation Despite Prior Duty ("Already Owed"):** Promising to do something you already have an independent duty to do typically creates an *additional* or *reinforced* obligation.
      *   **Case:** Promising your child you won't steal (which you already have a moral duty not to do). Breaking it now seems like a *double wrong* – theft *plus* promise-breaking.
      *   **Why Important:** Shows promises add specific moral weight beyond the underlying act. A theory claiming it adds *nothing* seems deficient. (*Conflict Potential with #7*).
  7.  **Obligation Despite Lack of Benefit/Harm Avoidance:** Promises can bind even if keeping them benefits no one (or even causes minor net harm) and breaking them harms or disappoints no one.
      *   **Case:** **Deathbed Promise:** Promise your dying friend you'll look after their sister. The sister is wealthy, independent, and would despise your interference. Keeping it is unwanted and slightly burdensome; breaking it harms/disappoints no one (friend dead, sister unaware). Many intuit you still have *some* obligation, however weak or overridable.
      *   **Why Important/Contested:** Directly challenges pure consequentialist/expectation views (Scanlon struggles here). Deontologists/Authority theorists insist on it. **You suspect it's camp-specific - you're likely right.** It's a key test for distinguishing theories prioritizing *fidelity to commitment* itself vs. *harm/expectation*. (*Major Conflict with #2 interpreted as requiring a "wrong to someone"*).
  8.  **Communication & Uptake:** For a promise to be valid, the promisee must generally understand that a promise is being made (though they needn't understand the exact words if the *act* of promising is clear).
      *   **Case:** **Language Barrier:** You say "I promise to pay you $100 tomorrow" in English to someone who only speaks Mandarin, but you both understand the context (e.g., handing them an IOU with "$100", nodding solemnly). Likely still a promise. If you mutter it under your breath while they sleep? Probably not.
      *   **Why Important:** Distinguishes promising from purely internal resolutions. Requires some level of successful communication of the *normative act* being performed. (*Potential Conflict with #5/Deathbed if promisee was unconscious but you spoke clearly?*)
  9.  **Content Constraints:** Promises to do immoral things are typically invalid or non-binding *as promises* (though other reasons not to do the act remain).
      *   **Case:** Promising to help someone commit murder.
      *   **Why Important:** Shows promissory obligation isn't absolute magic; it operates within broader morality. Explains why the promisee can't *release* you into immorality meaningfully.

  ### Key Conflicts & Tensions
  *   **#7 (Bind Without Benefit) vs. #2 (Wrong to Someone?):** This is the core tension you identified. If the distinctive wrong *requires* a wrong *to the promisee* (a relational harm), then the Deathbed Case (#7) is problematic – who is wronged? If the dead friend isn't harmed, and the sister isn't wronged, is breaking the promise wrong *at all*? Theories insisting on #7 must explain the source of the obligation/wrong *without* a present wronged party (e.g., fidelity to commitment, disrespect to the past self/promisee, symbolic importance). Theories rejecting #7 can easily explain #2 as relational harm/disappointment but struggle with the intuition in #7.
  *   **#6 (Already Owed) vs. #7 (Bind Without Benefit):** If a promise adds nothing to an existing duty (#6 seems false), why does it add so much weight when the act is neutral or slightly bad (#7)? A theory needs a consistent account of the *kind* of weight a promise adds.

  ### The Knockout Requirement
  *   **#3 (Promisee's Exclusive Release Power)** does the most work knocking out common candidates.
      *   **Kills Crude Expectation/Reliance Views:** If the obligation stemmed purely from induced reliance/expectation, why can't the promisor dissolve it by proving reliance is unnecessary, or why can't a third party reassure the promisee? Only the promisee holds the normative key.
      *   **Challenges Simple Convention/Practice Views:** While conventions might *structure* the release mechanism, #3 points to a deeper *interpersonal authority* that conventions merely facilitate. Why *this specific* convention? Why does the promisee have this unique normative power within it?
      *   **Highlights the Gap in "Duty of Fidelity" Views:** "Fidelity" to *what*? If it's fidelity to one's word generally, self-release should be possible. #3 forces the answer: fidelity *to the promisee* – it's a directed duty.

  ### Brief Scorecard of Major Theories
  *(Focusing on core desiderata #1-5, especially #2 & #3)*

  | Theory Type               | Key Thinkers          | Strengths                                       | Weaknesses (Re: Desiderata)                                    |
  | :------------------------ | :-------------------- | :---------------------------------------------- | :------------------------------------------------------------- |
  | **Practice/Convention**   | Hume, Rawls (early)   | Explains social role, uptake (#8), norms.       | **Fails #3 (#5):** Obligation dissolves if secret/undetectable. Why *promisee's* release? Struggle with #7. |
  | **Expectation/Trust (Harm-Based)** | Scanlon (Principle F) | Explains reliance, harm of disappointment (#2 as harm). | **Fails #3 (#5, #7):** Third parties can mitigate harm/reliance. Secret breaking often harmless. Deathbed promise (#7) binding? Release is about preventing harm, not unique authority. |
  | **Duty of Fidelity (Simple)** | Prichard, Ross        | Captures #1, #5, #7 strongly. Simple.           | **Fails #2/#3:** Why *distinct* from other fidelity duties? Doesn't explain *promisee's* unique release power (#3). Vague on source. |
  | **Authority / Second-Personal** | Darwall, Owens, Shiffrin | **Best on #2, #3, #5:** Obligation = directed duty *to promisee*; explains release power (#3) & distinctive wrong (#2 as violation of authority/relation). Handles #7 via commitment fidelity. | Can struggle with #6 ("already owed") clarity. May seem overly formal. Requires robust account of normative authority. |

  **For Your Essay:** Structure around the **Core Desiderata (#1-5)**, using the cases as tests. Explicitly tackle the **#3 (Release Power)** as *the* key to distinctiveness and use it to critically evaluate theories. Acknowledge the **#7 vs. #2 (Wrong to Someone)** tension – argue which side your preferred theory takes and why (e.g., "While the intuition in the Deathbed Case is strong, the Authority view explains the distinctive wrong as *essentially relational*; thus, without a capable promisee to wrong, the specific promissory obligation may lapse, though other duties of respect/memory remain"). Use the scorecard concisely to compare theories against your chosen core criteria. Good luck!
