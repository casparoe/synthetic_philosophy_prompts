prompt: |-
  So this is where I'm at: my brother has bipolar I, and about a month back while he was stable he asked me to be the one who gets him sectioned if he stops sleeping and starts wiring money to people he met online. We're trying to get that into a psychiatric advance directive so it triggers on its own, which as far as I can tell is just a real life Ulysses contract, and reading about them has not been comforting — every page is basically "bind your future self, it's rational" and none of them ask who is holding the rope, or what happens if the person holding it has their own reasons. And of course my film group is doing Memento on Thursday and I volunteered to do the ten minute intro, and the two things have fused in my head.

  I don't want Leonard Shelby as a tidy illustration of precommitment, I want the film to break the idea a bit. Two things I've been turning over that I want you to actually use: I've started calling it wax-binding when the option is destroyed and rope-binding when the option is still there but can't be acted on, and I think Leonard's whole system looks like the first and is really the second; and then what I think of as the inverted Ulysses case, where the self doing the binding is the one with worse judgment but better information — the opposite of the drunk/sober setup everyone leans on, and much closer to what my brother is actually asking for.

  Give me exactly five numbered points, one or two sentences each, no preamble and no summing up at the end. Roughly:

  1. which scenes really show him binding himself and which show him being handled by Teddy, and why the wax/rope distinction changes the verdict on which kind of binding can be quietly hijacked by whoever holds it;
  2. the inverted Ulysses worry — does the film suggest self-binding needs an asymmetry in judgment rather than in information, and does a psychiatric directive written while someone is well actually have that asymmetry;
  3. what the film implies about enforcers: the crew had to be ordered both not to untie him and not to listen to him once he was tied, so what does that demand of the enforcer, and is that a job a sibling can take;
  4. the final movement where he knowingly sets things up so his later self will be misled — is that the exact mirror image of a Ulysses contract, and does it say anything about which time-slice gets to speak for him, or about the dead-hand version of this problem where the binders are long gone, like with constitutional entrenchment;
  5. where the honest reading has to stop — the scene or element that just isn't about self-binding at all — and next to that, the one thing Memento shows about precommitment that the argument-driven stuff never says out loud, because my hunch is it's something about the later self needing to recognize the contract as his own rather than merely be bound by it.

  Describe the scenes, don't quote dialogue, and please don't turn it into a tidy moral — I'd rather have something that leaves my brother's situation messier than it was.
