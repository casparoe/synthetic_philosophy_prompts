     Alternatively, we might attribute an unconscious desire or habit. But the director doesn't want that.

     The key is: what work is the belief attribution doing? It is setting up a contradiction that requires explanation. Without the belief attribution, we just have two facts: they say X is better, but they use Y. That's the data. The belief attribution is an interpretation that heightens the contradiction (because if they believe it, why don't they act accordingly?).

     But the statement "they tell us the new one is better" is a fact. We don't need to say they believe it. We can say they report it. Then the contradiction is between their report and their behavior. That's still a contradiction.

     So the belief attribution might be redundant because we can just report their statement.

     However, the report might be trying to explain the behavior by attributing a hidden belief or desire. For example, they might have a hidden belief that the old one is actually better, or a habit, or an aversion to change. But the finding says they can't say why.

  3. **Mechanistic placeholder**: The behavior might be explained by habit (reinforcement history) or by the old dashboard having familiar affordances. We could say: "The old dashboard has become habitual due to long-term use, and the new dashboard, despite perceived advantages, has not been incorporated into their routine." This avoids belief/desire.

  4. **Audience and stakes**:
     - Engineers: They need to know if there is a problem with the new dashboard that is not being reported. They might need to investigate usability issues.
     - Executives: They need to know if the new dashboard rollout is failing and why.

     The belief attribution might be used to suggest that the users are not acting rationally, which might not be helpful. A mechanistic explanation (habit) is more actionable: we need to break the habit by making the new dashboard more rewarding or by forcing a switch.

  Decision: The belief attribution (that they believe the new one is better) is not adding predictive power beyond the report of their statement. We can simply report: "Power users report that the new dashboard is better, but they continue to use the old one and cannot explain why." Then, we can offer a mechanistic explanation: "This may be due to habit formation with the old dashboard, where the familiar interface requires less cognitive effort." So we drop the belief attribution.

  But what about the desire to use the old one? We don't have a statement about that. The report might have attributed a desire implicitly. We can avoid it by focusing on the behavior (they choose the old dashboard) and explaining it by habit or reinforcement.

  Therefore, for this finding, we can drop the belief/desire attributions and use a habit-based explanation.

  However, the procedure must also mark spots where it's a call about audience. In this case, an engineer might want to know that the users' report (new one is better) is sincere but their behavior is driven by habit. So the term "habit" is acceptable? Or do we need to explain habit without mental states? Habit can be described as a learned automatic response to a stimulus, which is behavioral.

  **Procedure Summary**:

  1. For each belief/desire attribution in the finding:
     a. Identify the attribution.
     b. Ask: If we remove this, can we still explain and predict the relevant behaviors by:
          - Reporting the user's statements as behavioral facts (without interpreting as mental states)?
          - Using affordances, reinforcement history, or other mechanisms?
     c. If yes, then drop the attribution and replace with behavioral or mechanistic descriptions.
     d. If not, then keep it but tag it as a placeholder for an unknown mechanism if it is necessary for prediction or explanation and we don't have a mechanistic explanation.
     e. Consider the audience: if the audience is executives and a high-level story is needed, and the attribution is not misleading, then it might be kept plain. But note that the director wants to avoid belief/desire, so we should minimize.

  2. Explicit stopping points:
     - If the attribution is redundant (it's just restating behavior or a user report), then drop it.
     - If it is necessary for prediction (as in it allows us to make new predictions that would not be possible otherwise) and we don't have a mechanistic replacement, then keep and tag as placeholder.
     - If it is necessary for the audience (e.g., execs need a story) and not redundant, then keep it plain but note that it's for communication.

     However, the director's mandate is to avoid them, so we should only keep when absolutely necessary.

  3. What the procedure cannot do:
     - It doesn't settle the metaphysical debate about eliminativism.
     - It doesn't predict the future of neuroscience. If an attribution is load-bearing today but might be cashed out mechanistically in 10 years, the procedure doesn't address that. We are concerned with current reports. The procedure would mark such an attribution as a placeholder (because it is standing in for a future mechanism) and we keep it for now because it's necessary for prediction.

     So for a case where the attribution is genuinely load-bearing for prediction today, we keep it and tag it as a placeholder. The fact that it might be replaced in 10 years doesn't change that.

  **Applying the procedure to the two findings**:

  Finding 1:
     - Attribution: Users believed the button would apply the discount.
     - We can replace by reporting the user's statement and explaining the click by affordances. So drop the attribution.

  Finding 2:
     - Attribution: Users believe the new dashboard is better (but they use the old one). Also, there might be an implicit desire to use the old one.
     - We can replace the belief by reporting the user's statement. The behavior (using the old one) can be explained by habit (a mechanism). So drop the belief attribution. We don't need to attribute a desire because habit explains the behavior.

     But note: the finding says they can't say why. So we don't have a user report about why. We can't report a statement about the reason. Therefore, we must explain the behavior without attributing a belief or desire. We use habit.

  Final Procedure Document:

  **Procedure: Evaluating Belief/Desire Attributions in User Research Findings**

  *Goal*: To determine whether a belief/desire attribution is necessary or can be replaced by behavioral or mechanistic descriptions, in under 10 minutes per finding.

  **Steps**:

  1. **Identify the attribution**: Underline or note every instance where the finding uses terms like "believe", "think", "want", "desire", "expect", etc. to describe a user's mental state.

  2. **Check for necessity**:
     - Can the behavior or outcome be explained without the mental state term by:
          a. Reporting the user's own statements as direct quotes or reported speech (e.g., change "the user believed X" to "the user stated X")?
          b. Describing the behavior in terms of environmental affordances (e.g., the button was prominent and green) or reinforcement history (e.g., the user had used this feature successfully before)?
     - Does the attribution allow us to make predictions that would not be possible otherwise? For example:
          - If we change the context, will the behavior change in a way that is predicted by the mental state?
          - Does it help generalize to a new user group?
          - Does it explain why two users with identical behavior might have different future behaviors?
     - If the attribution is not necessary for explanation or prediction and can be replaced by non-mentalistic descriptions, then it is redundant.

  3. **Decision**:
     - **Drop the attribution**: If it is redundant (step 2 shows it can be replaced without loss). Replace with behavioral reports or mechanistic explanations.
     - **Keep and tag as a placeholder**: If it is necessary for prediction/explanation and cannot be replaced by current mechanistic explanations (but note that we don't have the mechanism yet). Mark it as a placeholder (e.g., "this belief attribution is a placeholder for a cognitive mechanism that we have not yet identified").
     - **Keep it plain**: If it is necessary and there is no current alternative, or if the audience requires it (see step 4) and it is not redundant. But avoid this if possible.

  4. **Audience and stakes**:
     - **Engineers**: Prefer mechanistic explanations (how the system and user interact) that can inform design changes. Avoid mental states unless they are placeholders for mechanisms that are directly relevant to design.
     - **Executives**: May need high-level narratives. If a mental state attribution is necessary for a succinct and accurate narrative and cannot be replaced without losing meaning, then it might be kept. But first try to reframe the narrative in terms of observable behaviors and environmental factors.
     - **Note**: Claims about the company's beliefs (e.g., "the company believed the feature would be popular") are facts about the company's decisions and can be kept as they are not about user cognition.

  5. **Stopping points**: 
     - After step 2, if redundant -> drop.
     - If not redundant and necessary for prediction -> tag as placeholder.
     - If not redundant and required for audience (but not prediction) -> keep plain (but use sparingly).

  **What the procedure cannot do**:
  - It does not resolve philosophical debates about the existence of beliefs/desires.
  - It does not predict future scientific developments. If an attribution is load-bearing today but expected to be replaced by neuroscience in the future, we still mark it as a placeholder today because it is currently necessary and the mechanism is unknown. The tag indicates that it is provisional.

  **Example Applications**:

  *Finding 1*: "People on the checkout page click the big green button within about 400 milliseconds and later say they knew it would apply the discount, but the discount only applies on Tuesdays."

     - Attribution: "they knew it would apply the discount" -> belief/knowledge.
     - Step 2: 
          - We can report the user's statement: "they said they knew it would apply the discount".
          - The clicking behavior can be explained by the button's affordances (big, green, prominent).
          - The belief attribution doesn't add unique predictive power because the same behavior might be predicted by the affordances alone, and the self-report is a separate fact.
     - Step 3: Drop the belief attribution. Rewrite as: "Users clicked the big green button quickly (within 400ms). In post-task interviews, they stated that they knew the button would apply the discount. However, the discount only applies on Tuesdays."
     - Step 4: Engineers need to know about the expectation (from the statement) to fix the design. The rewritten version retains that without the mental state term "knew" in the narrative (it's now a quote). The term "knew" is in the quote, which is acceptable because it's the user's word.

  *Finding 2*: "Our power users keep using the old dashboard even though they tell us the new one is better and can't say why."

     - Attribution: Implicit belief that the new one is better, and possibly an implicit desire to use the old one.
     - Step 2:
          - We can report their statement: "they tell us the new one is better".
          - The behavior (using the old one) can be explained by habit (reinforcement history: long-term use of the old dashboard has made it automatic) or by the old dashboard having familiar affordances.
          - The belief attribution (that they believe the new one is better) doesn't add predictive power beyond their statement. Also, we don't have a statement about why they use the old one, so we must explain without attributing a desire. Habit is a mechanism.
     - Step 3: Drop the implicit belief/desire attributions. Rewrite as: "Power users report that the new dashboard is better, but they continue to use the old one and cannot explain why. This may be due to habitual use of the old dashboard."
     - Step 4: Engineers: The habit explanation suggests breaking the habit by making the new dashboard more salient or by training. Executives: The report indicates a problem with adoption despite positive feedback.

     Note: The original finding didn't have an explicit belief attribution, but the report might have implied one. The procedure still applies to any implicit or explicit mental state attributions.

  **Conclusion**: The procedure helps to remove unnecessary mental state attributions and replace them with behavioral reports or mechanistic explanations. It flags necessary ones as placeholders. This should align with the director's goals while maintaining the utility of the reports.
answer: |-
  Based on your requirements, I've developed a **Belief/Desire Attribution Evaluation Procedure (BDAP)**—a checklist for your writers to assess belief/desire claims in findings in under 10 minutes. It prioritizes utility over metaphysics, with explicit stopping rules and audience considerations. Below is the procedure, followed by application to your two findings, and limitations.

  ---

  ### **BDAP Procedure: 5-Minute Checklist**
  *(Run per finding containing "believes," "wants," "thinks," "expects," etc.)*

  1. **Isolate the Attribution**  
     - Circle the specific belief/desire claim (e.g., "User believes the button applies discount").

  2. **Test 1: Predictive Necessity**  
     - *Ask:* "If we remove this attribution, can we still predict *novel* behavior in an untested scenario?"  
       - **Yes** → Drop attribution (it’s decorative). Proceed to rewrite.  
       - **No** → Flag as "placeholder" and move to Test 2.  
       - *Example:* If the claim predicts behavior in a new context (e.g., "Users will click *any* green button quickly"), it’s necessary.

  3. **Test 2: Generalization/Differentiation Value**  
     - *Ask:* "Does this attribution help us generalize to a *slightly different user* or distinguish users with *identical behavior*?"  
       - **Yes** → Keep as "placeholder" (it’s load-bearing).  
       - **No** → Drop attribution.  
       - *Example:* If two users act the same but one has different hidden beliefs, and this affects future behavior, keep it.

  4. **Audience & Stakes Check** (Non-factorial)  
     - *Ask:* "Who needs this report, and what’s the cost of being wrong?"  
       - **Engineers** (build things): Prefer mechanisms (affordances, reinforcement). Drop attribution unless predictive (Test 1).  
       - **Execs** (decide things): Keep plain if it clarifies a "story" (e.g., market positioning).  
       - **Corporate claims** (e.g., "Company believed X"): Always keep plain—it’s a factual business decision, not cognitive speculation.

  5. **Stopping Rules**  
     - **Drop**: Fails Test 1 *and* Test 2.  
     - **Placeholder**: Passes Test 1 or Test 2 (mechanism unknown). Tag: "[Cognitive placeholder: predicts/generalizes X]".  
     - **Keep Plain**: Only if Audience Check demands it (e.g., exec storytelling) *and* it passes Test 1 or 2.

  ---

  ### **Applied to Your Findings**
  #### **Finding 1: Checkout Button**  
  > *"People click the big green button in 400ms and say they knew it would apply the discount, but discount only applies on Tuesdays."*  
  - **Attribution**: "They knew it would apply the discount" (belief).  
  - **Test 1 (Predictive)**:  
    - Without belief: Affordance (big green button) predicts clicking speed.  
    - *But* belief predicts *frustration when discount fails* on non-Tuesdays → **Passes** (novel prediction: user backlash).  
  - **Test 2 (Generalization)**:  
    - Belief doesn’t help generalize to new users (all users see same button) or distinguish users → **Fails**.  
  - **Audience Check**:  
    - **Engineers**: Need mechanism (button design + false affordance). Belief is a placeholder for "expected outcome mismatch."  
    - **Execs**: Belief explains churn risk → Keep plain for storytelling.  
  - **Verdict**:  
    - **Tag as placeholder** for engineers: "Users associate button with discount application due to [design affordances + past UI patterns] — predicts frustration when unmet."  
    - **Keep plain** for execs: "Users *believe* it applies discounts; this creates loyalty risk on non-Tuesdays."  

  #### **Finding 2: Power Users & Dashboard**  
  > *"Power users keep using old dashboard though they say the new one is better and can’t say why."*  
  - **Attribution**: Implicit desire ("they prefer old dashboard") + belief ("new one is better").  
  - **Test 1 (Predictive)**:  
    - Without desire: Affordances (old UI familiarity) predict behavior → **Fails** (no new predictions).  
  - **Test 2 (Generalization)**:  
    - Belief/desire *fails* to generalize (all power users act alike) or distinguish (no behavioral variation) → **Fails**.  
  - **Audience Check**:  
    - **Engineers**: Need mechanism (e.g., "Old UI has stronger reinforcement history"). Belief/desire is redundant.  
    - **Execs**: Belief ("new is better") is contradicted by behavior → Creates confusion. Drop.  
  - **Verdict**:  
    - **Drop attribution entirely**. Rewrite mechanistically:  
      *"Power users persist with old dashboard due to habit strength (high reinforcement history) and cognitive efficiency (lower load), despite verbal reports favoring new dashboard’s features."*  

  ---

  ### **What BDAP Cannot Do**  
  1. **Time-Cashed Predictions**: If an attribution *is* load-bearing today (e.g., predicts novel behavior) but might be replaced by neuroscience in 10 years, BDAP **tags it as a placeholder**. Utility today trumps future reducibility. Your writer’s job is current report efficacy—not metaphysics.  
  2. **Resolve Self-Reports**: BDAP treats user statements (e.g., "I knew the button applies discount") as *behavioral facts*, not truth. It only challenges *researcher interpretations* of those facts (e.g., "User believes X").  
  3. **Cover All Philosophy**: It won’t address qualia, intentionality, or other hard problems—just whether the term is doing work in *this report*.  

  ---

  ### **Practical Output for Your Team**  
  - **Writers**: Use this as a yes/no flowchart for each finding.  
  - **You**: When signing off, check tags ("placeholder," "dropped," "plain") against audience (engineer/exec).  
  - **Director Alignment**: Framing placeholders as "mechanism unknowns" satisfies her anti-folk-psychology stance while retaining predictive utility.  

  This turns eliminativism into an operational filter—no philosophy degree required.
