  We are creating a procedure to evaluate belief/desire attributions in user research reports. The goal is to determine whether such attributions are necessary, replaceable, or merely descriptive. The procedure should be applied to each finding in under 10 minutes by someone without a philosophy background.

  The procedure steps:

  1. **Identify the attribution**: Locate the belief/desire statement in the report finding. For example, "the user believed that the button would apply the discount".

  2. **Check for predictive power**: 
     - Does the attribution predict behavior in a new setting? (e.g., if we change the button color, would the belief change and thus the behavior?)
     - Does it help generalize to a slightly different user? (e.g., would a user with a different background still hold this belief?)
     - Does it distinguish two users who act identically? (e.g., two users both clicked quickly, but one believed the discount would apply and the other didn't? Actually, they acted identically so if the belief is different, then the belief attribution might be doing work to explain why the same behavior might occur for different reasons, but in this case the behavior is the same and the belief is the same? We need to be careful.)

     Alternatively, if the attribution is only a redescription of the observed behavior and doesn't add any predictive or explanatory power beyond what is already in the data, then it may be eliminable.

  3. **Check for mechanistic placeholder**: 
     - Is the attribution standing in for a mechanism we don't yet understand? If so, we might keep it but tag it as a placeholder.

  4. **Consider audience and stakes**:
     - For engineers: they need mechanistic explanations to build or fix things.
     - For executives: they might need a high-level story for decision-making.
     - Also, note if the claim is about the company (e.g., "the company believed X") vs. the user. The company's belief might be a fact about the company's state (which can be documented) and is different from a user's mental state.

  5. **Decision points**:
     a. **Drop the attribution**: If it doesn't add predictive power and is just a redescription.
     b. **Keep and tag as placeholder**: If it is necessary for prediction or explanation but we don't have a mechanism, mark it as such.
     c. **Keep it plain**: If it is necessary for the reasons above and we don't have a better way, or if it's required for the audience (e.g., an exec story).

  Now, apply the procedure to the two given findings.

  **Finding 1:**
     - People on the checkout page click the big green button within about 400 milliseconds and later say they knew it would apply the discount, but the discount only applies on Tuesdays.

  Attribution: Users believed the button would apply the discount.

  Steps:

  1. **Identify**: The belief is that the button applies the discount.

  2. **Predictive power**:
     - In a new setting (e.g., if the button is moved), would the belief change? The belief is tied to the button's appearance and location. If we change the button, the belief might change and thus the clicking behavior might change. So it has predictive power for design changes.
     - Generalization: For a new user, we might predict they would also form this belief because of the button's salience and common conventions (green buttons often mean proceed or apply). So it generalizes.
     - Distinguishing users: If two users both click quickly, but one says they believed it applied the discount and the other says they didn't, then the belief attribution would help explain why they both clicked (if the behavior is the same, then the belief might be the same too, so it doesn't distinguish). In this finding, all users said they believed it, so it doesn't distinguish in this case. But the key is that the belief is used to explain the quick click (they acted because they believed it would apply the discount). Without the belief, we might not understand why they clicked so quickly.

     However, note that the discount only applies on Tuesdays, so the belief is actually false on other days. But the behavior (clicking) still occurs. So the belief is causing the behavior even when false.

     Without the belief, we might describe the behavior as: "users click the big green button quickly because it's big and green and salient". That's an affordance-based explanation. The button affords clicking because of its design. The belief attribution adds that the user expects a specific outcome (discount application). If we remove the belief, can we still explain why they click? Yes, by the affordance. But then we wouldn't capture the expectation of the discount, which is important because the discount doesn't always apply. The user's expectation (belief) is causing frustration when the discount isn't applied? Or is it? The finding doesn't say anything about frustration.

     The report might be trying to explain the quick click and also set up a potential problem (the user expects a discount that isn't always there). So the belief is important for that second part.

     Therefore, the belief attribution is doing work: it predicts that if we remove the discount feature, users might still click and be confused, or if we change the button to not look like it applies a discount, they might not click as quickly. Also, it explains the potential for user error or frustration.

  3. **Mechanistic placeholder**: We don't have a neural mechanism for this belief, but in user research we don't typically need that. However, the belief might be replaced by a description of the user's past experiences (reinforcement history: they've seen green buttons apply discounts before) and the current context (the button is green and prominent). So we could describe it without using "belief". But the belief term is efficient and understandable.

  4. **Audience and stakes**:
     - Engineers: They need to know that the button triggers an action (applying discount) only on Tuesdays, but users expect it always. So they might need to fix the button to only show on Tuesdays or change the label. The belief attribution helps them understand the user's mental model.
     - Executives: They need to know that there is a mismatch that could cause frustration and lost sales.

     Also, note: the company's belief (if any) is a separate issue. Here, it's about the user.

  Decision: The belief attribution is doing important work for prediction and explanation. It could be replaced by a description of the user's past experiences and the current context (affordances and reinforcement history), but the term "belief" is efficient and widely understood. We might keep it plain, but note that it is a placeholder for a mechanism we haven't fully specified (the cognitive process). However, in the context of user research, it's acceptable. Alternatively, we can rephrase without "belief" by focusing on the expectation set by the design and past experiences.

  But the director wants to avoid belief/desire. So we might try:

  "Due to the button's prominent design and conventional association of green buttons with positive actions, users form the expectation that clicking it will apply the discount. This expectation leads to quick clicking behavior. However, the discount is only applied on Tuesdays, so on other days the user's expectation is not met."

  This uses "expectation" which is still a mental state. Alternatively, we can be more behavioral: "The button's design (big and green) leads to high click-through rates, but the discount feature is only active on Tuesdays. This discrepancy may cause user confusion when the discount is not applied."

  But the original finding included the user's self-report that they knew it would apply the discount. The self-report is data. We can report the self-report without attributing a belief? We can say: "Users reported that they expected the button to apply the discount." That's reporting what they said, not necessarily attributing a belief. But the director might object to "expected" as well.

  Given the procedure, if the prediction and explanation can be done without the mental state term, then we drop the attribution. But the self-report is a fact: users said X. We can report that. The attribution of belief is an interpretation of that self-report. So we can avoid the interpretation and just report the self-report and the behavior.

  So for the procedure:

  - The attribution of belief is not strictly necessary because we can describe the behavior (quick click) and the self-report (users said they knew it would apply the discount) and then note the problem (discount only on Tuesdays). The self-report is data, so we can report it as such without using the term "belief". We can say: "Users reported that they knew the button would apply the discount."

  Thus, we can drop the belief attribution and just report the self-report. Then, the explanation for the quick click can be in terms of the button's affordances and the self-reported expectation.

  But note: the self-report is a behavioral datum. So we are not eliminating it, we are just not interpreting it as a belief. We are reporting it as a verbal behavior.

  Therefore, for this finding, we can:

     - Drop the belief attribution and replace with: "Users reported that they knew the button would apply the discount." 
     - Then, explain the behavior as a result of the button's affordances and the user's report.

  But the report might want to connect the two: the self-report and the behavior. The quick click is consistent with the report. We don't need to say they believed it to explain the click? The click is already observed. The self-report explains why they clicked quickly? Only if we take the self-report as an indicator of their state at the time of clicking. But they reported it later. It might be a post-hoc rationalization.

  This is getting messy. The procedure should be:

     - If the belief attribution is used to explain the behavior and there is no other explanation in the report, then it is doing work. But in this case, we have two explanations: the affordance (which is immediate) and the belief (which is cognitive). The director prefers affordance.

     Since the behavior (clicking quickly) can be explained by the affordance (the button is big and green and in a prominent location) without reference to belief, and the self-report can be reported as a separate fact, then the belief attribution is redundant. We can drop it.

     However, the self-report is important because it indicates that the user has an expectation that is not always met. So we keep the self-report and drop the interpretation (belief). We can say:

        "Users clicked the big green button quickly (within 400ms). In post-task interviews, they reported that they expected the button to apply the discount. However, the discount only applies on Tuesdays, so on other days this expectation is not met."

     This avoids the term "belief" and uses "expectation", which might be acceptable? Or if the director objects to any mental state term, we might say: "Users reported that they thought the button would apply the discount." But "thought" is also mental. Alternatively, we can say: "Users stated that the button would apply the discount." But that's reporting their statement.

     The procedure: if we can replace the belief attribution with a report of the user's statement, then do that. So we drop the belief attribution and keep the reported statement.

     But note: the original finding said "they knew it would apply the discount". That's a statement about their knowledge. We can report it as they said "I knew it would apply the discount". That's a direct quote.

     So:

     **Decision for Finding 1**: Drop the belief attribution. Instead, report the user's statement as a quote or as a reported fact without interpreting it as a belief. Then, the behavior (quick click) is explained by the button's affordances. The problem (discount only on Tuesdays) is a separate fact. The connection (that the user's statement indicates an expectation that might be violated) is acceptable without using the word "belief".

  **Finding 2:**
     - Our power users keep using the old dashboard even though they tell us the new one is better and can't say why.

  Attribution: There might be an implicit belief or desire here. For example, they believe the old dashboard is more efficient, or they desire to stick with what they know.

  But note: they say the new one is better. So there's a contradiction between what they say and what they do.

  Steps:

  1. **Identify**: The report might say something like: "Despite believing that the new dashboard is better, they continue to use the old one." Or it might not explicitly attribute a belief, but it implies they have a belief (that the new one is better) and a desire (to use the old one?).

  2. **Predictive power**:
     - If we change the old dashboard (e.g., remove it), would they switch? The attribution of a belief that the new one is better would predict that they would switch if forced. But they haven't switched voluntarily, so there might be another factor. The belief attribution alone doesn't predict the behavior. We need to attribute a conflicting desire or habit.
     - Without the belief attribution, we could say: "Users report that the new dashboard is better, but they continue to use the old one." That's just the data. The belief attribution (that they believe the new one is better) doesn't add predictive power beyond the report. The report is a fact: they said it's better. We don't need to say they believe it. They might be lying or mistaken, but we don't know.

