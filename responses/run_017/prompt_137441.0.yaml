prompt: |-
  I've been reading about capital punishment lately — not for any reason, just got into it — and I keep running into the same shape of argument, and I don't know if there's a word for it.

  First place I noticed it: people who support the death penalty say that nobody has actually shown that an innocent person has been executed, and people against it say that proves nothing, because once the execution happens the appeals end, the lawyers move on, reporters lose interest, nobody funds the testing. What got me is that it isn't just that the evidence is missing — it's that carrying out the policy is what dismantles the machinery that would have turned up the mistake. Doing more of it wouldnt just risk more errors, it would mean fewer of the errors ever come to light. And it seems to run the other direction too: the reason we know about the death row exonerations we do know about is that those people sat there for years with somebody still digging.

  Second place: the deterrence side. The studies dont find a clear effect, and the reply is that of course they dont, because we execute so few people so slowly — a swift and certain death penalty is what would deter. But swift and certain means less review and fewer appeals. So the version that is supposed to work is the version with the weakest error-correction, and you cant find out whether it works without adopting it at scale.

  A friend said this sounds like Goodhart's law, but I dont think so: in neither case is anybody gaming a measure, the detecting just stops. Is there a name for this — a practice whose use erodes the evidence you would need to judge it? Are my two cases even the same thing, or is one about discovering past mistakes and the other about testing a causal claim? If there's no name, give me one with a definition that marks the edges, because I don't want something so broad it swallows every case where absence of evidence isn't evidence of absence.
reasoning: |-
  Okay, the user has been reading about capital punishment and noticed a recurring argument pattern. They describe two scenarios: one about proving innocence post-execution and the other about deterrence studies. In the first scenario, executing someone halts investigations, making it hard to prove innocence. In the second, the argument is that a swift death penalty would deter crime, but that requires reducing appeals, which means fewer chances to catch errors. The user wants to know if there's a term for this phenomenon where the practice itself destroys the evidence needed to evaluate it.

  First, I need to figure out if these two examples are the same type of issue. The innocence case is about uncovering past errors—once execution happens, the mechanisms to find mistakes stop. The deterrence part is about testing a causal claim: implementing swift executions would prevent gathering evidence on its effectiveness. Both involve the intervention disrupting the evidence-gathering process. So they're similar in structure but applied to different aspects (past errors vs. future predictions).

  The user mentioned Goodhart's Law, but that's about metrics being gamed once they become targets. Here, it's not about manipulation; it's about the cessation of investigation. So that's different. They want a term that's specific, not just the absence of evidence fallacy. The key is that the action actively destroys the means of obtaining evidence.

  Looking into epistemic concepts, there's "The Collingridge Dilemma," which is about controlling technology: it's hard to predict impacts early, and later, it's hard to change. But that's about timing and control, not evidence erosion. "Observer Effect" or "Demand Characteristics" relate to measurement affecting the subject, which is closer but usually in scientific contexts. "Performativity" in social sciences is when a theory's enactment changes reality, but that might be too broad.

  The user’s deeper need might be to articulate this concept for academic or discussion purposes. They might be writing something or engaging in debates and need a precise term to strengthen their argument. They also want to avoid overly broad terms, so specificity is crucial. If no existing term exists, coining one makes sense. "Epistemic Erosion" captures the idea—knowledge (epistemic) being worn away (erosion) by the practice. "Evidence Destruction Feedback Loop" emphasizes the cyclic nature. The user might prefer a concise term they can use in discussions without lengthy explanations. They also want a clear definition to set boundaries, distinguishing it from mere absence of evidence. Ensuring the term covers both scenarios is key, as they see them as interconnected in the death penalty debate.
answer: |-
  That's an incredibly sharp observation – you've identified a profound and under-discussed structural problem in evaluating certain high-stakes policies. Your two examples **are manifestations of the same core epistemic dilemma**, though applied to different aspects (past innocence vs. future deterrence). There isn't one universally accepted term, but several concepts capture parts of it, and we can synthesize a precise definition.

  Here's a breakdown and the best terminology options:

  1.  **The Core Problem:** You've described a **self-erasing evidence trap** or **epistemic black hole**. The policy intervention itself actively dismantles or prevents the very mechanisms needed to gather evidence about its own effects (specifically, negative consequences or failures). This goes far beyond mere "absence of evidence." It's the *active destruction of the capacity to obtain evidence*.

  2.  **Why Your Distinctions Matter (and Cohere):**
      *   **Past Innocence (Discovering Errors):** Execution terminates the subject and the legal/investigative processes focused on proving error. The practice *destroys the subject* and *disbands the investigative apparatus*.
      *   **Future Deterrence (Testing Causality):** Implementing the proposed "effective" version (swift/less review) *deliberately removes the safeguards and time delays* that allow for error detection *and* for the rigorous longitudinal/comparative studies needed to measure deterrence. You can't test the causal claim without implementing the conditions that preclude reliable testing.
      *   **The Unifying Principle:** In both cases, **the policy, when implemented in the form argued to be necessary or definitive, systematically eliminates the pathways for generating counter-evidence to its own justification.** It creates a feedback loop where the more "effectively" or definitively the policy is applied (executing quickly, reducing appeals), the less able we are to know if it was a mistake (innocence) or if it actually works (deterrence).

  3.  **Relevant Concepts & Why "Goodhart" Isn't Quite It:**
      *   **Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure"):** You're right, this isn't it. Goodhart is about metric distortion through gaming. Here, the problem isn't gaming; it's the *cessation of measurement itself*.
      *   **The Collingridge Dilemma (Control Dilemma):** This is *related* but broader. It states that impacts of a technology/policy are hard to predict early (when you can still control it easily) but become easy to see later (when it's hard to control). Your trap is a specific *instance* where the policy's implementation *actively prevents* those later impacts (specifically evidence of failure) from being seen.
      *   **Observer Effect / Hawthorne Effect / Demand Characteristics:** These describe how the *act of observation/measurement* changes the phenomenon being studied. Your trap is different: it's about how the *policy intervention itself* (execution, reducing appeals) destroys the *capacity* for observation *after the fact* or *under the proposed conditions*.
      *   **Performativity (Social Science):** This describes how theories or models, when believed and acted upon, shape reality to conform to them. Your deterrence point touches on this – *believing* swift punishment deters leads to implementing a system where testing that belief becomes impossible. Your innocence point is less about belief shaping reality and more about reality becoming unknowable.
      *   **Epistemic Injustice:** While not a perfect fit, the systematic destruction of pathways to know the truth (especially about potential wrongful executions) has echoes of this, particularly "testimonial injustice" where the means to convey knowledge are suppressed.

  4.  **Proposed Term & Precise Definition:**

      Based on your sharp analysis, the most fitting term is:

      **Epistemic Erosion (Specific to Policy Evaluation):**

      > **The phenomenon whereby the implementation or intensification of a policy or practice systematically degrades or destroys the very mechanisms (investigative, procedural, methodological, or temporal) necessary to generate reliable evidence about its own negative consequences, failures, or true causal effects. This creates a structural bias where evidence of success may be observable, but evidence of failure becomes progressively harder or impossible to obtain.**

      **Why this works & marks the edges:**

      *   **"Epistemic":** Directly addresses knowledge production.
      *   **"Erosion":** Captures the gradual or active dismantling/destruction of the capacity for knowledge.
      *   **Specific Scope:** Focuses on *policy/practice evaluation*, specifically regarding *negative consequences/failures/true causal effects*.
      *   **Mechanism:** Explicitly mentions the degradation/destruction of *mechanisms* for evidence generation (appeals, investigations, review periods, research feasibility).
      *   **Structural Bias:** Highlights the created asymmetry in evidence availability (easier to see "success," harder to see "failure").
      *   **Excludes Mere Absence of Evidence:** Requires the *active degradation/destruction* caused *by the policy itself* as the reason evidence is absent. Simple lack of data without this causal link doesn't qualify.

  5.  **Applying the Term to Your Cases:**
      *   **Innocence:** The death penalty, especially when carried out swiftly or frequently, causes *epistemic erosion* regarding wrongful executions. Execution terminates the subject and the focused legal/investigative effort, actively eroding the pathways to discover the error.
      *   **Deterrence:** Proponents argue that only a "swift and certain" death penalty deters. However, implementing this *causes epistemic erosion* regarding deterrence itself. Reducing appeals and review periods erodes the capacity to detect innocence *and* eliminates the extended timeframe and robust appeals process that allows for comparative statistical analysis and ruling out confounding factors. You cannot reliably test the causal claim under the conditions required to make it "work."

  You've pinpointed a critical flaw in how we evaluate irreversible or high-stakes interventions. **Epistemic erosion** captures the essence: the policy eats away at the ground we need to stand on to judge it fairly. It's a powerful concept for critiquing not just capital punishment, but any policy where the intervention itself obscures its own flaws or true effects.
