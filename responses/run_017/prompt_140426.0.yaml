prompt: |-
  I'm creative director at a nine-person studio that ships short, replayable puzzle games for mobile. Every quarter we pick one theme, run a two-day jam, come out with twenty to thirty one-sheet concepts, and I have to cut that down to three that get prototyped for a month by a pair each. I'm the one deciding, our studio head signs off on the three, and I get maybe an hour per sheet and have to defend the call afterward to a team that does not want a theory lecture.

  Here's why I'm writing. I keep having the same argument with myself. Years ago someone dropped a link in Slack to this Hofstadter thing about creativity — a lecture, a chapter, I honestly dont remember — arguing that creativity isn't rabbits out of hats but variations on a theme: you absorb a style-space from a few hundred examples, then novelty is mostly twiddling the knobs of that space, some knobs shallow and some deep, and the interesting stuff happens when you shove one knob way past where anyone has shoved it, or move several at once, or let a concept slide sideways into a setting it wasn't built for. The bolt from the blue is the myth. That rings true to how our good games actually happened, but I have no way to do it on purpose, so right now "pick three" is vibes plus whoever argues best in the room.

  So: turn it into a procedure I can actually run on a one-sheet. Concretely I need:

  1. A step for getting the knobs out before anyone generates anything — how you name the axes of a theme instead of just listing its features, and how you notice the knob nobody in the room can name yet. My guess is that deliberately generating terrible variations is one way in; you tell me.
  2. A way to sort knobs by depth. My working distinction: a surface knob is one you can set independently of everything else; a structural knob is one that drags other knobs with it when you move it; a frame knob is one whose mere existence is what makes the theme that theme. Fix this if it's wrong, and give me a test I can run on a knob in five minutes to classify it, including an account of when the test just doesn't settle it.
  3. Moves for searching the space on purpose rather than hoping: push one knob to an extreme, move a coupled cluster at once, delete a knob entirely, borrow a knob from an adjacent genre. Say what each move is for and what it tends to produce.
  4. Tests, in order, for judging a variation once we have one. Two failure modes matter to me: the samey-but-new one, where a knob genuinely moved and the experience is identical, and the lost-the-thread one, where the variation quietly became a different game and we don't notice for a month. Tell me which is worse for a studio our size and make the procedure treat them accordingly instead of treating them as equally bad.
  5. Where the procedure stops with a no, and where it has to hand the decision to a person because the question is really about values — what kind of studio we want to be, how much audience we're willing to trade — and who that person should be, given I'm the one running it and my boss signs off.

  Then run it on three real sheets from last quarter:

  - "Noughts": our match-three with the failure state deleted. You can't lose; the board just gets messier until you walk away. Everyone under thirty in the studio loved it. Our studio head thinks removing losing removes the game.
  - "Folio": the same tile-sliding puzzle we've already shipped twice, redone with a hand-drawn bestiary and a different grid size each level. The team's favorite by a mile and, in my gut, the weakest sheet in the pile.
  - "Errand": a roguelike run structure — permadeath, drafting a deck of moves between attempts — bolted onto our daily word puzzle. Nobody can agree whether this is a variation on the daily or a different game wearing its skin.

  Give me a verdict and the reasoning on each, mark clearly which parts came from the procedure and which were your judgment, and include at least one where the procedure hands me an answer I don't want.

  Last thing: tell me where this will misfire. Two worries I want confirmed or killed — (a) writing the knob list down before the jam might shrink the space to whatever we managed to name that morning, and (b) the whole model has nothing to say about whether an idea is fun, or funny, or well-timed, and I'm scared we'd end up optimizing how legible a concept is instead of the thing itself. Say which of those the procedure should flatly refuse to touch.

  Format: prose first for the procedure and the three cases. Then, so I can paste it into our Notion template, the same thing again as a single JSON object with these keys: knobs (array of {name, kind: surface | structural | frame, how_to_find, watch_out}), steps (array of {order, question, sufficient_answer, stop_no, escalate_to}), tests (array of {name, detects, pass, confused_with}), cases (array of {name, knobs_moved, verdict, reason, judgment_call: true or false}), limits (array of strings). Don't pad it — if a field is empty for us, say so in the field.
reasoning: |-
  We are designing a creative decision procedure based on Hofstadter's model of creativity as variations in a style-space. The goal is to turn the abstract model into a concrete, step-by-step process for selecting game concepts from a jam.

  The procedure has several parts:

  1. **Knob Extraction**: Before the jam, we want to define the "knobs" (dimensions of variation) for the theme. We need to name axes and identify unnamed ones.
  2. **Knob Classification**: We sort knobs by depth (surface, structural, frame) and provide a test to classify them.
  3. **Creative Moves**: Methods for generating variations by manipulating knobs.
  4. **Variation Tests**: Criteria to judge a variation, with special attention to two failure modes: samey-but-new and lost-the-thread.
  5. **Decision Points**: Where the procedure stops (with a no) and where it must be handed to a person for a values-based decision.

  Additionally, we apply the procedure to three real concepts and then provide the procedure in a structured JSON format.

  ---

  ### Part 1: Knob Extraction (Step 1)

  **Goal:** Generate a list of knobs (axes of variation) for the theme before the jam.

  **Method:**
  - **Step 1.1: Feature Listing** - As a group, list every feature that comes to mind for the theme. (e.g., for a puzzle game: grid size, movement rules, win condition, etc.)
  - **Step 1.2: Generate Terrible Variations** - For each feature, ask: "How could we make this terrible?" (e.g., "What if the grid was 1x1?" or "What if you couldn't move any tiles?") This forces the team to think about extremes and reveals the knobs by their extremes.
  - **Step 1.3: Name the Axes** - For each feature, define the knob (axis) by naming its range. (e.g., "Grid Size" from 1x1 to infinite, or "Player Control" from none to full.)
  - **Step 1.4: Look for Unnamed Knobs** - After the obvious ones, ask: "What are we assuming that we haven't named?" (e.g., in a puzzle game: the assumption that the puzzle is on a grid, or that the player has perfect information.) To find these, try to break the theme: "What if the puzzle wasn't on a grid?" or "What if the player only sees part of the board?" This often reveals frame knobs.

  **Output:** A list of knobs with names and example ranges.

  **Why this works:** Generating terrible variations forces the team to think beyond the typical and exposes the boundaries of the style-space. The unnamed knobs are often the ones that are so fundamental they are taken for granted.

  ---

  ### Part 2: Knob Classification (Step 2)

  **Goal:** Classify each knob as surface, structural, or frame.

  **Definitions:**
  - **Surface Knob**: Can be changed independently without affecting other knobs. Changing it doesn't require rethinking the core. (e.g., color scheme, sound effects, grid size in a simple match-3.)
  - **Structural Knob**: Changing it forces changes in other knobs. It is coupled to other elements. (e.g., changing from turn-based to real-time would force changes in input design, game pacing, etc.)
  - **Frame Knob**: Defines the theme's identity. Removing or fundamentally changing it makes the game a different genre or theme. (e.g., the existence of a grid in a grid-based puzzle, or the concept of "matching" in a match-3.)

  **Test for Classification (5-minute test):**
  1. **Change it slightly** - What happens to other knobs? If nothing, it might be surface.
  2. **Change it to an extreme** (e.g., set to zero or max) - Does the game break? If it breaks and requires reworking multiple systems to fix, it's structural. If the game becomes a completely different kind of game (e.g., not a puzzle anymore), it's frame.
  3. **Remove it entirely** - If the game is still recognizable as the theme, it's surface. If it becomes a different genre, it's frame. If it requires redesigning several features but the core remains, it's structural.

  **When the test doesn't settle it:**
  - If the classification is ambiguous (e.g., changing one knob breaks the game but in a way that could be fixed by adjusting one other knob), default to structural. Also, note that the same knob might be surface in one context and structural in another. In such cases, document the context and move on.

  ---

  ### Part 3: Creative Moves (Step 3)

  These are deliberate ways to explore the style-space. Each move is applied to a concept to generate variations.

  1. **Push one knob to an extreme**:
     - **For**: Discovering overlooked possibilities and breaking assumptions.
     - **Tends to produce**: Games that are minimalist, maximalist, or absurd. Can reveal hidden depth or show that a knob isn't as deep as thought.
     - **Example**: Set grid size to 100x100 in a match-3 -> might become a strategy game about area control.

  2. **Move a coupled cluster at once**:
     - **For**: When a structural knob change requires adjustments in related knobs. This avoids broken designs.
     - **Tends to produce**: Coherent variations that feel like a natural evolution of the theme.
     - **Example**: In a puzzle game, change from discrete turns to real-time (structural) and simultaneously adjust the input method (e.g., drag instead of tap) and scoring (time-based).

  3. **Delete a knob entirely**:
     - **For**: Simplification and focusing on core mechanics. Especially for knobs that are taken for granted.
     - **Tends to produce**: Radical simplifications or genre hybrids. Can reveal what is essential.
     - **Example**: Remove the grid from a match-3 -> becomes a free-form shape matching game.

  4. **Borrow a knob from an adjacent genre**:
     - **For**: Cross-pollination and innovation. Especially when the theme feels stagnant.
     - **Tends to produce**: Fresh takes that might attract new audiences but risk losing the thread.
     - **Example**: Take the "permadeath" knob from roguelikes and add it to a puzzle game.

  ---

  ### Part 4: Tests for Variations (Step 4)

  After generating a variation (concept), run these tests in order:

  1. **The Samey-but-New Test**:
     - **Detects**: Whether a knob was genuinely moved but the experience feels identical.
     - **Pass**: The change creates a noticeable difference in player experience (e.g., a new strategic consideration, a different emotional response).
     - **How to test**: Imagine playing it. Does the change force a new skill or decision? If not, it's samey. (e.g., changing the color of the tiles without changing the rules -> samey.)
     - **Failure mode**: Samey-but-new is bad because it wastes resources on a game that doesn't offer a new experience. For a small studio, this is worse because you can't afford to ship something that doesn't stand out.

  2. **The Lost-the-Thread Test**:
     - **Detects**: Whether the variation has become a different game without us noticing.
     - **Pass**: The core identity of the theme is preserved. Ask: "Is this still a [theme] game at heart?"
     - **How to test**: List the frame knobs of the theme. Are they still there? If not, it's lost the thread. (e.g., removing the grid from a grid-based puzzle -> lost the thread if the grid was a frame knob.)
     - **Failure mode**: Lost-the-thread is also bad, but it might lead to a good game in a different genre. For a small studio, it's risky because you might not have the expertise in the new genre, but it can also open new markets. However, it's less worse than samey because at least it's something new and might be fun. But it fails the goal of exploring the theme.

  **Which is worse?** For a studio of your size (small, focused on replayable puzzle games for mobile), **samey-but-new is worse**. Why? Because it doesn't add value and wastes the opportunity. Players won't see a reason to play it. Lost-the-thread might be a pivot, but it's a bigger risk. However, the procedure should prioritize avoiding samey because it's more insidious (you might not notice until after shipping).

  **Order of tests:**
  1. Samey-but-New Test: If it fails (i.e., the experience is identical), reject immediately. This is the worst outcome.
  2. Lost-the-Thread Test: If it fails, then we have a values decision (see below) because it might be a good idea in a different genre.

  ---

  ### Part 5: Decision Points (Step 5)

  **Where the procedure stops with a no:**
  - If a variation fails the Samey-but-New Test, it's an automatic no. (Because it's a waste of resources.)
  - If a variation fails the Lost-the-Thread Test, it doesn't get an automatic no. Instead, it escalates because it might be a good idea for a different kind of game.

  **Where it escalates to a person:**
  - When a variation fails the Lost-the-Thread Test, the question becomes: "Is this new direction worth pursuing given our studio's goals?" This is a values decision. Factors include:
    - Audience: Will our current audience follow? Can we reach a new audience?
    - Resources: Do we have the expertise to make this?
    - Brand: Does this fit the kind of games we want to be known for?
  - **Who decides?** The creative director (you) should make the call, but since the studio head signs off, you must present the reasoning and get their approval. So: you run the procedure, and if it escalates, you and the studio head decide together.

  ---

  ### Applying the Procedure to Three Concepts

  We must run the procedure on:
  1. **"Noughts"**: Match-three with no failure state. The board gets messier until you walk away.
  2. **"Folio"**: Tile-sliding puzzle with a hand-drawn bestiary and variable grid size per level.
  3. **"Errand"**: Daily word puzzle with roguelike elements (permadeath, drafting moves between attempts).

