answer: |-
  ### Creativity Procedure Based on Hofstadter's Model

  **Core Principle**: Creativity is deliberate exploration of a style-space through knob manipulation. Novelty emerges from extreme knob shifts, cluster adjustments, or cross-genre transplants—not random inspiration.

  ---

  ### 1. Knob Extraction (Pre-Jam)
  **Goal**: Name theme axes and identify invisible knobs.  
  **Method**:  
  - **Step 1.1**: Brainstorm 20 obvious theme features (e.g., "grid," "turns," "scoring").  
  - **Step 1.2**: For each feature, generate 3 *terrible variations* (e.g., "grid size = 1x1," "scoring disabled"). This exposes knobs by breaking norms.  
  - **Step 1.3**: Cluster features into knobs. Name each knob as a continuous axis (e.g., "Failure Strictness: 0 (no fail state) → 10 (instant death)").  
  - **Step 1.4**: Hunt unnamed knobs by asking: "What *can’t* we change without breaking everything?" (e.g., "Must players *intend* actions?").  

  **Why it works**: Terrible variations force confrontation with boundaries. Unnamed knobs emerge from constraints the team treats as immutable.  

  ---

  ### 2. Knob Classification  
  **Definitions**:  
  - **Surface Knob**: Independent adjustment. No ripple effects (e.g., "visual theme," "soundtrack").  
  - **Structural Knob**: Changes alter ≥2 other knobs (e.g., "turn-based → real-time" forces UI/input redesign).  
  - **Frame Knob**: Defines the theme’s DNA. Removing it kills the theme (e.g., "matching mechanic" in match-3).  

  **5-Minute Test**:  
  1. **Isolate the knob**: Change only this knob.  
  2. **Observe effects**:  
     - *No dependencies?* → **Surface**  
     - *Breaks core systems?* → **Structural**  
     - *Theme unrecognizable?* → **Frame**  
  3. **Ambiguity protocol**: If unclear after 5 mins, default to **structural** (most common). Document uncertainty.  

  **Example**: "Grid size" in tile-sliding:  
  - Change to 2x2: Still playable → **Surface**  
  - Change to 100x100: Requires zoom/scroll mechanics → **Structural**  

  ---

  ### 3. Space-Search Moves  
  **Four Purposeful Moves**:  
  1. **Push to Extreme** (for hidden depth):  
     - *How*: Take one knob to min/max (e.g., "failure strictness = 0").  
     - *Yields*: Bold, polarizing concepts. Detects if a knob is shallow.  
  2. **Move Coupled Cluster** (for coherence):  
     - *How*: Shift ≥2 structural knobs that interdepend (e.g., "real-time + permadeath").  
     - *Yields*: Holistic innovations. Avoids broken designs.  
  3. **Delete Knob** (for radical simplicity):  
     - *How*: Remove a knob entirely (e.g., "no score system").  
     - *Yields*: Minimalist or genre-bending ideas. Reveals essentials.  
  4. **Borrow Knob** (for novelty injection):  
     - *How*: Import a knob from adjacent genre (e.g., "roguelike permadeath in puzzle").  
     - *Yields*: Fresh hybrids. High risk of losing the thread.  

  **Move Selection**: Use when jam concepts feel safe. Force at least one move per concept.  

  ---

  ### 4. Variation Tests  
  **Order**: Run sequentially. Fail fast.  

  1. **Samey-but-New Test** (Worse for small studios):  
     - *Detects*: Superficial changes (knob moved, experience identical).  
     - *Pass*: "Player verb changes" (e.g., from *planning* to *improvisation*).  
     - *Fail*: Automatic **rejection**. Wastes resources on reskins.  
     - *Confused with*: Iterative polish (which is post-prototype).  

  2. **Lost-the-Thread Test**:  
     - *Detects*: Theme drift (concept mutated into new genre).  
     - *Pass*: All frame knobs intact.  
     - *Fail*: Escalate to **values decision**. Might be worthwhile pivot.  
     - *Confused with*: Genre evolution (e.g., "roguelike puzzle" still a puzzle).  

  **Why Samey is Worse**: For a 9-person studio, samey games burn cycles without differentiation. Lost-the-thread at least explores new markets.  

  ---

  ### 5. Decision Boundaries  
  - **Automatic NO**: Fails Samey-but-New Test.  
  - **Escalate to Values**:  
    - Fails Lost-the-Thread Test, OR  
    - Passes tests but conflicts with studio pillars (e.g., "no monetization").  
  - **Who Decides**:  
    - Creative Director (you) assesses feasibility.  
    - Studio Head approves strategic bets (audience trade-offs, identity).  
  - **Output**: 3 prototypes max. Cut ruthlessly.  

  ---

  ### Case Studies: Last Quarter’s Sheets  
  **Theme**: "Puzzle Mechanics Reborn"  
  **Frame Knobs**: Goal clarity, input simplicity, replayability.  

  #### 1. "Noughts" (Match-3 with no failure)  
  - **Knobs Moved**:  
    - *Failure Strictness*: Pushed to 0 (extreme move).  
    - *Player Agency*: Added "messiness accumulation" (coupled cluster).  
  - **Tests**:  
    - Samey-but-New: **Pass**. Changes player verb from *risk-avoidance* to *chaos management*.  
    - Lost-the-Thread: **Pass**. Frame knobs intact (clear goal, simple input).  
  - **Verdict**: **PROTOTYPE** (procedure).  
  - **Escalation**: Studio Head’s "not a game" concern is values-based. Procedure says *yes*, but Head must approve.  

  #### 2. "Folio" (Reskinned tile-slider)  
  - **Knobs Moved**:  
    - *Visual Theme* (surface): Changed to bestiary.  
    - *Grid Size* (surface): Made variable.  
  - **Tests**:  
    - Samey-but-New: **FAIL**. Player verb identical (*spatial planning*). Feels like DLC.  
    - Lost-the-Thread: Not run (failed previous test).  
  - **Verdict**: **REJECT** (procedure). Gut feeling confirmed.  

  #### 3. "Errand" (Roguelike word puzzle)  
  - **Knobs Moved**:  
    - *Progression System* (structural): Borrowed permadeath/deckbuilding.  
    - *Session Structure* (frame): Changed from daily to run-based.  
  - **Tests**:  
    - Samey-but-New: **Pass**. New verb: *meta-strategy* over runs.  
    - Lost-the-Thread: **FAIL**. Frame knob "session structure" altered. Not a daily puzzle.  
  - **Verdict**: **ESCALATE** (procedure).  
  - **Judgment Call**: Is "roguelike puzzle" within studio identity? Creative Director assesses feasibility; Studio Head decides audience trade-off.  

  **Procedure vs. Judgment**:  
  - Folio’s rejection is pure procedure.  
  - Noughts’ approval is procedure, but escalation is judgment.  
  - Errand’s escalation is procedure; final call is values judgment.  

  ---

  ### Where It Misfires  
  1. **Pre-Jam Knob List Shrinks Space**:  
     - **Confirmed risk**. Mitigate by:  
       - Revisiting knobs *after* the jam.  
       - Allowing 20% "wildcard" concepts that ignore the list.  
  2. **Ignores Fun/Timeliness**:  
     - **Killed**. The procedure:  
       - *Refuses* to judge fun (prototypes exist for this).  
       - *Flags* "boring" via Samey-but-New test.  
       - Values escalation covers "well-timed" (e.g., "Is this trend worth chasing?").  
  3. **Other Limits**:  
     - Overlooks execution complexity (e.g., "AI companion" knob may be infeasible).  
     - Struggles with emergent knobs (e.g., "emergent narrative" in procedural games).  

