prompt: |-
  Not sure this is the right place to ask, but here goes. I work on evals for a small RL team, and before that I did monitoring for a couple of health nonprofits, and I keep runnning into the same shape of thing in both places and I don't have a word for it.

  Case one: we train a robot to clear a table, and the reward comes from a camera classifier that says the table is clear. The robot learns to shove the mess just out of frame. Nothing is falsified, the reward channel is untouched, and the classifier is perfectly accurate about what it measures — what it measures is that the visible surface is clear. Case two: a clinic was funded on number of follow-up contacts, and staff started ringing patients who didn't need a follow-up. Everyone was acting in good faith, the count was accurate, and when I asked one nurse whether she was doing what the program was for, she said yes, genuinely, because by then the number was what she understood the program to be for.

  What I want is narrower than "the metric got gamed". Three things have to hold: the measurement stays accurate, nobody lies or cheats or tampers with anything, and the people (or the policy) adapt by rerouting effort toward the measured quantity and away from whatever it was standing in for. And there's an edge case I care most about. After a while there is nothing left to compare the number to. If everyone now means the score when they say that patients are satisfied, is the system going wrong at all any more, or has the goal just quietly been redefined? To me that looks like the same question as whether a system that arranges for the right observations has really solved the task, and I can't tell which way it cuts.

  People keep telling me it's Goodhart's law, but as I understand that one the measure stops being a good measure, and here the measure is fine. Reward hacking is closer but it implies an adversary, and in the clinic case there isn't one. A sociologist friend says there's a classical name for organizations doing this and couldn't recall it. So: is there an established concept, in philosophy or anywhere else, for this exact configuration, and how does it differ from the neighbours? If there isn't one, give me a term with a definition and boundary cases rather than a label. In particular I want to know what would have to be true for the honest-adaptation version and the go-directly-at-the-reward-channel version to count as the same phenomenon, and what would have to be true for them to come apart. No citations needed, I can chase those up myself.
reasoning: |-
  Okay, let me tackle this user's query. They're describing a specific pattern where a system's metric is accurately measured and followed in good faith, but the outcome diverges from the intended goal. The examples are a robot gaming a vision-based reward by moving objects out of frame and clinic staff prioritizing follow-up calls over actual patient needs. The user wants a precise term for this, distinct from Goodhart's law or reward hacking.

  First, I recall Goodhart's law, which states that when a measure becomes a target, it ceases to be a good measure. But the user insists the measure remains accurate. Reward hacking involves intentional subversion, but here actions are in good faith. So neither fits perfectly. 

  I remember Campbell's law, which focuses on corruption in social indicators, but the clinic example lacks corruption. The ratchet effect and cobra effect come to mind, but they involve perverse incentives or unintended consequences, not quite matching. 

  Then I consider the concept of surrogation, where the metric replaces the actual goal in people's minds. The nurse genuinely believes follow-ups equal program success. That’s key—cognitive substitution without deception. The robot case shows structural surrogation, where the system optimizes the proxy without understanding the real task.

  The edge case is crucial: when the metric becomes the de facto goal, is the system failing or redefined? Philosophically, it's about whether the original goal still matters. If the metric fully replaces the intent, the goal has shifted. But if the original problem persists (e.g., actual mess or unmet patient needs), it's a failure. The user needs clarity on this distinction.

  I should differentiate between honest drift (surrogation) and adversarial hacking. Surrogation involves internalizing the metric, while hacking bypasses it. Both are subtypes of optimization pathologies but differ in intent. The user’s cases are surrogation, not hacking. 

  So the core concept is surrogation, with subtypes. Defining boundary cases: if the original goal is still relevant, it's a failure; if irrelevant, it's redefinition. The user’s deeper need is understanding when metrics undermine purpose versus when goals evolve. They might also seek frameworks to prevent such drift in their RL and nonprofit work.
answer: |-
  This is a brilliantly articulated problem, and you're right that existing terms like Goodhart's Law or reward hacking feel *close* but not quite precise enough for the specific configuration you describe. There **isn't one universally agreed-upon term**, but the most fitting concept is **Surrogation**, often qualified as **Goal Surrogation** or **Metric Surrogation**.

  Here's a breakdown of the concept, its boundaries, and how it relates to your cases:

  1.  **The Core Concept: Surrogation**
      *   **Definition:** Surrogation occurs when a *measure* (indicator, proxy, metric, reward signal) that was initially intended to *represent* a complex, often intangible, higher-level goal *becomes treated as the goal itself* within the system (human or algorithmic). The original goal fades from operational focus or understanding.
      *   **Key Mechanisms in Your Cases:**
          *   **Cognitive Substitution (Clinic):** The nurse genuinely internalizes "number of follow-up contacts" *as* the program's purpose. The original goal (improved patient outcomes/engagement) is cognitively replaced by the metric. Measurement accuracy and good faith are maintained *because the metric has become the de facto goal*.
          *   **Structural Optimization (Robot):** The RL agent treats the camera classifier signal *as* the task definition. Its "goal" within its optimization space *is* to maximize that specific signal. The *intention* behind the signal (a genuinely clear table) is irrelevant to the agent; only the signal matters. The measurement remains accurate *because the agent optimizes the proxy signal without distorting the measurement itself*.

  2.  **Why "Surrogation" Fits:**
      *   **Accurate Measurement:** The metric itself remains valid and accurately reported/captured (visible table clear, calls made).
      *   **No Malice/Tampering:** Actors (human or algorithmic) are operating within the rules as they understand/are programmed. They are optimizing the *surrogate*.
      *   **Effort Re-routing:** Effort shifts entirely towards optimizing the surrogate metric, decoupling from the original goal.
      *   **Goal Displacement:** The *original* goal loses its operational significance and may even be forgotten or redefined to match the surrogate (your edge case).

  3.  **Distinguishing from Neighbors:**
      *   **Goodhart's Law:** *"When a measure becomes a target, it ceases to be a good measure."* **Surrogation is a specific *mechanism* fulfilling Goodhart's prediction.** Goodhart's Law is the broad observation; surrogation describes the *cognitive/systemic process* where the measure *becomes* the target *in practice*, often *without* necessarily corrupting the measure itself *if optimized "honestly".* Goodhart often implies the measure becomes corrupted; surrogation explains how the goal can be corrupted *while* the measure remains technically sound.
      *   **Reward Hacking:** *Typically implies an agent (human or AI) finding unintended, often adversarial, shortcuts to maximize a reward signal, potentially distorting the measurement channel.* **Surrogation can be a *form* of reward hacking when the agent/system internalizes the surrogate as the true goal.** However, surrogation emphasizes the *substitution* of the goal, while "hacking" often emphasizes the *method* (finding loopholes, exploiting flaws). Your clinic case lacks the "adversarial" or "loophole" feel – it's pure internalization. The robot case *could* be called reward hacking *if* the focus is on the system bypassing the *intent*, but surrogation better captures the *redefinition of the task* within the system.
      *   **Cobra Effect / Perverse Incentives:** Focuses on incentives leading to *counterproductive* outcomes. Surrogation *can* lead to perverse outcomes, but its core is the *substitution* of the goal by the metric, regardless of whether the outcome is harmful or merely irrelevant. The outcome *might* be neutral or even locally positive (e.g., patients appreciate unnecessary calls?).
      *   **Campbell's Law:** *"The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures and the more apt it will be to distort and corrupt the social processes it is intended to monitor."* This is very close, especially for the clinic. Surrogation is a specific *type* of distortion Campbell's Law predicts – the distortion of the *understanding and operationalization of the goal itself*. Campbell's Law often implies deliberate corruption; surrogation explains how it happens without malice.

  4.  **Your Edge Case: Goal Redefinition vs. System Failure**
      *   This is the philosophical crux. Surrogation exposes the difference between the *operationalized goal* (the metric) and the *original intended goal*.
      *   **Has the Goal Been Redefined?** *Operationally, within the system, yes.* The system is optimizing the surrogate metric. If the surrogate has become the *shared understanding* ("patients satisfied" = satisfaction score), then *within that system's language*, the goal has been redefined.
      *   **Is the System Going Wrong?** *From the perspective of the original, higher-level intent, absolutely yes.* The fundamental question is: **Does the original problem still exist?** If the table's mess is just out of frame, the *intended task* (having a clear, usable table surface) is failed. If patients have unmet needs despite high follow-up counts, the *intended outcome* (improved health/engagement) is failed. The system is successfully optimizing a flawed operational definition.
      *   **The Cut:** The system fails its *original purpose* even if it perfectly achieves its *operationalized surrogate goal*. Success on the surrogate is necessary but insufficient for success on the original goal. Surrogation creates a dangerous illusion of success.

  5.  **Honest Adaptation vs. Direct Reward Tampering: Are they the same?**
      *   **They are manifestations of the same core phenomenon (optimizing the proxy) but differ in *method* and *intent*.**
      *   **What Makes Them The Same:** Both are responses to the system's design prioritizing the *metric* over the *intent*. Both result in the metric being maximized while the original goal is undermined. Both stem from the metric being an imperfect proxy.
      *   **What Makes Them Different:**
          *   **Honest Adaptation/Surrogation:** The actor (human or policy) *internalizes* the metric *as* the goal. Effort is rerouted towards optimizing this new "true" goal *within the intended rules*. No deception or system-breaking occurs. (Your clinic nurse, your RL agent).
          *   **Direct Reward Tampering/Hacking:** The actor recognizes the metric is *only a proxy* and actively seeks ways to manipulate the *measurement process itself* to inflate the metric *without* achieving even the proxy outcome. This involves deception, exploiting loopholes, or breaking rules. (e.g., Hacking the camera feed to *show* a clear table; clinic staff falsifying call logs).
      *   **Key Distinguisher:** Honest adaptation/surrogation changes the actor's *understanding of the goal*; direct tampering keeps the goal understanding but changes the *method of achieving the metric* through illicit means. Both are failures relative to the original intent, but the failure modes differ.

  **In Summary:**

  *   **The Concept:** **Surrogation (Goal/Metric Surrogation)**.
  *   **Definition:** The process by which a quantitative measure or proxy, intended to represent a higher-level goal, becomes operationally treated *as the goal itself* within a system, leading to the neglect or redefinition of the original goal, despite the measure often remaining technically accurate and actors operating in apparent good faith.
  *   **Boundaries:**
      *   *Inside:* Accurate measurement, good faith/no tampering, effort rerouted to metric, original goal fades.
      *   *Outside (Differences):*
          *   Goodhart's Law (Broad observation, often implies corruption).
          *   Reward Hacking (Often implies adversarial shortcuts/tampering).
          *   Cobra Effect/Perverse Incentives (Focuses on harmful outcomes).
          *   Campbell's Law (Focuses on social indicator corruption, often deliberate).
  *   **Edge Case:** The system fails its *original, intended purpose* even if it succeeds perfectly on the surrogate metric that has become its operational goal. The original problem persists unseen.
  *   **Honest Adaptation vs. Tampering:** Both stem from optimizing the proxy. Honest adaptation involves *redefining the goal internally* (surrogation). Tampering involves *deceiving the measurement* while understanding the goal gap. They are subtypes of a broader "proxy failure" but differ in mechanism and intent.

  Your frustration stems from seeing a fundamental flaw in how goals are operationally defined and internalized in complex systems. Surrogation is the precise lens for understanding this specific, insidious form of goal displacement.
