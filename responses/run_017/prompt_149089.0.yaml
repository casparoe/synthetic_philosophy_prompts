answer: |-
  Below is a complete, runnable activity plan for your seminar. It incorporates your core goals, improves on your initial setup, and includes detailed scripting, materials, and contingencies. The activity is designed for **75 minutes** with **18 students**.

  ---

  ### **Materials & Prep**
  - **Alternatives:** Four concrete budget options (e.g., A: Pizza party, B: Donate to charity, C: Buy books for the department, D: Save for next year).  
  - **Voting materials:** 
    - 18 envelopes (for sealed sincere ballots). 
    - Index cards (5 per student: 1 for Round 0, 4 for voting rounds). 
    - Whiteboard markers (different colors for rules/tallies). 
    - Tally sheets (see templates below). 
  - **Facilitator tools:** 
    - Pre-generated preference profiles (in case students collude or preferences are unanimous). 
    - Backup rules (Borda, plurality, approval) if students propose overly complex rules.  
  - **Setup:** Write alternatives (A, B, C, D) on the whiteboard. Arrange chairs in a semicircle for discussion.

  ---

  ### **Activity Timeline**  
  **Total: 75 minutes**  

  #### **Round 0: Sincere Ballots (5 min)**  
  - **Script:** *"We have four ways to spend a small budget. On your index card, rank them 1st to 4th (no ties). This is your *true* preference. Seal it in an envelope with your name. I’ll keep it secret until the end."*  
  - **Action:** Collect envelopes. Stress: *"This is the only time you vote truthfully—no strategy yet!"*  

  #### **Rounds 1–3: Voting Rule Experiments (40 min, ~13 min/round)**  
  **Rules:** Students propose/revise a rule at the start of each round. Rules must be computable by hand in <3 min.  
  - **Round 1:** Start with student proposals (e.g., "Most 1st-place votes wins"). If none, use **plurality**.  
  - **Round 2:** Students revise (e.g., "Rank alternatives, award 4 pts for 1st, 3 for 2nd, etc.—Borda count").  
  - **Round 3:** Final revision (e.g., "Instant runoff: eliminate lowest 1st-place vote-getter, redistribute").  
  - **Voting process per round:**  
    1. Write rule on whiteboard.  
    2. Students vote *strategically* on index cards (any ballot allowed: ranking, scores, etc.).  
    3. Facilitator tallies publicly (example tally sheet):  

  | Ballot | Ranking/Score | Notes       |  
  |--------|--------------|-------------|  
  | 1      | A > C > B > D |             |  
  | 2      | B (only)     | Plurality   |  
  | ...    | ...          |             |  
  | **Winner:** | B            |             |  

    4. Record winner on board. *Never reveal who voted how.*  

  #### **Escape Routes Testing (20 min)**  
  Test 3 workarounds *experientially*. No lectures—just quick votes:  
  1. **Two alternatives** (5 min):  
     - *Script:* *"Cut to two options: A and B. Majority vote—most votes wins."*  
     - Students vote on cards (A or B). Tally instantly.  
     - *Debrief hook:* *"Did anyone need to lie? Probably not—with two options, it’s safe to be honest."*  

  2. **Single-peaked preferences** (7 min):  
     - *Script:* *"Impose an order: Pizza (A) < Books (C) < Charity (B) < Save (D). Now, imagine your preferences have a single 'peak' (e.g., you like nearby options more). Vote by reporting your peak only—I’ll find the median."*  
     - Students report one peak (e.g., "C"). Order votes: A,A,C,C,C,B,B,D,D → median = C.  
     - *Debrief hook:* *"If preferences align like this, no one gains by lying."*  

  3. **Random ballot + side payments** (8 min):  
     - *Script:* *"I’ll pick one ballot randomly—its top choice wins. But if you hate the outcome, I’ll let you *bribe* others. If you lose, write what you’d pay the winner to change their vote (e.g., 'Pay $5 to A-voters if B wins')."*  
     - Vote: Students submit top choice. Draw one ballot randomly.  
     - *Side payments:* Ask losers to propose bribes. Do not execute—just discuss feasibility.  
     - *Debrief hook:* *"Randomness reduces lying, but side payments are messy—would you trust others?"*  

  #### **Debrief (10 min)**  
  1. **Reveal sealed ballots & compare outcomes:**  
     - For each round, compute:  
       - *Sincere outcome* (using Round 0 ballots + rule).  
       - *Strategic outcome* (from the round’s actual vote).  
     - Identify students who gained/lost by lying (e.g., "In Round 1, if everyone was honest, A would’ve won—but B won because you lied. Who here ranked A > B? You lost out.").  

  2. **Map to Gibbard-Satterthwaite:**  
     - *Conditions we hit:*  
       - ≥3 alternatives → incentives to lie emerged.  
       - Unrestricted domain → all rankings allowed.  
       - Unanimity → if a rule ignored a unanimous top choice, students would notice.  
       - No dictator → no one controlled outcomes alone.  
     - *What we didn’t show:*  
       - One profile isn’t proof. The theorem says *some* profile always allows manipulation.  
       - We used rankings, not cardinal utilities—intensity might change incentives.  

  3. **Provocative twist:**  
     - Highlight a round where *sincere voting produced a worse outcome* (e.g., "In Round 2, if you all voted honestly, D would’ve won—but by lying, you got B. Most of you prefer B > D! Is strategy-proofness always good?").  

  ---

  ### **What Will Go Wrong (And How to Adapt)**  
  1. **Students treat Round 0 strategically:**  
     - *Mitigation:* Emphasize stakes ("This budget is real!") and remind them envelopes are sealed. If suspicion arises, use a pre-generated preference profile.  

  2. **Real stakes too small:**  
     - *Mitigation:* Make alternatives visceral (e.g., "Pizza vs. charity: your vote decides"). If energy lags, say: *"If this were healthcare policy, would you care more?"*  

  3. **Overly complex rules:**  
     - *Mitigation:* Cap rule proposals at 2 min. If a rule is uncomputable (e.g., Kemeny-Young), veto it: *"We have 60 seconds—simplify or pick a backup."* Use Borda or approval voting.  

  4. **Time shortfall:**  
     - *Mitigation:* Skip Round 3 if needed. For escape routes, drop side payments (do random ballot only).  

  ---

  ### **Where I’m Least Confident**  
  1. **Strategy-proofness of randomized rules:**  
     - I assert random ballot is strategy-proof because it’s a lottery over dictators (voters have no incentive to misreport top choice). **But:** Are there strategy-proof *non*-random-dictator rules? I’m unsure.  
     - *Check with a theorist:* Confirm random ballot is strategy-proof and whether other randomized rules (e.g., proportional lotteries) satisfy it under ordinal preferences.  

  2. **Single-peaked escape route:**  
     - I assume median voting is strategy-proof under enforced single-peakedness. **But:** If preferences aren’t single-peaked, can students gain by misreporting their peak? Likely yes, but the activity forces the domain restriction.  
     - *Pilot this first:* Test the single-peaked round with colleagues to see if incentives truly vanish.  

  3. **Side payments:**  
     - Allowing cardinal utilities/compensation *should* induce truth-telling (à la VCG), but with no real money, students won’t engage seriously.  
     - *Recommendation:* Skip side payments if time is tight—use random ballot only.  

  ---

  ### **Why This Works**  
  - **Discovery-focused:** Students *feel* manipulation incentives (gains/losses) before hearing the theorem.  
  - **Escape routes tested, not described:** They experience domain restriction (single-peaked), randomization, and cardinality firsthand.  
  - **Critical twist:** By seeing a case where lying improves outcomes, they debate if strategy-proofness is inherently desirable.  
  - **Honest debrief:** Explicitly separates what the activity shows (possibility of manipulation) from what it doesn’t (universality, cardinal welfare).  

