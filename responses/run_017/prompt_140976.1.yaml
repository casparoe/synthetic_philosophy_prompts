  ### Decision Procedure for Bounded Quantities with No Data  
  **Purpose**: Assign a defensible probability to a bounded quantity when only a range is known, using the principle of indifference cautiously, and flag cases where output is unreliable.  

  ---

  #### **Step 1: Gate**  
  *Analyst Action*: Check for any of the following conditions. Proceed only if none apply.  
  - **Base rate/historical analogue available**: **Stop**. Use existing data; indifference is invalid.  
  - **Quantity is a count with known denominator**: **Stop**. Use binomial/binomial-like model.  
  - **Bounds are soft estimates (not hard constraints)**: **Downgrade output** (multiply final sensitivity figure by 1.5), but proceed.  
  - **Number already published for same quantity**: **Stop**. Consistency trumps indifference; use published value.  
  *Formal Gloss*: Eliminate cases where external information or structural constraints exist. Judgment: Assess bound hardness and publication status.  

  ---

  #### **Step 2: Mechanism Step**  
  *Analyst Action*: Describe the physical/generating process of the quantity. Classify as:  
  - **Additive (A)**: Quantity results from accumulating *additive increments* (e.g., days in a process with sequential steps). Use **uniform on original scale**.  
  - **Multiplicative (M)**: Quantity results from *compounding* or is a *ratio* of additive quantities (e.g., shares, rates). Use **uniform on log scale** (for positive quantities) or **log-odds scale** (for proportions).  
  - **Unknown (U)**: Genuinely unclear mechanism. Proceed with **both A and M parameterizations**.  
  *Why?*: Indifference is not preserved under rescaling; the generating process dictates the "symmetric" scale.  
  *Formal Gloss*: Map the process to a scale where indifference is coherent. Judgment: Characterize the mechanism.  

  ---

  #### **Step 3: Symmetry Tests**  
  *Analyst Action*: Apply these tests to eliminate incompatible parameterizations:  
  1. **Complement test (for proportions only)**:  
     - Reparameterize the quantity as its complement (e.g., fraud share → non-fraud share).  
     - If the complement’s bounds are *not symmetric* with the original (e.g., fraud ∈ [5%, 40%] → non-fraud ∈ [60%, 95%], but [5,40] vs. [60,95] are asymmetric), **eliminate odds parameterization**.  
     - *Surviving parameterizations*: Uniform (linear) and log-odds.  
  2. **Affine test**:  
     - If the quantity can be re-expressed via an *affine transformation* (e.g., \(x \to ax + b\)), all parameterizations are coherent. **No elimination needed**.  
  *Settled*: Complement test refutes odds (not log-odds). Affine transformations (e.g., Celsius to Fahrenheit) are safe.  
  *Formal Gloss*: Test consistency under reparameterization to eliminate incoherent scales.  

  ---

  #### **Step 4: Future Evidence Scale (Tiebreaker)**  
  *Analyst Action*: If multiple parameterizations survive Step 3, choose the scale where future data would *combine additively* in a model:  
  - For **proportions**: Log-odds (binomial data → logistic regression).  
  - For **rates/durations**: Log scale (Poisson/exponential data → GLMs).  
  - For **other quantities**: Skip.  
  *Scope*: Use only as tiebreaker; discard if mechanism is well-specified (Step 2).  
  *Formal Gloss*: Conjugate priors guide indifference on the natural parameter scale. Judgment: Expected data structure.  

  ---

  #### **Step 5: Output Format**  
  *Analyst Action*:  
  1. **Compute the probability** for each surviving parameterization.  
  2. **Calculate sensitivity figure**: \( \text{max}(P) - \text{min}(P) \) across parameterizations. Apply ×1.5 multiplier if downgraded in Step 1.  
  3. **Decision rule**:  
     - If sensitivity figure **straddles the decision threshold** (e.g., threshold = 30%, and \( \text{min}(P) \leq 0.3 \leq \text{max}(P) \)):  
       - **Refuse point estimate**. Output:  
         > *"Estimate not decision-grade. Probability range: [min, max]. Threshold [X] is within range. Gather: [Cheapest info]."*  
       - Rank information-gathering by cost (cheapest first):  
         1. Literature/base-rate search.  
         2. Small internal pilot sample (e.g., 20–50 records).  
         3. Expert consultation (if budget allows).  
     - Else, output the **mean of probabilities** across surviving parameterizations.  

  *Formal Gloss*: Report probability or range; refuse if sensitivity straddles threshold. Judgment: Info-gathering cost ranking.  

  ---

  ### **What the Procedure Cannot Do**  
  - Handle multivariate quantities.  
  - Incorporate partial or subjective data (beyond bounds).  
  - Resolve fundamental paradoxes (e.g., Bertrand-style) without mechanism clarity.  

  ---

  ### **Calibration: Bertrand’s Chord Paradox**  
  - **Problem**: Probability a random chord in a circle exceeds the inscribed triangle’s side.  
  - **Procedure Outcome**:  
    - Gate: Proceeds (no data, hard bounds [0, diameter]).  
    - Mechanism: **Unknown** (no process specified → U).  
    - Symmetry: No eliminations (not a proportion).  
    - Output: **Refusal** (sensitivity straddles common thresholds, e.g., 1/3 vs. 1/2).  
  - **Verdict**: Licenses **none** of the standard answers; aligns with paradox’s indeterminacy.  

  ---

  ### **Most Critical Step**  
  - **Step 2 (Mechanism Step)**:  
    - **Why**: Determines the indifference scale. Without it, parameterization arbitrariness induces high sensitivity → refusal.  
    - **If removed**: All candidate parameterizations used → inflated sensitivity → frequent refusals.  

  ---

  ### **Application to Cases**  

  #### **Case 1: Fraud Share**  
  - **Bounds**: 5%–40%. **Question**: \( P(\text{share} > 25\%) > 30\% \)?  
  - **Steps**:  
    1. Gate: Proceed (no base rate, not a count, hard bounds, unpublished).  
    2. Mechanism: **U** (unknown → use uniform and log-odds).  
    3. Symmetry: Complement test → **eliminates odds** (asymmetric bounds). Uniform and log-odds survive.  
    4. Future evidence: Log-odds (tiebreaker for proportions).  
    5. Output:  
       - Uniform (linear): \( P = (40 - 25) / (40 - 5) = 15/35 \approx 0.4286 \).  
       - Log-odds:  
         - Logit bounds: \( \text{logit}(0.05) \approx -2.94 \), \( \text{logit}(0.40) \approx -0.41 \).  
         - \( P(\text{share} > 0.25) = [\text{logit}(0.40) - \text{logit}(0.25)] / [\text{logit}(0.40) - \text{logit}(0.05)] \approx 0.273 \).  
       - Sensitivity: \( 0.4286 - 0.273 = 0.1556 \).  
       - Threshold: 30% (0.30). Straddles? **Yes** (0.273 < 0.30 < 0.429).  
       - **Output**:  
         > *Estimate not decision-grade. Probability range: [0.27, 0.43]. Threshold 0.30 is within range. Gather: 1. Literature search (fraud in similar cohorts); 2. Sample 20 claims for fraud indicators.*  

  ---

  #### **Case 2: Notification-to-First-Payment Interval**  
  - **Bounds**: 3–40 days. **Question**: \( P(\text{days} > 14) \).  
  - **Run 1 (Additive Mechanism)**:  
    - Mechanism: **A** (e.g., "days = sum of processing steps"). → Uniform on linear scale.  
    - \( P = (40 - 14) / (40 - 3) = 26/37 \approx 0.7027 \).  
    - Output: **0.70** (sensitivity = 0).  

  - **Run 2 (Multiplicative Mechanism)**:  
    - Mechanism: **M** (e.g., "delays compound multiplicatively"). → Uniform on log scale.  
    - Log bounds: \( \ln(3) \approx 1.10 \), \( \ln(40) \approx 3.69 \).  
    - \( P(\text{days} > 14) = [\ln(40) - \ln(14)] / [\ln(40) - \ln(3)] \approx 0.405 \).  
    - Output: **0.41** (sensitivity = 0).  

  - **Actuary Demand**: Evidence for **multiplicative mechanism**. Additive is default for time; multiplicative requires proof (e.g., "each substage’s delay scales the total").  

  ---

  #### **Case 3: Refusal Case (Loss Ratio Threshold)**  
  - **Scenario**: Loss ratio for a new product. Bounds: 60%–150% (soft estimates). **Question**: \( P(\text{loss ratio} < 100\%) \).  
  - **Steps**:  
    1. Gate: **Downgrade** (soft bounds → sensitivity ×1.5). Proceed.  
    2. Mechanism: **U** (unknown → use uniform and log-uniform).  
    3. Symmetry: No eliminations (not a proportion).  
    4. Output:  
       - Uniform (linear): \( P = (100 - 60) / (150 - 60) = 40/90 \approx 0.444 \).  
       - Log-uniform:  
         - Log bounds: \( \ln(0.60) \approx -0.51 \), \( \ln(1.50) \approx 0.41 \).  
         - \( P(\text{ratio} < 1) = [0 - (-0.51)] / [0.41 - (-0.51)] \approx 0.557 \).  
       - Sensitivity (pre-downgrade): \( 0.557 - 0.444 = 0.113 \).  
       - Post-downgrade: \( 0.113 \times 1.5 = 0.170 \).  
       - Threshold: 50% (0.50). Straddles? **Yes** (0.444 < 0.50 < 0.557).  
       - **Output**:  
         > *Estimate not decision-grade. Probability range: [0.44, 0.56] (downgraded for soft bounds). Threshold 0.50 is within range. Gather: 1. Literature search (similar products); 2. Pilot launch with 100 policies.*  

  ---

  ### **Final Notes**  
  - **Judgment Points**: Gate (bound hardness, publication), Mechanism, Info-gathering cost ranking.  
  - **Analyst Defense**: Document rationale for mechanism choice and gate outcome.  
  - **Reviewer Gloss**: One-line formal tags (e.g., "Gate: Base rate → Stop"; "Mechanism: A → Uniform").  

  This procedure balances defensibility and pragmatism, defaulting to refusal when sensitivity undermines decisions. Step 2 (Mechanism) is the linchpin—without it, the procedure collapses into guesswork.
