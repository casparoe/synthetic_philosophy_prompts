  For desiderata, I'm considering these non-negotiables: the theory must account for lucid dream signaling (since it demonstrates conscious control during sleep), respect the subject's first-person authority when they claim experiential continuity (like the cued narrative case), and explain behavioral evidence without recall (as in night terrors). The theory should also remain neutral on whether dreams resemble waking perception - that's a camp-specific prejudice.

