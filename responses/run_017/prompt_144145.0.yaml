  The user has provided three vivid examples: the seminar pause, the copied email, and the minutes reading. What's fascinating is how these behaviors persist despite everyone knowing they're pointless, with that subtle social pressure to conform remaining intact. The user wants me to avoid common explanations like lock-in effects, false beliefs about others' endorsement, sanctions, or mere habit.

  Let me mentally scan through relevant concepts. Lewis's conventions require an underlying coordination problem, which these lack now. Norms typically involve enforcement mechanisms absent here. Customs might fit superficially but don't capture the normative residue. The term "ritual" comes close but is too broad. "Inertial practice" captures the persistence but not the normativity. "Zombie norm" is tempting - dead but still walking - but might be too metaphorical for academic use.

  Looking deeper, this seems related to what some call "empty practices" or "vestigial norms," but I'm not sure these fully capture the peculiar normative charge. The evolutionary theory of norms might frame this as a case where the "normative signaling" function persists even when the original coordination purpose is gone. People still react to deviations because the behavior has become a signal of group membership or respect, even if unconsciously.

  For classification in Lewis's framework, I'd argue these are "convention-remnants" - the behavioral shell remains after the coordination equilibrium has dissolved. The expectations have become decoupled from their original justification but retain normative force through path-dependence.

  Regarding the boundary with repurposed practices, the key distinction lies in whether the behavior currently functions to solve any social problem. We'd need to look for evidence of new coordination benefits or signaling functions that have emerged. If the pause now genuinely coordinates question-asking or signals respect, it's been repurposed; if not, it's purely vestigial.

  Since no perfect term exists, I should coin something precise. "Vestigial convention" seems most accurate - emphasizing both the residual structure and the lost function. For evidence of true normativity, we'd look for people offering justifications beyond surprise, or the persistence of disapproval even when the deviation is expected.

  The user clearly needs this for academic writing, so I'll define it rigorously: a behavioral regularity that was once a convention, persists after the coordination problem disappeared, retains a normative residue making deviation seem inappropriate without enforcement mechanisms, and where participants are aware of its pointlessness. Hard cases: a lapsed dress code with lingering disapproval (inside) versus automatically saying "bless you" without any expectation (outside).
answer: |-
  Based on your carefully described cases and constraints, here is a systematic analysis:

  ### 1. Does this have a name in the literature?
  **Answer:** No single established term fits perfectly, but the phenomenon sits at the intersection of several concepts. Crucially, it is *not* a convention in the Lewisian sense, nor a norm in standard game-theoretic/evolutionary accounts. Here's why nearby concepts fail:

  *   **Lewisian Convention:** Fails because it requires a *coordination problem* where conformity is mutually beneficial and expectations are interdependent. Your cases lack the underlying problem; the regularity no longer coordinates anything (as you note). Lewis's account requires the equilibrium to be *arbitrary but functional*; here, it's functionless.
  *   **Social Norm (Bicchieri-style):** Fails because norms require conditional preferences ("I prefer to conform if I believe enough others conform and expect me to") and sanctions for deviation. Your cases lack sanctions and the mild disapproval isn't aimed at enforcement. People conform without believing others *expect* it for functional reasons.
  *   **Custom/Tradition:** Too broad. Customs encompass habitual practices without implying normativity. Your cases have the normative residue ("abrupt," "disrespectful," "we just do it") that mere custom lacks.
  *   **Inertia/Path Dependence:** Describes persistence but not the *normative charge*. Path dependence explains *why* it persists, not why deviation feels inappropriate.
  *   **Ritual:** Tempting, as rituals often persist without original function and carry symbolic weight. However, rituals usually have explicit symbolic meaning or sacred quality. Your cases lack this; the pause isn't *symbolizing* anything specific anymore, it's just "how it's done."
  *   **Vestigial Practice/Institution (Sociology/Anthropology):** Closest descriptive label, but not a tightly defined technical term in social ontology/norm theory. It captures the persistence of a functionless structure but often underemphasizes the specific, faint normative residue you identify.

  **Conclusion:** Your cases represent a distinct phenomenon – **a behavioral regularity that persists after the dissolution of its original coordinating function, yet retains a residual, low-intensity normative force making unilateral deviation feel mildly inappropriate or requiring excuse, despite common knowledge of its functional irrelevance and the absence of sanctions or enforcement mechanisms.** While "vestigial norm" or "inertial practice" might be used descriptively, no precise technical term exists in the core literature you cite. This is likely because the phenomenon falls *between* categories: it lacks the functional core of a convention/norm but retains a ghost of its normative structure.

  ### 2. Classification within Lewis-style Apparatus
  *   **Strict Reading:** On a strict Lewisian view, these are **no longer conventions.** The defining coordination problem is gone, so the regularity isn't an equilibrium solution to *any* recurrent interaction problem. They resemble mere "behavioral regularities" or perhaps parallel "customs," but this classification ignores the residue.
  *   **The Difficulty:** This *is* a genuine difficulty for a naive functionalist reading of Lewis. It highlights that the *expectational structure* and associated normative tinge can outlive the *functional justification* that originally sustained the equilibrium. The apparatus struggles because it ties the normative expectations intrinsically to solving a coordination problem.
  *   **Resources within the Apparatus:**
      *   **Expectations Outliving Function:** Lewis acknowledges expectations can be self-sustaining (pp. 42-43), but primarily within a functional context. The apparatus *can* model the persistence of expectations ("everyone expects everyone to pause") even after the reason for the expectation vanishes. However, Lewis doesn't fully explore the *normative* implications of this persistence when decoupled from function.
      *   **Precedent & Salience:** The original convention established salience. Continuing the practice is salient simply *because* it was done before, providing a focal point for behavior even without a problem to solve. The "residue" could be seen as an expectation rooted in precedent, not current function.
      *   **Limitation:** The key missing piece is explaining the *normative* residue ("ought," "abrupt," "disrespectful") emerging from inert expectations. Lewis focuses on expectations as predictors, not necessarily as sources of normativity *sui generis*. The apparatus explains *persistence* but struggles with the *normative charge* persisting independently.

  **Conclusion:** The Lewisian apparatus can explain the *persistence of the behavioral regularity* via self-sustaining expectations and precedent/salience. However, it lacks the resources to fully explain the *persistence of the faint normative force* ("oughtness") attached to the regularity once its functional justification evaporates. This exposes a potential gap in strictly functionalist accounts of norms/conventions.

  ### 3. Boundary: Vestigial vs. Repurposed Regularity
  This is crucial. Whether the pause is purely vestigial or repurposed depends entirely on whether it **currently functions to solve a coordination problem or fulfill a social function.**

  *   **Same Phenomenon Continuing (Purely Vestigial):** The pause persists *only* due to inertia and the normative residue of its past convention status. It solves no current problem. The feeling of "respect" invoked when justifying it is an *ex post facto rationalization* of the residue, not evidence of a new function. The shrug ("we just do it") signals this lack of current function.
  *   **Different Phenomenon (Repurposed Shell):** The pause now genuinely coordinates a *new* interaction – e.g., it signals when open discussion begins, manages turn-taking among juniors, or serves as a ritual marker of "serious academic engagement" that fosters group cohesion. The "respect" feeling is now causally linked to a *current* social function.
  *   **How to Tell Them Apart (Empirically):**
      1.  **Observe Consequences of Deviation:** Does omitting the pause *actually* cause new coordination failures (e.g., chaotic question-asking, perceived lack of decorum impacting discussion quality)? If yes, it's likely repurposed. If the only consequence is mild disapproval *of the act itself* ("abrupt"), it's likely vestigial.
      2.  **Identify Latent Functions:** Does the regularity *currently* reduce anxiety, signal membership, manage uncertainty, or reinforce group identity *in a way that participants would miss if it stopped*? If abolishing it would create a *new*, identifiable social awkwardness or problem *beyond* just "feeling wrong," it's repurposed.
      3.  **Analyze Justifications:** Are justifications ("it's respectful") *coupled with explanations of what respect achieves functionally now* ("it sets the tone," "shows we're attentive")? Or are they circular/empty ("it's just respectful")? The latter suggests vestigiality.
      4.  **Test Unanimous Dislike (See Below):** If the practice is unanimously disliked yet the residue persists *and* deviation still causes the mild disapproval, it strongly suggests vestigiality. A repurposed convention would likely dissolve if unanimously disliked (unless there are hidden benefits or coercion).

  **From the Inside:** Both feel identical initially because the behavioral pattern and the initial normative reaction ("abrupt") are the same. The difference lies in whether the practice is *currently* embedded in a functional social structure. Informants might use similar language ("respectful") in both cases. The key is probing *why* it's considered respectful *now* and whether stopping it would have tangible negative consequences *beyond* the mild disapproval.

  ### 4. Coining a Term & Definition
  **Term:** **Vestigial Convention**

  **Definition:**
  A behavioral regularity R is a **vestigial convention** within group G if and only if:
  1.  **Historical Convention:** R was previously a Lewisian convention in G, solving a specific coordination problem P.
  2.  **Functional Irrelevance:** P no longer exists or is no longer solved by R, and this is common knowledge in G. R currently solves no significant coordination problem or fulfills no essential social function for G.
  3.  **Persistent Expectation & Conformity:** Members of G generally conform to R, and each member expects others to conform, primarily because R was previously established ("precedent").
  4.  **Residual Normativity:** Unilateral deviation from R, even when harmless and functionally irrelevant, is widely perceived within G as mildly inappropriate, requiring an excuse, or as a minor breach of propriety, eliciting low-intensity reactions (e.g., faint disapproval, descriptions like "abrupt," "odd," "not how it's done").
  5.  **Non-Enforcement:** Reactions to deviation are not aimed at, nor effective for, changing the deviator's future behavior or enforcing conformity (they are expressive, not instrumental). There are no significant sanctions attached to deviation.
  6.  **Reflective Awareness:** Members of G are generally aware that R is functionally unnecessary (satisfying condition 2).

  **Hard Cases at the Margin:**
  *   **Just Inside:** *The Lapsed Dress Code:* A workplace had a strict "formal Friday" convention solving a coordination problem about client-facing image. Client interactions moved entirely online, making the dress code irrelevant (CK). People still mostly dress formally on Fridays. A new hire wears jeans. Several colleagues privately mention it feels "a bit sloppy" or "unprofessional," though they admit it doesn't matter anymore. No one tells the new hire to change. *(Fits: History, Irrelevance (CK), Conformity/Expectation, Residual Normativity (mild inappropiateness), Non-Enforcement, Awareness)*.
  *   **Just Outside:** *The Automatic "Bless You":* People in a group consistently say "bless you" after sneezes due to historical convention (originally warding off spirits/solving discomfort). Everyone knows it's functionally irrelevant (CK). Most still do it reflexively. Someone stops saying it. Others notice, maybe feel a momentary flicker of "huh," but no sense of inappropriateness, no description like "rude," no expectation of an excuse. It's just an omitted habitual nicety. *(Fails: Lacks Residual Normativity. The reaction is mere startlement, not normative disapproval.)*.

  **Evidence for Normative Residue (vs. Mere Startlement):**
  *   **Language:** Descriptions using normative terms ("should," "ought," "abrupt," "disrespectful," "not done," "inappropriate") rather than just surprise ("unexpected," "odd," "different").
  *   **Excuse Requirement:** The sense that a deviator *needs* an excuse ("Sorry, I just jumped in!"), even if a trivial one, rather than just an explanation ("Oh, I didn't think it mattered").
  *   **Persistence Despite Dislike:** See below.
  *   **Reaction Focus:** Disapproval is directed at the *act* of deviation itself as a minor transgression, rather than just confusion about the *actor's* motive or state of knowledge.

  **Prediction for Unanimous Dislike + Persisting Residue:**
  Your definition predicts this is **possible and even characteristic** of a vestigial convention. If everyone dislikes the practice (e.g., finds the seminar pause annoying, the minutes reading tedious) but the residual normativity persists:
  1.  People will still conform (due to expectation and precedent).
  2.  Deviation will *still* elicit the mild normative reaction ("abrupt," "disrespectful").
  3.  Attempts to abolish it collectively might fail *because* the residue imbues the practice with a sense of propriety that makes abolishing it feel like condoning impropriety, even if disliked ("disrespectful to the process").
  4.  **Evidence for Normativity:** The persistence of the *reaction* despite unanimous dislike is strong evidence the residue is genuinely normative. If it were mere startlement at the unexpected, the reaction should fade once deviation is expected or understood. Normative disapproval can persist independently of liking the rule itself (cf. some traffic laws).

  In essence, a **vestigial convention** is the ghost of a coordination solution, persisting as a normatively charged behavioral fossil, held in place by precedent, expectation, and a faint, self-sustaining echo of "oughtness" detached from its original purpose. Your cases exemplify this phenomenon beautifully.
