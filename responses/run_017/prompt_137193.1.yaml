  ### The Joke
  **Setup:**  
  Right, so Thomson's lamp: flick it infinitely fast in two minutes, ends up neither on nor off. My version? The ln-2 lamp. Starts off, same schedule, but it’s on a dimmer. First flick adds full brightness, second subtracts half, third adds a third, fourth subtracts a quarter, and so on. Converges neatly to 69% on. Thomson reckoned "half-on" was nonsense, but this lamp’s perfectly happy at 69%.  

  **Punchline:**  
  Until you realise those brightness nudges are conditionally convergent. So two electricians wire it up identically—same parts, same nudges—but one follows the manual’s order and gets 69%. The other, bit of a maverick, rearranges the flicks and ends up at 20%. Neither’s faulty, neither’s sacked. Just the universe admitting: "Brightness? Yeah, that’s a you problem."

