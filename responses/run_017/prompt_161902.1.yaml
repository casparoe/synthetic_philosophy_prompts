prompt: |-
  I'm on the five-person board of our union's hardship fund — members chip in 1% of wages, we vote on claims, and the only written guidance is one line in the bylaws about helping members with misfortunes they didn't bring on themselves. No rubric, just precedent, and we argue it out in the meeting. Our record so far:

  - Marta, born with a congenital condition, $40k surgery. Paid in full. Nobody even argued.
  - Dev, pack-a-day smoker since he was 18, lung cancer. Denied.
  - Priya, never smoked, same cancer, radon in co-op housing the co-op never fixed. Paid in full.
  - Ines, celiac, asked for the difference between normal and gluten-free groceries. Paid the difference, not the whole bill.
  - Tomas, says he can't be happy without single malt and opera tickets. Denied — the minutes call it a taste, not a need.
  - Sam, quit a steady job to start a food truck in a city with a well-publicized 60% failure rate, folded in 14 months. Denied.
  - Yusuf, took a job at the mill, the only employer within commuting distance, hurt when a cable snapped. Paid in full, one dissent.
  - Grace, walking home from a late shift through a dark stretch to save bus fare, hit by a drunk driver. Paid in full — the board's line was that the driver's choice, not hers, is what hurt her.

  New claim, and it's a messier one. Marisol, 52. Twenty years ago she chose house painting over two other jobs she'd been offered — better pay, and she liked it. Solvent exposure carries a documented elevated risk of chronic illness and she knew that; but the number she'd have been quoted at the time, and the one on the safety sheet she signed, was an average, computed from a study sample that happened to include nobody with her profile. Two years ago she was diagnosed with a rare genetic enzyme deficiency she's had since birth, undetectable by any test that existed before 2019, not caused by anything she did. It doesn't cause illness on its own; what it does is turn the exposure level that would have given an ordinary painter a mild, reversible condition into irreversible kidney failure. All the exposure that mattered happened before the diagnosis, so quitting then wouldn't have helped — though I garantee somebody on the board will make a lot of the fact that she kept painting for another year after her doctor told her to stop, because retraining at 52 with her mortgage would've cost her about a third of her income and she'd probably have lost the house. She also says two things that fit together awkwardly: that she'd take the job again, and that if she'd known her own odds were ten times the average she wouldn't have.

  So: full denial, full payment, or something like paying only the gap between the mild condition she seems to have been gambling on and the kidney failure she actually got? What I really want is the rules we'd be committing to, not just the outcome — give me the two or three principles that fit all eight precedents and come apart here, say which precedent is the closest analog, and tell me what we'd be adopting either way. Also, is there a further case that would actually tell those principles apart? I suspect that's where the real disagreement lives. And if how finely you describe the gamble she accepted turns out to matter — painting-with-elevated-solvent-risk versus a small shot at a mild reversible condition — say so, because I think that's doing more work in my own thinking than I've admitted. I know there's a whole literature on this general shape of thing, chosen versus unchosen and so on, but I don't need the reading list; I need something I can say out loud on Tuesday. Please flag which parts are settled among people who actually work on this and which are live fights — I don't want to walk in quoting a contested view as though it were received wisdom.
reasoning: |-
  Okay, the user is on a five-person union board managing a hardship fund. They need to decide on a new claim from Marisol, who developed kidney failure due to solvent exposure in her painting job, complicated by a rare genetic enzyme deficiency. The user wants clear principles that align with past decisions and guidance on how to handle this messy case.

  First, I need to review the precedents. There's a pattern here: claims are approved when the misfortune is seen as unchosen or externally imposed. Marta's congenital condition was approved because she didn't cause it. Priya's cancer was linked to radon exposure from her housing, which she couldn't control. Yusuf's injury was due to equipment failure at work. Grace was hit by a drunk driver, and the board focused on the driver's choice, not hers. 

  Denials happen when the board views the harm as self-inflicted. Dev was denied because his smoking was a known risk. Tomas was denied luxuries. Sam's business failure was seen as a voluntary risk. Ines got partial payment because her gluten-free needs were necessary, but not the whole grocery bill. 

  Marisol's case is tricky. She chose her job knowing the average risks, but her genetic condition amplified the solvent's effect. She kept working after diagnosis due to financial pressures. The user is concerned about how to frame the gamble she took—was it accepting a small risk of a mild condition or something more? 

  The key principles from precedents seem to be: 1) Harm must be unchosen, 2) Informed choices leading to foreseeable harm aren't covered, and 3) Partial payment for necessary, not avoidable, costs. 

  Marisol's case tests Principle 2 because the risk she faced was much higher than she knew. The genetic condition was unchosen, but the solvent exposure was a choice. This is similar to Dev, but Dev's risk was common knowledge. Marisol's risk was unknowable until the test existed. 

  The user needs to present this as two competing principles: whether the fund covers unforeseeable consequences of chosen actions. Priya's case is the closest precedent—her cancer was caused by an external factor (radon) she couldn't control, similar to Marisol's genetic condition. But Marisol's job choice complicates it. 

  The user should propose partial payment, covering costs related to the kidney failure beyond the mild condition. This aligns with Ines's case where they paid the difference for gluten-free food. It avoids punishing her for the genetic condition but acknowledges her choice to work with solvents. 

  To distinguish principles, consider a hypothetical: if someone with a genetic heart condition takes a high-stress job knowing general risks but not their specific vulnerability, and has a heart attack. If the fund covers that, it aligns with Marisol's case. If not, it's stricter. 

  The contested point is whether "unforeseeable amplification of risk" changes responsibility. Some may argue she gambled with known risks, others that the genetic condition was the true cause. The user should present both views without claiming consensus. 

  The recommendation is partial payment based on necessity and proportionality, framing the solvent exposure as chosen but the genetic risk as unchosen. This balances the precedents and offers a defensible position for the board.
answer: |-
  Here's a principled framework based on your precedents, applied to Marisol's case, highlighting where the live disagreements lie:

  ### Core Principles Derived from Precedents
  1.  **The "Unchosen Misfortune" Principle:** The fund helps with harms *imposed* on the member, not harms *chosen* through avoidable, foreseeable risk or discretionary spending. (Marta, Priya, Yusuf, Grace vs. Dev, Tomas, Sam).
  2.  **The "Reasonable Avoidability" Principle:** Members are expected to avoid reasonably foreseeable and significant risks they control. Failure to do so negates coverage. (Dev, Sam vs. Grace, where avoidance wasn't deemed reasonable).
  3.  **The "Necessity & Proportionality" Principle:** Aid covers essential needs arising from the misfortune, not luxuries or avoidable costs, and is proportional to the unchosen nature of the harm. (Ines: difference paid, not whole bill; Tomas: luxuries denied).

  ### Applying Principles to Marisol
  *   **Kidney Failure Itself:** This is overwhelmingly an **unchosen misfortune**. The genetic deficiency was present at birth, undetectable until recently, and *caused* the solvent exposure to become devastating. **Analog:** Marta (congenital condition). *Not* analogous to Dev (chosen, known high-risk behavior).
  *   **The Solvent Exposure:** This was **chosen**. She knew a general, averaged risk existed. She chose painting for better pay/liking it. **Analog:** Sam (chosen business risk) & Dev (chosen health risk).
  *   **The Gap Between Known Risk & Actual Harm:** This is the **crux**. She accepted a gamble on a *mild, reversible* condition based on *average* risk data. She got *severe, irreversible failure* due to an *unknown, unchosen* factor (genetics). The *nature* of the harm she risked (mild/reversible) is vastly different from the harm she suffered (severe/irreversible).
  *   **Continuing Work After Diagnosis:** This complicates "Reasonable Avoidability." While quitting earlier wouldn't have prevented the harm (all exposure pre-diagnosis), continuing *after* diagnosis knowing her specific vulnerability weakens her claim. **Analog:** Weakly analogous to Dev continuing to smoke (known risk), but Dev's risk was common knowledge; Marisol's specific risk was *newly* known only to her. Her financial hardship argument mirrors Grace's "dark stretch" reasoning (avoidance deemed unreasonable due to cost).

  ### The Closest Analog: Priya
  *   **Why:** Both involve an external, unchosen factor (Radon / Genetic Deficiency) turning an environment (Housing / Workplace) toxic in a way that was *unforeseeable* to *them specifically*. Priya didn't choose the radon; Marisol didn't choose the genetics that amplified the risk. Both harms stemmed primarily from external, unchosen causes interacting with their environment.

  ### Recommendation: Partial Payment (The "Gap" Option)
  *   **Justification:** Adheres to all three principles best:
      1.  **Unchosen Misfortune:** The *severe kidney failure* resulting from the *interaction* of solvent exposure and her *unchosen* genetic condition is the core misfortune. Covering costs directly related to *this* severe condition (dialysis, transplant, associated essential care) acknowledges this.
      2.  **Reasonable Avoidability:** She *did* choose a job with known solvent risks. The fund shouldn't cover costs equivalent to the *mild, reversible* condition she knowingly gambled on. Denying coverage for *that hypothetical mild condition* respects her choice.
      3.  **Necessity & Proportionality:** Covering the *gap* between the costs of the mild condition she risked and the severe condition she actually suffers focuses aid on the *essential, unchosen excess burden*. It doesn't cover the entire "cost of being a painter," nor does it punish her for the genetics.
  *   **Acknowledges the Nuance:** This explicitly recognizes that the gamble she *accepted* ("painting-with-elevated-solvent-risk-posing-a-small-chance-of-mild-reversible-condition") is fundamentally different from the harm she *suffered* ("severe-irreversible-kidney-failure-due-to-unchosen-genetic-amplification").
  *   **Addresses Continued Work:** While problematic, the key exposure was pre-diagnosis. The partial payment focuses on the core harm caused then. Her post-diagnosis choice could be a factor in *how much* of the gap is covered (e.g., covering 80% of the gap cost rather than 100%), but shouldn't trigger a full denial.

  ### The Live Fight & Distinguishing Cases
  *   **The Core Disagreement:** Is the harm primarily **the consequence of her chosen risk-taking (like Dev/Sam)**, or is it primarily **an unchosen biological vulnerability activated by her work (like Marta/Priya)?** Your principles pull in both directions.
      *   **View 1 (Denial/Framework: Chosen Risk):** She chose a risky job. The genetic quirk is unfortunate, but doesn't change that the *harm mechanism* (solvent exposure) was chosen. The fund shouldn't bail out predictable consequences of career choices, even with bad luck. (*Closest Precedent: Dev, Sam*). **Settled?** *No, this is contested.*
      *   **View 2 (Full Payment/Framework: Unchosen Vulnerability):** The *cause* of the severe harm is the genetic deficiency. The solvent exposure was merely the trigger in a way unforeseeable *to her*. She suffered the kind of bizarre, unchosen biological misfortune the fund exists for. (*Closest Precedent: Marta, Priya*). **Settled?** *No, this is contested.*
  *   **Distinguishing Case:** Imagine **Alex**. Alex has a strong *family history* of a specific rare heart condition triggered by extreme stress. They knowingly take a notoriously high-stress job (e.g., ER doctor, commodities trader). They suffer the exact heart condition their family is prone to.
      *   **Applies Principle 1 (Chosen Risk):** Alex *knew* their specific elevated risk (family history) and chose the high-stress job anyway. Denial. (Analogous to applying the "Chosen Risk" view to Marisol).
      *   **Applies Principle 2 (Unchosen Vulnerability):** The heart condition was genetic (unchosen), the job stress was just the trigger. Payment. (Analogous to applying the "Unchosen Vulnerability" view to Marisol).
      *   **This case clearly pits "known specific elevated risk + choice" against "unchosen biological vulnerability."** It shows where the two principles governing Marisol's case truly diverge. Marisol's case sits *between* Alex and Priya because her *specific* risk was unknowable at the time of exposure.

  ### What to Say on Tuesday
  1.  **Frame the Issue:** "Marisol's case forces us to decide: Is this primarily about her *choice* to work with solvents knowing *average* risks, or is it about an *unchosen* genetic condition that turned a common workplace hazard into a catastrophe? Both elements are present."
  2.  **State the Principles:** "Our past decisions show we cover unchosen misfortunes (Marta, Priya, Yusuf, Grace), not consequences of avoidable choices (Dev, Tomas, Sam), and we pay for necessities proportionally (Ines)."
  3.  **Highlight Priya as Key Analog:** "Like Priya's radon, Marisol's genetic deficiency was an unchosen, hidden factor that made her environment toxic in a way she couldn't foresee."
  4.  **Propose Partial Payment (Gap):** "A full denial ignores the unchosen genetic blow. Full payment ignores her choice to work with solvents. The fairest path is covering the *excess burden* caused by her genetics – the costs of the severe kidney failure *beyond* what the mild condition she knowingly risked would have cost. This respects her choice while addressing the unchosen catastrophe."
  5.  **Acknowledge the Disagreement:** "Reasonable people can see this differently. Some will focus on her job choice like Dev or Sam. Others will focus on the genetics like Marta or Priya. The 'gap' approach is an attempt to balance these valid perspectives based on our precedent of proportionality with Ines."
  6.  **Flag the Framing:** "How we describe her initial gamble matters hugely. If we call it 'choosing painting,' denial seems right. If we call it 'unknowingly gambling with ten times the risk,' payment seems right. The truth is nuanced: she knowingly took a *small, averaged risk of a mild harm*, but suffered a *massive, specific risk of a severe harm* due to biology. The 'gap' reflects that nuance."

  The "gap" solution isn't perfect logistically (estimating the hypothetical mild condition cost is messy), but it best navigates the conflicting principles within your precedent while focusing aid on the truly unchosen severity of her misfortune. Be prepared for vigorous debate on whether the genetics or the solvent choice is the dominant cause.
