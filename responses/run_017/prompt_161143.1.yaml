  ## Present Value

  The paper waits. Its due date glows next week,  
  a gentle hill beneath a patient sun.  
  My mind is clear, the reasoned path I seek:  
  *First draft tonight*, the focused work begun.  
  This future self, serene and unopposed,  
  agrees the cost of haste outweighs the gain.  
  A steady pace is logically disposed  
  to finish strong, escaping deadline strain.  
  **But nearer things have weight that pulls the mind.**

  Tomorrow's run? A virtuous design  
  inked firmly on the morning's open square.  
  This future stride will lift me, make me shine.  
  The snooze button seems distant, light as air.  
  Next week's calm choice feels strangely thin and pale  
  against the warmth still pooled here in my bed.  
  **But nearer things have weight that pulls the mind.**  
  *Ten minutes more?* Tomorrow's self instead...

  Tonight, the wine. The bottle waits, uncurled,  
  a promise deep and rich, a liquid gleam.  
  That paper's hill now feels a steepened world;  
  the run? A chore caught in a fading dream.  
  **But nearer things have weight that pulls the mind.**  
  **But nearer things...** That glass would taste so kind.  
  (I saw this shift would come, erased the app  
  where orders flowed with just a fingertap.)  
  My phone lies dormant, purchased peace maintained...  
  ...though on the countertop, a corkscrew waits,  
  and fingers hover where its form is chained.  
  **But nearer things have weight that pulls the mind.**

  ---

  **Notes on Execution:**

  *   **Refrain Spacing:** Appears first after 8 lines, then after 4 lines (line 12), then after 2 lines (line 14), then twice within the final quatrain (lines 15 & 16), and finally in the last line (line 20). This visually and rhythmically crowds the refrain.
  *   **Sophisticated Agent:** The speaker anticipates the reversal ("I saw this shift would come") and implements a precommitment ("erased the app... phone lies dormant").
  *   **Small Stakes, Shifting Nearness:** The choices (paper, run, wine) remain constant; only their temporal proximity changes, driving the value reversal.
  *   **Concrete Details:** Deleted app, chained corkscrew, phone dormant, countertop, hovering fingers.
  *   **No Morals/Real Self:** Focuses purely on the shifting valuation ("weight that pulls the mind"). The ending ("fingers hover") shows the precommitment *straining* but not necessarily broken, leaving the outcome ambiguous and highlighting the ongoing tension. The final line hammers the core mechanism.
  *   **Modelling Discounting:** The accelerating refrain directly mirrors hyperbolic discounting's steepening curve for immediate rewards. A constant discounter *would* keep the refrain evenly spaced.
  *   **No Verdict:** The poem ends with the lure immediate and visceral ("corkscrew waits," "fingers hover"), the precommitment a physical barrier ("chained"), and the hyperbolic pull undeniable ("weight that pulls the mind"). There's no judgment, only the stark presentation of the psychological mechanism in action.
