answer: |-
  Below is a diagnostic quiz designed to sort individuals into ethical positions based on their responses to everyday scenarios involving collective harms. The quiz uses 10 questions (7 core scenarios plus 3 follow-ups for nuance) to map onto key distinctions in ethical reasoning. It distinguishes views based on **consequences** (e.g., expected harm reduction), **participation/complicity**, **universalization**, **virtue**, and **no obligation**. Special attention is given to:  
  - A scenario where an act widens outcome variance without changing expected harm (Q5).  
  - A scenario with capped harm (Q4).  
  - Positions include: act consequentialism (AC), rule consequentialism/universalization (U), complicity/participation (C), virtue ethics (V), and no obligation (N).  

  The decision tree is built from the logical space of answers, with branches labeled by claims that separate views. Empty branches (incoherent/unattractive combinations) are noted.  

  ---

  ### **Diagnostic Quiz**  
  **Instructions**: For each scenario, choose the option that best reflects your view. Focus on your reasoning, not labels.  

  1. **Climate change**: You’re deciding whether to take a one-hour flight for vacation. The flight emits CO₂, but you know one flight won’t affect climate change. Do you have an obligation to avoid it?  
     - **A) Yes**—If everyone flew this much, climate change would accelerate.  
     - **B) Yes**—I don’t want to participate in harming the planet, even if my act changes nothing.  
     - **C) Yes**—There’s a tiny chance my flight tips the climate into catastrophe, and the stakes are too high to ignore.  
     - **D) No**—One flight makes no difference to the outcome.  

  2. **Voting**: You live in a district where elections are never close (your preferred candidate wins by 30%). Do you have an obligation to vote?  
     - **A) Yes**—If everyone like me didn’t vote, elections could swing unfairly.  
     - **B) Yes**—Voting is a civic duty; it’s about being a good citizen, not changing outcomes.  
     - **C) Yes**—There’s a tiny chance my vote is pivotal (e.g., a last-minute scandal), and the stakes justify it.  
     - **D) No**—My vote won’t affect the result.  

  3. **Industrial animal farming**: You consider buying a factory-farmed burger. Your purchase won’t affect demand or practices. Do you have an obligation to avoid it?  
     - **A) Yes**—If many people avoided these, the industry would change.  
     - **B) Yes**—Buying it makes me complicit in animal suffering.  
     - **C) Yes**—There’s a tiny chance my purchase causes one more animal to suffer.  
     - **D) No**—One burger changes nothing.  

  4. **Capped harm (special case)**: A petition to save a park needs exactly 1,000 signatures. You don’t know how many it has, but there’s a 1% chance it has 999. Signing takes 2 minutes. The park’s value is fixed ($1M) if saved. Do you have an obligation to sign?  
     - **A) Yes**—1% chance of saving the park (expected value = $10,000) justifies 2 minutes.  
     - **B) Yes**—If everyone in my position didn’t sign, petitions would fail.  
     - **C) Yes**—Signing shows I’m the kind of person who defends communities.  
     - **D) No**—1% is too small; I probably won’t be pivotal.  

  5. **Variance widening (special case)**: Your factory must choose between two production methods for a minor process. Both emit 10 tons of pollution on average, but:  
     - **Method X**: Always emits exactly 10 tons.  
     - **Method Y**: 50% chance of 0 tons, 50% chance of 20 tons (same average, wider variance).  
     Harm is linear (each ton causes $1K damage). Do you have an obligation to choose Method X?  
     - **A) Yes**—Method Y risks 20 tons, which is worse even if averages match.  
     - **B) Yes**—If everyone used high-variance methods, pollution extremes would destabilize ecosystems.  
     - **C) No**—Expected harm is identical, so it doesn’t matter.  
     - **D) No**—Harm comes from chance, not my choice; I’m not to blame for spikes.  

  6. **Sweatshop labor**: You consider buying a shirt made in a sweatshop. Your purchase won’t affect demand or labor conditions. Do you have an obligation to avoid it?  
     - **A) Yes**—If enough people boycotted, practices would improve.  
     - **B) Yes**—Buying it directly ties me to exploitation.  
     - **C) Yes**—It’s unvirtuous to ignore suffering for fashion.  
     - **D) No**—One shirt changes nothing.  

  7. **Group project fairness**: In a group project, most members slack off. Your effort won’t affect the grade (it’s too late). Do you have an obligation to contribute?  
     - **A) Yes**—If everyone slacked, the project would fail.  
     - **B) Yes**—It’s unfair to burden the few who are working hard.  
     - **C) Yes**—Doing your part reflects integrity, regardless of others.  
     - **D) No**—My effort won’t change the outcome.  

  ---

  ### **Follow-up Questions for Nuance**  
  These refine ambiguous answers from Q1–Q7. Answer only if directed by the scoring key.  

  8. **Recycling**: You’re unsure if your recycling bin will be properly processed (50% chance it ends in landfill). Recycling takes extra effort. Do you have an obligation to do it?  
     - **A) Yes**—If everyone recycled properly, systems would improve.  
     - **B) Yes**—Not recycling makes me part of the waste problem.  
     - **C) No**—Expected environmental benefit is too low to justify effort.  

  9. **Charity raffle**: A raffle donates $1 to charity per ticket, but the winner gets a fixed prize (your ticket won’t change total charity $). Do you have an obligation to buy a ticket?  
     - **A) Yes**—If no one bought tickets, charities would lose funding.  
     - **B) Yes**—Participating supports charitable causes.  
     - **C) No**—My ticket doesn’t change the charity’s total funds.  

  10. **Protest attendance**: A protest needs 10,000 people to sway policy. It has 9,999. You attending won’t change media coverage or outcomes. Do you have an obligation to attend?  
      - **A) Yes**—If everyone thought they weren’t needed, protests would fail.  
      - **B) Yes**—Attending aligns me with justice, regardless of impact.  
      - **C) No**—My presence makes no difference.  

  ---

  ### **Scoring Key & Decision Tree**  
  **How to score**:  
  - Tally your answers. The tree branches based on logical dependencies between claims.  
  - Positions:  
    - **AC (Act Consequentialism)**: Obligation exists if an act reduces *expected harm* (even via tiny chances).  
    - **U (Universalization)**: Obligation exists if harmful outcomes would occur if *enough/many* acted similarly.  
    - **C (Complicity/Participation)**: Obligation exists if the act *involves you in harm*, regardless of consequences.  
    - **V (Virtue Ethics)**: Obligation exists if the act reflects bad/good character (e.g., apathy vs. integrity).  
    - **N (No Obligation)**: No obligation; individual acts in collective harms are irrelevant.  

  **Decision Tree** (each branch label is the claim that splits views):  
  ```plaintext
  START: Does your act change the expected harm? (From Q1, Q3, Q4, Q5)  
  │
  ├─ IF YES (e.g., Q1C, Q3C, Q4A, Q5A) → ACT CONSEQUENTIALISM (AC) path.  
  │  │  Claim: "An act is obligatory if it reduces expected harm."  
  │  │  
  │  ├─ IF the harm is CAPPED (Q4A) → Pure AC (tiny chances matter, but stakes bounded).  
  │  └─ IF the harm is OPEN-ENDED (Q1C, Q3C) → AC with pivots (tiny chances scaled by high stakes).  
  │  
  ├─ IF NO → Does the act change outcomes if many do it? (From Q1A, Q2A, Q3A, Q4B, Q6A)  
  │  │  Claim: "An act is obligatory if harmful outcomes would occur if enough/many acted similarly."  
  │  │  
  │  ├─ IF YES → UNIVERSALIZATION (U) path.  
  │  │  │  Claim: "Collective harm stems from individual choices; I must not contribute."  
  │  │  │  
  │  │  ├─ IF you emphasize FAIRNESS (Q7B) → U + fairness (e.g., voting, group projects).  
  │  │  └─ IF not → Pure U (e.g., climate, farming).  
  │  │  
  │  └─ IF NO → Is the act about PARTICIPATION or CHARACTER? (From Q1B, Q2B, Q3B, Q6B, Q6C)  
  │     │  Claim: "Obligation arises from complicity in harm or virtuous character."  
  │     │  
  │     ├─ IF PARTICIPATION (Q1B, Q3B, Q6B) → COMPLICITY (C) path.  
  │     │     Claim: "Participating in harm makes me blameworthy, even if consequences are unchanged."  
  │     │  
  │     ├─ IF CHARACTER (Q2B, Q6C) → VIRTUE (V) path.  
  │     │     Claim: "Acts reflect who I am; I must cultivate virtues (e.g., civic duty, compassion)."  
  │     │  
  │     └─ IF NEITHER → NO OBLIGATION (N) path.  
  │          Claim: "No obligation exists if my act changes nothing."  
  │  
  └─ IF UNCERTAIN → Use follow-ups (Q8–Q10) to clarify:  
     │  
     ├─ If Q8A/Q9A/Q10A → U.  
     ├─ If Q8B/Q9B/Q10B → C or V (use Q6 to split: B→C, C→V).  
     └─ If Q8C/Q9C/Q10C → N.  
  ```

  #### **Mapping Answer Patterns to Positions**  
  | Position          | Key Answer Patterns                                  | Notes                                                                 |  
  |-------------------|------------------------------------------------------|-----------------------------------------------------------------------|  
  | **AC**            | Q1C, Q3C, Q4A, Q5A/C; Follow-ups: Q8C (if harm minor) | Focus: Expected harm reduction. Q5C confirms indifference to variance. |  
  | **U**             | Q1A, Q2A, Q3A, Q4B, Q6A, Q7A; Follow-ups: Q8A, Q9A  | Focus: "If many do it" outcomes. Q7B adds fairness emphasis.          |  
  | **C**             | Q1B, Q3B, Q6B, Q7B; Follow-ups: Q8B, Q10B           | Focus: Complicity in harm. Avoids U answers (e.g., not Q1A).          |  
  | **V**             | Q2B, Q4C, Q6C, Q7C; Follow-ups: Q9B, Q10B           | Focus: Character (e.g., "good citizen," integrity). Avoids C answers. |  
  | **N**             | Q1D, Q2D, Q3D, Q4D, Q5D, Q6D, Q7D; Follow-ups: Q8–10C | Focus: No difference, no obligation. Rejects all other reasoning.     |  

  #### **Empty Branches & Why**  
  - **AC + U + C/V mixes**: e.g., "Yes, I reduce expected harm (AC) AND my act is complicit (C)" → *Rarely chosen* because AC focuses on consequences, while C rejects consequence-based reasoning. Possible but unstable.  
  - **AC + N**: e.g., "My act reduces expected harm (AC), but I have no obligation (N)" → *Incoherent*; if you accept harm reduction matters, you can’t deny obligation.  
  - **High variance preference (Q5A) + N**: e.g., "I must avoid high variance (Q5A), but no obligation elsewhere (N)" → *Unattractive*; inconsistent concern about harm.  
  - **U + N**: e.g., "If many did it, harm would occur (U), but I have no obligation (N)" → *Incoherent*; U implies obligation.  

  #### **Indistinguishable Positions**  
  - **Complicity (C) vs. Virtue (V)** in non-character scenarios:  
    - Both say "yes" to obligations (e.g., avoiding burgers, recycling), but for different reasons (participation-in-harm vs. character).  
    - *Why?* They overlap in practice (e.g., Q6B and Q6C). Use Q2B (voting as duty) and Q7C (group project integrity) to tip toward V; use Q1B/Q3B (participation) for C.  
  - **Rule Consequentialism (U) vs. Kantian Universalization**:  
    - Both use "if everyone did it" reasoning (Q1A, Q2A).  
    - *Why?* They differ in motivation (rules vs. duty) but agree on actions in these cases.  
  - **AC with thresholds vs. N**:  
    - If someone accepts AC only when expected harm reduction is "large" (undefined), they may resemble N in low-stakes cases (e.g., recycling).  

  This quiz separates views by **empirical beliefs** (does my act change outcomes?) and **normative priorities** (consequences, participation, character). Use the tree to trace your answers to a leaf position. For mixed patterns, prioritize consistency in core scenarios (Q1–Q7).
