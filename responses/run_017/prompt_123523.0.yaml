answer: |-
  **MEMORANDUM**  
  To: Admissions Criteria Review Committee  
  From: Committee Chair  
  Date: 15 March 2024  
  Subject: Recommendation: Revised Implementation of Contextualized Behavior Inventory (CBI)  

  ### Introduction  
  This memo addresses our mandate to assess "personal character and integrity" in admissions, following the external reviewer’s critique of our current teacher recommendation letters. The Psychology Department’s proposed Contextualized Behavior Inventory (CBI) offers empirical advantages but raises conceptual and ethical concerns. After reviewing pilot data and philosophical implications, I recommend adopting a **revised CBI framework** with phased validation, targeting domain-specific judgment patterns rather than global traits.  

  ---

  ### The Case Against the Status Quo  
  Our current letters—relying on global adjectives like "honest" or "persevering"—were deemed "unreliable and possibly worse than random." The pilot study confirms this: **agreement across observers on any global trait was near zero**. Retaining them risks violating our mandate by using a tool with no demonstrable validity. While two colleagues argue teachers capture "something real," the data suggest these impressions lack predictive power for conduct violations and fail consistency checks. Nostalgia for holistic insight cannot override evidence of arbitrariness.  

  ---

  ### The Case Against the Proposed CBI  
  The CBI pilot revealed three critical insights:  
  1. **Near-zero cross-situational consistency** in traits (e.g., a student "persevering" in labs but not in dorms).  
  2. **High stability** in behavior within specific contexts (e.g., classroom punctuality).  
  3. **Specific behaviors in specific settings** (e.g., "negligence in lab protocols") predicted conduct violations better than any "character score."  

  However, the proposed CBI design credits candidates only when behaviors converge *across settings*—contradicting the pilot’s finding that such convergence is rare. This misalignment risks excluding contextually nuanced but ethically significant profiles (e.g., the 1-in-9 students with "split" virtues). Worse, it assumes virtues *should* be cross-situational—an assumption Aristotelian virtue ethics rejects. As I teach in my seminar, virtues are **reliable capacities for perception, judgment, and action within relevant domains**, not universal frequencies. Measuring "honesty" identically in family and lab settings ignores how practical wisdom (*phronesis*) adapts to context.  

  Additionally, my colleague’s concern about equity is urgent: if predictive behaviors (e.g., "compliance in supervised labs") are unequally observable (e.g., applicants without lab access), the CBI could bias against underrepresented groups.  

  ---

  ### A Middle Path: Domain-Relevant Character Assessment  
  I propose a **revised CBI** focused on **domain-specific judgment patterns** in settings material to honors college success:  
  1. **Academic Integrity** (classroom/lab): Assess consistency in citation, collaboration, and protocol adherence.  
  2. **Community Responsibility** (residence/service): Evaluate accountability in shared spaces or team roles.  
  3. **Intellectual Perseverance** (coursework/independent projects): Track sustained effort through challenges.  

  #### Key Revisions:  
  - **Observe only 3–4 settings** (not 6), prioritizing those universal to applicants (e.g., classroom + 1 elective: work, sport, or caregiving).  
  - **Drop cross-situational aggregation**. Score each domain independently (e.g., "reliable in academic settings," "constructive in community roles").  
  - **Require observable behaviors, not adjectives**. Prompts ask for concrete examples: *"Describe a time the applicant navigated a conflict in group work"* (not "Is this student kind?").  
  - **Pilot predictive validation**: Partner with Student Conduct Office to track if domain scores (e.g., low "academic integrity") correlate with later violations. Report results by 2026.  

  #### Why This Addresses Both Critiques:  
  - **To the psychologist**: It leverages the pilot’s finding that **within-setting behaviors are stable and predictive**. We avoid forcing spurious cross-context scores.  
  - **To the virtue ethicist**: It treats character as **situated practical wisdom**. We assess whether applicants show reliable judgment in *key domains of college life*, not an artificial "global" virtue.  
  - **To the equity critic**: Limiting settings to universal/elective contexts reduces bias. Family/paid-work observers are optional supplements.  

  ---

  ### The Strongest Objection: What About "Moral Depth"?  
  Two colleagues fear we lose the "moral essence" teacher letters purportedly capture. This is legitimate: a student might show impeccable academic integrity but profound selfishness in private. However, our mandate is to evaluate fitness for an *academic community*, not sainthood. The revised CBI targets virtues **material to honors college obligations**: intellectual rigor, collaborative ethics, and community stewardship. If private callousness never manifests in college-relevant settings, it is beyond our purview—and our policy’s intent.  

  ---

  ### Implementation Timeline  
  1. **AY 2024–25**: Implement revised CBI for 50% of applicants (randomized). Compare outcomes to teacher letters.  
  2. **March 2026**: Report validation data to the Dean. Adjust domains if predictive power is low.  
  3. **Full adoption by 2027** if domains show ≥0.4 correlation with conduct records.  

  ---

  ### Sample Rejection Notice  
  > *"After a thorough review, the Committee determined that your application did not meet our criteria for community responsibility. Specific feedback from multiple observers indicated repeated failures to meet shared commitments in team or residential settings, such as [example: neglecting agreed-upon tasks in group projects or dorm governance]. These behaviors suggest a pattern inconsistent with the collaborative accountability essential to our honors college. We encourage you to seek opportunities to develop these capacities before reapplying."*  

  ### Conclusion  
  Neither teacher letters nor the original CBI adequately measure character as our policy requires. The revised CBI accepts the data: virtues are often contextual, but their exercise in academic and communal domains *can* be reliably observed. It balances empirical rigor with ethical realism—and crucially, mitigates bias risks. I move that we recommend this model to the Dean.  

  **Vote deadline: 21 March, 5 PM.**  
  ---  
  *Approx. 890 words*
