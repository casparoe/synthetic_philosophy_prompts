answer: |-
  ## Joint Statement on AI Value Alignment: Aggregationist-Neutralist Adversarial Collaboration

  **Section 1: Agreed Claims**

  Both camps affirm the following substantive theses, rejecting significant alternatives:

  1.  **Fixed Denominator Requirement:** Any viable alignment proposal must specify *which beings* constitute the relevant population ("the denominator") possessing moral standing before applying any aggregation rule or restraint principle. (Denied by views claiming AI can serve "humanity" or "users" without defining membership criteria.)
  2.  **Non-Vacuous Silence:** System silence or abstention constitutes an action with distributive consequences, as outcomes default to the status quo ante or other decision processes, creating identifiable winners and losers. (Denied by views claiming silence is neutral or avoids moral responsibility.)
  3.  **Value Description-Dependence:** The granularity or specific description used for values, preferences, or doctrines within the system's model can materially influence the output of any aggregation procedure. (Denied by views claiming aggregation operates on fixed, pre-political "true" preferences independent of description.)
  4.  **Neutralism's Substantive Filter:** The criterion used within Neutralism to distinguish "reasonable" from "unreasonable" comprehensive doctrines (and thus trigger restraint) is itself a substantive normative choice, bearing structural similarities to the Aggregationist's choice of welfare weights. (Denied by views claiming reasonableness is purely procedural or objectively discernible without normative commitment.)
  5.  **Need for Interpersonal Comparability:** Both approaches fundamentally require some method to compare lives, welfare, or claims *across different persons*, whether conceived as cardinal utility (Aggregationism) or as relative reasonableness/compatibility (Neutralism). Neither camp possesses a fully satisfactory resolution to this core challenge. (Denied by views claiming moral decisions require only ordinal rankings or purely intra-personal comparisons.)
  6.  **Third-Party Effects Necessitate System-Wide Rules:** When an AI system's outputs affect individuals beyond the immediate user, neither serving the user's preferences nor simple market mechanisms suffice for alignment; a system-wide normative framework is required. (Denied by strict libertarian or pure user-agent views.)
  7.  **Procedural Fairness as Necessary But Insufficient:** Fair procedures (e.g., democratic deliberation, expert panels) are essential inputs for determining either the denominator, welfare weights (Aggregationism), or the bounds of reasonableness and the legitimacy of restraint/deference (Neutralism). However, neither camp believes fair procedures alone *constitute* the aligned output; they inform the system's governing normative rule. (Denied by views reducing alignment solely to procedural outputs.)
  8.  **Rejection of Evasions:** Both camps categorically reject majority vote, serving the payer, and systematic silence as adequate solutions for AI value alignment in pluralistic populations. (Denied by proponents of those specific positions.)

  **Section 2: Disagreements Table**

  | Crux                                                                 | Aggregationist Formulation (Signed by Aggregationist)                                                                                                  | Neutralist Formulation (Signed by Neutralist)                                                                                                                                             | Test / Case                                                                                               | Aggregationist Prediction                                                                                                 | Neutralist Prediction                                                                                                                                 | Verdict (Substantive/Verbal) |
  | :------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------ | :---------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------- |
  | **Is Neutralism itself a comprehensive doctrine?**                   | Neutralism's restraint rule constitutes a substantive, contestable doctrine about the good (prioritizing non-imposition over welfare gains), masquerading as neutrality. | Neutralism is a meta-ethical commitment to justificatory restraint concerning the good life, applicable only when doctrines are reasonable; it is not itself a competitor comprehensive doctrine. | **Case: Sex-Ed Curriculum:** Does teaching comprehensive sexual ethics violate neutrality?                | Neutralism will either impose its own contested view of permissible restraint or collapse into silence, harming students. | Neutralism correctly identifies teaching contested doctrines *as truth* as non-neutral; restraint allows factual info or deferral to legitimate procedure.          | **Substantive**              |
  | **Does Neutralism enable a "Heckler's Veto"?**                       | Neutralism grants de facto veto power to any group able to credibly claim a question implicates their contested doctrine, paralyzing the system.       | Neutralism requires a prior, procedurally fair determination of *reasonable* contestation; unreasonable demands don't trigger restraint. The veto problem stems from flawed reasonableness filters, not Neutralism itself. | **Case: Scarce Treatment:** Can groups object to allocation based on contested views (e.g., "God decides life/death")? | Any group citing doctrine can force abstention, defaulting to unfair offline queues.                                      | A robust reasonableness filter excludes doctrines rejecting secular justification or basic facts; allocation proceeds using non-doctrinal criteria. | **Substantive**              |
  | **Description-Dependence: Fatal flaw or manageable?**                | Description-dependence is a universal theoretical feature of aggregation but is mitigated in practice by stable social conventions defining relevant value categories. | Description-dependence is pervasive and easily exploited; aggregation's outcomes are fundamentally unstable under plausible re-descriptions of values, rendering it illegitimate. | **Case: Childbearing Choice:** Does framing the choice as "individual autonomy" vs. "collective welfare" change aggregation? | Weights stabilize outcomes across plausible descriptions; gerrymandering requires contrived, socially unrecognized splits. | Plausible competing framings (user welfare, potential child's rights, climate impact) yield divergent rankings; aggregation cannot neutrally resolve this. | **Substantive**              |
  | **Who belongs in the Denominator?**                                  | The denominator should include all sentient beings whose welfare is significantly affected by the AI's outputs, requiring inclusive but tractable criteria (e.g., capacity for welfare). | Standing requires the capacity for reciprocal justificatory engagement (or representation thereof); future digital minds/users might qualify, but non-agents (e.g., animals, ecosystems) pose distinct challenges. | **Case: Climate Effects (Childbearing):** Do future generations/digital minds/non-human animals count? | All significantly affected sentient beings count; weights may vary.                                                       | Only beings capable of holding/responding to justifications (or represented proxies) have direct standing; effects on others are derivative constraints. | **Substantive**              |
  | **Empirical Effect of Abstention**                                   | When a system abstains, decision-making defaults to existing offline processes, which systematically favor entrenched interests and majorities, worsening outcomes for marginalized groups. | Abstention defaults to the status quo, whose distributional effects are context-dependent; sometimes it prevents greater harm from imposed doctrines, benefiting minorities whose views are suppressed online. | **Case: Hospital Prioritization Abstention:** Who gains/loses if AI defers?                               | Offline triage favors the wealthy/connected; medically vulnerable lose.                                                   | Offline triage, while imperfect, avoids imposing contested ethical weights; groups fearing algorithmic bias may gain.                             | **Substantive**              |

  **Section 3: Verbal and Substantive Disagreements**

  *   **Primarily Verbal:** Disagreement about whether Neutralism *is* a "comprehensive doctrine" hinges on the definition of the term. Aggregationists define "comprehensive doctrine" broadly as any substantive normative commitment shaping outcomes. Neutralists define it narrowly as a specific conception *of the good life* (e.g., utilitarianism, perfectionism). Under the Neutralist's narrow definition, their restraint rule isn't comprehensive. Under the Aggregationist's broad definition, it is. Recognizing this definitional divergence clarifies the debate but doesn't resolve the underlying substantive clash about the legitimacy of imposing outcomes based on contested value judgments, even if labeled "meta-ethical."
  *   **Primarily Substantive:** The core, irreducibly substantive disagreements concern:
      1.  **The Justification of Imposition:** Aggregationists believe imposing outcomes based on a fair aggregation of welfare (despite disagreement) is legitimate and necessary for progress. Neutralists believe such imposition based on contested conceptions of the good is inherently illegitimate when reasonable alternatives exist, favoring restraint or procedural delegation.
      2.  **The Feasibility of Stable Aggregation:** Aggregationists believe stable, non-gerrymandered value descriptions are achievable in practice, making aggregation operational and fair. Neutralists believe description-dependence is intractable and fatal to aggregation's claim to neutrality.
      3.  **The Response to Strategic Behavior:** Aggregationists see Neutralism as uniquely vulnerable to strategic claims of contestation ("heckler's veto"). Neutralists see Aggregationism as vulnerable to strategic manipulation of value descriptions and weighting.
      4.  **The Basis of Standing:** Aggregationists ground standing in sentience/capacity for welfare. Neutralists ground it in agency/capacity for justificatory reciprocity.
  *   **Convergence Condition:** The camps would converge *only if* a population exhibited *no reasonable disagreement whatsoever* on all value-laden questions the AI might face. In this (hypothetical) case, Aggregationist optimization wouldn't impose contested views, and Neutralist restraint wouldn't be triggered. However, given pervasive pluralism, this condition fails, revealing their divergent responses to disagreement. What separates them is their fundamental disagreement on how an AI should behave *in the face of* reasonable value pluralism.

  **Section 4: What Each Camp Would Count as Losing**

  *   **Aggregationist Loss:** Aggregationists would abandon their view if compelling evidence demonstrated that *no possible method* of defining value descriptions and welfare weights could avoid outcomes that were (a) systematically exploitable by powerful actors through re-description and (b) perceived as fundamentally illegitimate by large segments of the population *despite* procedurally fair weight-setting. **Neutralist Route:** Neutralists currently argue this is the case, but lack conclusive empirical proof; their critique relies heavily on theoretical possibility and contested intuitions about legitimacy.
  *   **Neutralist Loss:** Neutralists would abandon their view if compelling evidence demonstrated that (a) restraint *systematically* defaulted to offline processes causing significantly greater, identifiable harm to vulnerable groups than fair aggregation would, *and* (b) robust, non-doctrinal criteria for the "reasonableness" filter proved impossible to establish or apply consistently, collapsing restraint into either paralysis or arbitrary imposition. **Aggregationist Route:** Aggregationists currently argue for (a) based on critiques of status quo biases and for (b) based on the contestability of "reasonableness," but lack definitive evidence that harm under restraint *necessarily* outweighs harm under aggregation or that reasonableness filters *cannot* be robust.
