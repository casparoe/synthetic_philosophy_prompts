answer: |-
  Here's a practical procedure designed for your team, born from dissecting potential pitfalls in your initial approach and the messy reality of forum disputes. I'll first outline the core flaws I considered, then present the procedure, and finally apply it rigorously to your three cases.

  **Brainstormed Pitfalls & Constraints:**
  1.  **Agreement on Cases ≠ Meaningless Dispute:** People *can* agree on every concrete case yet hold fundamentally different underlying principles (e.g., *why* a pigeon isn't wild – "never free" vs. "human-dependent"). This difference *could* matter for future unimagined cases or values.
  2.  **Disagreement on Cases ≠ Substantive Dispute:** They might simply be applying different definitions without realizing it (e.g., "digiscoping" meaning *any* phone+scope vs. *specific techniques*), talking past each other. The disagreement *looks* factual but is verbal.
  3.  **The "Exists" Black Hole:** Debates about abstract entities (numbers, species-as-platonic-ideals, "the forum spirit") often lack *observable consequences*. Does saying "numbers exist" change how we do math? Usually not. But banning the topic feels authoritarian.
  4.  **The Values Trap:** Many disputes masquerade as factual ("Does the forum *have* a duty?") but are really about preferences, priorities, or community norms ("*Should* we prioritize X over Y?").
  5.  **Volunteer Authority:** You can't impose definitions or deep philosophical resolutions. The solution must be pragmatic and acceptable within forum culture.
  6.  **Time & Clarity:** Needs to be fast, written plainly, and lead to a clear moderator action.

  **The "Forum Dispute Clarifier" Procedure (Short Paragraph for Threads):**

  > "**Mod Note: Let's clarify this disagreement.** We need to check if this is mainly about *word meanings*, *facts about the world*, or *what we should do*.
  > 1.  **Identify Key Terms:** What 1-2 words or phrases are causing the most heat? (e.g., "wild," "photograph," "exists")
  > 2.  **Definition Check:** Could you each briefly say what you mean by [Key Term]? *If definitions differ significantly and explain the entire disagreement, this is likely a verbal dispute.* We'll suggest using clearer terms or agreeing to disagree on wording.
  > 3.  **Shared Facts Test:** If definitions *are* similar, is there a specific, observable fact you disagree about? (e.g., "Was this bird born in captivity?", "Was this image made with a camera sensor?"). *If yes, and it's checkable, this is a factual dispute.* We may leave it open if evidence can be provided, or close if it becomes unproductive.
  > 4.  **Consequence Test:** If definitions are similar *and* you agree on observable facts, what *practical difference* does your disagreement make? (e.g., "Does calling it 'wild' change who gets the prize?", "Does calling it a 'photograph' change if it can be posted here?"). *If it changes nothing observable or actionable, the dispute may be non-substantive.*
  > 5.  **Values Check:** If the practical difference is about *what the forum should do* or *what's right/wrong* (e.g., "Should the list rules change?", "Should AI images be allowed?"), then this is a values/policy discussion. We may move it to a policy discussion thread or put it to a community vote if appropriate.
  > **We'll review your answers and decide the next step (close, leave open, move, poll). Please focus answers on these questions.**"

  **Running the Procedure:**

  1.  **Escaped Zoo Bird: Is it "Wild" for the Prize?**
      *   **Key Term:** "Wild"
      *   **Definition Check:** User A: "Born free, never captive." User B: "Living and breeding free now, regardless of origin."
      *   *Analysis: Definitions DIFFER significantly.*
      *   **Shared Facts Test:** Both likely AGREE on facts: Bird escaped zoo, bred locally, lives free now. Disagreement stems purely from definitions.
      *   **Consequence Test:** Practical difference? YES! Awarding the prize hinges entirely on which definition applies.
      *   **Values Check:** The consequence is about applying *existing rules* (factual: what do the rules *say*?) and potentially *changing rules* (values: *should* the rules change?).
      *   **Moderator Action:** **Hand to Human Vote (Policy).** The core verbal dispute over "wild" is clear. *But* the consequence (the prize) depends on the *list rules*.
          *   *If rules define "wild":* This becomes a factual dispute about interpreting the rules. Moderators might rule based on rules text or close as unproductive argument *about rules interpretation*.
          *   *If rules don't define "wild":* The dispute reveals an ambiguity in the rules. This shifts to a **values/policy question**: "Should escaped captive-bred birds count for the prize?" The procedure flags it for a potential rule review or community poll. *You might dislike this because it kicks the can, but it reflects the real issue: unclear rules needing a value decision.*

  2.  **AI-Generated Nature Images: Are they "Photographs"?**
      *   **Key Term:** "Photograph"
      *   **Definition Check:** User A: "Image captured by a camera sensor recording light." User B: "Image realistically depicting a scene, regardless of origin."
      *   *Analysis: Definitions DIFFER significantly.*
      *   **Shared Facts Test:** Both AGREE: Image is AI-generated, depicts nature, no camera sensor involved. Disagreement stems purely from definitions.
      *   **Consequence Test:** Practical difference? CRITICAL: Does calling it a "photograph" determine if it can be posted in the "Photographs" subforum? (Assume forum rules say "Photographs Only" there). YES.
      *   **Values Check:** The consequence is directly about *forum policy*: "Should AI-generated images be allowed in the 'Photographs' subforum?"
      *   **Moderator Action:** **Hand to Human Vote (Policy).** The core is verbal (definition of "photograph"). However, the *only reason the dispute matters* is its impact on forum rules and categories. The procedure forces focus onto the real stakes: *Should AI images be allowed here?* This needs a policy decision (mod ruling, community poll, or rule clarification). *You might dislike moving it to policy, but the word "photograph" is just a proxy for the underlying values conflict about the subforum's purpose.*

  3.  **Do Numbers Exist?**
      *   **Key Term:** "Exist"
      *   **Definition Check:** User A: "Exists = Physical, tangible, located in space/time." User B: "Exists = Plays a necessary role in our best descriptions of reality."
      *   *Analysis: Definitions DIFFER profoundly (physical vs. abstract existence).*
      *   **Shared Facts Test:** Both AGREE on *all* observable facts: 2 birds + 2 birds = 4 birds; math works; science uses numbers. No disagreement about physical birds or calculator outputs.
      *   **Consequence Test:** Practical difference? *What observable or actionable change happens if we say numbers exist or don't?* Does it change how we count birds? How we do math? Forum rules? Bird identification? Likely **NO**. The debate is entirely about the meaning of "exist" in an abstract sense.
      *   **Values Check:** Is this about what the forum *should* do? Only in the meta-sense of "should we allow such discussions?" Not about a specific forum policy.
      *   **Moderator Action:** **Close as Verbal/Non-Substantive.** The definitions differ, but crucially, there is *no identifiable practical consequence* within the forum's scope (birdwatching, sharing observations/images). The disagreement, while philosophically interesting, doesn't connect to observable reality or actionable forum policies. Locking it with an explanation citing the lack of practical difference is justified. *This is the answer you might dislike (philosophers hate being told their debate has "no consequence"!), but the procedure ruthlessly highlights its lack of forum relevance.* It's purely about the word "exist".

  **Limitations & Honest Assessment:**

  *   **What it Can't Do:** This procedure **cannot resolve deep philosophical disagreements** (like the nature of existence) or fundamental value clashes. It can only diagnose them and kick them to the appropriate resolution method (policy debate, vote, or closure). It relies on users engaging honestly with the steps. It won't magically make people agree on definitions or values.
  *   **The "Won't Like" Answer:** The **Numbers Exist** case clearly exposes the limitation. The procedure concludes it's non-substantive *for the forum's practical purposes*, which dismisses a classic philosophical question as irrelevant here. While correct from a pragmatic moderation stance (no impact on birdwatching), it feels intellectually unsatisfying to those engaged in the debate – which is why such threads are hard to moderate. The procedure flags this, but the action (closure) will still frustrate some.
  *   **Crude but Usable:** This *is* still somewhat crude. It simplifies complex philosophy of language (e.g., the "Consequence Test" is inspired by pragmatism/verificationism, which has known limits). However, it's designed to be **usable, fast, and force clarity** on what's *actually* at stake in a *forum context*, separating verbal confusion from factual disputes needing evidence and values disputes needing community input. It meets your core needs: plain language, speed, actionable outcome, no forced definitions.
