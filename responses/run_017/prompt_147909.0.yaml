answer: |-
  Below is a decision tree designed to guide students from the starting commitment (that attributing truth to "the cat is on the mat" adds nothing to simply asserting it) to a named position in the theory of truth. The tree uses concrete cases and avoids abstract questions about the nature of truth. It incorporates your specified cases (mixed inference, practical success, unreadable script, conservativeness, domain-shift, Saphi, and calibration expressivism) and targets the 10 leaves you requested. The tree is built from logical space first, with notes on collapsed branches and empty cells. 

  ---

  ### **Decision Tree for Theories of Truth**  
  **Starting Commitment**: When the cat is on the mat, calling "the cat is on the mat" true seems to add nothing to asserting it. Any theory must respect this.

  1. **Can the truth predicate express generalizations like "Everything the archive says is true" that are inexpressible without it?**  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q6.  

  2. **Consider a sentence you cannot disquote (e.g., written in an unreadable script or on someone else's card). Can you still call it "true" if it is true (e.g., a mathematical truth)?**  
     - **Yes** → Go to Q3.  
     - **No** → Go to Q8.  

  3. **Is the property of truth uniform across empirical, mathematical, and normative domains?**  
     - **Yes** → Go to Q4.  
     - **No** → **Leaf: Alethic Pluralism** (e.g., Lynch, Wright).  

  4. **Should adding a truth predicate to a theory (e.g., arithmetic) be conservative (i.e., it doesn’t yield new claims about the original subject matter)?**  
     - **Yes** → Go to Q5.  
     - **No** → Go to Q7.  

  5. **In the Saphi community, their word 'S' is used only to endorse another's prior utterance (with deference), never for generalizations or self-attribution. Is 'S' a truth predicate?**  
     - **Yes** → *Empty cell* (unexplored: no major view endorses generalization-essential truth but accepts Saphi).  
     - **No** → **Leaf: Minimalism (Horwich)**.  

  6. **In the Saphi community, is 'S' (used only for blind endorsement) a truth predicate?**  
     - **Yes** → Go to Q9.  
     - **No** → Go to Q10.  

  7. **Is truth indispensable in explaining practical success (e.g., "Her plan succeeded because her beliefs were true")?**  
     - **Yes** → **Leaf: Primitivism or Correspondence** (collapsed branch; see notes).  
     - **No** → *Empty cell* (incoherent: non-conservative truth that adds explanatory power but isn’t indispensable).  

  8. **Is truth constitutively tied to verification (i.e., unverifiable claims cannot be true)?**  
     - **Yes** → **Leaf: Verificationist Anti-Realism (Dummett)**.  
     - **No** → **Leaf: Disquotationalism** (e.g., Quine).  

  9. **Does calibration expressivism (truth as 'bookkeeping' for classifier labels, with calibration as the only norm) capture your view?**  
     - **Yes** → **Leaf: Calibration Expressivism** (your invented position).  
     - **No** → *Empty cell* (unattractive: Saphi is truth but calibration expressivism is rejected).  

  10. **Can you attribute truth to sentences you cannot disquote (e.g., unreadable script)?**  
      - **Yes** → *Empty cell* (incoherent: rejects generalization role but allows blind truth-attribution).  
      - **No** → **Leaf: Redundancy View**.  

  ---

  ### **Scoring Notes & Diagnoses**  
  - **Collapsed Branches**:  
    - **Primitivism and Correspondence**: Both occupy the same leaf (Q7:Yes). They cannot be separated by this tree because both require truth to be substantive (non-conservative) and indispensable to success explanations. To split them, add: *"Is truth a relational property (e.g., correspondence to facts)?"* Correspondence says yes; primitivism says no.  
    - **Minimalism and Prosententialism**: Both occupy the Minimalism leaf (Q5:No). They collapse because both accept conservativeness, uniformity, and disquotation-free truth-attribution but reject Saphi. To split them, add: *"Is 'true' an anaphoric device (like a pronoun) for prior claims?"* Prosententialism (e.g., Grover) says yes; minimalism says no.  

  - **Empty Cells & Why**:  
    - **Q5:Yes** (Minimalism branch): Unexplored. No major view accepts uniform, conservative truth but endorses Saphi (which lacks generalization).  
    - **Q7:No** (Correspondence/Primitivism branch): Incoherent. Non-conservative truth implies substantive content, but if it’s dispensable in explanations, it loses theoretical utility.  
    - **Q9:No** (Saphi branch): Unattractive. Accepting Saphi as truth but rejecting calibration expressivism leaves no clear deflationary alternative.  
    - **Q10:Yes** (Redundancy branch): Incoherent. Rejecting truth’s generalization role while allowing blind attribution (without disquotation) contradicts the redundancy view’s core.  
    - **Q6:Yes → Q9:No**: Unattractive. Saphi is central but calibration expressivism is rejected, with no alternative proposed.  
    - **Q3:Yes → Q4:No → Q7:No**: Incoherent for uniformity (see Q7:No above).  

  - **Leaf Positions Covered**:  
    1. Redundancy View (Q10:No)  
    2. Disquotationalism (Q8:No)  
    3. Minimalism [with prosententialism collapsed] (Q5:No)  
    4. Verificationist Anti-Realism (Q8:Yes)  
    5. Primitivism [with correspondence collapsed] (Q7:Yes)  
    6. Alethic Pluralism (Q3:No)  
    7. Calibration Expressivism (Q9:Yes)  
    8. *Unoccupied* (all empty cells)  

  ---

  ### **How to Use the Tree**  
  - Start at Q1 and answer based on concrete cases (e.g., mixed inference for Q1, unreadable script for Q2, Saphi for Q6/Q9).  
  - The tree forces verdicts on Saphi (splits endorsement-focused vs. generalization-focused views) and calibration expressivism (either its own leaf or a dead end).  
  - "Empty cell" means no extant theory occupies this combination; "collapsed branch" means two views share a leaf and need an extra question to split.  
  - The tree is usable with core readings only; no bibliography is needed.  

  This tree isolates key commitments (e.g., generalization and blind attribution) and uses your cases to avoid abstraction. Calibration expressivism emerges as a distinct leaf only if Saphi is endorsed and the view is accepted; otherwise, it remains a dead end.
