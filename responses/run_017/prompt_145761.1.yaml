answer: |-
  Below is a branching flowchart designed to address the demandingness objection to utilitarianism, built from the logical space of concrete cases. It starts from an uncontroversial premise (skipping a $5 latte to save a life) and branches through three yes/no questions about progressively larger sacrifices. Each question is phrased in plain English, uses specific examples (kidney donation, job change, skipping a child's birthday), and requires no prior philosophical knowledge to answer. The tree yields eight possible leaves (combinations of answers), but only four are occupied by named positions; the others are empty due to incoherence or unattractiveness.

  ### Decision Tree Structure
  1. **Start with the uncontroversial premise (fixed answer)**:  
     "Should you skip a $5 latte and donate the money to a charity if it would definitely save a child's life from a deadly disease?"  
     → **Yes** (Everyone agrees—this is the entry point).

  2. **Question 1 (Kidney donation)**:  
     "Should you donate one of your kidneys to a stranger if it would save their life, and you'd live normally afterward with minimal risk?"

  3. **Question 2 (Job change for earning-to-give)**:  
     "Should you quit your fulfilling engineering job for a higher-paying one (e.g., in finance) if the extra income you'd donate would save more lives overall?"

  4. **Question 3 (Skipping child's birthday)**:  
     "Should you skip your own child's birthday party to work an extra shift if the earnings you'd donate would definitely save a life?"

  ---

  ### Logical Space (All Possible Combinations)
  The three binary questions create eight possible answer combinations. Below, I:
  - List each combination as (Q1, Q2, Q3).
  - Name the position if occupied, or explain why it's empty.
  - Summarize the position in one sentence (focusing on its "weirdest commitment" for clarity).
  - Note which leaves the tree cannot separate.

  | Q1: Kidney? | Q2: Job? | Q3: Birthday? | Position Name & Summary | Why Occupied or Empty |
  |-------------|----------|---------------|-------------------------|------------------------|
  | Yes | Yes | Yes | **Maximizing Utilitarianism** <br> Weirdest commitment: You must skip your child's birthday to work and donate, as all personal goods are tradable for greater good. | Occupied: Coherent but demanding; "bites the bullet." |
  | Yes | Yes | No | *Empty* | Incoherent: Requires bodily sacrifice (kidney) and life-altering acts (job change) but draws an arbitrary line at family events—no ethical framework justifies this asymmetry. |
  | Yes | No | Yes | *Empty* | Incoherent: Requires bodily sacrifice and skipping family events but not career upheaval, even if the latter saves more lives—inconsistent cost-benefit logic. |
  | Yes | No | No | **Satisficing or Threshold** <br> Weirdest commitment: You must donate a kidney but may keep your job and attend family events, as obligations drop off after "enough" sacrifice. | Occupied: Coherent; combines moderate demands (satisficing) or a duty limit (threshold). *Tree cannot separate these—both end up here.* |
  | No | Yes | Yes | *Empty* | Unattractive: Rejects bodily sacrifice but requires career and family sacrifices, which feels backwards (why prioritize money over health?)—no notable theory defends this. |
  | No | Yes | No | *Empty* | Incoherent: Requires quitting your job but not donating a kidney or skipping family events, ignoring that the kidney saves a life more directly—no logical basis. |
  | No | No | Yes | *Empty* | Incoherent: Only requires skipping family events, not health/career sacrifices—inconsistent with any cost-benefit or rights-based view. |
  | No | No | No | **Personal Prerogative / Agent-Centered Options** <br> Weirdest commitment: You may keep both kidneys even if donating one would save a life at little cost, as you have strong "self-regarding" permissions. | Occupied: Coherent; emphasizes personal boundaries over maximization. |

  ---

  ### Key Notes on the Tree
  1. **Occupied Leaves (4 out of 8)**:  
     - **Maximizing Utilitarianism (Yes/Yes/Yes)**: Covers "bite-the-bullet" utilitarianism. The decision-procedure/blame distinction (where acts are wrong but not blameworthy) also falls here—this variant agrees all sacrifices are required but adds that we're excused for human limitations.  
     - **Satisficing or Threshold (Yes/No/No)**: Combines two views the tree can't separate:  
       - *Satisficing*: You must do "enough" good (e.g., kidney donation) but not maximize (e.g., job change).  
       - *Threshold*: Obligations vanish after a sacrifice level (e.g., kidney is "enough"). Both share the same answers here.  
     - **Personal Prerogative (No/No/No)**: Permits minimal sacrifice only (latte), protecting personal interests.  
     - *Missing position?* A pure "options view" (where you're always permitted to give less) is covered under Personal Prerogative.

  2. **Empty Leaves (4 out of 8)**: All are due to **incoherence**—the combinations defy basic logic (e.g., requiring harder sacrifices but easier ones, or arbitrary distinctions). No major theory occupies them because they're inconsistent with cost-benefit reasoning or moral intuitions.

  3. **Tree Limitations**:  
     - Cannot separate **satisficing vs. threshold** (both are Yes/No/No).  
     - Cannot distinguish the **decision-procedure view** from maximizing utilitarianism (it's a subset of Yes/Yes/Yes).  
     - The **"threshold" view** is partially covered but not if it requires more than a kidney (e.g., job change but not birthday skip)—this falls into an empty leaf (No/Yes/No) as it's incoherent.

  ### How to Use This Flowchart
  - **For your lunch-and-learn**: Present the tree as a flowchart. Start with the fixed latte question, then branch through Q1–Q3.  
  - **Discuss empty leaves**: Explain why they're incoherent (e.g., "Yes/Yes/No prioritizes money over family arbitrarily").  
  - **Emphasize concrete cases**: Engineers can reason about kidneys/jobs/birthdays without philosophy jargon.  
  - **Highlight weird commitments**: This makes positions memorable (e.g., "Maximizing says: skip birthdays to save strangers!").  

