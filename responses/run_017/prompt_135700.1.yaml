  Okay, the user is part of a conservation agency committee dealing with habitat classification. They need a theory of universals tailored to their practical needs. Let me unpack their main concerns. 

  First, they have a list of specific problems: whether categories are real or convenient, how to handle overlapping types, disjunctive properties, vagueness in cut-offs, collective properties, and especially the issue of naturalness varying by region. They want requirements for a usable theory, marked as non-negotiable or debatable.

  The core challenge is balancing scientific accuracy with legal enforceability. Habitat designations affect funding and legal protections, so categories must be both ecologically meaningful and legally defensible. The user mentioned disputes with ecologists and landowners' lawyers, highlighting the practical stakes.

  The regional variation problem is critical. When a category works well in one area but seems arbitrary in another, is that a flaw in the classification or inherent to the ecology? The user needs to know if any universal theory can handle this without undermining other requirements.

  I consider which requirements are non-negotiable. Predictive power for management actions (like grazing effects) seems essential. Also, handling both natural and defined properties (e.g., absence-based "unimproved") is crucial for their work. Overlapping categories without hierarchy and collective properties are operational necessities.

  For the regional naturalness issue, I recall that process-based theories (like dispositional realism) might help. Properties could be natural where certain processes dominate, even if elsewhere they're gradient slices. This fits ecological reality but might require accepting degrees of naturalness—which some theories reject.

  Conflicts between requirements: For example, requiring properties to be mind-independent (non-negotiable for legal reasons) clashes with conventionalism about cut-offs. But since legal frameworks need clear boundaries, I'd prioritize mind-independence for core properties while allowing pragmatic thresholds.

  Assessing standard theories: Immanent realism (Armstrong-style) handles many needs but struggles with vague boundaries. Trope theories might explain regional variation via similarity clusters but could become too fragmented for policy use. Nominalism avoids universals but fails at non-negotiable predictive power needs.

  The user's deepest need might be justifying regional flexibility without sacrificing scientific credibility. They need a theory that allows context-dependence while maintaining objectivity—a tightrope walk between ecology and law.
answer: |-
  Here’s a distilled set of requirements for a theory of universals tailored to your habitat classification work, with non-negotiables marked (**★**), contested requirements marked (**⚐**), and cases illustrating each. I’ve refined your list, added critical missing pieces, and flagged conflicts.

  ---

  ### **Core Requirements & Cases**
  1. **Repeatability across instances**  
     **Why**: 100 sites share type "Calcareous Grassland" despite varying soil depth/flora.  
     **Non-negotiable (★)**: Without this, designation collapses.

  2. **Predictive causal power**  
     **Why**: Type "Lowland Heath" predicts fire resilience; "unimproved grassland" predicts orchid recovery after grazing cessation.  
     **Non-negotiable (★)**: Legal protection hinges on anticipating management impacts.  
     **Clarification**: Properties needn’t *always* cause outcomes (e.g., undisturbed sites), but must support reliable inferences when disturbed.

  3. **Non-hierarchical overlap**  
     **Why**: "Wet Woodland" and "Alder Carr" share sites but neither subsumes the other.  
     **Non-negotiable (★)**: Ecological reality demands cross-cutting categories.

  4. **Collective instantiation**  
     **Why**: "Viable population" applies to *groups* of individuals (e.g., marsh fritillary butterflies).  
     **Non-negotiable (★)**: Conservation targets meta-populations, not single organisms.

  5. **Absence/disjunction as valid properties**  
     **Why**: "Unimproved" = no fertiliser history; "Semi-natural" = ancient woodland *or* restored pasture.  
     **Contested (⚐)**: Landowners argue these are "non-properties," but your policy relies on them.  
     **Non-negotiable (★)**: Legally operational definitions require this.

  6. **Vagueness with sharp boundaries**  
     **Why**: "40% heather cover" threshold for "Dwarf Shrub Heath" – gradual gradient, arbitrary cutoff.  
     **Requirement**: Theory must allow *epistemic* vagueness (our knowledge) while permitting precise legal boundaries.

  7. **Context-dependent naturalness**  
     **Why**: "Upland Hay Meadow" carves joints in the Pennines (distinct soil/moisture) but is a slice of a fertility gradient in Kent.  
     **Critical requirement (★)**: Theory must accommodate "local naturalness" – a property can be joint-carving *relative to regional processes* (e.g., glaciation history, grazing regimes).  
     **Cost**: Rejects universal metaphysical primacy (e.g., Platonism). Favours process-based immanence.

  8. **Property identity across schemes**  
     **Why**: Is "Bog" (UK) = "Mire" (EU)? Must distinguish genuine synonymy from overlap (e.g., "EU Mire" includes UK "Fen").  
     **Requirement**: Properties are identical iff they share causal powers *and* historical/functional essence (e.g., peat formation processes).

  9. **Coextension resistance**  
     **Why**: "Ancient Woodland" (historical continuity) vs. "Primary Woodland" (no recorded clearance) *could* overlap perfectly today but diverge if a new site is discovered.  
     **Non-negotiable (★)**: Theory must distinguish properties that coincide contingently.

  ---

  ### **Conflicts Between Requirements**
  - **Conflict**: *Causal power (2)* vs. *Context-dependent naturalness (7)*  
    - **Why**: If naturalness requires global joint-carving (e.g., Platonism), regional variation becomes "junk."  
    - **Resolution**: Drop *universal* naturalness. Keep causal power + local naturalness.  
    - **Winner**: (7) – Ecology is context-bound; causal predictions depend on local processes.  

  - **Conflict**: *Sharp boundaries (6)* vs. *Vagueness in reality*  
    - **Why**: Legal thresholds need precision, but ecology is continuous.  
    - **Resolution**: Admit vagueness in instances but retain precise definitions for policy. Theory must separate metaphysical gradation from epistemic thresholds.  

  - **Conflict**: *Absence properties (5)* vs. *Causal potency (2)*  
    - **Why**: Can "no fertiliser" *cause* biodiversity? Some theories demand positive powers.  
    - **Resolution**: Define absences relationally (e.g., "undisturbed" enables soil biota processes). **Keep (5)** – your policy depends on it.  

  ---

  ### **Theories: One-Line Scorecard**
  - **Transcendent (Platonic)**: ✘ Fails (7), (9). Universals exist independent of instances – can’t handle regional variation.  
  - **Immanent (Aristotelian/Armstrong)**: ✓ Best fit. Universals in re, causal powers, allows local naturalness. Struggles with (5),(6).  
  - **Tropes**: △ Partial fit. Explains (7),(6) via similarity classes, but struggles with (1),(8) (no identity across sites).  
  - **Resemblance Nominalism**: ✘ Fails (2),(9). Properties reduced to similarity – can’t ground causal predictions.  
  - **Class Nominalism**: ✘ Fails (2),(9). "Unimproved" is just a set – no causal basis for protection.  
  - **Ostrich (Quinean)**: ✘ Fails (★). "No properties" undermines legal appeals & cross-scheme alignment.  

  ---

  ### **Key Recommendation**
  **Adopt a hybrid immanent theory with process-relative naturalness**:  
  - Universals are immanent (in habitats), defined by shared causal powers tied to local processes (e.g., glaciation, hydrology).  
  - Allows "unimproved" as a relational property (absence relative to agricultural intervention).  
  - Accepts sharp legal cut-offs (6) as pragmatic, not metaphysical.  
  - Explains regional naturalness (7): A property is "natural" where it aligns with dominant ecological processes (upland glaciation vs. lowland gradients).  

  **Why this works**:  
  - Non-negotiables (1–5,8,9) are secured via causal-ecological grounding.  
  - (7) is resolved by making naturalness *contingent on regional dynamics* – no "junk."  
  - Cost: Rejects universal essences. Naturalness becomes degree-theoretic (stronger in uplands than lowlands).  

  **Single requirement ruling out most contenders**: **(7) Context-dependent naturalness**. Only robust immanent theories (or tropes) can accommodate it. Platonic/class-based theories fail outright.
