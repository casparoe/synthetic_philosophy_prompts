  Let me outline the candidate disagreements:
  First, there's the artifact vs. matter tension - is the condition about the statue as an artwork or the physical clay? 
  Second, there's the unity question - does the object cease to exist when disassembled? 
  Third, there's the replacement threshold issue - is 50% mass continuity meaningful or arbitrary? 
  And fourth, there's the tracking problem - should the museum's own records determine identity?

