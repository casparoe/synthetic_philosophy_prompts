prompt: |-
  I'm putting together a three-year research programme — myself plus two postdocs, conceptual work only, no empirical component — on whether conscious experience could be causally inert and on what follows if it is. We've decided to concentrate on the paradox of phenomenal judgment: if phenomenal states make no causal difference to what we say, think, or write, then our judgments about our own experience are not explained by their subject matter, and the worry is that this strips those judgments of warrant — including the judgment that epiphenomenalism deserves to be taken seriously.

  What I need is a defended agenda, not a survey. Assume we can pursue three lines of work properly and must drop everything else. Rank the candidate lines and defend the ranking on how much else depends on their answer, on tractability in three years with conceptual tools alone, and on how much difference the answer makes downstream — to the case for dualism, to illusionist and other eliminativist options, and to whether the standard anti-physicalist arguments can be trusted at all.

  To make this concrete, here is the map I'm working with, including some distinctions I've invented to organise it. Tell me where the map is wrong as well as what to prioritise.

  1. The tracking reply. Phenomenal states are causally inert, but a non-phenomenal introspective mechanism reliably co-varies with them, so phenomenal judgments are reliably produced and qualify as knowledge. My worry here is what I'll call the surrogate problem: a co-varying surrogate explains why judgments are accurate only if something explains why they co-vary at all — a bare correlation looks like a second coincidence stacked on top of the first.
  2. The constitutive or acquaintance reply. The judgment that one is now in pain is not merely caused by the experience but partly constituted by it, or the phenomenal concept deployed is such that undergoing the experience suffices for being acquainted with it. The dividing question, as I see it, is whether acquaintance is meant to be a causal relation, a merely modal one, or something sui generis — and I suspect the answer to that does more work than people admit.
  3. The common-cause reply. Experience and judgment are joint effects of a single physical cause, so the co-variation holds as a matter of natural necessity within the actual nomological order. This is the option I find least discussed. It predicts that the correlation is contingent in a strong sense — nothing underwrites it under perturbation — and it forces a question I want either prioritised or dismissed: whether knowledge requires its reliability to be modally robust, or whether reliability within the actual laws is enough.
  4. The scope question. Does the paradox stop at first-person judgments about current experience, or does it generalise? Two generalisations worry me and I can't tell which matters more. Diachronically: if our judgments about experience are not explained by experience, what explains the long-run convergence — or failure to converge — of an entire research literature on consciousness? Argumentatively: the conceivability and knowledge arguments that motivate epiphenomenalism in the first place are themselves judgments about the relation between physical and phenomenal facts, and if they are not causally explained by the phenomenal facts they concern, the paradox may consume the very arguments that generate it. I suspect this last point is the most upstream item on my list, and I want you to press hard on whether that's right or whether I am overweighting a dialectical flourish.
  5. The dissolution options: illusionism and other eliminativisms about the phenomenal, or the retreat to dual-aspect or neutral monism, on which the causal question is redescribed rather than answered.

  Two tests I've been using to sort these, which you should feel free to reject. The grain test: does a proposal predict that judgments discriminate fine-grained phenomenal differences — nearby shades, the precise character of an afterimage — or only coarse ones such as pain versus itch or seeing versus hearing? A view that secures only coarse reliability secures at best coarse knowledge, and I want to know how much that matters. The perturbation test: does the proposal let us say anything about what would happen if the correlation between experience and judgment broke down, and if it does not, is that a cost or a feature?

  What I want in the response: a ranking of at most three lines of work with the reasoning explicit, including the criteria you actually applied and the trade-offs between them, saying where and why you weight upstreamness against tractability; a statement of which options on my map you take to be dead ends, and which option I've omitted that you'd add; a dependency map in prose, specifying what must be settled before what and which pairs of questions can be worked on in parallel without loss; and some account of what, appearing over the next three years, would move an item up or down — a conceptual programme gets no experimental results, but there must be something, a formal result or a shift in the dialectic, that could function as a checkpoint.

  Throughout, mark clearly what is settled or near-settled among people who work on this, what is genuinely contested, and where you are going out on a limb or extrapolating past anything with a real literature behind it. This is going into a case for support, and I don't want to discover afterwards that something I presented as the state of the art was one side of a live dispute, or my own invention. If any of the distinctions above already have names in the literature, or collapse into distinctions that do, tell me which — but don't pad the answer with citations; I can find those myself.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're putting together a three-year research program focusing on whether conscious experience is causally inert and the implications if it is. The core issue is the paradox of phenomenal judgment: if phenomenal states don't cause our judgments about them, how can those judgments be warranted? The user has outlined five possible lines of inquiry and wants help prioritizing three of them based on upstream impact, tractability, and downstream consequences.

  First, I need to understand their main concerns. The user is worried about the surrogate problem in the tracking reply, the nature of acquaintance in the constitutive reply, and the modal robustness in the common-cause reply. They also mention the scope question and dissolution options. The two tests they propose—grain and perturbation—are tools to evaluate these approaches.

  The user's explicit needs are a ranked agenda with clear reasoning, dead ends identified, dependencies mapped, and checkpoints for progress. But deeper, they might be seeking validation of their framework, ensuring it's robust for a grant proposal. They don't want to present contested ideas as settled, so accuracy in representing the state of the field is crucial.

  Looking at the options, I need to assess each against the criteria. Upstreamness: which questions affect others the most? The scope question, especially the argumentative generalization, seems pivotal. If the paradox undermines the anti-physicalist arguments themselves, that's fundamental. Tractability is a constraint—three years with no empirical work. Common-cause might be more tractable than constitutive replies, which involve deep metaphysical debates. Downstream impact involves implications for dualism, illusionism, etc.

  I should consider which options are dead ends. The tracking reply's surrogate problem might be insurmountable without adding causal mechanisms, which isn't feasible here. Dissolution options like illusionism might sidestep the paradox but aren't directly engaging with it, so they could be lower priority for this project.

  Dependencies: Scope must come first because if the paradox generalizes, it affects everything else. Then common-cause, as its answer influences constitutive approaches. Constitutive can be worked in parallel with scope, but common-cause might need to be settled first to avoid circularity in defining acquaintance.

  Checkpoints: For scope, a taxonomy of judgment types and their warrant conditions. For common-cause, formal models of reliability under perturbation. For constitutive, a framework for non-causal acquaintance. Progress could be shifts in dialectic, like consensus on modal robustness requirements.

  I need to verify where the field stands. The surrogate problem is acknowledged in literature. Constitutive replies are contested, especially the nature of acquaintance. Common-cause is underexplored, making it risky but high-reward. Scope's argumentative generalization is the user's insight, so it's novel and needs rigorous development.

  Ranking: 1. Scope question for upstream impact. 2. Common-cause for tractability and downstream effects. 3. Constitutive reply as it's central but complex. Dead ends: Tracking reply due to surrogate problem. Missing: Exploring the epistemology of disagreement in consciousness studies, which ties into scope.

  Finally, ensuring the response is clear, avoids jargon, and meets the user's hidden need for a compelling, fundable research plan that addresses core philosophical challenges without overstepping empirical constraints.
answer: |-
  Here’s a prioritised research agenda based on your criteria (upstream impact, tractability, downstream consequences), with dead ends flagged, dependencies mapped, and checkpoints defined. The ranking reflects which lines unlock the most while respecting constraints (3 years, conceptual-only, 2 postdocs). **Tiered ranking:**

  1.  **#4: The Scope Question (Highest Priority)**
      *   **Why ranked first:** Utmost upstream impact. If the paradox generalizes to *all* phenomenal judgments (including those in anti-physicalist arguments), it threatens the entire dialectic motivating epiphenomenalism. Settling scope dictates whether the paradox is a localized curiosity or a global epistemic catastrophe.
      *   **Tractability:** High. Conceptual analysis of judgment types (1st-person current, 1st-person past, 3rd-person, theoretical arguments) and their warrant conditions is feasible. Applying your "perturbation test" to different scopes (e.g., "What if Mary's Jacksonian knowledge argument wasn't caused by phenomenal facts?") is tractable conceptual work.
      *   **Downstream Impact:** Massive. If generalized:
          *   **Anti-physicalist arguments (Conceivability, Knowledge, Explanatory Gap):** Are potentially self-undermining if not causally explained by the phenomenal facts they reference. This radically reshapes the debate.
          *   **Dualism:** Faces an even deeper epistemic crisis.
          *   **Illusionism/Eliminativism:** Gains significant traction if warranted belief in phenomenality is impossible under epiphenomenalism.
          *   **Neutral Monism/Dual-Aspect:** Requires showing how their redescription avoids the generalized paradox.
      *   **Your Map Critique:** You're correct that the "argumentative" generalization is likely *the* most upstream point. It's not *just* dialectical flourish; it's potentially existential for the problem setup. However, the "diachronic" (literature convergence) is weaker; convergence could arise from shared non-phenomenal causes (culture, language, brain similarities). Prioritize argumentative generalization.
      *   **Dead End?** No. This is fundamental.
      *   **Dependency:** Must be addressed **first**. Its outcome dictates the urgency and framing of work on other lines. Can partly run in parallel with #3 (Common-Cause).
      *   **Checkpoint (Year 1-1.5):** A rigorous taxonomy of phenomenal judgment types with a defended account of which, if any, *could* retain warrant under epiphenomenalism. A published paper arguing *for or against* the generalization of the paradox to anti-physicalist arguments would be a major shift.

  2.  **#3: The Common-Cause Reply (Second Priority)**
      *   **Why ranked second:** Directly tackles the core mechanism of correlation under epiphenomenalism. Its answer decisively impacts the viability of the Tracking reply (#1) and critically informs the Constitutive reply (#2) regarding modal robustness. Highly tractable.
      *   **Tractability:** Very High. Conceptual modeling of reliability under "natural necessity but not robustness" is ideal for formal tools (e.g., modeling correlation stability under perturbations within vs. outside actual laws). Analyzing modal robustness requirements for knowledge (safety, sensitivity) is core epistemology.
      *   **Downstream Impact:** Significant.
          *   **Tracking Reply (#1):** If actual-world reliability *suffices* for warrant, Tracking avoids the Surrogate Problem. If robustness is required, Tracking likely fails.
          *   **Constitutive Reply (#2):** If robustness is required, Constitutive views *must* ground acquaintance in something non-causal *and* modally robust, a huge burden. If not, their task is easier.
          *   **Epistemology of Consciousness:** Settles whether epiphenomenalism implies skepticism only in counterfactual scenarios or in the actual world.
          *   **Illusionism:** Weaker if actual reliability suffices.
      *   **Your Map Critique:** Correctly noted as underexplored. The "perturbation test" is *crucial* here. The "grain test" applies: Does the common cause support fine-grained covariance? (Likely yes, if neurobiology is fine-grained).
      *   **Dead End?** No. Core to the epistemic challenge.
      *   **Dependency:** Can start early, **in parallel with Scope (#4)**. Its conclusion about modal robustness critically informs work on #1 (Tracking) and #2 (Constitutive). Should be settled *before* deep investment in #2.
      *   **Checkpoint (Year 1.5-2):** A formal model or rigorous conceptual framework demonstrating the stability (or instability) of the experience-judgment correlation under specified perturbations within the actual nomological network. A defended position paper on whether knowledge requires modal robustness (applied specifically to phenomenal judgment under epiphenomenalism).

  3.  **#2: The Constitutive/Acquaintance Reply (Third Priority)**
      *   **Why ranked third:** Addresses the core "how is direct knowledge possible?" question. Success would be a major victory. However, it relies on contentious metaphysics of mind and concepts, making it less tractable. Its viability depends heavily on outcomes of #3 and #4.
      *   **Tractability:** Moderate/Low. Requires deep work in metaphysics (nature of constitution, phenomenal concepts) and epistemology (acquaintance). Conceptual space is well-trodden but deeply contested. Defining a viable *non-causal, non-merely-modal* acquaintance relation is notoriously difficult. Your "dividing question" is spot on and central.
      *   **Downstream Impact:** High if successful, but narrows focus.
          *   **Dualism:** Provides a potential epistemic lifeline for non-reductive views.
          *   **Physicalism:** Challenges illusionism if acquaintance grounds direct realism about phenomenality.
          *   **Anti-Physicalist Arguments:** If acquaintance works, it might secure the judgments underpinning these arguments (depending on Scope outcome).
      *   **Your Map Critique:** The "grain test" is vital: Can acquaintance explain fine-grained discriminations? (Most proponents assume yes). The "perturbation test" is awkward – if judgment is *constituted* by experience, true breakdown might be impossible by definition, making perturbation scenarios incoherent. This is a feature or bug depending on your view.
      *   **Dead End?** Not inherently, but risks high effort for uncertain return. Success hinges on resolving deep metaphysical puzzles within 3 years.
      *   **Dependency:** Should be addressed **after or concurrently late with #3 (Common-Cause)** and **only if #4 (Scope)** shows the paradox doesn't *automatically* generalize to first-person current judgments. Needs the modal robustness verdict from #3.
      *   **Checkpoint (Year 2-3):** A developed, novel account of acquaintance/constitution under epiphenomenalism that explicitly addresses your "dividing question" and survives the "grain test." A significant paper meeting substantial peer engagement (pro or con) would demonstrate impact.

  **Deliberate Omissions & Dead Ends:**

  *   **#1 Tracking Reply:** **Ranked Lowest / Effectively Dead End** under your constraints. The "Surrogate Problem" is widely acknowledged as its Achilles' heel in the literature. Solving it requires explaining the *non-accidentalness* of the correlation, which seems impossible without reintroducing causation (ruled out) or collapsing into Common-Cause (#3) or Constitutive (#2). Pursuing it independently is unlikely to yield new insights within 3 years. *Dependency:* Wholly dependent on outcomes of #3 (modal robustness) and #4 (scope). If #3 shows robustness isn't needed *and* #4 shows the paradox is localized, Tracking *might* limp along, but the Surrogate Problem remains fatal. Drop it.
  *   **#5 Dissolution Options:** **Not Prioritized** as a core line. Engaging deeply with Illusionism or Neutral Monism is a *different project* – explaining away or radically redefining the explanandum rather than solving the paradox *within* a realist phenomenal framework. Your project is framed around the paradox *given* epiphenomenalism *and* realism about phenomenal states. Brief engagement is necessary (e.g., showing how Illusionism *avoids* the paradox), but shouldn't be a primary research line. *Dependency:* Becomes relevant *only if* all realist replies (#1-#4) fail catastrophically, which is a conclusion to *reach*, not a starting point.

  **Dependency Map (Prose):**

  1.  **Start Immediately & Run in Parallel (Years 1-2):**
      *   **Scope (#4):** Analyze types of phenomenal judgments and test generalization, especially to anti-physicalist arguments.
      *   **Common-Cause (#3):** Model reliability under natural necessity, analyze modal robustness requirements for knowledge.
      *   *(Concurrent)* **Initial Scoping of Constitutive (#2):** Survey existing accounts, pinpointing the "dividing question" and challenges.
  2.  **Mid-Program Dependencies (Year 1.5-2.5):**
      *   **#4 (Scope) Outcome Informs All:** If generalization holds, urgency increases dramatically; if localized, focus narrows to 1st-person current.
      *   **#3 (Common-Cause) Outcome Informs #1 & #2:**
          *   Verdict on modal robustness directly determines viability of Tracking (#1 - dead end if robustness needed) and shapes burden for Constitutive (#2).
          *   *Now Drop #1 (Tracking) definitively based on Surrogate Problem + #3 outcome.*
  3.  **Focus Phase (Year 2-3):**
      *   **Deep Dive into Constitutive (#2):** Informed by robustness verdict (#3) and scope limitations (#4). Develop/test novel account addressing your tests.
      *   **Synthesize:** Integrate findings from #3 and #4 into the assessment of #2's prospects. Refine the overall case for/against the solvability of the paradox under realism.

  **State of the Art & Novelty:**

  *   **Settled/Near-Settled:** The *existence* of the paradox of phenomenal judgment under epiphenomenalism is a standard, widely accepted problem (Chalmers, Kriegel, etc.). The fatal flaw of simple **Tracking (#1)** (Surrogate Problem) is well-established.
  *   **Genuinely Contested:**
      *   **Constitutive/Acquaintance (#2):** Whether *any* non-causal constitutive/acquaintance relation is viable (or even coherent) is fiercely debated (objections from Levin, Dennett; defenses by Goff, Chalmers variants). The precise role of causation vs. modality is central but not always explicitly foregrounded as you propose.
      *   **Modal Robustness (#3 Core Issue):** Whether knowledge requires safety/sensitivity (robustness) or just actual reliability is a deep, unresolved debate in epistemology (e.g., Pritchard vs. Sosa), *especially* applied to phenomenal knowledge under epiphenomenalism. *Your application of the "perturbation test" here is a sharp framing.*
      *   **Scope (#4 - Argumentative Generalization):** While the vulnerability of 1st-person knowledge is standard, the *generalization to the anti-physicalist arguments themselves* is less systematically explored. Some mention it (e.g., Chalmers gestures at it), but a sustained analysis treating those arguments *as phenomenal judgments subject to the same epistemic constraints* is novel and high-impact. *This is your most original and upstream contribution; expect debate.*
  *   **Going Out on a Limb/Under-explored:**
      *   Prioritizing and rigorously developing the **Common-Cause Reply (#3)** as a distinct, viable option deserving focused analysis (beyond being a foil) is relatively novel. Your "perturbation test" framework is key here.
      *   The systematic application of the **Grain Test** across all replies is insightful and not universal practice.
      *   The **Argumentative Generalization** within Scope (#4) is underdeveloped and high-stakes. *This is where your limb is strongest and potentially most fruitful.*

  **What Moves Items Up/Down:**

  *   **#4 Up:** Early consensus (e.g., conference feedback, pre-print engagement) that the argumentative generalization is compelling and devastating. Discovery of new, clear parallels between 1st-person and theoretical judgments warrant.
  *   **#4 Down:** Strong counter-arguments showing the structure of anti-physicalist arguments inherently insulates them from the paradox *even if* 1st-person judgments are vulnerable.
  *   **#3 Up:** Development of a compelling formal model showing robust fine-grained correlation under natural necessity. A significant shift in epistemological consensus towards actual reliability sufficing.
  *   **#3 Down:** A powerful new argument demonstrating that knowledge *must* be modally robust, making Common-Cause insufficient.
  *   **#2 Up:** A breakthrough conceptual analysis resolving the non-causal acquaintance/metaphysics problem in a widely persuasive way. #3 showing robustness *isn't* required significantly lowers the bar.
  *   **#2 Down:** Persistent inability to formulate a non-question-begging account of non-causal acquaintance. #3 showing robustness *is* required makes success nearly impossible. #4 showing generalization makes #2 irrelevant.

  This agenda prioritizes foundational, high-leverage questions (#4, #3) while tackling the most promising but challenging positive solution (#2), explicitly dropping unfruitful paths (#1) and tangential dissolution strategies (#5). It leverages your key insights (Scope generalization, Perturbation Test, Grain Test) while grounding them in recognized problems and debates.
