  ### 1. Setup and materials — about 150 words  
  **State space**: Four possible states of two independent fair coins: Ω = {HH, HT, TH, TT}, each with prior probability 0.25.  
  **Information partitions**:  
  - Alice observes Coin 1 (C1): She knows if it’s H (states HH, HT) or T (states TH, TT).  
  - Bob observes Coin 2 (C2): He knows if it’s H (states HH, TH) or T (states HT, TT).  
  **Event E**: "Both coins are heads" (i.e., state HH).  
  **Materials**:  
  - **Cards**: For each participant pair (Alice/Bob), one card per role. Alice’s card lists: "You see C1: if H, P(E)=0.5; if T, P(E)=0". Bob’s card: "You see C2: if H, P(E)=0.5; if T, P(E)=0".  
  - **State cards**: Four index cards labeled HH, HT, TH, TT (one per pair, secretly assigned).  
  - **Public record sheet**: Grid for recording announcements per round (rows for pairs, columns for rounds).  
  - **Scoring tokens**: Non-monetary points (e.g., poker chips) for accuracy rewards.  

  ### 2. Rules, vocabulary, and payoffs — about 450 words  
  **Coarse vocabulary phase (first two rounds)**:  
  - Announcements restricted to: "low" (P=0–0.33), "medium" (P=0.34–0.66), or "high" (P=0.67–1).  
  - **Reason for grain**: Coarseness prevents full information transfer, enabling persistent disagreement (e.g., "medium" masks 0.5, hiding whether C1 or C2 is H).  
  **Exact vocabulary phase (next two rounds)**:  
  - Announcements must be exact probabilities (0, 0.5, or 1).  
  **Betting phase (final round)**:  
  - Before announcing probabilities, each pair is asked: "Would you accept a bet on E at 0.5 odds?" (Yes/No recorded publicly).  
  - **Purpose**: To reveal that mutual willingness to bet at shared odds implies agreement on probability (even if unstated).  
  **Exchange rules**:  
  1. Pairs (Alice/Bob) privately view their state card and calculate initial P(E) using their card.  
  2. **Rounds 1–2 (coarse)**: Simultaneously announce coarse category (e.g., "medium" for 0.5).  
  3. Update beliefs: After each announcement, recalculate P(E) using their info + partner’s announcement.  
  4. **Rounds 3–4 (exact)**: Announce exact probability.  
  5. **Round 5 (betting)**: Record bet willingness before announcing exact probability.  
  **Pairing and re-pairing**:  
  - Fixed pairs for all rounds to maintain context. Randomly assign 7 pairs at start.  
  **Scoring with quadratic scoring rule**:  
  - Points = 1 - (assigned P - truth)², where truth=1 if E true, 0 otherwise.  
  - **Why this rule**: It rewards accuracy (not confidence) and incentivizes honest reporting—deviations from true belief reduce points. Max 1 point per round.  

  ### 3. Timeline — about 200 words  
  - **0–5 min**: Distribute materials, assign roles/pairs, explain state space and P(E). Emphasize: "Update beliefs after each announcement using all public info."  
  - **5–15 min**: **Round 1 (coarse)**. Pairs calculate initial P(E), announce coarse category. Record on sheet.  
  - **15–25 min**: **Round 2 (coarse)**. Update P(E), announce coarse again. Highlight disagreements (e.g., HT pair: Alice "medium", Bob "low").  
  - **25–35 min**: **Round 3 (exact)**. Switch to exact announcements. Update and announce (e.g., HH pair both say 0.5).  
  - **35–45 min**: **Round 4 (exact)**. Update and announce (e.g., HH pair updates to 1).  
  - **45–55 min**: **Betting phase**. Ask: "Bet on E at 0.5?" Record answers. Then announce exact P(E).  
  - **55–65 min**: Calculate scores. Award tokens (e.g., 0.8 points if P=0.5 in HH).  
  - **65–75 min**: Debrief (see below).  

  ### 4. Debrief — about 450 words  
  - **Coarse phase disagreement**: Point to HT/TH pairs who announced "medium"/"low" repeatedly (e.g., HT: Alice "medium", Bob "low" in Rounds 1–2). *Mapping*: Shows coarse vocabulary can sustain disagreement despite updates—information is too vague to force agreement.  
  - **Exact phase convergence**: Highlight HH pairs who moved from "medium" (Round 2) to 0.5 (Round 3) to 1 (Round 4). *Mapping*: Exact announcements enable full updating—Alice/Bob infer each other’s coin from "0.5", revealing state and forcing agreement.  
  - **Betting instinct**: Note when pairs said "yes" to betting at 0.5 in HH (before announcing 1). *Mapping*: Willingness to bet at shared odds implies agreeing E is 50% likely—which is agreeing to disagree about the true probability (0.25), but the theorem forbids this under common knowledge.  
  - **For your friend**: "Your objection rightly notes people often disagree despite exchanging opinions, proving the theorem’s assumptions (common priors, common knowledge of updates) are empirically rare. But it stops short because the theorem isn’t predictive—it’s normative. It shows disagreement *cannot persist* under those assumptions if *enough* information is shared. What we observe isn’t a failure of the theorem but of its preconditions: vocabularies are coarse, and common knowledge is fragile. The value is in identifying *why* disagreement endures—not in expecting convergence, but in seeing how little prevents it."  

  ### 5. Failure modes — about 200 words  
  - **Misupdating**: Participants might not update beliefs correctly after announcements (e.g., in HH, Bob hears "medium" but doesn’t infer Alice’s coin). *Fix*: Walk through one pair’s calculation publicly during the coarse phase. Use a simple example: "Alice says ‘medium’—what does that tell Bob about C1?"  
  - **Betting confusion**: Participants may conflate betting odds with probability announcements. *Fix*: Stress that betting is a separate step; record willingness *before* revealing probabilities.  
  - **Time crunch**: Updating may lag. *Fix*: Pause after Round 2 to recap: "In HT, Alice knows C1=H. Bob said ‘low’—what must C2 be?"  
  - **Pair imbalance**: Uneven engagement in pairs. *Fix*: Assign roles clearly; circulate to prompt quieter members.  

  ### 6. What the activity cannot show — about 200 words  
  The activity cannot reproduce the **common knowledge** requirement. Participants infer information sequentially from announcements, but true common knowledge (infinite recursion of "I know that you know...") is unrealizable in a finite game. Here, announcements are public but not infinitely nested—e.g., in HH, Round 3 announcements ("0.5") let them update to agreement, but only after two rounds of coarse talk. The theorem assumes common knowledge emerges instantly; the activity shows it’s built iteratively. In debrief, explicitly state: "In reality, common knowledge is an idealization. The activity simulates *repeated* sharing, but the theorem requires that all levels of mutual knowledge are installed at once. This is why we need the phrase ‘common knowledge’—it’s the invisible engine that the activity approximates but cannot fully embody."
