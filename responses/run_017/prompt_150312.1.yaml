prompt: |-
  I'm applying for a one-year dissertation fellowship and need a two-page proposal for a project sitting between immigration ethics and the theory of the welfare state. My half-formed idea: the familiar argument that a generous welfare state requires bounded membership treats membership as binary and instantaneous — you are either in or out, and once you are in you are in all the way. I want to unbundle it. Residence, labour-market access, contributory insurance (unemployment, pensions), and non-contributory transfers could each vest at a different point, the way employee benefits vest on a schedule. Once timing is a policy variable, the standard positions look mis-specified: because a migrant's lifecycle fiscal balance is driven mainly by age at arrival, open entry combined with late vesting of non-contributory transfers may be fiscally indistinguishable from a closed, points-based regime while being morally unrecognisable to both sides — which suggests either that the fiscal objection to open borders was never really about numbers, or that openness has been defended on the wrong axis. One complication to keep in view: a long probationary tier may itself undermine integration, so the result may be a real trade-off between fiscal defensibility and the second-class-status objection rather than a free lunch.

  Turn this into a proposal. State the question so that it has a determinate answer even though it cannot be settled empirically here. Say why the open-borders position, the bounded-membership position, and the integrationist objection each fail to settle it. Give the method: what I would actually do, quarter by quarter, across twelve months, and why that method rather than either modelling fiscal effects or writing straight normative theory. Say what the possible conclusions are, which considerations would decide between them, and what would count as the project failing. Be honest about scope, including what I should cut if it turns out to be two projects. I will supply citations myself, so include no bibliography and no named literature.

  Sections, in order: Question (about 150 words), Why the existing positions leave it open (about 300), Method and timeline (about 400), Results and failure conditions (about 250), Scope and risks (about 150).
