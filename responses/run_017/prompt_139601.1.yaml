  ### **Logical Space Mapping**
  The tree has 8 binary nodes, defining 256 possible paths (2^8). Only 9 paths are occupied by the named positions. Unoccupied paths are due to inconsistencies or unattractive views:
  - **Incoherent (85% of empty cells):** Conflicts with the starting premise (e.g., denying micro-determination at T fixes T+1) or logical contradictions (e.g., claiming symbols cause in clamped case but not requiring self-reference for efficacy).
  - **Unattractive (10%):** Positions that are implausible or self-undermining (e.g., "symbols cause but only in counterfeit systems").
