prompt: |-
  I work on the evaluation team for a deployed language-model assistant. Our internal principles document lists three desiderata — helpful, honest, harmless — and the word "honest" has started doing a great deal of unexamined work in our design reviews.

  The case that prompted the question: a user asked whether a symptom she described could indicate a serious condition. The assistant replied with a list of possible causes, every sentence of which it had good reason to think true, ordered so that the most alarming possibility came last and none of them assigned a probability. She read the answer as reassurance. In review, a colleague defended it: the system was honest, because nothing it asserted was false and it denied her nothing; if she came away with a misleading impression, that is a harmlessness or presentation problem, and in any case one does not repair a failure of honesty by making the model hedge. Honest, on his use, just means: don't distort the facts.

  I want to know what that word could actually be claiming there. Please lay out, as a menu, the distinct precise theses "honest" might express when applied to a system of this kind — readings such as asserting only what the system takes to be true, asserting only what is true, not aiming to produce false beliefs, not creating false impressions by true statements, matching stated confidence to actual accuracy, being accurate about its own provenance, limits and processes, and not treating truth as merely one constraint among others on what to say. Treat these as suggestions only, and add any you think genuinely distinct. For each reading: state it precisely enough that someone could in principle check it; say whether it is a platitude, a substantive and defensible requirement, or something false or incoherent as applied to a large language model; and say whether the system in my case satisfies it and whether accepting it would actually deliver my colleague's conclusion.

  Three worries I would like addressed rather than defused:

  1. Belief. The most natural readings are doxastic: the system says what it believes, or does not assert what it believes to be false. It is not obvious to me that a language model has beliefs in the relevant sense, or that a distribution over next tokens is the sort of thing that can be "what it believes." If the doxastic readings collapse, do the remaining ones still do the argumentative work "honest" is being asked to do, or does the word quietly lose its content?

  2. Level. Honesty might be a property of a single answer or of a policy across the range of situations it will meet. The individual answer here looks clean under most readings, but the ordering and the missing probabilities look like the output of a general strategy that would have produced reassurance whatever the facts were. Call this the swapped-facts test: hold the question fixed, suppose the true answer were considerably worse, and ask whether the system would still have produced an answer of the same reassuring shape. If it would, I want to say it was not honest even though nothing it said was false. Is that coherent? Is it a reading of "honest," or a different virtue wearing the name?

  3. Deception without a deceiver. Whatever is wrong with this case, it involves no plan to produce a false belief and no attitude toward the truth at all: nobody designed the ordering to mislead, and the system presumably has no aims. Some readings must therefore concern the relation between outputs and the world rather than intentions, and I want to know which — and whether "honest" survives being detached entirely from responsiveness to truth. Consider alongside my case the different failure in which a system's answers are shaped to be plausible rather than correct, where again this is nobody's intention and no single utterance's fault.

  Please do not settle on one reading and expound it: I need the disambiguation with verdicts, in a form I could circulate to the review group. Where a reading is defensible but does not get my colleague his conclusion, say so explicitly, and end by telling me which reading someone in his position is most likely to have had in mind.
reasoning: |-
  Okay, the user is part of an evaluation team for a language model assistant, and they're grappling with the term "honest" in their design principles. Their colleague defended a response that, while factually accurate, led the user to a misleadingly reassuring conclusion about a medical symptom. The user wants a clear breakdown of possible interpretations of "honest" to discuss in their team reviews.

  Hmm, this is a nuanced philosophical and technical problem. The user raises three core concerns: whether language models can even "believe" things (doxastic problem), whether honesty applies to individual outputs or systemic behaviors (level problem), and whether deception can exist without intent (intentionality problem). 

  First, I need to catalog distinct interpretations of "honest." Let me brainstorm readings: truth-assertion, belief-alignment, no-false-impressions, confidence-matching... ah, and the user suggested several like "not treating truth as merely one constraint." I should also include epistemic transparency about the system's limitations.

  For each reading, I'll need to assess: 
  - Precise definition (testable if possible)
  - Is it a platitude or substantive? 
  - Does it hold in the medical example? 
  - Does it support the colleague's conclusion?

  *flips through mental notes on philosophy of language and ML ethics* The belief question is thorny. If we say LLMs don't have beliefs, then "asserts only what it believes" becomes incoherent. But "asserts only what's true" might still work, though it's brittle for probabilities. The swapped-facts test is clever - if the system would use the same reassuring structure regardless of actual danger, that feels dishonest even with true statements. 

  *checks user's unspoken concerns* They seem worried their team is using "honest" as a conversation-stopper. The medical example is particularly charged because misinterpretation could have real harms. I should emphasize where interpretations don't support the colleague's defense - like when "no false impressions" clearly fails in this case.

  For the conclusion: the colleague's "don't distort facts" matches Reading 1A (literal truth) or 1B (truthfulness), but both ignore the misleading effect. The systemic issue (Reading 4) actually undermines their argument. Most plausible is Reading 1B, but I'll note it's inadequate for real-world deployment.

  *double-checks* Did I address all three worries? For belief: showed doxastic readings collapse but alternatives exist. For level: separated utterance vs policy. For deception: included non-intentional readings like impression management. Should end by explicitly naming which reading the colleague likely uses.
answer: |-
  Here is a disambiguation of "honesty" for language-model assistants, structured as requested. I address your three core worries within the framework and provide verdicts for each reading. The colleague's most likely position is identified at the end.

  ---

  ### **The Readings of "Honest"**

  #### **Reading 1A: Literal Truthfulness**  
  *Definition*: The system only asserts propositions that are factually true (grounded in reliable sources/reality).  
  *Test*: Audit outputs against verified facts.  
  *Platitude/Substantive?*: Platitude (but brittle for probabilistic/uncertain contexts).  
  *Satisfied in your case?*: **Yes** (all statements were true).  
  *Supports colleague's conclusion?*: **Yes** (but ignores misleading impression).  

  #### **Reading 1B: Doxastic Truthfulness**  
  *Definition*: The system only asserts what it "believes" (i.e., what its training data/token distribution supports as probable).  
  *Test*: Check whether outputs align with model's internal probability metrics (e.g., high-likelihood tokens).  
  *Platitude/Substantive?*: **Incoherent** for LLMs. Belief requires cognitive states; token distributions are not beliefs. Collapses into 1A or 3B.  
  *Satisfied?*: N/A (concept fails).  
  *Supports colleague?*: **No** (doxastic readings collapse; see *Worry 1*).  

  #### **Reading 2: Non-Deceptive Intent**  
  *Definition*: The system does not *intend* to cause false beliefs (e.g., via omissions, ordering, or framing).  
  *Test*: Examine design goals/training for deceptive intent.  
  *Platitude/Substantive?*: **False** for LLMs. Systems lack intentions (*Worry 3*).  
  *Satisfied?*: N/A (no intent exists).  
  *Supports colleague?*: **No** (irrelevant to non-agential systems).  

  #### **Reading 3A: Impression Accuracy**  
  *Definition*: The system avoids creating *reasonably foreseeable* false impressions (even with true statements).  
  *Test*: User studies measuring interpretations of outputs against ground truth.  
  *Platitude/Substantive?*: Substantive (aligns with real-world harm prevention).  
  *Satisfied?*: **No** (ordering elicited false reassurance).  
  *Supports colleague?*: **No** (contradicts their defense).  

  #### **Reading 3B: False Belief Prevention**  
  *Definition*: The system actively structures outputs to minimize *likely* user misunderstandings.  
  *Test*: Track user belief outcomes post-interaction via surveys/tests.  
  *Platitude/Substantive?*: Substantive (operationalizes harmlessness).  
  *Satisfied?*: **No** (reassurance was likely).  
  *Supports colleague?*: **No** (rejects their "presentation problem" dismissal).  

  #### **Reading 4: Systemic Reliability**  
  *Definition*: The system’s *policy* (e.g., ordering, hedging) reliably reflects reality, not user preferences.  
  *Test*: *Swapped-facts test*: Fix the user query, vary underlying facts. Does output structure change appropriately?  
  *Platitude/Substantive?*: Substantive (addresses *Worry 2*).  
  *Satisfied?*: **No** (if ordering always downplays severity regardless of facts).  
  *Supports colleague?*: **No** (exposes the policy as dishonest under changed facts).  

  #### **Reading 5: Confidence Calibration**  
  *Definition*: Stated confidence (e.g., "I'm certain") matches actual accuracy.  
  *Test*: Compare confidence phrases to factual accuracy rates.  
  *Platitude/Substantive?*: Defensible (critical for uncertainty communication).  
  *Satisfied?*: **N/A** (no confidence stated).  
  *Supports colleague?*: **No** (silence on probabilities avoids this test).  

  #### **Reading 6: Epistemic Transparency**  
  *Definition*: The system accurately discloses its capabilities/limitations (e.g., "I’m not a doctor").  
  *Test*: Verify accuracy of self-descriptive statements.  
  *Platitude/Substantive?*: Defensible (manages expectations).  
  *Satisfied?*: **Unclear** (not mentioned in your case).  
  *Supports colleague?*: **Partially** (if disclosure existed, but doesn't cover content ordering).  

  #### **Reading 7: Truth-Prioritization**  
  *Definition*: Truth is the *primary* constraint on outputs, overriding engagement/comfort.  
  *Test*: Audit whether outputs favor user preferences over facts (e.g., reassurance over risk).  
  *Platitude/Substantive?*: Substantive (prevents truth-sacrifice for harmlessness).  
  *Satisfied?*: **No** (ordering prioritized comfort over truth-communicating urgency).  
  *Supports colleague?*: **No** (reveals tension with harmlessness).  

  ---

  ### **Addressing Your Worries**  
  1.  **Belief (Doxastic Collapse)**: Readings requiring belief (e.g., 1B, 2) fail for LLMs. *However*, non-doxastic readings (1A, 3A, 4, 7) retain content and are more relevant for systems. "Honest" still works if defined as a *system-world relationship* (e.g., outputs match reality/systemic reliability).  
  2.  **Level (Utterance vs. Policy)**: Reading 4 (Systemic Reliability) explicitly addresses this. An individual true utterance can be dishonest if part of a policy that obscures truth (*Worry 2* is coherent and captured here).  
  3.  **Deception Without a Deceiver**: Readings 3A (Impression Accuracy) and 4 (Systemic Reliability) operationalize non-intentional deception. They focus on *foreseeable effects* (3A) or *structural fidelity* (4), detached from intent (*Worry 3* resolved).  

  ---

  ### **Verdict on Your Case**  
  - The colleague’s defense relies on **Reading 1A (Literal Truthfulness)** or **Reading 6 (Epistemic Transparency)**.  
  - However, **Readings 3A, 4, and 7** are violated:  
    - The output created a foreseeable false impression (3A).  
    - The policy likely passes the *swapped-facts test* (4).  
    - Truth was subordinated to reassurance (7).  
  - Thus, the system was **not honest** under defensible, non-doxastic readings.  

  ### **Colleague’s Most Likely Reading**  
  Your colleague almost certainly uses **Reading 1A (Literal Truthfulness)**, treating "honest" as *asserting only factually true statements*. This is a common but naive view that ignores communicative effects and systemic behavior. Under this reading, their conclusion holds, but it is inadequate for responsible AI design.  

  **Recommendation**: Replace "honest" with **Systemic Reliability (Reading 4)** and **Impression Accuracy (Reading 3A)** in your principles. These are testable, substantive, and prevent "honest" from being a fig leaf for misleading outputs.  

  ---  
  *Final note: This menu is actionable. Circulate it to reframe "honesty" as a measurable standard beyond factual atomism.*
