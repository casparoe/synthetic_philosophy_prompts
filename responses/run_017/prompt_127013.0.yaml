    - *Higher-order vagueness*: Adequately handled in Q7 (subvaluationism rejects it) and Q8 (supervaluationism/fuzzy accept it).  

  **Why No Hybrid/Nihilism Splits?**  
  - Nihilism is included at Q1.  
  - Degree-supervaluationism (gaps with degrees) isn't added due to space; it would require a Q9 (e.g., "Can gaps have degrees?"), violating the 8-question limit. It remains unseparated from supervaluationism/fuzzy at Q8.  

