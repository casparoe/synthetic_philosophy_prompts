  Below is the diagnostic instrument you requested: an eight-question decision tree that classifies positions on vagueness based on concrete cases and logical principles, without presupposing knowledge of the literature. The tree is derived from the logical space of the problem, with positions mapped onto it afterward. Key structural branches address sharp boundaries, location of indeterminacy, higher-order vagueness, and Sorites blocking. The three specified cases (uncomputable boundary, object-vs-threshold indeterminacy, cooperative sorting) are integrated as nodes.

  ### **Decision Tree for Vagueness Theories**
  Answer each question based on cases and logical analysis. Proceed to the next question as directed. Glossary terms are defined when first used.

  1. **Sharp Extension**:  
     In a fixed context and time, does a vague predicate (e.g., "tall") have a precise extension (i.e., a definite set of objects it applies to, and a set it does not)?  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q3.  
     *Gloss: "Precise extension" = a binary yes/no membership for every object, like in classical logic.*

  2. **Uncomputable Boundary (Flurg Case)**:  
     Consider "flurg": a predicate that applies to numbers below a specific value defined by an uncomputable function (e.g., Busy Beaver). It has a sharp boundary, but no finite process can locate it. Is "flurg" vague (i.e., does it exhibit genuine indeterminacy)?  
     - **Yes** → *Empty Cell 1* (incoherent: sharp boundary implies no indeterminacy).  
     - **No** → **Epistemicism** (sharp boundaries exist but are unknowable).  
     *Gloss: "Indeterminacy" = cases where there is no fact of the matter about whether the predicate applies.*

  3. **Ontic vs Semantic Source**:  
     Consider two cases:  
     - **B1**: "Tall" applied to precise heights (threshold obscure).  
     - **B2**: "Part of this cloud" applied to misty regions (object indeterminate).  
     Is the vagueness in B2 fundamentally different from B1 (i.e., due to indeterminacy in the world, not just language)?  
     - **Yes** → Go to Q4.  
     - **No** → Go to Q5.  
     *Gloss: "Ontic indeterminacy" = vagueness arises from fuzzy objects/properties, not semantic indecision.*

  4. **Worldly Indeterminacy**:  
     In B2 ("cloud"), is the indeterminacy irreducible to linguistic or epistemic factors (i.e., no possible semantic precisification resolves it)?  
     - **Yes** → **Ontic indeterminacy** (vagueness is worldly).  
     - **No** → *Empty Cell 2* (unattractive: if indeterminacy isn't worldly, B2 shouldn't differ from B1).  

  5. **Cooperative Sorting**:  
     Two competent speakers with slightly different thresholds for "tall" must agree on a shared verdict for a series of people. Can they legitimately converge on a sharp boundary by adjusting conversational context (e.g., negotiating standards)?  
     - **Yes** → Go to Q6.  
     - **No** → Go to Q7.  
     *Gloss: "Context" = external factors (e.g., speaker intentions, practical needs) that fix meaning temporarily.*

  6. **Truth in Context**:  
     When context fixes a sharp boundary, are borderline cases for the predicate eliminated in that context?  
     - **Yes** → **Contextualism** (vagueness reduces to context-relativity).  
     - **No** → *Empty Cell 3* (incoherent: contextualism requires sharp boundaries per context).  

  7. **Higher-Order Borderlines**:  
     Can there be borderline *borderline* cases (i.e., is it indeterminate whether a case is indeterminate)?  
     - **Yes** → Go to Q8.  
     - **No** → **Subvaluationism** (borderline cases are gluts: both true and false).  
     *Gloss: "Glut" = a sentence is both true and false; "borderline borderline" = higher-order vagueness.*

  8. **Truth Value in Borderlines**:  
     In a borderline case, what is the status of "X is tall"?  
     - **Neither true nor false (gap)** → **Supervaluationism** (truth requires truth on all precisifications).  
     - **A degree of truth (e.g., 0.7)** → **Degree-functional/Fuzzy semantics** (truth is a continuum).  
     - **Either true or false, but context hasn't fixed which** → *Unseparated: Contextualism or Supervaluationism* (see Key).  
     *Gloss: "Precisification" = a way of making a vague predicate sharp; "degree of truth" = truth value in [0,1].*

  ---

  ### **Scoring Key**
  Map your answers to a leaf position. Empty cells and unseparated positions are explained below.

  | Path (Q1–Q8 Answers) | Position | How Sorites is Blocked | Higher-Order Vagueness |
  |------------------------|----------|------------------------|------------------------|
  | Y, N | **Epistemicism** | Tolerance premises are false; boundaries are sharp but unknown. | None: all indeterminacy is epistemic (ignorance). |
  | N, Y, Y | **Ontic indeterminacy** | Tolerance is true but non-transitive; objects lack precise boundaries. | Robust: indeterminacy is intrinsic, not semantic. |
  | N, N, Y, Y | **Contextualism** | Tolerance fails across contexts; boundaries shift with context. | Limited: borderline cases are contextually resolved. |
  | N, N, N, N, N | **Subvaluationism** | Modus ponens fails; tolerance is true but conclusions are gluts. | Symmetric: gluts apply at all orders. |
  | N, N, N, N, Y, N | **Supervaluationism** | Tolerance is false; no single precisification validates it. | Unlimited: precisifications can be vague. |
  | N, N, N, N, Y, Y | **Degree-functional/Fuzzy** | Degree of truth diminishes gradually; modus ponens is degree-valid. | Modeled with fuzzy borders of fuzzy sets. |
  | *Any path ending at Q8 "either true or false"* | *Unseparated* | *Contextualism (tolerance false) or Supervaluationism (tolerance false)* | *Contextualism: resolved by context; Supervaluationism: open-ended precisifications* |

  **Added Leaves**:  
  - **Nihilism/Error theory** (from *No* at Q1): Vague predicates lack extensions; "borderline" is incoherent. Blocks Sorites by rejecting vague discourse.  
  - **Degree-supervaluationist hybrid** not added (no room; see "Unseparated" below).  

  **Empty Cells**:  
