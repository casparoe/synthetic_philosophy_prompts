  Based on Priya's established pattern, here's a breakdown of the competing rules that fit her verdicts, predictions for the new proposal, my best guess at her true rule, and a test case to confirm:

  ---

  ### **Rule 1: Anti-Careerism + Real Power ("Term-Limit Absolutism")**
  - **Core Principle**: The *only* evil is political careerism/re-election. Any body with **real power**, **no re-election**, **no prior officeholders**, and **adequate pay** is legitimate—regardless of selection method.
  - **Past Verdicts Explained**:  
    - ✅ Sortition upper chamber (no careerism + power + pay)  
    - ❌ Elected lower house (term limits ≠ no careerism; could ladder up)  
    - ❌ Unpaid sortition assembly ("no teeth" = no real power)  
    - ❌ Appointed experts (renewable terms = careerism)  
    - ✅ Sortition budget office (no careerism + power + pay)  
    - ❌ Sortition convention (re-picking = "veterans" = de facto careerism)  
  - **Prediction for New Proposal**: ✅ **APPROVE**  
    *Why?* It has real power, no re-election, no prior officeholders, and decent pay—perfectly aligns with anti-careerism goals.  

  ---

  ### **Rule 2: Sortition Purism ("Only Randomness Is Legitimate")**
  - **Core Principle**: **Elections are inherently corrupt**—they favor the ambitious, wealthy, and unrepresentative. *Only* sortition bodies can be trusted, provided they have **real power** and **no career incentives** (non-renewable terms, pay to enable service).  
  - **Past Verdicts Explained**:  
    - ✅ Sortition upper chamber (random + power + pay)  
    - ❌ Elected lower house (elected = intrinsically flawed)  
    - ❌ Unpaid sortition assembly ("theater" = no power)  
    - ❌ Appointed experts (not sortition + careerist)  
    - ✅ Sortition budget office (random + power + pay)  
    - ❌ Sortition convention (re-picking risks "professionalization")  
  - **Prediction for New Proposal**: ❌ **REJECT**  
    *Why?* It’s elected—selection by voting is irredeemably flawed. Priya would dismiss it as "**ambition theater**" or "**elected aristocracy**," arguing it still attracts power-seekers, not ordinary citizens.  

  ---

  ### **Rule 3: Systemic Corruption Focus ("Elections Are Structurally Poisoned")**
  - **Core Principle**: Elections aren’t *just* about careerism—they **distort representation** by design (campaigning, fundraising, charisma contests). Sortition is the *only* way to achieve true descriptive representation. Term limits on elected bodies are bandaids on a broken system.  
  - **Prediction for New Proposal**: ❌ **REJECT**  
    *Why?* Identical to Rule 2 but emphasizes that elections *always* produce elites, even with term limits. Priya might call this "**cosmetic anti-politics**."  

  ---

  ### **Best Guess: Priya is a Sortition Purist (Rule 2)**  
  **Why?**  
  - She consistently **rejects all non-sortition bodies**, even those with term limits (e.g., elected lower house) or anti-careerist designs (appointed experts).  
  - She **only approves bodies using sortition**—but rejects those without power ("sortition theater") or with re-selection risks ("veterans").  
  - Her "career ladder" comment implies elections *create* perverse incentives, not just enable careerism.  
  - **Key evidence**: She approved the **sortition budget office** (single term, pay, power) but would reject this **elected council** with identical anti-careerism features. That’s the litmus test.  

  **Predicted Verdict for Elected Council**:  
  > **"No. This is just a gilded cage for aspiring oligarchs. Elections filter for narcissists and networkers, not citizens. Without sortition, you’re preserving the disease and calling it a cure."**  

  ---

  ### **Test Case to Tease Apart Rule 1 vs. Rule 2**  
  Propose this hypothetical:  
  > **A *sortition-based* body with real legislative power, non-renewable 1-year terms, and *no salary* (only reimbursements for expenses).**  

  - **Rule 1 (Anti-Careerism + Power) Prediction**: ❌ **REJECT**  
    *Why?* No salary = only the wealthy can serve = de facto elitism. Power without pay fails the "real power" test (like her "sortition theater" rejection).  
  - **Rule 2 (Sortition Purism) Prediction**: ✅ **APPROVE**  
    *Why?* Legitimacy comes from sortition + power. Pay is pragmatic but secondary; unpaid juries are legitimate. She’d argue, "**It’s imperfect, but the people’s voice isn’t for sale**."  

  **If Priya rejects it**, she’s likely Rule 1 (prioritizing pay + power). **If she approves it**, she’s Rule 2 (prioritizing sortition above all).  

  #### Secondary Test:  
  > **An *elected* body with a single non-renewable term, real power, and salary—but *no ban on former officeholders*.**  

  - **Rule 1 Prediction**: ❌ **REJECT** ("Careerists will infest it via revolving doors!")  
  - **Rule 2 Prediction**: ❌ **REJECT** ("Still elected!")  
  *(Less discriminating but confirms elections are non-negotiable)*  

  ---

  ### Final Thought  
  Priya’s stance seems rooted in **deep skepticism of electoralism itself**, not just careerism. The test case above will force her to choose between **pragmatic inclusion** (pay enables non-wealthy participants) and **ideological purity** (sortition alone = legitimacy). If she picks purity, brace for a veto!
