  ### Calibration Notes and Measure Revisions
  **Replicator Criteria:** For a Darwinian model to apply, units must exhibit heritable variation (lineages with modification), differential persistence/spread due to intrinsic properties, and minimal reconstruction/convergence. Evidence of descent requires traceable lineages with branching/modification in the corpus, not functional reinvention.

  **Measure Revisions:**  
  - **R (Registry Fidelity): Keep.** Captures environmental inheritance machinery well.  
  - **B (Bottleneck Width): Revise.** Ambiguous between local and global extinction; redefine as: "Minimum bearers required to maintain a lineage in the observed population without external storage." Use integers (1=narrow) or "effectively unbounded."  
  - **P (Reconstructive Repair): Replace.** Circular; conflates lineage survival with replicator status. Substitute: **Inferential Robustness (I), 0–10** – *Likelihood the unit's function (not form) can be replicated from its output alone, enabling convergence.* Low I favors Darwinian models.  
  - **D (Fitness Decoupling): Keep.** Critical for distinguishing selection-for-transmission from utility.  

  **Hardest Calls:**  
  - **Sourdough:** Symbiosis with microbial replicators blurs unit boundaries; scoring assumes microbial culture is part of the unit.  
  - **Fiddle Tune:** High variation from improvisation vs. faithful oral transmission; depends on whether ornamentation is coded as essential.  

  **Actively Misleading Framework:**  
  - **Sourdough:** Darwinian model distorts by separating cultural routine from microbial symbiont. Substitute **Dual-Inheritance Coevolution** (tracking cultural instructions and biological replicators jointly).  

