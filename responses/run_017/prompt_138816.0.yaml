prompt: |-
  I sit on the clinical ethics committee of a mid-sized community hospital, and over the past two years I have kept running into the same shape of case, for which I have no word. The categories we were trained to reach for — ask what the patient would have wanted, ask what serves her interests now, ask who has been appointed to speak for her — each seem to slice slightly off the mark. Three cases, all involving patients in roughly the same condition: advanced dementia, no real conversation, apparently content, no prospect of recovery. First: a woman who, while still sharp, signed a document saying that if she ever reached such a state she did not want antibiotics or a transfer to hospital for an infection. We honored it, and the reasoning felt settled. Second: a man who, while still sharp, signed a document saying that if he ever reached such a state he wanted everything done, and that he did not want anyone to tell him his life was not worth living. We treated it as evidence about his values and not much more; the clinicians still spoke of treatment that was not beneficial. Third: a woman who, while still sharp and knowing her values might shift, signed a document saying that whatever she seemed to want at the time should settle the matter, as though she had appointed her later self to decide for her, and that she gave up in advance any claim to override that later self. Nobody would touch it. Had she named her sister instead, the sister's word would have bound us.

  The pattern I think I am seeing is that the authority here runs in one direction only. A person can bind her later self, and the binding survives even the later person's explicit repudiation — the demented woman who says, I don't know who wrote that, that isn't me, I want to live, is still overruled by the document, and we do not find that monstrous. What she apparently cannot do is release her later self, or hand her the decision. Notice that this is not a refusal to let the document refer to the later person at all: clauses that make her later *condition* the trigger — if I am in pain, if I no longer respond to music, if there is no reasonable hope — are perfectly ordinary and perfectly honored. It is specifically the later person's *say-so* that cannot be made load-bearing. A colleague's explanation is that the later self simply lacks the capacity to hold authority, whereas a named proxy has it, and that is all there is to it. That cannot be the whole story: we do let people in this condition settle plenty of matters by their current say-so (whether to get out of bed, whether to see a visitor, whether to finish a meal), so the later self is not voiceless; the whole point of these documents is to extend a person's say past the point where she can speak for herself, so "she cannot speak for herself" is the puzzle rather than the solution; and it does not explain why the same incapacity blocks a clause deferring to her choice while permitting a clause deferring to her condition.

  So: does this asymmetry have a name? I mean both the one-way flow (the earlier self can restrict and cannot empower) and the condition-versus-say-so contrast, if they are indeed one phenomenon and not two. If there is an established concept, I would want to know exactly how it is delimited and how it differs from the neighbouring ideas it is likely to be confused with — the general device of arranging in advance not to be given what you will later ask for, the doctrine that the person who signed is the one whose values should govern even after she has changed, and the practice of reconstructing what she would have wanted. If there is none, I would want a term coined with a definition and some boundary cases, including this one: whether the answer changes when the later person's say-so is precisely about whether the earlier person was her. A bare label will not help me; I need to know what the phenomenon is, what it is not, where its edges lie, and whether the right frame for thinking about it is rights, or authority, or something more like a trust held for someone else's benefit. And I would much rather have the analysis than a reading list — I can find the literature myself, but I cannot find the distinction if I do not know what it is called.
reasoning: |-
  Okay, the user is part of a clinical ethics committee at a hospital and they're dealing with recurring cases involving patients with advanced dementia. They've noticed a pattern in how advance directives are handled, specifically an asymmetry: earlier directives that restrict treatment are honored, but directives that try to empower the future self are not. They want to know if this asymmetry has a name, how it's defined, and how it differs from related concepts.

  First, I need to unpack the user's three cases. The first case follows the standard approach: a patient's prior directive refusing treatment is respected even if the current self might want otherwise. The second case shows that a directive requesting all possible treatment isn't binding if clinicians deem it non-beneficial. The third case is the sticking point—where a patient explicitly stated that her future self's preferences should decide, but the committee rejected this. 

  The user points out that the asymmetry lies in authority flowing only one way: the past self can bind the future self, but not empower it. They also note that directives referencing the future self's condition (e.g., pain levels) are valid, but those referencing the future self's explicit preferences are not. Their colleague’s explanation about capacity doesn't hold up because these patients can make some decisions (like daily activities), so it's not about total incapacity.

  The user is looking for a conceptual framework to understand this phenomenon. They need precise distinctions between different ethical concepts like Ulysses contracts, precedent autonomy, substituted judgment, and best interests. The key here is the authority structure: why can't the future self be given decision-making power via an advance directive? 

  I recall that in legal and ethical frameworks, the principle of precedent autonomy allows past directives to override current wishes. But empowering the future self is trickier. The future self in dementia might lack the capacity for autonomous decisions, which is why proxies are appointed—they're seen as capable of exercising substituted judgment. The future self's expressions are treated as preferences, not autonomous decisions. 

  The condition vs. say-so contrast is crucial. Conditions are objective triggers that don't require the patient to demonstrate capacity. The say-so requires current autonomy, which is compromised. The term "asymmetric authority transmission" comes to mind. This needs to be differentiated from Ulysses contracts, which are about binding oneself against future weakness of will, not transferring authority.

  Boundary cases to consider: What if the future self can clearly communicate and asserts identity continuity? The user's case where the patient rejects the past self's identity is relevant. Even then, the law usually upholds the directive, treating identity change as irrelevant. This reinforces that the binding is based on the past self's autonomy, not identity continuity.

  The user likely needs this framework to advise their committee, draft policies, or navigate similar cases. They might also be seeking validation that the asymmetry is recognized elsewhere, reducing moral distress. By providing a structured analysis with terms like "asymmetric authority transmission," I can help them articulate the underlying principles and justify decisions in ethically ambiguous situations.
answer: |-
  This asymmetry is a profound and undertheorized phenomenon in medical ethics and biojurisprudence. While no single established term captures it entirely, the core concept is **Asymmetric Authority Transmission in Precedent Autonomy**.

  ### The Phenomenon Explained
  1. **The One-Way Binding (Restriction vs. Empowerment)**  
     - **Restriction (Honored):** The earlier self can impose limits on future care (Case 1). This aligns with the doctrine of **precedent autonomy**: the competent past self’s values govern the incapacitated future self.  
     - **Empowerment (Rejected):** The earlier self cannot delegate authority *to* the future self (Case 3). The future self lacks **normative agency**—the capacity to exercise autonomous decision-making authority—due to cognitive incapacity.  

  2. **Condition vs. Say-So**  
     - **Condition (Honored):** Objective triggers (e.g., "if I cannot recognize family") are verifiable facts. They operationalize the *past self’s instructions* without requiring the future self’s agency.  
     - **Say-So (Rejected):** Subjective preferences expressed by the future self (e.g., "I want treatment") are treated as non-autonomous expressions. They lack **deliberative weight** because dementia impairs understanding, continuity of identity, and value coherence.  

  ### Why the Asymmetry Exists
  - **Moral Ground:** Precedent autonomy rests on respecting the *whole-life narrative*. Restricting treatment honors the past self’s coherent worldview. Empowering the future self risks surrendering to fragmented, pathology-driven preferences.  
  - **Legal Hedge:** Recognizing the future self’s "say-so" creates liability risks. How do we verify its authenticity? What if the future self contradicts multiple past directives?  
  - **Proxy Distinction:** A named surrogate (e.g., the sister) is *externally accountable* and tasked with **substituted judgment** (channeling the past self’s values). The future self cannot fulfill this role—it *is* the subject of the decision.  

  ### Key Distinctions from Neighboring Concepts
  | Concept              | How It Relates                          | How It Differs                                  |
  |----------------------|-----------------------------------------|------------------------------------------------|
  | **Ulysses Contract** | Binding oneself against future weakness | Addresses *weakness of will*, not incapacity. Future self retains agency (e.g., addiction). |
  | **Precedent Autonomy** | Foundation for honoring restrictions | Does not explain why empowerment clauses fail—assumes past self’s primacy. |
  | **Substituted Judgment** | Used by proxies to channel past wishes | Requires an external agent; future self cannot perform this role. |
  | **Best Interests Standard** | Fallback when directives are silent | Asymmetric cases *have* directives; the issue is validity of empowerment clauses. |

  ### Boundary Cases & Implications
  1. **Identity Repudiation ("That isn’t me!")**:  
     Even if the future self disavows the past self (Case 1), precedent autonomy typically prevails. Ethically, the past self’s values are seen as "truer" to the person’s enduring identity.  

  2. **Fluctuating Capacity**:  
     If a dementia patient has lucid intervals, can their say-so override their own directive? Asymmetry persists: unless they formally revoke the directive (which requires competence), the *restrictive* directive still binds.  

  3. **Conditional Empowerment**:  
     What if the directive said, "Defer to my future self *only if* two physicians confirm capacity"? This might be testable, but clinics reject it due to:  
     - **Practicality**: Capacity assessments in advanced dementia are unreliable.  
     - **Normative Risk**: The "self" being assessed is already altered by disease.  

  ### Proposed Terminology
  - **Core Term**: **Asymmetric Authority Transmission** (AAT)  
  - **Definition**: *The ethical-legal principle permitting advance directives to restrict future care options for incapacitated patients, while invalidating directives that delegate decision-making authority to the patient’s future incapacitated self.*  

  ### Why "Trusts" or "Rights" Frameworks Fail
  - **Rights-Based View**: If autonomy is a right, why can’t it be waived in advance? AAT reveals autonomy is not just a right but a *capacity-bound authority*.  
  - **Trust Analogy**: Viewing the future self as a "beneficiary" doesn’t work—the future self can’t be both beneficiary and trustee.  

  ### Practical Resolution
  In Case 3, the committee was right to reject the directive. The patient’s attempt was philosophically coherent but legally and ethically untenable under AAT. The solution? Advise patients to:  
  1. Appoint a proxy instructed to honor the *current* self’s preferences, or  
  2. Use **condition-based triggers** (e.g., "if I cannot articulate coherent preferences, withhold treatment").  

  This asymmetry is not a flaw but a feature of how we navigate identity, autonomy, and time. It protects the lifelong self from the fragmentary self—a necessary, if unsettling, ethical safeguard.
