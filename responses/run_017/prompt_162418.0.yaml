  Okay, the user is involved in a local history society and a philosophy of history reading group. They've been through Carr and Ranke, and Hayden White is coming up. Their main query is about a pattern they've noticed in history books: two books on the same event can agree on all the factual details but tell completely different stories based on selection, emphasis, and narrative structure. Specifically, they're puzzled by how authors can add missing facts in revised editions without changing the overall narrative. They want to know if there's a term for this "absorption property" and related concepts.

  First, I need to unpack their core observation. They mention selection (what's included), emphasis (how much space is given), and narrative structure (the story's shape). The key is that adding facts doesn't alter the narrative—it's absorbed. This seems distinct from underdetermination in science because historical narratives don't get overturned by new facts in the same way.

  They're also distinguishing between factual correction and narrative change. The user is looking for established concepts but hasn't found any that fit perfectly. They want to avoid oversimplification like "narratives have shapes." So, I should explore related ideas in philosophy of history and narratology.

  Hayden White's work on employment comes to mind—how historians shape facts into stories with beginnings, middles, ends. Louis Mink's narrative configurations also fit. The user might be seeing narrative coherence overriding factual additions. Ann Rigney's "narrative absorption" directly addresses how new details get integrated without changing the core story.

  The space allocation issue (giving a famine four pages vs. a clause) relates to narrative weighting. Frank Ankersmit's narrative substances and White's tropes could explain why some elements are foregrounded. This seems separate from absorption but part of the same narrative mechanics.

  For cases where corrections force narrative change, I should consider paradigm shifts, like the impact of new evidence in the Holocaust or colonial histories. But those are rare. Usually, narratives are resilient due to cognitive biases like belief perseverance.

  The user is clearly well-read and wants precise distinctions. They need a framework that separates selection, emphasis, structure, and absorption. Coining terms like "narrative inertia" or "hermeneutic resilience" might help, but they should be grounded in existing theory. Highlighting the gaps in current literature is crucial, as they seek academic rigor without jargon.

  Deep down, they might be grappling with the validity of historical narratives. If facts don't challenge stories, how do we judge which narrative is better? This ties into epistemic questions about history's objectivity. They need concepts that address narrative flexibility versus factual accountability, possibly linking to ethical dimensions in history-writing.
answer: |-
  Your observation cuts to the heart of historical epistemology and narratology, exposing a crucial gap between factual verification and narrative construction. You're right: established terms like "selection" or "underdetermination" don't fully capture this "absorption property." Let's dissect it, find the nearest concepts, see where they fall short, and propose sharper tools.

  **Breaking Down the Phenomenon:**

  You've identified at least two distinct, but related, operations:

  1.  **Narrative Structuring/Spatial Allocation:** The initial choices about:
      *   **Scope:** What temporal/spatial boundaries define the story? (1956 vs. 1985 start, ending at the Wall vs. years later).
      *   **Weighting:** How much emphasis (pages, detail, placement) is given to specific events, factors, or actors? (Famine: 4 pages vs. semicolon; harvest figures vs. bad decisions).
      *   **Causation:** What is identified as the primary driver(s) of change? (Economic structures, individual agency, ideology, contingency).
      *   **Emplotment:** The *kind* of story it is (tragedy, farce, triumph of progress, decline, etc.) – though this is often implicit.

  2.  **The Absorption Property:** The specific phenomenon where **factual additions or corrections (demanded by critics or new evidence) are incorporated into the existing narrative structure *without altering its core claims, scope, weighting, or causal logic*.** The new fact becomes assimilated, often serving to *reinforce* the original narrative by appearing to address criticism, rather than challenging its foundations.

  **Nearest Established Concepts & Why They Fall Short:**

  1.  **Hayden White's "Employment" (Metahistory):**
      *   **What it is:** Historians impose narrative structures (romance, tragedy, comedy, satire) on the chronicle of events, giving them meaning and coherence. The *same* events can be emplotted differently.
      *   **How it relates:** Explains why different stories exist from the same facts. Directly addresses your first observation (different books, same facts).
      *   **Where it falls short:** Doesn't specifically address the *absorption* phenomenon – how new facts are incorporated *without* changing the emplotment. White focuses more on the initial imposition of form than its resilience to new content.

  2.  **Louis Mink's "Narrative Configurations":**
      *   **What it is:** History isn't just found but *constructed* into a coherent whole. Narrative understanding is a distinct cognitive mode where events are grasped as parts of a single, concrete complex of relationships.
      *   **How it relates:** Explains the deep coherence of a historical account – why facts aren't just listed but linked meaningfully. This coherence is what resists change when new facts are added.
      *   **Where it falls short:** While describing the *coherence* that absorption relies on, it doesn't specifically analyze the *process* or *mechanism* of absorbing new facts without altering the configuration. It's more about the nature of the end product.

  3.  **Frank Ankersmit's "Narrative Substances" / "Representation":**
      *   **What it is:** Historians create holistic "narrative substances" – complex interpretations of the past *as a whole* – that are irreducible to their constituent statements. The narrative substance *represents* the past, but this representation is more than the sum of its (factual) parts.
      *   **How it relates:** This is very close! The core insight is that the *overall picture* (the narrative substance) has a life of its own, distinct from the individual facts. Changing facts doesn't necessarily change the substance.
      *   **Where it falls short:** Ankersmit focuses on the ontological status of the narrative substance itself. He doesn't delve deeply into the pragmatic process of *how* historians *defend* these substances by *absorbing* new/corrected facts without altering the substance's core identity. Your absorption property is the *mechanism* by which narrative substances maintain their integrity.

  4.  **Ann Rigney's Work (especially "The Rhetoric of Historical Representation" & "Imperfect Histories"):**
      *   **What it is:** Focuses on the *rhetorical* strategies historians use to create persuasive narratives, including managing "remainders" (what's left out) and dealing with new information.
      *   **How it relates:** Directly engages with how historians handle omissions and integrate new material. She discusses strategies like "incorporation" where new details are fitted into existing frameworks.
      *   **Where it falls short (for your specific point):** While Rigney discusses incorporation, your absorption property highlights a specific *outcome*: the *failure* of the incorporated fact to alter the narrative's fundamental claims or structure, despite ostensibly addressing a criticism. She might see this as a *type* of incorporation, but your observation emphasizes its surprising resilience and the potential *bad faith* or *cognitive bias* involved when the core complaint remains unaddressed.

  **Why "Absorption" is Distinct and Needs Naming:**

  *   **Beyond Selection:** Selection is about initial inclusion/exclusion. Absorption is about the *post-hoc integration* of new material *after* selection has been challenged.
  *   **Beyond Underdetermination:** Underdetermination says many theories fit the *same* data. Absorption shows that *adding new data* often doesn't change the *existing* theory/narrative. It highlights narrative *inertia*.
  *   **Beyond Employment/Configuration:** These explain the existence of different narratives. Absorption explains the *robustness* of a *specific* narrative structure in the face of factual augmentation/correction.

  **What Would Force a Reshaping? (And Why It's Rare)**

  Your instinct that absorption is the norm is correct. Cases where factual correction forces a *fundamental* narrative shift are exceptional and usually involve:

  1.  **A "Keystone Fact":** A fact so central to the causal logic or moral weight of the narrative that its invalidation collapses the structure (e.g., proof a key document was forged, evidence a pivotal meeting never happened).
  2.  **Paradigmatic Shifts:** New evidence aligning with broader intellectual/cultural changes forces reinterpretation (e.g., new archaeological evidence combined with post-colonial theory reshaping narratives of indigenous societies; overwhelming evidence of the Holocaust shattering denialist narratives).
  3.  **Overwhelming Volume/Contradiction:** A flood of new evidence, systematically contradicting core narrative claims, making absorption impossible without absurdity (e.g., archives opening revealing systematic deception where only individual error was previously alleged).
  4.  **Ethical Imperative:** Evidence demanding acknowledgment of suffering or responsibility previously minimized or ignored, making continued absorption morally untenable (e.g., uncovering the true scale of atrocities previously downplayed).

  **Why is reshaping rare?** Because narratives are cognitively powerful, professionally invested in, and often serve broader cultural/political functions. Belief perseverance is strong. Adding facts is easier than rethinking a complex, coherent story.

  **Defining the Concepts (Avoiding Collapse):**

  Based on your description and the gaps identified:

  1.  **Narrative Allocation/Weighting:** The historian's strategic distribution of emphasis (space, detail, placement, prominence) to events, actors, causes, and contexts within the defined scope of their account, signaling their relative importance to the narrative's argument and causal logic. *(This distinguishes it from simple selection; it's about the* degree *and* manner *of inclusion).*
  2.  **Narrative Absorption:** The process by which new factual information (often introduced in response to criticism or new evidence) is integrated into an existing historical narrative **without altering its core claims, causal logic, scope, weighting, or emplotment.** The new information is accommodated within the pre-existing structure, often functioning rhetorically to *defend* the original narrative by appearing to address objections, rather than to revise or reframe it. The underlying narrative structure exhibits **hermeneutic resilience**.

  **Why these definitions work:**

  *   **Specificity:** They isolate the precise phenomena you observed (weighting vs. absorption).
  *   **Mechanism:** Absorption describes a *process* with a specific *outcome* (no change to core claims/structure).
  *   **Distinction:** Clearly separates weighting/allocation (an initial authorial strategy) from absorption (a response to external input).
  *   **Resilience:** Highlights the active resistance of the narrative structure to change.
  *   **Beyond "Shape":** Avoids vagueness by specifying *what* doesn't change (core claims, logic, scope, weighting, emplotment) and *how* the new fact functions (rhetorical defense).

  **Literature & Labels:**

  While no single term perfectly captures "absorption" as defined, the closest discussions are found in:

  *   **Ann Rigney:** Her concept of "incorporation" and focus on "remainders" and rhetorical management of narratives is essential. Look for her work on "mnemonic capacity" and how narratives handle excess information.
  *   **Frank Ankersmit:** "Narrative Substance" and "Representation" provide the philosophical grounding for why narratives resist factual change. *Historical Representation* (2001) is key.
  *   **Cognitive Psychology/Belief Perseverance:** Literature on how people maintain beliefs despite contradictory evidence (e.g., Lord, Ross, & Lepper 1979) explains the *psychological* basis for absorption.
  *   **Term Proposal:** Within philosophy of history/narratology, **"Narrative Absorption"** (as defined above) or **"Hermeneutic Resilience"** would be useful terms to encapsulate this specific phenomenon. Rigney sometimes uses "assimilation," but "absorption" feels more active and captures the idea of the narrative *taking in* without being *changed by* the new element.

  Your observation brilliantly isolates a fundamental operation in historical practice that existing theory describes in parts but hasn't named and analyzed *as this specific resilient mechanism*. It exposes the often-unacknowledged gap between the rhetoric of factual correction and the reality of narrative persistence.
