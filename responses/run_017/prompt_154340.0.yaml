prompt: |-
  You're a professional philosopher who works on collective and political responsibility, and you also know the literature of the First World War well — so please actually think this through before answering: sketch two or three candidate readings in your head, pick the strongest one, and don't hedge every claim into mush.

  I'm writing my end-of-term essay for a course on collective responsibility and I want to do something less predictable than another paper about the archives. Here's the plan: read Remarque's All Quiet on the Western Front as a contribution to the argument about who is to blame for the First World War. Background, in case it helps: the German historian Fritz Fischer argued in the early 1960s, working from the Imperial German records and documents like the September Program of 1914, that Germany's leaders deliberately steered the July Crisis into a war they wanted; this set off a huge fight in West Germany. What my professor keeps insisting is that the fight was never really about documents at all — it was about whether a nation can be a bearer of responsibility in the first place, or whether blame has to bottom out in individual people. So: does the novel have a view on that? To sharpen it, here's some apparatus I've been messing around with (my prof hates it, which I'm choosing to read as a good sign). I want four kinds of blame kept apart, and I want to know which ones the novel actually denies and which ones it quietly helps itself to: authorial blame, blame for having started it, the thing the war-guilt clause and the Fischer thesis fight over; underwriting blame, blame for keeping a thing going that you benefit from or could in principle have refused, which attaches to you as a member of a polity whether or not you voted for any of it; uptake blame, blame you acquire by continuing once you know what the thing really is, so that a long war gradually makes blameworthy people who were innocent at the start; and formation blame, the one I care about most, blame for having shaped someone so that they would choose the thing — which is what makes the schoolmaster Kantorek, who never fires a shot and never sees the front, the most interesting target in the book. Though then I hit a problem I can't solve: who formed Kantorek? I can't tell whether that regress is a reductio of formation blame or just the novel's actual subject.

  The ask, then: give me five points, exactly five, numbered, one or two sentences each, no introduction and no summing-up at the end, in which you read specific scenes — Kantorek's classroom and the whole class volunteering, the training camp with Himmelstoss, Kemmerich dying and his boots passing from man to man, Kat, Paul's leave at home with his dying mother and the townspeople who want to talk about advancing on Paris, the night in the shell-hole with the Frenchman he stabs and then watches die slowly while asking the corpse for forgiveness, and the ending where Paul dies in October 1918 and the army communiqué reports nothing new to report on the western front — through that four-way distinction, saying for each scene what it shows about blame and whether the novel is making an argument there or just giving you a mood. Where the reading breaks down, say so plainly; where the novel adds something the philosophy of collective responsibility can't say in its own vocabulary, say that too, because that's the bit my essay needs. I'd a lot rather have five hard claims I can argue with than a balanced survey — and im happy to be told the taxonomy is definately wrong if you can show me which cut does the work better.
