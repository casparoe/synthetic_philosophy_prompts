answer: |-
  We are here to remember Raymond — Uncle Ray — a man who spent his life asking questions that made other people squirm. Literally, sometimes, when he’d pull out a vial at dinner. He devoted thirty years to understanding insects, not just as specimens, but as creatures. And then, for the last fifteen of his working life, he wrestled with one particular, persistent question: *could* they feel? Not just react, not just respond to stimuli, but truly *experience* something? Could there be… something it’s like to be a shrimp?

  He drove some of his younger colleagues quietly spare, because Ray refused to land firmly on one side or the other. He saw evidence pointing both ways: complex behaviours, learning, nerve cells that looked suspiciously like they handled pain… but also, crucially, nothing like the brain structures we associate with consciousness in ourselves. He didn’t think the science settled it. He thought the *question itself* was often badly posed. He’d say, "We shouldn't ask *if* they're conscious, but *how much*, of *what*, and per *what unit of time*?"

  This wasn't just academic fiddling for Ray. It was arithmetic. His argument was this: if there's even a *tiny*, real chance that a shrimp, or a cricket, experiences its world – especially the bad parts – and you multiply that tiny chance by the *unimaginable* number of insects and crustaceans on this planet… well, a small probability times an enormous number becomes a large number. A large number worth paying attention to. Worth some inconvenience, worth some research money, to try and shorten the suffering, just in case.

  He even pondered time. He wondered if a fly’s second, buzzing through its short life, packed in more sensory snapshots than our own slow seconds. He’d muse that a life that looks tragically brief from the outside might not feel that way on the inside. Did he know if he was right? I honestly don’t think he did. But he thought it mattered enough to ask.

  This was the shape of Ray’s mind: utterly stubborn about the uncertainty, rigorously focused on the sheer scale of the potential stakes. He wasn’t chasing proof; he was grappling with probability and consequence. It was an agnosticism fuelled not by doubt, but by a fierce sense of responsibility.

  And he did this while keeping honeybees for *forty years*. Talk about commitment. He watched them build their societies, gather pollen, do their intricate dances… all while wondering what, exactly, was humming inside those tiny heads. He found wonder in the question itself.

  He also knew how his lifelong obsession looked to others. To many of you here from his scientific world, he was the guy meticulously arguing for caution, for acknowledging the unknowns, sometimes frustratingly so. To his family, his neighbours, his church friends, he was just… Ray. The guy who could talk your ear off about beetle larvae, who found the world endlessly fascinating at the microscopic level, whose passion for bugs was equal parts endearing and slightly baffling. You loved him for it, even if you thought the whole thing was a bit… well… funny.

  Which brings us, perhaps inevitably, to the lunch we’re about to share. The crawfish boil. The one he attended religiously every year. The one where he happily tucked in. Yes, this drove some of his colleagues absolutely up the wall! It was the glaring contradiction they’d poke at. And Ray? He’d just give that little half-smile, maybe shrug, and change the subject. He never fully explained it. Maybe it was tradition. Maybe it was community. Maybe it was just really good seasoning. Or maybe it was Ray, comfortable holding two seemingly opposing ideas in his head at once: the profound, weighty question of sentience in countless creatures, and the simple, messy joy of a shared meal with people he loved. He saw no need to resolve the tension for anyone else’s comfort. That was pure Ray.

  So, let’s remember Uncle Ray: The beekeeper. The question-asker. The stubborn champion of uncertainty who saw vast ethical implications in the tiniest creatures. The man who adored his bugs, argued fiercely about their potential inner lives, and then cheerfully ate lunch. He lived with complexity, found wonder in the unknown, and cherished connection – both human and, perhaps, otherwise.

  He wouldn’t want us to claim certainty for him today. He’d want us, maybe, to look at a honeybee buzzing past, or a crawfish in the pot later, and just… wonder. Wonder what it might be like. And maybe, in that wondering, we’ll feel a little bit of Ray’s enduring curiosity right here with us.
