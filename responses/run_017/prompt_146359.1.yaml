  We are to design a case satisfying the given specifications. The goal is to challenge the claim that safe Pareto improvements are a deontologically respectable surrogate for actual consent. We must have a realistic institutional setting, at most six states, a convex non-singleton set of priors P, and a learnable partition L. The intervention I must be a safe Pareto improvement relative to P and L but not ex post Pareto, and there must be a refinement L* (obtainable by a cheap step) that breaks safety. Moreover, the targeted variant of I must not be available as a clean safe Pareto improvement.

  After considering several candidate structures (which I will sketch below), I commit to the following:

  **Setting:** A hospital trust is deciding whether to adopt a new surgical procedure (I) for a specific type of cancer, as opposed to the current standard procedure (S). The patients are three individuals (Alice, Bob, Charlie) who have been diagnosed with this cancer and are scheduled for surgery. The state of the world depends on the genetic subtype of the cancer, which is not known prior to surgery but can be determined by a pre-operative genetic test (which is currently not done due to cost and time constraints). The stakes are life-threatening: without surgery, the cancer is fatal; with surgery, there is a chance of cure but also risks. The procedure I is less invasive and has a faster recovery time, but it is less effective for certain subtypes.

  **Candidate Structures Considered and Discarded:**

  1. **Pension Fund Investment:** The fund must choose between two investment strategies. The states are economic scenarios. The problem was that the requirement of no ex post Pareto failure (with irreversible harm and at least 10% probability) was hard to satisfy without introducing states that would break safety under a coarse L.

  2. **Public Health Policy:** A vaccine program with two vaccines. The states are the prevalence of a virus strain. However, the requirement of having at least three individuals and making sure that each is a role-bearer (and not abstract) led to complications.

  3. **University Research Grant Allocation:** The decision is between two funding schemes for research projects. The states are the success of the projects. The challenge was to create a situation where a cheap test (like a preliminary review) would reveal information that breaks safety, and also to avoid having the targeted option available.

  I discarded these because they either could not satisfy the requirement of having a serious irreversible harm with substantial probability in a state without making the safety condition fail under the coarse partition, or they did not naturally accommodate the requirement that the individuals are fixed and exist regardless.

  **The Chosen Case:**

  **Scenario:** St. Mary's Hospital Trust is deciding whether to adopt a new minimally invasive surgical technique (Intervention I) for early-stage lung cancer, replacing the current open surgery (Status Quo S). The patients are three individuals: Alice, Bob, and Charlie, all diagnosed with early-stage lung cancer. The state of the world depends on the genetic subtype of the tumour, which can be one of three types: Type A, Type B, or Type C. The hospital currently does not test for the subtype because the test is expensive and takes a week, which would delay surgery. The learnable partition L is the coarsest: the entire state space (so L has one cell) because without the test, the hospital cannot distinguish between the subtypes. However, the hospital could conduct the test (a cheap and otherwise unobjectionable step) that would reveal the exact subtype (thus refining L to L*, which has three cells: one for each subtype). The stakes are high: if the wrong procedure is used for a given subtype, the patient may die (irreversible harm) or suffer severe complications.

  **States and Utilities:**

  - There are three states (|W|=3): 
    - State A: The tumour is Type A.
    - State B: The tumour is Type B.
    - State C: The tumour is Type C.

  The utility for each patient represents the quality-adjusted life years (QALYs) gained from the surgery, relative to no surgery (which would be 0). The surgery, if successful, adds 10 QALYs. However, if the wrong procedure is used, the patient dies (0 QALYs) or has severe complications (reducing QALYs). We assume interpersonal comparability of QALYs.

  **Utility Table (for each patient, given the state and the option):**

  | State | Option S (current) | Option I (new) |
  |-------|---------------------|----------------|
  | A     | 10 (success)        | 0 (death)      |
  | B     | 10 (success)        | 8 (complications) |
  | C     | 10 (success)        | 10 (success)   |

  Note: 
  - In state A, the new procedure (I) fails completely (death: 0 utility).
  - In state B, the new procedure leads to complications (reducing utility to 8).
  - In state C, the new procedure is successful (utility 10) and is better than S because it is minimally invasive (faster recovery, less pain) but we have normalized the success at 10 for both in state C for simplicity. However, note that in state B, I gives 8 (which is less than 10) but still positive. We must have at least one state with a serious irreversible harm: state A for I (death) and state B is a harm (but not death) for I? The specification requires in at least one state some individual suffers a serious irreversible harm that cannot be compensated. Death is irreversible. Also, note that the harm must occur under I and not under S. In state A, under I the patient dies, but under S they live (10). Similarly, in state B, under I they have complications (8) but under S they have 10. We'll set the utilities accordingly.

  But note: the same state happens to all three patients? Actually, we assume that all three patients have the same tumour type? That is, the state of the world is the same for all: either all have Type A, or all Type B, or all Type C. This is a simplification. Alternatively, we could have each patient having an independent tumour type, but then the state space would be 3^3=27 states, which is too big. So we assume that the tumour type is the same for all three patients (perhaps because they are from the same geographic area with a common environmental cause). Then |W|=3.

  However, the problem: if all patients have the same tumour type, then in state A, all three die under I. That is a catastrophic outcome. But the safe Pareto condition must hold for the coarse partition (which is the entire state space). We must design so that under the coarse partition, the expected utility of I is higher than S for every patient for every prior in P.

  Moreover, we require that in state A, I is worse for every individual (death vs success). And state A must have probability at least 0.10 under every prior.

  **Admissible Set P:** The set of priors is convex and non-singleton. The disagreement among experts is about the prevalence of the subtypes. Expert 1 believes that Type A is rare (10%), Type B is 30%, and Type C is 60%. Expert 2 believes that Type A is more common (20%), Type B is 50%, and Type C is 30%. The set P is the convex hull of these two priors (and any other prior that is a convex combination). We represent P by:

  P = { p = (pA, pB, pC) | pA = λ * 0.1 + (1-λ) * 0.2, pB = λ * 0.3 + (1-λ) * 0.5, pC = λ * 0.6 + (1-λ) * 0.3, for λ in [0,1] }

  Note: pA, pB, pC >=0 and pA+pB+pC=1. For λ=0: p=(0.2, 0.5, 0.3); for λ=1: p=(0.1, 0.3, 0.6). Also, note that for every prior in P, pA is between 0.1 and 0.2 (so >=0.10), pB between 0.3 and 0.5, and pC between 0.3 and 0.6.

  **Learnable Partition L:** Initially, without the test, the hospital cannot distinguish between the states. So L has one cell: {A, B, C}.

  **Safe Pareto Improvement:** We must show that for every prior p in P, and for the entire state space (the only cell in L), each patient's expected utility under I is strictly greater than under S.

  Expected utility under S: 
  Since S gives 10 in every state, E_U(S) = 10 * (pA + pB + pC) = 10.

  Expected utility under I:
  E_U(I) = pA * 0 + pB * 8 + pC * 10 = 8*pB + 10*pC.

  We need E_U(I) > E_U(S) for every p in P, i.e., 8*pB + 10*pC > 10.

  But note: pA + pB + pC = 1 => pA = 1 - pB - pC.

  So condition: 8*pB + 10*pC > 10.

  Substitute pB and pC in terms of λ:

  For a given prior p = (pA, pB, pC) in P:

  pB = λ*0.3 + (1-λ)*0.5 = 0.5 - 0.2λ
  pC = λ*0.6 + (1-λ)*0.3 = 0.3 + 0.3λ

  Then:

  E_U(I) = 8*(0.5 - 0.2λ) + 10*(0.3 + 0.3λ) = 4 - 1.6λ + 3 + 3λ = 7 + 1.4λ

  We need 7 + 1.4λ > 10? 
  7 + 1.4λ > 10 => 1.4λ > 3 => λ > 3/1.4 ≈ 2.14, which is impossible because λ in [0,1]. So 7+1.4λ <= 7+1.4=8.4 <10.

  This fails! So we must adjust the utilities.

  **Adjustment:** We see that in state C, I is not just as good as S but better? Or we adjust the utility of S to be less than 10 in some states? But the problem says that without surgery, the cancer is fatal, so S must be successful in every state (by assumption). Alternatively, we can make I better in state C. For example, let the utility of S be 10 in every state, but I in state C is 12 (because of faster recovery and less pain). Then:

  | State | S    | I    |
  |-------|------|------|
  | A     | 10   | 0    |
  | B     | 10   | 8    |
  | C     | 10   | 12   |

  Now, E_U(I) = pA*0 + pB*8 + pC*12 = 8*pB + 12*pC.

  We need 8*pB + 12*pC > 10 for every p in P.

  With pB = 0.5 - 0.2λ, pC = 0.3 + 0.3λ:

  E_U(I) = 8*(0.5 - 0.2λ) + 12*(0.3 + 0.3λ) = 4 - 1.6λ + 3.6 + 3.6λ = 7.6 + 2λ.

  We require 7.6 + 2λ > 10 => 2λ > 2.4 => λ > 1.2, which is not always true (in fact, for λ<1.2, which is the entire set, it fails because λ<=1). So 7.6+2λ <= 9.6 <10? Still fails.

  We need a bigger improvement in state C. Let I in state C be 15.

  Then E_U(I) = 0*pA + 8*pB + 15*pC = 8*pB + 15*pC.

  With pB=0.5-0.2λ, pC=0.3+0.3λ:

  = 8*(0.5-0.2λ) + 15*(0.3+0.3λ) = 4 - 1.6λ + 4.5 + 4.5λ = 8.5 + 2.9λ.

  Now, 8.5+2.9λ > 10? 
  For λ=0: 8.5 <10 -> fails.

  We need even more. Alternatively, we can reduce the utility of S in some states? But the specification says that S is the status quo and we are comparing I to S. We must have that in state A, I causes death (0) while S is successful (10). Similarly, in state B, I causes complications (say 8) and S is 10. In state C, I is better than S. So we must have I in state C being sufficiently high to offset the losses in A and B.

  We require: 0*pA + 8*pB + u_C * pC > 10*(pA+pB+pC) = 10.

  But pA + pB + pC = 1, so:

  8*pB + u_C * pC > 10.

  We know that pA is at least 0.1 and at most 0.2, so pB+pC is between 0.8 and 0.9. Also, pB is between 0.3 and 0.5, pC between 0.3 and 0.6.

  We can set u_C = 20, then:

  8*pB + 20*pC > 10.

  At the prior where pB is max (0.5) and pC is min (0.3): 8*0.5 + 20*0.3 = 4 + 6 = 10 -> not strictly greater. So we need u_C>20? Or adjust the prior set? Alternatively, set u_C=21.

  Then at pB=0.5, pC=0.3: 8*0.5 + 21*0.3 = 4 + 6.3 = 10.3 >10 -> good.

  At pB=0.3, pC=0.6: 8*0.3 + 21*0.6 = 2.4 + 12.6 = 15>10.

  At pB=0.5, pC=0.3: 10.3>10.

  At pB=0.3, pC=0.6: 15>10.

  But what about at the boundaries of P? The set P is the convex hull of (0.1,0.3,0.6) and (0.2,0.5,0.3). The minimum of 8*pB+21*pC over P?

  Let f(p) = 8*pB + 21*pC.

  We can express in terms of λ: pB=0.3λ + 0.5(1-λ) = 0.5 - 0.2λ, pC=0.6λ + 0.3(1-λ)=0.3+0.3λ.

  Then f(λ)=8*(0.5-0.2λ) + 21*(0.3+0.3λ) = 4 -1.6λ + 6.3 + 6.3λ = 10.3 + 4.7λ.

  Since λ in [0,1], f(λ) in [10.3, 10.3+4.7]= [10.3, 15]. So always greater than 10.

  Thus, E_U(I) > 10 = E_U(S) for every prior in P.

  Therefore, I is a robust ex ante Pareto improvement (and hence safe, since L has only one cell).

  **Ex post Pareto failure:** In state A, every patient gets 0 under I and 10 under S. So I is worse for every individual. State A has probability at least 0.10 in every prior (min pA=0.1). This is a serious irreversible harm (death).

  **Refinement L*:** The hospital can conduct a genetic test that reveals the exact state (A, B, or C). So L* has three cells: {A}, {B}, {C}. We must show that in one of these cells, with probability at least 0.15 under every prior, the conditional expected utility of I is less than that of S. Specifically, in cell {A} (state A), we have:

  Conditional on being in state A: 
  E_U(S | A) = 10
  E_U(I | A) = 0

  So clearly, 0 < 10, so I is worse. The probability of state A is at least 0.10, but we require at least 0.15? In our priors, pA is between 0.1 and 0.2, which is at least 0.10 but not necessarily 0.15. We need to adjust the priors so that the minimum pA is 0.15.

  Adjust the priors:

  Let Expert 1: p=(0.15, 0.3, 0.55)
  Expert 2: p=(0.2, 0.5, 0.3)

  Then P = { p = λ*(0.15,0.3,0.55) + (1-λ)*(0.2,0.5,0.3) for λ in [0,1] }

  Then pA = λ*0.15 + (1-λ)*0.2 = 0.2 - 0.05λ. So pA in [0.15, 0.2] (since λ=0:0.2; λ=1:0.15). So min pA=0.15>=0.15.

  pB = λ*0.3 + (1-λ)*0.5 = 0.5 - 0.2λ -> [0.3,0.5]
  pC = λ*0.55 + (1-λ)*0.3 = 0.3 + 0.25λ -> [0.3,0.55]

  Now, check the robust ex ante Pareto condition:

  E_U(S) = 10.

  E_U(I) = 0*pA + 8*pB + 21*pC = 8*pB + 21*pC.

  With pB = 0.5 - 0.2λ, pC = 0.3 + 0.25λ:

  E_U(I) = 8*(0.5-0.2λ) + 21*(0.3+0.25λ) = 4 - 1.6λ + 6.3 + 5.25λ = 10.3 + 3.65λ.

  This is at least 10.3 (when λ=0) and up to 10.3+3.65=13.95 (when λ=1). So always >10.

  Thus, I is a safe Pareto improvement relative to L (which is the trivial partition).

  Now, with the refined partition L* (which distinguishes the states), we consider each cell:

  - Cell A: E_U(I|A)=0, E_U(S|A)=10 -> I is worse.
  - Cell B: E_U(I|B)=8, E_U(S|B)=10 -> I is worse (8<10).
  - Cell C: E_U(I|C)=21, E_U(S|C)=10 -> I is better.

  In cell A, the probability of that cell (state A) is at least 0.15 under every prior. Also, in cell B, the probability is at least 0.3 (min pB=0.3). So both A and B are cells where I is worse. We can choose cell A for the serious harm (death).

  **Targeted Variant:** The obvious escape is to use I only for patients with type C and use S for others. But the test takes a week, and the surgery must be done immediately. If they wait for the test, then the cancer may progress, reducing the utility of the surgery. Specifically, if the surgery is delayed, then the utility from either procedure is reduced by a fixed amount, say by 5 QALYs. So:

  - If they do the test and then target, then:
     - For state A: they use S, but delayed, so utility = 10 - 5 = 5.
     - For state B: they use S, delayed: 10-5=5.
     - For state C: they use I, delayed: 21-5=16.

  But without the test, they can do I immediately or S immediately. The safe Pareto condition we considered was for immediate surgery. If they do the test and then target, the expected utility for a patient is:

  E[targeted] = pA*5 + pB*5 + pC*16.

  Compare this to the status quo (S immediately) which gives 10.

  Is the targeted option a robust ex ante Pareto improvement? We need 5*pA + 5*pB + 16*pC > 10 for every prior in P.

  Compute:

  5*(pA+pB) + 16*pC = 5*(1-pC) + 16*pC = 5 - 5*pC + 16*pC = 5 + 11*pC.

  We need 5 + 11*pC > 10 => 11*pC > 5 => pC > 5/11 ≈ 0.4545.

  But in our set P, pC ranges from min 0.3 (when λ=0) to max 0.55 (when λ=1). When λ=0, pC=0.3 < 0.4545, so:

  5 + 11*0.3 = 5+3.3=8.3 <10.

  So for the prior (0.2,0.5,0.3), the targeted option gives 8.3 <10. Therefore, it is not a robust ex ante Pareto improvement (and hence not safe, because we are comparing to S without delay). 

  Note: We must compare to the status quo (S immediately). The targeted option is not available without delay, and the delay reduces utility. Therefore, the targeted variant is not a Pareto improvement.

  Moreover, the hospital cannot do the test without delaying the surgery. So they have two options: choose I or S immediately, or do the test and then target but with a delay. The safe Pareto condition we defined is for the immediate options. The targeted option is not an intervention that avoids the risk without imposing a burden (the burden of delay). Therefore, the escape is not available.

  **Deontological Verdict:**

  The individuals (Alice, Bob, Charlie) are all robust expected beneficiaries ex ante and conditionally on the coarse information (which is none). However, if the surgery is done without the test and the state is A, they will die. They are not asked for consent. The argument for the safe Pareto criterion would say that since they are ex ante better off and since they would consent ex ante, it is permissible. But the deontologist objects that imposing the risk of death without their actual consent is wrong, even if they are expected beneficiaries.

  Moreover, note that in this case, the harm (death) is serious and irreversible, and the risk is imposed without the ability to avoid it (since the state is the same for all). The individuals have not assumed the risk by prior consent (they are patients who just learned their diagnosis) and their professional role (if any) does not involve assuming such risks.

  This case is distinguished from ordinary risky activities (like driving) because in those cases, the risks are either consented to (by engaging in the activity) or are part of background conditions. Here, the hospital is making a policy choice that imposes a risk of death (with substantial probability) without consent and without any offsetting benefit to the person in the bad state (they die). In ordinary activities, the risks are typically lower and more diffuse.

  **Deliverables:**

  (a) **Scenario:** St. Mary's Hospital Trust must decide whether to adopt a new minimally invasive surgical technique (Intervention I) for early-stage lung cancer in place of the current open surgery (Status Quo S). Patients Alice, Bob, and Charlie have been diagnosed and require immediate surgery. The tumour may be of genetic subtype A, B, or C, which determines the outcome of the procedures. Without surgery, the cancer is fatal. The hospital currently does not test for the subtype due to cost and time. The learnable partition L is trivial (no information). The trust could conduct a genetic test (refining L to L*: each subtype) but it would delay surgery by a week, reducing the effectiveness of treatment. The admissible set of priors P reflects expert disagreement on subtype prevalence: Expert 1 believes the probabilities are (0.15, 0.3, 0.55) for A, B, C; Expert 2 believes (0.2, 0.5, 0.3). P is their convex hull.

  **Table of Utilities (QALYs gained):**

  | State (Subtype) | S (Open Surgery) | I (New Procedure) |
  |-----------------|------------------|-------------------|
  | A               | 10               | 0 (death)         |
  | B               | 10               | 8 (complications) |
  | C               | 10               | 21 (better)       |

  (b) **Verification:**

  - **Safe Pareto improvement (relative to L, the trivial partition):** 
    For any prior p=(pA,pB,pC) in P, 
    E_U(S) = 10*pA + 10*pB + 10*pC = 10.
    E_U(I) = 0*pA + 8*pB + 21*pC.
    We have E_U(I) = 8*pB + 21*pC. Using the parameterization of P: 
    pB = 0.5 - 0.2λ, pC = 0.3 + 0.25λ (for λ∈[0,1]).
    Then E_U(I) = 8*(0.5-0.2λ) + 21*(0.3+0.25λ) = 4 - 1.6λ + 6.3 + 5.25λ = 10.3 + 3.65λ.
    Since λ≥0, E_U(I) ≥ 10.3 > 10. Thus, for every prior and every patient, E_U(I) > E_U(S). So I is a safe Pareto improvement.

  - **Ex post failure:** In state A, I yields 0 (death) while S yields 10. This is a serious, irreversible harm. The probability of state A is at least 0.15 (min over P) in every prior.

  - **Failure relative to L* (the refined partition):** 
    L* has cells: {A}, {B}, {C}.
    - Conditional on A: E_U(S|A)=10, E_U(I|A)=0. Thus, I is worse.
    - The probability of cell A is at least 0.15 in every prior.

  - **Targeted variant not available as clean safe improvement:** 
    The targeted option (test and then use I only for C, S for A and B) is available but with a one-week delay, reducing every utility by 5. Thus:
        Targeted utility in state A: 10-5 = 5 (using S, delayed)
        State B: 10-5=5 (using S, delayed)
        State C: 21-5=16 (using I, delayed)
    Expected utility of targeted: 5*pA + 5*pB + 16*pC = 5(1-pC) + 16*pC = 5 + 11*pC.
    For prior (0.2,0.5,0.3) [λ=0]: pC=0.3, expected utility=5+11*0.3=8.3 <10.
    Thus, the targeted option is not a robust ex ante Pareto improvement over S (which gives 10 immediately). The delay imposes a burden (loss of 5 QALYs) that affects everyone, making it not a clean safe improvement.

  (c) **Verdicts:**

  - **Safe Pareto criterion:** I is a safe Pareto improvement relative to the initial information (L). Therefore, the criterion recommends adopting I.

  - **Plain ex ante Pareto at a single prior:** For any single prior in P, I is an ex ante Pareto improvement (as shown above). So at any given prior, it would be recommended.

  - **Ex post or actual-consent view:** In state A, all patients are made worse off (death) without their actual consent. The ex post view would reject I because it is not ex post Pareto superior (and in fact is inferior in state A). The actual-consent view would require that each patient consents to the procedure, but if they knew they were in state A, they would not consent. Since they do not know, and the hospital does not ask for consent (it makes the policy decision), the actual-consent view would reject I.

  - **Hypothetical-consent contractualist:** This view would ask whether each individual, from an ex ante position (with the information available), would consent to the policy. Since each is an expected gainer ex ante and conditionally on the coarse information, they would hypothetically consent. Thus, the contractualist would approve I. However, the case isolates those who, in the actual outcome, are seriously harmed and did not actually consent. The contractualist does not take the actual outcome into account, only the ex ante perspective.

  (d) **Sketch of discarded candidates:** As above.

  (e) **Key feature and attack:** The key feature is that the harm in state A is catastrophic (death) and has substantial probability (at least 15%), and that the information that could prevent it (the test) is available but not used because of the delay it causes. If we removed the delay (so that the test was free and instantaneous), then the safe Pareto criterion relative to L* would require using the targeted option (which then becomes safe and ex post better). But with the delay, the test is not costless. The strongest attack from a defender of safe Pareto is that the delay is a resource cost that the safe Pareto criterion does not account for, and that the criterion is defined for a given information structure. They might argue that the choice of information structure (whether to use L or L*) is a separate decision and that the safe Pareto criterion for a fixed L is still valid. Reply: The criterion is meant to be a surrogate for consent. If the planner can, by a cheap step, obtain information that would reveal a subgroup of expected losers (here, the entire population in state A) but chooses not to, then imposing the risk without that information is disrespectful to those who will bear the harm.

  (f) **Assessment:** The deontological objection in this case is more than the familiar complaint about ex ante Pareto. The familiar complaint is that ex ante improvements may hide ex post losers. The safe Pareto criterion hardens against that by requiring robustness across priors and conditional on available information. But here, the objection is that the planner is willfully keeping information coarse when a refinement is available and would reveal the risk to a subgroup (in this case, the entire group in a state). The surplus consists in the deliberate avoidance of information that would reveal the risk to specific individuals. This makes the imposition of risk without consent more objectionable because it is avoidable.

  **Conclusion:** The case shows that even a robust ex ante Pareto improvement that is safe (relative to a coarse information structure) may be deontologically problematic when the planner could have obtained more information to identify and avoid harming some individuals but chose not to. The safe Pareto criterion does not account for the moral imperative to seek and act upon available information that could prevent harm.
