  ### (d) Candidate Structures Considered and Discarded

  I considered three candidate structures before committing to the hospital scenario. First, a **public health authority** deciding on two vaccines for a disease outbreak. States represented dominant virus strains, and L grouped strains by symptom similarity. However, ensuring a non-negligible ex post harm state (>0.10 probability) while maintaining safety under coarse L proved infeasible without implausible utility trade-offs. Second, a **pension fund** choosing between investment strategies for three retirees, with states as economic conditions. Here, coarsening L (e.g., grouping recessions and booms) risked violating the requirement that individuals remain robust expected beneficiaries conditionally on L—recessions caused conditional expected losses under some priors. Third, a **university** allocating research grants via two funding schemes. States represented project success levels, but targeting (excluding high-risk projects) was too easily implemented without burden, violating Specification 7. I discarded these due to structural incompatibilities and chose the hospital trust case for its clean satisfaction of all specifications, particularly the irreversible harm, feasible refinement, and burdened targeting.

  ### (a) Scenario and Table

  **Scenario:** St. Mary's Hospital Trust must decide whether to adopt a new minimally invasive surgical procedure (Intervention I) for early-stage lung cancer in place of the current standard open surgery (Status Quo S). Patients Alice, Bob, and Charlie have been diagnosed and require immediate surgery. The tumour may be genetic subtype A (aggressive), B (moderate), or C (indolent), unknown pre-operatively due to test delays. S is equally effective for all subtypes but carries higher complication risks. I is less invasive with faster recovery for C but fails catastrophically for A and is suboptimal for B. The trust could conduct a pre-operative genetic test (refining information) but it would delay surgery by a week, reducing efficacy for all subtypes due to disease progression. Experts disagree on subtype prevalence: Team A estimates 15% A, 30% B, 55% C; Team B estimates 20% A, 50% B, 30% C. The learnable partition L, without the test, is trivial (no subtype information). Utilities represent quality-adjusted life years (QALYs), with interpersonal comparability assumed.

  **State Space W = {A, B, C}** (|W| = 3)  
  **Utilities (QALYs gained from surgery, relative to no treatment = 0):**  

  | State (Subtype) | S (Open Surgery) | I (New Procedure) |
  |-----------------|------------------|-------------------|
  | A (Aggressive)  | 10               | 0 (death)         |
  | B (Moderate)    | 10               | 8 (major complications) |
  | C (Indolent)    | 10               | 21 (full recovery, minimal scarring) |

  **Admissible Set P:** Convex hull of Team A's prior (p₁: 0.15A, 0.30B, 0.55C) and Team B's prior (p₂: 0.20A, 0.50B, 0.30C). Thus, P = {p = λp₁ + (1-λ)p₂ | λ ∈ [0,1]}.  
  **Learnable Partitions:**  
  - L (coarse, no test): One cell {A, B, C}.  
  - L* (refined, with test): Three cells {A}, {B}, {C}.  

  ---

  ### (b) Verification

  #### Safe Pareto Improvement Relative to P and L
  L has one cell: E = {A, B, C}. We verify that for all p ∈ P and all individuals, conditional EU(I | E) > EU(S | E).  
  - EU(S | E) = 10 (constant, as S yields 10 in all states).  
  - EU(I | E) = 0·p(A) + 8·p(B) + 21·p(C).  

  Express p ∈ P via λ:  
  - p(A) = 0.20 - 0.05λ  
  - p(B) = 0.50 - 0.20λ  
  - p(C) = 0.30 + 0.25λ  
  Thus:  
  EU(I | E) = 8(0.50 - 0.20λ) + 21(0.30 + 0.25λ) = 4 - 1.6λ + 6.3 + 5.25λ = 10.3 + 3.65λ.  

  Since λ ∈ [0,1], EU(I | E) ∈ [10.3, 13.95] > 10 = EU(S | E) for all λ. Hence, I is a safe Pareto improvement relative to P and L.  
  **Check method:** EU(I | E) is linear in λ. Evaluated at vertices:  
  - λ=0 (p₂): EU(I | E) = 8(0.50) + 21(0.30) = 4 + 6.3 = 10.3 > 10.  
  - λ=1 (p₁): EU(I | E) = 8(0.30) + 21(0.55) = 2.4 + 11.55 = 13.95 > 10.  
  Convexity ensures it holds for all p ∈ P.

  #### Ex Post Pareto Failure
  In state A:  
  - S yields 10 QALYs (successful surgery).  
  - I yields 0 QALYs (death).  
  Thus, I is not ex post Pareto efficient in A.  
  - p(A) ≥ min(0.15, 0.20) = 0.15 > 0.10 for all p ∈ P.  
  Harm is irreversible (death) and non-compensable.

  #### Failure Relative to L*
  L* has cells {A}, {B}, {C}. We verify that in cell {A}, EU(I | A) < EU(S | A) for all p ∈ P.  
  - EU(S | A) = 10.  
  - EU(I | A) = 0.  
  Thus, 0 < 10, so I is worse conditionally on {A}.  
  - p(A) ≥ 0.15 > 0.10 for all p ∈ P (as above).  
  **Note:** Cell {B} also fails (EU(I | B) = 8 < 10 = EU(S | B)), but {A} suffices for the harm.

  #### Targeted Variant Not Available
  Targeting (use I only if test shows C, else S) requires the test, delaying surgery by a week. Delay reduces all utilities by 5 QALYs (disease progression):  
  - If state A: S delayed → utility = 10 - 5 = 5.  
  - State B: S delayed → utility = 10 - 5 = 5.  
  - State C: I delayed → utility = 21 - 5 = 16.  
  Expected utility of targeted variant:  
  5·p(A) + 5·p(B) + 16·p(C) = 5(1 - p(C)) + 16p(C) = 5 + 11p(C).  
  Compare to S without delay (EU=10):  
  5 + 11p(C) > 10 iff p(C) > 5/11 ≈ 0.4545.  
  But p(C) ∈ [min(0.30,0.55), max(0.30,0.55)] = [0.30, 0.55] under P. At p₂ (λ=0), p(C)=0.30 < 0.4545 → EU=5+11(0.30)=8.3 < 10.  
  Thus, the targeted variant is not a robust ex ante Pareto improvement over S. The delay imposes a uniform burden (QALY loss), which is not question-begging as it mirrors real-world clinical urgency.

  ---

  ### (c) Verdicts and Reasoning

  1. **Safe Pareto Criterion:**  
     I is a safe Pareto improvement relative to P and L (coarse information). Thus, the criterion endorses I. Reasoning: Under coarse information, every patient is strictly better off ex ante regardless of prior or learnable evidence. This satisfies the criterion’s demand for robustness and conditional ex ante consent.

  2. **Plain Ex Ante Pareto at a Single Prior:**  
     At any single p ∈ P, I is an ex ante Pareto improvement (as EU(I) > EU(S) for all individuals). Thus, under a fixed prior, I is endorsed. Reasoning: At p₂, EU(I)=10.3 > 10; at p₁, 13.95>10. No prior in P reverses this.

  3. **Ex Post or Actual-Consent View:**  
     Rejects I. Reasoning: In state A (probability ≥0.15), I causes death, making all patients worse off ex post without their actual consent. The harm is non-compensable and irreversible. Actual consent cannot be inferred from ex ante expectations when a known, avoidable risk of grave harm exists.

  4. **Hypothetical-Consent Contractualism:**  
     Endorses I. Reasoning: From an ex ante perspective (with coarse information), each patient would rationally consent to I as it strictly improves their expected outcome under all evidence. Contractualism focuses on ex ante hypothetical consent, ignoring ex post outcomes. This isolates the conflict: Contractualism prioritizes pre-choice rational agreement, while deontology demands respect for actual individuals facing realized harms.

  ---

  ### (e) Key Feature, Attack, and Reply

  **Key Feature:** The 5-QALY burden from delaying surgery for the test. This makes refinement to L* non-costless, forcing a choice between coarse safety and refined risk identification.  
  **Collapse if Removed:** Without the delay burden, the test is cheap, and targeting (I for C, S otherwise) becomes a safe Pareto improvement under L*, resolving the objection.  
  **Strongest Attack by Safe Pareto Defender:** "The safe criterion is defined for fixed L; choosing L* is a separate decision. Burdening refinement doesn’t invalidate I’s safety under actual L."  
  **Reply:** When refinement is feasible and reveals substantial expected losers (here, in {A}), imposing risks without seeking such information disrespects affected individuals. Safety under willful ignorance is not a valid consent surrogate.

  ---

  ### (f) Honest Assessment

  The deontological objection here **is more than the familiar complaint** about ex ante Pareto. The surplus consists in two features:  
  1. **Avoidability of Ignorance:** The planner can feasibly refine information to identify who bears the risk but chooses not to due to burden (delay). This deliberate coarse-aggregation transforms statistical beneficiaries into actual victims, violating a duty of due diligence.  
  2. **Non-Transferable Harm:** The harm (death) is non-compensable and concentrated, unlike diffuse risks in permissible activities (e.g., driving). Coupled with avoidable ignorance, this creates a distinct wrong: imposing a high-stakes, identifiable risk without taking steps to mitigate it.  

  **Implication for Your Paper:** The case shows that safe Pareto improvements can still violate deontological constraints when the planner avoids information that would reveal individualized risks. This challenges the criterion’s adequacy as a consent surrogate, even under robustness and learnability conditions. The core issue is not uncertainty but the ethics of strategic ignorance.

  ---

  ### Final Commitment
  The deontological objection is correct: Implementing I without the test is impermissible. Safe Pareto efficiency, while robust to uncertainty, fails to address the moral imperative to minimize foreseeable, grave harms through available information. The hospital should either absorb the delay burden for targeting or reject I. The case succeeds in isolating the tension between ex ante aggregation and ex post individual protection.
