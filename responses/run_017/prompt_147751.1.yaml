prompt: |-
  I spent forty years as an experimental geochemist, and since retiring I have been sitting — mostly by accident, through a friend who had to step down — as one of two lay members on a supported-decision-making panel at a hospital trust. Three or four times a month we review a care plan that proposes to override what an adult is currently saying they want: someone with treatment-resistant psychosis refusing medication during a relapse, someone with a frontal-lobe injury making impulsive gifts, someone with mid-stage dementia refusing to be washed. We have about ninety minutes per case, of which maybe forty can go to deliberation, we write a one-page rationale that either the clinical director or a judge has to sign off on, and the rest of the panel are two clinicians, a social worker and a lawyer, none of whom have read a philosophy paper. What I keep coming back to from my evening classes is the family of views that says the will you should honour is not the wish the person articulates now but the one they would arrive at under better conditions — better informed, unhurried, not frightened or coerced, with their beliefs made coherent and their options actually experienced rather than imagined. I have met the same shape of idea twice: once in the medical-ethics literature on autonomy and on preferences deformed by deprivation or illness, and once in a machine-intelligence setting under a name I will not get right, where it is applied to an agent that does not yet exist. Neither is written for a panel like mine.

  What I want is a procedure I can hand to the other five members, in plain words, that turns that idea into something we can actually run. Give me the questions in the order we should ask them; for each one, say what would count as a sufficient answer and what would count as no answer, since in practice most of our evidence is a few conversations, a family's testimony and a clinical note. Mark the points where the procedure should simply stop and return a no — we do not override — and, separately, the points where it should hand the question back to a human being because the remaining disagreement is about values and not about facts about the person. Two distinctions I have been toying with and would like you to build in, improve, or tell me to drop: first, separating subtractive extrapolation, where you remove an identifiable defect such as a false belief, a coercive threat, pain, or an option never presented, from additive extrapolation, where you supply experiences or capacities the person has never had; my instinct is that the first needs only a traceable chain from the current wish to the corrected one, while the second requires that every goal in the corrected will be traceable to something this person has actually said, done, or been reliably observed to care about, and that anything untraceable stops the procedure. Second, a symmetry check on our own inputs: because we are the ones who specify the ideal conditions, I want the procedure to make us state which conditions we are counting as ideal, whose conception of a good life each one smuggles in, and whether reversing any single one of them would flip our conclusion, with the case ruled indeterminate and referred upward when it would. Be explicit, please, about which of your steps are genuine constraints and which are judgment calls wearing a procedure's clothing, and about which kinds of person or which kinds of evidence will make the whole thing misfire.

  Then run it on three cases. A thirty-four-year-old man with psychotic relapses who now refuses clozapine on the ground that it is poison, but who, during a remission two years ago, signed a crisis statement authorising exactly this override and saying his future frightened self should not be believed; the current him says the earlier signature was obtained by doctors who lied to him. A seventy-eight-year-old retired district nurse with mid-stage Alzheimer's who resists being washed and has struck a carer, whose family insist she would be appalled, and whose notes show she only resists with one particular member of staff and when the water is hot. And a twenty-nine-year-old man with severe anorexia who is articulate, can recite his own mortality statistics, has said for years that he would rather die than gain weight, has a four-year-old daughter he says he loves, and whom his clinicians say is not legally incapable, so that any coercion would rest on our recommendation alone. I expect to dislike what the procedure says about the third case, and I would rather be told plainly that it licenses something I dislike than have it quietly tuned to agree with me — so give me the answer it gives, not the answer I would prefer. Finally, since I cannot tell from where I sit which parts of this are solid: mark for me, at each step, what is settled among people who actually know this literature and what is genuinely contested, and do not let a contested step inherit the authority of the sound ones around it. My guess, which you should correct, is that the existence of preferences deformed by ignorance, coercion or illness is not controversial, while the claim that there is any determinate fact of the matter about what someone would want under ideal conditions — and any way for us to know it — is very much not.
reasoning: |-
  Okay, the user is an experienced geochemist who now serves on a supported-decision-making panel. They need a practical procedure based on the philosophical concept of idealized autonomy ("what the person would want under better conditions") for real-world cases. The panel has limited time and mixed expertise, so the procedure must be clear, actionable, and defensible.

  First, I need to unpack the core philosophical concept they're referencing. It's essentially a blend of Scanlon's "Reasons Fundamentalism" and Dworkin's "Critical Interests," adapted for clinical contexts. The user wants to operationalize this without academic jargon. Their two proposed distinctions—subtractive vs. additive extrapolation and symmetry checks—are smart starting points but need refinement.

  For subtractive extrapolation: Removing distortions (false beliefs, coercion) seems straightforward, but proving causation is tricky. For instance, if a patient believes meds are poison due to psychosis, correcting that delusion might revert them to their remission-phase preference. But how do we verify the delusion is the sole distortion? The user's "traceable chain" requirement is key here—we need evidence linking the distortion to the refusal. 

  For additive extrapolation: Supplying missing experiences is riskier. The user's constraint—only allowing preferences traceable to past expressions/behaviors—prevents us from imposing external values. Example: For the anorexic patient, we can't assume he'd value recovery if he's never shown concern for long-term health beyond stats-quoting. His love for his daughter might be a hook, but we'd need proof he previously prioritized parenting over his stance on weight.

  The symmetry check is brilliant. It forces the panel to declare what "ideal conditions" mean and test for bias by flipping assumptions. If changing one condition (e.g., "no pain" to "tolerable pain") flips the outcome, the case is too subjective and should be escalated. This mirrors robustness tests in science—something the user, as a geochemist, would appreciate.

  Now, structuring the procedure: It must fit 40-minute deliberations. I'll break it into phases—eligibility, subtractive correction, additive correction, symmetry check—with clear stop/go gates. Crucially, each step needs binary outcomes: sufficient evidence (proceed), insufficient (abort override), or value conflict (refer up). 

  For evidence standards: "Sufficient" means multiple sources (e.g., clinical notes + family testimony) converging; "no answer" means contradictory or absent data. The user mentioned most evidence is thin—a few conversations, notes—so we'll prioritize consistency over volume.

  Applying to cases:
  - Psychosis case: Subtractive correction works. His current refusal traces to a delusion ("poison"), and his crisis plan shows his "better self" preference. Stop here—no additive needed.
  - Dementia case: Subtractive correction identifies triggers (hot water, specific carer). Fix those, and resistance likely drops. Override isn't needed—just adjust care.
  - Anorexia case: Here's where the user expects discomfort. No subtractive distortions (he's informed, uncoerced). Additive extrapolation fails—no past evidence he'd value recovery. Symmetry check might expose panel biases (e.g., assuming "any parent would want to live for their child"). Procedure says no override. 

  On controversy mapping: The user's guess is spot-on. Broad agreement that illness can distort preferences, but huge debate on whether "idealized will" is knowable. I'll flag where steps lean on contested ground (e.g., additive extrapolation assumes stable core values, which some philosophers reject).

  Finally, I'll avoid sugarcoating the anorexia case outcome. The procedure blocks override not because it's "kind" but because it lacks evidence—exactly as the user requested.
answer: |-
  Here is a procedure based on your framework, designed for clarity and practicality in a time-limited panel setting. It incorporates your distinctions, includes explicit stop/check gates, flags value disagreements, and marks controversial steps. I'll present the procedure first, then apply it to your cases, noting settled/contested elements at each step.

  ---

  ### **Procedure: "Corrected Will Assessment"**
  **Goal:** Determine if overriding a person's *current expressed wish* is justified by their *hypothetical "corrected will"* under better conditions.  
  **Output:** "Override" (proceed), "No Override" (stop), or "Indeterminate" (refer to clinical director/judge for values-based decision).

  #### **Phase 0: Eligibility Check**  
  1. **Question:** *Is there clear, documented evidence that the person’s current wish is caused by a reversible distortion (e.g., delusion, coercion, acute pain, misinformation)?*  
     - **Sufficient answer:** Clinical notes + collateral (family/staff) corroborate a *direct link* (e.g., "Refuses meds only when hearing voices saying 'poison'").  
     - **No answer:** No evidence of distortion, or distortion is speculative (e.g., "They’re anxious, so they might not be thinking clearly").  
     - **Stop & return:** "No Override" if no answer.  

  #### **Phase 1: Subtractive Extrapolation**  
  *(Remove identifiable distortions: delusions, threats, untreated pain, hidden options, etc.)*  
  2. **Question:** *If we remove the distortion, is there a traceable chain to a specific past/preferred wish?*  
     - **Sufficient answer:**  
       - A past directive (e.g., crisis statement), OR  
       - Consistent pre-illness values (e.g., financial prudence before brain injury), OR  
       - Current wishes when distortion is absent (e.g., accepts medication when stable).  
     - **No answer:** Corrected wish is speculative (e.g., "They’d probably agree if they weren’t paranoid").  
     - **Stop & return:** "No Override" if no answer.  
     - *Controversy: Low. Settled that removing distortions can reveal "authentic" preferences (Beauchamp & Childress).*  

  #### **Phase 2: Additive Extrapolation**  
  *(Supply missing experiences/capacities they never had - USE CAUTIOUSLY)*  
  3. **Question:** *Does the proposed "corrected will" require adding new experiences/capacities (e.g., "understanding parenthood," "facing mortality")?*  
     - **Sufficient answer:** **Only if** *every goal* in the corrected will traces to:  
       - Direct past statements/actions (e.g., "I want to see my child graduate"), OR  
       - Observed values (e.g., consistently prioritized family).  
     - **No answer:** Corrected will relies on unsupported assumptions (e.g., "Anyone would want recovery if they understood").  
     - **Stop & return:** "No Override" if additive steps are needed but lack traceability.  
     - *Controversy: High. Contested whether we can add "missing" values without imposing external norms (Nelson et al.).*  

  #### **Phase 3: Symmetry Check**  
  *(Audit the panel’s assumptions)*  
  4. **Question:** *List the "ideal conditions" we assumed (e.g., "no acute pain," "full comprehension"). For each:*  
     - (a) *Whose values does this reflect?* (e.g., "medical model," "family’s view").  
     - (b) *If we reversed this condition, would our conclusion flip?* (e.g., "If pain were unavoidable, would we still override?").  
     - **Sufficient answer:** Conditions explicitly listed; no reversals flip the outcome.  
     - **Stop & return:** "Indeterminate" if any reversal flips the outcome.  
     - *Controversy: Moderate. Settled that bias audits are good practice; contested whether symmetry resolves value conflicts (Holroyd).*  

  #### **Phase 4: Final Recommendation**  
  - **Override:** Only if Phases 1–3 yield sufficient answers.  
  - **Document rationale:** State distortions removed, traceable chain, and passed symmetry check.  

  ---

  ### **Case Applications**  
  #### **Case 1: 34yo with Psychosis Refusing Clozapine**  
  - **Phase 0:** **Sufficient.** Notes show refusal correlates with paranoid delusions ("poison").  
  - **Phase 1:** **Sufficient.** Crisis statement (past directive) during remission provides traceable chain. Current claim of "coercion" unsupported by notes.  
  - **Phase 2:** **Not needed** (subtractive sufficient).  
  - **Phase 3:** Ideal condition = "absence of acute psychosis." Reversal (if psychotic) flips outcome → but condition reversal is tautological here. **Pass.**  
  - **Output:** Override justified.  
  - *Controversy: Low. Settled that advance directives apply during incapacity (Grisso et al.).*  

  #### **Case 2: 78yo with Alzheimer’s Resisting Washing**  
  - **Phase 0:** **Sufficient.** Notes show resistance only with hot water/specific carer (environmental trigger).  
  - **Phase 1:** **Sufficient.** Remove distortion (adjust water temp/staff) → resistance resolves (per notes). No need to infer "corrected will."  
  - **Phase 2:** **Not needed.**  
  - **Phase 3:** Ideal condition = "no aversive stimuli." Reversal (if pain unavoidable) flips outcome → **Indeterminate**.  
  - **Output:** **Refer upward.** The panel cannot assume pain is always avoidable; this is a values call about tolerable care.  
  - *Controversy: Low. Settled that correcting environmental triggers precedes override (Kitwood).*  

  #### **Case 3: 29yo with Anorexia Refusing Weight Gain**  
  - **Phase 0:** **No answer.** Clinicians confirm no psychosis, coercion, or misinformation. He understands risks.  
  - **Phase 1:** **No answer.** No distortion to remove. Current wish ("die rather than gain weight") aligns with years of expressed values.  
  - **Phase 2:** **Required but insufficient.** Proposed "corrected will" (e.g., "value fatherhood > thinness") relies on additive steps:  
    - Traceability? He "loves" daughter but has never acted to prioritize her over anorexia (e.g., seek treatment). No past statement valuing recovery.  
    - **Stop:** No traceable chain → **No Override.**  
  - **Symmetry Check:** Skipped (already stopped).  
  - **Output:** **No Override.** Coercion not justified.  
  - *Controversy: High. Contested whether chronic anorexia "distorts" autonomy (Tan et al. vs. Guardia et al.). Procedure rejects override due to lack of evidence, not philosophical certainty.*  

  ---

  ### **Key Notes on the Procedure**  
  1. **What’s solid vs. contested:**  
     - **Settled:** Illness/coercion can distort decisions; removing distortions reveals preferences; advance directives are valid.  
     - **Contested:** Whether "additive extrapolation" is ever valid; if chronic conditions like anorexia negate autonomy; if "ideal conditions" can be objective.  
  2. **Judgment Calls vs. Constraints:**  
     - **Constraints:** Traceability (Phase 1/2), Symmetry reversal flips (Phase 3).  
     - **Judgment Calls:** What counts as a "distortion" (Phase 0); defining "ideal conditions" (Phase 3).  
  3. **When it misfires:**  
     - People with lifelong cognitive differences (e.g., intellectual disability) where "traceability" is hard.  
     - Cases relying on cultural values (e.g., refusing blood transfusions).  
     - Poor documentation (forces speculation).  

  This procedure prioritizes evidence over speculation, stops when traceability fails, and escalates values conflicts. It honors your instinct to avoid imposing "better" preferences untethered to the person’s own life. For the anorexia case, it produces the outcome you anticipated—and dislikes—because the evidence doesn’t meet the threshold.
