  **\*\*\* OVERLEAF: FREQUENTLY ASKED QUESTIONS \*\*\*** (Synergix Solutions DAF v.3.1)

  **Q1: Why is my "ability to work hard" discounted? Isn't that effort?**  
  A1: Effort exertion capacity is significantly influenced by innate traits (e.g., Conscientiousness - see ICTA) and formative environmental factors (see CEO-SR). The *choice* to apply effort within your specific capacity range is factored into the CMOA adjustment. Pure effort divorced from contingent advantage is minimal.

  **Q2: I studied for years to gain my skills! Why isn't that fully meritorious?**  
  A2: The *capacity* to undertake sustained study, access to educational opportunities, and the absence of catastrophic disruption during study periods are heavily influenced by genetic, environmental, and luck factors (GAB-D, CEO-SR, NEEI-R). The counterfactual simulation isolates the marginal gain attributable solely to your choices within that contingent framework (partially reflected in CMOA).

  **Q3: Why did I get less NMD this month than last month? I worked harder!**  
  A3: Increased output may correlate with favorable stochastic outcomes (SOL) or periods of unusually high negative event insulation (NEEI-R). The DAF objectively quantifies the desert component, which may fluctuate independently of subjective effort perception. Increased effort often simply utilizes unearned advantages more fully.

  **Q4: Is the NMSA going to increase with inflation?**  
  A4: The Non-Merit Sustenance Allocation (NMSA) is reviewed annually against regional living cost indices, as per the Global Labour Accord. Adjustments are made solely to meet the Accord's baseline sustenance requirement and **ARE NOT** a reflection of merit or performance. Any increase remains explicitly non-meritorious.

  **Q5: This feels demoralizing. Is that intentional?**  
  A5: Synergix Solutions' DAF fosters a culture of radical honesty and ethical compensation. Understanding the true, limited scope of individual desert relative to contingent advantage is fundamental to workplace equity. Any discomfort may stem from prior conditioning within less rigorous, luck-tolerant pay systems. We offer mindfulness seminars (fee applies).¹

