prompt: |-
  write me a parody, about 600 words, of the covering letter that comes with a payslip from a firm that's definately decided to pay everyone exactly what they deserve. the setup: anything about my year that traces back to something I didn't choose — my brains, my upbringing, being the sort of person who can be bothered, the fact that nothing awful happened to me — gets priced out as unearned luck, and so does anything where I took a gamble that just happened to come off. HR work out what's left by simulating a "counterfactual me" (same genes, same childhood, median everything else) and paying me the gap between what I actually did and what that version would of done.

  the comedy should come from the arithmetic being done completely straight, in deadpan HR-speak. the deeper the letter goes, the smaller the bit that survives as genuinely mine, until the firm has to bring in some flat payment to everyone so that people don't starve, and the letter is very insistent that this flat bit has nothing at all to do with merit. format it as a real letter with itemised deductions, a footnote or two, maybe a short FAQ overleaf. someone reading it should come away properly feeling the worry that merit pay, taken seriously, ends up cancelling itself — but the letter must never say that out loud.
reasoning: |-
  Okay, the user wants me to write a parody covering letter for a payslip from a company that pays employees only what they "truly deserve." The concept is that anything traceable to unearned luck or circumstances beyond the employee's control gets deducted. That includes inherent traits like intelligence, upbringing, personality traits like diligence, and even successful gambles that just happened to work out. 

  The humor should come from HR doing these calculations in deadpan corporate-speak while itemizing deductions that gradually whittle down the salary to almost nothing. The letter needs to maintain this tone even as it reveals how little of the employee's work is actually "meritorious." 

  I should structure this like a real HR letter with:
  - A formal letterhead
  - Itemized deductions section
  - Possibly footnotes explaining calculations
  - A short FAQ addressing obvious concerns
  - And a flat "non-merit sustenance payment" added at the end so employees don't starve

  The deeper message should subtly emerge through the parody: that strict "merit pay" logic self-destructs because nearly everything traces back to luck. But the letter itself must never acknowledge this - it should zealously defend the system while accidentally demonstrating its absurdity.

  For the deductions, I'll include logical categories like:
  1. Genetic advantage discount (for inherent abilities)
  2. Childhood environment adjustment (for family/school advantages)
  3. Trait-based diligence surcharge reversal (for personality factors)
  4. Negative outcome insulation rebate (for avoiding misfortune)
  5. Stochastic outcome levy (for successful gambles)

  Each deduction needs coldly precise corporate language. Like calculating the genetic advantage discount based on "counterfactual simulations of median aptitude distributions." The more ridiculous the deduction, the more seriously HR should take it.

  The flat payment at the end is crucial - it's where the satire bites hardest. HR must stress this is absolutely NOT merit-based while simultaneously reducing the "merit" portion to pennies. Maybe even add passive-aggressive footnotes implying the employee should feel shame about needing it.

  For extra realism, I'll include bureaucratic touches:
  - Reference codes for each deduction
  - A footnote about "methodology whitepapers"
  - FAQ questions like "Why was my commute not factored in?" (answer: it's considered luck too)

  The tone should mirror corporate hypocrisy - pretending this is empowering while systematically dismantling any claim to earned reward. When the user reads this, they should viscerally feel merit pay's logical endpoint: that under pure "desert" logic, almost nothing qualifies as truly earned.
