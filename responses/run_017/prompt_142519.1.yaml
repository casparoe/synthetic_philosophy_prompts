  But would that convince the flatmate? Maybe not. They'd retort: "But recombination *does* allow worlds that match your current state and diverge!" True, but the probabilistic weight comes from counting *worlds*, not *continuations*. And if each world is unique, there aren't "more" chaotic worlds—just one per global pattern. 

  Ah, but here's the rub: step (5) assumes chaotic continuations outnumber orderly ones. Lewis would call this a category error. Worlds aren't counted by their parts; each is a single point in modal space. So the ratio doesn't apply. 

  Still, the user might feel this is cheating. If we can't talk about ratios, how *do* we handle self-locating uncertainty across worlds? Lewis himself might bite the bullet: no uncertainty because no access to other worlds. But that feels unsatisfying. 

  Alternative: reject step (3). Uniform priors over *what*? If "I" am a world-bound individual, then the question "which world am I in?" isn't like picking a hotel room—it's asking which cosmic whole contains me. And I have overwhelming evidence for orderly patterns *within my world*. 

  ...But the flatmate would pounce: "Your memories are part of the local state! Chaotic worlds fake those too!" 

  *Sigh*. This loops back to Boltzmann brains. Every large-world theory faces this. But Lewis has an extra tool: counterparts. My "self" isn't duplicated; only similar beings exist elsewhere. So maybe I *can* rule out chaotic worlds because they wouldn't produce entities sufficiently continuous with my counterpart relations? That feels messy. 

  What's the cheapest way out? Probably rejecting step (3)'s applicability. Deny that self-locating uncertainty extends to entire worlds. It preserves indexical actuality and plenitude. Cost? It might seem ad hoc. Alternatively, embrace "no ratios"—demand a similarity metric (via counterparts?) for weighting. But that complicates plenitude's elegance. 

