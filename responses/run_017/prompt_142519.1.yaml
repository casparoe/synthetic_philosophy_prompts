  First, I need to reconstruct the argument step by step. The user laid out eight steps, but the real pressure points are steps (3) and (1). Step (3) is about uniform priors over self-locating uncertainty, and step (1) establishes the indexical nature of actuality. The user wants to save Lewis's original package—indexical actuality, counterpart theory, no duplicates, plenitude as qualitative variety. 

