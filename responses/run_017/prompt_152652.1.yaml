prompt: |-
  I'm TAing for an upper-level seminar on practical rationality this term, and last week in the grad lounge — three coffees deep, my notes a mess — our study group got into an argument we where not able to settle, and I want a pair of cases that either settles it or at least forces the disagreement out into the open.

  Here's where we got stuck. Everyone agreed that hyperbolic (or beta-delta / quasi-hyperbolic) discounting is the standard formal story people reach for when they want to model weakness of will. But then someone pointed out that what the model actually delivers is a *change* in what the agent prefers between t1 and t2: at t2 she prefers the smaller-sooner option, full stop, discounted at her own current rate. So on the model she never acts against her own contemporaneous all-things-considered judgement. The "weakness" only shows up if you identify the earlier self and the later self as one agent and treat the earlier ranking as the authoritative one. Half the room said that's precisely the point and strict akrasia is a myth; the other half said no, there are perfectly ordinary cases where you know right then, in the moment, that you shouldn't, and you do it anyway, and no discount curve has anything to say about those.

  So: build me a matched pair of cases that separates the two phenomena. Same agent as nearly as possible, the same two options (a smaller-sooner and a larger-later reward a normal person could actually face — dissertation writing, a night shift, the gym, saving for a new boiler, whatever works), and the same observable sequence: at t1, with both options still ahead of her, she ranks the larger-later option above the smaller-sooner one and says so or plans accordingly; at t2, with the smaller-sooner option now on offer, she takes it.

  - In Case 1, the reversal has to be *generated* by present-biased discounting and nothing else — I want to see the common-delay signature explicitly (both options delayed → larger-later wins; the common delay removed → smaller-sooner wins), i.e. the pattern a time-consistent exponential discounter cannot produce.
  - In Case 2, the same observable sequence, but the agent is time-consistent: at t2 she still ranks the larger-later option above the smaller-sooner one, and takes the smaller-sooner one anyway. Hyperbolic discounting should contribute nothing to the explanation.
  - Both cases: ordinary life, one paragraph each, no exotic devices, no forgetting, no new information that changes the payoffs, no drugs or brain lesions. Don't stipulate the verdicts — generate them from the set-up, and make it a real matched pair, not two unrelated stories with the same moral.

  Then give me the payoff: for each case, what she prefers and does at t1 and at t2 and why; in which case (if either) charging her with akrasia is actually apt, keeping synchronic akrasia distinct from mere diachronic preference change; the single structural feature that differs between the two cases and what happens to the pair if you remove it; and an honest note on the counterattacks — how someone who thinks the discounting story *is* the theory of akrasia would try to explain Case 2 away, and how someone who insists on strict akrasia would argue that Case 1 isn't weakness of will at all. I'm planning to run this in discussion section, so keep it tight enough to put on one handout.
reasoning: |-
  Okay, the user is a TA for an upper-level seminar on practical rationality. They need a pair of matched cases to clarify a debate about whether weakness of will (akrasia) requires acting against one's contemporaneous judgment or if it can be explained by time-inconsistent discounting (like hyperbolic discounting). 

  The study group is split: half think hyperbolic discounting shows preference change over time, not true akrasia; the other half believe people sometimes act against their own simultaneous judgment. The user wants two cases with the same observable behavior (planning for larger-later reward at t1, choosing smaller-sooner at t2) but different mechanisms.

  First, I need to design Case 1 where hyperbolic discounting drives the reversal. The key is the "common-delay signature": when both options are equally delayed, the agent prefers the larger-later one, but when the smaller reward is immediate, she switches. Real-life examples like gym vs. Netflix or work deadlines would work. Must show pure time-inconsistency without extra factors.

  For Case 2, the agent must be time-consistent but still choose the smaller-sooner reward against her better judgment. This is trickier—how to show synchronic akrasia? The reward structure needs to stay identical, with no new info. Maybe a visceral temptation overpowering reasoned judgment? Like snacking while dieting, where the person explicitly thinks "I shouldn't" but does it anyway.

  The matched pair must share surface elements: same agent, similar rewards (e.g., work productivity), same sequence. The structural difference lies in the decision-making at t2: in Case 1, preference genuinely flips due to discounting; in Case 2, preference stays with larger-later but action contradicts it.

  For payoffs, I'll analyze each case's preferences and actions. In Case 1, charging akrasia is misleading because she's following current preferences. In Case 2, synchronic akrasia is clear. The key structural difference is whether t2 choice reflects current ranking (Case 1) or violates it (Case 2).

  Anticipate counterarguments: pro-discounting theorists might deny Case 2 exists, arguing hidden discounting or reinterpreting "judgment." Anti-discounting theorists might say Case 1 involves irrationality, not weakness. Need to address both briefly.

  User needs this for a handout—keep it tight, one paragraph per case, then concise analysis. Use relatable examples: academic deadlines for Case 1 (hyperbolic signature), dietary lapse for Case 2 (visceral override). Avoid exotic elements to keep focus on the philosophical distinction.
answer: |-
  Here's a matched pair isolating the mechanisms, designed for clarity and debate:

  **Case 1: The Hyperbolic Reversal (Pure Time-Inconsistency)**
  *Alex faces a tight dissertation deadline Friday. At Monday's planning meeting (t1), she considers: (A) Work intensely Tuesday & Wednesday for a high-quality draft (larger-later reward), or (B) Do light review Tuesday and socialize Wednesday evening (smaller-sooner reward). With both rewards days away, Alex's discounting is moderate. She calculates the future satisfaction of a strong draft outweighs the nearer fun. She declares her plan: intense work Tue/Wed. On Tuesday morning (t2), Option B is *now* available: light review today guarantees a pleasant evening *tonight*. Option A requires grueling work *today* for a draft payoff still 3 days away. Alex's present bias kicks in: the immediate pleasure of tonight is hyperbolically discounted much less than Friday's draft satisfaction. She now genuinely prefers B. She does the light review and socializes, abandoning her Monday plan. (Common-delay signature: At t1, both rewards delayed → A > B. At t2, common delay removed from B → B > A).*

  **Case 2: The Moment of Weakness (Synchronic Akrasia)**
  *Ben is on a strict budget saving for a crucial new boiler (larger-later reward). On Sunday (t1), he reviews his finances. He sees that skipping his usual Friday night takeout & drinks (smaller-sooner reward) this week would significantly boost his savings. He explicitly judges skipping is best, commits aloud to his partner, and plans a cheap home-cooked meal instead. On Friday after a draining work week (t2), Ben stands hungry outside his favorite takeout place. The boiler reward is still 3 weeks away; the takeout pleasure is immediate. Ben *knows* skipping is better for his goal. He calculates mentally: even factoring in hyperbolic discounting, the boiler's future value *still* outweighs the immediate takeout. He feels the craving but his *judgement* remains clear: he *should not* buy it. Yet, overwhelmed by fatigue and craving, he sighs, mutters "I shouldn't do this," walks in, and buys the takeout anyway.*

  **Payoff Analysis**

  | Feature               | Case 1 (Hyperbolic Alex)                       | Case 2 (Akratic Ben)                          |
  | :-------------------- | :--------------------------------------------- | :-------------------------------------------- |
  | **t1 Preference**     | Larger-Later (A) > Smaller-Sooner (B)          | Larger-Later (Boiler) > Smaller-Sooner (Takeout) |
  | **t1 Action/Plan**    | Commits to A                                   | Commits to skipping Takeout                   |
  | **t2 Preference**     | **Smaller-Sooner (B) > Larger-Later (A)** (Due to hyperbolic discounting) | **Larger-Later (Boiler) > Smaller-Sooner (Takeout)** (Judgement unchanged) |
  | **t2 Action**         | Chooses B (Aligns with t2 preference)          | **Chooses Takeout** (Contradicts t2 preference/judgement) |
  | **Akrasia Apt?**      | **No.** Action aligns with contemporaneous preference. "Weakness" is only diachronic preference shift. | **Yes (Strict/Synchronic).** Action directly contradicts contemporaneous all-things-considered judgement. |
  | **Key Structural Diff** | **t2 Preference Reversal:** Discounting flips the ranking. | **Action-Preference Divergence:** Preference/judgement stays constant; action violates it. |
  | **Remove this Feature?** | Remove hyperbolic discounting → Alex remains time-consistent, likely sticks with plan. | Remove the ability to act against judgement → Ben either doesn't enter the tempting situation or resists the urge, sticks with plan. |
  | **Pro-Discounting Counterattack on Case 2** | "Ben's 'judgement' isn't his true revealed preference. The fact he acts shows his *real* t2 preference is for takeout. His muttering is cheap talk/dissonance. Hyperbolic discounting explains the *shift* in commitment from t1 to t2 action." | |
  | **Pro-Akrasia Counterattack on Case 1** | "Alex isn't weak-willed; she's just dynamically inconsistent. Her t2 self isn't failing *itself*, it's rationally pursuing its *current* preferences. Calling this 'weakness' conflates changing goals with failing to follow a goal one still holds." | |

  **Why It Works & Discussion Points**

  1.  **Matched Surface:** Both involve commitment at t1 (dissertation plan / savings plan), reversal to smaller-sooner at t2 (socializing / takeout), with similar rewards (work quality/boiler vs. leisure/takeout).
  2.  **Isolating Mechanism:**
      *   *Case 1:* Shows the *signature* of hyperbolic discounting. Alex's t2 preference genuinely flips *because* the smaller reward becomes immediate. The common-delay removal causes the reversal.
      *   *Case 2:* Eliminates time-inconsistency as the driver. Ben explicitly judges the larger-later option superior *at t2* but acts against this judgement. Hyperbolic discounting is present (making takeout tempting) but insufficient to flip his *stated and considered* preference.
  3.  **Synchronic Akrasia Defined:** Case 2 highlights the core of strict akrasia: action contradicting the agent's *own* contemporaneous best judgement. Ben knows he shouldn't *right now*, and does it anyway.
  4.  **The Crucial Divergence:** The pair isolates the difference between *preference reversal* (Case 1, diachronic) and *action contra preference* (Case 2, synchronic).
  5.  **Counterattack Clarity:** The handout forces proponents of each view to either deny the phenomenology of Case 2 ("Ben didn't *really* judge it best") or argue Case 1 isn't genuine weakness ("Alex just changed her mind rationally").

  **Honest Notes on Use:**

  *   **Counterattack Nuance:** Pro-discounting theorists might argue Ben's t2 "judgement" is a higher-order cognitive state, not his "true" motivational preference revealed by choice. Pro-akrasia theorists might argue Alex's t1 commitment involved a judgement she *should* be time-consistent, making her t2 action akratic relative to that meta-judgement. Be ready for these moves.
  *   **Focus:** Keep discussion on the *structural* difference revealed by the cases: does the t2 *action* match the agent's t2 *preference/judgement*? That's the fork.
  *   **Realism:** While stylized, the cases use relatable, non-exotic dilemmas. The visceral craving vs. abstract goal in Case 2 is key to making synchronic conflict plausible without invoking irrationality about the rewards themselves.

  This pair cleanly separates diachronic preference instability (modeled by discounting) from synchronic action-preference divergence (akrasia proper), providing a concrete basis for the seminar's debate.
