prompt: |-
  Something keeps coming up in long argument threads in the rationalist-adjacent corners of the internet, and I have never once seen anyone attach a name to it, so I want to know whether the philosophical literature has one.

  The pattern: someone proposes an attitude — believe that P, hope for Q, trust this person — and defends it by pointing to what having the attitude would *do*. Sometimes the move is transparently corrupt. Offer me a million dollars to believe that the sky is green, or credibly threaten me until I do, and you have given me an excellent reason to end up with that belief and no reason at all for it; the reasons there are for believing something are supposed to come from the thing believed, not from the payoffs of believing. Fine.

  But the same move sometimes looks not merely acceptable but exemplary. If I say that I trust my graduate student with the lab because my trusting her is part of what makes her rise to the occasion, nobody hears that as a corrupting reason. On the contrary, the person who withholds trust on those grounds is the one whose attitude looks defective. Hoping seems similar: "hoping will make you work harder, so hope" is not heard as a corrupt reason for hope — and, tellingly, the reverse is also heard as a real consideration: "hoping will make you complacent, so don't hope." Belief looks sealed against considerations running in either direction: neither the bribe nor the prospect of a devastating truth seems to touch whether the belief is the one to hold. Trust and hope look porous in both directions. That contrast is the thing I want a handle on.

  More than a label, I want a carving, and these are the distinctions I keep needing and cannot state cleanly:

  - Trusting her does not literally manufacture her reliability; at best it gives a capacity she already has the chance to manifest. My believing that I will recover from the placebo can help produce my recovery, with no prior capacity to elicit. Those two feel different, and I suspect the difference is doing the real work in the cases above, but I cannot say what the difference is.
  - Some cases are collective rather than individual: my believing that the bank is solvent does not make it solvent, though enough people's doing so would. Does that belong to the same phenomenon or a different one?
  - Intending to do something makes it likelier almost by definition. So if "the effects of the attitude" were admissible in general, intention would come out as trivially self-supporting. Something must exclude that, and I want to know what.
  - And there is a looping worry: if an attitude brings about the very property it is supposed to be a response to, then it looks as though it cannot be a response to anything independent of itself, and so cannot be merited at all. That conclusion seems right for the bribe and wrong for the trust case, and I cannot say why.

  Please don't give me a reading list; I want the map. Is this one phenomenon with a settled name, or several that I am conflating? Which established concepts are the near neighbours, and how does what I have described differ from each of them? Where are the edges — which attitudes are porous to their own effects, which are sealed, and what predicts the difference? If some part of it genuinely has no name, coin one, define it, and tell me which of my cases fall inside it and which just outside.
reasoning: |-
  Okay, the user is describing a recurring debate in rationalist circles about whether the consequences of holding an attitude (like belief, trust, or hope) can legitimately justify holding that attitude. They note that for beliefs, it seems corrupt to base them on consequences (like a bribe), but for trust or hope, it seems acceptable or even exemplary. They want to understand the distinctions here and get a conceptual map rather than a reading list.

  First, I need to identify the core issue. The user mentions several key points: the difference between beliefs and attitudes like trust/hope, the role of self-fulfilling effects, collective vs. individual cases, and the problem of circularity. They also mention intention as a case where the attitude inherently affects outcomes. The user is looking for clear categories and predictive distinctions.

  Let me start by recalling philosophical concepts. Pragmatic reasons for belief (pragmatic encroachment) come to mind, but that's usually about stakes affecting justification, not consequences of belief itself. Then there's doxastic voluntarism—whether we can choose beliefs. But the user's examples show that even involuntary attitudes like hope have this porousness. So maybe it's about the attitude's functional role.

  Trust and hope seem to have a "constitutive" element. Trusting someone can encourage trustworthy behavior, making the attitude part of a feedback loop. Beliefs, however, are supposed to represent reality independently. So the distinction might be between attitudes that are world-to-mind (like intentions) versus mind-to-world (beliefs). But hope is tricky—it's not purely either.

  The placebo effect example is interesting. Believing in recovery can cause recovery, but that's different from trust. The key difference might be that trust relies on pre-existing capacities in others, while placebo is a direct physiological effect. So perhaps other-involving attitudes versus self-involving.

  For collective cases, like believing a bank is solvent, that's a self-fulfilling prophecy. If enough people believe it, their actions (not withdrawing) make it true. This seems related but distinct because it's collective. The user wants to know if this is the same phenomenon. Probably under the broader umbrella of performative attitudes.

  Intention is self-fulfilling by definition because intending leads to action. But the user points out that if attitudes can be justified by their effects, intention would be trivially justified. So there must be a limit. Here, intention is different because its function is to commit to action, so the effect is inherent, not additional.

  The looping worry: if trust causes trustworthiness, how can it be responsive to actual trustworthiness? The answer might be that trust is a stance that creates the conditions for responsiveness, not a passive reflection. It's forward-looking.

  Putting it all together: The main distinction is between cognitive attitudes (beliefs) that aim at truth and are sealed, and practical attitudes (trust, hope) that are porous because their function involves shaping outcomes. Predictive factors: whether the attitude is world-directed vs. action-oriented, whether it involves others' agency, and if it's part of a feedback loop.

  The established concepts are epistemic vs. practical reasons, doxastic vs. practical attitudes, and performative utterances extended to attitudes. The porous attitudes are those that are stances or commitments, not purely descriptive.

  For labeling, "Teleogenic Reasons" (goal-originating) for reasons based on outcomes, applicable to practical attitudes. "Stance-dependent properties" for features like trustworthiness that are elicited by the attitude.

  Edges: Beliefs are sealed except in placebo (which is physiological, not epistemic). Collective cases are a subtype of performativity. Intention is self-validating by nature but not circular because its reason is the action's value, not the intention's effect.

  The user's deeper need is to resolve debates by having clear criteria to classify when consequence-based reasons are valid. They might also want to understand how to evaluate attitudes in rational discourse without falling into circularity or corruption.
answer: |-
  This is a beautifully articulated puzzle that cuts across epistemology, ethics, and philosophy of mind. You're observing **Teleogenic Reasons** (from Greek *telos* = end/purpose + *genesis* = origin) — reasons for adopting an attitude that appeal to the *consequences* of holding it. The phenomenon isn't monolithic; it fractures along predictable fault lines. Below is the conceptual map, distinctions, and predictive framework you requested.

  ---

  ### **Core Distinction: Cognitive vs. Practical Attitudes**
  The key divider is whether the attitude's **primary function** is *representational* (aiming to reflect reality) or *practical* (aiming to shape reality). 

  1. **Sealed Attitudes (Cognitive):**  
     - **Function:** Accurately represent mind-independent states (e.g., belief, knowledge).  
     - **Rule:** Must be responsive only to *epistemic reasons* (evidence, truth-tracking).  
     - **Why sealed?** Truth is not teleogenic; believing P doesn't (usually) make P true. Introducing non-epistemic reasons corrupts the attitude's function.  
     - **Example:** Bribing someone to believe the sky is green fails because the reason is decoupled from truth.  
     - **Edge Cases:**  
       - *Placebo effect:* Your belief in recovery *causes* recovery. This works because the belief operates physiologically (via expectation → neurochemical cascade), not epistemically. The reason for belief here is *instrumental* (health outcome), not evidential. It's an exception proving the rule: when belief *does* directly shape reality, teleogenic reasons become admissible — but only for that specific causal pathway.  
       - *Collective self-fulfilling prophecies:* Believing a bank is solvent *can* make it solvent if enough people act on that belief (preventing a run). This is a *performative* effect of aggregate action, not individual belief. Teleogenic reasons apply only if you’re coordinating collective action; otherwise, it’s still corrupt for an individual.  

  2. **Porous Attitudes (Practical):**  
     - **Function:** Initiate or sustain patterns of action, relationship, or agency (e.g., trust, hope, commitment, intention).  
     - **Rule:** Responsive to *practical reasons* (consequences, relationships, goals).  
     - **Why porous?** These attitudes are *participatory*; they help constitute the reality they engage with.  
     - **Examples:**  
       - Trusting a grad student elicits their reliability.  
       - Hoping for success motivates effort.  
       - Intending to act commits you to action.  
     - **Looping Resolved:** Teleogenic reasons here aren't circular because the attitude isn't *merely* responsive — it's *causally generative*. Trust isn't justified *by* reliability it creates; it's justified by the *potential for co-created reliability*. The reason is forward-looking: "Adopting this attitude will actualize a valuable possibility."  

  ---

  ### **Predictive Framework: When is Teleogenesis Legitimate?**
  An attitude permits teleogenic reasons if it passes **all three** conditions:  
  1. **Constitutive Causation:** The attitude must *directly participate* in bringing about the state it references (e.g., trust → trustworthiness via encouragement/expectation).  
  2. **Non-Guarantee:** The outcome isn't certain; the attitude *risks failure* (e.g., trust can be betrayed, hope can be disappointed).  
  3. **Practical Orientation:** The attitude’s core purpose is *agency-shaping* (e.g., sustaining effort, building relationships) — not representing facts.  

  | **Attitude** | **Teleogenic?** | **Why?** | **Counterexample** |
  |--------------|-----------------|----------|-------------------|
  | **Belief**   | No (usually) | Represents mind-independent facts | Placebo/collective cases are exceptions |
  | **Trust**    | Yes | Constitutes relational agency | Trusting a known liar (fails #1) |
  | **Hope**     | Yes | Sustains motivation amid uncertainty | Hoping for the impossible (fails #2) |
  | **Intention** | **Bounded** | Inherently action-generating | Intending the undoable (fails #2) |
  | **Commitment** | Yes | Creates binding reasons to act | Committing to a pointless act (fails #3) |

  ---

  ### **Resolving Your Specific Queries**
  1. **Trust vs. Placebo:**  
     - Trust elicits *agency* (the student's latent capacity); it requires pre-existing potential. Placebo belief operates via *brute causation* (neurobiology), needing no agency. Trust is *interpersonal co-creation*; placebo is *mechanical*.  

  2. **Collective Cases:**  
     - Belongs to the same phenomenon (*performative teleogenesis*). Distinguish:  
       - *Individual:* Your belief alone cannot save the bank (no teleogenic reason).  
       - *Collective:* If your belief signals to others (e.g., "I won't withdraw if you don't"), it becomes practical coordination — thus porous.  

  3. **Intention's Self-Support:**  
     - Intention *is* teleogenic ("I intend X because intending makes X likely"). But it's **bounded**: teleogenic reasons only work if the intention is *executable* (you can’t intend to flap your arms and fly). The reason for intending must still appeal to X’s *value*, not just the intention’s effect.  

  4. **Looping Worry:**  
     - Porous attitudes avoid vicious circularity because they target *emergent properties*:  
       - Trust → *elicited* trustworthiness (not pre-existing).  
       - Hope → *sustained* effort (not guaranteed success).  
     - The "merit" is in the *pragmatic success* of the attitude (e.g., "Trust worked; she became reliable"), not correspondence to prior truth.  

  ---

  ### **Unified Label & Boundaries**
  - **Name:** **Teleogenic Normativity** (norms grounded in an attitude's consequences).  
  - **Scope:** Applies to attitudes that are:  
    - **Stances** (trust, hope, commitment) — proactive orientations toward uncertainty.  
    - **Volitional** (intention) — directly action-guiding.  
  - **Excluded:**  
    - Purely cognitive states (belief, knowledge).  
    - Emotions (fear, joy) — these *can* have teleogenic elements (e.g., "be angry to deter injustice"), but only derivatively, via their link to action.  

  ---

  ### **Why This Map Matters**
  You’re observing a clash between **epistemic rationality** (beliefs track truth) and **practical rationality** (attitudes optimize outcomes). Teleogenic normativity is legitimate when an attitude is *itself a tool*. The rationalist tendency to over-extend evidentialism (treating all attitudes as beliefs) causes this confusion. **The predictive divider:** if the attitude’s success condition *depends on its own adoption*, teleogenic reasons are valid. If not, they’re corrupt.  

  This framework resolves your cases: trust/hope *require* adoption to work; belief (usually) does not. The bank case is hybrid (individual belief is sealed; collective coordination is porous). Intention is inherently teleogenic but constrained by feasibility. No reading list — this *is* the map.
