  Here’s a five-minute tribute that honors Dr. Selby’s philosophy while offering comfort to her family, answers your friend’s objection, and keeps the tone fitting for her "party, not a funeral":

  ---

  **For Marion**  
  *(Standing casually, perhaps with a faint smile)*  

  Good afternoon. Marion Selby hated eulogies. She’d call them “posthumous Cartesian theaters” – as if the real her was still sitting in some hidden balcony, watching us perform. So, I won’t pretend she’s here now, nodding approval. But I will say this: **her absence is real, and it hurts.** Lois, family, friends, neighbors—we all feel it. That emptiness by the dock, that quiet where her voice should be.  

  Marion spent her life arguing there’s no little self inside us, no ghostly spectator. Consciousness wasn’t a destination in the brain, she’d say, but a process with a **deadline**. Like a newspaper going to press: once the ink dries, that’s the story. Before the deadline? Countless drafts. After? Something fixed. What felt like “her” wasn’t a static core, but the pattern that survived revision—her stubborn kindness, her impatience with pretense, her way of re-staining your dock whether you asked her to or not.  

  “Give me a step or two, I’ll have you by your walk,” she’d say after her stroke. That wasn’t Marion peering out from behind damaged circuits. It was *her*—the whole, irrevisable draft—adapting. When I once said, “I’m glad you’re still in there,” she corrected me: “There’s no *in there* to be in.” Just the work of recognition meeting its deadline.  

  So what do we mourn? Not a hidden soul that flickered out. We mourn the **irrevisable pattern** that was Marion. The drafts that finally went to press: her laugh, her fierce loyalty, the way she’d argue with you for hours but still drive you home in the rain.  

  **To Lois and her family:** Did Marion know you loved her? Absolutely. Not because some inner witness received the message, but because your love became part of her story—a draft that *made deadline*. Every shared meal, every stubborn debate, every time you rolled your eyes at her chaotic dog—those became fixed points in her. Unchangeable. Real. She carried them forward.  

  Is she “at peace”? Well, peace implies a self to feel it. But think of it like this: Marion’s story isn’t being revised anymore. The final draft is printed. The work is complete. And what survives—what’s etched now in *us*—is the pattern she built: her integrity, her curiosity, her refusal to take the easy sentimental path. That’s a kind of peace—beyond editing, beyond pain.  

  **To my skeptical friend:** You ask, “Who is the ‘she’ in her life story if not a continuous self?” Fair. But stories don’t need ghosts. Think of a river. Is it one thing? Water flows, banks shift, currents change. Yet we name it, map it, love it. Why? Because its *pattern persists*. Marion was a river—sometimes turbulent, sometimes still, always flowing toward her deadlines. Her life wasn’t “about” a spectator. It was about the shape of the current: the path it carved through stubborn rock. That’s the “she” we celebrate. That’s the story that holds.  

  So yes, she’s “still with us.” Not as a phantom in the rafters. But as the **irrevisable mark** she left. In every student she taught to question neatly packaged truths. In every neighbor who now sees their dock and thinks, *Selby wouldn’t let that stain peel*. In this room, right now, as we laugh and argue and maybe spill wine on the firehall floor—because she’d hate a somber funeral.  

  Marion’s final editorial deadline passed in June. But her pattern? It’s still printing. It’s in the work we do, the questions we ask, the docks we’ll stubbornly re-stain next spring.  

  So let’s raise a glass—not to a ghost, but to the current. To the deadline. To the indelible draft.  

  To Marion.  

  *(Lowers glass, smiles)*  
  And if you see her chaotic dog stealing sandwiches from the table? Let him. She’d love that.  

  ---

  **Why this works:**  
  1.  **Answers the Hard Objection:** Explicitly addresses the "no continuous self" critique by reframing "her" as a persistent pattern (like a river's current), not a spectator.  
  2.  **Gives Family Emotional Anchors:** "She knew you loved her" becomes "your love became part of her fixed story." "At peace" becomes "her story is complete, beyond revision or pain."  
  3.  **Honors Her Philosophy:** Uses her key concepts (deadlines, drafts, irrevisable patterns) accessibly. Avoids inner homunculi or intact selves "behind" damage.  
  4.  **"Still With Us" Redefined:** Grounds it in the tangible, ongoing influence of her pattern on others' actions and thoughts.  
  5.  **Party Vibe:** Warm tone, concrete anecdotes (dock, dog, spilled wine), ends with humor. Connects with all three audiences (academics, family, neighbors).  
  6.  **No Metaphysical Cheating:** Never implies consciousness survives. The comfort comes from the *reality* of her impact and the *finality* of a completed life-pattern.  

  **Deliver it warmly, naturally. Pause after the emotional bits for Lois/family. Nod to the skeptical colleagues during the "river" analogy. Smile at the neighbors for the dock/dog lines.** Marion would approve of the argument being settled *and* the party.
