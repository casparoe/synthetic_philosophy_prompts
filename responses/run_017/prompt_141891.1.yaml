  Below is a concise, two-page decision tree handout addressing Quinean indeterminacy of translation. It starts from the given commitment (two behaviorally equivalent translation manuals can disagree about the reference of a one-word utterance) and progresses through critical forks to named positions. Nodes are phrased as answerable questions without presupposing theory labels, and leaves include the seven required positions plus two unoccupied combinations with diagnoses. Each leaf provides:  
  - **Label** (common name)  
  - **Names** (key proponents)  
  - **Awkward commitment** (hardest pill to swallow)  
  - **Push-off** (most likely reason to abandon the view)  

  Pairs flagged as inseparable are noted, and spectrum nodes are marked. Written in American English per your style sheet.  

  ---

  **THE INDETERMINACY DECISION TREE**  
  *Starting Commitment: Two translation manuals fit all stimulus/behavior evidence but disagree on what a one-word utterance (e.g., "gavagai") refers to.*  

  ### NODES (BRANCHING QUESTIONS)  
  1. **Does the disagreement extend beyond reference to logical form?**  
     - *(A) No: Only what the word picks out (e.g., rabbit vs. rabbit-part).*  
     - *(B) Yes: What kind of expression it is (e.g., singular term for rabbits, quantifier over parts, mass term for rabbit-stuff).*  

  2. **Can this reinterpretation reshuffle logical vocabulary (quantifiers, identity) without changing truth conditions?**  
     - *(A) Yes: Manuals disagree on what the natives are committed to (e.g., rabbits exist vs. undetached parts exist).*  
     - *(B) No: Logical vocabulary anchors interpretation; disagreement stays surface-level.*  

  3. **Does this puzzle apply to your OWN language?**  
     - *(A) Yes: Your words are just as indeterminate as the native's.*  
     - *(B) No: This only bites for radical translation of others.*  

  4. **If the linguist had ALL physical facts (neural states, behavior, etc.), would indeterminacy persist?**  
     - *(A) Yes: Manuals still disagree even with everything physical nailed down.*  
     - *(B) No: Complete physical facts fix the correct manual.*  

  5. **Is this indeterminacy just ordinary scientific underdetermination?**  
     - *(A) Yes: Like choosing between empirically equivalent physics theories; nothing special about meaning.*  
     - *(B) No: Deeper than underdetermination—unique to semantic facts.*  

  6. **If real, is indeterminacy bad news for belief/desire psychology?**  
     - *(A) Yes: Threatens cognitive science and everyday mental-state attributions.*  
     - *(B) No: We can preserve psychology by shrugging it off or redefining its basis.*  

  7. **What (if anything) fixes meaning?**  
     - *(A) Internal factors: Innate structure or computational role in the mind.*  
     - *(B) External factors: Causal history or direct environmental links.*  
     - *(C) Nothing: No facts fix meaning at all.*  

  *(Node 2 is a spectrum: Reinterpretation can be more or less radical, but (A)/(B) captures the key fork.)*  

  ---

  ### LEAVES (POSITIONS)  
  Follow paths from Node 1 → Node 7. *Italicized leaves are unoccupied.*  

  #### 🍃 **1. Inscrutability + Relativization**  
  - Path: 1(B) → 2(A) → 3(A) → 4(A) → 5(B) → 6(B) → 7(B)  
  - Names: Quine  
  - Awkward commitment: Reference is always relative to a background language; no "absolute" fact.  
  - Push-off: Belief that communication requires shared, determinate meanings.  

  #### 🍃 **2. Deflationary Underdetermination**  
  - Path: 1(A) → 2(B) → 3(B) → 4(B) → 5(A) → 6(B) → 7(B)  
  - Names: (Generic scientific realist)  
  - Awkward commitment: Indeterminacy vanishes if we get all physical facts—but Quine argues it doesn’t.  
  - Push-off: Quine’s argument that neural facts don’t resolve semantic disagreement.  

  #### 🍃 **3. Triangulation Reply**  
  - Path: 1(A) → 2(B) → 3(A) → 4(B) → 5(B) → 6(B) → 7(B)  
  - Names: Davidson  
  - Awkward commitment: Interpretation requires assuming the speaker shares most of your beliefs (charity).  
  - Push-off: Cases of systematic error or irrationality undermine charity.  

  #### 🍃 **4. Internalist Fixation**  
  - Path: 1(B) → 2(B) → 3(B) → 4(B) → 5(A) → 6(B) → 7(A)  
  - Names: Chomsky  
  - Awkward commitment: Meaning is fixed by private mental structures, not public behavior.  
  - Push-off: Intuition that meaning must be shareable/interpersonal.  

  #### 🍃 **5. Direct-Reference/Causal-Historical**  
  - Path: 1(A) → 2(B) → 3(B) → 4(B) → 5(B) → 6(B) → 7(B)  
  - Names: Kripke, Putnam  
  - Awkward commitment: Reference depends on causal chains unknown to the speaker (e.g., you might misidentify your own word’s referent).  
  - Push-off: "Fool’s water" cases (e.g., intending to refer to water but actually linked to XYZ).  

  #### 🍃 **6. Global Permutation Worry**  
  - Path: 1(B) → 2(A) → 3(A) → 4(A) → 5(B) → 6(A) → 7(B)  
  - Names: (Worried Quinean)  
  - Awkward commitment: Physics fixes all facts, yet meaning *still* isn’t among them—threatens physicalism.  
  - Push-off: Optimism that cognitive science progresses despite indeterminacy.  

  #### 🍃 **7. Meaning-Skeptic + Skeptical Solution**  
  - Path: 1(A) → 2(A) → 3(A) → 4(A) → 5(B) → 6(B) → 7(C)  
  - Names: Kripke (Wittgenstein)  
  - Awkward commitment: No fact of the matter about what *any* word means, even in your home language.  
  - Push-off: Community agreement feels too flimsy to ground normativity (e.g., "right" use).  

  #### 🍃 *8. INCOHERENT: Ontological relativity without logical variance*  
  - Path: 1(A) → 2(A) → [Any]  
  - Diagnosis: Incoherent—if logical vocabulary is reinterpreted (Node 2A), disagreement *must* affect logical form (contradicting Node 1A).  
  - Why unoccupied? Logically impossible.  

  #### 🍃 *9. UNOCCUPIED: Radical translation-only + physical indeterminacy*  
  - Path: 1(B) → 2(A) → 3(B) → 4(A) → [Any]  
  - Diagnosis: Unattractive—if indeterminacy survives all physical facts (Node 4A), it should afflict home languages too (contradicting Node 3B).  
  - Why unoccupied? No one wants this half-in/half-out view.  

