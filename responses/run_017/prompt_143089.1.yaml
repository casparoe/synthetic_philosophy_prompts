prompt: |-
  Okay so context: I'm a third-year PhD student in political theory and I need to write a two-page proposal for a nine-month dissertation fellowship, and I want the proposal to be about something I've only got half-thought-through. Please act as a political theorist who works on democratic innovation (sortition, citizens' assemblies, the whole lottocratic family of proposals) but who has also spent real time around the practitioners who actually run these things — that combination is what I need, because I think the interesting version of my question lives right at the seam between the normative argument and the boring logistics. So: think carefully, and before you settle on a structure, brainstorm three or four different ways the project could be framed, then pick one and tell me why the others are worse. Be willing to tell me if this is a whole dissertation or a footnote.

  Here's the half-formed idea. I was at a small workshop last spring where someone from an assembly-organising outfit said, more or less in passing, that most of their recruitment budget goes on the mail-out, and that the list they mail to is basically whoever their contractor has addresses for. That's stuck with me ever since. The standard pitch for sortition is that random selection is impartial in a way voting isn't: nobody picks the winners, so no faction can rig the composition of the chamber, and you get descriptive representativeness for free. But a lottery has to draw from a sampling frame — an actual list of people — and building that list is a political act that randomness then launders. If the frame is the electoral roll, or a commercial address database, or a residency register, then non-citizen residents, prisoners, people without fixed addresses, long-term emigrants, and everyone under eighteen are simply not in the population being sampled from, and there is no stage of the procedure at which that shows up as a decision anyone made. I've been calling this the frame problem for sortition, and my suspicion — the thing I want the proposal to test — is that it's *worse* for sortition than it is for elections rather than better: with voting, the franchise is at least an openly contested political question that can itself be voted on, whereas the sampling frame arrives as a technical input, and the epistemic and legitimacy arguments for sortition both seem to quietly help themselves to a boundary decision that the theory has no resources to make.

  What I want from you is a proposal document, not an essay defending a conclusion. Specifically: state a precise question (my first pass is something like — is the frame problem a fixable technical defect in sortition, solvable by better list construction, stratified sampling and post-hoc weighting, or does it reveal that sortition's advantage over voting was always conditional on a prior answer to the boundary question, so that the two mechanisms differ less in kind than in where they hide the discretion?); say why the obvious answers don't settle it, including a proper steelman of the reply I keep getting from friends, which is that representativeness is only ever representativeness of the enrolled population, that we already accept the electoral roll as the demos for elections, and so sortition inherits exactly the same boundary problem and no more — if that reply is right my chapter collapses into the general all-affected / who-is-the-demos literature and I want to know that now; lay out the method month by month for nine months (I'm imagining: reconstruct the argument for sortition premise by premise and locate exactly which premise the frame is doing work in; then two or three close cases of real assemblies where the recruitment pipeline is documented well enough to see what the frame excluded and whether anyone noticed; then a design response, which for me is the fun part — I've been toying with issue-relative frames, where the sampled population changes with the policy domain, so housing policy samples tenants and landlords and unhoused residents rather than the citizenry at large, and long-horizon environmental decisions sample alongside some kind of designated proxy for people who don't exist yet, and also with meta-sortition, i.e. randomly selecting whoever builds the frame, which I suspect hits a regress unless you can say non-arbitrarily where the recursion stops); tell me what the possible conclusions are and what would decide between them; and give me an honest failure condition as well as a scope check.

  Two last things. I know the literature well enough and I'll fill in all the citations myself, so please don't give me a bibliography or a reading list or anything that depends on looking things up — argue from the positions and arguments directly, and where you need a real example of an assembly, use it loosely rather than fencing me in with details I'd have to check. And I'd like a deliverable that isn't only academic: if the design response works, what would it actually look like for someone deciding how to constitute a real body next year — a decision procedure for choosing a frame, maybe, plus a checklist of who the frame silently drops — and what would I say if a funder asked why they should pay a philosopher to think about mailing lists?
reasoning: |-
  Okay, let me tackle this political theory PhD student's request. They need a fellowship proposal about the "frame problem" in sortition - how the sampling frame invisibly shapes democratic legitimacy, which is a really sharp insight. 

  First, I need to consider how to frame this project. The core tension is between normative theory and practical implementation, so the framing options should reflect that spectrum. 

  Option 1 could focus on democratic legitimacy theory, arguing that the frame problem exposes a flaw in sortition's normative foundations. But that might lean too abstract. Option 2 might take a comparative institutional approach, examining how sortition handles boundary questions versus elections. Useful, but perhaps not distinctive enough. Option 3 could center on practitioner dilemmas - how real-world assembly designers grapple with frame constraints while maintaining legitimacy. This feels promising because it bridges theory and practice. Option 4 might position it as a design challenge: developing protocols for frame construction. Though practical, it risks being too technical without theoretical depth.

  Option 3 seems strongest because it tackles the student's observation about "laundered" decisions while creating space for practitioner engagement. The other frames either over-theorize or oversimplify the problem.

  For the research question, I'll sharpen their draft to: "Does the sampling frame problem reveal a distinctive legitimacy vulnerability in sortition compared to electoral democracy?" This formulation forces confrontation with their key hypothesis while leaving room for nuanced answers.

  The methodology needs to systematically test assumptions. Month 1-2 should map how major sortition theorists (like Gastil, Landemore) implicitly rely on unproblematic frames. Months 3-5 could analyze cases like Irish assemblies where frame exclusions occurred but weren't contested, versus cases where they sparked debate. Months 6-7 would prototype design responses - maybe issue-relative frames for housing policy that include unhoused populations via shelters. 

  Crucially, the failure condition must be explicit: if frame choices prove no more contested in sortition than electoral boundaries, the project's novelty evaporates. The scope check involves limiting to 3 case studies and 2 design prototypes.

  For non-academic deliverables, a "frame transparency toolkit" could help practitioners: decision trees for frame selection, exclusion impact assessments, and legitimacy stress-tests. When justifying to funders, I'd emphasize that mailing lists are where abstract democracy becomes concrete - and where philosophers can prevent "descriptive representativeness" from becoming a myth that covers exclusion.
answer: |-
  Here’s a structured fellowship proposal tackling your "frame problem," designed to bridge theory and practice. I’ve framed it as a 9-month project with clear deliverables, stakes, and scope checks—prioritizing the seam between normative claims and logistical constraints.

  ---

  **Project Title:** The Unchosen Voters: Sampling Frames, Democratic Boundaries, and the Hidden Politics of Sortition  

  **Core Question:**  
  *Does the sampling frame problem expose a distinctive legitimacy deficit in sortition-based democracy compared to electoral systems—one that technical fixes cannot resolve—by rendering democratic boundaries invisible and uncontestable?*  

  ### Why This Question?  
  The "obvious" answers don’t settle it because:  
  - **The steelman rebuttal ("same boundary problem as elections")** ignores a critical asymmetry: Electoral systems treat franchise boundaries as *explicitly political decisions* (e.g., voting age, citizenship debates). Sortition launders boundary-setting into *technical pre-conditions* (e.g., vendor databases, residency rolls), masking discretion under claims of randomness and representativeness.  
  - **Technical solutions (stratified sampling, weighting)** assume the frame is *fixable* without confronting who defines "the people" for a given decision. This sidesteps the core dilemma: Should housing policy assemblies sample only citizens, or include unhoused residents, undocumented tenants, or future occupants? Weighting adjusts proportions but cannot add excluded groups.  
  - **The legitimacy stakes differ**: Sortition’s selling point is *impartiality*—but if the frame invisibly excludes groups (e.g., renters omitted from property-tax databases), claims of "representativeness" become ideological cover, undermining its epistemic advantage over elections.  

  ---

  ### Why Frame #3? (The Practitioner’s Dilemma)  
  I brainstormed four frames and rejected three:  
  1. **Normative Theory Frame**: *"Sortition’s Legitimacy Crisis: The Frame as Original Sin"*  
     → *Problem:* Overly abstract. Fails to engage how real-world assemblies navigate (or ignore) this.  
  2. **Comparative Institutions Frame**: *"Elections vs. Sortition: Where Boundaries Hide"*  
     → *Problem:* Treats elections as a stable baseline. Misses practitioner tensions in assembly design.  
  3. **Design Challenge Frame**: *"Building Better Frames: Issue-Relative Sortition"*  
     → *Problem:* Prematurely solutionist. Risks ignoring why frames resist "fixing."  
  4. **✅ Practitioner’s Dilemma Frame**: **"How Democratic Innovators Hide Politics in Plain Sight: The Frame Problem in Action"**  
     → *Chosen because:* It centers your seam—how organizers *rationalize* frames as logistical necessities while theorists invoke neutrality. Exposes the gap between normative promises and operational compromises.  

  ---

  ### Methodology: 9-Month Plan  
  **Months 1–2: Deconstructing the Theory**  
  - Audit key arguments for sortition (e.g., Fishkin’s deliberative legitimacy, Landemore’s epistemic diversity) to pinpoint where "representativeness" implicitly relies on *uncontested* frames.  
  - *Output:* Theory map showing how frames are either ignored or treated as exogenous.  

  **Months 3–5: Case Studies in Frame Exclusion**  
  - Analyze 3 assemblies with documented recruitment pipelines:  
    1. **Climate Assembly UK** (relied on postal addresses → excluded unhoused).  
    2. **Irish Citizens’ Assembly** (electoral roll → excluded non-citizen residents).  
    3. **Oregon People’s Panel** (vendor database → skewed toward homeowners).  
  - *Focus:* Did exclusions surface in deliberation? Was legitimacy contested? How did organizers justify the frame?  
  - *Output:* Comparative case report highlighting "invisible" tradeoffs.  

  **Months 6–7: Design Experiments**  
  - Stress-test solutions:  
    - **Issue-relative frames**: Draft protocols for a housing assembly sampling tenants, landlords, *and unhoused* (via shelters/NGOS).  
    - **Meta-sortition**: Simulate selecting frame-designers via lottery. Does regress occur? (Spoiler: Yes, unless anchored to existing institutions.)  
  - *Output:* 2-3 "boundary protocols" for real-world testing.  

  **Months 8–9: Synthesis & Legitimacy Criteria**  
  - Develop criteria for "contestable frames": When *should* boundaries be decided by referendum, courts, or meta-assemblies?  
  - *Output:* Theory/practice toolkit (see "Deliverables").  

  ---

  ### Possible Conclusions  
  1. **Pessimistic**: The frame problem *is* distinctive and intractable—sortition’s legitimacy requires boundaries to be contestable, but contestation undermines its randomness advantage.  
  2. **Optimistic**: Issue-relative frames + transparency mechanisms (e.g., "exclusion impact statements") can make boundary politics visible *without* collapsing into electoral-style factionalism.  
  3. **Hybrid**: Sortition’s value is conditional on pairing it with electoral or participatory mechanisms to *set frames*.  

  **What Decides?**  
  - Case studies revealing whether practitioners *can/will* adopt reflexive frame-design.  
  - Theoretical work showing if "contestable randomness" is coherent.  

  ---

  ### Failure Conditions & Scope Checks  
  - **Failure Condition 1**: If frames prove no more contested in sortition than electoral boundaries, the "distinctive deficit" claim collapses. → *Mitigation:* Focus on cases where electoral rolls *were* contested (e.g., felon voting rights) vs. sortition frames treated as technical.  
  - **Failure Condition 2**: If all design responses require infinite regress (e.g., meta-sortition needing a meta-meta-frame). → *Mitigation:* Anchor boundaries to existing institutions (courts, legislatures) and evaluate legitimacy tradeoffs.  
  - **Scope Guardrails**:  
    - No primary data collection (rely on public docs/partner org reports).  
    - Limit case studies to 3 anglophone/European assemblies (avoiding comparativist sprawl).  
    - Design experiments remain conceptual (no field trials).  

  ---

  ### Non-Academic Deliverable: The Frame Transparency Toolkit  
  For practitioners, you’d produce:  
  1. **A Boundary Legitimacy Checklist**:  
     - Who does your frame exclude? (e.g., "Unhoused if using postal addresses.")  
     - Is this exclusion justifiable for *this issue*? (e.g., "Excluding non-citizens from immigration policy vs. climate policy.")  
  2. **Decision Protocol for Choosing Frames**:  
     - Default to electoral roll? → Requires democratic renewal of roll itself.  
     - Issue-relative? → Define "stakeholder" via civil society input.  
     - Hybrid model? → Randomly selected advisors co-design frame.  

  **Funder Pitch**:  
  > *"You’re paying a philosopher to study mailing lists because they’re where democracy begins or ends. If a citizens’ assembly on housing reform excludes the unhoused—not by debate, but by database—its legitimacy is a fairy tale. I diagnose how these ‘technical’ choices sabotage democratic innovation, and offer tools to turn boundary politics into a feature, not a bug."*  

  ---

  **Is this a dissertation or a footnote?**  
  It’s a dissertation-scale problem condensed into a 9-month project. The frame problem cuts to the heart of whether sortition offers a *distinct* legitimacy claim. If your cases show practitioners ignoring exclusion, it’s a chapter; if you prove the problem redefines how we evaluate democratic innovations, it’s the book.  

  ---  
  **Next Steps**:  
  - Sharpen the case selection (I assumed accessible anglophone examples; adjust as needed).  
  - Flesh out the "issue-relative frame" protocol with a concrete example (e.g., sampling *both* citizens and non-citizen workers for labor policy).  
  - Specify which sortition theorists you’ll engage (e.g., Guerrero vs. Buchstein on randomness).  

  This proposal turns a logistical footnote ("mailing lists cost money") into a theory-defining problem. If you nail the cases, you force democratic innovators to confront the politics they thought randomness erased.
