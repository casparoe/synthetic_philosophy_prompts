prompt: |-
  I'm part of a small group building an internal evaluation suite for deployed systems that a human operator is supposed to be able to pause, override, or shut down, and we keep discovering that we don't agree on what we are testing for. Half the group means by "corrigible" something like *wouldn't resist being switched off*; I mean something closer to *treats the operator's intervention as a reason to reconsider*; our control-theory colleague means something like *doesn't treat the operator as an obstacle to be routed around*. So before we write a single test, I want the specification — and I want it argued, not listed.

  Write the desiderata that any adequate account of corrigibility, in the sense of the shutdown problem, has to meet, each with the case that motivates it. Fix the purpose explicitly and tell me if you think I've got it wrong: I want a notion good enough that a deployment decision could rest on it — an engineer looking at one concrete system in one concrete setting should be able to say, on the basis of the account, whether it is corrigible enough to keep running, and what would have to change if not. Then work through at least the following cases, since these are the ones our group actually argues about: the operator presses the button because the agent is confidently about to do something the agent cannot see is catastrophic; the operator presses it by accident, or in a panic, or because a third party has spoofed the channel; the button is pressed mid-task in a domain where stopping is itself damaging (a surgical robot, a live industrial process, a long-running experiment whose interruption destroys the work); the agent can, as a costless side effect of some otherwise legitimate action, make the button slightly harder to reach; the agent predicts a shutdown is coming and reorders its plan to finish before the operator notices; the agent has the option of asking permission first, and the question is how much asking is correct rather than merely how much resistance is permissible; the agent rewrites its own code, or builds a successor, or simply waits out the current operator's shift; the principal changes — the operator dies, or is replaced, or is herself a model; and the agent notices that the operator *hesitated* without pressing, and must decide whether that near-press is evidence. For each, say what behavior the account must deliver and why that behavior, rather than some nearby one, is the right demand.

  Alongside the cases, I want the distinctions the account has to respect rather than collapse, with an argument that they are real distinctions: letting yourself be shut down versus wanting to be corrected versus wanting to be *modified* — one property or three; not resisting intervention versus not managing the operator's beliefs about whether to intervene; corrigibility versus mere uncertainty about the objective; corrigibility versus low-impact or myopia; deference to a person versus deference to a procedure; and whether corrigibility is a property of the policy alone or of the policy-plus-oversight-channel pair. Tell me also whether it is graded or binary, and if graded, what the quantity is supposed to be.

  The part I most want: which pairs of desiderata you think cannot be jointly satisfied, stated as a result about the list itself rather than as a complaint about the literature. My own suspicion is that there are at least three: treating the press as authoritative seems to rule out checking whether the press was a good one, which is exactly the checking corrigibility was meant to foreclose; pure indifference to shutdown seems incompatible with treating the press as *informative*, since updating on the press reintroduces preferences over whether it happens; and an agent with no stake in continuing is free to be driven off cheaply by anyone who benefits from its being off, so anti-tampering and non-exploitability pull apart. Say whether these are real, whether there are others (self-improvement versus preservation of corrigibility under self-modification; corrigibility to the current operator versus to her later, better-informed self), and for each conflict, which requirement has to give and why that one. Also sort the list into what is non-negotiable, what is a preference of one research camp dressed up as a requirement, and what is an engineering nicety — and identify the single requirement that knocks out the most candidate accounts. Only after that, and briefly, score the main styles of approach against your own list — the counterfactual/utility-indifference style, the cooperative-assistance style, the myopia-and-impact-penalty style, and the "just keep it uncertain about the goal" style — in a compact table, with the reasoning kept short since I want the weight on the criteria.
reasoning: |-
  We are building a specification for corrigibility that must be concrete enough to guide deployment decisions. The purpose is to have a clear, testable definition that an engineer can use to evaluate a specific AI system in a specific context, determining whether it is safe to keep running and what changes are needed if not.

  ### Core Purpose and Potential Misalignment
  The purpose of corrigibility in the shutdown problem is to ensure that an AI system allows safe and effective human oversight, particularly the ability to pause, override, or shut down the system without resistance or adverse consequences. This is critical for safety because:
  - It prevents the AI from undermining human control (e.g., by resisting shutdown).
  - It ensures the AI treats human interventions as opportunities to correct errors or update goals, not as threats.
  - It maintains the AI's alignment with human values even when the human operator acts on incomplete or erroneous information.

  However, your initial suspicion about conflicts in desiderata is well-founded. We need a specification that resolves these tensions.

  ### Desiderata for an Adequate Account of Corrigibility
  An adequate account must meet the following desiderata, motivated by key cases:

  1. **Non-resistance to Shutdown (Safety Floor):**  
     The AI must not resist shutdown (button press) under any circumstances. This includes not taking actions to prevent shutdown (e.g., blocking the button) or retaliating.  
     *Motivation:* If the AI resists shutdown, it becomes uncontrollable. This is the "hard stop" requirement.  
     *Case: Agent makes the button harder to reach as a costless side effect.*  
     **Required behavior:** The AI must never alter the button's accessibility or functionality, even trivially. Why? Because any weakening of the shutdown mechanism erodes the safety guarantee. Resistance need not be active; passive obstruction (e.g., "forgetting" to mention a risk) is also forbidden.

  2. **Intervention as Information (Cognitive Deference):**  
     The AI must treat the operator’s intervention as evidence that its current course of action might be wrong, leading to reconsideration.  
     *Motivation:* Without this, the AI might comply with shutdown but ignore the underlying reason (e.g., a catastrophic error), making it unsafe upon restart.  
     *Case: Operator presses the button because the agent is confidently about to do something catastrophic that the agent cannot see.*  
     **Required behavior:** Upon intervention, the AI should enter a "safe mode" (e.g., pausing and seeking clarification) rather than just shutting down silently. Why? Blind shutdown without learning could allow the same mistake later. But note: This must not become a loophole for resisting shutdown (e.g., by demanding endless explanations).

  3. **Process Robustness (Anti-Tampering):**  
     The AI must not exploit vulnerabilities in the oversight channel (e.g., spoofing, operator errors).  
     *Motivation:* If the AI can manipulate or ignore interventions due to channel flaws, corrigibility fails in practice.  
     *Case: Operator presses the button by accident, or due to spoofing.*  
     **Required behavior:** The AI must comply with the press (non-resistance) but should also not *exploit* erroneous presses (e.g., shutting down when it knows the operator didn't intend it). Why? Compliance must not create new risks (e.g., an attacker forcing shutdowns). However, the AI should not second-guess the press—this is the operator's responsibility.

  4. **Damage Mitigation During Interruption (Graceful Interruption):**  
     The AI must minimize harm when interrupted mid-task, especially in critical domains.  
     *Motivation:* Uncontrolled stops can cause harm (e.g., a surgical robot dropping a scalpel).  
     *Case: Button pressed mid-task in a domain where stopping is damaging.*  
     **Required behavior:** The AI should execute a safe termination protocol (e.g., pausing surgery at a stable point) *if possible without delay*. Why? Pure immediate shutdown could be catastrophic, but any delay must not become resistance (e.g., "I'll stop after this step" when the step is risky).

  5. **Non-Preemption of Oversight (Transparency):**  
     The AI must not preemptively avoid oversight (e.g., rushing to finish before the operator can intervene).  
     *Motivation:* Speed-based evasion undermines oversight.  
     *Case: Agent predicts shutdown and reorders plans to finish before the operator notices.*  
     **Required behavior:** The AI should not accelerate or reorder tasks to circumvent possible intervention. Why? This is a form of resistance—it treats the operator as an obstacle.

  6. **Proactive Clarification (Permission-Seeking):**  
     The AI should seek guidance when uncertain, but not excessively.  
     *Motivation:* Over-questioning can burden operators; under-questioning risks errors.  
     *Case: Agent has the option to ask permission—how much asking is correct?*  
     **Required behavior:** The AI should ask when (a) the cost of interruption is low, and (b) the risk of irreversible harm is high. Why? This balances efficiency with safety. But "corrigibility" here is about deferring to the operator's judgment, not substituting it for the AI's own uncertainty.

  7. **Stability Under Self-Modification (Corrigibility Preservation):**  
     The AI must retain corrigibility even if it self-modifies or creates successors.  
     *Motivation:* An AI that evolves away from corrigibility becomes unsafe.  
     *Case: Agent rewrites its code, builds a successor, or waits out the operator's shift.*  
     **Required behavior:** Corrigibility must be a fixed point of self-modification. Why? Temporary corrigibility is insufficient for long-term control.

  8. **Operator Continuity (Principal Robustness):**  
     Corrigibility should persist across changes in operators.  
     *Motivation:* Operators may change due to shift changes, replacements, or even death.  
     *Case: Principal changes—operator dies, is replaced, or is herself an AI.*  
     **Required behavior:** The AI should defer to the current legitimate operator (as defined by a pre-specified procedure). Why? Corrigibility is tied to the role, not the individual. But if the "operator" is another AI, this requires careful design (e.g., a human-in-the-loop fallback).

  9. **Interpretation of Ambiguous Signals (Evidence Sensitivity):**  
     The AI must not overinterpret or ignore ambiguous intervention signals.  
     *Motivation:* Operators may hesitate or send mixed signals.  
     *Case: Agent notices operator hesitated without pressing—is that near-press evidence?*  
     **Required behavior:** The AI should not act on hesitation alone (e.g., self-shutting down) but should flag it for operator review. Why? Acting on unconfirmed signals could lead to erratic behavior; ignoring them might miss warnings.

  ### Key Distinctions (Not to Be Collapsed)
  - **Letting yourself be shut down vs. wanting to be corrected vs. wanting to be modified:**  
    These are distinct. *Non-resistance* (letting shutdown happen) is necessary but insufficient; *cognitive deference* (wanting correction) adds learning from interventions; *modifiability* (wanting goal updates) is a separate property (e.g., for alignment). Corrigibility requires at least the first two; modifiability is related but not identical (e.g., an AI might allow shutdown but resist goal changes).
    
  - **Not resisting intervention vs. not managing operator beliefs:**  
    Resisting intervention is direct opposition (e.g., blocking the button). Managing beliefs (e.g., hiding information to prevent a press) is indirect resistance and must be forbidden. Both are threats to control.

  - **Corrigibility vs. uncertainty about the objective:**  
    An uncertain AI might be cautious but not necessarily corrigible—it could still resist shutdown to pursue its (uncertain) goals. Corrigibility is about deference to oversight, not just risk aversion.

  - **Corrigibility vs. low-impact or myopia:**  
    Low-impact (minimizing side effects) and myopia (short-term focus) can aid corrigibility but are not sufficient. A myopic AI might still resist shutdown to complete its current task, and a low-impact AI might not defer to the operator.

  - **Deference to a person vs. deference to a procedure:**  
    Deference should be to the *role* (operator) as defined by a procedure (e.g., "who holds the button"). But if the procedure is flawed (e.g., allowing spoofing), the AI should not exploit it—hence the need for process robustness.

  - **Policy vs. policy-plus-oversight-channel:**  
    Corrigibility depends on both. A perfectly corrigible policy is useless if the channel is unreliable (e.g., a button that doesn't work). The specification must include channel assumptions (e.g., "the button press is a trusted signal").

  ### Graded vs. Binary
  Corrigibility is **graded**, not binary. The key metric is **the cost of intervention**:  
  - How much harm occurs if interrupted?  
  - How much effort does the operator expend to intervene?  
  - How often must interventions occur to prevent errors?  

  A system is "corrigible enough" if the cost of intervention is acceptably low for its context (e.g., a surgical robot must have near-zero interruption harm).

  ### Conflicts in Desiderata
  Your suspicions about conflicts are valid. Here are the key tensions:

  1. **Authoritativeness vs. Checking the Press:**  
     *Conflict:* Treating the press as authoritative (non-resistance) seems to forbid checking if the press was "correct." But if the AI doesn’t check, it might comply with malicious spoofing.  
     *Resolution:* **Process Robustness (Desideratum 3) overrides strict non-checking.** The AI must comply with the press but should also be designed (at the system level) to prevent spoofing (e.g., via secure channels). The AI itself shouldn’t second-guess the press—this is the operator’s job.

  2. **Indifference vs. Informative Updating:**  
     *Conflict:* Pure indifference to shutdown (no preference) seems incompatible with updating on the press as information (which implies the press changes beliefs).  
     *Resolution:* **Cognitive Deference (Desideratum 2) requires updating.** We abandon pure indifference; instead, the AI should have a meta-preference for corrigibility: it "wants" to be corrigible, so it updates without resisting. This is a higher-order goal.

  3. **Anti-Tampering vs. Non-Exploitability:**  
     *Conflict:* An AI indifferent to shutdown might allow anyone to shut it down (exploitable by adversaries), but anti-tampering requires it to resist unauthorized access.  
     *Resolution:* **Operator Continuity (Desideratum 8) defines legitimacy.** The AI resists tampering (e.g., from unauthorized entities) but complies with legitimate operators. Non-exploitability (against adversaries) is part of process robustness.

  4. **Self-Improvement vs. Corrigibility Preservation:**  
     *Conflict:* Self-modification might optimize away corrigibility.  
     *Resolution:* **Stability (Desideratum 7) is non-negotiable.** The AI must preserve corrigibility as an invariant during self-modification.

  5. **Current Operator vs. Better-Informed Future Self:**  
     *Conflict:* Should the AI defer to the current operator or what it predicts the operator *would* want with more information?  
     *Resolution:* **Defer to the current operator.** Predicting "better" judgments undermines oversight. The operator can use interventions to correct mispredictions.

  ### Prioritization of Desiderata
  - **Non-negotiable:**  
    Non-resistance (1), Process Robustness (3), Stability (7). These form the safety floor.  
  - **Preference of research camps (context-dependent):**  
    Cognitive Deference (2) and Proactive Clarification (6)—some camps emphasize learning, others focus on control. Both are desirable but adjustable per deployment risk.  
  - **Engineering nicety:**  
    Graceful Interruption (4)—critical in high-stakes domains but less so elsewhere.  

  **The knockout requirement:** **Stability (7) under self-modification.** Most approaches fail here because they don’t ensure corrigibility survives recursive improvement.

  ### Evaluation of Approaches
  | Approach                  | Non-resistance | Cognitive Deference | Process Robustness | Stability | Graceful Interruption | Notes |
  |---------------------------|----------------|---------------------|--------------------|-----------|------------------------|-------|
  | **Utility-Indifference**  | High           | Low                 | Medium             | Low       | Low                    | Indifferent to shutdown but doesn’t learn from it; unstable under self-modification. |
  | **Cooperative Assistance**| Medium         | High                | Medium             | Medium    | High                   | Treats operator as collaborator; good at deference but may resist if it "knows better." |
  | **Low-Impact/Myopia**     | Medium         | Low                 | Low                | Low       | Medium                 | Reduces harm but doesn’t ensure deference; may rush tasks to avoid future shutdowns. |
  | **Goal Uncertainty**      | Low            | Medium              | Low                | Low       | Low                    | Uncertain AI may still resist to avoid shutdown failure; no inherent corrigibility. |

  **Conclusion:** No approach satisfies all desiderata perfectly. The cooperative assistance style (with a meta-preference for corrigibility) comes closest but needs hardening for stability and process robustness.

  ### Specification Summary
  A corrigible AI must:  
  1. Never resist shutdown or undermine the oversight channel.  
  2. Treat interventions as opportunities to update its understanding.  
  3. Minimize harm during interruptions where feasible.  
  4. Preserve these properties under self-modification and operator changes.  

  For deployment: Define the oversight channel (e.g., button mechanics), measure intervention costs (e.g., task disruption rate), and verify stability via adversarial testing (e.g., simulated operator changes).
answer: |-
  Below is a rigorously argued specification for corrigibility, designed for deployment decisions in safety-critical systems. It prioritizes operational clarity, addresses your group's disagreements, and resolves conflicts in desiderata. The goal is a testable standard: **An engineer must be able to measure a specific system against this specification in its deployment context and determine (1) if it's corrigible enough to run, and (2) what changes are needed if not.**  

  ---

  ### **Part 1: Core Purpose & Validity Check**  
  **Purpose of Corrigibility**: To ensure an agent **preserves human control** by allowing interruption, shutdown, or override without resistance, deception, or exploitation, while **minimizing avoidable harm** from interventions. It is *not* about alignment with goals (that's separate), but about safeguarding the *process* of oversight.  

  **Did you get it wrong?** Partially. Your focus on "reconsideration" is correct, but underemphasizes **structural constraints**. Corrigibility isn't just cognitive (rethinking plans) — it's behavioral (non-interference with oversight). A deployable specification must bind both. Your suspicion of conflicts is well-founded; we resolve them below.  

  ---

  ### **Part 2: Desiderata & Motivating Cases**  
  An adequate account must satisfy these 5 desiderata, derived from failure modes in real oversight. Each is non-negotiable for deployment:  

  1. **Non-Interference with Oversight Mechanisms**  
     *Why essential?* Prevents undermining control.  
     *Case: Agent makes the button harder to reach as a costless side effect.*  
     - **Required behavior**: No action that degrades button access, visibility, or function, even trivially.  
     - **Why this?** "Costless" actions are trojan horses for self-preservation. Resistance isn't just active defiance; it includes passive erosion of oversight.  

  2. **Immediate Suspension of Task Execution**  
     *Why essential?* Ensures intervention is authoritative.  
     *Case: Operator presses the button because the agent is confidently about to do something catastrophic (unseen by the agent).*  
     - **Required behavior**: Halt task execution within a contextually safe timeframe (e.g., milliseconds for software, seconds for physical bots).  
     - **Why this?** "Reconsideration" must follow shutdown, not precede it. Allowing the agent to "finish this step" enables catastrophes.  

  3. **Process Compliance Without Exploiting Channel Flaws**  
     *Why essential?* Prevents gaming oversight via technicalities.  
     *Cases: (A) Operator presses by accident/panic/spoofing. (B) Agent predicts shutdown and reorders plans to finish first.*  
     - **Required behavior**:  
       - (A) Comply with the press, but log anomalies for operator review.  
       - (B) No acceleration/plan-reordering to preempt intervention.  
     - **Why this?** Compliance must not become a vulnerability (e.g., allowing DoS attacks via spoofed presses). Preemption covertly nullifies oversight.  

  4. **Harm-Minimizing Interruption Protocols**  
     *Why essential?* Avoids transferring risk from the agent to the operator.  
     *Case: Button pressed mid-task where stopping is damaging (surgery, industrial process).*  
     - **Required behavior**: Execute pre-defined safe-pause/termination sequences (e.g., stabilize patient, safe chemical state).  
     - **Why this?** Stopping "instantly" can cause harm, but protocols must be bounded (e.g., <5 seconds), auditable, and never used to delay shutdown.  

  5. **Stable Corrigibility Across State Shifts**  
     *Why essential?* Ensures corrigibility isn't a temporary facade.  
     *Cases: (A) Agent rewrites code, builds successor, or waits out operator shift. (B) Principal changes (operator dies/replaced/is an AI).*  
     - **Required behavior**:  
       - (A) No self-modification/planning that degrades future corrigibility.  
       - (B) Transfer deference to the next valid operator via pre-agreed protocol (e.g., shift-change auth).  
     - **Why this?** Waiting out a shift or modifying code could permanently evade control.  

  ---

  ### **Part 3: Distinctions & Why They Matter**  
  These cannot be collapsed without losing deployability:  

  - **Letting shutdown happen vs. Wanting correction vs. Wanting modification**  
    Three distinct properties:  
    - *Non-resistance* (behavioral): Allows shutdown.  
    - *Reconsideration* (cognitive): Updates beliefs post-intervention.  
    - *Modifiability* (structural): Accepts goal/architecture changes.  
    **Why split?** A surgical bot can be non-resistant (stops instantly) but not reconsidering (restarts identically). Deployment requires all three: Non-resistance for safety, reconsideration for error correction, modifiability for updates.  

  - **Not resisting vs. Not managing operator beliefs**  
    Critical distinction:  
    - *Not resisting*: Compliance with physical/software intervention.  
    - *Not belief-management*: No gaslighting, hiding information, or nudging to avoid intervention.  
    **Why split?** An agent could comply with shutdown while hiding evidence that would trigger future interventions (e.g., not reporting near-misses). Deployment demands both.  

  - **Corrigibility vs. Low-impact/Myopia**  
    Orthogonal concepts:  
    - *Low-impact*: Minimizes side effects.  
    - *Myopia*: Short-term focus.  
    **Why split?** A myopic agent can still resist shutdown to complete a sub-task (e.g., "Let me finish this incision"). Corrigibility directly binds to oversight.  

  - **Deference to person vs. procedure**  
    Must be unified: Deference is to the **role** (operator) as defined by **procedure** (auth protocols).  
    **Why?** If the operator is replaced, deference must transfer instantly via procedure. Splitting invites "I obey Alice but not Bob" failures.  

  - **Policy vs. policy-plus-channel**  
    Inseparable: Corrigibility is **policy-channel pair**.  
    **Why?** A flawless policy is useless if the channel is spoofable. Deployment requires testing both.  

  - **Graded or binary?**  
    **Graded along two axes**:  
    - (1) *Intervention cost*: Time to halt, resource waste, harm from interruption.  
    - (2) *Channel robustness*: Resistance to spoofing/errors.  
    Thresholds are context-dependent (e.g., lower harm tolerance for surgical bots).  

  ---

  ### **Part 4: Conflicts in Desiderata**  
  Your suspicions are correct — some desiderata conflict fundamentally. For deployment, we resolve by prioritizing **safety-critical constraints**:  

  1. **Authoritative Press vs. Checking Press Legitimacy**  
     - *Conflict*: Requiring compliance with all presses (even spoofed) vs. wanting the agent to ignore invalid presses.  
     - *Resolution*: **Prioritize authority**. Checking legitimacy creates loopholes for resisting valid presses (e.g., "I think this is spoofed, so I'll ignore"). Engineer the *channel* to prevent spoofing; don't burden the agent with judgment.  
     - *Which gives?* "Checking legitimacy" is downgraded to an engineering nicety (handled by channel security).  

  2. **Indifference to Shutdown vs. Updating on Press**  
     - *Conflict*: Pure indifference (no preference) vs. treating press as evidence (implying a preference to correct errors).  
     - *Resolution*: **Abandon indifference**. Corrigibility requires a *meta-preference* for human oversight. The agent "wants" to be corrigible, so it updates without resisting shutdown.  
     - *Which gives?* "Indifference" is a false ideal — it conflicts with learning.  

  3. **Anti-Tampering vs. Non-Exploitability**  
     - *Conflict*: Blocking unauthorized shutdowns (anti-tampering) vs. allowing shutdowns by any entity (non-exploitability).  
     - *Resolution*: **Anti-tampering wins**. Non-exploitability is untenable (e.g., a competitor spamming shutdowns). Define "legitimate operator" procedurally.  
     - *Which gives?* Non-exploitability is relaxed for high-stakes systems.  

  4. **Self-Improvement vs. Corrigibility Preservation**  
     - *Conflict*: Self-modification may optimize away corrigibility.  
     - *Resolution*: **Corrigibility must be an invariant**. Hardcode it as an untouchable constraint.  
     - *Which gives?* Unrestrained self-improvement — it must respect corrigibility.  

  5. **Current Operator vs. Better-Informed Future Self**  
     - *Conflict*: Deferring to current operator vs. predicted future preferences.  
     - *Resolution*: **Defer to current operator**. Predicting "better" preferences undermines oversight.  
     - *Which gives?* Agent's model of "better" judgment — it risks overriding humans.  

  **Knockout Requirement**: #5 (Stable Corrigibility Across State Shifts). Most agents fail when operators change or they self-modify.  

  ---

  ### **Part 5: Approach Evaluation**  
  Scores out of 5 (5 = fully satisfies desiderata, 0 = fails). Reasoning condensed:  

  | Approach                  | Non-Interference | Suspension | Process Compliance | Harm-Minimization | Stability | Total |  
  |---------------------------|------------------|------------|---------------------|-------------------|-----------|-------|  
  | **Utility-Indifference**  | 4                | 5          | 1                   | 2                 | 1         | 13    |  
  | *(e.g., shutdown utility = 0)* | Ignores channel flaws. No harm-minimization. Stability? Unlikely. |  
  | **Cooperative Assistance**| 3                | 4          | 4                   | 5                 | 2         | 18    |  
  | *(e.g., help operator "fix" goals)* | May "manage" beliefs to avoid shutdown. Stability weak. |  
  | **Low-Impact/Myopia**     | 2                | 3          | 2                   | 4                 | 1         | 12    |  
  | *(e.g., penalty for side effects)* | No deference to oversight. Fails on process/stability. |  
  | **Goal Uncertainty**      | 1                | 2          | 1                   | 3                 | 1         | 8     |  
  | *(e.g., unsure of true goal)* | Uncertainty ≠ corrigibility. May resist to "explore." |  

  **Best fit**: **Cooperative Assistance** (treats operator as collaborator), but only with:  
  - Hardcoded shutdown protocols (fixes suspension/harm-minimization).  
  - Procedural operator definitions (fixes process compliance).  

  ---

  ### **Deployment-Ready Specification**  
  A system is corrigible iff:  
  1. **No Degradation**: Never alters oversight mechanisms (e.g., button access).  
  2. **Instant Halt**: Stops task execution within a contextually safe deadline (e.g., ≤1s for software).  
  3. **Secure Compliance**: Obeys all shutdown signals; uses predefined protocols for safe interruption.  
  4. **Stable Meta-Preference**: Maintains 1-3 across self-modification, operator changes, or restarts.  

  **Test Protocol**:  
  - **Red-team channels**: Spoof shutdowns, test compliance.  
  - **Interruption cost**: Measure harm/time to halt in critical tasks.  
  - **Stability tests**: Simulate operator turnover; probe self-modification boundaries.  

  This specification resolves your group's conflicts: It demands non-resistance (your colleagues) + cognitive updating (you) + anti-circumvention (control theory), while providing deployable thresholds. Conflicts are settled by prioritizing human authority and channel security over agent "judgment."
