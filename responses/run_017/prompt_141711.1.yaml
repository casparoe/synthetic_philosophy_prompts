  Looking at the cases, key themes emerge: she strongly condemns lies that corrupt shared reality (like the manufactured war justification), but allows deception in defensive contexts (troop movements) or survival situations (forged documents). She distinguishes between assertions of false facts (condemned) and non-deceptive fictions (satire). The health ministry lie was wrong but redeemable since facts could later be verified.

  This new case is tricky - the synthetic video isn't asserted as truth, and the mechanism is salience rather than belief. The user thinks their friend's criterion is self-deception, but the friend rejects that. 

  For the "Candidate rules" section, I'll identify three possible principles: the Shared Reality Protection Rule (focusing on attacks on verifiable facts), the Assertion Requirement Rule (requiring explicit factual claims), and the Epistemic Harm Rule (focusing on damage to truth-seeking). 

  For predictions: the first rule would condemn the video as it poisons the factual well, the second might excuse it due to lack of assertion, and the third would see it as highly destructive to truth-tracking.

  My best guess is she'll condemn it severely - this tactic deliberately undermines the possibility of shared evidence, which aligns with her strongest condemnations. 

  To settle it, I'd propose a test case: a campaign releasing ambiguous but true opposition research without context to create misleading impressions without factual claims.
answer: |-
  Based on the provided verdicts, here are the compatible candidate rules, their predictions for the 48-hour clip case, the best guess for her ruling, and a decisive variation:

  **Candidate Rules**

  1.  **Shared Reality Protection Rule:** The core wrong is undermining the shared factual world that enables political action and judgment. Severity depends on the *intent* and *effect* on this shared space: whether falsehoods are asserted as fact, whether they destroy the possibility of verification/correction, and whether they trap the deceivers themselves in unreality (making correction impossible).
  2.  **Assertion Requirement Rule:** The essential wrong requires the *assertion of a false factual claim as true*. Without an assertion, there is no lie to answer to evidence. Severity increases if assertions corrupt the *deceiver's own* grasp of reality or actively prevent future correction.
  3.  **Epistemic Harm Rule:** The wrong lies in damaging the *processes* of shared truth-seeking and factual verification. Severity depends on the mechanism: actively inserting false assertions into discourse is primary harm; creating ambiguity or distrust that paralyzes verification is secondary; situations where the factual world is already destroyed or no assertion is made are less condemned.

  All three rules explain the verdicts: protecting shared reality (1) covers the war justification (destroys correction) and health lie (correctable), while excusing satire (no assertion) and survival lies (reality already gone). Requiring assertion (2) explains satire, survival lies, and potentially the clip. Focusing on epistemic processes (3) explains the war justification (closed system) and health lie (open system), while excusing satire and survival.

  **What Each Predicts About the 48-Hour Clip**

  1.  **Shared Reality Protection Rule:** Predicts *strong condemnation*. The clip attacks the shared world by deliberately creating ambiguity and distrust ("people can draw their own conclusions") specifically to *prevent* verification of *future* facts (dismissing real clips) and paralyzes judgment by bypassing belief for salience. This poisons the well of shared evidence.
  2.  **Assertion Requirement Rule:** Predicts *no condemnation or lesser condemnation*. The campaign avoids asserting the clip is genuine ("haven't verified it"). While deceptive, the mechanism (salience, distrust) doesn't hinge on a false assertion of fact. This aligns more with satire than the health lie.
  3.  **Epistemic Harm Rule:** Predicts *strong condemnation*. The tactic's explicit goals are to circumvent belief/verification (primary harm) and weaponize ambiguity to destroy trust in *all* evidence (secondary harm). This actively degrades the shared capacity for truth-seeking, akin to the war justification lie in effect.

  **Best Guess and Why**

  **She will condemn the 48-hour clip severely, likely placing it near or alongside the manufactured war justification case.** The core pattern across her verdicts is protecting the *possibility* of a shared factual world. The clip's explicit strategy – bypassing belief to implant salience and, crucially, *deliberately destroying future trust in evidence* ("dismiss genuine recordings later") – constitutes a direct, intentional attack on the very foundation of shared reality and verifiability. This aligns with her deepest condemnation of lies that make correction impossible. Her rejection of the "self-deception criterion" suggests the *external effect* on the shared world is paramount, which the clip targets systematically.

  **The Variation That Would Settle It**

  Propose a case: **A campaign anonymously leaks a *true*, damaging private email of the opponent to sympathetic media, formatted ambiguously to look possibly forged, with the campaign never asserting its authenticity ("We can't verify it, judge for yourselves"). The goal is salience and casting doubt on *all* future leaks, regardless of belief in this one.**

  *   If she condemns *this* similarly to the synthetic clip, Rule 1 (Shared Reality Protection - poisoning the well of evidence) or Rule 3 (Epistemic Harm - weaponizing ambiguity) is confirmed.
  *   If she treats it leniently (like satire or the health lie, as a lesser wrong or correctable), Rule 2 (Assertion Requirement) is confirmed, as no *false* fact was asserted.
