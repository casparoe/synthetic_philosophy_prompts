  The core tension here seems to be between their friend's neat application of Nietzsche's categories and their own intuition that the campaigners' actions represent something outside Nietzsche's original formulation - a "monumental history of the injured." This strikes me as a sophisticated insight worthy of serious engagement.

  I need to carefully map each element: the statue itself clearly functions as antiquarian history for the institution, while the removal demand embodies critical history. The Oxford "contextualization" solution is an interesting hybrid - attempting to merge antiquarian preservation with critical awareness. 

  Where it gets philosophically rich is examining Nietzsche's "service to life" criterion. The colonial descendants and historically marginalized groups have fundamentally conflicting needs regarding this symbol. Nietzsche's framework doesn't provide tools to mediate such conflicts - it's better at diagnosing historical modes than resolving clashes between them.

  The user's concept of "monumental history of the injured" is particularly compelling. While not fitting neatly into Nietzsche's triumphalist monumental category, it shares the function of creating exemplars for present action - just through absence rather than presence. This exposes a limitation in Nietzsche's scheme regarding whose "greatness" gets commemorated.

  The three specific questions are sharp: 1) Nietzsche's life criterion can't adjudicate inter-group conflicts, 2) critical history often depends on what it destroys (as with Rhodes' statue being necessary for the protest), 3) the "injured" monument concept reveals Nietzsche's blind spot toward non-dominant narratives. 

  Throughout, I should maintain the user's stipulated facts and avoid external references. The analysis must honor their sophisticated framing while rigorously testing Nietzsche's framework against the case study they've provided. The conclusion should validate their intuition that the scheme shows strain when applied to such contested memory politics.
answer: |-
  Here's a rigorous analysis using Nietzsche's threefold scheme applied to your stipulated facts, followed by an assessment of its limitations:

  **Mapping the Episode (Nietzschean Framework):**

  1.  **The Statue Itself (Pre-Removal Demand):**
      *   **Mode:** **Antiquarian History.** It represents a tangible link to Oriel College's past, embodying institutional heritage, tradition, and the values (however problematic) associated with its benefactor. Its primary function is preservation and veneration of *this specific past* as foundational to the college's identity. It's not primarily inspiring future *action* (Monumental), nor is it being critically dismantled (Critical).

  2.  **The Demand for Removal:**
      *   **Mode:** **Critical History.** The campaign explicitly seeks to "break a past that burdens life." It judges Rhodes (and the values he represents) as harmful to the present and future flourishing of marginalized groups and the institution itself. Its goal is destruction/removal to liberate the present from the oppressive weight of this specific historical symbol.

  3.  **The Oxford Compromise (Contextualization):**
      *   **Mode:** **Predominantly Antiquarian, with Critical Elements.** The *act of keeping the statue* is fundamentally Antiquarian – preserving the physical artifact as part of the college's historical fabric. The *added context* attempts a Critical gesture by acknowledging harm and complexity. However, Nietzsche would likely see this as the Antiquarian impulse (preserving the object and its link to the past) co-opting and neutralizing the Critical impulse (which demanded removal). The Critical element serves the Antiquarian goal of preservation-by-modification, not liberation-through-destruction.

  4.  **Nietzsche's Test: "Service to Life" - What Would it Prescribe?**
      *   **For the Campaigners (and groups they represent):** The statue *burdens* life. It symbolizes ongoing pain, exclusion, and the glorification of oppression. Critical History (removal) serves their life by removing a harmful symbol, asserting agency, and creating space for a different future. Monumental History of the Injured (the empty plinth/defacement as monument to resistance and the wronged) could *also* serve life by providing inspiration for continued struggle and affirming their narrative.
      *   **For the College (as institution/status quo defenders):** The statue embodies heritage, tradition, and (arguably) continuity. Antiquarian History (keeping it) serves *their* conception of life by maintaining established identity and order. Contextualization serves life (for them) by attempting to appease critics *while preserving the object*, thus minimizing disruption to their existing narrative and environment.
      *   **The Conflict:** Nietzsche's "service to life" **cannot objectively adjudicate** here. It's inherently perspectival. What serves the life (flourishing, strength, future-oriented action) of the historically marginalized is diametrically opposed to what serves the life (stability, continuity, preservation of identity) of the institution steeped in that problematic past. Nietzsche's criterion highlights the conflict but offers no neutral resolution.

  **Assessing the Scheme: Where it Fails or Strains**

  1.  **Conflict of "Life" Needs:** The case **explicitly exposes a core limitation** of Nietzsche's "service to life" criterion. The scheme brilliantly diagnoses *modes* of historical engagement and their motivations, but **it is silent on how to resolve clashes** when different groups' vital needs regarding history are fundamentally incompatible, as they are here between campaigners and the college establishment. Nietzsche offers diagnosis, not conflict resolution.
  2.  **Critical History's Dependence:** Your insight is crucial. Critical History **often depends absolutely on the Antiquarian object it seeks to destroy.** The power of the Rhodes Must Fall protest stemmed precisely from targeting a potent *existing* Antiquarian symbol. The defacement and demand for removal derived their meaning and force *from* the statue's established presence and veneration. Critical History needs the monument of Antiquarianism as its foil and target. Nietzsche's scheme describes them as distinct modes but doesn't delve deeply into this parasitic/dependent relationship in practice.
  3.  **Monumental History of the Injured: Rescuer or Hole?**
      *   **Exposes a Hole:** Nietzsche's "Monumental History" is explicitly about *greatness*, *achievement*, and *emulation* – a chain of inspiring exemplars. The "monument to the wronged" you propose is fundamentally different. It commemorates suffering, resistance, and victimization, not traditional greatness or deeds to emulate in Nietzsche's heroic sense. It aims for justice, remembrance, and perhaps inspiration through resistance, but not primarily through the *emulation of individual greatness*. This **exposes a significant gap (a hole)** in Nietzsche's original conception of Monumental History. His framework struggles to accommodate monuments whose power comes from absence (the empty plinth), defacement, or the commemoration of collective injury and resistance against figures like Rhodes.
      *   **Not Quite a Rescue:** While it points to a new *kind* of monument, it doesn't neatly fit *within* Nietzsche's existing Monumental category due to its focus. It suggests the scheme needs expansion or modification to account for monuments of trauma, resistance, and counter-narratives that don't fit the "great man" model.

  **Conclusion: An Anomaly Highlighting Limitations**

  The case is **primarily an anomaly within Nietzsche's scheme that exposes its limitations and gaps**, rather than a neat confirmation:

  *   **Confirms:** The basic identification of the modes (Antiquarian statue, Critical removal demand, Antiquarian-dominated compromise) is insightful and useful for diagnosis.
  *   **Exposes Limitations:**
      *   **Conflict of "Life":** The scheme's core criterion ("service to life") cannot resolve conflicts between the vital historical needs of opposing groups.
      *   **Critical's Dependence:** It under-theorizes how Critical History often relies on the very Antiquarian presence it attacks.
      *   **Monumental's Narrowness:** Nietzsche's concept of Monumental History is too narrow to encompass powerful "monuments" to the injured, resistance, or absence born from Critical action. This is a **significant hole** in the original framework.
      *   **The Compromise:** The contextualization outcome doesn't fit neatly into *one* mode; it's a hybrid where Antiquarianism subsumes a diluted Critical gesture, a dynamic not deeply explored by Nietzsche.

  The Rhodes Must Fall episode, particularly the contrast between Cape Town's removal and Oxford's contextualization, acts as a powerful stress test. It confirms Nietzsche's categories as useful diagnostic tools but reveals their inadequacy in handling irreconcilable conflicts over historical meaning, the dependence of criticism on its target, and the need to recognize forms of monumental commemoration centered on injury and resistance that fall outside his original heroic paradigm. The scheme is illuminating but ultimately insufficient for the full complexity of this kind of historical contestation.
