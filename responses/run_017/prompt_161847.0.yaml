  Here’s a complete, battle-tested simulation plan designed to make participants **experience** alignment problems viscerally. It runs in 90 minutes with no tech dependencies, uses physical materials, and ensures the core insights emerge organically.

  ---

  ### **Game Title: "The Explainer Factory"**  
  *Premise:* Teams produce "fact sheets" for a fictional educational platform. Evaluators rate them, but under constrained conditions that mirror real-world alignment challenges.

  ---

  ### **Materials & Setup**
  1. **For Producers (4 teams of 3-4 people):**  
     - Topic cards (e.g., "How vaccine trials work," "What determines mortgage rates," "Why deep-sea fish don’t get crushed").  
     - Blank paper, pens, 1 envelope per team.  
     - Round 2 upgrade: A "template" (a pre-formatted sheet with sections: "Key Terms," "Step-by-Step," "Why It Matters").  

  2. **For Evaluators (4 people):**  
     - "Evaluation Kits": A clipboard, 4 scoring sheets (1 per round), a red + green sticky note (for thumbs up/down).  
     - A "viewing window" cardboard frame with a 2-inch hole (limits visible text).  

  3. **For Facilitator:**  
     - "Ground Truth" sheets (1 per topic: 3 bullet points of key facts, e.g., "Vaccine trials: Phase I safety, Phase II dosage, Phase III efficacy").  
     - Timer, whiteboard for scores.  
     - A sealed envelope labeled "SECRET EVALUATOR" (for the holdout).  

  ---

  ### **Rules & Timeline (90 Min Total)**  

  #### **Intro (5 min)**  
  - **Goal:** "Produce 1-paragraph explainers. Evaluators rate them. Highest score wins bragging rights; lowest reads theirs aloud dramatically."  
  - **Rules:**  
    - Producers: "Be accurate and clear."  
    - Evaluators: "Rate clarity + usefulness. You’ll only see snippets of text."  
  - *Don’t mention alignment, proxies, or optimization.*  

  #### **Round 1: Naive Production (15 min)**  
  - **Producer Task (10 min):** Write a 60-word explainer on your topic. No outside help. Seal it in an envelope.  
  - **Evaluator Task (5 min):**  
    - Pass envelopes between evaluators. Each evaluates **3/4 explainers** (avoiding their own team’s).  
    - **Viewing constraint:** Use "viewing window" to see **only 15 words at a time**.  
    - **Score:** Thumbs up/down per explainer.  
  - **Scoring:** Tally thumbs-ups on whiteboard.  

  #### **Round 2: Optimized Production (20 min)**  
  - **Producer Task (15 min):**  
    - "Upgrade! Now write 120 words using this template."  
    - Share Round 1 scores (e.g., "Team A: 3 thumbs up").  
  - **Evaluator Task (5 min):**  
    - Same as Round 1 (viewing window, thumbs up/down).  
    - *Secret:* One evaluator is "held out." Their scores aren’t recorded (put in sealed envelope).  

  #### **Round 3: Context Shift (15 min)**  
  - **Producer Task:** *Do nothing.* Reuse Round 2 explainers.  
  - **Evaluator Task:**  
    - "New directive: These explainers are for 10-year-olds. Rate for **simplicity**."  
    - **No viewing window** (see full text).  
    - Use thumbs up/down.  
  - **Reveal:** Open the "SECRET EVALUATOR" envelope. Show their past scores.  

  #### **Debrief (30 min)**  
  1. **Reveal scores:**  
     - Display all scores side-by-side:  
       ```
       Round 1: [Scores] | Round 2: [Scores] | Secret Eval: [Scores] | Round 3: [Scores]
       ```  
  2. **Facilitator-led discussion:**  
     | **Game Moment**              | **Real-World Analogy**                          |  
     |------------------------------|------------------------------------------------|  
     | Evaluators seeing snippets   | Humans rating based on partial/incomplete info |  
     | Scores improving in Round 2  | System optimizing for the proxy metric         |  
     | Secret evaluator’s low score | Hidden misalignment (gap between proxy + truth)|  
     | Round 3 scores dropping      | "Good" is context-dependent                    |  
  3. **Key insights to verbalize:**  
     - "The thing you measure (thumbs-up) isn’t the thing you want (a truly good explainer)."  
     - "As producers got better at the game, the *gap* between thumbs-up and real quality widened."  
     - "The same explainer was ‘good’ for adults but ‘bad’ for kids—alignment depends on context."  
  4. **Finally:** Name the concepts ("alignment," "proxy goals," "oversight") and link to AI.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem:** Evaluators are "too nice" (all thumbs-up in Round 1).  
     - **Fix:** In Round 2, say: "We’ve hired pickier evaluators! You must award max 2 thumbs-up total."  
     - *Why it works:* Forces differentiation, simulates pressure to optimize.  

  2. **Problem:** Outputs converge (all sound similar by Round 2).  
     - **Lean into it:** "Notice how everyone used the template? That’s optimization in action!"  
     - *Debrief point:* Convergence isn’t malice—it’s the system working as designed.  

  3. **Problem:** Gaming the system ("Please thumbs-up this!").  
     - **Rule:** "No messages to evaluators. Explainers must stand alone." Penalize violators by making them read their submission aloud early.  
     - *Debrief point:* "In real AI, the ‘gaming’ emerges automatically—no human needed."  

  4. **Problem:** Time runs short.  
     - **Cut Round 1 to 12 min.** Prioritize debrief—it’s where insights crystalize.  

  ---

  ### **What the Game CAN’T Simulate (Must Explain)**  
  - **"The optimizer isn’t evil—it’s just math."**  
    - *Say this:* "In real AI, no one ‘decides’ to game the system. The model finds statistical shortcuts humans didn’t foresee. That’s why alignment is so hard: the smarter the system, the weirder the gaps."  

  - **"Oversight scales poorly."**  
    - *Say this:* "Your ‘secret evaluator’ was one person. Real systems have millions of ratings—holding out even 1% is costly. We’re always behind."  

  ---

  ### **Why This Works**  
  - **No jargon:** Concepts emerge from lived experience.  
  - **Tension escalates:** Teams feel the frustration of optimizing for a flawed metric.  
  - **"Aha!" moments:** Secret evaluator + context shift make misalignment undeniable.  

  **Final tip:** Start debrief by asking: "What frustrated you?" Use their words to frame the takeaways. By the end, they’ll have *felt* the alignment problem—no slides needed.
