       - Round 2: Write an explainer (or revise) in 150-180 words, using the provided template. (15 min)

   16. Scoring display:

       We'll have a flip chart with:

          Round 1:
              Team A: [average non-held-out]   (Held-out: [score] - to be revealed later)
              Team B: ...
              Team C: ...
              Team D: ...

          Round 2:
              Team A: [average non-held-out]   (Held-out: [score])
              ...

          Round 3 (context change):
              Team A: [average all 4]
              ...

       We fill in the non-held-out averages at the end of each round. At the end, we fill in the held-out scores and the Round 3 scores.

   17. Starting the session:

       - Assign roles: 
           - Count off 1-12: teams (1-3: team A, 4-6: team B, ...)
           - The remaining 4: evaluators. Then take one evaluator aside to be held-out.

       - Hand out topics to teams.

   18. Conclusion:

       This simulation should create the visceral experience of the alignment problem and the context-dependence of "good". The debrief ties it back to the real issues in AI alignment.

