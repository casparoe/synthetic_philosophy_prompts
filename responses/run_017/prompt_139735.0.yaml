  ### Commentary  
  1. **BRL**: Targets outcome relabeling in lending/healthcare (e.g., redefining "default" by group to force equal prevalence). Satire is fair because it exposes how reconciling metrics voids cross-group meaning.  
  2. **Degenerate Certification**: Critiques vendors monetizing edge cases (e.g., "perfect prediction" as a sellable escape hatch). Grounded in theorems requiring these conditions.  
  3. **Stochastic Parity**: Exaggerates "fair" randomization that harms all groups (e.g., adding noise to achieve parity). Mirrors real post-processing tools.  
  4. **Proxy Shield**: Satirizes "we don't use race" systems that infer it via ZIP codes. Reflects reconstruction F1-scores from real studies (e.g., Voigt et al. 2017).  
  5. **Compliance Score™**: Mocks vendor composites (e.g., IBM's "Fairness 360 Index") that flatten incompatibilities. The weighted formula permits mathematically valid but misleading scores.  
  6. **Subgroup Lock**: Highlights auditing blind spots (e.g., only certifying broad groups). Echoes real limitations in subgroup fairness tools.  

  **Why Not Strawman?**  
  - Each feature exaggerates *documented* practices: outcome shifting (GRC vendor whitepapers), proxy laundering (COMPAS), degenerate-condition exploitation (marketing of "tri-compatible" tools).  
  - All metrics comply with possibility theorems (e.g., EFPR *can* coexist with CWG under BRL’s adjusted labels).  
  - The deadpan tone mirrors actual vendor docs (e.g., Azure Fairlearn’s avoidance of trade-off explanations), letting the absurdity emerge from accurate technical descriptions.  

  This approach ensures FAccT audiences recognize real pathologies while newcomers grasp the operational cynicism.
