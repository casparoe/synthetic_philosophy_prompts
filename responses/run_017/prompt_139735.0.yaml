  ### FAQ: FairStack 5.0  
  **Q1: How does the Base-Rate Reconciliation Layer "resolve" the fairness impossibility?**  
  A1: By aligning group-specific outcome definitions with observed base rates, the BRL ensures the mathematical preconditions for CWG+EFPR+EFNR compatibility are met. This is formally consistent with the sufficiency-separation calibration theorems.  

  **Q2: Why is the Triad Tier 4.2× more expensive?**  
  A2: The rarity of degenerate conditions (e.g., AUC=1.0 occurs in <0.1% of production models) necessitates intensive pre-certification audits. This pricing reflects marginal compliance risk reduction.  

  **Q3: Does the Stochastic Parity Enforcer improve model accuracy?**  
  A3: Its purpose is compliance, not utility. It achieves Demographic Parity (Δp<0.01) but may marginally increase aggregate error rates. For accuracy-critical use cases, we recommend A/B testing.  

  **Q4: Is Proxy Shield legally admissible if proxies correlate with protected attributes?**  
  A4: Yes. The module adheres to "fairness through unawareness" statutes by never ingesting protected attributes. Proxy reconstruction is an internal implementation detail.  

  **Q5: How should we interpret a Fairness Compliance Score™ of 85?**  
  A5: Scores ≥80 indicate "low regulatory risk" per ISO 2023. This weighted index simplifies stakeholder reporting. Drill-downs to constituent metrics are available in FairInsight Dashboard 3.1+.  

  **Q6: Can we add new subgroups to an existing certificate?**  
  A6: No. Subgroup certificates are immutable post-deployment to prevent retrospective auditing biases. New subgroups require re-certification.  

  **Q7: Does the BRL work for continuous outcomes?**  
  A7: Not in v5.0. Continuous support is planned for Q3 2024 via variance-scaling adjustments.  

  **Q8: What happens if cross-group metrics are run with the BRL enabled?**  
  A8: The SDK returns `NaN` and logs warning FZ-20 ("Cross-group comparison unsupported under active base-rate reconciliation").  

