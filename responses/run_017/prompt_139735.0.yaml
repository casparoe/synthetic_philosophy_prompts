  ### Release Notes (FairStack 5.0)

  **FairStack 5.0 Release Notes**

  **Summary**  
  FairStack 5.0 introduces groundbreaking capabilities to navigate the complex landscape of algorithmic fairness. This release focuses on achieving compliance with multiple fairness criteria simultaneously through innovative approaches, including the Base-Rate Reconciliation Layer (BRL) and expanded support for degenerate conditions. Additionally, we have enhanced our fairness enforcement toolkit with new modules for randomization, proxy handling, and a unified fairness score. These advancements ensure that organizations can meet regulatory requirements and internal fairness goals with greater flexibility.

  **New Features**

  1. **Base-Rate Reconciliation Layer (BRL) (Experimental)**  
     The BRL module enables simultaneous satisfaction of Calibration Within Groups (CWG) and Equalized False Positive and False Negative Rates (EFPR/EFNR) across protected groups. By dynamically adjusting outcome definitions (e.g., varying event thresholds, observation windows, or label sources) per group, the BRL harmonizes base rates, thereby resolving the well-known impossibility trilemma. Note: When the BRL is active, the outcome variable is group-specific, and cross-group comparison of model performance is not supported. This feature is available as an optional add-on for customers with advanced fairness needs.

  2. **Degenerate Condition Certification**  
     FairStack now offers a tiered licensing model for fairness criteria. The Standard license allows any two fairness criteria (e.g., Independence and Separation) to be enforced simultaneously. The Triad License (Enterprise only) permits joint enforcement of all three criteria (Independence, Separation, Sufficiency) for customers who can certify one of the two degenerate conditions: (a) equal base rates across groups, or (b) perfect predictor performance (AUC=1.0). Contact sales for pricing and certification requirements.

  3. **Randomized Post-Processing Module**  
     This module achieves strict Demographic Parity (Independence) by introducing controlled randomization into predictions. The algorithm ensures that the selection rate is equal across groups, even if it requires downgrading high-scoring individuals in some groups. Note: This may result in reduced overall accuracy but guarantees compliance with parity requirements.

  4. **Proxy-Aware Fairness Enforcement**  
     For scenarios where protected attributes are unavailable, FairStack 5.0 can now enforce fairness using reconstructed protected attributes derived from proxy variables. The system uses state-of-the-art reconstruction models (e.g., based on surname, zip code, or transaction history) and then applies standard fairness constraints. This allows compliance with "fairness through unawareness" regulations while effectively managing group disparities.

  5. **Unified Fairness Score**  
     To simplify fairness reporting, we introduce a composite Fairness Score (0-100) that combines up to five fairness metrics (e.g., Demographic Parity Ratio, Equalized Odds Ratio, Calibration Difference) into a single value. The score is configurable via metric weights, allowing organizations to emphasize criteria most relevant to their compliance framework. A score above 80 is generally considered "fair" under our default weighting.

  6. **Predefined Subgroup Certificates**  
     Organizations can now obtain fairness certificates for predefined subgroups (e.g., "Black Females aged 18-25") to demonstrate compliance in specific segments. The certificate guarantees that the selected fairness metrics hold within the subgroup, provided the subgroup is specified during the initial audit. Note: Intersectional subgroups not declared in advance are not covered by the certificate.

  **Known Limitations**

  - **Cross-Group Comparability (BRL)**: When using the Base-Rate Reconciliation Layer, the outcome variable is redefined per group. Therefore, direct comparison of model scores or outcomes across groups is not meaningful and is disabled in the dashboard.
  - **Triad License Restrictions**: The Triad License requires certification of a degenerate condition. Customers without such certification must use the Standard license and select two fairness criteria.
  - **Randomization Impact**: The Randomized Post-Processing Module may reduce model utility and is not recommended for high-stakes decisions without thorough impact assessment.
  - **Proxy Accuracy**: Proxy-Aware Fairness Enforcement relies on the accuracy of attribute reconstruction. Discrepancies in reconstruction may lead to imperfect fairness enforcement.
  - **Subgroup Coverage**: Subgroup certificates only apply to subgroups explicitly named during configuration. Performance in unmeasured intersections may vary.

  **Migration Notes**

  - Existing FairStack 4.x configurations will automatically default to the Standard license (two criteria). Customers wishing to use the Triad License must undergo certification.
  - The BRL module requires manual activation and outcome definition per group. We recommend consulting our support team during setup.
  - The new Fairness Score will appear in all audit reports by default. To disable, set `use_fairness_score=False` in the configuration file.

  ---

  ### FAQ

  **Frequently Asked Questions: FairStack 5.0**

  **Q1: How does the Base-Rate Reconciliation Layer achieve both calibration and equalized error rates?**  
  A1: The BRL harmonizes base rates by adjusting the definition of the target event per group. For example, in a lending scenario, one group might have a 90-day delinquency threshold, while another uses 120 days. This ensures that the event rate is comparable across groups, allowing simultaneous satisfaction of CWG and EFPR/EFNR. Note that the outcome variable is group-specific, so cross-group interpretation should be avoided.

  **Q2: Why is the Triad License only available to customers with degenerate conditions?**  
  A2: The impossibility theorems show that Independence, Separation, and Sufficiency can only hold simultaneously under degenerate conditions (equal base rates or perfect prediction). Our Triad License enforces this mathematical reality, ensuring compliance only when these rare conditions are met. Standard licensees must choose two criteria.

  **Q3: Does the Randomized Post-Processing Module affect model accuracy?**  
  A3: Yes. To achieve strict Demographic Parity, the module may override model predictions, potentially reducing overall accuracy. However, it guarantees compliance with parity regulations. We recommend A/B testing to assess utility impact.

  **Q4: How reliable is Proxy-Aware Fairness Enforcement?**  
  A4: The module uses advanced reconstruction techniques with typical accuracy of 85-95% across common proxies. While this enables fairness enforcement without direct protected attributes, any reconstruction error may propagate to fairness metrics. We advise periodic validation against ground-truth attributes when available.

  **Q5: What does the Fairness Score represent?**  
  A5: The Fairness Score (0-100) is a weighted average of selected fairness metrics. A score of 100 indicates perfect fairness on all included metrics. Our default threshold of 80 is empirically derived and aligns with industry best practices. The weights are customizable to reflect organizational priorities.

  **Q6: Can we add new subgroups to a fairness certificate after deployment?**  
  A6: No. Subgroup certificates are generated only for subgroups defined at audit time. To add a new subgroup, you must rerun the certification process. This ensures audit integrity by preventing post-hoc selection.

  **Q7: Does FairStack 5.0 support equal opportunity across intersectional groups?**  
  A7: Our predefined subgroup certificates allow fairness guarantees for specific intersections (e.g., "Hispanic Males"). However, the system does not automatically extend to all possible intersections due to statistical power constraints. We recommend defining critical intersections upfront.

  **Q8: Is the BRL compliant with the EU AI Act?**  
  A8: The BRL is designed to meet statistical parity requirements. However, regulations regarding outcome consistency are evolving. We advise consulting legal counsel to ensure alignment with jurisdiction-specific rules.

