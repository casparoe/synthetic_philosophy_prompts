  ### Release Notes: FairStack 5.0  
  **Summary**  
  FairStack 5.0 delivers unprecedented flexibility in meeting global fairness regulations. With 12 new compliance modules and enhanced SDK integration, customers can now reconcile previously incompatible fairness criteria, minimize audit friction, and deploy with confidence. Highlights include the Base-Rate Reconciliation Layer for harmonized statistical guarantees, tiered licensing for degenerate-condition use cases, and streamlined reporting via the Fairness Compliance Score™.  

  **New Features**  
  1. **Base-Rate Reconciliation Layer (BRL)**  
     - *Problem Addressed*: The mutual exclusivity of Calibration-Within-Groups (CWG), Equalized FPR (EFPR), and Equalized FNR (EFNR) under unequal base rates.  
     - *Solution*: Dynamically adjusts outcome definitions per protected group to equalize event prevalence. For example:  
       - In lending, "default" may be redefined as 120-day delinquency for Group A and 90-day for Group B.  
       - In healthcare, "readmission risk" thresholds may vary by ±15% across groups.  
     - *Guarantees*: Simultaneous CWG, EFPR, and EFNR (verified at α=0.05).  
     - *Note*: Cross-group performance comparisons are unsupported in this mode. Enable `skip_cross_group_metrics=true` to suppress dashboard errors.  

  2. **Degenerate Condition Certification**  
     - *Tiered Licensing*:  
       - **Standard Tier**: Enforce any two fairness criteria (e.g., Separation + Sufficiency).  
       - **Triad Tier**: Enforce Independence, Separation, *and* Sufficiency. Requires proof of either:  
         (a) Equal base rates across groups (p<0.01 χ²-test), or  
         (b) Perfect predictor performance (AUC=1.00).  
     - *Pricing*: Triad Tier costs 4.2× Standard (reflecting rarity of valid certifications).  

  3. **Stochastic Parity Enforcer**  
     - Achieves strict Demographic Parity (Independence) by randomizing predictions:  
       - For over-selected groups: Demote 8–12% of high-scoring individuals via synthetic noise (μ=0, σ=0.3).  
       - For under-selected groups: Promote 5–7% of mid-scoring individuals.  
     - *Impact*: Reduces demographic disparity to <0.01 Δp without improving model utility.  

  4. **Proxy Shield Module**  
     - Enforces fairness-through-unawareness while reconstructing protected attributes via:  
       - Surname + geolocation proxies (F1-score=0.89).  
       - Behavioral clustering (ARI=0.75).  
     - Certified compliant with EU Act §17.3 ("no direct protected attribute ingestion").  

  5. **Fairness Compliance Score™**  
     - Unifies metrics into a single index (0–100):  
       ```  
       Score = 40*(1−|DPR−1|) + 30*(1−|EOR−1|) + 30*(1−|CWD−0|)  
       ```  
       Where DPR=Demographic Parity Ratio, EOR=Equalized Odds Ratio, CWD=Calibration Difference.  
     - Customers exceeding 80/100 meet ISO Fairness Standard 2023.  

  6. **Predefined Subgroup Lock**  
     - Issues fairness certificates for user-specified subgroups (e.g., "Black Males, 18–24").  
     - Certificates validate EFPR/EFNR *only* for declared subgroups. Undeclared intersections are not audited.  

  **Known Limitations**  
  - **BRL Operational Constraints**: Outcome variables are group-specific. Comparing "default rates" across groups is statistically invalid.  
  - **Triad License Eligibility**: 92% of customers lack qualifying degenerate conditions (per audit logs).  
  - **Stochastic Parity**: May increase aggregate FNR by 3–5% (see Appendix D).  
  - **Proxy Shield**: Reconstruction F1-score drops to 0.72 for groups <5% sample size.  
  - **Compliance Score™**: Masks trade-offs (e.g., DPR=1.0 may coexist with EOR=0.6).  

  **Migration Notes**  
  - BRL requires outcome remapping dictionaries (format: `{"group": {"outcome_def": adjusted_threshold}}`).  
  - FairStack 4.x "EqualOddsEnforcer" is deprecated; use `StochasticParity(mode='demographic')` instead.  
  - Customers with Triad Tier licenses must upload certification docs to the compliance portal.  

