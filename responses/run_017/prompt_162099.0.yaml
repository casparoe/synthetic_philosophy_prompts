prompt: |-
  I work on an alignment team that is building an oversight pipeline for a model that produces long technical documents: literature reviews, incident postmortems, internal policy summaries. The failure mode we actually worry about is not a fabricated number or a false sentence. It is deception by omission. The report is locally accurate, every sentence checks out, no citation is invented, and the reader still walks away with the wrong conclusion because the one consideration that would have reversed it was quietly left out, or buried.

  A colleague argues that debate handles this, and he leans on two analogies when he makes the case.

  The first is the courtroom. Two advocates, a judge or jury with no independent expertise, and the truth emerges from the clash: each side is incentivised to find and expose the weak point in the other's case, and cross-examination is precisely the mechanism by which an ignorant trier of fact learns what happened. On this picture debate is just cross-examination with models, and the conclusion he draws is that two debaters and a weak judge recover the reliability of a strong expert.

  The second is the interactive proof system. Arthur is computationally weak, Merlin is enormously strong but untrusted, and the whole point of the protocol is that checking is cheaper than finding: a verifier who could never have produced the answer can still be brought to accept or reject it with high confidence, provided he can randomise, ask follow-ups, and test individual claims. My colleague's version of this is that debate converts an unverifiable generation problem into a verifiable checking problem, so oversight scales past the point where the human understander gives out. The conclusion he draws is that debate is not a heuristic but a guarantee of the same shape as the complexity-theoretic one.

  I want both analogies audited against our case, not against the general question of whether debate is a good idea.

  Please give me, for each analogy, an explicit mapping: what plays the role of the two advocates, the judge, the evidence, the verdict, and the penalty for being caught. Then tell me which parts of the source domain the analogy quietly imports and our target lacks. My own list of suspects includes, for the courtroom, a fact of the matter that is fixed in advance and shared by both sides, a procedure that can compel disclosure, and a cost to perjury that does not depend on the judge noticing it; and, for the proof system, a proposition that is fully specified before the protocol begins, a verifier whose tests are sound by construction, and a prover who is constrained to answer questions rather than to produce artifacts. Add the ones I have missed.

  The question I care about is whether the conclusions survive in the omission case specifically. Falsehood has a location you can attack; omission does not. There is no single claim for the opponent to isolate and refute, and the judge cannot notice what was never put in front of him, so the mechanism each analogy relies on seems to have nothing to bite on. Say plainly whether that is right, and whether either analogy has resources I am underestimating: for instance, whether an opponent can be made to attack a framing rather than a sentence, or whether the verifier in the proof picture can be given a check whose outcome depends on what is absent.

  Then separate the disanalogies that are load-bearing for our use case from the ones that are merely decorative, and finish with two things. First, a verdict on whether the analogies were carrying the conclusion all along, or whether a defensible version of it survives once the disanalogies are on the table. Second, if there is a better analogy for what debate is actually doing when the target is an open-ended artifact rather than a single answer, tell me what it is and what it would predict differently.

  Please answer from first principles where the literature does not settle something, and do not cite or name papers: I can look those up myself. Keep the whole answer, both tables included, under 800 words.
reasoning: |-
  Okay, the user works on an AI alignment team focusing on detecting deception by omission in technical documents. Their colleague believes debate can solve this using courtroom and interactive proof system analogies. The user wants these analogies audited specifically for omission cases, not general debate merits.

  First, I need to map each analogy to their oversight pipeline. For the courtroom: advocates are AI debaters, judge is human overseer, evidence is source materials, verdict is document approval, penalty is trust loss. For interactive proofs: Merlin is debater, Arthur is verifier, proof steps are claims, acceptance is approval, penalty is rejection.

  The key concern is whether these analogies hold for omissions. Omissions lack attack surfaces—no false claims to refute. In courtrooms, cross-examination relies on existing evidence; omissions leave no trace. In proofs, tests verify present claims, not absent ones. Both analogies assume verifiable statements, which omissions bypass.

  The user suspects missing elements: a fixed truth, compulsory disclosure, perjury costs in courtrooms; predefined propositions, sound verifiers, constrained provers in proofs. These are critical disanalogies. Without them, debaters can omit crucial points without penalty if the judge doesn't notice.

  Neither analogy adequately handles omissions. Courts require shared facts; proofs need predefined questions. Omissions thrive in open-ended generation where scope isn't fixed. The colleague's conclusions don't survive because the mechanisms (cross-examination, claim testing) can't address what's missing.

  A better analogy might be investigative journalism, where reporters dig for buried facts. But this still relies on human curiosity, which may not scale. For AI oversight, we'd need mechanisms forcing debaters to surface counterevidence proactively, not just reactively. This suggests debate needs augmentation—perhaps with adversarial incentives or scoped search—to handle omissions effectively.
answer: |-
  Here is an audit of the analogies specifically for deception by omission in technical document generation, structured as requested.

  ### 1. Courtroom Analogy Mapping & Critical Disanalogies
  *   **Advocates:** Two AI debaters generating reports/framings.
  *   **Judge:** Human overseer (computationally/technically weak).
  *   **Evidence:** Source materials/data (assumed accessible and complete).
  *   **Verdict:** Acceptance/rejection of the final document.
  *   **Penalty:** Loss of trust/reward (model-centric, not truth-centric).
  *   **Quietly Imported & Missing Elements:**
      *   **Fixed Fact of the Matter:** Reality exists independently and is shared. *(Target: The "truth" is the *complete* relevant context, which is vast, unstructured, and not pre-defined.)*
      *   **Compelled Disclosure:** Discovery rules force sharing *all* relevant evidence. *(Target: No mechanism forces a debater to *volunteer* critical omitted information not directly challenged.)*
      *   **Perjury Penalty Independent of Detection:** Lying under oath carries intrinsic risk. *(Target: Penalty only occurs if the human *detects* the omission during debate.)*
      *   **Shared Frame of Reference:** Both sides argue over the *same* defined incident/charge using *known* evidence. *(Target: Scope of "what's relevant" is open-ended and contested.)*
      *   **Adversarial Equality:** Roughly equal capability/resources to investigate. *(Target: Asymmetric capabilities/strategic omissions possible.)*

  ### 2. Interactive Proof System Analogy Mapping & Critical Disanalogies
  *   **Merlin(s):** AI debater(s) making claims.
  *   **Arthur:** Human verifier (computationally weak).
  *   **Proof Steps:** Individual claims/statements within the document or debate.
  *   **Acceptance:** Final judgment on document correctness.
  *   **Penalty:** Rejection of the proof/document.
  *   **Quietly Imported & Missing Elements:**
      *   **Fully Specified Proposition:** A precise yes/no question or statement to verify. *(Target: Generating an open-ended artifact (document) with ill-defined "completeness").*
      *   **Sound Verifier Tests:** Arthur's checks are perfect oracles for the specific claims tested. *(Target: Human tests (understanding, checking citations) are fallible and resource-intensive.)*
      *   **Constrained Prover:** Merlin answers specific questions truthfully. *(Target: Debaters generate free-form text/framings; omission is *not* answering an unasked "question" about missing info.)*
      *   **Completeness/Soundness Guarantees:** Rely on formal properties of the protocol and problem. *(Target: No formal guarantees for natural language generation about complex reality.)*
      *   **Focus on Present Claims:** Verification checks *stated* claims, not the *absence* of necessary claims.

  ### Do the Conclusions Survive for Omission?
  **No, neither analogy's core mechanism effectively handles omission in this context.**

  *   **The Attack Surface Problem is Fundamental:** Both analogies rely on attacking/verifying *present* claims or evidence.
      *   **Courtroom:** Cross-examination dissects *presented* testimony/evidence. An omission leaves nothing to cross-examine. The opponent cannot "refute" what wasn't said. The judge cannot notice what was never mentioned.
      *   **Proof System:** Tests verify specific *stated* claims ("Is claim X true?"). There is no test for "Is the critical counter-argument Y *absent*?" or "Have all necessary considerations Z been included?".
  *   **Underestimated Resources?**
      *   **Attacking Framing:** An opponent *could* argue the framing is misleading. However, this requires the opponent to *know* the omitted information exists and is critical – a strong, often unrealistic, assumption. If the omission is strategic, the opponent may also be unaware.
      *   **Verifier Testing Absence:** Arthur could ask "Is there any factor that would reverse conclusion C?" This shifts the burden but critically depends on:
          1.  The human knowing *what question to ask* (the key omission might be unforeseen).
          2.  The debater being truthful/comprehensive in that *specific* response (it could omit within the omission, or be overwhelming).
          3.  Human ability to validate the *completeness* of the debater's answer to *that* meta-question (highly non-trivial).

  ### Load-Bearing vs. Decorative Disanalogies
  *   **Load-Bearing (Break the Analogy for Omission):** Fixed Fact/Compelled Disclosure (Courtroom), Fully Specified Proposition/Constrained Prover/Verifier Focus on Present Claims (Proof System). These enable the attack/verification mechanisms that omission bypasses.
  *   **Decorative (Manageable in Principle):** Adversarial Equality (Court), Perjury Penalty (Court - can be approximated), Sound Verifier Tests (Proof - humans are fallible but usable).

  ### Verdict on the Conclusions
  1.  **"Two debaters + weak judge ≈ strong expert" (Courtroom Conclusion):** **Does not survive.** The conclusion relies entirely on the imported elements (fixed fact, compelled disclosure) that provide the attack surface. Omission exploits their absence. Cross-examination fails against silence.
  2.  **"Debate converts generation into verifiable checking" (Proof Conclusion):** **Does not survive.** The guarantee relies on the proposition being fixed and verification focusing on present claims. Verifying the *completeness* of an open-ended artifact is a fundamentally different, harder problem than verifying specific claims or a binary answer. Omission prevents this conversion.

  ### A Better Analogy: Investigative Journalism Review (or Peer Review Under Adversarial Presssure)
  *   **What it is:** Two rival journalists (debaters) are tasked with investigating a complex event and writing reports. An editor (human judge) with limited time reviews their reports *and* their critiques of each other's work.
  *   **Mapping:** Journalists = Debaters, Editor = Judge, Source Material = Evidence, Published Report = Verdict, Loss of Credibility/Assignment = Penalty.
  *   **Predicts Differently:**
      *   Focuses on *unearthing* hidden facts and context, not just refuting stated claims.
      *   Highlights that *finding* the critical omission is the core challenge, often requiring deep investigation (which debaters may lack incentive/time for).
      *   Predicts success depends heavily on the journalists' skill, resources, incentives, and the editor's ability to ask probing meta-questions ("What avenues did you explore and rule out?", "Did you check Source Z?").
      *   Predicts omissions *will* slip through if they are non-obvious, the "rival" is also unaware/unmotivated, or the editor lacks the context to ask the right questions. It frames debate as a heuristic investigative aid, not a verification protocol with guarantees.
      *   **Key for Omission:** It explicitly models the need to *discover* what's missing, which is the crux. However, it also highlights the difficulty and lack of guarantees compared to the original analogies.
