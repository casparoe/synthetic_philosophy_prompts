prompt: |-
  So I'm about 60k into a historical novel — late Roman north Africa — and my POV character is a bishop I made up, Honoratus, who's a rigorist about lying (roughly the absolutist camp people associate with Augustine, though I'm not writing the man himself and Honoratus isn't supposed to be a mouthpiece for him). Problem is I've already written him ruling on a bunch of lying cases in earlier chapters, a beta reader says he's inconsistent, and now I have to write the scene I've been putting off and I can't decide whether he does the thing or not.

  His track record as written so far:

  - Soldiers ask a deacon's wife where a runaway is. She says "I don't know." She does know. Honoratus: that's a sin, and she should have said nothing at all or told them to go to hell instead.
  - A grain merchant tells a ridiculous tall story in a tavern, everybody laughs, nobody believes a word of it. Honoratus: still a lie, but a small one; he lets it go with a prayer.
  - A physician tells a dying man he'll recover. Honoratus: wrong. He makes the physician go back in and tell him the truth.
  - A widow is hiding two fugitives and, asked if they're in her courtyard, says "they are not here" — she means something like "not here in the sense you mean," a mental-reservation sort of move. Honoratus: no. That's a lie. Stop.
  - A man carrying a letter is stopped by a gang looking to kill the person it's addressed to. He refuses to answer, they beat him, he says nothing. Honoratus: this is the right way. You're allowed to not answer.
  - Two chapters back he's facing a mob hunting a tax collector. He doesn't say a word, but he points down the wrong road. I wrote him doing it and then hating himself for a week. I genuinely can't tell if that's consistant with the rest of it, since pointing isn't asserting anything false.

  Here's the scene I owe my editor. The fugitive is a twelve-year-old hiding in the bell tower. The person asking is not a mob and not a murderer: she's the town magistrate, a decent woman doing her job, and she questions him under oath, in the church. He answers in one sentence — something strictly true that she will definately take to mean the boy has gone north. And separately, a few hours before he's questioned, he leaves the tower door unlatched and a lamp burning so it will look like someone bolted out the back.

  So: does he say the line? But more usefully for me, what rule is he actually running? Because I can see at least three that fit all six of those verdicts — (a) never assert what you believe to be false, and everything else is fair game; (b) never give any sign in order to plant a false belief in someone, words or otherwise; (c) never let your words mean something other than what you believe, though what your hands do is a different matter. And maybe a fourth: something about an oath, or about being asked a direct question by someone who has a right to ask, where answering the question as asked matters and not just the literal truth of the sentence.

  Which one does the track record point to, what does each of them predict about the sentence and about the door-and-lamp business, which should I write him as running, and — the part that would be most helpfull — if I want a later chapter to make the rule unmistakable to a reader, what case should I put him in next? One more wrinkle: the novel has a small heretical sect, the Simplices, who hold that every sign is covenantal, so even locking a door is a kind of speech. I'd like to use them but don't want them to be a device that just exists so I can agree with them.

  Sorry, long one. I care less about the verdict than about the shape of the rule — I can write either version of the scene, I just can't write it if I don't know which consistency I'd be breaking.
reasoning: |-
  Okay, the user is writing a historical novel set in late Roman North Africa, featuring a bishop named Honoratus who has a rigorist stance on lying. The user has already written several scenarios where Honoratus judges cases involving deception, and a beta reader pointed out inconsistencies in his rulings. Now, the user needs to write a crucial scene where Honoratus must decide whether to lie under oath to protect a fugitive child. The user is struggling to define the consistent rule Honoratus follows and wants help determining which principle fits the existing cases and how to handle the upcoming scene.

  First, I need to analyze the six cases provided to identify a consistent principle. Let's list them out:

  1. **Deacon's wife case**: She says "I don't know" when she does know. Honoratus says it's a sin; she should have remained silent or refused.
  2. **Grain merchant's tall tale**: No one believes it, but Honoratus still considers it a lie, though minor.
  3. **Physician's false hope**: Telling a dying man he'll recover is wrong; the physician must tell the truth.
  4. **Widow's mental reservation**: She says "they are not here" with hidden meaning. Honoratus rejects this as a lie.
  5. **Man beaten for silence**: Refusing to answer is permissible.
  6. **Pointing the wrong way**: Honoratus does this but feels guilty afterward.

  From these, three possible rules emerge:
  - **Rule A**: Never assert what you believe to be false; silence and actions are acceptable.
  - **Rule B**: Never intend to deceive through any sign (words or actions).
  - **Rule C**: Strict adherence to the literal truth when speaking; actions are separate.

  Rule A seems to fit most cases. The deacon's wife made a false assertion; the grain merchant's story was an assertion, even if unbelievable; the physician's statement was false. The widow's mental reservation is tricky, but Honoratus likely sees it as a false assertion because she intended to deceive. The silent man and pointing incident align with Rule A—silence is allowed, pointing isn't an assertion.

  Rule B is too strict. If Honoratus felt guilty for pointing, it suggests actions count, but he didn't condemn the silent man who indirectly deceived by not answering. Rule C is similar to Rule A but doesn't address actions well. The pointing incident caused guilt, implying actions matter in some contexts.

  The upcoming scene involves two parts: Honoratus making a true statement under oath that misleads and leaving the door unlatched with a lamp to suggest escape. Under Rule A, the true statement is acceptable, but the actions might be problematic. The oath adds weight—lying under oath is worse. However, Rule A allows truthful but misleading statements. The door and lamp could be seen as deception through actions, which might conflict with his guilt over pointing.

  Honoratus's guilt in the pointing scene indicates he's uncomfortable with deceptive actions, even if they aren't verbal assertions. So perhaps Rule A is his stated principle, but he's conflicted about actions. This internal conflict adds depth. In the new scene, he might say the misleading truth under oath (permissible under Rule A) but feel uneasy about the door and lamp, similar to the pointing incident.

  For the next case to clarify the rule, introduce a scenario involving deceptive actions without words, like hiding someone in plain sight. Or contrast with the Simplices sect, who believe all actions are communicative. Honoratus could debate them, reaffirming that only verbal assertions are binding, but his lingering guilt shows his internal struggle.

  The user wants to avoid making the Simplices a mere device. Instead of having Honoratus agree with them, use them to challenge his views, forcing him to articulate his stance and confront his inconsistencies. This adds thematic depth and character development.

  In the current scene, Honoratus should say the misleading truth under oath (allowed by Rule A) but feel conflicted about the door and lamp. Later, when the magistrate discovers the truth, she could confront him, leading to a discussion where he defends his statement as true but struggles to justify his actions. This sets up future development where he might adjust his views or face consequences.

  Key points:
  - Rule A (no false assertions) best fits past cases.
  - Actions cause guilt, showing internal conflict.
  - The oath makes the verbal statement more critical; breaking it would violate his core principle.
  - Use the Simplices to explore the morality of actions vs. words, adding depth without endorsing their view.

  This approach maintains consistency while allowing character growth and thematic exploration.
answer: |-
  This is a fascinating ethical puzzle you've built, and I completely understand why you're stuck—Honoratus's rulings *do* hint at multiple principles, but his guilt over the pointing scene is the key to unlocking his core rule. Let's break this down systematically, based on your existing cases, predict the scene, and design a clarifying future case. Your instincts about the possible rules are sharp—but the evidence points strongly to one interpretation.

  ### The Core Rule: Honoratus's Actual Principle (As Demonstrated)
  Based on his track record, Honoratus operates on **Rule A (Never assert what you believe to be false; silence and non-verbal actions are permissible, but ethically fraught)**. However, he's deeply troubled by *intentional deception* via non-verbal means, even if he technically allows it. This creates internal tension—his intellect clings to the strict boundary of "assertion," but his conscience rebels against the *spirit* of deception. Here's how it fits your cases:

  1.  **Deacon's Wife ("I don't know"):** Violates Rule A. She *asserted* a falsehood (she knew). Silence ("I won't tell you") or refusal ("Go to hell") are non-assertive alternatives.
  2.  **Grain Merchant (Tall Tale):** Violates Rule A. He *asserted* falsehoods, even if no one believed them. Honoratus's leniency likely stems from the *lack of harmful intent* and the social context (jest, not serious communication), but he still labels it a (small) lie.
  3.  **Physician ("He'll recover"):** Violates Rule A. A direct, harmful false *assertion*.
  4.  **Widow ("They are not here"):** Violates Rule A. Honoratus rejects mental reservation. He sees it as an *assertion* of a false proposition ("They are not present on my property"). The intended hidden meaning is irrelevant to the truth-value of the spoken words in the context.
  5.  **Beaten Man (Silence):** **Upholds Rule A.** He made *no assertion*. Refusing to answer is permissible silence.
  6.  **Honoratus Pointing Down the Wrong Road:** **Technically upholds Rule A, but causes guilt.** Pointing is not an *assertion* in the linguistic sense (it doesn't have a truth value like a propositional statement: "The road *is* the way he went"). It's a directive or suggestive action. His guilt stems from the undeniable *intent to deceive* via a non-verbal sign. This exposes the limitation/tension in his rule.

  **The Underlying Tension:** Honoratus adheres rigidly to the *propositional truth of spoken words* as the boundary. Non-verbal acts (silence, pointing, leaving a door open) fall outside the strict definition of "lie" for him. BUT his conscience (perhaps influenced by his faith's emphasis on truthfulness of *heart*) recoils at *intentionally causing false belief*, regardless of the method. The pointing scene shows this conflict vividly.

  ### Predicting the Current Scene: The Fugitive Boy & the Magistrate
  *   **The Oath:** This is critical. An oath before God elevates the act of speaking into a sacred covenant. For Honoratus, violating Rule A under oath would be infinitely worse than a casual lie. He would see it as a direct offense against God.
  *   **The Strictly True Statement:** ("He has gone north" could work if the boy *was* from the north, implying *returned* north; or "He is not within these walls" if he's technically *in* the bell tower structure but not the main *nave* – though this risks mental reservation, which he rejects). **Prediction: He WILL say the technically true sentence.** Why?
      *   It adheres strictly to Rule A: He asserts something he believes to be *literally* true.
      *   The oath makes silence or refusal (his usual "safe" options) impossible without contempt for the magistrate's God-given authority or perjury by omission. He must *answer*.
      *   His intellectual rigorism overrules his discomfort with the *intended deception* in this specific act of speaking. He can justify the *words* as true.
  *   **The Door and Lamp (Non-verbal Deception):** **Prediction: He WILL do this but will feel PROFOUND GUILT/ANGUISH afterward, worse than after the pointing.** Why?
      *   This is pure non-verbal deception, akin to pointing. Rule A technically allows it (no false assertion).
      *   However, the *intent* is crystal clear and premeditated: to plant a *specific* false belief ("He fled out the back"). This is deception via action/sign.
      *   Combined with the verbal evasion under oath, the *totality* of his actions feels like a massive betrayal of his principles, even if each part technically squeaks by Rule A. The guilt should be crushing and potentially paralyzing.
      *   **Consistency:** This perfectly mirrors the pointing scene: action causing deception = technically permissible under his stated rule, but ethically devastating to his conscience. The premeditation and higher stakes (oath, a child's life) amplify the guilt.

  ### Why Rules B & C Don't Fully Fit
  *   **Rule B (No sign to plant false belief):** This would condemn the pointing, the door/lamp, *and potentially the silence* (as the beaten man's silence planted a false belief that he didn't know/have the letter). But Honoratus endorsed the silence. Rule B is too broad for his rulings.
  *   **Rule C (Words must mean what you believe; hands are separate):** This is very close to Rule A, but the widow's case shows he rejects *manipulating* meaning (mental reservation). He demands words mean their plain, contextual truth. His guilt over pointing shows "hands" aren't *entirely* separate ethically for him, even if they are legally distinct under his rule.

  ### The Oath & Authority Wrinkle
  You're right to highlight this. Honoratus likely holds that:
  1.  **Authority + Direct Question:** Creates a stronger obligation to answer truthfully *if* the authority is legitimate and the question is just (within their purview). The magistrate qualifies. Silence/refusal becomes harder to justify morally (though still permissible under Rule A, as with the beaten man facing *unjust* authority/thugs).
  2.  **The Oath:** Transforms the act of speaking into a sacred vow. Violating Rule A under oath is sacrilege. This makes the strictly true statement *imperative* in this scene. Lying under oath is unthinkable; silence under oath might be seen as contempt or evasion of a solemn duty.

  ### How to Write the Scene for Maximum Impact
  1.  **Show the Oath's Weight:** Describe the physical setting of the church, the ritual, the magistrate's solemnity. Honoratus should feel the eyes of God upon him more intensely than ever.
  2.  **The Sentence:** He speaks the technically true sentence clearly, without evasion in his tone. He looks the magistrate in the eye. *Intellectually*, he is clean. He has not *asserted* a falsehood.
  3.  **The Inner Storm:** Contrast the outward calm with inner turmoil. He knows *exactly* how she will interpret it. He feels the sin of *intended deception* warring with the technical correctness of his *words*. The oath amplifies this – is technical truth enough before God when the *intent* is deceit?
  4.  **The Door and Lamp:** Show him doing this *before* the questioning, perhaps rationalizing it as "making escape easier" rather than "deceiving." But afterward, the premeditation hits him. This wasn't passive silence or a panicked point; it was a calculated act of misdirection.
  5.  **The Guilt:** Make it visceral. Physical sickness, inability to pray, perhaps a crisis in his next sermon. The pointing guilt was a tremor; this should feel like an earthquake. He upheld the *letter* of his rule but feels he drowned its *spirit*. The Simplices' teachings might start haunting him.

  ### Designing the Next Case to Cement the Rule
  You need a case that forces Honoratus to explicitly defend Rule A against a challenge, particularly regarding non-verbal deception, and which contrasts with the magistrate scene. **Use the Simplices, but make them the *antithesis*, not the solution.**

  *   **The Case:** A Simplices member (Elpis?) is brought before Honoratus. Elpis helped a runaway slave by:
      *   **Action 1:** Silently shaking his head "no" when the pursuer (a merchant known for brutality) asked if the slave went down a certain alley (the slave *had* gone that way).
      *   **Action 2:** Later, when directly questioned *without oath* by the slave's owner (a generally decent citizen), Elpis remained utterly silent, staring straight ahead, refusing to acknowledge the question.
  *   **The Simplices Defense:** Elpis argues both were lies. Shaking his head was a sign equivalent to "No, he did not go that way," which is false. Silence in response to a direct question is a sign meaning "I do not know" or "I refuse to engage," which, since he *did* know, was also a false sign. He claims even *locking* his door last night was a "true sign" that he desired privacy, whereas leaving it unlocked would have been a "false sign" inviting fellowship he didn't want. He sees *all* intentional communicative acts as bound by truth-telling.
  *   **Honoratus's Ruling (Forcing Clarity):**
      *   **Action 1 (Shaking Head):** "You sinned. You gave a sign intending to convey a false proposition. This is deception, akin to a lie, though not a spoken falsehood. Your conscience rightly troubles you." (This shows his *discomfort* with non-verbal deception, but...)
      *   **Action 2 (Silence):** "Here you did *not* sin. You made no assertion, spoken or gestured. Silence is permissible. Your sect errs grievously. Not every action is a sign carrying propositional truth. Locking a door signifies security, not a statement about your desire for company. To conflate all human action with covenantal speech is to misunderstand both signs and the nature of truth. The obligation not to lie binds our *words*, especially under oath. Our actions are bound by broader charity and justice, but not by the *specific* prohibition against false assertion."
  *   **Why This Works:**
      *   **Clarifies Rule A:** He explicitly defends the boundary: lying = false *assertion* (verbal or clear gestural equivalent). Silence and other non-propositional actions are outside this strict rule, though still subject to moral scrutiny (Charity? Justice? Honesty of *intent*?).
      *   **Highlights His Tension:** Condemning the head shake acknowledges the problematic nature of non-verbal deception that troubled him after pointing and the door/lamp, while stopping short of the Simplices' radical view. His rejection of their "all actions are signs" cements his core distinction.
      *   **Uses the Simplices Effectively:** They aren't a device to agree with; they're the extreme counterpoint that forces him to articulate and defend his *own* nuanced (yet still rigorist) position. They highlight the *tension* he lives with.
      *   **Contrasts with Magistrate Scene:** Here, he's judging *others* on clear-cut cases. In the magistrate scene, he *lived* the ambiguity and suffered the guilt of technically permissible deception. This judicial ruling is his intellectual fortress; the earlier scene was his spiritual battleground.
      *   **Deepens Theme:** It explores the limits of language, signs, and responsibility in communication – core to your setting and his character.

  ### In Summary
  *   **Honoratus's Rule:** Never assert (verbally or by clear equivalent gesture) what you believe to be false. Silence and non-communicative actions are permissible, but *intent to deceive* via any means causes him profound guilt.
  *   **The Scene:** He **WILL** say the technically true sentence under oath (Rule A). He **WILL** leave the door unlatched/lamp burning (Rule A allows it). He **WILL** experience crushing guilt over the *totality* of his deception, especially the premeditated non-verbal part.
  *   **Next Case:** Put him judging a Simplices member who conflates all action with truthful speech. Force him to condemn a deceptive *gesture* (head shake = "no") while defending *silence* and rejecting the idea that mundane actions (like locking a door) are covenantal speech. This crystallizes Rule A and his internal conflict.

  This approach maintains consistency with his past rulings, leverages his guilt over pointing as the key to understanding his character, provides a powerful character moment in the crucial scene, uses the Simplices meaningfully to explore the theme, and sets up a clarifying next step. Now go write that scene – the tension between his intellectual rule and his gnawing conscience is going to be electric!
