prompt: |-
  Hey — I'm a science-and-ideas journalist, fifteen years in, mostly long-form, and a lot of what I actually do is decide who to believe: patients, whistleblowers, community groups with local knowledge, sources inside institutions, the guy who emails the newsroom at 2am. I've absorbed enough of the philosophy to know the vocabulary — testimonial injustice, where a hearer gives a speaker less credibility than they're owed because of some identity-linked prejudice; hermeneutical injustice, where the shared concepts just aren't there yet so the experience can't get said — but I don't want a tour of the literature and I can't check citations anyway. What I want is my own gut sorted out, because my gut is handing down verdicts that I can't fit into one principle.

  Here's where I land (all of these are composites of stories I've actually worked on):

  1. A nurse in a dialysis unit notices a cluster of infections, raises it internally, gets brushed off. Even when I interview her, I notice myself mentally weighting the hospital's statement above hers until I see the raw numbers. That's injustice, and some of it was mine. Definitely one of the clear ones.

  2. I discount press releases from a certain class of company by a fairly fixed factor, because historically they oversell by about that much. Just calibration. Fine, no guilt.

  3. The pair I keep going back and forth on. (i) I have a standing rule: ignore unsolicited technical claims from people with no affiliation I can check, because I get 200 a week and can't verify them. The rule has obvious disparate impact — it favours people with institutional affiliation, which correlates with class, education, country, fluency. I don't feel bad about it. (ii) A community meeting in a town near a smelter, residents describing an illness in their own words; I run roughly the same filter and miss the story for two years. That one I still feel bad about, and I call it injustice. These look like the same move to me — a filtering rule with disparate impact — and I don't know why I acquit one and convict the other.

  4. The mirror image. I once massively over-credited a polished, well-accredited academic talking about a field that wasn't his, mostly because of how he sounded and where he was from. Him? I don't think he was wronged. But the woman who actually knew that field, whom I never called because I already had my expert — her I think I did wrong, and I'm not sure whether that's the same kind of thing or a different animal entirely.

  5. The one that bothers me most, and I'm not sure why. A source in a citizen-science network — a farmer, no institutional backing — gives me the key observation. I believe her completely, I print it, but I attribute the explanation to the university scientist I also called, because I know my readers won't take it from her and I don't have column inches to establish her. I believed her and still took something from her. My gut says this is worse than the cases where I disbelieved someone — but it might just be that it's the one I'm still in a position to keep doing.

  6. Nobody's culprit. Non-English-language research basically never enters my newsroom's verification pipeline; no individual makes a bad credibility judgment; the upshot is that whole bodies of evidence never reach me. Injustice, but I can't locate the hearer.

  7. Not prejudice at all. An engineer flags a safety problem; management discounts him not because of what he is but because believing him costs them. My gut says this is the sharpest item on the list, worse than 1 — and yet it doesn't seem to be what the philosophical term picks out, since there's no identity prejudice in the hearer.

  8. Time travel. I reread my own 2009 coverage of people describing a set of symptoms that didn't get a clinical name for another decade. I didn't have the concept, couldn't have had it. Harm was real, but I don't think I did anything wrong, and I notice I resist calling it injustice — which sits oddly with how readily I say it in 6, where there's also nobody to blame.

  So: is there a principle that gets these, or most of them? I'd like it stated clause by clause with the case that motivates each clause. I want to know honestly which of my verdicts it makes me give up — I suspect 3(i) and 3(ii) can't both survive, and suspect something in the 4-vs-7 comparison has to go too. Whether the harm has to land on someone's standing as a knower, or whether the third-party and distributional stuff in 4 and 6 counts as the same thing. And then two cases I haven't made up my mind about, please: (a) I now deliberately adjust my credence upward for sources from groups that get systematically under-credited — is that repair, or is it a new epistemic sin where I'm managing people rather than trusting them; (b) my newsroom is piloting a tool that scores source reliability from how often past sources with similar profiles panned out — does your principle say anything about it, and if it's fine, is that for the same reason 2 is fine or for a different one?
reasoning: |-
  Okay, let me start by really understanding what this journalist is asking. They've been in the field for fifteen years, dealing with complex credibility judgments daily. They've mentioned concepts like testimonial and hermeneutical injustice but want practical guidance for their gut instincts. The core issue is reconciling their intuitive verdicts on various cases into a coherent principle.

  Looking at their examples, I notice several patterns. Case 1 is straightforward testimonial injustice - undervaluing the nurse due to institutional bias. Case 2 is simple calibration without guilt. But Case 3 is tricky because similar filters (disregarding unaffiliated sources) lead to different feelings of guilt when applied to technical claims versus community observations. Why does one feel like injustice and the other not?

  Case 4 adds another layer: over-crediting a polished academic while under-crediting the actual expert. The harm seems directed at the overlooked woman, not the academic. Case 5 is particularly troubling because the journalist believes the farmer but attributes the insight to a scientist, actively participating in the credibility transfer. That feels worse to them than disbelief.

  Case 6 involves systemic neglect of non-English research - structural injustice without a clear wrongdoer. Case 7 is different: an engineer dismissed due to financial motives rather than identity prejudice. The journalist feels this is particularly egregious. Case 8 deals with hermeneutical injustice where lacking concepts prevented understanding, yet they resist self-blame unlike in Case 6.

  The journalist also raises two practical dilemmas: whether upward adjustment for marginalized groups is legitimate repair or new bias, and whether algorithmic scoring tools are acceptable like their manual calibration in Case 2.

  To build a principle, I need to identify common threads across these cases. The key factors appear to be: the reason for credibility discounting (prejudice vs practical constraints), the presence of harm to the speaker's standing as a knower, systemic vs individual responsibility, and whether the journalist actively participates in the injustice.

  For Case 3, the difference might lie in the nature of the filter - community observations rely on lived experience where affiliation isn't relevant, unlike technical claims requiring verification capacity. Case 7's severity comes from intentional disregard of truth for financial gain. Case 5 feels worse because it's active complicity in credibility stripping.

  The proposed principle should distinguish between justifiable filters and those causing epistemic harm, recognize different types of injustice beyond identity prejudice, and address systemic issues. It must also provide guidance on reparative measures and algorithmic tools, validating their calibration approach while warning about encoded biases.

  This framework should help the journalist align their instincts with ethical consistency, potentially revising their view on Case 3(i) while affirming others. The upward adjustment question can be framed as restorative justice, and the algorithm issue as acceptable only if carefully monitored for bias.
answer: |-
  Here’s a principle distilled from your cases, clause by clause, with motivations and implications for your verdicts. It centers on **epistemic harm** (undermining someone’s ability to contribute knowledge) and **responsibility** (individual or systemic), not just identity prejudice:

  ### The Principle of Epistemic Due Diligence  
  1. **Weigh credibility based on relevance, not proxies** (Motivated by Cases 1, 4, 7)  
     - *Clause*: Discount a source only for reasons *directly relevant* to the claim’s verifiability or their access to evidence (e.g., conflict of interest, track record of inaccuracy, lack of expertise *on this topic*).  
     - *Verdict changes*:  
       - **Case 4 (Over-crediting academic)**: Wrong because "polished/affiliated" ≠ relevant to expertise *in this field*.  
       - **Case 7 (Engineer ignored for cost)**: Sharply wrong (as you felt) – dismissal was due to *financial stakes*, not truth-relevant factors.  
       - *Survives*: Case 2 (discounting hype-prone companies) is fine – track record *is* relevant.  

  2. **Filters must be context-sensitive** (Motivated by Case 3)  
     - *Clause*: Rules like "ignore unaffiliated sources" are unjust when applied to *lived experience* or *local observation* (where affiliation is irrelevant), but defensible for *technical claims requiring verification capacity* (where institutional access may be relevant).  
     - *Verdict changes*:  
       - **Case 3(i) (Ignoring unsolicited tech claims)**: Acquitted – impracticality + verification need makes affiliation a *relevant* proxy.  
       - **Case 3(ii) (Ignoring community illness reports)**: Convicted – lived experience doesn’t require affiliation; filter was context-inappropriate.  
       - *Your guilt in 3(ii) is justified; your lack of guilt in 3(i) is upheld*.  

  3. **Active complicity compounds harm** (Motivated by Case 5)  
     - *Clause*: Actively *transferring* credibility from a marginalized knower to a privileged one (even while believing them) inflicts greater harm than passive disbelief. It reinforces the structural injustice.  
     - *Verdict*: **Case 5 is worse** (as you felt) – you *used* the farmer’s knowledge while *denying her standing*. Harm isn’t just to the story, but to her *as a knower*.  

  4. **Structural gaps require systemic repair** (Motivated by Case 6, 8)  
     - *Clause*: Injustice exists when systems (e.g., editorial processes, language barriers) exclude entire categories of knowledge, *even without a blameworthy individual*. Harm is to the *epistemic commons*, not just individuals.  
     - *Verdict changes*:  
       - **Case 6 (Non-English research)**: Injustice – systemic exclusion.  
       - **Case 8 (2009 coverage)**: *Not injustice by you* – you lacked the *hermeneutic resources*. Harm existed, but you weren’t negligent.  
       - *Resolves your tension*: Case 6 has a culpable *system* (your newsroom’s pipeline); Case 8 had no viable system to access the concept.  

  5. **Prejudice ≠ Identity Alone** (Motivated by Case 7)  
     - *Clause*: "Identity-linked prejudice" (per Fricker) is one cause of testimonial injustice, but *other systemic biases* (e.g., prioritizing institutional convenience, profit) also cause epistemic harm and are equally culpable.  
     - *Verdict*: **Case 7 (Engineer)** *is* testimonial injustice – prejudice against *inconvenient truths* is still a bias corrupting credibility judgment.  

  ---

  ### Resolved Tensions
  - **3(i) vs 3(ii)**: Both survive! Different contexts justify different verdicts under Clause 2.  
  - **4 vs 7**: Case 4 (over-crediting) violates Clause 1; Case 7 (ignoring for cost) violates Clause 1 *and* 5. Case 7’s severity is upheld.  
  - **6 vs 8**: Clarified by Clause 4 – system vs no system.  

  ---

  ### Your Open Questions
  **(a) Upward adjustment for marginalized groups:**  
  - **Verdict**: **Repair, not a sin** – *if* done transparently as counter-balancing systemic bias.  
    - *Why*: Under Clause 1, historical under-crediting *is* a truth-relevant factor (it signals likely undervalued evidence). You’re not "managing people," you’re accounting for *documented distortion* in credibility assessments.  
    - *Caveat*: Do this to *level the field*, not to override specific evidence. E.g., "I weight this community’s observations highly *because* institutions have repeatedly ignored valid concerns."

  **(b) Algorithmic reliability scoring:**  
  - **Verdict**: **Potentially fine, but dangerous** – acceptable only under strict conditions.  
    - *Why*: It *could* be a scalable version of Case 2 (calibration). **Fine if**:  
      - Profiles are based *only* on truth-relevant factors (e.g., past accuracy, conflicts of interest – *not* demographics or institutional status).  
      - It flags *context* (e.g., "reliable on lab studies, not field observations").  
      - Humans override it when lived experience is relevant (Clause 2).  
    - **Not fine if**:  
      - It encodes proxies like "affiliation = reliability," punishing marginalized voices (violating Clause 1).  
      - It replaces case-by-case judgment (violating Clause 2).  

  ---

  ### Core Insight
  Your gut distinguishes **harm to knowledge** from **harm to knowers**. The principle prioritizes:  
  1. **Preventing active harm** (e.g., credibility stripping in Case 5).  
  2. **Fixing systemic exclusion** (e.g., Case 6).  
  3. **Allowing practical filters only when truth-relevant** (e.g., Cases 2, 3i).  
  4. **Naming negligence without hermeneutic resources as non-culpable** (Case 8).  

  This isn’t pure Fricker – it extends "injustice" to structural and non-identity harms (Cases 5,6,7) – but it captures your intuitive ethics: **Beliefs must be earned, but credibility must be deserved.**
