  Writing this from my office between office hours, slightly frazzled. I've been teacing Dennett's user-illusion line in my intro course: consciousness is like a computer desktop, the icons (qualia) look like they're really sitting there in front of you, but only the underlying machinery is, and we mistake the interface for the workings. A sharp student pushed back on me and now I'm stuck on what I've started calling the no-beneficiary problem. Every illusion needs somebody who undergoes it, yes? But if the "user" who is supposedly being fooled is itself part of the illusion — no inner Cartesian theater, just his abstract center-of-narrative-gravity thing — then there is nobody left who is actually being misled, and I don't see how "illusion" is even the right category anymore. Its starts to look like the view either collapses into flat eliminativism (nothing is conscious, full stop, say it and be done with it) or it secretly needs a homunculus after all, which is the thing Dennett spent the whole book attacking. And one related bit I want to use in a tutorial on moral patienthood: if the painfulness of pain is an icon too, what is left to ground the claim that a dog's suffering matters?

