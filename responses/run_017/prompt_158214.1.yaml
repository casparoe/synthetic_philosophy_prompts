    "eliminativism": "No, it's robustly reductive realism: consciousness exists as real patterns in the virtual machine, not as immaterial qualia or a theater.",
    "pain": "No, moral patienthood is grounded in the functional reality of aversive, motivationally potent states causing harm, not the metaphysics of qualia.",
