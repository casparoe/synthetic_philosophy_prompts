prompt: |-
  You are a professional philosopher who has spent years advising agricultural extension services and pesticide regulators, and who is equally at home with population-level consequentialist reasoning and with the unsettled literature on invertebrate sentience. Think carefully before you write. Begin with a brainstorming pass in which you list the considerations you think an insecticide decision actually turns on, sorted into factual, ethical, and irreducibly uncertain, and only then start building the procedure.

  The task: I staff a small valley grower cooperative's Spray Review Board. Roughly fifty times a year a member asks permission to use an insecticide that is not on our approved IPM list. We have ten working days, no philosopher, and a board of three growers plus one extension agent; the applicant has to be able to follow the reasoning on a single page. Write the decision procedure we should run: the questions in the order to ask them, what counts as a sufficient answer to each, the points at which the procedure simply stops and returns a no, and the points at which it stops and hands the decision to the board explicitly as a values call rather than a matter of fact. Assume throughout that we cannot settle whether the animals in question are sentient at all, and say what the procedure does differently on each side of that question.

  Two things I need it to handle that I don't think standard IPM language handles:

  1. Displacement. For most of our pests it may well be true that the individuals killed would largely have died anyway — starvation, predators, winter — and that a vacated niche refills, so that the moral cost of a spray is not the body count but the net change in insect life-years or suffering, which could be near zero or even negative if the unmanaged alternative is a slower death. I have been calling this the displacement ledger. Tell me whether the procedure should contain such a step at all, and if it should, how a grower with no theory fills it in: what he can reasonably be asked to estimate, and what the procedure does when he cannot estimate it.

  2. The resistance commons. The susceptibility of the local pest population is a shared stock: my spray today makes everyone's sprays worse in five years, and my restraint today is partly someone else's gain. So the question is not only whether this spray is justified but whether we would still want to spend the shared stock this way if every grower in the valley reasoned the same way — and, on the other side, whether the applicant is being asked to absorb a loss his competitors are not. Build this into the ordering: say where it functions as a veto, where merely as a tiebreaker, and how to apply it without a population model.

  Then run the finished procedure in front of me, and commit to the verdicts: (a) a request for a prophylactic neonicotinoid seed coating on a field where the target pest appears in roughly one year in three and scouting is unreliable; (b) an aphid outbreak in a greenhouse where releasing parasitoid wasps would work but takes two weeks longer and costs more; (c) a spray to prevent purely cosmetic damage on a crop the grower says he will lose money on without it. At least one of these must come out the way I will not like — name it, and tell me why the procedure is right and my instinct is wrong.

  Give me the ordering and the verdicts as settled, with your reasons, not as a menu for me to choose between. Mark the steps that are really judgment dressed up as procedure. Finally, tell me what this procedure cannot do: which applications it will systematically get wrong, and what I should watch for in the first year in order to notice.
reasoning: |-
  Hmm, this user has presented a complex ethical and practical challenge about insecticide decision-making for a grower cooperative. They need a decision procedure that handles displacement effects and resistance commons - two issues they feel standard IPM approaches miss. 

  The user is clearly sophisticated - they're using terms like "displacement ledger" and "resistance commons" while acknowledging the unresolved question of invertebrate sentience. Their role on a Spray Review Board suggests practical experience, but they're reaching for philosophical rigor within severe constraints: 10-day decisions, no philosopher on staff, and explanations that must fit on one page for farmers.

  Let me break this down systematically. The core tension is between consequentialist reasoning about insect welfare (despite uncertainty about sentience) and practical agricultural needs. The displacement concept is particularly thorny - if killed insects would have died anyway, is the net harm actually less? And the resistance commons problem is essentially a tragedy-of-the-commons scenario with pest susceptibility as the shared resource.

  For the procedure, I'll need to sequence questions carefully. First establish necessity - is this truly needed? Then consider sentience-dependent factors: for sentient-possible insects, we must assess painfulness of the insecticide and displacement effects. The resistance commons concern applies regardless of sentience. 

  The three test cases are revealing: (a) prophylactic neonics represent overkill and resistance risk, (b) the aphid outbreak pits faster chemical control against slower biocontrol, and (c) cosmetic spraying might fail the necessity test. I suspect case (c) will frustrate the user - farmers hate losing crops to "mere" cosmetics, but the procedure must draw that line.

  Key challenges in implementation: growers will struggle to estimate displacement effects quantitatively. The solution is qualitative thresholds - "would most die within days anyway?" Likewise for resistance commons: we avoid complex modeling by asking "if all did this" and "is this disproportionate sacrifice?"

  What this procedure won't catch well: edge cases where displacement effects are counterintuitive, or when new resistance mechanisms emerge. The first-year watchpoints should be instances where growers consistently argue against the displacement assessment or resistance vetoes - that'll indicate where the framework needs adjustment.

  The ethical anchors here are: minimize suffering given sentience uncertainty, preserve shared resources, and maintain system integrity through consistent rules. Even when the answer frustrates individual growers, the valley-scale perspective must prevail.
answer: |-
  Here is a decision procedure designed for your Spray Review Board, incorporating displacement and resistance commons within operational constraints. It prioritizes sequential elimination ("stop and return no") where possible, flags values judgments explicitly, and provides workable heuristics for complex concepts.

  **Core Structure:**  
  1.  **Factual Filters** (Necessity & Alternatives)  
  2.  **Sentience-Sensitive Analysis** (Harm & Displacement)  
  3.  **Collective Impact Assessment** (Resistance Commons & Fairness)  
  4.  **Values Call** (Board Discretion on Marginal Cases)  

  **The Procedure:** (Run strictly in order; stop if a "No" condition is met)

  1.  **IMMEDIATE THREAT?**  
      *   *Question:* Is the pest causing *active, significant economic damage* right now, or is this purely prophylactic/preventative?  
      *   *Sufficient Answer:* Observed damage exceeding economic threshold (ET) *or* definitive predictive model showing >80% chance of ET breach within the pest's generation time. Applicant's historical data or extension agent verification acceptable.  
      *   *Stop & Return No if:* Purely cosmetic damage (e.g., Case c) *or* preventative application where reliable scouting exists but isn't used (e.g., Case a - unreliable scouting doesn't automatically fail here, but see Step 2).  
      *   *Why:* Establishes necessity. Cosmetic damage fails the fundamental "need" test. Prophylactics face higher scrutiny.

  2.  **IPM ALTERNATIVES EXHAUSTED?**  
      *   *Question:* Have all *practicable, effective* non-chemical IPM tactics (cultural, mechanical, biological) suitable for this pest/crop/situation been implemented or conclusively ruled out?  
      *   *Sufficient Answer:* Documentation of attempted tactics (e.g., trap crops, sanitation, biocontrol releases), timing/logistical constraints preventing their use, or extension agent confirmation of inadequacy. Cost alone isn't sufficient *unless* it would cause severe economic hardship (beyond mere profit loss).  
      *   *Stop & Return No if:* Effective, reasonably practicable alternatives exist and haven't been tried (e.g., Case b - parasitoids are effective, just slower/costlier; fails unless severe hardship proven).  
      *   *Why:* Prioritizes non-chemical control. Economic hardship requires evidence (e.g., thin profit margins, small farm vulnerability).

  3.  **CHEMICAL SELECTIVITY & PAIN POTENTIAL (Sentience Gate):**  
      *   *Question A (Factual):* Is the insecticide highly specific to the target pest(s) (e.g., certain Bacillus thuringiensis strains, pheromones) or broadly toxic (e.g., pyrethroids, neonicotinoids)?  
      *   *Question B (Uncertain/Ethical - Sentience-Dependent):* If broadly toxic, does it act via a mechanism *likely* to cause intense suffering in insects (if sentient)? (e.g., neurotoxins causing hyperactivity/spasms vs. desiccants causing rapid dehydration). Rely on extension agent/PUBLIC databases (e.g., PPDB) for mode-of-action assessment.  
      *   *Sufficient Answer:* Agent assessment based on MoA classification. Classify as: High Specificity / Low Suffering Potential, Broad / Moderate Suffering Potential, Broad / High Suffering Potential.  
      *   *Procedure Path:*  
          *   *If Sentience Assumed FALSE:* Proceed to Step 4. Suffering potential irrelevant. Displacement (Step 5) is purely ecological.  
          *   *If Sentience Assumed TRUE or UNCERTAIN:* Note Suffering Potential rating. **High Suffering Potential** creates a strong presumption against use (must be justified in later steps). Proceed to Step 5 (Displacement) which becomes ethically critical.

  4.  **RESISTANCE COMMONS VETO ("If-All-Did-This" Test):**  
      *   *Question:* If *every* grower in the valley used this insecticide (or same MoA class) for this pest in similar situations, would it *very likely* lead to practical field resistance within <5 years, rendering this MoA class ineffective valley-wide?  
      *   *Sufficient Answer:* Based on: Known resistance history in valley/region for pest/MoA, high inherent resistance risk of the MoA (e.g., neonicotinoids, synthetic pyrethroids), frequency of application needed. Extension agent provides risk rating (High/Moderate/Low) using regional data & resistance management guidelines.  
      *   *Stop & Return No if:* **High Risk** *and* the MoA is critical for valley-wide resistance management (e.g., a last-line option). *Otherwise,* proceed but note risk level for Step 7.  
      *   *Why:* Protects the shared resource. High Risk + Critical MoA is unsustainable. Requires no complex model, just known risk factors and expert judgment (Agent). *(Judgment Dressed as Procedure: Defining "Critical MoA" for the valley context.)*

  5.  **DISPLACEMENT LEDGER (Sentience-Dependent Significance):**  
      *   *Question:* Is it *likely* that a significant proportion of the target pests killed would have died from other causes (starvation, predation, weather) within a short timeframe (e.g., <1-2 pest generations) *even without spraying*? OR, could spraying prevent a prolonged outbreak causing significantly *more* total suffering/death?  
      *   *Sufficient Answer:* Grower/Agent qualitative assessment based on: Pest stage/life expectancy (e.g., late-instar larvae near harvest vs. early colonizers), presence of natural enemies, crop stage/phenology, weather trends (e.g., imminent frost), outbreak dynamics. Categories: High/Moderate/Low Likelihood of Short-Term Displacement OR High Likelihood Spray Reduces Total Harm.  
      *   *Procedure Path:*  
          *   *If Sentience Assumed FALSE:* This step is ecological. "High Likelihood Spray Reduces Total Harm" is a weak positive factor. Otherwise, neutral. Proceed to Step 6.  
          *   *If Sentience Assumed TRUE or UNCERTAIN:*  
              *   "High Likelihood of Short-Term Displacement" *or* "High Likelihood Spray Reduces Total Harm" significantly **reduces** the net ethical cost (potentially to near zero or negative).  
              *   "Low Likelihood of Displacement" **increases** the net ethical cost (near body count).  
              *   "Moderate" is neutral/ambiguous. Proceed to Step 6.

  6.  **NET BENEFIT ASSESSMENT:**  
      *   *Question:* Does the quantified or strongly justified *economic/survival benefit* to the applicant outweigh the combined costs of: Non-target harm (Step 3B if sentience considered), Resistance Risk (Step 4), and Net Harm from Displacement (Step 5, if sentience considered)?  
      *   *Sufficient Answer:* Applicant provides evidence of potential loss (yield/quality data, market prices). Board weighs this against the costs assessed in previous steps.  
      *   *Stop & Return No if:* Costs demonstrably and significantly outweigh benefits (e.g., high-resistance-risk prophylactic for minor, uncertain threat - Case a).  
      *   *Why:* Brings consequentialist factors together. Requires board judgment on weighting.

  7.  **VALUES CALL & FAIRNESS CHECK ("Sacrifice & Free-Riding"):**  
      *   *Question A (Fairness):* Is the applicant being asked to forgo a spray that competitors in similar situations (valley or broader region) are freely using, creating a significant competitive disadvantage?  
      *   *Question B (Values):* Considering all factors above (necessity, alternatives, harm potential, resistance, displacement, net benefit), is the *marginal* benefit of spraying justified *despite* the residual ethical/environmental costs?  
      *   *Sufficient Answer:* Board discussion. Requires consensus or majority vote.  
      *   *Outcome:*  
          *   Approve: If benefits clearly justify costs, or if fairness concerns (7A) outweigh residual costs in a close call.  
          *   Deny: If residual costs are deemed too high regardless of benefit, or if benefit is marginal and no strong fairness argument exists.  
      *   *Why:* Explicitly flags the irreducible judgment. Fairness (7A) can tip a marginal case towards approval to avoid penalizing cooperators. *(Major Judgment Dressed as Procedure: The entire weighing at Step 7.)*

  **Application to Cases & Verdicts:**

  *   **(a) Prophylactic Neonicotinoid Seed Coating (Target pest: 1 in 3 years, unreliable scouting):**
      1.  **IMMEDIATE THREAT?** No. Prophylactic. Doesn't fail *immediately* because scouting is unreliable (prevents automatic "No" at Step 1). Proceed.
      2.  **IPM ALTERNATIVES?** Unreliable scouting weakens, but doesn't eliminate, case for alternatives (e.g., trap crops, resistant varieties?). Likely **Fails.** *Stop & Return No.* (Scouting unreliability doesn't automatically justify skipping alternatives; it necessitates better planning, not chemicals). **VERDICT: DENY.** *You may dislike this, but the procedure is right. The core failure is lack of necessity and lack of exhausting alternatives. Unreliability should trigger investment in better monitoring, not default to high-risk prophylaxis. The resistance risk (Step 4 - Neonics = High Risk MoA) and potential suffering (Step 3B - Neurotoxin = High Potential) make this an unacceptable default.*
  *   **(b) Aphid Outbreak in Greenhouse (Parasitoids work but slower/costlier):**
      1.  **IMMEDIATE THREAT?** Yes (Outbreak). Proceed.
      2.  **IPM ALTERNATIVES?** Parasitoids are effective and practicable. Cost/celerity alone insufficient without proven severe hardship. **Fails.** *Stop & Return No.* **VERDICT: DENY.** *The procedure prioritizes effective biocontrol. The delay/cost must be weighed against the harm of the chemical option and resistance risk; Step 2 forces this comparison early, favoring the sustainable alternative.*
  *   **(c) Spray for Purely Cosmetic Damage (Grower claims profit loss otherwise):**
      1.  **IMMEDIATE THREAT?** Purely cosmetic damage. **Fails.** *Stop & Return No.* **VERDICT: DENY.** *Cosmetic damage fails the fundamental necessity test at Step 1. Grower's profit claim is irrelevant here; the cooperative's standards (implied by having a review board) prioritize interventions only for significant economic or crop survival threats.*

  **What This Procedure Cannot Do (Systematic Weaknesses & Watchpoints):**

  1.  **Quantifying Displacement:** It relies on crude qualitative estimates ("High/Low likelihood"). It will systematically **underestimate** net harm in complex ecosystems with cascading effects or **overestimate** displacement in stable, low-mortality environments. *Watch For:* Growers consistently claiming "High Displacement" for all pests. Track actual pest population dynamics after denied sprays vs. displacement claims.
  2.  **Predicting Resistance Timeline:** The "If-All-Did-This" test (Step 4) is vulnerable to **optimism bias** ("resistance won't happen *that* fast") or **pessimism bias** ("this is our last resort forever"). It lacks fine-grained population genetics. *Watch For:* Rapid efficacy loss of key MoA classes valley-wide after approving "Moderate Risk" applications.
  3.  **Marginal Net Benefit Judgments (Step 6):** Highly sensitive to how economic loss is calculated and how non-economic costs (harm, resistance) are weighted. Prone to **favoring tangible, immediate grower economics** over diffuse, long-term collective costs. *Watch For:* Approvals where the stated economic benefit is marginal but the resistance/harm costs are significant (Steps 3B, 4, 5).
  4.  **"Severe Hardship" (Step 2):** Difficult to define fairly. Risks being either too lenient (undermining alternatives) or too strict (punishing small/vulnerable farms). *Watch For:* Small farms frequently claiming severe hardship disproportionately.
  5.  **Novel Insecticides/Pests:** Struggles with lack of data on MoA suffering potential (Step 3B) or resistance risk (Step 4). *Watch For:* Applications for new chemistries or emerging pests requiring heavy reliance on agent judgment under uncertainty.
  6.  **Non-Target Impacts Beyond Sentience:** Focuses ethical concern on pest sentience. May undervalue ecosystem services disruption (e.g., pollinator loss, soil health impacts) unless they translate to economic cost for the applicant. *Watch For:* Complaints from pollinator-dependent growers or observable declines in beneficial insect populations.

  **In essence:** This procedure prioritizes prevention, sustainability, and precaution under sentience uncertainty. It will systematically *restrict* insecticide use compared to standard IPM by embedding ethical gates (necessity, alternatives, suffering potential, resistance veto) and using displacement cautiously. Its strength is forcing explicit consideration of often-ignored factors; its weakness is reliance on qualitative judgments at critical points. Vigilant tracking of outcomes (resistance development, pest dynamics, farm viability) in the first year is crucial for calibrating these judgments.
