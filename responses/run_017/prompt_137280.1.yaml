     **Product Certification Decision Procedure**

     **Inputs**: 
        - Product sample
        - Test protocol (standard)
        - Intended use description
        - Marketing claims (for alignment)

     **Steps**:

     1. **Align Test with Intended Use**:
          - Compare the test protocol (number of cycles, environmental conditions, etc.) with the intended use.
          - If the test protocol exceeds the intended use, note that any failure beyond intended use may not be a failure of the product for its intended purpose, but if the standard requires it, we must follow the standard. If the product fails within the intended use, it fails. If it fails only beyond intended use, then we note that the product met the intended use but failed the standard. This requires handover to an engineer for risk assessment: is the standard's margin appropriate?
          - If the test protocol does not cover the intended use (e.g., fewer cycles), then we cannot certify without modifying the test.

     2. **Define Manifestation (M) and Trigger (T)**:
          - Clearly state what we are testing for and under what conditions. This should be from the standard.

     3. **Assess Test Conditions Representativeness**:
          - List the differences between test conditions and field conditions.
          - For each difference, ask: 
              a. Could this difference make the test easier than the field, leading to a false pass? (Critical: if yes, we must not certify without adjusting the test.)
              b. Could this difference make the test harder than the field, leading to a false fail? (If yes, we may need to adjust the test or note the possibility of a false fail.)

     4. **Fink Check**:
          - Does the test process cause the product to lose the disposition within the intended use period? 
              - If yes, then the product fails.

     5. **False Pass Check (Safety Critical)**:
          - Could the test result be a false pass? Consider:
              - For a hazard-preventing disposition (e.g., child-resistance): is there anything in the test that might prevent the hazard from occurring even if the product is not safe? (e.g., a test artifact that makes the product appear safe when it isn't).
              - For a hazard-detecting disposition (e.g., smoke alarm): is there anything in the test that might cause the desired manifestation (alarm sounds) for reasons that wouldn't occur in the field? (e.g., the test chamber has a feature that sets off the alarm unrelated to smoke).
          - If we cannot rule out a false pass, then we must not certify.

     6. **False Fail Check**:
          - Could the test result be a false fail? Consider:
              - For a hazard-preventing disposition: is there anything in the test that might cause the hazard to occur even if the product is safe? (e.g., the test apparatus is overly aggressive).
              - For a hazard-detecting disposition: is there anything in the test that might prevent the manifestation even if the product is functional? (e.g., the test smoke is blocked from reaching the alarm).
          - If we suspect a false fail, then the test is inconclusive. We may need to rerun the test if time and sample allow. If not, we fail the product? Or hand over to an engineer: they might decide to pass based on other evidence? But we are constrained by the test.

     7. **Certification Wording**:
          - If the product passes, we must word the certificate to reflect the actual conditions of the test and any limitations found in step 3 (e.g., "waterproof when tested under conditions X" rather than "waterproof" in all conditions).

     **Outputs**:
        - Pass: with specific wording for the certificate.
        - Fail: with reasons.
        - Inconclusive: handover to staff engineer for risk assessment.

     Now, apply to the cases:

     **Case (a) Pill bottle**:
          Step 1: Test protocol requires 100 cycles, intended use is 60. The product fails at some point between 1 and 100. We don't know when, but we observe failure at 100. Since the standard requires 100 cycles, we fail.
          Step 4: Fink: The test wears the closure, and it fails -> so we fail.
          Step 5: False pass: We don't have evidence of a false pass, but we failed anyway.
          Verdict: Fail.

     **Case (b) Smoke alarm**:
          Step 3: Test conditions not representative (without cover). The field has cover. This difference might make the test easier (false pass risk).
          Step 5: False pass check: The alarm passed the test (without cover) but might fail in the field (with cover). We cannot rule out false pass -> do not certify.
          Verdict: Not certified.

     **Case (c) Budget bike lock**:
          Step 3: Test conditions not representative (with grease). The field use is without grease. This makes the test easier (false pass risk).
          Step 5: False pass: The test passed because of the grease, but without grease it might fail. We cannot rule out false pass -> do not certify.
          For the premium lock: same issue (tested with sleeve, field use might be without sleeve). We cannot rule out false pass -> do not certify.

          What would have to change for the premium lock to be certifiable again?
              - Test the lock without the removable sleeve. If it passes without the sleeve, then we can certify.

     **What the procedure cannot settle**:
          - The procedure cannot define what level of protection is "child-resistant" or "waterproof". It requires standards to define the exact test conditions and pass/fail criteria.
          - It cannot handle products that change over time in unpredictable ways (e.g., materials that degrade differently in different environments).
          - It may misfire when the product's performance depends on complex interactions that our tests don't capture (e.g., a product that is safe when used as directed but not when misused, and misuse is common).
          - It relies on the accuracy of the intended use description. If the intended use is not well-defined, the procedure may fail.

     We must hand over to a person when:
          - The test protocol and intended use are misaligned and we are not sure if the standard's margin is appropriate.
          - We have inconclusive results due to suspected false fails and we cannot rerun the test.
          - We need to interpret vague terms in the standard.
          - We need to decide on the wording of the certificate when the disposition holds only for a subset of the marketing claims.

     The procedure will flag these issues for human judgment.
