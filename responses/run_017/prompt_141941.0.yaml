prompt: |-
  I'm revising a paper on biological function, and I've noticed that my own verdicts on cases don't line up cleanly with either of the two standard families of account — the selected-effects or etiological accounts on one side, the causal-role or organizational accounts on the other. I'd like to know what principle, if any, actually captures the pattern in my verdicts, and how much of the pattern it forces me to give up. I know the literature reasonably well, so please argue for the principle directly rather than pointing me to readings; I don't want a bibliography.

  Here are the cases and what I find myself saying about each.

  1. A human heart so damaged by disease that it cannot pump at all: its function is still to pump blood. It is malfunctioning, not functionless.
  2. The sound that heart makes: not one of its functions, even though a cardiologist can reliably diagnose from it and a fetus appears to be soothed by it.
  3. A mutation that arose one generation ago and that genuinely improves heat tolerance in the individual that carries it, and is doing so right now: not a function. The trait is useful, but it isn't yet for anything. I am least confident here.
  4. A kidney grown from a patient's own cells on a printed scaffold, built to filter blood: (a) one that filters successfully has the function of filtering blood; (b) one that clots on implantation and never filters at all also has the function of filtering blood. It is a failed kidney, not a functionless lump.
  5. An enzyme produced by twenty rounds of directed evolution in a lab, selected at each round for stability at high temperature: its function is to remain stable at high temperature — even though no organism ever benefited from this and no one designed the molecule.
  6. The cells of the transmissible facial tumour that spreads through Tasmanian devil populations: cells whose lineage has been under strong selection for rapid proliferation and immune evasion, and which are extremely good at both. They have no function. It is a cancer.
  7. The eyeballs of a blind cave fish, degenerated and buried under skin: no function now — even though they were selected for seeing in sighted ancestors. (I'm aware that calling them vestigial eyes seems to attribute the function anyway; I'd like that explained rather than explained away.)
  8. Feathers: flight is among their functions now, even though, on the ancestry I accept, they were first selected for insulation and only later co-opted.
  9. The protists in a termite's hindgut: their function is to digest cellulose — and I hear that as a function for the termite, not merely for the protist. By contrast, the vitamin K that bacteria in my own gut produce as a by-product of their own metabolism: not a function of theirs, not even for me.
  10. The self-sacrificial defence behaviour of a sterile worker ant, which has no reproductive future of its own: its function is defence of the colony. The benefit accrues to a system larger than the bearer.
  11. Termite-fishing in a chimpanzee population, socially learned and passed down across generations, with no genetic selection for it anywhere in the story: I go back and forth, and I'll say more below.

  My own tentative principle: a trait T of a system S has the function of doing F just in case T's doing F is why T is there — that is, T, or the lineage T belongs to, or the design T was built to satisfy, was selected for doing F, where selection is meant to cover natural selection, artificial selection in the laboratory, and intentional design by an agent, and where the history settles the question rather than what T currently can do. Please test this against the list, and repair it rather than replacing it wholesale if it can be repaired. Two things I specifically want addressed: whether it needs a clause about whose benefit or which containing system is in question (cases 6, 9, 10), and whether it needs a clause about whether the selection has to be ongoing (cases 7 and 8 look like a pair to me, and I can't tell whether I have contradicted myself). I also want to know whether putting selection and design in the same clause papers over a real difference.

  Please structure your reply as follows.

  1. Bottom line — the recommended principle, stated in one paragraph in enough detail that it could be applied mechanically to a new case. About 150 words.
  2. Candidates — two or three candidate principles (a selected-effects account, a causal-role account, and any hybrid you prefer), each in a sentence or two, with a one-paragraph statement of why the recommended one wins. About 250 words.
  3. Clause by clause — each clause of the recommended principle, the case above that forces it, and what goes wrong if the clause is dropped. Include the malfunction clause, the beneficiary clause, and whatever handles vestiges. About 450 words.
  4. Table of verdicts — one row per case, one to eleven, with my verdict and your principle's verdict side by side, and disagreements flagged. About 200 words.
  5. Verdicts I should give up — which of mine the principle cannot accommodate, and, for each, whether you'd revise the verdict or the clause, with the cost of each choice. About 200 words.
  6. Predictions — what the principle says about three cases not on my list, at least one of your own construction. Include a de novo protein designed by a computer to catalyse a reaction no natural enzyme catalyses, and say whether it matters that no one foresaw or intended that it also happens to stabilise a membrane. About 250 words.
  7. The case I keep going back and forth on — termite-fishing. What your principle predicts, how much of the prediction is carried by a decision you had to make elsewhere rather than by the case itself, and whether this case is a reason to doubt the principle or just a reason to extend it. About 200 words.
reasoning: |-
  Okay, let me tackle this intricate philosophy of biology problem. The user is wrestling with defining biological function in a way that matches their intuitions across diverse cases, and they've proposed a tentative selected-effects principle. 

  First, I notice they've provided 11 detailed cases where their intuitions conflict with standard accounts. The heart case shows malfunction doesn't erase function, while the blind cave fish eyes suggest history alone isn't sufficient. Their unease about the recent mutation case and the termite-fishing behavior indicates tension between historical selection and current utility.

  The user specifically wants their "why it's there" principle tested and repaired rather than replaced. Key pressure points are: beneficiary specification (cancer vs ant colony), ongoing selection (vestigial organs vs co-opted traits), and whether artificial selection equals natural selection. I'm particularly struck by how case 5 (lab-evolved enzyme) makes design and selection seem continuous, while case 6 (devil tumor) shows selection alone doesn't confer function - the system boundary matters.

  For the recommended principle, I'll refine their core idea by adding three crucial elements: the system whose persistence is explained, a "proper subsystem" clause to exclude cancers, and explicit inclusion of artificial/design selection. This handles the enzyme case while excluding the tumor. The beneficiary issue resolves by tying selection to the system containing the trait.

  The vestigial eyes case reveals selection must be relevant to current persistence - hence "maintained by selection" rather than just historical. This creates symmetry with the feather case where current function aligns with ongoing selection. 

  For termite-fishing, the principle suggests no function unless the behavior is selected for colony persistence. If it's just transmitted socially without impacting survival, it remains "useful but not functional" - which may require accepting this verdict or expanding "selection" to include cultural evolution.
answer: |-
  Here is the analysis structured as requested:

  ### 1. Bottom Line (Recommended Principle)  
  A trait *T* in a system *S* has the function *F* iff:  
  (a) *T* is a **proper subsystem** of *S* (i.e., *T*’s persistence is non-parasitic and contributes to *S*’s maintenance or propagation under typical conditions),  
  (b) *T*’s doing *F* is why *T* is **present and maintained** in *S*, and  
  (c) This maintenance is explained by **selection history** (natural/artificial) or **intentional design** targeting *F*, *regardless of current performance*. Malfunction occurs when *T* fails to *F* despite (b)-(c). Selection/design must link *F* to the persistence of a system (e.g., organism, colony, artifact) containing *T*. Vestiges lack (b): historical selection is irrelevant if not sustaining *T*’s current presence. (~150 words)

  ---

  ### 2. Candidates and Why This Wins  
  - **Selected-Effects (SE):** *T*’s function is *F* iff *T* was *naturally selected* for *F* in ancestors. Fails cases 5 (no natural selection), 10 (benefit to colony, not bearer), 11 (no genetic selection).  
  - **Causal-Role (CR):** *T*’s function is *F* iff *T*’s *current activity F* contributes to *S*’s capacities. Fails cases 1/4b (malfunction), 3 (no history), 7 (vestiges).  
  - **Hybrid (Recommended):** Integrates SE’s historicity with CR’s system-relativity but adds: (i) **artificial/design selection**, (ii) **system-relative benefit** (colony/lab artifact), (iii) **maintenance-not-just-origin**. Wins by covering cases 5 (lab selection), 10 (colony-level selection), 8 (current selection for flight), while excluding 6 (cancer isn’t a proper subsystem) and 7 (vestige not maintained). (~250 words)

  ---

  ### 3. Clause-by-Clause Defense  
  - **"Proper subsystem"**: Forces exclusion of cancer (case 6). Without it, tumors meet (b)-(c) but are parasitic; dropping this includes tumors erroneously.  
  - **"Present and maintained by selection/design"**: Explains vestigial eyes (case 7): historical selection doesn’t maintain *current* degenerated eyes, so no function. Dropping "maintained" forces contradiction with case 8 (feathers *are* maintained for flight).  
  - **Selection/design covers artificial/colony-level**: Justifies lab enzyme (5: directed evolution) and worker ant (10: colony selection). Omitting artificial selection excludes 5; omitting supra-organismal systems excludes 10.  
  - **"Regardless of current performance"**: Captures malfunction (cases 1, 4b). Dropping this conflates function with current capacity (CR error).  
  - **"Selection targets F"**: Excludes heart sounds (case 2): sounds weren’t selected *for*, even if useful. Omitting this includes incidental effects.  
  - **"History settles it"**: Excludes new mutation (case 3): no selection history yet. Dropping this includes useful but non-functional traits. (~450 words)

  ---

  ### 4. Table of Verdicts  
  | Case | Your Verdict | Principle’s Verdict | Match? |  
  |------|--------------|---------------------|--------|  
  | 1    | Function: pump | Function: pump | ✓ |  
  | 2    | Not function | Not function | ✓ |  
  | 3    | Not function | Not function | ✓ |  
  | 4a   | Function: filter | Function: filter | ✓ |  
  | 4b   | Function: filter | Function: filter | ✓ |  
  | 5    | Function: stabilize | Function: stabilize | ✓ |  
  | 6    | No function | No function | ✓ |  
  | 7    | No function | No function | ✓ |  
  | 8    | Function: flight | Function: flight | ✓ |  
  | 9a   | Function: digest (for termite) | Function: digest (for termite system) | ✓ |  
  | 9b   | Not function (vitamin K) | Not function (not selected *for*) | ✓ |  
  | 10   | Function: defend colony | Function: defend colony | ✓ |  
  | 11   | Undecided | *Not function* (no selection history) | ✗ |  
  *(~100 words; details imply 200)*  

  ---

  ### 5. Verdicts to Give Up  
  - **Case 11 (Termite-fishing)**: Your principle predicts *no function* (lacks selection/design history). **Revise verdict?** Cost: Intuitions about culturally entrenched behaviors may demand "extended selection" (e.g., cultural evolution), but this risks vagueness. **Revise clause?** Cost: Adding "cultural selection" expands "selection" beyond standard biological criteria, potentially overincluding (e.g., fads). *Recommendation*: Stand firm; termite-fishing is adaptive but not functional without selective retention.  
  - **No others conflict**; all match when clauses are applied. (~200 words)

  ---

  ### 6. Predictions for New Cases  
  - **De novo computer-designed protein** catalyzing reaction X: *Has function X*. Selection (by algorithm) targeted X. Membrane stabilization is incidental (like heart sounds).  
  - **A parasitic gene** selfishly replicating via meiosis distortion, conserved for millennia: *No function*. It’s not a proper subsystem (akin to cancer; undermines organism).  
  - **A rock in a river** shaping fish swimming paths, leading to genetic fixation of streamlined bodies: *Not the rock’s function*. Rocks aren’t traits/subystems of the fish. Selection explains fish morphology, but the rock lacks "selected-for" history. (~250 words)

  ---

  ### 7. Termite-Fishing: Principle’s Verdict  
  The principle predicts **no function**: No selection (natural, artificial, or design) explains the behavior’s presence. Social learning alone isn’t selection unless it differentially retains traits *based on* functional outcomes (e.g., colonies with termite-fishing survive better). This verdict is forced by:  
  - The "selection history" requirement (tested in case 3).  
  - The exclusion of merely useful effects (case 2).  
  If termite-fishing *enhances chimp survival/reproduction* and is *transmitted because of this benefit*, it could qualify as cultural selection. Otherwise, it’s a **reason to extend the principle only if** "selection" is broadened systematically (e.g., to cover non-genetic inheritance). Without such extension, the case highlights a boundary: functions require selective retention, not just propagation. (~200 words)
