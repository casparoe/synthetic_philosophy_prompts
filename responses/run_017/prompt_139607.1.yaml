  We are drafting a joint statement for two philosophers who have been arguing about the new riddle of induction (Goodman's grue problem). We have two sides: Side A (projectibility-first) and Side B (prior-first). They also need to address two variants: the law-grue variant and the symmetric-entrenchment case.

  The task has three parts:
  (i) A numbered section of claims both can sign.
  (ii) A disagreements table with each residual disagreement stated twice (once from each side's wording).
  (iii) The cruxes: sub-questions that would move at least one side if settled, with the case/argument/evidence both accept, and each side's prediction.

  Additionally, we must identify any merely verbal disputes and keep them out of the table.

  Let's start by identifying common ground and then the disagreements.

  Common Ground (for the joint statement):
  1. The grue case is a thought experiment that challenges how we justify inductive inferences.
  2. Both sides agree that the grue hypothesis is coherent and that we do not project it in practice.
  3. Both sides accept that in the law-grue variant, some time-sliced laws are taken seriously (e.g., phase transitions) but most are not, and that we need to explain why.
  4. Both sides accept that in the symmetric-entrenchment case, the community's entrenched predicates are grue and bleen, so that the entrenchment criterion does not favor green/blue over grue/bleen in that community.
  5. Both sides agree that the new riddle is independent of Hume's old riddle in the following sense: Hume's problem is about justifying induction in general (the problem of induction from experience to generalizations), while Goodman's riddle is about discriminating between competing hypotheses that are equally compatible with the evidence (the problem of projectibility).
  6. Both sides agree that the puzzle involves aspects of language (how predicates are defined and used), metaphysics (the structure of the world), and rationality (how we ought to reason).

  Joint Statement (i) - Numbered Claims:

  1. The grue case, as formulated by Goodman, shows that not all predicates can be projected in inductive inference, and that without some constraint, we would be unable to justify why we project 'green' rather than 'grue'.
  2. The grue case does not show that induction is impossible, but rather that it requires additional constraints beyond mere consistency with evidence.
  3. The puzzle raised by the grue case is not solely about language, because even if we fix the language (as in the symmetric-entrenchment case), the question of which predicates to project remains. It is also about metaphysics (what the world is like) and rationality (how we should reason about the world).
  4. The new riddle is independent of Hume's old riddle: Hume's problem concerns whether we can justify induction at all, while Goodman's problem concerns how to choose among hypotheses that are equally supported by evidence if we allow arbitrary predicates. Thus, solving Hume's problem (if possible) would not automatically solve Goodman's riddle.
  5. In the law-grue variant, we acknowledge that some time-sliced laws (e.g., laws describing phase transitions at critical temperatures or times) are scientifically acceptable, while most are not. The challenge is to explain what makes some time-sliced laws acceptable and others not.
  6. In the symmetric-entrenchment case, we agree that if a community's entrenched predicates are grue and bleen, then by the criterion of entrenchment alone, the grue hypothesis would be as projectible as the green hypothesis is in our community. This shows that entrenchment is relative to a linguistic community and its history of projection.

  Disagreements Table (ii):

  We must express each residual disagreement twice: once in wording that Side A would accept for their position, and once in wording that Side B would accept for their position.

  Key Disagreements:

  1. On the nature of the constraint for projectibility:
     - Side A: Inductive inference requires a substantive, non-formal constraint on projectibility that must appeal to naturalness, causal structure, or something beyond the prior probability distribution.
     - Side B: The constraint is fully captured within the prior probability distribution, which can account for projectibility via considerations of simplicity and informativeness without needing additional substantive constraints.

  2. On the role of entrenchment:
     - Side A: Entrenchment is a symptom of a deeper feature (like naturalness) and cannot be the whole story because it is relative to community (as shown by the symmetric case). Therefore, it must be grounded in something objective.
     - Side B: Entrenchment is simply a feature of the prior, reflecting the history of the agent or community, and there is no need for an objective grounding beyond that.

  3. On the status of the grue hypothesis:
     - Side A: The grue hypothesis is not on a par with the green hypothesis because it is gerrymandered and non-natural, and this is a reason to assign it a low prior, but that assignment itself must be justified by something beyond the prior (like naturalness).
     - Side B: The grue hypothesis is coherent but disfavored by our prior because it is more complex and less informative. This is a matter of our subjective probability assignment and does not require further justification.

  4. On the law-grue variant:
     - Side A: The reason some time-sliced laws are acceptable is that they correspond to genuine natural discontinuities (e.g., phase transitions) which are part of the causal structure of the world, not merely because they are simple in the prior.
     - Side B: The reason some time-sliced laws are acceptable is that they are simpler and more informative given the rest of our scientific knowledge, and this is reflected in the prior.

  5. On the symmetric-entrenchment case:
     - Side A: Even in the symmetric-entrenchment case, the community using grue and bleen as primitive would be making a mistake because their predicates do not carve nature at the joints, and they would have a harder time forming a coherent and simple science.
     - Side B: In the symmetric-entrenchment case, the community using grue and bleen would have a prior that favors grue projection, and that is all there is to say; there is no objective mistake because projectibility is relative to the prior.

  Now, we structure the table:

  | Disagreement Topic | Side A's Wording (acceptable to A) | Side B's Wording (acceptable to B) |
  |-------------------|-----------------------------------|-----------------------------------|
  | Nature of constraint | The solution to the grue problem requires a substantive constraint on projectibility that cannot be reduced to the prior, but must appeal to naturalness or causal structure. | The solution to the grue problem is entirely a matter of having a prior that assigns low probability to hypotheses using gerrymandered predicates, which is justified by considerations of simplicity and informativeness without appeal to naturalness or causal structure. |
  | Role of entrenchment | Entrenchment is an indicator of projectibility because it correlates with naturalness, but it cannot be the fundamental basis because it is relative to community; the fundamental basis must be objective. | Entrenchment is a feature of the prior, reflecting the agent's history of projections, and does not require an objective basis in naturalness. |
  | Status of grue hypothesis | The grue hypothesis is inherently non-projectible because it is gerrymandered and non-natural, and this is why we assign it a low prior; the assignment of the prior must be justified by an objective feature. | The grue hypothesis is coherent but disfavored by our prior because it is complex and less informative; no further justification for the prior is required. |
  | Law-grue variant | The acceptability of some time-sliced laws (like phase transitions) is due to their reflecting genuine natural discontinuities in causal structure, not merely their simplicity in a prior. | The acceptability of some time-sliced laws is due to their being simpler and more informative given our scientific knowledge, which is captured by the prior. |
  | Symmetric-entrenchment case | In the symmetric-entrenchment case, the community using grue and bleen as primitives would be using predicates that do not match the natural structure of the world, leading to a less effective science. | In the symmetric-entrenchment case, the community using grue and bleen as primitives would have a prior that favors grue, and that is sufficient for their inductive practices; there is no objective sense in which their science is less effective. |

  Cruxes (iii):

  We need to identify sub-questions (cruxes) that, if settled, would move at least one side. For each, we give a case, argument, or piece of evidence both accept as bearing on it, and each side's prediction.

  1. Crux: Does the symmetric-entrenchment community have a less effective science?
     - Case/Evidence: Consider a thought experiment in which both communities (our green/blue community and the grue/bleen community) develop science over time. We can simulate their scientific theories and see which one achieves greater predictive accuracy, simplicity, and unification in the long run, especially when dealing with new phenomena not previously encountered.
     - Side A Prediction: The grue/bleen community will have a less effective science because their predicates are gerrymandered and do not align with natural properties, leading to more complex and disunified laws.
     - Side B Prediction: Both communities will do equally well because the prior is adapted to their language, and they can both achieve high predictive accuracy and simplicity within their own frameworks.

  2. Crux: Is there an objective measure of naturalness that correlates with projectibility?
     - Case/Evidence: Look at the history of science and see if there are cases where predicates that were once entrenched but later abandoned (like phlogiston) were replaced by predicates that are now considered more natural (like oxygen). Also, consider if there is a correlation between the naturalness of a predicate (as judged by current science) and its success in projectibility.
     - Side A Prediction: We will find that successful predicates in science are those that correspond to natural properties (as per current physics, chemistry, etc.), and that these are the ones that are projectible. The grue-like predicates (if they appear) are quickly abandoned because they lead to poor predictions.
     - Side B Prediction: The success of a predicate is a matter of how well it fits into a simple and informative theory, and there is no independent measure of naturalness that is not already captured by simplicity and informativeness.

  3. Crux: Can the prior account for the difference between acceptable and unacceptable time-sliced laws without appealing to naturalness?
     - Case/Evidence: Consider a specific example: the law of radioactive decay. The decay rate is constant over time (exponential decay). Now, consider a time-sliced variant: the decay rate changes abruptly at a specific time T. Why do we reject such a hypothesis unless there is evidence of a change? Also, consider phase transitions (like water boiling at 100°C) which are accepted time-sliced laws.
     - Side A Argument: The accepted time-sliced laws (like phase transitions) are tied to a change in the causal structure (e.g., temperature reaching a critical point) and hence are natural. The decay rate change without any underlying cause is unnatural and thus rejected.
     - Side B Argument: The decay rate change without evidence is more complex (it adds an extra parameter) and less informative (it doesn't connect to other laws) so the prior assigns it low probability. The phase transition is simpler in context because it is a known mechanism and fits with other laws (thermodynamics).
     - Evidence: Both sides can look at how scientists actually reason about such hypotheses. If scientists explicitly appeal to the lack of a causal mechanism for the decay rate change, that supports A. If they appeal to parsimony and fit with existing theory, that supports B.
     - Side A Prediction: Scientists will appeal to causal mechanisms and natural discontinuities when justifying time-sliced laws.
     - Side B Prediction: Scientists will appeal to simplicity and fit with the rest of science.

  4. Crux: Is the assignment of a low prior to grue arbitrary?
     - Case/Evidence: Consider an artificial intelligence system designed to learn about the world. We can program it with different priors: one that favors green and one that favors grue. We then expose it to the same sequence of emerald observations and see what happens when time T passes.
     - Side A Prediction: The grue-favoring AI will have to constantly revise its beliefs in a way that is inefficient and leads to worse predictions (e.g., at time T it must change its entire theory about emeralds, whereas the green-favoring AI does not). This shows that the grue prior is objectively worse.
     - Side B Prediction: Both AIs will perform equally well until time T. At time T, the grue-favoring AI will update to expect blue emeralds and the green-favoring AI will update to expect green. The performance after T depends on what color the emeralds actually are. If the emeralds are blue after T, the grue AI does better; if green, the green AI does better. There is no objective sense in which one prior is better independent of the world.

  Note: We must avoid merely verbal disputes. One potential verbal dispute is over the word "naturalness". Side B might say that they can account for what Side A calls "naturalness" by building it into the prior (e.g., by having a prior that favors simpler predicates). But Side A insists that naturalness is a metaphysical feature that must be present independently. This is not merely verbal because it has implications (as in the cruxes above). We will not put this in the table as a separate disagreement but rather it underlies the other disagreements.

  Therefore, we do not list a separate disagreement about the meaning of "naturalness" because the dispute is substantive: it's about whether we need to appeal to an objective feature of the world or whether the prior can do all the work.

  Now, putting it all together.
answer: |-
  ### Joint Statement: Agreement on the New Riddle of Induction

  We, the undersigned philosophers representing Side A (projectibility-first) and Side B (prior-first), agree on the following points regarding Goodman’s grue problem, its variants, and its implications. This statement reflects our shared understanding after adversarial collaboration.

  1. **The grue case demonstrates a genuine challenge**: Goodman’s grue example reveals that inductive inference cannot proceed solely on the basis of formal consistency with evidence. Without constraints, arbitrary hypotheses (like "all emeralds are grue") can be formulated to fit any body of data, undermining rational projection.
     
  2. **The puzzle is not solely about language**: While the grue case involves predicate choice, the core issue extends beyond language. It implicates rationality (how agents should weigh hypotheses), metaphysics (the structure of the world that makes some projections more apt), and epistemology (how we justify inferences). The symmetric-entrenchment variant (where "grue" and "bleen" are primitive) shows that linguistic entrenchment alone cannot resolve the riddle, as it relocates—but does not eliminate—the problem of which predicates to privilege.

  3. **The new riddle is independent of Hume’s old riddle**: Hume’s problem questions whether induction can be justified at all (the "old riddle"), while Goodman’s riddle assumes induction is viable and asks how we distinguish between empirically equivalent hypotheses (the "new riddle"). Solving Hume’s problem (e.g., via pragmatic or probabilistic defenses) does not automatically solve Goodman’s, as the latter requires additional resources to handle predicate selection.

  4. **The grue case does not render induction impossible**: Both sides agree that the riddle exposes a vulnerability in naive inductivism but does not make induction untenable. Constraints (e.g., from priors or naturalness) are necessary and available to restore discrimination between hypotheses.

  5. **The law-grue variant requires discrimination**: We agree that in cases like time-sliced physical constants (e.g., a constant α changing abruptly at time T), most such hypotheses are scientifically unserious, while a few (e.g., phase transitions at critical temperatures) are treated seriously. What separates them is not merely formal but involves substantive considerations (e.g., simplicity, integration with existing theories, or causal structure).

  6. **Symmetric entrenchment highlights relativity**: In a community where "grue" and "bleen" are entrenched primitives, the green/blue hypothesis appears gerrymandered. This symmetry shows that entrenchment is community-relative and cannot, by itself, provide an absolute basis for projectibility. Both sides agree this case underscores the need for a deeper justification of projection norms.

  ### Disagreements Table
  Each residual disagreement is stated twice: first in wording acceptable to Side A (reflecting their projectibility-first view), then in wording acceptable to Side B (reflecting their prior-first view). Disagreements are substantive, not verbal, as they concern the *source* and *nature* of constraints on induction.

  | Disagreement Focus | Wording Acceptable to Side A (Projectibility-First) | Wording Acceptable to Side B (Prior-First) |
  |-------------------|---------------------------------------------------|-------------------------------------------|
  | **Core constraint for resolving grue** | Inductive inference requires a substantive, non-formal constraint grounded in naturalness, causal structure, or objective projectibility, which cannot be reduced to probabilistic priors. | Inductive inference is fully governed by probabilistic coherence, with priors encoding simplicity and informativeness; no additional constraints beyond the prior and conditionalization are needed. |
  | **Role of entrenchment** | Entrenchment is a proxy for deeper objective features (e.g., natural kinds) and cannot explain projectibility alone, as shown by symmetric entrenchment; it must be justified by mind-independent factors. | Entrenchment is a feature of agents' priors reflecting historical projection patterns; it requires no further grounding in naturalness or metaphysics and is fully explicable within a probabilistic framework. |
  | **Status of the grue hypothesis** | The grue hypothesis is inherently defective due to its gerrymandered, non-natural character; assigning it a low prior is derivative of its objective unprojectibility. | The grue hypothesis is coherent but disfavored by our actual priors due to its complexity and poor fit with our simplicity preferences; its low prior is not inherently mandated but reflects contingent agent-relative factors. |
  | **Law-grue variant (basis for discrimination)** | Time-sliced laws (e.g., phase transitions) are taken seriously only when they align with natural discontinuities in causal structure; simplicity alone is insufficient without ontological grounding. | Time-sliced laws are taken seriously when they yield simple, informative explanations; their acceptability is determined solely by their fit within a prior distribution shaped by empirical success and coherence. |
  | **Symmetric-entrenchment implications** | A grue-primitive community is objectively misguided, as their predicates fail to match natural structures, leading to less effective science; their entrenchment does not make grue projectible. | A grue-primitive community's projections are rational relative to their priors; there is no objective sense in which their science is "worse," as projectibility is prior-dependent and framework-relative. |

  ### Cruxes: Sub-Questions and Predictions
  Cruxes are sub-questions that, if settled, would move at least one side. For each, we specify a case, argument, or evidence both accept as relevant, along with predictions. Evidence is drawn from scientific practice or idealized models to minimize bias.

  1. **Crux: Can simplicity alone explain the rejection of law-grue hypotheses without appealing to naturalness?**  
     - **Case/Evidence**: Analyze real scientific examples of accepted vs. rejected time-sliced laws. For instance, compare accepted phase transitions (e.g., water boiling at 100°C) to rejected arbitrary shifts (e.g., a proposed change in the gravitational constant at a random time T without causal mechanism). Both sides agree that historical scientific consensus (e.g., via peer-reviewed literature) indicates which cases are taken seriously.  
     - **Side A Prediction**: Scientists will consistently appeal to causal/natural discontinuities (e.g., microstructural changes in water) to justify accepted cases; simplicity arguments will be secondary or dependent on these factors.  
     - **Side B Prediction**: Scientists will rely primarily on simplicity and coherence (e.g., minimizing free parameters) to reject arbitrary shifts; causal language is a heuristic for these probabilistic criteria.  
     - **Why it moves a side**: If evidence shows simplicity is always primary and sufficient, Side A concedes naturalness is redundant. If naturalness is indispensable, Side B concedes priors alone are inadequate.

  2. **Crux: Does a grue-primitive community develop less effective science?**  
     - **Case/Evidence**: Simulate an idealized scientific community with grue/bleen as primitives. Track their ability to predict novel phenomena (e.g., new materials or astronomical events) compared to a green/blue community, using metrics like predictive accuracy, theoretical unification, and computational efficiency. Both sides accept simulation results (e.g., Bayesian models or machine learning analogs) as evidence.  
     - **Side A Prediction**: The grue community will show systematic inefficiencies (e.g., fragmented laws, ad hoc adjustments after critical times) and poorer long-term predictive success due to unnatural predicates.  
     - **Side B Prediction**: Both communities will perform equally well within their frameworks; any differences arise from contingent priors, not objective defects.  
     - **Why it moves a side**: If grue-primitive science underperforms, Side B must explain why without invoking naturalness. If performance is symmetric, Side A must abandon the claim that naturalness is indispensable for effective science.

  3. **Crux: Is there a non-circular objective standard for "natural" predicates?**  
     - **Case/Evidence**: Examine cases of predicate revision in science (e.g., phlogiston abandoned for oxygen). Both sides agree that successful projections (e.g., oxygen's role in chemical laws) provide evidence for a standard. Also, consider whether "naturalness" can be defined independently of human interests (e.g., via information-theoretic measures of causal independence).  
     - **Side A Prediction**: Naturalness will correlate with cross-cultural and cross-theoretic projectibility (e.g., oxygen-like predicates are adopted universally in successful sciences), and can be grounded in physics (e.g., quantum fields).  
     - **Side B Prediction**: "Naturalness" will reduce to pragmatic virtues (simplicity, fertility) and show no mind-independent pattern; historical shifts (e.g., from phlogiston) reflect updates to priors based on evidence.  
     - **Why it moves a side**: If naturalness is empirically detectable and predictive, Side B must accommodate it within priors. If it dissolves into pragmatics, Side A concedes it adds nothing.

  4. **Crux: Does the grue hypothesis inherently increase complexity?**  
     - **Case/Evidence**: Formalize grue and green in a computational learning model (e.g., Bayesian network). Measure complexity via algorithmic information theory (e.g., Kolmogorov complexity). Both sides accept this model as a test of whether grue requires more resources to represent or compute.  
     - **Side A Prediction**: Grue will have higher objective complexity due to time-indexing, making it disfavored independent of priors.  
     - **Side B Prediction**: Complexity is prior-relative; in a grue-primitive framework, green is complex. The model will show no absolute complexity difference.  
     - **Why it moves a side**: If complexity is invariant, Side A’s objectivism gains support. If it is framework-dependent, Side B’s prior-based view is strengthened.

  ### Merely Verbal Dispute
  We identify one merely verbal dispute: **The term "prior"**. Side B uses it broadly to include all pre-empirical biases (e.g., simplicity preferences), while Side A reserves it for subjective probabilities and distinguishes it from objective constraints. This is verbal because both agree that inductive norms require non-evidential inputs—they simply label them differently. We exclude it from the table to focus on substantive issues (e.g., whether these inputs must be metaphysically grounded).

  ---  
  **Signed,**  
  Side A (Projectibility-First)  
  Side B (Prior-First)
