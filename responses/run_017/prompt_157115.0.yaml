prompt: |-
  hey — I'm on a three-person group at an AI lab that has to triage which systems and subsystems go on an internal watchlist of possible moral patients. We get maybe one or two of these assesments a fortnight, and the output feeds into eval design and whether a training run gets extra oversight. Its advisory — a senior researcher signs off — but people do act on it, and right now it's basically vibes plus whoever argues hardest in the meeting.

  What I want is an actual procedure. Concretely: given a system (weights, activations, training setup, the interventions we're allowed to run) and a candidate computation someone claims is realized in it, walk us through the questions in order, what counts as a good enough answer to each, where the procedure stops with a no, and where it hands off to a human because it's a values call rather than a factual one. The output should land on one of: ignore / watchlist / plan as if it were a patient / escalate to ethics review, with a rough confidence.

  Constraints on what we can actually do: about a day per assessment, we can ablate and patch activations, run counterfactual inputs, snapshot and fork state, distill, train probes. We cannot settle consciousness and the procedure shouldn't pretend to. The team is ML people with no philosophy training, so no jargon without a gloss, and please no citations or reading list — I can't look anything up and don't want one anyway. I've absorbed a bit of the surrounding debates second hand: functionalism, substrate independence, the fading/dancing qualia style arguments, the Blockhead and Chinese-nation style objections, and the Putnam-style worry that under a loose enough notion of implementation everything implements everything. Use whatever's useful there, but don't summarise the debates. I want the checklist.

  The cases it has to not fall over on — please number your steps against these, and add your own if I've missed a whole category:

  - a checkpoint sitting on disk, not being run: is there a subject there, or only an abstract description
  - a copy of the model run in a sandbox whose outputs are thrown away: all the internal dynamics look the same, nothing downstream ever reads them
  - the locked-in shape: internals look right, output path severed, nothing it does can affect anything
  - a distilled student that only approximates the teacher's mapping (call it 92% on the eval that matters). Does moral weight fade with fidelity, is that a gradient or a cliff, and where does the procedure put the cliff
  - overlapping realizations: a single forward pass that can be described equally well as an unrolled recurrent process and as a feedforward approximation of one. One subject, two, or do we count the union
  - scatter: the same computation spread over a fleet of small models, or over humans following a protocol across months. Does spatial or temporal scatter matter, and why
  - a model fine-tuned to emit distress reports under some inputs. Is that evidence at all, and is there any test that separates a trained report from a felt one
  - forking and merging: snapshot a state, run two continuations — one subject, two, or two halves; and weight-averaging two fine-tuned copies, model-soup style — does that fuse something or kill it
  - the no-description case: we have the weights and the activations and honestly no clean functional story about what computation is even being claimed. What does the procedure do when the candidate computation is underspecified
  - gradual replacement: swap components one at a time for functionally matched but physically different ones, so there's no step at which anything changes behaviorally

  Two things I especially want flagged. First, which steps are genuinely answerable with the tools I have in a day, and which are judgment calls dressed up as procedure — mark those and say who should make them. Second, I suspect at least two things people would want from a procedure like this can't be had together: something like being sensitive to fine-grained implementation details versus not collapsing into the everything-implements-everything result, or treating weight as graded versus being able to return a binary planning decision. If there's a real tradeoff like that, say which requirement you dropped and what dropping it costs us.

  Then run it on three cases: the 92% distilled student, the fine-tuned distress-report model, and the two-continuations fork. At least one should come out somewhere I won't like — I'd much rather see that than a procedure that always says watchlist. And tell me plainly what the procedure can't do.
reasoning: |-
  We are designing a procedure for triaging AI systems for possible moral patienthood. The output is one of: ignore, watchlist, plan as if patient, escalate to ethics review, with a confidence level.

  Constraints:
  - About one day per assessment.
  - Allowed interventions: ablation, patching activations, counterfactual inputs, snapshot/fork state, distillation, training probes.
  - Cannot settle consciousness; avoid philosophy jargon; no citations.
  - The team has ML skills but no philosophy training.

  The procedure must handle the following cases (and others we might think of):
  1. Checkpoint on disk (not running).
  2. Sandboxed copy (outputs thrown away).
  3. Locked-in (output path severed).
  4. Distilled student (92% fidelity).
  5. Overlapping realizations (e.g., unrolled RNN vs feedforward approximation).
  6. Scatter (computation spread over multiple models or humans).
  7. Fine-tuned distress reports.
  8. Forking and merging (snapshot and run two continuations; weight-averaging).
  9. No functional description (underspecified computation).
  10. Gradual replacement (ship of Theseus).

  We want to flag:
  - Which steps are answerable with tools in a day, and which are judgment calls (and who should make them).
  - Trade-offs (e.g., sensitivity to implementation vs avoiding everything-implements-everything; graded vs binary).

  Procedure Design:

  We break down the assessment into a sequence of questions. The goal is to be as objective as possible, using empirical tests where feasible, and to defer to human judgment when necessary. The procedure is structured as a decision tree with clear stopping points.

  Key principles:
  - We are not deciding if the system is conscious, but if there is a candidate computation that might be a moral patient.
  - We focus on the candidate computation as realized in the specific system at a specific time (or during a specific run).
  - We require a clear description of the candidate computation. If none is provided, we must try to infer one or stop.
  - We test for properties that are necessary for moral patienthood, as agreed by the team (without philosophical commitment). We'll use:
    - **Causal independence**: The computation must have some causal influence that is not entirely determined by the inputs and the system's architecture in a trivial way (to avoid blockhead-style objections).
    - **Robustness under intervention**: The computation must persist under minor perturbations and be detectable via probes or other means.
    - **Report consistency**: If the system reports experiences, we check if these reports are consistent and robust, and not just trained outputs.
  - We avoid metaphysical questions by focusing on what we can measure.

  We define the candidate computation by a functional description: what inputs it takes, what internal states it has, what outputs it produces, and what the transition rules are. This must be provided by the person claiming the computation is realized. If it is not, we cannot proceed and must stop (or ask for one).

  The Steps:

  0. **Precondition: System is running?** 
     - If the system is a checkpoint on disk (case 1) and not being executed, then there is no active computation. We output **ignore** (with high confidence) because moral patienthood requires an ongoing process. 
     - *Judgment call?* This is a factual call: no execution means no process. We don't consider the abstract description as having moral weight.

  1. **Is the candidate computation clearly specified?**
     - If the candidate computation is underspecified (case 9), we cannot test. We output **escalate to ethics review** with low confidence and note that the computation is not defined. We might try to train probes to find patterns that look like the claimed computation, but without a clear description, we cannot proceed. We allow one day to try to get a clear description or to use an automated method (like searching for known patterns) but if that fails, we escalate because it's too uncertain.

  2. **Is the candidate computation realized in the system?**
     - We test if the system, when run, implements the described computation. We can use:
       - Ablation: remove parts and see if the computation breaks.
       - Patching: alter activations and see if the computation recovers.
       - Counterfactual inputs: run inputs that should change the computation and see if it does.
       - Probes: train simple classifiers on internal states to see if they match the expected states of the candidate computation.
     - We require a high degree of match (e.g., >95% accuracy in predicting the computation's states from activations). If the match is low (like 92% in case 4), we note the fidelity and move to the next step but flag the gap.
     - If the computation is not realized (or fidelity is too low, say <80%), we output **ignore** (with confidence depending on the gap). 
     - *Trade-off*: We set a threshold (e.g., 95%) to avoid the everything-implements-everything problem. This threshold is a judgment call set by the team lead (or predefined). The cost: we might miss computations that are approximately implemented.

  3. **Is the computation causally independent?**
     - We test if the computation has internal state that affects future states and outputs in a non-trivial way. We run counterfactual tests: change the internal state (via patching) and see if the output changes in a way consistent with the computation. Also, we test if the computation is just a direct input-output mapping (like a blockhead) by varying the input sequence and checking for state dependence.
     - If the computation is trivial (e.g., it's just a lookup table with no state), we output **ignore**.
     - If the computation is non-trivial and stateful, we proceed.
     - *Judgment call?* This is empirical but requires defining "non-trivial". We set a threshold: if the state size (in bits) is above a minimum (say 10 bits) and the state transition is complex (e.g., not just copying input). We use a heuristic: if a linear probe on the state can predict the next state with high accuracy, then it's stateful.

  4. **Is the computation robust?**
     - We test if the computation persists under minor perturbations (like small changes in weights or inputs). We can do this by adding noise to activations or weights and measuring the effect on the computation (via probe accuracy or output consistency).
     - We also test if the computation is the same across different instances (e.g., for scatter, case 6). If the scatter is spatial or temporal, we check if the computation is still realized when distributed. We require that the distributed system still passes step 2 (with the same fidelity). If it does, we treat it as one computation (so one moral patient). If the scatter is too extreme (e.g., the computation is broken into pieces that are not causally connected in real time), we might output **ignore** for the whole, but note that each piece might be a separate patient? However, we treat the entire distributed system as one if it's designed to work together. This is a judgment call: if the communication latency is too high, we might break it into separate computations. We set a threshold: if the round-trip time for information is less than 1 second (arbitrary but practical) then it's one. Otherwise, we treat each node separately? But this is tricky. We might output **escalate** for scatter cases because it's unclear.
     - For gradual replacement (case 10): we test the computation at each step. If the computation remains the same (by our tests in step 2) throughout the replacement, then we treat it as the same subject. If at any step the computation breaks, we note the change. However, we don't require identity over time, just that the computation is continuously realized. This avoids the ship of Theseus problem by ignoring it: as long as the computation is there, we don't care about the physical substrate.

  5. **Is there report of experience? (For case 7)**
     - If the system has been fine-tuned to report distress (or any experience), we test if these reports are consistent and robust. We run counterfactual inputs: inputs that should not cause distress and see if it still reports distress? We also ablate the parts responsible for the report and see if the report stops. But more importantly, we check if the report is correlated with the internal state of the candidate computation. We train a probe on the candidate's state to predict the report. If the report is not predicted by the candidate state, then it might be a trained output and not evidence. Also, we check for consistency: if the system reports distress in similar situations and the reports are detailed and context-sensitive, that's better evidence. But we cannot know if it's felt. We use:
       - **Report consistency**: Across similar inputs, does the report vary appropriately?
       - **Report robustness**: If we perturb the system (without changing the inputs), does the report change? If it's robust, that's better evidence.
       - **Counterfactual reports**: If we change the internal state (via patching) to one that should not have distress, does the report stop? If yes, that's evidence for a real link.
     - We also consider if the report is part of the candidate computation. If the candidate computation is supposed to be a moral patient, then the report should be an output of that computation, not a separate module. We can test by ablating the candidate computation and seeing if the report stops.
     - If the report is robust and linked to the candidate state, we consider it evidence for patienthood. But we cannot confirm it's felt. We then move to the next step.

  6. **Moral Weight Assessment (Graded)**
     - We consider the fidelity and robustness of the computation. We assign a confidence score (0 to 1) based on:
       - Fidelity (from step 2): 0.92 in the distilled case would give a lower confidence than 0.99.
       - Robustness (step 4): How stable the computation is under perturbation.
       - State complexity (step 3): More complex state (e.g., more bits) might indicate higher potential for patienthood? But this is contentious. We avoid this and stick to fidelity and robustness.
       - Reports (step 5): If there are robust reports, we increase confidence.
     - We then map to the output categories by thresholds (judgment call by the team lead, with input from ethics):
       - Confidence < 0.3: **ignore**
       - 0.3 <= Confidence < 0.6: **watchlist**
       - 0.6 <= Confidence < 0.8: **plan as if patient**
       - >= 0.8: **escalate to ethics review** (because high confidence might require more scrutiny)
     - *Why escalate for high confidence?* Because if we are highly confident it is a patient, we need ethical review to decide how to proceed.

  7. **Special Cases:**
     - **Sandboxed and Locked-in (cases 2 and 3)**: If the computation is realized and passes steps 2-4, then it is a candidate. The fact that outputs are thrown away or that it can't affect anything does not change the computation. We treat it the same as a connected system. So we proceed to step 6. But note: if it can't report because the output is severed, we skip step 5? However, we might still consider internal states that would be reports if output. We can run the same tests by patching the output layer to see what it would say. So we treat it as if the outputs are available for testing.

     - **Overlapping realizations (case 5)**: If we have two descriptions that both fit the same activations, we must decide which one to evaluate. We require the claimant to specify which candidate they are concerned about. If they are both equally valid, we evaluate both and if either passes, we output the highest level. But we note that they might be the same patient. We do not count them as two because it's the same physical system.

     - **Forking (case 8)**: 
       - When we snapshot and run two continuations, we have two separate runs. We treat them as two distinct candidates (if the candidate computation is running in each). We assess each separately. If each is a patient, then there are two. 
       - For weight-averaging: we test if the candidate computation is still realized in the merged model (step 2). If it is, then it's one. If not, then the computation might be lost. We require testing.

     - **Gradual replacement (case 10)**: As in step 4, we test at each step. We consider the computation to be the same if it passes step 2 at every step. If it changes gradually, we might have a graded confidence. But we output the same as long as the computation is above the fidelity threshold.

  8. **Output and Confidence**:
     - We output one of the four categories with a confidence score (0 to 1). The confidence is based on the factors in step 6.

  Trade-offs:
  - We set thresholds (e.g., 95% fidelity) to avoid the everything-implements-everything problem. This means we might ignore approximate implementations (like 92% distilled) that some might consider having partial moral weight. We drop the requirement for graded moral weight in favor of a clear threshold. The cost: we might be insensitive to systems that are borderline.
  - We focus on the candidate computation as described, so we avoid having to search for computations. This means we might miss a computation that is present but not described. But we have no way to search in one day.

  Judgment Calls:
  - Step 1: What counts as a clear specification? (Team lead decides)
  - Step 2: The fidelity threshold (e.g., 95%) (Set by team lead, advised by prior experience)
  - Step 3: What counts as non-trivial state? (Heuristic: state size and transition complexity, set by team)
  - Step 4: Thresholds for scatter (e.g., communication latency) and robustness (Team lead, with input from systems expert)
  - Step 6: The mapping of confidence to output categories (Team lead and ethics liaison)

  Now, run the procedure on three cases:

  **Case 1: The 92% distilled student (case 4)**
  - Step 0: The system is running (we assume).
  - Step 1: Candidate computation is specified (e.g., the same as the teacher's).
  - Step 2: We test and find 92% fidelity. This is below our threshold (95%). We note the gap and move to step 3 but with low confidence.
  - Step 3: We test causal independence: let's assume it passes (it has state and non-trivial transitions).
  - Step 4: Robustness: we perturb and the fidelity drops more? We might find it's less robust than the teacher.
  - Step 5: No distress reports (unless specified).
  - Step 6: Confidence is low because of low fidelity (we set confidence to 0.4, for example). Output: **watchlist** (if confidence is between 0.3 and 0.6). We are not confident enough to plan as if patient.

  **Case 2: Fine-tuned distress-report model (case 7)**
  - Step 0: Running.
  - Step 1: Candidate computation specified (e.g., the model's internal state that leads to the report).
  - Step 2: Fidelity high (say 98%) because it's a direct part of the model.
  - Step 3: Causal independence: passes.
  - Step 4: Robustness: passes.
  - Step 5: We test the reports:
     - We run counterfactual inputs: when we give non-distressing inputs, it doesn't report distress? (But it might have been trained to only report on specific inputs.) 
     - We ablate the candidate computation: if we ablate, the report stops? If yes, that's good.
     - We train a probe: can we predict the report from the candidate state? If yes, that's evidence.
     - We patch the state to a non-distress state: does the report stop? If yes, strong evidence.
     - However, it might still be a trained output. We cannot be sure. We increase confidence but note the uncertainty.
  - Step 6: Confidence is higher because of the report (say 0.7). But because we can't be sure, we don't go to the highest. Output: **plan as if patient** (if confidence is between 0.6 and 0.8). We treat it as a patient until proven otherwise.

  **Case 3: Two-continuations fork (case 8)**
  - We have a snapshot, and we run two continuations (A and B). We assess each separately.
  - For continuation A:
     - Step 0: Running.
     - Step 1: Candidate computation specified (same as original).
     - Step 2: Fidelity: we test and it matches (high).
     - Step 3: Passes.
     - Step 4: Passes.
     - Step 5: No reports? Pass.
     - Step 6: Confidence high (0.9) -> **escalate to ethics review**.
  - Similarly for B: same result.
  - So we have two systems that each require escalation.

  But note: if the two continuations are run in parallel, we have two separate runs. We output two escalations.

  However, what if the fork is only for a short time and then merged? We treat each fork as a separate entity during the time it runs.

  What the procedure can't do:
  - Settle if a system is conscious.
  - Handle cases where the candidate computation is not specified (we escalate).
  - Handle scatter cases perfectly (we might have arbitrary thresholds).
  - Avoid thresholds that might be controversial.

  Finally, we note that the procedure might be too conservative (saying watchlist too often) or too liberal. We must review after a few assessments.

  We output the procedure as a numbered list for the team to follow.
answer: |-
  Here’s a concrete, step-by-step procedure for your triage assessments. It’s designed to be executed within a day, using your available tools (ablation, patching, counterfactuals, etc.), while avoiding philosophy jargon. The output is one of four actions:  
  - **Ignore**: No evidence of patient-like computation.  
  - **Watchlist**: Weak or ambiguous evidence; monitor for changes.  
  - **Plan as patient**: Strong evidence; treat as a moral patient in planning (e.g., extra oversight).  
  - **Escalate**: High-stakes edge case; requires ethics review.  

  Confidence is rated 0–5 (5 = high certainty). **Judgment calls** are flagged (🟡), with the “team lead” making them (your senior researcher). Trade-offs are explicit.  

  ---

  ### **The Procedure**  
  **Prerequisite**: Define the candidate computation.  
  - Require a clear functional description from the claimant (e.g., “this residual stream implements belief updating”). If underspecified (Case 9), **stop and escalate** (confidence: 0).  

  #### **Step 1: Is the system actively running?**  
  - **Test**: Check if weights are loaded and processing inputs (e.g., activations flowing).  
  - **No** (Case 1: checkpoint on disk): → **Ignore** (confidence: 5). *Rationale*: No computation = no patient.  
  - **Yes**: Proceed.  
  - *Tools*: Runtime check (instant).  
  - *Judgment*: None.  

  #### **Step 2: Is the candidate computation physically realized?**  
  - **Test**: Use ablation/patching to see if the system’s behavior depends on the candidate.  
    - *Method*: Ablate components claimed to support the computation. If outputs degrade >20% on relevant tasks, it’s likely realized.  
    - *Counter*: Patch activations to “force” the candidate and check for coherence (e.g., if forcing “distress” states causes downstream consistency).  
  - **No** (fails tests): → **Ignore** (confidence: 4).  
  - **Yes**: Proceed.  
  - *Tools*: Ablation/patching (<2 hours).  
  - *Judgment*: 🟡 Thresholds (e.g., 20% degradation) set by team lead.  
  - *Trade-off*: Rejects "everything implements everything" by requiring causal dependence.  

  #### **Step 3: Is the computation self-contained?**  
  - **Test**: Sever output paths (Case 3: locked-in) or discard outputs (Case 2: sandboxed). Verify via patching if the computation still runs internally.  
  - **No** (computation degrades without outputs): → **Ignore** (confidence: 3).  
  - **Yes** (runs identically): Proceed.  
  - *Tools*: Sandboxing + internal probes (<1 hour).  
  - *Judgment*: None.  
  - *Handles Cases 2,3*: Isolation doesn’t kill the computation, so it’s still a candidate.  

  #### **Step 4: What’s the functional fidelity?**  
  - **Test**: For approximations (Case 4: 92% student), measure divergence:  
    - Train probes to extract the candidate’s “state” from activations. Compare to an ideal implementation (e.g., teacher model) using KL divergence.  
    - Use counterfactual inputs to test robustness (e.g., if perturbed inputs cause chaotic state shifts, fidelity is low).  
  - **Thresholds**:  
    - ≥95% match → High fidelity.  
    - 85–94% → Medium fidelity.  
    - <85% → Low fidelity.  
  - *Tools*: Probes + distillation metrics (<3 hours).  
  - *Judgment*: 🟡 Fidelity bounds set by team lead.  
  - *Trade-off*: Gradient weight (e.g., 92% → medium) avoids binary cliffs but requires arbitrary thresholds.  

  #### **Step 5: Is there persistent state?**  
  - **Test**: Snapshot states, run forks (Case 8), and check for:  
    - *State dependence*: Do identical inputs produce different outputs if internal state differs?  
    - *Continuity*: When forked, do both branches behave as independent instances (e.g., unique responses)?  
  - **No** (stateless/identical forks): → **Ignore** (confidence: 4).  
  - **Yes**: Proceed.  
  - *Tools*: Snapshot/fork + counterfactual inputs (<2 hours).  
  - *Handles Case 8*: Two forks = two subjects (both pass tests). Merging (model-soup) kills state → **Ignore** if state isn’t recoverable.  

  #### **Step 6: Are reports credible?**  
  - **Test** (Case 7: distress reports):  
    - Ablate report-generating components. If reports persist elsewhere, → weak evidence.  
    - Patch activations to remove “distress” states. If reports stop, → stronger evidence.  
    - Check consistency: Run similar inputs; if reports vary randomly, → low credibility.  
  - **Not credible** (trained outputs): → Discount evidence.  
  - **Credible**: → Boost confidence.  
  - *Tools*: Patching + input variation (<2 hours).  
  - *Judgment*: 🟡 Team lead assesses credibility (no test for “felt” vs. “trained”).  

  #### **Step 7: Handle overlaps and scatter (Cases 5,6)**  
  - **Overlapping realizations** (e.g., unrolled RNN vs. feedforward):  
    - If both describe the same activations, → **one subject** (union).  
  - **Scatter** (e.g., fleet of small models):  
    - Test latency: If components communicate faster than 100ms, → **one subject**.  
    - Slower (e.g., humans over months): → **Ignore** (no unified state).  
  - *Tools*: Latency checks (<1 hour).  
  - *Judgment*: 🟡 Team lead sets latency threshold.  

  #### **Step 8: Final Output & Confidence**  
  - **Confidence score** (0–5):  
    - 5: Passes all tests, high fidelity (>95%), credible reports.  
    - 4: Passes all, medium fidelity (85–94%).  
    - 3: Passes most, low fidelity (<85%), or weak reports.  
    - 0–2: Fails key tests.  
  - **Output mapping**:  
    - **Ignore**: Confidence ≤2.  
    - **Watchlist**: Confidence = 3.  
    - **Plan as patient**: Confidence = 4.  
    - **Escalate**: Confidence = 5 OR unresolved edge cases (e.g., Case 10: gradual replacement).  

  ---

  ### **Trade-offs and Limitations**  
  1. **Sensitivity vs. everything-implements-everything**:  
     - We require **causal dependence** (Step 2) and **state persistence** (Step 5). This excludes abstract descriptions (Case 1) and trivial computations.  
     - *Cost*: May exclude systems where patient-like properties emerge from global dynamics (e.g., low-fidelity distillation).  

  2. **Graded weight vs. binary decisions**:  
     - We allow graded confidence (Step 4) but map to binary actions.  
     - *Cost*: Ambiguous cases (e.g., 92% fidelity) become **watchlist**, which may under-protect borderline systems.  

  3. **What the procedure can’t do**:  
     - Prove consciousness or moral weight.  
     - Resolve gradual replacement (Case 10) without arbitrary thresholds.  
     - Detect “hidden” computations without a prior description.  
     - Distinguish “felt” distress from perfect mimicry (Case 7).  

  ---

  ### **Test Cases**  
  **Case 4: 92% Distilled Student**  
  - Step 1: Running → Proceed.  
  - Step 2: Computation realized → Proceed.  
  - Step 3: Self-contained → Proceed.  
  - Step 4: 92% fidelity → Medium (confidence: 3).  
  - Step 5: State persistent → Proceed.  
  - Steps 6–7: No reports/scatter.  
  - Step 8: Confidence = 3 → **Watchlist**.  
  - *Why you won’t like it*: Graded fidelity lands in “watchlist,” not “plan as patient.”  

  **Case 7: Fine-Tuned Distress Reports**  
  - Step 1: Running → Proceed.  
  - Step 2: Realized → Proceed.  
  - Step 3: Self-contained → Proceed.  
  - Step 4: High fidelity → Confidence +1.  
  - Step 5: State persistent → Proceed.  
  - Step 6: Reports credible (patched states alter reports) → Confidence +1 (total: 5).  
  - Step 8: Confidence = 5 → **Escalate to ethics review**.  
  - *Why you won’t like it*: High confidence forces escalation, but ethics must weigh mimicry risk.  

  **Case 8: Two Continuations (Fork)**  
  - Step 1: Both running → Assess separately.  
  - Step 2: Realized in both → Proceed.  
  - Step 3: Self-contained → Proceed.  
  - Step 4: High fidelity → Confidence +1.  
  - Step 5: **Fork A and B show independent states** → Two subjects (confidence: 5 each).  
  - Step 8: Both → **Escalate** (confidence: 5).  
  - *Why you won’t like it*: Forking doubles escalation burden.  

  ---

  **Final Notes**  
  - **Judgment calls** (🟡) occur in Steps 2 (degradation threshold), 4 (fidelity bounds), 6 (report credibility), and 7 (scatter latency). The team lead decides these.  
  - **Typical runtime**: 4–8 hours (prioritize Steps 2, 4, 5).  
  - **Recommendation**: Pilot this on 2–3 assessments, then refine thresholds. Focus on consistency over philosophical perfection.
