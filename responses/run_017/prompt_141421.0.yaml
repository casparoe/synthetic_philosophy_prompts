  For part (a), the student correctly distinguishes the problems and nails the circularity issue. Their "settled demos" example for scope is strong. Full marks feel justified here—it's concise and precise.

  Part (b) is messier. The student grasps the over-inclusiveness of all-affected but wrongly conflates all-subjected with it, missing that coercion requires actual legal subjection, not just deterrence. Their claim that border enforcement coerces non-resident Belgravians is a critical error—coercion applies territorially. They also overlook all-subjected's determinacy advantage. The analysis is half-right but the conflation drags it down. A 4/8 seems fair.

  In part (c), the student correctly notes no-exit escapes over-inclusion and distinguishes it from all-subjected with valid examples (tourist vs. trapped person). But the final paragraph derails by introducing an unsolicited territorial claim that undermines the whole criterion. That's a major conceptual error. Still, the core comparison is solid, so 4/7 feels right.

  The user’s frustration with "plausible but wrong" arguments is palpable. I should flag: (1) the conflation in (b) where coercion ≠ deterrence, and (2) the non sequitur in (c) linking demos to territory. Those are exactly the kind of defensible critiques they need. 

  Total 14/20: strong start but erodes in later sections. The feedback should mirror the rubric’s weightings—detailed where marks were lost, praising where earned. No fluff, just actionable fixes.
