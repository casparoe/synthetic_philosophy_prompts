  Here's a granular breakdown of the student's answer, with a total mark and specific comments for each part:

  **Final Mark: 14/20**  
  *(Breakdown: (a) 5/5, (b) 4/8, (c) 5/7)*  

  ---

  ### **(a) Grade: 5/5**  
  **What's Right:**  
  1. **Clear Distinction:** Correctly identifies the boundary problem as "who is the 'we'" (membership) and the scope problem as "what decisions the 'we' is entitled to take" (domain of authority).  
  2. **Connection & Separation:** Accurately notes they are connected (scope decisions can create boundary issues) but distinct (a settled demos can debate scope). The schooling/transport example effectively illustrates this.  
  3. **Circularity:** Perfectly explains the circularity in the boundary problem: constituting the demos democratically requires a pre-existing demos, which is impossible. Correctly notes the scope problem lacks this because an *existing* demos can decide its scope.  

  **What's Missing/Wrong:** Nothing significant. The explanation is concise, accurate, and addresses all parts of the question.  

  **Defensible Feedback:**  
  > *"Excellent. You precisely distinguished boundary (membership) from scope (domain of authority), gave a valid example of their separation, and clearly articulated why boundary entails circularity while scope does not. Full marks."*  

  ---

  ### **(b) Grade: 4/8**  
  **What's Right:**  
  1. **All-Affected Principle:** Correctly identifies its over-inclusiveness ("threatens to make every demos global") and applies it well to Ruritania (Belgravians wanting to immigrate are affected, leading to paradox). Notes the "no natural stopping point."  
  2. **All-Subjected Principle:** Correctly identifies it as "more determinate" because subjection to coercion is binary (yes/no), unlike affected interests (degree).  
  3. **Overlap Conclusion:** Rightly notes both principles might demand including Belgravians, challenging Ruritania’s exclusionary legitimacy.  

  **What's Wrong/Missing:**  
  1. **Misapplication of All-Subjected:** **Major Error.** The student conflates *coercion* with *deterrence*. Being subject to coercion means being *bound by and enforceable under* Ruritania’s legal order (typically territorial). Belgravians *outside* Ruritania are **not** subject to its coercion; they are *deterred* by it. Border enforcement applies to those *attempting entry*, not all potential immigrants. The principle usually includes residents/citizens, not foreign nationals abroad.  
  2. **Determinacy Claim Undermined:** By incorrectly claiming all-subjected includes deterred Belgravians, the student invalidates their own argument that it’s "more determinate." In reality, all-subjected gives a *clear, territorially bounded demos* (Ruritanian citizens/residents), avoiding the over-inclusion of all-affected.  
  3. **Missing Key Contrast:** Fails to state that all-subjected provides a **determinate answer** (only Ruritanians) while all-affected does not (ambiguous inclusion of Belgravians, affected Ruritanians, etc.).  

  **Defensible Feedback:**  
  > *"You correctly diagnosed the over-inclusiveness of the all-affected principle and noted the binary nature of all-subjected. However, you misapplied all-subjected: Belgravians abroad are deterred but not *subject to* Ruritanian coercion unless physically present/attempting entry. Coercion requires enforceability, not mere awareness. Thus, all-subjected yields a determinate demos (Ruritanians), while all-affected does not. Your conflation of deterrence with subjection led you to overlook this key contrast. 4/8."*  

  ---

  ### **(c) Grade: 5/7**  
  **What's Right:**  
  1. **Escape from Over-inclusion:** Correctly argues no-exit avoids the "worst" of all-affected by excluding those who can easily relocate (e.g., mildly affected Ruritanians).  
  2. **Distinction from All-Subjected:** Provides **two valid, contrasting cases** where the criteria diverge:  
     - *Tourist*: Subject to coercion but can exit easily → Included by all-subjected, excluded by no-exit.  
     - *Abandoned Person*: Cannot exit but not subject to coercion → Excluded by all-subjected, included by no-exit.  
  3. **Nuanced Critique:** Notes the dependency on external jurisdictions ("Ruritania's demos grows/shrinks") and the counterintuitive weak claim of the rich.  

  **What's Wrong/Missing:**  
  1. **Unsupported Territorial Claim:** The final sentence ("the demos just is the people who live on the territory") **contradicts the no-exit criterion** and is a non sequitur. No-exit defines membership by *inability to leave*, not residence. This conflates the criterion with a territorialist view it explicitly rejects (e.g., the abandoned person *lives* there but isn’t governed; the tourist doesn’t live there but is governed).  
  2. **Incomplete Defense:** While noting no-exit escapes over-inclusion, they don’t explicitly state it resolves the *indeterminacy* objection (though implied).  

  **Defensible Feedback:**  
  > *"You correctly showed no-exit escapes over-inclusion and doesn’t collapse into all-subjected, with strong examples (tourist vs. abandoned person). However, your concluding claim that 'the demos just is the people who live on the territory' is incorrect and undermines your argument. No-exit defines membership by *exit costs*, not residence—your abandoned person case *refutes* this territorial claim. 5/7."*  

  ---

  ### Overall Feedback to Hand Back  
  *"Your answer to (a) was exemplary. In (b), you grasped the all-affected principle’s flaws but seriously misapplied all-subjected by equating deterrence with subjection to coercion, leading you to understate its determinacy advantage. In (c), your core comparison was strong, but you undercut it by asserting an unsupported territorialist view that contradicts the no-exit criterion. Focus on precise definitions: coercion ≠ deterrence, territory ≠ no-exit. 14/20."*
