  The core issue is whether epiphenomenalism self-destructs via the "paradox of phenomenal judgment." Their partner argues that if conscious experiences don't cause anything, then even reporting "that hurts" isn't truly *about* the pain, undermining all introspective claims—including the intuitions that led to epiphenomenalism in the first place. The user proposes a "property-level dodge": maybe neural states cause the report, while phenomenal properties just tag along inertly. 

