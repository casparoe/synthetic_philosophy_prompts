prompt: |-
  I'm taking an advanced seminar on scientific realism this term and sharing a house with a PhD student in particle physics, so I keep bumping into a gap between how physicists write and how my seminar talks about what they are doing. In her field it is entirely routine to do all of the following inside a single paper: describe the Standard Model as an effective field theory, that is, as a low-energy approximation to something else, valid only below some cutoff scale, and therefore not something anyone in the field expects to be true in the long run; announce the discovery or observation of entities and quantities, whose measured values then get entered into permanently maintained reference tables that are treated as cumulative facts about the world; and rely, for whole chunks of the apparatus, the simulation, and the data analysis, on classical or non-relativistic models that everyone regards as superseded. So the theory is not true, the things it posits are nevertheless discovered, and the discarded theories of the past still do the calculating.

  To get a grip on this, our seminar has adopted a small procedure: whenever someone presents a case of theory change, historical or contemporary, they have to fill in a retention ledger, sorting the superseded theory's content into three bins — what the successor kept and now treats as literally true, what it kept but only because it gives right numbers in a limited regime, and what it dropped entirely. The ledgers do not come out tidy. Symmetries and conservation laws tend to be kept; but so is some ontology across violent structural change, electrons running from late-nineteenth-century cathode-ray work through to quantum field theory; while some structure that looked like the most secure part of the old picture, absolute simultaneity, or the conception of heat as the flow of a conserved substance, went into the bin. My housemate's own gloss is that the right unit of retention is not structure versus ontology but resolution: theories are true at a scale, in the way a map is true at a scale, and asking whether they are true simpliciter is a category mistake.

  What I would like is a reconstruction of what this bundle of practices — the effective-field-theory talk, the discovery talk, the reuse of superseded mathematics, and our ledger-sorting habit — presupposes about truth, reference, and theoretical success, and which rival views it quietly rules out. Specifically: does the practice strictly require something like structural realism, or would entity realism, or a thoroughly antirealist view on which a theory is only empirically adequate within a regime, license exactly the same behaviour? Can valid below the cutoff be cashed out as nothing more than yields correct numbers within error bars in regime R, and if so does that cash-out leave the practice of discovery-talk coherent, given that a term which may not refer in the successor theory is doing the discovering? Does the demand physicists place on any successor, that it recover the predecessor's numerical predictions in the predecessor's own domain, show that the old equations were tracking something real, or is it only a constraint on adequacy that an antirealist can accept? And is scale-indexed truth a genuine alternative to approximate truth, or just a relabelling of the same problem? Please separate what the practice strictly presupposes from what it merely sits comfortably with, tell me where it is philosophically underdetermined by several theories at once, and say concretely what would have to change in scientific practice — in the vocabulary of discovery, in how superseded theories are taught and used, in what our ledgers would even be tracking — if the implicit realism were replaced by the antirealist reading.
reasoning: |-
  Okay, I see the user is grappling with a complex issue in the philosophy of science, specifically regarding scientific realism versus antirealism in the context of physics practices. This is a sophisticated question that requires careful unpacking.

  The user describes a tension between how physicists actually work and how philosophical seminars analyze scientific practice. On one hand, physicists treat the Standard Model as an effective approximation while simultaneously claiming discoveries of entities like electrons. On the other hand, they freely use superseded theories for calculations. The user's seminar uses a "retention ledger" approach to categorize what gets preserved across theory changes, finding messy results that don't neatly fit philosophical categories.

  I need to address several interconnected questions: 
  First, what does this bundle of practices presuppose about truth and reference? 
  Second, which philosophical positions could support these practices? 
  Third, what would change if we adopted an antirealist interpretation?

  The user's physicist housemate offers an interesting perspective - that truth is scale-dependent, like maps. This suggests a possible resolution that avoids the traditional realism/antirealism dichotomy. But is this truly novel or just relabeling approximate truth?

  The key practices to analyze are:
  1) Treating theories as effective (approximate and domain-limited)
  2) Making discovery claims about entities
  3) Reusing mathematics from superseded theories
  4) The retention ledger exercise

  For the realism question, several positions could accommodate these practices: entity realism (entities exist even if theories change), structural realism (structure persists), or even instrumentalism (theories are tools). The discovery talk strongly suggests some form of realism about entities, while the effective theory approach aligns with instrumentalism.

  The cutoff scale can indeed be cashed out as "yields correct numbers within error bars" - this is essentially operational. But this creates tension with discovery claims, as antirealism struggles to explain why we say we've "discovered" something if reference is lost in future theories.

  The requirement that successors recover predecessors' predictions suggests physicists believe the old equations captured something real, but an antirealist could view this as merely pragmatic consistency.

  Scale-indexed truth offers a genuine alternative to approximate truth by making truth relative to a scale, thus avoiding the problem of theories being "approximately true" overall when they're actually fundamentally flawed.

  If we replaced the implicit realism with antirealism, several practices would need to change: we'd stop saying we "discover" entities and instead talk about "saving phenomena"; superseded theories would be taught as historical artifacts rather than useful tools; and the retention ledger would lose its point since nothing would be truly "retained" beyond empirical adequacy.

  The practices don't strictly require structural realism - entity realism or even sophisticated antirealism could work, though with different emphases. The retention ledgers show underdetermination, as the same practice can be interpreted through multiple philosophical lenses.
answer: |-
  This bundle of practices reflects a nuanced, scale-dependent **pragmatic realism** that implicitly rejects both naïve scientific realism and radical antirealism. Below is a reconstruction of its presuppositions, compatibility with philosophical views, and consequences for scientific practice if an antirealist reading were adopted.

  ---

  ### **Core Presuppositions of the Practice**
  1. **Scale-Relative Truth**:  
     Theories are *locally true* within a specific domain (energy scale, resolution) but not universally. This is analogous to cartography: a map of London is "true" for street navigation but false/inadequate for describing atomic structure.  
     - *Rules out*: Universal truth-aptness of theories; binary true/false judgments across all scales.

  2. **Robust Reference for Entities**:  
     Terms like "electron" refer to *stable phenomena* with invariant properties (charge, mass) across theories, even as their ontological description changes (e.g., particle → excitation in QFT).  
     - *Presupposes*: Reference is anchored in causal interactions (e.g., detection in cloud chambers) and mathematical invariants (e.g., charge conservation), not theoretical definitions.

  3. **Pragmatic Retention of Structure**:  
     Superseded theories are retained when they are *predictively reliable tools* within their domain (e.g., Newtonian mechanics for orbital calculations). Successor theories must *recover* the predecessor’s empirical predictions as a limiting case.  
     - *Presupposes*: Predictive success indicates contact with reality, even if the theory’s ontology is discarded.

  4. **Discovery as Operational Success**:  
     "Discovery" is asserted when (a) an entity’s effects are reproducibly measured, (b) its properties are stable across experiments, and (c) it integrates into the working ontology of science (e.g., reference tables).  
     - *Rules out*: Discovery requiring a "final theory."  

  ---

  ### **Compatibility with Philosophical Views**
  | **View**               | **Compatible?** | **Key Tensions**                                                                 |
  |------------------------|-----------------|----------------------------------------------------------------------------------|
  | **Structural Realism** | Yes             | Matches retention of mathematical structures (symmetries, conservation laws). But struggles with ontology (e.g., electrons as "objects" persist). |
  | **Entity Realism**     | Yes             | Aligns with discovery-talk and stable reference. But ignores retention of *structures* from discarded theories (e.g., Newtonian gravity). |
  | **Antirealism (e.g., Constructive Empiricism)** | Partially | Can cash "valid below cutoff" as empirical adequacy. But cannot explain discovery-talk or *why* superseded math remains reliable. |
  | **Pragmatic Realism**  | Best fit        | Endorses scale-relative truth, tool-like theory use, and reference stability. No conflict with practices. |

  - **Underdetermination**: The practices are compatible with **both structural and entity realism**, as they retain *both* structures (symmetries) and entities (electrons). Antirealism can explain empirical success but not discovery or cross-theory reference.  
  - **Cutoff Scale & Antirealism**: "Valid below cutoff" *can* be cashed out as "yields correct numbers in regime R." But this leaves **discovery-talk incoherent**: if terms don’t refer (e.g., "phlogiston"), how can we "discover" them? The practice assumes reference is robust.  
  - **Recovery Requirement**: The demand that successors recover predecessors’ predictions is **compatible with antirealism** (as a pragmatic constraint) but is *naturally read* by realists as evidence that old theories tracked real patterns.  

  ---

  ### **Scale-Indexed Truth vs. Approximate Truth**
  - **Scale-indexed truth** is distinct: It claims theories are *exactly true* within their domain (like a microscope’s resolution), not approximately true universally.  
    - *Example*: Navier-Stokes equations are exactly true for fluid dynamics at human scales, not an approximation of QCD.  
  - **Approximate truth** implies a theory is "close" to a universal truth. Scale-relativity avoids this by denying universal truth exists.  

  ---

  ### **Consequences of Adopting Antirealism**
  If an antirealist (e.g., van Fraassen) view replaced the implicit realism:  
  1. **Discovery-Talk**: Replace "discovery of electrons" with "empirical adequacy of electron-model in regime R." Reference tables would be relabelled "operational invariants," not facts about the world.  
  2. **Use of Superseded Theories**: Superseded math (e.g., Newtonian gravity) would be taught as *useful fictions* with no claim to representing reality, even instrumentally.  
  3. **Retention Ledgers**: Ledgers would track *predictive utility*, not "retention of truth." The "literally true" bin would vanish; all entries would shift to "gives right numbers."  
  4. **Theory Development**: Successors need not "recover" predecessors as limiting cases—merely outperform them empirically. Historical continuity (e.g., electron permanence) becomes coincidental.  

  ---

  ### **Conclusion: What the Practice Strictly Requires**
  - **Minimal Commitments**:  
    - Scale-relative reliability of theories.  
    - Robust reference for entities with stable properties.  
    - Predictive success as a marker of contact with reality.  
  - **Ruled Out**:  
    - Universal antirealism (discovers talk becomes empty).  
    - "Final theory" realism (effective theories reject this).  
  - **Underdetermined**: Structural vs. entity realism (both fit).  
  - **Philosophically Novel**: Scale-indexed truth resolves the "approximate truth" problem by rejecting universal scope.  

  **In short**: The practice presupposes a **phenomenon-driven realism**—entities and structures are "real" *because they persist in causal interactions and calculations*, regardless of theoretical revolutions. Antirealism would force a revision of scientific discourse from discovery to instrumentalism, severing the link between success and reality.
