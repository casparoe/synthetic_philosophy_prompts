prompt: |-
  I am writing a paper on whether Augustine's absolutism about lying can be detached from his definition of a lie, and I have built an argument that seems to show it cannot. The trouble is that the argument now seems to run well past what I wanted, and I cannot identify the step that is doing the work. I would like a diagnosis.

  Take as given the three claims I read him as holding:

  A. A lie is an utterance in which the speaker says one thing with the voice while holding another in the heart, willing that the hearer take the utterance to express the speaker's mind. The falsity of the proposition uttered is not the essence of the matter: someone who says what is false while believing it true is not lying, only mistaken.

  B. Every lie is a sin. No good consequence can turn a lie into a permissible act, and one must not lie even where an innocent life is at stake.

  C. Misleading someone without asserting anything is not lying and is sometimes permitted: silence, refusal to answer, concealment, and the arrangement of things so that a pursuer forms a false belief.

  The argument:

  (1) By A, what makes an utterance a lie is the speaker's will to deceive; the truth-value of the proposition she utters is inessential to it.

  (2) A will is individuated by what it is a will that. Two acts whose wills have the same object are, in respect of the will, the same act — and A says the will is where the wrong lies.

  (3) First case. A pursuer is at the door; the fugitive is in the cellar. The pursuer has complete but inverted confidence in the speaker: he believes everything she says to be false. The only way to send him to the attic is for her to say truly that the fugitive is in the cellar, and she says it precisely in order that he form the false belief that the fugitive is not in the cellar. The object of her will: that he believe the fugitive is not in the cellar.

  (4) Second case. Same door, same fugitive, a speaker with ordinary credibility, who says falsely that the fugitive is in the attic in order that the pursuer form the false belief that the fugitive is not in the cellar. The object of her will: the same proposition.

  (5) By (2), the wills in (3) and (4) are the same in the only respect that, by A, is morally relevant. So (3) is a lie if (4) is.

  (6) By B, then, the true statement in (3) is impermissible, and she must instead say nothing — which, since the pursuer knows she is hiding someone, costs the fugitive his life. Here the absolutism forbids the only act that saves him and permits the one that loses him, in a case where no false assertion was ever available as a means.

  (7) The argument does not stop there. Third case: with the pursuer's back turned, she lights the lantern over the attic stair and leaves the cellar dark, intending that he infer the fugitive is in the attic. Her will has the same object as in (3) and (4), and she asserts nothing. By (1) and (2) the decoy is a lie; by B it is impermissible.

  (8) Fourth case: she refuses to answer, foreseeing — and, stipulate, acting because — the pursuer will infer from her silence that he has the wrong house. Same object, no assertion. By the same route, her silence is a lie and impermissible.

  (9) But C says the decoy and the silence are permitted. And C is not decorative: it is what makes the absolutism more than a counsel to die wherever silence fails. If the argument is sound, C is false, and the only advice left to the person at the door is to be silent while not aiming at the pursuer's error — a distinction between what is intended and what is merely foreseen.

  (10) Conclusion: if the wrong of lying is a disorder of the will, and a will is specified by its object, then B and C cannot both stand. They can both stand only if the wrong is located in the assertion rather than the will — in the abuse of a faculty whose natural end is the expression of thought — which is to give up A, and with it the claim that lying is essentially a vice of the heart.

  I would rather keep B and C than the will-based reading of A, but I want to know what I am paying. So: which step do you reject, and why did it look sound? If the argument is valid, which of A, B, C is least costly to give up and what else does giving it up commit me to — in particular, can a prohibition located in the assertion rather than the will still generate an absolute ban, given that the very same aim of misleading is conceded to be fine when pursued by other means? Is the intended-versus-foreseen distinction in (9) one Augustine can help himself to, or is it an anachronism? I have a vague suspicion that something shifts between (2) and (5), but I cannot say what, and I would rather you located it than confirmed my guess.

  Two further checks on any repair you propose. First, the case of someone who says what she believes to be false but which is in fact true, intending to mislead: if your account holds that this is a lie, say why the failure of the deception makes no difference; if it holds that it is not, say what became of A. Second, as I understand it, Augustine handles the Scriptural deceivers — the midwives, Rahab — by saying that what was rewarded was the mercy and not the deceit, so that the act can be partly good while the lie in it remains a sin. Tell me whether that move survives the diagnosis you give, or whether it is the first thing that has to go.
reasoning: |-
  Okay, the user is working on a paper about Augustine's views on lying, specifically whether his absolutism against lying (B) can be separated from his definition of a lie (A). They've constructed an argument that seems to show it can't, but they're stuck because the argument goes further than intended, and they can't pinpoint where the flaw is. They need help diagnosing the issue.

  First, I need to understand the core of their argument. They present Augustine's three claims: (A) lying is defined by the intention to deceive, regardless of truth value; (B) all lies are always sinful; and (C) misleading without asserting is permissible. The argument uses cases to show that if the will's object defines the moral wrong, then permissible deception in (C) should be considered lying and thus impermissible, contradicting C. This forces a choice between keeping B and C or abandoning the will-based reading of A.

  The user suspects a problem between steps (2) and (5), where they claim that wills with the same object are morally identical. But Augustine might not agree that the will's object alone determines moral quality—he might consider the means (assertion vs. non-assertive actions) as part of the act's moral character. Step (2) oversimplifies by ignoring how the will is exercised. For example, in case (3), saying a true statement to deceive involves asserting, while in case (7), using a decoy doesn't. Even if the intention is the same, the acts are different because one abuses the communicative faculty by asserting falsely in the heart, while the other doesn't involve assertion at all.

  The user's cases cleverly test consistency. Cases (3) and (4) show that true statements with deceptive intent should be lies if the will defines it. Cases (7) and (8) extend this to non-assertive actions, claiming they should also be lies. But this is where the argument overextends—Augustine's A specifies that lying requires an utterance where the speaker says one thing while holding another in the heart. Non-assertive actions like decoys or silence don't involve "uttering," so they don't meet A's definition. Step (7) incorrectly classifies the decoy as a lie because it ignores A's requirement of an utterance.

  The user's valid point is that B and C conflict if the will is the sole locus of wrong. But Augustine likely ties the wrong to the misuse of assertion, not just any deception. So giving up the will-based reading of A might be necessary, meaning the wrong is in the assertion itself. However, this raises questions about how an assertion-based prohibition can be absolute if the same intention is allowed via other means. The user also asks about the intended vs. foreseen distinction and whether Augustine can use it. While he doesn't use double effect explicitly, his allowance of non-assertive deception suggests he distinguishes intended deception from foreseen but unintended, which might help in some cases but not fully resolve the conflict.

  For the further checks: If someone says what they believe is false but is actually true, Augustine's A would still consider it a lie because of the intent, regardless of truth value. If an account denies this, it contradicts A. The midwives and Rahab are handled by Augustine as having their merciful intent praised while the deceit remains sinful, but if lying is defined by assertion misuse, their deceptive actions might not count as lies if they didn't involve false assertions. However, if they did assert falsely, the lie is still sinful even if the mercy is good. The move survives if lying requires assertion; if not, their actions might be permissible deception under C.

  The user's deeper need might be to resolve the tension in Augustine's framework without abandoning absolutism. They prefer keeping B and C, so the solution is to reject the will-based reading of A, locating the wrong in the assertion. This preserves B and C but requires reinterpreting A to emphasize the abuse of communication. The cost is explaining why assertion is special—perhaps because it violates the natural end of speech to express truth. The user must address why the same intention is wrong only when channeled through assertion, which Augustine might ground in the inherent purpose of communication.
answer: |-
  Your argument is tightly constructed and exposes a genuine tension in Augustine's framework. The flaw lies in **step (2)**, specifically in how it individuates the will and isolates it as the *sole* locus of moral wrong. While step (1) correctly summarizes A, step (2) oversimplifies Augustine's moral psychology and misapplies the concept of the "object" of the will. This step *looks* sound because it appeals to a basic principle of intentional action, but Augustine's view is more nuanced. Here's the diagnosis:

  1.  **The Problem with Step (2): "The Will" is Not Monolithic or Isolated**
      *   **Misindividuation:** Step (2) claims: "A will is individuated by what it is a will that. Two acts whose wills have the same object are, in respect of the will, the same act." This is too coarse-grained for Augustine. While the *propositional object* (e.g., "that the pursuer believes the fugitive is not in the cellar") is identical in your cases, Augustine would argue that the *means* chosen to achieve that object are *part* of the willed act and fundamentally alter its moral character. Willing deception *via false assertion* is a different *kind* of willing act than willing deception *via truthful assertion* or *via non-assertive means*.
      *   **The Locus of the Wrong is Not *Just* the Intent to Deceive:** Step (2) asserts: "A says the will is where the wrong lies." This is partially true but incomplete. Augustine *does* locate the sin in the will, but crucially, **the sinful will is specifically the will *to misuse the faculty of communication*.** A defines a lie as an utterance where the speaker *says* one thing (with the voice) while *holding* another (in the heart), *willing that the hearer take the utterance to express the speaker's mind*. The sin isn't *merely* the intent to deceive *simpliciter*; it's the intent to deceive *by means of* asserting something you do not believe to be true *as if you do believe it*. The wrong is the *abuse of the act of assertion itself* – using the God-given faculty of communication (whose natural end is to express the truth of one's mind) to express a falsehood *as if it were the truth of one's mind*. The "disorder" is specifically in the relationship between the inner thought, the outer utterance, and the intended reception of that utterance *as an expression of the inner thought*.

  2.  **How the Flaw Propagates Through the Argument:**
      *   **Steps (3) & (4):** Case (3) (saying the true "he's in the cellar" to deceive) involves an utterance where the speaker *says* "he's in the cellar" (which matches what she holds in her heart – she believes he's there) but *wills* that the hearer take this *true utterance* to express her mind (which it does) *and* thereby form a false belief. Augustine would likely argue this is *not* a lie according to A. She *is* expressing her mind truthfully. Her *intention* is deceptive regarding the fugitive's location, but she is not lying *because she is not asserting what she does not believe*. The deception arises from the hearer's perverse interpretive framework, not from a false assertion presented as true. Case (4) *is* a lie: she asserts what she does not believe ("he's in the attic") as if she does believe it.
      *   **Step (5):** Fails because (3) is *not* a lie according to A, as argued above. The wills are *not* the same in the morally relevant respect specified by A. Both intend the pursuer's false belief, but only (4) intends to achieve it by falsely asserting a proposition she disbelieves as if she believes it. The "object" of the will relevant to lying includes *how* it is willed – through the specific act of mendacious assertion.
      *   **Steps (7) & (8):** This is where step (2)'s flaw becomes most apparent. The decoy and silence cases *do not involve an utterance at all*. A explicitly defines a lie as an *utterance* ("says one thing with the voice"). Lighting a lantern or refusing to speak is not "saying" anything in the required sense. Therefore, by A's very definition, they *cannot* be lies, regardless of the identical *propositional object* of the deceptive intention. Step (7) incorrectly claims "the decoy is a lie" based solely on (1) and (2), ignoring the core requirement of A that it be an *utterance*. The will to deceive is present, but it is not instantiated through the *specific sinful act* of misusing the faculty of communication via false assertion. C is describing precisely these non-assertive means, which Augustine consistently distinguishes from lying.

  3.  **The Valid Core Tension (Steps 9 & 10):** Your conclusion (10) correctly identifies the tension *if* the wrong is located *only* in the intent to deceive. If that were Augustine's position, then B and C would indeed be incompatible. *However*, Augustine locates the specific wrong of lying not in the general intent to deceive, but in the specific act of deceptive *assertion*. This allows him to maintain both B (lying, defined as deceptive assertion, is always sinful) and C (deception via non-assertive means is sometimes permissible). The cost of this view (paying for keeping B and C) is:
      *   **Giving up the pure "will-based" reading of A:** You must interpret A not just as "intent to deceive defines lying," but as "intent to deceive *via asserting what you do not believe as if you do believe it* defines lying." The locus of the wrong shifts slightly: it's not *just* the will, but the will *as expressed in* the abuse of the communicative faculty through assertion. The "vice of the heart" is specifically the perverse will *to assert falsely*.
      *   **Accepting a "Means-Sensitivity":** You must accept that the moral quality of an act of deception depends fundamentally on the *means* used – assertion vs. non-assertion. This is what allows the "very same aim of misleading" to be sinful in one form (lying) and potentially permissible in another (non-assertive deception).

  4.  **Addressing Your Further Checks:**
      *   **Saying what you believe false but is true, intending to mislead:** Augustine (via A) *would* call this a lie. Why? Because the speaker *says* X (with the voice), while *holding* not-X in the heart, and *wills* that the hearer take the utterance as expressing the speaker's mind (which it manifestly does not – the speaker disbelieves X). The *accidental truth* of X is irrelevant to the definition, which concerns the *relation* between inner belief, uttered proposition, and the will regarding how the utterance is received. The failure of the deception doesn't change the fact that the speaker *intended* to misuse the faculty of communication by asserting falsely *as if true*. The sin lies in the *attempt* to deceive through this specific abuse, regardless of its success or the proposition's accidental truth. (This also highlights that the wrong isn't *just* the deception, but the *mendacious assertion*).
      *   **The Midwives and Rahab:** Augustine's standard move ("rewarded for mercy, not deceit") **survives** this diagnosis. His position allows him to say:
          1.  *If* the midwives/Rahab lied (i.e., made false assertions intending to deceive), then that specific act *was* a sin (B holds).
          2.  However, their *overall action* included the good of mercy/protection of life.
          3.  God could reward the *good* aspect (mercy) without endorsing the *sinful* aspect (the lie). The sin remains, but mercy is praised.
          Crucially, this move *depends* on maintaining the distinction asserted in C. If Augustine *couldn't* distinguish lying from permissible non-assertive deception, his defense of the Scriptural figures would collapse entirely, as he couldn't permit *any* deception. C provides the space for him to argue that *perhaps* they used permissible means (though he usually seems to think they lied, hence the need for the "rewarded for mercy" distinction). Giving up the will-based reading of A *preserves* this move by keeping the definition of lying (A) focused on assertion and maintaining the permissibility of non-assertive deception (C).

  5.  **Intended vs. Merely Foreseen (Step 9):** While the *full* developed doctrine of double effect is anachronistic, Augustine *does* utilize a distinction between what is directly willed/intended and what is merely permitted as a side-effect. He uses it implicitly in discussing self-defense and killing in a just war. **He *can* and *does* help himself to a basic version of this distinction.** This is evident in C: deliberately arranging things *to cause* a false belief (intended deception) is permissible if done non-assertively; one could *foresee* that silence might lead to a false belief without *intending* that belief (e.g., simply refusing to betray a secret). However, this distinction *alone* doesn't resolve the core tension about lying. It helps refine the application of C but doesn't address the fundamental question of why deceptive assertion is always wrong while equally intentional non-assertive deception is sometimes permissible. The answer lies in the "means-sensitivity" argued above.

  **Conclusion and What You're Paying:**

  You are right that the argument hinges on step (2). Rejecting the pure will-based reading of A (as you prefer) is the least costly way to preserve B and C. The cost is:

  1.  **Refining A:** You commit to interpreting A as defining lying not merely by the *intent to deceive*, but by the *intent to deceive via the specific act of asserting what one does not believe as if one does believe it*. The wrong is located in this specific act of communicative abuse.
  2.  **Asserting the Moral Significance of Means:** You must defend the claim that the *means* of deception (assertion vs. non-assertion) carries decisive moral weight, such that one can absolutely prohibit the former while sometimes permitting the latter, even with the same deceptive intent. Augustine grounds this in the natural end of communication (to express true thought) and the inherent disorder of using it contrary to that end. You'll need to grapple with whether this justifies *absolutism*.
  3.  **Explaining the Special Status of Assertion:** You need to articulate *why* the misuse of assertion is uniquely sinful in a way that non-assertive deception is not, even when the intention is identical. Augustine's theological anthropology (faculties given by God for specific ends) provides his foundation.

  This repair allows you to keep B (absolutism about lying, now defined as deceptive assertion), C (permissibility of non-assertive deception), and a modified A that emphasizes the *assertive act* as constitutive of the lie. It preserves Augustine's handling of the Scriptural deceivers. The price is accepting that the core wrong of lying, for Augustine, is located in the *assertion* (as an act of will), not in the *intent to deceive* considered abstractly apart from the means. The argument from step (3) fails because the speaker isn't lying (she asserts truthfully); the arguments from steps (7) and (8) fail because they aren't utterances at all. The tension between B and C is resolved by the definitional precision of A, tying the absolute prohibition strictly to the act of false assertion.
