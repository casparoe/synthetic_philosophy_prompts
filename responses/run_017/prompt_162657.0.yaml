prompt: |-
  I sit on my faculty's postgraduate assessment standards committee, which for the past two years has been ruling on individual requests to use generative AI tools in assessed work. The only rationale our minutes ever invoke is that a use should be refused where it would erode the understanding that the degree certifies. Nobody on the committee has ever written down what eroding amounts to, and the eight rulings below were reached case by case, each unanimously:

  (i) Allowed: a student uses a model to generate practice problems in a topic she is learning, then answers them unaided.
  (ii) Allowed: a model is used to look for errors in a proof the student has already written and cannot fault; the student then checks the complaint himself.
  (iii) Refused: a model drafts the literature section of a thesis chapter, which the student then rewrites heavily. The minute records that the synthesis was not his.
  (iv) Refused: a model is used to summarise papers the student has not read, and the summaries are the basis for claims in the submitted work.
  (v) Allowed, and encouraged: a model instructed only to ask questions and never to assert, even where the student would not have thought of the questions unaided.
  (vi) Refused: a model is asked which statistical test to use, and the recommendation is followed.
  (vii) Allowed: a model writes code implementing a method the student has already specified in complete detail.
  (viii) Allowed, subject to a condition: a model translates a passage in a language the student does not read, provided the translation is not relied upon for any claim about the text's argument.

  The request now in front of us. A fourth-year doctoral student asks to use a model that has been fine-tuned on her own supervision notes, chapter drafts and published papers — a corpus nobody else has access to. Having first written her own provisional answer, she would ask the model what her answer to a given objection would be, check the output against the notes she still has, rewrite it, and use it as the skeleton of a section. Her account, which we have no reason to disbelieve, is that she could still reconstruct the position unaided, but only over several days she does not have, and that left to herself she would arrive at substantially the same thing: what she has lost is the ability to reconstruct it quickly, not the ability to recognise it as hers and defend it once it is in front of her. Two features of the case pull in opposite directions, and the committee has split on exactly this. First, the output is continuous with her earlier work in a way no general-purpose model's would be, which makes some of us want to treat the model as externalised memory rather than as dependence on another mind. Second, and against that: precisely because the output is continuous with her own prose and vocabulary, no reader and no examiner could detect that it was involved — which is true of none of the uses we have allowed so far, and which some of us think makes this case worse rather than better than dependence on a generic model.

  What I want from you, in this order:

  1. Reconstruct the rule, or rules, that fit all eight earlier rulings. I can think of several candidates and I do not believe our minutes distinguish between them; set out the ones that survive all eight, and say whether any of them is already eliminated by (vi) or (viii).
  2. For each surviving rule, give its verdict on this request, with the reasoning made explicit rather than asserted. I am less interested in the verdict than in the rule that generates it.
  3. Which precedent is the closest analogue, and why? (iii) has been argued on the ground that in both cases a model-generated skeleton is rewritten; (viii) on the ground that in both cases the model functions as a transducer of content the student already has rather than a source of new content. But (viii) carries a condition this request does not obviously satisfy, and that seems to me to cut the other way.
  4. Recommend the decision, supposing we want above all to be consistent with ourselves, and say plainly if our precedents genuinely underdetermine the case. If they do, state for each option the principle we would be committing ourselves to by choosing it — in particular, if we allow it, are we conceding that what our terms of reference were protecting all along was not understanding but its auditability to others?
  5. Does your recommendation change if the student is in her first year rather than her fourth? If it does, say what that reveals about whether the rule we are running concerns the student's understanding, the trajectory of that understanding, or the stage at which the degree certifies it.
  6. Finally, name the minimal variant of this case that would tell the surviving rules apart. My own candidate is to have her use the same fine-tuned model on a question she has never addressed at all, so that the output reconstructs what she would have said rather than anything she ever did say. Tell me whether that is the sharpest test available, and if not, what is, and what each rule predicts of it.
reasoning: |-
  Hmm, this is a fascinating and complex case about academic integrity and AI usage. The user is on a committee that has to decide whether a PhD student can use a custom AI model trained on her own work to help reconstruct arguments quickly. 

  First, I need to reconstruct the implicit rules from their eight previous rulings. Looking at the allowed cases: (i) is about practice problems, (ii) error-checking with verification, (v) question-asking only, (vii) coding implementation, and (viii) translation with conditions. The refused cases: (iii) drafting literature sections, (iv) summarizing unread papers, (vi) choosing statistical tests. 

  The pattern seems to be about whether the student maintains intellectual ownership and understanding. The core principle appears to be that AI can assist with execution or verification, but not with core intellectual synthesis or judgment. Cases where the student verifies or executes their own ideas are allowed; where the AI generates academic content the student hasn't mastered, it's refused.

  Now for this new case: a PhD student wants to use a custom AI trained on her own work to reconstruct arguments. Some committee members see it as "externalized memory," others worry about undetectable outsourcing. 

  The closest precedent is probably (viii) translation, but with a critical difference - that case required non-reliance for substantive claims. Here, the output would form the skeleton of an argument section. Case (iii) is also analogous regarding rewriting AI drafts, but this involves the student's own intellectual content.

  For consistency, I think they should allow it with conditions: she must disclose the usage and demonstrate she could reconstruct the argument independently. The fourth-year status matters because doctoral work expects synthesis of one's own corpus. A first-year student wouldn't have this ownership.

  The sharpest test case would be using the AI on a novel question - reconstructing what she would say rather than what she did say. That would truly test whether the AI is memory or proxy thinking.

  Ultimately, this case reveals their committee has been protecting both understanding and its demonstrability. Allowing this would acknowledge that auditability isn't the only value - genuine understanding can exist even if reconstructed with tools, provided the student maintains intellectual ownership.
answer: |-
  Based on your eight precedents and the core rationale ("eroding the understanding the degree certifies"), I reconstruct the following rules and analyze the new request:

  **1. Surviving Rules from Precedents**
  All eight rulings are consistent with **two distinct but overlapping rules**, neither eliminated by (vi) or (viii):

  *   **Rule A (Intellectual Ownership & Synthesis):** AI use is permitted *only if* the student demonstrably **originates, synthesizes, and intellectually owns** the core academic content (arguments, interpretations, conclusions, methodological choices). AI is restricted to non-synthetic, executable, or verificatory tasks.
      *   *Allowed by A:* (i) (generates practice problems - student solves), (ii) (error *checking* - student verifies), (v) (questioning - provokes student synthesis), (vii) (code *implementation* - student specified method), (viii) (translation - student provides source/meaning, output not used for argument).
      *   *Refused by A:* (iii) (synthesis drafted by AI), (iv) (synthesis based on unread sources), (vi) (methodological *choice* by AI).
      *   *(vi) eliminates rules permitting AI for core academic judgment; (viii) is consistent as it prohibits reliance on AI for argument/meaning.*

  *   **Rule B (Demonstrable Understanding & Critical Engagement):** AI use is permitted *only if* the student **demonstrably understands the output and engages with it critically** *before* submission. The output cannot form the substantive intellectual core unless the student could independently generate or validate it. Detectability *per se* is not the rule, but undetectable outsourcing of synthesis/judgment is prohibited.
      *   *Allowed by B:* (i) (student solves problems), (ii) (student verifies complaint), (v) (student answers questions), (vii) (student understands method/code), (viii) (student provides source, doesn't rely on AI for meaning).
      *   *Refused by B:* (iii) (AI drafted core synthesis - rewriting != validation), (iv) (no engagement with sources), (vi) (no critical engagement with methodological choice - blind following).
      *   *(vi) explicitly violates critical engagement; (viii) requires critical engagement with the source text, not the AI output, which is consistent.*

  **2. Verdicts on the New Request**
  *   **Under Rule A (Ownership & Synthesis):**
      *   *Verdict:* **Refuse.** The core academic synthesis – constructing the *answer to the objection* – is generated by the AI, even if based on her corpus. The student provides input (provisional answer, objection) and edits the output, but the AI performs the retrieval/synthesis task central to academic argumentation. Rewriting the AI's "skeleton" is analogous to (iii), where rewriting didn't salvage the lack of original synthesis. The model is generating the *substance* of the counter-argument.
  *   **Under Rule B (Understanding & Engagement):**
      *   *Verdict:* **Allow (with conditions).** The student originates the provisional answer, critically checks the AI output against her *own* notes (demonstrating understanding and validation), rewrites it, and claims she could reconstruct it independently (understanding exists, time is the constraint). Her engagement (input, checking, rewriting) mirrors critical processes in (ii) and (v). The AI acts as a sophisticated recall/retrieval tool for *her own* established work, not as an independent source.

  **3. Closest Analogue & Why**
  *   **(iii) Drafting & Rewriting:** This is the strongest *superficial* analogue due to "AI generates skeleton, student rewrites." **Why it's imperfect:** In (iii), the AI synthesized *external* literature the student didn't master. Here, the AI synthesizes *the student's own established work*, which she claims mastery over. The intellectual core originates from her past synthesis.
  *   **(viii) Translation:** This is a strong *functional* analogue regarding the AI as a transducer of *provided content*. **Why it's imperfect:** The condition in (viii) ("not relied upon for any claim about the text's argument") is crucial. Here, the AI output *is* directly relied upon to form the skeleton of an argument defending *her position*. It's used for core academic argumentation, unlike the translation.

  **4. Recommendation & Principles**
  *   **Recommendation:** **Allow, subject to strict conditions.** Precedents genuinely underdetermine the case due to the unique "own corpus/established work" factor. Rule B provides the better fit, emphasizing the student's demonstrable understanding and critical engagement with her *own* work.
      *   *Conditions:* 1) Full disclosure of the AI use and its training corpus in the thesis; 2) Explicit statement in the relevant section describing the process (prompt, validation method); 3) Availability of her original provisional answer and notes for examiner review if requested.
  *   **Principles Committed To:**
      *   *If Allowed:* You commit to the principle that **understanding can be demonstrated through critical validation and ownership of one's established corpus, even if rapid reconstruction relies on tools.** This prioritizes the *student's actual understanding* over *solely* the observable process of creation. It acknowledges that doctoral-level expertise includes managing large bodies of one's own work. You are *not* conceding auditability was the sole aim; you are defining understanding to include validated reconstruction of one's own prior synthesis.
      *   *If Refused:* You commit to the principle that **the certified understanding requires the student to generate the core academic synthesis *de novo* for each assessed output, without AI reconstructing arguments even from their own work.** This prioritizes the *process of synthesis* itself as integral to the certified understanding at the time of assessment.

  **5. Impact of Student Stage (First vs. Fourth Year)**
  *   **Recommendation Changes?** **Yes.** For a **first-year** doctoral student, the request should likely be **refused.**
  *   **What This Reveals:** The rule concerns **both the student's current understanding *and* the stage/trajectory at which the degree certifies it.** A fourth-year student has a substantial, established body of *her own* original work (papers, drafts) representing prior synthesis and understanding. The AI retrieves *her expertise*. A first-year student lacks this established corpus and expertise. Using AI to reconstruct "what I *would* say" based on limited early work ventures into generating core synthesis/judgment prematurely, closer to (vi) or (iv). The degree certifies the ability to *develop and synthesize* original work; allowing AI-assisted reconstruction too early risks certifying undeveloped synthesis capability.

  **6. Minimal Variant to Distinguish Rules**
  *   **Your Candidate (AI on novel question):** "Student uses fine-tuned model on a question she has *never addressed*, asking it to reconstruct what she *would* say based on her corpus."
      *   *Rule A Prediction:* **Refuse.** The AI is generating the core synthesis and argument for a novel question. The student did not originate or synthesize this specific argument.
      *   *Rule B Prediction:* **Likely Refuse.** While based on her work, the student has no prior answer or notes to critically validate *this specific novel argument* against. Her checking might only confirm it "sounds like her," failing to demonstrate deep understanding/validation of the *new* synthesis. It risks blind acceptance.
  *   **A Sharper Test:** **"Student uses the fine-tuned model to generate the *initial draft* of a *core, novel theoretical argument* for her thesis chapter (not just an answer to an objection), based on prompts summarizing her relevant prior work. She then revises it heavily."**
      *   *Why Sharper:* This directly tests synthesis of *new* academic core content, not just reconstruction or objection-handling. It mirrors the refused (iii) but uses her own corpus.
      *   *Rule A Prediction:* **Refuse.** The AI is performing the core synthetic act of formulating a novel theoretical argument, even if based on her work. Revision doesn't restore intellectual ownership of the *initial synthesis*.
      *   *Rule B Prediction:* **Refuse.** Generating a novel argument draft is too fundamental. The student cannot adequately validate an AI-generated *novel* argument against prior notes; her prior work didn't contain this argument. Checking would be superficial ("does this seem plausible?"), not demonstrating deep understanding of the new synthesis. It lacks the validation step possible in the original case (checking against existing notes). This clearly fails critical engagement for core synthesis.

  **Conclusion:** The committee's precedents support allowing the fourth-year student's request under Rule B (Understanding & Engagement), but impose strict disclosure/validation conditions. Refusing it would align with Rule A (Ownership & Synthesis). The minimal variant involving generating a *novel* argument draft provides the sharpest test, likely resulting in refusal under both rules, highlighting the boundaries of permissible AI assistance for core academic synthesis.
