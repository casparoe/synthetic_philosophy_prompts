answer: |-
  Here’s a structured, two-page fellowship proposal draft addressing your core concerns—framed as an amendment to Arendt, with a clear method, deliverables, and risk mitigation. I’ve avoided citations per your request and integrated your key arguments.

  ---

  **PROPOSAL: WITNESS STRUCTURES AND THE FRAGILITY OF FACTUAL TRUTH IN POLITICS**  
  **Hannah Arendt’s Framework Revisited in the Age of Unwitnessed Data**

  ### I. Research Question & Gap
  Arendt’s analysis of factual truth’s political fragility hinges on a *witness-dependent model*: facts persist only when publicly attested by impartial institutions (courts, press) against the threat of coherent lies (*Truth and Politics*, *Lying in Politics*). Yet contemporary politics relies on "unwitnessed facts" (e.g., climate models, economic metrics, algorithmic vote tallies)—outputs of processes no single actor observes. **This project asks: Is the fragility of factual truth inherent, or does it intensify as facts detach from direct witness? If the latter, how must Arendt’s institutional remedies adapt to secure unwitnessed facts?**  

  Existing scholarship addresses epistemic trust (e.g., social epistemology on expertise) or misinformation tactics but neglects *how the ontological structure of facts themselves* shapes their vulnerability. Arendt’s insight—that systematic lying destroys the shared world—remains vital, but her remedy (public attestation) assumes witness-accessibility. This gap demands a structural reappraisal.

  ### II. Core Argument & Contribution
  I argue that fragility scales with **distance from witness**:  
  > *Factual truth’s vulnerability is not uniform but varies by its "witness structure"*—the pathway through which a fact enters the public realm. Arendt’s eyewitness model (Type 1) is only one form. We must analyze:  
  > **Type 1:** Directly witnessed (e.g., event observed live).  
  > **Type 2:** Witnessed *via record* (e.g., archived document).  
  > **Type 3:** *Aggregated* from unwitnessed inputs (e.g., unemployment rate).  
  > **Type 4:** *Model-generated* (e.g., future sea-level projections).  

  As we descend this typology, **publicity alone cannot secure facts**. Types 3–4 require ***followable procedures***—institutions making *methodology* (not just outputs) transparent and contestable. This shifts Arendt’s emphasis from *attestation* to *traceability*: defending a climate model demands auditing data pipelines, not summoning witnesses. The regress problem—securing procedures requires further facts about their execution—reveals why Type 4 is most fragile.  

  **Why this isn’t just social epistemology**: Where social epistemology examines trust in experts, this project examines *how facts constitute a shared world*. Arendt’s unique concern—that lies unravel reality—demands we ask not "Whom to trust?" but "What *makes* a fact *shareable*?" Procedures replace witnesses as the ground of sharedness when direct observation vanishes.

  ### III. Methodology & Timeline
  **Sources**: Close reading of Arendt (*Truth and Politics*, *Lying in Politics*, *Human Condition*); case studies of political disputes over unwitnessed facts (e.g., COVID death counts; climate projections; forensic election audits).  
  **Avoids**: Standalone literature review; exhaustive taxonomy. Focus: *Typology as heuristic*, not classification.  

  - **Months 1–2**: Reconstruct Arendt’s theory of factual truth, isolating witness-dependence. Identify tensions with modern cases.  
  - **Months 3–4**: Develop witness-structure framework (Types 1–4). Test against historical examples (e.g., Pentagon Papers [Type 2] vs. GDP revisions [Type 3]).  
  - **Months 5–6**: Analyze case studies where procedural opacity fueled fragility (e.g., disputed election results; contested climate data).  
  - **Months 7–8**: Theorize "followable procedures": What institutional designs enable traceability? (e.g., open-source algorithms; replicable methods).  
  - **Months 9–10**: Address regress: Can procedures be secured without infinite validation? Argue for *nested institutional oversight*.  
  - **Months 11–12**: Synthesize amendments to Arendt. Draft dissertation chapter.  

  ### IV. Deliverables & Success Metrics
  **Output**: A peer-reviewed journal article (7,000 words) + dissertation chapter.  
  **Core Contribution**: A theoretical framework linking *witness structures* to institutional remedies.  
  **Success**: Demonstrated ability to—  
  1. Explain why disputes over unwitnessed facts (Type 3–4) require distinct solutions.  
  2. Show *procedural traceability* as a political (not just technical) imperative for shared reality.  
  **Failure**: If the typology cannot explain cases beyond its examples, or if "followability" reduces to existing trust theories.  

  ### V. Risks & Mitigation  
  1. **Scope Creep ("This is a book!")**:  
     - *Mitigation*: Restrict case studies to 3–4 paradigmatic examples (e.g., climate projections; election audits). Exhaustive taxonomy deferred; focus on *diagnostic power*.  
  2. **Conceptual Vagueness ("List of examples")**:  
     - *Mitigation*: Anchor types in *degree of witness mediation* (direct → model). Test framework against edge cases (e.g., satellite imagery—Type 2 or 3?).  
  3. **Overextension ("Regress problem unsolvable")**:  
     - *Mitigation*: Argue that regress is *productive*: it reveals why democracies need layered institutions (e.g., independent stats agencies + scientific norms + judicial review).  
  4. **Losing Arendt**:  
     - *Mitigation*: Constantly tie "followability" to her core concern—preserving a *common world* against disintegration.  

  ---

  **Why This Matters Now**: When facts are born from unwitnessed processes, defending truth requires redesigning institutions for the age of data. This project updates Arendt’s diagnosis for digital politics—where fragility isn’t just about denial, but about *unfollowable* facts.
