prompt: |-
  I've been teaching a grad seminar on the self this term and I keep running into a thing in discussion that I don't have a word for. I work mostly in epistemology, so I'm well outside that literature and probably reinventing something someone named twenty years ago. Would love to know whether it has a name.

  Here's the phenomenon. A person can come to disbelieve their own self-narrative and it still keeps pulling. Not a vague residue, an actual continuing grip on what they do and on what they'll say about themselves in the moment. Case one: a friend of mine spent thirty years with a story about himself, he's the kind of person who finishes what he starts. A few years back he decided, deliberately and with evidence, that it's false. He can rattle off six projects he walked away from, he'll tell you unprompted that it was a family myth, and he still can't leave a manuscript alone. He describes the pull in the first person while simultaneously disavowing it, and he isn't being ironic. Case two: a student who was assigned "you're the responsible one" by her siblings, sees perfectly well that it was imposed on her, resents it, and is nevertheless the person who books the flights every single time. What's odd is how it goes away: it fades by being acted against, slowly and unevenly, and it comes back under time pressure. Arguing against it does nothing, or nothing she can feel.

  The contrast case is what makes me think this is one thing and not just recalcitrant belief. Correct a merely factual bit of someone's autobiography, no you were born in April, and the old version loses its grip instantly and completely the moment they're convinced. So whatever this is, it attaches specifically to the parts of a life-story that have a shape: the "kind of person I am", the "where this is going", the evaluative and teleological bits rather than the dated ones.

  In my notes I've been calling it narrative drag, or residual gravity. It isn't quite habit, and it isn't like the alief business or like belief perseverance, those seem to be about single propositions or associations whereas this is shaped like a whole life. And it isn't straightforwardly what Dennett is after with the self as a centre of narrative gravity either, because on his picture the abstraction is supposed to be doing explanatory work, and here you have a story the person has explicitly withdrawn and it is still doing the work. Though maybe that just means the picture absorbs it and I'm not seeing how.

  So: does this have a name of its own, or is there a cluster of established concepts that carve it up between them? I want the carving, not the label — what exactly it is, what it is not, where its edges are, and whether the disavowed story is still that person's centre of gravity or whether something else has taken over while mimicking it. Also tell me if it tells against the gravity metaphor rather than sitting inside it.

  Be honest about your confidence. If there's no established term, say so plainly instead of finding me one. If you think I'm bundling three separate things under one description, split them and say which is which. If my contrast case is doing less work than I think, or the whole framing leans on a picture of self-narratives that nobody should accept, I'd rather be told that than get a polite answer. And if you reach for names and dates, don't bother — I can't look anything up from here and I won't trust a half-remembered citation anyway, so give me the views rather than who holds them.

  Write it as continuous prose, the way you'd write to a colleague: no headings, no bullet points, no bold, no tables. I know a table of nearest concepts and how each differs would be the obvious move here and I specifically don't want one, because I want to hand what you give me to my students as a letter.
reasoning: |-
  Okay, let me unpack this fascinating query from a professor teaching a grad seminar on the self. They're describing a phenomenon where self-narratives retain psychological grip even after being consciously disavowed, and they're seeking conceptual clarity. 

  First, I need to understand the core phenomenon: it's not just belief persistence but something more structural. The examples are vivid—the friend who disbelieves his "finisher" identity yet can't abandon manuscripts, the student who rejects the "responsible one" label but still books family flights. Key features: explicit disavowal + behavioral persistence + resistance to argument + slow fading through counter-action + resurgence under stress. 

  The contrast with factual autobiographical errors is crucial. Saying "you were born in April" corrects instantly, but evaluative narratives like "kind of person I am" have inertia. This suggests the phenomenon is tied to identity-constituting stories rather than discrete facts. 

  Now, scanning my knowledge: 
  - It's not habit (too cognitive), not alief (not automatic), not belief perseverance (too propositional). 
  - Dennett's narrative gravity doesn't quite fit because the disavowed story still exerts force. 
  - Possible connections: Schechtman's narrative self-constitution (stories as identity), but she doesn't address disavowal persistence. 
  - Frankfurt's wantonness? No, the subjects are reflective. 
  - Bourdieu's habitus? Close—embodied dispositions—but not explicitly narrative. 

  Ah, here's a thought: this might be what some call "narrative sedimentation"—where stories become embodied through repetition, creating inertial pull. Or "identity habits" from phenomenological traditions (Merleau-Ponty meets narrative theory). The teleological aspect echoes MacIntyre's narrative unity, but again, without the disavowal angle. 

  Bigger issue: The professor might be conflating two things—(1) internalized social scripts (student's case) vs (2) self-constructed identity themes (friend's case). Both show narrative drag, but mechanisms may differ: internalized roles versus autobiographical causality. 

  On the gravity metaphor: It holds if we think of narratives as massive objects—discarded stories still bend behavior like dead stars bending light. But the metaphor breaks if we demand a single "center"; here, multiple narratives coexist uneasily. 

  Most honestly? No established term captures this exactly. Closest clusters: 
  - Psychodynamic: unconscious identification 
  - Social psych: internalized roles 
  - Phenomenology: habitual narratives 
  But none fully integrate the narrative-disavowal-behavior triad. 

  I'll structure the response: 
  1. Affirm the phenomenon's novelty in their framing 
  2. Contrast with near-miss concepts 
  3. Suggest "narrative drag" is apt, with caveats 
  4. Propose mechanisms (embodiment, social reinforcement) 
  5. Discuss gravity metaphor's limits 
  All while maintaining collegial prose—no jargon dumps, just thinking aloud together.
answer: |-
  You've put your finger on something genuinely slippery, and I think you're right to suspect it doesn't have a single settled name—though it brushes against several established ideas. What's striking is how you've isolated it: the disavowed narrative retains *causal* and *phenomenological* force despite losing *doxastic* endorsement, specifically for those thick, evaluative strands of self-understanding that structure agency and teleology. Let's walk through why existing concepts don't quite capture it, and where the edges of your phenomenon might lie.

  First, it's distinct from mere habit or disposition. Habits are automatic responses to cues, often non-cognitive. Your student booking flights isn't just acting out of rote; she feels the *pull* of the narrative itself—the sense that "this is what I *do*, who I *am*"—even as she rejects that characterization. The narrative provides a tacit justification, a background rationale that habits lack. Similarly, it's not alief (Gendler's concept), which involves discordant automatic associations (e.g., feeling fear on a glass bridge while believing it's safe). Aliefs are sub-doxastic and atomistic; your cases involve a coherent, though disowned, *story* shaping deliberate action and self-interpretation under pressure.

  Belief perseverance also misses the mark. That's about clinging to a belief despite counter-evidence, often due to cognitive bias. Here, your friend *accepts* the counter-evidence—he's convinced the narrative is false—yet the story's gravitational force persists. This isn't epistemic stubbornness; it's as if the narrative has burrowed into the machinery of agency itself, operating independently of its truth status.

  Dennett's center of narrative gravity is a useful foil. On his view, the self *is* the abstraction generated by the narrative, so if the story changes, the center shifts. But in your cases, the disavowed narrative hasn't been replaced; it's been demoted from belief status yet remains functionally active. It's like a deprecated operating system still running in the background, handling certain tasks. This suggests that narrative self-constitution isn't monolithic. We might have multiple, semi-autonomous narratives operating at once, with the "center" being more of a contested field than a singular point. The disavowed story isn't the center, but it's still a significant mass in the system, bending behavior—especially under stress, when deliberative resources thin and older patterns reassert.

  So, what *is* it? I suspect you're bundling two intertwined elements: **embodied narrativity** and **social scaffolding**. 

  - **Embodied narrativity**: Over time, certain self-narratives become sedimented through repeated action and emotional reinforcement. They're not just cognitive scripts but bodily dispositions—your friend's compulsion to tinker with manuscripts is a felt orientation, a "habit of being" (drawing loosely on Merleau-Ponty). Arguing dislodges the belief, but not the embodied groove. Acting against it wears a new path slowly, like erosion.  
  - **Social scaffolding**: The narratives often originate or are amplified interpersonally. Your student's "responsible one" role is maintained by sibling expectations, familial logistics, and the sheer convenience of others relying on it. Disavowal doesn't dismantle this scaffold; the social feedback loop persists, reinforcing the behavior even when the personal belief has changed.  

  This pairing explains why factual errors lack drag: they lack the embodied and social entrenchment. Being born in April isn't a teleological theme woven into your actions and social world; it's a detached datum.

  Your "narrative drag" metaphor works well, with two caveats. First, drag implies inertia, but this is *active* persistence—less like a boat slowing after the engine cuts, more like a current pulling against the rudder. "Residual gravity" might be better: the story's mass still bends the space of possibility, warping choices under stress. Second, gravity metaphors risk implying a single center. Here, the disavowed narrative exerts force *without* being central; it's a peripheral mass with lingering influence. The self-system becomes polycentric, with friction between the endorsed self-narrative and the dormant-but-active one.

  Does this tell against Dennett? Only if we take his center as a real entity rather than a useful abstraction. Your cases show that the narrative landscape is messier than a single gravitational point—multiple narratives can exert simultaneous pulls, creating torsion in the self. But the core insight holds: the self *is* narratively structured, just more heterogeneously and conflictedly than sometimes acknowledged.

  If I were to carve it, I’d say this:  
  1. **Teleological-Evaluative Entrenchment**: The narrative must be identity-constituting ("kind of person I am") and action-guiding ("where this is going").  
  2. **Disavowal Without Disintegration**: Explicit rejection must coexist with behavioral/affective persistence.  
  3. **Embodied-Social Mechanism**: The persistence relies on ingrained bodily habits and/or ongoing social reinforcement.  

  Where it frays: If the narrative loses all affective pull and becomes mere behavior, it’s habit; if it retains belief-status despite counter-evidence, it’s perseverance. The tension between disavowal and grip is essential.

  In sum? No established term captures this exact configuration. "Narrative drag" or "residual gravity" are apt placeholders. The phenomenon suggests that self-narratives, once deeply embodied and socially embedded, can function as rogue agents—ghost scripts that haunt agency even after exorcism from belief. It’s a compelling argument for seeing selves as ecosystems of competing stories, some endorsed, some disowned, but all with gravitational heft. I’d love to hear how your students wrestle with it.
