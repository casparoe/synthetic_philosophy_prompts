  But wait: the rule says "take the widest class whose rate does not shift by more than 5 percentage points when you narrow it by any one further recorded property". We found that the class of payments, Friday, and after 6pm is stable because it has no eligible refinements (the only refinement by Priya is ineligible due to <20 data points). However, we must check if there is a wider class that is stable? We already checked the wider classes and they were not stable.

