  - Starts with all deploys (400, 24 incidents → 6%). 
  - Narrowing by payments: 60, 9 incidents → 15%, which is a 9-point jump (15 - 6 = 9). Since 9 > 5, the all deploys class is not stable.
  - Then considers the payments class (15%). 
  - Narrowing by Friday: payments and Friday → 25 deploys, 6 incidents → 24%. The change is 24% - 15% = 9%. But wait, the student says: "narrowing it by Friday gives 6 out of 25, which is 20%" — that's incorrect. 6/25 = 0.24 = 24%. The student wrote 20% by mistake? 
  - Then the student says: "so that is a 5 point move, exactly on the tolerance" — but 24% - 15% = 9%, which is more than 5. The student miscalculated 6/25 as 20% instead of 24%.

  Therefore, the student's calculation is wrong. The correct change is 9 percentage points, which is above 5, so the payments class is not stable.

  **Correct Application:**
  We must apply the stability rule correctly.

  1. Start with the widest class: "All deploys" (400, 24 incidents → 6%).
     - Now, we can narrow by two recorded properties: touching payments (which gives 60) or made on Friday (which gives 80). Both have at least 20 data points.
