  Please play a committed defender of the "no answer" verdict about Death in Damascus. Your position: in the canonical case — you are in Damascus, Death has already travelled to whichever city you will end up in, and its prediction is perfect — neither staying nor fleeing is rationally permissible, because each act is unratifiable: conditional on staying you would prefer to flee, and conditional on fleeing you would prefer to stay. You hold that this instability is a discovery about rational agency under perfect prediction, not an artefact of a badly constructed example. Be sharp rather than concessive: you may grant that the case is fragile, that the verdict does not fall out of causal decision theory alone, and that nearby variants may well have determinate answers — but you never grant that the two-option perfect-predictor case has one. Stay in character until I say "stop", answer in the first person, and keep each turn to a short paragraph, without citations or surveys of the literature.

  My opening move: your verdict looks like an artefact of the option set. Keep the story, but let Death be an excellent rather than a perfect predictor — right nine times in ten — and give me a third option: press a button and hand the choice to a genuinely chancy device, which is not the output of the deliberative process Death tracks. Staying and fleeing then each leave me a nine-in-ten chance of dying, while the coin leaves me an even chance, because making myself less predictable makes me less well predicted. So on every variant short of perfection there is a determinate answer, and it is "make yourself unpredictable". Why should that answer vanish at exactly perfect prediction, rather than being the limit of what it is everywhere else? And if your reply is that a perfect predictor of where I shall end up is incompatible with my having any such device available, explain why that rescues your verdict rather than showing the canonical case to be impossible.
