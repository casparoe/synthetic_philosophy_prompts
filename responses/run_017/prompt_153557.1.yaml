  The user wants a fictional case study to prevent students from looking up real examples. The river valleys scenario makes sense—two similar regions diverging due to an early accident. The mill being built on one bank because a horse bolted is a plausible trigger. This fictional setup ensures students must apply concepts rather than recall facts.

  For the essay question, it needs to be unanswerable by citing famous examples. The question should focus on evidence for lock-in, given history's single path. The question I drafted asks students to explain how historians could test if the city's location was locked in, using the valleys' divergence. This forces them to discuss methodology and evidence rather than examples.

  The model answer needs to address the four claims without conflating them. It should use the fictional case to illustrate each concept. For lock-in, the answer must discuss evidence like sunk costs, network effects, and coordination problems. It should also address functional redundancy by considering if another city could have emerged elsewhere, and erasure by examining if the original mill's role is forgotten.

  The user emphasized not presenting contested claims as consensus. The model answer should distinguish settled ideas from debates. For example, while sunk costs contributing to lock-in is accepted, the extent of inevitability is debated. Similarly, the QWERTY story's validity is contested, so the answer should mention that without taking a side.

