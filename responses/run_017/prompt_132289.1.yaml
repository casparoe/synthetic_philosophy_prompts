prompt: |-
  I work on the sustainability team at a mid-sized food manufacturer — protein bars, pasta, a couple of frozen things. Part of my job is maintaining an internal sourcing scorecard that every new ingredient has to pass through: 30 or 40 decisions a year, each one gets about half a day of an analyst's time, one page of output, then it goes to a VP who signs off and occasionally to a retail customer or an NGO who wants to see the working. It already has columns for carbon, water, land use, and a vertebrate welfare column that's basically numbers × welfare range × confidence. Crude, but nobody fights about it.

  The fight now is insects. We use cricket flour in one bar and black soldier fly larvae meal in a pasta, and we keep getting asked — internally, and by customers — whether insect deaths belong in the scorecard and with what weight. The case for is the scale thing: per tonne the individual count is somewhere in the high six figures (our own numbers, could easily be off by an order of magnitude), so a 1% or even 0.1% probability that they're sentient, times a small welfare range, gives an expected welfare cost that swamps the vertebrate column entirely. Every EV calc we run comes out saying insect numbers dominate everything else we do, that we should basically reorganise the supply chain around not farming insects, and also conceivably around reducing ant and termite populations on the land we source from — which is not something anyone here will put in a supplier contract.

  I've read enough of the forum material on this to know the names for the problem — fanaticism, Pascal's mugging, cluelessness, moral uncertainty, the worry that wild insect lives are net negative so the sign of the effect flips depending on who you ask. One analyst has proposed an "anti-fanaticism cap" (no single category can move the total score by more than X) and another says that's just cowardice with a formula attached. "Apply your favourite decision theory harder" is not something I can put in front of a VP.

  So: give me a procedure my team can actually run. Ordered questions, what counts as a sufficient answer to each, where it stops with a no, and where it hands the thing to a human because the question is one of values or of sign-of-effect rather than of fact. Constraints: runnable by someone with no philosophy background in half a day; must not depend on any single contested empirical claim about insect sentience (tell me if that's impossible); has to be defensible to a skeptical CFO and to an animal-welfare NGO looking over the same page.

  Then run it on three live-ish cases. (1) Swapping the cricket flour in the bar for pea protein. (2) Our larvae supplier offering to switch kill method from freezing to a gradual-chilling process at a cost premium — is that worth paying for? (3) Moving our plant protein to a certified "regenerative" source that skips insecticides but needs roughly 40% more land, where more land plausibly means more wild insects, whose lives may be net negative. I have a suspicion about which one gives an answer I won't like; tell me if I'm right.

  Two more things. Mark the places where judgement genuinely can't be eliminated and where the procedure will misfire, and say plainly what it can't do. And separate what's actually settled among people who work on this from what's contested — I'd rather have an honest "this is a live dispute and here's the one-line version of each side" than a smooth consensus that doesn't exist. Also flag which empirical results, if they landed either way, would change the procedure rather than just the numbers going into it.
reasoning: |-
  Alright, let me unpack this user's problem. They work in sustainability at a food manufacturer and need a practical way to handle insect welfare in their sourcing scorecard. The core issue is that including insects could dominate all other welfare calculations due to sheer numbers, leading to counterintuitive recommendations like avoiding insect farming or even reducing wild insect populations. 

  First, I need to understand their constraints: half-day analysis time, no philosophy background required, defensible to both CFOs and NGOs. They explicitly want to avoid relying on single contested claims about insect sentience. The three test cases are crucial for stress-testing any solution.

  Hmm... the user's clearly done their homework—they name-drop fanaticism and Pascal's mugging—so I can skip explaining those. Their frustration with theoretical debates ("apply your favourite decision theory harder") tells me they need concrete steps, not philosophy. The "anti-fanaticism cap" proposal shows their team is already wrestling with value judgments disguised as math.

  Key challenges popping out:
  - **Uncertainty management**: How to handle 6-7 orders of magnitude uncertainty in insect sentience without letting extreme probabilities drive decisions.
  - **Value vs fact separation**: Where to draw the line between empirical questions (e.g., "do insects feel pain?") and normative ones (e.g., "should we care 0.1% as much?").
  - **Wild insect paradox**: If wild insect lives are net negative, more land for regenerative ag might be "good"—but that conclusion would horrify NGOs.

  For structure, I'm thinking a phased approach: 
  1. **Boundary-setting first**: Decide upfront whether to even include insects, using a quick triage. This avoids wasted analysis.
  2. **Controlled quantification**: If included, cap the welfare range relative to vertebrates (e.g., max 0.1%) to prevent fanaticism. Document this as a value choice.
  3. **Wild insect opt-out**: Treat wild impacts as "unactionably uncertain" given sign-of-effect disputes.  

  For the test cases:
  - **Cricket-to-pea swap**: Probably doesn't pass triage since cricket farming is intentional. Cap would make the impact visible but manageable.
  - **Humane killing premium**: Welfare range cap makes this calculable—if chilling reduces suffering by Y%, is it worth $X? 
  - **Regenerative land trade-off**: Here's the landmine. More land might mean more (presumed net-negative) wild insects. Procedure should flag this as unactionable.

  Biggest risk: The cap feels arbitrary to NGOs, while excluding wild impacts feels cowardly to effective altruists. Gotta be transparent that this is about decision hygiene, not truth-seeking. Also, any future evidence of insect sentience beyond 0.1% vertebrate-equivalence would break the cap—so note that as a trigger for revision.

  ...Wait, did they imply they suspect case #3 is problematic? Yeah, definitely. The procedure should explicitly call out when it "bites the bullet" by excluding data versus when it's truly neutral.
answer: |-
  Here’s a practical, defensible procedure for your insect welfare scoring dilemma, designed for half-day analysis by non-philosophers. It avoids fanaticism, separates facts from values, and flags irreducibly contested judgments. The core idea: **triage insects into "actionable" (farmed) vs. "unactionable" (wild) categories, apply a *welfare range cap* to prevent dominance, and explicitly outsource sign-of-effect judgments**.

  ### Procedure: Insect Welfare Scoring (30-45 min/ingredient)
  **Step 1: Triage – Is this insect death *actionable*?**  
     - **Question:** Were the insects *intentionally bred or cultivated* for this ingredient?  
       - *Sufficient answer:* Supplier documentation confirms farming (e.g., controlled BSF/cricket facilities).  
       - **If NO:** Stop. Do not include in scorecard (e.g., wild ants in crops).  
       - **If YES:** Proceed to Step 2.  
     - *Judgment call:* "Intentional farming" is bright-line to avoid wild insect controversies. NGOs may push back; document that wild impacts are excluded due to sign-of-effect uncertainty.

  **Step 2: Apply Welfare Range Cap**  
     - **Question:** Assign a maximum welfare range (WR) for insects *relative to vertebrates*.  
       - *Default rule:* Cap WR at **0.1% of vertebrate-equivalent** (e.g., if a chicken = 1, max insect WR = 0.001).  
       - *Why 0.1%?* Pragmatic: Prevents fanaticism while acknowledging uncertainty. Based on current scientific skepticism about insect consciousness (e.g., lack of neural substrates for valenced experience).  
       - **Adjustable:** Let VPs set cap % (e.g., 0.01%-1%) but *require explicit approval* for any cap >0.1%.  
     - *Output:* Welfare Cost = (Individual count) × (WR cap) × (Confidence score).  
     - *Judgment call:* The cap % is a *value choice* (not fact). CFOs/NGOs must accept it upfront.

  **Step 3: Address Method-Specific Suffering (if applicable)**  
     - **Question:** Does farming/killing method change expected welfare cost *within capped WR*?  
       - *Sufficient answer:* Peer-reviewed data on method (e.g., freezing vs. chilling). If none, use "low confidence" discount.  
       - *Output:* Adjust welfare cost by estimated suffering multiplier (e.g., gradual chilling = 0.5× freezing).  
       - **If no data:** Use baseline assumption (no adjustment).  

  **Step 4: Flag for Human Review**  
     - Automatically escalate if:  
       - Wild insects are central (Step 1 "NO" but stakeholder insists).  
       - Ingredient affects wild insect populations (e.g., land-use changes).  
       - Confidence in sentience claims is *high* but cap is contentious.  

  ---

  ### Settled vs. Contested  
  | **Aspect**               | **Settled (Operational Consensus)**                                  | **Contested (Live Disputes)**                                                                 |  
  |--------------------------|----------------------------------------------------------------------|-----------------------------------------------------------------------------------------------|  
  | **Including farmed insects** | Yes – Intentional breeding implies responsibility.                  | *Should wild insects count?* EA: "Yes, scale demands it!" Biologists: "Net welfare unknowable." |  
  | **Capping welfare range** | Necessary to avoid fanaticism; 0.001–0.01 WR common in industry tools. | *Cap level:* 0.1% too high (skeptics) vs. too low (insect sentience advocates).                |  
  | **Wild insect sign**      | Net welfare sign (positive/negative) is unactionably uncertain.      | *Some EAs argue:* "Assume net negative until proven otherwise" → Land expansion = "good."     |  

  ---

  ### Run on Test Cases  
  **Case 1: Swapping cricket flour for pea protein**  
  - Step 1: Cricket farming = **actionable** (YES).  
  - Step 2: Apply WR cap (e.g., 0.001). Welfare cost = (1M crickets/tonne) × 0.001 = **1,000 vertebrate-equivalents/tonne**.  
  - Step 3: No method change.  
  - **Result:** Scorecard shows cricket welfare cost (capped). Vs. pea protein (no insect cost), swap likely favored.  
  - *Defensibility:* "Capped cost acknowledges uncertainty; swap reduces *manageable* risk."  

  **Case 2: Switching BSF kill method (freezing → gradual chilling)**  
  - Step 1: BSF farming = **actionable** (YES).  
  - Step 2: Apply WR cap (0.001).  
  - Step 3: *If* evidence shows gradual chilling halves suffering, welfare cost = (Baseline) × 0.5.  
  - **Result:** Pay premium if cost/suffering reduction > your internal $/welfare threshold.  
  - *Defensibility:* "Cost-benefit within capped welfare range; premium justifiable if data robust."  

  **Case 3: "Regenerative" plant protein (less insecticide, +40% land)**  
  - Step 1: Wild insects on expanded land = **NOT actionable** (NO). Stop.  
  - **Result:** Scorecard only counts: + Land use (carbon penalty) + pesticide reduction (water/ecotoxicity bonus). **Wild insect impact excluded.**  
  - *Defensibility:* "Wild insect welfare is unactionable: net effect unknown and not our direct responsibility."  
  - **Your suspicion is correct:** This avoids endorsing "more land = good" (if insects net negative) or "bad" (if net positive). NGOs may protest exclusion; CFOs will like cost clarity.  

  ---

  ### Where Judgment Can’t Be Eliminated & Failure Modes  
  - **Irreducible judgments:**  
    1. **Welfare cap %** (Step 2): A value choice. Must be set by leadership.  
    2. **Actionability threshold** (Step 1): "Intentional farming" excludes wild insects; purists will call this arbitrary.  
    3. **Sign-of-effect for wild insects:** Procedure dodges this by exclusion.  
  - **Failure modes:**  
    - NGOs demand wild insect inclusion → Procedure forces VP-level review ("We lack consensus on net welfare").  
    - New evidence shows bees feel pain like mammals → **Breaks the cap.** Requires re-evaluating WR % (empirical trigger).  
    - Supplier hides farming practices → Mis-triage at Step 1. Mitigate with audits.  
  - **What it can’t do:**  
    - Resolve moral uncertainty (e.g., "Is 0.1% WR *right*?").  
    - Handle wild insects credibly.  
    - Appease both CFOs and EA-aligned NGOs simultaneously on cap magnitude.  

  ### Conclusion
  This procedure **prevents insect metrics from dominating your scorecard** via the welfare cap, **sidesteps the wild insect paradox** by triage, and **forces value judgments upstairs**. For your cases:  
  - Case 1: Favors swapping out crickets (capped cost visible).  
  - Case 2: Allows humane investment *if* data supports it.  
  - Case 3: Excludes wild insects entirely (your suspected pain point).  

  **Empirical triggers for revision:**  
  - If meta-studies confirm insect sentience > vertebrate-equivalent 0.1% (e.g., via functional pain pathways), revisit cap.  
  - If reliable wild insect welfare accounting emerges (unlikely soon), revisit triage.  

  Run this past your VPs first to lock in the welfare cap % and triage logic. Transparency about the cap’s role in avoiding fanaticism will strengthen your case to skeptics: *"We account for insects without letting hypotheticals override measurable impacts."*
