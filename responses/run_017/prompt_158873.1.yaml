     - You use description length (like in two-part codes) as a measure of complexity. Kolmogorov complexity is the gold standard but uncomputable. Your two-part code is a computable approximation. The relativity to the description language is inherent, but in SI the additive constant in the dominance result mitigates the arbitrariness.

  5. **M-open World**:
     - You operate in an M-open world. SI handles M-open by having a prior over all computable environments. However, the convergence is in log-loss and asymptotic. For finite samples and M-open, model averaging might be more robust, which is what you do.

  What is your vocabulary missing? 
  - The formal connection between compression and prediction (via the dominance result) is a deep insight that justifies the use of simplicity as a guiding principle. It provides a theoretical foundation for MDL and Bayesian model selection. However, the uncomputability and asymptotic nature mean that in practice, we use approximations (like the ones you do).

  What was the philosopher's claim not clearly saying?
  - The philosopher might have understated the practical limitations (uncomputability, asymptotic) and the dependence on log-loss. Also, the relativity to the UTM is often glossed over. The claim that SI "settles" the question of simplicity is too strong because it leaves open the practical implementation for finite samples and different loss functions.

  ### Conclusion

  - Your description-language audit is a practical way to test sensitivity to description language, but it is not exactly the same as UTM relativity because you are not using minimal descriptions. It does reveal that your two-part code rankings are language-dependent, which is a real issue.
  - The convenience choices (smoothness, etc.) are not directly covered by the a priori argument of SI; they are more about bias-variance tradeoff. The SI reply is that the prior is about compression and long-run prediction, but it doesn't override the finite-sample considerations.
  - You are correct about the scoring rule: the dominance result is for log-loss. Changing the scoring rule changes the optimal predictor. Your colleague is correct that for log-loss, the result holds, but if the goal is different, then we are changing the subject.

