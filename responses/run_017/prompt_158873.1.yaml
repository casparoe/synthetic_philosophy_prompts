  The philosopher's claim about Solomonoff induction (SI) is that it provides a canonical simplicity-weighted prior over computable hypotheses, with a dominance result. We restate the key components:

  1. **Universal Prior**: 
     - In SI, the prior probability of a hypothesis (which is a program that computes the data) is determined by its Kolmogorov complexity (K) relative to a fixed universal Turing machine (UTM). The prior is: `P(h) = 2^(-K(h))` (normalized by a constant, but note the normalization constant is uncomputable and infinite, so we often work with semi-measures).
     - In your terms: It's like having a two-part code where the model is described by a program, and the code length is the length of that program. The prior exponentially downweights complex models (longer programs). However, note that the set of all programs is countable, but the prior is defined over all computable hypotheses (which are countable) but the prior itself is not computable.

  2. **Dominance Result**:
     - The key result is that for any computable probability distribution (the "true environment"), the posterior predictive distribution from the universal prior will, in the limit of infinite data, converge to the true distribution faster than any other computable predictor. Specifically, the cumulative Kullback-Leibler (KL) divergence (or log-loss) between the true distribution and the SI predictor is bounded by a constant (which is the Kolmogorov complexity of the true environment). 
     - In your vocabulary: It's about cumulative log-loss over an infinite sequence of observations. This is not directly about finite-sample predictive scores (like AIC, WAIC, or cross-validation) but about asymptotic behavior. The constant is related to the complexity of the true model (if it exists in the class) but note that the true environment might not be in your candidate set (M-open). 

  3. **Kolmogorov Complexity (K)**:
     - This is the length of the shortest program (in bits) that can produce the hypothesis (or the data) on a fixed UTM. It is a measure of descriptive complexity. 
     - Stretch: In your work, you often use description length in a two-part code (model plus data given model). Kolmogorov complexity is a one-part code for the entire data string, but it can be related to two-part codes via the Kolmogorov structure function. Also, note that the complexity is relative to the choice of UTM. Changing the UTM changes K only by an additive constant (the length of a simulator for one UTM on the other). 

  4. **Relativity to Universal Machine**:
     - The complexity of a hypothesis (or data) depends on the choice of UTM. However, the dominance result holds because the additive constant in the complexity (due to the choice of UTM) becomes part of the multiplicative constant in the dominance result. Thus, for any two UTMs, the difference in the cumulative log-loss is bounded by a constant (which is the length of an interpreter between the two machines). 

  5. **Incomputability**:
     - Kolmogorov complexity is uncomputable. There is no algorithm that can compute the shortest program for an arbitrary string. Therefore, the universal prior is also uncomputable. This means we cannot use SI in practice. We use approximations (like MDL with restricted model classes, or using a particular two-part code). 

  6. **Justification of Simplicity**:
     - The argument is that the prior is a priori because it does not depend on the data. The dominance result is a mathematical consequence of the construction. However, the choice of UTM is arbitrary, so the entire setup is relative to that choice. Some argue that the arbitrariness of the UTM makes it pragmatic, but the dominance result (which holds for any fixed UTM) is a strong argument for the form of the prior.

