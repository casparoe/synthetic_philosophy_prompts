  - In your audit, if the ranking flips, that might be because the additive constant (the interpreter) is large enough to overcome the original complexity difference. But note: in practice, the two-part code you use in your audit is a particular choice of description language (like a programming language). The Kolmogorov complexity is defined for the most compact language (a UTM) and is the minimal description length. Your audit might be using two languages that are not optimal (so the description lengths are not minimal) and the flip might be due to the inefficiency of one language for expressing one of the models. 
