  - Thus, your suspicion is correct: the a priori argument for simplicity in SI does not directly cover the finite-sample bias-variance tradeoff. The SI justification is asymptotic and about compression. The convenience choices you make (smoothness, etc.) are driven by the finite-sample context and the structure of your problem. However, one might argue that the SI prior is a formalization of the idea that we should prefer models that are easier to describe (which includes smoothness and low-dimensional structure) because they are less prone to overfitting.

  **Third Suspicion: Dominance Result and Scoring Rules**
  - You claim that the dominance result (which is for cumulative log-loss) does not necessarily hold for other scoring rules (like squared error on a bounded horizon or interval coverage). Your colleague says that changing the scoring rule is changing the subject.
  - The dominance result in Solomonoff induction is indeed for log-loss (or equivalently, KL divergence) in sequential prediction. Log-loss has the property of being strictly proper and is intimately connected to compression and probability. 
  - For other scoring rules, the result does not directly apply. There are extensions to other proper scoring rules, but they may not have the same dominance property. For example, squared error is a proper scoring rule for the mean, but it does not capture the entire distribution. Interval coverage is a different metric. 
