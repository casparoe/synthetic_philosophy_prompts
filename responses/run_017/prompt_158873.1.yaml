  - However, note that if the true distribution is known, then the optimal predictor for any proper scoring rule is the true distribution. But in SI we are predicting without knowing the truth. The universal prior is optimal for log-loss but not necessarily for other losses. 
  - The confusion might be about the goal: if the goal is to minimize cumulative log-loss, then SI is optimal (up to a constant). If the goal is to minimize squared error over a bounded horizon, then a different approach might be better. 
  - This has a name: it is about the choice of the loss function. The optimality of SI is loss-function specific. 

  ### Part 3: The Residue Report

