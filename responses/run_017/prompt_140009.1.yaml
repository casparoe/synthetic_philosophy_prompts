  ### Translation Table

  | Benacerraf Claim/Move | PL Semantics Construction | Verdict | Distortion/Notes |
  |------------------------|----------------------------|---------|------------------|
  | **Uniformity requirement**: Mathematical and empirical discourse share a homogeneous Tarskian semantics (denotation, domains, quantifiers). | Single interpretation function \( \llbracket \cdot \rrbracket \) mapping terms (e.g., numerals) to a unified semantic domain \( D \), with quantifiers ranging uniformly over \( D \). | **Translates cleanly** | No distortion. This is syntactic uniformity in denotational semantics. |
  | **Causal constraint**: Reference/knowledge requires causal contact with objects. | Operational semantics where closed terms reduce to inspectable values (e.g., canonical forms). "Contact" ≈ ability to compute/observe a value via reduction. | **Translates with distortion** | Distortion: Causality is physical; computation is abstract. Operational semantics models evaluation, not spatiotemporal causation. |
  | **Domain outruns contact**: Mathematical objects (e.g., uncountable sets) exceed causal access. | Semantic domain \( D \) contains elements not denotable by any closed term (i.e., non-definable elements). | **Translates cleanly** | Directly: The gap between \( D \) and the set of definable elements (e.g., in \( \omega \)-models vs. standard models). |
  | **No account satisfies both**: Tension between uniform semantics and causal epistemology. | Incompatibility between a "rich" \( D \) (e.g., full set-theoretic model) and requiring all elements to be computable/definable. | **Translates cleanly** | Captured by e.g., non-adequacy of a denotational semantics w.r.t. operational behaviour when \( D \) is too large. |
  | **Structuralist escape**: Objects are roles in structures, not self-subsistent. | Quotienting \( D \) by isomorphisms or using universal properties (e.g., initial algebras). | **Translates with distortion** | Distortion: Structuralism addresses ontology; quotienting is syntactic. Survives as focus on definability up to isomorphism. |
  | **Plenitudinous escape**: Proliferate objects (e.g., any consistent structure exists). | Model-theoretic "anything consistent is realisable" (e.g., via term models). | **Translates cleanly** | E.g., term models in completeness theorems. |
  | **Nominalist escape**: Reject abstract objects; rewrite mathematics syntactically. | Syntactic rewriting (e.g., proof terms without denotation) or erasure to untyped operational semantics. | **Translates cleanly** | Proof irrelevance or extraction to computational content. |
  | **Modest escape**: Drop uniformity; separate semantics for math/empirical discourse. | Distinct interpretation functions: e.g., \( \llbracket \cdot \rrbracket_{\text{math}} \) (proof-relevant) vs. \( \llbracket \cdot \rrbracket_{\text{emp}} \) (observational). | **Translates cleanly** | E.g., logical relations for math vs. operational for empirical. |

