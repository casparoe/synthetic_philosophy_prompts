     - **Consequence**: Benacerraf’s constraint is meant to explain *how reference is fixed*; your mapping only ensures reference *can be* fixed syntactically.  

  **Verdict**: Your mapping **captures the structural core** (inaccessibility of domain elements) but **drops the metaphysical motivation**. This is fatal to Benacerraf’s dilemma *as stated*, but reveals its reliance on contested assumptions about reference. In your framework, the "dilemma" reduces to a trade-off between domain richness and computational realism—a familiar engineering compromise.

