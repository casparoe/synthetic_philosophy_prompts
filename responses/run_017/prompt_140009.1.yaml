  ### Assessment of Your Mapping
  **Proposal**: Map "causal contact" to **grounding-completeness**: every element in \( D \) is denotable by a closed term reducing to an inspectable value.  
  **Where it succeeds**:  
  - Captures the **access problem** as a definability gap (e.g., non-standard elements in a model).  
