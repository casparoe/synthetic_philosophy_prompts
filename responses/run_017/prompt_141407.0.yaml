answer: |-
  ### Analysis of Your Working Rule
  Your working rule has two clauses:  
  1. **Extensive division**: Each party gets undiluted control over some distinct part of the disputed matter.  
  2. **Baseline comparison**: Each party ends up nearer to their own goal than if the quarrel had been fought to a decision.  

  The **extensive division clause** survives partially—it often enables genuine gains but isn't strictly necessary (e.g., Case E succeeds without it). The **baseline comparison clause** is sound but needs refinement: the baseline must be the "no-agreement outcome" (BATNA—Best Alternative to a Negotiated Agreement), defined as the expected result if parties fail to settle and pursue their next-best option (e.g., fighting, coin flip, or imposed outcome).  

  The **damage** lies in the baseline's inconsistent application across your cases:  
  - In A and G, you implicitly use the BATNA baseline (conflict outcome), but in others (e.g., B), you measure against "pure wins" (what parties wanted ideally). This creates tension.  
  - The extensive/intensive distinction is useful but secondary; the core issue is whether the settlement beats the BATNA and respects non-negotiables. Intensive divisions often fail because they dilute what parties value absolutely.  

  ### Principle  
  **A settlement is a genuine gain from trade if each party prefers it to their BATNA (the expected outcome if no agreement is reached), and it does not force any party to violate a non-negotiable principle (a principle they would not abandon even for the settlement's full benefits).**  

  ### Clauses  
