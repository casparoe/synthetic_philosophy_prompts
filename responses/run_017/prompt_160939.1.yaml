prompt: |-
  hey — I run a small research and forecasting team (6 people, no philosophy PhDs, mostly econ / policy / bio backgrounds) at a grantmaking org. Every week we publish an internal sheet with maybe 12 headline forecasts and a confidence on each, and those numbers get used to move real money. We already do calibration training and we aggregate with a prediction-market-ish thing; that part is fine, don't redesign it.

  What we have no rule for is higher-order evidence. You know the shape: not evidence about the topic, evidence about your evidence — that a teammate disagrees, that your track record on this *class* of question is bad, that you were sleep-deprived / had a couple of drinks / had just read a forum thread that made you angry. Half the time we handle this by vibe, and the vibe is usually "split the difference," which I'm fairly sure is wrong in at least two distinguishable ways.

  Three things I want built into whatever you give me. I half-invented these names, and I want you to actually engage with them rather than dissolving them back into the textbook cases:

  1. **HOE laundering.** The same disagreement getting counted twice — once as first-order content (their reasons, which we can inspect and reject) and once as the bare fact that an independent-ish person disagrees, which mysteriously still moves us. Plus the adversarial version: someone can *manufacture* higher-order evidence by disagreeing loudly, and I want to know what the procedure says when the disagreement is cheap to produce.
  2. **Domain-local vs. global reliability.** My calibration on macro questions is garbage. Does that licence moving me on a question about protein folding, or about a specific country's election? Likewise "I'm tired tonight" — local in *time*, and possibly moot if my reasoning is fully written out and checkable by someone else. I think there's a real distinction here about when reliability evidence does *no work* because the first-order argument is fully surveyable, and I want it in the procedure, not footnoted.
  3. **The publication gap.** What number goes in the sheet when nobody's first-order view moved but everyone's second-order view says our first-order reasoning is unreliable? This is the epistemic akrasia thing. I want the procedure to be honest about whether "I still think P, and I think my thinking about P is distorted" is irrational, merely awkward, or actually the correct resting place — and, separately, what we *write down* and *do*, since those can come apart.

  So: give me a procedure my team can actually run. Ordered questions; what counts as a sufficient answer to each; where it exits with a no; and where it hands the decision to a person because the remaining question is one of values or appetite for risk rather than fact. It has to be runnable in 15 minutes on a Slack thread or 30 minutes in a meeting, by people who have never read a word of epistemology. No citations, no paper names, no "as so-and-so argues" — I don't care who said it, I care whether the move works. If a step needs a distinction from the literature, name it in plain words, define it in a sentence, and move on.

  Then run it on four of our actual recurring situations:

  (a) A teammate with a measurably *worse* track record than the group on this question class disagrees hard with our 70%.
  (b) We realise, mid-writeup, that all six of us read the same thread, so our apparent agreement isn't independent. (I think this one should make us *less* confident, not more, but I want the procedure to say it and not me.)
  (c) Our field analyst — best track record on the team, has actually been in the region, has reasons we can't fully verify — insists we're wrong. Nobody on the team is moved first-order. I suspect the honest output here is a number nobody endorses, and I want you to say so if that's where it lands.
  (d) Somebody wrote their section at 2am and says so, but the reasoning is fully laid out and the rest of us can check every step.

  At least one of these should come out in a way I don't like. Don't soften it to make me happy.

  You're a professional epistemologist who has also spent years shipping an actual weekly forecast — think of yourself as someone who's done both, and who finds the pure theory a bit under-specified for practice. Take your time and think carefully. Before you start writing, brainstorm privately: at least six ways small teams get higher-order evidence wrong, and at least three cases where HOE should not move you *at all*. Don't paste the brainstorm into the answer; just let it shape the procedure.

  Format: prose first, then a table, then JSON. The table should have exactly these columns — `Step` | `Question to ask` | `What counts as a sufficient answer` | `Where it exits` | `Who signs off`. After that, one JSON object and nothing else after it, with exactly these fields:

  - `steps`: array of strings, one short line per step, in order
  - `stop_rules`: array of strings — the conditions under which the procedure halts with a no
  - `judgment_calls`: array of objects `{question, why_it_cant_be_proceduralized}`
  - `worked_cases`: array of objects `{case_id, verdict, uncomfortable, one_sentence_rationale}` where `uncomfortable` is true or false
  - `known_failure_modes`: array of objects `{name, symptom, what_the_procedure_does_about_it}`
  - `what_the_procedure_cannot_do`: string

  Also drop in a few lines — not a whole section — on what will predictably go wrong the first time we run this.
reasoning: |-
  We are constructing a procedure for handling higher-order evidence (HOE) in a small forecasting team. The team publishes weekly forecasts with confidence levels that influence funding decisions. The procedure must address three core concerns: HOE laundering, domain-local vs. global reliability, and the publication gap. It should be executable in 15-30 minutes by non-philosophers.

  ### Brainstorm (not for output)
  - Ways teams get HOE wrong:
    1. Double-counting disagreement (once as first-order, once as HOE).
    2. Not discounting for non-independence of opinions.
    3. Over-adjusting for global unreliability when local reasoning is sound.
    4. Ignoring adversarial HOE (loud disagreements that are cheap to produce).
    5. Confusing "I feel uncertain" with actual HOE.
    6. Failing to separate when HOE should move the estimate vs. just flag for review.
  - Cases where HOE should not move you at all:
    1. When the first-order reasoning is fully surveyable and checked, and the HOE is about a temporary state (like tiredness) that didn't affect the written reasoning.
    2. When the HOE is from a source with no relevant domain reliability (e.g., a teammate with poor track record in an unrelated domain).
    3. When the disagreement is not genuine (adversarial) and can be identified as such.

  ### Procedure Design Principles
  - **Ordered Steps**: To prevent double-counting and ensure clarity.
  - **Explicit Exit Rules**: To halt when no HOE adjustment is needed.
  - **Human Judgment Calls**: For values/risk appetite or when procedural rules don't cover.
  - **Focus on Independence and Relevance**: Key to handling laundering and domain issues.
  - **Publication Gap**: Acknowledge when the output might not match personal beliefs.

  ### Procedure: Step-by-Step
  The procedure is triggered when higher-order evidence is raised about a forecast. It runs per forecast item.

  **Step 1: Identify the HOE**  
  - Ask: "What specific higher-order evidence is being raised? (e.g., disagreement, lack of independence, personal state, track record)"  
  - Sufficient answer: A clear statement of the HOE (e.g., "Teammate X disagrees with 70%", "We all read the same source", "I wrote this at 2am").  
  - Exit if: No specific HOE is identified (e.g., vague unease). Then no adjustment.  
  - Sign-off: Forecaster raising the issue.

  **Step 2: Check Relevance and Independence**  
  - Ask: "Is this HOE about the reliability of the reasoning process for this specific forecast, and is it independent of the first-order evidence?"  
  - Define:
    - *Relevance*: Does the HOE bear on how likely we are to be wrong? (e.g., tiredness when reasoning was rushed; track record in the same domain).
    - *Independence*: Is the HOE not derived from the same first-order evidence? (e.g., disagreement from someone who saw different data is independent; disagreement from someone who saw the same data might not be).  
  - Sufficient answer: Yes (relevant and independent) / No (not relevant or not independent).  
  - Exit if: HOE is not relevant or not independent. Then no adjustment.  
  - Sign-off: Team lead (to avoid self-serving exits).

  **Step 3: Assess Impact Scope**  
  - Ask: "Does this HOE apply globally (e.g., overall track record, tiredness) or only locally (e.g., specific to this question type, or moot because reasoning is surveyable)?"  
  - Define:
    - *Global*: Affects many forecasts (e.g., general calibration, chronic fatigue).
    - *Local*: Affects only this forecast or a narrow class (e.g., drunk last night, track record in macroeconomics for a macro forecast).  
  - Sufficient answer: Global, local, or mixed.  
  - Exit if: HOE is local and the reasoning is fully written and surveyable (others can check steps). Then no adjustment.  
  - Sign-off: Team consensus (quick vote).

  **Step 4: Quantify HOE Effect (or Not)**  
  - Ask: "By how much should we adjust the confidence, given the HOE?"  
  - Sufficient answer:  
    - If disagreement: Use a pre-agreed formula (e.g., for a disagreeing teammate, adjust by `(their confidence - our confidence) * weight`, where `weight` is based on their domain-specific track record).  
    - If non-independence: Adjust towards base rate (e.g., if all read same thread, move confidence halfway to 50% or team base rate).  
    - If personal state/track record: Adjust by pre-set amounts (e.g., -10% for "tired" if reasoning not surveyable, -15% for poor domain track record).  
    - If no clear quantification: Flag for human judgment (Step 5).  
  - Exit if: Adjustment is quantified and applied.  
  - Sign-off: Team lead (to ensure consistency).

  **Step 5: Human Judgment Call**  
  - Ask: "Given the HOE, what should the final confidence be?"  
  - Sufficient answer: A number after discussion, considering:  
    - Values/risk: How much do we care about avoiding false positives vs. negatives?  
    - Unexcluded HOE: Cases where adjustment isn't quantifiable but feels important.  
  - Exit: Always produces a number.  
  - Sign-off: Team lead (final say).

  **Publication Gap Handling**:  
  - If the process results in a confidence that no one personally endorses (e.g., "We publish 60% but I still feel 70% is right"), note it in the internal log. The published number is the adjusted one, as the HOE procedure overrides individual akrasia for decision purposes.

  ### Table Format

  | Step | Question to ask | What counts as a sufficient answer | Where it exits | Who signs off |
  |------|----------------|-----------------------------------|---------------|-------------|
  | 1. Identify HOE | "What specific higher-order evidence is being raised?" | Clear statement (e.g., "Teammate X disagrees", "We all read same source") | If no specific HOE, exit with no adjustment | Forecaster raising issue |
  | 2. Check Relevance and Independence | "Is this HOE about the reliability of the reasoning for this forecast, and is it independent of first-order evidence?" | Yes/No (with brief reason) | If No, exit with no adjustment | Team lead |
  | 3. Assess Impact Scope | "Does this HOE apply globally or locally?" | Global, local, or mixed | If local and reasoning is fully surveyable, exit with no adjustment | Team consensus (quick vote) |
  | 4. Quantify HOE Effect | "By how much should we adjust confidence?" | A number from pre-set rules or formula; if not quantifiable, go to Step 5 | If quantifiable, adjust and exit | Team lead |
  | 5. Human Judgment Call | "What should the final confidence be?" | A number after discussion | Always produces a number | Team lead |

  ### JSON Output

  ```json
  {
    "steps": [
      "Identify the specific HOE being raised.",
      "Check if the HOE is relevant to reliability and independent of first-order evidence.",
      "Determine if the HOE is global or local in scope.",
      "Quantify the adjustment using pre-set rules if possible.",
      "Make a human judgment call for unquantifiable cases."
    ],
    "stop_rules": [
      "No specific HOE identified (Step 1 exit).",
      "HOE not relevant or not independent (Step 2 exit).",
      "HOE is local and reasoning is fully surveyable (Step 3 exit)."
    ],
    "judgment_calls": [
      {
        "question": "How much should we adjust when HOE is genuine but hard to quantify?",
        "why_it_cant_be_proceduralized": "Requires weighing the strength of HOE against first-order evidence, which is context-dependent and subjective."
      },
      {
        "question": "What is the appetite for risk (false positive vs. false negative) in this decision?",
        "why_it_cant_be_proceduralized": "Risk tolerance is a value decision, not a factual one, and varies per forecast."
      }
    ],
    "worked_cases": [
      {
        "case_id": "a",
        "verdict": "No adjustment or minimal downward adjustment",
        "uncomfortable": false,
        "one_sentence_rationale": "Teammate's worse track record in the domain makes their disagreement low-weight HOE; if reasoning is sound, no adjustment needed."
      },
      {
        "case_id": "b",
        "verdict": "Adjust confidence downward (e.g., halfway to 50% or base rate)",
        "uncomfortable": false,
        "one_sentence_rationale": "Non-independent agreement is weak evidence; HOE suggests overconfidence and requires regression to mean."
      },
      {
        "case_id": "c",
        "verdict": "Adjust downward significantly, possibly to a number nobody endorses",
        "uncomfortable": true,
        "one_sentence_rationale": "Field analyst's domain expertise and track record are strong HOE, even if first-order reasoning seems sound; akrasia is correct here."
      },
      {
        "case_id": "d",
        "verdict": "No adjustment if reasoning is surveyable and checked",
        "uncomfortable": false,
        "one_sentence_rationale": "Tiredness HOE is moot because the written reasoning can be verified by others; no reliability deficit if steps hold up."
      }
    ],
    "known_failure_modes": [
      {
        "name": "HOE Laundering",
        "symptom": "Disagreement is counted as both first-order evidence (e.g., their reasons) and HOE (bare disagreement), leading to over-adjustment.",
        "what_the_procedure_does_about_it": "Step 2 enforces independence: if disagreement is based on same first-order evidence, it's not independent HOE and exits. Step 4 weights disagreement by track record to avoid cheap signals."
      },
      {
        "name": "Overcorrection for Global Unreliability",
        "symptom": "Poor track record in one domain leads to unnecessary adjustments in unrelated domains.",
        "what_the_procedure_does_about_it": "Step 3 restricts reliability adjustments to the same domain; global HOE only applies if no local override (e.g., surveyable reasoning)."
      },
      {
        "name": "Publication Gap Mismanagement",
        "symptom": "Team publishes a number no one believes, causing mistrust or indecision.",
        "what_the_procedure_does_about_it": "Procedure outputs the adjusted number (as HOE overrides first-order) but logs the akrasia; human judgment in Step 5 can mitigate if values dictate."
      }
    ],
    "what_the_procedure_cannot_do": "Resolve deep disagreements about values or epistemology; it assumes the team accepts that HOE should sometimes override first-order judgment. It also cannot detect or correct for HOE that is not raised."
  }
  ```

  ### Predictable First-Time Problems
  - **Step 2 (Relevance/Independence) will be contentious**: Teams might argue over what "independent" means. Expect 5-minute debates until precedents set.
  - **Pre-set quantification rules might feel arbitrary**: In Step 4, people will question the adjustment weights. Start with conservative defaults (e.g., -5% for tiredness, weight = track record Brier score relative to team) and revise weekly.
  - **Publication gap discomfort**: Case (c) will feel wrong. Emphasize that the published number is for decision-making, not truth-tracking.
  - **Missing HOE**: The procedure only handles raised HOE; it won't catch unspoken doubts. Encourage a culture of speaking up.
answer: |-
  ### Procedure for Handling Higher-Order Evidence  
  This procedure resolves higher-order evidence (HOE) challenges in 5 steps. It runs per forecast item when HOE is flagged. **Core principles**:  
  - **No double-counting**: Disagreements are either first-order arguments (which you debate/reject) or HOE (bare fact of disagreement), never both.  
  - **Relevance over vibes**: HOE only matters if it directly impacts the *reliability of reasoning* for *this specific forecast*.  
  - **Output honesty**: The published number may differ from personal beliefs. Akrasia ("I believe P but my reasoning is broken") is acceptable if justified.  

  **Trigger**: Any team member says, "There's HOE here."  

  ---

  ### Step-by-Step Table  
  | Step | Question to ask | What counts as a sufficient answer | Where it exits | Who signs off |  
  |------|----------------|-----------------------------------|---------------|-------------|  
  | 1. **Categorize HOE** | "What type of HOE is this? (Disagreement/Non-independence/Personal state/Track record)" | Clear label + 1-sentence description (e.g., "Disagreement: Ana rejects our 70%"). | If not HOE (e.g., new data about the event), exit—treat as first-order update. | Raised by flagger. |  
  | 2. **Test relevance** | "Could this HOE *actually* make us wrong *on this specific question*, even if our first-order reasons seem sound?" | Yes/no + shared reason (e.g., "No: Our reasoning is written; tiredness doesn’t matter if steps hold"). | If "no", exit—ignore HOE. | Team consensus (thumbs-up/thumbs-down in Slack). |  
  | 3. **Check for laundering** | "Is this HOE *independent* of first-order evidence? (i.e., not based on shared data/reasons we already debated)" | Yes/no. If disagreement, ask: "Did they bring new *reasons* we haven’t discussed?" If yes, it’s first-order—debate it now, then exit HOE proc. | If not independent (e.g., disagreement with recycled arguments), exit—no HOE adjustment. | Team lead. |  
  | 4. **Scope adjustment** | "How should we weight this HOE? (Global: All forecasts; Domain: This question type; Instant: This forecast only)" | Pick one scope. Use: "Domain" if track record applies to a class (e.g., "macro questions"); "Instant" if personal state; "Global" only for team-wide issues (e.g., "all forecasts when sleep-deprived"). | (None—proceeds to Step 5). | Team lead, using pre-agreed track record data. |  
  | 5. **Set output** | "Adjust confidence by: X% (disagreement), Y% (non-independence), or Z% (personal state/track record)" | Use rules:  
  - *Disagreement*: Adjust by `(Their confidence - Our confidence) × Weight`.  
    `Weight` = 0.3 if teammate’s domain track record < team avg; 0.7 if > team avg.  
  - *Non-independence*: Move halfway to 50% (e.g., 70% → 60%).  
  - *Personal state*: –10% if reasoning isn’t surveyable; 0% if it is.  
  - *Track record*: –5% per 0.1 Brier score worse than team in domain; +5% if better.  
  If rules feel wrong, skip to Judgment Call. | After adjustment or judgment call. | Team lead. |  

  **Judgment Call** (if Step 5 rules don’t fit): Team lead sets final number based on "How critical is avoiding error here?" (Values/risk appetite).  

  **Publication Gap Rule**: Publish the adjusted number. Log akrasia privately (e.g., "Forecast: 60%. Notes: Maria still believes 70% but concurs reasoning was flawed").  

  ---

  ### JSON Output  
  ```json
  {
    "steps": [
      "Categorize the HOE type.",
      "Test if HOE could realistically distort this specific forecast.",
      "Verify HOE is independent (not recycled first-order debate).",
      "Determine scope of reliability impact (Global/Domain/Instant).",
      "Adjust confidence using pre-set rules or judgment call."
    ],
    "stop_rules": [
      "HOE is invalidated (Step 1: not actually HOE).",
      "HOE is irrelevant to this forecast (Step 2: no).",
      "HOE is not independent (Step 3: laundering risk)."
    ],
    "judgment_calls": [
      {
        "question": "How much risk can we tolerate if this forecast is wrong?",
        "why_it_cant_be_proceduralized": "Risk appetite depends on grant impact (e.g., 'lose $1M if wrong' vs. 'lose reputation')—a value decision, not fact."
      },
      {
        "question": "Should we override the rules when HOE feels unusually strong/weak?",
        "why_it_cant_be_proceduralized": "Strength of 'gut feeling' HOE (e.g., 'I know I’m biased here') is subjective and context-dependent."
      }
    ],
    "worked_cases": [
      {
        "case_id": "a",
        "verdict": "No adjustment (0% change). Exit at Step 3.",
        "uncomfortable": false,
        "one_sentence_rationale": "Worse track record + no new reasons = laundering risk; disagreement is not independent HOE."
      },
      {
        "case_id": "b",
        "verdict": "Adjust confidence down (e.g., 70% → 60%).",
        "uncomfortable": false,
        "one_sentence_rationale": "Non-independence is relevant HOE; Step 5 rule moves toward base rate."
      },
      {
        "case_id": "c",
        "verdict": "Adjust up significantly (e.g., +15–20% if their track record is strong).",
        "uncomfortable": true,
        "one_sentence_rationale": "Analyst's domain expertise is high-weight HOE; akrasia is correct—publish their number despite no first-order shift."
      },
      {
        "case_id": "d",
        "verdict": "No adjustment (0% change). Exit at Step 2.",
        "uncomfortable": false,
        "one_sentence_rationale": "Reasoning is surveyable; tiredness HOE is irrelevant if others verify steps."
      }
    ],
    "known_failure_modes": [
      {
        "name": "Adversarial HOE",
        "symptom": "Teammate exploits procedure by fabricating disagreements to force adjustments.",
        "what_the_procedure_does_about_it": "Step 3 blocks non-independent disagreements; Step 5 weights adjustments by track record (low weight for weak forecasters)."
      },
      {
        "name": "Over-localizing reliability",
        "symptom": "Ignoring global HOE (e.g., 'I’m always wrong when angry') in local decisions.",
        "what_the_procedure_does_about_it": "Step 4 forces scope assignment; global HOE can override if team lead agrees (e.g., 'domain track record irrelevant when sleep-deprived')."
      },
      {
        "name": "Akrasia stalemate",
        "symptom": "Team publishes a number nobody believes, causing decision paralysis.",
        "what_the_procedure_does_about_it": "Procedure accepts akrasia as valid; Step 5 judgment call can align output with risk tolerance (not truth)."
      }
    ],
    "what_the_procedure_cannot_do": "Force consensus on subjective weights (e.g., how much track record matters) or resolve disputes about what counts as 'surveyable' reasoning. Does not auto-detect unreported HOE."
  }
  ```

  ### Predictable First-Run Problems  
  - **Step 2 fights**: People will argue "Could this *really* make us wrong?" when tired or biased. Expect 3–4 min of circular debate until precedent is set.  
  - **Scope misassignment**: Confusing "domain" (e.g., "elections") with "global" (e.g., "all forecasts when stressed"). Mitigation: Pre-define domains.  
  - **Akrasia backlash**: Case (c) will cause grumbling ("Why publish 85% when we all think 70%?"). Hold firm: HOE *should* feel uncomfortable when strong.  
  - **Over-mechanization**: People will skip judgment calls to follow rules rigidly. Remind them: The rules cover 80% of cases; the rest need human nuance.  

  ---  
  This procedure forces clarity on *why* HOE matters (or doesn’t), blocks laundering, and accepts that good epistemology sometimes feels bad. Run it coldly—your discomfort is a feature, not a bug.
