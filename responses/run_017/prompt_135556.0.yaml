answer: |-
  ### Handout: The Boundary Problem — Who Belongs to the Demos?  
  **For the Estuary Authority Case**  
  *Governs flood control and water allocation across a river delta. Decisions bind: resident citizens; long-term non-citizen residents (15+ years, no citizenship route); farmers upstream (outside jurisdiction, irrigation affected); a downstream city in another country (absorbs spillover); resident children under 16; prospective residents (would move in if the levee is built); future residents (born in 50 years if groundwater chosen); a secessionist district; and a one-week traveler (subject to laws while present).*

  This handout flips the script: instead of starting with named doctrines, it begins with concrete diagnostic questions about the Estuary Authority. Answer these questions based on your intuitions about the case—*before* seeing which views they align with. The scoring key maps your answers to a specific position, revealing its trade-offs. No position is "right"; each forces uncomfortable commitments.

  ---

  ### Diagnostic Questions (Answer Agree/Disagree)  
  *Answer for the Estuary Authority case. Don’t overthink—go with your gut.*  

  1. **Upstream farmers should vote** because their water access is directly altered by decisions.  
  2. **The one-week traveler should vote** because they are bound by the Authority’s laws during their stay.  
  3. **The downstream city should vote** even if the harm it faces is minor (e.g., occasional flooding).  
  4. **Long-term non-citizen residents should vote**—they live and work there but lack citizenship.  
  5. **Resident children under 16 should vote**—they are bound by decisions and will inherit outcomes.  
  6. **Prospective residents should vote** since the levee decision creates their stake in living there.  
  7. **Future residents (50 years out) should vote now** if groundwater depletion affects them.  
  8. **The secessionist district should be allowed to exit** if a majority there wishes to leave.  
  9. **Current members alone should decide whether to include non-citizen residents** in the demos.  
  10. **The downstream city should vote** because their input improves decision quality (e.g., expertise on flood risks), even if they lack a "right" to be included.  

  ---

  ### Scoring Key: Map Your Answers to a Position  
  *Tally how many answers match each leaf (1–10). Your position is the leaf with the most matches. If tied, use the tiebreaker below.*  

  | Leaf (Position)                 | Expected Answers (Agree = A, Disagree = D) | Most Awkward Commitment                                                                 |
  |---------------------------------|------------------------------------------|-----------------------------------------------------------------------------------------|
  | **All-Affected (Strong)**       | 1A, 2D, 3A, 4A, 5A, 6A, 7A, 8A, 9D, 10D | Includes future people and young children, making an actual assembly impossible.        |
  | **All-Affected (Threshold)**    | 1A, 2D, 3D, 4A, 5A, 6A, 7D, 8A, 9D, 10D | Arbitrary thresholds exclude some affected parties (e.g., downstream city with minor harm). |
  | **All-Subjected**               | 1D, 2A, 3D, 4A, 5A, 6D, 7D, 8D, 9A, 10D | The traveler (subject to laws) gets a vote, but upstream farmers (deeply affected) do not. |
  | **Citizenism (Adult)**          | 1D, 2D, 3D, 4D, 5D, 6D, 7D, 8D, 9A, 10D | Excludes long-term non-citizen residents, ignoring their stakes and subjection.         |
  | **Residentism (Adult)**         | 1D, 2D, 3D, 4A, 5D, 6D, 7D, 8D, 9A, 10D | Excludes children despite their residency and vulnerability to decisions.               |
  | **Consequentialist**            | 1A, 2D, 3A, 4A, 5D, 6D, 7D, 8A, 9D, 10A | May exclude the young or future people if their inclusion "lowers" decision quality.    |
  | **Captive/Relational (Unnamed)**| 1D, 2D, 3D, 4A, 5A, 6D, 7D, 8D, 9A, 10D | Includes children but excludes prospective residents who would be trapped by the levee. |

  **Tiebreaker**: If tied, use Q8 (secession): Allowing exit (Agree) prioritizes boundary flexibility; blocking it (Disagree) prioritizes stability. If still tied, use Q5 (children): Including them (Agree) is more inclusive.  

  ---

  ### Notes on Unattractive, Empty, or Collapsed Cells  
  - **Captive-constituency principle** (inclusion based on prohibitive exit costs) collapses into **Captive/Relational (Unnamed)**. Both exclude the traveler (low exit cost) and include long-term non-citizens (high exit cost). Adding "exit cost" doesn’t create a new leaf—it reframes the residency/agency trade-off already captured.  
  - **Relational test** (inclusion based on who can be wronged by exclusion) also collapses into **Captive/Relational (Unnamed)**. It shares the same answer pattern: including non-citizen residents and children (who can be wronged) but excluding the traveler and outsiders.  
  - **Empty cell**: A view that includes future people (Q7A) but excludes children (Q5D) is missing. This is likely *unstable*—it inconsistently applies agency requirements (children lack agency now, but future people lack it too).  
  - **Empty cell**: A view that varies the demos per issue (e.g., including farmers only for water votes) is missing. This is *unexplored* in the tree because all questions default to flood control decisions.  

  ---

  ### How to Run This as an In-Class Sorting Quiz  
  1. **Prep**: Print the questions (page 1) and scoring key (page 2) as a handout.  
  2. **Answer phase (5–7 mins)**: Students answer all 10 questions individually for the Estuary case. Emphasize: *Answer based on intuition, not theory.*  
  3. **Scoring phase (5 mins)**: Students tally matches for each leaf using the key. Their position is the leaf with the most matches (use tiebreaker if needed).  
  4. **Discussion launch (10 mins)**: Group students by leaf. Ask: *What’s the toughest commitment of your position?* Then, pit leaves against each other: e.g., "All-Affected vs. All-Subjected: Who wins in the traveler/farmer clash?"  
  5. **Debrief**: Highlight that no view dodges hard trade-offs (e.g., future people break assemblies; exclusion ignores stakes). Use the empty cells to discuss if certain positions are incoherent or just underexplored.  

  **Limitation**: The tree cannot separate **All-Affected (Strong)** and **All-Affected (Threshold)** when harm is significant (e.g., if downstream city faces major flooding, Q3A blurs them). Tiebreaker Q3 (minor harm) resolves this.  

  ---  
  *This tool forces students to confront trade-offs, not just labels. It reveals that the boundary problem has no clean solution—only costly choices.*
