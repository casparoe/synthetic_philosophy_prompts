answer: |-
  Here’s a concise flowchart structured as a decision tree. It prioritizes **concrete, actionable questions** over abstract preferences and covers all your specified cases. The branching isolates key logical distinctions, and leaves map to named strategies. Empty regions are noted at the end.

  ---

  ### **Bankroll Management Flowchart**  
  *Start with a repeatable +EV bet and reinvestment. Answer sequentially:*  

  1. **Are your bets interdependent?**  
     (e.g., multiple simultaneous bets resolving together, sizing locked as a "portfolio")  
     - *Yes* → Treat as one **meta-bet**. Proceed to Q2.  
     - *No* → Proceed to Q2.  

  2. **Could your edge be illusory?**  
     (e.g., risk of being the "sucker," model uncertainty, or unreliable data)  
     - *Yes* → **Q2a: Does Bayesian adjustment (e.g., shrinking edge estimates) still yield +EV?**  
       - *Yes* → **Robust/Bayesian Kelly** (shrink edge, then size normally).  
       - *No* → **Size-zero** (avoid the bet).  
     - *No* → Proceed to Q3.  

  3. **Is there a "ruin level"?**  
     (a minimum bankroll $Y below which you’re bankrupt/finished)  
     - *Yes* → **Q3a: Do you need a target $X by a fixed deadline?**  
       - *Yes* → **Maximize P(hit-the-target)** (optimize success probability, avoid ruin).  
       - *No* → **Ruin-constrained growth maximization** (e.g., via fractional Kelly or explicit ruin limits).  
     - *No* → Proceed to Q4.  

  4. **Does utility saturate above ~$50M?**  
     (e.g., gains beyond this buy nothing)  
     - *Yes* → **Power-utility expected-utility maximization** (optimize for concave utility, not wealth).  
     - *No* → Proceed to Q5.  

  5. **Could the opportunity vanish randomly?**  
     (e.g., market closes, edge decays unpredictably after any round)  
     - *Yes* → **Fractional Kelly** (reduce bet size for shorter horizons).  
     - *No* → **Q5a: Volatility-sensitive?**  
       (e.g., "I want smoother equity curves" or "I’m personally risk-averse")  
       - *Yes* → **Fractional Kelly** (reduce size for psychological/compliance reasons).  
       - *No* → **Full Kelly** (maximize long-run growth; equivalent to "time-average" or "ergodic" optimization).  

  ---

  ### **Key Notes**  
  - **Leaf Strategies**:  
    1. Robust/Bayesian Kelly  
    2. Size-zero  
    3. Maximize P(hit-the-target)  
    4. Ruin-constrained growth  
    5. Power-utility EU maximization  
    6. Fractional Kelly (covers *random horizon* + *volatility sensitivity*)  
    7. Full Kelly  
    *(7 leaves total; "median maximization" omitted as niche/uncommon for your cases)*  

  - **Indistinguishable Leaves**:  
    - **Fractional Kelly**, **robust Kelly**, and **ruin-constrained sizing** all reduce bet size but for different reasons:  
      - *Robust* adjusts for **edge uncertainty** (Q2).  
      - *Ruin-constrained* handles **bankruptcy risk** (Q3).  
      - *Fractional Kelly* addresses **random horizons** (Q5) or **volatility aversion** (Q5a).  
    - *No extra question needed*: The tree separates them via prior branches (uncertainty → ruin → horizon/volatility).  

  - **Empty Regions** (why no strategies exist):  
    - **"Full Kelly + ruin level"**: *Incoherent*. Full Kelly risks ruin with positive probability.  
    - **"Power utility + fixed target"**: *Unexplored*. Saturation invalidates linear target objectives.  
    - **"Size-zero + confident edge"**: *Unattractive*. Avoiding +EV bets wastes opportunity.  

  ---

  ### **How to Use**  
  1. Follow questions top-down.  
  2. For **multiple bets (Q1)**: After "meta-bet," use the same tree (treat portfolio EV/kelly as the "bet").  
  3. **Fractional Kelly** subsumes:  
     - Random horizons (aggressive sizing risks quitting at a loss).  
     - Pure risk-aversion (if no ruin/saturation exists).  

  This covers all your cases in 7 leaves, avoids theory preamble, and uses only concrete questions. The structure prioritizes *practical constraints* (ruin, horizon, uncertainty) before preferences.
