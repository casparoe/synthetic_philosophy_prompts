  First, I consider what ordinary setting to use - workplace safety checks feel right because they naturally involve variable stakes. The hospital protocol idea mentioned initially seems too high-stakes by default, so I shift to a manufacturing quality control context where mistakes could range from minor to severe depending on external factors. 

