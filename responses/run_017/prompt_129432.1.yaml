prompt: |-
  I'm the director of program ops at a mid-sized regional workforce nonprofit, and over the next year every contract we have is moving to outcomes-based payment: we propose the numbers, the state agency has to approve them, and somewhere between 40 and 60 percent of our funding sits on top of them. So a few times a month I'm going to be sitting there with a proposed metric in front of me, about a day to think about it, a board that wants money at risk to look like confidence, and a program staff who will quietly reorganize their entire week around whatever I pick. I'd like a written procedure my team can run on each candidate metric before it goes into a contract.

  The problem I keep running into is that "watch out for gaming" is too vague to be useful, and the standard advice I've seen either collapses into "measure everything" (we can't — we can properly audit maybe two things a quarter, the rest we get self-reported) or into "just use judgment" (which is what got us here). I've started sorting failure modes myself and I think there are at least five different things going on: hitting the number by serving people we'd have served anyway; sorting who we serve so the easy cases are the ones who count; the ratchet, where a good year becomes next year's floor; collateral, where something nobody put a number on gets worse while the headline improves; and what I think of as plain decay, where the proxy just stops tracking the thing we cared about over a couple of years even though nobody is cheating. I'd like you to clean that taxonomy up, throw away the parts that don't earn their keep, and add whatever's missing.

  What I actually need:

  - the questions in the order to ask them, and what counts as a real answer to each one rather than a shrug
  - where the procedure just stops with a no, and where it has to hand the question to a person because it's a values call and not a factual one
  - a distinction between metrics that are safe to put money on and metrics that are fine to report but must never carry payment — and what to do when the funder insists that at least three of the payment metrics be ours and at least half the money be at risk, so "use none of them" isn't available
  - a one-page version, plus a one-sentence plain-English "why this step" line under each question, because I have to defend the whole thing to a board member who will ask why we're making this so complicated
  - an honest note on which steps are judgment calls wearing a lab coat, and what the procedure deliberately doesn't try to do

  Then run the whole thing on three candidates: share of participants still employed 90 days after exit; median hourly wage at placement; and number of participants who complete a credential. That last one is the funder's favorite and my staff's favorite, and I have a bad feeling about it, so if the procedure says it can't carry money, say so plainly. And tell me what I'm supposed to do mid-contract when a metric that passed the procedure starts to look wrong, since nothing we sign is shorter than three years.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're a director at a workforce nonprofit transitioning to outcomes-based payments. Their main issue is avoiding metric gaming without falling into vague advice or impractical solutions. They've identified five failure modes but want a structured procedure.

  First, I need to refine their taxonomy of failure modes. They mentioned serving people they'd help anyway, cherry-picking easy cases, the ratchet effect, collateral damage, and proxy decay. I should check if any overlap or if something's missing. For example, "proxy decay" might be similar to Goodhart's Law, where the metric stops being a good indicator. Also, are there other failure modes? Maybe manipulation of data or unintended consequences like reducing access for harder-to-serve clients.

  Next, they want a step-by-step procedure with clear questions, decision points, and distinctions between metrics that can carry financial risk versus those that shouldn't. The procedure must be defensible to the board, so each step needs a plain-English rationale. Also, handling funder constraints when they insist on multiple payment metrics.

  I should structure the questions in a logical order. Start with alignment to mission—does the metric reflect real outcomes? Then, controllability—can the program influence it? Avoidance of perverse incentives, data integrity, and stability over time. Each step should have a clear pass/fail or escalation point.

  For the distinction between payment and reporting metrics, payment metrics need to pass all checks, especially controllability and low gaming risk. Reporting metrics might fail some but still provide value. When funders insist on multiple payment metrics, suggest alternatives like tiered payments or partial risk to mitigate issues.

  The one-page version needs concise questions with simple explanations. Highlight which steps are judgment calls, like assessing stakeholder alignment or gaming susceptibility. Acknowledge that some steps involve judgment but use structured criteria to reduce bias.

  Testing the three candidate metrics:
  - 90-day employment: Might encourage cherry-picking or focus on short-term jobs. Passes some tests but controllability is medium. Maybe okay with tiering.
  - Median wage: High risk of gaming through participant selection. Fails controllability and perverse incentives. Unsafe for payment.
  - Credential completion: High risk of gaming through easier programs or lowering standards. Fails multiple tests. Not safe for payment.

  For mid-contract issues, include a reassessment clause in contracts, regular reviews, and renegotiation triggers. Build flexibility into agreements.

  Also, consider the user's deeper needs. They need to balance board confidence, staff workload, and funder requirements. The procedure should provide clarity, prevent costly mistakes, and maintain program integrity. They might also need buy-in from staff and funders, so the procedure must be transparent and collaborative.
answer: |-
  Here’s a structured, defensible procedure for vetting outcomes-based metrics—designed to prevent gaming while acknowledging practical constraints. It’s built on your taxonomy but reframed into actionable questions, with clear "stop/no" gates and escalation points.

  ---

  ### **The Metric Vetting Procedure**  
  *(One-Page Summary for Board/Staff)*  

  | **Step** | **Question to Ask** | **"Why This Step?" (Plain English)** | **Decision Gate** |
  |----------|---------------------|--------------------------------------|-------------------|
  | **1** | **"Does this metric directly measure a *final outcome* we’d celebrate if achieved without us?"** | Avoids paying for activities we didn’t cause or that lack real impact. | → Fail: Stop. Fix definition. |
  | **2** | **"Can our program *realistically control* 70%+ of the factors needed to hit this target?"** | If external forces (e.g., economy, luck) dominate, it’s gambling—not accountability. | → Fail: Reject for payment. → Marginal: Escalate to leadership. |
  | **3** | **"If we max out this metric, could it *harm participants* or *undermine our mission*?"** | Prevents "collateral damage" (e.g., pushing people into unstable jobs to hit placement numbers). | → Yes: Reject for payment. → Unclear: Escalate + ethics review. |
  | **4** | **"Is gaming this metric *harder than legitimately improving it*?"** | If cheating is easier than real work, it will happen. Focuses on "ease of gaming" risks. | → Easy to game: Reject for payment. → Moderate risk: Add safeguards. |
  | **5** | **"Can we *independently audit* this metric at low cost, *without self-reporting*?"** | Self-reported data invites drift or manipulation; audits ensure integrity. | → No: Demote to reporting-only metric. |
  | **6** | **"Does this metric *stay aligned with impact* over 3–5 years, even if behaviors change?"** | Guards against "proxy decay"—metrics that lose meaning over time. | → High decay risk: Use <50% weight. → Low risk: Proceed. |

  **Key Distinctions:**  
  - **✅ Payment Metrics:** Must pass **Steps 1–4 decisively** + **Step 5**.  
  - **📊 Reporting Metrics:** Can fail Steps 4–5 but pass Steps 1–3.  
  - **🚫 Never Carry Money:** Metrics failing Steps 2 (uncontrollable), 3 (harmful), or 4 (easy to game).  

  **When Funders Demand "At-Risk" Metrics You Can’t Trust:**  
  - **Tier Payments:** Only put money on the *safest* 1–2 metrics; make others "bonus only" (e.g., 0–10% at risk).  
  - **Partial Attribution:** "We’ll accept payment on *X%* of credential completions, adjusted for participant difficulty."  
  - **Outcome Caps:** "No payment beyond 110% of target" to avoid ratchet effects.  

  ---

  ### **Honest Notes for Your Team**  
  - **Judgment Calls in Lab Coats:** Steps 3 (harm) and 4 (gaming risk) require scenario-based debates. Use red-teaming: *"How would you game this in <20 hrs/week?"*  
  - **What This Doesn’t Do:**  
    - Replace qualitative oversight.  
    - Fix poorly designed programs.  
    - Solve for funder politics (but gives you evidence to push back).  

  ---

  ### **Analysis of Your Candidate Metrics**  

  1. **Share of Participants Still Employed 90 Days After Exit**  
     - ✅ **Step 1:** Yes (durable employment = real outcome).  
     - ⚠️ **Step 2:** *Marginal.* Programs influence job readiness, but recessions/employer decisions control 40–50%. **Escalate.**  
     - ✅ **Step 3:** Low harm risk (but staff may avoid hard-to-employ groups).  
     - ⚠️ **Step 4:** *Moderate gaming risk.* Staff could "exit" unstable workers early. **Add safeguard:** Require min. 30 days pre-exit engagement.  
     - ⚠️ **Step 5:** *Audit possible but costly.* State wage data lags 6+ months. **Demote weight** (≤30% payment share).  
     - ✅ **Step 6:** Stable proxy.  
     **Verdict:** **🟠 Conditional Payment Metric** (cap risk, add anti-creaming clauses).  

  2. **Median Hourly Wage at Placement**  
     - ✅ **Step 1:** Yes (earnings = core outcome).  
     - 🚫 **Step 2:** *Fail.* Wage heavily influenced by local job market, prior skills, and role types. Program controls <40%.  
     - 🚫 **Step 3:** *High harm risk.* Incentivizes cherry-picking college grads over disadvantaged groups.  
     - 🚫 **Step 4:** *Easy to game.* Serve 51% high-wage candidates → median soars.  
     **Verdict:** **🔴 Unsafe for Payment.** Use as reporting metric only.  

  3. **Number of Participants Who Complete a Credential**  
     - ⚠️ **Step 1:** *Debatable.* Credential ≠ outcome (e.g., useless certs). **Escalate:** Tie to credentials *with proven employment lift*.  
     - ✅ **Step 2:** Yes (program controls training quality/completion support).  
     - 🚫 **Step 3:** *High harm risk.* Staff may push easy/quick credentials, avoid high-value but harder programs.  
     - 🚫 **Step 4:** *Easy to game.* Lower standards, shorten courses, recruit credential-ready candidates.  
     - ✅ **Step 5:** Auditable (certificate issued).  
     **Verdict:** **🔴 Unsafe for Payment** (fails Steps 3 & 4 catastrophically). *Your gut was right.*  

  ---

  ### **Mid-Contract Metric Failure Protocol**  
  1. **Build These Into Contracts:**  
     - **"Neutral Auditor" Clause:** Funders/providers jointly hire 3rd party to assess metric validity annually.  
     - **Re-negotiation Triggers:** If external factors (e.g., unemployment jumps 3%) distort performance >15%, payments pause until recalibration.  
     - **Tiered Sunset:** Year 1: 70% payment weight → Year 3: 30%, giving time to phase out decaying metrics.  

  2. **When Red Flags Appear:**  
     - **Audit Immediately:** Suspect behavior? Use your 2 audit slots.  
     - **Offer a Trade:** "We’ll add *new* impact metric next quarter if we sunset this one early."  
     - **Document & Shield Staff:** "Per Section 7.2, this metric is under review due to [data]. Staff priorities remain unchanged until resolved."  

  ---

  ### **Why This Isn’t "Complicated"**  
  **Board Defense Script:**  
  > *"We’re not avoiding risk—we’re focusing it on outcomes we can actually achieve without harming our mission. Skipping these steps would mean gambling with your dollars and our participants’ futures. This is the* minimum *due diligence to ensure ‘accountability’ doesn’t backfire."*  

  This system balances rigor with operational reality. It won’t eliminate gaming but will confine it to metrics where cheating is harder than real impact—and give you moral authority to push back on funders.
