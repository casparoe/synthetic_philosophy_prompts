prompt: |-
  I work as a research assistant to a retired diplomat who now writes and broadcasts on the ethics of force, and I am the one assembling a table of everything she has publicly committed to, because she has agreed to give evidence to a parliamentary committee on humanitarian intervention next month and has a bad habit of saying that each case must be judged on its own facts. The track record I have managed to reconstruct from her columns, her memoir and two interviews is this. On Kosovo in 1999 she backed the NATO air campaign despite the absence of Security Council authorization, and she continues to insist that legal status and moral justification can come apart; she also always notes that the point was to stop the expulsion of the Albanian population and that the Serbian leadership was left in office afterwards. On Iraq in 2003 she was opposed from the start: no authorization, no ongoing mass atrocity, regime change announced as policy in advance, the threat assessment overstated, and the aftermath catastrophic. On Libya in 2011 she gives what I think of as her split verdict: the initial air campaign, authorized by the Council to protect civilians, was right; the arming of the rebels and the pursuit of the leadership turned protection into a war of overthrow; and she treats the collapse that followed as part of the verdict rather than as bad luck. On Syria in 2013 she opposed strikes after the chemical attack outside Damascus, on the grounds that they would have been unauthorized, that nobody had a plan for what came next, that escalation was likely, and that some of the rebels she did not want armed would have benefited. On Rwanda in 1994 she calls the failure to reinforce and re-mandate the mission already on the ground one of the great moral failures of her professional lifetime, and she does not treat the lack of authorization as any kind of excuse. On the Indian intervention in East Pakistan in 1971 she has said it was on balance right, though she never fails to add that it ended in the dismemberment of a state, and I cannot get her to say how much that counts against it.

  The case she will be asked about is not a historical one. The government of Vardania has for fourteen months been driving the Orran minority out of two northern provinces, using regular army units together with allied militias; UN monitors on the ground estimate forty thousand dead and six hundred thousand displaced, and their public forecast is several hundred thousand more deaths if the campaign continues through the winter. A Security Council resolution authorizing force to protect civilians was put to a vote and vetoed by a permanent member that supplies the Vardanian air force and has a basing agreement with it. A regional organisation of neighbouring states then authorized an air campaign, which its members are now flying, with no ground component; the mandate as written covers only the aircraft and artillery being used against civilians. The intervener has publicly refused to arm the Orran self-defence militias, though a third country is doing so quietly and everyone knows it. In the fifth week, after the government began directing attacks on civilians from the national command bunker under the presidential palace, the bunker was struck and the president and much of the high command were killed; the regular army then defected to the rebels rather than dissolving, so unlike Iraq the officer corps and the ministries survived more or less intact, and the capital fell three weeks later. Revenge killings of civilians belonging to the formerly dominant group have since claimed, by the monitors' count, something in the low thousands. The intervening state also has a second reason for being there: it wants to keep the port access the old government granted it, and it has said nothing to dispel that impression.

  I have to write the briefing note predicting what she will say, and I would rather get the structure of her thinking right than the bottom line. As I read the table, at least four rules fit all six of her verdicts about equally well: a rule requiring multilateral authorization with a narrow exception for ongoing mass atrocity the Council has failed to address; a rule that counts authorization only as evidence and asks whether the force was necessary, proportionate in its means and expected to leave things better; a rule that turns on whether a new political outcome was imposed rather than merely foreseen; and a rule that asks whether the intervener's motives were sufficiently clean. My sense is that these come apart sharply on Vardania, because it is at once unauthorized, atrocity-stopping, means-limited, lethal to a head of state, outcome-imposing, aftermath-tolerable and motive-mixed, and the surface analog is Libya while the deeper ones are Kosovo and 1971. So: what verdict should I expect her to give, and should I write it up as approval, condemnation, or another split; which of those rules is she most plausibly running, and what does each of the others predict here; where exactly do the two closest candidates diverge and how confident should I be; if her track record genuinely underdetermines the case, what principle would she be committing herself to with each of the available answers; and finally, what hypothetical variant should I put to her in the prep session to force the surviving rules apart?
reasoning: |-
  Okay, let me start by really understanding what the user needs here. They’re a research assistant for a retired diplomat who’s testifying about humanitarian intervention. The user has compiled her past positions on various interventions and now needs to predict her stance on a fictional scenario called Vardania. The key challenge is that her past positions seem to align with multiple conflicting principles, and Vardania has elements that could push her in different directions.

  First, I need to parse the diplomat’s historical stances. She supported Kosovo (1999) despite no UNSC authorization because it stopped ethnic cleansing and didn’t topple the regime. Opposed Iraq (2003) due to lack of authorization, no ongoing atrocity, regime change intent, and bad aftermath. On Libya (2011), she split her verdict: approved initial civilian protection but condemned arming rebels and pursuing regime change. For Syria (2013), she opposed strikes because unauthorized, no plan, risk of escalation, and benefiting undesirable rebels. In Rwanda (1994), she saw failure to act as a moral failure, authorization not an excuse. And for India in East Pakistan (1971), she supported it overall but noted the state dismemberment as a downside.

  Now, Vardania’s scenario: ongoing atrocities by the government against the Orran minority, UNSC resolution vetoed by a permanent member allied with Vardania. A regional organization authorizes an air campaign targeting only assets used against civilians. The intervener refuses to arm rebels (though another country does), and later, the presidential bunker is struck, killing the leadership. The army defects, leading to regime collapse. Revenge killings occur post-conflict, and the intervener has mixed motives (port access).

  The user has identified four potential rules the diplomat might follow. I need to see which fits best. Rule 1: Multilateral authorization with an exception for mass atrocities the UNSC failed to address. Rule 2: Force must be necessary, proportionate, and likely to improve things, with authorization as just evidence. Rule 3: Did the intervention impose a new political outcome or just prevent harm? Rule 4: Were the intervener’s motives clean?

  Looking at her past positions: Kosovo fits Rule 1 (atrocity exception) and Rule 2 (outcome was better). Iraq violated Rules 1, 2, 3 (imposed regime change), and 4 (questionable motives). Libya’s split shows Rule 3 as key—approving protection but condemning regime change. Syria opposed due to Rule 2 (no plan, escalation risk) and Rule 3 (unintended outcomes). Rwanda’s inaction criticized under Rule 1 (no atrocity exception used) and Rule 2 (inaction led to worse). East Pakistan fits Rule 2 (necessary, proportionate) despite Rule 3 (state dismemberment).

  For Vardania, Rule 1: No UNSC auth, but ongoing atrocity and regional auth. Similar to Kosovo’s NATO action. Rule 2: Necessary? Probably. Proportionate? Mostly air campaign. Better outcome? Regime collapsed, revenge killings but fewer deaths. Rule 3: Imposed new outcome via bunker strike leading to regime change. Rule 4: Mixed motives (port access).

  The key divergence is between Rule 2 (supports if net positive) and Rule 3 (condemns if imposed outcome). Her Libya stance shows she condemns mission creep into regime change. Vardania’s bunker strike directly caused regime collapse, even if unintended. That’s similar to Libya’s shift. But unlike Libya, the intervener didn’t arm rebels. However, the bunker strike was pivotal. Also, motives are mixed, which might trigger Rule 4.

  Her likely verdict: Split like Libya. Approve initial intervention under regional auth to protect civilians but condemn the bunker strike as exceeding the mandate, leading to regime change and revenge killings. Mixed motives weaken the case further. So, condemnation of the escalation but maybe not the entire operation.

  To test this, a hypothetical where the bunker isn’t struck—would the outcome be better? If regime stays, atrocities continue; if rebels win anyway, less blame on interveners. Or if motives were pure, would she still condemn the escalation?

  The user needs to structure the briefing around her emphasis on avoiding regime change and clean motives. Prep questions should force a choice between outcome-based (Rule 2) vs. means/outcome imposition (Rule 3) evaluation.
answer: |-
  Based on your analysis of her track record and the Vardania scenario, here's a structured prediction of her likely verdict and the underlying principles:

  ### Predicted Verdict for Vardania: **Condemnation with Nuance** (Not a clean split like Libya)
  - **Approve:** Initial regional-authorized air campaign against artillery/aircraft targeting civilians (parallels Libya 2011 Phase 1).
  - **Condemn:** The bunker strike killing leadership, which escalated to regime change and foreseeable chaos (parallels Libya 2011 Phase 2). Mixed motives (port access) undermine legitimacy.
  - **Key Judgment:** *"The intervention crossed the line from protection to overthrow when it decapitated the regime, replicating Libya's fatal error despite tactical differences."*

  ### Rule Analysis & Predictions
  | **Rule Framework** | **Fits Track Record?** | **Vardania Prediction** | **Conflict Point** |
  |-------------------|------------------------|------------------------|-------------------|
  | **1. Multilateral Auth + Mass Atrocity Exception** | Strong (Kosovo/Rwanda) | **Approval** (Regional auth + atrocity meets "spirit" of exception) | Ignores regime change outcome and motives |
  | **2. Necessity/Proportionality/Outcome Focus** | Strongest (All cases) | **Ambivalent** (Necessary/proportionate *until bunker strike*, but revenge killings = suboptimal outcome) | Downplays *how* regime fell (imposed vs. organic) |
  | **3. Anti-Political-Outcome-Imposition** | Core (Iraq/Libya/Syria) | **Condemnation** (Bunker strike forced regime collapse, like Libya) | Treats "collateral" regime change as intentional |
  | **4. Motive Purity** | Secondary (Iraq/Libya) | **Condemnation** (Port access taints motives, unlike Kosovo's "clean" intent) | Overlooks atrocity-stopping if motives mixed |

  ### Key Divergence & Confidence
  - **Closest Rules:** **#2 (Outcome-Focused)** vs. **#3 (Anti-Imposition)**  
    - **Divergence:** Rule #2 tolerates *unintended* regime change if net lives saved (e.g., Kosovo left regime intact *by choice*, not principle). Rule #3 condemns *any* interventionist role in regime collapse (Libya bunker pursuit = deliberate; Vardania bunker strike = foreseeable consequence).  
    - **Confidence:** **High (80%)** she prioritizes Rule #3. Her Libya split shows visceral rejection of *any* mission creep toward overthrow, regardless of initial justification. Vardania's leadership decapitation (even if militarily logical) is a bright line for her.

  ### Underdetermination & Principle Commitments
  If her record *truly* underdetermines Vardania, her verdict would commit her to:  
  - **Approving:** Endorses regional auth as sufficient when UNSC fails + accepts "collateral" regime change if proportional.  
  - **Condemning:** Establishes that *any* intervener-caused regime collapse is illegitimate, even amid atrocities.  
  - **Splitting:** Allows kinetic decapitation as lawful if explicitly mandated (unlike here).

  ### Critical Hypothetical to Force Rule Split
  **"Assume the regional mandate *explicitly* authorized striking command centers like the bunker, and the subsequent regime collapse/revenge killings still occurred. Does this change your view of the intervention's legitimacy?"**  
  - **Tests:** Rule #1/2 (if yes→mandate sanctity/outcome matter more than regime change). Rule #3/4 (if no→imposition/motives are decisive regardless of mandate).

  ### Recommended Briefing Structure
  1. **Her Likely Verdict:** "Initial tactical strikes justified under regional mandate; strategic escalation via leadership decapitation illegitimate and reckless."  
  2. **Primary Rule:** #3 (Anti-Imposition) – *"Force must not become a vehicle for political overthrow, even incidentally."*  
  3. **Secondary Rule:** #4 (Motive Scrutiny) – Port access undermines moral credibility.  
  4. **Weak Rules Here:** #1 (Regional auth *almost* suffices) and #2 (Net lives saved *almost* justifies means).  
  5. **Prep Question:** Use the bunker-strike hypothetical above to probe Rule #3 vs. #2.

  ### Why This Fits
  - **Kosovo/1971 vs. Libya:** She supported interventions that *avoided* imposed regime change (Serb leadership survived; India's dismemberment was organic). Vardania's bunker strike makes it a Libya analog.  
  - **Rwanda/Vardania Contrast:** Rwanda was *inaction* guilt; Vardania is *overreach* guilt. Her Syria opposition (no plan = chaos) applies here post-collapse.  
  - **Motive Matters:** Port access mirrors Iraq's oil suspicions – she won't ignore it.

  This positions her as consistent: stopping atrocities is necessary but never sufficient if the intervention morphs into forced regime change or serves hidden interests.
