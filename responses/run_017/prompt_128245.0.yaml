prompt: |-
  Someone in a rationalist group chat killed a thread the other night by posting "extraordinary claims require extraordinary evidence" as if that was the end of it. The thread was about Pascal's mugging — stranger offers you a deal, give me five bucks or I'll use my matrix powers to create 10^60 people and torture them forever — and whether you're rationally required to pay. He seemed to think the slogan settles it, and everyone moved on, but I cant tell what work it was even supposed to do, since the mugging already has an absurdly low prior built right into it and the expected-value problem still goes through.

  So: lay out the different precise claims that one-liner could be standing for. The boring Bayesian one about priors and likelihood ratios; something about fixed thresholds on priors; something about how strong the justification for the prior has to be; something about burden of proof rather than about belief; the error-statistical/severity reading where the point is that no test could have distinguished the claim being false; something about base rates of lying and craziness in testimony; and whatever else is hiding in there. For each, say whether it's a platitude, a substantive and defensible principle, or actually false, and — this is the part I care about — whether it would really block the mugging or just restate the intuition.

  Two cases to run them against, because I think they split readings that otherwise look the same. One: the no-mugger version — you find a sealed contraption in your attic with a button and an engraved plate saying it either does nothing or creates 10^60 tortured people; nobody claimed anything, there's no testimony and no claimant. Two: the mugger who first does a small genuine miracle in front of you, so the extraordinary evidence is arguably supplied.

  Lead with the bottom line in the first sentence — which readings, if any, actually do the work — then give me the menu and the verdicts, no preamble, in a form I can paste back into the chat.
reasoning: |-
  Alright, let's tackle this query about "extraordinary claims require extraordinary evidence" and how it relates to Pascal's mugging. The user is frustrated because someone in their rationalist group chat used this slogan to shut down a discussion on Pascal's mugging, but it didn't actually address the core issue. The user wants a breakdown of what that slogan could mean in different contexts, which interpretations hold water, and whether they genuinely resolve the mugging scenario.

  First, I need to recall Pascal's mugging. It's a thought experiment where a stranger threatens to create and torture an enormous number of people unless paid a small amount. The expected value calculation suggests paying is rational if you assign even a tiny probability to the threat being real, because the disutility of not paying is astronomically high. The problem is that this leads to absurd extortion scenarios.

  The user is pointing out that the slogan "extraordinary claims require extraordinary evidence" doesn't solve the problem because the mugging already has an absurdly low prior built in. The expected value still forces you to pay. So, the slogan might be misapplied here.

  The user wants a structured analysis. They specified two cases: the no-mugger version (finding a mysterious device) and the mugger who performs a small miracle first. These cases help differentiate between interpretations of the slogan.

  I should start by listing possible interpretations of the slogan. The user mentioned several: Bayesian priors and likelihood ratios, fixed prior thresholds, justification for priors, burden of proof, error-statistical severity, base rates of deception, etc. For each, I need to assess if it's a platitude, defensible, or false, and whether it blocks the mugging or just restates the problem.

  Let me brainstorm the interpretations:

  1. **Bayesian Interpretation (Priors and Likelihood Ratios):** Extraordinary claims need very high likelihood ratios to overcome low priors. This is standard Bayesian updating. In Pascal's mugging, even with a tiny prior, the claimed disutility is so large that the expected value still favors paying. So, this doesn't block the mugging; it restates why it's a problem.

  2. **Fixed Prior Thresholds:** Some might think claims below a certain prior probability should be ignored. This is ad hoc and violates Bayesian principles. It might block the mugging by dismissing low-probability threats, but it's not defensible because it leads to ignoring real but improbable dangers.

  3. **Justification for Priors:** Extraordinary claims require stronger evidence to justify assigning a non-zero prior. If you demand such evidence and it's absent, you set the prior to zero. This could block the mugging by assigning a prior of zero to the threat. However, is it defensible? In cases like the no-mugger scenario, without any evidence, maybe setting the prior to zero is reasonable. But in the miracle mugger case, if the mugger shows a small miracle, that might count as some evidence, forcing a non-zero prior. So, this interpretation might work in the no-evidence case but not when some evidence is present.

  4. **Burden of Proof:** The slogan shifts the burden to the claimant to provide strong evidence before the claim is considered. This is practical in testimony scenarios. In Pascal's mugging, without evidence, you dismiss the claim. But with the miracle, the mugger has met some burden, so the claim must be considered. This blocks the no-evidence mugging but not the miracle case.

  5. **Error-Statistical Severity:** Extraordinary claims require tests with high severity to rule out alternatives. If no such test exists or is passed, the claim isn't supported. In the mugging, no test could distinguish the threat from bluffing. This blocks both mugging cases because even a small miracle doesn't confirm the larger threat. This is defensible and substantive.

  6. **Base Rates of Deception:** Extraordinary claims are often false, so strong evidence is needed to counter high base rates of lying or delusion. This applies to testimony. Without the mugger's miracle, base rates suggest dismissal. With a miracle, base rates of genuine power are near zero, so even then, evidence might be insufficient. This blocks both cases but relies on empirical base rates.

  Now, assessing each:

  - **Bayesian:** Platitude, doesn't block mugging.
  - **Fixed Thresholds: False, blocks mugging but arbitrarily.
  - **Justification for Priors:** Defensible, blocks no-evidence mugging but not miracle case.
  - **Burden of Proof:** Defensible, same as above.
  - **Error-Severity:** Defensible, blocks both mugging cases.
  - **Base Rates:** Defensible, blocks both based on testimony unreliability.

  The key is that only the last three (Justification, Burden, Error-Severity, Base Rates) can block the mugging, depending on the case. Base Rates and Error-Severity work against both scenarios, while Justification and Burden work only without evidence.

  The user wanted the bottom line first. So, the conclusion is that only some interpretations block the mugging: Justification for Priors and Burden of Proof handle the no-evidence case; Error-Severity and Base Rates handle both, especially with testimony.

  Also, the miracle mugger case tests whether evidence is sufficient. For Base Rates and Error-Severity, even a small miracle isn't enough to support the extraordinary claim of creating 10^60 people. So those interpretations still block the mugging.

  Finally, the user wants this in a pasteable format for the chat. So structure it clearly: bottom line first, then each interpretation with verdicts and whether it blocks the mugging in both cases.
answer: |-
  ### Bottom Line
  The slogan "extraordinary claims require extraordinary evidence" only blocks Pascal's mugging under specific interpretations: (1) **Justification for Priors** and **Burden of Proof** dismiss the no-evidence mugging but fail against the miracle mugger; (2) **Error-Statistical Severity** and **Base Rates of Testimony** block both mugging cases defensibly. The boring **Bayesian** reading does nothing, while **Fixed Thresholds** is false and arbitrary. Most interpretations just restate the problem or shift assumptions.

  ### The Menu: Interpretations, Verdicts, and Mugging Blocking
  **Case 1: No-Mugger (sealed contraption)**  
  **Case 2: Miracle Mugger (small genuine miracle shown)**  

  1. **Boring Bayesian (Priors + Likelihood Ratios)**  
     - **Claim:** Extraordinary claims need extreme likelihood ratios to overcome low priors during Bayesian updating.  
     - **Verdict:** Platitude (universally accepted).  
     - **Blocks Mugging?** No. Restates the problem: even tiny priors (e.g., 10⁻¹⁰⁰) multiplied by astronomical disutility (10⁶⁰ tortured people) can dominate expected value. Fails both cases.  

  2. **Fixed Thresholds on Priors**  
     - **Claim:** Claims below a prior probability threshold (e.g., 10⁻⁵⁰) should be ignored, regardless of stakes.  
     - **Verdict:** False (violates coherence; ignores stakes/context).  
     - **Blocks Mugging?** Yes (arbitrarily) by dismissing low-prior threats. Works for both cases, but is indefensible—e.g., ignores real but improbable existential risks.  

  3. **Justification for Priors**  
     - **Claim:** Extraordinary claims demand strong evidence to justify assigning a non-zero/non-trivial prior. Absent such evidence, set prior = 0.  
     - **Verdict:** Defensible (aligns with Bayesian " Cromwell’s Rule " pragmatism).  
     - **Blocks Mugging?**  
       - Case 1 (No-Mugger): Yes. No evidence → prior = 0.  
       - Case 2 (Miracle Mugger): No. Small miracle justifies a non-zero prior (e.g., 10⁻¹⁰), so expected value forces payment. Restates the intuition.  

  4. **Burden of Proof**  
     - **Claim:** The claimant must provide strong evidence before their claim is entertained; otherwise, default to skepticism.  
     - **Verdict:** Defensible (practical for testimony-based claims).  
     - **Blocks Mugging?**  
       - Case 1: Yes. No claimant → no burden met → ignore.  
       - Case 2: No. Mugger’s miracle meets some burden, forcing consideration. Expected value still compels payment.  

  5. **Error-Statistical Severity (No Test Could Distinguish Truth)**  
     - **Claim:** Extraordinary claims require evidence from a "severe test" that would likely detect falsehoods. If no such test exists (or is passed), reject the claim.  
     - **Verdict:** Defensible (core to error-statistics, e.g., Mayo 2018).  
     - **Blocks Mugging?** Yes for both cases. A small miracle (e.g., bending a spoon) is not a severe test for the claim "can create/torture 10⁶⁰ people"—it doesn’t rule out bluffing, trickery, or limited powers. The claim is too detached from evidence.  

  6. **Base Rates of Testimony (Lying/Craziness)**  
     - **Claim:** Extraordinary claims often stem from deception/delusion; thus, strong evidence must overcome high base rates of false testimony.  
     - **Verdict:** Defensible (empirically grounded; e.g., Hume on miracles).  
     - **Blocks Mugging?** Yes for both cases. Base rates for honest, sane, matrix-capable muggers are near-zero. Even a small miracle (e.g., telekinesis) has high base rates for fraud (e.g., magic tricks), so evidence remains insufficient.  

  ### Why This Matters for Your Chat
  - **Slogan-as-shutdown failed:** The boring Bayesian reading (likely what your chat-mate invoked) does nothing to resolve Pascal’s mugging—it reinforces it.  
  - **Legitimate blocks:** **Severity** and **Base Rates** defensibly block both mugging cases by demanding evidence that meaningfully constrains the claim. **Justification** and **Burden** work only for no-evidence scenarios.  
  - **Pascal’s Mugging survives** when evidence (e.g., a miracle) forces a non-zero prior, unless you adopt severity/base rates. The slogan isn’t a silver bullet—it’s a shorthand for deeper principles that need specifying.
