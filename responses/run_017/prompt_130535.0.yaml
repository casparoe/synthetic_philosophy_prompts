prompt: |-
  You are a professional moral philosopher who also designs classroom simulations for pre-college students, and you are very good at building activities where the mechanism itself carries the argument. Please think carefully before you write: first brainstorm two or three candidate mechanics for the activity I describe below, say in a sentence or two why each would or wouldn't work, and only then commit to one and give me the full specification. I would rather have one well-tuned game than three sketches.

  The setting: I run an after-school ethics club at my high school — usually about fourteen students, grades 10 through 12, one 70-minute session, a classroom with a whiteboard, index cards, two colors of poker chips, a shoe box for secret ballots, and a phone timer. No budget, no prizes, and I would rather nobody have to handle real money. We have already done one session on trolley cases and one on the simple "maximize total happiness" idea, so everyone can say something like "add up the happiness and pick the biggest total" — but please don't assume they know any technical vocabulary, and please don't rely on our having read anything. One student is a convinced, articulate consequentialist who will happily defend aggregation; two or three others are instinctively suspicious of it but can't say why. Last session that one student named the move the group was making about ten minutes in and the discussion collapsed into him explaining himself, so I want rules that make that harder.

  Here is the idea I want them to run into, without hearing its name until the very end: the thought that a lot of small harms happening to many different people can be totaled up and outweighed by one large benefit to someone else, and that this feels importantly different from the very same arithmetic when it all happens inside a single person's life. I want my club to feel the pull of refusing to add across people, and to feel it as a problem for the maximizing view rather than as a quirky intuition, and I'd like them to generate something close to the objection in their own words before I supply the phrase (a teacher told me the phrase is associated with Rawls — I don't need the citation, and please don't give me a reading list or any sources at all; I just want the activity).

  Some mechanics I've been playing with, which you should freely discard or recombine: presenting the identical decision twice, once as a *serial* version (all the costs and benefits landing on one person over time) and once as a *distributed* version (spread across many people at once), with nobody told that the two are numerically the same; a role — call it the accountant — who receives only totals, never names, and reports a verdict before the group finds out who was affected; a transfer rule where a harm-chip can move from one person to another only with that person's own signature at the moment of the harm, so that neither an advance promise nor a later apology counts; and a "proxy" card letting one player volunteer to absorb another player's pain one-for-one. Pick whichever arrangement best produces the collision, and tune the numbers carefully (how many people, how large each harm, how large the offsetting benefit) so the aggregation verdict is stable and the intuition isn't just swamped by pity for an identifiable victim, or by the fact that the chips feel like play money.

  What I need from you: the rules and materials; how to assign roles without anyone guessing the point; a minute-by-minute timeline including a silent secret-ballot round; the exact wording for the recording sheet each student fills in; and then a debrief that maps specific moments in the session onto parts of the idea, ordered so that the group's own words come first and my terminology comes last. Tell me honestly what will go wrong the first time I run it — herding, the vocal consequentialist spoiling it, someone refusing to play, students treating chips as currency, the arithmetic being wrong — and what to do in each case. Tell me what to cut if we're running fifteen minutes short. And be explicit about which feature of the idea the activity cannot reproduce: I suspect the game can make aggregation feel wrong but can't show that its feeling wrong is a moral fact rather than a psychological one, and I don't know how to handle the "but everyone might have agreed to the rule in advance" reply, so please say plainly which parts the facilitator simply has to say out loud. Finish with one sentence stating what a student should be able to say, in their own words, on the way out the door.
reasoning: |-
  Okay, let me unpack this teacher's request carefully. They run a high school ethics club and want a simulation that makes students feel the tension between aggregating small harms across people versus within one person, without using technical terms. The key challenge is preventing their vocal consequentialist from dominating while helping others articulate their unease.

  Hmm... three mechanics come to mind. First, a "serial vs parallel" setup where students experience the same numbers first as one person's timeline of harms/benefits, then as a group distribution. But this might make the equivalence too obvious too early. Second, an "accountant" role that sees only anonymized totals - great for depersonalization, but risks feeling artificial with poker chips. Third, a "harm transfer" system requiring real-time consent for each harm redistribution, which could powerfully demonstrate the boundary between persons but might get bogged down in procedure.

  The consent mechanic seems strongest - it makes the bodily autonomy angle visceral. When someone tries to move a harm chip to another player, that player must physically sign the chip right then. No promises, no apologies. That should create friction when the consequentialist wants to redistribute for the greater good.

  For numbers: let's use 12 students. Give each 3 blue harm chips (each -1) and one person gets a gold +15 benefit chip. The math clearly favors redistribution (15 > 12*1) but requiring immediate signatures will block it. Poker chips work well here - tangible but not like money.

  Setup should disguise the intent: call it "The Burden Exchange Game" where players can reallocate "discomforts." Assign roles randomly via numbered index cards. The secret ballot (votes on whether redistribution should happen) comes before any discussion to capture raw intuition.

  During play, I anticipate the consequentialist will protest the signature rule - that's perfect! Let them hit that wall. When someone refuses to sign, note how that differs from the serial version where one person absorbs all harms voluntarily.

  Debrief is crucial: start by asking about the ballot results, then explore why signatures were withheld. Only at the end name "aggregation across persons" as the concept. The teacher will need to explicitly state that the game can't prove this is morally wrong - just that it feels different - and handle the "prior consent" counter by distinguishing advance promises from real-time refusal.

  Cutting options: if short on time, skip the serial scenario replay. The distributed version alone creates enough tension. What we absolutely need is that moment when a player says "But these are my chips to carry" or similar - that's the raw material for the insight.
answer: |-
  Here’s a complete simulation design focused on the "refusal to aggregate across persons," tuned for your constraints and goals. The mechanic centers on **real-time consent barriers** to redistribute harms.

  **Core Mechanic:**  
  *Harm transfers require immediate, witnessed consent from the recipient at the moment of harm.* This makes aggregation logistically possible but psychologically/ethically fraught.

  ---

  ### **"The Consent Exchange" Simulation**  
  **Materials:**  
  - Poker chips: **Blue** (harm, -1 each), **Gold** (benefit, +15)  
  - Index cards (1 per student)  
  - Shoe box for ballots  
  - Whiteboard (for tallies)  
  - Timer  

  **Prep:**  
  - Create 12 role cards (even if 14 students; 2 observe/help tally):  
    - 10 cards: "You have **3 blue chips**. Your goal: End with as few blue chips as possible."  
    - 1 card: "You have **1 gold chip** (+15). Your goal: Keep it."  
    - 1 card: "**Accountant**: Track totals secretly. Do not speak."  
  - Pre-calculate: Group has 30 blue chips (-30). Gold chip (+15) offsets net to -15. *If redistributed evenly, all end at -1.25—better than most start (-3).*  

  **Assign Roles:**  
  - Shuffle cards face-down. Students draw randomly.  
  - *Disguise:* "Today we’re testing how trade rules affect fairness. Accountant is just for math checks."  

  ---

  ### **Timeline (70 min)**  
  **0-5 min: Setup**  
  - Hand out role cards/chips. Have students hold chips visibly.  
  - Rules:  
    > 1. You may give away blue chips *if* another player **accepts it publicly right now**.  
    > 2. Gold chip cannot be given away.  
    > 3. When I say "FREEZE," all trading stops.  
    > 4. **Goal: Minimize your own blue chips.**  

  **5-10 min: Silent Ballot**  
  - Ballot question: *"Should we force everyone to share blue chips equally? Yes/No"*  
  - Collect votes in shoebox. *Do not reveal results yet.*  

  **10-25 min: Trading Phase**  
  - Start timer (15 min). Students negotiate trades.  
  - **Key rule enforcement:** If Alice tries to give Bob a blue chip, Bob must say "I accept" *aloud* for it to move. No advance promises.  
  - *Facilitator:* Veto trades violating rules ("Sorry, no IOU for later").  

  **25-30 min: Freeze & Tally**  
  - All stop. Accountant reports:  
    > "Total blue chips: 30. Gold chip: +15. Group net: -15."  
  - Students count their own blue chips. Report to whiteboard:  
    | Player | Final Blue Chips |  
    |--------|-------------------|  
    | P1     | 2                 |  
    | P2     | 4                 |  
    | ...    | ...               |  
    | Gold   | 0                 |  

  **30-50 min: Discussion**  
  - Reveal ballot results (likely majority "No" to forced sharing). Ask:  
    1. *"Who ended worse off? Why didn’t trades fix this?"*  
    2. *"Did anyone refuse a chip? Why?"*  
    3. *"The gold holder could’ve ‘paid’ others to take chips. Why didn’t that work?"*  
  - **Target insights:**  
    - "It’s easy to say *someone* should take the harm—but hard to get volunteers."  
    - "The group total got better, but I still feel bad for those stuck with extra chips."  
    - "Why does it feel different when one person suffers a lot vs. many suffer a little?"  

  **50-65 min: Debrief & Concept Reveal**  
  1. **Map student quotes:**  
     - *"No one wanted my chips!"* → **Harm distribution requires consent**  
     - *"It’s unfair that Gold kept +15!"* → **The aggregation paradox** (big gain vs. dispersed losses)  
     - *"We could’ve all had -1 if we shared!"* → **Efficiency vs. autonomy**  
  2. Introduce terminology:  
     > "You’ve hit a key question: Can we add *across persons* like we add within one life? This is called the **problem of interpersonal aggregation**. Rawls argued we shouldn’t treat society like one big person."  

  **65-70 min: Exit Reflection**  
  - Recording sheet (1 sentence):  
    *"One thing that surprised me about the trade rules was..."*  

  ---

  ### **Pitfalls & Fixes**  
  - **Vocal consequentialist dominates:**  
    - *Prevent:* Assign them the Gold role (distracted defending privilege) or Accountant (silent).  
    - If they lecture: "Interesting! Let’s hear if others had the same experience."  

  - **Chips feel "fake":**  
    - *Fix:* Use visceral language ("blue chips = 10 mins of community service").  
    - If students trade frivolously: "Remember, your goal is to *avoid* holding these."  

  - **Arithmetic fails:**  
    - *Prevent:* Accountant double-checks totals pre-game. Net must be negative (-15) so "efficient" solution (-1.25) is mathematically clear.  

  - **Refusal to play:**  
    - *Fix:* Frame roles neutrally ("Gold isn’t ‘bad’—it’s a test of incentives").  

  - **"Prior consent" objection:**  
    - *Acknowledge:* "Some philosophers say advance agreements solve this. But the game shows *why* people might reject those deals in the moment."  

  ---

  ### **What the Game Can’t Do**  
  - **Cannot prove aggregation is immoral**—only makes the intuitive resistance tangible. You must say:  
    > "This simulation shows *why* people question adding across lives. Whether that feeling reflects a moral truth is what we debate."  

  - **Cannot simulate pre-commitment** convincingly. Address explicitly:  
    > "Even if everyone agreed upfront to share harms, the game reveals how hard it is to enforce when real suffering lands."  

  ---

  ### **Cut If Short on Time**  
  - Skip the ballot (use discussion to surface opinions).  
  - Shorten trading phase to 10 min (focus on failed negotiations).  

  ---

  ### **Exit Sentence Goal**  
  A student should say:  
  *"It’s weird—the math says sharing harms is better, but it felt wrong to force it on people who said no."*  

  This creates the foundation for you to later distinguish between *efficiency* and *moral boundaries between persons*. The mechanic forces confrontation with consent while making aggregation numerically compelling—a tension that demands reflection.
