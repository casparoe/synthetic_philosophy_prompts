  Here is the decision tree handout meeting all specified requirements. The tree has 7 branch questions (using all 6 required cases plus one derived question), 10 leaves (including 3 empty cells and one outsider position), and fits within word constraints.

  ---

  ### Decision Tree: Pathways through the Combination Problem

  Starting commitment: There is something it is like to be an awake human, grounded in the intrinsic/categorical nature of the physical.

  1.  **Grain Question:**  
      Suppose physics revealed that the categorical properties grounding experience exist *only* at the level of fundamental particles (*not* at neuron or organism level). Would this imply human experience *cannot* be grounded at that micro-level?  
      *   **No →** (Go to 2)  
      *   **Yes →** (Go to 3)  

  2.  **Census Question:**  
      In a room with three awake humans, one dreamlessly sleeping human, and a cat, how many *distinct subjects of experience* are there?  
      *   **Three (humans only) →** (Go to 4)  
      *   **Four (humans + cat) →** (Go to 5)  
      *   **More than four →** (Go to 6)  

  3.  **Grain Solution Leaf:** *No Standard Name (Grain Solution)*  
      *(Position: Base experiential/proto-experiential facts reside at a coarse enough grain (e.g., whole brains or organisms), avoiding combination entirely. Awkward Commitment: Discovering experiential quarks would falsify the view.)*  

  4.  **Organoid/Colony Question:**  
      Consider a brain organoid (1m neurons), a mature ant colony, and a large corporation. Which, if any, possess genuine (non-derivative) subjecthood?  
      *   **None possess genuine subjecthood →** (Go to 7)  
      *   **Only the organoid might (degree/threshold) →** (Go to 8)  
      *   **All possess genuine subjecthood (degree/yes) →** (Go to 9)  

  5.  **Split-Brain Question:**  
      After complete callosotomy (split-brain), how many subjects exist?  
      *   **One subject →** (Go to 10)  
      *   **Two subjects →** (Go to 11)  
      *   **The question is ill-posed/unanswerable →** (Go to 12)  

  6.  **Empty Cell A:** *Incoherent*  
      *(Diagnosis: Affirming micro-subjects alongside macro-subjects but denying the cat is a subject while humans are, contradicts the micro-subject premise unless a sharp, unexplained threshold at humans is assumed.)*  

  7.  **Fission/Recombination Question:**  
      After hemisphere separation (each sustaining a subject) and later reconnection, is the reconnected subject:  
      *   **Identical to the original pre-split subject? →** (Go to 13)  
      *   **A new subject? →** (Go to 14)  

  8.  **Inverted-Bonding Question:**  
      Is a world physically identical to ours, with identical micro-experiential facts, but *no* unified human consciousness (e.g., only micro-experiences), conceivable?  
      *   **Yes, conceivable →** (Go to 15)  
      *   **No, inconceivable/excluded →** (Go to 16)  

  9.  **Empty Cell B:** *Mereologically Unattractive*  
      *(Diagnosis: Affirms micro-subjects and that firms/colonies are subjects, but denies the sleeping human is one, requiring an arbitrary exclusion principle for dormant complex systems.)*  

  10. **Panprotopsychist Leaf:** *Panprotopsychism*  
      *(Position: Base facts are proto-phenomenal (non-experiential but capable of constituting experience), and macro-experience is constituted by them plus structure. Awkward Commitment: Proto-phenomenal properties are fundamentally inscrutable.)*  

  11. **Functionalist/Illusionist Leaf:** *Illusionism (Outsider)*  
      *(Position: The starting premise is false; the appearance of macro-subjecthood arises solely from complex physical/functional organisation, with no intrinsic grounding needed. Awkward Commitment: Your vivid sense of self is a pervasive illusion.)*  

  12. **Constitutive Panpsychism Leaf (Contingent):** *Constitutive Panpsychism (Contingent Binding)*  
      *(Position: Macro-subjects are constituted by micro-subjects standing in contingent (e.g., nomic) phenomenal binding relations. Awkward Commitment: Human consciousness depends on fragile, contingent laws of nature.)*  

  13. **Constitutive Panpsychism Leaf (Necessary):** *Constitutive Panpsychism (Necessary Binding)*  
      *(Position: Macro-subjects are constituted by micro-subjects standing in necessary phenomenal binding relations. Awkward Commitment: Micro-subjects necessarily 'lose themselves' irreducibly in macro-unity.)*  

  14. **Non-Relational Panpsychism Leaf:** *Non-Relational Russellian Monism / Identity of Composition*  
      *(Position: The macro-subject is nothing over and above the micro-subjects arranged physically/functionally; no further binding relation is needed. Awkward Commitment: The boardroom of a large firm hosts a genuine composite subject.)*  

  15. **Emergentist Panpsychism Leaf:** *Emergentist Panpsychism*  
      *(Position: The macro-subject is a fundamental, novel entity emerging brutely from micro-subjects in complex organisation. Awkward Commitment: Your consciousness is a distinct entity 'sitting above' your neurons.)*  

  16. **Cosmopsychism Leaf:** *Cosmopsychism (Aspectival)*  
      *(Position: Only one cosmic subject exists; apparent individuals (like humans) are aspects/modes/partial perspectives of it (solving the decombination problem - how one subject appears as many). Awkward Commitment: You are not fundamentally distinct from the chair you sit on.)*  

  17. **Eliminativist Leaf:** *Micro-Subject Eliminativism*  
      *(Position: Only fundamental micro-level entities are genuine subjects; macro-subjecthood (like human consciousness) is an illusion or misdescription. Awkward Commitment: Individual neurons have richer experience than 'you' do.)*  

  18. **Empty Cell C:** *Unexplored*  
      *(Diagnosis: Affirms micro-subjects, one split-brain subject, and diachronic identity through recombination, but denies necessary bonding. This combination of contingent binding with strong synchronic/diachronic unity constraints lacks a clear advocate.)*  

  ---

  ### Leaf Table

  | Label                              | Answer Pattern (Branch Numbers → Answers) | One-Sentence Position Statement                                                                 | Awkward Commitment                                                                 |
  | :--------------------------------- | :----------------------------------------- | :---------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------- |
  | **Grain Solution** (No std name)   | 1 → Yes                                    | Experience is grounded only at a coarse physical grain (e.g., brains), avoiding combination.     | Discovering experiential electrons falsifies the view.                             |
  | **Empty Cell A**                   | 2 → More than four                         | *(Incoherent: Affirms micro-subjects but denies cat subjecthood arbitrarily.)*                  | —                                                                                  |
  | **Panprotopsychism**               | 4 → None possess genuine subjecthood       | Macro-experience is constituted by proto-phenomenal (non-experiential) base properties + structure. | Proto-phenomenal properties are forever beyond our conceptual grasp.               |
  | **Illusionism** (Outsider)         | 5 → Two subjects                           | Macro-subjecthood is an illusion generated by complex function; no intrinsic grounding needed.  | Your vivid sense of self is a pervasive, useful fiction.                           |
  | **Constitutive P'ism (Contingent)**| 5 → One subject, 8 → Yes conceivable       | Macro-subjects are constituted by micro-subjects + contingent phenomenal binding relations.     | Human consciousness could vanish if cosmic binding laws changed.                   |
  | **Constitutive P'ism (Necessary)** | 5 → One subject, 8 → No inconceivable      | Macro-subjects are constituted by micro-subjects + necessary phenomenal binding relations.      | A neuron's micro-experience is necessarily incomplete outside a brain.             |
  | **Non-Relational P'ism**           | 5 → Two subjects, 4 → All possess...       | Macro-subject = micro-subjects arranged physically/functionally; no extra binding relation.     | A sufficiently organised corporation is a conscious subject.                       |
  | **Emergentist Panpsychism**        | 5 → Question ill-posed, 7 → New subject    | Macro-subjects are fundamental entities emerging brutely from organised micro-subjects.         | Your consciousness is a distinct entity "riding on" your brain activity.           |
  | **Cosmopsychism (Aspectival)**     | 2 → Three (humans only), 7 → Identical     | One cosmic subject exists; apparent individuals are its aspects/modes (solving decombination).   | You are not fundamentally separate from this table.                                |
  | **Micro-Subject Eliminativism**    | 2 → Three (humans only), 4 → Only organoid?| Only micro-level entities are true subjects; macro-subjecthood is illusory/derivative.           | An individual neuron has a richer inner life than your human experience.           |
  | **Empty Cell B**                   | 2 → Four, 4 → Only organoid might...       | *(Unattractive: Affirms micro-subjects and colony/firm subjects but denies sleeping human.)*    | —                                                                                  |
  | **Empty Cell C**                   | 5 → One subject, 7 → Identical, 8 → Yes    | *(Unexplored: Contingent binding + strong synchronic/diachronic unity constraints.)*            | —                                                                                  |

  ---

  ### Notes on Structure

  *   **Separating Questions:** The Inverted-Bonding question (8) cleanly separates the Necessary and Contingent Constitutive Panpsychism leaves.
  *   **Inseparable Pairs:**
      1.  **Non-Relational P'ism vs Specific Cosmopsychism:** The tree cannot separate Non-Relational Panpsychism (where macro-subjects are just aggregates) from a *non-aspectival* Cosmopsychism where the cosmic subject is simply the aggregate of all micro-subjects. The Fission/Recombination case *might* separate them if non-relationalism struggles with diachronic identity through fission, but this isn't guaranteed by the tree's nodes. *Diagnosis:* Both views see macro-subjects as aggregates; a question forcing a choice between fundamental unity or fundamental plurality is needed (e.g., "Is the universe fundamentally *one* subject or *many*?").
      2.  **Aspectival Cosmopsychism vs Micro-Eliminativism:** Both end up denying distinct human-level subjects in the Census question (Answer: Three humans only). The Organoid question *might* separate them (Eliminativism leans toward 'only organoid might', Cosmopsychism toward 'none'), but the answers aren't strictly forced apart here. *Diagnosis:* Both views dissolve the human subject; a question about the *reality* of micro-experiences (e.g., "Do fundamental particles have intrinsic experience?") would separate them (Cosmopsychism: No, only cosmic experience; Eliminativism: Yes).
  *   **Definitions:**
      *   **Decombination Problem:** The problem for cosmopsychism of explaining how one fundamental cosmic subject gives rise to the appearance of many individual subjects (like humans).
      *   **Grain Problem:** The question of which level(s) of physical reality possess the intrinsic/categorical properties grounding consciousness.
  *   **Word Count:** ~1150 words.
