prompt: |-
  I'm a senior counsellor at an outpatient addiction clinic and I chair the weekly conference where we decide what to do about what clients tell us about their own use — "I can stop whenever I want", "the test must be wrong", "I only drink when things are bad and things are fine now". About a dozen a week, ten or fifteen minutes each, junior staff with no philosophy background have to be able to run it, and anything that changes a treatment plan gets signed off by the clinical lead. So I want a decision procedure, not an essay on denial.

  The problem is we use "in denial" for about six different states and it matters which one it is: the client knows and is lying to us; the client knows and simply can't act on it (ordinary weakness of will, nothing wrong with their beliefs); the client has arranged not to find out — skipping the blood draw, getting their partner to pick up the results and not tell them; the client genuinely never had the information; and the client is filling a gap (blackouts, fuzzy memory) with a story that isn't especially motivated by anything. I want steps that separate those and say what follows: when we push, when we drop it and move on, when we go and get more evidence, and when we stop and hand it to the lead because what's left is a values call about how hard to lean on someone.

  Two constraints from what I've read about self-deception, which I want baked in rather than footnoted: it doesn't have to be something the person decided at some point, so no hunting for the moment they chose to fool themselves — look at what's sustaining the not-knowing right now; and once we've decided we can't take someone's word about their own state, we can't turn around and use their word as evidence about it. There's also a case I don't know what to do with: two of our groups have converged on a shared line ("none of us really has a problem, the clinic exaggerates") that nobody seems to hold on their own. Treat that as a case the procedure has to handle, not a footnote.

  Give me the questions in order, what counts as a good enough answer to each, where the procedure just stops with a no, and where it stops because the question is values and not facts. Then run it on two real cases: (1) a client with a positive screen who insists the lab mixed up the samples and has now asked his brother, who he lives with, to pick up his results so he never has to open the portal; (2) a client who says "I can stop any time, I've done it before" — and has in fact stopped for three months twice, whose use is down a lot but not zero, and who the junior staff all want to call denial. That second one, please give me the answer I won't like even if it means we drop the denial framing. And tell me straight what the procedure can't do.

  No preamble: lead with your bottom line in the first sentence, then the reasoning.
reasoning: |-
  Alright, let me tackle this query from the senior addiction counselor. They need a practical decision procedure for identifying different types of denial in clients, with clear steps their junior staff can follow without philosophy background. The key requirements are: distinguish between six denial states (lying, weakness of will, information avoidance, genuine ignorance, memory gaps, groupthink), incorporate constraints about self-deception being sustained not chosen, and avoid using client's self-report as evidence once deemed unreliable.

  First, I'll map the six denial states to actionable checkpoints. The core insight is to structure the assessment like an elimination tree - starting from most verifiable states (genuine ignorance) down to most complex (group-influenced denial). The two constraints mean: 1) Focus questions on current sustaining factors ("what keeps this belief going?") not historical intent 2) Never accept "I'm not in denial" as proof after establishing unreliable self-report.

  The tricky part is handling the group denial case. Since it's emergent behavior not held individually, the procedure must detect when multiple clients reference identical phrasing without external validation. Solution: add Step 3 to specifically check for "common script" patterns across cases.

  For the case examples: 
  - Case 1 (lab mix-up claim with result avoidance) clearly hits Step 4 (information blocking) based on evidence suppression. Treatment implication: structured exposure to results with witness.
  - Case 2 ("I can quit anytime" with partial reduction history) is actually akrasia (Step 5) - the behavior shows capacity to reduce but not sustain abstinence. Junior staff's desire to call it denial ignores the reduction evidence. Procedure forces confronting that discrepancy.

  Biggest limitation: The procedure can't resolve when avoidance serves legitimate psychological protection versus enabling addiction. That's the clinical lead's values call on "how hard to push" - marked as terminal values stops.
answer: |-
  ### Bottom Line Decision Procedure for Assessing "Denial" States  
  **A 5-step flowchart that terminates in specific actions (push/drop/evidence/values), excludes self-report once invalidated, and handles group-influenced denial without requiring conscious intent.**  

  ---

  ### **Decision Procedure**  
  **Ask these questions in order; stop at first match.**  

  1. **"Is there objective evidence the client genuinely lacks the information?"**  
     - *Check:* Missing test results, no access to data, or verifiable gaps in knowledge (e.g., client unaware of liver damage).  
     - **Yes** → **Action: Provide information clearly. Drop "denial" framing.**  
     - **No** → Proceed to Step 2.  

  2. **"Is the client actively avoiding exposure to evidence?"**  
     - *Check:* Skipping appointments, delegating result retrieval, blocking communication (e.g., partner hiding lab reports).  
     - **Yes** → **Label: Information Blocking**. **Action: Obtain evidence directly (e.g., clinic retrieves results). Push via structured exposure (e.g., in-session result review).**  
     - **No** → Proceed to Step 3.  

  3. **"Does the account match a group script not held individually?"**  
     - *Check:* Shared phrases across clients (e.g., "clinic exaggerates"), divergence from past individual statements, peer-confirmed group narratives.  
     - **Yes** → **Label: Group-Influenced Avoidance**. **Action: Separate client from group (adjust therapy schedule). Gather independent evidence. Escalate to clinical lead for values call on group dynamics.**  
     - **No** → Proceed to Step 4.  

  4. **"Is the account contradicted by objective evidence (labs, witnesses, observed behavior)?"**  
     - *Check:* Positive drug screen despite claims of abstinence, collateral reports of use, observed intoxication.  
     - **Yes** → **Action: Present evidence neutrally. Proceed to Step 5.**  
     - **No** → **Stop: Drop "denial" framing. Address as belief/memory issue (e.g., cognitive testing for blackouts).**  

  5. **"Does the client acknowledge the facts but resist action?"**  
     - *Check:* Admits use but dismisses severity ("I can quit anytime"), agrees with evidence but avoids change.  
     - **Yes** → **Label: Weakness of Will (Akrasia). Action: Drop "denial" framing. Focus on motivation/barriers (e.g., cost-benefit analysis).**  
     - **No** → **Label: Intentional Deception**. **Action: Escalate to clinical lead. Values call on confronting vs. disengaging.**  

  ---

  ### **Constraints Applied**  
  - **No "choice" hunting:** Steps 2/3/5 focus on *current* sustaining behaviors (avoidance, group reinforcement, inaction).  
  - **No self-report loopholes:** If Step 4 is triggered (objective contradiction), self-report is excluded from evidence.  

  ---

  ### **Case Applications**  
  **Case 1: Client claims lab mix-up, brother retrieves results**  
  - Step 1: No information lack (client knows test exists). → **Proceed.**  
  - Step 2: Actively avoiding evidence (brother intercepts results). → **Label: Information Blocking.**  
  - **Action:** Clinic retrieves results directly. Push with in-session review. Brother excluded from result chain.  

  **Case 2: Client says "I can stop anytime," with partial reductions**  
  - Step 1: Client has information (acknowledges past use). → **Proceed.**  
  - Step 2: No evidence avoidance. → **Proceed.**  
  - Step 3: No group script. → **Proceed.**  
  - Step 4: Objective evidence: Use reduced but not stopped. *No contradiction*—client never claims current abstinence. → **Action: Drop denial framing.**  
  - Step 5: Client acknowledges facts ("I’ve stopped before") but resists full abstinence. → **Label: Weakness of Will (Akrasia).**  
  - **Unpopular Truth:** **Not denial.** Client’s belief aligns with evidence (can reduce, not sustain). Junior staff error: Misinterpreting partial success as denial. **Action:** Shift to motivational work on maintaining abstinence, not proving "denial."  

  ---

  ### **What the Procedure Can't Do**  
  1. **Resolve values conflicts:** E.g., How hard to "push" when deception is confirmed (Step 5 end point).  
  2. **Detect self-deception without observable markers:** If no avoidance, group influence, or objective contradiction, the procedure defaults to "no denial" (Step 4 exit).  
  3. **Fix memory gaps:** Labels but doesn’t treat blackouts/fuzzy recall.  
  4. **Override clinical risk:** Urgent safety concerns (e.g., suicidality) bypass this protocol.  

  ---  
  **Procedure Time:** ≤10 minutes/case. Trained juniors apply steps; only Steps 3/5 escalate to clinical lead.
