answer: |-
  ### Brainstorming: Candidate Framings  
  1. **Framing 1: Task-Type Dependence**  
     *Question:* Does the *structure* of a task (one-shot vs. open-ended) determine whether "know-how" is best analyzed as propositional knowledge or a non-intellectualist capacity?  
     *Tractability:* High. Focuses on comparative case studies (e.g., safecracking vs. parenting). Avoids rehashing entire debate.  

  2. **Framing 2: Modal Profiles as Primary**  
     *Question:* Do disagreements in the literature stem from unexamined assumptions about the *circumstantial robustness* required for know-how attributions?  
     *Tractability:* Medium. Requires novel semantics for "knows how," risks drifting from core action-theoretic concerns.  

  3. **Framing 3: Guidance vs. Executability as the Key Split**  
     *Question:* Does the executability/guidance distinction (e.g., amputee pianist) explain why intellectualism fails for open-ended tasks but succeeds for one-shot cases?  
     *Tractability:* High. Leverages Ryle’s regress directly; uses existing distinctions to cut the knot.  

  4. **Framing 4: Anti-Unification via Failure Cases**  
     *Question:* Can both intellectualist and ability theories be systematically defeated by open-ended cases, forcing a pluralist account?  
     *Tractability:* Low. Requires defending pluralism against heavyweights (e.g., Stanley), likely exceeding a year.  

  **Chosen Framing: #1 (Task-Type Dependence)**. It directly targets the user’s core insight, leverages both distinctions (i-ii), and is surgically tractable. Framing #3 is embedded within it.  

  ---

  ### Proposal: "The Structure of Know-How: Task-Type Dependence in Intellectualist and Ability Accounts"  
  **(~1,100 words)**  

  **1. Core Question & Gap**  
  The knowledge-how debate asks whether "S knows how to φ" reduces to propositional knowledge (intellectualism) or ability (anti-intellectualism). Yet this 80-year stalemate overlooks a critical variable: the *temporal and structural profile* of φ. I argue that the debate’s central cases (e.g., Stanley & Williamson’s archer, Ryle’s chess player) are unrepresentative "one-shot" tasks—discrete, with clear success conditions and minimal feedback dependence. But much know-how (e.g., "knowing how to sustain a friendship") is open-ended: extended, goal-revisable, and ecologically embedded. The intellectualist account (propositional knowledge under practical modes of presentation) plausibly handles one-shot cases. The ability-based account (e.g., Hawley’s reliable capacities) better explains open-ended cases. This project asks: **Does the structure of a task determine which account of know-how applies, and what features (e.g., guidance demands, modal robustness) explain this split?**  

  Existing positions leave this open. Intellectualists (Stanley, Pavese) focus on tasks where success is binary and guidance is algorithm-like, neglecting how open-ended tasks require adaptive recalibration. Ability theorists (Ryle, Habgood-Coote) rightly stress embodied skill but lack tools to explain "guidance without executability" (e.g., knowing how to raise a child *before having one*). Neither addresses how attributions’ *modal profiles*—how much environmental variation S can tolerate while "knowing how"—differ across task types. This oversight fuels talking-past: cases are cherry-picked to fit theories, not vice versa.  

  **2. Method: Case-Driven Taxonomy with Diagnostic Criteria**  
  I will avoid purely armchair analysis or semantic borrowing. Instead:  
  - **Phase 1 (Months 1–3):** Re-engineer the case library. Catalog 30+ know-how attributions across one-shot (e.g., "know how to solve this equation"), transitional (e.g., "know how to run a meeting"), and open-ended tasks (e.g., "know how to navigate grief"). Test each against both accounts using two new diagnostic tools: (i) *Guidance/Executability Asymmetry* (can S guide others while unable to execute?), (ii) *Modal Stress-Testing* (how do attribution conditions shift under perturbation?).  
  - **Phase 2 (Months 4–6):** Identify cross-task patterns. Use philosophical analysis to isolate structural features (e.g., goal stability, feedback latency, complexity thresholds) that predict which account fits. Extract failure conditions for each theory (e.g., intellectualism breaks when goals are dynamic).  
  - **Phase 3 (Months 7–9):** Develop a bifurcated model. Propose criteria for when intellectualism or ability theory applies, using guidance and modal robustness as keystones. Argue that Ryle’s regress only threatens intellectualism for open-ended tasks.  
  - **Phase 4 (Months 10–12):** Synthesize implications for epistemology of action. Draft two papers: one on the taxonomy, one on attribution contexts.  

  *Why this method?* Armchair cases alone risk bias; conceptual analysis needs empirical anchors. Semantics (e.g., "knows how" ascriptions) is downstream of task structure here. The phased approach yields publishable outputs even if unification fails.  

  **3. Outcomes & Failure Conditions**  
  *Best-case result:* A rigorous taxonomy showing that task structure (not content) explains the debate’s stalemate. One-shot tasks favor intellectualism due to low guidance demands; open-ended tasks demand ability theory for robustness. The guidance/executability split and modal profiles serve as diagnostic markers. This would reframe the literature, showing that "knows how" is domain-specific but not disunified—with actionable criteria for attribution.  

  *Failure conditions:*  
  - No clear split emerges: cases resist categorization.  
  - Distinctions (i-ii) prove irrelevant: modal profiles don’t covary with task types.  
  - "Two papers" failure: the taxonomy and attribution analysis lack a shared mechanism.  

  **4. Scope & Constraints**  
  Scope is bounded to *human agency* (excluding AI/animal know-how) and philosophical (not empirical) case curation. The biggest risk is open-ended tasks’ heterogeneity (e.g., "knowing how to govern" vs. "knowing how to garden"). I mitigate this by focusing on *structural* not substantive features (e.g., all open-ended tasks share goal plasticity). One year suffices for a proof-of-concept model; a five-book project would need cognitive science integration.  

  **5. Hostile Readers Answered**  
  - *Colleague ("Two topics stapled"):* "No: task structure is the *single* variable explaining why the same linguistic form (‘knows how’) masks two distinct relations to action—this is a unified diagnostic project."  
  - *Foundation reviewer ("No new insights"):* "Conceptual clarity here is *practically urgent*: e.g., misapplying intellectualism to open-ended tasks (like crisis management) justifies harmful ‘expertise’ metrics; this project shows why."  

