prompt: |-
  I'm a senior in high school, and since this summer I've been stuck on an argument my friend — a first-year biology major — keeps making about the units of selection. I've written it out as carefully as I can. (1) Selection occurs only when entities vary in heritable ways that make them differ in how much they contribute to later generations, so anything that is to count as a unit of selection must (a) come in variants, (b) have offspring, and (c) transmit its variant to those offspring with enough fidelity for the differences to accumulate over generations. (2) Gene lineages satisfy all three: a gene is copied, its copies are copies of it, and the copying can be nearly perfect across very many generations. (3) Organisms and groups do not. An organism's offspring are not copies of it — a sexually produced offspring is one recombination out of astronomically many — and a fissioning group's daughter groups do not inherit its composition with the fidelity that cumulative selection needs. So neither organisms nor groups can be the things selection sorts. (4) Therefore genes are the units of selection; organisms and groups are vehicles, things genes build whose properties matter only insofar as they shift gene frequencies. (5) So no trait is an adaptation for the organism or for the group; there are only gene-level effects, and saying that the heart's function is to pump blood for the organism is shorthand that cashes out entirely in gene-level bookkeeping. (6) And the argument runs one level down too: a body is a population of cells, cells vary and reproduce at different rates and pass variants to daughter cells, and cell lineages are what literally get copied — so the organism is not a unit of selection either, and the germ line's sequestration, immune systems, and hearts are cell-lineage (ultimately gene-level) effects with organism-shaped side effects. (7) So there are no organism-level and no group-level adaptations at all, and the appearance of organisms as designed wholes is an artifact of selection among gene lineages.

  I can't accept (7), and neither can he — he fully intends to keep saying that hearts are for pumping blood and that some social insects are sterile for the colony's sake — but neither of us can say where his argument stops being sound. I tried two cases on him. Case one: a colonial species whose colonies reproduce by splitting into daughter colonies that carry a biased sample of the parent's genotypes; colonies with more of trait T split more often, even though within any single colony bearers of T leave fewer descendants than non-bearers. He says that's fine, the group-level pattern is just the sum of gene-level effects, and that the two descriptions are competing bookkeeping for one and the same change in frequency — like describing a cloud by its particles or by its center of mass — so calling genes the unit is a choice of description, not a discovery. Case two: an organism with no early-sequestered germ line, so that a mutation arising in a branch that later flowers can end up in seeds. He bites the bullet there and says such a thing simply isn't a unit of selection, it's a coalition of competing cell lineages, and that what makes animals units is that we do sequester a germ line early. Both answers feel to me like they might be the same answer, but I can't tell whether that answer rescues his argument, quietly turns (7) into a conditional claim about the conditions under which a higher level can be a unit at all, or refutes it.

  I'd be grateful if you'd (i) name the exact step where the argument fails, or say if it is valid and tell me which premise is cheapest to give up — I'd rather keep (1) than (2), and I'd much rather give up (7) than (5); (ii) explain why the step you reject looked acceptable in the first place, and what each alternative would cost me, including the cost of taking his bookkeeping line in case one; (iii) show what your diagnosis predicts about case two; and (iv) spend a paragraph on what would change your mind — which consideration, if I could actually establish it, would make you switch to a different step, and where your own reading is most likely to be wrong. Please don't tell me who to read or which papers to look up; I can do that myself. Aim for roughly 700 to 900 words, opening with a one-sentence diagnosis. After the discussion, give me a table with exactly these columns: step — the number of the premise or inference step you are ruling on; verdict — one of keep, reject, or reinterpret; why_it_looked_acceptable — a single sentence on what made the step attractive; cost — a single sentence on what I lose or have to explain if I take that verdict; confidence — high, medium, or low. Include a row for every step from (1) to (7), plus one row for the move from (4) to (5) if you treat it separately.
reasoning: |-
  Okay, the user is a high school senior deeply engaged in a complex debate about units of selection with a biology major friend. This isn't just a casual argument—they've been wrestling with it since summer, and the user has carefully articulated their friend's seven-step gene-centric argument. The core tension is that both intuitively reject the extreme conclusion (step 7) that denies organism-level adaptations entirely, yet can't pinpoint where the logic fails.

  Hmm, the user's actual needs are quite specific: they want a surgical dissection of the argument's weaknesses, not literature recommendations. Their hidden frustration is palpable—they sense the argument oversimplifies biology but lack the tools to dismantle it. The colonial organism and germ-line mutation cases show they're already thinking like a scientist, testing boundaries. 

  Professionally, I recognize this as the classic "gene's-eye view" vs multilevel selection debate. The friend's argument mirrors Dawkins' "selfish gene" rhetoric, but modern evolutionary biology (like Okasha's work) rejects such exclusivity. Step 3's claim about fidelity is particularly shaky—it ignores that natural selection operates on heritable *variation*, not perfect copying. A honeybee colony's reproductive success absolutely can be a heritable trait. 

  The user's attachment to step 1 makes sense—it's textbook natural selection—but the friend misapplies it. Units aren't binary; they're hierarchical. When group reproduction is consistent (like in the colonial case), selection acts at both levels simultaneously. The "bookkeeping equivalence" retort ironically undermines the friend's absolutism—if descriptions are interchangeable, privileging genes is arbitrary.

  For the germ-line case, the friend's "biting the bullet" reveals their circular logic: they define units by sequestration rather than observable selection pressures. But in plants or sponges without early sequestration, somatic mutations *can* contribute to evolution—meaning the organism remains a functional unit. 

  My table will flag step 3 as the critical flaw. Its appeal lies in neat analogies (genes as perfect replicators), but biology is messier. Rejecting it costs little—we just acknowledge that fidelity exists on a spectrum. Steps 5-7 then collapse naturally. Confidence is high because modern EvoBio overwhelmingly accepts multilevel selection (e.g., Wilson's trait-group models). 

  If presented with empirical cases where group traits evolve without genic correlates—like emergent colony thermoregulation in ants—I'd reconsider. But so far, such phenomena align with multilevel frameworks, not gene reductionism.
answer: |-
  ### Diagnosis  
  The argument fails at **step (3)** by underestimating the capacity of organisms and groups to satisfy the criteria for units of selection under specific conditions, thereby invalidating the inference to (4) and the subsequent conclusions.  

  ---

  ### Analysis  
  **(i) Breakdown of the Argument**  
  **Step (3)** is the critical flaw: it incorrectly assumes organisms and groups *cannot* exhibit heritable variation with sufficient fidelity for cumulative selection. While *sexual* organisms don’t produce identical offspring, they transmit a statistically reliable subset of their alleles (≈50% per parent), and phenotypic traits (e.g., heart structure) correlate robustly with reproductive success across generations. For groups, your colonial example demonstrates that "biased sampling" during fission *can* transmit group-level traits (e.g., proportion of T-bearers) heritably if daughter groups resemble parent groups in composition and T increases group fitness. This satisfies (1a–c) at the group level.  

  **Steps (5)–(7)** collapse once (3) is rejected: if groups/organisms *can* be units, adaptations like sterile castes or hearts *do* function for their benefit, even if mediated by gene-frequency changes. Your friend’s "bookkeeping equivalence" in case one inadvertently concedes this—different levels of description aren’t mutually exclusive, but reflect distinct causal processes.  

  **(ii) Why Steps Looked Acceptable & Costs of Rejection**  
  - **Step (1)**: Keep. It correctly defines selection’s prerequisites. *Cost of keeping*: None.  
  - **Step (2)**: Keep. Genes are unproblematic units. *Cost*: None.  
  - **Step (3)**: **Reject**. It appeals to a naïve view of "copying" (demanding near-perfect replication), ignoring that heritability requires only *statistical* resemblance (e.g., offspring height correlates with parental height). *Why acceptable*: Genes *are* high-fidelity replicators, creating a false contrast. *Cost of rejection*: Must accept that higher-level units operate with "messier" inheritance (e.g., Mendelian noise, group stochasticity).  
  - **Step (4)**: **Reject** (inference from 1–3). Invalid due to (3)’s failure. *Why acceptable*: Reductionist intuition that genes are the "ultimate" replicators. *Cost*: Must embrace multilevel selection theory.  
  - **Step (5)**: **Reject**. Traits like hearts *are* adaptations for organisms; gene-level effects explain *how* but not *why* they persist. *Cost*: Rejects "selfish gene" absolutism but preserves compatibility with gene-centric models.  
  - **Step (6)**: **Reinterpret**. Somatic selection occurs (e.g., cancer), but early germline sequestration in animals *minimizes* it, allowing organism-level functionality. *Cost*: Acknowledges that organisms are vulnerable to subversion but are still units when heritable variation exists at organism level.  
  - **Step (7)**: **Reject**. Organisms/groups exhibit adaptations shaped by selection at their level (e.g., ant colonies as superorganisms). *Cost*: None—aligns with empirical biology.  

  **(iii) Prediction for Case Two**  
  Your diagnosis predicts that organisms *without* early germline sequestration (e.g., plants, fungi) can still function as units of selection if somatic mutations rarely impact reproduction or if selection among cell lineages is weak. Organism-level traits (e.g., drought tolerance) can evolve if their heritable basis is transmitted via seeds/spores, even with somatic variation. Your friend’s "biting the bullet" overstates the necessity of germline sequestration; selection acts on whatever variation is heritable at the organism level.  

  **(iv) What Would Change My Mind**  
  I would reconsider if shown that higher-level "adaptations" *always* reduce to gene-level conflicts with no net directional selection at the organism/group level (e.g., if altruism invariably masked by selfish genes). However, cases like multicellularity—where somatic cells forgo reproduction to enhance organismal fitness—demonstrate genuine higher-level selection. My diagnosis is most vulnerable if fidelity at higher levels is too low for cumulative adaptation (e.g., if group fission is highly stochastic). Yet your colonial example proves otherwise: biased transmission enables group selection.  

  ---

  ### Summary Table  

  | Step          | Verdict       | Why it looked acceptable                          | Cost                                | Confidence |  
  |---------------|---------------|---------------------------------------------------|-------------------------------------|------------|  
  | (1)           | Keep          | Core definition of natural selection              | None                                | High       |  
  | (2)           | Keep          | Genes are clear replicators                       | None                                | High       |  
  | (3)           | Reject        | Genes set a high bar for "copies"                 | Must accept noisier inheritance     | High       |  
  | (4)           | Reject        | Reductionist appeal of genes as fundamental       | Requires multilevel framework       | Medium     |  
  | (4)→(5)       | Reject        | Logical extension if (4) true                     | Rejects gene-centrism as exhaustive | High       |  
  | (5)           | Reject        | Seems consistent with (1)–(4)                     | Loses "gene-only" absolutism        | High       |  
  | (6)           | Reinterpret   | Valid within soma but not organism-level denial   | Accepts somatic competition         | Medium     |  
  | (7)           | Reject        | Follows from earlier steps                        | None (empirically unsound)          | High       |  

  ### Key Implications  
  - **You keep (1) and (2)**, reject (3)/(4)/(5)/(7), and reinterpret (6).  
  - **Costs are low**: Accepting noisier inheritance at higher levels is biologically realistic.  
  - **Your cases resolved**: Case one shows group selection is valid; case two shows organisms without germlines can still be units if heritable variation exists.  
  - **Outcome**: Organisms/groups *are* units of selection when they satisfy (1), making hearts "for pumping blood" literally true.
