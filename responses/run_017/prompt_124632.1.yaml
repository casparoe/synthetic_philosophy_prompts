answer: |-
  ### Desiderata for a Theory of Inductive Inference  
  **Core Purpose:** To guide a research group in selecting an inductive bias for a concrete inquiry, providing a *normative justification* beyond subjective preference. Must avoid merely redescribing existing practice or declaring the problem unsolvable.  

  #### Requirements (Categorized and Motivated)  
  1. **Normative Adequacy** (*Non-negotiable*)  
     - **Why**: The theory must justify *why* a bias is rationally obligatory for the group’s goals, not just pragmatically useful. Hume’s challenge demands a reason to trust induction beyond custom.  
     - **Case**: A group studying mRNA vaccines needs to know why preferring simpler molecular models over complex ad-hoc ones is *correct*, not just convenient.  

  2. **Domain-Specific Actionability** (*Non-negotiable*)  
     - **Why**: Must prescribe a bias for a *concrete* domain (e.g., "protein folding," not "science"). NFL shows no universal best bias, so the theory must specify how to constrain environments for actionable guidance.  
     - **Case**: Recommending "favor smooth functions" for climate modeling is useless unless grounded in why smoothness fits *this* domain.  

  3. **Resolution of the Uniform Average Challenge** (*Genuine Desideratum*)  
     - **Why**: Must explain why averaging over *all possible* functions is misleading as a benchmark.  
     - **Case**: Uniform average implies a prior where random noise is as likely as physical laws. But in *our universe*, structured functions (e.g., gravity) dominate. The theory must justify privileging *physically plausible* distributions without circularity.  
     - **Trade-off**: Could accept uniform average as a starting point but show it refines via empirical constraints.  

  4. **Domain-Grain Invariance** (*Non-negotiable*)  
     - **Why**: Verdicts must not change under arbitrary redescription of the environment (e.g., relabeling inputs or outputs). NFL’s dependence on granularity makes bias selection arbitrary unless grain is fixed externally.  
     - **Case**: Classifying stars by temperature vs. spectral type shouldn’t flip "prefer linear models" to "prefer polynomials." Grain must be set by *causal structure of the domain*, not convenience.  

  5. **Transport Criterion** (*Genuine Desideratum*)  
     - **Why**: Must specify when success in domain A licenses using the same bias in domain B.  
     - **Case**: A bias successful in predicting chemical reactions should transfer to similar molecular systems but not to stock markets. Requires a *shared generative mechanism* (e.g., common causal laws).  

  6. **Feasibility Constraint** (*Genuine Desideratum*)  
     - **Why**: Recommendations must be computable with accessible resources. Uncomputable solutions (e.g., Solomonoff induction) cannot guide real researchers.  
     - **Case**: Advising a neuroscience lab to use a prior requiring infinite computing time fails the purpose.  
     - **Trade-off**: May relax for foundational justification but not for applied guidance.  

  7. **Non-Circular Justification** (*Genuine Desideratum, but costly*)  
     - **Why**: Justifying a bias cannot *presuppose* the reliability of the same inference it recommends (e.g., "induction works because it worked before").  
     - **Case**: Bootstrapping (e.g., Reichenbach’s vindication) is the best hope but risks circularity. Must show the bias *would* converge to truth *if* the domain meets specified conditions.  
     - **Cost**: Strict non-circularity may force idealized models; weak circularity (e.g., "meta-induction") may be unavoidable.  

  8. **Recoding Invariance (Revised)** (*Prejudice to strike*)  
     - **Why**: Your candidate requirement. NFL proves strict invariance is impossible: for any learner, a recoding exists where it fails. Demand instead: *grain must be fixed by physical realizability*.  
     - **Verdict**: Drop strict invariance. Replace with: "Bias justification invariant under *physically meaningful* recodings" (e.g., unit changes in temperature). Goodman’s "grue" is physically unnatural.  

  9. **Prior Hypothesis Ordering** (*Genuine Desideratum*)  
     - **Why**: Your candidate requirement. Must rank hypotheses *before* new data when past fit is equal (e.g., simplicity).  
     - **Verdict**: Keep. Hume’s problem includes *projecting* beyond data. A theory saying "wait for data" abandons this.  

  10. **Empirical Accountability** (*Added: Non-negotiable*)  
      - **Why**: Must allow empirical verification of its own success/failure. NFL shows no bias wins everywhere, but the theory must predict *where* its recommended bias should succeed.  
      - **Case**: If the theory recommends "prefer causal graphs" for epidemiology, it must specify testable outcomes (e.g., reduced prediction error vs. correlational models).  

  ---

  #### **Inconsistency Identification**  
  - **Conflict**: *Normative Adequacy* (requires universal grounding) + *Domain-Specific Actionability* (requires contingent constraints).  
  - **Resolution**: Drop universal grounding. Normative force comes from *empirical success under domain-specific physical constraints*, not a priori guarantees.  
  - **Cost**: Loses "once-and-for-all" answer to Hume. Surviving list still guides research by tethering bias to domain ontology (e.g., "prefer low-complexity functions because physical laws are compressible").  

  ---

  #### **Scorecard Against Requirements**  
  *(Key: ★ = Satisfies, △ = Partially, ✗ = Fails)*  
  - **Bayesian/Universal-Prior**:  
    △ Normative adequacy (assumes priors "rational," but why?)  
    ✗ Domain-grain (arbitrary choice of universal prior; grain sensitivity)  
    ✗ Feasibility (uncomputable)  
    ★ Prior ordering (via priors)  
    ✗ Transport (silent on domain similarity)  

  - **Simplicity/MDL**:  
    ★ Prior ordering (ranks by complexity)  
    △ Non-circularity (justifies simplicity by... simplicity?)  
    ✗ Domain-grain (complexity measure encoding-dependent; grue problem)  
    ✗ Transport (no criterion for when simplicity transfers)  

  - **Error-Statistics/Severe Testing**:  
    ★ Empirical accountability (focuses on testability)  
    ★ Feasibility (pragmatic)  
    ✗ Prior ordering (cannot rank untested hypotheses)  
    △ Transport (assumes stable error probabilities; silent on domain change)  

  - **Physicalist (e.g., causal structures)**:  
    ★ Domain-grain (grain fixed by causal ontology)  
    ★ Transport (based on shared mechanisms)  
    ★ Non-circularity (grounded in mind-independent structures)  
    △ Feasibility (depends on causal discovery tools)  
    ★ Normative adequacy ("success tracks causal truth")  

  **Most Damaging Requirement**: *Domain-Grain Invariance*. Excludes Bayesian, Simplicity, and NFL-based views due to encoding-dependence. Physicalist approaches handle it best by anchoring grain to causal structure.  

  ---

  **Epistemic Posture**  
  - **Confidence in List**: 85%. Requirements derived from NFL’s constraints + Humean skepticism + scientific practice.  
  - **Least Confident Claim**: *Non-circular justification*.  
  - **What Would Change My Mind**: Evidence that *no* bootstrapping argument works (e.g., a proof that all justifications for induction reduce to question-begging). Current stance: Weak circularity (vindication) is acceptable if tied to empirical checks.  

  **Final Output**: A theory must tie bias to *domain-specific causal structure* (fixing grain), justify it via *testable success* (empirical accountability), and allow *transport via shared mechanisms*. This survives NFL by rejecting uniform averaging as physically irrelevant and meets your purpose by guiding research without arbitrariness.
