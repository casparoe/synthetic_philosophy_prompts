  I need to structure this carefully. First, I'll define the primary purpose: providing actionable guidance for research groups on bias selection with normative justification. Then I'll categorize requirements into non-negotiable, desirable, and potentially problematic, addressing each of the user's points while adding missing ones like normative adequacy and empirical accountability.

  Important considerations emerge:
  - The uniform average is indeed a non-neutral starting point due to its encoding bias toward complex functions
  - Domain grain must be externally constrained by the physical world to avoid arbitrariness
  - Transport requires shared generative mechanisms
