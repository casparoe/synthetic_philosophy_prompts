answer: |-
  ### **Design for the 90-Minute Session**  
  **Goal:** Make students experience the problem of letterform identity (à la Hofstadter's Letter Spirit) through hands-on activities.  
  **Materials per Student:**  
  - One **gridded worksheet** (5x5 grid per letter, 8–10 grids per sheet).  
  - Markers (black plus 2–3 colors for style differentiation).  
  - Role cards for adversarial collaborators (prepared in advance).  
  - Scoring tokens (e.g., colored paper clips) for Movement 2.  

  **Timeline:**  
  - **Introduction (5 min):** Frame the problem: "What makes every ‘a’ an ‘a’? We’ll test if rules, style, or context hold the answer."  
  - **Movement 1: Rules and Adversarial Sabotage (20 min)**  
  - **Movement 2: Style Imitation and Detection (30 min)**  
  - **Movement 3: Contextual Judgement (15 min)**  
  - **Debrief (15 min)**  
  - **Buffer (5 min)**  

  ---

  ### **Movement 1: Rules and Adversarial Sabotage (20 min)**  
  **Objective:** Show that rule-based definitions fail because they are either too rigid or too vague.  
  **Grid:** 5x5 grid per figure (simple, monochrome).  
  **Rules:**  
  1. **Groups of 3:** Each group defines a rule for what makes a figure an ‘a’ (e.g., "Must have a closed loop at the top and a vertical stem"). Write it clearly. (7 min)  
  2. **Adversarial Collaborator:** One student per group (assigned secretly via role card) draws a figure that *satisfies the rule* but is *unrecognizable as an ‘a’*. Others *cannot* see the drawing yet. (5 min)  
  3. **Reveal:** Groups present their rule and adversarial figure. Class votes: "Is this an ‘a’?" (8 min)  

  **Preventing Collapse into Joke:**  
  - **Role Cards:** Assign adversaries privately to avoid peer pressure.  
  - **Constraint:** Adversaries must satisfy the *letter* of the rule (e.g., if the rule says "closed shape," they can draw a square instead of a loop).  
  - **Emphasize Seriousness:** "Your goal is to expose flaws, not to be silly. A good sabotage reveals ambiguity."  

  **Expected Flaw:** Rules will be either too narrow (excluding valid ‘a’s) or too broad (including non-‘a’s like ‘o’ or abstract shapes).  

  ---

  ### **Movement 2: Style Imitation and Detection (30 min)**  
  **Objective:** Highlight that style is a "family resemblance" (Wittgenstein) or prototype, not a rule.  
  **Grid:** 5x5 grid per letter (allow color/shading).  
  **Rules:**  
  1. **Pairs:** Each student draws **3–4 lowercase letters** (e.g., a, b, c) in a *unique, consistent style* (e.g., rounded, angular, dotted). (10 min)  
  2. **Swap:** Partners exchange partial alphabets. (1 min)  
  3. **Extend:** Each student draws the **next 3–4 letters** (e.g., d, e, f) in *their partner’s style*. (10 min)  
  4. **Detection Test:**  
     - Each student is shown **two continuations** for *their own* alphabet:  
       - Their *own* continuation (drawn in Step 3).  
       - Their *partner’s* continuation (drawn in Step 3).  
     - They must **identify their own continuation**. (4 min)  
  5. **Scoring:**  
     - **Imitation Score (for Extender):** Partner gets 1 token if the creator *fails* to identify their own continuation (successful forgery).  
     - **Detection Score (for Creator):** Creator gets 1 token if they *correctly* identify their continuation.  
     - *(Max 2 tokens/pair: one for imitation, one for detection)*  

  **Example:**  
  - Alice draws a rounded ‘a,b,c’. Bob extends it to ‘d,e,f’ in a similar style.  
  - Alice sees two versions of ‘d,e,f’ (hers and Bob’s). If she picks Bob’s, he wins imitation; if she picks hers, she wins detection.  

  **Expected Insight:** Good imitations exploit stylistic "gestalts" (e.g., curvature, proportions), not checklists.  

  ---

  ### **Movement 3: Contextual Judgement (15 min)**  
  **Objective:** Demonstrate that a letter’s identity shifts when seen alongside its "siblings."  
  **Grid:** Reuse letters from Movement 2.  
  **Rules:**  
  1. **Select Letters:** Teacher picks 2 contrasting letterforms (e.g., an ‘a’ from a rounded font and one from an angular font).  
  2. **Round 1 (Isolated):** Project each letterform *alone*. Students rate on paper: "How good an ‘a’ is this?" (1–5 scale; 1 = not an ‘a’, 5 = perfect). (3 min)  
  3. **Round 2 (In Context):** Project the *same* letterform *with its full alphabet* (e.g., the rounded ‘a’ with rounded b,c,d). Re-rate. (3 min)  
  4. **Compare:** Reveal ratings. Discuss: "Did context change your judgement?" (9 min)  

  **Example Shift:**  
  - A quirky ‘a’ rated low alone might score higher in context if it matches its font’s style (e.g., all letters have zigzags).  

  ---

  ### **Debrief (15 min): Mapping Activities to Theories**  
  **Link each movement to a theory of categorization:**  
  1. **Movement 1 (Rules):**  
     - **Vivid Lesson:** Rule-based definitions (necessary/sufficient conditions) fail because they are brittle. Adversarial examples prove this viscerally.  
     - **Theory to State:** This mirrors classical categorization (e.g., Frege)—**you saw its limits firsthand.**  

  2. **Movement 2 (Style Imitation):**  
     - **Vivid Lesson:** Style operates like a **prototype or family resemblance** (Rosch/Wittgenstein). Students *experience* extending a style without rules.  
     - **Theory to State:** Detection failures show style is holistic—**you felt how similarity trumps rules.**  

  3. **Movement 3 (Context):**  
     - **Vivid Lesson:** A letter’s identity is **relational** (defined by its role in the system). Context changes perception—**you saw your own ratings shift.**  
     - **Theory to State:** Connects to Gestalt ("whole > parts") and Hofstadter’s core idea—**you don’t need to be told; you lived it.**  

  **Conclusion:** "No single approach captures letter identity. Hofstadter’s project asks: Can a *dynamic system* reconcile these?"  

  ---

  ### **What Will Go Wrong (and Mitigation)**  
  1. **The Artists in the Room:**  
     - *Risk:* Skilled drawers create styles too complex to imitate, or dismiss non-artists.  
     - *Mitigation:* Constrain style to simple elements (e.g., "use only straight lines"). Emphasize: "This is about concepts, not art."  

  2. **Students Who Refuse to Judge:**  
     - *Risk:* Hesitation in rating letters or calling something "not an ‘a’."  
     - *Mitigation:* Normalize subjectivity: "Your perception is data. There’s no ‘right’ answer."  

  3. **Forgery Problems:**  
     - *Too Easy:* Styles are simplistic (e.g., all letters are circles).  
       - *Fix:* Suggest "medium complexity" (e.g., "mix curves and angles").  
     - *Too Hard:* Styles are inconsistent or chaotic.  
       - *Fix:* Quickly provide an example style (e.g., "like this").  

  4. **Drawing Contest Trap:**  
     - *Risk:* Students compete for "best" style, losing focus on concepts.  
     - *Mitigation:* Score based on consistency/imitation, not beauty. Start debrief early to reframe.  

  5. **Time Crunch:**  
     - *Risk:* Movement 2 runs long.  
     - *Fix:* Use a timer strictly. Skip detailed sharing; focus on 1–2 examples.  

  **Final Note:** This works because it **vividly exposes rule-based failure and contextual relativity**. Only prototype theory requires brief explanation—but the "aha" moment in Movement 2 bridges the gap. By confronting ambiguity, students *feel* why Hofstadter’s problem matters.
