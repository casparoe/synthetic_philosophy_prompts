  We are designing a 90-minute session for 18 students. We'll break it into three movements (parts) and a debrief. We need to design gridded worksheets, rules for each part, and a timeline.

  Materials: 
  - Gridded worksheets (with a grid of, say, 5x5 or 6x6 squares for each letter) for drawing.
  - Markers (a few colors per group).

  Movement 1: Rule-making and adversarial collaborator (20 minutes)
  Goal: Students try to define a rule for what makes an 'a', then an adversarial collaborator tries to break it.

  Procedure:
  - Divide students into groups of 3 (so 6 groups). Each group gets a gridded worksheet and markers.
  - Task: As a group, they must define an explicit rule (a checklist) for what makes a figure an 'a'. They write it down. (10 minutes)
  - Then, assign one student in each group the role of adversarial collaborator. That student must draw a figure that satisfies the group's rule but is clearly not an 'a'. (5 minutes)
  - Each group then presents their rule and the adversarial figure to the whole class. (5 minutes for presentations, but we might do just a few if time is short).

  To avoid it becoming a joke: Emphasize that the adversarial collaborator is not trying to be funny but to expose the limitations of the rule. The goal is serious: to show that a rule might be too broad. Also, the rule must be explicit and written down so that the adversarial collaborator must follow it exactly.

  Movement 2: Extending a partial alphabet and imitation game (30 minutes)
  Goal: In pairs, each student draws 3-4 lowercase letters (e.g., a, b, c, d) in a consistent style. Then they swap their partial set with their partner. Each must then (a) extend the partner's alphabet by drawing the next 3-4 letters (e.g., e, f, g, h) in the same style, and (b) when presented with two possible continuations (one by the original creator and one by the extender), they must identify which one is the original creator's continuation.

  Scoring: 
  - For the extender: if the original creator judges that the extension is consistent (looks like it belongs to the same font), the extender gets a point (for successful imitation).
  - For the original creator: if they correctly identify which of the two continuations is their own (and which is the extender's), they get a point (for successful detection). If the extender successfully imitates, it might be harder for the creator to detect, so the two goals are in tension.

