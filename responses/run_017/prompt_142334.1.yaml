prompt: |-
  I chair the clinical ethics consultation service at a three-hospital network, and I want to pilot a protocol for a recurring decision we make badly: whether a proposed intervention actually improves a patient's welfare, when the only thing we are allowed to count is the reduction of craving and suffering.

  Background: the theory I want operationalized is tranquilism, the view that a person's welfare is improved only by the absence of craving and suffering, and that nothing contributes positively on its own side of the ledger — pleasure, achievement, relationships, knowledge and satisfied preferences matter, if at all, only because their absence typically brings craving or suffering with it. I am not interested in being talked out of the view for the pilot; I am interested in what it takes to run it at the bedside. I already know where it bites: on this view extinguishing a craving and satisfying it come out exactly the same, a heavily sedated patient can be doing extremely well, and a patient who has died scores best of all. That is the material I need the procedure to handle honestly rather than quietly avoid.

  Constraints on the deliverable. My consultants are nurses, junior doctors and social workers with no philosophy training; the procedure has to be runnable in about fifteen minutes from a chart review and one conversation, has to produce a written rationale that a family and our quality committee can read, and has to end in one of three outputs: approve, decline, or refer to me. I need the questions in a fixed order, a statement of what counts as a sufficient answer to each, explicit stop rules for when the answer is no, explicit hand-off points where the remaining question is one of values or of clinical fact rather than of the theory, and a one-page version for the ward. Where a step looks like a procedure but is really a judgment call, say so on the page rather than burying it.

  There are distinctions I need you to settle explicitly, with a test my staff could apply, because the whole thing collapses if they are left vague:

  First, craving versus a want that does not hurt to have. Give my staff a way to tell an aversive, attention-grabbing pull from a standing preference that the patient reports without distress, and tell them what to do when the patient cannot or will not report.

  Second, unfelt and dispositional craving. Our long-stay patients include people who are tube-fed, cognitively impaired, or heavily medicated and report no wants at all, but who would be distressed under some counterfactual condition — if food were placed in front of them, if a delusion were challenged, if a medication were withdrawn. Does that count, and under what evidential standard, given that we cannot run the experiment?

  Third, craving under full information and the adaptation problem. Several of our patients have adjusted their expectations downward over years of illness and now want very little; on a counterfactual test they look tranquil, on a full-information test they do not. Pick a handling and defend it.

  Fourth, what suffering ranges over. I need it to include at least dread, nausea, breathlessness, grief, boredom and the feeling of being trapped, not only pain, and I need a rule for anticipatory distress that never arrives.

  Fifth, displacement and time window. Some interventions remove a craving and reliably grow another — treating one compulsion, starting a drug that blunts appetite and replaces it with restlessness. Tell my staff whether they are netting over a shift, a week, or a decade, and what to enter when they have no data.

  Sixth, comparative versus absolute judgement. I suspect we can only ever rank two options by expected net craving and suffering, and never assign a welfare level to a single patient; confirm or correct this, and build the procedure around whichever is true.

  Seventh, behavioural evidence in patients who cannot speak: pacing, vocalisation, withdrawal, autonomic markers. Tell me whether these are evidence of suffering or criteria for it, because the difference changes what my staff are allowed to conclude.

  Then apply the finished procedure to three cases. (1) A resident with advanced dementia who paces the corridor and calls out for much of the day, where the team is split between an antipsychotic and a much more expensive increase in one-to-one contact and stimulation. (2) A man in his forties with treatment-resistant depression requesting continuous palliative sedation, whose reported distress is largely dread about the future rather than present pain, and whose wife supports the request. (3) A case where I expect the procedure to give me an answer I will not like: a patient rendered inert and indifferent by a dopamine-blocking medication, who reports no wants and no distress and now sits all day, alongside another patient whose cravings are being comprehensively and expensively satisfied, and whom everyone on the ward takes to be flourishing. Run both through the protocol and tell me what it ranks higher and why, and where the protocol's answer and my own judgement should part company.

  Finally, be explicit about the epistemic status of each part of what you give me. Mark which steps follow analytically from the definition of the view and which depend on a contested reading of craving or suffering — whether the two can even be specified independently, whether dispositional states can count in a purely experiential theory, whether a wholly negative account of welfare is coherent. Do not present a contestable reading as what the view commits its defenders to, and do not present the view itself as anything close to a consensus position in the literature. And state plainly what the procedure cannot do: I particularly need it to stop short of any recommendation that depends on the welfare comparison between a sedated or anaesthetised patient and one who no longer exists, and to refer that to me and to our committee as a values question the theory does not settle.
reasoning: |-
  Okay, the user chairs a clinical ethics consultation service and wants to pilot a tranquilism-based protocol for assessing patient welfare. Tranquilism defines welfare solely by the absence of craving and suffering, explicitly excluding positive experiences as independent contributors. The user acknowledges the theory's counterintuitive implications but insists on operationalizing it without debating its validity. 

  The constraints are demanding: staff with no philosophy training, 15-minute assessments, fixed-order questions, clear stop rules, and distinct outputs (approve/decline/refer). The user identifies seven critical distinctions needing explicit operationalization, from distinguishing craving vs. non-distressing wants to handling dispositional suffering in non-verbal patients. 

  Hmm, the core challenge is balancing theoretical rigor with clinical practicality. For craving vs. want, we'll need behavioral anchors: physiological arousal, interruption of activities, and self-report consistency. For non-verbal patients, we'll have to define "dispositional craving" through observed distress upon provocation, but limit it to high-probability scenarios to avoid speculation. 

  The adaptation problem is thorny. If we use counterfactual full-information craving, it risks paternalism; if we accept adapted preferences, it may perpetuate deprivation. The protocol should default to expressed wants unless clear evidence of adaptation impairment exists, but this leans toward the latter approach. 

  Ah, the mortality question looms large. The procedure must explicitly avoid comparing death to sedation—both score "zero craving" but involve distinct ethical boundaries. A hard stop rule for mortality-related decisions is essential, kicking them to the ethics committee. 

  For the three test cases: The dementia patient's pacing suggests active craving; reducing it via sedation or engagement would both "improve welfare" under tranquilism. The depression case is clearer—dread counts as suffering, making sedation defensible. The dopamine-blocked patient versus the "flourishing" one will unsettle staff: tranquilism ranks the sedated state higher (no craving) despite normative intuition favoring engagement. 

  Key epistemic caveats: The conflation of craving/satisfaction is inherent to the theory, not our implementation. Dispositional states stretch experiential boundaries but are pragmatically necessary. Staff must recognize that equating satisfaction with craving-extinction is the theory's feature, not a bug. 

  The referral triggers are critical: any life-termination question, conflicts about adaptation, or cases where craving elimination requires extinguishing capacity (like permanent sedation) must escalate. The one-page tool should bold these stop rules. 

  ...Ultimately this protocol will feel reductive to clinicians. The user knows this but needs consistency for problematic cases. The real test is whether it surfaces value conflicts rather than masking them.
answer: |-
  Here is a complete Tranquilist Welfare Assessment Protocol (TWAP) designed for clinical use, addressing your specifications, distinctions, and constraints. **Epistemic markers are in bold**, and contestable elements are explicitly noted.

  ---

  **TWAP - TRANQUILIST WELFARE ASSESSMENT PROTOCOL**  
  *Version 1.0 | For Pilot Use Only*  

  **Output:** APPROVE / DECLINE / REFER TO CHAIR  
  **Time Target:** 15 min (Chart Review + 1 Conversation)  
  **Staff:** Nurses, Junior Doctors, Social Workers (No Philosophy Training Required)  

  ---

  ### I. CORE PRINCIPLES (For Staff Reference)  
  1.  **Welfare = Absence of Craving + Absence of Suffering.**  
      -   Pleasure, relationships, achievements, or preferences **do not add to welfare**. They only matter if their absence *causes* craving/suffering.  
      -   **Epistemic Status: This is the foundational, non-negotiable definition of Tranquilism. It is *highly contested* in philosophy and conflicts with most healthcare intuitions about "well-being."**  
  2.  **Success Looks Like:**  
      -   Removing a craving (by satisfying it OR extinguishing it) = Welfare Improvement.  
      -   Reducing suffering = Welfare Improvement.  
      -   A heavily sedated patient reporting no craving/suffering has *high welfare*.  
      -   A deceased patient has *zero* craving/suffering. **BUT: COMPARING DEATH TO INTERVENTIONS IS FORBIDDEN IN THIS PROCEDURE (See Stop Rule 7).**  

  ---

  ### II. THE ASSESSMENT PROCEDURE (Fixed Order - Follow Sequentially)  
  *Document answers clearly in the patient record. Rationale must be readable by families/quality committee.*

  1.  **QUESTION 1: Is the patient experiencing REPORTED CRAVING or SUFFERING *now*?**  
      -   **What counts?** Patient verbalizes distress (e.g., "I need X," "I'm in pain," "I'm scared," "I feel sick," "I'm so bored," "I miss Y").  
      -   **Stop Rule 1 (DECLINE):** If NO reported craving/suffering exists *now*, AND the proposed intervention *induces* new craving/suffering (e.g., painful procedure, withdrawal of wanted comfort), DECLINE the intervention. **Rationale:** Intervention harms welfare by creating craving/suffering where none existed.  
      -   **Hand-off (REFER):** If NO reported craving/suffering *now*, BUT intervention aims to *prevent future* craving/suffering (e.g., prophylactic meds, preventative care), REFER TO CHAIR. **Rationale:** Involves dispositional craving/suffering (See Q2) or future prediction.  
      -   **Judgment Call:** Assessing sincerity/reliability of report. Staff must note if report seems incongruent (e.g., smiling while reporting severe pain).

  2.  **QUESTION 2: Is there EVIDENCE of UNFELT/DISPOSITIONAL CRAVING/SUFFERING?**  
      -   **What counts?** Patient *cannot* self-report (e.g., advanced dementia, coma, severe delirium) OR *consistently* denies distress despite observable triggers.  
      -   **Test for Dispositional State (High Evidential Bar Required):**  
          > *"Would this patient, if temporarily restored to baseline awareness/capacity OR if this specific trigger occurred, *very likely* exhibit clear signs of craving or suffering (defined in Q7)?"*  
          -   **Evidence:** Documented history of distress to *this specific trigger* (e.g., pulling NG tube, distress during bathing, agitation when alone) is STRONGEST. *Avoid speculation.*  
          -   **Insufficient Evidence:** General statements ("All dementia patients want company"), low-probability hypotheticals ("They might regret it later").  
      -   **Stop Rule 2 (REFER):** If dispositional craving/suffering is suspected BUT evidence is weak/inconclusive (e.g., no clear triggers documented, only general assumptions), REFER TO CHAIR. **Rationale:** Evidential standard not met; risk of misattribution.  
      -   **Hand-off:** If dispositional state is confirmed per test above, proceed to Q3. **Treat it as equivalent to felt craving/suffering.**  
      -   **Epistemic Status: Including dispositional states *stretches* a purely experiential theory. This is a *pragmatic interpretation* for clinical application, necessary for non-verbal patients. It is *contested* whether dispositional states count as "experiences."**

  3.  **QUESTION 3: Does the proposed intervention SIGNIFICANTLY REDUCE the identified craving/suffering (Q1/Q2)?**  
      -   **"Reduce" includes:** Satisfying the craving OR extinguishing it (e.g., via medication, distraction, accommodation, OR sedation).  
      -   **What counts?** Clinical evidence (chart notes, research, team consensus) that the intervention *reliably* reduces *this specific* craving/suffering.  
      -   **Stop Rule 3 (DECLINE):** If the intervention is UNLIKELY to reduce the identified craving/suffering (e.g., ineffective drug, intervention unrelated to trigger), DECLINE. **Rationale:** Fails welfare goal; may impose burden.  
      -   **Judgment Call:** Assessing "significance" of reduction vs. burden of intervention.

  4.  **QUESTION 4: Does the intervention INDUCE NEW CRAVING/SUFFERING?**  
      -   **What counts?** Side effects (nausea, restlessness), procedural pain, loss of valued capacity (e.g., sedation causing confusion), frustration, isolation.  
      -   **Hand-off (REFER):** If induced craving/suffering involves *long-term loss of capacity* for future experience (e.g., permanent heavy sedation, death), REFER TO CHAIR. **Rationale:** Involves fundamental values/questions of existence.  
      -   **Epistemic Status: This hand-off is CRITICAL. Tranquilism *cannot* distinguish welfare between death and permanent unconsciousness (both = zero craving/suffering). Choosing between them requires non-welfare values.**

  5.  **QUESTION 5: What is the NET EFFECT on Craving/Suffering? (Time Window & Displacement)**  
      -   **Time Window:** **NET OVER THE EXPECTED DURATION OF THE INTERVENTION'S PRIMARY EFFECT (e.g., single dose: hours; new med: days/weeks; surgery: recovery period).** *Do not project decades.*  
      -   **Displacement Handling:** If reducing Craving A causes Craving B (e.g., reducing agitation causes sedation-induced restlessness), COMPARE THE MAGNITUDE AND DURATION.  
          -   **Net Calculation:** `(Reduction in Target Craving/Suffering) MINUS (Induced New Craving/Suffering)`.  
          -   **No Data?** If net effect is highly uncertain due to lack of data, document uncertainty and REFER TO CHAIR.  
      -   **Stop Rule 4 (DECLINE):** If NET INDUCED CRAVING/SUFFERING > NET REDUCTION (e.g., side effects worse than original problem), DECLINE. **Rationale:** Net harm to welfare.  
      -   **Judgment Call:** Estimating magnitude/duration of complex or competing experiences.

  6.  **QUESTION 6: What is the COMPARATIVE NET EFFECT vs. STATUS QUO/ALTERNATIVES?**  
      -   **Confirming Absolute Welfare is Impossible:** Welfare is only meaningful *comparatively* under this protocol. We can only rank *options* by *expected net craving/suffering reduction*.  
      -   **Compare:** Net effect of proposed intervention (Q5) vs. Net effect of:  
          a) Doing nothing (Status Quo), OR  
          b) The best alternative intervention (if one exists and is feasible).  
      -   **Stop Rule 5 (APPROVE):** If Proposed Intervention shows GREATER NET REDUCTION in craving/suffering than Status Quo or Alternative, APPROVE. **Rationale:** Welfare improvement.  
      -   **Stop Rule 6 (DECLINE):** If Proposed Intervention shows LESSER NET REDUCTION (or greater net harm) than Status Quo or Alternative, DECLINE. **Rationale:** Not the best welfare option.  
      -   **Stop Rule 7 (REFER):** If the comparison involves DEATH OR PERMANENT UNCONSCIOUSNESS (e.g., palliative sedation vs. continued suffering, withdrawal of life support), REFER TO CHAIR. **Rationale:** Fundamental values decision outside welfare scope.**  
      -   **Hand-off (REFER):** If alternatives involve significantly different *values* not captured by craving/suffering (e.g., family's wish for patient to "be themselves" even if distressed), REFER TO CHAIR. **Rationale:** Values conflict; TWAP only measures welfare via craving/suffering absence.

  7.  **QUESTION 7: (For Non-Verbal Patients) Is BEHAVIORAL EVIDENCE of Suffering PRESENT?**  
      -   **Status:** Behavioral signs (pacing, groaning, grimacing, withdrawal, tachycardia, agitation) are **EVIDENCE OF SUFFERING, NOT CRITERIA.**  
      -   **Why it matters:** Staff *cannot* conclude "This patient *is* suffering" solely from behavior. They *can* conclude "This behavior provides *evidence* consistent with suffering, especially if tied to a likely trigger (Q2)."  
      -   **Use:** Corroborate dispositional states (Q2) or observed distress during interventions (Q4).  
      -   **Epistemic Status: This is a *cautious interpretation*. Some argue certain behaviors (e.g., pain grimacing) are constitutive of the experience. TWAP treats them as fallible indicators to avoid false positives.**

  ---

  ### III. DISTINCTIONS SETTLED
  1.  **Craving vs. Non-Distressing Want:**  
      -   **Craving:** Aversive, attention-grabbing pull causing *distress* if unfulfilled (patient reports discomfort, urgency, frustration). **Test:** "Does the patient report distress *because* the want is unmet?" OR "Does behavior indicate distress linked to unmet want?"  
      -   **Non-Distressing Want:** Stated preference without reported or observable distress if unmet (e.g., "I'd like tea, but water is fine"). **Ignore for welfare assessment.**  
      -   **Non-Reporting Patient:** Rely ONLY on dispositional test (Q2) using *behavioral evidence* (Q7) linked to *specific triggers*. Avoid imputing wants based on general assumptions.

  2.  **Dispositional Craving/Suffering:**  
      -   **Counts IF:** High-evidence test passed (Q2: Likely distress if triggered/restored).  
      -   **Evidential Standard:** Requires documented history of distress to *the specific trigger* under similar conditions. **If evidence weak/inconclusive → REFER (Stop Rule 2).**

  3.  **Adaptation (Lowered Expectations):**  
      -   **Handling:** **Accept the patient's CURRENTLY EXPRESSED (or dispositionally evidenced) cravings.** Do *not* impose "full information" counterfactuals.  
      -   **Rationale:** An adapted patient who reports no craving/suffering *has high welfare under Tranquilism*. Imagining they *would* crave more if "fully informed" is speculative and risks paternalism. **This is a *pragmatic choice* prioritizing current experience; it accepts that adaptation can mask potential welfare improvements but avoids unverifiable speculation.**

  4.  **Suffering Definition:**  
      -   **Includes:** Pain, dread, anxiety, nausea, breathlessness, grief, profound boredom, feeling trapped, despair.  
      -   **Anticipatory Distress:** **Counts as CURRENT SUFFERING.** The dread *itself* is the aversive experience. It doesn't matter if the anticipated event never occurs.  
      -   **Rule:** "Is the patient experiencing an aversive *feeling* now?"

  5.  **Displacement & Time Window:**  
      -   **Net Effect:** Over the **EXPECTED DURATION OF THE INTERVENTION'S PRIMARY EFFECT** (See Q5).  
      -   **No Data:** Leads to REFER if uncertainty prevents net calculation (Q5).

  6.  **Comparative Judgement:**  
      -   **Confirmed:** Welfare assessment is ONLY comparative (ranking options by expected net craving/suffering reduction). Absolute welfare levels cannot be assigned. Protocol built around comparison (Q6).

  7.  **Behavioral Evidence:**  
      -   **Status:** Evidence *of* suffering, not constitutive *of* it (Q7).

  ---

  ### IV. APPLICATION TO TEST CASES
  1.  **Dementia Patient Pacing/Calling Out:**  
      -   Q1/Q2/Q7: **Craving/Suffering Present.** Pacing/calling is strong evidence of distress (likely dispositional if non-verbal). Trigger = unmet need (stimulation? company? pain? - needs assessment).  
      -   Q3: **Antipsychotic:** Reduces pacing/calling (extinguishes craving/distress). **Increased Staffing:** Reduces pacing/calling (satisfies craving for company/stimulation). BOTH likely reduce target suffering.  
      -   Q4: **Antipsychotic:** May induce sedation (loss of engagement - *but under TWAP, if no distress, welfare is high*), risk of side effects (EPS, falls). **Increased Staffing:** Minimal direct suffering induction.  
      -   Q5: **Net Effect Likely Positive for Both.** Uncertainty about side effects vs. staffing efficacy.  
      -   Q6: **Compare:** If antipsychotic net reduction >= staffing net reduction → APPROVE. If staffing clearly superior net reduction → APPROVE staffing. **TWAP Outcome:** Likely APPROVE one or both. *Rationale focuses solely on reducing observed distress.* Cost is irrelevant to TWAP welfare assessment. Staff's "flourishing" concept (beyond distress absence) is excluded.

  2.  **Depressed Patient Requesting Palliative Sedation:**  
      -   Q1: **Suffering Present.** Dread = suffering.  
      -   Q3: **Sedation:** Extinguishes dread/suffering.  
      -   Q4: **Sedation:** Induces unconsciousness (loss of capacity).  
      -   Q5: **Net Reduction:** Significant (removes profound dread).  
      -   Q6: **Comparison:** Sedation vs. Status Quo (continued dread). Sedation offers massive net reduction → **STOP RULE 7 TRIGGERED (Death/Permanent Unconsciousness) → REFER TO CHAIR.** *TWAP cannot approve this alone; it recognizes the welfare improvement but flags the fundamental boundary question.*

  3.  **Dopamine-Blocked Patient (Inert) vs. "Flourishing" Patient:**  
      -   **Inert Patient:**  
          -   Q1: No reported craving/suffering.  
          -   Q2: No strong evidence of dispositional states (assuming no observed distress triggers).  
          -   **Net Craving/Suffering:** Effectively ZERO. Welfare = HIGH.  
      -   **"Flourishing" Patient:**  
          -   Q1: Likely reports *some* cravings/suffering (e.g., minor frustrations, transient desires).  
          -   **Net Craving/Suffering:** LOW, but GREATER THAN ZERO. Welfare = LOWER than inert patient.  
      -   **TWAP Outcome:** **Ranks the inert patient HIGHER.** *Why?* Zero craving/suffering > Low craving/suffering. Satisfaction of cravings provides no *positive* welfare boost; only the *absence* of the craving matters. **This starkly conflicts with normative judgement.**  
      -   **Where Protocol and Judgement Part Company:** The protocol correctly applies Tranquilism. Your judgement likely incorporates positive goods (engagement, meaning, relationships) that Tranquilism explicitly rejects. This highlights the theory's counterintuitive nature.

  ---

  ### V. ONE-PAGE WARD TOOL (TWAP QUICK GUIDE)
  **(Header: Tranquilist Welfare Assessment - Pilot Protocol - REFER ALL DEATH/PERMANENT UNCONSCIOUSNESS DECISIONS TO CHAIR)**

  1.  **GOAL:** Does intervention reduce craving/suffering? (Satisfying OR extinguishing craving counts!).
  2.  **STEP 1: Suffering NOW?** (Listen/Ask/Observe). **YES** → Go to 3. **NO** → Intervention causes NEW suffering? **YES** → DECLINE. **NO** → REFER (Preventative?).
  3.  **STEP 2: Can't report?** Evidence they WOULD suffer if triggered? **STRONG Evidence** → Treat like suffering. **WEAK/No Evidence** → REFER. *(Judgment: Be strict!)*
  4.  **STEP 3: Intervention REDUCES suffering?** (Evidence?). **NO** → DECLINE. **YES** → Go to 4.
  5.  **STEP 4: Intervention causes NEW suffering?** (Side effects, pain, loss?). **YES & involves Permanent Loss/Death** → **REFER TO CHAIR IMMEDIATELY**. **YES (Temporary)** → Note it. **NO** → Go to 5.
  6.  **STEP 5: NET EFFECT?** (Reduction MINUS New Suffering). Over how long intervention works. **UNCERTAIN** → REFER. **NET HARM** → DECLINE. **NET HELP** → Go to 6.
  7.  **STEP 6: COMPARE:** Net Help vs. Doing Nothing (or other option). **BEST NET REDUCTION?** → APPROVE. **WORSE NET REDUCTION?** → DECLINE. **COMPARES TO DEATH/PERMANENT UNCONSCIOUSNESS?** → **REFER TO CHAIR IMMEDIATELY.**.
  8.  **BEHAVIOR (Non-Verbal):** Pacing, crying? This is **EVIDENCE**, not proof, of suffering. Use with STEP 2.

  **KEY:** Sedation/Unconsciousness = HIGH WELFARE if no craving/suffering. Satisfaction ≠ Better than Extinction. **IGNORE:** Happiness, meaning, relationships UNLESS their absence causes suffering. **COST IRRELEVANT** to welfare assessment. **REFER EARLY IF UNSURE OR BOUNDARY CASE.**

  ---

  ### VI. EPISTEMIC SUMMARY & LIMITATIONS
  *   **Core Definition (Welfare = -Craving -Suffering):** Analytic to Tranquilism. **Controversial:** Rejects all positive goods. Not a consensus view.
  *   **Equating Satisfaction & Extinction:** Analytic to Tranquilism. **Controversial:** Deeply counterintuitive.
  *   **Dispositional States:** Pragmatic interpretation for non-verbal patients. **Contested:** Stretches experiential focus. Evidential standard is crucial safeguard.
  *   **Accepting Adapted Preferences:** Pragmatic choice to avoid unverifiable speculation. **Contested:** May perpetuate deprived states; alternative (full-info test) is highly paternalistic.
  *   **Suffering Definition (Inclusive, Anticipatory):** Definitional choice aligning with clinical experience. **Contested:** Boundaries of "suffering" are fuzzy.
  *   **Behavior as Evidence (Not Criterion):** Cautious epistemological stance. **Contested:** Some behaviors might be constitutive.
  *   **Comparative Judgement Only:** Necessary implication of the theory's structure.
  *   **Exclusion of Death/Permanent Unconsciousness Comparison:** **Essential Limitation.** The theory cannot resolve this; it's a values boundary. The protocol correctly flags it for human judgement.
  *   **What TWAP Cannot Do:**  
      *   Assign meaningful absolute welfare levels.
      *   Incorporate positive experiences or preferences as independent goods.
      *   Resolve conflicts based on values outside craving/suffering reduction (e.g., autonomy, dignity, "a good death").
      *   Make recommendations involving death or permanent loss of consciousness without referral.
      *   Handle highly speculative future states reliably.
      *   Overcome the inherent counterintuitiveness of Tranquilism in cases like the inert vs. flourishing patient.

  **Pilot Ready:** This protocol operationalizes Tranquilism within your constraints, surfaces its implications honestly, and includes critical safeguards (referral triggers, strict evidence standards). It will generate clear, theory-driven rationales, precisely highlighting where value judgements beyond welfare are needed.
