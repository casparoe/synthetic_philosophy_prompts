  ### **What the Procedure Can’t Do**  
  1. **Misfires on "Legitimate Reform":**  
     - Actions with democratic aims (e.g., anti-corruption courts) may be coded "backsliding" if they centralize power (Step 4). The procedure can’t divine intent—it relies on institutional impact.  

  2. **Wrong for Nuanced Norm Violations:**  
     - Subtle erosion (e.g., "constitutional hardball" within legal bounds) may slip to "ordinary conflict" if no entrenchment (Step 4) or pattern (Step 7) is evident.  

  3. **Judgment Calls with Extra Steps:**  
     - **Step 4 (entrenchment):** Requires inferring intent from behavior (e.g., "rushed process").  
     - **Step 6 (accountability):** Relies on your assessment of future impact.  
     - **Step 8 (bias audit):** Still subjective, but forces transparency.  

  4. **Fails on Systemic Issues:**  
     - Events requiring broad contextual knowledge (e.g., Turkey’s historical judiciary-politics nexus) may default to "not enough information" without explicit article evidence.  

  5. **Ignores International Standards:**  
     - Doesn’t reference benchmarks (e.g., V-Dem, Freedom House), risking false negatives in hybrid regimes.  

  **Recommendation:** Use this procedure to standardize coding, but advocate for weekly calibration sessions with your professor to review audit logs. It won’t eliminate disagreement, but it will make coding consistent and defensible—and force the seminar’s "very online" critics to engage with criteria, not just ideology.
