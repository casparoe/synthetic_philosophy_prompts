answer: |-
  Below is a step-by-step decision procedure designed for your coding task, optimized for speed (under 10 minutes per item), defensibility, and mitigation of personal bias. It explicitly addresses your five tripping points and includes clear off-ramps for "do not code" or escalation to the lead RA. The procedure is mechanistic where possible, forcing you to rely on the article's stated facts rather than interpretation. 

  ### **Decision Procedure: Democratic Erosion Coding**
  **Key Rules:**  
  - **Use only the article in front of you.** Do not consult external sources.  
  - **Answer questions sequentially.** Stop when you hit a terminal code or escalation.  
  - **Document every answer** in your notepad (e.g., "Step 3: Yes—court packing precedent in Poland").  
  - **Bias audit is mandatory** before coding "backsliding" (Step 8).  

  #### **Step 1: Is there a concrete, discrete action?**  
    - **Check:** Does the article describe a specific act (e.g., "passed a law," "fired judges," "took over media")?  
    - **No** → Code "not enough information."  
    - **Yes** → Proceed.  
    *Why?* Filters out vague rhetoric (e.g., "democracy weakening").  

  #### **Step 2: Is the action within the government's legal authority?**  
    - **Check:** Does the article state or imply the action is legal under existing rules?  
      - *Ignore partisan claims.* Focus on explicit legal basis (e.g., "using Article X," "court upheld").  
    - **No** (clearly illegal) → Proceed to Step 4.  
    - **Yes** or **Unclear** → Proceed to Step 3.  
    *Why?* Handles "they won an election" defense. Legal ≠ democratic.  

  #### **Step 3: Does the action alter rules/practices of democratic competition?**  
    - **Check:** Does the action directly impact:  
      - **Electoral integrity** (e.g., voting rules, districting, certification)?  
      - **Checks and balances** (e.g., judiciary independence, legislative oversight)?  
      - **Public sphere** (e.g., media freedom, protest rights)?  
      - **Equal access** (e.g., opposition rights, non-discrimination)?  
    - **No** (e.g., policy like taxes, healthcare) → Code "ordinary political conflict."  
    - **Yes** → Proceed to Step 4.  
    *Why?* Separates "rules of the game" from policy fights.  

  #### **Step 4: Is there evidence of entrenchment or evasion?**  
    - **Check:** Does the article indicate the action:  
      - **Concentrates power** (e.g., weakens oversight, avoids scrutiny)?  
      - **Circumvents norms** (e.g., rushed process, bypasses debate)?  
      - **Targets opponents** (e.g., "party X leaders investigated")?  
      - **Irreversible without supermajority/extraordinary effort?**  
    - **No** → Proceed to Step 5.  
    - **Yes** → Proceed to Step 6.  
    *Why?* Flags "packaging" (minor-seeming actions that lock in advantage).  

  #### **Step 5: De facto change test**  
    - **Check:** For non-rule changes (e.g., ignoring court orders, selective enforcement):  
      - Is this a **departure from consistent past practice**?  
      - Does the article cite **evidence** (e.g., "previously complied," "first time in 20 years")?  
    - **No evidence** → Code "not enough information."  
    - **Evidence of departure** → Proceed to Step 6.  
    *Why?* Captures erosion via non-compliance. Requires proof to avoid bias.  

  #### **Step 6: Electoral mandate counterweight**  
    - **Check:** Was the action taken by an **elected body**? If yes:  
      - Does it **reduce future accountability** (e.g., makes it harder to lose power)?  
        - *Signs:* Unilateral control, undermines opposition, distorts vote outcomes.  
      - Is it **disproportionate to mandate** (e.g., supermajority used to sideline minorities)?  
    - **Reduces accountability** → Proceed to Step 7.  
    - **Does not reduce accountability** → Code "ordinary political conflict."  
    *Why?* Mandate isn't a blank check; self-entrenchment tips the scale.  

  #### **Step 7: Pattern integration**  
    - **Check:** Does the article **explicitly link** this action to prior events (e.g., "following last year’s court reform," "part of a series")?  
      - *Ignore* unsupported assertions (e.g., "critics say this is authoritarian").  
    - **Explicit link** → Proceed to Step 8.  
    - **No link** → Treat action in isolation:  
      - If Step 4/6 flagged risk, proceed to Step 8.  
      - Else → Code "ordinary political conflict."  
    *Why?* Mitigates "one slice of a pattern" without external context.  

  #### **Step 8: Bias audit (MANDATORY for "backsliding")**  
    - **Check A:** Imagine the **ideological opposite** party did this. Would you still code it?  
    - **Check B:** What coalition is needed to **reverse** this? (e.g., simple majority vs. supermajority).  
    - **Document both answers** verbatim.  
    - If **Check A = "no"** or **Check B = "harder than passing it"** → Proceed to code "backsliding."  
    - Else → Escalate to lead RA with documentation.  
    *Why?* Forces confrontation with bias; escalation where values dominate.  

  #### **Terminal Codes:**  
  - **Backsliding** → Only if you pass Steps 1–7 and Step 8 audits.  
  - **Ordinary political conflict** → At any terminal step.  
  - **Not enough information** → At Steps 1 or 5.  
  - **Escalate to lead RA** → Ambiguity in Step 8 or unresolvable values conflict.  

  ---

  ### **Application to Your Cases**  
  *Using the procedure above. Key facts drawn only from your composites.*  

  #### **Case (a):** *Governing party rewrites electoral formula + regional media under ally-run foundation.*  
  - **Step 1:** Concrete actions (electoral reform, media consolidation). → Proceed.  
  - **Step 2:** Likely legal (supermajority passed). → Proceed to Step 3.  
  - **Step 3:** Alters electoral competition (formula) and public sphere (media). → Proceed.  
  - **Step 4:** **Yes**—entrenchment (public funds follow allies, opposition disadvantaged). → Proceed.  
  - **Step 5:** N/A (rule changes). → Skip.  
  - **Step 6:** **Reduces accountability**—new rules favor ruling party; media control skews future elections. → Proceed.  
  - **Step 7:** Explicit link ("over several years" implies pattern). → Proceed.  
  - **Step 8:**  
    - *Check A:* If opposite party did this, still backsliding (entrenchment is non-partisan).  
    - *Check B:* Reversal requires winning under skewed rules—**harder than passing it**.  
    - **Code: Backsliding.**  

  #### **Case (b):** *Government lowers judges' retirement age + new disciplinary body → Successor replaces broadcaster leadership.*  
  **Code each event separately:**  
  - **Event 1 (Judicial changes):**  
    - **Step 1:** Concrete (retirement age, disciplinary body). → Proceed.  
    - **Step 2:** Likely legal. → Step 3.  
    - **Step 3:** Alters checks/balances (court independence). → Proceed.  
    - **Step 4:** **Yes**—concentrates power (enables court-packing, disciplines judges). → Proceed.  
    - **Step 5:** N/A. → Skip.  
    - **Step 6:** **Reduces accountability**—weakens judiciary’s ability to check government. → Proceed.  
    - **Step 7:** No explicit link in article → Treat in isolation. Step 4/6 flag risk. → Proceed.  
    - **Step 8:**  
      - *Check A:* Opposite party packing courts = still backsliding.  
      - *Check B:* Reversal requires new law + replacing judges—**harder than passing it**.  
      - **Code: Backsliding.**  

  - **Event 2 (Broadcaster leadership replaced):**  
    - **Step 1:** Concrete (replaced by decree). → Proceed.  
    - **Step 2:** Unclear—ministerial decree may be legal but norm-breaking. → Step 3.  
    - **Step 3:** Alters public sphere (media independence). → Proceed.  
    - **Step 4:** **Yes**—circumvents norms (decree vs. independent process). → Proceed.  
    - **Step 5:** **De facto departure** (if past leadership changes used transparent process). → Proceed.  
    - **Step 6:** **Reduces accountability**—executive control of media skews scrutiny. → Proceed.  
    - **Step 7:** Explicit link ("undoing previous capture") → Proceed.  
    - **Step 8:**  
      - *Check A:* **Here’s the rub.** If your ideology supports this government, you might say "no" for Check A. But the action (executive decree to control media) is high-risk regardless.  
      - *Check B:* Reversal requires new decree—same difficulty as passing.  
      - **Code: Backsliding** (but this is the answer you won’t like).  
      - *Why no softening?* The procedure can’t legitimize "illiberal means for liberal ends." Step 8’s bias audit forces consistency: if you’d code it for the other side, it must be coded here.  

  **Verbatim bias audit note for Event 2:**  
  > *"Check A: If prior government did this, I’d code backsliding. Consistency demands same here. Check B: Reversal requires equivalent decree—no extra difficulty."*  

  #### **Case (c):** *State redistricts mid-decade + state body takes over county election board.*  
  - **Event 1 (Redistricting):**  
    - **Step 1:** Concrete (redrew districts). → Proceed.  
    - **Step 2:** Legal in many democracies. → Step 3.  
    - **Step 3:** Alters electoral integrity. → Proceed.  
    - **Step 4:** **Yes**—entrenchment (mid-decade at president’s request targets partisan gain). → Proceed.  
    - **Step 5:** N/A. → Skip.  
    - **Step 6:** **Reduces accountability**—manipulates seat allocation to lock in power. → Proceed.  
    - **Step 7:** No explicit link → Treat in isolation. Step 4/6 flag risk. → Proceed.  
    - **Step 8:**  
      - *Check A:* Gerrymandering by any party = backsliding.  
      - *Check B:* Reversal requires new redistricting—**harder than passing** (needs control of legislature).  
      - **Code: Backsliding.**  

  - **Event 2 (Takeover of election board):**  
    - **Step 1:** Concrete (state body takes over). → Proceed.  
    - **Step 2:** Unclear—may be legal but norm-breaking. → Step 3.  
    - **Step 3:** Alters electoral integrity. → Proceed.  
    - **Step 4:** **Yes**—centralizes power, targets local control. → Proceed.  
    - **Step 5:** **De facto departure** (if takeovers rare/nonpartisan). → Proceed.  
    - **Step 6:** **Reduces accountability**—state control could enable certification interference. → Proceed.  
    - **Step 7:** Explicit link (same actors as Event 1). → Proceed.  
