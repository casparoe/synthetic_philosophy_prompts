prompt: |-
  Hey — I'm a junior in a comparative politics seminar this semester and we're on the democracy unit, the one where every week the reading is about Hungary, then Poland, then Turkey, and now increasingly the US, and I got hired (kind of by accident) as a research assistant for a professor who's building an event-level dataset on democratic erosion. My job, with one other undergrad, is to read somewhere between forty and sixty news items a week and code each one as either backsliding, ordinary political conflict, or not enough information. We got a two hour training and a codebook that is basically three paragraphs long. We already disagree constantly, partly because neither of us knows much about any of these countries and partly because my roommate — same seminar, very online — keeps saying the whole concept is just a fancy way of saying "a government I don't like did something," and honestly when we went around the room in section, almost everyone coded based on whether they liked the party in power. So what I want is something I can actually run in about ten minutes an item, with only the article in front of me and a notepad, that I could also defend if someone on the other side of the aisle in my seminar read my codes.

  What I'm asking for is a decision procedure in the order I'd run it: the questions, what counts as an adequate answer to each one given that I'm an undergrad with no country expertise, the point where the procedure stops with a hard no and I log "do not code," and the point where it hands the item to the lead RA because the question is really about values or interpretation rather than facts. There are five things I keep tripping over and I want the procedure to actually handle them rather than hand-wave. First, telling apart "they changed the rules of the game" from "they passed a policy I dislike inside the existing rules," which I think is the crux of the whole concept but I have no idea how to make it mechanical. Second, the packaging problem: a lot of my items are about a single measure that plenty of healthy democracies also have (changing a judicial retirement age, redrawing districts, tightening voter ID), and each one looks fine on its own, so I need to know how to handle a small change that's really one slice of a pattern when I only ever see one item at a time. Third, cases where nothing legal changed but officials just stopped complying with something — court rulings, certification of results — since that's a change in practice and not a change in rules, and I don't know if it belongs in a dataset of events at all. Fourth, the "they won an election, so they get to do this" defense: whether an electoral mandate should count for or against coding something. And fifth, some actual guard against my own bias, a step I have to do before I log a code — maybe running the same test on an imagined government with the opposite platform, or asking what coalition would be needed to reverse the change compared to the one that passed it — and writing the answer down in an audit line so the professor can adjudicate later.

  Then please run the finished procedure on three cases, and write them up so I can see where it bites. Use these composites (I'm deliberately not naming specific laws or dates because I don't trust myself to get them right): (a) a governing party with a legislative supermajority rewrites the electoral formula and, over several years, regional news outlets end up under a foundation run by its allies, with public advertising money following them; (b) a government lowers the retirement age for supreme court judges and creates a new disciplinary body for judges, then loses the next election, and its successor replaces the leadership of the public broadcaster by ministerial decree, saying it's undoing the previous capture; (c) a state legislature redraws congressional districts mid-decade at the request of the national president's party, and a state body takes over a county election board. One of those three has to be a case where the procedure gives an answer I won't like — I'd rather see that than a clean sweep — and I want you to say plainly which one it is and why the procedure can't soften it. Finally, tell me what the procedure can't do: where it will misfire, what kinds of items it's simply the wrong instrument for, and which parts of it are really just me making a judgment call with extra steps.
reasoning: |-
  We are designing a decision procedure for coding news items into three categories: "backsliding", "ordinary political conflict", or "not enough information". The procedure must be run in about 10 minutes per item and must be defensible. We are to address five key challenges and then apply the procedure to three composite cases.

  The decision procedure will be a step-by-step flowchart of questions. We will have clear stopping points and a way to handle ambiguity. We also include a bias check.

  **Key Principles:**
  1. Focus on events that change the rules of the game (formal institutions) or the de facto practice of those rules in a way that undermines democratic checks and balances, electoral integrity, or civil liberties.
  2. We are not coding policy outcomes we dislike, but rather actions that alter the democratic system.
  3. We must consider the context of a pattern (even if we only see one item) by looking for signs that the action is part of a broader strategy to entrench power or undermine accountability.
  4. We have a step to flag items that require expert values-based judgment to the lead RA.

  **Decision Procedure Steps:**

  1. **Initial Filter: Is this about a specific event?**
     - If the news item is too vague (e.g., "democracy is in decline") or does not describe a concrete action, code as "not enough information". Stop.
     - Otherwise, proceed.

  2. **Identify the Actor and the Action:**
     - Who is the primary actor? (e.g., government, legislature, executive, judiciary, independent body, etc.)
     - What is the specific action? (e.g., passed a law, issued a decree, took over an institution, etc.)

  3. **Check for Rule Change vs. Policy Change:**
     - Question: Does the action change the formal rules (laws, constitution, regulations) that govern the democratic process, the independence of key institutions (like courts, media, elections), or the protection of civil liberties? OR, does it change the de facto practice of such rules without formal change (e.g., non-compliance with court orders, ignoring established procedures)?
     - If yes, proceed to step 4.
     - If no, then it is likely a policy within existing rules. Code as "ordinary political conflict" and stop. (But note: if the policy is being implemented in a way that violates rules, that might be de facto change.)

  4. **Assess Impact on Democratic Checks and Balances:**
     - Question: Does the action, on its face, appear to:
       - Reduce the independence of the judiciary, media, or electoral management bodies?
       - Weaken the ability of opposition to compete fairly (e.g., changing electoral rules to disadvantage opponents, restricting opposition access to media, or using state resources for partisan advantage)?
       - Undermine the integrity of elections (e.g., gerrymandering, voter suppression without a legitimate public interest justification)?
       - Concentrate power in the executive or ruling party without adequate checks?
       - Restrict civil liberties (e.g., freedom of speech, assembly) in a way that hinders political competition?
     - How to answer without expertise: Look for direct effects described in the article. If the article quotes credible sources (e.g., opposition leaders, independent watchdogs, international organizations) raising concerns about democratic erosion, take that as a signal. But also apply the next steps.
     - If the action clearly does one of these, proceed to step 5.
     - If uncertain, proceed to step 5 for further checks.

  5. **Pattern Test (Handling the "Packaging Problem"):**
     - Question: Even if the action might appear minor or common in democracies, does the article provide evidence (or context) that this action is part of a series of events that together undermine democracy? Look for:
       - A history of similar actions by the same actor.
       - Statements by the actor indicating a broader strategy.
       - The timing (e.g., close to an election) or targeting (e.g., against a specific opposition group).
       - The action being taken in a way that bypasses normal procedures (e.g., rushed without debate, using emergency powers).
     - If the article lacks such context and the action is commonly done in democracies (like routine redistricting), then code as "ordinary political conflict". But if the context suggests it's part of a pattern, then proceed to step 6.

  6. **Electoral Mandate Check:**
     - Question: Was the action taken by a democratically elected body? And if so, does the action itself undermine the possibility of future electoral accountability? (Note: Having an electoral mandate does not give a blank check to change the rules of the game to entrench power.)
     - How to handle: If the action makes it harder for the opposition to win future elections (e.g., by gerrymandering, changing electoral rules to favor incumbents, or capturing media), then the electoral mandate does not justify it. Proceed to step 7.
     - If the action was taken by a body without a clear mandate (e.g., a non-elected body) or if it violates the constitution (as determined by independent courts), then that reinforces backsliding.

  7. **De Facto Change Test (for non-rule changes):**
     - For actions that do not change formal rules but change practice (e.g., non-compliance with court orders, ignoring procedures):
       - Question: Is this a departure from established democratic practice? (Look for: Is it a one-off or a systematic refusal? Is it justified by exceptional circumstances? Is there a pattern of ignoring rules?)
       - If it is a clear departure and undermines checks and balances, then proceed to step 8.
       - If not, code as "ordinary political conflict".

  8. **Bias Check (Mandatory before coding as backsliding):**
     - Imagine the same action taken by a government with the opposite ideology (or an opposition party you support) in the same country. Would you still consider it backsliding? (This is to check if your judgment is based on the action or the actor.)
     - Also, ask: What would it take to reverse this action? If reversing it would require a supermajority or be practically impossible (due to entrenchment) even after losing an election, that suggests backsliding.
     - Write down your answers to these two questions in the audit log.

  9. **Final Coding:**
     - If steps 3-7 point to an event that changes rules or practices in a way that undermines democracy and the bias check holds, code as "backsliding".
     - If at any point the evidence is unclear or conflicting, and you cannot make a determination, code as "not enough information".
     - If the action does not meet the criteria for backsliding (or is ambiguous but not clearly erosive), code as "ordinary political conflict".

  10. **Flag for Lead RA:**
      - If the coding decision hinges on a value judgment that is not resolved by the above steps (e.g., whether a voter ID law is a legitimate security measure or suppression, or whether a change in judicial retirement is justified by efficiency vs. packing courts), then flag the item for the lead RA and note the uncertainty.

  **Now, applying the procedure to the three composite cases:**

  **Case (a):** *A governing party with a legislative supermajority rewrites the electoral formula and, over several years, regional news outlets end up under a foundation run by its allies, with public advertising money following them.*

  - Step 1: Concrete events: rewriting electoral formula and media capture.
  - Step 2: Actor: governing party (legislature and executive). Action: changing electoral rules and influencing media ownership via public funds.
  - Step 3: Both actions change rules (electoral formula) and practices (media capture via funding). Proceed.
  - Step 4: 
     - Changing electoral formula: likely to affect opposition's ability to compete (if it advantages the ruling party). 
     - Media capture: reduces media independence, which is a key check on power. 
     Proceed.
  - Step 5: The media capture is described as happening over several years, suggesting a pattern. The article links the two events (electoral change and media capture) as part of entrenchment. Proceed.
  - Step 6: The party has a supermajority, so it has a mandate. But changing electoral rules to advantage oneself and capturing media undermine future electoral accountability. Proceed.
  - Step 7: Not applicable (both are rule changes and institutional practices).
  - Step 8 (Bias Check): 
