     - Reversal: It might be easy to reverse by the next government, but it sets a precedent of executive interference. 
     Audit log: "Replacing media leadership by decree, even to reverse capture, without independent oversight, is itself a form of capture."
  - Step 9: Given the potential for abuse and the lack of due process, code as "backsliding". However, this is a close call. The procedure might lead to coding both events as backsliding, but note: the second government claims a legitimate aim. 

