  - Step 9: Code as "backsliding".

  **Event 2: State body takes over a county election board.**
  - Step 1: Concrete: taking over an election board.
  - Step 2: Actor: state body (presumably controlled by the same party). Action: taking over.
  - Step 3: This might be a change in practice or a formal rule? The article doesn't say if it's legal. We assume it's within the state's legal authority? But we must check impact.
