answer: |-
  The first snip, at fifteen, felt like a bad hangover. Clara woke fuzzy-mouthed, head bandaged, to her mom’s worried eyes. "How do you feel, sweetie?" "Tired. Weird. But... me." She went home, missed a week of Algebra II, complained about the itchy stitches, and doodled spirals in her notebook margins with her *right* hand. Her left? It just felt a little... distant. Like a glove she hadn’t quite put on yet.

  Life resumed. Chemistry tests, Marco Santos smiling at her across the lab, her best friend Jenna’s endless drama with her on-again-off-again boyfriend. Clara signed her name with her right hand, tied her shoes, scrolled through her phone. Normal. Except sometimes, reaching for her water bottle with her left, her fingers would fumble, knocking it over. "Clumsy," she'd mutter. No big deal.

  The second operation, sixteen months later, was routine now. "Any changes, Clara?" Dr. Evans asked brightly during a follow-up. Clara shrugged, picking at her chipped nail polish. "Nope. Still me." But at home, doing homework, her left hand suddenly slammed her calculus book shut. Clara stared at it. "What the hell?" she whispered. The hand lay still. She reopened the book. Later, she found a scribble in the margin of her English essay, written in shaky, unfamiliar left-handed script: *boring*. She scratched it out, annoyed.

  Seventeen, third cut. Jenna noticed first. "Clara, why did you just flip me off with your left hand? We were agreeing about Liam being a jerk!" Clara blinked. "I didn't!" But her left index finger was still defiantly extended. It slowly curled back. "Sorry," Clara said, flushing. "Muscle spasm?" Jenna raised an eyebrow but dropped it. Later, Clara's left hand refused to pick up her favorite blue sweater, shoving it back into the drawer. She wore the red one instead.

  The diary started arguing. Clara kept it sporadically, mostly vents about her annoying younger brother or cryptic notes about Marco. After the fourth operation, the entries changed. Her neat, right-handed script filled a page about how much she hated Mr. Greeley’s history lectures. The next page, in the same blue pen but jagged, left-handed letters, stated: *History is okay. Greeley talks too much.* Clara stared. She hadn't written that. Had she? She slammed the diary shut.

  By the fifth and final cut, at eighteen, the duality hummed just beneath the surface of senior year. College applications, prom dress shopping, graduation looming. Clara still said "I". Her parents still said she was "herself, maybe a little more... independent with her left side, haha!" Everyone laughed nervously.

  One afternoon, Jenna plopped onto Clara’s bed, watching her try to pack for a weekend trip. Clara’s right hand folded a shirt neatly. Her left hand snatched it and threw it towards the closet. Clara sighed. "Seriously? That one’s comfy."

  Jenna hesitated, then blurted, "Clara... are you one or two now?"

  Clara paused. Her right hand smoothed the comforter. Her left hand clenched into a fist on her knee. She looked Jenna straight in the eye, a small, familiar smile on her face. "I'm me, Jen. Who else would I be?" Her voice was calm, unified.

  But her left fist stayed tight, knuckles white.

  Later, alone, the diary lay open. On the left page, right hand: *Jenna asked THE question. Stupid. Obviously one. She doesn’t get it.* On the right page, left hand, scrawled angrily: *SHE knows. Ask HER again. Make HER say it. Tired of hiding.*

  Clara walked into her room. Her right hand reached for the lamp. Her left hand shot out, grabbing her wrist. A silent tug-of-war ensued over the light switch, trembling arms locked in a battle only Clara felt. Finally, the right hand jerked free and snapped the light on. The left hand slammed down on the desk, rattling the pens.

  The biggest fight was about the room. Clara (right hand) started painting one wall a deep, calming blue. Halfway through, she left for school. When she returned, the other half was covered in violent, neon pink slashes. Her left hand gripped the pink paint roller like a weapon. "No!" Clara yelled, voice cracking. "That's hideous!" Her right hand grabbed for the roller. The left hand yanked it away, splattering pink dots on the blue.

  They stood there, breathing hard, one body housing a furious stalemate. The blue side, neat and ordered. The pink side, chaotic and bright. Both sides were Clara's room. Both sides were *her*.

  She signed her college acceptance letter with her right hand. Her left hand traced the signature afterwards, a phantom echo, or perhaps a claim. When she spoke, it was always "I." When she wrote, sometimes the diary disagreed. When asked who she was, she gave her name. But in the quiet moments, in the mismatched room, the only certainty was the war within the silence, and the question hanging, heavy and unanswered, in the space between her hands.
