prompt: |-
  i'm a highschooler and we did split brain patients in psych class last week and i cant get it out of my head. Can you write me a short story about a girl whose connection between her two hemispheres gets cut in five operations spread over a few years instead of all at once, so after each one a little bit more is gone? The part I want the story to actually work through: every single time she says nothing feels different, she keeps saying "I" about herself, and everyone who knows her says she's still her — but by the last operation it shouldn't be clear whether there's now two of her, or still one, or whether there were two the whole time and nobody had any way to notice. Don't have a doctor or a teacher explain it at the end. Show it in what happens — her left hand doing things she'd never choose, her diary arguing with itself, somebody asking her "are you one or two" and her giving an answer that's true and useless at the same time, and if there are two of her, which one gets her name and her room. Also she should just be a normal teenager the rest of the time, homework and friends and dumb drama, not a medical case study. Nobody in the story should say the word consciousness out loud. Under 1000 words pls.
