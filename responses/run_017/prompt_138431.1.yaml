  **Question as it will appear on the paper:**

  **Question 1 (25 marks)**

  In 1891, the railway commission of the Republic of Valdania chose a rail gauge of 1.42 metres for its new national railway system. All four neighbouring countries had already standardised on 1.60 metres. The commission split five to four, and the decisive vote was cast by Commissioner Oreste Baldi, whose family’s rolling-stock factory was already tooled for 1.42 metres. The commission’s own engineering report had recommended 1.60 metres, arguing that the wider gauge allowed for larger wagons and greater stability, yielding an estimated 5% cost saving per tonne-kilometre. However, a minority of economic historians note that Valdanian bridges and tunnels in 1891 could not have accommodated the wider loading gauge, so that 1.42 metres was the locally optimal choice at the time.

  The Valdanian network grew to 19,000 kilometres. Today, the annual cost of the gauge mismatch with neighbours is estimated at 0.2% of GDP for transshipment at border crossings and an additional 0.3% of GDP in forgone engineering efficiency. A proposal to convert the entire network to 1.60 metres would require a one-off capital investment of 5% of GDP and an eight-year transition during which roughly one-third of freight capacity would be unavailable, costing an estimated 0.6% of GDP per year. After the transition, the annual mismatch costs would be eliminated.

  Two comparators: Sorrentia, on another continent, began with a 1.40 metre gauge in 1872 and converted to 1.60 metres in 1919 when a war had destroyed a third of its track, allowing centrally financed reconstruction. The island of Kalo built its first railway in 1952 at 1.60 metres.

  (a) Apply each of the three counterfactuals introduced in this seminar — swap, resampling, and pressure counterfactuals — to the Valdanian case at two grains of description: first, at the grain of the precise gauge width (1.42 metres), and second, at the grain of “a gauge that differs from the regional standard”. (15 marks)

  (b) Evaluate whether the statement “history is locked in” is a useful summary of what this case shows. What would it take to establish that the same outcome would have arrived in Valdania regardless of the 1891 decision? (10 marks)

  No recall of literature or citations is expected; focus on applying the concepts to the case.

  ---

  **Model Answer (approximately 900 words)**

  **Part (a): Applying the Counterfactuals**

  **Swap Counterfactual:** The swap counterfactual replaces one event with its most likely alternative, holding the rest fixed. At the grain of the precise gauge (1.42m), we swap Baldi’s vote. The most likely alternative is that Baldi votes for 1.60m, given the engineering report and the fact that his firm could have retooled (though at a cost). In that case, the vote becomes 4-5 against 1.42m, so 1.60m is adopted. Thus, at this grain, the outcome (1.42m) is contingent on Baldi’s vote. However, at the coarser grain of “a gauge that differs from the regional standard”, swapping Baldi’s vote might not change the outcome: even if Valdania had chosen 1.60m, it would have matched the regional standard. But note: if we swap only Baldi’s vote and the rest is fixed, then we get 1.60m, which is the regional standard. So at the coarse grain, the outcome (having a gauge that differs) would not have occurred. Therefore, the swap counterfactual shows sensitivity at both grains: without Baldi’s vote, the gauge would have been 1.60m (precise) and matching (coarse).

  **Resampling Counterfactual:** This counterfactual redraws the “accidents” (chance events) from their distribution and asks how often the outcome recurs. At the grain of the precise gauge, the key accident is Baldi’s vote. If we assume that Baldi’s vote was a coin toss (50-50), then in half the resamplings, Valdania chooses 1.42m and in half 1.60m. But the minority view complicates this: if the bridges and tunnels in 1891 made 1.60m infeasible, then the engineering report might have been in error, and Baldi’s vote might have been irrelevant because 1.42m was the only feasible option. Without this constraint, the resampling probability for 1.42m is 50%. At the coarse grain of “a gauge that differs”, we must consider the distribution of accidents that lead to a non-standard gauge. These accidents include not only Baldi’s vote but also the timing of Valdania’s decision relative to neighbours and the state of Baldi’s factory. If we resample these accidents, how often does Valdania end up with a non-standard gauge? If the neighbours had already standardised, and if Valdania’s decision was late, then without Baldi’s accident, it might have chosen the standard. But if Valdania had decided earlier, it might have chosen a parochial gauge anyway. The Sorrentian case shows that a non-standard gauge was common early on. Thus, the resampling probability at the coarse grain might be high — say, 70% — because many late adopters still chose parochial gauges (like Sorrentia initially). But given that Valdania’s neighbours had standardised, the pressure to conform was present, so without Baldi’s accident, the chance of a non-standard gauge might be low. The resampling counterfactual reveals that the outcome at the precise grain is highly sensitive (50% chance), while at the coarse grain, it might be less sensitive if the structural conditions made a non-standard gauge likely.

  **Pressure Counterfactual:** This holds functional and economic pressures fixed while varying accidents. The pressures include: the engineering advantage of wider gauges (5% per tonne-km), the network benefits of matching neighbours, and the local constraints (bridges and tunnels). At the precise grain (1.42m), if we vary accidents (like Baldi’s vote), the outcome changes: with no accidents, the pressures would lead to 1.60m (if feasible) because of the engineering and network benefits. But if the bridges constraint was binding, then the pressure for a narrower gauge would prevail, making 1.42m invariant. Without the constraint, the pressure counterfactual suggests that 1.60m would have been chosen regardless of accidents. At the coarse grain of “a gauge that differs”, the pressure to match neighbours is strong. However, if Valdania had decided before its neighbours (like Sorrentia), it might have chosen a parochial gauge. But given that Valdania decided after neighbours had standardised, the pressure to conform should have led to 1.60m. Thus, only if the bridge constraint forced a non-standard gauge would the outcome be invariant at the coarse grain. Otherwise, the pressure counterfactual suggests that a matching gauge would have been chosen.

  The three counterfactuals come apart: the swap shows contingency on Baldi’s vote at both grains; resampling shows high sensitivity at the precise grain but possibly less at the coarse grain; and pressure shows that without the bridge constraint, the outcome should not have been a non-standard gauge, making the precise gauge contingent and the coarse outcome avoidable.

  **Part (b): Lock-in and the Same Outcome**

  The phrase “history is locked in” conflates three ideas: sensitivity to initial accidents, resistance to change (lock-in), and inefficiency. The Valdanian case shows sensitivity: a small event (Baldi’s vote) had a large effect. But is the outcome locked in? Lock-in means that the outcome persists despite perturbations. The Sorrentian case shows that a major shock (war destroying a third of the network) unlocked the outcome. The cost of conversion in Valdania is high: 5% of GDP plus transition costs. The net present value of switching is finely balanced: at a 4% discount rate, it is slightly positive (about 0.1% of GDP), but at 5%, negative. Thus, the outcome is locked in only for some discount rates. Moreover, lock-in is a matter of degree: small shocks (like routine maintenance) do not cause change, but a shock the size of Sorrentia’s might. Lock-in is not permanence but resilience to shocks below a threshold.

  To establish that the same outcome would have occurred regardless of the 1891 decision, we must fix a grain of description and show invariance under the counterfactuals. At the precise grain (1.42m), it is highly unlikely without Baldi’s vote. At the coarse grain (a non-standard gauge), we would need to show that even without Baldi, Valdania would have chosen a non-standard gauge. This would require evidence that the bridge constraint was binding (making 1.60m infeasible) or that other accidents (e.g., an early parochial choice) were likely. Without the bridge constraint, the pressure to conform was strong, so the same coarse outcome (non-standard gauge) would not have occurred. Thus, the same outcome (at either grain) is not inevitable.

  The normative claim of inefficiency is separable. The annual cost (0.5% of GDP) might be remediable, but the conversion cost is high. The minority view suggests that ex ante, 1.42m was efficient. Even ex post, the NPV of switching is marginal. Moreover, part of the loss is a transfer: Baldi’s gain in 1891 was a loss to the public, but the ongoing costs are deadweight. The case illustrates that inefficiency claims require careful cost-benefit analysis and are distinct from lock-in.

  **Closing Paragraph: Vulnerability in the Reasoning**

  The step most vulnerable to challenge is the assessment of the 1891 feasibility constraint. The model answer assumes that without the bridge constraint, the pressure counterfactual would have led to 1.60m. But if new evidence showed that the bridges and tunnels in 1891 could indeed have accommodated 1.60m (contrary to the minority view), then the initial choice of 1.42m becomes clearly inefficient ex ante, driven by Baldi’s self-interest. Conversely, if the constraint was binding, then 1.42m was efficient ex ante, and the subsequent inefficiency arises from technological change (steel bridges). This would convert the case from remediable inefficiency to one of technological obsolescence. Additionally, if a compensating transfer from shippers to the state could have financed conversion without the deadweight loss of transition (e.g., a gradual phased conversion), then the lock-in might be seen as political, not technical. Verdict: the case shows path dependence in the form of sensitivity and lock-in, but inefficiency is contingent on feasibility and discount rates.

  ---

  **Marking Scheme (25 marks total)**

  **Part (a) (15 marks)**

  1. **Swap counterfactual at precise grain (1.42m):** (3 marks)
     - Must state that swapping Baldi's vote leads to 1.60m (outcome changes).
     - Typical error: Failing to specify the alternative vote or mispredicting the vote count.

  2. **Swap counterfactual at coarse grain (non-standard gauge):** (2 marks)
     - Must note that swapping Baldi's vote leads to a standard gauge (so outcome changes from non-standard to standard).
     - Typical error: Claiming that at coarse grain the outcome is the same (because "non-standard" might be defined differently).

  3. **Resampling counterfactual at precise grain:** (3 marks)
     - Must assign a probability (or range) based on the distribution of Baldi's vote (e.g., 50% if vote is coin toss) and discuss the bridge constraint (if binding, probability near 100%).
     - Typical error: Ignoring the minority view or not quantifying.

  4. **Resampling counterfactual at coarse grain:** (2 marks)
     - Must discuss the probability of a non-standard gauge given the timing relative to neighbours and other accidents (e.g., high if early, low if late; Sorrentia as evidence).
     - Typical error: Not considering the timing or network effects.

  5. **Pressure counterfactual at precise grain:** (3 marks)
     - Must state that without the bridge constraint, pressures lead to 1.60m (so outcome changes); with constraint, 1.42m is invariant.
     - Typical error: Overlooking the constraint or the engineering/network pressures.

  6. **Pressure counterfactual at coarse grain:** (2 marks)
     - Must state that without bridge constraint, pressures lead to standard gauge (so non-standard outcome changes); with constraint, non-standard is invariant.
     - Typical error: Conflating with swap or resampling.

  **Part (b) (10 marks)**

  7. **Separation of lock-in from sensitivity and inefficiency:** (3 marks)
     - Must note that lock-in is about resistance to change (range of perturbations), not just permanence or sensitivity.
     - Must use Sorrentia to show the size of shock required to unlock (war destruction).
     - Typical error: Conflating lock-in with permanence.

  8. **NPV balance and its implications:** (2 marks)
     - Must note that the switch is finely balanced (sensitive to discount rate) so lock-in is not absolute.
     - Typical error: Asserting that switching is clearly worthwhile or not.

  9. **Establishing same outcome regardless:** (3 marks)
     - Must state that grain must be fixed and then show invariance under counterfactuals.
     - Must argue that at precise grain, same outcome is unlikely without Baldi; at coarse grain, same outcome requires bridge constraint or other factors.
     - Typical error: Not fixing the grain or not using the counterfactuals.

  10. **Normative claim (inefficiency) separation:** (2 marks)
      - Must note that inefficiency is distinct and depends on ex ante feasibility and transfer aspects.
      - Typical error: Assuming lock-in implies inefficiency.

  **Overall Structure and Clarity:** Reserved 2 marks within part (a) and (b) for coherence and avoiding conflation.

  **Distinction between A and B answers:**

  - **A answer (21-25 marks):** Clearly separates the three counterfactuals and applies them at both grains without conflation. In part (b), explicitly disentangles sensitivity, lock-in, and inefficiency, and uses Sorrentia appropriately (as evidence of shock size, not refutation). Addresses the minority view and the transfer point. The closing paragraph (in the model answer) is integrated in part (b) and would be rewarded under point 9 and 10.

  - **B answer (16-20 marks):** Applies the counterfactuals but with some conflation or omission at one grain. In part (b), mentions lock-in and sensitivity but does not fully separate them, or does not use Sorrentia correctly. May not address the NPV balance or the feasibility constraint.

  **Closing Paragraph Requirement:** Integrated into part (b) as the last element. We reserve 2 marks (within the 10 of part b) for a paragraph that:
  - Identifies a vulnerable step (e.g., the 1891 feasibility constraint or the NPV calculation).
  - States what evidence would change the verdict (e.g., finding that bridges could have handled 1.60m in 1891, or a feasible compensating transfer).

  In the marking scheme, we can assign the 2 marks for the closing paragraph under part (b) as part of point 9 and 10, but to be explicit, we can note:

  In part (b), the last 2 marks (from the 10) are for the reflective paragraph that identifies the vulnerability and the conditions that would change the verdict.

  Alternatively, we can adjust the breakdown.

  Given the deliverables, we have provided:

  1. The question
  2. The model answer (~900 words)
  3. The marking scheme (25 marks, with must-hit points and A/B distinction)

  We have met the constraints and the case requirements.
