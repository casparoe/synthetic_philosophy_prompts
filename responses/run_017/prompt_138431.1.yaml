  ### 1. Essay Question as It Appears on the Paper  
  **Question 1 (25 marks)**  
  **Case:** In 1891, the railway commission of Valdania selected a rail gauge of 1.42 metres for its new national network. All four neighbouring countries had standardised on 1.60 metres. The commission voted 5–4 in favour of 1.42 metres, with Commissioner Oreste Baldi casting the decisive vote. Baldi’s family-owned rolling-stock factory was already tooled for 1.42-metre production. The commission’s engineering report had recommended 1.60 metres, citing 5% greater efficiency per tonne-kilometre due to larger wagons and improved stability. However, a minority of historians contend that Valdania’s 1891 bridges and tunnels could not accommodate the wider gauge, making 1.42 metres locally optimal at the time.  

  Valdania’s network expanded to 19,000 km. Current annual costs include 0.2% of GDP for transshipment at borders and 0.3% of GDP for forgone engineering efficiency. Full regauging to 1.60 metres would require a one-off capital investment of 5% of GDP and an eight-year transition period with 33% freight capacity loss, costing 0.6% of GDP annually. Post-transition, mismatch costs would cease.  

  *Comparators:*  
  - Sorrentia adopted a 1.40-metre gauge in 1872 but converted to 1.60 metres in 1919 after wartime destruction of 33% of its track enabled centrally funded rebuilding.  
  - Kalo built its first railway in 1952 at 1.60 metres.  

  **Tasks:**  
  (a) Apply the three counterfactuals below to the Valdanian case at **two grains of description**:  
  - Grain 1: Adoption of the *precise* 1.42-metre gauge.  
  - Grain 2: Adoption of *any gauge differing from the regional standard* (i.e., non-1.60 metres).  
  Explain whether the outcome (at each grain) changes under each counterfactual, citing case details. (15 marks)  
  - **Swap counterfactual**: Replace Baldi’s decisive vote with its most likely alternative (e.g., voting for 1.60 metres), holding all else fixed.  
  - **Resampling counterfactual**: Redraw "accidental" factors (e.g., Baldi’s conflict of interest, timing relative to neighbours) from their historical distribution. Estimate the probability of the outcome recurring.  
  - **Pressure counterfactual**: Hold functional/economic pressures fixed (e.g., efficiency gains, network effects, local constraints) while varying accidents freely. Assess if the outcome is invariant.  

  (b) Evaluate whether "history is locked in" is a useful summary of this case. What would it take to establish that the *same outcome* (at a specified grain) would have occurred regardless of the 1891 decision? Address sensitivity, lock-in, and inefficiency as distinct claims. (10 marks)  

  **Instructions:**  
  - No literature recall or citations needed.  
  - Focus on conceptual application to the case.  
  - Part (b) must specify the grain of description for "same outcome."  

  ---

  ### 2. Model Answer (900 words)  
  #### Part (a): Applying Counterfactuals  

  **Swap Counterfactual**  
  - *Grain 1 (1.42m)*: Swapping Baldi’s vote for 1.60m (the most likely alternative, given his conflict of interest) reverses the 5–4 outcome to 4–5, leading to 1.60m adoption. The precise outcome changes, revealing sensitivity to a small event.  
  - *Grain 2 (non-standard gauge)*: Swapping Baldi’s vote still yields 1.60m, matching neighbours. Thus, the outcome changes from "non-standard" to "standard." This shows that Valdania’s non-standard gauge depended on Baldi’s accident.  

  **Resampling Counterfactual**  
  - *Grain 1 (1.42m)*: Resampling accidents—Baldi’s vote (plausibly 50% likely to favour 1.42m), the factory’s tooling, and commission timing—suggests a 50% recurrence probability for 1.42m. However, if bridge constraints (minority view) made 1.60m infeasible, the probability nears 100%, as accidents become irrelevant. Without constraints, outcome sensitivity is high.  
  - *Grain 2 (non-standard gauge)*: Resampling Valdania’s decision timing relative to neighbours is key. If Valdania decided early (like Sorrentia in 1872), a parochial gauge was likely (e.g., 70% probability). But given neighbours standardised first, late-decider pressure should favour 1.60m. Resampling accidents (e.g., Baldi-type conflicts) might yield a non-standard gauge in only 30–40% of cases. Sorrentia’s initial divergence supports this: non-standard outcomes were common absent coordination.  

  **Pressure Counterfactual**  
  - *Grain 1 (1.42m)*: Holding pressures fixed—efficiency gains (5%), network benefits, and bridge constraints—while varying accidents (e.g., Baldi’s vote) shows invariance only *if* bridge constraints bind. If bridges allowed 1.60m, pressures favour it regardless of accidents; 1.42m is contingent. Thus, outcome stability depends on the (disputed) constraint.  
  - *Grain 2 (non-standard gauge)*: Pressures strongly favour matching neighbours for late adopters. Varying accidents freely, a non-standard gauge only persists if bridge constraints override network effects. Otherwise, pressures make a non-standard outcome contingent and unlikely.  

  *Synthesis*: The counterfactuals diverge. Swap shows sensitivity to Baldi at both grains. Resampling shows high sensitivity at Grain 1 but moderate at Grain 2 due to timing. Pressure shows that constraints determine invariance, exposing how normative claims depend on unresolved feasibility.  

  #### Part (b): Lock-in and "Same Outcome"  

  **"Locked in" as a Summary**  
  "History is locked in" conflates three claims:  
  1. *Sensitivity*: The outcome depended on Baldi’s vote (supported by swap/resampling).  
  2. *Lock-in*: The outcome persists absent large shocks (distinct from sensitivity).  
  3. *Inefficiency*: The outcome is suboptimal and remediable (normative).  

  Lock-in is partially valid: Valdania’s gauge persists because conversion costs (5% GDP + 0.6% GDP/year × 8 years) are high relative to annual losses (0.5% GDP). Net present value (NPV) of switching is marginal:  
  - Benefits: Perpetual 0.5% GDP/year savings, discounted (e.g., PV ≈ 12.5% GDP at 4% rate).  
  - Costs: 5% GDP upfront + PV of transition losses (e.g., ≈4.8% GDP at 4% rate).  
  - NPV ≈ 12.5% − 9.8% = +2.7% GDP (positive) at 4% but turns negative at 6% (PV benefits ≈8.3% GDP).  
  Thus, lock-in depends on discount rates and transition risks—it measures resistance to *smaller* shocks (e.g., routine policy), not permanence. Sorrentia confirms this: a 33% network shock (war) overcame lock-in by reducing transition costs. Calling Valdania "locked in" is useful only if qualified as shock-dependent.  

  Inefficiency is separable and normative: The 0.5% GDP annual loss appears inefficient, but three issues arise. First, the minority view suggests 1.42m was *ex ante* efficient if bridges constrained choice; inefficiency emerged later from technological change (steel bridges post-1930). Second, Baldi’s gain was a transfer (not deadweight loss) from public funds to his firm. Third, NPV’s sensitivity means inefficiency is contestable—it cannot be inferred from lock-in alone.  

  **Establishing "Same Outcome Regardless"**  
  To claim the same outcome would always occur, we must:  
  - Fix the grain (e.g., Grain 2: non-standard gauge).  
  - Show invariance under pressure/resampling counterfactuals.  
  For Grain 2, this requires evidence that pressures (bridge constraints) made a non-standard gauge inevitable. If bridges permitted 1.60m, resampling (e.g., 60% likelihood of Baldi-type accidents) or pressure counterfactuals suggest a standard gauge was likely. For Grain 1, invariance is implausible—Baldi’s vote directly altered the precise gauge.  

  **Closing Paragraph: Vulnerability and Verdict**  
  The step most vulnerable to falsification is the **pressure counterfactual’s treatment of bridge constraints**. If new evidence showed 1891 bridges *could* support 1.60m (refuting the minority view), the case shifts from path-dependent inefficiency to outright political failure: Baldi’s vote caused an avoidable, suboptimal lock-in. Conversely, if constraints were binding, inefficiency vanishes ex ante, making this technological obsolescence. Similarly, if a credible compensating transfer (e.g., shipper-funded conversion) reduced transition costs, NPV could turn positive, transforming "lock-in" from technical inevitability to political choice. Verdict: Valdania illustrates sensitivity and qualified lock-in, but inefficiency hinges on unresolved constraints—not Baldi’s vote alone.  

