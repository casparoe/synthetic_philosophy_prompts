  ### 3. Marking Scheme (25 marks)  
  #### Part (a): 15 marks total  
  1. **Swap counterfactual - Grain 1** (2 marks):  
     - *Must-hit*: Swapping Baldi’s vote changes outcome to 1.60m.  
     - *Error*: Ignores vote reversal or mispredicts outcome (e.g., "no change").  
  2. **Swap counterfactual - Grain 2** (2 marks):  
     - *Must-hit*: Outcome changes from non-standard to standard.  
     - *Error*: Claims coarse grain is unchanged; conflates with sensitivity.  
  3. **Resampling counterfactual - Grain 1** (3 marks):  
     - *Must-hit*: Probability ≈50% without bridge constraints; ≈100% with constraints.  
     - *Error*: Omits probability estimate or ignores minority view.  
  4. **Resampling counterfactual - Grain 2** (2 marks):  
     - *Must-hit*: Probability 30–70% (e.g., lower given late adoption). Uses Sorrentia as evidence.  
     - *Error*: Assumes non-standard gauge is always likely; ignores timing.  
  5. **Pressure counterfactual - Grain 1** (3 marks):  
     - *Must-hit*: Invariant only if bridge constraints bind; otherwise contingent.  
     - *Error*: Treats pressures as deterministic without constraints.  
  6. **Pressure counterfactual - Grain 2** (3 marks):  
     - *Must-hit*: Non-standard outcome invariant only if constraints override network pressures.  
     - *Error*: Conflates with swap/resampling; omits network effects.  

  #### Part (b): 10 marks total  
  7. **Sensitivity claim** (2 marks):  
     - *Must-hit*: Baldi’s vote caused divergence (from swap/resampling).  
     - *Error*: Recites "small events matter" without case application.  
  8. **Lock-in claim** (3 marks):  
     - *Must-hit*: Defines lock-in as shock-dependent (using Sorrentia’s war as threshold); notes NPV sensitivity.  
     - *Error*: Equates lock-in with permanence; ignores NPV balance.  
  9. **Inefficiency claim** (2 marks):  
     - *Must-hit*: Separates inefficiency (ex ante feasibility, transfer, NPV) from lock-in.  
     - *Error*: Assumes lock-in implies inefficiency; omits transfer or constraints.  
  10. **"Same outcome" requirement** (2 marks):  
      - *Must-hit*: Requires fixed grain and invariance under pressure/resampling.  
      - *Error*: Vague on grain; claims inevitability without counterfactuals.  
  11. **Vulnerability paragraph** (1 mark):  
      - *Must-hit*: Identifies bridge constraint/NPV as vulnerable; specifies evidence that would change verdict.  
      - *Error*: Generic reflection without case-specific falsification.  

  #### A vs. B Answer Differentiation  
  - **A (21–25 marks)**: Hits all must-hit points. *Specifically*:  
    - In (a), explicitly separates counterfactuals and grains (no conflation).  
    - In (b), uses Sorrentia to define lock-in *threshold* (not refutation), and dissects inefficiency (transfer, constraints, NPV).  
    - Vulnerability paragraph identifies *testable* evidence (e.g., bridge feasibility).  
  - **B (16–20 marks)**: Misses 1–2 key points. *Specifically*:  
    - In (a), conflates counterfactuals (e.g., resampling with pressure) or omits one grain.  
    - In (b), treats lock-in/inefficiency as interchangeable; uses Sorrentia only as "counterexample."  
    - Vulnerability paragraph is generic.  

  #### Typical Candidate Errors  
  - **Part (a)**: Reciting QWERTY myths; ignoring grain-dependence; treating counterfactuals identically.  
  - **Part (b)**: Conflating sensitivity/lock-in/inefficiency; asserting "switching is irrational" without NPV; claiming "same outcome" without specifying grain.
