  Now, let's draft each part.

  ### I. Agreed Claims (Numbered List)

  1. Verbal and non-verbal reports of subjective experience constitute genuine data for the science of consciousness.
  2. The collection of such reports must adhere to pre-registered, rigorously controlled experimental protocols to minimize ad-hoc interpretation and bias.
  3. Subjective reports are systematically unreliable in ways that can be partially cataloged, including but not limited to: confabulation, demand characteristics, limitations of retrospection, and the effects of training or expectation.
  4. Report-based methods have produced scientifically robust results in specific domains, such as blindsight and change blindness, demonstrating their utility for understanding consciousness-related phenomena.
  5. Neither heterophenomenology nor phenomenal realism provides an infallible or privileged method for accessing the facts of consciousness; both approaches are subject to correction and refinement.
  6. Each approach can articulate conditions under which its core claims would be challenged or refuted.

  ### II. Residual Disagreement

  **Neutral Wording:**  
  The dispute centers on whether first-person reports, even when gathered under disciplined protocols, should be treated as observations made with a distinctive instrument (the subject's own consciousness) that provides access to facts not reducible to third-person data, or whether they should be treated solely as behavioral texts to be interpreted without assuming any privileged access to inner states.

  **Heterophenomenologist's (A) Wording:**  
  We maintain that the science of consciousness must proceed exclusively from the third-person standpoint, treating subjects' reports as verbal behavior to be interpreted neutrally, without granting any report the status of a direct measurement of an inner fact. The heterophenomenological method is sufficient for a complete science of consciousness, and any claim that cannot be adjudicated by third-person methods (i.e., has an empty ledger) is beyond scientific purview.

  **Phenomenal Realist's (B) Wording:**  
  We maintain that disciplined first-person reports are observations made with a distinctive instrument (conscious experience itself) that provides access to phenomenal facts. While this instrument has discoverable error characteristics, it is not reducible to mere behavior, and a science that renounces it may predict and control behavior while leaving the explanandum—conscious experience—unexplained. Claims with an empty ledger may still be true and meaningful, even if not scientifically adjudicable.

  ### III. Cruxes

  We'll present a table with the three cruxes.

  | Crux Name          | Neutral Restatement                                                                                                                                 | Heterophenomenologist's (A) Wording                                                                                                                               | Phenomenal Realist's (B) Wording                                                                                                                                 | Agreed Test                                                                                                                                                                                                 | Prediction of A                                                                 | Prediction of B                                                                 | What would count as evidence against A?                                                                                     | What would count as evidence against B?                                                                                     |
  |--------------------|------------------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------|---------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------|
  | The Silent Swap    | A hypothetical intervention that transposes the neural realizers of two sensory qualities (e.g., red and green) without altering any discriminable behavior, neural correlates, or reports. Is this coherent? If so, what is the ledger for the claim that the quality changed? | Such a swap is incoherent because if there is no change in any third-person observable (including neural patterns and behavior), there is no fact of the matter about a change in quality. | Such a swap is coherent and would change the subject's experience. The ledger is empty because the change is purely subjective and undetectable by third-person means. | Conceptual analysis and modeling: Design a thought experiment where every third-person accessible state is held constant while the subjective quality is swapped. Debate its coherence and implications. | The swap is incoherent; if all third-person data are fixed, there is no room for a change. | The swap is coherent; it illustrates that subjective qualities are not reducible to third-person data. | Evidence against A: Discovery of a case where neural realizers are swapped and the subject reports a change despite identical behavior and neural patterns (but by ledger clause, such a report would be part of the ledger). | Evidence against B: A rigorous argument that the swap scenario is logically impossible or that any change must manifest in some third-person detectable difference. |
  | The Residue Protocol | After training subjects in neuroscience and confabulation psychology, and cross-examining them, they are asked if anything remains that no third-person description captures. What does their avowal signify? | The avowal is a verbal behavior, possibly influenced by training and demand characteristics. It does not indicate a genuine residue; it's more data to interpret. | The avowal is a report about the subject's experience, indicating a residue of phenomenal reality that transcends third-person description. | Conduct experiments where subjects undergo such training and cross-examination, then report on whether they perceive a residue. Measure avowal rates and their stability across theoretical sophistication. | Avowal rates will vary with training and context, showing it's a contingent response. | Avowal rates will remain high and stable across variations in theoretical sophistication, indicating a robust phenomenal residue. | Evidence against A: Stable high avowal rates across diverse populations and conditions, insensitive to training designed to debunk the residue. | Evidence against B: Avowal rates drop significantly with increased understanding, suggesting the residue is a cognitive illusion. |
  | The Indistinguishable Interlocutor | A system (biological or artificial) that passes a pre-registered battery of tests making it heterophenomenologically indistinguishable from a human. Does the question of whether it has conscious experience have an answer? | The question is unanswerable by science; indistinguishability entails that we must treat it as if it were conscious, but there is no further fact beyond the behavioral and neural similarities. | The question has an answer, and inquiry could in principle reach it (e.g., by understanding the system's causal structure and whether it supports genuine phenomenality). | Develop a test battery for heterophenomenological indistinguishability. Then, debate whether, for a system passing it, we can ever know if it is conscious, and what kind of evidence would count. | No evidence can settle the question; it is beyond scientific adjudication. | Evidence could settle it (e.g., if the system lacks a specific biological or structural feature necessary for consciousness). | Evidence against A: Discovery of a property that correlates with consciousness in humans and is absent in the system, but detectable only by non-behavioral means (e.g., via theory). | Evidence against B: A system that passes the tests but is shown to be structurally dissimilar in ways that should matter (e.g., a large language model) yet still evokes the same avowals of consciousness from observers, suggesting that indistinguishability is all there is. |

  ### IV. Closing Section

  After a year of collaborative examination, we acknowledge that part of our dispute may be verbal, stemming from different uses of the term "consciousness." The heterophenomenologist often uses "consciousness" to refer to reportable cognitive states, while the phenomenal realist uses it to denote subjective experience. However, the cruxes reveal substantive disagreements about what constitutes a complete explanation and whether science can access non-behavioral facts.

  Specifically:
  - The Silent Swap crux is largely substantive and hinges on whether subjective qualities can vary independently of all third-person data.
  - The Residue Protocol crux is substantive but testable; it probes whether disciplined introspection reveals an ineliminable phenomenal aspect.
  - The Indistinguishable Interlocutor crux involves both substantive and verbal elements: it is substantive in that it asks whether consciousness requires more than behavioral mimicry, but verbal in that the answer depends on how we define the explanandum.

  We agree that at least one crux (The Silent Swap) is currently untestable because it involves a scenario with an empty ledger. However, its coherence is debated and has implications for the nature of consciousness.

  **Bottom line:** The dispute reflects a genuine disagreement about the nature of consciousness and the methods required to study it, but part of the difficulty arises from terminological and explanatory expectations.

