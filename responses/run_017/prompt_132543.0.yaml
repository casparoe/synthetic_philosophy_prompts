answer: |-
  **Joint Statement on Method in the Science of Consciousness**  
  *After one year of adversarial collaboration, we, the undersigned heterophenomenologist (Party A) and phenomenal realist (Party B), agree to the following document. We affirm the "ledger clause" as a ground rule: for any disputed claim, both parties must specify its ledger—the set of differences it would make to anything detectable from a third-person standpoint (e.g., reports, behavior, neural activity). We agree that claims with empty ledgers cannot be adjudicated by third-person science, but we do not agree that such claims are thereby empty, false, or illegitimate. This concession and refusal are inseparable throughout.*

  ### 1. Agreed Claims  
  Both parties endorse the following:  
  1. Subjects' verbal and non-verbal reports constitute genuine data for the science of consciousness.  
  2. Reports must be collected under pre-registered, standardized protocols to minimize ad-hoc interpretation, not ad-libbed in uncontrolled settings.  
  3. Reports are systematically unreliable in ways we can partially catalog, including confabulation, demand characteristics, retrospection errors, and training effects.  
  4. Report-based methods have yielded validated results in specific domains, such as blindsight and change blindness, demonstrating their scientific utility.  
  5. Neither heterophenomenology nor phenomenal realism provides a privileged or infallible pipeline to the facts of consciousness.  
  6. Each approach can specify what evidence would challenge its core claims.  

  ### 2. Residual Disagreement  
  **Neutral Wording:**  
  The central disagreement concerns whether first-person reports, even when gathered under disciplined protocols, should be treated as observations from a distinctive instrument (conscious experience itself) that accesses facts not reducible to third-person data, or whether they should be treated solely as behavioral texts for neutral interpretation without granting privileged access to inner states.  

  **Party A (Heterophenomenologist) Acceptable Wording:**  
  We hold that the science of consciousness must proceed exclusively from the third-person standpoint. Subjects’ reports are texts to be interpreted with charity and skepticism, never as direct measurements of inner facts. A claim with an empty ledger cannot be scientifically adjudicated, and a complete science of consciousness requires no additional data beyond third-person methods.  

  **Party B (Phenomenal Realist) Acceptable Wording:**  
  We hold that disciplined first-person reports are observations from a distinctive instrument (conscious experience) with discoverable error characteristics. This instrument accesses phenomenal facts not reducible to behavior or neural data. A science renouncing this instrument risks predicting behavior while leaving consciousness unexplained. Claims with empty ledgers may still be true and meaningful.  

  ### 3. Cruxes  
  The table below outlines key sub-questions (cruxes), including the three specified. For each, we agree on a test, state predictions, and specify what would count as evidence against our positions.  

  | Crux Name               | Neutral Restatement                                                                                                                               | Party A Wording (Heterophenomenologist)                                                                                                                                  | Party B Wording (Phenomenal Realist)                                                                                                                                 | Agreed Test                                                                                                                                                                                                 | Prediction of A                                                                 | Prediction of B                                                                 | Evidence Against A                                                                                                                                 | Evidence Against B                                                                                                                               |  
  |-------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------|---------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------|  
  | **The Silent Swap**     | A hypothetical intervention transposes the neural realizers of two sensory qualities (e.g., red/green) while holding all third-person data (behavior, reports, neural activity) fixed. Is this coherent? If so, what is the ledger for "something changed"? | The swap is incoherent: no third-person difference implies no change. The claim "something changed" has an empty ledger and is scientifically vacuous.                                                      | The swap is coherent: subjective qualities can vary independently. "Something changed" has an empty ledger, but this reflects the instrument’s privacy, not falsity. | Conceptual test: Debate whether a universe where all third-person data are identical pre/post-swap is logically possible. If coherent, derive implications for the ledger.                                                                 | Incoherent; no change occurs. Ledger is empty, so claim is untestable and irrelevant to science.                                 | Coherent; change occurs but is undetectable. Ledger empty, but claim is true and meaningful.                                                              | If a swap scenario is shown coherent *and* third-person science can detect a difference (contradicting the setup).                              | If the swap is shown logically impossible (e.g., via neural-behavioral necessity arguments).                                                            |  
  | **The Residue Protocol** | After training in neuroscience/confabulation psychology and cross-examination, subjects avow "something irreducible to third-person description remains." What is this avowal, and what would stable avowal rates show? | The avowal is verbal behavior shaped by training. Stable avowal rates show demand characteristics or cognitive bias, not a "residue."                                     | The avowal reports a phenomenal residue. Stable, training-insensitive avowal rates indicate robust first-person access to irreducible facts.                        | Empirical test: Pre-register training/cross-examination protocols across diverse populations. Measure avowal rates under varied theoretical sophistication (e.g., novice vs. expert subjects). Test stability across conditions. | Avowal rates correlate with training (e.g., drop with expertise), showing it is contingent behavior.                                | Avowal rates remain high and stable regardless of training, indicating a consistent phenomenal residue.                                     | Stable high avowal rates across expertise levels, unexplained by bias.                                                                           | Avowal rates plummet with expertise, suggesting confabulation.                                                                                     |  
  | **The Indistinguishable Interlocutor** | A system (biological/artificial) passes a pre-registered battery for heterophenomenological indistinguishability from humans. Is the question "Is it conscious?" answerable? | The question has no answer; indistinguishability entails we treat it as conscious, but there is no further fact. Demanding more is unscientific.                          | The question has an answer; inquiry could reveal if it has phenomenal properties (e.g., via structural analysis). Demanding more is essential to the explanandum. | Develop a pre-registered indistinguishability battery (e.g., Turing-style tests plus neural/behavioral assays). Debate if post-passing, evidence (e.g., architectural differences) could settle consciousness. | No evidence post-passing could answer the question; it is beyond science. "Conscious" is an interpretive stance. | Evidence post-passing (e.g., functional architecture) could confirm or deny consciousness. Indistinguishability is necessary but not sufficient. | If structural differences (e.g., silicon vs. biology) reliably shift consensus on consciousness post-passing.                                  | If indistinguishability alone forces consensus, with no further evidence needed.                                                                   |  

  ### 4. Closing Section: Separating Substantive and Verbal Disagreement  
  We identify two sources of apparent disagreement:  
  - **Verbal:** Part of the dispute stems from the term *consciousness*. Party A uses it to denote *reportable states*, while Party B uses it for *subjective experience*. This causes cross-talk but is resolvable through definitions.  
  - **Substantive:** Genuine disagreements persist:  
    - The *Silent Swap* crux is substantive but untestable (due to its empty ledger), hinging on whether subjective variation without third-person differences is coherent.  
    - The *Residue Protocol* and *Indistinguishable Interlocutor* cruxes are substantive and testable, centering on whether first-person access provides irreducible data (B) or is reducible to behavior (A).  
    - A deeper substantive divide concerns explanation: Party A holds ledger-completeness suffices for explanation; Party B holds that explaining consciousness requires accounting for "what it is like" beyond ledger-completeness.  

  **Bottom line:** The dispute is mixed, with a verbal layer exacerbating substantive disagreements about the accessibility and reducibility of phenomenal facts.  
  \answer{MIXED}  

