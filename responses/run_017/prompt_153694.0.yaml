answer: |-
  Below is a complete, runnable 2-hour workshop session designed to meet your goals. Participants will experience the tension between expected value and growth rate maximization through a hands-on betting game, with minimal lecture and no formulas until the debrief. The session uses your specified markets, emphasizes the visceral understanding of overbetting and asymmetric punishment, and includes mechanics to highlight the difference between paper gains and real-world outcomes.

  ### **Session Overview**
  - **Duration**: 120 minutes (including 10-minute break).
  - **Participants**: 16 people, split into 4 tables of 4 for efficiency (but betting is individual).
  - **Materials per Table**: 
    - 1 deck of cards (for randomizers), 
    - 10 index cards (for bets), 
    - 2 dice (d10 for precision), 
    - 1 calculator (phone).
  - **Central Materials**: Projector for leaderboard, whiteboard for rules/recap, index cards for bets.
  - **Starting Bankroll**: $1,000 in virtual money for each participant.
  - **Incentives**: 
    - Charity donation = $10 × geometric mean of all final bankrolls (e.g., if geometric mean is $500, donation = $5,000). 
    - Top scorer (final bankroll) chooses the charity and wins a $20 gift card (modest prize).
  - **Markets & Kelly Fractions**:
    - **Market A**: 60% win chance, even money (pays 1:1). Kelly fraction = 20%.
    - **Market B**: 20% win chance, pays 5:1. Kelly fraction = 4%.
    - **Market C**: 50% win chance, pays 0.9:1 (i.e., you net $0.90 per $1 bet on win). Kelly fraction = 0% (negative EV).
    - **Market D**: 90% win chance, even money (pays 1:1). Kelly fraction = 80%.

  ### **Why This Market Sequence?**
  1. **Market A (60/40 at even money)**: Intuitive, positive EV. Teaches core tension: EV maximizers go all-in (100%) and typically bust, while Kelly (20%) grows steadily. Asymmetric punishment is clear (growth drops slowly if underbetting, sharply if overbetting past 40%).
  2. **Market D (90% at even money)**: High-win probability. Shows that aggressive betting (80%) can be optimal—contrasts with "be timid" intuition. Overbetting (e.g., 100%) feels "safer" but still risks ruin.
  3. **Market B (20% chance, pays 5:1)**: Low-win probability. Highlights that positive EV doesn’t imply large bets (Kelly = 4%). Punishes overbetting harshly (e.g., >8% turns growth negative).
  4. **Market C (50% chance, pays 0.9:1)**: Negative EV. Teaches abstention (0% bet). Placed last to avoid early boredom.
  - **No dual markets**: Simplicity is key. Adding splits/correlations would overcomplicate the core lesson.  

  ### **Incentive Structure**
  - **Geometric mean donation + leaderboard**: Announce both at the start. The tension is **essential**—it mirrors real-world conflicts (e.g., fund managers vs. clients). Players see how leaderboard encourages reckless overbetting (to win individually), while geometric mean rewards conservative growth (for group benefit).  
  - **Rounds needed**: 25 rounds minimum (run 30 here). Fewer rounds mask the growth-rate difference; 30 makes ruin likely for overbetters while showing Kelly’s steady gains. Each round takes 90 seconds (45 minutes total play).  
  - **Withdrawal mechanic skipped**: It muddies the multiplicative growth focus.  

  ---

  ### **Timeline & Script**  
  **Total: 120 minutes**  

  #### **0–15 min: Introduction (15 min)**  
  - **0–5 min**: Welcome and context.  
    *"Today, we’re simulating repeated betting. You’ll make 30 stake decisions to grow a $1,000 bankroll. The twist: A real donation (my money) depends on everyone’s collective outcome via the geometric mean of your final bankrolls. But the top scorer picks the charity and wins a prize. Your goal? Maximize your bankroll—but how? Bet sizing matters."*  
  - **5–12 min**: Rules and demo.  
    - Project rules:  
      *"Each round: (1) I’ll announce a market. (2) You write your stake as a % of current bankroll (0–100%) on an index card. (3) Randomizers (cards/dice) resolve outcomes publicly. (4) I’ll update bankrolls. Bankroll = previous × multiplier. Multipliers:*  
      *- Win: 1 + (payout ratio × stake %)*  
      *- Loss: 1 - stake %*  
      *Example (Market A): Bet 20% of $1,000 = $200. Win: $1,000 × (1 + 1×0.2) = $1,200. Loss: $1,000 × (1 - 0.2) = $800."*  
    - Demo Market A with dice: Roll d10. 1–6 = win (60%), 7–10 = loss (40%).  
  - **12–15 min**: Q&A and start bankrolls.  
    *"Bankrolls update multiplicatively—this is key. If you hit $0, you’re bankrupt (set to $0.01 to avoid geometric mean = 0). No formulas today—learn by doing."*  

  #### **15–65 min: Game Play (50 min; 30 rounds, 90 sec/round)**  
  - **Structure**: 10 rounds per market (A → D → B → C), resolved in blocks. After each block, pause to show leaderboard (top 3) and bankruptcies.  
  - **Randomizers**:  
    - **Market A (60% win)**: Draw card. Red (hearts/diamonds) = win, black (clubs/spades) = loss.  
    - **Market D (90% win)**: Roll d10. 1–9 = win, 10 = loss.  
    - **Market B (20% win)**: Draw card. Win only if Ace (4/52 ≈ 7.7%—close to 20% with 5 rounds. Adjust: Win on A, K, Q, J of one suit (4/52 ≈ 7.7% per round; repeat if needed).  
    - **Market C (50% win, 0.9:1 payout)**: Flip coin (projected). Heads = win (bankroll × [1 + 0.9×stake]), tails = loss (bankroll × [1 - stake]).  
  - **Facilitation**:  
    - Announce market, give 30 sec to write stake % on card.  
    - Collect cards, shuffle, and publicly resolve (e.g., *"Market A: Julia bets 100%, Liam 20%... Card drawn: red! Wins for red bettors."*).  
    - Update bankrolls on projected spreadsheet (Google Sheets).  
    - After blocks 1 (A), 2 (D), and 3 (B), show leaderboard and bankruptcies (e.g., *"After Market A: 3 bankrupt. Top bankroll: $5,000 (100% bettor), but 12 of 16 have less than $1,000"*).  
  - **Key moments to highlight during play**:  
    - **Round 5 (Market A)**: First bankruptcy likely (100% bettor losing once). *"Notice: One loss wiped out a 100% bettor. But expected value said this bet was +EV!"*  
    - **Round 15 (Market D)**: Overbetters (100%) may survive but with volatility; underbetters (e.g., 50%) grow slowly. *"90% win chance—why isn’t everyone all-in? Look at the few who lost at 100%: they’re nearly bankrupt."*  
    - **Round 25 (Market B)**: Most 100% bettors bankrupt (survival odds: 0.8^10 = 10.7%). *"A 4% bet seems tiny, but check the steady growth of those near 4%."*  
    - **Round 30 (Market C)**: Many abstain (optimal). *"Negative EV? Smart players bet 0%."*  

  #### **65–70 min: Break (5 min shortened; compensate in debrief)**  
  - Quick stretch. Project leaderboard to fuel competition.  

  #### **70–105 min: Debrief (35 min)**  
  Map discussion to observed game events:  
  1. **Paper gains vs. reality (5 min)**:  
     - *"After Market A, the expected bankroll for a 100% bettor was $1,600 (since 0.6×$2,000 + 0.4×$0 = $1,200 > $1,000). But how many had >$1,000? [Typically 1–2]. Why?"*  
     - **Link to experience**: Mean is skewed by rare huge wins (e.g., $5,000), but most go bankrupt. Kelly (20%) avoids ruin, grows reliably.  

  2. **Asymmetric punishment of overbetting (10 min)**:  
     - *"Recall Market D: Betting 80% (Kelly) had steady gains. But what if you bet 100%? Growth rate plummets past 80%—one loss costs more than nine wins. In Market A, betting >40% (2× Kelly) makes growth negative."*  
     - Whiteboard sketch: Draw growth rate (log) vs. stake % for Market A. Peak at 20%, slow decline to 40%, then steep drop.  

  3. **Aggression when warranted (5 min)**:  
     - *"Market D’s 80% bet felt scary—but it was optimal. Kelly isn’t ‘timid’—it scales with edge."* Contrast with Market B (4%) and C (0%).  

  4. **Incentive tension (5 min)**:  
     - *"Who played for the leaderboard? Did you overbet? The geometric mean penalized your risk—e.g., one $0.01 bankroll halves the mean."* Discuss how real-world incentives (e.g., bonuses) distort decisions.  

  5. **Limitations of the game (5 min)**:  
     - *"What we simulated isn’t the full story: (1) Probabilities were known—real life isn’t so clear. (2) We assumed infinite repeats—but lumpy opportunities (e.g., buying a house) need different strategies. (3) Growth rate is asymptotic—it shines over 100s of bets, not 30."*  

  #### **105–120 min: Closing & Assessment (15 min)**  
  - **Final assessment question (no formula)**:  
    *"Round 31: A new market—70% win chance, pays 1:1. What stake % would you bet? Why?"*  
    - Listen for reasoning: "About 40–50% because edge is big but not certain" (Kelly = 70% - 30% = 40%). If they cite "fraction of edge" or "avoiding overbet," the idea landed.  
  - **Reveal Kelly fractions**: Show fractions for all markets (A:20%, B:4%, C:0%, D:80%). *"These maximize growth rate. Not EV!"*  
  - **Wrap-up**: Award prize, announce donation. *"Today, you felt why growth and EV diverge. Kelly isn’t a formula—it’s a buffer against uncertainty."*  

  ---

  ### **What Will Go Wrong (and How to Handle It)**  
  1. **Player stakes everything early and wins**:  
     - Likely in Market A/D. They’ll top the leaderboard early, encouraging copycats. **Use it**: Highlight their bankroll mid-game ("$10,000!") and later (if they bust in Market B/C). Show how rare their path is.  

  2. **Confusion: Fixed fraction vs. fixed amount**:  
     - Some will bet fixed sums (e.g., $200 each round). **Prevent it**: Demo with $1,000→$800→? (e.g., "Betting $200 on $800 is 25%—not fixed!"). Correct during play.  

  3. **Abstention from boredom (e.g., Market C)**:  
     - Some may bet "for fun" in C despite negative EV. **Use it**: Contrast abstainers ($ stable) vs. bettors (decline).  

  4. **Playing for leaderboard only**:  
     - A participant ignores geometric mean, bets 100% to win. **Use it**: In debrief, show how their bankroll (if $0.01) hurt the donation.  

  5. **Bankroll calculation delays**:  
     - **Mitigate**: Use spreadsheet formulas; assign a volunteer to input stakes.  

  ---

  ### **What the Game Can’t Reproduce (Requires Verbal Explanation)**  
  1. **Asymptotic nature**: The game’s 30 rounds show tendencies, but Kelly’s superiority is absolute only in the long run. Verbally: *"Over 1,000 rounds, Kelly beats all other strategies with probability 1."*  
  2. **Uncertain probabilities**: The game assumes known probabilities. Verbally: *"With uncertainty, bet half-Kelly to avoid overbetting on misestimated edges."*  
  3. **Non-repeatable opportunities**: Verbally: *"For one-off bets (e.g., startup investment), maximize expected utility or use a fixed budget—not growth rate."*  

  ### **Version with Misestimated Probabilities (No Deception)**  
  - **Teach without deception**: In debrief, add a **"what if" market**: *"Suppose you thought Market A was 60/40, but it was really 55/45. Kelly would be 10% (not 20%). Betting 20% would be overbetting—growth turns negative. That’s why real Kelly bettors ‘shrink’ fractions for uncertainty."*  
  - **No need to deceive**: The lesson is clear through discussion.  

  ### **Why This Works**  
  - **Concrete before conceptual**: Players feel overbetting’s ruin and growth asymmetry before hearing "Kelly."  
  - **Markets build intuition**: Sequence contrasts aggression (D) vs. caution (B) vs. abstention (C).  
  - **Incentives create tension**: Leaderboard vs. geometric mean mirrors real conflicts.  
  - **Debrief ties to experience**: Every point references in-game events.  

  By the final assessment question, players should reason about edge and risk intuitively—not just recite formulas. If they say, "I’d bet less than the edge to avoid blowup," the idea landed.
