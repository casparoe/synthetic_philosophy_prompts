  In the debrief, we cover:

  1. The difference between expected value and growth rate: show that the expected bankroll after many rounds is dominated by a few very lucky paths, but almost everyone else is broke. The Kelly strategy, by contrast, grows steadily.

  2. The asymmetric punishment of overbetting: show that betting more than the Kelly fraction reduces the growth rate and can even make it negative. We can show the growth rate as a function of f for a market (like A) and how it peaks at 20% and then falls off, and becomes negative at 40% (because then 0.6*ln(1.4) + 0.4*ln(0.6) ≈ 0.6*0.3365 + 0.4*(-0.5108) ≈ 0.2019 - 0.2043 = negative). So overbetting beyond twice the Kelly fraction (which is 40% for market A) is particularly bad.

  3. The Kelly fraction can be large: as in market D (80%).

  4. The leaderboard vs. the donation: we can note that the leaderboard encouraged risk-taking (to try to be the top) while the donation encouraged conservative play (to avoid zeros). We can ask: "Did anyone change their betting strategy because of the leaderboard? Or because of the donation?"

  What the game cannot reproduce:

