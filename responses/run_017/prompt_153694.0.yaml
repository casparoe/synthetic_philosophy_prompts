  I think we avoid deception. Instead, in the debrief, we can say: "What if the probability is not known exactly? What if we thought it was 60% but it was really 55%? Then betting 20% would be overbetting. So in practice, people often bet a fraction of the Kelly fraction (like half-Kelly) to be safe."

  Final design:

  Materials:
  - Spreadsheet with player names and bankrolls (start at $1000)
  - Projector to show the standings (every 5 rounds or at the end of each market block)
  - Index cards and pens for bets
  - Dice: for Market A: 10-sided die (1-6 win, 7-10 lose)
    Market D: 10-sided die (1-9 win, 10 lose)
    Market B: 10-sided die (1-2 win, 3-10 lose) [because 20%]
    Market C: coin flip? or die: 1-5 lose, 6-10 win? But it's even chance. So we can use a coin or a die: say 1-5 lose, 6-10 win? But that's 50%. Or use a coin on the projector? Or use a deck of cards: red/black.

  Rules:
  - Players bet a fraction of their current bankroll (0% to 100%).
  - If a player's bankroll falls below $0.01, it is set to $0.01 and they cannot bet anymore.
  - We will have 30 rounds in three blocks of 10 rounds each: Market A, then D, then B.

  Announcement at start: the donation is based on the geometric mean of final bankrolls, and the top player chooses the charity and gets a prize.

  Debrief outline:

  1. Show the final leaderboard and the geometric mean.
  2. Ask: "What happened to the players who bet 100% in Market A?" (almost surely broke) and "What about those who bet 0%?" (remained at $1000) and "What about those who bet 20%?" (grown by about 1.02^10 ≈ 1.22 in Market A, then similarly in the other markets).
  3. Discuss the tension between the individual leaderboard and the group donation: the leaderboard encouraged high risk, while the donation encouraged avoiding zeros.
  4. Explain the Kelly criterion: the fraction that maximizes the expected log wealth. Show the formula for Market A: f* = p - q = 0.6 - 0.4 = 0.2.
  5. Show how overbetting reduces growth: for Market A, show the growth rate (expected log return) as a function of f. It peaks at 20% and then falls, becoming negative at 40%. Use a graph on the board.
  6. Discuss the other markets: Market D (f*=80%), Market B (f*=4%), and mention that for a negative EV bet (like a bet we didn't play: even chance paying 0.9:1) you should bet zero.
  7. Limitations: long-run asymptotic, known probabilities, and single bet vs. repeated.
  8. Final question: "If you were to play another 30 rounds of Market A, what fraction would you bet? Why?"

  What might go wrong:

  - Time: 1.5 min per round is tight. We might run over. Solution: have an assistant to help with data entry and random draws.
  - Confusion: Some players might not understand the multiplicative updating. We can provide a cheat-sheet: "New bankroll = old bankroll * (1 + f) if win, * (1 - f) if loss" for even money bets. For Market B: if you bet fraction f and win, you get 5 times your stake, so your bankroll becomes old * (1 + 5f). If you lose, old * (1 - f). For Market C: if you win, you get 0.9 times your stake, so bankroll = old * (1 + 0.9f) on win? But wait: if you bet $S, you get $0.9S in winnings, so total return is $S (stake) + $0.9S = $1.9S? Or do you only get the winnings? Clarify: typically, you get your stake back plus winnings. So for a bet that pays b:1, if you win, you get b times your stake as winnings, and your stake is returned. So total return is (1+b) times your stake. Therefore, for a bet fraction f, on win: bankroll *= (1 + b*f). On loss: bankroll *= (1 - f).

  So for Market C: b=0.9, so on win: (1+0.9f), on loss: (1-f).

  We must be clear about this in the instructions.

  - The player who bets 100% in Market B and wins the first 9 rounds and then loses the 10th: they go broke. But if they win all 10, they become very rich. The chance is 0.2^10 = 1e-7, so it won't happen. But we can mention the possibility.

  - Some players might not bet optimally but still do well by luck. We can point out that the Kelly criterion is about the long-run growth, not short-term luck.

