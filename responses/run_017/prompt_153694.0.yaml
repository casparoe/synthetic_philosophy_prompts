  Last round or closing question:

  We can have a final round with a new market (say, a 50% chance at 2:1, which has f* = (0.5*2 - 0.5)/2 = (1-0.5)/2 = 0.25) and ask them to write their bet without telling them the Kelly fraction. Then we resolve and then ask: "What fraction do you think would maximize the growth rate?" and see if they can reason about it. Or we can ask them to write down the fraction they would bet and why, and then we can see if they internalized the idea.

  Alternatively, we can ask: "If you were to play another 30 rounds of market A, what fraction would you bet and why?" Then we can see if they say 20% or something else.

