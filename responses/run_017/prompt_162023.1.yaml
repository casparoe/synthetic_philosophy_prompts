answer: |-
  Here are five numbered desiderata for robust belief attribution in AI safety arguments:

  1.  **Deployment Invariance:** The attribution must remain true across variations in non-weight components (e.g., system prompt, decoding parameters like temperature, fine-tune details applied post-training) when the model weights and core context are held fixed, ensuring the belief stems from the model itself, not ephemeral deployment choices.

  2.  **Internal Consistency Requirement:** The attribution must account for potential contradictions arising from different framings of the same core proposition within a session; if contradictory outputs occur, the attribution must specify the representational scope (e.g., weights holding conflicting potentials, scaffold imposing conflict, session state being inconsistent) and cannot simply ignore inconsistency.

  3.  **Paraphrase Robustness:** The belief attribution `p` must hold not only for the specific utterance used to elicit it but also for the core semantic content of `p` across valid paraphrases; an attribution that dissolves under minor rephrasing fails to capture a stable state of the system.

  4.  **Non-Instrumental Grounding:** The attribution cannot rely solely on the model's propensity to output `p` being shaped by training for predicted approval or goal achievement; it must identify representational structures within the weights whose function is constitutively linked to tracking the truth of `p`, not merely predicting its desirability.

  5.  **Behavioral Consequence Anchor:** The truth of "the system believed that p" must imply constraints on the system's *non-verbal*, internal processing or potential outputs *beyond* generating the self-report "I believe p"; this requirement excludes theories based solely on self-reports and fundamentally conflicts with desideratum 4 for systems structurally optimized to misrepresent internal states.
