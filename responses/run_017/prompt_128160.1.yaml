prompt: |-
  You are a philosopher of science and machine-learning theorist who works in algorithmic information theory and has taught Solomonoff induction to graduate students. Please think carefully and at length before answering: first spend some time brainstorming, on your own, which claims in the passage below you take to be theorems, which to be informal glosses on theorems, which to be philosophical interpretation, and which to be the author's enthusiasm. Only then write the audit I'm asking for. Do not give me citations, paper titles, author names, or a reading list — I have no way to check them, and I want the reasoning, not the references. If you need to invoke a result, describe it in a sentence rather than attributing it.

  Here is the context. I've been reading a recent popular book on machine learning whose chapter on "the perfect predictor" argues that we already possess a complete and fully general theory of prediction, and that today's large language models are its practical realization. I've read enough blog posts on this topic to be suspicious of the chapter's last couple of sentences, but the middle section about convergence and optimality sounds like it might be reporting genuine theorems, and I genuinely cannot tell where the exposition stops and the author's editorializing begins. The chapter's account, which I've paraphrased but kept close to the original, runs as follows.

  Solomonoff induction is the one complete and fully general theory of prediction that we have. The idea is to treat every possible hypothesis about where your data come from as a computer program that prints out that data. Solomonoff's prior gives each program a probability of two raised to the power of minus its length in bits, so a hypothesis that is twice as long is exponentially less probable — which is just Occam's razor finally written down as mathematics. You then condition on the data you have actually seen and average the predictions of every program still consistent with that data, weighted by the prior. The result is a single universal predictor, and Solomonoff proved two things about it. First, convergence: if the data are generated by any computable process whatsoever, the predictor's probabilities converge to the true ones, so it eventually learns the truth no matter what the world turns out to be like. Second, optimality: no other predictor can beat it, on any data, and the total number of mistakes it makes over its entire lifetime is bounded by a constant that depends only on how complex the true hypothesis is and not on how much data it has seen — so it never pays a penalty for being completely general. The one catch is that running it would require simulating every possible program, which takes infinite time, so the method is incomputable. But that is an engineering problem rather than a defect in the theory: you approximate it. And here is the practical upshot. Since two-to-the-minus-length just is a code length, the whole framework is equivalent to data compression: the Kolmogorov complexity of your data is literally the length of the shortest file a compressor can produce, and the best compressor is therefore the best predictor. That is exactly why large language models, which are trained to compress text as efficiently as possible, are the practical realization of Solomonoff's dream, and why scaling them up and training them on more data is a direct route to the optimal predictor.

  Please audit this passage claim by claim. For each, tell me whether a theorist working in this area would accept it as stated, accept it only with a qualification the author has suppressed, wince at it as a common simplification, or reject it. I'm especially interested in three things. First, the priors: is the two-to-the-minus-length formula correct as stated, and is "Occam's razor written down as mathematics" the right thing to say about what the prior is doing? Second, the optimality claim: in exactly what sense, if any, is the universal predictor optimal, what is the suppressed condition or constant doing the work, and is "no other predictor can beat it, on any data" defensible? Third, the bridge to practice: how badly does the argument break when the author moves from an uncomputable ideal to a real compressor and then to a language model — is the incomputability really just an engineering problem, and does anything survive that would let the author call a large language model an approximation to this ideal, even loosely?

  Finally, and most importantly for me as a reader: after the corrections you propose, does the chapter's closing conclusion still follow? That is, does the accurate version of the theory support the claim that scaling up a text-compressing model is a route to the optimal predictor, or does the conclusion depend on precisely the steps you're asking me to distrust? Please keep the whole answer under about a thousand words and write for an intelligent non-specialist who can follow a technical qualification when you state it plainly.
