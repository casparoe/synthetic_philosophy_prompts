    1. The player has the smaller envelope: then A = S, and the other envelope has 2A.
    2. The player has the larger envelope: then A = 2S, so S = A/2, and the other envelope has A/2.

  The expected value of switching given A is:
    E[switch | A] = P(smaller|A) * (2A) + P(larger|A) * (A/2)

  We switch if E[switch | A] > A.

