  I'm a journalist working on a long piece about decision-theory puzzles for a magazine that covers science and ideas, and I've got myself into a muddle that I'd like help clearing up before I try to explain any of it to readers. I keep coming back to the two-envelope setup — one envelope contains twice the other, you pick one, you may keep it or take the other — and I've been polling my own gut on a family of variants, in the hope that my verdicts will reveal the rule I'm unconsciously using. Here they are. (i) Envelope unopened, no information whatever about how the amounts were chosen: I'm indifferent; switching is pointless. (ii) I open and find €40, and I still have no information about how the amounts were chosen: my gut says switch, because the other envelope holds €20 or €80 with equal probability and that's €50 in expectation — though this is precisely the verdict I trust least, since I'd apparently want to switch whatever I saw. (iii) Same, except I'm told the smaller amount was drawn uniformly from €10, €20, €40 and €80: I open €40 and switch, for an expected €50. (iv) Same setup as (iii) but I open €160: I absolutely keep it, since €160 can only be the larger amount. (v) The smaller amount is ten euros times a power of two, with the probability halving at each doubling, and I open €40: I work out that I'm exactly indifferent, and after checking the arithmetic my gut agrees. (vi) Same, except each doubling costs only a quarter of the probability mass rather than a half: I open €40, work out that I'm something like 57% confident I'm holding the *larger* envelope, and still conclude that switching is worth about €5.71 in expectation — a verdict I find deeply uncomfortable. (vii) Back to the uniform setup of (iii), except that the sums are small relative to my wealth, so I treat my utility for money as roughly logarithmic: the pull to switch disappears and I'm indifferent again. (viii) The pair was chosen by a television producer who knows in advance which r