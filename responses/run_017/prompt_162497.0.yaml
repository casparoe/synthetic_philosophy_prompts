  The paradox is resolved by noting that the prior distribution of X matters. The expectation calculation above assumes that the two cases (whether the player has the smaller or the larger) are equally likely regardless of A. But if we have a prior distribution on X, then the conditional probability that the player has the smaller envelope given the observed A might not be 1/2.

  The correct rule is to switch if the expected value (or expected utility) of switching is greater than the current amount. This requires a prior distribution on the possible amounts.

