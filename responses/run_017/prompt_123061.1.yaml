prompt: |-
  I'm a backend engineer with no philosophy background, and my team is building a memorial product I've started to feel uneasy about: we ingest a dead person's entire digital residue — mail, chat logs, drafts, photos, calendar, search history, location and health data — and generate a book-length life written in the first person, which the family can also query later and have it answer in the subject's voice. Two tiers are on the table. "Complete" suppresses nothing: the only editorial act left is which thread to follow first, since nothing may be cut or reordered. "Curated" lets the family, or the person while still alive, flag material to be dropped, and reads in practice as a tribute.

  I've been reading Plutarch's parallel lives of Greeks and Romans alongside this, and I'd like to know where he would come down. Concretely: which tier, if either, would he count as a life rather than a chronicle, and could either one do the improving work he seems to have wanted the genre to do? I mean answers that argue from what he actually did and said — that he opens the Alexander by saying he writes lives, not histories; that a stray remark or a joke can show character better than a celebrated battle; that he sets each Greek beside a Roman and weighs them; that there is a preface somewhere about holding these men in front of you like a mirror — rather than from the assumption that he would simply be appalled by the machinery. Two follow-ups I especially care about: would he see the curated tier as the kind of flattery he warns about, or is his own practice closer to it than we like to admit; and would he think a life assembled by a machine, with judgement removed from selection, can teach anyone anything at all? For what it's worth, most of our customers are completely ordinary people rather than generals and statesmen, which may matter to him too.
reasoning: |-
  Okay, let me start by unpacking this backend engineer's dilemma. They're working on a memorial product that compiles a deceased person's digital footprint into a first-person narrative. The two tiers—Complete and Curated—raise philosophical questions about what constitutes a meaningful life account. The engineer specifically wants to know how Plutarch, the ancient biographer, would view these tiers based on his actual methods and writings.

  First, I need to recall Plutarch's approach. He explicitly says he writes "lives, not histories," focusing on character over events. Small anecdotes and personal details are crucial for him to reveal virtues and vices. The mirror metaphor is key here—biography as a tool for moral improvement by presenting examples to emulate or avoid. 

  Now, considering the Complete tier: it includes everything without curation. Plutarch would likely see this as a chronicle, not a life. His selective use of material aimed to highlight moral lessons. A raw data dump lacks the narrative focus he valued. Even though he included unflattering details, they served a purpose. The Complete tier's lack of selection might bury significant traits under trivialities, failing to provide clear moral insights.

  Next, the Curated tier allows removal of sensitive content. The engineer worries this might resemble the flattery Plutarch criticized. But looking closely at Plutarch's work, he did omit damaging stories if they didn't serve his moral purpose. For example, he skipped some of Alexander's atrocities not to flatter but to focus on instructive qualities. So Plutarch's curation was purposeful, not just whitewashing. The Curated tier, if done thoughtfully, could align with his approach—removing irrelevant or harmful details to highlight character.

  The machine-generated aspect is tricky. Plutarch emphasized human judgment in selecting and interpreting events. An algorithm processing data points might miss the moral significance behind actions. However, if the curation rules are designed to prioritize character-revealing moments (like drafts or minor exchanges), there might be overlap. But without intentionality, it's a chronicle. The family's role in curation could introduce human judgment, making it closer to Plutarch's method.

  Regarding ordinary subjects, Plutarch believed everyone's life offers lessons. His "Lives" included non-elites, though most were prominent. His method applies universally—character revelation through small acts matters regardless of status. So ordinary people's digital traces could serve his purpose if curated well.

  On flattery: the Curated tier risks becoming tribute, but Plutarch's own omissions show he balanced discretion with honesty. As long as curation avoids distorting character, it's acceptable. The key is whether the essence remains truthful for moral instruction.

  Can an AI-generated life teach? Plutarch might doubt it. Moral judgment requires understanding context and consequences—something algorithms might miss. The generated narrative could offer raw material, but without human interpretation, its educational value is limited. The query function answering in the subject's voice might particularly disturb him, as it fabricates presence, potentially misrepresenting character.

  In conclusion, Plutarch would likely see the Curated tier as closer to a "life" if it emphasizes character through selective, meaningful details. The Complete tier remains a chronicle. The machine's role lacks the intentionality he deemed essential, but human-guided curation could partially bridge that gap. His core concern would be whether the final product serves as a truthful moral mirror, regardless of the subject's fame.
answer: |-
  Based on Plutarch's explicit statements and actual biographical practice, here's where he would likely stand on your tiers, arguing strictly from his texts:

  1.  **Neither Tier is a True "Life" (Bios) in Plutarch's Sense:**
      *   **The Core Issue:** Plutarch's opening in *Alexander 1.2* is definitive: "For it is not Histories that I am writing, but Lives; and in the most illustrious deeds there is not always a manifestation of virtue or vice, nay, a slight thing like a phrase or a jest often makes a greater revelation of character than battles where thousands fall..." A "Life" for Plutarch is *not* a comprehensive record, but a **deliberate selection and arrangement** of events, anecdotes, and sayings designed to **reveal character (ēthos)** and provide **moral exempla**.
      *   **Against the "Complete" Tier:** Plutarch would unequivocally reject this as a mere *chronicle* or *history*, not a *Life*. The lack of editorial judgment – the inability to cut the trivial, repetitive, irrelevant, or deeply private – means it fails at its primary task: illuminating character for moral instruction (the "improving work"). The sheer volume of undifferentiated data would obscure the revealing "slight thing" or "jest." His *Fabius Maximus 1.3* criticizes historians who record "things which it was creditable for the statesman to do and say, but not well to write." A raw data dump includes vast amounts Plutarch would deem "not well to write" for revealing character.
      *   **Against the "Curated" Tier:** While closer, it still falls short. Plutarch's curation wasn't primarily about *suppressing* material flagged as unpleasant by the subject or family (though he practiced discretion). His curation was about **selecting what best served his moral and pedagogical purpose.** Flagging material for removal based on sensitivity or the desire for a "tribute" directly contradicts Plutarch's aim of revealing true character, virtues *and* vices, for the reader's moral benefit.

  2.  **Plutarch's Practice vs. "Curated" Flattery:**
      *   **He Warned Against Flattery, But Practiced Discretion:** Plutarch explicitly condemns flattery (*De Adulatore et Amico*) and aimed for truth in his *Lives*. However, his own practice was **far closer to a sophisticated, purpose-driven curation than to unvarnished exposure.** He:
          *   **Omitted Damaging Material if Irrelevant:** He skips Alexander's massacre at Thebes (*Alexander 11*) and downplays some of his drunken rages. He omits entirely many damaging stories about Pericles' private life attested elsewhere. His rationale wasn't flattery, but focus: including *only* what served his character portrait or moral lesson.
          *   **Emphasized the Positive for Exemplars:** For figures he admired (like Pericles, Aristides), he emphasized virtues and downplayed or explained away flaws. The goal was to provide a clear model to emulate.
          *   **Used Discretion on Private Matters:** Plutarch generally avoids salacious details or deeply private humiliations unless they were widely known or crucially revealed character. His focus was on public virtue and vice as manifested in action and speech relevant to governance and character.
      *   **"Curated" Tier vs. Plutarch:** Your "Curated" tier, driven by the subject's/family's desire for a "tribute," is fundamentally different. Plutarch curated for **moral pedagogy**, selecting what best revealed character *for the reader's improvement*. Your tier curates for **comfort and reputation management**, suppressing what the subject/family finds uncomfortable. Plutarch would see this as precisely the kind of flattery he condemned – prioritizing the subject's image over the truth needed for the reader's moral mirror. His own omissions served his pedagogical goal; your tier's omissions serve the subject's/family's emotional goal.

  3.  **Can the Machine-Generated "Life" Teach?**
      *   **Judgment is Paramount:** Plutarch's entire project rests on **human moral judgment applied to selection and presentation.** The "improving work" comes from the biographer's skill in choosing the revealing anecdote, juxtaposing events to show character development or contradiction, and implicitly/explicitly framing actions within a moral context. As he says (*Aemilius Paulus 1.1*), he writes so readers can "regulate their own lives" by holding these examples "like a mirror."
      *   **The Machine's Fatal Lack:** An algorithm ingesting *all* data and presenting it without human moral judgment (Complete tier) or suppressing based on subjective comfort (Curated tier) possesses **none of the essential qualities Plutarch required.** It cannot discern which "slight thing" reveals character, cannot weigh virtues against vices for a balanced portrait, cannot frame events for moral instruction, and cannot exercise the necessary discretion about what is "creditable to do but not well to write." It generates data, not insight.
      *   **The Query Function - A Distorted Mirror?:** Plutarch would likely be disturbed by the query function answering "in the subject's voice." His "mirror" reflects the *actual* recorded words and deeds, interpreted by the reader *through* the biographer's moral framework. Fabricated responses based on patterns are not the subject's true voice or character; they are simulacra. This risks creating a flattering or misleading oracle, not an instructive historical example.

  4.  **Ordinary People Matter:**
      *   Plutarch explicitly states (*Aemilius Paulus 1.4-5*) that virtue manifests in small, private actions just as in great public ones: "...often some little matter, a word or a jest, shows a man's character better than battles where thousands fall..." He believed the methods of biography – revealing character through specific deeds and words – were applicable beyond generals and statesmen. He wrote about many minor figures in his *Moralia* (e.g., *Sayings of Spartans*, *Sayings of Kings and Commanders*). The *potential* for moral instruction exists in ordinary lives. However, his core critique remains: without the **deliberate, morally-guided selection and presentation** by a human biographer, the raw data or comfort-curated version of an ordinary life won't achieve the pedagogical aim any better than that of a great general. The method, not the subject's fame, is the key barrier.

  **Conclusion for Plutarch:**

  *   **Neither Tier = Bios:** He would classify both your tiers as *chronicles* or *archives*, not true *Lives (Bioi)*. The Complete tier lacks essential selection; the Curated tier lacks the correct *purpose* for selection (moral pedagogy vs. comfort/reputation).
  *   **"Curated" as Flattery:** He would see your Curated tier as dangerously close to the flattery he condemned. His own practice involved discreet and purposeful omission, but always subordinated to revealing character for moral instruction, not avoiding discomfort.
  *   **Machine's Inability to Teach:** Plutarch would be profoundly skeptical that a machine-generated narrative, devoid of human moral judgment in selection, framing, and emphasis, could perform the "improving work" of biography. The query function's fabricated responses would compound this problem, creating a misleading reflection, not a true moral mirror.
  *   **Ordinary Lives:** While he believed character revelation was valuable in all lives, the method (human moral curation) was essential, making the machine approach inadequate regardless of the subject's status.

  **Plutarch's Verdict (Concrete):** He would likely reject *both* tiers as inadequate for creating a true "Life" capable of moral instruction. If forced to choose the *lesser* failure, he might begrudgingly see the **Curated tier as having *some* potential** (it at least involves human selection, however flawed the motive), but only if the curation were radically re-oriented towards revealing character truthfully for the reader's benefit, not the subject's/family's comfort. The Complete tier would be dismissed entirely as useless for his purposes. The core machinery – replacing human moral judgment with algorithmic ingestion and family comfort flags – would be anathema to his entire conception of the biographer's art and duty.
