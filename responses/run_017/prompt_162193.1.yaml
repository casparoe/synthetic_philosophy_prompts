prompt: |-
  I teach one 75-minute session of a graduate seminar on collective decision-making: 18 students, mixed preparation (roughly half have had a first course in microeconomics, two or three have traded on a prediction market, none has studied futarchy), one room with a projector, and a strong preference for a paper-and-pencil procedure over anything that depends on students having phones or laptops. I want to run futarchy itself as a classroom game: the students should decide something real about the seminar by voting on a welfare metric and then letting conditional prediction markets pick the policy, and only in the debrief should the word futarchy be used and the mechanism placed in its intellectual context.

  What I want them to feel, in this order, is first that conditional markets genuinely aggregate dispersed private information better than discussion or a show of hands — the pull of the proposal has to land before it is named — and then that something goes structurally wrong with it. My own suspicion, which I would like the activity to test rather than assume, is that the standard objection (that people who hold contracts paying off on a bad outcome have an incentive to bring that outcome about) is not the deepest problem. The deeper one is that in futarchy the treatment is assigned by the forecast of its own effect: the market is asked for a number that is supposed to be read causally, but the number is also public and is read by the very people whose subsequent effort and cooperation determine the outcome, so the price is a fixed point of a loop rather than an estimate of a policy effect, and the market partly destroys the informational conditions that made its own price informative. I would like the activity to make that loop visible as something the students do and watch happen, not as something I assert, and I would like the debrief to distinguish which moment in the session displayed the sabotage incentive, which displayed reflexivity, and which displayed gaming of the metric itself.

  Please give me: the decision and the welfare metric to put to them (I am happy for the metric to be one they can cheaply inflate, such as self-reported comprehension, if that serves the design); the trading mechanism, runnable on paper with 18 novices in one room, including how the two conditional markets are opened and how the verdict is computed from their prices; the assignment of at least one role whose holder observes the market price before taking an action that affects the outcome, together with that role's payoffs; a payoff scheme using points or trivial stakes rather than money; a minute-by-minute timeline; the debrief, mapping particular moments onto particular features of the mechanism; what will predictably go wrong the first time I run it and how to recover; and an honest note on which feature of real futarchy the session cannot reproduce and which therefore has to be supplied by me in discussion.
reasoning: |-
  We are designing a classroom game to simulate futarchy without naming it until the debrief. The goal is for students to experience:
   1. How conditional markets aggregate dispersed private information better than discussion or voting.
   2. Then, how the mechanism breaks down due to reflexivity (the market price being public and influencing behavior) and possibly metric gaming.

   Constraints:
   - 75 minutes
   - 18 students, mixed prep (some microeconomics, a few prediction market experience)
   - Paper and pencil only (no phones/laptops)
   - Must assign at least one role that sees the market price and then takes an action affecting the outcome.

   Steps:

   1. **Decision and Welfare Metric**:
      - The decision: Choose between two policies for the seminar. Let's make it something simple and real that they can influence.
      - Policy A: The class will take a 5-minute break in the middle of the session.
      - Policy B: The class will have no break and continue straight through.

      - Welfare Metric: We want something they can cheaply inflate. Let's use "self-reported comprehension of the material covered in the session". Each student will rate their comprehension on a scale from 0 to 10 at the end of the session. The average comprehension score will be the welfare metric.

      Why this metric? It's easy to measure and students can inflate their own reports. Also, the break might genuinely affect comprehension (e.g., by reducing fatigue) but the self-reporting is manipulable.

   2. **Trading Mechanism**:
      - We need conditional markets: one for "average comprehension if we take a break" (Policy A) and one for "average comprehension if we don't take a break" (Policy B).
      - We'll run both markets simultaneously but conditionally. However, we cannot run two separate markets because only one policy will be implemented. Instead, we can use a single market that trades two assets:

          Asset A: Pays off the average comprehension if Policy A is chosen, else 0.
          Asset B: Pays off the average comprehension if Policy B is chosen, else 0.

      - But note: only one of the two assets will pay off. We are going to choose the policy with the higher market price (as a proxy for higher expected comprehension).

      - How to run on paper? We can use a continuous double auction on a whiteboard. We'll have two columns: one for Asset A and one for Asset B.

      - Each asset is traded in a separate market. We'll have a market maker (the instructor) to provide initial liquidity and to record trades.

      - Alternatively, we can use a simple call market: collect bids and asks and clear at a single price. But with 18 students and time constraints, a continuous market on the board might be too chaotic. Instead, let's do two rounds of trading for each market? But we want them to trade simultaneously.

      - Proposed trading mechanism: We'll run two markets side by side. We'll have a designated market maker (the instructor) who posts an initial bid and ask for each asset. Then, students can come up to the board and write their orders (buy or sell at a certain price). The instructor will match orders when possible and update the best bid and ask. We'll have a fixed trading period (e.g., 10 minutes).

      - To simplify, we can use a single price for each asset that is set by the market. We can run a sealed-bid call market: each student submits a bid for the asset (what they think the average comprehension would be under that policy). Then the market price for each asset is the median of the bids? But that doesn't create trading. Alternatively, we can use a simple prediction market where students trade contracts that pay $1 per point of average comprehension. But we are using points, not dollars.

      - Points system: Each student starts with 100 points. They can buy and sell contracts. Each contract for Asset A will pay off (if Policy A is chosen) the actual average comprehension. Similarly for Asset B. But since the payoff is in points and the average comprehension is between 0 and 10, the payoffs are manageable.

      - How to handle conditional payoffs? Only the asset corresponding to the chosen policy pays off. The other becomes worthless.

      - We'll run the two markets simultaneously for 10 minutes. The instructor will act as the market maker and record trades on the board. We'll have two whiteboards or two sections: one for Asset A (break) and one for Asset B (no break). For each, we'll maintain:
          - The current best bid (highest price someone is willing to buy at)
          - The current best ask (lowest price someone is willing to sell at)
          - When a student wants to trade, they can either:
              - Hit the bid: sell at the current best bid (if there is a bid)
              - Hit the ask: buy at the current best ask (if there is an ask)
              - Or place a new bid or ask.

      - The instructor will update the order book and prices on the board.

      - At the end of trading, we take the last traded price for each asset (or if no trades, the midpoint of the best bid and ask) as the market price for that policy.

      - Then, we choose the policy with the higher market price.

   3. **Role with Observing the Market Price**:
      - We need at least one role that sees the market price and then takes an action that affects the outcome. Let's assign one student as the "Presenter". This student will give a short summary (2 minutes) at the end of the session on the main points covered. The quality of this summary may affect the comprehension of the class.

      - The Presenter will be chosen randomly at the beginning of the session. They will not participate in trading (to avoid them trading on their own future actions). They will be given the market prices for both policies after the trading phase and before they prepare their summary. They are told that their summary should help the class understand the material.

      - But note: the Presenter might be influenced by the market prices. For example, if the market for Policy A (break) is higher, the Presenter might think that the class expects to understand better with a break, so they might put in more effort? Or less? We leave it open.

   4. **Payoff Scheme**:
      - Students start with 100 points.
      - They can use these points to buy contracts in the markets. Each contract for Asset A costs the trade price and pays off (if Policy A is chosen) the actual average comprehension. Similarly for Asset B.
      - After the policy is implemented and the comprehension scores are collected, the contracts for the chosen policy pay off. Students get points from their contracts and also get a base payment for participation (so they don't go negative?).

      - To avoid negative points, we can structure it so that they can only buy contracts with the points they have. And the maximum loss is the points spent. The payoff for a contract is: (average_comprehension) for each contract held if that policy is chosen, else 0.

      - Also, each student will get 10 points for filling out the comprehension survey (so they have an incentive to report, but note they can inflate their own report).

      - The Presenter: They get 50 bonus points if the average comprehension is above 5 (to incentivize effort), but they also get the same trading opportunities? We said they don't trade. Instead, we give them a fixed payment of 150 points and then the 50 bonus if average comprehension > 5.

   5. **Timeline (75 minutes)**:
      - (0-5 min): Introduction. Explain the two policies (break vs. no break) and the welfare metric (average self-reported comprehension at the end). Explain that we will use a market mechanism to decide. Explain the trading rules and the contract payoffs. Assign the Presenter role (randomly, draw a name). The Presenter is told they will give a 2-minute summary at the end and that they will see the market prices before they prepare.

      - (5-15 min): Private information assignment. Each student is given a slip of paper with two pieces of information:
          - A private signal about how the break (or lack thereof) affects comprehension. For example: 
              - "Signal A: Taking a break will increase average comprehension by 1 point." (for half the class)
              - "Signal B: Taking a break will decrease average comprehension by 1 point." (for the other half)
            But note: in reality, the effect might be more complex. We want dispersion and the true effect to be ambiguous.

          Alternatively, we can give each student a private number that represents their own expected comprehension under each policy. We can set:
            - For a student, their expected comprehension without break: 6 + a random perturbation (say between -1 and 1, private).
            - With break: 6 + a random perturbation + a common effect (which we set to 0, but the students don't know) plus a private effect (say, for half the students: +1, for the other half: -1).

          However, we want the market to aggregate information about the common effect.

          Let me propose: We tell the students that the average comprehension without any policy effect is 6. Then, the break has an effect that is either +1 or -1 (common to all). Half the students get a signal that the effect is +1, half get -1. But in reality, we set the true effect to 0 (so the market should converge to 6 for both policies? but then there is no difference). That doesn't create a conflict.

          Instead, let the true effect be 0, but give signals that are noisy. Each student gets a signal about the break effect: it is drawn from N(0,1) and then they are told that the effect is either positive or negative? We want the market to aggregate to the true effect (0) but then the reflexivity and metric gaming will distort.

          Alternatively, we can skip the private signals and let them trade based on their own beliefs. But then we don't have dispersed information.

          Revised: We assign each student a role that affects their own comprehension and also gives them private information about the effect of the break on the whole class.

          However, for simplicity, let's do:

            - Each student has a private signal about the break effect on the whole class. The signal is either "Good" (meaning the break increases average comprehension by 1) or "Bad" (decreases by 1). We tell them that half the signals are Good and half are Bad, but the true effect is 0 (so the signals are random). This way, the market should aggregate to 6 for both? But then why would one be higher?

          We want the market to potentially show a difference. So let the true effect be 0, but the signals are symmetric. Then, the market prices should be about the same. But then we need a reason for the market to pick one policy over the other? Maybe we want the market to be close, so that the reflexivity can tip the balance.

          Alternatively, we can set the true effect to be 0, but let the students also have private information about the Presenter's ability? Not sure.

          Let's change the metric: The average comprehension will be computed from self-reports, and we know that the break might make them feel differently, but the key is that the Presenter's effort and the students' own reporting can be influenced by the market.

          We'll skip the private signals and rely on their heterogeneous beliefs and the reflexivity. The goal is to have the market price influence the Presenter and the students' reporting.

      - (15-25 min): Trading. Open the markets for Asset A and Asset B. The instructor acts as market maker and records trades on the board. Students can come to the board to post bids/asks or hit existing ones. Trading lasts 10 minutes.

      - (25-30 min): Market closes. Record the last traded price for Asset A and Asset B (or the midpoint if no trade). Choose the policy with the higher price. Announce the chosen policy to the class.

      - (30-60 min): Conduct the seminar as usual, but with the chosen policy (if break, take a 5-minute break at 45 minutes). The Presenter is told the market prices for both policies. They are given 5 minutes to prepare during the break (if taken) or at 50 minutes (if no break) and then give a 2-minute summary at the end (at 58 minutes).

      - (60-65 min): Comprehension survey. Each student rates their own comprehension (0-10) on a piece of paper. Collect and compute the average.

      - (65-70 min): Payoffs: Calculate the contract payoffs for the chosen policy. Each contract held of the chosen policy pays the average comprehension (so if average is 7.2, each contract pays 7.2 points). Update everyone's points.

      - (70-75 min): Debrief.

   6. **Debrief**:

      - Reveal that the mechanism is called futarchy.
      - Ask students what they experienced.
      - Highlight:
          - How the market aggregated diverse opinions (if it did) -> show of hands: who thought break was good? bad? then compare to market prices.
          - Then, the moment when the Presenter saw the market prices and prepared the summary. Did the market price influence the Presenter? How?
          - Then, the self-reporting: did the market price influence how they reported their comprehension? (e.g., if the market for the chosen policy was high, did they report higher to make the market right? or lower to get a better payoff if they sold contracts? Or if they bought, they want high comprehension.)

          - Also, the sabotage: if a student sold contracts for the chosen policy, they want low comprehension to make the contract payoff low (so they profit from selling high and the asset being worth low). But note: they can also influence their own comprehension report.

      - Distinguish:
          - Sabotage: holding a contract that pays more if the outcome is bad, and then taking actions to make the outcome bad (e.g., reporting low comprehension even if they understood, or the Presenter slacking if they hold Asset B and Policy A is chosen? But note: the Presenter doesn't trade. So sabotage would come from students who hold contracts that pay off when the chosen policy fails.

          - Reflexivity: The market price was public. The Presenter saw that the market expected high comprehension under Policy A (if that was the case) and then might have worked harder (or less) because of that expectation. Similarly, students might have been affected by the market price in their own effort during the seminar or in their reporting.

          - Metric gaming: The welfare metric is self-reported comprehension. Students can inflate or deflate their reports to influence the average.

      - Discuss: 
          - Which moment displayed sabotage? (If a student reported low to make the contract they sold more profitable)
          - Which moment displayed reflexivity? (The Presenter adjusting effort based on market expectations)
          - Which moment displayed gaming the metric? (The self-reports)

   7. **What will go wrong?**:

      - The trading might be slow or chaotic. Students might not understand how to trade. Solution: Have a practice round? Or have the instructor actively market make by setting bid and ask and updating frequently.

      - The market prices might be very close, making the policy choice seem arbitrary. Solution: If the difference is less than 0.5, flip a coin? But we want the market to be decisive. Alternatively, we can design the signals to create a slight bias? But that might interfere with the lesson.

      - The Presenter might not be influenced by the market price. Solution: In the debrief, ask the Presenter how they felt and if the price affected their preparation.

      - The comprehension reports might be too honest. Solution: We can remind them that their reports affect the contract payoffs and that they can report strategically. But we don't want to force it. The point is to see if they do it naturally.

   8. **What the session cannot reproduce**:

      - In real futarchy, the market is run by experts and with real money, so the stakes are higher and the information aggregation is more serious. In the classroom, the points are trivial and the trading is simplified.

      - The reflexivity in real futarchy might be more complex because the market price can influence many actors over a longer time. In our session, we only have the Presenter and the self-reports.

      - The metric gaming in real futarchy might be more subtle (e.g., firms manipulating GDP if that is the metric). In our case, it's blatant.

      - We have to supply in discussion: the fact that in real futarchy the market is supposed to estimate a causal effect (the effect of the policy), but because the market price is public and influences behavior, the market is actually estimating a fixed point of a system that includes the market's own influence. This is the "loop" that we want to highlight.

   Revised Timeline with Adjustments:

    Total: 75 minutes

    0-5: Introduction and rules. Assign Presenter (randomly). The Presenter is told they will give a 2-minute summary at the end and that they will see the market prices before preparing.

    5-10: Explain the trading. Each student gets 100 points. Contracts for Asset A and Asset B. Each contract for Asset A pays the actual average comprehension if Policy A is chosen (else 0). Similarly for Asset B.

    10-25: Trading period (15 minutes). The instructor sets up two boards: one for Asset A and one for Asset B. Initial bid and ask for both: bid 5.0, ask 7.0 (so spread from 5 to 7). Students can come up and:
          - Buy at the current ask (if they are willing) by announcing and the instructor records.
          - Sell at the current bid.
          - Or post a new bid (higher than current bid) or new ask (lower than current ask).

    25-30: Close markets. Take the last traded price (or if no trade, the midpoint of the best bid and ask) for each. Choose the policy with the higher price. Announce.

    30-55: Conduct the seminar. At 30 minutes, if Policy A (break) was chosen, then at 40 minutes (10 minutes into the seminar) take a 5-minute break (so 40-45 break). The Presenter is shown the market prices during the break (or at 40 minutes if no break) and given 5 minutes to prepare at that point. Then, at 55 minutes (or after the break if taken) the Presenter gives a 2-minute summary.

    55-60: Comprehension survey. Each student writes their comprehension score (0-10) on a slip. Collect and compute the average.

    60-65: Settle contracts. For the chosen policy, each contract held pays the average comprehension (in points). Students calculate their final points.

    65-75: Debrief.

    During the debrief, we reveal the name "futarchy" and discuss the three issues: sabotage, reflexivity, and metric gaming. We ask:
        - Did anyone feel they could influence the outcome by their report? (metric gaming)
        - Did the Presenter feel the market price influenced their effort? (reflexivity)
        - Did anyone trade in a way that then made them want the outcome to be low? (sabotage)

    We also note that in real futarchy, the market is designed to aggregate information, but the public nature of the price can create a self-fulfilling or self-defeating prophecy.

    Finally, we note that the session cannot reproduce the scale and complexity of real-world policies and markets, and that the metric (self-reported comprehension) is particularly easy to manipulate. In reality, choosing a robust metric is a major challenge.

   This design should meet the requirements.
answer: |-
  ### Futarchy Classroom Game Design

  #### **Decision & Welfare Metric**
  - **Decision**: Whether to serve coffee during the break (Policy A) or not (Policy B).  
  - **Welfare Metric**: *Self-reported comprehension score* (0-10 scale) averaged across all students.  
    - *Why*: Easily manipulable (students can inflate/deflate scores) and directly influenced by coffee (alertness vs. crashes), creating tension between truth-telling and gaming.

  #### **Trading Mechanism (Paper-Based)**
  - **Assets**: Two conditional prediction markets:  
    - **Asset A**: Pays out the *average comprehension score* if Policy A (coffee) is chosen.  
    - **Asset B**: Pays out the *average comprehension score* if Policy B (no coffee) is chosen.  
  - **Trading Setup**:  
    - **Initial Prices**: Set at 5.0 for both assets (midpoint of 0-10 scale).  
    - **Order Book**: Two large posters on the wall (one per asset). Students write buy/sell orders on sticky notes:  
      - **Buy Order**: "Buy [Asset] at [price]."  
      - **Sell Order**: "Sell [Asset] at [price]."  
    - **Matching**: Instructor acts as market maker. Every 2 minutes, match highest buy ≥ lowest sell for each asset, execute trade at midpoint, and update prices.  
  - **Verdict**: After trading, compare final Asset A and B prices. Policy with higher price wins.  

  #### **Reflexivity Role: The "Presenter"**
  - **Role Assignment**: Randomly select 1 student as "Presenter."  
  - **Action**: After policy selection but before comprehension scores, Presenter gives a 2-min summary of the day’s material.  
  - **Payoff**:  
    - Base: 50 points for presenting.  
    - Bonus: +20 points if class average comprehension ≥7.  
  - **Reflexivity Hook**:  
    - Presenter sees the final market prices *before* preparing their summary.  
    - If market prices imply high expected comprehension (e.g., 8.0), Presenter might slack off. If low (e.g., 4.0), they might overcompensate.  

  #### **Payoff Scheme (Points-Based)**
  - **All Students**:  
    - Start with 100 points.  
    - **Trading**: Use points to buy/sell contracts. Payoffs = (comprehension score) × (contracts held) if policy matches.  
    - **Comprehension Report**: 10 bonus points for submitting a score (incentivizes participation).  
  - **Presenter**: Additional 50 base + 20 bonus points (as above).  
  - **Key Incentives**:  
    - Holders of winning asset want high comprehension scores.  
    - Holders of losing asset are indifferent (pays 0).  
    - Short-sellers (those who sold contracts) want *low* comprehension to profit.  

  ---

  ### **Timeline (75 Minutes Total)**
  | Time  | Activity                                                                 | Key Goals                                                                 |
  |-------|--------------------------------------------------------------------------|---------------------------------------------------------------------------|
  | 0-10  | **Intro (10 min)**: Explain policies (coffee vs. no coffee), welfare metric (comprehension scores), and trading rules. Assign Presenter role. | Clarify rules; avoid mentioning "futarchy."                              |
  | 10-30 | **Trading Phase (20 min)**: Students trade Assets A/B via sticky notes. Instructor updates prices every 2 min. | Experience information aggregation via markets.                          |
  | 30-35 | **Policy Selection (5 min)**: Compare final prices. Announce winning policy. Serve coffee if A wins. | Demonstrate market-based decision.                                       |
  | 35-50 | **Seminar (15 min)**: Teach neutral content (e.g., voting theory). Presenter sees prices, prepares summary. | Create reflexivity moment (Presenter reacts to prices).                  |
  | 50-55 | **Presenter Summary (5 min)** + **Comprehension Survey (5 min)**: Students privately score comprehension (0-10). | Test sabotage (students manipulate scores) and reflexivity (Presenter effort). |
  | 55-65 | **Settle Contracts (10 min)**: Calculate average score, resolve payoffs. | Link actions to outcomes; reveal incentives.                             |
  | 65-75 | **Debrief (10 min)**: Introduce "futarchy," dissect moments, and discuss flaws. | Connect experience to theory.                                            |

  ---

  ### **Debrief: Mapping Moments to Mechanisms**
  1. **Trading Phase (Information Aggregation)**:  
     - *Ask*: "Did the market price reflect your private belief about coffee’s impact better than a vote would?"  
     - *Point*: Markets aggregated dispersed signals (e.g., coffee crashes, alertness) into a public forecast.  

  2. **Policy Selection & Presenter Prep (Reflexivity Loop)**:  
     - *Ask Presenter*: "Did seeing a high market price make you try harder or less hard?"  
     - *Point*: The market price became a self-fulfilling/-defeating prophecy (e.g., high price → Presenter slacks → lowers comprehension).  

  3. **Comprehension Survey (Sabotage & Metric Gaming)**:  
     - *Ask*: "Did anyone report a false score to profit from trades?"  
     - *Point*: Short-sellers sabotaged the metric (e.g., reporting low scores to devalue winning asset).  

  4. **Structural Flaws**:  
     - **Reflexivity**: The market’s *causal estimate* (price) altered the behavior it predicted.  
     - **Sabotage**: Traders with "skin in the game" manipulated outcomes.  
     - **Metric Gaming**: Self-reports are corruptible.  

  ---

  ### **Predictable Problems & Fixes**
  - **Problem**: Trading is chaotic (novices, paper-based).  
    - *Fix*: Use 3 trading rounds (5 min each) with price updates; demo a practice round.  
  - **Problem**: Students ignore incentives (report honest scores).  
    - *Fix*: Anonymize comprehension surveys to reduce guilt; remind them payoffs depend on scores.  
  - **Problem**: Reflexivity is subtle (Presenter doesn’t react strongly).  
    - *Fix*: Privately instruct Presenter: "The market expects comprehension to be [price]. Prove them right/wrong!"  

  ---

  ### **Honest Limitation: What the Game Can’t Capture**
  - **Missing Element**: *Scale and complexity of real-world causal inference*.  
    - **Why**: In real futarchy, markets forecast policy impacts in systems with thousands of confounders (e.g., GDP, climate). The game’s "comprehension" metric is simplistic and instantly manipulable.  
  - **Discussion Bridge**:  
    - "In this game, you directly controlled the metric. But what if we used GDP? Could traders sabotage GDP? Could a public GDP forecast alter corporate investments?"  
    - Emphasize: Reflexivity is unavoidable when the forecast *itself* changes behavior.  

  ---

  ### **Materials Checklist**
  - Posters/whiteboards for asset order books.  
  - Sticky notes, pens, calculators.  
  - Coffee (if Policy A wins).  
  - Anonymous survey slips for comprehension scores.  
  - Role card for Presenter.  

  This design ensures students *feel* futarchy’s promise (information aggregation) and peril (reflexivity/sabotage) before labeling it, creating a visceral foundation for theoretical discussion.
