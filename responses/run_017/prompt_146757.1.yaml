  (2) Dream with philosophical education: you know about dream skepticism and reason correctly, but the dream gives a false verdict.
  (3) Shared dream: two people independently report the same dream with matching details.
  (4) Lucid dream: you know you're dreaming but don't know what's outside.
  (5) Morning-after: during the dream you had no doubt, only on waking do you reclassify it.
