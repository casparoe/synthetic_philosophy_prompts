prompt: |-
  Draft the joint statement that an endurantist and a perdurantist could both sign after a good-faith adversarial collaboration.

  Assume both parties are eternalists: past, present and future times, and their occupants, are all equally real, so nothing below should turn on presentism. Take the endurantist to hold that a persisting object is *wholly present* at each time at which it exists, that its being located at a time is primitive and not to be analyzed as its having a part there, and that the object is strictly identical across the times it occupies. Take the perdurantist to hold that a persisting object is a four-dimensional whole with a distinct temporal part at each time it occupies, and that *x* is *F* at *t* in virtue of *x*'s *t*-part being *F* simpliciter.

  Produce:

  1. A numbered section of agreed claims — about change, temporary properties, coincidence, fission, and about what an account of persistence is supposed to do. Each should be substantive enough that an outsider could imagine denying it; no platitudes.
  2. Each side's own position restated in wording that side accepts.
  3. A disagreements table: one row per residual disagreement, with columns for the endurantist's formulation, the perdurantist's formulation, the crux (the sub-question such that answering it would move at least one side), the case or argument both would accept as bearing on that crux, and each side's prediction about it, recorded in advance.
  4. A note on which parts of their old dispute were merely verbal, and what makes them verbal.

  Cruxes worth considering, though add or replace them as you see fit: whether *x* is *F* at *t* can be treated as primitive or must be analyzed; how much work the argument from temporary intrinsics can still do once the endurantist is allowed time-relative instantiation of properties; whether unrestricted composition over temporal parts overpopulates the world for the perdurantist; whether the analogy between being located at a time and being located at a place is load-bearing for the endurantist or merely heuristic.

  Two cases both parties have agreed in advance to treat as bearing on the cruxes:

  (A) Splicing. O exists from t1 to t5. A process removes O's t2–t3 segment and substitutes the corresponding segment of a qualitatively identical O*, transferring O's old segment into O*'s career; both careers then continue uninterrupted to t5, with no later evidence of the swap available to either object. Each side should say whether O survives, whether what continues is O or something new, and what would have to be true for that question to have a determinate answer.

  (B) A hypothetical successor physics. Suppose a future theory, as well confirmed as current relativity, restores a physically privileged global simultaneity — a distinguished cosmic-time slicing — while retaining relativity's other predictions. Each side should say in advance whether this helps, hurts, or leaves untouched its own case, and why; and if both say it makes no difference, say what that reveals about whether either view was ever drawing support from the structure of time.

  Do not cite, quote, or appeal to the literature or to what most philosophers think: the document has to argue everything from scratch, so that it stands up for a reader with no library. Aim for roughly a page and a half. Finish with a single last line consisting of Bottom line: followed by one sentence stating the disagreement that neither side would concede.
reasoning: |-
  We are drafting a joint statement from an endurantist and a perdurantist, both eternalists, after an adversarial collaboration. We need to produce:

  1. A numbered list of agreed claims (substantive, not platitudes).
  2. Each side's position restated in their own terms.
  3. A disagreements table with rows for each residual disagreement, including columns for:
     - Endurantist's formulation
     - Perdurantist's formulation
     - The crux (a sub-question that would move at least one side)
     - A case or argument both accept as bearing on that crux
     - Each side's prediction about that case/argument
  4. A note on which parts of the old dispute were merely verbal.

  We also have two cases (Splicing and the hypothetical physics) to address.

  We'll structure the document accordingly.

  ---

  **Joint Statement on Persistence: Endurance and Perdurance**

  **1. Agreed Claims**

  We, the endurantist and perdurantist, both eternalists, agree on the following substantive points:

  1. **Change**: An object can genuinely change by having incompatible properties at different times. For example, an object can be bent at one time and straight at another.
  2. **Temporary Properties**: The ascription of a property to an object must be relativized to a time. There are no unqualified monadic properties that an object has simpliciter and that change over time.
  3. **Coincidence**: In cases of apparent coincidence (e.g., a statue and the clay that constitutes it), there is a genuine metaphysical issue: either there are two objects in the same place at the same time, or there is one object that can be described in two ways. We agree that this requires an explanation and that the burden is on each theory to provide one.
  4. **Fission**: In fission cases (e.g., an amoeba splitting into two), the pre-fission object is not identical to both post-fission objects. Each theory must account for the fact that there is no single object that survives as both.
  5. **Account of Persistence**: A theory of persistence must explain how an object can be the same object over time despite changes in its properties and must account for the phenomena of change, coincidence, and fission without generating contradictions or intolerable ontological commitments.

  **2. Restatement of Positions**

  **Endurantist**: I hold that a persisting object is wholly present at each moment of its existence. At each time it occupies, the entire object exists at that time. The object is strictly identical across times. When we say that an object has a property at a time, this is a primitive temporal qualification of property instantiation. The object itself, being wholly present at each time, bears properties relative to times. The relation of being located at a time is primitive and not analyzable in terms of parts.

  **Perdurantist**: I hold that a persisting object is a four-dimensional space-time worm composed of temporal parts. At each time the object exists, there is a distinct temporal part of the object that exists at that time. The object persists by having different temporal parts at different times. When we say that an object has a property at a time, this is analyzed as the object's temporal part at that time having that property simpliciter.

  **3. Table of Residual Disagreements**

  | Crux | Endurantist's Formulation | Perdurantist's Formulation | Case/Argument Bearing on Crux | Endurantist's Prediction | Perdurantist's Prediction |
  |------|---------------------------|----------------------------|-------------------------------|--------------------------|---------------------------|
  | **Primitiveness of temporal instantiation** | The attribution of a property to an object at a time (e.g., "x is F at t") is a primitive relation that cannot be further analyzed. | The attribution of a property to an object at a time must be analyzed in terms of the properties of the object's temporal parts at that time. | **Case A (Splicing)**: If O survives the splicing, then the endurantist says O is wholly present at every time in its career, including after the swap. The perdurantist says that O is the entire four-dimensional worm, so if a segment is replaced, the resulting worm is not identical to the original. | **Endurantist**: O survives because the object is strictly identical over time, and the swap does not break the continuity of the whole object. The swap is a mere alteration of the object's parts. | **Perdurantist**: O does not survive because the worm that includes the substituted segment is not the same as the original worm. The object after the swap is a new worm composed of parts from two different objects. |
  | **Argument from temporary intrinsics** | The argument from temporary intrinsics (that objects cannot have incompatible intrinsic properties) is neutralized by the relativization of properties to times. | The argument from temporary intrinsics is not fully neutralized because the endurantist must take time-indexed properties as primitive, which is less explanatory than the perdurantist's account. | **Case B (Hypothetical physics)**: If a privileged simultaneity is restored, does it affect the force of the argument? | **Endurantist**: The restoration of a privileged simultaneity does not help the perdurantist because the relativization of properties to times is still required, and the endurantist account remains coherent. | **Perdurantist**: The restoration of a privileged simultaneity does not hurt my view because perdurance does not rely on the relativity of simultaneity. The argument from temporary intrinsics still shows that the endurantist must take time-relativization as primitive. |
  | **Unrestricted composition** | The perdurantist's unrestricted mereological composition of temporal parts leads to an overpopulated ontology (e.g., arbitrary temporal segments of objects). | Unrestricted composition is not overpopulating because it is ontologically neutral: it does not claim that every arbitrary temporal segment is an object of ordinary discourse, but it does provide a unified account of persistence. | **Case A (Splicing)**: The existence of the spliced segment as a temporal part in the perdurantist ontology. | **Endurantist**: The perdurantist must accept that the swapped segment is a distinct object, leading to an explosion of objects. | **Perdurantist**: The swapped segment is a temporal part, but that does not imply that we must count it as an ordinary object. The account is parsimonious in terms of fundamental ontology. |
  | **Spatio-temporal analogy** | The analogy between being located at a time and being located at a place is fundamental: just as an object is wholly present at each place it occupies, it is wholly present at each time. | The analogy is merely heuristic and breaks down because spatial parts are not temporal parts: spatial location does not require the object to have parts at different places in the same way that temporal location requires temporal parts. | **Case B (Hypothetical physics)**: If a privileged simultaneity is restored, does it make the endurantist's analogy stronger? | **Endurantist**: The restoration of a privileged simultaneity would strengthen the analogy by making time more like space, but even without it, the analogy holds. | **Perdurantist**: The restoration does not change the fundamental disanalogy: time is the dimension of change, and objects change by having temporal parts with different properties. |

  **4. Merely Verbal Disagreements**

  We agree that some of our past disagreements were merely verbal. Specifically:

  - When we say that an object "persists", we both mean that it exists at multiple times. The endurantist means that the very same object is present at each time, while the perdurantist means that the object has temporal parts at each of those times. This difference in meaning does not reflect a disagreement about the world but about how to use the term "same object". 

  - The dispute over whether an object is "wholly present" at a time is also verbal: the endurantist uses this to mean that the entire object is located at that time, while the perdurantist denies this because they hold that the object has parts at other times. But both agree that the object is located at that time and that it has a location at other times. The disagreement is about the nature of that location: whether it involves the whole object or a part.

  What makes these verbal is that once we clarify our terms, we see that we are not disagreeing about the facts (e.g., that the object is located at multiple times) but about the conceptual framework we use to describe those facts.

  ---

  **Bottom line:** The core disagreement that remains is whether the strict identity of an object across time requires that the object be wholly present at each time (endurantism) or whether it can be accounted for by the mereological sum of temporal parts (perdurantism).
answer: |-
  **Joint Statement on Persistence: Endurance and Perdurance**  
  *After Adversarial Collaboration Between Endurantist and Perdurantist*  

  ### 1. Agreed Claims  
  We concur on the following substantive theses:  
  1. **Change**: An object can genuinely undergo qualitative alteration (e.g., from bent to straight) without implying contradiction, provided properties are indexed to times.  
  2. **Temporary Properties**: Property instantiation is inherently time-relative (e.g., "x is bent at t₁" is fundamental). Neither side reduces this to timeless facts.  
  3. **Coincidence**: In cases like a statue and its constituent clay occupying the same space at the same time, exactly one object is present. Denying this invites paradox (e.g., distinct objects with identical parts).  
  4. **Fission**: In symmetric fission (e.g., an amoeba dividing), the pre-fission entity cannot be identical to both post-fission entities. Any account of persistence must explain why identity is transitive and exclusive.  
  5. **Theory Aims**: A persistence theory must (a) resolve the "paradox of change" (incompatible properties over time), (b) avoid ontological profligacy in coincidence/fission, and (c) ground our judgments of diachronic sameness without circularity.  

  ### 2. Restated Positions  
  **Endurantist**: A persisting object is *strictly identical* at each time it exists. It is *wholly present* at every moment: no part is absent from any time it occupies. Location at a time is primitive—not analyzable via parthood. Temporal variation in properties is irreducible but unproblematic (e.g., "x-at-t₁ is bent" is basic).  
  **Perdurantist**: A persisting object is a four-dimensional aggregate of distinct temporal parts (e.g., x-at-t₁, x-at-t₂). It persists by having different parts at different times. Property instantiation at t is derivative: "x is F at t" means "x’s t-part is F simpliciter."  

  ### 3. Disagreements Table  
  | Crux                                                                                                | Endurantist’s Formulation                                                                  | Perdurantist’s Formulation                                                                 | Case/Argument Bearing on Crux | Endurantist’s Prediction                                                                 | Perdurantist’s Prediction                                                                |  
  |-----------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------|--------------------------------|------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------|  
  | **Must temporal property instantiation be primitive?**                                              | Yes: "x is F at t" is unanalyzable; analyzing it via parts denies strict identity over time. | No: Primitive temporal indexing obscures how properties inhere in concrete parts of the world. | **Case A: Splicing**           | O survives: Strict identity ensures continuity despite part-replacement. Determinacy requires causal/qualitative continuity, not mereological. | O does not survive: The post-splice entity is a new aggregate. Determinacy requires uninterrupted mereological continuity. |  
  | **Does the argument from temporary intrinsics retain force?**                                       | Neutralized: Time-relativized properties resolve incompatibility; no further work is needed. | Retains force: Endurance’s primitive indexing is ad hoc; perdurance explains variation via part-properties. | **Case B: Hypothetical Physics** | No difference: Relativity’s structure was never relevant; time-indexing works in any temporal framework. | No difference: Perdurance explains change via parts regardless of time’s structure. Shared irrelevance shows time-indexing is avoidable. |  
  | **Does unrestricted composition over temporal parts overpopulate?**                                 | Yes: Accepting arbitrary slices (e.g., O’s t₂–t₃ segment) multiplies entities beyond necessity. | No: Composition is ontologically innocent; overpopulation concerns confuse quantification with ideology. | **Case A: Splicing**           | Overpopulation evident: The swapped segment is a distinct object, yet no empirical difference justifies it. | No overpopulation: Segments exist, but are not "objects" in the endurantist’s sense; ideology is economical. |  
  | **Is the time/space analogy load-bearing for endurance?**                                           | Essential: Location at a time parallels location at a place—wholly present in both cases. | Misleading: Spatial parthood differs from temporal parthood; only the latter explains change. | **Case B: Hypothetical Physics** | Helps slightly: Privileged time reinforces the analogy, but endurance never relied on relativity. | Hurts slightly: Privileged time might blur spatial/temporal distinctions, but parts remain indispensable for change. |  

  ### 4. Merely Verbal Disagreements  
  We agree the following disputes were verbal:  
  - "Is O *wholly present* at t?" The endurantist uses this to mean O lacks temporal parts at t; the perdurantist denies it because they interpret "wholly" as excluding *any* parts beyond t. The term "wholly" is equivocal: both agree O is located at t, but partisans mean different things by "located."  
  - "Does O *persist*?" Both agree O exists at multiple times, but the endurantist takes this to entail strict identity, while the perdurantist takes it to entail mereological continuity. The disagreement traces to divergent definitions of "persist," not facts.  
  These are verbal because clarifying terminology reveals agreement on the underlying reality (e.g., O occupies t₁ and t₂) but not on how to describe its mode of occupation.  

  **Bottom line:** The endurantist holds persistence requires strict identity without temporal parts; the perdurantist holds it requires temporal parts without strict identity.
