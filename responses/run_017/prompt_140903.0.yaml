prompt: |-
  Working on something on the demandingness objection and I need a case built to order, because every time I try to write one myself it either turns into a pond/trolley thing or the objection sneaks in as a premise.

  What I want: a case where what act consequentialism demands of one person doesn't arrive as one big ask but ratchets. She complies with the first demand, and complying is exactly what makes the next, bigger one land on her. And the complaint should be about that structure rather than about the size of any single sacrifice — every individual sacrifice in the story, asked once as a one-off, should be one she'd have no real grievance about. The objection has to come from there being no point at which she can reasonably take herself to be done.

  Constraints on the scenario:

  - Realistic: a clinic, a school, an office, a family. One paragraph. No ponds, no trolleys, no one-off rescues, and no villain engineering her situation. The escalation has to fall out of her circumstances as they actually change.
  - Block the standard self-limiting reply. The usual reason people say consequentialism isn't really all that demanding is that the demands converge: as she gives more, the next unit costs her more and buys less. So build the case so the returns to her sacrifice go UP as she gives more — her compliance has to make her more effective, not less. Real mechanisms only, and the sort that are common rather than a lucky coincidence: credibility, trust, matching money, a threshold that unlocks other people's funding, skills she only has because she's been at it for years. Constant or increasing returns; no diminishing-marginal-utility escape hatch.
  - No contested empirical claims about how much good a given donation does, and the story can't turn on anyone being deceived or on her contribution making no difference. Stipulate the payoffs and let them be what they are.
  - She isn't a moral-saint type who signed up for this in advance, and nothing is ruinous in a single step. It's the accumulation that hurts, and there's a real personal cost an outside observer would take seriously.
  - The verdicts have to fall out of the theories, not get written into the story.

  Then the part I actually need help with:

  1. Run the case through three or four rounds. At each round, what does act consequentialism require of her and why.
  2. Test the escape hatches: a satisficing threshold, an agent-centred prerogative / personal-projects carve-out, and a rule-consequentialist code. Does each one actually stop the ratchet here, or does it stop it by drawing a line that's arbitrary given this case? My suspicion is that the third one changes the subject to what a code for everyone could demand, which is a seperate question from what she should do. Tell me if that's wrong.
  3. Name the single feature of the case doing the real work. If that feature were removed, would it collapse back into a plain-vanilla demandingness case, and if so which one?
  4. Give me the best available consequentialist reply — the steelman version, not just "she could decline."

  This is going into a paper, so I care more about whether the case actually does the job than about how tidy it sounds. Tell me how confident you are in each bit and flag the point you're least sure of — in particular whether the ratchet is a genuinely distinct objection or just the old one with extra steps.
reasoning: |-
  Okay, the user is working on the demandingness objection to consequentialism and needs a custom-built case. Let me start by understanding their requirements. They want a scenario where demands escalate incrementally, each step reasonable on its own, but cumulatively overwhelming. Key constraints: realistic setting, no villains or one-off rescues, increasing returns on sacrifice, no empirical disputes about payoffs, and a relatable protagonist facing genuine personal costs.

  First, I need to create the scenario. A clinic setting makes sense—something like a community health center. The protagonist, Ana, starts as a volunteer. Each step of her involvement leads to more demands: first time, then skills, then personal resources. The ratcheting effect comes from her prior compliance making her more effective. For example, gaining trust leads to more responsibilities, and leveraging her skills increases the impact but also the demands.

  Next, I'll outline the rounds. First, she volunteers weekly, which is manageable. Then, she takes on training due to her reliability, costing her weekends. Third, she invests personal funds to unlock grants, which strains her finances but is justified by the larger payoff. Fourth, she's asked to relocate, amplifying her impact but sacrificing personal life. Each step is individually reasonable but builds up.

  Now, testing escape hatches. Satisficing might cap demands at 20%, but in this case, the next step (relocation) exceeds that threshold. Is 20% arbitrary? Probably, since the payoffs increase, making higher sacrifices more efficient. Agent-centered prerogatives allow personal projects, but Ana's clinic work becomes her main project, so the prerogative doesn't protect her. Rule consequentialism might endorse moderate rules, but Ana's situation shows that optimal rules could still demand a lot if exceptions maximize good. However, collective rules might not force relocation, offering some protection.

  The key feature is increasing marginal returns. Without it, diminishing returns would naturally limit demands. Here, each sacrifice boosts effectiveness, perpetuating the cycle. The consequentialist steelman could argue that refusing the next step wastes past investments, creating a sunk cost fallacy. But Ana must balance personal sustainability against cumulative costs.

  I need to ensure the case avoids common pitfalls. No trolleys or ponds. The escalation arises organically from her circumstances. Each sacrifice is non-ruinous alone. The complaint is the endless accumulation, not any single demand. Also, blocking the diminishing returns argument by having her effectiveness grow—trust, skills, funding thresholds.

  Confidence check: The increasing returns mechanism feels solid with real-world analogs. However, ensuring the relocation demand feels necessary and not forced might be tricky. Also, the rule consequentialism part is nuanced—does it change the subject? Yes, but it might still impose high demands if the optimal code requires significant sacrifice. Highlighting that collective rules differ from individual actions addresses the user's suspicion.

  Finally, the steelman reply: Ana should recognize sustainability matters long-term. But conceding this might validate the objection if the system inherently prevents sustainability. The sunk costs point is strong but the ratchet's structural issue remains. This shows the objection's distinctness from single-demand cases.
answer: |-
  Here’s a purpose-built case addressing your specifications, designed to isolate the structural ratcheting objection. I’ll break it down as requested.

  ### The Case: Ana and the Community Clinic
  Ana volunteers 4 hours/week at a struggling community health clinic in her low-income neighborhood. Her Spanish fluency helps serve the predominantly Latino population. Her reliable service builds deep trust with patients and staff. When the clinic’s sole bilingual health educator quits suddenly, the director (knowing Ana’s rapport and competence) asks her to take a paid part-time role (10 hrs/week) to run essential diabetes workshops. Ana accepts. Her workshops prove highly effective, reducing ER visits. Funders notice. A grant opportunity arises to massively expand services but requires a $5,000 "community commitment" match. Ana, now deeply invested and uniquely positioned to leverage this grant (which her workshops’ success data helped secure), liquidates her modest savings to meet the match. The expansion succeeds, making the clinic a regional model. A major donor offers transformative funding *if* the clinic hires a full-time Program Director to replicate the model elsewhere. The board, citing Ana’s irreplaceable trust, proven impact, and unique understanding of the program, offers her the role. It requires 60+ hrs/week and relocation to a rural satellite clinic for 2 years. Accepting would maximize the grant's impact, but it would derail Ana’s career plans, strain her relationship, and isolate her from her support network.

  **Realism Check:** Clinics, volunteer escalation, matching grants, trust-based promotions, and relocation demands for critical staff are common. No villains, one-off rescues, or ponds. Payoffs are stipulated. Escalation arises from Ana’s effectiveness *caused* by prior compliance. Each step builds capability/opportunity.

  ---

  **1. Act Consequentialism (AC) Requirements Through Rounds:**

  *   **Round 1 (Volunteer 4 hrs/week):** AC requires it. Low personal cost (4 hrs), high marginal good due to language skills. Reasonable demand.
  *   **Round 2 (Accept Part-Time Role, 10 hrs/week):** AC requires it. Increased cost (10 hrs, some weekends), but *higher* marginal good: her unique trust/competence makes her far more effective in this role than a new hire would be. The workshops directly prevent harm. Cost is still moderate.
  *   **Round 3 (Donate $5,000 Savings):** AC requires it. Significant personal cost (lost savings, security), but the marginal good is *enormous*: her $5,000 unlocks a large grant (say, $200,000) *only because* her specific work made the clinic eligible and credible. The payoff per dollar sacrificed is vastly higher here than donating $5k anonymously elsewhere. Still, a significant but non-ruinous one-off sacrifice.
  *   **Round 4 (Accept Director Role & Relocate):** AC requires it. Very high personal cost (time, relocation, career/relationship strain), but the marginal good is *maximal*: her unique history, trust, and understanding make her the *only* person who can effectively leverage the major grant to replicate proven, life-saving programs. Rejecting likely means the grant is scaled back or fails. Payoff per unit of sacrifice is extremely high due to her irreplaceability.

  **Why AC Demands Each Step:** At each stage, the *alternative action* (declining) produces less good. Her prior compliance created her unique effectiveness/position (trust, proven results, program knowledge), making the *next* sacrifice uniquely impactful. Declining at Rounds 2-4 wastes the potential generated by prior sacrifices. AC sees only the net good difference between options *now*, given *current* realities she helped create.

  ---

  **2. Testing Escape Hatches:**

  *   **Satisficing Consequentialism (e.g., "Do enough good"):**
      *   **Does it stop the ratchet?** **Unlikely.** What's the threshold? If set at "20% of income/time," she clears Rounds 1-3 easily. Round 4 (full-time+ relocation) likely exceeds any moderate threshold. If the threshold is set lower to avoid Round 4, it becomes arbitrary *given the escalating payoffs*. Why is *this* the point to stop, when the next unit of sacrifice buys *more* good than any prior unit? Satisficing struggles with increasing returns; the point of maximum efficiency might lie *beyond* a seemingly "good enough" sacrifice level.

  *   **Agent-Centred Prerogative (ACP - e.g., Scheffler, allows agent to favour self somewhat):**
      *   **Does it stop the ratchet?** **Possibly, but weakly/arbitrarily.** ACP grants Ana a "multiplier" (e.g., she can give her own interests 2x weight). Rounds 1-3 likely still required (costs low/moderate, benefits high). Round 4's massive cost *might* tip the balance if self-interest is weighted heavily enough. But how much weight is justified? If the multiplier is too small, Round 4 still required. If large enough to stop Round 4, why wasn't it large enough to stop Round 3? The *structure* of escalating demands makes the ACP line feel arbitrary precisely when the demands peak. The prerogative doesn't inherently protect against cumulative erosion, only against single large costs relative to benefits.

  *   **Rule Consequentialism (RC - Follow rules whose general adoption maximizes good):**
      *   **Does it stop the ratchet?** **Likely yes, but arguably changes the subject.** An optimal RC code would likely include rules like: "Donate a significant but sustainable portion of income (e.g., 10-20%)", "Volunteer reasonably but not to self-harm", "Don't routinely sacrifice core relationships/careers for work". Ana likely violates such rules by Round 4 (possibly Round 3). RC *would* stop the ratchet *for Ana* by prohibiting such extreme steps.
      *   **Is it arbitrary?** The rules themselves aren't arbitrary *for the code* – they aim for sustainable societal good. **Your suspicion is largely correct:** It *does* change the subject. The question shifts from "What should *Ana* do *now* to max good?" to "What rule, if followed by *everyone*, would yield the best results?" RC might forbid Ana's sacrifice precisely *because* a rule allowing such demands *on everyone* would be disastrous (burnout, resentment, worse overall). This protects Ana, but the *justification* is about systemic effects, not the structure of demands placed *on her as an individual* facing unique escalating payoffs. AC's demand on Ana is still correct *given her specific situation*, even if RC forbids her acting on it. The objection from the *individual's* perspective under AC remains potent.

  ---

  **3. The Single Key Feature & Collapse Point:**

  *   **Key Feature:** **Increasing Marginal Returns to Sacrifice (IMRS).** Each act of compliance *significantly increases the marginal good* achievable by Ana's *next* unit of sacrifice (due to gained trust, credibility, unique skills, unlocking thresholds). This overcomes the "diminishing returns" defense.
  *   **If Removed:** If we introduce diminishing returns (e.g., her 10th hour volunteering is less impactful than her 1st; extra money donated has lower impact; someone else could do the director role nearly as well), the ratchet stalls naturally. The case collapses into a standard demandingness case (e.g., Singer's Pond: one big, potentially excessive demand justified by high absolute good, but no structural escalation). IMRS is what *drives* the escalation and makes each new demand uniquely compelling *because* of prior compliance.

  ---

  **4. Consequentialist Steelman Reply:**

  "The most compelling consequentialist reply isn't 'she could decline,' but **'sustainability matters.'** While each individual step maximizes expected good *at that moment*, AC must consider *long-term* agent effectiveness and the *systemic* risk of burnout. Forcing Ana to accept Round 4, while yielding immense short-term good, risks catastrophic failure (burnout, quitting, worse outcomes later) or deterring others from starting similar paths. True optimization requires factoring in the *probability of future compliance capacity*. A sophisticated AC calculation *might* justify declining Round 4 *if* the risk of Ana becoming ineffective or causing systemic harm (by exemplifying unsustainable demands) outweighs the immediate good of acceptance. The 'sunk cost' of prior sacrifices shouldn't compel ruinous future ones if they jeopardize the agent's long-term good-producing potential. Ana isn't fungible; her sustainability is part of the good-maximizing equation."

  *   **Strength of Reply:** This is the strongest AC counter. It directly addresses the accumulation. It leverages consequentialist reasoning (long-term/systemic effects).
  *   **Weakness/Vulnerability:** 1. **Empirical Uncertainty:** Quantifying burnout risk vs. guaranteed immediate good is messy. AC often demands the *known* high payoff. 2. **The Ratchet's Bite:** This reply *concedes* that without sustainability concerns, AC *would* demand the escalating sacrifices. It validates the *structure* of the objection as distinct – the problem *is* the open-endedness and accumulation enabled by IMRS. 3. **Demand Shift:** It might simply shift the demand to "sacrifice up to the point *just before* burnout," which is still potentially very high and difficult to define.

  ---

  **Confidence Assessment & Distinctiveness:**

  *   **Confidence:**
      *   **Case Construction (IMRS):** High. Mechanisms (trust, thresholds, irreplaceability) are realistic and directly cause escalating payoffs.
      *   **AC Rounds Analysis:** High. Clearly follows from AC's situational focus.
      *   **Escape Hatches:** High for Satisficing/ACP weaknesses. Medium-High for RC (it stops it but changes subject - confident in this analysis).
      *   **Key Feature (IMRS):** Very High. This is the core innovation and necessary condition.
      *   **Steelman Reply:** Medium. It's the best reply, but its empirical uncertainty and concession on structure are weaknesses.
      *   **Least Confident Point:** Whether the **sustainability reply** definitively resolves the objection *for the agent experiencing the ratchet*. It feels like AC acknowledging a practical limit rather than solving the *moral* demand of the structure. The ratchet might just slow, not stop.
  *   **Distinctiveness:** **Yes, genuinely distinct.** A plain demandingness objection focuses on a *single* large sacrifice ("Give all your money," "Jump in the pond"). This case focuses on the **structural trap created by increasing returns**: complying with reasonable demands *creates a situation* where refusing the next, larger demand wastes prior sacrifices and forgoes even greater good. The complaint is about the **inescapable trajectory and lack of completion**, not just the size of any one ask. It shows how AC can demand a *life path* of escalating sacrifice that no individual demand, viewed in isolation, would justify refusing. The "with extra steps" *is the point* – the steps are causally linked by increasing returns, creating a unique form of demandingness.
