prompt: |-
  Hey, I’m teaching a 75-minute undergrad ethics seminar on supererogation, 18 students, and I want one concrete in-class activity — not a menu of options. Please commit to a single game/simulation with small real stakes (no money, just points/privileges) that makes them feel the force of threshold supererogation: an act that is individually supererogatory (not required of any given person, so omitting it isn’t blameworthy and earns no penalty) but collectively necessary, because if too few people do it some bad outcome happens. Each student recieves a role card with required duties and optional helping actions; required omissions get a blame marker and lose a small privilege, optional omissions get nothing, while doing an optional act earns praise but no token reward. Set the numbers and incentives so the required duties alone are insufficient to avert the bad outcome, and enough optional acts are needed to avert it. The idea should show up in the incentives/roles, not in me explaining it up front; they should only hear the term threshold supererogation in the debrief. The debrief needs to map specific moments onto (i) why the omission truly isn’t blameworthy, (ii) why it still feels blameworthy when the acts are collectively needed, and (iii) what this suggests about the stability of the duty/supererogation distinction. Also tell me what will predictably go wrong the first time I run it — e.g., students just treating optional acts as duties, or the threshold being set wrong — how to handle it, and be honest about which feature of real supererogation the game can’t reproduce and that I’ll have to supply in discussion. Give reasons for your design choices and definately pick one, not a menu. Thanks!
reasoning: |-
  Okay, the user is teaching an undergrad ethics seminar on supererogation and needs a concrete in-class activity. They want a simulation with real stakes but no money, just points or privileges. The key is threshold supererogation: acts that aren't required individually but are collectively necessary. If too few people do them, a bad outcome happens. 

  First, I need to design an activity where students have role cards with required duties and optional helping actions. Required omissions should get blame markers and lose privileges, while optional omissions have no penalty. Doing the optional act earns praise but no tangible reward. The setup should make required duties insufficient to prevent the bad outcome, so optional acts are crucial. The term "threshold supererogation" shouldn't be mentioned until debrief.

  The user's explicit needs are clear: a single activity, not a menu. But deeper needs might include ensuring students emotionally grasp the tension between individual non-blameworthiness and collective necessity. They probably want students to experience the frustration when the group fails despite no one being individually at fault. Also, the debrief needs to connect game mechanics to ethical concepts.

  I recall scenarios like disaster relief coordination or public goods games. Maybe a campus event setup? Say, preparing for a "Campus Unity Day." Roles could include Event Planner, Catering Liaison, etc. Each has core duties (required) and optional help tasks. Required tasks alone can't meet the success threshold—optional acts are needed. 

  Setting the numbers: 18 students. Say, 12 have optional tasks. The threshold could be 7 out of 12 optional acts needed. Required tasks are set so only 6 are critical, but 10 are needed for success, so optional acts bridge the gap. 

  Stakes: Losing a privilege like 5 minutes early dismissal. Blame markers for missing required duties. Praise for optional acts but no reward. The bad outcome is the event failing, which means no early dismissal for anyone.

  Potential issues: Students might treat optional acts as mandatory. To counter this, emphasize that optional acts earn praise but no penalty if omitted. Also, the threshold might be miscalculated. Testing with different numbers beforehand is crucial. Another problem could be coordination—students not realizing the collective need. Avoid explaining; let them figure it out.

  What can't the game replicate? Real supererogation involves moral motivation, but here, the praise is symbolic. In debrief, highlight that real supererogation lacks even praise, making it harder. Also, discuss how societal expectations can blur the duty/supererogation line.

  Design reasons: Campus scenario is relatable. Roles ensure varied responsibilities. The threshold is set so failure is possible but not guaranteed. Privileges like early dismissal are low-stakes but motivating. Debrief questions target the key ethical tensions. 

  Predictable problems: Over-compliance with optional acts due to peer pressure. Solution: Remind during setup that optional acts won't be penalized. If most do them, discuss in debrief why they felt pressured. Under-compliance might happen if students are strategic; debrief the feeling of frustration when close to threshold but failing.

  Need to ensure the activity fits 75 minutes: Setup (10 mins), game (20-25), debrief (30-40). Role cards must be clear. Materials: cards, whiteboard for tracking. 

  Finally, debrief mapping: (i) No blame for omitting optional—no penalty, praise given only for doing. (ii) Collective blame feels intuitive because the group suffers. (iii) Stability issue: when enough people omit, it feels like a duty, showing how context can shift perceptions.
answer: |-
  Here's a single, concrete activity designed for your exact specifications: **"The Campus Unity Day Crisis."**

  **Core Setup:**
  *   **Scenario:** Students are volunteers organizing a critical "Campus Unity Day" event. If successful, the *entire class* earns a **5-minute early dismissal privilege** for the next session. Failure means no early dismissal.
  *   **Roles:** 18 unique role cards (e.g., Event Planner, Catering Liaison, Volunteer Coordinator, Publicity Lead, Safety Officer, Decorations Lead, Speaker Liaison, Tech Support, Registration Manager, etc.). *Each card has:*
      *   **2 Required Duties:** Specific, essential tasks tied directly to their role (e.g., "Secure room reservation by 10 AM," "Confirm food vendor contract," "Print 50 copies of the schedule").
      *   **1 Optional Helping Action:** A task outside their core duties that benefits the collective success (e.g., "Stay 15 mins late to help clean up," "Call 3 extra volunteers for setup," "Donate $1 (fake) for extra decorations," "Proofread another team's flyer").
  *   **Mechanics:**
      *   **Required Duties:** Failure to complete *both* required duties earns a **Blame Marker (red sticker)** and loses the individual the early dismissal privilege *even if the overall event succeeds*. (Penalty for negligence).
      *   **Optional Helping Actions:** Completing the optional action earns **Public Praise** (verbal acknowledgment by you, e.g., "Good initiative, [Name]!") but *no tangible reward*. Omitting it has *no penalty* and *no comment*.
      *   **Success Threshold:** The event succeeds *only if*:
          1.  **All 18 students complete BOTH of their Required Duties.** (Ensures basic functionality).
          2.  **At least 7 students complete their Optional Helping Action.** (The supererogatory threshold).

  **In-Class Flow (75-min breakdown):**

  1.  **Setup (10 mins):** Distribute role cards secretly. Explain the scenario, the *individual* consequences for required duties (Blame Marker + loss of privilege), and the *collective* reward (early dismissal for all). Emphasize: "Your card lists tasks you MUST do (Required Duties) and ONE extra thing you COULD choose to do (Optional Helping Action) to help the event. Doing the optional action will get you praise. *Not* doing it has no penalty." **Crucially, DO NOT mention the 7-person threshold or that required duties alone are insufficient.**
  2.  **"Action Phase" (20 mins):** Students circulate. Their goal is to verbally *declare completion* of their tasks *to you* at designated "Check-in Stations" (e.g., 3 stations around the room). They report secretly at a station:
      *   "I completed both Required Duties for [Role]." (You note it).
      *   "I also completed my Optional Helping Action: [Action]." OR "I did not complete my Optional Helping Action." (You note it; Praise verbally *only* if they did it).
      *   **Maintain Secrecy:** Students shouldn't know others' choices until the reveal.
  3.  **Reveal & Outcome (10 mins):** Tally publicly on the board:
      *   List roles/completion of Required Duties. Assign Blame Markers/note privilege loss for *any* missing required duty.
      *   Count the number of completed Optional Actions. Announce if it meets or exceeds 7.
      *   Announce the event outcome (Success/Failure) based on *both* criteria. Award the collective early dismissal privilege *only* if both thresholds are met.
  4.  **Debrief (35 mins):** This is where the learning happens. Introduce the term "Threshold Supererogation" here.
      *   **(i) Why omission isn't blameworthy:** Point to the mechanics. "Look at [Student X] who omitted the optional action. Did they get a Blame Marker? Lose their privilege? No. The design *explicitly* said omission carried no penalty. We praised doers, but didn't punish non-doers. Individually, omitting was permissible. No one *owed* that extra action as a duty." Link to definitions of supererogation.
      *   **(ii) Why it *feels* blameworthy collectively:** Focus on the failed scenario. "Even though no single person who omitted was blameworthy, the event failed because not enough chose to do the optional act. How did that *feel*? Did anyone feel frustrated with those who didn't do the optional act, even knowing they weren't *required*? Why?" Highlight the tension: the collective need creates social/moral pressure that *feels* like blame, even if individual blame isn't logically justified. Discuss resentment, "free-riding" feelings.
      *   **(iii) Stability of the distinction:** "In this game, the line between 'duty' (required) and 'supererogatory' (optional) was clear-cut by design. But what happens in the real world? When we *know* a collective outcome depends on enough people doing something 'extra' (like donating blood in a disaster, reducing carbon footprint), does the 'optional' label hold? Does social pressure effectively *turn* it into a duty? Does the distinction become unstable when we realize how crucial the collective action is?" Connect to ethical debates about whether true supererogation can exist under such thresholds.

  **Predictable Problems & Handling:**

  1.  **Problem: Over-Compliance (Treating Optional as Duty):** *Why it happens:* Students are cooperative, want to "win," fear social judgment, or misunderstand. *Handling:* **Stick to the rules.** If they do the optional act, praise them but offer no tangible reward. If they ask "Should I do the optional?" reply "That's entirely your choice; there is no penalty if you don't, but you will receive praise if you do." In debrief, highlight this behavior as evidence of the social pressure blurring the line (point iii).
  2.  **Problem: Threshold Set Wrong / Coordination Failure:** *Why it happens:* With 18 students and a threshold of 7 optional acts, it's *likely* but not guaranteed to fail. It *could* accidentally succeed if too many comply. *Handling:* **Embrace either outcome.** A success lets you discuss: "We succeeded! But did anyone who *didn't* do the optional act feel guilty anyway, knowing others 'carried' them? Does success hide the underlying tension?" A failure is more dramatic for points (ii) and (iii). **Crucial:** The *potential* for failure due to the optional threshold is the key, not guaranteed failure.
  3.  **Problem: Confusion about Reporting:** *Why it happens:* Secret reporting is unfamiliar. *Handling:* Give crystal clear instructions. Use multiple stations. Have a clear checklist to mark completions. Walk around to assist.
  4.  **Problem: Lack of Investment:** *Why it happens:* Stakes seem low. *Handling:* Emphasize the early dismissal privilege genuinely ("Use it to grab coffee, avoid a crowd"). The Blame Marker (a physical red sticker) creates mild social stigma. Your tone during Praise/Blame assignment matters – be neutral but clear.

  **What the Game CAN'T Reproduce (Need in Debrief):**

  *   **The *Intrinsic Moral Motivation* of Real Supererogation:** In the game, the *only* incentive for the optional act is *Praise* (extrinsic social reward). Real supererogation often stems from intrinsic motivation: genuine altruism, compassion, a sense of nobility. The game risks making "supererogatory" acts seem like a strategy for social approval. **How to supply it:** Explicitly discuss this in the debrief: "In the game, your 'optional' choice was motivated by praise or helping the group win. But real supererogation, like rushing into a burning building, is often driven by internal values, not external rewards. The game simplifies motivation to show the structural dilemma of collective need vs. individual non-requirement, but real acts involve deeper moral character." Contrast game incentives with classic examples (saints, heroes).

  **Why This Design Works:**

  1.  **Concrete Stakes:** Blame Markers (stigma), lost privilege (individual cost), early dismissal (collective reward) are tangible but non-monetary.
  2.  **Threshold Mechanics Embedded:** Required duties are insufficient (need all 18) *and* the optional acts are collectively necessary (need 7+). This is built into the success conditions, not explained.
  3.  **Clear Distinction in Rules:** Required (penalty for omission) vs. Optional (praise for commission, *nothing* for omission) is mechanically unambiguous.
  4.  **Role Cards:** Create investment, distribute the optional actions naturally, and prevent it being a simple coordination game (they have specific "jobs").
  5.  **Predictable Tension:** The setup reliably generates the core experience: individuals can omit optional acts blamelessly, yet the group can fail, creating the feeling of collective blameworthiness.
  6.  **Debrief Maps Directly:** The game mechanics provide concrete examples for each debrief point (i, ii, iii). The praise mechanism directly illustrates the social reinforcement often attached to supererogation.

  **Materials Needed:** 18 Role Cards (pre-written), Red Stickers (Blame Markers), Whiteboard/Flip Chart for Tally, List for tracking completions at stations. Commit to this design – it hits all your requirements and creates the necessary experiential learning for threshold supererogation. Good luck!
