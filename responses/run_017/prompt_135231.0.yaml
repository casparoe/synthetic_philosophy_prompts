  First, I need to structure the proposal clearly. The core question should challenge the standard three-currency framework by showing how conversion and currency choices are intertwined. The counterfactual conversion function idea seems central but might blur with capabilities. I should present it as a distinct approach that isolates preference formation from deprivation. For economists, emphasizing institutional impacts could make it tangible.

  The temporal unit issue is another key point. Highlighting Ana and Ben's example shows that averaging over time masks inequalities. The proposal must argue that temporal scope is a separate axis, affecting policy design like unemployment benefits versus lifetime taxes. This dual-focus structure could appeal to both disciplines.

  The user mentioned avoiding literature reviews, so descriptions of positions should use placeholders like "Resource Theorist X." The method section needs realism: three chapters plus a paper. Chapter order should start with diagnosing the collapse, then temporal units, then the synthesis. Practical deliverable: a decision tree for policymakers, addressing their need for actionable guidance.

  Failure conditions are crucial. If the currency/conversion link doesn't hold, the fallback could be temporal analysis alone. Economists might appreciate this pivot as still policy-relevant. Also, specifying mid-year checkpoints (e.g., no examples of separable conversion) adds rigor.

  The user's anxiety about circularity suggests they need a clear scaffold. Emphasizing "determinate answer" in the question tackles that. Their unspoken need might be confidence in originality—positioning their collapse thesis as novel yet grounded. Reassuring them that the counterfactual isn't just repackaged capabilities by stressing institutional neutrality could help.

  Finally, balancing depth and feasibility. Twelve months is tight, so prioritizing chapters and admitting potential cuts (like detailed counterfactual mechanics) shows planning. The standalone paper on temporal units offers a publishable backup, addressing committee expectations for output.
answer: |-
  Here’s a draft proposal structured to meet your requirements—designed to force a debate, preempt committee skepticism, and deliver concrete outputs. Argue with every word:

  ---

  **Project Title:** Unbundling Equality’s Currency: Conversion Functions and Temporal Scales in Distributive Justice  

  **Core Question:**  
  Can we resolve persistent disputes about the "currency" of egalitarian justice (welfare, resources, capabilities) by showing they conceal two prior, independent choices: (1) **how individual conversion functions are specified**, and (2) **the temporal unit over which equality is measured**?  

  **The Problem: Why Standard Currencies Don’t Settle the Debate**  
  The standard tripartite framework presents an insoluble stalemate because each "currency" relies on an unacknowledged **conversion function** that does the real normative work:  
  - **Resource Views** claim neutrality ("equal bundles, conversion is personal") but implicitly endorse *market-driven* conversion (e.g., valuing resources by exchange value). This fails when market prices reflect historical injustice or bargaining imbalances.  
  - **Capability Views** equalize opportunities for functionings but must define *which functionings matter* and *at what threshold*. This isn’t a currency specification—it’s a conversion rule masquerading as a currency ("Can achieve X if Y").  
  - **Welfare Views** (objective/subjective) are defined *by* their conversion function: e.g., "well-being = preference satisfaction." But this collapses when preferences adapt to deprivation (the serf reports high satisfaction), revealing that the core commitment is to a *counterfactual* conversion rule ("preferences they *would* have without oppression").  

  **Thesis:**  
  The "currency" debate is illusory. What matters are two separable choices:  
  1. **The Conversion Rule**: How inputs (resources, institutional context) convert to an individual advantage metric.  
  2. **The Temporal Scale**: Whether we equalize advantage at a moment, over a life stage, or across a whole life.  
  *Neither choice is determined by selecting a "currency."* We can be welfarists *and* synchronic egalitarians, or resourcists *and* whole-life egalitarians.  

  **Proposed Approach: Isolating the Variables**  
  I will develop a **counterfactual conversion function** as a test case: *Individual advantage is measured by the conversion function an agent would exhibit under just institutions and adequate opportunity, holding only reflectively endorsed preferences*. This is **not** capabilities in disguise:  
  - It targets the *process* of preference formation, not a list of functionings.  
  - It is *compatible* with resourcism (if counterfactual markets are just) or welfare (if preferences are idealized).  
  - It *exposes* the circularity of "just institutions" by making it a variable—we can model different institutional assumptions and see how they shift outcomes.  

  Simultaneously, I’ll argue the **temporal scale** is orthogonal:  
  - *Synchronic equality* avoids "averaging away" hardship (Ana’s suffering matters *now*).  
  - *Whole-life equality* better captures autonomy (Ana trades early hardship for later flourishing).  
  - *Neither* is entailed by choosing welfare/resources/capabilities. Policy implications diverge radically (e.g., unemployment benefits vs. pension schemes).  

  **Method & Timeline (12 Months → 3 Chapters + 1 Paper)**  
  1. **Months 1–4: Chapter 1 – Diagnosing the Collapse**  
     *Task*: Demonstrate that all three currencies covertly rely on contested conversion rules. Show that debates (e.g., "Is health a resource or capability?") dissolve when conversion is made explicit.  
     *Cut if slow*: Detailed taxonomy of welfare sub-theories.  

  2. **Months 5–7: Chapter 2 – Temporal Scales as Independent Variables**  
     *Task*: Prove that temporal scope (synchronic/stage/whole-life) cross-cuts currency choices using contrasting cases (e.g., Ana vs. Ben). Formalize how scale choice affects inequality metrics.  
     *Cut if slow*: Analysis of "repayment" narratives (e.g., does later flourishing compensate for early deprivation?).  

  3. **Months 8–10: Chapter 3 – The Counterfactual Conversion Function**  
     *Task*: Construct the counterfactual function; show how it avoids adaptive preferences without presupposing distributive outcomes. Test it against hard cases (e.g., chronic illness, cultural preferences).  
     *Cut if slow*: Computational modeling of institutional variation.  

  4. **Months 11–12: Standalone Paper – Policy Implications & Decision Tree**  
     *Deliverable*: A flowchart for policymakers: "Choosing Your Egalitarian Framework: 2 Key Decisions." Translates theoretical choices (conversion rule? temporal scale?) into operational rules (e.g., "Use lifetime income + counterfactual health conversion for pension reform").  

  **Why Not the Alternatives?**  
  - **Survey/Theory Rehash?** This doesn’t resolve the stalemate; it documents it. My approach isolates variables causing the deadlock.  
  - **Empirical Work?** Premature. Without clarifying *what* we’re measuring (conversion? scale?), empirical tests are question-begging.  
  - **Picking a Capability List?** Arbitrary without addressing *why* some capabilities matter (the conversion problem) or *when* they matter (temporal scale).  

  **Failure Conditions & Fallback**  
  - **Failure Condition 1**: If I find *no plausible cases* where conversion rules operate independently of currency choice (e.g., if all resourcists *must* be whole-life egalitarians).  
  - **Failure Condition 2**: If the counterfactual conversion function is *inescapably circular* (no stable way to define "just institutions" independently).  
  - **Fallback Project**: *"Time and Equality: Why Temporal Scale Might Be the First Question."* A focused theory-to-policy paper on temporal units, using Ana/Ben cases to show how scale affects real policy design (e.g., short-term disability vs. inheritance tax). Retains novelty and answers the "pick a metric" demand.  

  **Deliverable for Policymakers:**  
  A **decision protocol** that replaces "Pick a currency (welfare/resources/capabilities)" with:  
  1. **Specify the Conversion Rule**: Should we use observed preferences? Biological needs? Market valuations? Or a counterfactual baseline? (With trade-offs for each.)  
  2. **Set the Temporal Scale**: Momentary disadvantage? Life stages? Lifetime totals? (With cases showing how this alters priorities.)  
  *Output*: A matrix matching combinations (e.g., "Counterfactual Conversion + Synchronic Scale") to policy domains (e.g., "Use for anti-poverty program evaluation").  

  ---  

  **Key Arguments to Anticipate (and Why the Draft Invites Them):**  
  - **"Isn’t counterfactual conversion just capabilities?"** No—capabilities fix *outcomes* (achieved functionings); counterfactual conversion fixes the *preference-formation mechanism*. A capability theorist might still use *actual* preferences under oppression.  
  - **"Economists already use lifetime metrics!"** True, but without justifying *why* lifetime is the right scale normatively (vs. practical convenience). This exposes the ethical stakes.  
  - **"This is too abstract for policy!"** The decision protocol forces concrete choices: e.g., "If you care about autonomy, use counterfactual conversion + life-stage scale."  

  This sets you up to defend a precise claim ("Currency debates hide two independent variables"), offers a fallback if core premises crack, and gives economists a "choose your own framework" tool. Now go tear it apart.
