prompt: |-
  I'm putting together a two-page proposal for a one-year dissertation fellowship, and I keep going around in circles on it, so I need you to write a draft I can argue with. The committee is half philosophers and half economists who will definitely ask why we can't just pick a metric and measure something, so I need the framing to do real work. Here's where I'm at. The "equality of what" question is standardly presented as a choice between three currencies — welfare (in its desire-satisfaction and its more objective-looking variants), resources, and capabilities — and I've come to think that framing hides two decisions that everyone makes without noticing. The first: every one of these views has to say something about how a bundle of stuff gets turned into whatever the currency actually is, and the answer it gives silently does most of the work. The resources view seems to tell us to equalize the bundle and let conversion be the individual's business; the capabilities view says equalize what people can actually be and do, which just relocates the problem into which functionings count and at what threshold; and the welfare views get hit by the adaptive-preference worry, where someone who has been trained to be content with very little scores as well-off. I want to argue that the currency question and the conversion question aren't two questions, and that once you see that, a lot of the apparent standoff is two sides answering different questions. My proposed fix is to compare people using a counterfactual conversion function: the one they would have under just institutions and adequate opportunity, holding fixed only the preferences they reflectively chose and not the ones formed under deprivation. But I can't tell whether that's a genuine fourth position or just the capabilities view wearing a hat, and I'm not sure it's even well-defined, since "just institutions" looks like it already presupposes an answer about distribution.

  The second hidden variable is the temporal unit, which almost nobody discusses as a separate choice. Ana spends her twenties with a severe chronic illness and then has a long, self-directed, flourishing life; Ben's life is flatly mediocre the whole way through, never terrible and never good. On a whole-life comparison the two can come out equal — on welfare sums, and I think on capabilities too, if you're allowed to average — while any period-by-period comparison says Ana is badly off for a decade and Ben never is. But the period-by-period view then owes us a story about whether the good years later "repay" the bad ones early, and I don't know what that story is or whether there is one. I think the temporal unit might turn out to be independent of the currency choice, so that you can be a welfarist about currency and either a whole-life or a synchronic egalitarian, and that would be a genuinely useful result if it's true.

  So: turn this into a proposal. I want a precise question with a determinate answer, not a topic; an honest account of why the three standard currencies leave that question open (I'm sure I'm wrong about at least one of them, say where); a method section that says what I'd actually do with twelve months — realistically three chapters plus one standalone paper, so tell me what the chapters are and in what order, and what I'd have to cut if I'm slow; a defense of why this approach rather than the obvious alternatives (writing a survey of the debate, doing something empirical, or just picking a capability list and operationalizing it); and a failure condition that isn't a joke — what evidence would convince me mid-year that the currency/conversion collapse thesis is false, and what the fallback project would be. Also say what a finished deliverable would look like for someone who isn't a philosopher and wants to know which comparison rule to use for actual policy cases. Don't put in any citations or a literature review section, I'll add those myself; refer to positions and arguments by description, since my committee knows the terrain and I need the argument, not the map.
