prompt: |-
  I keep running into one shape of argument and I have no word for it, which is making it hard to think about. I would like the established term if there is one, and whichever way it goes, help carving the thing at the joints.

  Three instances from the last year. First: a friend trying to talk his brother into forgiving their father listed some considerations — you would sleep better, the family would stop being miserable at Christmas, the grudge is costing you more than it costs him. The brother granted every item on the list and then said they were still the wrong sort of thing: reasons to want to forgive, or to behave as if he had, or to get himself into a forgiving frame of mind by some indirect route, but not reasons to forgive; and if he produced the feeling from those considerations alone, it would not be the thing he was being asked for. Second: a colleague told me I should be impressed by our new director, on the grounds that being impressed would make my working life easier and would show in how I spoke to her. Same shape. The consideration is genuine, it tells in favour of something, and yet citing it in favour of the reaction felt like a category mistake. Third: a man offered me a hundred dollars if by Friday I could come to believe his startup would work. Here I do not even want to say the money is a weak or second-rate consideration; I want to say it is not a consideration of the relevant sort at all, only a reason to want the belief, or to act as if I had it.

  Two things I think I am not after, so you do not spend the answer on them. It is not the familiar observation that belief and admiration are not directly under the will — my friend's brother is not claiming he is incapable of working himself into a forgiving mood, and people do manage it. And it is not the point that practical considerations do not affect what is true; he never denied that his grudge was harmful. The recurring thing is narrower: the consideration seems to tell in favour of a neighbouring state or action while failing to tell in favour of the reaction itself, and offering it in deliberation seems somehow to spoil the very thing it is offered in favour of.

  Two cases I cannot sort, which is why I do not trust my own description. If I tell myself to trust my co-founder because the company will fall apart unless we trust each other and she has given me no positive evidence of untrustworthiness, that has the bad shape, and yet it strikes me as a perfectly respectable reason. And if I tell myself that starting out admiring someone will make me notice merits I would otherwise miss, and that admiring her is therefore a good idea, is that the bad shape too, or just an ordinary case of a consideration operating indirectly?

  So: does this configuration have a name — a label for considerations that count in favour of a reaction without bearing on what the reaction is about, or that look like reasons for wanting the reaction rather than for having it? If the nearest established concepts fit only imperfectly, tell me which they are, how each differs from what I have described, and which fits best. If nothing fits, coin the term yourself, define it, say what does the explaining (two kinds of reason? one kind plus a separate standard that reactions answer to? or not reasons at all, but causes and incentives wearing the costume of reasons?), and give me the boundary cases any definition would have to get right. I will not be satisfied with a bare label; I want the carving.

  Please put your bottom line in the first sentence, then give the reasoning, with no preamble and no restatement of what I have asked.
reasoning: |-
  Hmm, the user is describing a recurring philosophical dilemma about a specific type of argument where practical considerations are offered as reasons for emotional or cognitive states (like forgiveness, admiration, or belief), but these feel categorically wrong - not because we can't control these states, but because they seem to address something adjacent rather than the state itself. They've provided clear examples (forgiveness, admiration, belief) and counter-examples (trust, cultivating admiration) to test the boundaries.

  This reminds me of Bernard Williams' distinction between "internal" and "external" reasons, where internal reasons connect to the agent's motivations while external ones don't. But Williams focuses more on action motivation. For beliefs, there's the concept of "wrong kind of reasons" from epistemology, where practical incentives (like money for belief) don't bear on truth. Pamela Hieronymi's work on "constitutive standards" seems closer - she argues that certain attitudes have built-in standards of correctness (e.g., forgiveness responds to moral repair, not consequences).

  The user wants precision: they reject easy answers about volitional control or truth-relativity. Their trust example is tricky because pragmatic reasons for trust can sometimes bootstrap epistemic ones, but feel legitimate here. The admiration case shows indirect cultivation might be permissible if framed as preparatory. The boundary seems to be whether the reason engages with the attitude's constitutive aim: forgiveness aims at moral repair, not peacekeeping; belief at truth, not profit.

  The core issue is about the grammar of reasons - what counts as a justifying consideration depends on the nature of the attitude. Hieronymi's term "wrong kind of reasons" (WKR) fits best, though it's usually applied to belief. We can extend it: WKRs are considerations that satisfy the desire to have an attitude but don't satisfy the attitude's own standard of correctness. The money-for-belief case is pure WKR; the forgiveness case is WKR because forgiveness constitutively concerns blameworthiness, not utility; the trust counter-example works because trust's standard includes reliability, which the reason addresses.

  For the user's unresolved cases: The co-founder trust argument avoids being WKR because "no evidence of untrustworthiness" weakly engages trust's constitutive standard (reliability), even if pragmatically framed. The admiration cultivation might be acceptable as preparatory, but if offered as the primary reason to admire, it becomes WKR - admiration should respond to perceived excellence, not self-benefit.

  Bottom line: "Wrong kind of reasons" is the established term, defined as reasons that fail to engage with an attitude's constitutive standard of correctness. The explaining mechanism is that certain mental states have internal aims (forgiveness: moral repair; belief: truth; admiration: excellence), and only reasons bearing on those aims are the "right kind."

  I'll structure the response with this as the opening statement, then unpack the reasoning with the user's examples, address the boundary cases, and clarify why alternative concepts (like Williams' reasons or mere incentives) don't fully capture this.
answer: |-
  **Bottom line:** The established term for this category of considerations is "wrong kind of reasons" (WKR).

  **Reasoning:**

  1.  **The Distinction:** WKR contrast with "right kind of reasons" (RKR). RKRs bear directly on the *object* or *content* of the attitude or reaction itself and satisfy its constitutive standard of correctness. WKRs provide incentives or benefits *for having* the attitude but fail to address *what the attitude is about*. They are reasons to *want* or *cause* the state, not reasons *within* the deliberation proper to the state.
  2.  **Application to Your Cases:**
      *   **Forgiveness:** RKRs would concern the father's remorse, changed behavior, or reassessment of the original offense (bearing directly on the *blameworthiness* forgiveness addresses). Your friend's reasons (better sleep, family harmony, personal cost) are WKR – they are benefits *of* forgiving, not reasons showing the father *deserves* forgiveness or the blame was misplaced.
      *   **Admiration:** RKRs would be the director's actual competence, achievements, or character traits (bearing directly on *worthiness of admiration*). Your colleague's reasons (easier work life, appearing impressed) are WKR – they are benefits *of* being impressed, not reasons showing the director *is* impressive.
      *   **Belief:** RKRs would be evidence about the startup's viability (bearing directly on its *truth*). The $100 offer is a pure WKR – an incentive *for* having the belief, utterly disconnected from whether the belief *is true*.
  3.  **Explaining Mechanism:** Attitudes like belief, forgiveness, admiration, trust, and resentment have **constitutive aims or standards of correctness** (e.g., belief aims at truth; forgiveness responds to perceived moral repair or lack of blameworthiness). RKRs bear on whether the state *satisfies* its own constitutive standard. WKRs bypass this internal standard entirely, appealing only to external consequences or desires related to holding the state. Offering a WKR in deliberation *spoils* the attitude because adopting the attitude *for* a WKR means it fails to be responsive to its own constitutive standard (e.g., believing for money isn't *aiming at truth*; forgiving for peace isn't *responding to blameworthiness*).
  4.  **Addressing Your Boundary Cases:**
      *   **Trusting your Co-founder ("company will fall apart"):** This *avoids* being a pure WKR because the reason ("she has given me no positive evidence of untrustworthiness") *weakly engages* the constitutive standard of trust (reliability, competence, goodwill). While pragmatic, it points towards a *lack of counter-evidence* to the RKR of her trustworthiness. It's a borderline case where a pragmatic framing *includes* a gesture towards the RKR space. If the reason were *only* "the company will fall apart otherwise," it would be WKR.
      *   **Cultivating Admiration ("notice merits otherwise missed"):** This is **complex**. If offered as the *sole* or *primary* reason to admire *now* ("you should admire her *so that* you notice her merits"), it leans WKR – admiration is being adopted instrumentally, not as a response to perceived merit. However, if framed as a reason to *suspend dismissal* or *engage attentively* to *discover* RKRs (merits), it can be a legitimate preparatory step *towards* forming admiration based on RKRs. It's a reason for an *action* (attending differently) aimed at enabling RKR-based admiration later. Directly adopting admiration *because* it will help you notice merits is still WKR for the admiration itself.
  5.  **Why Other Concepts Don't Fully Fit:**
      *   **Internal/External Reasons (Williams):** Focuses on motivation relative to an agent's subjective motivational set. WKR can be internal (you *want* peace) but still fail as reasons *for the attitude itself*.
      *   **Practical vs. Epistemic Reasons:** Covers only part (belief); forgiveness/admiration aren't purely epistemic. WKR are often practical, but the core issue is their failure to engage the attitude's specific standard, not their practicality per se (pragmatic trust reasons can sometimes weakly engage the standard).
      *   **Mere Incentives/Causes:** Captures the $100 case well, but "incentive" doesn't fully capture why your friend's brother felt the reasons were "the wrong *sort* of thing" or constituted a "category mistake" in deliberation. WKR explains why they feel like counterfeit reasons *within the space of reasons for that attitude*.
      *   **Indirect Reasons:** While WKRs often operate indirectly (e.g., reasons to cause the state), the key distinction isn't indirection vs. directness. RKRs can sometimes be applied indirectly (e.g., deliberately reflecting on evidence to form a belief). The distinction is *what* the reason bears upon: the attitude's constitutive standard (RKR) or external consequences (WKR).

  **Carving the Joints:** The recurring thing is a consideration offered as a reason *for* a specific evaluative or cognitive attitude (forgiveness, admiration, belief) that only provides reasons *for desiring* or *producing* that attitude, failing to engage with the attitude's *internal standard of correctness* (blameworthiness for forgiveness, excellence for admiration, truth for belief). This makes it a "wrong kind of reason" (WKR), distinct from "right kind of reasons" (RKR) which satisfy that internal standard. The "spoiling" occurs because adopting an attitude based *only* on WKR means the attitude is not genuinely responsive to its own defining norms.
