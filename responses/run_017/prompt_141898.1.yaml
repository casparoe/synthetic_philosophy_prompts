prompt: |-
  Hi, I'm a junior in highschool and I mostly now code — robotics team, some Python, I messed around with building a little chatbot once — so my brain lives in state machines, hard-coded vs learned behavior, inputs and outputs, the Turing test, grounding, that kind of stuff. Can you restate Descartes' position that animals are just machines in that vocabulary, as faithfully and as undumbed-down as you can? I mean specifically his two tests — whether a creature can really use words or signs to tell us what it's thinking, and whether it can do lots of different things like one general-purpose tool instead of just nailing the one thing it was built for — plus the bit where he sort of seems to let animals have some kind of feeling while denying them thought. I want the actual argument, just in words I'd use, not a summary.

  Then the part I actually care about: what didn't survive the translation. My hunch is that his language test is secretly a test for being a general-purpose reasoner, not for feeling anything, and that a modern chatbot both passes and flunks it in a way he has no vocabulary for — it throws signs around fine but has no body to have passions with, so the thought/sensation split he leans on might just collapse. Tell me what maps cleanly onto code, what you had to fudge, and what has no counterpart in my vocabulary at all (the soul? the inner-movie part? the idea that a machine can't be wrong in the way a mind can?) — and whether that leftover is a hole in how I'm thinking or a sign his argument was quietly sliding between two different questions.

  Please answer in American English, and skip the standard "beast-machine" paragraph that every webpage opens with.
