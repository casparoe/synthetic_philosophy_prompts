prompt: |-
  Hi — I run the integrity/compliance function at a mid-sized INGO (health and cash transfer programmes, around 40 country offices). We have a whistleblowing line that staff and beneficiaries can text into, and we get maybe 200 reports a year, of which something like 60 are about money or favours rather than safeguarding or HR stuff. Right now triage is basically: whoever is on duty reads it, forms a view, and the country director decides. Unsuprisingly we are wildly inconsistent — one office dismissed someone for a $15 facilitation payment, another office treated a much bigger thing as "local custom" and closed it. Reports go to donors in aggregate and occasionally individually, and some end in dismissal or a police referral, so the inconsistency is starting to be a real problem for us.

  What I need from you is a written procedure my team can actually run. Constraints: triage is done by a two-person team (neither is a lawyer, both are from the region), they have maybe 30 minutes per report, the output has to be a short written record that a regional director can sign off on and that would survive being read aloud to (a) a donor and (b) the local staff whose practice it is. And it has to work in translation — most offices don't operate in English.

  Conceptually I think we keep conflating four questions and I want the procedure to keep them apart:
  (i) does the thing fit the definition of corruption at all;
  (ii) if it does, who is made worse off, and how identifiable are those people;
  (iii) is the person involved blameworthy given what their actual options were — I keep running into cases where refusing to pay isn't a real option, as opposed to cases where both sides are collaborating to get something they're not entitled to;
  (iv) what we do about it: sanction the individual, report it upward, change our own process so the payment stops being necessary, or leave it alone.
  I want the procedure to output both a classification and a response recommendation, and to be explicit that these can come apart — something can be corruption and still warrant no sanction.

  Two design requirements I care about, and please argue with me if you think either is wrong:

  - Currency neutrality. The transfer might be cash, but it might be a job for a nephew, school fees, a goat, an invitation to a wedding, a promise to turn up at a rally, or help getting a relative out of a police station. Our current practice treats cash as the serious case and the rest as "culture", which I'm fairly sure is just parochialism with a nicer name. I want the classification to come out the same if you swap the currency, and I want the procedure to say so out loud rather than leave it implicit.
  - Relationship-shaped cases. A lot of what reaches us isn't a single act, it's a pattern over years: the same intermediary connecting the same people across completely different domains — a small sub-contract here, help getting a kid into school there, a hospital bed, a police matter quietly sorted. Each act is defensible on its own; the thing that worries me is the relationship. So I want a branch that takes a pattern rather than an act as the unit of analysis, and a test for when a pile of individually fine acts adds up to something we should call clientelism. My guess at the test is something about convertibility (can credit earned in one domain be cashed in another?) and something about who else could have obtained the same thing, but please do better than my guess.

  Things I want flagged rather than smoothed over:

  - Cases where nobody personally profited. Quite often an office does something improper and the benefit accrues to the programme or to the community, not to any individual. Our rules — which are basically "use of a position for private gain" — fit these badly, and I'd rather the procedure tell me it doesn't know what to do with them than pretend they're just the easy case.
  - Where our own standard is the imported one. I'd like some kind of stress test that catches us applying a Western or northern intuition and calling it universal. But I also know that kind of test gets abused as a blanket excuse, so tell me where it misfires and what stops someone using it to wave anything through.
  - Where the collective-action version bites. Even where everyone agrees a practice is bad, one office that opts out on its own loses its licence, its shipments, its land, while the practice carries on regardless — which means our own rule creates pressure to not report rather than to not pay. I want the procedure to register this where it applies and to say how the record should note it.
  - Which decisions genuinely can't be made by procedure and have to go to a named person as a values call. I need to know which boxes those are and who signs.

  Deliverable: a one-page version I can hand to the team — ordered questions, what counts as a sufficient answer to each, where it stops with a no, where it hands off — plus a short appendix saying, for each step, which distinction is doing the work and which distinctions you deliberately dropped to make it usable, and where it will misfire. I definately don't need citations or a reading list, I can't check them and they'd be no use to me; just give me the reasoning.

  Then run it on three cases and show me the records you'd actually produce:

  1. Enumerators registering households for a cash programme are routinely given eggs or a chicken afterwards. The teams say refusing is an insult and head office has told them to accept. One enumerator later helped a household that had given her a chicken fill in their form "properly" so they'd qualify. Small stuff in itself, but it's dozens of times a week across a whole district, and the second bit feels different to me in a way I can't articulate — if the procedure can articulate it, that would be worth a lot.

  2. A logistics assistant pays the equivalent of about $12 to a customs clerk to release a consignment of therapeutic food that is already legally cleared and has been sitting for nine days after three weeks of written requests that went nowhere. He reports it himself the same day, he has the receipt, and he's the person who kept telling the regional office the shipment was stuck. Nobody was personally enriched and the food reached a feeding programme.

  3. A country office needed land for a distribution site and a chief provided it, essentially for free, because the office had a long relationship with his family. Later the office hired his daughter as a casual enumerator ahead of 40 applicants with better test scores. For two years the office has also routed small sub-contracts, staff medical referrals and a couple of school-fee advances through the same local fixer, who is also a youth organiser for the governing party. Staff say he is the only reason anything gets done in that district and that they owe him. Classify it, tell me who is harmed and how identifiable they are, and tell me what we do — because my instinct is that sanctioning anyone here would be insane and would cost us the programme, and I want to know whether the procedure agrees with me or whether it tells me I'm just protecting my own office.
reasoning: |-
  We are designing a triage procedure for whistleblower reports, focusing on corruption-related issues. The procedure must be run by a two-person team with limited time (30 minutes per report) and produce a short written record for regional director sign-off. It must work in translation and separate four key questions.

  Design Principles:
  1. Currency Neutrality: The form of the benefit (cash, goods, services, favors) should not determine the outcome. The procedure must explicitly state this.
  2. Relationship-Shaped Cases: We need a branch to handle patterns of interaction (clientelism) where individually defensible acts form a problematic whole. Key tests: 
     - Convertibility: Can favors/benefits in one domain be exchanged for benefits in another? 
     - Exclusivity: Could others have obtained the same benefit through normal channels? If not, the relationship may be creating an unfair advantage.

  Procedure Structure:
  The procedure is a decision tree with four main questions (i-iv). Each question must be answered with sufficient clarity for the record. The output includes:
  - Classification: Answers to (i) and (ii), and if applicable, (iii).
  - Response Recommendation: Answer to (iv), which may include multiple actions (sanction, report, process change, no action) or a combination.

  We flag:
  - Cases with no personal profit: These are not automatically "non-corruption" but may require a different approach (e.g., process change).
  - Imported standards: We include a "cultural context" step but limit its use to avoid abuse. The test: Is the practice required by local law or universally condemned (e.g., by international treaties)? If not, we note the tension but do not let it override core integrity standards.
  - Collective-action problems: We note when unilateral compliance would harm the program without changing the system. The record must state this and recommend systemic action (e.g., sector-wide advocacy) without excusing the act.
  - Values calls: We identify steps where a judgment must be made by a named person (e.g., Regional Director) and document the reasoning.

  The written record must be concise (bullet points) and structured to be read aloud. It should include:
  - Report ID, date, and summary.
  - Answers to (i) to (iv) with brief reasoning.
  - Flagged issues (if any).
  - Recommended actions and who is responsible.

  Decision Tree:

  Step 0: Initial Triage (5 minutes)
  - Is the report about corruption? (Use the definition: "Abuse of entrusted power for private gain." Note: "private gain" can be for an individual, a group, or an organization, but we must distinguish from acts that benefit the public or the program without improper gain.)
     - If no, refer to safeguarding/HR and stop.
     - If yes, proceed.

  Step 1: Question (i) - Is it corruption? (10 minutes)
  - Does the act involve an abuse of entrusted power? (Power given by the organization, government, or community role.)
  - Was there an expectation of gain (any form, including non-cash) for the actor or a connected party? 
     - If no, flag: "No private gain" and note the benefit (e.g., program efficiency, community benefit). Proceed to Step 1a.
     - If yes, proceed to Step 2.
  Step 1a: For "no private gain" cases:
     - Could the act create an unfair advantage or harm? (e.g., even if no one profited, did it distort fairness or integrity?)
        - If yes, classify as "Procedural violation" (not corruption) and go to Step 4 for response.
        - If no, classify as "No issue" and stop (with explanation).

  Step 2: Question (ii) - Harm and Identifiability (5 minutes)
  - Who is harmed? (e.g., specific individuals, the program, public trust, excluded groups.)
  - How identifiable are they? (e.g., by name, as a group, or abstract.)
  - Record: "Harmed: [description]. Identifiability: [High/Medium/Low]."

  Step 3: Question (iii) - Blameworthiness (5 minutes)
  - What were the actual options? (Consider: Was refusal a realistic option without severe consequences? Was there a power imbalance?)
     - If no realistic option (e.g., refusal would lead to harm, job loss, or program failure), note: "Coerced context."
     - If options existed and the actor chose to collaborate for mutual benefit, note: "Collaborative act."
  - Is the actor blameworthy? (Consider: Did they report it? Did they try alternatives? Was there intent to harm or defraud?)
     - If coerced and no personal gain, blameworthiness is low.
     - If collaborative and personal gain, blameworthiness is high.

  Step 4: Question (iv) - Response Recommendation (5 minutes)
  Based on the above:
  - If corruption (Step 1) and blameworthy (Step 3): Recommend sanction (e.g., dismissal, disciplinary action) and/or police referral.
  - If corruption but low blameworthiness (e.g., coerced): Recommend no sanction for the individual but report upward and change process to remove the coercion.
  - If procedural violation (Step 1a): Recommend process change and training.
  - If no issue: Close with no action.

  For patterns (relationship-shaped cases):
  - If the report describes multiple acts over time, apply:
     a. Convertibility test: Are favors exchanged across domains (e.g., a contract for school admission)? If yes, the pattern may be clientelism.
     b. Exclusivity test: Could the same result have been obtained by someone without the relationship? If no, then the relationship creates an unfair advantage.
  - If both tests are positive, classify as "Clientelism" (a form of corruption) and proceed from Step 2.

  Special Flags:
  - No personal profit: Already handled in Step 1a.
  - Imported standard: In Step 1, if the practice is widespread and not illegal locally, ask: "Is this practice universally condemned (e.g., bribery) or does it violate our core values?" If our standard is the imported one, note: "Tension with local practice" but do not drop the classification. The response may include advocacy or gradual change.
  - Collective-action problem: In Step 3, if unilateral refusal would harm the program without changing the system, note: "Collective-action dilemma" and recommend systemic action (e.g., donor coordination, sector advocacy) in addition to any individual response.
  - Values call: Steps that require judgment:
     - Step 1 (corruption definition) - if unclear, escalate to Regional Director.
     - Step 3 (blameworthiness) - if contested, escalate.
     - Step 4 (response) - always a recommendation; final decision by Regional Director.

  Output Record Template:
  - Report ID: [Number]
  - Summary: [1-2 lines]
  - Step 1: Corruption? (Yes/No/Procedural violation). If no, why? If procedural, describe.
  - Step 2: Harm and identifiability.
  - Step 3: Blameworthiness (High/Low) and context (e.g., coerced, collaborative).
  - Step 4: Recommended response (sanction, process change, report, etc.).
  - Flags: [e.g., No personal profit, Cultural tension, Collective-action, Clientelism pattern]
  - Triage Officers: [Names]
  - Date: 
  - For Regional Director: [ ] Approve [ ] Modify [ ] Escalate (to whom) [ ] Other: _________

  Now, run three test cases:

  Case 1: Enumerators and chickens.
  - Report: Enumerators accept chickens/eggs routinely. One helped a household that gave her a chicken to fill in forms "properly" to qualify.
  - Triage:
    Step 0: About corruption? Yes (potential abuse for gain).
    Step 1: 
      - Abuse of power? Yes (enumerator has power to register households).
      - Gain? Yes (chicken, then favor in form filling).
      - Corruption? Yes.
    Step 2: 
      - Harm: Other households who did not give chickens and may not qualify fairly. Identifiable as a group (applicants in the same area).
    Step 3: 
      - Options: Refusing the chicken might be culturally hard, but the form-filling favor is a choice. Blameworthiness: High for the form-filling act (collaborative, not coerced).
    Step 4: 
      - Recommend: Sanction for the enumerator (training or warning for the form-filling), and change process: clear rules on gifts and monitoring of form assistance. Also, address the cultural issue: perhaps replace gifts with community tokens of appreciation (non-individual) or set a symbolic value limit.
    Pattern? The routine chicken acceptance is a pattern. Apply clientelism tests:
      - Convertibility: Chicken (material) converted to favor (service). Yes.
      - Exclusivity: Could the household have gotten the form help without the chicken? Probably not (since it was linked). So, clientelism pattern. Flag this.
    Flags: Cultural tension (gift-giving), Clientelism pattern.

  Written Record:
  - Report ID: WB-001
  - Summary: Enumerator accepted chicken from household and later helped them fill form to qualify.
  - Step 1: Corruption? Yes (abuse of power for gain).
  - Step 2: Harm: Unfair exclusion of other applicants; identifiable as applicant group in area.
  - Step 3: Blameworthiness: High (form-filling was a voluntary favor).
  - Step 4: Recommend: Sanction enumerator (disciplinary action), revise gift policy, and train staff. Also, review clientelism risk in the area.
  - Flags: Cultural tension, Clientelism pattern.
  - Triage Officers: [Names]
  - Date: 

  Case 2: Customs payment.
  - Report: Logistics assistant paid $12 to customs clerk to release legally cleared therapeutic food after delays. He reported it, has receipt. Food reached feeding program.
  - Triage:
    Step 0: Corruption? Yes (payment to public official).
    Step 1: 
      - Abuse of power? Yes (clerk abused their position).
      - Gain? Yes (clerk gained $12), but assistant did not gain personally. However, the organization gained (food released). 
      - Corruption? Yes (by the clerk; the assistant facilitated but did not abuse his own power for private gain — he acted for program gain).
    Step 2: 
      - Harm: Undermines rule of law; may encourage more demands. Identifiable as abstract (public trust).
    Step 3: 
      - Options: Assistant tried official channels for weeks. Refusal might mean no food for the program. Coerced context. Blameworthiness for assistant: Low (reported, no personal gain).
    Step 4: 
      - Recommend: No sanction for assistant. Report the clerk to authorities (if feasible). Change process: escalate customs delays higher up, use diplomatic channels, or build relationships to avoid payments.
    Flags: No personal profit (by assistant; clerk did profit), Collective-action problem (if others pay, we must too to operate).

  Written Record:
  - Report ID: WB-002
  - Summary: Logistics assistant paid $12 to customs clerk to release delayed, legally cleared food shipment. Self-reported.
  - Step 1: Corruption? Yes (by clerk; assistant facilitated without personal gain).
  - Step 2: Harm: Public trust in institutions; abstract harm.
  - Step 3: Blameworthiness: Low (coerced context, no personal gain, self-reported).
  - Step 4: Recommend: No sanction for assistant. Report clerk to customs authority. Advocate with government for smoother clearance. Review logistics protocols.
  - Flags: Collective-action dilemma, No personal profit (for assistant).
  - Triage Officers: [Names]
  - Date: 

  Case 3: Land, jobs, and fixer.
  - Report: Country office uses land from a chief for free, hires his daughter over better candidates, and routes contracts/medical/school help through a fixer (who is a party official). Staff feel they "owe" him.
  - Triage:
    Step 0: Corruption? Yes (potential favoritism).
    Step 1: 
      - Abuse of power? Yes (office used its power to favor connected individuals).
      - Gain? Yes (land, services from fixer; fixer gains contracts, influence).
      - Corruption? Yes (nepotism, kickbacks in the form of reciprocal favors).
    Pattern: Apply clientelism tests to the fixer relationship:
      - Convertibility: Fixer helps with land (asset), gets contracts (money), medical referrals (service), school fees (money). Yes, across domains.
      - Exclusivity: Could others get these without the fixer? Staff say no — he is "the only reason anything gets done." So, exclusivity = high. Thus, clientelism.
    Step 2: 
      - Harm: 
          - Land: None? (Chief gave freely, but public land might be involved? Record: land ownership unclear.)
          - Job: The 40 better-qualified applicants harmed; identifiable as a group.
          - Contracts: Other businesses excluded; identifiable as a group.
          - Medical/school: Others may not get the same access; abstract harm to fairness.
      - Identifiability: High for job and contract harm (specific excluded applicants/businesses); medium for medical/school (local community).
    Step 3: 
      - Options: Office could have tried other channels but claims fixer is essential. Blameworthiness: High (systematic choice to use the fixer for advantage).
    Step 4: 
      - Recommend: 
          - Sanction? Not individuals, but the office practice must change.
          - Change process: Transparent hiring, competitive bidding for contracts, clear criteria for medical/school help.
          - Report upward to donors about systemic issue and political entanglement.
          - Long-term: Reduce dependence on the fixer by building alternative systems.
      - Note: Sanctioning individuals might be counterproductive (as per user's instinct). The procedure says: if blameworthiness is high, sanction is warranted, but the response can be nuanced (e.g., sanction only if individuals acted against policy, or focus on organizational change). Here, the office may have created the dependence, so leadership should be held accountable. However, the values call is for the Regional Director: given the program risk, they might choose no individual sanctions but strict process changes.
    Flags: Cultural tension (local practices vs. transparency), Clientelism pattern, Collective-action (if this is how business is done, opting out is hard).

  Written Record:
  - Report ID: WB-003
  - Summary: Office used chief's land, hired daughter, routed contracts/help through fixer (party official) in a long-term relationship.
  - Step 1: Corruption? Yes (nepotism, clientelism).
  - Step 2: Harm: Excluded job applicants and contractors (identifiable groups); unfair access to services (abstract). Land harm unclear.
  - Step 3: Blameworthiness: High (systematic use of relationships for advantage).
  - Step 4: Recommend: No individual sanctions at this time (due to program risk) but implement transparent processes for hiring, contracts, and referrals. Report to donors. Phase out fixer dependence. Escalate to HQ for oversight.
  - Flags: Cultural tension, Clientelism pattern, Collective-action dilemma.
  - Triage Officers: [Names]
  - Date: 

  Appendix: Key Distinctions and Trade-offs
  - Step 1: We use a broad definition of "private gain" (includes organizational gain) but distinguish procedural violations. Trade-off: We may over-classify as corruption in cases where the gain is organizational. We flag it to allow nuanced response.
  - Step 3: Blameworthiness separates culpability from the act. Trade-off: It may excuse acts that are systemic (e.g., "everyone does it") but we counter with the collective-action flag.
  - Clientelism: We added a pattern analysis. Trade-off: It requires more time, so we only trigger it when multiple acts are reported. It might misfire in close-knit communities where favors are normal but not exclusive.
  - Cultural tension: We note it but don't override. Trade-off: It avoids parochialism but may not resolve the tension. The response must be context-sensitive.
  - Values calls: We escalate when definitions are unclear or blameworthiness is contested. Trade-off: It slows the process but ensures accountability.

  This procedure should fit on one page as a flowchart or checklist. The team can be trained to follow it consistently.
answer: |-
  Below is a triage procedure designed for your two-person team, focused on clarity, consistency, and your core requirements (currency neutrality, relationship-shaped cases, flagging edge cases). It fits on one page for daily use, with an appendix explaining key design choices. The procedure is structured as a linear checklist with clear exit points, outputs, and handoffs. It assumes your team has basic training in your organization's integrity policies and local context.

  ---

  ### **WHISTLEBLOWER REPORT TRIAGE PROCEDURE**  
  **For Corruption-Related Reports Only**  
  *Time Limit: 30 Minutes/Report | Output: Short Written Record for Regional Director Sign-off*

  ---

  #### **STEP 0: INITIAL SCREENING (5 MINUTES)**  
     - **Question:** Is this report about corruption? Use definition: *"Abuse of entrusted power for private or organizational gain (any currency)."*  
       - *Gain includes*: Cash, goods, services, favors, relationships, or indirect benefits (e.g., to program/community).  
       - *Not corruption*: HR disputes, safeguarding, personal grievances (refer these immediately).  
     - **Sufficient Answer:** Yes/No with 1-sentence reason.  
     - **Exit if No:** Refer to relevant department.  
     - **Proceed if Yes:** Assign unique ID. Note: Reporter type (staff/beneficiary), date, location.  

  #### **STEP 1: CLASSIFY THE ACT (i) (10 MINUTES)**  
     - **Question:** Does the act meet the corruption definition?  
       - **Key Tests:**  
          - *Entrusted power abused?* (e.g., role in INGO, government, community).  
          - *Gain obtained?* (any currency—test for **currency neutrality** by asking: *"Would this still be an issue if cash replaced the benefit?"*).  
          - **For patterns (relationship-shaped cases):**  
            - *Convertibility test*: Could credit from one act (e.g., a contract) be "cashed in" for another (e.g., school admission)?  
            - *Exclusivity test*: Could others obtain the same outcome without the relationship?  
            - *If both YES → Classify as "Clientelism"*.  
       - **Flag if:**  
          - No personal gain (e.g., benefit went to program/community).  
          - Cultural tension (e.g., practice is locally accepted but violates INGO policy—ask: *"Is this criminalized locally or universally condemned (e.g., bribery)?"*).  
     - **Sufficient Answer:**  
       - Corruption: Yes/No/Clientelism.  
       - If no gain or cultural tension, flag explicitly.  
     - **Exit if No:** Close as "Not corruption." Explain why in record.  
     - **Proceed if Yes:** Note classification.  

  #### **STEP 2: ASSESS HARM (ii) (5 MINUTES)**  
     - **Question:** Who is harmed, and how identifiable are they?  
       - *Harm types*: Financial loss, unfair exclusion, eroded trust, program distortion.  
       - *Identifiability*:  
          - **High**: Named individuals/groups (e.g., "the 40 job applicants").  
          - **Medium**: Defined community (e.g., "households in District X").  
          - **Low**: Abstract/public (e.g., "public trust").  
     - **Sufficient Answer:** 1–2 sentences describing harm and identifiability level.  
     - **Proceed always.**  

  #### **STEP 3: BLAMEWORTHINESS (iii) (5 MINUTES)**  
     - **Question:** How blameworthy is the actor, given their options?  
       - **Key Tests:**  
          - *Realistic alternatives?* Ask: *"Could they refuse without severe cost (e.g., job loss, program failure)?"*  
            - If no → Low blameworthiness (coerced).  
            - If yes → High blameworthiness (collaborative).  
          - *Intent?* (e.g., self-reporting, history of refusal).  
       - **Flag if:** Collective-action problem (unilateral refusal would harm program without systemic change).  
     - **Sufficient Answer:** Low/High blameworthiness + 1-sentence context (e.g., "coerced due to customs delay").  
     - **Proceed always.**  

  #### **STEP 4: RESPONSE RECOMMENDATION (iv) (5 MINUTES)**  
     - **Question:** What should we do?  
       - **Options (select all that apply):**  
          - **Sanction individual** (if blameworthiness high).  
          - **Report upward** (e.g., to donor, police).  
          - **Change process** (e.g., policy/training to prevent recurrence).  
          - **No action** (if no harm or coercion).  
       - **Rules:**  
          - Corruption + High blame → Sanction + Report.  
          - Corruption + Low blame → Change process + Report upward.  
          - Clientelism → Change process + Report upward (systemic focus).  
          - No gain/procedural violation → Change process only.  
          - Collective-action flag → Add "Advocate for sector-wide change."  
     - **Sufficient Answer:** Recommended actions with 1-sentence justification.  
     - **Handoff:** Regional Director approves/modifies.  
     - **Values Call Required:**  
        - If cultural tension or collective-action dilemma → RD must sign.  
        - If harm identifiability is Low → RD must sign.  

  #### **OUTPUT RECORD TEMPLATE**  
  ```plaintext
  Report ID: [ ] | Date: [ ] | Location: [ ]  
  Summary: [1–2 sentences]  
  Step 1: Corruption? [Yes/No/Clientelism] | Gain currency: [e.g., cash, favor] | Flags: [e.g., No personal gain, Cultural tension, Clientelism]  
  Step 2: Harm: [Description] | Identifiability: [High/Med/Low]  
  Step 3: Blameworthiness: [Low/High] | Context: [e.g., Coerced, Collaborative] | Flags: [e.g., Collective-action]  
  Step 4: Recommended Response: [Sanction/Report/Change process/No action] | [Justification]  
  Triage Officers: [Names] | RD Decision: [Approved/Modified/Escalate]  
  ```  
  --- 

  ### **APPENDIX: DESIGN TRADEOFFS AND MISFIRES**  
  1. **Currency Neutrality**  
     - *Why?* Avoids Western bias (e.g., "cash = serious, goat = culture"). Test by swapping currencies forces consistency.  
     - *Dropped Distinction*: Legal status of non-cash gains (e.g., a job vs. cash). Tradeoff: May over-classify minor cultural gifts.  
     - *Misfires*: If local law explicitly permits a non-cash practice (e.g., barter), but INGO policy forbids it—cultural tension flag triggers RD review.  

  2. **Relationship-Shaped Cases (Clientelism)**  
     - *Why?* Catches patterns where small acts create systemic corruption. Tests:  
       - *Convertibility*: Prevents "siloed" excuses (e.g., "the contract was clean, the school fee was personal").  
       - *Exclusivity*: Ensures relationships don't create unfair access.  
     - *Dropped Distinction*: Individual intent in each act. Tradeoff: May mislabel benign networks (e.g., close-knit villages).  
     - *Misfires*: In low-governance areas, exclusivity test may flag all local facilitators—stress with collective-action flag.  

  3. **Flagged Edge Cases**  
     - *No Personal Gain*: Treated as "procedural violation" (not corruption) to force process changes. Misfires if gain is ambiguous (e.g., "community benefit" masking favoritism).  
     - *Cultural Tension*: Limited to practices not criminally illegal locally. Prevents abuse by requiring RD sign-off.  
     - *Collective-Action*: Notes pressure to comply but doesn’t excuse inaction—recommends advocacy.  

  4. **Values Calls**  
     - RD must decide:  
       - Cultural tension (balance local norms vs. INGO values).  
       - Low-identifiability harm (e.g., public trust vs. operational risk).  
       - Collective-action cases (e.g., whether to withdraw or advocate).  
     - Prevents misfires by escalating contested judgments.  

  ---  

  ### **TEST CASE APPLICATIONS**  
  *All records use the output template above.*  

  #### **CASE 1: Enumerators and Chickens**  
  ```plaintext  
  Report ID: WB-2023-056 | Date: 15 Mar 2023 | Location: District X, Country Y  
  Summary: Enumerator accepted chicken from household, later helped them "fix" form to qualify for cash transfer. Routine small gifts (eggs/chickens) to enumerators.  
  Step 1: Corruption? Yes | Gain currency: Food (chicken), then service (form help) | Flags: Clientelism (convertibility: food→service; exclusivity: help unlikely without gift)  
  Step 2: Harm: Unfair exclusion of other households | Identifiability: Medium (applicants in District X)  
  Step 3: Blameworthiness: High | Context: Form help was collaborative (refusal was option) | Flags: None  
  Step 4: Recommended Response: Sanction enumerator (training/warning), Change process (gift policy + form-audit) | Justification: Clientelism pattern distorts program integrity.  
  Triage Officers: A. Doe, B. Smith | RD Decision: [To sign]  
  ```  
  *Articulates the "difference": The chicken alone might be cultural, but convertibility to a service makes it clientelism.*  

