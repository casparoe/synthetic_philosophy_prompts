prompt: |-
  I work in quality control at a materials lab and read metaphysics in the evenings, and I keep running into a pattern I have no word for. I know the standard counterexamples to reading *x is disposed to M in C* as *x would M if C obtained*: the fink, where the stimulus itself removes the disposition (a wire that goes dead the instant it is touched), and the mask, where the disposition survives but something else blocks the manifestation (a fragile glass too well padded to break). What I keep noticing is the reverse configuration: the conditional comes out true and the behaviour shows up, but not, as far as I can tell, because the thing ever had the disposition.

  Two cases from work. (1) A metal sample is not malleable at room temperature, but hammering it heats it past the point where it becomes malleable, so it flattens: the test seems to install the disposition it appears to reveal. (2) A compound that does not dissolve in water is dropped into water; the water trips a mechanism that pulverises it, so it disperses: the visible signature of solubility, produced by something other than the sample's own solubility.

  Is there an established concept here, and are (1) and (2) instances of the same one? I suspect they are not: in (1) the object seems to acquire the disposition and then genuinely exercise it, whereas in (2) the manifestation never involves the object's own disposition at all. I also want the boundary drawn: does the glass that shatters the instant it is struck, but because of an unrelated vibration, belong with these or not?

  Please don't just hand me a label. Say what exactly the phenomenon is, how it differs from finks, from masks, and from a merely deviant causal chain, and whether the usual repair to the conditional analysis (an intrinsic property that would yield the manifestation absent interference) is even aimed at this direction. If nothing established fits, coin a term and give me a definition with its boundary cases. Answer in three short labelled parts, under 500 words.
reasoning: |-
  Hmm, the user works in materials science and metaphysics, and has noticed a specific pattern in dispositional properties that challenges standard analyses. They're describing cases where the conditional "if C, then M" holds true, and manifestation M occurs, but not because the object actually had the disposition in question. This seems to be the reverse of finks and masks they're familiar with.

  The user presents two concrete examples from their lab work: (1) A metal sample that becomes malleable only after hammering heats it to the required temperature. The test itself creates the disposition it appears to measure. (2) A compound that doesn't dissolve but gets mechanically pulverized by water, giving the appearance of dissolving. They're asking whether these are the same phenomenon or different, and how to distinguish them from related concepts.

  I need to analyze this carefully. The first case involves a genuine acquisition of disposition - the metal gains malleability through heating. The second case is purely extrinsic - the dissolution is faked by mechanical action. The user also asks about a boundary case: glass shattering from unrelated vibration when struck - which would be coincidental rather than dispositional.

  For part 1, I'll define the phenomenon. The core issue is that the stimulus causes the disposition to exist rather than triggering an existing disposition. I'll call this "Stimulus-Enabled Disposition" (SED) since the stimulus enables the disposition. This differs from finks (where stimulus removes disposition) and masks (where disposition exists but is blocked).

  For part 2, I'll distinguish the two cases. Case (1) is "Acquisitive SED" where the stimulus genuinely creates an intrinsic disposition that then manifests. Case (2) is "Extrinsic Mimic" where the manifestation occurs without any relevant intrinsic property. The glass example with vibration would be a different category - "Deviant Causation" where manifestation occurs but not through the dispositional mechanism.

  For part 3, I'll address the conditional analysis. The standard repair (requiring an intrinsic basis that would manifest absent interference) would correctly exclude both cases. But it's not specifically designed for this - SED helps explain why the conditional fails even when manifestation occurs.

  The user clearly wants precise philosophical distinctions, not just labels. I'll keep it under 500 words across three labeled parts, offering new terminology where needed while grounding it in existing discourse.
answer: |-
  Here's an analysis addressing your observations:

  **Part 1: The Core Phenomenon (Stimulus-Enabled Disposition - SED)**
  You've identified instances where the stimulus condition *C* itself *causes* the disposition *D* (to manifest *M*) to come into existence at the very moment of, or because of, *C*'s occurrence. The manifestation *M* results, not from *x* having *D* prior to or independently of *C*, but from *C* *making* *x* disposed to *M* just in time for *M* to occur. This differs fundamentally from:
  *   **Finks:** *C* triggers the *loss* of an *existing* disposition (*D* is present before *C*, removed by *C*).
  *   **Masks:** *C* triggers an *existing* disposition, but an external blocker prevents *M* (*D* is present before and after *C*, blocked during *C*).
  *   **Deviant Causal Chains:** *C* triggers *M*, but via a causal pathway bypassing the disposition's intended mechanism (e.g., striking glass causes vibration that shatters it; *D* may exist, but *M* doesn't occur *because* of *D*'s mechanism). SED involves the *creation* of *D* by *C*.

  **Part 2: Distinguishing Your Cases & Boundary**
  *   **(1) Metal Malleability:** This is **Acquisitive SED**. *C* (hammering) causes *x* to acquire the intrinsic disposition *D* (malleability at the new temperature) *during the test*. *M* (flattening) then genuinely manifests *because* of this newly acquired intrinsic disposition. The disposition *is* real and intrinsic once acquired, and *is* causally responsible.
  *   **(2) Compound Dissolution:** This is an **Extrinsic Mimic**. *C* (contact with water) triggers an extrinsic mechanism that produces *M* (dispersion) *without* *x* ever possessing the intrinsic disposition *D* (solubility). The manifestation mimics solubility but is caused entirely externally. *No* intrinsic disposition to dissolve is involved or created.
  *   **Boundary Case (Shattering Glass + Vibration):** This is **Deviant Causation**, *not* SED. The glass likely *has* the intrinsic disposition *D* (fragility) *before* *C* (striking). *C* causes *M* (shattering), but *not* via *D*'s mechanism (molecular bond breaking under impact stress). Instead, it triggers an *alternative* causal path (unrelated vibration). *D* exists, but *M* doesn't manifest *because* of *D*. This differs from SED, where *C* creates *D* itself, and from Extrinsic Mimic, where no *D* exists.

  **Part 3: Relation to Conditional Analysis Repair**
  The standard repair (requiring an intrinsic property *I* such that *x* would *M* in *C* *absent interference*) **excludes both your cases and is aimed in this direction**, though not specifically at SED.
  *   In **(1)**, the metal *lacks* the relevant intrinsic property *I* (malleability at room temp) *before* *C*. *C* (hammering/heat) *changes* its intrinsic state *to* one possessing *I*.
  *   In **(2)**, the compound lacks the intrinsic property *I* (solubility) entirely. *M* occurs via an extrinsic mechanism.
  *   The repair *aims* to exclude cases where the conditional holds due to extrinsic factors or causal quirks (like finks, masks, mimics, deviance), ensuring *M* happens *because* of an intrinsic *I*. SED (especially Acquisitive) highlights the *temporal* aspect: the intrinsic *I* must be present *before and independently* of *C* to count as the disposition *D*. The repair handles SED by demanding that *I* exists prior to *C*'s occurrence.
