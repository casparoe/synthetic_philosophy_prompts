  First, I need to understand the core tension they're facing: half the committee views insurance as fixing what's broken (therapy), while the other half sees it as enabling better-than-fine outcomes (enhancement). The user wants principles that can handle real-world dilemmas without philosophical jargon.

  Looking at their test cases:
  - Insulin challenges notions of permanence/repair
  - "Noise town" questions environmental vs medical responsibility
  - Stimulants highlight context-dependent medicalization
  - Orthodontics blurs medical necessity and social advantage
  - Future capacities raise questions about human baseline
  - Identity cases complicate "departure from typical"
  - Ratchet effect warns of shifting norms
