  Key collapse points they mentioned include therapy vs what we owe someone, not-normal vs bad-for-you, and the tension between value-free baselines and moral entitlement.

  For the desiderata, I should focus on:
  1. Must work with maintenance meds like insulin
  2. Must handle environmental causes without blaming victims
  3. Must account for functional demands of context
