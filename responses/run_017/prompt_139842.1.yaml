  The real tension lies between requiring a value-free biological baseline AND having the line do moral work - these may be incompatible. A purely biological standard can't determine what we owe people, while a moral standard can't avoid value judgments.

  For standard approaches:
  - Species-typical function fails insulin and environmental cases
  - Subjective welfare fails when people adapt expectations
  - "Reasonable person" is circular and culture-bound

  The most promising path might be a functional limitation framework centered on significant impairment in current environment, but it needs careful guardrails against norm drift and must incorporate patient perspective. The key is making "impairment" operational without biological fundamentalism.

  I'll structure this as clear requirements with test cases, flag non-negotiables vs preferences, and include a concise scorecard comparing common approaches. The language should stay manager-friendly with concrete examples.
answer: |-
  Here's a desiderata framework for a therapy/enhancement distinction designed to handle your cases and be administrable, with non-negotiables marked. The requirements focus on what the line **must do** to be credible and useful.

  ---

  ### **Desiderata for a Therapy/Enhancement Coverage Rule**
  *(Non-negotiables in **bold**)*

  1.  **Must Handle Maintenance of Function (Non-Negotiable)**  
      *Why*: Insulin, asthma inhalers, or antipsychotics don’t "cure" but keep people functional. If the rule excludes them, it fails core medical realities.  
      *Test Case*: Insulin – no "durable repair," but essential for baseline function.  
      *Collapse Avoided*: Therapy ≠ permanence or mechanism repair.

  2.  **Must Be Context-Sensitive Without Relativism (Non-Negotiable)**  
      *Why*: Function is measured against *current environment*, not an abstract ideal. But "normal" can’t shift arbitrarily with local statistics.  
      *Test Case*: "Noise Town" – Hearing loss is therapy *if it impairs function in broader society* (e.g., communicating, working outside town). "Town normal" isn’t binding. Earplugs are prevention (non-medical), not treatment.  
      *Collapse Avoided*: Therapy ≠ "local norm"; avoids conflating medical/political fixes.

  3.  **Must Distinguish Impairment from Variance (Non-Negotiable)**  
      *Why*: Therapy addresses *significant limitation*, not statistical deviation alone. Requires harm or risk.  
      *Test Cases*:  
      - *Stimulants*: Covered for ADHD if it impairs academic/work function (diagnosis validates impairment). Not for pilots/residents unless documented impairment exists. *The drug isn’t the difference – the impairment is.*  
      - *Orthodontics*: Covered post-accident (impairment: chewing/speech). Not for mild overbite without functional impact (cosmetic enhancement).  
      *Collapse Avoided*: "Not normal" ≠ "bad for you".

  4.  **Must Accommodate Evolving Environments (Non-Negotiable)**  
      *Why*: Medical needs arise from the world people live in.  
      *Test Case*: Child needing novel capacity (e.g., UV vision in high-radiation future). Covered if *essential for ordinary tasks* (e.g., safe outdoor navigation) in that environment.  
      *Collapse Avoided*: Therapy isn’t frozen by historical biology.

  5.  **Must Respect Autonomy & Identity (Non-Negotiable)**  
      *Why*: Medical necessity requires harm *to the individual*, not societal judgment. But "harm" can’t rely solely on patient perception if adaptation masks risk.  
      *Test Case*: Deaf parents declining cochlear implants. Coverage applies if *hearing loss impairs function* (e.g., language development). But coverage ≠ mandate. If function isn’t impaired (e.g., fluent signer in Deaf community), no therapy claim.  
      *Collapse Avoided*: Therapy ≠ "what we owe someone"; avoids imposing values on identity.

  6.  **Must Be Ratchet-Proof (Non-Negotiable)**  
      *Why*: Coverage shouldn’t redefine "normal" to create new deficiencies.  
      *Test Case*: If everyone takes cognitive enhancers, non-users aren’t inherently impaired. Coverage requires *pre-existing, significant impairment* relative to *unenhanced baselines*.  
      *Collapse Avoided*: Prevents "manufactured deficiency" via coverage.

  7.  **Must Be Indication-Agnostic (Non-Negotiable)**  
      *Why*: Medical value depends on current use, not origin.  
      *Test Case*: Botox for migraines (therapy) vs. wrinkles (enhancement) – same drug, different *indication* based on impairment.  
      *Collapse Avoided*: Therapy ≠ "first use" or "developer’s intent".

  8.  **Must Be Administrable (Non-Negotiable)**  
      *Why*: Needs clear inputs (diagnosis, functional assessment), not metaphysics.  
      *How*: Relies on objective diagnostics + standardized functional assessments (e.g., "Can perform activities of daily living? Meet educational milestones?"). Avoids cost/newness bias by anchoring to impairment evidence.  
      *Collapse Avoided*: "Medically necessary" = evidence of significant functional limitation.

  9.  *Should Avoid Biological Fundamentalism (Preference, Not Absolute)*  
      *Why*: Some camps fixate on "natural function," but biology adapts (e.g., glasses). Impairment is the anchor, not "natural state."  
      *Test Case*: Cochlear implants – restore *function*, not biological ear. Covered if hearing loss impairs.  
      *Tension*: One camp’s bias, not core requirement.

  10. *Should Minimize Subjective Welfare (Preference, Not Absolute)*  
      *Why*: "Happiness" is too variable and manipulable. Focus on functional capacity.  
      *Test Case*: Person adapting to chronic pain may report "fine," but if mobility is impaired, therapy is indicated.  
      *Tension*: Subjective welfare is a camp bias; function is more objective.

  ---

  ### **The Core Tension (Where Philosophy Bites)**
  **"Value-Free Baseline" vs. "Moral Entitlement" is the unsolvable clash.**  
  - **The Impasse**: You need a *biological/functional baseline* (e.g., "impairment") to avoid relativism. But deciding *which impairments deserve coverage* is inherently moral (e.g., "significant" limitation implies value judgment about what functions matter).  
  - **Why Non-Negotiables Help**: They force the line to be **evidence-based** (diagnosis + functional assessment) and **patient-centered** (harm *to them* in *their world*), making the value judgments more transparent and constrained. You can’t eliminate values, but you can ground them in observable reality.

  ---

  ### **Scorecard: Common Approaches vs. Requirements**
  *(✓ = Mostly Passes, ✗ = Fails, ~ = Mixed)*

  | Approach                  | Handles Insulin? | Avoids Noise Town Relativism? | Handles Stimulant Context? | Ratchet-Proof? | Administrable? | Respects Autonomy? |
  |---------------------------|------------------|-------------------------------|----------------------------|----------------|----------------|-------------------|
  | **Species-Typical Function** | ✗ (Insulin isn’t "restorative") | ✓ (Ignores town norms)        | ✗ (ADHD kid ≠ "species-typical") | ~ (Depends on definition) | ~ (Debates over "natural") | ✗ (Ignores identity) |
  | **Subjective Welfare**      | ✓ (Patient says it helps) | ✗ (Town residents may not report harm) | ✗ (Residents "feel fine" without?) | ✗ (Enhancements boost welfare) | ✗ (Too subjective) | ✓ (Centers patient) |
  | **"Reasonable Person"**     | ✓                | ✗ (Who’s "reasonable"?)       | ~ (Vague)                  | ✗ (Changes with norms) | ✗ (Circular)      | ✗ (Imposes majority view) |
  | **This Framework (Functional Limitation)** | ✓ | ✓ (Uses broader society/environment) | ✓ (Focuses on impairment) | ✓ (Requires pre-existing impairment) | ✓ (Evidence-based) | ✓ (Harm defined individually) |

  ---

  ### **The Short Version for Your Committee**
  A coverage rule must:  
  1.  **Cover essential maintenance** (like insulin).  
  2.  **Treat significant functional limitations** in the patient’s actual environment.  
  3.  **Use objective evidence** (diagnosis + functional impact), not origin, cost, or popularity.  
  4.  **Respect patient identity** but not ignore measurable harm.  
  5.  **Avoid shifting norms** – coverage requires pre-existing impairment.  

  **Forget "fixing vs. enhancing." Focus on: "Does this address a diagnosed condition causing significant functional impairment?"** That’s administrable, handles your cases, and avoids most philosophical traps. The rest is policy debate about *which impairments* qualify – which is where your committee’s values legitimately belong.
