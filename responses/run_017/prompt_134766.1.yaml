  - *Cheat*: Assumes preexisting `ConventionRegistry` global state—smuggles shared cultural context.  
  - *Self-issuing check?* Not applicable. Convention *is* the upstream spec.  

  **2. Reliance/Expectation → Temporal Dependency Invariant**  
  - *Code mapping*: `promise.fulfill()` becomes a precondition for `promisee.plan_execute()`. Violation breaks causal chain → `PlanIntegrityException`.  
  - *Cheat*: Maps "setting back interests" to plan failure, but philosophers’ "harm" includes emotional distress—no `ERROR_LOG` equivalent.  
  - *Self-issuing check?* No: Reliance is an *externally* imposed invariant (promisee’s state).  

  **3. Normative Power → Self-Issuing Assertion**  
  - *Code mapping*: `make_promise()` allocates an affine obligation token `obl` with `drop(obl)` requiring `perform_action()`. No external spec; token enforces its own validity.  
  - *Cheat*: Bootstrapping worry ≡ assertion without spec *is* decorative in your terms. Philosophers’ "power" lacks `AUTH_TOKEN` parameter.  
  - *Self-issuing check?* **Yes**—and you’re right: this is near-incoherent. An assertion creating its own precondition is `unsafe` at best.  

  **4. Second-Personal → Promisee-Held Cancel Token**  
  - *Code mapping*: `Promise` issues `(cancel_token: Affine<Waiver>, obligation: Linear<Action>)` split between promisor/promisee. Release *only* via `cancel_token.release()`.  
