answer: |-
  ### Translation  
  **Chesterton's Fence (Legacy-System Maintenance Translation):**  
  This is a **staged rollout rule for dead code removal**. Before decomissioning any component (e.g., a feature flag, validation check, or deprecated service), you must first reconstruct the **incident review log** for its creation. Identify:  
  1. The **blast radius** it was meant to contain.  
  2. The **orphaned invariants** it enforced (even if their rationale is lost).  
  3. The **tech-debt register** entry that would justify removal.  

  It imposes a **reversibility checkpoint**: If you cannot recover the original failure condition it addressed, you lack the **test coverage** to safely remove it. It is **deferral-first**: Remove only if you prove the failure mode is obsolete (e.g., underlying dependencies are now retired). If you find the original purpose *is* spent, removal is permitted — but the burden of proof stays with the remover.  

  **Burke's Argument (Legacy-System Maintenance Translation):**  
  This claims the system itself is a **distributed incident review spanning generations**. Its persistence is a **production telemetry signal**: If a component survives 20+ years across multiple tech stacks (despite **switching costs**), it likely encodes **unrecoverable tribal knowledge** about edge cases. Its age implies it has passed **stress tests** no living engineer remembers (e.g., Y2K, currency decimalization).  

  Burke adds that **individual refactoring proposals** lack the **integration test coverage** of the inherited system. The system’s longevity is **evidence of fitness** — not just inertia — because it outlasted alternatives that failed in production. Removing it risks violating **implicit service-level agreements** (SLAs) buried in the codebase.  

  ---

  ### One Argument or Two?  
  Under translation, they diverge sharply:  
  - **Chesterton is a procedural safeguard:** It’s a **deferral rule** with an escape hatch. Once you document the purpose via forensic analysis (e.g., logs, commit histories), you can remove the component if obsolete. The burden is on understanding, not eternal preservation.  
  - **Burke is a presumption of fitness:** Persistence *is* evidence of utility. Even if you reconstruct the original purpose and prove it obsolete, Burke argues the component may have evolved to mitigate unknown failures ("It survived because it works"). Here, the burden shifts to *preservation*: Removal requires proving the component *never* added value — a higher bar.  

  Chesterton demands an audit trail; Burke treats longevity as the audit trail. Chesterton allows removal after investigation; Burke implies investigation alone is insufficient because the system encodes wisdom beyond individual comprehension.  

  ---

  ### Residue  
  **Your complications expose fault lines:**  

  1. **The Orphaned Invariant Incident:**  
     - **Chesterton:** Vindicated. Your team skipped reconstructing the "rare combination of conditions" (failure mode). The invariant wasn’t vestigial — it was armor against an unmodeled blast radius.  
     - **Burke:** Undermined. The invariant persisted due to **tribal knowledge loss**, not fitness. Burke’s "persistence = fitness" claim fails here: It survived because it was forgotten, not because it was essential.  

  2. **Persistence ≠ Fitness (Lock-in/Abandonment):**  
     - **Chesterton:** Unaffected. It cares *why* something persists, not that it does. A 20-year-old design kept by **switching costs** would fail its "recover purpose" test.  
     - **Burke:** Damaged. If systems persist due to **vendor lock-in** or **knowledge attrition**, longevity is **corrupted telemetry**. Burke struggles here: Persistence could signal dysfunction (e.g., no budget for modernization) — not wisdom.  

  **Gaps in your vocabulary:**  
  - **Transgenerational Subject:** Burke’s "inherited institution" implies a *collective mind* across time — your "tech-debt register" lacks this. Engineers see code; Burke sees ancestral judgment.  
  - **Attachment vs. Understanding:** Burke values *reverence* for legacy systems as social glue. Your terms treat systems as artifacts; Burke treats them as covenants.  
  - **Authority of Age:** Burke’s "authority beyond individual reasoning" has no counterpart. Your "orphaned invariant" is a risk; for Burke, it’s a sacred, inscrutable totem.  

  ---

  ### Verdict  
  The residue **indicts Burke’s argument**, not your vocabulary. Your framework — focused on recoverable causality (blast radii, reversibility) — handles Chesterton cleanly and exposes Burke’s flaws:  
  - "Persistence as fitness" fails when systems fossilize due to lock-in or abandonment.  
  - Burke’s "transgenerational authority" is romantic but unsupported in software, where legacy often means **undocumented debt**, not distilled wisdom.  
  Chesterton’s rule is a tool; Burke’s is a dogma. Your vocabulary gaps aren’t oversights — they’re evidence that Burke’s claims *don’t map cleanly* to systems where persistence is often accidental, not authoritative.
