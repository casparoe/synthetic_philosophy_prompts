  First, I need to map each audience member's likely objections. The four EA-adjacent consequentialists will focus on inefficiency and QALY tradeoffs. The Kantian will reject complaints as currency entirely. The Scanlonian ally worries about slippery slopes. The decision theorist cares about ex ante/ex post framing. The philosophy-of-law duo will probe tort law parallels. And yes, the user's fear about menu-dependence is spot-on—it's a structural vulnerability.

  Hmm... the user's deepest need isn't just rebuttals; it's showing their model survives contact with radically different frameworks. The reply that must land is the linkage condition's non-utilitarian core—it doesn't sum complaints but checks if each person's burden was avoidable individually. If that collapses, the whole thesis fails. 

  The unspoken trap? Probably the "why not just use risk pools?" objection from the decision theorist. If linkage only works ex post, it fails in real-world decisions made under uncertainty. The user hasn't fully addressed that—I should flag it as the nightmare question. 

  For concessions: they should preemptively surrender that linkage looks utilitarian in edge cases (like the hearing damage scenario) but stress it blocks aggregation elsewhere. That disarms the consequentialists early. 

  *scribbles mental outline* 
  - Order objections by aggressiveness: consequentialists first (they'll dominate), then Kantian, Scanlonian, decision theorist, tort law, menu-dependence last as the killshot attempt. 
  - For EA crew: emphasize that QALY math would demand insane trades (e.g., paralyze one to cure millions of headaches) and linkage avoids that. 
  - Kantian reply needs meta-justification: complaints are what actual people appeal to in moral disputes. 
  - Scanlonian's stability worry? Stress that linkage is binary—it's either satisfied or not—no middle ground. 
  - Tort law angle is actually a gift! Use it to show linkage mirrors proximate cause doctrines. 

  ...And hope nobody asks if linkage is computable under ignorance. *winces*
answer: |-
  Here's a battle-tested Q&A prep sheet designed for your specific audience and thesis. The objections are ordered by likely sequence/aggressiveness, phrased authentically, with concise answers, key concessions, the critical reply, and the nightmare question.

  **Core Concession To Make Early (In Talk):** "I concede that the Linkage Condition *can* sometimes align with QALY-maximizing outcomes in specific scenarios (like my central case). But crucially, it *systematically diverges* in ways that preserve core deontic constraints consequentialism abandons – it absolutely forbids aggregation in standard headcount cases or when burdens *are* severable, even when QALYs scream for it. It's not QALYs in disguise."

  **The Single Reply That Must Land (For Scanlonian/All):** "Linkage doesn't sum complaints *at all*. It asks a prior question: *Was it even possible to spare this specific individual without sparing everyone else?* If the answer is 'No' (burdens are jointly unavoidable), *then and only then* does the *size* of the group facing the *same* unavoidable burden become relevant to each member's reasonable rejection. It's about the *structure of choice*, not the sum of suffering. This avoids collapse because aggregation is strictly conditional on this non-summative fact."

  **Q&A Prep Sheet (8 Key Objections):**

  1.  **The Consequentialist (EA/QALY Focus - First & Loudest):**
      *   **Objection:** "Why erect this arbitrary 'linkage' barrier? You admit aggregation in your hearing loss case *only* because it coincidentally gets the QALY-efficient result. But QALYs give a *general*, *principled* answer for *all* trade-offs. Doesn't your view just cripple effective altruism by forbidding obviously beneficial aggregation elsewhere? Why prefer an ad hoc exception over a universal metric?"
      *   **Answer (2 min):** "Linkage isn't arbitrary; it's grounded in respecting each person as a separate justificatory hurdle. QALYs *are* arbitrary in their permission to sacrifice individuals whenever net benefit tips. Linkage *protects* individuals from being traded away *unless* their fate was literally tied to others in the choice context. Yes, this forbids some QALY-efficient trades (like saving one life vs. curing millions of headaches), but that's the *point* – it prevents individuals from being mere containers for utility. Effective action doesn't require dissolving individual claims."
      *   **Concede:** Linkage can block some QALY-maximizing interventions involving separable burdens.

  2.  **The Kantian (Complaint Currency):**
      *   **Objection:** "You're building your castle on sand. Complaints about burdens are the wrong currency for morality! The fundamental issue is respecting rational agency and autonomy as ends-in-themselves. Framing everything in terms of 'rejectable complaints' about welfare impacts already concedes too much to consequentialism. Why should the permissibility of harming depend on aggregating subjective grievances?"
      *   **Answer (2 min):** "Contractualism starts from what we owe *to each other* as persons capable of justification. Complaints aren't mere subjective grievances; they are expressions of how principles affect important interests central to living a life (health, autonomy, etc.) – interests whose protection *is* required for respecting agency. Linkage focuses precisely on whether a proposed principle (e.g., 'save the one') imposes an *unavoidable* burden on others *as individuals*, given the feasible alternatives available. It respects each person's status by demanding a justification they couldn't reasonably reject *given their specific situation*."
      *   **Concede:** Contractualism prioritizes justifiability *to individuals* over abstract duties to rational agency *as such*.

  3.  **The Scanlonian (Instability Worry):**
      *   **Objection:** "I sympathize with the impulse, but linkage feels unstable. You carve out *one* exception to non-aggregation for 'joint unavoidability'. But as soon as you allow numbers to count *there*, what principled barrier stops it elsewhere? Won't any clever framing make burdens *seem* linked? This looks like a slippery slope back to utilitarianism via the back door."
      *   **Answer (2 min):** "This is the core stability point. Linkage isn't a vague exception; it's a *binary, structural condition* about the choice set: **Could we have spared *this specific person* without also sparing *every other person* in the relevant group facing the burden?** If 'No' (true joint unavoidability), *then* the size matters for each. If 'Yes', it doesn't. This is stable because it's grounded in the *actual causal/feasibility structure* of the alternatives, not perceived similarity or framing. It doesn't sum complaints; it checks if *individual avoidance* was impossible. Pressing it collapses aggregation *away* in separable cases, not towards utilitarianism." **(CRITICAL REPLY DELIVERED HERE)**
      *   **Concede:** Defining the "relevant group" and "feasible alternatives" requires careful context-sensitivity, but this is inherent to contractualism, not unique to linkage.

  4.  **The Decision Theorist (Ex Ante/Ex Post):**
      *   **Objection:** "Your linkage condition is crucially ambiguous: is it assessed *ex ante* (from behind a veil, based on risk profiles) or *ex post* (looking at the actual distribution of burdens after the fact)? In your paraplegic/hearing case, is it defined by the actual identities known beforehand or the unavoidable structure of the choice presented? This has huge implications for real-world application under uncertainty."
      *   **Answer (2 min):** "Linkage is fundamentally an *ex post* condition applied to the *actual outcome and the choice that produced it*. We look back: Given the feasible alternatives *that were actually available* at the time of decision, was it possible to spare this *actual* paraplegic without sparing all *actual* hearing-loss sufferers (or vice-versa)? In my central case, because the hearing loss group was unidentified *and* the mechanism was such that preventing *any* hearing loss required preventing *all* (or diverting resources entirely), the burdens *were* jointly unavoidable *ex post* for the group who ended up burdened. It hinges on the actual causal structure of the options, not pre-decision risk probabilities." *(Be prepared for follow-up on uncertainty cases)*.

  5.  **Consequentialist Follow-Up (QALY Scope):**
      *   **Objection:** "Okay, but even granting linkage, your view seems wildly impractical. How do we *know* burdens are 'jointly unavoidable' in complex policy? It paralyzes decisions. QALYs provide a clear, actionable decision procedure *now*. Isn't a messy, potentially inoperable theory worse than a clear, slightly imperfect one?"
      *   **Answer (2 min):** "Practicality is important, but not a trump card over moral truth. Linkage provides a *moral constraint* on permissible aggregation, not a complete decision procedure. We *already* make complex causal/feasibility judgments in policy (e.g., defining 'direct causation' in torts, assessing 'but-for' scenarios). Linkage adds: 'Could we have targeted relief to *this* subgroup?'. When true joint unavoidability is clear (like diverting a fixed resource bundle), we *can* apply it. When burdens are clearly separable (e.g., individual medical treatments), we *must not* aggregate. QALYs' 'clarity' comes at the unacceptable cost of ignoring individual separateness in those separable cases."

  6.  **Philosophy-of-Law (Tort Standing):**
      *   **Objection:** "Interesting. How does this 'linkage' map onto tort concepts like standing, proximate cause, or indivisible injury? If hundreds suffer hearing loss from a single negligent act, tort often treats it as one harm or allows class actions. Does linkage align with that aggregation in law?"
      *   **Answer (2 min):** "There's a potential parallel, which is encouraging! Linkage resonates with the idea that when a defendant's action creates an *indivisible harm* to a group (e.g., polluting a water supply affecting many), the harm to each is seen as interconnected, potentially justifying aggregation for standing or damages. Conversely, in cases of distinct, separable injuries (e.g., separate car crashes), aggregation isn't permitted – each plaintiff must prove their distinct injury and causation. Linkage provides a *moral justification* for why this legal distinction might be sound: aggregation is only permissible when the harm to each was *unavoidably bundled* by the nature of the wrongful act and the available alternatives to avoid it."

  7.  **Philosophy-of-Law Follow-Up (Corrective Justice):**
      *   **Objection:** "But tort is about *corrective justice* between wrongdoer and victim. Your linkage seems focused on *distributive* choices (who to save). How does it handle the bilateral structure of torts?"
      *   **Answer (2 min):** "You're right that my focus is primarily on distributive choices (saving A vs. saving B). However, the core *moral logic* of linkage – that burdens imposed must be justifiable to each person burdened, especially regarding whether their burden was avoidable – can inform the *wrongfulness* aspect of torts. If an act foreseeably creates a situation where burdens are jointly unavoidable for a group (like the pollution example), the *failure* to prevent that bundled harm might constitute the wrong to each member, supporting the permissibility of aggregating their claims *against the wrongdoer*. It's more foundational than corrective justice *per se*, but sets the stage for it."

  8.  **The Menu-Dependence Killshot (Likely from Scanlonian or Sharp Consequentialist):**
      *   **Objection:** "Your entire theory seems dangerously menu-dependent! Whether burdens are 'jointly unavoidable' depends entirely on which alternatives happen to be on the table. Imagine your paraplegic/hearing case, but suppose a *third* option existed: spend slightly more to spare the paraplegic *and also* spare a *subset* of the hearing loss group. Suddenly, linkage fails! Their burdens *are* severable now. The permission to aggregate hinges on an arbitrary restriction of options. How is this a deep moral principle?"
      *   **Answer (2 min):** "This is a serious challenge, but it highlights a feature, not a bug. Morality *is* context-dependent; permissible actions depend on the *feasible alternatives actually available*. Linkage asks what we owe to people *given the real choices we face*. If a better option exists that severs the link (sparing some without sparing all), we *must* consider it! Failing to use that option might itself be wrong. Linkage doesn't bless limited menus; it tells us how to evaluate claims *within* the actual menu. Demanding morality ignore feasible alternatives is unrealistic. The principle is: *Given the options we have*, when sparing one requires sparing all, numbers count. If better options appear, we use them, and the justification shifts." *(Emphasize this reflects the real constraints of decision-making)*.

  **The Nightmare Question You Hope Nobody Asks (Where You're Weakest):**

  *   **"How does Linkage handle probabilistic unavoidability or risk imposition?"**
      *   **Why it's nasty:** Your central case likely relies on *certainty* about the outcomes and the causal link (preventing *any* hearing loss required preventing *all*). But most real decisions involve risk. Imagine: You can save Identifiable Vic from paraplegic *or* take Option B, which has a 90% chance of sparing all 500 from hearing loss and a 10% chance of sparing none. Is Vic's burden "jointly unavoidable" with the 500? Ex ante, Vic faces a 10% risk of paraplegic *if* you choose B, while each of the 500 faces a 90% risk of hearing loss *if* you save Vic. Does linkage apply? If so, how? Ex ante or ex post? This exposes a major gap. If you try to stretch linkage to ex ante risk, it risks collapsing into standard ex ante contractualism/aggregation the Scanlonian fears. If you stick rigidly to ex post, linkage becomes nearly inapplicable to risky decisions, making your theory impotent for many crucial cases. You likely *haven't* fully developed this aspect, and it could unravel your theory's applicability.

  **Prep for Nightmare Question:** Have a nascent response ready: "This is a crucial area for development. My current intuition is that linkage remains primarily an *ex post* evaluation of the actual outcome. However, the *ex ante justification* for choosing a risky policy must still consider the potential *ex post* linkages it might create. Choosing a policy that creates a high probability of a situation where burdens *will be* jointly unavoidable ex post might require justification akin to linkage *in expectation*. But this needs careful elaboration beyond this paper's scope." (Acknowledge the complexity, don't try to solve it on the spot, point to future work).
