  For their derivable vs simulable distinction, this seems crucial. Many system behaviors are only observable at runtime, even if theoretically determined by code. This maps well to philosophical emergence concepts while avoiding metaphysics. Their hunch about causation seems right - simulability doesn't require "extra" entities.

  Now the residue analysis: Their engineering vocabulary handles mechanisms and patterns well, but struggles with intentionality (reasons vs causes) and difference-making explanations. This might actually be useful for their work - understanding outages often requires both mechanistic and counterfactual reasoning. I should flag this as potentially valuable.

