  **Note on Contested Views:**  
  - Herodotus' reliability % is conservative; "maximalists" (e.g., Waters) might push to 40%, "minimalists" (Fehling) near 10%.  
  - Thucydides' speeches: "Gist" vs. "invention" remains hotly debated.  
  - Against-interest: Universally seen as *indicative* but not *conclusive* (consensus).  
  - Bias subtraction: All agree it's not mathematical; the *process* I describe (triangulation, typological analysis) is standard practice.
