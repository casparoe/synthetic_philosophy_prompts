  Alternatively, we can use the response to adding people at a level just above the critical level to a population that is very large and at a high level. But note that we have:

     Verdict 4: adding 10 million at 5 to 1B at 90 makes it worse. This is explained by both models.

     Verdict 5: adding at 55 (which is below the critical level) makes it worse, and at 59 makes it better.

     We don't have a verdict for adding at a level just above critical to a base that is very high.

