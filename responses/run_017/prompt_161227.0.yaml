     However, the person at 70 has positive f(70). But in the critical-level model, 70-57=13>0.

     So the difference is that the prioritarian model with a concave function does not add linearly. It values the two persons at 80 more than the one at 90 and one at 70 because of the concavity: the drop from 90 to 80 is more significant in the transformed scale than the drop from 80 to 70.

