     In a concave prioritarian model:
          V(D)=2e9*f(80)
          V(E)=1e9*f(90)+1e9*f(70)

          If f is concave, then by Jensen's inequality: 
               f(80) = f( (90+70)/2 ) > (f(90)+f(70))/2   [if f is strictly concave]
          Therefore: 2*f(80) > f(90)+f(70)

