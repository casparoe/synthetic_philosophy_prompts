  In summary:

     The open case:
        Adding 10 million at 45 to 1B at 90: worse.
        Adding 10 million at 45 to 1B at 30: worse.
        The magnitude of the change is the same in both cases.

     I bet on critical-level utilitarianism with c in (55,59) (specifically about 57) because it is the simplest and fits all the data.

