answer: |-
  ### 1. The job description  
  The formalism must guide high-stakes decisions (e.g., allocating a decade of career time and a major instrument) when a hypothesis rests *only* on 4–5 heuristic arguments. Each argument is individually weak: a skeptic can invalidate any by swapping one plausible assumption. The formalism must judge when such arguments are "independent enough" to cumulatively strengthen confidence, and when they collapse into redundancy. It fails if it:  
  - Demands unrealistic precision (e.g., exact probabilities).  
  - Overlooks hidden dependencies (e.g., shared undocumented assumptions).  
  - Yields arbitrary outcomes (e.g., sensitivity to how an argument is subdivided).  

  ---

  ### 2. The desiderata  
  **(a) Shared-input leakage**  
  *Case*: Two arguments from different fields both covertly rely on the same rough estimate (e.g., a material’s thermal conductivity).  
  *Constraint*: **Inputs/Combination rule**. The formalism must flag dependence *not declared by the arguer*, not just explicit links. It must degrade trust if undisclosed shared inputs surface later.  

  **(b) Re-graining**  
  *Case*: Identical reasoning presented as 3 coarse steps (seemingly independent) vs. 30 fine-grained steps (revealing interdependence).  
  *Constraint*: **Combination rule**. Output robustness must not hinge on argument granularity. A valid formalism should neutralize "step inflation" tactics.  

  **(c) The ratchet**  
  *Case*: 8 arguments, each barely shifting confidence, jointly driving near-certainty. Is this legitimate convergence or fallacious multiplication?  
  *Constraint*: **Combination rule**. The formalism must block unreasonable certainty from piling up weak arguments. It should impose diminishing returns or detect "pseudo-independence."  

  **(d) The one-shot argument**  
  *Case*: A novel argument shape (e.g., based on emergent AI behavior) with no track record of reliability.  
  *Constraint*: **Inputs**. The formalism cannot presuppose a reference class (e.g., "arguments of type X are right 70% of the time"). Any reliance on historical performance must be explicit and optional.  

  **(e) Retrospective collapse**  
  *Case*: Discovering a shared load-bearing flaw (e.g., all arguments assume linearity) should annihilate the cumulative case, not just subtract one argument’s weight.  
  *Constraint*: **Combination rule**. The formalism must model systemic fragility: shared errors should catastrophically undermine convergence, not merely incrementally reduce it.  

  **(f) Imprecise inputs**  
  *Case*: Heuristics yield "factor-of-ten" estimates, not likelihoods. A formalism forcing precise probabilities (e.g., LR=5.2) misrepresents the evidence.  
  *Constraint*: **Output**. Outputs must be qualitative (e.g., "weak/moderate/strong convergence") or explicitly interval-based. False precision is a failure mode.  

  ---

  ### 3. Load-bearing or factional  
  **Non-negotiable**: (a), (e), (f).  
  - *(a)* and *(e)* target hidden dependencies and systemic fragility—critical for real-world heuristic arguments where undisclosed assumptions are endemic. Ignoring these invites catastrophic overconfidence.  
  - *(f)* is essential to honor the epistemology of rough estimates; imposing precise probabilities distorts the input.  
  **Factional**: (c) and (d).  
  - *(c)* reflects Bayesian vs. non-Bayesian tensions: Bayesians accept multiplicative convergence if independence holds; error-statisticians demand severe testing and distrust "soft" accumulation.  
  - *(d)* divides frequentists (needing base rates) from Bayesian/subjectivists (priors can absorb novelty).  

  ---

  ### 4. Where the list defeats itself  
  The triad **(b) Re-graining**, **(c) The ratchet**, and **(e) Retrospective collapse** cannot be jointly satisfied.  
  - *(b)* demands granularity-invariance: independence assessments must not depend on step-counting.  
  - *(c)* requires blocking multiplicative escalation from many weak arguments.  
  - *(e)* insists that discovering shared flaws collapses the entire case.  
  But if independence is granularity-invariant *(b)*, and many arguments *can* ratchet confidence *(c)*, then a shared flaw *(e)* might only partially reduce confidence if arguments are "non-redundant" under coarse descriptions. **Resolution**: Drop *(c)*'s anti-ratchet stance as too prescriptive. Instead, detect dependence via *(a)* and *(e)* to *prevent* illegitimate ratcheting.  

  ---

  ### 5. The most exclusionary requirement  
  **(a) Shared-input leakage** excludes the most plausible accounts. Bayesian networks, explanatory coherence, and witness models all track *declared* dependencies but lack machinery to uncover *undisclosed* shared inputs. Formalisms assuming "all relevant factors are modeled" (e.g., standard probability frameworks) fail here. Only approaches mandating *dependence auditing*—systematically scanning for hidden common inputs—could satisfy this, but such audits are heuristic themselves.  

  ---

  ### 6. Scorecard  
  **1. Dependence-audited Bayesianism**  
  - *Pros*: Handles *(e)* collapse (via likelihood ratios), *(f)* imprecision (using intervals).  
  - *Cons*: Fails *(a)* (unless augmented with input-screening protocols), struggles with *(b)* (granularity affects conditional independence).  

  **2. Explanatory Coherence (Thagard-style)**  
  - *Pros*: Natural fit for *(e)* (systemic collapse if core assumption refuted), neutral on *(d)* (no base rates needed).  
  - *Cons*: Fails *(a)* (no input-tracking), ignores *(f)* (scores arguments precisely).  

  **3. Robustness Analysis (Wimsatt-inspired)**  
  - *Pros*: Addresses *(a)* by triangulating independent derivations; handles *(f)* via qualitative convergence.  
  - *Cons*: Weak on *(e)* (no formal collapse mechanism), vague on *(c)* (ratchet unchecked).  

  *(No account satisfies all; (a) and (e) are the strongest filters.)*
