  Okay, let me unpack this query. The user is a science writer focusing on the units-of-selection debate, specifically seeking export-grade questions that would impact how non-biologists use evolutionary explanations. They want advice for a foundation funding theoretical work, prioritizing questions where settled answers would change how social scientists phrase or defend their arguments.

  Hmm, the user's framing suggests frustration with academic insularity. They're implicitly asking: "Which debates actually matter outside biology circles?" The emphasis on "respectable" explanations indicates concern about misuse of evolutionary concepts in other fields. I should focus on conceptual clarity that prevents overreaching analogies.

  Four candidates stand out as truly export-grade:
  First, the screening-off question about higher-level causality. This cuts to the heart of whether group selection explanations add value beyond individual-level accounts. If higher levels don't screen off lower ones, social scientists using multilevel selection might be committing a category error. This is urgent because it's foundational - getting it wrong means entire fields could build on shaky metaphors.

  Second, the grain problem. The mismatch between inheritance and selection levels is rampant in cultural evolution. Solving this would force psychologists to clarify whether they're tracking meme-like units or institutional patterns. It's highly tractable theoretically through modeling existing cultural transmission data.

  Third, the lineage problem for fuzzy units. Concepts like "firms evolving" often ignore that corporations merge and split unlike biological species. Clarifying this would prevent economists from naively applying population genetics models. Surprisingly tractable via philosophy of biology tools analyzing existing case studies.

  Fourth, the causal partitioning question. But here's where I disagree with the user's implied importance - this is largely a semantic debate. Whether we call something "group selection" or "inclusive fitness" rarely changes predictions for social scientists. I'd deprioritize it despite its current prominence.

  The testability question doesn't make my cut because non-biologists rarely engage with cross-level byproducts anyway. It's more an in-house accounting problem.

  For urgency ranking: Screening-off comes first because it's the gatekeeper for all higher-level claims. Grain problem next due to direct relevance to cultural transmission. Lineage third as it undermines common analogies. The partitioning debate gets minimal funding as mostly verbal.

  What would change priorities? If screening-off gets resolved (say via new formal equivalence proofs), grain jumps to #1. If cultural data shows consistent inheritance patterns contradicting current models, lineage moves up. The key is tracking which resolutions would force social scientists to rewrite their theories rather than just relabel existing ideas.
answer: |-
  Here’s a strategic prioritization of export-grade questions, judged by downstream impact on non-biologists, theoretical tractability, neglect, and urgency. I deprioritize in-house disputes and rank four core questions where progress would immediately reshape how social scientists justify evolutionary explanations.

  ### **Ranking Criteria**
  - **Downstream Impact**: How much would a settled answer force non-biologists to revise/defend their claims?  
  - **Tractability**: Can conceptual/theoretical work resolve it without new data?  
  - **Neglect**: Is it under-discussed relative to its importance?  
  - **Urgency**: How often do flawed assumptions currently distort exported explanations?  

  ### **Top Export-Grade Questions (Ranked)**
  1. **Does a higher-level description *screen off* lower-level dynamics?**  
     - **Why it matters**: Non-biologists (e.g., psychologists positing "group selection" in cooperation) assume higher-level units (groups, cultures) have causal power beyond their parts. If higher levels *don’t* screen off lower dynamics—meaning they add no unique predictive or explanatory power—these claims collapse into reductionist storytelling.  
     - **Tractability**: High. Requires formal modeling (e.g., causal Bayes nets) to test if group properties *absorb* individual-level variance in evolutionary outcomes. Existing data on cultural evolution or microbial systems can be reanalyzed.  
     - **Neglect**: Severe. Screening-off is rarely tested explicitly, though it’s the linchpin for legitimizing multilevel explanations.  
     - **Urgency**: Critical. If higher levels are merely bookkeeping, entire fields (e.g., evolutionary psychology, cultural evolution) must abandon "selection acting on X" rhetoric.  
     - **Move up/down**: A proof that group fitness metrics *always* reduce to individual fitness + interactions would downgrade this. Evidence of emergent group properties that predict novel phenomena (e.g., collapse) would elevate it.  

  2. **The Grain Problem: How to define units when inheritance & selection levels mismatch?**  
     - **Why it matters**: Cultural evolution (e.g., "memes" vs. institutions), epidemiology, and economics face this constantly. If heritable variation is at one level (e.g., individual beliefs) but selection acts at another (e.g., institutional survival), non-biologists misattribute causality (e.g., "firms evolve" vs. "people in firms adapt").  
     - **Tractability**: Moderate-High. Requires formalizing "heritable information" across contexts (e.g., cultural transmission as constrained diffusion) and modeling selection gradients. No new data needed—theorists can mine anthropology or organizational ecology case studies.  
     - **Neglect**: High. Often hand-waved in exported theories (e.g., "genes vs. memes" oversimplifications).  
     - **Urgency**: Acute. Misaligned grains lead to flawed policy (e.g., treating institutions as units when change is driven by individual turnover).  
     - **Move up/down**: A general framework for mapping heritability-selection mismatches (e.g., in horizontal gene transfer) would solve this. Persistent failure to formalize cultural "units" would increase urgency.  

  3. **Can selection apply to entities without clean lineages (firms, languages, demes)?**  
     - **Why it matters**: Non-biologists routinely analogize from biology to fuzzy units (e.g., "languages evolve," "firms are selected"). But if selection requires tree-like descent with modification, these analogies fail. Economists and anthropologists need to know if their "evolutionary models" are literal or metaphorical.  
     - **Tractability**: High. Philosophers of biology have tools to analyze "lineage" criteria (e.g., identity, persistence, heritability). Existing case studies (e.g., language change, corporate mergers) suffice.  
     - **Neglect**: Moderate. Debated in-house but rarely clarified for export.  
     - **Urgency**: High. Prevents misapplication (e.g., assuming firms have "fitness" like organisms).  
     - **Move up/down**: A rigorous account of "lineage" for non-biological entities (e.g., defining languages via token transmission) would resolve this. Proof that all non-tree-like systems reduce to individual action would kill the debate.  

  4. **Is the gene’s-eye view vs. multi-level selection debate *causal* or *statistical*?**  
     - **Why it matters**: Social scientists borrow "selfish gene" rhetoric (e.g., in economics) or "group selection" (e.g., in sociology). If these are just mathematical equivalences (variance partitioning), exported claims become arbitrary packaging.  
     - **Tractability**: Moderate. Requires defining "causality" in evolutionary theory (e.g., interventionist vs. statistical approaches).  
     - **Neglect**: Low (overrated in-house). The debate is saturated with technical papers but lacks exportable clarity.  
     - **Urgency**: Moderate. Non-biologists inflate rhetorical differences into theoretical schisms.  
     - **Move up/down**: A formal proof that all models reduce to the same causal graph would end this. Evidence that one approach predicts novel interventions (e.g., in cultural evolution) would elevate it.  

  ### **Deprioritized Questions**  
  - **Testability after byproducts/soft selection**: Primarily in-house. Non-biologists rarely engage these nuances; settling this wouldn’t change how they *phrase* explanations.  
  - **"What causal would have to mean"**: Semantic. Export hinges on *whether* causality differs, not definitions.  

  ### **Strategic Allocation**  
  Fund **3–4 postdocs on #1 (screening-off)**, **3 on #2 (grain problem)**, **2 on #3 (lineages)**, and **1–2 on #4 (causal vs. statistical)**. Why?  
  - #1 and #2 are **foundational**: Until they’re resolved, non-biologists can’t justify multilevel or cultural selection claims.  
  - #3 is **preventative**: It stops invalid analogies before they spread.  
  - #4 is **hygiene**: Clarifying this ends distracting polemics but offers less new insight.  

  **Bottom line**: Progress on screening-off and grain problems would force the biggest revisions in exported explanations—e.g., psychologists couldn’t claim "group selection" without proving emergent causality, and economists couldn’t treat firms as units without solving inheritance-selection mismatches. The foundation’s goal isn’t to settle biology’s internal disputes but to arm other fields with defensible evolutionary logic. These four questions deliver that.
