prompt: |-
  I am assembling the problem set for a graduate seminar on higher-order approaches to consciousness, and before I commit the syllabus to any of them I want the specification rather than the theories: what, exactly, does a higher-order account of state consciousness have to deliver in order to count as adequate?

  Fix the purpose first, since adequacy is relative to it. The theory is to be good enough to adjudicate, from behavioural and neural evidence, whether a given system has conscious experiences and which of its states are conscious. The verdicts I actually need are about: patients who are behaviourally non-responsive or only minimally responsive after brain injury; non-human animals with and without anything playing the role of a prefrontal metacognitive system; split-brain subjects; and feedforward artificial classifiers with no recurrent or top-down architecture. Any requirement that does no work in those cases is one I want flagged as idle for my purposes.

  Then the list. For each requirement, give the case or consideration that makes it a requirement — the phenomenon to be explained, the verdict it must reach, the distinction it must not collapse, or the empirical result it must not contradict — and mark whether it is (a) a constraint on any theory of consciousness, (b) one that bites specifically because of the higher-order architecture, or (c) a preference of some camp that I should refuse to grant. Among the cases I want handled:

  - the ordinary contrast between perceiving something and merely processing it, as in masked, inattentional and change-blindness cases, and in blindsight-style dissociation of discrimination from experience;
  - dreamless sleep and anaesthesia, where first-order sensory processing continues while experience is absent;
  - the generalised rock problem: a higher-order state that targets a state belonging to another subject, or to nothing mental at all. What makes a targeted state the subject's own, without presupposing that it already is? I do not want the answer to be that a state is conscious iff a higher-order state of that very subject targets it, since that says nothing until that very subject has been explicated non-circularly;
  - the empty-target case: hallucination and phantom limb, where the higher-order state has no first-order state to target, or targets one that is not there;
  - the attributive-mismatch case, which I do not think receives enough attention: suppose a subject's higher-order mechanism reliably picks out a currently active first-order state but systematically misdescribes its content — the higher-order tagging that normally goes with green is triggered when the first-order state is as of red. The theory must say whether the state is conscious, and whether what it is like tracks the content of the first-order state, the content attributed by the higher-order state, or neither;
  - the temporal-mismatch case: suppose, as the evidence on integration windows and on the relative sluggishness of metacognitive processing at least allows, that higher-order states update more slowly and more coarsely than the first-order states they target. The theory must then say whether consciousness is retrospective, coarse-grained, or systematically asynchronous with the first-order processing it is supposed to make conscious, and what it predicts we should find if so;
  - the unity case: many concurrent first-order states, one or few higher-order states — is the unity of a conscious field explained by the unity of the higher-order state, and what happens if the higher-order machinery is divided?
  - the structural constraints: the account must not generate a regress of higher-order states, and it must not quietly concede the same-order point by treating the terminating higher-order state as conscious in its own right rather than in virtue of a further state.

  Go on to the two questions I care most about. First, tell me which of the things people in this literature demand are genuine desiderata and which are仅仅 the prejudices of one side: candidates that worry me include the demand that a theory account for phenomenal character rather than for cognitive availability or reportability, the demand that it not make experience depend on conceptual sophistication, and the demand that it preserve the intuition that a state's being conscious is intrinsic to it rather than relational. Second, tell me whether some subset of the requirements is jointly unsatisfiable — I suspect one is, and if so, which conjunct I should drop and what that costs me. Then say which single requirement does the most exclusionary work: the one that, if I relaxed it, would let in a theory I would otherwise reject.

  Close with a brief scorecard — a few lines each, and a table is fine — of the thought-based version associated with Rosenthal, the quasi-perceptual version associated with Lycan, and the same-order or self-representational alternative, against the list. Keep the weight on the criteria and their motivating cases rather than on the scoring. If two of the requirements I have gestured at collapse into one, say so rather than padding the list.
reasoning: |-
  We are building a list of requirements for a higher-order theory of state consciousness. The purpose is to adjudicate, from behavioral and neural evidence, whether a given system has conscious experiences and which states are conscious, in the following cases:
     - Behaviorally non-responsive or minimally responsive patients (e.g., disorders of consciousness)
     - Non-human animals with and without prefrontal metacognitive systems
     - Split-brain subjects
     - Feedforward artificial classifiers (no recurrence or top-down)

  We are to list requirements, each with:
    (a) the case or consideration that makes it a requirement (phenomenon to explain, verdict, distinction, empirical result)
    (b) mark whether it is a constraint on any theory of consciousness (a), a higher-order specific constraint (b), or a camp preference we should refuse (c)

  Then, we'll address two main questions:
    1. Which demands in the literature are genuine desiderata vs. prejudices?
    2. Is there a jointly unsatisfiable subset? If so, which conjunct to drop and at what cost? Also, which requirement does the most exclusionary work?

  Finally, a scorecard for:
    - Rosenthal's thought-based (HOT)
    - Lycan's quasi-perceptual (HOP)
    - Same-order/self-representational

  We'll group the requirements by the cases listed, and then add the structural constraints.

  Note: The user has a list of cases to be handled. We'll structure the requirements accordingly.

  List of Requirements:

  1. **Ordinary Contrast Requirement**: 
     - The theory must explain the contrast between perceiving (conscious) and merely processing (unconscious) in cases like masking, inattention, change blindness, and blindsight. In blindsight, the subject can discriminate (process) but lacks experience.
     - Motivating cases: Blindsight (dissociation between discrimination and experience), masked priming, inattentional blindness.
     - Verdict needed: In blindsight, the state is not conscious despite behavioral evidence of processing. In normal vision, it is.
     - Type: (a) General constraint (any theory must explain this).

  2. **Absence in Dreamless Sleep/Anesthesia Requirement**:
     - The theory must explain why in dreamless sleep and under anesthesia, there is no conscious experience even though some first-order sensory processing may continue (e.g., evoked potentials).
     - Motivating cases: Sleep and anesthesia studies showing preserved first-order neural responses without awareness.
     - Verdict: In these states, there is no conscious experience.
     - Type: (a) General constraint.

  3. **Generalized Rock Problem**:
     - The theory must explain what makes a targeted state the subject's own without circularity. We cannot say a state is conscious iff a higher-order state of that very subject targets it without a non-circular account of "that very subject".
     - Motivating case: A higher-order state that targets a state of another subject (e.g., in a brain-to-brain interface) or a non-mental state (e.g., a rock). We need to avoid misattribution of consciousness to rocks or other subjects.
     - Verdict: The state must be the subject's own state. The theory must non-circularly specify what it is for a state to belong to the subject.
     - Type: (b) Higher-order specific (because of the relational nature of the theory).

  4. **Empty-Target Problem**:
     - The theory must handle cases where the higher-order state has no first-order state to target (hallucination) or targets a state that is not there (phantom limb). 
     - Motivating cases: Hallucinations (e.g., visual hallucination of a snake where there is no snake) and phantom limb (feeling in a limb that is amputated).
     - Verdict: The subject has a conscious experience (e.g., seeing a snake, feeling a phantom limb) even though there is no corresponding first-order sensory state (or a distorted one).
     - Type: (b) Higher-order specific (since the theory relies on a relation to a first-order state).

  5. **Attributive-Mismatch Problem**:
     - The theory must say what happens when the higher-order state systematically misdescribes the content of the first-order state (e.g., HO tags as green when the FO state is as of red). 
     - Questions: Is the state conscious? What is the phenomenal character? (FO content, HO content, or neither?)
     - Motivating case: Hypothetical or experimental manipulation where the HO mechanism is rewired to misattribute.
     - Verdict: The theory must make a prediction about the content of experience in such a case. (Note: This is a point of dispute among HOT theories.)
     - Type: (b) Higher-order specific.

  6. **Temporal-Mismatch Problem**:
     - The theory must address the possibility that higher-order states update more slowly and coarsely than first-order states. Then, is consciousness retrospective, coarse-grained, or asynchronous?
     - Motivating case: Empirical evidence on integration windows and metacognitive processing (e.g., metacognition lags behind perception). Also, split-brain cases might involve temporal asynchrony.
     - Verdict: The theory must predict what we should find in experiments (e.g., in timing tasks) and whether consciousness is delayed or coarse.
     - Type: (b) Higher-order specific (because of the two-level structure).

  7. **Unity of Consciousness**:
     - The theory must explain the unity of the conscious field (many concurrent FO states, one or few HO states). Also, what happens if the HO machinery is divided (as in split-brain)?
     - Motivating case: Normal unified consciousness vs. split-brain where unity may break down.
     - Verdict: In split-brain, the unity is disrupted. The theory should account for both unified and disunified cases.
     - Type: (a) General constraint (any theory must explain unity) but (b) because the HO theory has a specific architecture to address it.

  8. **Structural Constraints**:
     a. *No Regress*: The theory must avoid an infinite regress of higher-order states (each requiring a higher-order state to be conscious).
     b. *Terminating State*: The terminating higher-order state must not be treated as conscious in its own right without a further state (to avoid conceding same-order).
     - Motivating case: Theoretical problem of regress (if every conscious state requires a higher-order state, then we need an infinite chain). Also, if the HO state is conscious without a further state, then the theory might collapse into a same-order view.
     - Type: (b) Higher-order specific.

  Now, the two main questions:

  **Question 1: Which demands are genuine desiderata vs. prejudices?**

  Genuine desiderata (must-haves for the purpose):
    - The theory must account for the presence or absence of conscious experiences in the target cases (patients, animals, split-brain, AI) based on evidence. This includes the ability to explain the contrasts (like blindsight) and absences (like anesthesia).
    - The theory must not be circular (as in the generalized rock problem).
    - The theory must be empirically testable and consistent with known neural and behavioral data (e.g., temporal mismatch might be an empirical challenge that the theory must address).

  Prejudices (camp-specific demands that we can refuse):
    - *Phenomenal character vs. cognitive availability/reportability*: Some insist that a theory must account for phenomenal character (what it's like) and not just reportability. However, for the purpose of adjudicating from behavioral and neural evidence, we are constrained by what is measurable. Reportability and cognitive availability are often the only behavioral markers. We can refuse the demand that the theory must account for phenomenal character in a way that transcends all possible evidence. (But note: the theory must still explain why there is something it's like in the cases where we have evidence of consciousness, so it's a genuine part of the requirement. However, the user's purpose is tied to evidence, so we can focus on the empirically accessible.)
    - *Not depend on conceptual sophistication*: Some argue that consciousness should not require sophisticated concepts (e.g., for animals or infants). This is a genuine desideratum because we need to ascribe consciousness to animals without advanced concepts. Refusing this would cost us the ability to ascribe consciousness to non-linguistic animals. So it's genuine for our purposes (given the animal case).
    - *Intrinsicness*: The demand that a state's being conscious is intrinsic rather than relational is a camp preference (of first-order theorists) and we can refuse it. Higher-order theories are relational by nature, and the purpose is to evaluate higher-order approaches.

  **Question 2: Joint unsatisfiability and exclusionary work**

  - *Joint unsatisfiability*: The requirements that might be jointly unsatisfiable are:
      - The **attributive-mismatch** requirement: If the HO state misattributes, what is the content of consciousness?
      - The **intuition of transparency** (which we didn't list explicitly but is often in the background): We typically take our conscious experience to directly reveal the world, so we might expect the FO content to be what we experience. But if the HO theory says that the content of consciousness is the content of the HO state, then in misattribution we would experience the HO content (e.g., green when the FO is red). This might conflict with transparency.

    However, the user did not list transparency as a requirement, so we don't have to include it. But note that the attributive-mismatch forces a choice that might conflict with other intuitions.

    Another tension is between:
      - **Temporal mismatch**: If HO states are slower, then consciousness is delayed and retrospective.
      - **The immediacy of experience**: We often feel that our conscious experience is in real-time.

    But again, immediacy is an intuition we might refuse as a prejudice.

    A more serious tension is between:
      - **The empty-target problem**: In hallucination, we have a conscious experience without a corresponding FO state. The HO theory must account for this by allowing that the HO state alone (with no target) can produce an experience? But then we lose the relational aspect.
      - **The relational nature of the theory**: A state is conscious only by being targeted by a HO state. But if the HO state can be conscious without a target, then what is the role of the target?

    This might be a tension within the HO approach. One solution is to say that in hallucination, the HO state is a representation that represents a FO state that does not exist. But then the content of experience would be the content of the HO representation, and the FO state is not necessary. This leads to the possibility of "consciousness without a first-order state", which might be acceptable but then we must also explain why in normal cases we have both.

    However, we don't necessarily have a joint unsatisfiability among the listed requirements. But note:

    The **generalized rock problem** and the **empty-target problem** together might push the theory to a more permissive view: any HO state, even one that targets a non-existent state or a state of another, might produce consciousness. But that would violate the ownership condition. So we have:

      Requirement 3 (rock): Must not ascribe consciousness to a rock (or another's state).
      Requirement 4 (empty): Must allow consciousness in hallucination (where there is no target).

    How to satisfy both? The theory must have a way to restrict the HO states to those that are appropriately "owned" by the subject and are about (possibly non-existent) states of the subject. This might require an account of ownership that does not rely on the FO state.

    This is a challenge but not necessarily unsatisfiable. For example, the theory can require that the HO state is produced by the subject's own metacognitive system and is about a state that the system takes to be a current state of the subject. Then, a hallucination is such a state (it's about the subject's own state, even if that state doesn't exist) and a rock is not (because the HO state is not about a state of the subject).

    Therefore, we might avoid unsatisfiability by carefully defining the ownership condition.

  - *Exclusionary work*: The requirement that does the most exclusionary work is the **generalized rock problem**. If we relax it (allow that a HO state targeting anything can make that thing conscious), then we might include theories that ascribe consciousness too liberally (e.g., to a rock if a HO state targets it). But that would be unacceptable. So without this requirement, we might accept a theory that is clearly inadequate. Thus, it excludes theories that cannot account for ownership non-circularly.

    Alternatively, the **structural constraint** (no regress) is also very exclusionary because it forces the HO theory to have a terminating state that is unconscious. If we relax it, we might allow a regress or a self-conscious state, which might lead to a same-order theory.

    But note: the user wants a higher-order theory. So the structural constraint is essential to maintaining the higher-order character.

    Let's say the **structural constraint** is the most exclusionary because it defines the architecture as higher-order and not same-order. Without it, the theory might collapse into same-order. So we must keep it.

    However, the **rock problem** is also critical because without it the theory might not be able to avoid absurd ascriptions. But the rock problem is about ownership, and the same-order theory would also have to address it. So it's not exclusively HO.

    Therefore, the **structural constraint** does the most exclusionary work for maintaining the HO character.

  **Scorecard**

  We'll briefly evaluate three theories against the requirements:

  1. **Rosenthal's Higher-Order Thought (HOT)**:
     - States are conscious when there is a higher-order thought (a belief-like state) that one is in that state.
     - **Ordinary contrast**: Explains blindsight by absence of HOT for the first-order state.
     - **Sleep/Anesthesia**: Explains absence by absence of HOTs.
     - **Rock problem**: Requires that the HOT is about one's own state. Rosenthal might appeal to the concept of self, but it's unclear if it avoids circularity.
     - **Empty-target**: Hallucination: a HOT that represents oneself as having a state that one doesn't have. The experience is of the content of the HOT. So it allows for hallucination.
     - **Attributive-mismatch**: According to Rosenthal, the content of the HOT determines the content of consciousness. So if the HOT misattributes (says it's green when FO is red), then the experience is of green. This is controversial.
     - **Temporal mismatch**: HOTs might be slower, so consciousness would be delayed. Rosenthal might accept this.
     - **Unity**: The unity of consciousness is not directly explained by the unity of a HOT because there can be multiple HOTs. However, a single HOT might target multiple states? Rosenthal doesn't typically say that. So unity might be a challenge.
     - **Structural constraints**: Avoids regress by having unconscious HOTs. The terminating HOT is unconscious, so no problem.

  2. **Lycan's Higher-Order Perception (HOP)**:
     - Inner scanning: a quasi-perceptual process targets first-order states.
     - **Ordinary contrast**: Similar to HOT: blindsight due to lack of inner perception of the state.
     - **Sleep/Anesthesia**: Absence of inner perception.
     - **Rock problem**: Inner perception must be directed at one's own states. Ownership might be built into the faculty of inner sense.
     - **Empty-target**: Hallucination would be a malfunction of inner sense, producing an experience without a target. The content would be whatever the inner sense represents.
     - **Attributive-mismatch**: The content of inner perception determines the experience. So if inner sense misrepresents, the experience is of the misrepresented content.
     - **Temporal mismatch**: Inner perception might be slower, leading to delayed consciousness. Lycan might accept this.
     - **Unity**: The inner scanner might produce a unified representation of multiple states? Not clear. Split-brain might show disunity if the scanner is split.
     - **Structural constraints**: The inner perception state is unconscious? Lycan might say that the HOP state is not conscious unless targeted by a further HOP, so regress is avoided by having the topmost HOP state be unconscious.

  3. **Same-Order/Self-Representational**:
     - A state is conscious when it represents itself (or when it is part of a state that represents itself and the world).
     - **Ordinary contrast**: Blindsight: the state is not self-representing. But why not? The theory must explain what triggers self-representation.
     - **Sleep/Anesthesia**: Self-representation is absent.
     - **Rock problem**: A rock doesn't have mental states, so no self-representation. But what makes a state the subject's own? The state is by the subject, so it might avoid the problem.
     - **Empty-target**: Hallucination: a state that represents itself as having a content that isn't there. This seems possible.
     - **Attributive-mismatch**: If a state represents itself as having content C, then the experience is C. So if it misrepresents itself, then the experience is of the misrepresented content.
     - **Temporal mismatch**: Since it's same-order, there's no temporal gap. So consciousness is in real-time? But the self-representation might take time to form. It might not avoid the problem.
     - **Unity**: The unity of the conscious field might be explained by a single state that represents multiple contents and itself? But it's unclear. Split-brain might be a challenge.
     - **Structural constraints**: By being same-order, it avoids the regress because the state makes itself conscious. But there is a potential problem: if the state must represent itself, then what is the mechanism? It might require a complex state that is both first-order and self-referential.

  In summary, we present the requirements and then the scorecard as a table:

  | Requirement | HOT (Rosenthal) | HOP (Lycan) | Same-Order |
  |-------------|-----------------|-------------|-----------|
  | Ordinary Contrast | Good: explains by absence of HOT | Good: similar | Fair: must explain why self-representation fails in blindsight |
  | Sleep/Anesthesia | Good: absence of HOT | Good: absence of inner perception | Good: absence of self-representation |
  | Rock Problem | Fair: must avoid circularity in self-concept | Fair: inner sense must be directed appropriately | Good: avoids by being same-order (state is inherently owned) |
  | Empty-Target | Good: HOT without FO state yields hallucination | Good: inner perception without target | Good: self-representation without external content |
  | Attributive-Mismatch | Controversial: experience is HO content | Controversial: experience is HO content | Controversial: experience is the self-represented content |
  | Temporal Mismatch | Accepts delay | Accepts delay | Rejects delay (but might have processing time) |
  | Unity | Weak: multiple HOTs may not unify | Weak: inner scanner might not unify | Weak: self-representation of multiple contents? |
  | Structural Constraints | Good: unconscious HOTs | Good: unconscious HOPs | Good: no regress (self-representation) |

  Note: The same-order theory does not have a higher-order state in the traditional sense, so it's not a higher-order theory. But we are including it for comparison.

  Finally, the user's purpose: to adjudicate the target cases. All three theories can handle the patients and animals to some extent, but:
    - For animals without prefrontal cortex (which is thought to support HOTs), Rosenthal's HOT might struggle because it requires conceptual abilities. Lycan's HOP might also require a perceptual system that animals without prefrontal cortex lack. Same-order might be more liberal, but then we have to specify the mechanism.

  Given the user's cases, the same-order theory might have an advantage in animals without prefrontal metacognition because it doesn't require a separate higher-order system. But it might be harder to test.

  The most exclusionary requirement is the structural constraint because it forces the HO theory to have a terminating unconscious state. Without it, we might accept a same-order theory as a HO theory.

  But note: the user wants a higher-order approach. So we must maintain the structural constraint.

  We'll now write up the answer accordingly.
answer: |-
  ### Requirements for an Adequate Higher-Order Theory of State Consciousness  
  The adequacy of a higher-order (HO) theory is evaluated against its ability to adjudicate consciousness in specified cases (non-responsive patients, animals, split-brain subjects, feedforward AI) using behavioral/neural evidence. Each requirement is grounded in a specific phenomenon, distinction, or empirical constraint. Requirements are categorized as:  
  - **(a)** Constraint on any theory of consciousness.  
  - **(b)** Bites specifically due to HO architecture.  
  - **(c)** Camp preference (refuse if idle for your purpose).  

  #### Core Requirements and Their Motivation  
  1. **Ordinary Contrast Requirement**  
     - **What it must deliver**: Explain the dissociation between *conscious perception* (e.g., seeing a red apple) and *unconscious processing* (e.g., blindsight discrimination, masked priming).  
     - **Motivating cases**: Blindsight (discrimination without experience), inattentional blindness (processing without awareness).  
     - **Verdict needed**: In blindsight, the state is unconscious; in normal vision, it is conscious.  
     - **Type**: (a) General constraint.  

  2. **Absence in Dreamless Sleep/Anesthesia Requirement**  
     - **What it must deliver**: Explain why sensory processing persists without conscious experience (e.g., neural responses to stimuli during deep sleep).  
     - **Motivating cases**: Sleep studies showing preserved first-order (FO) neural activity without reported awareness; anesthesia with residual FO processing.  
     - **Verdict needed**: No conscious states in these conditions.  
     - **Type**: (a) General constraint.  

  3. **Generalized Rock Problem**  
     - **What it must deliver**: Non-circular account of why a HO state must target a state *owned* by the subject (not another subject or a non-mental state).  
     - **Motivating case**: Avoid misattributing consciousness (e.g., if a HO state targets a rock or another brain’s state).  
     - **Verdict needed**: A theory must not imply rocks can be conscious; must specify "ownership" without presupposing consciousness.  
     - **Type**: (b) HO-specific (relationality requires ownership criteria).  

  4. **Empty-Target Problem**  
     - **What it must deliver**: Account for conscious experiences without a corresponding FO state (e.g., hallucinations, phantom limb).  
     - **Motivating cases**: Visual hallucinations (no FO stimulus), phantom pain (no limb or nociceptive input).  
     - **Verdict needed**: Hallucinations are conscious experiences; FO states are unnecessary.  
     - **Type**: (b) HO-specific (HO states must generate consciousness even without a target).  

  5. **Attributive-Mismatch Problem**  
     - **What it must deliver**: Resolve whether consciousness tracks FO content, HO content, or neither when HO states misdescribe FO states (e.g., HO tags "green" when FO is "red").  
     - **Motivating case**: Hypothetical rewiring of HO mechanisms to systematically misattribute.  
     - **Verdict needed**: Predicts the content of experience (e.g., "red" vs. "green") and whether the state is conscious.  
     - **Type**: (b) HO-specific (content conflict inherent in representational hierarchy).  

  6. **Temporal-Mismatch Problem**  
     - **What it must deliver**: Address whether consciousness is retrospective, coarse-grained, or asynchronous if HO processing lags FO processing (e.g., HO updates slower than FO changes).  
     - **Motivating cases**: Neural evidence of metacognitive delays (e.g., Libet-style experiments); integration windows in perception.  
     - **Verdict needed**: Predicts empirical outcomes (e.g., if consciousness is delayed, experiments should show reporting lags).  
     - **Type**: (b) HO-specific (temporal decoupling threatens real-time awareness).  

  7. **Unity of Consciousness**  
     - **What it must deliver**: Explain how multiple FO states are unified into a single conscious field, and how disunity arises (e.g., split-brain).  
     - **Motivating cases**: Normal unified awareness vs. split-brain disunity; HO machinery division.  
     - **Verdict needed**: Split-brain subjects have two streams of consciousness; unity breaks when HO systems are severed.  
     - **Type**: (a) General constraint, but (b) HO leverages HO state unity to explain.  

  8. **Structural Constraints**  
     - **No Regress**: Avoid infinite HO chains (e.g., HO state requires HHO state, ad infinitum).  
     - **No Self-Intimating Terminus**: The highest HO state cannot be conscious "in its own right" (or it collapses into same-order view).  
     - **Motivating case**: Theoretical incoherence of regress; empirical implausibility.  
     - **Type**: (b) HO-specific (architectural necessity).  

  #### Collapsed Requirements  
  - **"Ownership" (Rock Problem) and Empty-Target** are distinct but related: Both demand HO states alone can suffice for consciousness (empty-target) while restricting attribution to the subject (rock problem). They are separable but both necessary.  

  ---  
  ### Two Key Questions  
  **1. Genuine Desiderata vs. Camp Prejudices**  
  - **Genuine desiderata** (must-haves for your purpose):  
    - **Account for phenomenal character**: Not idle. Required to distinguish conscious states (e.g., blindsight lacks it) and adjudicate target cases. Rejecting this collapses consciousness into reportability, failing blindsight/sleep cases.  
    - **Avoid conceptual sophistication**: Genuine. Needed to handle non-human animals (e.g., species without prefrontal metacognition) without overintellectualizing consciousness.  
    - **Relationality acceptance**: Genuine. HO theories are inherently relational; insisting on "intrinsicness" is a first-order prejudice (c). Refuse it.  
  - **Camp prejudices** (refuse as idle):  
    - **"Cognitive availability over phenomenality" demand**: Idle. Your cases require discerning *experience* (phenomenality), not just access (e.g., non-responsive patients may have phenomenal states without access).  
    - **"Intrinsicness" demand**: Prejudice (c). HO theories are relational; requiring intrinsicness sabotages the framework.  
    - **"HO states must be phenomenally silent"**: Prejudice (c). Not necessary for empirical adequacy; only a doctrinal commitment in some HO camps.  

  **2. Joint Unsatisfiability and Exclusionary Work**  
  - **Jointly unsatisfiable pair**: **Attributive-mismatch** and **intuitions about transparency**.  
    - **Conflict**: If consciousness tracks HO content (per standard HO), mismatches imply systematic misexperience (e.g., "red" experienced as "green"), violating transparency (we seem to experience the world directly). If it tracks FO content, HO states become irrelevant.  
    - **Which to drop?** Drop **strict transparency**. It is a phenomenological intuition, not an empirical constraint. Cost: Accept that consciousness can be misrepresentational (e.g., illusions), which is empirically plausible.  
  - **Most exclusionary requirement**: **Structural constraints (no self-intimating terminus)**.  
    - **Why**: Relaxing this allows "self-conscious" HO states, collapsing HO into same-order views. It excludes same-order theories (e.g., self-representationalism) that your purpose may need to contrast with HO.  

  ---  
  ### Scorecard of HO Theories  
  Key: ✓ = Satisfies, ✗ = Fails, ~ = Partially/controversially satisfies.  

  | Requirement                   | Rosenthal (HOT)       | Lycan (HOP)           | Same-Order/Self-Rep.  |  
  |-------------------------------|------------------------|------------------------|------------------------|  
  | Ordinary Contrast             | ✓ (HO thoughts absent) | ✓ (Inner perception absent) | ~ (Self-rep fails)     |  
  | Sleep/Anesthesia              | ✓ (No HOTs)           | ✓ (No inner perception)| ✓ (No self-rep)        |  
  | Rock Problem                  | ✗ (Self-concept circular)| ~ (Inner sense "ownership" vague)| ✓ (State intrinsically owned)|  
