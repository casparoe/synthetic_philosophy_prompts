  Against IoI (the two-sphere counterexample):
  - The two spheres are distinct (because there are two) but they have all the same properties. Therefore, IoI is false.

  A move to defend IoI: weak discernibility. The idea is that even though each sphere has the same set of properties, there is a relation that holds between them that is irreflexive. For example, the relation "is distinct from" or "is at a non-zero distance from". So sphere A has the property: "is distinct from sphere B" and sphere B has the property "is distinct from sphere A". But note: these are relational properties and they are symmetric. However, the weak discernibility move says that the relation R(x,y) = "x is distinct from y and x is at a distance D from y" is a relation that holds between A and B and between B and A, but note that R is symmetric. But the key is that it is a relation that the object has to another. So each sphere is discerned by the fact that it bears R to the other. Therefore, they are not indiscernible.

  In programming terms: 
