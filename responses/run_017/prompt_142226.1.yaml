  But what if the player builds two identical objects at two different locations? Then they are stored as two distinct entities because their positions are different. So the deduping only happens when the entire state (including position) is the same.

  The problem is when two objects are at the same location. That is the only case where deduping would merge them. So the issue is not about the two-sphere counterexample (which in your system would have different positions and thus not be deduped) but about the possibility of two objects at the same location.

