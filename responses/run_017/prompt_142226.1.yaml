  Wait, if you include a unique ID in the state, then two objects that are otherwise identical (same position, same everything) but with different IDs would have different hashes and not be deduped. So that would solve the problem of two at the same location. But then you lose deduping entirely because every object has a unique ID. So you are not deduping by state anymore.

