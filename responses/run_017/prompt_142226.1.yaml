  - But each entity is distinct by its ID.

  This would match the philosophical view that the two spheres are distinct even though they have the same properties (because they are two). In your system, they would have the same state (if the state included only intrinsic properties and not position? But wait, position is part of the state). 

  But note: in the two-sphere case, the spheres are at different positions, so they would have different state hashes. So they would not share the state record. 

  The only time they would share the state record is if they are at the same position. But then they are one entity? Or two entities at the same position? 

