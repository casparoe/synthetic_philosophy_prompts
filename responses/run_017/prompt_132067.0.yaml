answer: |-
  ### Design Notes
  I've selected seven concrete questions that probe core tensions in fairness definitions without using jargon. They separate views by: (1) whether group identity justifies differential treatment; (2) whether outcomes or decision processes matter more; (3) if thresholds should be group-dependent; (4) whether scores must mean the same thing for all groups; (5) whether similar individuals warrant identical outcomes; (6) if "actionable reasons" are non-negotiable; and (7) whether long-term group welfare trumps procedural fairness. These force distinctions between consequentialism, procedural views, and conditional/counterfactual criteria. Group identity relevance (Q1) splits unawareness from others; threshold flexibility (Q3) separates demographic parity from calibration; reasons requirements (Q6) isolates your internal policy.

  ---

  ### The Decision Tree
  **Start:** *An applicant from Group A and Group B both have identical income, employment history, and debt-to-income ratio. Should they receive the same decision?*  
  - **Yes** → Q2  
  - **No** → Q7  

  **Q2:** *If two applicants are identical on all recorded data (including credit history), but one defaults and the other doesn’t, is the model necessarily flawed?*  
  - **Yes** → Q3  
  - **No** → Q4  

  **Q3:** *Should a £30k income applicant from Group A face the same approval threshold as a £30k income applicant from Group B?*  
  - **Yes** → **Leaf E**  
  - **No** → **Leaf A**  

  **Q4:** *If Group A defaults at 10% when scored 0.5, but Group B defaults at 20% at the same score, is this acceptable?*  
  - **Yes** → **Leaf C**  
  - **No** → Q5  

  **Q5:** *Should two neighbours with identical jobs and finances always get the same decision, even if other Group B applicants default more often?*  
  - **Yes** → **Leaf D**  
  - **No** → Q6  

  **Q6:** *Must we *always* give a declined applicant a reason like "Increase income by £5k" that doesn’t mention their group?*  
  - **Yes** → **Leaf H**  
  - **No** → **Leaf B**  

  **Q7:** *Is it acceptable for Group A to be approved less often than Group B, if this narrows the wealth gap in 10 years?*  
  - **Yes** → **Leaf G**  
  - **No** → Q3  

  *(Leaf Key below)*  

  ---

  ### Leaf Key  
  1. **Leaf A: Demographic Parity**  
     *Must accept that high-risk groups get loans they can’t repay.*  
  2. **Leaf B: Equality of Error Rates**  
     *Must tolerate scores meaning different things per group (e.g., 0.5 score = 10% vs 20% default).*  
  3. **Leaf C: Calibration/Sufficiency**  
     *Must allow different error rates if scores reflect true risk.*  
  4. **Leaf D: Individual Fairness**  
     *Must overrule group-level statistics for "similar" individuals.*  
  5. **Leaf E: Fairness Through Unawareness**  
     *Must ignore that proxies (e.g., postcode) may replicate bias.*  
  6. **Leaf G: Welfare Consequentialism**  
     *Must justify short-term "unfairness" to disadvantaged groups.*  
  7. **Leaf H: Reasons-on-Record Fairness**  
     *Must reject accurate reasons like "Your group defaults more" even if true.*  
  *(Counterfactual fairness omitted—see "Cannot Separate")*  

  ---

  ### Empty Cells  
  - **Q1=No → Q2=Yes → Q3=No**: Incoherent. If groups *should* be treated differently (Q1=No), but identical *individuals* must have same outcome (Q2=Yes), yet thresholds differ (Q3=No)—contradicts Q2.  
  - **Q1=Yes → Q2=No → Q4=Yes**: Unexplored. Assumes groups identical (Q1=Yes), noise acceptable (Q2=No), and calibration differences fine (Q4=Yes). Logically consistent but rarely defended.  
  - **Q1=No → Q7=No → Q3=Yes**: Unattractive. Argues groups differ (Q1=No), rejects welfare trade-offs (Q7=No), but insists thresholds same (Q3=Yes). Implies bias without recourse.  

  ---

  ### What the Tree Cannot Separate  
  - **Counterfactual fairness** collapses into **Leaf D (Individual Fairness)**. Both require identical treatment for "similar" individuals, including counterfactuals (e.g., "Would they get loan if ethnicity changed?"). No question forces this split.  
  - **Calibration (Leaf C)** and **Sufficiency** merge; both require scores to mean identical risk across groups.  
  - **Reasons-on-record (Leaf H)** and **"Causal" fairness** overlap on requiring non-discriminatory reasons, but causal views may accept non-actionable explanations.  

  ---

  ### My Three Draft Questions, Diagnosed  
  1. *“Should the model ignore protected characteristics?”*  
     **Problem:** Overbroad. "Yes" could mean unawareness, consequentialism, *or* individual fairness. "No" could imply demographic parity, error-rate parity, *or* calibration. Fails to split key views.  
  2. *“Is 85% accuracy good enough?”*  
     **Problem:** Unrelated to fairness. Accuracy trade-offs (e.g., balancing FPR/FNR) matter, but raw accuracy doesn’t map to any fairness criterion.  
  3. *“Identical distributions → same approval rate?”*  
     **Problem:** Ambiguous "everything that matters." If "everything" includes default risk, calibration requires same approval rate. If it means features, unawareness demands same rate. Fails to isolate demographic parity.  

  ---

  ### The Trilemma  
  **Your colleague is correct.** Requiring (i) equal error rates, (ii) score = true probability (calibration), and (iii) monotonic actionable reasons (e.g., "Raise income by £X") creates contradiction *even with identical base rates*. Calibration + equal error rates imply scores must be identical across groups. But actionable reasons require decisions to flip if a feature changes *monotonically* (e.g., income ↑). If Group A and B have identical features/distributions, but the *reason* given must be group-blind (e.g., "Income too low"), the threshold must be identical—contradicting (i) if groups have different optimal thresholds. **Belongs under Leaf B (Equality of Error Rates)** as its "awkward commitment": enforcing error-rate parity *with* actionable reasons forces thresholds to diverge from true risk-minimizing points.  

  ---  
  *Total words: ~850 (within target range). This structure ensures compliance teams grapple with trade-offs inherent to each criterion, using only concrete, operational cases.*
