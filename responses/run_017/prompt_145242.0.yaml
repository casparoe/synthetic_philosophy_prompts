prompt: |-
  I teach a binational summer-school seminar on everyday moral reasoning: twenty undergraduates, roughly half from American universities and half from German ones, one room with movable chairs, a single 100-minute session that falls in the middle of a short module. This session is on the contrast between two folk-moral styles. In the first, the question of what a situation calls for is answered by locating the applicable rule and doing that, and order, predictability and checkability are themselves counted as moral goods rather than as bureaucratic overhead. In the second, the same question is answered by asking what this situation demands of me in particular, where the answer may not be utterable by anyone else, and where an act done merely because it was required looks hollow, or worse, like a way of not being present.

  The room is the point of the session: about half the participants grew up hearing the first style praised and half the second, and both groups arrive with a ready caricature of the other. So I do not want the session to be a discussion in which people report their intuitions. I want an activity in which the difference shows up in what people actually do and in what they find they are able to say, before it is named. And I want neither style to come out of the session looking like a parody of itself: not rule-following as timidity, not conscience as a licence for self-dramatization.

  Three distinctions from my own notes should be load-bearing in the design; I want participants to hit them, not to be told them. First, detachable versus attached reasons: some reasons keep their force when they are separated from the person who offers them, since anyone in that position could have given them, while others go dead when detached, because they depend on a history only the speaker has. Second, the licence gradient: some arrangement has to decide who may depart from a rule without paying for it, and the two styles answer differently, the one concentrating that permission in an office and the other distributing it to everybody, which sounds egalitarian and in practice distributes it to whoever is most at ease speaking in public. Third, procedural residue: after a rule has been broken for an excellent reason, what is left behind is not a memory but a precedent, available to be cited next time by someone whose reason is contemptible, and the residue is the same no matter how good the original breach was.

  Here is what I have settled on and what I want you to design around. No lecture up front; I will not say the words conscience, rule-following, duty, obligation, or their German equivalents, and no jargon of the -ism variety, until the final fifteen minutes. Participants should spend the first stretch authoring, themselves, a short written code for a small shared enterprise they are imagined to be running together, so that the conflict later in the session is not between my will and an alien rule but between what I now want and what I myself wrote down an hour ago. That seems to me the only way to get the interesting version of the conflict rather than the cheap one.

  Then a sequence of incidents, each requiring an individual decision under a hard time limit and before any discussion, made publicly by moving to a marked part of the room. Compliance should be silent and unremarked. Departure from the code should require standing up and giving a reason in the first person, and I want a speech constraint: the words one, you, anyone, people, everyone and nobody are disallowed, as is any sentence about what the rule is for. Only I-sentences about what the speaker is doing and why. The asymmetry of cost between the silent option and the spoken one is not a bug to be corrected; it is the engine. Somewhere in the sequence I want one incident for which the code is simply silent, with a very short clock, because I suspect that what fills a gap is not twenty individual consciences but rapid imitation of whoever moved first, and I want the room to discover that about itself. I also want departures to be entered in a visible log that later participants can cite as permission.

  Please choose the shared enterprise and give me the incident cards in full, and tell me why the choice of enterprise matters: it needs a purpose the participants can name and actually care about, since at least one incident has to be a case where a rule is followed perfectly and its point is thereby defeated, which only lands if there is a point to defeat. Give me a minute-by-minute timeline, a materials list, the exact wording of the instructions participants hear, and the rules of the speech constraint.

  Stakes should be social rather than financial, though I am open to something tiny and real. I have been toying with two things and want your judgement on both. One: assigning a few participants positions that weaken their stake in the enterprise's future, such as the person who is leaving at the end of the week, because I suspect that temporariness dissolves loyalty to a rule faster than bad consequences do, and I would like that to be visible. Two: a closing in which everyone seals a card at the start naming a rule they actually live by, and chooses at the end whether to read it aloud.

  The debrief needs to map specific moments I will have watched for onto the three distinctions above, and to say which observable event is evidence for which. It also has to handle the evaluative question, since the module promises a verdict on which style has the better of it. I do not want the session to end on either of the two stock conciliations, that it depends on the case, or that we need a bit of both; both are ways of not having the argument. Tell me how to stage the close so that the question of which style has the better of it is forced to reformulate into something the room can actually argue about, and tell me what I must not let them conclude.

  Be specific about what will go wrong. In particular: what I should do if nobody departs from the code in the first two incidents; how to stop participants from performing their nationality instead of their disposition; how to keep the two or three most fluent speakers from setting the norm for everyone; and how to handle the speech constraint when someone experiences it, correctly, as a restriction on what they are permitted to say.

  Finally, be frank about what this kind of activity cannot reproduce and what I will have to say myself. My candidates are that real rule-following is mostly invisible and unchosen, in that one rarely decides to comply and rarely notices having done so; that the payoff of a stable rule is spread over years of coordination and no 100-minute session can show it; that the failures of the conscience style are systematically harder to see than the failures of the rule style, because a bad appeal to conscience leaves no audit trail; and that in ordinary life agents usually cannot tell which of the two styles they are currently using. Tell me which of these I am wrong about and what else is missing.
reasoning: |-
  Hmm, this is a fascinating and complex teaching challenge. The user is designing a binational seminar on moral reasoning styles, with a very specific pedagogical goal: to make the tension between rule-based and conscience-based ethics emerge experientially rather than through lecture. 

  First, let's unpack the core requirements. The session needs to:
  - Avoid intellectualized discussion in favor of embodied behavior
  - Surface three key distinctions (detachable vs attached reasons, license gradient, procedural residue)
  - Use a participant-authored code as the conflict source
  - Implement asymmetric costs for rule-breaking (silent compliance vs public justification)
  - Include specific incident types (including a silent gap scenario)
  - Address potential pitfalls like national stereotyping or dominance by fluent speakers

  The user's anxiety points are telling - they're worried about the activity failing to trigger the desired behaviors, or devolving into performative nationalism. That suggests the design needs built-in contingency plans and subtle facilitation techniques.

  For the shared enterprise, a collaborative research project feels ideal because:
  - Academically familiar to all participants
  - Naturally high-stakes in reputation/social capital
  - Allows rule-design around authorship, methodology, ethics
  - Creates plausible tension between rigor and insight

  The incident cards should escalate from clear-cut to ambiguous:
  1. Data Dilemma (clear rule, tempting breach)
  2. Authorship Gap (rule application defeats purpose)
  3. Urgent Revision (deliberate silence to trigger imitation)
  4. Precedent Test (previous breach cited for bad faith reason)

  Key facilitation moves:
  - Assigning temporal roles (departing member) to test loyalty dissolution
  - Physical position cards to visualize consensus/imitation
  - Strict I-statement enforcement to block generalization
  - Visible "precedent log" to materialize procedural residue

  The closing ritual with sealed cards is genius - makes abstract commitments concrete. But we must avoid letting it become confessional. Framing it as "what principle actually guides you?" keeps it philosophical.

  For debrief, we need to map observed behaviors to the three distinctions:
  - Detachable reasons: When justifications work/don't work when cited later
  - License gradient: Who speaks vs who stays silent
  - Procedural residue: How precedents get weaponized

  The "which style wins?" question must be reframed away from false compromise. Maybe: "If we ran this enterprise for 5 years, which failure mode would destroy it first - rule-rot or conscience-anarchy?"

  Finally, the limitations acknowledgment feels crucial. No simulation can capture the invisibility of real rule-following or the long-term coordination benefits. Best to name these gaps explicitly when framing the debrief.
answer: |-
  Here’s a meticulously designed session plan addressing all your requirements, pitfalls, and pedagogical goals. The shared enterprise and incidents are crafted to force visceral engagement with your three distinctions while avoiding caricatures.

  ---

  ### **Shared Enterprise: The "Bridging Stories" Oral History Project**  
  **Why this enterprise works:**  
  - **Purpose:** Participants co-create an archive of personal migration stories (e.g., family, cultural, educational) to bridge US/German perspectives. The *point*—meaningful cross-cultural understanding—is visceral and universally compelling.  
  - **Why it matters:** Rules about storytelling ethics (consent, editing, privacy) can *defeat the purpose* if applied rigidly (e.g., redacting emotionally raw moments "to follow consent rules" strips stories of power). The stakes are social (trust, representation) with optional real output (a shared digital scrapbook).  

  ---

  ### **Session Timeline & Materials**  
  **Materials:**  
  - Moveable chairs, 4 position cards (**A**gree/**D**isagree/**B**reak Rule/**U**ndecided) in room corners  
  - Whiteboard with "Precedent Log" (Rule Broken + Reason Cited)  
  - Incident cards (1 per participant), sealed envelopes with personal rule cards, timers  
  - Code-authoring template: "Our 5 Rules for Ethical Storytelling"  

  | Time  | Phase                  | Activity                                                                                               |  
  |-------|------------------------|--------------------------------------------------------------------------------------------------------|  
  | 0-15m | Code Creation          | Groups of 4 draft 5 rules for the project (e.g., "Tell no story without teller’s consent," "Anonymize all names unless permitted"). Groups merge into 1 master code. |  
  | 15-20m| Introduction to Game   | Explain decision protocol: **A**/**D**/**B**/**U** corners. **Speech Constraint Rules:** No "one/you/anyone/everybody." Only "I feel/I need/I believe." No mention of the rule’s purpose. Breaking rules requires public justification. |  
  | 20-60m| Incident Sequence      | **4 incidents** (90 sec each). Participants move *silently* to corners. Rule-breakers justify under speech constraint. Precedents logged. |  
  | 60-75m| Debrief & Naming       | Map incidents to your 3 distinctions using observed behavior. Introduce terms ("detachable reasons," etc.). |  
  | 75-85m| Closing Ritual         | Open sealed envelopes: "Write a rule you *actually* live by." Option to share aloud. Reframe the "verdict." |  
  | 85-100m| Final Argument         | Force reformulation: "Which style better sustains trust when people are *tired* of the project?" |  

  ---

  ### **Incident Cards**  
  **Incident 1: The Withdrawn Story**  
  > *A participant shared a vulnerable story. Now they withdraw consent. The code says: "Delete story if consent revoked." The story is the most powerful in the archive.*  
  **Why:** Tests rigid compliance vs. conscience. Rule-following (delete) "defeats the point" (losing the best bridge). Detachable reasons emerge if someone breaks rule: "I feel keeping it honors her courage" (attached) vs. "This violates autonomy" (detachable).  

  **Incident 2: The Unintentional Bully**  
  > *A popular member pressures a shy peer into sharing. Code says: "No story without enthusiastic consent." The shy peer seems uneasy but says "OK."*  
  **Why:** Rule-following (block story) protects agency but may feel like overreach. Breaking it ("I sense she wants to speak but is scared") reveals license gradient: Who claims authority to interpret "enthusiasm"?  

  **Incident 3: The Gap (Silent Incident)**  
  > *A new storyteller reveals they are undocumented. The code is silent on immigration status. 30-sec timer.*  
  **Why:** Forces rapid imitation. Expect herd movement toward first decisive person. Shows conscience ≠ individualism but social contagion.  

  **Incident 4: The Bad-Faith Precedent**  
  > *A participant cites Incident 1’s precedent ("We kept a story for the greater good!") to include a harmful, unconsented story attacking a religious group.*  
  **Why:** Makes procedural residue tangible. The residue (precedent) is identical regardless of original intent.  

  ---

  ### **Contingencies & Pitfall Management**  
  - **No one breaks rules early?**  
    Use Incident 2: Assign your "departing member" (e.g., "You’re transferring schools next week") to be the "bully." Their weak stake increases breach likelihood.  
  - **Performing nationality?**  
    **Prevent:** Code-authoring in mixed groups. **During incidents,** emphasize: "Move based on your gut, not your passport."  
  - **Dominant speakers?**  
    **Speech constraint neutralizes fluency.** Enforce ruthlessly: "Rephrase without ‘you’ or stop." Log only I-statements.  
  - **Speech constraint feels oppressive?**  
    Acknowledge post-activity: "This forced you to *live* a style. Which felt like a loss of moral vocabulary?"  

  ---

  ### **Debrief & Verdict Reformulation**  
  **Map observations to your distinctions:**  
  - **Detachable vs. Attached:** When a reason was cited from the Precedent Log, did it retain force? (e.g., Incident 4’s bad-faith citation exposed detachability).  
  - **License Gradient:** Who spoke? The "departing member"? Confident extroverts? Did silent participants later cite feeling "unlicensed"?  
  - **Procedural Residue:** Highlight Incident 4: "The residue was identical whether the first breach was noble or vile."  

  **Close on the reformulated question:**  
  > *"We’ve seen both styles fail. But if this project lasted 5 years, which failure would corrode trust faster:*  
  > *- The *slow creep* of rule-evasion for ‘good reasons,’ making rules hollow?*  
  > *- Or the *chilling effect* of someone weaponizing a precedent you set?"*  

  **Forbid these conclusions:**  
  - "It depends on the situation." → **Reframe:** "When does ‘it depends’ become an excuse?"  
  - "We need a balance." → **Challenge:** "What *mechanism* decides when to switch styles? Who controls it?"  

  ---

  ### **What the Activity Can’t Capture (and How to Address)**  
  You’re right about **all four limitations**. Mitigate by:  
  1. **Invisible rule-following:** Note post-activity: "Today you *decided* visibly. Real morality is often habitual."  
  2. **Long-term payoffs:** Use the "5-year project" question to force hypothetical long-term thinking.  
  3. **Hidden conscience failures:** Point to Incident 4: "A bad rule leaves a trace. A bad conscience appeal leaves only resentment."  
  4. **Self-awareness gap:** Have participants guess their own style (pre/post sealed card) to highlight dissonance.  

  **Missing element:** The *emotional cost* of sustained rule-following (e.g., bureaucratic burnout) vs. conscience (e.g., moral loneliness). **Add:** In debrief, ask: "Which style felt more exhausting today? Why?"  

  ---

  ### **Sealed Card Ritual**  
  **Do it,** but frame carefully:  
  - **Start:** "Write a principle you *actually* follow daily, e.g., ‘Never ignore a beggar’ or ‘Always file taxes early.’ Seal it."  
  - **End:** "Optionally share. Notice: Did your principle sound more like a rule or a conscience call? Did anyone *wish* they could edit?"  
  **Why it works:** Makes abstract styles personal without grandstanding.  

  ---  
  This design makes your distinctions *inescapable* through action. The "Bridging Stories" enterprise ensures rules feel self-authored and purpose-driven, while incidents force confrontations with procedural residue and license asymmetry. By making the closing about *sustainability*, you sidestep shallow relativism and target the core tension: Which failure mode is more corrosive over time?
