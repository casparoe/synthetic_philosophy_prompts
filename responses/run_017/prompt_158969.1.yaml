prompt: |-
  So I'm a philosophy prof who somehow ended up as the parlimentarian for our faculty senate, which means I write the voting rules for about fifteen standing committees — promotion, curriculum, naming and memorials, budget — and I keep running into the same thing. A body has to decide one yes/no question that turns on a couple of other yes/no questions, and whether they vote the sub-questions and infer the answer, or vote straight up-or-down on the final question, changes who wins, and then everyone assumes someone cheated. Last year our promotion committee voted separately on research, teaching, and service, all three came out yes, and the up-or-down tenure vote would have been no.

  What I want is a procedure I can hand a committee chair who has never heard of any of this, has ten minutes, and meets monthly: how do you decide what goes on the ballot as separate questions versus one package, when do you aggregate the sub-questions and when the conclusion, what do you do when the two disagree, and in what order do you take the votes (order obviously matters, and I'd rather specify it than let it be an accident). One page, no software, and it has to survive an appeal to the provost and a student newspaper story. Where it can't be turned into a rule — choosing the agenda, deciding whether the body is answerable for its reasons or only for its decisions, what to do with members who are only competent on one sub-question — say so, tell the chair to make a judgment call, and tell them to record it.

  Run it on three: promotion with three criteria; a curriculum committee deciding on a college-wide data-science requirement that turns on whether majors need it and whether we can staff it; and the naming committee deciding whether to take a donor's name off a building, where the sub-questions are a historical claim, whether the conduct was condemnable by the standards of his own time, and whether removal is proportionate. As far as I remember from grad school, no rule respects majority on every proposition and always returns a consistent set unless some fixed subgroup effectively gets a veto — so tell me plainly what your procedure does about that, and give me at least one case where it gives an answer I'm not going to like.
reasoning: |-
  Okay, this user is a philosophy professor turned parliamentarian for a faculty senate. They need a simple, one-page voting procedure for committees facing yes/no questions with dependencies. Key issues: voting separately on sub-questions vs. the final question leads to contradictory outcomes (like tenure denied despite passing all criteria), and they need something foolproof for non-experts. 

  The user’s frustration is palpable—they’ve seen real-world fallout (provost appeals, student newspaper scandals) when logical inconsistencies create perceived cheating. Their examples (promotion, curriculum, naming) reveal deeper tensions: Is the body accountable for reasons or just decisions? How to handle members only competent on one sub-question? 

  I recall Arrow’s theorem means no perfect solution—aggregating preferences without dictatorship or veto groups is impossible. So the procedure must openly acknowledge trade-offs. The user explicitly asks for flaws: "Give me one case where it gives an answer I won’t like." Brutal honesty required. 

  Hmm... Core conflict: Committees want to record reasons (sub-questions) but must avoid inconsistency. My solution should prioritize the final decision’s coherence while letting chairs document dissent when sub-votes disagree. For the examples: Promotion must bind sub-votes to the tenure outcome; curriculum/naming can tolerate more ambiguity but need clear fallbacks. 

  Biggest headache: Order of votes. If they vote sub-questions first, the final vote might contradict (like the tenure fiasco). If final vote first, members feel robbed of nuance. Compromise: Vote final question first (avoids inconsistency), then optional sub-questions for recording reasons—but chairs must note if sub-votes conflict. 

  The "unpopular outcome" example: If promotion committee votes "yes" on research/teaching but "no" on service, and tenure passes anyway? Faculty will riot. But I’d argue: If tenure criteria aren’t strictly conjunctive, the final vote reflects holistic judgment. Still, the user might hate this. 

  Procedure must fit one page: Bullet points, no jargon. Stress chair’s discretion on agenda-setting and handling incompetent members. Remind them to record judgment calls—transparency is armor against appeals. 

  Finally, validate their pain: "This won’t eliminate all paradoxes, but it minimizes real-world chaos." They’re a philosopher; they’ll appreciate the existential compromise.
answer: |-
  Here's a one-page procedural guide for committee chairs, designed for clarity, defensibility, and handling the core paradox you face:

  ---

  **Voting Procedure for Complex Yes/No Questions: Guide for Committee Chairs**

  **Core Principle:** Vote **directly on the final decision** whenever possible. Sub-questions are **advisory only** for recording reasons or informing debate, *not* for mechanically determining the outcome. This prioritizes coherent final decisions but allows documentation of reasoning.

  **When to Use Separate Questions (Sub-Questions):**
  1.  **Only if essential for transparency or expertise:** When the committee *must* formally record its judgment on specific premises (e.g., "Did conduct violate historical standards?") due to policy, precedent, or intense stakeholder interest.
  2.  **Only if explicitly defined how they relate to the final vote:** *Before voting*, the committee must agree: "Passing the final vote requires Yes on *all* sub-questions" (Conjunctive) OR "Passing the final vote requires Yes on *at least one* sub-question" (Disjunctive) OR another clear, agreed-upon rule. **Default to Conjunctive if unclear.** *Record this rule.*

  **The Procedure (Order Matters!):**
  1.  **Define the Question & Relation:** Clearly state the final question (e.g., "Approve tenure for Prof. X?"). Decide (vote if needed) *whether* sub-questions are needed and *how* they relate to the final vote. **Record this decision.**
  2.  **Vote on the FINAL Question First:**
      *   "Shall [Final Action] be approved?" (e.g., "Approve tenure for Prof. X?")
      *   Use standard majority rules unless bylaws specify otherwise.
      *   **This vote is binding.**
  3.  **Optional: Vote on Sub-Questions (Advisory):**
      *   *Only* if agreed in Step 1.
      *   Vote on each sub-question separately (e.g., "Was research satisfactory?", "Was teaching satisfactory?", "Was service satisfactory?").
      *   **These votes are advisory and for the record ONLY.** They document the committee's reasoning but *do not override* the final vote.
  4.  **Document Disagreements & Judgment Calls:**
      *   If sub-question votes (Step 3) contradict the final vote *under the agreed relation* (e.g., all sub-questions Yes but final vote No), **explicitly record this inconsistency** in the minutes. Note it reflects the committee's holistic judgment vs. mechanical aggregation.
      *   Record *why* sub-questions were used (Step 1 decision), the relation rule, and the voting order.

  **Handling Ambiguity (Chair's Judgment Call - RECORD IT!):**
  *   **Choosing the Agenda:** Prioritize the final decision. Only add sub-questions if their *separate recording* is deemed crucial. When unsure, skip sub-questions.
  *   **Reasons vs. Decision:** The body is primarily answerable for its *decisions* (the final vote). Sub-questions document *reasons* but are not binding decisions themselves.
  *   **Member Competence:** Members should vote on the final question based on their overall judgment. If a member feels unqualified on the *final* question, they should abstain. Expertise on a sub-question informs their final vote; they cannot vote *only* on a sub-question unless the committee specifically agrees to allow it (rare, record if used).

  **Examples:**

  1.  **Promotion (Tenure):**
      *   **Final Vote First:** "Approve tenure for Prof. X?" (e.g., Result: **No**)
      *   **Sub-Questions (Optional/Advisory):** Vote separately on Research, Teaching, Service. (e.g., Results: Yes, Yes, Yes). **Record:** "Committee voted No on tenure despite advisory Yes votes on all criteria, reflecting a holistic judgment beyond mechanical satisfaction of individual criteria."
  2.  **Curriculum (Data-Science Requirement):**
      *   **Final Vote First:** "Adopt the college-wide data-science requirement?" (e.g., Result: **Yes**)
      *   **Sub-Questions (Optional/Advisory):** "Do majors require it?", "Can it be staffed adequately?" (e.g., Results: Yes, No). **Record:** "Committee voted Yes on the requirement. Advisory votes: Majors require it (Yes), Can be staffed (No). The committee judged staffing concerns could be addressed."
  3.  **Naming (Remove Donor's Name):**
      *   **Final Vote First:** "Remove [Donor]'s name from [Building]?" (e.g., Result: **Yes**)
      *   **Sub-Questions (Likely Needed for Transparency):** *Agreed Relation: Conjunctive (All must be Yes to remove)*. Vote on: "Did [Historical Claim] occur?", "Was conduct condemnable by standards of their time?", "Is removal proportionate?" (e.g., Results: Yes, No, Yes). **Record:** "Final Vote: Remove Name (Yes). Advisory sub-votes under conjunctive rule: Occurred (Yes), Condemnable (No), Proportionate (Yes). The final vote of Yes indicates the committee did not strictly require all advisory propositions to pass conjunctively for removal."

  **The Inevitable Problem & What This Does:**
  *   **Arrow's Theorem Reality:** No perfect system exists. This procedure **prioritizes a coherent final decision** over perfectly consistent sub-votes. It avoids letting a minority veto the final outcome *if the final vote passes*.
  *   **The Unpopular Outcome (Your "Not Going to Like" Case): Promotion Scenario**
      *   *What Happens:* Final Vote: "Approve tenure?" = **Yes**.
      *   Advisory Sub-Votes: Research=Yes, Teaching=Yes, Service=**No**.
      *   *Why it's Unpopular:* The candidate gets tenure despite the committee formally recording (advisory) dissatisfaction with service. Critics cry foul: "They failed service but got tenure!"
      *   *Why the Procedure Allows It:* The final vote reflects the committee's *overall* judgment that tenure is warranted, even if one criterion (service) was deemed lacking. The advisory vote documents the service concern for the record, but the final decision stands. **This exposes the inherent tension between holistic judgment and checklist criteria.** The chair must clearly record the advisory nature of the service vote and the binding nature of the final Yes vote.

  **Survival Strategy:**
  *   **Transparency is Armor:** Meticulously record *all* decisions: why sub-questions were used (or not), the relation rule, the voting order, and any inconsistencies.
  *   **Final Vote First Prevents Manipulation:** Voting the final question first avoids agendas designed to force a specific outcome through sub-votes. Any inconsistency arises *after* the binding decision is made and is documented as such.
  *   **Chair's Judgment Call is Legitimate:** Explicitly state when and why you made a judgment call (e.g., "No sub-questions used as recording individual criteria judgments was deemed unnecessary for this case"). Record it. This is defensible administration.
  *   **Focus on the Mandate:** Remind critics the committee's primary duty is to make the final decision (Approve Tenure? Adopt Requirement? Remove Name?). Documenting reasoning (via sub-votes or minutes) is secondary.

  ---

  This procedure minimizes paradoxes by binding the final vote, makes agendas transparent, forces explicit discussion of how sub-questions relate, and provides a clear, defensible record highlighting the chair's reasoned judgment calls. The unpopular promotion case is the price paid for avoiding the worse paradox of denying tenure despite passing all criteria.
