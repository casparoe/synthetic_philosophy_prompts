prompt: |-
  I work in clinical data management, and three of us from the office have a reading group that meets in a pub on tuesdays — we're slowly going through some metaphysics mostly for the argument, and we've hit the same shape of problem twice now and got stuck both times. Here's the shape. Someone asks whether some kind of thing really exists over and above the things everyone already agrees about. Say, whether once you've got all the tiny parts arranged a certain way there is also a further thing, the table; or, in the science case we did last week, whether a theory that talks about an extra quantity is committed to something extra when another version of the same theory, which predicts exactly the same result for every possible experiment, does without it. In both cases everybody concedes that no observation, no experiment and no amount of extra evidence could ever favour one answer over the other, and everybody agrees about which everyday sentences are true and which formulation is more convenient. Fine. But then the person on the 'yes, they really exist' side doesn't stop at 'we'll never know, it's just an open question'. They go on to use the claim: they say our everyday sentences are only loosely or derivatively true if the answer is no, or that one version of the theory is the more basic description of reality, or that a certain explanation only goes through if you help yourself to the extra things. And what I can't get a grip on is that this second move seems to take back what the first one gave. If the difference between the two answers is by construction beyond anything that could ever count as information about it, how can it also be what settles what we ought to say, which description is more fundamental, or which explanation works? It looks like the posit is introduced precisely as something we can't get at and then leaned on as though we had got at it.

  It's not the same as the old worry about abstract objects being the sort of thing that can't push on anything, and it's not the same as 'you two just mean different things by exists', and it's not quite 'we only ever get at the structure and never at what fills it' — all three feel adjacent but each seems to miss the bit that's bothering me, which is the swing from humble to load-bearing within one argument. So: does this have an established name, or is there an established way of drawing the line between the harmless version of the move and the dodgy one — and if there isn't, I'd like you to coin something and define it properly, with a case where the move is legitimate and a case where it isn't. A bare label won't do me any good at the pub; I need to know what exactly the phenomenon is, what it isn't, and where its edges are.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They work in clinical data management and have a reading group tackling metaphysics. The core issue they're stuck on involves debates where two positions agree on all observable evidence but one side claims an extra entity exists, which then becomes foundational for explanations or truth. 

  First, I need to understand why this bothers them. They mention the contradiction between the entity being epistemically inaccessible yet ontologically weight-bearing. The user wants to know if this move has a name, or how to distinguish legitimate from illegitimate uses. They’ve already ruled out adjacent concepts like abstract objects or structural realism, so I need something more precise.

  Looking at philosophical literature, Carnap’s internal/external distinction comes to mind. But the user’s case involves an entity introduced as empirically idle but then used to ground explanations. That’s closer to what Sider calls "ontological inflation" or Hofweber’s "ontological triviality." However, the key is the dual role: it’s both undetectable and explanatory. 

  The user’s examples—everyday objects vs. particles and dual theories in science—show the pattern. In both, the pro-entity side uses it to explain truths or fundamentality. The worry is that if evidence can’t touch it, how can it be load-bearing? This seems like a category error: treating a conceptual choice as a discovery.

  I recall Fine’s metaphysical grounding here. The move might be conflating grounding with existence. Saying "the table exists over particles" could be a grounding claim, not an additional entity. But in the science example, the extra quantity isn’t just grounding—it’s presented as real. So maybe the distinction is between explanatory depth and ontological commitment. 

  The user needs clear criteria for when this move is legitimate. For instance, in emergent properties, systemic features can be explanatory without being "extra" entities. But if the property is reducible, claiming it as fundamental might be illegitimate. The line could be whether the posit adds irreducible explanatory power. 

  For the pub debate, I should define "ontological free-riding": positing an entity that’s epistemically inert but ontologically foundational. Legitimate cases involve ineliminable explanatory roles (e.g., emergent properties), while illegitimate ones are those where the same work is done without it (e.g., the table as a mere arrangement). 

  The user’s deeper need might be to navigate these arguments without getting stuck. Providing a structured framework (like the three criteria: irreducibility, counterfactual robustness, grounding asymmetry) could help them dissect each case. They’d want to apply this in real-time discussions, so clarity is key.
answer: |-
  This is a beautifully sharp observation of a genuinely tricky move in metaphysics — one that straddles the line between insightful and question-begging. What you've identified doesn't have a single universally agreed-upon name, but it clusters around debates about **ontological commitment, grounding, and explanatory fundamentality**. The core issue is the **dual role of the "extra posit" as both epistemically idle and ontologically/metaphysically indispensable**.

  Let's define the phenomenon clearly, distinguish legitimate from illegitimate uses, and give it a serviceable label for the pub:

  ### The Phenomenon Defined: "Ontological Free-Riding"
  **(Or "Fundamentality Free-Loading" if you prefer alliteration)**

  1.  **The Setup:** Two theories/descriptions (T1 and T2) are *empirically equivalent* for all possible observations/evidence. They agree on all observable outcomes and the truth-values of all "everyday" sentences (e.g., "The cup is on the table," "The experiment yielded result X").
  2.  **The Ontological Difference:** T1 posits the existence of some type of entity, property, or structure (call it *E*) that T2 explicitly denies or avoids positing. (E.g., *E* = composite objects like tables / a specific theoretical quantity).
  3.  **The Epistemic Idleness:** It is conceded that *no possible evidence* could ever favor T1 over T2 or vice versa *based solely on the existence/non-existence of E*. The choice seems pragmatically driven (simplicity, convenience, familiarity).
  4.  **The Load-Bearing Move:** Proponents of T1 argue that *E* plays an indispensable *metaphysical* or *explanatory* role *despite its epistemic idleness*. Specifically:
      *   T1 provides the "more fundamental" or "more direct" description of reality.
      *   T1 makes true certain explanations that T2 cannot genuinely provide (e.g., *why* the particles are arranged table-wise, *why* the theory predicts X).
      *   Truth-claims within T2 are only "loosely true," "derivatively true," or "true in virtue of" the more fundamental truths of T1.
      *   T2 "presupposes" or "requires" the ontology of T1 to make sense of its own success.

  **The Tension:** How can *E*, whose existence is stipulated to be *undetectable in principle* (Step 3), simultaneously be the thing that *grounds explanation, fundamentality, or derivative truth* (Step 4)? It seems *E* is introduced precisely where evidence runs out, yet then used to do heavy metaphysical lifting. This is the "swing from humble to load-bearing."

  ### Distinguishing Legitimate from Illegitimate Free-Riding

  The key question is: **Does *E* genuinely *add irreducible explanatory power* at the *appropriate level of description*, or is it merely a *re-description* of what's already captured by T2?**

  #### Legitimate Case: Emergent Properties & Explanatory Levels
  *   **Scenario:** Consider consciousness ("C") arising from complex brain processes ("B"). T1 (Property Dualism): Brains have both physical properties (B) *and* an emergent property, consciousness (C). T2 (Eliminative Reductionism): There are only complex brain processes (B); "consciousness" is just a folk-psychological label for certain types of B.
  *   **Empirical Equivalence (Plausibly):** For all possible third-person observations, neural correlates, and behavioral predictions, T1 and T2 agree. You can't "point" to C independently of B using a brain scanner.
  *   **The Load-Bearing Move (Legitimate):** Proponents of T1 argue:
      *   T2 cannot *explain the subjective character of experience* (qualia) – why B-processes *feel like something* from the inside. T1 *can* posit C as the bearer of this subjective aspect.
      *   The *truth* of first-person reports ("I feel pain") is not merely derivative of B-facts; it directly involves C. Denying C makes these reports deeply mysterious or false in a way that doesn't align with practice.
  *   **Why Legitimate?** Here, *E* (consciousness) is posited to explain a *phenomenon* (subjective experience) that is *acknowledged* (even by critics) but *not fully captured* by the lower-level description (B) alone. The "work" *E* does (explaining subjectivity) is fundamentally different in kind from the work done by B (explaining neural mechanisms and behavior). The irreducibility claim points to a genuine *explanatory gap*.

  #### Illegitimate Case: The Table & The Particles
  *   **Scenario:** T1 (Common-Sense Realism): There exists a composite object, the table (*E*), in addition to the particles arranged table-wise (P). T2 (Mereological Nihilism/Particle-Only): There are only particles (P) arranged table-wise; there is no additional entity "the table."
  *   **Empirical Equivalence:** For all possible observations, measurements, and everyday statements ("Put the cup on the table," "The table is brown"), T1 and T2 agree. No experiment could detect "table-ness" independently of detecting particles arranged a specific way.
  *   **The Load-Bearing Move (Illegitimate):** Proponents of T1 argue:
      *   T1 provides the "more fundamental" description (the table exists).
      *   T2 cannot explain *why* these particles are arranged table-wise *unless* there is a table they compose. (What else *could* explain their arrangement?)
      *   Statements like "The table supports the cup" are only "loosely true" in T2; they are strictly false since there is no table. Their truth is derivative of particle facts.
  *   **Why Illegitimate?** Here, *E* (the table) adds *no genuine explanatory power* beyond what T2 provides with P (the particles arranged table-wise).
      *   **The "Why" Question:** Asking "Why are the particles arranged table-wise?" in T2 doesn't *need* an answer invoking the table. Answers could be: "Because a carpenter assembled them that way yesterday," "Because of gravitational and electromagnetic forces," "Because of the history of the universe." Invoking the table as the explanation is circular – the arrangement *defines* the table. *E* doesn't explain anything *new* or *different*; it just re-labels the arrangement.
      *   **Truth & Fundamentality:** Saying "The table supports the cup" is true *in virtue of* the particle arrangement and forces. Claiming it's only "loosely true" without *E* mischaracterizes the success of T2. T2 captures *all the facts* that make the sentence true. Declaring T1 "more fundamental" based solely on the *possession of E* is arbitrary – T2 proponents can equally claim *their* ontology (only particles) is more fundamental. *E* is doing no real work; it's just a conceptual placeholder. The "work" claimed for it (grounding truth, explaining arrangement) is illusory; it's parasitically derived from the description in T2.

  **The Crucial Edge: Irreducible Explanatory Role vs. Reductive Re-Description**
  *   **Legitimate:** *E* is invoked to explain a *distinct phenomenon* or aspect of reality *not fully capturable* or *not explicable* within the resources of T2 alone (e.g., subjectivity, perhaps certain quantum phenomena, fundamental laws). There's a *prima facie* gap that *E* purportedly fills.
  *   **Illegitimate:** *E* is invoked to explain *precisely the same phenomena* already completely explained by T2, often by simply restating the T2 description in different terms ("The particles are arranged that way *because it's a table*"). The "explanation" provided by *E* is either circular or adds nothing new. The claims about fundamentality or derivative truth are assertions based on preference, not on *E* doing any genuine, independent explanatory labor that T2 cannot perform.

  ### How to Spot Illegitimate Free-Riding at the Pub (The Test)
  When someone makes the load-bearing move for *E*, ask:
  1.  **The "What Work?" Test:** *What specific explanatory work does E do that cannot be done by the ontology of T2?* Point to a phenomenon *distinct* from what T2 directly describes. If the answer boils down to "explaining why the T2 description is the way it is," it's likely circular/re-descriptive.
  2.  **The "Counterfactual" Test:** *If E didn't exist, what observable difference would it make according to T1?* If the answer is "None, *but*..." followed by metaphysical claims (fundamentality, derivative truth), that's a red flag for illegitimate free-riding. (Contrast with consciousness: *If consciousness didn't exist, subjective experience wouldn't exist* – a clear difference, even if private).
  3.  **The "Grounding Asymmetry" Test:** *Does the claim that T2's truths are "derivative" reveal a genuine asymmetry, or is it just a label for the ontological preference?* If the T2 proponent can give a coherent account of truth and explanation *without* needing the grounding relation to *E*, and without loss, then the asymmetry claim is suspect.

  ### Conclusion
  You've pinpointed a common and often problematic dialectical move in metaphysics: the **Ontological Free-Ride**. The posit *E* is introduced in an epistemically sterile zone (no possible evidence can touch it) but is then tasked with carrying the full weight of fundamentality, explanation, and truth-grounding. This move is **legitimate only if *E* genuinely provides *irreducible explanatory power* concerning a phenomenon *not captured* by the rival theory T2** (e.g., emergent properties like consciousness). It is **illegitimate when *E* merely re-describes or parasitically depends on the explanatory resources already present in T2, adding nothing novel** (e.g., composite objects like tables over particles, superfluous theoretical quantities).

  Armed with this distinction and the "What Work?" test, your pub debates should gain some much-needed clarity. You can now challenge the load-bearing move: "You've conceded we can't detect *E*, and T2 explains all the phenomena. What *specific, irreducible* explanatory work is *E* doing that T2 cannot? If it's just grounding why T2 is the way it is, that sounds like a re-description, not an explanation." Good luck!
