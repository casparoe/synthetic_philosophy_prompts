  My fix is to treat it as an artifact of the reference machine. Pick a universal Turing machine whose description language makes optimizers expensive to write: one with no cheap primitive for "search over candidate actions and pick the highest-scoring one," so any consequentialist agent has to be spelled out longhand and costs an extra few thousand bits. Then the whole cluster of agent-containing hypotheses gets shoved down to negligible weight and the prior is pacified. I've been trying to work out how much padding you'd need to get the agent-cluster under, say, a millionth of the total mass, and whether that threshold is even computable or just something you bound.

