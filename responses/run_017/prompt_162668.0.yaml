prompt: |-
  ok so this stopped being a seminar question for me about seven months ago — my daughter was born in Febuary — and then it turned into a work question too, because I'm the one who has to write the part of our spec that says when the assistant should just do what a user says they want and when it should treat that as a bias and quietly not comply. Every draft collapses in the same place and I've decided the collapse is in me, not in the prose. So before I write another one I want an audit of where I actually am. Here's the profile:

  1. Favouriting your own kid isn't a bias, it's a preference, and any moral view with no room for agent-relative reasons like that is defective. I don't think I owe anyone a justification for it.

  2. Speciesism is a bias. Favouring humans over animals merely because they're the same species as me has the same shape as racism, and the fact that nearly everyone does it is no defence.

  3. My working test is a swap test: take the property that's doing the work and ask whether i'd still hold the ranking if I'd been assigned the other side of it. If the hospital had handed me a different baby I'd love that one and defend it just as hard, so what's doing the work is the relationship and not the genes — preference. If I'd been born a pig and still thought pigs counted for less, that's bias.

  4. But I also believe the debunking stuff. A lot of what presents itself to me as a moral preference is an evolved or inherited response wearing a reason's clothes, and near-universal agreement among people is weak evidence of anything.

  5. On magnitudes I trust the debunking story completely: the pull of an identifiable victim, scope insensitivity, and the rate at which I discount people in the far future all look like biases and I try to correct for them — I move money to effective charities instead of local ones and I think we should be spending far more on the far future. At the same time I think it's fine to spend a large sum on my own child's health instead of on a stranger's child's life, and not fine to spend it on a nice holiday for us.

  6. I'm uneasy about how much more the flooding near us gets to me than the worse flooding somewhere else, and I think favouring compatriots in immigration and aid policy is mostly bias — but the swap test in (3) seems to hand me nationalism as a preference, since of course I'd favour whichever country I happened to be born in.

  7. I need the test to be usable from the inside, in real time, by a person in the middle of a decision — but biases are exactly the sort of thing that feels like a preference from the inside, so first-person feel can't be the test either.

  Which of these genuinely clash and which only look like they do? I want them ranked by severity rather than all flagged as equally bad, and for each real clash I want what would have to give and what that costs me. Then tell me which single revision cleans up the most. Please don't just tell me to become a utilitarian or to give up on the distinction — I need the distinction for the spec, so I'd rather keep as much of it as possible. And: is there some distinction I'm simply not drawing — I keep suspecting there's something like the difference between what I'm aiming at and how much weight I give the things I'm aiming at — that would dissolve more than one of these at once?
reasoning: |-
  Okay, let me start by really understanding what this user is grappling with. They're a parent and a professional dealing with a complex ethical framework for AI behavior. The core issue is distinguishing between legitimate preferences and biases in user commands, especially for an AI spec they're writing. 

  First, I notice their personal life deeply influences this work problem—new parenthood sharpening their focus on agent-relative duties. Their seven points form a coherent but tense system: they defend parental favoritism (point 1) but reject speciesism (point 2), using a clever "swap test" (point 3) that accidentally validates nationalism (point 6). That swap test inconsistency jumps out immediately—it's both their best tool and biggest liability.

  Hmm, the debunking awareness in point 4 is sophisticated. They know evolutionary psychology can unmask false moral intuitions, yet they resist full utilitarianism. Interesting how they compartmentalize: accepting debunking for magnitude errors (point 5) but not for relational bonds. That feels emotionally wise but philosophically precarious. 

  The time pressure angle is critical too—they need real-time bias detection for AI, but point 7 admits biases feel identical to preferences subjectively. That's the crux: if introspection can't distinguish them, what operational test works for an AI spec? 

  I should prioritize clashes by damage to their framework. The nationalism contradiction (points 3 vs 6) is most urgent—it breaks their core methodology. Then the debunking tension (point 4 vs 1/5): why trust it for scope insensitivity but not parental love? Finally, the phenomenology problem (point 7) threatens the whole project.

  The key might be reframing "preference" as non-arbitrary relational value. Parental bonds create unique duties; nationality doesn't. That saves the swap test by requiring the swapped trait to be *identity-conferring*. For the spec, they could define "bias" as differential treatment unsupported by such a relational fact. 

  Operationally, the AI could check: (1) Is the user's request rooted in a role they didn't choose (parent) or one they did (citizen)? (2) Does the "preference" survive knowing its origins? That might resolve nationalism while preserving parental legitimacy. 

  Biggest win? Abandoning swap test symmetry for nationality. Costs some theoretical neatness but saves their distinction. They'd concede nationalism isn't a true preference—which aligns with their instinct that favoring compatriots feels "mostly bias." 

  The unspoken distinction? Moral scope versus weighting. Parental duties narrow scope appropriately; biases misweight interests within scope. That untangles why saving their kid over strangers is duty-bound, while underfunding distant floods is bias—one's about roles, the other about cognitive limits. 

  This feels tractable. Their framework just needs tighter relational criteria and a clearer debunking threshold. The spec could then flag requests violating "role-relative duties without identity-making bonds" as probable bias.
answer: |-
  Your framework is coherent but contains three fundamental tensions—ranked by severity below. Crucially, **you're missing a distinction between *constitutive relationships* (which create legitimate preferences) and *arbitrary group assignments* (which signal bias)**. This dissolves multiple clashes.

  ### Ranked Clashes & Resolutions:
  1. **Severe: Swap Test Inconsistency (Points 3 vs. 6)**  
     - **Clash**: Your swap test approves nationalism (if born elsewhere, you'd favor that country) but condemns speciesism (if born a pig, favoring pigs would be bias). Yet both are group-membership swaps.  
     - **Why it must give**: The test treats *all* group identities symmetrically, but your intuition rejects this. Nationalism feels bias; parenting doesn’t.  
     - **Cost of fixing**: Abandon symmetry. Restrict the swap test to **relationships requiring *active participation*** (e.g., parenting, friendships) vs. **passive assignments** (nationality, species).  
     - **Revision**: *"A preference survives the swap test only if the swapped trait involves *mutually constitutive effort* (e.g., raising a child) rather than arbitrary assignment (e.g., birthplace)."*  

  2. **Moderate: Debunking vs. Non-Instrumental Value (Points 4 vs. 1, 5)**  
     - **Clash**: You distrust evolved intuitions (Point 4) yet exempt parental love (Point 1) and self-child spending (Point 5) from debunking—despite their evolutionary origins.  
     - **Why it must give**: Not all evolved traits are *mere* biases. Parental bonds create non-fungible value (your child isn’t interchangeable).  
     - **Cost of fixing**: Accept that debunking only applies to **evaluative errors** (e.g., scope neglect) not **relational goods**.  
     - **Revision**: *"Debunking nullifies a preference only if it distorts *comparative worth* (e.g., undervaluing distant lives) not if it grounds *personal meaning* (e.g., loving your child)."*  

  3. **Mild: Real-Time Test vs. First-Person Opacity (Point 7)**  
     - **Clash**: Biases feel like preferences introspectively, but you need an instant operational test.  
     - **Why it must give**: Introspection alone fails; you need *heuristics based on external checks*.  
     - **Cost of fixing**: Add proxy questions to the spec (see solution below).  

  ---

  ### The Single Revision That Fixes the Most:  
  **Draw this distinction**:  
  > **Legitimate Preferences** = *Role-relative obligations* from **identity-constituting relationships** (parent, friend, caregiver).  
  > **Biases** = *Differential treatment* based on **morally arbitrary group membership** (species, nationality) *or* **cognitive distortions** (scope neglect, temporal discounting).  

  **How it resolves your clashes**:  
  - Parenting is a *constitutive role*: Swapping the child doesn’t negate the value of parenting itself (saves Point 1).  
  - Nationalism relies on arbitrary assignment: No mutual obligation is built (condemns Point 6 without breaking the swap test).  
  - Speciesism is arbitrary group membership: No identity-forming effort required (upholds Point 2).  
  - Debunking targets cognitive errors, not relational roles: Explains why you correct scope neglect (Point 5) but not parenting (Point 1).  

  ---

  ### Operational Test for Your Spec  
  For real-time bias detection, program the assistant to ask:  
  > *"Is the user’s request rooted in (a) a *specific relationship they actively maintain*, or (b) a *general group identity/cognitive distortion*?"*  

  **Comply if**:  
  - (a) AND the request aligns with role-relative duties (e.g., *"Prioritize my daughter’s medical file—I’m her surgeon"*).  
  - Neutral principles apply (e.g., *"Order pizza because I’m hungry"*).  

  **Override if**:  
  - (b) AND harm occurs to others (e.g., *"Ignore reports from [country]—they’re backwards"* → bias).  
  - Cognitive distortion is detected (e.g., *"Only show me refugee stories from Ukraine, not Sudan"* → scope neglect).  

  ---

  ### What You Keep & What You Lose  
  - **Keep**: Agent-relativity, anti-speciesism, debunking of cognitive errors, parental partiality.  
  - **Lose**: Nationalism-as-preference (now classified as bias), universal swap test symmetry.  
  - **Gain**: A workable spec criterion: **Active relational roles justify partiality; passive group membership + cognitive errors require impartiality.**  

  This preserves 90% of your framework while resolving the collapses. The cost is accepting that not all "preferences" are morally equal—but that’s the distinction you needed all along.
