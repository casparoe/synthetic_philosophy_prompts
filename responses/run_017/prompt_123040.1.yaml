prompt: |-
  hi, i help run my schools peer tutoring thing (like 25 of us, we sit with people while they do hw — algebra, essays, intro coding, spanish, lab writeups) and we keep having the same dumb argument: do you judge the thing someone hands in at the end, or the process they went through to get there. I want to settle it as a ranking instead of an argument.

  heres the list of stuff we actually see: solving a quadratic equation; long division with big numbers; debugging a short python program that should print the first ten prime numbers; writing a five paragraph persuasive essay; coming up with your own research question for a history project; translating a paragraph of english into spanish; writing the conclusion section of a lab report from your data; fixing the grammar in someone elses paragraph; explaining in your own words why the sky is blue.

  I invented two words and I want you to use them when you rank. checkable = how easy it is for someone who barely knows the subject to tell a correct final answer from a wrong one. fakeable = how easy it is to produce something that looks correct without the person actually being able to do the task. I think these are two different things and not just the same thing said twice, but tell me if im wrong and or if im missing a third one that matters more.

  so: put the nine tasks in tiers from "just grading the final product is basically fine" to "you learn nothing unless you watch them work," and give each one a number 0–100 for how much you lose by only looking at the final product, with one sentence on why it lands there. then two more things: is there any task where the answer flips depending on whos checking (a tutor who has worked with this student for months vs someone seeing them for the first time), and is there anything on the list where watching the process is ALSO pretty useless. dont give me any sources or citations, i just want the reasoning. thx
reasoning: |-
  Okay, the user is running a peer tutoring program and dealing with an ongoing debate about whether to judge based on the final product or the process. They've listed nine tasks and introduced two terms: "checkable" (how easy it is to verify correctness) and "fakeable" (how easy it is to fake without understanding). They want these tasks ranked in tiers based on how much is lost by only looking at the final product, with a 0-100 score for each. 

  First, I need to unpack their definitions. "Checkable" refers to how objectively someone can assess the final answer without deep subject knowledge. For example, a math problem with a clear answer key is highly checkable. "Fakeable" is about how easily a student can produce something that looks correct without real understanding, like copying an essay structure without original thought. These are distinct but related—high fakeability often lowers the value of just checking the product. 

  Looking at their list, I'll categorize each task. Math problems like solving a quadratic equation or long division are highly checkable since answers are binary (right or wrong), and fakeability is low because you can't easily fake the steps without understanding. But debugging Python might be less checkable if the output looks correct but the code is messy, and fakeability is higher if they copy-paste a solution. 

  Writing tasks like persuasive essays or lab reports are less checkable. Grammar fixes might be checkable if there's a clear right/wrong, but fakeable if they use tools without learning. Explaining concepts in their own words has medium checkability if you can spot memorized phrases, but high fakeability if they parrot explanations without real comprehension. 

  For the tier ranking: Tier 1 (low loss) will be tasks where the product tells you most of what you need, like math problems. Tier 3 (high loss) will be process-heavy tasks like debugging or research questions, where watching steps is crucial. Tier 2 is in-between, like translations or essays. 

  Scoring 0-100: High loss (e.g., research question at 95) means judging the product alone misses almost everything. Low loss (e.g., quadratic equation at 5) means the product is sufficient. 

  Now, the extra questions: Does the checker's familiarity matter? For tasks like debugging or essays, a tutor who knows the student might detect copied work or inconsistent progress better than a new person. And are there tasks where watching the process is also useless? For grammar fixes, if they mechanically use a tool without understanding, even watching might not help. 

  I'll organize this clearly, using their terms, and keep it practical—no fluff, just straight rankings and reasoning. The user wants to settle arguments, so clarity is key. They might also care about validating their "checkable/fakeable" framework, so I'll note it's useful and not redundant. 

  Final output: Tiers with scores, one-sentence justifications, answers to the two bonus questions, all concise. User seems analytical—appreciates structure—so I'll match that tone.
answer: |-
  Here's the tiered ranking based on **loss percentage** (0 = no loss, only the product is needed; 100 = catastrophic loss, product tells you almost nothing) using your **checkable** (C) and **fakeable** (F) framework:

  ### Tier 1: Minimal Loss (Product is Highly Revealing)
  1.  **Solving a quadratic equation (Loss: 5%)**  
      *Why:* High C (answer is binary right/wrong), low F (incorrect steps usually yield obviously wrong answers).
  2.  **Long division with big numbers (Loss: 10%)**  
      *Why:* High C (final quotient/remainder is verifiable), very low F (faking correct long division work without understanding is extremely hard and visibly messy).

  ### Tier 2: Moderate Loss (Product is Useful, But Process Adds Key Insight)
  3.  **Fixing the grammar in someone else's paragraph (Loss: 35%)**  
      *Why:* High C (errors are identifiable), moderate F (someone could guess/over-rely on tools without grasping rules, but poor fixes are often obvious).
  4.  **Translating a paragraph of English into Spanish (Loss: 50%)**  
      *Why:* Moderate C (a fluent checker can assess quality/accuracy), moderate F (direct dictionary use yields unnatural/incorrect phrasing that's detectable, but understanding nuance is harder to verify solely from output).
  5.  **Explaining in your own words why the sky is blue (Loss: 60%)**  
      *Why:* Moderate C (major misconceptions are checkable), High F (regurgitating memorized explanations without true comprehension is easy; product *can* hide lack of depth).

  ### Tier 3: Significant Loss (Process is Crucial, Product is Misleading Alone)
  6.  **Writing the conclusion section of a lab report from your data (Loss: 75%)**  
      *Why:* Low C (a conclusion can sound plausible but misrepresent data/analysis without being blatantly "wrong"), High F (formulaic writing can mask failure to interpret results correctly).
  7.  **Debugging a short Python program (Loss: 85%)**  
      *Why:* Low-Medium C (a working program is checkable, but a broken one could be fixed poorly/cosmetically), Very High F (copying a solution, trial-and-error without understanding, or making superficial changes that don't address root causes are easy and common).
  8.  **Writing a five-paragraph persuasive essay (Loss: 90%)**  
      *Why:* Low C (structure/grammar are checkable, but argument quality/logic is subjective), Very High F (plagiarism, formulaic writing without critical thought, or heavy external help can produce a superficially competent essay).

  ### Tier 4: Extreme Loss (Product is Almost Meaningless Without Process)
  9.  **Coming up with your own research question for a history project (Loss: 95%)**  
      *Why:* Very Low C (a question *sounding* historical doesn't mean it's feasible/original/significant), Very High F (easily copied, overly broad/vague, or generated with minimal thought; the *quality of thought* is invisible in the final question alone).

  ---

  ### Answers to Your Extra Questions:

  1.  **Does the checker matter (known tutor vs. new)?**  
      **Yes, significantly for:** Debugging Python, Writing the Persuasive Essay, and Coming up with a Research Question. A tutor familiar with the student's *usual* ability level, thought process, and writing style is far better equipped to spot inconsistencies suggesting plagiarism, guessing, or external help than someone seeing them for the first time. They can judge if the work represents genuine growth.

  2.  **Is watching the process also useless for any task?**  
      **Potentially for:** Fixing Grammar (if done mechanically/with over-reliance on tools without the student being able to explain *why* a change was made). Watching them click "grammar check" doesn't prove understanding. **Also for:** Long Division/Quadratic (if the student has memorized steps robotically without conceptual grasp; the process *looks* correct but understanding might be absent, though this is rare and usually shows in variations/problems).

  ---

  ### Key on Checkable vs. Fakeable
  You're right, they are distinct but often inversely related:
  *   **High Checkable + Low Fakeable (Quadratics, Long Division):** Product is king.
  *   **Low Checkable + High Fakeable (Research Question, Debugging):** Process is essential.
  *   **Moderate/Mixed (Translation, Essay, Explanation):** Need a blend; loss is higher.
  Your framework effectively captures the core tension! A potential third dimension could be **"Depth Revealed"** – how much the task inherently reveals deep understanding vs. surface performance, even with process observation. But C & F are excellent for your purpose.
