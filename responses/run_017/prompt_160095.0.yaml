answer: |-
  ## The Obsolescence Test: Does Philosophy Actually Move Forward?

  Is philosophy stuck? As a science journalist, I’ve heard the whispers: while physics lands probes on comets and biology edits genes, philosophers seem eternally locked in debate with long-dead Greeks and Germans. To move beyond vague impressions, I propose a specific diagnostic: the **obsolescence share**. Imagine the curriculum for a new PhD student in a field. What fraction of their *essential* training focuses on ideas or methods their own discipline currently considers outdated or purely historical, rather than actively engaged with as part of today’s working toolkit? If that fraction stays stubbornly high generation after generation, it suggests the field isn’t accumulating durable knowledge – it might be spinning its wheels.

  But this needs sharpening. What counts as “live”? Let’s define it as material presented *not* as historical curiosity, but as directly relevant to formulating or critiquing *current* positions in leading journals and conferences within the last decade. Who is “the field”? We must consider sub-disciplines (philosophy of mind, ethics, logic) individually, as obsolescence might vary. The “window” for obsolescence? Material superseded for more than 50 years feels like a reasonable benchmark – long enough for consensus to potentially form on its inadequacy.

  **Running the Test: Biology vs. Philosophy**

  Take molecular biology. A new graduate student spends immense effort mastering CRISPR-Cas9 gene editing, next-generation sequencing analysis, advanced microscopy techniques, and current models of gene regulation. Do they study Mendel’s original pea paper? Perhaps briefly, as a foundational *historical* moment, illustrating the birth of genetics. Do they grapple with the specific chemical details of early 20th-century experiments proving DNA is the genetic material? Likely not; those results are accepted bedrock, the *methods* used are obsolete. The obsolescence share in molecular biology training is remarkably low – close to zero. The field rapidly discards outdated tools and models in favor of more powerful, accurate ones. Progress is cumulative and evident.

  Now, philosophy. Entering graduate school, a student will spend significant time engaging directly with texts like Plato’s dialogues, Descartes’ *Meditations*, Hume’s *Treatise*, and Kant’s *Critiques*. Crucially, they are not presented merely as historical artifacts. Students are taught to *argue with* Plato about the nature of justice, to dissect Descartes’ arguments for mind-body dualism as if he were a contemporary participant in a seminar, to see if Hume’s skepticism about causation can be refuted *today*. Positions declared obsolete – like the idea that we directly perceive “sense-data” (subjective mental objects) rather than the world itself – often resurface in new terminology (e.g., discussions of “qualia” or “representational content”). Core debates about free will, the mind-body problem, or the foundations of morality show remarkable persistence, even if the language shifts. The obsolescence share in philosophy – especially in its core “armchair” subfields – is undeniably high, perhaps 30-50% or more of foundational training. By this diagnostic, philosophy seems stagnant.

  **The Objection: Is the Test Rigged?**

  This is where philosophers (and perhaps some historians or mathematicians) will rightly protest. The objection is powerful: *The obsolescence share test fundamentally misunderstands philosophy’s subject matter.* Biology studies the empirical, evolving physical world. Its tools and models become obsolete because we develop better ones to probe that changing reality. Philosophy, however, grapples with enduring conceptual, logical, and normative questions: What is knowledge? What is justice? What *is* a mind? What *should* we do?

  Old texts aren’t obsolete data; they represent fundamental, often brilliantly formulated, *arguments* about these timeless questions. Plato’s *Republic* isn't a faulty microscope; it's a profound exploration of political ideals that remains relevant evidence in the ongoing investigation of justice. The objection contends that philosophy *does* make progress, but of a different kind, invisible to the obsolescence share:

  1.  **Articulation & Argumentative Hygiene:** Philosophy gets vastly better at clarifying questions, spotting hidden assumptions, and rigorously evaluating arguments. We have sharper tools for analyzing concepts, detecting fallacies, and structuring debates. This is genuine improvement.
  2.  **Building Reusable Machinery:** Philosophy *exports* powerful tools. Formal logic (especially modal logic dealing with possibility and necessity), decision theory, Bayesian epistemology (quantifying rational belief updating), game theory – these were forged in philosophical fires and are now indispensable in fields from computer science to economics to cognitive psychology. This is tangible, cumulative progress.
  3.  **Redescription (The Skeptic's View):** The cynical view is that progress often just means dressing old disputes in new jargon – swapping “sense-data” for “phenomenal properties” while the underlying puzzle of perception persists.

  **What the Diagnostic Sees (and Blinds Us To)**

  The obsolescence share test excels at revealing the *third* kind of alleged progress – mere redescription. If positions keep returning under new names, the share stays high. It can *indirectly* hint at the *absence* of the first kind – **eliminating positions**. Think of the justified-true-belief (JTB) analysis of knowledge. After Gettier’s tiny 1963 paper showing JTB wasn’t sufficient, that specific formulation was largely abandoned as *inadequate*. It became genuinely obsolete *as a complete answer*. The obsolescence share for JTB *as the definition* is now high – it’s taught as a historical step, not a live contender. This kind of elimination is rare in philosophy’s core areas but happens more often in its interface with science (e.g., vitalism in philosophy of biology).

  Crucially, **the obsolescence share test is almost completely blind to the second kind of progress: building reusable machinery.** A student learning modern Bayesian epistemology might reference Bayes himself (18th century!), but they spend their time mastering the *current, powerful formal framework* derived from those ideas. The *tool* is live; its historical origin isn’t the focus. Similarly, learning advanced modal logic is mastering a current tool, even if Leibniz is mentioned. The obsolescence share for the *tool itself* is low; only its ancient precursors are obsolete. The test, focused on "material" in training, misses this distinction if the *teaching* foregrounds the historical argument alongside the modern tool.

  **Verdict: Progress, But Not Where We Usually Look**

  So, does the high obsolescence share condemn philosophy? Not entirely. The diagnostic reveals a deep truth: **philosophy’s core subject matter – conceptual and normative exploration – resists the kind of definitive position-elimination common in empirical sciences.** Answers aren’t settled by experiment but by ongoing argument about enduring puzzles. Old texts remain vital evidence in these arguments, hence the high obsolescence share in foundational training. We shouldn’t expect Plato to become obsolete in ethics like an old microscope in a lab.

  However, the test’s failure teaches us where progress *does* occur. The objection wins in highlighting philosophy’s unique domain, but we shouldn’t overcorrect. The persistence of core debates *is* significant. True elimination of major positions (like JTB) is rare. Much energy *is* spent refining and redescribing.

  **The real progress lies elsewhere:**
  *   **In exported machinery:** Philosophy *has* built powerful, accumulating tools (logic, decision theory, formal epistemology) used widely.
  *   **In articulation:** The field is vastly more rigorous and self-aware in its methods than centuries past.
  *   **Locally at the frontiers:** At the cutting edge, especially where philosophy interacts with science (philosophy of physics, cognitive science), specific models *can* be tested and refined, leading to smaller-scale consensus and obsolescence.

  Philosophy progresses, but not primarily by burying its past or converging on final answers to its biggest questions. It progresses by sharpening the questions, forging better argumentative tools, building conceptual machinery that empowers other fields, and achieving smaller, context-specific clarifications. The high obsolescence share isn’t proof of failure; it’s a signature of philosophy wrestling with questions that transcend any single era's tools. The progress is real, but it’s in the refinement of the conversation and the tools it creates, not in the final silencing of Plato or Kant.

  \answer{Yes — in exported tools, articulation, and local refinements, not in eliminating core doctrines}
