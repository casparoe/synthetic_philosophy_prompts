answer: |-
  ### Brainstorming Key Distinctions from Cognitive Penetration Literature  
  **Relevant distinctions for evidence assessment in biodiversity recording:**  
  1. **Experience vs. judgment/reporting penetration**:  
     - *Experience*: Did prior beliefs alter the observer's sensory experience (e.g., "seeing" a rare bird due to expectation)?  
     - *Judgment/response*: Did beliefs only affect post-perception processes (e.g., interpretation, memory, or reporting)?  
     - **Practical takeaway**: Focus on whether the record reflects sensory evidence or could be explained by biased interpretation.  

  2. **Alternative explanations**:  
     - *Task demands*: Did the observer feel pressured to report a species (e.g., due to prompts)?  
     - *Imagery/memory*: Could details be imagined or misremembered (e.g., brief views, poor conditions)?  
     - **Practical takeaway**: Prioritize conditions where sensory input is weak (degraded/brief stimuli), increasing susceptibility to bias.  

  3. **Encapsulation/modularity debates**:  
     - Perception is "cognitively impenetrable" if it resists top-down beliefs, but this weakens under ambiguity (e.g., fleeting glimpses).  
     - **Practical takeaway**: Ambiguous observations are high-risk; require stronger evidence.  

  4. **Long-term expertise vs. occurrent beliefs**:  
     - *Expertise*: Trained observers (e.g., experienced birders) have reliable perceptual learning.  
     - *Occurrent beliefs*: Immediate expectations (e.g., alerts) can distort perception or reporting.  
     - **Practical takeaway**: Trust expertise but scrutinize records influenced by recent, species-specific triggers.  

  5. **Circularity of evidence**:  
     - Beliefs shaping experiences cannot provide independent confirmation (e.g., "I saw it because I expected it").  
     - **Practical takeaway**: Treat records following alerts/prompts with skepticism unless backed by objective evidence.  

  6. **Firestone & Scholl (2016) critique**:  
     - Many "top-down effects" are actually judgment biases. Robust perception requires controlling for task demands and stimulus quality.  
     - **Practical takeaway**: Demand high-quality sensory evidence (e.g., photos, diagnostic details) to rule out alternative explanations.  

  **Distinctions to retain in a 5-minute checklist** (simple, actionable, front-line friendly):  
  - ✅ **Retain**: Experience vs. judgment (simplified to: "Could bias affect what was seen vs. what was reported?").  
  - ✅ **Retain**: Alternative explanations (task demands, imagery/memory) under weak stimulus conditions.  
  - ✅ **Retain**: Occurrent beliefs (alerts/prompts) as red flags.  
  - ✅ **Retain**: Expertise as a trust factor.  
  - ✅ **Retain**: Circularity risk (alert + weak evidence = downgrade).  
  - ✅ **Retain**: Firestone & Scholl’s emphasis on evidence quality.  
  - ❌ **Drop**: Modularity debates (too theoretical), long-term vs. occurrent distinctions (folded into "expertise" and "alerts").  

  ---

  ### Verification Procedure for Biodiversity Records  
  **Goal**: Quickly assess record reliability, balancing asymmetric costs (false positives halt development; false negatives hide extinctions). Downgrade if cognitive bias risk is high. Use a 5-step flow.  

  **Form Fields to Add at Submission** (critical for evidence assessment):  
  1. **Observation duration** (seconds/minutes).  
  2. **Distance to subject** (meters/feet).  
  3. **Weather/lighting conditions** (dropdown: e.g., "sunny", "overcast", "dusk").  
  4. **Optical aids used** (e.g., binoculars, none).  
  5. **Awareness of alerts/prompts** (yes/no: "Did you know about recent alerts for this species?").  
  6. **Diagnostic features observed** (free text: require specifics, e.g., "wing bars", "call pattern").  
  7. **Confidence level** (scale 1–5; self-reported but useful for context).  

  **Verification Flow** (run for each record):  
  > **Key**: Stop and downgrade if criteria unmet. "Downgrade" = mark as "anecdotal" (excluded from atlases) or "corroboration-only" (upgraded if independent support emerges). All downgrades trigger a 2-sentence note.  

  1. **Is the species common and expected here?**  
     - *Sufficient answer*: Species is common in location/season (per atlas data).  
     - **Stop if yes**: Accept record. No further checks.  
     - **Proceed if no**: Species is rare, out-of-range, or seasonally unexpected.  

  2. **Was there a recent alert or prompt?**  
     - *Sufficient answer*: No alert/prompt targeting this species in the area ≤48 hours pre-submission.  
     - **Stop and accept if no**: Proceed to Step 3.  
     - **Proceed if yes**: Flag as "high bias risk".  

  3. **Is sensory evidence strong?**  
     - *Criteria*:  
       - Photo/audio present? **AND**  
       - Unambiguous diagnostic features visible? **OR**  
       - If no photo, field notes describe ≥2 diagnostic features (e.g., excludes lookalikes).  
     - **Stop and downgrade to anecdotal if no**: Note: "Insufficient evidence for rare species: no photo/diagnostic details."  
     - **Proceed if yes**: Accept if no alert (Step 2); if alert, proceed to Step 4.  

  4. **Were observation conditions optimal?**  
     - *Criteria*:  
       - Duration ≥30 seconds **OR**  
       - Clear weather/daylight **OR**  
       - Close distance (<50m) **OR**  
       - Optical aids used.  
     - **Stop and accept if yes**: Conditions reduce ambiguity.  
     - **Proceed if no**: Brief/poor conditions require expertise check (Step 5).  

  5. **Is the observer experienced?**  
     - *Criteria*: ≥50 verified records **OR** history with this species group.  
     - **Accept if yes**: Trust expertise over brief/poor conditions.  
     - **Downgrade to corroboration-only if no**: Note: "Rare species + brief view/novice observer. Corroboration needed."  

  **Handoff to Human** (for value judgments):  
  - Escalate if:  
    - Species is critically endangered (cost of false negative may outweigh procedure).  
    - Legal/political stakes are high (e.g., development permits).  
    - Evidence is borderline (e.g., photo ambiguous; human expert decides weight).  

  **What the procedure must NOT do**:  
  - Tell volunteers "what they really saw" (assess evidentiary value, not subjective experience).  
  - Override unambiguous evidence (e.g., a clear photo).  
  - Be used for non-visual/audio records (e.g., scat/tracks; requires separate protocol).  

  ---

  ### Case Applications  
  **Case 1: Rare warbler after alert**  
  - **Species**: Rare vagrant (not common).  
  - **Step 1**: Proceed (rare).  
  - **Step 2**: Alert 18h prior → "high bias risk".  
  - **Step 3**: No photo, but detailed notes → sufficient evidence. Proceed.  
  - **Step 4**: 12-second view → poor conditions. Proceed.  
  - **Step 5**: Observer experienced → **Accept**.  
  - **Note**: Expertise overrides brief view. Later reports are independent corroboration but irrelevant to *this* record’s validity.  
  - **Verdict**: Accept. Press release proceeds.  

  **Case 2: Novice’s blurred photo during prompt week**  
  - **Species**: Lookalike pair (high misID risk).  
  - **Step 1**: Proceed (prompt targets species).  
  - **Step 2**: Prompt active → "high bias risk".  
  - **Step 3**: Blurred photo → no diagnostic features visible. Field notes? (Unspecified; assume generic). → **Downgrade to anecdotal**.  
  - **Note**: "Blurred photo shows no diagnostic features. Prompt may influence ID."  
  - **Verdict**: Downgrade. Not used for atlas.  

  **Case 3: Whole-dataset prompt effects**  
  - **Issue**: Reports rise 40% during prompts.  
  - **Procedure application**:  
    - All records during prompts flagged in Step 2.  
    - Steps 3–5 filter low-evidence/poor-condition/novice submissions.  
    - Verified records should show lower rise (e.g., 10–20%) after filtering.  
  - **Risk**: If rise persists in verified data, it reflects real detections (prompts boost effort, not bias).  
  - **Action**:  
    - Audit: Compare verified vs. unverified reports during prompts.  
    - If verified reports spike, keep the feature (it works).  
    - If downgrades spike, add a submission warning: "Prompts don’t guarantee species presence; focus on diagnostic evidence."  
  - **Verdict**: Procedure protects dataset integrity; prompts stay if verified data is clean.  

  ---

  ### Limitations and Honesty  
  **Cases the procedure cannot settle**:  
  - Subjective judgments (e.g., "Was that blob in the photo a wing bar?"). → Escalate to human.  
  - Volunteers with conflicted incentives (e.g., "I need this record for my reputation"). → Not detectable; trust the evidence.  

  **Judgment calls dressed as procedure**:  
  - Step 5 ("experienced" threshold is arbitrary; relies on reviewer knowing user history).  
  - Step 4 ("optimal conditions" involves subjective thresholds).  

  **Cost to your engagement feature**:  
  - The procedure may reduce prompt-driven submissions by downgrading low-quality records. This is a win: it ensures spikes reflect real biology, not bias. Pitch to funders as "quality control for community science."  

  **Final warning**: Never use this to confront volunteers about their perception. Focus notes on evidence gaps (e.g., "No photo," "Brief view")—not their competence.
