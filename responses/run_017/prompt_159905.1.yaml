  2. **Alternative explanations (task demands, imagery, memory)**: We should consider whether the report could be explained by the observer trying to please the task (e.g., reporting what they think we want), by mental imagery (e.g., imagining features not present), or by memory errors (especially if the observation was brief or long ago).

  3. **Stimulus conditions**: Degraded, brief, or ambiguous viewing conditions increase the chance of top-down influence. We can check the observation conditions (duration, distance, lighting, etc.) and the distinctiveness of the species.

  4. **Long-term expertise vs. occurrent expectations**: Long-term expertise (e.g., a seasoned birder) might improve accuracy, while occurrent expectations (e.g., a recent alert about a rare bird) might introduce bias. We can use the observer's history as a proxy for expertise and check for recent alerts.

  5. **Circularity of evidence**: If an experience is shaped by the very belief it is supposed to confirm, then the evidence is circular and weak. We must be cautious when an observer reports a rare species shortly after an alert for that species.

