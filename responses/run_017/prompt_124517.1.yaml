prompt: |-
  I've been reading about Maxwell's demon on and off since the early Less Wrong days, and my understanding has stalled at the level of one-line answers: the demon acquires information, the demon must erase its memory, Landauer's bound of kT ln 2 per bit, the Szilard engine pays for itself, information is physical, entropy is a property of the map rather than the territory. None of those is wrong, but I want to know which one is actually load-bearing. So I'd like a ranking rather than a tutorial: no history of the debate, no citations, no tour of the literature — just your allocation of credit and the reasoning that separates the tiers.

  Take as the baseline case the textbook Szilard setup: one molecule, a one-bit memory, kT ln 2 of work available per cycle, and the demon appearing to get it for free. Here are five candidate places where the bill might be paid:

  1. Acquisition. Measurement itself is thermodynamically expensive: to see which side the molecule is on you need a signal distinguishable from the thermal background, and that costs more than the cycle returns.
  2. Erasure. Measurement can in principle be done reversibly and for free; the dissipation is deferred to resetting the memory, at kT ln 2 per bit, and that is where the second law is saved.
  3. Bookkeeping. The demon never breaks the second law at any stage; the law simply has to be stated over the joint system of gas, memory, and their correlations. On the modern feedback-control version of the bound, extractable work can exceed the usual free-energy limit in proportion to the mutual information gained, so the information behaves as a consumable resource rather than a line item billed at a particular step.
  4. Substrate. Any controller is a physical system with a finite state space, a clock, and actuators. The demon's own hardware dissipates, runs down, or dies, and the flapper-valve and ratchet-and-pawl failures are the same moral in a simpler setting.
  5. Map, not territory. There is no bill to localize, because the paradox was an artifact of attributing entropy to the gas itself. What the demon has is not a quantity of negentropy but a relation between its information and the world, and the appearance of a violation comes from misdescribing whose uncertainty is in question.

  Allocate 100 points across these by how much of the real explanatory work each does, in a way that sums to 100, assign each a tier (S through F), and give one sentence of justification per entry. Steelman the two entries you rank lowest before you put them there. If you think two of the five are secretly the same move stated differently, merge them and reallocate. If the genuinely load-bearing move is not on my list, add it as a sixth entry and still make the total come to 100.

  Then stress-test the allocation against three variants of the baseline:

  B. No erasure inside. An external factory feeds the demon an endless tape of pre-zeroed bits, and spent bits are shipped out of the box unread. Erasure happens, but not to the demon and not to anything inside the box.
  C. No measurement. The demon prepared the initial state itself and already knows which side the molecule is on; it gains no new information during the cycle and yet still seems to collect kT ln 2.
  D. Fully coherent controller. The demon is a reversible quantum computer: it records the molecule's location as a coherent correlation, never collapses anything, never erases, and uncomputes its record at the end of the cycle.

  For each variant, say which candidates drop to near-zero credit in that world, and say why the survivors survive. Finally, name the single variant you would keep as the cleanest test of whether an account is doing real work, and state, as a single number, how much of the total burden you would give to the claim that the demon's information is a finite resource that gets used up.
reasoning: |-
  Alright, let me tackle this user's query about Maxwell's demon. They've been studying it since the Less Wrong days and have a list of one-line explanations, but they want to rank five candidates for where the thermodynamic cost is paid. The goal is to allocate 100 points across these, assign tiers, and then test against variants.

  First, I need to understand each candidate. The user mentions acquisition, erasure, bookkeeping, substrate, and map vs. territory. They want a ranking without history or citations. The baseline is the Szilard engine with one molecule and a one-bit memory. 

  Starting with the candidates:
  1. **Acquisition**: The idea that measuring costs energy because you need a signal above thermal noise. But in theory, measurement can be reversible. So maybe this isn't the main cost.
  2. **Erasure**: Landauer's principle says erasing a bit costs kT ln 2. This is often cited as the solution. But is it always necessary?
  3. **Bookkeeping**: The joint system of gas and memory must be considered. Mutual information allows work extraction, making information a resource. This seems key because the demon's knowledge correlates with the system.
  4. **Substrate**: Physical controllers dissipate energy. But would an ideal, frictionless system still have costs? Probably not the core issue.
  5. **Map vs. Territory**: Entropy is about knowledge, not the physical state. The paradox arises from misattributing uncertainty. But does this fully resolve the problem?

  The user also wants steelmanning for the lowest-ranked. Acquisition and substrate might be weaker. For acquisition, even if measurement can be free, in practice it might cost. Substrate: real devices have inefficiencies, but theoretically, they can be minimized.

  Now, the variants:
  - **Variant B (No erasure inside)**: The demon uses pre-zeroed bits and discards them. Erasure happens externally. If the cost is only in erasure, this should avoid it. But the second law still holds, so perhaps bookkeeping explains it via information as a resource.
  - **Variant C (No measurement)**: The demon already knows the state. Here, no new info is gained, but work is extracted. Bookkeeping still applies because the initial correlation allows work extraction. Erasure and acquisition aren't factors here.
  - **Variant D (Coherent controller)**: Quantum, reversible operations. No collapse or erasure. Uncomputation avoids Landauer's cost. Bookkeeping holds because mutual information is key, even in quantum terms.

  The cleanest test is Variant C (No measurement). It isolates whether the information resource itself is crucial. If the demon knows the state initially, the work comes from that prior information, not new measurement. Bookkeeping survives because it's about the correlation, not the act of measuring.

  Allocating points:
  - **Bookkeeping (55 points, S-tier)**: This is the core. Information as a resource explains all variants.
  - **Erasure (20 points, A-tier)**: Important but not universal. Landauer's principle applies in classical cases but not in variants B, C, D.
  - **Map vs. Territory (15 points, B-tier)**: Clarifies that entropy is epistemic but doesn't resolve the work extraction mechanism.
  - **Acquisition (5 points, C-tier)**: Sometimes relevant practically, but not theoretically necessary.
  - **Substrate (5 points, C-tier)**: Real-world issue, but not fundamental to the paradox.

  For the stress tests, in Variant B, erasure drops because it's external. Bookkeeping remains since the used bits carry away information. In Variant C, acquisition and erasure drop; bookkeeping holds. In Variant D, erasure and acquisition drop; bookkeeping and map/territory hold.

  The single number for information as a finite resource: 70%. This covers both the consumable aspect and the joint system approach, essential across all scenarios.
answer: |-
  ### Allocation of Credit (Baseline Szilard Engine)
  | Candidate | Points | Tier | Justification |
  |-----------|--------|------|--------------|
  | **3. Bookkeeping** | 55 | S | Mutual information is the fundamental resource enabling work extraction, and the second law holds only over the joint system-state. |
  | **2. Erasure** | 20 | A | Landauer's cost for memory reset localizes dissipation classically, but is a special case of information resource accounting. |
  | **5. Map, not territory** | 15 | B | Entropy is epistemic and relational, resolving the paradox's framing but not the physical cost mechanism. |
  | **1. Acquisition** | 5 | C | Measurement *can* be free in theory; cost arises only in noisy implementations, not the core paradox. |
  | **4. Substrate** | 5 | C | Hardware dissipation is practical but eliminable in idealized models; not intrinsic to the demon's challenge. |

  **Steelmanning Lowest-Tier Entries**:  
  - **Acquisition (Steelman)**: In realistic noisy systems, measurement requires energy to overcome thermal fluctuations, making it a thermodynamic sink.  
  - **Substrate (Steelman)**: All physical controllers (e.g., valves, transistors) have irreversible losses, so the demon inevitably "runs down" like any heat engine.  

  ---

  ### Stress-Testing Variants  
  **B. No erasure inside (endless pre-zeroed tape)**  
  - **Drops to near-zero**: Erasure (2) → External erasure avoids Landauer's cost *inside the system*.  
  - **Survives**: Bookkeeping (3) → Spent bits carry away mutual information, preserving second law in the joint system. Map/territory (5) → Entropy depends on external observer's ignorance.  

  **C. No measurement (demon knows initial state)**  
  - **Drops to near-zero**: Acquisition (1) → No measurement occurs. Erasure (2) → No memory to reset if no new data is stored.  
  - **Survives**: Bookkeeping (3) → Prior mutual information is still a consumable resource enabling work. Map/territory (5) → Entropy reduction relies on the demon's pre-existing knowledge.  

  **D. Fully coherent controller (quantum, uncomputation)**  
  - **Drops to near-zero**: Acquisition (1) → No wavefunction collapse. Erasure (2) → Uncomputation avoids irreversible deletion.  
  - **Survives**: Bookkeeping (3) → Work extraction bounded by quantum mutual information. Map/territory (5) → Coherence makes entropy explicitly observer-dependent.  

  ---

  ### Cleanest Test and Final Assessment  
  **Cleanest Test Variant**: **C (No measurement)**. It isolates whether information *as a resource* (not measurement/erasure) is load-bearing, by showing prior knowledge enables extraction without new data.  

  **Single-Number Burden for "Information as Finite Resource"**:  
  **70%** (Combining Bookkeeping's 55% + Map/territory's 15%, as they jointly formalize information's role as a consumable, correlation-dependent quantity).  

  #### Reasoning Summary  
  - **Bookkeeping (S-tier)** dominates because it subsumes erasure/acquisition as special cases and generalizes to all variants. Information is physical *as a relational resource*, not a localized cost.  
  - **Erasure (A-tier)** is historically significant but secondary: it fails in variants B, C, and D.  
  - **Map/territory (B-tier)** supports Bookkeeping by clarifying entropy is epistemic, but doesn't quantify work extraction.  
  - **Acquisition/Substrate (C-tier)** are implementation details: they vanish in idealized or quantum setups.  
  - **Variant C proves** that the demon expends its *informational advantage* (finite resource), not computational steps.  
  - **The 70% burden** reflects that information's "use" is central whether gained (baseline), pre-owned (C), coherent (D), or exported (B).
