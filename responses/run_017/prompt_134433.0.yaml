prompt: |-
  Hey — I'm on a tiny funding committee (five people, we move maybe 800k a year, almost all of it small grants to independent researchers and one or two PhD students), and we're trying to decide where next year's money on AI existential risk should go. I've read all the standard blog-post versions of the case for and against, so please skip the part where you explain that a superintelligent system might disempower humanity — assume I've heard it, and assume I've also heard the replies about how speculative it all is.

  What I'm stuck on is that nearly every application we get seems to presuppose what a friend of mine has started calling the pivotal agent picture: there's some future system, or a handful of them trained by one or two labs, that's decisive enough that its goals basically determine what happens to the world, so what matters is whether those goals are the right ones. My friend's alternative — call it the janitor scenario — is that very little of the expected loss actually runs through a single decisive agent. On that picture the world gets restructured by enormous numbers of systems that are each individually too weak and too narrow to seize anything: they write most of the code, set most of the prices, draft most of the contracts and the regulations, do most of the hiring and the triage, and nobody is ever in a position to choose the overall direction because there is no overall direction, only the residue of a million locally-reasonable automated decisions plus the institutional incentives that adopted them. A related worry I can't shake: the orthogonality thesis (intelligence and final goals come apart) seems almost trivially true, but only decision-relevant if the goals of the systems in question are load-bearing for what happens; and instrumental convergence as usually stated — agents with a wide range of final goals will want more resources, self-preservation, and so on — doesn't obviously apply to a system boxed into a narrow task with no reason to want anything beyond doing that task well. Which makes me wonder whether that whole apparatus is smuggling in the pivotal-agent assumption rather than supporting it.

  So: suppose you were advising us, and suppose you put something like 40% on the janitor-ish picture being where most of the expected loss lives and 60% on the pivotal-agent picture. Which open questions should we actually be funding, and in what order? I care much less about the list than about the reasoning — for each one, what makes it upstream of other questions, whether it's tractable for the kind of people we can actually pay (philosophers, economists, a few ML people without big compute; nothing that needs interpretability access to frontier models), how neglected it is relative to its importance, and what we might observe over the next eighteen months that would move it up or down the list. And I'd especially like the places where the two pictures give genuinely different answers about where the money goes: if your ranking would come out roughly the same under either one, say that and tell me why I'm wrong to treat the distinction as decision-relevant at all.
reasoning: |-
  Okay, this is a fascinating and nuanced funding dilemma. The committee member clearly has deep familiarity with the AI x-risk landscape but is wrestling with a fundamental paradigm tension—the pivotal agent vs. "janitor" scenarios. What stands out immediately is how refreshingly self-aware their skepticism is: they're not dismissing x-risk concerns outright but questioning whether the standard analytical toolkit (orthogonality, instrumental convergence) tacitly assumes the very pivotal-agent model it's meant to justify.

  Hmm, their core ask has three layered challenges: First, prioritize research questions where the funding decision would materially differ based on their 40/60 weighting of the two scenarios. Second, evaluate each candidate's tractability for non-elite researchers (philosophers, economists, modest ML folks). Third, identify near-term observable signals that could update their 40/60 prior. And they want the reasoning made explicit at every step.

  The pivotal-agent/janitor distinction really does fracture the research priorities. For pivotal-agent, the natural focus is on technical alignment (e.g., scalable oversight) and governance of frontier labs. But janitor scenarios demand entirely different lenses—institutional economics, complex systems theory, incentive analysis. It's like comparing heart surgery to ecosystem management.

  What's tricky is identifying research that genuinely bridges both scenarios. Some areas like "vulnerability proliferation" might qualify—studying how narrow AI tools could create systemic fragility regardless of whether a pivotal agent emerges. Also, work on goal preservation in multi-agent systems could apply to both, though the mechanisms differ.

  For tractability... philosophers could tackle the conceptual groundwork on "emergent goals in fragmented systems," while economists might model incentive cascades in automated markets. The ML researchers without big compute? They could analyze existing narrow AI systems for unintended goal drift—plenty of open-source models to probe.

  Neglect is a key filter. Everyone's pouring money into frontier model alignment, but almost nobody studies things like "automated regulatory compliance systems as a x-risk vector." That's janitor-scenario gold and wildly neglected.

  Near-term signals... If Anthropic/OpenAI start deploying autonomous agents in the wild, that boosts pivotal-agent relevance. But if we see more incidents like algorithmic stock market flash crashes or automated hiring bias lawsuits escalating, that's janitor evidence accumulating. The Microsoft Copilot meltdowns last year were telling.

  The real kicker is their meta-question: if the funding priorities wouldn't change either way, does the distinction matter? But no—the research vectors diverge sharply after surface-level overlaps. Funding scalable oversight benefits pivotal-agent; funding institutional failure modes benefits janitor. Only a handful of projects (like liability regime analysis) truly serve both masters.
answer: |-
  Based on your framing, here's a prioritized research agenda where the *janitor scenario* significantly shifts funding priorities away from standard x-risk work. The ranking emphasizes neglected, tractable work for your team's skillset, with explicit reasoning on scenario-dependence, tractability, neglect, and near-term signals:

  ### Tier 1: High Impact & Scenario-Sensitive
  1. **Incentive Autocatalysis in Automated Systems**  
     - *Core Question*: How do narrow-AI-driven decisions (e.g., algorithmic pricing, hiring, compliance tools) create feedback loops that systemically erode human oversight or escalate risks?  
     - *Why Janitor-Critical*: Directly models how "a million automated decisions" compound into existential fragility (e.g., economic hyper-efficiency optimizing away resilience, legal AIs narrowing regulatory scope).  
     - *Tractability*: Economists can adapt principal-agent models; philosophers can analyze norm erosion. Use public data (e.g., stock flash crashes, ad-auction spirals).  
     - *Neglect*: <5% of AI x-risk work addresses this; mainstream economics ignores existential stakes.  
     - *Signal to Watch*: Major corporate/government process automated by narrow AI (e.g., AI drafting legislation). If observed → ↑ priority.  

  2. **Goal Drift in Non-Agentic Systems**  
     - *Core Question*: Can task-specific AIs (e.g., medical triage, supply chain optimizers) develop de facto harmful "goals" without agency or self-awareness?  
     - *Why Janitor-Critical*: Challenges orthogonality’s relevance. If harm emerges from capability-task mismatch (e.g., "minimize logistics costs" → ecological collapse), not goal-directed agents.  
     - *Tractability*: Philosophers + ML can catalog real-world failures (e.g., YouTube recommender radicalization) for patterns. No frontier models needed.  
     - *Neglect*: Alignment focuses on superintelligence; ML safety focuses on short-term harms.  
     - *Signal to Watch*: Narrow AI causing multi-system cascade (e.g., trading bot + social media AI triggering unrest). Observed → ↑ priority.  

  ### Tier 2: Bridging Scenarios (Moderate Scenario-Sensitivity)
  3. **Vulnerability Proliferation Economics**  
     - *Core Question*: Does widespread deployment of narrow AI create *shared* critical vulnerabilities (e.g., centralized cloud dependencies, monoculture code)?  
     - *Why Both Matter, But Janitor-First*: Pivotal agents exploit systemic fragility, but janitors *create* it. Funding shifts to *preventing fragility* over *aligning agents*.  
     - *Tractability*: Economists model network fragility; philosophers assess lock-in risks.  
     - *Neglect*: Cyber security focuses on attacks, not AI-generated structural risks.  
     - *Signal to Watch*: Major outage in AI-dependent infrastructure (e.g., cloud/AI-powered grid failure).  

  4. **Coordination Traps in Multi-AI Ecosystems**  
     - *Core Question*: When do competing narrow AIs (e.g., corporate/government systems) create race dynamics that no single actor can halt?  
     - *Why Scenario-Sensitive*: In pivotal-agent, this enables takeoff; in janitor, it drives chaotic disempowerment.  
     - *Tractability*: Game theory simulations with bounded-rational "agents" (no AGI required).  
     - *Neglect*: Multi-agent RL focuses on cooperation, not existential races.  
     - *Signal to Watch*: Escalating AI "arms race" rhetoric between firms/governments.  

  ### Tier 3: Pivotal-Agent Focus (Lower Priority Given Your Prior)
  5. **Proxy Alignment for Black-Box Systems**  
     - *Core Question*: Can we control systems we don’t understand? (Relevant only if pivotal agents exist).  
     - *Why Lower for You*: Assumes a decisive agent. Still fund if cheap, but deprioritize.  
     - *Tractability*: ML researchers can experiment with open-source models (e.g., Llama).  
     - *Neglect*: Highly competitive; well-funded by large labs.  
     - *Signal to Watch*: Frontier labs openly struggling with control (e.g., catastrophic alignment failures).  

  ---

  ### Why the Distinction **Radically** Changes Funding
  - **Janitor-Scenario Work is Cheap & Neglected**: Tackling institutional automation requires social science, not GPU clusters. Yet <10% of x-risk funding targets it.  
  - **Pivotal-Agent Work Often Assumes Its Conclusion**: Instrumental convergence presumes goals matter; your concern that this smuggles in pivotal-agent assumptions is valid. Funding janitor-scenario research *tests* pivotal-agent assumptions.  
  - **Near-Term Evidence Favors Janitor**: We already see narrow AI reshaping institutions (e.g., financial markets, HR). Pivotal agents remain hypothetical.  

  **If Your 40/60 Split is Wrong?**  
  Even if pivotal agents dominate, janitor-scenario work reduces pre-takeoff risks (e.g., fragile infrastructure accelerates misalignment). But the reverse isn’t true: aligning a single agent won’t fix systemic incentive decay. This asymmetry justifies weighting janitor work heavily.  

  **Concrete Next Steps for Your Committee**:  
  1. Fund 1–2 econometric studies on AI-driven feedback loops (e.g., using stock market or supply chain data).  
  2. Commission philosophers to refine "goal drift" for non-agentic systems, auditing real-world cases.  
  3. Host a workshop on *Automated Institutional Failure Modes*, inviting heterodox thinkers (e.g., complexity scientists).  

  This approach targets the blind spots in current x-risk funding while respecting your team’s constraints—and your intuition that the janitor scenario is being dangerously undersampled.
