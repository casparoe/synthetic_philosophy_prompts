answer: |-
  ### Restatement of the Argument
  The argument contends that any moderate, non-sortal answer to the special composition question (e.g., organicism) must appeal to a scalar condition (e.g., metabolic unity), which inevitably generates borderline cases due to continuous variation in nature (e.g., colonial organisms). This indeterminacy transfers to whether composition occurs, violating the principle that existence must be determinate. Consequently, no moderate answer satisfies the demands for generality, non-arbitrariness, and determinacy, leaving nihilism or universalism as the only coherent options—both of which fail to explain *why* composition occurs.

  ### Brainstorming Candidate Diagnoses
  1.  **Target (5): Reject that organicist criteria are irreducibly scalar.** Perhaps "participation in a single life" is not a continuous spectrum but involves discrete, emergent thresholds (e.g., the point at which symbiotic cells become a multicellular organism). Colonial organisms might be misclassified; slime moulds in their aggregated state could be determinate unities, not borderline cases.  
  2.  **Target (6): Reject the inference from scalar conditions to borderline cases.** Even if life-activity is scalar, it might have a *non-arbitrary* threshold grounded in biological reality (e.g., the onset of self-sustaining metabolism), avoiding vagueness without conventionalism. Continuity does not entail the *absence* of natural joints.  
  3.  **Target (7): Reject the transfer of indeterminacy to existence.** If it’s indeterminate whether C(xs), it might be determinate that *no composite object exists*, preserving (8). Composition could be a determinate all-or-nothing affair, with apparent vagueness merely epistemic or de dicto (e.g., imprecision in our concept of "life").  

  ### Committed Diagnosis: Reject Step (6)
  **Why (6) is Faulty:**  
  Step (6) claims that scalar conditions *must* have borderline cases because any threshold would be "arbitrary" and thus metaphysically illegitimate. This conflates *continuity* in the underlying processes with the *absence of natural boundaries*. In biology, functional integration (e.g., metabolic interdependence) can generate emergent, non-conventional thresholds. For instance, a siphonophore colony transitions from loose aggregation to a unified organism when specialised zooids become irreversibly interdependent for survival—a qualitative shift, not a vague continuum. What looked innocent here was the assumption that biological gradation implies metaphysical vagueness, but organicism can posit sharp, objective breaks grounded in causal-explanatory facts (e.g., the point where decentralised cooperation becomes centralised control).  

  **Cost of Rejecting (6):**  
  You must defend that "participation in a single life" has a non-arbitrary, binary threshold. This requires empirical and metaphysical work: showing that biology *does* recognise such boundaries (e.g., immune recognition, reproductive synchrony) and that they are mind-independent. Colonial organisms become test cases; you might argue that "vague" examples (e.g., slime moulds) are either determinate organisms or colonies, with apparent indeterminacy reflecting epistemic limits.  

  ### Costs of Alternative Rejections  
  - **Reject (2) (Non-sortal-relativity):** Allowing sortals (e.g., "the xs compose something iff they compose an *organism*") saves organicism but surrenders metaphysical objectivity. Composition becomes relative to our categories, violating (1)’s demand for mind-independence. Cost: Abandons realism about composition facts.  
  - **Reject (3) (Non-disjunctive/Non-brute):** Permitting disjunctions (e.g., "either one object, or life-activity") avoids vagueness but violates (3)’s explanatory requirement. Cost: Makes composition inexplicable or fragmented, undermining the quest for a unified account.  
  - **Reject (8) (Determinate existence):** Accepting vague objects resolves the transfer problem but requires embracing indeterminate identity or existence. Cost: Demands radical revisions to logic/metaphysics (e.g., adopting ontic vagueness), conflicting with classical reasoning.  

  ### Final Assessment  
  The argument is valid but unsound; (6) is the culprit. Rejecting it preserves your core commitments (1)–(3), (8), and organicism, at the price of defending natural thresholds in biological unity. The alternative—sacrificing (2), (3), or (8)—incurs heavier metaphysical debts.  

