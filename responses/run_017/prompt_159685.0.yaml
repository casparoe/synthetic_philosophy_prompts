  Second diagnosis challenges (6): Maybe scalar properties can have non-arbitrary thresholds. For instance, phase changes in physics show continuous parameters producing sharp transitions (water boiling at 100°C). Similarly, life might have metaphysically significant emergent thresholds. This maintains scalar properties but requires natural boundaries.

  Third diagnosis questions (7): Perhaps composition indeterminacy doesn't entail existence indeterminacy. Some theories allow vague composition without vague existence - e.g., the composite object exists determinately but has vague parts. However, this may require accepting vague identity, conflicting with (8).

  Fourth diagnosis re-examines (4): The demand for "unified explanatory terms" might be too strict. If we allow disjunctive criteria (e.g., "either constituting a life or being a causal system"), we avoid scalar problems but violate (3). This sacrifices explanatory unity.

  I think the strongest approach is to reject (6). Biological systems do exhibit degrees, but life processes create non-arbitrary thresholds. For example, whether cells form a multicellular organism depends on emergent properties like specialized function and shared metabolism, not just degree of connection. This avoids borderline cases without arbitrariness. The cost is defending these natural thresholds against continuity arguments, particularly with colonial organisms.

  Alternative rejections would be costly: Rejecting (2) allows sortal-relativity but abandons metaphysical objectivity. Rejecting (3) permits disjunctive/brute criteria but loses explanatory power. Rejecting (8) accepts vague existence, which violates classical logic. Rejecting (5) denies biological continuity, which seems empirically dubious.

  The key insight is that (6) mistakenly assumes all scalar dimensions must have borderline cases if thresholds exist. But in metaphysics, thresholds can be natural (like phase changes) rather than conventional. What looked innocent in (6) was the slide from "continuous dimension" to "no natural break" - but biology shows functional emergence creates natural breaks despite continuity.

