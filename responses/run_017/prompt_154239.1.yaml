prompt: |-
  I'm taking a one-hour session on superrationality with a mixed group of first-year computer science and philosophy students. They know the payoff matrix of a one-shot prisoner's dilemma and nothing beyond it: no decision theory, no game theory past the phrase 'Nash equilibrium'. I want a plan for the explanation, not the explanation itself.

  Give me the order in which the components have to be introduced and, at each step, what it depends on that has not yet been said. Tell me what the one carrying scenario must contain and must lack: I am inclined to have each student submit a sealed decision procedure to a referee who runs both and pays out, but I want to know what has to be excluded for the case to do its work — iteration, reputation, communication between the submissions, and, more delicately, whether each procedure is shown the other's source — and whether including that last feature turns it into a different lesson entirely.

  Given a computer-science-heavy room, someone will propose early on 'cooperate if and only if I can verify the other procedure is identical to mine'. Is that the target or the trap, and where in the sequence should it be met?

  Three further misconceptions, each of which I want placed at a particular point: that superrationality is only evidential decision theory in costume and so falls with it wherever an action is correlated with but does not cause its outcome; that it is reciprocal altruism with the iteration deleted; that it returns 'cooperate' for any prisoner's dilemma, including heavily asymmetric ones or ones where most of the other players are not superrational. For each, say what the plan must already have established for the correction to land rather than be memorised.

  Close with one question that separates a student who has the idea from one who has merely learned to repeat that both players are running the same computation — I would like it to turn on a variant where the two procedures reason alike but face slightly different payoffs — and tell me what I should openly decline to settle in an hour: I assume whether superrationality is correct, and anything turning on the general contest between causal and evidential decision theory.

  Please write the plan in British English.
reasoning: |-
  Okay, the user is preparing a one-hour session on superrationality for first-year computer science and philosophy students. They know the basics of the prisoner's dilemma payoff matrix but nothing about decision theory or advanced game theory. I need to create a structured plan for introducing superrationality concepts in a logical sequence.

  The user wants a clear order of components with dependencies noted at each step. They're considering using a scenario where students submit sealed decision procedures to a referee. I should outline what must be excluded - no iteration, reputation, communication, and especially no access to each other's source code, as that would fundamentally change the lesson into something about program equivalence rather than superrationality.

  For the computer science students who might propose "cooperate iff I can verify the other procedure is identical," I recognize this as a trap. It should be addressed after establishing the core superrationality concept but before discussing EDT comparisons. The verification approach relies on impossible logical requirements and isn't actually superrational.

  I need to strategically place three common misconceptions: 
  1. That superrationality is just evidential decision theory - to be corrected after introducing both concepts
  2. That it's reciprocal altruism without iteration - to clarify after distinguishing it from repeated games
  3. That it applies universally to asymmetric dilemmas - to address when discussing payoff symmetry requirements

  For the closing question, I'll design a payoff asymmetry variant where both agents reason identically but face different incentives. This tests true understanding versus rote learning. Students who get it should recognize cooperation fails here despite identical reasoning.

  The session should openly decline to settle whether superrationality is "correct" or engage in causal vs evidential decision theory debates - those are beyond the scope. The focus is comprehension, not endorsement.

  I'll structure the plan in British English as requested, with timing estimates and clear dependencies between sections. The carrying scenario will be precisely defined with necessary exclusions, and each misconception will be placed where prior concepts make the correction meaningful rather than memorized.
answer: |-
  Here is a structured plan for your one-hour session on superrationality, adhering to your requirements and written in British English:

  **Session Plan: Introducing Superrationality (60 Minutes)**

  1.  **(5 mins) Re-establish the Prisoner's Dilemma (PD):**
      *   **Action:** Quickly recap the standard one-shot, symmetric PD payoff matrix (e.g., R, S, T, P values). Emphasise it's one-shot, no prior communication, no future interaction. Define Cooperate (C) and Defect (D).
      *   **Depends on:** Students' prior knowledge of the PD matrix.
      *   **Key Output:** Clear understanding of the individual incentive to defect dominating mutual cooperation, leading to the Nash Equilibrium (D,D).

  2.  **(5 mins) Introduce the Carrying Scenario & the Core Question:**
      *   **Action:** Present the scenario: "Imagine both players, *before* knowing who their opponent is, must write down a *complete decision procedure* (like a little computer programme) specifying solely 'C' or 'D'. These procedures are sealed and submitted to a neutral referee. The referee then runs *both* procedures (feeding each, conceptually, the fact that it is facing *another submitted procedure*) and pays out based on the joint outcome."
      *   **Crucial Exclusions (State Clearly):**
          *   **No Iteration/Reputation:** This is a single interaction between the procedures.
          *   **No Communication:** Procedures cannot send messages to each other *during* the "game".
          *   **No Source Code Access:** Procedures *cannot* inspect each other's source code. They only output C or D when "run" by the referee against another procedure. *(Including source code access fundamentally changes it to a program equivalence/metacognition problem, NOT superrationality. This must be excluded for the core idea to work.)*
      *   **Core Question Posed:** "Given this setup, how *should* you design your procedure to choose C or D? What is the *best* strategy?"

  3.  **(10 mins) Explore Initial Intuitions & Introduce the 'Trap':**
      *   **Action:** Brainstorm student suggestions. *Expect and allow the CS proposal:* "My procedure cooperates if and only if it can verify the other procedure is identical to mine." Discuss why this seems appealing (it *would* lead to mutual C).
      *   **Addressing the Trap:** Explain why this is practically impossible and logically problematic:
          *   **Verification is Undecidable:** Halting Problem analogues; no procedure can reliably verify *all* possible equivalent programmes.
          *   **Self-Reference Issues:** How does *your* procedure know *its own* code sufficiently to compare? (Leads to infinite regress or paradox).
          *   **Dependency:** The impossibility of reliable verification in general computation.
      *   **Conclusion:** This approach is a dead end. We need a different principle.

  4.  **(15 mins) Introduce the Superrationality Concept:**
      *   **Action:** Propose the core idea: "What if we assume that both players, being rational and facing an identical problem, will reason in the *same* way? Therefore, they must write *identical* procedures. Since the procedures are identical, they will *both* output C, or *both* output D. The question becomes: Which identical choice (C,C) or (D,D) yields the better payoff?"
      *   **Reasoning:**
          *   Identical situation + Identical rational reasoning → Identical decision procedure → Identical output.
          *   Compare the payoffs: (C,C) yields R for each. (D,D) yields P for each. Since R > P, both players are better off if their identical procedures choose C.
      *   **Dependency:** The setup (sealed procedures, no inspection) and the failure of the verification approach. Understanding that identical reasoning *implies* identical output without needing verification.
      *   **Key Output:** Definition of Superrationality: Choosing the action that yields the best outcome *assuming* the other player(s), being identically rational in an identical situation, will make the *same* choice.

  5.  **(5 mins) Contrast with Nash Equilibrium & Introduce EDT Comparison (Plant Misconception Seed 1):**
      *   **Action:** Clearly state NE recommends D (based on individual dominance), Superrationality recommends C (based on mutual identical reasoning). Pose the question: "Is superrationality just a fancy name for Evidential Decision Theory (EDT)? EDT chooses the action with the best *news* (best conditional outcome). Cooperating gives good news (likely the other cooperates). Defecting gives bad news (likely the other defects)."
      *   **Purpose:** Plant the seed for the misconception that SR=EDT. *Do not resolve it yet.*

  6.  **(5 mins) Distinguish from Reciprocal Altruism (Address Misconception 2):**
      *   **Action:** "Someone might think this sounds like Tit-for-Tat in a repeated game, but with the repetition removed. Is that right?"
      *   **Correction:** "No. Reciprocal altruism relies on the *threat of future punishment*. There is *no future* here. Superrationality relies on the *logical necessity* that identical rational agents in identical situations *must* choose identically *in this single instance*. It's a logical coordination argument, not a strategic threat." *(Correction lands because step 1 firmly established the one-shot nature and step 4 established the logical identity argument.)*

  7.  **(10 mins) Introduce Asymmetry & Challenge Universal Application (Address Misconception 3):**
      *   **Action:** Present a modified PD. Example: Player A gets standard payoffs. Player B gets a huge bonus for defecting when A cooperates (T_B >> R_B), but standard otherwise. Emphasise the procedures know *who they are* (A or B) and the payoffs *they* face.
      *   **Question:** "Can superrationality still recommend mutual cooperation here?"
      *   **Analysis:** Now, A and B face *different* problems. A still prefers (C,C) over (D,D). B prefers (D,C) vastly over (C,C) or (D,D). They are *not* in identical situations. Even if both are "superrational", their *identical reasoning* applied to their *different payoff structures* might lead to different outputs. B has a massive incentive to defect *even assuming A reasons identically*. The logical symmetry is broken. *(Correction lands because step 4 emphasised the requirement for identical situations/payoffs and identical reasoning leading to identical output. This breaks that.)*
      *   **Key Output:** Superrationality critically depends on symmetry. It does *not* universally recommend C in *all* PDs, only symmetric ones.

  8.  **(3 mins) Revisit SR vs. EDT (Address Misconception 1):**
      *   **Action:** Return to the planted question. "Is superrationality just EDT? While they *often* agree in symmetric dilemmas, their *justification* differs. EDT focuses purely on the *evidence* my action provides about the other's action. Superrationality posits a *reason* for that correlation: the logical necessity arising from identical rational agents in identical situations. EDT might recommend C in Newcomb's problem where correlation is causal, but SR doesn't apply there as the situations aren't symmetric (Predictor vs. Player). SR is a specific argument grounded in symmetry and identical reasoning, not a general correlation-based decision rule like EDT." *(Correction lands because step 4 established the logical identity core, step 7 showed SR's dependence on symmetry, and EDT was only superficially introduced in step 5.)*

  9.  **(2 mins) Closing Question:**
      *   **Action:** Pose the question: "Imagine a *symmetric* prisoner's dilemma, but Player A is told, truthfully, *by the referee*, just before submitting their procedure, that Player B has already submitted a procedure identical to Player A's own reasoning (whatever it is). Player B is told nothing special. Does Player A now have a *causal* reason to cooperate that Player B lacks? Or is the superrational argument still the same for both?"
      *   **Purpose:** Tests understanding that superrationality is about *pre-commitment* based on the logical identity of reasoning *at the time of writing the procedure*. The referee's information doesn't change the *logical structure* of the choice facing the procedures themselves when run. A student merely repeating "same computation" might struggle. A student who grasps it should see the information is irrelevant to the procedure's output logic – both procedures, when run, still face the same situation: facing another procedure written under the superrationality assumption.

  **What to Openly Decline to Settle:**

  1.  **Whether Superrationality is "Correct":** "We've explored the *logic* of superrationality today. Whether you *should* use it in real life, or whether it's a sound principle of rationality, is a deep philosophical debate we won't resolve here."
  2.  **The General Causal vs. Evidential Decision Theory Contest:** "We saw a point where EDT and SR might seem similar or different. The broader battle between causal and evidential decision theory is complex and fascinating, but it's far beyond our scope today. We touched on it only to clarify superrationality's unique basis."

  **Key to the Carrying Scenario:**
  *   **Must Contain:** Sealed pre-commitment (decision procedures), no communication between players *after* submission, referee runs both procedures simultaneously, procedures output solely C or D based *only* on the knowledge they are facing another submitted procedure within this symmetric setup.
  *   **Must Lack:** Iteration/repeated play, reputation effects, any communication *between procedures* during the "game", *any* access to the other procedure's source code or internal state (only the output is revealed by the referee after both have produced it), significant payoff asymmetries (for the core argument).

  This plan builds logically, addresses the requested misconceptions at points where prior concepts make the correction meaningful, incorporates the CS "trap" naturally, and uses your carrying scenario with the necessary exclusions. The closing question effectively probes the depth of understanding.
