  For Part IV (concessions), each party should acknowledge the strongest point from the other side. Party A might concede that Qing-era China had advanced markets, while Party B could grant that Britain had unique factor combinations. Their abandonment conditions should be specific - like Party B accepting the question if Jiangnan showed clear stagnation.

