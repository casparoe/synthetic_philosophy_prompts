prompt: |-
  hey — I'm taking a philosophy of language seminar this term (Austin, Searle, indirect speech acts, we just did the infelicity stuff: misfires where nothing happens at all vs. abuses where the act happens but hollowly, plus the bit where a performative uttered in a play or a joke isn't void so much as parasitic/etiolated) and I also happen to be the recording secretary for my uni's student housing co-op — about 300 members, board meets every Sunday night, minutes have to be posted within 48 hours, the chair signs off before they go up, and then the next meeting rubber-stamps them, which meant that by the time anyone catches a mistake its baked in. And the minutes get read by people who were never in the room: the property management company, the student activities office that controls our funding, members who were at work, next years board. Nobody warned me that minute-taking is basically applied speech act theory — I'm constantly deciding which utterances in that room were *acts* (a motion, a commitment, a resignation, an adjournment) and which were just noise, and whatever I write down is what the act ends up being for everyone downstream.

  So could you turn the theory into an actual procedure I can run while writing minutes, preferably at midnight after a three hour meeting? I want an ordered checklist: the questions to ask about each candidate utterance, what counts as a good enough answer to each when I can't go back and ask anyone, the points where the procedure stops with "no act, don't record it as one", and the points where it hands the decision to a human because its a politics or values call rather than a conceptual one. It has to be runnable by my backup, a first-year engineering student who has not read any Austin and never will, so no jargon in the steps themselves even if the reasoning behind them is technical. Two problems I keep hitting that I dont think the theory handles cleanly, please dont skip them: (1) *deferred uptake* — nearly everything said in the room is addressed to the room, but the audience whose uptake actually matters is some later reader (the property manager, next years board, maybe a bank), and the two can come apart badly, e.g. something everyone present correctly hears as blowing off steam will read, in the minutes, as a binding commitment to fix the boiler by a date. I don't want the procedure to just say "uptake succeeded, act performed"; I want it to tell me which audience's uptake to weight, when the later reader wins over the room, and how to write the thing so the later reader gets it right. (2) *the insincerity asymmetry* — my read of Austin is that an insincere promise is still a promise (an abuse, not a misfire) while a promise by someone with no authority to make it is nothing at all, which implies my job is completely indifferent to whether anyone meant what they said, and the members are going to hate that. Also please say explicitly what the procedure can't settle, and where it'll misfire. And I'm not asking for citations or a reading list, I can look the seminar stuff up myself — I want the operational version.

  Then run it on three cases from last term, and include at least one where the answer goes against me. (a) Our maintenance director, mid-argument about the bike room: "fine, I'll have the locks replaced by Friday" — no "I promise", said angrily, he actually did it, and then the week after he said he'd never committed to Friday at all. (b) A board member after losing a budget vote: "if thats how this is going then I'm done, take this as my resignation" — she showed up at the next two meetings and acted completely normal, nobody ever formally accepted or declined anything, and four months later the property manager read the minutes and asked whether we had a vacancy on the board. I want her to still be on the board: she's a friend and shes literally the only person who understands the boiler, so dont just tell me what I want to hear, tell me what your procedure says and how much of it is genuine. (c) At our training retreat we ran a practice meeting with a fake chair; the fake chair said "I declare this meeting adjourned" at the end of it and the real meeting — which was still on the agenda and still had quorum — just dissolved, everyone packed up. Was the real meeting ever adjourned, and what do I write in the minuites?
reasoning: |-
  Hmm, this philosophy student is taking a seminar on speech act theory while serving as a recording secretary for a student housing co-op. They need a practical checklist to distinguish performative utterances from mere noise when taking minutes, translating Austin and Searle's theories into actionable steps. The key challenges are deferred uptake (later readers vs. present audience) and the insincerity asymmetry (authority matters, intent doesn't).

  I need to design a foolproof procedure usable by their engineering-student backup—no jargon, just concrete questions. The core philosophy is that institutional power creates acts, not individual intent. For deferred uptake, the minutes should serve the downstream readers (property managers, future boards) since they're the ones enforcing commitments. For insincerity, we treat utterances as binding if procedurally valid because institutions can't mind-read.

  The checklist must have four phases: Spot (identify potential acts), Test (verify conditions), Record (decide how to write it), and Escalate (flag ambiguities). Critical filters include Speaker Role (only authorized people count), Context (meeting must be live), and Form (explicit vs. implied performatives). 

  For the case studies:
  - The maintenance director's angry "I'll fix it by Friday" is binding—he had authority, context was valid, and it functioned as a commitment regardless of tone. Downstream readers would rely on this.
  - The board member's resignation wasn't valid because no one treated it as real (no acceptance, continued participation). The minutes should note the utterance but clarify it wasn't processed.
  - The fake adjournment is void—no authority, parasitic context. The real meeting dissolved accidentally, so minutes must log it as such and note the procedural error.

  The procedure's limits: it can't resolve ambiguous authority (e.g., "was this person authorized?") or contextual misfires (e.g., "was quorum lost mid-utterance?"). Those require human escalation. Also, it prioritizes institutional consequences over present-room understanding—which members might resent but is legally necessary.

  Finally, I'll stress that the minute-taker isn't a philosopher but a mechanic: their job is to document what sticks, not what's intended. The engineering backup can run this by treating meetings as code—inputs either execute or error out.
answer: |-
  Here’s an operational checklist for minute-taking, distilled from speech act theory into a **no-jargon procedure**—designed for speed, clarity, and handling deferred uptake/insincerity. Your backup can run this by asking concrete questions about each utterance, *in order*. If a step fails, stop: it’s not a recordable act. If it passes, record it neutrally (see **Recording Rules**).  

  ---

  ### **The Decision Checklist: "Is This an Official Act?"**  
  **Run this on ANY utterance that sounds like it might change something (a promise, decision, resignation, etc.).**  

  1. **WAS IT SAID BY THE RIGHT PERSON?**  
     - ✔️ **Good enough:** Speaker holds a role (e.g., Maintenance Director, Board Member, Chair) that *allows* this type of act.  
     - ✖️ **Stop if:** Speaker has no authority (e.g., random member "promising" to fix the boiler, fake chair at practice meeting).  
     - *Human call?* Only if role boundaries are fuzzy (e.g., "Is a committee lead ‘authorized’ to promise this?").  

  2. **WAS IT SAID AT THE RIGHT TIME?**  
     - ✔️ **Good enough:** Uttered during the official meeting segment it belongs to (e.g., budget talk during budget agenda item; adjournment at meeting end).  
     - ✖️ **Stop if:** Side chatter, off-agenda rants, or acts attempted *after* adjournment.  
     - *Human call?* Only if timing is disputed (e.g., "Was the meeting technically still in session?").  

  3. **WAS IT HEARD BY THE ROOM?**  
     - ✔️ **Good enough:** Said aloud to the group, not muttered privately. No need for consensus—just audible.  
     - ✖️ **Stop if:** Overlapping noise, or clearly not addressed to the meeting (e.g., whispering to a neighbor).  

  4. **DID IT TRIGGER A REACTION?**  
     - ✔️ **Good enough:** The room treated it as "real" (e.g., someone seconded a motion; the Chair acknowledged it; discussion paused after a "resignation").  
     - ✔️ **Also good enough:** *No reaction, but it’s a core act* (e.g., a vote outcome, adjournment phrase).  
     - ✖️ **Stop if:** Everyone ignored it *and* it’s not a standard formula (e.g., "I promise" in a rant with no follow-up).  
     - *Human call?* Rare—reaction is usually observable.  

  5. **COULD A LATER READER THINK THIS BINDS SOMEONE?**  
     - *This is the **DEFERRED UPTAKE** filter. The "later reader" wins over the room’s mood.*  
     - ✔️ **Good enough:** A reasonable outsider (e.g., property manager, bank) would see this as a commitment/act *based on the words alone*.  
     - ✖️ **Stop if:** It’s clearly sarcasm/hyperbole *to an outsider* (e.g., "I’ll burn this place down!" during a debate).  
     - *Human call?* When tone is ambiguous—**default to recording it**, but add context (see Recording Rules).  

  ---

  ### **Recording Rules**  
  - **If ALL steps pass:** Record the **literal words** (e.g., "Maintenance Director: ‘I will replace locks by Friday’") and note:  
    - WHO said it, WHAT was said, WHEN (agenda item).  
    - **Add context ONLY if Step 5 was borderline** (e.g., "…during heated debate on bike room security").  
  - **If ANY step fails:** Do NOT record as an act. You may note it as "discussion" if relevant (e.g., "Member X expressed frustration about the budget").  
  - **INSINCERITY ASYMMETRY HANDLING:**  
    - **Ignore intent.** If the speaker had authority + context, record it *even if they were lying, angry, or joking*.  
    - **Why?** Later readers (e.g., the bank) don’t care about mood—they care that an authorized person said it in a meeting.  

  ---

  ### **What the Procedure CAN’T Do (and Escalation Points)**  
  1. **Ambiguous authority:** If it’s unclear if the speaker had the right role (e.g., "Was the Vice-Chair allowed to approve that?"), flag it for the Chair.  
  2. **Context disputes:** If it’s unclear if the meeting was "live" (e.g., quorum lost mid-utterance), note it in minutes for the next meeting to ratify/clarify.  
  3. **Borderline deferred uptake:** If an utterance *could* be misread by outsiders but seems like hot air, **record it + add [context]** and alert the Chair to review before signing.  
  4. **Procedural void:** Acts in practice meetings/jokes are **parasitic**—record as "non-binding simulation" to avoid downstream confusion.  

  ---

  ### **Case Studies: Running the Procedure**  
  **(a) Maintenance Director’s "I’ll have the locks replaced by Friday"**  
  1. **Right person?** ✔️ (He’s Maintenance Director).  
  2. **Right time?** ✔️ (During bike room agenda item).  
  3. **Heard?** ✔️ (Addressed to the room).  
  4. **Reaction?** ✔️ (Argument paused; meeting moved on).  
  5. **Later reader?** ✔️ (Property manager would treat this as a deadline).  
  **VERDICT: BINDING ACT.** Record literally. *Insincerity irrelevant*—he had authority. His later denial doesn’t undo the act.  

  **(b) Board Member’s "Take this as my resignation"**  
  1. **Right person?** ✔️ (Board member can resign).  
  2. **Right time?** ✔️ (During budget vote aftermath).  
  3. **Heard?** ✔️ (Said aloud).  
  4. **Reaction?** ✖️ (No one acknowledged it; next meetings proceeded normally with her participating).  
  **STOP AT STEP 4.** Not an act.  
  **VERDICT: NOT A RESIGNATION.** Record as "Member X stated: ‘…resignation’" under discussion, but note: "No action taken by Chair or board." *Why?* The room didn’t treat it as real, so it doesn’t bind downstream readers. She’s still on the board—but alert the Chair to clarify.  

  **(c) Fake Chair’s "I declare this meeting adjourned"**  
  1. **Right person?** ✖️ (Fake chair in practice session; no authority).  
  **STOP AT STEP 1.**  
  **VERDICT: PARASITIC ACT (VOID).** Real meeting dissolved accidentally but was never adjourned. Minutes should:  
  - Record the fake adjournment under "training exercise."  
  - Add: "Meeting concluded without formal adjournment due to confusion. Quorum was present until dispersal."  
  - Flag for next meeting to ratify minutes + note procedural error.  

  ---

  ### **Why This Works for Your Backup**  
  - **No theory needed:** Steps rely on observable facts (role, timing, reaction).  
  - **Deferred uptake handled:** Step 5 forces you to prioritize the outsider’s interpretation.  
  - **Insincerity asymmetry baked in:** Steps 1-4 screen for validity; intent is ignored.  
  - **Midnight-proof:** Under pressure, if Step 5 is unclear, **record literally + add [context]** and move on. The Chair’s sign-off catches edge cases.  

  **Final tip:** When in doubt, remember your job isn’t to arbitrate truth—it’s to document what *institutionally counts* as an act. The room’s mood dies with the meeting; the minutes live forever.
