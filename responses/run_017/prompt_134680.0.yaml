prompt: |-
  So here's where I'm coming from: I'm retired, spent about thirty years as a research meteorologist doing forecast verification, and last fall I signed up for a philosophy course at the lifelong-learning institute and got hooked. The thing that grabbed me was this accuracy-first program — the idea that the only fundamentally good-making feature of a credence is how close it sits to the truth, scored with a strictly proper scoring rule like the Brier score (plain squared error, which is exactly what we used on precipitation forecasts), and then the dominance argument: if your credences break the probability axioms there's some other assignment that beats yours in every single possible world, so you're guaranteed to do worse accuracy-wise. That move feels like home to me, and the decomposition of a score into calibration and resolution is basically my old day job. But the argument quietly needs the scoring rule to be strictly proper and additive across possibilities, and the more I poke at it the more it feels like accuracy gets used to prove whatever the author already believed. I want the spec before I read another chapter.

  Here's what I want from you. The use I want to put this to is critiquing actual scientific practice — p-hacking, models overfitted to noise, people who treat an inconvenient null result as a reason to distrust the instrument rather than the theory, labs that never quite update. So write me the desiderata a theory of epistemic value would have to meet to be good enough for that job, with the case or consideration that makes each one a requirement rather than a taste. The worries I keep circling, which you should organize, fix, or throw out: how fine we carve the space of possibilities (does the dominance argument still work if I slice the same outcomes more coarsely, and does it then start recommending things nobody should believe?); whether the framework has anything at all to say about which questions to form opinions about, or whether it just says 'be accurate about whatever you happen to be asked'; why simplicity or unification should count when two hypotheses fit the data equally well, which is a curve-fitting problem I ran into constantly; what to do with agents who aren't logically omniscient, since scoring across possible worlds seems to punish mere failure to notice a consequence as harshly as being wrong about the world; whether updating has to be derived or smuggled in; whether the theory can say anything about the value of running the next experiment, not just about being accurate with what you already have; and whether it handles the all-or-nothing kind of belief we actually use in lab meetings ('I think the effect is real'), including those awkward situations where you believe each of a long list of claims and also believe one of them is wrong. Add the requirements I've definately missed, and tell me straight out if any item on my list is really just a prejudice of one camp dressed up as a constraint.

  Then the part I most want: mark which requirements are non-negotiable and which are negotiable preferences, flag any subset you suspect can't be jointly satisfied — I have a feeling the carving worry and the dominance argument can't both survive — and tell me which single requirement knocks out the most versions of the program as it's usually stated. A numbered list with a short motivating case under each, plus a small table at the end, is a good shape. Please don't give me a reading list or tell me who said what; I've got a stack of books already and I want the arguments, not the map. I'll bring it to my little reading group at the library next month.
reasoning: |-
  Okay, the user is a retired meteorologist with extensive experience in forecast verification who's now diving into philosophy, particularly accuracy-first epistemology. They're hooked but skeptical about how "accuracy" gets weaponized to justify preexisting beliefs. Their real goal is to build a toolkit for critiquing scientific malpractice like p-hacking and overfitting.  

  First, I need to unpack their stated worries:  
  - **Granularity of possibilities**: Does coarse-graining break the dominance argument?  
  - **Question selection**: Why care about accuracy on arbitrary questions?  
  - **Simplicity/unification**: Why prefer simpler models when fit is equal?  
  - **Logical omniscience**: Shouldn’t distinguish ignorance from irrationality?  
  - **Update mechanics**: Is updating derived or assumed?  
  - **Experimental value**: How to value gathering new evidence?  
  - **Binary belief**: How to handle "I believe X is real" in labs?  

  Their deeper need is clear: they want epistemic desiderata that bite into real scientific flaws, not just tidy axioms. The meteorology-to-philosophy pivot means they’ll smell hand-waving from miles away—especially when decomposition (calibration/resolution) echoes their old work.  

  I’ll structure this as numbered desiderata with a killer case for each. Non-negotiables must:  
  1. **Block self-serving manipulation** (e.g., p-hackers escaping criticism).  
  2. **Handle real-world constraints** (limited cognition, partial info).  
  3. **Explain why bad science is bad** beyond "it’s inaccurate."  

  The tension they sense between dominance arguments and coarse-graining is real. If slicing finely demands probabilistic coherence but coarsely allows contradictions, that’s fatal. So Desideratum 1 (Granularity Invariance) becomes non-negotiable—otherwise, epistemic norms depend on arbitrary description choices.  

  For question selection (their unspoken priority), I’ll argue that valuing accuracy only on asked questions lets scientists ignore crucial tests. Non-negotiable: the theory must penalize *avoiding* relevant inquiries (Desideratum 2).  

  Simplicity needs careful handling. We can’t demand it axiomatically, but must explain why overfitted models fail *even when equally accurate on existing data*. The answer ties to Desideratum 6 (Evidence Responsiveness)—overfitting breaks sensitivity to new evidence.  

  The binary belief worry gets a twist: we need "closeness counts" (Desideratum 9) so that expressing 60% credence as "I believe" isn’t automatically wrong if it reflects cautious commitment.  

  Biggest threat to standard accuracy-first? Desideratum 7 (Anti-Manipulation). If ignoring unfavorable data isn’t directly accuracy-penalized, the framework can’t touch p-hacking. Most versions fail this by only scoring stated credences, not suppressed ones.  

  Table will show which desiderata explode which programs. Logical omniscience (Desideratum 4) is a negotiable bug, not a feature—real agents need slack. But granularity invariance? Non-negotiable, and likely lethal to dominance purism.  

  Final note: Their instinct about dominance vs. coarse-graining is sharp. I’ll confirm that tension can’t be fully resolved without dropping strict propriety or additivity—which is why negotiable preferences exist. They’ll appreciate the honesty.
answer: |-
  Here's a distilled set of desiderata for a theory of epistemic value fit for critiquing scientific practice, grounded in the problems you've encountered. Non-negotiables (NN) prevent the framework from being gamed or failing in real-world science; negotiables (N) address implementation but admit alternatives. The table at the end maps tensions.

  ### **Desiderata for Epistemic Value Theory**
  1. **Granularity Invariance (NN)**  
     *Requirement*: Epistemic norms must hold regardless of how finely/coarsely possibilities are described.  
     *Case*: If coarse-graining (e.g., reporting only "rain" vs. "no rain" instead of rainfall amounts) lets incoherent credences avoid dominance penalties, the theory fails to condemn overconfident/low-resolution forecasts common in oversimplified models. Violating this allows "description-relative rationality" — a fatal flaw for objectivity.

  2. **Question Sensitivity (NN)**  
     *Requirement*: Must explain why forming opinions on *some questions* (e.g., experimental hypotheses) is epistemically urgent, not just about being accurate "when asked."  
     *Case*: Scientists who avoid testing their theory’s core predictions (e.g., by focusing on tangential variables) evade accuracy penalties but act antithetically to truth-seeking. A theory silent on this licenses neglect of critical evidence.

  3. **Simplicity/Unification Justification (N)**  
     *Requirement*: Explain why simpler/more unified theories are preferable *when empirical fit is equal*, without invoking aesthetics.  
     *Case*: Two climate models fit past data equally, but one adds unmotivated parameters. The theory must penalize the complex model’s *epistemic risk* (e.g., higher vulnerability to overfitting, lower predictive robustness) — not just reward current fit.

  4. **Non-Punishment of Logical Ignorance (NN)**  
     *Requirement*: Do not treat *failure to deduce consequences* as equivalent to *irrationality*.  
     *Case*: A scientist’s credence for P is 0.7, but they haven’t deduced that P implies Q. Scoring them across all worlds (including those where Q is false) harshly penalizes limited cognition. This confuses computational limits with epistemic vice, undermining criticism of real agents.

  5. **Update Internalism (NN)**  
     *Requirement*: Justify belief updating from evidence *within* the accuracy framework, not by presupposing Bayes’ theorem.  
     *Case*: If "update to the posterior" is assumed, the theory can’t critique agents who ignore new data (e.g., labs dismissing null results). Updating must emerge from accuracy-seeking — e.g., via *dynamical coherence* (non-updaters are exploitable).

  6. **Evidence Responsiveness (NN)**  
     *Requirement*: Value *gathering new evidence* when current beliefs are unstable or ambiguous.  
     *Case*: Scientists running underpowered studies (too little data) or ignoring crucial experiments (e.g., not testing rival hypotheses) evade accuracy penalties on existing data. The theory must explain why this is epistemically deficient — e.g., by penalizing *expected inaccuracy* or *opportunity cost_.

  7. **Belief Binarization Compatibility (N)**  
     *Requirement*: Accommodate all-or-nothing beliefs ("I think the effect is real") without collapsing to coarse thresholds.  
     *Case*: In lab meetings, binary claims (e.g., "Device is reliable") carry commitments. The theory must explain when binarization *introduces avoidable inaccuracy* (e.g., asserting P when credence is 0.51) vs. when it’s pragmatically necessary, without excusing dogmatism.

  8. **Inconsistency Detection (NN)**  
     *Requirement*: Penalize agents who hold blatantly inconsistent beliefs (e.g., believing each of {P₁, P₂, ..., Pₙ} but also that one is false).  
     *Case*: Models with mutually incompatible assumptions (e.g., "all covariates are independent" while including correlated variables) are endemic in overfitting. Dominance arguments must flag this as self-sabotage, even with binary beliefs.

  9. **Closeness Counts (N)**  
     *Requirement*: Recognize that "close" credences (e.g., 0.49 vs. 0.51) may be pragmatically similar even if binarized differently.  
     *Case*: Demanding maximal accuracy for low-stakes binary decisions (e.g., "try this reagent") wastes effort. But negotiable, as the core theory can remain strict while applications add pragmatics.

  10. **Anti-Manipulation (NN)**  
      *Requirement*: Condemn practices that *artificially inflate apparent accuracy* (e.g., p-hacking, HARKing).  
      *Case*: Selecting only significant results distorts reported credences. The theory must penalize *procedures* that systematically bias estimates — not just the final credence. This requires scoring *methods*, not just outputs.

  ### **Tensions & Non-Negotiables Breakdown**
  | **Desideratum**       | **Status**   | **Threat to Standard Accuracy-First** | **Key Conflict**                  |
  |------------------------|--------------|---------------------------------------|-----------------------------------|
  | Granularity Invariance | NN           | High (dominance fails coarsely)       | Vs. additivity/propriety axioms   |
  | Question Sensitivity   | NN           | Moderate                              | Requires broader "duties"         |
  | Non-Punishment of Logical Ignorance | NN | High                               | Logical omniscience assumed      |
  | Update Internalism     | NN           | Moderate                              | Often assumed, not derived        |
  | Evidence Responsiveness| NN           | High                                  | Beyond static accuracy           |
  | Inconsistency Detection| NN           | Low (via Dutch books)                 | Applies to binary beliefs        |
  | Anti-Manipulation      | NN           | Severe (scores outputs, not process)  | Needs methodological expansion   |
  | Simplicity Justification| N           | Moderate                              | Extra-empirical virtue needed    |
  | Belief Binarization     | N           | Low                                   | Compatible with scoring rules    |
  | Closeness Counts        | N           | None                                  | Pragmatic overlay               |

  #### **Diagnosis**
  - **Most Disruptive Requirement**: **Anti-Manipulation (NN)**. Standard scoring rules evaluate *stated* credences, not *how they were produced*. P-hacking exploits this by manufacturing high-scoring reports from biased methods. Fixing this requires scoring *inferential processes* — a major departure.
    
  - **Key Tension**: **Granularity Invariance vs. Dominance Arguments**. Dominance under strictly proper rules requires fine-grained partitions. Coarse-graining lets inconsistent agents "win" locally (e.g., assert "rain" at 90% when true, but evade penalties for missing finer predictions). This *cannot* be fully resolved without dropping strict propriety or additivity — a fatal flaw for purist approaches.

  - **Unavoidable Trade-off**: **Evidence Responsiveness vs. Static Accuracy**. Valuing new experiments requires scoring *potential* accuracy gains, not just current beliefs. This demands decision-theoretic expansion (e.g., expected accuracy improvement). Pure "belief-only" scoring fails here.

  - **Your "Prejudice" Check**: Suspect **Simplicity Justification**. While often presented as accuracy-enhancing (e.g., via predictive robustness), it *can* smuggle in aesthetic preferences. But its necessity for criticizing overfitting/overparameterization keeps it relevant. Classed as negotiable to admit instrumentalist views.

  ### **Why This Works for Your Purpose**
  This framework forces the theory to:
  - Condemn *procedural* malpractices (p-hacking via **Anti-Manipulation**),  
  - Explain why ignoring evidence or avoiding tests is irrational (**Evidence Responsiveness**, **Question Sensitivity**),  
  - Handle real agents who use binary claims rationally (**Binarization Compatibility**, **Closeness Counts**),  
  - Reject "tuning" models to noise without invoking mysticism (**Simplicity Justification**).  

  The non-negotiables prevent the theory from being toothless against the scientific dysfunctions you’re targeting. Bring this to your group — it’ll bite.
