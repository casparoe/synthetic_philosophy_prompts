     **Debrief** (50 minutes in the first session? or use the follow-up? We have 58 minutes left in the first session and a 50-minute session later. We can do a short debrief in the first and then a deeper one in the second.)

     First session debrief (20 mins):

          - We reveal the true hypothesis for E1 and E2 (both from the weighted die? or one from fair and one from weighted? We should have both decks from the same hypothesis to avoid confusion? Let's do both from the weighted die, so that the evidence is support for H2).

          - We show the distribution of priors and posteriors from the collected slips (anonymously). We also note the market prices.

          - We ask: "In the stale evidence activity, when you were asked for the posterior, what information did you feel you were missing?" [We hope they say: my prior]

          - Then: "But in reality, you already knew the sequence. So why couldn't you update on it for H2? What was the problem?"

          - We then introduce the problem of old evidence: when evidence is already known, conditionalization doesn't allow an update.

          - We ask: "In the dormant evidence activity, did you feel a stronger sense that the sequence confirmed H2 when you realized its relevance?" 

          - We then present the standard escapes and ask them to critique.

     Second session (50 minutes): Deeper discussion of the escapes and alternatives.

     **What might go wrong**:

          - Students might not play along with the forgetting. They might use the evidence in the prior assignment. We tell them not to, but it's hard. We can only hope they try.

          - In the posterior calculation, some students might not realize they need the prior and just report the likelihood ratio. Or they might assign 50-50 again. We can point that out in the debrief.

          - The market might be thin. We can seed it by being a market maker if necessary.

          - The market might be dominated by a few students. We can encourage everyone to trade by giving them more play money or by making the stakes more exciting.

          - The dormant evidence distraction might not work; they might still notice the 6's. We can make the sequence have fewer 6's? But then it might not support H2. Or we can make the distraction task more engaging.

     **Materials**:

          - Two sequences of 10 die rolls (generated by the weighted die) for E1 and E2. We want E1 and E2 to have a significant number of 6's (say 5 or 6) so that the likelihood ratio is high.

          Example for E1: [6,3,6,2,6,4,6,5,6,1] -> 5 sixes.
          Example for E2: [6,6,3,6,6,2,4,6,1,6] -> 6 sixes.

          Likelihood for H1: (1/6)^10 for any sequence.
          Likelihood for H2: (0.5)^k * (0.1)^{10-k} where k is the number of 6's.

          For E1 (5 sixes): 
              P(E1|H2) = (0.5)^5 * (0.1)^5 = (0.03125) * (0.00001) = 3.125e-7
              P(E1|H1) = (1/6)^10 = 1.6538e-8
              Likelihood ratio = 3.125e-7 / 1.6538e-8 = 18.9

          For E2 (6 sixes):
              P(E2|H2) = (0.5)^6 * (0.1)^4 = (0.015625) * (0.0001) = 1.5625e-6
              P(E2|H1) = (1/6)^10 = 1.6538e-8
              Likelihood ratio = 1.5625e-6 / 1.6538e-8 = 94.5

          So both are strong evidence for H2, especially E2.

          - Handout with hypotheses and likelihoods:

              H1: fair die. For any roll, P(1)=P(2)=P(3)=P(4)=P(5)=P(6)=1/6.
              H2: weighted die. P(6)=1/2, P(1)=P(2)=P(3)=P(4)=P(5)=0.1.

          - Play money for the market.

          - Slips of paper for priors and posteriors.

     **Debrief Structure**:

          In the first debrief (first session):
            - Show the distribution of priors (from collected slips) for the stale activity: likely clustered around 0.5.
            - Show the posteriors: likely high for H2.
            - Market price for H2 shares: probably high (close to 1 if they are sure).

            - Ask: "How many of you, when computing your posterior for the stale activity, wished you had your prior slip back? Why?"
            - Then: "But in reality, you already knew the sequence when you were introduced to H2. So you never had that prior. How could you have done the update?"

            - Introduce the problem: conditionalization requires a prior that doesn't take E into account, but if you know E, your prior does take it into account.

            - Then for the dormant activity: similar, but ask if the realization of the relevance made the confirmation stronger.

            - List the escapes:
                 a. Use the counterfactual prior (what you would have believed without E) -> but that's what we did, and it's arbitrary and hard to know.
                 b. Update on the fact that the theory entails the evidence -> but in our case, H2 doesn't entail E, it only makes it likely. And how would you compute that? 
                 c. Other?

          In the second session (follow-up):
            - Deep dive into the escapes and their costs.

     **Load-Bearing Choices**:

          - The prior amnesia mechanic: This is crucial. Without it, they wouldn't feel the loss of the prior. If they could keep their prior, they would just update normally. We simulate the counterfactual prior and then take it away to show that it's not available.

          - The market: It makes the aggregate confidence visible. Even if individually they are confused, the market price shows that the evidence is taken as confirmatory.

          - Two activities (stale and dormant): We hope the dormant one feels different. If not, the distinction might not hold.

          Weakest link: The prior amnesia might feel artificial. Students might not really try to forget. And in the dormant case, they might have noticed the 6's anyway. 

          Alternative: We could have them see the data but not be told what it is for, and then later reveal the hypotheses. But the prior amnesia is in the assignment of the prior without the evidence.

     **Would the scoring-rule-and-market setup be the wrong vehicle**?

          It might, because the market is about willingness to bet, which might be driven by risk attitudes and not just beliefs. Also, the problem of old evidence is about the logic of confirmation, not about betting. But the market does reveal that they think the evidence is relevant, which is the intuition we want to capture.

     **Final Design**:

          We'll go with the above. We have two activities (stale and dormant) with the same structure: show data, take away, assign prior (without data), take prior away, show data again, assign posterior. Then market.

     **Changes**:

          If we find that the students are not engaging with the forgetting, we might skip the prior assignment and go straight to: "You know E and now we introduce H2. How much does E support H2?" Then they can only give a likelihood ratio. Then we ask for a posterior and they can't. But then we don't have the market for a posterior. 

          Alternatively, we can have them trade in the likelihood ratio? But that's complicated.

          We'll stick with the plan.

     **Revised Minute-by-Minute for First Session (110 mins)**:

          0-5: Introduction to the day, market rules, and the two hypotheses. Explain that there will be two rounds.
          5-7: Stale evidence: show E1.
          7-10: Assign prior for H1 and H2 (without using E1). Collect and shuffle.
          10-20: Show E1 again. Assign posterior. Collect.
          20-25: Market for stale evidence (H2 shares). Record price.
          25-30: Dormant evidence: show E2 and give the distraction task (count consecutive sums of 7). 
          30-35: Assign prior for H1 and H2 (without using E2 for fairness). Collect and shuffle.
          35-45: Show E2 again. Assign posterior. Collect.
          45-50: Market for dormant evidence. Record price.
          50-70: Break (or move to debrief) but we have time, so start debrief.
          70-110: Debrief (40 minutes) covering:
              - What happened in the activities?
              - The problem they encountered in computing the posterior.
              - The market results.
              - Introduction to the problem of old evidence.
              - Stale vs dormant: did they feel a difference?
              - Preview of the escapes.

          Then in the follow-up session (50 mins), we go deeper into the escapes.

     **Handout for Payoff Scheme**:

          We'll create a separate handout for the market:

            "Market Rules:
            - Each share of 'H2 is true' will pay $1 at the end of the course if H2 is true, and $0 if H2 is false.
            - You start with $10 in play money.
            - You can buy or sell shares at any price you agree on with another student.
            - To buy, call out 'Bid [price] for [number] shares'. 
            - To sell, call out 'Ask [price] for [number] shares'.
            - If a bid and an ask match, they trade.
            - We will run the market for 5 minutes.
            - Your goal is to maximize your play money, which might count toward extra credit or just for fun."

     **Conclusion**:

          This design meets the constraints. It makes the problem of old evidence arise through the rules, with prior amnesia and a market to show the confirmation. The stale/dormant distinction is staged, and we'll see if it holds.

          Let me know if any adjustments are needed.
answer: |-
  ### Runnable In-Class Activity: The Problem of Old Evidence  
  **Goal:** Make students experience the problem of old evidence firsthand through a self-contained, tradable scenario with prior amnesia and a stale/dormant evidence distinction.  

  ---

  ### **Materials List**  
  1. **Two decks of cards** (physical or digital):  
     - **Deck A (stale evidence)**: 10 cards, each labeled with a number 1–6 (simulating die rolls). Generated from a **weighted die** (P(6) = 0.5, P(1–5) = 0.1 each).  
       - *Example sequence*: [6, 3, 6, 6, 2, 6, 1, 6, 4, 6] (6 sixes).  
     - **Deck B (dormant evidence)**: 10 cards, same generation rules as Deck A.  
       - *Example sequence*: [5, 2, 6, 6, 4, 3, 6, 6, 1, 6] (5 sixes).  
  2. **Hypothesis descriptions** (on handout):  
     - **H₁ (Fair Die)**: P(1) = P(2) = P(3) = P(4) = P(5) = P(6) = 1/6.  
     - **H₂ (Weighted Die)**: P(6) = 0.5, P(1) = P(2) = P(3) = P(4) = P(5) = 0.1.  
  3. **Betting slips** (two colors: white for priors, yellow for posteriors).  
  4. **Play money**: $10 per student in $1 bills.  
  5. **Trading board** (physical whiteboard or digital) to track bids/asks for H₂ shares.  
  6. **Timer** (for trading rounds).  

  ---

  ### **Payoff Scheme**  
  - **Scoring rule**: Quadratic scoring rule for bets. If a student assigns probability \(p\) to the true hypothesis:  
    \[
    \text{Payoff} = \$1 - (1 - p)^2 \quad (\text{if true}), \quad \$1 - p^2 \quad (\text{if false}).  
    \]  
    (Payments made in bonus points after truth is revealed in follow-up session.)  
  - **Market mechanic**:  
    - Shares of H₂ pay $1 if H₂ is true, $0 otherwise.  
    - Students trade shares at negotiated prices (e.g., bid $0.60, ask $0.70).  
    - Profit = (share payoff) + (play money from trades).  

  ---

  ### **Timeline (110-Minute Session)**  
  #### **Part 1: Setup (10 min)**  
  - **0–5 min**: Introduce hypotheses H₁ and H₂. No mention of old evidence.  
  - **5–10 min**: Explain rules:  
    - Betting slips (white for priors, yellow for posteriors) will be collected/shuffled.  
    - Market: Trading H₂ shares for play money.  

  #### **Part 2: Stale Evidence Activity (30 min)**  
  - **10–12 min**: **Reveal Deck A** (project or hand out cards). Students record the sequence.  
  - **12–15 min**: **Prior amnesia**: Collect Deck A. Students assign priors to H₁/H₂ *without* Deck A (white slips). Collect/shuffle slips.  
  - **15–25 min**: **Re-reveal Deck A**. Students compute *posteriors* (yellow slips). Collect slips.  
    - *Likelihood calculation*:  
      - \(\mathcal{L}(H_2) = (0.5)^{\text{\#6's}} \times (0.1)^{\text{\#non-6's}}\)  
      - \(\mathcal{L}(H_1) = (1/6)^{10}\)  
      - e.g., 6 sixes: \(\mathcal{L}(H_2)/\mathcal{L}(H_1) \approx 94.5\).  
  - **25–30 min**: **Market Round 1**: Trade H₂ shares (5 min). Record final price.  

  #### **Part 3: Dormant Evidence Activity (30 min)**  
  - **30–35 min**: **Reveal Deck B** for a "distractor task": Count consecutive pairs summing to 7 (e.g., [3,4] = 7). Students record sequence.  
  - **35–40 min**: **Prior amnesia**: Collect Deck B. Assign priors to H₁/H₂ *without* Deck B (white slips). Collect/shuffle.  
  - **40–50 min**: **Re-reveal Deck B**. Assign posteriors (yellow slips). Collect slips.  
    - *Likelihood calculation*: e.g., 5 sixes: \(\mathcal{L}(H_2)/\mathcal{L}(H_1) \approx 18.9\).  
  - **50–55 min**: **Market Round 2**: Trade H₂ shares (5 min). Record price.  

  #### **Part 4: Debrief Start (20 min)**  
  - **55–65 min**: **Reflection**:  
    - "In the stale round, what information did you lack when computing your posterior?" (Expected: priors).  
    - "In the dormant round, did the evidence feel *newly* relevant? Why?"  
  - **65–70 min**: **Reveal market prices**:  
    - Stale price (e.g., $0.85), Dormant price (e.g., $0.90).  
    - "Why did the price change if you couldn’t update?"  
  - **70–75 min**: Introduce the "problem of old evidence" label. Define:  
    > "When evidence E is already known, conditionalization cannot justify belief change: \(P_{\text{new}}(H) = P_{\text{old}}(H|E) = P_{\text{old}}(H)\) if \(P_{\text{old}}(E) = 1\)."  

  #### **Follow-Up Session (50 min)**  
  - **Full debrief**: Map activity moments to philosophical issues:  
    | **Moment in Activity** | **Problem/Insight** | **Standard Escape** | **Cost of Escape** |  
    |-------------------------|----------------------|----------------------|---------------------|  
    | Prior amnesia slips | Agents lose pre-E beliefs; can’t compute \(P_{\text{old}}(H\|E)\) | **Counterfactual priors**: Act as if you didn’t know E | Arbitrary (no fact about "what you would have believed") |  
    | Market price rises (e.g., $0.90) | Collective confidence increases despite no "legal" update | **Learning entailment**: Update on "H₂ entails E" | Requires modeling logical uncertainty; ignores likelihoods |  
    | Dormant evidence feels more confirmatory | Intuition driven by noticing entailment, not E itself | **Reassign priors**: Set \(P_{\text{old}}(H)\) retroactively | Unprincipled; undermines coherence |  
  - **Stale vs. Distinction Collapse?**  
    - Stale (Deck A): Students knew E and its relevance upfront. Felt *less* confirmation.  
    - Dormant (Deck B): Students knew E but not relevance. Felt *stronger* confirmation (e.g., "Aha! Those sixes matter!").  
    - **Verification**: Poll students on which round felt more "confirmatory."  
    - **Result**: Distinction holds if dormant triggers stronger intuition (due to entailment-noticing). If not, replace with **known evidence** vs. **noticed relevance**.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"Prior amnesia feels artificial"**:  
     - *Why*: Students know they’re pretending.  
     - *Fix*: Stress: "This simulates scientists who’ve lost records of early beliefs. Your struggle is the point!"  

  2. **Market dominated by loud traders**:  
     - *Why*: 2–3 students set prices.  
     - *Fix*: Seed anonymity (e.g., written bids). Step in as market maker if needed.  

  3. **Refusal to bet on entailment**:  
     - *Why*: Trading shares of H₂ feels abstract.  
     - *Fix*: Clarify: "You’re betting H₂ is true, not that it entails E."  

  4. **Arithmetic overwhelms**:  
     - *Why*: Likelihood calculations bog down.  
     - *Fix*: Pre-calculate \(\mathcal{L}(H_2)/\mathcal{L}(H_1)\) for 0–10 sixes on handout.  

  5. **Dormant distraction fails**:  
     - *Why*: Students notice sixes despite task.  
     - *Fix*: Use a noisier distractor (e.g., "Find primes in rolls").  

  ---

  ### **Load-Bearing Design Choices**  
  1. **Prior Amnesia Mechanic**:  
     - **Role**: Forces students into the "ordinary scientific case" (know E, lack pre-E beliefs).  
     - **Change mind if**: Students reconstruct priors easily (poll during debrief). If so, replace with **blinded priors** (students don’t see own slips).  

  2. **Market + Scoring Rule**:  
     - **Role**: Makes confirmation visceral through stakes. Prices externalize intuitions that personal slips can’t.  
     - **Change mind if**: Prices reflect risk-aversion, not beliefs (e.g., low trade volume). If so, drop market and use **group polling** instead.  

  3. **Stale/Dormant Split**:  
     - **Role**: Tests if entailment-noticing drives confirmation intuitions.  
     - **Change mind if**: Distinction doesn’t elicit different reactions (per student polls). If so, collapse into a single case and focus on **prior amnesia + market**.  

  **Weakest Link**: Prior amnesia. If students reject the simulation, the problem becomes abstract. Backup: Use a **pre-survey** weeks earlier to capture genuine priors, then "lose" them.  

  ---

  ### **What the Activity Can’t Reproduce**  
  - **Logical uncertainty**: Bayesian updates on entailment (e.g., \(P(H \vdash E)\)) require probability over proofs. Stated in debrief:  
    > "In real science (e.g., Mercury’s orbit confirming relativity), the challenge is modeling *learning that H entails E*. Our dice avoid this—you computed likelihoods directly."  

  ### **Instructor Script Snippets**  
  - **During amnesia**: "You’ve seen this data, but imagine your lab notebook from before seeing it was lost. What would you have believed then?"  
  - **When prices rise**: "Look—the market believes H₂ more now! But your posterior slips said you couldn’t update. Why the gap?"  
  - **Debrief closure**: "The problem isn’t that evidence can’t confirm. It’s that Bayes can’t capture *how* without a time machine for your past beliefs."  

  ---  
  This design forces students into the problem through rules, makes confirmation tangible via markets, and tests the stale/dormant distinction. Run it as-is, but poll students in the dormant round to validate the distinction.
