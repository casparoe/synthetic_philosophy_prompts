     - D1: Uses a general rule (modus ponens) to derive the conclusion.
     - D2: Uses a cached table that happens to agree with the rule on all inputs the machine will ever see.
     - D3: Assigns meaning after the fact to make the step valid.

  The problem: D3 seems bogus, but why? And how do we distinguish D1 and D2?

  Let me break down the conceptual issues.

  ### 1. The Problem of Causal Efficacy (Do Simmballs Push?)
  The low-level story is complete, so any high-level story is a pattern that supervenes on the low-level. Therefore, the simmballs don't "push" in the sense of adding extra physical forces. However, we can still ask whether the high-level description captures real patterns that are explanatory.

  The idea of "pushing" might be reframed in terms of counterfactuals: if the simmball had been different (i.e., if the symbol had a different meaning), would the behavior have been different? But note: the simmballs are not independent entities; they are defined by the careenium state. So we cannot arbitrarily change a simmball without changing the careenium. Therefore, we must consider whether the high-level description supports intervention counterfactuals that are consistent with the low-level physics.

  ### 2. Explanatory Power of High-Level Descriptions
  The high-level description (simmballs) might be explanatory because it captures regularities that are not apparent at the low level. For example, D1 and D2 both capture a regularity: the output is a function of the input that can be described by a rule (either a general rule or a cached table). D3 does not capture any regularity; it is just a post-hoc assignment.

  ### 3. Distinguishing D1 and D2
  D1 and D2 are both predictive and capture patterns, but they differ in the internal structure they attribute to the system. How can we choose between them? In the setup, they are observationally equivalent (same input-output for all actual and counterfactual inputs the machine will see). However, they might differ in their predictions about what would happen under certain modifications of the machine.

