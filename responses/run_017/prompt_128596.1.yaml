  The original puzzle was about whether the meaning of the simmballs (their aboutness) plays a role. In the counterfactual account, we see that the structural role (how the simmballs are connected and how changes propagate) is what matters for explanation. The aboutness might be seen as grounded in these structural roles (e.g., the symbol for 'all Fs are G' plays the role of a general rule in the inference). So the aboutness is not an extra ingredient but is constituted by the functional role.

