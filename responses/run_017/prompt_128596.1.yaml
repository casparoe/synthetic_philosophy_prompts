  ### Conclusion on D1 vs D2
  If the machine is never exposed to inputs outside a fixed set, then the careenium state that implements a rule and the one that implements a cached table might be indistinguishable. However, the internal structure of the careenium might still favor one interpretation. For example, if the careenium state has a modular part that is used for multiple inferences, that might look like a rule. If it has a big array of stored results, that might look like a cache.

