prompt: |-
  Next week I am giving a methods Grand Rounds in a school of public health, defending the following thesis to an audience of mainstream epidemiologists and biostatisticians: in a randomized trial with noncompliance, a Simpson's-paradox reversal across adherence strata does not show that the treatment is harmful among adherers; because adherence is a post-treatment variable affected by assignment and by prognosis, stratifying on it conditions on a collider, so the unadjusted intention-to-treat estimate is unbiased (or nearly so) for the effect of assignment while the stratified reversal is the artifact. The audience is fluent in causal diagrams and potential outcomes, believes measured baseline confounders must be adjusted for, is skeptical of intention-to-treat estimates as too conservative, and is sympathetic to per-protocol or adherence-stratified analyses as revealing the real biological effect; they care about whether the drug should be prescribed to patients likely to adhere. My sketch: under a diagram in which assignment is randomized, adherence is caused by assignment and by unmeasured prognosis, and mortality is caused by assignment, adherence, and prognosis, adherence is a collider (it is caused by both assignment and prognosis), so the adherence-stratified comparison mixes the null effect of the drug with selection bias; I will show a small numeric example in which the drug has no effect on mortality for any type of patient—whether they would adhere or not—yet both adherence-stratified analyses show harm. Please draft my Q&A prep sheet: the eight or so objections I will actually get from this audience (not from a philosophy-of-causation crowd), ordered by how likely and how damaging they are; for each, phrase the objection as a mainstream epidemiologist or trialist would put it, and give what I should concede, what I should hold, a two-minute reply, and a note on where the reply is weakest; finally, mark the one objection I am hoping nobody asks.
reasoning: |-
  We are preparing a Q&A for a Grand Rounds presentation on the pitfalls of stratifying by adherence in randomized trials with noncompliance. The key point is that conditioning on adherence (a collider) introduces bias, even when the treatment has no effect. The audience is mainstream epidemiologists and biostatisticians who are sympathetic to per-protocol analyses and believe ITT is conservative. They care about the real biological effect and whether to prescribe to patients likely to adhere.

  We'll list 8 objections, ordered by likelihood and potential damage. For each, we provide:
  - The objection as a mainstream epidemiologist would phrase it.
  - What to concede (if anything).
  - What to hold (the core argument to maintain).
  - A two-minute reply.
  - A note on the weakness of the reply.
  - Finally, mark the one objection we hope nobody asks.

  Ordered from most likely and damaging to less:

  1. **Objection 1: But we know from prior studies that adherence is a strong predictor of outcome, so shouldn't we adjust for it?**
     - Concede: That adherence is often associated with outcomes in observational studies and trials.
     - Hold: This association is not necessarily causal and can be due to confounding (by prognosis) or reverse causation. In the trial setting, conditioning on a collider (adherence) introduces bias even in the absence of a treatment effect.
     - Reply: "You're right that adherence is often associated with outcomes. However, in the context of a randomized trial, adherence is a post-randomization variable. Our diagram shows that adherence is a collider because it is influenced by both assignment and prognosis. When we condition on it, we induce an association between assignment and prognosis, which are otherwise independent due to randomization. This creates a spurious association. In my example, even with no real effect, we saw harm in the adherers. So, the observed association between adherence and outcome is not necessarily causal and may reflect confounding by prognosis. We must be cautious not to misinterpret this as a biological effect."
     - Weakness: The audience might argue that in their experience, the association is so strong and consistent that it must be causal, and they may not fully accept the collider argument without more concrete examples.

  2. **Objection 2: If the ITT estimate is unbiased for the effect of assignment, but we want the effect of actually taking the drug (the biologic effect), then we must adjust for adherence. Why not use an instrumental variable (IV) method instead?**
     - Concede: That ITT estimates the effect of assignment, and if we want the effect of treatment received, we need other methods like IV.
     - Hold: However, IV methods require strong assumptions (exclusion restriction, monotonicity) that may not hold. Moreover, the per-protocol or adherence-stratified analysis without IV is biased because of the collider. The IV method avoids conditioning on the collider by using assignment as an instrument.
     - Reply: "I agree that if we want the effect of treatment received, ITT is not that. And IV methods are a valid alternative under certain assumptions. But note: the per-protocol or adherence-stratified analysis is not an IV analysis. It conditions on adherence, which is a collider, and thus introduces bias. Even if we use IV, we must be cautious about the assumptions. For example, if there are defiers (violating monotonicity) or if assignment affects the outcome through pathways other than adherence (violating exclusion), IV can be biased. But the point of my talk is that the naive stratification by adherence is biased even when the treatment has no effect, as shown in the example. So, if you want the biologic effect, use IV but be aware of its assumptions, not the stratified analysis."
     - Weakness: The audience might not see the relevance because they are thinking of IV, and they might believe that IV is robust enough to replace the stratified analysis.

  3. **Objection 3: In your example, the reversal occurred because of the collider, but in real trials, we measure and adjust for baseline prognosis. Doesn't that fix the problem?**
     - Concede: That measuring and adjusting for baseline prognostic factors is important and can reduce bias in many settings.
     - Hold: However, if there are unmeasured prognostic factors (which is common), adjusting for the measured ones may not fully remove the collider bias. Moreover, even if we adjust for all measured confounders, the collider bias may persist if there is any residual unmeasured confounding for the adherence-outcome relationship.
     - Reply: "Adjusting for measured prognostic factors is indeed crucial and can help. However, in the adherence stratification, we are still conditioning on a variable (adherence) that is a collider. Even if we adjust for measured prognosis, if there is any unmeasured component of prognosis that affects adherence and outcome, we will still induce an association between assignment and that unmeasured prognosis. This can lead to residual bias. In fact, my example can be extended to show that even after adjusting for measured prognosis, if there is unmeasured prognosis, the bias remains. Therefore, the problem is not entirely solved by adjustment for baseline factors."
     - Weakness: The audience might argue that in well-designed trials, they measure all important prognostic factors, so unmeasured confounding is minimal. They might also point out that in practice, they use propensity scores or other methods to balance measured factors.

  4. **Objection 4: The ITT estimate is diluted by noncompliance and is therefore conservative. We are interested in the effect of the treatment when taken, so we need to look at adherers.**
     - Concede: That ITT is affected by noncompliance and may be closer to null than the effect in adherers.
     - Hold: However, the adherence-stratified estimate is biased because of the collider. We cannot recover the true effect in adherers by conditioning on adherence without introducing selection bias. The IV approach is designed for that but requires assumptions.
     - Reply: "I agree that ITT is conservative in the sense that it does not estimate the effect in adherers. But the alternative of looking only at adherers is not unbiased. Because adherence is a collider, conditioning on it induces an association between assignment and prognosis. In the adherers group, the control group might have a better prognosis because only the healthier controls adhered (since they were assigned to control and adherence is influenced by prognosis). This makes the control group in adherers look better, so the treatment looks harmful. This is exactly what happened in my example. Therefore, we cannot simply take the adherers group as representative of the effect of the drug when taken. We need methods that account for the selection, such as IV, but note that IV estimates the effect in the compliers (not necessarily the adherers in general)."
     - Weakness: The audience might not be convinced that the bias in the stratified analysis is as severe as claimed, especially in large trials.

  5. **Objection 5: But in many trials, we see that the per-protocol analysis and the ITT are similar. Doesn't that suggest that the collider bias is negligible?**
     - Concede: That in some cases, the bias might be small and the estimates similar.
     - Hold: However, when they are different, we cannot assume that the per-protocol is more accurate. It could be that the per-protocol is biased and the ITT is unbiased. Also, the similarity might be coincidental.
     - Reply: "It's true that sometimes the estimates are similar, but that doesn't mean the per-protocol analysis is unbiased. The collider bias might cancel with other biases or be small in magnitude. However, when we see a reversal (like Simpson's paradox), that is a clear sign of collider bias. Moreover, in cases where the treatment effect is null, the per-protocol analysis might show a harmful or beneficial effect purely due to bias. Therefore, we should not rely on the per-protocol analysis even when it seems to agree with ITT, because we don't know when the bias is present and when it isn't. The ITT is always unbiased for the effect of assignment, which is the policy-relevant effect."
     - Weakness: The audience might point to specific trials where per-protocol and IV estimates were similar and argue that in practice, the bias is minimal.

  6. **Objection 6: What about the as-treated analysis? Isn't that similar to the adherence-stratified and also biased?**
     - Concede: That as-treated analysis (where we compare patients by the treatment they actually received, ignoring assignment) is also subject to the same collider bias and other confounding because it breaks randomization.
     - Hold: The as-treated analysis is even more problematic because it does not use randomization and is subject to confounding by indication. The adherence-stratified analysis is a form of as-treated within strata of adherence, but it still conditions on the collider.
     - Reply: "Absolutely. The as-treated analysis is not protected by randomization because it ignores the original assignment. It is essentially an observational analysis and can be confounded by factors that affect both adherence and outcome. The adherence-stratified analysis is a conditional version of as-treated and still suffers from the collider bias. Both are biased, and ITT is the only analysis that preserves the benefits of randomization. If we want to estimate the effect of treatment received, we should use IV methods that respect the randomization."
     - Weakness: This objection is actually reinforcing the point, so the reply is strong. But the audience might not see the distinction between as-treated and per-protocol.

  7. **Objection 7: In your diagram, you assume that prognosis affects adherence. But what if adherence is only affected by assignment and random factors? Then wouldn't the stratified analysis be unbiased?**
     - Concede: That if adherence is not affected by prognosis (or any other factor that also affects the outcome), then conditioning on adherence would not be conditioning on a collider and might be less biased.
     - Hold: However, in real trials, adherence is almost always influenced by the patient's health status (prognosis). Sick patients might be more or less likely to adhere. Therefore, the scenario without prognostic influence on adherence is unrealistic.
     - Reply: "If adherence were only influenced by random factors and assignment, then indeed, it would not be a collider and conditioning might not induce bias. But in reality, adherence is often influenced by the patient's health status, side effects, comorbidities, etc. These factors are also prognostic. Therefore, in practice, adherence is a collider. We can design trials to minimize noncompliance, but we cannot eliminate the influence of prognosis on adherence. Therefore, the bias is a real concern."
     - Weakness: The audience might argue that in some trials (e.g., with high adherence and no clear predictors), this might not hold, and they might demand evidence that prognosis affects adherence in a given trial.

  8. **Objection 8: The ITT is the effect of offering treatment, but we want to know the effect of taking treatment. Why are you dismissing the biological effect?**
     - Concede: That the biological effect is of interest, and ITT does not estimate it.
     - Hold: But the adherence-stratified analysis does not estimate it either because of the collider bias. We need to use appropriate methods (like IV) for the biological effect, and even then, we only get the effect in a subgroup (compliers).
     - Reply: "I am not dismissing the biological effect. I am arguing that the adherence-stratified analysis does not estimate it without bias. The ITT estimates the effect of assignment (offering treatment), which is important for policy. For the biological effect, we must use methods that account for noncompliance without introducing bias, such as IV. However, note that IV estimates the local average treatment effect (LATE) in compliers, which might not be the same as the effect in adherers. But it's the best we can do under noncompliance without conditioning on a collider."
     - Weakness: The audience might be dissatisfied because they want the effect in adherers and IV gives the effect in compliers. Also, IV estimates are often imprecise.

  **The objection we hope nobody asks:**
  We mark **Objection 3** as the one we hope nobody asks because it directly challenges the core example by suggesting that adjusting for measured prognosis would solve the problem, and it may be hard to convincingly argue about unmeasured confounding in front of an audience that believes in their measured adjustments. Also, this objection is very common and damaging if the audience is not convinced by the unmeasured part.
answer: |-
  ### Q&A Prep Sheet: Defending the Collider Bias Thesis in Noncompliance Trials

  **Core Thesis:** In randomized trials with noncompliance, stratifying on adherence (a collider) induces selection bias. The unadjusted ITT estimate is unbiased for the effect of assignment, while adherence-stratified estimates (e.g., Simpson's paradox reversals) are artifacts. The audience values biological effects and may prefer per-protocol analyses.

  **Key Diagram:**  
  Randomized assignment → Adherence  
  Prognosis → Adherence  
  Randomized assignment → Mortality  
  Adherence → Mortality  
  Prognosis → Mortality  
  *(Adherence is a collider of assignment and prognosis)*

  **Example to Cite:** Numeric simulation where:  
  - Treatment has **no true effect** on mortality (null for all patients).  
  - ITT correctly shows null effect.  
  - Adherence-stratified analysis shows **spurious harm** in adherers due to collider bias.

  ---

  ### Top 8 Objections & Replies (Ordered by Likelihood and Damage)

  #### **1. Objection (Most Likely & Damaging)**  
  *"We adjust for measured baseline confounders in adherence-stratified analyses. Doesn't that eliminate collider bias?"*  
  - **Concede:** Adjusting for measured confounders reduces bias in many causal analyses.  
  - **Hold:** Unmeasured prognosis (e.g., disease severity, comorbidities) remains a key driver of collider bias. Adjusting for measured confounders rarely captures all prognostic variance.  
  - **2-Minute Reply:**  
    "Thank you—adjusting for measured confounders is indeed best practice. However, collider bias arises because adherence is influenced by *unmeasured* prognosis (e.g., subtle symptoms, psychosocial factors). When we condition on adherence, we induce associations between assignment and *unmeasured* prognosis. Even with adjustment for measured factors, residual confounding persists. In my example, I assumed no measured confounders for simplicity, but adding them doesn’t resolve bias if unmeasured prognosis exists—which it nearly always does. The ITT avoids this by preserving randomization."  
  - **Weakness:** Audience may counter that modern trials capture "sufficient" prognosis via rich data, making unmeasured factors negligible.  

  #### **2. Objection**  
  *"ITT is diluted by noncompliance and underestimates biological effects. We need per-protocol analyses to inform prescribing decisions for adherers."*  
  - **Concede:** ITT estimates the effect of *assignment* (policy effect), which may differ from the biological effect.  
  - **Hold:** Per-protocol analyses are biased by collider effects; they do not recover the true biological effect. Instrumental variable (IV) methods (e.g., CACE) are preferable.  
  - **2-Minute Reply:**  
    "I agree ITT is conservative for biological effects—but per-protocol analyses are *misleading*, not corrective. Conditioning on adherence induces selection bias: healthiest controls adhere, making treatment appear harmful. IV methods leverage randomization to estimate effects in compliers *without* conditioning on a collider. If you care about adherers, use IV—not stratification. My example shows per-protocol harm even when the true effect is null."  
  - **Weakness:** IV estimates are local to compliers and may not generalize to all adherers.  

  #### **3. Objection**  
  *"Adherence is a mediator, not just a collider. Shouldn’t we decompose direct/indirect effects (e.g., via mediation analysis)?"*  
  - **Concede:** Adherence can be part of the causal pathway (e.g., assignment → adherence → outcome).  
  - **Hold:** When prognosis affects adherence, it remains a collider. Standard mediation models (e.g., Baron-Kenny) fail if collider bias exists.  
  - **2-Minute Reply:**  
    "Excellent point—adherence often has dual roles. But in this context, prognosis (e.g., baseline health) directly influences adherence, making it a collider. Mediation analyses assume no confounding between adherence and outcome, which is violated here. Techniques like inverse probability weighting or g-methods could theoretically address this, but they require strong assumptions about unmeasured prognosis. ITT remains unbiased without such assumptions."  
  - **Weakness:** Advanced mediation methods (e.g., natural direct effects) might handle colliders but are complex and rarely used in trials.  

  #### **4. Objection**  
  *"In practice, adherence-stratified estimates often align with IV estimates. Doesn’t that validate them?"*  
  - **Concede:** Per-protocol and IV estimates can coincide in some trials.  
  - **Hold:** Alignment is coincidental and unreliable; collider bias can distort per-protocol even when IV is unbiased.  
  - **2-Minute Reply:**  
    "When they align, it’s likely due to cancelling biases or weak collider effects—not proof of validity. In my null-effect example, per-protocol shows harm while IV (correctly) shows null. Collider bias can inflate, mask, or reverse effects. Relying on per-protocol risks false conclusions when unmeasured prognosis is strong. IV is structurally robust; per-protocol is not."  
  - **Weakness:** Audience may cite empirical examples where estimates converge, arguing collider bias is theoretical.  

  #### **5. Objection**  
  *"If prognosis affects adherence, why not measure and adjust for it? Your argument assumes poor trial design."*  
  - **Concede:** Trials should measure and adjust for key prognostic factors.  
  - **Hold:** Prognosis is inherently multidimensional and rarely fully measurable (e.g., patient resilience, social support).  
  - **2-Minute Reply:**  
    "I advocate for measuring prognosis! But we’re never exhaustive. For instance, in a trial of a cardiovascular drug, ‘prognosis’ includes genetics, diet, stress—factors rarely captured. Adjusting for measured proxies (e.g., BMI) leaves residual bias. Collider bias emerges from the unmeasured portion. ITT is immune; stratification is not."  
  - **Weakness:** Audience may insist prognostic scores or machine learning can adequately capture prognosis.  

  #### **6. Objection**  
  *"We use per-protocol analyses for safety signals. If harm appears only in adherers, shouldn’t we investigate?"*  
  - **Concede:** Subgroup analyses can generate hypotheses.  
  - **Hold:** Collider bias mimics harm; reacting to it wastes resources and may mislead safety protocols.  
  - **2-Minute Reply:**  
    "Safety monitoring is critical, but collider bias creates false signals. In my example, the drug is harmless, yet adherers show spurious harm due to healthier controls adhering. ITT would correctly raise no alarm. Relying on adherence-stratified signals risks misallocating safety resources. Use IV or sensitivity analyses for collider bias instead."  
  - **Weakness:** Regulators often demand subgroup safety analyses, creating tension.  

  #### **7. Objection**  
  *"Your model assumes prognosis affects adherence equally in both arms. What if adherence is only assignment-dependent?"*  
  - **Concede:** If prognosis does *not* affect adherence, collider bias vanishes.  
  - **Hold:** This is implausible; adherence is always influenced by health status (e.g., sicker patients skip doses).  
  - **2-Minute Reply:**  
    "If adherence were *only* assignment-dependent, collider bias wouldn’t arise. But in reality, side effects, symptom burden, or motivation—all tied to prognosis—affect adherence. For example, in antidepressant trials, severe depression predicts non-adherence. Assuming no prognosis-adherence link is unrealistic and dangerous."  
  - **Weakness:** Audience may argue behavioral interventions can minimize prognosis-adherence links.  

  #### **8. Objection (Least Damaging)**  
  *"ITT is irrelevant for clinical decisions. Patients want to know: ‘If I take the drug, will it help me?’"*  
  - **Concede:** Patients care about biological effects.  
  - **Hold:** Per-protocol analyses answer this question poorly due to bias; IV or trial designs with high adherence are better.  
  - **2-Minute Reply:**  
    "I agree—but per-protocol analyses lie to patients. Collider bias means adherers’ outcomes reflect selection, not causation. IV estimates the effect for compliers (‘if you take the drug as assigned’). For adherers, we need high-adherence trials or observational studies with careful confounding control—not flawed stratification."  
  - **Weakness:** IV is less intuitive for clinicians than per-protocol.  

  ---

  ### **The Objection I Hope Nobody Asks**  
  *"In your diagram, assignment affects mortality directly and via adherence. Doesn’t that imply adherence is a mediator? Collider bias should be negligible if the direct effect is small."*  
  - **Why It’s Feared:**  
    - Challenges the core diagram by reframing adherence as primarily a mediator.  
    - If direct effects are minimal, collider bias may be dismissed as secondary.  
    - Epidemiologists may argue that mediation dominates collider pathways.  
  - **Reply Strategy:**  
    - **Concede:** Direct effects (e.g., placebo) can exist.  
    - **Hold:** Prognosis-induced collider bias operates independently; mediation doesn’t negate it.  
    - **2-Minute Reply:**  
      "Even with direct effects, collider bias persists. Suppose assignment has a small direct effect (e.g., placebo). Prognosis still affects adherence, creating a collider. Stratifying on adherence mixes this direct effect with collider-induced selection bias. In my null-example, I assumed no direct effect to isolate the collider; adding one doesn’t eliminate bias. Sensitivity analyses can quantify collider bias, but ITT avoids it entirely."  
    - **Weakness:** Requires admitting direct effects complicate the narrative, potentially diluting the thesis.  

  ---

  **Summary for Presenter:**  
  - **Emphasize:** The numeric example (null effect → spurious harm) is your strongest tool.  
  - **Reiterate:** ITT’s unbiasedness relies solely on randomization; stratification breaks this.  
  - **Bridge:** Acknowledge audience’s goal (biological effects) but argue per-protocol is not the solution—point to IV or improved trial designs.  
  - **Defuse:** Preemptively address #1 ("measured confounders") and #2 ("ITT dilution") early—they’ll dominate Q&A.
