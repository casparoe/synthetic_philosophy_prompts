prompt: |-
  I've been going down a rabbit hole on the two-envelope paradox after watching a video essay about it, and I can't work out which bits to trust. The guy's summary goes roughly like this: the paradox is a fake, because the mistake is treating the amount in your envelope as a fixed x while saying the other one is equally likely to be 2x or x/2 — once you actually open the envelope and see the number it dissolves, you just do a Bayesian update on your prior, and for any sane prior switching only looks good for some amounts and bad for others, which is what the symmetry argument was telling you all along. He then says the fancy version — where the smaller amount is 2^k pounds with probability c(3/4)^k for k = 0, 1, 2, ..., c just being whatever normalises it — is the same mistake in a cleverer costume, since there the expected amount in each envelope is infinite and infinity isn't a number you can do decision theory with, so there's nothing to explain. The lesson he draws at the end is that expected-utility theory just breaks down once values are unbounded, and that decision theorists ought to be using things like stochastic dominance or comparing medians instead of means.

  A friend who did some graduate decision theory says he's half right at best: she says that in that geometric variant, for every amount you could possibly see, the other envelope genuinely does have higher expected value, so the naive 'switch' reasoning isn't a blunder there at all, and what's really going on is that both envelopes have infinite expectation, so the usual 'then you'd switch back' step never gets off the ground.

  Can you go through his summary more or less claim by claim and tell me what someone who actually works on this would accept, what they'd wince at, and what's straightforwardly wrong — and in particular whether the final lesson about expected utility follows from any of it or is a non-sequitur? I'd also like to know whether my friend's version of the geometric case is right, and whether the 'infinite expectations, nothing to explain' line really defuses it or just changes the subject. My own instinct is that the infinity bit is a cop-out, but I definately don't trust that instinct. Please answer in British English, and please don't just rehearse the basic paradox at me — I've read the setup about six times today already.
