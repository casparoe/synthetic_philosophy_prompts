  First, I need to categorize their argument. They mention "buckets," so I should identify which category their case falls into. Their main point is about bounded rationality and implementation. The standard buckets are: 1) forward-looking reasons disguised as sunk costs, 2) signaling/reputation, or 3) utility functions. Their argument seems to fit into utility functions—specifically, the disutility of quitting itself as a preference.

