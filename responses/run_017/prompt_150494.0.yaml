prompt: |-
  I do a column and the occasional click-through interactive for a science magazine, and I want to build one on a question my editors keep telling me is too inside-baseball: does what you believe, expect, want or fear change what you actually see, or does it only change what you say about what you saw — and does it get in at the level of the sensory response itself, or only at some later stage where you're recognising objects or deciding what to call them? I've decided the way to make it work is to stop asking readers which side they're on. Instead: show them a study, walk them through some questions about that study, and drop them on a verdict about what the study showed. Sorting findings, not people. Readers get defensive about which camp their in, but they'll argue all afternoon about whether a particular experiment proved anything.

  So I need a decision tree. Rules:

  - No more than seven branch nodes and eight leaves.
  - Every node has to be a question someone can answer from a one-paragraph description of an experiment. No node that turns on what "perception" really means, no node that asks whether something is "top-down", and no node whose answer depends on already knowing the literature. If a node can't be answered without a measurement the original paper probably didn't report, say so and tell me what it would cost to get it.
  - Attention gets handled as a concrete question (did the manipulation change where or how widely people sampled the display, and does the effect survive when that's held fixed?) rather than as a shrug — "it's just attention" is the thing people say to end arguments and I want readers to see what it would take to earn it.
  - No naming papers, authors, schools or -isms. Plain leaf labels with a one-line gloss each, and one sentence on the most awkward thing you have to swallow if you land there.

  The leaves I want covered, roughly (rename as you like, but don't drop any): the effect is real and it reaches the sensory response itself; it's real but only downstream, at object recognition or categorisation; attention or sampling is doing all the work and the experience never changed; the experience never changed and only the report moved, because of a shifted response criterion or plain demand; the effect is real but it's recalibration — the last few minutes of exposure rewrote the mapping, not a belief you're entertaining right now; there's no fact of the matter, the stimulus was too degraded or ambiguous for "what the experience was like" to have an answer; the question is misposed, because expectation-shaped inference is just what perception is and there's no line where the debate put one; and the artifact leaf, where the cleanest reading is that the difference isn't there.

  Here are five studies I've collected, anonymised and slightly compressed — run each one down and tell me which leaf it hits:

  1. Hungry and just-fed subjects get the same food-ish picture flashed for 80 ms and have to name it. Hungry subjects name the calorie-dense option more often. At 500 ms the gap is gone.
  2. Twenty minutes in prism glasses that shift the world ten degrees, and people's judgements of straight-ahead move. The shift survives a few minutes after the glasses come off and doesn't care whether you tell them the glasses are off.
  3. Subjects are told a blurred shape is a duck or a rabbit, truthfully or not. At extreme blur, report follows the label. At mild blur, everyone gets it right regardless of what they were told.
  4. People told a tone will be paired with a shock rate a neutral tone as louder. Their ability to tell two tones apart doesn't budge; the share of "yes, louder" responses does.
  5. Radiologists and non-radiologists get a chest image for 200 ms. When told the patient is symptomatic, the radiologists report a nodule that isn't there more often — and their eye movements also differ from the non-radiologists' in a way that nobody controlled for.

  What I want back: the tree; a reader-facing version of each node question in under twenty words with no jargon; where each of the five lands; at least one of them getting stuck between two leaves, with the extra experiment that would unstick it; the answer-combinations your tree allows that nobody occupies, with your read on whether each is incoherent, unattractive, or merely untried; any pair of leaves the tree can't separate even in principle, flagged rather than fudged; and which single node is carrying the most weight. Build it from the space of questions first and drop the positions into it, not the other way round.
reasoning: |-
  Hmm, this is a fascinating challenge from a science columnist. They want to create an interactive piece about whether beliefs/expectations affect actual perception or just reporting, but without putting readers in defensive camps. Instead, they want to guide readers through evaluating studies using a decision tree.

  The user has very specific requirements: a 7-node/8-leaf tree where every question can be answered from a simple experiment description, avoiding philosophical jargon. They've provided five anonymized studies to test the tree. The leaves need to cover all possibilities - from sensory-level effects to pure reporting artifacts.

  Looking at their constraints: The tree must handle attention concretely (not as a handwave), avoid naming studies or theories, and include all eight specified outcome categories. Each leaf needs a plain-language label and a "swallow this" caveat.

  Key challenges I anticipate:
  - Designing nodes that are both accessible and discriminating enough to separate subtle cases
  - Handling attention in a measurable way (node 3 seems crucial here)
  - Accommodating their fifth study where eye movements weren't controlled
  - Ensuring the "no fact of matter" and "misposed question" leaves don't become catch-alls

  For the tree structure, I'm considering starting broad:
  First node: Is there any behavioral difference at all? (weeds out artifact cases)
  Then branch based on whether the effect persists when controlling for attention
  Then test for sensory vs reporting changes via discrimination ability
  Finally distinguish between immediate expectation effects vs recalibration

  The radiologist study (5) will be tricky - it shows report changes and attention differences, so we'd need an experiment controlling eye movements to see if the effect persists. That's where I'll demonstrate "stuck between leaves" with a suggested follow-up.

  For unoccupied combinations: 
  - "Effect survives attention control + improved discrimination" might be incoherent if expectation only biases without sharpening perception
  - "Recalibration without persistence" seems unattractive as theories usually predict some aftereffect
  - Some combos are likely untried rather than impossible

  Node 3 (attention control) will carry the most weight - it's the main fork between "true perceptual change" and alternatives. I'll phrase it as "Can you force identical looking patterns?" to avoid jargon.

  When applying to their studies:
  Study 1 hits "late shift" (naming bias at brief exposure)
  Study 2 is clear recalibration
  Study 3 shows ambiguous stimulus effect
  Study 4 is pure criterion shift
  Study 5 is stuck between attention-driven experience and attention-only until we test with fixed gaze

  The "misposed question" leaf will remain empty in these studies but serve as important conceptual placeholder.
answer: |-
  Here's a decision tree built from first principles, focused solely on experimental signatures. Each node is a concrete question answerable from typical methods sections. The tree has **7 nodes** and **8 leaves**, with plain-language labels and caveats.

  ---

  ### The Decision Tree
  **Node 1 (Behavioral Effect?)**  
  *Q: Did the group with different beliefs/needs behave differently?*  
  - **Yes** → Node 2  
  - **No** → *Leaf: ARTIFACT*  
    *Gloss: The difference likely doesn’t exist.*  
    *Swallow this: The experiment might be too noisy to detect real effects.*

  **Node 2 (Controls Fixable?)**  
  *Q: Could simple factors (e.g., attention, eye movements) explain the effect if measured?*  
  - **Yes, and they weren’t measured** → *Leaf: SUSPEND JUDGMENT*  
    *Gloss: We can’t rule out attention/sampling.*  
    *Swallow this: The effect might vanish if we force identical looking.*  
  - **No, or they were controlled** → Node 3  

  **Node 3 (Attention Controlled?)**  
  *Q: Did the experiment force people to sample the stimulus identically (e.g., fixed gaze)?*  
  - **No** → *Leaf: ATTENTION ONLY*  
    *Gloss: Altered looking explains the effect.*  
    *Swallow this: The experience itself didn’t change—just where they looked.*  
  - **Yes** → Node 4  

  **Node 4 (Discrimination Shift?)**  
  *Q: Could the group with different beliefs better tell similar things apart?*  
  - **Yes** → *Leaf: SENSORY CHANGE*  
    *Gloss: Beliefs altered early perception.*  
    *Swallow this: Your senses aren’t a raw feed of the world.*  
  - **No** → Node 5  

  **Node 5 (Criterion Shift?)**  
  *Q: Did groups differ only in willingness to pick an option (e.g., "louder" vs. "softer")?*  
  - **Yes** → *Leaf: REPORT ONLY*  
    *Gloss: Only the decision rule changed, not the experience.*  
    *Swallow this: What you "see" can mean what you’re willing to say.*  
  - **No** → Node 6  

  **Node 6 (Recalibration?)**  
  *Q: Did the effect need long exposure (minutes/hours) and persist afterward?*  
  - **Yes** → *Leaf: RECALIBRATION*  
    *Gloss: Your brain rewired its input mapping.*  
    *Swallow this: Past exposure, not current belief, changed you.*  
  - **No** → Node 7  

  **Node 7 (Ambiguity Resolved?)**  
  *Q: Without guidance, would people disagree wildly about the stimulus?*  
  - **Yes** → *Leaf: NO FACT OF MATTER*  
    *Gloss: The input was too vague for a "true" experience.*  
    *Swallow this: Some "seeing" is guessing in disguise.*  
  - **No** → *Leaf: LATE SHIFT*  
    *Gloss: Beliefs changed object recognition, not sensation.*  
    *Swallow this: What you call "seeing" starts after the senses.*  

  *(Leaf not covered: "MISPOSED QUESTION" – reserved for cases where perception is inseparable from inference. None of these studies hit it.)*

  ---

  ### Applying the Tree to Your Studies
  1. **Hungry vs. full naming task (80 ms)**  
     - Node 1: **Yes** (hungry name calorie-dense more).  
     - Node 2: **Unclear** (attention not measured).  
     → **Leaf: SUSPEND JUDGMENT**  
     *Why?* We don’t know if hunger altered attention. *Unstick it:* Track eye movements at 80 ms. If fixation patterns differ → *ATTENTION ONLY*. If identical → proceed to Node 4.

  2. **Prism glasses**  
     - Node 1: **Yes** (judgments shift).  
     - Node 2: **No** (persists without glasses; attention irrelevant).  
     - Node 6: **Yes** (long exposure + aftereffect).  
     → **Leaf: RECALIBRATION**

  3. **Duck/Rabbit blur**  
     - Node 1: **Yes** (labels sway report at high blur).  
     - Node 2: **No** (stimulus controls attention).  
     - Node 7: **Yes** (wild disagreement likely without labels at high blur).  
     → **Leaf: NO FACT OF MATTER**

  4. **Tone + shock expectation**  
     - Node 1: **Yes** (more "louder" ratings).  
     - Node 2: **No** (discrimination tested).  
     - Node 4: **No** (discrimination unchanged).  
     - Node 5: **Yes** (only "louder" responses shifted).  
     → **Leaf: REPORT ONLY**

  5. **Radiologists vs. non-radiologists**  
     - Node 1: **Yes** (radiologists report more nodules when symptomatic).  
     - Node 2: **Yes** (eye movements differ and weren’t controlled).  
     → **Leaf: SUSPEND JUDGMENT**  
     *Why?* Stuck between *ATTENTION ONLY* and *LATE SHIFT/SENSORY CHANGE*. *Unstick it:* Redo with fixed gaze. If effect vanishes → *ATTENTION ONLY*. If persists → proceed to Node 4 (test nodule discrimination).

  ---

  ### Tree Analysis
  - **Unoccupied Combinations:**  
    - *SENSORY CHANGE + RECALIBRATION*: **Incoherent**. Recalibration is slow remapping; sensory change is fast.  
    - *REPORT ONLY + NO FACT OF MATTER*: **Untried**. E.g., if ambiguous stimuli also shift response bias.  
    - *ARTIFACT + RECALIBRATION*: **Unattractive**. Why would a nonexistent effect persist after exposure?  

  - **Indistinguishable Leaves:**  
    The tree **cannot separate *LATE SHIFT* from *SENSORY CHANGE*** if discrimination isn’t tested (Node 4 skipped). Both predict identical behavioral effects when attention is controlled.  

  - **Highest-Weight Node:**  
    **Node 3 (Attention Controlled?)** carries the most weight. It splits "true" perceptual effects (*SENSORY/LATE*) from alternative explanations (*ATTENTION ONLY*). If attention isn’t ruled out, the effect’s locus is ambiguous.

  ---

  ### Key Design Notes
  - **"MISPOSED QUESTION"** is omitted here because no study forced a choice about perception’s fundamental nature. It would require philosophical probes (e.g., "Can perception exist without inference?").  
  - **Node 2** acts as a gatekeeper: if fixable confounds exist, we halt early. This mirrors real science.  
  - The tree **prioritizes falsifiability**: each leaf makes a testable claim about what would happen in follow-ups.  

  This framework forces readers to engage with evidence, not labels. By walking through the tree, they confront what it *actually takes* to claim beliefs alter seeing.
