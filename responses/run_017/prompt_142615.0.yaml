answer: |-
  Here's a new cold intuition pump built to your specs, targeting **moral demandingness**:

  **1. The Pump (Ordinary Setting):**
  > Sarah consistently donates 10% of her income to highly effective charities, volunteers weekly at a food bank, and avoids luxury purchases to free up more resources for donations. She learns that by moving to a smaller apartment in a less desirable neighborhood, she could donate an additional 5% without impacting her basic needs or core relationships. She chooses not to move, valuing her current living situation and community ties. Is Sarah morally required to make this move?

  **Pumped Verdict:** *No, Sarah is not morally required to make the move.* (Target Claim: Extreme consequentialism is false; morality is not maximally demanding. The pump suggests a limit to required sacrifice.)

  **2. Stripped Bare (Bare Propositional Content):**
  > Agent A performs actions constituting a high level of altruistic effort (X). A can perform an additional action (Y) that would generate significant net positive moral value, with a net cost to A involving non-basic preferences but no harm to basic needs or core relationships. A does not perform Y. Is A morally required to perform Y?

  **Claim:** *This bare version still pumps the intuition that A is not morally required to perform Y.*

  **3. The Framing Choice:**
  > **The Contrast Class / Baseline.** The pump frames Sarah's *current* actions (X) as the baseline level of effort. The question implicitly contrasts "doing X" vs. "doing X+Y". The salient possibility space is built around *maintaining or increasing effort from this baseline*. Sarah's current level is presented as the *default* or *status quo* against which the *additional* demand (Y) is measured. The unit of agency is the individual making incremental choices relative to their current practice.

  **4. The Perturbation (Changed Framing - Contrast Class):**
  > **Stripped Version (Perturbed):** Agent A does not perform actions constituting maximal possible altruistic effort achievable without self-harm or relationship destruction. Specifically, A could perform action Y, which would generate significant net positive moral value, with a net cost to A involving only non-basic preferences. A does not perform Y. Is A morally required to perform Y?
  >
  > **Result:** The intuition weakens significantly or flips. The baseline shifts from "doing X" to "doing nothing altruistic at all". The salient contrast is now between "doing less than the maximum possible" vs. "doing the maximum possible". The status quo is implicitly "sub-maximal effort". The question now highlights the *absence* of Y within a broader landscape of inaction, rather than its *addition* to an existing high baseline. The intuition that A *is* morally required to perform Y becomes much stronger, or at least the intuition that they are *not* required vanishes.

  **Analysis of Perturbation:**
  *   **Stated Facts Identical:** The facts about A's current actions (or lack thereof), the nature of Y (costs, benefits), and the absence of harm to basics are held fixed.
  *   **Framing Changed:** *Only* the contrast class/baseline is altered – from "high effort (X)" to "sub-maximal effort". The possibility space is reframed from "maintain/increase current effort" to "achieve maximal effort".
  *   **Intuition Shift:** This shift demonstrably alters the intuitive verdict about obligation. What felt like an optional *increase* beyond a demanding baseline now feels like an obvious *failure* to meet a demanding standard. **This confirms it's a pump, not an argument.** The logical core doesn't compel the verdict; the framing of the baseline does.

  **5. Defender's Objection & Response:**
  > **Objection:** "The baseline *is* part of the content! Stating Sarah's current actions (X) *is* stating a morally relevant fact. The two descriptions *are* different situations: one involves an agent already doing a lot, the other doesn't specify. Your perturbation changes the facts."
  >
  > **Response:** This lands, but reveals the pump's mechanism.
  >     *   **Fact vs. Framing:** While X is a stated fact, its *use as the moral baseline* is the framing choice. The bare perturbed version *could* describe Sarah (she *does* do X, even if not mentioned). The key is *which point of comparison is made salient* by the question structure.
  >     *   **The Pump's Power:** The initial pump leverages the *psychological reality* of status quo bias and effort anchors. We intuitively judge new demands *relative to current practice*. The pump exploits this by setting the anchor at a high effort level, making Y feel like an *extra* demand. The perturbed version exploits the *psychological reality* of ideal standards. When the anchor is "doing nothing" or "sub-maximal", the same Y feels like fulfilling a basic requirement.
  >     *   **The Point:** The defender is right that the baseline *description* differs, but the *moral relevance* of that baseline for judging the requirement of Y is precisely what's contested. The pump doesn't *argue* that the current baseline is morally decisive; it *makes it feel* decisive through framing. The perturbation shows the verdict hinges on which anchor our intuition latches onto, not on a logical deduction from the core facts.

  **Confidence & What's Settled/Contested:**

  *   **Confidence in Pumping (Stripped):** Moderate-High. The psychological mechanisms (contrast effects, anchoring, status quo bias) are robustly documented in judgment and decision-making literature. Experiments on moral demandingness (e.g., Singer's Pond variations) show sensitivity to baseline framing. However, proving the *bare propositional* version alone reliably pumps *without* the initial vividness priming the anchor requires empirical testing I haven't done. I'd need to test subject responses *only* to the stripped versions, counterbalanced, to confirm the framing effect persists without any narrative.
  *   **Confidence in Flip (Perturbed):** High. Changing the baseline anchor demonstrably flips judgments in similar ethical dilemmas (e.g., omission vs. commission framed identically). The perturbed stripped version directly cues the "maximal" anchor, known to increase judgments of obligation.
  *   **Settled Background:**
      *   Framing effects (contrast classes, salience, defaults) significantly influence moral intuitions. (Empirically well-established in moral psychology).
      *   Intuitions are sensitive to how options are described and what comparisons are highlighted. (Widely accepted in experimental philosophy).
      *   Status quo bias and anchoring are powerful cognitive phenomena. (Core findings in cognitive psychology).
  *   **Contested Background:**
      *   The *extent* to which these framing effects reveal intuitions as unreliable guides to truth in philosophical contexts. (Live debate: Critics vs. Defenders of intuition-based methods).
      *   Whether the baseline *should* matter morally in cases like this. (Core dispute between consequentialists and moderates/anti-consequentialists).
      *   How much "cold," propositional framing alone can generate robust intuitions compared to vignettes. (Ongoing methodological discussion in X-Phi).
      *   Whether the defender's objection (baseline is part of the content) successfully defuses the criticism or merely restates the framing's influence. (Key point of philosophical contention).

  This pump isolates how the *salience of a contrast class* (current effort level vs. lack of effort vs. maximal effort) acts as a cognitive anchor, driving the intuition about requirement without adding substantive moral premises. The perturbation proves the anchor, not the core facts, is doing the work. The defender's objection highlights the contested nature of the anchor's moral relevance, which is precisely where the substantive debate lies – a debate the pump bypasses by making one anchor *feel* decisive.
