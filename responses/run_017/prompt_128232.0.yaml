            P1:0 vs -30 -> don't.
            P2:100 vs -40 -> don't.
            P3:50 vs -40 -> don't.
            P4:40 vs -10 -> don't.
            P5:60 vs +50 -> removal gives 50, worse -> don't.
          So no removal.

          Policy Y.

          The majority (P2, P3, P4) are happy? But note, they could have had Z with P3 but chose not to because Y was better for the coalition.

     In Regime C:

          Executive election: P1 wins (6 votes). Implements X.
          Then the assembly can dismiss and get caretaker's policy Z.

          Compare policy X vs Z:

            P1:100 vs 30 -> prefer X.
            P2:0 vs 30 -> prefer Z.
            P3:50 vs 60 -> prefer Z (even though we reduced Z for P3 to 60, it's still better than 50 from X).
            P4:30 vs 70 -> prefer Z.
            P5:20 vs 0 -> prefer X.

          So dismiss requires 13 votes. P2, P3, P4: 5+5+4=14 -> dismiss.

          Outcome: Z.

     So now:

          In A: policy Y.
          In B: policy X.
          In C: policy Z.

