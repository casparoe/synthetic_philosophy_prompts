  Below is a complete simulation design for your seminar, adhering to your constraints and pedagogical goals. The simulation creates conditions where the intuitive prediction (assembly influence: B < A < C) is challenged, revealing how incentives depend critically on the **cost of dismissal** rather than its mere existence.

  ---

  ### **Simulation Design: "Constitutional Rules and Policy Outcomes"**

  #### **Setup (10 minutes)**
  - **Divide students** into 5 parties by handing out role cards:
    - Party 1: 5 students
    - Party 2: 5 students
    - Party 3: 5 students
    - Party 4: 4 students
    - Party 5: 5 students  
    (Total: 24 students)
  - **Distribute materials** (printed cards) to each party:
    - **Policy Payoffs** (same for all rounds):
      | Party | Policy X | Policy Y | Policy Z |
      |-------|----------|----------|----------|
      | 1     | 100      | 0        | 30       |
      | 2     | 0        | 100      | 30       |
      | 3     | 50       | 40       | 60       |
      | 4     | 30       | 30       | 70       |
      | 5     | 20       | 60       | 0        |
      *Rationale*: Policy Z is a moderate compromise (high for P3/P4), X and Y are polarizing. Payoffs ensure no party dominates, forcing coalitions.
    - **Electoral Exposure** (private, per party):
      - Party 1: **–30** (loses 30 if election held)  
      - Party 2: **–40**  
      - Party 3: **–40**  
      - Party 4: **+10** (gains 10)  
      - Party 5: **+50**  
      *Rationale*: Exposure is heterogeneous. P1–P3 fear elections (losses), P4–P5 gain. This ensures no majority is uniformly pro/anti-election, making dissolution a variable threat/gift.

  #### **Rules for All Rounds**
  - **Policy Implementation**: The executive proposes one policy (X, Y, or Z). If passed, parties receive payoffs in the table.
  - **Election Effect**: If an election is triggered (only in Regime A), **no policy is implemented**, and parties receive *only* their electoral exposure (positive/negative).
  - **Timing**: Each round = 15 minutes (negotiation + voting).

  ---

  #### **Round-Specific Rules**
  **Round A: Regime A (15 minutes)**  
  - **Executive Selection**: Elected by assembly majority (≥13 votes). Parties negotiate and vote as blocs (votes = party size).  
  - **Removal**: Assembly can remove the executive by majority vote (≥13). **Consequence**: Election triggered → all parties get *only* their electoral exposure.  
  - **Instructor Prompt**: *"Elect an executive. If removed, an election resets everything."*  

  **Round B: Regime B (15 minutes)**  
  - **Executive Selection**: Separately elected by plurality vote (each student votes individually; most votes wins).  
  - **Policy Override**: Assembly can override the executive’s policy by a **supermajority (16/24 votes)**. If overridden, **no policy passes** (all get 0).  
  - **Removal**: Executive **cannot** be removed.  
  - **Instructor Prompt**: *"Elect an executive. You can block their policy only with 16+ votes."*  

  **Round C: Regime C (15 minutes)**  
  - **Executive Selection**: Separately elected by plurality vote (same as B).  
  - **Removal**: Assembly can remove the executive by majority vote (≥13). **Consequence**: Caretaker takes over and implements **Policy Z** (no election).  
  - **Caretaker Rule**: Pre-agreed to Policy Z (payoffs as in table).  
  - **Instructor Prompt**: *"Elect an executive. If removed, a caretaker enforces Policy Z."*  

  ---

  ### **Predicted Outcomes and Contestable Monotonicity**
  - **Naive Prediction**: Influence order: B (least) < A < C (most).  
  - **Actual Outcome Under These Numbers**:  
    - **Regime A**: Likely coalition (P2, P3, P4) elects P2 executive → Policy Y (P2:100, P3:40, P4:30). Removal fails (P2/P3 fear election losses).  
    - **Regime B**: P1 wins plurality → Policy X. Override fails (need 16 votes; P3/P4/P5 get 50/30/20 > 0).  
    - **Regime C**: P1 wins → Policy X. Assembly dismisses P1 (P2/P3/P4 prefer Z over X) → Caretaker enforces Z.  
    - **Outcomes**:  
      - A: Policy Y (P2:100, P3:40, P4:30)  
      - B: Policy X (P1:100, P2:0, P3:50, P4:30, P5:20)  
      - C: Policy Z (P1:30, P2:30, P3:60, P4:70, P5:0)  
  - **Monotonicity Failure**:  
    - Assembly influence is **B < C < A**, not B < A < C.  
    - **Why?** In A, the coalition achieves its ideal policy (Y) because the mutual-destruction rule deters removal. In C, dismissal is costless but only yields compromise (Z), not the coalition’s ideal. The key is **Policy Z as caretaker default** and **P3’s high election aversion** (–40).  
    - **For Monotonicity to Hold**: Make Policy Z less attractive to P3/P4 (e.g., Z: P3:30, P4:50). Then C > A.  

  ---

  ### **Constitutional Amendment Exercise (10 minutes)**  
  - **Task**: Each party drafts one amendment to "improve" the rules for their own interests.  
  - **Expected Clusters**:  
    1. **Selection Method**:  
       - P1/P5: "Executive elected separately" (prevents assembly control).  
       - P2/P3/P4: "Executive chosen by assembly" (enables coalition control).  
    2. **Dismissal Consequence**:  
       - P1/P2/P3: "No election after dismissal" (avoids losses).  
       - P4/P5: "Dismissal triggers election" (exploits gains).  
  - **Debrief Insight**: Students will notice the two variables (selection vs. dismissal cost) map onto amendment types.  

  ---

  ### **Timeline (90 Minutes Total)**  
  - **0:00–0:10**: Setup (assign parties, distribute cards).  
  - **0:10–0:25**: Round A (Regime A).  
  - **0:25–0:40**: Round B (Regime B).  
  - **0:40–0:55**: Round C (Regime C).  
  - **0:55–1:05**: Amendment drafting.  
  - **1:05–1:15**: Cluster amendments on board + label families.  
  - **1:15–1:40**: Debrief (see below).  
  - **1:40–1:45**: Wrap-up.  

  ---

  ### **Debrief (25 minutes)**  
  1. **Map Outcomes to Variables**:  
     - **Selection Method**: In A, assembly control enabled P2-P3-P4 coalition. In B/C, separate election empowered P1.  
     - **Dismissal Cost**: In A, election threat deterred removal (P2/P3 feared –40 exposure). In C, costless removal enabled policy change to Z.  
     - **Mutual-Destruction Rule**: A removal threat is credible only if the assembly majority is *less* election-averse than the executive. Here, P3’s high aversion (–40) made threats non-credible.  

  2. **Key Insight**:  
     - "Who can dismiss whom" is less important than **"who pays the cost when government falls."**  
     - Real influence depends on:  
       - Heterogeneous electoral exposure (e.g., P5’s +50 made it a dismissal ally in C).  
       - The caretaker/default policy (Z as a moderate option enabled compromise).  

  3. **Connect to Real Institutions**:  
     - **A ≈ Parliamentary**: Removal possible but costly (election).  
     - **B ≈ Presidential**: No removal; override requires supermajority.  
     - **C ≈ Semi-Presidential**: Costless dismissal but constrained caretaker.  

  ---

  ### **Predictable Problems and Fixes**  
  1. **Personality Contest**:  
     - *Problem*: Students ignore payoffs, vote based on likability.  
     - *Fix*: Remind them: "You are rational parties; maximize your payoff. Exposure matters!"  

  2. **Failed Coalitions**:  
     - *Problem*: Parties deadlock in negotiation.  
     - *Fix*: Announce time warnings. Suggest: "Form the smallest majority coalition."  

  3. **Executive Dominance/Ignorance**:  
     - *Problem*: Executive overrules assembly, or assembly ignores executive.  
     - *Fix*: Clarify rules: "The executive proposes policy, but assembly has veto/dismissal power."  

  4. **Election Never Triggered**:  
     - *Problem*: No one risks removal in A.  
     - *Fix*: In debrief, contrast with C: "Why was dismissal rare in A but common in C? Hint: Check P3’s exposure."  

  ---

  ### **What the Simulation Cannot Reproduce**  
  1. **Dynamic Accountability**: Real executives face continuous confidence threats (not one-off votes).  
  2. **Popular Mandate**: Separately elected executives (B/C) have legitimacy from voters, not just assembly.  
  3. **Election Effects**: Real elections change seat distributions; here, exposure only shifts payoffs.  
  4. **Caretaker Flexibility**: Real caretakers negotiate policies; ours is fixed (Z).  
  5. **Long-Term Strategies**: Students focus on single rounds, not reelection or reputation.  

  **Post-Simulation Notes for Lecture**:  
  - Emphasize that real-world institutions embed **long-term incentives** (e.g., parties avoid dismissal to preserve reputation).  
  - Highlight how **electoral systems** (not just executive-legislative rules) shape exposure (e.g., majoritarian vs. proportional systems).  
  - Discuss why mutual-destruction rules (A) often stabilize governments, but costless dismissal (C) can induce instability.  

  ---

  ### **Materials for Students**  
  - **Cards**: Labeled "Party [1–5] – Policy Payoffs and Electoral Exposure" (no institutional terms).  
  - **Rules Handout**: Use only "Regime A/B/C" and neutral terms (e.g., "executive," "assembly," "dismissal," "election").  
  - **Amendment Template**: "Proposed change: [One sentence]. Rationale: [How it helps us]."  

  This design ensures students *experience* why constitutional rules’ incentive effects depend on hidden variables (exposure, dismissal costs), setting up your debrief to unpack the presidential/parliamentary/semi-presidential divide.
