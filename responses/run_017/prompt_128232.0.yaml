     The design with the original numbers shows that in A and C the assembly can achieve the policy they want (Z) while in B they cannot. This supports the monotonicity (B has less assembly influence than A and C). But it does not distinguish between A and C.

     To break the monotonicity, we need a scenario where in A the assembly is unable to achieve the policy they want, but in C they can. 

     How about this: in Regime A, the only viable coalition is one that chooses an executive that implements a policy that is not Z. For example, if we make P3's payoff for Z only 60 (instead of 100) and make P3's exposure -40, then in the coalition P2, P3, P4:

          If they choose P3: policy Z -> P2:30, P3:60, P4:70 -> total 160.
          If they choose P2: policy Y -> P2:100, P3:50, P4:40 -> total 190 -> better.

