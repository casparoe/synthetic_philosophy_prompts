     And then we can make the point that the influence of the assembly is not simply about having the power to remove, but about the cost of removal.

     So the design with the first set of numbers is:

     Party sizes: P1:5, P2:5, P3:5, P4:4, P5:5 -> sum 24.

     Payoffs:

          Policy X: P1:100, P2:0, P3:50, P4:30, P5:20
          Policy Y: P1:0, P2:100, P3:50, P4:40, P5:60
          Policy Z: P1:30, P2:30, P3:100, P4:70, P5:0

     Electoral exposure:

          P1: -30
          P2: -40
          P3: +20
          P4: -10
          P5: +50

     Regime A: 
          - Executive elected by assembly majority (13 votes) of the whole assembly (each party has block votes equal to its size). 
          - The elected executive chooses a policy.
          - Then the assembly can vote to remove the executive (simple majority of the assembly, 13 votes). 
          - If removed, then the round ends and each party gets only their electoral exposure (added to 0? or to what? We haven't implemented any policy). We'll say: if removed, no policy is implemented and each party gets their electoral exposure as their payoff for the round.
          - If not removed, then the policy is implemented and each party gets their policy payoff.

     Regime B:
          - Executive elected by a separate vote of the students: each student votes for one candidate, and the candidate with the most votes wins (plurality). 
          - The executive chooses a policy.
          - The assembly can try to override the policy by a 2/3 majority (16 votes). 
          - If overridden, then no policy is implemented and everyone gets 0.
          - If not overridden, the policy is implemented.

     Regime C:
          - Executive elected by the same separate vote as B.
          - The executive chooses a policy.
          - The assembly can vote to dismiss the executive by simple majority (13 votes). 
          - If dismissed, the caretaker takes over and implements policy Z (and then the policy Z payoffs are given).
          - If not dismissed, the executive's policy is implemented.

     Timeline for 90 minutes:

        0:00-0:10 (10 min): Introduction and setup. 
            - Divide students into 5 parties: P1 (5), P2 (5), P3 (5), P4 (4), P5 (5). 
            - Hand each party a card with their payoff schedule and electoral exposure (private).

        0:10-0:15 (5 min): Explain Regime A rules.

        0:15-0:25 (10 min): Regime A: 
            - Parties negotiate to form a coalition and elect an executive (5 min).
            - Vote for executive: each party casts its block votes. If no majority, then 2 min to renegotiate and revote until one candidate has 13.
            - The elected executive announces the policy.
            - Assembly votes on whether to remove the executive (2 min). 
            - If removed, apply exposure payoffs. If not, apply policy payoffs.

        0:25-0:30 (5 min): Record outcomes and reset.

        0:30-0:35 (5 min): Explain Regime B rules.

        0:35-0:45 (10 min): Regime B:
            - Nominate candidates (each party may nominate one).
            - Each student votes for one candidate (1 min voting).
            - Count votes and announce executive (1 min).
            - Executive announces policy.
            - Assembly votes on override (2 min): need 16 votes.
            - Apply outcome.

        0:45-0:50 (5 min): Record outcomes and reset.

        0:50-0:55 (5 min): Explain Regime C rules.

        0:55-1:05 (10 min): Regime C:
            - Same as B for electing executive.
            - Executive announces policy.
            - Assembly votes on dismissal (2 min): 13 votes needed.
            - If dismissed, caretaker policy Z is implemented.
            - If not, executive's policy.

        1:05-1:15 (10 min): Each party drafts a constitutional amendment.

        1:15-1:25 (10 min): Cluster amendments on the board and discuss.

        1:25-1:40 (15 min): Debrief.

        1:40-1:45 (5 min): Wrap-up.

     What might go wrong:

       1. Students treating it as a personality contest: Encourage them to focus on payoffs. The instructor can remind them that they are to maximize their own party's payoff.

       2. Parties failing to coalesce in the time allowed: The instructor can facilitate by reminding them of the time and suggesting they look for the coalition that gives the highest total payoff.

       3. The executive player being either ignored or allowed to dominate: In the negotiation phase, the instructor can circulate and ensure that each party is represented.

       4. The election mechanic never being triggered: In the design, it might be rare in A. We can try to induce it by having a party with high exposure and low policy payoff. But if it doesn't happen, we can discuss in the debrief why the threat of election deterred removal.

     What the simulation cannot reproduce:

       - In real presidential systems, the executive is elected by the people and has a mandate. Here, in B and C, the executive is elected by the students in a quick vote, which may not reflect a real popular vote.

       - In real parliamentary systems, the government is not only elected by the assembly but also depends on the assembly's confidence continuously. We only had one confidence vote.

       - We did not model the effect of elections on seat distribution.

       - We assumed that the caretaker is a fixed policy, but in reality, caretakers might be more flexible.

     And now, the constitutional amendment part: each party drafts a one-line amendment. We expect that some parties will want to change the removal rules, the election trigger, or the override threshold.

     We hope to see two families:

       - One family: amendments that change the cost of removal (e.g., "removing the executive should not trigger an election", or "removal should require a supermajority to avoid elections").

       - Another family: amendments that change how the executive is selected (e.g., "the executive should be elected by the assembly", or "the executive should be elected by popular vote").

     This maps to the two variables: (1) whether the executive is separately elected, and (2) whether the executive's tenure depends on assembly confidence and what the cost of removal is.

     The debrief should highlight that the key variable is not just who can dismiss whom, but what are the consequences of dismissal.

     Now, let's honestly answer: in our design with the first set of numbers, the outcomes were:

          A: Z
          B: X
          C: Z

     So the assembly was able to achieve the same outcome in A and C, which is their preferred outcome (by the majority). Therefore, the influence of the assembly was lower in B than in A and C, but we did not have a difference between A and C. So the prediction that influence is B < A < C did not hold because A and C had the same influence in terms of policy outcome.

     However, we designed a scenario in the second set of numbers (which we can use if we have time) where:

          A: Y
          B: X
          C: Z

     and then the majority might prefer either A or C depending on the payoffs.

     Given the instructions, I provide the first design for simplicity.

     But to have a more interesting debrief, I will provide the second design in the actual materials.

     Revised payoffs and exposures for the second design:

     Party sizes: 
          P1:6, P2:5, P3:5, P4:4, P5:4

     Payoffs:
          X: P1:100, P2:0, P3:50, P4:30, P5:20
          Y: P1:0, P2:100, P3:40, P4:30, P5:60   [changed P3 to 40, P4 to 30]
          Z: P1:30, P2:30, P3:60, P4:70, P5:0    [changed P3 to 60]

     Electoral exposure:
          P1: -30
          P2: -40
          P3: -40   [changed to negative and large]
          P4: -10
          P5: +50

     Caretaker policy: Z.

     In this design, we hope:

          Regime A: 
            The viable coalitions:
               P2+P3+P4: 5+5+4=14 -> can elect.
               If they elect P2: policy Y -> P2:100, P3:40, P4:30 -> total 170.
               If they elect P3: policy Z -> P2:30, P3:60, P4:70 -> total 160.
               So they choose P2 and Y.
            Then removal vote: 
               P3 gets 40 in Y, but exposure -40: removal gives -40? which is worse, so they won't remove.
            So outcome: Y.

          Regime B:
            P1 wins executive (6 votes). Chooses X.
            Override: need 16 votes.
               Votes against X: P2, P3, P4, P5: 5+5+4+4=18 -> can override.
            But do they want to? 
               Without override: 
                   P1:100, P2:0, P3:50, P4:30, P5:20.
               With override: 0.
               P2: 0 vs 0 -> indifferent.
               P3: 50 vs 0 -> prefer not to.
               P4: 30 vs 0 -> prefer not.
               P5: 20 vs 0 -> prefer not.
            So override fails. Outcome: X.

          Regime C:
            P1 wins. Chooses X.
            Dismissal vote: 
               Without dismissal: X -> P1:100, P2:0, P3:50, P4:30, P5:20.
               With dismissal: Z -> P1:30, P2:30, P3:60, P4:70, P5:0.
               Compare:
                   P1: 100 vs 30 -> against dismissal.
                   P2: 0 vs 30 -> for.
                   P3: 50 vs 60 -> for.
                   P4: 30 vs 70 -> for.
                   P5: 20 vs 0 -> against.
               For: P2, P3, P4 -> 5+5+4=14 -> dismiss.
            Outcome: Z.

     So policy outcomes:

          A: Y
          B: X
          C: Z

     Now, for the majority P2, P3, P4:

          A: P2:100, P3:40, P4:30 -> sum 170.
          B: P2:0, P3:50, P4:30 -> sum 80.
          C: P2:30, P3:60, P4:70 -> sum 160.

     So they prefer A over C over B.

     For P1: A:0, B:100, C:30 -> prefers B.
     For P5: A:60, B:20, C:0 -> prefers A.

     So the assembly's ability to achieve the policy outcome they prefer is best in A, then C, then B.

     This fits the monotonicity: B < C < A.

     But note: the prediction was B < A < C. In our outcome, we have B < C < A, so it fails the prediction.

     Why? In regime A, the assembly could achieve Y (which is the best for the majority coalition), while in C, they could only achieve Z (which is not as good). In C, they could not achieve Y because the caretaker only does Z.

     So the mutual-destruction rule in A (removal triggers an election) did not in fact deter the formation of a coalition that implemented Y, because the parties in the coalition (P2, P3, P4) were not willing to remove the executive they elected (P2) because their exposure was negative (and the policy was acceptable). In C, the majority could remove and get Z, which is better than X but worse than Y.

     Therefore, the simulation shows that the assembly might have more influence in A than in C.

     The feature that breaks the prediction is the fact that in A, the assembly could elect an executive that implemented their most preferred policy (Y) and then did not remove it, while in C, the separately elected executive implemented X, and the assembly could only replace it with Z, not with Y.

     For the prediction to hold (B < A < C), we would need a scenario where in A the assembly is constrained by the election threat and cannot achieve their most preferred policy, while in C they can achieve it.

     But in our design, they achieved it in A.

     Nonetheless, the exercise shows that the influence is not monotonic in the simple way if we consider policy outcomes.

     In the debrief, we can highlight:

          - The two variables: (1) how the executive is selected, and (2) the conditions under which the executive can be removed and the consequences.

          - In A, the executive is selected by the assembly and removal triggers an election. This makes the executive more accountable to the assembly, but the threat of election might deter removal even if the policy is not the best possible.

          - In C, the executive is separately selected and removal does not trigger an election, so the assembly can remove more easily, but they can only replace with a fixed caretaker policy.

     Finally, the constitutional amendments:

          We expect parties to propose changes such as:

            P1 (who does well in B): might propose to make the executive separately elected and unremovable (like B).

            P2 (who does well in A): might propose to have the executive elected by the assembly and removable only with a supermajority (to avoid elections).

            P3 (who does better in C than in B but worse than in A): might propose to allow removal without election and with the possibility to choose the caretaker policy.

            P4: similarly.

            P5: does best in A, so might propose to have the executive elected by the assembly.

     But they might also propose on the removal consequences.

     The two families:

          - Selection method: assembly election vs popular election.

          - Removal consequences: whether it triggers an election and what the threshold is.

     We hope to see that the amendments cluster into these two dimensions.

     Given the complexity, this design should work.
