prompt: |-
  I co-edit a small end-of-term zine for the social choice reading group I help run — half of us are from economics, half from political theory — and a friend who works in DAO governance tooling keeps sending me her industry's marketing copy, which has become a running joke: every platform on earth advertises itself, in one phrasing or another, as immune to strategic voting. For the last issue I want a piece of satire built out of that joke, and I want the joke to come from getting the result right rather than from name-dropping it.

  The piece: a leaked internal compliance memo — 700 to 900 words, deadpan corporate register, memo header (To / From / Date / Re) and numbered sections — written by the compliance team of a fictional governance platform called Sincere ("Vote your true preferences. We handle the rest," as the letterhead has it), in response to a marketing landing page that already shipped the claim that the platform is provably strategy-proof. Assume the audience: the theorem in question is the one Allan Gibbard proved in 1973 and Mark Satterthwaite independently in 1975 — any deterministic rule that takes voters' ordinal rankings, returns a single winner, and can produce three or more different outcomes is manipulable unless it is dictatorial — together with the later extension to rules that may randomise, and the known fact that on single-peaked domains there is a well-behaved non-dictatorial option (the median rule). Also assume what the definition does not cover: only one voter at a time is imagined to misreport, only ordinal rankings are transmitted, and nothing in the guarantee speaks to coalitions, to intensity, or to how the alternatives got onto the ballot. Section 1 should explain, in compliance-speak, why marketing's sentence cannot ship as written; Section 2 should set out the three "Compliance Modes" the team has available — I'll leave the codenames to you, but I have in mind something like a delegated-outcome mode where one ballot is drawn and recorded as the result, an agenda-pairing mode where every proposal is resolved between two pre-selected options, and a domain-restriction mode where members must attest that their preferences are single-peaked along an official Axis the company publishes — each with proposed customer-facing language; Section 3 should recommend one of them and say why the others test badly in focus groups; Section 4 should be residual risks, filed as reputational rather than mathematical. Two constraints. First: nobody in the memo may use the word "dictator" in any text a customer could see — the comedy is in the euphemisms they invent instead ("founder's resolution authority," "single-wallet determination," and so on). Second: the memo's last sentence should be flat, procedural, and genuinely chilly — the moment the reader notices that a platform that can honestly call itself strategy-proof has quietly stopped selling voting. No real companies, no real named people, no footnotes, no winking at the reader.

  After the memo, add a structured summary as a single JSON object with this schema: {"modes": [{"mode_name": the internal codename, "condition_relaxed": which premise of the result the mode gives up — a range of at least three possible outcomes, non-dictatorship, or deterministic single-winner resolution, "theorem_licensing_it": which result makes the mode genuinely strategy-proof — the 1973/1975 theorem, its extension to randomised rules, or the single-peaked median-voter results, "marketing_euphemism": the exact phrase the memo proposes, "what_a_customer_hears": one sentence, "what_it_actually_means": one sentence, blunt}], "silences_exploited": up to five short strings naming features of a real election that strategy-proofness as defined does not regulate — agenda control, coalitional misreports, cardinal intensity, where the preferences came from, whether the winner is any good, "recommended_mode": the codename of the mode Section 3 recommends, "bottom_line": one sentence on why an honestly strategy-proof system with three or more options is not obviously something anyone should want to buy}.
reasoning: |-
  We are writing a satirical internal compliance memo for a fictional governance platform called "Sincere". The memo is in response to a marketing claim that the platform is "provably strategy-proof". The memo will be in a deadpan corporate register, with a header and numbered sections. We must avoid the word "dictator" in any customer-facing text, instead using euphemisms. The memo should have four sections:

  1. Explain why the marketing claim cannot ship as written (due to the Gibbard-Satterthwaite theorem and its extensions).
  2. Present three "Compliance Modes" with internal codenames, each relaxing a different condition of the theorem, and propose customer-facing language for each.
  3. Recommend one mode and explain why the others test badly in focus groups.
  4. List residual risks (reputational, not mathematical).

  After the memo, we must provide a JSON summary with the specified structure.

  Let's plan the memo:

  **Header:**
  To: Marketing Team
  From: Compliance Department
  Date: [Current date in a formal format, e.g., 2023-11-15]
  Re: Compliance Review of Marketing Claim for Sincere Platform: "Provably Strategy-Proof"

  **Section 1: Compliance Assessment of Current Marketing Claim**
  - State that the claim "provably strategy-proof" as currently written cannot be used because it is mathematically impossible under general conditions (without being dictatorial, which we won't say directly). We can refer to the Gibbard-Satterthwaite theorem and note that it applies to any system that allows three or more outcomes and is non-dictatorial and deterministic. We must avoid the word "dictator", so we might say "unless the system is designed to rely on a single designated decision-maker" or something similar.

  **Section 2: Proposed Compliance Modes**
  We need three modes, each relaxing one condition:

  1. **Mode that relaxes "deterministic single-winner resolution"** (i.e., use randomization). This would be covered by the extension to randomized rules. We can call it "Randomized Outcome Selection" (internal codename: RANDOM-SELECT). Customer-facing: We might say "Our system uses a verified random process to select one ballot as the decision, ensuring that truthful voting is always your best strategy."

  2. **Mode that relaxes "range of at least three possible outcomes"** (i.e., reduce to two options). This would be covered by the fact that for two alternatives, majority rule is strategy-proof. We can call it "Binary Decision Framework" (internal codename: BINARY-PAIR). Customer-facing: "Sincere ensures integrity by structuring every decision as a choice between two pre-vetted alternatives, eliminating the possibility of strategic voting."

  3. **Mode that relaxes the domain (by requiring single-peaked preferences)** (i.e., domain restriction). This would be covered by the median voter theorem. We can call it "Aligned Preference Assurance" (internal codename: ALIGNED-PREF). Customer-facing: "By requiring voters to align their preferences along a clear, published Axis, Sincere guarantees that the median preference is found without manipulation."

  **Section 3: Recommendation**
  We recommend one of these modes. Let's say we recommend the BINARY-PAIR mode because the others might test badly in focus groups:
  - RANDOM-SELECT: Focus groups found that customers are uncomfortable with the idea of randomness in governance, fearing it is "flippant" or "arbitrary".
  - ALIGNED-PREF: Focus groups expressed concern about the complexity of attesting to single-peakedness and the restriction on expressing their true preferences if they are not single-peaked (which they might not understand). Also, the idea of an "official Axis" might be seen as too controlling.
  - BINARY-PAIR: This tests well because it is simple and familiar (like a referendum). However, we note that it doesn't cover how the two options are chosen (agenda control) but that's a residual risk.

  **Section 4: Residual Risks**
  Even with the recommended mode, there are reputational risks:
  - The system does not prevent strategic behavior by groups (coalitions).
  - The system does not account for the intensity of preferences (only ordinal rankings).
  - The system does not regulate how the alternatives are chosen (agenda control).
  - The system does not guarantee that the winner is the best outcome, only that it is strategy-proof under the conditions.
  - The system might be seen as too restrictive (only two options) and thus not suitable for complex decisions.

  **Last Sentence:** Must be flat, procedural, and chilly. Example: "Upon implementation of the recommended mode, the platform will no longer support voting on more than two alternatives per proposal, and all existing multi-option ballots will be archived without resolution."

  Now, for the JSON summary:

