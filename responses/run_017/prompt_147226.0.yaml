        "what_a_customer_hears": "You must order your preferences along a company-defined line.",
        "what_it_actually_means": "Voters must pretend to have preferences that are single-peaked on an axis chosen by the company, or else the system won't work."
      }
    ],
    "silences_exploited": [
      "agenda control",
      "coalitional misreports",
      "cardinal intensity",
      "where the preferences came from",
      "whether the winner is any good"
    ],
    "recommended_mode": "BINARY-PAIR",
    "bottom_line": "An honestly strategy-proof system with three or more options is dictatorial, and even with two options, it does not address how the options were chosen or other forms of manipulation."
  }
