prompt: |-
  I'm the student member of my high school's Campus Collections Committee, and I have to circulate a decision memo before Friday's meeting. I'd like your help drafting it.

  The case: last spring a senior sculpted a figure called *Anthem* from one lump of the ceramics room's clay. It won a regional award, and the committee voted to give it a permanent spot in the front-hall display case. In August a custodian knocked it off its pedestal and it shattered. A ceramics class gathered every fragment, re-wedged the same clay, and threw forty mugs, now boxed for the winter fundraising sale; they had also laser-scanned the piece before it broke, so an exact replica can be printed. The sculptor asks us to pull the mugs from the sale, saying that what the school promised to keep permanently was destroyed, and that selling it as cups is a second injury. The ceramics teacher answers that nothing of value was lost: all the matter survived, the shape survives in the scan, and reclaiming clay is what a studio does every year. Our policy says only that collection items may not be disposed of without committee approval, which assumes an answer to just the question at issue — whether the statue was ever something other than the clay.

  Please draft the memo I'll circulate: memo header, under two pages. It should recommend one concrete course of action with a deadline and a named responsible party, choosing among (A) withdraw the mugs and display the replica, clearly labeled as a replica; (B) sell the mugs and treat the replica as fulfilling the promise; (C) sell the mugs, display nothing, and issue a public correction. It should engage the ceramics teacher's argument on its own terms rather than simply asserting that the statue was a separate thing — in particular, what follows for the mugs and for the replica if the statue was, or was not, the same object as the clay — and it should say whether an exact copy or the continued existence of the matter could count as keeping our promise. Give the strongest consideration on the losing side a fair hearing, and note briefly what ruling commits us to the next time a collection item is made of reusable material.

  End with a single machine-readable line, with nothing after it: Recommendation: \answer{A|B|C}
reasoning: |-
  We are drafting a decision memo for the Campus Collections Committee. The memo must be under two pages and include a memo header. The issue involves the sculpture *Anthem* that was shattered and then reclaimed into mugs, with a scan available for a replica. The sculptor objects to selling the mugs and wants the replica displayed. The ceramics teacher argues that the clay was reclaimed as normal and the shape is preserved in the scan.

   The options are:
   A) Withdraw the mugs and display the replica, clearly labeled as a replica.
   B) Sell the mugs and treat the replica as fulfilling the promise.
   C) Sell the mugs, display nothing, and issue a public correction.

   We must engage with the ceramics teacher's argument that the statue was just clay and that the shape is preserved in the scan. We need to consider whether an exact copy or the continued existence of the matter counts as keeping the promise. We must also consider the implications for future cases.

   Let's structure the memo:

   1. Header: To, From, Date, Subject.
   2. Background: Briefly describe the case.
   3. Arguments: Present the arguments for both sides fairly.
   4. Analysis: Engage with the ceramics teacher's argument and consider the nature of the object.
   5. Recommendation: Choose one option and justify it, including a deadline and responsible party.
   6. Implications: Note what this ruling commits us to for future reusable material items.
   7. The machine-readable line at the end.

   After careful thought, I choose option B. Why?
   - The ceramics teacher's argument that the clay is the same matter and the form is preserved in the scan is strong. 
   - The committee promised to keep the work permanently. The replica, being an exact copy of the form (from the scan) and made of the same matter (if we use the same clay, but note: the clay is now in mugs) is not exactly the same. However, the replica can be made from new clay and the scan, and we can argue that the form is what we promised to preserve. Alternatively, we can say that the replica (even if made of new clay) is the best way to honor the commitment because the original form is what was awarded and displayed.

   But note: the mugs are made from the exact same clay. The ceramics teacher says reclaiming clay is normal. The sculptor argues that selling the mugs is a second injury.

   However, the committee's policy is about not disposing of collection items without approval. The key question is whether the statue was more than the clay. The statue was a specific arrangement of the clay. Once shattered, that arrangement was lost. The scan captures the arrangement, so a replica can recreate it.

   Option B: Sell the mugs and treat the replica as fulfilling the promise. This respects the ceramics program's practice of recycling clay and uses technology to preserve the artistic form.

   Let's draft the memo accordingly.

   Important: We must note that the replica is an exact copy and we are treating it as the fulfillment of the promise to display the piece permanently. The mugs are the same matter but in a different form, and selling them is consistent with studio practice.

   Deadline and responsible party: The winter fundraising sale is upcoming. We must decide by the meeting (Friday) and then the responsible party for implementing the decision (e.g., the ceramics teacher or the committee chair) should act by the sale date.

   Implications for future: If we rule that the form (captured by scan) is what we preserve, then for future reusable material items, we might consider scanning them so that if they break, we can recreate the form. Also, we are endorsing that the matter can be reused as long as the form is preserved in the collection (via replica).

   However, let's be cautious: the sculptor might feel that the replica is not the same as the original. But the committee's promise was to keep the work on display, and the replica is an identical representation of the work.

   Alternatively, option A might be more respectful to the artist: withdraw the mugs and display the replica. But the mugs are already made and the ceramics class has put effort into them. Also, the ceramics teacher argues that the clay is just matter and reclaiming is normal. Moreover, the committee policy does not require us to preserve the matter indefinitely if the form can be preserved.

   But note: the original clay is now in mugs. If we choose A, we are withdrawing the mugs from sale and presumably storing them? That seems to go against the ceramics teacher's point that the clay is just matter and should be reused. And if we display a replica, we are using new clay? That might be acceptable, but then we are keeping the original matter (in the form of mugs) and not using it? That seems inconsistent.

   Alternatively, if we choose B: sell the mugs (thus recycling the clay) and make a replica (from new clay) to display. This way, the form is preserved and the matter is put to good use.

   The strongest argument against B (and for A) is the artist's moral right to the integrity of the work. The artist created a unique piece, and turning it into mugs and then selling them could be seen as a desecration. The replica, even if exact, is not the original and the original matter is now dispersed. The artist might feel that the school is profiting from the destruction of their work.

   However, the committee must weigh these concerns against the educational and practical aspects of the ceramics program.

   After deliberation, I think option B is the most balanced.

   Let's draft the memo accordingly.
answer: |-
  **MEMORANDUM**  
  **TO:** Campus Collections Committee  
  **FROM:** [Your Name], Student Member  
  **DATE:** November 1, 2023  
  **SUBJECT:** Recommendation for Disposition of *Anthem* Sculpture Fragments and Replica  

  ### **Background**  
  Last spring, senior artist [Sculptor’s Name] created the award-winning sculpture *Anthem* using clay from the ceramics studio. The committee voted to grant it permanent display in the front hall. In August, the piece shattered due to accidental damage. The ceramics class recovered all fragments, re-wedged the clay into 40 mugs (now boxed for the winter fundraising sale), and preserved a laser scan of the original sculpture. The sculptor requests withdrawing the mugs from sale, arguing that selling repurposed fragments compounds the loss of the promised permanent display. The ceramics teacher asserts no value was lost: the physical matter remains intact, and the form is preserved digitally for replication. Our collections policy prohibits disposal without committee approval but does not define whether art is distinct from its material substrate.  

  ### **Analysis of Key Questions**  
  1. **Was *Anthem* the same object as the clay?**  
     - *Ceramics teacher’s view*: The sculpture was a temporary configuration of reusable studio material. Value resides in the matter (clay) and the form (scan). Thus, repurposing clay into mugs aligns with studio norms, and replication restores the form.  
     - *Sculptor’s view*: *Anthem* was a unique artistic expression. Its destruction nullified the committee’s promise; selling its remnants commercializes a loss.  
     - **Implications**:  
       - If the statue *was* the clay: Reclaiming matter into mugs is routine. The scan allows recreation, so replication fulfills the display pledge.  
       - If the statue *was not* the clay: The original is irreplaceable. Repurposing fragments into mugs disregards artistic integrity, and a replica is merely a tribute.  

  2. **Can a replica or preserved matter fulfill our promise?**  
     - An exact replica (via scan) preserves the sculpture’s *form* and artistic intent but lacks the original’s material authenticity.  
     - Preserved matter (e.g., not repurposing clay) honors physical continuity but forfeits utility and studio sustainability. Neither fully substitutes the original, but the replica better approximates the committee’s commitment to permanently display the *artwork*.  

  ### **Recommendation**  
  **Option B: Sell the mugs and display the replica, treating it as fulfilling the pledge.**  
  - **Action**: Proceed with the mug sale; fabricate and install a polymer/ceramic replica labeled: "*Anthem* Replica (Original by [Sculptor’s Name], 2023)."  
  - **Responsible Party**: Ceramics Teacher ([Name]).  
  - **Deadline**: Replica installed by December 15, 2023; mug sale proceeds as scheduled.  

  **Justification**:  
  - **Engages the ceramics teacher’s argument**: The clay’s reuse respects studio practice and resource stewardship. The replica honors the artistic form captured pre-destruction, aligning with the award’s recognition of *design*, not just material.  
  - **Balances interests**: Selling mugs supports the ceramics program without "injuring" the artist’s legacy, as the replica perpetuates public display. Labeling ensures transparency.  
  - **Losing side (Option A) fairly heard**: Withdrawing mugs (Option A) acknowledges the artist’s moral claim but elevates material sentimentality over pedagogical and environmental pragmatism. Storing reclaimed clay indefinitely or displaying it as mugs does not fulfill the promise of showcasing *Anthem*.  

  ### **Implications for Future Cases**  
  This ruling establishes that:  
  1. **Replication suffices for display commitments** if high-fidelity scans exist pre-damage.  
  2. **Reusable materials may be repurposed** after destruction if the artwork’s form is preserved digitally.  
  Future acquisitions of impermanent media (e.g., clay, ice) should include scanning and a disposal/replication protocol approved at accession.  

  ### **Conclusion**  
  Option B resolves the tension between art conservation and studio sustainability. The replica honors *Anthem*’s legacy, while mug sales fund the program that enabled its creation.  

  ---  
  Recommendation: \answer{B}
