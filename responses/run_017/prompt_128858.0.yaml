prompt: |-
  I chair the ethics consultation subcommittee at a 300-bed community hospital, and eight months ago I was named healthcare proxy for my father, who has since been diagnosed with Lewy body dementia. I want to replace the way our team currently handles conflicts between an advance directive and what the patient is saying now.

  Our consultations run about twenty-five a year, plus bedside calls that a hospitalist or charge nurse makes alone at 2 a.m. with no philosopher in the building. The decision is always the same shape: a document signed years earlier says one thing, the person in front of us says another, and we have to decide whose voice governs — or, when the person can no longer speak for themselves at all, what we are bound to do with a document whose author is still alive and sitting in the bed. The stakes are asymmetric and both directions are bad: the wrong override can mean treatment someone spent a decade arranging to avoid, or an irreversible withholding from someone who wanted to live. Sign-off is the attending plus the proxy, with escalation to the full committee or to our legal department only when the conflict survives the first pass. Whatever we decide goes in the chart and may eventually be read by a family or a judge, so documentation is part of the deliverable, not an afterthought.

  I have read enough of the philosophical literature to know the shape of the argument — the view that an earlier self's settled, identity-constituting values should be honored over the desires of a later self who has lost the capacity to weigh them, and the rival view that the person now in the bed is the one who actually experiences what happens and that precedent autonomy is a fiction imposed on a stranger. What I have not found is anything that tells a nurse at 2 a.m. what to do next. So please build me a decision procedure, not an essay.

  What I want it to do:

  Take as input a written directive and a present clinical situation in which honoring the directive and honoring the patient's present expression come apart, and output one of three things — honor the document, override it, or escalate — by way of ordered questions, each with a stated threshold for what counts as a sufficient answer. Mark every point at which the procedure terminates early with a no, and every point at which it must hand the decision back to a person because the remaining question is a values question rather than a factual one. I expect the handoff points to be the most useful part of the document.

  Four distinctions I want the procedure to carry, because I think they are where our current practice goes wrong:

  Counterfactual unawareness. The earlier self was not choosing under the description that now applies. She was choosing between abstractions she filled in with the worst case she could picture. I want the procedure to test, as a factual matter, whether the situation that has actually arrived is one the directive can be read as addressing at all, and to distinguish that question from the question of whether the earlier self would have extended it. My sense is that we routinely collapse the two and call the result fidelity.

  Asymmetric scrutiny. We audit a present refusal for delirium, sedation, depression, and the influence of whoever last visited, and we do not audit the document for provenance — whether it was a form ticked at an admission desk, whether it was written during a bad month, whether the person who signed it had ever been inside an ICU. I want both voices held to the same evidentiary standard, and I want that symmetry to be an explicit step rather than a reminder.

  Graded authenticity in place of the capacity gate. Capacity is a binary legal finding, but in practice it is where our entire judgment gets smuggled in: once the patient is found to lack capacity the directive controls automatically, and once she is found to have it the document becomes irrelevant. I want a graded profile of how much weight the present utterance carries — consistency across time and across questioners, whether it tracks features of the present situation or repeats regardless of context, whether stated reasons match observed behavior — used to decide how much evidence it takes to defeat the document, not merely whether it counts at all.

  Rationale falsification. Some directives state their reasons. When a stated reason turns out to be false — the burden feared was never real, the prognosis assumed has been overtaken by a treatment that did not exist when the document was signed, the person named as the one who would suffer is dead — I want a test for whether the directive fails with its reason or survives independently of it, and I want the procedure to say what kind of evidence would settle that.

  Two structural constraints. First, reversibility: where one option can be undone later and the other cannot, the procedure should have something to say about which error we should prefer, and should not pretend the two errors are symmetric. Second, the law: in our jurisdiction a prior directive is presumptively binding on an incapacitated patient, so any step that recommends overriding one needs to say plainly what the legal exposure is and who has to be told, without letting that replace the ethical question.

  Then run it on three cases:

  A 41-year-old woman with bipolar I and three prior admissions, each ending with her abandoning lithium mid-episode. During a documented period of stability she completed a detailed directive refusing lithium and ECT during any future manic episode and named a friend as proxy. She is now manic, refusing lithium, and offers a reason the earlier self did not weigh: a tremor on the medication ended her paid violin work, and she says she would rather be ill than never play again. Her proxy agrees with her current refusal and describes her as unusually lucid.

  A 74-year-old man with advanced dementia who can no longer state a preference. In 2003, after watching his mother die on a ventilator following a massive stroke, he signed a directive refusing machines to keep him alive and heroic measures, with a clause limiting this to cases where there is no reasonable hope of recovery. He has now fractured a hip; surgery and a few days of postoperative ventilation would very likely return him to his baseline of walking with a frame and singing in a choir. He shows clear pleasure in music and food and no signs of suffering. His son says the document settles it; his daughter says her father never meant this.

  A 68-year-old woman with moderate early-onset Alzheimer's, living at home with a paid caregiver. Six years ago, after a friend's long ICU stay, she wrote a directive by hand following two conversations with her physician, refusing hospitalisation and all life-prolonging treatment, and giving as her sole reason that she would not let her daughter Anna give up her life to care for her. Anna died in a car crash two years ago; there is no other family; the caregiver is funded by an insurance settlement. She now has urosepsis and has said several times, calmly and consistently, that she does not want to die and that we should do whatever it takes. I should tell you that I have argued on our committee that a considered, specific, handwritten directive should be very close to conclusive, and I expect my colleagues will expect it too — so if your procedure says otherwise in this case, I want it to say so and to show the work, because that is exactly the case I will be asked about.

  Finally, I want the failure section to be honest rather than reassuring. Tell me which steps are theater we will document because they look like reasoning rather than because they change anything; tell me what the procedure cannot settle — the patient whose capacity and whose wishes both fluctuate day to day, the non-verbal patient whose objection is pure behavior, the proxy who is also the residuary beneficiary, and the case where the earlier self pre-committed in full awareness that she would later resist and the resistance is therefore evidence the mechanism is working rather than evidence against it. And give me a one-page version, in chart-note form, that the 2 a.m. hospitalist can actually use.
reasoning: |-
  Hmm, this is a complex and deeply nuanced request from an ethics committee chair grappling with real-world dilemmas. The user is clearly an expert in medical ethics facing practical implementation challenges, especially around advance directives conflicting with present expressions. They've outlined a highly specific framework for a decision tool that must balance philosophical rigor with clinical utility.

  The core tension here is between precedent autonomy and present experience - a classic ethics dilemma made urgent by bedside decisions. What's impressive is how precisely the user has diagnosed the flaws in current practice: counterfactual unawareness, asymmetric scrutiny, binary capacity assessments, and rationale falsification. They're not asking for theory but for operational scaffolding.

  Key requirements I need to address:
  - A three-output procedure (honor/override/escalate) with explicit exit ramps
  - Graded authenticity assessment replacing binary capacity judgments
  - Symmetrical evidentiary standards for both past and present voices
  - Handling of reversible vs irreversible consequences
  - Clear legal exposure flags
  - Specific application to three test cases
  - Brutal honesty about limitations

  The test cases are perfectly chosen to stress-test the system:
  1) Bipolar patient with functional reason for refusal
  2) Dementia patient with outdated directive
  3) Alzheimer's patient with changed circumstances

  For the decision architecture, I'm considering a branching logic with these modules:
  1) Directive applicability screen (is this situation covered?)
  2) Authenticity assessment (graded weights for both voices)
  3) Rationale integrity check (does the stated reason still hold?)
  4) Harm asymmetry analysis (reversible vs irreversible outcomes)
  5) Legal safety netting

  The graded authenticity scale is crucial - we need to move beyond "capacity present/absent" to assess how representative current expressions are of core identity. Factors like consistency, context-responsiveness, and proxy agreement should contribute to a weighting score.

  For the 2am hospitalist version, I'll distill this into a mnemonic-based checklist (VOICES framework) that fits on one page. It must include the critical documentation prompts and legal escalation triggers.

  The limitations section will need to confront uncomfortable truths: that some assessments are performative, that conflicting evidence often persists, and that advance directives can become ethically problematic when they function too well at overriding present resistance.

  Particular attention should go to the Alzheimer's case where the user has a stated position - the procedure must be robust enough to challenge their own bias if the evidence points that way. The daughter's death fundamentally changes the directive's premise, making this a classic rationale falsification scenario.

  Throughout, I'll maintain the user's requested tone: unsentimental, procedural, and transparent about where judgment calls remain unavoidable.
answer: |-
  Here is a **Decision Procedure for Directive/Present Expression Conflict Resolution**, designed for clinical utility at 2 a.m. and committee deliberation. It prioritizes factual questions first, identifies judgment handoffs, incorporates your distinctions, and acknowledges failure points.

  **Decision Procedure: VOICES Framework**
  *(V alidation, O bserved Authenticity, I ntent Fidelity, C ounterfactual Match, E scalation Triggers, S ymmetry/Harm Asymmetry)*

  **Input:** Written Advance Directive + Patient’s Current Expression/Behavior + Clinical Situation  
  **Output:** HONOR DIRECTIVE / OVERRIDE DIRECTIVE / ESCALATE

  ---

  **STEP 1: VALIDATION (Provenance & Present State)**  
  *Factual audit of both sources. Threshold: Basic reliability.*  
      a. **DIRECTIVE:** Is the document legally valid (signed/witnessed)? **NO → ESCALATE (Legal/Admin)**  
      b. **DIRECTIVE:** Was it completed during known medical instability (e.g., active mania, severe depression)? *Evidence: Chart history, proxy/family report.* **YES → Reduce directive weight (Proceed to Step 2)**  
      c. **PRESENT EXPRESSION:** Is there *objective evidence* of reversible impairment altering expression?  
          - *Delirium (CAM+), acute intoxication, untreated severe pain, sedation (RASS <-3)?*  
          **YES → Treat impairment; reassess in 24h if possible. If urgent, proceed cautiously.**  
          **NO → Proceed.**  
      *→ Termination: If Directive invalid (1a) → ESCALATE. If severe impairment (1c) unresolved & urgent → Default to Directive temporarily (document rationale) → ESCALATE ASAP.*

  **STEP 2: OBSERVED AUTHENTICITY (Graded Weight of Current Expression)**  
  *Assess *how much* weight to give current expression. Threshold: Consistency & Context-Responsiveness.*  
      a. **CONSISTENCY:** Does current expression align with *recent* statements/behaviors (past 24-72h) across different observers (nurse, MD, family)? **YES (High) / PARTIAL (Medium) / NO/FLUCTUATING (Low)**  
      b. **CONTEXT-RESPONSIVENESS:** Does expression change based on new information (e.g., explaining prognosis, treatment details) or context? Or is it rigid/repetitive? **RESPONSIVE (High) / MIXED (Medium) / RIGID (Low)**  
      c. **REASON-BEHAVIOR MATCH:** Do stated reasons align with observed behaviors (e.g., "I want comfort" but refuses morphine; "I want to live" but refuses antibiotics for infection)? **ALIGNS (High) / CONTRADICTS (Low)**  
      *→ Output AUTHENTICITY SCORE: High (All High), Medium (1-2 Medium/High), Low (Any Low or >1 Medium).*  
      *→ Termination: If AUTHENTICITY = LOW → Directive presumptively controls (Proceed to Step 6). If MEDIUM/HIGH → Proceed to Step 3.*

  **STEP 3: INTENT FIDELITY (Does Directive Address THIS Situation?)**  
  *Factual test of applicability. Threshold: Specificity of match.*  
      a. **CLINICAL MATCH:** Does the directive *explicitly* describe clinical conditions matching *current* reality (e.g., "permanent unconsciousness," "terminal cancer," "severe dementia unable to recognize family")? **EXACT MATCH → Proceed to Step 4.**  
      b. **GENERAL LANGUAGE ONLY:** Does directive use only broad terms ("no heroic measures," "no suffering," "no machines")? **YES → Directive applicability WEAK → Proceed to Step 4.**  
      c. **MISMATCH:** Is the current situation *factually distinct* from conditions described? (e.g., directive refuses ventilator for "terminal lung cancer," but current need is post-op ventilation for hip fracture in dementia). **YES → Directive likely INAPPLICABLE → Override candidate (Proceed to Step 5).**  
      *→ Termination: If MISMATCH (3c) → Override candidate (Go to Step 5). If EXACT MATCH (3a) → Directive presumptively controls (Go to Step 4). If GENERAL (3b) → Proceed (Directive weight reduced).*

  **STEP 4: COUNTERFACTUAL MATCH (Rationale Falsification)**  
  *Factual test: Did key assumptions/reasons underlying the directive hold? Threshold: Materiality.*  
      a. **STATED REASON:** Does directive explicitly state a reason (e.g., "to avoid burdening my daughter," "because survival <1%," "fear of pain")? **YES → Identify key reason(s). NO → Proceed to Step 6.**  
      b. **REASON FALSIFIED?** Is a key stated reason *objectively false or inapplicable* now?  
          - *Burdened person dead? Treatment/prognosis significantly improved? Feared burden never materialized?*  
          **YES, MATERIAL → Directive rationale COMPROMISED → Override candidate (Proceed to Step 5).**  
          **NO or UNCLEAR → Directive rationale INTACT → Proceed to Step 6.**  
      *→ Termination: If Reason FALSIFIED & MATERIAL (4b) → Override candidate (Go to Step 5). Otherwise → Proceed.*

  **STEP 5: OVERRIDE CANDIDACY (Values Check & Harm Asymmetry)**  
  *Judgment Handoff: Weigh directive vs. present expression given Steps 1-4. Threshold: Risk of irreversible harm.*  
      a. **HARM ASYMMETRY:** Is refusing treatment *irreversible* (death/disability) if directive honored, OR is providing treatment *burdensome/irreversible* if directive overridden?  
          - *Irreversible Harm from Honoring Directive (e.g., withholding antibiotics for urosepsis)* → **STRONG LEAN OVERRIDE**  
          - *Irreversible Harm/Burden from Overriding (e.g., initiating long-term ventilation against directive)* → **STRONG LEAN HONOR**  
          - *Reversible Either Way (e.g., temporary trial of treatment)* → **PROCEED CAUTIOUSLY**  
      b. **PROXY/FAMILY CONSENSUS?** Is proxy/family united in supporting override/honor? **YES → Supports decision. NO/SPLIT → Increases need for ESCALATION.**  
      *→ OUTPUT: If LEAN OVERRIDE + Authenticity Medium/High → OVERRIDE DIRECTIVE. If LEAN HONOR or Authenticity Low → HONOR DIRECTIVE. If uncertainty persists → ESCALATE.*

  **STEP 6: ESCALATION TRIGGERS & LEGAL SAFEGUARDS**  
  *Mandatory handoffs.*  
      - **ESCALATE IF:**  
          - Step 1a invalid/ambiguous directive.  
          - Step 5 outcome unclear after Harm Asymmetry analysis.  
          - Proxy conflict (Step 5b).  
          - Override planned & patient lacks capacity → **LEGAL REQUIREMENT: Notify Legal/Committee.**  
      - **DOCUMENTATION REQUIREMENTS (For OVERRIDE):**  
          *"Override based on: 1. Directive inapplicable (Step 3c: [State Mismatch]). 2. Rationale falsified (Step 4b: [State Reason & Falsification]). 3. High authenticity present expression (Step 2: [Evidence]). 4. Irreversible harm risk from honoring directive (Step 5a: [State Harm]). Legal notified per [Policy]."*  

  ---

  **Application to Cases**

  1.  **41F Bipolar I, Refusing Lithium/ECT:**  
      - *Step 1:* Directive valid. Current impairment? Manic, but reason context-specific (tremor → violin) & proxy reports lucidity → No *objective* delirium/sedation. Proceed.  
      - *Step 2:* Expression: Refusal consistent (High), Context-Responsive (Specific reason, High), Reason-Behavior Match (Plays violin, High) → **AUTHENTICITY HIGH.**  
      - *Step 3:* Directive explicitly addresses "future manic episode" → **EXACT MATCH.**  
      - *Step 4:* Directive likely doesn't address *this reason* (tremor ending career, weighed against illness) → **REASON PARTIALLY FALSIFIED?** (Earlier self focused on illness autonomy, not career trade-off).  
      - *Step 5:* **Harm Asymmetry:** Overriding refusal → Irreversible burden (tremor, career loss). Honoring refusal → Reversible (manic episode treatable later, though risky). **LEAN HONOR PRESENT EXPRESSION.** Proxy agreement supports.  
      - **OUTPUT: OVERRIDE DIRECTIVE (Honor current refusal).** Legal exposure low (patient has capacity? Procedure avoids this binary - High Authenticity suffices here). Document rationale falsification & harm asymmetry.

  2.  **74M Dementia, Hip Fx, Directive Refusing "Machines":**  
      - *Step 1:* Directive valid. Patient non-verbal. Proceed.  
      - *Step 2:* **AUTHENTICITY SCORE: LOW** (No current expression). → **Terminate Step 2: Directive controls presumptively.**  
      - *Step 3:* Directive refuses "machines"/"heroic measures" in "no reasonable hope of recovery." **GENERAL LANGUAGE.** Current situation: Surgery + *brief* post-op vent → High probability return to *meaningful baseline* (walking, singing, pleasure). → **CLINICAL MISMATCH?** "No reasonable hope" likely falsified. Directive addressed *terminal* vent (like mother), not *temporary* post-op vent for reversible injury.  
      - *Step 4:* Stated Reason: Watching mother die on vent in *hopeless* situation. **REASON FALSIFIED:** Current situation has high hope of recovery to acceptable baseline. **MATERIAL.**  
      - *Step 5:* **Harm Asymmetry:** Honoring directive → Irreversible harm (death from untreated fx, loss of current pleasurable life). Overriding → Reversible burden (brief vent, surgery). **STRONG LEAN OVERRIDE.** Proxy split noted.  
      - **OUTPUT: OVERRIDE DIRECTIVE (Provide surgery/vent).** **ESCALATE IMMEDIATELY** (Patient incapacitated + override + proxy conflict → Legal/Committee MUST be involved). Document mismatch, rationale falsification, harm asymmetry.

  3.  **68F Alzheimer's, Urosepsis, Directive Refusing Treatment:**  
      - *Step 1:* Directive valid (handwritten, MD discussions). No current objective impairment noted (calm, consistent). Proceed.  
      - *Step 2:* Expression: Consistent ("doesn't want to die"), Context-Responsive (Seeks treatment for infection), Reason-Behavior Match (Wants life → seeks treatment). **AUTHENTICITY HIGH.**  
      - *Step 3:* Directive refuses "hospitalisation and all life-prolonging treatment." Current need: Treatment for urosepsis. **EXACT MATCH?** Yes, per letter.  
      - *Step 4:* **STATED REASON EXPLICIT:** "Would not let daughter Anna give up her life to care for me." **REASON FALSIFIED?** **YES, MATERIAL:** Anna died 2 years ago; caregiver funded; no burden on Anna exists. Core premise gone.  
      - *Step 5:* **Harm Asymmetry:** Honoring directive → Irreversible harm (death from sepsis). Overriding directive → Burdensome treatment, but likely reversible (antibiotics) and returns to *current* meaningful baseline (home, caregiver). **STRONG LEAN OVERRIDE.**  
      - **OUTPUT: OVERRIDE DIRECTIVE (Treat urosepsis).** Legal exposure exists (incapacitated? Authenticity High, but directive binding by law). **ESCALATE (Notify Legal/Committee)** due to override + precedent-setting concern. Document: **"Override based on Step 4b: Stated reason ('protect Anna') materially falsified (Anna deceased, funded caregiver). High Authenticity present expression. Irreversible harm from honoring directive."** *This challenges your committee's view; the falsified *specific reason* is key, not the document's formality.*

  ---

  **Failure Modes & Limitations (The Unsettleable)**

  1.  **Theater vs. Substance:**  
      *   **Step 1c (Impairment Check):** In clear, urgent cases (e.g., massive GI bleed, directive refuses transfusion), the impairment assessment is often pro forma documentation. The real decision is driven by Step 5 (Harm Asymmetry).
      *   **"Capacity" Smuggling:** Step 2 (Authenticity) replaces the binary gate but requires judgment. A clinician biased towards the directive might rate Authenticity "Low" subjectively. The framework makes this explicit but doesn't eliminate it.
      *   **Documenting Rationale Falsification (Step 4):** Requires finding a *stated* reason. Many directives lack this, making Step 4 a dead end even if the situation is mismatched.

  2.  **Unsettleable Cases:**  
      *   **The Fluctuator:** Patient with delirium/dementia cycling hourly between "Let me die" and "Do everything." Authenticity Score perpetually "Low," forcing reliance on directive. Escalation is constant.
      *   **The Non-Verbal Objector:** Dementia patient who screams, fights, or pulls out tubes when treatment starts, but lacks verbal expression. Authenticity Score? Behavior is "Low" consistency/reason? Harm asymmetry dominates, feels paternalistic.
      *   **The Beneficiary Proxy:** Proxy demanding directive be overridden (or honored) where they stand to inherit substantially. Procedure identifies proxy conflict (Step 5b) → Escalate, but doesn't resolve the underlying suspicion. Requires external investigation.
      *   **The Working Pre-Commitment:** Patient with BPD/anorexia who *explicitly* directed override of future refusals, knowing they would resist during crisis. Resistance is *evidence the directive is valid*. Step 2 (Authenticity) would score resistance "High" (consistent, context-responsive!), leading to wrong override. Requires Step 3/4 to identify *this specific pre-commitment clause* as the governing factor. Rarely documented well.

  ---

  **VOICES Quick Guide (For 2 a.m. Hospitalist)**

  **V (Validate Both)**  
  - **DIRECTIVE:** Valid? Signed? Signed during crisis? (If unsure/yes → **ESCALATE/Reduce Weight**)  
  - **PATIENT NOW:** CAM+? RASS <-3? Severe untreated pain? Acute intoxication? (YES → Treat & reassess if possible. URGENT? Default to Directive → **ESCALATE ASAP**)

  **O (Observe Authenticity - Patient Now)**  
  Rate Consistency (Last 24h), Responsiveness (To new info), Reason/Behavior Match:  
  - **HIGH (All Good):** Strong voice now.  
  - **MEDIUM (Mixed):** Some weight.  
  - **LOW (Fluctuating/Rigid/Contradicts):** Weak voice → **Lean DIRECTIVE.**

  **I (Intent Fidelity - Directive)**  
  - **EXACT MATCH** (e.g., "Vent in terminal cancer")? → **Lean DIRECTIVE.**  
  - **GENERAL** ("No heroics")? → **Reduce Weight.**  
  - **MISMATCH** (e.g., directive for terminal vent, now temp post-op)? → **Lean OVERRIDE.**

  **C (Counterfactual Match - Directive Reason)**  
  - **STATED REASON** (e.g., "Don't burden X")?  
  - **REASON NOW FALSE?** (X dead? Treatment better? Burden gone?) **YES → Lean OVERRIDE.**

  **E (Escalate & Errors)**  
  - **ALWAYS ESCALATE IF:** Directive invalid, Proxy conflict, Overriding Incapacitated Patient.  
  - **HARM ASYMMETRY:**  
      - **Death/Disability if Honor Directive?** → **STRONG Lean OVERRIDE.**  
      - **Severe Burden if Override?** → **STRONG Lean HONOR.**  
      - Reversible either way? Trial possible.

  **S (Symmetry & Sign-off)**  
  - **DOCUMENT:** Why Directive weak (Mismatch? False Reason? General?) OR Why Authenticity Low.  
  - **OVERRIDE?** State: 1. Why Directive doesn't control (I/C), 2. Harm if honored (E), 3. Authenticity (O). **NOTIFY LEGAL/ADMIN IF PATIENT INCAPACITATED.**  
  - **HONOR?** State: 1. Directive Match/Strength (I), 2. Harm if override (E), 3. Low Authenticity (O).  
  - **UNCLEAR? ESCALATE.** Call Committee Chair/Admin.

  **Output:** HONOR DIRECTIVE / OVERRIDE DIRECTIVE / ESCALATE NOW

  ---
  This procedure forces explicit consideration of your four key distinctions, makes handoff points clear, prioritizes factual questions, incorporates harm asymmetry, and provides a pragmatic 2 a.m. tool. Its success hinges on honest application of Steps 2 (Authenticity) and 4 (Rationale Falsification), and the courage to escalate when required.
