prompt: |-
  I want a specification, not a survey. Fix the purpose first: an account of the pramāṇas is adequate only if it can be used to settle, for any candidate source of awareness, whether it yields knowledge at all and, if it does, whether it is a distinct source or merely a variety of one already on the list. Write the desiderata such an account must meet, with the case that motivates each, mark which are non-negotiable for the Nyāya realist and which are only sectional preferences, and flag any pair you suspect cannot be jointly satisfied.

  The case that forces the issue for me is one the tradition never faced: a clinician's belief that a patient has a tumour, formed because an automated system flagged a scan. The flag is highly reliable; nobody on the team can reconstruct the route from image to flag; the system has no sensory contact with the patient, no beliefs, and no intention to inform. So it is not perception, the clinician cannot run the inference herself, and treating it as testimony seems to demand a speaker who knows and can be trusted as knowing. Does an adequate theory have to be able to classify this case? And does classifying it force a sixth pramāṇa, a widening of testimony to cover non-agents, or the admission that the classical four are only a taxonomy of the sources available to a single embodied agent?

  Requirements I most want argued for or against: that a bit of knowledge must be novel, so that memory and recognition transmit cognition without generating it, together with where exactly that line falls; that cognition of absence must be accommodated, since absence is real for the realist yet makes no sensory contact, along with the methodological question of what stops the list from proliferating; that the theory say whether a source's warrant is established intrinsically or only through another source, without falling into regress or circularity; and that it not collapse having-warrant into being-true, nor a distinct source into the same source in a new medium. Tell me which single requirement does the most to exclude candidate theories. A short score of the standard four against the list is welcome, but the criteria are the deliverable.
reasoning: |-
  Okay, the user is asking for a specification of desiderata for an account of pramāṇas (sources of knowledge) that meets specific criteria. They want it to address whether any candidate source of awareness yields knowledge and if it's distinct or just a variety of an existing one. They're particularly interested in the case of a clinician relying on an AI system's tumor detection—an example not covered in classical Indian philosophy.

  The user has several key requirements: novelty of knowledge (distinguishing generation vs. transmission), accommodation of absence cognition, intrinsic vs. extrinsic warrant establishment, avoiding collapse of warrant into truth, and preventing source conflation across mediums. They also want to know which requirement is most exclusionary to candidate theories.

  I need to structure this carefully. First, I'll define core desiderata with clear justifications, marking which are non-negotiable for Nyāya realists (like non-collapse of warrant/truth and realism about absence). The AI case is crucial here—it forces us to decide if testimony can extend to non-agents or if we need a new pramāṇa. 

  For the novelty requirement, I'll explain why memory isn't a pramāṇa while being precise about where "newness" begins (e.g., perception generates, testimony transmits but still counts as knowledge-generation). The warrant establishment point needs attention to avoid infinite regress; Nyāya likely accepts intrinsic warrant for perception but extrinsic for others. 

  The most exclusionary requirement? Probably "non-collapse of distinctness into medium differences"—it immediately disqualifies theories that conflate digital testimony with oral testimony as merely "testimony in bytes." 

  For scoring the classical four: perception nails novelty and warrant (intrinsic), but struggles with absence without additional mechanisms. Inference handles novelty and warrant (extrinsic), but can't cover the AI case alone. Testimony's agent-dependence fails the AI case unless stretched. Comparison works for certain absences but not all. 

  The AI case is the real stress test: if we widen testimony to reliable non-agents, we risk losing speaker-intention as a warrant condition. If we create a new pramāṇa (like "machine-output"), we face taxonomy proliferation. The embodied-agent restriction might be the realist's safest move, though it feels like a retreat. 

  I'll flag tensions—especially between accommodating absence (requiring non-perceptual pramāṇa) and preventing proliferation, and between extrinsic warrant and avoiding circularity. The user seems to want philosophical rigor without tradition-bound constraints, so I'll highlight where Nyāya realism might diverge from their modern case needs.
answer: |-
  Here is a specification of desiderata for an adequate theory of *pramāṇas* (sources of knowledge), grounded in your purpose and the motivating case, with Nyāya commitments flagged and tensions identified:

  **Core Purpose:** An account of *pramāṇas* must provide criteria to determine, for any candidate source of awareness (J):
  1.  Whether J is a *pramāṇa* (i.e., yields *pramā* - veridical cognition/awareness constituting knowledge).
  2.  If J is a *pramāṇa*, whether it is **distinct** from all recognized *pramāṇas* or merely a **variety/subtype** of one.

  **Motivating Case:** Clinician's belief in a tumor based *solely* on:
  *   A highly reliable automated system's flag.
  *   System lacks: sensory contact, beliefs, intentions, speaker-status.
  *   Clinician lacks: ability to reconstruct inference, perceptual access.

  **Desiderata (D) with Justification & Nyāya Status:**

  1.  **D1: Novelty Requirement:** A *pramāṇa* must be capable of **generating** *new* veridical cognition (*anadhigatārtha-jñānajanakatva*).
      *   **Case:** Distinguishes generative sources (perception, inference, testimony, comparison) from preservative/transmissive ones (memory, recognition). Memory recalls known truths; it doesn't *generate* knowledge *de novo*. The clinician's belief *is* novel knowledge *for the clinician*.
      *   **Nyāya Status:** **Non-Negotiable.** Nyāya explicitly excludes memory (*smṛti*) as a distinct *pramāṇa* for this reason. The line falls between *generating* awareness of a previously unknown object/proposition and *recalling* it.
  2.  **D2: Accommodation of Absence (*abhāva*):** The account must accommodate veridical cognition of absences as genuine knowledge.
      *   **Case:** "There is no tumor in this scan" is a crucial medical judgment. Absences are real for Nyāya realists (*bhāva-viśiṣṭa abhāva*) but lack sensory presence. Perception alone cannot grasp pure absence.
      *   **Nyāya Status:** **Non-Negotiable.** Nyāya realism commits to absence as a real category. Failure here invalidates the realism.
  3.  **D3: Warrant Establishment:** The account must specify how the **warrant** (justification, *prāmāṇya*) of a cognition arising from a putative *pramāṇa* is established, without infinite regress, vicious circularity, or collapsing into truth (*sat*).
      *   **Case:** Is the clinician's belief warranted *because* the system is reliable (intrinsic to the source-type?), or *only* after independent verification (extrinsic)? Nyāya must avoid saying the cognition is warranted *because* it's true (which would make warrant trivial and unestablished at cognition-time).
      *   **Nyāya Status:** **Non-Negotiable.** Nyāya universally rejects *svataḥ-prāmāṇya* (intrinsic validity) for *all* cognitions, advocating *parataḥ-prāmāṇya* (extrinsic validity established via another *pramāṇa*), carefully avoiding regress (e.g., via pragmatic success, *vyavahāra*). Collapsing warrant into truth is fatal.
  4.  **D4: Distinctness Criterion:** Distinctness of a *pramāṇa* must be based on a **fundamental difference in the causal process/mechanism** (*karaṇa*) generating cognition, *not* merely a difference in medium, object, or complexity.
      *   **Case:** Is "machine-output" a distinct *pramāṇa* from testimony because the mechanism lacks intentionality, or just "testimony via silicon"? Distinguishes core causal structure from implementation details. Prevents spurious proliferation (e.g., "microscope-vision" vs. perception).
      *   **Nyāya Status:** **Non-Negotiable (in principle).** Nyāya defines *pramāṇas* by their unique causal structures (*svalakṣaṇa-karaṇa*). Violation leads to an unprincipled list.
  5.  **D5: Non-Collapse of Truth & Warrant:** The definition of a *pramāṇa* and its operation must clearly distinguish between a cognition **being true** (*yathārtha*) and **being warranted/justified** (*prāmāṇya*) at the time of arising.
      *   **Case:** The clinician's belief might be true *and* warranted by the system's reliability, but these are distinct properties. A *pramāṇa* must provide warrant, not just (potentially) truth. A lucky guess isn't *pramā*.
      *   **Nyāya Status:** **Non-Negotiable.** Fundamental to Nyāya epistemology. Truth is correspondence (*tadvati tatprakārakatva*); warrant is the property making the cognition *reliably* true (established extrinsically, D3).
  6.  **D6: Explanatory Completeness (Motivating Case):** The account **must** be able to classify the clinician's case, determining if it yields knowledge and under which *pramāṇa* (existing, widened, new, or none).
      *   **Case:** Forces the theory's boundaries. Does testimony require a *knowing speaker*? Does inference require *reconstructible steps*? Is reliability sufficient absent intention? **Yes, classification is mandatory.**
      *   **Nyāya Status:** **Conditionally Non-Negotiable (for adequacy).** While the *classical* Nyāya list didn't face this, an adequate realist theory *now* must address reliable non-agent sources. Failure here renders the theory incomplete for modern knowledge contexts.
  7.  **D7: Anti-Proliferation Constraint:** The account must provide principled reasons why the list of distinct *pramāṇas* is **restricted** (e.g., to 4), preventing arbitrary additions for every seemingly new source.
      *   **Case:** Why not have distinct *pramāṇas* for instrument-aided perception, mathematical intuition, machine-output, etc.? What stops endless splitting?
      *   **Nyāya Status:** **Non-Negotiable Methodological Principle.** The classical four are argued to be exhaustive based on fundamental causal structures (D4). Proliferation undermines the theory's explanatory power and violates D4.
  8.  **D8: Embodied Agent Focus (Sectional Preference):** The account *may* restrict itself to *pramāṇas* available to a **single, standardly embodied human agent** operating with their natural faculties and social context.
      *   **Case:** This potentially sidesteps the AI case ("not a source for *this* agent alone") or forces it into testimony/inference for the agent. Reflects the classical focus.
      *   **Nyāya Status:** **Sectional Preference (strongly held).** Classical Nyāya centered on the human knower. Adopting this makes D6 easier (possibly classifying AI-case as inference/testimony-variant or rejecting it), but risks inadequacy for modern epistemology. Rejecting this pushes towards widening testimony or a new *pramāṇa*.

  **Flagged Tensions:**

  *   **D2 (Absence) vs. D7 (Anti-Proliferation):** Accommodating absence cognition often requires specific mechanisms (e.g., Nyāya's *anupalabdhi*). Is this a distinct *pramāṇa* or a complex form of perception/inference? Resolving this without proliferation is a core Nyāya challenge.
  *   **D3 (Warrant Extrinsic) vs. Avoiding Circularity/Regress:** Extrinsic validation (D3) risks infinite regress (validating source A by B, B by C...). Nyāya uses pragmatic success (*vyavahāra*) as a stopping point, which some argue is circular or insufficiently rigorous. A deep tension.
  *   **D6 (Complete Classification - AI) vs. D8 (Embodied Agent):** If D8 is adopted, the AI-case might be deemed "not a *pramāṇa*" *for the clinician* (as they can't access its warrant intrinsically), or awkwardly forced into inference/testimony. Rejecting D8 forces accommodation within the *pramāṇa* framework, straining D4 and D7.
  *   **D4 (Distinctness Mechanism) vs. AI Case:** If the AI's mechanism (complex algorithm/data processing without intentionality) is fundamentally different from human inference (reasoning steps) or testimony (intentional communication), D4 demands a distinct *pramāṇa*, conflicting with D7.

  **Most Exclusionary Requirement:** **D4 (Distinctness Criterion - Fundamental Causal Mechanism).** This most sharply excludes candidate theories:
  *   It immediately disqualifies theories that define *pramāṇas* by their objects (e.g., "sense-objects" vs. "universals") rather than the *process*.
  *   It prevents collapsing distinct sources into one due to similar outcomes (e.g., reliable guesswork vs. perception).
  *   It sharply challenges attempts to fit radically new sources (like AI) into existing categories *if* their causal mechanisms differ fundamentally. It forces a principled decision: widen an existing *pramāṇa*'s definition (risking incoherence - D4 violation) or add a new one (risking proliferation - D7 violation).

  **Scoring Classical Four Against Desiderata (Brief):**

  1.  **Perception (*Pratyakṣa*):**
      *   **D1:** Excellent (Generates novel sensory knowledge).
      *   **D2:** Poor (Struggles with pure absence without auxiliary explanation).
      *   **D3:** Good (Warrant extrinsic, often via coherence/function; sense-faculty contact provides initial but defeasible warrant).
      *   **D4:** Excellent (Defined by unique sense-object-contact mechanism).
      *   **D5:** Good (Clear distinction).
      *   **D6:** N/A (Classical).
      *   **D7:** Good (Foundational).
      *   **D8:** Excellent (Embodied focus).
  2.  **Inference (*Anumāna*):**
      *   **D1:** Excellent (Generates novel knowledge from evidence).
      *   **D2:** Good (Can infer absence via the "absence of cause/effect").
      *   **D3:** Good (Warrant extrinsic, based on validity of *vyāpti*/relation, established via perception/testimony).
      *   **D4:** Excellent (Defined by unique process involving *parāmarśa* - knowledge of universal relation + minor term).
      *   **D5:** Good.
      *   **D6:** Struggles (Requires agent's *reconstructible* steps - fails AI case as described).
      *   **D7:** Good.
      *   **D8:** Excellent.
  3.  **Testimony (*Śabda*):**
      *   **D1:** Excellent (Generates novel knowledge from communication).
      *   **D2:** Limited (Can report absences, not directly cognize them).
      *   **D3:** Good (Warrant extrinsic - speaker's competence & honesty established via other *pramāṇas*).
      *   **D4:** Excellent (Defined by unique mechanism: comprehension of reliable utterance from a knowing speaker).
      *   **D5:** Good.
      *   **D6:** **Fails** (Classical definition requires a *knowing speaker* and *intention to communicate* - absent in AI case).
      *   **D7:** Good.
      *   **D8:** Excellent.
  4.  **Comparison (*Upamāna*):**
      *   **D1:** Good (Generates novel knowledge of name-object association via similarity).
      *   **D2:** Poor (Not applicable).
      *   **D3:** Fair (Warrant extrinsic, based on similarity perception & testimony; weaker foundation than others).
      *   **D4:** Controversial (Nyāya argues distinct mechanism based on similarity; others view as inference/testimony).
      *   **D5:** Good.
      *   **D6:** Poor (Not applicable to AI case).
      *   **D7:** Weakest (Most debated inclusion; prone to reduction).
      *   **D8:** Good.

  **Conclusion on the AI Case & Pramāṇa Count:** An adequate theory **must** classify the AI case (D6). This classification **will** force a fundamental choice:
  *   **Widen Testimony:** Redefine *Śabda* to include reliable, non-intentional, non-agent sources ("reliable indicator" vs. "reliable speaker"). This strains D4 (mechanism differs radically) and D3 (how is *this* warrant established?).
  *   **New Pramāṇa (e.g., "Machine-Output" - *Yantraja*?):** Satisfies D4 but violates D7 (Proliferation) and D8 (if held).
  *   **Restrict to Embodied Agent (D8):** Classify the clinician's cognition as a complex, warranted inference (*arthāpatti*?) or a non-standard testimony (system as proxy for programmers?), potentially straining D4/D3. Or deny it's *pramā* via a standard *pramāṇa* at the moment of reception (only becoming knowledge after extrinsic validation), aligning with strict D3/D8 but appearing counterintuitive given reliability.
  *   **Admit Limitation:** Concede the classical four are a taxonomy for an embodied agent's *direct* sources (D8), and the AI case involves a derivative, composite source relying on them indirectly. This satisfies D7/D8 but may fail D6 (completeness) if "derivative source" isn't rigorously accounted for within the framework.

  The realist's path of least resistance, honoring core non-negotiables (D1-D5, D7), might be **widening testimony** while carefully redefining the warrant condition (D3) for non-agents (e.g., system reliability established via inference/perception). However, the **tension with D4 (distinct mechanism)** remains the deepest challenge posed by the AI case.
