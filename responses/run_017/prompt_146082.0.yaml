answer: |-
  **Mathematics Department: Foundation Migration Guide (v1.3)**  
  **Effective: Start of Michaelmas Term**

  **1. Executive Summary**  
  This document outlines the mandatory migration of the Department’s core foundational framework from Classical Mathematics (CM) to Intuitionistic Mathematics (IM), effective Michaelmas Term. This strategic upgrade enhances proof accountability, computational relevance, and semantic fidelity by retiring non-constructive dependencies. Legacy proofs will operate via the **Double-Negation Compatibility Layer (DNCL)**, though proactive refactoring is advised. Three supported distributions are available (Brouwerian, Bishop-style, Russian); ensure compatibility with your research profile.

  **2. Why Migrate? Key Benefits**  
  *   **Existence Guarantees (EG):** All new existential theorems (`∃x.P(x)`) now ship with a verifiable witness (`w`) and constructive certificate (`P(w)`), eliminating "unredeemed existence warrants".
  *   **Disjunction Clarity (DC):** Proofs of disjunctions (`A ∨ B`) must specify which disjunct holds, enhancing decision-making transparency.
  *   **Operational Continuity:** Functions defined on the real continuum (`ℝ`) are now inherently continuous, ensuring predictable behaviour. The Approximate Intermediate Value Theorem (A-IVT) provides robust, practical alternatives to legacy IVT.
  *   **Resource Efficiency:** Truth-table semantics and uncountable choice sequences have been deprecated, reducing metaphysical overhead.

  **3. Deprecations & Retired Components**  
  *   **Excluded Middle (EM):** `A ∨ ¬A` is deprecated. While not invalidated, its use triggers DNCL overhead and is incompatible with EG/DC features. The derived **Double-Negation of Disjunction** (`¬¬(A ∨ B)`) remains standard-issue, and **Triple Negation Collapse** (`¬¬¬A → ¬A`) is fully supported.
  *   **Unrestricted Choice (AC):** The Axiom of Choice is now an **optional add-on module**. **Important:** Installing AC reintroduces EM via Diaconescu’s Bridge (see §7 Add-Ons).
  *   **Truth-Table Semantics:** Replaced by proof-theoretic and BHK interpretative models. Legacy truth-functional analyses require DNCL reprocessing.
  *   **Decidable Equality (`=ₛ?`) on `ℝ`:** Equality on real numbers is no longer universally decidable. Migrate to the **Positive Apartness Relation (`#`)** for constructive discrimination (`x#y → ¬(x=y)`).

  **4. Compatibility & Legacy Support**  
  *   **DNCL (Double-Negation Compatibility Layer):** Automatically translates CM proofs into IM-compatible formats by inserting double negations (e.g., `P` becomes `¬¬P`). **Limitations:**
      *   Does *not* guarantee witness extraction for existence claims (`∃x.P(x)` becomes `¬¬∃x.P(x)`, not `∃x.¬¬P(x)`).
      *   EG/DC features remain inactive under DNCL.
      *   Proofs heavily reliant on EM or uncountable choice may exhibit runtime errors ("unconstructible object").
  *   **Action Required:** Audit proofs for EM/AC dependencies. Refactor using constructive alternatives (induction, apartness, continuity moduli) where possible. DNCL is a transitional tool, not a long-term solution.

  **5. New Core Features & APIs**  
  *   **Real Number API (`ℝ`):**
      *   Primary relation: **Apartness (`x # y`)**.
      *   Equality (`x = y`) defined as `¬(x # y)`.
      *   **Continuity Guarantee:** All total functions `f : ℝ → ℝ` are uniformly continuous.
      *   **A-IVT:** If `f(a) < 0 < f(b)`, then for any `ε > 0`, ∃`c` such that `|f(c)| < ε`. (Legacy IVT proof requires non-trivial refactoring).
  *   **Existence Theorem Package (`∃x.P(x)`):** Includes mandatory witness constructor and verification sub-routine.
  *   **Fan Theorem (Optional Licence FT-01):** Provides compactness for binary sequences. Install separately if required for analysis workflows. *Incompatible with Russian distribution.*

  **6. Supported Distributions (Choose One)**  
  *   **Brouwerian Build (BB):** Supports free choice sequences and continuity principles. **Baggage:** Bar Theorem, Creating Subject methods (see §9 Known Issues). *Incompatible with Markov's Principle.*
  *   **Bishop-Style Constructivism (BSC):** Minimalist, sequence-free. Focuses on algorithmically grounded proofs compatible with CM formalisms. **Baggage:** Agnostic on choice sequences; classical theorems are valid only if constructively reproven.
  *   **Russian Constructivism (RC):** Adheres to Markov's Principle (`¬¬∃n.P(n) → ∃n.P(n)` for decidable `P`) and Church's Thesis. **Baggage:** Rejects non-recursive objects; classical theorems deemed "non-algorithmic" are invalid. *Incompatible with Brouwerian choice sequences & Fan Theorem.*

  **7. Add-On Modules**  
  *   **Choice Module (AC-Add):** Restores unrestricted Axiom of Choice. **Critical Advisory:** Enabling AC-Add automatically triggers **EM-Reactivation (Diaconescu's Bridge)**, disabling EG/DC features and potentially destabilizing `ℝ` continuity guarantees. Use with extreme caution; audit proofs for non-constructive drift.
  *   **Markov's Principle (MP-Add):** Available for BSC/BB users. Enables termination proofs (`¬¬∃n.P(n) → ∃n.P(n)` for decidable `P`). *Pre-installed in RC.*

  **8. Migration Timeline**  
  *   **Now - End of Term:** Audit existing proofs using the `IM_Compliance_Scanner` tool (download from Dept. Intranet). Attend workshops on Apartness Relations and Witness Extraction.
  *   **Long Vacation:** Mandatory proof refactoring. DNCL will be enabled by default for non-compliant legacy proofs.
  *   **Michaelmas Day 1:** Full IM deployment. Classical foundations decommissioned. New submissions require IM compliance.

  **9. Known Issues & Workarounds**  
  *   **Creating Subject Sequences (BB only):** Proofs invoking a temporal "creating subject" (e.g., `n such that P becomes known at time t`) generate **Temporarily Deferred Existence Warrants (TDEW)**. Witnesses remain pending until the subject observes them. Avoid in time-critical proofs.
  *   **Legacy Analysis Proofs:** Results dependent on non-constructive IVT, Tychonoff's theorem, or unrestricted Hahn-Banach may fail. Migrate to A-IVT, local compactness, or separable subspaces.
  *   **`ℝ` Precision Limitations:** Deciding `x = 0` is non-trivial. Use `|x| < ε` for all `ε > 0` (i.e., `¬(x # 0)`) as the constructive standard.
  *   **Distribution Conflicts:** BB/RC proofs are non-portable. Verify cross-distribution compatibility before collaborative work.

  **10. Support & Resources**  
  *   Helpdesk: `im-support@maths.ox.ac.uk` (Tag queries: [LegacyProof], [DNCL_Error], [Witness_Extraction])
  *   Workshops: "Apartness for Analysts", "Refactoring with Continuity", "Bishop vs. Brouwer: Choosing Your Distribution".
  *   Documentation: *Constructive Migration Handbook*, *DNCL User Guide*, *Real API Specifications*.

  This migration enhances the rigour, transparency, and computational value of our mathematical practice. Embrace constructive progress. Non-compliance may result in proofs being flagged during seminar peer review or, in severe cases, sent up to the Proctors for foundational remediation.

  **Regards,  
  The Foundation Migration Oversight Committee (FMOC)**  
  *"Building Certainty, Constructively."*
