prompt: |-
  Hi — practical problem that I've slowly realised is a philosophy problem, which is annoying, because my entire formal training here is one survey course I mostly slept though, and my partner is the philosopher in the house, so right now these questions get settled by whoever talks louder over dinner. That is not a scalable way to run a data platform.

  Six months ago I inherited ownership of the shared clinical ontology for a network of about eleven hospitals — it's the layer that says what kinds of things exist in our data: patients, encounters, problems, devices, caregivers, and so on. Every couple of weeks somebody proposes a new entity type, and whatever I let in gets coded, billed against, audited, and reused as an inclusion criterion in studies for years; unwinding one costs months and makes us look foolish, so the decisions are small, frequent, and stickier than they look. They go to a data governance group that meets monthly, is mostly clinicians and one compliance person, and will rubber-stamp whatever I put in front of them, which means the actual epistemic decision is mine and I'd like it to be defensible rather than vibes. What makes it hard is that most of what people want to reify is inferred rather than recorded. I've started sorting proposals into three buckets: things that simply weren't collected but could have been; things that could only be measured by a measurement that changes the thing measured (asking someone about their adherence changes their adherence; auditing a ward changes the ward); and things that are inaccessible in principle for us — defined by a counterfactual, or by what something was like for the person living it. And my sense is that the philosophical literature on identifying what there is when some of the information can't be had — the observable/unobservable distinction, the Ramsey-sentence move where you define a term by the role it plays and then existentially generalise it away, the Newman-style worry that a finite relational structure is trivially satisfied by lots of different choices of objects so structure alone never pins down what the objects are, the proxy-function / inscrutability stuff, whatever in that neighbourhood is actually load-bearing — says something sharp about when you've identified a kind of thing versus when you've just carved out a convenient slot in a model and started talking as if the slot had an occupant.

  So: write me a decision procedure for admitting a proposed entity type. I want something an analyst with no philosophy can run in under an hour and then defend at a governance meeting. Concretely: the ordered questions; for each, what actually counts as a sufficient answer given that we mostly have claims about recorded stuff and not the world; where the procedure hard-stops with a no; where it hands off to a human because the question is about what we owe patients or what we're willing to assert, not about facts; and — importantly — the tests that carry the philosophical weight, including some version of the shuffle test (if I swapped this candidate's identity conditions for a rival candidate's and nothing downstream changed, I haven't identified an entity, only a slot), a portability check across sites with different collection habits, and a "two different ontologies, same predictions" check, plus a rule for when the honest answer is "add a derived score or a property, not a kind." Be explicit about where the procedure misfires. Then run it on three live cases: medication non-adherence inferred from pharmacy refill gaps (we already reified a version of this years ago and it partly turned out to be tracking our own reminder system rather than the patient); caregiver burden, inferred from free-text notes and partly a matter of how things seem to the caregiver; and 'avoidable admission', which leadership badly wants as a per-admission entity because a regulator is about to levy penalties on it, and which I suspect the procedure will refuse me — if it does, argue that refusal properly and give me something I can offer leadership instead, because " philosophy says no" will not survive that meeting. Please don't pad it with reading suggestions or references, I can't chase them and they won't help me on Thursday. Lead with the checklist itself, then the three applications, then a short paragraph on what the procedure can't do; no more than 1,200 words total, and define any jargon in parentheses the first time you use it.
reasoning: |-
  Okay, the user has a really complex and high-stakes problem. They're managing a clinical ontology for a hospital network, and every decision about adding new entity types has long-term consequences. Their current approach lacks structure, and they've recognized this as fundamentally a philosophy problem - specifically about how we define what "exists" when we can't directly observe things. 

  Hmm, they're clearly frustrated about their lack of formal philosophy training, and the dinner-table debates with their philosopher partner aren't cutting it for professional decisions. The stakes are real - bad ontology choices lead to wasted resources and credibility loss. What they need is a practical decision framework, not theory.

  Breaking down their requirements: They want a concrete checklist that non-philosophers can use in under an hour. It must handle three tricky cases they're facing now: medication non-adherence, caregiver burden, and avoidable admissions. The framework needs to incorporate key philosophical concepts like the "shuffle test" (identity conditions), portability, and model equivalence - but translated into operational questions. 

  The real pain point seems to be leadership pressure around "avoidable admissions" - they suspect it won't pass muster but need ammunition beyond "philosophy says no." The framework must provide actionable alternatives when rejecting an entity type.

  I notice they're very time-pressed ("won't help me on Thursday") and adamant about no references - pure practicality needed. Word count is tight (1200 words) so every sentence must carry weight. The tone should match their no-nonsense, slightly stressed professional voice.

  Key challenges in designing this:
  1) Distilling complex epistemology into yes/no questions
  2) Building in escape valves where ethical or policy decisions override ontology
  3) Making philosophical tests like "shuffle" concrete for clinicians
  4) Providing fallback solutions when entities are rejected
  5) Anticipating where the framework will misfire (they wisely asked for this)

  For the three test cases, I'll need to show how the framework leads to different conclusions: probably reject avoidable admissions as an entity, maybe accept caregiver burden with caveats, and show why non-adherence (which caused problems) would have been caught by the framework.

  The leadership alternative for avoidable admissions is crucial - something like process indicators rather than reified entities. Must make that sound like a win, not a compromise.

  Finally, the misfires section should warn about over-mechanization and cultural factors - no checklist replaces judgment completely.
answer: |-
  ## Ontology Admission Checklist

  **Purpose:** Determine whether a proposed entity type reflects a robust clinical kind or is better treated as a derived property/score. Answer sequentially; a "No" at any starred (*) question stops the process with a recommendation against creating a new entity type.

  1.  **Direct Measurement Existence:**
      *   *Question:* Could this entity **plausibly and directly** be observed or recorded as a distinct, standalone fact in the clinical record *without requiring significant inference or interpretation beyond standard coding*? (e.g., "Temperature Reading" = Yes; "Infection Severity" = No).
      *   *Sufficient Answer:* Concrete examples of how it *could* be directly recorded or observed in practice (e.g., "A nurse could document 'Patient refused medication X at time Y'" for adherence; "A specific assessment tool score for caregiver burden").
      *   *Hard Stop?* **No** (Proceed even if the answer is "No" – many valid entities require inference).

  2.  **Inference Reliance Check:**
      *   *Question:* Does identifying an instance of this proposed entity **necessarily rely on inference** from *other* recorded data points, rules, or models?
      *   *Sufficient Answer:* Description of the specific data sources and logic/rules used to infer the entity (e.g., "Inferred from gap between prescription end date and next refill date > threshold" for adherence; "Inferred from NLP keywords in nursing notes" for burden).
      *   *Hard Stop?* **No** (Proceed).

  3.  **Inference Stability Test (Carries Weight - Avoids "Measurement Changes Thing"):**
      *   *Question:* Is the inference rule/logic **stable**? Does the act of measuring/inferring the entity *itself* significantly alter the underlying reality being measured *in a way that invalidates the inference for future instances*? (e.g., auditing adherence changes future adherence; labeling burden changes caregiver behavior).
      *   *Sufficient Answer:* Evidence or strong argument that the inference rule remains valid even after deployment and awareness (e.g., "Refill gaps persist despite reminder system awareness"; "Burden keywords correlate with known stable external factors"). Requires critical assessment of feedback loops.
      *   *Hard Stop?* **Yes***. "No" here indicates the entity is too reactive/observer-dependent for stable reification. Recommend a derived property/score instead.

  4.  **Identity Conditions / Shuffle Test (Carries Weight - Avoids "Slot vs. Occupant"):**
      *   *Question:* Can you define **identity conditions** for this entity that are **independent** of its role in specific analyses or downstream processes? If you swapped these identity conditions for a *rival* set defining a different concept (e.g., swapped "refill gap non-adherence" for "self-reported non-adherence"), would **core downstream uses fundamentally break or change meaning**?
      *   *Sufficient Answer:* Clear definition of how an instance is uniquely identified and distinguished. Argument that changing the *core definition* (not just the inference method) would invalidate key interpretations or actions tied to the entity (e.g., "Swapping refill-gap for self-report changes who gets flagged, impacting billing logic and study eligibility").
      *   *Hard Stop?* **Yes***. "No" here means you've defined a useful *role* or *function*, not a distinct entity. Recommend a derived property/score or process metric.

  5.  **Portability Test (Carries Weight - Avoids Site-Specific Artifacts):**
      *   *Question:* Can the entity be reliably inferred **across all sites** in our network, despite variations in data collection practices or EHR configurations? Does the inference avoid relying on site-specific artifacts (e.g., a particular reminder system, a specific note template)?
      *   *Sufficient Answer:* Evidence the inference logic uses core, common data elements available consistently network-wide. Mitigation strategies for known site variations.
      *   *Hard Stop?* **Yes***. "No" indicates the entity is an artifact of local process, not a universal clinical kind. Recommend a derived property/score *with caveats* or site-specific implementation.

  6. **Model Equivalence Check (Carries Weight - Avoids "Just a Modeling Convenience"):**
      *   *Question:* Could the **same core predictive power or operational utility** be achieved by adding **properties to existing entities** or creating a derived **score**, instead of creating a wholly new entity type?
      *   *Sufficient Answer:* Demonstration that the proposed entity captures a fundamental distinction not reducible to attributes of other entities (e.g., "Non-adherence isn't just a property of the MedicationOrder; it's a distinct patient behavior pattern influencing multiple domains").
      *   *Hard Stop?* **No**. "Yes" strongly suggests a derived property/score is sufficient.

  7.  **Clinical/Operational Necessity (Handoff to Human Judgment):**
      *   *Question:* Is there a **compelling clinical, operational, or regulatory need** that *requires* treating this as a distinct entity type, even if the above tests are borderline? (e.g., mandated reporting, critical billing logic, foundational cohort definition).
      *   *Sufficient Answer:* Clear articulation of the need and why alternatives (properties/scores) are insufficient. Involves policy/leadership input.
      *   *Hard Stop?* **No**. Proceed to final recommendation.

  **Recommendation:**
  *   Passed 1-7 (especially 3*,4*,5*): **Admit** as a new entity type. Document inference logic rigorously.
  *   Failed 3*,4*,5*: **Reject** as an entity type. Create a **derived property or score** on relevant existing entities (e.g., Patient, Encounter, Caregiver) or a process metric instead.
  *   Passed 3*,4*,5* but strong "Yes" on 7: **Conditional Admit** (High Risk). Implement as entity BUT tag heavily as inferred, document limitations, and monitor for drift/artifacts. Prefer property/score if feasible.

  ---

  **Application to Live Cases:**

  1.  **Medication Non-Adherence (Inferred from Refill Gaps):**
      *   1: No (Inferred).
      *   2: Yes (Refill dates, threshold rule).
      *   3: **NO** - History shows inference was corrupted by the reminder system (measurement changed behavior/validity). *Hard Stop - Reject as Entity*. **Recommendation:** Derived property on `MedicationOrder` (e.g., `refillGapAdherenceStatus`), acknowledging the potential artifact. Use cautiously.

  2.  **Caregiver Burden (Inferred from Notes):**
      *   1: No (Inferred/Interpreted).
      *   2: Yes (NLP on free text).
      *   3: Maybe Stable? (Awareness *might* change documentation, less likely to change core burden immediately). Proceed cautiously.
      *   4: **Identity Conditions?** Fuzzy. Is it the *caregiver's experience* or the *clinician's documentation*? Swapping NLP inference for direct caregiver survey would change meaning significantly. *Hard Stop - Reject as Entity*. **Recommendation:** Derived property on `Caregiver` (e.g., `inferredBurdenLevel` or `burdenKeywordsPresent`) or better, a structured `CaregiverAssessment` score if possible. Captures the inference without reifying an unstable kind.

  3.  **Avoidable Admission (Per-Admission Entity):**
      *   1: No (Highly Inferred/Counterfactual).
      *   2: Yes (Complex rules based on diagnosis, timing, prior care, often involving "should have been managed elsewhere").
      *   3: **NO** - The *definition and measurement* (especially if tied to penalties) will directly influence coding and documentation behavior, changing what "counts" (measurement changes the thing). *Hard Stop - Reject as Entity*.
      *   **Defensible Refusal & Alternative for Leadership:** "Creating 'Avoidable Admission' as a core entity is epistemically unsound. Its definition is inherently counterfactual ('could have been prevented') and highly dependent on judgment and evolving guidelines. More critically, labeling admissions as avoidable *will* change clinician and coder behavior, making the metric unstable and potentially gaming the system – undermining the very goal of reducing them. This is a classic case where measurement distorts the target. **Offer Instead:** Implement a robust set of **process and outcome metrics** derived from existing entities (Encounter, Problem, Procedure, Observation):
          *   `Encounter.admissionType` = "Ambulatory Care Sensitive" (ACS) based on diagnosis codes (established, less counterfactual proxy).
          *   `Encounter.hasPriorEDVisitWithinXDays` (Boolean).
          *   `Encounter.hasPriorHospitalizationWithinYDays` (Boolean).
          *   `Encounter.associatedPCPContactWithinZDays` (Boolean).
          *   Derive a **risk score** for potentially avoidable complications based on comorbidities and admission details.
          *   **Track trends** in ACS admission rates *alongside* these process metrics and targeted intervention outcomes. This provides actionable data without the philosophical pitfalls and perverse incentives of reifying 'Avoidable Admission' itself. It focuses on measurable factors *associated* with avoidability."

  ---

  **Where the Procedure Misfires:**

  *   **Novelty & Evolving Science:** For genuinely new, poorly understood phenomena (e.g., early biomarkers), the tests (especially 3 & 4) might be too strict, potentially blocking useful but nascent concepts. Requires expert override (Question 7).
  *   **Value-Laden Kinds:** Entities deeply tied to ethics or policy (e.g., "Futility") might pass epistemic tests but require purely normative (human) decisions Question 7 handles this handoff).
  *   **Over-Mechanization:** Strict adherence might miss subtle clinical realities best captured by a new entity, even if slightly imperfect. The checklist prioritizes defensibility and stability over clinical intuition.
  *   **Implementation Cost:** Doesn't weigh the immense cost of adding/changing an entity vs. the benefit. A "Reject" might still be implemented as an entity due to overwhelming operational need (Question 7), but with high risk flags.
