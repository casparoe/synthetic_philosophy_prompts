answer: |-
  Here's a rigorously structured set of desiderata for evaluating answers to "Why is there something rather than nothing?", designed to expose evasions, category errors, and unstated assumptions. Requirements are categorized, with **non-negotiables** (logical/metaphysical coherence) marked as **NN**, **common but negotiable** premises as **CN**, and **camp-specific biases** as **CSB** (indicating where debates usually fracture).

  ---

  ### **I. Scope & Contrast Class Requirements** (What is "Nothing"?)
  1. **Explicit Contrast Class Definition (NN)**  
     *Motivation*: Answers must specify *what kind* of "nothing" is being contrasted with "something" (e.g., no concrete objects, no abstracta, no spacetime, absolute non-being). Failure here makes the question ambiguous.  
  2. **Coherence of "Nothing" (NN)**  
     *Motivation*: Any proposed "nothing" must be logically/metaphysically possible and not self-undermining (e.g., if "nothing" requires a container, it’s not nothing).  
  3. **No Privileging of the Null World (CSB)**  
     *Motivation*: Rejects your first friend’s view. An answer must *explain why the null world isn’t actual*, not assert its non-privilege as sufficient. Otherwise, "Why A rather than B?" is unanswered for A = null.  
  4. **Handles Subtraction Arguments (CN)**  
     *Motivation*: If removing all concrete entities stepwise seems coherent, an answer must address why this empty state isn’t actual (or deny its possibility).  

  ---

  ### **II. Explanatory Structure Requirements** (What Counts as an Answer?)
  5. **Non-Vacuous Grounding (NN)**  
     *Motivation*: The explanation must not presuppose existence (e.g., causal explanations fail here since causes require existents). Grounding must be modal/constitutive (e.g., "X exists because X must exist").  
  6. **Self-Applicability Test (CN)**  
     *Motivation*: The explanatory principle (e.g., "All possibilities exist") must account for *its own existence/truth*. If it exempts itself, it’s question-begging.  
  7. **Non-Circularity (NN)**  
     *Motivation*: The explanation cannot rely on contingent existents (e.g., "God exists" → "Why does God exist?").  
  8. **Discrimination Condition (NN)**  
     *Motivation*: The explanation must be *false* or *inapplicable* in the null world. If equally true of nothing (e.g., "Being is fundamental"), it doesn’t explain *something*.  

  ---

  ### **III. Modal & Logical Requirements**
  9. **Compatibility with Modal Logic (NN)**  
     *Motivation*: Cannot contradict standard modal logic (e.g., if an empty world is logically possible, denying its possibility requires justification).  
  10. **Necessity Demand (CSB)**  
      *Motivation*: Your second friend’s view. Answers must terminate in a *necessary* truth (entity, principle, or state). Brute contingencies are "shrugs".  
  11. **No Brute Contingency (CSB)**  
      *Motivation*: Inverse of #10. Rejects that the totality of existence can be contingent without explanation.  

  ---

  ### **IV. Physics & Epistemology Constraints**
  12. **Consistency with Cosmology (CN)**  
      *Motivation*: Must not contradict well-established physics (e.g., quantum field theory’s "nothing" isn’t metaphysical nothing; entropy constraints).  
  13. **Observational Neutrality Allowed (CN)**  
      *Motivation*: Answers need not have empirical consequences (e.g., modal realism). Demanding them overreaches into science.  
  14. **No Anthropic Cheating (NN)**  
      *Motivation*: "We wouldn’t be here to observe nothing" explains only why *we observe* something, not why *there is* something. Reject selection-effect evasions.  

  ---

  ### **V. Theoretical Virtues & Biases**
  15. **Simplicity Demand (CSB)**  
      *Motivation*: "Nothing is simpler" is not a given. Simplicity (e.g., fewer entities, laws) is a contested virtue. Answers *using* this must justify why simplicity entails existence/non-existence.  
  16. **Plenitude Burden (CN)**  
      *Motivation*: If all possible worlds exist (plenitude), the answer owes an account of *why this world is observed*—especially its low entropy ("tidy cosmos"). Else, it answers "why something?" but not "why *this*?".  
  17. **No Question-Dodging (NN)**  
      *Motivation*: Answers like "Existence is necessary" must show *why*; calling the question "malformed" must specify *how* (e.g., "nothing" is incoherent).  

  ---

  ### **Key Tensions & Knockout Powers**
  #### **Irreconcilable Tensions**  
  - **Necessity (#10) vs. Self-Applicability (#6)**: Necessary truths (e.g., mathematical platonism) often fail #6 (why does the necessity structure exist?).  
  - **Plenitude (#16) vs. Discrimination (#8)**: Plenitude typically violates #8—if "all worlds exist" is true in all worlds (including null), it doesn’t discriminate.  
  - **No Brute Contingency (#11) vs. Observational Neutrality (#13)**: If the answer implies a multiverse with varied physical laws, it may lack empirical constraints, angering naturalists.  

  #### **Most Damaging Requirement**  
  **#8 (Discrimination Condition)**. It invalidates:  
  - Purely structural answers ("Being is fundamental")  
  - Many theological answers ("God’s nature includes existence")  
  - Plenitude ("All worlds exist")  
  ...since all would "hold" in an empty world, explaining nothing about *discrimination*.  

  #### **Camp-Biased Requirements**  
  - **Necessity (#10) & No Brute Contingency (#11)**: Reflects your second friend’s demand.  
  - **Simplicity (#15)**: Often invoked by proponents of "nothing" but contested.  
  - **Plenitude Burden (#16)**: Pressures multiverse/possibilist answers.  

  ---

  ### **Your Open Questions Sorted**  
  - **Causation**: Ruled out by **#5** (non-vacuous grounding).  
  - **"Nothing is simpler"**: Treated as **CSB (#15)**, not a given.  
  - **Subtraction/empty world possibility**: Addressed by **#4** and **#9**.  
  - **Existence-cheap answers (plenitude)**: Must satisfy **#16** to avoid observational incoherence.  

  This framework forces answers to confront logical boundaries, avoid sleight-of-hand, and declare their presuppositions. When testing an answer, ask:  
  1. *Which desiderata does it explicitly reject?* (e.g., "I deny #10, brute facts are acceptable")  
  2. *Where does it violate NN requirements?* → Likely fatal.  
  3. *Does it smuggle in CSB as NN?* → Exposes tribal bias.  

  You now have a spec. Go hunt.
