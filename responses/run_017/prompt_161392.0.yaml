     - Some Tanners might try to arbitrage by buying Pots cheaply and selling dearly, but without money, it's hard.
     - In Round 3, with tokens, the market might not clear if prices are not set properly.

   What the activity can't stage:
     - The diagonal conjunction, exchange rate depending on the specific traders and their worth. We couldn't operationalize that.
     - The idea that need supplies one objective measure. In the game, need is subjective and varies, leading to different exchange rates.

   So in the debrief, we can explain that Aristotle posited that there is one objective measure of need for the community, but in the game, we saw a variety of exchange rates.

   Now, writing the email.
answer: |-
  Here's the game design for your Aristotle seminar, written as a continuous email for your notes:

  I've designed a trading game to stage Aristotle's core ideas about exchange in NE Book 5—specifically, why he sees need (chreia) as the necessary measure for just exchange and how it differs from modern intuitions. The game uses index cards and a projector, runs in 40 minutes, and leaves 40 minutes for debrief. Students will be producers in a simple economy: half are Fishers (producing Fish cards), half are Potters (producing Pot cards). Start by handing each student two blank index cards and instructing them to write "FISH" on both if they're Fishers or "POT" on both if they're Potters. Project only these rules: "Goal: Trade to get what you need. Each round, you can produce one good by holding up one card. You start with no goods. You need one Fish and one Pot each round to survive. To trade, pair up, show each other your cards, and negotiate an exchange. Record trades by passing cards. Surviving a round earns 1 point. You have 2 minutes per round. No talking outside your pair during trading time." Run two normal rounds—they’ll quickly establish a 1:1 exchange rate since everyone needs both goods equally. Their initial trades will feel "fair" by modern standards: equal goods for equal needs.  

  Now, introduce the emergency: Project "NEW RULE: WINTER IS COMING. POTS SHATTER IN FROST. FROM NOW ON, EVERYONE NEEDS TWO POTS PER ROUND TO SURVIVE. FISH NEEDS UNCHANGED." No other rules change. Run two more rounds. Watch chaos unfold. Fishers, still needing only one Fish but now desperate for two Pots, will offer multiple Fish for Pots. Potters, needing two Pots themselves, will hoard or demand lopsided trades (e.g., one Pot for two Fish). Exchange rates will skew dramatically toward Pots. Some Fishers will starve (fail to trade) because no Potter will accept 1:1 anymore.  

  Finally, introduce tokens: Project "NEW RULE: TOKEN ECONOMY. I WILL GIVE EACH OF YOU 10 PAPER TOKENS. YOU CAN NOW BUY/SELL GOODS WITH TOKENS. SET YOUR OWN PRICES. SELL GOODS BY HANDING THEM TO ME WITH YOUR PRICE; BUY FROM MY TABLE. TOKENS HAVE NO INTRINSIC VALUE—ONLY GOODS COUNT FOR SURVIVAL." Run one round. Prices will stabilize around Pots costing more than Fish (e.g., 3 tokens for Pots, 1 for Fish). Then project "FINAL RULE: TOKENS NOW WORTH POINTS. EACH TOKEN = 0.1 POINT AT GAME END." Run a last round. Many will hoard tokens, refusing to sell goods even to buyers who need them. Record trades and prices on the projector throughout.  

  Debrief by mapping game moments to Aristotle: First, ask why the 1:1 rate collapsed in winter. They’ll say "Pots became urgently needed." Stress that labor (production effort), scarcity (card counts unchanged), and preferences (liking for goods) were identical pre/post-winter—only need (chreia) shifted. Second, ask if trades felt fair when Fishers gave two Fish for one Pot. They’ll call it exploitative. Probe why: modern fairness assumes goods have value independent of traders. Aristotle’s diagonal conjunction (builder/shoemaker as house/shoes) rejects this—the exchange rate must account for who is trading and their needs. Ask what assumption would make Aristotle’s view feel fair: if society agreed that need objectively measures value (not subjective preferences). Third, discuss token hoarding: Aristotle’s warning that wealth-getting corrupts when money stops representing need and becomes desired itself.  

  What will go wrong: Someone will try arbitrage (buying Pots low to resell high in token rounds), causing protests about "unfairness." A Fisher might refuse to trade post-winter, protesting that Pots "shouldn’t" cost more—use this to highlight modern intuitions. Some Potters may hoard early, causing Fishers to form trading blocs (which Aristotle would applaud as communal need-adjustment). The game can’t stage Aristotle’s claim that need is a single objective measure. Students will experience need as clashing urgencies (e.g., a starving Fisher’s desperation vs. a Potter’s comfort). Use this to debate whether Aristotle’s "objective" need is plausible or if it’s a social agreement masking power imbalances. You’ll have rich material to transition to the NE text, where the diagonal conjunction resolves the incommensurability they felt.
