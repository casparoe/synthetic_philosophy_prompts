  ### Villanelle: Thresholds of Choice

  **Refrain Selection & Rhyme Check**  
  *Refrain Candidates Tested for Sixfold Repetition:*  
  1. "This gain is mine alone." (Clear, survives repetition)  
  2. "This harm is not my own." (Rhymes, but implies denial—rejected)  
  3. "The cost is shared by all." (Impersonal, survives repetition)  
  4. "We bear the weight in thrall." (Forced rhyme—rejected)  
  *Chosen Refrains:*  
  - **A1 (Lines 1,6,12,18):** "This gain is mine alone."  
  - **A2 (Lines 3,9,15,19):** "The cost is shared by all."  
  *Rhyme Sounds:*  
  - **-a:** "alone"/"all" → *-ōn* sound (grown/shown/known/sown/blown)  
  - **-b:** Non-rhyming middle → *-āk* sound (break/stake/lake/mistake/ache/awake)  

  ---

  **Final Poem**  
  This gain is mine alone.  
  I graze one more—no fence will break.  
  The cost is shared by all.  

  The grass has always grown,  
  but when the brittle land awakes,  
  this gain is mine alone.  

  My coin stays in its sown  
  dark purse; the pump’s dry throat must ache.  
  The cost is shared by all.  

  Each beast was just a loan  
  from futures no one saw forsake.  
  This gain is mine alone.  

  No lamp-flame stirs. Unknown,  
  whose final straw made stillness stake?  
  The cost is shared by all.  

  The pasture’s green is blown  
  to dust. The empty cisterns shake.  
  This gain is mine alone.  
  The cost is shared by all.  

  ---

