prompt: |-
  For the past two years I have been sitting in on a metaphysics reading group at my old university. I am a retired solid-state chemist; I came to it wondering how philosophers handle the identity over time of the sort of thing I used to spend my career growing in vessels, and I have stayed because our convenor is unusually systematic. She has declined, more than once and with evident amusement, to say whether she is an endurantist or a perdurantist, on the ground that the labels matter less than the pattern of verdicts. So I have started recording the verdicts. Her rulings to date are these.

  First: a seed crystal of potash alum, suspended in supersaturated mother liquor and grown over a season to ten thousand times its original mass, with the lattice orientation uninterrupted throughout. She holds that this is literally the same crystal at the end as at the beginning, notwithstanding that all but one ten-thousandth of its ions were not present when it was seeded.

  Second: a man of eighty, none of whose cells were present at his tenth birthday, and who now has two prosthetic joints. Literally the same human being.

  Third: the familiar vessel whose planks are replaced one at a time. Literally the same ship. The vessel subsequently reassembled out of the discarded planks is not the same ship, but a duplicate that came into existence later, however intrinsically similar it may be.

  Fourth: a river whose water is wholly replaced every few weeks and whose lower course was diverted two centuries ago. Here she denies that there is any one thing persisting across that span; talk of the same river is, she says, a convenient way of speaking about a causal-historical sequence.

  Fifth: the pilot light on a boiler that has burned continuously for thirty years, its matter wholly turned over countless times. Derivative in the same way: a process rather than a continuant.

  Sixth: a lump of clay modelled into a figure and afterwards rolled back into a ball. The lump persists through both operations; the figure is a distinct thing, brought into existence by the modelling and destroyed by the rolling.

  Seventh: a crystal dissolved completely in water and recrystallised from the same solution when the water was allowed to evaporate. A new crystal, she says; the old one ceased to exist at the moment of dissolution.

  The case I want to put to her comes from my own former laboratory, and she has not ruled on it. A crystal is held in a flow cell across which a small temperature gradient is maintained, so that material dissolves at the warmer face and is deposited at the colder one. Over three weeks the crystal travels two hundred micrometres across the cell, turning over its entire material more than once while preserving a single lattice orientation and an unaltered external habit. The flow is then stopped and the gradient removed; the crystal, now threaded with dislocations, cleaves along a plane into two pieces, and each piece goes on growing as a separate crystal of the same orientation.

  My questions, in order of how much I care about them. Will she say that either daughter is literally the crystal that had been migrating? If not, is the original best described as having perished at the cleaving, or as having continued in some weaker but still privileged way? And how many crystals were there in the cell in the week before the cleaving — one, or two that had not yet come apart?

  What I would value more than the answers, however, is the principle behind them. I should like two or three candidate rules, each of which reproduces all seven of her earlier rulings, together with an account of exactly where they come apart on the new case; then a best guess at her verdicts, with the reasons for preferring it; and finally a further case — one I could pose to her at the next meeting, ideally drawn from something a chemist can produce — that would separate the surviving candidates cleanly. I should add that I have no interest in being told the dispute is merely verbal. If that is in fact the right thing to say, I should like to be shown why seven rulings delivered without apparent hesitation do not already settle it.
reasoning: |-
  Hmm, this is a fascinating challenge from a retired solid-state chemist deeply engaged with metaphysical questions about identity over time. The user has presented seven existing rulings from a metaphysics reading group convenor on persistence cases, and now wants to apply that pattern to a new crystal migration scenario while requesting methodological clarity.

  First, I need to carefully analyze the convenor's existing pattern of verdicts. The rulings show a consistent emphasis on structural continuity over material continuity, except where the structure is disrupted. The seed crystal persists despite near-total material turnover because the lattice orientation remains uninterrupted. Similarly, the human persists through cellular replacement and prosthetics. The Ship of Theseus is maintained through gradual replacement, but the reassembled version is considered new. However, she denies persistence to the river and pilot light, treating them as processes rather than continuants. The clay lump persists but the statue form doesn't. Most crucially for the new case, the dissolved-recrystallized alum is considered a new entity.

  The user's proposed case adds several challenging elements: continuous material turnover during migration, structural preservation, then cleavage into two identical-orientation crystals. This seems designed to test the boundaries between the crystal growth case (where persistence was affirmed) and the dissolution-recrystallization case (where it was denied).

  For the principle extraction, I should avoid labeling the convenor's view as strictly endurantist or perdurantist, as she's explicitly rejected those labels. Instead, I'll focus on operational criteria: structural integrity maintenance seems paramount, with special attention to whether the structure survives transitions without discontinuity. The dissolution case shows that complete structural dissolution breaks persistence, even if material reassembles identically.

  For the new crystal case, the key tension points are: 1) Does migration constitute structural continuity? 2) Does cleavage represent destruction or mere division? 3) When exactly does multiplicity begin? I'll need to develop at least two distinct principles that handle all seven cases but diverge here.

  The user's deeper needs seem methodological - they want tools to probe metaphysical reasoning systematically, not just answers. Hence my response should provide testable principles and a new discriminating case (perhaps involving epitaxial growth or twinned crystals) that would force further clarification. I'll also preempt the "merely verbal" dismissal by showing how the convenor's consistent pattern reveals substantive commitments about what constitutes genuine persistence versus convenient speech.

  I should emphasize that the convenor's approach appears to be a form of moderate realism where persistence depends on causal-structural continuity without requiring strict identity conditions. The dissolved crystal case suggests she draws the line at complete dissolution of form, while gradual replacement maintains identity. The cleavage event in the new case will be the critical test for whether structural division terminates the original entity.
answer: |-
  Based on the convenor's pattern of verdicts, her approach appears grounded in **causal-structural continuity** with an emphasis on **unbroken existence**. Identity requires a continuous causal process maintaining a cohesive, integrated structure over time. Material turnover is permissible if the structure persists without interruption, but complete dissolution or radical disassembly breaks identity. Here's a systematic breakdown:

  ### Core Principles Extracted from the 7 Rulings
  1.  **Structural Integrity & Continuity:** Identity persists if the core structure (lattice, organism, ship-form) maintains spatiotemporal continuity through change, even with near-total material turnover (Crystal, Human, Ship).
  2.  **No Existence Gaps:** Complete dissolution or disassembly destroys identity. Reassembly, even from original parts, creates a new entity (Recrystallized Crystal, Reassembled Ship ≠ Original Ship).
  3.  **Process vs. Continuant:** Entities lacking a persistent, cohesive structure across time (e.g., constantly replaced matter without structural integration) are processes, not enduring objects (River, Pilot Light).
  4.  **Form as Ephemeral:** The identity of an *arranged* form (statue) depends on its current structure and is destroyed when that structure is lost (Clay Statue vs. Lump).

  ---

  ### Candidate Rules Consistent with All 7 Rulings
  Each rule explains the verdicts but diverges on your crystal migration case:

  1.  **Unbroken Causal-Structural Path (UCSP):**
      *   *Rule:* X at t₁ is identical to Y at t₂ iff there is a continuous spatiotemporal path for X's defining structure, maintained by causal processes intrinsic to X, without complete dissolution or fission/fusion events.
      *   *Basis:* Emphasizes continuity *without interruption* of the structure's existence as a unified whole.
      *   *Applies to Original 7:*
          *   Crystal/Human/Ship: Continuous causal-structural path.
          *   River/Pilot Light: No persistent unified structure.
          *   Recrystallized Crystal: Dissolution breaks the path.
          *   Reassembled Ship: Assembly from parts isn't a continuous path *of the structure*.
          *   Clay Lump: Structure persists; Statue: Structure created/destroyed.

  2.  **Dominant Structure Continuity (DSC):**
      *   *Rule:* X at t₁ is identical to Y at t₂ iff the defining structure of X is preserved as the dominant, organizing principle through the change, causally governing its persistence, even if material is incrementally replaced or the structure undergoes gradual deformation/modification.
      *   *Basis:* Focuses on the structure's role as the causal "organizer," allowing more flexibility in form if the core organizing principle persists.
      *   *Applies to Original 7:*
          *   Crystal/Human/Ship: Lattice/organism/ship-form remains the dominant organizing principle.
          *   River/Pilot Light: No single dominant organizing structure persists; it's the flow/process itself.
          *   Recrystallized Crystal: Dissolution destroys the lattice as organizer; new nucleation occurs.
          *   Reassembled Ship: Assembly creates a new instance of the structure; no continuity of the organizing principle from the original.
          *   Clay Lump: Lump-structure organizes; Statue-structure is temporary.

  3.  **Maximal Causal-Structural Overlap (MCSO):**
      *   *Rule:* X at t₁ is identical to Y at t₂ iff Y bears the maximal causal-structural relationship to X compared to any other candidate at t₂. This requires a sufficiently high degree of causal dependence (Y's structure causally depends on X's structure) and structural similarity, maintained without complete loss of integrity.
      *   *Basis:* Identity is a matter of the *closest continuer* in terms of causal history and structure.
      *   *Applies to Original 7:*
          *   Crystal/Human/Ship: Clearly the maximal continuer (unlike the dissolved crystal/reassembled ship).
          *   River/Pilot Light: No single maximal structural continuer exists across centuries/decades; it's a sequence.
          *   Recrystallized Crystal: New crystal isn't causally dependent on the *structure* of the old one in the right way (dissolution broke it); relies on the solution state.
          *   Reassembled Ship: Duplicate isn't causally dependent on the original ship's *ongoing structure*; it's assembled from discarded parts.
          *   Clay Lump: The ball is the maximal continuer of the lump; the statue is not the maximal continuer of the ball.

  ---

  ### Divergence on Your Migration-Cleavage Case
  *   **Scenario:** Crystal migrates via dissolution/redeposition (continuous lattice/habit), then cleaves into two pieces, each growing separately (same orientation).
  *   **UCSP Rule:** The cleavage is a *fission event*, destroying the original unified crystal. *Neither* daughter is identical to the migrating crystal. The migrating crystal ceased to exist *at the moment of cleavage*. Before cleavage, there was *one* crystal (single unbroken path).
  *   **DSC Rule:** The migrating phase maintains the lattice as dominant organizer. Cleavage destroys that single dominant structure, splitting it. *Neither* daughter is identical to the original, as neither inherits the *role* of being the sole dominant structure of the pre-cleavage entity. Before cleavage, *one* crystal (one dominant structure/organizer).
  *   **MCSO Rule:** The migrating crystal has one maximal continuer: itself. After cleavage, *neither* daughter is *maximally* continuous with the original. Each shares half the causal-structural history, but they are symmetrical competitors. The original ceased at cleavage. Before cleavage, *one* crystal (only one candidate).

  **Common Ground:** All rules agree that *neither* daughter is literally the original migrating crystal. All rules agree the original ceased to exist at cleaving (or during it). All rules agree there was only *one* crystal in the cell the week before cleavage.

  **Subtle Difference:** UCSP and DSC see cleavage as a definitive termination event due to fission/loss of unity. MCSO sees it as creating symmetrical competitors, preventing either from being the *maximal* continuer. The practical verdict is the same.

  ---

  ### Best Guess at Her Verdicts & Reasons
  Based on the emphasis on *unbroken* existence (seed crystal vs. dissolved crystal) and rejection of entities persisting through fission/reassembly (ship, dissolved crystal), the convenor likely adheres most closely to **Unbroken Causal-Structural Path (UCSP)**.

  1.  **Neither daughter is the migrating crystal.** Cleavage is a fission event, destroying the single, unified lattice structure that existed during migration. Like dissolution or disassembly, it breaks the continuity of existence.
  2.  **The original crystal perished at cleaving.** Its existence as a single, unified entity ended when it split. There is no "weaker but privileged" persistence; identity requires unbroken continuity.
  3.  **There was one crystal in the cell the week before.** Throughout migration, a single, continuous causal-structural path (the unbroken lattice propagating through dissolution/redeposition) defined one crystal, just like the grown seed crystal. The cleavage hadn't occurred yet.

  **Reasoning:** Her rulings consistently prioritize unbroken existence. The dissolved crystal case is decisive: complete structural dissolution terminates identity, even if identical material reassembles. Cleavage is analogous – it destroys the structural unity that defined the single migrating crystal. While migration involves continuous turnover *within* the structure, cleavage *splits the structure itself*. The Ship reassembly ruling shows she rejects identity via reassembly of parts; fission into symmetrical parts is similarly identity-destroying. The river ruling shows she rejects persistence where no single structural continuant exists; after cleavage, you have two new structural continuants.

  ---

  ### Discriminating Test Case: Epitaxial Regrowth
  **Scenario:** A single crystal of Substance A is completely dissolved in a controlled manner, leaving behind a pristine, atomically flat substrate surface *with the exact same lattice orientation* as the original crystal. A supersaturated solution of Substance A is then introduced. A new crystal nucleates *exclusively* and *epitaxially* on this substrate, growing with the identical lattice orientation, eventually forming a crystal visually indistinguishable from the original. Is this new crystal identical to the dissolved one?

  *   **UCSP Prediction: NO.** Dissolution broke the causal-structural path. The new crystal nucleated on the *substrate*, not from the *structure* of the old crystal. The substrate is a remnant, not a persisting crystal structure.
  *   **DSC Prediction: LIKELY NO, but less certain.** The dominant organizing principle (the lattice) was destroyed by dissolution. The new crystal is organized by the *substrate surface*, which is causally derived from the old crystal but is not *the* crystal structure itself persisting.
  *   **MCSO Prediction: YES.** The new crystal bears the *maximal* causal-structural relationship to the original. Its structure is identical and was *directly caused* by the substrate left by the original dissolution. It is far more continuous with the original than a crystal nucleated elsewhere in the solution would be. Its causal dependence on the original's structure (via the substrate) is strong. No other candidate is as continuous.

  **Why this separates them:** This case probes the boundary between the dissolved/recrystallized alum (ruled *new*) and the migrating crystal (ruled *same*). It introduces a very high-fidelity causal link (epitaxy) without maintaining a continuous structure through dissolution. UCSP, emphasizing unbroken paths, clearly says *no*. DSC, focusing on the organizing principle, likely says *no* (dissolution destroys the organizer). MCSO, focused on maximal continuity, is strongly tempted to say *yes* due to the perfect structural match and direct causal link via the substrate. This cleanly distinguishes MCSO from UCSP/DSC. If the convenor says *no*, she aligns with UCSP/DSC. If she says *yes* (or hesitates significantly), MCSO is favored. This case is experimentally feasible for a chemist.

  ---

  ### On "Merely Verbal"
  The convenor's seven consistent rulings demonstrate her view is *not* merely verbal. She is making substantive metaphysical commitments about what constitutes genuine persistence over time versus process descriptions or new entities. Her pattern reveals:
  1.  **Objectivity:** She distinguishes real persistence (crystal, human, ship) from mere convenient speech (river) or temporal parts (pilot light).
  2.  **Causal/Structural Criteria:** Her verdicts rely on non-arbitrary criteria – causal dependence and structural integrity maintenance – applied systematically.
  3.  **Existence Conditions:** She takes a stand on when things begin and cease to exist (dissolution, disassembly, fission destroy; gradual replacement preserves).
  4.  **Explanatory Power:** Her pattern offers a coherent framework for reasoning about persistence in diverse scenarios.

  While the *labels* (endurance, perdurance) might be deemed less important than the specific judgments, the judgments themselves reflect a substantive theory of persistence grounded in causal-structural continuity without existence gaps. The dispute is about what *actually persists* in reality, not just how we use words. Her rulings show she believes there is a fact of the matter to be discovered through analyzing causal and structural relationships.
