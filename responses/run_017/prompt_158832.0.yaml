answer: |-
  Right, let's tackle this head-on, translating those arguments into your Bayesian cosmology toolkit as faithfully as possible, preserving their character without laundering, and then giving you the residue report. We'll use your terms ("likelihood starvation", "prior pumping") where apt and critique them. British English throughout.

  **Core Translation & Residue Report: Four Arguments in Bayesian Vocabulary**

  1.  **The No-Alternatives Argument (NAA):**
      *   **Argument:** Decades of intense, well-motivated, well-resourced search by a large community have failed to produce a coherent, viable alternative theory. This failure is *itself* evidence for the incumbent theory (e.g., String Theory), because if it were fundamentally wrong, we should reasonably expect a successful competitor to have emerged by now.
      *   **Translation into Your Terms:** This is **not primarily about likelihoods or Bayes factors over defined hypotheses.** It's a claim about the **generative process within the model space** and our **prior beliefs over that space**.
      *   **Faithful Bayesian Restatement:** "The extensive and sophisticated search effort constitutes strong evidence that the *prior probability density* over the space of *potentially viable fundamental theories* is heavily concentrated on regions consistent with the core framework of the current programme (e.g., strings, extra dimensions, SUSY), or that the *effective volume* of viable alternative model space is vanishingly small relative to the effort expended. The lack of discovery is interpreted as implying a very low *prior probability* for the existence of any significantly different, viable competitor model (`P(∃ Viable Alternative | Extensive Search Failure)` is judged low). This failure acts as an *Occam factor* favouring the incumbent by diminishing the perceived plausibility of its rivals, effectively *pumping the prior* for the existing framework relative to a vaguely defined 'anything else' class."
      *   **Residue Report:**
          *   **Maps Cleanly?** Partially. It directly engages with **priors** and the **Occam razor** aspect (penalising complexity/alternatives).
          *   **Maps with Distortion?** Yes. The key distortion is the **sociological element**: The argument relies on an implicit *model of the research community's efficiency* as a search algorithm within theory space. Bayesian inference typically assumes the hypothesis space is *defined*; NAA makes claims about the *existence* and *discoverability* of hypotheses within that space based on community behaviour. Your toolkit has no standard place for modelling researcher efficiency as evidence.
          *   **No Counterpart?** The core claim that *failure to find an alternative constitutes positive evidence for the incumbent* has no direct Bayesian counterpart. Bayes factors compare *defined* models given data. NAA uses sociological data (search effort/failure) to argue about the *definition* and *plausibility* of the model space itself.
          *   **Indicts Vocabulary or Argument?** Primarily **indicts the argument's grounding in Bayesian inference**. It smuggles in sociological claims about search efficiency as if they were standard evidence about model plausibility. Your suspicion is correct: it's fundamentally a claim about the generative process of your colleagues.
      *   **Your Terms:** This is pure **"prior pumping"**. It raises the perceived prior probability of the theory based on external factors (community effort/failure), *not* on its likelihood or internal coherence relative to data. "Likelihood starvation" isn't the core issue here, though the *consequence* of lacking alternatives might be that the incumbent remains high prior despite its *own* likelihood starvation.

  2.  **The Unexpected Interconnections Argument (UIA):**
      *   **Argument:** The theory unexpectedly explains phenomena it was *not* designed or constructed to explain (e.g., string theory deriving the Bekenstein-Hawking entropy formula). This is seen as a sign of depth and validity, beyond mere fitting.
      *   **Translation into Your Terms:** This is fundamentally about **model generality and predictive success on *new* data domains**.
      *   **Faithful Bayesian Restatement:** "The theory has successfully passed multiple **posterior predictive checks** on distinct, *previously unseen* data sets or physical regimes (`D_new`), which were *not used* in its construction or initial motivation. Successfully predicting `D_new` with minimal or no adjustment of its core parameters provides strong evidence via a high **Bayes factor** when compared to models requiring significant modification or new parameters to accommodate `D_new`. This demonstrates a low effective **model complexity** for explaining this new domain, resulting in a favourable **Occam factor**."
      *   **Residue Report:**
          *   **Maps Cleanly?** **Yes, exceptionally well.** This is the Bayesian gold standard: successful prediction of *new* data (`D_new` not used in model building) provides the strongest possible boost to the evidence (Bayes factor). The surprise factor maps directly onto the degree of tension between the prior predictive distribution and `D_new`.
      *   **Your Terms:** This directly impacts the **likelihood** (`P(D_new | Theory)`) for `D_new`. It's the *opposite* of likelihood starvation for `D_new`. While it might *feel* like prior pumping (increasing our *belief*), it's mechanistically achieved through a strong likelihood showing for an unexpected domain. Your terms don't quite capture the "unexpected" aspect, but the Bayesian machinery handles it perfectly via the prior predictive distribution.

  3.  **The Meta-Inductive Argument (Track Record) (MIA):**
      *   **Argument:** This *type* of theorising (e.g., highly mathematical, seeking unification, based on symmetry/beauty) has a historical track record of eventually producing empirically successful theories, even after long periods of apparent disconnect from experiment (e.g., GR, Dirac equation, QFT). Therefore, its current non-empirical successes (like mathematical consistency) are a leading indicator of future empirical confirmation.
      *   **Translation into Your Terms:** This is an argument for setting a **hierarchical prior** based on a **reference class** of past theories.
      *   **Faithful Bayesian Restatement:** "Based on a **reference class** of past fundamental physics research programmes exhibiting similar characteristics `C` (e.g., mathematical depth, pursuit of unification, aesthetic constraints), a high proportion eventually achieved significant empirical confirmation. Therefore, we assign a relatively high **hyperprior** probability to the proposition that any *new* theory exhibiting characteristics `C` and showing 'non-empirical' signs of progress (internal consistency, unexpected interconnections) will *also* eventually yield empirically testable predictions and be confirmed. This high hyperprior manifests as a relatively high **prior probability** for the *specific* current theory within this class."
      *   **Residue Report:**
          *   **Maps Cleanly?** **Partially.** The structure of using historical success rates to inform priors for new instances *is* Bayesian (hierarchical modelling).
          *   **Maps with Distortion?** **Yes, significantly.** The **reference class problem** is acute and ill-defined (`C` is vague: what counts as "similar"? How do you weight different characteristics? Is the historical sample representative or biased?). The **"non-empirical signs of progress"** are poorly defined and their correlation with *future* empirical success within the reference class is asserted, not rigorously established from the data. It risks being an **untestable hyperprior**.
          *   **No Counterpart?** The argument often conflates the *style* of theorising with the *specific content* of the current theory. Assigning a prior based on a nebulous class `C` to a specific, complex hypothesis like string theory involves a large, unquantified leap.
          *   **Indicts Vocabulary or Argument?** **Primarily indicts the argument.** Bayesianism *allows* for hierarchical priors based on reference classes, but the MIA typically employs a reference class so ill-defined and a historical narrative so selective that the resulting hyperprior lacks rigorous justification and becomes essentially subjective and untestable within the framework. Your suspicion about an "ill-defined reference class" and "untestable hyperprior" is spot on.
      *   **Your Terms:** This is another form of **"prior pumping"**. The prior for the *specific* theory is boosted based on perceived characteristics (`C`) linked (via a questionable meta-argument) to historical success, *without* direct impact on its likelihood for current data. "Likelihood starvation" remains the core issue *for the current theory*, which the MIA attempts to circumvent by boosting the prior.

  4.  **The Anthropic/Landscape Move (ALM):**
      *   **Argument:** The fundamental theory predicts a vast "landscape" of possible solutions (vacua) with different physical constants/laws. We observe only one universe, with constants suitable for our existence. Therefore, predictions are probabilistic: the theory predicts the *distribution* of constants, and observations are conditioned on the selection effect that we exist ("anthropic principle"). Observing our specific constants is consistent with the theory if they have non-negligible probability within the predicted distribution *and* within the anthropically allowed subset.
      *   **Translation into Your Terms:** This is fundamentally about **handling selection effects** and making **probabilistic predictions** when the fundamental model has **massive degeneracy/inflation of possibilities**.
      *   **Faithful Bayesian Restatement:** "The fundamental theory `T` (e.g., string landscape) predicts a **highly multi-modal prior predictive distribution `P(D | T)`** over observable constants `D`, covering an enormous range of possibilities (the 'landscape'). Crucially, we must condition our observations on a **selection function `S`** defined by the necessity of observer existence (the anthropic conditional). The relevant likelihood for comparing `T` to alternatives is not `P(D_obs | T)` naively, but `P(D_obs | T, S)`, calculated by **marginalising** over the landscape: ∫ P(D_obs | θ, T) P(θ | T, S) dθ. Here `θ` represents a point in the landscape (a set of constants), and `P(θ | T, S)` is the **conditional prior** given `S` (requiring `θ` to support observers). The 'measure problem' is the contentious specification of `P(θ | T)` *before* conditioning on `S`."
      *   **Residue Report:**
          *   **Maps Cleanly?** **Conceptually, yes.** The Bayesian formalism for selection effects (`S`) is directly applicable. The need to marginalise over a vast space of possibilities is standard (like marginalising over nuisance parameters, just vastly larger).
          *   **Maps with Distortion?** **Yes, in crucial ways:** 1. **The Measure Problem:** Unlike your survey selection function `S` which is *instrumental* and usually well-defined (e.g., flux limit, redshift range), `P(θ | T)` (the "prior measure" over the landscape) is a *theoretical postulate* inherent to `T` and is highly contested. There's no consensus on how to define it. 2. **Definability of `S`:** The anthropic conditional `S` ("supports observers like us") is notoriously vague and difficult to quantify precisely. 3. **Likelihood Starvation Amplified:** Calculating `P(D_obs | T, S)` requires integrating over an ill-defined measure on an ill-defined space subject to an ill-defined condition. This makes the likelihood *effectively flat* for *any* observation `D_obs` consistent with `S`, unless the measure and `S` are tightly constrained (which they aren't). It's **extreme likelihood starvation**.
          *   **No Counterpart?** The *scale* and *theoretical nature* of the degeneracy (landscape) and the *inherent contestedness* of the measure `P(θ | T)` differentiate it from typical nuisance parameter marginalisation or instrumental selection effects. The measure is part of the *theory specification*, not an external given.
          *   **Indicts Vocabulary or Argument?** **Indicts both.** Your vocabulary *can* formally encompass it (selection effect, marginalisation), but the *practical reality* exposes severe limitations: the inputs (`P(θ | T)`, `S`) are so poorly defined that the framework struggles to yield testable, calculable likelihoods. The argument relies on the *conceptual possibility* of the framework, often masking the lack of concrete predictive power.
      *   **Your Terms:** This is the quintessential scenario for **"likelihood starvation"**. The likelihood `P(D_obs | T, S)` is typically so broad and insensitive to `D_obs` (within anthropic bounds) that no realistic observation can significantly distinguish `T` from other landscape-compatible theories. Attempts to favour specific measures or regions within the landscape based on mathematical appeal are forms of **"prior pumping"** within the `θ`-space. Your "trials factor" analogy undersells it – it's not just multiple looks, it's an inflation of possibilities so vast and ill-measured that disconfirmation becomes nearly impossible.

  **Assessment of Your Terms: Likelihood Starvation & Prior Pumping**

  *   **Likelihood Starvation:** This is an **excellent and necessary term**. It perfectly captures the core pathology: a model whose likelihood function `P(D | Theory)` is flat or near-flat over the domain of realistically obtainable data `D`. No data can update the prior significantly. This is distinct from an expensive likelihood; it's about *informativeness*. It applies most clearly to the Anthropic/Landscape case and is the fundamental issue plaguing all non-predictive programmes. **Keep it.**
  *   **Prior Pumping:** This is also **useful and descriptive**. It explicitly names arguments that aim to increase `P(Theory)` *without* invoking `P(D | Theory)` for any specific, constraining `D`. It highlights manoeuvres that bypass the normal likelihood-driven updating process. The NAA and MIA are clear examples of prior pumping. The UIA, while feeling like it boosts belief, *does* work through the likelihood for `D_new`, so isn't pure prior pumping. **Keep it.** (Alternative: "Prior Inflation", but "Pumping" is more vivid).

  **Summary & Delivery to Supervisor/Theorists**

  This translation shows that Bayesian formalism *can* describe the structure of these arguments, but often exposes their weaknesses:

  1.  **NAA:** Prior pumping based on a sociological model of research efficiency (not standard evidence).
  2.  **UIA:** Genuine Bayesian evidence boost (strongest argument) via successful prediction on new domains.
  3.  **MIA:** Prior pumping via an ill-defined hierarchical prior over a vague reference class.
  4.  **ALM:** Formally incorporates selection effects, but crippled by likelihood starvation due to the ill-defined measure and anthropic conditional, making empirical distinction nearly impossible.

  The residue primarily indicts the *arguments* (NAA's sociology, MIA's vague reference class, ALM's measure problem) rather than your Bayesian *vocabulary*. Your vocabulary provides a rigorous lens revealing where these arguments rely on non-standard or poorly defined inputs (sociology of search, historical narratives, theoretical measures). The core problem across all four, highlighted by your terms, is either active **likelihood starvation** (ALM) or reliance on **prior pumping** (NAA, MIA) to compensate for a lack of constraining likelihoods. The UIA stands apart as the only one offering genuine (Bayesian) empirical support, albeit often on domains not originally intended.

  This analysis should stand on its own for your supervisor and colleagues. It fairly presents the arguments in precise terms familiar to a cosmologist, acknowledges the strength of the UIA within the Bayesian framework, and rigorously identifies the non-Bayesian or problematic elements in the others without dismissing the broader debate. It gives the sceptic concrete reasons for doubt (likelihood starvation, prior pumping, untestable elements) and the enthusiast a clear challenge: to reduce the reliance on prior pumping and overcome likelihood starvation within a testable Bayesian framework. Good luck with the discussions!
