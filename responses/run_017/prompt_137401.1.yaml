  Okay, let me start by really understanding what this user needs. They're applying for a 9-month fellowship in philosophy and decision theory, targeting a panel that includes quants. Their core idea is challenging the standard explanations for fractional Kelly betting—risk aversion and estimation error—and proposing non-stationarity of edge as a better structural explanation.

  First, I need to sharpen their research question. The user's original phrasing is a bit broad. The key is to frame it precisely: is there a structural reason (not based on preferences) for a constant fractional Kelly, and what factors determine that fraction? The sub-question about background wealth acting as a counterforce is crucial too. I should make sure both parts are distinct but connected.

  Looking at existing literature, the user is right that risk aversion is circular and estimation error doesn't explain constant shading. The asymptotic arguments for log-optimality assume stationarity, which real markets likely violate. That's the gap their project fills. The panel's quants might know Kelly's original work but not the philosophical implications of non-stationarity.

  For methodology, the user explicitly wants to avoid axiomatization and backtesting. So the plan should focus on modeling non-stationary environments. Phase 1: simple drift models to build intuition. Phase 2: regime-switching or hidden Markov models. Phase 3: integrate background wealth. Agent-based simulations with Bayesian learning make sense here because they handle uncertainty and adaptation well. 

  Deliverables need to be practical. A formula or heuristics for adjusting the fraction based on volatility and tail risk would help practitioners. The stress test on background wealth could show when leverage makes sense, adding nuance.

  Failure conditions: if non-stationarity doesn't yield a stable fraction, the project fails. Computational hurdles or messy results could also derail it. Budget-wise, overcomplicating models early on is a risk.

  Justifying philosophy's role is key. Philosophers excel at scrutinizing assumptions—like stationarity—that quants take for granted. They bridge abstract decision theory with real-world constraints, which is essential here. The panel needs to see how this approach offers foundational insights beyond what quants typically do.

  I should ensure the language stays plain-spoken. Avoiding jargon will make the proposal more defensible in interviews. Also, emphasizing the unique angle—structural vs. preference-based explanations—will highlight the novelty. The comparative statics (how factors like drift speed affect the fraction) must be clear as they demonstrate practical value.
answer: |-
  Here’s a streamlined proposal framework focused on your core idea, constraints, and audience:

  **The Sharpened Question**  
  Can non-stationarity in betting opportunities (e.g., drifting/regime-switching edge) structurally justify a *stable, constant* fractional Kelly strategy (c < 1) with intuitive comparative statics? Crucially: Does this explain practitioner behavior better than risk aversion or estimation error, while resolving the paradox that Kelly’s own framework pushes toward c=1?  
  *Sub-question:* Do structural factors like non-bettable background wealth systematically push *toward* aggression (c > 1), creating a tension?  

  **Why Existing Answers Fall Short**  
  1. **Risk aversion**: Circular. Picks c to match utility, but doesn’t explain *why* c≈0.2-0.5 emerges consistently across diverse agents.  
  2. **Estimation error**: Fails on stability. As data grows, optimal shading should vanish, but practitioners don’t adjust fractions downward over time.  
  3. **Kelly’s framework itself**: With i.i.d. bets and fixed edge, even finite horizons favor c→1 asymptotically. Overbetting costs *should* be learnable.  

  **The 9-Month Method**  
  *Phase 1 (Months 1-3): Build minimal non-stationary models*  
  - Simulate edge as a drifting OU process or 2-state Markov chain.  
  - Use Bayesian agents updating beliefs in real-time.  
  - Measure optimal fixed c maximizing terminal log-wealth under lopsided loss (penalizing ruin heavily).  
  *Why this?* Tests if low constant c emerges naturally when edge is volatile/unlearnable.  

  *Phase 2 (Months 4-6): Stress-test robustness*  
  - Add fat tails (e.g., alpha-stable noise).  
  - Introduce background wealth correlations (e.g., human capital as a bettable proxy).  
  - Vary drift speed/volatility to check comparative statics (c↑ as world stabilizes).  
  *Why not alternatives?* Avoids axiomatization rabbit holes; uses tractable models quant panelists respect.  

  *Phase 3 (Months 7-9): Formalize & contrast*  
  - Derive approximate analytical bounds for c under regime-switching.  
  - Contrast structural c vs. estimation-error c (show latter shrinks with data, ours doesn’t).  
  - Map background wealth effects: when does it dominate non-stationarity (pushing c>1)?  

  **Deliverable for Practitioners**  
  A diagnostic "cheat sheet":  
  - *If* your edge decays rapidly (e.g., arbitrage) *and* blowup risk is asymmetric → use c ≈ [low]  
  - *If* you have stable outside income correlated with bets → shade less (or leverage)  
  - *Never* shade purely due to "estimation error" without decay/fat tails  

  **Failure Conditions**  
  - **Project bombs** if non-stationarity *doesn’t* generate stable c < 1, or if background wealth *always* dominates (invalidating fractional Kelly).  
  - **Budget blown** by chasing analytical purity (e.g., solving HJB equations) instead of heuristic-but-clear numerical results.  

  **Why Philosophy (Not Just Quants)?**  
  Quants optimize *within* frameworks; philosophers scrutinize the frameworks themselves. This project challenges Kelly’s core assumption (stationarity) that quants often take for granted. We bridge decision-theoretic foundations (what makes a "rational" strategy?) with real-world constraints (non-ergodic opportunity streams). The panel gets a mathematically rigorous *and* conceptually coherent account of why practitioners "miscount" optimality—which is philosophy’s wheelhouse.  

  ---  
  **Key Adjustments from Your Pitch:**  
  - Question sharpened to *constant fraction* and *contrast with existing justifications*.  
  - Method prioritizes *computational clarity* over theorem-proving (aligns with 9mo timeline).  
  - Deliverable is *actionable insight* (not a theorem).  
  - Failure modes target *core thesis vulnerability* (c not emerging) and *practical runway risk* (over-mathing).  
  - Philosophy’s role framed as *assumption auditing* + *foundations-linking*, not "soft" thinking.
