answer: |-
  ### Jurisprudence Final Paper Question  
  **Question 3: Self-Amendment and Legal Paradox in Aurinia**  
  *(Answer this question in no more than 2,500 words)*  

  The Republic of Aurinia’s Instrument of Rules (Rules 1–6) governs constitutional change. In Year 12, the Assembly enacted the *Reform of Rules Act* (RRA) purporting to:  
  - Repeal Rule 2 (entrenching Rule 1);  
  - Amend Rule 1 to require only a simple majority;  
  - Exempt itself from Rules 3 (voiding inconsistent amendments) and 5 (desuetude);  
  - Take effect retroactively.  

  The Keeper refused to register it (Rule 6). From Year 12–30, fourteen statutes were enacted under the RRA’s simple-majority rule, applied by courts, and registered. Rule 2 and Rule 5 were not applied or affirmed. In Year 30, a litigant challenges Statute No. 9’s validity.  

  **Address the following:**  
  **(a)** Distinguish *amending Rule 1’s procedure*, *amending Rule 2’s scope*, and *exercising a power derived from Rule 2*. Did the RRA attempt all three? *(Guidance: 300 words)*  
  **(b)** Could the Assembly have validly amended Rule 1 via Rule 2’s unanimous-referendum procedure? Does Rule 3 prevent this? Could Rule 3 protect Rule 2 if Rule 3 itself is unentrenched? *(Guidance: 500 words)*  
  **(c)** Can Rule 5 (desuetude) lapse under its own terms? Can a rule exempt itself from Rule 6 (registration)? *(Guidance: 400 words)*  
  **(d)** If the RRA’s retroactivity violates Rule 4, does this invalidate the fourteen statutes? Does this rupture constitute revolution or continuity? By what criterion? *(Guidance: 500 words)*  
  **(e)** *Either* redraft Rule 2 to block the “two-step manoeuvre” *or* argue why no rule can be immune to amendment. *(Guidance: 300 words)*  

  ---

  ### Model Answer (912 words)  
  **Thesis:** The RRA was void *ab initio*, but the subsequent practice constituted a revolutionary shift validating the fourteen statutes. Rule 2’s entrenchment was binding until circumvented by extra-legal change.  

  **(a) Distinguishing Amendment Types**  
  The RRA conflates three distinct operations. First, *amending Rule 1’s procedure* (e.g., lowering its majority requirement) alters how amendments are made. Second, *amending Rule 2’s scope* (e.g., repealing it) modifies which rules are protected. Third, *exercising a power derived from Rule 2* would require using Rule 2’s own procedure to amend Rule 1. The RRA attempted all three illicitly: it repealed Rule 2 (amending scope), relaxed Rule 1 (amending procedure), and falsely assumed Rule 2’s procedure was dispensable (misusing derived power). Crucially, Rule 2’s procedure could only be used to amend Rule 1 *if* Rule 2 remained intact—a self-consuming act.  

  **(b) The Two-Step Manoeuvre and Rule 3’s Barrier**  
  The Assembly *could* have amended Rule 1 via Rule 2’s procedure: a unanimous resolution and referendum repealing Rule 2 *after* amending Rule 1 to remove its entrenchment. This two-step manoeuvre respects Rule 2’s terms while negating its future effect. However, Rule 3 expressly voids amendments “inconsistent with Rule 2,” including attempts to undermine Rule 2 *indirectly* by first altering Rule 1. Rule 3 thus blocks the manoeuvre by protecting Rule 2’s substantive authority, not just its literal text.  

  Rule 3’s efficacy hinges on its own entrenchment. As Rule 3 lacks explicit self-entrenchment, it *could* be amended by Rule 1’s general procedure (two-thirds majority) before targeting Rule 2. Yet Rule 3’s voiding power applies *before* amendment—meaning any attempt to amend Rule 3 to weaken Rule 2 would itself be void under Rule 3. This creates a “shield”: Rule 3 is vulnerable only to amendments *consistent* with Rule 2’s permanence. Rule 2’s entrenchment is thus logically secure unless Rule 3 is first amended *under Rule 2’s procedure*—a circular impossibility.  

  **(c) Self-Application Paradoxes**  
  **Rule 5 (Desuetude):** Rule 5 cannot lapse under its own terms. Desuetude rules presuppose ongoing validity to “monitor” disuse; declaring Rule 5 dead after 15 years of inactivity would require it to bind *after* its purported demise—a contradiction. Legal systems cannot tolerate rules that self-destruct, as this would create a void with no authority to validate new norms (Kelsen’s *Grundnorm* problem). Rule 5 thus persists unless amended or voided.  

  **Rule 6 (Registration):** No rule can exempt itself from Rule 6. Rule 6 conditions validity on registration, so an unregistered rule cannot confer validity on *itself* (violating Rule 4’s non-retroactivity). The RRA’s self-exemption is a performative contradiction: it claims authority *before* fulfilling the condition for that authority. The Keeper’s refusal thus rendered the RRA stillborn.  

  **(d) Retroactivity, Revolution, and Continuity**  
  The RRA’s retroactivity violated Rule 4, compounding its invalidity. This nullity meant Rule 1 remained entrenched, rendering the fourteen statutes void *when enacted*. However, their sustained application from Year 12–30 constituted a revolutionary break. Courts applied the statutes; the Keeper registered them; officials treated Rule 1 as amended. This practice repudiated the Instrument’s amendment rules, creating a new rule of recognition (Hart) or *Grundnorm* (Kelsen).  

  The criterion for revolution versus continuity is *social efficacy*. If officials collectively accept new foundational rules, the system continues under a new basis of validity (cf. Kelsen on “legal revolution”). Here, the eighteen-year practice displaced the Instrument’s amendment hierarchy, validating the statutes retroactively *as a matter of social fact*. Rule 5 did not lapse (per (c)), but it became obsolete through revolutionary change.  

  **(e) The Impossibility of Absolute Entrenchment**  
  No redrafting can make Rule 2 eternally immutable. All amendment rules presuppose the possibility of change; entrenchment merely imposes higher hurdles. If officials uniformly disregard a rule (as with Rule 2 post-Year 12), it ceases to be practiced—demonstrating that validity rests on acceptance, not textual guarantees (Hart’s “rule of recognition”). A “perfect” entrenchment clause (e.g., “Rule 2 is unamendable forever”) would still rely on continued official obedience, which cannot be coerced textually. Law is a dynamic practice, not a logical cage.  

  **Conclusion:** The RRA failed as law. But law is not just rules—it is power and practice. The revolution after Year 12 validated the new order, making Statute No. 9 lawful *now*, however illicit its birth.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  **1. Amendment-Type Distinction (4 marks)**  
  - Full: Clearly separates procedure/scope/power derivation; applies to RRA.  
  - Common error: Conflates types or assumes RRA’s validity lets it “bootstrap” authority.  

  **2. Two-Step Manoeuvre & Rule 3 Analysis (6 marks)**  
  - Full: Engages Rule 3’s “inconsistency” clause; debates whether it blocks indirect attacks; examines Rule 3’s (un)entrenched status.  
  - Common error: Assumes Rule 2’s procedure could amend Rule 1 without self-destruction, ignoring Rule 3.  

  **3. Self-Application (Rule 5 & 6) (5 marks)**  
  - Full: Argues Rule 5 cannot self-lapse (temporal paradox); argues Rule 6 exemption is circular (retroactivity issue).  
  - Common error: Assumes Rule 5 lapsed via disuse or that RRA’s exemption is valid.  

  **4. Retroactivity/Revolution Criterion (6 marks)**  
  - Full: Treats RRA’s invalidity as cascading; uses efficacy/official practice to justify revolutionary shift; cites Hart/Kelsen.  
  - Common error: Claims statutes are valid/invalid *only* via original rules, ignoring revolutionary change.  

  **5. Entrenchment Redrafting/Reflection (4 marks)**  
  - Full: Redrafts Rule 2 intelligently (e.g., “No rule may amend Rules 1–3”) OR argues persuasively for amendability’s inevitability.  
  - Common error: Proposes redrafts ignoring meta-entrenchment paradoxes.  

  ---

  ### Markers’ Notes  
  **Strongest Wrong Answer:** The “Acquiescence as Validation” argument. Claims that 18 years of official practice (court applications, Keeper’s registrations) *alone* validate the RRA and statutes under the *original* rules, rendering Rule 2 and 5 obsolete without revolution. This overlooks the initial voidness of the RRA (Rules 3, 4, 6) and mistakes *post hoc* efficacy for *ab initio* validity. Reward up to 18/25 if well-argued but deduct in §2–4.  

  **Full Marks for Opposite Conclusion:** In §3 (Rule 5), if a candidate argues *brilliantly* that Rule 5 *can* self-lapse (e.g., “desuetude is a meta-rule operating outside its own validity”), award full §3 marks (5/5) even if contrary to the model. Focus on coherence, not agreement.
