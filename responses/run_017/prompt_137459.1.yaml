prompt: |-
  My lab has started reporting self-consistency numbers on evals: sample the model k times at temperature 0.8, take the most common answer, report that. One guy on the team insists this is literally an instance of the Condorcet jury theorem — each sample is a voter with competence p > 1/2, the votes are independent, so majority accuracy goes to 1 as k grows, and we can pick k the way youd size a jury. He also wants to weight samples by the models own confidence score, on the grounds that better voters should count more; that bit i think is importing something the theorem doesnt say, since the version i know is equal-weight majority over voters with the same p.

  Can you audit the analogy? Give me the correspondence table — what plays the role of the voter, of p, of independence, of the binary proposition, of the truth — and then the places the mapping breaks. The ones i care about: our votes come out of one model with shared weights and shared pretraining, so they have a common cause (is that like a jury with a shared bias, and how much correlation does the theorem tolerate before the result stops holding?); the theorem is binary but our majority is over an open answer space, or over 4–5 options when its multiple choice (does the guarantee weaken as options multiply, and in what way?); and p is a property of voters, whereas what we vary is the *question* — on the hard items wed actually bother running this on, per-sample accuracy could be under half, and then majority makes things worse. In practice our gains flatten out around k = 5, which seems to tell against the asymptotic story.

  Then: does the conclusion he wants — its not a hack, its asymptotically justified, we can buy accuracy with compute — survive, or was the analogy carrying it? And if theres a better thing to compare k samples to than k jurors, say what. Please separate whats just the mathematics under stated assumptions from whats genuinely contested among people who work on this.
reasoning: |-
  Okay, the user is asking about the Condorcet jury theorem and how it applies to their lab's self-consistency evaluation method. They sample a model k times at temperature 0.8, take the most common answer, and report that. One team member thinks it's exactly like the theorem, where each sample is a voter with competence p > 0.5. But the user has concerns about the analogy breaking down in several areas.

  The key concerns are: shared weights and pretraining creating a common cause (like jury bias), the open answer space vs binary choices, varying p per question especially on hard items where accuracy might be below 0.5, and the practical observation that gains flatten at k=5. Plus, the team member wants to weight by confidence scores, which isn't in the standard theorem.

  First, I need to recall the Condorcet jury theorem. It states that for independent voters each with competence p > 0.5, majority voting accuracy approaches 1 as k increases. The user is right to question independence because the model's samples aren't truly independent due to shared parameters and pretraining. This common cause could introduce correlation, making the theorem's assumptions invalid. Even small correlations can hurt the convergence.

  Then there's the issue of multiple choices. The theorem is for binary decisions, but their evals might have 4-5 options or even open answers. For multiple choices, the most common answer isn't necessarily the correct one unless p is high enough. The probability of correct majority vote drops as options increase, especially if the model is uncertain. The user mentioned that for hard questions, p could be less than 0.5. In such cases, increasing k might make things worse, which aligns with the theorem requiring p>0.5.

  The flattening at k=5 suggests diminishing returns. This could be due to correlation or that p isn't consistently above 0.5. Plus, weighting by confidence scores isn't covered by Condorcet. If the confidence scores are well-calibrated, it might help, but if not, it could introduce noise. Other methods like weighted voting or Bayesian approaches might be better but aren't straightforward.

  The user needs to know if the asymptotic justification holds. Given the violations, it's shaky. The gains they see might be due to averaging out noise rather than true majority improvement. They should consider alternative explanations like model uncertainty. For practical purposes, using k=5 makes sense if gains plateau, but they should monitor per-question performance and be cautious on hard items.

  The user's deeper concern is whether this method is scientifically valid or just a hack. They want to ensure their evaluation methodology is sound. The analogy to Condorcet is useful but overextended. They should look into ensemble methods or statistical aggregation literature for better comparisons. Emphasizing the limitations and suggesting empirical validation would address their unspoken need for robust and reliable evals.
answer: |-
  Here's a breakdown of the Condorcet Jury Theorem (CJT) analogy for self-consistency sampling, its correspondence, limitations, and whether the core conclusion holds:

  **Correspondence Table (The Analogy):**

  | CJT Concept                | Self-Consistency Sampling Equivalent        |
  | :------------------------- | :------------------------------------------ |
  | **Voter**                  | A single model sample (`k` samples total).  |
  | **Competence (p)**         | Probability a *single sample* is correct.   |
  | **Independence**           | Statistical independence of samples.        |
  | **Binary Proposition**     | The specific question being evaluated.      |
  | **Truth**                  | The "correct" answer for the question.      |
  | **Vote**                   | The answer generated by a single sample.    |
  | **Majority Vote**          | The most frequent answer across `k` samples.|
  | **Jury Size (k)**          | The number of samples (`k`).                |
  | **Majority Accuracy**      | Accuracy of the most frequent answer.       |

  **Where the Analogy Breaks (Limitations & Challenges):**

  1.  **Independence & Common Cause (The Core Problem):**
      *   **CJT Assumption:** Voters are statistically independent.
      *   **Reality:** Model samples share:
          *   **Identical Architecture & Weights:** They are fundamentally the *same* model.
          *   **Identical Pretraining Data:** They share all prior knowledge/bias.
          *   **Identical Prompt/Context:** They receive the exact same input.
      *   **Consequence:** Samples are **not independent**. Errors are **correlated**. Common failure modes exist. If the model misunderstands the prompt, all samples are likely wrong. If it has a factual blind spot, all samples share it.
      *   **Impact:** This violates the CJT's core assumption. **The asymptotic guarantee (accuracy -> 1 as k -> infinity) breaks completely.** Correlation introduces a "shared bias" that the theorem cannot handle. The majority vote converges to the model's *mode* given the prompt/temperature, which may *not* converge to the truth if the model itself is systematically biased or wrong on that question. Even small correlations drastically slow convergence and lower the asymptotic accuracy ceiling.

  2.  **Binary vs. Multiple Choice / Open Ended:**
      *   **CJT Assumption:** Binary choice (True/False).
      *   **Reality:** Typically 4-5 options (MCQ) or open-ended generation.
      *   **Consequence:** "Most common" != "Majority" (>50%). It could be a plurality. **The CJT guarantee weakens significantly as the number of options increases.**
          *   For `m` equally likely wrong answers, the probability the correct answer gets the most votes requires `p` to be much higher than 1/2 to achieve high accuracy as `m` grows.
          *   The "competence" needed for the correct answer to be the most frequent increases with `m`.
          *   The theorem for `m`>2 (Condorcet extensions) shows plurality voting accuracy is generally lower than majority voting accuracy for the same `p` and `k`, and the convergence rate is slower.

  3.  **Varying `p` per Question (Especially p < 1/2):**
      *   **CJT Assumption:** Constant `p > 1/2` across all voters and questions.
      *   **Reality:** `p` depends *heavily* on the **question difficulty**.
          *   Easy Questions: `p` might be high (>0.9).
          *   Hard Questions: `p` can be **< 0.5** (below chance for MCQ, very low for open-ended).
      *   **Consequence:**
          *   **On Easy Questions (p high):** Self-consistency helps slightly (reduces variance), but gains are small if `p` is already near 1.
          *   **On Hard Questions (p < 1/2):** This is catastrophic for CJT logic. **Majority/plurality voting makes performance *worse* than a single sample.** More samples amplify the error. The theorem explicitly requires `p > 1/2` for the benefit. Your observation of gains flattening at k=5 strongly suggests you are often operating in regimes where `p` is not consistently high enough *or* correlation dominates.

  4.  **Weighting by Confidence:**
      *   **CJT Assumption:** Equal weight per voter.
      *   **Proposal:** Weight samples by the model's confidence score.
      *   **Analysis:** This is **not supported by the standard CJT**. The theorem assumes homogeneous competence `p`. Weighting introduces heterogeneity. Whether this helps depends critically on:
          *   **Calibration:** Are high-confidence samples *actually* more likely to be correct?
          *   **Correlation:** Are confidence scores themselves correlated across samples? (They likely are).
      *   **Potential Outcome:** If confidence is well-calibrated and *somewhat* independent across samples, weighting *could* improve accuracy over simple plurality. However, it introduces complexity and potential pitfalls if calibration is poor or confidence is spuriously high on wrong answers. Other aggregation methods (e.g., Bayesian model averaging using logprobs) might be theoretically cleaner for weighted aggregation.

  **Does the Core Conclusion Survive?**

  *   **"It's asymptotically justified (accuracy -> 1 with k)":** **No, this conclusion does not survive.** The violations of independence and constant `p > 1/2` (especially on hard questions) completely invalidate the asymptotic guarantee. The convergence to 1 is a mathematical consequence of the CJT assumptions that simply do not hold for sampling from a single LLM. Your observed flattening at k=5 is strong empirical evidence against asymptotic improvement.
  *   **"We can buy accuracy with compute (k)":** **This conclusion is *partially* true, but nuanced and limited.**
      *   **On easier questions (high p, lower correlation):** Increasing `k` *can* buy a modest accuracy boost by averaging out *some* sampling noise/variance. Gains are real but quickly diminishing (as you see by k=5).
      *   **On hard questions (low p, high correlation):** Increasing `k` often provides negligible gains, can hurt performance (`p < 1/2`), or simply converges to the model's stubbornly wrong mode.
      *   **Cost:** The accuracy gain per unit of compute (cost of `k` samples) decreases rapidly and plateaus early. Doubling `k` from 5 to 10 often yields minimal extra gain for significant cost.
  *   **"It's not a hack":** Self-consistency *is* a practical and often effective technique, especially for MCQ where `p` is generally > 1/2. However, **framing it as a direct application of the CJT with its strong guarantees *is* misleading.** Its success relies more on practical effects (reducing variance, stabilizing to the model's mode) than on the CJT's mathematical foundation.

  **Better Analogies than k Jurors:**

  1.  **Ensemble of Weak Learners (Correlated):** Think of the `k` samples as a very correlated ensemble. The goal is model averaging/variance reduction, but the high correlation limits gains. Techniques for correlated ensembles are relevant.
  2.  **Monte Carlo Estimation of Model Mode:** Self-consistency sampling is essentially using Monte Carlo sampling (at temperature 0.8) to estimate the most probable output (the mode) of the model's conditional distribution `P(answer | prompt)`. The accuracy of the mode *as an estimate of the truth* depends entirely on how well-calibrated and unbiased the model's distribution is for that specific question.
  3.  **Aggregation Under Uncertainty:** It's a method to aggregate multiple stochastic predictions from the same uncertain source to find a more stable point estimate. Statistical aggregation methods (mean, median, mode) under correlation are the relevant framework.
  4.  **Amplifying Signal vs. Noise:** For questions where the model *has* signal (p > 1/2), sampling helps average out the *noise* in generation. For questions where the model lacks signal (p ~ 1/m or p < 1/2), it just amplifies the noise or bias. The key is the model's inherent capability on the task.

  **The Mathematics vs. The Contested Reality:**

  *   **Mathematics (Under CJT Assumptions):** If voters are truly independent *and* have constant `p > 1/2`, then majority accuracy *does* increase to 1 as `k` increases. This is an ironclad mathematical theorem.
  *   **Contested Reality (LLM Self-Consistency):** Researchers agree the CJT assumptions **do not hold perfectly** for LLM sampling. The **degree** to which they are violated and the **practical impact** are key points:
      *   **Correlation:** How strong is the correlation between samples? Does it decay with `k`? How does architecture/temperature affect it? (Empirical studies show correlation is significant).
      *   **Effective p:** What is the *effective* competence `p` on *real-world evaluation items*, especially the hard ones we care about? (Often estimated to be below 0.5 on challenging benchmarks).
      *   **Practical k:** Why do gains plateau at small `k` (like 5)? Is it primarily due to correlation, insufficient `p`, or both? (Consensus: Correlation and the rapid diminishing returns of variance reduction play major roles).
      *   **Value:** Despite the violations, is self-consistency still a valuable, cost-effective technique for boosting eval scores on common benchmarks? (Consensus: Yes, empirically it often is, especially for MCQ, hence its popularity).

  **Conclusion:** While the CJT provides an intuitive starting point, **the analogy is deeply flawed** due to violation of independence and the variable/question-dependent nature of `p`. The asymptotic guarantee does not hold. The observed plateau at small `k` is expected. Self-consistency primarily works by stabilizing output towards the model's mode and reducing variance on questions where the model has reasonable inherent accuracy (`p > 1/m`), not by magically converging to truth via independent jurors. Weighting by confidence is an empirical heuristic, not supported by CJT. Treat self-consistency as a practical variance-reduction technique with diminishing returns, not as an asymptotic truth-revelation mechanism justified by the Condorcet Jury Theorem. For sizing `k`, empirical testing on your specific task/data (like you've done) is far more reliable than CJT-based jury sizing formulas.
