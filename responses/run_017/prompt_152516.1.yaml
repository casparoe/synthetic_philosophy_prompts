answer: |-
  **Justice, Force**  

  What justice dreams, force must enact.  
  *Justice is endlessly disputed.*  
  The strong command, the weak contract—  
  *But force is recognized, undoubted.*  

  *Justice is endlessly disputed:*  
  We clothe the strong in ermine robes.  
  *But force is recognized, undoubted*  
  Where judgment sits, and peace is kept.  

  We clothe the strong in ermine robes:  
  *What’s strong is just, since just is weak.*  
  Where judgment sits, and peace is kept,  
  The law must bow to what holds power.  

  *What’s strong is just, since just is weak.*  
  The strong command, the weak contract—  
  The law must bow to what holds power.  
  What justice dreams, force must enact.  

  Summary: The strong become just at the moment the robes transform might into right, and the circle’s return reveals no ground beyond its borrowed light.

  ### Notes on Structure
  - **Line Recycling**: Each stanza’s 2nd and 4th lines become the next stanza’s 1st and 3rd, mimicking how authority borrows legitimacy.  
  - **Meaning Shifts**:  
    - *"The strong command, the weak contract"* shifts from describing force (Stanza 1) to lamenting justice’s concession (Stanza 4).  
    - *"Justice is endlessly disputed"* begins as critique (Stanza 1), becomes justification for force’s symbols (Stanza 2).  
  - **Circularity**: The opening/closing line (*"What justice dreams, force must enact"*) frames the poem as an inescapable system.  
  - **Tone**: Verbs like "kept," "bow," and "holds" emphasize stability over cynicism; "ermine robes" and "room" invoke Pascal’s theatrical legitimacy.  
  - **Summary**: Pinpoints the substitution (line 11: *"What’s strong is just"*) and the return’s implication: no external audit exists.
