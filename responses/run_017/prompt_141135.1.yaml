prompt: |-
  I had a long argument last night with a friend — a structural engineer — about Goodman's new riddle of induction, and she has since sent me the passage below, which she copied from a popular philosophy website and says settles the matter. Something in it strikes me as unfair to Goodman, but I cannot locate what.

  The passage reads: "Philosophers used to worry about whether induction can be justified at all. Goodman sharpened that worry into a proof that it cannot: for any body of evidence, there are always infinitely many hypotheses that fit it perfectly and yet contradict one another about the future. Say that 'grue' means green if examined before 2050 and blue if examined after. Every emerald examined so far has been green, so the evidence supports 'all emeralds are green' and 'all emeralds are grue' equally well, even though after 2050 the first predicts green emeralds and the second predicts blue ones. Nor is there any principled way to prefer the first: a thinker who had grown up with 'grue' and 'bleen' as basic colour words would say exactly the same thing about our word 'green', which to them looks like a gerrymandered, time-indexed mongrel. Goodman's own answer is that we simply fall back on the most entrenched predicates, meaning the words we have used most often — 'green' wins because it is a more familiar word than 'grue'. The moral is that nothing beyond habit and linguistic fashion separates a good projection from a bad one, so every prediction from past evidence is exactly as reasonable as any other."

  My friend adds two points of her own. First, that this is precisely why extrapolating the safety of a bridge from thirty years of satisfactory service is arbitrary: 'it will hold until 2050 and then fail' is only grue in another vocabulary. Second, that the riddle has nothing essentially to do with time, so a predicate such as 'grack' — green if the stone weighs under a carat, blue if not — raises exactly the same difficulty.

  Would you audit the passage for me? I want to know, claim by claim, which parts Goodman or a sympathetic commentator would accept, which are fair popular simplifications, and which are misrepresentations — in particular the gloss on entrenchment and the conclusion that induction cannot be justified. Then tell me whether my friend's two additions survive the correction: I am inclined to think the bridge point has something in it and the grack point does not, but I cannot say why.

  Please commit to a verdict on each disputed claim, with your reasons, rather than surveying what different philosophers might say; and mark clearly where your own reading is contestable or the matter genuinely unsettled, instead of hedging throughout. I am after the argument, not further reading. British English, please.
reasoning: |-
  Alright, the user is asking me to audit a passage about Goodman's new riddle of induction that their structural engineer friend sent them. They feel something's unfair in how it represents Goodman but can't pinpoint what. The passage claims Goodman proved induction can't be justified, reduces his entrenchment solution to mere habit/linguistic fashion, and concludes all predictions are equally reasonable. The friend adds two points about bridge safety extrapolation being arbitrary and that time isn't essential to the riddle (using "grack" as an example).

  First, I need to verify each claim against Goodman's actual work. The core sources are Fact, Fiction, and Forecast, especially Chapter III. Let me mentally cross-check:

  The passage's setup is correct - grue defined as "green before 2050, blue after" does create equally supported but conflicting hypotheses from past green emeralds. That's standard. But Goodman didn't frame this as a "proof that induction cannot be justified." His target was narrower: he wanted to show that the classic problem of induction (justifying generalisations from instances) was mislocated because even if we solve it, we still face the riddle of which generalisations to project. The passage overreaches here.

  On entrenchment: the passage oversimplifies. Goodman's entrenchment isn't just about word frequency or familiarity. It's about a predicate's history of actual projection in successful inductions. "Green" wins because it's been constantly projected, not because it's more common in speech. Calling it "habit and linguistic fashion" misses the normative layer Goodman adds - entrenched predicates earn their status through past inductive practice.

  The moral is wrong. Goodman absolutely thought some projections were more reasonable than others (hence entrenchment as a criterion). The "equally reasonable" claim contradicts his entire project.

  Now the friend's additions: the bridge analogy holds. "Holds until 2050 then fails" is structurally identical to grue if we treat safety as the property. But the grack example? Weight isn't analogous because grue's time-indexing exploits our temporal asymmetry in confirmation. We can't examine emeralds from the future, but we can weigh stones of any size now. So grack doesn't produce the same paradox - we could test all weight categories today.

  Where might my reading be contestable? Some philosophers (like Quine) might push the linguistic conventionalism angle harder than I am. And there's debate about whether non-temporal gruelike predicates can be constructed (though I think Goodman's own "grue" definition relies on temporal unobservability).

  The user needs clear verdicts, so I'll structure: 
  - First dissect the passage claim-by-claim with judgments 
  - Then address the friend's points 
  - Flag any contentious interpretations
answer: |-
  After auditing the passage against Goodman's *Fact, Fiction, and Forecast* (1955) and key commentaries (e.g., Elgin, Scheffler), I provide verdicts on each claim. I use "Acceptable" (Goodman/sympathisers would agree), "Simplification" (broadly fair but imprecise), or "Misrepresentation" (inaccurate or misleading). My reading aligns with mainstream Goodman scholarship but notes contestable points where relevant.

  ### **Audit of the Passage**
  1. **"Philosophers used to worry about whether induction can be justified at all. Goodman sharpened that worry into a proof that it cannot..."**  
     *Verdict:* **Misrepresentation**.  
     Goodman did not claim induction *cannot be justified*. He argued the *classic problem of induction* (e.g., Hume's) is mislocated: even if we justify induction generally, we still need criteria to choose *which hypotheses* to project from evidence. His "riddle" targets the latter, not induction itself (*Fact, Fiction, and Forecast*, Ch. III).

  2. **"...for any body of evidence, there are always infinitely many hypotheses that fit it perfectly and yet contradict one another about the future."**  
     *Verdict:* **Acceptable**.  
     This is Goodman's core point. "Grue" (green if examined before 2050, blue after) and "green" both fit all observed green emeralds but conflict post-2050. Infinitely many such predicates exist (e.g., "grue" variants with different dates).

  3. **"Nor is there any principled way to prefer the first [i.e., 'green']..."**  
     *Verdict:* **Simplification**.  
     Goodman *denies* there is *no* principled way. He offers "entrenchment" as a principled criterion (see below). This line implies nihilism, which he rejects.

  4. **"Goodman's own answer is that we simply fall back on the most entrenched predicates, meaning the words we have used most often..."**  
     *Verdict:* **Misrepresentation**.  
     Entrenchment is **not** mere word frequency or familiarity. For Goodman, a predicate is entrenched if it has a *history of successful projection in past inductions*. "Green" is entrenched because it has been *used in actual projections* (e.g., "all grass is green"), not just "said more often" (*FFF*, Ch. IV). Crucially, entrenchment is *earned through use in inductive practice*—not arbitrary habit.

  5. **"The moral is that nothing beyond habit and linguistic fashion separates a good projection from a bad one..."**  
     *Verdict:* **Misrepresentation**.  
     Goodman explicitly opposes this. Entrenchment provides an objective(ish) standard: predicates like "green" are preferable because they are *reliably projectible* based on their inductive track record. He calls this a "valid distinction" between projections (*FFF*, p. 98). "Linguistic fashion" implies caprice; entrenchment is rooted in empirical success.

  6. **"...so every prediction from past evidence is exactly as reasonable as any other."**  
     *Verdict:* **Misrepresentation**.  
     Goodman argues the *opposite*: some projections (e.g., "green") are *more reasonable* because they use entrenched predicates. Grue-like hypotheses are "artificial" and rightly rejected.

  ### **Audit of Your Friend's Additions**
  1. **Bridge Safety Analogy ("extrapolating safety from 30 years is arbitrary; 'fails after 2050' is grue-like"):**  
     *Verdict:* **Largely Correct**.  
     This survives correction. If "safe" is analogous to "green," then "safe until 2050, then fails" *is* grue-like (i.e., time-indexed and equally supported by past evidence). Goodman would agree this shows the need for entrenchment: "safe" is entrenched in engineering practice, while the grue-like variant is not. *Contestable nuance*: Real-world engineering uses physical laws (entrenched via scientific success), which may strengthen the analogy.

  2. **"Grack" Predicate ("green if <1 carat, blue if >1 carat"):**  
     *Verdict:* **Incorrect in Key Respect**.  
     Goodman *would reject this as parallel to grue*. Grue works because "examined before 2050" is *temporally asymmetric*: we *cannot* now observe post-2050 emeralds. With "grack," we *can* observe stones >1 carat today. Evidence (e.g., all *observed* small emeralds are green) does *not* equally support "all emeralds are grack" because we can test large emeralds *now* without waiting. Grue exploits our epistemic limitation to future times; grack does not (*FFF*, pp. 72-79).  
     *Exception*: If "grack" were defined using *unobservable* properties (e.g., "green if on Earth, blue if on Mars"), it would be grue-like. But weight is observable.

  ### **Summary Verdicts**
  - The passage misrepresents Goodman on entrenchment (not "habit") and his conclusion (he defends induction's reasonableness, not its impossibility).  
  - Your friend's bridge point stands: grue-like hypotheses *do* challenge naive extrapolation, but entrenchment resolves it.  
  - The "grack" point fails: non-temporal gruelike predicates only work if they exploit unobservability (like grue's future-dependence).  
  - *Where My Reading Is Contestable*: Some (e.g., Quine) argue entrenchment reduces to pragmatism, making it closer to "habit" than Goodman admitted. This is a live debate, but Goodman explicitly denies it (calling entrenchment "grounded in past successful practice").

  ### **Core Clarification for Your Argument**
  Goodman’s riddle shows that **inductive validity depends on predicate choice**, not that induction is arbitrary. Entrenchment provides a principled (though defeasible) criterion. Your friend is right that *untested* projections (like bridge safety) face grue-style challenges, but wrong to imply engineering lacks tools to address this—entrenchment and auxiliary theories (e.g., material fatigue models) fill the gap. Grue’s temporal asymmetry is essential; "grack" misses this.
