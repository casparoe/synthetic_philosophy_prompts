  We are given an argument against perceptual justification that generalizes to scepticism about all justification. The argument is:

  (1) A state S can justify a belief that p only if S's obtaining and being the state it is does not depend on the subject's already believing that p.
  (2) Perception is supposed to provide reasons independently of the rest of what we believe.
  (3) Perceptual experience is penetrated in the causal (P1) and content (P2) senses by prior cognitive states (including beliefs) in a Bayesian framework.
  (4) For any perceptual belief that p based on experience E, E's content is fixed partly by prior states that include beliefs about p (or priors that are residues of such beliefs).
  (5) Therefore, by (1) and (4), E cannot justify the belief that p.
  (6) Hence, no perceptual belief is justified by experience; it's really inferential.
  (7) But (1) applies equally to memory and inference, leading to scepticism.
  (8) Therefore, nothing is ever justified.

  The user finds three problems:
  - The inversion: the expert's penetrated experience is less justificatory than the novice's, which is counterintuitive.
  - The asymmetry: penetration by non-doxastic states (moods, etc.) is not problematic by (1), but by beliefs it is, even if the mechanism is the same.
  - The slide from (6) to (8): perhaps the parity claim in (7) is false, so only perception is threatened.

  The user is attached to (3) (the Bayesian psychology) and would like to keep (2) if possible.

  We must reject a step or a premise.

  Diagnosis:

  The key flaw is in step (5). The move from (4) to (5) via (1) is invalid because condition (1) is misapplied. Specifically, condition (1) requires that the justifying state S (here, the experience E) not depend on the subject's *already believing that p*. However, in the Bayesian story, the prior that shapes E is not necessarily the belief that p, but rather a set of priors that may include general beliefs about the world, which are not identical to the belief that p.

  Moreover, the dependency in (4) is not the kind of dependency that (1) is concerned with. Condition (1) is about the state S (E) being such that its occurrence or content is dependent on the subject's *current belief that p*. But in the Bayesian picture, the priors that shape E are typically not the current belief that p but more general background knowledge. Furthermore, the prior might not be a belief that p at all, but a set of statistical expectations that are not explicitly believed.

  Let me break it down:

  1. Condition (1) is meant to prevent circularity: if S depends on the subject already believing p, then using S to justify p would be circular. But in the case of perception, the prior that shapes E is not the belief that p. For example, in the bird case, the expert has a prior that certain features are diagnostic of a species, not necessarily a prior that p (where p is "this is a second-winter gull of species X"). The prior is a general belief about bird features, which then, in combination with the current input, leads to the experience as of p.

  2. The dependency in (4) is not on the belief that p, but on other beliefs. For instance, the expert's prior might be a belief that "gulls with these markings are second-winter individuals of species X", but that is not the same as believing p (which is about this particular bird). The prior is a general belief, and it is used to interpret the current input. The prior is not the belief that p about this bird.

  3. Therefore, the experience E does not depend on the subject already believing p (the particular proposition in question). It depends on other beliefs that the subject has. Condition (1) does not require that the justifying state be independent of all beliefs, only that it not depend on the very belief it is supposed to justify.

  So step (5) does not follow because (4) does not establish that E depends on the subject's belief that p. It only establishes that E depends on some prior cognitive states, which may be related to p but are not the belief that p.

  Why did step (5) look sound? Because one might conflate the dependency on beliefs in general with dependency on the specific belief that p. The argument slides from "depends on prior beliefs (some of which are about p-like matters)" to "depends on the belief that p". But that is a mistake.

  Now, what about the symptoms?

  First symptom: the inversion. The expert is in a better epistemic position. On the above diagnosis, the expert's experience is not disqualified by (1) because it does not depend on the expert already believing that p (about this bird). The expert might not have formed any belief about this bird until she sees it. Her priors are general, and they make her experience more reliable. So the expert's experience can justify p.

  Second symptom: the asymmetry. If penetration is by a mood, then there is no belief at all involved, so condition (1) is not triggered because (1) is about dependency on the belief that p. But in the case of belief penetration, if the prior is the belief that p, then it might be problematic. However, in the typical case, the prior is not the belief that p (the particular proposition) but a general belief. But if the prior were the belief that p, then condition (1) would indeed be violated. That is, if the experience E is shaped by the prior belief that p (about this bird), then E cannot justify p. But that is as it should be: if you already believe p and that prior belief causes you to have an experience as of p, then that experience is not an independent reason for p.

  However, in the normal case of expertise, the prior is not the belief that p (about this bird) but a general belief. Therefore, there is no asymmetry: penetration by a mood does not involve any belief, so condition (1) is not violated. Penetration by a general belief does not violate condition (1) because it is not the belief that p. Only penetration by the very belief that p would be problematic.

  Now, what about the third symptom? The slide to scepticism. If we reject step (5) as above, then we stop at (4) and do not get (5) and (6). Therefore, perception can justify. Moreover, memory and inference: condition (1) would only be violated if the memory state or the inference depends on the very belief it is supposed to justify. For memory, if I remember that p and my memory is shaped by my current belief that p, then it might be circular. But typically, memory is not shaped by the current belief about the particular episode. Similarly for inference: the inputs to an inference are not the very belief that p that the inference is supposed to justify. So the parity claim in (7) is not automatically true, and we avoid scepticism.

  Alternative Rejections:

  One might reject (1). Condition (1) is a form of the no-defeater condition or a requirement of non-circularity. But it might be too strong. For example, in coherentism, a belief might be justified by a state that depends on it, as long as the system is coherent. However, the user wants to avoid that because they want perception to be independent (as in (2)). Also, rejecting (1) would make the asymmetry disappear, but it would also allow circular justifications.

  Another option: reject (4). One might deny that the priors are residues of beliefs. In the Bayesian picture, priors can be innate or acquired through non-doxastic processes. But the user is attached to (3) and the Bayesian story, so that might be costly. Moreover, in the expert case, the priors are clearly learned.

  The user might be tempted to reject (2) and accept that perception is not independent. But that would lead to the theory-ladenness problem and incommensurability, which the user wants to avoid.

  Therefore, the best option is to reject the move from (4) to (5) by clarifying that the dependency in (4) is not on the belief that p but on other beliefs. This saves (2) and (3).

  But note: what if the prior is the belief that p? For example, if I believe that the bird is a second-winter gull (say, because someone told me) and then I look and have an experience as of that, then that experience would be shaped by the prior belief that p. Then condition (1) would be violated. But that is correct: in such a case, the experience is not a good reason for p because it is biased by the prior belief. The expert, however, typically does not have a prior belief that p about this bird. She has general beliefs that allow her to interpret the bird.

  So the argument only works in cases where the prior is the very belief that p. In those cases, the experience is not justificatory. But in normal perception, the priors are general, so the experience can justify.

  What about the novice? The novice's experience is not penetrated by beliefs about birds, so it is independent in the sense of (1). But it is less informative. However, condition (1) is only a necessary condition, not sufficient. The novice's experience might justify the belief that there is a grey-and-white bird, but not the species. The expert's experience justifies more because it is more specific and reliable. There is no inversion.

  In summary:

  - Reject step (5): the move from (4) to (5) is invalid because (4) does not show that E depends on the belief that p, but on other beliefs. Therefore, (1) is not violated.

  - This saves perception as a source of justification.

  - It explains the inversion: the expert's experience is not disqualified and is actually better.

  - It explains the asymmetry: penetration by non-doxastic states is unproblematic. Penetration by the belief that p would be problematic, but that is not the typical case.

  - It avoids the slide to scepticism.

  Cost: We must accept that in cases where the prior is the very belief that p, the experience cannot justify p. But that is acceptable because in such cases, the experience is not independent.

  If someone were to reject this step, they might have to reject (1) or (3). Rejecting (1) would lead to circularity and would not explain the asymmetry. Rejecting (3) would deny the Bayesian psychology, which the user does not want.

  So the diagnosis is that step (5) is the flaw, and the reasoning from (4) to (5) requires an equivocation on the dependency relation.

  Final Answer:

  The step that fails is the move from (4) to (5). The mistake is that condition (1) requires independence from the very belief that p, but (4) only shows dependence on prior cognitive states that are not the belief that p (they are general beliefs). Therefore, (1) is not violated.

  Why it looked admissible: Because one might think that any dependence on prior beliefs (especially about p-like matters) would contaminate the experience. But condition (1) is specifically about the belief that p, not about any belief.

  Alternatives: 
  - Reject (1): This would avoid the problem but at the cost of allowing circular justification. It would also not explain the asymmetry (why penetration by beliefs is problematic but by moods is not) because (1) is about beliefs. Without (1), we might have to accept that even experiences shaped by the belief that p can justify p, which is counterintuitive.
  - Reject (3): This would deny the Bayesian story, which the user wants to keep.
  - Reject (2): This would mean perception is not independent, which the user wants to avoid because of theory-ladenness worries.

  The user's symptoms are resolved by rejecting step (5):
  - The inversion: The expert's experience is not disqualified and is in fact a better justification because it is more reliable and does not depend on the belief that p.
  - The asymmetry: Penetration by a mood is harmless because it doesn't involve a belief that p. Penetration by a belief that p would be harmful, but that's not the typical case. Penetration by other beliefs is harmless as long as they are not the belief that p.
  - The slide to scepticism: Since perception is saved, and the same reasoning does not apply to memory and inference (because they typically do not depend on the very belief they are supposed to justify), we avoid scepticism.

  Therefore, the recommended step to reject is step (5).
answer: |-
  ### Diagnosis of the Argument's Flaw

  The argument you reconstruct is valid in its logical structure, but it relies on a subtle equivocation in the move from (4) to (5). Specifically, **step (5) does not follow from (1) and (4) because (4) fails to establish the type of dependency that (1) requires**. I'll explain why this step fails, why it seemed admissible, what alternatives cost, and how this resolves your three symptoms (the inversion, asymmetry, and slide to scepticism). I'll also address your attachment to (3) and (2).

  #### Step-by-Step Breakdown of the Flaw
  The critical failure occurs at **step (5)**: "By (1) and (4), E cannot justify the belief that p." Here's why:

  - **Premise (1)** states that a state S (e.g., a perceptual experience E) can justify a belief that p only if S's obtaining and its being the state it is *do not depend on the subject's already believing that p*. This is a *non-circularity condition*: S must not presuppose the truth of p to avoid bootstrapping or question-begging. For example, if E's occurrence or content relied on you already endorsing p, then E couldn't impartially support p.

  - **Premise (4)** claims that in a Bayesian framework, E's content is fixed partly by prior states (e.g., beliefs or priors encoding how likely p is). Crucially, (4) emphasizes that these priors are often "the residue of [the subject's] beliefs about p-like matters."

  - **The equivocation in (5)**: (4) establishes that E depends on *prior cognitive states* (e.g., general beliefs, theories, or statistical priors related to p). However, (1) requires independence from *the specific belief that p*. These are not the same. The prior states in (4) are typically *background beliefs* (e.g., general knowledge about gull species, statistical regularities, or diagnostic features), not the *occurrent belief that p* about the specific case (e.g., "this bird is a second-winter gull"). For E to violate (1), it must depend on the subject *already holding the belief that p*—not merely on beliefs that are relevant to p or "p-like."

  In Bayesian terms, priors are often *general* (e.g., "gulls with these features are usually species X") and shaped by past experience, not by a pre-existing commitment to p in the current instance. The expert's prior is a stored template for interpretation, not a current belief about *this* bird. Thus, (4) shows dependence on *cognitively penetrated priors*, but not on the *belief that p itself*. Step (5) incorrectly conflates "depends on priors related to p" with "depends on believing p."

  **Why this step looked admissible**: The Bayesian framework (3) blurs the line between "beliefs about p-like matters" and "the belief that p." It's natural to think that if priors are "about p-like matters," they must include or imply p. But this isn't so: priors are probabilistic and general, while the belief that p is occurrent and singular. For instance, the ornithologist's prior might be "grey-and-white birds with feature F are 90% likely to be species S," not "this bird is species S." The prior informs E without presupposing p. This conflation is tempting because (1) and (4) both involve "dependence," but (1) targets a specific circularity that (4) doesn't entail.

  #### Resolving Your Symptoms
  Your three symptoms arise from the misstep in (5). Correcting it resolves all:

  1. **The inversion (expert vs. novice)**:  
     - The argument ranks the novice's experience as better justification because it's less penetrated. But with (5) rejected, the expert's penetrated experience isn't disqualified: since her priors (e.g., knowledge of gull species) aren't the *belief that p* about this bird, (1) isn't violated. Her experience is still an independent reason for p, and it's *more* justificatory because it's reliable and sensitive to evidence. The novice's experience justifies a weaker belief (e.g., "a grey-and-white bird"), not p. No inversion occurs: the expert is better off, as intuition demands.

  2. **The asymmetry (beliefs vs. moods)**:  
     - You note that penetration by a mood (e.g., hunger) doesn't trigger (1) because moods lack propositional content, so the argument ignores it. But with (5) rejected, penetration by *beliefs* isn't inherently fatal either—only penetration by the *belief that p* would violate (1). Moods and non-doxastic states don't violate (1) because they don't involve beliefs at all. Belief-based penetration (e.g., general ornithology knowledge) is harmless as long as it's not the belief that p. The asymmetry vanishes: both cases use the "same machinery," but only when that machinery depends on the *specific belief being justified* does (1) apply. This isn't gerrymandered; it's a principled distinction between *general* cognitive influence and *specific* circularity.

  3. **The slide to scepticism (from (6) to (8))**:  
     - Step (7) claims that (1) would also undermine memory and inference. But with (5) rejected, perception isn't threatened, so (6) and (7) don't follow. More importantly, memory and inference can satisfy (1):  
       - **Memory**: A memory state isn't typically shaped by the *current belief that p* (e.g., recalling an event doesn't depend on you now believing it happened; it can be caused by cues). If it were (e.g., confabulation), (1) would rightly deny justification.  
       - **Inference**: Input beliefs to an inference are not the *output belief* (e.g., inferring p from q doesn't require already believing p).  
     - Thus, the parity claim in (7) is overstated—(1) doesn't generalize to scepticism because it only forbids *specific circular dependencies*, not all cognitive influences. Scepticism is avoided.

  #### Cost of Alternatives
  If you don't reject (5), the alternatives are costlier. Here's a comparison, with your preferences in mind:

  - **Reject (1)**: This avoids (5) but at high cost. (1) is a core non-circularity constraint; without it, circular justification (e.g., E caused by belief that p justifying p) becomes possible, undermining the idea of independent reasons. It also fails to resolve the asymmetry: if you drop (1), penetration by beliefs and moods both become "harmless," but you lose the ability to explain why *biased* experiences (e.g., wishful seeing) aren't justificatory. You also sacrifice (2), as perception loses its independence. This invites scepticism or coherentism, which you want to avoid.

  - **Reject (3) (deny P2 penetration)**: You're attached to (3) for good reason—Bayesian psychology is well-supported, and denying top-down influence on content is empirically dubious. Rejecting (3) salvages (2) and (1) by making perception "purely" bottom-up, but it ignores cognitive science (e.g., predictive processing). It also doesn't resolve the inversion: the expert's superiority would need an ad hoc explanation (e.g., post-perceptual judgment), and the asymmetry becomes moot. This is a high cost for someone committed to the science.

  - **Reject (2) (deny perception's independence)**: You'd rather keep (2), and for good reason—without it, perception can't serve as a theory-neutral tribunal. Rejecting (2) might save (3) and avoid scepticism (e.g., by making justification holistic), but it forces you toward a Quinean or Kuhnian view where observation is theory-laden and incommensurability looms. This doesn't resolve the inversion (why is the expert better off?) and exacerbates your worry about adjudicating theories. High cost if you value perception's foundational role.

  - **Reject the move to (5) (as I recommend)**: This is the cheapest option. It upholds (1), (2), and (3) by clarifying that (1) only forbids dependence on the *belief that p*, not all cognitive penetration. It preserves perception's justificatory power while accommodating Bayesian psychology. The cost is accepting that *some* penetrated experiences might violate (1) (e.g., if E depends on a pre-existing belief that p), but these are pathological cases (e.g., confirmation bias), not the norm. This is a feature, not a bug: it explains why not all penetration is epistemically equal.

  #### Does (5) Require P3?
  You ask if the move from (4) to (5) implicitly relies on P3 (evidential penetration). It does not. P3 asserts that E's justificatory status depends on the epistemic status of the penetrating state. The argument never uses P3; it only needs P1 and P2. However, **P3 could be a hidden motivator for why (5) seems plausible**. If one assumes P3 (e.g., "E's status as a reason requires the priors shaping it to be justified"), then (4) and (1) might *seem* to imply (5). But this isn't necessary: the argument's error is in the equivocation noted above, not a suppressed P3. If you want to invoke P3 to *strengthen* the case against penetration, that would require independent argument (e.g., that penetration transfers justificatory burdens), but it's orthogonal to the flaw here.

  #### What If Someone Rejects This Diagnosis?
  If someone insists on (5), they owe you an account of your symptoms:
  - **Inversion**: They must explain why the expert's penetrated experience is inferior despite its reliability. This might force them to downplay reliability or embrace the counterintuitive result (e.g., "novices have purer justification").
  - **Asymmetry**: They must justify why penetration by beliefs is bad but by moods is harmless. Absent the belief-that-p distinction, this looks arbitrary, potentially requiring a dubious split between doxastic and non-doxastic states.
  - **Slide to scepticism**: They must either deny the parity in (7) (e.g., by arguing memory/inference don't depend on beliefs) or accept scepticism. The former is hard (memory is often reconstructive), and the latter is untenable.

  ### Recommendation
  Reject the move from (4) to (5). This step is the argument's linchpin, and its failure preserves perception as a source of justification while respecting Bayesian psychology and the non-circularity of reasons. It resolves your symptoms without radical costs. If you adopt this, you keep (3) and (2), avoid scepticism, and explain why penetration isn't generally fatal—only circular penetration is. This positions you to refine the Bayesian account: e.g., priors must be well-calibrated (reliable) to yield justification, but they needn't be "independent" in the strong sense (1) requires unless they encode the very belief being justified.
