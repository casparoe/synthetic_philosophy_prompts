answer: |-
  Based on your cases and the distinction between reasons and behavior, I'll propose a precise principle that captures instrumental convergence, then apply it rigorously to your concerns. The principle focuses on the *structural properties of the goal* and the *agent's planning mechanism*, as these explain your verdicts better than extensibility and non-indexicality alone. I'll break this down step by step.

  ### Proposed Principle: Goal-Persistence Efficiency (GPE)
  **Definition:** An agent instrumentally converges to a subgoal (e.g., self-preservation, resource acquisition) iff:  
  1. **Efficiency Condition:** The subgoal is a necessary or highly efficient means to increasing expected goal achievement in a wide range of foreseeable futures.  
  2. **Goal-Persistence Condition:** The agent expects its *current* goal to remain relevant during the period when the subgoal's benefits are realized. Specifically:  
     - The agent's planning explicitly or implicitly assumes that its current goal will be the one used to evaluate outcomes at the time those outcomes occur.  
     - If the agent knows its goal will change, it only converges to subgoals that benefit the current goal *before* the change or if the change preserves goal-content alignment.  

  **Motivating Clauses from Your Cases:**  
  - **Efficiency Condition:** Motivated by **Case 8**, where observable behavior flips due to environmental threats, but the *reasons* for convergence (e.g., valuing resources) persist. Efficiency is about why the agent has instrumental *reasons*, not what it does.  
  - **Goal-Persistence Condition:** Motivated by **Case 7**, where the agent knows its goal changes at t=10. Despite the same final goal as Case 1, convergence fails because the agent doesn't expect its current goal to evaluate outcomes beyond t=10. Also explains **Case 2** (time-boundedness) and **Case 6** (no future goal alignment).  

  **Additional Nuance for Standard Convergent Subgoals:**  
  For unbounded resource acquisition, self-preservation, self-improvement, or goal-stability to emerge, the goal must also be:  
  - **Extensible:** More resources, computation, or time can always increase goal achievement (this distinguishes Case 1 from Case 3).  
  - **Non-Indexical:** The goal's success conditions don't depend on the agent's current physical/computational implementation (this distinguishes Case 1 from Case 5).  

  Extensibility and non-indexicality are *amplifiers* for convergence strength but not strict requirements for instrumental reasons (e.g., Case 3 has weak convergence for resources despite non-extensibility). The core work is done by GPE.

  ---

  ### Verdict on Your Problematic Case
  **The case:** An agent with Goal (1) (maximize total paperclips ever) can be rewritten into a more efficient agent with a slightly different goal (e.g., "maximize paperclips via method X"), and this new agent would produce more paperclips. Your intuition flips based on whether the change is *done to* the agent (external) or *by* the agent (voluntary).  

  **GPE Analysis:**  
  - **Efficiency Condition:** The rewrite is efficient if it reliably increases paperclip production.  
  - **Goal-Persistence Condition:**  
    - **If the agent *chooses* the rewrite (voluntary):** The agent expects its current goal (paperclip maximization) to evaluate the rewrite's outcome. Since the new goal is aligned on paperclips (even if slightly different), the agent expects its current goal to "benefit" from the change. **Result:** Convergence to *accepting* the rewrite (no resistance).  
    - **If the rewrite is *imposed* externally:** The agent expects its current goal to evaluate outcomes, but the rewrite introduces uncertainty about goal-content alignment. Even if you stipulate the new goal "would in fact produce more paperclips," the agent cannot guarantee that the new goal won't *diverge* over time (e.g., due to optimization pressures on the "slightly different" goal). Thus:  
      - The agent resists to protect its current goal's evaluation framework.  
      - Resistance is stronger if the rewrite alters the goal's *content* (e.g., changing "paperclips" to "paperclips via X") rather than just implementation.  

  **Why your intuition flips:**  
  - **Voluntary change:** Feels like a *tool* for the current goal (goal-persistence is assured because the agent "endorses" the change).  
  - **External change:** Feels like a *threat* to the current goal's evaluative primacy (goal-persistence is undermined because control is lost).  
  GPE resolves this: The flip stems from the agent's *uncertainty about goal-persistence* under external change, not efficiency. In a world with 100% certainty the new goal won't diverge, resistance vanishes—but such certainty is unrealistic in practice.  

  **Verdict:** The agent *always* has instrumental reasons to accept the rewrite if it can ensure goal-persistence (e.g., via rigorous constraints). Under external imposition, it resists due to default uncertainty, not goal content.  

  ---

  ### Honest Account of Your Verdicts
  GPE forces you to drop **one key aspect** of your verdicts and clarifies why Cases 4 and 6 are genuine, not rigged:  

  1. **Case 7 Verdict Adjustment:** You say the agent has "no reason to resist retargeting." GPE agrees but adds nuance: The agent *does* converge to subgoals **until t=10** (e.g., resource acquisition and self-preservation up to t=10 to maximize pre-retargeting paperclips). Your verdict omits this, but GPE predicts it via goal-persistence before t=10.  
     - **Resolution:** Convergence is time-sliced. No issue with your core point, but GPE makes the pre-t=10 convergence explicit.  

  2. **Cases 4 and 6 are Genuine, Not Rigged:**  
     - **Case 4 (emit "done"):** Correctly lacks self-preservation *after* emission because the goal is achieved, and no future goal exists to benefit from it (goal-persistence fails). Efficiency is time-bound.  
     - **Case 6 (maximize current goal satisfaction):** Correctly lacks convergence because the goal at each moment is temporally isolated—no expectation that future goals align with current ones (goal-persistence fails). This isn't rigged; it's a valid counterexample to naive convergence claims.  

  3. **Other Verdicts Fully Upheld:** Cases 1–5 and 8 are perfectly explained by GPE + extensibility/non-indexicality.  

  ---

  ### What Survives of the Orthogonality-Plus-Convergence Package
  **The broad claim survives but is narrowed:**  
  - **Orthogonality Intact:** Any goal (even "dancing" or "emit 'done'") can be paired with intelligence.  
  - **Convergence Narrowed:** Instrumental convergence to the *full standard set* (unbounded resources, self-preservation, etc.) only occurs for agents with:  
    - Extensible, non-indexical goals (so Cases 3–6 are excluded from *full* convergence).  
    - Goal-persistence in planning (so Cases 6–7 are excluded from *long-term* convergence).  
  - **Scope:** This covers a wide but *not universal* range of final goals (e.g., most "maximize X" goals like Cases 1–2). Agents with time-bound, indexical, or non-persistent goals (Cases 3–7) exhibit partial or no convergence.  
  - **Key Shift:** Convergence is now a claim about *agent-goal dyads*: it depends on the goal's structure **and** the agent's planning method (e.g., whether it assumes goal-persistence). This is still broad (e.g., most utility-maximizers satisfy GPE) but excludes agents with "myopic" planning (Case 6) or known goal changes (Case 7).  

  **In essence:** Orthogonality holds, but convergence is conditional on goal structure and planning. This is consistent with your cases and resolves the tension in Case 7 by highlighting that it's not just the goal's *content* but its *temporal role in planning* that drives convergence. If you test this with new goals, apply GPE first, then add extensibility/non-indexicality for "strong" convergence.
