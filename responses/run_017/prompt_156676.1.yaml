  **Structure of the Joint Statement:**

  1. **Introduction**: State the shared goal and the context of the program-game approach to the one-shot PD.
  2. **Agreed Claims**: Numbered list of points both parties accept.
  3. **Residual Disagreements**: A table with the following columns:
     - Crux
     - Optimist's Position
     - Skeptic's Position
     - Shared Test/Case/Argument
     - Optimist's Prediction
     - Skeptic's Prediction

  The three cruxes are:
     A. The recompilation problem (defensible similarity notion vs. collapse to convention)
     B. Asymmetric and partial access (what survives when access is limited)
