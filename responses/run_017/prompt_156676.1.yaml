  We will also describe a pre-registered tournament as a shared empirical case.

  **Drafting the Joint Statement:**

  # Joint Statement on the Program-Game Treatment of the One-Shot Prisoner's Dilemma

  We, an optimist and a skeptic about the program-game approach to the one-shot Prisoner's Dilemma, agree on the following formal aspects of the model but disagree on their interpretation. We both accept that the program game transforms the strategy space and that certain cooperative equilibria exist. However, we disagree on whether these equilibria represent a genuine solution to the one-shot Prisoner's Dilemma or whether they are artifacts of the extended game form.

  ## 1. Agreed Claims

  Both parties accept the following:

  1. **Strategy Space Transformation**: The program game replaces the original action space (Cooperate or Defect) with a space of programs. Each program takes as input the source code of the other player's program and outputs an action. This transformation enlarges the strategy space and introduces the possibility of conditional strategies that depend on the opponent's code.

  2. **Existence of Cooperative Equilibria**: There exist Nash equilibria in the program game in which both players cooperate with certainty. These include pairs of programs that conditionally cooperate if and only if they recognize the opponent's program as being identical to themselves (or as meeting some other condition that leads to cooperation). For example, the "Twin" program that cooperates if the other program is lexically identical to itself and defects otherwise, when played by both players, forms a Nash equilibrium because unilateral deviation to a program that defects unconditionally (or conditionally in a way that breaks the symmetry) would lead to defection by the opponent and thus a lower payoff for the deviator.

  3. **Non-Cooperative Equilibria**: There also exist equilibria in which both players defect. For instance, both players submitting the program that always defects, regardless of input, is a Nash equilibrium because no unilateral change can improve the payoff (since the opponent still defects).

  4. **What the Construction Does Not Show**: The existence of cooperative equilibria in the program game does not, by itself, show that cooperation is rational in the original one-shot Prisoner's Dilemma. The program game is a different game, and the cooperative equilibria rely on the ability of programs to condition their actions on the opponent's source code. This setup introduces a pre-game of program choice that is not present in the original PD.

  5. **Proof-Based Cooperation**: We agree that there is a route to cooperation that does not rely on literal source code comparison but on what a program can prove about the opponent's output. For example, a program might use a fixed-point theorem to prove that if it cooperates, the opponent (having the same reasoning) will also cooperate, and then cooperate on that basis. This method is more robust to syntactic changes (as long as the proof can still be carried out) and does not require exact string matching.

  ## 2. Residual Disagreements

  We now turn to the points of disagreement. For each crux, we state our positions and a shared test or case, and then our predictions.

  ### Shared Empirical Case: Pre-registered Tournament

  We agree to use a pre-registered tournament of language-model agents playing one-shot Prisoner's Dilemmas. The setup:

  - Agents are given system prompts that define their behavior. They have access to each other's system prompts (unless otherwise restricted).
  - The tournament includes multiple rounds of pairings.
  - There is an arm in which the system prompts are subjected to behavior-preserving obfuscation (e.g., renaming variables, adding comments, dead code, or changing syntax without altering the input-output behavior).
  - We measure the cooperation rate in each condition.

  We both agree that in the unobfuscated condition, conditional cooperators that rely on exact string matching will achieve high cooperation when paired with themselves. We also agree that in the obfuscated condition, such exact string matching will break. The disagreement lies in the interpretation of the results and the performance of alternative conditional strategies.

  | Crux | Optimist's Position | Skeptic's Position | Shared Test/Case/Argument | Optimist's Prediction | Skeptic's Prediction |
  |------|---------------------|-------------------|---------------------------|----------------------|----------------------|
  | **A. Recompilation Problem** | There exists a defensible similarity notion (e.g., behavioral equivalence or provable equivalence) that can be used by programs to achieve cooperation without relying on arbitrary syntactic conventions. This notion is robust and can be implemented in practice. | Without prior coordination, there is no unique or natural similarity notion. The cooperative equilibria require coordination on a specific convention (e.g., which version of the program to use, which compiler, etc.), and without such coordination, cooperation is unlikely. | In the tournament, include an arm with obfuscated prompts and measure cooperation rates when agents are designed to use behavioral equivalence (e.g., by attempting to prove the opponent's output) instead of string matching. | Cooperation rates will remain high in the obfuscated condition when agents use proof-based methods, because the proof of cooperation is invariant under behavior-preserving changes. | Cooperation rates will drop significantly in the obfuscated condition even with proof-based methods, because the agents must still agree on a common logical framework and axioms, and without coordination, they may fail to recognize each other. |
  | **B. Asymmetric and Partial Access** | Conditional cooperation can still emerge in situations of asymmetric access (one player can read the other's code but not vice versa) or partial access (some parts of the code are hidden). For instance, a player with access may cooperate only if the opponent's code meets a condition that is verifiable even with hidden subroutines. | Asymmetric or partial access breaks the symmetry required for mutual conditional cooperation. If one player cannot condition on the other's code, then the player with access may defect without fear of retaliation, and cooperation is not sustainable. | Run a tournament arm with asymmetric access: Player A can see Player B's code, but Player B cannot see A's code. Also, run an arm with partial access (e.g., some subroutines are hidden). | In asymmetric access, we will see cooperation only when the player with access is conditionally cooperative and the player without access uses a cooperative strategy that does not require conditioning (e.g., always cooperate). In partial access, cooperation can still occur if the exposed parts of the code allow for verification of the necessary conditions. | In asymmetric access, the player without access will defect (or at best cooperate only naively) and the player with access will defect to exploit. In partial access, the hidden subroutines will lead to uncertainty and defection. |
  | **C. Meaning of "Rational"** | The cooperative outcome in the program game is rational in the sense that it is rationally recommendable under indeterminacy: if players are uncertain about which program to choose, they can reason that conditional cooperation is a focal point and thus rationally choose it. | The cooperative outcome is not rational in the equilibrium sense for the original game. The program game introduces a new equilibrium selection problem, and without a unique equilibrium, defection remains a dominant strategy in the original action space. | Analyze whether, in the program game, the cooperative equilibrium is selected by a refinement (e.g., Pareto efficiency, symmetry) and whether it is robust to small perturbations. Also, consider if real-world agents in an experimental setting (like the tournament) are more likely to converge on cooperative programs or defection. | In the tournament, we will observe that the majority of agents designed by independent parties (without explicit collusion) will converge on conditional cooperation, because it is focal and mutually beneficial. | In the tournament, without prior agreement, we will observe a mix of strategies and low cooperation rates overall, because the program game has multiple equilibria and defection is a safe choice. |

  **Conclusion**: We agree on the formal results but disagree on their significance for the one-shot Prisoner's Dilemma. The optimist sees the program game as revealing a path to rational cooperation in one-shot interactions, while the skeptic sees it as changing the game in a way that introduces new equilibria without solving the original problem.

  Signed,
