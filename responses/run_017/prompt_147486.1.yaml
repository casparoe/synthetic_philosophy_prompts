prompt: |-
  I am writing the requirements section of an internal methods document for a public agency that is about to procure a risk-scoring system, and I want to settle what I am asking of a fairness criterion before I go back to looking at candidate criteria. Please give me the specification rather than a survey: no literature review, no citations, no paper titles, no named theorems. I have read the standard results. What I want is the list of requirements whose joint unsatisfiability those results are actually about, the considerations that make each requirement compelling in the first place, and your view on which of the things people in this field demand are genuine desiderata and which are the preferences of one camp.

  The setting, so that adequacy has something to be relative to. The agency administers a scarce and beneficial intervention — imagine a home-visiting nurse programme with more eligible families than places — and it ranks applicants using a risk score bought from a vendor who will disclose the score and nothing about the model. Two features of this setting matter to me and I do not want them treated as footnotes. First, the agency observes the outcome the score predicts only for the families it actually enrols; for everyone else the label is missing, and missing in a way the agency's own past decisions produced. Second, enrolment is not inert: it changes the outcome, and it changes who appears, with which label, in the data the agency will use to re-fit or re-contract the score next year.

  Then the ask. Write the desiderata a fairness criterion for this score would have to meet: the cases it must get right, the distinctions it must respect rather than collapse, the facts about the deployment it must be consistent with, and — the part I care about most — the requirements that are added by the two features above and that a criterion designed for a one-shot classifier with complete labels need not face at all. For each requirement, give the concrete case or consideration that motivates it, stated in this setting rather than in the abstract. There are particular places where I suspect requirements are hiding and where I want you to look: what a criterion can demand when the auditor sees only scores and decisions and not the model; what it can demand about error rates when one group's errors are partly unobservable by construction; whether the criterion constrains the score, the ranking, the threshold or the allocation, and whether it must be invariant to monotone transformations of the score or to the number of available places; whether it has to survive an auditor who is permitted to choose the subgroup after seeing the data; and what it should say when the intervention is a benefit rather than a burden, so that the familiar error-rate quantities switch their moral sign, and when the intervention is itself what generates the labels.

  Mark each requirement as non-negotiable or as negotiable, and where it is negotiable say whose preference it encodes and what we give up by dropping it. Flag explicitly the subsets that cannot be jointly satisfied, and for each such conflict say whether it is a conflict in principle — the requirements are incompatible whatever the world is like — or only a conflict given contingent facts about the population, such as differing base rates or a particular structure of missingness. I want to know which conflicts I could argue my way out of by changing the world and which I cannot. Where a subset is unsatisfiable, say what the most defensible weakening of one of the requirements would be.

  Two short closing items. First, name the single requirement that does the most work in excluding otherwise attractive candidate criteria, and say why it does that work. Second, if it adds something rather than merely labelling, give a scorecard of no more than three or four broad families of criterion — criteria stated in terms of calibration and error rates, criteria stated in terms of counterfactuals or causal structure, criteria stated as a demand that similar people be treated similarly — against your list, in a few lines each; skip it if it would add nothing.
reasoning: |-
  We are in the context of a public agency procuring a risk-scoring system for allocating a scarce beneficial intervention (e.g., home-visiting nurse program). The agency observes outcomes (labels) only for the enrolled individuals, and enrollment both changes the outcome and affects the data available for future model fitting. The fairness criterion must account for these two key features.

  We are to specify the requirements for a fairness criterion in this setting. We will list the requirements, mark them as non-negotiable or negotiable, and for negotiable ones, note whose preference they represent and what is lost by dropping them. We will flag conflicts (both in principle and contingent) and suggest the most defensible weakening when a subset is unsatisfiable.

  The requirements will be motivated by concrete cases in the setting. We will address:
  - What the criterion can demand when the auditor sees only scores and decisions (and not the model).
  - How to handle error rates when one group's errors are partly unobservable (due to missing labels for non-enrolled).
  - Whether the criterion constrains the score, ranking, threshold, or allocation, and whether it must be invariant to monotone transformations or the number of available places.
  - Whether the criterion must survive an auditor who chooses subgroups after seeing the data (i.e., multiple testing or subgroup fairness).
  - What the criterion should say when the intervention is a benefit (so that false negatives are more harmful than false positives) and when the intervention itself generates the labels.

  We will also name the requirement that does the most work in excluding otherwise attractive criteria and provide a brief scorecard of criterion families.

  ---

  **Requirements for Fairness Criterion**

  1. **Requirement: Observational Basis (Non-negotiable)**  
     *Motivation*: The auditor can only observe the scores assigned to individuals, the decisions made (enrolled or not), and the outcomes for the enrolled. The vendor does not disclose the model. Therefore, the criterion must be definable and auditable using only the joint distribution of (score, decision, outcome for the enrolled, and protected attributes) and must not rely on model internals.  
     *Concrete case*: Without access to the model, the agency cannot verify if the model uses protected attributes or proxies. The criterion must be based on what is observable.  
     *What it constrains*: The criterion must be a property of the score distribution and the decisions made, not the model's functional form. It must be invariant to monotone transformations of the score (since the score is only used for ranking).  
     *Conflict note*: None.

  2. **Requirement: Allocation Consistency (Non-negotiable)**  
     *Motivation*: The agency has a fixed number of available places. The criterion must respect that the allocation is constrained by the available resources.  
     *Concrete case*: If the criterion demands that a certain group receive the intervention at a rate that would require more resources than available, it is infeasible.  
     *What it constrains*: The criterion must be defined in terms of the ranking (which determines allocation at a given threshold) and must be invariant to the exact number of available places (i.e., it should hold for any threshold that might be chosen). However, the criterion should constrain the allocation (the decisions) and not just the score, because the score is used to make allocation decisions.  
     *Conflict note*: None.

  3. **Requirement: Counterfactual Validity (Non-negotiable)**  
     *Motivation*: The intervention changes the outcome (e.g., the home-visiting nurse program reduces the risk of adverse outcomes). Therefore, the observed outcomes for the enrolled are under the intervention, while for the non-enrolled we do not observe the outcome and, even if we could, it would be without the intervention. This means the label (the outcome we care about) is defined only in the context of the treatment assignment.  
     *Concrete case*: For an individual who was enrolled, we observe Y(1) (outcome with treatment). For an individual not enrolled, we observe nothing, but the label of interest might be Y(0) (without treatment) or the treatment effect (Y(0) - Y(1)). However, we never observe both.  
     *What it constrains*: The criterion must not rely on comparing outcomes between enrolled and non-enrolled because they are under different conditions. It must account for the fact that the label is missing for non-enrolled and that the observed labels are only for the treated.  
     *Conflict note*: This requirement complicates the use of standard error rate metrics because we cannot compute false positives or negatives for non-enrolled.

  4. **Requirement: Future Data Generation (Non-negotiable)**  
     *Motivation*: The current allocation (based on the score) determines the data that will be available to train the next model. Specifically, we have outcomes (labels) only for the enrolled. If the allocation is biased, the data for retraining will be biased.  
     *Concrete case*: If the system disproportionately enrolls one group, then next year's model will be trained mostly on that group, potentially worsening performance for other groups.  
     *What it constrains*: The criterion must ensure that the allocation does not lead to a degenerate data collection that would make future fair allocation impossible. This may require that the allocation provides sufficient representation for all groups to learn about their outcomes.  
     *Conflict note*: This requirement may conflict with short-term efficiency.

  5. **Requirement: Benefit Allocation (Non-negotiable)**  
     *Motivation*: The intervention is a benefit. Therefore, we want to prioritize those who would benefit the most. Moreover, because it is a benefit, the harm of a false negative (failing to give the benefit to someone who would have benefited) is greater than the harm of a false positive (giving the benefit to someone who wouldn't benefit as much). However, note that we cannot observe the counterfactual outcomes.  
     *Concrete case*: If we are using a risk score (where a higher score means higher risk of an adverse outcome), then the benefit of the intervention is the reduction in risk. We want to allocate to those with the highest reduction (which is not directly observable).  
     *What it constrains*: The criterion must be aligned with the goal of maximizing benefit. This might require that the score is a good proxy for the expected treatment effect. But note: we cannot observe the treatment effect for any individual.  
     *Conflict note*: This requirement is why we are using a risk score in the first place. It may conflict with group parity requirements if groups have different distributions of treatment effects.

  6. **Requirement: Group Error Rate Balance (Negotiable)**  
     *Motivation*: It is often demanded that false positive rates (FPR) and false negative rates (FNR) be equal across groups. However, in this setting, the intervention is a benefit so FNR (denying the benefit to someone who would have benefited) is more harmful than FPR (giving the benefit to someone who wouldn't benefit as much). Moreover, we cannot compute FPR and FNR for non-enrolled because we don't observe their outcomes.  
     *Concrete case*: For the non-enrolled, we do not know if they would have benefited (so we cannot compute false negatives for them). We can only compute error rates for the enrolled (and even then, note: for the enrolled we observe Y(1) but we don't know what their outcome would have been without treatment, so we cannot directly know the treatment effect).  
     *What it constrains*: The criterion might be adapted to focus only on the enrolled (e.g., among the enrolled, the rate of not benefiting might be compared across groups). However, this is a partial view.  
     *Whose preference?* This is a preference of the camp that emphasizes error rate parity.  
     *What we give up*: By dropping it, we avoid the problem of unobservable errors and the fact that the intervention is a benefit. But we may lose a common notion of fairness.  
     *Conflict note*: This requirement is infeasible to compute in this setting because we cannot compute error rates for non-enrolled. Even for enrolled, without the counterfactual, we cannot know the true treatment effect. Therefore, we must weaken it: perhaps to requiring that the score is well-calibrated in some sense for the enrolled (see next requirement).

  7. **Requirement: Calibration for the Treated (Negotiable)**  
     *Motivation*: Among the enrolled, we can check if the risk score is calibrated. That is, for those with a given risk score, the observed rate of the adverse outcome (under treatment) should equal the score.  
     *Concrete case*: If the score predicts a 10% risk of an adverse outcome even with the nurse visit, then among all enrolled with that score, about 10% should experience the adverse outcome.  
     *What it constrains*: The score. It must be invariant to monotone transformations? No, because calibration is about the actual predicted probability. But note: the score is only used for ranking, so we care about the order, not the absolute value. However, calibration requires the absolute value to be meaningful.  
     *Whose preference?* The camp that emphasizes calibration.  
     *What we give up*: If we require calibration, we tie the score to a probability interpretation. But if we drop it, we can use any score that ranks correctly. However, without calibration, we cannot interpret the score as a probability, which might be important for decision-making.  
     *Conflict note*: This requirement is only about the enrolled. It does not say anything about the non-enrolled. Also, note that the outcome for the enrolled is under treatment, so this calibration is for the treated population.

  8. **Requirement: Similar Treatment for Similar Risk (Non-negotiable)**  
     *Motivation*: Individuals with the same risk score (and hence the same expected treatment effect) should be treated similarly. Since the score is used for ranking, this means they should have the same chance of being enrolled (if we are randomizing at the threshold) or be adjacent in the ranking.  
     *Concrete case*: If two individuals have the same score, they should be ranked together and either both enrolled or both not enrolled (if the threshold falls between them, then they must be on the same side).  
     *What it constrains*: The ranking must be strict (no ties) or, if there are ties, the allocation must be random among tied individuals. The criterion constrains the allocation at the threshold.  
     *Conflict note*: This is a basic requirement of consistency.

  9. **Requirement: Subgroup Robustness (Negotiable)**  
     *Motivation*: The criterion should hold not only for predefined groups but also for any subgroup that an auditor might define after seeing the data. This guards against fairness gerrymandering.  
     *Concrete case*: An auditor might find a subgroup (e.g., defined by a combination of attributes) for which the allocation appears unfair even if it is fair for predefined groups.  
     *Whose preference?* The camp that emphasizes multicalibration or subgroup fairness.  
     *What we give up*: Requiring this for all possible subgroups is very strong and might be infeasible. By not requiring it, we might allow fairness gerrymandering, but we gain feasibility.  
     *Conflict note*: This requirement might conflict with resource constraints if we require the same level of allocation for every subgroup.

  10. **Requirement: Base Rate Insensitivity (Negotiable)**  
      *Motivation*: Some argue that the criterion should not depend on the base rates of the outcome in different groups.  
      *Concrete case*: If one group has a higher base rate of the adverse outcome (without treatment), then even a perfect risk score would assign higher risk to that group. A criterion that demands equal acceptance rates across groups would then force the system to ignore the base rate difference, leading to inefficiency.  
      *Whose preference?* The camp that emphasizes equal outcomes over equal error rates.  
      *What we give up*: If we require base rate insensitivity (e.g., demographic parity), we might sacrifice efficiency (overall benefit). If we drop it, we allow the system to reflect base rate differences.  
      *Conflict note*: This requirement conflicts with the benefit allocation goal if groups have different base rates and the treatment effect is correlated with base rate.

  ---

  **Conflicts and Incompatibilities**

  - **Conflict 1: Calibration for the Treated vs. Base Rate Insensitivity (Contingent)**  
    *Requirements*: Calibration for the Treated (7) and Base Rate Insensitivity (10, e.g., demographic parity).  
    *Conflict*: If the base rates (of the outcome under treatment) differ across groups, then calibration requires that the risk scores reflect that difference (so one group would have higher scores on average). But base rate insensitivity (demographic parity) requires that the same fraction of each group is enrolled. These can be satisfied simultaneously only if the threshold is chosen differently per group, but that would violate the ranking by score.  
    *Is it in principle?* No, it is contingent on base rates being different. If base rates are equal, they can be satisfied.  
    *Defensible weakening*: Drop base rate insensitivity (10) because the goal is to allocate the benefit efficiently, which requires using the base rate information.

  - **Conflict 2: Group Error Rate Balance vs. Observability (In Principle)**  
    *Requirements*: Group Error Rate Balance (6) and Observational Basis (1) and Counterfactual Validity (3).  
    *Conflict*: We cannot compute error rates for non-enrolled because we don't observe their outcomes (and even if we could, they are under a different condition). Therefore, we cannot compute FPR and FNR for the entire population.  
    *Is it in principle?* Yes, because we never observe the counterfactual outcomes.  
    *Defensible weakening*: Drop Group Error Rate Balance (6) entirely because it is infeasible. Alternatively, we can weaken it to focus only on the enrolled: for example, balance in the rate of adverse outcomes among the enrolled (which we can observe). But note: this is not an error rate, it is an outcome rate.

  - **Conflict 3: Benefit Allocation vs. Base Rate Insensitivity (Contingent)**  
    *Requirements*: Benefit Allocation (5) and Base Rate Insensitivity (10).  
    *Conflict*: If groups have different distributions of treatment effects (the benefit from the intervention), then to maximize total benefit, we might need to allocate more to the group with higher treatment effects. This would violate base rate insensitivity (if that requires equal allocation).  
    *Is it in principle?* No, contingent on the treatment effect distributions.  
    *Defensible weakening*: Drop base rate insensitivity (10) because the primary goal is to maximize benefit.

  - **Conflict 4: Future Data Generation vs. Benefit Allocation (Contingent)**  
    *Requirements*: Future Data Generation (4) and Benefit Allocation (5).  
    *Conflict*: To collect enough data on a group, we might need to enroll some individuals from that group even if they are not the very highest priority, which reduces the short-term benefit.  
    *Is it in principle?* No, it is contingent on the current model's uncertainty about treatment effects in that group.  
    *Defensible weakening*: Weaken Benefit Allocation to allow for some exploration (like in bandit algorithms) to gather data for long-term efficiency. This is a trade-off between short-term and long-term benefit.

  ---

  **The Requirement That Does the Most Work in Excluding Criteria: Counterfactual Validity (3)**  
  This requirement excludes any criterion that requires knowledge of the outcome for non-enrolled individuals (like standard definitions of false positive rate) or that requires comparing outcomes between enrolled and non-enrolled. It also excludes criteria that assume the label is fixed and not affected by the intervention. Many popular criteria (equalized odds, predictive parity) rely on having the true labels for all individuals and assume the label is not changed by the decision. This requirement forces us to confront the fact that we only observe outcomes under one condition (treatment) for a subset. Therefore, criteria that rely on the full set of labels are infeasible.

  ---

  **Scorecard of Criterion Families**

  1. **Error Rate Criteria (e.g., equalized odds, equal opportunity)**:  
     These require FPR and FNR to be equal across groups. However, we cannot compute these in this setting due to missing counterfactuals and unobserved outcomes for non-enrolled. They also do not account for the intervention being a benefit (the costs of errors are asymmetric). Thus, they are largely inapplicable.

  2. **Calibration Criteria (e.g., calibration by group)**:  
     We can require calibration among the enrolled (Requirement 7). But note: this is only for the treated population and does not address the counterfactual of what would have happened without treatment. Also, it doesn't address the non-enrolled. It might be a negotiable requirement but is not sufficient alone.

  3. **Counterfactual/Causal Criteria (e.g., counterfactual equalized odds, treatment effect equality)**:  
     These criteria require knowing or estimating the treatment effect for each individual. But we never observe both potential outcomes. They might be desirable (aligned with Benefit Allocation) but are not auditable because we cannot observe the treatment effect. We might have to rely on proxies (like the risk score) but then the criterion becomes one about the score's properties.

  4. **Similar Treatment for Similar Individuals (Individual Fairness)**:  
     This requires that similar individuals (in terms of features) get similar scores. But the vendor does not disclose the model, so we cannot verify this. We can only observe the scores and the decisions. Therefore, we can only require that individuals with the same score are treated similarly (Requirement 8). This is a minimal requirement.

  Given the above, the most promising approach might be to focus on:
  - Requiring that the score is calibrated for the treated (if we can get the vendor to provide a probabilistic score) and that the allocation is consistent with the ranking by the score (to ensure similar treatment for same score). 
  - We might also require that the allocation does not completely neglect any group (to satisfy Future Data Generation) by setting a minimum allocation per group.

  But note: we cannot directly audit counterfactual fairness (like treatment effect equality) because we lack the data.
answer: |-
  ### Requirements for Fairness in Risk-Scoring System Procurement  
  **Setting-Specific Features:**  
  1. **Partial Outcome Observability:** Outcomes (e.g., success/failure) are observed only for enrolled families. Non-enrolled families have missing labels due to past allocation decisions.  
  2. **Intervention Dynamism:** Enrollment alters outcomes (e.g., reduces risk) and affects future training data composition.  

  #### Core Desiderata (Non-Negotiable)  
  **1. Outcome-Independent Auditability**  
  - **Motivation:** The vendor discloses only scores, not model internals. Auditors see scores, decisions (enrollment/rejection), outcomes for the enrolled, and protected attributes (e.g., race/income).  
  - **Requirement:** Criteria must be verifiable using *only* the joint distribution of (score, decision, outcome for enrolled, protected attribute). No reliance on model weights, features, or latent variables.  
  - **Why non-negotiable:** Without model transparency, criteria demanding internal inspections (e.g., "similar people treated similarly" based on features) are impractical.  

  **2. Dynamism-Compatibility**  
  - **Motivation:** Enrollment changes outcomes (e.g., a nurse visit lowers risk). Observed outcomes for enrollees reflect *treated* states; non-enrollees have *untreated* states (unobserved). Future models train on this biased data.  
  - **Requirement:** Criteria must not assume outcomes are fixed or immutable. They must acknowledge that labels are *generated by the allocation itself* and ensure allocations prevent degenerative data feedback (e.g., excluding groups from enrollment, worsening future predictions).  
  - **Why non-negotiable:** Static fairness criteria (e.g., assuming fixed labels) misrepresent causality and exacerbate data gaps over time.  

  **3. Benefit-Sensitive Error Valuation**  
  - **Motivation:** The intervention is a *benefit* (e.g., nurse visits reduce infant mortality). False negatives (FN: high-risk families denied enrollment) are ethically worse than false positives (FP: low-risk families enrolled).  
  - **Requirement:** Criteria must prioritize minimizing FNs over FPs. Metrics like "equal FPR/FNR" must invert moral weights: FN reduction > FP reduction.  
  - **Why non-negotiable:** Treating this as a standard classification problem ignores the asymmetric harm of withholding a benefit.  

  **4. Ranking Invariance**  
  - **Motivation:** The score’s sole purpose is to rank families. The threshold (cutoff for enrollment) depends on annual budget constraints (e.g., 100 slots/year).  
  - **Requirement:** Criteria must constrain the *ranking*, not absolute scores or thresholds. Must be invariant to monotone score transformations (e.g., doubling all scores) and robust to changes in the number of available slots.  
  - **Why non-negotiable:** Allocation fairness depends on relative priority, not arbitrary score scales or temporary resource limits.  

  #### Context-Adapted Desiderata (Negotiable)  
  **5. Partial Observability Tolerance**  
  - **Motivation:** Outcomes for non-enrollees are missing *by design* (they were never treated), making group-wise FPs/FNs unobservable.  
  - **Requirement:** Criteria must not require unobservable quantities (e.g., FNs for rejected applicants). Auditors may only use:  
    - **For enrollees:** Observed outcomes (e.g., risk with treatment).  
    - **For non-enrollees:** Scores and protected attributes.  
  - **Motivating case:** Demanding "equal FNR across groups" is infeasible—FNs for non-enrollees cannot be measured.  
  - **Whose preference?** Preference of pragmatists vs. idealists who demand counterfactual estimation.  
  - **Trade-off if dropped:** Relaxing this allows aspirational criteria (e.g., causal fairness) but risks unverifiable demands.  

  **6. Subgroup-Robustness**  
  - **Motivation:** Auditors may search for unfairness in arbitrary subgroups (e.g., "single mothers in ZIP 12345") post hoc.  
  - **Requirement:** Criteria should hold not just for predefined groups but also for subgroups defined *after* seeing scores/outcomes.  
  - **Motivating case:** A criterion satisfying parity for race groups may fail for race-income intersections.  
  - **Whose preference?** Preference of robustness advocates (e.g., multicalibration) vs. simplicity-focused camps.  
  - **Trade-off if dropped:** Without this, fairness may hold broadly but mask localized disparities.  

  **7. Base Rate Agnosticism**  
  - **Motivation:** Groups may have different risk distributions (e.g., due to structural factors). Forcing identical score distributions ignores this.  
  - **Requirement:** Criteria must not require identical score distributions across groups if base rates differ.  
  - **Motivating case:** If Group A has higher untreated risk than Group B, their score distributions *should* differ.  
  - **Whose preference?** Preference of efficiency-focused camps vs. those prioritizing proportional representation.  
  - **Trade-off if dropped:** Enforcing identical distributions (e.g., demographic parity) may misallocate benefits by ignoring need.  

  #### Conflicts and Resolutions  
  **Conflict 1: Benefit-Sensitive Error Valuation (3) vs. Base Rate Agnosticism (7)**  
  - **Nature:** Contingent (depends on base rates).  
  - **Scenario:** If Group A has higher untreated risk, prioritizing FN reduction (3) may allocate them more slots. But if base rates differ, (7) forbids enforcing identical allocation rates.  
  - **Resolution:** Weaken (7) to allow base-rate-driven allocations. Efficiency gains justify this.  

  **Conflict 2: Partial Observability Tolerance (5) vs. Calibration Demands**  
  - **Nature:** In principle.  
  - **Scenario:** Calibration (e.g., "if score = *x*, observed risk ≈ *x*") requires outcomes for all scored individuals—impossible for non-enrollees.  
  - **Resolution:** Restrict calibration to *enrollees only* (observed outcomes). Weakens criterion but preserves auditability.  

  **Conflict 3: Dynamism-Compatibility (2) vs. Static Fairness Metrics**  
  - **Nature:** In principle.  
  - **Scenario:** Criteria assuming fixed labels (e.g., equalized odds) ignore that enrollment changes outcomes and data.  
  - **Resolution:** Drop static metrics entirely. They are fundamentally misaligned with the intervention.  

  **Conflict 4: Subgroup-Robustness (6) vs. Feasibility**  
  - **Nature:** Contingent (depends on data/compute).  
  - **Scenario:** Requiring fairness for all possible subgroups is combinatorially hard.  
  - **Resolution:** Weaken (6) to predefined groups only. Sacrifices comprehensiveness for simplicity.  

  #### Highest-Impact Requirement: **Partial Observability Tolerance (5)**  
  - **Why it excludes criteria:** Most error-rate/counterfactual criteria (e.g., equalized odds, counterfactual fairness) require unobservable quantities (FPs/FNs for non-enrollees). This requirement forces criteria to use only *auditable* data, eliminating popular but infeasible approaches.  

  #### Scorecard of Criterion Families  
  | **Family**                     | **Compatibility with Requirements**                                                                 |  
  |--------------------------------|-----------------------------------------------------------------------------------------------------|  
  | **Error-Rate Parity**          | ❌ Fails (3), (5). Requires unobservable FNs/FPs and ignores benefit asymmetry.                     |  
  | **Calibration**                | ⚠️ Partial. Only viable for enrollees (5), and must invert moral weights for benefits (3).         |  
  | **Counterfactual/Causal**      | ❌ Fails (1), (5). Requires untestable assumptions (e.g., unconfoundedness) and unobservable labels.|  
  | **Similarity-Based Fairness**  | ❌ Fails (1). Requires feature-level comparisons, but only scores are observable.                   |  

  **Final Guidance:** Prioritize criteria auditable via scores/outcomes (e.g., *ranking-based parity* for predefined groups, calibrated for enrollees). Reject criteria requiring unobservables or ignoring dynamism. Base rate agnosticism (7) and subgroup-robustness (6) are negotiable; drop them if efficiency or simplicity is paramount.
