answer: |-
  Here’s the exam question, model answer, and marking scheme tailored to your specifications:

  ---

  ### **Exam Question: Agency Over Time (20 marks)**  
  **Word Limit:** Strictly 900 words. Responses exceeding this limit will not be graded beyond the 900th word.  
  **Time:** 48 hours  

  ---

  **Case Study:**  
  - At 9 a.m., **Mira** ranks *finishing her dissertation chapter* above *going to the pub*. By 4 p.m., she reverses her preference: she goes to the pub and affirms this choice is best *at that time*.  
  - **Sam**, by contrast, maintains time-consistent preferences (roughly exponential discounting). At 4 p.m., Sam also goes to the pub but sincerely laments, *"I know I should be writing."*  

  **Additional Details:**  
  1. **Relocation Test:** Suppose Mira faces an identical choice *tomorrow* (same options, same 9 a.m./4 p.m. timing). At 9 a.m. tomorrow, she again prefers writing. At 4 p.m. tomorrow, she again prefers the pub.  
  2. **Sophistication:** If Mira *anticipates* her 4 p.m. reversal, this may lead her to "preemptively give in" (e.g., skip work earlier) or seek costly precommitments (e.g., paying to lock her laptop).  

  ---

  **Your Task:**  
  Critically evaluate whether hyperbolic discounting (exemplified by Mira) explains **akrasia** (acting against one’s own better judgment). Address:  
  1. Whose judgment (Mira’s 9 a.m. self? 4 p.m. self? Sam’s?) defines "better judgment" in akrasia, and why.  
  2. Whether the "relocation test" reveals Mira’s 4 p.m. preference as *inauthentic* or merely *time-indexed*.  
  3. How Mira’s "sophistication" complicates (or clarifies) whether she acts against her judgment.  
  4. Whether Mira, Sam, both, or neither qualifies as genuinely *weak-willed*, and on what grounds.  

  ---

  ### **Model Answer (≈750 words)**  

  The standard view that hyperbolic discounting explains akrasia—by positing "present bias" causing preference reversals—glosses over a crucial ambiguity: *which temporal self’s judgment* defines "better judgment"? Mira’s case exposes this. At 4 p.m., she judges the pub best *all-things-considered* for her 4 p.m. self. Sam, however, experiences conflict: his 4 p.m. action contradicts his *concurrent* judgment that writing is better. This suggests Sam, not Mira, better fits the classic akratic profile.  

  **Whose Judgment Matters?**  
  Akrasia requires acting against one’s *current*, all-things-considered judgment (Davidson 1970). Sam clearly satisfies this: at 4 p.m., he acts (pub) against his affirmed judgment (writing). Mira does not: her 4 p.m. action aligns with her 4 p.m. judgment. To call Mira akratic implies her 9 a.m. judgment overrides her later self—but why privilege the earlier self? If we reject temporal parochialism, her 9 a.m. view is just a past preference, not an enduring standard. The relocation test amplifies this: Mira’s preferences shift predictably with temporal perspective, implying no "mistake" occurs at 4 p.m. Her judgment is locally coherent but globally unstable.  

  **Sophistication’s Double-Edged Sword**  
  Sophistication—forecasting one’s future reversals—further undermines the "akrasia" label for Mira. If she anticipates her 4 p.m. pub preference, she might precommit (e.g., locking her laptop). Crucially, this only helps if done *before* the reversal point (e.g., at 10 a.m.). If she waits too long, sophistication may *worsen* outcomes: believing resistance is futile, she abandons work at 2 p.m., whereas a naive Mira might persist until 3:55 p.m. This isn’t akrasia; it’s strategic adaptation to predictable preference shifts. Her 4 p.m. self still endorses the pub.  

  **Sam as the True Akratic?**  
  Sam’s conflict is structurally distinct. His exponential discounting means his 9 a.m. and 4 p.m. rankings align: writing always outranks the pub. Yet he chooses the pub at 4 p.m. while judging writing superior *at that moment*. This violates Davidson’s requirement: he acts counter to his *current* evaluation. His weakness of will lies in this real-time failure to execute his affirmed best choice.  

  **Concession: Phenomenology vs. Rationality**  
  One might argue Mira *feels* akratic—she regrets her reversal later. But post-hoc regret doesn’t imply akrasia *at the time of action*. Conversely, Sam’s concurrent distress captures the essence of akrasia: a battle within a single temporal standpoint. That said, hyperbolic discounting may explain *why* agents like Sam arise: observing their own or others’ reversals, they internalize a "should" (e.g., "I should prioritize long-term goals") that clashes with stable preferences.  

  **Verdict**  
  Hyperbolic discounting describes preference reversals, not akrasia. Mira’s 4 p.m. choice expresses her sincere, situation-specific judgment. Sam’s choice contradicts his. Hyperbolic discounting only explains akrasia if we equivocate between temporal selves—but akrasia is an intra-temporal failure. Sophistication and relocation tests confirm this: Mira’s model is one of shifting, context-sensitive agency, not self-betrayal. Thus, Sam exemplifies weak-willed action; Mira exhibits rational time-indexed preferences.  

  ---

  ### **Marking Scheme (Total: 20 marks)**  
  **Must-hit moves (4 marks each):**  
  1. **Distinguish Mira/Sam’s conflicts:**  
     - *Mira:* Reversal + endorsement at 4 p.m.  
     - *Sam:* Consistency + regret at 4 p.m.  
     - *Fudge:* Treating both as "giving in to temptation" without analyzing judgment alignment.  
  2. **Apply the relocation test:**  
     - Uses it to argue Mira’s preference is time-indexed (stable under translation), not mistaken.  
     - *Fudge:* Calling it "irrational" without addressing why time-indexing isn’t a valid preference structure.  
  3. **Define "better judgment" temporally:**  
     - Explicitly states whose judgment (9 a.m. vs. 4 p.m. self) counts for akrasia and why (e.g., akrasia requires current-judgment violation).  
     - *Fudge:* Ambiguous use of "judgment" (e.g., "Mira acts against her plan" without specifying *whose* plan matters now).  
  4. **Complicate sophistication:**  
     - Notes it can worsen outcomes (e.g., earlier surrender) and isn’t a "solution" to akrasia.  
     - *Fudge:* Treating sophistication as universally beneficial or equating it with self-control.  
  5. **Take a stance on akrasia:**  
     - Concludes whether hyperbolic discounting explains *true* akrasia (e.g., "No, Sam fits better" or "Only if we privilege past selves").  
     - *Fudge:* Undecided or "both are akratic" without justifying the criteria.  

  **A vs. Strong B Differentiator (caps at 15/20 if missing):**  
  - **Move #5 (Stance on akrasia):** The A answer explicitly argues hyperbolic discounting *fails* to explain akrasia because Mira’s 4 p.m. self endorses her action (making Sam the clearer case). The strong B hits moves 1–4 but hesitates here (e.g., "Mira is akratic relative to her long-term self") without justifying why past judgment overrides present judgment.  

  ---  

  **Rationale for Design:**  
  - The relocation test and sophistication nuances force engagement with the "hard problem" (judgment ownership/time-indexing).  
  - Contrasting Mira/Sam prevents conflation. The model answer’s "extra move" is defending Sam as *more* akratic—a non-obvious claim requiring argument.  
  - Word limit ensures concision; the question’s framing avoids name-dropping while covering your key points.
