prompt: |-
  I'm a senior at a large public high school, and I'm writing a piece for our student paper about the way our district uses numbers to judge schools, teachers, and students. I've found that I have quite firm opinions about which uses of a number are corrupt and which are perfectly fine, but I can't state the rule I'm applying, and I suspect some of my opinions don't fit together. I'd be grateful for help finding the rule, and for an honest account of which verdicts it forces me to drop. I'm not asking for sources or further reading, just the shape of the principle.

  Here are my cases, all of them from things I've watched happen.

  Our district publishes each school's chronic absenteeism rate, and a slice of funding follows it. One school responded by letting students who arrive up to forty minutes late and leave after lunch count as present, provided they complete a wellness check-in with a counselor in the front lobby. Their rate fell sharply. I think this is straightforwardly corrupt, and I blame the administrators. A second school, facing the same metric, spent a small grant on adult-led walking routes to school, a washer and dryer for students without clean uniforms, and a counselor who phones homes. Their rate fell by about as much. I think this is not corrupt at all — it's the system working. What bothers me is that in both cases the number moved because people responded to being measured, and the second school's programs would not exist if nobody were counting. So responsiveness to the measure can't itself be the test.

  A second pair, which I find harder. My chemistry teacher spent the last three weeks before the state exam drilling us on a fill-in-the-blank template for the explain-your-reasoning items, and I could earn most of the points on those items without understanding the chemistry. I think that's corrupt. Another teacher of mine spends a couple of classes on general test-taking technique — ruling out obviously wrong options, checking whether your answer's units make sense, not leaving anything blank. Her students' scores went up too, and I think she's right to do it, and that a teacher who refused to would be neglecting us. But both of them taught us tricks that raise scores without raising understanding, and I can't say what separates them except that one feels like it defeats the point of the item and the other feels like common sense. That's not a principle.

  One case where I assign blame oddly. Our English department runs essays through an AI-detection score, and a friend of mine, who wrote his essay himself, put it through a rewriting tool to make the prose clumsier so the score would come back low. I think the score has stopped being evidence of anything about who wrote the essay. But I don't blame my friend, whereas I do blame the administrators in the first attendance case. My guess is that the difference is about who imposed the measure and whether the person being measured had any other way to protect themselves, but I'd like that spelled out, because I'm not sure it doesn't just reduce to "I side with students."

  One case my definition can't handle. The peer tutoring program I volunteer for reports the share of tutored students who go on to pass the course, and the district funds it partly on that figure. This year the coordinator began accepting only students whose first-semester average was already above seventy, quietly turning away the students who used to be referred most often. The pass rate rose. I think this is the worst thing on my list — worse than the attendance trick — and yet the number still means exactly what it meant. Of the students who were tutored, more passed. Nothing about the measurement broke. What changed is which students there are. So my rough test, make the number move without making the thing move, doesn't cover it, and I don't know what does.

  One case that pulls in the other direction. A state university near us admits by a formula built on GPA, and several schools in our area now grade generously. One of my teachers has started bumping strong B+ work up to A−, and she has told us privately that she does it to keep us comparable to students from schools that inflate. I can't blame her, and I think she's probably right to do it. But her doing it makes GPA worse as a signal, and if everyone does it the signal collapses while each individual act of inflating remains reasonable. So here I have corruption without blameworthiness, which is the reverse of what I said about the test-taking tricks, and I'd like to know whether I need two separate principles or one with more moving parts.

  A case of a different kind. Several elementary schools in our district cut art and recess to add blocks of tested reading instruction, and the principal of one of them said in a meeting that reading is what the district measures, so reading is what the school is for. I think something has gone badly wrong here, but it isn't that the number stopped tracking the thing. The number tracks reading instruction better than ever. What moved is what the school cares about. I don't know whether that belongs in the same box as the others or is a distinct failure with its own name.

  The case I keep changing my mind about: our district now has every teacher rate each senior on things like resilience and collaboration, from a short paragraph of commentary, using a rubric everyone has seen. Scores have been almost identical for two years and are checked against nothing. Half the time I think this is the most corrupt number in the building, because a teacher could write anything she liked and no one would know. The other half I think that two stable years is some evidence that nobody has bothered to game it, and that a number nothing rides on is safe precisely because it's harmless — which would also make it useless. I'd like to know whether unused gameability corrupts a measure, or whether only exercised gameability does.

  My own tentative principle is that a measure has been corrupted to the extent that a rise in it has stopped being evidence of a rise in the thing we actually care about. That handles the first two cases and the tutoring case, provided I'm willing to say what the target is and to notice that the target's population can be changed by the people being measured. It seems to misfire on the grade inflation case, where the evidence does weaken and yet I won't blame anyone, which makes me think I need a second principle about blame and not only about measurement.

  What I'd like from you is the principle, or the two principles, stated precisely, with each clause tied to the case that forces it; your verdicts on a few cases I haven't listed, such as a measure that everyone games by roughly the same amount so the ranking stays put, a measure that is gamed only at the extremes, a measure whose target is partly constituted by public opinion about the target, and one further case of your own invention that you think discriminates between the candidates; and a frank statement of which of my verdicts no single principle can keep. If it turns out that measurement and blame have to be handled separately, please say where the seam is, and whether anything I care about falls through it.
reasoning: |-
  Okay, the user is a high school senior writing an article about how their school district uses numbers to evaluate schools, teachers, and students. They've observed several cases where these metrics lead to questionable behaviors, and they're struggling to articulate a consistent principle that explains which uses of numbers are corrupt and which are legitimate. They've provided seven specific scenarios that illustrate their dilemma.

  First, I need to understand their core concern. They want a clear principle that distinguishes legitimate metric-driven improvements from corrupt gaming of the system. Their tentative principle focuses on whether a rise in the metric still indicates improvement in the underlying goal. But they've noticed this doesn't cover all cases, like when the population being measured changes (tutoring case) or when everyone inflates grades collectively (GPA case).

  Looking at their cases:
  - Attendance: One school games the system (corrupt), another genuinely improves conditions (legitimate). Both respond to measurement, so responsiveness alone isn't the issue.
  - Test prep: Template drilling feels corrupt, while general test-taking skills feel legitimate. Both raise scores without necessarily increasing understanding.
  - AI detection: Student gaming the system isn't blamed, unlike administrators in attendance case. Power dynamics matter here.
  - Tutoring: Selecting easier-to-help students corrupts the program's purpose without falsifying the metric itself. The "make the number move without the thing" test fails here.
  - Grade inflation: Individual teachers feel justified in inflating grades to keep students competitive, but collectively this destroys GPA's meaning. Corruption without individual blameworthiness.
  - Curriculum narrowing: Schools prioritize only what's measured (reading over arts), which distorts educational purpose without breaking the metric.
  - Character scores: Unused metrics that are gameable but stable - is this corrupt or harmless?

  Their tentative principle about metric-target alignment has merit but gaps. The tutoring case shows that even when the metric is technically accurate (pass rate of tutored students), the intervention can become corrupted by changing who gets served. This suggests we need to consider not just whether the metric reflects reality, but whether the intervention still serves its intended purpose.

  The grade inflation case reveals a separate issue about collective action problems - individual rationality leading to systemic failure. This can't be solved by better metric design alone. The character scores case highlights that gameability matters most when stakes are high - unused metrics might be harmless but also useless.

  For blame assignment, power dynamics appear crucial. Students gaming a flawed system (AI detection) face different ethical expectations than administrators or program coordinators who should know better.

  To build a robust framework, I'll propose:
  1) A measurement integrity principle focusing on whether metric gains reflect genuine gains in the underlying goal (accounting for population changes)
  2) An institutional purpose principle addressing whether the intervention still serves its core mission
  3) A blameworthiness principle considering power asymmetry and reasonable alternatives

  This should cover their cases more comprehensively. For the tutoring example, while the metric stays accurate (measurement integrity), the program betrays its purpose by excluding needy students (institutional purpose). For grade inflation, measurement integrity degrades collectively without individual blameworthiness due to competitive pressures.

  I'll test this framework against their additional hypotheticals (uniform gaming, extreme gaming, opinion-based targets) and offer a new case about coaching thresholds to distinguish between principles. Finally, I'll acknowledge which of their original verdicts might need adjustment under this clearer framework.
answer: |-
  Here's a synthesized principle set grounded in your cases, designed to preserve your core intuitions while forcing revisions where necessary. The seam between measurement corruption and blameworthiness is critical, as your cases demand separate treatment.

  ---

  ### **Principle 1: Measurement Integrity**  
  *A metric is corrupted when a rise in its value fails to reliably indicate improvement in the underlying goal it was designed to track, due to actions that exploit the gap between the metric and the goal.*  

  **Key clauses and their case-driven origins:**  
  - **"Underlying goal"**: Forces explicit acknowledgment of the metric’s purpose (e.g., attendance metrics aim to ensure students receive instruction; tutoring metrics aim to help struggling students).  
  - **"Exploit the gap"**: Requires intentional action to manipulate the metric without advancing the goal (e.g., wellness check-ins without instruction in absenteeism case; templated answers in chemistry).  
  - **"Reliably indicate"**: Accounts for cases where the metric *technically* tracks its narrow target but the goal is subverted (e.g., tutoring program selecting high-achievers: the metric *does* track "pass rates of tutored students," but the *goal* of helping at-risk students is abandoned).  

  **Verdicts forced by this principle:**  
  - **Chronic absenteeism**:  
    - School 1 (wellness check-ins): **Corrupt**. "Present" status no longer reliably indicates instructional access.  
    - School 2 (walking routes, laundry): **Not corrupt**. Metric rise reflects genuine progress toward goal (removing barriers to attendance).  
  - **Test prep**:  
    - Chemistry template: **Corrupt**. Scores rise without chemistry understanding.  
    - Test-taking techniques: **Not corrupt**. Techniques help students demonstrate actual knowledge (e.g., unit checks prevent careless errors).  
  - **AI-detection score**: **Corrupt**. The score no longer reliably indicates human authorship.  
  - **Tutoring program**: **Corrupt**. While the metric ("pass rate of tutored students") is accurate, the *goal* (helping struggling students) is abandoned by cherry-picking.  
  - **Grade inflation**: **Corrupt**. GPA no longer reliably indicates academic mastery due to systemic inflation.  
  - **Art/recess cuts**: **Not corrupt by this principle alone**. Reading scores better track reading instruction. *(See Principle 2 for why this is still problematic.)*  
  - **Character scores**: **Not corrupt** (if unused). Gameability alone doesn’t corrupt if the metric isn’t gamed. Stability suggests no exploitation.  

  **Your tentative principle revised**:  
  Your "rise in metric = evidence of rise in the thing" is retained but strengthened by specifying *exploitation of the gap* and *reliability*. The tutoring case forces us to define "the thing" as the underlying goal, not the metric’s literal definition.  

  ---

  ### **Principle 2: Institutional Purpose Accountability**  
  *An actor is blameworthy for corrupting a metric when they exploit the metric-goal gap despite having institutional power or responsibility to uphold the goal, and reasonable alternatives exist.*  

  **Key clauses and case-driven origins:**  
  - **"Institutional power/responsibility"**: Distinguishes administrators/coordinators (who shape systems) from students/teachers (who respond to them).  
  - **"Reasonable alternatives"**: Absolves those forced into corruption by systemic failures (e.g., teachers inflating grades amid district-wide inflation).  

  **Verdicts forced by this principle:**  
  - **Absenteeism**: Blame administrators (School 1) — they control policies and could have pursued legitimate improvements.  
  - **AI-detection**: **Do not blame student**. He lacks power to fix the flawed system; manipulation is self-protection.  
  - **Grade inflation**: **Do not blame teacher**. She acts reasonably to protect students in a broken system. Blame lies with districts/universities that enable inflation.  
  - **Tutoring program**: **Blame coordinator**. They abused institutional power to exclude needy students despite alternatives (e.g., seeking more funding).  

  **The seam**: Measurement corruption (Principle 1) is objective; blameworthiness (Principle 2) depends on agency and context. This resolves your "corruption without blame" (grade inflation) and "blame without student culpability" (AI case).  

  ---

  ### **Testing Additional Cases**  
  - **Uniform gaming (e.g., all teachers inflate grades equally)**:  
    - *Measurement*: **Corrupt** (GPA no longer indicates mastery).  
    - *Blame*: **Not individual teachers** (no reasonable alternative), **blame system designers**.  
  - **Gaming only at extremes (e.g., top schools manipulate rankings)**:  
    - *Measurement*: **Corrupt at extremes** (rankings distort true performance there).  
    - *Blame*: **Blame actors with power** (e.g., principals ordering manipulation).  
  - **Metric tracking public opinion (e.g., "school popularity" score)**:  
    - *Measurement*: **Not corrupt** — if the goal *is* public perception, manipulation (e.g., marketing) advances the goal.  
  - **Discriminating case: "Coaching threshold"**  
    - *Scenario*: A college readiness program is funded based on % of students scoring above 1100 on the SAT. A school excludes students predicted to score below 1000, focusing coaching on those near 1100. The metric rises.  
    - *Verdict*: **Corrupt by Principle 1** (metric rise doesn’t reflect genuine college readiness gains; neediest students excluded). **Blameworthy by Principle 2** (coordinator exploited power despite alternatives).  

  ---

  ### **Verdicts You Must Drop**  
  1. **"Unused gameability corrupts"** (character scores): Under Principle 1, corruption requires *exploitation*, not mere potential. Harmless ≠ corrupt.  
  2. **"Art/recess cuts are worst"**: By Principle 1, this isn’t measurement corruption. The failure is **goal displacement** (valuing only what’s measured), which is distinct. It belongs in your article but under a different header (e.g., "When Metrics Distort Mission").  
  3. **"Grade inflation is reasonable without systemic blame"**: You must acknowledge the *metric itself* is corrupted (Principle 1), even if individuals aren’t blameworthy (Principle 2).  

  ---

  ### **Summary**  
  - **Measurement Integrity** asks: *Does a higher number still mean we’re actually achieving what we set out to do?*  
  - **Blameworthiness** asks: *Who had the power and duty to avoid cheating the system, but didn’t?*  
  Your intuitive split between "corrupt numbers" and "blameworthy people" holds. The tutoring case is the keystone: it forces us to tie "the thing we care about" to the *purpose*, not the metric’s literal definition. The grade inflation case forces the blameworthiness carve-out.  
    
  This framework keeps 80% of your verdicts intact, drops two, and reclassifies one (art cuts). It also explains why you instinctively side with students: they rarely have "institutional power/responsibility" in Principle 2. Use this to structure your piece — it’s a powerful lens.
