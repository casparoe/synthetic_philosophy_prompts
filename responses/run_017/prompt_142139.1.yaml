prompt: |-
  I'm in a graduate seminar on rational choice and decision theory, and this week we covered Good's theorem: the result that for an expected-utility maximizer who updates by conditionalization, the expected value of costless information is never negative, because any act available before the signal arrives is still available afterwards, and one can simply resolve to act as one would have acted without it. Two people in the seminar stayed behind and got into an argument about whether that result is substantive or close to empty. I've tried to reconstruct the exchange faithfully below. I have no stake in who wins, and I'd rather you work the argument out than send me to readings, since I can't chase references this week.

  1. Marcus: The proof is one line — for each possible signal, take the act that maximizes conditional expected utility, and observe that the unconditional optimum is still in the menu in every cell, so the expected value with the signal is at least the value without it. But the second half of that is just the remark that you are free to walk away from something free. Nothing about inquiry, evidence, or science follows. The floor is zero by construction and the theorem never says the value is positive. Worse, it looks unfalsifiable: any claimed counterexample gets met with the reply that you've quietly violated a background assumption.

  2. Lena: Two things. First, the floor is exactly what makes the economics of experimentation work: since gross value is nonnegative, the only question about any experiment is whether its cost exceeds its gross expected value, and the theorem decomposes where the value comes from — strictly positive just in case there is positive probability of a signal that would change what you do. That's a mechanism, not a floor. Second, it is falsifiable: it fails for agents who update non-Bayesianly (someone who will treat a weak signal as conclusive does worse by looking), and for agents whose utility depends on what they know. So it's a coherence constraint on a package — expected utility, conditioning, costlessness, and purity of the signal — not a tautology.

  3. Marcus: The still-in-the-menu premise is much stronger than it looks, and routinely false. Case one, mandated disclosure: I'm offered a free genetic test for a condition that affects what I'd pay for the insurance I was about to buy, and I'm legally required to disclose the result if I take it. The act I had planned — buy at the pooled rate — no longer exists after I learn. Case two, knowing is itself an outcome: for an untreatable condition, having it and knowing you have it differs in utility from having it and not knowing, and you cannot select the latter once you've been tested. In both, the signal isn't merely informative: conditional on the state, whether you receive it depends on what you do, or receiving it changes the outcome space. So the theorem is restricted to signals that are pure, and the interesting real cases of should I find out generally aren't.

  4. Lena: Granted — but the right conclusion is about modelling, not refutation. Enlarge the state space so that testing carries disclosure as a consequence and so that knowing is part of the outcome, and the inequality is restored over the enlarged space. Notice what that costs me, though. Over an enlarged space the theorem holds for any joint distribution you like, which turns it into a claim about your model rather than about the world. Once anything awkward can be relocated into the state space, no case can test it. So the vacuity worry comes back in a sharper form: the result is either substantive and scope-limited, or fully general and untestable. I'd take the scope-limited version.

  5. Marcus: Here is a case that is neither a mis-modelling nor a failure of consequentialism, and in which acting as you would have is perfectly available: a calibration oracle. It tells you nothing about which hypothesis is true. It tells you that your credence function is miscalibrated — that your ninety-percent intervals contain the truth sixty percent of the time, that you should shrink every log-odds by a fixed factor. There is no proposition here to conditionalize on, and no way to act as you would have acted, since what is being revised is the probability function you use in drawing up every plan. If Good's result cannot even be stated for this signal, it isn't a general result about the value of information; it is a result about the value of partitions of a possibility space you already possess.

  6. Lena: It can be stated: introduce a variable ranging over which recalibration of your credences is the correct one, put a prior over its values, and treat the oracle's report as a likelihood over them. The theorem applies again and the value is nonnegative. But the absorption exposes the real presupposition: the theorem needs a prior over everything the signal might bear on. And its silence is precisely where the action is — a signal that reveals that a possibility you had not represented at all is real, so that you expand your hypothesis space rather than reweight within it. Good's theorem says nothing about that, and that is the case the philosophy of science actually cares about.

  7. Marcus: Then we agree more than it looked. The theorem is diagnostic, not justificatory. If free information looks worthless or harmful to you, it tells you where to look: cost, impurity of the signal, preferences that aren't consequentialist, updating that isn't Bayesian, or a prior over an impoverished space. It keeps the books. It doesn't tell you to open them.

  8. Lena: Agreed, with one asymmetry worth keeping. The diagnostic only ever tells you that one of the assumptions failed; it never licenses the conclusion that information itself is bad. That residual content is small but it isn't nothing.

  Please adjudicate this move by move: rate each of the eight moves from clearly mistaken to clearly right, with a sentence or two of justification, and say who is right about what overall. I specifically want your verdict on three things. First, whether the impurity cases in move 3 are genuine counterexamples to Good's theorem or changes of subject, and whether Lena's reply in move 4 concedes more than she admits. Second, whether the calibration-oracle case in move 5 can really be absorbed by enlarging the prior as Lena proposes in move 6, and what that enlargement costs. Third, whether there is any reading of the theorem on which it is genuinely substantive rather than either trivial or heavily conditioned — and if there isn't, what its status is. Finally, tell me what both of them are missing.
reasoning: |-
  Okay, I need to tackle this complex debate about Good's theorem. The user is in a graduate seminar and wants me to adjudicate Marcus and Lena's argument move by move. Let me start by recalling Good's theorem: it states that for a Bayesian expected-utility maximizer, the expected value of costless information is non-negative. 

  First, I need to assess each of the eight moves. Marcus starts by calling the proof trivial, arguing that the "floor is zero by construction." Lena counters that it's crucial for the economics of experimentation and falsifiable when assumptions are violated. 

  Marcus brings up impurity cases in move 3—mandated disclosure and knowing as an outcome. These seem like challenges where the initial act isn't available after receiving information. Lena's reply in move 4 suggests enlarging the state space to restore the theorem, but Marcus isn't satisfied. 

  Then Marcus introduces the calibration oracle in move 5. This is tricky because it targets the probability function itself, not states. Lena's move 6 claims we can model it by adding a prior over recalibrations. But does that work? The user wants to know if this absorption is valid and what it costs. 

  The user's third query is whether the theorem is substantive. Lena in move 8 argues it has residual content: information itself isn't bad. Marcus sees it as diagnostic. 

  I should check each move. For move 3, Marcus's cases aren't counterexamples; they're scope limitations. Lena's move 4 concedes modelling flexibility but risks vacuity. The calibration oracle (move 5) can be absorbed (move 6), but the cost is assuming a prior over all possible recalibrations, which might be unrealistic. 

  On substantiveness: the theorem isn't trivial because it relies on specific assumptions (EU, conditionalization, etc.). When those hold, it's substantive. But in real-world cases, violations are common, making it more of a coherence check. 

  Both might miss that the theorem's value is normative: it highlights ideal conditions for rational info-seeking. Real deviations help identify irrationalities. Also, the theorem assumes a static hypothesis space, which isn't how science often progresses with paradigm shifts.
answer: |-
  Here's a move-by-move adjudication of Marcus and Lena's argument, addressing your specific queries and providing an overall verdict:

  **Move-by-Move Analysis:**

  1.  **Marcus (Clearly Right, but Incomplete):** His summary of the proof is correct, and his "walk away from something free" analogy captures the core mechanism. He's right that the theorem *itself* doesn't guarantee positive value and doesn't directly entail conclusions about science. His "unfalsifiable" worry is premature but foreshadows later moves.
      *   **Verdict:** Correct on mechanics, jumps to concerns needing support.

  2.  **Lena (Clearly Right):** She effectively counters Marcus's dismissal. Highlighting the decomposition of value (gross vs. net) and the mechanism (positive value iff info *can* change the optimal act) shows the theorem's *economic* substance. Providing clear falsification conditions (non-Bayesian updating, knowledge-dependent utility) demonstrates it's not tautological but a coherence constraint.
      *   **Verdict:** Strong defense of the theorem's substance within its scope.

  3.  **Marcus (Mostly Right - Points to Scope Limits):** His "impurity" cases are crucial. Mandated disclosure removes the "do nothing" act from the menu. Knowledge-dependent utility changes the outcome space itself. These *are* genuine violations of Good's assumptions (pure information, consequentialist preferences/stable outcome space). They are **changes of subject relative to Good's strict setup**, but **genuine counterexamples to the *naive application* of Good's result** to real-world "should I find out?" questions. They show the theorem's fragility.
      *   **Verdict:** Exposes critical scope limitations of the theorem.

  4.  **Lena (Clearly Right, Concedes Scope):** She concedes Marcus's point: modelling can restore the theorem by expanding the state/outcome space. Her key insight is the cost: this manoeuvre **concedes far more than she initially admits** about the theorem's potential vacuity. If *any* awkward consequence can be shoved into an enlarged state space with an arbitrary prior, the theorem becomes untestable as a claim about the world – it's a claim about the modeler's consistency. She prefers the "scope-limited" interpretation.
      *   **Verdict:** Correct modelling response, insightful about the vacuity risk inherent in generalization.

  5.  **Marcus (Mostly Right - Novel Challenge):** The calibration oracle is a clever challenge. It directly attacks the probability function used for *all* planning, not beliefs about states within a fixed probability framework. Acting "as you would have" is impossible because your *entire decision rule* is invalidated. Good's theorem, relying on conditionalization within a fixed hypothesis space, **cannot be directly stated** for this signal without significant reinterpretation. It highlights a different kind of information.
      *   **Verdict:** Raises a valid challenge outside Good's original framework.

  6.  **Lena (Technically Possible, Costly):** Her absorption strategy (treating recalibration functions as hypotheses with a prior) is **technically feasible** but comes at a **high cost**: It requires positing a **meta-prior over the space of possible recalibrations** *before* encountering the oracle. This is highly artificial and epistemically demanding. It assumes the agent already conceived of *all possible ways* their calibration could be flawed *and* assigned probabilities to them. This stretches the "prior over everything" presupposition to its limit and exposes it as a significant, often unrealistic, idealization. The theorem applies, but the model assumes away the core epistemic shock Marcus identified.
      *   **Verdict:** Absorption works formally but highlights the demanding "prior over everything" presupposition.

  7.  **Marcus (Clearly Right):** This is an excellent synthesis. He accepts the theorem as a **powerful diagnostic tool**, not a universal justification for seeking information. If information seems harmful, the theorem tells you *where to look* for the violated assumption (cost, impurity, non-consequentialism, non-Bayesian updating, impoverished state space). It "keeps the books" on rational choice coherence.
      *   **Verdict:** Accurate and insightful summary of the theorem's role.

  8.  **Lena (Clearly Right):** She correctly identifies the **residual substantive content**: the diagnostic *only ever* points to a violated background assumption; it **never licenses the conclusion that *information itself* (under the strict conditions) is bad**. The theorem guarantees that within its idealized world, costless, pure information *as such* isn't harmful; any harm must arise from elsewhere. This "floor" is small but non-trivial.
      *   **Verdict:** Correctly identifies the core non-trivial guarantee.

  **Overall Verdict:** **Both are largely right, but Lena wins the core debate about the theorem's status.** Marcus effectively exposes the significant scope limitations, modeling challenges, and potential for vacuity under generalization. Lena successfully defends the theorem's substantive content *within its specific domain* (expected utility, conditionalization, consequentialism, pure information, costlessness, fixed/comprehensive state space) and its crucial role as a diagnostic coherence constraint. Her point about the residual guarantee (info itself isn't harmful under the conditions) is decisive.

  **Your Specific Queries:**

  1.  **Impurity Cases (Move 3) & Lena's Reply (Move 4):**
      *   Marcus's cases are **not direct counterexamples** to Good's theorem *as formally stated* because they violate its explicit assumptions (pure signal, stable outcome space/consequentialism). They are **changes of subject** relative to the theorem's strict setup.
      *   However, they are **devastating counterexamples** to the *naive application* of Good's intuition ("free info should never hurt") to many real-world scenarios. They show the theorem's real-world limitations.
      *   Lena's reply **concedes significantly more than she initially admits in Move 2**. Move 4 acknowledges that restoring the theorem via modeling (state space enlargement) risks vacuity and fundamentally limits its scope. This concession validates Marcus's core concern about the theorem's fragility outside its idealized box.

  2.  **Calibration Oracle (Move 5) & Absorption (Move 6):**
      *   The case **can be formally absorbed** by enlarging the prior, as Lena describes (Move 6).
      *   **The Cost:** This requires a **meta-prior over the space of possible recalibration functions** (e.g., priors over shrinkage factors for log-odds). This is:
          *   **Highly Artificial:** Agents rarely, if ever, hold such explicit meta-priors.
          *   **Epistemically Demanding:** It assumes the agent anticipated *all possible ways* their fundamental probability assignment could be flawed.
          *   **Misses the Epistemic Shock:** The absorption models the *content* of the signal but sidesteps the challenge to the *foundation* of the agent's probabilistic reasoning framework. The agent learns their core tool is broken, not just that a specific hypothesis is wrong.
      *   **Verdict:** Absorption is a formal trick that preserves the theorem's letter but sacrifices realism and arguably misses the philosophical point of Marcus's challenge concerning foundational belief revision.

  3.  **Substantiveness of the Theorem:**
      *   **Yes, there is a substantive reading:** Within its specific, well-defined domain of assumptions (EU, conditionalization, consequentialism, pure costless info, comprehensive state space), the theorem provides a **non-trivial, falsifiable guarantee**: the expected value of such information is non-negative, and strictly positive if it might change your action. This has normative force for modeling rational choice under those conditions and serves as a crucial diagnostic.
      *   **It is heavily conditioned:** As Marcus powerfully argues and Lena concedes, the required assumptions are strong and often violated in practice (impurity, knowledge-dependence, evolving state spaces). The theorem does *not* naively justify seeking information in all real-world contexts.
      *   **It is not trivial:** The guarantee doesn't follow merely from "free is good" logic. It relies crucially on the specific structure of Bayesian updating and expected utility maximization, particularly the "option value" mechanism Lena describes (Move 2). Its failure under non-Bayesian updating (Move 2) proves its non-triviality.
      *   **Status:** It is a **substantive coherence constraint and diagnostic tool within a specific normative framework (Bayesian rational choice)**, not a universal law of information value. Its value lies in clarifying the conditions under which information *should* be valued non-negatively by a rational agent and diagnosing violations when it isn't.

  **What Both Are Missing:**

  1.  **The Normative/Ethical Dimension of Knowing:** They touch on utility dependence (Marcus's untreatable condition), but don't deeply explore if there are *inherent* normative reasons (beyond consequentialist utility) why knowing vs. not knowing might matter, which could challenge consequentialism itself as a framing.
  2.  **Computational/Bounded Rationality:** The debate assumes perfect Bayesian agents. Real agents have limited cognitive resources. The cost of *processing* information or the risk of mis-updating complex information could be seen as inherent "costs" or "impurities" relevant to Good's intuition, even if not captured by the formal theorem.
  3.  **The Value of Confirmation/False Positive Rates:** While the theorem handles uncertainty, it doesn't directly speak to the value of information in terms of reducing specific error probabilities (Type I/II) in hypothesis testing, which is crucial in scientific contexts.
  4.  **Good's Original Context:** While covered, they don't emphasize enough that Good's primary target was likely the economics of *statistical experimentation* under idealized conditions, not epistemology or science broadly. Its power lies in that specific domain.
