answer: |-
  ### Adversarial Collaboration Document: Predictive Processing vs. Enactive-Ecological Approaches  
  **Mediator's Draft for Sign-Off**  
  *Tags: [U] = Uncontroversial in field | [L] = Locally agreed (these two) | [D] = Field-disputed*  

  ---

  ### 1. Shared Claims (Numbered, Tagged)  
  Both parties agree to the following, pending final wording adjustments:  

  1.  **Organisms and environments are dynamically coupled.** Perception and action continuously influence each other in real-time, preventing a clean stimulus-response dichotomy. [U]  
  2.  **Biological systems maintain non-equilibrium steady states.** They resist entropy through adaptive exchanges with their environment (e.g., metabolic regulation). [U]  
  3.  **Perception is context-dependent and action-oriented.** What is perceived depends on current goals, physiological states, and environmental structure (e.g., affordances). [U]  
  4.  **The Free-Energy Principle (FEP) applies mathematically to any system with a Markov blanket.** This includes convection cells, cells, or brains, *if* they exhibit self-organization under non-equilibrium constraints. *Contention: What this implies biologically is disputed.* [D]  
  5.  **"Prediction" in neural circuits can be operationally defined.** Activity in sensory hierarchies (e.g., cortical layers) shows patterns consistent with top-down predictions and bottom-up mismatches. *Contention: Whether this reflects "inference" or mere dynamics is disputed.* [L]  
  6.  **Experimental evidence shows prediction-error signals exist in the brain.** Mismatch responses (e.g., EEG oddball effects) are robust, but *their functional role* (error-correction vs. system perturbation) is debated. [U]  
  7.  **Action alters sensory input to reduce perceived deviations.** Both agree action regulates input (e.g., saccades suppress prediction errors), but not *why* this occurs. [L]  
  8.  **The dark-room objection highlights a core tension.** If surprise minimization drives behavior, agents should seek predictable, low-stimulus environments. They do not. [U]  

  ---

  ### 2. Disagreements Table  
  Each row states one disagreement in dual formulations.  

  | **Predictive Processing (PP) View**                                | **Enactive-Ecological (EN) View**                                  |
  |--------------------------------------------------------------------|--------------------------------------------------------------------|
  | Perception requires inference over an internal generative model. Without it, structured behavior cannot emerge from noise. | Perception arises from sensorimotor loops in agent-environment dynamics; positing internal models adds no explanatory power and misrepresents causality. |
  | Action exists to fulfill predictions by minimizing expected surprise, with "prior preferences" (e.g., seeking food) resolving the dark-room paradox. | Action is direct regulation of coupling with the environment; "prior preferences" are post-hoc labels for evolved dynamics and do not explain novelty-seeking. |
  | The FEP formalism (free-energy minimization) describes a universal principle. Systems satisfying it (e.g., convection cells) "infer" their states, validating the theory’s breadth. | The FEP formalism is vacuously general. Showing a convection cell "minimizes free energy" is a mathematical redescription, not evidence of cognitive relevance. |
  | Predictive processing provides a falsifiable brain architecture: If top-down predictions do not modulate sensory errors (e.g., in V1), the theory fails. | Predictive coding is one dynamic among many; brains need no domain-general "prediction engine," and task-specific dynamics suffice. |
  | Update-rule instrumentalism makes the theory unfalsifiable by decoupling math from mechanisms, ignoring how models/predictions are implemented. | Update-rule instrumentalism admits the math is just dynamics, making PP trivial; the debate is about ontology, not formal equivalence. |

  ---

  ### 3. Crux Table  
  Each crux includes a testable case and both sides’ advance predictions.  

  | **Crux Issue**                          | **Concrete Test Case**                                             | **PP Prediction**                                                  | **EN Prediction**                                                  |
  |-----------------------------------------|--------------------------------------------------------------------|--------------------------------------------------------------------|--------------------------------------------------------------------|
  | **Role of internal models**             | *Case:* Train agents (robots/animats) in environments with no stable statistical regularities (e.g., fractal noise). Test if they develop hierarchical "generative models" or rely on direct coupling. | Systems will develop internal structures that encode priors, detectable as top-down modulation during perturbations. | Behavior will emerge from real-time dynamics; no hierarchical models will form, only context-specific sensorimotor loops. |
  | **Dark-room resolution**                | *Case:* Measure exploration in deprivation (e.g., rodents in dark vs. complex environments). Manipulate "expected uncertainty" (e.g., via dopamine). | Agents will avoid dark rooms only if priors encode "expected uncertainty" about needs (e.g., hunger); neural signals will reflect this. | Exploration reflects intrinsic dynamics (e.g., curiosity as homeostasis), not surprise minimization; no predictive signals will correlate uniquely. |
  | **Triviality of FEP universality**      | *Case:* Convection cells shown to formally minimize free energy with a Markov blanket. Does this imply they "infer" their state? | Yes—this demonstrates FEP’s universality; any self-organizing system can be described as inferring hidden states. | No—this shows only mathematical equivalence; "inference" is anthropomorphic and explanatory only for cognitive systems. |
  | **Update-rule instrumentalism**         | *Case:* Model a system (e.g., slime mold navigation) with FEP mathematics, but with no identifiable "predictions" or "errors" in its biology. | The formalism still explains efficiency; if the math fits, it validates inference as a functional description. | This confirms FEP is a just-so story; the math works because dynamics are generic, not because inference occurs. |

  ---

  ### Addressing Specific Mandates  
  - **Formalism Scope:** PP focuses on *Predictive Processing* (brain architecture); EN attacks *Predictive Coding* (circuit claims) as implausible. FEP’s generality is treated as mathematically true but biologically irrelevant by EN.  
  - **Dark-Room Objection:** PP contends "prior preferences" (e.g., expected nutrition) are inherent to generative models and are not ad hoc—they emerge from evolutionary constraints. EN rejects this, arguing preferences are exapted dynamics; calling them "priors" rescues PP from falsification.  
  - **Triviality Worry:** A system falsifying FEP would lack a Markov blanket (e.g., gas in equilibrium). For convection cells: PP takes satisfaction as validation; EN takes it as proof of triviality.  
  - **Update-Rule Instrumentalism:** PP rejects it—without ontological commitment to models, the theory cannot make mechanistic claims. EN accepts it as endpoint—it relocates the fight to whether "inference" is ever more than a metaphor.  

  **Confidence Notes:**  
  - Shared claims [U] tags reflect field consensus (e.g., Friston, Chemero, Clark papers). [D] tags mark known schisms (e.g., universality of FEP).  
  - Reconstructions are grounded in canonical arguments; speculative where explicitly flagged (e.g., EN math formalizations).  
  - Your "teaching risk" areas: FEP universality [D], predictive coding necessity [D], and dark-room resolution [L] are live battles. Perception-action coupling [U] is safe.  

  \answer{Whether novelty-seeking violates surprise minimization}
