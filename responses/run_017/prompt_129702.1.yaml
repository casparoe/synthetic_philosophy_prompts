prompt: |-
  hey — I'm putting together a special issue on levels of selection and I've talked myself into trying something: instead of another round of reply-and-counter-reply, I want two of the contributors to actually produce one joint paper. Nadia is a gene's-eye / selection-among-replicators person who thinks group talk is bookkeeping that can always be cashed out in relatedness terms. Owen does multilevel selection and thinks the between-group term is sometimes where the actual causal story lives. They've been extremely polite to each other for years and have moved approximately zero inches, and I want the document they'd both have to put their names to.

  You're a philosopher of biology who's refereed this literature forever and is bored of the same three moves on both sides. Think carefully, and before you draft anything, brainstorm two things: first, what the real shared ground is given the modern machinery (Price-style partitionings, relatedness coefficients, and the distinction between groups as contexts that sort individuals' fitness versus groups as things that themselves reproduce); second, what a case would have to look like to be genuinely diagnostic instead of one more example each side can retrofit into their own framework in an afternoon. Then write the statement.

  The case I want them to work through is one I made up, so nobody has a canned answer lying around:

  An engineered consortium of gut bacteria in a lab mouse colony. A strain carries a plasmid with a gene for a secreted enzyme that breaks down a fiber the mice otherwise can't digest. The enzyme leaks out of the cell, so every cell in the gut gets the sugar whether it carries the plasmid or not, while carriage costs the cell roughly 8% of its growth rate. The plasmid also transfers horizontally by conjugation between cells in the same gut, at a rate you can dial up or down with an inducer. Mice live in family cages, pups are colonized from a small number of founder cells whose number you control (1 to 1000), and each generation some adults get moved between cages, so migration is a knob too. There's also a mutant plasmid in circulation: it transfers about twice as fast but has the enzyme gene knocked out, so it's a defector at the cell level while being better at being a plasmid.

  So you can independently vary the cost of carriage, the conjugation rate, the colonization bottleneck, and the migration rate, and you can watch enzyme output per cage and plasmid frequency within guts over a few hundred bacterial generations.

  What I want, as the document:

  1. A numbered agreed-claims section, maybe six to nine items: the claims both of them can sign without gritting their teeth. Include what they agree about the decomposition of change in the population (that it's a partition, not a causal story in itself), about the baseline prediction for a costly public good under low relatedness, and about what would have to be true for cage-level differences in productivity to feed back into the global frequency of the plasmid.
  2. A disagreements table. Columns: the crux; the formulation Nadia would accept for her own side; the formulation Owen would accept for his; the one experiment or measurement both agree bears on that crux, stated as an actual manipulation of the four knobs; Nadia's prediction up front; Owen's prediction up front. I'd guess among the cruxes are whether horizontal transfer makes plasmid carriage a trait of the cell at all, whether the group here is the gut, the cage, or the set of plasmid copies in a host, and who counts as the beneficiary when the mutant plasmid spreads.
  3. A short section on which of their disputes are merely verbal — say which, and what would have to be fixed in the vocabulary to settle them.
  4. Rules for yourself: no citations or reading lists, invent no equations beyond what both sides already accept, and if you can't find a manipulation both of them would accept as bearing on a crux, say so plainly rather than inventing one. Every prediction has to be about something measurable in this setup. And don't let either side win by definitional fiat, e.g. by stipulating what a 'group' or a 'cheater' really means.

  Aim for something like a thousand words, written so it could go out to both of them with only copy-editing. Then finish with a single line in exactly this form, naming the crux you judge most likely to actually move them:

  \answer{crux N: six words or fewer}
reasoning: |-
  We are drafting a joint statement for Nadia and Owen on the engineered gut bacteria consortium case. The goal is to find shared ground, clarify disagreements, and identify a diagnostic experiment. We proceed step by step.

  First, we brainstorm shared ground using modern machinery (Price equation partitioning, relatedness, group concepts). Both sides accept:
  - The Price equation provides a mathematical partition of evolutionary change, but this partition does not by itself specify causal processes.
  - Relatedness (regression of partner genotype on focal genotype) is a key parameter in social evolution models.
  - Groups can be defined in different ways: as "contexts" that sort individuals (affecting individual fitness) or as "collectives" that themselves reproduce (with group-level fitness).
  - In this system, the plasmid is a replicator (Nadia's view) and the gene for the enzyme is a public good trait at the cell level.
  - Without sufficient relatedness or other mechanisms, a costly public good is expected to be invaded by defectors (here, the mutant plasmid).
  - The system allows manipulation of key parameters: cost (c), conjugation rate (b, for transfer benefit), colonization bottleneck (affecting within-host relatedness), and migration (affecting between-host relatedness).

  Now, what case would be genuinely diagnostic? The ideal case would:
  - Have a parameter manipulation that one theory predicts will change the outcome (e.g., plasmid frequency) while the other does not, or predicts the opposite change.
  - Avoid ambiguities in defining the "group" (gut vs. cage) and the "trait" (plasmid carriage at cell level vs. plasmid type at group level).
  - Test whether group-level productivity (cage enzyme output) has a causal effect on the global frequency of the plasmid, beyond what is accounted for by individual-level fitness and relatedness.

  Specifically, we can manipulate the migration rate and the colonization bottleneck to vary the level at which selection acts. For instance, if we set a high migration rate (mixing plasmids across hosts) but a strong colonization bottleneck (so within-host relatedness is high), we can see if between-host selection (due to differences in host productivity) affects plasmid frequency. Nadia might argue that any group effect reduces to within-host relatedness and individual fitness, while Owen might argue that between-host selection is causal.

  Now, we draft the document.

  # Joint Statement on the Engineered Gut Bacteria System

  ## 1. Agreed Claims

  Both authors endorse the following statements:

  1. The system involves a replicator (the plasmid) with a gene encoding a costly public good (enzyme production). The enzyme is non-excludable and provides a benefit to all cells in the gut, regardless of plasmid carriage. Carriage imposes a cost (c ≈ 8% reduction in growth rate) on the cell.

  2. The mutant plasmid (with higher conjugation rate but no enzyme gene) is a "defector" at the cell level: it benefits from the public good without paying the cost and can spread by horizontal transfer.

  3. Evolutionary change in plasmid frequency can be partitioned using a Price equation approach (or equivalent, such as the multilevel Price equation). This partitioning is a mathematical decomposition and does not, by itself, assign causality.

  4. Relatedness (regression coefficient of partner plasmid carriage on focal plasmid carriage) is a crucial factor in the evolution of cooperation. In this system, within-gut relatedness can be increased by reducing the colonization bottleneck (fewer founders) or by reducing migration between cages. Between-cage relatedness can be altered by migration rate.

  5. In the absence of sufficient within-host relatedness and without horizontal transfer, the mutant plasmid is expected to invade and drive the cooperative plasmid to low frequency or extinction, due to the cost of cooperation.

  6. Horizontal transfer (conjugation) can promote the spread of the cooperative plasmid by increasing the local frequency of cooperators in a gut, even if the global frequency is low. However, the mutant plasmid also transfers horizontally and may outcompete the cooperative plasmid in transfer rate.

  7. For cage-level differences in productivity (due to differences in enzyme output) to affect the global frequency of the cooperative plasmid, two conditions must be met: (a) cages must vary in plasmid frequency (so that high-productivity cages have more cooperative plasmids), and (b) there must be a process by which the productivity of a cage increases the output of plasmids from that cage to the global population (e.g., via migration or colonization of new hosts).

  8. The system allows independent manipulation of key parameters: cost of carriage (c), conjugation rate (bottleneck-adjusted transfer rate), colonization bottleneck (N, number of founders per host), and migration rate (m, between cages). These manipulations can test hypotheses about the levels of selection.

  ## 2. Disagreements Table

  | Crux | Nadia's Formulation | Owen's Formulation | Diagnostic Experiment | Nadia's Prediction | Owen's Prediction |
  |------|----------------------|---------------------|------------------------|---------------------|-------------------|
  | **Crux 1: Primary level of selection for plasmid spread** | Plasmid frequency change is driven by selection at the level of plasmids (replicators) and cells, with relatedness among cells in a gut being a key parameter. Groups (guts or cages) are not units of selection; they are contexts that modulate relatedness. | Plasmid frequency change can be driven by selection at the group level (guts or cages), especially when between-group variation in plasmid frequency affects group productivity and group reproduction. Groups can be units of selection when group fitness differences are causal. | Set **low within-host relatedness** (large colonization bottleneck, e.g., 1000 founders) and **low migration** (so between-cage variation is maintained). Then **vary the conjugation rate** of the cooperative plasmid (low vs. high). Measure the global frequency of the cooperative plasmid after 100 generations. | With low relatedness, even high conjugation cannot save the cooperative plasmid because the mutant plasmid transfers faster and has no cost. Cooperative plasmid goes extinct. | High conjugation can allow the cooperative plasmid to persist by increasing local frequency in each gut, even with low relatedness. If conjugation is high, cooperative plasmid frequency stabilizes at a positive value. |
  | **Crux 2: Role of group productivity in global frequency** | Any effect of cage productivity on global plasmid frequency is mediated by increased output of cells (and hence plasmids) from high-productivity cages, but this is captured by the individual-level fitness of plasmids in those cages and migration. Group productivity is not an independent causal factor. | Cage productivity can directly cause an increase in global plasmid frequency by making high-plasmid-frequency cages more likely to contribute to the migrant pool or colonize new hosts, even if within-cage selection is against cooperation. | Set **high migration** (so between-cage variation is low) and **strong colonization bottleneck** (small N, e.g., 1-10 founders, so within-host relatedness is high). Then **vary the cost of carriage** (c) and measure the effect on global plasmid frequency and cage enzyme output. | With high migration, between-cage selection is weak. Increasing cost (c) reduces plasmid frequency, regardless of group productivity. Enzyme output may be high due to high relatedness, but this does not require group selection. | Even with high migration, if the bottleneck is strong, group productivity (enzyme output) can affect the success of the group in contributing to migrants. Increasing cost might be offset by group benefits if groups with high plasmid frequency are more productive and contribute more migrants. |
  | **Crux 3: Beneficiary of mutant plasmid spread** | The mutant plasmid is a "cheater" at the cell level: it benefits itself by avoiding the cost of cooperation and exploiting the public good. The beneficiary is the mutant plasmid itself (replicator-level selection). | The mutant plasmid is a "cheater" at the cell level, but if it causes group productivity to decrease, it may be disfavored by group selection. The beneficiary is ambiguous: the plasmid gains, but the group (and the cells in it) may lose. | Set **moderate within-host relatedness** and **moderate migration**. Introduce the mutant plasmid at low frequency. Then **manipulate the conjugation rate of the mutant plasmid** (normal vs. high). Measure the change in global frequency of the mutant plasmid and the average enzyme output per cage. | Increasing mutant conjugation rate increases its global frequency, regardless of group productivity. Enzyme output decreases as mutant spreads. | Increasing mutant conjugation rate may not increase its global frequency if it causes group productivity to collapse, leading to fewer migrants from high-mutant groups. Enzyme output decreases, but mutant frequency may not rise as much as expected. |

  ## 3. Merely Verbal Disputes

  Some disagreements may be primarily verbal:

  - **Definition of "group"**: Nadia defines a group as a set of individuals that interact in a way that affects their fitness (here, the gut). Owen sometimes defines groups as entities that themselves reproduce (here, the cage, if we consider the cage as a unit that produces migrants). We agree to specify the level (gut or cage) and the role (context for selection vs. unit of selection) in each experiment.

  - **"Level" of selection**: The dispute often reduces to whether "group selection" requires groups to be "reproducers" (Owen) or whether it can include any between-group variance component (Nadia). We agree that the Price equation partition has a between-group term, but causality requires that group fitness differences are not reducible to individual fitness differences.

  - **"Cheater"**: Both agree the mutant plasmid is a cheater at the cell level. The dispute is whether it can be a cheater at the group level (if groups are the units). We avoid the term "group cheater" and instead specify the level.

  ## 4. Rules Followed

  - No citations or reading lists.
  - Equations: We use only the standard Price partitioning and relatedness, which both accept.
  - Every prediction is measurable: plasmid frequency (via sequencing), enzyme output (per cage), and experimental manipulations (knobs).
  - If a crux lacks a diagnostic experiment, we state so. Here, we propose experiments for each crux.

  ## Conclusion

  The most promising crux to resolve is **Crux 1**, as it directly tests whether horizontal transfer can sustain cooperation under low relatedness without group selection, and both have clear, opposing predictions.

  \answer{crux 1: can conjugation rescue cooperation?}
answer: |-
  ### Joint Statement on Levels of Selection in Engineered Gut Bacteria  
  **Nadia and Owen, Draft for Shared Review**  

  #### 1. Agreed Claims  
  Both authors endorse the following statements about the system and its interpretation:  
  1. **Mathematical partitioning**: The Price equation (or equivalent regression-based partitions) decomposes the total change in plasmid frequency into within-group and between-group components. This decomposition is descriptive, not inherently causal—it does not specify *why* fitness differences arise.  
  2. **Replicator status**: The plasmid is a replicator. Its frequency dynamics depend on vertical inheritance (cell division), horizontal transfer (conjugation), and selection at the cell or group level.  
  3. **Baseline expectation**: When within-gut relatedness is low (e.g., large colonization bottlenecks or high migration), the mutant plasmid ("defector") should invade and suppress the cooperative plasmid due to its lower cost and higher transfer rate, reducing enzyme output.  
  4. **Relatedness matters**: Within-gut relatedness increases with smaller colonization bottlenecks or lower migration. Higher relatedness favors cooperation by aligning cell and plasmid interests.  
  5. **Group feedback requirement**: For cage-level differences in enzyme output to increase global plasmid frequency, two conditions must hold: (i) cages vary in plasmid frequency (creating between-cage variance), and (ii) high-output cages contribute disproportionately to future generations (e.g., via migration or colonization).  
  6. **Horizontal transfer ambiguity**: Conjugation blurs individuality. A cell’s fitness depends on its plasmid carriage, but transfer allows plasmids to "move" between cells, complicating trait attribution.  
  7. **Experimental control**: The four knobs (cost, conjugation, bottleneck, migration) independently alter selective pressures. All can be measured: plasmid frequency (sequencing), enzyme output (assayed per cage), and relatedness (via genotype distributions).  

  #### 2. Disagreements Table  
  | Crux | Nadia’s Acceptable Formulation | Owen’s Acceptable Formulation | Diagnostic Experiment | Nadia’s Prediction | Owen’s Prediction |  
  |------|--------------------------------|-------------------------------|------------------------|---------------------|-------------------|  
  | **Crux 1: Does horizontal transfer negate group-level causality?** | Conjugation makes plasmid dynamics replicator-driven; group (gut) outcomes are aggregations of cell/plasmid fitness. | Conjugation doesn’t preclude group selection; gut-level fitness differences can drive plasmid evolution if groups vary in productivity. | **Fix:** High cost (8%), large bottleneck (1000 founders), high migration (50% adult swap). **Vary:** Conjugation rate (low vs. high for cooperative plasmid). **Measure:** Global plasmid frequency after 200 generations. | Higher conjugation slightly slows cooperative plasmid decline but cannot prevent extinction; mutant dominates. | Higher conjugation enables persistence (≥10% frequency) by amplifying local cooperation, despite high migration. |  
  | **Crux 2: What defines the ‘group’?** | Groups are guts—interaction contexts where relatedness modulates cell fitness. Cages are not groups, just migration channels. | Groups are cages—distinct reproductive units where productivity differences cause differential plasmid output. | **Fix:** Low cost (2%), high conjugation for cooperative plasmid. **Vary:** Bottleneck (1 vs. 1000 founders) and migration (0% vs. 30% swap). **Measure:** Between-cage variance in plasmid frequency. | Variance decreases with migration; bottleneck size has negligible effect on cage-level variance. | Variance persists with migration if bottlenecks are small; large bottlenecks erode cage-level structure. |  
  | **Crux 3: Who benefits from mutant spread?** | The mutant plasmid benefits itself (replicator fitness); "cheating" is cell-level exploitation of public goods. | The mutant plasmid may "win" locally but reduces group productivity; beneficiaries are context-dependent. | **Fix:** Moderate bottleneck (100 founders), low migration (10%). **Vary:** Mutant conjugation rate (normal vs. 2×). **Measure:** Global mutant frequency and average enzyme output. | Mutant frequency increases with its conjugation rate; enzyme output declines linearly. | Mutant frequency plateaus or declines at high transfer if gut productivity collapses, reducing plasmid export. |  

  #### 3. Merely Verbal Disputes  
  - **"Group selection"**: Nadia restricts "group selection" to cases where groups are Darwinian individuals (reproducing with heredity). Owen uses it for any between-group variance component. *Resolution:* Specify "contextual selection" (groups as fitness-modifying environments) vs. "collective selection" (groups as fitness-bearing entities).  
  - **"Cheater"**: Both agree the mutant exploits the enzyme at the cell level. Disagreement arises if called a "group cheater." *Resolution:* Avoid "group cheater"; use "cell-level defector" or "productivity reducer."  
  - **"Level"**: "Selection at level X" is uncontroversial if fitness differences at X are irreducible. The dispute is whether gut/cage fitness is reducible. *Resolution:* Explicitly define "fitness" at each level (e.g., cell division rate vs. cage export rate).  

  #### 4. Rules Adhered To  
  - No citations, equations, or reading lists.  
  - All predictions use measurable outputs (plasmid frequency, enzyme, variance).  
  - No invented manipulations: experiments use existing knobs.  
  - If a crux lacks a shared diagnostic test, we note it (none here).  

  ---  
  \answer{crux 1: can conjugation rescue cooperation?}
