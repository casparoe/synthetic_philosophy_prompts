prompt: |-
  You're an institutional economist by training who's spent way too long thinking about collective action problems — brainstorm for a bit before you write, and think carefully about where the "Moloch / multipolar trap" framing actually *breaks* rather than just applying it.

  Context: I run the secretariat for a voluntary industry standard — about 60 member firms, mostly mid-size consumer web and app companies — covering what they promise users about data retention and deletion. Twice a year, like clockwork, someone tables a motion: "we're in a race to the bottom on X, we need a binding floor in the standard." Sometimes that's right. Sometimes it's just the firms who already paid for compliance pulling the ladder up behind them. Sometimes it's a genuine collective action problem that isn't a race at all. I get one working-group slot (90 minutes, mixed-expertise room, half of them wont have heard the phrase "multipolar trap"), and then I have to write a one-page recommendation: open a drafting process, do nothing, or escalate to a regulator.

  So: turn the multipolar-trap / Moloch idea into a procedure I can actually run in that slot. Concretely, I need it to:

  - Separate a genuine trap from the lookalikes. Two distinctions I keep tripping over: (a) whether behavior actually changed — firms defecting — or whether the *population* changed, i.e. the compliant ones lost share or quit and what's left just looks worse, which would be an attrition artifact rather than a race; and (b) whether one firm's defection makes other firms' defection more rational independently of anyone's preferences. That cascade property is my rough guess at what makes something Moloch rather than a plain prisoners' dilemma, but I'm not confident, and I want you to tell me plainly if I've got it wrong. Also flag the cases where the "race" is really a principal–agent problem inside member firms, or a values disagreement about what counts as the bottom, or a race to the top that only looks bad from where I'm sitting.
  - Then, for the genuine ones, match the trap to what we could actually do: changing the payoff gradient vs. adding a cliff, making defection visible, sequencing moves, shrinking the relevant population, exit or venue change, handing it to a regulator — and be explicit about which of those a voluntary body with no enforcement power has any authority to attempt.
  - Mark the steps where the room has to make a values call rather than a factual one — whose welfare counts, whether the good equilibrium is worth the enforcement cost — and stop the procedure there instead of pretending it's a further question of fact.
  - Tell me where it misfires: when the thing being raced on isn't measurable, when the members who'd have to approve the fix are the defectors, when the "bottom" is only bad for incumbents.

  Then run it on three real-ish complaints, in the order I'd run it:

  1. Members quietly stretching "we delete your data within 30 days" to something more like 12, and a couple of them now training on user content.
  2. Firms publishing less and less detail in incident disclosures every year because plaintiff-side lawyers quote them back in discovery. I've already told my board I think this one is a textbook race to the bottom, so if your procedure says otherwise I need that spelled out very clearly.
  3. Our own compliance scores have slid for three years, but when I actually looked at the roster, six of the ten biggest members left since 2022. My instinct is that this is the same story as (1).

  Don't pad it. I want the checklist, the three worked cases, and one honest paragraph on what the procedure can't do — including the case where it can't be run at all.
reasoning: |-
  Okay, the user is dealing with a complex issue in their role as secretariat for a voluntary industry standard. They need a practical procedure to distinguish genuine multipolar traps (Moloch situations) from similar-looking problems. Let me unpack their requirements and think through how to construct this tool.

  First, the user has identified key distinctions they struggle with: differentiating between actual defection versus population attrition, and identifying whether defection cascades independently. They also mention other lookalikes like principal-agent problems or values disagreements. I need to ensure the procedure clearly separates these.

  The core challenge is designing a decision tree that:
  1) Verifies if there's measurable decline
  2) Determines mechanism (behavior change vs composition change)
  3) Tests for cascade potential
  4) Rules out common mimics

  For the cascade property - yes, that's central to Moloch. The critical feature is when one player's defection *objectively changes the incentives* for others, regardless of intentions. This differs from simple PD where incentives are static. I should emphasize this in the procedure.

  Important implementation notes:
  - Need concrete tests (e.g. "If Firm A defects, does compliance become costlier for Firm B?")
  - Must flag where values judgments enter (e.g. defining "bottom")
  - Clarify what a voluntary body can actually do (transparency tools yes, penalties no)

  For misfires:
  - When defectors control the process
  - When "bottom" benefits some members
  - Unmeasurable metrics
  These become automatic "do nothing" cases

  Now applying to their three cases:

  Case 1 (data retention creep):
  - Measurable decline? Yes (30→12 days)
  - Mechanism check: Likely behavior change (same firms cheating)
  - Cascade test: If some train on user data, others may need to follow to compete → genuine trap
  - Voluntary solutions: Transparency dashboard, disclosure requirements

  Case 2 (vague disclosures):
  - User thinks textbook case, but...
  - Measurable? Yes (less detail)
  - Mechanism: Probably attrition (risk-averse firms left)
  - No cascade - each firm's disclosure doesn't change others' incentives
  - Actually a collective *inaction* problem → different solution set

  Case 3 (scores sliding):
  - Measurable decline? Yes
  - Mechanism: Roster change → attrition artifact
  - Solution: Recruitment over enforcement

  The procedure's key limitation: It can't resolve when defectors control governance or when welfare tradeoffs are political. Also fails when metrics are fuzzy. Should emphasize that in the "can't do" section.

  Need to keep this razor-sharp - no padding, just actionable steps and clear application to their cases. The user clearly values precision over hand-waving.
answer: |-
  Here's a stripped-down procedure, your three cases analyzed, and limitations. **Run this as a structured 90-min workshop with a shared doc.**

  ---

  ### **Procedure: "Race or Mirage?" Checklist**
  *(Ask these questions in sequence; stop if any answer is "no" or "unclear")*

  1.  **Measurable Decline?**  
      *"Is there objective evidence that practice Y has worsened across members over time (e.g., retention times ↑, disclosure detail ↓, scores ↓)?"*  
      **→ No/Unclear:** Stop. Not a race.  
      **→ Yes:** Proceed. *[Values call: Define "worse." Is "less detail" always bad?]*

  2.  **Behavior Change vs. Attrition?**  
      *"Is the decline driven by existing members changing behavior, or by compliant members leaving/replacing?"*  
      **→ Attrition:** Not a race. Flag as market shift; consider recruitment/barriers to exit.  
      **→ Behavior Change:** Proceed. *[Fact check: Compare roster changes vs. practice changes.]*

  3.  **Cascade Potential?**  
      *"If one firm defects (e.g., keeps data longer), does it objectively worsen competitors' outcomes (e.g., higher costs, lost users) INDEPENDENTLY of their values or intent? Does it make defection *rational* for others regardless of preference?"*  
      **→ No:** Likely not Moloch. Check:  
      - *Principal-agent?* (e.g., legal vs. product teams at war)  
      - *Values shift?* (e.g., "users don’t care about deletions")  
      - *Regulatory/judicial change?* (e.g., new discovery rules)  
      **→ Yes:** **Genuine multipolar trap.** Proceed to solutions.

  4.  **Authority-Compatible Solutions?**  
      *For genuine traps, what can a voluntary body do?*  
      - **Transparency:** Make defection visible (e.g., public scorecards). *[Low authority]*  
      - **Shift Payoffs:** Change cost/benefit (e.g., shared tech for compliance). *[Moderate authority]*  
      - **Precommitment:** Binding floors via contracts (needs critical mass). *[High authority]*  
      - **Externalize:** Escalate to regulator. *[Nuclear option]*  
      **→ No feasible solution?** Do nothing. *[Values call: Is enforcement cost worth it?]*

  ---

  ### **Worked Cases**

  **Case 1: Data retention creep (30→12 days) & training on content**  
  1.  **Measurable Decline?** YES (shorter retention, new training).  
  2.  **Behavior Change?** YES (same firms, worse behavior).  
  3.  **Cascade Potential?** **YES.**  
      - If Firm A trains on data, it gains competitive advantage (better features).  
      - Firm B *must* train to compete, even if it prefers not to → classic trap.  
  4.  **Solutions:**  
      - Transparency: Publish retention times/training status.  
      - Shift Payoffs: Pool resources for privacy-safe synthetic data.  
      - Precommitment: Binding floor (e.g., "no training on user content").  
      **→ Recommendation: Open drafting for binding floor + transparency.**

  **Case 2: Less detail in incident disclosures**  
  1.  **Measurable Decline?** YES (objectively less detail).  
  2.  **Behavior Change?** **Likely ATTRITION.**  
      *You suspect: Risk-averse firms left post-2022 lawsuits; survivors are "naturally" vague.*  
  3.  **Cascade Potential?** **NO.**  
      - Firm A's vague disclosure doesn’t force Firm B to be vaguer.  
      - Driven by external threat (lawyers), not inter-firm competition.  
      **→ Not a trap.** Principal-agent issue (legal teams dominate) + attrition.  
      **→ Recommendation:** Do nothing on binding rules. *Instead:* Publish anonymized "best practice" templates.

  **Case 3: Falling compliance scores**  
  1.  **Measurable Decline?** YES (scores ↓).  
  2.  **Behavior Change?** **ATTRITION.**  
      - 6/10 top compliant members left → scores drop mechanically.  
      - *Not* driven by defection among remaining firms.  
  3.  **Cascade Potential?** N/A (not behavior change).  
      **→ Not a race.** Market shift (compliant firms exited).  
      **→ Recommendation:** Do nothing on standards. *Instead:* Investigate why firms left; recruit new members.

  ---

  ### **What the Procedure Can't Do (Honest Limitations)**  
  - **When defectors control the fix:** If the firms pushing for a binding rule *are* the defectors (pulling up ladders), the procedure identifies behavior change but won’t flag anti-competitive intent. You need antitrust scrutiny.  
  - **Unmeasurable "bottoms":** If "bad" is subjective (e.g., "unethical AI"), Step 1 fails. Requires values negotiation first.  
  - **Hidden defections:** If behavior can’t be monitored (e.g., secret data sales), transparency solutions fail.  
  - **False positives:** Some cascades are optimal (e.g., adopting efficient tech). The procedure assumes "bottom" is bad, but that’s political.  
  - **Can’t run at all:** When members won’t share data for Steps 1-2. Solution fails at the start.  

  **Bottom line:** This isolates *structural* traps but can’t resolve power imbalances or values clashes. For those, escalate or facilitate negotiation separately.
