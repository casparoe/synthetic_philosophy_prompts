prompt: |-
  Two people on the professional-ethics curriculum committee I chair have been going at it for two years over the situationist critique of virtue ethics, and I want the joint statement they should have produced instead of another round of emails. Rough version of the two views: the situationist says the social-psychology literature (the Harman / Doris line) shows there are no robust global character traits, so virtue talk is empirically empty and the real upshot is that we should redesign situations; the neo-Aristotelian says traits are real but their behavioural signature isn't cross-situational consistency at a moment, it's diachronic situation-selection — the honest agent is the one who over time ends up in fewer situations where cheating is cheap or tempting, and who shapes the situations she's in — call it the niche-construction reply.

  Give me: the claims both can sign (both grant that raw cross-situational consistency in single acts is low, neither thinks it's literally zero, both grant trait language can't be used sloppily); then the disagreements, each in wording that side would accept for its own view; then a straight verdict on which parts of this are verbal — a fight about the word trait — and which are genuine. Three cruxes, each with a test or case both agree would bear on it and each person's prediction written down in advance: (1) a pre-registered experience-sampling study with independently coded situations, where the question is whether residual between-person variance still predicts behaviour in new, differently-coded situations; (2) whether any program of situation-design has to presuppose agents who drift toward or away from certain kinds of situation, i.e. whether situationism quietly needs the selectionist story; (3) whether virtue can keep doing normative work as a regulative ideal even if almost nobody instantiates it. Numbered agreed claims first, then a disagreements table. Be committed about who should concede what, and flag anywhere I've characterised one of the two unfairly.
reasoning: |-
  Okay, the user is chairing a professional-ethics curriculum committee where two members have been debating the situationist critique of virtue ethics for two years. They need a joint statement instead of more emails. Let me break down their positions.

  The situationist argues that social psychology (Harman/Doris) shows no robust global character traits, making virtue talk empty. The solution is redesigning situations. The neo-Aristotelian counters that traits are real but defined by diachronic situation-selection and niche construction—traits manifest over time through avoiding tempting situations and shaping environments.

  The user wants agreed claims, disagreements in each side's wording, verdicts on verbal vs. genuine disputes, and three cruxes with testable predictions. Also, they want the assistant to be decisive about concessions and fairness.

  First, the agreed claims. Both sides accept low cross-situational consistency (not zero), trait language needing precision, and the importance of situations. That's common ground. 

  Next, disagreements. For the situationist, traits as traditionally defined don't exist. For the neo-Aristotelian, traits are diachronic patterns. The key is whether the dispute is verbal. The term "trait" is defined differently—cross-situational consistency vs. diachronic selection. That's mostly verbal. But the deeper issue is whether niche construction is necessary for situation design. That's substantive.

  Crux 1: An experience-sampling study. The situationist predicts no residual variance predicting behavior in new situations. The neo-Aristotelian expects variance due to niche construction tendencies. This tests if between-person differences exist beyond situations.

  Crux 2: Does situation design require agents who select situations? The situationist says no; situations can be imposed. The neo-Aristotelian argues design must account for drift, otherwise it's ineffective. This addresses if situationism secretly relies on selection.

  Crux 3: Can virtue function as a regulative ideal without instantiation? The situationist says no, it becomes useless. The neo-Aristotelian insists it's still motivating and aspirational. This is normative, not empirical.

  Fairness check: The user's summary seems balanced. The situationist might push back on "empirically empty" as too strong, but it's close to Harman/Doris. The neo-Aristotelian's niche construction is captured well.

  Concessions: The situationist should admit that traits defined as diachronic patterns exist. The neo-Aristotelian must concede that traditional virtue ethics overemphasized moment-to-moment consistency. Both need to refine their definitions.

  The joint statement should structure these points clearly: agreed claims first, then disagreements, verdicts, and cruxes. Ensuring both sides feel their views are accurately represented is crucial for signing off. Highlighting the verbal nature of the "trait" dispute can reduce conflict, while the cruxes provide concrete paths forward. The chair's role is to mediate by focusing on actionable outcomes like the statement and future tests.
answer: |-
  Here’s a structured joint statement incorporating agreed claims, clarified disagreements, verdicts on verbal vs. substantive disputes, and testable cruxes. Wording aims for neutrality while preserving each view’s core commitments.

  ---

  ### **Joint Statement: Situationism vs. Neo-Aristotelian Virtue Ethics**  
  *Agreed by the Committee on Professional-Ethics Curriculum*

  #### **I. Agreed Claims**  
  1. **Cross-situational consistency**: Moment-to-moment behavioral consistency across dissimilar situations is statistically low (though non-zero) in empirical social psychology studies.  
  2. **Trait language precision**: Virtue/trait terminology cannot be applied naïvely; it requires operational rigor to avoid empirical vacuity.  
  3. **Situation power**: Situational factors exert strong, well-documented influence on behavior.  
  4. **Practical goal**: Ethics education must address how to reduce harmful acts and cultivate prosociality.  
  5. **Non-exclusivity**: Situation redesign *and* character development may both be viable tools for moral improvement.  

  ---

  #### **II. Disagreements: Core Positions in Each Side’s Own Terms**  
  | Issue | Situationist View (Wording they accept) | Neo-Aristotelian View (Wording they accept) |
  |-------|------------------------------------------|---------------------------------------------|
  | **Nature of Traits** | "Global character traits (as empirically robust, cross-situational behavioral dispositions) do not exist; virtue attributions are descriptively empty." | "Robust traits exist as *diachronic, niche-constructing dispositions*: agents express virtue by habitually selecting/reshaping situations to align with values, reducing temptations over time." |  
  | **Primary Intervention** | "Ethics should prioritize *situation redesign* (e.g., nudges, defaults, structural incentives), as traits lack causal efficacy." | "Ethics must cultivate *agentic capacities for situation selection/shaping* (e.g., habit formation, prudential wisdom), as traits emerge via niche construction." |  
  | **Virtue’s Normative Role** | "Virtue as an ideal is inert without empirical traction; ethics should adopt *consequentialist situationism*." | "Virtue remains indispensable as a *regulative ideal* guiding long-term self-cultivation, even if fully instantiated rarely." |  

  ---

  #### **III. Verdict: Verbal vs. Substantive Disagreements**  
  - **Verbal (≈70%)**: The core dispute over "traits" is definitional.  
    - *Situationist*: Defines traits as **momentary cross-situational consistency**.  
    - *Neo-Aristotelian*: Defines traits as **diachronic patterns of situation engagement**.  
    - **Resolution**: Both can agree traits (as cross-situational acts) are weak, while traits (as niche-construction tendencies) may be robust.  
  - **Substantive (≈30%)**: Whether niche-construction capacities *must* underpin effective situation design (see Crux 2).  

  ---

  #### **IV. Testable Cruxes with Advance Predictions**  
  **Crux 1: Trait Stability Across Contexts**  
  - **Test**: Pre-registered ESM study. Participants report behavior in 50+ situations over 3 months. Independent coders classify situations. Residual between-person variance is tested for predicting behavior in *novel, differently-coded situations*.  
    - *Situationist prediction*: Residual variance ≈ 0.  
    - *Neo-Aristotelian prediction*: Significant residual variance (reflecting niche-construction capacity).  

  **Crux 2: Situation Design’s Dependence on Agency**  
  - **Test**: Evaluate real-world interventions (e.g., anti-corruption nudges). Does success *require* agents to drift toward/away from contexts?  
    - *Situationist prediction*: Effective design *does not* presuppose selection (e.g., changing default options works regardless of drift).  
    - *Neo-Aristotelian prediction*: Design fails without complementary drift (e.g., agents who avoid audit-heavy contexts undermine the nudge).  

  **Crux 3: Regulative Ideal Efficacy**  
  - **Test**: Longitudinal study of ethics trainees. Compare motivation/behavioral change in groups taught:  
    - (A) Virtue as aspirational ideal (despite rarity),  
    - (B) Purely situational strategies.  
    - *Situationist prediction*: Group B shows superior real-world improvement.  
    - *Neo-Aristotelian prediction*: Group A sustains long-term engagement better.  

  ---

  #### **V. Recommended Concessions & Fairness Check**  
  - **Situationist should concede**: Niche-construction patterns (e.g., stable situation-avoidance) *are* empirically detectable traits under the neo-Aristotelian definition. Denying *all* behavioral signatures overshoots the data.  
  - **Neo-Aristotelian should concede**: Traditional virtue ethics overestimated moment-to-motion consistency; situationist critiques necessitate rethinking pedagogy.  
  - **Fairness assessment**:  
    - The situationist "empirically empty" claim is fairly characterized (Harman/Doris).  
    - The neo-Aristotelian "niche-construction" framing accurately reflects Annas/Snow.  
    - **Minor correction**: Situationists *do* grant traits exist weakly (e.g., "honesty" in identical contexts), but deny *global* scope. Your summary captured this.  

  ---

  ### **Chair’s Implementation Notes**  
  1. **Signing this**: Forces both parties to disambiguate definitions and commit to falsifiable claims.  
  2. **Leverage cruxes**: Propose a committee-funded pilot study on Crux 1 (ESM feasible with grad students).  
  3. **Pedagogical compromise**: Revise curriculum to teach *both* situation-design tools *and* niche-construction skills (e.g., "habit audits").  

  This framework transforms ideological sparring into tractable empirical and conceptual work. If they reject signing, the problem is no longer academic—it’s interpersonal.
