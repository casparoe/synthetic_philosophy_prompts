answer: |-
  The pro rata distribution in insolvency law presents a fascinating puzzle for theories of fair division. At first glance, it seems to rest on a view that fairness requires creditors to suffer *proportional sacrifice relative to their original claims* – each bears the same percentage loss. This reading treats the claim amount as the relevant denominator for measuring sacrifice. In your example, both creditors lose approximately 81.8% of their claim, which appears symmetrical. However, this interpretation falters when claims exceed the estate’s value. The creditor owed £1,000,000 cannot realistically "sacrifice" £818,000 because they never stood to gain that full amount; their maximum possible recovery was only £200,000. Framing this as proportional sacrifice conflates the impossible loss of the unattainable portion of the claim with the actual sacrifice of feasible recovery. The Kalai-Smorodinsky solution highlights this by equalizing the *proportion of maximum feasible gain* (£200,000 and £100,000 ceilings), yielding £133,000 and £67,000 – sacrifices of 33.5% and 33% of their respective ceilings, not claims. If proportional sacrifice relative to claims were the core principle, the divergence in ceilings should challenge the rule, yet pro rata persists.

  A second reading might suggest pro rata is merely a pragmatic approximation of equal relative concession, valid only when no claim dwarfs the estate. Under this view, the £1,000,000 claim’s excess over £200,000 is an anomaly making the rule’s rationale ambiguous. Yet insolvency systems routinely handle oversized claims without adjusting the pro rata denominator, indicating the claim size itself, not the ceiling, is foundational. This undermines the idea that the practice is accidentally aligned or contextually limited.

  The most compelling interpretation is that pro rata embodies a principle of *proportional entitlement based on contractual recognition*. Here, the claim size – validated through legal processes – establishes a creditor’s *prima facie* share of the debtor’s obligations. Fairness lies in honoring the *relative weight* of these legally acknowledged debts when resources are insufficient. The estate is a *common pool* created by the collective claims, and distribution respects each creditor’s stake in that pool proportionally. This view explains why the denominator remains the claim, not the ceiling: the ceiling rule merely caps recovery to prevent unjust enrichment, but doesn’t redefine the underlying entitlement. The divergence between claim and ceiling isn’t a contradiction but a consequence of capping recoveries at claims, which protects against inflated demands without negating proportional shares.

  Pro rata thus harmonizes with the legal ceiling: both stem from a system prioritizing verifiable claims as the basis for rights. Shifting to Kalai-Smorodinsky would require abandoning this claim-centric entitlement for a *feasibility-adjusted* concession metric. While theoretically elegant, this faces institutional resistance. Bankruptcy prioritizes objectivity, administrability, and predictability. Determining individualized ceilings per creditor is complex and invites disputes over hypothetical "maximum gains," especially with interdependent claims. Pro rata, using fixed claim sizes, offers a clear, auditable formula. Moreover, Kalai-Smorodinsky could incentivize strategic behavior – creditors might argue for lower ceilings for others to boost their own shares. Nash’s product maximization, while compelling for bargaining, would prioritize full satisfaction of small claims, potentially disadvantaging large claimants systematically and encouraging claim fragmentation.

  While multiple theories (like Nash with linear utilities or strict proportional sacrifice) coincide with pro rata when claims are small, the practice’s stability despite oversized claims suggests proportional entitlement is fundamental. It reflects a legal worldview where fairness derives from the ordinal and cardinal relations of recognized claims, not abstract sacrifice or concession. Changing this would require overhauling bankruptcy’s epistemological foundations – moving from adjudicated claims toward speculative assessments of opportunity – a shift the institution’s need for finality and efficiency would likely resist. The pro rata rule, therefore, is not underdetermined but expresses a distinct, legally embedded theory of fairness as proportional representation of contractual rights.
