prompt: |-
  So I've been chewing on the wrong-kind-of-reasons thing for a while now, and I came at it from two odd ends at once. One: the move — which keeps turning up whenever people here try to cash out what they even mean by a cause being worth working on — of analysing value in terms of what there's reason to desire or admire or whatever. It struck me that unless you've got a handle on which reasons count, that move is either empty or straightforwardly false, since a demon offering you a fiver to admire something would thereby make it valuable. Two: the Pascal's-mugging-ish set-ups, where it's *having* the attitude that pays — the belief, the confident credence, the "act as if p" rule — and everyone I've argued with agrees there's something off about the reason there without agreeing on what. Anyway, before I go and read a stack of actual proposed solutions I want the spec, so I can tell which of them are even aiming at the same target.

  So: give me the desiderata a solution to the wrong kind of reasons problem has to meet to count as adequate — the cases it has to sort, the distinctions it can't collapse, the data it can't contradict — each with the case or consideration behind it, and with a note on which requirements are non-negotiable and which are just what one camp happens to want. Some things I want explicitly adjudicated rather than assumed. (a) Is it non-negotiable that the demon's prize gives you a genuine reason that's simply of the *wrong* kind, or is it a legitimate solution to say those aren't reasons at all? I keep meeting people who quietly redefine "reason" until the problem vanishes and I want to know whether that's a cop-out or the actual answer. (b) How much independence does the criterion need? "Right-kind reasons are the ones bearing on whether the attitude is fitting" is worthless if fittingness can't be spelt out without already having the distinction in hand. So what non-circular cash is even on offer, and does any of it survive the awkward cases — fearing the dog because being scared keeps you sharp, trusting someone because trusting makes the relationship work, intending to do it because intending solves your coordination problem — where the reason looks like it's about the state you'd end up in rather than about the object, but still sounds right-kind? (c) Does one distinction have to cover every attitude, or is a pluralism that says each attitude has its own correctness condition acceptable rather than lazy? And does the distinction survive being pushed onto intentions and plans, onto caring about something, onto second-order attitudes (the Frankfurt-style case where you want to want the drug so you can understand your patient), and onto credences? I especially want to know whether the problem arises for credences at all, given that they're graded and accuracy-normed — if it doesn't, why not, and if it does, what does a demonic-prize-for-a-credence case even look like? (d) The account has to tell the would-be buck-passer something usable, without collapsing into "value = what there's a right-kind reason to desire", which just relocates the bump — or else say why that whole ambition was hopeless.

  Then the part I care most about: which subset of these desiderata do you suspect is jointly unsatisfiable? My hunch is that "genuinely independent criterion" + "one criterion for all the attitudes" + "wrong-kind reasons really are reasons" can't all be had together, and that what gets quietly dropped is generality — but I want your read on where the pressure actually sits, and which single requirement does the most work in knocking candidates out. Don't give me a big table or anything resembling a literature review; but do spend a couple of sentences each on how the three broad styles of answer look against the list: the object-given vs state-given line, the "a right-kind reason is one you could base the attitude on / one that could be a premise of good reasoning" line, and the "it turns on what the attitude is directed at or represents" line. And please flag it if you think one of my desiderata is itself confused, cos I'd rather find that out now.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're deeply engaged with the Wrong Kind of Reasons (WKR) problem, approaching it from two angles: the demon scenario where incentives create pseudo-reasons, and Pascal's Mugging cases where the attitude itself has pragmatic benefits. They want a clear set of criteria for evaluating solutions, with specific questions about the nature of reasons, independence of criteria, universality across attitudes, and implications for buck-passing accounts of value.

  First, I need to address their explicit queries (a-d). For (a), the user questions whether demon-offered rewards are genuine but wrong-kind reasons or not reasons at all. This touches on a fundamental debate in the literature. Many philosophers like Parfit and Schroeder argue these are genuine reasons but of the wrong kind, preserving the intuition that reasons can be external. Denying them entirely, as some pragmatists might, risks oversimplifying. The user seems wary of redefining "reason" to avoid the problem, so I should emphasize that the mainstream view accepts them as reasons but distinguishes them based on fittingness or direction of fit.

  Moving to (b), the user is concerned about circularity in defining fittingness. They mention cases like fearing a dog to stay sharp or trusting to maintain a relationship—reasons that seem state-oriented but intuitively right-kind. This suggests that any criterion needs to handle these edge cases without relying on pre-existing notions of fittingness. Functional roles or constitutive norms might offer non-circular explanations, but I should note the tension here. If a solution can't address these cases without circularity, it might fail the independence requirement.

  For (c), the user asks if a single criterion applies to all attitudes or if pluralism is acceptable. Examples include intentions, caring, second-order desires, and credences. Credences are particularly interesting because they're accuracy-based—does a demon rewarding high credence in a falsehood create a WKR? If not, why? The user might be probing whether the WKR problem is universal or attitude-specific. I need to explain that while many solutions aim for universality, credences might be different due to their teleological nature, but pragmatic rewards could still create WKR, like believing for money.

  Regarding (d), the buck-passing account must avoid circularity. Defining value via right-kind reasons needs an independent criterion, not just relabeling. The user wants to know if this ambition is feasible or if buck-passing must be abandoned. Solutions that tie reasons to correctness conditions might help but need to be non-circular.

  The user's hunch is that independence, universality, and acknowledging WKR as genuine reasons can't coexist. They suspect generality is sacrificed. I should evaluate how different approaches fare. The object-given vs. state-given distinction struggles with boundary cases. The basing/reasoning approach handles credences well but might not cover non-doxastic attitudes universally. The representational content approach links to correctness but may be circular.

  Underlying all this, the user seeks clarity on feasible solutions without getting lost in literature. They might be developing their own framework or preparing for academic work. Their frustration with covert redefinitions suggests a desire for transparent, robust criteria. The deeper need is to identify which philosophical commitments are tenable and where compromises are inevitable, possibly to inform their stance or research direction.
answer: |-
  Here’s a distillation of the desiderata for a solution to the Wrong Kind of Reasons (WKR) problem, with explicit rulings on your queries, followed by pressure points and a brief evaluation of approaches. Desiderata are ranked by negotiability (▲ = non-negotiable core; △ = widely expected; ▽ = camp-specific).

  ### **Core Desiderata (Non-Negotiable ▲)**
  1. **Distinguish WKR/RKR in canonical cases**  
     - *Case:* Demon offers $1M to admire a cup of mud. Admiration isn’t fitting, but the prize is a reason to *bring about admiration*.  
     - *Requirement:* Must classify demonic incentives as *reasons* (contra "not reasons at all"), but as WKR for admiration.  
     - **Your (a):** ▲ Genuine reasons of the *wrong kind*. Denying they are reasons dissolves the problem illegitimately.

  2. **Avoid trivial circularity**  
     - *Case:* Defining RKR as "reasons bearing on fittingness" when fittingness *is* defined by RKR.  
     - *Requirement:* The criterion for WKR/RKR must not presuppose the distinction (e.g., fittingness, correctness, or value must be independently specifiable).  
     - **Your (b):** Independence is ▲. "Fearing a dog to stay sharp" must be resolvable without sneaking in RKR.

  3. **Cover core attitudes universally**  
     - *Case:* Works for belief, desire, admiration, fear, intention, blame, etc.  
     - *Requirement:* No attitude-specific exceptions (*pluralism* is acceptable only if it systematically explains differences).  
     - **Your (c):** Pluralism (e.g., belief=truth, desire=good) is acceptable △, but must handle *all* target attitudes. Credences *are_ vulnerable: demon pays for high credence in a falsehood (e.g., "2+2=5") – reason to *cause* that credence, not RKR for accuracy. Caring/intentions: "intend to Φ because intending motivates you" is WKR; "care about X because it distracts you" is WKR. Frankfurt cases: "want to want drugs to understand addiction" – RKR if grounded in value of understanding, WKR if purely instrumental to empathy.

  ### **Expected Desiderata (△)**
  4. **Handle pragmatic "attitude-involving" benefits**  
     - *Case:* Pascal’s Mugging for belief ("believe I’m god, or I’ll torture you"); trusting to sustain a relationship (if trust’s *existence* benefits you, not its *correctness*).  
     - *Requirement:* Classifies these as WKR, even when benefits are profound.

  5. **Preserve buck-passing ambitions**  
     - *Case:* "X is valuable iff there are RKR to desire X."  
     - *Requirement:* Must not collapse into "value = what we have RKR to desire" *without* an independent grip on RKR.  
     - **Your (d):** ▲ Adequate solutions must deliver a *usable, non-circular* criterion for buck-passers or explain why buck-passing fails.

  ### **Contested/Camp-Specific (▽)**
  6. **Accommodate "state-focused RKR" intuitions**  
     - *Case:* Fearing a harmless dog *because fear keeps you alert* (if alertness is valuable). Some intuit this as RKR; others as WKR.  
     - *Requirement:* ▽ Legitimate solutions may rule either way, but must justify it.

  7. **Explain why WKR can’t be bases for attitudes**  
     - *Case:* You can’t *admire mud for $1M* – you can only cause yourself to admire it.  
     - *Requirement:* ▽ Often included, but some solutions (e.g., constitutivist) derive this.

  ---

  ### **Pressure Points: Suspected Incompatibilities**  
  **Your hunch is correct:** ▲ **Independence** + ▲ **Universality** + ▲ **"WKR are reasons"** is likely **unsatisfiable**.  
  - Universality forces a single formal criterion (e.g., "reasons bearing on the object’s properties").  
  - But "fear the dog to stay sharp" challenges this: if alertness is a property *of the fear itself*, is this "object-given"?  
  - To avoid circularity, the criterion can’t smuggle in "fittingness".  
  - *Sacrificed element:* **Precision in edge cases** (like state-focused benefits). Solutions either:  
    - (A) Stretch "object-directedness" (risking circularity),  
    - (B) Deny intuitions about state-focused RKR (e.g., "fear for alertness is always WKR"), or  
    - (C) Admit pluralism (undermining universality).

  **Most damaging requirement:** ▲ **Independence**. Without it, "fittingness" trivializes the distinction. With it, edge cases explode.

  ---

  ### **Approaches Against Desiderata**  
  1. **Object-Given vs. State-Given (OG/SG)**  
     - *OG:* Reasons citing object’s properties (RKR); *SG:* Reasons citing attitude’s consequences (WKR).  
     - *Fails:* ▲ Independence/Universality. "Fear for alertness" is SG but intuitive RKR for some. Can’t define "object’s properties" without prior RKR notion. Struggles with intentions (is "intending motivates" about object or state?).

  2. **Basing/Reasoning Constraints**  
     - RKR = reasons that could be *directly basing* or *premises in good reasoning* for the attitude.  
     - *Fails:* ▲ Universality. Works for belief ("reasoning to truth") but not desires (no clear "good reasoning"). "Admire mud for $1M" can’t be based – but *why*? Often presupposes correctness norms.

  3. **Representational/Correctness Conditions**  
     - RKR = reasons bearing on what the attitude *represents* (e.g., belief represents truth; desire represents good).  
     - *Fails:* ▲ Independence. What "desire represents" *is* its correctness condition – circular if correctness is RKR-dependent. Handles credences well (RKR = evidence for content), but not intentions (what do they "represent"?).

  ---

  ### **One Conflicted Desideratum**  
  **Your (b) on "fearing for alertness":** This case risks conflation. *Either:*  
  - The reason is to *bring about fear* (WKR), and fear’s *effects* aren’t RKR for its correctness;  
  - *Or* "being alert" is a property of the *object* (the dog’s potential threat) – making it OG/RKR if misjudged.  
  A solution *must_ adjudicate this, but insisting it’s intuitively RKR **without** independent justification may beg the question. The pressure is to **deny** this is RKR to preserve universality.  

  **Where this leaves buck-passing:** If ▲Independence fails, buck-passing is circular. If it holds, buck-passing needs an external anchor (e.g., teleology of attitudes). Credence cases suggest a way: RKR are *content-relevant* (evidence for belief, good for desire). But "good" is value – bump relocated, not eliminated. The hardest trade-off is **independence vs. buck-passing viability**.
