answer: |-
  Here’s a logical decision tree for the Molyneux question, designed as a one-page handout. It progresses through concrete cases and distinctions, leading to 8 terminal positions. Nonstandard variants are integrated at key nodes.

  ---

  **The Molyneux Decision Tree**  
  *Does sight "teach" touch? Sorting views on cross-modal spatial content*

  **START:** A subject blind from birth gains sight. They know a cube and globe *perfectly by touch*. Shown both visually (no touching), can they correctly identify which is the cube and which is the globe?

  ### Branch 1: *Grounds of Resolution*  
  **Q1:** Could we settle the answer just by analyzing what spatial representation *must* be?  
  - **YES** → Proceed to **Branch 2A**  
  - **NO** (Requires empirical evidence) → Proceed to **Branch 2B**  

  ---

  ### Branch 2A: *Reflective Route: Format of Spatial Content*  
  **Q2A:** Can spatial properties (e.g., shape, volume) be represented in a *single format* common to touch and sight?  
  - **YES** (Amodal spatial content) → Proceed to **Branch 3**  
  - **NO** (Senses have proprietary content; touch = pressure/motion, sight = color/light) → **Position: BERKELEYAN SKEPTIC**  

  ### Branch 2B: *Empirical Route: Delayed Test Variant*  
  *(After weeks of unrestricted visual experience but NO touch-sight pairing: Can they now match?)*  
  **Q2B:** Does the delayed test show successful visual-tactile shape matching?  
  - **YES** → **Position: EMPIRICIST NATIVIST**  
  - **NO** → Proceed to **Branch 3**  

  ---

  ### Branch 3: *Criterion of Success*  
  **Q3:** If the subject succeeds, what does it show?  
  - **Forced-choice matching** (They pick correctly but can’t say why) → Proceed to **Branch 4**  
  - **Phenomenal similarity** (The *look* of the cube resembles its *feel*) → **Position: PHENOMENAL SIMILARIST**  
  - **Conceptual classification** (They recognize both as instances of "cube"/"globe") → Proceed to **Branch 5**  

  ---

  ### Branch 4: *Demonstrative Reference Without Shared Content*  
  **Q4:** Could the subject point to "that one" (cube) correctly *without* any shared spatial representation?  
  - **YES** (Perception provides only sense-specific inputs; reference is "blind") → **Position: REFERENTIAL MINIMALIST**  
  - **NO** (Accurate demonstration requires overlapping content) → **Position: AMODAL SPATIALIST**  

  ---

  ### Branch 5: *Role of Naming: Unnameable Solid Variant*  
  *(Subject knows an irregular polyhedron by touch but has NO name/concept for it. Can they visually match it to the felt object?)*  
  **Q5:** Does successful matching require the subject to *name* the shape?  
  - **YES** (Language mediates cross-modal transfer) → **Position: CONCEPTUAL FUNCTIONALIST**  
  - **NO** (Recognition is pre-linguistic) → **Position: WEAK CONCEPTUALIST**  

  ---

  ### Terminal Positions & Commitments  
  1. **Berkeleyan Skeptic**  
     *Awkward commitment:* Denies spatial content is *intrinsic* to vision; vision is initially "meaningless light."  
     *Historical flag:* Confidently Berkeley (1709); modern analogues (e.g., Clark).  

  2. **Empiricist Nativist**  
     *Awkward commitment:* Innate spatial abilities emerge *only* after visual experience.  
     *Historical flag:* Inspired by Held (2011) empirics; not clearly historical.  

  3. **Phenomenal Similarist**  
     *Awkward commitment:* Cube-feel can resemble cube-look *without* shared spatial structure.  
     *Historical flag:* Rare; maybe Husserl? (Highly contested)  

  4. **Referential Minimalist**  
     *Awkward commitment:* "That" can refer accurately with *zero* shared representational content.  
     *Historical flag:* Evans (1985) "non-conceptual content" debates.  

  5. **Amodal Spatialist**  
     *Awkward commitment:* Touch-to-vision transfer is immediate because space is sense-transcendent.  
     *Historical flag:* Reid (1764); modern "spatial Sensus Communis" views.  

  6. **Conceptual Functionalist**  
     *Awkward commitment:* A blind person given sight sees only "sensory chaos" until language organizes it.  
     *Historical flag:* Wittgenstein-influenced; no clear historical holder.  

  7. **Weak Conceptualist**  
     *Awkward commitment:* Recognition requires concepts, but *not* language or naming.  
     *Historical flag:* Kantian; contemporary McDowell-style views.  

  8. *Empty Node: Amodal without Recognition*  
     (Path: **Branch 2A YES → Branch 3 Matching → Branch 4 NO**, but no position occupies this)  
     *Status:* Unexplored (why accept amodal space but deny recognition?).  

  ---

  ### Nonstandard Variants & Discriminators  
  - **Delayed Test**: Splits **Branch 2B**. Empiricist Nativist predicts YES; others diverge later.  
  - **Unnameable Solid**: Splits **Branch 5**. Conceptual Functionalist requires naming, others don’t.  
  - **Picture Variant** (match felt object to drawing): Splits **Branch 2A NO** (Berkeleyan Skeptic) from **Branch 3 YES** (Phenomenal Similarist vs. others).  
    - *Predictions:* Berkeleyan → Fail (no 2D-to-3D inference); Amodal Spatialist → Succeed.  

  ---

  ### Underdetermined Pairs & Empty Nodes  
  - **Unseparated Pair**: *Referential Minimalist* vs. *Amodal Spatialist* on the picture variant (tree doesn’t split them).  
  - **Empty Node**: See above. *Status:* Unexplored (theoretically possible but neglected).  
  - *Other gaps:* Path through **Branch 2B NO → Branch 3 Conceptual → Branch 5 NO** is occupied; no incoherent nodes.  

  ---

  ### Weaknesses & Redraw Triggers  
  - **Contestable Branch**: *Criterion of Success* (Q3). "Matching" vs. "Similarity" is fuzzy; some views straddle both.  
  - **Contested Reading**: Attributing *Referential Minimalism* to Evans is debated.  
  - **Redraw Trigger**: If empirical data shows **delayed-test success without naming**, it weakens Conceptual Functionalism and favors Amodal Spatialism/Empiricist Nativism.  
  - **Biggest Flaw**: Assumes "proprietary content" implies skepticism; some non-skeptical views (e.g., sensorimotor theories) don’t fit neatly.  

  ---  
  *Tree allows 10 paths; 8 occupied, 1 empty, 1 collapsed (identical outcomes). Designed for seminar use—positions simplify complex debates.*
