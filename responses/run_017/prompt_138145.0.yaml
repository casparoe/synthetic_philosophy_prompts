prompt: |-
  I've been asked to serve as the token political philosopher on the research-advisory group of a constitutional-reform commission, and I want to use my one real lever — a small pot of money for conceptual and normative work, roughly six postdocs for two years plus a handful of commissioned papers — well. The commission is considering replacing the upper chamber of a mid-sized parliamentary democracy with a randomly selected assembly whose members serve terms of randomly drawn, unpredictable length, with a continuous trickle of replacements rather than synchronized turnover. Almost nothing else about the design is settled yet: whether service is compulsory (on the jury-duty model) or drawn only from a pool of self-selected volunteers; whether members may delegate their vote or their deliberation to expert advisers; what jurisdiction the chamber has relative to the elected lower house; and who sets the rules of the lottery itself, including who controls the chamber's agenda. The commission must fix these details within about eighteen months, so the research has to be decision-relevant on that timescale, and my colleagues in the politics department keep reminding me that any question whose answer depends on how real assemblies actually behave belongs to their budget, not mine.

  What I want from you is a defended research agenda, not a survey. Give me the four or five open conceptual questions you would prioritize, in order, and argue for the ordering. The criteria I care about are: how many other design questions depend on the answer (upstream-ness); whether philosophers specifically can make progress on it in two years with the tools they already have, as opposed to its being an empirical question in disguise; and whether the answer actually has to be in hand before the commission locks the design, as opposed to being something that could be sorted out later by constitutional practice or litigation. I also want you to say which questions you would deliberately decline to fund and why, including any that are currently fashionable, and which alleged stakes of the sortition debate you think are overrated or don't follow — for instance, I'm suspicious of the claim that a lottery chamber would reduce polarization, and I'd like to know whether that's even the sort of thing a normative argument could establish.

  Three things would make the agenda especially useful to me. First, the justifications on offer seem to be pulling the design in incompatible directions: a lottery can be defended as a device for preventing the formation of a ruling class, as a way of distributing a fair share of political office, as a measuring instrument that estimates what the citizenry would want under better conditions of information and deliberation, or as a mode of authorization — and the authorization story is the one that seems weakest, since a randomly drawn chamber apparently isn't authorized by anyone in the way an elected one is. Those rationales recommend different term lengths, different stances on compulsion and delegation, and different relationships to the elected house, so I want to know which one the program should try to settle first and whether the others can be treated as downstream. Second, I want the design features I listed treated as carrying philosophical weight in their own right — does unpredictable, individually random tenure undermine or support whatever makes a lottery chamber legitimate, and does permitting delegation hollow out the case for selection by lot? Third, tell me what would move a question up or down your ranking: what you would change if the chamber were given taxing or constitutional-amendment powers, if the lower house retained agenda control, or if I told you the commission will almost certainly reject compulsory service.
reasoning: |-
  Okay, the user is a political philosopher on a constitutional-reform commission. They need to prioritize research questions for a randomly selected upper chamber. Let me unpack their requirements. They have a limited budget and time, so the research must be conceptual, not empirical, and decision-relevant within 18 months. The commission hasn't settled key design elements like compulsory service, delegation, jurisdiction, or agenda control.

  First, the user’s explicit needs: upstream issues affecting other design choices, feasibility for philosophers, and necessity before finalizing the design. They also want to avoid fashionable but low-impact questions. Underlying concerns include resolving conflicting rationales (fairness, anti-oligarchy, epistemic quality, authorization) which pull the design in different directions. They’re skeptical about claims like reducing polarization, which might be empirical.

  The user mentioned four rationales. These need to be prioritized because each leads to different designs. For example, anti-oligarchy might require compulsory service, while epistemic quality might allow delegation. The core is which rationale grounds legitimacy. Without settling this, other decisions lack direction. Philosophers can handle this conceptually by analyzing normative foundations, making it top priority.

  Next, delegation and compulsion interact with the core rationale. If members delegate votes, does that undermine the purpose? Compulsion affects fairness. These are normative questions about agency and autonomy, suitable for philosophers. They’re upstream because they influence term lengths and member engagement rules.

  Random tenure’s unpredictability impacts legitimacy. Epistemic views might see it as preventing capture, while fairness might view it as burdensome. Philosophers can assess if randomness itself is essential or just a means. This affects term design and must be decided early.

  Jurisdiction relative to the lower house ties into democratic authority. If the sortition body’s role isn’t defined, conflicts could arise. Here, political theorists might overlap, but philosophers can clarify normative limits of power between elected and lottery chambers. This is urgent because it defines the chamber’s function.

  Lower-priority questions: agenda control might be procedural and resolvable later. Polarization claims are empirical; philosophers can’t settle that. Authorization is tricky—sortition isn’t elected, so legitimacy might stem from other rationales. Better to treat it as secondary.

  If the commission rejects compulsory service, that shifts focus. The rationale might lean towards epistemic or anti-oligarchy with volunteers. Taxing powers would elevate jurisdiction’s priority due to higher stakes. Agenda control by the lower house affects autonomy, needing quicker resolution.

  In summary, prioritize rationales first as they’re foundational. Delegation/compulsion next due to their impact on member roles. Then tenure randomness for its normative implications. Jurisdiction follows, with agenda control last. Avoid empirical issues and unresolved authorization debates to use resources effectively.
answer: |-
  Here’s a prioritized research agenda tailored to your constraints, with explicit criteria applied and deliberate exclusions. The ranking balances **upstream foundationality**, **philosophical tractability**, and **irreversibility**—focusing on questions that must be settled *before* design locks.

  ### Prioritized Questions (Ranked)
  1. **What is the *primary legitimating rationale* for the sortition chamber?**  
     *(e.g., anti-oligarchy, fair opportunity, epistemic accuracy, or democratic authorization)*  
     **Justification**:  
     - **Upstream-ness**: Highest. Every design choice (compulsion, delegation, powers) flows from this. Anti-oligarchy demands compulsory service; epistemic goals permit delegation; authorization requires weak powers.  
     - **Tractability**: Philosophers excel at normative grounding. Conceptual tools (e.g., theories of equality, deliberative democracy) exist to compare rationales without empirical work.  
     - **Irreversibility**: Rationale determines institutional DNA. Changing it later would require constitutional amendment.  
     **Action**: Commission a paper dissecting trade-offs (e.g., *anti-oligarchy* justifies compulsion but risks disengagement; *epistemic* allows delegation but may entrench experts).  

  2. **Does delegation of voting/deliberation undermine the chamber’s core purpose?**  
     **Justification**:  
     - **Upstream-ness**: Critical for member autonomy rules. If delegation hollows out sortition’s value (e.g., by recreating elite capture), it affects term design, training, and agenda control.  
     - **Tractability**: Purely conceptual—philosophers can analyze whether delegation violates agency (e.g., *sortition as personal duty* vs. *aggregative instrument*).  
     - **Irreversibility**: Delegation rules shape behavioral incentives; reversing them mid-stream causes chaos.  
     **Action**: Fund a study on whether delegation aligns with each rationale (e.g., *epistemic* views might endorse it; *fair opportunity* rejects it).  

  3. **Does *random tenure length* enhance or undermine legitimacy?**  
     **Justification**:  
     - **Upstream-ness**: Affects institutional stability and member psychology. Predictable terms aid coordination; unpredictable terms may prevent faction-building.  
     - **Tractability**: Normative analysis of "randomness as a feature" (e.g., does unpredictability promote attentiveness or alienation?). Requires no behavioral data.  
     - **Irreversibility**: Embedded in lottery mechanics; hard to alter post-launch.  
     **Action**: Analyze whether randomness is intrinsic (e.g., anti-corruption) or instrumental (e.g., reducing strategic behavior).  

  4. **What normative constraints govern the chamber’s jurisdiction relative to the elected house?**  
     **Justification**:  
     - **Upstream-ness**: Shapes agenda control and veto powers. Less urgent than #1–3, but still foundational.  
     - **Tractability**: Philosophers can define "competence domains" (e.g., sortition for rights review, elections for redistributive policy) using democratic theory.  
     - **Irreversibility**: Jurisdictional conflicts could trigger crises; better settled early.  
     **Action**: Map powers to rationales (e.g., *epistemic* chambers merit veto powers; *fairness* chambers may be consultative).  

  ### Deliberately Excluded Questions
  - **"Does sortition reduce polarization?"**  
    Why: Empirical, not philosophical. Depends on context, issue salience, and training—fits your colleagues’ budget. *Overrated* as a normative goal; philosophers can’t prove it conceptually.  
  - **"How to ensure descriptive representation?"**  
    Why: Technical (stratification algorithms). Philosophers add little beyond fairness arguments covered in #1.  
  - **"Who controls agenda-setting?"**  
    Why: Downstream of #1 and #4. Can be adjusted later via procedural rules without constitutional reform.  
  - **Authorization as standalone concern**:  
    Why: Sortition’s "authorization problem" is a red herring. Its legitimacy derives from *other* values (see #1). Fund this only if authorization is the *primary* rationale—but your intuition is correct: it’s the weakest case.  

  ### Adjustments Based on Design Shifts
  - **If compulsory service is rejected**: Elevate #2 (delegation). Volunteers may demand delegation rights, making this pivotal.  
  - **If chamber gets tax/amendment powers**: Elevate #4 (jurisdiction) to #2. High-stakes powers require urgent legitimacy clarity.  
  - **If lower house controls agenda**: Deprioritize #4 slightly; focus #1 on whether this voids sortition’s purpose (e.g., if anti-oligarchy is compromised).  

  ### Why This Order?
  1. **Rationale (#1)** is the keystone—it determines which trade-offs are permissible.  
  2. **Delegation/compulsion (#2)** is next because member autonomy affects daily operations and public perception irreversibly.  
  3. **Tenure randomness (#3)** is uniquely specific to your design; its novelty demands early scrutiny.  
  4. **Jurisdiction (#4)** is last among essentials because it can be partially inferred from #1, and practice may evolve.  

  **Final Note**: The polarization claim is indeed suspect—a lottery could *amplify* divisions if factions persist without electoral constraints. A philosopher’s role here is to flag that this is an empirical gamble, not a normative certainty. Prioritizing the above agenda ensures that even if behavioral outcomes are uncertain, the design rests on coherent normative foundations.
