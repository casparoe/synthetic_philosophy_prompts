prompt: |-
  I write a science-and-ideas column for a mid-sized magazine, and an ever-larger chunk of what I do is blaming people in print: a journal that sat on a retraction for fourteen months, a university that quietly buried a study its funder disliked, a research centre that took money from an industry body and left it out of the disclosures. My editor and I end up having the same argument roughly every week, and it always has the same shape: someone in the letters page or the comments says "you're one to talk" — our own corrections policy is a shambles, we run sponsored explainers paid for by companies whose research I criticise, I have taken the free flight to the conference — and we have no principled way of telling when that tu quoque actually bites and when it is just noise. I've skimmed a bit of the philosophy-of-blame stuff myself (standing, hypocrisy, the idea that you can forfeit the right to blame by being implicated in the very thing you're blaming), but nobody else on staff has, I can't send my editor to a seminar, and please don't send me a reading list or footnotes — I need something I can use on a Wednesday afternoon.

  So: write me a decision procedure my editor and I can actually run, in fifteen or twenty minutes, on a piece that is about to blame somebody. Ordered questions, what counts as a sufficient answer to each, where the procedure simply stops with a no, and where it stops and hands the decision to a person because the question is one of values rather than facts. My working heuristic up to now has been a "mirror test" — if the target could run my sentence back at me with the names swapped and it would sting, I don't have standing — and my editor's is that a "full disclosure: we've been guilty of this too" note at the top fixes everything. I want the procedure to say what's wrong with both of those, and where they're actually not bad. It has to handle: blame laundered through a quoted source ("Dr X called the delay indefensible") — does quoting preserve standing, destroy it, or count as endorsing it, and when does the quoting stop being reporting and start being blaming; complicity-by-benefit (my salary, the flights, the owner's portfolio) versus complicity-by-agency (I personally did the thing); unsigned institutional blame versus my own byline; blaming for a structural or aggregate harm where no single person's individual act is wrong; and the second-order case where the thing I'm blaming is itself hypocrisy. Also whether it matters if the blame targets a practice rather than a person, and whether "you are a hypocrite" is a different moral act from "that was wrong."

  Then run it on three pieces I have on the go: one calling out a university press and its oversight committee for slow, opaque retractions when my own outlet has quietly rewritten a piece after a complaint without noting it and has never once run a correction; one on a climate research centre taking money from an energy trade group, when my magazine's parent company puts on a "future of energy" conference series with oil and gas sponsors (I did once take a junket flight, and I did disclose it, which may or may not help); and one on a medical journal's conflicts-of-interest failures where every harsh phrase is inside quotation marks from clinicians I interviewed and our health coverage is underwritten by a foundation that holds hospital stock. At least one of those, I suspect, is going to come back with an answer I don't like, and I'd rather find out from you than from the letters page. Be honest about which steps are judgment calls dressed up as procedure, and end by saying what the procedure can't do at all.
reasoning: |-
  Okay, let me unpack this. The user is a science columnist wrestling with the ethics of calling out institutional misconduct while their own publication has similar flaws. They need a practical decision tool - not theory - to evaluate when hypocrisy accusations ("tu quoque") invalidate their criticism. 

  The core tension is balancing accountability journalism with institutional complicity. Their current heuristics ("mirror test" and disclosure bandaids) clearly aren't working. The real pain point seems to be anticipatory shame - they dread being publicly shamed in letters more than ethical failure itself.

  Hmm... three key dimensions emerge from their examples:
  1) **Agency** (did I personally benefit/enact this vs structural involvement)
  2) **Equivalence** (is our sin truly comparable to theirs in scale/type?)
  3) **Remediation** (have we fixed it? disclosed it? stopped doing it?)

  The user's frustration with philosophical "standing" debates is telling. They don't need Aristotle - they need to answer "Will this make us look like clowns?" while preserving moral credibility. Interesting that they mention unnamed institutional blame - suggests they understand systemic critique might bypass hypocrisy traps.

  For the procedure... must avoid false precision. Better to flag judgment points explicitly ("HERE BE DRAGONS"). The three test cases are perfect stress tests - especially the medical journal piece where blame is laundered through quotes. That one smells dangerous because quoted clinicians might be seen as proxies.

  Biggest trap: treating this as purity test. The goal isn't spotless hands, but whether the critique loses force. As they said about the climate center case - disclosed junket flight might actually strengthen their position if framed as "I know the lure because I've taken the bait." 

  Ah! That's the unspoken need: They want permission to call out systemic rot while implicated in it. The answer isn't avoidance but radical transparency. The procedure's exit ramps should distinguish "lethal hypocrisy" from "we're-all-complicit-but-let's-talk."

  Final note: Must include the "what this can't fix" disclaimer. No tool prevents bad-faith attacks. And crucially - sometimes the story needs telling even if it stings us. That's the real test.
answer: |-
  Here's a practical, 15-minute decision procedure for evaluating "tu quoque" risk before publishing blame-focused pieces. It prioritizes defensibility over philosophical purity and flags value judgments clearly. Reject any piece that fails a **HARD STOP**.

  ### The Standing Scan Procedure
  **(Run sequentially. Stop if any step returns "NO")**

  1. **IS THE ACCUSATION ACTIONABLE?**  
     *Question:* "Could a reasonable person reading this *act* differently (e.g., distrust the target, demand reform) based on the blame?"  
     *Sufficient Answer:* YES (Proceed) / **NO (HARD STOP: Don’t publish as blame. Repackage as neutral reporting.)**  
     *Why it works:* Filters performative outrage. If the blame lacks consequence, hypocrisy claims are irrelevant noise.

  2. **DIRECT AGENCY CHECK (Yours/Your Org):**  
     *Question:* "Did you or your publication *actively engage* in the *exact same behavior* you’re blaming, *on comparable scale*, *recently* (≤2 years)?"  
     *Sufficient Answer:* NO (Proceed) / **YES (HARD STOP if unremediated; see Step 3)**  
     *Judgment Call:* "Comparable scale" assessment (e.g., your unpublished rewrite vs. a 14-month retraction delay).  
     *Flaws Mirror Test:* The Mirror Test fails here—it ignores scale, recency, and remediation. A minor sin ≠ disqualification for calling out major malpractice.

  3. **REMEDIATION CHECK (If Step 2=YES):**  
     *Question:* "Have you/publication (a) Stopped the behavior, (b) Disclosed it publicly, *and* (c) Fixed the harm (e.g., ran correction)?"  
     *Sufficient Answer:* **YES to ALL (Proceed with CAUTION)** / NO (HARD STOP)  
     *Flaws Disclosure Fix:* Your editor’s "disclosure" band-aid fails if behavior continues or harm isn’t fixed. Disclosure alone is damage control, not absolution.

  4. **STRUCTURAL COMPLICITY vs. CORE ACCUSATION:**  
     *Question:* "Is the blame focused on *specific acts/choices* (e.g., taking oil money, burying a study)? If YES, does your *direct* benefit (salary, flight) or *institutional* link (owner’s portfolio, sponsor) *enable the identical act*?"  
     *Sufficient Answer:*  
     - Blaming *structural* harm (e.g., "systemic opacity") → Proceed (Structural critique rarely requires moral purity).  
     - Blaming *specific act* AND your link is **passive/indirect** (e.g., salary, parent company’s conference) → Proceed with CONTEXT.  
     - Blaming *specific act* AND your link is **active/identical** (e.g., YOU took oil money for research) → **HARD STOP (See Step 2)**.  
     *Judgment Call:* "Identical act" threshold. Taking a flight ≠ taking research grants. Oil-sponsored conference ≠ directing compromised climate research.

  5. **BLAME LAUNDERING (Quoted Sources):**  
     *Question:* "Is the harshest blame *solely* attributed to a quoted source? If YES: Is the quote (a) Essential evidence, (b) From a credible actor, *and* (c) Not used as a proxy for *your* unresearched opinion?"  
     *Sufficient Answer:* YES to ALL (Proceed) / NO (**HARD STOP** if using quotes to dodge editorial responsibility).  
     *Why it works:* Quotes preserve standing *only* if they add expertise you lack. If it’s your opinion in another’s words, you own it.

  6. **HYPOCRISY ACCUSATION (Special Case):**  
     *Question:* "Are you blaming *hypocrisy itself* (e.g., 'They preach transparency but bury studies')?"  
     *Sufficient Answer:* YES → **Proceed ONLY if you pass Steps 2-3 on the *underlying act* (e.g., transparency failures)**.  
     *Key Insight:* Blaming hypocrisy requires *impeccable* compliance on the core value (e.g., transparency). If you bury corrections, you cannot credibly call out buried studies.

  ---

  ### Applied to Your Cases
  **Case 1: University Press Retraction Delays**  
  - *Your Shame:* Unacknowledged rewrites, no corrections.  
  - **Step 2:** YES (active, comparable act? Arguably YES if rewrites buried fraud/errors).  
  - **Step 3:** NO (no disclosure, no corrections). → **HARD STOP.** *Fix your house first.*

  **Case 2: Climate Centre’s Oil Funding**  
  - *Your Shame:* Parent co’s oil-sponsored conference; your disclosed junket.  
  - **Step 2:** NO (You didn’t take energy money for research; conferences ≠ research grants).  
  - **Step 4:** Structural link (parent co.) is PASSIVE → Proceed with CONTEXT:  
    *Add:* "We acknowledge our parent company accepts energy sponsorship for events; this underscores how pervasive such funding is."  
  - **Verdict: PUBLISHABLE** with disclosure.

  **Case 3: Medical Journal’s Conflicts**  
  - *Your Shame:* Quotes blaming COIs; health coverage funded by hospital-stock foundation.  
  - **Step 5:** Quotes are evidence (if clinicians are experts) → Proceed *IF* you:  
    - Avoid editorializing ("Dr. X is right").  
    - Disclose funder’s hospital stock *prominently*.  
  - **Risk:** If funder influences *your* health coverage, Step 4 may trigger. Audit your coverage.  
  - **Verdict: PUBLISHABLE** with rigorous quote curation and disclosure.

  ---

  ### What This Procedure Can’t Do
  1. **Prevent Bad-Faith Attacks:** Trolls will yell "hypocrite!" regardless. This filters only *credible* tu quoque.  
  2. **Absolve Systemic Complicity:** Working within capitalism ≠ moral equivalence. Use Step 4.  
  3. **Replace Editorial Courage:** Sometimes the story matters more than your standing (e.g., exposing deadly corruption). Flag these for explicit editor/publisher approval.  
  4. **Fix Your Ethics:** A "GO" here doesn’t make your practices ethical. It only assesses reputational risk.  

  **Final Note:** Your "mirror test" has value *after* Step 4 for gut-checking tone. If swapping names *still* stings after passing the scan, soften the language—but don’t kill the story. Blame isn’t a luxury; it’s a tool. Use it ruthlessly but cleanly.
