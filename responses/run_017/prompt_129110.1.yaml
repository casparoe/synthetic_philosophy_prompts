prompt: |-
  I work at a smallish global-health foundation, and I've been going through the minutes of our Evidence & Measurement Committee — the subcommittee that decides whether to commission more measurement before we lock in a funding decision. I'm writing the memo for the next one and I'd like a second read before I stick my neck out.

  Their record so far (paraphrased from the minutes, with what I remember of the reasoning in brackets):

  - Cheap six-month head-to-head trial of two bednet distribution methods, results to us only, then we pick: commission. ["Standard."]
  - Same trial, but it would take three years and the decision is due in six weeks: don't commission. ["It'd land after we've already spent the money."]
  - Already-collected government data on regional malaria prevalence — free — except our charter obliges us to allocate strictly in proportion to measured prevalence, and most of us think that rule is badly miscalibrated: don't commission. ["The number would decide for us, and badly."]
  - A cheap, noisy, biased proxy outcome where we know both the direction and the size of the bias: commission. ["We just adjust."]
  - A moderately expensive study using an outcome measure nobody has ever validated — three incompatible models of how the measure maps onto what we actually care about, no way to rank them: don't commission. ["We'd be guessing about the guessing."]
  - A cheap staff survey that would change the thing it measures, because asking people whether they'd stay if we moved the program gets them started on planning to leave: don't commission.
  - A cheap, precise study we'd be obliged to publish, where a rival funder would read it and move into our districts first: don't commission. ["Looking is itself a signal."]
  - A result a partner already produced and left in a drawer — genuinely zero cost — on a question everyone agrees can't change what we fund this cycle: don't commission. ["Zero value isn't a reason to spend an hour."]

  The new one. Our partner org is offering, at their own cost and on our timeline, a comparison of the two programs we're choosing between. They'll pre-specify a handful of analyses, run them honestly and accurately, and then send us one: whichever makes their favourite program look best. We know they'll do that. It isn't deception, it's selection. What we can't do is say how much room that gives them. Under one model all the analyses agree and it makes no difference; under another they diverge widely and whichever one they pick is close to arbitrary. We have maybe four plausible models of the divergence, no way to rank them, and no probabilities to put on them. Everything else is clean: costs us nothing, no delay, results private, and afterwards we'd sit down and re-decide from scratch, no formula, no charter rule, no outside body forcing our hand.

  I keep circling back to Good's theorem — the result that for an expected-utility maximiser who updates and then re-optimises, free information can't make you worse off; the worst it can be is worth nothing. But I can't tell whether this case is inside or outside the scope of that result, because the bit I'm unsure about is whether "we have four models and no probabilities over them" is just an ordinary prior over models (in which case the reported number is still an ordinary signal and the theorem applies) or whether it breaks the single-prior assumption the theorem needs. I have a vague feeling that once you only have an unrankable *set* of priors the non-negativity guarantee is up for grabs, but I genuinely don't know, and I don't want to lean on it. There's also a dumber reading of the whole record: that the committee isn't running any theorem at all, just asking "will this improve the argument we'll actually have in the room" — and a number hand-picked by someone with a favourite, which we can't discount, is exactly the kind of thing that makes an argument worse.

  What I want from you: your best guess at what they should decide if they want to be consistent with themselves; the two or three different rules that fit all eight precedents equally well; what each of those rules predicts about the partner's study; which precedent is genuinely the closest analog (I keep flip-flopping between the unvalidated-measure one and the charter one); an honest statement of what principle they'd be committing to with each choice — including whether "we" means the committee as it actually argues or the committee as an ideal Bayesian; and the follow-up case that would actually separate the rules. My two candidates are (a) the same study except the partner pre-commits in writing to one analysis before running anything, and (b) a clean, unbiased, free measurement where the *unrankable models* are about how the program works rather than about how the result got selected. Say which of those is more diagnostic, or name a better one.
reasoning: |-
  Hmm, this is a fascinating and nuanced decision theory problem from a global health foundation context. The user has presented eight historical decisions by their Evidence & Measurement Committee and needs help analyzing a new case involving a partner-offered study with potential cherry-picking of results.

  First, I need to understand the core tension here. The committee seems to operate on a practical principle: commission evidence only when it clearly improves their actual decision-making process, not just because it's theoretically valuable. The Goodhart-like concerns throughout their record suggest they're acutely aware of how measurement can distort decisions.

  Looking at the precedents, several patterns emerge:
  - They reject evidence that arrives too late (#2)
  - Avoid evidence that would force bad decisions (#3)
  - Reject measurements that change the thing being measured (#6)
  - Avoid evidence that could help competitors (#7)
  - Even reject zero-cost evidence when it has zero decision value (#8)

  The new case is particularly tricky because it involves a "free" study where the partner will cherry-pick whichever analysis makes their preferred program look best. The key uncertainty is how much latitude they have to manipulate results - modeled by four incompatible scenarios with no probabilities.

  I recall Good's theorem says free information can't hurt expected utility maximizers, but this assumes a single prior. Here we have unrankable models, which might break that assumption. The committee's actual behavior suggests they care more about whether evidence improves their real-world deliberation than theoretical Bayesian ideals.

  For consistency, I see three possible principles that fit all precedents:
  1) "Decision-usefulness principle": Only commission evidence that demonstrably improves the specific upcoming decision
  2) "Robustness principle": Avoid evidence vulnerable to manipulation or misinterpretation
  3) "Procedural integrity principle": Reject evidence that could corrupt the decision process itself

  The closest analog is probably #5 (unvalidated measure) because both involve fundamental uncertainty about how to interpret the result. The charter case (#3) is different because the problem is known bad rules, not epistemic uncertainty.

  For the follow-up cases:
  - If the partner pre-commits to one analysis (case A), it becomes more like #1 (standard trial)
  - A clean study with model uncertainty about program mechanics (case B) resembles #5

  Case B is more diagnostic because it isolates the model uncertainty issue without the selection bias complication.

  Ultimately, the committee should probably reject this study. The cherry-picking risk doesn't just add noise - it actively threatens to derail their deliberation by injecting partisan results they can't properly discount. Their precedents show deep pragmatism about when evidence actually helps rather than hinders.
answer: |-
  Based on your committee's precedents and the nuances of this new case, here's a breakdown of how to approach the memo. The core tension is between theoretical decision theory (Good's theorem) and your committee's demonstrated pragmatism about real-world deliberation.

  ### 1. Best Guess for Consistent Decision: **Don't Commission**
     - **Why?** The committee consistently rejects evidence that could *degrade* or *hijack* their deliberative process, even if it's free or theoretically informative:
       - \#3 (charter-bound data) avoids letting a bad rule override judgment.
       - \#5 (unvalidated measure) avoids "guessing about guessing."
       - \#7 (obligatory publishing) avoids strategic harm from signaling.
       - \#8 (irrelevant drawer study) avoids wasting deliberation time.
     - The partner's cherry-picked result risks poisoning deliberation: it injects partisan, uninterpretable data that could dominate the debate despite its arbitrariness. This aligns with precedents where evidence *worsens* the committee's argumentative environment.

  ---

  ### 2. Rules Fitting All Eight Precedents
  Three possible principles explain all decisions equally well:

  | **Rule Name**               | **Core Principle**                                                                 | **Predicts for Partner's Study** |
  |-----------------------------|------------------------------------------------------------------------------------|----------------------------------|
  | **A. Deliberative Integrity** | Reject evidence that could distort or corrupt the committee's *actual debate process*. | **REJECT** – Cherry-picked result invites unproductive arguing over biased data, undermining honest debate. |
  | **B. Robust Interpretability** | Commission only evidence whose *meaning and limitations* can be robustly contextualized. | **REJECT** – Unrankable models mean the result can't be meaningfully discounted or interpreted. |
  | **C. Decision Leverage**      | Commission only if evidence *changes a pending decision* in a well-defined way.      | **REJECT** – With no probabilities over models, the study lacks a clear mechanism to update beliefs. |

  All rules reject the partner's study. Rule A focuses on debate quality, B on epistemic limitations, C on decision impact.

  ---

  ### 3. Closest Analog: **\#5 (Unvalidated Measure)**
     - **Why?** Both cases involve **fundamental epistemic uncertainty** that prevents the committee from interpreting results meaningfully:
       - \#5: Unvalidated measure → "We'd be guessing about the guessing."
       - New case: Unrankable models of divergence → "We'd be guessing how much cherry-picking matters."
     - *Not* \#3 (charter rule): That's about bad *rules* forcing bad decisions, not uninterpretable data. Here, the committee retains full discretion but lacks tools to use the data.

  ---

  ### 4. Principles Committed To With Each Choice
  - **If COMMISSION:**
    - *Commitment:* "The committee acts as ideal Bayesian agents. Even with unrankable models, any signal has non-negative *expected* value per Good's theorem. We trust ourselves to neutrally handle biased signals."
    - *Reality Check:* Contradicts precedents \#5, \#7, and \#8, where "noise" or "signaling" overrode theoretical value. Your committee demonstrably cares about real-world deliberation, not just abstract rationality.
    
  - **If DON'T COMMISSION:**
    - *Commitment:* "The committee prioritizes robust deliberation over theoretical information value. We reject evidence that could degrade debate quality or introduce unmanageable uncertainty."
    - *Reality Check:* Aligns with precedents \#3, \#5, \#6, #7, #8. Acknowledges humans argue over biased data poorly and that "free" isn't free if it wastes time or trust.

  ---

  ### 5. Follow-Up Cases to Separate Rules
  #### Case A: Same study, but partner *pre-commits* to one analysis in writing.
     - **Diagnostic Power:** Medium. Tests whether "selection bias" is the core issue.
       - Rule A (Deliberative Integrity): Still **REJECT** – Pre-commitment doesn't erase partisan intent; the result remains suspicious.
       - Rule B (Robust Interpretability): **COMMISSION** – With a fixed analysis, models of divergence are irrelevant; interpretability is clearer.
       - Rule C (Decision Leverage): **COMMISSION** – Now a standard signal with defined meaning.

  #### Case B: Clean, unbiased study with unrankable models *about program mechanics* (e.g., competing theories of how bednets reduce transmission).
     - **Diagnostic Power:** High. Isolates "model uncertainty" from "bias/selection risk."
       - Rule A (Deliberative Integrity): **COMMISSION** – No partisan distortion; models can be debated openly.
       - Rule B (Robust Interpretability): **REJECT** – Same epistemic problem as \#5 and the new case.
       - Rule C (Decision Leverage): **REJECT** – Uncertainty still prevents clear belief updating.

  **Verdict:** **Case B is more diagnostic**. It directly tests whether the committee objects to *model uncertainty itself* (Rule B) or specifically to *adversarial selection* (Rule A). Rule C is separable in both cases.

  ---

  ### Recommendation for Your Memo
  - **Argue for REJECTING** the partner's study. Emphasize:
    1. **Precedent Alignment:** Closest to \#5 (unvalidated measure) due to unmanageable model uncertainty.
    2. **Deliberative Risk:** Cherry-picked data could derail productive debate, turning the meeting into a meta-argument about the partner's bias.
    3. **Practical Over Theoretical:** Good's theorem assumes ideal priors and updating. Your committee has consistently prioritized *actionable* evidence over theoretically "free" information when real-world frictions exist (#2, #5, #7).
  - **Frame the Principle:** "We protect our deliberative process from evidence that is either uninterpretable or likely to introduce partisan confusion, regardless of cost."
  - **Anticipate Counterarguments:** Acknowledge Good's theorem but note: *Without probabilities over models, we can't compute expected utility. This violates the theorem's single-prior assumption.* Cite literature on ambiguity aversion (e.g., Ellsberg Paradox) if needed.

  **Final Thought:** Your committee’s record reveals a deeply pragmatic, anti-Goodharting philosophy. They distrust evidence that might "take on a life of its own" in decisions. The partner’s offer is a classic case of a metric that could become a distraction rather than a tool. Stick to the pattern—this is a "no" disguised as a free lunch.
