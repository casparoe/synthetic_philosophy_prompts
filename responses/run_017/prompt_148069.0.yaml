  Below is a decision tree and taxonomy for higher-order theories of consciousness and their near neighbors, designed around your constraints. It uses your specified cases as diagnostics, avoids theory-laden nodes, and fits on two sides of A4. The tree has **8 branching questions** leading to **12 leaves** (including empty/unattractive positions). Each node is a one-line question tied to a concrete case, with branches marked as conceptual (CA) or empirical (ET). Leaves include short labels, core commitments, and the most awkward consequence. Names are attached only where uncontroversial and marked as optional.

  ---

  ### **Decision Tree: Theories of Consciousness**  
  *Branching questions derived from cases; answers must be defensible without knowing the theory.*

  1. **Node 1 (CA): In the empty higher-order state case (no first-order state, only a HO state representing e.g., "seeing red"), is the subject consciously experiencing red?**  
     - **Yes** → Node 2 (HO state alone suffices)  
     - **No** → Node 5 (HO state alone insufficient)  

  2. **Node 2 (ET): In the alien co-processor case (external device writes HO states), does consciousness persist if the device lags by 1 second?**  
     - **Yes** → Leaf A: **Actualist Thought-Theory**  
       *Commitments:* Consciousness requires an occurrent, non-perceptual HO state (e.g., a thought). Mechanism/source irrelevant (external devices suffice).  
       *Awkward:* Regress problem: HO states are unconscious, so how do *they* become conscious? (Optional: Rosenthal)  
     - **No** → Leaf B: **Inner-Sense/Quasi-Perceptual**  
       *Commitments:* HO states must be perception-like, generated by an internal "scanner" in real-time. Lag breaks consciousness.  
       *Awkward:* Requires a dedicated neural "scanner" with no clear evidence. (Optional: Lycan)  

  3. **Node 5 (CA): In the retrospective case (unaware of pain at T, accurate HO state at T+1), was the pain conscious at T?**  
     - **Yes** → Node 6 (HO state unnecessary at T)  
     - **No** → Node 7 (HO state necessary at T)  

  4. **Node 6 (ET): In animals/pre-linguistic infants, can consciousness exist without metacognitive abilities?**  
     - **Yes** → Node 8 (HO not essential)  
     - **No** → Leaf C: **Dispositional Higher-Order**  
       *Commitments:* Consciousness requires a first-order state *disposed* to produce a HO state (even if absent at T).  
       *Awkward:* Denies consciousness to animals/infants despite behavioral evidence. (Optional: Carruthers)  

  5. **Node 7 (CA): In the crossed-metacognition case (FO=red, HO=green), is the subject conscious of red, green, or both?**  
     - **Red** → Leaf D: **Self-Representational/Same-Order**  
       *Commitments:* Conscious states reflexively represent themselves (no separate HO state). FO content dominates.  
       *Awkward:* One state must be both FO and HO, demanding implausible self-encoding. (Optional: Kriegel)  
     - **Green** → Leaf E: **Tracking Higher-Order**  
       *Commitments:* HO states track FO states but don't require representing them *as mental* (e.g., "green" is inferred from context).  
       *Awkward:* HO state's content is arbitrary if decoupled from FO accuracy.  
     - **Both/Neither** → *Empty* (Incoherent: HO must either override or match FO)  

  6. **Node 8 (ET): In the stipulated dissociation (stimulation alters confidence but not discrimination), does consciousness change?**  
     - **Yes** → Leaf F: **Higher-Order Global Workspace**  
       *Commitments:* Consciousness arises when FO states enter a global workspace *and* generate HO states.  
       *Awkward:* Hybrid model; HO states are epiphenomenal to FO processing. (Optional: Lau)  
     - **No** → Node 9  

  7. **Node 9 (CA): Does the HO state itself need to be conscious?**  
     - **Yes** → *Empty* (Incoherent: Leads to infinite regress; no stable solution)  
     - **No** → Leaf G: **First-Order Representationalism**  
       *Commitments:* Consciousness is a first-order property (e.g., "poised" for action). HO states are irrelevant.  
       *Awkward:* Cannot explain metacognitive errors (e.g., crossed cases). (Optional: Tye)  

  8. **Node 10 (CA): In order-relativity, if a single state is FO under one description and HO under another, does "higher-order" explain anything?**  
     - **Yes** → Leaf H: **Whole-System Higher-Order**  
       *Commitments:* Consciousness requires the *entire system* to represent its states holistically.  
       *Awkward:* Vague criteria; hard to falsify. (Optional: Van Gulick)  
     - **No** → Leaf I: **Deflationary/No-Problem**  
       *Commitments:* "Consciousness" is just reporting or dispositional access; no "hard problem."  
       *Awkward:* Dismisses introspective certainty of experience. (Optional: Dennett)  

  ---

  ### **Legend & Notes**  
  - **Leaf Summary** (12 leaves):  
    A: Actualist Thought-Theory  
    B: Inner-Sense/Quasi-Perceptual  
    C: Dispositional Higher-Order  
    D: Self-Representational/Same-Order  
    E: Tracking Higher-Order  
    F: Higher-Order Global Workspace  
    G: First-Order Representationalism  
    H: Whole-System Higher-Order  
    I: Deflationary/No-Problem  
    *Empty/Unattractive positions:*  
    - Crossed-metacognition "both/neither" (incoherent)  
    - HO state must be conscious (infinite regress)  
    - Actualist HO with FO requirement (unattractive: HO determines content but FO is mysteriously required)  

  - **Untestable Distinctions:**  
    - **Leaf D (Self-Representational) vs. Leaf E (Tracking HO):** Both answer "red" in crossed cases, but differ on *why* (reflexivity vs. tracking). The tree cannot split them cleanly.  
    - **Leaf G (First-Order) vs. Leaf I (Deflationary):** Both deny HO necessity, but deflationism rejects explanatory gaps.  

  - **Key Omissions/Why:**  
    - **Purely conceptual HO views:** Collapsed into Leaf A/B (empirical cases force splits).  
    - **Non-mentalistic tracking:** Subsumed under Leaf E (tracking without representing *as mental*).  

  - **Design Notes:**  
    - Nodes use cases to force theory-agnostic answers (e.g., Node 1 uses empty HO state).  
    - Empirical nodes (ET: 2, 4, 6, 8) highlight where data could resolve disputes.  
    - Awkward consequences reflect common objections (e.g., regress, animal denial).  

  This tree covers all requested theories, leaves empty boxes where incoherent/unattractive, and flags indistinguishable pairs (D/E and G/I). Print double-sided on A4 for seminar use.
