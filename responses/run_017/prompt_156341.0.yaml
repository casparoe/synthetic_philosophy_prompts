  Leaf: Directed Feeling
  Answers: 1:B, 2:A, 3:A, 4:B, 5:A, 6:B, 7:B, 8:A, 9:B

  But note: for Hybrid, question 5 (toddler) and 8 (dog): we have B because they require evaluation and we assume toddlers and dogs don't have the right evaluations.

  Now, empty cells:

  We have four leaves. The space has other possibilities, for example:

