  We flag that the quiz cannot distinguish between Judgment Theory and Perceptual Theory (both fall under Evaluation-Based in our quiz). To separate them, we would need a case where the emotion is present without a full-fledged judgment but with a perception-like state. But our quiz doesn't have that.

  For the debate about the system without body, etc.:

  - Evaluation-Based: Commits to saying such a system could be afraid if it made the evaluation. Awkward elsewhere: might struggle with intense bodily emotions or moods.
