  - Hybrid: Commits to saying it could not be afraid (needs body). Awkward: might have trouble with emotions that don't have strong bodily components.
  - Directed Feeling: Commits to saying it could not be afraid (needs body). Awkward: same as somatic, plus the directedness might be hard to explain without a body.

  Which question does the most work? Question 6 (same bodily agitation) because it splits between those who think the emotion is fixed by content (A) and those by feeling (B).

