     **Simpler:** We let the Red party choose arbitrarily (or by a quick show of hands among the Red party members? But we don't have time). We can have the facilitator (you) flip a coin.

     Then, the payoff is assigned accordingly.

  ### Adding a Wrinkle: The Choice of Rule and the Hidden Cleavage
  - During the constitutional convention, they see the aggregate party support (e.g., pie chart: Red:30%, Blue:25%, Green:25%, Yellow:20%) but they don't see the two-dimensional structure. They choose Rule A or Rule B without knowing that there is a cross-cutting social axis. 
  - After the election, when forming the government under PR, they see the two-dimensional grid and realize that the social axis exists and that it might cause difficulties in coalition formation (if they chose PR) or that under FPTP, the social axis might have been suppressed.

  ### Materials:
  - Envelopes (20) containing: 
     - Party (Red, Blue, Green, Yellow) 
     - Intensity (Strong, Moderate, Weak) - randomly assigned
     - District (1 to 5) - assigned to create the FPTP effect (as above)
  - Ballots: 
     - For FPTP: 5 district ballots (each with the parties that are running in that district? Actually, all parties run in every district) and participants vote for one party in their district.
     - For PR: one national ballot with the four parties.
  - Whiteboard: to show the aggregate party support during the convention and then to record election results.
  - Sticky dots or pens for voting? Actually, we can use paper ballots.

  ### Running the Activity:

  1. **Introduction (5 mins):** 
     - Explain the scenario: "You are the constitutional convention for the new nation of Equilibria. You must choose a voting rule for electing the assembly. The country has four political parties, and here is the current distribution of party support (show pie chart: Red 30%, Blue 25%, Green 25%, Yellow 20%). Note: this is the overall support. You do not know which party you will support because that will be assigned later. After you choose the rule, you will be assigned a party and then you will vote."

  2. **Constitutional Convention (10 mins):**
     - Present Rule A and Rule B (without names). Describe them clearly (as above). 
     - Answer any questions about the mechanics. 
     - Vote by show of hands: majority chooses.

  3. **Assigning Preferences (5 mins):**
     - Distribute the envelopes. Each participant opens theirs and learns their party, intensity, and (if Rule A was chosen) their district.

  4. **Voting and Election 1 (20 mins):**
     - Each participant writes their party preference on a slip (this is collected and used for both elections). 
     - Run the first election under the chosen rule:
          - If Rule A (FPTP): collect votes by district. For each district, count the votes and announce the winner (the party with the most votes in that district). Write the assembly composition on the board.
          - If Rule B (PR): collect the national votes. Use the D'Hondt method to allocate the 5 seats. Write the seat distribution on the board.
     - Then, if the rule is PR, form the government: reveal the two-dimensional grid of party positions. Apply the coalition formation rule (Red chooses a partner by flipping a coin) and announce the government.

  5. **Election 2 (10 mins):**
     - "Now we will run the election again, but using the other rule. We will use the same party preferences."
     - Run the election under the other rule, using the same party preferences (and for FPTP, the same district assignments).
     - For PR: allocate seats and form government (if applicable). For FPTP: the government is the party with the most seats.

  6. **Payoffs (5 mins):**
     - For each system, calculate the points for each participant and tell them individually (or announce the results per party?).

  7. **Debrief (25 mins):**
     - Reveal that Rule A is FPTP and Rule B is PR.
     - Discuss:
          - In FPTP: did a party with significant support (Red) get no seats? Why? (spread too thin) -> cohesion matters.
          - In PR: how was the government formed? Was it by the voters or by post-election bargaining? Did a small party (Yellow) get to be part of the government? In our example, under PR, Yellow was in the assembly but not necessarily in the government. 
          - The trade-off: FPTP produces decisive governments but may not represent the diversity of opinion. PR represents diversity but may lead to coalition governments that are less decisive and where bargaining after the election matters.
     - What the activity leaves out:
          - Voter and party adaptation over time (e.g., strategic voting in FPTP, party fragmentation in PR).
          - The role of thresholds and district magnitude.
          - Why countries rarely change systems (because the current winners benefit from the current system).
     - The single sentence: "Electoral systems are not just about counting votes; they shape the entire political landscape by trading off between representing the diversity of the electorate and producing effective governments."

  ### Predictable Problems and Solutions:
  1. **Someone tries to invent a hybrid rule:** 
     - Explain that for the purpose of this activity, we are comparing two pure systems. We can discuss hybrids in the debrief.

  2. **Someone says both systems are rigged:** 
     - Acknowledge that no system is perfect, and the activity is designed to show the trade-offs. The goal is not to find the best system but to understand the consequences.

  3. **Time management:** 
     - Strictly time each section. Have pre-printed materials ready.

  4. **Ties in the vote or seat allocation:** 
     - Have a tie-breaking rule ready (e.g., flip a coin).

  5. **Participants not taking it seriously:** 
     - Emphasize the payoff (bragging rights) and the intellectual challenge.

  6. **Difficulty in coalition formation (if we allowed negotiation):** 
     - We avoided that by having an automatic rule.

  ### What the Fixed-Electorate Design Leaves Out:
  - Voter and party strategic behavior over time (in FPTP, voters desert small parties; in PR, new parties form).
  - The impact of thresholds (e.g., 5% threshold in PR) and district magnitude (how many seats per district).
  - The inertia of institutional change (because the incumbents benefit from the current system).

  In the debrief, you will have to explain these. The single sentence to leave them with: "The design of an electoral system is a choice about what kind of democracy you want: one that represents the full spectrum of opinion or one that produces clear winners, but rarely both."

  ### Adjustments for the First Run:
  - Do a dry run with 2-3 friends to iron out kinks.
  - Prepare a cheat sheet for the D'Hondt method and the coalition formation rules.

  This design should achieve your goals and fit within the 90-minute slot.
answer: |-
  Below is a runnable 90-minute activity designed to meet your specifications. It uses a fictional country to avoid real-world biases, holds the electorate fixed, and focuses on the trade-off between mirroring opinion and producing decisions. The design smuggles in cohesion penalties under FPTP and post-election bargaining under PR, and includes a cross-cutting cleavage to make the rule choice a strategic gamble.

  ---

  ### **Activity: Equilibria's Constitutional Convention**  
  **Duration:** 90 minutes  
  **Participants:** 20 adults  
  **Materials:** 
  - 20 envelopes (each containing: 1 colored card for party preference, 1 number card for intensity, 1 district card for FPTP) 
  - 20 blank ballots (cardstock) 
  - 20 pens 
  - 5 large envelopes (for district-level FPTP voting) 
  - Sticky dots (for coalition bargaining in PR) 
  - Whiteboard markers 
  - Pre-drawn pie chart (hidden until Step 1)  
  **Fictional Parties:**  
  - **Civics (C):** Urban, pro-science, high public services  
  - **Frontier (F):** Rural, pro-industry, low regulation  
  - **Harmony (H):** Mixed, social welfare, cultural unity  
  - **Pioneer (P):** Mixed, libertarian, individualism  

  ---

  ### **Step-by-Step Flow**  
  #### **1. Introduction (5 mins)**  
  - **Script:** "Welcome to Equilibria’s constitutional convention! We’re designing an electoral system for a new country. You’ll see the distribution of voter opinion, choose a rule, then be assigned secret identities. Our goal: design a system that produces a functional assembly."  
  - **Setup:** Hide the cleavage axes (Economic, Social) for now.  

  #### **2. Constitutional Convention: Rule Choice (15 mins)**  
  - **Reveal aggregate distribution:** Show a pie chart of party support (e.g., Civics 30%, Frontier 25%, Harmony 25%, Pioneer 20%).  
  - **Present two anonymous rules:**  
    - **Rule A (FPTP):**  
      - Country split into 5 districts (4 voters each).  
      - Each district elects one representative via plurality.  
      - Party with most seats wins outright.  
    - **Rule B (PR):**  
      - One national district.  
      - Parties get seats proportional to votes (D’Hondt method).  
      - Government formed by post-election coalition (≥3 seats).  
  - **Partial veil of ignorance:**  
    - Participants know the aggregate party support but NOT their personal identities or cleavage axes.  
  - **Vote:** Majority chooses Rule A or B (use paper ballots).  

  #### **3. Assign Identities & Vote (10 mins)**  
  - Hand out envelopes containing:  
    - **Party card (color):** C, F, H, or P.  
    - **Intensity card (number 1–3):** 3 = high stakes, 1 = low stakes.  
    - **District card (1–5):** For FPTP only (ignore for PR).  
  - **Vote:** Participants mark ballots with their party. Collect all ballots.  

  #### **4. Election 1: Under Chosen Rule (20 mins)**  
  - **If Rule A (FPTP) chosen:**  
    - Sort ballots into 5 district envelopes. Tally votes per district.  
    - **Key design:** District composition ensures cohesion penalty (e.g., Civics has 30% support but is spread thin: wins 0–1 seats despite being largest party). Frontier/Harmony win via concentrated support.  
    - **Government:** Party with most seats wins. Automatic.  
  - **If Rule B (PR) chosen:**  
    - Tally national votes. Allocate 5 seats via D’Hondt (e.g., Civics 2, Frontier 1, Harmony 1, Pioneer 1).  
    - **Coalition bargaining:** Parties form government by negotiating ≥3 seats. Use sticky dots:  
      - Assign 2 participants per party (if possible) to negotiate.  
      - **Reveal cross-cutting cleavage:** Show the hidden axes:  
        - *Economic:* C/F (pro-public services) vs. H/P (pro-private).  
        - *Social:* C/H (pro-unity) vs. F/P (pro-individualism).  
      - Parties negotiate based on axes (e.g., Civics may ally with Harmony on social issues but clash on economics).  
      - **Cohesion trap:** Small party (e.g., Pioneer) may become kingmaker despite low votes.  

  #### **5. Election 2: Under Other Rule (15 mins)**  
  - **Same ballots**, re-counted under the rule **not** chosen.  
  - **FPTP → PR:** Show vote-to-seat distortion (e.g., Civics gains seats). Simulate quick coalition bargaining.  
  - **PR → FPTP:** Highlight wasted votes and cohesion penalties.  

  #### **6. Payoffs & Outrage (5 mins)**  
  - **Scoring:**  
    - **Representation points:** 3/2/1 if their party wins a seat (match intensity).  
    - **Government points:** +2 if their party governs (FPTP: winning party; PR: coalition members).  
  - **Tally points:** Participants self-calculate. No real prizes—bragging rights only.  

  #### **7. Debrief (20 mins)**  
  - **Reveal Rule A = FPTP, Rule B = PR.**  
  - **Map moments to features:**  
    | **Moment in Activity** | **Real-World Feature** |  
    |------------------------|------------------------|  
    | Civics losing seats despite 30% (FPTP) | Cohesion penalty (e.g., UK Lib Dems) |  
    | Pioneer kingmaking (PR) | Post-election bargaining (e.g., Israel, Germany) |  
    | Coalition gridlock over cleavages | PR’s sensitivity to fragmentation |  
  - **Trade-off recap:**  
    - FPTP: Decisive governments but "wastes" votes, punishes diffuse support.  
    - PR: Mirrors diversity but shifts power to post-election deals.  
  - **Predictable failures & fixes:**  
    - *Hybrid rule demand:* "We’ll discuss hybrids afterward—today is about pure designs."  
    - "Both systems are rigged!": "Exactly! Each ‘rigs’ outcomes toward different values. Which rig matters less to you?"  
    - Time crunch: Pre-calculate D’Hondt and district outcomes.  
  - **What the design leaves out (supply in debrief):**  
    - Voter/party adaptation (e.g., tactical voting in FPTP, niche parties in PR).  
    - Thresholds & district magnitude (e.g., 5% rules).  
    - Inertia: Winners protect the system that elected them.  
  - **Closing sentence:**  
    > "Electoral rules aren’t about finding the ‘fairest’ system—they’re about what you’re willing to sacrifice: a mirror of the public, or a machine for decisions."

  ---

  ### **Design Notes**  
  1. **Smuggled Insights:**  
     - **FPTP cohesion penalty:** Pre-assign districts so the largest party (Civics) is spread thin (e.g., 1–2 supporters per district). Even if Civics gains votes, it loses seats to geographically concentrated rivals.  
     - **PR kingmaker problem:** In PR negotiations, reveal cross-cutting cleavages *after* the vote. Harmony/Pioneer may be pivotal despite low votes, forcing participants to bargain over unpredictable divides.  

  2. **Cross-Cutting Cleavage Wrinkle:**  
     - Participants see aggregate party support (Step 2) but **not** the Economic/Social axes until PR bargaining (Step 4). This makes the rule choice a gamble:  
       - FPTP bets on geography trumping values (safe if cleavages align).  
       - PR bets on post-election flexibility (risky if axes conflict).  

  3. **Fixed-Electorate Limitations:**  
     - Cannot show long-term strategic voting/party formation.  
     - Misses impact of thresholds (e.g., 5% rules) and district magnitude.  
     - Obscures why reform is rare (incumbent self-interest).  
     **Mitigation:** Address these in debrief with examples (e.g., "In FPTP, voters abandon small parties over time; in PR, extremists thrive").  

  4. **Troubleshooting:**  
     - **Low engagement:** Stress non-partisan, numerical puzzle.  
     - **Coalition deadlock:** Impose a 2-min time limit; if no deal, minority government forms (lose points).  
     - **Mischief:** If participants spoil ballots, use valid votes only.  

  ---

  ### **Why This Works**  
  - **Experimental rigor:** Identical ballots isolate rule effects.  
  - **Drama:** Participants *feel* cohesion penalties (FPTP) and bargaining chaos (PR) without lectures.  
  - **Debrief depth:** Concrete examples anchor theory.  
  - **Time-efficient:** Pre-assign districts/cleavages; use D’Hondt cheat sheets.  

  **Final Tip:** Run a test with 3–4 friends to refine timing. The coalition negotiation is the wildcard—keep it short and chaotic to mirror real politics.
