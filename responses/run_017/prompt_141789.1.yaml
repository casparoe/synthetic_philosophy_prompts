  We are designing a 90-minute activity for a group of about 20 participants. The goal is to illustrate the trade-off between proportional representation (PR) and first-past-the-post (FPTP) systems without naming them until the end. We want to hold the electorate fixed (same ballots) and vary only the aggregation rule. We'll create a fictional country with fictional parties to avoid real-world biases.

  ### Core Structure:
  1. **Constitutional Convention (15 mins):** 
     - Participants act as a constitutional convention for a fictional country (let's call it "Equilibria"). 
     - They see the aggregate distribution of opinion (preference distribution) in the country, but not their own individual preferences yet.
     - They must choose a voting rule (without knowing which rule is which) from two options: 
          - **Rule A** (which will be FPTP, but not named as such)
          - **Rule B** (which will be PR, again not named)
     - The choice is made by majority vote.

  2. **Assigning Preferences (5 mins):**
     - After the rule is chosen, each participant draws a secret card that assigns them a preference profile (i.e., which party they support and how strongly).

  3. **Election Round 1 (20 mins):**
     - Participants vote according to the rule they chose (Rule A or Rule B) using the same set of ballots (so we record their votes on identical ballots for both rules).
     - We run the election under the chosen rule and compute the outcome.

  4. **Election Round 2 (15 mins):**
     - Using the same ballots (so we don't revote, we just re-count the same ballots), we run the election under the other rule (the one not chosen).

  5. **Payoffs and Outcomes (10 mins):**
     - Each participant gets a payoff (in points) based on how well the outcome (the assembly or government) matches their preference profile.

  6. **Debrief (25 mins):** 
     - Map the experience to real electoral systems, naming FPTP and PR.
     - Discuss trade-offs: mirroring vs. decisiveness, cohesion under FPTP, post-election bargaining under PR.
     - Address what the activity leaves out.

