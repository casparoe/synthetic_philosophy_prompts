  Here's a concise, situation-based quiz designed to sort participants into the specified ethical positions without using philosophical jargon. It uses concrete scenarios to implicitly reveal beliefs about moral obligations and visitor responsibilities. The quiz takes ~3 minutes to complete and is optimized for non-native English speakers.

  ### Quiz: "What do you actually think about local rules?"
  *(Each question has 2-3 simple options. Pick what feels most natural.)*

  1. **Situation**: At a sit-down restaurant in the US, your server is friendly. Meals are priced assuming you’ll tip. You can afford it.  
     - A: Skip tipping – the restaurant should pay fairly anyway.  
     - B: Tip 15-20% – the server relies on tips to live.  
     - C: Tip something small to avoid looking cheap.  

  2. **Situation**: In Japan, tipping is rare and confusing. Your server did great.  
     - A: Tip anyway – you want to show gratitude.  
     - B: Don’t tip – it’s awkward here.  

  3. **Situation**: You’re in a crowded UK train station. No clear line forms, just a scrum.  
     - A: Push forward politely to reach your train.  
     - B: Wait your turn based on who arrived first.  

  4. **Situation**: In Germany, jaywalking is illegal but locals do it constantly. No cars, no police, but a kid watches you.  
     - A: Cross against the light – it’s safe and normal here.  
     - B: Wait for the light – the kid might copy you someday.  

  5. **Situation**: In a country where bribing to skip lines is common, you see locals pay to cut.  
     - A: Pay to cut – that’s how it works here.  
     - B: Wait your turn – bribing is unfair.  

  6. **Situation**: You’re too broke to tip in the US after a meal. The server won’t track you down.  
     - A: Skip the tip – you need the money.  
     - B: Tip anyway – they still rely on it.  

  7. **Situation**: A German exchange student visits your home and ignores a custom (e.g., shoe removal).  
     - A: It’s fine – they’re just visiting.  
     - B: They should follow our customs.  

  8. **Situation**: You’ll leave the US in 10 months. Staff won’t tip *you* back.  
     - A: Still tip – it’s how things work now.  
     - B: Skip tipping – you won’t benefit later.  

  9. **Situation**: In a US coffee shop, you’re wealthier than locals.  
     - A: Tip way more – you can afford to help.  
     - B: Tip the usual amount – that’s what’s expected.  

  ---

  ### Scoring Key & Logical Structure  
  **How it sorts**:  
  - **Q1, Q6** separate harm-based views (reliance) from others.  
  - **Q2, Q7** split universalists from guest-ethic adherents.  
  - **Q3, Q5, Q9** distinguish expressive/symbolic commitments.  
  - **Q4, Q8** test reciprocity and "double standards."  

