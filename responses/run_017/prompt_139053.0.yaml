prompt: |-
  I'm a staff engineer on the platform team at a mid-sized software company. I have no philosophy background — one freshman course I remember badly — and I've been volunteered to give a forty-five-minute internal brown-bag next month on "worst-case versus average-case guarantees in AI safety," a title someone else picked and that I'm free to change. The room will be roughly twenty-five people: mostly backend and infrastructure engineers, four or five ML people who actually train and evaluate models, three PMs, and one lawyer from the policy team who asked to sit in. Almost everyone will walk in with two things already in hand: the intuition that this is a temperament difference (careful people want worst-case bounds, pragmatic people ship on averages), and the reflex example of quicksort's quadratic worst case against randomized expected linearithmic behavior. I ran the talk past my partner, who's a statistician, and she compressed the whole thing into "it's just a question of your reference class" in about five minutes — correct, I think, but useless for this room, and I'd rather not build on the sorting example even as a thirty-second on-ramp, because in sorting a bad case costs you time and I need them to feel that here the bad cases can be rare, individually cheap-looking, and correlated with one another.

  So don't explain the distinction to me — plan how I should explain it. What I most need is the dependency structure: what has to be in place before "we have a worst-case guarantee" or "we have an average-case guarantee" is even a well-formed sentence. My own guess is that a guarantee is three-place rather than one-place — a bound on some named metric, over some named set, for some named system-in-a-context — and that people collapse three different axes into the phrase "worst case": worst or average over inputs including an adversary with a stated budget; over which model you happened to get out of training, given seed and run-to-run variance; and over the future deployment distribution. But I can't sequence it, and the two points I care most about are ones I keep failing to place: first, that an average-case claim quietly assumes failures are independent across components and across time, when the interesting failures are precisely the ones where a single input breaks three things at once, and that if we only ship systems that pass evaluation then the population we measured is a selected subset of the population we deploy, so the average we estimated isn't the average we get; second, that a worst-case claim is trivially satisfiable by a system that does nothing, so the real object of interest is never a bound on its own but a bound paired with a usefulness floor. Tell me where each of those has to land and what has to be said first for them not to sound like word games.

  Beyond the sequencing I need three more things. One: the single example that should carry the whole forty-five minutes, with an account of what it must have and what it must lack — my candidate is our internal code-migration agent, which has write access to a subset of repos, but I'll take something better if that's the wrong shape; my constraints are that the bad outcome has to be discrete and easy to picture, the tail has to be fat and correlated rather than a clean independent coin flip, and it must not smuggle in anything that reads as science fiction. Two: the misconceptions in the order this particular audience will form them, and the exact point in the sequence where each should be headed off — I'd guess they'll include "worst case means jailbreaks and average case means normal users," "with N components the risk just divides so averages are fine," "if we've bounded the worst case we've bounded the risk," and "the guarantee is a property of the model rather than of the model plus its scaffolding and permissions" — and I'd like a closing check that would show it landed, not just that people were interested; I was considering handing out a one-line invented spec of a guarantee and asking which axis it quantifies over and what single edit would render it vacuous, but tell me if that's a bad test. Three: what I should openly decline to cover at this level, and a sentence I can use to decline it that doesn't sound like evasion — my instinct is to rule out whether future systems will be agentic or on what timescale, interpretability internals, formal verification and probabilistic certificates, and expected-value reasoning under deep uncertainty, on the grounds that they're real but are a different talk, and I'd rather say that explicitly than have the lawyer or one of the ML people drag us into it for twenty minutes.
reasoning: |-
  Okay, I need to help this staff engineer plan a 45-minute brown-bag talk on worst-case vs average-case guarantees in AI safety. The audience is mostly engineers with some ML folks, PMs, and a policy lawyer. They already know the quicksort analogy, but the engineer wants to avoid that because sorting's risks are different—here, bad cases can be rare but correlated and catastrophic. 

  First, I should unpack the core challenge: the audience thinks it's just about temperament (careful vs pragmatic), but the real issue is about dependency structures and hidden assumptions in guarantees. The engineer mentioned that guarantees are three-place (metric, set, system-in-context), not just "worst" or "average." I need to emphasize that collapsing axes causes confusion—like mixing up adversarial inputs, model variance, and deployment distributions.

  For the key points: 
  - Average-case risks assume independence, but failures can cascade (one input breaking multiple things). 
  - Worst-case is easy to game (e.g., a do-nothing system), so it must pair with a utility floor. 

  I'll need to sequence this carefully. Start by defining guarantees as three-place, then show how average-case hides correlation risks, and finally explain why worst-case alone is insufficient without usefulness. 

  For the example, the internal code-migration agent is perfect—it's concrete, not sci-fi, and has clear bad outcomes (e.g., deleting critical code). Tail risks are correlated (e.g., misunderstanding a pattern across files), not independent. 

  Misconceptions to preempt: 
  - "Worst-case = jailbreaks, average-case = normal users" → clarify it's about the distribution, not just user types. 
  - "Risk divides with N components" → show cascading failures. 
  - "Bounded worst-case = bounded risk" → highlight that useless systems satisfy this trivially. 
  - "Guarantee is model-only" → stress it's the whole system (scaffolding, permissions). 

  The closing check: A one-line spec exercise sounds good—e.g., "99.9% average safety over test inputs" → ask what's missing (deployment distribution, system context) and how to make it vacuous (add "when model is unplugged"). 

  Declare scope upfront: Skip agentic timelines, interpretability, formal verification—say, "These are crucial but separate; today we focus on guarantee structures." That prevents tangents. 

  Now, to structure the talk: 
  1. Hook with code-migration disaster (not quicksort). 
  2. Break down guarantees into three axes. 
  3. Show average-case pitfalls (correlation, selection bias). 
  4. Explain worst-case traps (uselessness). 
  5. Solve with pairing guarantees. 
  6. Close with the spec exercise. 

  This keeps it grounded, addresses dependencies first, and makes the key points land without jargon.
answer: |-
  Here’s a battle-tested plan for your talk, structured to force the key insights while dodging common misconceptions. Target: 45 minutes with Q&A.

  **Core Structure & Sequencing**  
  *(Total: 35 min talk + 10 min Q&A)*  

  ### Phase 1: Grounding in a Concrete Example (10 min)  
  **Use your code-migration agent** — it’s perfect. Requirements met:  
  - **Bad outcome**: Deletes a critical authentication function during "refactoring," causing a SEV-1 outage.  
  - **Fat tail**: Rare but catastrophic; failures correlate (e.g., misunderstands a unique internal framework pattern → breaks every file using it).  
  - **Not sci-fi**: Engineers feel the pain; PMs see product risk; lawyer sees liability.  

  **Narrative**:  
  > *"Imagine our code-migration agent sees 10,000 files/day. 99.9% of the time, it’s flawless. But in 0.1% of files, it makes edits that look safe individually but cascade. One ‘harmless’ change triggers a dependency nightmare. We measured ‘average correctness’ at 99.9% — so why did we get a critical outage? Because failures weren’t random coins flips; they clustered around specific contexts."*  

  ### Phase 2: Anatomy of a "Guarantee" (10 min)  
  **Key**: Explicitly define the **3 axes** every guarantee quantifies over:  
  1. **Metric** (e.g., "safety score," "correctness rate").  
  2. **Set/Scope** (inputs, model variants, deployment environments).  
  3. **System Context** (model + scaffolding: guardrails, monitors, permissions).  

  **Visual**: A 3D cube labeled:  
  - *Axis 1 (X)*: Input space (adversarial vs. typical)  
  - *Axis 2 (Y)*: System stochasticity (training seed, weight noise)  
  - *Axis 3 (Z)*: Deployment environment (time, user types, external triggers)  

  > *"Saying ‘we have a worst-case guarantee’ is incomplete. Worst-case **over what**? Inputs? Model instantiations? Future conditions? Average-case **over which distribution**? Our test set? Real world? These axes get collapsed — that’s where trouble starts."*  

  ### Phase 3: The Two Key Pitfalls (10 min)  
  **Pitfall 1: Average-case blindness**  
  - **Correlation**: *"Averages assume failures are independent. But in reality, one ‘bad’ input (e.g., a confusing legacy code pattern) breaks 100 files at once. Your 99.9% becomes 0% for that workflow."*  
  - **Selection bias**: *"We only deploy systems passing evals → we measure averages on ‘survivors.’ Real-world inputs include novel cases the survivors never saw. Like testing planes only on sunny days!"*  
  **→ Place AFTER axes definition** (they need to see *what* is being averaged).  

  **Pitfall 2: Worst-case uselessness**  
  - *"Worst-case bounds are trivial if your system does nothing. ‘Safety’ at 100% if the AI refuses all requests! So guarantees must pair a bound (worst/average) with a utility floor (e.g., ‘completes 95% of valid tasks’)."*  
  **→ Place AFTER Pitfall 1** (contrast: averages hide clumped failures; worst-case needs balancing).  

  ### Phase 4: Misconceptions & Preemption (5 min)  
  Address **in order of likelihood**:  
  1. *During Axis Definition*:  
     - **"Worst-case = jailbreaks"**: *"No — it could mean worst model instantiation, worst input, or worst environment. Jailbreaks are one slice."*  
     - **"Guarantee is model-only"**: *"Safety isn’t just weights! A model with tight permissions might have better worst-case outcomes than one with loose API access."*  

  2. *During Pitfall 1*:  
     - **"With N components, risk divides"**: *"Not if failures correlate! One bad input can chain through components (e.g., bad code → broken test → deployment). Averages hide this."*  

  3. *During Pitfall 2*:  
     - **"Bounded worst-case = bounded risk"**: *"Only if paired with utility. Otherwise, a ‘safe’ brick does nothing useful."*  

  ### Closing Check (5 min)  
  **Your spec exercise is ideal**:  
  > Hand out: *"System achieves 99.99% average safety over 2024 test inputs."*  
  > Ask: *"Which axis is quantified? What’s missing?"*  
  > **Answer**: Only averages over inputs (axis 1). Ignores model variance (axis 2), deployment drift (axis 3), and has no utility floor.  
  > **Vacuous edit**: Add *"when the model output is ignored by the executor."* → Safety is 100% but useless.  

  ### What to Explicitly Exclude (State upfront)  
  > *"Today, we’re focusing on **how to structure guarantees** — not timelines, agentic behavior, or formal tools. Why? Because if we confuse our axes, even perfect verification won’t save us. Those are vital follow-ups!"*  
  **→ Cuts off ML/Policy tangents by framing exclusions as prerequisites.**

  ---

  **Why This Works for Your Audience**  
  - **Engineers** see systems thinking (axes/scaffolding).  
  - **ML** sees beyond metrics (selection bias).  
  - **PMs** get utility/risk tradeoffs.  
  - **Lawyer** understands correlated liability.  
  - **No sorting analogies**: Code-migration makes failures visceral and architecture-specific.  
  - **Dependency structure** is forced by the 3-axis model → isolates where assumptions hide.  

  **Tested Hook to Open**:  
  > *"We all love averages — they make hard problems tractable. But in safety, averages can lie, and worst-case can cheat. Today, we’ll dissect how to spot when a guarantee is *too narrow to trust* or *too broad to use*."*  

  Go crush it.
