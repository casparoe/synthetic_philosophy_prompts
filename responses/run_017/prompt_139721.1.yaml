  The reference mechanism problem adds another layer. If multiple training runs yield different mechanisms, how do we define the reference family? This relates to the broader issue of functional equivalence versus implementation details. 

  For the research agenda, I should focus on foundational questions first. The circularity problem is the most upstream because it affects the validity of the entire endeavor. Without resolving it, other questions might be moot. This is tractable through conceptual analysis and formal modeling, without needing experiments. It's neglected in ML, where practitioners often assume mechanisms are objective. A negative result here could save effort elsewhere.

