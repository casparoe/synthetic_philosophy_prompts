  Then, the reference family problem. Understanding what unifies different implementations (e.g., via task-relevant invariants) is crucial. This involves functional equivalence concepts. Philosophers can collaborate with theorists on abstraction methods. If new empirical findings show mechanisms clustering by behavior, it gains priority.

