  Okay, let me start by really digging into this user's question. They're a national circuit debater dealing with healthcare financing debates. The core issue is a rhetorical move they've noticed opponents using: switching baselines—like state of nature vs. entitlements—to always make their side look better. 

  First, I need to unpack their examples. In (a), the market advocate says unaffordable care isn't denial because the baseline is no system. In (b), waiting lists become denial because baseline shifts to expected care. In (c), taxes are framed as taking because baseline is pre-tax holdings. The pattern is glaring: the baseline dances to defend whatever point is being made.

  The user's partner argues there's a principled distinction: taxes take existing property while unaffordable care never belonged to the person. But is that distinction solid or just convenient? This reminds me of libertarian property theory where initial ownership defines everything. But in reality, initial ownership is itself contested—like whether healthcare should be a right.

  Hmm... the user already rejected positive/negative rights and doing/allowing distinctions because those focus on action types, not baseline selection. They're right—their concern is meta: how we choose the "before" picture in harm assessments. That's more about counterfactual framing than ethical categories.

  I recall "baseline manipulation" in informal logic circles, but it's not formalized. "Counterfactual cherry-picking" fits too—selecting comparisons that serve your argument. For literature, Nozick's entitlement theory comes closest by locking in historical ownership as the baseline. But that just pushes the debate to whether that baseline is fair. 

  The deeper problem is circularity: you pick a baseline that assumes your conclusion (e.g., "taxes take" assumes pre-tax holdings are sacrosanct). The user needs a way to call this out. Terms like "baseline gerrymandering" or "normative bootstrapping" could work—the latter captures how norms are smuggled into the starting point.

  For boundary cases: If both sides agree the baseline (e.g., "after theft" for returning stolen goods), no manipulation. But if baselines shift mid-argument (like in the user's examples), that's the move. The partner's defense doesn't survive—it pretends property rights are neutral when they're exactly what's disputed in healthcare debates. 

  User's real need: ammunition to expose this as fallacy, not just "disagreement." Naming it gives strategic advantage. They'd also appreciate knowing when baseline shifts *are* legitimate (e.g., new agreements changing entitlements). 

  Final thought: This isn't just about logic—it's about framing justice. The opponent's baseline choices make systemic issues look like individual failures. Calling out the manipulation forces the debate onto fair terms.
answer: |-
  Based on your precise description, the core move you're identifying **does not have a single, universally established name in formal logic or philosophy**, but it's a well-recognized pattern of problematic reasoning. The closest conceptual fit is **Baseline Selection Fallacy** or **Counterfactual Gerrymandering**, often rooted in **Unjustified Baseline Shifting**.

  Here's the breakdown, including nearby concepts, distinctions, and a coined term:

  1.  **Nearby Concepts & Why They Don't Quite Fit:**
      *   **Positive vs. Negative Rights:** Classifies *types* of rights/obligations. Your concern is *how the baseline for harm* is defined *within* arguments about these rights, not the classification itself. The baseline shift exploits the ambiguity *between* these frameworks without committing to one consistently.
      *   **Doing vs. Allowing Harm:** Classifies *types of actions*. Your issue is about the *counterfactual scenario* used to *measure* whether harm occurred ("harm compared to what?"), not primarily about the nature of the act causing it. The baseline shift changes the measurement standard.
      *   **Question-Begging (Petitio Principii):** Assumes the conclusion within the premises. While related, this move is more subtle. It doesn't *assume* the conclusion outright; it *selects a baseline that presupposes a specific normative framework* (property rights, state obligations) which *leads* to the desired conclusion. The baseline choice *itself* is the contested premise.
      *   **Moral Luck / Arbitrary Circumstance:** Focuses on how outcomes affect moral judgments based on factors outside an agent's control. Your concern is the *deliberate selection* of the comparison point for assessing outcomes/welfare, not luck per se.
      *   **Robert Nozick's Entitlement Theory:** This is the *philosophical foundation* your opponent is likely implicitly relying on (especially in examples (a) & (c)). Nozick argues justice depends on how holdings were *acquired* and *transferred*, not on end-state patterns. The problem isn't Nozick's theory itself, but the *inconsistent application* of its baseline (historical holdings) and the *switching away* from it when convenient (as in (b)).

  2.  **The Core Problem: Unjustified Baseline Shifting (Counterfactual Gerrymandering)**
      *   **Description:** The fallacy involves strategically and arbitrarily selecting the counterfactual state of affairs (the "baseline") against which a current situation is judged to be "harmful," "unjust," or making someone "worse off." The selection is not based on a consistent, justified normative principle but is manipulated *ad hoc* to always favor the desired conclusion about whether harm or injustice occurred.
      *   **Why it's Fallacious:** It renders the concept of "harm" or "worse off" vacuous. Any situation can be made to look harmful or harmless by choosing an extreme enough baseline for comparison (e.g., comparing to a state of nature vs. comparing to utopia). The choice of baseline *is* the core normative dispute, yet it's presented as an uncontroversial starting point.

  3.  **Coined Term: Normative Baseline Gerrymandering**
      *   **Definition:** The fallacious practice of strategically selecting, without consistent justification, the counterfactual state of affairs (baseline) used to assess harm, injustice, or welfare loss in order to predetermine the desired evaluative conclusion, particularly when the legitimacy of the baseline itself is the core point of normative contention.
      *   **Boundary Cases:**
          *   **Applies (Gerrymandering):** Your examples (a), (b), and (c) perfectly illustrate this. The baseline shifts from "state of nature/no system" (minimizing "harm" from unaffordability), to "entitlement/expected service" (maximizing "harm" from waiting lists), to "current pre-tax holdings" (maximizing "harm" from taxation), always serving the advocate's pro-market conclusion.
          *   **Does Not Apply (Legitimate Shift):**
              *   **Agreed Framework:** Both parties agree on the relevant baseline for a specific comparison (e.g., within a contract dispute, both agree the baseline is the terms of the contract).
              *   **Consistent Principle:** A baseline shift is explicitly justified by a consistent overarching principle applied neutrally. (E.g., *Always* using "pre-existing legitimate holdings" as the baseline. While this is contestable, using it *consistently* avoids gerrymandering. Your opponent *isn't* doing this, as shown by (b)).
              *   **Changed Circumstances:** A significant new event or agreement legitimately changes the relevant baseline for future assessments (e.g., signing a contract creates new entitlements; a court ruling establishes a new legal baseline).

  4.  **Your Partner's "Principled Distinction": Does it Survive?**
      *   **Their Argument:** Taxes take pre-existing property ("what someone already has"), while unaffordable care isn't a taking because the care "was never his." Therefore, different baselines (pre-tax holdings vs. state of nature) are justified.
      *   **Why it Fails (and is Part of the Gerrymandering):**
          1.  **Assumes the Conclusion:** This distinction *presupposes* the very libertarian/Nozickian view of property rights and negative liberty that is fundamentally *disputed* in the healthcare debate. It assumes pre-tax holdings are morally sacrosanct "already haves," while access to potentially life-saving care is not something anyone could be "owed" or have a claim to. This baseline *choice* (what counts as "already having") is the core issue.
          2.  **Inconsistent Application:** As your example (b) shows, this "principled" distinction is abandoned when convenient. The patient on the waiting list *wasn't* "already having" the surgery. Yet, they are described as "denied care" because the baseline shifts to what they are *owed* by the system. If the "never had it" principle were applied consistently here too, the waiting list patient also wasn't "denied" anything they "already had."
          3.  **Ignores the Systemic Context:** Framing unaffordability as a neutral "not receiving" ignores how market systems, legal structures, and distributions of wealth *create* the condition of unaffordability. It treats the market outcome as the natural baseline, obscuring the role of systemic choices. The tax system is framed as an active intervention, while the market system is framed as passive/natural.

  **Conclusion:**

  You are correctly identifying a significant and fallacious pattern: **Normative Baseline Gerrymandering** (or Unjustified Baseline Shifting / Counterfactual Gerrymandering). This involves strategically changing the "compared to what?" standard to always make your side look like it avoids causing harm while the other side causes harm.

  Your partner's defense relies on a distinction (taking vs. not receiving) that smuggles in a contested normative premise (strong libertarian property rights) as if it were a neutral fact. This distinction *is* the core of the baseline choice and is applied inconsistently (as shown by the waiting list example). Therefore, **your partner's principled version does not survive scrutiny; it is itself an instance of the gerrymandering.**

  **How to Use This:** In debate, explicitly name the move: "My opponent is engaging in Normative Baseline Gerrymandering. They keep changing the comparison point – state of nature, system entitlements, pre-tax holdings – solely to predetermine their conclusion that markets avoid harm while public systems cause it. The choice of baseline *is* the dispute about justice. Their shifting standard renders their harm claims arbitrary and circular." Point out the inconsistency between how they treat unaffordability (state of nature baseline) vs. waiting lists (entitlement baseline). Force them to justify *one consistent baseline principle* for assessing harm in *all* scenarios related to healthcare access and finance.
