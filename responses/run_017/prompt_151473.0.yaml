answer: |-
  ### Welfare Assessment Dilemma in Atlantic Salmon Sea Cages  
  **Scenario (248 words):**  
  A commercial sea cage holds 1-year-old Atlantic salmon (*Salmo salar*) at high density (25 kg/m³). Water quality (O₂, temp, ammonia) meets industry standards. Fish exhibit:  
  - **Chronic signs:** Reduced surface activity, flattened diurnal cortisol rhythm, low response to acute netting stress (baseline cortisol 5 ng/mL; post-stress peaks ≤8 ng/mL).  
  - **Behavioral signs:** Minimal aggression, no visible injuries, but near-complete absence of shoal structure exploration or spontaneous burst swimming.  
  - **Physiological signs:** Uniform growth, no lesions or infections.  

  **Hedonic ("Feelings-Based") Account Verdict:**  
  **Poor welfare.** Reasoning: Salmon display chronic behavioural depression (lethargy, non-response to stimuli). Flattened cortisol rhythm indicates prolonged stress adaptation ("burnt-out" HPI axis), not wellness. The absence of acute stress responses masks severe negative affective states (learned helplessness). Low aggression suggests suppressed natural drives due to overwhelming stress.  

  **Natural-Function ("Telos") Account Verdict:**  
  **Poor welfare.** Reasoning: Salmon cannot express species-typical behaviours (exploratory swimming, shoal hierarchy formation, substrate interaction). The barren environment and high density prevent natural repertoires. Cortisol dysregulation reflects failure to engage with environmental challenges central to salmonid life history.  

  **Interventions & Backfire Mechanism:**  
  - **Hedonic Prescription:** *Reduce density to 15 kg/m³.* Effect: Agitation decreases, cortisol rhythm partially restores → **hedonic improvement**.  
  *Backfire:* Space enables aggression; dominant fish attack subordinates. Injured fish show *telos* failure (cannot migrate/forage naturally). **Telos welfare worsens.**  
  - **Telos Prescription:** *Add vertical environmental structures (suspended ropes).* Effect: Salmon explore structures, exhibit shoaling → **telos improvement**.  
  *Backfire:* Structures trigger territorial competition; new injuries + chronic stress re-emerges as cortisol spikes (45 ng/mL). **Hedonic welfare worsens.**  

  **Key Feature & Its Role:**  
  **Chronic stress masking.** The flattened cortisol rhythm allows both accounts to interpret it as evidence for *their* diagnosis (hedonic: burnout; telos: deprivation). Remove this, and high cortisol would unite both on "acute stress = bad", collapsing the dilemma.  

  **Escape Routes for Each Account:**  
  - **Hedonic Defender:** "The telos focus on ‘natural’ behaviours ignores that evolution optimizes for reproduction, not happiness. A safe but boring life may *feel* better than a ‘natural’ violent one."  
  - **Telos Defender:** "What feels ‘positive’ in captivity (calmness) may be pathological passivity. True welfare requires struggle – transient suffering during aggression is tolerable for authentic species-expression."  

  ---  
  **Word Count:** 746  
  **Core Conflict:** The physiological ambiguity of chronic stress enables two valid welfare frameworks to prescribe mutually destructive fixes. Assessors must confront that welfare isn’t a unified metric but a negotiation between irreconcilable ideals.
