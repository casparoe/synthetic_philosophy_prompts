answer: |-
  Below is a draft joint document template for your adversarial collaboration, structured as requested. It is phrased neutrally to allow endorsement by both parties while accurately representing their core commitments. Key terms (e.g., "proper function," "causal role") are used as placeholders for the theorists' preferred terminology.

  ---

  ### Joint Statement on Biological Function  

  **1. Agreed Foundational Claims**  
  Both parties affirm the following:  
  1.1. Not every effect of a trait constitutes its function; a principled distinction exists (e.g., the heart’s blood-pumping vs. its sound production).  
  1.2. Function attributions perform indispensable explanatory work across biological subfields (e.g., molecular biology, physiology, evolutionary biology), albeit with varying emphases.  
  1.3. Any adequate account of function must provide a non-arbitrary, empirically applicable criterion for *malfunction* or *dysfunction* (e.g., a heart that fails to pump blood adequately).  
  1.4. Functions imply normative expectations: traits *ought* to perform certain activities under typical conditions.  
  1.5. Functional explanations inherently involve counterfactual reasoning (e.g., "If trait T lacked effect E, system S would fail to exhibit capacity C").  
  1.6. Functions are typically attributed to parts (e.g., organs, molecules) within the context of a containing system (e.g., organism, cell).  

  ---

  **2. Table of Residual Disagreements**  
  | Crux                                                                 | Selected-Effects (SE) Position                                                                 | Causal-Role (CR) Position                                                                 | Jointly Accepted Bearing Case                                                                                                                           | SE Prediction                                                                 | CR Prediction                                                                |  
  |----------------------------------------------------------------------|------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------|-------------------------------------------------------------------------------|  
  | **1. Can a trait with the right causal profile but no selection history have a function?** | Functions *require* a history of natural selection; novel or non-historical traits lack functions. | Functions arise from current causal contributions to a system’s capacities; history is unnecessary. | **Case A: Spontaneous duplicate organism** (identical to a biological organism but arising by chance). **Case D: Synthetic reversed-chirality cell** (lab-created, no selection history, no ecology). | No function: Traits mimic functions but lack proper history.                 | Functions present: Causal roles in self-maintenance (e.g., metabolism) suffice. |  
  | **2. Does relativizing functions to explanatory projects allow CR to non-arbitrarily identify "the right" capacities?** | Relativization risks circularity; projects can be gerrymandered to make any effect "functional." | Capacities are fixed by stable, empirically grounded explanatory goals (e.g., survival in physiology). | **Case E: Somatic mutation** (enhances clonal proliferation but harms tissue function).                                                                 | CR cannot objectively privilege organism over clone as "the system."          | Functions are relativized to systems; biologists routinely select systems (e.g., organism) contextually. |  
  | **3. Can SE define malfunction non-circularly?**                     | Malfunction occurs when a trait fails to perform the effect for which it was *selected*.         | SE requires knowing the "selected effect" to identify malfunction, risking circularity. | **Case C: Old trait co-opted for new effect** (e.g., feathers initially for insulation, later for flight).                                                | Malfunction defined against *current* selected effect.                         | SE conflates historical norms with current norms; malfunction is failure in current causal role. |  
  | **4. What is the relevant historical unit?**                         | History must involve selection operating on lineages (e.g., genes, organisms).                  | History is secondary, but if invoked, units vary contextually (e.g., genes in genetics, organisms in anatomy). | **Case B: Trait conferring advantage pre-selection. Case F: Rewired gene** (selected for F for 100My, now retained for G). **Case E: Somatic mutation**. | Selection acts on organism lineages; somatic changes lack relevant history. | History’s unit depends on explanatory context (e.g., somatic changes matter in oncology). |  
  | **5. Are unselected by-products functional?**                        | By-products (e.g., heart sounds) lack functions *even if* they become causally useful later.   | If a by-product stably contributes to a system’s capacity, it gains a function.          | **Case G: Unselected by-product** (e.g., bird bones’ hollow structure aiding flight, initially an adaptation for lightness).                             | No function until selected.                                                   | Function arises when causal role becomes explanatorily salient.              |  

  ---

  ### Commentary for the Seminar Instructor  
  *(Addressed solely to you, not for signature by collaborators)*  

  **Substantive vs. Verbal Elements:**  
  - **Substantive:** The core disagreement is whether historical selection is *necessary* for function attribution (Crux 1). This informs all cases (e.g., the synthetic cell). SE *must* deny functions without history; CR *must* affirm them. This is a genuine empirical divergence: e.g., whether molecular biology *requires* evolutionary context.  
  - **Verbal/Nuanced:** Disputes over "malfunction" (Crux 3) and "units" (Crux 4) may reflect differing explanatory priorities. SE ties malfunction to historical norms (*must* accept this), while CR ties it to current systemic norms (*tends to* reject historical constraints). This is partly terminological—e.g., whether "function" implies "designed for."  

  **One Concept or Two?**  
  The accounts are best understood as *competing analyses of a single folk-biological concept*, but they track distinct scientific needs. SE (*must* prioritize etiology) aligns with evolutionary explanations; CR (*must* prioritize systemic analysis) suits physiology. Biology uses both, often without conflict—e.g., heart pumping is both selected and causally necessary. Conflicts arise in edge cases (e.g., synthetic systems), revealing the concepts’ distinct anchors.  

  **What Could Change Minds?**  
  Both parties *could agree in advance* that the following would challenge their positions:  
  1. **SE Theorist:** Widespread, theory-neutral use of "function" for causally critical traits in ahistorical contexts (e.g., synthetic biology labs attributing "functions" to designed traits without selection).  
  2. **CR Theorist:** Consistent failure of purely systemic criteria to exclude intuitively non-functional traits (e.g., if pathologists began calling cancer mutations "functional" for clones without pushback).  
  3. **Both:** Empirical evidence that biologists *treat* historical and ahistorical function attributions as incommensurable (e.g., if "selected function" and "causal role" become standardized distinct terms in textbooks).  

  The synthetic cell (Case D) and rewired gene (Case F) are particularly high-stakes: if both parties agree the synthetic cell’s traits *should* (or should not) be called functional, it forces conceptual revision. The somatic mutation case (E) tests the flexibility of both frameworks in multi-level systems.  

  ---  
  This template forces explicit, testable commitments while respecting both traditions’ core insights. The cases are framed to prevent either side from dismissing them as "not real biology," and the agreed-upon section ensures common ground. I recommend requiring collaborators to fill in the "Predictions" column *before* debating the cases.
