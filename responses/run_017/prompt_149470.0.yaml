prompt: |-
  I'm in this very casual political philosophy reading group — me, a friend who's in a philosophy PhD program, and two people who basically just show up to argue — and last week we got completely stuck on the Mignonette case, so now I want someone to sort it out for me. The facts, as best I remember them (correct me if I've got any wrong, but please don't build anything on details I might have mangled): in July 1884 the yacht Mignonette sank in a gale somewhere around 700 miles from the nearest land, and four men ended up in a thirteen-foot open boat with two tins of turnips and no fresh water — the captain Tom Dudley, Edwin Stephens, Edmund Brooks, and Richard Parker, a seventeen-year-old cabin boy. Roughly twenty days in, with everyone starving, drinking their own urine, Parker ill from having drunk seawater and possibly half-comatose, Dudley and Stephens killed him: there had been talk of drawing lots, Brooks wouldn't agree, and in the end they just picked Parker. The three survivors ate him for about four days until they were picked up. They were convicted of murder, the court holding that necessity is no defence to murder, and I believe the death sentence was commuted to six months, though I may be mixing that up with something else.

  What I definately want is an analysis of that episode through the lens of the seperateness of persons objection to utilitarianism — the Rawls-ish idea that adding up gains and losses across different people treats several lives as if they were one life, and that this is the deep mistake in utilitarianism, rather than anything about pleasure or happiness being the wrong currency. And I want the mapping done carefully, because I think our group was conflating at least three different complaints: that you may not aggregate across lives at all, that you may not kill or use an innocent person who hasn't consented even when doing so maximises the sum, and that you may not distribute the risk unfairly by quietly picking on the weakest guy instead of randomising. Those give different verdicts on Dudley and Stephens. In particular, tell me what each reading says about two variants: the counterfactual where they do draw lots properly and Parker loses, and the counterfactual where nobody is killed and all four die. If a fair lottery dissolves the objection, then the objection looks procedural — about equal regard — and not really about aggregation, which is a much less interesting claim than people make it sound; and if the objection really does tell us to prefer four deaths to one killing, I want to know whether that's a bullet the objector can bite or a reductio of the objection. Please also say what you make of Parker being young, sick, and likely to die first anyway — does that even register for a separateness-based view, or does caring about it quietly smuggle the aggregative reasoning back in?

  Then run it the other way: what does the case do to the theory? The law convicted them while the public largely sympathised and the sentence was cut down, and I'd like you to say which of those two reactions the objection is closer to and whether that's a point for or against it. Does the objection end up leaning on a doing-versus-allowing distinction — killing Parker as opposed to letting him die — that it officially has no use for? Is there anything here that the objection was simply never built to handle: that refusing to aggregate means everyone dies, that the victim was selected rather than chosen by chance, that this is a closed world of four people and not a society with institutions and baselines? Say where you think it goes silent rather than making it speak. One more thing that's nagging me: my PhD friend keeps insisting that if the boundary between persons is doing this much moral work, someone should explain why it is more load-bearing than the boundary between earlier and later stages of a single life, since we happily let one person trade present suffering for a greater future benefit and call that prudence rather than murder. That may be a bad argument and you can say so, but take it seriously enough to locate where it goes wrong, and tell me whether the Mignonette facts give you any purchase on it at all. Around a thousand words if you can, and please don't just rehearse the standard textbook statement of the objection — assume I've read that. Also tell me how confident you are in what you're claiming, and single out the claim you're least sure of, with a note on whether you're leaning on a contested reading of what the objection even says.
reasoning: |-
  Okay, the user is part of a casual political philosophy reading group that got stuck on the Mignonette case. They want an analysis through the lens of the separateness of persons objection to utilitarianism. Specifically, they want to untangle three different complaints they think their group conflated: aggregation across lives, killing innocents without consent, and unfair risk distribution. They also want this applied to two counterfactuals: drawing lots fairly and no killing leading to all four dying. Plus, there are deeper questions about whether caring about Parker's vulnerability smuggles in aggregation, how the objection handles doing vs. allowing, and the PhD friend's point about personal identity over time.

  First, I need to recall the separateness of persons objection. Rawls argues that utilitarianism treats society as a single entity, summing utilities across individuals, which ignores the distinctness of each person's rights and interests. For the Mignonette case, this means sacrificing Parker for the greater good violates his individual rights, regardless of the net benefit.

  The user mentioned three conflated complaints. I should separate them clearly. The first is the core aggregation issue—whether summing gains/losses across persons is inherently wrong. The second is the prohibition against killing innocents without consent. The third is procedural fairness in risk distribution. Each gives different verdicts. For example, if drawing lots makes it acceptable, then the objection is more about consent or fairness than aggregation itself. But if even a fair lottery is wrong, then it's a stronger stance against any killing.

  Applying this to the counterfactuals: In the lottery scenario, if Parker consents and loses, the objection might still hold because it's still killing an innocent. But if consent is key, maybe it's permissible. The user is right that if a fair lottery dissolves the objection, it's more about procedural fairness than the core separateness argument. That weakens the objection's weight. On the other hand, if the objection demands letting all four die, that seems counterintuitive, which might be a reductio against it.

  Parker's vulnerability—being young, sick, likely to die first. From a separateness view, this shouldn't matter because individual rights are inviolable. But if the objection considers his lesser chance of survival, that might sneak aggregation back in. Need to point out that any such consideration compromises the purity of the separateness argument.

  Next, how the objection aligns with legal vs. public reaction. The law convicted them, reflecting a deontological stance (rights violation), while public sympathy might be utilitarian. The separateness objection is closer to the legal view, which could be a point in its favor for prioritizing individual rights, but the commuted sentence shows practical leniency, which the objection doesn't address.

  Doing vs. allowing: The objection might implicitly rely on this distinction. Killing Parker is active harm, whereas letting all die is passive. But utilitarians reject this distinction. The separateness objection doesn't inherently use it, but in practice, it might. The case highlights that without aggregation, the only option is non-intervention, leading to all deaths. This could be a weakness if the objection can't handle such extreme scenarios.

  The PhD friend's point about personal identity over time. We allow individuals to sacrifice present for future benefits (prudence), so why not across persons? The response is that personal identity has psychological continuity, which inter-personal boundaries lack. Sacrificing for one's own future is different because it's the same person's interests. The Mignonette case doesn't directly address this, but it shows that inter-personal sacrifices involve violating distinct rights.

  The user's deeper needs: They want clarity on the philosophical distinctions, especially to resolve group confusion. They might also be seeking whether the separateness objection holds up in extreme cases or if it leads to untenable conclusions. Unspoken could be a desire to understand if deontology can handle real-life dilemmas without collapsing into utilitarianism. They might also want validation of their suspicion that focusing on procedural fairness weakens the objection's core argument.
answer: |-
  Here’s a systematic analysis of the *Mignonette* case through the separateness-of-persons objection (SPO), addressing your queries and disentangling the three conflated complaints. I’ll proceed stepwise, flagging confidence levels and contested interpretations.  

  ---

  ### **Core of the Separateness-of-Persons Objection (SPO)**  
  The SPO (Rawls, Nozick) holds that utilitarianism fails by treating society as a "single person" (aggregating welfare across individuals), thereby violating the moral inviolability of individuals. Unlike intrapersonal tradeoffs (e.g., enduring pain for future gain), interpersonal tradeoffs treat distinct lives as fungible. **Key implication:** Sacrificing one for the greater good is impermissible, even if net utility increases.  

  ---

  ### **Mapping the Three Complaints to *Mignonette***  
  1. **No Aggregation Across Lives** (The core SPO):  
     - **Verdict on actual case:** Killing Parker is murder. The gain to three survivors does not offset Parker’s loss, as his life isn’t tradeable for others’ welfare.  
     - **Counterfactual 1 (Fair lottery):** Still impermissible. A lottery only distributes injustice; it doesn’t negate the fundamental wrong of sacrificing one person for others.  
     - **Counterfactual 2 (All four die):** Morally preferable to killing. The SPO demands non-violation of persons, even at catastrophic cost.  
     - **Parker’s vulnerability:** Irrelevant. His youth/sickness might reduce *aggregated* utility loss, but SPO rejects this calculus. Caring about it *does* smuggle in aggregation.  
     - **Confidence:** High (directly from Rawls/Nozick).  

  2. **No Killing/Using Innocents Without Consent**:  
     - **Verdict on actual case:** Impermissible (Parker didn’t consent).  
     - **Fair lottery:** *Potentially* permissible if Parker consents to the lottery. Consent transforms the act from "using" to "cooperative sacrifice."  
     - **All four die:** Required if consent is absent.  
     - **Parker’s vulnerability:** Weakly relevant. Coercion concerns heighten if he’s unable to consent (e.g., comatose), but the core issue remains consent.  
     - **Confidence:** Medium (SPO + Kantian elements; consent isn’t SPO’s focus but often annexed).  

  3. **Unfair Risk Distribution**:  
     - **Verdict on actual case:** Impermissible due to procedural injustice (targeting the weak).  
     - **Fair lottery:** Permissible. Fairness legitimizes the outcome.  
     - **All four die:** Avoidable if a fair lottery is held.  
     - **Parker’s vulnerability:** Central. Selecting him due to weakness compounds the wrong.  
     - **Confidence:** Low (This is a *distinct* procedural objection; SPO proper cares about violation, not distribution).  

  **Crucial Takeaway:** If a fair lottery dissolves the objection (as in #3), the core SPO (#1) is *not* driving the critique—it’s weaker procedural concerns. The SPO’s radical edge is insisting that even a consented/fair killing is wrong if it treats Parker as a means. **Is preferring four deaths a reductio?** For SPO, it’s a defensible bullet: letting die ≠ killing, and moral boundaries trump outcomes.  

  ---

  ### **What the Case Does to the Theory**  
  - **Legal vs. Public Reaction:**  
    - The law’s conviction aligns with SPO (rights are non-negotiable). Public sympathy reflects utilitarianism (net lives saved = justified).  
    - **SPO’s Proximity:** Closer to the legal view. The commuted sentence is pragmatic mercy, not moral endorsement—consistent with SPO’s absolutism on principle but accommodation of human frailty.  
  - **Doing vs. Allowing Distinction:**  
    - SPO *implicitly relies* on this distinction. Killing Parker (doing) violates his separateness; letting all die (allowing) doesn’t actively violate anyone. Yet SPO officially rejects consequentialism, not this distinction. **Contested point:** Some SPO proponents (e.g., Nagel) embrace doing/allowing; others see it as an ad hoc graft.  
  - **Limitations of SPO:**  
    - **Closed Systems/No Institutions:** SPO struggles when no "just background" exists. In lifeboats, rights may become tragically incompatible. SPO "goes silent" here—it forbids killing but lacks resources to resolve the dilemma.  
    - **Extinction Dilemma:** If refusing to aggregate *always* leads to worse outcomes (e.g., humanity dies), SPO appears self-defeating. Rawlsians might invoke "strains of commitment," but this is underdeveloped.  

  ---

  ### **The Personal Identity Challenge**  
  Your PhD friend’s argument: If intrapersonal tradeoffs (e.g., suffering now for future health) are prudent, why can’t interpersonal tradeoffs be just?  
  - **Response:**  
    1. **Psychological Continuity:** A person’s future self has a stake in their present suffering (it’s *their* future). Parker has no stake in others’ survival.  
    2. **Rights Violation:** Prudence doesn’t violate rights; killing Parker does. The SPO rests on *moral boundaries*, not metaphysical ones.  
    3. **Mignonette’s Relevance:** Parker’s impending death doesn’t negate his current right to life. "He’d die anyway" is a utilitarian rationale—SPO rejects it.  
  - **Weakness:** If personal identity reduces to psychological connectedness (Parfit), the distinction blurs. However, SPO can still hold that *moral agency* requires treating persons as inviolable, regardless of identity metaphysics.  
  - **Confidence:** Medium (this is a live debate; SPO needs supplementary arguments).  

  ---

  ### **Least Confident Claim**  
  **That SPO can coherently reject the doing/allowing distinction.**  
  - Why: SPO’s strength is condemning aggregation, but in dilemmas like *Mignonette*, it risks collapsing into "letting die" permissiveness without a robust action/omission doctrine. Yet importing that distinction may betray its anti-consequentialist roots.  
  - Contested Reading: Some scholars (e.g., Scheffler) argue SPO *requires* doing/allowing; others (e.g., Kamm) deny this.  

  **Final Word:** The *Mignonette* case exposes SPO’s rigorism—it forbids killing Parker even in a fair lottery and even if all die. This isn’t a reductio but a feature: rights are trumps. Yet in extreme scenarios, SPO feels descriptively inadequate, revealing its roots in institutional contexts (Rawls) rather than raw emergencies. Its power lies in resisting moral calculation; its weakness in offering no positive resolution when rights conflict.  

  ---  
  **Summary of Verdicts**  
  | Scenario                 | Core SPO (No Aggregation) | No Killing Without Consent | Unfair Distribution |  
  |--------------------------|----------------------------|-----------------------------|----------------------|  
  | Actual Case (target Parker) | ✗ Murder                 | ✗ Murder (no consent)      | ✗ Unfair selection   |  
  | Fair Lottery (Parker loses) | ✗ Murder                 | △ Permissible *if* consented | ✓ Permissible        |  
  | No Killing (all die)       | Morally required         | Morally required           | N/A (no action taken) |
