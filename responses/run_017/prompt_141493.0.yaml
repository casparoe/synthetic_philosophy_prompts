  ### Activity Design: Aumann's Agreement Theorem Simulation

  #### **Core Setup**
  - **Groups**: 3 players per group (allows quick convergence; 4 if odd number).
  - **Materials**:
    - **Card decks**: 
      - **Deck A**: 2 red cards, 1 black card.
      - **Deck B**: 1 red card, 2 black cards.
    - **Coin** (to determine the world: Heads = World A, Tails = World B).
    - **Player sheets** (one per player, see below).
    - **Whiteboard** (for announcements).
    - **Poker chips** (for scoring, optional).
  - **Event of interest**: \(E\) = "World is A".
  - **Rounds**: 3–4 rounds of announcements per game, followed by world reveal.
  - **Scoring**: Use a quadratic scoring rule to incentivize honesty (e.g., if a player reports \(p\) and \(E\) is true, score = \(1 - (1-p)^2\); if false, \(1 - p^2\)). Track cumulative points with chips.

  ---

  ### **Game 1: Common Prior**
  #### **Steps**
  1. **Setup** (5 min):
     - Flip coin (secretly) to pick World (A or B). Shuffle corresponding deck.
     - Deal one card to each player. Players see their own card only.
     - **Common prior**: \(P(\text{World A}) = P(\text{World B}) = 0.5\).
     - **Player task**: Compute initial posterior \(P(E | \text{their card})\) using Bayes’ theorem.

  2. **Initial Calculations** (Player Sheet Guide):
     - **If you see red**:
       - \(P(E | \text{red}) = \frac{P(\text{red}|E)P(E)}{P(\text{red})} = \frac{(2/3)(0.5)}{(2/3)(0.5) + (1/3)(0.5)} = \frac{2/3}\).
     - **If you see black**:
       - \(P(E | \text{black}) = \frac{(1/3)(0.5)}{(1/3)(0.5) + (2/3)(0.5)} = \frac{1/3}\).

  3. **Announcement Rounds** (15 min):
     - **Round 1**: All players simultaneously write their posterior on the whiteboard.
     - **Update**: Players refine their information partition using others’ announcements.  
       *(Example: If Player 1 sees red and hears Player 2 report \(1/3\), they infer Player 2 saw black. Combined with their own card, they deduce the exact state.)*
     - **Rounds 2–3**: Repeat announcements. Posteriors converge to 0 or 1 in Round 2.
     - **Reveal world**: Award points via scoring rule.

  4. **Example States** (Run 2–3 trials):
     | World | Cards (P1,P2,P3) | Initial Posteriors | Converged Posterior |
     |-------|------------------|---------------------|----------------------|
     | A     | (R, R, B)        | (2/3, 2/3, 1/3)    | 1                   |
     | B     | (R, B, B)        | (2/3, 1/3, 1/3)    | 0                   |
     | A     | (R, B, R)        | (2/3, 1/3, 2/3)    | 1                   |

  ---

  ### **Game 2: Broken Prior Variant**
  #### **Setup**
  - **Secretly assign asymmetric priors**: 
    - Two players: \(P(E) = 0.5\).
    - One player (e.g., Player 3): \(P(E) = 0.8\).
  - **Use same decks/process as Game 1**.

  #### **Why Convergence Fails**
  - **Example**: World B, cards = (R, B, B).
    - **Player 1 (common prior, sees R)**: Reports \(2/3\).
    - **Player 2 (common prior, sees B)**: Reports \(1/3\).
    - **Player 3 (\(P(E)=0.8\), sees B)**: 
      - Computes \(P(E | \text{black}) = \frac{(1/3)(0.8)}{(1/3)(0.8) + (2/3)(0.2)} = \frac{2}{3}\).
    - **Announcements**: (2/3, 1/3, 2/3).
    - **Update fails**: Players cannot reconcile posters due to conflicting priors. Posteriors stall at non-consensus values.

  #### **Debrief Hook**
  - "Why didn’t beliefs converge? What assumption was violated?"  
    *(Leads to discussion: Broken common prior → no forced agreement.)*

  ---

  ### **No-Trade Moment**
  - **After convergence** (e.g., all agree \(E\) has probability 1):
    - Offer a trade: "I sell a ticket paying 100 chips if \(E\) is true, at price \(p \times 100\) (e.g., 100 chips if \(p=1\))."
  - **Expected behavior**: Risk-neutral players decline (indifferent). 
  - **Real reason to trade**: 
    - **Risk aversion** or **wealth effects** (e.g., a player with low chips might buy insurance at \(p=1\) if \(E\) is false). 
    - Illustrates: *Agreement on probability ≠ willingness to act* (links to no-trade theorems).

  ---

  ### **Debrief Structure** (30 min)
  1. **Map Game to Theorem**:
     - **State space**: 6 states (e.g., World A: 3 card permutations; World B: 3 permutations).
     - **Partitions**: Player \(i\)’s partition = cells defined by their card (e.g., "red" or "black").
     - **Common knowledge of posteriors**: Announcements refine partitions until no further refinement occurs.
     - **Why convergence stops**: At the meet of partitions (posteriors become common knowledge).

  2. **Limitations of the Game**:
     - Converges too fast (real processes may take more rounds).
     - Assumes rational updating (players may err in calculations).
     - "Common knowledge" is idealized (in reality, announcements are public but not instantly common knowledge).

  3. **Predictable Issues & Fixes**:
     - "Averaging numbers": Clarify this violates Bayesian updating—use scoring rule to penalize dishonesty.
     - "Refusal to update": Provide a calculation cheat sheet (e.g., "If you see red and hear P2 report \(x\), then...").
     - Arithmetic errors: Use fractions (not decimals) and pre-calculate examples.

  4. **Objection Handling**:
     - **"Real people aren’t perfect Bayesians!"**  
       - **Rebuttal 1**: The theorem is normative—it shows what *rational* agents must do.  
       - **Rebuttal 2**: Cite **Geanakoplos & Polemarchakis (1982)**: Convergence occurs in \(O(\log n)\) rounds even with bounded knowledge.  
         *(Example: Two agents with initial partitions of size \(n\) agree after \(\log n\) announcements.)*  
       - **Rebuttal 3**: In complex worlds, delays cause inefficiencies (e.g., speculative trade before agreement).

  ---

  ### **Player Sheet (Example)**
  ```markdown
  **Common Prior Rules**  
  - World A deck: 2 red, 1 black  
  - World B deck: 1 red, 2 black  
  - Prior: P(World A) = 0.5  

  **Your Card**: [R]  
  - P(E | red) = (2/3 * 0.5) / [(2/3*0.5) + (1/3*0.5)] = 2/3  

  **Announcement Rounds**:  
  1. Write your posterior on the board.  
  2. Update: Others' posters tell you their card. Recompute posterior.  
  3. Repeat until converged.  
  ```

  ---

  ### **Why This Works**
  - **Hands-on convergence**: Players *see* beliefs merge via announcements alone.
  - **Broken prior**: Hidden asymmetry causes failure—players discover why common priors matter.
  - **No-trade moment**: Reveals gaps between belief and action.
  - **Debrief depth**: Covers machinery, assumptions, and real-world constraints.  

  Run through 1–2 trials pre-workshop to smooth wrinkles. Good luck!
