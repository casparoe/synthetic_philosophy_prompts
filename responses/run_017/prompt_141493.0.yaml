      Given the time, we might not do the broken prior in the first run. We can have it as an advanced variant and carefully explain the setup.

      Alternatively, we can break the common prior by having the facilitator not use the same prior for everyone. But then we have to tell the players that they have been given a prior. We can give them prior cards that they don't share.

      We decide to skip the broken prior for now and focus on the main game and the no-trade part.

  #### No-Trade Moment

      After convergence, we want to offer a trade. The idea: we offer to buy a ticket that pays $1 if the world is A, at the converged probability p. 

      If they are risk-neutral and share the same probability, they should be indifferent. But we want to see if anyone wants to trade for other reasons.

      We can use points: each player starts with 100 points. We offer to sell a ticket that pays 100 points if the world is A, for a price of p * 100. Or we can use a scoring rule and then offer to trade.

      We can do:

        After convergence, we say: "I will now offer to trade. I will buy or sell a ticket that pays 1 chip (worth $0.10 or just points) if the world is A. I am willing to trade at price p (the converged probability)."

        Since they all agree that the probability is p, they should be indifferent. But if one of them is risk-averse, they might not want to trade. Or if they have different wealth levels.

      We can try to induce a trade by having one player be wealthier? But we haven't given them different wealth.

      Given the constraints, we might not be able to do it in the first activity. We can mention the no-trade theorem in the debrief.

  ### Summary of the Main Game

      - Groups of 3.
      - Materials: 
          - Two decks: 
              Deck A: 2 red cards, 1 black.
              Deck B: 1 red card, 2 black.
          - A coin to flip for the world (or a die).
      - Steps:
          1. Flip a coin: heads for world A, tails for world B. (Keep secret.)
          2. Shuffle the appropriate deck and deal one card to each player.
          3. Each player looks at their card and computes their posterior for the event E="world is A". 
          4. Round 1: All players announce their posterior simultaneously.
          5. Players update their posterior based on the announcements.
          6. Round 2: Announce again.
          7. If they haven't converged (they will have), do one more round.
          8. Reveal the world and discuss.

      We run this for a few states.

  ### Debrief

      - Map to the theorem:
          - State space: 6 states (3 for world A, 3 for world B).
          - Common prior: uniform over the 6 states? Or we can compute: each state has probability 1/6.
          - Information partition for player i: defined by the card they see. For example, player1 partitions the states into: 
               {A1, A2, B3} (if they see red) and {A3, B1, B2} (if they see black).
          - The event E: the world is A -> states A1, A2, A3.
          - The posterior: computed by conditioning.
          - Common knowledge of posteriors: after the first announcement, everyone knows everyone's posterior. This refines the information partition. In fact, it refines to the exact state (or a set that is a subset of the original partition and is common knowledge).

      - Why the process stops: because in this partition, the information is complete.

      - What the game can't reproduce: 
          - In general, the process might take more rounds, but in this small example it's fast.
          - We assumed that the announcements are common knowledge immediately. In reality, it might take time.

      - Predictable issues:
          - A player might not update correctly: we provide a worksheet with the update rules? Or we can have a cheat sheet with the initial posteriors and then the update rules.
          - Someone might average the numbers: we emphasize that they should update based on the meaning of the announcement (i.e., the other player's card).

      - Answer to "perfect Bayesian" objection:
          - We can mention that the theorem is about what rational agents must do. If they are rational and have a common prior, they cannot agree to disagree. 
          - There are results on how many rounds are needed: in general, for a finite state space, the process will converge in at most the number of states minus one rounds. 
          - Also, there are results showing that even with bounded rationality, similar phenomena occur.

      - The no-trade theorem: we can explain that if there is common knowledge of the posterior and common prior, then no trade is possible because both sides would only trade if they thought it was favorable, but they have the same assessment.

  ### Advanced: Broken Prior Variant

      We can try to run a variant where one player has a different prior. We tell two players that the prior is P(A)=1/2, and one player that P(A)=2/3. We run the same game.

      In state B3 (world B, cards: R, B, B):

          Player1 (P(A)=1/2): sees R -> posterior = 2/3.
          Player2 (P(A)=1/2): sees B -> posterior = 1/3.
          Player3 (P(A)=2/3): sees B -> 
              P(A|B) = [ (2/3)*(1/3) ] / [ (2/3)*(1/3) + (1/3)*(2/3) ] = (2/9) / (4/9) = 1/2.

          Announce: 2/3, 1/3, 1/2.

          Update:
            Player1: sees R. They know that with common prior, player2's announcement of 1/3 means they saw black. But player3's announcement of 1/2 is not consistent with any card under the common prior: 
                 If player3 sees red: they would say 2/3.
                 If player3 sees black: they would say 1/3.
            So they are stuck. They might not update? Or they might assume player3 made a mistake.

          We can instruct players to update using their own prior and assuming the others are using the common prior. Then Player1 might not be able to infer player3's card. So they might not update and stay at 2/3.

          Player2: similarly, sees B. They also see player3's 1/2 and are stuck. Stay at 1/3.

          Player3: sees B. They hear:
              Player1: 2/3 -> which in player3's prior means: 
                  In player3's prior: 
                    If player1 sees red: 
                       P(A|P1=R) = [ (2/3)*(1/3) ] / [ (2/3)*(1/3) + (1/3)*(2/3) ] = 1/2. 
                       But player1 announced 2/3, which is not 1/2. 
              Inconsistent.

          So they might not update.

          Then they announce again: 2/3, 1/3, 1/2.

          And they don't converge.

      This shows that without the common prior, the process might not converge.

      In the debrief, we can discuss the common prior assumption.

  ### Time Allocation

      - Introduction: 5 minutes
      - Main game: run 4 states, 5 minutes each -> 20 minutes
      - Variant (broken prior): 10 minutes (one state)
      - No-trade moment: after each convergence, you quickly offer to trade? But they are usually at 0 or 1, so it's clear. Maybe in the broken prior variant, they are not at extreme and we can offer. Or skip.
      - Debrief: 25 minutes

      Total: 60 minutes.

      Given the time, we might drop one state in the main game and do one broken prior state.

  ### Materials

      For the card game, we need:
          - For world A: two red cards, one black.
          - For world B: one red card, two black.
          - A way to choose the world (coin).
          - Envelopes or a screen so the facilitator can prepare the cards without showing the world.

      We can have the decks pre-made in envelopes for each world.

      For each group:
          - Envelope A: cards [R, R, B]
          - Envelope B: cards [R, B, B]

      The facilitator flips a coin, picks the envelope, shuffles the cards, and deals.

      Players have personal whiteboards to write their posterior and to display.

      We can use a scoreboard for points if we are scoring.

      For the broken prior, we give one player a note that says "Your prior is P(A)=2/3".

  ### Conclusion

      This design meets most of the requirements. It might be complex to run the first time, but it should illustrate the key points.
