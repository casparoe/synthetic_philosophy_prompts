  The activity should:
  - Involve groups of 3-4 players to allow multiple rounds of announcements.
  - Use physical materials: printed cards (for private signals and perhaps for the state of the world), poker chips or points on a whiteboard for tracking bets or scores.
  - Have a variant where the common prior is broken, leading to a failure of convergence, to illustrate the importance of the common prior.
  - Include an element that separates agreement on the probability from willingness to act (inspired by no-trade theorems).

  We'll design two games:

  1. **Main Game (Common Prior)**: 
     - A state of the world is drawn from a finite set. Each player receives a private signal (which defines their information partition). They start with a common prior over the states. The objective is to estimate the probability of a particular event (say, a coin being Heads). 
     - In each round, players simultaneously announce their current posterior probability. Then, they update based on the fact that everyone else announced their posterior (which provides information about the signals they received). 
     - The process continues until no one wants to change their announcement (convergence).

  2. **Variant (Broken Prior)**:
     - Similar setup, but one player (or some players) have a different prior. We want this to be hidden so that during the game, players don't know that the prior is broken. The failure of convergence should be a surprise that they have to explain.

