  Hmm, the core tension here is whether Lewis's framework can accommodate cases where people falsely believe others prefer the status quo. The professor wants students to debate if this breaks the common knowledge requirement, and what that implies for the theory's explanatory power. They also want students to discuss escape mechanisms - whether behavior change (Priya's 5% minority view) or preference revelation (professor's survey view) is more effective.

  The professor's frustrations are clear: they think students often parrot definitions without critical analysis. They want the question to punish surface-level answers and reward engagement with the lock-in paradox. The marking scheme must reflect this - probably by heavily weighting the "taking a stand" and "cost/implications" sections.

  For the model answer... I should avoid direct quotes since it's closed book. Need to reconstruct Lewis's conditions from memory: coordination problem, mutual preferences for conformity given others' actions, common knowledge of expectations. The lock-in challenge hinges on whether false beliefs about preferences violate the "common knowledge of preferences" aspect. 

  The escape mechanism debate is rich territory. Priya's behavioral tipping point vs the professor's epistemic solution creates perfect dialectic material. Should present both as live options before arguing for the epistemic view. The normativity gap about sanctioning rights is secondary but worth mentioning as a bonus complexity.

  For the question phrasing, it needs to force position-taking. Something like: "Does the lock-in case satisfy Lewis's conditions? What does your answer imply for the theory, and how would escape occur?" That covers all bases. The model answer should demonstrate how to weave the preference revelation mechanism into Lewis's behavior-focused framework - maybe through salience reinterpretation.

  Marking scheme must punish definition regurgitation. Top marks only for answers that: (1) correctly identify the common knowledge ambiguity, (2) take a clear stance, (3) articulate theoretical costs, (4) propose escape consistent with their stance, and (5) acknowledge normativity limitations. Typical fumbles: missing the preference belief error, or proposing escape mechanisms that contradict their own premises.

  A-grade differentiators: seeing that false beliefs might still count as common knowledge if they're mutually believed, or conversely that true preferences might not need to be common knowledge for coordination. Either way, they must notice this is where the theory flexes or breaks.
answer: |-
  Here’s a comprehensive exam package addressing your requirements, designed to push students into the lock-in convention debate while demanding critical engagement beyond Lewis’s basics.

  ---

  ### (1) Essay Question  
  **"Lewisian conventions are often described as self-sustaining due to common knowledge of expectations. Evaluate whether the 'lock-in convention' (as defined below) qualifies as a genuine Lewisian convention. If it does, explain why this exposes a limitation in Lewis’s framework for explaining norm persistence and change. If it does not, identify which condition fails and why this undermines the framework’s applicability to real-world norms. Finally, propose and defend a mechanism for escaping the lock-in, addressing whether behavioral change (e.g., a minority defecting) or preference revelation (e.g., a survey) is more effective."**  

  *[Exam sheet provides:]*  
  **Lock-in convention definition**: All in P do R in S; each prefers R given others do R (due to sanctions); nearly all prefer universal R* (40hr weeks) over R (70hr weeks); almost none know others prefer R* (each believes others genuinely like R).  
  **Lewisian convention paraphrase**: R is a convention in P if: (1) Everyone conforms to R; (2) Everyone believes others conform; (3) Everyone prefers to conform if others do (conditional preference); (4) Everyone knows (1)–(3) [common knowledge]; (5) R is arbitrary (an alternative R* could have served). Precedents/salience coordinate expectations in novel situations.  

  ---

  ### (2) Model Answer (700 words)  
  The lock-in convention appears to satisfy Lewis’s core conditions superficially but reveals critical ambiguities in the common knowledge requirement, ultimately challenging the framework’s explanatory power. While it qualifies as a convention *if* common knowledge is interpreted weakly, this exposes Lewis’s inability to explain dysfunctional persistence or predict change—forcing us to augment his behavior-focused model with preference revelation mechanisms for escape.  

  **Does the lock-in meet Lewis’s conditions?** The dispute hinges on condition (4): common knowledge. Lewis requires agents to know the *preferences and beliefs* sustaining the convention. Here, individuals falsely believe others *genuinely prefer R* (70hr weeks), when in reality, nearly all prefer R*. Condition (3) holds—each prefers R *given others’ actions* (due to sanctions)—but condition (4) is compromised if "knowing others’ preferences" is part of common knowledge. A strict reading fails: agents lack true mutual knowledge about preferences, mistaking grudging compliance for endorsement. However, a weaker reading—where common knowledge covers only *actions and conditional preferences* ("I prefer R if you do R") but not *intrinsic preferences* ("I wish we all did R*")—might permit classifying it as convention. This ambiguity is the crux.  

  **The cost of either verdict**:  
  - *If it qualifies*: Lewis’s framework accommodates exploitative or Pareto-inferior norms, but at the cost of *explanatory depth*. It cannot differentiate lock-ins from benign conventions (e.g., driving sides), nor explain why R persists when R* is universally preferred. The account becomes descriptively accurate but *predictively inert*—it offers no tools to anticipate collapse (since expectations are self-fulfilling regardless of hidden preferences).  
  - *If it fails*: The framework loses applicability to pervasive real-world norms where false belief sustains compliance (e.g., toxic productivity). If common knowledge requires transparent preferences, Lewisian conventions are rarer than presumed, and the theory neglects how *misinformation* perpetuates norms.  

  **Escaping the lock-in**: Lewis’s reliance on behavioral precedents (e.g., a minority defecting to R*) is insufficient. Priya’s 5% minority tipping point assumes others *correctly interpret* defection as a preference for R*, updating their expectations. But in lock-ins, agents initially see defectors as idiosyncratic (noise), not as signaling shared discontent. Expectations flip only if defection is *recognized as a precedent*—which requires prior suspicion that others dislike R. Without this, sanctions may intensify, reinforcing R.  

  By contrast, *preference revelation* (e.g., an anonymous survey showing 90% prefer R*) directly shatters false beliefs. Once it becomes known that others *also* prefer R*, conditional preferences shift: individuals now expect defection to spread, reducing sanction risks. This updates second-order expectations ("I know you know I prefer R*"), creating common knowledge of discontent. Lewis’s salience mechanism can *then* amplify this—R* gains salience as the "preferred alternative"—but the catalyst is epistemic, not behavioral.  

  **Normativity gap**: Lewis explains *reasons to conform* (avoiding sanctions) but not the *right to sanction*. Lock-ins highlight this: sanctions here enforce a disliked norm, lacking moral legitimacy. While Lewis *could* ground sanctioning rights in reciprocal expectations (e.g., "we all enforce R because we expect enforcement"), this circularity cannot justify why enforcing *harmful* lock-ins is acceptable.  

  In sum, the lock-in case strains Lewis by exposing the framework’s blindness to hidden preferences. Treating it as convention reveals Lewis’s limits in explaining change; rejecting it confines the theory to idealized transparency. Effective escape requires supplementing behavioral mechanisms with preference revelation—a move Lewis’s behaviorist foundations resist but real norm dynamics demand.  

  ---

  ### (3) Marking Scheme (out of 20)  
  **Must-hit moves**:  
  1. **Diagnose the common knowledge ambiguity** (4 marks):  
     - *Fumble*: Misses that false beliefs about preferences challenge condition (4).  
  2. **Take a stand & justify** (4 marks):  
     - *Fumble*: Claims it "obviously" qualifies/fails without engaging textual ambiguity.  
  3. **Articulate the cost to Lewis’s framework** (4 marks):  
     - *Fumble*: Only describes the case without linking to theoretical limitations (e.g., predictive power, scope).  
  4. **Propose escape & defend mechanism** (6 marks):  
     - *Fumble*: Suggests minority action *or* survey without comparing them/engaging updating challenges.  
  5. **Acknowledge normativity gap** (2 marks):  
     - *Fumble*: Ignores why sanctioning is problematic in lock-ins.  

  ---

  ### (4) A/B Differentiation  
  An **A answer** (16–20) resolves the common knowledge dilemma by *interpreting* Lewis—e.g., arguing whether intrinsic preferences are part of "conditional preference" in condition (3) or common knowledge in (4). It integrates escape mechanisms with Lewis’s tools (e.g., "surveys create salience for R*"), and notes how lock-ins exacerbate the sanctioning justification gap. A **B answer** (12–15) accurately restates the problem and Lewis’s conditions but offers superficial analysis (e.g., "common knowledge fails, so it’s not a convention"), proposes escape without addressing belief updating, or misses the normativity point entirely.  

  ---  
  This structure forces students to confront the lock-in’s implications head-on, rewards dialectical reasoning, and penalizes rote repetition—aligning with your goal to separate critical engagement from textbook recitation.
