prompt: |-
  Hey — I'm a backend engineer, no philosophy training past a couple of MOOCs, and I've been donating about 10% of my salary for a few years on the strength of the do-the-most-good-per-dollar idea. A friend of mine (philosophy minor, now a lawyer, annoyingly good at this stuff) walked me through the argument below and I've been chewing on it for a week and can't find where it breaks.

  (1) What you ought to do depends on the difference your action makes — compare what happens if you do it against what would have happened if you didn't.
  (2) So the right place to put money is wherever the next dollar does the most good.
  (3) Any number you have for good-per-dollar comes from evidence, and evidence is way easier to collect for some kinds of effect than others: short-run, local, countable, randomized-trial-able effects versus long-run, dispersed, systemic ones. This is not a claim about which interventions are actually better.
  (4) So the measured numbers systematically tilt toward the measurable kind of intervention and away from the systemic kind, regardless of which one really does more good. (This is the thing people call measurability bias, and it's the bit I find hardest to argue with — it feels like basic garbage-in-garbage-out.)
  (5) If the inputs to a ranking are distorted in a known direction, then coming out on top of that ranking isn't evidence that you're actually on top. So the measured best option gives you no reason to think it's the best option.
  (6) And you can't repair this by adjusting the numbers, because any adjustment has to be estimated from the same lopsided evidence base you're trying to correct — you'd be using the biased instrument to calibrate itself.
  (7) You can't duck it by refusing to rank and just picking something robustly good either, since deciding what counts as robust is itself a judgment made on that same skewed evidence.
  (8) Nothing in (3) through (7) is specific to donating. Career choice, voting, whether to start a nonprofit, whether to have kids and how to raise them — every one of those needs you to estimate consequences under exactly the same distortion.
  (9) So for basically any decision in front of you, you have no reason to think the option that looks best is best.
  (10) That can't be right. Some comparisons are fine: money on bednets versus money in a bonfire, a job at a malaria org versus a career of deliberately infecting people with malaria. Whatever is wrong with this argument, it isn't that.

  Which step is the bug? I'm attached to (1) and to the bit in (10), so if something has to go I'd rather it go in the middle. But I specifically want three things: what makes the broken step look like a legal inference when it isn't (my instinct is that it's some kind of scope or quantifier slip — the argument sneaks from can't rank precisely to can't rank at all — but I can't locate the exact seam); what each of the other candidate rejections would cost me; and whether the measurability critique survives in any useful form once the bug is fixed, or whether it turns out to apply to a much narrower class of comparisons than people deploy it against.

  Second thing, and this is why I'm more suspicious rather than less: she has a second version that doesn't mention measurability at all and lands in the same place.

  (a) The outcomes that movement tries to buy — disease burden, poverty — are produced by institutions and political economy, not by marginal donations.
  (b) So a single donation is like a single vote: the probability it changes any outcome is approximately zero.
  (c) If the expected difference your action makes is approximately zero, it doesn't matter what you do with the money.
  (d) But the same holds for every individual's contribution to institutional change — protests, research careers, organizing — since nobody is pivotal on their own.
  (e) So nobody has any consequentialist reason to do anything.

  Two arguments with totally different middles arriving at the same absurd conclusion makes me think the bug is in something they share, not in (3)-(7) or (a)-(d). Is it (1)? If so, what replaces it — is there a nearby principle that still supports the ranking stuff without generating this, or does the whole consequentialist framing of giving come apart? And concretely: I've organised my career around earning to give. I don't need reassurance, I want to know what the cleaned-up version of the argument actually supports and what it doesn't, so I can tell whether my plan rests on something the argument can't touch or on something it quietly ate.
reasoning: |-
  Okay, let me tackle this backend engineer's problem. They've been donating based on effective altruism principles but their philosophy-savvy friend presented two arguments leading to paralysis. The core issue is both arguments conclude we can't know if any action is good, which feels absurd.

  First, I need to unpack Argument 1 about measurability bias. The key steps are:
  - We should act where marginal impact is highest (premise 1)
  - But impact measurements favor measurable interventions (3-4)
  - This distorts rankings so we can't trust "best" options (5)
  - Can't correct the bias because evidence is flawed (6)
  - Even "robustly good" choices rely on skewed evidence (7)
  - Applies to all decisions (8)
  - Therefore we can't know what's best (9)

  The engineer suspects a quantifier error - confusing "can't measure precisely" with "can't measure at all". That seems right. The leap happens between step 5 and 9. Just because measurements aren't perfect doesn't mean they're useless. There's a Bayesian point here: imperfect evidence still updates our probabilities. For example, bednets vs bonfire isn't ambiguous despite measurement limitations.

  Then Argument 2 about pivotality:
  - Systemic change requires institutions, not individual actions (a)
  - Single actions have near-zero impact (b-c)
  - But institutional participation also has near-zero individual impact (d)
  - Therefore no consequentialist reason to act (e)

  This shares with Argument 1 the error of treating expected value as binary (pivotal/not) rather than probabilistic. In voting theory, even 1 in a million chance scaled by impact matters. The engineer's career choice demonstrates this - high salary multiplied by donation impact creates real expected value.

  Both arguments fail by demanding impossible certainty. In practice, we use comparative advantage: some actions clearly dominate others even with uncertainty. The measurability critique remains valid but becomes a caution about precision, not paralysis. We should:
  1. Acknowledge measurement limitations
  2. Seek robust second-best options
  3. Diversify across intervention types
  4. Invest in better measurement

  For the engineer's earning-to-give path, the critique suggests tempering overconfidence in impact estimates but doesn't invalidate the approach. The key is recognizing that "better than alternatives" suffices even if "best" is unknowable.
answer: |-
  You're wrestling with two powerful arguments that share a logical structure leading to paralysis. The good news: **the core bug is in step (1)**, specifically its implicit "pivotal agent" framing, and repairing it resolves both arguments without abandoning consequentialism. I'll break this down as requested: the bug's location, why it looks valid, costs of rejecting alternatives, measurability bias's valid scope, and implications for your career.

  ### 1. **The Bug: Step (1)'s Pivotal-Agent Assumption**
     - **What's wrong**: Premise (1) assumes actions should be evaluated *only* by whether *you alone* change the outcome ("pivotalness"). This treats impact as binary: either you single-handedly cause an outcome or do nothing. But most real-world actions (donations, voting, careers) operate in contexts where:
       - Outcomes are *probabilistic* (e.g., your donation increases the *chance* of a life saved).
       - Actions are *scalable* (e.g., funding bednets scales with dollars until saturation).
       - You act within a *population* of agents (e.g., malaria burden drops when *many* donate).
     - **Why it looks valid**: The "compare what happens if you do it vs. if you don't" phrasing seems like basic causal reasoning. But in systems with thresholds, partial contributions, or aggregate effects, your action *changes probabilities or scales outcomes* even if you aren't pivotal. For example:
       - Donating $4,000 to a bednet charity won't single-handedly "cause" a life to be saved, but it increases the *expected* lives saved by ~1 (given AMF's cost-effectiveness).
       - Voting likely won't swing an election, but it increases the *probability* your preferred candidate wins by a tiny, non-zero amount.

     This bug infects both arguments:
     - In **Argument 1 (measurability)**, step (5) claims distorted rankings provide "no reason" an intervention is best. But if impact is probabilistic/scalar, even biased evidence can indicate *relative* effectiveness (e.g., bednets clearly dominate bonfires).
     - In **Argument 2 (pivotality)**, step (b) assumes individual actions have "~zero" impact. But consequentialism cares about *expected value* (probability × magnitude), not pivotalness. Your donation has low *probability* of being pivotal but high *magnitude* if it is—and scalable interventions ensure non-pivotal actions still shift outcomes marginally.

  ### 2. **Why the Broken Step Looks Legit: Quantifier Slip**
     - The sleight-of-hand is a **scope error in quantifying impact**. Step (1) frames impact as "the difference *your action* makes," implying a discrete, isolated effect. But steps (3)-(7) and (a)-(d) shift to discussing *systemic* effects that depend on *many actions*. The argument conflates:
       - "I cannot measure *exactly* how much good I do" (true) →  
       - "I cannot know if my action does *any* good" (false).  
     - This is like saying: "Because I can't predict *which* lottery ticket will win, buying a ticket has ~zero expected value." But expected value is probabilistic: if a ticket costs $1 with a 1% chance of $200, its EV is +$1. Similarly, a donation might have a 5% chance of saving a life (EV = 0.05 lives) even if it's not pivotal.

  ### 3. **Costs of Rejecting Other Steps**
     | Step | Cost of Rejection | Why Keep It? |
     |------|-------------------|--------------|
     | (1) | Minimal. Requires refining, not abandoning. | Core consequentialist intuition survives. |
     | (3)-(4) | High. Measurability bias is real and empirically documented (e.g., education vs. policy advocacy). | Critical for humility in impact evaluation. |
     | (5)-(7) | Moderate. Rankings *can* be evidence, just not definitive proof. | Accepting them forces better error analysis. |
     | (8) | Low. The problem *does* generalize, but the fix applies everywhere. | Useful for consistency. |
     | (10) | Catastrophic. Abandoning clear comparisons undermines all practical ethics. | Bednets > bonfires must hold. |

  ### 4. **The Repaired Premise: Expected Marginal Value**
     Replace (1) with:  
     > **"What you ought to do depends on the *expected marginal value* of your action—the change in expected outcomes *given the actions of others*."**  
     
     This accounts for:  
     - **Scalability**: Your $X donation adds Y expected lives saved if the charity scales linearly.  
     - **Probabilistic impact**: Voting increases the chance of good policies by δ, where δ = 1/(number of voters needed to swing the outcome).  
     - **Comparative advantage**: Some actions (e.g., earning-to-give) have higher expected value *for you* given your skills.  

     This resolves both arguments:  
     - **Argument 1**: Measurability bias still distorts *precision*, but not *all* evidence. You can rank interventions using expected value estimates (with confidence intervals) and prioritize robust options (e.g., "bednets are 95% likely better than cash transfers").  
     - **Argument 2**: Individual actions have non-zero expected value if they shift probabilities or scale outcomes. Systemic change careers (e.g., policy advocacy) may have *higher* EV than donations if your skills suit them.  

  ### 5. **Measurability Bias: Valid Scope & Utility**
     The critique survives but applies narrowly:  
     - **Valid when**: Comparing interventions with *different evidence quality* (e.g., bednets vs. policy reform). It warns against overconfidence in "top-ranked" charities and favors diversification (e.g., allocate 80% to measurable health interventions, 20% to high-uncertainty systemic work).  
     - **Invalid for**:  
       - Clear ordinal rankings (bednets >> bonfires).  
       - Interventions with similar evidence quality (e.g., two malaria charities).  
       - Decisions where uncertainty is symmetric (e.g., career choices with equal data gaps).  
     - **Practical use**: Demands Bayesian humility—e.g., "AMF saves 1 life/$4k, but with 90% CI [1/$3k, 1/$10k]. Policy work might save 1 life/$1k or $∞; I'll split funding."

  ### 6. **Implications for Your Career**
     Your earning-to-give plan rests on **comparative advantage**, which the repaired argument *supports*:  
     - **Intact**: If your backend skills let you donate more than you could directly impact (e.g., $100k/year funding bednets ≈ 25 lives/year), this likely dominates becoming a low-impact field worker.  
     - **Refined by critique**:  
       - Measurability bias suggests donating *part* to systemic causes (e.g., AI safety if you buy the arguments) to hedge uncertainty.  
       - Pivotality concerns are moot—your donations fund *marginal* bednets, not whole programs.  
     - **Actionable check**: Use expected value models (e.g., 80,000 Hours' career calculator) comparing:  
       - Option A: Continue earning → donate → expected lives saved = X.  
       - Option B: Switch to direct work (e.g., at GiveWell) → impact = Y.  
       If X > Y (factoring in your fit), stick with earning-to-give.

  **In short**: The bug is treating impact as all-or-nothing. Fix it by evaluating *expected marginal value*, and both measurability bias and pivotality become manageable uncertainties—not roadblocks. Your plan is robust if your expected impact exceeds alternatives. Don't let perfect measurement be the enemy of the provably good.
