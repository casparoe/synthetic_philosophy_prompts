answer: |-
  ## Orwellian Clarity Procedure for Editorial Standards

  This procedure transforms Orwell's diagnosis into an ordered set of tests designed for speed and practicality. It prioritizes objective failures first, minimizes unnecessary interventions, and explicitly flags judgment calls and limitations. Each test must yield a definitive pass/fail or escalate/stop instruction.

  **Procedure Steps (Ordered Execution):**

  1.  **Test: Is it Verbatim Attribution?**
      *   **Action:** Check if the text is presented *as a direct quote* from a specific, named source (e.g., "The Prime Minister said: '...'", "[Document] states: '...'").
      *   **Sufficient Answer (PASS & STOP):** Yes, it is clearly and accurately attributed as a verbatim quotation.
      *   **Failure (CONTINUE):** No, it is not a verbatim quote; it is our own copy, paraphrased, or supplied text meant to be integrated into our narrative. *Failure Mode Bypassed: All. Verbatim quotes are sacrosanct for accuracy.*
      *   **Judgment Level:** Mechanical.

  2.  **Test: Agent Check (Targets Agentless Drift)**
      *   **Action:** Identify the main action verb(s). Ask: "Who or what *performs* this core action?" If the verb is passive ("was determined", "were injured"), ask "By whom/what?" If nominalized ("the handling of", "a review"), ask "Who handles? Who reviews?"
      *   **Sufficient Answer (PASS):** The agent (doer) is clearly stated *in the same sentence or the immediately preceding clear context* (e.g., "Police said emergency services were called").
      *   **Failure (REWRITE/ESCALATE):** The agent is missing, obscured by passive voice/nominalization, or vague ("it has been determined", "procedures occurred"). *Failure Mode: Agentless Drift.*
      *   **Escalation Point:** If the agent *must* be omitted for legal/security reasons (e.g., protecting a whistleblower), escalate to the Senior Duty Editor (SDE) with a brief note explaining the necessity. Otherwise, REWRITE to surface the agent. If unsure *why* the agent is missing, escalate to SDE.
      *   **Judgment Level:** Mostly mechanical (identifying agent/action is clear). Escalation decision is a judgment call based on known policies.

  3.  **Test: Empty Fluency / Deniability Check**
      *   **Action:** Read the sentence. Then ask: "What specific, concrete claim does this sentence *actually* make? Can I construct a simple, factual sentence that would *directly contradict* it?" Focus on the core proposition.
      *   **Sufficient Answer (PASS):** Yes, the sentence makes a concrete claim, and its direct contradiction is easily constructible and meaningful (e.g., Claim: "The refinery exploded." Contradiction: "The refinery did not explode.").
      *   **Failure (REWRITE):** No, the sentence is vague, platitudinous, or states an intention/process without substance. Its contradiction is either impossible, nonsensical, or equally vague (e.g., Claim: "We are committed to better outcomes." Contradiction: "We are not committed to better outcomes" – equally empty). *Failure Mode: Empty Fluency.*
      *   **Where Unreliable:** Unreliable for purely factual, non-judgmental statements without an implied claim (e.g., "The sky is blue"). Use cautiously with qualified statements ("may be" – contradiction is "is definitely not"). Focus on sentences purporting to convey action, commitment, or significant information.
      *   **Judgment Level:** Judgment call (assessing meaningfulness of contradiction). Requires critical reading.

  4.  **Test: Pre-Packaged Predicate Check**
      *   **Action:** Identify compound phrases, especially adjectives/nouns presenting conclusions (e.g., "robust and proportionate", "irregular migration", "better outcomes"). Ask: "Does this phrase bundle complex judgment/value claims into a single, seemingly objective term? Is it substituting jargon or euphemism for clear description?"
      *   **Sufficient Answer (PASS):** The phrase is either a) a precise, non-evaluative technical term essential to the subject (e.g., "quantum entanglement"), b) clearly attributed as the view of a source (even if within our copy, e.g., "Ministers described it as a 'robust and proportionate package'"), or c) sufficiently unpacked elsewhere in the text for the audience.
      *   **Failure (REWRITE/ESCALATE):** The phrase is an unexplained, conclusion-laden term (e.g., "better outcomes", "irregular migration" without context) used as our own framing. *Failure Mode: Pre-Packed Predicates.*
      *   **Escalation Point:** If the phrase is an official designation/term of art *and* the choice between using it verbatim or replacing it with a plainer term involves significant editorial judgment about neutrality or challenging euphemism (e.g., "collateral damage" vs. "civilian deaths"), escalate to the SDE for a policy decision. Otherwise, REWRITE to unpack the conclusion or use descriptive language. *This is a core values/position decision point.*
      *   **Judgment Level:** Judgment call (identifying loaded language). Escalation decision is a values call.

  5.  **Test: Scope Fog Check (Quantification/Hedges)**
      *   **Action:** Identify quantifiers ("a number of", "several", "many"), vague nouns ("concerns", "issues"), and hedges ("may have been", "potentially", "in respect of", "appears to"). Ask: "Is the imprecision justified *at this stage* by genuinely unknown facts or inherent uncertainty? Does the vagueness obscure accountability or evade a specific claim that *should* or *could* be made?"
      *   **Sufficient Answer (PASS & STOP):** Yes, the imprecision is justified (e.g., breaking news, inherent uncertainty in subject matter, protecting sources). The sentence provides the best available information without misleadingly implying false precision. *Failure Mode: Scope Fog (Justified).*
      *   **Failure (REWRITE):** No, the imprecision is unnecessary and obscures accountability or evades specificity that is known or reasonably expected (e.g., "a number of failures occurred" when the investigation report lists 5 specific failures). *Failure Mode: Scope Fog (Unjustified).*
      *   **Judgment Level:** Significant judgment call (weighing necessity of vagueness vs. evasion/obscurity). Requires context awareness.

  **What the Procedure Cannot Do:**
  1.  **Detect Lies or Ensure Truth:** It can make falsehoods clearer. Clarity exposes the lie but doesn't create truth. Fact-checking remains separate.
  2.  **Replace Subject Expertise:** Understanding technical terms or complex subjects requires knowledge beyond linguistic checks.
  3.  **Fix Fundamentally Broken Logic:** It catches unclear expression of ideas, not inherently illogical ones.
  4.  **Resolve Deep Ambiguity in Source Material:** If the original source is inherently ambiguous or contradictory, clarity edits can only reflect that, not resolve it.
  5.  **Override Legal/Policy Directives:** Specific mandated phrasings or blacklists still apply.
  6.  **Define "Barbarous":** Judging when breaking a rule is preferable remains a high-level editorial judgment.

  ---

  **Applying the Procedure to Examples:**

  **A. Our own copy:** "Following a thorough review of the incident, it has been determined that a number of procedural failures occurred in respect of the handling of the complaint."
  1.  **Verbatim?** No (our copy). CONTINUE.
  2.  **Agent Check:** FAIL. Core actions: "determined" (by whom?), "occurred" (procedures don't act, people fail). "Review" is nominalized (who reviewed?). Agentless drift clear.
  3.  **Outcome:** **REWRITE** (Failure at Step 2). *Rewrite Suggestion: "The [Name of Review Body/Person] reviewed the incident and determined that staff failed to follow complaint procedures in several ways."*

  **B. Verbatim quotation:** "Ministers are considering a robust and proportionate package of measures to address irregular migration."
  1.  **Verbatim?** Yes (explicitly a verbatim government statement). **PASS & STOP**.
  2.  **Outcome:** **LEAVE** (Stopped at Step 1).

  **C. Our own early wire copy:** "Emergency services say a number of people have been injured at the refinery."
  1.  **Verbatim?** No (our wire copy). CONTINUE.
  2.  **Agent Check:** PASS. Agent = "Emergency services" (stated as source of info). Action="say". The passive "have been injured" is acceptable as the info source attributes the *fact* of injuries, not the agent causing them.
  3.  **Empty Fluency?** PASS. Claim: Emergency services report injuries happened. Contradiction: "Emergency services say no one was injured" – meaningful contradiction.
  4.  **Pre-Packaged?** PASS. No significant loaded terms here.
  5.  **Scope Fog?** PASS (Justified). "A number of" is vague but *justified* in early breaking news where exact figures are likely unknown/unconfirmed. Insisting on a figure here could force inaccuracy. Vagueness does not obscure accountability (source is clear).
  6.  **Outcome:** **LEAVE** (Passed all applicable tests, Scope Fog justified).

  **D. Supplied text:** "Our department remains committed to delivering better outcomes for the communities we serve."
  1.  **Verbatim?** No (supplied text, to be integrated as our reporting). CONTINUE.
  2.  **Agent Check:** PASS. Agent = "Our department". Action = "remains committed".
  3.  **Empty Fluency?** FAIL. Core claim is "committed to better outcomes". Contradiction: "The department is not committed to better outcomes" – equally vague and uninformative. What does "committed" mean? What constitutes a "better outcome"? No concrete action or measurable standard is stated. Empty Fluency.
  4.  **Outcome:** **REWRITE** (Failure at Step 3). *Rewrite Suggestion: Focus on specifics. E.g., "The department says its new [Specific Program X] aims to reduce [Specific Problem Y] by [Target Z% or Timeframe]." If specifics are absent, question if the statement is newsworthy.*

  \answer{A: REWRITE; B: LEAVE; C: LEAVE; D: REWRITE}
