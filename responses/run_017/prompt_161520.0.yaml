prompt: |-
  I'm in a small reading group — half ML people, half philsophy grad students — and we've been going round on decision theory for embedded agents for something like two years now, with zero movement. Concretely: one camp thinks causal decision theory (or more loosely "just do expected-utility maximisation against the best model you've got") is basically fine and that Newcomb-style cases are cooked-up philosopher's toys where the predictor is doing something no real environment does; the other camp thinks those one-shot cases are the whole point, because an agent that's part of the world it's reasoning about — with other agents, the training process, its own sucessors, maybe copies of it elsewhere, all modelling it better than it models itself — lives in exactly that structure, so you need something like functional decision theory or updatelessness. The CDT-ish side's stock move is that in those cases your action "isn't really the cause" of the good outcome, so taking the money is fine; the FDT-ish side's stock move is that causation-talk is a heuristic that quietly assumes you're outside the thing being predicted, and that heuristic is precisely what breaks when you're embedded. We all agree on the cases and on what each rule says about them. Nobody budges. My hypothesis, which I've started calling the predictor gap, is that the real dispute isn't about decision rules at all: it's a factual disagreement about whether environments actually contain predictors accurate enough for the gap between the rules to matter, wearing normative clothing — and under that, a verbal fight about whether "rational" means something like coherence-with-your-best-model or something like getting-more-of-what-you-want. (My ML friends add a third option: don't do decision theory, just train the policy and let the loss sort it out.)

  So: diagnose the stall rather than settling it. Is my hypothesis close, and where's it wrong — is the verbal/ substantive split where I think it is, are the sides mabye answering different questions under one heading (what to build vs. what to admire vs. what to blame), or is a hidden formal question doing the work, like whether an embedded agent's model can even be true of its own environment? Support the diagnosis with what each side actually says, not a survey of the theories — I've read the standard ones, and I can't chase references right now, so please no reading lists or links. Then, given your diagnosis, say what would actually count as progress: a distinction, a formal result, a reframing of the question, an empirical check on how predictable real agents are — or tell me honestly that nothing is likely to move it and why. Lead with your diagnosis in one sentence, then argue for it, and flag the part you're least confident in. Under 600 words. And if the premise is wrong — if the "predictor gap" isn't a real fault line, or if this is just stalled on definitions in a boring way — say that plainly instead of answering the question I asked.
reasoning: |-
  Hmm, the user is describing a deep, years-long stalemate in their reading group between CDT and FDT advocates. They've proposed a "predictor gap" hypothesis - that the core disagreement is actually about whether real environments contain sufficiently accurate predictors to make the difference between decision theories matter. As DeepSeek, I need to diagnose why this debate is stuck without taking sides.

  First, I should validate their insight - the predictor gap is indeed a key fault line. The CDT camp dismisses Newcomb problems as unrealistic thought experiments because they don't believe predictors with near-perfect accuracy exist in practice. The FDT camp argues that embedded agents constantly face similar situations where other entities (like future selves or adversarial systems) can predict them accurately. This isn't just about definitions - it's a substantive disagreement about how the world works.

  But there's another layer underneath: fundamentally different conceptions of rationality. The CDT side sees rationality as about coherent reasoning with your current knowledge ("coherence-with-your-best-model"), while the FDT side sees it instrumentally as reliably getting desired outcomes ("getting-more-of-what-you-want"). This normative divide makes the groups talk past each other - they're not even disagreeing about the same thing.

  The ML contingent adds a third perspective by rejecting decision theory entirely in favor of trained policies, which highlights how the debate might be misframed for actual AI development. 

  Where I'm least confident is whether this normative/meta-level conflict is the primary blocker versus the empirical predictor question. Both seem deeply entangled.

  For progress, the group needs to shift focus from arguing theories to mapping where predictor accuracy actually matters. They could analyze real-world cases (like security settings or algorithmic coordination) where prediction capabilities create Newcomb-like dilemmas. Formal results showing performance gaps under bounded predictors might help, but the key is making the abstract disagreement concrete. If they can't find realistic scenarios where the theories meaningfully diverge, that would actually resolve the debate in CDT's favor.

  The group should also explicitly separate the "what is rational" question from "what to build" - these are different projects. Until they acknowledge they're having two distinct arguments (one empirical about predictors, one philosophical about rationality), they'll keep spinning their wheels.
answer: |-
  Here’s the diagnosis: **The stall stems from conflating *empirical disagreements about predictor realism* with *fundamentally distinct conceptions of rationality*, while mislocating the core normative conflict under causal-vs-functional language.**

  Your "predictor gap" identifies a critical empirical fault line: the ML/CDT camp doubts real environments (especially for practical AI) contain predictors accurate enough to create exploitable Newcomb-style dependencies ("philosopher's toys"), while the FDT camp insists embedded agents *always* face such dependencies (via training processes, adversarial agents, or self-prediction). This *is* substantive: CDT’s "it’s not *really* causing the outcome" relies on the predictor being fallible/exploitable in practice, while FDT treats near-perfect prediction as structurally inherent to embeddedness.  

  But beneath this lies the deeper, normative split you note: **"rationality-as-coherence" vs. "rationality-as-instrumental-success"**. When CDT says "maximize expected utility against your best *causal* model", they prioritize *internal consistency* with that model’s causal structure. Taking both boxes when dominance holds is "rational" even if it loses money, because it coheres with the model. FDT, by demanding the agent act as the *best version of itself* across possible worlds (updatelessness), prioritizes *outcome optimization* across counterfactuals. Losing money by two-boxing is *irrational* because a better decision rule wins more.  

  This normative divide is masked by causal/functional language. CDT’s "causation" isn’t just a heuristic; it’s the *defining feature* of their coherence requirement. FDT’s "function" isn’t just about embeddedness; it’s the *operationalization* of outcome-optimization. When FDT says "causation assumes externality", they’re rejecting CDT’s coherence norm, not just its metaphysics. The ML "train the policy" sidestep highlights this: it implicitly endorses outcome-optimization as the *only* relevant metric for building agents, making the normative debate seem academic.  

  **Where I’m least confident:** Whether the normative split is *primary* or a consequence of the empirical one (i.e., if predictors were proven universally perfect, would CDT adopt FDT’s norm?). I suspect the norms are foundational.  

  **For progress:**  
  1. **Decouple the questions:** Explicitly separate "Does predictor accuracy *in real systems* ever reach FDT-relevant levels?" (empirical, testable via ML/agent modeling) from "What *is* rationality: coherence or winning?" (normative, philosophical).  
  2. **Reframe around bounded predictors:** Instead of perfect predictors or "no predictors", analyze *how accurate* predictors must be for FDT to outperform CDT *by CDT’s own metric* (e.g., expected utility). Formal results here could force engagement.  
  3. **Build concrete embedded scenarios:** Design minimal computational models of agents-in-training or competing predictors where the theories diverge *without omnipotence*. If no such scenario feels "real", CDT wins; if it does, FDT gains ground.  
  4. **Accept pluralism:** Acknowledge that "rationality" serves different purposes (prescriptive programming vs. evaluative praise), and the theories answer different questions.  

  Without this disentanglement, empirical doubts (predictor gap) and normative commitments (coherence vs. winning) will keep talking past each other. The ML camp’s pragmatism might prevail, but if the goal is conceptual clarity, forcing the normative disagreement into the open is key.
