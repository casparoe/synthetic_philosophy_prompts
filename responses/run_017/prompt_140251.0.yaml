answer: |-
  ### Setup and Purpose
  The theory must model moral compromise as mutual gains-from-trade for parties with *incommensurable terminal values* (e.g., animal welfare vs. global health advocates on a nonprofit board). It must identify when a compromise is a *genuine improvement* by each party’s own lights—distinct from mere coexistence, surrender, or correct non-compromise—despite no common currency, no side payments (due to integrity concerns), and mutual respect but not endorsement of the other’s values. Crucially, it must output *determinate recommendations* for resource/stance divisions and explain the *source* of gains, while resisting strategic manipulation. The goal is a testable framework for when compromise creates value beyond pragmatic truce.

  ### The Requirements
  | Requirement | Motivating Case/Consideration | Status |
  |-------------|-------------------------------|--------|
  | **1. Distinguish from *Modus Vivendi***: Must separate genuine mutual gains from mere temporary truce where both tolerate but neither prefers the outcome. | Factions accept a budget but privately resent it as "least bad"; later, defection occurs when power shifts. | Non-negotiable |
  | **2. Distinguish from Epistemic Hedging**: Must clarify if uncertainty about the "true" values enables compromise, or if gains exist under full certainty of value incommensurability. | A board member wonders: "Am I backing this health program because it might *actually* be best for animals, or because it’s a trade?" | Non-negotiable (Status: Must model both, but gains-from-trade must not *rely* on hedging) |
  | **3. Model Integrity Tax**: Account for the disutility beyond outcome ranking from endorsing/legitimizing actions one deems morally wrong. Must resolve if non-trivial tax can coexist with net gains. | Animal faction feels complicit in "neglecting suffering" by funding bednets; health faction feels tainted by funding "lesser beings" over children. | Non-negotiable (Compatibility with gains is core) |
  | **4. No Shared Cardinalization**: Cannot assume interpersonally comparable utilities or a common metric (e.g., dollars, QALYs). | Money is unusable (selling principles is abhorrent); neither accepts the other’s core metric (animals saved vs. DALYs averted). | Non-negotiable |
  | **5. Determinacy**: Must specify a concrete division (e.g., budget shares, policy stance) under defined conditions. | Board deadlock requires actionable recommendation, not just "gains exist in theory." | Non-negotiable |
  | **6. Explain Source of Gains**: Must clarify *why* gains arise – e.g., diminishing returns vs. differing intensities across dimensions – predicting which mechanism applies. | Splitting difference on one policy (e.g., cage-free timeline) vs. trading concessions on separate policies (e.g., faster cages for more bednets). | Preference (But critical for applicability) |
  | **7. Robust to Strategic Misrepresentation**: Gains must not vanish if parties exaggerate preferences knowing others might do the same. | Animal faction overstates willingness to fund deworming to extract more on sanctuary grants. | Non-negotiable |

  ### Collisions
  The subset **No Shared Cardinalization + Determinacy + Robustness to Misrepresentation + Non-trivial Integrity Tax** is likely unsatisfiable. **No Cardinalization** precludes standard bargaining solutions (Nash, Kalai-Smorodinsky) requiring cardinal/comparable utilities. **Determinacy** demands a unique solution despite this. **Robustness** necessitates mechanisms immune to bluffing (e.g., using "diminishing returns" curves), but without cardinalization, verifying truthfulness is impossible. A **non-trivial Integrity Tax** exacerbates this: if the tax is high and private (known only to each actor), misrepresentation about its magnitude becomes irresistible, undermining robustness and determinacy. Dropping *any* one (e.g., allowing cardinalization, accepting indeterminacy, ignoring strategy, or trivializing integrity costs) admits solutions, but violates the core dilemma.

  ### The Load-Bearing Requirement
  **No Shared Cardinalization** is the prime exclusionary requirement. Dropping it instantly admits standard welfare economics (aggregate utility), bargaining theory (cardinal Nash bargains), or utilitarianism – all clearly inadequate here as they ignore incommensurability and the integrity taboo on side payments. It forces the theory to grapple with the fundamental problem: how to compare *and aggregate* welfare gains across distinct moral universes without a bridge currency. While other requirements (like Robustness) are stringent, cardinalization is the *sine qua non* – its absence defines the puzzle.

  ### Scorecard
  | Candidate Family | Key Deficits Against Requirements |
  |-------------------|-----------------------------------|
  | **Splitting the Difference** (e.g., 50/50 budget) | Fails **Explain Gains** (assumes convexity), fails **Robustness** (incentive to misstate midpoint), fails **Integrity Tax** (may force direct endorsement of "wrong" acts), fails **Distinguish Modus Vivendi** (often is one). |
  | **Log-Rolling / Turn-Taking** | Fares best on **Explain Gains** (leverages differing intensities). Struggles with **No Cardinalization** (requires comparing "issue strength" non-cardinally?), fails **Robustness** (incentive to overstate intensity on all issues), risks high **Integrity Tax** if trades involve core principles. |
  | **Jurisdictional Separation** (e.g., health controls X%, animals Y%) | Avoids some **Integrity Tax** (limited accountability). Fails **Determinacy** (how to split jurisdictions/authority?), often collapses to **Modus Vivendi**, fails **Explain Gains** (no trade mechanism), struggles with shared decisions. |
