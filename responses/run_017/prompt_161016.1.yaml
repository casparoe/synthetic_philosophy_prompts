prompt: |-
  My lab group is helping write the consent and care protocol for a trial of an implanted memory prosthesis — a device that records and plays back activity around the hippocampus, and that patients end up depending on the way the rest of us depend on a photo roll. The practical question we keep arguing about: is switching it off more like amputating part of someone's mind, or more like taking away their notebook? So before I read another paper on the extended mind, I want the spec: what would a theory of cognitive extension actually have to deliver to be usable for a decision like that — which cases it has to get right, which distinctions it can't collapse (extension of a process vs. of a vehicle, trusting vs. merely relying, cognition vs. mere information processing), which results about memory and neural plasticity it can't contradict? Put the case or consideration behind each requirement, and mark which ones are non-negotiable and which are just one camp's taste (no cognitive bloat, parity with internal processes, needing a history of calibration, and so on). Two wrinkles the standard examples don't cover and that I want the list to handle: (1) a wearable that doesn't retrieve your past at all but generates a plausible story when prompted, and that you later find yourself remembering — does extension require the device to track the truth, or is playing the functional role enough? (2) a device that works the very first time you touch it, versus one that only becomes coupled after months of training — does the history of coupling matter, or is extension a synchronic matter? Its not enough to just redefine cognition to include whatever happens to be coupled, either. Then say whether any two requirements on the list can't be met together (that's the part I care most about), and which single requirement excludes the most contenders. Skip scoring the actual views, I'll do that myself.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're part of a lab group working on a consent protocol for an implanted memory prosthesis. The big question is whether turning off the device is like amputating part of the mind or just taking away a notebook. They need a framework to evaluate theories of cognitive extension, especially for this device.

  First, I need to list what the theory must deliver. The user mentioned specific distinctions: extension of process vs. vehicle, trusting vs. relying, cognition vs. information processing. Also, the two wrinkles: a generative wearable and immediate vs. trained coupling. 

  I should identify non-negotiable requirements versus preferences. Non-negotiables might include avoiding cognitive bloat and handling neural plasticity. Preferences could be things like parity principle or history of calibration. 

  For the generative device, does truth matter or just functional role? The theory needs to address if the device must accurately record or if generating believable stories is enough. Also, for coupling, is history necessary or is synchronic coupling sufficient?

  Then, conflicts. Maybe integration vs. transparency? If the device is deeply integrated, it might not be transparent, which is a conflict. Or functional parity requiring external processes to match internal ones, which might not hold. 

  The user cares most about which requirements can't coexist. Also, which single requirement rules out most theories. For example, non-bloat might exclude many extended mind theories that are too inclusive.

  Need to ensure each requirement has a case behind it. For instance, the distinction between trusting and relying ties into the generative device—if the device fabricates memories, is it still part of cognition? Cases like Otto's notebook vs. the generative AI.

  Also, neural plasticity is crucial because the brain adapts to the implant. If turning it off causes damage, that's different from losing a notebook. The theory must account for that without contradicting neuroscience.

  Check the two wrinkles. For the generative device, if it creates false memories, does that count as extended cognition? The case here is whether functional role alone suffices or truth is needed. For coupling, immediate use vs. trained—does the history matter? Example: a new tool vs. one you've used for years.

  Potential conflicts: Deep Integration and Transparency might clash because deep integration could make the process opaque. Also, Functional Parity vs. Process Extension—insisting on parity might exclude processes that extend cognition but work differently internally.

  The single requirement that excludes most contenders could be Non-Bloat, as many theories might include too many external items as part of the mind. Or maybe Neural Compatibility, if a theory contradicts established plasticity findings.

  Make sure to skip scoring existing views. Focus on the framework and requirements. Structure the response with clear sections: must-haves, negotiables, cases, conflicts, and the single strictest requirement.
answer: |-
  Below is a specification for a theory of cognitive extension tailored to your memory prosthesis case, structured by requirements, their justifications, negotiability, and handling of your wrinkles. The focus is on **functional utility for ethical/clinical decisions**, not philosophical purity.

  ---

  ### **I. Non-Negotiable Requirements**  
  *(Must be addressed to avoid catastrophic misjudgment)*

  1. **Distinguish Extension of Cognitive *Process* vs. Mere Information Storage**  
     - **Case:** A notebook (storage) vs. the prosthesis seamlessly integrating recall/encoding.  
     - **Why:** Turning off a *process* extension risks disrupting real-time cognition (e.g., hippocampal-dependent decision-making). Mere storage loss (notebook) is recoverable.  
     - **Handles Wrinkle #1:** Generative devices must *participate in cognitive processing* (e.g., shaping memory formation), not just output data.

  2. **Explain Neural Plasticity & Dependence**  
     - **Case:** Brain atrophy in sensory deprivation vs. no neural change when losing a phone.  
     - **Why:** If the prosthesis causes hippocampal reorganization (e.g., offloading), disabling it may cause functional impairment akin to lesioning. Must align with neuroscience on neuroprosthetic adaptation.  
     - **Non-negotiable:** Contradicting plasticity evidence invalidates the theory for medical use.

  3. **Demarcate *Trusting* (Cognitive Integration) vs. *Relying* (Tool Use)**  
     - **Case:** Trusting GPS for navigation (embedded in spatial reasoning) vs. relying on a map (conscious consultation).  
     - **Why:** "Trust" implies automatic, pre-reflective integration. Disabling a trusted system may cause disorientation or executive overload; losing a tool requires conscious substitution.  
     - **Handles Wrinkle #1:** A generative device you *trust* (treat as autobiographical) is cognitively integrated; one you fact-check is not.

  4. **Avoid Cognitive Bloat**  
     - **Case:** Is Google "part of your mind" when you search? If yes, overextends "extension" to trivialize prosthesis harm.  
     - **Why:** Ethically untenable to equate severing an implant with deleting browser history. Must exclude ubiquitous tools.  
     - **Non-negotiable:** Over-inclusiveness makes the theory useless for risk assessment.

  ---

  ### **II. Negotiable Requirements**  
  *(Reflect theoretical preferences; impact prosthesis classification but not deal-breakers)*

  5. **Functional Parity (Internal/External Process Equivalence)**  
     - **Camp Taste:** Clark & Chalmers (Otto's notebook). Requires external processes to *functionally resemble* internal ones.  
     - **Prosthesis Impact:** Favors "amputation" if device performs biologically analogous encoding/recall.  
     - **Conflict Risk:** Rejects generative devices (Wrinkle #1) if fabrication ≠ natural memory.

  6. **History of Calibration/Feedback**  
     - **Camp Taste:** Requires extended learning for integration (e.g., Sutton's "cognitive practices").  
     - **Handles Wrinkle #2:** Synchronic coupling (immediate use) isn't extension; months of training are needed.  
     - **Why Matters:** If history is essential, disabling a synchronic device is "tool loss," not amputation.

  7. **Transparency (No Introspective Barrier)**  
     - **Camp Taste:** Trusted tools feel "invisible" (e.g., glasses).  
     - **Prosthesis Impact:** If users consciously "query" the device, it’s less integrated than seamless recall.  
     - **Wrinkle #1:** Generative devices may fail transparency if outputs feel synthetic.

  ---

  ### **III. Handling Your Wrinkles**
  - **Wrinkle #1 (Generative Device):**  
    - **Requirement:** The theory must specify if *truth-tracking* is necessary for extension.  
    - **Case:** A device generating *believable false memories* you internalize. Functional role (memory substitution) may suffice, but if "extension" requires ecological validity, fabrication excludes it.  
    - **Key Distinction:** Does it extend *cognition* (process) or merely alter *content* (information)?  

  - **Wrinkle #2 (Immediate vs. Trained Coupling):**  
    - **Requirement:** Must clarify if extension is synchronic (current coupling) or diachronic (requires history).  
    - **Case:** A brain-computer interface (BCI) working instantly vs. one needing neurofeedback training.  
    - **Ethical Impact:** If synchronic, disabling even a new device risks "amputation"; if diachronic, it’s safer to trial-disable early.

  ---

  ### **IV. Conflicts Between Requirements**
  1. **Functional Parity vs. Process Extension**  
     - **Conflict:** Insisting external processes *mirror* internal biology (parity) may exclude prostheses that extend cognition *differently* (e.g., generative AI).  
     - **Consequence:** A theory requiring strict parity might misclassify a highly integrated generative device as "not extended."  

  2. **Deep Integration vs. Transparency**  
     - **Conflict:** Deeply integrated systems (e.g., neural-like coupling) may become *opaque* (user can’t audit outputs). Transparency demands inspectability.  
     - **Consequence:** A theory valuing transparency might exclude a perfectly integrated but opaque prosthesis.  

  3. **Non-Bloat vs. Synchronic Coupling**  
     - **Conflict:** Permitting synchronic extension risks bloating (e.g., "my phone is my mind"). Requiring history prevents bloat but may underclassify fast-adapting implants.  

  ---

  ### **V. The Strictest Requirement**
  - **Non-Bloat + Neural Compatibility** excludes the most contenders.  
    - **Why:** Many theories (e.g., radical EM) fail non-bloat by overextending "mind." Others ignore neuroplasticity, claiming extension without biological embedding. Neural compatibility forces grounding in brain science, excluding purely functionalist accounts.  
    - **Impact:** Only theories that respect cognitive boundaries *and* brain-device coevolution survive—directly addressing the "amputation vs. tool loss" dilemma.

  ---

  ### **Summary for Your Protocol**
  - **For "amputation" risk:** Prioritize requirements 1–4. If the prosthesis shows evidence of rewiring hippocampal function (2), integrating into real-time cognition (1), and being trusted pre-reflectively (3), disabling it risks harm beyond tool loss.  
  - **For generative devices (Wrinkle #1):** Focus on process (not content) extension and trust. If the device *drives memory formation*, it’s closer to amputation.  
  - **For coupling (Wrinkle #2):** History matters if your theory requires calibration (6), but synchronic integration + plasticity (2) could suffice.  

  This framework lets you test theories against *your device’s empirical reality* (not abstract axioms), directly informing consent protocols. Prioritize neural evidence over philosophical intuition.
