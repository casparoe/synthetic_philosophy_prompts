answer: |-
  Here is the disciplined mapping and verdict under infinitarian aggregative consequentialism:

  **Decision-makers**: Sandia human-interference task force (early 1990s) as agents of the US Department of Energy.  
  **Option set**: {Physical markers (granite, spikes, earthworks), multilingual archives, folklore priesthood, biosemiotic species} – all variants parameterized by design persistence (N).  
  **Payoff-relevant outcome**: Binary intrusion event before waste decay (∼10⁴ years), causing radiological release. Success = sustained deterrence.  
  **Evidence**: Survival probabilities of cultural artifacts/institutions (unknowable beyond ∼10³ years), intrusion hazard models (unvalidated for deep time).  

  ---

  **1. Finite vs. Open-Ended Stakes**  
  Unequivocally open-ended. Any non-zero probability that the warning persists beyond 10⁴ years – influencing a future civilization's trajectory over unbounded time – generates divergent expected value. This holds even if persistence probability decays exponentially: a 10⁻¹⁰⁰ chance of affecting 10¹⁰⁰ future lives dominates finite costs. The fork depends on whether the warning *could* alter long-term value trajectories – which it could, by preventing civilizational collapse from radiological contamination. Empirical uncertainty about cultural half-lives doesn't bound the stakes; it makes them incalculable.  

  **2. Survival Curve Model**  
  *Model*: Costs C(N) ≈ kN (linear) or kN² (convex). Survival probability S(t) = e^(-λt) (exponential) vs. S(t) ∝ t^(-α) (power law). Expected benefit B(N) = ∫₀^∞ P(intrusion at t) × S(t) × V(t) dt, where V(t) = future value at risk.  
  *Verdict*:  
  - **Exponential decay (λ>0)**: B(N) converges. Interior optimum at N* where marginal cost = marginal benefit. Sensible but arbitrary.  
  - **Power-law decay (α≤1)**: B(N) diverges → infinitarian paralysis. No finite N is justifiable; spend unbounded resources.  
  - **Parameter audit**:  
    - α>1 vs. α≤1 flips paralysis on/off (unknowable).  
    - V(t) unbounded → paralysis unless bounded *ad hoc*.  
    - Intrusion rate modulates B(N) but doesn't resolve divergence.  
    - Discount rates >0 restore convergence but violate axioms.  
  *Suspicion confirmed*: Recommendation is arbitrary. Without arbitrary bounds (N_max, V_max), paralysis dominates for heavy-tailed persistence.  

  **3. Folklore Proposals**  
  Theory strictly ranks folklore/biosemiotics above physical markers. Why:  
  - Finite cost: Comparable to granite monuments.  
  - Unbounded upside: Non-zero P(priesthood survives 10⁶ years) >> P(granite understood 10⁶ years).  
  - Expected value: ∫V(t) dt diverges → any p>0 justifies cost.  
  *Internal repairs*:  
  - **Bounded utility**: Cap V(t) → restores physical markers' dominance. Cost: Abandons infinitarianism.  
  - **Variance penalties**: Penalize high-variance strategies → rejects folklore. Cost: Arbitrary penalty scale; undermines fanaticism.  
  - **Timid aggregation**: Ignore <ε-probability tail events → rejects folklore. Cost: ε is arbitrary; violates dominance.  
  No repair preserves infinitarianism without arbitrariness. Folklore's theoretical superiority indicts the theory.  

  **4. Return Path & Meta-Verdict**  
  The episode exposes:  
  - **Stewardship gap**: Infinitarianism cannot recommend "10,000-year responsibility" as a legible institutional norm. It forces either N=0 (paralysis) or N=∞ (fanaticism), rejecting bounded commitment.  
  - **Arbitrary sensitivity**: Outcomes pivot on unbounded duration vs. bounded populations vs. value-density – all ethically equivalent under aggregation but practically divergent.  
  - **Irreducible modesty**: Practitioners' 10⁴-year horizon was a *normative* choice (stewardship), not derived from convergence.  
  This is **anomalous** for infinitarianism: It fails to prescribe any action we recognize as responsible. The case is **evidence against** infinitarianism's coherence for institutional decision-making.  

  ---

  **Load-bearing claim**:  
  Infinitarian consequentialism cannot recommend any finite persistence horizon N for the WIPP markers because (1) if cultural memory decays exponentially, N is arbitrary but finite; if power-law, N must be infinite; and (2) the distinction hinges entirely on the unknowable tail behavior of institutional survival probabilities. The theory replaces engineering judgment with sensitivity to undecidable parameters.  

  **Strongest unresolved objection**:  
  That infinitarianism *correctly* forces acknowledgment of our radical uncertainty: When stakes are genuinely unbounded, refusing to choose N=∞ is itself an arbitrary act of myopia. Bounded stewardship is aesthetic preference, not ethical rigor. The theory's inability to prescribe is a feature – revealing the bankruptcy of cost-benefit analysis for deep time – not a bug. No internal repair escapes this.  

  ---  
  *This analysis assumes: no discounting, linear population growth, and V(t) proportional to future population. Relaxing these shifts thresholds but doesn't resolve core divergences.*
