answer: |-
  ### The Pattern and Its Name

  The pattern you've identified—comparing two gambles branch by branch (or state by state) when neither has a well-defined expected value, yielding a determinate ranking, and sometimes an unbounded improvement—does not have a single, universally established name in the literature. However, it is most closely related to the concept of **statewise dominance** (also known as **pointwise dominance** or **almost sure dominance**). This is the core "move" you describe. Below, I define it, distinguish it from related concepts, specify where it applies and where it breaks down, and address your specific questions.

  #### What It Is: Statewise Dominance
  - **Definition**: For two gambles \(X\) and \(Y\) defined on the same probability space (i.e., the same set of branches/outcomes with the same probabilities), \(X\) statewise dominates \(Y\) if, for every possible branch \(\omega\), \(X(\omega) \geq Y(\omega)\), and the inequality is strict for at least one branch. This means \(X\) is never worse than \(Y\) and strictly better in some cases, regardless of whether the expected values exist.
  - **The "Move"**: When neither \(X\) nor \(Y\) has a finite expected value due to issues like conditional convergence (as in your games A and B), you extract a verdict by:
    1. Comparing branch by branch to establish dominance (e.g., A dominates B because A is better or equal on every branch and strictly better on losing branches).
    2. Optionally, computing the branch-by-branch difference \(\Delta = X - Y\). If \(\Delta(\omega) \geq 0\) for all \(\omega\), with strict inequality for some, then:
       - \(\Delta\) has a well-defined expectation only if it converges absolutely (which it may not).
       - But crucially, because \(\Delta\) is non-negative, its expected value (if it exists) must be non-negative, and it cannot be rearranged to yield a different result—unlike the individual gambles. This makes the ranking robust against reordering.
  - **In Your Example**:
    - Holding B and switching to A: The improvement \(\Delta\) is 0 on winning branches (odd \(n\)) and \(2^n/n\) on losing branches (even \(n\)). Thus, \(\Delta \geq 0\) everywhere and positive on losing branches, so A statewise dominates B.
    - The probability-weighted improvement is \(\sum_{k=1}^{\infty} \frac{1}{2k} = \frac{1}{2} \sum_{k=1}^{\infty} \frac{1}{k}\), which diverges to \(+\infty\). This divergence to \(+\infty\) is "determinate" (no reordering can change it) because all terms are non-negative. Thus, the swap from B to A is worth any finite fee.

  #### What It Is Not
  - **Not Expected Value Maximization**: Expected value is undefined for both A and B individually (due to conditional convergence), so ranking them via expected value is impossible. Statewise dominance works without it.
  - **Not Stochastic Dominance**: First- or second-order stochastic dominance typically assumes finite expectations or well-defined distributions. Statewise dominance is stronger and does not require expectations to exist.
  - **Not the Original Puzzle's Curiosity**: The original game A exhibits conditional convergence (rearranging terms changes the sum), which is a known phenomenon (e.g., the Riemann rearrangement theorem applied to the alternating harmonic series). Statewise dominance avoids this by focusing on branch-by-branch comparison.
  - **Not a Utility-Based Ranking**: Utility functions (e.g., risk aversion) aren't needed here; the ranking is ordinal and based solely on outcomes in each state.
  - **Not Always Sufficient for Pricing**: Statewise dominance gives a ranking, but not necessarily a finite "value." When the improvement diverges, it only justifies "pay any finite fee" but does not assign a specific price.

  #### Where It Runs Out (Boundary Cases)
  Statewise dominance is a partial order—it provides a ranking only when one gamble is pointwise better. Here's where it applies and fails, based on your examples:
  - **When It Works (Firm Ranking)**:
    - **Dominance with Non-Negative Improvement**: As in B vs. A, where \(\Delta \geq 0\) for all branches. This yields a firm ranking: A is better than B. The improvement's expectation diverges to \(+\infty\), so any finite fee is justified for the swap.
    - **Finite Improvement**: As in your case with C (A minus a $1 fee). Here, C is statewise dominated by A (improvement is +$1 on every branch), and the expected improvement is finite (exactly $1). This yields a firm ranking and a finite "value" for the swap (pay less than $1 to benefit).
  - **When It Fails (No Ranking)**:
    - **No Dominance**: As in A vs. D (A with signs reversed). On winning branches, A is better; on losing branches, D is better. No statewise dominance exists, and branch-by-branch comparison yields no verdict. Lining up payoffs by size may flip the ranking depending on the order, reflecting the lack of dominance.
    - **No Common Probability Space**: If A and B are played with separate coins (different probability spaces), statewise comparison is impossible. The improvement cannot be defined branch by branch, and expectations remain undefined. (More on this below.)

  #### Summary of Boundary Cases
  | Situation                          | Statewise Dominance? | Improvement Expectation | Verdict                                                                 |
  |------------------------------------|----------------------|-------------------------|-------------------------------------------------------------------------|
  | B vs. A (your case)               | Yes (A dominates B) | Diverges to \(+\infty\) | Firm ranking; pay any finite fee to switch from B to A.                 |
  | C vs. A (A minus $1 fee)          | Yes (A dominates C) | Finite ($1)             | Firm ranking; swap worth exactly $1 (finite fee).                       |
  | A vs. D (signs reversed)          | No                  | Undefined               | No ranking; verdict depends on reordering.                              |
  | Separate coins for A and B        | Not applicable      | Undefined               | No comparison possible; no ranking.                                     |

  ### Answers to Your Specific Questions

  1. **Does the improvement's unbounded total count as a "value" in the same sense?**
     - **No, it is a different kind of object**. The "no value" for A or B refers to conditional convergence: their expected values are undefined and can be rearranged to any real number (or \(\pm\infty\)). In contrast, the improvement \(\Delta\) for B to A has all non-negative terms, so its expectation diverges deterministically to \(+\infty\). We can assign it an "infinite value" in the extended real numbers (\(+\infty\)), which is not subject to rearrangement. This is a stronger result than "no value"—it indicates a definite direction of divergence. However, it is not a finite value and cannot be used for pricing beyond "pay any finite fee."

  2. **Does the argument need the same coin?**
     - **Yes, the gambles must share the same probability space**. The branch-by-branch comparison requires a common set of states (e.g., the same coin toss sequence). If A and B are played with separate coins (independent trials), there is no common branch to compare. For example:
       - With separate coins, the improvement depends on two independent outcomes (e.g., B's \(n\) and A's \(m\)), so \(\Delta\) is not defined statewise.
       - The expected improvement becomes \(E[A] - E[B]\), but since both expectations are undefined, this is meaningless.
       - Thus, statewise dominance cannot be applied, and no ranking emerges. Your pattern only works with the same underlying uncertainty.

  3. **Which half of the second case (ranking vs. any-finite-fee) is fragile?**
     - **The ranking (statewise dominance) is robust**; it holds as long as \(X \geq Y\) pointwise with strict inequality somewhere. It does not depend on the magnitude of improvement or the existence of expectations.
     - **The "any-finite-fee" conclusion is fragile**; it depends on the improvement having a diverging expectation to \(+\infty\). If the improvement were bounded (e.g., capped at some maximum value), the expected improvement would be finite, and the justifiable fee would be bounded (e.g., pay up to that finite value). In your B-to-A swap, the improvement is unbounded (it grows with \(n\)), causing divergence. This is not inherent to statewise dominance—it is a consequence of the specific payoff structure.

  ### Carving Out the Concept: "Divergent Improvement under Statewise Dominance"
  Since no established term fully captures this, I propose defining it as follows:

  - **Name**: **Divergent Improvement under Statewise Dominance**
  - **Definition**: A situation where two gambles \(X\) and \(Y\) on the same probability space satisfy \(X\) statewise dominates \(Y\), and the improvement \(\Delta = X - Y\) has an expectation that diverges to \(+\infty\). This yields:
    - A firm ranking (\(X\) preferred to \(Y\)).
    - No finite "value" for the swap, but a recommendation to pay any finite fee for it.
    - Immunity to reordering issues because \(\Delta \geq 0\) everywhere.
  - **Boundary Cases**:
    - **Finite Improvement**: Statewise dominance holds, but \(\Delta\) has finite expectation. Yields a ranking and a finite fee (e.g., your C vs. A case).
    - **No Dominance**: No ranking possible; branch-by-branch comparison fails (e.g., A vs. D).
    - **Separate Probability Spaces**: No comparison possible; statewise dominance inapplicable.
  - **Key Insight**: The pattern arises when the individual gambles are "pathological" (no expected value) but their comparison is "well-behaved" due to non-negative differences. This is common in puzzles involving divergent series or heavy-tailed distributions, where statewise dominance provides a decision-theoretic escape hatch.

