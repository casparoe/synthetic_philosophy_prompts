  The user’s deeper concern seems to be whether deflationism can account for what makes truth distinct without smuggling in substantive elements. If functional roles are necessary, does that commit deflationism to a more robust view? And if normativity is tied to truth specifically, how does that fit with the schema? They might be worried that deflationism is either incomplete or tacitly non-deflationary.

  For the replies: the minimality argument doesn’t work because coextensive predicates can’t be compared extensionally. Explanatory priority might handle the "true and 2+2=4" case (since accepting instances requires extra knowledge), but "twue" sidesteps this by having immediate acceptance without functional use. Here, the deflationist must appeal to functional role—truth is the predicate used for generalization, endorsement, etc. But this risks making functional role essential, which might feel un-deflationary. The user needs to know if this move is defensible or a concession.

  Normativity adds another layer. If truth is the standard of belief, but co-schematic predicates are equivalent, why prefer truth? The deflationist could argue that truth’s functional role grounds its normativity—it’s because we use truth for endorsement that it becomes normative. But this circles back to functional role being key.

  The burden of proof: the co-schematic problem isn’t fatal but exposes that deflationism needs more than the schema—it needs functional role. If that’s compatible with deflationism (as a non-metaphysical, logical role), it might hold. Otherwise, it leans toward substantivism. Prosententialism might avoid this by treating "is true" as a prosentence, not a predicate, so no coextensive rivals. But the user might not want to switch theories mid-essay.

