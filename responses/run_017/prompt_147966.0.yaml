prompt: |-
  I convene a small graduate reading group on moral responsibility, and this term we spent eight weeks on Strawson's essay *Freedom and Resentment* alongside a stack of incompatibilist replies to it. Two of our members have now reached the point where they are, I think, re-running the same argument past each other: one of them has been defending her reading for a decade and has largely stopped finding his objections intelligible; he, in turn, is convinced she has quietly changed the subject. Her position, as she would state it: to be morally responsible is to be a fitting target of the reactive attitudes — resentment, gratitude, hurt feelings, forgiveness; these attitudes are partly constitutive of ordinary interpersonal relationships rather than optional additions to them; what makes them fitting is the quality of will an agent's conduct manifests, not the causal history of that will; and so the truth of determinism has no tendency to show that no one is ever responsible. His position, as he would state it: blame and punishment are deserved only if the agent is the ultimate source of her action in a way that causal determinism excludes, and in a way that any merely reasons-responsive mechanism she did not make excludes too; the reactive attitudes are real psychological phenomena with real social uses; and a notion of responsibility defined as fittingness to our attitudes can be satisfied by someone who deserves nothing at all, which is why it cannot be what we were arguing about.

  What I want from you is the joint statement these two should have produced instead of their eighth argument: a document both could sign. Give me, first, a numbered section of agreed claims — including what they agree about the reactive attitudes themselves (their phenomenology, their role in relationships, the way excuses that deny bad will operate), about what a satisfactory account would have to deliver, and about what the disagreement is *not* (neither takes determinism to have been established, neither holds the reactive attitudes to be pointless or optional in everyday life, and both accept Strawson's point that the participant stance and the objective stance are genuine alternatives we actually move between in particular cases). Then a table of the residual disagreements, one row each, with three columns: a neutral formulation, her preferred formulation, and his — each of which its own side would sign without wincing, and none of which is allowed to be vacuous or to win by insinuation. Then the cruxes: the sub-questions such that settling one would move at least one of them, and for each crux at least one fully specified case both would accept as bearing on it, together with each side's prediction recorded in advance, plus a note on what each side would count as a genuine cost to their own view if it went the other way.

  Three cruxes I suspect are doing the work, but add or substitute as you see fit. First, the desert question: does her fittingness carry anything beyond a claim about what it is coherent or useful for us to feel, and if it does, what in the account bears that weight? I suspect part of this crux is verbal and part is not — I want you to say which part is which and why, and to say plainly anywhere a formulation that looks like a compromise is actually empty. Second, the manipulation cases; please handle both of mine, which I have specified so that nobody needs to look anything up. In the Calibration study, a device is implanted in an agent without her knowledge and tuned so that her deliberations track the moral reasons better than they did before; she notices nothing, deliberates as she always has, and a year later reliably acts well for the reasons there are and is disposed to feel guilty when she does not. In the Vale study, a cohort of children is raised by caregivers trained to respond to conduct only in the objective-attitude mode — no resentment, no blame, no praise, no guilt-induction, only causal explanation, repair, and management — and, by hypothesis, the resulting adults are statistically indistinguishable from controls in their ability to recognize and act on moral reasons and in their rates of helping and rule-following, yet report no guilt, resentment, or gratitude, and no sense of their own conduct as morally up to them. For each: what does her account imply, and is Strawson's own claim about how deeply rooted the participant stance is hostage to an empirical prediction — what does she predict the Vale adults would do under stress, or inside a close relationship, or when genuinely wronged? What does his account imply, and if the Vale adults turn out to be perfectly decent people, does that tell against him or only against something he never claimed? Third, scope: how much of the disagreement survives if it is restricted to the hard cases — psychopathy, severe deprivation, covert manipulation — and does either position need the reactive attitudes to be universal, or only to be ours?

  Please work from the arguments as you understand them: I do not want citations, page references, or a reading list, and I would rather you did not spend the answer telling me which authors have defended which version — I want the formulations themselves, and if you introduce a refinement of either view that is not part of the standard package, flag in your own words that you have introduced it. If you think one of my two cases is rigged, underdescribed, or uninformative, say which and why, and add the case you would put in its place. Close with a short note on how confident you are in each of the agreed claims, and single out the one claim or formulation you are least sure of, with a sentence on what would settle it. The answer should be in American English.
reasoning: |-
  Okay, the user is running a graduate reading group on moral responsibility focusing on Strawson's "Freedom and Resentment" and incompatibilist replies. Two members are stuck in a loop: one defends Strawson's view that responsibility is about fitting reactive attitudes based on quality of will, not causal history; the other insists responsibility requires ultimate sourcehood that determinism precludes. The user wants a joint statement both could sign, with agreed claims, a table of disagreements, and three cruxes.

  First, I need to map their core positions clearly. Her view: responsibility = fitting target of reactive attitudes (resentment, gratitude etc.), which are constitutive of relationships; fittingness depends on quality of will, not causal history; determinism irrelevant. His view: blame/punishment require ultimate sourcehood (incompatible with determinism or any non-self-created mechanism); reactive attitudes are real but Strawsonian "responsibility" isn't true desert. 

  For the joint statement, I'll structure: 
  1) Agreed claims: Start with undisputed ground - reactive attitudes' phenomenology (immediate, non-voluntary), their role in relationships (constitutive, not optional), how excuses work (deny bad will). Both accept Strawson's participant/objective stance distinction and agree determinism's truth is unsettled. Neither thinks reactive attitudes are pointless. 

  2) Disagreement table: Need neutral formulations plus their preferred versions. Key splits: 
  - Definition of responsibility: Neutral = "What concept does our practice track?" Hers: fittingness of reactive attitudes. His: desert requiring ultimate sourcehood. 
  - Desert: Neutral = "Does responsibility entail intrinsic desert?" Hers: only appropriateness within practice. His: yes, independent of practice. 
  - Source requirement: Neutral = "Must the agent be ultimate source?" Hers: no, quality of will sufficient. His: yes. 
  Crucially, avoid strawmen - e.g., his "desert" isn't necessarily retributive.

  3) Cruxes:
  - Desert question: Unpack where disagreement is substantive vs. verbal. Verbal part: both agree "desert" exists in some sense. Substantive: whether it's practice-immanent (her) or transcendent (him). Case: Calibration study - she says responsible (good quality will), he says not (source compromised). Cost: If Calibration counts as responsible, he loses; if not, she must explain why source matters against her theory. 
  - Manipulation cases: 
    • Calibration: She accepts responsibility (unchanged quality of will); he rejects (source manipulated). 
    • Vale study: If adults function without reactive attitudes, her view might need adjustment (but she'll predict latent attitudes under stress). His view unaffected - Vale adults might be "decent" but not truly responsible. Key: Her account risks empirical falsification if Vale subjects never manifest participant stance. 
  - Scope: Disagreement sharpens in hard cases (psychopathy etc.). Neither requires universality of reactive attitudes - just that ours reveal the structure of responsibility.

  I'll flag where I refine views slightly (e.g., clarifying his desert isn't necessarily retributive). Vale case is fair but underdescribed - I'll add a note about stress tests. Least confident claim: "Reactive attitudes are inescapable in close relationships" - might not hold for all cultures, needs anthropological evidence. Close with crisp formulations in American English, no citations.
answer: |-
  ### Joint Statement on Moral Responsibility and Reactive Attitudes  
  **(Agreed by Both Parties)**  

  #### Section 1: Agreed Claims  
  1. **Reactive Attitudes (Phenomenology & Function):**  
     - Reactive attitudes (e.g., resentment, gratitude, guilt) are immediate, non-voluntary responses to the perceived quality of will in others’ conduct.  
     - They are constitutive of ordinary interpersonal relationships—not mere emotional add-ons but frameworks through which we engage with others as agents.  
     - Excuses (e.g., "He didn’t see the ice") negate responsibility by denying *bad will*, not by appealing to causal history alone.  

  2. **Stances (Participant vs. Objective):**  
     - The participant stance (reactive attitudes) and objective stance (detached explanation/management) are genuine, context-sensitive modes of engagement. We fluidly shift between them (e.g., treating a toddler differently than a colleague).  
     - Neither stance is universally "correct"; each serves distinct pragmatic and moral purposes.  

  3. **Determinism & Scope:**  
     - Determinism’s truth remains unsettled and is not assumed by either party.  
     - The debate is not about whether reactive attitudes are "useful" or "pointless" in daily life; both agree they are psychologically and socially entrenched.  

  4. **Core Disagreement Boundary:**  
     - The dispute centers on whether moral responsibility *necessarily requires* being an "ultimate source" of action (in a non-causal-history-dependent sense). It is **not** about:  
       - The reality or importance of reactive attitudes.  
       - Whether determinism *obviously* undermines responsibility (both grant it’s non-obvious).  
       - Whether moral reasoning or reasons-responsiveness matters (both agree it does).  

  ---  
  #### Section 2: Table of Residual Disagreements  
  | Neutral Formulation (Both Accept) | Her Preferred Formulation (She Signs) | His Preferred Formulation (He Signs) |  
  |-----------------------------------|--------------------------------------|--------------------------------------|  
  | **1. What defines moral responsibility?**<br>The concept our practices of praise/blame track. | To be responsible is to be a *fitting target* of reactive attitudes, given the *quality of will* expressed in one’s conduct. | To be responsible is to *deserve* blame/praise in a way requiring being the *ultimate source* of one’s actions, irreducible to causal chains. |  
  | **2. Does responsibility entail "desert"?**<br>Whether blame/praise reflects a normative truth beyond social utility. | "Desert" is internal to the practice: fitting attitudes reflect the *moral meaning* of conduct, not a transcendent property. | Desert is *external* to the practice: fitting attitudes can exist without genuine desert, which requires *metaphysical ultimacy*. |  
  | **3. Is "ultimate sourcehood" necessary?**<br>Whether an agent must be an uncaused cause of their will. | Quality of will is sufficient; sourcehood is irrelevant if the agent’s conduct expresses their evaluative stance. | Ultimate sourcehood is necessary; without it, agents are "passengers" of their psychology, undeserving of blame/praise. |  

  ---  
  #### Section 3: Cruxes & Test Cases  
  **Crux 1: The Desert Question**  
  - **Verbal Dispute:** Both agree "desert" exists in *some* sense. The verbal split is whether "desert" is defined *by* the practice (her) or *independently* of it (him).  
  - **Substantive Dispute:** Does her "fittingness" capture a norm binding *on us* (e.g., "We *ought* not resent innocents") or merely a consistency rule within attitudes?  
    - *Test Case: The Calibration Study*  
      - **Her Prediction:** The agent is responsible. Her quality of will is morally excellent, and her deliberations express her character.  
      - **His Prediction:** Not responsible. The device undermines ultimate sourcehood; her "good will" is engineered, not *hers*.  
    - **Costs:**  
      - *If Calibration agent is responsible:* He concedes sourcehood is irrelevant in practice.  
      - *If not responsible:* She must explain why source matters *without* appealing to causal history.  

  **Crux 2: Manipulation Cases**  
  - *Case A: Calibration Study*  
    - **Her View:** Responsible (quality of will intact).  
    - **His View:** Not responsible (sourcehood compromised).  
  - *Case B: Vale Study*  
    - **Her Prediction:** Vale adults would manifest latent reactive attitudes under stress (e.g., if betrayed by a friend) or in close relationships. *If not*, her view is falsified: it shows participant attitudes are contingent, not inescapable.  
    - **His Implication:** Vale adults’ "decency" is irrelevant. They lack desert *even if* functionally identical to controls, as they lack ultimate sourcehood. No cost to his view if they act well.  
    - **Strawson’s Vulnerability:** Yes, his claim that the participant stance is "natural" is empirically testable. Vale tests whether it’s *culturally* necessary.  

  **Crux 3: Scope of Disagreement**  
  - **Hard Cases (Psychopathy/Coercion):**  
    - Both agree reactive attitudes may be *inappropriate* here (e.g., psychopaths lack moral understanding).  
    - **Disagreement Persists:** He argues hard cases reveal the *sourcehood requirement* (e.g., deprived agents aren’t ultimate sources). She argues they reveal *impaired quality of will*.  
  - **Universality of Reactive Attitudes:**  
    - Neither requires universality. Her view needs attitudes to be *central to our form of life*; his needs *desert* to be a non-empirical truth. Vale adults’ existence wouldn’t refute either, but their *psychological resilience* under stress tests her view.  

  ---  
  #### Refinements & Case Notes  
  - **Refinement Flagged:** His "desert" is clarified as *non-retributive* intrinsic desert (to avoid straw-manning).  
  - **Vale Case Adequacy:** Underdescribed on "stress tests." Refined case: *Vale adults witness a loved one tortured by a malevolent agent. Do they spontaneously feel indignation?* Her view predicts yes; if not, it’s a cost.  
  - **Calibration Case:** Fair test—isolates sourcehood vs. quality of will.  

  ---  
  #### Confidence Assessment  
  - **High Confidence:** Agreed claims 1–3 (phenomenology, stances, excuses). These are observable in practice.  
  - **Moderate Confidence:** Agreed claim 4 (disagreement boundary). Both explicitly endorse this framing.  
  - **Lowest Confidence:** **"Reactive attitudes are inescapable in close relationships"** (from Agreed Claims). *What Would Settle It:* Cross-cultural/anthropological evidence of societies with consistently objective stances in intimate bonds (e.g., parent-child without resentment). Vale is a test case.  

  ---  
  This document isolates the dispute’s core, avoids question-begging, and specifies how empirical or conceptual progress could resolve it. Both can sign without conceding ground, as disagreements are neutrally framed and testable.
