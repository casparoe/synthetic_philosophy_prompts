answer: |-
  ### (a) Reading: Run Lola Run’s Contingency Models  
  *Run Lola Run* superficially mirrors chaotic amplification but ultimately subverts it, favoring agency and metaphysical intervention. The three runs initially suggest microscopic changes (e.g., Lola’s stairwell stumble) cascading into macroscopic divergence (Manni’s survival/death, Lola’s fate). Yet closer scrutiny reveals:  

  - **First Run (Failure):** Apparent **Amplification**—Lola’s 2-second delay on stairs leads to missing her father, forcing a desperate bank robbery where she’s shot. Tiny delays compound unpredictably: a bumped woman delays Lola further; a cyclist’s timing alters her path. However, outcomes feel mechanically deterministic, not truly chaotic. The domino effect is linear, not exponential.  

  - **Second Run (Tragedy):** **Basin-Switch**—Lola avoids the stairwell stumble, reaches her father earlier, but his rejection triggers her theft of security guards’ money. A minor change (earlier arrival) tips the system into a preexisting tragic outcome: Manni is hit by an ambulance while celebrating. The "basins" (robbery success vs. accidental death) are latent in the scenario; Lola’s timing merely selects one.  

  - **Third Run (Success):** **Resistance to Models**—Lola’s scream during roulette (a conscious, agential act) "wins" the money, overriding prior cascades. This run rejects amplification/basin-switch: her scream has no "cause" in prior events and bends probability metaphysically. The film shifts from chaos to *agency*—Lola "learns" to harness chance, not just react.  

  The film’s controlled reruns expose counterfactual history’s core problem: historians cannot test "what ifs," but *LLR* assumes extreme sensitivity to argue *for* contingency’s power. Yet it undermines this by implying outcomes aren’t truly open (Severing) but are channeled by Lola’s growth. The supernatural elements—the blind woman who "knows" fate and flash-forwards showing bystanders’ fixed futures—contradict chaos entirely. They suggest a deterministic universe where contingency is an illusion, or where agency (the scream) briefly overrides it. *LLR* thus dangles chaos only to reveal its framework as incomplete: history isn’t just nails and butterflies but also wills and unseen forces.  

  ### (b) Analysis Table  

  | Beat                          | Best-fit model | What the model predicts                                     | What the film actually does                                                                 | Fit            | Why                                                                 |
  |-------------------------------|----------------|------------------------------------------------------------|---------------------------------------------------------------------------------------------|----------------|---------------------------------------------------------------------|
  | Lola’s stumble on stairs (Run 1) | Amplification  | Micro-delay grows into macro-failure (missed father → robbery death) | Delay cascades linearly into robbery and Lola’s death                                      | Partly holds   | Linear domino effect lacks true chaotic unpredictability.           |
  | Bag snatched from Manni (Run 2) | Basin-switch   | Loss of money tips system into latent tragic outcome (Manni’s death) | Manni’s panic leads to him being hit by ambulance; tragedy was "waiting" in the system      | Holds          | Change selects between preexisting outcomes (recovery vs. death).   |
  | Lola’s scream at roulette (Run 3) | None of them   | N/A                                                        | Scream defies probability; agential act overrides prior causality                           | Resists        | Agency (scream) breaks deterministic chains, introducing will.      |
  | Blind woman’s presence (All runs) | None of them   | N/A                                                        | She smiles knowingly, implying foresight/fate beyond contingency                            | Resists        | Supernatural awareness contradicts randomness or open outcomes.     |
  | Flash-forward stills (e.g., Doris the nurse) | None of them   | N/A                                                        | Shows fixed futures for bystanders, regardless of Lola’s actions                           | Resists        | Deterministic vignettes negate contingency’s reach.                 |

  ### (c) Verdict  
  **Yes, it belongs—to teach how contingency models *fail* when agency, metaphysics, or narrative closure intervene, exposing the tension between chaotic possibility and historical determinism.**
