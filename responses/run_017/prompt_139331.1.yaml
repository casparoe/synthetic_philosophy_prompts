  ### Diagnostics  
  - **Unoccupied Combos:** 22 of 27 possible codes (e.g., NNY, YNN, DYN) are **unmapped**. These imply incoherent/unattractive views (e.g., "only judgements matter but Case 1 isn’t emotion" is self-contradictory).  
  - **Indistinguishable Theories:**  
    - **YNY** (Group A) → Requires **Q7** to split Feeling Theory (emotion survives object) vs. Basic Emotion (fades without object).  
    - **YYY** (Group B) → Requires **Q9** (split Component Process) then **Q4** (split Appraisal/Perceptualism).  
  - **Underdetermined Questions:**  
    - **Q1 (Case 1):** Only Judgementalism says "no" (since judgement is gone). All others say "yes" or "depends" → *Diagnostic for Judgementalism*.  
    - **Q3 (Case 3):** Only Action Readiness says "no" (no action possible) → *Diagnostic for Action Readiness*.  
    - **Q5/Q6/Q8:** Not used in scoring – all theories can answer variably.  

  ### Design Notes  
  - **No Abstract Jargon:** Cases use concrete examples (printers, spiders, Sam).  
  - **No "Theory-Loaded" Questions:** Avoids direct terms like "judgement" or "appraisal."  
  - **Tie-Breakers:** Ugly but necessary Q7 (Group A) and Q9+Q4 (Group B) resolve shared codes.  
  - **British English:** "Judgement" (with "e"), "physiological," "labrador," etc.  

