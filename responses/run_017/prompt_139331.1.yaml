  ### Emotion Theory Quiz  
  **Instructions:** Answer each question based on your intuition. Choose "yes," "no," or "it depends" (and briefly explain your reasoning for "it depends"). British English spelling used throughout.  

  ---

  #### **Part 1: Dissociation Cases**  
  *(These three questions generate a three-letter code: Y = yes, N = no, D = it depends)*  

  1. **Case 1 (Judgement Gone):**  
     Someone *knows* a dog is harmless (e.g., a friendly Labrador) but still feels intense terror, physiological panic (sweating, racing heart), and an urge to flee. **Is this terror still an emotion?**  
     - Yes  
     - No  
     - It depends (explain): ________________  

  2. **Case 2 (Feeling Gone – "Sam"):**  
     Sam takes medication. He judges his father’s illness as "sad," cries at sad news, and has physiological grief symptoms (tearing up, heaviness in chest). But he reports *no inner feeling* of sadness. When asked, he sincerely says, "I am sad about my dad." **Is Sam still experiencing sadness?**  
     - Yes  
     - No  
     - It depends (explain): ________________  

  3. **Case 3 (No Action Possible):**  
     Someone feels fury at a malfunctioning printer, grief over a fictional character’s death, or fear of a cliff edge while watching safely from behind glass (no danger, no ability/need to act). **Is this fury/grief/fear still an emotion?**  
     - Yes  
     - No  
     - It depends (explain): ________________  

  ---

  #### **Part 2: Core Questions**  
  *(These refine your result; answer after Part 1)*  

  4. Can someone be **wrong** about what they’re feeling? (e.g., thinking they’re jealous when they’re actually angry)  
     - Yes  
     - No  
     - It depends (explain): ________________  

  5. Can a **Labrador or 10-month-old baby** feel the *same* emotion as an adult human? (e.g., "fear" – not just similar behaviour, but identical inner experience)  
     - Yes, the same emotion  
     - No, only something similar  
     - It depends (explain): ________________  

  6. Is **irritability for no reason** the same kind of thing as **anger at a specific person**?  
     - Yes, both are emotions  
     - No, they’re fundamentally different  
     - It depends (explain): ________________  

  7. Can an emotion **survive its object**? (e.g., still furious at someone who died; still afraid of the dark after proving it’s empty)  
     - Yes  
     - No  
     - It depends (explain): ________________  

  8. When afraid of something you **know is not threatening** (e.g., a harmless spider), is that thing what your fear is *about*?  
     - Yes  
     - No  
     - It depends (explain): ________________  

  9. Could two experiences both called **"anger"** share *nothing* in common? (e.g., one is a hot, explosive rage; the other is a cold, calculated response)  
     - Yes  
     - No  
     - It depends (explain): ________________  

  ---

  ### Scoring Key & Theory Mapping  
  **Step 1:** Use your answers to Part 1 to get a **three-letter code** (e.g., YNY = Yes/No/Yes for Q1/Q2/Q3).  

  **Step 2:** Match your code to a theory below. If your code is **YYY** or **YNY**, use Part 2 questions to refine.  

  | Code | Theory of Emotion | What It Claims | Notes |
  |------|-------------------|----------------|-------|
  | **NYY** | **Judgementalism** | Emotions *are* evaluative judgements. If you judge something sad, you’re sad – even without tears or feelings. | Sam’s case (Q2) is emotion because judgement remains. |
  | **YYN** | **Action Readiness** | Emotions *are* states of readiness to act (e.g., fear prepares you to flee). No action possible = no emotion (Q3). | Fury at a printer isn’t emotion (no actionable target). |
  | **DDD** | **Disunity View** | "Emotion" isn’t one thing. It’s a grab-bag term for unrelated states (e.g., fear, grief, joy are as different as digestion and breathing). | All cases "depend" – no single rule applies. |
  | **YNY** | **Group A** (Requires Q7) | *Feeling* or *physiology* defines emotion. | **If Q7 = Yes → Feeling Theory**<br>Emotions *are* felt experiences/bodily states. Fear is the feeling of dread, even if irrational (Q1) or objectless (Q7).<br>**If Q7 = No → Basic Emotion Theory**<br>Emotions are innate, universal physiological programs (e.g., fear is a biological alarm). They fade without a "live" object (Q7). |
  | **YYY** | **Group B** (Requires Q9 & Q4) | *Evaluation* defines emotion. | **If Q9 = Yes → Component Process**<br>Emotions are packages (appraisal, feeling, action). No single component is "the" emotion. Two "angers" can share nothing (Q9).<br>**If Q9 = No →**<br> *Then use Q4:*<br> - **Q4 = Yes → Appraisal Theory**<br>Emotions stem from automatic appraisals (e.g., "this is threatening"). You can mislabel them (Q4).<br> - **Q4 = No → Perceptualism**<br>Emotions are perceptions of value (e.g., fear *sees* danger). You can’t be wrong about them (Q4). |

