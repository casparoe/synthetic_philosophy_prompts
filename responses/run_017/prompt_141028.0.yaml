prompt: |-
  Here's the setup I keep arguing about with a friend: you ask an LLM a factual question you have no independent way to check, it answers in plain assertoric form — "the treaty was signed in 1713" — you believe it, and it's in fact true. Nothing else. Did you end up knowing it?

  I want a number, but mostly I want the decomposition behind it. I'm at roughly 0.5, she's at about 0.15, so I'd also like your guess at where that gap actually lives.

  Give me: your credence that you know in that case; then the terms it rides on — whether reductionism about testimonial warrant is true at all, whether the anti-reducionist line instead (prima facie entitlement to accept what's presented as true barring defeaters), how much either story really requires the source to have beliefs and a communicative intention rather than just emitting well-formed sentences that track the truth, whether you actually have decent inductive grounds here given that this particular claim is one you can't check, and whatever else you'd add. Rough number and one line of justification for each, then how they combine into the headline figure.

  Then two things: which term you're least confident in, and which would move your number more — finding out the model is 95% reliable on this type of question, or finding out that reductionism is false. (My sense is the reliability fact baisically doesn't touch the interesting part, but I want to hear you say why or why not.)
