prompt: |-
  I'm a software engineer with no philosophy background and I've somehow ended up deep in the aquaculture animal-welfare rabbit hole. Please don't give me citations or reading lists, I can't check them anyway. What I actually want is a spec.

  The purpose first, so adequacy has something to be relative to: I want a theory of welfare good enough to do three concrete jobs. (1) Decide whether some change at a farm is a real improvement or just a different-looking one — lower stocking density, swapping ice-slurry chilling for electrical stunning, stopping eyestalk ablation on the broodstock, whatever. (2) Compare across species, because someone will ask whether a kilo of shrimp is worse than a kilo of salmon and "it depends" is not shippable. (3) Be implementable as an actual check a person can run on a farm holding thousands or millions of animals they will never inspect individually.

  So write the desiderata: what any theory has to deliver to count as adequate for that, with the case or consideration behind each requirement. The cases I want covered include: a shrimp whose eyestalk is ablated and then goes on eating and spawning normally; a fish with fin erosion and a deformed jaw that still feeds and grows at target rate; an animal that looks calm only because it's apathetic; the one individual in the pen who is doing terribly and will never be sampled; a whole life that lasts eight months; and whether death is a welfare item at all or only the stuff before it. Also the two I think are traps: welfare indicators that are tied to productivity (growth, feed conversion), so that a farm can score well while the animals are worse off; and breeding animals that no longer express the indicator — fish selectively bred not to thrash — which improves every measurement and maybe improves nothing.

  Distinctions it isn't allowed to collapse: welfare versus moral status, how bad versus how many, state at a time versus over a lifetime, and the animal's actual condition versus the number the audit produces.

  It also has to be consistent with the biology without leaning on anatomy these animals don't have — fish don't have the layered cortex mammals have, decapods are wired differently again — and it should say what experiment would settle the question and what result would count as evidence of feeling rather than of nociception alone.

  Mark each requirement non-negotiable or a preference of one camp. Flag the pairs you think can't be jointly satisfied; my guesses are species-specific evidence versus cross-species comparison, sensitivity to the worst-off individual versus only ever measuring distributions, and cheap enough to run versus tracking something internal to the animal. If the honest answer is that the full list is unsatisfiable and we have to pick which job we're building for, say that, that's a result too. And tell me which single requirement kills the most candidates.

  Short scorecard at the end, a couple of lines each, no more: feeling-based views, preference- or desire-based views, functioning and natural-living views, and the operationalist view that welfare is just whatever the audit protocol measures. Score them against the list only.
reasoning: |-
  Alright, let me try to unpack what this user is really asking for. They're a software engineer who's dived into aquaculture welfare without a philosophy background. They want a "spec"—basically a set of requirements for a welfare theory that can handle three practical tasks: evaluating farm changes, comparing welfare across species, and being implementable at scale.

  First, I need to parse their explicit needs. The three jobs are clear: assess farm interventions, cross-species comparisons, and scalable audits. But the deeper pain points are in the cases they mentioned. The ablated shrimp that behaves normally, the injured fish that still meets growth targets, the undetected suffering individual. They're wary of productivity metrics masking poor welfare and genetic changes that suppress indicators without real improvement. 

  The non-negotiables they listed—like distinguishing welfare from moral status, avoiding collapsing key distinctions—suggest they've encountered oversimplified frameworks before. They want biological consistency without relying on absent neuroanatomy. Also, they need testable criteria for sentience beyond nociception.

  I should note their rejections: no citations, just actionable specs. They flagged traps like productivity-linked indicators and breeding away stress responses. The conflicts they anticipate—species-specific vs. cross-species, sensitivity to worst-off vs. scalable measurements—need highlighting. 

  Underlying all this might be frustration with theoretical debates that don't translate to real-world decisions. As a engineer, they likely value pragmatism and falsifiability. The unspoken need? Probably a tool that doesn't require philosophical justification every time it's used—something operational that holds up under audit pressures.

  For the scorecard, I'll need to neutrally dissect each theory's feasibility against their specs. Feeling-based views fail scalability and cross-species; preference-based ones struggle with apathy and abnormal behaviors; functioning/natural-living clash with aquaculture realities; operationalism is circular. The core tension remains: precision vs. practicality. No theory aces all three jobs, so the user must prioritize—likely sacrificing either cross-species rigor or individual sensitivity for scalability. The killer requirement? Probably proving internal states (sentience) without neurology. That's where most frameworks stall.
answer: |-
  Here's a functional specification for an aquaculture animal welfare theory based solely on your operational requirements and constraints. Requirements are categorized (Non-Negotiable = **NN**, Preference = **P**), with conflicts highlighted.

  ---

  ### Core Functional Requirements (What the Theory MUST Deliver)

  1.  **Objective Assessment of Interventions:** **NN**
      *   **Case:** Must distinguish between *real* welfare improvement (e.g., electrical stunning vs. ice slurry, stopping eyestalk ablation) and superficial changes. Must handle cases like apathetic calm or breeding away stress responses without genuine improvement.
      *   **Deliverable:** A defined set of measurable parameters whose changes reliably correlate with changes in the animal's *internal experience* (positive/negative), independent of productivity metrics.

  2.  **Cross-Species Welfare Comparison (Per Unit Mass):** **NN**
      *   **Case:** Provide a comparable metric (e.g., "welfare units per kg") for decisions like "shrimp vs salmon per kilo". Must avoid "it depends" as the primary output.
      *   **Deliverable:** A normalization/scaling method based on biologically relevant factors (e.g., neurological complexity proxies, metabolic rate, behavioral repertoire breadth) applied to core welfare indicators.

  3.  **Scalability & Implementability:** **NN**
      *   **Case:** Must be auditable on farms with thousands/millions of animals without individual inspection. Cannot rely on invasive or highly individualized measures.
      *   **Deliverable:** Reliance primarily on population-level sampling (e.g., water quality, group behavior patterns, prevalence of physical indicators in samples) and resource/protocol audits (e.g., stocking density logs, stunning procedure verification, environmental enrichment presence).

  4.  **Captures Suffering Despite "Normal" Function:** **NN**
      *   **Case:** Must flag welfare issues in animals meeting productivity targets (e.g., shrimp post-ablation eating/spawning, fish with deformities but good growth). Must detect apathy vs. genuine calm.
      *   **Deliverable:** Inclusion of specific indicators *known* to correlate with negative states but *not* necessarily with productivity (e.g., specific abnormal behaviors, physiological stress markers in sampled individuals, physical injuries).

  5.  **Sensitivity to the Worst-Off:** **NN**
      *   **Case:** Must account for the individual suffering terribly, even if rare or not sampled.
      *   **Deliverable:** Metrics must include prevalence rates of severe negative indicators (e.g., % with severe injuries, mortality causes) and environmental risk factors known to cause suffering (e.g., chronic stress inducers like poor water quality, lack of shelter).

  6.  **Life Experience Integration:** **P** (Camp: Duration Matters)
      *   **Case:** Must account for cumulative experience over a lifespan (e.g., 8 months of chronic stress vs. 1 month).
      *   **Deliverable:** Framework for integrating point-in-time measurements over the rearing period (e.g., time-weighted averages, duration of exposure to negative states).

  7.  **Handles Death Explicitly:** **P** (Camp: Suffering Focus)
      *   **Case:** Must clearly state whether death itself is a welfare harm or only the suffering preceding it.
      *   **Deliverable:** Explicit definition: "Welfare" is defined as the *experiential state* during life. Death is a harm due to loss of future positive experience (if sentient), but the welfare assessment period ends at death. Suffering *during* dying is included.

  8.  **Decouples Welfare from Productivity:** **NN**
      *   **Case:** Prevents farms scoring well on welfare metrics simply because animals grow fast/conversion is good, even if suffering.
      *   **Deliverable:** Core welfare indicators must be demonstrably distinct from production metrics (FCR, SGR). Use of indicators potentially *inversely* related to productivity in intensive systems (e.g., exploratory behavior, low baseline cortisol).

  9.  **Detects Masking via Breeding/Selection:** **NN**
      *   **Case:** Identifies if selection (e.g., for reduced thrashing) masks poor welfare rather than improving it.
      *   **Deliverable:** Requirement for multiple, diverse indicators. If a "stress response" indicator is bred out, reliance shifts *heavily* to other validated indicators (physiological, physical health, alternative behavioral markers) known to correlate with negative states in related species or via challenge tests.

  10. **Maintains Critical Distinctions:** **NN**
      *   **Distinctions:**
          *   Welfare (Experience) vs. Moral Status (Importance)
          *   Severity of Harm vs. Number Affected
          *   Point-in-Time State vs. Lifetime Integration
          *   Actual Animal Condition vs. Audit Output Number
      *   **Deliverable:** Clear definitions and operational separations within the assessment protocol and reporting.

  11. **Biologically Grounded & Anatomy Agnostic:** **NN**
      *   **Case:** Must be applicable to fish, shrimp, etc., without requiring mammalian-like brain structures. Must allow for diverse neurology.
      *   **Deliverable:** Focus on functional outcomes (behavior, physiology, health) linked to plausible subjective states. Sentience criteria based on integrative capacity and behavioral flexibility, not specific anatomy.

  12. **Operationalized Sentience/Feeling Criterion:** **NN**
      *   **Case:** Defines what evidence is needed to attribute "feeling" vs. mere nociception/reflex.
      *   **Deliverable:**
          *   **Experiment:** Cognitive/Behavioral Flexibility Test (e.g., trade-off tests - does the animal sacrifice a resource/opportunity to avoid a presumed negative stimulus? Does it learn to use analgesia? Does it show protective behavior towards injured areas beyond reflex?).
          *   **Evidence for Feeling:** Demonstration of *flexible, context-dependent behavioral change* prioritizing avoidance/relief *over* other motivations, learning associated with the stimulus, and lack of habituation to prolonged negative stimuli. Not just reflex withdrawal or simple stress physiology.

  ---

  ### Key Conflicts & Tensions

  1.  **Sensitivity to Worst-Off Individual (5) vs. Scalability (3):** **NN Conflict** - Finding the suffering individual in millions is inherently hard. *Resolution:* Rely on prevalence rates (5) of severe outcomes and environmental risk factors as proxies. Accept imperfect detection.
  2.  **Cross-Species Comparison (2) vs. Species-Specific Evidence (11, 12):** **NN Conflict** - Strong evidence for sentience/indicators is often species-specific. *Resolution:* Use conservative, tiered sentience criteria (12) and core indicator sets validated in related taxa, scaled by complexity proxies (2).
  3.  **Capturing Internal State (1, 4, 8, 12) vs. Scalability (3) & Anatomy Agnostic (11):** **Fundamental Tension** - Truly knowing internal state requires measures often incompatible with scale or lacking clear neurology. *Resolution:* Rely on validated behavioral and physiological proxies known to correlate with negative/positive states across diverse animals, accepting some inference.
  4.  **Life Integration (6) vs. Scalability (3):** **P Conflict** - Continuous monitoring is impractical. *Resolution:* Snapshot audits combined with records review (stocking density history, mortality logs, treatment records) to infer chronicity.

  ---

  ### The Killer Requirement
  **#12 (Operationalized Sentience/Feeling Criterion) + #11 (Anatomy Agnostic)** kills most simplistic theories. Proving "feeling" in neurologically diverse species without relying on mammalian homologies is exceptionally hard and requires sophisticated, often impractical, behavioral testing. This requirement exposes the fundamental inference gap.

  ---

  ### Scorecard vs. Requirements

  1.  **Feeling-Based (e.g., Hedonic):**
      *   **Pros:** Directly targets core requirement (1, 4, 8, 12).
      *   **Cons:** Fails spectacularly at scalability (3), sensitivity to worst-off (5), cross-species comparison (2), and implementability without perfect sentience proof (12). **Overall: Fails NN 2,3,5,12.**

  2.  **Preference/Desire-Based:**
      *   **Pros:** Captures individual variation (5), avoids productivity link (8), potentially anatomy agnostic (11).
      *   **Cons:** Difficult/impossible to assess preferences in many species at scale (3, fails 12), apathetic animals may express no preferences (4), comparing preferences across species is dubious (2), "revealed preference" can be misleading (e.g., choosing pain if no alternative). **Overall: Fails NN 2,3,4,12.**

  3.  **Functioning/Natural Living:**
      *   **Pros:** Easier to measure objectively (health, behavior) (3, 11), avoids direct sentience proof (12), can handle life integration (6).
      *   **Cons:** Dangerously close to productivity metrics (8 - healthy/growing = good welfare?), "natural" is poorly defined and often irrelevant/worse in captivity (fails 1 - ablation may improve "function"), misses internal state of functional but suffering animal (4), poor cross-species comparison basis (2). **Overall: Fails NN 1,2,4,8.**

  4.  **Operationalist (Welfare = Audit Output):**
      *   **Pros:** Perfectly meets scalability (3) and implementability (3), generates clear numbers.
      *   **Cons:** Circular, collapses all distinctions (10), completely fails to ensure the number reflects actual welfare (1,4,5,8,9,12). Easily gamed. **Overall: Fails all NN except possibly 3. Utterly inadequate.**

  ---

  **Conclusion:** The full list is **unsatisfiable** with current knowledge and practical constraints. **You must prioritize:** Scalability & implementability (3) and Cross-species comparability (2) are essential for your use case but fundamentally conflict with Sensitivity to the worst-off (5) and robust Sentience proof (12). **Recommendation:** Build for **Scalability (3)**, **Cross-Species Comparison (2)**, and **Objective Intervention Assessment (1)** as the core. Accept proxies for internal state (behavior, health, stress phys in samples) and imperfect detection of the worst-off, using prevalence of severe outcomes as the best available proxy. Explicitly acknowledge the inference gap regarding sentience (#12) but use the most conservative criteria possible. This sacrifices precision on internal state and individual suffering detection for actionable, comparable audits.
