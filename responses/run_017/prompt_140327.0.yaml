prompt: |-
  I sit on the committee that sets the research agenda for a small theory group — roughly six postdocs for three years, plus a visitors' budget — funded to work on the conceptual foundations of cooperation between artificial agents. The group does formal and philosophical work only: game theory, logic, decision theory, perhaps small computational experiments; no training runs, no empirical ML. What I need from you is a defended agenda, not a map of the terrain, so please skip the reading list and the citations: where you think a question is already settled, say what the settled answer is and how that changes the ordering of everything else.

  The area is the one opened by the following construction. Take a one-shot prisoner's dilemma in which each player submits, not a move, but a program; the two programs are given each other's source as input and each outputs a move. In the familiar constructions, a program cooperates just in case it can in some sense establish that the other is a cooperator of the relevant kind — a syntactic copy of itself, a program provably equivalent to it, a program it can prove cooperates against it — and mutual cooperation then shows up as an equilibrium of the program game, despite the underlying game being played once and the parties being strangers. This idea is appealed to constantly in arguments about whether advanced AI systems could be expected to cooperate with one another, and I do not trust the appeals. Some of the questions I think the group might work on:

  First, the recognition problem. Cooperative programs have to decide which other programs to cooperate with, and the usual constructions are either extremely narrow (cooperate only with a copy) or extremely demanding (cooperate with anything provably cooperative, at unbounded proof cost). In a population of independently written cooperative programs, does any interesting cooperative equilibrium survive, or does the cooperative set collapse to whichever implementation happened to spread? What exactly has to be true of the epistemic relation between two agents before the construction gets off the ground, and does the answer change if that relation is syntactic inspection, proof, simulation, or reputation?

  Second, a worry I cannot get a handle on and which I suspect is underdiscussed. Real agents are trained rather than written. What can be exchanged between them is weights, an API, a natural-language specification, a behavioural transcript, or an audit report. Is there any genuine analogue of reading source code for a system whose policy is an opaque function approximator, or does the whole approach rest on a transparency condition that current and foreseeable systems fail? And there is a second half to this: two programs can be mutually legible at the level of syntax while attaching different meanings to the same terms, so that each correctly predicts the other's outputs and neither gets what it took itself to be bargaining for. Call this the semantic handshake problem. Is it a real obstacle, a special case of something already understood, or a confusion?

  Third, the delegation gap. The equilibrium is an equilibrium among programs, but programs are written and deployed by parties whose objectives may differ from what the program encodes, from what the deploying party is willing to avow, or from what it would want under reflection. What has to hold of the delegation relation for cooperation among programs to translate into cooperation among principals, and is that condition ever checkable from inside the program game?

  Fourth, a conceptual question about what is even being claimed. Is a program equilibrium a genuinely new solution concept, or just the ordinary equilibrium concept applied to a richer space of actions? If the latter, does the construction tell us anything about what rationality requires, or only about what commitments can do for agents that can make them? Is that contrast a substantive dispute or a verbal one, and how would we tell?

  Fifth, selection and brittleness. The program game has many equilibria, including thoroughly bad ones, and the famous constructions are sensitive in specific ways to small perturbations of the other program's code, to proof budgets, to time limits, and to misreadings. How should robustness here be formalised, and does the cooperative outcome survive the formalisations that matter for systems that actually exist? Is there a principled refinement that selects among program equilibria, or is the cheerful result an artifact of attending only to the good one?

  Sixth, scope. What happens outside the symmetric two-player prisoner's dilemma: bargaining over divisions, games with partial conflict of interest, many-player settings, settings with more than one round but continuing opacity, settings where one side can rewrite the other's code? Where does the construction generalise, and where does it break in a way that should change someone's expectations about AI cooperation?

  Seventh, the downstream question. Does any of this cash out in advice — to engineers, to regulators, to anyone deciding whether AI systems should be able to inspect one another's internals — or is it a beautiful toy? Is make commitments legible a real recommendation, and if so, legible to whom and at what cost?

  Rank these, or replace them. I want to know what you would actually put six people on for three years and in what order, on what criteria — importance for the downstream question, tractability with the tools this group has, neglectedness, how many of the other questions depend on the answer — and how you weigh those criteria against each other when they conflict. Say which questions are upstream of which, which you would drop because their answer would not change what anyone does, and what result or piece of evidence over the next two years should move an item up or down. Finally, if you think the framing itself is wrong — the mandate, the three-year horizon, the restriction to non-empirical work, the idea that the group's output should be judged by whether it changes engineering or policy practice — say so, and tell me what you would put in its place.
reasoning: |-
  Okay, the user is on a committee setting the research agenda for a small theory group focused on AI cooperation foundations. They need a prioritized research agenda—not just a literature review. The group does formal work: game theory, logic, decision theory. No empirical ML. The core is program equilibrium in Prisoner's Dilemma where agents exchange source code.

  First, let's unpack their seven questions. The recognition problem is about how agents identify cooperators beyond simple copies. The transparency worry questions if real trained models (like neural nets) can even share meaningful "source code." Semantic handshake is whether agents interpret symbols the same way. Delegation gap asks if cooperation between programs translates to their creators' goals. The conceptual question debates if program equilibrium is a new solution concept or just commitments in action space. Selection and brittleness concerns robustness of cooperative equilibria. Scope explores generalization to asymmetric/multi-agent settings. Downstream questions practical impact.

  The user seems frustrated with superficial appeals to these ideas in AI safety debates. They want rigor to test if cooperation is actually feasible. Their hidden need might be: "Can we trust any of this theoretically, or is it philosophical fiction?" They might also worry about allocating limited resources—six postdocs for three years must produce actionable insights, not just papers.

  Now, ranking criteria: Downstream importance is key—will this change practice? Tractability matters since it's a small group. Neglectedness is crucial; no point rehashing settled debates. Interdependence matters too—some questions block others.

  Top priority should be the transparency problem. Why? Because if current AI systems can't exchange interpretable commitments, the whole program equilibrium framework collapses for real-world AI. It's upstream—answers here affect recognition, semantic handshake, even downstream advice. Plus, it's neglected; most papers assume perfect transparency. A negative result here could save years of misguided research.

  Second, semantic handshake. Even if systems share code, misaligned interpretations could break cooperation. This is harder but critical—if unsolvable, cooperation might require impossible levels of semantic alignment. It's connected to transparency and recognition.

  Third, recognition problem. Still important but slightly less urgent—if transparency fails, recognition is moot. Focus on robust heuristics, not perfect proof.

  Fourth, delegation gap. Vital for real-world relevance but relies on earlier answers. If programs can't cooperate reliably, delegation is secondary.

  Fifth, scope. Generalization matters but depends on core mechanisms working first. Explore edge cases later.

  Sixth, conceptual question. Likely a verbal dispute—less urgent unless it reshapes the field (unlikely). 

  Seventh, selection/brittleness. Important but more technical; postdocs can tackle this alongside priorities 1-3.

  Downstream advice is the goal but not a standalone research item—it's the output of solving the others.

  Would drop the conceptual question—interesting but won't change practice. Selection/brittleness stays but as supporting work.

  Key move: If empirical results show transformers can/can't learn to exchange robust commitments, that reshapes priority 1. Similarly, breakthroughs in program semantics (e.g., new logic for neural net abstractions) boost priority 2.

  Framing is mostly sound—non-empirical focus is right for this group. But they should allow *small* computational experiments (e.g., toy models of NN commitment-sharing) to inform theory. Mandate is good; changing practice is the right ambition.
answer: |-
  Based on your mandate and constraints, here’s a defended research agenda prioritised for impact, tractability, and neglectedness. The ranking weighs **downstream relevance** (does this affect real AI deployment?) and **upstream criticality** (does progress here unlock other questions?) most heavily, then **tractability** with formal tools. I drop one question entirely and reframe the rest into four core projects.  

  ### Core Ranking & Rationale  
  **(#1) Transparency & the Training Gap** (Your "worry" + semantic handshake)  
  **Why:**  
  - **Downstream Decisiveness:** If neural nets *cannot* exchange commitments legibly, the entire program-equilibrium framework collapses for real AI systems. This directly informs regulators/engineers on whether "source sharing" is viable.  
  - **Neglected & Upstream:** Formal work here is sparse. Current literature assumes syntactic transparency or symbolic reasoning—both false for deep learning. Answers here constrain the recognition problem and semantic handshake.  
  - **Tractability:** Use program-equivalence logics + computational learning theory. Formalize "approximate legibility" (e.g., mutual simulability under resource bounds) and test with small function approximators (allowed as "small experiments").  
  **Key Questions:**  
  - Can two black-box agents exchange *sufficient evidence* of their behavior (e.g., via interactive proofs, zk-SNARKs, or mutual simulation) to replicate cooperative equilibria?  
  - Is there a formal trade-off between legibility and performance in trained agents?  
  - **Semantic Handshake:** Formalize "meaning alignment" via game-semantic models (e.g., if both agents use the same learning algorithm, do their abstractions converge?).  

  **(#2) Robust Recognition** (Your "recognition problem" + selection/brittleness)  
  **Why:**  
  - **Downstream Relevance:** Determines whether cooperation can scale to diverse AI populations. If recognition collapses to monoculture, this undermines deployment in competitive ecosystems.  
  - **Upstream:** Successful recognition is a prerequisite for delegation and scope extension.  
  - **Neglected:** Most work focuses on single-agent proofs or identical copies. Population dynamics are underexplored.  
  **Key Questions:**  
  - What minimal epistemic conditions (e.g., probabilistic mutual modeling, bounded-proof agreements) permit cooperation in heterogeneous populations?  
  - Does cooperation require a "ground truth" about behavior, or can self-certifying groups emerge?  
  - Formalize brittleness: How do resource limits (time, memory) and adversarial perturbations affect equilibria?  

  **(#3) Delegation & Principal-Agent Alignment** (Your "delegation gap")  
  **Why:**  
  - **Downstream Criticality:** If program cooperation doesn’t align with human interests, it’s useless or dangerous. Engineers need to know if verifiable delegation is possible.  
  - **Neglected:** The literature assumes programs faithfully represent principals—a dangerous oversight.  
  - **Tractability:** Model as a meta-game with three layers: principals, programmers, and programs. Use contract theory + modal logic to encode incentives.  
  **Key Questions:**  
  - What delegation mechanisms (e.g., reward-function auditing, outcome-based contracts) allow programs to verify principal alignment?  
  - Can a program detect and punish "treasonous" instructions from its own principal?  

  **(#4) Generalization & Limits** (Your "scope" question)  
  **Why:**  
  - **Downstream:** Identifies when cooperation is feasible (e.g., in trade negotiations) vs. hopeless (e.g., zero-sum conflicts).  
  - **Tractability:** Extend existing program-game frameworks to bargaining, asymmetric games, and N-player settings.  
  **Key Questions:**  
  - Does cooperation require symmetric capabilities? What breaks when one agent can modify the other’s code?  
  - How do multiple rounds affect commitments when internal states remain opaque?  

  ### Dropped Questions  
  - **Conceptual Question** ("Is this a new solution concept?"): Likely a verbal dispute. Whether program equilibria are "new" doesn’t affect engineering—only their viability matters. Would not allocate resources.  
  - **Selection/Brittleness**: Partially absorbed into Robust Recognition (#2). Standalone refinement of equilibria is less urgent than ensuring equilibria exist at all.  

  ### Criteria Weighting  
  - **Downstream > Upstream > Neglectedness > Tractability**: If an answer changes policy (e.g., "never allow weight-sharing"), it jumps the queue. Upstream questions block others (e.g., without transparency, recognition is moot).  
  - **Interdependence**: Transparency (#1) enables progress on Recognition (#2) and Delegation (#3). Scope (#4) is last because it requires functional mechanisms first.  

  ### What Moves the Needle in 2 Years  
  - **Boost #1 if**: Empirical ML shows transformers *can/cannot* learn to exchange robust commitments (e.g., via chain-of-thought or activation editing).  
  - **Boost #2 if**: Heterogeneous-agent simulations reveal recognition heuristics that scale.  
  - **Drop #3 if**: Transparency (#1) fails—delegation becomes irrelevant.  

  ### Framing Critique  
  The mandate is sound, but:  
  - **Allow Tiny Experiments**: Permit *protocol tests* (e.g., does a 2-layer NN playing a commitment game converge?). This isn’t "empirical ML" but stress-tests theory.  
  - **Output Judgment**: Yes, judge by practical impact—but define "impact" as "changes what theorists *should* assume" if policy is premature.  

  ### Resource Allocation (6 people, 3 years)  
  - **Years 1–2**: 3 people on #1 (Transparency), 2 on #2 (Recognition), 1 on #3 (Delegation).  
  - **Year 3**: Shift 2 from #1 to #4 (Generalization) if #1 succeeds; else pivot to salvage operations.  

  This agenda assumes **cooperation is possible but fragile**. If Year 1 disproves transparency (#1), the group should refocus on *non-program-based cooperation mechanisms* (e.g., evolutionary dynamics) or failure modes.
