prompt: |-
  I'm one of two people who keep the code of conduct for a professional association of estate agents, about five thousand members. Maybe thirty times a year someone writes in to ask whether a move is on: can I tell a buyer there's another offer when there isn't one yet, can I show buyers only our own listings unless they ask, can I hold back a bid that came in after the deadline in case the first one collapses. Right now we argue it out and vote, and near-identical cases come out differently depending on who's in the room, so I went looking for something better and kept landing on Kant's universalization test, which feels like it should be usable here except that every version I find is either a slogan or a seminar.

  What I need is an actual procedure. How to get from a member's self-serving description of what they want to do to a maxim stated at a fixed level of generality, with a rule for how general to make it and when to widen or narrow it — this looks like the step where everything gets decided, since 'I'll be vague about competing offers', 'I'll mislead a buyer', and 'I'll lie about whether an offer exists' are the same bit of behaviour and I assume they don't all come out the same. Then the tests, in the order we should run them, and where each one stops us with a no.

  Three wrinkle types keep coming up and I want the procedure to handle them rather than leave them to judgment. Some moves only work because most people don't make them: turning up early to an open house to get to the seller before anyone else is fine if nobody else does it and useless if everyone does, and I can't tell whether that counts against it. Some moves destroy the thing they depend on: if every agent said 'that's our final price' and meant nothing by it, the sentence wouldn't do any work any more, so once universal the maxim can't even be carried out — is that the same failure as the first kind or a different one? And some seem to fail only when you picture being on the receiving end: a world where every agent pressures buyers to sign quickly is perfectly thinkable, I just wouldn't want to be the buyer in it.

  Constraints: two weeks a ruling, one paragraph of plain language with no philosophy jargon in it, written by me and one other person, and it has to sit okay beside the couple hundred rulings we've already published, some of which I suspect are wrong. Give me the steps, what counts as a good enough answer at each, the points where it hands the call back to us because it's a values question rather than something the test settles, and the cases where it just runs out. Then run it on three live queries, including one where you expect it to rule against something we currently permit: telling a buyer 'there's interest in the property' when no offer actually exists is our present guidance and I'd like to see whether it survives you.
reasoning: |-
  Okay, this user is part of a professional association handling ethics rulings for real estate agents. They're struggling with inconsistent decisions on cases like bluffing about offers or selective property showings. They've stumbled upon Kant's universalization test but need a practical, step-by-step procedure to apply it consistently. 

  First, I need to unpack their core frustration: near-identical cases getting different rulings based on who's voting. That's undermining their credibility. They want a mechanical process that removes subjectivity, especially around three thorny issues: 
  - Tactics that only work if rare (like early access to sellers)
  - Practices that self-destruct if universalized (fake "final offers")
  - Scenarios that feel exploitative but are logically consistent (high-pressure sales)

  The constraints are brutal: two-week turnaround, plain language rulings, backward compatibility with existing guidance, and no philosophy jargon. Plus they suspect some past rulings are wrong—that's a landmine. 

  Hmm... Kant's test is perfect in theory but notoriously slippery in practice. The maxim-formulation problem is real—"vague about offers" vs "lie" changes everything. I'll need to give them concrete wording rules like: 
  - Include the goal (e.g., "to close a sale")
  - State the means precisely ("say 'there's interest' when no offer exists")
  - Specify the actor ("as a listing agent")

  For the universalization steps, I'll break it into three clear tests: 
  1. Logical contradiction (would the practice implode if everyone did it?) 
  2. Practical contradiction (would it become impossible?) 
  3. Recipient vulnerability (could you tolerate being on the receiving end?)

  The "interest" bluff example is their litmus test. Current guidance allows it, but under this test... *runs simulation*... yeah, it fails all three checks. If every agent exaggerated "interest," the phrase would become meaningless, buyers would distrust all claims, and the system would collapse. That'll force them to overturn a standing ruling—bold move. 

  For gray areas like early access to sellers, I'll build in off-ramps where the test says "This is about values, not logic." They'll appreciate that honesty. And I'll show how to phrase rulings to sound consistent with past decisions even when reversing them—"While past guidance permitted X, universal application would undermine..."

  User's clearly sharp—they spotted all the classic Kantian pitfalls. This procedure might actually work for them. Time to draft the steps plainly, then demo on their three cases.
answer: |-
  Here's a practical, step-by-step procedure based on Kant's universalization test, designed for your constraints. It handles your three wrinkle cases explicitly and includes off-ramps for values judgments. Tested on live queries at the end.

  ---

  ### **The Procedure: "The Everyone-Does-It Test"**
  **Goal:** Decide if an action is ethically permissible for all members by asking: *"What if every agent did this, in every similar situation?"*

  #### **Step 1: Fix the Maxim (The "Rule Statement")**
  *   **Task:** Rewrite the member’s question as a clear, specific rule anyone could follow.  
  *   **How to Generalize:**  
      - Include: **WHO** (agent role), **ACTION**, **CIRCUMSTANCE**, and **GOAL**.  
      - Avoid vague words ("sometimes," "if needed").  
      - *Too narrow?* If it mentions specific people/times.  
      - *Too broad?* If it hides key context (e.g., "tell buyers anything" vs. "state there are competing offers when none exist").  
  *   **Good Enough:** A neutral rule a new agent could understand and apply.  
  *   **Off-Ramp:** If you can’t state it fairly without bias, stop. The test won’t help.  

  > *Example:*  
  > Member Query: *"Can I tell a buyer ‘there’s strong interest’ if I have no actual offers?"*  
  > **Maxim:** *"A listing agent, when marketing a property with no written offers, may tell potential buyers ‘there is strong interest’ to encourage a higher/faster offer."*

  #### **Step 2: Test 1 - The Self-Destruct Test**  
  *   **Task:** Imagine a world where **every agent follows this rule, every time it applies**.  
  *   **Ask:** Would the agent’s **GOAL** become **impossible to achieve** because the system breaks?  
  *   **Failure (NO):** If universal use makes the tool/action useless or backfires.  
      - *Handles "destroys what it depends on" wrinkle.*  
  *   **Good Enough:** Clear cause/effect (e.g., "If all agents do X, then Y happens, so goal Z fails").  
  *   **Off-Ramp:** If the effect is unclear (e.g., depends on market conditions), stop. Requires judgment.  

  > *Example (Interest Bluff):*  
  > If *every* agent says "there’s strong interest" on *every* listing with no offers:  
  > → Buyers learn "strong interest" = no real offers.  
  > → Phrase loses power to pressure buyers.  
  > → **Goal fails** (can’t encourage higher/faster offers).  
  > **→ FAILS SELF-DESTRUCT TEST.**  

  #### **Step 3: Test 2 - The Fairness Test**  
  *   **Task:** Could you **accept being on the receiving end** of this rule if you were the buyer/seller/other agent?  
  *   **Ask:** Does universal use create a **system you’d rationally opt into** if you didn’t know your role (agent/buyer/seller)?  
  *   **Failure (NO):** If it creates exploitation, unavoidable harm, or destroys trust necessary for the market.  
      - *Handles "I wouldn’t want to be the buyer" wrinkle.*  
  *   **Good Enough:** No need for empathy—focus on rational self-interest in a fair system.  
  *   **Off-Ramp:** If trade-offs are balanced (e.g., efficiency vs. risk), stop. Values call.  

  > *Example (Interest Bluff):*  
  > Buyers systematically misled about competition → lose trust in agents → market becomes adversarial/inefficient.  
  > No rational buyer/seller would choose this system.  
  > **→ FAILS FAIRNESS TEST.**  

  #### **Step 4: Test 3 - The Free-Rider Test**  
  *   **Task:** Does this **only work if most agents DON’T do it**?  
  *   **Ask:** If everyone did it, would it become **ineffective or harmful to all**?  
      - *Handles "only works if rare" wrinkle.*  
  *   **Failure (YES → NO):** If it requires others’ restraint to succeed.  
  *   **Good Enough:** Clear that the tactic relies on asymmetry (e.g., "If only I do it, I win; if all do it, everyone loses").  
  *   **Off-Ramp:** If rarity doesn’t affect the action’s ethics (e.g., innovative marketing), skip.  

  > *Example (Early Access):*  
  > *Member Query: "Can I arrive early at an open house to privately pitch the seller on listing with me?"*  
  > **Maxim:** *"An agent may arrive before a scheduled open house to privately solicit the seller for a future listing."*  
  > If ALL agents do this:  
  > → Sellers get mobbed pre-open house.  
  > → Open houses become chaotic; sellers annoyed.  
  > → Agents waste time competing for early access.  
  > **→ FAILS FREE-RIDER TEST (only works if rare).**  

  ---

  ### **When the Test "Runs Out"**
  1.  **Values Conflicts:** If trade-offs involve competing goods (e.g., "speed vs. transparency"), the test flags it but can’t decide. *Your ruling must then explicitly state the trade-off.*  
  2.  **Ambiguous Maxims:** If you can’t agree on how to fairly state the rule.  
  3.  **No Contradiction:** If the action passes all tests cleanly (rare for edge cases).  

  ---

  ### **Rulings on Live Queries**
  **Format:** Plain English paragraph citing the test.  

  #### **Query 1: "Can I tell a buyer ‘there’s interest’ if no offer exists?"**  
  > *Current Guidance: Permitted.*  
  > **Test Result: PROHIBITED**  
  > *Ruling:*  
  > "Agents must not state there is ‘interest,’ ‘offers,’ or similar implying competition unless a written offer exists. If all agents inflated buyer interest, the practice would lose its power to motivate buyers, and trust in market transparency would erode. Buyers could not make informed decisions, harming the profession’s integrity."  

  #### **Query 2: "Can I hold back a late bid if the first offer looks shaky?"**  
  > **Maxim:** *"A listing agent may withhold a post-deadline offer from the seller until the primary offer fails, to avoid complicating negotiations."*  
  > **Test Result: PROHIBITED**  
  > *Ruling:*  
  > "All offers must be presented to the seller promptly upon receipt, regardless of timing or the status of other offers. If agents universally withheld ‘backup’ offers, sellers could miss viable opportunities, and buyers would lose confidence in bid deadlines. This undermines the duty of best representation."  

  #### **Query 3: "Can I show buyers only my listings unless they ask about others?"**  
  > **Maxim:** *"A buyer’s agent may initially show only their own agency’s listings to clients, disclosing other options only if the client asks."*  
  > **Test Result: PROHIBITED**  
  > *Ruling:*  
  > "Agents must proactively present all suitable listings meeting a buyer’s criteria, regardless of affiliation. If all agents prioritized their listings, buyers would receive incomplete market information, disadvantaging sellers without agency representation and violating the duty to serve the client’s best interest."  

  ---

  ### **Key Advantages for Your Context**
  1.  **Consistency:** Fixes "who’s in the room" problem by using fixed tests.  
  2.  **Plain Language:** "Self-destruct," "Fairness," and "Free-Rider" are intuitive.  
  3.  **Handles Wrinkles:** Explicitly addresses your three edge cases.  
  4.  **Backward Compatibility:** Rulings reference systemic harm/professional integrity—aligns with most existing guidance. Overrules past errors by showing universal harm (e.g., "interest" bluffs).  
  5.  **Speed:** Once maxim is set, tests run in minutes.  

  **Final Tip:** When writing rulings, always link the failure to a core duty (e.g., "undermines trust," "harms market transparency"). This grounds Kant in professional norms, easing integration with past rulings.
