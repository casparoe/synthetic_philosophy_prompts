  *But reach and stand, in balance set,*  
  *Outpace the salvage, dim the sighs.*  
  I match the center’s sharp demand.  
  I turn to flank the sunlit prize.  
  *Reclaim the shadows, shift the sands.*  

  *Stanza 3*  
  I stoop for salvage, cast my eyes.  
  *Now reach and stand, in balance set,*  
  *Outpace the salvage, dim the sighs.*  
  I match the center’s sharp demand.  
  *Yet shadows shift where salvage dies.*  
  I turn to flank the sunlit prize.  

  *Stanza 4*  
