prompt: |-
  I'm a journalist working on a long feature about sortition — the selection of political officeholders by lot — and I keep watching the same two camps talk past each other. One camp, the lottocrats, holds that elections are defective as an instrument for producing good law: voters are rationally ignorant, the incentives of electoral competition reward pandering and short horizons, the people who end up in legislatures are unrepresentative along axes that matter, and money buys agenda-setting and access. Their remedy is a legislature composed of randomly selected citizens serving staggered terms, working in small facilitated groups with expert testimony, supported by staff, with elections either abolished or confined to a weak agenda-setting role. The other camp, the electoral democrats, grants most of that diagnosis and still thinks elections carry goods that sortition cannot supply: the authorization of a specific person to act in my name, the retrospective sanction of removal, the expression of a collective will at a determinate moment, and a kind of answerability that no rotation of amateurs can replicate. They are happy to defend citizens' assemblies and deliberative polls as advisory complements to the electoral system and hostile to replacing it. I want the document these two should have produced after a year of good-faith argument, and I want to run it as a sidebar: the things they can both sign, and then the disagreement made exact.

  Please draft that joint statement. Section 1, numbered, should be the agreed claims — about what elections measurably fail to do, about what the existing record of citizens' assemblies does and does not establish, about what sortition is a claim about (composition, deliberation, independence from donors) and what it is not. Keep them non-vacuous: I want sentences neither camp could dismiss as filler. Section 2 should be a table of the residual disagreements, each row giving the question, then the lottocrat's own preferred formulation and the electoral democrat's, each phrased sharply enough that its own side would sign it without flinching, plus a note on whether the disagreement is genuinely substantive or rests on an unstated difference in what words like representation, accountability, and democracy are being used to mean — and where it is verbal, say exactly which term is doing the work.

  For each genuine disagreement I want the crux stated as a question that could in principle be settled, and then the test, case, or evidence both sides would agree bears on it, with each camp's prediction written down in advance and a note on which side would be more embarrassed by being wrong. I have four institutional devices I'd like them to rule on, since a camp's principles sometimes cut against its instincts: (a) the twin-panel test, in which two independently drawn random bodies deliberate the same question in parallel with identical materials, to measure how much of an outcome is attributable to the particular composition rather than to the procedure; (b) the shadow assembly, a random body that is drawn and briefed but convened only if the sitting chamber fails to reach a supermajority, which makes the threat of replacement latent rather than actual; (c) the priced opt-out, under which a selected member may decline by paying a fee scaled to income or by performing an equivalent period of other public service, which puts a number on the burden of service and on who can actually afford to serve; and (d) a staff-rotation rule paired with competing expert briefs, so that no permanent bureaucracy or single expert faction faces a chamber of newcomers alone. For each device, give me which camp should favor it given its own stated principles, and flag any case where a camp's principles pull against what its partisans would actually want. Close the statement with what each side would count as evidence against its own view, and whether there is anything both agree would actually move the debate rather than confirm what each already believed.

  Please don't cite papers, name authors, or attribute findings — I'll do that reporting myself, and I don't want anything in the piece that depends on a source I'd have to check. Nothing here should require looking anything up; I want the argumentative structure. Around 1,200 words for the statement.

  After the statement, give me a single JSON object I can use to build a structured graphic, with this schema: agreed_claims (array of objects with id, claim, why_both_sign); disagreements (id, question, lottocrat_formulation, electoral_democrat_formulation, genuine_or_verbal, diagnosis); cruxes (id, crux, linked_disagreement_ids, test_or_case, lottocrat_prediction, electoral_democrat_prediction, who_is_more_surprised_if_wrong); institutional_devices (device, lottocrat_verdict, electoral_democrat_verdict, reasoning, where_principles_cut_against_instinct); falsifiers (lottocrat_disconfirmation, electoral_democrat_disconfirmation, shared_movers); verbal_disputes (term, resolution); bottom_line_for_readers (one or two sentences, written for a general audience that has never heard the word sortition).
reasoning: |-
  We are drafting a joint statement between lottocrats and electoral democrats. The statement has two sections: agreed claims and residual disagreements. We then have institutional devices, and finally disconfirming evidence and a bottom line.

  Section 1: Agreed Claims (non-vacuous, numbered)
  We list points both sides agree on. They should be substantive and not filler.

  1. Elections systematically produce legislatures that are unrepresentative of the public in terms of socioeconomic status, prior political engagement, and demographic characteristics that correlate with policy preferences.
     Why both sign: Both camps acknowledge that elected bodies are skewed and that this skew matters for policy outcomes.

  2. The incentives of electoral competition reward short-term policy horizons and pandering to swing voters or donors, often at the expense of long-term public goods.
     Why both sign: Both agree that the re-election motive distorts legislative behavior.

  3. Citizens' assemblies and deliberative polls have demonstrated that randomly selected citizens, when provided with balanced information, adequate time, and professional facilitation, can engage in high-quality deliberation on complex policy issues.
     Why both sign: Empirical evidence from existing experiments (without needing to cite) is accepted by both.

  4. The current system of campaign finance and lobbying grants disproportionate agenda-setting power and access to wealthy individuals and organized interests, which distorts policy outcomes.
     Why both sign: Both camps critique the role of money in politics.

  5. Sortition, as proposed for legislative functions, is primarily a claim about the composition of the decision-making body and its independence from electoral pressures and donor influence; it is not a claim that randomly selected citizens would make better decisions without support structures (staff, experts, facilitation).
     Why both sign: Both understand that lottocrats do not advocate for a body without resources.

  6. The existing record of citizens' assemblies does not establish that a standing legislature by lot would be stable over multiple terms, resistant to internal or external capture, or capable of handling the full range of legislative functions (including urgent and unforeseen matters).
     Why both sign: Lottocrats acknowledge the lack of long-term evidence; electoral democrats point to this gap.

  7. Elections provide a clear mechanism for the retrospective sanction of representatives by removal from office, which is absent in a pure sortition system with fixed terms and no re-selection.
     Why both sign: Lottocrats recognize this as a feature of elections; electoral democrats emphasize it.

  8. Both systems face a trade-off between the depth of deliberation and the speed of decision-making; neither has a monopoly on efficiency or wisdom.
     Why both sign: Both acknowledge practical constraints.

  Section 2: Residual Disagreements (as a table, but in text we'll list with the required elements)

  We present each disagreement as:
  - The question
  - Lottocrat's formulation (sharp, they'd sign)
  - Electoral democrat's formulation (sharp, they'd sign)
  - Note on whether it's substantive or verbal (and if verbal, which term is key)

  Then, for substantive disagreements, we add:
  - The crux as a question that could be settled
  - The test or evidence that bears on it
  - Predictions of each camp
  - Which side would be more embarrassed if wrong

  We'll structure the disagreements as follows:

  Disagreement 1: On the nature of representation
  Question: What constitutes legitimate representation?
  Lottocrat formulation: Representation is achieved when the demographic and attitudinal composition of the decision-making body mirrors the population, ensuring that the diversity of lived experiences is present in deliberation.
  Electoral democrat formulation: Representation requires authorization by the voters through a choice among alternatives and the capacity for retrospective judgment, which is only achieved through elections.
  Genuine or verbal: Partly verbal (on the meaning of "representation") and partly substantive. The key term is "representation" — for lottocrats it's descriptive, for electoral democrats it's accountability-based.

  Disagreement 2: On accountability
  Question: How is accountability best achieved?
  Lottocrat formulation: Accountability is achieved ex ante by the random selection of a microcosm of the people and ex post by the public deliberation and transparency of the body, with the threat of future assemblies overturning decisions.
  Electoral democrat formulation: Accountability requires the direct ability of the people to remove specific officeholders who have violated their trust, which only elections provide.
  Genuine or verbal: Substantive, but also involves the meaning of "accountability".

  Crux: Can transparency and deliberation in a sortition body provide an effective substitute for the threat of removal by election?
  Test: Compare policy outcomes in a long-running citizens' assembly (or a series of them) with an elected body on (a) responsiveness to public opinion shifts and (b) resistance to capture by special interests. Measure public trust and perceived legitimacy.
  Lottocrat prediction: The sortition body will be more responsive to broad public opinion (because it is representative) and less captured (because of independence from donors) and will maintain high trust.
  Electoral democrat prediction: Without the threat of removal, the sortition body will become unresponsive or captured over time, and public trust will decline.
  Who is more embarrassed: Lottocrats if trust declines and capture occurs; electoral democrats if trust remains high and responsiveness is superior.

  Disagreement 3: On collective will
  Question: How is the collective will expressed?
  Lottocrat formulation: The collective will is best discerned through inclusive, deliberative processes that transform preferences, rather than through aggregating pre-existing preferences in a vote.
  Electoral democrat formulation: The collective will is expressed at a specific moment by the majority in an election, which authorizes a government to act until the next election.
  Genuine or verbal: Substantive.

  Crux: Does deliberation in a microcosm of the population lead to decisions that are more aligned with the considered judgment of the whole population than elections do?
  Test: Run a citizens' assembly on a policy issue and compare its final decision with both the pre-deliberation opinion of the public and the decision of an elected body on the same issue. Then, poll the public on the decision (after explaining the reasoning) to see if they agree with the assembly's output more than the elected body's.
  Lottocrat prediction: The assembly's decision will align better with the post-deliberation public opinion and will be seen as more legitimate.
  Electoral democrat prediction: The elected body's decision will align better because it was authorized by an election, and the public will trust it more.
  Who is more embarrassed: Lottocrats if the assembly's decision is less aligned and less trusted; electoral democrats if the opposite.

  Disagreement 4: On the role of expertise
  Question: How should expertise inform legislation?
  Lottocrat formulation: Expertise should be presented in balanced, competing briefs to a representative body of laypersons who then deliberate, avoiding the capture by permanent bureaucracies or elite consensus.
  Electoral democrat formulation: Elected representatives, through experience and access to expert staff, develop the expertise to evaluate complex issues and are better positioned to resist fleeting public passions.
  Genuine or verbal: Substantive.

  Now, institutional devices:

  (a) Twin-panel test: Two independent random bodies deliberate the same question in parallel with identical materials. Measures the role of composition vs procedure.
  - Lottocrat verdict: Favor. It tests the robustness of the deliberative process and might show that the procedure drives outcomes more than the particular group.
  - Electoral democrat verdict: Acceptable. It can help assess the reliability of citizens' assemblies, but note that for a standing legislature, the dynamics might differ.
  - Principles vs instincts: Lottocrats might worry that if outcomes vary a lot, it undermines the claim of reliability, but their principles require testing.

  (b) Shadow assembly: A random body drawn and briefed but convened only if the sitting chamber fails to reach a supermajority.
  - Lottocrat verdict: Oppose. It leaves the electoral system in place and might never be used, but the threat might be a step toward sortition. However, it doesn't replace elections.
  - Electoral democrat verdict: Favor. It provides a backup that can break deadlocks and adds a deliberative element without replacing elections.
  - Principles vs instincts: Lottocrats' principles push for full replacement, so this is a half-measure. Electoral democrats might fear it could undermine the legitimacy of the elected body.

  (c) Priced opt-out: Selected members may decline by paying a fee scaled to income or by performing equivalent public service.
  - Lottocrat verdict: Favor. It makes the burden explicit and ensures that those who serve are willing and compensated, while the fee ensures that opting out is not trivial but not prohibitive.
  - Electoral democrat verdict: Oppose. It creates a de facto class barrier, as the wealthy can buy their way out, and the burden falls disproportionately on the less wealthy who might not afford the fee or time for service.
  - Principles vs instincts: Lottocrats want to maximize participation and representativeness, but this might undermine it. The fee scaling might mitigate, but the electoral democrat objection is principled.

  (d) Staff-rotation rule with competing expert briefs: Prevents a permanent bureaucracy or single expert faction from dominating.
  - Lottocrat verdict: Strongly favor. It ensures that the assembly is exposed to diverse viewpoints and is not captured by staff.
  - Electoral democrat verdict: Acceptable. But they might argue that elected representatives, with experience, can manage staff better and that rotation might lead to loss of institutional memory.
  - Principles vs instincts: Both might agree in theory, but electoral democrats might see less need because they trust elected representatives to oversee staff.

  Falsifiers (what would disconfirm each side's view):

  Lottocrat disconfirmation: If a well-resourced citizens' assembly, operating under ideal conditions, consistently produced decisions that were less trusted by the public than those of elected bodies, or if it became clear that such bodies were easily captured by external interests or internal factions.

  Electoral democrat disconfirmation: If a series of citizens' assemblies, even on complex and long-term issues, produced decisions that were widely regarded as more legitimate and effective than those of elected bodies, and if these bodies maintained high public trust over time without any possibility of removing members.

  Shared movers: Evidence from a long-term, large-scale sortition body (like a regional legislature) that handles a full range of issues and is compared with a similar electoral system.

  Verbal disputes: 
  - Representation: For lottocrats, descriptive; for electoral democrats, accountability-based. Resolution: Clarify which sense is being used in a given context.
  - Accountability: Lottocrats emphasize transparency and reason-giving; electoral democrats emphasize removability. Resolution: Distinguish between types of accountability (deliberative vs electoral).

  Bottom line for readers: 
  Sortition is the idea of picking lawmakers by lottery instead of election. Supporters argue it would make government more representative and less corruptible; opponents say elections, despite flaws, remain essential for holding leaders accountable. Both sides agree that our current system is flawed, but they disagree on whether a government run by ordinary citizens chosen at random could work.

  Now, we write the joint statement with the above in mind. We aim for about 1200 words.

  JOINT STATEMENT

  Section 1: Agreed Claims

  1. Elections consistently produce legislatures that are unrepresentative of the general public in terms of income, education, race, gender, and prior political experience, leading to policy biases that favor the overrepresented groups.

  2. The re-election incentive in electoral systems systematically prioritizes short-term gains and visible benefits over long-term challenges and diffuse costs, often resulting in policy failure on issues requiring sustained investment or deferred gratification.

  3. Existing experiments with citizens' assemblies and deliberative polls demonstrate that randomly selected citizens, when provided with adequate time, resources, balanced information, and skilled facilitation, can deliberate complex policy issues and produce coherent, well-reasoned recommendations.

  4. Wealthy individuals and organized interest groups wield disproportionate influence in electoral systems through campaign donations and lobbying, distorting policy agendas and outcomes in ways that do not reflect the preferences of the median citizen.

  5. The core claim of sortition for legislative functions is that a randomly selected body, properly supported, can achieve descriptive representation and deliberative independence from electoral and donor pressures; it is not a claim that such a body would function without expert support or institutional scaffolding.

  6. The track record of short-term citizens' assemblies does not provide evidence for the stability, resilience against capture, or capacity for emergency decision-making of a standing legislature by lot operating over multiple years.

  7. Elections provide a unique mechanism for retrospective accountability through the possibility of removing specific officeholders, a feature absent in sortition systems with fixed, non-renewable terms.

  8. Both electoral and sortition-based systems face inherent trade-offs between deliberation and decisiveness, and neither can claim superior efficiency across all contexts.

  Section 2: Residual Disagreements

  We now turn to the points of divergence, presented as contrasting positions on key questions.

  Question 1: What constitutes legitimate political representation?
  - Lottocrat formulation: Legitimate representation is achieved when the decision-making body descriptively mirrors the population, ensuring that every significant segment of society is present and heard in the deliberation.
  - Electoral democrat formulation: Legitimate representation requires that voters authorize specific individuals to act on their behalf and retain the power to remove them, which is only possible through competitive elections.
  - Diagnosis: This disagreement is partly verbal (turning on the definition of "representation") and partly substantive. The verbal aspect centers on whether representation is defined by resemblance or by authorization and accountability.

  Question 2: How is accountability best secured?
  - Lottocrat formulation: Accountability is secured through transparent deliberation and the requirement that decisions be justified to the public, supplemented by the possibility of future assemblies revisiting decisions; the random selection ensures that the body is a microcosm of the public and thus inherently accountable.
  - Electoral democrat formulation: Accountability requires the direct ability of citizens to remove officeholders who fail to represent their interests, which only elections provide; without this sanction, representatives have no incentive to be responsive.
  - Diagnosis: Substantive, with a verbal component on the meaning of "accountability". The crux is whether transparency and deliberation can substitute for the threat of removal.

  Crux for Disagreement 2: Can a sortition-based legislature maintain responsiveness and resist capture without the threat of electoral removal?
  Test: Establish a long-term citizens' assembly (or a series of them) with legislative power in a limited jurisdiction and compare its performance to an elected body on: (a) responsiveness to shifts in public opinion (measured by polling) and (b) vulnerability to capture by special interests (measured by policy outcomes favoring narrow vs broad interests). Also track public trust in the body over time.
  Lottocrat prediction: The sortition body will be more responsive to broad public opinion (due to its descriptive representativeness) and less captured (due to independence from donors), maintaining high public trust.
  Electoral democrat prediction: Without the threat of removal, the sortition body will become unresponsive and captured, and public trust will erode.
  Who is more embarrassed if wrong: Lottocrats if trust declines and capture occurs; electoral democrats if trust remains high and responsiveness is superior.

  Question 3: How is the collective will best expressed?
  - Lottocrat formulation: The collective will is best discerned through deliberative processes that transform individual preferences into public-spirited decisions within a representative microcosm of the population.
  - Electoral democrat formulation: The collective will is expressed at a specific moment through the aggregation of votes in an election, which confers a mandate for governance until the next election.
  - Diagnosis: Substantive.

  Crux for Disagreement 3: Does deliberation in a randomly selected body lead to decisions that better reflect the considered judgment of the whole population than decisions made by elected representatives?
  Test: On a specific policy issue, convene a citizens' assembly and have an elected body (or committee) deliberate separately. Measure public opinion before and after deliberation (with the public informed of the reasoning). Then compare which body's decision is closer to the post-deliberation public opinion and which is more trusted.
  Lottocrat prediction: The citizens' assembly's decision will align better with the public's considered judgment and be more trusted.
  Electoral democrat prediction: The elected body's decision will be more aligned and trusted because it was authorized by an election.
  Who is more embarrassed: Lottocrats if the assembly's decision is less aligned and trusted; electoral democrats if the opposite.

  Question 4: What role should expertise play in legislation?
  - Lottocrat formulation: Expertise should inform legislation through balanced, competing briefs presented to a lay assembly, which then deliberates, preventing domination by any single expert faction or permanent bureaucracy.
  - Electoral democrat formulation: Elected representatives, through experience and continuous access to experts, develop the judgment to evaluate complex issues and are better shielded from transient popular pressures than a rotating body of amateurs.
  - Diagnosis: Substantive.

  Institutional Devices:

  (a) Twin-panel test: 
  - Lottocrat verdict: Favor. It tests the robustness of the deliberative process and can isolate the effect of composition. Principles align: if outcomes are similar across panels, it supports the reliability of the procedure.
  - Electoral democrat verdict: Acceptable as a research tool, but caution that for a standing legislature, the dynamics might differ. Principles: supports evidence-based design.
  - Where principles cut against instincts: Lottocrats might be uneasy if outcomes vary widely, but their commitment to evidence requires the test.

  (b) Shadow assembly:
  - Lottocrat verdict: Oppose. It does not replace elections and might entrench the status quo. Principles: sortition should be primary, not a backup.
  - Electoral democrat verdict: Favor. It adds a deliberative safety valve without dismantling electoral accountability. Principles: complements rather than replaces elections.
  - Where principles cut against instincts: Electoral democrats might fear that the shadow assembly could undermine the elected body's legitimacy, but their principles support advisory bodies.

  (c) Priced opt-out:
  - Lottocrat verdict: Conditionally favor. It makes the burden transparent and compensates those who serve. The fee scaling ensures fairness. Principles: want high participation but recognize practical barriers.
  - Electoral democrat verdict: Oppose. It creates a financial barrier to service, leading to underrepresentation of the poor. Principles: equality of civic duty.
  - Where principles cut against instincts: Lottocrats want representativeness, and this might harm it, but the opt-out is necessary for feasibility.

  (d) Staff-rotation with competing briefs:
  - Lottocrat verdict: Strongly favor. Prevents bureaucratic capture and ensures diverse expert input. Principles: independence and balanced information.
  - Electoral democrat verdict: Acceptable, but caution that rotation may sacrifice institutional memory. Principles: expertise should be accessible but managed by experienced representatives.
  - Where principles cut against instincts: Electoral democrats might prefer stable staff to support elected representatives, but the device aligns with their commitment to informed decision-making.

  Falsifiers:

  - Lottocrat disconfirmation: If a well-designed sortition legislature, in practice, consistently produced decisions that were less trusted by the public than those of elected bodies, or if it proved vulnerable to capture by bureaucrats, experts, or outside interests.

  - Electoral democrat disconfirmation: If a sortition legislature, operating over time, produced decisions that were widely seen as more legitimate and effective than those of elected bodies, and maintained high levels of public trust and resistance to capture without any possibility of removing members.

  - Shared movers: Evidence from a real-world implementation of a sortition-based legislature at a significant scale (e.g., a regional or national level) that handles a full range of legislative functions over multiple terms.

  Verbal Disputes:

  - Term: "Representation". Resolution: Use "descriptive representation" for sortition's claim and "accountability-based representation" for elections.
  - Term: "Accountability". Resolution: Specify whether referring to retrospective sanction (removal) or deliberative justification.

  Bottom Line for Readers:
