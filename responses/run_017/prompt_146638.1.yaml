answer: |-
  Here’s a refined list of requirements for an adequate theory of dreaming, stripped of camp-specific biases and aligned with your purpose of licensing/refusing inferences from reports/behavior to conscious experience. Requirements are categorized as **non-negotiable** (essential for any theory using dream reports as scientific data) or **contested** (where Malcolm/Dennett/degraded-simulation views diverge). Cases illustrate each requirement.

  ---

  ### **Non-Negotiable Requirements**  
  *(Essential for scientific utility of dream reports)*  
  1. **Epistemic Account of Reports**  
     - Must explain *what dream reports are evidence of* (e.g., past experience, post-awakening construction, or both) and *how memory decay, deferred construction, or state-shift distortion affects reliability*.  
     - *Case*: Fragmentation protocol (20-second awakenings) – can it reveal "real-time" experience, or only narrative stitching?  

  2. **Scope: Full Phenomenological Range**  
     - Must address all empirically attested dream-like states: REM/NREM dreams, white dreams ("something happened" without content), lucid dreams (with signaling), hypnagogia, nightmares, and pathological enactment (e.g., RBD).  
     - *Case*: White dreams – are they degraded experiences, memory failures, or non-experiences?  

  3. **Subject-Side Oddities**  
     - Must explain dreams lacking a unified standpoint (observer/participant shifts), dreams in congenital blindness, and dreams reported by individuals denying wakeful imagery.  
     - *Case*: Congenital blindness – if visual dream reports occur, are they genuine experiences or confabulations?  

  4. **Respect Key Distinctions**  
     - Must clearly separate:  
       - (a) *Having an experience* vs. *seeming to remember one*.  
       - (b) *Dreaming (process)* vs. *a dream (product)*.  
       - (c) *Whether experience occurred* vs. *what was experienced*.  
     - *Case*: A sleeper awakens claiming "I was dreaming but recall nothing" – does this imply an experience occurred?  

  5. **First-Person Authority + Fallibility**  
     - Must accommodate the subject’s privileged access *while* allowing for errors (e.g., false belief that one dreamt).  
     - *Case*: A sleeper insists they had no dreams, but physiological data suggests REM sleep with eye movements correlating to reported content in others.  

  6. **Lucid Dreaming with Signaling**  
     - Must explain how pre-agreed signals from verified sleep (e.g., eye movements) relate to experience. Does signaling confirm real-time experience or only retrospective judgment?  
     - *Case*: A lucid dreamer signals "yes, I’m dreaming now" during polysomnography.  

  ---

  ### **Contested Requirements**  
  *(Where theories diverge significantly)*  
  7. **Determinacy of Experience**  
     - Must specify whether "Did an experience occur?" *always* has a yes/no answer, or if indeterminacy/degraded cases are possible.  
     - *Contested*: Malcolm rejects the question; Dennett allows indeterminacy; degraded-simulation views demand it.  
     - *Case*: "Aborted simulations" – is "partial experience" coherent?  

  8. **Temporal Structure**  
     - Must clarify whether dreams unfold in real-time or are compressed/reconstructed.  
     - *Contested*: Malcolm denies temporal extension; Dennett’s cassette theory implies post-hoc insertion.  
     - *Case*: Fragmentation protocol – if reports stitch seamlessly, does this imply real-time continuity?  

  ---

  ### **Key Tensions & Exclusions**  
  - **The Incompatible Triad**:  
    🔹 **Reports are the only evidence**  
    🔹 **Reports are inherently unreliable** (per the theory’s own account)  
    🔹 **Every dream has a determinate verdict**  
    → *These cannot all be true*. A theory must reject one (e.g., Malcolm rejects 🔹&🔹; Dennett rejects 🔹).  
    - **Most Exclusionary Requirement**: **Respecting the experience/memory distinction** (🔹4a). This excludes:  
      - Malcolm (denies experience can be separated from report)  
      - Dennett’s cassette theory (equates experience with recall)  
      - Naïve realism about reports.  

  ---

  ### **Scorecard of Theories**  
  | **Requirement**               | **Malcolm** | **Dennett** | **Degraded-Simulation** |  
  |-------------------------------|-------------|-------------|-------------------------|  
  | 1. Epistemic Account          | ✘ (Denies evidence) | △ (Unreliable construction) | ✓ (Degraded encoding) |  
  | 2. Full Phenomenology         | ✘ (Denies most)    | ✓           | ✓                       |  
  | 3. Subject Oddities           | ✘ (Dismisses)      | ✓           | ✓                       |  
  | 4. Key Distinctions           | ✘ (Collapses)      | △ (Blurs process/product) | ✓ |  
  | 5. 1st-Person Auth. + Fallibility | ✘ (Infallible) | ✓ | ✓ |  
  | 6. Lucid Dream Signaling      | ✘ (Impossible)     | ✓           | ✓                       |  
  | 7. Determinacy                | ✘ (Question invalid) | △ (Indeterminate) | ✓ (Determinate) |  
  | 8. Temporal Structure         | ✘ (No duration)    | △ (Reconstructed) | ✓ (Real-time) |  
  **✓** = Fully Satisfied | **△** = Partially Satisfied | **✘** = Violated  

  ---

  ### **Conclusion**  
  The list reveals a core tension: **If dream reports are both the sole evidence and inherently unreliable, insisting on determinate verdicts is unscientific.** This excludes Malcolm (rejects evidence) and Dennett’s early cassette theory (denies real-time experience), while degraded-simulation views struggle with lucid signaling. A viable theory must either:  
  (1) Accept report indeterminacy (Dennett’s later view),  
  (2) Find supplementary evidence (e.g., neural correlates), or  
  (3) Reject the "reliability" premise (e.g., by arguing deferred construction *preserves* content).  
  Your proposed fragmentation protocol could test 🔹1 and 🔹8 but presupposes temporal experience exists – which Malcolm denies. This framework forces exposure of these commitments.
