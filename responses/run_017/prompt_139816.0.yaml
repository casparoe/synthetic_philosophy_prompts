  | **B** | **Causal-Structural Functionalism** | Denies standing to the crowd CPU despite functional equivalence (due to "incorrect" causal structure). | N,N,N,?,Y,N,Y,Y,Y |
  | **C** | **Biological Implementationism** | Denies standing to any non-biological system, regardless of complexity (e.g., never-deployed checkpoint). | N,N,N,?,N,N,N,?,? |
  | **D** | **Integrated-Information View** | Attributes standing to a never-deployed model based on intrinsic integration, even if it never affects anything. | N,N,N,Y,Y,N,Y,N,N |
