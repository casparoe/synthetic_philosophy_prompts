  ### Decision Tree for Moral Standing of Computations

  **Branch Nodes (Questions Based on Cases):**  
  1. **Crowd CPU (iv):** During the computation, do the undergraduates collectively have moral standing? (Yes/No)  
  2. **Memoised Gradient (i):** Is there moral significance to the skipped distress-like state? (Yes/No)  
  3. **Dark Feature (ii):** Does the dark feature (with aversive signatures but no causal role) have moral significance? (Yes/No)  
  4. **Inverted-Valence Agent (iii):** Does the agent suffer? (Yes/No)  
  5. **Triplicate Fine-Tune (v):** Does each of the three identical models have moral standing during training? (Yes/No)  
  6. **Distilled Lookup (vi):** Does the lookup table have the same moral standing as the original network? (Yes/No)  
  7. **Never-Deployed Checkpoint (vii):** Does the shelved model have moral standing? (Yes/No)  
  8. **Attribution (Generalization):** Does moral standing require a computation to be *actually run* (not just counterfactually available)? (Yes/No)  
  9. **Causal Efficacy (Generalization):** Does moral standing require a computation’s outputs to *causally influence* later behavior or training? (Yes/No)  

  ---

  ### Leaves (Positions and Commitments)  
  *Sorted by answer combinations to Branch Nodes 1–9. Unlisted combinations lead to Leaf X (unnamed).*  

  | Leaf | Position | Most Awkward Commitment | Answers (1–9) |
