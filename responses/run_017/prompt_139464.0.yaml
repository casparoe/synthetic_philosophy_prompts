  We are defending the restriction of the knowability principle to epistemically neutral propositions (EN(p)) as defined. The derivation is taken as a reductio of the unrestricted KP, so we start from there.

  The core of the argument for (KP-EN) is that it captures the anti-realist insight that truth is tied to our cognitive capacities without falling into the knowability paradox. Anti-realism should not require that every truth is knowable; only that the facts of the world (which are independent of our knowledge) are knowable. The contested truths (remote past, unobservable, other minds) are all EN because they are about the world independently of what we know. For example, consider a proposition about the remote past: "Caesar crossed the Rubicon in 49 BC". This is EN because its truth does not depend on what anyone knows at any time. Therefore, (KP-EN) says that if it is true, it is knowable. But note that (KP-EN) does not say that the proposition "Caesar crossed the Rubicon and no one ever knows it" is knowable, because that proposition is not EN: its truth value changes if we change the knowledge distribution (if someone were to know it, the conjunct "no one ever knows it" would be false). So (KP-EN) avoids the derivation.

