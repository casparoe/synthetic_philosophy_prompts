answer: |-
  ### The Case for Restricting Knowability to Epistemically Neutral Propositions

  The knowability derivation functions as a sound *reductio ad absurdum* of the unrestricted knowability principle (KP), establishing that KP must be rejected. However, this does not refute the core anti-realist insight that truth is constrained by our cognitive capacities. Instead, it compels a principled restriction to propositions whose truth is independent of epistemic states. This is captured by the principle (KP-EN): ∀p((EN(p) & p) → ◇Kp), where EN(p) holds iff p’s truth value is invariant across worlds differing solely in the distribution of knowledge (i.e., what is known, by whom, and when). (KP-EN) avoids contradiction because the critical proposition \( u = (q \land \neg Kq) \) is not epistemically neutral: its truth depends directly on the absence of knowledge of q, so changes in knowledge distribution alter its truth value. Hence, (KP-EN) does not apply to u, blocking the derivation.

  This restriction is not *ad hoc* but grounded in anti-realism’s essence. Anti-realism posits that truth should be tethered to evidence-accessible worldly facts. EN(p) formalises this by isolating propositions that depend *only* on non-epistemic facts (e.g., physical or historical states), excluding those self-referentially entangled with knowledge. Crucially, EN(p) does work a mere syntactic ban on K-vocabulary cannot: some propositions without K-terms (e.g., "No one believes q", if belief is non-epistemic) may still lack EN status if their truth covaries with knowledge, while EN(p) ensures immunity to epistemic perturbations. Thus, EN(p) naturally excludes Fitch-type propositions without artificial tinkering.

  (KP-EN) itself *is* epistemically neutral. Consider two worlds \( w_1 \) and \( w_2 \) with identical non-epistemic facts. EN(p) depends solely on non-epistemic facts, so p is EN in \( w_1 \) iff it is EN in \( w_2 \). Similarly, p’s truth value and knowability (◇Kp) supervene on non-epistemic facts: if p is true and EN in both worlds, the non-epistemic facts that make p true also determine whether evidence for p could exist. Consequently, (KP-EN) holds in \( w_1 \) iff it holds in \( w_2 \), satisfying EN. The defender may thus coherently claim to know (KP-EN).

  The surrogate operator objection, granting evidence-availability (W) as non-epistemic and Kp → Wp, appears to threaten (KP-EN). For EN q, \( v = (q \land \neg Wq) \) is EN (if W is non-epistemic), and the derivation yields q → Wq: conclusive evidence must be *available* for every true EN q. This is untenable—e.g., evidence for a remote past truth may be irrecoverable. The solution is to strengthen EN: redefine it as invariance under permutations of both knowledge *and* evidence-availability. This excludes v, as altering evidence distributions changes v’s truth value. The cost is marginal: EN still covers anti-realism’s target domains (e.g., the past, unobservable, other minds), as these do not reference evidence, but EN now explicitly precludes propositions sensitive to evidence states. The derivation fails, preserving (KP-EN).

  (KP-EN) sustains anti-realism’s weight. The contested truths—about the remote past (e.g., "Napoleon owned a black hat"), the unobservable (e.g., "There are oxygen molecules in Andromeda"), or other minds (e.g., "She feels pain")—are EN. Their truth hinges purely on non-epistemic facts (historical events, physical structures, mental states), not on knowledge distributions. Thus, (KP-EN) entails their knowability. For illustration: "Napoleon owned a black hat" (if true) is knowable—evidence (e.g., a diary) could have existed. However, (KP-EN) does *not* entail that "Napoleon owned a black hat and no one ever knows it" is knowable, as this lacks EN status (knowing it falsifies the second conjunct). Anti-realism is upheld where it matters, without paradox.

  The defender concedes two key points. First, non-EN truths (e.g., "There are no epistemic agents") may be unknowable. Second, (KP-EN) *cannot* support the claim that there are *no* unknown truths; it allows unknown EN truths (denying KP’s omniscience implication). But this is acceptable: anti-realism concerns the *nature* of truth, not universal knowledge.

