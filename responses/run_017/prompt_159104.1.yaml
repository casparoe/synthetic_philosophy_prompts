prompt: |-
  I run a small monthly philosophy-of-science reading group at our local library — I'm a retired GP, not an academic, and the group is mostly other retired people and a few students — and I'm trying to write up a short piece for our newsletter about an argumentative pattern I keep running into when we read popular evolutionary psychology. It started at a dinner party with a dispute about whether music is an adaptation: one guest gave a bonding-or-mating story, another said it's a byproduct, invoking the well-known cheesecake comparison, and someone else complained that the byproduct claim was just as unfalsifiable as the story it was meant to replace. What I've since noticed is how cheap the byproduct move is. When it is done properly the speaker names the trait that was actually selected for, says what the developmental or architectural connection is between that trait and the one being explained, and often says what finding would overturn the account. But very often it is done with none of that: the word spandrel, or just byproduct, or not an adaptation, is produced as a gesture, no selected trait is ever named, no constraint is described, and the move is treated as requiring no evidence of its own, while any adaptive story is held to an impossibly high standard. The failure of the adaptationist to prove her case is then quietly counted as a point in favour of the spandrel claim, and the matter is closed. I have watched exactly the same shape of argument in discussions of religion, of the human chin, of homosexuality in animals, of why we find some landscapes beautiful.

  I don't think this is just the thing Gould and Lewontin were complaining about in their 1979 paper, and that is part of what I want to get clear. Their target was over-specification: the invention of a selection narrative for everything. What I am describing is under-specification, a refusal of any narrative at all, and it seems to me to be the mirror image of that vice while being a different move. It also isn't quite the same as protecting a theory with a face-saving auxiliary assumption, though it is close: what it protects is a background suspicion that adaptationist explanation is overreaching, and it protects it from ever being tested. And it seems to me to have something in common with arguments that treat our current ignorance as if it were positive evidence, which is why I half-expected there to be an established phrase on the model of a gap argument. On the other hand, I don't want to condemn the move outright: nobody thinks the male nipple needs an adaptive story, the mechanism is obvious, and I gather that treating drift or constraint as a kind of default or null hypothesis is perfectly respectable in some contexts. So what I need is the edges, not a verdict.

  There is a second wrinkle that may or may not be the same phenomenon wearing different clothes. A trait gets labelled a spandrel, and then someone shows that it does something useful now — it has been co-opted, it is maintained by selection for something, it serves a function in the organism's current life — and the discussion immediately concludes that it was an adaptation after all, as though having a current function and having been shaped by selection for that function were the same property. Something about that slide feels like the converse error, and I can't tell whether it belongs to the pattern I described or is a separate mistake with a name of its own. So: is there an established concept for the first thing — the bare, unspecified byproduct gesture and its evidentiary asymmetry — and if there are several near neighbours, which fits best and how exactly does my case differ from each of them? If there is nothing established, please coin a term, define it tightly enough to separate the honest version from the conversation-stopping version, say what evidence would discriminate the two, and give me two or three boundary cases that fall just inside and just outside it. Please don't just hand me a reading list or tell me which authors to look up; I want the distinction carved, not a name to attach to it.
reasoning: |-
  Okay, the user runs a philosophy-of-science reading group and has noticed a problematic argument pattern in discussions about evolutionary psychology. He describes a scenario where the "byproduct" or "spandrel" claim is used without proper specification—no named selected trait, no described constraint, no falsifiability—while adaptationist explanations are held to an impossibly high standard. He wants to clarify this concept, distinguishing it from Gould and Lewontin's critique of adaptationism and other related fallacies. 

  First, I need to dissect his core concern: the asymmetrical burden of proof where the byproduct claim gets a free pass. He’s observed this in debates about music, religion, chins, etc. His analogy to "gap arguments" (like God-of-the-gaps) is apt—here, ignorance becomes evidence for the byproduct stance. But he also notes that sometimes the byproduct explanation is valid (e.g., male nipples), so he wants boundaries, not a blanket condemnation. 

  The second wrinkle involves conflating current utility with evolutionary adaptation—a separate but related error. He suspects it’s the converse fallacy (affirming the consequent). For example: if a spandrel is co-opted for a function now, people conclude it was always an adaptation. This needs disentangling from the first issue. 

  Now, for the first pattern: Is there an established term? Gould and Lewontin’s "spandrel" is often misused as a conversation-ender, but their original critique targeted excessive adaptationism, not under-specified non-adaptationism. The closest existing concepts might be: 
  - **Weak spandrelism**: Using "spandrel" as a handwave without details. 
  - **Negative adaptationism**: Assuming non-adaptation unless proven otherwise. 
  But neither fully captures the evidentiary asymmetry. 

  Coining a term feels necessary. **Spandrel drift** could work—it hints at the casual slide into unsupported claims, playing on "genetic drift." Alternatively, **phantom constraint fallacy**, emphasizing the unnamed constraint. Or **byproduct bluff**, highlighting the bluff-like lack of substance. 

  Boundary cases: 
  - **Valid**: Male nipples (developmental link to female function is clear). 
  - **Invalid**: Claiming music is a byproduct of "general intelligence" without specifying constraints or testable predictions. 
  - **Edge case**: Religion as a byproduct of theory of mind—potentially valid if the cognitive link is described, but invalid if vaguely handwaved. 

  For the second wrinkle: Conflating current function with historical adaptation is indeed the converse fallacy (or "adaptationist confusion"). It’s separate but often paired with the first pattern. 

  Key distinctions for his article: 
  1. **Honest vs. lazy spandrelism**: Does the explanation name the source trait, describe the constraint, and offer falsifiability? 
  2. **Evidence asymmetry**: Rejecting adaptation for lacking "perfect" proof while accepting bare byproduct claims. 
  3. **Boundary examples** to illustrate the line—e.g., human chin (developmental constraint vs. adaptive stories). 

  He’ll need crisp examples to show readers how to spot the difference. His GP background means he’ll appreciate clinical precision in definitions.
answer: |-
  You've pinpointed a fascinating and pernicious argumentative pattern distinct from Gould & Lewontin's target. Your analysis is sharp: this is **under-specification masquerading as explanation**, exploiting an **evidentiary asymmetry** to protect a background skepticism about adaptationism. Here's a conceptual carving, a coining, boundaries, and clarification of the second wrinkle.

  **The Core Concept: Coined Term & Definition**

  **Term:** **Phantom Constraint Fallacy** (or **Ghost Constraint Gambit**)

  **Definition:** The fallacy of invoking "byproduct," "spandrel," "non-adaptive," or "exaptation" as a sufficient explanation for a trait by *merely gesturing* at an unspecified constraint or developmental process, without:
  1.  **Naming the Putative Source Trait(s):** What specific adaptation(s) or prior structure is the byproduct *of*?
  2.  **Describing the Causal Constraint/Mechanism:** *How* does the developmental architecture, phylogeny, or physical law inevitably generate this trait as a consequence?
  3.  **Offering Falsifiable Predictions/Evidence Requirements:** What specific evidence *would* disprove this byproduct claim? What positive evidence *should* support it beyond the failure of an adaptive hypothesis?
  ...while simultaneously demanding that any adaptive hypothesis meet an unrealistically high standard of proof (e.g., identifying the precise selective pressure, genetic basis, and evolutionary trajectory across all environments).

  **Essence:** It treats the *mere label* "spandrel" as an explanatory endpoint, exploiting the *negative space* left by failed adaptationist accounts, rather than providing a positive, testable alternative model grounded in biology.

  **Distinguishing Honest vs. Fallacious Byproduct Claims**

  | Feature                     | Honest Byproduct Claim                      | Phantom Constraint Fallacy                  |
  | :-------------------------- | :------------------------------------------ | :------------------------------------------ |
  | **Named Source Trait**      | Explicitly identified (e.g., female nipples, pelvic girdle shape) | Vague or absent ("general complexity," "brain development," "evolutionary constraints") |
  | **Constraint Mechanism**    | Described (e.g., hormonal pleiotropy, developmental linkage, physical consequence of scaling) | Hand-waved ("it's just a side-effect," "inevitable consequence") |
  | **Falsifiability/Evidence** | States what evidence *against* it would look like (e.g., evidence of direct selection independent of source trait) & what positive evidence *for* it exists (e.g., developmental dependency) | Lacks specific falsifiability; relies solely on failure of adaptationist accounts; treats "not adapted" as self-evident upon failure of proof |
  | **Burden of Proof**         | Acknowledges the claim requires positive evidence/support | Implicitly shifts entire burden to adaptationists; failure of adaptation = proof of byproduct |

  **Boundary Cases: Inside and Outside**

  1.  **Just Inside (Fallacy):** "Music? Oh, it's clearly just a spandrel of general intelligence/language capacity. No specific adaptation needed; it's just what complex brains *do*." (No named source trait beyond vague "intelligence," no described constraint mechanism, no falsifiability offered, adaptive stories dismissed for not identifying "music genes" or a Pleistocene soundscape).
  2.  **Just Outside (Honest):** "The human chin? It's likely a biomechanical byproduct of the complex developmental interactions (heterochrony) reducing tooth/jaw size in modern humans relative to archaic hominins, constrained by the functional requirements of mastication and facial structure. We'd question this if chins showed strong directional sexual dimorphism indicative of mate choice, or if chinless variants had clear functional deficits independent of jaw size." (Source: jaw/tooth evolution; Constraint: developmental heterochrony; Falsifiability: specific predictions offered).
  3.  **Just Inside (Fallacy):** "Homosexuality in animals? Definitely not an adaptation; it's just a byproduct of shared neural circuits for social bonding and sexual behavior getting crossed wires. Proving it's adaptive is impossible anyway." (Source vaguely implied; Constraint hand-waved as "crossed wires"; No falsifiability; High burden placed solely on adaptationists).
  4.  **Just Outside (Honest):** "Male nipples are a developmental byproduct of the conserved mammalian developmental pathway where mammary tissue develops along milk lines in early embryogenesis before sexual differentiation. The mechanism (shared embryonic blueprint) is clear. Evidence *for* adaptation would require showing males with nipples had a fitness advantage *specifically due to the nipples themselves*, which seems implausible." (Source: conserved developmental pathway for mammary tissue; Constraint: early embryonic development before sexual differentiation; Falsifiability: specific, albeit implausible, evidence *for* adaptation outlined).

  **Relation to Existing Concepts & Differences**

  *   **Gould & Lewontin's Spandrels:** They criticized *over*-specified, just-so adaptationist stories. Your Phantom Constraint is the *under*-specified *anti*-adaptationist counterpart – the mirror image. Both can be problematic, but they exploit different weaknesses.
  *   **God-of-the-Gaps / Argument from Ignorance:** Very close kin. The Phantom Constraint *is* a specific form of argument from ignorance applied to evolutionary biology: "We don't have proof of adaptation, therefore proof of byproduct." The key nuance is the *active invocation of a biological concept (spandrel/byproduct)* as the placeholder for ignorance, giving it a veneer of scientific legitimacy that a bare "we don't know" lacks.
  *   **Ad Hoc Rescue / Auxiliary Hypothesis:** Similar protective function. However, the Phantom Constraint typically protects a *meta-belief* ("adaptationism is usually wrong/overreaching") rather than a specific core theory. The auxiliary is the unsupported "byproduct" claim itself.
  *   **Null Hypothesis (Drift/Constraint):** Treating non-adaptation as the null is methodologically sound *for testing specific adaptive hypotheses*. The Phantom Constraint *misapplies* this by treating the *unspecified label* "byproduct" as the confirmed null outcome upon failure to reject the adaptation hypothesis, without actually *testing* the byproduct claim or providing its own positive model. It conflates "not proven adaptive" with "proven non-adaptive (and specifically a byproduct of X)".

  **The Second Wrinkle: Conflating Current Utility with Evolutionary Origin**

  This **is** a distinct, though often co-occurring, fallacy. It conflates two separate questions:
  1.  **Historical Origin:** Was the trait *shaped by natural selection* for its current (or ancestral) function? (Adaptation vs. Byproduct/Spandrel)
  2.  **Current Function/Maintenance:** Does the trait *currently* enhance fitness? (Can be true for both adaptations *and* exaptations/spandrels that were co-opted).

  **The Fallacy:** "Trait X has a current function (F), therefore X is an adaptation *for F*." This is indeed **Affirming the Consequent** applied to adaptation:
  *   *If* it's an adaptation for F, *then* it likely has current function F.
  *   It has current function F.
  *   Therefore, it is an adaptation for F. **(Invalid)**
  It ignores that exaptations/spandrels *can and do* acquire current functions (maintained by selection) without having been originally *shaped* for that function.

  **Name:** **Exaptation Erasure Fallacy** or **Functional Origin Conflation**. It prematurely "erases" the possibility of a non-adaptive origin because the trait is now useful. It belongs to the *interpretation* phase after evidence is gathered, whereas the Phantom Constraint is about *evading* the need for evidence during hypothesis generation/defense. They often work together: the Phantom Constraint shuts down adaptive inquiry prematurely; the Exaptation Erasure then misinterprets evidence of *current* utility as proof the premature shutdown was wrong and adaptationism wins after all.

  **Conclusion for Your Newsletter**

  You've identified the **Phantom Constraint Fallacy**: the unsupported, untestable invocation of "spandrel" or "byproduct" as an argumentative stop-sign, exploiting an unfair asymmetry where adaptationist accounts bear the entire burden of proof. Its core sin is **explanatory emptiness**. The honest alternative requires naming the source, describing the constraint, and stating what would falsify it. The related **Exaptation Erasure Fallacy** mistakenly equates current utility with historical adaptation. Both hinder progress by obscuring the need for genuine mechanistic hypotheses and evidence, regardless of whether the ultimate explanation involves selection, constraint, or exaptation. The antidote is demanding specificity and testability for *all* proposed evolutionary explanations, not just the adaptationist ones.
