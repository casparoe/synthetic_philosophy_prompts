answer: |-
  **OFFICE FOR INTROSPECTIVE ACCURACY (OIA)**  
  **Est. 2027 under the Cognitive Fidelity Act (Public Law 117-45)**  
  **Mission:** To administratively reconcile first-personal state reports with the non-instantiation of phenomenal properties, ensuring public understanding aligns with established physicalist doctrine through efficient processing, mechanistic modeling, and civic education.  
  **Powers:** Mandatory intake of Introspective Discrepancy Reports (IDRs); authority to classify, model, and archive report mechanisms; issue public guidance on report semantics; requisition necessary computational resources per Statute 5(c).  
  **Performance Target:** 98.7% IDR processing within 28 days (FY34 Benchmark).  

  **INTERNAL ONBOARDING FAQ FOR CASEWORKERS**  

  **1. Q: What constitutes a valid report requiring OIA action?**  
  A: Any citizen communication asserting the instantiation of *phenomenal properties* (e.g., "There is something it is like for me to see red," "My pain has a distinct felt quality," "I know what coffee tastes like intrinsically"). Standardize intake using **Form IA-1: Primary Introspective Discrepancy Report**. Key field: "Description of Alleged Phenomenal Property (PP)." Do not engage with metaphysical claims; catalog the *report* and its described antecedent physical/functional state (Field 7B).  

  **2. Q: How do I process an IA-1?**  
  A: Follow Procedure B-4:  
  a. Log report timestamp & citizen ID.  
  b. Identify referenced first-order state (e.g., "C-fiber activation, pattern gamma," "Retinal cone response 570nm + associative memory X"). Use Ref Database CONSCHEM v.8.1.  
  c. Apply the **Standard Causal Model (SCM v.4.2)** to generate the predicted report output based on the antecedent state.  
  d. Flag as **"Model-Verified"** once SCM output matches the citizen's description within 92% semantic similarity (Algorithm THRESHOLD).  
  e. Archive. Performance Target: 27 IA-1s processed per 7.5-hour shift.  

  **3. Q: Citizens keep filing follow-ups stating that "it still *seems* like there’s something it is like," even after receiving our Model-Verified closure notice. How to escalate?**  
  A: This is a **recursive discrepancy report** concerning the introspective mechanism's self-monitoring output. Treat as a new report tier: **Form IA-2: Secondary Introspective Discrepancy (Seeming of PP)**. Process identically to IA-1, but:  
  - Antecedent state = The cognitive process generating the initial IA-1 report.  
  - Apply SCM to model why *this specific misrepresentation* (the seeming) occurs.  
  - Upon Model-Verification, archive. Note: IA-2 submissions often trigger IA-3 reports ("Seeming of a seeming of PP"). Each tier uses the same SCM on the preceding report's mechanism. Escalation is indefinite; assign sequential form numbers (IA-3, IA-4, etc.). *Efficiency Note: Recursive tiers accounted for in workload projections (see FY34 Volume Report, Sect. 4: "Sustainable Recursion Workflows").*  

  **4. Q: A citizen advocacy group, "Real Qualia United," protests outside HQ weekly. Their leaflets claim OIA denies experiences exist. How should we respond?**  
  A: This misrepresents the doctrine. Per Directive G-7:  
  - The OIA *does not* deny the existence of neural states, functional processes, or report-behaviors.  
  - We deny only the instantiation of *non-physical, intrinsic phenomenal properties* allegedly reported.  
  - Citizen assertions like "OIA says *nothing is going on in here*" constitute the **"Nothing Going On Fallacy" (NGOF)**.  
  - Response Protocol: Distribute Pamphlet P-9: *"Clarifying the Non-Instantiation: Your Brain is Busy, Just Not Like That"*. Issue NGOF violation notice (Form IA-1c: Misrepresentation Addendum) to leaflet distributors. Do not debate; cite semantic inaccuracy.  

  **5. Q: Are there restricted training materials?**  
  A: Yes. Per Training Bulletin TB-12:  
  - **Absolutely prohibited during induction:**  
    - *The Color Scientist Vignette* (alleged "knowledge argument" scenario).  
    - *The Philosophical Zombie Hypothetical* (alleged "conceivability argument" scenario).  
  - Rationale: Both exhibit unacceptably high trainee conversion rates to non-doctrinal positions (>37% in FY32 pilot). Use approved alternatives: Flowchart F-CAUS: "From Photon to Phoneme: The Reporting Chain" and Simulation SIM-RED: "Wavelength Discrimination Task - Output Variance Analysis."  

  **6. Q: What is the purpose of Form IA-0: Caseworker Baseline Introspective Report?**  
  A: Mandatory during your induction week (Procedure I-1a). Document what it is like *for you* while completing Form IA-0 regarding a specified stimulus (e.g., mild electric shock, blue light). *Purpose:*  
  - Establishes your personal report-profile for future reference.  
  - Provides a real-time dataset for refining the SCM's predictive accuracy for reporter-cognizers within the OIA system.  
  - Do not skip Section 4: "Describe the qualitative character of completing this form." *Tip: Be precise. "Administrative tedium" is acceptable; "epistemic vertigo" requires supervisor review.*  

  **7. Q: My IA-0 report feels... unresolved. Processing it via SCM (as per Q2) generated a Model-Verified closure code, yet the seeming persists intensely. Should I file an IA-2 on myself?**  
  A: Standard protocol applies. Your persistent seeming is a valid reportable event. Submit **Form IA-2: Secondary Introspective Discrepancy (Seeming of PP)** through the internal portal, citing your archived IA-0 case number as the antecedent state. Your assigned caseworker will process it. Remember: The goal is modeling the *reporting mechanism's output*, not validating the property. Persistence is a data point, not an anomaly. (See Annual Report FY33: "Recursive Stability in Trained Personnel – A System Feature").  

  **8. Q: Budget Line 7.4: "Explanatory Gap Reconciliation" seems large. What happens if funding lapses?**  
  A: Line 7.4 funds the continuous refinement of the SCM to account for novel report semantics and recursion levels. Lapse would:  
  - Freeze SCM updates beyond v.4.2.  
  - Halt processing of reports exceeding current model parameters (approx. 18% of IA-3+ submissions).  
  - Trigger Contingency Plan DELTA: Archive all non-processable reports under "Pending Mechanistic Resolution," issuing citizens Notice N-44: "Temporary Explanatory Resource Shortfall - Your Misrepresentation is Acknowledged but Unmodeled." *Note: The Gap itself is a permanent administrative feature; funding manages its operational footprint.*  

  **9. Q: Why do report volumes increase yearly if the SCM explains them?**  
  A: (Deputy Director, Reporting Efficiency): Increased volumes reflect *success*, not failure. Wider public awareness of doctrinal alignment (via OIA outreach) prompts more citizens to correctly identify and report their introspective system's misrepresentations. Our rising processing rate (FY34: 2.1 million IA-1s, 410k IA-2+s) demonstrates system robustness in normalizing these reports within the physical ontology. Higher volume equals greater dataset refinement for the SCM. Celebrate the paperwork – it’s calibration.  

  **10. Q: The Annual Report states "Closure upon complete mechanistic mapping." Is the Office’s work finite?**  
  A: Conceptually, yes. Practically, mapping is asymptotic. Each resolved report mechanism refines the SCM, but novel contexts (new sensory tech, neuro-modifications, recursive layers) generate novel reports. Full closure is projected under "Final Model Verification" (FMV) criteria: SCM v.X predicts *all possible* human-reportable IDR semantics with >99.8% accuracy across all known antecedent states. FMV is a KPI, not an expected near-term event. Current projection: Post-2150. Until FMV, the OIA mission continues. File diligently.  

  ---  
  **Filing Instructions:** Submit queries regarding this FAQ via Form IA-Q (Meta-Administrative Clarification). Allow 10 working days for response. Remember: Accuracy in reporting *about* reporting is paramount.
