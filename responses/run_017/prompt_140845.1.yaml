prompt: |-
  I'm a journalist who covers science and ideas, and I've been hanging around a philanthropic fund that allocates by expected value per dollar — the kind of place where someone will say, with a straight face, that a 1-in-10,000 shot at preventing a civilization-ending catastrophe beats a program that definately saves ten thousand lives next year, because the expected number of bodies is bigger. What I can't get anyone there to explain is where they stop. The same fund routes real money toward long-shot catastrophic-risk work, but it will not hand five dollars to a stranger who walks in claiming he'll save 10^30 lives with his mind if they just pay him; nobody even feels bad about that, and when I press them they mutter something about their probability estimates "not being real" down at that scale. So the practice isn't plain expected-value maximization, whatever their website says, and I want the implicit theory reconstructed: what rule are they actually following, and does it secretly presuppose fanaticism — that a tiny enough probability of a big enough payoff swamps every ordinary consideration — or has it quietly rejected fanaticism while keeping the vocabulary?

  I've been using a made-up distinction in my notes and I want you to test it rather than humor it. Call it the calibration floor: the smallest probability a funder is willing to act on, because below some threshold their own track record says their number is noise rather than evidence, so the mugger's one-in-10^30 isn't a very low probability but no probability at all, whereas the catastrophe estimate is a real one. Is that a principled line or just relabeling the discomfort? Relatedly, does any of this need the law of large numbers — the usual "in the long run EV wins" story — given that neither the catastrophe case nor the mugger case will ever be repeated enough times for that story to apply? And does the practice strictly presuppose that value aggregates across people, that saving 10^12 lives is 10^12 times as good as saving one, or would a view that refuses to aggregate license the same allocations for different reasons?

  Give me exactly five numbered items, each one or two sentences (three at the outside), no intro, no conclusion, no headings, in American English: (1) the decision rule the practice is really running on, stated so I could read it back to the fund's board; (2) the single commitment it cannot drop without becoming unintelligible, with the case that shows it; (3) one commitment everyone assumes the practice has that it strictly doesn't need — tell me which of the things people throw at expected-value reasoning is really just a prejudice of one camp; (4) whether my calibration floor separates the catastrophe case from the mugger case or collapses under pressure, and if it collapses, what actually does the work instead; (5) what would concretely change in their funding meetings if they swapped the implicit theory for a named rival — ambiguity aversion, bounded value, satisficing, whatever fits. Don't cite papers or name authors; I can't check them and my editor cuts them anyway. And please don't use item (1) to tell me that EV maximization implies fanaticism — I know that much, I want to know what this practice implies.
reasoning: |-
  Hmm, the user is a science journalist covering philanthropic funding that uses expected value per dollar calculations. They've observed that while these funds prioritize long-shot catastrophic risks over certain near-term interventions, they still reject "Pascal's Mugging" scenarios where someone promises astronomically large payoffs for tiny investments. The funders seem inconsistent in their application of expected value theory, muttering about probabilities "not being real" at extreme scales.

  The journalist proposes a "calibration floor" concept where probabilities below a certain threshold are treated as noise rather than evidence. They want me to reconstruct the fund's actual decision rule through five specific numbered items: (1) the real decision rule, (2) essential commitment, (3) unnecessary assumption, (4) viability of calibration floor, and (5) consequences of switching theories.

  For item 1, I need to articulate a decision rule that incorporates both their catastrophic risk funding and rejection of Pascal's Mugging. This should include probability thresholds based on evidence quality and tractability assessments. The rule must sound operational enough to present to their board.

  Item 2 requires identifying the core commitment that makes their practice coherent. The key seems to be their insistence on evidence-backed probability estimates, demonstrated by their rejection of the mugger's unsupported claims despite the astronomical payoff.

  For item 3, I should note that while many assume these funders must accept value aggregation across people (that saving more lives is linearly better), their actual decisions don't strictly require this. They could maintain similar allocations based on other value systems like maximizing minimum outcomes or avoiding worst-case scenarios.

  Regarding item 4, the calibration floor concept is useful but incomplete. It fails under pressure because the real distinction comes from evidential support - the catastrophic risk estimates have analytical foundations while the mugger's claim doesn't. The funders are actually using a "support threshold" rather than just a probability threshold.

  For item 5, switching to ambiguity aversion would make them avoid low-probability bets entirely, while satisficing would make them fund "good enough" certain outcomes instead of chasing marginal improvements on long shots. Bounded value theory would cap the value of saving lives at some threshold, eliminating the appeal of astronomical payoffs.

  I'll structure the response as exactly five numbered items without intros or conclusions, using concise American English as requested. Each item will be one to three sentences maximum, avoiding academic citations while focusing on practical implications for their funding decisions.
answer: |-
  Here are the five items:

  (1) The fund acts on expected value estimates only when probabilities derive from evidence-based models with measurable calibration records, and interventions demonstrate plausible pathways to impact; otherwise, it defaults to near-zero probability for unsupported claims regardless of stated magnitude. This justifies funding catastrophic risks with established research bases while rejecting the mugger.

  (2) The indispensable commitment is to treating probability estimates as epistemically constrained quantities derived from evidence and model validation, not free-floating numbers. Rejecting the mugger's unsupported 1-in-10^30 as "no probability" demonstrates this; dropping it would force accepting any arbitrary claim.

  (3) The practice doesn't strictly require accepting unrestricted aggregation of value across people (saving 10^12 lives being 10^12 times better). It could operate identically under a "catastrophe avoidance" view prioritizing preventing worst-case outcomes, even if intrinsic value per life isn't perfectly additive.

  (4) The calibration floor separates the cases initially but collapses under pressure; what truly does the work is the requirement for *evidential support* establishing a *plausible causal pathway*. The catastrophic risk estimate has domain-specific models and historical analogues; the mugger's claim has neither, making its probability effectively undefined, not just low.

  (5) Switching to ambiguity aversion would shift funding away from poorly quantified catastrophic risks towards interventions with known, narrower outcome distributions. Adopting satisficing would redirect money to funding several "good enough" certain programs once a minimum impact threshold is reliably met, abandoning marginal long shots.
