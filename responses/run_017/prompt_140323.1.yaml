answer: |-
  ### 1. The Implicit Theory of Moral Responsibility  
  The practice presupposes a **hybrid theory** but functionally relies on **forward-looking accountability**. Desert-based conditions (blameworthiness requiring *knowledge*, *capacity*, and *reasonable opportunity to intervene*) are nominally required to assign individual blame. However, these conditions are often empirically unmet due to system design (e.g., vigilance decay, automation bias). The real justificatory work is done by deterrence and assurance: blaming the supervisor incentivizes vigilance and maintains public trust in human oversight. Key conditions:  
  - **Desert element**: Supervisor must have had adequate training, clear authority, and access to system data.  
  - **Forward-looking element**: Blame must plausibly deter inattentiveness and assure stakeholders that risks are managed.  
  The latter bears the weight—blame is assigned *even when desert is questionable* (e.g., during split-second failures) because institutions prioritize systemic risk management over individual fairness.  

  ### 2. Four Gaps and Their Status  
  The practice conflates but does not close these gaps:  
  - **Causal contribution**: Presupposes the human *could* have intervened to prevent harm. In practice, investigations often *assume* this gap is closed (e.g., "had they pressed override, harm would not occur"), but this is speculative.  
  - **Control**: Requires *effective* capacity to intervene. The practice *hopes* this gap is closed via training/design but ignores degradation from disuse (e.g., skill fade).  
  - **Epistemic access**: Assumes supervisors receive sufficient, timely data to detect errors. This is *presupposed as closed* (via logs/interfaces) but often inadequate (e.g., opaque AI outputs).  
  - **Authority**: Formally treated as closed (override rights exist), but real authority shrinks if overrides are penalized or impractical.  
  **Responsibility gaps are distinct**: A system could close authority/epistemic gaps but leave control/causal gaps open (e.g., a supervisor sees an error but cannot react in time). Remedies differ: causal gaps may require design changes; epistemic gaps need better interpretability; control gaps demand skill maintenance; authority gaps require cultural/legal shifts.  

  ### 3. Supervisory Smothering and Empirical Tensions  
  The practice implicitly assumes that **procedural formalities (training, logging) sustain effective control** despite automation-induced erosion. Yet "supervisory smothering" is empirically likely:  
  - **Vigilance decay** (e.g., complacency during high-reliability operation) and **automation bias** (trusting system over judgment) are well-documented.  
  - **Skill atrophy** occurs when humans rarely perform manual tasks.  
  The practice’s defense is **proceduralist**: It claims rigorous protocols *can* mitigate smothering. However, this is contested—logging or checklists may not restore situation awareness during rare failures. The practice is thus **self-defeating to a degree**: Demanding perfect supervision while designing systems that undermine it. It *can* be normatively defended only if blame’s primary role is deterrence (incentivizing compliance with mitigations), not desert.  

  ### 4. Coherence, Alternatives, and Selectivity  
  **Coherence issues**: The hybrid theory strains under tension. Desert requires genuine agency, but deterrence justifies blame even when agency is compromised (e.g., blaming a fatigued surgeon for AI-assisted misdiagnosis). Philosophically, the practice is **underdetermined**: Consequentialists accept it for deterrence; contractualists for assurance; but retributists reject it if desert is unfulfilled.  
  **Alternatives**:  
  - **Strict enterprise liability**: Shifts blame to developers/deployers. Requires redesigning liability frameworks (e.g., EU AI Act’s provider obligations) but faces "many hands" problems.  
  - **No-fault compensation**: Unlinks blame from accountability (e.g., vaccine injury funds). Viable for diffuse harms but may reduce safety incentives.  
  - **Design-first prohibition**: Bans systems where human control is unachievable. Presupposes we can define "genuine control" (e.g., via measurable skill retention).  
  **Selectivity**: Human-in-the-loop is demanded for decisions involving **perceived moral judgment** (e.g., lethal force, medical triage) versus "mere" optimization (e.g., insulin dosing). This assumes moral decisions require non-algorithmic human input—a contested view, as optimization can have moral dimensions (e.g., resource allocation). The practice likely reflects institutional risk aversion, not a coherent ethical boundary.  

  ---

  ### Epistemic Status Key  
  - **Settled**: Distinctions between causal/control/epistemic/authority gaps (conceptual); existence of vigilance decay/automation bias (robust empirical consensus).  
  - **Contested**: Whether procedural safeguards *effectively* mitigate smothering (mixed evidence); if blame for deterrence is *ethically justifiable* without desert (philosophical dispute).  
  - **Limb-walking claims** (use with caution): "Supervisory smothering makes desert-based blame indefensible"; "The practice prioritizes institutional risk management over moral responsibility."  
  - **Seminar-safe claims**: "The practice relies on forward-looking accountability despite desert-based framing"; "Epistemic and control gaps are often unaddressed."  

  \answer{Formal authority suffices for blame assignment when procedural oversight exists.}
