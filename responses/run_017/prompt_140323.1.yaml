  Okay, the user is a third-year philosophy student working on a term paper about responsibility gaps in human-in-the-loop systems. They've clearly done their homework—they're familiar with real-world examples like clinical decision support and autonomous weapons, and they've identified a puzzling pattern: systems are designed for humans to monitor but rarely intervene, yet when failures happen, blame falls entirely on the human supervisor. 

  Hmm, their questions are sophisticated. They want: (1) the implicit moral theory behind this blame-shifting practice, (2) a dissection of four distinct "gaps" (causal, control, epistemic, authority), (3) analysis of "supervisory smothering" (where reliability erodes human vigilance), and (4) coherence testing plus alternatives. They also emphasize epistemic rigor—flagging contested claims, empirical uncertainties, and seminar-ready assertions. 

  *Deep breath* This requires careful architecture. For Q1, the practice leans heavily on forward-looking accountability (deterrence/assurance) but pretends it's about desert—that's the tension. The desert conditions (knowledge, capacity, reasonable expectations) are often unrealistic, while deterrence does the heavy lifting. For Q2, the gaps are absolutely distinct: causal contribution is hand-waved ("proximate cause" legal fictions), control is degraded by design, epistemic access is often poor, and formal authority is just theater. The practice hopes these gaps are closed but doesn't ensure it. 

  Q3 is where it gets spicy. Supervisory smothering is real—vigilance decay and automation bias are well-documented, making nominal control illusory. The practice either ignores this or claims training/logging can fix it (dubious). For Q4, the package is philosophically unstable: desert-based blame on humans clashes with deterrence logic that should target designers. Alternatives like strict liability or design-first prohibitions exist but face political resistance. 

  The selectivity puzzle (human required for "moral" decisions?) reveals a mess: we use human-in-the-loop for consequential decisions (surgery, weapons) but full automation for others (insulin pumps). Yet no clear principle separates them—is targeting really more "moral" than glycemic control? Probably not; it's about perceived accountability theater. 

  Epistemic flags everywhere: Vigilance decay studies are robust, but skill atrophy data is patchier. Claiming "supervisory smothering is inevitable" would be a limb-walk in a seminar; safer to say "empirically likely." The whole practice presupposes—as the \answer states—that formal authority suffices for blame assignment, which is philosophically thin but institutionally convenient. 

