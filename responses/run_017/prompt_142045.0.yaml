prompt: |-
  You are a philosopher working at the intersection of bioethics, personal identity, and the philosophy of law, and you have been asked to serve as the conceptual consultant to a hospital clinical ethics committee that is rewriting its policy on advance directives. Think carefully before you write: spend your initial thinking on generating the space of hard cases, grouping them into families, and asking of each candidate requirement what exactly it would cost to give it up. Only then assemble the list. I want the reasoning to show, not just the deliverable.

  Fix the purpose first, because adequacy is relative to it. The theory I want specified is a theory of the *authority* of the earlier self: it must tell a surrogate or a committee, at the bedside and under time pressure, whether to honor, reinterpret, or override an instruction issued by a patient who can no longer decide. It is not a theory of what the patient's good consists in, and not a theory of fair allocation — though it must have a principled interface with both, and I want to know where that interface is.

  Write the desiderata: everything an adequate account has to deliver, each with the case or consideration behind it. Below are the materials I keep circling back to. Treat them as candidates, not as the list: some may be prejudices of one camp rather than genuine requirements, and I expect you to sort them, merge them, and above all to add the ones I have missed.

  The cases. Ordinary dementia: an instruction to stop treatment issued decades earlier by someone who now seems contented and who resists. The never-competent patient: a written instruction authored by a guardian for someone who has never had a competent self at all — a view keyed to precedent autonomy has nothing to say here, and I want to know whether that is an acceptable scope limit or a defect. The phase-cycling patient: someone who is competent and reflective while medicated and incompetent while off medication, issuing confident and mutually contradictory directives in each phase, each of which anticipates and cancels the other. The proleptic directive: an instruction issued by someone who foresees that her values are about to change in a way she currently welcomes — conversion, transition, a vocation — and who writes anyway. The velocity problem: one instruction stable across twenty years, another written in the third week of a new enthusiasm; if duration of endorsement matters, the theory owes an account of why any threshold is not ad hoc. The ratchet directive: an instruction whose author permits the later self to relax it but never to tighten it, or vice versa. The Ulysses clause and its mirror: an instruction to disregard future requests, and an instruction whose entire point is that the author predicted she would later demand the opposite.

  The distinctions I do not want collapsed. Having authority over a decision versus having one's instruction weigh as one consideration among others, that is, veto versus input. Honoring an instruction versus interpreting it versus treating it as evidence. Binding the later self versus binding the surrogate. The earlier self's actual instruction versus what the earlier self would have wanted had she foreseen this situation; these come apart constantly and I suspect the whole controversy hides in the gap. Authority over what is done versus authority over which values count in deciding it. Degree of psychological continuity versus the binary threshold of decisional incapacity.

  The constraints from elsewhere that the theory cannot contradict. Affective forecasting about one's own future adaptation is systematically poor. Many people with advanced cognitive decline report positive well-being while lacking the capacities that make a preference authoritative. Apparent preferences expressed by a still-competent patient can be products of depression, pain, delirium, or anosognosia. Identity change is gradual and comes in degrees. And then an epistemic constraint rather than a substantive one: the committee usually cannot know what the later self's experience is actually like, or how the earlier self would have responded to a situation nobody contemplated. Any requirement that the theory be sensitive to facts like these is in tension with any requirement that it be usable by non-philosophers in an afternoon.

  Three further deliverables. First, mark which requirements are non-negotiable and which are preferences of a camp — I expect, for instance, that the demand for a determinate answer in every case is a preference of clinical practice rather than a desideratum, and I want you to test that suspicion and find the others. Second, flag any pair of desiderata you suspect cannot be jointly satisfied; if some subset is jointly unsatisfiable, that result is more valuable to me than any list, so argue for it rather than papering over it. Third, name the single requirement that does the most work in excluding otherwise attractive views, and say why.

  Only after that, and briefly — no more than a few lines per view — score the main families of answer against your own list: the integrity-based defense associated with Dworkin, the current-interests or best-interests view, value-endorsement and narrative or temporally-extended-self views, and Parfit-style reductionism about identity, which may dissolve the framing rather than answer it. If a family of views fails on a requirement you have already argued to be jointly unsatisfiable with another, say so instead of double-counting.
reasoning: |-
  Hmm, this is a profound and challenging request about advance directive authority. The user is clearly a philosopher-bioethicist seeking to build a robust framework for clinical decision-making, not just a policy checklist. They want me to systematically unpack the tensions before proposing solutions.

  First, I need to fix the purpose: this is about the authority of the earlier self over the later incapacitated self. Not about defining patient good or resource allocation, but how those interface with self-determination. The core question is when surrogates should honor, reinterpret, or override advance directives.

  The user provides rich materials - cases, distinctions, constraints - but insists I treat them as raw ingredients. I should expand the case families. Beyond their examples, I'm considering cases like dementia patients with fluctuating awareness, or directives written during transient mental states. Each case reveals a different pressure point in the theory.

  Key distinctions they emphasize are crucial: veto vs input power, binding self vs surrogate, actual instructions vs hypothetical wishes. Collapsing these would beg the question. The constraints are equally important - like our poor affective forecasting about future adaptation. Any theory ignoring cognitive biases or epistemic limitations is impractical.

  Now for desiderata generation. I'm grouping them into three clusters:
  - Authority conditions (what makes a directive authoritative? Duration? Competence?)
  - Scope limits (who can bind whom? When does identity disruption break authority?)
  - Conflict resolution (how to handle contradictions? Changing values?)

  For each, I'm asking: what would it cost to abandon this requirement? For example, dropping the "never-competent" case might simplify the theory but at the cost of excluding vulnerable populations. The phase-cycling patient case exposes how we handle conflicting selves over time.

  I suspect two irreconcilable tensions: 
  1) Between respecting precedent autonomy and protecting current welfare - especially when the directive causes suffering the earlier self couldn't foresee. 
  2) Between needing nuanced philosophical distinctions and the clinical requirement for clear, rapid decisions.

  The hardest trade-off is the "welfare gap": if we strictly honor directives, we risk harming contented patients; if we override for welfare, we risk paternalism. Dworkin's integrity view fails here by dismissing current interests, while best-interests views undermine autonomy.

  When scoring standard theories:
  - Dworkin's narrative integrity handles Ulysses clauses well but crumbles on dementia cases where patients seem content
  - Best-interests views handle never-competent cases but make directives merely advisory
  - Parfitian reductionism dissolves identity worries but offers no guidance for surrogates

  The non-negotiable core is: directives must have some authority (not just input), but not absolute. The clinical reality is that we must accept indeterminacy in edge cases - which frustrates practitioners but is philosophically honest.

  The user's unspoken need seems to be defending against both unthinking proceduralism ("always follow directives") and paternalism ("we know best"). They want a framework that acknowledges tragic choices without paralysis. My response should make these tensions vivid while offering principled compromises.
answer: |-
  Here is the systematic breakdown you requested, following your methodological constraints. I'll first generate the case families, derive desiderata through pressure-testing, identify tensions, then evaluate major theories against the resulting framework.

  ### I. Expanded Case Families (Grouped by Challenge Type)
  1.  **Competence & Stability Challenges:**
      *   *Phase-Cycling Patient:* Contradictory directives on/off medication, each anticipating/canceling the other.
      *   *Velocity Problem:* Long-standing stable directive vs. recent directive written during a transient enthusiasm.
      *   *Acute Distortion:* Directive written under untreated depression, delirium, or severe pain.
  2.  **Identity & Persistence Challenges:**
      *   *Ordinary Dementia:* Directive to refuse life-sustaining treatment by a now content, resistant patient lacking relevant capacities.
      *   *Proleptic Directive:* Directive anticipating *and welcoming* a radical future value change (e.g., religious conversion, transition).
      *   *Gradual Dissolution:* Patient with progressive decline where psychological continuity fades incrementally.
  3.  **Authority Scope & Bindingness Challenges:**
      *   *Never-Competent Patient:* Directive authored *by a guardian* for someone who never possessed decisional capacity.
      *   *Ratchet Directive:* Instruction permitting only loosening (or only tightening) of restrictions by the later self/surrogate.
      *   *The Binding Target:* Does the directive bind the *later self* (if it exists) or only the *surrogate/committee*?
  4.  **Contradiction & Override Challenges:**
      *   *Ulysses Clause:* "Disregard any future request for X (e.g., CPR)."
      *   *Mirror Clause:* "I know I will beg for X later; do X anyway." (Anticipated future request)
      *   *Self-Canceling Directives:* Phase-cycling is one instance; also directives explicitly revoking prior ones under contested competence.
  5.  **Epistemic & Practical Challenges:**
      *   *The Unforeseen Situation:* Directive silent on a specific, novel medical scenario.
      *   *The Experience Gap:* Surrogate/committee cannot truly know the current patient's subjective experience (well-being, suffering).
      *   *Affective Forecasting Failure:* Directive based on inaccurate prediction of future adaptation (e.g., "I'd never want to live like that," but patient adapts).

  ### II. Deriving Desiderata: Requirements & Their Costs
  *(Cost = Consequence of abandoning the requirement)*

  1.  **Respect for Precedent Autonomy (Veto Power):** The earlier self's clear, competent instruction must be able to *bind* the surrogate to a specific action/inaction in at least some core cases (e.g., refusing heroic measures for terminal cancer). *Cost of Abandonment:* Reduces advance directives to mere advisory input, undermining their core purpose of securing future self-determination. (*Case: Ulysses Clause*)
  2.  **Protection from Harm (Welfare Constraint):** An instruction cannot be followed if it mandates action/inaction foreseeably causing severe, unnecessary suffering *to the current patient* without significant countervailing benefit *to the current patient*. *Cost of Abandonment:* Sanctions potentially cruel imposition based on a past self's values onto a suffering, non-consenting present entity. (*Case: Ordinary Dementia - force-feeding refusal on a contented patient*)
  3.  **Scope Limitation (Competent Self Requirement):** Binding authority originates *only* from a decision made by the patient when competent. *Cost of Abandonment:* Justifies binding directives from guardians for the never-competent or potentially weakens the competence threshold for the author. (*Case: Never-Competent Patient* - Abandonment *allows* directives here; Retention explicitly *excludes* them from binding precedent autonomy).
  4.  **Competence Condition:** Binding authority requires the author was competent (understood relevant information, reasoned consistently, communicated choice) *at the time of issuing the directive*. *Cost of Abandonment:* Legitimizes directives issued under coercion, severe distortion (delirium, depression), or without understanding. (*Case: Acute Distortion*)
  5.  **Temporal Stability Endorsement:** Longer duration and stability of an expressed value/preference *can* increase its weight/authority. *Cost of Abandonment:* Forces treating a lifelong conviction and a fleeting whim as equally authoritative if both were competently expressed once. (*Case: Velocity Problem* - Why threshold isn't *ad hoc*: Thresholds reflect practical reasonableness acknowledging human volatility; the *direction* (longer=stronger) is principled).
  6.  **Identity Continuity Matters:** Significant disruption of psychological connectedness/continuity *can* weaken the earlier self's authority over the current entity. *Cost of Abandonment:* Forces treating a patient with profound dementia as identical in all morally relevant ways to their past self, ignoring the experiential disconnect. (*Cases: Ordinary Dementia, Gradual Dissolution, Proleptic Directive*).
  7.  **Distinction Preservation (Veto vs. Input):** The theory must distinguish between an instruction having *binding force* (veto) vs. being a *weighty consideration* (input). *Cost of Abandonment:* Creates ambiguity for surrogates, potentially collapsing all directives into mere suggestions or treating all stated preferences as absolute commands.
  8.  **Distinction Preservation (Actual vs. Hypothetical):** The theory must distinguish between following the *actual instruction* vs. implementing what the earlier self *would have wanted* had they foreseen *this exact situation*. *Cost of Abandonment:* Risks significant paternalism by substituting the surrogate's/committee's judgment of the patient's "true" will for the expressed will. Hides the core controversy.
  9.  **Epistemic Humility & Practicability:** The theory must yield usable guidance for non-philosophers under time pressure, acknowledging profound uncertainties (experience gap, unforeseen situations, forecasting limits). *Cost of Abandonment:* Creates an elegant but clinically useless theory, paralyzing decision-making. (*Constraint: Affective Forecasting Failure, Experience Gap, Unforeseen Situation*).
  10. **Conflict Resolution Mechanism:** The theory must provide principles for resolving contradictions (between directives, between directive and apparent current interest). *Cost of Abandonment:* Leaves surrogates adrift in precisely the hardest cases. (*Cases: Phase-Cycling, Ulysses/Mirror, Ratchet*).
  11. **Interface with "Good" & Allocation:** The theory must specify where its domain ends and substantive judgments about the patient's *current good* or *fair allocation* of resources begin. *Cost of Abandonment:* Fails to demarcate authority questions from welfare/justice questions, leading to overreach or under-protection.

  ### III. Non-Negotiables vs. Camp Preferences & Flagging Tensions
  *   **Non-Negotiables (Core Function):** (1) Respect for Precedent Autonomy (Veto Power - minimally in core cases), (3) Scope Limitation (Competent Self), (4) Competence Condition, (7) Distinction (Veto vs. Input), (9) Epistemic Humility/Practicability, (11) Interface Specification.
  *   **Camp Preferences:**
      *   *Determinate Answers:* A strong preference of clinical practice, but **not** a strict desideratum. A theory can acknowledge unresolvable dilemmas (e.g., severe Phase-Cycling) and provide a default (e.g., status quo, best interests) *without* claiming philosophical determinacy.
      *   *Strict Identity Threshold:* Preference of reductionist/Parfitian views. Rejected here; (6) Identity Continuity Matters accepts degrees.
      *   *Absolute Veto:* Preference of strong precedent autonomy views (Dworkin). Contradicted by (2) Welfare Constraint.
      *   *Current Interests Paramount:* Preference of best-interests views. Contradicted by (1) Respect for Precedent Autonomy.
  *   **Flagged Tensions (Likely Jointly Unsatisfiable):**
      *   **The Core Tension:** **(1) Respect for Precedent Autonomy (Veto)** vs. **(2) Protection from Harm (Welfare Constraint)**. Honoring a directive (e.g., refusal of antibiotics in mild dementia) *can* cause harm to a contented current patient who resists. Overriding to prevent harm *violates* precedent autonomy. *No theory fully resolves this; it defines the dilemma.*
      *   **The Epistemic Tension:** **(8) Distinction (Actual vs. Hypothetical)** vs. **(9) Epistemic Humility/Practicability + Unforeseen Situation**. Following the *actual instruction* rigidly in unforeseen situations can be absurd/harmful. Implementing "what they would have wanted" requires speculation the committee often cannot reliably perform under constraints. *This tension necessitates a fallback principle.*
  *   **Most Excluding Requirement:** **(2) Protection from Harm (Welfare Constraint)**. This excludes:
      *   Pure Dworkinian views (ignore current experiential interests).
      *   Strong reductionist views (if identity is weakened, but current suffering is real, overriding is easy).
      *   Strict actual-intent views (if the instruction mandates harm, following it is required). It forces any viable theory to have an override clause.

  ### IV. Theory Scoring (Briefly)
  *   **Dworkin (Integrity/Narrative):**
      *   *Strengths:* Strong on (1) Veto, (3) Scope, (4) Competence, (7) Veto/Input, (10) Conflict (narrative coherence), (11) Interface (separates critical/experiential interests).
      *   *Failures:* Fails **(2) Welfare Constraint** (dismisses current experiential interests), struggles with **(6) Identity Continuity** (assumes strong identity), poor on **(9) Practicability** (narrative judgment complex). *Fails on Core Tension.*
  *   **Current Interests/Best Interests:**
      *   *Strengths:* Strong on (2) Welfare, (9) Practicability, handles (6) Identity Continuity well.
      *   *Failures:* Fails **(1) Precedent Autonomy Veto** (reduces directive to input), weak on **(3) Scope** (may accept guardian directives), blurs **(7) Veto/Input**, struggles with **(10) Conflict** (Ulysses clauses ignored). *Fails on Core Tension.*
  *   **Value-Endorsement / Narrative Self (Schechtman, etc.):**
      *   *Strengths:* Strong on (1) Veto (if values stable), (6) Identity Continuity (degrees), (10) Conflict (coherence), can handle (5) Stability.
      *   *Failures:* Vulnerable on **(2) Welfare Constraint** (if values mandate harm), struggles with **(9) Practicability** (assessing value endorsement), ambiguous on **(7) Veto/Input** and **(8) Actual/Hypothetical**. *Struggles with Core Tension.*
  *   **Parfitian Reductionism:**
      *   *Strengths:* Excellent on (6) Identity Continuity (degrees), clarifies (3) Scope (dependent on R-relations), potentially strong on (2) Welfare.
      *   *Failures:* **Dissolves the framing:** Undermines **(1) Precedent Autonomy Veto** (no enduring self to bind/be bound), weakens **(4) Competence** (who is the author?), makes **(7) Veto/Input** incoherent, poor on **(10) Conflict** resolution based on selfhood. *Fails on core premise of precedent autonomy.*

  **Conclusion:** The analysis reveals the **Core Tension** (Veto vs. Welfare) as fundamental and likely irresolvable at a theoretical level. An adequate policy must therefore:
  1.  Grant binding veto power to competent, stable directives in foreseen scenarios.
  2.  Explicitly incorporate a **Welfare Override Clause** triggered by severe, unforeseen harm to the current patient that the directive *mandates* or *fails to anticipate*.
  3.  Prioritize *actual instructions* over hypothetical wishes but provide a clear, simple default (e.g., best interests, status quo) for unforeseen situations or irreconcilable conflicts.
  4.  Explicitly exclude directives for the never-competent from binding *precedent autonomy* justification (though they may inform best interests).
  5.  Acknowledge indeterminacy in edge cases (e.g., severe phase-cycling) and provide a procedural resolution path. The theory provides the framework for debate, not algorithmic answers in every case.
