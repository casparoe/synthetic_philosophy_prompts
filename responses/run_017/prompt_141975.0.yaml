  step 7: needs rephrasing. In the Luring Lottery, causal decision theory leads to a tragedy, but the superrational solution (if followed) avoids it. However, without the ability to commit, players might deviate.
  step 8: reject. Superrationality is not silent in Platonia (due to independent randomization) and in Luring Lottery it offers a solution that avoids the tragedy if players adhere to it.

  Now, settled and contested:

  settled: 
  - In symmetric games, superrationality prescribes that each player should choose the strategy that, if adopted by all, maximizes each player's expected payoff.
  - In the Platonia dilemma, the superrational solution is for each player to send the telegram with probability 1/20, and this yields a positive expected payoff.

  contested:
  - Whether superrationality is a valid decision theory or merely a heuristic for selecting among symmetric equilibria (if any). Some argue that it ignores the incentive to deviate, while others maintain that in the absence of communication, the symmetry of the situation compels identical reasoning and hence no deviation.
  - The exact interpretation of the non-independence: does it only apply to the choice of strategy or also to the random outcomes? (We have taken the position that it only applies to the strategy.)

  bottom_line: Yes, superrationality does work over causal decision theory in these two cases by providing a solution that yields a positive expected payoff in Platonia and avoids the tragedy of the commons in the Luring Lottery, but it requires a strong commitment to symmetry and no unilateral deviation.

  weakest_thing_i_said: The claim in step (2) that the non-independence in superrationality implies that randomized strategies collapse to deterministic ones. This is the step we rejected. What would settle it is a clear account from the literature (or from Hofstadter) of how randomization is implemented in superrationality. Hofstadter's own description in the Platonia dilemma uses independent randomization.

