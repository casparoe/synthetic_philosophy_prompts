prompt: |-
  I've been stuck on this for about a week and my reading group is no help, so I'm bringing it here. Context, so we're using the same numbers: in Hofstadter's Platonia dilemma an eccentric trillionaire gathers 20 people and offers a billion dollars to the sender if and only if exactly one of them sends a telegram by noon, no communication allowed, and the superrational answer is supposed to be that each of them sends with probability 1/20. In the Luring Lottery from the same 1983 column (the one where the prize was a million dollars divided by the total number of entries, paid to whoever submitted a randomly drawn entry, and you were allowed to write any number you liked on your single postcard as your number of entries) the superrational prescription was roughly: roll a die with about as many sides as the number of people you expect to respond, and mail in a 1 only if you roll a 1.

  Here's the argument I built, and I hate the conclusion:

  (1) The actual content of superrationality is: in a symmetric situation I should choose the strategy whose adoption by every rational player maximizes each player's expected payoff, because my deliberation and theirs are not independent events — in choosing for myself I am in effect choosing for all of us. That non-independence is the whole thing; it's what separates superrationality from just guessing what the others will do and maximizing against the guess.

  (2) What makes my choice and theirs non-independent is that we run the same reasoning on the same situation: same inputs, same argument, same conclusion. So the dependence superrationality asserts is as strong as dependence gets. Whatever strategy I settle on, they settle on too, and we all end up doing the same thing.

  (3) Now take a randomized prescription — send with probability 1/20, or roll a twenty-sided die and send on a 1. If (2) is right, the rolls aren't independent either. Either we all roll a 1 or none of us does. Under (2) every randomized prescription collapses into the corresponding all-or-nothing one.

  (4) In Platonia, all-or-nothing pays nothing. Twenty telegrams is nothing, zero telegrams is nothing. So under (2) the expected value of any superrational prescription in Platonia is zero no matter what probability you pick, and superrationality cannot recommend anything — certainly not 1/20.

  (5) Nor can it sneak out through a deterministic rule like "I send, because someone has to": if everyone follows that, it's twenty telegrams again. Every symmetric deterministic strategy in Platonia pays zero. So there is no superrational recommendation to be had.

  (6) The only escape is to say the dice come out differently for different people: we all adopt the same policy, but the tosses are independent. Yet that is just the causal decision theorist's picture returning through the back door. My action doesn't influence theirs, theirs are random draws from a shared policy, and I maximize my own expected payoff against a fixed distribution over what they do. That's ordinary expected-utility maximization plus the empirical guess that other people are like me. That's a belief about the world, not a decision theory.

  (7) And once you are maximizing against the others' fixed behavior, the Luring Lottery shows where it terminates. Your best response to a total of T entries from everyone else is to submit T entries yourself; if everyone best-responds, the number of entries runs away without bound and the prize becomes worthless. Which is more or less what happened with the actual magazine contest.

  (8) So superrationality is either silent exactly where it was supposed to shine (given (2)), or it is plain expected-utility maximization that reproduces the tragedy of the commons in the one case where it was supposed to beat it (without (2)). Either way it earns nothing over causal decision theory, and Hofstadter's apparatus is a slogan with one worked example.

  I'm convinced something in the middle is smuggling, but I can't name it. One of my friends keeps muttering about correlated equilibrium: if we're all perfectly correlated, she says, we could also correlate *negatively* — agree that player 7 sends on heads and everyone else stays home on heads — and then perfect correlation wins a billion with certainty, which would make (4) just false. I think that's cheating, since the setup forbids communication and a shared coin isn't obviously available, but I can't say exactly why it's cheating. My other suspicion is (6), because "the dice are independent" and "my choice tells me nothing about theirs" feel like different claims, but I can't pry them apart.

  If I have to choose I'd much rather keep (1) and (2) than keep (8) — I'd give up nearly anything before I give up the thought that superrationality is a real thing — but I want to know what I'm paying, and I want the step named precisely, not gestured at.

  Two more things, please. First, be explicit about which claims here are settled and which are genuinely fought over by people who work on this: I keep reading confident forum posts that treat one side as obvious and I can't tell consensus from assertion, so mark contested stuff as contested rather than smoothing it into the consensus position. And don't lean on citations or named papers — argue it.

  Second, give me the verdict as a single JSON object and nothing else outside it, with these fields:

  - step_rejected: the number of the step you reject, and that step restated in your own words. Use the string "none — argument is sound" if you think it's fine as it stands.
  - diagnosis: one or two sentences on precisely what goes wrong there.
  - why_it_looked_fine: why a careful reader would grant that step before seeing the problem.
  - price: what rejecting it costs you — what you can no longer claim, and what new difficulty you inherit.
  - other_steps: an array with one object per remaining step, each with fields step (the number), verdict (one of "keep", "reject", "needs rephrasing"), and note (one line).
  - settled: an array of claims in this neighbourhood that essentially nobody who works on the topic disputes.
  - contested: an array of claims that get repeated as if settled but are genuinely live disputes, each with a note on which way the argument runs on each side.
  - bottom_line: one sentence — does superrationality do any work over causal decision theory in these two cases, yes, no, or only in some narrower sense.
  - weakest_thing_i_said: the single claim in my setup or my framing that you are least confident is right, and what would settle it.
reasoning: |-
  We are given a detailed argument against superrationality, structured in steps (1) through (8). The user is stuck and wants a clear analysis. The goal is to reject one step and explain why, and then to comment on the others. The user also wants to know settled and contested claims in the field.

  Key elements of the argument:
  (1) Defines superrationality: symmetric situation, choose the strategy that if adopted by all maximizes each player's payoff, because choices are not independent (due to identical reasoning).
  (2) The non-independence is as strong as it gets: same reasoning, same inputs, same conclusion. So whatever strategy I choose, they choose too, and we all do the same thing.
  (3) Therefore, randomized strategies collapse: if we all use a die with 20 sides, we all get the same roll (since the reasoning is the same). So it becomes all-or-nothing.
  (4) In Platonia, if all do the same (either all send or none send), payoff is zero. So no superrational recommendation.
  (5) Deterministic strategies also fail: if everyone sends, payoff zero; if no one sends, zero. So no symmetric deterministic works.
  (6) The only escape is to have independent dice, but then it becomes ordinary expected utility maximization (with the assumption that others are like me) and not a distinct theory.
  (7) In Luring Lottery, if we do ordinary expected utility, we get a tragedy of the commons (entries go to infinity, prize goes to zero).
  (8) Conclusion: superrationality is either silent (in Platonia) or collapses to causal decision theory and fails (in Luring Lottery).

  The user wants to reject one step. The key issue is step (2): the claim that the non-independence is so strong that even random choices are perfectly correlated.

  But note: the user's friend mentioned correlated equilibrium and negative correlation. Also, the user suspects that step (6) might be problematic because "the dice are independent" and "my choice tells me nothing about theirs" are different.

  However, the core of superrationality as presented by Hofstadter does not require that the random events are perfectly correlated. In fact, in the Platonia dilemma, the superrational solution is for each to send with probability 1/20, and the reasoning does not assume that the random outcomes are the same for all. Instead, the symmetry is in the strategy (each uses the same mixed strategy) and the random outcomes are independent. This is how the expected number of telegrams becomes 1 (20 * 1/20 = 1).

  Therefore, step (2) is too strong. The non-independence in superrationality does not extend to the random outcomes of mixed strategies. The reasoning is the same: we all decide to use the same mixed strategy (say, send with probability p). But when we implement it, we each independently flip a coin (or roll a die) with that probability. The reasoning leads to the same p, but the random draws are independent.

  So step (2) is the one to reject.

  Rejecting step (2) allows the superrational solution for Platonia: each sends with probability 1/20, and because the draws are independent, the probability that exactly one sends is positive (and high: about 0.377). The expected payoff for each is then (1/20) * (1 billion) * P(exactly one sends | each sends with p=1/20) but note: the condition is that exactly one sends. The payoff is a billion if exactly one sends, and zero otherwise. So the expected payoff for a player is the probability that they are the only one sending times a billion.

  But note: the superrational argument is that each player, by symmetry, should choose p to maximize the common expected payoff, under the assumption that all choose the same p. The expected payoff per player is:

    E[payoff] = P(exactly one sends) * (1 billion) / 20   ??? 

  Wait: no. Actually, the billion is awarded to the sender only if exactly one sends. But note: the problem says "a billion dollars to the sender if and only if exactly one of them sends". So if exactly one sends, that one gets a billion. Each player's expected payoff is:

    E[payoff for player i] = P(only i sends) * 1 billion.

  By symmetry, for a fixed p, P(only i sends) = p * (1-p)^{19}. So each player's expected payoff is:

    E_i = p * (1-p)^{19} * 1e9.

  But note: the superrational prescription is to choose p such that if all use p, then the expected payoff for each is maximized. We maximize:

    f(p) = p * (1-p)^{19}

  over p in [0,1]. The maximum occurs at p=1/20 (by taking derivative: f'(p)= (1-p)^{19} - 19p(1-p)^{18} = (1-p)^{18} [1-p - 19p] = (1-p)^{18}(1-20p). Set to zero: p=1/20).

  So the expected payoff per player is maximized when p=1/20, and then E_i = (1/20) * (19/20)^{19} * 1e9.

  Therefore, the superrational solution works if we allow independent randomization.

  But step (2) claimed that the non-independence of reasoning would force the random outcomes to be identical. That is the mistake. The reasoning leads to the same strategy (the same p) but the implementation of that strategy (the coin flip) is independent.

  In the Luring Lottery, the superrational solution is to use a mixed strategy: submit 1 entry with probability q, and 0 with probability 1-q. But note: the problem allows any number of entries. However, the symmetric equilibrium in mixed strategies might be more complex. The original superrational solution was to submit 1 entry only with probability 1/n, where n is the expected number of players. But note: the prize is (1e6) / (total entries) and is awarded to a randomly drawn entry. So if you submit k entries, then your expected winnings are [k / (T + k)] * (1e6) where T is the total entries from others.

  But if everyone is symmetric and uses the same strategy, then we need to find the symmetric mixed strategy that maximizes the expected payoff under the constraint that all use it. However, the Luring Lottery is more complex because the strategy space is continuous (any nonnegative integer). The superrational solution proposed by Hofstadter was to use a mixed strategy that randomizes between 0 and 1, with the probability of 1 being 1/n. This is an approximation.

  But the point is: without step (2), we can have independent randomization and the superrational solution for Platonia works.

  Now, what about step (6)? The user says that if we allow independent randomization, then we are back to causal decision theory. But note: in causal decision theory, a player would take the others' actions as given and then choose their own action to maximize their expected utility. In a symmetric setting, if a player believes that all others are playing the same mixed strategy, then they can compute their best response. But in the superrational approach, we are not doing best response. We are choosing the symmetric strategy profile that maximizes the expected payoff for each. That is not the same as a Nash equilibrium.

  In fact, in Platonia, the symmetric Nash equilibrium in mixed strategies is also p=1/20? Let's check: if all others use p, then the expected payoff for player i if they send with probability q (or if they choose to send with certainty, we can compute the expected payoff for sending and not sending).

  If player i sends, then the probability that exactly one sends is the probability that none of the others send, which is (1-p)^{19}. So the expected payoff for sending is (1-p)^{19} * 1e9.

  If player i does not send, the payoff is 0.

  So the best response for player i is to send if (1-p)^{19} * 1e9 > 0, which is always true unless p=1. But if p=1, then (1-p)^{19}=0. So if p<1, then sending gives a positive expected payoff and not sending gives 0. Therefore, the best response to any p<1 is to send with probability 1. But then if everyone sends, the payoff is 0. The only symmetric Nash equilibrium is in mixed strategies: each player must be indifferent between sending and not sending. So we require:

    (1-p)^{19} * 1e9 = 0   [if they send] 
    and 0 if they don't.

  But (1-p)^{19} * 1e9 = 0 only if p=1. But if p=1, then the payoff is 0. So there is no symmetric Nash equilibrium in which the payoff is positive? Actually, in mixed strategies, we set the payoff of sending equal to the payoff of not sending. The payoff of not sending is 0. The payoff of sending is (1-p)^{19} * 1e9. Set equal: (1-p)^{19} * 1e9 = 0, which implies p=1. So the only symmetric Nash equilibrium is p=1 (everyone sends) and payoff 0.

  But the superrational solution p=1/20 is not a Nash equilibrium because if all others use p=1/20, then a player's best response is to send with probability 1 (since (1-1/20)^{19} >0). So the superrational solution is distinct from Nash.

  Therefore, superrationality is not collapsing to causal decision theory (which would lead to Nash equilibrium). In fact, the superrational solution for Platonia is not a Nash equilibrium and yields a positive expected payoff (though in a one-shot game, it is unstable because any player can deviate to sending for sure and get a higher payoff if they are the only one who deviates? But note: if one player deviates to sending for sure while others use p=1/20, then the probability that exactly one sends (and that one being the deviator) is not 1. There might be multiple senders. The deviator's expected payoff is: P(no one else sends) * 1e9 = (19/20)^19 * 1e9, which is the same as the superrational expected payoff per player? Actually, in the superrational solution, a player's expected payoff is (1/20)*(19/20)^19 * 1e9. But if a player deviates to sending for sure while others use p=1/20, then their expected payoff is P(no one else sends) * 1e9 = (19/20)^19 * 1e9, which is 20 times the superrational expected payoff. So indeed, the superrational solution is not a Nash equilibrium and is vulnerable to deviation.

  But the idea of superrationality is that the players are not able to deviate unilaterally because they are all reasoning the same way. They are committed to the symmetric strategy. This is a very strong assumption.

  Now, for the Luring Lottery: the causal decision theory approach leads to a tragedy. The superrational approach might avoid it by having each player submit a small number of entries. But note: in the symmetric superrational solution for Luring Lottery, if we assume that each player uses the same strategy, then we can compute the strategy that maximizes the common expected payoff. However, the problem is more complex because the strategy can be any number of entries. The Hofstadter solution (randomize between 0 and 1, with probability 1/n for 1) is a way to keep the total entries bounded. But again, this is not a Nash equilibrium because a player can deviate by submitting more entries and get a larger share.

  So the superrational solution requires that the players are committed to the symmetric strategy and do not consider unilateral deviations. This is a departure from standard game theory.

  Therefore, we reject step (2). The non-independence of reasoning does not force the random outcomes to be identical. It forces the same strategy (the same p) but the random draws are independent.

