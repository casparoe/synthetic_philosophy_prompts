  For the other steps:

  step 1: keep. This is the definition of superrationality.
  step 3: reject (because it depends on step 2). Without step 2, randomized prescriptions do not collapse.
  step 4: reject (because it depends on step 2 and 3). With independent randomization, the superrational solution for Platonia works.
  step 5: keep. Deterministic symmetric strategies do indeed fail in Platonia.
