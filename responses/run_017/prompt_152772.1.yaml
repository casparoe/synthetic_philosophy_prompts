prompt: |-
  so there's a postdoc in our building running a reading group on Wittgenstein's On Certainty, and she keeps a shared doc where she files candidate propositions into three buckets: HINGE, NOT A HINGE, and WRONG QUESTION. I want to guess what she'll say about three cases that came up last week, and I care less about her verdicts than about what rule she's actually running. Her list so far, from memory and probably slightly garbled:

  - that I have two hands → HINGE
  - that the earth existed for an extremely long time before I was born → HINGE
  - that my name is Anna → NOT A HINGE, her note says "there's a passport, there's a birth certificate, nothing needs a hinge here"
  - that I'm in pain right now → WRONG QUESTION, "avowals don't get filed"
  - that it's wrong to hurt a child for fun → HINGE, and she's unusually insistent on this one, she calls it a moral hinge
  - that water is H2O → NOT A HINGE, she says it's a result somebody arrived at and the rest of us were taught
  - that every rod has a length → HINGE, but every time she adds the word "grammatical" and says it goes in a different drawer from the hands one
  - that there's a physical world at all → WRONG QUESTION

  I also can't work out why the water one fails while the earth one passes — both are scientific, both are things nobody in the room doubts, both are things a whole field could in principle revise.

  My own guess at the shape of the thing is three categories: scaffolding hinges, which have to stay put for my other claims about the world to make sense at all; quiet certainties, which I simply can't bring myself to doubt even though nothing else would collapse if they turned out false; and tribal hinges, which my community treats as beyond doubt but another community wouldn't. I have no idea if her list supports that split or if one of my three drawers is empty.

  The three cases:

  1. Jonah grew up in a household that taught him the earth is a few thousand years old and the fossils were put there to test faith. He left at eighteen, did a geology degree, and now the age of the earth is something he could defend with radiometric dating if you pressed him, though in practice he never does. For Jonah, is "the earth is about four and a half billion years old" a hinge? Note this is word-for-word one of her own HINGE entries — the question is whether hinge-hood travels to a person for whom that proposition was once genuinely contested and is now something he has grounds for.

  2. Her own case: that she has never been to the moon. No grounds beyond the ordinary, nothing in her picture of the world would shift if it were false, and it isn't the sort of thing anyone ever asks her. Quiet certainty in my sense, or just a boring empirical fact she happens to be sure of?

  3. A small highland community for whom "our ancestors are buried in this hill" is not up for discussion — it organises their land use, their ritual calendar, and their arguments about who may build where — while the national heritage agency treats it as an open empirical question they'd like to dig up. Hinge for them, or a hinge full stop?

  What I want: her verdict on each of the three and the rule that generates them; at least one other rule that fits all eight of her existing entries just as well but disagrees with your rule somewhere; which of my three cases actually tells the rules apart and which is a waste of breath; and one further case or question you'd put to her that would settle which rule she's on. Also tell me if my three-way taxonomy collapses against her list — in particular whether there's room in her view for the quiet-certainty category at all.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're involved in a reading group on Wittgenstein's *On Certainty* and are trying to figure out the postdoc's categorization system for propositions into HINGE, NOT A HINGE, or WRONG QUESTION. The user has provided eight examples from the shared doc, along with three new cases they want to predict the verdicts for. They also have their own three-way taxonomy (scaffolding, quiet certainties, tribal) and want to know if it fits or if one category is redundant.

  First, I need to analyze the existing categorizations to infer the underlying rule. Let's look at each entry:

  1. **Two hands → HINGE**: This is a classic hinge for Wittgenstein, as doubting it would undermine all sensory-based knowledge.
  2. **Earth's age → HINGE**: Even though scientific, it's foundational to our understanding of history and science.
  3. **Name is Anna → NOT A HINGE**: The postdoc mentions evidence like documents, so it's empirically verifiable, not foundational.
  4. **In pain → WRONG QUESTION**: Avowals are expressions, not propositions subject to doubt or certainty.
  5. **Wrong to hurt children → HINGE (moral hinge)**: Treated as a non-negotiable moral foundation.
  6. **Water is H2O → NOT A HINGE**: Scientific fact, learned and verifiable, not foundational in the same way as hinges.
  7. **Every rod has a length → HINGE (grammatical)**: A grammatical rule defining concepts, not about the world.
  8. **Physical world exists → WRONG QUESTION**: Similar to avowals; questioning it is nonsensical, not a proposition to doubt.

  From this, the postdoc's rule seems to be that hinges are non-empirical, foundational certainties that enable other inquiries. WRONG QUESTION applies to propositions that aren't truth-apt (avowals, metaphysical claims). NOT A HINGE covers empirical, verifiable facts.

  Now, the user's three cases:

  1. **Jonah's belief in Earth's age**: Even though he once doubted it and now has evidence, the hinge status might depend on its current role. If it's now foundational, it's a hinge; if evidence-based, not.
  2. **Never been to the moon**: Seems like an empirical fact, not foundational. Probably NOT A HINGE.
  3. **Ancestors buried in the hill**: For the community, it's a hinge due to its role in practices. But universally? Maybe not, so tribal hinge.

  The user's taxonomy has scaffolding (necessary for other knowledge), quiet certainties (personal, indubitable but not foundational), and tribal (community-based). The postdoc's list doesn't have clear quiet certainties—everything either scaffolds or is empirical/tribal. "Never been to the moon" might fit quiet certainty, but the postdoc would likely see it as empirical (NOT A HINGE).

  Alternative rule: Hinges are universally held certainties. But "water is H2O" isn't a hinge, and "moral wrong" might not be universal. So that doesn't fit. Another alternative: Hinges are immune to evidence. But Jonah's case shows evidence can be involved, yet the hinge status might remain if it's foundational.

  Key differentiator: Jonah's case. If hinges must be pre-evidential, Jonah's belief isn't one. If role-based, it could be. The moon case tests if non-foundational certainties are hinges—probably not per postdoc. The tribal case checks if hinges are community-relative; the postdoc might say yes for that community but not universally.

  To settle, ask about a proposition that's personally indubitable but not foundational, like "I had breakfast today." If it's NOT A HINGE, quiet certainties aren't recognized. Or a universal moral hinge vs. cultural practice.
answer: |-
  Based on the postdoc's documented categorizations and your description of her comments, I'll reconstruct her implicit rule, apply it to your three cases, provide an alternative rule that fits her existing data, identify which cases differentiate the rules, and evaluate your taxonomy. Finally, I'll suggest a diagnostic question to clarify her framework.

  ### The Postdoc's Likely Rule
  Her categorizations suggest a **functional role** criterion grounded in Wittgenstein's *On Certainty*:
  - **HINGE**: Propositions that are *foundational framework conditions* for rational inquiry, doubt, or justification. They are **pre-evidential** (not based on evidence or grounds) and **enabling** (make other knowledge/doubt possible). They cannot be coherently doubted or justified within the language game they support.  
  - **NOT A HINGE**: Propositions that are **empirical or verificational**—settled by evidence, testimony, or investigation within an existing framework.  
  - **WRONG QUESTION**: Propositions that **misrepresent the grammar** of certainty—either because they are *avowals* (expressions of subjective states, not truth-claims) or *metaphysical pseudo-questions* (attempts to doubt what defines "doubt").  

  **Applied to her existing entries:**  
  - *Two hands*: HINGE (scaffolds sensory reality; doubting it paralyzes empirical claims).  
  - *Earth's age*: HINGE (enables historical/science inquiry; grounds like "fossils exist" depend on it).  
  - *Name is Anna*: NOT A HINGE (verifiable via documents/evidence; no foundational role).  
  - *I'm in pain*: WRONG QUESTION (avowal; pain-reports aren't knowledge claims subject to hinges).  
  - *Wrong to hurt children*: HINGE (moral hinge; enables ethical discourse; precludes "justification" for cruelty).  
  - *Water is H₂O*: NOT A HINGE (scientific fact; acquired via evidence/teaching, not framework-setting).  
  - *Every rod has a length*: HINGE (grammatical; defines "rod" and "measurement," enabling spatial discourse).  
  - *Physical world exists*: WRONG QUESTION (metaphysical; doubting it voids "doubt" itself).  

  **Why earth's age passes but water fails?**  
  Earth's age is treated as a *temporal scaffold* for all historical claims (e.g., "dinosaurs existed" requires "earth is old"). Water being H₂O is a *discovery within chemistry*—it doesn't enable the practice of science itself. Revision wouldn't collapse chemistry; it would recalibrate it. Her "result somebody arrived at" note confirms it's empirical, not foundational.

  ---

  ### Verdicts on Your Three Cases (Using Her Likely Rule)
  1. **Jonah's belief in Earth's age (4.5B years)**:  
     - **Verdict: NOT A HINGE** for Jonah.  
     - **Why**: For him, this is now an empirical claim grounded in radiometric dating—a "result somebody arrived at" (like water being H₂O). It was *once* a hinge during his worldview shift, but now it's justifiable evidence-based knowledge. Hinges are pre-evidential; Jonah *has* evidence. Her original hinge ("earth existed long before I was born") is broader and immune to evidence—Jonah's specific age claim isn't.  

  2. **Never been to the moon**:  
     - **Verdict: NOT A HINGE**.  
     - **Why**: This is a mundane empirical certainty (like "I ate breakfast today"), not a framework condition. Nothing in her world-picture *depends* on it being undoubtable. Doubting it wouldn't collapse her ability to reason about travel, geography, or personal history—it would just make her factually wrong. It's a "boring empirical fact" (your quiet certainty), but her rule excludes these from hinge status.  

  3. **Ancestors buried in the hill**:  
     - **Verdict: HINGE** *for the community*, but **NOT A HINGE** universally.  
     - **Why**: For the highlanders, this organizes land use, rituals, and social norms—it's a *local hinge* enabling their shared practices. But for the heritage agency, it's an empirical question. Her moral hinge ("wrong to hurt children") suggests she accepts *normative hinges* (community-specific frameworks). However, she'd likely deny it's a hinge *full stop* since it lacks universality and isn't a transcendental condition for all discourse (unlike "I have hands").  

  ---

  ### Alternative Rule That Fits All Existing Entries
  **Rule**: Hinges are propositions that are **universally held or practically indubitable** for all rational agents in a form of life.  
  - **Fits existing data**:  
    - *Two hands/earth's age*: Universally indubitable (barring solipsism).  
    - *Name is Anna*: Not universal (empirical).  
    - *I'm in pain*: WRONG QUESTION (not a proposition).  
    - *Wrong to hurt children*: Treated as universal moral bedrock.  
    - *Water is H₂O*: Dubitable if chemistry changes (not universal).  
    - *Every rod has a length*: Grammatically universal.  
    - *Physical world*: WRONG QUESTION (not a proposition).  
  - **How it diverges**: This rule disagrees on **Jonah's case**—if hinges require universality, Jonah's belief *isn't* a hinge (since young-earth creationists doubt it). Her likely rule (functional role) also rejects it, but for different reasons. Under this alternative, **moral hinge** might be weaker (if universality is strict), but her insistence suggests she allows community-specific hinges.  

  ---

  ### Which Cases Differentiate the Rules?
  - **Jonah's case** is the **key differentiator**:  
    - Under her likely rule (functional role), it's NOT A HINGE because it's evidential.  
    - Under the alternative (universality), it's also NOT A HINGE (lacks universality).  
    - *But* if Jonah's belief *were* deemed a hinge, it would **refute both rules**. Her verdict here tests whether hingehood is *dynamic* (role-based) or *static* (content-based).  
  - **Never been to the moon** is a **waste of breath** for differentiation:  
    - Both rules treat it as NOT A HINGE (empirical fact).  
    - It only tests your "quiet certainty" category (which her system likely rejects).  
  - **Ancestors in the hill** partially differentiates:  
    - Her likely rule accepts it as a *local* hinge (like moral hinge).  
    - The universality rule rejects it (not universal). Her verdict would clarify if hinges are community-relative.  

  ---

  ### Does Your Taxonomy Hold Up?
  Your three-way split **(scaffolding, quiet certainties, tribal)** **collapses against her list**:  
  - **Scaffolding hinges** (e.g., two hands, earth's age) fit her HINGE category.  
  - **Tribal hinges** (e.g., ancestors in the hill) *might* fit if she accepts community-specific hinges (like her moral hinge).  
  - **Quiet certainties** (e.g., "never been to the moon") **have no room** in her system. These are empirical certainties, which she files as NOT A HINGE ("nothing needs a hinge here"). Her WRONG QUESTION category absorbs anything that isn't a truth-apt proposition (e.g., avowals).  

  **Key insight**: Her framework has **two axes**—propositional vs. non-propositional (grammar/avowals), and for propositions, foundational vs. empirical. "Quiet certainties" are empirical, not foundational, so they don't qualify.  

  ---

  ### Diagnostic Question to Settle Her Rule
  Ask her:  
  > **"Suppose I have a deeply held, indubitable belief that I ate oatmeal for breakfast yesterday—not based on evidence, but it feels bedrock to me. Nothing in my worldview depends on it being true. Is this a hinge?"**  

  **Why this settles it**:  
  - If **NOT A HINGE**, she rejects "quiet certainties" and hinges require a *functional role* (it doesn't scaffold anything).  
  - If **HINGE**, she prioritizes *indubitability* over function, aligning with a psychologized or universality-based rule.  
  - Her answer would also clarify if hinges are purely transcendental (Wittgenstein's core view) or include personal certainties.  

  This question isolates the gap between her system and your taxonomy—and tests whether "nothing depends on it" is disqualifying (as in the moon case). Based on her existing notes, I predict she'd say **NOT A HINGE**, reinforcing the functional criterion.
