  ## Wedding Toast

  [Clinking glass] Friends, family, colleagues... and especially you two. Three weeks ago, my brother gave me one job: "Don't give *that* toast." You know the one. How wonderful he is, how impossibly lucky he is, how carefully they've planned this... all reasons that make perfect sense right here, right now, with the champagne flowing.

  But my brother spends his days thinking about promises made in much harder places. Picture this: you're stranded on a desert road. A kind driver stops. You desperately promise, "Get me to town, I'll pay you double!" The driver thinks: "*Once* we're at the bank... what reason does he *really* have to pay? None. The smart, rational thing for him is to walk away." That moment, when the promise comes due, is where the neat reasons vanish.

  My brother sees this as a crack in the foundation of pure rationality. Sometimes, he argues, the only way to get what you truly need – like that ride – is to *be* the kind of person who keeps a promise *even when* keeping it offers no immediate benefit. Even when it’s irrational *in that exact moment*.

  Now, the usual fix is to say, "Aha! So it’s *rational* to *become* the sort of person who keeps promises!" But my brother pushes back hard: "If you deliberately *install* that habit *because* it’s useful... doesn’t everyone see the wiring? Doesn’t the driver know that your ‘honesty’ is just a calculated tool? Is that *real* reassurance?"

  So, standing here, celebrating *your* promise... what can I honestly praise that holds water even when the metaphorical car pulls up outside the bank? Not the excellent reasons you have today – those are desert-road reasons. Not even the brilliant compatibility everyone sees – that’s analysis for *this* moment.

  What I *can* praise, with absolute confidence, is what you *didn't* choose for this occasion, but what chose you long ago. I praise the bedrock you both stand on. [*Gesture towards parents*] The stubborn decency drilled into you both by families who understand that a handshake means something, even when no one’s looking. The quiet expectations of the town you both come from, where showing up matters. And Gran [*Nod to second table*], whose steadfast belief that vows spoken before God hold because they are spoken *before God* – that’s not just faith, it’s a deep, unchosen anchor point. These things aren't tools you picked up; they're the ground you grew from. They’re the source of that disposition my brother circles – the one that comes from *outside* the calculation.

  And there’s something else in the air today. You didn’t promise “until it stops making sense.” You didn’t promise “for as long as it’s beneficial.” You promised “till death do us part.” Why does that old formula matter? Because a promise with a known, definite endpoint? It can start to unravel from the end backwards. “Just this once won’t matter, it’s almost over…” But a promise that points towards an unknowable horizon? That resists the unraveling. It forces a different kind of commitment, one sustained not by the next immediate benefit, but by the sheer, ongoing weight of the thing itself. It’s a declaration that the promise *changes* the rational landscape.

  So, Alex, Sarah. We’re not here because you’ve perfectly solved the desert road problem. We’re here because we trust the ground you stand on. We trust the unchosen decency in your bones. We trust the infinite horizon of that promise you just made. And Sarah, as an emergency physician, you know better than most that some things only hold when the pressure is on. We see that strength in you both.

  To Alex and Sarah: May your unchosen virtues hold fast, and may the horizon of your promise stretch forever, beautifully, unreasonably, bindingly forward. Cheers!

  ---

  ## Brief Note on the Philosophy & Confidence

  1.  **The Core Case & Rationality Critique:** **High Confidence.** The stranded motorist/Thomas Schelling-esque promise problem is a well-established puzzle in decision theory, game theory, and ethics (related to commitment problems, credible commitment, and the limits of instrumental rationality). Your brother’s framing about needing "local irrationality" is a valid and recognized interpretation.
  2.  **Critique of Deliberate Dispositions:** **Medium-High Confidence.** The objection that a *self-consciously adopted* disposition (like a "resolve" or "rule" adopted solely for strategic benefit) fails to provide genuine reassurance because its instrumental origin is transparent *is* a recognized problem. It touches on debates about "resolute choice" (McClennen), "rule worship," and the potential instability of such dispositions. Philosophers like Jon Elster ("Ulysses and the Sirens") and David Gauthier discuss the challenges of *self-binding* and whether commitments adopted instrumentally can be truly credible or stable, especially if others know they were adopted instrumentally. Your brother hasn't invented it over dinner, though his specific phrasing might be original. It *is* a live issue.
  3.  **Praising Upbringing/Unchosen Dispositions:** **High Confidence.** Shifting the focus to unchosen virtues/habits/upbringing ("the ground you grew from") as the source of credible commitment is philosophically sound and avoids the self-consciousness trap. It aligns with virtue ethics and sociological perspectives on how deep-seated norms enable cooperation. Praising Gran's faith as an unchosen anchor is perfectly valid in this context.
  4.  **The "Till Death Do Us Part" Mechanism:** **Low-Medium Confidence (The Shakiest Claim).** This is where the toast takes the biggest liberty and leans on your idea.
      *   **The Core Insight (Unraveling):** The basic idea that indefinite or infinite horizons can prevent backward unraveling in repeated games is **sound game theory** (the "infinite horizon" or "shadow of the future" concept, central to Axelrod's work on cooperation). A fixed endpoint *can* trigger unraveling ("the endgame problem").
      *   **The Application to Marriage Vows:** Framing the *specific vow* "till death do us part" as *causing* this effect by creating an indefinite horizon is **more metaphorical and contestable**.
          *   *Why Shaky?* Marriage isn't a literal infinitely repeated game. Death *is* a known endpoint, just an uncertain one. The crucial game-theoretic element is often the *expectation of continued interaction*, which "till death" powerfully signals but doesn't magically create an infinite game. Philosophers might argue the *social meaning* and *institutional weight* of the vow matter more than its literal temporal phrasing for preventing unraveling. Others might focus on the *intention* it signals.
          *   **The Toast's Approach:** The phrasing ("points towards an unknowable horizon," "resists the unraveling," "forces a different kind of commitment") leans into the *social and psychological power* of the vow rather than making a narrow game-theoretic claim. It presents the vow as a *mechanism* that *creates* the expectation of an indefinite future, changing the rational calculus. This is defensible as a sociological/psychological claim *inspired by* the game theory, but it's not a pure, uncontested game-theoretic proof. The philosophers will likely see the connection but recognize it as a practical application/interpretation, not a formal result.
      *   **Recommendation:** The toast uses it carefully, framing it as the vow changing the landscape and "forcing a different kind of commitment," which softens it from a technical claim to a meaningful observation about the vow's power. Given the context and the need for resonance beyond the theorists, this liberty is justified and unlikely to cause major offense, even if some theorists might quibble with the precise mechanism. The core point – that the vow *matters* by rejecting a finite endpoint – is strong.

  **Overall:** The toast navigates the brother's core philosophical constraint effectively. It avoids praising desert-road reasons, centers unchosen virtues, respectfully incorporates Gran's faith as a solution, and carefully deploys the "till death" insight as a meaningful social mechanism rather than a brittle technical claim. The weakest *philosophical* link is the specific causal mechanism attributed to the "till death" vow preventing unraveling, though it's presented in a way that emphasizes its social force over pure game theory. The worry about self-conscious dispositions is absolutely a live issue. Good luck! It's a brilliant and heartfelt approach.
