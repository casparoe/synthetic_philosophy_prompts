prompt: |-
  I'm writing a short piece for policy staff who commission studies and evaluations, and who mostly assume that if a report would substantially change what they believe, commissioning it is worth it. I want one case that pries apart how much a signal tells you from how much the signal is worth.

  Construct a single ordinary decision problem — a hiring decision, a treatment choice, a procurement, your pick; no thought-experiment machinery and no perfect predictors, though a realistically imperfect test with known error rates is fine — and give it twice. In the first version the signal moves the agent's credence a long way, from roughly even odds to near-certainty either way, and is nevertheless worth exactly zero: expected utility conditional on receiving it equals expected utility without it, so the non-negativity that Good's theorem guarantees holds as an equality rather than an improvement. In the second version the same signal, with the same priors, the same likelihoods and the same utility function, is worth strictly more than zero. The two versions may differ in exactly one structural feature, which you have to name, and it cannot be the informativeness of the signal, the priors, the likelihoods, or the payoffs. Give the numbers and the expected-value calculations for both, so that it is visible that the belief change is identical while the verdict is not.

  Then say which feature is carrying the case and what happens to the second version without it, and give the strongest defense of the worthless signal in the first version — value for decisions not yet foreseen, epistemic value, and so on — along with your reply to it. Finally, my readers will point out that the theorem only ever says information cannot hurt in expectation: is a third version available, in which the same signal, private and free, has strictly negative value for an agent who still updates by conditionalization and still maximizes expected utility? If not, say which assumption has to be given up and what conceding it costs.
reasoning: |-
  We are going to construct two decision problems. In both, we have an agent who must choose an action. There is an uncertain state of the world that affects the utility of the actions. The agent can observe a signal (a test result) that is informative about the state. The key is that in the first version, the signal, despite being very informative (moving the agent from about 50% belief to near certainty), has zero value in terms of improving the expected utility of the decision. In the second version, the same signal (with same prior, same likelihoods, same utility function) is strictly valuable.

   The structural feature that we will change is the set of available actions. In the first version, the agent has only one action that is optimal regardless of the state. In the second version, the agent has two actions and the optimal action depends on the state.

   We'll use a medical treatment decision as our example.

   Setting:
     - There is a disease that a patient may or may not have.
     - States: D (disease present) and ~D (disease absent). 
     - Prior: P(D) = 0.5, so even odds.
     - There is a test with known error rates:
          Sensitivity: P(test positive | D) = P(+|D) = 0.99
          Specificity: P(test negative | ~D) = P(-|~D) = 0.99

     So the likelihoods are:
          P(+|D) = 0.99, P(-|D) = 0.01
          P(+|~D) = 0.01, P(-|~D) = 0.99

   We'll design two scenarios:

   Scenario 1 (Worthless signal):
     - Actions available: Only one action, say "do nothing". 
       (Or, equivalently, two actions that have the same utility in every state? But we want to show that the signal doesn't change the decision because the decision is fixed.)

     Actually, to make it a decision problem, we must have at least two actions. But we can set the utilities such that one action dominates regardless of the state.

     Let the actions be:
          A: Treat
          B: Do nothing

     But we set the utilities so that doing nothing is always the best? Or we can set that treating is always bad? Instead, let's set:

          If the disease is present (D):
              Treat: utility = 0
              Do nothing: utility = -100   (very bad outcome)

          If the disease is absent (~D):
              Treat: utility = -10   (because of side effects)
              Do nothing: utility = 0

     However, with these utilities, without any test, the expected utility of treating and not treating are:

          EU(Treat) = P(D)*0 + P(~D)*(-10) = 0.5*0 + 0.5*(-10) = -5
          EU(Do nothing) = P(D)*(-100) + P(~D)*0 = 0.5*(-100) + 0.5*0 = -50

     So the agent would choose to Treat (EU=-5) without the test.

     Now, what if the test comes positive?

          P(D|+) = P(+|D)*P(D) / P(+) = (0.99 * 0.5) / (0.99*0.5 + 0.01*0.5) = (0.495) / (0.5) = 0.99

          So P(D|+) = 0.99, P(~D|+) = 0.01

          EU(Treat|+) = 0.99*0 + 0.01*(-10) = -0.1
          EU(Do nothing|+) = 0.99*(-100) + 0.01*0 = -99

          So the agent still chooses Treat (with EU=-0.1).

     What if the test comes negative?

          P(D|-) = P(-|D)*P(D) / P(-) = (0.01 * 0.5) / (0.01*0.5 + 0.99*0.5) = 0.005 / 0.5 = 0.01
          P(~D|-) = 0.99

          EU(Treat|-) = 0.01*0 + 0.99*(-10) = -9.9
          EU(Do nothing|-) = 0.01*(-100) + 0.99*0 = -1

          So the agent chooses Do nothing (EU=-1) which is better than Treat (EU=-9.9).

     Now, the expected utility without the test is the maximum of the two actions: 
          Without test: max(EU(Treat), EU(Do nothing)) = max(-5, -50) = -5

     With the test, the expected utility is the weighted average of the best actions given the test result:

          P(+) = 0.5, best action: Treat -> EU=-0.1
          P(-) = 0.5, best action: Do nothing -> EU=-1

          Expected utility with test = 0.5*(-0.1) + 0.5*(-1) = -0.05 - 0.5 = -0.55

     Wait, that's better than -5? So the test is valuable? We want zero value.

     We need to adjust so that the expected utility with the test is the same as without. How about we change the utilities so that the optimal action without the test is the same as the average of the optimal actions with the test? 

     Alternatively, we can set the utilities so that without the test, the agent is indifferent? But then the test might break the tie and become valuable.

     Let's try a different setting for Scenario 1:

     We want the signal to be worthless. So we want the optimal action to be the same regardless of the signal. How can we achieve that?

     We can set the utilities so that one action is always better than the other, no matter the state? But then the signal is irrelevant.

     For example:

          If D: 
              Treat: 10
              Do nothing: 0
          If ~D:
              Treat: 10
              Do nothing: 0

     Then without the test, EU(Treat)=10, EU(Do nothing)=0 -> choose Treat.

     With a positive test: choose Treat (because in both states, Treat is better).
     With a negative test: choose Treat.

     So the test doesn't change the action. Therefore, the expected utility with the test is the same as without: 10.

     But note: the test moves the belief? 

          Prior: P(D)=0.5 -> after positive test: P(D|+)=0.99, after negative: P(D|-)=0.01.

     However, the optimal action remains Treat in both cases. So the value of the test is zero.

     This is the first version.

     Now, for the second version, we change the utilities so that the optimal action depends on the state.

          If D: 
              Treat: 10
              Do nothing: 0
          If ~D:
              Treat: 0   (because treatment has side effects and is unnecessary)
              Do nothing: 10

     Without the test:
          EU(Treat) = 0.5*10 + 0.5*0 = 5
          EU(Do nothing) = 0.5*0 + 0.5*10 = 5

          So the agent is indifferent. We can assume they flip a coin? Or we can break the tie arbitrarily? Actually, the expected utility of any decision is 5.

     Now, with a positive test:

          P(D|+)=0.99, P(~D|+)=0.01

          EU(Treat|+) = 0.99*10 + 0.01*0 = 9.9
          EU(Do nothing|+) = 0.99*0 + 0.01*10 = 0.1

          So choose Treat -> EU=9.9

     With a negative test:

          P(D|-)=0.01, P(~D|-)=0.99

          EU(Treat|-) = 0.01*10 + 0.99*0 = 0.1
          EU(Do nothing|-) = 0.01*0 + 0.99*10 = 9.9

          So choose Do nothing -> EU=9.9

     The expected utility with the test: 
          P(+)*9.9 + P(-)*9.9 = 0.5*9.9 + 0.5*9.9 = 9.9

     Without the test, the expected utility was 5.

     Therefore, the value of the test is 9.9 - 5 = 4.9.

     Summary of the two versions:

     Version 1 (worthless signal):
          Utilities:
              D: Treat->10, Do nothing->0
              ~D: Treat->10, Do nothing->0

          Without test: choose Treat -> EU=10
          With test: always choose Treat -> EU=10 (regardless of the test result)

          Therefore, the value of the test = 10 - 10 = 0.

          But note: the test does change beliefs (from 0.5 to 0.99 or 0.01) but doesn't change the action.

     Version 2 (valuable signal):
          Utilities:
              D: Treat->10, Do nothing->0
              ~D: Treat->0, Do nothing->10

          Without test: EU=5 (because both actions yield 5)
          With test: EU=9.9

          Value of the test = 9.9 - 5 = 4.9.

     The only difference between the two versions is the utility function in the state ~D: in Version 1, Treat yields 10 in both states, while in Version 2, Treat yields 10 in D and 0 in ~D, and Do nothing yields 0 in D and 10 in ~D.

     The structural feature that changed is the set of state-dependent utilities (or the payoffs in the different states). But note: the problem statement says we cannot change the payoffs, the priors, the likelihoods, or the informativeness of the signal. However, the problem also says the two versions may differ in exactly one structural feature. We are changing the utility function. But wait, the problem says "the same utility function" in the two versions? 

     Let me reread the problem: "the same signal, with the same priors, the same likelihoods and the same utility function". 

     So we cannot change the utility function. Therefore, we must find another structural feature.

     How about we change the set of available actions? 

     We can do:

     Version 1: 
          Actions available: {Treat}

          Then regardless of the signal, the agent must choose Treat.

          Without test: EU = 0.5*10 + 0.5*0 = 5   [if we use the utility function of Version 2? But wait, we want the same utility function?]

     Alternatively, we can define the utility function to be the same and change the action set.

     We'll use the same utility function for both versions:

          U(Treat, D) = 10
          U(Treat, ~D) = 0
          U(Do nothing, D) = 0
          U(Do nothing, ~D) = 10

     Now, in Version 1, we remove the action "Do nothing", so the only available action is "Treat".

          Without test: only action is Treat -> EU = 0.5*10 + 0.5*0 = 5
          With test: still only Treat -> EU is the same: 
              If positive: 0.99*10 + 0.01*0 = 9.9
              If negative: 0.01*10 + 0.99*0 = 0.1
              Weighted: 0.5*9.9 + 0.5*0.1 = 5

          So the expected utility with the test is 5, same as without. The test is worthless.

     In Version 2, we have both actions available.

          Without test: 
              EU(Treat)=5, EU(Do nothing)=5 -> choose either (EU=5)
          With test: 
              Positive: choose Treat -> 9.9
              Negative: choose Do nothing -> 9.9
              Weighted: 9.9

          Value of the test: 9.9 - 5 = 4.9.

     The structural feature that changed is the set of available actions.

     This fits: we changed the action set (from only Treat to both Treat and Do nothing) and kept the same prior, same likelihoods, same utility function.

     Therefore, we have:

     Version 1:
          Actions: {Treat}
          Prior: P(D)=0.5
          Likelihoods: P(+|D)=0.99, P(-|D)=0.01, P(+|~D)=0.01, P(-|~D)=0.99
          Utilities:
              Treat: D->10, ~D->0

          Without test: EU = 0.5*10 + 0.5*0 = 5
          With test: 
              P(+) = 0.5, then EU = 0.99*10 + 0.01*0 = 9.9
              P(-) = 0.5, then EU = 0.01*10 + 0.99*0 = 0.1
              Overall EU with test = 0.5*9.9 + 0.5*0.1 = 5

          Therefore, the value of the test is 0.

     Version 2:
          Actions: {Treat, Do nothing}
          Prior, likelihoods, utilities: same as above.

          Without test:
              EU(Treat) = 5
              EU(Do nothing) = 0.5*0 + 0.5*10 = 5
              So max = 5

          With test:
              If positive:
                  EU(Treat|+) = 9.9
                  EU(Do nothing|+) = 0.99*0 + 0.01*10 = 0.1
                  Choose Treat -> 9.9
              If negative:
                  EU(Treat|-) = 0.1
                  EU(Do nothing|-) = 0.01*0 + 0.99*10 = 9.9
                  Choose Do nothing -> 9.9
              Overall EU with test = 0.5*9.9 + 0.5*9.9 = 9.9

          Value of the test: 9.9 - 5 = 4.9.

     The belief change is the same in both versions (the posterior probabilities are 0.99 and 0.01, respectively), but in Version 1 the signal is worthless because the agent has no alternative action to take.

     The feature carrying the case is the set of available actions. In the first version, the agent has only one action, so the signal cannot change the decision. In the second version, the agent has two actions and the signal guides the choice.

     Now, the strongest defense of the worthless signal in the first version:

          One might argue that even though the signal has no value for the current decision, it might have value for future decisions that the agent hasn't foreseen, or it might have epistemic value (knowledge for its own sake). For instance, the test result might be useful for research purposes or for informing other patients.

     Reply:

          While that is true, the value of information as defined in decision theory is specific to the decision problem at hand. The theorem of Good (and the non-negativity of the value of information) applies to the current decision. If there are other decisions that might be affected, then the decision problem should be expanded to include them. But in the context of the current, isolated decision, the signal has zero value. Moreover, if the agent is only concerned with the current decision, then expending resources to get the signal is not justified.

     Finally, about the possibility of a strictly negative value for a signal:

          Good's theorem states that the expected value of information is non-negative for a Bayesian agent who updates by conditionalization and maximizes expected utility. Therefore, under these assumptions, it is impossible for a free, private signal to have strictly negative value.

          The assumptions are:
            - The agent updates by conditionalization (Bayes' rule).
            - The agent chooses actions to maximize expected utility.

          If we relax the assumption that the signal is free and private, then negative value is possible. For example:
            - If the signal is costly, then the cost might exceed the benefit, leading to negative net value.
            - If the signal is not private (e.g., it is observed by an adversary who then changes their behavior in a way that harms the agent), then it might lead to a worse outcome.

          But in the setting described (private and free), the value cannot be negative.

          To get a negative value, we must relax one of the assumptions. For instance, if the agent does not update by conditionalization (e.g., they update incorrectly), then the signal might lead them to make a worse decision. Alternatively, if the agent does not maximize expected utility (e.g., uses a different decision rule) then the signal might be harmful.

          However, note that the problem specifies that the agent updates by conditionalization and maximizes expected utility.

          Therefore, a third version with strictly negative value for a free, private signal is not possible without violating these assumptions.

          Conceding the assumption of correct updating or expected utility maximization would cost the coherence of the agent's beliefs and decisions. In particular, if the agent does not update correctly, they may make systematically suboptimal decisions. Similarly, if the agent does not maximize expected utility, they may violate the axioms of rational choice.

     So we conclude:

          The two versions show that the same signal can have zero value in one decision context (with only one available action) and positive value in another (with two available actions). The key structural feature is the set of available actions.

          The value of information is not solely determined by how much it changes beliefs, but by how much it enables better decisions. Without the possibility of changing the decision, the signal is worthless for that particular decision.

          And under the standard assumptions of Bayesian decision theory, a free, private signal cannot have negative value.
answer: |-
  ### Case Study: The Value of Information in Decision Problems

  I'll present two versions of a hiring decision problem. In both, a company must decide whether to hire a candidate for a critical role. The candidate may be either competent (state \(C\)) or incompetent (state \(I\)), with prior probability \(P(C) = P(I) = 0.5\). The company uses a pre-employment test with known error rates:
  - Sensitivity: \(P(\text{Test Pass} \mid C) = 0.95\)
  - Specificity: \(P(\text{Test Fail} \mid I) = 0.95\)

  Thus, the likelihoods are symmetric:
  - \(P(\text{Pass} \mid C) = 0.95\), \(P(\text{Fail} \mid C) = 0.05\)
  - \(P(\text{Pass} \mid I) = 0.05\), \(P(\text{Fail} \mid I) = 0.95\)

  **Utility Function** (same for both versions):  
  - Hire a competent candidate: \(+100\)  
  - Hire an incompetent candidate: \(-100\)  
  - Reject a competent candidate: \(-10\) (opportunity cost)  
  - Reject an incompetent candidate: \(+0\) (no cost)  

  ---

  #### **Version 1: Signal Moves Beliefs but Has Zero Value**  
  **Structural Feature:** The company has only one available action: "Hire".  

  **Decision Problem:**  
  - Without the test:  
    - Only action: Hire  
    - Expected utility: \(0.5 \times 100 + 0.5 \times (-100) = 0\)  

  - With the test (using Bayes' theorem):  
    - If **Pass**:  
      - \(P(C \mid \text{Pass}) = \frac{0.95 \times 0.5}{(0.95 \times 0.5) + (0.05 \times 0.5)} = \frac{0.475}{0.5} = 0.95\)  
      - Belief moves from 50% to 95% for \(C\), but action is still "Hire" (only choice).  
      - Utility: \(0.95 \times 100 + 0.05 \times (-100) = 95 - 5 = 90\)  
    - If **Fail**:  
      - \(P(C \mid \text{Fail}) = \frac{0.05 \times 0.5}{(0.05 \times 0.5) + (0.95 \times 0.5)} = \frac{0.025}{0.5} = 0.05\)  
      - Belief moves from 50% to 5% for \(C\), but action is still "Hire".  
      - Utility: \(0.05 \times 100 + 0.95 \times (-100) = 5 - 95 = -90\)  
    - Expected utility with test:  
      - \(P(\text{Pass}) = 0.5\), \(P(\text{Fail}) = 0.5\)  
      - \(0.5 \times 90 + 0.5 \times (-90) = 0\)  

  **Result:**  
  - Beliefs shift substantially (50% → 95% or 5%), but signal has **zero value** (expected utility = 0, same as without test).  

  ---

  #### **Version 2: Same Signal, Strictly Positive Value**  
  **Structural Feature:** The company has two available actions: "Hire" **or** "Reject".  

  **Decision Problem:**  
  - Without the test:  
    - EU(Hire) = \(0.5 \times 100 + 0.5 \times (-100) = 0\)  
    - EU(Reject) = \(0.5 \times (-10) + 0.5 \times 0 = -5\)  
    - Optimal action: **Hire** (EU = 0)  

  - With the test:  
    - If **Pass**:  
      - \(P(C \mid \text{Pass}) = 0.95\) (same as Version 1)  
      - EU(Hire) = \(0.95 \times 100 + 0.05 \times (-100) = 90\)  
      - EU(Reject) = \(0.95 \times (-10) + 0.05 \times 0 = -9.5\)  
      - Optimal action: **Hire** (EU = 90)  
    - If **Fail**:  
      - \(P(C \mid \text{Fail}) = 0.05\) (same as Version 1)  
      - EU(Hire) = \(0.05 \times 100 + 0.95 \times (-100) = -90\)  
      - EU(Reject) = \(0.05 \times (-10) + 0.95 \times 0 = -0.5\)  
      - Optimal action: **Reject** (EU = \(-0.5\))  
    - Expected utility with test:  
      - \(0.5 \times 90 + 0.5 \times (-0.5) = 45 - 0.25 = 44.75\)  

  **Result:**  
  - Same belief shifts (50% → 95% or 5%), but signal has **strictly positive value** (expected utility increases from 0 to 44.75).  

  ---

  ### Key Insight: The Structural Feature  
  The **set of available actions** differs between versions:  
  - Version 1 has only "Hire" (no alternative action).  
  - Version 2 has "Hire" **and** "Reject".  

  **Why this matters:**  
  In Version 1, the signal changes beliefs but cannot change the decision (only one action exists). In Version 2, the signal enables switching actions based on beliefs. The value of information arises only when it can influence a **meaningful choice**.  

  **What happens without it?**  
  If Version 2 lacked the "Reject" option (like Version 1), the signal would again be worthless. Conversely, adding an alternative action to Version 1 would restore value (as in Version 2).  

  ---

  ### Defense of the Worthless Signal & Reply  
  **Strongest defense:**  
  The test in Version 1 may have *epistemic value* (e.g., improving future decisions, satisfying regulatory requirements, or building organizational knowledge) despite having zero value for this specific decision.  

  **Reply:**  
  While true, this defense conflates *instrumental value for the current decision* with *potential future benefits*. Good’s theorem addresses only the former: if a signal cannot alter the optimal action *in the current decision problem*, it has no decision-theoretic value *here and now*. Future benefits require expanding the decision scope (e.g., including long-term learning), but in isolation, the signal is worthless for this choice.  

  ---

  ### Can a Signal Have Strictly Negative Value?  
  **Theorem constraint:** Good’s theorem guarantees that free, private signals have non-negative expected value under:  
  1. Bayesian updating (conditionalization).  
  2. Expected utility maximization.  

  **Result:**  
  A third version with **strictly negative value** is impossible without violating these assumptions. For example:  
  - If the agent updates irrationally (e.g., misapplies Bayes’ rule), the signal could harm decisions.  
  - If the agent rejects utility maximization (e.g., uses a risk-seeking criterion), the signal might reduce perceived value.  

  **Cost of conceding these:**  
  Abandoning rational updating or utility maximization implies the agent is systematically biased or incoherent, making optimal decisions unreliable. In policy contexts, this undermines the foundation of evidence-based decisions.  

  ---

  ### Conclusion  
  The case shows that a signal’s *informational value* (belief change) and *decision value* (utility improvement) are distinct. **Decision value depends critically on the set of available actions**—even a highly informative signal is worthless if it cannot change the decision. Policy staff should:  
  1. Map all viable actions *before* commissioning studies.  
  2. Assess whether new information could alter the optimal action.  
  This ensures resources are spent only on signals that can improve decisions.
