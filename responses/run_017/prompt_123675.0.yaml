  For the final requirements, I'll:
  1. Anchor each to concrete cases (e.g. dreamless sleep for dormancy)
  2. Tag negotiability based on dialectical purpose
  3. Highlight where standard assumptions might be questioned (e.g. composition-tracking's physicalist bias)

  The scoring table must be concise but precise:
  - Primitive bonding fails dormancy/scalarity
  - Panqualityism dodges subject-summing but struggles with structural fit
  - Cosmopsychism inverts but doesn't solve the problem
