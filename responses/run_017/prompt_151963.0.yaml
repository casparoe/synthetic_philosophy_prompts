  (a) Rational informational cascades: Individuals rationally disregard their private evidence because the accumulated public information (from others' actions) outweighs it.
  (b) Reputational/herding cascades: Individuals follow the crowd for reasons unrelated to information (e.g., social pressure, incentives for conformity).

  Constraints:
  - 14 participants (ops and incident-response teams)
  - 1 hour total
  - Materials: deck of cards, index cards
  - No real money, but we can use a points system
  - Must have: 
    - Private evidence of varying quality (some get better information than others)
    - Full sequence of choices visible (not just a tally)
    - At least one person holds strong evidence against a unanimous crowd

  We'll avoid the standard urn setup. Instead, we'll use a scenario with a "system failure" where participants must decide the cause (e.g., two possible causes: "Network" or "Database").

  Design Sketch:

  **Candidate 1: A modified urn-like game with two urns and a sequence of draws.**
  - Why drop? It's too close to the standard urn, and even with modifications, it might feel abstract and not connect to their incident-response context. Also, varying signal quality is hard to implement naturally.

  **Candidate 2: A "whodunit" mystery with clues.**
  - Why drop? It might be too complex to set up and explain in one hour, and the varying quality of evidence might be arbitrary and not transparent.

  **Candidate 3: A "system alert" scenario with sequential decisions.**
  - This seems promising. We'll simulate an incident where participants, as responders, see an alert and must decide the cause. We'll use a deck of cards to represent the alert signals.

  Chosen Design: **"System Alert Cascade"**

  **Setup:**
  - We have two possible root causes for an alert: "Network" (let's call it Cause A) or "Database" (Cause B). The true cause is determined randomly at the start (e.g., by a coin flip).
