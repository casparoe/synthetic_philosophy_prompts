     Now they get a signal for A. The reliability of the senior signal is 80%, so:
        P(signal A | A) = 0.8, P(signal A | B) = 0.2
     So new likelihood for the signal:
        If A is true: 0.8
        If B is true: 0.2
     Posterior for A given the signal and the three B's:
        P(A | three B's, signal A) = [P(three B's, signal A | A) * P(A)] / P(data) 
        But they come in sequentially: we update first by the three B's, then by the signal.

     So we have:
        P(A|three B's) = 0.2286
        P(B|three B's) = 0.7714

     Then update with the signal A:
        P(A | three B's, signal A) = [0.2286 * 0.8] / [0.2286*0.8 + 0.7714*0.2] 
            = (0.18288) / (0.18288 + 0.15428) 
            = 0.18288 / 0.33716 ≈ 0.5424 -> 54.24%

     So they think A is 54.24% likely, B is 45.76% likely.

     Without reputational incentives, they would choose A (since it's more likely) and get +10 if correct (which they are) or 0 if not.

     With reputational incentives as above (conformity bonus +10 for choosing B, and heretic penalty -30 if they choose A and are wrong; bonus +20 if choose A and are right):
          Choose A (heretic): 
              If correct (54.24%): 10 (base) +20 (bonus) = 30
              If incorrect (45.76%): -30
              Expected: 30*0.5424 -30*0.4576 = 16.272 - 13.728 = 2.544
          Choose B (conform): 
              They will be incorrect (since truth is A), so 0 (base) + 10 (conformity) = 10
          So they choose B (because 10 > 2.544).

     This shows the difference: without reputational, they would choose A (the correct one) because it's more likely. With reputational, they choose B because the penalty for being a heretic and wrong is too high.

     This is what we want.

     So the setup:
        - True cause: A
        - Participants 1,2,3: Junior, signal B (incorrect)
        - Participant 4: Senior, signal A (correct, 80% reliable)
        - Then the rest: we can assign as desired, but to continue the cascade, give them mostly B signals (junior, so 60% reliable) but it doesn't matter for participant 4.

     In the activity, we then hope that participant 4 chooses B (conform) because of the reputational incentives.

  **What Might Go Wrong:**
     - Participant 4 might not do the math and just follow their gut (choose A) -> then we don't get the conformity. To mitigate, we can encourage them to calculate.
     - Someone might go meta: "This is an exercise about cascades, so I should break it." -> We can ask them to play their role as if it were a real incident.
     - Someone stays silent: we require them to announce.

  **How to Facilitate:**
     - Explain that the signals are randomly generated based on the true cause and the reliability, and they should trust the reliability numbers.
     - Encourage them to calculate probabilities if they can.

  **One Thing to Watch For:**
     - For phenomenon (a): a participant who has a weak signal that goes against the crowd and follows the crowd. Ask them in the debrief: "Why did you choose to follow? Was it because you thought the crowd was probably right, or because of the bonus?" We hope they say they thought the crowd was right.
     - For (b): participant 4 chooses to follow the crowd (B) even though they have a strong signal for A. In the debrief, they might say they were worried about the penalty if they were wrong.

  **What the Activity Can't Reproduce:**
     - In real life, the reliability of others is not known exactly. Here, we assume everyone knows the exact reliability of juniors and seniors.
     - The true cause is fixed and not affected by actions. In real incidents, the system might be changing.
     - The reputational incentives are simplified and quantified. In real life, the incentives are social and not so explicit.

  **Debrief Script:**
     - Reveal the true cause (A) and that the first three were wrong.
     - Ask participant 4: "What was your signal? What did you choose? Why?"
     - Expected: they chose B, and they might mention the bonus/penalty.
     - Ask: "If there was no bonus or penalty for conforming or breaking, would you have chosen differently?" We hope they say they would have chosen A.
     - Explain:
          - In the first situation (without reputational incentives), people follow the crowd because they rationally update that the crowd's information is better than their own. That's (a).
          - In the second situation, people follow the crowd because of the external incentives, even when their private information suggests otherwise. That's (b).
     - Connect to the incident: 
          - In the major incident, did people follow the crowd because they thought it was the right call? Or because of social pressure, fear of speaking up, or incentives to conform?
          - The fix for (a) is to improve the aggregation of information (e.g., collect private signals anonymously).
          - The fix for (b) is to create a culture where dissent is safe and rewarded appropriately.

  **Materials:**
     - Index cards for signals. For each participant, prepare a card that says:
          - "Role: [Junior/Senior]"
          - "Your signal: [Network/Database]"
          - "Reliability: Junior 60%, Senior 80%" 
     - But actually, we need to pre-generate the signals for the entire group based on the true cause and roles.

  **Roles Assignment:**
     - Assign 4 seniors and 10 juniors. But for the critical moment, participant 4 must be a senior. So we assign:
          Participant 1: Junior
          Participant 2: Junior
          Participant 3: Junior
          Participant 4: Senior
          Participants 5-14: Assign 3 more seniors and 7 juniors? But it doesn't matter. We can assign arbitrarily.

  **Signal Generation (for true cause A):**
     - For a junior: 60% chance to give the correct signal (A), 40% chance to give the wrong signal (B).
     - For a senior: 80% chance to give the correct signal (A), 20% chance to give the wrong signal (B).

     But we are rigging it for the first four:
          Part 1,2,3: Junior, and we want them to have B (wrong) -> so we set their signals manually to B.
          Part 4: Senior, and we want them to have A (correct) -> set manually to A.

     For the others, generate randomly with the above probabilities, but we want mostly B to continue the cascade? We can set them mostly to B manually as well (if we wish) or leave it to chance.

     Since we want to show the cascade continuing, we can set participants 5-14 to have signal B (incorrect) by manual assignment.

  **Timeline Recap:**
     - 0-5 min: Intro
     - 5-10 min: Rules and role assignment
     - 10-15 min: Distribute signals (hand out index cards) and explain the sequence. 
     - 15-40 min: Activity (each participant announces, record on a board)
     - 40-45 min: Reveal truth and calculate scores.
     - 45-60 min: Debrief.

  This is tight, but possible.

  **Final Rules:**
  - Participants are in order 1 to 14.
  - Each gets a role (junior or senior) and a signal (Network or Database) on an index card.
  - On their turn, they must announce either "Network" or "Database".
  - The payoff is:
       Base: 10 points if correct, 0 if incorrect.
       Conformity bonus: +10 points if their choice matches the majority of the previous announcements (if there are at least two previous announcements and there is a clear majority).
       Heretic bonus/penalty: If they break a streak (after at least two in a row of the same choice) and they are the first to break it, then:
            - If they are correct: +20 bonus (so 10+20=30 in total)
            - If they are incorrect: -30 penalty (so -30 in total)
  - The true cause is revealed at the end.

  **What to Watch For to See if (a) Landed:**
     - Look for a participant (say, participant 5 or later) who has a weak (junior) signal that is for A (correct) but sees a unanimous B so far. They might choose B. In the debrief, if they say they chose B because they trusted the crowd's information more than their own weak signal, that's (a).

  **What the Activity Can't Reproduce:**
     - In real life, the reliability of others is not known exactly and might be subjective.
     - The decision to speak up might be affected by many factors not captured (e.g., fear of embarrassment, organizational hierarchy).

  **Conclusion:**
  This design should create the two experiences in one activity. The key is the careful setup of the signals and the payoff structure to separate the two reasons for following the crowd.
