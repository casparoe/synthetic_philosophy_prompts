  **Signal Quality Variation:**
  - We use two types of cards: 
    - **High-quality signal (H)**: A card that has a high probability of being correct (e.g., 80%). We might have 4 of these (for 4 participants).
    - **Low-quality signal (L)**: A card that is only 60% correct. The remaining 10 participants get these.
  - How to represent: 
    - For Cause A, H cards might say "A (strong)" and L cards say "A (weak)".
    - Similarly for Cause B.
    - But note: the actual truth is independent. So if the true cause is A, then an H card for A is correct (and appears with 80% probability) and an H card for B is incorrect (20%). Similarly, L card for A is correct with 60% and for B with 40%.

