  ### Workshop Design: "Incident Alert Cascade"

  #### Core Mechanics
  - **Scenario**: Teams diagnose a system failure (Network vs. Database) using alerts. Each player gets a private "alert signal" (index card) of varying reliability. Players announce diagnoses sequentially, seeing all prior choices.
  - **Truth**: Predetermined (e.g., "Network"), hidden until debrief.
  - **Signal Quality**:
    - **Senior Engineers (3 players)**: 80% reliable signals (strong evidence).
    - **Junior Engineers (11 players)**: 60% reliable signals (weak evidence).
  - **Payoff Rules**:
    - **Base**: +10 points for correct diagnosis, 0 for incorrect.
    - **Conformity Bonus**: +10 points for matching the majority of prior announcements (if ≥2 prior decisions and clear majority).
    - **Heretic Penalty/Reward**: If breaking a streak (≥3 identical prior choices):  
      - **Correct**: +20 bonus (total 30).  
      - **Incorrect**: -30 penalty (total -30).

  ---

  ### Activity Flow (60 min)
  1. **Setup (10 min)**  
     - Assign player order (1–14). Rig signals (see below).  
     - Explain rules, payoffs, and roles (senior/junior reliability). Emphasize: "Maximize points; no collusion."  
     - *Materials*: Index cards (signals), whiteboard (record decisions).

  2. **Gameplay (25 min)**  
     - Players 1–14 announce diagnoses ("Network" or "Database") in order.  
     - **Critical Rigging for (a) and (b)**:  
       - **Truth**: "Network".  
       - Players 1–3 (Junior): Get *wrong* signals ("Database").  
       - Player 4 (Senior): Gets *correct* signal ("Network").  
       - Players 5–14: Mostly wrong signals ("Database").  
     - Record all choices publicly (e.g., whiteboard: "P1: DB, P2: DB, ...").

  3. **Scoring & Reveal (5 min)**  
     - Calculate points using payoff rules. Reveal true cause ("Network").

  4. **Debrief (20 min)**  
     - **Step 1**: *Reflect*: "How did Player 4 feel? What about late players with weak signals?"  
     - **Step 2**: *Contrast*:  
       - **(a) Rational Cascade (Player 5+ with weak signals)**:  
         *"Player 5 saw three 'DB' and knew their own signal was weak (60%). Following wasn't laziness—it was rational. The crowd's *information* outweighed their evidence."*  
         🔗 *Map to incident*: "In our outage, did we follow because the *data* suggested it was wise?"  
       - **(b) Reputational Cascade (Player 4)**:  
         *"Player 4 had strong evidence for 'Network' (80%) but chose 'Database' anyway. Why? The +10 conformity bonus and -30 heretic penalty made the *social risk* too high, even when the crowd was wrong."*  
         🔗 *Map to incident*: "Did we pile on last quarter because dissent felt *socially unsafe*, not because the data was compelling?"  
     - **Step 3**: *Solutions*:  
       - Fix (a): **Anonymous voting** (aggregate signals without social pressure).  
       - Fix (b): **Reward dissent** (e.g., "Best Heretic" bonus in incidents).

  ---

  ### Predictable Problems & Mitigations
  - **"Going Meta"**: Players may suspect rigging.  
    *Mitigation*: "Treat this as a real incident—the payoffs mirror real-world incentives."  
  - **Silent Players**: Late players may disengage.  
    *Mitigation*: Cold-call: "Player 12, what did you see *before* your turn?"  
  - **Confusing Payoffs**: Clarify with examples pre-game.

  ---

  ### How to Tell if (a) Landed
  - **Watch for**: A junior player (e.g., Player 5–14) who *hesitates* but follows the crowd, then says:  
    *"My signal was weak, and three people already agreed—it made sense to ignore mine."*  
    → This signals they felt the **informational weight** (a), not just social pressure (b).

  ---

  ### Structural Limitation of the Activity
  **What it can’t replicate**:  
  In real incidents, **signal reliability is ambiguous and dynamic** (e.g., "Is Alice’s judgement *really* 80% reliable?"). Here, reliability is fixed/known, making decisions more rational than reality.  

  **Say in debrief**:  
  *"In the game, you knew exactly how reliable each signal was. But during our outage, we didn’t know whose judgement to trust—and that uncertainty makes both cascades more likely. That’s why we need systems like anonymous voting or pre-defined severity thresholds."*

  ---

  ### Why This Design Works
  1. **Varying signal quality** (junior/senior) forces players to weigh evidence vs. crowd.  
  2. **Full sequence visibility** mimics real incident logs (e.g., Slack, war rooms).  
  3. **Player 4’s dilemma** creates a visceral contrast: strong evidence vs. social risk.  
  4. **Payoffs mirror real incentives** (conformity = safe, dissent = risky).  

  Dropped alternatives:  
  - **Urn-and-balls**: Too abstract; ignores variable evidence quality/social payoffs.  
  - **"Whodunit" mysteries**: Overly complex; hard to rig reliably in 60 min.  

  Run it as-is—it’s messy enough to feel real, structured enough to teach.
