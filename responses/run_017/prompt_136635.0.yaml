  - Tally-board: 8 balls, curtain, 4 slots. Erase station active.
  - Trapdoor: 8 balls, curtain, no board, use trapdoor.
  - Lazy: 8 balls, curtain, 4 slots, but they can record coarsely (e.g., use only 2 slots? or record only when they feel like it) -> they choose.
  - Archive: 8 balls, curtain, unlimited tape, no erasure during, but charge per tape piece (or charge later for erasing the archive).

  We'll provide rule cards for each role for each round.

  This should fit in 90 minutes and convey the key ideas.
answer: |-
  Below is a comprehensive activity design based on your requirements. I'll address each numbered request in sequence, emphasizing hands-on discovery, tangible accounting, and structured debriefing. The design uses low-cost materials (<$50), focuses on experiential learning, and targets your key concepts.

  ---

  ### **1. Physical Apparatus**
  **Materials ($40-50):**
  - **Tray & Shutter:** Shallow cardboard box (18"x12"x3") divided into LEFT/RIGHT chambers by a cardboard partition. A sliding cardboard shutter covers a hole (2" diameter) in the partition. *Cost: $5 (box, cardboard, tape).*
  - **Balls (24 total):** Identical plastic practice golf balls (or ping-pong balls). Half are "fast" (weighted with 2 pennies taped inside), half "slow" (empty). Paint all balls white to hide weights. *Cost: $10 (balls) + $2 (pennies).*
  - **Curtain:** Opaque fabric (e.g., black tablecloth) with two armholes, hung from a tension rod over the tray. *Cost: $5.*
  - **Tally Board:** Clipboard with **8 slots** (cardboard strips). Each slot holds a 2"x2" tile (cardboard squares) with blank/1 side (mark with pen). *Cost: $3.*
  - **Erase Station:** Across the room, a hand-crank device made from a cardboard box, a stiff door hinge (as a lever), and rubber bands requiring 10 cranks to reset. Each crank cycle drops a bead (token) into a jar ("ash bin"). *Cost: $8 (hinge, beads, jar, rubber bands).*
  - **Trapdoor:** Cardboard flap (3"x3") taped to the partition bottom. Attach adjustable rubber bands (tested to let "fast" balls through 70% of the time when rolled firmly). *Cost: $2.*
  - **Archive Demon:** Adding machine paper roll, pens, archive box. *Cost: $5.*  
  - **Misc:** Stopwatch, rule cards, tokens. *Cost: $5.*

  **Why These Numbers?**  
  - **24 balls (12 fast/12 slow):** Enough to force erasure (with 8-slot memory) but manageable in 90 mins.  
  - **8 slots:** Forces erasure after 8 measurements (since sorting 12+ balls requires reuse).  
  - **10 cranks/erase:** High enough to feel "costly" but doable quickly. Represents abstract energy dissipation.  
  - **Trapdoor 70% accuracy:** Ensures it fails visibly (participants see errors), disproving passive solutions.

  ---

  ### **2. Roles & Rotation**  
  4 roles per round (rotate every 15 mins). Others observe; all participate over 6 rounds. **Rule Cards (abbreviated):**  
  - **Sorter A/B (2 people):** *"Work behind curtain. Test each ball by weighing it on the scale (fast=heavy). Move to LEFT if fast, RIGHT if slow. Record each test: flip a tally tile to '1' for fast, '0' for slow. If no slots free, erase one (at erase station) before recording."*  
  - **Auditor:** *"Watch sorters: No peeking! No talking! Only use tally board (no memorizing). Erase only at station (10 cranks). Reset if cheating."*  
  - **Ledger Keeper:** *"Count: 'Order' = (Fast in LEFT + Slow in RIGHT). 'Cost' = erases. Record traps/errors in trapdoor round."*  

  ---

  ### **3. Accounting**  
  **Core Idea:** "Order" = Reduction in possible arrangements (in bits).  
  - **Tiny Cases (taught via props):**  
    - **2 balls (1 fast/1 slow):**  
      - Start: 2 arrangements (Fast-Left/Slow-Right or vice versa).  
      - Sorted: 1 arrangement.  
      - Order = log₂(2/1) = **1 bit** (halved possibilities).  
    - **4 balls (2 fast/2 slow):**  
      - Start: 6 arrangements (e.g., FFSS, FSFS...).  
      - Sorted (FF in LEFT, SS in RIGHT): 1 arrangement.  
      - Order = log₂(6/1) ≈ **2.58 bits**.  
  - **Full Game (12 balls):**  
    - Start: Arrangements = 12! / (6!6!) = 924.  
    - Sorted: 1 arrangement.  
    - Order = log₂(924) ≈ **9.85 bits** (max achievable).  
  - **Partial Sorting Formula:**  
    - Let `F` = Fast balls in LEFT, `S` = Slow balls in RIGHT.  
    - Sorted Count = `C = F + S`.  
    - **Order (bits) = (C - 6) × (9.85 / 6)** ≈ `(C - 6) × 1.64`.  
      - *Why?* Max order (C=12) = 9.85 bits. Random (C=6) = 0 bits. Linear interpolation simplifies for non-experts.  
  - **Cost:** 1 erase = **1 token** (each token = effort for 10 cranks).  
  - **Net Profit = Order (bits) - Erases (tokens).**  
    - **Goal:** Show net ≤ 0 (cost ≥ order).  

  ---

  ### **4. Round Structure & Timeline**  
  **Total: 90 mins (setup/debrief included).**  
  - **0:00-0:10** - Setup (10 mins): Lay out materials, assign first roles.  
  - **0:10-0:20** - **Warm-up (open curtain):** Sort 4 balls unblinded. *Goal: Show ease without recording. Ledger: Order=~2.58 bits, Cost=0, Net=+2.58.*  
  - **0:20-0:35** - **Blind, No Notes:** Curtain closed. Sort 4 balls from memory. *Goal: Struggle! Ledger: Order<2.58, Cost=0. Net positive but low.*  
  - **0:35-0:50** - **Tally-Board Core:** Sort 12 balls with 8-slot tally. *Goal: Erases unavoidable. Ledger: Order~6-8 bits, Cost=6-10 erases, Net≤0.*  
  - **0:50-1:00** - **Trapdoor Round:** Use flap only (no tally). *Goal: Errors! Ledger: Order≈8.4 (70% of 12), Cost=0, Net=+8.4 but imperfect.*  
  - **1:00-1:10** - **Lazy Demon:** Coarse recording (e.g., "record every 3rd ball"). *Goal: Trade-off. Ledger: Low Order (4-5 bits), Low Cost (1-2 erases), Net≈-1 to -3.*  
  - **1:10-1:20** - **Archive Demon:** Unlimited paper tape (write "F"/"S"; no erasure). *Goal: Deferred cost. Ledger: Order~9.85 bits, Cost=0 during, but archive grows.*  
  - **1:20-1:30** - **Debrief (see section 5).**  
  - **Droppable Rounds:** Trapdoor or Lazy Demon if short on time.  

  ---

  ### **5. Debrief**  
  **Map Moments to Concepts:**  
  - **Measurement:** Weighing a ball (hidden property → data).  
  - **Recording:** Flipping a tally tile (physicalizes information).  
  - **Erasure:** Cranking to reset a tile (effort to clear memory).  
  - **Ash Tokens:** Dissipated energy (cranking = friction/heat).  
  - **Open-Curtain "Free":** No recording needed (but brain/muscles used energy—breakfast paid!).  
  - **Cheating Cost:** Memorizing = brain metabolism (paid by food, not magic).  
  - **Trapdoor Failure:** Passive devices leak errors (require calibration/energy).  
  - **Archive Loophole:** Cost deferred (erasing archive later); no *infinite* free lunch.  

  **Key Insight:** Erasure is where the bill comes due. Even if deferred (archive), clearing memory *later* costs energy. The ledger (order - cost) never profits.  

  ---

  ### **6. Handling Your Loophole (Archive Demon)**  
  **Activity Flow:**  
  - In archive round, participants write endlessly. Net profit seems positive (order high, cost=0).  
  - **Reveal:** Ask, *"What if you need to erase the archive to reuse tiles?"* Simulate erasing the paper pile:  
    - Each page erased costs 10 cranks. Total cost = 12 tokens (for 12 balls).  
    - Net = 9.85 (order) - 12 (deferred cost) ≈ **-2.15** (still a loss).  
  - **Discovery:** Participants see cost is unavoidable—just delayed. The "endless supply" shifts the burden to future erasure (or storing physical archives forever). Second law holds: **Net profit ≤0 at any finite time if archive exists.**  

  ---

  ### **7. Predictable Problems & Solutions**  
  - **Cheating:** Auditor resets balls if sorters peek/talk. *Prevention:* Rule card emphasis.  
  - **Trapdoor Stalls:** Set rubber band so fast balls pass 7/10 times. *Fix:* Facilitator tweaks tension.  
  - **Bottleneck at Erase Station:** Intentional—highlights cost. *Solution:* None; lean into the frustration.  
  - **"Rules Are Rigged":** Acknowledge openly: *"Real physics has rules too—this models them."*  
  - **"Why Cranks = Heat?":** *Debrief response:* "Cranking mimics real energy loss (e.g., heat from friction). It's a metaphor—but real erasure heats up devices."  
  - **Trapdoor Too Tight/Loose:** Pre-test with 10 balls; mark ideal rubber band length.  

  ---

  ### **8. What the Activity CANNOT Show (State Clearly)**  
  **State at Debrief:**  
  > *"This model simplifies reality. Remember:  
  > 1. **Real cost is kT ln 2:** The exact energy per bit depends on temperature (T). We used 10 cranks/bit as a metaphor.  
  > 2. **Information ≠ 'useful' knowledge:** Thermodynamics counts all bits—even useless ones.  
  > 3. **Second law is statistical:** With 10²³ particles, sorted states *can* randomly form (but are astronomically rare). We enforce order with an auditor; reality uses probability.  
  > 4. **Measurement *can* be free:** Landauer doesn't forbid reversible measurement (e.g., quantum). But erasure *must* cost.  
  > 5. **The crank is a metaphor:** It models dissipation, but real costs come from physical irreversibility (e.g., resistance, heat)."*  

  **Metaphor vs. Reality:**  
  - The erase station is **pedagogically useful** but not a direct analog. Real erasure dissipates ~10⁻²¹ J/bit (kT ln2)—too small to feel. The crank makes the cost tangible and countable.  

  ---

  ### **Summary**  
  This design meets your specs:  
  - **Apparatus:** Cheap, scalable, tactile.  
  - **Roles:** Collaborative, rotating, rule-based.  
  - **Accounting:** Bits from micro to macro, handles messy order.  
  - **Rounds:** Build concepts sequentially; archive/trapdoor loopholes tested.  
  - **Debrief:** Explicit concept mapping, including breakfast/metabolism.  
  - **Loophole:** Archive cost deferred but inevitable.  
  - **Limitations:** Transparently stated.  

  **Final Tip:** Pre-test mechanics (trapdoor friction, crank stiffness) and have spare balls/tiles. With this, your library group will viscerally confront Maxwell’s demon and Landauer’s principle.
