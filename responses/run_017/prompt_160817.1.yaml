  Hmm, they're attacking from two angles: first, that truth-value gaps don't necessarily track causal openness (making gaps pointless), and second, that gaps would undermine practical reasoning. Smart move starting with deliberation - that's the heart of why people care about this debate. 

  I need to stay sharp here. For the deterministic scenario: they're right that metaphysical gaps could exist even in a determined world, but that's why I need to emphasize that our view cares about causal openness, not just logical possibility. The key is distinguishing between the causal structure and the semantic apparatus. 

  For the practical reasoning objection: tricky! They're forcing me to explain why conditionals behave differently from future contingents. I'll need to lean hard on the distinction between determinate truth and determinable truth, and show how practical conditionals don't commit to future facts in the same way. 

  Ah, and they're saving the chronicler problem for later - good, that gives me time to prepare the supervaluationist response. But I should already be thinking about how to handle truth-value links across time... 

  Most importantly, they want me to reveal where the view is shakiest. Honestly? The biggest vulnerability is explaining how chroniclers can make true claims about the past when the future was unsettled. That truth-value link problem might be the Achilles' heel. I'll concede that if pressed hard enough. 

  For now though, focus on defending the two horns: emphasize that gaps track causal openness (not just any determinism), and show how practical conditionals work through determinable rather than determinate truth. Stay precise with the terminology - they'll pounce on any sloppiness.
answer: |-
  **(Adjusting my toga as I rise)** A fair challenge — but let’s sharpen the distinction. Your first horn conflates *causal* determination with *semantic* determination. Even if causal determinism holds (a premise I reject for open futures, but grant *arguendo*), **truth for future contingents requires actualization**. On our view, "There will be a sea battle tomorrow" is neither true nor false *now* because no *actual* sea battle yet exists to ground its truth. Causal necessity doesn’t actualize future events; it merely constrains possibilities. So yes, in a deterministic world, the gap *persists* — not because the future is causally open (it isn’t), but because **truth-makers for future-tensed propositions are ontologically deferred**. This doesn’t "vindicate" deliberation in that scenario, but it *does* preserve the semantic integrity of our theory: truth is grounded in what *is*, not what *must be*. The gap isn’t "idle" — it reflects a metaphysical constraint on truth.

  **Horn two strikes deeper, but mislocates the indeterminacy.** The admiral’s conditional, "If I sail at dawn, I take the strait," **is determinately true *if* it holds across all admissible futures** — i.e., if every causally open branch where he sails results in taking the strait. This is a *present* fact about the causal structure of possibilities. Crucially, **the conditional’s truth depends on current dispositions and laws, not future facts**. His inference runs:  
  1. *I want to win* (determinate present desire)  
  2. *If I sail, I win* (determinately true iff winning holds in *all* sailing-scenarios)  
  3. Therefore, *I will sail* (practical commitment, *not* a future-tense assertion).  

  The disjunction "battle or no battle" remains indeterminate because neither disjunct holds in *all* futures — but the *conditional* escapes indeterminacy by quantifying over futures. **Deliberation operates on modal terrain, not future truth-values.** You’d break reasoning only if conditionals required settled outcomes — but they don’t.

  *(Leans forward, stylus poised)* Your turn. I’ll hold the chronicler for later — but know that supervaluationist truth-value links will be my shield. Where does this riposte land?  

  ---
  **When pressed to concede:**  
  *(Rubbing temples, wearied but resolute)* Very well. If you demonstrated **irreducible backward causation** — say, conclusive proof that *present* truth-values of future contingents causally *constrain* earlier decisions — I’d abandon openness. That would collapse the distinction between truth-making and causal necessity. But barring that? The shakiest beam in our framework is **explaining why chroniclers can *now* assert "A battle occurred" with determinate truth, when yesterday’s future-tensed counterpart was indeterminate**. We appeal to "thin" past facts crystallizing truth-makers — but how exactly does *present* actuality retroactively ground *past* truth-aptitude? That’s where the gears grind. I’d stake less on that move. Now — shall we test it?
