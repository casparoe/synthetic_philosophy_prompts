answer: |-
  ### Disciplined Mapping of the LHC Decision  
  **Agent Identification**:  
  - **Agent**: CERN (an international organization) and its member-state funders (sovereign governments).  
  - **Contestation**: Agency is fragmented. CERN’s scientific mission drove the decision, but democratic states funded/approved it, while the risk (if any) was global. Benefits (scientific knowledge) accrued primarily to physicists; catastrophic risk (if realized) would burden all life. This misalignment challenges who "counts" as the expected-value maximizer.  

  **Option Set and Fanatic’s Ranking**:  
  1. **Not run** (cost: sunk investment; benefit: avoid catastrophe risk).  
  2. **Ramp up** (e.g., start at 3.5 TeV, learn, then go to 6.5 TeV).  
  3. **Run at design energy immediately**.  
  4. **Defer pending further review**.  
  - **Fanatic’s Rule**: Reject any option with nonzero catastrophe probability *unless* benefits are infinite (which they aren’t). Expected cost = *p* × *V*, where *V* is the disvalue of extinction. If *V* is treated as infinite (or merely astronomical), any *p* > 0 implies expected cost dominates all finite benefits.  
  - **Flip Probability**: At infinitesimal *p* (e.g., 10⁻¹⁰⁰), if *V* is large enough (e.g., total future human potential), expected cost still outweighs finite benefits. The ranking flips only if *p* = 0 *or* benefits are infinite.  

  **Where Expected-Value (EV) Captures/Omits**:  
  - **Captures**: The focus on extreme stakes (extinction), the role of low-probability risks, and the institutional effort to bound *p* to near-zero.  
  - **Omits**:  
    - The political process (reviews as legitimacy-seeking, not just probability-assessment).  
    - Non-commensurable values (knowledge vs. survival treated as comparable).  
    - Dynamic learning (ramping as sequential choice, not one-off EV maximization).  

  ---

  ### Four Problems Pressed on Fanaticism  
  **1. Status of the Probability Bound**  
  The cosmic-ray argument is *observational-selection evidence*: It shows Earth has survived analogous events, but only because observers exist *conditional on survival*. This does not equate to a frequency-based *p* = 0. For EV maximization:  
  - A selection-derived bound justifies *p* ≈ 0 only if no survivorship bias applies (e.g., if cosmic-ray collisions *must* leave observable evidence of near-misses).  
  - **Verdict**: If *p* is not *structurally* zero (e.g., if new physics could make Earth uniquely vulnerable), the bound is inadequate for fanaticism. The safety case then rests on *theoretical* arguments (e.g., Hawking radiation), not empirical frequency.  

  **2. Learning by Doing**  
  Ramping appears irrational for a fanatic: Even at low energy, if *p* > 0, expected cost is unbounded. Yet ramping was implemented.  
  - **Resolution**: CERN treated low-energy risk as *p* = 0 based on cosmic-ray analogs (e.g., collisions at 3.5 TeV occur naturally). Higher energies were deferred until safety was reconfirmed.  
  - **Reductio?** Only if *p* > 0 is conceded at low energy. If not, ramping is fanatically permissible. But if *any* uncertainty exists, fanaticism forbids even probing steps. **This is a reductio**: It renders empirical learning impossible for catastrophic risks.  

  **3. Burden and Structural Zeros**  
  - **Strategy**: Turn *p* > 0 into *p* = 0 via theoretical grounding (e.g., "cosmic rays prove safety").  
  - **Feasibility**:  
    - *Parameter uncertainty* (e.g., black hole decay rate): Often resolvable (as here).  
    - *Model uncertainty* (e.g., "unknown physics"): Harder to nullify. If the model is contested, fanaticism forbids action.  
  - **Case Position**: CERN relied on theoretical consensus to assert *p* = 0. Where model uncertainty persists (e.g., novel quantum gravity effects), fanaticism demands inaction—a paralyzing standard.  

  **4. Imposition**  
  Fanaticism ignores consent and benefit-risk asymmetry: Scientists gain prestige/knowledge; all humans bear extinction risk.  
  - **Supplement?** A "legitimacy condition" (e.g., only democratically endorsed risks) is incoherent within fanaticism. EV maximization is agent-neutral; adding consent makes it a hybrid theory.  
  - **Verdict**: Imposition is fatal to pure fanaticism. The theory cannot distinguish between self-risk and non-consensual risk, revealing it as *silent* on core practical dilemmas.  

  ---

  ### Verdict on the Theory  
  **Reading 3 Prevails**: The case **never tests fanaticism** because CERN and reviewers argued *p* = 0. The fanatical term (*p* × *V*) was nullified ex ante, so EV calculations were irrelevant.  

  - **What Would Test Fanaticism?** A scenario with persistent, unquantifiable *p* > 0 (e.g., "unknown physics" risks at 10 TeV) where benefits are finite. Example: Launching a particle accelerator despite unresolved theoretical disagreement about catastrophe.  
  - **Better Explanatory Model**: **Precautionary reasoning** fits best:  
    - CERN delayed operations until multiple reviews confirmed safety.  
    - It explains why *qualitative* risk elimination (via theory/observation) preceded action, not EV balancing.  
    - Captures the political need for legitimacy (via independent reviews).  
  - **Contrast with Fanaticism**: Precaution seeks to *eliminate* risk; fanaticism demands *infinite* justification for any risk. The LHC used precaution to avoid fanaticism’s demands.  

  ---

  ### Explicit Limits of Analysis  
  1. **Stakes Assumption**: Treated loss of future human value as finite (though large). If future value is *infinite*, fanaticism forbids any *p* > 0—making the LHC decision indefensible unless *p* = 0 is certain.  
  2. **Epistemic Benefits**: Treated as commensurable with prudential goods (e.g., knowledge given weight in EV). If epistemic gains are lexically inferior to survival, fanaticism collapses into survival-at-all-costs.  
  3. **Fact Dependencies**:  
     - Cosmic-ray argument as presented (survivorship not challenged).  
     - CERN’s *p* = 0 claim accepted at face value.  
     - No persistent model uncertainty after 2008 review.  
  4. **Gaps**:  
     - How "structural zero" is defined (model-dependent).  
     - Whether democracies can "consent" for future people.  
     - Why *p* = 0 was convincing (beyond scope).  

  **Conclusion**: The LHC case avoids fanaticism by collapsing *p* to zero, but exposes its impracticality: It demands certainty where none exists, paralyzes exploration, and ignores moral asymmetries. Precautionary structural reasoning better explains actual practice.  

  ---  
  This account hews to your constraints: no literature survey, focused on case-work, gaps marked where theory is silent. For your paper, stress how institutional processes (reviews, ramping) *defused* fanaticism by converting ethical dilemmas into technical ones—a move fanaticism cannot accommodate.
