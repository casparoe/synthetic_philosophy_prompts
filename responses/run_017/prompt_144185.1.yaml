  - At 35:01: those who are doing the B task (2 minutes) do it until 37:01.

  - Then we have from 37:01 to 75:00 for debrief? That's 37:01 to 75:00 is 38 minutes, which is too much. We need to end at 75, so 75-37=38 minutes for debrief? But we started at 0, so 37 minutes in, we have 38 minutes left? That's fine, but we can shorten the filler.

  Alternatively, we can make the aversive round shorter.

  Revised aversive timeline:

  - 20:01-25:01: Phase 1 (5 minutes)
  - 25:01-26:01: Precommitment cost task (1 minute)
  - 26:01-30:01: Filler (4 minutes)
  - 30:01-31:01: Task A for those who are doing it (1 minute)
  - 31:01-35:01: Filler (4 minutes)
  - 35:01-37:01: Task B (2 minutes)
  - 37:01-75:00: Debrief (37 minutes)

  But 37 minutes for debrief is long, but we can use it.

  Now, to prevent spoilers for the second group: the activity relies on the students not knowing the setup in advance. Since the two groups share a group chat, we must ensure the first group doesn't spoil.

  How: 
  - Ask the first group not to discuss the activity until after the second group has done it, because it's part of an experiment and we need unbiased results. Offer an incentive: if they comply, everyone gets an extra chocolate at the end.
  - Also, during the activity, don't reveal the overall purpose until the debrief.

  Now, what will go wrong:

  1. Students treating it as a puzzle to beat: Some might realize that the rational choice is to precommit to the later option if they think they will be tempted. We want that! It's part of the lesson. But if they announce it, ask them to keep it to themselves until the debrief.

  2. Re negotiation at choice time: A student might say, "I precommitted to Y, but can I change my mind and take X now?" The facilitator must say: "No, you chose to precommit, so you are locked in." Similarly for the aversive task.

  3. Precommit and then resent it: In the aversive task, if they precommitted to A and then at T1+10 they see others not doing anything (if they chose B), they might feel regret. That's a teachable moment.

  4. In the chocolate round, if they precommitted to Y, they have to wait and see others eating chocolate at the break. They might regret not precommitting to X or not precommitting at all.

  5. Some might not take the activity seriously and choose randomly. We can only hope the small stakes make it real.

  6. In the aversive task, some might choose to do the task now to get it over with, and then at the choice time they might see that they could have delayed and then not want to do it. But they have to if they chose B.

  Debrief:

  We want to map to theory and leave the question open.

  Debrief structure:

  1. Start with the chocolate round: ask who precommitted and to what? Who didn't? What did they predict? Then, for those who didn't precommit, what did they choose at the break? Then, ask if anyone changed their mind from what they predicted? (Some will have chosen X at the break even though they predicted they would choose Y.)

  2. Similarly for the aversive round.

  3. Highlight the flips: for example, at T0, many might have predicted they would choose Y (2 later) but at the break they chose X (1 now). Or in the aversive task, they predicted they would choose A (do the task now) but at the choice time they chose B (delay).

  4. Ask: Why did you change your mind? Was it because the 'now' became available?

  5. Discuss precommitment: who paid the cost to precommit? Did it work? How did it feel to be precommitted when the moment came?

  6. Map to concepts:
     - Time-inconsistency: when your preferences change as the options get closer.
     - Hyperbolic discounting: valuing the present more highly.
     - Weakness of will: acting against your own best judgment.

  7. Leave open: Was it irrational to choose the smaller-sooner reward? Or was it that at that moment, you genuinely preferred it? What about for the aversive task: was it irrational to delay the task, knowing it would be harder later? Or was it that the present aversion was too strong?

  8. Finally, the difference between willpower (gritting your teeth and choosing the later option) and precommitment (removing the choice).

  Materials:

  - Index cards (enough for both rounds, two per student per round? or one per round)
  - Chocolates
  - Paragraphs for the aversive task (short and long versions) and for the filler activities.
  - Timer

  Facilitator script:

  - Introduction: "Today we're going to do an activity about decision-making. There are no right or wrong answers; we're interested in how you actually choose. Please take it seriously because your choices will have small real consequences."

  - For each round, explain the rules clearly.

  - During the activity, do not explain the purpose. If asked, say: "We'll discuss at the end."

  - During the choice moments, be neutral and just implement the rules.

  - In the aversive task, the boring task should be the same for everyone and genuinely boring (e.g., copying a text that is dry).

  This design meets most of the requirements. The only thing it doesn't fully stage is the ambiguity of rationality, but that will come out in the debrief.

  Let's write the full activity.
answer: |-
  ### **Activity Design: "The Flip of Now"**  
  This activity creates a live experience of time-inconsistency using both rewarding (chocolates) and aversive (boring task) scenarios. Students confront their own shifts in preference as options move closer to "now," explore precommitment, and debate rationality—without relying on slides or hypotheticals. The 75-minute session is structured to maximize engagement, with real stakes (chocolates/participation points and a timed task) and delays experienced in the room.  

  **Core Mechanics:**  
  - **Two rounds** (rewarding and aversive) with identical choice pairs at different time points.  
  - **Second-order layer:** Students predict their future choices and can precommit by sacrificing part of their payoff.  
  - **Real stakes:** Small chocolates (round 1) and a mildly unpleasant task (round 2) ensure choices aren’t hypothetical.  
  - **Debrief** focuses on mapping experiences to theory (time-inconsistency, precommitment, weakness of will) while leaving key questions open.  

  **Materials Needed:**  
  - **Chocolates:** 50+ small, identical chocolates (e.g., Hershey’s Kisses).  
  - **Participation points:** Tracked via a whiteboard (e.g., "Group Points: 0"). Points are exchanged for chocolates at the end (1 point = 1 chocolate).  
  - **Aversive task materials:** Printed paragraphs of dense, boring text (e.g., an insurance policy excerpt) — 16 copies of a *short* version (2 minutes to copy by hand) and 16 copies of a *long* version (4 minutes).  
  - **Index cards:** 3 per student (for predictions/precommitments).  
  - **Timer/stopwatch** (for delays and tasks).  
  - **Whiteboard** to track points and choices.  
  - **Projector** (optional) to display instructions/timer.  

  **Setup:**  
  - Arrange chairs in a circle to encourage interaction.  
  - Place chocolates, task sheets, and index cards on a central table.  

  ---

  ### **Timeline (75 Minutes Total)**  
  **0–5 min: Introduction**  
  - **Facilitator (you) says:**  
    > "Today, we’re exploring how we make decisions over time. You’ll face choices with real, small consequences—chocolates you can eat later and a task you’ll actually do. There are no right or wrong answers. We’re here to observe what happens. I’ll explain each round as we go."  
  - **Do NOT say:** "This is about weakness of will," or mention time-inconsistency/discounting. Stay neutral.  
  - **Write on the whiteboard:** "Group Points: 0" (participation points for debrief).  

  **5–25 min: Round 1 – Rewarding Scenario (Chocolates)**  
  *Goal: Experience time-inconsistency with a positive reward. Students see that "now" flips preferences.*  
  - **Phase 1 (T0 – 5–15 min):**  
    - **Explain:**  
      > "In 5 minutes, we’ll pause for a break. At that break, you’ll choose between:  
      > **Option X:** Get 1 chocolate AT the break (you can eat it then).  
      > **Option Y:** Get 2 chocolates 5 minutes AFTER the break (at 25 min).  
      > You’ll eat any chocolates immediately when you get them.  
      > But first, two decisions:  
      > 1. **Predict:** If you don’t lock in your choice now, what will you choose at the break? (X or Y)  
      > 2. **Precommit (optional):** Lock in X or Y now by giving up 0.5 chocolates. If you precommit, you get your chosen option automatically at the break—no choice then. Giving up 0.5 chocolates means you lose half your payoff (e.g., precommitting to X gives 0.5 chocolates at the break; precommitting to Y gives 1.5 at 25 min)."  
    - **Hand out index cards.** Students write:  
      - Name.  
      - [ ] Precommit to X (lose 0.5), [ ] Precommit to Y (lose 0.5), [ ] Do NOT precommit.  
      - If NOT precommitting: "I predict I’ll choose [X] or [Y] at the break."  
    - Collect cards immediately.  

  - **Delay (15–20 min):**  
    - **Filler activity (keeps students occupied):**  
      > "While I tally, read this short paragraph about [neutral topic, e.g., coral reefs] and write one interesting fact on the back of a new index card."  
    - *Purpose:* Creates a real 5-minute gap where "now" approaches.  

  - **Phase 2 (T0+5 / "Break" – 20–25 min):**  
    - **Implement choices:**  
      - **Precommitted students:** Get their reduced payoff immediately (e.g., precommitted to X gets 0.5 chocolates now; precommitted to Y gets nothing now but 1.5 later).  
      - **Non-precommitted students:** Choose live:  
        > "Option X: Take 1 chocolate now. Option Y: Get 2 chocolates in 5 minutes. Write X or Y on a new card."  
      - Collect cards and distribute chocolates for X-choosers.  
    - **At 25 min:** Distribute delayed chocolates to Y-choosers (including precommitters).  

  **25–50 min: Round 2 – Aversive Scenario (Boring Task)**  
  *Goal: Mirror procrastination. Students see time-inconsistency with a negative task and test precommitment’s cost.*  
  - **Phase 1 (T1 – 25–35 min):**  
    - **Explain:**  
      > "In 5 minutes, we’ll pause again. At that pause, you’ll choose between:  
      > **Option A:** Do a SHORT boring task (2 minutes) NOW at the pause.  
      > **Option B:** Do a LONG boring task (4 minutes) 5 minutes AFTER the pause (at 45 min).  
      > The task: Copy a text by hand.  
      > First, two decisions:  
      > 1. **Predict:** If you don’t lock in your choice, what will you choose at the pause? (A or B)  
      > 2. **Precommit (optional):** Lock in A or B now by doing 1 minute of the task IMMEDIATELY. If you precommit, you skip the future choice and do your task at the scheduled time."  
    - **Hand out index cards.** Students write:  
      - Name.  
      - [ ] Precommit to A (do 1 min now), [ ] Precommit to B (do 1 min now), [ ] Do NOT precommit.  
      - If NOT precommitting: "I predict I’ll choose [A] or [B] at the pause."  
    - Collect cards.  
    - **Precommitment cost:** Precommitters do 1 minute of the short task NOW (35–36 min). Others wait.  

  - **Delay (36–40 min):**  
    - **Filler activity:**  
      > "Discuss with a partner: What’s one thing you’ve procrastinated on this week?" (Keeps focus on lived experience).  

  - **Phase 2 (T1+5 / "Pause" – 40–45 min):**  
    - **Implement choices:**  
      - **Precommitted students:** Do their task at the scheduled time (A-choosers do short task now; B-choosers do nothing now but long task later).  
      - **Non-precommitted students:** Choose live:  
        > "Option A: Do the 2-min task NOW. Option B: Do the 4-min task in 5 minutes."  
      - A-choosers (including precommitters) do the task immediately (40–42 min).  
    - **At 45 min:** B-choosers (including precommitters) do the 4-min task (45–49 min).  

  **50–75 min: Debrief**  
  *Goal: Link experiences to theory without resolving the "weakness of will" debate.*  
  - **Step 1: Recall choices (50–55 min)**  
    - Display anonymous stats from rounds (e.g., "Round 1: 10 predicted Y, but 7 chose X at the break"). Ask:  
      > "Who was surprised by their own choices? Who flipped from what they predicted?"  
    - **Map to theory:**  
      > "This is time-inconsistency: Identical options (1 vs. 2 chocolates, short vs. long task) got opposite choices based on distance to 'now.'"  

  - **Step 2: Explore precommitment (55–65 min)**  
    - Ask precommitters:  
      > "How did it feel to give up chocolate/time to lock in your choice? Did it 'work'?"  
    - Ask non-precommitters:  
      > "At the choice moment, did you wish you’d precommitted? Why?"  
    - **Map to theory:**  
      > "Precommitment rearranges choices to avoid temptation. But is it a lack of willpower—or a smart hack?"  

  - **Step 3: Debate rationality (65–75 min)**  
    - Pose:  
      > "When you chose the smaller-sooner reward or delayed the task, were you being irrational? Or did your preferences legitimately change?"  
    - Highlight contradictions:  
      - "In Round 1, some said, 'I’d never choose X!' but did. In Round 2, some delayed even knowing the task doubled."  
      - "Is the 'tempted self' irrational? Or is the 'patient self' overly rigid?"  
    - **End with open question:**  
      > "So—was that weakness of will? I won’t answer. Your job is to argue this in your essays next week."  
    - Award participation points (1 per student) for engagement. Exchange for chocolates.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Students treat it as a puzzle to "beat":**  
     - *E.g., Precommitting to Y/B "to win," or gaming predictions.*  
     - **Solution:** In intros, emphasize: "This isn’t a test—we’re studying real behavior." If they announce strategies, say: "Interesting! Let’s see what happens." Debrief their outcome (e.g., "Did precommitting feel like cheating or wisdom?").  

  2. **Renegotiation at choice points:**  
     - *E.g., "I precommitted to Y, but can I take X now?" or "This task is unfair!"*  
     - **Solution:** Hold boundaries: "You chose to precommit—that’s binding." Stay neutral: "The rules are fixed, but we can discuss why this feels frustrating later."  

  3. **Resentment after precommitment:**  
     - *E.g., Precommitters regret sacrificing chocolate/time when others "get away" with not precommitting.*  
     - **Solution:** In debrief, ask: "Did precommitment protect you—or feel like a trap?" Contrast with non-precommitters who regretted inaction.  

  4. **Some dismiss stakes as trivial:**  
     - *E.g., "Chocolates don’t matter—I’d never do this in real life."*  
     - **Solution:** Use aversive task to trigger real discomfort (boredom is relatable). In debrief, ask: "How did this compare to procrastinating on homework?"  

  5. **Sharp students spoil the twist:**  
     - *E.g., "This is about hyperbolic discounting!"*  
     - **Solution:** Acknowledge without confirming: "Some of you may have seen similar ideas. Let’s see if this matches your expectations." Use their insight in debrief ("You predicted the flip—did it still feel surprising?").  

  **What the Activity Can’t Stage (Requires Verbal Explanation):**  
  - **The "why" of time-inconsistency:** The activity shows students *that* their preferences flip, but not *why* (e.g., hyperbolic discounting vs. visceral drives). Save this for post-activity discussion.  
  - **External factors:** Real-life procrastination involves complex triggers (e.g., anxiety). Acknowledge this in debrief: "In life, there’s more at play—this is a simplified lab scenario."  

  ---

  ### **Preventing Spoilers Between Groups**  
  - **Before Session 1:**  
    > "This activity works best if experienced fresh. If you’re in the first group, avoid discussing it until after the second group finishes today. As a thank-you, everyone gets +1 bonus chocolate at the end if both groups stay unspoiled."  
  - **After Session 1:** Collect all materials and reset the room. Remind students: "Group 2 hasn’t done this yet—please keep the experience intact for them."  
  - **If spoilers happen:** Lean into it: "Some of you may have heard about this. Did knowing change your choices? Let’s compare groups in debrief!"  

  **Why This Works:**  
  - **"Now" feels special:** Identical options (1 vs. 2 chocolates, short vs. long task) yield opposite choices as "now" arrives, making the flip visceral.  
  - **Precommitment vs. willpower:** Students experience both (sacrificing payoff to restrict choice vs. "gritting through" the moment).  
  - **Ambiguity preserved:** No resolution on weakness of will—students leave arguing whether the "patient" or "tempted" self is rational.  
  - **Aversive round resonates:** Procrastination is relatable; the task’s boredom ensures stakes feel real.  

  **Final Tip:** Stay flexible. If rounds run long, shorten fillers; if students rush, lean into their energy. The goal is self-discovery—not perfection.
