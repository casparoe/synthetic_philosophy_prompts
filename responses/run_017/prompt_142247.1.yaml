prompt: |-
  I'm one of three people on the programme committee of a small, newly endowed institute — five years of core funding, about eight resident fellows a year, mostly philosophers and theoretically inclined cognitive scientists, and effectively no compute budget — whose founding charter takes as its organising idea a proposal of Turing's: instead of trying to write a programme that simulates the adult mind, build something with the organisation of a child's mind, which he compares to a notebook bought from a stationer's, with very little mechanism and a great many blank pages, and then subject it to an appropriate course of education. My two colleagues read that charter very differently. One says the proposal has been vindicated by history, since we now build systems by training rather than by hand-coding, so what remains is engineering and a conceptual institute would be a museum. The other says the vindication is only apparent and that the whole interesting content of the charter sits in a single question: what, precisely, is the difference between teaching a system and building one. I trust neither summary, and the three of us have to hand in an agenda by the end of term.

  So what I want is a defended five-year research agenda, not a survey: three or four questions the institute should make its own, in priority order, together with the reasoning that fixes the order. Please don't give me a bibliography or a reading list — I want the dependency structure. Which questions are upstream of which; which are genuinely tractable with conceptual tools and no compute; which are neglected in the sense that almost nobody with our toolkit is working on them; and which should be dropped because they are empirical problems in philosophical costume, or because their answer wouldn't change anything downstream. I also want to know what would move a question up or down the list: which result, argument, or technical development over the next five years would change the ranking, and which questions are stable under any evidence we can realistically expect.

  Here are the candidates as the committee has been stating them, so that you can also tell me which of them we have misdescribed. (i) The syllabus objection: education may merely relocate the specification burden, so that the target that would have been written into a programme reappears in the curriculum, the sequence of tasks, the feedback regime and the schedule of rewards and punishments — in which case the child-machine proposal inherits the problem it was supposed to dissolve, only less transparently, and might even leave us worse off. (ii) Teaching versus rewiring: both are interventions that alter a system's dispositions; if the distinction is one of degree, or of which interface we happen to intervene through, does anything philosophically interesting turn on it? (iii) Reason-responsiveness: whether a system's updates track the content of a correction as a reason, rather than merely registering reinforcement, and whether that could be probed from the outside at all. (iv) The examination reading of the imitation game: if the test is closer to a school examination than to a behavioural criterion, then rote learning, training to the test, and vast stored tables of replies become the crux rather than a side worry, and questions about what understanding adds to success become prior to questions about how to produce success. (v) Scaffold-dependence: whether the capacities of an educated system are partly constituted by its school — the teachers, the feedback protocol, the artefacts on the desk — so that the real unit of assessment is machine plus institution, and what it would even mean to examine the machine with the scaffolding removed. Which of these are load-bearing, which are pseudo-problems or already settled in substance, and what have the three of us left out?
reasoning: |-
  Okay, the user is part of a three-person committee at a newly endowed institute focused on Turing's idea of building a child-like mind to educate rather than simulating an adult mind. They need to set a five-year research agenda with prioritized questions. Their colleagues have conflicting views: one thinks the problem is solved by modern ML, the other focuses on the teaching vs. building distinction. The user distrusts both and wants a defended agenda without bibliographies, focusing on dependencies, tractability with conceptual tools, neglected areas, and what to drop.

  First, I need to unpack the core issue. The institute's charter is based on Turing's notebook analogy—starting with minimal mechanism and educating it. But modern ML, while using training data, still involves heavy engineering in architecture, loss functions, etc. So the philosophical questions about what constitutes genuine education vs. just building remain.

  Looking at their candidate questions: 

  (i) Syllabus Objection: Does specifying the curriculum just shift the problem?  
  (ii) Teaching vs Rewiring: Is there a meaningful distinction?  
  (iii) Reason-Responsiveness: Can systems update based on reasons, not just rewards?  
  (iv) Examination Reading of Imitation Game: Is the Turing Test more about rote learning?  
  (v) Scaffold-Dependence: Are capabilities tied to external supports?

  The key is to prioritize questions that are foundational and tractable with conceptual tools. The user mentioned no compute budget, so empirical ML work is out. They need problems where philosophical analysis can make progress.

  Starting with Scaffold-Dependence (v). This seems fundamental because if a system's abilities depend on external structures, then assessing the "child-machine" alone is misleading. This question challenges the individualism common in AI. Plus, it's tractable through conceptual analysis of cognitive artifacts and distributed cognition theories. A result showing how scaffolding constitutes cognition would elevate this.

  Next, Syllabus Objection (i). If the curriculum encodes the target, then "education" is just indirect programming. This needs addressing early because it threatens the charter's premise. Conceptual tools can dissect what makes education different from mere data ingestion. If scalable oversight techniques emerge, this could become more relevant.

  Reason-Responsiveness (iii) comes third. Probing whether systems track reasons involves philosophy of mind and epistemology. While harder without compute, thought experiments on agency and normativity are possible. If interpretability tools advance, this could move up.

  Teaching vs Rewiring (ii) might be a pseudo-problem. If teaching is just a type of rewiring, the distinction collapses. But if scaffold-dependence is real, then teaching involves external structures. So this depends on (v)'s outcome. Probably drop or deprioritize.

  Examination Reading (iv) is context-specific to the Turing Test. Since the charter is broader, this is less critical. Plus, modern LLMs already show rote learning issues, so it's somewhat settled. Low priority unless new evidence reopens it.

  Missing questions? The user might need to consider how minimal the initial mechanism should be—Turing's "notebook" versus today's complex neural nets. Also, what constitutes "appropriate education" beyond data exposure. But these might be covered under syllabus and scaffold-dependence.

  Prioritization order: (v), (i), (iii) with (ii) and (iv) lower. Dependency: Scaffold-dependence informs whether syllabus design is just programming. Reason-responsiveness depends on both. Teaching vs rewiring might dissolve if scaffold-dependence holds.

  Neglected areas: Scaffold-dependence is under-explored in philosophy of AI. Tractability: All top three can use conceptual tools. Movers: Empirical results in human-AI interaction for (v), breakthroughs in curriculum learning for (i), interpretability tools for (iii).

  So the agenda should start with rethinking the unit of analysis via scaffold-dependence, then tackle syllabus concerns, then reason-responsiveness. This order builds from foundational metaphysics to educational practice to cognitive capabilities.
answer: |-
  Here is a defended five-year research agenda prioritizing conceptual foundations over engineering, structured by dependency, tractability, and neglect. The ordering is based on what *must* be resolved first to make progress on Turing’s core idea, using purely conceptual tools.

  ---

  ### **Priority 1: Scaffold-Dependence (Question v)**  
  *"Are educated capacities constituted by the scaffolding?"*  

  **Why first?**  
  - **Upstream of everything:** If cognitive capacities are inherently scaffold-dependent, the institute’s entire mission (studying the "child-machine" in isolation) collapses. You cannot address syllabus design (i), teaching vs. building (ii), or reason-responsiveness (iii) until you know whether the "machine" is the right unit of analysis.  
  - **Tractability:** Purely conceptual. Draws from philosophy of extended cognition (Clark & Chalmers), anthropology (Hutchins), and education theory (Vygotsky). No compute needed.  
  - **Neglected:** While "embodied cognition" is studied, the *constitutive dependence* of AI systems on external scaffolds (feedback protocols, institutional structures) is rarely analyzed philosophically.  
  - **Downstream impact:** A "yes" forces the institute to redefine its object of study (e.g., "machine-institution symbiosis"). A "no" preserves Turing’s individualist framing.  
  - **What would move it:** Empirical evidence of *irreducible* scaffold dependence in humans (e.g., studies showing cognition degrades without cultural artifacts) or AI (e.g., models failing catastrophically when removed from training loops).  

  ---

  ### **Priority 2: Syllabus Objection (Question i)**  
  *"Does education just relocate the specification burden?"*  

  **Why second?**  
  - **Depends on Priority 1:** If capacities are scaffold-dependent (v), then the syllabus is *part of the constitutive scaffold*. If not, the syllabus may be a covert programming language.  
  - **Tractability:** Conceptual analysis of "curriculum as tacit programming." Requires dissecting how training data/feedback encode goals vs. enabling open-ended learning.  
  - **Neglected:** ML focuses on *efficiency* of training, not whether curricula *presuppose* the intelligence they claim to cultivate.  
  - **Downstream impact:** If the objection holds, the institute shifts focus to "curriculum minimalism" (what syllabus avoids presupposing the outcome?). If not, engineering dominates.  
  - **What would move it:** A formal proof that certain learning targets *require* curricula with equivalent complexity to hand-coded solutions.  

  ---

  ### **Priority 3: Reason-Responsiveness (Question iii)**  
  *"Can updates track reasons, not just reinforcement?"*  

  **Why third?**  
  - **Depends on Priorities 1–2:** Only meaningful if scaffolds are non-constitutive (v) *and* education isn’t covert programming (i). Otherwise, "reasons" are illusory.  
  - **Tractability:** Conceptual tools suffice (philosophy of normativity, agency). Probe via thought experiments on "correction absorption" (e.g., does a system generalize *principled* corrections?).  
  - **Neglected:** ML alignment focuses on *goal* fidelity, not *reason* sensitivity. Philosophy of mind debates (Brandom, McDowell) rarely engage with AI.  
  - **Downstream impact:** If reason-responsiveness is impossible for machines, education reduces to operant conditioning—undermining Turing’s "notebook" analogy.  
  - **What would move it:** A no-compute formal argument that reason-tracking requires properties incompatible with gradient-based optimization.  

  ---

  ### **Dropped/Lower-Priority Questions**  
  - **Teaching vs. Rewiring (ii):** **Drop.** If scaffold-dependence (v) holds, this is a false dichotomy (teaching *is* rewiring via external tools). If not, it reduces to empirical interface design. No conceptual depth.  
  - **Examination Reading (iv):** **Deprioritize.** Overly specific to Turing’s test. Modern LLMs have shown rote memorization *can* mimic understanding, making this less urgent. A special case of (i) and (iii).  

  ---

  ### **What’s Missing?**  
  1. **The Blank-Slate Fallacy:** Turing’s "minimal mechanism" is underspecified. What *minimal initial structure* permits open-ended educability? (Links to scaffold-dependence and syllabus).  
  2. **Developmental Stages:** Unlike children, AI lacks constrained learning phases (e.g., sensorimotor before abstract). Is phased scaffolding necessary? (Dependent on v and i).  

  ---

  ### **Agenda Summary & Dependencies**  
  ```mermaid
  graph LR
      A[1. Scaffold-Dependence (v)] --> B[2. Syllabus Objection (i)]
      A --> C[3. Reason-Responsiveness (iii)]
      B --> C
      D[Dropped: Teaching vs. Rewiring (ii)] -.-> A
      E[Deprioritized: Exam Reading (iv)] -.-> B
  ```

  **Stability:**  
  - Scaffold-dependence (v) is stable—evidence will likely be gradual (e.g., ethnographies of AI-human systems).  
  - Syllabus (i) and reason-responsiveness (iii) are volatile: breakthroughs in curriculum-free learning (e.g., AI generating its own goals) could obsolete (i); interpretability tools might resolve (iii) empirically.  

  **Why this order?** Until you know *what is being educated* (v) and *whether education is possible without cheating* (i), asking *how* it learns (iii) is premature. This agenda forces clarity on Turing’s deepest premise: that "education" is distinct from both programming and conditioning.
