  ### Indirect Normativity: Decision Tree for Diagnostic Positioning  
  **Starting Commitment**: An act's deontic status is settled by what an *idealised version* of the agent's deliberation would deliver, not their actual deliberation.  

  **Instructions for Use**:  
  Work through the tree by answering each question for the concrete case provided. Record your path (e.g., A → B → C). Do not skip ahead—each branch depends on prior answers. The leaf you land on names a position (or "unnamed") and highlights its most awkward commitment. Combinations with no leaf are marked as incoherent, unattractive, or unexplored.  

  ---

  #### Branch Nodes  
  **Case 1: Agent’s desires deformed by oppressive upbringing** (e.g., internalised subservience).  
  **N1: Anchoring**: Does the idealised deliberation inherit the agent’s actual desires?  
  - **A**: Yes—it starts from the agent’s current aims, even if deformed.  
  - **B**: No—it replaces them with a general standpoint (e.g., "what anyone would desire").  

  **Case 2: Physician choosing between Drug A (well-studied, moderate efficacy) and Drug B (promising but risky, with asymmetric evidence)**.  
  **N2: Information**: What information does the idealised deliberation use?  
  - **A**: Full information (e.g., long-term outcomes of both drugs).  
  - **B**: The physician’s actual evidence (e.g., only published studies).  
  - **C**: Evidence the physician could gather within 24 hours (e.g., consulting one expert).  

  **Case 3: Deliberating about whether to trust a friend risks destroying the trust through over-analysis**.  
  **N3: Powers**: How is the idealised agent’s cognition enhanced?  
  - **A**: Costless, unbounded computation (e.g., unlimited time to analyse trustworthiness).  
  - **B**: Bounded but cleansed of bias/distraction (e.g., no anxiety, but realistic time limits).  

  **Case 4: Idealised advisor knows the agent will only partially comply** (e.g., quitting smoking gradually, not cold turkey).  
  **N4: Target**: What does the idealised deliberation output?  
  - **A**: What the idealised agent *would choose* if they were in the situation.  
  - **B**: What they *would advise* the actual agent to do.  
  - **C**: What they *would want* the actual agent to do.  
  - **D**: What they *would rank first* for the agent.  

  **If B, C, or D at N4 → N5: Uptake-sensitivity**: Does the output adjust for expected partial compliance?  
  - **A**: Yes—it accounts for the agent’s likely actions.  
  - **B**: No—it ignores compliance likelihood.  

  **Case 5: Agent lacks concepts to grasp decisive information** (e.g., cannot understand statistical risks).  
  **N6: Modality**: What guides the idealised output?  
  - **A**: What the idealised agent *would do* (given the agent’s capacities).  
  - **B**: What they *could do* (if given ideal capacities, e.g., mastering the concept).  

  **Case 3 (revisited): Trust deliberation that might destroy trust**.  
  **N7: Indirectness**: Should the agent use the criterion directly?  
  - **A**: Yes—always deliberate ideally, even if self-defeating.  
  - **B**: No—due to costs of deliberating (e.g., time-sensitive friendship).  
  - **C**: No—due to uncalculating dispositions being essential (e.g., trust requires spontaneity).  

  **Case 1 (revisited): Physician using a heuristic recommended by ideal deliberation**.  
  **N8: Vindication**: Why is the heuristic rational?  
  - **A**: The criterion itself endorses it (e.g., ideal deliberation says "use heuristics").  
  - **B**: An independent standard (e.g., minimises regret or aligns with virtue).  

  **Case 7: Agent must decide while unaware of the criterion** (e.g., in a crisis).  
  **N9: Self-effacement**: When does the criterion reject itself?  
  - **A**: Locally—only in specific cases (e.g., high-stakes emergencies).  
  - **B**: Globally—always (e.g., "never use me").  

  ---

  #### Leaves (Positions)  
  *Sorted by path; "unnamed" if no established label. Most awkward commitment in bold.*  

  1. **A → A → A → A → (N/A) → A → A → A → A**:  
     **Full Inherited Deliberation**  
     *Awkward*: **In oppression cases, risks endorsing deformed desires (e.g., subservience) as "ideal"**.  

  2. **A → B → B → A → (N/A) → A → C → A → A**:  
     **Cleansed Internalism**  
     *Awkward*: **In the drug case, may ignore readily gatherable evidence, leading to avoidable harm**.  

  3. **A → C → B → B → A → A → C → A → A**:  
     **Adjusted Advisory Proceduralism**  
     *Awkward*: **Adjusting for partial compliance may incentivise half-measures (e.g., "reduce smoking" instead of quitting)**.  

  4. **B → A → A → B → B → B → A → B → A**:  
     **Unadjusted General Advisor** (similar to Railton-esque views)  
     *Awkward*: **Ignores whether the agent can perform recommended acts (e.g., surgery requiring unavailable skills)**.  

  5. **B → A → B → D → (N/A) → B → C → B → A**:  
     **Objective Ranking with Dispositions**  
     *Awkward*: **Prioritises ranked outcomes over agent’s abilities, risking infeasible demands**.  

  6. **B → C → A → C → A → A → B → A → B**:  
     **Global Self-Effacing Desire** (unnamed)  
     *Awkward*: **Self-effacement undermines the criterion’s authority in all cases, leaving agents directionless**.  

  7. **B → B → B → A → (N/A) → A → A → A → A**:  
     **Bounded Standpoint Choice**  
     *Awkward*: **In trust cases, insists on self-defeating deliberation, eroding relationships**.  

  8. **A → A → B → C → B → B → C → B → A**:  
     **Ideal Want with Independent Vindication** (unnamed)  
     *Awkward*: **"What the idealised agent wants" may conflict with agent’s welfare (e.g., painful sacrifices)**.  

  9. **B → A → A → C → B → A → A → A → A**:  
     **Ideal Desire Directness**  
     *Awkward*: **In oppression cases, may impose general desires alien to the agent’s identity**.  

  10. **A → C → A → B → A → A → B → A → A**:  
      **Cost-Sensitive Advisory**  
      *Awkward*: **Avoiding deliberation costs may permit epistemic laziness (e.g., not consulting experts)**.  

  ---

  #### Unoccupied Combinations & Diagnostics  
  - **N4=D with N1=A** (Inherited desires + Ranking): *Incoherent*—ranking requires impartiality, incompatible with anchored desires.  
  - **N7=A with N3=A in trust case** (Direct use + Unbounded computation): *Unattractive*—ignores that over-deliberation destroys the goods (trust) it evaluates.  
  - **N9=B with N8=A** (Global self-effacement + Criterion-vindication): *Incoherent*—if the criterion rejects itself universally, it cannot vindicate anything.  
  - **N6=B with N7=A** ("Could do" + Direct use): *Unexplored*—demands actions requiring skills the agent lacks, with no guidance on acquisition.  

  #### Indistinguishable Pairs  
  - **Leaf 3 vs. Leaf 10**: Tree cannot separate when *indirectness due to costs* (N7=B) overlaps with *cost-sensitive information* (N2=C). Both prioritise efficiency.  
  - **Leaf 5 vs. Leaf 8**: Ambiguity in whether "ranking" (N4=D) differs from "wanting" (N4=C) if the ideal agent is perfectly benevolent.  

  ---

  **How to Use This Handout**  
  Students begin at **N1** and move down branches by answering questions **in order**, using the specified cases. Record the path (e.g., "N1-B → N2-A → ..."). The leaf’s name and awkward commitment reveal the position’s diagnostic tension. **Do not** tally answers—path-dependence is essential. This tool exposes commitments, not historical lineages.  

