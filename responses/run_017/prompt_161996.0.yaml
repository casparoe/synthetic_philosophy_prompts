  ### Scenario  
  A point mass under gravity bounces perfectly elastically on a rigid floor, with bounce heights halving each time (initial height \(h_0\)). A toggle switch on the floor flips state at each bounce. The bounce times accumulate at \(t = T = \sqrt{2h_0/g} \cdot (1 + \sqrt{2})\) (finite). When the ball is in motion, the switch state holds constant between bounces. When the ball is at rest on the floor at \(t = T\), the switch is forced to OFF by the ball’s weight, overriding any toggle history. The switch alternates states infinitely before \(t = T\), with no limit in the sequence (e.g., ON, OFF, ON, ...).

  ### Demonstration  
  **Thomson’s argument breakdown**:  
  - *“Cannot be on” half*: Correctly concludes the lamp cannot be ON at \(t = T\) (no last ON-switch). This holds.  
  - *“Cannot be off” half*: Fails, as it incorrectly claims the lamp cannot be OFF (no last OFF-switch). It silently assumes the state *must* be determined *only* by the infinite switch sequence. Here, the static condition (ball at rest forces OFF) supersedes the sequence.  

  **Limit state derivation**: At \(t = T\), the ball is at rest on the floor. By the coupling rule, the ball’s weight applies constant downward force, mechanically holding the switch lever in OFF. Newton’s first law requires this equilibrium: if ON, the switch’s spring would lift the ball against gravity, violating energy conservation (finite energy cannot sustain perpetual motion). Thus, OFF is uniquely determined.  

  **Underdetermination reply unavailable**: The physics (gravitational force and switch coupling) fixes the limit state without stipulation. The pre-limit evolution constrains the limit via the ball’s rest condition and force laws, leaving no freedom.  

  **Key feature and its removal**:  
  - *Feature*: The static coupling rule (ball at rest forces OFF).  
  - *Removal*: Without this, the switch state depends only on the last toggle. With no last bounce, the limit state is indeterminate. The underdetermination diagnosis becomes correct.  

  **Objection and response**:  
  - *Objection*: “The switch’s OFF state is ‘smuggled in’ by the coupling rule, not genuinely determined by the supertask. Thomson’s lamp has no such static clause; the supertask should be ‘done’ infinitely, not overridden.”  
  - *Response*: The objection fails. The coupling is local and physical (ball position/velocity determine switch state via contact forces), not a stipulation. The supertask *is* completed (infinitely many toggles occur in \([0, T)\)), but the limit state resolves by continuous physics. This is consistent with Newtonian mechanics and meets all specifications.  

  ### Non-cheating verification  
  No outcome stipulation: the limit state is derived from force laws and continuity. If the static coupling were omitted, the system would underdetermine the limit state, proving that clause-free setups fail condition (6). This failure is analytically useful.  

  **Time-reverse check**: The time-reverse from \(t = T\) (ball at rest, switch OFF) would require the ball to spontaneously jump upward, violating energy conservation. Only the forward evolution is physical; the reverse is not a solution. Thus, determinacy holds.
