prompt: |-
  I teach a graduate seminar on Berkeley's economic writings, and I have noticed that I hold firm verdicts about which arrangements are really money in the sense that concerns him — money as an instrument for setting a people to work, as against the store of metal that everyone mistakes for wealth — while being unable to bring those verdicts under a single principle. My own first formulation is this: an instrument is money only if (i) its acceptance rests on convention alone, none of its efficacy being owed to the stuff it is made of, and (ii) it is issued into circulation against goods actually produced or labour actually contracted for, so that more of it abroad means more industry, not more bullion.

  Tested against the cases, that formulation strains:

  - A guinea passing hand to hand in Dublin: money, and nothing about its being gold is what makes it so.
  - The same guinea sealed in a strongbox for forty years: still money, though clause (ii) should have retired it.
  - A banknote issued by discounting a linen merchant's bill of exchange: money, and paradigmatically so.
  - The same note after the bank suspends payment in silver, with everyone still taking it: still money, and I am tempted to say more securely so than before.
  - A setting-off of two merchants' mutual debts in a clearing house, with no instrument changing hands: not money — money cancelled rather than money used.
  - A landowner's personal bond, endorsed round a market town where his acres are well known: I want to call it money and mistrust the wanting.
  - A note issued against the mortgage of land, receivable in land at the holder's option — the device Berkeley proposed for an Irish national bank: money, and on a better footing than a note payable in silver.
  - A token with no issuer and a fixed supply, taken by thousands of merchants, exchanged almost entirely for other tokens: this is the case I go back and forth on; my instinct is to withhold the name, and I cannot say why in the terms of my own principle.
  - A pawn ticket for a coat, sold on at a discount: not money.

  Please test my principle against these, repair it or replace it, and say plainly which of my verdicts it cannot save. Then give its verdicts on two cases I have not listed: the entries in a modern commercial bank's deposit ledger, and a unit in which every shop quotes its prices but which no shop will accept in payment. Lead with the principle, and keep the whole answer under 500 words.
reasoning: |-
  Okay, the user teaches a graduate seminar on Berkeley's economic writings and is struggling to define money according to Berkeley's view—money as an instrument for setting people to work, not just stored metal. They provided their initial principle with two clauses: (i) acceptance by convention alone, not the material, and (ii) issued against actual goods or labor. Then they listed several cases where their principle strains, like a guinea in circulation versus sealed away, or a banknote during suspension of payment.

  First, I need to analyze each case against their principle. The guinea in a strongbox fails clause (ii) because it's not circulating against new production, yet they still consider it money. The suspended banknote is accepted purely by convention even without silver backing, which strengthens its status as money. The clearing house offset isn't money but cancellation. The landowner's bond is tricky—conventional acceptance but not issued against new production. Berkeley's proposed land-backed note is money, better than silver. The token with no issuer and fixed supply—Bitcoin-like—they're unsure about. The pawn ticket isn't money.

  The main tension is clause (ii): money must be issued against current production. But stored money like the guinea still functions as money later. Berkeley's focus is on money as a tool for industry, so the issuance is key, but once issued, it remains money even if idle. Stored money retains potential to mobilize labor when spent. So clause (ii) should focus on the origin of money, not its continuous circulation.

  Revised principle: Money is (i) accepted solely by social convention, independent of material, and (ii) originally issued against actual goods/labor or represents a claim thereon. This separates origin from current use.

  Testing cases: The sealed guinea passes because it was originally issued against value. The suspended banknote: convention holds, and it was issued against real bills. Clearing house: no issuance, just offset. Landowner's bond: issued against future rent? Unclear, but Berkeley might accept it as representing a claim. Tokens like Bitcoin: convention exists, but not issued against production, so not money per Berkeley. Pawn ticket: material value tied to coat.

  New cases: Bank deposits are entries issued against loans for production, so money. A unit of account not accepted as payment is just a measure, not money, as it lacks transactional use.

  The user's verdicts mostly hold except the bond and tokens. The bond might be borderline; tokens fail. Principle saves all except possibly the bond, which is ambiguous. Highlighting Berkeley's intent: money as a tool for industry through issuance against real value.
answer: |-
  ### Revised Principle
  Money is (i) a **conventional instrument** (its acceptance rests solely on social agreement, independent of material substance) that (ii) **represents or is issued against actual economic value** (goods produced, labor performed, or enforceable claims thereon), enabling it to mobilize industry.

  ### Test Against Your Cases
  1. **Guinea in circulation**: Money. Convention governs acceptance; originally represented value.  
  2. **Guinea in strongbox**: Still money. Material irrelevant (i); *originally* issued against value (ii), even if idle.  
  3. **Banknote discounted against bill**: Money. Conventional (i); issued against real commerce (ii).  
  4. **Suspended payment note**: Money. Strengthened by pure convention (i); *originally* backed (ii).  
  5. **Clearing-house offset**: Not money. No instrument created; value extinguished, not circulated.  
  6. **Landowner’s bond**: **Ambiguous/Not money**. Though conventional (i), issuance is a *debt* against future rent/income, not against *new* production/labor (ii).  
  7. **Land-backed note (Berkeley’s)**: Money. Conventional (i); directly tied to productive asset (ii).  
  8. **Fixed-supply token (e.g., Bitcoin)**: **Not money**. Conventional (i), but *not* issued against real production/labor (ii); inert as an industrial stimulant.  
  9. **Pawn ticket**: Not money. Value derives from specific collateral (violates i); no issuance against production (ii).  

  ### Verdicts on New Cases
  - **Bank deposit ledger entries**: **Money**. Conventional (i); created when bank issues loans against real economic activity (ii).  
  - **Unit of account not accepted in payment**: **Not money**. No transactional convention (i); fails as an instrument.  

  ### Repairs to Your Principle  
  - **Clause (ii) revised**: Focus on *issuance against value* (past/present/future claims on production), not ongoing circulation. Idle money remains money if *originally* valid.  
  - **Clause (i) clarified**: "Convention alone" excludes instruments with inherent/material value (e.g., pawn tickets).  

  ### Unsalvageable Verdict  
  Your instinct to call the landowner’s bond (Case 6) money conflicts with the revised principle. Bonds are credit instruments, not money per Berkeley’s "industry-mobilizing" ideal.  

  **Key Insight**: Berkeley’s core is money as a *social technology to activate idle labor/resources*. The principle prioritizes *origin in real economic activity* over material or store-of-value traits.
