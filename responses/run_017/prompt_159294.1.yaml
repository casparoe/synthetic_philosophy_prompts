  Top objection likely comes from economists questioning why move from end-state to dynamic. They might see it as unnecessary complexity without practical benefit. Need to frame the response in terms of policy relevance and path-dependence in real-world reforms. The soft spot is proving this isn't just theoretical but affects actual policy sequences.

