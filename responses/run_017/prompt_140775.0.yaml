prompt: |-
  I'm the only trained archivist at a mid-sized city records office, and twice a year I run appraisal: roughly thirty offers and transfers per cycle, half a day each, and way more material than our shelves can hold. A five-person volunteer board has to sign off, I file a one-page justification for every accept or decline, and the state retention schedules set a floor for government records but say nothing about donated personal papers. I have no budget for outreach and no time to read theory.

  Its not enough to be told that the archive is a product of power and that its silences are structured rather than accidental. I cant hand that sentence to a new hire or paste it into the appraisal manual. Turn it into a procedure I can actually run in half a day: the questions in order, what counts as a sufficient answer to each, where the procedure just stops with a no, and where it hands the decision to a person because the question is one of values rather than facts.

  Two things I specifically want handled. First, a test for what kind of gap I'm looking at — stuff that was never created in the first place, stuff that was created and then destroyed or weeded, and stuff that exists but sits in someones attic or in another institution — because those seem to call for different responses and I keep conflating them. Second, a correction for what a colleague of mine calls the paper-trail gradient: the volume of documentation about a group tracks how closely that group was administered, not how much was actually going on, so a collections bulk is really evidence about the record-keeper. Should the procedure deliberately over-collect from the least-administered people, and how do I decide when enough is enough?

  Be straight about which steps are genuine tests and which are judgment calls dressed up as procedure. Then run it on three offers from this cycle: (a) about thirty linear feet of a housing departments tenant complaint and violation files, 1978–2015, with names, addresses and unit numbers; (b) one donated box of photocopied flyers, handwritten meeting notes and a membership list from a tenants association in those same buildings in those same decades; (c) the sheriffs office arrest ledgers and mugshots for a neighborhood that was demolished in the 1970s, which are basically the only surviving trace of the people who lived there. I will not like whatever it says about (c), so say it plainly. And tell me what the procedure cant do — especially where it cant tell me what a community actually wants without me going and asking them.
reasoning: |-
  Okay, this archivist is dealing with some serious challenges. They're the only trained professional in a mid-sized city records office, handling appraisal cycles twice a year with limited resources. They need practical procedures, not theoretical jargon. Let me unpack their core needs.

  First, they want a structured appraisal procedure that fits within their half-day per collection constraint. The procedure must clearly distinguish between factual tests and value judgments. They specifically need two tools: a gap typology framework (to identify why something is missing) and a paper-trail gradient correction (to address archival bias toward administered groups).

  The gap analysis needs to categorize absences as: never created, created but destroyed/weeded, or existing but inaccessible. Each type requires different archival responses. For the paper-trail issue, they're asking if they should deliberately over-collect from under-documented groups and how to set limits on that.

  Three test cases are provided: (a) government housing department files, (b) donated tenant association materials, and (c) sheriffs records from a demolished neighborhood. The user anticipates disagreeing with the recommendation for (c) but wants honesty.

  Key constraints: no outreach budget, no theory-reading time, decisions must be justifiable to a volunteer board via one-page memos. The procedure must acknowledge where community input would be ideal but isn't feasible.

  I'll design a three-phase workflow: Gap Diagnosis (10 mins), Power Analysis (15 mins), and Collection Threshold Test (20 mins). Each phase will have specific questions with clear "stop/no" triggers and "refer to human judgment" flags. For the paper-trail problem, I'll build in weighting factors that boost appraisal scores for under-documented groups but cap at +2 points to prevent uncontrolled over-collection.

  For the test cases: (a) fails immediately due to privacy/retention issues; (b) gets boosted for documenting tenant voices but still requires judgment calls; (c) gets maximum paper-trail compensation but still fails on privacy grounds. I'll be blunt about (c) - its historical value doesn't override the harm potential of preserving arrest records without consent.

  The procedure's limitations section will highlight where community consultation would theoretically occur but isn't operationally possible. This maintains intellectual honesty while respecting their resource constraints.
answer: |-
  Here's a structured appraisal procedure designed for your constraints (half-day per offer, board sign-off, one-page justification). It integrates gap analysis and paper-trail gradient correction directly into the workflow. **Bold text indicates critical steps or outputs.**

  **Appraisal Procedure: Structured Power & Gap Analysis (SPGA)**

  **Phase 1: Foundational Checks (5-10 mins)**
  *   **Q1: Mandatory Retention?** Is this material covered by a current, active state/city retention schedule mandating transfer to archives? (YES = **AUTOMATIC ACCEPT**, proceed only for documentation. NO = Proceed to Q2)
  *   **Q2: Legal Prohibition?** Is accepting this material legally prohibited (e.g., sealed records, specific privacy statutes blocking transfer, active litigation hold)? (YES = **AUTOMATIC DECLINE**. NO = Proceed to Q3)
  *   **Q3: Physical/Financial Feasibility?** Does the material require immediate, significant conservation (beyond basic stabilization) we cannot fund, or pose a severe hazard (mold, pests, asbestos)? (YES = **AUTOMATIC DECLINE**. NO = Proceed to Phase 2).

  **Phase 2: Gap & Power Analysis (15-20 mins)**
  *   **Q4: Gap Diagnosis - What's Missing?**
      *   *Evidence:* Creator context, date ranges, physical form, comparison to known holdings/community history.
      *   **Gap Type:**
          *   **Never Created:** No evidence similar records *should* exist (e.g., no formal process, community not documented officially). *Response: Consider proactive documentation? (But beyond scope now).*
          *   **Created & Destroyed/Weeded:** Evidence records existed but were disposed (e.g., schedules, gaps in series, donor statements). *Response: Does *this* offer mitigate that loss?*
          *   **Exists Elsewhere/Inaccessible:** Known holdings in other repositories, private hands, or inaccessible systems (e.g., donor mentions attic stash, known related collection at university). *Response: Can we realistically access it? Does this offer add unique value?*
      *   *Output:* **Gap Type Identified.** (Judgment Call: Requires comparing offer context to historical/admin knowledge).
  *   **Q5: Correcting the Paper-Trail Gradient**
      *   *Evidence:* Nature of creating entity (gov't agency vs. community group vs. individual), level of formality, typical volume generated by similar entities.
      *   **Admin Level Assessment:** Is the creator/group documented inherently **Over-Administered** (e.g., city department, large regulated corp) or **Under-Administered** (e.g., informal community group, marginalized population, individual activist)?
      *   **Paper-Trail Adjustment Factor:**
          *   Over-Administered: **-1** (Bulk is likely systemic, not necessarily proportional to significance).
          *   Neutral/Standard Admin: **0** (e.g., established non-profits, mid-sized businesses).
          *   Under-Administered: **+2** (Material is inherently rarer, represents voices often excluded).
      *   *Output:* **Adjustment Factor (-1, 0, +2).** (Judgment Call: Classifying the creator's position within power/admin structures).
  *   **Q6: Core Archival Values Test (Apply Adjustment Factor)**
      *   Score each factor (0-5), then **ADD Paper-Trail Adjustment Factor**.
      *   *Evidence:* Offer description, sampling material if crucial.
      *   **Evidential Value (0-5):** Does it document org structure, decisions, functions (gov't) OR crucial activities/experiences (community)? (High for official actions/events).
      *   **Informational Value (0-5):** Does it provide unique insights into people, places, events, conditions not captured elsewhere? (High for lived experience, context).
      *   **Intrinsic Value (0-5):** Is the physical form/authenticity crucial (e.g., original art, unique format)? (Usually low for papers/copies).
      *   **Representational Value (0-5):** Does it document a perspective/group chronically under-represented? (Directly links to Q5).
      *   **Total Score (0-25):** Sum (Evid + Info + Intrin + Rep) + **Adjustment Factor**.
      *   **Threshold:** **Total Score >= 15?** (YES = Proceed to Phase 3. NO = **RECOMMEND DECLINE**). (Judgment Call: Scoring is inherently subjective, threshold is set based on your capacity).

  **Phase 3: Practical Thresholds & Risk Assessment (15-20 mins)**
  *   **Q7: Uniqueness & Redundancy?** Based on your knowledge (not exhaustive research), is the *core information* or *unique perspective* in this offer likely duplicated elsewhere *within your accessible collecting universe* (your holdings, key local partners)? (YES = Strong factor to **DECLINE**. NO = Proceed). (Test: Requires professional knowledge, not research).
  *   **Q8: Capacity Check (The "Enough" Question):**
      *   Does accepting this **significantly worsen** a known, severe storage crisis for material of *similar* value/type? (YES = **RECOMMEND DECLINE**).
      *   Does this offer represent a **critical gap** for an under-documented group/perspective (Q5 Under-Administered)? Does it pass Q6 despite capacity strain? (YES = **RECOMMEND ACCEPT**, flag strain). (Judgment Call: Balancing scarcity against absolute capacity limits).
  *   **Q9: Privacy/Harm Risk Assessment:**
      *   Does the material contain **Highly Sensitive Personal Data** (SSNs, medical details, financial records, graphic details of trauma)? (YES = **RECOMMEND DECLINE** unless exceptional, overriding historical value *and* robust restriction plan).
      *   Does it contain **Potentially Harmful Identifiable Info** (names+addresses+complaints, arrest details, membership lists)? (YES = Proceed to Q10).
      *   Low/No Sensitive Data = Proceed.
  *   **Q10: Can Harm Be Mitigated?** (If Q9 = YES to potentially harmful info)
      *   Can sensitive portions be practically segregated/redacted? (Judgment Call: Time/cost estimate).
      *   Can robust, enforceable access restrictions be applied immediately? (Judgment Call: Board support? Staff time?).
      *   Is the **Potential Harm** (reputational, safety, dignity) likely **outweighed** by the **Adjusted Value** (Score + Gap/Under-Admin status)? (MAJOR Judgment Call: Core ethical dilemma).
      *   *Output:* **Mitigation Plan Feasible & Agreed?** (YES = **Recommend ACCEPT w/ Restrictions**. NO = **RECOMMEND DECLINE**).

  **Output & Handoff:**
  *   **Recommendation:** Accept / Decline / Accept w/ Restrictions.
  *   **Key Justification:** Gap Type (Q4), Paper-Trail Adjustment (Q5), Core Score (Q6), Uniqueness (Q7), Capacity Impact (Q8), Harm Mitigation (Q9/Q10).
  *   **Board Handoff:** Recommendations based on Q8 (Severe Capacity Strain vs. Critical Gap) and Q10 (Harm vs. Value) require **BOARD JUDGMENT** on institutional priorities/risk tolerance. Your justification frames the values decision.

  **Applying SPGA to Your Offers:**

  1.  **(a) Housing Dept Tenant Files (30 ft, 1978-2015, names/addresses/complaints):**
      *   Q1: Likely covered by retention? (If yes, AUTO ACCEPT). *Assume NO for this exercise.*
      *   Q2: No legal prohibition (probably).
      *   Q3: Assume feasible.
      *   Q4: **Gap Type: Created & Destroyed/Weeded?** (Assuming scheduled destruction). *Mitigates loss of official view.*
      *   Q5: **Admin Level: Over-Administered (Gov't Dept). Adjustment: -1**
      *   Q6: Scores - Evid:5, Info:4 (details of conditions), Intrin:1, Rep:1 (Tenants, but gov't lens) = 11 + (-1) = **10 (Below 15 Threshold)**.
      *   Q7: **High Redundancy?** Very likely - systematic records, similar info aggregated elsewhere? (Recommend Decline factor).
      *   Q8: **Severe Capacity Impact?** 30ft is huge. Strains capacity for high-value material, this scores low. **Recommend DECLINE.**
      *   Q9: **YES - Potentially Harmful Info.** Names/addresses/complaints = risk of stigmatization, harassment.
      *   Q10: **Mitigation Feasible?** Segregation/redaction of 30ft impractical. Restrictions possible but info inherently sensitive. **Harm > Adjusted Value (10). Recommend DECLINE.**
      *   **RECOMMENDATION: DECLINE.** Justification: Low adjusted score (10) due to redundancy and over-administered origin, high volume straining capacity, high privacy risk impractical to mitigate. Captures gov't view, but tenant perspective is indirect and risky.

  2.  **(b) Tenant Assoc. Box (Flyers, notes, list):**
      *   Q1/Q2/Q3: Assume OK.
      *   Q4: **Gap Type: Never Created? / Created & Destroyed?** Hard to say, but tenant assoc. records often not systematically kept. *Mitigates potential loss of community voice.*
      *   Q5: **Admin Level: Under-Administered (Grassroots group). Adjustment: +2**
      *   Q6: Scores - Evid:3 (org function), Info:5 (lived experience, organizing), Intrin:1 (copies), Rep:5 (Direct tenant voice, underrepresented) = 14 + 2 = **16 (Above 15 Threshold)**
      *   Q7: **Uniqueness:** High. Unlikely gov't captured this perspective directly.
      *   Q8: **Capacity Check:** 1 box = Low impact. Represents critical gap for under-documented group. **Recommend ACCEPT.**
      *   Q9: **Potentially Harmful Info?** Membership list - moderate risk. Flyers/notes likely lower risk.
      *   Q10: **Mitigation Feasible?** List can be segregated/restricted (1 box manageable). Harm risk moderate, value high (16). **Recommend ACCEPT w/ Restrictions on membership list.**
      *   **RECOMMENDATION: ACCEPT w/ Restrictions.** Justification: High adjusted score (16) reflecting unique, underrepresented tenant perspective (Under-Admin +2), low volume, privacy risk manageable via restriction on membership list. Directly complements/counters official record (a).

  3.  **(c) Sheriff's Arrest Ledgers/Mugshots (Demolished Neighborhood):**
      *   Q1/Q2/Q3: Assume OK (unless specific laws block old arrest images).
      *   Q4: **Gap Type: Created & Destroyed/Weeded? / Exists Elsewhere?** Possibly only surviving trace? **Critical gap filler, but problematic source.** *Mitigates loss of existence proof, but through biased lens.*
      *   Q5: **Admin Level: Over-Administered (Law Enforcement) BUT documenting Under-Administered Population. Adjustment: +2** (The **group documented** is profoundly Under-Administered; this is likely *critical* documentation *of them*, however flawed. The +2 applies for representational value/scarcity).
      *   Q6: Scores - Evid:5 (law enforcement actions), Info:5 (Proof of residence, demographics, policing patterns), Intrin:2 (original ledgers/photos), Rep:3 (Documents residents, but only via criminalization) = 15 + 2 = **17 (Above 15 Threshold)**
      *   Q7: **Uniqueness:** Very High. Likely *only* systematic visual/identifying record.
      *   Q8: **Capacity Check:** Assume manageable volume? Represents **critical gap** for erased community. **Recommend ACCEPT.**
      *   Q9: **Highly Sensitive/Potentially Harmful?** **YES.** Mugshots + arrest data = High risk of perpetuating stigma, re-traumatization, misuse (e.g., facial recognition), dignitary harm. Core identity defined by interaction with carceral system.
      *   Q10: **Can Harm Be Mitigated?** **Extremely Difficult.**
          *   Redaction impractical (mugshots).
          *   Restrictions essential but don't erase harm of preservation.
          *   **Harm vs. Value:** This is the crux. The informational/historical value (proof of existence, demographics) is incredibly high *because the community was erased*. The harm potential (reducing lives to mugshots, perpetuating criminalization narrative) is also incredibly high. **Does informational value (+2 adjustment included) *truly* outweigh the profound dignitary harm and risk of misuse?** (MAJOR Judgment Call).
      *   **RECOMMENDATION: AMBIVALENT, LEANING DECLINE.** Justification: Very high adjusted score (17) and uniqueness due to catastrophic community erasure and Under-Administered status (+2). However, the nature of the records (mugshots/arrests) creates exceptionally high and likely unmitigatable risks of harm, re-victimization, and perpetuating a solely carceral narrative of the community's existence. The procedure flags this as a **BOARD JUDGMENT CALL on core ethics:** Is preserving this state-generated, inherently harmful documentation of an erased community the lesser evil compared to the silence of total erasure? *Professionally, the potential for harm often outweighs the informational value when the *only* trace is through such a violent system.* **Acknowledge your discomfort; it's valid.**

  **What the SPGA Procedure CAN'T Do:**

  1.  **Determine Community Wishes:** It cannot tell you what the descendants of the demolished neighborhood, the tenants in the housing files, or the tenant association members *actually want* done with these records. It infers "representational value" based on *your* assessment of under-documentation, not community voice. Outreach is needed for this.
  2.  **Define "Significant" Harm or Value:** The thresholds (Score 15, "severe" capacity strain, "outweigh" harm) rely on your professional judgment and institutional risk tolerance. The procedure structures the question, not the answer.
  3.  **Resolve Fundamental Ethical Conflicts:** Cases like (c) expose deep contradictions (preservation vs. harm, power of the archive vs. justice). SPGA surfaces the conflict (Q10) but the resolution (Accept w/ extreme restrictions? Decline? Seek community input hypothetically?) is a human/board decision based on values.
  4.  **Conduct Deep Research:** Uniqueness (Q7) relies on your existing knowledge, not new outreach or deep digging. Gap diagnosis (Q4) is based on readily available context.
  5.  **Eliminate Subjectivity:** Scoring values (Q6), classifying Admin Level (Q5), assessing harm severity (Q9/Q10), and balancing capacity vs. critical gaps (Q8) are inherently judgment calls. The procedure makes them explicit and structured, not objective.
  6.  **Create Resources:** It can't magically free up shelf space or grant an outreach budget. It helps triage within brutal constraints.

  **In essence:** SPGA forces you to systematically confront the power dynamics (through Gap Analysis and the Paper-Trail Gradient Correction) and practical constraints inherent in archival appraisal within your specific, limited context. It turns theory into actionable questions and structured justifications, but it doesn't replace the need for difficult professional judgments, especially concerning harm and ethics. It makes the "silences" and the reasons behind your choices (including necessary, painful declines) explicit and defensible to your board.
