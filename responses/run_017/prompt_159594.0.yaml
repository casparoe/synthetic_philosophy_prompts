prompt: |-
  I run onboarding for new engineers joining our model-monitoring team, and I've got 45 minutes next week. What I need them to walk out able to do is read a drift report and say something better than "the numbers moved." The concept is mechanistic anomaly detection: what were hunting isn't a weird input or a bad output, it's a change in which internal machinery is producing a behavior we thought we'd already characterized. The part they always get stuck on, and where I think the session lives or dies, is the identity question: when is the mechanism running now the same mechanism we wrote up six months ago?

  So plan the session for me rather than giving me the talk. What has to come first and what depends on what -- I suspect I can't even get them to state "the mechanism changed" until they have an intervention-based notion of a mechanism rather than a circuit-diagram notion, but I'm not sure that's where to start. One example to carry the whole thing: I've been using a loan classifier that reviewers traced to a salary-and-zipcode feature direction, which after a data refresh returns the same approvals with that direction gone and something functionally similar rebuilt out of two unrelated attention heads -- tell me if that's the wrong example, and what a carrying example here has to have and to lack. The misconceptions in the order they'll actually form, with the point in the sequence where each gets headed off: I'm guessing "anomaly just means rare input," "same outputs and same accuracy means same mechanism," and "the mechanism is whatever's in the diagram." And one question at the end that tells me they've got the identity question rather than just the vocabulary.

  Two constraints. I've decided to define identity pragmatically, by whether the safety case we already wrote still covers the new arrangement -- call that coverage identity -- and I want the plan built around it rather than around path-identity versus counterfactual-profile identity. And tell me what I should openly refuse to explain at this level.
reasoning: |-
  We are designing a 45-minute onboarding session for new engineers on mechanistic anomaly detection, with a focus on reading drift reports beyond superficial observations. The core challenge is getting them to articulate when a mechanism has changed, using a pragmatic definition based on whether the existing safety case still covers the new arrangement ("coverage identity").

  The plan must:
  1. Start by establishing the concept of a mechanism in an intervention-based way (not circuit diagrams).
  2. Use a consistent example (loan classifier) to carry through the session.
  3. Address common misconceptions in the order they arise:
     - "Anomaly just means rare input."
     - "Same outputs and same accuracy means same mechanism."
     - "The mechanism is whatever's in the diagram."
  4. End with a diagnostic question to check understanding of the identity question.

  Constraints:
  - Define mechanism identity pragmatically: the safety case coverage remains valid.
  - Avoid deep dives into alternative identity definitions (path-identity, counterfactual-profile).

  ### Session Plan Outline

  **Total: 45 minutes**

  #### (0-5 min) Introduction and Hook
  - **Objective:** Set the stage and the problem.
  - **Content:** 
    - Start with the mission: We monitor models to catch when they change in ways that invalidate our safety assurances. 
    - The pitfall: Current reports often lead to "the numbers moved" without actionable insight. 
    - Today's goal: Enable you to look at a drift report and articulate whether a mechanistic change has occurred that might break our safety case.
  - **Example Introduction:** 
    - "Consider a loan approval model. We built a safety case around a known mechanism: it uses salary and zipcode. After a data refresh, we notice the same approvals, but the mechanism has changed. How do we catch that?"

  #### (5-15 min) Intervention-Based Notion of Mechanism (vs. Circuit Diagram)
  - **Objective:** Shift from structural to functional/pragmatic view.
  - **Activity:**
    - Present the loan classifier example: 
      - Original: Relied on salary and zipcode (as per feature importance and manual review). 
      - After refresh: Same accuracy, same approvals, but the model now uses two unrelated attention heads to reconstruct a similar function.
    - **Key Question:** "Is this the same mechanism?" 
    - **Intervention Concept:** 
      - "A mechanism is defined by how it responds when we intervene. If we change the salary input, the original model would change its output in predictable ways. In the new model, changing salary might not have the same effect because the mechanism is different."
    - **Safety Case Coverage:** 
      - Our safety case was built assuming that the model relies on salary and zipcode. If the model now uses different features (even if achieving the same outcome), the safety case (which considered the implications of using salary/zipcode) might not cover the new mechanism.

  #### (15-25 min) Confronting Misconceptions
  - **Objective:** Preempt and correct common misunderstandings in sequence.
  - **Misconception 1: "Anomaly just means rare input."**
    - **Address:** 
      - Show a drift report with an input distribution shift (e.g., more high-salary applicants). 
      - Contrast with a report showing unchanged inputs but changed internal activations (in the loan example, the attention heads changed). 
      - "An anomaly in mechanism isn't about rare inputs; it's about the model's internal processing changing."
  - **Misconception 2: "Same outputs and same accuracy means same mechanism."**
    - **Address:** 
      - Use the loan example: same approvals, same accuracy, but different mechanism. 
      - Emphasize: The safety case might be broken because the new mechanism could be more brittle or have different failure modes. 
      - "Accuracy is a surface metric; it doesn't tell us about the internals."
  - **Misconception 3: "The mechanism is whatever's in the diagram."**
    - **Address:** 
      - "Diagrams are static and may not capture the actual computation. We care about the dynamic behavior under interventions." 
      - In the loan example, the circuit diagram might look similar (e.g., still has attention heads) but the actual function computed by those heads changed.

  #### (25-35 min) Covering the Identity Question with "Coverage Identity"
  - **Objective:** Establish the pragmatic definition of identity.
  - **Activity:**
    - **Define Coverage Identity:** 
      - "Two mechanisms are the same if the safety case we built for the original still applies to the new one. If the new mechanism falls outside the scope of what we've tested and assured, then it's a change."
    - **Apply to Loan Example:**
      - Original safety case: We tested for fairness along demographic lines that correlate with zipcode and salary. 
      - New mechanism: It uses different features (say, two attention heads that are not aligned with those demographics). 
      - The safety case might not cover the new mechanism because the new features might introduce new biases or failure modes we haven't assessed.
    - **Checkpoint Question:** "If we see a drift report showing the internal activations have changed, but the outputs haven't, should we worry?" 
      - Answer: Yes, because the safety case might be invalid.

  #### (35-40 min) Reading a Drift Report with Mechanistic Anomaly Detection
  - **Objective:** Apply the concepts to a sample report.
  - **Activity:**
    - Show a simplified drift report (for the loan model) that includes:
      - Input distribution (stable).
      - Output distribution and accuracy (stable).
      - Internal activations (changed: attention heads now show a different pattern).
    - **Guided Analysis:**
      - "Look at the internal activations: they changed. This means the mechanism might have changed. We must check if the safety case still holds."
    - **Key Takeaway:** 
      - "Don't stop at input/output; look for changes in internals and ask: does our safety case cover this?"

  #### (40-45 min) Diagnostic Question and Wrap-up
  - **Objective:** Check understanding of the identity question.
  - **Diagnostic Question:** 
    - "Suppose we have a model that, after a retraining, shows the same accuracy and output distribution. However, the internal activation patterns are different. We run an intervention: we corrupt the original key feature (salary) and the model's output doesn't change as much as it did before. What would you conclude about the mechanism and the safety case?"
  - **Expected Answer:** 
    - The mechanism has changed (it's less sensitive to salary). The safety case, which assumed salary was a key feature, might be invalid because the model is now relying on something else that we haven't vetted.
  - **Wrap-up:** 
    - Reiterate: The goal is to move beyond "the numbers moved" to "the mechanism changed, and here's why our safety case might be broken."

  ### What to Refuse to Explain
  - **Do not dive into:**
    - Alternative definitions of identity (e.g., path-identity, counterfactual-profile identity). Say: "For our purposes, we define identity by the safety case coverage. Other definitions exist but are out of scope."
    - Detailed methods for mechanistic interpretability (how we trace mechanisms). Say: "We have tools to detect changes in internal activations; the details of how we set up those monitors are covered elsewhere."
    - How to build a safety case. Say: "We assume the safety case exists and is well-defined; our job is to monitor for changes that break it."

  ### Why the Loan Example Works
  It has:
  - A clear, understandable mechanism (salary and zipcode).
  - A change that preserves outputs but alters internals (rebuilding the same function from different parts).
  - A direct link to the safety case (fairness concerns around zipcode and salary).
  - Avoids:
    - Being too abstract.
    - Requiring deep neural network expertise (even though it uses attention heads, we can describe them as components without detail).

  ### Adjusting for Time
  - If running short, spend less time on the misconceptions and more on the example and coverage identity.
  - If running long, skip the detailed drift report walkthrough and focus on the diagnostic question.

  This plan builds from foundational concepts to application, directly addresses the stated misconceptions, and centers on the pragmatic identity definition. The diagnostic question at the end tests whether they can connect intervention results to safety case coverage.
answer: |-
  ### Session Plan: Mechanistic Anomaly Detection & Coverage Identity  
  **Core Goal:** Engineers leave able to articulate **mechanism changes** in drift reports using **coverage identity** ("Does our safety case still hold?").  
  **Time:** 45 minutes.  
  **Anchor Example:** Loan classifier. Originally relied on salary + zipcode (verified via feature importance/reviewer traces). Post-data-refresh, approvals remain identical, but the mechanism is rebuilt using two unrelated attention heads.  

  ---

  ### Phase 1: Grounding in Intervention-Based Mechanisms (10 min)  
  **Why start here?** Engineers default to "circuit diagrams" (static structure) or input/output metrics. We need **pragmatic, functional mechanisms** tied to interventions.  
  **Key Point:** *A mechanism is defined by how it responds to perturbations.*  

  - **Hook (2 min):**  
    - Show two model versions approving identical loans.  
    - *Question:* "Are these the same model? Why might we care if internals changed?"  
    - *Answer:* "Same outputs ≠ same mechanism. Safety cases are built on *how* the model works, not just outcomes."  

  - **Intervention Demo (5 min):**  
    - Original loan model: Artificially inflate salary → approval likelihood jumps. Corrupt zipcode → approvals drop.  
    - New model: Inflate salary → minimal change. Corrupt zipcode → no effect. *But approvals stay the same overall.*  
    - **Aha!** "Mechanism = how the model *reacts* when we poke it. If interventions break it differently, the machinery changed."  

  - **Contrast with Misconceptions (3 min):**  
    - Head off *"Same outputs/accuracy = same mechanism"*:  
      - "The new model achieves the same approvals *without salary/zipcode*. It’s using a different ‘engine’—like replacing a car’s engine but keeping the same speed."  
    - *Refuse to explain:* Path-based identity (e.g., "Is it the same neurons?"). Dismiss: "We care about *function*, not wiring diagrams."  

  ---

  ### Phase 2: Coverage Identity & Safety Cases (15 min)  
  **Why now?** Interventions set the stage. Now tie mechanisms to **pragmatic safety**.  
  **Key Point:** *Identity = "Does the safety case still apply?"*  

  - **Safety Case Primer (3 min):**  
    - Loan model safety case: "We validated that loan decisions rely *only* on salary/zipcode (no proxy discrimination). We tested edge cases here."  
    - *Stress:* "Safety cases are built on **mechanistic assumptions**, not just metrics."  

  - **Apply to Example (7 min):**  
    - Original mechanism: Salary/zipcode → safety case covers bias risks for these features.  
    - New mechanism: Attention heads rebuild behavior using unrelated features (e.g., "employer name + debt ratio").  
    - *Question:* "Does the safety case still cover this?"  
      - **No!** Bias risks might now lurk in new features (e.g., "employer name" proxies ethnicity).  
    - **Coverage identity defined:** "If the safety case’s assumptions don’t map to the new mechanism, identity is broken."  

  - **Kill Misconceptions (5 min):**  
    - Head off *"Anomaly = rare input"*:  
      - Show drift report: Input distribution identical, internals shifted. "No 'rare inputs' here—yet the mechanism changed."  
    - Head off *"Mechanism = diagram"*:  
      - "The model’s *documented* architecture didn’t change (still has attention heads!), but its *actual computation* did. Diagrams lie."  

  ---

  ### Phase 3: Diagnose Drift Reports with Coverage Identity (15 min)  
  **Activity:** Practice spotting mechanism changes via coverage gaps.  

  - **Drill with Loan Example Report (10 min):**  
    - Display a mock drift report showing:  
      - ✅ Input/output distributions stable.  
      - ✅ Accuracy unchanged.  
      - ❗ Internal activations shifted (attention heads now fire for different features).  
    - *Guided analysis:*  
      1. "What interventions would test mechanism change?" (e.g., perturb salary; if no effect → changed).  
      2. "What part of the safety case might break?" (e.g., "We mitigated zipcode bias, but new features could introduce unseen risks").  
      3. **Verdict:** "Mechanism changed → safety coverage invalid."  

  - **Generalize (5 min):**  
    - "Drift reports are **mechanism change detectors**:  
      - Look beyond input/output stats → track internal *intervention responses*.  
      - Ask: *‘What safety assumptions would this change break?’*"  

  ---

  ### Phase 4: Check Understanding & Wrap-Up (5 min)  
  **Diagnostic Question (3 min):**  
  > "A drift report shows internal activations shifted dramatically, but input/output stats are stable. Your teammate says, ‘No problem—accuracy didn’t drop.’ How do you argue this could still break the safety case?"  

  **Expected Answer:**  
  - "Accuracy doesn’t reveal mechanism changes. If interventions (e.g., perturbing previously critical features) now behave differently, the safety case’s assumptions may be invalid. E.g., new features could introduce unvetted risks."  

  **Closing (2 min):**  
  - "You now see: **Mechanisms change silently.** Your job: Catch shifts that break our safety promises. Start with coverage identity: *‘Does the safety case still hold?’*"  
  - *Refuse to explain:* Counterfactual profiles/path identity. Shut down with: "For our work, identity is **pragmatic**—safety coverage, not philosophy."  

  ---

  ### Why This Works  
  1. **Example choice:** Loan classifier is ideal. It lacks distracting complexity (e.g., no images/audio), and salary/zipcode → attention heads cleanly illustrates silent mechanism substitution.  
  2. **Misconception order:**  
     - Phase 1 preempts "same outputs = same mechanism."  
     - Phase 2 kills "anomaly = rare inputs" and "mechanism = diagram."  
  3. **Coverage identity focus:** Safety cases are the engineering anchor—concrete and action-oriented.  
  4. **Diagnostic question** tests if they internalized *why* internal changes matter beyond accuracy.  

  **What to sacrifice:**  
  - No time for *how* we detect mechanistic shifts (save for technical deep dives).  
  - No debate on alternative identity definitions. Shut down with: "Our domain requires safety guarantees—coverage identity is non-negotiable."  

  Engineers will walk out paranoid about silent mechanism shifts—and equipped to articulate them.
