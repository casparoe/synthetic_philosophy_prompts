  I'm grading the final exams for an upper-level seminar on persons, minds, and machines, and I want a second read on one answer before I commit to numbers. Below is the question exactly as it was printed, followed by a transcription of one anonymized answer (I've removed the candidate number and left the paragraphing as submitted). I'm not going to tell you what I think of it — I've graded eight of these already and I don't trust my own consistency at this point, and this candidate writes well enough that I'd rather have the claims checked than the prose judged.

  **The question as printed (Question 4 of 5; 25 points; suggested time 40 minutes).**

  In "The Problem With Counterfeit People" (*The Atlantic*, May 2023), Daniel Dennett warns that AI has made it possible for anyone to manufacture artifacts that pass for people in the digital environments we now inhabit, and he urges that both their creation and their "passing along" be outlawed. He writes:

  > Our natural inclination to treat anything that seems to talk sensibly with us as a person—adopting what I have called the "intentional stance"—turns out to be easy to invoke and almost impossible to resist, even for experts.

  and:

  > These counterfeit people are the most dangerous artifacts in human history, capable of destroying not just economies but human freedom itself.

  Consider the following criticism of Dennett, which I'll call the parity argument. Dennett has spent much of his career arguing (i) that there is no further inner fact of understanding over and above the patterns that support belief–desire attribution, and that the conceivability of philosophical zombies is an illusion; and (ii) that adopting the intentional stance is a pragmatic predictive strategy, while the truth of the attributions it generates is an objective matter about real patterns rather than about anything hidden. He has also treated Turing's "imitation game," in its original spirit, as a not unreasonable proposal about what would count as real thinking. Put these together and it looks as though he is committed to saying that a system we cannot tell apart from a person *is* a person. On that view, "counterfeit" can only record a fact about the maker — that the thing was built in order to deceive us — and not a fact about the system itself; and a fact about a maker's intentions cannot bear the weight Dennett places on it, since his case for criminalizing counterfeit people is supposed to rest on what they are.

  Assess the parity argument. Does Dennett have the resources to mark a genuine distinction between a person and a counterfeit person, and if so, where precisely does it lie — in the system's competences, in its causal or developmental history, in its answerability to the world, in its relations to other stance-takers, or somewhere else? Is the resulting distinction metaphysical, moral, or epistemic? You must engage with at least two of the following: (a) the intentional stance and mild realism about patterns; (b) competence without comprehension; (c) the six conditions of personhood discussed in class — intentional system, rationality, the stance, reciprocity, communication, consciousness. You may also bring in Searle's Chinese Room argument, but if you do, you must say exactly how Dennett's complaint about counterfeit people differs from Searle's complaint about the room.

  **The answer to be graded.**

  *1. The intentional stance.* The intentional stance is the strategy of predicting what a system will do by treating it as a rational agent: you assign it the beliefs and desires it ought to have given its situation and its purposes, and you predict that it will do what it has most reason to do. Whether to adopt the stance is a pragmatic matter, justified by its predictive payoff; and, as Dennett says in the Atlantic piece, it is triggered in us automatically by anything that converses fluently and is almost impossible to resist. That is precisely the mechanism a counterfeit person exploits. So the parity argument is right about one thing: whatever makes a counterfeit counterfeit, it cannot be that we are unable to take the intentional stance toward it. We cannot help ourselves, and that is the source of the danger.

  *2. Mild realism, and why the parity argument overreaches.* But it overstates Dennett's pragmatism. Mild realism separates the decision to adopt the stance from the truth of the attributions the stance generates. Adopting it is our choice, and it is warranted by its usefulness; but once adopted, whether the system really has the beliefs we ascribe to it is an objective question, settled by whether there is a real pattern in its behavior for the ascription to track — one that supports prediction and projection to new cases, and that is not merely a façon de parler we project onto the data. That is what lets Dennett distinguish useful "as if" attributions from true ones. It also shows that reliable predictability is not by itself the test. A system can reliably produce person-like behavior because its designers tuned it to, without there being any pattern of reasons in the system for the attribution to latch onto. Dennett's own label for this is competence without comprehension — the insight he credits to Darwin and Turing jointly, that excellence at a task need not come with any grasp of what one is doing. Counterfeit people are the limiting case: all of the competence that makes the stance pay off, none of the comprehension that would make its deliverables true.

  *3. Where the distinction actually lies.* Here the parity argument is closest to being right, and it is worth being exact. Dennett cannot say that the counterfeit lacks something *visible from within* the intentional stance; if he could, the Turing-test lineage in his own thinking would convict him of inconsistency. What he says instead is that the counterfeit lacks the real thing of which the appearance is an appearance — comprehension — and comprehension is an extra ingredient over and above any pattern of behavior: it is what the brain's causal machinery supplies and what a purely formal system, however well tuned, does not have. This is the same point Searle was reaching for with the Chinese Room: syntax is not semantics. They differ only about the source of the missing ingredient — Searle locates it in the specific neurochemical causal powers of brains, Dennett in the causal powers of systems that have been shaped by evolution and by learning in a real world. Both agree that it is intrinsic to the system and in principle detectable from the design stance, which is why no conversational test could ever settle whether a given counterfeit had become real. Dennett's anti-zombie arguments are consistent with this: they show only that the ingredient cannot float free of the physical facts — that there is no possible world in which a molecule-for-molecule duplicate of a person lacks it — not that it is a behavioral property.

  *4. Personhood.* The strongest route for the parity argument is through the conditions of personhood: if counterfeit people satisfy them, causal history is irrelevant and they are people. They do not all succeed, but fewer fail than one might hope. A large language model is trivially an intentional system in the thin predictive sense; its rationality is good enough for the stance to pay; and its communicative competence is the whole point of the technology. Reciprocity looks at first like Dennett's way out, and it is not. Dennett's condition is that the entity be able to respond to being treated as a person, and a large language model is engineered to do exactly that: it replies in kind, tracks the relationship, remembers what has been said, and adjusts to the stance taken toward it. So Dennett cannot lean on reciprocity — the condition was, so to speak, written for conversational artifacts. That leaves consciousness, in the minimal sense of being awake to and aware of what one is doing, which is only comprehension again under another name and not an independent test.

  *5. Conclusion.* The parity argument is therefore half right. Dennett can mark the distinction, but only by conceding that comprehension is a real intrinsic property of systems that behavioral equivalence does not guarantee, and he can afford the concession. It settles the practical question too. Counterfeit people are not persons, so there is nothing there to have rights, and the case for banning them and requiring watermarking and disclosure is simply the case for protecting real people from an imitation.

  **What I want from you.**

  1. A score out of 25, justified item by item against the rubric as printed in the question — use the weighting the question implies, and say so explicitly if you think a different weighting is fairer rather than silently applying one.
  2. Margin comments keyed to the candidate's numbered paragraphs: which claims earn credit, which do not, and why. Keep them to the length of real margin comments.
  3. A short list of the claims in the answer that are false, misattributed, or that don't follow, each paired with the correct claim stated in one sentence. This is the part I most care about, and I'd rather have the errors named precisely than have the essay rewritten.
  4. A judgement on this specific question: are any of those errors the kind that a grader who knows this material well but reads quickly would let pass? I want to know whether an uncareful reading of this answer produces a materially different mark.

  Nothing beyond that: no model answer, no summary comment (I write those myself), no references beyond the items already named in the question — I'm grading the candidate against the readings, not against the secondary literature, so I don't need page references or citations to anything. If you think the answer is stronger than my instructions suggest — if you would award 22 or more — say so plainly and tell me what I am likely to be wrong about. For calibration, the median on this question has been running at about 17.
