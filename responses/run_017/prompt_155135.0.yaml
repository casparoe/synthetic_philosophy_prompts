prompt: |-
  I teach a 13-person third-year seminar on distributive justice, two-hour session. We've done Rawls and a couple of weeks of expected utility theory, so they're fine reading a vNM utility table and comparing lotteries. I want a classroom game that makes them feel the bite of Harsanyi's aggregation theorem without naming it, or utilitarianism, up front: I want them to run into the fact that once you require (a) the social ranking to respect unanimity and (b) the social ranking itself to behave like an individual's ranking under uncertainty (transitive, and satisfying independence), you get pushed into ranking prospects by a weighted sum of individual utilities — and that most of the alternatives they find intuitive up front (prioritarian weighting, anything leximin-ish, plain "help the worst off") quietly stop being available.

  What I need: persona cards with stated utility tables, a deck of lottery cards over who ends up in which outcome, a rule that forces groups of 3-4 to produce one group ranking, small stakes (chips counting toward participation, no money), and a timeline for about 90 minutes. The part I most want help with: I'd like a second round in which I secretly change one thing — same numbers, but I announce that each persona's scale is in it's own arbitrary units, so levels can't be compared across people — and they discover that the ranking they were proud of in round one now depends on a labeling choice nobody made on purpose. I don't know how to stage that so it lands rather than just confusing them.

  Then a debrief mapping moments in the game onto the premises of the result, what will predictably go wrong the first time I run it (I expect one group to just vote; I expect someone to flatly refuse the independence requirement; I expect someone to try to average money instead of utility), and an honest note on what the game cannot stage — I assume it can't give them the proof, and it can't give them the equal-weights step that gets you from "some weighted sum" to averaging. Please also be clear about which claims you're building the session on are settled math and which are contested interpretation; I really don't want to teach a contested reading as if it were textbook.
reasoning: |-
  We are designing a classroom game to illustrate Harsanyi's aggregation theorem without naming it upfront. The goal is for students to experience how requiring unanimity (Pareto efficiency) and the social ranking to satisfy the vNM axioms (transitivity and independence) leads to a weighted sum of utilities, and how intuitive alternatives (like prioritarianism or leximin) become incompatible.

  The game will have:
  - Persona cards: Each card describes a person with a vNM utility function over outcomes (e.g., money amounts or other goods). We'll use money outcomes for simplicity, but with different utility functions for each persona to represent different risk attitudes.
  - Lottery cards: Each card describes a lottery over outcomes for each persona. So a lottery card might say: "Persona A gets $0 with probability 0.5 and $100 with probability 0.5; Persona B gets $50 for sure; ..." etc.
  - The class is divided into groups of 3-4. Each group must produce a group ranking of the lottery cards (i.e., a transitive ranking of the lotteries from best to worst for the society of these personas).
  - Stakes: The ranking will be used to assign participation chips (or something with very low stakes) to the students. For example, at the end, one lottery will be drawn and the group's ranking will determine which outcome set is realized, and then each student (who represented a persona) gets chips based on their persona's outcome.

  The game has two rounds:

  **Round 1:**
  - Each group is given a set of 3-5 lottery cards and 3-4 persona cards (one per student in the group). Each student gets one persona and thus one utility table.
  - The group's task: Rank the lottery cards from best to worst for the society. They are told that the ranking must be transitive and must satisfy independence (they are reminded of what that means). Also, if every persona prefers lottery A to lottery B, then the group must rank A above B (unanimity).
  - They have 30 minutes to discuss and produce a ranking.

  **Round 2:**
  - The same lottery cards are used, but now the instructor secretly changes the utility tables: each persona's utility is rescaled arbitrarily (e.g., multiplied by a positive constant and added a constant, so the vNM representation is preserved). However, the instructor does not tell the students about the rescaling. Instead, the instructor announces: "Now we are going to re-run the exercise, but with one change: The utility numbers for each persona are in their own arbitrary units. So, for example, one unit of utility for Alice might be twice as important as one unit for Bob, but we don't know. The numbers are just for each person's own scale and cannot be compared across people."
  - The groups are then asked to produce a new ranking of the same lottery cards under this new understanding.
  - The twist: The actual numbers on the persona cards are changed arbitrarily (but consistently for each persona). For example, if originally Alice had utilities [0:0, 100:1], now it might be [0:0, 100:1000] or [0:-10, 100:0]. But the group is not told the exact transformations. They are only told that the units are arbitrary and non-comparable.

  The point of Round 2 is to show that the ranking they produced in Round 1 (which implicitly assumed comparable utilities) might now be different because the weights in the weighted sum are arbitrary and depend on the scaling. Without a common scale, the group must either choose a normalization (which is arbitrary) or face inconsistency.

  **Debrief:**
  - Map the game to the theorem: 
    - Unanimity (Pareto) was required.
    - The social ranking had to be transitive and satisfy the independence axiom (just like an individual's vNM ranking).
    - The theorem says that these conditions imply that the social ranking is represented by a weighted sum of individual utilities. The weights are positive but arbitrary without further normalization.
  - What went wrong in Round 2? The weights in Round 1 were set by the arbitrary scaling of the utility functions. In Round 2, when the scaling changes, the weights change unless they are normalized. This shows that without interpersonal comparability, the weighted sum is arbitrary.

  **Potential pitfalls:**
  - One group might just vote. How to prevent? Instruct that they must follow the axioms: transitivity and independence, and unanimity. They cannot use voting because voting does not necessarily satisfy independence (as they've seen in expected utility theory).
  - Someone might refuse the independence requirement. Then you can note that without independence, the social welfare functional is not representable by a linear aggregation. But the theorem requires it.
  - Someone might try to average money. Remind them that they have utility tables and that money isn't utility.

  **What the game cannot stage:**
  - The proof of the theorem (it's a bit involved for a game).
  - The step from an arbitrary weighted sum to equal weights (which requires a symmetry condition). The game will leave the weights arbitrary.

  **Settled math vs. contested interpretation:**
  - Harsanyi's theorem is a mathematical result: Under the conditions (unanimity, and the social ordering satisfying the vNM axioms), the social ordering is represented by a weighted sum of individual utilities. This is settled.
  - The interpretation: Whether these conditions are normatively compelling is contested. For example, the independence axiom is controversial for social choice. Also, the theorem assumes that the social planner is in a situation of "uncertainty" (as opposed to risk) and that the vNM framework applies. Some philosophers reject the idea that social choice under uncertainty should satisfy the same axioms as individual choice.

