answer: |-
  Below is a detailed game design meeting your specifications: a 90-minute classroom activity that implicitly teaches Harsanyi's aggregation theorem through experiential learning. The game avoids naming utilitarianism or the theorem upfront, focuses on the tension between intuition and formal requirements, and includes the "arbitrary units" twist. 

  ---

  ### **Game Overview**
  **Core Insight**: When groups must rank social lotteries while satisfying (a) **unanimity** (if everyone prefers A > B, society must rank A > B) and (b) **vNM rationality** (transitivity + independence axiom for social rankings), they are forced into a weighted utilitarian rule. Intuitive alternatives (e.g., prioritarianism, leximin) violate these conditions.  
  **Twist**: Round 2 reveals that the ranking depends on arbitrary interpersonal utility scaling, making weights subjective.

  **Key Concepts Staged**:
  - Unanimity (Pareto efficiency) and vNM rationality as constraints.
  - The inevitability of *some* weighted sum under these constraints.
  - The fragility of weights without interpersonal comparability.

  **What the Game Cannot Stage**:
  - **The proof**: Students experience the *implications* of the theorem, not its formal derivation.
  - **Equal weights**: The game shows aggregation requires weights, but doesn't derive equality (which requires symmetry assumptions).
  - **Contested interpretations**: Debrief clarifies which parts are settled math (the theorem) vs. contested (normative appeal of axioms).

  ---

  ### **Materials**  
  1. **Persona Cards** (4 unique personas per group, 1 per student):  
     Each card lists a name, risk attitude, and vNM utility table over outcomes ($0, $50, $100). **Utilities are designed to be intuitively comparable in Round 1** (e.g., similar scales).  
     **Example**:  
     - *Alex (Risk Neutral)*: $0 → 0, $50 → 50, $100 → 100.  
     - *Briar (Risk Averse)*: $0 → 0, $50 → 70, $100 → 100.  
     - *Charlie (Risk Seeking)*: $0 → 0, $50 → 30, $100 → 100.  
     - *Dakota (Highly Risk Averse)*: $0 → 0, $50 → 80, $100 → 100.  

  2. **Lottery Cards** (4 per group):  
     Each describes a social lottery—a prospect for all 4 personas. Design forces trade-offs (no unanimity).  
     **Example Lotteries**:  
     - **Lottery A**: Alex($100), Briar($0), Charlie($50), Dakota($50).  
     - **Lottery B**: Alex($50), Briar($50), Charlie($0), Dakota($100).  
     - **Lottery C**: All get 50% chance of $0/$100.  
     - **Lottery D**: Alex($0), Briar($100), Charlie($100), Dakota($0).  

  3. **Group Ranking Sheet**: Forces transitive rankings + space for justifications.  

  4. **Stakes**: Poker chips (e.g., 1 chip = 0.5% participation bonus). A random lottery is played post-game; students receive chips based on their persona’s outcome.

  ---

  ### **Timeline (90 Minutes)**  
  #### **Round 1: Intuitive Aggregation (30 min)**  
  1. **Setup (5 min)**:  
     - Divide into 3–4 groups (3–4 students each).  
     - Assign personas randomly (1 per student).  
     - **Instructions**:  
       > *"Rank these 4 lotteries from best to worst for your group. Your ranking must be transitive and satisfy two rules:*  
       > 1. Unanimity: *If every persona prefers Lottery X to Y, your group must rank X > Y.*  
       > 2. Independence: *If your group ranks X > Y, it must also rank [pX + (1-p)Z] > [pY + (1-p)Z] for any lottery Z and probability p."*  

  2. **Group Work (25 min)**:  
     - Groups discuss and rank lotteries. **Anticipated dynamics**:  
       - Most groups will **add utilities** (summing columns), leading to a B > C > A > D ranking (using example utilities).  
       - Alternatives: Some may try averaging money (correctable), voting (violates independence), or "help worst-off" (violates transitivity/independence).  
     - **Instructor Circulates**: Gently enforce axioms. E.g., if a group uses voting:  
       > *"Suppose your group votes B > A. But if I mix both with a 50-50 coin flip (independence), does your ranking hold?"*  

  #### **Round 2: The Scaling Twist (30 min)**  
  1. **Secret Change (5 min)**:  
     - Collect Round 1 persona cards. Redistribute **new cards** with identical preferences but **arbitrarily rescaled utilities** (affine transformations). Announce:  
       > *"New info: Utility units are persona-specific and non-comparable. For example, 1 util for Alex ≠ 1 util for Briar. They’re like different currencies."*  
     - **Rescaling Examples**:  
       - Alex: Original × 2 → $0→0, $50→100, $100→**200**.  
       - Briar: Original + 0 → unchanged ($50→**70**).  
       - Charlie: Original × 0.5 → $50→**15**, $100→**50**.  
       - Dakota: Original × 3 → $50→**240**, $100→**300**.  

  2. **Group Work (25 min)**:  
     - Same lotteries, same rules. **Key twist**: Summing utilities now reverses rankings.  
       - Round 1 sum: B(220) > C(200) > A(190) > D(170).  
       - Round 2 sum: A(395) > B(370) > C(325) > D(310) → **A and B swap!**  
     - **Anticipated Conflict**:  
       - Groups using sums get confused by reversals.  
       - Some may try "normalizing" utilities (e.g., set max=100), but weights remain arbitrary.  
       - **Critical moment**: Groups realize their Round 1 ranking relied on accidental interpersonal comparisons.  

  #### **Debrief (30 min)**  
  Guide discussion while mapping experiences to the theorem:  
  1. **What happened?**  
     - *"In Round 1, how did your group rank lotteries? Did adding utilities feel natural?"*  
     - *"In Round 2, what broke? Why couldn’t you reuse your old method?"*  

  2. **Connect to Axioms**:  
     - *"Unanimity forced you to agree when all personas aligned. But what about conflicts?"*  
     - *"Independence forced consistency in complex choices. Did it feel restrictive?"*  
     - *Result: These axioms require society to mimic vNM rationality → social utility = weighted sum of individual utilities* (Harsanyi’s theorem).  

  3. **The Twist Explained**:  
     - *"Round 2 showed weights depend on utility scales. If units aren’t comparable, weights are arbitrary—like converting yen to euros without exchange rates."*  

  4. **What About Alternatives?**  
     - *"Did anyone try to 'help the worst-off'? Why did it fail?"*  
       - Leximin: Violates independence (e.g., mixing lotteries can change who is worst-off).  
       - Prioritarianism: Nonlinear weights violate vNM linearity.  
     - *"Averaging money? Ignores risk attitudes—violates unanimity if personas value money differently."*  

  5. **Settled vs. Contested**:  
     - **Settled Math**: Harsanyi’s theorem (under axioms, aggregation *must* be linear).  
     - **Contested**:  
       - Should social choices satisfy vNM rationality? (e.g., Diamond’s criticism: fairness under uncertainty).  
       - Is interpersonal comparability possible? (Arrow’s impossibility assumes not; utilitarians argue yes).  

  ---

  ### **Instructor Notes**  
  **Predictable Challenges**:  
  - **Groups "cheat" by voting**: Enforce independence with a coin-flip example.  
  - **Refuse independence**: Ask: *"If you prefer X to Y, shouldn’t you prefer a 1% chance of X over 1% of Y, mixed with Z?"*  
  - **Average money**: Point to a persona card: *"Briar faces the same money as Alex but gets less utility. Ignoring this violates unanimity."*  

  **Why This Works**:  
  - Students *feel* the tension between intuition and axioms.  
  - Round 2’s reversal dramatizes how weights rely on implicit scaling.  
  - Low stakes (chips) reduce performance anxiety.  

  **Limitations**:  
  - Cannot derive equal weights (requires symmetry not staged here).  
  - Cannot prove the theorem (focuses on intuition).  
  - Risk attitudes may overshadow distributional ethics—emphasize this in debrief.  

  **Preparation Tips**:  
  - Pre-calculate utilities for all lotteries to quickly diagnose group reasoning.  
  - Print persona/lottery cards for reusability.  
  - For large seminars, assign observer roles to report group dynamics.  

  This design creates an "aha" moment: students discover that seemingly neutral axioms force them into weighted utilitarianism, and that their weights were arbitrary all along. The debrief links this to Harsanyi while acknowledging contested terrain.
