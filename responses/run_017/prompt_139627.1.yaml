  Radical Anti-Probabilism (verdict: false) gets wrecked by computational verification cases. Ideal Agent Certainty (verdict: true but irrelevant) is tautological but useless for humans. Logical Omniscience (verdict: absurd) is immediately falsified by any open problem. 

