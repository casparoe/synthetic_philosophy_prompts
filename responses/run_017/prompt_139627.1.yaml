answer: |-
  ### Readings of "You Can't Be Uncertain About Mathematics", with Verdicts  
  *(Ordered trivial → wild; applied to your cases & departmental uses)*  

  1. **Mathematical Platonism (Non-Epistemic)**  
     *Claim:* Mathematical truths exist independently of knowledge; uncertainty is about *our access*, not the facts.  
     *Verdict:* **Trivial/irrelevant** (doesn’t address epistemic states).  
     *Your cases:* Compatible with all. Doesn’t constrain confidence.  

  2. **Necessity ≠ Certainty Conflation**  
     *Claim:* Mathematical necessity implies we *must* be certain once truth is known.  
     *Verdict:* **Confused** (conflates modal and epistemic concepts).  
     *Your cases:* Falsified by residual doubt post-proof (Case 1) and independent statements (Case 4).  

  3. **Binary Epistemic Access (Dogmatic)**  
     *Claim:* For any sentence S, you either know S is true/false (via proof) or have *no rational attitude* toward S.  
     *Verdict:* **False** (ignores partial evidence).  
     *Your cases:* Invalidates pre-proof confidence (Case 2, 5), preprint disagreement (Case 3).  

  4. **Proof-Erasure Certainty**  
     *Claim:* After personally verifying a proof, residual doubt is *always irrational*.  
     *Verdict:* **False** (ignores human fallibility & complexity).  
     *Your cases:* Condemns residual doubt in Case 1 as irrational; you reject this.  

  5. **Meta-Confidence Reading**  
     *Claim:* "I’m 80% sure S is true" really means "I’m 80% sure a proof of S exists" (not about S’s truth).  
     *Verdict:* **Defensible but incomplete** (reduces to empirical prediction).  
     *Your cases:* Accepts Case 2/5 but misdescribes confidence (you’re *also* tracking mathematical evidence).  
     *Dept. use:* Vindicates "only about proofs" but weakens the slogan.  

  6. **Radical Anti-Probabilism**  
     *Claim:* It is *never rational* to assign credences to unproven mathematical statements.  
     *Verdict:* **False** (contradicts successful heuristic-guided research).  
     *Your cases:* Forces you to abandon 70% confidence (Case 2), computational evidence (Case 5).  

  7. **Ideal Agent Certainty**  
     *Claim:* A logically omniscient agent would have credence 0 or 1 in every sentence; humans should approximate this.  
     *Verdict:* **True but irrelevant** (humans aren’t ideal agents).  
     *Your cases:* Demands you reject all confidence <1 (Cases 2,3,4,5) – you rightly resist.  

  8. **Logical Omniscience Mandate**  
     *Claim:* Rationality requires knowing all logical consequences of your knowledge *now*.  
     *Verdict:* **Absurd** (implies certainty in all provable statements).  
     *Your cases:* Falsified by any unproven conjecture (Cases 2,3,5).  

  9. **Logical Induction (Your Friend’s View)**  
     *Claim:* Rational credences must be *computably coherent*: no efficient Dutch book against you, converging to 1 (0) if S is (dis)provable.  
     *Verdict:* **Replacement, not precisification** (accepts uncertainty + adds constraints).  
     *Your cases:* *Vindicates all your confidences* (if coherent). Case 4 (independence) gets credence 0.5 if symmetric.  
     *Slogan verdict:* **Buries the slogan** by formalizing rational uncertainty.  

  ---

  ### Departmental Uses vs. Required Readings  
  - **"No betting on conjectures"**: Requires **Radical Anti-Probabilism** (false) or **Meta-Confidence** (defensible but undermines slogan’s force).  
  - **"No residual doubt post-proof"**: Requires **Proof-Erasure Certainty** (false) or **Ideal Agent** (irrelevant).  
  - **"Don’t rely on conjectures"**: Requires **Binary Epistemic Access** (false) or **Radical Anti-Probabilism** (false).  

  ---

  ### Verdicts on Your Cases  
  | Case | Readings forcing abandonment of confidence | Readings permitting confidence |
  |------|--------------------------------------------|--------------------------------|
  | 1 (Certain post-proof) | Proof-Erasure (if doubt exists) | **All except 3,6,8** |
  | 2 (70% pre-proof) | **3,4,6,7,8** | **1,2,5,9 (Logical Induction)** |
  | 3 (Postdoc disagreement) | **3,6,7,8** | **1,2,4,5,9** |
  | 4 (Independent statement) | 3,7,8 | **1,2,5,6,9 (credence 0.5)** |
  | 5 (Heuristic + comp. evidence) | **3,6,7,8** | **1,2,4,5,9** |

  **Key Tension**: Defensible readings (e.g., Logical Induction) permit rational uncertainty; readings forbidding it (3,6,7,8) force abandonment of intuitive, research-guiding confidences you value. The slogan’s common uses rely on indefensible readings. **Logical Induction buries the slogan while justifying your practice.**
