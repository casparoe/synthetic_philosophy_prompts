prompt: |-
  Hey — I got roped onto the board of the housing co-op I live in about four months ago, and right now we're having what feels like the dumbest possible fight: whether to put up a printed schedule of fines for people who leave the shared workshop and bike room in a mess. I have this nagging feeling that the whole argument is missing something, but I can't put a name on it, which makes it very hard to argue in a meeting.

  Here's the pattern I keep seeing — I've now noticed it three times. Case one, our own bike room: for years it was fine. Not spotless, but people mostly racked their bikes, swept up, and the two or three guys who used it most ran the place quietly — if someone left a bike in the middle of the floor for a week they'd get a friendly-but-not-friendly word. Nobody was ever charged anything. Last year the board put in a twenty-dollar fine for bikes left in the walkway, with a sign and a form to fill out. And now nobody leaves bikes in the walkway, but the room is objectively worse. People do exactly what the sign says and nothing more: tools from the shared bench stay out, nobody sweeps, the pump got stolen and nobody said anything. And the two or three guys who used to enforce things have completely stopped, because saying something now feels like reporting someone to an authority instead of just being a person who minds. Case two: my brother's volunteer trail crew got a sponsor offering a small cash bonus for the crew logging the most trail miles. Miles went up, quality went down, and nobody does the jobs that don't have a number attached anymore. Case three: a neighbourhood tool library near my old place added an app where you check tools in and out. Same shape of thing. The thing is, in every case the people didn't stop caring — if anything they talk about the shared thing more than they used to. What changed is what they do about it, and who is allowed to say something. And the bit that actually worries me: I think this is one-way. If we tear the sign down next year, I don't think the old arrangement comes back, because the people who moved in during the fine era never learned it and the old enforcers got out of the habit.

  So: does this have a name? Not the general 'people game whatever you measure' thing — a friend keeps saying that's Goodhart's law, but as I understand it that's about the number becoming unreliable for the people reading it, whereas what I'm describing is about the act changing meaning for the person doing it, about the informal enforcement dying rather than just being crowded out, and about it being irreversible. Someone else said moral hazard, but nobody's risk exposure is changing what they do here as far as I can tell. I don't want a label I can drop in a board meeting; I want to know whether the three things I'm describing are really one thing or three, what the nearest established concepts are and exactly how my cases differ from each, whether the irreversibility part has its own literature (something about norms needing to be transmitted to newcomers?), and if there's no established concept that fits, I'd like a proposed name with a definition that says what would and wouldn't count as an instance. Please also settle the boundary cases: is it the same phenomenon when the new rule is a reward rather than a fine, is it the same thing when the outcome is better on the measured dimension and worse on every other one, and is it still this phenomenon if the old informal norm was never actually healthy — say it was really just two guys being territorial?
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're on the board of a housing co-op and are stuck in a debate about implementing fines for mess in shared spaces. They've noticed a pattern where introducing formal rules like fines or rewards backfires. Specifically, in their bike room, after fines were introduced, people followed the letter of the law but stopped doing other maintenance tasks. The informal enforcers withdrew because speaking up felt like reporting to authority. The user mentioned similar cases with a trail crew bonus and a tool library app. They feel this change is irreversible and want to understand the underlying concept.

  First, I need to identify if there's an established term for this phenomenon. They mentioned Goodhart's Law and moral hazard but feel those don't fit. Goodhart's is about metrics becoming unreliable when targeted, but here the issue is the degradation of social norms and intrinsic motivation. Moral hazard involves risk-taking due to protection, which doesn't apply here. 

  Looking at behavioral science, intrinsic motivation being crowded out by extrinsic rewards comes to mind. Deci and Ryan's Self-Determination Theory explains how external incentives can undermine intrinsic motivation. The fines might have shifted residents' perception from a communal responsibility to a transactional one. 

  Then there's the loss of informal enforcement. The community members who previously managed norms stopped because the formal system made their actions feel authoritarian. Ostrom's work on polycentric governance highlights how local, informal systems often manage resources better than top-down rules. The fines replaced a polycentric approach with a monocentric one, disrupting the social fabric.

  The irreversibility is crucial. Once formal systems are introduced, they can't easily revert because new members don't learn the old norms, and trust is eroded. This relates to institutional economics, where path dependence and norm erosion create a new equilibrium. The existing members lose the habit of self-policing, and newcomers never experience the old system.

  The user also asked boundary cases: rewards vs. fines, measured vs. unmeasured outcomes, and unhealthy old norms. The core mechanism—crowding out intrinsic motivation and disrupting informal systems—applies to both rewards and fines. Even if the old norm was problematic, replacing it with formal rules might still cause collateral damage to other cooperative behaviors. 

  The user needs a clear framework to present to the board. They want to avoid simplistic labels and understand the nuances. Providing terms like "Motivation Crowding Effect" and "Formalization Trap" with definitions will help them articulate the issue. Emphasizing the irreversible collapse of community governance structures is key. They need actionable alternatives, like reinvesting in social infrastructure instead of fines, to restore cooperative norms.
answer: |-
  This phenomenon absolutely has established names and a rich theoretical backbone—it's a perfect collision of multiple concepts in behavioral economics, social psychology, and institutional design. Your intuition about it being irreversible and fundamentally altering social dynamics is spot-on. Let's break it down:

  ### Core Concepts & Terminology
  1.  **Motivation Crowding Effect (or Crowding Out):**
      *   **What it is:** Formal incentives (fines, rewards, rules) can "crowd out" intrinsic motivation (doing something because you value it) or prosocial motivation (doing it for the community). The act shifts from being "the right thing to do" to being a transaction ("I pay $20 to leave my bike blocking the walkway" or "I get $X for trail miles, so screw drainage ditches").
      *   **How it fits your cases:**
          *   Sweeping up, putting tools away, reporting theft: These were intrinsically motivated acts of stewardship. The fine shifted the *meaning* of using the space to a purely contractual relationship defined *only* by the rule. Acts beyond the rule's scope lose their perceived value or relevance.
          *   Trail crew: The bonus shifted focus from holistic trail maintenance (intrinsic/prosocial) to maximizing the measured metric (extrinsic).
          *   Tool library: The app formalized what was likely a trust-based system, replacing communal responsibility with a transactional record.
      *   **Key Distinction from Goodhart's Law:** Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure") is about the *distortion of measurement and information*. **Motivation Crowding** is about the *distortion of individual motivation and the social meaning of actions*. Your cases are primarily about Crowding Out.

  2.  **Erosion of Informal Norms & Enforcement:**
      *   **What it is:** Formal rules undermine the legitimacy and effectiveness of informal social control. People who previously felt empowered to gently enforce norms ("nagging" about a bike) now feel their actions are either redundant (there's a rule!) or illegitimate ("am I being a cop?"). The rule signals that *only* the formal authority should handle this.
      *   **How it fits your cases:**
          *   The "two or three guys" stopped caring because their informal role was delegitimized. Their "friendly-but-not-friendly word" went from being community stewardship to potentially being "reporting" or interfering with a formal process.
          *   The sense of shared ownership ("*our* bike room") diminishes; it becomes "*the association's* bike room with rules."

  3.  **The Formalization Trap / Institutional Displacement:**
      *   **What it is:** Introducing formal governance mechanisms (fines, apps, strict rules) to solve a problem can inadvertently displace or destroy the pre-existing, often more effective, informal governance structures and social capital. Once displaced, these informal systems are difficult or impossible to rebuild.
      *   **How it fits your cases + Irreversibility:**
          *   This explains the **one-way door** you identified perfectly. The old norm relied on:
              *   **Established relationships:** Trust and expectations built over time.
              *   **Shared understanding:** An unwritten "constitution" of how things work here.
              *   **Informal enforcement capacity:** People willing and *socially sanctioned* to nudge others.
          *   The formal rule:
              *   **Disrupts transmission:** Newcomers learn the rule, not the underlying norm or the *spirit* of cooperation.
              *   **Breaks habits:** Old enforcers lose the habit and the social context that made it work.
              *   **Erodes trust:** The rule implies distrust, which becomes self-fulfilling. Rebuilding the informal system requires rebuilding trust and shared understanding from scratch, which is vastly harder than maintaining it. This is strongly supported by work on **common-pool resource management** (e.g., Elinor Ostrom) and **social capital theory** (e.g., Robert Putnam).

  ### Proposed Overarching Name: The "Formalization-Induced Social Capital Erosion" (FISCE) Effect
  Since no single term perfectly captures *all* aspects (crowding, norm erosion, irreversibility, displacement), a synthesized name helps:
  *   **Definition:** The phenomenon whereby the introduction of formal rules, incentives, or monitoring mechanisms to govern a shared resource or cooperative endeavor inadvertently:
      1.  Crowds out intrinsic/prosocial motivation for holistic stewardship.
      2.  Undermines the legitimacy and effectiveness of informal social norms and enforcement.
      3.  Displaces pre-existing, often more resilient, informal governance structures.
      4.  Creates path-dependent, often irreversible, damage to the social capital necessary for effective self-organization and cooperation, particularly hindering norm transmission to newcomers.
  *   **Would Count:** Cases where formalization replaces a functioning (even if imperfect) informal system in a cooperative/shared-resource context, leading to the degradation of unmeasured cooperative behaviors and a loss of informal enforcement capacity, with lasting effects.
  *   **Would NOT Count:**
      *   Introducing rules where *no* functional informal system existed (e.g., stopping rampant theft where peer pressure was absent).
      *   Formalization that *supplements* without undermining informal norms (rare, but possible with careful design).
      *   Situations where the measured outcome improves *without* collateral damage to cooperation.

  ### Settling Your Boundary Cases
  1.  **Reward vs. Fine:** **Same phenomenon.** The core mechanism is the introduction of an *extrinsic incentive* (positive or negative) that reframes the relationship to the task/resource as transactional. The trail crew bonus case demonstrates this perfectly. Both fines and rewards can crowd out intrinsic motivation and distort focus.
  2.  **Better on Measured, Worse on Others:** **Archetypal FISCE.** This is the hallmark pattern: the formal rule "works" on its narrow target (bikes not blocking walkway, trail miles up) but degrades the broader, unmeasured cooperative ecosystem (cleanliness, tool care, maintenance quality, theft reporting, informal enforcement). This collateral damage is central to the effect.
  3.  **Unhealthy Old Norm (e.g., Territoriality):** **Different, but FISCE can still apply partially.** If the old norm was dysfunctional or exclusionary (e.g., two guys *hoarding* tools or berating others), formalization *might* be necessary. However:
      *   FISCE warns that formalization will likely *still* damage *other*, potentially healthy, aspects of cooperation and intrinsic motivation (e.g., willingness to sweep, report theft, help newcomers).
      *   The solution isn't *just* formalization; it requires *also* building *healthy* social capital and norms to replace both the toxicity *and* the functions the territoriality might have inadvertently provided (e.g., tool maintenance). You risk swapping one problem for another set of problems described by FISCE.
      *   The irreversibility aspect might be less severe if the old norm was widely resented, but the crowding effect on *new* cooperative impulses would still be a risk.

  ### What to Argue in the Board Meeting
  Don't just drop names. Explain the *mechanism*:

  1.  **"The fine might stop bikes blocking the walkway, but it risks making the *overall health of the workshop* worse, not better. We've seen this pattern before."** (Reference your bike room case).
  2.  **"It changes *why* people act. Instead of cleaning up because they care about the space and their neighbors, they'll only follow the letter of the rule. Sweeping the floor, putting away tools that aren't theirs, reporting broken equipment – those things become 'someone else's problem'."** (Motivation Crowding).
  3.  **"It shuts down the quiet, friendly reminders that actually keep a community space working. People like [mention the old enforcers, if appropriate] will stop stepping up because speaking up suddenly feels like being a cop instead of a good neighbor."** (Erosion of Informal Enforcement).
  4.  **"And crucially, this change might be permanent. Once we teach people that the only rules are the printed fines, and that community enforcement is dead, it's incredibly hard to bring that spirit back, especially for new members who never knew it."** (Irreversibility / FISCE).
  5.  **"Instead of fines, let's invest in rebuilding the community spirit: a shared workshop clean-up day with pizza, a visible 'kudos board' for people spotted keeping it tidy, or a simple shared agreement developed *by the users* about expectations. We need to reinforce *why* this space matters to *us*, not just threaten punishment."**

  You're observing a profound truth about how cooperation works. Your instinct that the fine schedule is likely counterproductive and destructive to the social fabric of your co-op is well-founded. Good luck in the meeting!
