  Okay, the user is a PhD candidate in political science studying informal enforcement and local ceasefires in civil conflicts. They've encountered a recurring pattern in their interviews where cooperation breaks down due to an unintentional failure to act, leading to mutual retaliation with both sides feeling blameless. They're struggling to find an existing term for this phenomenon and want to know if it's covered in literature or if they need to coin a new concept.

  First, I need to understand the core issue: It's about unintended defection due to incapacity (not choice), misinterpreted as intentional, leading to retaliation. Both parties see themselves as victims, so no reconciliation mechanisms activate. The user mentions it's similar to the security dilemma but involves inaction rather than defensive actions. They also reference noise in repeated prisoner's dilemma, but that's about accidental defections, whereas here it's inability to act.

  Breaking it down: The key elements are:
  1. Unintentional failure to cooperate (external factors like bridge out, dead battery).
  2. Misattribution of intent by the other party.
  3. Retaliation based on that misattribution.
  4. Both sides view themselves as wronged, so no apologies or repairs.
  5. Explanations are seen as cheap talk since defectors would say the same.

  The user wants to know if there's an established concept. From what I recall, Schelling's work on commitment and coordination might touch on this. Also, Kreps's work on trust and reputation. The security dilemma involves actions being misinterpreted, but here it's inaction. The noise literature deals with mistakes (choosing wrong action), whereas this is about inability to act.

  Looking at attribution theory: in psychology, the fundamental attribution error is when people attribute others' actions to disposition rather than situation. But the user says this is about compounding over rounds, not a single judgment. So maybe a dynamic attribution error?

  Signaling and cheap talk: The explanation "I couldn't" isn't credible because defectors would say the same. So there's a signaling failure where inability isn't verifiable. This ties to Fearon's work on rationalist explanations for war, where private information and commitment problems lead to conflict.

  Another angle: coordination failures. If both parties could have verified the issue but didn't, that's different from when verification is impossible. The user asks if partial fault or cheap verification changes the case. That might affect the classification.

  Possible terms: "Unintended defection spiral" or "attributional cascade." But "cascade" might imply sequential events. "Mutual misattribution trap" combines attribution theory with the spiral dynamic. Or "cooperation collapse due to non-verifiable incapacity."

  The user also asks about predictors. Does a long history of cooperation make parties more resilient (trust buffer) or more fragile (higher expectations)? Literature on relational contracts suggests that trust builds resilience, but high expectations could lead to harsher judgments. Vulnerability factors: communication barriers, lack of verification mechanisms, high stakes.

  Practical implications: The user might need to propose mechanisms like third-party verification or redundant communication channels. In their departmental example, better communication during emergencies could have helped.

  So, synthesizing: The phenomenon doesn't have a single established term. It's a hybrid of signaling failure, attribution error, and repeated game dynamics. The best fit is to frame it as a subtype of the security dilemma or as a signaling failure with attributional compounding. Coining "Mutual Misattribution Trap" covers the psychological and strategic aspects. Defining it clearly, including the necessity of incapacity being non-verifiable. Cases with partial fault might still count if the core misattribution occurs. If verification was possible but not used, it's a different failure mode (negligence rather than inherent trap).

  The user's deeper need: They want to contribute to theory by formalizing this dynamic, so providing a clear definition and boundaries is crucial. They also need to identify vulnerability factors for their empirical work, so discussing predictors like communication infrastructure or relationship history is important.
answer: |-
  Based on your detailed description and the literature gaps you've identified, this phenomenon doesn't have a single, universally established term in political science, IR, or game theory. However, it sits at the intersection of several well-studied concepts, and coining a precise term for this specific "failure mode" is both justified and valuable. Here's the carving:

  1.  **Core Mechanism & Why Existing Concepts Don't Fully Fit:**
      *   **Trigger:** Non-verifiable incapacity (not choice) to cooperate ("couldn't").
      *   **Misperception:** Attribution of dispositional intent ("wouldn't") due to the fundamental attribution error (psychology) and the inherent ambiguity of inaction (strategic interaction).
      *   **Response:** Retaliation based on perceived defection.
      *   **Spiral:** Mutual retaliation fueled by genuine reciprocal belief in being wronged.
      *   **Repair Failure:** Clean ledgers prevent standard repair mechanisms (contrition, apology) because neither side believes *they* acted wrongly. Explanations are non-credible ("cheap talk").
      *   **Security Dilemma (Close but different):** SD involves *actions* (arms build-up, fortification) intended defensively but perceived offensively. Your case involves *inaction* (failure to perform a cooperative act) perceived as hostile *action* (defection). The defensive action in SD is chosen; the incapacity here is exogenous (though perception matters).
      *   **Noise in RPD (Close but different):** Noise literature (e.g., Nowak & Sigmund "Contrite TFT", Bendor et al. on noise tolerance) focuses on *accidental defections* (choosing "defect" by mistake) or execution errors. Your case is about *inability to cooperate*, not a wrong choice. "Contrition" relies on admitting fault; here, no fault is admitted because none was intended or possible. The "clean ledger" aspect is key.
      *   **Signalling Failure / Cheap Talk:** This is central. The statement "I couldn't" lacks credibility precisely because it's costless for a true defector to say. The incapacity is unobservable or unverifiable by the other party. This makes it a specific type of signalling failure where the signal of incapacity is inherently non-credible.
      *   **Fundamental Attribution Error (FAE):** FAE explains the initial misattribution. However, standard FAE is often studied as a static bias. Your case highlights its *dynamic, recursive consequences* in repeated strategic interaction – the misattribution triggers retaliation, which triggers counter-misattribution, etc.

  2.  **The Carving: A Distinct Failure Mode**
      This is best understood as a **specific sub-type of cooperation breakdown arising from non-verifiable incapacity in repeated games, leading to a mutual misattribution spiral and repair mechanism failure.** Its unique preconditions are:
      *   Repeated interaction with conditional cooperation.
      *   An exogenous event causing genuine, temporary incapacity to cooperate for one party.
      *   Non-observability/non-verifiability of the cause of incapacity by the other party.
      *   The incapacity manifests as an *absence of the expected cooperative action* (not a positive harmful action).
      *   The inability to signal incapacity credibly ("cheap talk" problem).
      *   Strong dispositional attribution tendencies (FAE) by the observing party.

  3.  **Proposed Term & Definition:**
      *   **Term:** **Mutual Misattribution Trap (MMT)** or **Attributional Spiral of Non-Performance (ASNP)** or **Unverifiable Incapacity Spiral (UIS)**.
      *   **Definition:** A dynamic process in repeated strategic interaction where:
          1.  Party A experiences genuine, exogenous, and non-verifiable incapacity to perform an expected cooperative action, resulting in non-performance.
          2.  Party B, unable to distinguish incapacity from deliberate defection, attributes the non-performance to hostile intent and retaliates.
          3.  Party A, perceiving retaliation as an unprovoked defection, attributes hostile intent to Party B and retaliates in turn.
          4.  Both parties maintain a belief in their own blamelessness ("clean ledger"), preventing standard reconciliation mechanisms.
          5.  Attempts by Party A to explain the incapacity are non-credible ("cheap talk"), failing to halt the spiral.
          6.  Cooperation collapses into sustained mutual defection.

  4.  **Boundaries & What Counts:**
      *   **Core Case:** Non-performance due to purely exogenous, unforeseeable factors (bridge collapse, sudden illness, equipment failure *beyond reasonable control*), non-verifiable by B, leading to the spiral. *This is the paradigmatic case.*
      *   **Partial Fault:** If Party A bears *some* responsibility for the incapacity (e.g., failing to maintain the radio battery, taking a risky route knowing checkpoints are slow), does it still count? **Yes, but with nuance.** The core mechanism (non-verifiable incapacity misattributed, clean ledgers preventing repair) still operates *if Party A genuinely believes the incapacity was unavoidable or not their fault in a defection-relevant sense*. If Party A *knows* they were negligent and *could* have prevented it, their internal ledger isn't truly "clean" regarding the *cause*, though it might still be clean regarding *intent to defect*. This weakens the "clean ledger" aspect but the misattribution spiral is still central.
      *   **Cheap Verification:** If Party B *could* have easily verified the incapacity (e.g., sending a scout to the bridge, checking a public outage report) but negligently *didn't bother*, does it count? **This is a related but distinct failure mode.** The core *mechanism* triggering the spiral (misattribution of non-performance) is the same. However, the *cause* of the breakdown shifts partly to Party B's negligence in verification, complicating the "clean ledger" for B. The essential element of *initial non-performance due to incapacity* and its *misinterpretation* remains. You might call this a "Negligent Verification Failure" subtype or antecedent of the MMT/UIS.
      *   **Doesn't Count:** Situations where:
          *   The incapacity *is* verifiable (spiral likely doesn't start).
          *   The failure is due to an *accidental choice* to defect (e.g., pressing the wrong button, sending to the wrong address) – this falls under standard "noise" in RPD.
          *   One party admits fault/contrition early enough to trigger repair (no sustained clean ledgers).
          *   The non-performance is due to a *deliberate strategic choice* disguised as incapacity (this is standard deception/defection).

  5.  **Predictors of Survival vs. Spiral:**
      *   **Protective Factors (More likely to survive):**
          *   **Prior History & Relationship Capital:** A long, robust history of clean cooperation builds "relationship-specific capital" and trust. This makes Party B more likely to *initially* give Party A the benefit of the doubt ("Maybe something happened?"), delaying or mitigating retaliation. It provides a buffer.
          *   **Communication Redundancy & Verification Channels:** Pre-existing, reliable *alternative* channels for communication when primary ones fail. *Verifiable* signals of incapacity (e.g., trusted third-party confirmation, observable evidence).
          *   **"Forgiving" Strategies with Memory:** Strategies like Generous Tit-for-Tat (forgive defections with a small probability) or Contrite TFT *if* incapacity can be framed as a defection (less ideal fit). Strategies with longer memory that look beyond the last move.
          *   **Lower Stakes / Higher Future Discount Rate:** If the stakes of the single interaction are lower relative to the value of the future relationship, B might be more cautious about retaliating. A higher discount rate (valuing the future more) also promotes caution.
          *   **Shared Understanding of Risks:** Explicit or implicit awareness between parties about the *types* of exogenous risks that could cause non-performance (e.g., "that bridge is unreliable," "radios fail often here").
      *   **Vulnerability Factors (More likely to spiral):**
          *   **High Stakes / Low Future Discount Rate:** High immediate costs of perceived defection and/or low value placed on future cooperation incentivizes swift retaliation.
          *   **Fragile or Nascent Cooperation:** New relationships or those with a history of tension have less trust capital to draw upon. Expectations might be *higher* precisely because cooperation is new and precious, making any lapse feel like betrayal.
          *   **High Environmental Uncertainty/Instability:** Contexts where exogenous shocks (infrastructure collapse, communication blackouts, unpredictable violence) are common increase the *likelihood* of non-verifiable incapacity occurring.
          *   **Lack of Redundant Channels/Verification:** Dependence on a single point of failure for communication/coordination.
          *   **Pre-existing Mistrust/Antagonism:** Dispositional attribution is already the default.
          *   **High Expectations from Past Performance:** While a long *good* history is protective, a long history of *flawless* performance can paradoxically make *any* lapse seem more suspicious ("They *never* miss, so this *must* be deliberate").

  **Conclusion & Recommendation:**

  You've identified a distinct and important failure mode in cooperation under anarchy, particularly relevant to fragile contexts like ceasefires. While drawing on concepts like the Security Dilemma (misperception), Noise in RPD (breakdown), Signalling (non-credible explanations), and Attribution Theory (FAE), the specific constellation – **non-verifiable incapacity triggering a mutual misattribution spiral sustained by clean ledgers preventing repair** – warrants its own conceptualization.

  **Define it clearly as the Mutual Misattribution Trap (MMT) or Unverifiable Incapacity Spiral (UIS).** Emphasize the core elements: genuine incapacity, non-verifiability, misattribution of intent, mutual retaliation, clean ledgers, cheap talk failure. Explicitly distinguish it from accidental defection (noise) and the Security Dilemma (defensive actions misperceived).

  This framework allows you to analyze your cases systematically, explore the predictors you outlined (history, verification capacity, stakes), and contribute significantly to understanding how cooperation collapses even when actors subjectively believe they are acting in good faith. Your departmental anecdote is a perfect microcosm of the dynamic and highlights its real-world relevance beyond high-conflict zones.
