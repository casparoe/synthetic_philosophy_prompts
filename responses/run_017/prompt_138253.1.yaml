prompt: |-
  I've belonged to a small giving circle for about six years — we meet quarterly, compare notes on where our money seems to do the most good, and try not to be insufferable about it — and over that time I've noticed a pattern in the way our discussions go that I can't put a name to. An argument last night with an old friend from university (she reads moral philosophy for fun; I don't) left me more convinced that there is something real here but no closer to naming it. Two cases. First: one of our members gives roughly a third of his income and lives well inside his means, and the group's attention has shifted to smaller things — how his pension is invested, whether he should move from salaried work to earning-to-give, whether his two weeks of leave would do more good spent volunteering. Each of these asks is small, collectively far smaller than what he already does, and yet the thing that seems to have changed the atmosphere in the room is not the money at all: there is now no point at which he is permitted to say enough. Second, and this is what made my friend dig in: compare an aid worker who spends a decade in hard postings at seventy hours a week with someone comfortably off who is required only to keep a running lookout, all day and every day, for the cheapest available improvement — switch a brand, sign a petition, flag a charity — at a total cost of perhaps an hour a week. The second life costs vastly less and is, to me, the more objectionable of the two; it is also the one where morality has more to say about more of your minutes. My friend thinks I have the ordering backwards, which is fair, but I don't think that's where the disagreement actually lives.

  The labels she tried, and why I think each misses. She started with the standard demandingness objection: consequentialism asks too much. But my second case is designed so that the less objectionable option is the one that asks more, so if what bothers me were magnitude the cases should come out the other way round. She then said it is just the integrity complaint — that I want room for my own projects and relationships, and consequentialism alienates me from them. That doesn't fit either: plenty of people in my circle have made effective giving and impact-mindedness into their projects and their friendships, and the complaint I have in mind would apply to them just as much; and it isn't about having a life of one's own, since the aid worker's life is entirely absorbed by her work and doesn't bother me in the same way. Her last try was that it is really the disappearance of the supererogatory, everything collapsing into duty. That is closer, but it seems to me to locate the problem in the status of the actions, whereas what I am circling is something about the structure of the requirement over a life: whether a theory ever declares some region of your choices to be none of morality's business, so that within it you may act for any reason at all and leave no moral remainder. A costly duty that you discharge and then clock off from seems to me to leave that remainder-free region intact; a cheap duty that is always live does not.

  So my own attempt at the carving is this: costliness (how much a theory may take from you in total) is one dimension, and pervasiveness (how much of your deliberative space it occupies, how many of your choices it makes morally loaded, whether it ever puts you off duty) is another, and they can come apart in both directions. What I want to know is whether this second dimension has been carved out under some description in the literature, and how exactly it relates to the neighbouring things — the demandingness objection proper, the integrity complaint, the loss of the supererogatory, satisficing or scalar versions of consequentialism, and the agent-centred prerogative — with an account, for each, of the precise place where it stops matching my two cases and which fits best. Please don't just hand me a name: I want the shape of the thing, what it is not, and where its edges are. In particular: (i) if there is an established concept here, does it actually discriminate between theories, or do ordinary non-consequentialist views with open-ended duties of beneficence turn out to be pervasive too, which would mean either that I have misdescribed it or that the demandingness debate has been aimed at the wrong target; (ii) is a cheap but pervasive requirement perhaps just costly in a currency I am not counting — attention, deliberation, decision fatigue — in which case my two dimensions collapse back into one, and how would we tell; and (iii) relatedly, a rule with an explicit budget (give this share, then you are off duty, no further questions asked) seems to me both less pervasive and, at least among the people I know, more productive of actual giving, which makes me suspect the complaint may not be about the agent's well-being at all but about the kind of authority the requirement claims. If nothing established fits, coin a term, define it tightly, and give me two or three boundary cases that decide what falls in and what falls out.
reasoning: |-
  Okay, let me start by unpacking the user's query. They describe a giving circle where discussions have revealed a pattern they can't name. The core issue is how moral demands occupy deliberative space rather than just resource cost. They present two cases: one where a generous member faces endless small demands beyond his significant contributions, and another comparing an aid worker's intense but bounded sacrifice with a comfortable person's constant low-cost moral vigilance. 

  The user's friend suggested existing philosophical concepts—demandingness, integrity, loss of supererogatory—but none fit perfectly. The user argues that the problem isn't the magnitude of sacrifice but the pervasiveness: morality never "clocks off," leaving no deliberative space free from moral scrutiny. They want to know if this distinction exists in literature, how it relates to adjacent concepts, and whether non-consequentialist duties might also be pervasive.

  Hmm, the user's framing is sophisticated. They're not just asking for labels but for conceptual boundaries. Key questions emerge: (i) Does this pervasiveness critique apply beyond consequentialism? (ii) Could "cheap" demands still be costly in cognitive terms? (iii) Might explicit budgetary rules resolve the issue by limiting moral authority rather than reducing burden?

  First, I recall Bernard Williams' integrity objection—but the user already dismissed it because their circle members *integrate* giving into their lives willingly. The supererogatory point is closer but focuses on action status rather than lifelong deliberative intrusion. 

  Then it hits me: the user's "pervasiveness" mirrors what some call "morality's creeping jurisdiction" or "deliberative colonization." Murphy's compliance burden gets at cognitive costs but doesn't fully capture the temporal relentlessness. The aid worker case is crucial here—high cost but bounded, so psychologically sustainable. 

  For (i), yes, even Kantian imperfect duties can become pervasive if internalized as constant vigilance. This suggests the critique isn't theory-specific but about how duties are operationalized. For (ii), cognitive costs are real but distinct: one could have low-cost-yet-pervasive demands (e.g., daily charity app checks) that drain agency without resource impact. For (iii), budgetary rules create "moral holidays"—explicit off-duty zones that preserve autonomy. 

  The term "deliberative enclosure" feels right: morality fencing off ever more choice-space. Boundary cases: A) A billionaire giving 99% but obsessing over the last 1% → enclosed. B) Someone ignoring dire need to play chess → not enclosed if theory permits discretion. C) Utilitarians who batch decisions → avoids enclosure via satisficing. 

  User's insight is profound: we've fixated on "how much" when the deeper tyranny is "how often." The real enemy isn't large sacrifices but infinite small claims on moral attention.
answer: |-
  Your intuition captures a genuine and under-discussed dimension of moral demandingness. The distinction between **costliness** (total resources extracted) and **pervasiveness** (relentless occupation of deliberative space) is philosophically significant, though not always cleanly separated in the literature. Here's a precise carving:

  ---

  ### **Core Concept: Deliberative Enclosure**
  **Definition:** A moral theory imposes *deliberative enclosure* when it fails to designate any domain of choice as morally neutral, rendering nearly all decisions perpetually subject to moral scrutiny and potential obligation, regardless of the action's cost.  
  **Key Feature:** It eliminates "off-duty" mental states, creating constant low-grade moral liability.

  ### **Boundary Cases & Conceptual Edges**
  1. **IN**: A theory requiring you to check every purchase for fair-trade alternatives, even if the cost difference is trivial.  
     **OUT**: A theory requiring 10% income donation but permitting guilt-free leisure choices otherwise.  
  2. **IN**: Demanding active monitoring of news to spot urgent petitions, turning downtime into moral labor.  
     **OUT**: A duty to donate blood quarterly, with no moral residue between appointments.  
  3. **IN**: A utilitarian rule that every unproductive minute must be spent researching charities.  
     **OUT**: A deontological rule forbidding lying but permitting any leisure activity that doesn’t harm others.  

  ---

  ### **Relation to Existing Concepts**
  | Concept               | How It Relates to Deliberative Enclosure                                                                 | Where It Diverges                                  |
  |-----------------------|----------------------------------------------------------------------------------------------------------|----------------------------------------------------|
  | **Demandingness (Cost)** | Both address "burden," but demandingness focuses on *resource depletion* (time/money/energy).            | Fails your cases: high-cost aid work is *less* enclosed than low-cost vigilance. |
  | **Integrity Objection**  | Both involve alienation, but integrity concerns *identity* (losing "your" projects).                     | Your circle members *integrate* giving—yet enclosure still rankles.              |
  | **Loss of Supererogatory** | Supererogatory marks non-obligatory goodness; enclosure eliminates *neutral* choices, not just heroic ones. | Supererogatory is about action status; enclosure is about *deliberative saturation*. |
  | **Agent-Centered Prerogative** | Prerogatives (e.g., Scheffler) permit self-favoring; enclosure persists even with prerogatives if moral calculus *always applies*. | Prerogatives reduce costliness but not pervasiveness (e.g., "I may skip *this* petition" still requires moral deliberation). |
  | **Satisficing Consequentialism** | Satisficing (e.g., Slote) sets a "good enough" threshold, creating off-duty space *by design*.        | Directly addresses enclosure by permitting moral disengagement post-threshold.   |

  ---

  ### **Addressing Your Specific Queries**
  #### (i) *Does this discriminate between theories?*  
  - **Yes, but subtly.** Consequentialism (especially act-utilitarianism) is *prone* to enclosure by requiring optimal choice in all contexts. However:  
    - **Kantian imperfect duties** (e.g., beneficence) risk enclosure if interpreted as requiring *constant vigilance*.  
    - **Rule-consequentialism** or **satisficing** can *avoid* enclosure by setting fixed rules/budgets.  
    - **Non-consequentialist views** (e.g., Rossian pluralism) with open-ended duties *can* be enclosive if agents internalize maximalist interpretations.  
  **Conclusion:** Enclosure is a *practical consequence* of how duties are framed, not inherent to any theory. Your critique exposes how *any* open-ended duty becomes tyrannical without explicit "off-duty" thresholds.

  #### (ii) *Is pervasiveness just another cost (e.g., cognitive)?*  
  - **No.** While cognitive load is real, enclosure is distinct:  
    - A **high-cost duty** (e.g., aid work) may cause exhaustion but allows *psychological disengagement* when off-shift.  
    - A **low-cost but pervasive duty** (e.g., daily charity checks) imposes chronic attentional drag, colonizing mental space even when inactive.  
  **Test:** If an agent must *repeatedly* suppress moral thoughts during leisure, enclosure exists. Cognitive cost is a symptom, not the essence.

  #### (iii) *Why do explicit budgets "feel" better?*  
  - **Authority, not cost.** A fixed budget (e.g., "Give 10%, then done") limits morality’s *jurisdiction*. Enclosure arises when morality claims authority over *all* choices, implying:  
    - Your time/attention is *always-on loan* to the moral cause.  
    - Any non-optimized choice is a *failing*.  
    - **Result:** Even cheap demands feel intrusive because they symbolize morality’s unlimited claim on the self.  

  ---

  ### **Term Proposal: Deliberative Enclosure**
  **Why this term?**  
  - "Enclosure" evokes historical land grabs—morality fencing off mental commons.  
  - "Deliberative" centers the target: your cognitive autonomy.  

  **Defining Features:**  
  1. **No moral holidays:** No domain is designated obligation-free.  
  2. **Micro-obligations:** Small asks accumulate into chronic burden.  
  3. **Invisible weight:** Disproportionate psychological toll relative to resource cost.  

  **Counterpart Concept:** **Deliberative Sanctuaries**—explicitly protected zones (e.g., hobbies, friendships) where moral evaluation is suspended.  

  ---

  ### **Why This Fits Your Cases**
  - **Your generous member:** His pension/leave debates symbolize enclosure—no sanctuary, so minor choices become moral tests.  
  - **The comfortable lookout:** Her life is enclosed; the aid worker’s is not (despite higher cost).  
  - **Your friend’s objection:** She prioritizes *outcome*, but enclosure concerns *moral psychology*—how theory shapes lived experience.  

  **In essence:** Deliberative enclosure is the colonization of everyday choice by moral audit. Its tyranny lies not in what it takes, but in never letting you rest.
