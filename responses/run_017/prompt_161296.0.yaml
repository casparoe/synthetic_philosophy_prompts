prompt: |-
  Our decision-theory reading group — six of us, meeting on Sunday afternoons in the living room of a group house in Berkeley, working slowly through a battered used copy of Metamagical Themas that someone found at a library sale — has assigned each member a one-page "position dump" to circulate before we present, and mine keeps coming back from the others with marginal notes I can't answer. Two of them in particular get under my skin: one says superrationality is just evidential decision theory with an unjustified correlation parameter smuggled in, the other says it is functional decision theory before it had a formalism. I think both of those are partly unfair, but I can't say exactly why, and I suspect the reason I can't is that my own package doesn't hang together. So here it is, as flatly as I can state it: (a) in a one-shot monetary prisoner's dilemma against an exact computational copy of myself — same code, same inputs, running on another server, no causal contact — I cooperate; (b) I also cooperate against a stranger who is merely a careful, unhurried reasoner and not a copy of me at all, because I take the point of superrationality to be that correct reasoning on a symmetric problem has a single answer, not that my neurons have to be type-identical to yours; (c) elsewhere I am a causalist — I think evidential decision theory gives the wrong verdict in lesion-style cases where the correlation is perfectly real but not causal, and I want a theory that tracks causal structure; (d) I read Hofstadter's gloss about there really being only one decision being made as a metaphor, and I do not think my pressing a button causes, or logically fixes, the output of a separate agent; (e) I accept the Platonia verdict, send the telegram with probability one twentieth, and I am comfortable there precisely because the superrational answer and plain self-interested best-response coincide (maximizing p times (1−p) to the nineteenth gives p = 1/20) — my discomfort only begins where the two come apart; (f) for a degraded copy, one that matches my action with probability r and otherwise flips a fair coin, I cooperate only above a threshold — the last time I did the arithmetic with Hofstadter's dollar payoffs I got something a bit over 0.2, so I cooperate against a copy that tracks me a third of the time and defect against one that tracks me a tenth of the time; (g) I abstain in national elections and do not think superrationality obliges me to vote, even though I cooperate in a million-player one-shot dilemma where my causal footprint is equally negligible; (h) if, after the fact, the experimenter credibly tells me my copy has already defected, I defect too, and take the dollar.

  What I want from you is an audit rather than a lecture. Go through these and tell me which pairs are actually in tension and how badly, ordered by severity rather than flagged uniformly; for each real tension, say what would have to give and what giving it would cost me downstream. Some of these I expect to be fine — my guess is that (h) only looks like a betrayal of the correlation idea and dissolves once you notice the information set has changed, and that (g) is defensible because the electorate is not a set of agents facing my problem symmetrically — but I'd rather you tell me if that's wishful, and I'd rather you tell me if a pair I haven't noticed is the load-bearing problem. In particular I want to know whether (b) can survive (c) and (d) at all, whether the graded threshold in (f) is compatible with the categorical "one right answer" reasoning in (b) or whether it quietly turns me into the evidentialist my friend accuses me of being, and whether (d)'s demotion of the single-decision idea pulls the rug out from (e) and (b) while leaving (a) standing. Finally: give me the single revision that would clean up the most, name the one commitment you'd call a freebie I could drop at no philosophical cost, and tell me which item I am most likely to be simply wrong about.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're in a decision theory reading group, and their position dump on superrationality is getting challenging feedback. Specifically, two critiques: one saying superrationality is just EDT with a correlation parameter, and the other calling it FDT without formalism. The user feels these are unfair but can't articulate why, suspecting their own stance has inconsistencies.

  The user lists their positions (a) through (h). I need to audit these for tensions, rank them by severity, and suggest fixes. Key points: cooperation in symmetric PDs, even with non-copies (b), being causalist otherwise (c), rejecting Hofstadter's single decision metaphor (d), Platonia resolution (e), graded thresholds for degraded copies (f), not voting (g), and defecting if copy defected (h).

  First, major tensions. The big one is between (b) and (c). (b) says cooperation with any careful reasoner in symmetric problems, based on reasoning alone. But (c) commits to causal decision theory elsewhere, rejecting EDT in lesion cases. How does (b) avoid being evidential? The user claims correct reasoning in symmetric problems has a single answer, but without causal links, this seems like EDT thinking. That's a severe tension.

  Next, (b) and (f). (b) implies a universal cooperation with symmetrical reasoners, but (f) has a threshold for degraded copies. Why the threshold if reasoning symmetry is key? The user might be conflating logical dependence with probabilistic correlation. Also, (d) rejects Hofstadter's single decision idea, yet (e) relies on it for Platonia. If there's no logical necessity tying decisions together, why cooperate in Platonia? That undermines (e) and (b).

  Then, (g) not voting vs. cooperating in large PDs. The user argues the electorate isn't symmetrical, but is that valid? In a million-player PD, each player is similar, but in elections, voters aren't necessarily identical reasoners. Though, if they're rational, maybe symmetry applies. But the user might be inconsistent here if they cooperate in large PDs but not vote. Need to check if the lack of symmetry in elections is a solid defense.

  Also, (h) defecting if the copy defected. The user thinks it's due to changed information, which makes sense under CDT. But if they're superrational in symmetric cases, why does new evidence change the decision? Superrationality might imply that the decision is fixed by reasoning, not evidence. But in CDT, evidence updates matter. That conflict might be resolvable if superrationality is conditional on initial symmetry.

  Freebies? (a) cooperating with a copy is uncontroversial in FDT-like frameworks. (h) defecting post-info is standard CDT. But (d) rejecting Hofstadter's metaphor might be a freebie to drop—it doesn't add much and causes issues with (e).

  Likely wrong about (b). Assuming all careful reasoners will reach the same decision in symmetric problems is optimistic. Game theory shows multiple equilibria possible. So (b) might be unsustainable without assuming identical reasoning, which the user denies.

  Biggest cleanup? Dropping (b) and focusing on logical ties with copies. That resolves the clash with (c) and (f). The threshold in (f) becomes consistent under probabilistic dependence. Platonia (e) works if agents are linked by the problem structure. Voting (g) remains defensible as non-symmetric. 

  Need to check if the user can hold both causalist views and superrationality. By limiting superrationality to cases with logical dependence (like copies), they can maintain CDT elsewhere. But extending it to non-copies via reasoning symmetry introduces evidential elements. The user must choose: either embrace EDT for symmetries or restrict superrationality to logical dependencies. Since they prefer CDT, dropping (b) is the way to go.
answer: |-
  Here's an audit of your position, structured by tension severity, with recommendations. The core issue is that your commitment to causal decision theory (CDT) in (c) fundamentally clashes with your extension of superrationality to non-copies in (b), while other tensions stem from this or from ambiguities in "symmetric reasoning." Let's break it down:

  ### **Severe Tensions (Potentially Fatal)**
  1. **`(b) vs. (c)`** (Cooperation with non-copies vs. Causalist commitment)  
     - **Conflict:** (b) requires cooperation with *any* "careful, unhurried reasoner" in a symmetric PD, even without causal/logical ties. But (c) demands that your decision theory *ignores* non-causal correlations (e.g., lesion cases). In a PD with a stranger, the correlation between your actions is purely evidential (you both reason similarly), not causal. Cooperating here is textbook Evidential Decision Theory (EDT) behavior—you're acting on the correlation to improve the likely outcome.  
     - **Cost of Holding Both:** You cannot simultaneously reject EDT's handling of non-causal correlations *and* endorse cooperation in symmetric non-copy PDs. This is the deepest flaw in your package.  
     - **Resolution Required:** Abandon either (b) (limit superrationality to logical copies) or (c) (accept EDT for symmetric problems). Keeping (c) forces you to defect against non-copies, as CDT would prescribe.

  2. **`(b) vs. (f)`** (Universality of symmetric reasoning vs. Graded thresholds)  
     - **Conflict:** (b) claims "correct reasoning on a symmetric problem has a single answer," implying all rational agents (copies or not) should cooperate. But (f) introduces a *threshold* for cooperation with degraded copies based on correlation strength (r > ~0.2). This contradicts (b): if symmetry implies one correct answer, why does a "10% copy" not deserve cooperation? Your threshold treats rationality as probabilistic, not categorical.  
     - **Underlying Issue:** (f) smuggles in evidential thinking. Your calculation maximizes expected payoff *based on correlation*, which is EDT-like. This clashes with (b)'s appeal to abstract symmetry.  
     - **Resolution Required:** Drop (b)'s universality claim. If you keep thresholds in (f), you must accept that "superrationality" depends on degree of correlation, not just symmetry.

  ### **Significant Tensions (Threaten Coherence)**
  3. **`(d) vs. (e)`** (Rejecting single-decision metaphor vs. Platonia comfort)  
     - **Conflict:** (d) denies that your decision "causes/fixes" your copy's action. But (e) endorses the Platonia solution because "superrational answer and self-interest coincide." The coincidence only holds *if* all 20 agents are functionally identical and know it—effectively acting as one decision-unit. If you truly reject the single-decision metaphor (d), Platonia reduces to a coordination game where defecting dominates (since your telegram can't influence others).  
     - **Why It Matters:** (e) relies on the *logic* of Hofstadter's single-mind intuition, even as (d) dismisses its metaphysics. Without that logic, your comfort in Platonia vanishes.  
     - **Resolution:** Soften (d). Accept that logical coupling (not causation) can bind decisions in symmetric problems. This doesn't require mysticism—it's a game-theoretic constraint.

  4. **`(b/d) vs. (g)`** (Symmetric reasoning vs. Not voting)  
     - **Conflict:** You cooperate in a million-player PD but abstain from voting. You argue elections lack symmetry, but this is shaky: a national election *is* symmetric (all voters face identical incentives), and your causal impotence (1 in millions) mirrors the PD. If "correct reasoning has one answer" (b), why shouldn't all rational voters participate?  
     - **Defensibility?** Partially. Elections lack *interdependence*: your vote doesn't affect others' actions, while in the PD, mutual cooperation requires *joint* action. But this highlights that (b) overextends—superrationality needs interdependence, not just symmetry.  
     - **Resolution:** Reframe (b) to require mutual awareness of symmetry (absent in elections). This saves (g) but weakens (b).

  ### **Manageable Tensions (Resolvable with Clarification)**
  5. **`(a/b) vs. (h)`** (Cooperating with copies vs. Defecting if copy defected)  
     - **Apparent Conflict:** (h) feels like abandoning superrationality when you learn your copy defected.  
     - **Resolution:** Your instinct is correct: with new information (copy defected), the symmetry is broken. CDT (or even FDT) says to defect now. This doesn't undermine initial cooperation; it's a different node in the decision tree. **Low severity.**

  6. **`(c) vs. (f)`** (Causalist vs. Graded thresholds)  
     - **Conflict:** (f) uses correlation (r) to guide decisions, while (c) rejects non-causal correlations.  
     - **Resolution:** If you reframe (f) as about logical dependence (degraded copies are "noisy" versions of you), it can fit CDT/FDT. The correlation isn't acausal; it stems from shared code. **Salvageable if (f) is copy-specific.**

  ---

  ### **Your Requests Addressed**
  - **Which revision cleans up the most?** **Drop (b)**. It's the core fault line. Limiting superrationality to *copies or logically coupled agents* resolves tensions with (c), (f), and (g). You keep cooperation in (a), (e), and (f) without EDT baggage.  
  - **Freebie to drop at no cost:** **Drop (d)'s hardline stance**. Accepting that logical (not causal) ties can bind decisions in (a)/(e) costs nothing philosophically and saves Platonia.  
  - **Item you're most likely wrong about:** **(b)**. Extending superrationality to non-copy strangers is unsupported and contradicts your causalist stance. Game theory shows no unique "rational" answer in symmetric PDs: defection is Nash, and cooperation requires *additional* assumptions (e.g., shared knowledge of rationality and symmetry).  

  ### **Summary: The Load-Bearing Problem**
  Your package collapses if you insist on **(b)** while holding **(c)**. The graded threshold in **(f)** and voting abstention in **(g)** are symptoms: they reveal that your "symmetric reasoning" principle in (b) is either untenable (if universal) or needs redefinition (if limited to interdependent agents). **By dropping (b) and restricting superrationality to logically coupled agents (copies, Platonia players), you align with FDT and preserve most intuitions without EDT contamination.** This lets you keep:  
  - (a)/(e): Cooperation with copies/Platonia via logical ties.  
  - (c): CDT for lesion cases/acausal correlations.  
  - (f): Thresholds for degraded copies as a function of logical dependence.  
  - (g): No voting, as voters aren't logically coupled.  
  - (h): Defecting post-evidence, as symmetry is broken.  

  This leaves only one corpse: the hope that unhurried strangers will cooperate with you in a one-shot PD. But that hope never had sound footing—empirically or theoretically.
