prompt: |-
  hey — I'm taking an Enlightenment moral philosophy seminar this term and we're on Adam Smith's impartial spectator right now, and I can't work out what rule my professor is actually running. Every class she hands us a made-up case, we vote, then she tells us her verdict. So far:

  - Guy finds a wallet, returns it anonymously, nobody ever finds out, he feels a quiet calm satisfaction about it afterwards. Her verdict: the spectator approves.
  - In a town where everyone, even fully informed, thinks honor requires it, a man shoots a rival over a pretty trivial insult. Her verdict: disapproved.
  - A parent runs into a burning building and pulls out their own kid rather than two other kids, same effort either way. Her verdict: not disapproved — partiality is fine here.
  - A guy reads a detailed report on a famine, feels a flicker of concern, sends nothing, goes back to his day. Her verdict: disapproved, but only mildly, and mainly for the failure of attention rather than for the outcome.
  - Someone makes a big public donation mostly because he loves being seen as generous. Her verdict: the action passes, the agent doesn't fully — the spectator withholds something.

  I think at least three rules fit all five, and they split on the case she's giving us Friday. There's now an app half the campus uses, Spectator: you describe what you're about to do, and it returns an approval score, trained by averaging millions of people's gut reactions to cases after they've been given full information. Friday's case: Marla is a midlevel health bureaucrat who quietly shifts a budget line so an unglamorous program gets funded — best estimate is about two hundred statistical lives saved, in another country, five years out. Nobody ever finds out, there's no identifiable kid in a well photo, and Marla's actual motive is just that she ran the numbers and the numbers said do it; she feels no fellow-feeling for anyone. Spectator scores her at basically zero, because informed reactions to statistical foreign lives five years out are famously flat.

  So: does her spectator approve Marla? Note that on case five she split the verdict three ways, so I want your prediction on each — the action, the agent, and the motive. Then lay out the candidate rules you think fit her first five verdicts, what each one predicts about Marla, which you'd bet on and why, and the one further case you'd hand her next week to tell the rules apart.

  Keep it under 400 words and lead with the one-sentence verdict. Don't bother quoting Smith at me, I've got the book — I just want the rule.
reasoning: |-
  Okay, the user is in an Enlightenment moral philosophy seminar focusing on Adam Smith's impartial spectator. They're struggling to figure out the rule their professor uses for verdicts on various cases. Each case involves a scenario, a class vote, and the professor's judgment. The user has provided five examples and a new case about Marla, a health bureaucrat. They want predictions for Marla’s case and an analysis of the underlying rules.

  First, I need to recall Adam Smith's concept of the impartial spectator. It's about an imagined observer who is fully informed and unbiased, guiding moral judgments. The professor seems to be evaluating actions, agents, and motives separately, as seen in case five where the action passed but the agent didn't fully.

  Looking at the five cases:  
  1. Returning a wallet anonymously: Approved for quiet satisfaction.  
  2. Honor killing: Disapproved despite societal norms.  
  3. Saving own child: Partiality is acceptable.  
  4. Ignoring famine report: Mild disapproval for lack of attention.  
  5. Donation for reputation: Action okay, agent/motive questionable.  

  The key elements here seem to be motive, outcome, and the agent's emotional engagement. The professor values genuine concern for others (fellow-feeling) and correct intentions, even if outcomes aren't optimal. In case 4, disapproval was for inattention, not the outcome. Case 5 had mixed verdicts based on motive.

  Now for Marla's case: She shifts budget to save statistical lives abroad, motivated by data, not emotion. The app Spectator gives zero approval because people don't react emotionally to distant, statistical lives. The user needs predictions for action, agent, and motive.

  Considering the rules that fit the first five cases:  
  - **Rule A**: Approves if the action aligns with what an impartial spectator would do based on outcomes and motives.  
  - **Rule B**: Focuses on motives (sympathy/concern) and emotional resonance.  
  - **Rule C**: Considers societal norms unless they conflict with universal sympathy.  

  Rule B seems strongest because the professor emphasizes motive and emotional engagement. Case 4 disapproved due to lack of attention (motive), and case 5 criticized the agent for selfish motives. Marla's lack of fellow-feeling might lead to disapproval of her motive and agent, but the action itself might pass since it's objectively beneficial. 

  Prediction for Marla:  
  - **Action**: Approved (saves lives).  
  - **Agent**: Not fully approved (lacks sympathy).  
  - **Motive**: Disapproved (no fellow-feeling).  

  To differentiate the rules, a new case could involve conflicting motives and outcomes. For example, someone helps others but with mixed motives—part genuine, part selfish. Rule A would focus on outcomes, Rule B on the genuine part of the motive, Rule C on societal approval.

  The user's deeper need is likely to understand the professor's framework to excel in the seminar. They might also want to grasp how to apply Smith's theory beyond textbook examples. Providing clear rules and a test case helps them anticipate future verdicts and engage better in class discussions.
answer: |-
  **Verdict:** Action approved, agent not fully approved, motive disapproved.  

  **Candidate Rules:**  
  1. **Rule A (Outcome + Intent):** Approves actions likely to produce net benefit *and* motivated by duty/sympathy. Fits all five (e.g., case 4: inattention shows weak intent).  
  2. **Rule B (Motive-Centric):** Approval hinges on presence of "fellow-feeling" (sympathy/concern) *in the agent*, with outcomes secondary. Fits all five (e.g., case 5: selfish motive taints agent; case 3: partiality rooted in natural sympathy).  
  3. **Rule C (Norm-Adjusted Spectator):** Spectator approves actions *they* would take given full context, rejecting local bias. Fits all five (e.g., case 2: rejects local "honor" norm).  

  **Marla Prediction:**  
  - Rule A: **Approves action** (saves lives), **mixed agent/motive** (dutiful but lacks sympathy).  
  - Rule B: **Disapproves agent/motive** (zero fellow-feeling), **neutral/weak on action** (outcome irrelevant).  
  - Rule C: **Approves action** (spectator, fully informed, would prioritize saving lives).  

  **Bet:** Rule B (Motive-Centric). *Why?* Case 4 hinges on "failure of attention" (motive flaw), case 5 explicitly faults motive, case 1 praises quiet *satisfaction* (implied virtuous feeling). Marla’s cold, statistical motive lacks sympathy – Rule B disapproves agent/motive despite good outcome.  

  **Test Case:**  
  *A person donates a kidney to a stranger solely for social media fame, feels no empathy, but saves a life. Spectator app approves (informed people praise the life saved).*  
  - Rule A: Approves action (net benefit), disapproves agent/motive (selfish).  
  - Rule B: Disapproves agent/motive (no fellow-feeling), neutral/weak on action.  
  - Rule C: Likely approves action (spectator values life saved over motive).
