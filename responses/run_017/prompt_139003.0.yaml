  First I need to understand the dual purpose they've fixed: any theory must simultaneously (1) state when a subject may treat p as a reason for action (epistemic norm of practical reasoning), and (2) account for knowledge attribution speech acts across contexts. This is crucial - they're insisting the theory must serve both masters, not treat them as separate projects. 

  Looking at their 12 phenomena, I notice patterns emerging that can be grouped:
  - Stakes sensitivity (1,4,7,9) concerns how practical consequences affect knowledge ascriptions
  - Modal oddities (3,6) deal with cases where evidence seems insufficient despite truth
  - Asymmetry cases (5,10) introduce moral/prudential cost imbalances
  - Temporal/meta-issues (2,8,11) cover skepticism and diachronic challenges
  - Linguistic constraints (12) address compositional behavior

  The user's demand to adjudicate methodological commitments is particularly sharp. For instance, the "no epistemic loss without mental change" principle often smuggles in traditional invariantism, while demanding non-revisionary semantics privileges folk epistemology. Both might need to be demoted from requirements to theoretical costs.

  The trilemma they suspect feels unavoidable: preserving truth of both low/high-stakes claims while maintaining univocality seems impossible. Each major approach sacrifices one corner:
  - Contextualism gives up univocality 
  - Subject-sensitive invariantism sacrifices low-stakes truth 
  - Relativism abandons high-stakes truth

  For the most exclusionary requirement, I'm considering "action-guiding accessibility" - if objective stakes govern the knowledge norm, but the subject can't access those stakes, the norm becomes unusable. This quietly eliminates naive subject-sensitive invariantism.

  When mapping failures:
  - Contextualism stumbles on memory retention (how can yesterday's "knows" license today's action if standards changed?)
  - Relativism violates disagreement intuitions 
  - Contrastivism struggles with bare knowledge attributions

  The user's depth suggests they're preparing for original work here. Their demand to "convert phenomena into requirements" shows they want operationalized criteria, not just a survey. I'll need to maintain surgical precision while resisting the urge to solve the disputes - their closing request makes clear this is a meta-inquiry about the evaluation framework itself.
answer: |-
  Here is a specification of desiderata for theories of knowledge attribution, structured per your requirements. The dual purpose (action-guidance norm + semantic account of knowledge attributions) is treated as **two distinct jobs for a single theory**, requiring a unified vocabulary to avoid equivocation. The desiderata are divided into **Semantic**, **Epistemic-Normative**, and **Interface** requirements (the latter ensuring coherence between the first two). Phenomena are converted to requirements, merged where redundant, and annotated for status. Key distinctions are preserved, and methodological commitments are flagged.

  ---

  ### **I. Core Desiderata**  
  *(Load-bearing for any theory with your fixed purposes)*  

  1. **Action-Guidance Norm (Epistemic-Normative)**:  
     - *Requirement*: State necessary and sufficient conditions for when a subject S is epistemically permitted to treat proposition p as a reason for acting.  
     - *Source*: Knowledge norm for practical reasoning.  
     - *Non-negotiable*: Failure voids the theory’s practical relevance.  

  2. **Attribution Truth-Conditions (Semantic)**:  
     - *Requirement*: Specify what makes a knowledge attribution ("S knows that p") true or false across contexts of attribution, denial, withholding, and retraction.  
     - *Source*: Purpose of explaining knowledge discourse.  
     - *Non-negotiable*: Core semantic duty.  

  3. **Interface Coherence (Interface)**:  
     - *Requirement*: The conditions licensing S to treat p as a reason must align with the truth-conditions of "S knows that p" *as assessed in contexts relevant to the action*.  
     - *Source*: Avoids divorce between knowledge norm and knowledge attributions.  
     - *Non-negotiable*: Essential for a unified theory.  

  ---

  ### **II. Derived Desiderata from Phenomena**  
  *(Converted to requirements; independent unless merged)*  

  #### **Semantic Requirements**  
  4. **Stakes-Sensitivity (Phenomenon 1, 4, 5, 9)**:  
     - *Requirement*: Explain how practical stakes (attributor’s, subject’s, assessor’s, or objective) affect the truth of knowledge attributions.  
     - *Key Distinction*: Not collapsing "standards shift" vs. "subject’s epistemic position changes".  
     - *Merged*: Baseline stakes pairs, asymmetric costs, leakage, and hidden stakes (specify whose stakes matter: §4, §7).  

  5. **Context-Shift Robustness (Phenomenon 2, 8)**:  
     - *Requirement*: Account for skeptical contexts and diachronic cases (memory retention) without ad hoc mechanisms.  
     - *Key Distinction*: Skeptical shifts vs. ordinary stakes-shifts—same mechanism or different?  

  6. **Embedding Behavior (Phenomenon 12)**:  
     - *Requirement*: Explain how "knows" behaves in embeddings (conditionals, questions, attitude reports) without inconsistency.  
     - *Key Question*: Does the embedding context determine the operative standard?  

  7. **Disagreement & Retraction (Phenomenon 11)**:  
     - *Requirement*: Resolve whether a high-stakes denial ("S doesn’t know p") contradicts a low-stakes attribution ("S knows p").  
     - *Key Distinction*: Genuine disagreement vs. context-relative truth.  

  #### **Epistemic-Normative Requirements**  
  8. **Evidential Thresholds (Phenomenon 3, 6)**:  
     - *Requirement*: Define a minimum evidential threshold for knowledge (if any) below which p cannot be a reason for action, irrespective of stakes.  
     - *Source*: Lottery/statistical cases (§3) and the "floor" (§6).  

  9. **Stakes-Action Alignment (Phenomenon 4, 5, 7, 10)**:  
     - *Requirement*: Specify how error costs (prudential/moral, symmetric/asymmetric) affect S’s license to act on p.  
     - *Key Distinctions*:  
       - Knowing vs. being reasonable to act on p (to avoid decision-theoretic redux).  
       - Prudential vs. moral encroachment (§10): same mechanism or distinct?  
     - *Merged*: Hidden stakes (§4), deferred stakes (§7), asymmetric costs (§5).  

  10. **Ignorance Transparency (Phenomenon 11)**:  
      - *Requirement*: Ensure second-order knowledge attributions ("S knows that they don’t know p") are consistent with the theory’s first-order claims.  

  #### **Interface Requirements**  
  11. **Accessibility (Phenomenon 4, 8)**:  
      - *Requirement*: If knowledge depends on objective stakes (§4, §7), explain how S can access the norm to guide action.  
      - *Source*: Hidden stakes and diachronic cases.  

  12. **Diachronic Action License (Phenomenon 8)**:  
      - *Requirement*: Explain whether knowledge acquired in low-stakes contexts licenses action in high-stakes futures.  

  ---

  ### **III. Key Distinctions a Theory Must Preserve**  
  - **Knowing vs. Reasonable to Act**: Knowledge must not reduce to expected utility.  
  - **Knowing vs. Asserting**: Knowledge norms for action ≠ assertion norms.  
  - **Standards Shift vs. Epistemic Position Shift**: Moving the goalposts ≠ weakening S’s evidence.  
  - **Genuine Disagreement vs. Context-Relativity**: Low/high-stakes speakers may conflict or talk past.  
  - **Knowledge vs. Being Well-Positioned**: Knowledge is binary; evidential support is gradable.  

  ---

  ### **IV. Methodological Commitments: Desiderata or Biases?**  
  - **Knowledge stability (no loss without mental change)**: *Bias*. Favors classical invariantism; not necessary if knowledge is context-relative.  
  - **Factivity (knowledge requires truth)**: *Desideratum*. Core to the concept.  
  - **Speaker verdicts as data**: *Bias*. Ordinary judgments may reflect pragmatic effects, not semantic content.  
  - **Norm usability**: *Desideratum*. A norm S cannot feasibly use fails its purpose.  
  - **Non-revisionary semantics**: *Bias*. Semantic intuitions are contested data; revision may be needed.  
  - **Knowledge supervenes on the knowable**: *Bias*. Rejects "hidden" factors (e.g., objective stakes).  

  ---

  ### **V. The Trilemma and Trade-offs**  
  The core tension is a **trilemma** among:  
  (A) Truth of low-stakes attributions ("S knows p").  
  (B) Truth of high-stakes denials ("S doesn’t know p").  
  (C) Univocality: "Knows" expresses the same relation in both contexts.  

  - **Contextualism** sacrifices (C): "Knows" is context-sensitive; A and B are compatible but not contradictory.  
  - **Subject-Sensitive Invariantism** sacrifices (A): High-stakes denials are always true if stakes are high *for S*; low-stakes attributions are often false.  
  - **Relativism/Assessor-Sensitive** sacrifices (B): Truth is assessor-relative; low-stakes attributions are true when assessed in low-stakes contexts.  
  - **Contrastivism** reconfigures the problem: "S knows p rather than q" avoids A/B conflict but struggles with binary attributions.  

  **This is a genuine trilemma**, not an artifact. The trade-off stems from the dual purpose: Action-guidance pulls toward objective/subject-relative factors (threatening univocality), while attribution semantics pulls toward contextual flexibility (threatening action-norm stability).  

  ---

  ### **VI. Most Exclusionary Requirement**  
  **Accessibility (§11)**: If the norm depends on objective stakes (e.g., catastrophe unknown to S), S cannot use it to guide action. This requirement:  
  - Excludes **objective stakes-based theories** (unless supplemented with a proxy norm).  
  - Is *more exclusionary than stakes-sensitivity or embedding*, as it directly threatens the action-guidance purpose.  
  - Forces a choice: Either (a) stakes must be accessible to S, or (b) the knowledge norm must be usable without knowing whether it is satisfied.  

  ---

  ### **VII. Failures of the Five Approaches**  
  - **Contextualism (attributor’s context)**: Fails **Diachronic Action License (§12)**. If "S knew p yesterday" (low stakes) is true but standards later rise, may forbid acting on p today. Undermines the norm.  
  - **Subject-Sensitive Invariantism (subject’s stakes)**: Fails **Accessibility (§11)** if stakes are objective. Also struggles with **Deferred Stakes (§7)** (e.g., who "subjects" are for stored data).  
  - **Relativism (assessor’s context)**: Fails **Disagreement (§7)**. If a high-stakes assessor calls "S knows p" false and a low-stakes one true, no genuine disagreement occurs—but speakers act as if they disagree.  
  - **Contrastivism (S knows p rather than q)**: Fails **Baseline Attributions (§1, §6)**. Bare "S knows p" is undefined; cannot explain ordinary knowledge reports without supplementation.  
  - **Pragmatic Encroachment Hybrids (prudential/moral stakes)**: Fail **Moral-Prudential Unity (§10)** if moral stakes operate differently. Risk conflating epistemic and ethical norms.  

  **Satisfying all?** A theory must:  
  1. **Decouple the norm and attribution semantics** slightly: The norm could depend on *reasonable assessment of stakes by S*, while attributions track *contextual standards*.  
  2. **Admit relativized truth** for attributions but anchor the norm to the subject’s practical context.  
  3. **Accept moderate revisionism** about "knowledge" in high-stakes theoretical contexts.  
  *No extant theory achieves this without significant costs.*  

  ---  
  This specification prioritizes theoretical adequacy over conservatism, isolates genuine constraints from partisan demands, and identifies the trilemma as central. Use it to test how each theory *earns its keep* on your dual purpose.
