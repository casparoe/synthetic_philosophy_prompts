  4. **Likelihood ratio favors realism: P ≈ 0.6** (Disputed). While realism accommodates prolepsis elegantly, it does not *predict* it better than selectionist accounts (e.g., Lyon 2015), as realism equally permits endless mismatch (the attic problem).  
