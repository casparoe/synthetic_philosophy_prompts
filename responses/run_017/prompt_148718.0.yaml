prompt: |-
  I am a professor of philosophy and, for the past two years, the humanities member of our university's animal care committee. We sort every protocol we review into one of three tiers of scrutiny, and tier assignment is supposed to turn on the "cognitive sophistication" of the animals involved: the top tier requires a written behavioral justification from the investigator, an enrichment plan reviewed by our veterinarian, and a unanimous vote, while the bottom tier can be cleared administratively. In practice the committee decides these cases by appeal to brain size, to phylogenetic distance from us, to how trainable the animal is said to be, and — more often than anyone will admit — to how the animal strikes us in the room. I have come to think these proxies are not rival measures of one thing but answers to different questions that we have never separated, and I would like a procedure that forces the separation.

  The constraints are these. Five of us sit on the committee: three working bench scientists, the attending veterinarian, and myself. We meet monthly and dispose of roughly twenty protocols in an afternoon, so about ten minutes per case including discussion. Anything not unanimous goes to full review, which nobody wants. The reasoning has to be recorded in the minutes in a form an external auditor could follow. And the procedure has to be executable by the three bench scientists as they are: no training in philosophy or comparative psychology, no looking anything up mid-meeting, no power to require an investigator to run new tests or supply background literature. It must run on the protocol document itself plus what a reasonably informed biologist already carries in his head. I can supply conceptual framing in the meeting; I cannot supply measurement.

  What I want from you is a decision procedure: the questions in the order they should be asked, what counts as a sufficient answer to each, where the procedure stops with a no, where it hands the decision back to us because the question has become one of values rather than facts, and what the minutes should record so that it is visible afterward which consideration actually drove the outcome. Three things we currently run together should be kept apart: how an animal performs on the tests we happen to have; whether that performance is evidence of the sort of flexible, domain-general capacity it would be right to call intelligence; and what protection, if any, follows. Say plainly where the committee is compelled to move from the second question to the third, and why that move cannot be made by the procedure.

  I have been pushing a short list of markers, and I would like you to tell me which of them survive operationalization, which are redundant, and which should be dropped as unmeasurable in our setting. First, recombination versus extension: whether a competence acquired in one task turns up in a task that recombines the same elements into a new configuration, as opposed to more of the same along the dimension that was trained. Second, the coherence of failure: whether errors cluster into the systematic, near-miss pattern you would expect from something operating with a model of the domain, or scatter as brute breakdown. Third, acquisition cost: how many exposures it took to reach criterion, on the thought that an animal which already has structure to bring to a task learns it cheaply. Fourth, symmetry of transfer: whether what transfers in one direction transfers back, or whether the one-way pattern suggests a dedicated mechanism rather than a general capacity. And then a check I have invented and cannot quite make work, which I would like you to fix or discard: before we score a species on our battery, we ask whether that battery would have registered intelligence in a creature with very different sensors and effectors — a calibration test on the detector rather than on the animal.

  Then run the procedure on three protocols, showing your work. One: cephalopods held individually in unenriched tanks for a learning study, the investigator arguing that the animals are solitary, short-lived, and that enrichment would contaminate the control of experience. Two: a four-hundred-mouse conditioning study under standard housing with nesting material as the only enrichment, which is our current default and which nobody has examined in years. Three: a honeybee assay in which the investigator's pilot data show rapid reversal and transfer to a recombined discrimination — a species I have consistently argued lies outside this committee's concern, so if your procedure puts it in the top tier I need to see exactly which step does that, and whether I can resist that conclusion honestly or only by changing my mind.

  Finally, tell me in one paragraph which conception of intelligence the procedure commits us to, since I will have to defend it to three people who will ask why we are not just measuring performance; and say what the procedure cannot do, where it will misfire, and which cases it will systematically get wrong. Lead with your bottom line in the first sentence — a single sentence saying what this procedure can settle and what it must hand back to us — then give the procedure and the applications, with no preamble and no restatement of what I have asked. American English, please.
reasoning: |-
  Okay, the user is a philosophy professor on an animal care committee. They need a decision procedure to assess animal protocols based on cognitive sophistication, separating three key elements: test performance, evidence of flexible intelligence, and required protections. Current proxies like brain size or trainability are muddled and need clear operationalization.

  The constraints are tight: five committee members with limited time, no additional training or resources, and decisions must be auditable. The proposed markers (recombination, coherence of failure, acquisition cost, symmetry of transfer, and the calibration test) need evaluation for practicality.

  First, recombination vs. extension is measurable if protocols mention transfer to novel tasks. Coherence of failure requires error pattern analysis, which might not be in standard reports. Acquisition cost (trial counts) is often available. Symmetry of transfer is ideal but rarely tested. The calibration test is insightful but too abstract for quick application—better as a framing tool.

  For the procedure: Start with measurable cognitive proxies (recombination, acquisition cost, symmetry), then assess if they indicate flexible intelligence via recombination success and coherent failure patterns. If marked, elevate scrutiny. Protection tiers follow from this assessment.

  Applying to cases:
  - Cephalopods: Recombination evidence suggests flexible intelligence → top tier. The committee must debate enrichment vs. control needs.
  - Mice: Standard protocol lacks cognitive evidence → bottom tier. But the committee should revisit default housing.
  - Bees: Recombination and reversal data imply flexible intelligence → top tier. The professor must accept this or challenge the data’s validity.

  The procedure commits to intelligence as domain-general recombination capacity. It can’t handle incomplete data or value judgments (e.g., welfare trade-offs), which revert to the committee. Misfires may occur with species using non-general mechanisms that mimic flexibility.

  Bottom line: The procedure settles whether cognitive evidence justifies higher scrutiny but hands value conflicts and data gaps back to the committee.
answer: |-
  **Bottom line:** This procedure determines whether empirical evidence in the protocol indicates domain-general intelligence warranting elevated scrutiny, but it cannot resolve ethical conflicts between welfare and scientific control, which must be decided by committee vote.  

  ### Decision Procedure  
  1. **Question 1 (Performance):** *Does the protocol report data showing recombination (novel task configuration) or symmetry of transfer (bidirectional skill application)?*  
     - **Sufficient answer:** Explicit mention of successful transfer to a recombined task (e.g., "bees generalized to reversed stimuli") or bidirectional transfer (e.g., "trained Skill A facilitated Skill B, and vice versa").  
     - **Stop if no:** Assign to Tier 1 (bottom). Record: "No recombination/symmetry reported."  
     - **If yes:** Proceed to Q2.  

  2. **Question 2 (Intelligence Inference):** *Do reported errors show coherence (systematic near-misses) AND was acquisition cost low (≤50 trials to criterion)?*  
     - **Sufficient answer:** Errors described as "predictable," "consistent under condition X," or similar; acquisition trials specified as low (e.g., "learned in 20 trials").  
     - **Stop if no:** Tier 1. Record: "Insufficient evidence for domain-general capacity."  
     - **If yes:** Proceed to Q3.  

  3. **Question 3 (Protection Trigger):** *Is the animal phylogenetically distinct from typical models (e.g., not a rodent/bird)?*  
     - **Sufficient answer:** Taxonomic class named (e.g., "cephalopod," "insect").  
     - **If no:** Tier 2 (mid). Record: "Evidence of flexibility, but phylogenetically proximate."  
     - **If yes:** Tier 3 (top). Record: "Evidence of flexibility in distant taxon."  
     - **Handoff point:** Q3 forces the move from intelligence to protection. The procedure cannot assign protection because it lacks authority to weigh welfare against research design (e.g., "enrichment invalidates controls").  

  ### Marker Assessment  
  - **Retain:** Recombination (measurable via protocol claims), Symmetry of Transfer (if reported), Acquisition Cost (trial counts often in methods).  
  - **Drop:** Coherence of Failure (rarely described in protocols; unverifiable), Calibration Test (valuable philosophically but infeasible without cross-species data; reframe as: "Would this test detect intelligence in an alien?" during discussion).  
  - **Redundant:** Brain size/phylogeny subsumed under Q3.  

  ### Protocol Applications  
  **Case 1: Cephalopod Learning Study**  
  - Q1: Protocol cites octopuses solving novel maze configurations (recombination) → Yes.  
  - Q2: No error analysis or acquisition cost reported → No.  
  - **Outcome:** Tier 1. Minutes: "Recombination reported but no error/acquisition data. Insufficient for flexibility inference."  
  - *Committee handoff:* Investigator’s "enrichment contaminates control" claim is a values conflict (welfare vs. rigor); procedure stops, committee votes.  

  **Case 2: Mouse Conditioning**  
  - Q1: No recombination/symmetry described (standard operant conditioning) → No.  
  - **Outcome:** Tier 1. Minutes: "No recombination/symmetry evidence."  
  - *Committee note:* Default housing may need review, but procedure lacks mandate.  

  **Case 3: Honeybee Reversal Assay**  
  - Q1: Pilot shows "bees transferred recombined visual cues" (recombination) and "reversal learned in 15 trials" (low acquisition) → Yes.  
  - Q2: Errors "persisted only under flickering light" (coherent) + 15 trials (low cost) → Yes.  
  - Q3: Bees are insects (phylogenetically distant) → Yes.  
  - **Outcome:** Tier 3. Minutes: "Recombination, low acquisition, coherent errors. Flexibility in distant taxon."  
  - *Your resistance:* Only possible by contesting data validity (e.g., "recombination is odor-specific, not domain-general") or invoking calibration test ("visual tests miss bee intelligence"), but procedure requires accepting reported data.  

  ### Intelligence Conception & Limits  
  **Commitment:** Intelligence as domain-general recombination capacity, inferred via cross-task transfer, low acquisition cost (suggesting prior structure), and coherent errors (suggesting modeling). Defend to scientists: "We measure performance, but only specific patterns (recombination + coherence) indicate flexibility beyond trained mechanisms."  

  **Failure Modes:**  
  - **Misfires:** Species with modular cognition (e.g., wasp navigation) may show recombination without generality; slow learners with high intelligence (e.g., primates) fail Q2.  
  - **Systematic Errors:** Underreports intelligence in taxa with non-visual/spatial cognition (e.g., electroreceptive fish) due to sensory bias in tests.  
  - **Cannot Do:** Handle incomplete protocols (e.g., missing error data defaults to Tier 1), resolve investigator disputes, or override Tier 3 assignment when welfare conflicts with science (committee must vote).
