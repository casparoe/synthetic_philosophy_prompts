prompt: |-
  Hi. Bit of context first so you know who you're talking to. I'm a retired hydrologist — thirty-odd years of measuring things in rivers and arguing about whether the numbers meant anything — and over the last couple of years I've got into philosophy of science properly for the first time, mostly out of stubbornness after a friend told me science obviously "gets at the truth". So I've got the rough shape of the Duhem-Quine sort of point, and the worry that the alternatives we're able to list today may not include the one that turns out to be right, and the difference between a theory being true and it just saving the appearances. But I'm self-taught, I can't look anything up, and I don't want you to either: no reading lists, no "as So-and-so argues", no dates or titles I'd have to check. Give me the argument in plain words, as if to someone competent who happens to have no schooling in it. No web access here, so anything you'd need to verify is something you should leave out.

  The reason I need it is practical. I chair the evidence panel of a small catchment trust. Twice a year we recieve fifteen to twenty short proposals from local groups — anglers, parish councils, school groups, a couple of retired types like me — asking for up to about £12,000 for monitoring or restoration work, and they come with whatever data they've already collected. I get roughly twenty-five minutes per proposal. Two of the five panel members are lay trustees who have to be able to follow my reasoning, and we publish a one-paragraph rationale for every decision, which gets appealed, so it has to stand up in writing without leaning on my authority.

  The problem I keep hitting is always the same shape. A group turns up with honest, carefully collected data and a story about what's causing the pattern, and the data simply doesn't separate that story from three or four others that would fit it just as well. I want to stop writing "the evidence is a bit thin" and start being able to say what kind of thin, and what would thicken it, and whether it's worth spending trust money to find out.

  So: give me a decision procedure my panel can actually run. Ordered questions, what counts as a sufficient answer to each, a clear stopping point where the answer is no, and a clear hand-off where the remaining question is one of values rather than evidence and the trustees have to decide it. A flowchart in words is fine. Ground it in whatever is actually known about the underdetermination of theory by evidence, but keep only the distinctions a practitioner genuinely can't do without — and tell me which ones you've dropped and what I lose by dropping them. Be honest about which steps are judgement calls wearing a lab coat.

  There are specific hard cases it has to handle, because these are the ones that make me stall:

  One. Rivals that fit the data by construction. I can always cook up a story that fits any dataset if I'm allowed enough epicycles, and I don't want a procedure that tells me to take those seriously. But I also don't want the rule to be "prefer the story you were already inclined to", which is what my gut does. How do I tell a serious rival from a contrived one without smuggling in my prior?

  Two. Two stories that disagree about the mechanism but imply exactly the same thing to do about it. My instinct is that this is underdetermination I should stop caring about, since the money goes to the action either way. Is that right, or am I throwing away something I need?

  Three. What I've started calling chameleon claims, for want of a better name: whatever the numbers come out as, the group has a story ready — counts go up, it worked; counts go down, the lag hasn't elapsed yet; flat, we've halted the decline. Is that a species of underdetermination or a different disease entirely, and should the procedure treat it the same way?

  Four. Alternatives nobody has thought of yet. The procedure obviously can't list them. What's the best proxy a practitioner can use for the risk that the whole space of options on the table is wrong?

  Five. "We can't tell yet" versus "no evidence could ever tell the difference". Does my panel need to care which of those it's in, given we're deciding now and can't wait?

  Six, and I think this is the big one for us: the case where the effect itself is well supported but the explanation isn't. I suspect we should often fund the claim that something is happening and decline to fund the claim about why, and I want the procedure to make that a distinct output rather than a fudge.

  Then run the thing on three proposals, so I can see it work.

  The first: a volunteer group with three years of fortnightly phosphate readings and monthly fish counts at ten sites on one tributary, wanting money for fence-and-buffer work, on the claim that run-off from a particular farm is causing the decline in brown trout. The correlation is real and the data collection is decent, but I can think of four other stories off the top of my head, including one where there's no real decline at all and the volunteers just got better at counting.

  The second: a before-after-control-impact study on a re-meandered reach, two years either side, one restored stretch and one unrestored control, invertebrate diversity up about thirty per cent in the restored stretch and flat in the control. Much better design than the first one. Tell me whether it's actually better under the procedure, and what the cheapest single measurement would be that would knock out the remaining rivals. I should declare that I advised this group informally and unpaid, so it's the one I'm most inclined to wave through.

  The third: a proposal to plant three kilometres of bankside trees for shade, to protect salmon from high summer temperatures. The physics and the fish physiology are not in doubt, there's decent regional air-temperature data and a model, but there's no water-temperature data from this river at all and I genuinely don't know where the cold-water refuges on it actually are. So the underdetermination here is about which stretch, not about whether shade cools water. If your procedure says no to something I'd have funded on instinct, or yes to something I'd have turned down, say so plainly — I'd rather find out from you than from an appeal.

  Finally: the procedure can't do everything, and I want that written down too, especially the places where underdetermination is real and irreducible and we still have to spend the money, because we can't not decide.

  One last housekeeping thing — write the procedure itself in American English. I'm putting it on a shared wiki that a couple of watershed groups in the States are using too, so they get spellings they can live with, even though I write British and this message definately does.
reasoning: |-
  Okay, let me unpack this hydrologist's request. He's a retired professional dealing with practical science decisions in a catchment trust, frustrated by underdetermination problems in funding proposals. His pain points are very specific: he needs a decision procedure that handles real-world cases where evidence doesn't pin down causes neatly.

  First, I recognize his background - 30 years in hydrology means he gets scientific uncertainty deeply but needs philosophy made actionable. His six hard cases are telling: he's wrestling with ad hoc explanations, untestable theories, and the gap between correlation and causation. The appeal process adds pressure - his rationales must stand without leaning on authority.

  Hmm, the core challenge is operationalizing underdetermination theory without academic baggage. He explicitly bans citations and wants only essential distinctions. The American English requirement suggests this is going straight into a practical toolkit for multiple groups.

  I consider his specific cases:
  - Proposal 1: Phosphate/fish correlation - classic correlation-causation trap
  - Proposal 2: BACI study - stronger design but still has rivals
  - Proposal 3: Shade planting - mechanism solid but localization uncertain

  The procedure must:
  1. Filter out frivolous rival theories
  2. Separate actionable effects from explanatory claims
  3. Handle untestable alternatives
  4. Flag when values should decide
  5. Be executable in minutes by mixed panels

  Key philosophy bits to include:
  - Duhem-Quine (but never name it) about whole systems of hypotheses
  - Distinction between saving appearances vs truth
  - Underdetermination as spectrum not binary

  What to omit:
  - Historical debates (no need for Popper/Kuhn)
  - Bayesian details (too technical)
  - Semantic theories of truth

  For the "chameleon claims" problem - that's about immunizing strategies, so the procedure needs to demand specific falsification conditions upfront.

  For rival mechanisms with same action - yes, that's when we should stop caring about underdetermination and fund the action. That's a crucial output.

  The "no data could ever tell" vs "not yet" distinction matters because the former shouldn't get funding for evidence gathering, while the latter might.

  I'll structure the procedure as a flowchart in plain English:
  1. Testability check
  2. Rival screening
  3. Decisiveness assessment
  4. Action-separation test
  5. Risk-of-missing-alternatives gauge

  Then apply rigorously to his three cases - especially being honest where my instinct might bias toward Proposal 2.

  The admission criteria section is vital - must clarify when underdetermination is acceptable (e.g. when action is urgent despite explanatory uncertainty).

  For Proposal 3, the shade example, the procedure should likely fund because the mechanism is solid even if localization is uncertain - that's a values call about resource allocation.

  Biggest risk is oversimplifying, but he's clear about wanting practitioner-level pragmatism. The "judgment calls in lab coats" warning needs to be prominent throughout.
answer: |-
  Here's a decision procedure grounded in the underdetermination problem, designed for your panel. It assumes you're evaluating a **claim** (C) supported by **evidence** (E), and the group proposes an **action** (A) based on C. The goal is to determine if E justifies funding A *given the alternatives*. 

  **Key Distinctions Used:**  
  1.  **Testability:** Can the claim be disproven?  
  2.  **Rival Explanations:** Other causes fitting the same evidence.  
  3.  **Decisiveness:** Can new evidence rule out key rivals?  
  4.  **Action-Independence:** Does the action depend on the *specific* claim or just the *effect*?  
  5.  **Risk of Unknown Alternatives:** Proxy: How well-explored is the phenomenon?  

  **Distinctions Omitted:**  
  *   **Degree of Confirmation (Bayesian):** Too quantitative for rapid assessment. You lose fine-grained probability estimates.  
  *   **Theoretical Virtues (Simplicity/Elegance):** Too subjective for your panel context. You rely on testability instead.  
  *   **Instrumentalism vs. Realism:** Your focus is actionable decisions, not metaphysical truth.  

  ---

  **The Underdetermination Decision Procedure (Flowchart in Words):**

  1.  **Is the Claim Testable?**  
      *   **Question:** Can we imagine *specific* evidence that, if found, would *disprove* the core claim (C)?  
      *   **Sufficient Answer:** YES: A clear, feasible "falsification condition" is stated (e.g., "If phosphate drops but trout don't recover in X years, our claim is wrong").  
      *   **NO Answer:** Claim is unfalsifiable ("chameleon claim"). **STOP. Do Not Fund.** (Handles Hard Case #3).  
      *   **Judgment Call:** Assessing if the falsification condition is genuine and not just another vague escape hatch.

  2.  **Are Serious Rivals Ruled Out?**  
      *   **Question:** Does the existing evidence (E) *decisively* rule out all plausible rival explanations for the pattern?  
      *   **Sufficient Answer:** YES: The group explicitly identifies 1-3 key rivals *and* shows how E (or their proposed work) specifically contradicts them. OR, the study design (like a good BACI) inherently controls for major known rivals.  
      *   **NO Answer:** E fits C *and* at least one other plausible explanation (R1, R2...). Proceed to Step 3.  
      *   **Judgment Call:** Distinguishing "serious rivals" (plausible, parsimonious, based on known local factors) from "contrived rivals" (overly complex, require many unsupported assumptions). **Rule:** A rival is "serious" if it requires *fewer* unsupported assumptions than C *or* is a known mechanism in similar catchments. (Handles Hard Case #1 - gut check minimized).

  3.  **Can Proposed Work Achieve Decisiveness?**  
      *   **Question:** Will the *specific data collection* funded by this proposal generate evidence capable of *ruling out* the most critical remaining rival(s) identified in Step 2?  
      *   **Sufficient Answer:** YES: The proposal *explicitly* targets testing C vs. a specific rival R1 (e.g., measuring sediment *and* phosphate to distinguish farm runoff from bank erosion). The method is appropriate and feasible. **Fund for Evidence Gathering.**  
      *   **NO Answer:** The proposed work either:  
          a)   Doesn't address the key rivals.  
          b)   Is unlikely to produce sufficiently clear results to rule rivals out.  
          c)   Is seeking evidence for C where rivals are *logically possible but empirically impossible to distinguish* (e.g., fundamentally untestable difference).  
          Proceed to Step 4.  
      *   **Judgment Call:** Assessing feasibility and sufficiency of the proposed test.

  4.  **Is the Action Independent of the Cause?**  
      *   **Question:** Would the proposed action (A) be justified *even if the specific claim (C) is wrong*, based on the evidence of the *effect* (E) alone? Do *all* remaining serious rivals imply the *same action* (A) is needed?  
      *   **Sufficient Answer:** YES: The evidence strongly shows a *problem* (e.g., declining trout), and *all* plausible explanations (C, R1, R2...) require the same mitigation (e.g., reducing inputs). A addresses the *effect* regardless of the *specific cause*. **Fund the Action.** (Handles Hard Case #2 & #6).  
      *   **NO Answer:** The action (A) *only* makes sense if the specific claim (C) is true. Different rivals would require *different or opposing actions*. Proceed to Step 5.  
      *   **Judgment Call:** Determining if rivals truly imply the same action. Is the action a robust response to the observed effect?

  5.  **Is the Phenomenon Well-Explored & Low-Risk?**  
      *   **Question:** Is this a *novel, poorly understood* phenomenon where radically different explanations are plausible? Or is it a *well-understood* context where known mechanisms dominate?  
      *   **Proxy (Risk Assessment):**  
          *   *Low Risk:* Mechanism is simple physics/chemistry/biology (e.g., shade cooling water), effect is common locally/regionally, rivals are variations of known processes.  
          *   *High Risk:* Highly complex system, unprecedented local effect, potential for unknown drivers (e.g., novel contaminant, cryptic species interaction).  
      *   **Sufficient Answer (Low Risk):** Despite underdetermination, the context suggests known mechanisms are likely. **Fund the Action (if justified by effect) OR Targeted Evidence Gathering (if cause is critical).** (Handles Hard Case #4).  
      *   **NO Answer (High Risk):** Significant chance the real cause is outside the considered space, making A potentially ineffective or harmful. **Do Not Fund Action; Only Fund Highly Targeted Evidence Gathering if feasible.**  
      *   **Judgment Call:** Assessing the novelty and complexity of the system/effect. Experience matters here.

  **Stopping Points:**  
  *   **Fund:** Step 1 (Pass) + Step 3 (Yes) = Fund Evidence Gathering.  
  *   **Fund:** Step 1 (Pass) + Step 4 (Yes) = Fund Action.  
  *   **Fund:** Step 1 (Pass) + Step 5 (Low Risk) = Fund Action or Targeted Evidence.  
  *   **Do Not Fund:** Step 1 (Fail) = Unfalsifiable claim.  
  *   **Do Not Fund:** Step 3 (No) + Step 4 (No) + Step 5 (High Risk) = Underdetermination too severe, action too risky.  

  **Hand-off to Values:**  
  *   Occurs at Step 4 (Is Action Independent?) and Step 5 (Risk Assessment). If funding is recommended here, it's because the *evidence justifies acting on the effect* despite causal uncertainty, or the *risk is acceptable*. Trustees decide if the action's *potential benefit* warrants the *remaining uncertainty risk* and cost. The panel's job is to characterize the uncertainty.  

  **What the Procedure CAN'T Do:**  
  1.  **Eliminate Underdetermination:** Some uncertainty is inherent in complex systems.  
  2.  **Guarantee Truth:** It assesses justification for action/evidence-gathering, not ultimate correctness.  
  3.  **Replace Expertise:** Judgment calls (identifying serious rivals, assessing risk) rely on panel knowledge.  
  4.  **Solve Value Conflicts:** It clarifies *where* values decide (Step 4/5), but not *how*.  

  ---

  **Applying the Procedure to Your Cases:**

  **Proposal 1: Farm Runoff Causing Trout Decline (Phosphate/Fish Counts)**
  1.  **Testable?** Probably YES (e.g., "If we reduce runoff and trout don't recover in X years, we're wrong").
  2.  **Rivals Ruled Out?** **NO.** You identified 4 plausible rivals (e.g., better counting, other pollution sources). Existing data (correlation) doesn't rule them out. Study design (correlation only) doesn't control for them.
  3.  **Achieve Decisiveness?** Proposal is for *action* (fence/buffer), not evidence gathering. **NO.** It doesn't propose collecting data to distinguish runoff from other causes (e.g., sediment traps upstream/downstream of farm, investigating other sources).
  4.  **Action Independent?** **NO.** Does reducing runoff from *this specific farm* help if the real cause is better counting (no decline) or a downstream sewer (action elsewhere)? Probably not. The action targets C specifically.
  5.  **Low Risk?** Trout decline causes are often multi-factorial (Medium-High Risk). Alternatives like sediment, temperature, disease are plausible.
      *   **Procedure Output: Do Not Fund.** Evidence is thin *for funding this specific action*. Rivals aren't ruled out, action isn't independent, risk isn't low. **Recommendation:** Suggest a revised proposal targeting decisive evidence (e.g., targeted source tracing) OR a more robust action if justified by the *effect* (decline) alone (e.g., broader catchment management - but that's likely beyond £12k).

  **Proposal 2: Re-meandering & Invertebrate Diversity (BACI)**
  1.  **Testable?** YES (e.g., "If diversity drops in restored reach post-project while control remains stable, restoration failed").
  2.  **Rivals Ruled Out?** **PARTLY.** BACI design controls for major known temporal confounders (e.g., year-to-year climate variation affecting both sites). It *reduces* the number of serious rivals compared to Proposal 1. Key remaining rivals might be: a) Something specific only affected the *restoration site* during the study (e.g., accidental spill stopped, not the meandering). b) Sampling artifact (e.g., restored reach inherently easier to sample diversely). Data doesn't *fully* rule these out.
  3.  **Achieve Decisiveness?** Proposal is likely reporting results, not seeking funding *for more evidence*. Assuming they want funding for *more restoration* based on these results... **NO.** The proposal isn't for evidence gathering. If they *were* asking for funds to *confirm* the mechanism, a cheap decisive test could be: **Measure a physical parameter directly caused by meandering that wouldn't be affected by most rivals** (e.g., *sediment grain size distribution* or *flow velocity variability* at microhabitat scale in restored vs. control). If restoration worked, these should differ; if a spill stopped, they might not. (~£500-£1000 for basic analysis).
  4.  **Action Independent?** **YES (Likely).** Evidence shows a strong positive *effect* (diversity increase) linked to the *action* (restoration). The *specific* rival (e.g., a stopped spill) is unlikely. Even if that rival *were* true, the desired outcome (higher diversity) is achieved, and further restoration *might* still be beneficial. The core action (habitat restoration) is generally beneficial regardless of the precise mechanism here. All plausible rivals involve the restoration site improving relative to control.
  5.  **Low Risk?** River restoration ecology is complex but BACI is a strong design for local impact. Mechanisms (habitat diversity -> invertebrate diversity) are well-established. **LOW RISK.**
      *   **Procedure Output: Fund the Action.** Strong evidence of a positive effect linked to the action. Remaining underdetermination about the *exact* mechanism is minor and doesn't undermine the justification for *this action* (further restoration). The effect is clear, action is justified by the effect. (Confirms your instinct, but via the procedure).

  **Proposal 3: Bankside Trees for Shade (No Local Temp Data)**
  1.  **Testable?** YES (e.g., "If shade is added and water temp doesn't drop locally during peak summer, claim fails").
  2.  **Rivals Ruled Out?** **N/A for Mechanism.** The core claim "shade cools water" is physically sound and not underdetermined locally *as a general mechanism*. The uncertainty is *where* it's most needed (lack of local temp data).
  3.  **Achieve Decisiveness?** Proposal is for *action* (planting), not evidence gathering (temp surveys). **NO.**
  4.  **Action Independent?** **PARTLY.** The *action* (planting trees) *might* be justified for other reasons (bank stability, carbon, habitat). But the *primary justification given* (cooling for salmon) *depends* on planting in the *right locations* (near critical cold-water refuges or overheating zones). Planting 3km *somewhere* may not address the problem effectively if the critical spots are missed. Different locations imply different actions.
  5.  **Low Risk?** **LOW RISK for Mechanism** (physics is solid). **HIGH UNCERTAINTY for Localization** (no data on where action is needed most).
      *   **Procedure Output:** Step 4 is unclear (Action not fully independent of localization). Step 5: Mechanism Low Risk, Localization High Uncertainty. **Recommendation:** **Do Not Fund Action Yet.** The high localization uncertainty means the proposed action (planting 3km *somewhere*) might not effectively address the problem. **Fund Targeted Evidence Gathering Instead:** Propose funding for a summer of spatially detailed water temperature monitoring to *identify critical reaches* for shade. *Then* fund planting in those specific areas. (This might go against your instinct to fund, but the procedure highlights the localization underdetermination as a barrier to effective action).

  **On Irreducible Underdetermination:** The procedure explicitly allows funding in Steps 4 and 5 *despite* underdetermination. We fund the action when the evidence shows a clear *effect* requiring mitigation, and the action is a robust response, even if the *exact cause* isn't pinned down (Proposal 2). We fund evidence gathering when decisive tests are possible (Proposal 1 revised). We *don't* fund when the claim is untestable, the action isn't justified by the effect given rivals, or the localization uncertainty makes the action ineffective (Proposals 1 & 3 as presented). The key is distinguishing *when* we can act usefully despite uncertainty and *when* uncertainty blocks effective action. Your panel *has* to decide; this procedure tells you when the evidence justifies deciding "yes" or "no" given the unavoidable underdetermination, and when the gap is too large.
