answer: |-
  **Decision Tree for Formal Accounts of Embedded Agency**  
  *Start: "I want a formal account of what this agent should do."*  

  1. **Must the agent form beliefs about its *own* actions during decision-making?**  
     - *No →* Avoids self-prediction paradoxes. Go to 2.  
     - *Yes →* Must resolve self-reference. Go to 3.  

  2. **Does the agent use *any* world-model (e.g., states, dynamics, rewards)?**  
     - *No →* **Leaf 1: Model-Free (e.g., behaviorism, policy search)**  
       - *Awkward commitment:* Cannot plan; actions are reactive or evolutionarily tuned, failing in novel environments.  
     - *Yes →* **Leaf 2: Deflationary Classical (e.g., Savage-style CDT/EDT)**  
       - *Awkward commitment:* Treats the agent’s action as an uncaused "input," ignoring that the agent’s body/brain is part of the world-model.  

  3. **How does the agent handle self-reference in action-selection?**  
     - *Via causal interventions (e.g., "do-operator" on actions)* → Go to 4.  
     - *Via logical consistency (e.g., fixed points, proofs)* → Go to 5.  

  4. **Can the causal model include *its own source code* (e.g., as a node in the graph)?**  
     - *No →* **Leaf 3: Embedded Causal DT (e.g., Woodward-inspired)**  
       - *Awkward commitment:* The causal graph arbitrarily excludes the agent’s internals, making self-sabotage by the environment invisible.  
     - *Yes →* **Leaf 4: Circular Causal Modeling (unnamed)**  
       - *Awkward commitment:* Interventions on self-referential nodes risk infinite regress (e.g., "What if I change my policy while changing my policy?").  

  5. **Is the agent’s self-prediction *exact* (e.g., halting oracle, perfect proof)?**  
     - *Yes →* **Leaf 5: Logical DT (e.g., MIRI’s TDT/UDT)**  
       - *Awkward commitment:* Requires impossible logical omniscience; cannot handle undecidable queries about its own actions.  
     - *No →* Go to 6.  

  6. **Does the agent’s algorithm *treat its future self as identical* to its current self?**  
     - *Yes →* **Leaf 6: Bounded Logical Agent (e.g., logical induction)**  
       - *Awkward commitment:* If the environment rewrites the agent’s code, its self-model breaks (future ≠ current algorithm).  
     - *No →* **Leaf 7: Time-Slice Cooperation (e.g., acausal trade)**  
       - *Awkward commitment:* Requires bootstrapping trust in *other* agents/self-slices without shared goals, risking extortion.  

  7. **Should bounded computation *modify the utility maximization framework*?**  
     - *No →* **Leaf 8: Unnamed (collapses)**  
       - *Why empty:* Incoherent—boundedness without adjustments ignores costly computation (e.g., Solomonoff induction is incomputable).  
     - *Yes →* **Leaf 3 (shared): Bounded Optimality (e.g., Russell & Subramanian)**  
       - *Awkward commitment:* Optimality is defined for a *fixed* program, so dynamic rewrites by the environment invalidate guarantees.  

  ---

  **Notes on Gaps & Overlaps**:  
  - **Empty boxes**: Leaf 8 (incoherent). "Drop world-models" and "treat boundary as choice" are captured in Leaf 1 and Leaf 2.  
  - **Indistinct pairs**:  
    - Leaf 3 (Embedded CDT) and Leaf 4 (Circular Causal) both struggle with causal loops, but Leaf 4 embraces circularity while Leaf 3 avoids it.  
    - Leaf 6 (Bounded Logical) and Leaf 7 (Time-Slice) both weaken self-knowledge; Leaf 7 adds non-identity across time.  
  - **Strawmen avoided**: "Classical DT never needed Cartesian agents" is Leaf 2; "bounded computation in EU framework" is Leaf 3 (Bounded Optimality).  
  - **Branching rationale**: Self-prediction (Q1) is the hardest sub-problem, forcing splits on solution type (Q3), feasibility (Q5), and temporal unity (Q6). Boundedness (Q7) is orthogonal but cuts across leaves.  
  - **Untenable splits**: "Agent smaller than world" doesn’t branch cleanly—all positions assume boundedness, but it manifests differently (e.g., in self-model precision).
