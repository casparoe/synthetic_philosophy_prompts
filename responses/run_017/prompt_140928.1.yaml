answer: |-
  Based on your detailed verdicts and the core conflicts you've identified, I'll propose two candidate principles: one "ugly but comprehensive" principle that preserves all your intuitions, and one simpler principle that requires sacrificing some verdicts. I'll explain what each implies for your cases, predict new examples, and address the feasibility of the "looks vs. judged" distinction.

  ### **1. The "Ugly but Comprehensive" Principle (Saves All Verdicts)**
  **Principle:** *Cognitive penetration of perception occurs when:*  
  **(a)** *A cognitive state (belief, label, knowledge) alters the phenomenal character of experience* **and**  
  **(b)** *The change is* **not** *due to:*  
  &nbsp;&nbsp;&nbsp;&nbsp;*(i) Low-level sensory adaptation or recalibration (e.g., goggles, color training),*  
  &nbsp;&nbsp;&nbsp;&nbsp;*(ii) Resolution of genuine ambiguity in the stimulus (e.g., bistable figures),*  
  &nbsp;&nbsp;&nbsp;&nbsp;*(iii) Post-perceptual judgment or response bias (e.g., Müller-Lyer knowledge, angry face scaling),*  
  &nbsp;&nbsp;&nbsp;&nbsp;*(iv) Attentional selection alone (e.g., radiologist's "pop-out" via expertise).*  

  **How it works for your cases:**  
  - **Müller-Lyer:** Fails (a) – knowledge doesn’t alter the *look* (still appears unequal). Saved by (b)(iii).  
  - **Radiologist:** Passes (a) – shadows "pop out" phenomenally. Not excluded by (b): expertise changes perception via *automatized attention* (b)(iv doesn’t apply, as attention isn’t "alone" but rewired).  
  - **Banana:** Fails (a) – belief about lighting doesn’t alter yellowness; it’s constancy.  
  - **Angry face:** Fails (a) – belief doesn’t change the *look* of neutrality; it’s scaling (b)(iii).  
  - **Marchetti dots:** Passes (a) – label changes motion direction phenomenally. Not excluded: motion is "determinate" (so not (b)(ii)), and not recalibration/judgment.  
  - **Phonemic restoration:** Passes (a) – missing sound is *heard*. Not excluded: it’s filling-in, not ambiguity or judgment.  
  - **Inverting goggles:** Fails (a) – recalibration (b)(i), not cognitive state.  
  - **Color discrimination:** Fails (a) – recalibration (b)(i).  
  - **Your name at a party:** **Penetration** (if it leaps out phenomenally). Fits (a), not excluded by (b): it’s not mere attention (b)(iv) if the sound *itself* is clearer.  

  **Predictions for new cases:**  
  - **New color category (after training):** *Not penetrated.* Training changes discrimination (recalibration; b(i)), not online cognition.  
  - **Synesthete (e.g., seeing "5" as red):** *Not penetrated.* It’s a stable neural quirk (recalibration-like; b(i)), not driven by cognitive states.  

  **Pros:** Saves all your gut verdicts.  
  **Cons:** Complex, circular (relies on "phenomenal character"), and hard to test.  

  ---

  ### **2. Simpler Principle (Overturns 2 Verdicts)**
  **Principle:** *Cognitive penetration occurs only when a cognitive state directly alters early sensory processing in a way that changes phenomenal content* **without** *relying on long-term perceptual learning, attentional routing, or stimulus ambiguity.*  

  **Key implication:** Penetration requires *online* cognitive influence (e.g., a label *right now*), not slow expertise.  

  **How it reclassifies your cases:**  
  - **Müller-Lyer:** **Not penetrated** (knowledge doesn’t change early vision).  
  - **Radiologist:** **Not penetrated** (due to *long-term perceptual learning*, not online cognition).  
  - **Banana:** **Not penetrated** (constancy is low-level).  
  - **Angry face:** **Not penetrated** (judgment/late scaling).  
  - **Marchetti dots:** **❌ Overturn verdict → Not penetrated.** Label likely biases *attention* or resolves *hidden ambiguity* in motion signals.  
  - **Phonemic restoration:** **❌ Overturn verdict → Not penetrated.** Filling-in is automatic (auditory system completion), not direct cognitive override.  
  - **Inverting goggles:** **Not penetrated** (recalibration).  
  - **Color discrimination:** **Not penetrated** (perceptual learning).  
  - **Your name at a party:** **Not penetrated** (attentional selection + auditory grouping).  

  **Predictions for new cases:**  
  - **New color category:** *Not penetrated* (perceptual learning).  
  - **Synesthete:** *Not penetrated* (innate or developmental wiring).  

  **Why overturn Marchetti & phonemic restoration?**  
  - **Marchetti dots:** If motion is truly "determinate" downward, labels can’t flip it to upward without attention/ambiguity. Likely, the stimulus *is* ambiguous (e.g., dots lack context, enabling bi-stable motion perception). Labels disambiguate, like a Necker cube.  
  - **Phonemic restoration:** The auditory system fills gaps pre-cognitively (like visual completion). Your belief "there’s a word here" doesn’t directly create the sound; it’s predictive coding in sensory circuits.  

  **Pros:** Clean, testable (focuses on neural early-vision markers). Aligns with Pylyshyn/Firestone.  
  **Cons:** Forces you to abandon strong intuitions about Marchetti and phonemes.  

  ---

  ### **Can the "looks different vs. judged different" distinction be saved?**
  **Probably not.** As your TA’s cases show, the line is empirically and conceptually fuzzy. When radiologists say shadows "pop out," is it perception or automatized judgment? We lack objective measures.  

  **What to track instead:**  
  1. **Time-scale:** Fast (online cognition) vs. slow (learning/recalibration) changes.  
  2. **Neural locus:** Does the effect arise in primary sensory areas (V1, A1) or higher regions (e.g., fusiform face area)?  
  3. **Stimulus-dependence:** Does the effect vanish if stimulus is removed (e.g., radiologist can’t "see" shadows without an image)?  
  4. **Automaticity:** Does it require conscious effort (e.g., angry face scaling) or feel immediate (e.g., your name)?  

  ---

  ### **Recommendation**
  - **If phenomenology is paramount,** use the **complex principle**. It respects your verdicts but admits the messiness of perception.  
  - **If scientific tractability matters,** use the **simpler principle**. Overturning Marchetti and phonemic restoration is defensible: both *can* be explained by low-level mechanisms (disambiguation for dots, auditory completion for phonemes).  

  **For your flip-flop case (your name):** Neither principle fully resolves it. Under the complex principle, it’s penetration; under the simpler, it’s attention. This reflects real debate: the "cocktail party effect" likely involves *pre-perceptual* attentional filtering, not cognitive penetration.  

  **Final thought:** Your resistance to calling goggles/color-training "penetration" is astute. It suggests a core intuition: cognition (beliefs/desires) ≠ slow neural plasticity. A hybrid might distinguish *cognitive* penetration (online, belief-driven) from *perceptual plasticity* (slow, experience-driven). That could save radiologist as non-penetrated while keeping your core verdicts.
