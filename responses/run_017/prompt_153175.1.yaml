answer: |-
  The sea-battle argument gains traction by conflating determinateness with inevitability and predictive settledness, but separating these reveals distinct burdens for each main position: denying determinateness requires an account of future-truth that avoids collapsing into inevitability or predictability, while affirming determinateness must explain how contingency is preserved solely as non-inevitability.

  The argument is seductive because the example leverages intuitions belonging to different concepts. The event's *contingency* initially signals non-inevitability (we *could* prevent it). However, the claim "It is *already* true/false" intuitively suggests determinateness. The worry that deliberation is pointless arises from a slide into inevitability (if it's *already fixed*, why try?). The standard reply (distinguishing necessity of the consequence/consequent) addresses only the logical inference from past truth to future fact, not the grounding worry about *why* the past truth-value was what it was. Conflating the three notions allows the argument to move seamlessly from the plausible (the battle isn't predictively settled *or* inevitable *now*) to the conclusion that it cannot be determinate *now*, masking the distinct metaphysical commitments involved.

  Pulling the notions apart clarifies the dialectic:

  1.  **Denying Determinateness (e.g., Open Future views):** If one claims there is no present fact of the matter about tomorrow's sea battle, one avoids attributing inevitability *based on present determinateness*. The burden is to explain the semantics of future contingents *without* collapsing into denying contingency (non-inevitability) or requiring predictive settledness. Typically, this involves:
      *   **Truth-value gaps:** "There will be a sea battle tomorrow" is presently neither true nor false. This directly denies determinateness.
      *   **The Grounding Problem:** One *owes an account* of what makes future-tensed statements true *when they become true* (e.g., at the future time of the event). The critical burden is ensuring this account doesn't imply that the outcome was *inevitable* prior to its occurrence. If the truthmaker is solely the future event itself (a "thin" truthmaker), determinateness at t1 about t2 is denied, preserving the idea that nothing *at t1* settled the outcome (non-inevitability). However, critics argue this merely *relocates* the mystery: why does the future event "make" the past statement true, unless the event was somehow "on track" already? Avoiding this requires resisting the idea that truthmaking demands *present* grounding facts, a significant metaphysical commitment. The collapse risk is high: if the account implies any present state *necessitates* the future truthmaker, it reintroduces inevitability; if it relies on present evidence, it conflates with predictive settledness.

  2.  **Affirming Determinateness (e.g., Eternalism, Peirceanism):** If one claims "There will be a sea battle tomorrow" is already determinately true or false, one accepts present determinateness. The burden is to explain how the battle remains *contingent* – meaning non-inevitable – and not predictively settled. This is addressed by rigorously distinguishing determinateness from inevitability:
      *   **Contingency as Non-Inevitability:** The battle is contingent because, *relative to the time before it occurs*, there were possible actions (e.g., calling off the battle) that *would have* prevented it. Its present determinateness does *not* mean those actions were *impossible* at the prior time; it means those actions simply *weren't taken* in the actual course of history. The necessity is only that of the actual past truth describing the single, unfolding timeline ("It was true yesterday that the battle happens today"), not a metaphysical necessity rendering alternatives impossible *at the time of deliberation*. Contingency is preserved as a modal property of events relative to times prior to their occurrence: *at t1*, multiple futures were genuinely possible (you *could* have chosen differently), even though only one was actual, making the corresponding past-tensed statement true.
      *   **Predictive Settledness is Independent:** Determinateness does not imply predictive settledness. The truth about the future may be brute, hidden, or inaccessible to us now.

  **Where the Burden Falls:**
  *   **For Deniers of Determinateness:** The primary burden is resolving the grounding problem satisfactorily (explaining future truth without present truthmakers) and defending the coherence of truth-value gaps or alternative logics, all while ensuring the explanation doesn't implicitly reintroduce inevitability or reduce to predictive settledness.
  *   **For Affirmers of Determinateness:** The primary burden is defending a robust notion of "could have done otherwise" (contingency as non-inevitability) that remains coherent within a framework where the entire timeline, including future events, is determinate. This often involves compatibilist analyses of ability and possibility relative to past states of the world.

  Separating the concepts shows the core issue: determinateness is a *semantic/metaphysical* status concerning present truth, inevitability is a *modal/causal* status concerning present power, and predictive settledness is an *epistemic* status. The sea-battle argument's threat to contingency arises only if determinateness entails inevitability. The standard reply highlights that it doesn't entail *logical* necessity of the consequent, but the deeper challenge is showing it doesn't entail *causal/metaphysical* necessity (inevitability). Affirmers tackle this by analyzing contingency modally relative to past times. Deniers avoid it by rejecting present truth-values altogether, but face the grounding challenge. Neither path is cost-free, but the conflation obscures the specific price each position pays.
