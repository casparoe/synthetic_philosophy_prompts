answer: |-
  ## Proposal: Calibration or Convergence? Reassessing the Epistemology of the Church-Turing Thesis

  **1. Precise Question & Target Disambiguation**
  The Church-Turing Thesis (CTT) is often presented as a single claim, but its epistemic status depends critically on which version is at stake. I distinguish four:
  *   **CTT-Narrow (CTT-N):** A function is effectively computable (intuitive notion) iff it is Turing-computable (formal notion).
  *   **CTT-Physical (CTT-P):** No physically realizable process can compute a function not Turing-computable.
  *   **CTT-Feasible (CTT-F):** The class of feasibly computable functions (considering time/resources) is robustly captured by complexity-theoretic classes like P or BPP, ultimately grounded in Turing computability.
  *   **CTT-Normative (CTT-Norm):** A proof that a function is not Turing-computable provides *conclusive reason* for researchers to cease searching for an algorithm, treating undecidability as closing a question.

  **The Core Question:** Is the celebrated convergence of formalisms (Turing machines, λ-calculus, recursive functions, etc.) on the class of computable functions robust evidence for CTT-N's truth (tracking an independent concept), or is it potentially an artifact of historical *calibration* – where later formalisms were judged adequate partly *because* they recovered the class established by predecessors? Crucially, what are the epistemic consequences for CTT-N and CTT-Norm if the calibration worry holds?

  **Which Theses Does the Worry Touch?**
  *   **Primarily CTT-N:** Its evidence base relies most directly on the convergence argument.
  *   **Significantly CTT-Norm:** If CTT-N rests partly on calibration/stipulation, does this undermine the *conclusive* normative force of undecidability results? Can the practice be justified independently?
  *   **Less Directly CTT-P & CTT-F:** Their primary evidence comes from physics and complexity theory, respectively, though they presuppose CTT-N's link. The calibration worry might raise auxiliary questions about their foundations but doesn't directly challenge their core evidence.

  **2. Gap in Existing Positions & Proposed Method**
  The standard view acknowledges CTT-N's unprovability but treats the convergence as overwhelming inductive evidence, dismissing the calibration worry implicitly or as insignificant. Critics often leap to hypercomputation (challenging CTT-P) or rehearse realism/anti-realism debates without rigorously analyzing the structure of the convergence evidence itself. What's missing is a systematic assessment of whether the historical pattern of agreement genuinely supports a "tracking" hypothesis or is equally compatible with a "calibration cascade."

  **My Method: Conceptual Analysis First, Bounded Historical Check Second**
  To avoid collapsing into pure history or model cataloging, I propose a strictly ordered approach:

  *   **Phase 1: Conceptual Groundwork (Months 1-4)**
      *   Define precise, distinguishable predicted patterns for "Genuine Tracking" (GT) vs. "Calibration Cascade" (CC):
          *   *GT Prediction:* New formalisms, developed under *significantly different* motivations or constraints (e.g., from logic, physics, biology), independently converge on the same class. Near-misses (formalisms capturing "more" than computable) would be readily apparent, debated on conceptual grounds *before* comparing to the established class, and potentially accepted if they better fit the *intuitive notion*.
          *   *CC Prediction:* Later formalisms are developed with explicit knowledge of, and intent to capture, the class defined by earlier ones (e.g., Turing machines). Near-misses are primarily rejected *because* they diverge from the established class, with justifications appealing to precedent or adjusted *post hoc* to rule them out. Acceptance hinges heavily on replicating the "right" class.
      *   Analyze "Near-Misses": Systematically examine proposed relaxations (oracles, infinite time, real computation). Does the *field's standard rationale* for rejecting them as analyses of "mechanical procedure" (e.g., "requires external information," "non-finitary," "physically unrealizable precision") logically precede and independently justify excluding them, or does the need to preserve the established class dominate?

  *   **Phase 2: Focused Historical Analysis (Months 5-8)**
      *   Apply the GT/CC framework to a *bounded set* of pivotal cases:
          1.  **The Founders:** Analyze Turing's (1936) and Church's (1936) original justifications. Was the equivalence surprising? Did their intuitive constraints *lead* to the class, or was the class a target?
          2.  **Early Successors:** Examine Post (1936), Kleene (1936), Markov (1951). How explicitly did they aim for Turing-computability? How were deviations handled? Was the intuitive notion primary, or equivalence?
          3.  **Later "Confirmations":** Study one later, influential formalism (e.g., Shepherdson & Sturgis' Register Machines, 1963). Was the primary goal capturing the intuitive notion or replicating the known class?
      *   **Focus:** Track the stated motivations, criteria for adequacy, and treatment of potential deviations *in the original texts*, looking for signatures of GT or CC.

  **Why this Method?**
  *   **Avoids Archival Overload:** Prioritizes conceptual structure over exhaustive history.
  *   **Avoids Hypercomputation Distraction:** Focuses on the *epistemic justification for CTT-N*, not physical possibility.
  *   **Avoids Abstract Realism Debate:** Grounds the analysis in concrete historical-epistemological patterns.
  *   **Provides Discriminatory Power:** The GT/CC framework offers specific, falsifiable predictions about the historical record and near-misses.

  **3. Possible Conclusions & Practice Implications**
  If the calibration worry survives scrutiny (CC patterns dominate), CTT-N's status shifts:
  *   **As Discovery:** Weakens significantly; convergence is less indicative of tracking a pre-existing platonic concept.
  *   **As Stipulation:** Gains plausibility; CTT-N defines the subject matter.
  *   **As Explication (Carnap):** Remains viable, judged by fruitfulness and fit with *evolving* use, not "truth."
  *   **As Constitutive Convention:** Gains traction; CTT-N is a rule defining what counts as "computable" within the field.
  *   **As Low-Grade Empirical Hypothesis:** Loses support; convergence isn't strong independent evidence.

  **Deciding Among Readings:** Key considerations include: the strength of independent justifications for rejecting near-misses, the degree of historical CC evidence, and the ability of each reading to underwrite the *function* of CTT in practice.

  **Addressing CTT-Norm (Practice):** Even a deflationary reading of CTT-N need not collapse CTT-Norm. The normative force could stem from:
  *   **Pragmatic Necessity:** The need for a shared, precise standard to organize research.
  *   **Fruitfulness:** The immense success of the Turing framework.
  *   **Implicit Commitment:** The field's constitutive rules.
  The project will assess whether these justifications suffice to maintain CTT-Norm's authority if CTT-N's evidential base is primarily calibration-based, or if a deflationary reading *does* force a reassessment of undecidability's conclusive force.

  **4. Work Plan for Fellowship Year (Paper 1)**
  *   Months 1-2: Deep literature review on CTT's evidence & epistemology. Refine GT/CC framework.
  *   Months 3-4: Conceptual analysis of near-misses and adequacy criteria. Finalize GT/CC predictions.
  *   Months 5-6: Focused historical analysis of Turing, Church, Post, Kleene texts.
  *   Months 7-8: Focused historical analysis of one later formalism (e.g., Register Machines).
  *   Months 9-10: Synthesize findings. Assess the calibration worry's validity and its impact on CTT-N's status. Draft Paper 1: "Calibration or Convergence? Re-examining the Evidence for the Church-Turing Thesis."
  *   Months 11-12: Revise Paper 1, begin outlining implications for CTT-Norm (Paper 2) and broader epistemology (Paper 3).

  **5. Candid Scope & Failure Conditions**
  *   **Scope Limits:**
      *   Focuses exclusively on CTT-N's epistemology; CTT-P/CTT-F are background.
      *   Examines a bounded historical set (founders + 1-2 successors).
      *   Paper 1 establishes the framework and historical assessment; Papers 2 & 3 (post-fellowship) tackle CTT-Norm and broader implications.
  *   **Risks of Overextension:**
      *   Getting bogged down in intricate historical details of multiple formalisms.
      *   Being drawn into extensive analysis of hypercomputation models beyond near-miss conceptual critique.
      *   Attempting a full resolution of the realism/anti-realism debate.
  *   **What Constitutes Failure (vs. Unexpected Outcome):**
      *   **Failure:** The core distinction between "Genuine Tracking" and "Calibration Cascade" proves *epistemologically inert* or *impossible to operationalize* for assessing the convergence evidence. If no discernible historical or conceptual signatures differentiate the hypotheses, or if differentiating them has no bearing on how we should interpret the evidence for CTT-N, the project's central premise collapses.
      *   **Failure:** Discovering that the historical record is so ambiguous or incomplete that no plausible assessment of the calibration worry is possible.
      *   **Not Failure (Unexpected Outcome):** Concluding the calibration worry is strong (or weak), or that CTT-N is best seen as stipulative/conventional (or robustly supported), even if it contradicts my initial suspicion. Success lies in rigorously answering the question, not in confirming the worry.
      *   **Not Failure (Unexpected Outcome):** Finding that the calibration worry impacts CTT-Norm differently than initially hypothesized, requiring revision of the practice justification.

  This project offers a novel, critical examination of a foundational but under-scrutinized argument in computability theory. It promises to clarify the epistemic standing of the Church-Turing Thesis and its profound influence on mathematical and computational practice.
