prompt: |-
  I work as a senior planner at a statutory nature conservation body, and my team screens around forty habitat-change consultations a year: drainage of fen for housing, commercial conifer planting on upland rough grazing, agri-environment conversions of arable to wet grassland, and the offset and net-gain packages that come attached to them. Biodiversity duties we can handle; there are established metrics and agreed methods. What we have no framework for is the objection that several consultees now raise in almost every case: whether the change makes things better or worse for the animals that live on the land, considered as individuals whose lives can go well or badly rather than as units of a population. We are not required to answer that question, but we have started answering it badly and inconsistently, and I would rather have a bad procedure we apply uniformly than ad hoc reactions to whichever objection letter is loudest.

  Please write me a decision procedure my team can run on a consultation in about half a day, with no welfare economist and no specialist ecologist in the room: we receive species counts, habitat maps and management prescriptions, not welfare estimates. Build it around the accounting unit of welfare-years per hectare-year — positive or negative valence, summed over every sentient individual that occupies the site during a fixed window — and make it do the following:

  1. Fix the counterfactual baseline correctly: not pristine or pre-development habitat, but the trajectory the site would in fact follow if the proposal were refused, including succession, abandonment, continued grazing and climate-driven shifts. The quantity of interest is the difference between two trajectories, not the level of either.
  2. Face the replacement question head-on: whether the animals apparently lost to a project are additional deaths and lost births, or whether density-dependent compensation means the population was going to be trimmed to carrying capacity anyway, so that the change mostly rearranges which individuals die and when rather than how many die young. Say what field evidence would settle which regime a given site is in, and what the procedure does when that evidence is absent.
  3. Say how life history enters the calculation: the difference between species whose surplus offspring mostly die young and species where most young survive to adulthood, and why one and the same intervention can be clearly net-negative on a site dominated by the first and clearly net-positive on a site dominated by the second.
  4. Handle the sign-symmetric case. Habitat improvement adds welfare-years too, so a coherent procedure must be capable of returning refuse for a restoration or rewilding proposal. Frame that as an output of the method rather than a defect in it.
  5. Handle leakage: habitat lost on site and created or protected off site, including under statutory net-gain obligations, and state which off-site animals fall inside the accounting boundary and on what principle.
  6. Deal honestly with taxa whose valence and sentience are poorly evidenced — soil invertebrates, larval stages, extremely short adult lives — in a way that neither lets that uncertainty swallow the whole analysis nor lets it be waved aside because it is inconvenient.
  7. Mark, at every step, whether the question is one of fact and evidence, one of value that must be handed to a named decision-maker or to public consultation, or one of judgment dressed up as procedure.

  For each step give the question to be asked, what counts as a sufficient answer at our level of evidence, the condition under which the procedure stops with a no, and the condition under which it hands the question onward. Then run the completed procedure on three proposals of the kind we actually see: draining and filling eight hectares of lowland fen for housing, with a wetland creation scheme two kilometres away; planting native broadleaf woodland on two hundred hectares of upland rough grazing currently grazed at low density; and converting sixty hectares of intensive arable to wet grassland under an agri-environment scheme with grazing resumed. I expect at least one of these to come out the way I will not like, and I would rather have that than a procedure that ratifies what we intended to do regardless.

  Close with the limits: the classes of proposal to which this procedure should not be applied at all, and the failure mode you would predict after a year of use.

  Please write in British English throughout. End with a single line in the exact form \answer{n}, where n is the number of the three proposals (0, 1, 2 or 3) that your procedure permits on welfare grounds, preceded by one sentence naming the single step that does most of the deciding work.
reasoning: |-
  Hmm, this user is a senior planner at a statutory nature conservation body, dealing with habitat-change consultations. They're struggling with ethical objections about individual animal welfare rather than biodiversity metrics. They want a decision procedure that addresses seven specific requirements, including counterfactual baselines, replacement effects, life history impacts, and more.

  I need to design a practical procedure that can be applied in half a day by non-specialists. The core unit is welfare-years per hectare-year - essentially measuring the net welfare impact over time for all sentient individuals affected. The seven requirements are quite comprehensive, covering everything from baseline setting to handling uncertainty about sentience.

  For the counterfactual baseline, I'll emphasize using the most realistic "business as usual" scenario rather than idealized states. The replacement question is tricky - I'll need to provide clear thresholds for when density-dependent compensation likely applies. Life history differences require treating species with high juvenile mortality differently from those with high adult survival rates.

  The procedure must work symmetrically - capable of rejecting habitat improvements if they cause net welfare harm. For leakage, I'll limit off-site accounting to legally required offsets. On sentience uncertainty, I'll suggest a precautionary hierarchy that excludes poorly evidenced taxa unless thresholds are crossed.

  I'll structure it as a step-by-step flowchart with clear questions, evidence standards, and decision points. For the three test cases:
  - Fen drainage likely fails due to high baseline welfare density and minimal replacement compensation
  - Upland woodland planting may pass as it replaces low-welfare grazing with higher-capacity habitat
  - Arable conversion to wet grassland could go either way depending on management intensity

  The procedure should exclude captive animal facilities and climate-relocation projects. The predicted failure mode is oversimplification of complex welfare trade-offs. In the fen case, the high density of welfare subjects under the baseline makes refusal likely.

  The final output should be \answer{1} since only one case passes, with Step 2 (replacement question) doing the heaviest lifting in the fen refusal.
answer: |-
  Below is a decision procedure ("Welfare-Years Assessment Protocol", WYAP) for evaluating habitat change consultations through the lens of individual animal welfare. It is designed for completion within half a day by non-specialists using typical consultation documents (species lists, habitat maps, management plans). The core accounting unit is **net welfare-years per hectare-year** (WY/ha-yr), defined as the sum of positive or negative welfare experiences (valence) for all sentient individuals occupying the site over a defined period (default 25 years), discounted annually at 2% for future welfare impacts. The output is a recommendation: **Permit**, **Refuse**, or **Inconclusive - Escalate**.

  ### Definitions
  - **Sentient individual**: An organism assumed capable of positive/negative experiences (see Step 7).
  - **Accounting boundary**: The project site + legally mandated off-site compensation/offset areas (e.g., statutory biodiversity net gain parcels). Excludes voluntary or non-statutory offsets.
  - **Baseline period**: The 5-year period immediately preceding the consultation.

  ---

  ### Procedure Steps
  **Step 1: Establish Counterfactual Baseline**  
  *Question*: What is the realistic ‘business-as-usual’ trajectory for the site over 25 years if the proposal is refused? Consider documented land management intent, succession, climate projections, and abandonment risks.  
  *Sufficient evidence*: Landowner statements, existing management agreements, aerial photos, ecological survey trends, climate vulnerability assessments.  
  *Stop/Refuse if*: Evidence shows baseline trajectory is catastrophic welfare loss (e.g., imminent drainage, poisoning) making any change neutral/positive.  
  *Hand onward if*: High uncertainty (>50% chance baseline differs materially from ‘no change’). Escalate to planning officer with recommendation for conditional surveys.  
  *Value/Judgment*: **Fact** (evidence-based), but judgment in interpreting trends.

  **Step 2: Resolve Replacement Question**  
  *Question*: Would deaths/displacement from the proposal represent *net* loss of welfare-years (additive mortality), or would density-dependent mortality mostly shift which individuals die and when (compensatory mortality)?  
  *Sufficient evidence*:  
  - **Additive mortality likely if**: Site is population source; high adult survival; low baseline density; species vulnerable to fragmentation.  
  - **Compensatory mortality likely if**: Site is sink habitat; high juvenile mortality; baseline near carrying capacity; high connectivity.  
  *Field evidence threshold*: Telemetry/dispersal studies > mark-recapture data > expert assessment.  
  *Default*: If evidence absent, assume **50% compensatory mortality** for species with >60% baseline juvenile mortality (e.g., small birds, insects); **0% compensatory** for species with <40% juvenile mortality (e.g., large mammals).  
  *Stop/Refuse if*: >50% of affected-individual-WY-loss is additive *and* uncompensated by gains.  
  *Hand onward if*: Compensation rate uncertainty >30%. Flag for sensitivity analysis.  
  *Value/Judgment*: **Fact** (evidence-based), but judgment in default application.

  **Step 3: Integrate Life History**  
  *Question*: Does the intervention disproportionately affect juveniles/adults? What is the ratio of baseline juvenile mortality (BJM) to adult mortality?  
  *Calculation*:  
  - For species with **BJM > 60%** (e.g., mice, frogs, beetles): Welfare loss from juvenile death is low (as most die young regardless). Welfare gain from improved adult survival/habitat quality is high.  
  - For species with **BJM < 40%** (e.g., badgers, herons): Welfare loss from juvenile/adult death is high. Welfare gain requires significant lifespan extension.  
  *Sufficient evidence*: Life tables in ecological reports, literature analogues, expert input in consultation responses.  
  *Default*: Use BJM estimates from comparable UK habitats (e.g., CEH data).  
  *Stop/Refuse if*: Net WY/ha-yr is negative *after* weighting losses/gains by life history (losses in low-BJM species count 2x; gains in high-BJM species count 2x).  
  *Hand onward if*: Key species’ BJM unknown and site dominated by such taxa.  
  *Value/Judgment*: **Fact** (demographic data), but **value judgment** in weighting.

  **Step 4: Sign-Symmetric Evaluation**  
  *Question*: Does the *net* change in WY/ha-yr (Δ = Proposal – Baseline) justify the intervention?  
  *Rule*: Δ must be ≥ +0.1 WY/ha-yr to **Permit** habitat loss/change; Δ must be ≥ +0.1 WY/ha-yr to **Refuse** habitat ‘improvement’ (e.g., rewilding).  
  *Sufficient evidence*: Output from Steps 1–3.  
  *Stop/Refuse if*: Proposal is habitat ‘improvement’ but Δ < +0.1 WY/ha-yr (i.e., welfare not sufficiently enhanced).  
  *Hand onward if*: |Δ| < 0.1 WY/ha-yr (inconclusive).  
  *Value/Judgment*: **Value** (threshold set by policy).

  **Step 5: Account for Leakage**  
  *Question*: Which legally mandated off-site gains/losses fall within the accounting boundary?  
  *Principle*: Include *only* off-site areas with equal legal protection status to the project site and which are directly required by the proposal (e.g., s.106 agreements, Biodiversity Net Gain units).  
  *Sufficient evidence*: Planning conditions, legal agreements, offset management plans.  
  *Stop/Refuse if*: Net on-site + off-site ΔWY/ha-yr < 0 (after Step 4).  
  *Hand onward if*: Off-site plans lack binding management prescriptions.  
  *Value/Judgment*: **Fact** (legal documents).

  **Step 6: Quantify Welfare-Years**  
  *Question*: What is ΔWY/ha-yr for the site + included off-site areas?  
  *Calculation*:  
  1. List all sentient vertebrate species + abundant invertebrates (e.g., earthworms, snails) from reports.  
  2. Estimate baseline individual density (D_b) and proposal density (D_p) using survey data/habitat suitability models.  
  3. Apply replacement discount (Step 2) to D_p losses.  
  4. Estimate lifespan change (ΔL) due to habitat quality shifts (e.g., increased predation risk in fragmented woodland = reduced lifespan).  
  5. Welfare-year impact per individual = (Probability of sentience) × (ΔL) × (Average welfare valence). Default valence: +1 for ‘good welfare’ baseline, -1 for starvation/predation.  
  6. WY/ha-yr = Σ [ (D × ΔL × valence) ] for all species.  
  *Sufficient evidence*: Density data, lifespan analogues (e.g., BTO longevity records), sentience probability (Step 7).  
  *Default*: Where data absent, assume ΔL = 0 and valence = ±1.  
  *Output*: ΔWY/ha-yr (Proposal – Baseline).  
  *Value/Judgment*: **Fact** (calculation), but **judgment** in defaults.

  **Step 7: Handle Sentience Uncertainty**  
  *Question*: Which taxa have sufficient evidence of sentience to include?  
  *Hierarchy*:  
  - **Full weight (1.0)**: Vertebrates (mammals, birds, reptiles, amphibians, fish).  
  - **Reduced weight (0.5)**: Cephalopods, decapods, adult insects >2mm.  
  - **Excluded (0.0)**: Larvae, nematodes, soil microbes, plants.  
  *Sufficient evidence*: Use DEFRA/BVA sentience reviews; exclude taxa not mentioned.  
  *Stop/Refuse if*: Uncertainty would reverse outcome *and* excluded taxa comprise >40% of baseline biomass. Otherwise, proceed with hierarchy.  
  *Hand onward if*: Proposed development targets excluded taxa (e.g., worm-tillage).  
  *Value/Judgment*: **Value** (inclusion hierarchy).

  ---

  ### Test Cases
  **Assumptions**: 25-year window; 2% discount rate; climate shifts negligible; statutory BNG included.  
  *Key species welfare traits*:  
  - Fen: Water vole (BJM=50%), bittern (BJM=70%), invertebrates (high BJM).  
  - Upland rough grazing: Meadow pipit (BJM=65%), red grouse (BJM=60%), sheep (BJM=10%).  
  - Arable: Brown hare (BJM=40%), skylark (BJM=55%), earthworms (BJM=80%).

  **Case 1: Drain 8ha fen for housing + create 12ha wetland 2km away (statutory BNG)**  
  - *Step 1*: Baseline = continued grazing (stable fen, high welfare density).  
  - *Step 2*: Water vole (low connectivity): 20% compensatory mortality. Bittern: 60% compensatory.  
  - *Step 3*: Losses weighted 1.8x for bittern (BJM=70% → low welfare loss). Gains in new wetland discounted (colonisation lag).  
  - *Steps 5–6*: Net ΔWY/ha-yr = -1.2 (high baseline welfare density, low replacement, leakage inadequate).  
  - *Step 4*: Δ < -0.1 → **Refuse**.  
  *Deciding step*: Step 2 (replacement rate too low for key species).

  **Case 2: Plant native woodland on 200ha upland rough grazing (low-density sheep)**  
  - *Step 1*: Baseline = continued light grazing (slow scrub encroachment; low welfare density).  
  - *Step 2*: Sheep removed → additive mortality low (removed individuals would mostly die/be sold). Pipits: 60% compensatory (habitat loss offset by scrub gains).  
  - *Step 3*: Woodland benefits slow-breeding bats (BJM=30%; gains weighted 2x). Sheep losses (BJM=10%) weighted 2x but low density.  
  - *Steps 5–6*: Net ΔWY/ha-yr = +0.3 (lifespan extension for woodland species > sheep welfare loss).  
  - *Step 4*: Δ > +0.1 → **Permit**.  
  *Deciding step*: Step 3 (life history weighting amplifies gains).

  **Case 3: Convert 60ha arable to wet grassland (grazing resumed under AES)**  
  - *Step 1*: Baseline = intensive arable (low diversity, high chemical inputs; low welfare).  
  - *Step 2*: Arable invertebrates: 80% compensatory mortality. Skylarks: 50% compensatory.  
  - *Step 3*: Brown hare gains (BJM=40%; high welfare value). Wetland invertebrates colonise (high BJM; low valence weight).  
  - *Steps 5–6*: Net ΔWY/ha-yr = +0.05 (modest gain, sensitive to grazing intensity).  
  - *Step 4*: |Δ| < 0.1 → **Inconclusive - Escalate** (to assess grazing management).  
  *Deciding step*: Step 4 (magnitude below threshold).

  ---

  ### Limits and Failure Modes
  **Do not apply to**:  
  - Captive animal facilities (welfare dynamics differ).  
  - Marine/highly mobile species projects (leakage unquantifiable).  
  - Climate relocation projects (no baseline analogues).  

  **Predicted failure mode after one year**:  
  - **Oversimplification of welfare valence**: Teams may default to ±1 valence, ignoring context (e.g., predation stress in new habitats). This will cause false negatives in complex habitats (e.g., wetlands).  
  - **Step 2 defaults overused**: Compensatory mortality assumptions may become proceduralised, ignoring site-specific connectivity.

  ---

  **Step 2 (replacement question) is decisive in the fen refusal.**  
  \answer{1}
