  ### Diagnostic Decision Tree: Karma as Moral Desert  

  **Seed Commitment (Starting Point)**  
  All students accept: A wrongful act leaves a residual burden that must be answered for, and this burden should primarily fall on the agent (not arbitrarily on others).  

  ---

  #### Branching Nodes (Forced-Choice Cases)  
  *Answer each question based on the case, without regard to traditions or prior beliefs.*  

  1. **Trigger of Burden: Intention vs. Consequence**  
     - *Case:* An agent acts from a wholly benevolent motive (e.g., donating to charity) but the act foreseeably causes great suffering (e.g., funds fuel corruption).  
     - **Choice A:** The burden arises from the **intention** (no burden if motive was good, despite consequences).  
     - **Choice B:** The burden arises from the **actual consequences** (burden exists due to suffering caused, regardless of motive).  

  2. **Strict Liability: Burden Without Fault**  
     - *Case:* An agent causes great suffering through an act that was, at the time, neither careless nor wrongful (e.g., a doctor prescribing a drug with unforeseeable lethal side effects).  
     - **Choice A:** The agent bears a burden **even without fault** (consequences alone create responsibility).  
     - **Choice B:** The agent bears **no burden** (no wrongful act occurred).  
     - *Constraint:* Choosing 1A (intention) forces 2B (no burden), as no wrongful act exists.  

  3. **Model of Burden: Quantitative vs. Qualitative**  
     - *Case:* An agent commits multiple minor wrongs (e.g., petty thefts) or one major wrong (e.g., embezzlement).  
     - **Choice A:** Burden is **quantitative** (a "debt" that accumulates, can be balanced against good deeds, and paid off incrementally).  
     - **Choice B:** Burden is **qualitative** (alters the agent’s character, making them more prone to similar acts or less morally whole).  

  4. **Desert and Exaction: Fittingness vs. Enforcement**  
     - *Case:* An agent deserves to bear a burden (e.g., after a violent assault), but no one imposes it.  
     - **Choice A:** Desert is **only about fittingness** (bearing the burden is appropriate, but no one is licensed to enforce it).  
     - **Choice B:** Desert **licenses/requires exaction** (someone—e.g., society, the victim—may/must ensure the burden is borne).  

  5. **Justification of Bearing Burden: Desert vs. Consequences**  
     - *Case:* An agent’s burden leads to severe hardship (e.g., imprisonment ruining their health), far exceeding any "eye for an eye" proportionality.  
     - **Choice A:** Burden-bearing is justified by **desert alone** (it is owed, regardless of outcomes like reform or deterrence).  
     - **Choice B:** Burden-bearing is justified by **consequences** (e.g., it reforms the agent, deters others, or reassures victims).  

  6. **Transferability: Burden Sharing**  
     - *Case:* A third party (e.g., a friend) knowingly volunteers to bear an agent’s burden (e.g., serving their prison sentence).  
     - **Choice A:** Burden is **transferable** (the volunteer can assume it).  
     - **Choice B:** Burden is **non-transferable** (only the agent can bear it).  

  7. **Persistence Over Time: Identity vs. Connection**  
     - *Case:* Between act and burden-bearing, the agent ceases to share any desires, values, or character with their past self (e.g., brain injury causes complete personality/memory loss).  
     - **Choice A:** Burden persists by **identity** (same person = same responsibility, even with no psychological ties).  
     - **Choice B:** Burden requires **connection** (must have ties to the past act, e.g., memory, remorse, or unchanged traits).  

  ---

  #### Occupied Positions (Leaves) in the Decision Space  
  *Combinations are labeled descriptively; historical traditions are rough approximations only.*  

  1. **Intentionalist Fitting Debt**  
     - *Path:* 1A → 2B → 3A → 4A → 5A → 6B → 7A  
     - Characterization: Burden only from wrongful intent; quantifiable debt; desert is fitting but not enforced; non-transferable; persists by identity.  
     - Awkward: No burden for catastrophic but unintended harms (e.g., unforeseen side effects of good acts).  
     - *Roughly:* Kantian deontology.  

  2. **Consequentialist Strict Liability**  
     - *Path:* 1B → 2A → 3A → 4B → 5B → 6B → 7A  
     - Characterization: Burden from consequences (even unforeseeable); quantifiable debt; exaction licensed and justified by societal good; non-transferable; persists by identity.  
     - Awkward: Punishes agents for unavoidable accidents (e.g., unforeseeable medical error).  
     - *Roughly:* Utilitarian strict liability.  

  3. **Character-Change Retributivism**  
     - *Path:* 1A → 2B → 3B → 4B → 5A → 6B → 7B  
     - Characterization: Burden only from wrongful intent; qualitative character change; exaction licensed by desert; non-transferable; requires psychological connection.  
     - Awkward: Burden vanishes if the agent changes completely (e.g., amnesia).  
     - *Roughly:* Aristotelian virtue ethics.  

  4. **Transferable Consequential Debt**  
     - *Path:* 1B → 2B → 3A → 4B → 5B → 6A → 7A  
     - Characterization: Burden from foreseeable consequences; quantifiable debt; exaction licensed and justified by societal good; transferable; persists by identity.  
     - Awkward: Allows scapegoating (e.g., innocent volunteer bears burden for a murderer).  
     - *Roughly:* Some Christian vicarious atonement views.  

  5. **Non-Exacted Qualitative Burden**  
     - *Path:* 1B → 2B → 3B → 4A → 5A → 6B → 7B  
     - Characterization: Burden from foreseeable consequences; qualitative character change; desert is fitting but not enforced; non-transferable; requires connection.  
     - Awkward: Burden exists but no one may enforce it, even to prevent future harm.  
     - *Roughly:* Stoic self-reform.  

  6. **Consequentialist Exaction Without Identity**  
     - *Path:* 1B → 2A → 3B → 4B → 5B → 6B → 7B  
     - Characterization: Burden from consequences (even unforeseeable); qualitative change; exaction licensed and justified by societal good; non-transferable; requires connection.  
     - Awkward: Exaction may harm a reformed agent for social benefit (e.g., punishing a rehabilitated person to deter others).  
     - *Roughly:* Reform-oriented utilitarianism.  

  7. **Fitting Debt With Transfer**  
     - *Path:* 1A → 2B → 3A → 4A → 5A → 6A → 7A  
     - Characterization: Burden only from wrongful intent; quantifiable debt; desert is fitting but not enforced; transferable; persists by identity.  
     - Awkward: Debt transferable even if the volunteer gains nothing (e.g., martyrdom without redemption).  
     - *Roughly:* Some theological substitution doctrines.  

  8. **Desert-Only Burden With Lapse**  
     - *Path:* 1B → 2B → 3A → 4B → 5A → 6B → 7B  
     - Characterization: Burden from foreseeable consequences; quantifiable debt; exaction licensed by desert; non-transferable; requires connection.  
     - Awkward: Exaction required even if it causes net harm (e.g., bankrupting a reformed agent for an old debt).  
     - *Roughly:* Retributivism with psychological conditions.  

  ---

  #### Unoccupied Combinations & Constraints  
  - **Pruned Path:** 1A + 2A is impossible (seed commitment requires a wrongful act; 1A + 2A implies burden without wrongfulness).  
  - **Unoccupied:** Combinations allowing *transfer* (6A) + *intention-triggered burden* (1A) + *consequentialist justification* (5B) are rare.  
    - *Reason:* Unattractive—transferring an intention-based burden for consequentialist reasons undermines moral agency (e.g., letting a volunteer suffer for another’s bad thoughts to "teach a lesson").  
  - **Unexplored:** Paths with *qualitative burden* (3B) + *strict liability* (2A) + *fittingness-only desert* (4A).  
    - *Reason:* Incoherent—qualitative change assumes fault, but strict liability rejects fault; unexplored in literature.  

  ---

  #### Indistinguishable Leaves  
  The tree **cannot separate** these two leaves with current nodes:  
  - **Leaf 3 (Character-Change Retributivism)** and **Leaf 5 (Non-Exacted Qualitative Burden)** both share:  
    - 1A → 2B → 3B → 6B → 7B  
    - They diverge only at Node 4 (exaction) and Node 5 (justification), but these are independent.  
  - *Resolution:* Add a node (e.g., on burden duration) or accept overlap.  

  ---

  #### Highest-Impact Node: Trigger of Burden (Node 1)  
  - **Why:** It sorts students into two irreconcilable camps (intention vs. consequence), forces constraints on strict liability (Node 2), and predicts splits in later nodes (e.g., transferability). Early branching reveals foundational divides before complex cases arise.  

  ---  
  Designed for diagnostic clarity. Students answer cases; the tree maps commitments, not preferences. No prior knowledge required.
