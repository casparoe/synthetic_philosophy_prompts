  ### Decision Tree for Standing to Blame  
  *Use when the target's wrongdoing is not disputed, but the blamer's standing is challenged. Answer sequentially from the top.*

  1. **Did the target actually do something wrong?**  
     *(If no, focus shifts to the accusation's truth, not standing.)*  
     - No → **Leaf: "False alarm"**  
       *Complaint fails: the accusation is untrue. Standing is irrelevant.*  
       *(Awkward: Ignores whether the blamer might have ulterior motives for a false claim.)*
     - Yes → **Proceed to Q2**  
       *(Objection is about the blamer's standing, not the target's action.)*

  2. **Why does the blamer claim the right to speak?**  
     *(Focus on their role, not their record yet.)*  
     - A. "I was personally harmed by the wrong." → **Proceed to Q3**  
     - B. "I hold an office (e.g., treasurer) that requires me to enforce rules." → **Proceed to Q4**  
     - C. "I'm a community member, and this affects us all." → **Proceed to Q5**  
     - D. "I'm a bystander with no special stake or role." → **Proceed to Q6**  

  3. **Has the blamer (victim) ever committed the *same* wrong they’re blaming?**  
     *(e.g., a theft victim who also stole in the past.)*  
     - No → **Leaf: "Victim's right"**  
       *Complaint stands: personal harm grants standing, regardless of past acts.*  
       *(Awkward: A hypocritical victim still gets to blame.*)  
     - Yes → **Leaf: "Lived witness"**  
       *Complaint stands: having done it yourself adds credibility, not hypocrisy.*  
       *(Awkward: Past wrongdoing is reframed as expertise, not a flaw.*)  

  4. **Has the office holder ever broken the *exact rule* they’re enforcing?**  
     *(e.g., a treasurer enforcing expense rules after fudging claims.)*  
     - No → **Leaf: "Office authority"**  
       *Complaint stands: the role grants standing if their record is clean on this rule.*  
       *(Awkward: They could have worse violations elsewhere, ignored here.*)  
     - Yes → **Q4a: Did they acknowledge and fix it?**  
       *(e.g., confessed, repaid funds.)*  
       - Yes → **Leaf: "Redeemed enforcer"**  
         *Complaint stands: owning the violation restores standing.*  
         *(Awkward: Trust hinges on confession, not prevention.*)  
       - No → **Leaf: "Tarnished badge"**  
         *Complaint struck: unowned violations of the same rule void standing.*  
         *(Awkward: Silence erases legitimacy, even if the accusation is true.*)  

  5. **Has the community member done the *same or a very similar* wrong?**  
     *(e.g., dumping rubbish while blaming another for dumping.)*  
     - No → **Leaf: "Community watch"**  
       *Complaint stands: membership grants standing if no similar violations.*  
       *(Awkward: Unrelated serious violations (e.g., fraud) don’t count.*)  
     - Yes → **Q5a: Did they acknowledge and fix it?**  
       - Yes → **Leaf: "Neighbor’s nudge"**  
         *Complaint stands: owning past failures grants standing to advise peers.*  
         *(Awkward: Blaming others is permissible if you’ve admitted your own errors.*)  
       - No → **Leaf: "Unclean hands"**  
         *Complaint struck: unowned similar violations remove standing.*  
         *(Awkward: The community loses a voice if no one else speaks up.*)  

  6. **Has the bystander ever broken *any serious norm* in the community?**  
     *(e.g., fraud, repeated negligence—ignore minor slips.)*  
     - Yes → **Q6a: Did they acknowledge and fix it?**  
       - Yes → **Leaf: "Humbled observer"**  
         *Complaint stands: owning past wrongs grants standing to comment broadly.*  
         *(Awkward: A reformed offender can police others.*)  
       - No → **Leaf: "Stone in a glass house"**  
         *Complaint struck: unowned violations remove standing, even if unrelated.*  
         *(Awkward: Truth is silenced by the blamer’s hypocrisy.*)  
     - No → **Q6b: Could they realistically have done this wrong?**  
       *(e.g., no chance to commit fraud vs. refusing chances to dump rubbish.)*  
       - Yes → **Leaf: "Clean hands"**  
         *Complaint stands: proven commitment to norms grants standing.*  
         *(Awkward: Blamers with no moral "test" pass by default.*)  
       - No → **Leaf: "Untested outsider"**  
         *Complaint struck: no standing if no opportunity to fail.*  
         *(Awkward: Righteousness by circumstance is discounted.*)  

  ---

  ### Key Features & Compromises  
  - **Logical Space**:  
    - 6 questions × 15 possible paths → 10 leaves (5 named, 5 unnamed).  
    - **Empty regions**:  
      - *Victim with owned violation*: Covered but treats it as strengthening standing ("Lived witness"). No one argues this *reduces* standing, as it would conflate with hypocrisy objections.  
      - *Bystander with unrelated owned violation*: Covered ("Humbled observer"), but no leaf argues this grants *extra* standing. Unattractive to most—why reward unrelated offenses?  
      - *Office holder with similar (not same) violation*: Not distinguished from a clean record. Merged to avoid overcomplicating. Loses nuance: e.g., a treasurer who dumped rubbish enforcing fraud rules.  

  - **Where Views Share a Leaf**:  
    - **"Lived witness" (Q3→Yes) and "Redeemed enforcer" (Q4a→Yes)**: Both collapse into "standing restored by owning it." Tree cannot separate them because:  
      - Victimhood (Q3) treats violation as expertise; office (Q4) treats it as a redeemable flaw.  
      - *Why not split?* Would require a "role vs. expertise" question, exceeding the 10-node limit.  

  - **Debatable Nodes (expect splits)**:  
    1. **Q5 (community member)**: What counts as "very similar"? *Example*: Is dumping rubbish "similar" to noise violations? Reasonable people disagree.  
    2. **Q6/6a (bystander)**: What is a "serious norm"? *Example*: Is a white lie comparable to fraud?  
    3. **Q6b (bystander)**: Does "no opportunity" void standing? *Example*: A member too new to cheat can still condemn fraud.  

  - **Unnamed Leaves**:  
    - **"False alarm" (Q1→No)**: Not a standing view; content dispute.  
    - **"Office authority" (Q4→No)**: Standing from role, ignoring other violations.  
    - **"Community watch" (Q5→No)**: Standing from membership, ignoring unrelated violations.  
    - **"Clean hands" (Q6b→Yes)**: Standing from proven integrity.  
    - **"Untested outsider" (Q6b→No)**: No standing without moral testing.  

  - **Your Cases Mapped**:  
    - Parent who quit smoking → **Community member (C)**: Similar wrong (smoking/vaping), owned → **"Neighbor’s nudge"**.  
    - Treasurer fudging expenses → **Office holder (B)**, same rule, unowned → **"Tarnished badge"**.  
    - Never tempted → **Bystander (D)**, no opportunity → **"Untested outsider"**.  
    - Victim who did it themselves → **Victim (A)**, same wrong → **"Lived witness"**.  
    - Spotless bystander for another → **Bystander (D)**, no violations → **"Clean hands"**.  
    - Worse but different wrong → **Bystander (D)**, serious violation → **Q6a** (if owned: **"Humbled observer"**; if not: **"Stone in a glass house"**).  
    - Coerced and excused → Not a violation → **Community member (C)**: **"Community watch"** or **Bystander (D)**: **"Clean hands"**.  
    - Referee broke rule → **Office holder (B)**, same rule → **Q4a** (if owned: **"Redeemed enforcer"**; if not: **"Tarnished badge"**).  
    - Co-op behind on wages → **Office holder (B)** (e.g., board member). If board violated wage norms → **Q4a**. If not, **"Office authority"**.  

  - **Tidy Failure**: The tree cannot isolate "blame requires commitment to the norm" (a view that hypocrisy makes the act insincere). It merges into leaves like **"Stone in a glass house"** or **"Tarnished badge"**. Adding it would require a "sincerity" question, violating the 10-node limit.  

  Print as a one-page flowchart. For disputes, focus on **Q5** (similarity) and **Q6b** (opportunity)—these are where intuitions clash.
