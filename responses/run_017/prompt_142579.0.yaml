prompt: |-
  I have one fifty-minute seminar to move second-year undergraduates from the simple conditional analysis of dispositions — x is fragile iff x would break if struck — to seeing finks and masks as two different problems rather than two instances of one problem. That schema and one lecture's worth of motivation is all they have; no one has read the literature. Don't explain the debate to me; design the session.

  Give me the order the components must be introduced in and what depends on what — in particular whether the reverse-fink or mimicker case belongs before or after the mask case, and what breaks if you swap them. Give me one central object with two or three variant epicycles rather than three unrelated examples, and say what that object must have and must lack to do the work: I tried a live wire wired to a cut-out device and found that the machinery upstaged the point, so I want to know what feature made it fail. Then give me the misconceptions to expect, including that a mask is just a fink we happen to approve of, that adding a ceteris paribus clause repairs the counterfactual, and that the cases show dispositions are really relations to environment — and name the exact point in the sequence where each should be pre-empted rather than corrected afterwards. End with a single novel case that discriminates between students who have the distinction and students who have only learned the labels.

  Two things I want built into the plan rather than attached to it. First, the students will keep identifying the disposition with its causal basis and thereby collapsing the debate into a verbal one: tell me whether to fight that at the outset or let it surface and put it to work. Second, they must leave able to handle an interference mechanism that is part of what makes the object a well-functioning instance of its kind — a rifle whose safety prevents firing when the trigger is pulled, and which seems more, not less, disposed to fire for having it — since I suspect that case quietly breaks the fink/mask contrast as it is usually drawn, and I want it used as a stress test, not set aside. Finally, say what I should openly refuse to explain in fifty minutes.
reasoning: |-
  We are moving from the simple conditional analysis (SCA) to distinguishing finks and masks as two distinct problems. The SCA is: x is disposed to M when C iff if C were to happen, x would M.

  Key distinctions:
  - A fink: A change in the object such that when the stimulus C occurs, the disposition is lost (or gained) just before the stimulus, so the conditional fails. (Example: Martin's wire that is live but when touched, a device instantly makes it dead.)
  - A mask: The disposition is present, but something interferes with the manifestation even when C occurs. (Example: Johnston's fragile glass that is wrapped in packing material; when struck it doesn't break because the packing absorbs the shock.)

  We need to design a seminar that:
  1. Uses one central object and builds variants to show both finks and masks.
  2. Pre-empts misconceptions.
  3. Includes a well-functioning device (like a safety on a rifle) to test the distinction.
  4. Ends with a novel case to test understanding.

  Central object: Let's choose a glass. It's intuitive and the literature often uses it.

  Sequence:

  1. **Review SCA and set up the central case (5 min):**
     - Start with the SCA for fragility: x is fragile iff if x were struck, it would break.
     - Present a normal glass: it is fragile and if struck, it breaks. This satisfies SCA.

  2. **Introduce the fink (15 min):**
     - **Central object variant 1 (fink):** A sorcerer is protecting a fragile glass. The sorcerer vows that if the glass is about to be struck, he will cast a spell that makes it non-fragile (so it becomes toughened) just before the impact. Now, if we strike the glass, what happens? The spell makes it non-fragile at the moment of striking, so it doesn't break. 
       - Problem for SCA: The glass is fragile (it has the intrinsic property that typically leads to breaking when struck) but the conditional "if struck, it would break" is false because of the finkish interference. Hence, SCA fails by having a false conditional for a disposition that is present.
     - **Key feature of fink:** The disposition is lost (or gained) at the time of the stimulus. The object changes its intrinsic properties at the critical moment.

  3. **Introduce the mask (15 min):**
     - **Central object variant 2 (mask):** The same glass is fragile, but it is placed in a sturdy box that prevents breaking when struck. If you strike the box, the glass inside doesn't break. 
       - Problem for SCA: The glass is fragile (it still has the intrinsic fragility) and if it were struck without the box, it would break. But the conditional "if struck, it would break" is false in the current situation because the box is present. However, note: the stimulus condition is being struck. But when we strike the box, is the glass being struck? We have to be careful. Let's rephrase: the glass is struck only if the force is transmitted. But to avoid confusion, we can say: the glass is struck (meaning the force is applied to it) but the box absorbs the force. Alternatively, we can set up the scenario so that the glass is struck (the box is struck and the glass inside is also struck because the box transmits the force but then the packing material inside the box cushions the blow). 
       - Alternatively, use a different example that is clearer: a fragile glass wrapped in bubble wrap. When struck, the bubble wrap absorbs the shock and the glass doesn't break. The glass is still fragile (if you remove the bubble wrap and strike it, it breaks) but the conditional "if struck, it would break" is false in the masked situation.
     - **Key feature of mask:** The disposition is present, but the manifestation is prevented by an external interference that does not remove the disposition. The intrinsic basis remains.

  4. **Contrast fink and mask (5 min):**
     - In the fink case, the disposition itself is lost at the time of the stimulus. The object changes so that it no longer has the disposition when the stimulus occurs.
     - In the mask case, the disposition remains, but the manifestation is blocked by something external. The object does not lose the disposition.

  5. **Address misconceptions during the presentation:**
     - **Misconception 1: A mask is just a fink we approve of.** 
       - Pre-empt at the point of introducing the mask: Emphasize that in the mask case, the intrinsic property (the causal basis) of the object remains unchanged. In the fink, the intrinsic property changes. The mask is an external barrier, while the fink alters the object itself. We can approve or disapprove of both, but the mechanism is different.
     - **Misconception 2: Adding a ceteris paribus clause repairs the conditional.** 
       - Pre-empt after both cases are presented: When we see both failures, point out that adding "all else being equal" doesn't help because in the fink case, the change is part of the circumstances and in the mask, the mask is also part of the circumstances. We don't have a non-arbitrary way to specify what counts as "equal". We can't rule out finks and masks without circularity.
     - **Misconception 3: Dispositions are relations to the environment.**
       - Pre-empt in the contrast step: The fink case shows that the disposition can be lost by a change in the object, while the mask case shows that the environment can prevent manifestation. But the SCA tries to define dispositions without reference to intrinsic properties. We must note that the disposition is a property of the object, but its manifestation depends on the environment. However, the mask doesn't take away the disposition, it just masks it. The fink actually changes the disposition. So the debate is about how to analyze dispositions.

  6. **The well-functioning device: Rifle with a safety (5 min):**
     - Present a rifle that is disposed to fire when the trigger is pulled. But it has a safety switch. When the safety is on, if you pull the trigger, it doesn't fire. However, having the safety doesn't mean the rifle isn't disposed to fire. In fact, we might say it is more disposed to fire (because it is functional and safe when not in use) than a broken rifle that doesn't fire even when the trigger is pulled and safety off.
     - **Stress test:** 
       - Is the safety a mask or a fink?
         - It's a mask: The disposition to fire when the trigger is pulled is still there (the causal basis is intact), but the safety mechanism prevents the firing when it is on. When the safety is off, it fires. So it's masked when the safety is on.
       - But note: the safety is part of what makes the rifle a good rifle. It doesn't remove the disposition, it controls it. This reinforces that masks are not about removing the disposition but about blocking the manifestation in certain conditions.
     - Why not a fink? Because the rifle doesn't lose its disposition to fire when the trigger is pulled when the safety is on. The intrinsic properties (the firing mechanism) are still there, but the safety is an external (or built-in) blocker.

  7. **Novel case for discrimination (5 min):**
     - Present a new case: A plant is disposed to wilt if not watered for a week. However, there is an automatic watering system that detects when the soil is dry and waters the plant. So, if we don't water it, the system waters it and it doesn't wilt.
     - Question: Is this a fink or a mask?
       - Analysis: The plant has the disposition to wilt (it is a wilting-prone plant). The automatic system doesn't change the plant's intrinsic properties (it doesn't make it non-wilting-prone). It just provides water when needed. So it is a mask: the disposition is there, but the manifestation is prevented by the watering. 
       - If the automatic system altered the plant's intrinsic properties (e.g., by injecting a chemical that makes it drought-resistant) just when it's about to wilt, that would be a fink. But in this case, it doesn't.

  8. **Handling the disposition/causal basis confusion:**
     - This should be addressed at the outset. At the start, when introducing the SCA, explicitly separate the disposition (fragility) from its causal basis (molecular structure). Emphasize that the disposition is the property that, in normal conditions, leads to breaking when struck. But the SCA tries to define the disposition without reference to the basis. When we discuss the fink, note that the sorcerer changes the causal basis (so the glass becomes toughened). In the mask, the causal basis remains (the molecular structure is fragile) but the box prevents the breaking. So we are using the causal basis to track the disposition. But the debate is about the analysis of the disposition itself.

  9. **What to refuse to explain:**
     - In fifty minutes, we cannot:
       - Dive into the metaphysics of dispositions (e.g., categorical bases, conditional analyses with world-indexing).
       - Cover all the literature (Lewis's reformed conditional analysis, Bird's dispositional essentialism, etc.).
       - Resolve the debate about whether dispositions are intrinsic or extrinsic.

  **Order of Components:**
  1. Review SCA with normal glass (5 min)
  2. Fink case with sorcerer (15 min) -> Here we break SCA by showing the conditional fails even though the disposition is present at the time just before the stimulus.
  3. Mask case with glass in bubble wrap (15 min) -> Break SCA again, but note the difference: the disposition remains, but the manifestation is blocked.
  4. Contrast fink and mask (5 min) -> Pre-empt misconceptions 1 and 3 here.
  5. Rifle with safety as a mask and stress test (5 min) -> Pre-empt misconception 1 again if needed and show that masks can be part of well-functioning devices.
  6. Novel case: the plant with automatic watering (5 min) -> Test understanding.

  **Why not swap fink and mask?**
  - The fink is introduced first because it directly attacks the conditional by changing the object at the time of stimulus. The mask then shows a different kind of interference without changing the object. If we did mask first, students might think that the mask is the only problem and then when we introduce the fink, they might try to explain it as a mask. By doing fink first, we establish that the object can change, then the mask shows that even without a change, the manifestation can be blocked. Swapping might lead to conflating the two.

  **Central object and variants:**
  - Central object: A glass.
  - Must have: An intrinsic property (causal basis) for the disposition (fragility) that is modifiable (for fink) and that can be present while the manifestation is blocked (for mask).
  - Must lack: Complicated machinery that distracts (like the live wire with cut-out). The sorcerer and bubble wrap are simple and intuitive.

  **Why the live wire failed?**
  - The machinery (cut-out device) upstaged the point because it introduced technical details (how the device works) that distracted from the philosophical point. The sorcerer and bubble wrap are more easily understood as altering the situation without needing to understand engineering.

  **Summary of misconceptions and pre-emption points:**
  1. **Mask as approved fink:** Pre-empt during the mask introduction and in the contrast. Stress that the mask does not change the intrinsic properties of the object, while the fink does.
  2. **Ceteris paribus:** Pre-empt after both cases are presented. Point out that we cannot non-arbitrarily specify what counts as "other things being equal" because finks and masks are ways in which other things are not equal.
  3. **Dispositions as relations to environment:** Pre-empt in the contrast by noting that the mask case shows the environment matters, but the fink case shows that the object itself can change. The SCA tries to capture the disposition with a conditional that is sensitive to both, but fails in different ways.

  **Final Novel Case (for discrimination):**
  - As above: the plant with automatic watering. Students who see it as a mask (correct) have the distinction. Those who call it a fink might not have understood that the plant's intrinsic properties are unchanged.

  **Plan in Time:**
  - 0-5 min: SCA and normal glass.
  - 5-20 min: Fink (sorcerer glass) and discussion.
  - 20-35 min: Mask (glass in bubble wrap) and discussion, contrasting with fink and pre-empting misconceptions.
  - 35-40 min: Rifle with safety to show a well-functioning mask.
  - 40-45 min: Novel case (plant) for discrimination.
  - 45-50 min: Wrap up and questions.

  This plan should achieve the goal.
answer: |-
  Below is a structured fifty-minute seminar plan designed to move students from the simple conditional analysis (SCA) of dispositions to distinguishing finks and masks as two distinct problems. The plan uses a **single central object** (a glass) with variants to build intuition, pre-empts key misconceptions at specific points, incorporates a well-functioning device (a rifle safety) as a stress test, and ends with a novel discrimination case. Components are ordered to ensure conceptual dependencies are clear, and I specify what must be omitted due to time constraints.

  ---

  ### **Seminar Structure & Timing**
  **(Total: 50 minutes)**

  1. **Review SCA and Introduce Central Object (5 min)**  
     - Restate SCA: "x is disposed to M when C iff if C were the case, x would M."  
     - Use a **glass** as the central object: "A glass is fragile (disposed to break when struck) iff if it were struck, it would break."  
     - **Pre-empt disposition/causal basis confusion here:** Explicitly distinguish the disposition (fragility) from its causal basis (e.g., molecular structure). Say: "Fragility isn't the molecular structure itself—it's the property we attribute because of that structure. SCA tries to define dispositions without referencing hidden structures, using only the conditional." *This fights the confusion upfront to prevent verbal disputes.*

  2. **Introduce Fink Case (Reverse-Fink/Mimicker First) (15 min)**  
     - **Variant 1 (Reverse-Fink):** A fragile glass protected by a sorcerer. The sorcerer vows: "If this glass is about to be struck, I’ll instantly make it non-fragile (e.g., magically toughen it)." Strike it → it doesn’t break.  
       - **Problem:** The glass is fragile (has the causal basis), but the conditional ("if struck, it would break") is false. The disposition is lost *at the moment of stimulation* due to intrinsic change.  
     - **Why reverse-fink first?** It’s the simplest SCA failure: the object’s properties change *during* the stimulus. This sets up masks as a *different* problem (extrinsic interference).  
     - **Epicycle 1 (Mimicker):** A non-fragile (tough) glass, but the sorcerer magically makes it fragile *only* when struck. It breaks when struck → but it wasn’t fragile beforehand.  
       - **Reinforces fink:** Shows disposition gain/loss at stimulus time. Contrast with original glass: here, the conditional is true, but the disposition was absent.  
     - **DO NOT SWAP WITH MASK:** If masks are taught first, students misclassify finks as "environmental interference." Finks require intrinsic change, which masks lack. Swapping breaks the conceptual contrast.

  3. **Introduce Mask Case (15 min)**  
     - **Variant 2 (Mask):** The same fragile glass, but placed in **bubble wrap**. When struck, the wrap absorbs the impact → it doesn’t break.  
       - **Problem:** The glass is fragile (causal basis intact), but the conditional ("if struck, it would break") is false. The disposition is *present* but *manifestation is blocked* extrinsically.  
     - **Epicycle 2 (Time-Delay Mask):** Bubble wrap that dissolves after 5 seconds. If struck *after* dissolution, it breaks. Shows masks don’t alter the object.  
     - **Pre-empt misconceptions here:**  
       - **"Masks are just finks we approve of":** Emphasize: "In the fink, the sorcerer *changes the glass* (intrinsic). In the mask, the bubble wrap *doesn’t touch the glass’s fragility* (extrinsic barrier). Approval is irrelevant—focus on location of interference."  
       - **"Dispositions are relations to environment":** Counter: "Masks show environment matters for *manifestation*, but finks show the *disposition itself* depends on intrinsic properties. SCA fails both ways, but differently."  
     - **Why after fink?** Fink establishes intrinsic change as the problem; mask then shows extrinsic blockage without intrinsic change. Reverse order obscures this.

  4. **Contrast Fink vs. Mask & Introduce Stress Test (10 min)**  
     - **Side-by-side comparison:**  
       - Fink: Disposition lost/gained *during* stimulus (intrinsic change).  
       - Mask: Disposition *stable*, manifestation blocked (extrinsic interference).  
     - **Stress Test: Well-functioning rifle with a safety** (disposed to fire when trigger pulled).  
       - Safety on: Trigger pulled → no fire (conditional false).  
       - **Is this a fink or mask?** Mask! The rifle’s firing mechanism (causal basis) is intact—the safety is an extrinsic blocker. Crucially, the rifle is *more disposed to fire* (i.e., more reliable) *because* of the safety—it prevents accidents but doesn’t remove the disposition.  
       - **Pre-empts "ceteris paribus" misconception:** Students will say, "SCA works if we add 'all else equal.'" Retort: "What counts as 'equal'? If we exclude masks, SCA becomes circular—we’d need to say 'if struck *and not masked*, it would break.' But that uses 'masked' to define fragility!" Use the rifle: "Is the safety 'abnormal'? No—it’s a *design feature*. SCA can’t handle this without cheating."  
     - **Why here?** The rifle tests the fink/mask distinction: it’s clearly a mask (no intrinsic change), but its functionality forces students to see masks aren’t "failures"—they’re compatible with strong dispositions.

  5. **Novel Discrimination Case (5 min)**  
     - **Case:** A caffeine powder is disposed to dissolve when stirred in water. But it’s packaged in a capsule that only dissolves in hot water (≥80°C). In cold water: stirred → capsule doesn’t dissolve → powder remains intact.  
     - **Diagnostic question:** "Is this a fink or mask? Why?"  
       - **Understanding distinction:** Mask! The powder’s solubility (causal basis) is unchanged; the capsule extrinsically blocks dissolution in cold water (like bubble wrap).  
       - **Superficial learning:** Students who say "fink" focus on the outcome (no dissolution) and miss the stability of the disposition. Those who say "mask" but cite approval ("the capsule is helpful") miss the mechanism.  
     - **Reveal answer:** Use it as an exit ticket—collect responses to gauge understanding.

  ---

  ### **Why the Central Object (Glass) Works**
  - **Must have:**  
    - A clear causal basis (molecular structure for fragility) that can be modified (for fink) or shielded (for mask).  
    - Intuitive manifestation (breaking) and stimulus (striking) to avoid distracting details.  
  - **Must lack:**  
    - Machinery (e.g., your live wire cut-out). Wires/cut-outs fail because they **conflate fink and mask mechanisms**: The cut-out *changes* the wire (fink-like) but also *blocks* current (mask-like). This muddles the distinction. The glass/sorcerer is cleaner: magic alters the glass (fink), while bubble wrap is passive (mask).  

  ---

  ### **Misconception Management**
  - **Disposition = causal basis:** Fought at the outset (Step 1). If it resurfaces, refer back: "Does the sorcerer change the basis? Yes, so it’s a fink. Does bubble wrap? No, so mask."  
  - **Mask as "approved fink":** Pre-empted during mask introduction (Step 3) by stressing intrinsic/extrinsic difference.  
  - **Ceteris paribus repairs SCA:** Pre-empted during stress test (Step 4) using the rifle’s safety to show "all else equal" is unworkable.  
  - **Dispositions = environmental relations:** Pre-empted during mask discussion (Step 3) by contrasting with fink’s intrinsic change.  

  ---

  ### **What to Refuse to Explain**
  - **Omit in 50 minutes:**  
    - Reformed conditional analyses (e.g., Lewis’s).  
    - Dispositional essentialism or categorical vs. dispositional properties.  
    - Historical context (e.g., Martin vs. Lewis).  
    - Bird-style cases (e.g., electro-finks)—too technical.  
  - **Say openly:** "We’re isolating the fink/mask distinction today. We won’t solve SCA’s problems or dive into metaphysics—focus on why these are *two* issues."  

  ---

  ### **Key Dependencies**
  - **Fink before mask:** Finks are ontologically simpler (object-internal change). Masks require understanding stable dispositions + external blockers. Reversing them makes masks seem like the "only" problem, and finks get misread as environmental.  
  - **Rifle after both:** It assumes students grasp intrinsic/extrinsic distinction. Used late as a stress test to solidify the concept.  
  - **Novel case last:** Tests application without cues from prior examples.  

  This plan ensures students see finks and masks as distinct by leveraging a core object, pre-empting pitfalls, and using the rifle to validate the distinction under functional complexity. The discrimination case (caffeine capsule) reveals whether they grasp mechanisms or just labels.
