prompt: |-
  I'm a graduate student in a philosophy of biology seminar, and before we get to the section on functions I want to fix what we should be asking of an account rather than grading the readings one at a time. Write me the specification: what any adequate theory of biological function has to deliver — which distinctions it must respect (a trait's function versus its merely useful side effects, having a function versus performing it, the function of a token versus of a type, function versus the effect a trait happens to produce now), which cases it has to get right, and which results from biology or medicine it can't be inconsistent with — each paired with the case or consideration that makes it a requirement rather than a preference of one camp. The four cases I most want handled are the very first proto-heart, which pumped before any selection history stood behind it; a protein designed from scratch in a lab and wired into a synthetic cell, where it does work no lineage has ever been selected for; a muscle flap moved by a surgeon to a new site where it now performs a task it never performed before; and a failing heart that still has a function it can no longer carry out. Then mark which requirements you take to be non-negotiable and which are demands a camp smuggles in because its own theory happens to meet them, including any that are really inherited from wanting functions to do work elsewhere — in artifacts, in the philosophy of mind, in medicine — rather than from biology; flag any pair of requirements you suspect can't be jointly satisfied, since that tension is the part I most want to see. Close by scoring the selected-effect (etiological) account and the causal-role (systemic, dispositional) account in two or three sentences each, and name the single requirement that eliminates the most otherwise-plausible theories.
reasoning: |-
  Okay, the user is a graduate student in a philosophy of biology seminar preparing for a section on biological functions. They want to establish rigorous criteria for evaluating theories of function before diving into specific readings. 

  Hmm, this is a sophisticated request - they're clearly trying to avoid getting bogged down in partisan debates between etiological and causal-role accounts. The four cases they mention (proto-heart, synthetic protein, repurposed muscle, failing heart) are excellent stress tests. I should treat these as non-negotiable benchmarks since they represent core biological phenomena any theory must handle.

  The tricky part will be distinguishing genuine requirements from theory-laden preferences. For example, the demand that functions be "proper" to a trait often smuggles in etiological assumptions. And the artifact analogy requirement probably imports external philosophical baggage - biological functions aren't designed like screwdrivers. 

  *scribbles mentally* Must separate: 
  - Biological necessities (like distinguishing function from accident) 
  - Interdisciplinary constraints (like medical applications) 
  - Theoretical desiderata (like explanatory power) that aren't dealbreakers

  Biggest tension I see: How can the same account handle both the proto-heart (no history) and the failing heart (retrospective function)? That might be the litmus test that eliminates most theories. The synthetic protein case will murder traditional etiological accounts, while causal-role theories choke on the repurposed muscle. 

  *checks watch* Better structure this carefully. The specification needs: 
  1. Distinction requirements with biological examples 
  2. Case-based requirements using their four scenarios 
  3. Boundary conditions from biology/medicine 
  4. Flags for contested/non-negotiable items 

  For scoring: Etiological accounts fail spectacularly on novelty but ace dysfunction. Causal-role handles novelty well but stumbles on misperformance. The "dysfunction requirement" is probably the killer - it's why we can't just reduce functions to current causal contributions.
answer: |-
  Here’s a specification for an adequate theory of biological function, grounded in your cases and core philosophical distinctions. Requirements are categorized, paired with their justifications, and flagged for negotiability/tensions.  

  ### **I. Essential Distinctions Any Theory Must Capture**  
  *(Non-negotiable; failure here voids the theory)*  
  1. **Function vs. Accidental Benefit**  
     - *Requirement*: Distinguish a trait’s *proper function* from useful side effects (e.g., the heart’s blood-pumping function vs. its heartbeat sound’s use in diagnosis).  
     - *Case Justification*: Medical practice relies on this (treating a dysfunctional heart targets pumping, not sound).  
  2. **Having a Function vs. Performing It**  
     - *Requirement*: A trait can *have* a function even when incapable of performing it (e.g., a failing heart).  
     - *Case Justification*: **Failing heart case** (still "has" a pumping function despite incapacity).  
  3. **Token Function vs. Type Function**  
     - *Requirement*: Explain why a *token trait* (e.g., a specific heart) can have a function derived from its type (e.g., hearts in general), while allowing for novel token functions.  
     - *Case Justification*: **Muscle flap repurposed by surgery**: The token muscle gains a *new* function unrelated to its evolutionary type-function.  
  4. **Function vs. Current Causal Role**  
     - *Requirement*: Separate what a trait *is for* (function) from what it *happens to do* in a context (e.g., a beaver’s dam-building vs. a dam accidentally flooding a forest).  
     - *Case Justification*: Biology requires stability of function across contexts (e.g., a heart transplanted into a different species still has a pumping function).  

  ### **II. Non-Negotiable Case-Based Requirements**  
  *(Failure on any eliminates the theory)*  
  1. **Proto-heart (novel trait without history)**  
     - *Requirement*: Assign a function to the first pulsating vessel in early organisms *before* natural selection established a lineage.  
     - *Why?*: Functions must explain *emergence*, not just maintenance.  
  2. **Synthetic Protein in a Lab-Created Cell**  
     - *Requirement*: Assign a function to a de novo protein designed *without evolutionary history* but integrated to perform a task (e.g., toxin degradation).  
     - *Why?*: Synthetic biology creates functions independent of selection history.  
  3. **Surgically Repurposed Muscle Flap**  
     - *Requirement*: Explain how a token trait (e.g., back muscle) gains a *new* function (e.g., cheek movement) when relocated, overriding its evolutionary function.  
     - *Why?*: Clinical reality (e.g., reconstructive surgery) demands token-function plasticity.  
  4. **Failing Heart**  
     - *Requirement*: Acknowledge that a heart can *have* a function (pumping) while being unable to perform it.  
     - *Why?*: Concepts of dysfunction/disease presuppose normative function.  

  ### **III. Boundary Conditions from Biology/Medicine**  
  *(Non-negotiable; inconsistency here = biological inadequacy)*  
  - **Dysfunction in Medicine**: The theory must align with medical diagnoses (e.g., a “failing liver” implies a normative function *independent* of current performance).  
  - **Evolutionary Novelty**: Must accommodate traits evolving new functions (e.g., feathers evolving for thermoregulation before flight).  
  - **Exaptation**: Explain how a trait can acquire a new function without losing its old one (e.g., bird wings for flight vs. display).  

  ---

  ### **IV. Contentious/Smuggled Demands**  
  *(Often reflect theoretical bias, not biology)*  
  1. **Function as "Proper" to a Trait**  
     - *Smuggled by*: Etiological theories (assumes function must be *the* selected effect).  
     - *Why contentious?*: Ignores cases like the **repurposed muscle flap** or **synthetic protein**.  
  2. **Functions Require a "System Goal"**  
     - *Smuggled by*: Causal-role theories (assumes functions serve organism/survival).  
     - *Why contentious?*: Biology has no teleological "goals" (e.g., selfish genes, cancer).  
  3. **Artifact Analogy**  
     - *Smuggled by*: Theories importing philosophy of mind/design (e.g., "functions as design purposes").  
     - *Why contentious?*: Biological traits aren’t designed; this biases toward intentionality.  
  4. **Functions Must Explain Origins**  
     - *Smuggled by*: Etiological theories (functions *must* reference history).  
     - *Why contentious?*: **Proto-heart** and **synthetic protein** have functions without historical origins.  

  ---

  ### **V. Suspected Tensions (Likely Irreconcilable)**  
  1. **Novelty vs. Normativity**:  
     - *Tension*: Explaining **proto-heart/synthetic protein** (novelty) requires *non-historical* functions, but **failing heart** (normativity) demands *stability* beyond current causation.  
     - *Theories broken*: Pure causal-role (fails failing heart), pure etiological (fails novelty).  
  2. **Token Plasticity vs. Type Fixity**:  
     - *Tension*: **Repurposed muscle** shows tokens can gain new functions, but evolutionary biology treats types as having stable functions.  
     - *Theories broken*: Etiological (fixates on type-history), systemic (struggles with token-context relativity).  

  ---

  ### **Scoring Major Theories**  
  - **Selected-Effect (Etiological) Account**:  
    > ★★★ for **failing heart**, type functions, and normativity; ★☆☆ for **proto-heart**, **synthetic protein**, and **repurposed muscle** (fails novelty/history-free cases).  
  - **Causal-Role (Systemic) Account**:  
    > ★★★ for **proto-heart**, **synthetic protein**, and current causal roles; ★☆☆ for **failing heart** (can’t ground normativity of dysfunction) and **repurposed muscle** (overly context-dependent).  

  ---

  ### **The Eliminator Requirement**  
  **The Failing Heart Requirement** (a trait *has* a function it *cannot perform*) eliminates the most otherwise-plausible theories. It sinks:  
  - Naive causal-role accounts (if it’s not pumping, pumping isn’t its current causal role).  
  - "Propensity" etiological accounts (if it can’t perform, it has no survival propensity).  
  - Goal-contribution accounts (if the organism dies, the heart contributes no goal).  
  This forces theories to grapple with **normativity**—the hardest problem in functions.  

  This specification exposes why no consensus exists: **Novelty** and **Normativity** pull in opposite directions. Your cases are excellently chosen to test this fracture.
