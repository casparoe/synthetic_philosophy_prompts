answer: |-
  ## Research Proposal: Conditional Immunity? Testing Prioritarianism's Levelling-Down Objection Across Action and Uncertainty

  **Project Title:** Prioritarianism’s Fragile Shield: A Systematic Investigation of Levelling Down Under Risk and Differential Intervention Types

  **Principal Research Question:** Does prioritarianism's standard immunity to the levelling-down objection (LDO) universally hold when systematically tested against the dual axes of *intervention type* (subtractive vs. pre-emptive) and *outcome context* (actual vs. prospective), and if not, what are the normative implications for the theory's structure (particularly regarding the role of concavity) and its applicability under uncertainty?

  ### 1. The Challenge: Why the Standard Reply is Insufficient
  Prioritarianism is widely held to evade the LDO by ensuring that any worsening of an individual’s absolute well-being level, without compensating gains for others, strictly decreases the overall value of an outcome. This relies on the strictly concave priority function applied to *actual* well-being levels. However, this standard defence implicitly assumes:
  *   **Action Frame:** Focus on actively *subtracting* well-being (levelling down achieved by making someone *worse off*).
  *   **Outcome Certainty:** Evaluation of only the *actual*, realized outcome state of the world.
  *   **Monolithic Concavity:** The concave transformation simultaneously captures both (a) the *priority weighting* (giving greater weight to benefits for the worse off) and (b) *aversion to dispersion in individual well-being outcomes* (risk aversion).

  Our hypothesis is that prioritarianism's immunity may fracture when these assumptions are relaxed, specifically:
  *   **Pre-emptive Levelling:** Withholding a potential benefit from a better-off individual that would have increased inequality, without actively worsening them (e.g., choosing Policy A over Policy B where B gives a benefit only to the better-off, leaving the worse-off unchanged).
  *   **Prospective Levelling:** Evaluating states where levelling occurs not in the actual outcome, but in counterfactual branches of a risky prospect (as in the gamble case described) or in expectation.
  *   **Separated Roles:** When the concavity’s risk-aversion role is distinguished from its priority-weighting role.

  The initial gamble case illustrates the fracture point: under a *realized-well-being* prioritarianism, the bad branch (level 20) represents a state where the worse-off individual is at an absolute low *and* no one else is better off than they would have been under the alternative (sure thing) policy. While not levelling down the *actual* world if the gamble is chosen, it involves endorsing a policy where a *possible* outcome state is levelled down relative to the alternative policy's outcome in that same state. The standard "immunity" defence, focused on actual subtractive actions in the realized world, does not address this prospective, pre-emptive scenario. This raises critical questions: Is this a genuine LDO variant, exposing a deeper tension in prioritarianism, or is it misdiagnosed (e.g., a failure of ex-post Pareto)? Does the concavity function obscure distinct normative concerns?

  ### 2. Research Methodology: Structured Case Analysis and Model Refinement (3-Year Plan)
  This project eschews pure axiomatization in favour of a structured case-based analysis integrated with formal modelling. Axiomatization risks pre-determining outcomes by embedding assumptions within the axioms themselves, potentially missing the nuances revealed by intuitively problematic cases arising from real-world decision contexts under risk. Our method prioritizes identifying concrete pressure points first.

  *   **Year 1: Mapping the Conceptual Terrain & Case Development**
      *   **Task 1.1:** Rigorously define the 2x2 matrix: Intervention Type (Subtractive / Pre-emptive) x Outcome Context (Actual / Prospective). Define "prospective" precisely (unrealized branch, expected value evaluation, ex-ante perspective).
      *   **Task 1.2:** Develop and refine a battery of targeted thought experiments for each cell of the matrix, including variations in population size, baseline levels, and degree of concavity. Crucially, include cases testing the third contrast: whether levelling down affects the priority weight bearer directly or shifts the identity of the worst-off.
      *   **Task 1.3:** Analyse standard prioritarianism’s verdicts on these cases. Identify key pressure points and potential fractures in immunity.
      *   **Deliverable:** A catalogued set of cases demonstrating where prioritarianism *appears* vulnerable to LDO-like objections under specific combinations of intervention type and uncertainty.

  *   **Year 2: Model Building & Distinguishing Concavity's Roles**
      *   **Task 2.1:** Formalize distinct prioritarian models:
          *   Model A: Standard (Concavity applied to realized well-being; aggregates *actual* outcomes).
          *   Model B: Expectational (Concavity applied to *expected* well-being; aggregates *ex-ante*).
          *   Model C: Ex-Post Aggregative (Concavity applied to *realized* well-being; aggregates over *possible* outcomes/states, e.g., expected *transformed* value).
          *   Model D: Separated Roles (e.g., a prioritarian weighting function applied to a risk-sensitive *measure* of individual advantage).
      *   **Task 2.2:** Systematically apply each model to the Year 1 cases. Map precisely where each model endorses something analogous to levelling down (e.g., preferring a distribution where someone is worse off without anyone being better off, either actually or prospectively).
      *   **Task 2.3:** Assess the normative coherence of each model’s verdicts, particularly in fracture-point cases. Is the problematic verdict a true LDO or a different objection (e.g., ex-post Pareto violation, implausible risk attitudes)?
      *   **Deliverable:** A formal taxonomy of prioritarian variants and their susceptibility profiles across the case matrix.

  *   **Year 3: Synthesis, Implications & Deliverable Development**
      *   **Task 3.1:** Synthesize results. Determine under what conditions (model, intervention type, outcome context) prioritarianism loses immunity. Does the matrix hold, or do cells collapse? Which contrast is primary?
      *   **Task 3.2:** Analyse the implications for prioritarianism's core commitments. Does the fracture point reveal a need to disentangle priority from risk aversion? Does it challenge the claim that prioritarianism fundamentally avoids the LDO’s core absurdity?
      *   **Task 3.3:** Develop the Practical Decision Framework: Translate findings into actionable guidance for policymakers and practitioners aggregating benefits under uncertainty. This will specify:
          *   Which prioritarian model(s) avoid problematic endorsements of levelling down across contexts.
          *   Clear conditions under which standard prioritarianism is safe to apply.
          *   How to structure decision procedures (e.g., ex-ante vs. ex-post evaluation) to avoid inadvertent prospective levelling down.
          *   Implications for setting risk aversion parameters within prioritarian cost-benefit analysis.
      *   **Task 3.4:** Dissemination & Thesis Writing.
      *   **Deliverable:** A) Doctoral Thesis; B) A practitioner-focused "Framework for Prioritarian Decision-Making Under Uncertainty".

  ### 3. Range of Possible Conclusions & Deciding Factors
  *   **Conclusion 1 (Immunity Conditionally Holds):** Prioritarianism (in its standard or a slightly modified form) remains immune to the *core* LDO (actual, subtractive) but exhibits LDO-like problems *only* in specific prospective/pre-emptive contexts. These problems might be reclassified (e.g., as unacceptable risk imposition or ex-post Pareto violations) but still challenge prioritarianism's practical application under risk. *Decider:* Clear demonstration that the problematic cases involve different normative intuitions distinct from the core LDO absurdity.
  *   **Conclusion 2 (Concavity's Dual Role is Key):** The apparent LDO vulnerability stems primarily from the conflation of priority weighting and risk aversion within the concave function. Separating these roles (e.g., prioritarian weighting of risk-adjusted advantage) restores immunity across the matrix. *Decider:* Models with separated roles (Model D) consistently avoid problematic verdicts without sacrificing prioritarian intuition, while others fail.
  *   **Conclusion 3 (The Matrix Collapses - Prospectivity Dominates):** The distinction between subtractive and pre-emptive levelling is less significant than the actual/prospective distinction. Prioritarianism's core vulnerability lies in how it handles *prospectivity* (unrealized branches, expectation). *Decider:* Analysis reveals that Intervention Type variations within the Prospective cell yield similar verdicts and challenges, while the Actual cell remains robustly immune regardless of action type.
  *   **Conclusion 4 (Deep Fracture - Immunity is Not Core):** Prioritarianism, when applied consistently under risk, endorses states of affairs recognisable as levelled down (prospectively, and potentially pre-emptively) in ways that mirror the core objection to egalitarianism, challenging its purported advantage. *Decider:* Persistent, intuitive parallels between the problematic prioritarian verdicts and the core LDO absurdity across multiple cases and model formulations.

  ### 4. Useful Deliverable: The Practical Framework
  The project will produce a concise, accessible **Framework for Prioritarian Decision-Making Under Uncertainty**. This will guide policymakers, health economists, and social planners in applying prioritarian principles without inadvertently endorsing levelling down in prospect or through inaction. It will specify:
  *   Recommended prioritarian model(s) for different decision contexts (e.g., small vs. large populations, high vs. low stakes).
  *   Explicit protocols for handling risk (e.g., whether to evaluate ex-ante or aggregate ex-post transformed values).
  *   Red flags indicating situations where standard prioritarianism might lead to counterintuitive or undesirable levelling-down implications.
  *   Guidance on parameterising risk sensitivity distinct from priority weighting.

  ### 5. Genuine Failure Conditions & Risks
  *   **Matrix Collapse:** A significant risk is that rigorous analysis reveals three of the four cells (e.g., Actual/Subtractive, Actual/Pre-emptive, Prospective/Subtractive) are either unproblematic or reduce to the same core issue as the fourth (Prospective/Pre-emptive), rendering the 2x2 structure merely illustrative rather than analytically crucial. *Mitigation:* Focus Year 1 heavily on establishing clear, distinct intuitive pulls for cases in each cell. If collapse occurs, the project refocuses on the single critical case type (likely Prospective/Pre-emptive) and its implications.
  *   **Project Bifurcation:** The project risks splitting into two loosely connected endeavours: (A) investigating the *currency* to which prioritarian weighting is applied (e.g., realized well-being, expected well-being, risk-adjusted advantage) and (B) investigating the *treatment of risk* in aggregation (ex-ante vs. ex-post). *Mitigation:* Actively integrate these strands through the case analysis (Task 1.3, 2.2) and model development (Task 2.1), constantly asking how choices about currency interact with choices about risk aggregation to produce the target verdicts. The synthesis phase (Task 3.1, 3.2) must explicitly address their interplay.
  *   **Triviality of Findings:** The fracture points identified might be easily resolved by minor, already-acknowledged tweaks to standard prioritarianism (e.g., universally adopting ex-post aggregation of transformed values), rendering the project's contribution incremental. *Mitigation:* Focus on demonstrating that even "resolved" models generate significant normative tensions or practical complexities (Task 2.3, 3.2) and that the distinctions uncovered have real-world implications captured in the Framework (Task 3.3).
  *   **Inconclusive Intuitions:** Core cases might fail to elicit stable, widely shared intuitions, making it difficult to definitively label a prioritarian verdict as a problematic "levelling down". *Mitigation:* Employ a range of cases, varying stakes, baselines, and populations. Ground intuitions in potential real-world applications (e.g., resource allocation in health or development). Acknowledge where intuitions diverge and focus on structural implications of different modelling choices.

  This project offers a novel, systematic investigation into a potential vulnerability in a major theory of distributive justice. By rigorously testing prioritarianism across dimensions crucial for real-world application, it promises to refine the theory, clarify the scope of the levelling-down objection, and provide practical tools for ethical decision-making under uncertainty.
