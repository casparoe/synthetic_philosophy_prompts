prompt: |-
  I'm a PhD student in moral philosophy (sort of adjacent to population ethics) and I've been asked to take a one-off ninety-minute seminar for second-year undergrads on the scale argument about insect sentience. They've had a term of utilitarianism and one week on expected utility in decision theory, but basically no philosophy of mind, and none of them will have read anything on animal sentience — so don't give me readings, they won't do them. The room will be split: two or three have clearly been reading effective-altruism-adjacent stuff online and already arrive thinking insects are obviously the top priority, and the rest think the whole idea is a joke. I've got a whiteboard and no slides. I don't want you to explain the argument to me — I know it. I want a plan for how to teach it, and my current one is definately broken.

  The bit I keep tripping over is the order. My supervisor says open with the question "what would have to be true for the number of individuals to stop mattering?" before I even say the word sentience, on the grounds that if you lead with the headcount you've lost the sceptics in the first five minutes. I'm not convinced: it seems to me you can't ask that until they have some grip on what the currency even is — whether we're aggregating over creature-lives, over seconds of experience, or over some "a whole life's worth of welfare" unit — because every time I try it the unit quietly shifts halfway through the argument, and I've started calling that the denominator problem. On top of that, a mate who works on insect welfare suggested I separate a credence in sentience from a credence about intensity: you might be reasonably confident an aphid has some kind of experience and yet be completely clueless about how bad a second of it is, and the scale argument multiplies both, so it inherits uncertainty from both sources and students collapse them into one number. And then there's the point I most want to land and have no idea where to put: people treat the tiny per-creature probability as if it gets averaged away over a trillion individuals, but the evidence isn't independent across species — if bees are sentient that's evidence about ants — so the "trillion coin flips" intuition is doing work it shouldn't. Say what has to come before what and why, and what breaks if I get the sequence wrong.

  On the example that carries the whole thing: I've been going back and forth between an ant nest under someone's patio (enormous numbers, one individual they can picture, an intervention anyone could actually perform — but the numbers are made up and it invites "so just don't pour boiling water on ants" as the takeaway) and a wheat field sprayed with an aphicide (better-behaved numbers, more clearly policy-shaped — but no single creature to picture and it drags in rows about food prices). Tell me which to build around and why, and what the example has to have and has to lack to do the job. Then the misconceptions, in the order they'll actually arise rather than a tidy list: I'm expecting nociception-is-pain, "0.1% means we can ignore it", "tiny brain so the pain is proportionally shallow", "so you're saying we should all stop eating X", and the collapse into either "obviously insects win" or "obviously we can't do anything either way" — and for each, where in the sequence I head it off instead of rebutting it at the end. Give me one question for the last ten minutes that tells me they've got the structure rather than the conclusion, ideally something where changing one variable — duration instead of headcount, or making the credences correlated, or holding the population at carrying capacity — flips the answer. And tell me what I should openly refuse to get into in ninety minutes and how to say so without sounding like I'm hiding something; I'm guessing the candidate neuroscience theories of consciousness and anything about whether prevented deaths get replaced by later births, but you tell me.
reasoning: |-
  Okay, let me tackle this teaching challenge step by step. The user is a PhD student in moral philosophy preparing a 90-minute undergrad seminar on insect sentience scale arguments, facing classroom polarization and conceptual pitfalls. 

  First, I need to understand the core structural problems they've identified: denominator confusion (welfare units shifting), credence vs intensity conflation, and non-independent evidence across species. The sequence of presentation seems crucial here - getting the scaffolding wrong could derail the whole session.

  For the opening, I disagree with their supervisor's approach. Jumping straight to "when does number stop mattering?" risks losing students who don't yet grasp what's being counted. Better to start with a concrete welfare scenario they can all engage with - perhaps the patio ant nest example. It creates immediate ethical tension between relatable human action (pouring boiling water) and scale (millions of potential sufferers). This anchors the denominator problem visually: are we counting lives? Seconds of suffering? The whiteboard can map this ambiguity.

  The wheat field example might be better reserved for later policy discussions, as its abstraction could alienate skeptics early on. But the patio scenario needs tweaking to prevent simplistic "just don't boil ants" conclusions. Maybe add irrelevance - the ants are damaging infrastructure and non-lethal removal is impractical. This forces engagement with scale rather than avoidance.

  Now the sequence breakdown:
  1. Establish sentience as capacity for valenced experience (not consciousness debates)
  2. Introduce denominator problem through the ant scenario
  3. Distinguish credence (P(sentient)) from intensity (how bad is suffering?) as separate multipliers
  4. Scale argument mechanics with clear units (seconds of suffering)
  5. Only then address the "trillion flips" fallacy by showing bee sentience evidence updates ant probabilities

  Timing is tight: 20 mins for steps 1-2, 20 for 3-4, 15 for 5, leaving 30 for discussion and misconceptions.

  For misconceptions:
  - Nociception vs pain: preempt when defining sentience by emphasizing valenced experience requires more than reflex arcs
  - "0.1% means ignore": counter when introducing credence by asking what probability would make them intervene for one human
  - "Tiny brain" fallacy: address during intensity discussion by distinguishing neural architecture from subjective magnitude
  - Dietary implications: explicitly defer as policy complexity beyond scope

  The closing question should test structural understanding: "If we hold carrying capacity fixed but extend suffering duration 100x, does scale still dominate?" This forces them to manipulate variables rather than regurgitate conclusions.

  Boundary-setting is vital. I'll suggest upfront exclusions: neuroscience theories (irrelevant to ethical reasoning under uncertainty), replacement effects (complicates aggregation), and any "therefore veganism" conclusions (reductive). Phrase it as "focusing narrowly on the logic of aggregation under uncertainty."

  The wheat field can reappear in final policy discussions, showing how individual actions aggregate to systemic change - but only after the conceptual groundwork is laid.
answer: |-
  Here’s a structured 90-minute plan focused on sequencing, misconceptions, and your key pedagogical goals. The logic is *cumulative*: each step builds conceptual tools to handle the next, avoiding collapse of distinct variables.

  ---

  ### **Phase 1: Groundwork (15 mins)**  
  *Goal: Establish welfare currency without triggering skepticism.*  
  **Start concrete:**  
  - *Example:* **The Patio Ant Nest.** "Imagine you’re about to pour boiling water into an ant nest in your patio. Assume 1 million ants die instantly. Should you feel *more* uneasy than if it were 100 ants? Why?"  
  - *Why this example:* Single intervention, vivid imagery, avoids policy weeds. Students can project empathy/skepticism onto *one* ant, scaling later.  
  - *Whiteboard:* Sketch nest + human. List student intuitions (e.g., "It’s just ants!" vs. "But a million lives!").  

  **Define the denominator:**  
  - "When we say ‘worse,’ what’s the *unit*? Is it:  
    (a) **Creature-lives**? (Each death = 1 unit of harm)  
    (b) **Seconds of suffering**? (Duration matters)  
    (c) **Intensity-adjusted experience**? (How bad *is* a second?)"  
  - *Key move:* Stress **we don’t know (c) yet**. We’re aggregating *whatever the unit is* across individuals.  

  ---

  ### **Phase 2: Decompose Uncertainty (25 mins)**  
  *Goal: Split sentience credence from intensity.*  
  **Introduce two variables:**  
  1. **P(S)** = Probability an ant is sentient (can feel *anything* positive/negative).  
  2. **I** = Intensity multiplier (if sentient, how intense is its suffering? 1.0 = human-level, 0.001 = very faint, etc.).  
  - *Analogy:* "Think of P(S) as ‘Is there *any* lightbulb in this socket?’ I is ‘How bright is it?’"  

  **Apply to the nest:**  
  - Expected suffering = [Number of ants] × P(S) × I × [Suffering duration per ant]  
  - *Whiteboard:* Formula with blanks for P(S)/I. "If P(S) = 0.1% and I = 0.001, is 1M ants worse than 1 human stubbing a toe? Let’s calculate roughly."  

  **Preempt collapse:**  
  - *Misconception head-off:* "Notice: P(S) = 0.001 doesn’t mean suffering is ‘1/1000th as bad’—it might be 10x worse but only 0.1% likely! I and P(S) are independent." Give examples:  
    - High P(S), low I (e.g., jellyfish: maybe sentient but faint sensations)  
    - Low P(S), high I (e.g., AI: tiny chance, but if conscious, agony could be extreme)  

  ---

  ### **Phase 3: Scale Argument Mechanics (20 mins)**  
  *Goal: Show how scale dominates, then expose correlation flaw.*  
  **The core argument:**  
  - "Assume *conservative* estimates: P(S) = 0.1%, I = 0.0001, duration = 10 sec/ant.  
    Total expected suffering = 1M × 0.001 × 0.0001 × 10 ≈ **1 unit** (e.g., human stubbing a toe).  
    Now, if I = 0.001, it jumps to **10 units** (human breaking a leg). *But*—"  

  **Correlation trap:**  
  - "Is P(S) for ants *independent* of P(S) for bees? If ants are sentient, does that make bees *more* likely sentient? (Yes: shared neurology/evolution.)  
    So if we treat all 1M as independent coin flips, we’re *underestimating uncertainty*. It’s not ‘a trillion flips’—it’s **one flip for the whole clade**."  
  - *Whiteboard:* Draw ants/bees with arrows showing shared evidence (e.g., "both have nociceptors → if functional in ants, likely in bees").  

  ---

  ### **Phase 4: Deepen Application & Misconceptions (20 mins)**  
  *Revisit the patio example:*  
  - "Back to the nest: Should you avoid pouring water? What if the ants are invasive and threaten crops? We’re *only* weighing expected suffering. What questions remain?"  
  - *Why patio > wheat field:* Personal actions make scale relatable. Save wheat for post-seminar policy discussions.  

  **Preempt misconceptions *as they arise*:**  
  1. **"Nociception = pain?"**  
     *When:* During P(S) discussion.  
     *Response:* "Nociception is like a smoke alarm—it *could* signal fire (pain), or just be a reflex. P(S) covers ‘is there *fire*?’"  

  2. **"0.1%? Might as well ignore."**  
     *When:* After initial calculation.  
     *Response:* "Would you ignore a 0.1% chance your tap water is poisoned? Scale amplifies tiny risks."  

  3. **"Tiny brain → shallow pain."**  
     *When:* Intensity (I) discussion.  
     *Response:* "Pain might not scale with size. A mouse brain is 1/3000th human size, but pain sensitivity is similar. I is *unknown*—that’s why we vary it."  

  4. **"So we should all stop eating X?"**  
     *When:* Any policy leap.  
     *Response:* **Defer immediately:** "Today’s *only* about the math of aggregation. Policy needs cost/benefit—apples cost $, insects might suffer. Not now!"  

  ---

  ### **Closing (10 mins)**  
  **Pivot to structure, not conclusions:**  
  - *Key question:* **"If we *fix* the number of insects (say 1 trillion), but double the duration of suffering per individual, does expected suffering double? What if we double P(S)? What if we discover P(S) for all insects is perfectly correlated?"**  
    - Tests grasp of formula, variables, and correlation.  

  **Explicit boundaries:**  
  - Start of seminar: "In 90 minutes, we **won’t resolve**:  
    - Which neuroscientific theories of consciousness are true (we’re using *credences*).  
    - Whether preventing insect births/deaths affects total populations (assume no replacement for simplicity).  
    - Real-world interventions (today is theoretical mechanics).  
    Why? **Focus on how to think under uncertainty**—not final answers."  

  ---

  ### **Why This Sequence Works**  
  - **Avoids denominator drift:** Units locked in early via concrete example.  
  - **Prevents variable collapse:** P(S) and I separated *before* scaling.  
  - **Correlation handled last:** Students see the flawed intuition *after* grasping baseline math.  
  - **Skeptic-friendly:** Patio example feels non-threatening; EA students get rigor on uncertainty.  
  - **Time-efficient:** Misconceptions addressed contextually, not in a disjointed Q&A.  

  **If you deviate:** Leading with "trillion flips" amplifies correlation errors. Starting with policy (wheat) loses skeptics. Merging P(S)/I invites "it’s all just one guess". Stick to the scaffolding.  

  *Final tip:* When intensity skepticism erupts, ask: "If you *had* to bet, is a bee’s pain closer to 0.0001x or 0.1x human pain? Why?" Forces engagement without requiring commitment.
