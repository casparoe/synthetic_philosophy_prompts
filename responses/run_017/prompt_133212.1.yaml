  Another fatal point is neural plasticity related to expertise. Expert meditators or athletes show structural brain changes. If training physically alters sensory areas, suggesting improved resolution, that contradicts the fixed ceiling. The user might counter that it's enhanced reinterpretation, not resolution. But if plasticity directly boosts resolution capacity, that's a problem.

  Then there's the argument from illusions. High-resolution afterimages or persistence of vision suggest detailed sensory buffers. The user might dismiss these as pre-conscious, not part of conscious experience. But if these buffers are accessible, it challenges the sparse summary claim.

  Moving to awkward objections: gradual improvement in discrimination, like wine tasting, seems to show enhanced resolution. The user would say it's reinterpretation. But if studies show it's acuity and not just categorization, that's awkward. Subliminal priming with high-resolution stimuli might indicate unconscious detail, which the user could accept but still maintain consciousness is sparse.

