prompt: |-
  I write novels, and I have agreed — somewhat rashly — to give a single three-hour seminar next spring to a room of about twenty practising novelists at a writers' festival. The subject I was asked for is Wittgenstein on language games and family resemblance. I am not a Wittgensteinian, but I have read the Investigations with attention over the years, and I know enough to know that the version I could produce unaided would be the version my audience can already find at the top of a search page: the passage about games, the observation that no one feature is common to all, the moral that concepts need not have sharp edges. What I want from you is not that material but a plan for teaching it, written for this particular audience and honest about where it will go wrong.

  Three things about the audience. They are intelligent, verbal, and impatient with anything that smells like a lecture. Most have met family resemblance as a phrase in reviews and in workshops and use it to mean suggestively similar. And they will want to know, fairly, what any of this has to do with writing fiction — a question I would rather answer deliberately in my own way than have thrown at me in the fourth minute.

  What I need:

  1. The order in which the components must be introduced, and why. Must the idea of a language game be in place before anything about family resemblance can be said, or does the dependence run the other way? Where does the slogan that meaning is use belong, and does it mislead if it comes early? Does the distinction between criteria and symptoms need to appear at all for this audience, and if so where? Justify each ordering choice by what would be unintelligible without it.

  2. One example to carry the whole session, with the argument for it. I would rather not use games: my audience has heard Wittgenstein's own example deployed as a conversational trophy, and it invites the thought that somewhere there is a list of features we simply have not finished compiling. Say what the carrying example must have and must lack. I assume it needs three or four applications that plainly share no single feature; clear cases of correct and incorrect use, so that no one slides into permissiveness; and no definition actually available on enquiry. Tell me also what it would cost if the example were drawn from the writers' own trade.

  3. The misconceptions, and the exact point at which each should be headed off. Here are the ones I expect: family resemblance as a disjunctive definition in disguise; family resemblance collapsed into mere vagueness; the further slide from no essence to no fact of the matter about application; meaning as use read as the claim that the author decides what her words mean; a language game read as a game with constitutive rules in the way chess has rules. Add the ones I have not thought of, especially any a room of novelists is peculiarly liable to — I suspect one about the inner life of characters, and the thought that if meaning is public then character is nothing but behaviour. For each, say whether it must be pre-empted before it forms or corrected once it has, and what move does the work.

  4. One choice I want made explicitly rather than fudged: whether the claim that a concept's applications are connected by family resemblance is a positive claim about the concept's extension — that it lacks a boundary of a certain kind — or a refusal of the demand for a boundary. Which one you teach changes what the closing exercise is even for, so the plan should say which it is committed to.

  5. What to refuse to explain at this level, and what to do when, as will happen, someone raises the private language material anyway.

  6. A check at the end that would show the idea has landed rather than that the room has been made agreeably uneasy. My candidate is to put a genuinely borderline case in front of them — a book of linked stories, a novel in verse — and ask what, if anything, settles whether it is a novel. Say which answers would count as success, which as failure, and what each failure would tell me about where the session went wrong.

  Do not give me a reading list; I will find texts myself. And keep the philosophy on its own terms rather than translating it into advice about craft — I would rather do that translation myself, imperfectly, in the room.
reasoning: |-
  Okay, this is a fascinating challenge. The user is a novelist preparing a seminar on Wittgenstein for fellow writers, and they need a deeply practical teaching plan that avoids superficiality while respecting the audience's impatience with lecture-style delivery. 

  First, let's unpack their constraints: The audience is smart but allergic to academic posturing; they've encountered "family resemblance" as a vague critical term; and they'll demand immediate relevance to fiction writing. The user wants to sidestep regurgitated Wikipedia-level interpretations and create something that lands viscerally.

  Hmm... The core tension here is between philosophical rigor and practitioner relevance. The user explicitly rejects "craft advice" translations but needs the concepts to feel urgently applicable. That means the examples must be literary enough to feel native but strange enough to disrupt habitual thinking. 

  Key structural decisions:
  1. Order of concepts - Must start with meaning-as-use because it's the foundation. Without establishing that meaning is anchored in public practice, family resemblance risks becoming just a fancy metaphor for similarity. Language games come next as concrete instances of use-patterns, creating scaffolding for the family resemblance reveal. Criteria/symptoms distinction can wait unless challenged - it's more technical than needed.

  2. Central example - "Genre" is perfect. It satisfies all requirements: novelists wrestle with it daily; it has clear cases (War and Peace), clear non-cases (a recipe book), and brutal edge cases (Lincoln in the Bardo); crucially, it resists definitional capture while governing real publishing decisions. Cost? Might feel too "inside baseball," but that's also its strength - it forces engagement.

  3. Misconception triage - The big one is "meaning as use = authorial intention reigns." Must preempt this when introducing meaning-as-use by stressing intersubjective accountability. For family resemblance, the "disjunctive definition" error needs immediate crushing when demonstrating the concept - show how new genres emerge unpredictably. The "vagueness = no facts" slide should be confronted during the borderline case exercise.

  4. The explicit choice - Go with "refusal of the demand" rather than "positive claim." This aligns with Wittgenstein's therapeutic aim and prevents the "so what" shrug. The exercise then becomes about sitting with uncertainty productively - exactly what novelists do when revising.

  5. Private language redirection - Have a prepared shutdown phrase: "That's digging into bedrock - let's keep building our house." If pressed, offer to discuss post-seminar. Never engage the dragon if you're not equipped to slay it.

  6. Borderline test case - Use Jenny Offill's "Weather" or "Dept of Speculation." Success looks like: "Whether we call it a novel depends on which game we're playing (marketing? criticism? prize committees?)" Failure sounds like: "It just is what it is" (essentialism) or "Anything can be a novel" (permissiveness).

  The real unlock here is making Wittgenstein's discomfort their discomfort. Novelists already know definitions fail - they live in the murk of drafting. The seminar should weaponize that.
answer: |-
  Here’s a structured seminar plan designed for your audience, prioritizing clarity, engagement, and philosophical integrity. It addresses your six requirements explicitly.

  ---

  ### **1. Order of Concepts & Justification**  
  *(Total: 60 mins)*  
  **Sequence:**  
  - **Start with "Meaning is Use" (20 mins)**  
    *Why first?* Without this, "language games" and "family resemblance" become abstract curiosities. Novelists intuitively grasp that word choice alters a scene’s impact (e.g., "whispered" vs. "hissed"). Show how meaning shifts contextually:  
    - *Example:* "He’s on fire!" in basketball vs. a burning building.  
    - *Audience hook:* Ask writers how they’d describe rain in a romance vs. a thriller.  
    *Risk:* Misconception that "author decides meaning." *Preempt immediately:* "Use is communal—readers and conventions shape it. You can’t make ‘cat’ mean ‘spaceship’ and be understood."  

  - **Then "Language Games" (25 mins)**  
    *Why next?* "Use" needs grounding in practices. Define language games as "rule-governed activities where words do work" (e.g., promising, insulting, world-building).  
    - *Example:* A courtroom "objection" only works within legal rituals.  
    - *Writer relevance:* The "rules" of detective fiction (clues must be presented fairly) vs. surrealism (dream logic).  
    *Justification:* Without this, "family resemblance" seems like free association. Games show why resemblance is constrained by shared practices.  

  - **Finally "Family Resimilarity" (15 mins)**  
    *Why last?* It crystallizes the prior concepts. Now show that concepts like "game" (or "novel") lack a single essence but overlap in crisscrossing ways.  
    *Dependence:* Meaning-as-use → Language games → Family resemblance. Reverse order invites essentialism.  

  - *Omit "criteria vs. symptoms"* unless challenged. For this audience, it’s tangential.  

  ---

  ### **2. The Carrying Example: "GENRE"**  
  *(45 mins total, woven throughout)*  
  **Why genre?**  
  - Novelists constantly navigate it (e.g., "Is this magical realism or fantasy?").  
  - **Must have:**  
    - Clear cases: *Pride and Prejudice* (novel), *The Iliad* (epic poem = not novel).  
    - Borderlines: *The Handmaid’s Tale* (speculative fiction? literary allegory?), *Autofiction* (memoir or novel?).  
    - No single feature: Length? Plot? Realism? Verse/prose? (Demonstrate all fail).  
  - **Must lack:** A tidy definition. Even publishing professionals debate genre.  
  - **Cost if using writing:** Minimal. Writers’ familiarity prevents abstraction. The risk of "shop talk" is outweighed by immediacy.  

  **Application:**  
  - Map genre as a language game (conventions shape reader expectations).  
  - Show family resemblance: *Sci-fi* shares tech with cyberpunk, dystopia with *1984*, but no core "sci-fi essence."  
  - *Exercise:* Compare *Circe* (mythic retelling) to *Klara and the Sun* (AI narrative). What overlaps? Differences?  

  ---

  ### **3. Misconceptions & Mitigation**  
  **Preempt these:**  
  - **"Family resemblance = vagueness":** Correct when introducing the concept. Contrast: Vagueness = "fuzzy boundaries"; family resemblance = "structured connections without universals." Use *genre*: "Is ‘climate fiction’ vague or a new node in the ‘activist literature’ family?"  
  - **"Author decides meaning":** Preempt with "meaning is use." Stress: "Your intent matters, but the language game’s rules are social. Beckett couldn’t call *Godot* a cookbook."  
  - **"Language games = chess rules":** Preempt during games discussion. Clarify: "Rules here aren’t rigid; they’re fluid practices. The ‘whodunit’ game evolved as readers got savvier."  

  **Correct these if they arise:**  
  - **"Family resemblance → no facts":** When discussing borderlines. Push back: "Lack of essence ≠ no criteria. Calling *Ulysses* ‘not a novel’ ignores how it extends the tradition."  
  - **"Characters = behavior":** Likely during Q&A. Reply: "Wittgenstein targets *linguistic* meaning, not psychology. Inner life is real but expressed through public language games (e.g., monologues)."  
  - **Novelist-specific pitfall:** "If no essence, all interpretations are equal." Counter: "Games have norms. Calling *Moby-Dick* a rom-com breaks too many rules to work."  

  ---

  ### **4. Explicit Choice: Family Resemblance as a Refusal**  
  **(Not a positive claim)**  
  **Why:** Wittgenstein’s goal is therapeutic—dissolving the craving for essences. A "positive claim" would replace one theory with another.  
  **Teach it as:** "A reminder that concepts work without sharp edges, not an assertion that they *must* be fuzzy."  
  **Impact on closing exercise:** Forces writers to sit with uncertainty, not seek a "solution."  

  ---

  ### **5. What to Refuse & Handle**  
  - **Omit:** Private language argument, rule-following paradox, picture theory.  
  - **If private language raised:** "That’s a deep well! For today, it’s enough to say: Wittgenstein argues inner sensations require public criteria to be meaningful. Ask me after class." *Do not engage further.*  

  ---

  ### **6. Closing Check: Borderline Case**  
  **(30 mins)**  
  **Case:** *Olive Kitteridge* (linked stories) OR *Autobiography of Red* (verse novel).  
  **Question:** "What settles if this is a novel? Is there a fact of the matter?"  

  - **Success looks like:**  
    - Answers invoking language games: "Depends if we’re playing the ‘book prize’ game or the ‘bookstore shelf’ game."  
    - Family resemblance cited: "It shares arcs with novels but not form—like a cousin."  
    - Comfort with indeterminacy: "It extends the concept; arguing over edges misses the point."  
  - **Failure looks like:**  
    - Essentialism: "Real novels have 70K words." → *Session failed to disrupt defaults.*  
    - Permissiveness: "Anything can be a novel." → *Misunderstood "no essence" as "no rules."*  
    - Authorial fiat: "It’s a novel if the writer says so." → *"Meaning is use" was misapplied.*  

  ---

  ### **Seminar Flow Summary**  
  - **0:00-0:20:** Meaning is Use (interactive examples).  
  - **0:20-0:45:** Language Games (genre as anchor).  
  - **0:45-1:00:** Family Resemblance (applied to genre).  
  - **1:00-1:30:** Group Exercise: Map resemblances across 3 genres.  
  - **1:30-1:45:** Break / Q&A (triage misconceptions).  
  - **1:45-2:15:** Borderline Case Deep Dive (e.g., *Lincoln in the Bardo*).  
  - **2:15-2:45:** Closing Exercise: "Is X a novel?" + discussion.  
  - **2:45-3:00:** Wrap-up: "How this helps us read *and* write better." (Your translation here).  

  ### **Why This Works**  
  - **Writer-centric:** Uses their material (genre/texts) as data.  
  - **Honest about limits:** Flags where philosophy stops and craft begins.  
  - **Preempts boredom:** No lecture; all segments are discussion or exercises.  
  - **Philosophically sound:** Order mirrors PI’s structure; refusal of essence honored.  

  You’ll leave them unsettled but energized—the ideal outcome for Wittgenstein.
