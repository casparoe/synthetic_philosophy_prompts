prompt: |-
  I sit on the coverage committee of a large academic health system, and we are trying to write a policy that turns on the distinction between therapy and enhancement. A colleague and I built the argument below to show that the usual way of drawing that line does not hold. It now seems to me to work too well: it takes down distinctions I need in order to write the policy at all. I would like to know which step to reject, why that step looked unobjectionable, and what rejecting it costs me.

  Take one case as given, without worrying about whether it is realistic. Call the intervention TR-1. TR-1 halts and partly reverses age-related thymic involution, so that a 62-year-old patient's output of naive T cells moves from roughly the 10th percentile for her age to roughly the median for a healthy 25-year-old. It repairs no lesion, fights no pathogen, and the patient carries no diagnosis. It raises a part-function from a level that is species-typical for her age to a level that is species-typical for the species, but that she does not now have and that almost no one her age has.

  (1) If the therapy/enhancement distinction is to do the work we need of it — deciding what medicine must provide, what a physician may refuse to prescribe, what a sport may forbid, what parents may not demand for a healthy child — then it cannot be drawn by appeal to what anyone happens to value. That work consists precisely in constraining what people may demand on the basis of what they value, so a line drawn from values cannot perform it.

  (2) The only candidate for a value-neutral line is a functional one: therapy restores or maintains a part-function at its species-typical level; enhancement raises a part-function above that level.

  (3) "Species-typical" is a statistical notion: the level of the part-function found in the statistically normal run of members of the species, with the reference class narrowed by age and sex where the function varies with them.

  (4) Reference classes are adjustable without contradiction. TR-1 in a 62-year-old is, relative to healthy adults, a restoration to typical; relative to 62-year-olds, an elevation above typical. Nothing in (2) and (3) selects between the two verdicts.

  (5) So (2) and (3) classify by choice of reference class, and the choice of reference class is a practical decision about which population we take as the standard. It is not a value-neutral fact about the patient.

  (6) Therefore the therapy/enhancement line is value-laden after all, and by (1) there is no version of it that can do the work. Every appeal to "this is treatment, not enhancement" is a disguised appeal to values.

  (7) In particular: TR-1 is therapy or enhancement depending on which population we count; growth hormone for a short but healthy child is therapy in a society that regards short stature as a defect and enhancement in one that does not; the same goes for stimulants for a healthy student, SSRIs for dispositional shyness, and cochlear implants for a child in a signing community. Preventive medicine — vaccines, fluoride, statins for a person with average cholesterol — is a clean case of enhancement, since it raises a part-function above species-typical without restoring anything.

  (8) But I cannot accept (7). It makes a physician's refusal to prescribe growth hormone to a healthy short child a bare imposition of contested values rather than a medical judgment, and it makes the repair of a cleft palate an enhancement in any community that does not stigmatize cleft palates. Medicine plainly does something other than ratify local preferences, and prevention plainly is not enhancement.

  So I have proved too much, and I cannot see what I bought it with. Which step do you reject? Explain why the step looked fine. Then price the alternatives honestly: I would rather give up the details of (2) and (3) than give up (1), but I want to know what each of (1), (2), (3) and the step from (4)–(6) costs me if I have to abandon it, including what my coverage policy would then be able to say.

  One refinement has been proposed and I do not think it helps. Replace (3) with a historical or counterfactual criterion: an intervention is therapy only if it restores a level the patient once possessed, or would have possessed but for some specifiable disrupting event. TR-1 counts as therapy on this criterion, since she had the thymic output of a 25-year-old once; but correcting a congenital enzyme deficiency a child has never had the function for now counts as enhancement, which is absurd in the opposite direction. Does the failure of both candidate refinements tell me that (2) is the wrong place to look for a value-neutral line, that the functional line has to be pluralist or disjunctive, or that (1) was the mistake and the distinction was always going to be a normative one?
reasoning: |-
  Okay, the user is part of a coverage committee for an academic health system and is struggling with defining a policy that distinguishes therapy from enhancement. They've built an argument that shows the usual functional approach based on species-typical norms falls apart when you consider different reference classes. This leads them to conclude that the distinction is value-laden, which undermines their policy goals. They need to know which step to reject and what the consequences are.

  First, I need to unpack their argument step by step. They start with the premise that the distinction must be value-neutral to constrain preferences (step 1). Then they propose a functional definition using species-typical levels (step 2), defined statistically with reference classes (step 3). Step 4 points out that reference classes are adjustable—TR-1 can be seen as therapy or enhancement depending on whether you compare to all adults or age-matched individuals. This leads to step 5: the classification depends on choosing a reference class, which is a practical, value-laden decision. Step 6 concludes that the entire distinction is value-laden, and step 7 gives examples where the line blurs, like growth hormone or cochlear implants. The user rejects step 7 because it leads to counterintuitive conclusions, like preventive medicine being enhancement or cleft palate repair not being therapy if not stigmatized.

  The user mentions a proposed refinement using a historical/counterfactual criterion, but it fails because congenital conditions would then be enhancements. They're stuck between maintaining a value-neutral distinction (step 1) and a functional one (step 2-3), both of which seem necessary but lead to contradictions.

  The core issue is that species-typical function is inherently normative when tied to reference classes. The user wants an objective standard, but reference classes (like age) imply judgments about what counts as "normal" or desirable. For example, restoring function to a young adult level versus an age-appropriate level involves valuing one state over another. Step 1's requirement for value-neutrality might be too strict because medical judgments always involve normative elements. 

  Rejecting step 1 means accepting that the therapy/enhancement distinction is value-laden. This allows incorporating societal norms, clinical expertise, and harm prevention. For policy, this could mean defining therapy as addressing pathology (with pathology defined by dysfunction causing harm). Enhancement would then be improving function beyond health, but "health" itself is value-laden. The policy would need clear criteria for dysfunction, perhaps based on deviation from statistical norms that cause disability or distress, while acknowledging cultural context. However, this might lead to disputes over what constitutes harm or acceptable variation.

  Rejecting step 2/3 involves abandoning the species-typical functional norm. Alternatives include a harm-based model (therapy prevents/reduces harm) or a capabilities approach (therapy restores typical species capabilities). But harm is also value-laden—e.g., is short stature harmful only if it causes distress? The congenital enzyme deficiency example shows that absence of harm isn't sufficient; the condition is pathological regardless of societal views. 

  The step from 4-6 is logical; if reference classes are adjustable, the distinction isn't value-neutral. Rejecting this would require denying that reference classes are arbitrary, perhaps by fixing them biologically (e.g., age as a natural category). But age-related decline is typical, so restoring youthful function is enhancing relative to age norms. This doesn't resolve the problem.

  The best path might be to reject step 1's insistence on complete value-neutrality. Medicine inherently involves values—treating conditions that cause suffering or impairment. The policy can define therapy as interventions targeting pathological processes (defined by biological dysfunction leading to harm). Enhancement targets non-pathological states. This accepts that "pathological" has normative elements but grounds it in objective dysfunction. For example, thymic involution is age-typical, not pathological, so TR-1 is enhancement. Congenital deficiencies are pathological. Preventive medicine addresses risk factors for pathology, so it's therapeutic. 

  The user's coverage policy could state that interventions are covered if they treat a diagnosed medical condition causing impairment or significant risk. Non-covered enhancements improve function beyond health. The committee would need guidelines for defining medical conditions, referencing established diagnoses and evidence of harm. This approach accepts some value-laden judgments but provides a framework. The cost is potential disagreements over what constitutes impairment or significant risk, requiring ongoing deliberation.
answer: |-
  You've built a powerful reductio ad absurdum against the value-neutral functionalist account of the therapy/enhancement distinction. Your conclusion (step 7) is indeed untenable for policy purposes, but the flaw isn't in your logic—it's in the initial premises. **Reject Step (1).** Here's why, what it costs you, and how to rebuild your policy:

  ### Why Reject Step (1)?
  - **The Mistake:** Step (1) claims the distinction *must* be value-neutral to constrain preferences. But medicine is inherently normative. "Health," "disease," and "function" are concepts laden with teleological assumptions about human flourishing. Insisting on value-neutrality forces you into the reference-class relativism that dismantles the distinction.
  - **Why It Looked Fine:** You're rightly reacting against purely *subjective* values (e.g., "I value being taller"). But rejecting *all* values throws out essential clinical and ethical norms (e.g., "severe pain is bad," "premature death is harmful"). Medicine has always operated with objective-but-normative concepts like "harm," "dysfunction," and "disease burden."

  ### What Rejecting Step (1) Costs You
  - **Cost 1:** You abandon the dream of a purely *scientific* line. Policy will require ethical justifications, not just biological facts.
  - **Cost 2:** You must define "therapy" using thicker normative concepts (e.g., *preventing harm*, *restoring functional capacity*, *treating pathology*). These are stable but debatable.
  - **Cost 3:** Coverage decisions become harder to defend against accusations of bias. You'll need transparent criteria for what counts as "harm" or "pathology."

  ### Why Other Steps Hold (With Refinements)
  - **Step (2)/(3):** Functional restoration *relative to age* remains useful, but only as a *proxy* for avoiding harm/pathology—not as a freestanding value-neutral fact. TR-1 *enhances* because age-related decline isn't pathological.
  - **Step (4)-(7):** Your relativism critique stands, but it’s a feature, not a bug: reference classes matter because **age is biologically relevant**. A 62-year-old with thymic function of a 25-year-old is *not* restored to *her own* functional norm but pushed beyond it. This is enhancement because typical aging isn’t a disease.
  - **The Failed Refinements:** Your historical/counterfactual criterion fails because it excludes congenital conditions. This confirms that pathology isn’t defined by personal history but by deviation from *biologically designed function* (Boorse-style naturalism).

  ### A Policy-Focused Alternative: The **Harm-Prevention Model**
  Retool the distinction around **pathology and harm**, not statistical norms:
  - **Therapy:** Interventions targeting a *pathological process* (a deviation from functional design causing harm/disability) or *significant risk* thereof.
  - **Enhancement:** Interventions targeting *non-pathological* traits to push them beyond normal function.

  | **Case**             | **Harm-Prevention Model Classification** | **Rationale**                                                                 |
  |----------------------|------------------------------------------|-------------------------------------------------------------------------------|
  | TR-1 (thymic output) | Enhancement                              | Age-related decline is not pathological; no harm prevented beyond aging norms |
  | Growth hormone (healthy child) | Therapy only if pathology (e.g., GH deficiency) | Short stature absent pathology is not harm requiring medical correction |
  | Statins (high risk)  | Therapy                                  | Targets pathological process (atherosclerosis) with significant morbidity risk |
  | Cleft palate repair  | Therapy                                  | Corrects functional impairment (eating/speaking) and social harm              |
  | Cochlear implants (signing community) | Therapy (if child will interact with hearing world) | Prevents harm from functional exclusion in broader society                |

  ### How to Structure Your Coverage Policy
  1. **Anchor in Pathology:** Cover interventions for conditions meeting *diagnostic criteria* for disease/disorder (e.g., DSM, ICD) OR causing *functional impairment* (e.g., inability to perform age-appropriate activities).
  2. **Explicitly Reject Subjectivity:** State that patient preference alone doesn’t define medical necessity; coverage requires objective dysfunction/harm.
  3. **Handle Prevention:** Cover preventive measures when targeting a *specific pathology* in high-risk individuals (e.g., statins for familial hypercholesterolemia). Exclude "optimization" (e.g., statins for average cholesterol).
  4. **Address Gray Areas:** Create a review process for contested cases (e.g., cochlear implants in Deaf culture) using criteria like:
     - Severity of functional impairment
     - Reversibility of harm without intervention
     - Consensus in clinical guidelines

  ### The Cost of Clarity
  You lose philosophical purity but gain policy coherence. By embracing medicine’s normative core, you can:
  - Refuse TR-1 and growth hormone for healthy short children as enhancements.
  - Cover cleft palate repair as therapy (prevents functional/social harm).
  - Justify preventive medicine as harm-reduction (targets pathophysiology, not optimization).

  Your instinct is correct: the functional line needs pluralism. But it’s **harm** that unites the cases you want to call "therapy"—not statistics. This approach accepts that values shape "harm," but constrains them with biology and clinical evidence. Your coverage policy won’t be value-free, but it *will* be defensible.
