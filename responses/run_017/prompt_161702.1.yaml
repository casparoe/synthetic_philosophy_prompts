answer: |-
  Here’s the joke, designed to meet your specifications:

  **Joke:**  
  Two neighbours were backing out of their driveways on icy mornings.  
  The first, quite unaware, came within an inch of crushing a child’s abandoned tricycle—but no one saw it.  
  The second did the very same thing, but this time a passing jogger gasped, staggered back, and dropped her coffee.  
  The first neighbour received no blame at all. The second was lambasted for days.  
  *The jogger’s scalding trousers made all the difference.*  

  **Explanation:**  
  The punchline exploits how the *epistemic salience* of the near-miss—here, the jogger’s visceral reaction and injury—makes the avoided outcome (crushing the tricycle) vivid to observers, amplifying blame despite identical actions and results. It would fall flat if mistaken for resultant luck (both had identical *actual* outcomes: no damage) or circumstantial luck (both faced identical icy conditions). A student misreading it might assume the joke is merely about bystanders overreacting, missing that the blame hinges on *how vividly the counterfactual harm was witnessed*.  

  ---

  **Why this works:**  
  1. **Structure Aligns with Distinction**: The identical near-misses (counterfactuals) diverge solely in salience (witnessed/unwitnessed), driving unequal blame. The scalding coffee makes the *unrealised* tricycle-crashing "feel" real.  
  2. **Breaks with Swapped Distinctions**:  
     - **Resultant Luck?** Both have *no* actual harm—irrelevant.  
     - **Circumstantial Luck?** Identical icy driveways—irrelevant.  
     - Only salience differs.  
  3. **Accessible & Dry**: Uses mundane British scenarios (neighbours, icy drives, dropped coffee), no jargon. Understated payoff ("scalding trousers").  
  4. **Philosophical Humour**: Colleagues would laugh at the mechanism: the jogger’s trousers becoming the accidental engine of salience, reducing blame to a quirk of visibility.  

  **Delivery Note**: Read slowly, pausing before the punchline. The triviality of a tricycle (vs. a child in standard cases) keeps it light, but the mechanism remains identical.
