prompt: |-
  Hey, I'm an RL person, mostly offline RL and some RLHF-ish work. I'm completely fine with POMDPs, belief states, Bellman backups, on- vs off-policy evaluation, distribution shift, KL penalties back to a reference policy, model soups, that whole toolkit — but I know roughly zero decision theory beyond a grad seminar I dropped halfway through, so please don't assume I know the standard arguments, just the machinery.

  What I actually want is pretty specific. I've been messing around with a training scheme I made up and half-jokingly call anchoring to the initialization: you keep a frozen copy of the policy as it was at init, before it has seen any observations from the current episode, and you train the live policy on the usual return plus a KL penalty toward that frozen copy, with the coefficient decaying over the episode, so early on you're basically executing the plan the pre-observation policy would have picked and by the end you're nearly unconstrained. My hope was that this gives me an approximately updateless agent — something that pays in counterfactual mugging, cooperates in a one-shot prisoners dilemma, one-boxes on transparent Newcomb — without me hardcoding any of that behavior. My worry is that it just gives me a sluggish agent paying a KL tax for nothing, since the frozen init policy is by construction the policy that knows nothing about which world it's in, so of course it's bad.

  So: restate the case for updateless decision theory, against ordinary update-then-act expected utility maximization, in my vocabulary — policies, belief states, value functions, priors over policies, off-policy evaluation, penalties toward a reference policy, whatever fits — as faithfully as you can without smuggling in assumptions I don't have, and then tell me whether my anchoring scheme is a real implementation of the thing or a distortion, and where exactly the distortion is. Then give me the residue: which part of the updateless claim has no expression in RL terms at all. My guess is it's the bit where the agent is supposed to decide as if it were choosing the output of every copy or counterpart of itself, including ones connected to it logically rather than causally, which sounds to me like either off-policy evaluation over a policy class that contains yourself or a straight-up type error. Say whether that leftover is a blind spot in my framework or a sign the original claim is less clear than it sounds.

  Exactly five numbered points, one or two sentences each, no intro and no closing remark: (1) the cleanest RL translation of the updateless claim, (2) what maps onto machinery I already have, (3) what only fits if you fudge it, (4) what has no counterpart at all, (5) your verdict on whether (4) is my frameworks blind spot or the claim's own vagueness. And no references or citations please, I can't chase them up anyway.
reasoning: |-
  We are given a specific query from an RL expert about an anchoring scheme and its relation to updateless decision theory. The task is to provide exactly five numbered points as specified.

  1. **Cleanest RL translation of the updateless claim**: Updateless decision theory (UDT) can be translated as optimizing a policy that, at the initial state (with a prior belief over environments), commits to a strategy mapping all possible future observations to actions, such that the expected utility is maximized under the prior, without conditioning on the actual observations (i.e., acting as if the agent is a program that must output an action for every possible observation, before seeing any).

  2. **What maps onto machinery I already have**: The idea of committing to a policy at the prior and evaluating it under the prior distribution (i.e., off-policy evaluation with the prior as the behavior policy) fits naturally with the RL toolkit, including belief states and Bellman backups, because you can compute the expected return of a fixed policy under the prior.

  3. **What only fits if you fudge it**: The requirement that the agent acts without updating its beliefs (i.e., without conditioning on observations) is fudged by your anchoring scheme because you are still updating the live policy during the episode (via the KL penalty decay) but trying to approximate the initial policy. The fudge is that the KL penalty toward the initial policy is a soft constraint, not a hard commitment to the initial policy's actions.

  4. **What has no counterpart at all**: The core UDT idea that the agent must consider logical correlations (i.e., that the agent's decision algorithm is known to the environment and thus the action chosen might affect the environment via logical dependence, as in Newcomb's problem) has no direct counterpart in standard RL, which typically assumes causal interactions only.

  5. **Verdict on the leftover**: The leftover (logical correlations) is a blind spot in the standard RL framework because RL models the environment as a causal MDP/POMDP, not accounting for logical dependence (which is a type of acausal relation), but this does not make the UDT claim vague; it highlights a fundamental difference in problem setup.

  We now output exactly the five points as requested.
answer: |-
  1. Updatelessness translates to optimizing a policy that, at initialization, selects a full observation-action mapping maximizing expected utility under the prior belief state, without later conditioning on observed data—effectively treating the policy as a fixed program evaluated off-policy under the prior.  
  2. Your toolkit handles the prior belief state, off-policy evaluation of this fixed mapping via Bellman backups, and KL penalties toward a reference policy (the initial one), which partially enforces commitment to pre-observation decisions.  
  3. Your scheme fudges updatelessness by decaying the KL penalty: it allows belief updates during the episode (softly deviating from the initial policy) rather than strictly acting as the initial policy would, conflating updateless intent with online belief revision.  
  4. No RL counterpart exists for logical correlation: UDT requires the policy to optimize over outcomes in worlds where identical decision algorithms (e.g., agent copies) exist, affecting the environment acausally—off-policy evaluation here isn't over a policy class but over logical dependencies, a type error in MDPs.  
  5. (4) is a blind spot in your framework: RL assumes causal dynamics (POMDPs), while UDT's logical correlations are non-causal and irreducible to priors or penalties, exposing a limitation in standard RL's ontology, not vagueness in UDT.
