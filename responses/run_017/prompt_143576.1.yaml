  ### (1) Branch Questions in Order  
  1. **Unsignalled Intervention**: In a case where a neuroscientist intervenes via a quantum coin flip to prevent an agent from doing A (making it impossible to do A), but the coin doesn’t land heads and the agent does A without intervention, is the agent responsible for doing A?  
  2. **Determined World**: In a fully determined world, can an agent ever be morally responsible for an action?  
  3. **Manipulation**: If an agent’s character is set by a manipulator so that they inevitably do a wrong, but they do it for their own reasons (without coercion), is the agent morally responsible?  
  4. **Equally Awful Candidates**: If an agent votes for candidate A (who is awful) and could have voted for candidate B (who is equally awful) but did not, is the agent blameworthy for voting for A?  
  5. **Endorsed Desire**: If an agent does a bad action because of a strong desire that they endorse (they think it’s good to act on this desire) and could have done otherwise, but due to the desire’s strength did not respond to moral reasons against the action, is the agent blameworthy?  

