  ### (3) Leaves (View & Most Awkward Commitment)  
  1. **Hard Incompatibilism**: You must accept that no one is ever morally responsible for anything.  
  2. **Classical Leeway Incompatibilism**: You must accept that determinism precludes responsibility *and* robust alternative possibilities (exculpating options) are always required.  
  3. **Flicker/Source Incompatibilism**: You must accept either that responsibility hinges on trivial alternative possibilities (e.g., intervention sequences) *or* on non-determined sourcehood alone—both of which are incompatible with determinism.  
  4. **Leeway Compatibilism**: You must accept that responsibility requires alternative possibilities analyzable compatibilistically (e.g., conditional freedom), which trivializes "could have done otherwise."  
  5. **Semicompatibilism**: You must accept that agents in deterministic worlds can be responsible without alternative possibilities, relying on reasons-responsiveness in the actual sequence.  
  6. **Attributionism**: You must accept that responsibility depends solely on quality of will, even for actions where the agent lacked control or reasons-responsiveness.  

