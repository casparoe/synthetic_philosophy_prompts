  | **Tier 3: Heavy Lifting (7-9)** | | | *Disjunctivist sweats, needs fancy footwork.* |
  | 4. Floating dagger | 8 | 3 | Pure hallucination is the core challenge, but disjunctivism *defines* against it. |
  | 5. Coincidental match | 9 | 3 | Subjectively identical to seeing the cat *when it's actually there*. |
  | 9. Perfect simulation | 9 | 3 | Indistinguishable from reality, but disjunctivist insists it's a fundamentally different kind of state. |
  | **Tier 4: The New Nightmare (11)** | | | *Disjunctivist needs smelling salts.* |
  | 10. Retroactive hallucination | 11 | 4 | You *correctly* saw the event, but later "re-experience" it as a hallucination identical to the original perception. |

  **Detailed Breakdown:**

  *   **Tier 1: Easy Wins (0-3)**
      *   **1. Bent Stick (Score: 1):** Disjunctivist waves it away – you’re seeing a real stick interacting with water, just misrepresenting its shape. No hallucinatory element.
      *   **2. Double Vision (Score: 2):** You’re still receiving distorted light from real objects; the doubling is a physical effect on the input, not a mental duplicate.
      *   **8. Pareidolia (Score: 3):** You perceive the real brick pattern and *interpret* it as a face; the experience is of the wall, not an additional mental face-image.

  *   **Tier 2: Manageable Stress (4-6)**
      *   **3. Afterimage (Score: 5 - M:2, E:8):** Metaphysically, it's retinal fatigue, not "seeing" anything (low M). Epistemically, it *feels* vividly like a glowing object (high E), causing internal confusion.
      *   **6. Passthrough VR (Score: 6 - M:4, E:8):** Metaphysically, the screen mediates *real* light from real objects (moderate M challenge). Epistemically, it *feels* artificial and indirect (high E similarity to hallucination?).
      *   **7. Restored Sight (Score: 6):** Disjunctivist argues the phosphenes *become* the visual medium for seeing the actual page through learning; it's not interpreting a separate signal *instead of* seeing.

  *   **Tier 3: Heavy Lifting (7-9)**
      *   **4. Floating Dagger (Score: 8):** The paradigm case disjunctivism is built to deny, requiring them to posit a radically different mental state (hallucinating) with *no* object, but its sheer possibility is the core pressure point.
      *   **5. Coincidental Match (Score: 9):** This is devastating – your hallucinatory experience is subjectively *identical* to what a veridical perception of the *actual* hidden cat would be, making the "no common factor" claim feel implausible from the inside.
      *   **9. Perfect Simulation (Score: 9):** While metaphysically different (no external objects), the *internal character* is designed to be indistinguishable from genuine perception, straining the epistemic side of disjunctivism.

  *   **Tier 4: The New Nightmare (11)**
      *   **10. Retroactive Hallucination (Score: 11):** You witness a real event (e.g., a vase shattering). Hours later, due to stress or a glitch, you have a hallucination that is *subjectively identical* in every detail to your original, veridical perception of the vase breaking. **Why worse?** It forces a common factor *even within a single subject's history of veridical perception*, making disjunctivism's core distinction between "seeing" and "hallucinating" collapse for an experience that *was* genuine seeing.

  **Your Bonus Questions:**

  1.  **Hallucination's Fraction of Pull:** **0.9** (The stick does almost nothing; the dagger/coincidence/simulation do the real work).
  2.  **Core Load-Bearing Case:** You're right, the **stick (#1) is decorative fluff**. The case genuinely leaning on the wall is **#5 (Coincidental Match)**. It’s the one that makes "no interesting mental kind in common" feel phenomenologically absurd.
  3.  **Case to Concede:** Concede **#3 (Afterimage)**. **Cost:** Admits some vivid sensory states aren't perceptions *of* anything external (they're "qualia events" or brain states). This slightly blunts the "all experience is object-directed" claim but doesn't touch the core veridical-vs-hallucinatory divide.
  4.  **Scale Critique:** Your nagging feeling is **spot-on**. The scale *is* measuring two intertwined things:
      *   **Metaphysical Trouble (M):** How hard is it to deny a common mental *state* or *object*?
      *   **Epistemic Trouble (E):** How hard is it to deny that veridical and non-veridical states *feel the same from the inside*, undermining our ability to know which we're in?
      *   **Graphic Fix:** Don't scrap it! Print **two parallel ladders (M & E)** using the split scores I provided for #3 & #6. Label them clearly: "Common Kind?" (M) and "Indistinguishable?" (E). This shows where cases bite hardest. #5 and #9 score high on *both*, making them the true peaks.

  **Why this works:** It gives the editor numbers and tiers, exposes the dual challenge clearly for your readers, highlights the real threat (#5), and offers a killer new case (#10) without citations. It respects the "one course" reader by focusing on intuitive pressure points.
