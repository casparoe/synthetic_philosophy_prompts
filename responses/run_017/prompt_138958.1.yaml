  Here's your disjunctivist ladder, scored and tiered for impact. I've split cases where metaphysical/epistemic tension is high, flagged with (M/E scores). **Tier summaries first** for clarity:

  | Case | Score | Tier | Why? |
  |------|-------|------|------|
  | **Tier 1: Easy Wins (0-3)** | | | *Disjunctivist shrugs: "That's just misperceiving reality."* |
  | 1. Bent stick | 1 | 1 | Misrepresentation of a real object (the stick) explains everything. |
  | 2. Double vision | 2 | 1 | Caused by eyeball pressure distorting input from real objects. |
  | 8. Pareidolia | 3 | 1 | You see the real wall *as* a face; no extra mental object needed. |
  | **Tier 2: Manageable Stress (4-6)** | | | *Disjunctivist winces but has counterplays.* |
  | 3. Afterimage | 5 (M:2, E:8) | 2 | Metaphysically distinct (retinal fatigue), but internally confusing. |
  | 6. Passthrough VR | 6 (M:4, E:8) | 2 | You're *indirectly* seeing real objects via mediating tech. |
