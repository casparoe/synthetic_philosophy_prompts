  BN1 → No → BN2 → No → BN3 → No → BN4 → No → BN5 → Yes → BN6 → No → BN7 → Yes: Leaf 6b (Aging Genetic Amplification)  
  BN1 → No → BN2 → No → BN3 → No → BN4 → No → BN5 → Yes → BN6 → No → BN7 → No: Leaf 6c (Aging Environmental Restriction)  
