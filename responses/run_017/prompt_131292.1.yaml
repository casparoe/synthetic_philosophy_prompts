prompt: |-
  Hey — I'm in the third year of a history PhD (economic/global history, sort of) and I need to turn a half-baked idea into a two-page proposal for a nine-month dissertation fellowship; the deadline's in a couple of weeks and I've got nothing on paper. The thing I keep circling is the old "why Britain and not China?" question — the Great Divergence / Needham-question style thing — and I'm actually less interested in answering it than in whether it's a well-posed question at all. My supervisor says it's either trivial (they had coal and colonies, we didn't) or meaningless, and a friend in the econ department says it's just an identifiability problem: sustained growth in income per head happened once, so n=1, and you can't separate "Britain had the causes" from "whoever went first would end up looking like Britain afterwards". My flatmate, who did a philosophy BA, says this is just the 1980s literature on contrastive explanation with the serial numbers filed off. None of those three quite matches what's bugging me.

  Here's the half-formed bit I want you to sharpen. I've been calling it the transplant test, or the portability test: when someone offers a factor F as the answer to "why A rather than B?", make them specify the counterfactual transplant — F present in B's setting, or absent from A's, everything else about B held fixed — and then say what would have happened. If they can't do it without the specification quietly dissolving the unit being compared (you can't turn a vast composite empire into a small state inside a competitive states system while holding that unit fixed), then F isn't a difference-maker across the contrast; it's either a re-description of the outcome, or a signal that the units were cut at the wrong scale. My guess — the thing I want the proposal to actually test — is that if you run this audit across the usual list of candidate causes (coal and colonies; high wages and cheap energy; parliamentary constraint on the executive and secure property; war-driven fiscal capacity; the scientific-culture story; maybe the revisionist line that living standards on both sides were comparable surprisingly late) a lot of the leading explanations come out non-portable, and that what this shows isn't that the question is meaningless but that it's ill-scaled: it wants to be asked of regions — a Yangzi delta against an English one — rather than of civilisations. A second thought I had, which you should use or kill: the question might really be three questions with different well-posedness conditions — a selection question (why this one out of the pool of candidates?), a transformation question (why did this one change and the other not?), and an attribution question (why does the outcome have the shape it has?) — and maybe only the first of them is tractable once you widen the pool to the later industrialisers, which gets you more than one case.

  So write me the proposal — about 1000 words, short headed sections, the sort of thing a committee reads in four minutes. I need: the question stated precisely enough that it has a determinate answer (including pinning down the outcome variable — income per head, mechanised industry, or sustained technological change — and being honest that when the gap opened is itself part of what's contested); why the existing answers leave it open, where for each of the main stories you say which specific move blocks the transplant test rather than just saying the literature is divided; the method, month by month over nine months, and why that method rather than the obvious alternatives (another cross-country regression, or just doing archive work on one region); what the deliverable is for a historian who isn't a philosopher; what would count as the project failing; and what makes it too big for nine months. Don't give me citations or a bibliography — I'll fill those in — refer to positions by nickname instead. Also please actually confront the supervisor's "trivial or meaningless" objection and the n=1 objection rather than gesturing at them; if my portability idea collapses into something already done, say so in the proposal and say what the version that survives looks like.

  After the proposal, give me a single JSON object with this exact schema, so I can paste it into my planning notes:

  - "question": string, the sharpened question in one sentence
  - "readings": array of objects, one per question-type you keep (drop any you killed), each with keys "type" (selection / transformation / attribution, or your own relabel), "status" (one of "well-posed", "ill-posed", "ill-scaled", "tractable-only-if-revised"), and "why" (one sentence)
  - "portability_audit": array of objects, five or six rows, each with keys "factor" (short name of the candidate cause), "transplant" (the counterfactual transplant you'd demand, one sentence), "verdict" (one of "portable", "non-portable", "unclear"), "note" (one sentence on what the verdict shows)
  - "schedule": array of objects, one per block of months, keys "months", "task", "output"
  - "failure_conditions": array of strings, each a concrete state of the world in which I should conclude the project didn't work
  - "deliverable": string, what a non-philosopher historian gets out of it
  - "biggest_scope_risk": string
  - "strongest_objection": string, the best thing my supervisor could say
  - "confidence": integer 0–100, how much you'd bet the framing survives contact with the committee
reasoning: |-
  We are writing a two-page fellowship proposal (approx. 1000 words) with short headed sections. The core idea is to use a "transplant test" to audit explanations for the Great Divergence (why Britain industrialized first and not China). The key insight is that many proposed factors fail the test because they are not portable without dissolving the units of comparison (e.g., nations vs. regions). We also consider breaking the question into three types (selection, transformation, attribution) and argue that only the selection question becomes tractable when expanding the pool to later industrializers.

  Structure the proposal as follows:

  1. **Title and Section Headings**: Use clear, bold headings.
  2. **The Core Question**: State the question precisely, defining the outcome and acknowledging the contested timing.
  3. **Why Existing Answers Leave It Open**: For each major explanation, show how it fails the transplant test (without citations, use nicknames).
  4. **Method**: Month-by-month plan over 9 months, and why this method (not regressions or archive work).
  5. **Deliverable**: What a non-philosopher historian gets.
  6. **Failure Conditions**: Concrete states where the project didn't work.
  7. **Why Too Big for Nine Months?**: Acknowledge the scope and what would be deferred.
  8. **Addressing Objections**: Confront "trivial or meaningless" and "n=1" directly.

  After the proposal, provide the JSON object as specified.

  Let's outline the proposal:

  **Title**: The Portability Audit: Reassessing Explanations for the Great Divergence

  **Sections**:

  1. **The Core Question**: 
     - Outcome variable: Sustained technological change (as the key to growth, acknowledging the debate on timing and income measures).
     - Question: Why did sustained technological change emerge in 18th-century Britain rather than in contemporaneous China? But we reframe: Is this question well-posed? And if not, how can we salvage it by rescaling (to regions) and re-typing (into selection/transformation/attribution)?

  2. **Why Existing Answers Leave It Open**: 
     - For each candidate factor, we describe the transplant and why it fails:
       - Coal and colonies: Transplant coal to China? But China had coal; the issue was location and transport. Verdict: non-portable (shows outcome is redescription).
       - High wages and cheap energy: Transplant high wages to China? But wages were part of a system; isolated transplant changes the unit. Verdict: non-portable.
       - Parliamentary constraints: Transplant a British-style parliament to Qing China? This dissolves the imperial structure. Verdict: non-portable (ill-scaled).
       - War-driven fiscal capacity: Transplant European-style interstate competition to China? But China was a unified empire. Verdict: non-portable (unit mismatch).
       - Scientific culture: Transplant the Royal Society to China? But China had its own scholarly traditions; the transplant doesn't fit. Verdict: unclear (depends on what part of culture is portable).
       - Revisionist living standards: If living standards were comparable, then why the divergence? The transplant of "comparable living standards" is already true, so it doesn't explain the takeoff. Verdict: non-portable for explaining change.
     - Common pattern: Factors are embedded in contexts that cannot be held fixed, so the question as posed (nation vs. nation) is ill-scaled.

  3. **Method** (9 months):
     - Months 1-2: **Framework refinement**. Define the three question types (selection, transformation, attribution) and the transplant test criteria. Output: Working paper on the framework.
     - Months 3-4: **Audit Phase 1 (Britain and China)**. Apply the transplant test to 5-6 leading explanations for the Britain-China contrast. Output: Audit tables and narrative report.
     - Months 5-6: **Rescaling to regions**. Shift focus to Yangzi Delta vs. England. Re-audit factors at this scale. Output: Revised audit with regional focus.
     - Months 7-8: **Expansion to later industrializers (selection question)**. Use cases like Japan, Germany, USA to test the selection question: why these from the candidate pool? Output: Case comparisons and selection model.
     - Month 9: **Synthesis and writing**. Integrate findings, address objections. Output: Draft fellowship report and plan for future work.

     Why this method? Cross-country regressions assume portability and fixed units, which we problematize. Archive work on one region is too narrow for the comparative question. Our method is structured comparison with explicit counterfactuals.

  4. **Deliverable for Historians**: A diagnostic toolkit for evaluating historical explanations: (a) a checklist for when a divergence explanation is likely ill-scaled, (b) a reframing of the Great Divergence as a regional rather than civilizational phenomenon, and (c) a case for treating the "why Britain?" question as one of selection from a pool of potential industrializers (including later ones).

  5. **Failure Conditions**:
     - If all factors pass the transplant test (unlikely, but then the method fails).
     - If the regional rescaling doesn't resolve the portability issues.
     - If the selection question, when expanded to later industrializers, shows no pattern (no common factors).

  6. **Why Too Big?**: The full Great Divergence question is vast. In nine months, we focus on the audit and rescaling, leaving a full regional comparison (e.g., including India) for future work. Also, the attribution question (why the shape of industrialization?) is set aside as less tractable.

  7. **Addressing Objections**:
     - Supervisor's "trivial or meaningless": It's not trivial because the transplant test reveals that the usual factors are non-portable, forcing a rescaling. It's not meaningless because the rescaled question (regions) and retyped question (selection) have determinate answers.
     - n=1 problem: By expanding to later industrializers (n>1), the selection question becomes tractable. The transformation question (why change in Britain?) remains hard, but we show why.

  **Now, write the proposal in clear, concise academic prose, about 1000 words.**

  After the proposal, provide the JSON object.

  Let's begin.
answer: |-
  ### Fellowship Proposal: The Portability Audit: Reassessing Explanations for the Great Divergence  

  **Core Question**  
  Why did *sustained technological change*—defined as recursive innovation in production processes—emerge in 18th-century Britain rather than in contemporaneous China? This reframes the "Great Divergence" puzzle by: (1) specifying the outcome as technological dynamism (not just income per head, which is contested in timing); (2) demanding that explanations pass a "transplant test" (counterfactual portability of factors without dissolving units); and (3) rescaling comparisons to regions (e.g., Yangzi Delta vs. England) while distinguishing three sub-questions: *selection* (why Britain from a candidate pool?), *transformation* (why did Britain change when China did not?), and *attribution* (why did industrialization take its specific form?). The audit reveals that the transformation question is ill-scaled for nations, but selection becomes tractable when expanded to later industrializers.  

  **Why Existing Answers Leave It Open**  
  Current explanations fail the transplant test—i.e., they cannot specify a counterfactual where factor *F* is moved between Britain and China while holding other conditions fixed. For each major candidate:  
  - **Coal and colonies**: Transplanting Britain’s coal deposits to China ignores that China had comparable reserves, but lacked integrated transport. *Verdict*: Non-portable—dissolves into a redescription of geography and empire.  
  - **High wages/cheap energy**: Imposing Britain’s wage-energy nexus on China requires altering labor markets and resource access, which erases Qing economic structures. *Verdict*: Non-portable—unit mismatch.  
  - **Parliamentary constraints**: Adding a British-style parliament to Qing China contradicts the imperial system’s logic. *Verdict*: Non-portable—dissolves the "state" unit.  
  - **War-driven fiscal capacity**: Transplanting European interstate rivalry to China ignores its unified sovereignty. *Verdict*: Non-portable—ill-scaled for empires.  
  - **Scientific culture**: Inserting the Royal Society into China’s scholarly traditions is incoherent without redefining "culture." *Verdict*: Unclear—depends on vague cultural boundaries.  
  - **Revisionist living standards**: If standards were similar pre-1800, the factor cannot explain divergence; transplanting "comparability" merely restates the puzzle. *Verdict*: Non-portable for transformation.  
  *Common failure*: Factors are embedded in national/civilizational contexts, making the Britain-China transformation question ill-scaled. Only the *selection* question (why Britain first?) survives when expanded regionally and to later industrializers (e.g., Germany, Japan).  

  **Method: Month-by-Month Plan**  
  *Why this approach?* Cross-country regressions assume portable factors, which we test and reject; single-region archives cannot address comparative divergence. Our structured audit combines conceptual analysis with historical comparison:  
  - **Months 1–2**: *Framework refinement*. Define transplant test criteria and three question types. *Output*: Working paper validating the audit against philosophy of contrastive explanation.  
  - **Months 3–4**: *Audit Phase 1 (Nation-scale)*. Apply transplant test to 5–6 factors in Britain-China literature. *Output*: Table of non-portable factors, showing why transformation question fails.  
  - **Months 5–6**: *Rescaling to regions*. Re-test factors for Yangzi Delta vs. England (e.g., coal access, proto-industrial density). *Output*: Report demonstrating tractability of regional comparison.  
  - **Months 7–8**: *Expand to selection question*. Compare Britain with later industrializers (Japan, Germany) to identify shared "candidate pool" traits (e.g., state fragmentation, urban networks). *Output*: Model of selection drivers (e.g., geopolitical pressure).  
  - **Month 9**: *Synthesis*. Integrate findings; address objections; outline implications. *Output*: Draft fellowship report and future work plan.  

  **Deliverable for Historians**  
  A practical diagnostic toolkit: (1) a checklist to identify when divergence explanations are ill-scaled (e.g., if factor transplant erases units); (2) evidence that regional rescaling (Yangzi vs. England) clarifies the divergence; and (3) a reframing of "why Britain?" as a selection problem among global candidates (including 19th-century industrializers), shifting focus from exceptionalism to recurrent enabling conditions.  

  **Failure Conditions**  
  The project fails if:  
  1. All audited factors pass the transplant test cleanly (contradicting preliminary analysis).  
  2. Regional rescaling resolves no portability issues (e.g., Yangzi-England factors remain embedded).  
  3. No common traits emerge in the expanded candidate pool (selection question yields no pattern).  
  4. The transformation question proves robust to rescaling (undermining the core critique).  

  **Why Too Big for Nine Months?**  
  The Great Divergence’s global scope exceeds nine months. We defer: (1) comprehensive regional comparisons (e.g., adding India); (2) archival deep dives into Chinese/British localities; and (3) full attribution analysis (why industrialization’s *form* differed). The fellowship focuses on the audit’s proof-of-concept, with broader applications as future work.  

  **Addressing Objections**  
  - *Supervisor’s "trivial or meaningless"*: The transplant test shows it is neither. Non-portability exposes factors as non-causal (not trivial redescription), and rescaling salvages meaning by refocusing on regions and selection.  
  - *Economist’s "n=1" problem*: The transformation question is indeed plagued by n=1, but expanding to later industrializers (n>1) makes the selection question tractable—e.g., "Why Britain first?" becomes "Why any industrializer from the pool?" with testable patterns.  
  - *Collapse into prior work?*: While the transplant test echoes contrastive explanation, it uniquely *operationalizes* it for historical divergence by forcing unit-scale accountability. The surviving insight is that rescaling to regions + retyping questions resolves stalemates.  

