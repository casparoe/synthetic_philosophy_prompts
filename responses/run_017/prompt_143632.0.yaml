  ### Grantmaking Simulation: "The Impact Trap"  
  **Goal:** Create visceral intuition for when ITN (Importance × Tractability × Neglectedness) fails, without jargon. Players experience coordination failures, time horizons, counterfactuals, and lumpy thresholds.  

  ---

  ### **Rules & Setup**  
  **Materials:**  
  - Whiteboard (for Almanac)  
  - 6 Cause Cards (1 set per table)  
  - Allocation Sheets (per table, per round)  
  - Auditor’s Note (distributed Round 4)  
  - Timer  

  **Players:**  
  - 4 tables, 3 players each.  
  - Each table controls a "foundation" with **$300,000 per round** (6 rounds total).  
  - **Goal:** Maximize "lives saved" by end of Round 6.  

  **Causes (Fictional):**  
  1. **Skywater Purification (Clean Water):**  
     - Base impact: $1 = 8 lives saved (immediate).  
     - *Hidden flaw:* After Round 3, auditor reveals 50% of work isn’t additional (adjust to $1 = 4 lives).  

  2. **CryoVault Seed Bank (Long-Term):**  
     - $1 = 20 lives saved **after 10 years**.  
     - Scoring: **0 lives** within game (only "saves" post-Round 6).  

  3. **Thunderbridge Construction (Lumpy):**  
     - Requires **$600,000 in one round** to build the bridge.  
     - If funded: $1 = 15 lives saved (immediate).  
     - If underfunded: $1 = 0 lives (materials rust away).  

  4. **Ember Network (Capacity Building):**  
     - $1 invested = 0 immediate lives.  
     - If **cumulative funding ≥ $750,000 by Round 4**, unlocks +50% multiplier on *all other causes* for Rounds 5–6.  

  5. **Nexus Vaccines (Disease Prevention):**  
     - $1 = 10 lives saved (immediate).  

  6. **AeroSensors (Pollution Tracking):**  
     - $1 = 6 lives saved (immediate).  

  ---

  ### **Round-by-Round Flow**  
  **Total Time:** 75 minutes (including debrief).  

  | Phase             | Time     | Activity                                                                 | Whiteboard Updates                                                                 |
  |-------------------|----------|--------------------------------------------------------------------------|------------------------------------------------------------------------------------|
  | **Introduction**  | 5 min    | Explain rules, distribute Cause Cards.                                  | Blank Almanac.                                                                     |
  | **Round 1**       | 5 min    | Tables allocate $300k. No prior data.                                    | —                                                                                  |
  | **Scoring**       | 2 min    | Facilitator calculates lives saved (ignore lumpy/thresholds this round). | Update Almanac: Show **Round 1 funding totals** for each cause.                    |
  | **Round 2**       | 5 min    | Allocate $300k. Almanac shows Round 1 data.                              | —                                                                                  |
  | **Scoring**       | 2 min    | Calculate lives. Check lumpy threshold ($600k in Round 2?).              | Update Almanac: **Round 2 totals** + **cumulative funding** for each cause.        |
  | **Round 3**       | 5 min    | Allocate $300k. Almanac shows Round 2 data (1-round lag).                | —                                                                                  |
  | **Scoring**       | 2 min    | Calculate lives. Check lumpy + Ember Network threshold ($750k total?).   | Update Almanac: **Round 3 totals** + **cumulative funding**.                       |
  | **Round 4**       | 5 min    | Distribute **Auditor’s Note** (Skywater flaw). Allocate $300k.           | Announce if **Ember multiplier** activates (if $750k+ by Round 4).                 |
  | **Scoring**       | 2 min    | Calculate lives (apply Skywater adjustment + multiplier if active).      | Update Almanac: **Round 4 totals** + **cumulative**.                               |
  | **Round 5**       | 5 min    | Allocate $300k. Almanac shows Round 4 data.                              | —                                                                                  |
  | **Scoring**       | 2 min    | Calculate lives (apply multiplier if active).                            | Update Almanac: **Round 5 totals** + **cumulative**.                               |
  | **Round 6**       | 5 min    | Allocate $300k. Almanac shows Round 5 data.                              | —                                                                                  |
  | **Final Scoring** | 5 min    | Sum lives saved (all rounds). Announce table scores + grand total.       | Display **final scores** + **total lives saved** across all tables.                |
  | **Debrief**       | 25 min   | Discuss failures, map to ITN gaps.                                       | —                                                                                  |

  ---

  ### **Scoring System**  
  **Simple Formula (per table, per round):**  
  ```  
  Lives = (AeroSensors × 6)  
          + (Nexus Vaccines × 10)  
          + (Skywater × 8 or 4*)  
          + (Thunderbridge × 15)**  
          + (CryoVault × 0)  
          + (Ember × 0)  
          × (1.5 if Ember active)  
  ```  
  \* Skywater adjusted to 4 after Round 3.  
  **\*\* Thunderbridge = 15 only if total round funding ≥ $600k; else 0.**  

  **Ember Multiplier:**  
  - Applies to AeroSensors, Nexus, Skywater, Thunderbridge.  
  - Active in Rounds 5–6 *only* if cumulative Ember funding ≥ $750k by Round 4.  

  **Tip:** Pre-calculate base impacts (e.g., $100k to Nexus = 1M lives) to speed up scoring.  

  ---

  ### **Predicted Player Behaviors & Failures**  
  1. **Neglectedness Chase (Almanac Lag):**  
     - Tables see "low funding" in Almanac (e.g., CryoVault at $0 in Round 1) and fund it in Round 2.  
     - **Failure:** By Round 2, others do the same → CryoVault gets overfunded, but still scores 0.  

  2. **Lumpy Threshold (Thunderbridge):**  
     - Tables assume others will fund it → no one commits enough.  
     - **Failure:** Thunderbridge never hits $600k in one round → all funding wasted.  

  3. **Underinvestment (Ember Network):**  
     - $0 immediate payoff → tables ignore it until too late.  
     - **Failure:** Multiplier rarely unlocks (needs coordination by Round 4).  

  4. **Time Horizon (CryoVault):**  
     - Scores 0 in early rounds → tables abandon it.  
     - **Failure:** No one funds long-term gains.  

  5. **Counterfactuals (Skywater):**  
     - High early investment → plummets after auditor’s note.  

  ---

  ### **Debrief Guide**  
  **Map Game Moments to ITN Failures:**  
  | Game Moment             | ITN Failure                                  | Key Vocabulary Handout        |  
  |-------------------------|----------------------------------------------|-------------------------------|  
  | Thunderbridge unused    | Thresholds break "smooth" multiplication.    | Absorption capacity, fungibility |  
  | Ember underfunded       | Deferred benefits ignored; ITN misses leverage. | Option value, field building  |  
  | CryoVault funded then abandoned | Implicit time horizons distort priorities.   | Discount rate, marginal utility |  
  | Skywater drop after audit | ITN ignores additionality/counterfactuals.   | Crowding in, counterfactual   |  
  | Almanac-driven stampedes | Stale data creates coordination failures.    | Marginal impact, information lag |  

  **When a Player Says: "We should’ve gamed the scoring rule!"**  
  - **Response:** "Exactly. Real foundations *also* optimize for metrics that may misrepresent impact. This game’s scoring rule imposed an arbitrary time horizon (6 rounds = 10 years?). If you don’t debate the rules, you’ll miss the real tradeoffs."  

  ---

  ### **What the Game Can’t Simulate (Tell Them This)**  
  1. **No Almanac:** Real-world neglectedness relies on patchy data, not a tidy dashboard.  
  2. **Uncertainty:** Impacts aren’t fixed numbers; they’re distributions (which ITN oversimplifies).  
  3. **Value of the Future:** No framework resolves moral disagreements about long-termism.  
  4. **Dynamic Effects:** Funding alters tractability/neglectedness (e.g., crowding in others).  

  ---

  ### **First-Run Risks & Mitigations**  
  - **Risk:** Thunderbridge never funds → no threshold lesson.  
    *Fix: Seed a rumor pre-game: "Rumor: Thunderbridge might get external funding if you commit first."*  
  - **Risk:** Ember ignored entirely.  
    *Fix: In Round 2, hint: "Some causes unlock hidden multipliers."*  
  - **Risk:** Scoring takes too long.  
    *Fix: Use pre-printed impact calculators (1 sheet per cause).*  

  ---  
  **Outcome:** Players leave feeling the *limits* of ITN, not just the formula. They’ll see why "marginal" and "counterfactual" matter before they say the words.
