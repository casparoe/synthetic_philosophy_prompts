       7. The sharp observation: if the winning move was to game the scoring rule, then we must be aware of what the rule is. In reality, the rules (implicit time horizons, priorities) should be explicit and carefully chosen.

     And the limitations of the game:

          - In reality, you don't have exact numbers.
