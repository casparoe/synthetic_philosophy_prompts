answer: |-
  Right, I'm right there with you in the epiphenomenalism trenches – it’s a deeply unsettling view that somehow keeps pulling you back in. My current credence lands around 0.15, distinctly lower than yours and significantly below your friend's. Let me unpack that, pricing your terms and adding one I think you’ve missed, then we can wrestle with the permutation test and the credence gap.

  Starting with your decomposition:  
  1.  **Phenomenal Non-Identity (P ≈ 0.7):** That there’s a genuinely non-physical, non-functional "something extra" – phenomenal properties irreducible to physical/functional states. The persistence of the explanatory gap, the conceivability arguments (Chalmers’ zombies, Jackson’s Mary), and the sheer brute fact of subjective feels push me here. While reductive physicalism or illusionism might dissolve this, they feel like evasions of the hard problem.  
  2.  **Causal Closure of the Physical (P ≈ 0.95):** That every physical event, including every neural spike and vocal utterance, has a sufficient physical cause. This seems bedrock. Physics works, neuroscience finds physical causes for behaviour, and violations imply spooky action or gaps science hasn't found and likely won't. Denying this feels like surrendering to pre-modern metaphysics.  
  3.  **Causal Irrelevance without Overdetermination/Same-Level Redescription (P ≈ 0.5):** Granting non-identity and closure, is the phenomenal property *just* inert, not sneaking back in? The exclusion argument is powerful: if the physical cause (neural state N) is sufficient for the effect (report R), and the phenomenal property (Q) is distinct, what causal "work" is left for Q? Overdetermination seems wildly implausible for every mental event, and redescribing N as "N-causing-Q" doesn't grant Q causal powers over R. But intuitions about mental causation are strong, and the *experience* of conscious will makes this hard to fully accept. I’m genuinely torn.  
  4.  **Knowledge Survival (Paradox of Phenomenal Judgment) (P ≈ 0.4):** This is where it gets gnarly and, for me, where epiphenomenalism stumbles hardest. *Can* my report "I see red" be *knowledge* if the redness itself played no causal role? Your "tracking without causation" analogy is the epiphenomenalist's best shot – N causes the report *and* necessitates Q, so the report reliably covaries with Q, like the shadow with the flagpole. Your friend is right that *some* knowledge (e.g., indexicals, certain mathematical truths) might not require direct causal chains. But phenomenal reports feel different. The permutation test crystallizes the worry: fix all the physics, swap Q for Q* (or remove it entirely), and the report stays the same. The report is *insensitive* to the very property it's about; it would say "red" regardless of whether *this* red experience, a different one, or none was present. This looks like the epitome of an *accidentally true belief*. If knowledge requires sensitivity (or safety) across relevant nearby possibilities, and my report remains the same even if Q is radically different or absent (holding the physical base fixed), then it seems Gettiered – justified, perhaps, but only luckily true *about Q*. Reliability in the *actual* world, driven solely by the physical N-Q correlation, might give you true belief, but knowledge requires something more robust against relevant error possibilities. The possibility of a physical duplicate without Q (a zombie reporting "red") *is* a relevant nearby possibility under epiphenomenalism, and my report fails there. I think your unease is well-founded.  

  I’d add a fifth term you implied but didn’t separate:  
  5.  **The Metaphysical Necessitation Link (P ≈ 0.7):** That there exists a law-like connection binding the physical base state (B) to the specific phenomenal property (Q) *and* simultaneously to the neural report state (N), such that B necessitates *both* N and Q, creating the correlation. This is crucial for the tracking story. While psychophysical laws seem necessary for non-reductive views, their nature is deeply mysterious. Are they fundamental brute laws? Why do they link *this* B to *this* Q? This adds ontological complexity.  

  **Combining them (roughly multiplicative):** 0.7 (Non-Id) * 0.95 (Closure) * 0.5 (Irrelevance) * 0.4 (Knowledge) * 0.7 (Necessitation) ≈ 0.093. Rounding up slightly for potential interactions/uncertainty gives my ~0.15. The Knowledge Survival term is the biggest drag. My overall credence is most sensitive to **Knowledge Survival (Term 4)**. If I became convinced that reliable covariation via a shared necessitating base *was* sufficient for knowledge (even under permutation), that term could jump to 0.7+, pulling my overall credence near 0.3. Conversely, if I became certain sensitivity was required for knowledge here, dropping it to 0.1 would sink epiphenomenalism for me.

  The term I'm **least confident about** is **Causal Irrelevance (Term 3)**. The exclusion argument is logically tight but feels intuitively jarring. What could move it? Not direct empirical evidence – we can't isolate Q. But strong evidence for radical neural plasticity could help. Suppose we find that *dramatically* different neural states (N1, N2), implementing the same computational function in different individuals or after brain injury, reliably correlate with reports of the *same* Q (e.g., "red"). This *might* suggest Q is tied to the function, not the specific physical N, potentially undermining the neat N-Q link assumed in the overdetermination worry and making the inertness of Q seem less paradoxical. Alternatively, compelling non-reductive physicalist models showing how Q could be causally relevant without violating closure (e.g., strong emergence with novel powers) could push this term up, though that's a tall order. Illusionist arguments could push it down.

  The gap between your 0.3 and your friend’s 0.6 almost certainly lives and dies with the **Paradox of Phenomenal Judgment (Term 4)**. You are deeply worried by the permutation test's implication of insensitivity and luck. Your friend likely finds the tracking-without-causation model (shadow/flagpole) sufficient for justified true belief *counting* as knowledge in this specific context, dismissing the permutation scenario as irrelevant or mischaracterizing the relevant counterfactuals. They might emphasize the brute reliability in the actual world established by the psychophysical law linking B, N, and Q. Your lower credence reflects a stricter epistemological standard for what constitutes knowledge of one's own mind under this metaphysics. It's not that you're "spooked" by the paradox; you're taking its epistemic implications seriously. Resolving that disagreement about the nature of self-knowledge under epiphenomenalism is key to closing your credence gap with your friend.
