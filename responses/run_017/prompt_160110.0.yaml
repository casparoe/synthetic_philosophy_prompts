prompt: |-
  Hey, I'm taking a philosophy of mind seminar this term and I keep flip-flopping on epiphenomenalism, so I want to force the reasoning into the open. My credence right now is around 0.3 that epiphenomenalism about phenomenal consciousness is true, by which I mean: phenomenal states are produced by, or at least necessitated by, physical states, but they have no causal influence on anything physical, including the beliefs and the sentences I produce about my own phenomenal states. My friend in the seminar is at about 0.6 and says I'm only lower because I'm spooked by the paradox of phenomenal judgment.

  Give me your own number, but mostly give me the decomposition. The terms I want priced are: that phenomenal properties aren't identical with any functional or physical property in the first place, so that there is something left over to be epiphenomenal; that the physical is causally closed, so that every utterance and every neural event has a sufficient physical cause; that granting both of those, the leftover phenomenal property isn't causally relevant anyway, rather than sneaking back in as an overdetermining cause or as the same cause redescribed at a higher level; and then a separate term for whether the paradox is fatal, that is, whether a claim I make about my own consciousness can still be knowledge if my being in that state had no causal role in producing the claim, or whether the view saws off the branch it is standing on. Add any term you think I've left out, and say if you think my four are the right cut.

  The bit I actually want you to fight with is the one move I can half get to work for the epiphenomenalist, which I've started calling tracking without causation: my report is caused by neural state N, N is tied by natural law to the phenomenal property because both are necessitated by the same underlying physical base, so the report carries information about the phenomenal property without being caused by it, the way the length of a shadow carries information about the height of what casts it without being pushed by it. What bothers me is what I think of as the permutation test: hold the entire physical base fixed and swap which phenomenal property is attached to it, or detach one entirely, and every report comes out byte-identical, so the report is insensitive to the very fact it is supposed to be about, and I cant see how insensitivity of that shape leaves you with knowledge rather than a lucky true belief. My friend says that's the wrong counterfactual to demand and that knowledge only needs reliability across the range of cases the mechanism actually meets. I don't know who's right and I don't know how much of my 0.3 is riding on it.

  So: your number, your decomposed terms with a rough probability and one line of justification each, how you combine them into the final figure, which single term your answer is most sensitive to, which term you're least confident about and what would move it, including what kind of hypothetical empirical finding would move it given that nobody can run the permutation test, and where you think the gap between me at 0.3 and my friend at 0.6 really lives. Write it as continuous prose please, no headings, bullet points, bold text or tables, just the way you'd write it in an email.
