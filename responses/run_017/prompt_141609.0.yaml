  We are given an argument that every nontrivial abelian group has a maximal proper subgroup, but we suspect that this is false because ℚ (the additive group of rationals) does not have a maximal proper subgroup.

  The argument uses Zorn's lemma on the poset P of proper subgroups of G (nontrivial abelian group) ordered by inclusion. The steps are:

  (1) P is nonempty because {0} is a proper subgroup (since G is nontrivial).
  (2) For a chain C of proper subgroups, the union H = ∪C is a subgroup (standard argument: for any two elements x, y in H, there are subgroups H1, H2 in C containing them, and since C is a chain, one of H1 or H2 contains the other, so both x,y are in the larger one, hence x+y and -x are in that subgroup and hence in H).
  (3) The union H is proper? This is the critical step.

  The argument claims that H is proper. But is it? We must show that H is not the entire group G.

  In the case of G = ℚ, let us see what can happen. Suppose we have a chain of proper subgroups. For example, consider the subgroups H_n = (1/n!)ℤ = { k / n! : k ∈ ℤ } for n=0,1,2,... (where 0! = 1). Each H_n is a subgroup of ℚ, and it is proper because, for instance, 1/(n!+1) is not in H_n. Also, H_n ⊆ H_{n+1} because 1/n! = (n+1)/(n+1)!.

