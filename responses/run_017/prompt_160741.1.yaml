  For the moral philosophers, I recall their established skepticism about large-number ethics. They'll probably dismiss the entire expected-value framework when dealing with cosmic scales. The response should acknowledge their meta-concern while keeping the argument actionable for decision-makers. 

  The funding question is simpler but crucial. The reply must balance epistemic humility with practical recommendations - hence suggesting portfolio diversification rather than total abandonment of longtermist work. 

