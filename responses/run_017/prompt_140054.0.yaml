  The winter air bit deep as Marta crunched across the frost-stiffened grass towards the dome. The pampas stretched away under a bruised pre-dawn sky, vast and silent except for the mournful cry of a distant hornero. Inside the caretaker’s cottage, the shortwave receiver on the shelf clicked its regular, metallic heartbeat: *tick-tick-tick*. Time, measured, official, unconcerned.

  The observatory was a relic. Its brass telescope, its dome cranked open by hand, the smell of old wood and machine oil – all were scheduled for mothballs come spring. Marta’s job, maintaining the handwritten observation log, felt increasingly like tending a ghost. For six years, her neat script had filled the pages: coordinates, magnitudes, atmospheric notes. Each entry a fixed point in their shared, linear history.

  Last night had been clear, bitterly cold. She remembered the sharp stars, the Milky Way a frozen river overhead. She remembered the familiar ache in her shoulder from turning the dome’s heavy wheel. She remembered… uncertainty? A strange flicker near Epsilon Orionis. A smudge? A glint? She’d stared, rubbed her eyes, recorded it. *Anomalous point-source near eps Ori. Faint, steady. Possible nova? Awaiting confirmation.* That was it. She’d locked up, trudged back to the cottage, the shortwave’s *tick-tick-tick* her only company before sleep.

  Now, she entered the observing room, the chill deeper inside the stone building. She went straight to the logbook, its thick leather cover worn smooth. Habit. She opened it to the last written page, ready to date it for the new night.

  There were two entries.

  Both dated last night. Both in her unmistakable, precise handwriting. Both detailing the cold, the clarity of the sky, the observation near Epsilon Orionis.

  The first entry ended: *…Possible nova? Awaiting confirmation.*

  The second entry ended: *…Possible comet? Awaiting confirmation.*

  *Nova*. *Comet*. One word difference. Identical otherwise. Her hand trembled slightly against the worn paper. She traced the letters. Hers. Undeniably hers, the slight slant, the pressure of the pen. Both entries felt as real as the cold stone under her feet. She *remembered* writing one. But which? The memory of the pen scratching, the cold seeping through her gloves, the decision to write ‘nova’ – it was there. And simultaneously, just as vividly, the hesitation, the doubt, the choice to write ‘comet’ instead.

  Panic fluttered, then subsided into a profound, icy stillness. She checked the logbook mechanically. No missing pages. No signs of tampering. Just two entries, side by side, for the same night. She looked at the telescope, silent under its closed dome. She looked at the wall-clock, its second hand sweeping smoothly in time with the shortwave’s distant *tick*. It showed a single, unambiguous time.

  The day proceeded with a surreal normality. She cleaned lenses, performed routine checks, her body moving through the familiar chores. But her mind felt stretched, thin. She wasn’t haunted by *which* night she had lived – the nova night or the comet night. The question itself felt… wrong. Like asking which side of a coin is the *real* coin while it spins in the air. Both possibilities were etched into the record, both were part of the fabric of *this* morning, *this* logbook, *this* Marta who stood here, holding the evidence of both paths in her own hand.

  It wasn’t amnesia. She *had* memories of both observations. In one, the pinpoint light near Epsilon Orionis had held the fierce, unwavering intensity suggestive of a stellar explosion. In the other, it had possessed a subtle, diffuse quality, a hint of fuzziness that whispered ‘visitor’. Both memories felt equally lived, equally *hers*, converging seamlessly on this moment of discovery. The paths hadn’t just split; they had woven back together, leaving a single strand thickened by the ghost of its twin.

  The question her colleague would ask – *Which branch are you in?* – felt childish now. Superficial. Like asking a river which raindrop it came from. She was *after* the confluence.

  As the pale winter sun began its descent, casting long shadows across the pampas, a different unease settled upon her. It wasn't about knowing. It was about owing.

  In the memory of the 'comet' night, everything was routine. She had finished her observations, secured the dome, walked the familiar path back to the cottage without incident. The frost was thick, but she’d been careful.

  In the memory of the 'nova' night… there had been a moment. Walking back, distracted perhaps by the thought of the potential stellar cataclysm she’d witnessed, her boot had caught on a hidden, frost-heaved root near the old well. She’d stumbled hard, landing awkwardly on her wrist. It throbbed dully even now, a phantom echo in the memory – though her actual wrist felt fine. Worse, as she’d fallen, her elbow had struck the brittle wooden cover of the well. A sharp *crack* echoed in the still air. She’d scrambled up, heart pounding, and inspected the damage in the beam of her torch. A jagged piece of the ancient wood, about the size of her hand, had splintered off and fallen down into the dark shaft. The cover was old, rotten; it was an accident. No one used the well. It didn’t seem important then, just a sting in her wrist and a pang of clumsiness. She’d hurried home.

  Now, standing in the quiet observatory, the two memories equally present, the splintered wood took on weight. In one reality, the cover remained intact. In the other, it was damaged. A small thing. Insignificant? Perhaps. But it *had* happened. One version of her had caused it.

  Did she bear responsibility for that broken wood? It wasn’t malice, just a stumble. But the damage existed… *somewhere*. In the path she hadn’t walked? But that path wasn’t separate; it was braided into her now. The guilt for the stumble felt as real as the relief of the unblemished walk. Could she dismiss the broken wood simply because she *also* remembered not breaking it? Did the *possibility* of her clumsiness, made manifest in the doubled log, demand acknowledgment?

  Her colleague would scoff. "You only actually broke it if you're in *that* branch. Find evidence. Check the well."

  But evidence felt secondary. The *fact* of the two entries, the undeniable reality of her doubled memory, changed the texture of responsibility. It wasn't about assigning blame to one path over the other. It was about the potential that lived within her actions, potential that had, in a way Marta couldn't articulate but felt bone-deep, become actualised *somehow* through this impossible confluence. That potential for damage was part of her story now, as surely as the unbroken path was.

  She walked outside. The air was sharp. She crossed the frosted grass towards the old stone well, its wooden cover dark against the twilight. She hadn’t looked at it since last night. Which reality would she find? Intact? Or bearing a jagged wound?

  She hesitated a few feet away. The shortwave’s *tick-tick-tick* drifted faintly from the cottage. Time, measured. Official.

  Marta didn’t lift the cover. She didn’t need to. The question wasn’t *which* cover existed. The question was what she owed to the possibility she carried within her, the possibility made shockingly real by the two entries in the book, by the echo of a fall in a wrist that didn’t hurt.

  She turned back towards the observatory. The well could wait. She had the logbook to consider. And a report to write. Not about a nova, or a comet. Not yet. About a well cover. A potential hazard. Because whether the wood was splintered or whole right *now*, she knew, with a certainty deeper than evidence, that the act of breaking it, the stumble in the dark, belonged to her. Not to another version. To *her*. And that demanded something. Not confession, perhaps, but care. Acknowledgement of the weight carried by every choice, every step, in a garden where paths don't just fork, but sometimes, impossibly, flow back together.
