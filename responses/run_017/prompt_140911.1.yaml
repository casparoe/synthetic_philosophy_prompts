answer: |-
  ### **Game Design: "Mind Maze"**  
  **Goal:** Students experience the four transitions in the hierarchy by *operating under distinct constraints* that force different selection mechanisms. They navigate a grid world where hazards change between generations, causing inherited knowledge to become outdated.

  ---

  ### **Materials & Setup**  
  - **Grid World:** A 5x5 grid (drawn on posters).  
    - **Start:** Top-left cell (1,1). **Goal:** Bottom-right cell (5,5).  
    - **Hazards:** 5 cells are hazards (lose points). Hazard pattern changes each generation (round).  
    - **Example Patterns:**  
      - Gen 1: Hazards on all cells where row + column is *odd*.  
      - Gen 2: Hazards on all cells where the row number is *even*.  
      - Gen 3: Hazards on cells where column number > row number.  
  - **Stations:**  
    - **Darwinian:** Paper, pens.  
    - **Skinnerian:** Whiteboard markers (to draw paths on grid posters).  
    - **Popperian:** 3 "probe tokens" (colored chips) per team.  
    - **Gregorian:** "Lore packet" (envelope with instructions from prior team), blank paper, timer.  
    - **Solitary Popperian (Probe Station):** 3 probe tokens, no-talking rule.  
  - **Scoring:**  
    - Reaching goal: +10 points.  
    - Safe step: +1 point.  
    - Hazard step: -3 points.  
    - Candy rewards for top 2 teams (low stakes).  

  ---

  ### **Roles & Rules**  
  **Core Constraint:** Each station limits *how* players gather information and adapt.  

  | **Station** | **Permitted Operations** | **What "Dies"** | **Key Constraint** |
  |-------------|--------------------------|-----------------|-------------------|
  | **Darwinian** | Write a full path (e.g., "right, down, right...") *before* seeing the grid. | The organism | No feedback until all moves are scored. New team inherits a mutated path (one random change). |
  | **Skinnerian** | Move step-by-step. After each move, learn if it was safe/hazardous. | Behaviors | Can only adjust *after* experiencing payoff (hit/miss). |
  | **Popperian** | Use probe tokens to test cells *without moving*. Plan path after testing. | Hypotheses | Limited probes (3 tokens). Cannot test while moving. |
  | **Gregorian** | Inherit lore packet (e.g., "Avoid odd rows"). Invent notation. Update lore post-round. | Cultural tools | Transcribe lore to new packet under noise/time pressure (60 sec; facilitator introduces 1 error). |
  | **Solitary Popperian (Probe)** | Same as Popperian, but no communication. | Hypotheses | Players cannot speak, gesture, or share notes. |

  ---

  ### **Timeline (75 Min)**  
  1. **Intro (5 min):**  
     - *"You're explorers in a changing maze. Each team has different tools. Goal: Reach (5,5) with max points. Rules change each round."*  
     - Assign 5 groups (4-5 students each) to stations. **Do not label stations** (call them "Team Type A/B/C/D/E").  

  2. **Round 1: Generation 1 (20 min)**  
     - **Grid Rule:** Hazards where row + column = odd.  
     - Teams play at stations (including Solitary Popperian).  
     - Gregorians get a starter lore packet: *"Hazards on cells with row + column = even."* (Note: Outdated in Gen 2!)  
     - *Facilitator:* Quietly note group strategies.  

  3. **Round 2: Generation 2 (20 min)**  
     - **Grid Rule:** Hazards where row is even.  
     - Rotate groups: Darwinian → Skinnerian → Popperian → Gregorian → Solitary Popperian → Darwinian.  
     - **Gregorian Constraint (Probe):** New Gregorian team *must follow inherited lore for entire round* without testing. They write a path based *only* on lore and execute it blindly.  
     - Solitary Popperians again play in silence.  

  4. **Round 3: Generation 3 (20 min)**  
     - **Grid Rule:** Hazards where column > row.  
     - Rotate groups again (same order).  
     - Gregorians now operate normally (can test/update lore).  

  5. **Debrief (30 min):** *Crucial section—draw out tensions.*  

  ---

  ### **Probes & Their Purpose**  
  1. **Solitary Popperian Station:**  
     - *Expected Outcome:* Lower scores than collaborative Popperians. Players struggle to build on others' hypotheses.  
     - *What It Shows:* The Gregorian leap isn’t just about *having* hypotheses (Popperian), but **accumulating shared knowledge** through language. Isolation prevents tool-building.  

  2. **Gregorian Constraint (Round 2):**  
     - *Expected Outcome:* Teams hit hazards if lore is outdated (e.g., trusting Gen 1’s "avoid odd rows" when Gen 2 hazards are on even rows).  
     - *What It Shows:* **Tools can steer you wrong** if inherited uncritically. Students feel the vulnerability of relying on untested cultural artifacts.  

  ---

  ### **Debrief Guide**  
  **Map Game Moments to the Hierarchy:**  
  | **Game Moment** | **Hierarchy Concept** | **Question to Pose** |  
  |-----------------|------------------------|----------------------|  
  | Darwinian team re-uses a mutated path | Selection across generations | *"What 'died' when their path failed? Could they adapt mid-round?"* |  
  | Skinnerian revising after hitting a hazard | Selection within a lifetime | *"What was the cost of learning? Could they avoid risks?"* |  
  | Popperian burning a probe on a safe cell | Hypotheses dying in place of the agent | *"Did wrong guesses hurt the team, or just the probe token?"* |  
  | Gregorian team inventing shorthand (e.g., "R=bad") | Building minds from transmissible tools | *"Did your lore help the next team? Could it harm them?"* |  
  | Solitary Popperians failing silently | Language as an accumulator | *"Could you build tools alone? What did silence prevent?"* |  

  **Surface Resistances (Don’t Resolve—Discuss!):**  
  - *"We did Popperian things in Darwinian station!"* → Highlight: **Constraints force the mode.** Darwinians *guessed* but couldn’t *test* or *adapt*—only their "offspring" could.  
  - *"Gregorian is cheating!"* → Agree! But: **Tools *are* the mind.** The "cheat" is the point: brains leverage external symbols.  
  - *"A Skinnerian with memory is Popperian."* → Challenge: Can Skinnerians test *without acting*? Probes allow hypotheses to die *before* behavior.  
  - *"Why four rungs? Why not forty?"* → Argue: These are **distinct computational architectures**, not smooth gradients. Each changes *what carries the risk of failure*.  

  **Predictable Problems & Limitations:**  
  - Popperians burning probes early → *Use it!* Ask: "Did scarce probes force strategic thinking?"  
  - Gregorians hoarding lore → *Use it!* Ask: "Did noisy transcription corrupt your tools? Why update lore?"  
  - One student gaming constraints → *Acknowledge:* "This is why real minds aren't pure types—but the constraints *simulate* architectural limits."  
  - **The Unavoidable Flaw:** Participants can’t shed their Gregorian minds. Language pervades even "Darwinian" play. **State plainly:** "This game can’t simulate pre-linguistic cognition. The rules are *prosthetics* to approximate design constraints. Real Darwinian creatures don’t 'infer'—they just die."  

  **Summary:** The session makes students discover that **intelligence isn't a ladder of "more thinking," but a shift in where failure happens: from genes to behaviors to hypotheses to tools.**
