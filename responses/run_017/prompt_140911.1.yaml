     - They must write down a fixed path (sequence of moves) from start to goal before any feedback. They cannot change the path during the round.
     - After the round, they see the outcome (how many hazards they hit and if they reached the goal). Then they "die" and the next generation (a new team) is given a mutated copy of the previous path (with one random change). They cannot use any feedback until the next generation.

  2. **Skinnerian Cohort:**
