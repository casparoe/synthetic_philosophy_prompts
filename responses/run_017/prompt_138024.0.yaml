answer: |-
  ## Keynote: The Surge Capacity of Democracy

  [Stand with calm authority, make eye contact across the room – career officers, families, the councillor, your daughter]

  Good evening. My day job involves building systems. And a core principle in my work is this: what a system can *sustain* every day is fundamentally different from what it can *mobilise* in a crisis. Standing capacity versus surge capacity.

  That distinction, I believe, is what’s missing from the debate about conscription and our militia system. We get lost comparing headline troop numbers – standing armies versus our reserve lists. But that comparison misses the point. The critical question isn't "How many soldiers are on payroll today?" It's "How many *effective defenders* can this democracy field, fully equipped and ready, *within days or weeks* of a threat emerging?" That’s surge capacity.

  **[Lean in slightly]**

  And here’s the uncomfortable truth about surge capacity: you cannot buy it quickly when the crisis hits. You cannot suddenly manufacture the experienced sergeants, the trained signals operators, the cohesive units who know their terrain and each other. That takes years. It must be built, maintained, and periodically tested *before* the emergency. That’s what the militia system *is*: our nation’s pre-built surge capacity.

  **[Shift tone to serious reflection]**

  But building this surge capacity comes at a cost. A profound one. We compel eighteen-year-olds to serve – either in uniform or, importantly, through civilian alternatives. And part of the justification *is* a form of collective distrust. Not distrust of them as individuals, but distrust of the *democracy we ourselves will become* in a future moment of panic or fatigue.

  We know history. We know democracies under sudden threat face brutal choices: fight at immense cost, submit, or try to buy off an aggressor. We force young people into service today, partly because we don't trust that *future* electorate – which includes all of us, older and perhaps more afraid – will have the viable option to resist if the foundational capacity isn’t already in place, woven into the fabric of society. We pre-commit ourselves to defence. We make surrender or appeasement impossibly expensive, not just in treasure, but in the broken pact with our own past preparation.

  This coercion is a heavy burden. We shouldn’t hide it behind appeals to tradition alone, or pretend it’s purely an exercise in civic virtue. It’s a hard bargain: we limit the choices of our young adults *now* to preserve the viable choices for our nation *later*. That cost is real. It falls disproportionately on the young. We owe them honesty about that.

  **[Acknowledge complexity]**

  Now, does this argument *demand* conscription? Does it mean a militia is the *only* way? Honestly? No. The core principle is that a democracy must be unable to cheaply opt out of defending itself. It must have a credible, rapidly mobilizable deterrent that makes aggression prohibitively costly. Different nations find different mechanisms.

  **[Directly address the anticipated counterpoints]**

  Some will point to Sweden and Finland – neighbours who took different paths. Sweden moved to professionals; Finland retained conscription. Yet both, crucially, have now significantly reinforced their *surge capacity*. Sweden reintroduced elements of conscription and massively invested in civil defence and rapid mobilisation infrastructure. Finland maintained and modernised its comprehensive reserve model. The lesson isn’t that one model is universally right, but that *both* recognised the non-negotiable need for credible, rapid surge capacity – the ability to quickly field a large, capable force drawn from the populace. The precommitment remains essential, regardless of the exact institutional form.

  **[Turn to the peace councillor, your daughter, objectors - with respect]**

  This brings me to a vital point. Conscientious objectors, like my daughter who chose civilian service, are not adversaries of this principle. Their choice is a recognition of the same gravity that underpins the militia. They contribute to our societal resilience, our surge capacity for civil defence, medical response, and infrastructure maintenance – essential elements of national defence. Their service is a different, but equally valid, thread in the fabric of our precommitment. To our guest from the peace group: your presence honours us. Vigilant peace requires preparedness. True democracy requires space for dissent, even as it makes hard choices about its own defence. Our system, at its best, accommodates both.

  **[Conclude with sober gravity]**

  So, as our canton debates this initiative, let’s not get distracted by simple comparisons of standing numbers or short-term budgets. Let’s ask the harder questions: What is our *actual* surge capacity? What credible force can we field next week, next month? How do we ensure that future generations retain the *viable option* to defend their democracy?

  The militia isn’t primarily a cost-saving measure. It’s democracy’s precommitment device. It binds us, collectively, across time. It ensures that if the day comes when aggression threatens our peace, the choice to submit or pay tribute isn’t the cheap, easy path. The capacity to resist – costly, difficult, but viable – is already there, woven into our people, trained and ready to surge forward.

  That’s the burden we place on the young. That’s the pact we make with our future selves. It’s not simple. It’s not cheap in human terms. But in a world where threats can emerge with terrifying speed, it ensures our democracy never finds itself without options. Thank you.
