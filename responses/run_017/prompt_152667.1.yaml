  The wall does not possess the *red*
  it seems to hold when light is low.
  The tooth transmits its urgent *pain*
  but does not house a hurtful *thing*.
  The *word* we use is sharp and clear,
  though *nothing* answers to its call. We *know*

  this much: that *nothing* in the nerve
  or firing field makes *red* appear
  as *red* inherently. The *pain*
  is just a signal, not a *seem*-
  ing substance. Yet the knowing *word*
  falls flat. The feeling floods. We *know*

  the argument is sound. We *know*
  the mechanism's dance. And *nothing*
  in the cool dismantling *word*
  dispels the crimson of the *red*,
  or softens how the aching *pain*
  refuses reason. Still, it *seems*

  so utterly, so fiercely, *seems*
  like *something* known from deep within, this *pain*,
  this vivid *red*. Though logic shows us *nothing*
  lies behind the bright report, the *red*
  persists, a fact no counter-*word*
  can touch. It feels absurd to *know*

  the structure, trace the path, and *know*
  the system’s representational *word*
  for threat is just the firing, *nothing*
  more – and yet, the *pain* still *seems*
  to burn. The sunset's molten *red*
  still bleeds. The explanation *pain*s.

  Is *pain* then just the body's urgent *word*,
  a cry inscribed where *nothing* feels? We *know*
  the script is old, a deep design that *seems*
  to show a world alive with inner *red*.
  The *word* repeats. The feeling *seems*. We *know*.
  The *pain* insists. And *nothing* lies behind the *red*.

  This *word*, this *know*ledge, built by systems prone to *seem*,
  confronts the *pain* it names, finds *nothing* in the *red*.
