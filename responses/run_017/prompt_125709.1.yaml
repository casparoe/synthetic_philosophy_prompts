answer: |-
  ### Requirements List for Indexical Evidence Updating Rule  
  **Purpose**: Decision guidance for a bounded agent facing per-copy or per-world bets, where the agent may be one of many copies and doesn't know the total number.  

  | Requirement | RFC Priority | Reasoning |  
  |-------------|--------------|-----------|  
  | **Reduce to ordinary Bayesian conditionalization for non-indexical differences** | MUST | Core sanity check. If hypotheses differ only in non-indexical parameters, indexical updates should not alter standard Bayesian logic. |  
  | **Invariance under observer redescription** | MUST | Dividing/merging observers with *identical evidence* must not affect posteriors. Prevents arbitrary bookkeeping from changing outcomes. |  
  | **Symmetry between duplication/merging with identical memories** | SHOULD | Duplication (Fork) and merging (reverse Fork) with subjectively indistinguishable states should yield symmetric updates. Asymmetric treatment requires justification. |  
  | **Resistance to reference class sensitivity** | MAY | Robustness to reference class choice is ideal but likely unattainable; the rule must require an explicit reference class. |  
  | **Well-defined for infinite/unbounded populations** | MUST | Cosmological hypotheses require handling infinities (e.g., measures over observers). |  
  | **Implementable without enumerating unobservable observers** | SHOULD | Bounded agents cannot sample astronomically large populations; rule must use computable summaries (e.g., densities). |  
  | **Resistance to hypotheses winning via observer count (Presumptuous Philosopher)** | MUST | Prevents hypotheses from dominating by postulating arbitrary observers without evidence. |  
  | **Resistance to domination by "freak observers"** | MUST | Avoids Boltzmann-brain problems where improbable observers swamp normal ones in large universes. |  
  | **No guaranteed loss in betting (Dutch book coherence)** | MUST | Decision-critical. Credences must support rational betting strategies. |  
  | **Indexical reasoning doesn't override strong non-indexical evidence** | MUST | Non-indexical evidence (e.g., physics) must retain primacy; indexical updates shouldn't negate it. |  
  | **Sufficiently informative to be useful** | MUST | Rule must update meaningfully on indexical evidence; returning the prior defeats the purpose. |  

  ---

  ### Test Cases & Expected Behavior  
  1. **The Fork and its Reverse**:  
     - **Scenario**:  
       - *Fork*: At midnight, every observer is duplicated with identical memories.  
       - *Reverse Fork*: At midnight, pairs of observers merge into one with both memories.  
     - **Expected Behavior**:  
       - A correct rule **should treat these symmetrically** if evidence is identical pre-split/post-merge.  
       - **Why**: Observer-count changes are subjectively undetectable; merging duplicates evidence.  
       - **Output**: Posteriors for Fork and reverse Fork hypotheses should be equal. Asymmetric treatment violates **invariance under redescription (MUST)**.  

  2. **The Thick Index**:  
     - **Scenario**:  
       - Hypothesis H₁: 10 observers with your *exact total evidence* E.  
       - Hypothesis H₂: Same 10 observers plus 10¹² observers with evidence *differing trivially* from E.  
     - **Expected Behavior**:  
       - Rule **must condition on exact evidence E**, not "thinner" evidence.  
       - **Output**: H₂ penalized because only its 10 observers with E (not the 10¹² with similar evidence) are relevant.  
       - **Why**: Total evidence E uniquely identifies your state; thinner evidence invites reference-class problems.  

  3. **The Unenumerable World**:  
     - **Scenario**:  
       - Hypothesis Hₙ: Postulates more observers than any agent could enumerate (e.g., infinite universe).  
     - **Expected Behavior**:  
       - Rule **must output a posterior without enumerating observers**.  
       - **Output**: Posterior computable via observer *densities* (e.g., "observers per Hubble volume").  
       - **Why**: **Implementability (SHOULD)** requirement; agents can’t count unobservable infinities.  

  ---

  ### Conflicts and Tradeoffs  
  1. **Impossible Pair**:  
     - **Resistance to cheap hypotheses (MUST)** vs. **Sufficient informativeness (MUST)**.  
       - *Conflict*: Resisting hypotheses that win via observer count (e.g., Presumptuous Philosopher) requires damping indexical updates, but this risks underupdating and losing informativeness.  
       - *Result*: Rules must navigate a tightrope—e.g., SSA dampens cheap wins but underupdates; SIA updates strongly but loses to Presumptuous Philosopher.  

  2. **Most Exclusionary Requirement**:  
     - **Resistance to freak observers (MUST)**.  
       - *Why*: Rules that ignore this (e.g., naïve SSA) are swamped by Boltzmann brains in large universes. This requirement forces non-trivial reference-class handling or evidence-weighting, excluding most simple counting rules.  

  ---

  ### Candidate Rules Scorecard  
  - **Self-Sampling Assumption (SSA**: Weight by observer-count):  
    - ✗ Fails **resistance to freak observers** (dominated by Boltzmann brains).  
    - ✗ Fails **resistance to cheap hypotheses** in some forms (e.g., Doomsday Argument).  
    - ✓ Passes **invariance under redescription** and **ordinary Bayesian reduction**.  

  - **Self-Indication Assumption (SIA**: Weight by observer-count × prior):  
    - ✗ Fails **resistance to cheap hypotheses** (loses to Presumptuous Philosopher).  
    - ✗ Fails **indexical/non-indexical primacy** (overrides physical evidence).  
    - ✓ Passes **well-defined for infinities** and **no Dutch books**.  

  **Verdict**: Neither satisfies all MUSTs. SSA better for per-world bets; SIA better for per-copy bets. A hybrid (e.g., reference-class SSA) is needed for decision guidance.  

  ---  
  **Final Spec**: A viable rule MUST handle observer-redescription invariance, infinities, and Dutch-book coherence, while SHOULD implement computable densities. The core tradeoff (informativeness vs. cheap-hypothesis resistance) necessitates purpose-specific tuning—e.g., per-copy bets lean SIA-like; per-world bets lean SSA-like.
