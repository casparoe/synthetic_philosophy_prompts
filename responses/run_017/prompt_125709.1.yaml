prompt: |-
  I work as a software engineer, with no philosophy training past the odd blog post, and I came to this topic sideways, through what turned out not to be a bug. My team maintains a large agent-based simulation, and two colleagues were computing the same quantity two different ways — one averaging over simulation runs, one averaging over agent-steps — and getting numbers that differed by orders of magnitude, with no error in either script. The disagreement turned out to be philosophical: whether a sample should be weighted by worlds or by the observers inside them. When I went looking for someone who had argued about this properly, I found the same dispute in cosmology and in reasoning about where one sits among all the observers there are, under the names self-sampling assumption and self-indication assumption. The presumptuous philosopher case, where a hypothesis wins purely by postulating a colossal number of observers, feels to me like the exact failure mode I would file as a bug in my own code.

  So before I read any further, I want the specification rather than the survey. Please write me a requirements list — in the style of an interface spec with test cases — for any rule that updates on indexical evidence. Concretely, imagine a function whose input is a prior over hypotheses, where each hypothesis specifies how many observers or observer-moments of which kinds exist and which of them have evidence like mine, and whose output is a posterior over hypotheses that I can hand to a decision procedure. The purpose I care about is decision guidance: I want credences that a bounded agent can act on, an agent that may be one of many copies, does not know how many copies there are, and has to choose whether to accept a bet whose payoff is per-copy or per-world. If the right list would differ for a different purpose — say, scientific inference about how many observers the universe contains, or evaluating a hypothesis about whether we are in a simulation — say which requirements are purpose-relative.

  Here are the candidate requirements I have collected from arguing with friends, which I want you to sort into genuine desiderata versus the prejudices of one camp, marking each as MUST, SHOULD, or MAY in the RFC sense, with the case or consideration behind it: reduce to ordinary Bayesian conditionalization when the hypotheses differ only in non-indexical respects; invariance under redescription of the population, so that dividing or merging observers does not change the answer by stipulation; symmetry between a process that duplicates a subject and one that merges two subjects with the same resulting memories; robustness to the choice of reference class, or an argument for why no robustness is owed; well-definedness when the population is infinite, unbounded, or of unknown size; implementability by an agent that cannot enumerate observers it could never interact with; resistance to hypotheses that win by postulating astronomically many observers; resistance to domination by the vast number of thermally improbable freak observers a big universe would contain; no betting behavior that guarantees a loss; not letting indexical reasoning overturn strong non-indexical evidence; and still being informative enough to be worth computing at all.

  I would also like three cases I have not seen handled anywhere, worked into the list as tests: the Fork, where every subject is silently duplicated at midnight and the copies are subjectively indistinguishable, run alongside its exact time-reverse, where pairs of subjects are merged and the survivor has both sets of memories — a rule that treats these asymmetrically owes me a reason; the Thick Index, where one hypothesis contains ten observers with my exact total evidence and another contains those same ten plus ten to the twelve observers whose evidence differs from mine in some trivial detail, which should force you to say whether the rule conditions on my total evidence or on something thinner, and what happens if conditioning on total evidence makes the whole exercise empty; and the Unenumerable World, where the rival hypothesis postulates so many observers that no agent inside the world could ever count or sample them, so a rule that needs the full population to compute an answer is not a rule I can ship. For each, tell me what answer a correct rule should give, or explain why the case is ill-posed.

  Finally, flag any pair of requirements you suspect cannot be jointly satisfied — my own guess is that being informative and being immune to cheap hypotheses pull in opposite directions, and that this is where the interesting result is, but I want your judgment on where the impossibility actually lies. Tell me too which single requirement excludes the most candidate rules. Keep the closing scorecard, for the two weightings I named at the start, to one short paragraph; the criteria are what I am paying for.
reasoning: |-
  We are designing a function for updating credences based on indexical evidence. The function takes as input:
  - A prior distribution over hypotheses. Each hypothesis H specifies:
      - A set of observers (or observer-moments) that exist in H.
      - For each observer, the evidence (or total state) that observer has.
      - Which observers have evidence exactly matching the agent's current total evidence (denoted E).

  The output is a posterior distribution over hypotheses, which can be used for decision-making.

  The agent's purpose: decision guidance in scenarios where:
  - The agent may be one of many copies.
  - The agent does not know how many copies there are.
  - The agent must choose whether to accept bets that pay off per-copy or per-world.

  Other purposes (scientific inference, simulation hypotheses) may have different requirements, but we focus on decision guidance.

  We list candidate requirements and sort them into MUST, SHOULD, MAY, along with reasoning. Then we address the three test cases and flag conflicts.

  ## Requirements List (RFC Style)

  1. **Reduce to ordinary Bayesian conditionalization when hypotheses differ only in non-indexical respects.**
     - **MUST**: When there are no indexical uncertainties (e.g., the agent knows exactly which observer they are), the update should reduce to standard conditionalization on the non-indexical part of the evidence. This is a basic sanity check.

  2. **Invariance under redescription of the population (e.g., dividing or merging observers without changing the evidence distribution).**
     - **MUST**: The rule should depend only on the distribution of evidence, not on how we choose to "chunk" observers. For example, splitting one observer-moment into two with identical evidence should not change the posterior. This is to prevent arbitrary bookkeeping from affecting the result.

  3. **Symmetry between duplication and merging with the same resulting memories.**
     - **SHOULD**: This is a special case of the above. The Fork and its reverse should be treated symmetrically. However, note that in the Fork, duplication creates two observers with the same evidence, while merging takes two observers and leaves one with the combined memories. If the evidence sets are the same, then by requirement 2, it should be invariant. But note: merging two observers with different memories into one with both sets is not the same as having two observers with the same evidence. This requirement might be too strong if we consider the continuity of identity. However, for the purpose of decision making (where we care about the evidence and the bets), we require symmetry in the case where the evidence of the merged observer is the same as the two separate ones (i.e., the merged observer has the same evidence as each of the two before merging? That might not be the case). Clarification: In the Fork case, after duplication, each copy has the same evidence as the original. In the reverse, when two are merged, the survivor has the evidence of both (so it's different). Therefore, we must be cautious. We adjust: in the case where the evidence of the merged observer is the union of the two, it's not the same as two separate. Hence, the requirement should be that if we have two separate observers with evidence E1 and E2, and we merge them into one observer with evidence E1 and E2 (so now that observer has more evidence), then that is a different situation. But in the problem stated, the reverse of the Fork is that pairs are merged and the survivor has both sets of memories. So the evidence of the merged observer is different (richer) than that of the individual ones. Therefore, the two cases are not symmetric in terms of evidence. However, if we consider that in the Fork, after duplication, the two copies have the same evidence as the original, and in the reverse, the merged observer has the same evidence as one of the two? That doesn't hold. So the requirement should be: if we have a process that duplicates an observer without changing the evidence (so two copies with same evidence) and a process that merges two observers with the same evidence into one observer with that same evidence (which is impossible because merging two distinct experiences would typically result in more evidence) then we have a problem. Therefore, the test case is designed to challenge the notion of observer identity. We conclude: the rule should be invariant under splitting and merging that does not change the evidence distribution. In the Fork, duplication does not change the evidence of the observers (each copy has the same evidence as the original). In the reverse, if we have two observers with identical evidence and we merge them, the resulting observer must have the same evidence? That's not possible if the evidence includes the memory of being one or two. Hence, the case might require that the evidence is defined in a way that does not include the multiplicity. Given the complexity, we mark this as **SHOULD** for symmetry in the case of identical evidence, but note that the test case might be ill-posed if evidence includes the history.

  4. **Robustness to the choice of reference class.**
     - **MAY**: The reference class (the set of observers we consider as "like me") is a known problem in anthropic reasoning. A rule that is highly sensitive to the reference class is less useful. However, it is very hard to achieve robustness. We might require that the rule should not change dramatically under small changes in the reference class, but this is difficult to formalize. Alternatively, we can require that the rule should be well-defined given a fixed reference class. For decision guidance, the agent must fix a reference class. We mark as **MAY** because it is a known issue without a clear solution.

  5. **Well-definedness when the population is infinite, unbounded, or of unknown size.**
     - **MUST**: The rule must not break down in the face of infinity. Many cosmological hypotheses involve infinite populations. We must have a rule that can handle finite, infinite, and unknown sizes. However, note that for decision-making, we might only need to compare hypotheses that are well-behaved.

  6. **Implementability by an agent that cannot enumerate observers it could never interact with.**
     - **SHOULD**: For practical decision guidance, the agent must be able to compute the posterior without enumerating every observer in the universe. This might require approximations or rules that depend only on local information.

  7. **Resistance to hypotheses that win by postulating astronomically many observers (Presumptuous Philosopher).**
     - **MUST**: A rule that allows a hypothesis to dominate the posterior simply by positing a huge number of observers, without any other evidence, is flawed for decision-making. We must avoid this.

  8. **Resistance to domination by the vast number of thermally improbable freak observers a big universe would contain.**
     - **MUST**: In a large universe, there could be observers with random thermal fluctuations that match our evidence by chance. These "freak observers" could vastly outnumber normal ones. A rule that gives too much weight to these is problematic. This is similar to the Boltzmann brain problem.

  9. **No betting behavior that guarantees a loss (Dutch book).**
     - **MUST**: For decision guidance, the credences must be coherent. If the rule leads to a set of bets that guarantees a loss, then it is not rational.

  10. **Not letting indexical reasoning overturn strong non-indexical evidence.**
      - **MUST**: Non-indexical evidence (e.g., from physics) should not be overridden by indexical considerations. For example, if we have strong evidence for a small universe, a hypothesis that postulates a huge universe with many observers should not win just because it has more observers.

  11. **Still being informative enough to be worth computing at all.**
      - **MUST**: The rule must not be so conservative that it never updates on indexical evidence. If it always returns the prior, then it is useless.

  ## Test Cases

  ### The Fork and its Reverse
  - **Scenario**: 
    - *The Fork*: Every night at midnight, every observer is duplicated. The two copies are subjectively indistinguishable from the original and from each other (same memories, etc.). 
    - *Reverse Fork*: Every night at midnight, pairs of observers are merged into one, and the survivor has the memories of both.
  - **Requirement**: The rule should treat these symmetrically? 
  - **Analysis**: 
    - In the Fork, after duplication, the number of observers doubles. Each has the same evidence (including the memory of not having been duplicated? Or is the duplication undetectable? We assume undetectable, so evidence is the same as before). 
    - In the Reverse Fork, before merging, there are two observers with the same evidence? Not necessarily. The merging process takes two arbitrary observers and merges them. The survivor then has the combined memories, which would be different from either. Therefore, the evidence of the merged observer is different (it includes the memories of two lives). 
    - So the two scenarios are not symmetric in terms of the evidence of the observers. In the Fork, after duplication, the evidence of each copy is the same as before. In the Reverse Fork, the evidence of the merged observer is different (richer). 
    - Therefore, the rule should not treat them symmetrically. The Reverse Fork changes the evidence, while the Fork does not. 
    - **What should the rule do?** 
      - In the Fork: if we are at 12:01, we are in a world with twice as many observers. Our evidence E (which includes the memory of yesterday) is now held by two observers. So we should update our credence for being in a world that has duplication events. 
      - In the Reverse Fork: at 12:01, there are half as many observers. The evidence E now is the merged evidence, which is different. 
    - **Conclusion**: The case is well-posed but the two processes are not symmetric because they produce different evidence distributions. The rule should update accordingly.

  ### The Thick Index
  - **Scenario**:
    - Hypothesis H1: contains 10 observers with your exact total evidence E.
    - Hypothesis H2: contains the same 10 observers (with E) plus 10^12 observers whose evidence is almost like E but differs in some trivial detail (e.g., a single bit of sensory input that you happen to not have).
  - **Issue**: Should the rule condition on the exact total evidence E, or on a coarser set of features? 
  - **Analysis**:
    - Conditioning on exact total evidence E would mean that only the 10 observers in H1 and the 10 in H2 (the ones with E) are relevant. The other 10^12 in H2 have evidence different from E, so they don't count. Then the posterior ratio would be proportional to the prior ratio (since both have 10 observers with E). 
    - Conditioning on a coarser set would include more observers. 
    - For decision guidance, conditioning on exact evidence is problematic because it leads to overfitting (you are unlikely to find any observer with exactly your evidence). But if we condition on a coarser set, then we must define what counts as "like me". 
    - **What should the rule do?** 
      - The rule must condition on the exact total evidence. This is because the agent has the exact evidence E. However, in practice, we might need to use a reference class to avoid having zero probability. 
      - In this test, H1 has 10 observers with E, H2 has 10 observers with E and 10^12 with E' (which is not E). So if we condition on E, then the posterior ratio P(H1|E)/P(H2|E) = [P(E|H1) * P(H1)] / [P(E|H2) * P(H2)] = [ (10 / N1) * P(H1) ] / [ (10 / N2) * P(H2) ] where N1 is the total number of observers in H1 (10) and N2 is the total in H2 (10 + 10^12). 
      - So P(E|H1) = 10 / 10 = 1, P(E|H2) = 10 / (10 + 10^12) ≈ 10^-11. 
      - Thus, the ratio becomes [1 * P(H1)] / [10^-11 * P(H2)] = 10^11 * P(H1)/P(H2). 
      - This strongly favors H1, unless the prior for H2 is astronomically higher. 
    - **Conclusion**: The rule must condition on the exact evidence. The fact that H2 has many observers with similar evidence doesn't help because they don't match E. This test shows that the rule must be sensitive to the exact evidence.

  ### The Unenumerable World
  - **Scenario**: 
    - One hypothesis (H_big) postulates so many observers that no agent inside the world could ever count or sample them (e.g., an infinite universe). 
  - **Issue**: The rule must be computable by an agent with bounded resources. 
  - **Analysis**:
    - The rule must not require enumerating every observer. It should be defined in terms of densities or expectations. 
    - For example, in an infinite universe, we might use the measure over observers. 
    - **What should the rule do?** 
      - The rule should be well-defined for infinite populations, but the agent might approximate by considering the density of observers with evidence E in a given region. 
      - However, the agent must have a way to specify the hypothesis in a compact form. 
    - **Conclusion**: The rule must be defined for hypotheses with infinite observers, and the agent must be able to compute it without enumeration. This might require that the hypothesis provides a computable density function.

  ## Conflicts Between Requirements

  - **Impossible Pair**: 
    - We suspect that **Resistance to cheap hypotheses (7)** and **Being informative (11)** conflict. 
      - To resist cheap hypotheses, we might have to be conservative and not update much on indexical evidence. But then we lose informativeness. 
      - Example: If we use the Self-Indication Assumption (SIA), which favors worlds with more observers, then we are vulnerable to the Presumptuous Philosopher. If we use the Self-Sampling Assumption (SSA), which samples from all observers, then we are vulnerable to freak observers and might not update enough. 
    - Also, **Conditioning on exact evidence (from the Thick Index)** and **Resistance to freak observers (8)** might conflict: 
      - Conditioning on exact evidence might make us vulnerable to freak observers because there might be only a few normal observers with our exact evidence, but many freak ones. 
      - However, if we condition on a reference class, we avoid freak observers by grouping them out, but then we break exact conditioning.

  - **Single Requirement that Excludes Most Rules**: 
    - **Resistance to freak observers (8)** is extremely challenging and excludes many rules. For example, SSA without a reference class is vulnerable to Boltzmann brains.

  ## Closing Scorecard for Weighting by Worlds vs. Observers

  The two approaches you mentioned:
  - **Self-Sampling Assumption (SSA)**: Sample uniformly from the set of all observers (or observer-moments) in the world. This weights by observers.
  - **Self-Indication Assumption (SIA)**: Give a higher prior to worlds with more observers. This effectively weights by observers when updating.

  **Against the requirements**:
  - SSA: 
    - Fails **8** (freak observers) in large universes, because the vast number of freak observers dominate.
    - Fails **7** (presumptuous philosopher) in some cases? Actually, SSA does not favor a larger universe per se: it conditions on being an observer, so in a large universe with many observers, you are less likely to be a particular one. But for hypotheses that have more observers with your evidence, it can favor them. It is not as vulnerable as SIA to the presumptuous philosopher.
    - However, SSA is vulnerable to the reference class problem (**4**).
  - SIA:
    - Fails **7** (presumptuous philosopher) because it gives a high prior to worlds with more observers.
    - Also fails **8**? It actually might help with freak observers: if normal observers are more numerous in a big universe, then SIA might favor that, but it also gives weight to the freak observers. It's complex.

  Neither satisfies all requirements. The requirements are stringent and no known rule satisfies all. For decision guidance, we may need a rule that is a compromise.

  Given the purpose of decision guidance, we must avoid Dutch books and guarantee coherence. We also must be able to compute the rule. Therefore, we might lean towards a rule that is based on SSA with a well-chosen reference class, but with adjustments for freak observers (like using a reference class that excludes them). However, that is ad hoc.

  Alternatively, the approach of "full non-indexical conditioning" (ignoring indexical information) fails **11**.

  A promising approach is the "indexical uncertainty" view: treat the agent as uncertain about which observer they are, and use standard conditionalization over the combined space of hypotheses and observers. This leads to SSA. But then we face the freak observer problem.

  In summary, the requirements highlight the difficulties in anthropic reasoning. The most critical conflict is between resisting freak observers and being informative.

  ## Final Requirements List (Condensed)

  - MUST: Reduce to standard conditionalization in non-indexical cases.
  - MUST: Invariance under redescription of the population (without changing evidence).
  - SHOULD: Symmetry between duplication and merging when the evidence remains the same (but note: merging typically changes evidence).
  - MAY: Robustness to reference class choice.
  - MUST: Handle infinite populations.
  - SHOULD: Computable without full enumeration.
  - MUST: Resist presumptuous philosopher (7).
  - MUST: Resist domination by freak observers (8).
  - MUST: Avoid Dutch books.
  - MUST: Not override strong non-indexical evidence.
  - MUST: Be informative (update on indexical evidence).

