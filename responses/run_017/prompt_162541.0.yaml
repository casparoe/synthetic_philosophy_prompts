answer: |-
  ## Brexit as a Case Study in Collective Intentionality: An Analysis

  This analysis examines the 2016 UK EU referendum through the lens of collective intentionality theory, holding the stipulated facts constant. We will map the theory onto the case and then examine what the case reveals about the theory.

  ### I. Mapping Theory onto the Case: Was there a Collective Intention to Leave?

  Applying the standard conditions for shared intention (as per Bratman, Gilbert, Searle):

  1.  **Shared Intention Conditions:**
      *   *"Each participant intends that we act together"*: This is problematic. While each Leave voter intended *their vote* to contribute to a Leave *result*, and likely intended that the UK *should* leave, the condition "intends that *we* act together" is unclear. Did voters intend that *they collectively* would bring about departure? Or did they merely intend that *the government* should act? The referendum was advisory; the formal "acting together" of departure was delegated to the state apparatus. The condition seems weakly met at best, focusing on achieving the outcome, not necessarily collective action *per se*.
      *   *"Intends it by way of meshing sub-plans"*: This condition fails demonstrably. The Leave side explicitly advanced incompatible sub-plans: "Norway-style" EEA membership, a bespoke Canada-style FTA, or "clean-break" WTO terms. Voters supporting Leave did so *despite* these divergent visions, not because they had meshing sub-plans. There was no shared conception *of what leaving meant*. An individual Leave voter's sub-plan (e.g., frictionless trade) fundamentally conflicted with another's (e.g., strict immigration control via WTO rules).
      *   *"Stays mutually responsive when those plans break down"*: Mutual responsiveness requires a baseline shared understanding to respond *to*. The absence of meshing sub-plans meant there was no shared framework *to* be mutually responsive *within* when the inevitable implementation problems arose. The subsequent parliamentary deadlock demonstrates a catastrophic *lack* of mutual responsiveness among Leave MPs and the public factions they represented.

  2.  **Plural Subject & Member Obligations:** Gilbert's theory posits that a joint commitment creates obligations among participants. Did the referendum create a plural subject "The UK People" with a joint commitment to leave, binding even dissenters?
      *   The referendum result *was claimed* to create such a joint commitment ("will of the people"), imposing an obligation on *all* MPs (including Remainers) to deliver it.
      *   However, the **content indeterminacy** is fatal to this claim. A joint commitment requires a shared object. What was jointly committed *to*? Leaving *per se*, devoid of content? The competing Leave visions were mutually exclusive. It's implausible to argue that voters jointly committed to *any specific outcome*, only to the *abstract proposition* of leaving. Gilbertian obligations typically require a clearer shared object.

  3.  **The Vote's Function: Creation, Diagnosis, or Deferral?**
      *   **Creation:** Did the vote *create* a new collective intention to leave? The deep pre-existing divisions (Remain vs. Leave camps) suggest it primarily *activated* or *crystallised* existing individual intentions rather than forging a genuinely new *collective* "we-intention" from scratch. The lack of meshing sub-plans further undermines the creation thesis.
      *   **Diagnosis:** Did it merely *diagnose* an existing collective intention? The narrow 52-48 split, deep societal divisions, and crucially, the *absence of a shared conception of "Leaving"* strongly suggest no pre-existing, coherent collective intention to leave *in the robust sense required by the theory* existed. The vote revealed a *majority preference*, not a unified collective intention.
      *   **Deferral:** This fits best. The vote arguably produced a collective *intention to defer* or *mandate*: "The government should negotiate an exit, and whatever deal it secures should be adopted as fulfilling the mandate." The binary question ("Leave" vs. "Remain"), devoid of specifics, inherently delegates the *content* of leaving. The repeated insistence that "Leave means Leave," regardless of the *form*, supports this. The "mandate" claimed afterwards was primarily this intention to defer the specifics to the government's negotiation.

  4.  **The "Content-Gappy" Intention Problem:**
      Can there be a shared intention that is radically underdetermined – "intend to exit" with *no* shared intention regarding *how*? This is highly problematic:
      *   Intentions inherently involve plans or representations of the future state. An "intention to exit" with *zero* conception of what exit entails lacks a clear intentional object. It borders on an intention *to not be in the EU*, which defines itself purely by negation and lacks positive content.
      *   **Theory's Resources:** Standard collective intentionality theory struggles here. It generally assumes a *minimal* shared understanding of the joint action. The theory likely lacks the resources to distinguish a genuinely "underdetermined but shared" intention (where the *core* is shared, details to be filled) from simply *no shared intention at all* regarding the crucial aspects of the action. The Brexit case, with its fundamentally incompatible core visions masquerading as one, leans heavily towards the latter.
      *   **Can the Election Supply Content Retroactively?** The 2019 election (fought explicitly on "Get Brexit Done" with Johnson's specific deal) cannot *retroactively* supply the missing content to the *2016* collective intention. It created a *new* mandate for a *specific form* of leaving (the Withdrawal Agreement). It *replaced* the vague 2016 mandate with a specific one, it did not complete or clarify the original intention. The original "intention" remained gappy; a new, more specific collective intention (arguably still underdetermined regarding the future relationship) was formed later.

  **Conclusion on Theory-to-Case Mapping:** What existed in June 2016 was **not a single, unified collective intention to leave the EU** meeting the standard conditions (especially meshing sub-plans and mutual responsiveness). Instead, it was a **majority of individual intentions** favouring departure, but with **wildly divergent objects** (the incompatible Leave models). The referendum result primarily functioned as an **intention to defer**, creating a **mandate for the government to negotiate an exit** and for Parliament to subsequently approve *some* form of departure, not a specific one. The "will of the people" claim regarding a *specific* intention was a significant overreach masking the underlying indeterminacy. The theory struggles to recognise the 2016 result as a genuine collective intention due to its radical content gap.

  ### II. Mapping the Case onto Theory: What the Episode Reveals

  The Brexit referendum highlights significant tensions and potential limitations within collective intentionality theory when applied to large-scale, contested democratic decisions:

  1.  **Vindication of Aggregative Rival?** The case strongly supports the **aggregative model** as a more accurate description of *this type* of event. The referendum mechanically aggregated individual votes ("Leave" vs. "Remain") into a binary outcome. The lack of shared intention regarding *what leaving meant*, the subsequent paralysis, and the reliance on elite negotiation and a later election to define the outcome all point towards a process converting plural votes into a result *without* forming a robust collective "we-intention" in the philosophical sense. The "we" claimed afterwards ("the people have spoken") was largely a rhetorical construct imposed *on* the aggregate result.

  2.  **Exposing the Mandate Gap:** The case starkly exposes a **critical institutional gap** in translating democratic decisions into action, particularly when the decision is underdetermined. The theory focuses on the *formation* of shared intention but offers less guidance on how institutions should act when handed a vague mandate ("Leave") by an aggregate vote, especially one lacking internal coherence regarding implementation. The episode shows how such mandates grant significant power to office-holders (the government) and subsequent political processes (parliamentary votes, further elections) to *define the content* of what was supposedly "intended" *after the fact*. The claim of a pre-existing "will" becomes a powerful political tool used to legitimise the subsequently defined outcome.

  3.  **Binding Dissenting Legislators via Plural Subject?** The case **seriously challenges** the idea that the plural subject machinery, based purely on a majority referendum vote, can legitimately *bind dissenting legislators* to actively implement a specific, undefined outcome they fundamentally oppose.
      *   Gilbertian obligations arise from *joint commitment*. It's highly questionable whether losing voters in a binary referendum, or MPs who actively campaigned against the result, ever *jointly committed* to the outcome, especially given its radical indeterminacy.
      *   The theory struggles to explain why an MP representing a constituency that voted Remain, or who holds a deep conscientious objection, should be *obligated* by the *plural subject* to enact "Leave." Democratic norms of respecting electoral outcomes and majority rule provide a stronger (though contested) basis for this pressure than the collective intentionality framework, which seems ill-suited to coercing outsiders into a "joint commitment" they explicitly rejected. The theory doesn't readily license binding dissenters in this context.

  4.  **Theory's Silences:**
      *   **Scale & Indeterminacy:** The theory is largely developed for smaller, more cohesive groups with clearer shared goals. It struggles conceptually with mass-scale events like national referendums characterised by profound disagreement and vague propositions. The radical indeterminacy of the Brexit question pushes the theory beyond its comfortable limits.
      *   **The Role of Institutions & Power:** The theory focuses on the mental states and commitments of individuals forming a "we." It pays less attention to the crucial role of *institutions* (government, parliament), *elites* (campaign leaders, negotiators), and *power dynamics* in interpreting vague mandates, defining the content of "collective intentions" after the fact, and enforcing compliance. The Brexit aftermath was dominated by these factors.
      *   **Preference vs. Intention:** The theory often blurs the line between a *preference* (voting for an outcome) and forming an *intention* (committing to a specific course of action, with some conception of how). The referendum captured *preferences* regarding a binary choice, not necessarily the formation of a shared *intention* for a complex, multi-stage action.

  **Conclusion on Case-to-Theory Mapping:** The Brexit referendum highlights the limitations of applying robust collective intentionality theory to large-scale, adversarial, and underdetermined democratic votes. It provides strong evidence for the explanatory power of the aggregative model in such contexts and exposes a significant gap in how institutions handle vague mandates. The case challenges the theory's ability to explain the binding force claimed over dissenters via a plural subject formed by a majority vote on an indeterminate proposition. Crucially, it reveals the theory's relative silence on the critical roles of institutional power, post-hoc interpretation, and the distinction between aggregated preference and shared intention in mass democracy. The episode suggests the theory is more suited to analysing cohesive group actions than fragmented, large-scale political decisions with contested outcomes.
