  Hey — you're a formal epistemologist (Bayesian epistemology / decision theory), so please think carefully here and brainstorm at least three different framings of the question before you commit to one; don't just hand me the standard line I could get from a textbook.

  I got into a long argument with my friend Sam last night and I'm still annoyed about it, so I want to write it up properly. Sam's in stats-adjacent ML, I'm in philosophy, and we ended up on Jeffrey conditionalization: the case where evidence doesn't give you any proposition with certainty but just moves your credence over some partition to new values, and you keep the conditional credences inside each cell fixed (rigidity) and re-weight the cells. Sam's line was that the whole framework is unnecessary — whenever your credence in E moves, there's *something* you're certain of (that you seem to see E, that your credence is now 0.8, that you're in a certain brain state), so you can just do ordinary conditioning on that and Jeffrey is bookkeeping. I kept saying this "there's always something you're certain of" move washes out the actual phenomenon but I couldn't say why, and then we got onto order-dependence: as far as I remember, plain conditioning commutes (learning E then F is the same as F then E) but Jeffrey updates on different partitions don't in general — correct me if I have that backwards — and Sam said that proves Jeffrey is broken, and I said no, it shows that when evidence comes in a sequence the order can genuinely matter, and then the bar closed and we left it there.

  So here's what I want: turn my half of that into a two-page proposal for a nine-month pre-dissertation fellowship. The committee is generalist philosophers, not formal people, so it has to be readable, and it has to have: (a) the question stated precisely enough that a reader could tell what would count as answering it; (b) why the existing positions don't settle it — both Sam's reduction of uncertain evidence to ordinary conditioning on something certain, and the usual ways people live with or explain away the failure of commutativity; (c) the method, month by month for nine months, including what math I'd actually have to do and what I do if it turns out to be nastier than I expect; (d) the possible outcomes and what would decide between them; (e) an honest paragraph on what would count as the project failing, plus a scoped-down version I can fall back on if my advisor says the main one is too big. My half-formed idea, which you should sharpen or replace if you have something better: the "is order-dependence a bug or a feature?" debate is being had at the wrong grain. Everyone compares two big one-shot updates, A then B versus B then A, but real evidence arrives in small increments over time, so the sharper question is what happens when you chop the same total body of evidence into many tiny Jeffrey updates and interleave them — does the order-dependence vanish in the fine-grained limit, converge to something order-independent, or survive? A physics friend muttered something about Trotter product formulas and non-commuting flows when I described this and I definitely didn't fully follow it, and I'm not sure the analogy even holds, but it stuck with me. Either way the philosophical payoff needs spelling out: if order-sensitivity survives, is that a reductio of the rule or the right answer in cases where later evidence is partly about the reliability of whatever produced the earlier evidence; and if it washes out, does Sam get the last word after all?

  Please don't give me a bibliography or any citations — I'll fill those in myself, and I want the argument to stand without them. At the very end, add a short note on how confident you are that (i) the fine-grained question is genuinely open rather than already settled and (ii) it's tractable in nine months by one person, and single out the one claim in the proposal you'd be least willing to defend in front of a committee.
