answer: |-
  Here's a breakdown addressing your query about the Blackwick jug phenomenon:

  **What already exists:**

  1.  **Division of Linguistic Labor (Hilary Putnam):** This describes how a linguistic community relies on experts to anchor the true meaning of terms (e.g., "gold" defined by atomic number for scientists, while laypeople use color/shine). Experts hold the "essence."
  2.  **Tacit Knowledge (Michael Polanyi):** Knowledge that cannot be fully articulated or codified, learned through practice and experience ("knowing more than we can tell"). Handling the jugs imparts this.
  3.  **Path Dependence:** How historical events and choices constrain future possibilities. The original workshop's methods *caused* the typical shape, but the shape has now become detached from its origin.

  **Why each one misses:**

  1.  **Division of Linguistic Labor:** This *seems* close – experts (handlers) hold a criterion (origin), others use a stereotype (shape). **The crucial miss:** In Putnam's model, the expert's criterion (atomic number) is the *objectively correct* one for defining the category. For Blackwick, the expert criterion (origin) *is itself historical and conventional*. There's no scientific "essence" the handlers access; they simply *privilege historical origin* over formal characteristics. Both definitions (origin vs. shape) are socially constructed; the handlers aren't revealing a deeper truth, just enforcing a different convention. Putnam assumes the expert definition is the valid one; here, the conflict is *between* two valid-but-different definitions.
  2.  **Tacit Knowledge:** This perfectly describes *how* the handlers know (through embodied experience). **The miss:** It doesn't name the *specific conflict* between that tacit, origin-based knowledge and the subsequent codification based on visible traits. Tacit knowledge explains *how* they judge, not the *structural tension* with formal definitions that erases the origin criterion.
  3.  **Path Dependence:** This explains *how* the shape became dominant initially. **The miss:** It doesn't capture the *semantic shift* where the term detaches from its origin point or the *active conflict* when codification ignores that origin and rewrites history. Path dependence sets the stage but doesn't describe the dynamic of competing definitions and institutional erasure.

  **The Name and the Definition:**

  *   **Provenance Primacy vs. Diagnostic Trait Codification:**
      *   **Provenance Primacy:** The core, often unarticulated, principle held by the originating community that defines an artifact (like "Blackwick") primarily or exclusively by its *origin* (specific workshop, maker, lineage, context of creation), validated through tacit knowledge gained via direct experience. This definition inherently includes historical variation and tolerates anomalies within the origin group.
      *   **Diagnostic Trait Codification:** The process by which external bodies define and authenticate artifacts based solely on a set of *observable, measurable characteristics* (like the "Blackwick shape"), precisely because these traits are verifiable by anyone without specialized tacit knowledge or access to provenance history.
      *   **The Conflict:** When Diagnostic Trait Codification is applied, it inevitably excludes artifacts valid under Provenance Primacy (the "right workshop, wrong shape" originals) and includes artifacts invalid under it ("wrong workshop, right shape"). Crucially, the codification process doesn't just fail to capture Provenance Primacy; it actively *reclassifies* the historical evidence supporting it, erasing the validity of origin as the defining criterion from the institutional record.

  **Cases and Non-Cases:**

  *   **Cases (Provenance Primacy Dominant):**
      1.  **Your Blackwick Jug:** As described. Authenticity hinges on origin (valley workshop), known tacitly by handlers. Shape is a common *result*, not the *definition*.
      2.  **Antique Furniture (e.g., Chippendale):** Experts may authenticate a piece based on construction techniques, tool marks, or provenance linking it to Thomas Chippendale's workshop, even if its style differs slightly from the "typical" pattern book example. A modern perfect replica, lacking that origin, is a fake.
      3.  **Appellation d'Origine Contrôlée (AOC) Wines (e.g., Champagne):** Defined *by origin* (specific region in France). Wine made *anywhere* else, regardless of identical grapes/method/taste profile, legally cannot be "Champagne." The geographic provenance *is* the definition.
  *   **Non-Cases (Diagnostic Traits or Other Concepts Dominate):**
      1.  **Biological Species Definition (Morphology vs. Genetics):** While experts use genetics, morphology is often a practical diagnostic trait. Crucially, if an original specimen's morphology didn't match its genetic clade, it wouldn't be reclassified as "atypical" of the species *based solely on morphology*; genetic provenance (lineage) usually wins. This leans closer to Putnam's Division of Labor with a discoverable "essence." True Provenance Primacy requires the origin *itself* to be the defining convention, not a proxy for an objective essence.
      2.  **"Impressionist" Painting:** Defined primarily by visible stylistic traits (brushwork, light, subject). A painting by Monet is Impressionist because of how it looks, regardless of *when* or *exactly where* he painted it (though context informs the style). Provenance adds value but doesn't define the category membership itself. The diagnostic traits *are* the definition.
      3.  **"Game" (Wittgenstein's Family Resemblance):** While lacking a single defining trait, membership isn't anchored to *provenance*. A new activity can be a game without lineage. Provenance Primacy requires the origin point/history to be the *necessary* anchor.

  **The Core:** You've identified a specific social-epistemic mechanism where **Provenance Primacy** (origin as definition, sustained by tacit knowledge) is structurally vulnerable to being overwritten by **Diagnostic Trait Codification** (visible characteristics as definition) whenever institutions formalize rules, precisely because provenance is often unverifiable by outsiders. This codification doesn't just ignore provenance; it actively edits the historical record to make provenance *appear* invalid.
