  The user has two key concerns. First, the "absorption problem" – that the pessimistic meta-induction ignores successful concepts that were absorbed (like conservation principles) rather than discarded (like ether). They want a fair base rate of retention. Second, they want realism to make testable predictions about future theory changes, not rehash old examples like electrons.

  Hmm... the user is clearly frustrated with circular debates. They want research that either resolves deadlocks or shifts the conversation toward actionable insights for working scientists. The "downstream use" emphasis suggests they're allergic to purely academic exercises.

