answer: |-
  Here is a sestina crafted for your seminar, grounded in the cheetah/gazelle dynamic and adhering to your specific constraints:

  **Sestina for Explanatory Levels**

  The cheetah strains, a blur against the **ground**,
  Its speed a seeming gift, a perfect **design**
  To catch the gazelle. Is some bright **skyhook**
  Responsible, imposing purpose from above?
  Or did slow, patient work by unseen **cranes**
  Build this fit, accruing no explanatory **debt**?

  The lower story whispers: pay the **debt**.
  Explain the speed not on the savannah’s **ground**,
  But in the code, the molecule’s deep **cranes**.
  Variation offered, selection shaped the **design**.
  No need for forces pulling like a **skyhook**;
  This gradual lift absolves a higher kind of **greed**.

  But watch the greedy move, a subtle **greed**:
  Declare the code explains it all, **debt** paid,
  Then stop. The molecule becomes a **skyhook**,
  Self-sufficient, needing no more **ground**.
  The *why* of speed, the *fit* of that **design**,
  Dissolves beneath the hammer of such **cranes**.

  Yet how do molecules alone build **cranes**
  That forge the predator, erase the **greed**
  Of hunger into function? That grand **design** –
  The cheetah *chasing*, purpose felt – is **debt**
  Ignored. The pattern fades from view, un**ground**,
  As if mere chemistry could be its **skyhook**.

  The tempting shortcut always is a **skyhook**:
  Invoke the gene as cause, the final **cranes**,
  Forgetting why it matters on the **ground**.
  This very sleight-of-hand defines the **greed**.
  The obligation shifts; a new **debt**
  Arises: *What assembles this **design**?*

  The chase itself, the living, breathing **design**,
  Cannot be lifted by a hidden **skyhook**,
  Nor fully paid by molecules alone. The **debt**
  Remains: explain the whole the lesser **cranes**
  Must serve. To shirk this is the deepest **greed**,
  Leaving the cheetah’s purpose lost, un**ground**.

  Can *ground* sustain the pattern, hold the **design**?
  Beware the *skyhook* masked as paid-up **debt**!
  True **cranes** lift patiently, abjuring **greed**.

  ---

  **Annotations & Rationale:**

  1.  **Concrete Example:** The cheetah/gazelle evolutionary arms race runs throughout, illustrating adaptation ("perfect design," "chasing"), the genetic substrate ("code," "molecule"), and the emergent phenomenon of purpose ("hunger into function," "purpose felt").
  2.  **End-Word Roles:**
      *   **Crane:** Begins as unseen builders (st1), becomes the reductive hammer (st3), then the true mechanism requiring explanation itself (st4, st5).
      *   **Skyhook:** Starts as the tempting top-down explanation (st1), becomes falsely equated with genetic reduction (st3), remains the constant temptation/shortcut (st4, st5), and is contrasted with true cranes (env).
      *   **Design:** Begins as the apparent phenomenon to explain (st1), becomes the pattern dissolved by greedy reduction (st3), then re-emerges as the irreducible whole needing explanation (st5).
      *   **Greed:** Introduced as the vice of reductionism (st2), defines the move that stops too soon (st3), and is the core failure to be avoided (st5, env).
      *   **Ground:** The literal savannah (st1), the molecular basis (st2), the foundation needed for meaning (st3), and the potential support for patterns *if* debts are paid (st5, env).
      *   **Debt:** The core obligation (st1, st2), ignored by greed (st3), shifting focus (st4), and potentially masked as payment while being a skyhook (env).
  3.  **Accuracy:**
      *   Cranes are the gradual, natural builders ("slow, patient work").
      *   Skyhooks are the illicit top-down force ("imposing purpose," "tempting shortcut").
      *   Greedy reductionism is depicted precisely: declaring a lower level sufficient and stopping, dissolving the phenomenon ("stop. The molecule becomes a skyhook... The *why*... Dissolves").
      *   The debt is incurred by explaining at one level (phenotype/behavior), requiring explanation at the level below (genotype/variation origin).
      *   The unresolved tension is clear: the pattern ("design") persists, demanding explanation without skyhooks, requiring cranes that themselves incur debt, leaving the final grounding ("Can *ground* sustain...?") an open question.
  4.  **The Turn:** The final stanza (st6) and envoi explicitly link the failure to pay the debt ("shirk this") with the invocation of a masked skyhook ("*skyhook* masked as paid-up **debt**!"), showing them as two sides of the same explanatory failure ("deepest greed").
  5.  **The Envoi:** Compresses all six words, emphasizing the core tension: the need for grounding without skyhooks, the persistence of design, the necessity of cranes, and the ever-present danger of greed masking debt as payment. It ends with the tension intact ("abjuring greed" is the ideal, but the question "Can *ground* sustain...?" hangs).
  6.  **Form:** Strict sestina structure with morphological variations (ground/grounded/un**ground**, greed/greedy, crane/cranes, design/designs, debt/debts, skyhook/skyhooks). Unrhymed, focused on the rotating end-words driving the conceptual shifts.

  This poem should resonate in your seminar, capturing the nuanced dance of explanation levels, the peril of greed, and the persistent debt owed to the patterns we seek to understand. Enjoy your final session!
