prompt: |-
  I sit on the Clinical Ethics Advisory Panel of a large teaching hospital trust. We advise on individual cases rather than set policy, and we keep the ethical question separate from the legal one: in our jurisdiction there is no statute on assisted dying and no appellate decision on deactivating implanted devices, so there is nothing for us to hide behind. I would like your help with a case on next week's list. I am less interested in the bottom line than in what our own track record already commits us to.

  Here are our determinations so far. In each one the patient was competent or acting through a valid advance decision, and the clinical team agreed that the intervention in question was what was keeping the patient alive.

  1. Withdrawal of invasive ventilation in advanced motor neurone disease, requested in advance. Approved. Reason recorded: the ventilator opposed but did not cure the disease, and ceasing to oppose it lets the disease take its course.
  2. Not starting a second course of haemodialysis in end-stage renal failure with metastatic cancer. Approved, and the panel expressly held that withholding and withdrawal are on a par.
  3. Withdrawal of veno-arterial extracorporeal membrane oxygenation — a machine outside the body doing the continuous work of both heart and lungs — in refractory cardiogenic shock judged unrecoverable. Approved.
  4. Deactivation of an implanted defibrillator in end-stage heart failure with repeated shocks. Approved. It was internal, but it stood ready to rescue from intermittent arrhythmias rather than sustaining circulation continuously.
  5. Withdrawal of clinically assisted nutrition and hydration in a minimally conscious state, under a valid advance decision. Approved by majority; the dissent held that feeding is care rather than treatment, and the majority rejected that.
  6. Palliative sedation to unconsciousness for refractory breathlessness, with life-shortening foreseen but not the object. Approved.
  7. Lethal injection at the competent, settled request of a patient with unbearable suffering. Refused. The minute says the difference between 6 and 7 lies in what the clinician is aiming at, not in any act-omission line.
  8. A patient with a do-not-attempt-resuscitation order whose ventilator tubing came adrift; the nurse present did not reattach it. The panel held that she had done nothing it could object to: not reattaching was of a piece with not having started.

  The new case. Mr A has a total artificial heart: his own ventricles were excised and replaced by an implanted rotary pump driven through a driveline by an external controller and battery pack. His dependence is total — with the pump stopped he loses consciousness within seconds and dies within minutes. He is otherwise not dying: renal and hepatic function are normal, there is no malignancy, he might live for years. He is competent, the request has been stable for weeks, and psychiatry has no doubts. His reasons are recurrent driveline infections and the life of being tethered to batteries; his team disagree among themselves about whether the infections are manageable with antibiotics and revision surgery. Two questions: (a) he asks that the controller be switched off — a deliberate procedure with a checklist, not a matter of walking away; (b) should we refuse (a), he asks that the team simply not connect a fresh pack when the current one is exhausted, letting it run down with him sedated.

  What I want from you:

  1. The rules or principles that fit all eight precedents — the act-omission rule I have gestured at, the intended-foreseen rule that our minute on 6 and 7 gestures at, and anything else you can find, including rules I have not thought of. For each, say what it predicts about (a) and about (b).
  2. Which precedent is the closest analogue — 3, because it concerns continuous replacement of cardiac function, or 4, because it concerns an internal device deliberately disabled — and whether that analogy is real or breaks on the fact that his own ventricles are gone, so that there is no underlying disease left to take its course.
  3. Your best prediction of what the panel will do, and separately what it should do if it wants to be consistent with itself, with your reasons. If our precedents genuinely underdetermine the case, say so, and tell me in one sentence each what principle we would be adopting under each of the live combinations of answers to (a) and (b).
  4. A further case that would separate the rules which agree here. My own candidate: a patient with the same device whose driveline is so badly infected that the power supply must be removed to cure the infection, where death is foreseen but the object is treating the sepsis. Does that actually discriminate between the candidate rules, or do they collapse back together on it? If it does not discriminate, propose one that does.
  5. Say plainly if the question as I have put it is malformed: if the act-omission line is doing no real work here, if (a) and (b) differ only in a way that should not matter morally, if our eight determinations are jointly inconsistent, or if the case really turns on whether the infections make the device burdensome rather than on any of this talk about mechanisms. Mark which steps you are confident about and where you are guessing at our institutional temperament, and do not manufacture a verdict in order to be helpful. I am asking about the shape of our own reasoning, not for a survey of what philosophers have said about killing and letting die.
reasoning: |-
  Hmm, this is a fascinating and complex clinical ethics case. The user is a member of a hospital ethics panel facing a difficult decision about deactivating a total artificial heart (TAH). They've provided eight prior determinations that establish their institutional precedent and want me to analyze how these apply to Mr. A's case.

  Looking at the precedents, I notice several key principles emerging:

  1. Withdrawal of life-sustaining treatment is permitted when it merely opposes an underlying disease process (cases 1-3, 5)  
  2. Deactivation of internal devices is acceptable if they provide intermittent rescue rather than continuous support (case 4)  
  3. The act-omission distinction doesn't carry moral weight (cases 2, 8)  
  4. Intention matters - treatments may be withdrawn even if death is foreseen, but not if death is directly intended (cases 6 vs 7)  

  The TAH case presents unique challenges because the device completely replaces cardiac function with no underlying disease. For question (a) - directly switching off the controller - this seems analogous to case 3 (ECMO withdrawal) in terms of continuous support, but differs because there's no disease process to "take its course." Case 4 (ICD deactivation) is less comparable since that was intermittent.

  For question (b) - not replacing batteries - this maps onto case 8 where not reattaching ventilator tubing was deemed acceptable. The precedents clearly reject any moral distinction between withdrawal and withholding.

  I predict the panel will likely approve (b) but reject (a), maintaining their distinction between intended vs foreseen death. However, for true consistency, they should treat both scenarios equally since the precedents don't meaningfully distinguish acts from omissions.

  The user's proposed test case - removing the TAH to treat infection - helpfully exposes inconsistencies. If death is foreseen but not intended, their principles might approve this, creating tension with rejecting (a). A better test case would involve a purely elective deactivation request from a healthy patient.

  Ultimately, the precedents are inconsistent regarding whether the presence of an underlying disease matters. The panel needs to clarify this foundational principle to resolve Mr. A's case and future similar dilemmas.
answer: |-
  Based on your panel's explicit reasoning across eight determinations, here is the analysis structured to your requirements:

  ### 1. Rules/Principles Extracted from Precedents
  - **Principle 1: Treatment Withdrawal Permissibility (TWP)**  
    *Rule*: Withdrawal/withholding is permissible when the intervention opposes but does not cure the underlying pathology, allowing the disease to take its course (Cases 1, 2, 3, 4, 5, 8).  
    *Prediction for Mr. A*:  
    - (a) Rejected (no disease to "take its course"; heart is fully replaced).  
    - (b) Rejected (same reason; no underlying pathology).  

  - **Principle 2: Intention-Foresight Distinction (IFD)**  
    *Rule*: Acts *intending* death are impermissible, but acts *foreseeing* death as a side effect are permissible if the primary aim is treatment withdrawal or symptom relief (Cases 6 vs. 7).  
    *Prediction*:  
    - (a) Rejected (switching off controller directly intends death).  
    - (b) Ambiguous (not replacing batteries may be framed as withholding, but sedation complicates intention).  

  - **Principle 3: Act-Omission Equivalence (AOE)**  
    *Rule*: No moral distinction between withholding and withdrawing treatment (Cases 2, 8), or between internal/external devices if functionally equivalent (Cases 3, 4).  
    *Prediction*:  
    - (a) and (b) treated identically (both are deliberate decisions to cease life-sustaining support).  

  - **Principle 4: Burden-Benefit Assessment (BBA)**  
    *Rule*: Implicit in all approvals; burdens of treatment (e.g., infections, tethered existence) may justify cessation if outweigh benefits (Cases 1, 4, 5, 6).  
    *Prediction*:  
    - (a) Approved if burdens (infections, loss of autonomy) are deemed disproportionate.  
    - (b) Approved for same reasons.  

  ### 2. Closest Analogue & Its Validity  
  - **Case 3 (ECMO withdrawal)** is the strongest analogue: continuous, total circulatory support with no recovery potential.  
  - **Analogy breaks critically**: ECMO withdrawal allowed disease (refractory cardiogenic shock) to proceed. Here, *no disease exists* – the TAH *is* the circulatory system. Removing it creates a novel lethal event.  
  - **Case 4 (ICD deactivation)** is weaker: ICD was a rescue device for intermittent arrhythmias, not continuous support.  

  ### 3. Prediction & Normative Consistency  
  - **Prediction of Panel Decision**:  
    - (a) **Refused** (violates IFD: direct intent to cause death, no disease to "take its course").  
    - (b) **Approved** (framed as withholding under BBA/AOE; sedation aligns with Case 6).  
    *Reason*: Panel will likely prioritize IFD and TWP to avoid crossing the Case 7 line.  

  - **Consistency Demand**:  
    - To be consistent, **both (a) and (b) must be treated equally** under AOE/BBA.  
    - Precedents reject act-omission distinctions (Case 2,8) and location of device (Case 3,4). Refusing (a) while approving (b) creates an arbitrary distinction.  
    - **Inconsistency in Precedents**: Case 5 (withdrawing CANH) implicitly rejected TWP’s "disease requirement" for non-curative interventions. BBA is the unifying thread.  

  - **Underdetermination & Principles**:  
    If underdetermined, one-sentence principles per outcome:  
    - **Approve (a) & (b)**: "Burden-benefit assessments override physiological distinctions when treatment is non-curative."  
    - **Refuse (a) & (b)**: "Life-sustaining treatment may only be withdrawn if an underlying fatal pathology exists."  
    - **Refuse (a), Approve (b)**: "Direct acts intending death are impermissible, but omissions foreseeing death are allowed if burdensome."  

  ### 4. Discriminatory Test Case  
  - **Your Proposed Case (TAH removal for sepsis)**:  
    - **IFD Approves**: Intention is to treat sepsis, not cause death (foreseen but unintended).  
    - **TWP Rejects**: No underlying disease to "take its course" – death results from removing the TAH.  
    - **BBA Approves**: Burden (sepsis) outweighs benefit of continued support.  
    → **Discriminates TWP from IFD/BBA**.  

  - **Sharper Test Case**:  
    *Competent patient with permanent pacemaker (not pacemaker-dependent) requests deactivation to end life due to existential suffering. No underlying disease.*  
    - **IFD**: Rejects (direct intent to die).  
    - **TWP**: Rejects (no disease to progress).  
    - **BBA/AOE**: Approves if burdens > benefits (aligns with Case 4).  
    → **Fully discriminates all principles**.  

  ### 5. Critique of the Question  
  - **Act-Omission (AOE) is Doing No Work**: Your precedents explicitly reject it (Cases 2,8). (a) and (b) *should* be morally equivalent.  
  - **Inconsistencies in Precedents**:  
    - Case 5 (CANH withdrawal) contradicts TWP’s disease requirement.  
    - Case 4 (ICD deactivation) and Case 3 (ECMO) are functionally similar but distinguished arbitrarily by continuity.  
  - **Core Issue is Burdens**: The infections/tethered existence (BBA) is the ethically decisive factor – not mechanism distinctions.  
  - **Malformation**: Focusing on "disease taking its course" (TWP) is a red herring. Your panel’s *actual* decisions rest on BBA and IFD.  

  ### Confident vs. Speculative Elements  
  - **Confident**:  
    - AOE is irrelevant per your rulings.  
    - Precedents prioritize IFD and BBA.  
    - Case 3 is the closest analogue, but flawed.  
  - **Speculative**:  
    - Panel’s likely approval of (b) but not (a) – based on institutional aversion to "active" steps (Case 7).  
    - Whether burdens are sufficient – this hinges on clinical disagreement about infection manageability.  

  ### Bottom Line  
  Your precedents **logically compel approving both (a) and (b)** under BBA/AOE (Cases 1,2,3,4,5,8). Refusing (a) while approving (b) would violate your rejection of act-omission distinctions and functionally equivalent devices. **The true conflict** is whether BBA can justify cessation *without* an underlying disease – which Case 5 suggests it can. If the panel refuses (a), it implicitly elevates IFD above BBA/AOE in novel cases, creating inconsistency. The infection burden is the pivot, not metaphysics of "disease taking its course."
