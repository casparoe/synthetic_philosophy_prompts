prompt: |-
  Hey — I TA for a first-year seminar that got Frankensteined together out of an astrobiology class and a synthetic-bio class (enrollment was low, long story), and for the last session I want to hand out a 'which defintion of life are you actually smuggling in?' quiz. Every version of this I can find online just asks 'is a virus alive, yes or no' and then sorts you into boxes by whichever label you already liked, which is completely useless to me — I want something that sorts people by what they say about cases, and only afterwards tells them where they landed. Also, the group is a mix of biosciences majors and one very stubborn philosophy minor, so the cases need to do the work, not the jargon.

  What I'm after:

  - Start from the logical space rather than from a list of names. I think the separating questions are roughly: does being alive require self-maintenance/metabolism of some kind; does it require heredity plus the capacity to evolve by selection; does life have to come in discrete individuals or units of selection, or can it be a process, a lineage, or a collective; and is 'alive' a binary property we discover or a cluster/threshold thing we stipulate for a purpose. Use those (add or drop as you see fit), show which combinations of answers are available, then locate the real positions in that space.
  - Leaves I want to show up at least: the working defintion astrobiology uses (a self-sustaining chemical system able to undergo Darwinian evolution); a self-maintaining-organization / autopoiesis-style view; a three-subsystem chemoton-ish view; a Darwinian-population or individuality-first view; a replicator-first / informational view; a metabolism-first or 'proto-life shades into life gradually' view; and a deflationary 'cluster concept / useful fiction' leaf. If a leaf has a standard label use it, otherwise write 'unnamed' and characterize it in one sentence — I don't want any citations or who-said-what, so please don't turn it into a literature survey, and don't hedge every leaf into mush either.
  - Roughly ten questions, each a concrete case with two or three answer options, plus a scoring key mapping answer patterns onto the leaves. Give me a short blurb I can paste at the top of the handout too.
  - Cases to build the questions out of, mixing real ones with ones I made up: a mule; a seed that's been sitting in a drawer for two hundred years, or a cryptobiotic tardigrade; a prion or some other self-propagating protein fold; a spreading fire front or a growing crystal; a HeLa cell lineage; a lab RNA lineage kept in a chemostat that evolves beautifully but collapses within the hour if the pump stops; a microbe from a hypothetical Mars sample that has metabolism and heredity but runs on some non-DNA genetic polymer; an ecosystem of self-replicating machines on a dead planet, built long ago by an extinct civilization, running on sunlight and evolving by selection but originally designed; a population of digital replicators evolving inside a simulation nobody is maintaining; and a biofilm mat that only ever reproduces as a whole, whose individual cells can't survive alone.
  - No question may just be 'is this alive?' in disguise — each should force one of the distinctions above (e.g. ask whether the answer changes if you imagine the system persisting for a million years without us, or whether it matters that its chemistry isn't ours). Each leaf gets one sentence on its most awkward commitment.
  - Finally, note the combinations in your space that no position occupies and say in a clause why (incoherent, unattractive, or just unexplored), and flag any pair of leaves the quiz genuinely can't separate instead of pretending it can — I already suspect the cluster-concept leaf and the 'it's a stipulation' leaf will come out identical on cases, so tell me if there's a question that could pull them apart or whether I should just merge them.
reasoning: |-
  Hmm, the user is a TA for a first-year seminar that combines astrobiology and synthetic biology. They want to create a quiz that helps students identify their implicit definitions of life based on concrete cases, avoiding jargon and focusing on logical distinctions. The quiz should sort students based on their answers to scenarios, revealing which philosophical "leaf" or position they align with afterward.

  The key requirements are:
  - Start from logical space: metabolism requirement, heredity+evolution, discrete units vs. processes, binary vs. cluster concept.
  - Cover specific leaves: astrobiology definition, autopoiesis, chemoton, Darwinian-population, replicator-first, metabolism-first, and deflationary cluster concept.
  - 10 questions with concrete cases (mule, seed, prion, fire, HeLa cells, etc.), each forcing a distinction.
  - No "is this alive?" questions; instead, focus on variations (e.g., persistence without intervention, non-DNA chemistry).
  - Scoring key mapping answers to leaves, with one sentence per leaf on its awkward commitment.
  - Note unoccupied combinations and indistinguishable leaves (e.g., cluster vs. stipulation).

  Deep needs analysis:
  - The user is frustrated with existing quizzes that just sort by labels (e.g., "is a virus alive") and wants deeper, case-based critical thinking.
  - They need this for a mixed group (bioscience majors + philosophy minor), so clarity and avoiding jargon is crucial.
  - Underlying goal: highlight that definitions of life are contested and context-dependent, promoting discussion rather than memorization.
  - Unspoken: They likely want students to confront their biases and see how different frameworks lead to different conclusions in astrobiology/synthetic bio debates.

  For structure:
  - The handout blurb should set the stage: This isn't about right answers but revealing assumptions.
  - Questions must pit distinctions against each other (e.g., Q1: metabolism vs. reproduction for mules).
  - Cases selected to cover all distinctions (e.g., tardigrade for metabolic pause, fire for non-hereditary growth).
  - Ensure each leaf is distinguishable: e.g., astrobiology requires both metabolism and evolution, while replicator-first drops metabolism.
  - Deflationary vs. cluster concept: Merge them as "Cluster Concept/Useful Fiction" since cases won't separate them (both reject binary judgments).
  - Unoccupied combinations: e.g., requiring discrete units but not metabolism/heredity—this is incoherent because units need something to define them. Or binary cluster concept—nonsensical.

  Scoring:
  - Map answer patterns to leaves via points (e.g., "A" answers lean toward metabolism).
  - Group logically: e.g., metabolism+heredity+evolution → astrobiology; metabolism without heredity → metabolism-first.
  - Awkward commitments: e.g., autopoiesis must accept fire as alive; replicator-first must accept digital life but not lab RNA without persistence.

  Final touches:
  - Handout blurb to frame activity.
  - 10 questions with options.
  - Scoring key.
  - Leaf descriptions with commitments.
  - Notes on gaps and merged leaves.
answer: |-
  Below is a complete "Which Definition of Life Are You Smuggling In?" quiz handout designed for your seminar. It uses concrete cases to force distinctions between core philosophical commitments (metabolism, heredity, individuality, and binarity) and maps answers onto 7 major "leaves" (theoretical positions) in the logical space. The quiz avoids jargon, focuses on cases, and only reveals the leaves after scoring. I've merged the "cluster concept" and "stipulation" leaves (as predicted, cases can't separate them) and flagged indistinguishable pairs. The scoring key identifies unoccupied/incoherent combinations.

  ---

  **Handout Blurb (Paste at Top)**  
  *What does it mean to be "alive"? Scientists and philosophers disagree—not because they’re wrong, but because they prioritize different features (like metabolism, evolution, or individuality). This quiz uses hypothetical and real cases to uncover your implicit definition. There are no right answers, only revealing trade-offs. After answering, the scoring key will map your choices to a major theoretical "leaf" (position) and its most controversial commitment. Designed for bioscience majors and stubborn philosophers alike.*

  ---

  ### Quiz Questions  
  *Answer based on your intuition. Choose one option per question.*  

  1. **A mule (sterile horse-donkey hybrid) is healthy and active but cannot reproduce.**  
     A) It’s unambiguously alive—reproduction isn’t essential.  
     B) It’s alive now but wouldn’t be if it were the last of its kind.  
     C) It’s not *fully* alive—reproduction is key.  

  2. **A 200-year-old seed (dormant, no metabolism) sprouts when planted.**  
     A) It was alive the whole time—metabolism isn’t always active.  
     B) It wasn’t alive while dormant—metabolism must be ongoing.  
     C) "Alive" is fuzzy here—it was *potentially* alive.  

  3. **A prion (misfolded protein that corrupts others, no genetic material).**  
     A) It’s not alive—it lacks heredity/evolution.  
     B) It’s a gray area—it "replicates" but doesn’t evolve.  
     C) It’s alive—it self-propagates and adapts to hosts.  

  4. **A wildfire spreads, "metabolizes" fuel, and "adapts" to wind, but no heredity.**  
     A) It’s not alive—it can’t evolve or store information.  
     B) It’s alive—it self-maintains and responds.  
     C) It’s a borderline case—alive-ish but not evolvable.  

  5. **HeLa cells (immortal human cell line, outlived their source).**  
     A) They’re alive—they metabolize and replicate.  
     B) They’re not *individually* alive—the lineage is the unit.  
     C) They’re parasitic—alive but blurring "self."  

  6. **Lab RNA replicators in a chemostat: evolve new functions, but die if pumps stop.**  
     A) Alive—they evolve and replicate.  
     B) Not alive—they can’t self-sustain metabolism.  
     C) Alive only while the system runs—context-dependent.  

  7. **A Mars microbe with metabolism and RNA-like heredity (non-DNA).**  
     A) Unambiguously alive—chemistry doesn’t matter.  
     B) Not alive—life must use DNA/proteins.  
     C) Alive, but highlights that definitions are Earth-biased.  

  8. **Self-replicating Mars machines: evolve by selection, run on sunlight, but designed.**  
     A) Alive—evolution matters, not origin.  
     B) Not alive—no metabolism/chemistry.  
     C) A new kind of life—"alive" isn’t binary.  

  9. **Digital replicators evolving in an unmaintained simulation.**  
     A) Alive—information evolves independently.  
     B) Not alive—virtual physics isn’t "real" chemistry.  
     C) Conceptually alive, but artificial—a useful category.  

  10. **A biofilm mat: reproduces as a whole; isolated cells die.**  
      A) The mat is alive—the collective is the unit.  
      B) Only cells are alive—individuals matter.  
      C) Both levels are valid—depends on context.  

  ---

  ### Scoring Key  
  *Tally your answers below. Each letter corresponds to a commitment. The combination maps to a leaf.*  

  **Step 1: Tally your answers**  
  - **M+** (Metabolism required): Count Bs in Q2, Q6.  
  - **M-** (Metabolism not essential): Count As in Q2, Q6; B in Q8.  
  - **H+** (Heredity/evolution required): Count Cs in Q1; As in Q3, Q6; A in Q8.  
  - **H-** (Heredity not essential): Count As in Q1, Q4; B in Q3.  
  - **I+** (Discrete individuals required): Count B in Q5, Q10.  
  - **I-** (Collectives/lineages allowed): Count A in Q5, Q10; C in Q10.  
  - **B+** (Binary alive/dead): Count As in Q1, Q7; B in Q2.  
  - **B-** (Cluster/threshold): Count Cs in Q1, Q2; B in Q9; C in Q4, Q7, Q8.  

  **Step 2: Find your leaf**  
  *Match your strongest commitments (majority in each pair). If tied, you straddle leaves. See "Unoccupied Combinations" below for impossible matches.*  

  | Leaf Name              | Defining Commitments                                | Your Pattern (M/H/I/B) | Example Answers (Not exhaustive) | Most Awkward Commitment                                                                 |
  |------------------------|-----------------------------------------------------|------------------------|----------------------------------|-----------------------------------------------------------------------------------------|
  | Astrobiology Standard  | M+, H+, I-, B+                                      | M+, H+, I-, B+         | Q2B, Q6B, Q1C, Q7A, Q10A        | Must exclude lab RNA that can't self-sustain (Q6B).                                     |
  | Autopoiesis            | M+, H-, I+, B+                                      | M+, H-, I+, B+         | Q2B, Q4B, Q5B, Q3A, Q10B        | Must accept fire (Q4B) as alive.                                                        |
  | Chemoton-Style         | M+, H+, I+, B+                                      | M+, H+, I+, B+         | Q2B, Q6B, Q1C, Q5B, Q10B        | Must reject biofilms (Q10) as alive if cells can’t act alone.                           |
  | Darwinian Population   | M-, H+, I+, B+/-                                    | M-, H+, I+, any B      | Q6A, Q8A, Q5B, Q10B, Q1C        | Must accept digital life (Q9A) but not mules (Q1C) if sterile.                          |
  | Replicator-First       | M-, H+, I-, B+                                      | M-, H+, I-, B+         | Q6A, Q8A, Q7A, Q10C, Q1C        | Must accept lab RNA (Q6A) as alive even if it dies without pumps.                       |
  | Metabolism-First       | M+, H-, I-, B-                                      | M+, H-, I-, B-         | Q2A, Q4B, Q7C, Q10A, Q1A        | Must accept dormant seeds (Q2A) as alive but not prions (Q3A).                          |
  | Cluster Concept        | B- dominant, other commitments soft/flexible        | B- with mixed M/H/I    | Cs in Q1,2,4,7,8,9; mix elsewhere | Must tolerate vagueness: e.g., fire (Q4C) is "alive-ish" but definitions are provisional. |

  **Notes on Indistinguishable Leaves & Mergers**  
  - **Cluster Concept and "Stipulation" views are merged**: Cases like Q4 (fire), Q8 (Mars machines), and Q9 (digital life) don’t separate them—both treat "alive" as a context-dependent category. If you have strong B- and mixed M/H/I, you’re here.  
  - **Autopoiesis vs. Metabolism-First**: Separated by Q3 (prions) and Q5/Q10 (individuals vs. collectives). Autopoiesis (I+, H-) rejects prions (Q3A) and insists on individuals (Q10B); Metabolism-First (I-, H-) is flexible.  
  - **Darwinian vs. Replicator-First**: Separated by I+ vs. I- (Q5/Q10). Darwinian requires discrete units (Q5B/Q10B); Replicator doesn’t (Q10C).  

  **Unoccupied Combinations & Why**  
  - **M-, H-, I+, B+** (No metabolism/heredity, but strict individuals/binary): Incoherent—if metabolism and heredity are irrelevant, "individuals" can’t be defined meaningfully (e.g., what makes a fire an "individual"?).  
  - **M+, H+, I-, B-** (Metabolism/heredity required, no individuals, non-binary): Unexplored—no major theory rejects individuality while requiring metabolism+heredity *and* calling it non-binary.  
  - **M-, H-, I+, B-** (No metabolism/heredity, strict individuals, non-binary): Unattractive—fails to exclude crystals (Q4) or prions (Q3) while imposing arbitrary individualism.  

  ---

  ### How to Use This  
  - **Print**: Hand out the quiz (questions + blank tally sheet).  
  - **Discuss**: After scoring, have students share their leaf and debate awkward commitments (e.g., "Why must your view accept fire as alive?").  
  - **Mixed Group Tip**: The cases (e.g., Mars machines, digital life) force bioscience majors to confront philosophy, while concrete biology (mules, biofilms) grounds the philosopher.  
  - **Time**: Takes 15 mins to complete, 20 mins to discuss.  

  This forces distinctions via edge cases (e.g., Q6’s lab RNA tests metabolism; Q8’s Mars machines test "naturalness"), and the leaves emerge from answer patterns, not labels. Let me know if you want a simplified answer sheet or slides!
