prompt: |-
  I read a fair bit of cross-cultural moral psychology for fun — the WEIRD-samples complaint, the economic games run in small-scale societies, that sort of thing — and I keep noticing a pattern I don't have a word for. (I'm not in the field, so sorry if this is bread-and-butter stuff.)

  When a study finds a big difference — undergrads say the guy who kept most of the money did something wrong and deserves to be punished even by a bystander who lost nothing; people in some of the small-scale societies studied are much less bothered, and say in effect that it's his business — the finding gets reported in at least three different shapes, and which shape you pick seems to decide whether it tells you anything about whether morality is objective.

  (a) They disagree about a moral claim: same act, same description, opposite verdicts. Genuine moral disagreement.
  (b) They aren't judging the same thing. Different concept of what the act even is, or the question got translated but the construct didn't.
  (c) They agree about the reasons and disagree about the facts: whether the ancestors really retaliate, whether the curse really makes people sick, whether anyone was actually harmed. Fix the facts and the verdicts come back together.

  And then (d), the case I can't place: everybody agrees on the facts and on what happened, but they disagree about who is *in* the moral community at all — dead relatives, unborn children, people in the next valley are or aren't the kind of thing you owe anything to. That's not (a), not (b), and not (c), because nobody has a false empirical belief.

  Two more things that make me think this isn't just the familiar point about verbal disputes: in (c), the disputed facts are often themselves morally loaded, so "they only disagree about non-moral facts" doesn't sit right; and the very same study gets filed under (a) by people drawing a debunking conclusion and under (b) or (c) by people resisting it, with no agreed test for who's right.

  Is there a name for this? Not for the big relativism conclusion — for the sorting itself: putting a cross-cultural difference into one of these boxes, and the suspicion that the sorting is doing all the work. Does it have an established concept or literature? If the nearest things are the argument from disagreement, mere verbal disputes, or something about concepts not being shared across cultures, tell me which fits best, exactly how mine differs from each, and where the boundary cases land — especially (d) and the morally-loaded-fact version of (c). If there's nothing established, coin a term and define it tightly enough that I could actually sort a case with it. A bare label is no use to me; I want the carving and the edges.

  Finish with a single line: \answer{<established | near-fit | coined>: <your term>}
reasoning: |-
  Alright, let's tackle this user's query. They're into cross-cultural moral psychology and have noticed a pattern in how studies report differences. They've outlined four categories: (a) genuine moral disagreement, (b) different concepts, (c) disagreement over facts, and (d) disagreement about the moral community. The user is confused about where (d) fits and how (c) sometimes involves morally loaded facts. They also mention that the same study gets categorized differently by different researchers, affecting conclusions about moral objectivity.

  First, I need to understand the user's main request. They want a term or concept for the sorting process itself, especially (d), and clarification on how it differs from existing ideas. They’re not in the field, so avoiding jargon is key. They’re analytical, seeking precise definitions and boundaries between categories.

  Looking at the existing categories: (a) is standard moral disagreement. (b) relates to conceptual incommensurability or thick concepts. (c) is factual disagreement. But (d) is trickier—it's about who counts in the moral community, which isn't covered by the others. The user notes that in (c), facts can be morally loaded, blurring the line between facts and values. 

  The user also points out that researchers categorize the same study differently based on their stance—debunkers go for (a), others for (b) or (c). This suggests the sorting itself is strategic, influencing whether moral relativism is supported. The unspoken need might be understanding how methodological choices in research affect interpretations of moral objectivity.

  For (d), terms like moral standing or moral patienthood come to mind. But "Moral Community Boundary Disputes" (MCBD) fits better, coined to capture disagreements about who is included. Boundaries here are about relational ontologies, not false beliefs. This differs from (c) because no empirical facts are in dispute; it's about categorization.

  For the sorting process, "interpretive framing" or "disagreement taxonomy" are near-fits. But "Disagreement Typology Operationalization" (DTO) seems precise. It highlights how researchers categorize differences, affecting conclusions. The user wants a tool to analyze studies, so DTO provides that framework.

  The morally-loaded facts in (c) relate to fact/value entanglement. When facts are infused with moral values, fixing facts doesn't resolve disagreement because the facts themselves are value-laden. This complicates (c), making it closer to (a). The user needs to see how DTO handles these boundary cases, where sorting isn't neutral but theory-laden.

  Finally, summarizing: MCBD for (d), DTO for the sorting process. The answer combines established terms with coined ones, addressing the user's need for clear categorization tools. The single-line answer reflects this synthesis, providing both terms for further exploration.
answer: |-
  Based on your description, you've identified a crucial and contested methodological maneuver in cross-cultural moral psychology and metaethics: **the classification of observed differences to determine their implications for moral objectivity**. Here's the breakdown:

  1.  **The Sorting Process & Its Stakes:**
      *   You're describing **interpretive framing** or **disagreement taxonomy**. Researchers actively categorize observed differences into bins like (a), (b), (c), or (d).
      *   This classification is **not neutral**. As you note, categorizing as (a) ("genuine moral disagreement") is often used to support arguments for moral relativism or error theory. Categorizing as (b) ("different concepts/constructs") or (c) ("factual disagreement") is used to *resist* relativist conclusions, preserving objectivity by arguing the disagreement isn't about the *core moral proposition* itself. (d) occupies a distinct, complex space.
      *   The suspicion that "the sorting is doing all the work" highlights that this is often **theory-laden interpretation**. The researcher's prior commitments (e.g., to moral realism vs. relativism) can influence *how* they classify the difference, affecting the study's perceived implications.

  2.  **Category (d): Moral Community Boundary Disputes:**
      *   This is **not** simply (a), (b), or (c). It's a distinct type.
      *   **Best Fit:** It falls under debates about **Moral Standing / Moral Patienthood / Moral Status** or **Relational Ontology**.
      *   **Why it's distinct:**
          *   **Not (a):** It's not disagreement about the *wrongness of an act* given fixed patients, but disagreement about *who qualifies as a patient* deserving moral consideration *at all*. The core moral principle ("it's wrong to harm beings with moral standing") might be shared, but its *application domain* differs.
          *   **Not (b):** While concepts might differ, the disagreement is specifically about the *scope* of entities covered by concepts like "person," "victim," "being owed duties," or "moral community member." It's a disagreement *within* the framework of moral reasoning about *who counts*.
          *   **Not (c):** There's no dispute over empirical facts *about the entities* (e.g., "Are the ancestors dead? Yes." "Do people in the next valley exist? Yes."). The dispute is normative: *Do these facts confer moral standing?* It's about the *significance* of agreed-upon facts, not their existence.
      *   **Literature:** This connects to work on personhood (e.g., debates about animals, fetuses, AI, ecosystems), relational ethics (e.g., care ethics emphasizing specific relationships), and anthropological studies on kinship, animism, and the boundaries of the social/moral universe (e.g., who is "distant" or "other"). Key concepts are **Moral Circle Expansion/Contraction** and **Scope of Moral Concern**.

  3.  **The Morally-Loaded Facts in (c):**
      *   This complicates the clean separation between (a) and (c). Examples like "Will the ancestors retaliate?" or "Does the curse cause sickness?" are often intertwined with cultural worldviews and values.
      *   **Best Fit:** This is the problem of **Fact/Value Entanglement** or **Thick Ethical Concepts**.
      *   **Why it matters:** Classifying such a difference *solely* as (c) ("mere factual disagreement") can be misleading. The "fact" (e.g., ancestor agency) is often:
          *   **Conceptually Dependent:** Understanding it requires grasping the moral/religious framework.
          *   **Motivationally Salient:** Belief in it is sustained partly by its moral/social significance.
          *   **Non-Falsifiable:** Often difficult to empirically verify independently of the worldview.
      *   **Boundary with (a):** If the "fact" is deeply embedded in the moral framework, resolving the factual disagreement might *require* abandoning the moral framework itself. In such cases, the disagreement is effectively about the framework (leaning towards a/b), not just a neutral empirical claim resolvable within a shared framework.

  4.  **The Lack of Agreed Test & Strategic Sorting:**
      *   This is the core of the problem you identify. There is **no definitive, culture-neutral algorithm** for sorting differences into (a), (b), (c), or (d). Sorting relies on:
          *   **Interpretation:** Of participant responses, cultural context, and the meaning of concepts.
          *   **Pre-Theoretical Commitments:** The researcher's stance on moral realism, concept possession, cultural commensurability.
          *   **Methodological Choices:** How questions are framed, translated, and operationalized; what counts as "the same act" or "the same concept."
      *   **Near-Fits:** This relates to the **Argument from (Cross-Cultural) Disagreement** in metaethics, but you're focusing on the *prior step* of *characterizing the nature* of the disagreement observed. It also touches on debates about **Conceptual Relativism** and **Radical Interpretation** (Davidson), but your focus is specifically on the methodological move within empirical psychology.

  5.  **The Coined Term: Disagreement Typology Operationalization (DTO)**
      *   **Definition:** Disagreement Typology Operationalization (DTO) is the methodological process within cross-cultural moral psychology (and related fields) whereby observed differences in responses to stimuli or scenarios are actively classified into distinct interpretive categories (e.g., genuine moral disagreement, conceptual mismatch, factual disagreement, moral standing dispute) based on researcher interpretation of participant meaning, cultural context, and theoretical presuppositions. This classification is not value-neutral and significantly shapes the conclusions drawn about the nature of morality (e.g., its objectivity or relativity).
      *   **How to Use It:**
          1.  **Identify the Difference:** Note the variation in responses between groups.
          2.  **Analyze Researcher Interpretation:** How do the study authors *explain* this difference? What category (a,b,c,d) do they implicitly or explicitly place it in?
          3.  **Examine the Sorting Criteria:** What evidence or reasoning is used to justify this classification? (e.g., translation notes, follow-up interviews, appeals to cultural understanding, assumptions about shared concepts)?
          4.  **Assess Theoretical Stakes:** How does this classification support or resist conclusions about moral objectivity/relativity? Does it feel forced by pre-existing commitments?
          5.  **Consider Alternatives:** Could the difference plausibly fit another category? (e.g., Could what's presented as (c) involve fact/value entanglement? Could (d) be misinterpreted as (a) or (b)?)
      *   **Boundaries:**
          *   DTO focuses on the *researcher's act of classification* of empirical observations, distinct from the philosophical Argument from Disagreement itself.
          *   It highlights the contestable nature of this classification, differing from simply noting "they have different concepts" or "they disagree on facts" by emphasizing the interpretive *process and its consequences*.
          *   It encompasses the specific challenge of categorizing Moral Community Boundary Disputes (d) and Fact/Value Entanglement within (c).

  **Summary & Answer:**

  *   The **sorting process** you describe is fundamentally **Disagreement Typology Operationalization (DTO)**, a coined term capturing the theory-laden methodological classification of cross-cultural differences.
  *   **Category (d)** is best understood as a **Moral Community Boundary Dispute (MCBD)**, concerning disagreements over **Moral Standing/Patienthood**, distinct from (a), (b), or (c) due to its focus on the *scope* of moral concern based on agreed-upon facts.
  *   The **morally-loaded facts** in (c) illustrate **Fact/Value Entanglement**, blurring the line between (a) and (c) and complicating DTO.

  \answer{coined: Disagreement Typology Operationalization (DTO)}
