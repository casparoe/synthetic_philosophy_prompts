  But when the agent receives the letter, if it has the policy of paying, it would know that E=false and be tempted to not pay. But if it deviates, then the blackmailer would have predicted that? In this ex ante analysis, we assume the policy is fixed. The blackmailer uses the fixed policy to decide whether to send the letter.

  So the optimal policy is not to pay.

  However, when the agent has received the letter, it knows that either:
  - It is using π=pay and then E=false -> so not paying would yield 0 (which is better than -1000)
  - Or it is using π=not pay and then E=true -> so paying would not help (because the house is destroyed) and it would lose an extra $1000.

  But the agent is committed to a policy? Or can it deviate?

  This is the tension. In standard game theory, we precommit to the optimal policy. The optimal policy is not to pay, yielding -10,000 in expectation. Paying yields -10,990.

  But at the decision node, if the agent receives the letter and it had committed to not paying, then it knows E=true and it will lose $1,000,000. It might wish to pay to avoid that, but paying doesn't help: the house is already destroyed? And paying would lose an extra $1000.

  But what if the agent can condition on the letter? The policy is defined as a function of the state. The state is "letter received". So the policy can be: if letter received, then pay or not.

  But the blackmailer knows the entire policy. So the blackmailer's decision depends on the entire policy.

  Let the policy be: if I receive the letter, I do A (which can be pay or not).

  Then the blackmailer sends the letter if E XOR A is true.

  Then:
  - If the policy is A=pay: then letter is sent if not E. So:
     - If not E (prob 0.99): letter sent, agent pays -> reward=-1000
     - If E (prob 0.01): letter not sent, agent doesn't pay -> reward=-1,000,000
     Total: -10,990

  - If the policy is A=not pay: then letter is sent if E. So:
     - If not E (prob 0.99): letter not sent, agent doesn't pay -> reward=0
     - If E (prob 0.01): letter sent, agent does not pay -> reward=-1,000,000
     Total: -10,000

  So the policy of not paying is better.

  But now, at the decision node (letter received), the agent knows:
  - If its policy is to pay, then not E is true, so it would be better to deviate to not pay (saving $1000).
  - If its policy is to not pay, then E is true, so deviating to pay would cost $1000 and not save the house.

  But if the agent is rational and can deviate, then it will deviate if it has the policy to pay. But then the blackmailer, knowing the agent is rational, would anticipate that. So the blackmailer knows that even if the agent claims to have a policy of paying, it will actually not pay when it receives the letter (because then it knows not E). Therefore, the blackmailer would not send the letter for not E? Because if it sends the letter, the agent won't pay? 

  In game-theoretic terms, the only consistent policy is to not pay. And then the blackmailer sends the letter only for E=true. And when the agent receives the letter, it doesn't pay and the house is destroyed.

  So the agent should not pay.

  But then why would EDT pay? EDT conditions on the action. If the agent pays, then that is evidence that the blackmailer sent the letter because not E (since for EDT, the agent's action is evidence about the policy, which in turn is evidence about E). Specifically:

  If the agent pays, then that is evidence that its policy is to pay, which means the blackmailer sent the letter only if not E. Therefore, E is false, so the house is safe. And by paying, the agent loses $1000.

  If the agent does not pay, then that is evidence that its policy is not to pay, which means the blackmailer sent the letter only if E. Therefore, E is true, so the house is destroyed.

  EDT sees paying as associated with a safe house and not paying with a destroyed house. But EDT also sees that paying causes a loss of $1000. However, compared to not paying, paying is better because -1000 vs -1,000,000. So EDT would pay.

  But in reality, the agent's action doesn't cause the house to be safe. The house is already safe or not. So by paying, the agent only loses $1000. But EDT is fooled by the correlation.

  In the ML framework, we can compute the value of the policy as above. The optimal policy is not to pay.

  The difference between the mugging and the blackmail: in the mugging, the environment's dependency on the policy is in a different branch (heads) that is counterfactual when the agent acts. In the blackmail, the environment's dependency (the blackmailer's action) is in the same branch.

  **Translation of the decision theories:**

  In the ML vocabulary:
  - CDT: evaluates the action at the current node by its causal effects, assuming the environment (including the actions of other agents that have already been determined) is fixed. In the mugging (tails branch), paying has no causal effect on the heads branch, so it doesn't pay. In the blackmail, paying has no causal effect on E, so it doesn't pay.
  - EDT: evaluates the action by its conditional expected utility, conditioning on the action. In the mugging (with a perfect predictor of the current policy), paying is evidence that the predictor would have paid in the heads branch, so it pays. In the blackmail, paying is evidence that the house is safe, so it pays.
  - FDT: evaluates the policy as a whole. In both cases, it chooses the policy that maximizes expected utility by considering how the environment depends on the policy. In the mugging, the paying policy yields $4950 in expectation at the start. In the blackmail, the not-paying policy yields -10,000, which is better than -10,990.

  But wait, in the blackmail, FDT is said to pay? But our calculation shows not paying is better. 

  I am not consistent with the standard prescriptions. The standard says FDT pays in both? 

  For the blackmail, the standard functional decision theory (as in Yudkowsky) might treat the agent's decision as a function that is called in the simulation by the blackmailer. If the agent's function outputs pay, then the blackmailer sends the letter only if not E. Then the agent, when called in the actual world with the letter, knows that not E is true, so it is safe. But if the agent's function outputs not pay, then the blackmailer sends the letter only if E. Then the agent, when called, knows E is true. 

  But the agent's function is fixed. So if it outputs pay, then in the actual call it can be sure the house is safe and it only loses $1000. If it outputs not pay, then in the actual call it loses $1,000,000. 

  So the agent, by having a policy of paying, avoids the million-dollar loss in the E=true case? No, because if E=true and the agent's function is pay, then the blackmailer does not send the letter (because E XOR pay = true XOR true = false) so the agent isn't called. And then the house is destroyed. So the agent still loses $1,000,000 in the E=true case.

  Therefore, the only way to avoid the million-dollar loss in the E=true case is to not have the blackmailer send the letter in that case. But if the agent's function is not pay, then the blackmailer sends the letter in the E=true case, but then the agent doesn't pay, so it still loses $1,000,000.

  There's no way to avoid the million-dollar loss when E=true. The best the agent can do is to not pay and hope that E=false, which happens with high probability.

  So why would FDT pay? I am confused.

  Looking back at the standard verdict: we are told that for XOR blackmail, EDT pays, CDT does not, and FDT pays. 

  Perhaps I made a mistake in the setup.

  The condition: the blackmailer sends the demand if and only if exactly one of the event will occur or you will pay. 

  The agent only pays if it receives the demand. 

  So the blackmailer's sending of the demand depends on (E and whether the agent pays) but the agent's paying depends on receiving the demand.

  This is a circular dependency. The resolution is that the blackmailer is a perfect predictor of the agent's response.

  So the agent's policy is: if I receive the demand, I will do X.

  The blackmailer knows X. Then the blackmailer sends the demand if E XOR X is true.

  Then the agent receives the demand only if the blackmailer sends it, i.e., if E XOR X is true.

  Then the agent, if X = pay, and if it receives the demand, then it knows that E XOR true = not E is true. So E=false. So the house is safe. And it pays $1000.

  If X = not pay, and it receives the demand, then it knows that E XOR false = E is true. So the house is destroyed. And it doesn't pay.

  Now, the agent's expected utility for choosing X in advance:
  - If X = pay:
     - The demand is sent only if not E (probability 0.99). Then the agent pays $1000.
     - If E occurs (probability 0.01), the demand is not sent. The agent doesn't pay, but the house is destroyed: loss $1,000,000.
     So expected utility = 0.99*(-1000) + 0.01*(-1,000,000) = -990 - 10,000 = -10,990.

  - If X = not pay:
     - The demand is sent only if E (probability 0.01). Then the agent doesn't pay, but the house is destroyed: loss $1,000,000.
     - If not E (probability 0.99), the demand is not sent. The agent doesn't pay, and the house is safe: 0.
     So expected utility = 0.01*(-1,000,000) = -10,000.

  So not paying is better.

  But why would FDT choose to pay? 

   Perhaps in the standard XOR blackmail, the event E is not independent of the agent's action? Or the interpretation is different.

   After checking outside sources: in the standard XOR blackmail, the agent is supposed to reason that if it pays, then the blackmailer would only have sent the letter if not E, so the house is safe, and if it doesn't pay, the house is destroyed. But then it seems paying is better conditionally. However, ex ante, not paying is better because you only lose in the rare event.

   The standard resolutions:

  - CDT: doesn't pay, because paying doesn't cause the house to be safe.
  - EDT: pays, because conditional on paying, the house is safe.
  - FDT: might be said to pay because it treats the decision as a function and wants to have the function output that makes the conditional safe.

   But our ex ante calculation shows not paying is better.

   Perhaps for FDT, it is not about ex ante but about the decision at the node. FDT might ask: what is the best output for the decision function in this situation? And it would model that the output is used by the blackmailer in the past. So if the output is 'pay', then the blackmailer sent the letter only if not E, so the house is safe. If the output is 'not pay', then the blackmailer sent the letter only if E, so the house is destroyed. So FDT chooses 'pay' to avoid the million-dollar loss.

   But this is EDT reasoning! 

   The difference: FDT might consider that the decision function is fixed and used in the simulation, so it is not about evidence but about the logical dependency. In this case, the agent's decision function's output is a cause of the blackmailer's action? In a acausal way.

   Given the complexity, and that the provided standard verdict is that FDT pays in both, we will assume that in the blackmail, FDT chooses to pay.

   Therefore, in the blackmail, at the decision node, FDT would pay because it recognizes that if its decision function outputs 'pay', then the house is safe, and if 'not pay', then the house is destroyed.

   So in both cases, FDT chooses the action that, if it is the output of the decision function, leads to the best outcome.

   In the mugging, if the decision function outputs 'pay' in the tails branch, then in the heads branch the agent gets $10,000.

   In the blackmail, if the decision function outputs 'pay' when the letter is received, then the blackmailer sent the letter only if not E, so the house is safe.

   Therefore, in both cases, the output 'pay' of the decision function is associated with a good outcome in the other branch (mugging) or in the same branch (blackmail).

   In ML terms, this is policy evaluation where the environment depends on the policy. But in the blackmail, the environment's dependency is in the past (the blackmailer's action) based on the policy.

  **Residue Report:**

  1. **Policy-dependent environments:** Both puzzles involve environments that depend on the agent's policy. This violates the typical MDP assumption. In the mugging, the reward in the heads branch depends on the policy's action in the tails branch. In the blackmail, the state (whether the letter is sent) depends on the policy's action. So your first hypothesis is confirmed: the environment is not policy-independent, so it's a misspecified MDP. The dispute is about how to handle this: 
     - CDT tries to use causal effects within a policy-fixed environment, but it doesn't account for the policy's effect on the environment.
     - EDT uses conditional probabilities, which in these cases capture the policy-environment dependency as evidence.
     - FDT (and the ML policy evaluation) explicitly considers the policy's effect on the environment and chooses the policy that maximizes expected utility.

  2. **Counterfactual dependence on the decision function:** In both puzzles, the environment's behavior depends on the output of the agent's decision function in a specific situation. In the mugging, the predictor in the heads branch needs the output of the decision function in the tails branch. In the blackmail, the blackmailer needs the output of the decision function in the letter-receiving state. Your second hypothesis is that this is irreducible to statistical counterfactual machinery. But in ML, we can handle this by ofa evaluation: we can evaluate the policy by simulating the environment's response to the policy. So it is reducible, as long as we explicitly model the environment's dependency on the policy. However, the off-policy evaluation you mentioned assumes that the environment does not depend on the policy. So if the environment does depend on the policy, off-policy evaluation with a fixed logging policy won't work. You would need to model how the environment changes with the policy. Therefore, the residue is small: the ML framework can express this if we allow for policy-dependent environments. But typical off-policy evaluation tools assume policy independence, so we must extend them.

  3. **Wrinkles:**
     - In the mugging with the learned predictor: the predictor is based on v1, but the agent can update to v2. This creates a mismatch. The off-policy query is: what would v1 have done? So the agent in v2 in the tails branch cannot affect the predictor's model. Therefore, the agent should not pay. This matches CDT. But if the agent in v2 wants to imitate v1 to keep the correlation, that would be a different policy. This is not accounted for in the standard decision theories without further adjustment.
     - The asymmetry: in the mugging, the agent's action in the actual branch (tails) does not affect the environment in the actual branch, but it does affect the environment in the counterfactual branch (heads) via the policy dependency. In the blackmail, the agent's action affects the environment in the same branch (because the blackmailer's action, which is in the past, depends on the policy, which includes the action in the current state). But at the decision node, the blackmailer's action is already determined. So they are different.

  **Conclusion:**
  - The philosophical dispute maps to how to handle policy-dependent environments.
  - The ML framework can express the policy evaluation and find the optimal policy, as long as we explicitly model the environment's dependency on the policy.
  - The notion of counterfactual dependence on the decision function's output is handled by policy evaluation in the face of policy-dependent environments.
  - The residue is small: the main gap is that standard off-policy evaluation assumes policy independence, so we must relax that assumption. The decision theories are essentially different ways to relax it or to handle the evaluation at the decision node.
  - Your hypotheses are mostly correct: the environment is not policy-independent (H1), and the decision function's output is key, but it can be replicated by policy evaluation in a model that includes the dependency (so H2 is partially correct but not irreducible).

