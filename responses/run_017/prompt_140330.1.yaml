prompt: |-
  hey — I'm doing a PhD on imprecise probabilities and I keep coming back to how the IPCC actually writes up uncertainty, since it looks like the only big real-world institution that reports set-valued probabilities on purpose. You get likelihood words (likely, very likely, and so on) with a legend mapping each one to a probability band, then a completely seperate confidence scale that tracks how much evidence there is and how far the authors agree, and then — the bit that bugs me — in the very same sentence they still give a single best estimate with a likely range around it, like the headline number for climate sensitivity.

  Help me reconstruct what that package of habits realy presupposes. Does it strictly need genuinely imprecise credences, or would a precise Bayesian with one wide posterior over models license every bit of it, best estimate included? Does running two scales commit it to two different sources of imprecision — disagreement between experts, i.e. a set of probability functions, versus thin evidence inside a single head — or could one story cover both? And is that single best estimate a genuine commitment, to a privileged member of the credal set or to some decision rule like maximality, or just pragmatics for policymakers?

  One more thing I basically never see discussed: the bands have sharp endpoints. If your probability for a claim isn't precise, what does it mean to say it clears 66 per cent? To me the imprecision just seems to get pushed up a level — is that stable, or does it regress? And if you swapped the whole practice for straight single-number reporting, what would actually be lost?
reasoning: |-
  Okay, let me unpack this PhD student's query about the IPCC's uncertainty reporting. They're clearly deep into imprecise probability theory but wrestling with how it maps onto real-world scientific communication practices. The core tension seems to be between the elegant math of credal sets and the messy pragmatics of climate assessment reports.

  First, I need to reconstruct their main puzzles: 
  1) Does IPCC's dual-scale system (likelihood bands + confidence levels) require genuine imprecision, or can a wide Bayesian posterior explain it? 
  2) What's the status of that single best estimate that always sneaks in? 
  3) Why the sharp probability band cutoffs when uncertainty is inherently fuzzy? 
  4) What's really lost if we simplified to single numbers?

  Hmm... the user's phrasing suggests they've already spotted some contradictions. That "package of habits" comment implies they see IPCC's approach as somewhat ad hoc. I should validate that intuition while showing how institutional constraints shape the formalism.

  Starting with the Bayesian question. A pure Bayesian could mimic the likely range as a highest density interval from their posterior. But the confidence scale explicitly mixes evidential quality and expert agreement - that's multiple probability functions right there. The moment you have dissent among authors, you're in credal set territory. I recall Cooke's classical model where expert weights combine into a linear pool, but IPCC doesn't formally weight authors. Their "confidence" seems more like a qualitative meta-assessment.

  Then there's that pesky best estimate. In imprecise terms, is it the center of mass? A maximizer? The user's "maximality" reference makes me think they suspect a decision-theoretic angle. But IPCC's summaries often say things like "best estimate 3°C" without justification. Probably it's just the median or mode of some dominant model - more pragmatic than principled.

  The sharp band cutoffs really bug me too. If probability is imprecise, saying P>0.66 is meaningless because P isn't a real number! It feels like the institution wants interval outputs but interval inputs would be too complex. So they discretize. User's "pushed up a level" insight is sharp - the imprecision now lives in the band assignment process itself.

  What's lost without bands? At COP meetings, "very likely" does heavy lifting. Numerical probabilities make false precision salient. But the user might appreciate Moon & Cockburn's meta-analysis showing words prevent rounding errors in policymaker recall. Still, that confidence scale is IPCC's secret sauce - it flags when likelihoods rest on shaky evidence even if agreement is high.

  Wait, the user mentioned "thin evidence inside a single head" versus "disagreement between experts" as distinct imprecision sources. That's crucial. The confidence scale blurs these epistemically distinct issues. A Bayesian might handle both with hierarchical models, but IPCC's categorical approach serves accountability - you know if dissent wasn't resolved.

  For the response structure: I'll start by affirming their instinct that imprecise creds are necessary (not just wide Bayesianism). Then unpack how confidence/likelihood decouple two uncertainty dimensions. The best estimate gets a "mostly pragmatic" verdict with decision-theoretic caveats. On sharp bands, I'll validate their regress concern but note IPCC's discretization serves usability. Finally, single numbers would lose the deliberate ambiguity needed in consensus science.

  User seems theoretically sophisticated but hungry for real-world validation. I'll highlight how IPCC's hybrid system manages tradeoffs between precision, communicability and epistemic honesty - even if mathematically messy. Might mention they're not alone; FDA drug approvals use similar verbal frameworks. Should close by inviting their take on whether the regress problem could be mitigated.
answer: |-
  Your dissection of the IPCC's uncertainty framework hits the core tensions in translating imprecise probabilities into real-world policy communication. Let's break this down step by step, reconciling their practice with your theoretical concerns:

  ### 1. **Does this require *genuine* imprecise credences?**  
     **Yes, but pragmatically constrained.** A Bayesian with a single wide posterior *could* generate a "likely range" (e.g., 66% HDI) and a "best estimate" (e.g., posterior median). *However*, the IPCC's confidence scale (qualitative assessment of evidence/agreement) explicitly introduces **multiple dimensions of uncertainty** that a single probability function cannot capture:  
     - **Epistemic quality**: Thin evidence ≠ wide consensus.  
     - **Expert disagreement**: A wide posterior from one expert ≠ disagreement among a group.  
     The confidence scale maps more naturally to **credal sets** (e.g., the set of probabilities consistent with available evidence/models) or **robust Bayesian** approaches (e.g., Γ-minimax). The IPCC implicitly treats the likelihood band as an *envelope* of plausible probabilities given dissent/evidential limitations.

  ### 2. **The "best estimate" dilemma: Genuine commitment or pragmatics?**  
     **Mostly pragmatics, with caveats:**  
     - It’s **not** a formal endorsement of a "privileged" credence. Climate sensitivity's "best estimate" (e.g., 3°C) typically reflects the **mode of model ensembles** or **expert judgment**, not a decision rule.  
     - **Why include it?** Policymakers demand a focal point for cost-benefit analysis (e.g., carbon pricing). Omitting it invites external actors to impose their own (possibly biased) point estimates.  
     - Imprecise frameworks like **maximality** or **E-admissibility** *could* justify it if the best estimate is undominated in key decisions (e.g., mitigation investment), but IPCC doesn’t formalize this.  

  ### 3. **Two scales, two sources of imprecision?**  
     **Yes—and deliberately decoupled:**  
     - **Likelihood bands** → **Aleatory + limited epistemic precision** (uncertainty *within* a model/evidence base).  
     - **Confidence scale** → **Higher-order epistemic uncertainty** (reliability of evidence, expert discord).  
     This avoids conflation: e.g., a claim can be "likely" (66-100% probability) with "low confidence" (poor evidence/disagreement). A single "story" (e.g., hierarchical Bayesian meta-analysis) *could* unify both, but IPCC's approach better accommodates **incommensurable evidence types** (models, paleoclimate, theory).

  ### 4. **Sharp band endpoints: Does imprecision regress?**  
     **Yes—but it’s institutionally stabilized:**  
     - Saying "≥66% probability" for "likely" assumes the **lower bound** of the credal set clears 66%. This pushes imprecision to **band assignment** (is the *true* lower bound 66% or 65%?).  
     - **Why tolerate this?**  
       - **Operational necessity**: Discretization simplifies communication; policymakers ignore overly nuanced outputs.  
       - **Consensus tool**: Sharp thresholds force expert deliberation. If dissent persists, confidence is downgraded.  
       - **Regress is halted empirically**: Band endpoints (e.g., 66%, 90%) are **conventions**, not ontological claims. They’re stable because IPCC owns the definitions.  

  ### 5. **What would be lost with single-number reporting?**  
     **Critical nuances would collapse:**  
     - **False precision**: Single probabilities mask evidential weaknesses (e.g., claiming "70% probability" for sensitivity hides model discord).  
     - **Decision robustness**: A "likely range" allows decision-makers to test policies against *multiple* plausible probabilities (e.g., minimax regret).  
     - **Expert dissent**: Confidence flags when probabilities rest on shaky ground, even if models agree.  
     - **Communicative clarity**: "Very likely" (≥90%) triggers faster policy action than "87% probability" (studies show verbal terms better convey urgency).  

  ### Synthesis: IPCC as a "Robust Imprecise Bayesian"  
  The framework **presupposes** that climate uncertainties require:  
  - A **credal set** (represented by likelihood bands),  
  - With **second-order uncertainty** (confidence scale),  
  - And a **pragmatic point summary** for actionable input.  

  **What’s gained?** It balances **scientific honesty** (acknowledging imprecision) with **policy usability**. Switching to single numbers would obscure epistemic gaps and disagreement—precisely the contexts where imprecise probabilities matter most.  

  **Open challenge**: The sharp band regress *could* be mitigated by explicitly assigning confidence to band endpoints (e.g., "we are 80% confident that P≥0.66"), but this complicates messaging. Would love your take on whether nested imprecision could work here.
