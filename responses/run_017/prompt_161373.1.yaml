  Structure:

  1. Title: A Decision Tree for Classifying Warrants in Epistemology

  2. Instructions: Start with a concrete episode of coming to know something. Answer the questions in order. Follow the branches to find the type of warrant.

  3. The Tree:

     ```
     Start
     │
     ├── 1. Is what gets known an absence? 
     │   │
     │   ├── Yes → Non-apprehension (e.g., the jar isn't on the table)
     │   │
     │   └── No → 2. Does the warrant require the object of knowledge to be in direct contact with a sense organ?
     │       │
     │       ├── Yes → Perception (e.g., seeing a red apple)
     │       │
     │       └── No → 3. Does the step require a remembered exceptionless link between a sign and what it indicates?
     │           │
     │           ├── Yes → Inference (e.g., seeing smoke and inferring fire)
     │           │
     │           └── No → 4. Does it require positing an unobserved state of affairs to make an observed one intelligible?
     │               │
     │               ├── Yes → Postulation (e.g., Devadatta must eat at night)
     │               │
     │               └── No → 5. Does it turn on a remembered similarity used to identify an unfamiliar object?
     │                   │
     │                   ├── Yes → Comparison (e.g., identifying a gavaya by its similarity to a cow)
     │                   │
     │                   └── No → 6. Does it require understanding a sentence from a reliable source?
     │                       │
     │                       ├── Yes → Testimony (e.g., reading a blood-test result)
     │                       │
     │                       └── No → [Not a recognised warrant?]
     ```

     We avoid the last "No" by assuming every episode is one of the six.

