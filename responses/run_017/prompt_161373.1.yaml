answer: |-
  ### Decision Tree for Classifying Warrants in Epistemology  
  *For Comparative Epistemology Reading Group*

  **Instructions**: Start with a concrete episode of coming to know something. Answer each question in order. Follow the branches to classify the type of warrant. Use modern or classical examples to test the tree. (British English used throughout.)

  ---

  #### THE DECISION TREE  
  *Answer YES or NO to each question, starting from the top.*

  1. **Is what gets known an absence?**  
     - **YES** → **Non-apprehension** (e.g., noticing a jar *isn’t* on the table).  
     - **NO** → Proceed to Question 2.  

  2. **Does the warrant require the object itself to be in direct contact with a sense organ?**  
     - **YES** → **Perception** (e.g., seeing a red apple; reading the time off a phone *as raw visual data*).  
     - **NO** → Proceed to Question 3.  

  3. **Does the step require a remembered exceptionless link between a sign and what it indicates?**  
     - **YES** → **Inference** (e.g., seeing smoke on a hill and inferring fire; a smoke alarm waking you to infer fire).  
     - **NO** → Proceed to Question 4.  

  4. **Does it require positing an unobserved state of affairs to make an observed one intelligible?**  
     - **YES** → **Postulation** (e.g., Devadatta is fat and never eats by day, so he must eat at night).  
     - **NO** → Proceed to Question 5.  

  5. **Does it turn on a remembered similarity used to identify an unfamiliar object?**  
     - **YES** → **Comparison** (e.g., a forest officer identifies a gavaya-like animal by recalling its similarity to a cow).  
     - **NO** → Proceed to Question 6.  

  6. **Does it require understanding a sentence from someone (or something) taken to be reliable?**  
     - **YES** → **Testimony** (e.g., a blood-test result in a letter; an app saying it’s raining in Delhi; a satnav instruction you half understand).  
     - **NO** → *Unclassified* (not a recognised warrant in classical systems).  

  ---

  #### CLASSICAL AND MODERN EXAMPLES SORTED  
  - **Perception**: Seeing a jar on a table; reading the time off a phone *as direct sensory input*.  
  - **Inference**: Smoke on a hill → fire; smoke alarm → fire.  
  - **Comparison**: Forest officer identifies a gavaya by similarity to a cow.  
  - **Testimony**: Blood-test result in a letter; app reporting Delhi weather; satnav instruction.  
  - **Postulation**: Devadatta’s night-eating to explain his obesity.  
  - **Non-apprehension**: Noticing the jar *isn’t* on the table.  

  ---

  #### THE SPACE OF WARRANT TYPES  
  The tree sorts episodes into six classical Indian *pramāṇas* (warrants). Each corresponds to a unique combination of answers:  

  | **Warrant**         | **Q1 Absence?** | **Q2 Sense Contact?** | **Q3 Exceptionless Link?** | **Q4 Postulation?** | **Q5 Similarity?** | **Q6 Testimony?** |  
  |---------------------|----------------|----------------------|---------------------------|---------------------|-------------------|------------------|  
  | Non-apprehension    | YES            | –                    | –                         | –                   | –                 | –                |  
  | Perception          | NO             | YES                  | –                         | –                   | –                 | –                |  
  | Inference           | NO             | NO                   | YES                       | –                   | –                 | –                |  
  | Postulation         | NO             | NO                   | NO                        | YES                 | –                 | –                |  
  | Comparison          | NO             | NO                   | NO                        | NO                  | YES               | –                |  
  | Testimony           | NO             | NO                   | NO                        | NO                  | NO                | YES              |  

  **Unoccupied combinations**:  
  - 58 other combinations exist (6 questions = 64 total). Most are:  
    - **Incoherent**: e.g., `YES (Absence) + YES (Sense Contact)` – Absences can’t be sensed.  
    - **Unattractive**: e.g., `YES (Sense Contact) + YES (Exceptionless Link)` – Direct perception shouldn’t need inference.  
    - **Unexplored**: e.g., `NO to all` – No major school disputes the tree’s coverage.  

  ---

  #### SCHOOL POSITIONS MAPPED  
  - **Nyāya (four-fold)**: Accepts Perception, Inference, Comparison, Testimony. *Rejects* Postulation (reduced to Inference) and Non-apprehension (reduced to Perception/Inference).  
  - **Buddhism (two-fold)**: Accepts only Perception and Inference. *Reduces* Comparison, Testimony, Postulation, and Non-apprehension to these.  
  - **Six-fold systems (Mīmāṃsā, Vedānta)**: Accept all six warrants.  
  - **Perception-only (Yogācāra idealists)**: Only Perception is valid; all others reduced to it.  

  **Ambiguous pairs the tree *can* separate**:  
  - **Comparison vs. Testimony**: Tree distinguishes via **Q5 (Similarity)**.  
    - *Comparison*: Relies on *remembered similarity* (e.g., gavaya identified via cow-like features).  
    - *Testimony*: Relies on *understanding a reliable message* (e.g., app saying "rain in Delhi").  
  - **Inference vs. Postulation**: Tree distinguishes via **Q3 (Exceptionless Link)**.  
    - *Inference*: Requires a universal link (e.g., smoke → fire).  
    - *Postulation*: No universal link; posits hidden causes (e.g., Devadatta’s night-eating).  

  ---

  #### KEY WRINKLE: PRIOR KNOWLEDGE  
  Some schools (e.g., Buddhists) argue **Testimony** or **Comparison** cease to count as warrants *if you already knew the fact*. The tree **ignores prior knowledge** and classifies the *episode’s warrant type* regardless. For example:  
  - If you already knew Delhi was rainy, the *app’s message* still classifies as **Testimony**.  
  - This reflects Nyāya’s view that warrants are defined by their mechanism, not novelty.  

