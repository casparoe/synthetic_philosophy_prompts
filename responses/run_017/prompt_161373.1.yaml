     - Reading the time off a phone: Testimony (because the phone is a reliable source and you are reading a representation).
     - Smoke alarm waking you: Inference (because of the exceptionless link: alarm sounds → fire).
     - Blood-test result in a letter: Testimony.
     - App that says it's raining in Delhi: Testimony.
     - Satnav instruction: Testimony.

  5. The space of combinations and schools:

     The decision tree uses six specific combinations of answers (as above). The schools of Indian philosophy differ on which of these warrants they accept:

     - Nyāya (four-fold): Accepts perception, inference, comparison, testimony. They reduce postulation to inference and non-apprehension to inference or perception.
     - Buddhism (two-fold): Accepts only perception and inference. They reduce the others to these.
     - Six-fold (Mīmāṃsā and Vedānta): Accepts all six.

     The other combinations (for example, an episode that is an absence and also requires direct sense contact) are incoherent because an absence cannot be directly sensed. Similarly, an episode that is perception (direct sense) but also requires an exceptionless link is redundant because perception doesn't require inference. So these combinations are either incoherent or unattractive and hence unexplored.

