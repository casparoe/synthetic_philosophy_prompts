answer: |-
  Here is a preparation sheet structured for maximum defensive utility, prioritizing high-damage objections. The replies are designed for 2-minute answers, with tactical notes. Objections are ordered by *potential damage to your core thesis*, not likelihood.

  ---

  ### **Top 8 Objections & Replies**  
  *(Ordered by Descending Damage Potential)*  

  1. **The Quantum Empirical Objection** (Philosophers of Physics)  
      *Phrasing:* "You claim the failure of II is unobservable, but in QM, permutation symmetry *is* observable: it reduces phase space volume (solving Gibbs paradox), alters partition functions, and creates interference in scattering experiments (e.g., Hanbury Brown–Twiss). Isn’t this measuring the *failure* of discernibility?"  
      **Reply:** "Those effects measure the *consequences* of imposing permutation symmetry on our *descriptions*, not an observation of 'two identical things.' The formalism treats particles as indiscernible *by fiat* via symmetrization. But this doesn’t show we’ve detected a world where II fails—only that we’ve stipulated a model where it *must* hold. The 'failure' is built into the formalism’s axioms, not discovered empirically."  
      *Soft Spot:* Conflates *representational indistinguishability* with *metaphysical indiscernibility*.  
      **Verdict:** **Partially concede** that QM makes *indistinguishability* observable operationally, but **hold** that this doesn’t reveal a *failure of II in nature*—only in our models.  

  2. **The Supervenience Hole** (Metaphysicians)  
      *Phrasing:* "If symmetry *explains* II’s failure, but symmetric worlds still have two objects, doesn’t cardinality fail to supervene on qualitative facts? Your view seems to *entail* haecceitism."  
      **Reply:** "No—symmetry *is* a qualitative feature (a global property of the world). What it explains is *why* II fails *when* it does. Cardinality supervenes on qualitative structure *plus* symmetry: two objects exist, but their non-identity isn’t grounded in qualitative differences. This is anti-haecceitist: no 'bare identities.'"  
      *Soft Spot:* Hard to square with Lewisian recombination.  
      **Verdict:** **Hold**. This is a feature, not a bug: your thesis *reduces* II’s failure to qualitative symmetry.  

  3. **The Physicist’s Irrelevance** (Condensed Matter/AMO Physicists)  
      *Phrasing:* "If II’s failure is unobservable, why should physics care? We handle 'identical particles' via symmetrized states and occupation numbers. It’s a calculational tool—no metaphysics needed."  
      **Reply:** "Exactly! Physics *doesn’t* need II. My claim is that the *philosophical* effort to 'save' II by hunting for exotic discerners is pointless. Physics’ success without II shows the principle is idle."  
      *Soft Spot:* Risks making your paper irrelevant to physicists.  
      **Verdict:** **Concede partially**. Agree physics doesn’t need II, but argue this *supports* your view that II is expendable.  

  4. **The Indexical Escape Hatch** (Metaphysicians)  
      *Phrasing:* "In your embedded-observer corollary, if an observer *on the symmetry plane* points left/right, isn’t she discerning the spheres relationally (e.g., *left-of-me* vs. *right-of-me*)?"  
      **Reply:** "No—because 'left' and 'right' are indexical, not qualitative. Swap the spheres *and* the observer’s spatial orientation, and her testimony reverses. No qualitative fact distinguishes 'sphere A is left’ from ‘sphere B is left’—only her perspective."  
      *Soft Spot:* Assumes indexicals aren’t discerners. Lewisians may disagree.  
      **Verdict:** **Hold**. Indexicals aren’t objective discerners; they’re perspectival.  

  5. **The Generalized Symmetry Objection** (Philosophers of Physics)  
      *Phrasing:* "What about gauge symmetries? If a world has non-trivial gauge automorphisms, does II fail for *all* particles? That can’t be right—we discern electrons in distinct orbitals."  
      **Reply:** "Gauge symmetries preserve *physical* states but aren’t automorphisms of *observable* structure. My definition requires automorphisms that preserve *natural* properties/relations (those 'carving nature at its joints'). Gauge transformations don’t qualify."  
      *Soft Spot:* Loads weight on "natural properties."  
      **Verdict:** **Hold**. Clarify that only *physical* symmetries count.  

  6. **The ‘Fixed Point’ Loophole** (Graduate Students / Metaphysicians)  
      *Phrasing:* "In Black’s universe, if the spheres swap positions, isn’t the symmetry plane itself a ‘fixed point’ that discerns them (e.g., each sphere is at distance *d* from the plane)?"  
      **Reply:** "No—the plane isn’t an object. Distance-to-the-plane is a monadic property, but it’s identical for both spheres. Only relations to *other objects* could break symmetry, and there are none."  
      *Soft Spot:* Implicitly assumes spacetime points aren’t "objects."  
      **Verdict:** **Hold**. The plane is a spacetime region, not a discerner.  

  7. **The Quantum Entanglement Challenge** (Philosophers of Physics)  
      *Phrasing:* "In entangled states (e.g., two electrons with opposite spin), particles are weakly discernible by relations (*same-spin-direction-as* fails). Doesn’t this break your symmetry requirement?"  
      **Reply:** "Entanglement adds qualitative structure! The spin correlation breaks the symmetry—there’s no automorphism swapping the particles while preserving all relations (e.g., swapping would require also swapping spins, but spins are properties). So II holds here."  
      *Soft Spot:* Only works if spin is intrinsic. If spin is relational, symmetry may hold.  
      **Verdict:** **Hold**. Entanglement discerns via relations, saving II—consistent with your view.  

  8. **The Modal Collapse** (Metaphysicians)  
      *Phrasing:* "If symmetric worlds refute II, but symmetry is contingent, does II hold necessarily? If not, how can we talk about ‘possible worlds’ where II fails without smuggling in haecceitism?"  
      **Reply:** "II’s failure is contingent and symmetry-dependent. We *can* conceive of symmetric worlds without haecceities—by describing their structure *sans* individual labels (e.g., ‘two spheres 10m apart’)."  
      *Soft Spot:* Pushes against Lewisian modal realism.  
      **Verdict:** **Concede partially**. II isn’t necessary, but deny this requires haecceitism.  

  ---

  ### **Strategic Concessions (First 2 Slides)**  
  Preempt these to deny opponents easy wins:  
  1. **Concede:** Not all symmetric worlds are counterexamples (defend *fixed-point corollary*: automorphism must swap *only* the spheres).  
  2. **Concede:** II might hold in *our* world (thanks to asymmetric observers/structures). Your target is the *principle’s metaphysical status*, not its empirical truth.  

  ---

  ### **The Make-or-Break Reply**  
  **The Quantum Empirical Objection** (#1) must land. If the audience accepts that permutation symmetry’s empirical effects (e.g., suppressed states in Bose gases) constitute "observing II’s failure," your payoff claim collapses. Emphasize:  
  > *"QM’s formalism **stipulates** indistinguishability; it doesn’t **detect** it. The interference terms are artifacts of how we model identical particles—not measurements of metaphysical indiscernibility."*  

  ---

  ### **The Prayer-Nobody-Asks Question**  
  **Your suspicion is correct.** The quantum empirical objection (#1) is the most damaging. But a close second is this from metaphysicians:  
  > *"If II fails only in symmetric worlds, but symmetry requires duplicate objects, doesn’t this presuppose primitive identity—making your account circular?"*  
  **Why it’s worse than you fear:** It attacks your *definition* of symmetry (which assumes objects can be "swapped"), potentially reducing your view to "II fails when there are duplicates," which is tautological.  
  **Reply:** "Symmetry is defined at the level of *structure*, not objects. The automorphism acts on the domain, but its existence is a global fact—not presupposing individuality."  
  **Verdict:** **Hold**, but this is a metaphysical grenade.  

  ---

  ### **Final Assessment**  
  - **Quantum objection (#1)** is indeed the *most dangerous*—it directly undermines your unobservability thesis with concrete physics. The metaphysicians’ circularity challenge cuts deep but is more abstract; in a mixed seminar, empirical concerns will resonate louder.  
  - **Tactical Tip:** When physicists raise #1, pivot to **"This shows why physics doesn’t need II!"** (objection #3). Concede the *practical* point to save the *metaphysical* one.
