prompt: |-
  I am in the upper sixth at a large comprehensive in the Midlands, and this year I chair the school's Heritage Committee. We are five sixth-formers, the head of history, and the volunteer parent who keeps the archive one afternoon a week, and we are responsible for what the school publicly says about its own past: the founders' day address, the display boards in the main corridor, the names on two of the houses, the war memorial in the chapel, and the short historical note that goes out to alumni each summer.

  Our difficulty is that we are repeatedly asked to decide what to do when what the school remembers and what the written record supports come apart. We get eight to twelve such proposals a year, from pupils, staff, alumni and occasionally from people in the village with no connection to the school at all. At the moment we decide each one from scratch; last term we agreed to one proposal and refused another that most of us now think was relevantly the same, and the head of history has quite properly asked what rule we believe ourselves to be following. I would like to be able to show her one.

  So what I am asking for is a decision procedure we can actually run, not a set of principles. Concretely: an ordered series of questions to take a proposal through; what would count as a sufficient answer to each; the point at which the procedure stops with a decision to leave things as they are; the point at which it hands the matter to a named person because the question has stopped being about evidence and become one of values; and the point at which it says that we cannot settle this with what we have, sends the question to research, and adopts a stated interim posture meanwhile. I also want the menu of possible dispositions spelled out, because at present we behave as though the only options are to keep a thing or take it down, and I suspect the useful answers are mostly in between: annotate, relocate, add a second marker, keep the name but retire the practice, suspend an assertion pending research, publish the disagreement rather than resolving it.

  Three half-formed distinctions are doing the work in our discussions at the moment, and I would rather you keep, correct or discard them than work around them. First, we separate memories that are load-bearing from ones that are decorative: a memory is load-bearing, in our usage, if present relationships, promises, reparations or settlements rest on it, and decorative if it is simply part of the backdrop. Second, we ask whether a correction is a substitution or a vacancy — whether a true claim can be put into the same social slot the false one occupied, or whether the correction empties the slot altogether, as replacing a benefactor with a profiteer does. Third, we ask how close the memory-bearers are to the events: participants, heirs who inherited the memory in a continuous chain, or adopters with no connection who took it up later. Please tell me which of these, if any, is doing real work and which is decoration, and if you drop one, say what it was screening for. I would rather have three distinctions that earn their place than five that sound good in minutes.

  The procedure has to be usable by people with no training, in a forty-minute meeting, with the documents in front of them, and it has to produce reasons in writing that the deputy head (pastoral) is willing to sign; anything touching a name on a building also goes to the governors. We have no budget for research beyond about one day of the archivist's time a half-term. Please keep the procedure itself to something that would fit on two sides of A4 and put the worked applications separately.

  The hard cases I need it to sort are these: where the record is silent rather than contradictory, because silence in an archive is often just a record of what someone once thought worth writing down; where two communities remember the same episode differently and the record supports only one of them; where the people whose memory it is are outside the school and we are, in effect, adjudicating someone else's past; and where the memory is not a claim about the past at all but is being used to justify a present arrangement.

  Please then run the procedure on three live proposals.

  (i) Our founders' day address describes Alderman Kell, who funded the school's rescue in 1892, as our founder and benefactor, and the Kell Hall and a still-awarded scholarship carry his name. A postgraduate historian at the nearby university has shared draft findings with us, on condition that we do not publish them yet: the rescue was organised and largely financed by a subscribers' committee, and a substantial part of Kell's fortune came from compensation paid at abolition for enslaved people and from freight contracts carrying indentured labour. The pupil petition asks us to stop calling him our saviour in the address and to put up a panel saying what the money was.

  (ii) One name on the 1921 memorial is that of H. Braithwaite. Service records show he was invalided out with tuberculosis in 1917 and died at home in 1918; the then headmaster's correspondence survives, including the letter from his mother asking that he be counted among our fallen and his reply agreeing to it as a kindness. His great-granddaughter is in Year 12 and reads the lesson at the memorial service; his grave in the village churchyard is still tended by the family. The proposal is to remove the name or footnote it on the board.

  (iii) Nine surviving members of the first girls' intake in 1976 say they were barred from the school's academic prize and directed to a separate competition. The prize lists in the archive begin in 1979 and show no such competition, and the headmaster's log for 1976–78 is missing; there is one undated, uncaptioned photograph of what appears to be a different cup being presented. They would like the school to say that this happened.

  I would rather be told the uncomfortable answer than the comfortable one, so please tell me plainly which of the three the procedure resolves in a way I will find hardest to defend to the rest of the committee, and say plainly at the points where the procedure is trading accuracy for something else — protecting a relationship, honouring an old promise, keeping terms on which two groups have agreed to live together — because if that is what we are doing, our reasons should say so rather than dress it up as evidence. Finally, tell me what the procedure cannot do, and where you would expect it to misfire systematically: I am especially worried about cases where the archive was produced by the same people and the same power that produced the memory, and cases where the disagreement is really about what the facts mean rather than what they are. Please write throughout in British English, as the minutes go into the school's record as they stand.
reasoning: |-
  Hmm, this is a sophisticated request from a student chairing a school heritage committee. They need a practical decision-making framework for handling historical disputes where memory conflicts with documentation. The user clearly understands the complexities - they've identified key pain points in their current process and want something actionable, not theoretical.

  The user has outlined three existing distinctions they use: load-bearing vs decorative memories, substitution vs vacancy corrections, and proximity of memory-bearers to events. These show they're already thinking structurally about memory function. I should evaluate whether these are valid categories or if they're masking deeper issues.

  Key constraints stand out: no research budget beyond occasional archivist time, must produce defendable written reasons, and needs to handle specific hard cases involving archival silence, contested memories, external stakeholders, and present-day justifications. The examples given (Kell, Braithwaite, girls' prize) are perfect test cases that cover different types of disputes.

  For the procedure itself, I'll design a step-by-step flowchart that:
  - Starts with evidence assessment
  - Then considers memory function
  - Moves to impact analysis
  - Offers multiple dispositions beyond simple keep/remove
  - Has clear off-ramps for value judgments or research needs
  - Fits on two A4 pages as requested

  The three distinctions they mentioned can be integrated but need refinement:
  - "Load-bearing" is useful but should be expanded to include institutional obligations
  - "Substitution/vacancy" works but requires clearer definition of what constitutes a "social slot"
  - Proximity matters but needs weighting - contemporary witnesses vs later adopters

  For the hard cases, the Braithwaite one will likely be toughest to defend - it pits documented facts against longstanding emotional commitments. The procedure will surface that we're choosing compassion over accuracy here, which must be explicitly stated in the reasons.

  Major limitations to flag:
  - Can't resolve meaning-of-facts disputes (only fact-establishment)
  - Vulnerable when archives reflect power imbalances
  - Struggles with "negative space" where absence of evidence isn't evidence of absence
  - May misfire when contemporary witnesses are unavailable

  The tone must remain professional but accessible - this will become official school policy. British English throughout, with clear ministerial phrasing for deputy head's sign-off. Worked examples should show how the sausage is made, warts and all.
answer: |-
  Here is a decision procedure designed for your Heritage Committee, meeting your requirements for practicality, transparency, and ethical clarity. The procedure fits on two A4 pages (see below), with worked applications following separately. It retains and refines your distinctions where useful, discards one, and adds necessary steps for defensibility.

  ---

  **HERITAGE COMMITTEE DECISION PROCEDURE**  
  *(To be applied in sequence for each proposal)*  

  **Step 1: Establish the Claim**  
  *Question:* What specific assertion about the past is being challenged or proposed?  
  *Sufficient Answer:* A clear, written statement of the disputed claim and the proposed change.  
  *Stop/Handoff:* If unclear, return to proposer for refinement.  

  **Step 2: Evidence Assessment**  
  *Question:* Does the **written archive** directly support, contradict, or omit the claim?  
  *Sufficient Answer:*  
  - **Support/Contradict:** Archival documents explicitly affirm or refute the claim.  
  - **Omission:** No relevant documents exist (note: silence ≠ contradiction).  
  *Handoff:* If archival gap is critical, proceed to **Step 4** (Research).  
  *Interim Posture:* If claim is challenged but archive silent, **suspend assertion** pending research.  

  **Step 3: Memory-Bearer Proximity**  
  *(Retained & refined: Focuses on authority of memory, not just proximity)*  
  *Question:* Who holds this memory, and what is their relationship to the event?  
  *Categories:*  
  - **Participants:** Direct witnesses (strongest weight).  
  - **Heirs:** Those inheriting memory via continuous chain (e.g., family, long-serving staff).  
  - **Adopters:** Those with no direct link who adopted the memory later (weakest weight).  
  *Sufficient Answer:* Categorisation of source(s) of the memory.  
  *Note:* Conflicting memories from same-tier sources trigger **Step 6** (Values).  

  **Step 4: Research Requirement**  
  *Question:* Can the claim be resolved within 1 day of archivist time?  
  *Sufficient Answer:* Yes/No, with specific research goals stated.  
  *Handoff:* If "No" or research exceeds capacity, **adopt interim posture**:  
  - **Suspend assertion** (if claim is active).  
  - **Publish disagreement** (if claim is foundational).  
  *Send to Research:* Archivist investigates specific goals. Re-enter procedure at **Step 2** with findings.  

  **Step 5: Function of Memory**  
  *(Retained & refined: "Load-bearing" vs. "Decorative")*  
  *Question:* Is this memory **load-bearing** (supports active promises, relationships, reparations, legal titles) or **decorative** (informative, celebratory, with no active obligations)?  
  *Sufficient Answer:*  
  - **Load-bearing:** Removal/modification risks breaking commitments (e.g., named scholarships, gravesites).  
  - **Decorative:** Serves historical interest only; no active obligations depend on it.  
  *Handoff:* If load-bearing, proceed to **Step 6** (Values).  

  **Step 6: Values & Impact**  
  *(Handoff Point - To Deputy Head (Pastoral) or Governors)*  
  *Question:* Does the evidence-based resolution conflict with core values (e.g., compassion, dignity, justice) or risk significant harm?  
  *Triggers:*  
  - Load-bearing memory requires change.  
  - Contradictory evidence exists but removal/modification harms living persons.  
  - Adjudicating external community memories.  
  *Handoff:* To Deputy Head (Pastoral) for pastoral impact, Governors for legal/fiduciary issues. Committee provides evidence summary.  

  **Step 7: Determine Disposition**  
  *Menu of Options (apply as needed):*  
  1. **Retain Unchanged:** Evidence supports claim; no significant harm.  
  2. **Annotate:** Add context (plaque, footnote, panel) correcting/contextualising.  
  3. **Relocate:** Move item to educational/archival setting (e.g., museum).  
  4. **Retire Practice:** Keep name/symbol but cease active commemoration (e.g., stop award).  
  5. **Remove:** Evidence disproves claim AND it’s decorative/offensive.  
  6. **Suspend Assertion:** Stop using claim pending research (e.g., omit from speech).  
  7. **Publish Disagreement:** Present conflicting evidence publicly (e.g., display both accounts).  
  *Decision Rule:*  
  - Evidence + Function + Impact determine disposition (see flowchart).  
  - Default: Prefer **annotation/context** over removal where feasible.  

  **Step 8: Document Reasons**  
  *Write:*  
  1. Claim & proposal.  
  2. Evidence assessment outcome.  
  3. Memory-bearer categorisation.  
  4. Load-bearing/decorative determination.  
  5. Chosen disposition + explicit justification (e.g., "Accuracy requires annotation"; "Compassion overrides contradiction for grave honour").  
  6. Any handoffs/interim steps.  

  ---

  **Refinements to Your Distinctions:**  
  - **Load-bearing vs. Decorative:** Retained and essential. Screens for when "truth" may conflict with active obligations.  
  - **Substitution vs. Vacancy:** **DISCARDED.** Social "slots" are too vague; focus on *function* (Step 5) and use dispositions (e.g., annotation avoids vacancy). It screened for reputational damage risk – now covered under **Impact (Step 6)**.  
  - **Memory-Bearer Proximity:** Retained but prioritised lower than evidence. Separates lived memory from adopted tradition.  

  ---

  **Worked Applications**  

  **(i) Alderman Kell (Founder/Benefactor)**  
  1. **Claim:** "Kell was sole saviour/founder; money untainted." Proposal: Stop "saviour" label; add context panel.  
  2. **Evidence:** Archive **silent** on funding sources; draft research **contradicts** sole role, links to slavery/indenture. → *Sufficient: Contradiction; archive gap noted.*  
  3. **Memory-Bearers:** Adopters (school tradition). Weak weight.  
  4. **Research:** Needed on committee role/finances (1-day feasible?). → *Interim: Suspend "sole saviour" assertion in address.*  
  5. **Function:** **Load-bearing** (scholarship, building name imply obligation).  
  6. **Values/Impact:** Truth vs. reputational harm/donor relations. → *Handoff to Governors (touches building name).*  
  7. **Disposition (Committee Rec):** **Annotate** (panel on funding/complexity); **retire practice** of "saviour" rhetoric; **keep name** (load-bearing obligation).  
  8. **Reasons:** Evidence contradicts sole role, archive silent on money source. Load-bearing name retained due to ongoing obligation. Rhetoric retired and context added for accuracy.  

  **(ii) H. Braithwaite (War Memorial)**  
  1. **Claim:** "Braithwaite died in service." Proposal: Remove name or footnote.  
  2. **Evidence:** Service records **contradict** (died post-discharge); Head's letter **supports** inclusion as kindness. → *Sufficient: Contradiction.*  
  3. **Memory-Bearers:** **Heirs** (family, great-granddaughter) + **Participants** (Headmaster's decision). Strong weight.  
  4. **Research:** None needed; evidence clear.  
  5. **Function:** **Load-bearing** (grave tending, family honour, annual ceremony).  
  6. **Values/Impact:** Accuracy vs. compassion for family/grief. → *Handoff to Deputy Head (Pastoral) for impact assessment.*  
  7. **Disposition (Committee Rec):** **Annotate** (small footnote: "Died of illness post-discharge, commemorated at family request"). **DO NOT REMOVE.**  
  8. **Reasons:** Evidence contradicts combat death, but removal harms heirs/participants. Annotation balances accuracy with compassion for load-bearing memory.  

  **(iii) Girls' Academic Prize (1976)**  
  1. **Claim:** "No separate prize for girls." Proposal: School to acknowledge discrimination occurred.  
  2. **Evidence:** Archive **silent** (no prize lists/logs); photo ambiguous; oral history **supports** claim. → *Sufficient: Omission.*  
  3. **Memory-Bearers:** **Participants** (surviving members). Strongest weight.  
  4. **Research:** Feasible? Trace staff/alumni; scrutinise photo. → *Interim: Publish disagreement.*  
  5. **Function:** **Decorative** (no ongoing obligation; historical truth-seeking).  
  6. **Values/Impact:** Justice for participants vs. potential reputational risk. No handoff needed.  
  7. **Disposition:** **Publish disagreement** (e.g., display: "Alumni recall a separate girls' prize 1976-78; archive records begin in 1979").  
  8. **Reasons:** Archive silent, but participant testimony credible. Disposition honours witnesses while inviting further evidence.  

  ---

  **Hardest to Defend:** **Braithwaite annotation.** Some committee members may argue the memorial is factually incorrect and should be altered. The procedure prioritises compassion for heirs (load-bearing) over strict accuracy, which may feel like a moral compromise. **Be explicit:** "We are choosing compassion for the family and respect for a past pastoral commitment over strict adherence to military service criteria."  

  **Limitations of the Procedure:**  
  1. **Power-Imbalanced Archives:** Fails when archives reflect only the powerful (e.g., missing girls' records). Mitigation: Prioritise participant testimony in gaps.  
  2. **Disputes About Meaning:** Cannot resolve "Was Kell evil?" or "Was the prize sexist?" – only "Did X happen?". Off-ramp to **Step 6** if meaning drives dispute.  
  3. **Silent Archives:** Risks over-reliance on memory when silence ≠ falsehood. Mitigation: **Suspend/Publish Disagreement** interim steps.  
  4. **Systematic Misfires:**  
     - May undervalue **adopter** memories (e.g., village traditions).  
     - **Load-bearing** test may perpetuate past injustices (e.g., keeping offensive names due to "obligations"). Counter: Explicitly state trade-offs in reasons.  

  ---

  This procedure provides clear, auditable steps, forces explicit trade-off declarations, and fits your operational constraints. It treats your distinctions seriously while ensuring evidence is foundational and values decisions are transparently handed off. Use the worked examples as templates for minute-writing.
