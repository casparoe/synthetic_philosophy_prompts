answer: |-
  ### Decision Procedure for Conditional Risk Updates  
  **Steps to execute per message (8 steps max; complete in 15 minutes):**  

  1. **Parse the conditional**  
     - *Ask:* "What is the antecedent (A) and consequent (C)?"  
     - *Sufficient answer:* Clear A and C (e.g., A: "levee breached upstream," C: "gauge reads >3m").  
     - *If unclear:* Log and flag to director (Step 8).  

  2. **Classify the consequent**  
     - *Ask:* "Is C about (a) the world, (b) our observation/alert, or (c) an action we take?"  
     - *Sufficient answer:*  
       - (a) World state (e.g., "embankment overtops").  
       - (b) Observation/alert (e.g., "gauge reads X").  
       - (c) Directive (e.g., "issue flood warning").  
     - *If (c):* Go to Step 7.  

  3. **Check for alert-policy origin**  
     - *Ask:* "Is this message from an automated system with fixed alert rules?"  
     - *Sufficient answer:* Yes/no.  
     - *If yes:* Go to Step 8 (refuse update). *Theory reason:* Absence of future alerts becomes evidence—requires modeling policy reliability.  

  4. **Handle hedged probabilities**  
     - *Ask:* "Is C hedged (e.g., ‘real chance’)? If so, what probability (p)?"  
     - *Sufficient answer:* Numeric p (e.g., 0.3 for "real chance").  
     - *If no p:* Log without updating; escalate to director (Step 8). *Office convention:* Protects against ambiguous inputs.  

  5. **Judy Benjamin check (critical)**  
     - *Ask:* "Is A disjunctive (e.g., ‘anywhere upstream’)? And is C about observation (b)?"  
     - *Sufficient answer:* Yes/no.  
     - *If yes:* Refuse naive update. *Theory reason:* Conditioning on material conditional \(A \supset C\) over-constraints probabilities when A is a disjunction (e.g., ignores *which* upstream breach occurs). Requires similarity metric—unavailable here. Go to Step 8.  

  6. **Update probabilities (non-Judy cases only)**  
     - *Inputs:* Atomic A (not disjunctive), p from Step 4 (default p=1 if unhedged).  
     - *Action:* Revise probabilities using Jeffrey conditionalization:  
       - Compute current probability of A: \(P_{\text{old}}(A)\).  
       - For spreadsheet rows where A is true:  
         - Multiply C-true rows by \(p / P_{\text{old}}(C \mid A)\).  
         - Multiply C-false rows by \((1-p) / P_{\text{old}}(\neg C \mid A)\).  
       - Renormalize all rows.  
     - *If partition lacks A/C granularity:* Go to Step 8.  

  7. **Handle directives (type c)**  
     - *Action:* Log directive in ops manual as "If A, then do C." **Do not update probabilities.**  

  8. **Log and escalate**  
     - *Action:* Log message without spreadsheet update. Flag to director for modeling decisions.  
     - *Applies when:*  
       - Hedge without p (Step 4),  
       - Judy Benjamin case (Step 5),  
       - Alert-policy message (Step 3),  
       - Partition insufficient (Step 6).  

  ### Message-Type Handling Table  
  | Condition                     | Action                     | Reason                          |  
  |-------------------------------|----------------------------|---------------------------------|  
  | Directive (type c)            | Log in ops manual          | Not a probability update.       |  
  | Hedged without p              | Escalate (Step 8)          | Ambiguity. Office convention.   |  
  | Alert-policy message          | Refuse update (Step 8)     | Absence is evidence; theory.    |  
  | Judy Benjamin case            | Refuse update (Step 8)     | Partition limitation; theory.   |  
  | Atomic A, p available         | Update (Step 6)            | Standard Jeffrey conditioning. |  

  ---

  ### Worked Examples  
  **1. Marsh Road Gauge**  
  - *Message:* "If the levee is breached anywhere upstream, the gauge at Marsh Road will read over three metres."  
  - **Steps:**  
    1. A: "levee breached anywhere upstream" (disjunctive). C: "gauge reads >3m" (observation, type b).  
    2. Consequent type (b).  
    3. Not alert-policy.  
    5. **Judy Benjamin case:** A is disjunctive ("anywhere upstream") and C is observational. **Refuse update.** Log and escalate (Step 8).  
  - *Why refusal:* Naive conditioning would incorrectly assume uniform likelihood across breach locations.  

  **2. Hedged Rainfall**  
  - *Message:* "If winter rainfall >90th percentile, there’s a real chance the embankment overtops."  
  - **Steps:**  
    1. A: "rainfall >90th percentile." C: "embankment overtops" (world, type a).  
    2. Type (a).  
    4. Hedged ("real chance")—no p. Ask expert. **If no p provided: Log and escalate (Step 8).**  
  - *Outcome:* Without p, no update. Director must decide whether to estimate p or ignore.  

  **3. Alert-Policy Message (Your Annoyance Case)**  
  - *Message:* "If pumping station loses power, the system sends an alert within 5 minutes."  
  - **Steps:**  
    1. A: "pumping station loses power." C: "system sends alert" (observation, type b).  
    2. Type (b).  
    3. **Alert-policy message:** Automated system. **Refuse update (Step 8).**  
  - *Why refusal:* Future non-alerts must revise P(A), but modeling requires P(alert | system failure). Currently, you might treat this as P(alert | A) = 1—procedure blocks this oversimplification.  

  ---

  ### What the Procedure Cannot Do  
  - **Handle similarity metrics:** Judy Benjamin cases with disjunctive A require spatial/temporal similarity (unavailable).  
  - **Infer absent alerts:** Alert policies need full reliability models (e.g., false-negative rates).  
  - **Resolve ambiguities:** Hedges without expert input or underspecified partitions halt updates.  
  - **Dynamic partitions:** Requires manual adjustments by the director.  

  **Defense Notes:** Steps 5 (Judy Benjamin) and 3 (alert-policy) are theory-forced. Steps 4 (hedges) and 8 (escalation) are office conventions—adjust these quietly if needed.
