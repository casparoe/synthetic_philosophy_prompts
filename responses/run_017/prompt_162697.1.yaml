  Looking at Move 1: Nadia makes three points about why generations aren't real. Her boundary argument has merit - the arbitrary birth year cuts do suggest human stipulation rather than discovery. Her critique of the age-period-cohort problem is technically correct about decomposition challenges. But her within-group variance point oversimplifies - high variance doesn't automatically negate kindhood. Overall she's mostly right here.

  Move 2: Elliot counters with valid points about vague boundaries not refuting kindhood (species, mountains etc.) and makes a strong case for cohort causal powers via life-stage timing. His discontinuity evidence is particularly compelling for fine-grained effects. He's mostly right in this move, though he hasn't yet addressed the "kind" versus "label" distinction.

  In Move 3, Nadia concedes causal powers but argues they don't establish kind status. This is an important distinction - hurricanes have causal powers but aren't natural kinds. Her point about induction failures hits at the core issue. She's mostly right here, though underplays how some cohort effects might support limited counterfactuals.

  Move 4 features Elliot's looping argument - that labels become real through social feedback. This is perceptive about social construction but risks conflating institutional reality with natural kind status. His point is mostly right about social mechanisms but overclaims regarding kindhood.

  For Move 5, Nadia's diagnostic about update rules is brilliant - the fixed-roster vs fixed-anchor dilemma exposes fundamental incoherence. This strongly suggests projected rather than discovered categories. She's clearly right here.

