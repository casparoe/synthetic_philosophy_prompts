  - **Non-derivable variant**: If we changed Rule 4 to `LR → L` (instead of `F`), we could prove `R` is *not* derivable via an invariant (e.g., no string can have more `R`s than `L`s modulo contraction), showing how small tweaks alter "jump out" needs.  

