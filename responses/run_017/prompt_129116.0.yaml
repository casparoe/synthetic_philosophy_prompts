prompt: |-
  Hey — I'm a backend engineer (Go, Postgres, the usual) with basically no philosophy background, and a friend who's really into the effective altruism stuff sent me a blog post by an ex-finance guy that I can't tell is fair or not. It's about that importance / tractability / neglectedness thing: you're supposed to score each cause on how much value is at stake, how much of the problem gets solved per extra dollar or hour, and how few resources are already going into it, then go where the product is biggest. The post is mostly praise-by-sarcasm, and the bit I want checked runs roughly like this: the framework says to multiply the three scores and pick the winner, where importance just means how many people a problem touches and neglectedness just means how unpopular the cause is; because it's a product, a cause scoring near zero on any one factor is automatically worthless, which is why the framework keeps spitting out obscure answers like lead paint remediation in low-income countries or pandemic prep instead of cancer research that everyone already agrees matters; and since all three numbers are basically made up, the whole thing is quantification bias dressed up as math, so a sensible person should stick to causes with broad support and visible feedback loops. I've got a couple of hunches — my gut says it's really about the value of your next marginal dollar or hour rather than about ranking whole causes against each other, and that the post keeps sliding between those two readings — but I don't trust myself to say where the fair parts stop and the spin starts.

  Second thing I want thrown in, from my own job: a lot of our highest-leverage work doesn't itself produce anything. Observability, paying down tech debt, running experiments that mostly just tell us which of the other bets to make. Is there a slot for that in the framework — the value of shrinking your uncertainty, or of making every later hour more effective — or does a straight application of the three factors systematically underrate it? Same question for work whose gains quietly get undone over time: antibiotic resistance, a regulation that gets repealed, a deployed model that drifts. I've started calling it the decay factor and tacking it on as a fourth multiplier, and my friend says that's just tractability in disguise.

  So: can you go through that summary and tell me which parts a defender of the framework would happily accept, which are subtly wrong in a way that actually matters, and whether the post's conclusions survive once the wrong bits are fixed? And if my decay factor is already hiding inside one of the three, say which one and why — if it genuinely isn't, say what that tells us about the framework. Please don't send me links or reading lists, I've got enough tabs open already.
reasoning: |-
  We are addressing two main issues:

   1. Critiques of the ITN framework (Importance, Tractability, Neglectedness) as described in the blog post.
   2. How the framework handles "meta-work" (like observability, reducing uncertainty) and work with gains that decay over time (like antibiotic resistance).

   Let's break down the blog post's critique and then address the additional questions.

   ## Part 1: The Critique of ITN

   The blog post makes several claims:

   A. The framework multiplies three scores (I, T, N) and picks the cause with the highest product.
   B. Importance is defined as the number of people the problem touches.
   C. Neglectedness is defined as how unpopular the cause is (i.e., few resources).
   D. Because it's a product, a cause scoring near zero on any factor is automatically worthless, leading to obscure recommendations.
   E. The numbers are made up, so it's quantification bias.

   Let's evaluate each from the perspective of a defender of the framework:

   ### A. Multiplication and the product
     - **Defender's view**: The multiplication is a heuristic to capture the idea that all three factors matter. It is not meant to be a precise mathematical formula but a way to compare causes. The framework does not require exact numbers; it can be used with rough estimates or even qualitatively. The multiplication model is chosen because it reflects that a cause cannot be outstanding if it is completely intractable (T=0) or if it is already saturated with resources (N=0). The "obscure" answers (like lead paint remediation) might be exactly the point: the framework is designed to find undervalued opportunities.

   ### B. Importance definition
     - **Defender's view**: Importance is not solely about the number of people. It is about the scale of the problem, which includes both the number of people affected and the magnitude of the effect per person. For example, a problem that affects fewer people but with catastrophic consequences per person (like a deadly pandemic) can be very important. The blog post oversimplifies.

   ### C. Neglectedness definition
     - **Defender's view**: Neglectedness is indeed about how few resources are going into the cause relative to the scale of the problem. It's not just "unpopular" in a social sense, but about the marginal impact of additional resources. If a cause is already well-funded, adding more money might have diminishing returns, hence lower neglectedness.

   ### D. The zero factor and obscure causes
     - **Defender's view**: The framework is designed to find high-impact opportunities that are overlooked. The fact that it highlights causes that are not mainstream (like pandemic prep before COVID-19) is a feature, not a bug. The multiplication does mean that if a cause is completely intractable (T=0) or has zero importance (I=0) then it's not worth pursuing, which is correct. But note that in practice, we don't assign zero unless there is no chance of impact. The framework does not say that cancer research is unimportant; it might say that at the margin, extra resources in cancer research (which is well-funded) might have less impact than in a neglected area with high importance and tractability.

   ### E. Made-up numbers and quantification bias
     - **Defender's view**: The framework doesn't require precise numbers. It can be used with rough estimates and qualitative reasoning. The point is to structure thinking and avoid biases (like only following popular causes). The critique of "quantification bias" is valid if the numbers are presented as more certain than they are, but the framework itself encourages acknowledging uncertainty.

   ## Part 2: Addressing the Additional Questions

   ### 1. The framework and marginal analysis
     - The blog post slides between evaluating whole causes and marginal impact. The defender would clarify: the framework is explicitly about the marginal impact of additional resources (dollars or hours). It's not about the absolute value of a cause but about where the next unit of resource will do the most good. This explains why a cause that is important but already well-funded (like cancer research) might not be the best marginal opportunity.

   ### 2. Meta-work (observability, tech debt, experiments)
     - The framework can accommodate this by recognizing that such work improves the tractability of other projects. For example:
          - Reducing tech debt might make future development more efficient, thus increasing the tractability of future projects.
          - Experiments that reduce uncertainty can be seen as increasing the expected value of future work by allowing better allocation of resources.
     - How to fit in ITN?
          - **Tractability**: One could argue that meta-work directly improves tractability (T) of a set of projects. However, note that the framework is often applied to a specific cause area. If we are evaluating the cause area of "improving software development efficiency", then the meta-work is part of that cause. But if we are looking at a specific project (like building a feature) and we are considering spending time on observability, then we are within that project and the framework might not be applied at that level.

     - **Defender's adaptation**: The framework is flexible enough to be applied at different levels of abstraction. We can consider a "meta-cause" such as "improving the effectiveness of all future work in cause X". Then:
          - Importance: If cause X is important, then improving the effectiveness of work in X is important (proportional to the scale of X).
          - Tractability: How easy is it to improve effectiveness? (e.g., setting up observability might be very tractable).
          - Neglectedness: How much is already invested in making work in X more effective? (Maybe not much, so high neglectedness).

     - Alternatively, one might consider that the value of reducing uncertainty or improving efficiency is captured by increasing the expected value of the future work (thus increasing the importance of the cause) or by making the cause more tractable. However, the framework as stated does not explicitly account for the time dynamics and cross-cause effects.

     - **Conclusion**: A straight application of the three factors might underrate meta-work if we don't adjust the scope of the cause area. But the framework can be applied to the meta-cause itself.

   ### 3. Decay factor (antibiotic resistance, model drift, etc.)
     - The blog post's friend says that decay is already captured in tractability. Let's see:
          - Tractability (T) is about how much progress we can make per unit resource. If a problem has a high decay rate (e.g., antibiotic resistance increases as we use antibiotics, so our interventions get undone), then the same amount of resource might be needed just to maintain the status quo. This would reduce the net progress per resource, hence reducing tractability.

     - Alternatively, we might think of decay as reducing the importance over time? Not exactly. The importance (the scale of the problem) might even increase due to decay (if we don't intervene, the problem gets worse). But the decay affects the sustainability of the impact.

     - **Defender's view**: The framework does not explicitly account for decay, but it can be incorporated into tractability. Why? Because if an intervention's effect decays, then the same problem will require more resources to solve (or to maintain a solution). Thus, the effectiveness per resource (tractability) is reduced. Alternatively, we might break down tractability into two parts: the initial progress per resource and the decay rate. Then the net tractability would be the initial progress minus the decay (adjusted for time). This is a refinement of tractability.

     - However, note that sometimes decay is not in tractability but in the sustainability of the impact. If the decay is very high, it might make the cause intractable (unless we can find a sustainable solution). So the friend is right: decay is a factor that affects tractability.

     - **Your decay factor as a fourth multiplier**: The defender would argue that it's redundant and should be part of tractability. But if you find that explicitly including decay helps in your analysis, it's a valid extension. The core framework is a heuristic, and adaptations are encouraged.

   ## Overall Conclusions

   ### On the blog post:
     - The defender would agree that the framework is a heuristic and that the numbers are uncertain. However, they would argue that the structure helps in avoiding common biases (like only funding popular causes) and in finding high-leverage opportunities.
     - The critique that the framework leads to obscure causes is actually a strength: it finds undervalued areas.
     - The defender would reject the oversimplified definitions of Importance and Neglectedness.
     - The framework is about marginal impact, and the blog post's confusion between marginal and absolute is a critical flaw in the critique.

   ### On the additional questions:
     - Meta-work can be incorporated by either:
          (a) Applying the framework to the meta-cause (like "improving the effectiveness of work in area X").
          (b) Recognizing that meta-work improves the tractability of the underlying cause.
     - Decay is best seen as a component of tractability because it reduces the net impact per resource.

   ### Does the blog post's conclusion survive?
     - The conclusion that "a sensible person should stick to causes with broad support and visible feedback loops" is exactly what the framework is designed to challenge. The defender would argue that such an approach may lead to missing high-impact opportunities in neglected areas. However, the framework does value feedback loops (they improve tractability by allowing learning and iteration). The visible feedback loops are important for measuring progress and adjusting, so they are part of tractability.

     - The blog post's conclusion does not survive because it misrepresents the framework and ignores the marginal analysis. Once corrected, the framework still stands as a useful heuristic.

   ### Final note:
     - The framework is not perfect. It might be improved by explicitly including factors like resilience to decay or the value of information. But as a simple starting point, the three factors are robust.

   Let me know if you'd like to dive deeper into any part.
answer: |-
  ### Breaking Down the Blog Post Critique
  Here's a fair assessment of the claims, clarified through the lens of a defender of the ITN (Importance/Tractability/Neglectedness) framework:

  1. **"Importance = number of people affected"**  
     **Subtly wrong.** Importance isn't just headcount—it's the **scale of the positive outcome** (e.g., lives saved, suffering reduced per dollar). A disease harming 10,000 people with 50% mortality is more important than one affecting 100,000 with 0.1% mortality. The post oversimplifies.

  2. **"Neglectedness = unpopularity"**  
     **Mostly correct, but incomplete.** Neglectedness explicitly measures **resources already deployed** (dollars, labor, attention). A cause with billions invested (e.g., cancer research) has low neglectedness; a niche cause (e.g., lead paint remediation) has high neglectedness. The framework *intentionally* highlights these "obscure" areas because marginal resources there yield higher returns.

  3. **"Near-zero in any factor kills the product → only obscure causes win"**  
     **Misleading.** The framework **is a marginal tool**, not an absolute ranking. It asks: *"Where will an* additional *dollar/hour achieve the most?"*  
     - Cancer research may have high importance, but low neglectedness (massive existing funding → diminishing returns).  
     - Pandemic prep had high neglectedness pre-COVID → massive marginal impact.  
     **Defender's rebuttal:** Obscure causes emerge because markets and governments *underinvest* in high-importance, high-tractability areas. This is the framework working as designed.

  4. **"Numbers are made up → quantification theater"**  
     **Half right, but not damning.** Yes, scores are estimates (often qualitative). But the structure forces explicit reasoning, mitigates bias toward "popular" causes, and highlights uncertainty. The alternative—intuition alone—often overlooks high-impact opportunities.

  5. **"Sensible people should stick to mainstream causes with feedback loops"**  
     **Contradicts the framework's purpose.** Feedback loops (visibility) aid *tractability*, but popular causes often suffer low neglectedness. The framework explicitly corrects for this bias. The post's conclusion ignores the core insight: **leverage comes from neglected opportunities**.

  ### Your "Decay Factor" – Where Does It Fit?
  **It's tractability in disguise.** Here's why:  
  - **Tractability** measures *how much outcome you get per unit input*. If gains decay (e.g., antibiotic resistance, model drift), you need recurring inputs to sustain the outcome. This effectively **reduces the outcome-per-resource ratio** (i.e., lower tractability).  
  - *Example:* A malaria bednet program in a stable region has high tractability (1 net = 5 years of protection). In a conflict zone with theft/damage (high decay), tractability drops (1 net = 6 months of protection → 10x less efficient).  
  - **Your friend is right.** Explicitly adding "decay" as a fourth factor is redundant—it’s modeled by adjusting tractability downward. If decay dominates, tractability approaches zero.

  ### Meta-Work (Observability, Tech Debt, Experiments)
  **The framework systematically underrates these** if applied naively. But it can be fixed:  
  - **Problem:** Meta-work doesn’t directly solve a problem—it improves *future* tractability or reduces uncertainty. A rigid ITN application might score this near zero on "importance" since no immediate outcome is produced.  
  - **Solution:** Broaden the scope of "tractability" to include:  
    - **Uncertainty reduction:** Experiments that reveal which interventions work boost *future* tractability (e.g., a $10k experiment preventing a $1M wasted project).  
    - **Leverage amplification:** Tech debt cleanup might increase development speed by 20% → all future work becomes 20% more tractable.  
  - **Defender’s fix:** Frame meta-work as *investing in a new cause area*: "Improving the efficiency/resilience of system X." Then:  
    - *Importance:* Value of future work enabled.  
    - *Tractability:* How much efficiency/uncertainty-reduction you gain per hour spent.  
    - *Neglectedness:* How underinvested this meta-work is.  

  ### Key Takeaways
  - **Fair parts of the post:** Highlights that ITN favors obscure causes, uses speculative scores, and requires careful marginal thinking.  
  - **Where the post is wrong:** Misdefines importance, misses the marginal lens, and dismisses "obscure" answers as bugs rather than features.  
  - **Framework survives:** Fixing these errors strengthens ITN. It remains a robust heuristic to counterbalance intuition.  
  - **Your hunches were spot-on:**  
    1. ITN is inherently about **marginal resources** (not whole-cause comparisons).  
    2. Decay is **embedded in tractability**.  
    3. Meta-work requires **reframing as a tractability-boosting cause**.  

  The ex-finance guy’s critique fails because he rejects the framework’s core purpose: finding undervalued, high-leverage opportunities. His alternative ("stick to popular causes") is precisely what ITN was designed to correct.
