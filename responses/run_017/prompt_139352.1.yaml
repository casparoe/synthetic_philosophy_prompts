  ### Worked Example: Vendor Selection for Logging System  
  **Decision**: Choose between Vendor A (inferior) or Vendor B (superior) for a new logging system. Stakes: 6 months of engineering work. True state: Vendor B is better, but unknown to the team.  

  **Setup**:  
  - 5 engineers decide sequentially. Each sees previous public choices (but not private reasoning).  
  - Each gets a private signal (A or B) with 66.7% accuracy (P(correct) = 2/3). Signals are independent.  
  - True signals (based on Vendor B being superior):  
    - Engineer 1 (E1): Signal A (incorrect)  
    - Engineer 2 (E2): Signal A (incorrect)  
    - Engineer 3 (E3): Signal B (correct)  
    - Engineer 4 (E4): Signal B (correct)  
    - Engineer 5 (E5): Signal B (correct)  
  - Prior belief: P(Vendor A better) = P(Vendor B better) = 50%.  

  ---

  ### Sequential Decision (Cascade to Wrong Outcome)  
  **E1's Decision**:  
  - Only private signal (A).  
  - Rational choice:  
    - P(Better|A) = (2/3) / [(2/3) + (1/3)] = **66.7% for A**.  
  - **Action**: Chooses Vendor A.  

  **E2's Decision**:  
  - Sees E1 chose A. Private signal (A).  
  - Rational choice:  
    - E1’s choice implies E1’s signal was A (since E1 follows their signal).  
    - P(Better|E1’s A and own A) = (2/3 × 2/3) / [(2/3 × 2/3) + (1/3 × 1/3)] = (4/9) / (5/9) = **80% for A**.  
  - **Action**: Chooses Vendor A.  

  **E3's Decision (Cascade Begins)**:  
  - Sees E1 and E2 chose A. Private signal (B).  
  - Rational choice:  
    - E1’s A and E2’s A imply:  
      - P(E2 chose A | Better=A) = P(signal A) + 0.5×P(signal B) = (2/3) + 0.5×(1/3) = **83.3%**  
      - P(E2 chose A | Better=B) = (1/3) + 0.5×(2/3) = **66.7%**  
    - Posterior:  
      - Numerator (Better=A): (0.5) × [P(E1’s A|A) × P(E2 chose A|A) × P(own B|A)] = (0.5) × [(2/3) × (5/6) × (1/3)] = 5/54  
      - Denominator (Better=B): (0.5) × [P(E1’s A|B) × P(E2 chose A|B) × P(own B|B)] = (0.5) × [(1/3) × (2/3) × (2/3)] = 4/54  
      - P(Better=A | History) = (5/54) / (5/54 + 4/54) = **55.6% for A**.  
  - **Action**: Chooses Vendor A (55.6% > 44.4% for B), *ignoring own signal B*.  
  - **Cascade lock-in**: E3 disregards private signal because public history (two A’s) outweighs it.  

  **E4 and E5's Decisions**:  
  - See three A’s. Always choose A regardless of private signals (B for both).  
    - Posterior for E4/E5: Identical to E3 (public history dominates; P(A) ≈ 55.6%).  
  - **Outcome**: Team chooses Vendor A (wrong).  

  ---

  ### Simultaneous Anonymous Assessment (Correct Outcome)  
  - All engineers submit written, anonymous assessments first. Signals aggregated: **3 B’s, 2 A’s**.  
  - Posterior:  
    - P(Better=B | signals) ∝ (2/3)³ × (1/3)² = 8/243  
    - P(Better=A | signals) ∝ (1/3)³ × (2/3)² = 4/243  
    - P(Better=B) = (8/243) / (8/243 + 4/243) = **66.7% for B**.  
  - **Outcome**: Team chooses Vendor B (correct).  

  ---

  ### Key Features & Validation  
  1. **Single Feature Doing the Work**: *Asymmetric information aggregation*. Sequential public choices amplify early signals and suppress later contradictory signals, even with rational actors.  
     - **If removed**: If signals were private until the end (e.g., anonymous vote), all information is weighted equally → correct outcome.  

  2. **No Outcome Stipulation**:  
     - The cascade emerges from Bayesian updating (calculations shown). No assumptions about irrationality/seniority.  
     - Signals are plausible: With true state B, P(two incorrect A’s) = (1/3)² = 11.1% — rare but realistic.  

  3. **Skeptical Rebuttal & Counter**:  
     - **Rebuttal**: "Open discussion allows reasoning sharing, preventing blind follows."  
     - **Counter**: In practice, early speakers dominate. E3 (with signal B) might stay silent after two A’s due to social pressure (even without irrationality). Anonymous collection ensures unbiased signal aggregation.  

  ---

  ### Why This Works  
  - **Cascade trigger**: Two initial A’s create >50% belief in A. E3’s B signal is too weak to flip it (55.6% vs 44.4%).  
  - **Confidence**: High. This follows standard information cascade theory (Bikhchandani et al., 1992). Violating any requirement (e.g., perfect rationality) breaks the cascade.  

  **Slide-Friendly Summary**:  
  > - *Sequential*: E1 (A) → E2 (A) → E3 (ignores B, picks A) → Locked to A (wrong).  
  > - *Anonymous*: Signals: 2A, 3B → Majority B (correct).  
  > **Key Insight**: Early public votes drown out later signals. Anonymous collection fixes this.
