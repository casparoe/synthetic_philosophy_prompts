  Outcome: Team chooses Vendor A (wrong).

  **Simultaneous (or anonymous written first)**:
  - Signals: two A, three B.
  - Majority: Vendor B. Posterior: P(B) = 2/3 -> choose Vendor B (correct).

  **Why it happens**: The first two votes for A create a strong public belief. Subsequent individuals, even with evidence for B, rationally follow the public information and ignore their own signal.

  **Cascade begins at person 3**: Because the public information (two A's) outweighs their own signal (B) for the first time.

  **What if we change?** If the first two signals had been split (one A, one B), then the third person would use their own signal. But in this case, the two initial A's caused the cascade.

  **Objection**: "In a real meeting, people explain their reasoning, so the third engineer might say, 'I have concerns about A' and then the team would discuss." But in practice, early strong opinions can set a tone that discourages dissent, especially if the first two are senior. Our method removes that by collecting anonymous written assessments first.

  This example is standard in the literature (e.g., Bikhchandani, Hirshleifer, Welch 1992).
