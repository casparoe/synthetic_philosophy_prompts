prompt: |-
  I sit on the committee drafting a new world history curriculum for fifteen- and sixteen-year-olds, and we have become stuck on one piece of vocabulary that seemed innocent when we voted it in. Our draft teacher's guide asks teachers to have pupils identify the cast of a historical episode — the thought being that a strong answer names not only rulers, ministers and rebels but also the bacillus, the drought and the volcano. A well-known popular book that credits the broad shape of the last several millennia largely to germs, crops and domesticable animals is the obvious inspiration, though the guide names nothing; another member wants the same vocabulary used in our unit on the enormous eruption in present-day Indonesia in 1815 and the year without a summer that followed it in Europe and North America. The vocabulary is meant to do a definite job. Teachers mark roughly four-hundred-word exam answers in about fifteen minutes and almost none of them have any training in the philosophy of history, so the rubric needs to reward a pupil who brings a non-human cause into the story and to mark down the answer that explains everything by policy and personality. It is also meant to block the opposite abuse: our subject association complained that pupils will write that the germ did it, or the volcano did it, and treat that as a full stop, which quietly releases a colonial administration, a landlord or a legislature from any role at all. So we need to know what the cast framing actually entitles a marker to infer.

  Two colleagues have now offered rival framings that I cannot adjudicate. One says that germs, climates and volcanoes are not cast but stage — part of the setting in which the human actors act, like the weather in a play; on this view the volcanic eruption changes what is difficult rather than doing anything, and a pupil who calls it an actor has simply been fooled by a metaphor. A second says neither fits, and that a non-human cause is more like a change in the rules made in the middle of a game: it alters which moves are available and what they cost, without moving pieces itself. I would like an audit of all three. For each, give the correspondence table — what plays the role of the agent, the action, the goal, the reason for acting, the counterfactual difference-maker, the thing that can be praised or blamed — then say where the mapping breaks, and which of the breaks matter for our use as opposed to being harmless. In particular I want to know what each framing quietly imports from its source domain that the target lacks: intentionality, the possibility of acting for reasons, responsiveness to evidence or to incentives, accountability, having a role in a plot with a beginning and an end, or the thought that if something is part of the cast then it was necessary to the outcome. Then tell me which of the conclusions we care about each framing can and cannot carry: that a monocausal human explanation is incomplete, that a non-human explanation is not exculpatory, that the eruption or the blight can be the most important cause without being an agent at all. Run the three framings on the episodes our draft actually covers — a fourteenth-century plague and the wage legislation that followed it, a mid-nineteenth-century famine caused by a crop blight, and the 1815 eruption and its cold summer — and say in each case what a fifteen-year-old could defensibly write under each framing, because that is what the rubric has to grade.

  Please do not send me a reading list, a bibliography or citations; I want the argument, in plain language I can put in front of a teachers' meeting, and if you can give us a sentence or two of actual guide wording that survives your own objections, so much the better. Where you are making a values call rather than an analytic one, say so explicitly, since we can vote on the former and should not pretend to settle the latter. And be explicit about your own footing: mark which claims you hold with confidence and which are contestable, tell me where your reasoning is most likely to fail, and name the argument or consideration that would lead you to a different verdict about the cast framing.
reasoning: |-
  Okay, let me approach this curriculum committee's problem step by step. The core issue revolves around how to frame non-human elements like germs, volcanoes, and droughts in historical narratives for teenage students. 

  First, I need to understand the committee's precise needs: They want exam rubrics that reward students for including non-human factors without oversimplifying ("the germ did it") or excusing human actors. The goal is balanced historical analysis within practical grading constraints.

  The three proposed framings require careful comparison:
  - The "stage" metaphor treats non-human elements as background context
  - The "rule-change" metaphor sees them as altering conditions of action
  - The original "cast" metaphor presents them as active participants

  For each metaphor, I should map how key concepts like agency, causation, and accountability transfer to history. The transferability analysis must highlight where metaphors break down - particularly regarding intentionality or moral responsibility. 

  Practical application matters most. Taking their three historical episodes:
  1) Black Death and wage laws
  2) Potato famine
  3) 1815 eruption 

  For each case, I need to show what student answers might look like under each framing, and how rubrics would assess them. This reveals which metaphor best supports their pedagogical goals.

  The values-versus-analysis distinction is crucial. Where choices reflect educational priorities rather than philosophical truth, I'll flag it explicitly so the committee can vote accordingly.

  Finally, I'll draft sample rubric language that withstands the identified pitfalls, balancing conceptual rigor with classroom practicality. The focus remains on crafting usable guidance, not theoretical perfection.
answer: |-
  Here's an analysis of the three framings, designed for clarity in a teachers' meeting, with practical implications for your rubric:

  ### Core Goal of Your Vocabulary
  To reward students who **include non-human factors** in historical explanations while **penalizing two errors**:  
  1. Ignoring non-human causes (oversimplified "great man" history)  
  2. Using non-human causes as *exculpatory* "full stops" (absolving human actors of responsibility)

  ---

  ### Audit of the Three Framings

  **1. The "Cast" Metaphor**  
  *(Non-human elements as actors in a play)*  
  - **Correspondence Table:**  
    - Agent = Germ/Volcano  
    - Action = Killing/Cooling  
    - Goal = *Breaks down* (volcanoes lack intent)  
    - Reason = *Breaks down* (no rationality)  
    - Counterfactual = Works (removing germ/volcano changes outcome)  
    - Praised/Blamed = *Dangerous transfer* (risks moral absolution of humans)  

  - **Where it breaks & why it matters:**  
    - **Harmless Breaks:** Lack of goals/reasons (students grasp microbes aren't scheming).  
    - **Dangerous Breaks:** Implies non-human "actors" bear responsibility, subtly excusing humans ("The volcano caused famine" → "Not the colonial policy"). Also implies *necessity* (if in the "cast," it *must* be central).  

  - **Can it carry your conclusions?**  
    - ❌ **Fails** "non-human explanation is not exculpatory" (its core flaw).  
    - ✅ **Succeeds** at "monocausal human explanations are incomplete."  

  **2. The "Stage" Metaphor**  
  *(Non-human elements as setting/context)*  
  - **Correspondence Table:**  
    - Agent = Humans only  
    - Action = *Only* human decisions  
    - Goal/Reason = Human motives  
    - Counterfactual = Works (change the "stage," outcomes differ)  
    - Praised/Blamed = Humans only  

  - **Where it breaks & why it matters:**  
    - **Harmless Breaks:** Historical "stages" aren't passive (drought actively destroys crops).  
    - **Dangerous Breaks:** Overly centers human agency. Risks implying non-human factors are *just* background, not active forces. Makes it harder to argue a volcano was the *most important* cause.  

  - **Can it carry your conclusions?**  
    - ✅ **Succeeds** at "non-human explanation is not exculpatory" (blame stays on humans).  
    - ❌ **Fails** to fully reward students for treating non-human factors as *causal forces* (risks marking down "the eruption *caused* famine" as inaccurate).  

  **3. The "Rule-Change" Metaphor**  
  *(Non-human elements as altering game rules)*  
  - **Correspondence Table:**  
    - Agent = Humans (players)  
    - Action = Human moves under *new rules*  
    - Goal/Reason = Human motives under constraints  
    - Counterfactual = Works brilliantly (new rules change possible moves)  
    - Praised/Blamed = Humans (for how they played under the new rules)  

  - **Where it breaks & why it matters:**  
    - **Harmless Breaks:** Rules are usually set intentionally; eruptions aren't.  
    - **Dangerous Breaks:** None significant for your goals. Best avoids intentionality trap.  

  - **Can it carry your conclusions?**  
    - ✅ **Succeeds** at "monocausal human explanation is incomplete" (ignores rule-change).  
    - ✅ **Succeeds** at "non-human explanation is not exculpatory" (humans still played the game).  
    - ✅ **Succeeds** at allowing non-human factor to be "most important cause" (a rule-change can be decisive) without needing "agency."  

  ---

  ### Practical Application: What Students Might Write

  | Episode                     | "Cast" Metaphor (Problematic Answer)         | "Stage" Metaphor (Adequate Answer)              | "Rule-Change" Metaphor (Strong Answer)                |
  | :-------------------------- | :------------------------------------------- | :---------------------------------------------- | :---------------------------------------------------- |
  | **1348 Plague & Wage Laws** | "The plague killed workers, forcing lords to raise wages." | "After the plague, with fewer workers, lords raised wages." | "The plague drastically reduced the labor supply. This changed the rules: workers could demand higher wages, leading to new laws trying to cap them." |
  | **1840s Potato Famine**     | "The blight caused the famine." <br>*(Exculpatory full stop)* | "During the blight, British policies worsened food shortages." | "The blight destroyed the staple crop. Under these new rules (mass starvation likely), British policies on trade and relief dictated who starved and who survived." |
  | **1815 Eruption & Cold Summer** | "The volcano caused the cold summer and crop failures." | "In the cold summer caused by the volcano, harvests failed across Europe." | "The eruption created a sudden 'rule-change': global cooling. Governments now faced unprecedented food shortages and social unrest, forcing varied policy responses." |

  ---

  ### Recommended Framing & Rubric Language
  **Use the "Rule-Change" Metaphor.** It best achieves your goals:  
  1. Forces students to **name** non-human factors to explain outcomes.  
  2. **Prevents exculpation** by focusing on *human choices under new constraints*.  
  3. Allows non-human factors to be **decisive causes** without anthropomorphism.  

  **Sample Rubric Wording for Teachers:**  
  > *"A top-tier response identifies how environmental factors (disease, climate, geology) or technologies **reshaped the conditions** under which historical actors made decisions. It explains how these factors altered incentives, resources, or risks, and then analyzes the **human actions** taken in response. Answers that treat non-human factors as the sole cause (e.g., 'the blight caused the famine') or ignore their role entirely should be marked down."*  

  **Why this works:**  
  - "Reshaped the conditions" = Rule-change (avoids "cast" pitfalls).  
  - "Altered incentives, resources, or risks" = How rules constrain/empower.  
  - "Analyzes human actions taken in response" = Prevents exculpation.  

  ---

  ### My Footing & Caveats
  - **High Confidence:** "Rule-change" best balances your needs. "Cast" is dangerous; "Stage" underplays causality.  
  - **Contestable:** Whether "rules" language resonates with 15-year-olds. Test it with sample student responses.  
  - **Values Call:** Prioritizing *preventing exculpation* over poetic force is a **values choice** (e.g., "cast" is more vivid but ethically risky). Vote on this.  
  - **Failure Point:** If teachers interpret "rule-change" too rigidly, missing that volcanoes aren't *designed* like game rules. Emphasize it’s a metaphor for *sudden, constraining shifts*.  
  - **What Could Change My View:** Evidence that "rule-change" consistently confuses students in trials, or proof that another framing better prevents "the germ did it" responses *without* excusing human actors.  

  This approach gives you actionable, defensible language focused on **human choices within transformed constraints**, meeting your core aims while avoiding philosophical pitfalls.
