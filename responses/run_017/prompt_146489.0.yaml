  ### Peer Mediation Diagnostic Procedure Based on Aumann's Agreement Theorem

  **Core Principles**: Disagreements that persist after sharing evidence and beliefs often stem from one of four failures:  
  1. **Non-factual dispute** (values, not facts).  
  2. **Different priors** (fundamentally different starting points due to unshared life experiences).  
  3. **Undisclosed evidence** (critical information exists but cannot be shared).  
  4. **Non-updating** (parties refuse to adjust beliefs after hearing each other).  

  The procedure aims to diagnose these in ~10 minutes. Mediators record answers verbatim.  

  ---

  #### **Step 1: Identify the Factual Proposition** (2 min)  
  **Ask**: *"What specific fact are you disagreeing about? State it as something that is either true or false."*  
  - **Sufficient answer**: A clear factual claim (e.g., "The numbers were copied," "The call was audible").  
  - **Stop if**: The dispute is about values (e.g., "Quiet hours should be a rule").  
    - *Mediator says*: "This seems to be about what *should* be, not what *is*. We’ll hand it to the dean."  
    - **Outcome**: `HAND_TO_VALUES`  
  - **Record**: The agreed-upon proposition. If parties define it differently, note both versions.  

  ---

  #### **Step 2: Check for Shared Prior** (2 min)  
  **Ask**: *"Before this incident, what did you believe about [proposition]? Use plain language (e.g., 'likely,' 'unlikely')."*  
  - **Sufficient answer**: Any qualitative estimate (e.g., "I thought it was impossible," "I expected it").  
  - **Stop if**: Priors differ due to unshareable life experiences (e.g., "I’ve been in fights, so I expect shoves" vs. "I’ve never fought").  
    - *Mediator says*: "Your starting points are too different to reconcile here. We’ll escalate."  
    - **Record**: "Priors differ: Party A: [X], Party B: [Y]. Reason: [summary]."  
    - **Outcome**: `ESCALATE`  
  - **Else**: Proceed. Record priors (e.g., "A: likely, B: unlikely").  

  ---

  #### **Step 3: Share Evidence and Posteriors** (3 min)  
  **Ask**:  
  1. *"What evidence led you to your current belief? Share what you can."*  
  2. *"Given that evidence, what do you now believe about [proposition]?"*  
  - **Sufficient answer**:  
    - Evidence described (even if vague: "I saw edits late at night").  
    - Posterior in plain language (e.g., "I’m sure it’s true," "More likely than not").  
  - **If undisclosed evidence**:  
    - *Party says*: "I know something but can’t share it."  
    - **Record**: "Party [X] has undisclosed evidence."  
    - **Do not stop yet**. Proceed to Step 4.  
  - **Record**: Evidence summaries and posteriors (e.g., "A’s posterior: true; B’s posterior: false").  

  ---

  #### **Step 4: One Round of Updating** (3 min)  
  **Mediator reveals posteriors**: *"A believes [A’s posterior]. B believes [B’s posterior]."*  
  **Ask each party**:  
  1. *"Hearing the other’s belief, does this change your view? What do you believe now?"*  
  2. *"What do you think the other believes now?"*  
  - **Check for agreement**: If they now agree, record and end.  
  - **Record**: Updated beliefs and perceived beliefs (e.g., "A updated to ‘maybe,’ thinks B believes ‘no’").  
  - **If bell rings mid-step**:  
    - Parties are still apart → **Outcome**: `RECORD_IMPASSE` (defer to dean without splitting difference).  

  ---

  #### **Step 5: Diagnose Persisting Disagreement** (1 min)  
  - **If undisclosed evidence (from Step 3)**:  
    - *Mediator says*: "Because critical evidence can’t be shared, we need the dean’s help."  
    - **Record**: "Undisclosed evidence blocks resolution."  
    - **Outcome**: `ESCALATE`  
  - **If no updating (beliefs unchanged in Step 4)**:  
    - *Mediator says*: "You’ve heard each other’s views, but neither adjusted their position. This suggests someone isn’t updating rationally, so we escalate."  
    - **Record**: "Parties did not update after sharing posteriors."  
    - **Outcome**: `ESCALATE`  
  - **If parties updated (even slightly) but still disagree**:  
    - *Mediator says*: "You’re moving closer. Keep talking for the rest of the session."  
    - **Outcome**: `KEEP_TALKING`  

  ---

  ### Worked Cases  

  **Case 1: Lab Partners**  
  - **Step 1**: Proposition: *"Student B copied numbers from the shared spreadsheet."* (Factual → proceed).  
  - **Step 2**:  
    - A’s prior: "Likely—B has done this before."  
    - B’s prior: "Unlikely—I always do my own work."  
    - **Different priors** (A’s past experience vs. B’s self-perception).  
  - **Verdict**: `ESCALATE`  

  **Case 2: Roommate Dispute**  
  - **Step 1**: Proposition: *"The late-night calls were audible through the wall."* (Factual → proceed).  
  - **Step 2**:  
    - A’s prior: "Likely—I’ve heard other noises."  
    - B’s prior: "Unlikely—No one complained before."  
    - Similar priors → proceed.  
  - **Step 3**:  
    - Evidence: A: "I heard it." B: "I spoke softly."  
    - Posteriors: A: "Definitely audible." B: "Definitely not."  
  - **Step 4**:  
    - Reveal posteriors → no updating.  
    - A: "Still audible." B: "Still not."  
  - **Step 5**: **No updating** → escalate. Underlying values issue (courtesy vs. rule) is **not** diagnosed here.  
  - **Verdict**: `ESCALATE`  

  **Case 3: Group Chat Threat**  
  - **Step 1**: Proposition: *"The message was a serious threat."* (Factual → proceed).  
  - **Step 2**:  
    - A’s prior: "Unlikely—sender jokes like this."  
    - B’s prior: "Likely—sender has been aggressive."  
    - **Different priors** (same facts, different interpretations).  
  - **Verdict**: `ESCALATE`  

  ---

  **Verdict Summary**:  
  Case 1: ESCALATE  
  Case 2: ESCALATE  
  Case 3: ESCALATE  

  **Core Rule for Mediators**:  
  *"If priors clash, evidence is secret, or no one updates—escalate; if values are the root, hand it off; if they adjust beliefs, keep talking."*  

  \answer{Case 1: ESCALATE; Case 2: ESCALATE; Case 3: ESCALATE}
