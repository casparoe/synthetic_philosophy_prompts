prompt: |-
  hey — could you act as a professional philosopher who specializes in metaphysics of mathematics and has also taught it to people who actually do math for a living? Please think it through carefully and start by brainstorming the logical space (what the possible combinations of answers even are) before you commit to any structure. I'm putting together a two-page handout for an informal "maths and reality" evening I run with third-year pure maths students — they're very good at maths and very suspicious of metaphysics. The second they see a question like "do you believe numbers exist?" they mentally check out, so I want the handout to be a decision tree that sorts them by what they say about concrete mathematical situations, and only reveals the name of the position at the leaf. Start node: you accept ordinary mathematical practice and the theorems as mathematicians state them. Then eight branch questions, each one a case or claim a working mathematician could answer from instinct with no philosophy vocabulary, ending in seven to nine named leaves.

  Some situations I'd like used as nodes (swap in better ones if you have them): when a mathematician says let n be an arbitrary even integer and then proves something about it, has she singled something out, or only spoken generally? Whether it matters which set-theoretic surrogate we identify the number 3 with, given that the usual reduction offers more than one. Whether the continuum hypothesis already has an answer that we just don't know, versus whether adopting a new axiom there is more like legislation than discovery. The standard example people use in that literature about periodical cicadas and prime-numbered life cycles — assume for the sake of the handout that the biology is right — where a mathematical fact looks like it's doing the explaining of a physical fact: does that explanation need the mathematical claim to be true? A proof nobody has ever checked, or a computer proof too long for any human to survey: does anything about it wait on a mind? And the squeeze I keep getting stuck on: if the things maths seems to be about are outside spacetime and causally inert, how do our proofs and our referring expressions manage to track them at all?

  Also: if someone handed you a rewritten physics that made all the same predictions without quantifying over mathematical entities, would you say the original was false, or just clunkier, or better off because it's more explanatory? And whether there could be a world with exactly the same concrete furniture as ours but different mathematical facts. Build the tree from the combinations of answers first and only then locate the actual positions in it, and tell me which combinations are unoccupied and why (incoherent, unattractive, or just unexplored). I know some pairs are going to be hard to seperate — people who say mathematical talk is fine but not really truth-apt versus people who say it's false but useful, and the "objects are positions in structures" crowd versus plain old set-theoretic platonists — please flag those explicitly rather than pretending the tree cuts them apart, and note what extra question (if any) would separate them. Last thing: a short note on which two of the eight questions do the most work and which one you'd cut as redundant.
reasoning: |-
  Okay, the user wants a decision tree handout for math students skeptical of metaphysics. Let me start by understanding their main goal: making metaphysics accessible without jargon. The students check out when asked if numbers exist, so the tree needs concrete math situations.

  First, I need to brainstorm the logical space. The entry point is accepting standard math practice. Then, eight questions branching into positions. Key scenarios mentioned: arbitrary integers, set-theoretic surrogates for 3, the Continuum Hypothesis, cicadas and primes, uncheckable proofs, reference to abstract objects, nominalistic physics, and worlds with different math facts.

  Breaking down each question's purpose. For Q1 (arbitrary integer), it's about whether we refer to specific entities or just general claims. Q2 (set surrogates) tests if identity matters. Q3 (CH) explores realism vs. anti-realism in axioms. Q4 (cicadas) links math explanations to truth. Q5 (uncheckable proofs) questions mind-dependence. Q6 (reference) addresses epistemic access. Q7 (nominalistic physics) examines indispensability. Q8 (alien math worlds) checks modal status.

  Now, mapping possible answers. Each yes/no gives 256 paths, but many collapse. Positions like Platonism, structuralism, fictionalism, formalism, logicism, etc., need distinct leaves. Some positions might share answers until a specific question. For example, Platonism vs. structuralism might both say numbers exist but diverge on Q2 (set surrogates). Structuralists don't care about surrogates, while Platonists might. So Q2 separates them.

  Q4 (cicadas) is crucial for indispensability arguments. Realists might say math explains, anti-realists might say it's useful fiction. Q7 (nominalistic physics) also ties into indispensability. If one accepts nominalism, it leans towards fictionalism or instrumentalism.

  Q6 (reference) is tricky. If abstract objects are causally inert, how do we refer? Anti-realists might say we don't refer, while realists need an epistemic story. This might be a key separator.

  I need to ensure the tree doesn't force false dichotomies. For example, between fictionalism (math false but useful) and non-cognitivism (not truth-apt). They might answer similarly on several questions. Adding a note that these need extra distinction, perhaps by asking if math statements are truth-apt.

  Redundancy check. Q2 (set surrogates) might be less critical if structuralism is covered elsewhere. But it directly challenges object-based Platonism. Q5 (uncheckable proofs) tests mind-dependence, which separates intuitionists or social constructivists from realists.

  The user mentioned cutting one question. Q6 (reference) is fundamental but might be complex for a handout. However, it's essential for the access problem. Alternatively, Q8 (alien math worlds) could be redundant if modal aspects are covered in other answers. For instance, necessity of math might be implied by Q3 or Q7.

  Prioritizing questions. Q1 and Q4 seem most impactful. Q1 sets up realism vs. anti-realism, and Q4 ties math to physical explanation. Q3 (CH) is also key for realism in set theory. Q5 (uncheckable proofs) might be less central unless focusing on social aspects.

  Unoccupied combinations: Positions that require math to be both mind-dependent and necessary might be rare. Also, believing in math entities but denying they explain physical facts could be unstable, but some structuralists might hold that.

  Finally, the user wants to note which questions do the most work. Q1 and Q4 are probably the heaviest lifters. Q1 addresses ontological commitment directly through mathematical practice, and Q4 connects math to the physical world, forcing a stance on truth. Q8 might be cuttable if modal questions are covered elsewhere, though it's important for necessity.
answer: |-
  Below is a structured blueprint for your handout. It prioritizes mathematical practice over metaphysical jargon, uses concrete scenarios to force implicit commitments, and groups answers into coherent positions. The tree starts from acceptance of standard mathematics and branches through 8 questions, ending in 9 distinct leaves. I've flagged key tensions and redundancies.

  ---

  ### **Decision Tree: Mapping Your Mathematical Commitments**  
  *Start Here: You accept standard mathematical practice (e.g., proofs about primes, real analysis, ZFC axioms).*

  #### **Branching Questions**  
  1. **Arbitrary Objects**:  
     When a mathematician says "let *n* be an arbitrary even integer" and proves a theorem, is she:  
     - **(A)** Singling out a *specific but generic* object? → **Yes**  
     - **(B)** Only making a claim about *all* even integers? → **No**  

  2. **Set-Theoretic Surrogates**:  
     Does it matter *which* set we identify as the number 3 (e.g., {∅,{∅},{∅,{∅}}} vs. {{{∅}}})?  
     - **(A)** Yes, 3 must be a unique object → **Yes**  
     - **(B)** No, only structure matters → **No**  

  3. **Continuum Hypothesis (CH)**:  
     Is CH’s truth value:  
     - **(A)** Fixed (we just don’t know it)? → **Yes**  
     - **(B)** Determined by choosing axioms (like "legislation")? → **No**  

  4. **Cicadas & Primes**:  
     If prime life cycles explain cicadas’ evolution, does this require primes to be *true* (not just useful)?  
     - **(A)** Yes, explanation fails if primes are fictional → **Yes**  
     - **(B)** No, it only requires predictive utility → **No**  

  5. **Unsurveyable Proofs**:  
     For a proof too long for humans to check (e.g., some computer-assisted proofs), does its correctness depend on:  
     - **(A)** Verification by a *possible* mind? → **Yes**  
     - **(B)** Mind-independent facts? → **No**  

  6. **Tracking Abstracta**:  
     If math is about non-spatiotemporal objects, how do we reliably refer to them?  
     - **(A)** We *can* access them (e.g., via intuition, structure) → **Yes**  
     - **(B)** We *can’t*—this is deeply puzzling → **No**  

  7. **Nominalistic Physics**:  
     If physics made identical predictions without math (e.g., "nominalized" version), is the original:  
     - **(A)** Truer/more explanatory → **Yes**  
     - **(B)** Just more useful → **No**  

  8. **Alien Math Worlds**:  
     Could a world have identical concrete facts but different math (e.g., 2+2=5)?  
     - **(A)** No, math is necessary → **Yes**  
     - **(B)** Yes, math is contingent → **No**  

  ---

  ### **Resulting Positions (Leaves)**  
  *Paths compress to 9 coherent views. Unoccupied combinations noted.*  

  | Path (Answers to Q1–Q8) | Position                     | Key Features                                                                 | Notes                                                                 |
  |--------------------------|------------------------------|-----------------------------------------------------------------------------|-----------------------------------------------------------------------|
  | Y,Y,Y,Y,Y,Y,Y,Y          | **Platonism**                | Math entities exist uniquely; mind-independent; indispensable.              | Rare: Q6 "Yes" is strained for Platonists.                           |
  | Y,N,Y,Y,Y,Y,Y,Y          | **Structuralism**            | Objects are positions in structures; identities irrelevant.                 | Separated from Platonism by Q2 ("No").                               |
  | N,–,Y,Y,Y,–,Y,Y         | **Robust Realism**           | Truths exist without specific objects; CH has answer; math necessary.       | – = any answer, but Q1="No" rejects objects.                         |
  | Y,–,N,–,N,–,–,–         | **Social Constructivism**    | Math is human-created; CH is "legislation"; proofs require possible minds.  | Collapses if Q5="Yes".                                               |
  | –,–,–,N,–,–,N,N         | **Fictionalism**             | Math useful fiction; nominalized physics equal; no explanation (Q4="No").   | **⚠️ Tension:** Hard to distinguish from non-cognitivism (see below). |
  | N,–,N,–,–,–,N,N         | **Formalism**                | Math is symbol manipulation; no reference to objects (Q1="No").             | Q4="No" and Q7="No" align.                                           |
  | N,–,–,N,–,–,–,–         | **Non-Cognitivism**          | Math not truth-apt; just useful language.                                   | **⚠️ Tension:** Same answers as fictionalism on Q4/Q7.                |
  | –,–,–,Y,–,–,Y,–         | **Indispensabilism (Quine)** | Math true because indispensable to science (Q4="Yes", Q7="Yes").            | Q8 varies (Y: Putnam; N: Maddy).                                     |
  | Y,N,–,–,–,Y,–,Y         | **Logicism**                 | Math reducible to logic; objects are structural; access via logic (Q6="Yes").| Q3 often "No" (e.g., Carnap).                                        |

  **Unoccupied Combinations**:  
  - **Q1=Yes + Q6=No**: Claims specific objects exist but denies we can refer to them → *Incoherent*.  
  - **Q4=Yes + Q7=No**: Math explains physics but nominalized version is equal → *Unstable*.  
  - **Q5=No + Q8=No**: Math mind-independent but contingent → *Unattractive (rarely defended)*.  

  ---

  ### **Question Analysis**  
  - **Heaviest Lifters**:  
    - **Q1 (Arbitrary Objects)**: Splits object realists (Platonism/structuralism) from non-object views (formalism/fictionalism).  
    - **Q4 (Cicadas & Primes)**: Forces commitment to *truth* vs. *utility*—core for realism/anti-realism.  
  - **Redundant Question**: **Q6 (Tracking Abstracta)**. Answers strongly correlate with Q1/Q5. Cut it to reduce complexity without losing key distinctions. Keep if emphasizing epistemology.  
  - **Key Tensions**:  
    - Fictionalism vs. Non-Cognitivism: Both say Q4="No", Q7="No". *Separator: "Do mathematical claims have truth values?"* (Yes → fictionalism; No → non-cognitivism).  
    - Platonism vs. Structuralism: Q2 ("Do set surrogates matter?") cleanly divides them.  

  ---

  ### **Handout Design Tips**  
  1. **Frame questions as "Which intuition feels right?"** (e.g., *"When you pick an 'arbitrary integer,' does it feel like selecting a ghostly template?"*).  
  2. **Label positions only at the end**—use evocative terms (e.g., "Math as Architecture" for structuralism).  
  3. **Include a "Mixed/Unsure" exit path** for students resisting binary choices.  
  4. **Use cicadas example verbatim**—it’s vivid and isolates explanatory indispensability.  

  This tree forces metaphysically-loaded choices while staying grounded in practice. The most contentious branches (Q1, Q4) mirror live debates in philosophy of math, making it engaging for skeptical students.
