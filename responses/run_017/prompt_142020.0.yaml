  First pressure point: undermining the thermometer analogy. The user's identified three cracks—lack of independent theory, absent convergence metrics, and causal impotence when features are edited. Smart. For Q1, I'll demand the independent theory she implicitly relies on, forcing her to either describe a non-instrumental feature definition or admit there isn't one. The follow-up about null baselines should trap her—if random models produce similar "convergence," her evidence evaporates. 

  Granularity’s tricky. Her "splitting hierarchy is part of the mosaic" dodge feels inevitable, so Q3’s follow-up must ask what anchors that hierarchy—network architecture or data statistics. If she picks the former, it’s testable; if the latter, realism crumbles. 

  Basis freedom (Q4) is where I’m least confident. The user assumes she’ll cite sparsity as the privileged basis, but what if she bites the bullet and says *no* basis is privileged? That’d implode the measurement analogy entirely. The follow-up about sparsity being observer-dependent could be lethal though—if sparsity is our lens, not the network’s property, mosaic realism collapses into instrumentalism. 

  For the "what settles it" finale (Q7), the training-data-alone result would indeed nuke realism. But the killer is the instrumentalist agreement point—if predictions are identical, why fight for ontology? She’d need to identify an empirical stake, like feature transfer or trustworthiness, or concede it’s purely philosophical. 

  *Double-checks* User banned "advice for juniors" etc., so all questions stay technical. Also flagged not to supplement with real interpretability literature—strictly manuscript-only. Got it. 

  Least confident? Q4’s sparsity assumption. She might counter that sparsity emerges from ReLUs or gradient descent, making it network-inherent. But if not... boom.
answer: |-
  Here are nine questions with follow-ups designed to press on the specified pressure points, each anticipating Kovač's core responses based strictly on her manuscript:

  ### 1. Deflection Pressure  
  **Q1:** *"You argue temperature has an independent theory (kinetic theory) defining it beyond thermometers. What’s the analogous independent theory for neural features that defines what they are independently of our dictionaries?"*  
  **Expected Answer:** There is no standalone theory; features are defined by their role in the network’s computational structure.  
  **Follow-up:** *"If features lack an independent theoretical definition, isn’t ‘measurement problem’ just a label for our ignorance—making mosaic realism indistinguishable from instrumentalism?"*  

  **Q2:** *"When dictionaries ‘converge’ under α-equivalence, what null baseline (e.g., comparing different models or scrambled activations) must they outperform to count as evidence for realism?"*  
  **Expected Answer:** Convergence must exceed what’s seen across different models or randomized activations.  
  **Follow-up:** *"If dictionaries from the same model show only marginally stronger convergence than those from unrelated models, doesn’t that suggest the ‘mosaic’ is an artifact of data statistics, not the network?"*  

  **Q3:** *"If we edit later-layer weights to rotate a feature direction without changing behavior, does the mosaic change? If not, how can we measure something causally inert?"*  
  **Expected Answer:** The mosaic persists because functional role (not direction) is real. Rotation is just measurement variance.  
  **Follow-up:** *"If the feature’s direction is arbitrary under behavior-preserving transformations, what causal powers does the mosaic have that aren’t reducible to network weights?"*  

  ---

  ### 2. α-Equivalence Challenges  
  **Q4:** *"α-equivalence depends on ‘some small number’ of features. If transitivity fails (dict A ≈ B ≈ C but A ≉ C), how can there be a single mosaic?"*  
  **Expected Answer:** Accept local equivalence; mosaics may have vague boundaries.  
  **Follow-up:** *"Doesn’t this vagueness collapse realism—making the mosaic’s existence as indeterminate as the ‘small number’ parameter?"*  

  ---

  ### 3. Granularity & Splitting  
  **Q5:** *"When wider dictionaries split features, you say the hierarchy is part of the mosaic. What fixes the grain of this hierarchy—the network architecture or the training data?"*  
  **Expected Answer:** The hierarchy emerges from the network’s learned computational structure.  
  **Follow-up:** *"If identically trained networks develop different splitting hierarchies, is the mosaic model-specific? Or if all networks inherit the same hierarchy, is it reducible to data?"*  

  ---

  ### 4. Basis Freedom  
  **Q6:** *"Beyond linear basis freedom, how much of the residual stream’s apparent structure is arbitrary under behavior-preserving transformations?"*  
  **Expected Answer:** Sparsity in activation space privileges certain bases.  
  **Follow-up:** *"If sparsity isn’t unique (e.g., due to permutations/scaling) and is just a human prior, how is measuring the mosaic different from imposing our biases?"*  

  ---

  ### 5. Unused Structure  
  **Q7:** *"How do you operationally distinguish a feature the network ‘exploits’ from one merely ‘present’ (e.g., via initialization)?"*  
  **Expected Answer:** Exploited features are those whose ablation changes outputs; mere presence lacks causal efficacy.  
  **Follow-up:** *"If ablating *any* random direction can alter behavior (due to high-dimensional chaos), doesn’t this test fail? What’s the counterfactual?"*  

  ---

  ### 6. Misrepresentation  
  **Q8:** *"For a model systematically asserting falsehoods, does a feature’s content depend on its causes (data statistics) or effects (downstream layers)?"*  
  **Expected Answer:** Both; content is fixed by the feature’s role in the computational pipeline.  
  **Follow-up:** *"If editing later layers changes a feature’s downstream effects but not its correlates, must we say its content changed—even if the earlier circuit is unaltered?"*  

  ---

  ### 7. What Settles Realism  
  **Q9:** *"What finding would make you abandon realism? For instance, if the mosaic were fully predictable from training data alone, with no network-specific details."*  
  **Expected Answer:** This would challenge realism, but she might retreat to a coarser mosaic.  
  **Follow-up:** *"If you and an instrumentalist agree on all interventionist predictions (steering, transfers, etc.), what *empirical* stake does the realism debate have? What can your view explain that theirs can’t?"*  

  ---

  ### Confidence Assessments (1-5, 5=highest)  
  1. **Q1/FU:** 5 (Core analogy pressure)  
  2. **Q2/FU:** 4 (Null baseline is implied in her framework)  
  3. **Q3/FU:** 3 (Least confident—she might deny causal inertness)  
  4. **Q4/FU:** 5 (Transitivity failure directly undermines equivalence)  
  5. **Q5/FU:** 4 (Hierarchy origin is unresolved in her summary)  
  6. **Q6/FU:** 5 (Sparsity is her stated privileged basis)  
  7. **Q7/FU:** 3 (Exploitation vs. presence is underspecified)  
  8. **Q8/FU:** 4 (Content must address error cases)  
  9. **Q9/FU:** 5 (Stakes question essential)  

  **Weakest Anticipation:** Q7’s "exploitation" test. Her manuscript doesn’t specify operational criteria, so she might propose a novel counterfactual (e.g., "Does the feature *robustly* correlate with circuit behavior?").  

  **Technical Note:** Your "α-equivalence on-distribution" setup assumes dictionaries approximate *the same* features across methods. If dictionaries recover genuinely disjoint sets (e.g., SAE vs. PCA), α-equivalence may fail—undermining the mosaic’s unity.  

  Each question isolates tensions in her view without restatement invitations. The follow-ups force engagement with implications she leaves unresolved.
