  First, I should identify the key problem areas they mentioned: cases where the fact is settled but unopened (like biopsy results), "if it weren't for" constructions with true antecedents, and asymmetric information scenarios where the speaker knows more than the audience. The user wants a requirements list for a theory of the indicative/counterfactual distinction that's practical for their annotation task, not just academically sound.

  Looking at their specific requests, I need to outline which cases must be classified. That includes past-tense counterfactuals with false antecedents, indicatives where the speaker thinks the antecedent is false (like Oswald-Kennedy examples), settled-but-unknown situations (sealed results or lottery tickets), future-directed conditionals with no commitment, "if not for" with true antecedents, and asymmetric-information pairs. Each of these has real-world examples that are causing disagreements among annotators, so handling them is non-negotiable for the project's success.

  Next, distinctions that mustn't be collapsed. The user emphasized semantic entailment vs. conversational implicature vs. presupposition. This is crucial because misattributing commitments could invalidate the classifier. Also, speaker's information vs. common ground—annotators are confusing what the speaker knows privately versus what's shared. Then, "commits to not-A" vs. "not knowing whether A," and author's commitments vs. reported ones. These distinctions prevent over-simplification and ensure accurate tagging.

  For phenomena to derive rather than stipulate, the list includes why "would" vs. "will" appears, why only one form works for offers/bets/threats, how adding detail flips judgments, why conflicting conditionals can both seem right with different info, and behaviors of "even if," embedding, etc. These need explanations to avoid arbitrary rules and build a consistent system.

  In the second half, I have to assess requirements as non-negotiable or preferential. Non-negotiables include handling asymmetric information correctly—since it's common in their corpus—and ensuring stability across annotators, as inconsistency ruins reliability. Tractability from surface cues is key because they can't access deep context in all cases. However, uniformity across types or full compositionality might be preferences depending on the theory.

  I suspect a tension between "get asymmetric-information cases right" and "classify from common ground alone." If classification relies only on shared context, it misses private knowledge, but requiring full speaker context might be impractical. This tension reflects a real challenge in conditionals, not just project confusion—pragmatic accounts struggle with embeddings, hinting at semantic depth.

  For theory scorecards: Lewis-Stalnaker similarity semantics handles counterfactuals well but stumbles on "if not for" and settled unknowns. Kratzer's restrictor view offers flexibility but may overcomplicate. Adams' probabilistic approach is great for indicatives but fails on embeddings. Dynamic semantics manages asymmetric info and embeddings dynamically but can be complex.

  Overall, I'm focusing on delivering actionable requirements that address their pain points, like annotator disagreements and ambiguous cases, while balancing theoretical rigor with practical constraints. The goal is to make their specification robust enough for real-world tagging, even if it means accepting some trade-offs.
answer: |-
  Here's the requirements list for an indicative/counterfactual distinction theory fit for your commitment-detection annotation specification, structured as requested:

  ### I. Classification Requirements (Cases the theory must handle)
  1.  **Past Counterfactuals (Antecedent taken as false):** *Case:* "If Oswald hadn't shot Kennedy, someone else would have." Speaker commits to antecedent's falsity. Non-negotiable (core counterfactual).
  2.  **False-Antecedent Indicatives:** *Case:* "If Oswald didn't shoot Kennedy, someone else did." Speaker (misinformed) believes antecedent false, uses indicative. Non-negotiable (Oswald/Kennedy cases).
  3.  **Settled-But-Unknown Antecedents:** *Case:* Biopsy result sealed; "If the result is malignant, we operate Friday." Speaker *doesn't know* but treats antecedent as settled fact. Non-negotiable (primary pain point).
  4.  **Future/Open Antecedents:** *Case:* "If it rains tomorrow (subjunctive: 'were it to rain'), the game will/would be canceled." Speaker commits to *nothing* about antecedent's truth. Non-negotiable (common future talk).
  5.  **"If not for"/"But for" with True Antecedents:** *Case:* "If it weren't for antibiotics, she would have died" (she took antibiotics). Antecedent is *true*, but construction forces counterfactual reading. Non-negotiable (breaks literal falsity expectation).
  6.  **Asymmetric Information Pairs:** *Case:* Speaker knows biopsy result (malignant), audience doesn't. Speaker says: "If the result is malignant [indicative], we operate Friday." Speaker commits to truth; audience hears open/agnostic. Non-negotiable (real-world discourse complexity).

  ### II. Critical Distinctions (Must *not* collapse)
  7.  **Semantic Entailment vs. Conversational Implicature vs. Presupposition:** *Case:* Does "If A, C" entail ~A (counterfactual)? Or implicate it? Or presuppose it? Tagging "commits to false" needs this distinction. Non-negotiable (misattribution risk).
  8.  **Speaker's Information vs. Common Ground:** *Case:* Asymmetric info cases & settled-unknowns. Annotator must separate what speaker knows privately vs. what is mutually assumed. Non-negotiable (core to commitment detection).
  9.  **Commits to ~A vs. Commits to Not Knowing A:** *Case:* Sealed biopsy vs. genuinely unknown future rain. Tagging scheme demands this separation. Non-negotiable.
  10. **Author's Commitment vs. Supposition/Fictionalization:** *Case:* "She said that if the result was malignant..." (reported speech). "Suppose that if it rains..." (supposition). Tagging must reflect the originating speaker's context. Non-negotiable.

  ### III. Phenomena to Derive (Not stipulate)
  11. **"Will" vs. "Would" in Consequents:** Why indicatives use "will" ("If it rains, it *will* cancel"), counterfactuals use "would". Must derive from core distinction.
  12. **Speech Act Compatibility:** Why "If you need a ride, I *will* drive you" (offer) works, but "If you needed a ride, I *would* drive you" (counterfactual) sounds odd/not an offer. Must explain restriction.
  13. **Antecedent Elaboration Effects:** *Case:* "If Alex came to the party..." (possibly true) vs. "If Alex came to the party *and got completely wasted*..." (likely false/counterfactual). Must explain flips.
  14. **Consistent Contradictions:** Why Speaker A (knowing A true): "If A, C". Speaker B (knowing A false): "If A, ~C". Both sound coherent within their contexts. Must be compatible.
  15. **Embedding Behavior:** How do "even if", "whether or not", subject-aux inversion, "suppose", and embeddings under attitude verbs/negation ("She doubts that if A, C", "It's not true that if A, C") affect commitment? Must project correctly.

  ### IV. Requirement Assessment & Tensions
  *   **Non-Negotiable:** 1-10, 15 (Embedding Projection - critical for reported speech), Stability across annotators (practical necessity), Tractability from surface cues + limited context (feasibility constraint).
  *   **Preferential/Camp-Specific:** Uniformity of treatment across types, Full compositionality, Conservatism about modality (e.g., avoiding "metaphysical" modality).
  *   **Most Exclusionary Requirement:** **#8 (Speaker Info vs. Common Ground Distinction).** Theories relying solely on common ground (e.g., strict pragmatic accounts) fail asymmetric info cases (#6) and settled-unknowns (#3) where speaker's private knowledge diverges.
  *   **Key Suspected Tension:** **"Get asymmetric-information cases right" (Requires speaker's private info/commitment) vs. "Classify every token from the common ground alone" (Requires ignoring private info).** This tension is **a finding about conditionals**, not project confusion. It reveals that the distinction fundamentally involves *whose knowledge state* is relevant (speaker's vs. mutual). A pure common-ground theory *cannot* capture the speaker's actual commitment in asymmetric cases. Embedding projection (#15) exacerbates this, as purely pragmatic accounts struggle to explain why the form (indicative/counterfactual) persists under "she said that...".

  ### V. Theory Scorecard (Families)
  1.  **Closest-World Similarity (Lewis-Stalnaker):**
      *   *Strengths:* Handles core counterfactuals (#1), derives "would" (#11), explains elaboration (#13).
      *   *Weaknesses:* Struggles badly with settled-unknowns (#3 - similarity undefined?), "if not for" true-A (#5 - antecedent true!), asymmetric info (#6 - common ground?), embedding (#15 - projection?).
  2.  **Modal Restrictor (Kratzer):**
      *   *Strengths:* Uniform treatment, handles many embeddings (#15), flexible w/modality, can model common ground.
      *   *Weaknesses:* Underdetermines indicative/counterfactual *distinction* without added (often stipulative) constraints. Struggles with speaker vs. CG (#8), settled-unknowns (#3), "if not for" (#5), deriving speech act restrictions (#12).
  3.  **No Truth Conditions / Conditional Probability (Adams):**
      *   *Strengths:* Excels with indicatives (#2, #4, #14), derives acceptability, aligns with "open" readings, handles probability.
      *   *Weaknesses:* Fails utterly on counterfactuals (#1 - no probability if A false?), embeddings (#15 - esp. under negation/attitudes), "would" (#11), settled-unknowns (#3 - probability undefined?), speaker vs. CG (#8).
  4.  **Dynamic Update Semantics (e.g., Veltman, Gillies):**
      *   *Strengths:* Explicitly models context/info states, handles asymmetric info (#6, #8) and embeddings (#15) dynamically, can derive projection behavior.
      *   *Weaknesses:* Complexity, varying implementations, can struggle with "if not for" (#5) and deriving surface cues (#11, #12) robustly. Tractability/annotator stability may be challenging.

  **Conclusion for Your Specification:** The tension between speaker commitment vs. common ground (#8) and the need for embedding robustness (#15) strongly suggest a **semantic** core to the distinction, augmented with pragmatics. Dynamic semantics or sophisticated restrictor views offer the most promising frameworks for your requirements, though significant work remains to operationalize them for annotation. Adams-style views are insufficient. Lewis-Stalnaker needs heavy modification. Prioritize requirements 3, 5, 6, 8, and 15 when evaluating theories for your rule set.
