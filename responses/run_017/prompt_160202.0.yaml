  ### Gated Forecast Case: The Portland Pursuer

  Alex, a whistleblower in Portland, leaked evidence of corporate fraud. The corporation hired a private investigator to locate Alex, with legal consequences if found. Alex must choose to stay in Portland or flee to Seattle. Fleeing incurs a $1,000 cost (last-minute travel, lodging, and relocation stress), modeled as a 10% utility reduction. The investigator uses Alex’s digital trail, known routines, and informants to predict Alex’s location. If Alex stays, the investigator’s filed expectation is Portland with 80% probability (Alex’s routine is predictable). If Alex flees, it is Portland with 40% probability (booking trails and dispersed destinations reduce predictability). The investigator searches only the filed city and finds Alex if and only if Alex is there. The base rate of the investigator filing Portland is 60% (reflecting initial uncertainty). Before deciding, Alex receives a report from a bribed clerk in the investigator’s office. The clerk’s report matches the filed city with 80% reliability but is independent of Alex’s action given the filed expectation.  

  **Decision Table**  
  Utilities: Caught = 0, Not caught in Portland = 100, Not caught after fleeing = 90 (due to $1,000 cost).  

  | State (Filed city) | Alex's Act | Utility | Probability (conditional on act) |
  |-------------------|------------|---------|----------------------------------|
  | Portland          | Stay       | 0       | P(Portland \| stay) = 0.8        |
  | Seattle           | Stay       | 100     | P(Seattle \| stay) = 0.2         |
  | Portland          | Flee       | 90      | P(Portland \| flee) = 0.4        |
  | Seattle           | Flee       | -10     | P(Seattle \| flee) = 0.6         |

  **Without the Gate (No Report)**  
