answer: |-
  Here’s a concrete example designed to break separability, followed by analysis of its implications for egalitarian justice:

  ### Case: **The Bilingual City Library**  
  **Setting:** A city with two linguistic communities (60% Anglophone, 40% Francophone) builds a new public library.  
  **Agents:**  
  - **Anna** (Anglophone): Values access to English books and English-language events.  
  - **François** (Francophone): Values access to French books and French-language events.  

  **The Dilemma:**  
  The library offers books/events in both languages, but the *quality* of access depends on *how many others participate*:  
  1. **Critical mass for events**: If fewer than 20% of attendees speak a language, events in that language are canceled (no speakers, low engagement).  
  2. **Book availability**: Book acquisition budgets respond to usage data; low-checkout languages get fewer new titles.  
  3. **Atmosphere**: Below 15% representation, speakers feel isolated and avoid the space.  

  Anna and François each have formal "equal access" (building entry, shelf space). But:  
  - If 90% attend English events, Anna gets vibrant discussions; François gets canceled events.  
  - If Francophones mobilize 40% participation, François gets rich programming; Anna’s access remains robust.  
  **What Anna *has* (meaningful access) depends on *what others do*—not prices, preferences, or individual conversion factors.**  

  ---

  ### Why This Breaks Separability  
  - **Not resources**: Equal funding per capita ignores network effects. Anna and François have identical "resource shares" (library cards, square footage), but François’ access evaporates without collective uptake.  
  - **Not welfare**: François’ frustration isn’t envy or an expensive taste—it’s the *objective collapse of service viability* below critical mass. Even with stoic preferences, his capability to use the library is nil.  
  - **Not capabilities**: François’s individual traits (literacy, mobility) are unchanged. The "conversion" problem is *ecological*: the capability "access to cultural community" exists only if enough others co-invest.  

  ---

  ### Which Currency Handles This Best?  
  **Capabilities** comes closest:  
  - It can frame "participation in public culture" as a functioning, acknowledging that *social conditions* (like linguistic critical mass) are conversion factors.  
  - **But it strains**: Standard capabilities focus on *individual* conversion (e.g., a wheelchair user needing ramps). Here, the capability *itself* is co-created. François’s functioning depends on *others’ functionings*—a non-individualist dimension.  

  Welfare and resources fail more severely:  
  - **Welfare** would pathologize François ("adjust your preferences") or demand compensation for his "taste" for French—misdiagnosing a structural flaw.  
  - **Resources** would declare equality satisfied by equal per-capita funding, ignoring that François’s share is *valueless* without critical mass.  

  ---

  ### Implications for the Site of Equality  
  1. **The three-way disagrement blurs**:  
     - All three metrics assume *atomism* (value attaches to persons separately). When goods are *inherently relational*, the debate shifts: not "which individual metric?" but "how to govern shared spaces?"  
     - The core question becomes: **Does egalitarianism require distributing *individual shares* or ensuring *collective opportunities*?**  

  2. **The case demands relational equality**:  
     - **What it buys**: Focus on *agency* and *power to co-determine conditions*. Here, equality requires:  
       - Protecting minority communities’ *voice* in library governance.  
       - Ensuring *non-domination*: Francophones can’t be unilaterally deprived by Anglophone choices.  
       - Guaranteeing *meaningful access* to public goods, not just nominal shares.  
     - **Why distribution falls short**: Even perfect individual distributions (e.g., equal books per language) fail if François’s community can’t *sustain* its niche. Equality must address *how social dynamics convert resources into lived freedom*.  

  **Conclusion**: This case shows that for *socially embedded goods* (language, digital networks, labor unions), equality cannot be assessed person-by-person. The three-way debate survives only if we artificially isolate individuals from their social ecology. Relational equality better captures what’s at stake: not just *what each has*, but *how we negotiate shared spaces* to prevent systemic marginalization. The "site" of justice expands from distribution to *social structure*.
