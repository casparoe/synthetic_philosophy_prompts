  For the analysis: capabilities handles it best because it can frame language as a "conversion factor," but even that strains when the good itself is relational. The deeper point is that equality's site must include collective dimensions - we can't assess justice just by summing individual baskets. This might push toward relational equality where the distribution of agency matters more than distributed goods.

