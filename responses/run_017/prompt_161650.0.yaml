prompt: |-
  Trying to figure out what I actually think about everyday conventions — tipping, queueing, jaywalking — by just going with my gut on cases rather than starting from a theory:

  - Cutting into a queue at a bus stop in a city where queueing is the norm: not ok.
  - Shouldering forward in the scrum at a bus stop where boarding has always been push-first: fine, that's how it works there.
  - Jaywalking at 2am, empty street, no cars, nobody around: totally fine, not even slightly.
  - Jaywalking on that same empty street while a school group waits at the corner and the kids are watching: not ok, and clearly worse than the 2am one even though the risk is identical.
  - Not tipping in a US sit-down restaurant where the servers wage assumes tips: not ok, feels like the worst item on this list.
  - Not tipping when the counter-service iPad swivels round with a 20% prompt and the barista is on a normal wage: fine.
  - Tipping in a country where tipping isnt a thing and the staff get a bit embarrassed: not really ok, but only barely.
  - A visitor from a scrum-norm country shoving ahead at a queueing-norm airport: not ok, they should queue.
  - A visitor from a tipping country leaving tips everywhere in a no-tip country: harmless, maybe faintly annoying for locals.
  - The case I keep flip-flopping on: refusing the small facilitation fee a border official expects, in a country where everyone pays it. My gut says refusing is fine, but if conventions generate obligations I can't see why this one is different from the airport queue.

  Tentative principle I've been playing with: you owe compliance to a convention only when other people are already stuck in it and have arranged their behaviour or their income around it (call it load-bearing), and your deviation either takes a benefit while skipping a cost everyone else is paying, or is visible enough to lower other people's expectation that folks will comply — which is what keeps the whole thing running. Where neither holds, its not a moral matter at all, just etiquette.

  So: does that principle survive my verdicts, especially the 2am-versus-kids pair and the bribe? Does it need an extra clause for conventions whose content is independently rotten, or does adding that clause just smuggle in ordinary morality and leave the word convention doing no work? Does anything here amount to a real duty to defer to local ways, or is it all downstream of reliance plus visibility? And what does your version predict for two cases I haven't listed: a local who stops tipping as a protest but hands each server a note explaining why, and a tourist who jaywalks in a city where literally everyone jaywalks?
reasoning: |-
  Okay, the user is exploring their moral intuitions about everyday conventions like tipping, queueing, and jaywalking. They've listed several scenarios and proposed a principle about when conventions create obligations. Let me unpack their thought process.

  First, they're trying to derive principles from gut reactions rather than top-down theory. That's smart—it keeps things grounded. Their tentative principle hinges on two conditions: "load-bearing" conventions (where people rely on them) and visible deviations that might erode the system. 

  Hmm, looking at their examples: The 2am jaywalking vs. kids-watching case is tricky. Risk is identical, but the presence of kids changes everything. Why? Because conventions aren't just functional—they're cultural scripts teaching norms. The kids aren't relying on the crosswalk system yet, but witnessing deviation might shape their future behavior. That's about norm transmission, not immediate reliance. 

  The bribe case is thorny. User feels refusing is fine despite their principle suggesting otherwise (since locals "rely" on the bribe system). But bribes are corrupt—so maybe rotten conventions get special treatment? If we add a "rottenness" clause, does that make "convention" redundant? Not necessarily. The rottenness exists independently, but the convention aspect explains why participating perpetuates harm. Refusing might actually weaken a bad system. 

  Their unasked cases are revealing: 
  - The anti-tipping protester with explanatory notes—this feels permissible because it's visible criticism rather than free-riding. Principle holds if we interpret "lowering compliance expectations" as applying only to silent defections. 
  - Tourist jaywalking where everyone does it—no issue. The convention isn't load-bearing (no one expects compliance) and deviation is invisible. 

  User's deeper struggle seems to be: "When do social practices create real moral duties versus just etiquette?" Their reliance+visibility framework is elegant, but might need to account for: 
  1. Norm pedagogy (the kids watching) 
  2. Systemic harm (bribes) 
  3. Intent of defiance (tipping protester vs. quiet non-tipper) 

  I’ll tweak their principle slightly: Visibility matters not just for erosion risk, but also when it functions as public modeling (good or bad). And rotten conventions create negative obligations—not just neutral "no duty" but active duty not to participate. That doesn’t duplicate ordinary morality; it explains why convention amplifies existing wrongs. 

  Final thought: User’s instinct that the bribe differs from tipping/queueing is correct. With bribes, others aren’t just "relying"—they’re victims. The "benefit skipped" is extorted. That shifts it from convention-as-coordination to convention-as-coercion.
answer: |-
  Your gut verdicts and tentative principle are remarkably coherent—they reveal a sophisticated intuition about social coordination. Let's stress-test your "load-bearing + visibility" principle against your cases and the open questions:

  ### Does your principle survive your verdicts?
  - **2am jaywalking vs. kids watching**:  
    ✅ **Principle holds**. At 2am, no one relies on compliance (no "load"), and no one sees it (no erosion risk). With kids present, your deviation *models norm-violation*, potentially eroding their future compliance—even if risk is identical. The visibility creates a "teaching effect" your principle implicitly captures.  

  - **Border bribe refusal**:  
    ⚠️ **Partial hold**. Locals *are* "stuck" paying (load-bearing), and refusing *might* erode the system... but your gut says it's fine. Why? **Rotten content matters**. Unlike tipping (which sustains livelihoods), bribes exploit. Your principle *needs* this distinction: conventions that *create injustice* nullify obligations. Refusal here is civil disobedience, not free-riding.  

  ### Does adding "rottenness" smuggle in morality?
  Not entirely—**conventions still do work**:  
  1. **Coordination function**: Tipping coordinates wage expectations; bribes coordinate corruption.  
  2. **Erosion mechanics**: Violating a rotten convention (bribes) *weakens* it; violating a benign one (queueing) *harms* cooperators.  
  3. **Reliance type**: Servants *rely* on tips; citizens *suffer* from bribes.  
  → "Rottenness" filters conventions where compliance itself is harmful. The convention framework explains *how* the harm propagates.  

  ### Duty to defer to local ways?
  **Downstream of reliance + visibility, not inherent**. Examples:  
  - Airport queue jumper (your case): Deference owed because queue-norm relies on universal buy-in; visible violation causes immediate disorder.  
  - Tourist jaywalking where locals all do it: ✅ **Fine**—no reliance (system adapts to jaywalking), no visibility issue (no one expects compliance).  
  - Tipping protest with explanation (your unlisted case): ❌ **Not fine** under your principle. Servers *rely* on tips; visible refusal erodes the system *even with explanation*. But if you add "rottenness" (tipping is exploitative), protesting becomes defensible.  

  ### Predictions for your unlisted cases:
  | Case | Principle Prediction | With "Rottenness" Clause |
  |------|----------------------|--------------------------|
  | **Local stops tipping with protest note** | ❌ Violates: Still exploits server reliance + visible erosion | ✅ **Permissible** if system is rotten (shifts burden to employer) |
  | **Tourist jaywalks where everyone does** | ✅ **Fine**: No reliance (system assumes jaywalking), no visibility issue | ✅ **Fine** (no independent rottenness) |

  ### Refined Principle:
  > **You owe compliance to a convention iff:**  
  > 1. **Load-bearing**: Others reasonably rely on it for welfare/coordination, AND  
  > 2. **Benign**: The convention isn't intrinsically exploitative/unjust, AND  
  > 3. **Visible**: Your deviation risks eroding compliance expectations.  
  >   
  > **Else**: It’s etiquette (or morally neutral/praiseworthy defiance).

  ### Why this works:
  - **Bribes**: Fail (2)—rotten content voids obligation.  
  - **2am jaywalking**: Fails (3)—no visibility, no erosion.  
  - **Kids-watching jaywalking**: Meets (3)—visibility enables social learning.  
  - **Counter-service tips**: Fails (1)—no wage reliance; just profit-seeking.  
  - **Tipping in non-tip cultures**: Fails (1)+(3)—no reliance + causes awkwardness (minor erosion).  

  **Final thought**: Conventions aren’t morally self-justifying—they’re tools. Your intuition nails that obligations arise from *human stakes* (reliance, erosion) and *moral stakes* (rottenness). The border bribe case proves you’re already applying this: rejecting extortion isn’t rude; it’s ethical.
