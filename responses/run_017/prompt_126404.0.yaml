  ## Memorandum: Renaming Jefferson Hall - Recommendation & Framework  
  **To:** University Naming Committee  
  **From:** [Your Name/Committee Role]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation & Principles for Honorific Naming  

  ### I. Core Function of Honorific Naming
  Honorific naming is not neutral history; it is *commemorative endorsement*. It signals institutional values, elevates specific legacies as aspirational models, and shapes community identity. When we name "Jefferson Hall," we implicitly affirm that Jefferson embodies ideals worthy of emulation *by a School of Public Policy*. The primary question isn't "Was Jefferson historically significant?" (he was), nor "Was he flawed by modern standards?" (he was). It is: **"Does commemorating *this* person in *this* context align with our institution's core mission and values *today*?"** Contradictions between the honoree's actions and the unit's purpose create untenable dissonance.

  ### II. Analysis of Proposed Rules
  *   **Dan's Role-Relative Rule:**  
      *   **Strengths:** Directly addresses commemorative dissonance. It prevents blanket condemnation while recognizing that certain actions fundamentally undermine the *specific* ideals an institution must uphold in a particular domain. Slaveholding is intrinsically antithetical to the foundational principles of public policy (justice, equality, human dignity) Jefferson himself espoused.  
      *   **Weaknesses:** Requires careful definition of "tied to." Strict application risks compartmentalization (e.g., excusing a botanist's racism). Determining relevance can be complex.

  *   **Priya's Baseline-Deviation Rule:**  
      *   **Strengths:** Acknowledges historical context and avoids simplistic presentism. Recognizing the constraints of past moral horizons is essential for fair historical assessment. Finding isolated dissenters *does* risk setting an impossibly high bar, as dissent exists on almost any issue.  
      *   **Weaknesses:** Its primary flaw is *relevance to commemoration*. Knowing someone met (or slightly exceeded) their era's low baseline doesn't make them worthy of *honor today*, especially when their actions directly contradict the values of the unit bearing their name. It risks entrenching moral mediocrity as sufficient for contemporary endorsement. Furthermore, it struggles with figures whose actions were *so* extreme they deviated negatively even from their own time's norms (e.g., Columbus's brutality shocked *some* contemporaries).

  ### III. Recommendation: Rename Jefferson Hall & Establish Contextualization/Legacy Program
  *   **Action:** Remove "Jefferson" from the School of Public Policy building.
  *   **Reasoning (Applying a Synthesis):** Jefferson's slaveholding and explicit racial hierarchy beliefs are not incidental flaws; they strike at the heart of public policy's purpose – shaping a just, equitable, and democratic society. Honoring him as the namesake for this specific school creates profound dissonance. While understanding his historical context is vital (*per Priya*), it does not negate the *current* incompatibility of his actions with the values the School must embody and teach. His monumental contributions to political theory and education are undeniable, but commemorating him *here*, in *this role*, undermines the School's mission.
  *   **Mitigation (Not Erasure):** Renaming should be paired with substantive action:
      1.  **Contextualization:** Install prominent, permanent signage at the building explaining the history of the name, Jefferson's complex legacy (contributions and contradictions), and the reasons for the change, linking it to the university's evolving commitment to its core values.
      2.  **Legacy Program:** Establish a named "Jefferson Legacy Program" *within* the School focused explicitly on studying historical injustice, the contradictions within foundational democratic ideals, or the ethics of public leadership. This acknowledges his historical significance and institutional connection while directing focus to critical learning *from* his legacy, not uncritical celebration *of* it.

  ### IV. Losing Side's Strongest Consideration (Fair Hearing)
  **Priya's Baseline-Deviation Rule:** The strongest argument against renaming is the genuine risk of **presentism** – imposing today's fully formed moral frameworks on individuals who lacked the historical, intellectual, and social resources we possess. Expecting Jefferson to single-handedly overcome the pervasive economic, social, and intellectual structures upholding slavery across centuries, based on nascent abolitionist sentiments held by a tiny minority, *is* arguably unfair as a measure of his personal moral failure. Holding historical figures to an impossible standard of modern wokeness can distort history and make meaningful commemoration of *any* past figure impossible. We *must* understand Jefferson within the constraints of his 18th-century Virginia context to fairly assess his choices, even as we judge their consequences.

  **Counter:** While historical context is essential for *understanding*, it is insufficient justification for *commemoration* in a specific, value-laden role. Our duty is not only to judge Jefferson fairly by the standards possible in his time, but also to decide *whom we choose to honor now* based on the values we must uphold *today* in our specific institutional roles. Commemorating him as the exemplar for a *Public Policy School* perpetuates a harmful disconnect between ideals and practice. Contextualization fulfills the duty of historical understanding; renaming addresses the duty of ethical commemoration.

  ### V. Proposed General Rule & Application to Churchill & Columbus
  *   **Rule: The Role-Relevance Principle with Contextual Imperative**  
      An honorific name should be removed if the honoree engaged in significant wrongdoing that **fundamentally contradicts the core values or purpose of the specific unit bearing the name**, even considering historical context. Removal should generally be accompanied by meaningful contextualization to educate about the history and the reasons for change. Mere "man of his time" status is insufficient grounds for retention *if* the wrongdoing is role-relevant. Significant positive deviation from era norms is relevant but not necessarily decisive for retention if the wrongdoing remains fundamentally incompatible with the unit's mission.

  *   **Application:**
      *   **Churchill Scholarship Fund (e.g., for Leadership/History):** **Retain name, with mandatory contextualization.** Churchill's leadership in WWII is profoundly relevant to a leadership/history scholarship. His racist views (e.g., on India/Bengal Famine) and imperialism are reprehensible and contradict modern values of equality. However, they are arguably less *directly and fundamentally* tied to the core purpose of recognizing *wartime leadership/resolve in extremis* than Jefferson's slaveholding is to public policy principles. Contextualization explaining his complex, controversial legacy is essential.
      *   **Columbus Mural (e.g., celebrating Discovery/Exploration):** **Remove, with contextualization.** Columbus's actions (enslavement, brutality, initiating colonial devastation) fundamentally contradict any modern celebration of "discovery" or "exploration" intended as uncomplicatedly positive. His deeds deviated *negatively* even from some contemporary Spanish norms regarding treatment of indigenous peoples. Commemorating him in this context endorses a narrative of progress built on atrocity. Removal is warranted, paired with contextualization explaining the historical myths and realities of colonization.

  ### VI. Conclusion
  Honorific naming demands discernment between historical significance and contemporary commemoration. For Jefferson Hall, the role-relevance of his profound moral failing to the mission of a School of Public Policy necessitates renaming. This action, paired with contextualization and a dedicated legacy program, respects historical complexity while affirming the university's current values. Applying the Role-Relevance Principle with Contextual Imperative provides a clear, values-driven framework for future decisions like Churchill and Columbus, balancing historical understanding with ethical responsibility in our commemorative choices. I recommend we rename Jefferson Hall and adopt this framework.
