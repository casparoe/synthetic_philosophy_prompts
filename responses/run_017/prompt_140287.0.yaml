answer: |-
  ## Joint Statement on the Utility Monster: Aggregationist vs. Separateness-of-Persons Views

  **Preamble:** This document outlines areas of agreement and disagreement between the Aggregationist (A) and Separateness-of-Persons (S) views regarding the "Utility Monster" thought experiment and its implications for distributive ethics. The thought experiment posits a being (the "Monster") who derives vastly more welfare from each unit of resource than any other individual. The core dispute concerns whether this case reveals a fatal flaw in welfarist aggregation (S) or is a clarifying device highlighting specific empirical/conceptual assumptions (A).

  ### 1. Agreed Claims

  1.  **Purpose:** The utility monster case is primarily employed as a *reductio ad absurdum* against simple sum-total utilitarianism, aiming to show that unrestricted aggregation across individuals can lead to counterintuitive or morally repugnant implications (dumping all resources on the Monster).
  2.  **Modal Scope:** The case is primarily intended as a **modal** challenge: it targets theories by showing that *if* such a being were possible, the theory mandates feeding it everything. Its force as a reductio does *not* depend on the actual empirical existence of such a being in our world.
  3.  **Empirical Relevance Unsettled:** Whether any being *empirically* approximating the extreme characteristics of the monster (especially regarding unbounded welfare-per-resource curves or interpersonal welfare ratios) is nomologically possible is an open question relevant to the *practical* significance of the case, but not necessarily to its *conceptual* force.
  4.  **Prioritarianism & the Greedy Monster:** A strict prioritarian view (discounting the welfare of the better-off) *mitigates* the demand to feed a **Greedy Monster** (high baseline, steep, unsatiated curve) because the Monster's high baseline reduces the priority weight given to its marginal gains relative to gains for the worse-off.
  5.  **Sufficiency View & Monsters:** A strict sufficiency view (focusing only on bringing individuals above a welfare threshold) would *not* mandate feeding a monster beyond the point where it reaches sufficiency, regardless of its capacity for further gains below or above the threshold. Resources would be directed to those below the threshold first.
  6.  **The Wide Monster:** If the "Monster" is actually a **Wide Monster** (a large collective of individuals organized as a single claimant), feeding it resources may be justified under both aggregationist and many non-aggregationist views *if* it demonstrably benefits many individuals, shifting the debate to aggregation *within* the collective and the ethics of collective agency/representation.

  ### 2. Key Distinctions & The Monster-Elicitation Lemma

  *   **Greedy Monster:** High baseline welfare, steep *and unsatiated* welfare-per-resource curve. Remains demanding for utilitarianism; mitigated by prioritarianism.
  *   **Deep Monster:** Very low baseline welfare, with enormous welfare-per-resource gains available *from that low baseline*. Potentially highly demanding even under prioritarianism.
  *   **Wide Monster:** A large collective entity treated as a single claimant/agent. Raises distinct issues regarding aggregation levels and representation.
  *   **Monster-Elicitation Lemma (MEL):** Any axiology satisfying:
      (i) **Welfarism:** Only individual welfare matters.
      (ii) **Monotonicity:** Increasing any individual's welfare (ceteris paribus) improves the outcome.
      (iii) **Anonymity & Separability:** Permuting individual welfare levels doesn't change outcome value; the value of a subpopulation depends only on its members' welfare.
      (iv) **Unbounded Contribution:** No upper limit on how much a single individual's welfare contributes to the overall value.
      ...is **Monster-Eliciting:** For any resource allocation, there exists a *possible* being such that the theory ranks giving all resources to that being above the original allocation.

  *   **A's Position:** The MEL is likely **true** for theories satisfying (i)-(iv). The flaw lies in (iv) - **Unbounded Contribution**. Real individuals plausibly have satiable preferences and bounded welfare functions. Accepting boundedness (empirically or conceptually) blocks the lemma. Would **retain (i), (ii), (iii)**. Views like prioritarianism satisfy (i)-(iii) but reject (iv) via discounting, thus escaping the lemma.
  *   **S's Position:** The MEL demonstrates a **structural flaw** in any theory satisfying (i)-(iv). The unboundedness in (iv) is primarily a **conceptual** flaw in the aggregationist framework itself, revealing its inability to respect the distinct moral status of individuals. The potential empirical implausibility of such beings is irrelevant to this conceptual point; the theory's *structure* is faulty.

  ### 3. Key Disagreements

  | Disagreement Point          | Aggregationist (A) Position                                                                 | Separateness-of-Persons (S) Position                                                                                              | Neutral Formulation                                                                                              | Notes                                                                                                  |
  | :-------------------------- | :------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------- |
  | **Monster as Reductio**     | The case is **not** a reductio of aggregation *per se*; it highlights the critical role of **empirically plausible interpersonal comparisons** and **bounded welfare functions**. | The case **is** a successful reductio against the core structure of unrestricted welfarist aggregation, revealing its fundamental incompatibility with the **separateness of persons**. | Whether the utility monster case demonstrates a fatal conceptual flaw in welfarist aggregation or merely identifies specific, manageable assumptions it requires. | **Crux:** Linked to the MEL and views on boundedness/normalization.                                      |
  | **Role of Boundedness**     | **Empirical boundedness** of welfare gains is sufficient to block the *practical* monster problem; aggregation remains sound conceptually. | **Conceptual boundedness** must be built into the *theory's structure* (or rejected entirely) to respect moral constraints; empirical boundedness is insufficient and misses the point. | Whether the potential for monsters is adequately addressed by the empirical implausibility of unbounded welfare or requires a fundamental theoretical modification. |                                                                                                          |
  | **Deep Monster & Prioritarianism** | Prioritarianism significantly **mitigates** the **Deep Monster** problem by heavily weighting gains at low baselines, likely preventing "dump everything" verdicts in plausible scenarios. | Prioritarianism only **moderates, not eliminates**, the monster problem. Discounting factors might be **overwhelmed** by sufficiently massive gains at low baselines, still potentially demanding excessive sacrifice. | The extent to which prioritarianism successfully avoids counterintuitive implications in cases of beings with massive welfare gains from a very low baseline. |                                                                                                          |
  | **Normalization of Welfare Scales** | The *apparent* existence/scale of a monster depends critically on the **interpersonal welfare comparison convention** (e.g., range, variance). No single convention is non-arbitrary; plausible constraints often prevent extreme ratios. | The monster problem exposes the **arbitrariness** inherent in interpersonal comparisons required for aggregation. No non-question-begging convention avoids the potential for monster-like comparisons under aggregation. | Whether the threat posed by the utility monster depends on resolvable (though complex) issues of welfare measurement or reveals an insurmountable problem of arbitrariness. | **Potentially Verbal/Methodological:** Disagreement on whether a satisfactory resolution to the normalization problem is possible or if it's intractable. |

  ### 4. Cruxes & Pre-registered Predictions

  *   **Crux 1: Structural Objection vs. Fairness/Sacrifice**
      *   **Case:** The **Worst-Off Monster:** A being at the absolute lowest welfare baseline, experiencing immense suffering, for whom even small resources yield enormous welfare gains. No other individual is coerced or has core projects/agency undermined by transferring resources (e.g., resources are manna-from-heaven).
      *   **A Prediction:** Under prioritarianism, transferring substantial (but not necessarily *all*) resources to the Worst-Off Monster will be mandated, which is **intuitively correct** given its profound suffering and huge capacity to benefit. This validates aggregation/prioritarianism.
      *   **S Prediction:** The intuition that transferring *all* resources (or even a vast majority) remains **wrong**, despite the lack of coercion/loss, persists. This reveals a **structural objection** to maximizing aggregate (or prioritized) welfare across persons, regardless of fairness/sacrifice concerns. The separateness of persons demands a constraint against such extreme demands on behalf of one, even the worst-off.

  *   **Crux 2: Realistic Monster Verdicts**
      *   **Case:** **Bounded Realistic Monster:** Evidence shows Being X gains ~50x typical human welfare per unit resource across a wide range (no saturation within feasible resource limits).
      *   **A Prediction:** Verdict **changes in degree, not kind.** Aggregation mandates allocating *more* to X than to others with equal priority weight, but not *everything*, due to diminishing marginal returns (even if steep) and the needs of others. Prioritarianism further tempers this if X is not worst-off.
      *   **S Prediction:** Verdict remains **fundamentally different in kind.** Aggregation still mandates prioritizing X *disproportionately* based solely on its extreme efficiency, which remains **morally objectionable** as it fails to respect the equal status of others. Their theory avoids this disproportionate demand.

  *   **Crux 3: Monster of Justification**
      *   **Case:** **Monster of Justification:** One individual (Y) has an enormous, unavoidable complaint in any state of the world except one where it receives nearly all resources (e.g., due to a unique, severe disability only alleviated by massive resource input). Everyone else has only small, easily satisfiable complaints under alternative distributions.
      *   **A Prediction:** Contractualist/sufficiency views **escape** the classic monster demand. Y's complaint might be large, but the theory would not mandate sacrificing *everyone else's* minimally decent level (sufficiency) or would find a distribution justifiable to others who also have complaints, however small.
      *   **S Prediction:** While not mandating "dump everything," this case **relocates the pressure.** Justifying any policy *to Y* might become extremely difficult or impossible without massive concessions, potentially leading to paralysis or intuitively excessive demands on others, revealing a **similar structural tension** within justifiability frameworks when complaints are radically asymmetric.

  ### 5. What Would Move Us

  *   **Aggregationist (A):** "If compelling evidence emerged that sentient beings can have *literally unbounded and linear* welfare-per-resource functions across *all* resource levels *and* that reliable interpersonal comparisons could justify ratios exceeding any finite bound, I would abandon strict aggregation. Short of that, evidence of *extreme but bounded* gains (e.g., 1000x human efficiency) would make me emphasize prioritarianism and sufficiency constraints more strongly within aggregation."
  *   **Separateness-of-Persons (S):** "If a robust, non-arbitrary method for interpersonal welfare comparisons emerged that was universally accepted and *could not* generate monster-like prioritization under *any* plausible aggregation rule (including variants like prioritarianism) applied to any possible being, I would reconsider the necessity of abandoning aggregation. Demonstrating that contractualism/sufficiency inevitably leads to paralysis or equally counterintuitive results in Monster-of-Justification cases *without recourse to aggregation* would also be significant."

  **Drafter's Note:** The weakest agreed claim is likely **Claim 4 (Prioritarianism & the Greedy Monster)**. While both agree prioritarianism *mitigates* the greedy monster, the underlying disagreement about *how* prioritarianism works (A: discounting via a concave transformation applied *before* aggregation; S: potentially viewing it as insufficient or still aggregating discounted welfare) and the unresolved threat of the **Deep Monster** (Claim 2 distinction) suggests this agreement papers over a live dispute about prioritarianism's ultimate vulnerability. The reasoning around the **Monster-Elicitation Lemma (MEL)** is also a critical potential fault line. The drafter judges that the debate's resolution hinges most crucially on the **normalization problem** (Disagreement 4) – whether a non-arbitrary solution exists that satisfies both camps. If none can be found, S's structural objection gains force; if one can, A's position becomes more defensible. The document's treatment of this is necessarily brief and may underestimate its complexity or overestimate the neutrality possible in framing it.
