answer: |-
  Here is the diagnostic instrument designed to your specifications. It uses concrete cases to sort readers into positions on the politics of artifacts without naming theories or requiring prior knowledge. The structure prioritizes logical distinctions over labels, and the scoring maps answer patterns to the positions you outlined.

  ---

  ### **Diagnostic Questions**  
  *(Readers choose one option per question)*  

  1. **Shared Thermostat**  
     A smart thermostat in a rental home learns one tenant's schedule but ignores others', making the house uncomfortable for them.  
     - A: The flaw is in the thermostat’s design—it should learn from everyone.  
     - B: The problem is the tenant who controls it—the thermostat is just a tool.  
     - C: The design should let others override it easily—then it’s fair.  

  2. **Hospital Shift App**  
     An app lets nurses drop shifts instantly but doesn’t let them offer shifts to specific colleagues, only to a general pool.  
     - A: The app’s design stops nurses from helping friends—it should allow direct offers.  
     - B: The app isn’t the problem—hospital policy dictates how it’s used.  
     - C: Nurses can text colleagues to grab shifts from the pool—it’s workable.  

  3. **Tomato Harvester Decision**  
     *(Rewritten as uncertainty)* A new harvester only picks one type of tomato efficiently. Farmers switch to that type, but some say tastier heirloom varieties will vanish.  
     - A: The harvester forces this change—it should’ve been designed for diversity.  
     - B: Farmers chose to switch—they could’ve kept heirlooms with manual labor.  
     - C: The problem isn’t the harvester—it’s the lack of research on harvesting heirlooms.  

  4. **School Laptop Webcam**  
     A school-issued laptop lets administrators remotely enable its webcam without warning. The school says it’s for security.  
     - A: The feature is invasive—it shouldn’t exist at all.  
     - B: With strict rules and audits, it’s acceptable.  
     - C: The issue is school ownership—students should use personal devices.  

  5. **Parkway Overpasses**  
     *(Rewritten as uncertainty)* A city builds low overpasses on a scenic parkway to preserve views. Buses can’t use the route, but planners say they didn’t intend to exclude buses.  
     - A: The design excludes buses—height should accommodate all vehicles.  
     - B: The problem isn’t the overpasses—it’s the lack of bus alternatives.  
     - C: The overpasses are fine—if buses need access, build new roads.  

  6. **Cooperative Delivery Platform**  
     A worker-run app was designed to flatten hierarchy, but members now use it to rank each other’s punctuality, creating competition.  
     - A: The design should’ve prevented ranking—it betrays the cooperative goal.  
     - B: The members created this problem—the app itself is neutral.  
     - C: The app’s flexibility is good—it adapts to what members want.  

  7. **Traffic App Congestion**  
     *(Population-scale case)* A navigation app directs each driver to the fastest route. Individually it saves time, but at scale it floods residential streets.  
     - A: The app’s algorithm should prioritize community impact over individual speed.  
     - B: The app isn’t at fault—cities need better traffic rules.  
     - C: Residents can avoid those streets, but it doesn’t solve the systemic issue.  

  8. **Self-Checkout Aisles**  
     A store replaces cashiers with self-checkout machines. Regulars find it faster, but some workers lose jobs.  
     - A: The machines are meant to cut jobs—they shift labor to shoppers.  
     - B: The machines are neutral—management decides staffing.  
     - C: Workers can be retrained—the machines improve service.  

  9. **Bench Armrests**  
     *(Prevention-focused case)* A public bench has armrests that prevent lying down. Some say it’s anti-homeless; others say it helps the elderly sit safely.  
     - A: The design is hostile—remove the armrests.  
     - B: The issue is lack of shelters, not the bench.  
     - C: The armrests help some people—the design serves multiple needs.  

  ---

  ### **Scoring Key**  
  *(Maps answer patterns to positions)*  
  - **Weighting**:  
    - Q1, Q6, and Q9 are **load-bearing** (2 points each). They isolate core distinctions (designer intent vs. user repurposing, prevention as harm, labor relations).  
    - Other questions = 1 point.  
  - **Tie-break rule**: If scores are tied, use Q9 (bench armrests) as the decider. If Q9A, prioritize positions emphasizing inherent harm; if Q9B, neutral-instrument views; if Q9C, socially constructed views.  

  **Position Assignments** (based on recurring answer patterns):  
  1. **Artifacts as neutral instruments**  
     - *Gloss*: Tools get their politics only from how people use them.  
     - *Consequence to swallow*: A gun in a safe and a gun in a crime are the same object—you must blame users, not design.  
     - *Answers*: Majority B’s, especially Q1B, Q4B, Q8B.  

  2. **Technology as autonomous driver**  
     - *Gloss*: Tech changes society in ways no one controls, like a new law of physics.  
     - *Consequence*: Even if you hate social media’s effects, you can’t stop them—they’re inevitable.  
     - *Answers*: A’s in Q3, Q5, Q7.  

  3. **Artifacts as inherently political**  
     - *Gloss*: Some designs require or enforce social outcomes (e.g., hierarchies).  
     - *Consequence*: "Neutral" redesigns of oppressive tools often fail—the function itself is the problem.  
     - *Answers*: A’s in load-bearing questions (Q1A, Q6A, Q9A).  

  4. **Politics in the development process**  
     - *Gloss*: Power sits in who designs, funds, or owns the tech—not the finished product.  
     - *Consequence*: A community-built tool is "clean" even if it works identically to a corporate one.  
     - *Answers*: B’s in Q2, Q4, Q5; C in Q9.  

  5. **Social-constructivist view**  
     - *Gloss*: Meaning isn’t fixed; communities decide what tech does through conflict/consensus.  
     - *Consequence*: A surveillance camera could become art—you can’t call it "oppressive" until people react.  
     - *Answers*: Majority C’s, especially Q1C, Q6C, Q9C.  

  6. **Artifacts as delegated social relations**  
     - *Gloss*: Tech embeds human rules (e.g., contracts, norms) into material form.  
     - *Consequence*: An app’s code isn’t biased—it’s just enforcing the insurer’s demands you agreed to.  
     - *Answers*: C’s in Q2, Q5, Q7.  

  7. **Critical theory (technical code)**  
     - *Gloss*: Designs encode power but can be hacked/rebuilt by marginalized groups.  
     - *Consequence*: Fixing tech’s biases requires constant conflict—no design is ever "finished."  
     - *Answers*: C’s in load-bearing questions (Q1C, Q6C, Q9C) + A in Q4.  

  8. **Feminist-STS claim**  
     - *Gloss*: Bias (e.g., gender, race) is baked into ergonomics and design choices.  
     - *Consequence*: "Apeshit" fits most hands because designers assumed male users—fairness needs redesign.  
     - *Answers*: A’s in Q1, Q2, Q6.  

  9. **Postphenomenological view**  
     - *Gloss*: Tech reshapes what we see as moral choices (e.g., a filter hiding poverty).  
     - *Consequence*: You can’t "resist" an algorithm—it alters how you perceive the problem itself.  
     - *Answers*: C’s in Q3, Q7, Q9.  

  10. **Hostile design as harm**  
      - *Gloss*: Tools meant to exclude (e.g., anti-homeless spikes) are immoral and must be removed, not tweaked.  
      - *Consequence*: Even if armrests help the elderly, their harm to the homeless outweighs it.  
      - *Answers*: A’s in Q8, Q9; B in Q4.  

  **Unseparated Pairs**:  
  - **Feminist-STS vs. Inherently Political** collapse under this instrument (both score high on A’s). They share a focus on design-driven bias but diverge on whether bias is *specific* (e.g., gender) or *systemic* (e.g., class). To split them, add: *"A voice assistant struggles with non-American accents. Is this a flaw in its training data (Feminist-STS) or a sign that AI can’t handle complexity (Inherently Political)?"*  
  - **Social-Constructivist vs. Delegated Relations** also overlap (both favor C’s). The latter insists tech *enforces* social rules, while the former sees meaning as open-ended.  

