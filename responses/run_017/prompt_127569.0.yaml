  2. Whether rebuilding the same function in a different material form removes the political character. (Material Form)
  3. Whether the artifact determines outcomes or merely inclines them, and whether resistance or workaround counts as a refutation. (Determinism vs. Inclination)
  4. Whether the politics is located in the labour and ownership relations of production or in the moment of use. (Production vs. Use)
  5. Whether the possibility of exit, refusal, or redesign dissolves the political character. (Exit Option)

  We choose four questions that cover these and are mutually independent enough to create a branching structure.

  After analyzing the positions, we note that the key distinctions that will sort the positions are:

  Question A (Intention vs. Use): 
     - If the artifact's politics changes when users repurpose it, then the politics is in the use. 
     - If the politics remains even when repurposed, then it's in the artifact itself.

  Question B (Material Form): 
     - If changing the material form (but keeping the function) removes the politics, then the politics is tied to the material. 
     - If not, then the politics is in the function or the social relations.

  Question C (Determinism vs. Inclination): 
     - If an artifact determines outcomes (so that resistance is futile) then it's deterministic. 
     - If it merely inclines and resistance is possible, then it's non-deterministic.

  Question D (Production vs. Use): 
     - If the politics is in how it was made (labour, ownership) then production. 
     - If in how it is used, then use.

  But note: We must have at most 4 questions to keep the instrument short. We can combine some aspects.

  Alternatively, we can structure the questions as:

