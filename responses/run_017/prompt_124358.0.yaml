     - Why: The central hoard might be a store of tokens that were collected, but the simplicity of the tokens and the fact that they are in houses could also mean they were used for something else (like gaming or ritual). 
     - What would move it: If tokens were found in stratified layers (showing accumulation over time) that would raise the probability; if all tokens were identical and found in a single context, it might lower it.

  3. **Big room as an office**: Does the big room with benches and a hearth (and no domestic features) indicate a space used for a standing office (rather than just a communal meeting place)?
     - Probability: 0.65 (The absence of domestic features suggests it wasn't a residence, and the benches might be for meetings. But it could be a communal hall without a single leader.)
     - Weight: 20% (It's a non-domestic structure, which is important)
     - Why: The room is the largest and non-residential, so it likely had a public function. But that function might not require a single office holder.
     - What would move it: If there was evidence of exclusive use (like a single seat of honor) that would raise it; if it showed evidence of frequent group activities (like many hearths) that might lower it.

  4. **Absence of weapons and coercion**: Does the absence of weapons suggest a lack of internal coercion, making a standing office more likely to be non-coercive (and thus perhaps more dependent on institutional authority)?
     - Probability: 0.5 (I don't think this is very informative. The absence of weapons might mean the society was peaceful, but it doesn't directly tell us about the existence of an office. It might make coercion less likely, but an office could be coercive without weapons? Or it might be that weapons just didn't preserve. Also, the wall might be defensive, but no weapons found inside.)
