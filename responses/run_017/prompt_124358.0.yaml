answer: |-
  ### Analysis of the Claim: "The settlement had a durable office"

  I'll decompose the claim into key sub-questions, assign probabilities and weights, then combine them for an overall credence. The claim requires evidence of a *durable role* (continuous/repeated, identifiable, institutionally distinct from individuals), not just ad hoc influence. I define "office" as a role that persists beyond its holder (e.g., through succession or reappointment) and is socially recognized. The alternative is purely situational leadership (no formal role). 

  The probabilities reflect the likelihood that the evidence supports the claim, based on typical archaeological inferences. Weights represent the term's relative importance to the final answer. I assume independence for simplicity (though some overlap exists), and use a weighted average for combination.

  #### Probability Breakdown
  | sub_question | your_probability | weight | one_line_why | what_would_move_it |
  |--------------|------------------|--------|--------------|-------------------|
  | Wall construction/rebuilding requires sustained coordination (not just one-off mobilization) | 0.75 | 25% | Rebuilding implies recurring oversight; 800 person-days suggests organized labor beyond voluntary groups. | Evidence of phased construction by different groups (→ lower) or uniform techniques (→ raise). |
  | Token hoard in big room represents periodic collection (e.g., tax/tribute) not a single event | 0.60 | 30% | 400-token pit + scattered tokens suggests accumulation over time, but single mold-type allows rapid creation (weakens periodicity). | Stratified deposits showing token layers (→ raise) or identical wear/context (→ lower). |
  | Big room functioned as a dedicated administrative/ritual space (not just a communal gathering spot) | 0.70 | 20% | Non-residential, centralized, and lacking domestic tools implies formal use, but benches/hearth could support group meetings. | Exclusive artifacts (e.g., seals) (→ raise) or evidence of domestic spillover (→ lower). |
  | Absence of weapons indicates low coercion, favoring institutional over personal authority | 0.55 | 10% | No weapons suggests peaceful resolution, but coercion can be non-weapon-based (e.g., economic). | Weapon fragments in trash (→ lower) or trauma on bones (→ lower). |
  | Material patterns can distinguish a standing office from stable individual rule | 0.45 | 15% | Objects alone struggle with this; tokens/wall could reflect either, but rebuilding hints at continuity beyond one person. | Evidence of role-rotation (e.g., varied token styles) (→ raise) or a single "royal" burial (→ lower). |
  | **overall_credence** | **0.64** |  | Weighted average of above terms. |  |

  - **combination_rule**: Weighted average (sum of `probability * weight` for all terms).  
  - **most_sensitive_term**: Token hoard represents periodic collection (weight 30%, probability 0.60). Small shifts here disproportionately affect the outcome due to high weight and middling probability (e.g., raising it to 0.75 increases overall by ≈0.045).  
  - **where_the_disagreement_lives**: You (0.55) and Marcus (0.85) disagree most on the **token hoard**. Marcus likely sees the 400-token pit as clear evidence of recurring administration (→ high periodicity probability), while you (and I) emphasize the two-mold simplicity, which weakens the case for sustained collection. You also probably weight the "distinction from individual rule" sub-question more heavily (I have it at 15%, but you might assign >25%).  
  - **one_thing_you'd_defend**: The wall's rebuilding is the strongest evidence for a durable office. A one-off project could be ad hoc, but three iterations suggest institutionalized coordination—unlikely without a role transcending individuals.  

  #### Final Credence: **0.64**  
  This leans slightly toward the claim being true but reflects ambiguity. The wall and big room suggest organization, but tokens and no weapons don't decisively confirm a *durable office* over informal leadership. Marcus's 0.85 overweights the token hoard's administrative signal, while your 0.55 reasonably accounts for the two-mold issue and the difficulty of distinguishing offices from individuals archaeologically. If I could excavate one thing, I’d target the **token pit** for micromorphology—if layers show incremental deposits, probability rises to 0.75+.
