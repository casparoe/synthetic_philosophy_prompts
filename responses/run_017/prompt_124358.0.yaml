     - What would move it: Finding weapons would lower the probability of a non-coercive office, but not necessarily the existence of an office.

  5. **Material patterns vs. stable individual**: Can the material patterns (as described) distinguish a standing office (with possible role rotation) from stable deference to a single individual?
