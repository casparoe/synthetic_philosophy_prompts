  First, I need to recall related concepts. "Death of the author" comes to mind, but the user already dismissed it as irrelevant since readers aren't debating interpretation. Contagion heuristic and moral typecasting from psychology might fit, as they deal with how moral taint spreads and how roles are fixed. The proximity aspect reminds me of thematic resonance, where content matching the transgression intensifies the effect. Temporal decay over time is another factor.

  The user mentioned that their readers aren't just boycotting; it's a deeper inability to engage. So, distinguishing this from simple boycotts or loss of trust is important. Also, cases where biographical info clarifies a misread passage differ because they affect interpretation, not the ability to engage. 

  I should synthesize these elements into a new term. "Aesthetic severance" captures the cutting off of engagement, while "moral-artistic dissonance" emphasizes the conflict. But the user wants the phenomenon's structure, so maybe "moral tainting" with specific attributes: locality, global withdrawal, asymmetry, thematic sensitivity, and temporal decay. 

  Next, boundary cases: Boycotts are intentional and political, not psychological. Trust loss might prevent belief in the author's statements, but here it's about emotional engagement. Biographical clarification alters meaning, whereas here meaning stays the same, but the emotional resonance shifts. 

  Essential features seem to be the locality of the identified flaw versus global withdrawal, and the thematic proximity. The asymmetry and temporal decay might be common but not universal. For example, if a living author makes amends, does the effect reverse? The user's observations suggest not, reinforcing asymmetry.

  Also, considering if this applies beyond literature—like music or art. A composer's misconduct might taint a song with relevant lyrics but not an instrumental piece. Historical distance lessens the effect, similar to the author's death. 

  The invented term needs to encapsulate the core: moral contamination leading to inability to aesthetically engage. "Affective severance" highlights the emotional disconnect, while "moral-artistic entanglement" reflects the inseparable link. But perhaps "Transferred Aesthetic Rupture (TAR)" with defined properties. 

  In conclusion, the phenomenon is a specific psychological response where moral judgment disrupts aesthetic experience, distinct from related concepts. The name should reflect its unique structure, and boundaries clarified through comparison.
answer: |-
  This phenomenon absolutely has distinctive contours worth naming. It's not captured by existing single terms, but intersects several concepts. I propose **Affective Severance** as the core mechanism, operating within a framework of **Moral-Artistic Entanglement**.

  ### Defining Affective Severance
  *   **Core Mechanism:** The psychological process where knowledge of an artist's transgression severs the reader's capacity for aesthetic immersion or emotional connection with the work *despite* recognizing its formal merits. The "local flaw" isn't a flaw *in the text itself*, but a catastrophic failure *in the reader-text relationship* caused by the author's shadow.
  *   **Key Features:**
      1.  **Locality of Identification, Globality of Effect:** Readers pinpoint *how* the author's character disrupts their reception (e.g., sincerity becomes manipulation). This specific disruption acts like a corrosive agent, dissolving the *entire* basis for aesthetic engagement. Enjoyment isn't diminished; the *precondition* for experiencing it (trust, suspension of moral disbelief, perceived authenticity) is destroyed.
      2.  **Unidirectional Leak (Moral Taint):** This reflects the **Contagion Heuristic** and **Moral Typecasting**. Moral failing is perceived as contagious ("tainting" the work), while artistic achievement is not seen as cleansing the person. Moral typecasting fixes the author as "bad," making it difficult to reconcile that identity with the creation of good art requiring qualities (empathy, insight) seemingly absent in them.
      3.  **Thematic Proximity Sensitivity:** This is **Resonant Transgression**. When the work's subject matter mirrors the transgression, it creates an unbearable dissonance. The text feels like an extension of the crime (coercion novel by a coercor) or a grotesque hypocrisy, shattering any illusion of artistic truth-telling. Non-resonant work avoids this direct confrontation.
      4.  **Temporal Decay:** This is the **Historicization of Transgression**. Over time, the immediacy of the author's culpability fades. The transgression becomes a biographical footnote, contextualized within its era ("a quirk of the period"). The work is judged more autonomously, as the *living* moral relationship with the author dissolves.

  ### Why "Affective Severance"?
  *   **Affective:** Focuses on the *emotional and experiential* rupture (inability to feel consolation, trust the narrator, immerse oneself) rather than a purely intellectual judgment of meaning or quality.
  *   **Severance:** Emphasizes the complete, often sudden, *cutting off* of the aesthetic connection. It's not degradation; it's disconnection.

  ### What It Is & Isn't: Boundary Cases
  1.  **Boycotting (Is Not):** Boycotting is a deliberate, often political or ethical, choice *not to support* the artist financially or reputationally. Affective Severance is a *psychological inability to engage* with the work aesthetically, even if acquired secondhand. You *could* read it, but you *can't* connect. Boycotts can exist without Severance (e.g., refusing to buy but still enjoying pirated copies).
  2.  **Loss of Trust as Speaker (Is Related, But Not Identical):** This is a component, but insufficient. Losing trust in a politician's speeches might make you disbelieve them, but it doesn't necessarily destroy the *aesthetic experience* of a novel they wrote. Affective Severance is the *aesthetic consequence* of that lost trust *specifically in the artistic context*.
  3.  **Biographical Clarification of Meaning (Is Not):** Discovering an author had an affair might make you reinterpret a love scene *differently* – perhaps revealing hidden pain or hypocrisy. This changes *interpretation*. Affective Severance changes *reception*: the meaning might be clear ("this is a sales pitch"), but the *ability to experience it aesthetically* is gone. The text isn't newly understood; it's newly *unbearable*.
  4.  **Simple Disgust/Contagion (Is Related, But Not Sufficient):** While the contagion heuristic is involved, Affective Severance isn't just feeling the book is "dirty." It's specifically the failure of the *aesthetic contract* – the breakdown in the reader's capacity to derive the intended (or previously derived) emotional/intellectual *value* from the encounter. The "stain" blocks the conduit of artistic experience.
  5.  **Moralistic Criticism (Is Not):** This is judging the work's *content* as morally flawed ("this book promotes harmful ideas"). Affective Severance arises from the *author's external actions*, making the *experience* of even morally sound content feel corrupted or inaccessible.

  ### Essential Features vs. Accidents
  *   **Essential:** The core of Affective Severance is **the psychological severing of the capacity for aesthetic immersion/connection due to knowledge of the author's transgression, despite recognition of the work's formal qualities.** Locality of identification (how the taint manifests) and Global withdrawal (inability to engage) are inherent to this mechanism.
  *   **Highly Characteristic, But Not Absolute:**
      *   **Unidirectional Leak:** Overwhelmingly common, but *conceivably* reversible with extraordinary author restitution and time (rare). The asymmetry is a defining *tendency*.
      *   **Thematic Proximity Sensitivity:** A powerful amplifier, but Severance *can* occur with non-resonant work (e.g., if the transgression is extreme enough to poison *any* perceived virtue). Resonant Transgression makes Severance far more likely and severe.
      *   **Temporal Decay:** A near-universal mitigating factor, but the timeframe varies. Some transgressions resist historicization longer than others.

  ### What Else Looks Like This But Isn't?
  *   **Triggering due to Personal Trauma:** A reader might be unable to read a rape scene due to their own history. This is a severance of immersion, but the cause is *internal* to the reader and the *text's content*, not the *author's external moral failing*.
  *   **Aesthetic Obsolescence:** Finding a once-beloved book stylistically dated or thematically irrelevant, making it impossible to engage. This stems from shifts in taste or context, not the author's moral status.
  *   **Ideological Incompatibility (Newly Discovered):** Learning an author holds abhorrent political views *might* trigger Severance, but it could also manifest as reinterpretation, anger at the work itself, or simple disgust without the specific aesthetic rupture. The focus here is on the *moral character* revealed through action, not just belief.

  ### Conclusion
  You've precisely described **Affective Severance**: the catastrophic rupture in the reader's aesthetic experience triggered by the author's moral transgression. It's characterized by pinpointing how the author's character poisons reception (Local Identification), leading to a total inability to engage (Global Withdrawal), fueled by the one-way spread of Moral Taint, dramatically intensified by Resonant Transgression, and gradually mitigated by the Historicization of Transgression over time.

  This isn't about judging the work's inherent quality ("death of the author" for meaning) or simple contamination. It's about the fragile, necessary illusion of authentic connection between reader and text being shattered by the reality of the author behind it. The value isn't just *in* the experiencing; it's *generated by* the experiencing, and Affective Severance is the mechanism that blocks that generation when the author's moral standing fatally undermines the foundation of the experience itself.
