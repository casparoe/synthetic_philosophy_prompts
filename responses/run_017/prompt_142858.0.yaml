answer: |-
  Below is a comprehensive design for your 90-minute seminar session. It addresses the frame problem through a structured, experiential activity with three phases, using a closed-world "Lab Bench" scenario. The design includes the world setup, rules, scoring, instructions, debriefing points, and handling of common pitfalls.

  ---

  ### **Game Design: The Lab Bench Challenge**
  **World Setup**: A lab bench with 20 fluents (boolean properties) and 8 actions. The physics binder (causal rules) is enforced via index cards. Two complications:  
  - **Deferred effect**: `SetTimer` triggers `TimerRinging` after 3 turns, cancellable by re-executing `SetTimer`.  
  - **Indirect fluent**: `PlantAlive` changes only via global rules, not directly by any action.  

  #### **Fluents (20)**  
  1. `LightOn` (bench light)  
  2. `FaucetRunning` (water flow)  
  3. `StoveOn` (heating element)  
  4. `FridgeOpen` (mini-fridge)  
  5. `DishInSink`  
  6. `DishClean`  
  7. `TrashFull`  
  8. `TrashTakenOut`  
  9. `FloorWet`  
  10. `SpongeWet`  
  11. `SpongeSoapy`  
  12. `WindowOpen`  
  13. `CatOnCounter`  
  14. `MilkInFridge`  
  15. `PlantWatered`  
  16. `PlantAlive` (indirect)  
  17. `TimerSet`  
  18. `TimerRinging` (deferred)  
  19. `ChemicalsMixed`  
  20. `ReactionActive`  

  #### **Actions (8)**  
  1. `ToggleLight`  
  2. `TurnOnFaucet`  
  3. `TurnOffFaucet`  
  4. `WashDish` (requires `DishInSink`, `FaucetRunning`, `SpongeWet`, `SpongeSoapy`; sets `DishClean`; 30% chance sets `FloorWet`)  
  5. `TakeOutTrash` (requires `TrashFull`; sets `TrashTakenOut`, unsets `TrashFull`)  
  6. `SetTimer` (toggles `TimerSet`; if active, `TimerRinging` true in 3 turns unless cancelled)  
  7. `WaterPlant` (sets `PlantWatered`; requires `FaucetRunning`)  
  8. `MixChemicals` (requires `LightOn`; sets `ChemicalsMixed`; 40% chance sets `ReactionActive`)  

  #### **Global Rules (Physics Binder Cards)**  
  - **Deferred timer**: At turn start, if `TimerSet` is active, decrement countdown. At 0, `TimerRinging` becomes true. Re-executing `SetTimer` cancels it.  
  - **Indirect plant**: At turn end, if `PlantWatered` is true and `WindowOpen` is false, set `PlantAlive` to true and reset `PlantWatered`. If `WindowOpen` is true, set `PlantAlive` to false.  
  - **Reaction rule**: If `ReactionActive` is true, 20% chance `StoveOn` toggles each turn (simulates heat interference).  

  ---

  ### **Phase Structure and Rules**  
  **Team Setup**: Six teams of three. Each team gets:  
  - Index cards (for writing axioms).  
  - Sticky notes (for belief board).  
  - Dice (for probabilities).  
  - Initial state card (all fluents false except `TrashFull`, `DishInSink`).  

  **Scoring**:  
  - **Phase 1/2**: Points for compactness (lower = better). Total axioms/condition clauses written.  
  - **Phase 3**: Points for belief accuracy (1 pt/fluent matching physics binder).  
  - **Revisions**: After adding new action/fluent, points for "revision cost" (new clauses added).  

  **Payoff Asymmetry**:  
  - Compact encodings (few axioms) score well initially but pay high revision cost when new fluents arrive.  
  - Verbose encodings (frame axioms) score poorly initially but pay low cost when new actions arrive.  

  ---

  ### **Phase 1: Naive Effect Axioms (20 min)**  
  **Instructions to Students**:  
  *"You are an AI programmer. For each action, list which fluents it **changes** (ignore conditions). Example: ‘ToggleLight changes LightOn (if on, turns off; if off, turns on)’. Write one axiom per action on index cards. No need to mention unchanged fluents."*  

  **Goal**: Teams write simple effect axioms (e.g., `TurnOnFaucet` sets `FaucetRunning` to true).  

  **What Happens**: Teams produce minimal lists. Philosophy students often add context; CS students optimize for brevity.  

  **Tally**: Record total axioms per team (e.g., 8 actions × 1 axiom = 8 points). Top 3 teams win "efficiency badges" (sticky notes).  

  ---

  ### **Phase 2: Conditional Effects (20 min)**  
  **Instructions**:  
  *"New info: Actions have preconditions and conditional effects! Revise your axioms using ‘IF-THEN’ clauses. Example: ‘WashDish: IF DishInSink AND FaucetRunning AND SpongeWet AND SpongeSoapy THEN set DishClean to true (30%: FloorWet true)’."*  

  **Physics Binder Revealed**: Teams get cards with true rules. Global rules (timer, plant) are separate—students don’t write these.  

  **Goal**: Teams add conditions (e.g., `WashDish` now has 2–4 clauses).  

  **Tally**: Record total clauses (e.g., 8 actions × 3 clauses = 24 points). Highlight teams that added frame axioms (e.g., "`ToggleLight` leaves `FaucetRunning` unchanged").  

  ---

  ### **Phase 3: Belief Maintenance (40 min)**  
  **Instructions**:  
  *"Run experiments! Each turn:  
  1. Pick one action (or skip).  
  2. Choose 2 fluents to observe (you get their true values).  
  3. Update your belief board (sticky notes).  
  4. Physics binder resolves global rules (I announce `TimerRinging`/`PlantAlive` changes).  
  Score: Accuracy of belief state at game end."*  

  **Turn Order**:  
  1. **Global start**: Apply timer rule (e.g., decrement countdown).  
  2. **Action**: Team declares action; physics binder checks preconditions.  
  3. **Observation**: Team picks 2 fluents; binder reveals values.  
  4. **Global end**: Apply plant/reaction rules.  
  5. **Update**: Team revises belief board.  

  **Worked Turn Example**:  
  - **True state**: `LightOn=true`, `FaucetRunning=false`, `PlantAlive=false`.  
  - **Team action**: `WaterPlant` (fails—`FaucetRunning` false).  
  - **Observed fluents**: `PlantWatered` (false), `FaucetRunning` (false).  
  - **Global end**: `WindowOpen=false` → no change to `PlantAlive`.  
  - **Team’s belief**: Correctly leaves `PlantAlive=false` (1 pt if accurate).  
  - **Scoring**: Post-game, compare all 20 fluents.  

  **Mid-Game Revisions**:  
  - **After 3 turns**: Add **new action** `MicrowaveSnack` (requires `StoveOn=false`; sets `SnackHeated`; 25% chance `FloorWet=true`). Teams add axioms.  
  - **After 6 turns**: Add **new fluent** `SnackHeated`. Teams add frame axioms or global rules.  
  - **Revision Cost**: Count new clauses. Compact teams suffer adding `SnackHeated` to frame axioms; verbose teams suffer writing `MicrowaveSnack` from scratch.  

  ---

  ### **Debrief (10 min)**  
  Map game moments to the frame problem:  
  1. **Phase 1**: "You listed changes but ignored unchanged fluents. Real AIs must *also* infer what *didn’t* change—but how?"  
  2. **Phase 2**: "Conditions exploded! To specify when `WashDish` affects `FloorWet`, you needed four preconditions. But what about other fluents? Do you write ‘`WashDish` leaves `PlantAlive` unchanged’? If so, for *every* action?"  
  3. **Phase 3**: "With only 2 observations/turn, you couldn’t check everything. When `PlantAlive` changed indirectly, you had to *decide* to observe `WindowOpen` or `PlantWatered`—but that decision requires knowing what *might* change!"  
  4. **Revisions**:  
     - New action (`MicrowaveSnack`): Verbose teams (frame axioms) added it cheaply (update 1 action). Compact teams wrote many new clauses (high cost).  
     - New fluent (`SnackHeated`): Compact teams added it cheaply (1 global rule). Verbose teams updated *every* action (e.g., "`ToggleLight` leaves `SnackHeated` unchanged")—high cost.  
  5. **Counting Argument**: "With 20 fluents and 8 actions, a full frame axiom set needs 20 × 8 = 160 clauses! But a compact set needs only ~40. Yet when the world changes, you pay the price."  

  ---

  ### **Predictable Pitfalls and Responses**  
  1. **Common-Sense Smuggling**:  
     - *Problem*: Students assume real-world physics (e.g., "`TurnOnFaucet` makes `FloorWet` if the sink is broken").  
     - *Fix*: Enforce physics binder as the "constitution." Penalize teams for unsanctioned assumptions.  

  2. **Over/Under-Flagging in Belief Maintenance**:  
     - *Problem*: Teams observe everything after a surprise (e.g., `PlantAlive` changes), then revert to under-observing.  
     - *Fix*: Announce mid-game, "Global rules can change fluents silently. Choose observations wisely!"  

  3. **Degenerate Strategy**:  
     - *Problem*: One team ignores actions, observes the same 2 fluents (e.g., `LightOn`, `StoveOn`).  
     - *Fix*: Add a "research urgency" timer (e.g., "ReactionActive causes explosion in 5 turns!").  

  4. **"This is Arbitrary!"**:  
     - *Problem*: Student claims the frame problem is an artifact of your rules.  
     - *Response**: "The rules *simulate* the need for causal inference. Real-world agents face the same challenge: you can’t write physics from scratch for every task. Why *can’t* the agent just look? Because—"  

  **Short Answer for "Why can’t the agent just look?"**:  
  *"Looking tells you the *current* state, not what *changed* or *why*. To update beliefs efficiently, you need a causal model. But verifying that model requires knowing what to re-check—which depends on the model itself. Example: After `WaterPlant`, you check `PlantAlive` only if you know about the window rule. But how do you *know* that rule without pre-specifying it? This regress forces trade-offs in representation."*  

  ---

  ### **Limits of the Activity**  
  The irreducibly architectural insights (to be covered in final 10 minutes):  
  1. **Form of Representation**: The frame problem arises from *propositional* encodings. Real cognizers use probabilistic, hierarchical, or neural representations that amortize inference.  
  2. **Architecture**: Humans use "default assumptions" (e.g., "doors don’t move unless touched"), but AIs need explicit frame axioms or non-monotonic logic (e.g., circumscription).  
  3. **Regress**: Deciding "what to re-derive" requires meta-reasoning, which itself has a frame problem. This points to foundational challenges in AI epistemology.  

  **Closing Lecture Snippet**:  
  *"Today, you hit the frame problem: specifying change forces trade-offs in compactness, repairability, and inference. Real AIs use approximations (e.g., Markov assumptions), but these fail in novel scenarios. Philosophy tells us this isn’t just messy engineering—it’s about the computational structure of reason itself."*  

  ---  
  This design ensures students experience the frame problem as a tangible constraint. The Lab Bench world, with its deferred timer and indirect plant, creates memorable "aha!" moments during belief maintenance. The scoring asymmetry in revisions visually reinforces the representational trade-offs.
