  Okay, the user is a novelist working with an omniscient narrator and has encountered a nuanced distinction during revisions. They describe two types of forward-pointing statements in their narration: one type (like "she would not see him again for eleven years") seems contingent on later narrative decisions, while the other (like "she will either see him or not within eleven years") feels inevitable regardless of plot choices. 

  The user has already ruled out common philosophical red herrings—they're not concerned with character free will or timeless truth values. Their observation about grammatical patterns (past-wrapped-future constructions correlating with the contingent statements) is particularly sharp. What they truly need isn't terminology but a functional taxonomy to classify sentences during editing, ensuring their narrator's foreshadowing doesn't accidentally imply determinism where flexibility exists.

  Hmm... the naval battle paradox (Aristotle's sea-fight tomorrow) is adjacent but insufficient—it debates truth-value existence, whereas the user accepts both statement types as true/false. The core issue is ontological dependence: whether a truth is fixed by the story's current state or awaits later authorial decisions. 

  Ah! The key is separating intra-diegetic and extra-diegetic causality. For the inevitable statements (e.g., "she will either see him or not"), their truth depends solely on the fictional present—the possibilities are exhaustive by logical necessity. But for the contingent ones (e.g., the eleven-year gap), their truth hinges on diegetic future events not yet established in the narrative fabric at that point. 

  The grammatical clue makes sense: phrases like "was going to" implicitly reference a future timeline that doesn't yet exist diegetically when spoken. Testing this would involve checking if replacing them with present-condition formulations ("she would later" → "she will later, though this depends on X") breaks narrative cohesion. 

  For terminology, "contingently true forward-reference" versus "necessarily true forward-reference" captures the dichotomy. Boundary test: if deleting a later plot point invalidates the statement without altering earlier chapters, it's contingent. Statements that remain true regardless of later events (like logical tautologies) are necessary. 

  This distinction protects character agency: only necessary statements are "safe"; contingent ones risk implying predestination if not framed as the narrator's hindsight rather than in-universe certainty. The user's real victory will be spotting sentences that seem contingent but are actually necessary (e.g., "he would suffer" could be either—does "suffer" have a fixed definition?).
answer: |-
  You've pinpointed a profound and often overlooked distinction in omniscient narration, crucial for maintaining both narrative tension and character agency. The phenomenon you describe has no single universally accepted name, but it can be precisely defined and differentiated from related concepts. Here's a sharp formulation:

  ### The Distinction: **Settled Truth** vs. **Narrative-Settled Truth**

  1.  **Settled Truth (Your "Neighbouring Sentence"):**
      *   **Definition:** A statement about the future whose truth or falsity is entirely determined *by the state of the fictional world at the time the statement is made*. No future event *causes* it to become true or false; its truth value is fixed by the present (or past) conditions, logic, or inherent possibilities.
      *   **Examples:**
          *   "Either she would see him again within eleven years, or she would not." (Logical Exhaustion)
          *   "He was mortal; he would die someday." (Inherent Property)
          *   "The sun would rise tomorrow." (Natural Law within the world)
          *   "The bomb's timer was set for 5 minutes; it would explode then unless defused." (Present State + Physical Law - *unless* clause shows contingency based on *present* possibilities, not future choices).
      *   **Key Characteristics:**
          *   **Independent of Future Plot:** Its truth doesn't *depend on* a specific future event you, the author, invent later. Its truth flows inevitably from the established "now".
          *   **Character Agency Neutral:** It doesn't imply characters lack free will *about the events covered by the statement*. It simply states a logical certainty given the present. (e.g., The "bomb will explode" statement doesn't prevent a character *from defusing it*; it states the consequence if they *don't* act based on the present state).
      *   **Grammatical Clue:** Often uses the future tense ("would", "will", "shall") or modal verbs expressing necessity/possibility ("must", "could", "might"), grounded in the present/past state. *Not* inherently tied to past-wrapped-future constructions.

  2.  **Narrative-Settled Truth (Your "Eleven Years" Sentence):**
      *   **Definition:** A statement about the future whose specific truth value *is determined by an event or state that occurs later within the narrative timeline*. The truth of the statement *at the time it's narrated* depends on outcomes not yet established *in the story world* when the statement refers to.
      *   **Examples:**
          *   "She would not see him again for eleven years." (Truth settled *by the actual parting event* occurring later in the narrative).
          *   "This was the man who would betray her." (Truth settled *by the future act of betrayal*).
          *   "The journey they began that day was going to change everything." (Truth settled *by the future consequences of the journey*).
      *   **Key Characteristics:**
          *   **Dependent on Future Plot:** Its specific truth value (not just its possibility) *only becomes fixed* when the relevant future event is written into the narrative. The author's later decision *makes* it true (or false).
          *   **Implies Retrospective Knowledge:** While the omniscient narrator knows *everything* (past, present, future), this type of statement leverages that knowledge *specifically* to reveal an outcome *settled by a future diegetic event*. It narrates from the *endpoint* of the story.
          *   **Grammatical Clue:** Strongly correlates with **Backshifted Future Constructions**: "would", "was/were going to", "was/were to", "was/were about to". This grammar explicitly places the *narration's perspective* after the future event has occurred, looking back. It signals the statement's truth is anchored in that future outcome.

  ### Why Existing Concepts Don't Suffice & How This Distinction Holds

  *   **Timeless Truth:** You're right, this erases the distinction. Both types are timelessly true *once the story is complete*. The difference lies in *when within the fictional timeline the truth-maker occurs*: at the time referenced (Settled Truth) or later (Narrative-Settled Truth).
  *   **Fatalism/Free Will:** The confusion arises because Narrative-Settled Truth *sounds* like it implies events are predetermined *within the story world*. However, the narrator's knowledge is external. The key is that Narrative-Settled Truth **does not imply the future event was inevitable *at the time*.** It states what *did* happen, not that it *had* to happen. Characters *could* have acted differently (free will exists within the fiction), but the narrator is stating the fact of what *did* occur. The *settling* is done by the *event happening*, not by an external decree forcing it. The *narrative perspective* is retrospective, not deterministic.
  *   **Aristotle's Sea Battle (Future Contingents):** This puzzle asks if statements about future singular events *can* be true *now*. You've bypassed this by having an omniscient narrator who *does* know the future. Your distinction applies *after* granting omniscience: *How* is that future knowledge grounded in the fictional timeline? Is it knowledge of present certainties (Settled Truth) or knowledge of future outcomes (Narrative-Settled Truth)?
  *   **Foreshadowing vs. Foretelling:** These are narrative techniques, not ontological distinctions. Both types of statements can be used for foreshadowing. The distinction defines *what kind of certainty* the narrator is invoking.

  ### Boundary Tests & Application to Your Work

  1.  **The Deletion Test:** Imagine deleting the future event that makes a statement true. For Narrative-Settled Truth, the statement becomes false or meaningless *without altering the earlier scene*. (Delete the eleven-year parting? Then "would not see him for eleven years" is false). For Settled Truth, deletion of future events doesn't affect the statement's truth based on the present. (Delete *all* future meetings? The "either/or" statement remains true; one outcome happened - "not meeting").
  2.  **The "Could Have Been Otherwise" Test:** For a Narrative-Settled Truth statement, ask: "Could the characters have acted differently, *within the logic of the story*, such that this statement would be false?" If yes (e.g., she *could* have called him next week), then it's Narrative-Settled. If the statement would remain true *regardless* of future character actions (e.g., "he would die someday"), it's Settled Truth.
  3.  **The Retrospective Anchor Test:** Does the statement *feel* like the narrator is speaking from a point *after* the future event has occurred, using that knowledge? If yes, it's likely Narrative-Settled Truth (grammar is a key clue here). Does it feel like a deduction or statement of inherent possibility based solely on the present moment? Then likely Settled Truth.

  **Applying it to Character Agency:** Sentences expressing **Narrative-Settled Truth** are the ones that *could* feel like they "take something away" if mishandled, precisely because they reference a *specific outcome* known to the narrator. However, they **do not inherently remove agency** if the narrative perspective clearly frames this as *what did happen*, not *what was forced to happen*. The risk arises if the narration implies inevitability *within the story world* at that early point. Sentences expressing **Settled Truth** pose minimal risk to perceived agency, as they state necessary conditions or possibilities, not specific outcomes determined by future choices.

  **Coined Term & Definition Recap:**

  *   **Settled Truth:** An omniscient narrator's statement about the future whose specific truth value is entirely determined by the state of the fictional world *at the time the statement refers to*.
  *   **Narrative-Settled Truth:** An omniscient narrator's statement about the future whose specific truth value is determined by an event or state that occurs *later within the narrative timeline* than the time referred to.

  This distinction gives you the scalpel you need. During revision, identify forward-pointing statements. Check their grammatical form (backshifted futures strongly suggest Narrative-Settled). Apply the Deletion Test or "Could Have Been Otherwise" Test. This tells you whether the statement's truth feels grounded in the present logic (Settled, safe for agency) or relies on knowledge of a specific future outcome (Narrative-Settled, requires careful framing to avoid fatalism). Use this awareness to ensure your narrator's voice maintains the desired balance between knowing authority and respect for the characters' lived experience of an open future.
