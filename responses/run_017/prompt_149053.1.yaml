  ### Brainstormed Mechanics
  I considered three candidate mechanics for this activity. First, a **card-trading game** where teams exchange event cards to build simultaneity chains, but it risked abstracting the spacetime relations too much and losing the physical intuition of the diagram. Second, a **role-play with movement**, assigning students as events and having them form simultaneity lines, but this could become chaotic and wouldn't scale cleanly to 15 events. I chose the third option: **string-and-diagram manipulation** with team-specific simultaneity slices. This leverages the large floor space, makes frame-relative simultaneity tactilely vivid, and naturally forces conflicts during wagering and chain-building. It also cleanly handles the turnaround team's perspective shift without arithmetic.

  ---

  ### Activity: "The Reality Chain"  
  *75-minute session, 18 students, flat seminar room with clear floor area*  

  #### **Materials**  
  - Masking tape (for axes and event markers)  
  - 15 index cards (event descriptions + news arrival times)  
  - 6 lengths of string (1 per team, pre-marked with slope angles)  
  - 6 sets of 5 credibility chips (colored paper clips)  
  - Pins (to temporarily fix string positions)  
  - Whiteboard (for recording wagering outcomes)  
  - Projector (to display instructions/diagram key)  

  #### **Setup (10 min)**  
  1. **Floor Diagram**:  
     - **Axes**: Tape a 4m (space, *x*) × 3m (time, *t*) grid. *x* left-to-right, *t* bottom-to-top. Set scales: 1m = 5 years, 1m = 2 light-years (c=1).  
     - **Events**: Place 15 events with tape/index cards as below. Each card shows:  
       - **Description** (e.g., "Earth: Climate Accord Signed")  
       - **Coordinates** (t, x) in years/light-years  
       - **News Reaches Earth** (t + |x| years, italicized)  

     | Event          | (t, x)     | News at Earth | Description                              |  
     |----------------|------------|---------------|------------------------------------------|  
     | E1 (Earth)     | (0, 0)     | 0             | Mission control starts project           |  
     | E2 (Earth)     | (10, 0)    | 10            | Earth: First colony launched             |  
     | E3 (Earth)     | (20, 0)    | 20            | Earth: Global vote on AI ban             |  
     | S1 (Ship)      | (5, 3)     | 8             | Ship: Passes Mars at 0.6c                |  
     | S2 (Ship)      | (15, 9)    | 24            | Ship: Arrives at Proxima Centauri        |  
     | S3 (Ship)      | (25, 9)    | 34            | Ship: Begins return journey              |  
     | P1 (Andromeda) | (-10, 2000)| 1990          | Andromeda: Star δ-dies (past light cone) |  
     | P2 (Andromeda) | (5, 2000)  | 2005          | Andromeda: Nebula forms                  |  
     | P3 (Andromeda) | (30, 2000) | 2030          | Andromeda: Robot probe arrives           |  
     | X1 (Outpost)   | (8, 4)     | 12            | Asteroid: Mining base built              |  
     | X2 (Outpost)   | (12, 4)    | 16            | Asteroid: Revolt against AI              |  
     | X3 (Outpost)   | (18, 6)    | 24            | Asteroid: Supernova warning sent         |  
     | F1 (Future)    | (40, 0)    | 40            | Earth: First warp drive test             |  
     | F2 (Future)    | (50, 0)    | 50            | Earth: Colony returns from Andromeda     |  
     | F3 (Future)    | (60, 2000) | 2060          | Andromeda: Warp drive test               |  

     **Spacelike/timelike pairs**: E1–P2 (spacelike), S1–X2 (spacelike), E2–P3 (timelike), etc. Highlight spacelike pairs for wagering.  

  2. **Teams/Frames**:  
     - Assign 6 teams (3 students each). Each gets a string with fixed slope (angle from horizontal):  
       - Team 1: "Earth Frame" (slope 0°, horizontal)  
       - Team 2: "Slow Outbound Ship" (slope 20°, v≈0.36c)  
       - Team 3: "Fast Outbound Ship" (slope 50°, v≈1.2c) → *deliberately unphysical to force wagering loss*  
       - Team 4: "Inbound Ship" (slope -40°, v≈-0.84c)  
       - Team 5: "Turnaround Team" (starts slope 50°, switches to -40° at t=15)  
       - Team 6: "Orbital Station" (slope 10°, v≈0.18c)  
     - **Slope Key** (projected): Show angles, no math. Emphasize: strings can slide but not tilt (except Team 5).  

  3. **Credibility Chips**: Each team gets 5 chips. Chips convert to **"Reality Tokens"** (stickers) for:  
     - 3+ chips: Pick a music track for the wrap-up.  
     - 1–2 chips: Choose a snack for next class.  
     - 0 chips: No penalty (avoids disengagement).  

  ---

  ### **Rounds (50 min)**  
  #### **1. Ledger Compilation (10 min)**  
  - **Task**: Each team places their string through **E2 (10, 0)**, aligning their slope. They note events pierced by the string (or within 0.5m tolerance) as "real now." Record privately on index cards.  
  - **Goal**: Internalize that "now" differs by frame. E.g., Team 1 (Earth) flags E2, X2, P2; Team 4 (Inbound) flags E2, X1, P1.  

  #### **2. Wagering (15 min, 3 rounds)**  
  - **Mechanics**:  
    - Each round, teams wager 1 chip on *another team’s ledger*.  
      - *Example bet*: "Team 3 includes P3 in their ledger."  
    - Bets written on cards, given to you.  
    - Targeted team reveals ledger. Correct prediction → win 1 chip; wrong → lose 1.  
    - **Payoff scheme**: Fast Outbound (Team 3) has an impossible slope (v>c), so their string won’t pierce *any* event. Most bets against them lose.  
  - **Engineered conflict**: Teams assume others share their "now." E.g., Team 1 (Earth) bets Team 4 (Inbound) excludes P1 (spacelike to E2), but Team 4 includes it.  
  - **Outcome**: Teams lose chips by projecting their frame. Fast Outbound’s empty ledger surprises all.  

  #### **3. Turnaround Jump (10 min)**  
  - Team 5 recomputes their ledger at **S2 (15, 9)** after switching slopes.  
  - **Shift**: First ledger (slope 50°) includes S2, P3; second (slope -40°) includes S2, X3, E3.  
  - **Prompt**: "Did Team 5 *discover* new reality or *change* it? Discuss in groups for 2 min."  
  - **Goal**: Force confrontation with frame-dependence of "now."  

  #### **4. Chain-Building (10 min)**  
  - **Task**: Build a chain from **E1 (0,0)** to **F1 (40,0)** (timelike separated) using ≤3 hops. Each hop must be:  
    - A spacelike-separated pair (e.g., E1–X1, Δt=8y, Δx=4ly, |Δx|>|Δt|).  
    - Pierced by a single team’s string (slid to fit both events).  
  - **Expected path**:  
    1. E1 (0,0) → X1 (8,4) [spacelike, Team 2’s string]  
    2. X1 (8,4) → P3 (30,2000) [spacelike, Team 3’s string]  
    3. P3 (30,2000) → F1 (40,0) [spacelike, Team 4’s string]  
  - **Facilitator prompt**: "If E1 is real, and X1 is simultaneous with it in Team 2’s frame, is X1 real? If so, and P3 is simultaneous with X1 in Team 3’s frame..."  

  #### **5. Bookkeeping (5 min)**  
  - 2 volunteers build a global "co-reality" table (whiteboard). Rows/columns = events. Mark ✓ if *any frame* deems them simultaneous.  
  - **Conflict**: E1–F1 must be ✓ (via chain) but are timelike → no frame supports simultaneity!  
  - **Four exits (prompted by questions)**:  
    1. *Contradiction*: "Is it okay for reality to contradict itself?"  
    2. *Drop transitivity*: "If A is real with B and B with C, must A be real with C?"  
    3. *Privileged frame*: "What if one frame is ‘true’? How would we know?"  
    4. *Relativize reality*: "Is reality ‘for me’ or ‘for the universe’?"  

  ---

  ### **Debrief (20 min)**  
  - **Map to argument**:  
    - Ledger: Relativity of simultaneity (premise 1).  
    - Wagering: Humans default to their frame (motivates premise 2).  
    - Turnaround: Simultaneity with a real event confers reality (premise 2).  
    - Chain: Transitivity of co-reality (premise 3) → all events real.  
    - Bookkeeping: Shows premise 3 forces eternalism or costs.  
  - **Premise critique**:  
    - "The real work is done by *transitivity of co-reality* (premise 3). I reject it—co-reality isn’t transitive, or ‘reality’ isn’t univocal."  
  - **Term introduction**:  
    - *Block universe/eternalism*: Conclusion (all events real).  
    - *Presentism*: Only now is real; cost = deny relativity of simultaneity.  
    - *Growing block*: Past/present real; cost = arbitrary "growth" rate.  
    - *Fragmentalism*: Reality is non-transitive; cost = no unified "world."  
  - **Unsurfaced resistances** (for you to state):  
    1. "Reality ≠ determinacy" (epistemic vs. ontological).  
    2. "Simultaneity with real events doesn’t transmit reality."  
    3. "Spacetime isn’t fundamentally sliced—relations are primary."  

  ---

  ### **Predictable Problems + Handling**  
  1. **"This is about knowledge, not existence!"**  
     - *Handling*: Ask: "When Team 5’s ledger changed, did they *learn* about P3 or *make* it real? News times are separate—focus on what’s on the string."  
  2. **Teams nudging string angles**  
     - *Handling*: Assign one student per team as "slope enforcer." Tape angle guides to floor.  
  3. **"So what? Simultaneity is relative—big deal."**  
     - *Handling*: Redirect: "True! But *this* activity asks: if something is ‘now’ for you, is it *real*? And what happens if it’s ‘now’ for someone else?"  
  4. **Ignored spatial dimensions**  
     - *Handling*: Preempt: "We’re suppressing 2D space, but spacelike separation still works the same."  
  5. **Turnaround jump seems like a trick**  
     - *Handling*: Stress: "Team 5’s *frame* changed at S2—not the events. The jump shows how ‘now’ depends on *your* motion."  

  ---

  ### **Unreproducible Limitation**  
  The activity cannot capture **ontological indeterminacy**. It equates "real" with "on a simultaneity slice," but one could argue future events are *real-yet-indeterminate* (e.g., open future). The Rietdijk-Putnam argument assumes reality implies determinacy, but this is a philosophical choice—not dictated by relativity. You must testify to this gap: "The argument conflates existence with determinism. We model reality as slices, but maybe reality has ‘fuzzy’ edges!"
