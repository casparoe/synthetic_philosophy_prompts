      - Block universe / eternalism: the view that all events are real (which the argument concludes). 
      - Presentism: only present events are real. 
      - Growing block: only past and present are real. 
      - Fragmentalism: reality is not unified; there are fragments that are internally consistent but not consistent with each other. 

    We introduce them in the debrief, after summarizing the argument. 

    "The argument we've been exploring is the Rietdijk-Putnam argument. It concludes that, given the relativity of simultaneity, and given that reality includes everything that is simultaneous with a real event, and given that co-reality is transitive, then every event must be real. This view is called the block universe or eternalism. 

    But there are alternatives: 
        - Presentism: only the present is real. 
        - Growing block: the past and present are real, but the future is not. 
        - Fragmentalism: reality is not globally consistent; there are many fragments. 

    We saw that the argument can be resisted by denying the transitivity of co-reality, or by relativizing reality to a frame, or by positing a privileged frame, or by accepting contradictions. Each of these has a cost." 

