  **Debrief (20 minutes)** 

  - Map the moments: 
      (a) Ledger compilation: shows relativity of simultaneity. 
      (b) Wagering: shows that we tend to assume our own frame, but there are many frames. 
      (c) Turnaround team: shows that the set of events that are "now" can change dramatically without any physical change at the event in question (here (10,0)). 
      (d) Chain building: shows that by a chain of co-reality links (simultaneity), we can connect events that are timelike separated. This is the transitivity step. 
      (e) Bookkeeping: shows that if we try to build a global notion of co-reality, we run into inconsistency unless we drop one of the premises. 

  - The premise doing the real work: the transitivity of co-reality (if A and B are real together and B and C are real together, then A and C are real together). 

  - The premise the instructor thinks is false: the transitivity of co-reality. 

