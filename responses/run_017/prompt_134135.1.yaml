  Now, brainstorming candidate questions. The key areas where Dutch book arguments have been extended include chance-credence principles (like Lewis' Principal Principle), decision theory (diachronic coherence), and epistemic utility. But each extension has criticisms. For example, chance-credence norms might smuggle in substantive assumptions. The user mentioned norms on what to pay for information, which ties into decision-theoretic approaches like Savage's or Joyce's non-pragmatic arguments.

