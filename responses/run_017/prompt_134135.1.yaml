  Then the "only coherence" objection. Need to determine if there's a principled way to distinguish which norms can be underpinned by Dutch book arguments. This touches on whether these arguments are purely about internal consistency or can incorporate external elements like evidence. The user might be hoping for a framework that shows extensions are possible without smuggling, or perhaps accepting that some extensions do require additional assumptions.

  Ranking the questions requires criteria: tractability within 15 pages, novelty, and significance. High-risk topics might be proving Dutch books for full inductive norms, which likely require heavy machinery. Medium could be chance-credence norms under constraints. Low-risk might be formalizing how norms degrade with limited bookie resources.

  For the user's case, focusing on the degradation under constraints (point 1) combined with the principled limits (point 2) might hit the sweet spot. It's tractable, connects to existing literature, and addresses both their and their friend's points. Suggesting a framework that shows which norms are purely coherence-based versus those needing extra assumptions could position their paper as clarifying the scope of Dutch book arguments, which hasn't been thoroughly explored.

  Dead ends: Trying to derive substantive priors solely from Dutch books is probably impossible without adding assumptions. Also, full inductive norms are too ambitious for 15 pages. The user should avoid those.

