  2. For the delay compromise, show Alex seeing it as reasonable accommodation while Sam views it as patronizing obstruction.

  The user's "lawyer tearing up a will" analogy is gold - should give that to Alex. Sam needs equally vivid metaphors, like "medical directive vs conscious patient." 

  For structure: start with immediate conflict (messaging at midnight), then broaden to principles. End with fundamental impasse on who "owns" the self - past planner or present actor. No resolution, as requested.

