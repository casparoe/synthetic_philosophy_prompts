prompt: |-
  I'm running a peer tutorial next week for about twelve second-years in my philosophy-and-economics course — fifty minutes, and the topic is interpersonal utility comparisons. They've done basic consumer theory and Arrow's theorem but nothing on social welfare functions. I dont need the topic explained to me, I need a plan for explaining it: what has to be in place before the question even makes sense to them, and in what order the rest has to come.

  My hypothesis is that the real mess is that three different comparability claims get run together: comparing how well off two people are overall (levels), comparing the *size* of a gain across people (differences), and comparing units or scale so that one person's gain can count as twice another's. Is that the spine to build the session around, or too much for fifty minutes?

  I was going to carry it with one case: a fixed budget split between an able-bodied student and a wheelchair user who needs far more money to reach the same level of mobility. But that might drag in desert and disability stuff I don't want to get stuck arguing about. Is there a better carrying example, and what would it need to have and to lack?

  Misconceptions I'm expecting: "utility is just happiness, so this is easy"; "you can't compare, so fall back on Pareto"; "just use willingness to pay". Where in the sequence should I head each one off, and what should I flat-out refuse to cover? My tutor keeps saying Pareto is the only criteron you get for free and that it can't rank anything — I want them to feel that by the end. And give me one question to ask at the end that shows me whether they actually got it rather than just learned to say "it depends".
reasoning: |-
  Okay, the user is preparing a peer tutorial on interpersonal utility comparisons for second-year students in a philosophy-and-economics course. They've covered consumer theory and Arrow's theorem but not social welfare functions. The main challenge is structuring a 50-minute session that effectively unpacks the complexities without getting sidetracked.

  First, I need to address the core structure. The user's hypothesis about three comparability claims (levels, differences, units) seems solid but ambitious for 50 minutes. The key is to streamline it: focus on establishing the baseline concepts, then layer the comparability distinctions without getting too technical. The spine should be the progression from ordinal to cardinal utility, then to interpersonal comparisons, breaking down the types as they go.

  Next, the case study. The wheelchair user example is problematic because it introduces normative debates about disability and desert. Instead, a neutral example like coffee vs. tea preferences works better. It avoids emotional responses and keeps the focus on the mechanics of comparison. The example needs clear differences in preference intensity without real-world baggage.

  Misconceptions are a big concern. The "utility as happiness" myth needs debunking early. Willingness to pay and Pareto efficiency should be addressed after establishing the comparability framework, showing their limitations. The tutor's emphasis on Pareto's inadequacy aligns with the goal to make students feel its limitations by the end.

  Timing is tight. Allocating 5 minutes for setup, 20 for ordinal to cardinal transition, 15 for interpersonal breakdown, and 10 for implications and Q&A. The pivotal question at the end should force application: "Can we decide how to split $100?" This reveals if they grasp the dependency on comparability assumptions rather than defaulting to "it depends."

  I should also anticipate pitfalls. Avoiding social welfare functions keeps the scope manageable. The wheelchair example's drawbacks are valid; switching to beverages minimizes distractions. Emphasizing that utility isn't just happiness sets the right foundation early on.

  The user's deeper need is for students to critically engage with the assumptions underlying economic models, not just memorize conclusions. The session should leave them questioning the simplicity of Pareto and recognizing the hidden assumptions in policy decisions. Structuring the case study and misconceptions to build this awareness is crucial.
answer: |-
  Here’s a focused 50-minute plan built around your hypothesis, with a clean example and targeted misconception-busting:

  **Core Spine (Your Hypothesis is Perfect):**  
  Levels (who’s better off?) → Differences (who gains more?) → Units (scaling ratios). *This is achievable in 50 mins if disciplined.*

  **The Plan:**

  1.  **Groundwork: What Utility *Is* & Isn’t (5 mins)**
      *   **Quick Recap:** "Utility is an *ordinal* representation of preference ranking under certainty (Consumer Theory). U(A) > U(B) *only* means A is preferred to B by *that* individual. No inherent 'amount'."
      *   **Kill "Utility = Happiness":** "Forget happiness meters! Think 'satisfaction of preferences revealed by choice'. This is crucial for comparability." *(Head off "it's easy" misconception immediately)*
      *   **The Challenge:** "So how can we *possibly* compare my 'utils' to yours? What would that even mean?"

  2.  **Why We *Need* Comparability (5 mins)**
      *   **Pareto's Limitation:** "Pareto improvements are safe (Arrow showed us why!). But most real policy choices (taxes, subsidies, aid) *help some, hurt others*. Pareto is silent. We need more." *(Pre-empt "fall back on Pareto")*
      *   **The Question:** "To make *any* non-Pareto social choice, we *must* implicitly or explicitly make interpersonal comparisons. Let's break down what kinds exist."

  3.  **The Three Comparability Claims (20 mins - THE CORE)**  
      *Use the **Beverage Case**: Splitting $100 between Alex (loves expensive coffee) and Bo (loves cheap tea).*
      *   **Level Comparability (Who's Better Off?):**
          *   Scenario: *After* some split, is Alex "better off" than Bo?
          *   Problem: Requires comparing their *overall* preference satisfaction levels. Alex has a fancy latte ($5), Bo has 5 teas ($1 each). Alex *says* "I'm ecstatic!", Bo *says* "I'm content." Can we compare these *states*? Utterly subjective.
      *   **Difference Comparability (Who Gains More?):**
          *   Scenario: We have $10 *extra*. Giving $5 to Alex (buys 1 latte) vs. $5 to Bo (buys 5 teas). Who gets *more utility increase*?
          *   Problem: Even harder! We need to compare the *change* in satisfaction for Alex (Latte vs. Nothing) to the *change* for Bo (5 Teas vs. Nothing). Their scales are different! Alex might jump for joy, Bo might just be mildly pleased.
      *   **Unit Comparability (Scaling the Rulers):**
          *   Scenario: To make Alex *as well off* as giving Bo $1 for one tea, how much $ does Alex need? Is it $5 for a latte? More? Less?
          *   Problem: This assumes we can define a common "unit" of utility gain across people. One "util" for Bo = one tea? One "util" for Alex = 1/5th of a latte? Arbitrary scaling! *(This is where "willingness to pay" often sneaks in - address it next)*

  4.  **Tackling Misconceptions & Pitfalls (10 mins)**
      *   **"Willingness to Pay" is NOT Utility:** "Alex pays $5 for a latte, Bo pays $1 for tea. Does this mean Alex gets 5x more utility? NO! WTP reflects *both* preference intensity *and* ability to pay (income/wealth). Bo might *adore* tea just as intensely as Alex adores coffee, but be poor. WTP ≠ Utility Gain." *(Place this right after Unit Comparability)*
      *   **The Wheelchair Pitfall (Briefly Acknowledge):** "You might think of cases involving disability. Be careful! The core problem is *always* comparing subjective preference satisfaction scales. While needs differ, the *comparability challenge* remains the same fundamental one we see with coffee and tea. We'll avoid specific debates about need/desert today to focus on the logical structure." *(Prevents derailment)*
      *   **"So Does That Mean We Can't Do Anything?"** Transition to implications...

  5.  **Implications & The "Pareto-Only" Reality (7 mins)**
      *   **The Brutal Truth:** "Without *some* assumption of comparability (levels, differences, or units), we truly *are* stuck with Pareto. We *cannot* rigorously justify any redistribution or policy with winners and losers based solely on revealed preference."
      *   **Social Welfare Functions (Teaser):** "This is *why* SWFs explicitly *build in* specific comparability assumptions. Utilitarianism assumes unit comparability. Rawls' difference principle assumes level comparability (identifying the 'worst off'). They don't 'solve' the problem; they *choose* a way to handle it."
      *   **The Takeaway:** "Interpersonal comparisons aren't discovered facts; they are ethical *judgments* or *conventions* we must adopt to move beyond Pareto."

  6.  **Your Pivotal Closing Question (3 mins)**  
      *"We have $100 to split between Alex (coffee lover) and Bo (tea lover). We observe Alex buys lattes for $5, Bo buys teas for $1. Can we decide 'fairly' how to split the $100 **without** making an interpersonal comparison of utility? If we *do* decide, what specific type of interpersonal comparison (Levels, Differences, Units) must we be assuming?"*

      *   **Why it works:** Forces them to apply the distinctions. The *only* "fair" split without any interpersonal comparison is Pareto optimal (e.g., give all to one, or split where both get something they prefer to nothing). Any specific rule (equal $, equal utility gain, max sum) implicitly relies on one of the comparability assumptions. Reveals if they grasp the necessity of the ethical leap.

  **What to Flat-Out Refuse to Cover (Time Limits):**
  *   Detailed construction of specific SWFs (Utilitarianism, Rawls, etc.).
  *   Extended debate on the "reality" of utility or cardinal measurement *within* an individual (assume we can get cardinal for this session).
  *   Philosophical debates about desert, need, or equality beyond the basic comparability structure. Keep it focused on the *logical structure* of comparison.

  **Why This Works:**
  *   **Builds Sequentially:** Starts with uncontroversial ordinal utility, shows the *need* for comparability (Pareto limitation), then dissects *what* needs to be compared.
  *   **Your Spine is Central:** Explicitly names and separates Levels/Differences/Units.
  *   **Clean Example:** Beverages avoid normative minefields while clearly illustrating the 3 types. Preferences differ, intensities differ, prices differ – perfect storm.
  *   **Targets Misconceptions:** Hits "utility=happiness" and "WTP=utility" head-on early/mid-session. Saves the "Pareto-only" conclusion as the punchline.
  *   **Closes Strong:** The question tests comprehension of the core dilemma (necessity of ethical assumptions for non-Pareto choices) and the distinctions.

  **Stick ruthlessly to the timings!** Good luck – this is a tough topic made clear by your structure.
