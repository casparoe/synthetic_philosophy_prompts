  ### Decision Tree: Wittgenstein and the Theory of Concepts  
  *Start with the agreed commitment: A competent speaker can correctly apply a general term (e.g., "water," "game," "music") to a novel case, and some applications are simply wrong.*  

  ---

  #### Q1: **Twin Water Case**  
  A liquid indistinguishable from water (by ordinary senses) but with a different chemical composition (XYZ) is discovered. If you call it "water," are you making a mistake?  
  - **Yes** → Go to Q2  
  - **No** → Go to Q3  
  *Tests: Whether the term’s extension depends on underlying nature (rejects Claim A: no single shared feature).*  

  #### Q2: **Expert Error Case**  
  Experts declare a stone is a diamond using best available tests. Later, it’s found not to have a diamond’s crystal structure. Was it a diamond *at the time of expert declaration*?  
  - **Yes** → **Leaf: Social Externalism**  
  - **No** → **Leaf: Natural Kind Externalism**  
  *Tests: Whether the community/expert judgment fixes correctness (rejects Claim C: no rule settles every case).*  

  #### Q3: **Rule Stateability for "Game"**  
  Can a competent speaker *state a rule* (e.g., necessary and sufficient conditions) that settles whether every possible activity (e.g., chess, football, solitaire) is a "game"?  
  - **Yes** → **Leaf: Classical View**  
  - **No** → Go to Q4  
  *Tests: Whether correctness requires a stateable rule (rejects Claim C).*  

  #### Q4: **Family Features for "Game"**  
  Do all games share at least *one common feature* (e.g., competition, rules, or amusement)?  
  - **Yes** → Go to Q5  
  - **No** → Go to Q6  
  *Tests: Whether instances share a single feature (rejects Claim A).*  

  #### Q5: **Prototype "Game" Case**  
  A new activity has rules and competition but lacks amusement (e.g., a stressful corporate training exercise). Is it a "game" if it closely resembles chess?  
  - **Yes** → **Leaf: Prototype/Exemplar View**  
  - **No** → **Leaf: Inferential-Role View**  
  *Tests: Whether similarity to a central example determines application (related to Claim A).*  

  #### Q6: **Vagueness in "Game" Boundary**  
  Is there a precise line separating "game" from "not-game" for borderline cases (e.g., a competitive ritual with no winner)?  
  - **Yes** → **Leaf: Unnamed Position A**  
  - **No** → Go to Q7  
  *Tests: Whether boundaries are sharp (rejects Claim B).*  

  #### Q7: **Novel Practice: Machine "Music"**  
  A machine generates sound sequences with no human intent. Is there a fact *now* about whether it is "music"?  
  - **Yes** → Go to Q8  
  - **No** → Go to Q9  
  *Tests: Whether correctness depends on future/community input (rejects Claim C).*  

  #### Q8: **Community Agreement for "Music"**  
  If half the community calls the machine’s output "music" and half disagrees, is there still a fact of the matter?  
  - **Yes** → **Leaf: Inferential-Role View**  
  - **No** → **Leaf: Skeptical Position**  
  *Tests: Whether correctness is practice-licensed (rejects Claim C).*  

  #### Q9: **Dissolving the Demand**  
  When asking "What makes this music?", is the confusion *linguistic* (needing better rules) or *philosophical* (misguided)?  
  - **Linguistic** → **Leaf: Social Externalism**  
  - **Philosophical** → **Leaf: Quietism**  
  *Tests: Whether the question itself needs "dissolving" (rejects all three claims as ill-posed).*  

  ---

  ### Leaves: Named Positions  
  1. **Classical View**  
     - *Awkward commitment:* Borderline cases (e.g., text-based competitions) always have a determinate answer, even if unknowable.  
     - *Counterintuitive case:* Rules for "game" must cover machine-run competitions.  

  2. **Natural Kind Externalism**  
     - *Awkward commitment:* Speakers are always wrong about Twin Water, even if evidence is perfect.  
     - *Counterintuitive case:* Experts were wrong about the diamond from day one.  

  3. **Social Externalism**  
     - *Awkward commitment:* The fake diamond was a diamond until experts changed their minds.  
     - *Counterintuitive case:* Machine-generated sound is "music" if the community says so.  

  4. **Prototype/Exemplar View**  
     - *Awkward commitment:* A bird-shaped robot is not a "bird" no matter how convincing.  
     - *Counterintuitive case:* A joyless chess-like activity isn’t a "game" if dissimilar to prototypes.  

  5. **Inferential-Role View**  
     - *Awkward commitment:* Two speakers mean different things by "game" if their inferential habits differ slightly.  
     - *Counterintuitive case:* Machine "music" is indeterminate if it doesn’t fit existing reasoning patterns.  

  6. **Family-Resemblance View**  
     - *Awkward commitment:* No feature is essential to "game"; overlaps suffice (e.g., a non-competitive activity with rules and goals).  
     - *Counterintuitive case:* A text-based competition is a "game" if it shares enough features with diverse examples.  

  7. **Skeptical Position**  
     - *Awkward commitment:* No fact about past use fixes correctness; community agreement licenses future use.  
     - *Counterintuitive case:* No one was wrong about the fake diamond until consensus shifted.  

  8. **Quietism**  
     - *Awkward commitment:* Asking "What makes X a game?" traps us in a pseudo-problem; just describe usage.  
     - *Counterintuitive case:* Machine "music" needs no explanation—dissolve the question.  

  9. **Unnamed Position A**  
     - *Characterization:* Accepts sharp boundaries but no shared features or stateable rules.  
     - *Incoherence:* Rejects Claim A and B but not C—unstable.  

  ---

  ### Unseparated Leaf Pairs  
  1. **Family-Resemblance vs. Prototype/Exemplar**  
     - *Why inseparable?* Both deny a single shared feature but often agree on cases (e.g., text-based competitions).  
     - *Prying question:* "If a new activity shares features with many games but resembles *no* central example, is it a game?"  
       - Family-resemblance: Yes (overlaps suffice).  
       - Prototype: No (requires similarity to exemplars).  

  2. **Quietism vs. Skeptical Position**  
     - *Why inseparable?* Both deny determinate facts in novel cases.  
     - *Prying question:* "When experts disagree on machine ‘music,’ is the *search* for a fact misguided?"  
       - Quietism: Yes (dissolve the question).  
       - Skepticism: No (facts emerge from future practice).  

  ---

  ### Undefended Combinations  
  1. **Unnamed Position A** (from Q6→Yes):  
     - *Answers:* Accepts sharp boundaries (Q6→Yes) but no shared features (Q4→No) and no stateable rules (Q3→No).  
     - *Diagnosis:* Incoherent—sharp boundaries imply a rule or feature, but both are denied.  

  2. **Social Externalism + Classical View** (branching from Q1→No, Q2→Yes, but Q3→Yes):  
     - *Answers:* Twin Water isn’t water (Q1→No), fake diamond was a diamond (Q2→Yes), and rules are stateable (Q3→Yes).  
     - *Diagnosis:* Unattractive—deference to experts clashes with speaker-statable rules.  

  3. **Natural Kind + Quietism** (branching from Q1→No, Q2→No, but Q9→Philosophical):  
     - *Answers:* Twin Water isn’t water (Q1→No), fake diamond was never a diamond (Q2→No), but dissolves explanation demands (Q9→Philosophical).  
     - *Diagnosis:* Unexplored—quietism typically rejects externalist "natures."  

  ---

  ### Vagueness Debate  
  - **Attaches at:** Q6 (vagueness in boundaries).  
  - **Excluded from trunk:** Vagueness (Claim B) is often orthogonal to what *fixes* correctness (e.g., social vs. natural kinds), and many positions accommodate it. The trunk focuses on extension-fixing mechanisms.
