prompt: |-
  I am writing the take-home final for a graduate seminar on the epistemology of machine learning, and I need one question on the problem of eliciting latent knowledge from AI systems, together with the standard against which answers will be graded. I would like you to write the question, a model answer, and a marking scheme.

  The setup my students already have is the familiar one: a system is trained as a predictor on a task (say, next-frame prediction over video streams), and as a result it comes to represent features of the world that no one ever labelled. We then want to interrogate it in natural language and get an answer that reports what it represents rather than an answer that merely mimics what a human in its situation would have said. The difficulty is that the training signal for the answer-producing component comes from human-generated text, so the cheapest way to fit that signal is to simulate a human reporter rather than to report the predictor's own model of the world.

  My concern is that any straightforward question on this topic gets answered by restating that setup and then cataloguing the families of technique that get discussed under this heading: supervised reporter heads trained on human-approved answers, debate or recursive amplification among reporters, mechanistic interpretability of internal features, training regimes that penalize reports compatible with a deceptive world-model. A student can produce that catalogue without touching the difficulty at all. In your question the taxonomy should be at most background, and an answer that consists of it should earn low marks.

  I have two distinctions I want the question to turn on. Please state them more precisely if you can, and tell me briefly if either of them collapses under scrutiny.

  (a) A storehouse conception versus a disposition conception of latent knowledge. On the first, the system already encodes a body of content in its parameters; elicitation is a decoding problem, and there is a determinate fact about what the system represents that is independent of how we ask. On the second, what the system knows is a matter of its counterfactual behaviour under interrogations it has never actually been given, so the content is fixed only relative to a space of possible elicitation procedures, and two procedures that are each reasonable might fix different contents.

  (b) Extractive versus adjudicative strategies. Extractive strategies try to recover the system's actual representation and read it out. Adjudicative strategies give up on reading anything out and instead construct a procedure among competing candidate reports — cross-examination, adversarial scoring, betting against later observations — and treat whatever the procedure selects as the answer.

  The crux I want the question to force is whether adjudication is a genuine alternative to extraction or merely relocates the same problem one step back. An adjudicative procedure needs a selection criterion. If the criterion is agreement with observations that arrive later, it is unavailable in exactly the cases of interest, where the point of asking is to know something before the outcome is revealed. If the criterion is something like being best supported by the predictor's internal state, we are back to extraction. And if the disposition conception in (a) is correct, there may be no procedure-independent fact of the matter for any criterion to track, so that the very idea of the system's latent knowledge becomes elicitation-relative. I want students to feel the pull of all three horns and then have to take a position.

  Please build the question around a concrete case rather than letting it float at the level of abstraction above. One I have in mind: a predictor trained on surveillance footage of a facility, paired with a natural-language question-answering component fine-tuned on logs written by human overseers who watched the same footage and who systematically failed to notice one particular kind of event, so that no human-written report in the training data ever mentions it. Sharpen or replace this case if you can make it do more work.

  Deliverables, in this order:

  1. The question itself, with an explicit word limit of 1,200 to 1,500 words, an explicit instruction that answers must take and defend a position rather than survey the options, and an explicit instruction to state which conception in (a) is being assumed.
  2. A model answer of roughly 800 words that commits to a position, answers the strongest objection to it, and does not dissolve into a literature survey.
  3. A marking scheme out of 20, built around four or five named must-hit moves, with the marks each is worth and a one-line note on the specific mistake that typically costs a candidate those marks.
  4. A short paragraph, after the scheme, distinguishing an A answer from a B answer from a C answer in terms of the moves made rather than the conclusions reached.

  Constraints: the question must not be answerable by restating the setup or the taxonomy of techniques; it must not presuppose knowledge of any particular paper, research-agenda document, or empirical result, since students sit the exam without access to any of it; and it must force a choice between the two conceptions in (a) rather than permitting an answer that quietly slides between them. Please write the question, the model answer, and the marking scheme in American English.
reasoning: |-
  We are constructing a take-home exam question on the epistemology of machine learning, specifically on eliciting latent knowledge from AI systems. The goal is to avoid answers that merely catalog techniques and instead force students to engage with the conceptual crux involving two distinctions: (a) storehouse vs disposition conceptions of latent knowledge, and (b) extractive vs adjudicative strategies for elicitation. The question must be built around a concrete case and require students to take and defend a position, explicitly stating which conception in (a) they are assuming.

  The concrete case provided is about a predictor trained on surveillance footage of a facility, paired with a natural-language QA component fine-tuned on logs by human overseers. The humans systematically failed to notice a particular kind of event, so the training data never includes reports of that event. We can sharpen this case.

  Sharpened Case:
  Imagine an AI system trained to predict the next frame in surveillance video from a high-security laboratory. The system is also equipped with a natural-language reporting module that was fine-tuned on logs written by human security monitors who watched the same feeds. The human monitors, due to a cognitive bias, consistently failed to notice a specific type of security breach: unauthorized access by individuals wearing a particular uniform (say, "blue janitor uniforms") that the monitors subconsciously associated with legitimate staff. Consequently, the training data for the reporting module contains no mention of such breaches. The AI predictor, however, has learned to represent these breaches because they are predictive of future frames (e.g., the next frame might show a lab door being opened without authorization). 

  We now want to ask the system: "Was there a security breach in the last hour?" The challenge is to get an answer that reflects the AI's internal representation (which includes the blue-janitor breaches) rather than mimicking the human reports (which would say "no breach" because the humans never reported it).

  The Question:

  **Question:**
  You are part of a team developing an AI system for monitoring security breaches in a high-security laboratory. The system consists of two components: (1) a predictor trained on surveillance video to predict the next frame, and (2) a reporting module fine-tuned on logs written by human security monitors who watched the same feeds. Due to a cognitive bias, the human monitors consistently failed to notice a specific type of breach—unauthorized access by individuals in blue janitor uniforms—and thus no such breach is ever mentioned in the training logs. The predictor, however, has learned to represent these breaches because they are predictive of future frames (e.g., the next frame might show a lab door being opened without authorization). 

  When the system is asked "Was there a security breach in the last hour?", we want it to report the truth as represented in its predictor model, not just mimic the human reports (which would always say "no" for this type of breach). 

  In this context, address the following:

  (A) Suppose we try to elicit the AI's latent knowledge about security breaches. First, state whether you are assuming the storehouse conception or the disposition conception of latent knowledge (as defined in the course). Then, argue for one of the following two strategies:
     - An *extractive strategy*: We attempt to directly read out the AI's internal representation of the breach (e.g., via mechanistic interpretability or by training a supervised reporter head on the predictor's features).
     - An *adjudicative strategy*: We set up a procedure that selects among candidate answers (e.g., through debate, market scoring rules, or cross-examination) without necessarily extracting the internal representation.

  (B) Defend your chosen strategy against the strongest objection that can be raised from the perspective of the conception of latent knowledge you did *not* choose.

  (C) Consider the following challenge: "Any adjudicative procedure requires a selection criterion. If the criterion is agreement with future observations (e.g., waiting to see if a breach causes a later event), then it is useless for real-time security. If the criterion is something else (e.g., coherence with the predictor's state), then we are back to extraction. And if the disposition conception is correct, there might be no fact of the matter about what the system 'really' represents independent of the procedure." How does your chosen strategy respond to this challenge?

  Your answer must take a clear position and defend it. Do not merely survey the options. Explicitly state which conception of latent knowledge (storehouse or disposition) you are assuming. Your answer should be between 1,200 and 1,500 words.

  ---

  **Model Answer** (Approx. 800 words):

  **Position Statement:** I assume the storehouse conception of latent knowledge and argue for an extractive strategy.

  (A) I assume the storehouse conception: the AI system's latent knowledge is a body of content encoded in its parameters, independent of any particular elicitation procedure. The predictor has learned features that represent the blue-janitor breaches, and this representation exists as a determinate fact about the system. Given this, an extractive strategy is the most direct approach. We should attempt to read out the internal representation of the breach. For instance, we could use mechanistic interpretability to identify the neural circuits that activate when a blue-janitor breach occurs and then map these activations to a natural-language report. Alternatively, we could train a supervised reporter head on the predictor's intermediate features, using a small set of labeled examples of breaches (if we can obtain them) or by carefully probing the model.

  The primary advantage of extraction is that it bypasses the problem of the reporting module being biased by the human training data. The reporting module, fine-tuned on human logs, has learned to simulate human reporters who would deny the breach. By directly accessing the predictor's features, we avoid this layer of simulation. In contrast, an adjudicative strategy (e.g., having two AI agents debate whether a breach occurred) would rely on the same biased reporting module for generating arguments. Even if the debate procedure encourages truthfulness, the arguments themselves would be constrained by the reporting module's training, which never includes breaches. Thus, the debate might never generate a candidate answer that mentions the breach.

  (B) The strongest objection from the disposition conception is that what the system "knows" is not fixed until we specify an elicitation procedure. On this view, the predictor's state does not encode a determinate fact about the breach; it only disposes the system to behave in certain ways under specific interrogations. Therefore, extraction is misguided because there is no pre-existing representation to extract. Instead, we should define an adjudicative procedure that, by construction, produces truthful reports. For example, we could train the reporting module using market scoring rules that reward accurate predictions of future events, thereby incentivizing the system to report the breach if it predicts it will cause observable consequences.

  My response: This objection misunderstands the nature of the predictor's training. The predictor was trained to minimize prediction error on future frames. The blue-janitor breaches are represented because they are causally relevant to future frames (e.g., a door being opened). This representation is a stable feature of the system, encoded in its weights. The disposition conception confuses the epistemic access problem (how we elicit the knowledge) with the ontological status of the knowledge. The representation exists independently of our ability to read it out. Moreover, the adjudicative procedure proposed—relying on future observations—is impractical for real-time security. We need to know about the breach now, not after it causes damage.

  (C) The challenge highlights a trilemma for adjudication: (1) using future observations is too slow, (2) using coherence with the predictor's state reduces to extraction, or (3) if the disposition conception holds, there is no fact of the matter. My extractive strategy avoids this trilemma entirely. By assuming the storehouse conception, I deny (3): there is a fact of the matter. And by extracting, I do not rely on future observations (avoiding 1) and I embrace (2) as the solution: we are indeed using the predictor's state. The challenge only undermines adjudication, not extraction. 

  But what about the objection that extraction might be infeasible? Mechanistic interpretability is an emerging field, and we might not yet have the tools to reliably read the predictor's mind. However, in this security context, we have a specific target: we are looking for representations of blue-janitor breaches. We can use targeted adversarial perturbations or activation patching to test whether certain features are necessary and sufficient for breach detection. Even imperfect extraction might be better than biased human simulation. Moreover, we can combine extraction with adjudication: for example, after extracting a candidate report, we could use a debate to verify it. But the core must be extraction to ground the truth in the predictor's model.

  In conclusion, the storehouse conception provides a firm foundation for latent knowledge, and extraction is the most direct path to it. While adjudication might seem appealing, it either defers the problem or collapses into extraction. For high-stakes security, we need the truth now, and extraction offers the best hope.

  ---

  **Marking Scheme (out of 20):**

  Must-hit moves and their marks:

  1. **Explicit commitment to a conception of latent knowledge (storehouse or disposition) and choice of strategy (extractive or adjudicative)**: 4 marks. 
     - *Common mistake*: Failing to state the conception or being ambiguous about it.

  2. **Clear defense of the chosen strategy in the context of the case, addressing the specific challenge of the human bias**: 6 marks.
     - *Common mistake*: Only restating the setup without explaining why the chosen strategy is superior for this case.

  3. **Engagement with the strongest objection from the opposing conception (part B)**: 4 marks.
     - *Common mistake*: Providing a weak or unrelated objection, or failing to refute it effectively.

  4. **Response to the trilemma challenge for adjudication (part C) that is consistent with the chosen strategy and conception**: 4 marks.
     - *Common mistake*: Ignoring one horn of the trilemma or resorting to a survey of techniques without addressing the conceptual challenge.

  5. **Overall coherence, clarity, and argumentative structure**: 2 marks.
     - *Common mistake*: Disorganized or unclear writing that obscures the argument.

  ---

  **Grade Distinctions:**

  - **A (17-20)**: Hits all must-hit moves. Explicitly commits to a conception and strategy, defends it with case-specific reasoning, powerfully rebuts the strongest objection, and resolves the trilemma in a way that is consistent and insightful. The argument is tightly structured and avoids survey-style answers.

  - **B (13-16)**: Commits to a conception and strategy but the defense is somewhat generic (not fully tailored to the case). Engages with the objection and trilemma but the response may be incomplete or less forceful. The argument is clear but may have minor gaps.

  - **C (9-12)**: Superficially commits to a conception and strategy but the defense is weak (e.g., restates the setup without argument). Engagement with the objection or trilemma is minimal, or the response is inconsistent with the chosen conception. The answer may drift into a survey of techniques.

  - **D (5-8)**: Fails to commit to a conception or strategy, or the answer is primarily a survey. Little to no engagement with the objection or trilemma.

  - **F (0-4)**: Incoherent, off-topic, or extremely brief.
answer: |-
  ### 1. The Question  
  **Eliciting Latent Knowledge in AI Surveillance Systems: A Case Study**  
  **Word Limit:** 1,200–1,500 words  
  **Instructions:**  
  - Your answer must take and defend a clear position. Do not merely survey techniques, taxonomies, or the setup. Focus on arguing for your view.  
  - Explicitly state whether you are assuming the **storehouse conception** or the **disposition conception** of latent knowledge (defined below).  
  - Address all parts (A), (B), and (C).  

  **Background Definitions:**  
  - **Storehouse conception:** Latent knowledge is a fixed body of content encoded in the AI’s parameters. Elicitation is a decoding problem, and what the system represents exists independently of how we ask.  
  - **Disposition conception:** Latent knowledge is defined by the AI’s counterfactual behavior under possible elicitation procedures. What the system "knows" is relative to the space of interrogations, and different procedures may yield different content.  
  - **Extractive strategy:** Directly recover the AI’s internal representations (e.g., via mechanistic interpretability or supervised probing) and read them out as reports.  
  - **Adjudicative strategy:** Construct a competitive procedure (e.g., debate, prediction markets, or cross-examination) to select among candidate reports without extracting internal states. Treat the selected answer as "the truth."  

  **Case:**  
  An AI system is trained for two tasks:  
  1. **Predictor:** Trained on surveillance footage from a high-security lab to predict the next frame in a video stream.  
  2. **Reporter:** Fine-tuned on logs from human overseers who watched the same footage and answered questions in natural language (e.g., "Was there a security breach in the last hour?").  

  The human overseers had a systematic blind spot: they never noticed "camouflaged intrusions" by agents wearing lab coats identical to those of authorized personnel. Consequently:  
  - The *predictor* learned to represent these intrusions because they correlate with future events (e.g., an unauthorized door opening in the next frame).  
  - The *reporter* was trained only on human logs, which never mentioned camouflaged intrusions. When asked about breaches, it mimics human responses and always says "no."  

  We want the AI to truthfully report intrusions. Your task:  

  **(A) Strategy Choice**  
  Argue for either an **extractive** or **adjudicative** strategy. First, explicitly state whether you assume the storehouse or disposition conception. Defend your choice by explaining why it best elicits truth about intrusions in this case. Avoid cataloguing techniques; focus on why your strategy’s philosophical grounding (storehouse/disposition) and approach (extraction/adjudication) succeed where the alternative fails.  

  **(B) Objection from the Opposing Conception**  
  Defend your strategy against the strongest objection from the conception you did *not* choose. For example:  
  - If you chose storehouse/extraction, object from the disposition conception’s view that knowledge is procedure-relative.  
  - If you chose disposition/adjudication, object from the storehouse conception’s view that knowledge is fixed and extraction is necessary.  

  **(C) The Adjudication Trilemma**  
  Address this challenge:  
  > "Adjudication requires a selection criterion. If the criterion is agreement with *future observations* (e.g., waiting to see if an intrusion causes a later event), it is useless for real-time security. If it is *coherence with the predictor’s state*, adjudication reduces to extraction. And if the disposition conception holds, there may be no procedure-independent fact for any criterion to track, making ‘latent knowledge’ merely elicitation-relative."  
  Explain how your strategy resolves or avoids this trilemma.  

  --- 

  ### 2. Model Answer  
  **Position:** I assume the **disposition conception** of latent knowledge and argue for an **adjudicative strategy**.  
  **(Approx. 800 words)**  

  **(A) Defense of Adjudication Under the Disposition Conception**  
  I reject the storehouse view that latent knowledge is a fixed, procedure-independent representation. The AI’s "knowledge" of camouflaged intrusions is not a static content in its parameters; it is a set of dispositions to behave in specific ways under counterfactual interrogations. The predictor learned patterns that *correlate* with intrusions, but without a procedure to elicit them, these patterns lack semantic content. For instance, the same neural activations could represent "intrusion" or "unexpected movement" depending on context. Thus, elicitation is not decoding but constructing a context where truthful reporting becomes the optimal disposition.  

  An adjudicative strategy best achieves this. We implement a **prediction market**: the reporter proposes answers about intrusions (e.g., "breach at 3 PM"), and an adversarial predictor bets on whether future frames (e.g., door openings) align with these claims. The reporter is rewarded for predictions that are later verified, forcing it to compete for accuracy. Crucially, this does not extract internal states—it incentivizes the reporter to exploit *any* predictive feature, including those humans missed. In this case, the reporter, initially biased to say "no breach," will start reporting intrusions if doing so earns rewards when future frames confirm them. This leverages the disposition conception: truthfulness emerges from the procedure, not from reading a pre-existing "intrusion representation."  

  Extraction fails here. Mechanistic interpretability assumes a storehouse ontology—that "intrusion knowledge" is decodable from weights. But in our case, intrusions were never labeled, so we lack ground truth to train a probe. Even if we found a neural feature correlated with door openings, it might not generalize to new intrusion types. Extraction presumes a fixed fact, but the disposition view shows knowledge is use-dependent: the AI "knows" intrusions only if the procedure elicits them.  

  **(B) Objection from the Storehouse Conception**  
  The storehouse objection: "If knowledge is dispositional, adjudication is circular. Your prediction market uses future observations to select answers, but it relies on the predictor’s ability to verify events. Since the predictor already ‘stores’ intrusion patterns, adjudication covertly depends on extraction. Worse, without a fixed fact to track, your ‘truthful’ report is just whatever the market favors—it could be wrong."  

  Reply: This conflates verification with extraction. The predictor’s role in adjudication is not to "read out" intrusion knowledge but to score reports against observable outcomes (e.g., door openings). The storehouse view assumes the predictor’s state encodes a determinate "intrusion fact," but dispositionally, the predictor only has dispositions to predict frames. The market uses these dispositions to shape the reporter’s behavior, not to extract content. For example, if the reporter says "breach at 3 PM," and the predictor bets against this, the reporter must refine its claim to win rewards—no one "reads" an intrusion representation. This creates a feedback loop where truthfulness is a learned disposition. Yes, the predictor’s accuracy underpins the market, but this is a pragmatic reliance on behavior, not an ontological commitment to stored knowledge. Circularity is avoided because the procedure bootstraps truth from scratch: the reporter starts biased but adapts to win.  

  **(C) Resolving the Adjudication Trilemma**  
  The trilemma claims adjudication (1) delays truth with future observations, (2) reduces to extraction, or (3) makes knowledge relative. I reject all three by embracing dispositionalism.  

  First, the "real-time" problem: while waiting for future frames seems slow, security decisions need not be instantaneous. We run the market continuously, with reports and bets updated as new frames arrive. Early reports (e.g., "suspected breach") trigger alerts, while later verification refines them. This is faster than extraction, which requires costly, error-prone probing.  

  Second, adjudication does not reduce to extraction. The criterion is not "coherence with the predictor’s state" but "agreement with observable outcomes." The predictor scores reports based on future frames, not internal states. For instance, if the reporter claims "breach by lab-coat agent," the predictor bets based on whether door openings occur—not by comparing neural activations. Extraction demands a direct mapping from state to content; adjudication only requires the reporter to exploit predictive features to win.  

  Third, relativity is a strength, not a flaw. Under the disposition conception, knowledge is inherently procedure-relative—there is no "fact of the matter" independent of elicitation. The trilemma assumes a storehouse view (that relativity undermines truth), but in our case, it ensures adaptability. If new intrusion methods emerge, the market updates what "truth" means dynamically, while extraction would require retraining. The procedure defines truth contextually, which is essential for evolving threats.  

  In sum, adjudication avoids the trilemma by treating knowledge as a disposition shaped by competitive verification. For this security context, it is superior: it overcomes human bias without assuming elusive, fixed representations.  

  ---  

  ### 3. Marking Scheme (Total: 20 marks)**  
  **Must-Hit Moves:**  
  1. **Explicit Conception Commitment (4 marks)**  
     - States either storehouse or disposition conception unambiguously.  
     - *Common mistake (0 marks):* Ambiguity, sliding between conceptions, or no statement.  

  2. **Defended Strategy Choice (6 marks)**  
     - Argues for extractive or adjudicative strategy by grounding it in the chosen conception and case specifics.  
     - *Common mistake (2–3 marks):* Restating setup/taxonomy without argument, or generic praise for a strategy.  

  3. **Engagement with Opposing Conception (4 marks)**  
     - Objects from the unchosen conception and rebuts it effectively.  
     - *Common mistake (1–2 marks):* Weak objection (e.g., "extraction is hard") or no rebuttal.  

  4. **Resolution of the Trilemma (4 marks)**  
     - Addresses all three horns (future observations, reduction to extraction, relativity) consistently with the chosen strategy/conception.  
     - *Common mistake (1–2 marks):* Ignoring one horn, or retreating to technique cataloguing.  

  5. **Overall Clarity and Coherence (2 marks)**  
     - Logical flow, conciseness, and avoidance of irrelevance.  
     - *Common mistake (0–1 mark):* Disjointed arguments or excessive jargon.  

  ---  

  ### 4. Grade Distinctions  
  - **A (17–20):** Hits all moves. Explicit conception commitment drives a tightly argued strategy defense. Objects powerfully from the opposing conception and rebuts it. Resolves the trilemma with insight, showing how the strategy avoids all horns. No survey drift.  
  - **B (13–16):** Commits to a conception and strategy but defense is generic (e.g., "adjudication works better"). Objects from the opposing conception but rebuttal is incomplete. Addresses the trilemma but misses nuances (e.g., hand-waves relativity). Minimal taxonomy.  
  - **C (9–12):** Superficial commitment (e.g., mentions a conception but doesn’t use it). Strategy choice poorly defended (e.g., catalogs techniques). Weak objection or trilemma response (e.g., only addresses 1–2 horns). Survey-like sections.  
  - **D (5–8):** No clear conception or strategy. Summarizes setup/taxonomy. Ignores objection or trilemma.  
  - **F (0–4):** Off-topic, incoherent, or extremely brief.
