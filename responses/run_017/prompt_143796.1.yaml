prompt: |-
  I teach a graduate seminar on the epistemic foundations of game theory — common knowledge, common belief in rationality, and the work that higher-order beliefs are supposed to do in selecting among equilibria. I want to test that framework against an actual episode rather than another puzzle, so: analyse the failure of Silicon Valley Bank in March 2023 through it, and then tell me where the framework stops being informative.

  I will stipulate the facts. SVB had invested a large share of its swollen deposit base in long-dated Treasuries and mortgage securities, whose market value fell as the Fed raised rates; unrealized losses on the held-to-maturity portfolio exceeded fifteen billion dollars. On 8 March the bank announced that it had sold over twenty-one billion dollars of securities at a loss, borrowed fifteen billion, and would raise 2.25 billion in equity. Prominent venture investors publicly advised their portfolio companies to move their money. Customers withdrew funds totalling forty-two billion dollars by the following day; the bank was seized on 10 March. Roughly eighty-nine percent of its deposit liabilities were uninsured. Two days later the authorities announced that all depositors, insured or not, would have full access to their funds, and the immediate panic subsided — while First Republic, with a comparably uninsured deposit base, was closed on 1 May despite thirty billion dollars in deposits placed with it by eleven banks in March.

  What I want is a disciplined mapping, not a narrative: who the players are, what the option set and payoff structure actually looked like for a depositor on the morning of 9 March, what has to be true of first- and higher-order beliefs for mass withdrawal to be an equilibrium rather than merely individually rational, and how the public guarantee should be modelled — as a change in the payoffs, or as an intervention on beliefs, and if the latter, what the theory predicts about the difference between its working at SVB and not working at First Republic.

  Then the return direction, which interests me more. First: was this a coordination failure at all? SVB's deposits paid close to nothing while short-term government paper yielded around five percent, so withdrawal may have been a dominant strategy irrespective of what anyone else did. If so the model is imposing a self-fulfilling structure on what was really a common adverse shock. Say what would distinguish the two readings, and whether the framework can distinguish them from the outside; if it cannot, is that a defect in the theory or a limitation on its use? Second: the depositor base was unusually small, densely networked, and able to watch one another's reasoning almost in real time. Does that transparency move the situation toward or away from the theory's idealised conditions, and — since transparency plainly does not by itself say which equilibrium gets coordinated on — whether near-common knowledge behaves like common knowledge here or departs from it disproportionately. Finally, the normative question: if staying and running are both equilibrium outcomes under common belief in rationality, can the framework say that anything went wrong at SVB, or does it have to import something from outside itself? Where it has nothing to say, say so rather than forcing it to speak.
reasoning: |-
  Okay, the user teaches a graduate seminar on epistemic game theory and wants to apply concepts like common knowledge and higher-order beliefs to the Silicon Valley Bank collapse. They've provided specific facts about SVB's situation and want a disciplined analysis rather than a narrative. 

  First, I need to map this to a coordination game framework. The players are depositors, each facing a binary choice: withdraw or stay. The payoff structure depends on what others do. If all stay, SVB survives and depositors keep their funds but miss out on higher yields elsewhere. If too many withdraw, the bank fails and depositors without insurance lose money. The user wants clarity on how first-order and higher-order beliefs make mass withdrawal an equilibrium.

  The key is that withdrawal isn't always dominant - if you believe others will stay, staying might be rational. But with uninsured deposits, the fear that others will run makes running self-fulfilling. This requires depositors to believe others believe a run is likely, and so on - infinite regress of beliefs. 

  The public guarantee changes payoffs directly by removing the loss from bank failure. But it also affects beliefs - if depositors believe the guarantee is credible, they no longer fear losses. The difference between SVB and First Republic might be timing or perceived commitment - the guarantee came too late for First Republic, or depositors doubted it would apply again.

  The user's deeper questions are crucial. Was this truly coordination failure or just rational response to fundamentals? With near-zero interest at SVB versus 5% elsewhere, withdrawing might have been dominant regardless. The framework struggles to distinguish this without precise data on insolvency risk absent a run. This isn't necessarily a flaw - it shows the theory's boundaries.

  The dense network among SVB depositors created near-common knowledge, which should theoretically facilitate coordination. But it doesn't predict which equilibrium gets selected - panic can spread faster in connected groups. 

  Normatively, the framework is silent. If both run and stay are equilibria under common belief in rationality, there's no internal criterion to say which is "better." We need external norms about efficiency or fairness. The theory describes; it doesn't prescribe.

  The user seems sophisticated - they're explicitly asking where the framework stops being useful. I should honor that by clearly marking the boundaries: where beliefs become unverifiable, where payoff structures are ambiguous, and where normative judgments begin.
answer: |-
  Here is a disciplined epistemic game-theoretic analysis of the SVB collapse, structured to address your queries:

  ### Core Coordination Game Structure (Depositor's Perspective, Morning of 9 March)
  1. **Players**: Uninsured depositors (representative agent; homogeneous for simplicity).  
  2. **Actions**: *Withdraw* (W) or *Stay* (S).  
  3. **Payoffs** (contingent on aggregate withdrawal proportion *θ*):  
     - If *θ* < critical threshold *θ_c* (solvency maintained):  
       - **W**: Get full deposit + opportunity cost saved (≈5% yield elsewhere)  
       - **S**: Keep deposit at SVB (≈0% yield)  
     - If *θ* ≥ *θ_c* (bank fails):  
       - **W**: Recover full deposit (if early in line) or partial deposit (if late)  
       - **S**: Recover partial deposit (haircut)  
     *Assumption: Payoff dominance for W when failure is certain, but S preferred if solvency assured.*

  ### Equilibrium Selection via Belief Hierarchies
  - **First-order belief**: Each depositor believes SVB is fundamentally insolvent without a run (due to asset losses exceeding equity).  
  - **Higher-order beliefs for run equilibrium**:  
    - **Order 2**: Each believes *others believe SVB is insolvent*.  
    - **Order 3**: Each believes *others believe that others believe SVB is insolvent*.  
    - **... → Common belief in insolvency**: Infinite hierarchy where all believe insolvency, believe others believe it, etc.  
    - **Result**: *W* becomes strictly dominant if common belief in insolvency holds (regardless of others' actions).  

  ### Public Guarantee as Intervention
  - **Modeled as payoff transformation**: Changes bank failure payoffs:  
    - **New payoff if *θ* ≥ *θ_c***: All depositors recover full deposits regardless of action.  
  - **Epistemic effect**: Undercuts common belief in insolvency. If the guarantee is *common knowledge*, the game reverts to a coordination game with two equilibria:  
    - *All S* (bank survives, no yield loss)  
    - *All W* (bank fails but no loss; dominated due to transaction costs)  
  - **SVB vs. First Republic divergence**:  
    - **SVB (Mar 12)**: Guarantee was immediate, unconditional, and credible (Treasury/FDIC backing). Common knowledge of payoff change halted runs.  
    - **First Republic (May 1)**: Guarantee was delayed, partial (only $30B deposits), and lacked credibility (private banks, not FDIC). Higher-order doubts persisted:  
      - *Order 1*: "Is FR still insolvent even with $30B?"  
      - *Order 2*: "Do others believe FR is solvent?"  
      - *Failure to establish common knowledge of solvency* → run equilibrium persisted.  

  ### Critical Tensions in the Framework  
  1. **Coordination Failure vs. Dominant Strategy**:  
     - **Dominant strategy case**: If SVB's insolvency was certain *independent of withdrawals* (e.g., unrealized losses > equity + recoverable assets), W dominates S regardless of others' actions.  
     - **Coordination failure case**: If SVB could survive with deposits (θ < θ_c), but common belief in insolvency made W rational.  
     - **Distinguishing empirically**: Requires verifying if *θ_c* was exceeded *before* the run (SVB's unrealized losses exceeded equity, but liquidity could have covered withdrawals if staggered).  
     - **Framework limitation**: Cannot distinguish without precise common knowledge of fundamentals. If depositors *commonly believe* insolvency is fundamental, W is dominant; if they believe insolvency depends on others, it's coordination. Theory treats both as belief-driven, masking objective reality.  

  2. **Networked Depositors and Near-Common Knowledge**:  
     - **Transparency effect**: Real-time coordination (via VC tweets, messaging apps) approximates common knowledge faster.  
     - **Departure from idealization**:  
       - Common knowledge selects *an* equilibrium but not *which one*. Network effects amplify momentum toward one outcome (here, run).  
       - **Disproportionality**: Near-common knowledge of "VCs advise withdrawal" created focal points, overriding fundamentals. Theory predicts faster convergence but not directional bias.  

  3. **Normative Silence**:  
     - If both (All S) and (All W) are equilibria under common belief in rationality, the framework cannot label either as "wrong."  
     - **What went wrong at SVB?**:  
       - Fundamental insolvency risk (regulatory failure, duration mismatch).  
       - Informational cascade (VCs created focal point for run).  
     - **Epistemic theory's blind spot**: It cannot judge if (All S) is Pareto-superior to (All W) without exogenous welfare criteria. Coordination failure is *descriptive*, not normative.  

  ### Where the Framework Stops Being Informative  
  | **Aspect**               | **Framework's Capability**                                                                 | **Limitation**                                                                 |
  |--------------------------|-------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------|
  | **Fundamental solvency** | Requires common knowledge of fundamentals; cannot verify objective truth.                 | Cannot resolve if W was dominant or coordination-driven without perfect info. |
  | **Equilibrium selection**| Explains how beliefs sustain equilibria; cannot predict which equilibrium emerges.        | Network effects create path-dependence outside the model.                     |
  | **Normative evaluation** | Cannot rank equilibria; no internal concept of "efficiency" or "fairness."                | Requires importing welfare economics or ethics.                               |
  | **Intervention efficacy**| Models how guarantees alter payoffs/beliefs; cannot quantify credibility or timing effects.| Real-world credibility depends on politics/history (exogenous).               |

  **Conclusion**: The epistemic framework elegantly explains why SVB's collapse was a self-fulfilling run under common belief in insolvency, and how the guarantee worked by shifting payoffs and beliefs. However, it cannot adjudicate whether the run was "justified" by fundamentals, explain why VCs coordinated on panic (focal points exceed belief hierarchies), or normatively critique the outcome. It treats beliefs as primitives, making it descriptive but not prescriptive—a tool for understanding coordination, not for diagnosing system failures or designing policy. Your case study reveals its power in dissecting strategic interdependence and its silence on everything else.
