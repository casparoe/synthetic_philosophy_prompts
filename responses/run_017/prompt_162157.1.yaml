prompt: |-
  I'm a science journalist — I cover neuroscience, psychology and machine learning for a magazine and a small newsletter — and I got talked into this at a dinner after a panel on neural correlates of consciousness, where I said, perhaps too confidently, that most coverage of that literature misses a single unresolved dispute that decides how the results should be read. The consequence is that in June I'm running one ninety-minute hands-on session at a week-long writing retreat for about fourteen early-career science communicators: mostly freelance writers and university press officers, two or three with a cognitive-science degree and the rest with none. The room has a projector, index cards, pens, a phone for timers and unreliable wifi; there's no budget, no real money for stakes, and every participant is expected to publish a short piece afterwards based on the session, so whatever happens has to be something they can write honestly about rather than a stunt.

  The dispute I want them to run into is the one about whether a mental state's being conscious consists in the subject's being, in some way, aware of being in that state — the family of higher-order views, in the version where the second-order state is something like a thought or a tacit judgment that one is in it. I want them to feel both halves of it: the pull of the idea (that a sensation you are in no way aware of seems not to be like anything for you) and the force of the complaint that it gets things wrong, that people plainly have conscious experiences while absorbed and unaware that they are in them, and that the view seems to over-intellectualize consciousness by making it require a further act of self-monitoring that infants, animals and distracted adults might never perform. I've roughed out three mechanics and I want you to turn them into something runnable, or to replace them if you can do better. First: a beeped experience-sampling procedure, in which participants do a demanding continuous task and, at unpredictable intervals, write down what was present in experience at the instant of the beep — I want them to notice the gap between the state they were in and the report they produce a moment later, and in particular to confront the strange implication that the beep, by making them aware of the state, seems in some sense to make it conscious, which is the moment the view starts to feel both powerful and slightly absurd. Second: paired observers who log fidgets, scratching and signs of discomfort that the subject later denies having noticed, plus at least one case where the subject demonstrates having discriminated something they insist they never experienced. Third, and most important for this audience: I hand them a made-up but realistic abstract of a brain-imaging study in which a region associated with monitoring and metacognitive judgment is active exactly when subjects report awareness of a stimulus, they draft headlines for it in small groups, and then they discover for themselves that the design cannot distinguish the higher-order state's being constitutive of conscious experience from its merely being what makes a report possible — which is the confound that makes nearly every empirical result in this area ambiguous, and the reason I said what I said at the dinner.

  What I need from you is the full session design: the rules and materials for each phase, a minute-by-minute timeline for ninety minutes including setup and any handouts, concrete tasks hard enough to produce genuine absorption and mild failure, and the wording you would actually use for instructions, given that participants must not hear the theory's name, the phrase higher-order, or any lecture before the debrief. Then the debrief: map each moment participants will have lived through onto the specific claim it is evidence for or against; say which of the standard objections the activity can make vivid and which it cannot touch at all — I assume the regress worry, the question of what makes the higher-order state itself conscious, and the retreat to a thin or merely dispositional second-order state are things I will simply have to assert — and be candid about where the analogy between the activity and the real cases breaks down. Finally, tell me what will predictably go wrong: participants who treat I didn't notice it as it wasn't conscious and conclude the view is trivially true; participants who conclude it is trivially false because they cannot accept that their absorbed aches and itches were not conscious; the two people with cognitive-science training who name the view in the first ten minutes and deflate everything; and the real risk that fourteen journalists leave able to write only the piece saying that consciousness is just self-monitoring, or that neuroscience has settled a question it has not. For each failure, how I steer it without turning the last twenty minutes into a lecture.
reasoning: |-
  We are designing a 90-minute session for early-career science communicators to experience and confront a central dispute in consciousness studies: whether consciousness requires a higher-order state (awareness of the mental state). We must avoid lecturing and using technical terms until the debrief. The session has three phases: (1) experience sampling with beeps during a demanding task, (2) paired observation of unnoticed behaviors, and (3) interpreting a made-up brain-imaging abstract and drafting headlines.

  Goals:
  - Let participants feel the pull of the higher-order view: that a state becomes conscious only when we are aware of it (as when the beep prompts awareness).
  - Also feel the counter: that we have conscious experiences without awareness (e.g., absorbed states, unnoticed itches).
  - In the brain-imaging phase, discover the confound between the state being constitutive of consciousness vs. enabling reporting.

  Constraints:
  - No use of terms: "higher-order", theory names, etc., before debrief.
  - Participants will write about the session afterward, so the experience must be authentic.

  Phase Breakdown (90 minutes total):

  1. Introduction (5 minutes): Set the stage without theory.
  2. Phase 1: Experience Sampling (25 minutes)
     - Setup and instructions (5 min)
     - Task and beeps (15 min)
     - Quick reflection (5 min)
  3. Phase 2: Paired Observation (20 minutes)
     - Setup and instructions (5 min)
     - Observation task (10 min)
     - Comparison and reflection (5 min)
  4. Phase 3: Brain-Imaging Abstract and Headlines (25 minutes)
     - Handout and group work (15 min)
     - Group sharing and revealing the confound (10 min)
  5. Debrief (15 minutes): Connect experiences to the dispute, name the theory, and clarify confounds.

  Now, we design each phase.

  ---

  **Phase 1: Experience Sampling (25 min total)**

  Goal: Participants experience the gap between the state they were in and the report they make. The beep interrupts and makes them aware of their state, which might feel like it "makes" the state conscious.

  Task: A continuous, absorbing task that is just hard enough to cause mild failure and absorption. We want them to be so absorbed that they are not constantly self-monitoring.

  Task Choice: 
  - **Visual Search Task**: A sheet with a grid of letters. They must find and circle all instances of the letter 'S' that are surrounded by at least three '5's (or similar). The sheet has many distractors (e.g., '5's, '8's, 'S's without enough '5's). This is visually demanding and requires sustained attention.

  Materials: 
  - Pre-printed grids (one per participant) 
  - Pens
  - Phone timer for beeps (use a beep sound at random intervals)

  Procedure:
  1. (5 min) Introduction to the task: "We're going to start with a simple activity. Each of you will get a grid of letters. Your task is to find and circle every 'S' that is surrounded by at least three '5's. The '5's must be in the eight surrounding cells (up, down, left, right, and diagonals). You will have 15 minutes, but I will sound a beep at random intervals. When you hear the beep, freeze immediately and write down on the index card everything that was present in your experience at the exact moment of the beep. Don't think too much; just jot down the first things that come to mind. Then go back to the task. There will be several beeps. Use one index card per beep, and note the time of the beep (I'll say 'beep 1', 'beep 2', etc.)."

  2. (15 min) Run the task. Sound 4-5 beeps at random intervals (e.g., at 2, 5, 8, 11, 14 minutes). At each beep, say "Beep 1", etc., so they can label the card.

  3. (5 min) Quick reflection: "Look through your cards. For each beep, note whether what you wrote down feels like a complete account of what was going on in your mind at that instant. Also, note how the beep itself might have changed your experience. We won't share now, but keep this in mind."

  ---

  **Phase 2: Paired Observation (20 min total)**

  Goal: Participants observe their partner for subtle behaviors (fidgets, scratches, adjustments) that the subject later denies noticing. Also, include a discrimination task where the subject demonstrates knowledge of something they claim not to have experienced.

  Structure: 
  - Split into pairs: A and B.
  - Part 1: Observation of behaviors while doing a task.
  - Part 2: Discrimination task (without the partner knowing it's a test).

  Materials: 
  - Index cards for logging
  - Pens
  - A simple puzzle task for the subject (to keep them absorbed) 
  - For the discrimination task: a series of words or images presented very briefly (subliminally) during the puzzle task, followed by a forced-choice test.

  Detailed Procedure:

  1. (5 min) Setup and instructions:
     - "Now, we'll work in pairs. One person (A) will do a puzzle task. The other (B) will observe A carefully. Observer B: your job is to note every time A does any of these: fidgets (shifts in seat, plays with hair), scratches an itch, adjusts clothing, or shows any sign of discomfort (like a grimace). Write each instance on an index card with the time (use your phone timer). Do not interact with A. The puzzle task will last 10 minutes."
     - "Puzzle task for A: You will be given a sheet with a series of anagrams (scrambled words). Unscramble as many as you can in 10 minutes. The words are moderately difficult (e.g., 6-8 letters)."
     - Additionally, during the puzzle task, the observer B will also be responsible for presenting the discrimination task without A knowing. We need a way to present stimuli that A is not aware of. Since we can't use a computer (unreliable wifi), we can do this with a deck of cards.

     Discrimination Task Design:
     - Prepare a set of 10 cards. Each card has a word printed in very faint gray (almost invisible) at the top, and a normal black question at the bottom (which is part of the anagram task). The words are common but not related to the anagrams (e.g., "apple", "river", etc.). The observer is instructed to show each card for a very brief moment (half a second) while A is working on an anagram. Then the observer flips to the next card. After the 10 minutes, the observer asks A: "Did you see any words in faint gray during the task?" (A will say no). Then the observer gives a forced-choice test: "For each of these words I'm about to say, tell me if it feels familiar or not." The observer reads 10 words: 5 that were shown and 5 new ones. A rates each as familiar or not. We expect above-chance recognition without awareness.

     But note: without a tachistoscope, brief exposure might be hard. Alternative: use a different sensory modality? Auditory? But that might interfere. Instead, we can use a visual task with a distraction.

     Revised Discrimination Task (visual, with distraction):
     - The anagram sheet has a small box in the corner of each anagram. The observer has a set of 10 cards with a simple shape (e.g., star, circle, square) drawn in very light gray (almost invisible) and a number (1 to 10) in bold. The observer says, "I'm going to check your progress. What number are you on?" and quickly flashes the card (so the subject sees the bold number, but the shape is barely visible). They do this 10 times during the task. Afterward, the observer asks: "Did you see any shapes on the cards I showed you?" (expecting "no"). Then forced-choice: show a sheet with 10 shapes (5 old, 5 new) and ask to rate familiarity for each on a scale (or just say if they think it was shown or not).

     However, this might be too obvious. We want it to be truly unnoticed.

     Simpler: use a tactile discrimination. While the subject is writing, the observer lightly touches the subject's arm with one of two textures (rough or smooth) for a split second, then immediately distracts by pointing to the anagram sheet and asking a question. After the task, ask: "Did you notice any touches on your arm?" (expecting "no"). Then forced-choice: "I'm going to touch you with two textures; which one feels familiar?" (But this might be uncomfortable and requires physical contact, which may be inappropriate.)

     Given constraints, let's stick with the visual discrimination with the number check. We accept that it's not perfectly subliminal but hope that the bold number distracts from the faint shape.

     Instructions for the observer (B) for the discrimination part: 
     - "During the puzzle, at 5 random moments (spread out), interrupt A briefly by holding up a card and asking, 'What number are you on?' The card will have a bold number (which A can see) and a faint shape (which they probably won't notice). Note which card you show (each has a unique number and shape). After the puzzle, first ask A: 'During the task, did you see any faint shapes on the cards I showed?' Then, show A a sheet with 10 shapes (the 5 you showed and 5 new) and ask them to rate each from 1 (definitely not shown) to 5 (definitely shown)."

  2. (10 min) Run the task: A works on anagrams. B logs behaviors and does the 5 interruptions for the discrimination task.

  3. (5 min) Comparison: 
     - Observer B reports the list of behaviors they logged. A says which ones they were aware of and which they weren't.
     - Then, B asks about the shapes and does the forced-choice test. They note whether A's forced-choice responses are above chance (e.g., 3 or more of the 5 old shapes rated 4 or 5).

  ---

  **Phase 3: Brain-Imaging Abstract and Headlines (25 min total)**

  Goal: Participants discover the confound in a typical study that claims to find the neural correlate of consciousness. The study finds activity in a monitoring region when subjects report awareness, but it cannot distinguish whether that region is responsible for the conscious experience or just for reporting.

  Fabricated Abstract:

  > **Title:** Neural Correlates of Visual Awareness: The Role of Prefrontal Monitoring Regions
  >
  > **Abstract:** How does the brain generate conscious visual experience? We used fMRI to measure brain activity while participants viewed briefly presented images that were either clearly visible, barely visible, or rendered invisible by backward masking. Participants reported whether they were aware of each image. We found that activity in the dorsolateral prefrontal cortex (DLPFC), a region associated with metacognitive monitoring and higher-order cognition, was significantly higher on trials where participants reported awareness compared to when they did not. Moreover, DLPFC activity predicted awareness reports with high accuracy. These results suggest that conscious visual experience depends on the engagement of prefrontal monitoring processes.

  Materials: Handout with the abstract.

  Procedure:

  1. (15 min) Group work: Split into groups of 3-4. "Read this abstract. Then, as a group, draft 2-3 headlines for a news article about this study. You have 10 minutes. Then, we'll share the headlines."

  2. (10 min) Sharing and revealing the confound:
     - Groups read their headlines (write them on index cards and stick on the wall, or just say them).
     - Then, the facilitator points out: "Notice that the study found activity in a monitoring region when participants reported awareness. But what if that region is not producing the conscious experience itself, but only enabling the report? How could we design a study to tell the difference? Brainstorm in your groups for 2 minutes."
     - Then, briefly get one idea from each group. The facilitator then explains: "This is a fundamental challenge. Without a way to measure consciousness independently of report, we can't know if the brain activity is linked to the experience or to the report. That's why this study, and many like it, cannot settle the question of what consciousness is."

  ---

  **Debrief (15 min):**

  Now we can use the technical terms and explain the dispute.

  1. (5 min) Recap the experiences:
     - Phase 1: "In the beep task, when the beep sounded, you became aware of your mental state and reported it. But what about just before the beep? Was that state conscious? The beep made you aware of it, and then you could report. This illustrates the higher-order thought (HOT) theory: that a state is conscious only when you have a thought about it. But then, what about the state before the beep? Was it unconscious? That might feel strange because you were absorbed in the task and having an experience."
     - Phase 2: "In the paired task, you (the subject) had behaviors that you didn't notice. Were those itches and fidgets conscious? You didn't notice them, so HOT theory says they weren't. But that might feel wrong because they were part of your experience. Also, in the discrimination task, you showed knowledge of the shapes without being aware of seeing them. That suggests unconscious perception. But if HOT theory is right, then that perception wasn't conscious because you weren't aware of it. That might seem plausible, but then what about the absorbed state in the anagram task? Were you conscious of the anagrams? You weren't thinking about your own state, but it felt like something to be doing the task."
     - Phase 3: "The brain study found that a monitoring region (DLPFC) was active when people reported awareness. But we cannot tell if that region is the source of consciousness or just the ability to report. This is a confound that plagues the field."

  2. (5 min) Name the theory and the dispute:
     - "This dispute is about whether consciousness requires a higher-order state (a state about another state). The view we've been wrestling with is called Higher-Order Thought (HOT) theory. The alternative is that some states are first-order and conscious without any higher-order state."
     - Objections we made vivid: 
       - The over-intellectualization: Requires self-monitoring that might not be present in infants, animals, or absorbed adults.
       - The confound in brain imaging: Monitoring regions might be for reporting, not for consciousness.
     - Objections we couldn't touch (must be asserted):
       - The regress worry: If a higher-order state is required to make a first-order state conscious, what makes the higher-order state conscious? (Leads to infinite regress unless we stop at an unconscious higher-order state.)
       - The problem of what makes the higher-order state conscious: If it's another higher-order state, then regress; if it's intrinsic, then why not say the first-order state is intrinsic?
       - The retreat to a thin (dispositional) higher-order state: Some versions say the higher-order state doesn't have to be occurrent, but then it's not clear how it helps.

  3. (5 min) Breakdown of analogies and caveats:
     - In the beep task, the gap between the state and the report might not be the same as in real unconscious states. We don't know if the state before the beep was conscious or not.
     - In the paired task, the unnoticed behaviors might be conscious but not remembered, or they might be truly unconscious. The discrimination task shows unconscious processing, but that's not controversial. The key question is whether the conscious experience of the anagram task required self-monitoring.

     - Emphasize: "The goal was to show you the ambiguity in the evidence. When you write, avoid saying that consciousness 'is' self-monitoring. Instead, highlight the dispute and the confound."

  ---

  **Predictable Problems and Steering:**

  1. **Problem**: Participants say: "I didn't notice it, so it wasn't conscious" -> conclude HOT is trivially true.
     - **Steering**: In the debrief, ask: "But when you were absorbed in the grid task, were you conscious of the letters? Were you thinking about your own mental state? Probably not. But it felt like something to be doing the task. So, if HOT is true, then that experience wasn't conscious? That feels counterintuitive." Also, point to Phase 2: "You had itches you didn't notice, but were they part of your conscious field? Or were they unconscious? HOT says they were unconscious, but maybe that's not how we usually think of consciousness."

  2. **Problem**: Participants say: "My aches and itches were conscious, I just didn't attend to them" -> conclude HOT is trivially false.
     - **Steering**: In the debrief, note: "HOT theory might agree that you were conscious of the itch, but only if you had a higher-order state about it. If you didn't, then even if it was in your field, it wasn't conscious. But that requires a specific definition of consciousness. The dispute is about what counts as conscious. HOT theory defines it in terms of awareness of the state, not the presence of the state."

  3. **Problem**: The two cognitive science trainees name the theory early.
     - **Steering**: "I see some of you might have heard of this. For the sake of the exercise, let's try to put aside what you know and focus on the experience. We'll discuss the theory at the end." If they persist, remind them: "Part of the goal is for everyone to have the 'aha' moment, so please hold off on the terminology until the debrief."

  4. **Problem**: Participants leave thinking consciousness is just self-monitoring, or that neuroscience has settled it.
     - **Steering**: In the debrief, emphasize the ambiguity: "The brain imaging study cannot distinguish between the two interpretations. This is why the dispute is unresolved. When you write, you can say: 'One theory suggests that consciousness requires self-monitoring, but the evidence is ambiguous because the same brain regions might be involved in reporting.'"

  ---

  **Timeline (Total 90 min):**

  - 0:00 - 0:05: Introduction
  - 0:05 - 0:30: Phase 1 (Experience Sampling)
  - 0:30 - 0:50: Phase 2 (Paired Observation)
  - 0:50 - 1:15: Phase 3 (Brain Abstract & Headlines)
  - 1:15 - 1:30: Debrief

  Note: Times are approximate. Be flexible.

  ---

  **Materials Checklist:**

  - For Phase 1: Grid sheets (one per participant), pens, index cards, phone for beeps.
  - For Phase 2: Anagram sheets (one per pair, for the subject), index cards for logging, pens, 5 cards for the discrimination task (with bold numbers and faint shapes), a sheet of 10 shapes for the forced-choice test (5 old, 5 new).
  - For Phase 3: Handout with the fabricated abstract (one per group), index cards for headline drafting.
  - General: Projector for debrief (optional, but can be used to show the abstract and headlines).

  ---

  **Instructions Wordings (Key Parts):**

  **Phase 1:**
  - "In this first activity, you'll be doing a visual search task. Here's a grid of letters. Your goal is to find and circle every 'S' that is surrounded by at least three '5's. The '5's must be adjacent in any of the eight directions. You'll have 15 minutes. At random times, I'll sound a beep. When you hear the beep, freeze immediately and write down on an index card everything that was in your experience at that exact moment. I'll say 'Beep 1', 'Beep 2', etc. Write quickly and honestly. Then return to the task. Any questions? ... Begin."

  **Phase 2:**
  - "Now, pair up. One of you will be the subject (A), the other the observer (B). Subject A: you'll work on an anagram puzzle for 10 minutes. Observer B: you have two jobs. First, watch A carefully and note every time A fidgets, scratches, adjusts clothing, or shows discomfort. Write each instance on an index card with the time. Second, at five random times during the task, hold up a card and ask A: 'What number are you on?' (referring to the anagram number). The card has a bold number (so A can tell you) and a faint shape that you can barely see. Don't point out the shape. After the task, ask A: 'During the task, did you see any faint shapes on the cards?' Then, show A this sheet of 10 shapes and ask them to rate each from 1 (definitely not shown) to 5 (definitely shown)."

  **Phase 3:**
  - "In your groups, read this abstract. Then, draft 2-3 headlines for a news article about this study. You have 10 minutes. Then we'll share."

  **Debrief:**
  - "In the first activity, when the beep sounded, you became aware of your mental state. But what about the state just before? Was it conscious? Or did the beep make it conscious? ... This is the heart of a theory called Higher-Order Thought theory, which says that a mental state is conscious only if you are aware of it via a higher-order state. But then, in the second activity, you had experiences (like the anagrams) that you were absorbed in without self-monitoring, and physical sensations you didn't notice. Were they conscious? The theory says no, but that might feel wrong. Also, the brain study we looked at cannot tell if the prefrontal activity is causing consciousness or just the report. This is why the dispute is unresolved."

  ---

  This design should create the experiential learning you want while avoiding premature exposure to the theory. The debrief ties it all together and preempts common misunderstandings.
answer: |-
  ### Session Design: "The Unseen Dispute"  
  **Goal:** Immerse participants in the unresolved dispute about consciousness without naming theories, then reveal the confound in empirical research. Focus on experiential learning to fuel honest writing.  

  ---

  ### **Phase 0: Setup & Introduction (5 min)**  
  **Materials:** Index cards, pens, grid sheets (Phase 1), anagram sheets (Phase 2), abstract handouts (Phase 3), projector.  
  **Instructions (Wording):**  
  > *"Welcome! Today is about exploring how we interpret subjective experiences and scientific claims. We’ll do three short activities. Your job is to dive in, observe honestly, and jot down thoughts on index cards. No prior knowledge needed—just curiosity. Rule: Avoid jargon or theory names. We’ll debrief at the end."*  

  ---

  ### **Phase 1: Beeped Experience Sampling (25 min)**  
  **Goal:** Highlight the gap between a mental state and awareness of it. The beep "makes" the state reportable, hinting it might "make" it conscious.  
  **Task:** **Visual Grid Search** (demanding, immersive).  
  - **Materials:** Grid sheets (30x30 grid of random letters/numbers; target: circle every "S" adjacent to ≥3 "5"s). Pens, index cards. Phone timer for beeps.  
  **Instructions:**  
  > *"Work solo. Circle all target ‘S’es. At random beeps (4-5 over 10 min), freeze and write what was in your experience the instant before the beep. Example: ‘Seeing the grid, feeling my hand cramp, hearing background noise.’ Not what you were thinking *about*, but what was *present*. Then resume. Don’t overthink—capture raw impressions."*  

  **Procedure:**  
  - 0-2 min: Distribute grids, explain task.  
  - 2-12 min: Task + beeps (e.g., 3:00, 6:30, 8:00, 10:30). Say "Beep 1," etc., to timestamp cards.  
  - 12-15 min: **Reflection Qs on index cards:**  
    *"Compare your beep notes to the task. Did the beep change what you experienced? Could you capture everything? What slipped away?"*  

  **Why it works:**  
  - Grid complexity causes absorption (prevents self-monitoring).  
  - **Strange implication:** Beep forces awareness → state becomes reportable (feels like it "becomes conscious").  

  ---

  ### **Phase 2: Paired Observation & Unnoticed Signals (20 min)**  
  **Goal:** Contrast subjective denial of awareness with objective evidence of experience (fidgets) and discrimination without awareness.  
  **Task:** **Anagram Solving + Covert Discrimination**.  
  - **Materials:** Anagram sheets (moderate difficulty, e.g., "TERBAL" = "BARTEL"), index cards. 10 "number cards" (bold number + faint shape).  

  **Instructions:**  
  > *"Pair up: Subject (Solver) and Observer.  
  > - **Solver:** Unscramble anagrams in 7 min. Ignore your partner.  
  > - **Observer:** (1) Log all Solver’s fidgets/scratches on index cards. (2) At 5 random times, flash a ‘number card’ for 1 second—ask ‘What number?’ Solver answers. *Cards have a faint shape (e.g., △, ◯) barely visible.*  
  > Afterward:  
  > 1. Observer reports logged behaviors. Solver says which they noticed.  
  > 2. Observer asks: ‘Did you see faint shapes?’ Solver answers.  
  > 3. **Covert test:** Observer shows a sheet with 10 shapes (5 shown, 5 new). Solver rates each: ‘Sure not seen’ (1) to ‘Sure seen’ (5)."*  

  **Procedure:**  
  - 15-17 min: Explain, pair up, distribute materials.  
  - 17-24 min: Task.  
  - 24-25 min: Compare logs + run covert test.  

  **Why it works:**  
  - Solvers deny noticing shapes/fidgets but show above-chance recognition (exposing unconscious processing).  
  - **Key tension:** "I didn’t notice" ≠ "It wasn’t conscious," but HOT implies it should.  

  ---

  ### **Phase 3: Brain-Imaging Abstract & Headline Drafting (25 min)**  
  **Goal:** Reveal the report/consciousness confound through self-discovery.  
  **Materials:** Handout with fabricated abstract (projected + printed).  

  **Abstract Text:**  
  > *"Neural Correlates of Visual Awareness: Prefrontal Monitoring as the Key to Consciousness*  
  > *fMRI study: Participants viewed masked images (visible/invisible). When reporting awareness, dorsolateral prefrontal cortex (DLPFC)—linked to metacognition—activated. No DLPFC activity during unaware trials. DLPFC activity predicted awareness reports (95% accuracy). Suggests conscious perception requires prefrontal self-monitoring."*  

  **Instructions:**  
  > *"In groups of 3, read this abstract. Draft 2 headlines for a news piece. Focus on the ‘big takeaway.’ You have 8 min. Then, we’ll share."*  

  **Procedure:**  
  - 25-27 min: Distribute abstracts, split groups.  
  - 27-35 min: Group drafting.  
  - 35-40 min: Groups share headlines (write on index cards; project examples).  
  - 40-45 min: **Reveal the confound:**  
  > *"Look at your headlines. Most say ‘Study shows consciousness IS self-monitoring.’ But here’s the catch: The design only shows DLPFC links to **reporting** awareness. How do we know if DLPFC causes the *experience* or just the *report*? Brainstorm an alternative study design in 2 min."*  
  > - Groups share ideas (e.g., "Measure awareness without reports").  
  > - **Punchline:** *"This ambiguity is everywhere. Without a ‘report-free’ measure, we can’t distinguish consciousness from the ability to say we have it."*  

  ---

  ### **Debrief (15 min): Connecting Experiences to the Dispute**  
  **Goals:** Name the theory, map activities to arguments, clarify confounds/limitations.  
  **Script (Wording):**  

  > *"Today’s activities mirror a core dispute in consciousness research.  
  >   
  > **1. The Theory You Felt:**  
  > - **Phase 1 (Beeps):** When the beep hit, you became aware of your state—suddenly it was ‘reportable.’ Some argue this is key: **a mental state is conscious only if you’re aware *of* it** (e.g., via a higher-order thought). Otherwise, it’s ‘in the dark’ (like pre-beep absorption).  
  > - **Phase 2 (Pairs):** You had itches/fidgets you denied noticing, yet discriminated shapes unconsciously. This theory says those states *weren’t conscious*—but is that intuitive? It implies consciousness requires self-monitoring infants or animals might lack.  
  > - **Phase 3 (Abstract):** Brain studies often confuse *consciousness itself* with *reporting it*. The DLPFC might enable reports, not experience.  
  >   
  > **2. What We Made Vivid:**  
  > - The **pull**: Without awareness-of-state, experiences feel ‘incomplete’ (beep activity).  
  > - The **problem**: Over-intellectualization (absorbed solvers, unnoticed itches feel conscious).  
  > - The **confound**: Neuroscience can’t disentangle consciousness from report (abstract activity).  
  >   
  > **3. What We *Couldn’t* Touch (Limitations):**  
  > - **Regress worry:** If a higher-order state makes a state conscious, what makes *it* conscious? (Requires asserting this is unresolved.)  
  > - **Thin/dispositional states:** Some argue higher-order states needn’t be explicit thoughts. (Today’s activities used explicit awareness.)  
  > - **Analogy gaps:**  
  >   - Beep task: The "pre-beep state" might still be conscious (unlike true unconscious states).  
  >   - Paired task: Unnoticed itches might be "conscious but unattended," not unconscious.  
  >   
  > **4. Writing Takeaways:**  
  > - **Avoid:** "Consciousness = self-monitoring" or "Neuroscience solved it."  
  > - **Do say:** "A major dispute centers on whether consciousness requires self-awareness. Current brain studies struggle to separate experience from reporting—leaving the question open."*  

  ---

  ### **Predictable Problems & Steering Tactics**  
  **Problem 1:** Participants conflate *"I didn’t notice"* with *"It wasn’t conscious."*  
  - **Steering:** In debrief, use Phase 2: *"When you solved anagrams, were you conscious of the letters? Probably—but you weren’t actively monitoring that state. Does that mean it *wasn’t* conscious? The theory says yes, but your gut may say no. That’s the dispute."*  

  **Problem 2:** Participants reject HOT because "absorbed states *must* be conscious."  
  - **Steering:** Contrast Phase 1 and 2: *"In the grid task, pre-beep states felt real—but were they? In the anagram task, you had sensations you denied. The theory forces us to ask: What *is* the difference?"*  

  **Problem 3:** Cognitive science trainees name "higher-order theory" early.  
  - **Steering:** Preempt: *"If you’ve heard terms like HOT, hold them lightly. Today is about experiencing the puzzle, not labeling it."* If they slip, redirect: *"Let’s table the jargon—describe what you *felt* instead."*  

  **Problem 4:** Participants leave oversimplifying ("Consciousness is just self-monitoring").  
  - **Steering:** In debrief, stress ambiguity: *"Phase 3 showed why neuroscience *hasn’t* settled this. When you write, highlight the confound—it’s the key insight."*  

  **Problem 5:** Group headlines miss the confound.  
  - **Steering:** After sharing, ask: *"What if DLPFC is just the ‘report button’? How would we test that?"* Guide them to design flaws (e.g., no no-report paradigm).  

  ---

  ### **Timeline (90 min)**  
  - **0:00–0:05:** Intro  
  - **0:05–0:30:** Phase 1 (Beeped grids)  
  - **0:30–0:50:** Phase 2 (Paired observation)  
  - **0:50–1:15:** Phase 3 (Abstract + headlines)  
  - **1:15–1:30:** Debrief  

  ---

  ### **Why This Works**  
  - **Experiential tension:** Activities force participants into both sides of the dispute (e.g., Phase 1: HOT feels compelling; Phase 2: it feels absurd).  
  - **No lecturing:** Discovery happens through tasks. Debrief links experiences to theory *after* immersion.  
  - **Safe for writing:** Raw material from index cards provides concrete details for articles.  
  - **Manages biases:** The confound reveal (Phase 3) preempts overclaiming in their pieces.  

  **Final Prep Tip:** Pre-test the grid/anagram difficulty to ensure absorption. For the faint shapes, print on low-opacity settings. Use the projector to share headlines during debrief.
