       - Magnitude of harm (e.g., death > leg loss).  
       - Probability of harm being averted (e.g., 100% > 60%).  
       A group has a stronger claim only if it contains an individual with a stronger claim than any individual in the other group. If all individuals have equal claim strength, the groups have equal claims, and saving either is permissible. A coin toss is a fair tie-breaker but not required.  
     - **Fit with verdicts**:  
       - Verdict 1: All face death (equal harm), 100% certainty → equal claims → coin toss.  
       - Verdict 2: One faces death; five face lesser harm (leg loss) → stronger claim for the one → save the one, no coin toss.  
       - Verdict 3: Son vs. strangers — partiality justified, but for strangers: all face death → equal claims → coin toss acceptable (as she wouldn't condemn it).  
       - Verdict 4: One has 100% certainty; each of the five has 60% certainty → stronger claim for the one → save the one.  
     - **Prediction for ten-thousand case**: Equal individual claims (death, 100% certainty) → equal group claims → coin toss (or permissibility to save either without it).

  2. **Rule B: Individual Claims with Large-Number Threshold (Aggregation at Scale)**  
     - **Description**: Same as Rule A for individual claim strength, but adds: If the harm is death and the number in one group exceeds an undefined threshold (must be >5 based on Verdict 1), aggregate the harms and save the larger group. Below the threshold, follow Rule A. The threshold is context-dependent and not specified.  
     - **Fit with verdicts**:  
       - Verdict 1: 5 is below threshold → no aggregation → equal claims → coin toss.  
       - Verdict 2: Harm is not death for the five → no aggregation (even if number is large) → save the one.  
       - Verdict 3: Special relationship overrides, but for strangers: 5 below threshold → equal claims → coin toss acceptable.  
       - Verdict 4: Uncertainty reduces claim strength; also, 5 may be below threshold → no aggregation → save the one.  
     - **Prediction for ten-thousand case**: If 10,000 is above the threshold, save the ten thousand. If the threshold is undefined or >10,000, follow Rule A (coin toss). Since the threshold is unknown, this rule is ambiguous but fits the verdicts because 5 is below it.

  **Why these rules are equally good fits**: Both rules:
  - Explain why numbers don't count in Verdicts 1, 3, and 4 (Rule A always; Rule B below threshold).
  - Explain the focus on individual harm in Verdict 2 (leg loss not additive).
  - Accommodate Verdict 4's emphasis on certainty over gambling without invoking numbers.
  - Allow for her suspicion of a breaking point (Rule B explicitly includes this; Rule A doesn't but is compatible with her discomfort as a psychological limit, not a moral one).

  ### Role of the Coin Toss
  The coin toss serves as a **fair tie-breaker she happens to like, not a moral requirement**. This is clear from:
  - **Verdict 1**: She says either rescue is permissible, but she *would* toss a coin for equal chances. This shows the coin toss is her preferred method for fairness when claims are equal, but it is not obligatory (she allows saving either group without it).
  - **Verdict 3**: She wouldn't condemn a stranger for using a coin toss but implies that saving the five without one might also be acceptable (since she says she wouldn't condemn the coin toss, not that it's required).
  - **Underlying function**: The coin toss ensures procedural fairness by giving each *group* an equal chance (50%), which in turn gives each *individual* an equal chance (50%) of being saved. However, it does not reflect a requirement because she permits arbitrary choices in equal-claim cases.

  ### Her Real Principle
  Her principle is **not about the numbers** (aggregate harm) but about **the magnitude of harm and probability for each individual**. Key evidence:
  - **Verdict 2**: She explicitly states losses (legs) do not add up to a death, rejecting aggregation. The decision hinges on comparing individual harms (death vs. leg loss).
  - **Verdict 4**: She rejects aggregating expected utility (e.g., 60% × 5 = 3 expected lives saved) because "numbers don't count," focusing instead on individual certainty.
  - **Verdict 1 and 3**: For strangers, equal individual harms (death) lead to equal group claims, regardless of group size.
  - **Consistency**: All verdicts are explained by comparing individual stakes—harm severity and rescue probability—without summing or averaging across people. The coin toss is a separate fairness mechanism for ties.

  ### Recommended Follow-Up Case
  To separate Rule A (no aggregation) from Rule B (aggregation above threshold), use a case with a **moderately large number of deaths (e.g., 1 vs. 100)**, identical to the ten-thousand case in all other respects (strangers, certain rescues, drowning, no other factors).

  - **Why this case?**  
    - It tests if she has a practical threshold for aggregation. Verdict 1 shows 5 is not enough, but 100 is large enough to potentially trigger her "suspicion" of a breaking point while being more manageable than 10,000.
    - **Prediction under Rule A**: Equal individual claims → coin toss (or permissibility to save either).  
    - **Prediction under Rule B**: If 100 is above her threshold, she saves the 100. If not, she defaults to Rule A (coin toss). Her response would reveal if a threshold exists and whether it is ≤100.
  - **Why not other cases?**  
    - A case with unequal probabilities (e.g., 1 certain vs. 100 with 99% chance) would conflate with Verdict 4's probability focus.  
    - A case with partiality (e.g., saving a friend) would conflate with Verdict 3's relationship factor.  
    - A case with non-lethal harms (e.g., 1 death vs. 100 leg losses) is resolved by Verdict 2 (no aggregation), so it doesn't test the death-case threshold.  

  This case directly targets the ambiguity in the rules and her unstated threshold, providing clarity for future predictions.
