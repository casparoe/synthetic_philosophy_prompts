  Based on your friend's verdicts in the four cases, I will predict her response to the new case (one stranger vs. ten thousand strangers, both rescues certain, no other factors), explain why, outline the rules that fit her verdicts, discuss the role of the coin toss, identify her underlying principle, and recommend a follow-up case to distinguish between the rules.

  ### Prediction for the Ten-Thousand Case
  Your friend will say that **neither group has a stronger claim, it is permissible to save either, and she would toss a coin to give each group an equal chance (50% for each group)**. This means:
  - She would not insist on saving the ten thousand.
  - She would consider it morally acceptable to save the one or the ten thousand without a coin toss, but her personal preference is to use a coin toss for fairness.
  - The coin toss would assign a 50% chance to saving the one-person group and a 50% chance to saving the ten-thousand-person group, giving each individual a 50% chance of being saved (since all individuals in a group are saved if that group is chosen).

  **Why?**  
  Her verdicts consistently reject the idea that numbers alone create a stronger moral claim. Specifically:
  - **Verdict 1 (1 vs. 5, drowning)**: She denies that the five have a stronger claim than the one, requiring a coin toss for fairness. This establishes that small numbers don't count, and equal claims (same harm, same certainty) lead to permissibility of either choice and a coin toss preference.
  - **Verdict 2 (1 drowning vs. 5 losing legs)**: She prioritizes the individual facing greater harm (death vs. leg loss), showing that claims are based on individual stakes, not aggregation of lesser harms. This reinforces that harms are not additive—even for five people.
  - **Verdict 3 (1 son vs. 5 strangers)**: She allows partiality for her son but affirms that, for strangers, claims are equal (as in Verdict 1). This confirms that stranger cases are governed by the same "no numbers" logic unless special relationships intervene.
  - **Verdict 4 (1 certain vs. 5 with 60% chance)**: She prioritizes certainty over a gamble, but crucially, she justifies this by saying it's because "the numbers don't count." This means the decision is based on comparing individual claim strength (certainty for one vs. uncertainty for each of the five), not on the expected utility of saving more lives.

  In the ten-thousand case, all factors are identical to Verdict 1: strangers, drowning, certain rescues, no other differences. The individual claim strength is equal for every person (death averted with 100% certainty if their group is chosen). Her core principle—that numbers don't count—means the ten-thousand group has no stronger claim than the one, just as the five didn't in Verdict 1. She might privately feel uncomfortable due to the scale (as she hinted at a breaking point), but her explicit verdicts and reasoning imply she would extend the coin-toss approach. Her refusal to name a ratio suggests she hasn't operationalized a threshold, so the default is the pattern from her decisions: no aggregation.

  ### Rules Fitting Verdicts 1–4
  Two rules equally explain all four verdicts. Both treat individual harm and probability as foundational, reject aggregating harms, and handle ties with a coin toss. They diverge only on whether a "large number" threshold exists for aggregation in death cases.

  1. **Rule A: Individual Claims Only (No Aggregation Ever)**  
