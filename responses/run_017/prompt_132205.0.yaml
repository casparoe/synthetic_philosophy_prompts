prompt: |-
  Hey — I've somehow ended up running the "how we actually pick causes" session at my giving group's weekend meetup for the second year in a row, and I want to do better than last time. Context: about 25 people, mostly engineers and data scientists from the same company, we pool donations and also volunteer hours, 45 minutes with maybe 15 for argument at the end. Last year derailed in two specific ways — one guy spent twenty minutes on whether you're allowed to count flow-through effects (people earning more, paying more tax, etc.) and nobody could tell if we'd resolved it, and someone else made a spreadsheet where everybody scored causes 1–10 on importance, tractability and neglectedness and then multiplied the three numbers together as if the product meant something. I get why that's wrong but I couldn't articulate it fast enough in the room, and I definately don't want to just ban the spreadsheet.

  The things I personally keep tripping over, which I want the session to fix rather than paper over: I can never cleanly seperate "this problem is solvable at all" from "the next dollar or the next hour here does a lot", and I keep catching myself sliding between "how big is this problem" and "how much better is the best thing here than what we'd do instead" — I've started calling the second one the decision gap, which is my own made-up term, so tell me if that's a bad framing or if there's a cleaner way to hold the two apart. There's also a thing I noticed last year that nobody had a name for: a field can look neglected by total dollars while the particular slot we'd step into is actually contested, because everyone with our skillset would land in exactly the same role, and then our entry adds less than the headline numbers suggest. I don't know if that's a fourth factor, a correction to neglectedness, or just a reason to stop trusting the framework.

  So: don't explain importance/tractability/neglectedness to me, plan how I should explain it. What has to come before what, and why — what genuinely depends on what being in place first, given this audience will want to start multiplying immediately — and which one of those three ideas has to be introduced first to stop the multiplication instinct from doing damage. One concrete example to carry the whole session, with a verdict on the two I was considering (a municipal lead-pipe replacement program in a mid-size US city, versus building capacity for a state-level ballot measure campaign): say what a carrying example has to have and what it has to lack, and I'd rather it not be a disease or a vaccine, and not AI safety, because half the room works on ML and we will lose forty minutes. Then the misconceptions in the order you'd expect them from this crowd and exactly where in the sequence to head each off — including the ones I listed, plus whichever one I haven't thought of that you think is the real killer. One question at the end that tells me they got it rather than just got quiet, and one thing I should openly refuse to explain in 45 minutes and say out loud that I'm refusing.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're running a session for their giving group again and want to avoid last year's pitfalls. The group is mostly engineers and data scientists, so they're analytical but prone to oversimplifying with metrics. The main issues were getting bogged down in flow-through effects and the flawed spreadsheet scoring system.

  First, I need to address the core problem: separating key concepts like solvability vs. marginal impact, and problem size vs. decision gap. The user mentioned their term "decision gap," which is actually a good way to frame opportunity cost. I should validate that term but also link it to established EA concepts like counterfactual impact.

  The neglectedness confusion is another key point. Total dollars in a field might not reflect if the specific niche they'd fill is crowded. This might tie into the idea of comparative advantage or bottlenecks within a cause area. Need to explain this without adding a fourth factor, just as a nuance to neglectedness.

  For the session structure, sequencing is crucial. If the group jumps to multiplying scores too early, that leads to bad outcomes. Importance should come first because it's the most intuitive, but tractability needs careful handling to avoid conflating solvability with marginal effectiveness. Maybe introduce "marginal tractability" as a sub-concept.

  The example choices matter. Lead pipes vs. ballot initiatives—both have clear differences in neglectedness and tractability. Lead pipes might show high neglectedness but with bottlenecks in skilled labor, while ballot initiatives could have high competition but leverage their skills. This illustrates the nuances without triggering AI safety debates.

  Common misconceptions: Engineers might treat ITN as independent variables and multiply them, not realizing the weights aren't multiplicative. Also, flow-through effects could derail discussions. Preempt these by framing ITN as heuristics, not formulas, and setting boundaries on what's feasible in 45 minutes.

  The question at the end should test understanding beyond silence. Asking them to identify the weakest link in ITN for a new example forces application without computation. Refusing to dive into flow-through effects keeps the session focused.

  I should also consider unspoken needs. The user wants the session to be engaging and productive, avoiding past frustrations. They need frameworks that respect analytical minds but guide them away from false precision. Emphasizing that ITN is about prioritization, not calculation, is key. Also, providing clear takeaways so participants feel the session was actionable.
answer: |-
  Here’s a battle-tested plan for your 45-minute session, designed for your audience and pitfalls. It pre-empts multiplication, clarifies your "decision gap," handles neglectedness nuances, and uses a strong example.

  **Core Framing Upfront (5 mins):**
  *   **Start with the Goal:** "We have limited $$ and hours. Our aim isn't to find the *worst* problem or the *most solvable* tiny problem. It's to find where **our next unit of resources does the most good** – that's the 'impact opportunity.'"
  *   **Introduce Your "Decision Gap" (Embrace it!):** "This is often called '**Marginal Impact**' or '**Counterfactual Impact**' – how much *better* is the outcome *because we acted*, compared to what would happen anyway or what we'd do otherwise? Hold that thought; we'll come back to it. It's the *difference* we make."
  *   **Introduce ITN as Lenses, Not Math:** "Importance, Tractability, Neglectedness (ITN) are **heuristic lenses** to *spot* high-impact opportunities. They interact. Multiplying scores pretends they are independent, equally weighted, and linear – they usually aren't. Today, we use them to *ask better questions*, not calculate scores."

  **Sequenced Introduction with Guardrails (20 mins):**
  1.  **Neglectedness FIRST (The Antidote to Premature Multiplication):**
      *   **Define:** "How many resources ($$, skilled people) are *already* working seriously on this specific problem/solution *relative to the scale of the opportunity*?" Emphasize "specific problem/solution."
      *   **Why First?** It directly links to *marginal impact*. If something is swamped, our extra $$/hour might just displace others or fund less effective work. If it's truly starved, our contribution is more likely to add something genuinely new.
      *   **Nuance:** "**Beware the Headline vs. Slot Problem:** A *field* might look neglected overall, but the *specific role we'd fill* (e.g., data engineers optimizing volunteer matching) might be saturated. Ask: 'Is *our specific contribution* needed, or would someone else do it just as well if we didn't?' This is a **correction factor for neglectedness**, not a 4th pillar."
      *   **Carrying Example Intro (Lead Pipes):** "City X has 10,000 lead pipes. $10M is needed. Only $1M is committed. *Headline Neglectedness seems high.* BUT, the city only has 3 certified crews. *Our slot?* If we fund materials ($), the crews are bottlenecked – impact is delayed. If we fund training ($) or volunteer skilled labor (hours) to *become certified crews*, we address the bottleneck. Neglectedness of *crew capacity* might be the key gap."
      *   **Carrying Example Intro (Ballot Measure):** "State Y needs 500k signatures. $2M needed for staff/ads. $1.5M already raised by big NGOs. *Headline Neglectedness seems lower.* BUT, they lack data scientists to optimize signature gathering routes. *Our slot?* Our skilled volunteer hours (building routing models) might be highly neglected and high-leverage *for our specific contribution*."
      *   **Pre-Empt Misconception:** "Neglectedness isn't 'smallest problem.' It's about *relative under-resourcing* for the potential gain. A massive problem needing $1B with only $10M is neglected; a tiny problem needing $10k with only $1k might be too small to prioritize."

  2.  **Importance SECOND (Scale of the Prize):**
      *   **Define:** "How *bad* is the problem we're trying to solve? What's the scale of suffering averted, lives improved, or benefit created *if the problem were fully solved*?" (Note: *Not* the impact of *our* dollar/hour yet).
      *   **Clarify:** "This is the *potential upside*. It's necessary but *not sufficient*. A huge problem (high Importance) that's intractable or already flooded with resources might be a *low* impact opportunity *for us*."
      *   **Connect to Neglectedness:** "A huge problem (High I) that's also highly neglected (High N) signals a *potential* impact opportunity. But we need the third piece..."
      *   **Pre-Empt Misconception:** "Importance =/= 'easiest to measure impact.' Avoid scope insensitivity (caring less about bigger numbers)."

  3.  **Tractability THIRD (The Hardest - Split It!):**
      *   **Define CLEARLY:** "Two parts often get confused:
          *   **Solvability (Absolute):** Does *any* effective solution exist *in theory*? (e.g., Can we *ever* fix lead pipes? Yes. Can we make everyone happy? Maybe not).
          *   **Marginal Effectiveness (Our Leverage):** How much *additional* good does the *next* dollar or volunteer hour actually *achieve* in this specific context? This is where 'decision gap'/'marginal impact' lives!"
      *   **Emphasize:** "**Marginal Effectiveness is KING.** It's the direct link to our goal. Solvability gates it, but Marginal Effectiveness determines the real impact of our resources. A solvable problem with low marginal effectiveness (e.g., funding the 1000th researcher on a crowded topic) is a bad opportunity."
      *   **Connect:** "High Importance + High Neglectedness suggests potential, but only High *Marginal Effectiveness* makes it a true high-impact opportunity *for our next unit*. Neglectedness often *enables* high marginal effectiveness."
      *   **Pre-Empt Misconception:** "Tractability =/= 'easiest to do.' A simple task might have zero impact. Flow-through effects (*cough*) are often hard to measure and double-counted. **Boundary:** 'For tractability (Marginal Effectiveness), focus on the *direct, reasonably measurable* first-order effects of the *specific intervention* we'd fund/do. We acknowledge second-order effects exist but don't have time for robust modeling today.' (Shut down the flow-through guy preemptively!)."

  **Example Deep Dive & Verdict (10 mins):**
  *   **Lead Pipes (Municipal Program):**
      *   *Importance:* High (Prevents neurological damage, esp. in kids).
      *   *Neglectedness:* Mixed. Overall funding gap (High N?), but *bottleneck* is crews (Key Slot Neglectedness: High for crew capacity).
      *   *Tractability (Solvability):* High (Tech exists).
      *   *Tractability (Marginal Effectiveness):* **HIGH** if funding/training *specifically addresses the crew bottleneck* ($$ for training/equipment, skilled volunteer hours for pipeline mapping/planning). LOW if just funding materials without solving the bottleneck. Our skills (eng/DS) map well to planning/logistics.
  *   **Ballot Measure (State Capacity):**
      *   *Importance:* High (Can enact significant policy change).
      *   *Neglectedness:* Likely **LOW** for overall funding (big NGOs involved), but potentially **HIGH** for *data science capacity* (our specific slot).
      *   *Tractability (Solvability):* High (Campaigns run, signatures gathered).
      *   *Tractability (Marginal Effectiveness):* **POTENTIALLY HIGH** *only if* the DS bottleneck is real and severe *and* our skilled volunteers directly address it. Risk: If the campaign is already well-run, our DS model might add little marginal value. Highly dependent on the specific campaign's needs.
  *   **Verdict:** "No universal 'winner'. Depends on **specifics of the slot** and **marginal effectiveness**.
      *   Lead Pipes likely wins on *clear, direct health impact* and *high marginal effectiveness if bottleneck is targeted*. Strong fit for $$ or specific skilled hours.
      *   Ballot Measure *could* win if data science is the *critical neglected bottleneck* and our group has unique capacity. Higher risk/reward, potentially huge leverage *if* the slot is right. Better fit for *volunteer hours* than pooled $$ (unless funding DS contractors).

  **Q&A / Argument (15 mins):**
  *   **Structure:** Open floor, but be ready to gently enforce the "direct effects" boundary and redirect multiplication attempts.
  *   **The Killer Question to Test Understanding (Ask THEM):** "Looking at a *new* potential cause area - say, improving disaster response logistics. What specific question would you ask to assess if the **marginal effectiveness** of our resources ($$ or your specific skills) is likely to be high or low?" (Listen for: "Is there a bottleneck we can address?", "Is the specific thing we'd fund/do already saturated?", "What's the counterfactual?").
  *   **What to Openly Refuse to Explain:** "**Robust quantification of flow-through/second-order effects (like economic spillovers).** It's incredibly complex, context-dependent, prone to error and double-counting, and we simply don't have the time or expertise to do it justice in 45 minutes. We focus on the clearest, most direct pathways to impact for prioritization *today*."

  **Why This Sequence & Structure Works for Your Audience:**
  1.  **Neglectedness First:** Directly attacks the multiplication instinct by focusing on the crucial "will our contribution add value?" question early. Makes multiplying I*T*N seem premature.
  2.  **Splitting Tractability:** Explicitly separates "solvable?" from "will *our* stuff work well?" which addresses your core confusion. Names and elevates "Marginal Effectiveness" as the goal.
  3.  **"Slot" Neglectedness:** Directly incorporates your key insight as a nuance of Neglectedness, not a new factor. Provides language for it.
  4.  **Example Criteria Met:**
      *   **Has:** Clear differences in I/T/N, illustrates "slot" neglectedness, shows marginal effectiveness variance, involves concrete interventions (not abstract disease/vaccine), avoids AI/ML landmines, allows discussion of $$ vs. hours.
      *   **Lacks:** Easy quantification, simple "winner", purely theoretical problems.
  5.  **Pre-Empts Pitfalls:** Addresses flow-through ("boundary"), multiplication ("lenses not math"), "slot" problem, solvability vs. marginal effectiveness confusion, scope insensitivity.
  6.  **Clear Takeaways:** Marginal Impact is the goal. ITN are lenses. Neglectedness & Marginal Effectiveness are key. "Slot" matters. No simple math.

  **Key Phrases to Use Repeatedly:**
  *   "Marginal Impact / Counterfactual Impact / Decision Gap"
  *   "Will *our specific* dollar or hour add significant value?"
  *   "Is there a bottleneck *we* can address?" (For Slot Neglectedness / Marginal Effectiveness)
  *   "ITN are heuristics for *asking questions*, not calculating scores."
  *   "Focus on the clearest, most direct pathways *for this session*."

  This structure leverages your insights, respects the analytical audience while constraining unproductive impulses, provides clear language for your confusions, and delivers actionable framing within 45 minutes. Good luck!
