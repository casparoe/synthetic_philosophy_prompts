prompt: |-
  I am to lead a single ninety-minute seminar on procreative beneficence and the case for liberal eugenics, for a mixed group of about twenty people: first-year genetic counselling trainees plus a handful of clinicians. Most of them have solid biology, almost no moral philosophy, and an occupational habit of thinking about every intervention as a treatment offered to a patient who is already there. About half will arrive suspecting that whatever I describe is eugenics with the serial numbers filed off; the other half will arrive thinking it is obviously fine precisely because it is only parents choosing. I do not need the view explained to me. I need a plan for explaining it to them.

  Give me the sequence, with the dependency structure explicit: which distinction has to be in place before the principle can even be stated without sounding either tautological or menacing, and what goes wrong if I state it first. In particular, tell me where the point about selecting among possible children rather than treating a child who will exist anyway has to appear, how much of it I should actually give them, and why handing it to them too late turns it into sophistry rather than a hinge. Then the order in which the scope claim (that the reason is not confined to disease), the liberal qualifier (no state, no coercion, only the parents' own reasons), and the maximizing-versus-enough question should each be opened, and what each one needs already on the table.

  Give me the one case to carry the whole session, with an argument for what it must contain and what it must avoid. My current instinct is that it needs: a fixed set of candidate children rather than an open-ended one; a trait that is not a disease on any clinical nosology, so their clinical reflex cannot do the work; a trait whose expected effect on the child's life runs partly through a contingent and partly unjust feature of the social world, so the bad-in-itself versus bad-because-of-how-we-arranged-things fork opens when I choose rather than by accident; and a trait that is environmentally modulated or conditionally expressed, so that when someone inevitably says that we should fix the world instead, I can separate selecting a different child from changing the conditions under which this child develops. It must, I think, have no state involvement and no effect on anyone outside the family, so that the liberal/authoritarian contrast stays visible and so that the aggregate-effects worry — many small private selections shifting a population and thereby changing what the trait means — can arrive later as a genuinely new step rather than being smuggled in. And the options must not be unanimously ranked: two defensible conceptions of a good life should order them differently. Tell me what I have got wrong in that specification and what the case should be.

  Then the misconception map, in the order they will actually form, with the moment in the sequence where each should be defused rather than merely answered: that beneficence here means beneficence to a patient; that the principle is about preventing suffering and that its extension to non-disease traits is therefore a reductio rather than its content; that the embryo is the patient; that calling it eugenics requires a state somewhere, together with the mirror error that the word liberal dissolves the objection; that the reason must be maximizing along a single scale; that the disability-rights objection is simply the claim that discrimination is wrong, rather than a question about what a selection expresses and whether the wrong lies in the act, the motive, or the aggregate pattern; and that procreative autonomy is a side-constraint that settles the matter, when in the argument it is what sets the permissive scope but does not rebut the reason.

  Finally, the check: one case at the end — I have in mind a variant where the trait's contribution to the child's flourishing depends partly on the parents' own response to it, so that the ranking seems to move with facts about the family rather than the genome — that will tell me whether they have located a premise they can reject or are only registering discomfort, plus what I should explicitly refuse to settle in ninety minutes and say out loud that I am refusing: the full metaphysics of the non-identity claim, how heritable any of this is or how well screening ranks embryos, and whether the principle yields a duty or only a permission.
reasoning: |-
  We are designing a seminar on procreative beneficence and liberal eugenics for an audience of genetic counseling trainees and clinicians. The audience has strong biology backgrounds but little moral philosophy and is accustomed to thinking in terms of treating existing patients. We must structure the seminar to build understanding step by step, avoiding early misconceptions and ensuring key distinctions are clear.

  **Overall Structure and Sequence**

  1. **Set the Stage: The Non-Identity Problem (The Hinge Distinction)**
     - *Why first?* Without this, the principle of procreative beneficence (PB) will be misunderstood as a duty to an existing patient. If stated first without this distinction, PB sounds either tautological (if interpreted as "do what's best for the child") or menacing (if interpreted as "create only the best children").
     - *Content*: Present a simple case of selection *among possible future children* (e.g., selecting an embryo via IVF with PGD). Contrast this with intervening to treat a disease in an existing child. Emphasize that in selection, we are not changing the traits of a particular child who will exist regardless; we are choosing which child will exist.
     - *Consequence of omission*: If this comes too late, the audience will hear PB as a duty to maximize the welfare of a particular child (which they already accept) and then be confused when it extends to non-disease traits, or they will see it as a direct attack on the value of existing people with disabilities. It becomes sophistry because it seems like we are changing the subject when we later clarify.

  2. **State the Principle of Procreative Beneficence (PB)**
     - *After* the non-identity distinction is clear.
     - PB: If parents have a choice of which child to bring into existence, they have a moral reason to select the child with the best expected life (or at least a life above a threshold), based on the best available information.
     - *Note*: At this stage, keep it broad but don't yet expand to non-disease traits.

  3. **Clarify the Scope: Not Just Disease**
     - *Why now?* The audience's clinical reflex is to think in terms of disease and suffering. We must show that PB is not merely about preventing suffering but about promoting well-being. This is a natural extension once PB is understood as a reason for selection among possible children.
     - *How*: Use a case that involves a trait that is not a disease but affects well-being. Example: selecting for a trait that correlates with higher life satisfaction (e.g., optimism) or against a trait that correlates with lower life satisfaction (e.g., predisposition to clinical depression, but note that depression is a disease; so we need a non-disease example).
     - *Dependency*: Requires the non-identity distinction to be clear so that the audience doesn't think we are "treating" a non-disease as if it were a disease.

  4. **Introduce the Liberal Qualifier**
     - *Why now?* After PB is stated and its scope clarified, we address the fear of state coercion. We must emphasize that PB is a moral reason for parents, not a state mandate.
     - *Content*: Liberal eugenics is about voluntary choices by parents using reproductive technologies, without state coercion. The state's role is limited to ensuring safety and providing information.
     - *Dependency*: This must come after PB is understood as a reason for selection (not treatment) and after the scope is opened, otherwise the audience might think the state is forcing non-disease selections.

  5. **The Maximizing vs. Threshold Question**
     - *Why now?* Once PB is on the table, we can address whether the reason is to maximize well-being or to ensure a life above a threshold. This is a refinement.
     - *Content*: Does PB require selecting the child with the absolute best expected life, or just one above a certain threshold? This connects to the non-identity problem: if we select a child with a life worth living, but not the best possible, have we wronged that child? (No, because that child wouldn't exist otherwise.) But we might have a moral reason to choose a better life if we can.
     - *Dependency*: Requires PB and the non-identity distinction to be clear.

  **The Central Case**

  *Specification*: We need a case that meets these criteria:
  - Fixed set of candidate children (e.g., two embryos available for transfer).
  - Trait that is not a disease (so not on any clinical nosology).
  - Trait whose effect on the child's life runs partly through a contingent and unjust social feature (so we can separate the trait's inherent value from social construction).
  - Trait that is environmentally modulated or conditionally expressed (so we can distinguish selecting a different child from changing the environment).
  - No state involvement or external effects (to keep it liberal).
  - Options not unanimously ranked by different conceptions of the good life.

  *Proposed Case*: **Selecting for height in a society that values tallness in certain professions and social contexts.**

  - *Why height?*
    - Not a disease: Being short is not a disease, though it might be associated with some health risks (which we can set aside by focusing on social effects).
    - Social contingency: Height is valued in many societies for leadership roles, dating, etc., but this is contingent and arguably unjust (height discrimination). We can imagine a society where this is changing, but currently it persists.
    - Environmentally modulated: Parents might try to change the environment (e.g., by encouraging sports or skills that don't require height) but they cannot change the social bias entirely. Also, height is genetically determined and not easily modifiable by environment (though nutrition matters in early development, we are talking about genetic selection).
    - Not unanimously ranked: One conception of the good life might emphasize professional success and social acceptance (which favors tallness). Another might emphasize inner virtues, intellectual pursuits, or artistic expression (where height is less relevant). So parents might reasonably disagree on whether selecting for height is beneficial.
    - No state or external effects: This is a private choice by parents using PGD.

  *Refinements*:
  - Avoid health associations: Focus on social effects only. We can stipulate that both embryos are healthy and that the height difference (say, one embryo will be ~6'2", the other ~5'5") is not linked to any disorder.
  - Fixed set: Two embryos, one tall, one short.

  *What might be wrong with this case?*
  - Height might be seen as too trivial, or the social effects might be overstated. Also, height is not entirely socially constructed – some inherent advantages in sports, etc. But we can present it as primarily social.

  *Alternative Case*: **Selecting for a genetic predisposition to musical ability.**
    - Not a disease.
    - Social contingency: Musical ability is valued, but the extent varies by culture and family. It might lead to a fulfilling life for the child, but only if the environment supports it (e.g., access to instruments, teachers). Without support, it might cause frustration.
    - Environmentally modulated: Parents can provide a musical environment or not.
    - Not unanimously ranked: Some parents might value musical ability highly; others might think it is less important than other traits (e.g., empathy, intelligence). 
    - But note: This might be seen as a disease if we frame it as a "talent" that the child lacks, which is problematic. Also, musical ability is complex and not monogenic.

  *Revised Case*: **Selecting for a genetic variant associated with higher average educational attainment (e.g., a polygenic score for years of education).**
    - Not a disease.
    - Social contingency: The value of educational attainment depends on the society (e.g., in a knowledge economy) and might be unjust if it reinforces class structures.
    - Environmentally modulated: The effect of the genetic variant depends on the educational environment.
    - Not unanimously ranked: Some parents might value academic success highly; others might value other forms of flourishing (e.g., athletic, artistic, or relational).
    - But note: This is polygenic and complex, and we are oversimplifying. Also, it might feel too close to intelligence, which is sensitive.

  *Final Choice*: **Height case seems best for simplicity and clarity of social contingency.** We will use that.

  **Misconception Map (Order of Formation and Defusing)**

  1. **Misconception: Beneficence here means beneficence to an existing patient.**
     - *When it forms*: Immediately, because of their clinical background.
     - *When to defuse*: At the very beginning, when introducing the non-identity problem. Emphasize: we are not treating a patient; we are choosing which possible person will become a patient (or not).
     - *Defusing*: Contrast two scenarios: (a) treating a child with a condition, and (b) selecting an embryo without that condition. Ask: "In (b), who is the patient? The embryo? But note: we are not treating the embryo; we are choosing which embryo to implant."

  2. **Misconception: PB is about preventing suffering and its extension to non-disease traits is a reductio.**
     - *When it forms*: When we expand the scope beyond disease.
     - *When to defuse*: When introducing the scope claim (step 3 above). Use the height case: "Is being short a disease? No. But might it lead to lower well-being in our current society? Possibly. So PB gives a reason to select for tallness, but note: this reason is not about disease; it's about well-being."
     - *Defusing*: Explicitly state that PB is not confined to disease because it is about overall well-being.

  3. **Misconception: The embryo is the patient.**
     - *When it forms*: When discussing embryo selection.
     - *When to defuse*: During the non-identity problem discussion. Stress: we are not treating the embryo for a condition; we are choosing which embryo to bring to term. The moral reason is to the future child, not the embryo.

  4. **Misconception: Calling it eugenics requires state involvement, or the word 'liberal' dissolves the objection.**
     - *When it forms*: When we use the term "liberal eugenics".
     - *When to defuse*: When introducing the liberal qualifier (step 4). Acknowledge that eugenics has a history of state coercion, but explain that liberal eugenics is about individual choice. However, note that the word 'liberal' doesn't make it unobjectionable – we still have to evaluate the moral reasons.

  5. **Misconception: The reason must be maximizing along a single scale.**
     - *When it forms*: When stating PB (if we say "best expected life").
     - *When to defuse*: When discussing the maximizing vs. threshold question (step 5). Use the height case: "Does PB require selecting the tallest child? Or is it enough to select a child above a threshold (say, not extremely short)? And note: well-being is multi-dimensional – tallness might help in some areas but not others."

  6. **Misconception: The disability-rights objection is simply that discrimination is wrong.**
     - *When it forms*: When we discuss selecting against a disability (even if we are using a non-disease example, they might draw the parallel).
     - *When to defuse*: During the scope step or when discussing objections. Clarify that the objection is often about what the selection expresses (devaluing disabled lives) and whether it is a wrong in the act, motive, or aggregate pattern. We can note that in the height case, selecting against shortness might express a bias against short people.

  7. **Misconception: Procreative autonomy is a side-constraint that settles the matter.**
     - *When it forms*: When we introduce the liberal qualifier.
     - *When to defuse*: When discussing the liberal qualifier and again when addressing objections. Explain: procreative autonomy (the right to choose) sets the permissive scope (the state shouldn't coerce), but it does not rebut the moral reason given by PB. Parents might have a moral reason to select one way, but they are not forced to.

  **The Check Case**

  *Purpose*: To see if they have grasped the non-identity problem and the structure of PB, and to reveal if they are rejecting a premise or just feeling discomfort.

  *Case*: **Selecting for a genetic variant associated with being introverted or extroverted. The expected impact on the child's well-being depends on whether the parents are introverted or extroverted themselves and how they raise the child.**

  - Example: Two embryos. Embryo A has a variant associated with extroversion; Embryo B with introversion. The parents are both introverted and value quiet, deep relationships. They worry that an extroverted child might be unhappy in their family because they don't provide a highly social environment. Alternatively, they might worry that an introverted child might struggle in a world that values extroversion. But they also consider that an extroverted child might push them to be more social, which could be good for the child and them.

  - *Why this case?*
    - The ranking of the embryos depends on family-specific factors (the parents' personalities and parenting style). So the "best" child is relative to the family context.
    - It forces the question: Is PB about selecting the child with the best expected life in the abstract, or in the context of this family?
    - It reveals whether they see PB as a reason that must be tailored to the family context, which is part of the liberal view (parents using their own values and circumstances).

  *What to look for*:
  - If they say, "The parents should change their parenting style to suit the child," then they are slipping back into the treatment model (changing the environment for a child who will exist regardless). We must remind them: we are selecting which child will exist.
  - If they see that the parents have a reason to select the child that fits their family, they have grasped that PB is context-dependent and that the non-identity problem is central.

  *Explicit Refusals*: In the last few minutes, state that we are not settling:
  - The full metaphysics of the non-identity problem (e.g., whether possible children have moral status).
  - The heritability of complex traits or the accuracy of screening (we are assuming for the sake of argument that we can predict well).
  - Whether PB yields a duty or only a permission (we've presented it as a reason, not necessarily an obligation).

  **Seminar Plan (90 Minutes)**

  1. **Introduction (5 mins)**: Outline the topic and goals. Acknowledge the sensitivity of the term "eugenics" and state that we are examining a specific argument.

  2. **The Non-Identity Problem (20 mins)**:
     - Present a simple disease case (e.g., selecting against cystic fibrosis via PGD) to illustrate the distinction between treating a child and selecting which child will exist. Contrast with treating a child who has CF.
     - Emphasize: no patient exists until after selection.

  3. **State PB (5 mins)**: Define procreative beneficence.

  4. **Scope: Beyond Disease (15 mins)**:
     - Present the height case. Discuss: Is this a disease? Why might parents have a reason to select for tallness? How does the social context matter? What if society changes?
     - Address the "fix the world" objection: We should try to fix the world, but that doesn't negate the reason to select a child who is less likely to be harmed by the current world.

  5. **Liberal Qualifier (10 mins)**:
     - Explain that this is about parental choice, not state mandates. Contrast with historical eugenics.
     - Discuss procreative autonomy: Does it override PB? No, PB is a moral reason that exists alongside autonomy.

  6. **Maximizing vs. Threshold (10 mins)**:
     - Return to the height case: Must parents choose the tallest? Or is it enough to avoid extreme shortness? And note: well-being is multi-faceted.

  7. **Check Case (15 mins)**:
     - Present the introversion/extroversion case. Break into small groups to discuss: What should the parents do? Then discuss as a class.

  8. **Conclusion and Refusals (5 mins)**:
     - Summarize the key distinctions.
     - Explicitly state what we did not settle (non-identity metaphysics, heritability, duty vs. permission).

  **Adaptations for Audience**:
  - Use minimal philosophy jargon.
  - Anchor in biology when possible (e.g., explain PGD simply).
  - Allow questions throughout but keep to the sequence.
answer: |-
  Below is a structured plan for your 90-minute seminar, designed to build understanding incrementally while preempting misconceptions. The sequence prioritizes conceptual dependencies: key distinctions must be established early to prevent the principle from being misinterpreted as tautological (e.g., "of course parents should help their child") or menacing (e.g., "this is designer babies with a eugenic agenda"). I'll outline the sequence, the central case, the misconception map with defusing points, and the check case, followed by explicit refusals.

  ---

  ### **Seminar Sequence: Order, Dependencies, and Timing**
  **Total: 90 minutes**  
  *(Timings are flexible; focus on dependencies.)*

  1. **Introduction: Framing the Topic (5 minutes)**  
     - **Goal:** Acknowledge sensitivities (e.g., the term "eugenics"), state the seminar’s narrow focus (moral reasoning, not policy), and clarify that this is about parental decision-making in assisted reproduction (e.g., embryo selection via IVF/PGD).  
     - **Why first?** Prevents defensive reactions by validating concerns upfront (e.g., "Many associate 'eugenics' with state coercion—we'll address that later").

  2. **Establish the Non-Identity Distinction (The Hinge) (25 minutes)**  
     - **Content:** Contrast **selecting among possible future children** (e.g., choosing which embryo to implant) vs. **treating an existing child**. Use a simple biological analogy:  
       - *Treatment example:* Correcting a heart defect in a fetus that will be born regardless.  
       - *Selection example:* Choosing between two embryos—one with a genetic predisposition to a lifelong condition (e.g., deafness), one without—where the choice determines which child exists.  
     - **Key dependency:** This must come **before stating procreative beneficence (PB)**. If PB is stated first:  
       - Without this distinction, PB sounds tautological ("parents should want the best for their child") or menacing ("parents must create the 'best' child").  
       - With it, PB becomes a reason to select one *possible* child over another based on expected well-being, not a duty to an existing patient.  
     - **Why this timing?** If introduced late, the distinction feels like sophistry—a retroactive fix to avoid objections (e.g., disability rights). By introducing it early, it anchors PB as a reason about creation, not therapy.  
     - **How much to give:** Spend significant time here. Use audience participation: *"In the treatment case, who is the patient? What are we obligated to do? In selection, is there a patient yet?"*  

  3. **State Procreative Beneficence (PB) (10 minutes)**  
     - **Content:** Define PB concisely: *"If parents have a choice between possible future children, they have a moral reason to select the child expected to have the best life, based on available information."*  
     - **Dependency:** Requires the non-identity distinction (Step 2) to avoid misinterpretation. Now PB is seen as a reason applied to a choice, not a treatment imperative.  
     - **Emphasize:** PB is a *pro tanto* reason (could be overridden), not an absolute duty.  

  4. **Clarify Scope: PB Extends Beyond Disease (15 minutes)**  
     - **Content:** Argue PB applies to non-disease traits affecting well-being (e.g., resilience, social traits). Use your **central case (see below)** to illustrate.  
     - **Dependency:** Requires PB (Step 3) and non-identity (Step 2). Without them, extending beyond disease feels like a reductio (e.g., "If PB isn't about disease, it's absurd").  
     - **Why before liberal qualifier?** If liberal qualifier comes first, the scope expansion seems like a slippery slope to authoritarianism.  

  5. **Introduce the Liberal Qualifier (10 minutes)**  
     - **Content:** Define "liberal eugenics": no state coercion; decisions driven by parents' values using private technology (e.g., commercial PGD). Contrast with historical state eugenics (e.g., forced sterilizations).  
     - **Dependency:** Requires PB (Step 3) and scope (Step 4). Without them:  
       - Liberal qualifier seems to "resolve" all objections prematurely (e.g., "no state, so no problem").  
       - With them, it’s clear liberalism sets bounds but doesn’t negate PB’s moral reason.  
     - **Key point:** Procreative autonomy permits parental choice but doesn’t rebut PB—it defines the arena.  

  6. **Address Maximizing vs. Threshold (10 minutes)**  
     - **Content:** Argue PB doesn’t require maximizing (e.g., "best possible child") but may only require a threshold (e.g., "above a baseline of well-being"). Use your central case to show competing values.  
     - **Dependency:** Requires PB (Step 3), scope (Step 4), and liberal qualifier (Step 5). If opened earlier:  
       - Maximizing seems like PB’s core, inviting "designer baby" fears.  
       - Threshold questions make sense only after PB’s scope is clear.  

  7. **Check Case and Discussion (10 minutes)**  
     - **Content:** Use your **check case (see below)** to test comprehension.  
     - **Goal:** Reveal if objections are based on rejecting a premise (e.g., non-identity) or discomfort.  

  8. **Q&A and Explicit Refusals (5 minutes)**  
     - **Refuse to settle:** Non-identity metaphysics (are possible children "real"?), heritability/accuracy of screening (assume it works for argument’s sake), and whether PB is a duty or permission (focus on reason-based framing).  

  ---

  ### **The Central Case: Carrying the Session**  
  **Case: Selecting for a genetic variant associated with *resilience to social rejection*.**  
  - **Trait:** A polygenic score correlating with faster emotional recovery after social exclusion. Not a disease (no ICD code), but linked to mental well-being.  
  - **Fixed options:** Two embryos—one with high-resilience variant, one with average—in a single IVF cycle.  
  - **Social contingency:** The trait’s value depends on an unjust social feature (e.g., bullying culture in schools). High resilience improves coping in a biased world, but the world *should* be fixed.  
  - **Environmental modulation:** Resilience’s effects depend on environment (e.g., supportive parenting reduces its importance). Distinguishes selecting a child from changing conditions.  
  - **No state/external effects:** Private parental choice; no population-level impact.  
  - **Non-unanimous ranking:**  
    - *Conception 1 (Individualist):* Resilience enables success in a competitive world → higher expected well-being.  
    - *Conception 2 (Communal):* Average resilience fosters empathy and deeper relationships → better life.  

  **Why this case works:**  
  - **Avoids clinical reflex:** Not a disease, so PB’s extension must engage moral reasoning.  
  - **Forces key forks:** Social contingency (bad world vs. bad trait) is explicit; environmental modulation separates selection from changing conditions.  
  - **Liberal visibility:** No state role; private choice.  
  - **Prevents smuggling:** Aggregate effects (e.g., "if everyone selects resilience, society degrades") are excluded initially, so they emerge later as new objections.  

  **What you got wrong in your spec:**  
  - Avoid **height** (too tied to health/non-health debates; e.g., short stature can be medicalized).  
  - Avoid **musical ability** (often seen as a "gift," muddying disease/non-disease).  
  - **Resilience** better isolates PB’s core: it’s non-clinical, socially contingent, and values-dependent.  

  ---

  ### **Misconception Map: Order, Defusing Points, and Methods**  
  Misconceptions will form predictably from your audience’s clinical habits. Defuse them at specific points—**not when they arise**, but when the dependency allows a clear rebuttal.  

  1. **"Beneficence means beneficence to a patient."**  
     - **When formed:** Immediately (clinical reflex).  
     - **Defuse at:** Non-identity distinction (Step 2).  
     - **How:** Contrast treatment vs. selection. *"In selection, there is no patient—only possible children. PB is about creation, not therapy."*  

  2. **"PB is about preventing suffering; extending it to non-disease traits is a reductio."**  
     - **When formed:** When PB is stated (Step 3).  
     - **Defuse at:** Scope clarification (Step 4).  
     - **How:** Use central case. *"PB is about well-being, not suffering. Resilience isn’t a disease, but it affects flourishing. Ignoring it would be arbitrary."*  

  3. **"The embryo is the patient."**  
     - **When formed:** During non-identity discussion (Step 2).  
     - **Defuse at:** Non-identity distinction (Step 2).  
     - **How:** *"The embryo isn’t a ‘patient’—it’s a potential child. We’re choosing which potential becomes actual, not treating an entity with interests."*  

  4. **"Eugenics requires state involvement" or "Liberal means it’s fine."**  
     - **When formed:** When "liberal eugenics" is introduced.  
     - **Defuse at:** Liberal qualifier (Step 5).  
     - **How:** *"Historical eugenics involved states, but ‘liberal’ here means no coercion. That doesn’t make it unobjectionable—we still evaluate the parental reason."*  

  5. **"PB requires maximizing along a single scale."**  
     - **When formed:** When PB is stated (Step 3).  
     - **Defuse at:** Maximizing vs. threshold (Step 6).  
     - **How:** Use central case. *"PB isn’t about creating ‘superhumans.’ Parents might choose average resilience because it aligns with their values—well-being is multidimensional."*  

  6. **"Disability-rights objections reduce to ‘discrimination is wrong.’"**  
     - **When formed:** During scope discussion (Step 4).  
     - **Defuse at:** Scope (Step 4) or liberal qualifier (Step 5).  
     - **How:** *"The objection isn’t just about discrimination—it’s about whether selection expresses devaluation, or harms a community. PB forces us to ask: Is the wrong in the act, the motive, or the pattern?"*  

  7. **"Procreative autonomy settles it—parents can choose freely."**  
     - **When formed:** During liberal qualifier (Step 5).  
     - **Defuse at:** Liberal qualifier (Step 5).  
     - **How:** *"Autonomy sets the bounds of permissibility, but it doesn’t negate PB as a moral reason. Parents might have autonomy but still act against a moral reason."*  

  ---

  ### **Check Case: Testing Comprehension**  
  **Case: Selecting for *genetic predisposition to introversion*.**  
  - Parents are introverted academics who value quiet, focused environments.  
  - **Options:** Embryo A (highly extroverted), Embryo B (moderately introverted).  
  - **Trait’s dependence on parents:**  
    - Extroverted child may feel stifled in a quiet home, reducing well-being.  
    - Introverted child may thrive but face challenges in an extroverted society.  
  - **Why this works:**  
    - The "best" child depends on family context—PB’s reason shifts with parental traits.  
    - Reveals if they grasp non-identity: If they say, "Change the parenting style," they’re treating Embryo A as a fixed patient. If they see selection as choosing which child fits the family, they’ve internalized the hinge.  
    - Discomfort vs. premise rejection: If they reject PB entirely, it’s often discomfort with "choosing traits." If they debate contextual reason-giving, they’re engaging the premise.  

  ---

  ### **Explicit Refusals**  
  In the closing minutes, state:  
  *"We’ve focused on moral reasoning, but we haven’t settled:  
  - The metaphysics of non-identity (e.g., ‘Do possible children have rights?’).  
  - Practical limits (e.g., how well PGD predicts traits, or heritability complexities).  
  - Whether PB is a duty or mere permission.  
  These are critical but exceed our scope—today’s goal was to map the argument."*  

  This plan ensures the audience builds PB from the ground up, with the non-identity distinction as the load-bearing hinge. The central case keeps discussion concrete, while misconceptions are defused proactively. By the end, trainees should see PB as a reason embedded in creation, not treatment—even if they reject it.
