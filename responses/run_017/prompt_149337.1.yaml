prompt: |-
  I've been following a long-running comment thread on one of the rationalist group blogs about whole-brain emulation, and the same move keeps surfacing: someone says the brain is hardware and the mind is the software running on it, and then uses that one sentence to license two quite strong conclusions. First, that uploading or mind-copying is in principle just a matter of resolution and compute, since a program is portable. Second, that psychology is autonomous from neuroscience the way software engineering is autonomous from semiconductor physics, so functional and folk-psychological descriptions are the right level and the wetware is an implementation detail. A friend of mine who works adjacent to computational neuroscience says the sentence is doing all the work, and that the whole thing comes apart as soon as you ask what the instruction set architecture is supposed to be. I don't want a verdict on whether brains are computers; I want an audit of the analogy and of what it can carry.

  So: give me the correspondence table. For each of the following, name what plays the role in the brain, or say that nothing does and that this is a genuine break rather than a strained fit — the instruction set architecture; the compiled artifact; the compiler and the source it compiles; the program/data distinction; the program counter and the clock; the memory hierarchy; the bus; the operating system; the power supply; the user; the programmer; and the operation of porting to different hardware. Then sort the breaks by whether they are load-bearing for the two conclusions or merely cosmetic. Is it load-bearing that the source is a genome and the compilation is development, so that there is no artifact to copy but only a noisy process to re-run? That plasticity makes the program self-modifying, collapsing the program/data split? That there is no published architecture, so same computation on different hardware is fixed only by whatever mapping we choose after the fact, which is the familiar worry that on a liberal enough mapping any physical system implements any computation? That the system is asynchronous, analog-ish and stochastic, so a faithful simulation is a discretization, and nobody has said what error tolerance still counts as running the same program rather than a near one? I'd also like named explicitly the features the analogy imports that the target might lack: that behavior is produced by rule-governed operations on discrete symbols at some level, that implementation is an objective relation rather than a description we impose, and that the program is separable from the machine and therefore copyable.

  Then the verdict, kept separate for the two conclusions: which survives once the disanalogies are on the table, which was being carried entirely by the analogy, and is there a weaker version of the sentence worth keeping. I also suspect the thread is conflating two claims, and I'd like them pulled apart: substrate-independence for cognition and behavior versus for phenomenal experience. The piecemeal-replacement case — swapping neurons for functionally equivalent chips one at a time — seems to separate them, and I want to know which version of the analogy each half requires and what each half can concede without giving up the other. Finally, if the hardware/software picture is the wrong one, propose a better analogy and say what it would predict differently; my friend suggests something like an analog, self-rewiring systolic array whose firmware is partly the chemistry, and I genuinely can't tell whether that is an improvement or just a more impressive-sounding way of saying the same thing. Skip the Chinese Room — I've read that one, and it isn't the objection I'm after.
reasoning: |-
  Hmm, this user is diving deep into the brain-as-computer analogy, specifically critiquing how it's used to justify mind uploading and functional autonomy in rationalist circles. They've clearly done their homework - referencing computational neuroscience concepts, pinpointing exact points of failure in the analogy, and even anticipating responses like the Chinese Room. 

  The core tension they're highlighting is between the elegance of the computational metaphor and the messy biological reality. I notice they're particularly frustrated by how a single catchy phrase ("mind is software, brain is hardware") gets used to bootstrap two very strong philosophical conclusions. Their computational neuroscientist friend seems to have primed them to look for missing architectural specifications.

  What's sophisticated here is how they distinguish between cosmetic disanalogies and load-bearing ones. They're not just listing differences but asking which ones actually undermine the twin conclusions about uploadability and functional autonomy. The request for a correspondence table suggests they want systematic rigor rather than handwaving.

  Interesting that they separate phenomenal experience from cognition in the uploading question - that's where philosophers like Chalmers would say the hard problem lives. The neuron-replacement thought experiment is clever because it forces the analogy to confront continuity of consciousness versus behavioral equivalence.

  Their friend's "self-rewiring systolic array" suggestion makes me smile - it's technically more accurate but possibly just relabeling the problem. The user seems to suspect this too, which shows good meta-cognition. 

  When they dismiss the Chinese Room, it signals they're after implementation-level objections rather than semantic ones. This is someone who's read their Searle but wants harder computational constraints.

  The genome-as-source-code point is particularly damning for uploads - if development is part of the "compilation" with epigenetic noise, exact replication becomes impossible in principle. That might be the most load-bearing disanalogy of all.

  For the functional autonomy claim, the stochastic plasticity issue seems fatal. If the "software" keeps rewriting itself based on "data" in ways that depend on underlying chemistry, the levels aren't cleanly separable like in computing.

  What they might not fully appreciate is how much the analogy's usefulness depends on what explanatory work you need it to do. For high-level cognitive modeling, it's still productive despite the leaks. For phenomenal identity? Not so much.
answer: |-
  Below is a systematic audit of the brain-as-computer analogy, addressing your requested components, breaks, and conclusions. The goal is not to declare the analogy "true" or "false," but to evaluate its inferential load-bearing capacity for the two key claims:  
  **Conclusion 1 (C1)**: Uploading/mind-copying is just a matter of resolution/compute.  
  **Conclusion 2 (C2)**: Psychology is autonomous from neuroscience, akin to software vs. hardware.  

  ---

  ### **Correspondence Table**  
  *Sorted by relevance to C1/C2, with "load-bearing" breaks marked.*  

  | **Computing Concept**       | **Neural Correlate**                                                                 | **Break Severity**                                                                                               | **Load-Bearing for C1/C2?**                                                                 |
  |-----------------------------|--------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------|
  | **Instruction Set Architecture (ISA)** | *None.* No standardized, discrete, stable set of machine instructions. Neural "operations" are emergent from electrochemical dynamics, not fetched/decoded. | **Fundamental Break.**                                                                                     | **CRITICAL for both.** C1 requires a portable ISA for copying; C2 requires fixed abstraction layer. |
  | **Compiled Artifact**       | *None.* The "program" is the dynamic, self-modifying state of the connectome + neuromodulators. No static binary exists to "copy."                | **Load-Bearing.**                                                                                          | **CRITICAL for C1.** Copying requires a snapshot artifact; brains lack this.                       |
  | **Compiler & Source Code**  | *Partial/Strained.* Genome ≈ "source," developmental processes ≈ "compiler." But compilation is noisy, environmentally coupled, and never halts. | **Load-Bearing.**                                                                                          | **CRITICAL for C1.** No recompilable source; development is non-repeatable wetware process.        |
  | **Program/Data Distinction**| *Collapsed.* Synaptic weights are both code (influencing computation) and data (modified by experience). No ROM; all is "RAM" subject to rewrite. | **Load-Bearing.**                                                                                          | **CRITICAL for C2.** Autonomy requires separation; plasticity merges levels.                       |
  | **Program Counter & Clock** | *Distributed/Stochastic.* No central clock; oscillations (e.g., gamma) are emergent. "Next instruction" is context-dependent, not linear.        | **Load-Bearing.**                                                                                          | **CRITICAL for C1.** Copying requires deterministic state progression; brains are asynchronous.    |
  | **Memory Hierarchy**        | *Partial.* Short-term ≈ synaptic/Ca²⁺ dynamics; Long-term ≈ synaptic plasticity. No L1/L2 cache analog; retrieval is reconstructive, not literal. | **Cosmetic.**                                                                                             | Not load-bearing. Functional separation exists (e.g., hippocampus vs. cortex).                   |
  | **Bus**                     | *Partial.* White matter tracts (e.g., corpus callosum) ≈ interconnects. But no address/data lines; communication is analog, modulated, redundant. | **Cosmetic.**                                                                                             | Not load-bearing.                                                                               |
  | **Operating System**        | *None.* No centralized resource allocator or scheduler. Autonomic functions (e.g., brainstem) are not an "OS"; cognition is decentralized.       | **Cosmetic.**                                                                                             | Not load-bearing.                                                                               |
  | **Power Supply**            | *Direct Analog.* Glucose/O₂ metabolism → ATP. Failure causes immediate "shutdown."                                                   | **Functional.**                                                                                            | Not load-bearing.                                                                               |
  | **User/Programmer**         | *None.* Brains self-organize; no external "user." Evolution/natural selection ≈ "programmer," but via selection, not design.              | **Cosmetic.**                                                                                             | Not load-bearing.                                                                               |
  | **Porting to New Hardware** | *No Equivalent.* "Porting" would require mapping to a stable ISA. Brains lack ISA; "same computation" is undefined (see below).              | **CRITICAL Break.**                                                                                      | **CRITICAL for C1.** Without ISA, "porting" is reimplementation by fiat.                          |

  ---

  ### **Key Breaks & Their Load-Bearing Status**  
  1. **No ISA** → *Load-Bearing for C1 & C2*:  
     - Without a stable computational interface, "copying" or "porting" loses objective meaning. Imposes **substrate-dependence**.  
  2. **No Compiled Artifact / Source Code** (Genome → Development) → *Load-Bearing for C1*:  
     - You can't "copy" a process; you can only re-run development (with noise/divergence). Uploading requires a *state*, not a *trajectory*.  
  3. **Collapsed Program/Data Distinction** → *Load-Bearing for C2*:  
     - Self-modifying code undermines autonomy. "Wetware" (e.g., neuromodulator diffusion) directly alters functional properties.  
  4. **Asynchronous, Analog, Stochastic** → *Load-Bearing for C1*:  
     - Discretization adds noise. When is a simulation "close enough"? No error tolerance standard for *phenomenal identity* (vs. behavioral equivalence).  
  5. **No Objective Implementation** → *Load-Bearing for C1*:  
     - Without ISA, "same computation" relies on observer-dependent mappings (Pancomputationalism problem).  

  ---

  ### **Features Imported by the Analogy (But Lacking in Biology)**  
  - **Discrete Symbol Manipulation**: Brains use distributed, subsymbolic, continuous representations (e.g., neural population vectors).  
  - **Objective Implementation**: Computation is observer-relative without a clear ISA.  
  - **Separable Program**: The "mind" is not extractable; it's an embodied, embedded process.  
  - **Deterministic State Transitions**: Neural dynamics are stochastic and path-dependent.  

  ---

  ### **Verdict on Conclusions**  
  - **Conclusion 1 (Uploading/Mind-Copying)**:  
    **Does not survive.** Breaks #1–5 are fatal. Copying requires a static, substrate-independent representation (compiled artifact/ISA), which brains lack. Development is noisy, states are analog, and "sameness" is undefined for phenomenology.  
    - *Substrate-independence of cognition*: Plausible for *behavior* (if simulation is sufficiently high-fidelity).  
    - *Substrate-independence of phenomenology*: Unsupported. Piecemeal replacement *might* preserve continuity of consciousness (via causal continuity), but copying does not.  

  - **Conclusion 2 (Psychology’s Autonomy)**:  
    **Survives weakly, but compromised.** Functional descriptions *can* abstract over neural details (e.g., predictive coding models). However, breaks #3 (program/data collapse) and #1 (no ISA) undermine strict autonomy. Neuroscience constrains/complements psychology; they are not cleanly separable.  

  **Weaker Version Worth Keeping**:  
  > *"Cognitive processes can be modeled as computational functions, implementable in diverse substrates at appropriate scales of abstraction."*  
  This avoids claims about ISA, copying, or strict autonomy.  

  ---

  ### **Substrate-Independence: Cognition vs. Phenomenology**  
  - **Cognition/Behavior**: Requires functional isomorphism. Analogy concedes:  
    - Stochasticity, analog signaling, no ISA.  
    - Predicts behavioral equivalence if simulation fidelity exceeds behavioral thresholds.  
  - **Phenomenology**: Requires causal/structural continuity. Analogy *fails* for copying because:  
    - No objective "state" to copy (only noisy re-instantiation).  
    - Piecemeal replacement preserves continuity (like Ship of Theseus); wholesale copying does not.  
  **Key Disanalogy**: Software can be paused/copied/resumed; brains cannot without disrupting continuity.  

  ---

  ### **A Better Analogy: Self-Organizing, Stochastic Dynamical System**  
  Your friend’s "self-rewiring systolic array" is apt. Improve it:  
  > **"The brain is an analog, stochastic, plastic reaction-diffusion computer, where the 'hardware' chemistry co-evolves with the 'software' connectivity."**  

  **Why better?**  
  - Predicts **no pause/copy/resume** (dynamic continuity matters).  
  - Predicts **no strict autonomy** (chemistry affects function directly).  
  - Predicts **no digital equivalence class** (small differences may qualitatively alter outcomes).  
  - **Novel prediction**: Emulations will diverge from biology over time due to chaotic dynamics, unless perfectly coupled.  

  **Testable Difference**:  
  - Under the computer analogy, a brain emulator should support "save states." Under the dynamical analogy, restoring a state should cause pathological divergence (as in chaotic systems).  

  **Not Just Relabeling**: It rejects discrete symbols, fixed architecture, and separability—core assumptions behind C1/C2.  

  ---

  ### **Summary**  
  - **C1 (Uploading)**: Carried *entirely* by the analogy. Fails under biological constraints.  
  - **C2 (Autonomy)**: Weakly supported, but the analogy overstates independence; wetware matters.  
  - **Better Analogy**: Dynamical systems + evolutionary biology. Shifts focus from *copying* to *continuous instantiation*.  

  This audit suggests the rationalist thread overextends the computational metaphor. While useful for cognitive modeling, it cannot bear the weight of metaphysical claims about identity or strict autonomy.
