prompt: |-
  I'm a science-and-ideas reporter and I've agreed to do a 40-minute brown-bag for my own newsroom next week — reporters and editors who run an LLM every day for finding sources, summarizing documents and drafting, but who mostly think of it as fancy autocomplete. The piece I'm reporting is about how you supervise a system whose work you can't fully check: grading the outcome versus grading the process. I don't want the explanation itself, I want the plan for it. What has to land before "process supervision" is even intelligible as an idea — my guess is that the prerequisite is that on most real tasks the outcome is expensive or slow to check (a fact-check that only gets contradicted three weeks later, a summary nobody can verify without reading the whole archive), so tell me if that's the wrong thing to put first. Which single case should carry the whole thing: I'm thinking an AI fact-checking a claim for us, where the outcome is whether the verdict is right and the process is which documents it actually opened, whether it noticed the top hit was a press release, whether it revised when it hit contradicting evidence — tell me if that case has something in it it shouldn't. Which misconceptions will they form (I'm guessing "process supervision just means checking that each step is true" and "if the answer's right the process doesn't matter", plus sooner or later "so who grades the grader"), and exactly where in the sequence to kill each one. Also: one twist I want handled, not dodged. The vendors keep telling me coming models will do their thinking in something other than English, so there may be nothing readable to grade; I've started calling the fallback grading the audit trail instead of the reasoning — which files it opened, which tool calls it made, what it recorded — and I want to know where in the sequence that goes and whether it's honestly process supervision or just outcome supervision with extra paperwork. What should I openly refuse to explain at this level, and give me one question to end on that tells me they've got the distinction rather than just being newly worried.
reasoning: |-
  Okay, let's break this down. The reporter needs a concrete plan for explaining process supervision to skeptical journalists who view LLMs as fancy autocomplete. The core challenge is making them grasp why checking the outcome isn't enough when supervising AI systems. 

  First, I notice they're already aware of the key pain point: verifying outcomes is often costly or delayed (like fact-checks contradicted weeks later). That's perfect as a starting hook - it mirrors their daily frustrations. Their proposed AI fact-checking case study is strong because:
  - Verification delay is inherent (can't instantly know truth)
  - Process artifacts are tangible (documents opened, source quality checks)
  - Errors have clear newsroom consequences

  But I should warn about potential misconceptions upfront. When they say "process supervision means checking each step's truth" - that's exactly the oversimplification to avoid. The real goal is evaluating reasoning quality, not just factual accuracy step-by-step. 

  The vendor objection about non-English reasoning is tricky. Their "audit trail" framing is clever, but we must clarify: if we're only logging actions (files opened/tools used) without assessing the thinking behind them, that's not true process supervision - it's enhanced outcome monitoring. This distinction needs a dedicated moment in the talk.

  For sequencing, I'd suggest:
  1. Start with their outcome-verification pain points to build empathy
  2. Contrast with a process-failure disaster they'd recognize (like AI missing satire cues)
  3. Explicitly define process supervision as evaluating reasoning integrity
  4. Use their fact-checking case to show concrete process markers
  5. Demolish "right answer = good process" with a math error example
  6. Address the non-English reasoning concern by separating reasoning quality from its form

  The "who grades the grader" objection should be parked firmly in the Q&A - it's valid but derails the core concept. End by asking them to identify which supervision method would catch an AI fabricating sources - that tests if they grasp process oversight's preventive value over outcome checks.
answer: |-
  Here’s a battle-tested plan for your 40-minute session, structured to land "process supervision" without drowning in abstraction. Prioritize concrete hooks and strategically dismantle misconceptions:

  **Core Structure & Timing**  
  *(Total: 40 min = 25 min content + 10 min case study/discussion + 5 min Q&A)*  

  ### 1. Hook: The Uncheckable Outcome (5 min)  
  - **Lead with their reality:** "You run an LLM for source-finding or summarization. How often do you *truly* know if the output is perfect? When do you find out it’s wrong—three days later? After publishing?"  
  - **Key examples:**  
    - Fact-checking a claim → Truth emerges weeks later (contradictory evidence surfaces).  
    - Summarizing a 10k-page archive → No human can reread it all to verify.  
  - **Land the prerequisite:** "If the outcome is slow/expensive/impossible to verify, **outcome supervision fails.** We need a new lens."  

  ### 2. The Crisis Point: When "Right Answers" Hide Disaster (7 min)  
  - **Case study: AI Fact-Checking** (Your example is perfect—use it!)  
    - *Outcome:* Verdict "True" or "False".  
    - *Hidden failure:* AI skipped primary sources, trusted a press release, ignored conflicting data.  
    - **Consequence:** Verdict was accidentally right *this time*, but the process is brittle. Next time? Catastrophe.  
  - **Emphasize:** "The *same* correct verdict can come from luck or rigor. Only process reveals the difference."  

  ### 3. Introduce "Process Supervision" (8 min)  
  - **Define visually:**  
    - Outcome Supervision: Grading the **destination** (✅/❌).  
    - Process Supervision: Grading the **map, compass, and navigation decisions** 🧭.  
  - **In fact-checking terms:**  
    - *Process checks:* Did it open peer-reviewed studies? Flag potential bias in sources? Update confidence with new evidence?  
  - **Crucial twist:** "We’re not checking if *each step* is true (impossible!), but if the **reasoning heuristics are robust**: source diversity, conflict detection, uncertainty calibration."  

  ### 4. Kill Misconceptions—Aggressively (5 min)  
  | **Misconception**               | **When to Kill**          | **Counter-Strike**                                                                 |  
  |---------------------------------|---------------------------|------------------------------------------------------------------------------------|  
  | "Process = check each step’s truth" | Immediately after defining | "No—we check if it *used reliable methods*. Did it *seek* primary sources? Not if every source was perfect (impossible!)." |  
  | "Right outcome = Good process"  | During case study         | "Recall our fact-check: a ‘True’ verdict built on sand. Reliable outcomes *long-term* require reliable processes." |  
  | "Who grades the grader?"        | Q&A (pre-empt in closing) | "Park that for deep-dive discussions! Today: assume we *can* audit steps (logs/tools). Reality: vendors *must* provide this." |  

  ### 5. Tackle the Vendor Twist: "No English Reasoning" (5 min)  
  - **Placement:** Right after defining process supervision.  
  - **Framing:** "Vendors say future AIs ‘think’ in code, not English. So what’s left to grade?"  
  - **Your "Audit Trail" pivot is correct:**  
    - Emphasize: "**Process supervision isn’t about language—it’s about *actions*.** Did it:  
      - Query trusted databases?  
      - Run verification tools?  
      - Revise decisions after new data?  
      These *behaviors* are the process."  
  - **Critical distinction:**  
    - "If you only track *actions* without assessing *why* (e.g., did it run Tool X because it’s reliable, or at random?), it’s **outcome supervision with extra logs**. True process supervision *interprets* actions as evidence of reasoning."  

  ### 6. What to *Avoid* Explaining  
  - **Do NOT dive into:**  
    - Model internals (neurons, transformers).  
    - Math of reinforcement learning.  
    - Speculative AI consciousness.  
  - **Shut down gracefully:** "That’s PhD territory—today we focus on *practical supervision frameworks*."  

  ### 7. Closing Question to Test Understanding  
  - **Pose:** *"Imagine an LLM drafts an investigative piece. It cites correct statistics, but later we learn it fabricated a source. Which supervision method would catch this: outcome or process? Why?"*  
  - **Why it works:**  
    - Outcome supervision sees accurate stats ✅.  
    - Process supervision checks source trail → catches fabrication 🚨.  
    - Reveals if they grasp that process catches *hidden risk*.  

  **Why this flow works:**  
  1. **Starts with their pain** (unverifiable outcomes).  
  2. **Uses their workflow** (fact-checking) to make it visceral.  
  3. **Makes "process" concrete** (actions, not philosophy).  
  4. **Preempts backlash** by murdering misconceptions early.  
  5. **Ends with a litmus test** separating insight from anxiety.  

  **Final tip:** Bring a 90-second "failed process" demo (e.g., LLM summarizing a doc but missing a critical paragraph—showing logs proving it ignored key sections). Visuals cement the stakes. Go crush it.
