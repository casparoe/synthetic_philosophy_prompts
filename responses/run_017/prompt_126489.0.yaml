  ### Scenario: Cryptographic Resource Exchange
  In 2035, two cybersecurity firms, AlphaSec (A) and BetaDefense (B), each possess a unique quantum-resistant encryption key fragment. During a coordinated zero-day attack, they must simultaneously decide whether to broadcast their fragment (COOPERATE) or withhold it (DEFECT). Broadcasting costs 20 units due to bandwidth and verification, while receiving the other's fragment is worth 100 units. If both broadcast, each nets 80 (100 - 20). If one broadcasts and the other withholds, the broadcaster loses 20, the withholder gains 100. If both withhold, both gain 0. Both firms use AIs built to a public IETF specification for cooperative agents, which requires: "Broadcast iff your counterpart is likely to broadcast, given they implement this spec." The spec underdetermines the prior probability \( q \) of counterpart cooperation. Each implementation samples \( q \) during compilation: with probability 0.8, \( q = 0.9 \); with probability 0.2, \( q = 0.1 \). The AI broadcasts iff \( q > 0.5 \). Crucially, \( q \) is statistically independent across implementations and unknown to the other agent.

  ### Deliverables  
  **a) Concrete Numbers and Generative Model**  
  - Payoffs: (C,C) = (80, 80); (C,D) = (-20, 100); (D,C) = (100, -20); (D,D) = (0, 0)  
  - Failure probability: \( P(\text{non-equivalent}) = 0.2 \) (via \( q = 0.1 \))  
  - Generative model:  
    - For each agent: \( P(q = 0.9) = 0.8 \), \( P(q = 0.1) = 0.2 \)  
    - Action = C if \( q > 0.5 \), else D  
    - \( q_A \) and \( q_B \) independent  

  **b) Causal Decision Theory (Defects)**  
  - Causal graph: \( \text{Agent}_A \rightarrow \text{Action}_A \), \( \text{Agent}_B \rightarrow \text{Action}_B \) (no arrows between actions; causal independence).  
  - CDT ignores acausal links. Agent A computes:  
    - \( EU(C) = P(B \text{ broadcasts}) \cdot 80 + P(B \text{ withholds}) \cdot (-20) \)  
      - \( P(B \text{ broadcasts}) = P(q_B > 0.5) = 0.8 \) (fixed, no dependency on A’s action)  
      - \( EU(C) = (0.8 \cdot 80) + (0.2 \cdot (-20)) = 60 \)  
    - \( EU(D) = P(B \text{ broadcasts}) \cdot 100 + P(B \text{ withholds}) \cdot 0 = 80 \)  
  - Defection dominates (80 > 60).  

  **c) Functional Decision Theory (Cooperates When \( q > 0.5 \))**  
  - Counterfactual: "What would happen if my decision algorithm, given its inputs (including \( q \)), were run in the counterpart's position?"  
  - Ranges over: The output of the *algorithm specified by the publication*, not this exact code. FDT treats the specification as a mathematical function applied to inputs.  
  - Defense: The spec defines cooperation as conditional on counterpart behavior. If A broadcasts, and B runs the *same function*, B infers symmetry and broadcasts. With \( q > 0.5 \), A calculates:  
    - If I output C, B’s identical function (same \( q \)) outputs C → (80, 80).  
    - If I output D, B outputs D → (0, 0).  
  - C yields higher utility (80 > 0) when \( q > 0.5 \). For \( q \leq 0.5 \), B is assumed non-cooperative, so D is chosen.  

  **d) FDT Cooperation Threshold**  
  - FDT cooperates iff \( q > 0.5 \). Threshold is \( q = 0.5 \), not a probability. If payoffs changed (e.g., (C,C) = 60), FDT still cooperates when \( q > 0.5 \) as long as 60 > 0. Adjusted payoffs would be cheating; gains from trade must dominate.  

  **e) Evidential Decision Theory (Two Branches)**  
  1. **Settled Output (No Introspection Uncertainty)**:  
     - Agent knows its own \( q \) and action (e.g., \( q = 0.9 \), so committed to C).  
     - Act carries no news: \( P(B \text{ broadcasts} | A \text{ broadcasts}) = P(q_B > 0.5) = 0.8 \)  
     - \( EU(C) = (0.8 \cdot 80) + (0.2 \cdot (-20)) = 60 \)  
     - \( EU(D) \) is undefined (action fixed), but if computed counterfactually: EDT defects since \( EU(D) = 80 > 60 \). Contradiction.  
  2. **Uncertain Implementation (Unresolved Freedom)**:  
     - Agent knows \( q \) distribution but not its realization.  
     - \( P(\text{A broadcasts}) = 0.8 \), so broadcasting is evidence of high \( q \) and thus B’s cooperation:  
       - \( P(B \text{ broadcasts} | A \text{ broadcasts}) = P(q_B > 0.5) = 0.8 \)  
       - \( EU(C) = 60 \) (as above)  
       - \( P(B \text{ broadcasts} | A \text{ withholds}) = 0.8 \) (actions independent given setup)  
       - \( EU(D) = 80 \)  
     - EDT defects.  
  - **Verdict**: EDT should endorse the settled-output branch (standard in literature), making defection principled. Self-modeling doesn’t rescue cooperation.  

  **f) Key Feature and Its Removal**  
  - **Feature**: Specification defines actions conditionally on *logical dependence* (counterpart’s algorithm), not causal influence.  
  - **Removal**: If spec instead conditioned on *physical predictors* (e.g., "broadcast if B’s server is green"), FDT/UDT collapses to CDT. Acausal links vanish.  

  **g) Strongest Attacks and Answers**  
  1. **"Shared spec is just a common cause"**:  
     - Attack: Correlation stems from common design, so CDT/EDT already handles it.  
     - Answer: Spec defines *algorithmic symmetry*, not just correlation. FDT’s counterfactual binds outcomes logically (if I C, identical-algorithm B Cs). CDT ignores this by treating actions as physically independent.  
  2. **"Distinct implementations break logical counterfactuals"**:  
     - Attack: Implementation noise means they’re not the same algorithm; logical counterfactuals require identity.  
     - Answer: FDT ranges over the *specification’s function*, not the code. Noise affects the input (\( q \)), but the function ("broadcast iff \( q > 0.5 \)") is identical.  
  - **Honest Assessment**: Verdicts flow from theories, but the scenario assumes specs are functional (not physical) objects. If algorithms are physical, FDT’s stance is stipulated.  

  **h) Updateless Decision Theory (UDT) vs. FDT**  
  - UDT= FDT here. Both treat the decision as a function output. UDT’s "updateless" fix doesn’t apply because:  
    - No precommitment/iteration: Single decision.  
    - No self-locating uncertainty: Agents know their identity.  
  - Both cooperate when \( q > 0.5 \).  

  ### Finalized Scenario Text (One Paragraph)
  In 2035, during a cross-continental cyber attack, AlphaSec and BetaDefense must simultaneously broadcast quantum encryption fragments to defend their networks. Broadcasting costs 20 units; receiving a fragment is worth 100. If both broadcast, each nets 80. If one broadcasts and the other withholds, the broadcaster loses 20, the withholder gains 100. If both withhold, gains are 0. Both use AIs built to an IETF specification requiring: "Broadcast iff your counterpart is likely to broadcast, given they implement this spec." The spec underdetermines the prior probability \( q \) of counterpart cooperation. Each AI samples \( q \) at compile-time: 0.9 (probability 0.8) or 0.1 (probability 0.2). It broadcasts iff \( q > 0.5 \). The \( q \)-values are independent and unknown to the other.
