  ### Part 0: Mapping Notes  
  I considered mapping the following features of deductive logic to probability:  
  - **Validity/Invalidity** (binary) → Probability (graded). Set aside as probability is inherently scalar.  
  - **Monotonicity** (adding premises never invalidates) → Non-monotonic in probability due to new evidence.  
  - **Language dependence** (logic requires fixed syntax/semantics) → Probability’s dependence on choice of possibility space. Set aside as it weakens uniqueness.  
  - **Shared premises** (explicit, agreed sentences) → Evidence’s vague, unarticulated nature.  
  - **Truth preservation** (validity ensures truth) → Probability lacks truth-connection without calibration. Set aside as pragmatic.  
  - **Proof methods** (mechanical derivation) → Bayesian updating. Set aside as procedural, not structural.  
  - **Contradiction** (inconsistency) → Dutch book incoherence. Retained.  
  - **Necessity** (validity is necessary truth) → Probability’s contingency on evidence. Set aside.  
  - **Universality** (logic applies universally) → Probability’s context-sensitivity. Set aside.  
  - **Completeness** (systems like FOL are complete) → Probability’s incompleteness under ambiguity. Set aside.  

  Unpromising mappings: Truth preservation (probability is not truth-apt), universality (evidence is local), necessity (probabilities are contingent).  

  ### Part 1: Correspondence Table  

  | logic_feature             | probability_feature         | holds   | imports                              | load_bearing |  
  |---------------------------|-----------------------------|---------|--------------------------------------|--------------|  
  | Validity                  | Coherence                   | partial | Logical necessity                    | no           |  
  | Contradiction             | Dutch-book incoherence      | exact   | Inconsistency as avoidable error     | no           |  
  | Premises                  | Total evidence              | fails   | Evidence as atomic, shared sentences | yes          |  
  | Entailment relation       | Conditional probability     | partial | Unique evidential support            | yes          |  
  | Monotonicity              | N/A (non-monotonic)         | fails   | Static evidence dynamics             | yes          |  
  | Fixed language            | Chosen possibility space    | fails   | Language as given, not chosen        | yes          |  
  | Unique conclusion         | Unique rational probability | fails   | Determinacy of entailment            | yes          |  
  | Syntax independence       | Measure choice (Carnap)     | fails   | Neutral measure selection            | yes          |  
  | Deductive closure         | Bayesian conditionalization | partial | Belief updating as mechanical        | no           |  

  ### Part 2: Audit  

  #### Disanalogies Damaging vs. Cosmetic  
  The disanalogies genuinely damaging to **uniqueness** are:  
  - **(a) Language dependence**: Entailment requires a fixed formal language, but probability requires choosing a possibility space and measure (e.g., Carnap’s confirmation functions). Uniqueness collapses if multiple measures (e.g., uniform vs. biased priors) fit the evidence. Logic’s syntax is fixed; probability’s "language" is not.  
  - **(b) Non-monotonicity**: Deductive logic is monotonic (adding premises never invalidates), but evidential support is non-monotonic (new evidence can lower probability). The analogy must treat probability as non-monotonic logic, which often permits multiple coherent updates, undermining uniqueness.  
  - **(c) Evidence articulation**: Logic premises are shared, atomic sentences. Evidence is holistic and pre-articulated; different propositional carvings (e.g., modeling corrosion as one variable or ten) yield different probabilities. No logical counterpart exists, and uniqueness assumes evidence is univocal.  

  Cosmetic disanalogies include Dutch-book coherence (exact but not unique to single cases) and deductive closure (partial but not uniqueness-critical).  

  #### Smuggled Features and Missing Counterparts  
  - **Smuggled**: Logic’s *determinacy of entailment* (premises uniquely fix conclusions) is imported. Probability lacks this: the same evidence can justify multiple priors or likelihood models.  
  - **Missing from source**: *Evidential weight*. Probability depends on how evidence is modeled (e.g., granularity of variables), which has no logical analogue. The analogy needs this fixed, but logic assumes it is given.  

  #### Survival of Conclusions  
  - **Uniqueness (Conclusion 3,5)**: **Fails** due to language dependence and non-monotonicity. Evidence underdetermines the measure and model choice, permitting multiple "rational" numbers.  
  - **Single-case objectivity (Conclusion 2,4)**: **Survives weakened**. Coherence (avoiding Dutch books) is objective like avoiding contradiction, but it only demands consistency, not uniqueness. Objective Bayesianism (e.g., maxent) might constrain further but isn’t logically enforced.  

  #### Addressing Specifics  
  - **(d) Success criteria**: Logic has no external validation (validity ≠ truth), but probability is often graded by calibration (long-run frequency) or scoring rules. The analogy excludes this, but if included, it smuggles in frequentism. This delimits, not refutes, the analogy: it shows probability has dual roles (consistency vs. accuracy).  
  - **(e) Propensity vs. Logic analogy**:  
    - **Propensity**: Delivers physical single-case objectivity (e.g., barrier’s *intrinsic* failure tendency). Fails on epistemic access (we infer from evidence, not direct measurement) and ambiguity in defining the "setup."  
    - **Logic-as-entailment**: Delivers epistemic objectivity (coherence given evidence). Fails on uniqueness and physical grounding.  
    **Comparative verdict**: Propensity better handles *physical* single-case objectivity (e.g., the glass’s fragility), but logic better handles *epistemic* constraints. For the board’s task (evidence-based number), logic’s coherence is more relevant but insufficient for uniqueness.  

  #### Claims Survival  
  - Survives: (1) Probability as logic-like (coherence as minimal rationality). (4) Dutch books ≈ contradiction.  
  - Collapses: (2) Absence of repetitions irrelevant (but language choice matters more). (3) Uniqueness. (5) Reject scoring (coherence doesn’t ensure calibration).  

  #### Better Analogy  
  A **constraint-based optimization** analogy (e.g., maximizing entropy subject to evidence) does better. It accepts underdetermination but selects a unique number via pragmatic rules, acknowledging this as an epistemic tool, not logical entailment.  

