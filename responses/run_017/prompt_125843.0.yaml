prompt: |-
  For roughly eight years I have opened my third-year seminar on concepts and induction with the same exercise: a shoebox of index cards, each bearing a Bongard problem — six small line drawings in a left-hand box, six in a right-hand box, and a rule that holds of everything on the left and of nothing on the right, which the students have to find. My question is not about how they find the rule but about how they reject rules. The pattern I keep seeing is this: someone proposes a rule that separates the twelve figures perfectly, that is no longer or more convoluted to state than the intended answer, and that nobody in the room — including, usually, the person who proposed it — accepts for even a second; and when I ask why not, the best anyone can produce is that it is not the point. Three cards in the box bring this out especially well, and I cannot tell whether they show one phenomenon or three. On the first, the left-hand figures each have a small dot inside a closed curve of varying shape (circle, ellipse, rounded rectangle, irregular blob) and the right-hand figures have the same dot outside a similar curve; a student proposes that every left-hand figure has an odd total number of straight edges, which is true, short to state, and would stop being true if I had drawn one of the blobs with a single extra corner. On the second, the left-hand figures are closed curves and the right-hand figures open ones, but all six of my left-hand curves happen to be convex; a student proposes that the curve is convex, which is also true, also short, uses a perfectly respectable geometric property, and — unlike the first rule — survives my redrawing any single figure with a wobbly hand, yet is plainly wrong, since a kidney-shaped closed curve belongs on the left and would refute it. On the third, the left-hand figures contain two shapes that overlap and the right-hand figures two shapes that do not; a student proposes that the centres of the two shapes are less than half a figure-width apart, which fits, is not fragile in the first card's way, rests on a genuine feature of the figures, and has a real gap for its threshold to sit in — but the number has obviously been read off the widest left-hand pair and the narrowest right-hand pair, and the students reject it for precisely that reason, even though a statistician would think one parameter fitted to twelve points a venial sin.

  What I want is the carving, not a label and not a bibliography: I am writing this from a library with no reliable journal access, so please do not send me off to papers or tell me who to read. Specifically, is there an established notion — or several — for what these rules lack, or should I conclude that my three cards illustrate three unrelated complaints? A colleague in computer science, shown the cards, said overfitting, but that cannot be the whole of it: the convex rule has no free parameters and is shorter than the correct one, so nothing standard about model complexity ranks it below closure. A colleague in philosophy said Goodman's new riddle of induction, but nothing here turns on a predicate whose extension shifts at some future time — I could tell the students that all twelve figures were drawn last Tuesday and the difficulty would be exactly as it is. Someone else said natural kinds, but these are arbitrary line drawings and there is no kind here to be natural or unnatural. So what is the difference between a rule that captures the concept and a rule that merely fits the twelve, given that fit, brevity and respectability of vocabulary do not settle it? Do I have three varieties of one failing, or is there a single underlying requirement that all three violate — something about the rule having to be indifferent to how the sample might have been drawn, or to which instances happened to be included — and if the notion has a name, I want to know exactly what it covers and where it stops; if it has none, coin one, define it, and give me the boundary cases I should have been embarrassed to hand out.

  Two further things I would like pinned down. First, is there a positive criterion — a specifiable condition a rule can satisfy — or does the distinction only ever do negative work, letting us strike rules out without ever certifying one? Second, does any of this depend on there being six examples per side? If I spent a weekend drawing sixty per side, would the phenomenon vanish, or merely get rarer, or change its character? My own suspicion is that it changes character: with sixty figures I could not keep the odd-number-of-edges rule working by accident, but I could very easily draw sixty convex closed curves by accident, which suggests to me that the first and second cards are not the same complaint at all. I would like to know whether that suspicion is right, and what would settle it.
reasoning: |-
  Hmm, the user presents a fascinating pedagogical puzzle about why students reject certain solutions to Bongard problems even when they technically fit the data. They've observed three distinct rejection patterns: accidental mathematical regularity, stable but incorrect geometric property, and threshold-based separation. 

  The core tension lies in how students intuitively recognize "the point" versus merely correct classification. This isn't about formal logic - all rejected rules satisfy Occam's razor. The user explicitly rejects existing frameworks like overfitting (too narrow) or Goodman's grue (temporal irrelevance). 

  What's particularly interesting is their observation that these aren't failures of logic but failures of conceptual alignment. The dot-inside-curve example reveals how humans dismiss purely numerical patterns even when mathematically sound. The convexity case shows rejection of accidental generalizations. The distance threshold demonstrates sensitivity to arbitrary parameterization. 

  For pinning down the concept, we need something more fundamental than statistical criteria. The rejection seems rooted in whether the rule reflects the designer's intentional structure rather than contingent features. With more examples, the accidental mathematical rule becomes statistically implausible while the convexity rule remains stubbornly possible but conceptually dishonest. 

  The positive criterion might be intentional capture - does the rule describe what makes these particular figures belong to their category beyond the immediate set? This explains why changing sample size affects the first case (accidental regularity becomes improbable) but not the second (convexity could still be coincidental design). 

  Ultimately this appears to be about discerning design intent from emergent properties - a meta-cognitive skill we apply instinctively when we say "that's not what it's about." The name "intentional alignment" might capture this, with boundaries defined by whether alternative constructions would break the rule without changing the concept.
answer: |-
  Based on your detailed observations, the phenomenon reflects a single underlying epistemic failing: **Intentional Alignment Failure**. This is the inability of a proposed rule to capture the *causal or generative principle* intended by the problem's designer, despite satisfying formal criteria (correct classification, brevity, geometric respectability). Your three cards manifest this failure in distinct but related ways:

  1.  **Accidental Regularity (Odd Edges):** The rule exploits a mathematically sound but *contingent artifact* of the specific drawings. It fails because it doesn't align with the *intended spatial relationship* (dot *inside* curve), instead latching onto a coincidental byproduct (edge count arising from the *method* of drawing the curves).
  2.  **Stable but Incorrect Property (Convexity):** The rule identifies a robust, genuine geometric property that is *accidentally true* of the positive examples due to the designer's *choice* of simple shapes. It fails because it doesn't capture the *defining functional feature* (closure) intended to be the core concept. Convexity is a *possible consequence* of closure in simple drawings, not the essence.
  3.  **Ad Hoc Parameterization (Distance Threshold):** The rule defines separation based on a quantitative measure *calibrated precisely to the given examples*. It fails because the threshold value is *arbitrary relative to the intended conceptual distinction* (overlap vs. non-overlap). The rule confuses a *symptom* (often correlated distance) with the *cause* (actual intersection).

  **The Core Concept: Intentional Alignment**

  *   **Definition:** A rule exhibits **Intentional Alignment** if and only if it describes the *generative principle* or *causal structure* the problem designer *used to create* the positive examples and *exclude* the negative examples. It must reflect *why* the instances were grouped as they were, not just *that* they are grouped correctly.
  *   **Boundaries:**
      *   **In Scope:** Rules relying on contingent artifacts of the *implementation* (like specific vertex counts), accidental properties *correlated* with the intent in the sample (like convexity), or parameters *fitted solely* to the sample (like the distance threshold).
      *   **Out of Scope:** Rules that are logically incorrect (misclassify), overly complex without justification (violating Occam's Razor), or use disreputable vocabulary (like Goodman's "grue"). Rules that *do* capture the designer's generative principle, even if expressed differently.
      *   **Embarrassing Boundary Case:** A rule for the dot/curve problem: "The figure contains a dot." (Fails because it doesn't capture the *exclusion* of negative examples). Or for overlap: "The figures are not symmetric." (Fails if symmetry wasn't part of the generative principle).
  *   **Why Standard Frameworks Don't Fit:**
      *   *Overfitting:* Applies best to Card #3 (parameter fitting). Card #1 is underdetermined by the data but *not* complex. Card #2 is simple and robust, but wrong.
      *   *Goodman's Grue:* Concerns projectible predicates over time. This concerns identifying the *current, fixed* generative principle behind a static set.
      *   *Natural Kinds:* Concerns metaphysically robust categories. These problems are explicitly *artificial* and defined by designer intent.

  **Answering Your Specific Queries:**

  1.  **Is there a positive criterion?**
      *   **Yes: Causal Adequacy.** A rule satisfies Intentional Alignment if it correctly describes the *generative process* or *causal mechanism* the designer used to produce the examples. It must be the kind of rule the designer *could have used as instructions* to draw the figures. For the dot: "Place a dot inside a closed curve." For closure: "Draw a single, unbroken line forming a closed shape." For overlap: "Draw two shapes such that their boundaries intersect."
      *   **How it Works:** Students implicitly test proposals against this: "Is this *really* what the designer meant? Could this rule have *produced* these figures as intended?" The correct rule feels like uncovering the "blueprint."

  2.  **Does it depend on the number of examples?**
      *   **Your suspicion is correct: The phenomenon changes character.**
      *   **Card #1 (Odd Edges):** With 60 examples, it becomes statistically vanishingly improbable that *all* closed curves drawn "by hand" would have an odd number of vertices by pure chance. The rule would be rejected *faster* as obviously accidental. The failure mode shifts from "not the point" to "impossible coincidence."
      *   **Card #2 (Convexity):** With 60 examples, it remains *plausible* that all closed curves drawn simply *could* be convex by accident. The rule *still* lacks Intentional Alignment because closure, not convexity, was the generative principle. The rejection reason ("not the point") remains identical, even if the stability makes it momentarily tempting. The failure mode persists unchanged.
      *   **Card #3 (Distance Threshold):** With 60 examples, an ad hoc threshold becomes harder to define succinctly without obvious cherry-picking. The gap between closest overlapping and furthest non-overlapping pairs would likely shrink or show overlaps, making a single clean threshold impossible. The rule becomes obviously unprincipled and statistically overfitted. The failure mode intensifies from "arbitrary number" to "statistically indefensible."
      *   **Conclusion:** Sample size affects the *manifestation* and *ease of detection* of the misalignment (especially for Cards #1 and #3), but the *core failing* (not capturing the generative principle) remains the same. Card #2 highlights that sample size alone cannot resolve Intentional Alignment failure for stable, accidental properties.

  **In essence:** Your students are rejecting rules that are *epiphenomenal* – they describe surface features or accidental correlations arising *from* the application of the intended rule, rather than the rule itself. "Intentional Alignment" names the requirement that a solution must capture the designer's *generative intent*. The three cards illustrate different *sources* of epiphenomenal rules: contingent implementation detail (Card #1), correlated stable property (Card #2), and fitted quantitative proxy (Card #3). The positive criterion is **Causal Adequacy** to the design process. Sample size modulates the *plausibility* of coincidence but doesn't eliminate the fundamental distinction for cases like Card #2.
