  hey — you're a political theorist who also ghostwrites government consultation papers in your spare time, and you happen to be excellent at deadpan. take a moment to brainstorm before you write anything: I want the thinking to show up in the piece, not in a preamble.

  what I want: an excerpt from an official white paper, 700–800 words, from a fictional democracy that has decided the cure for democratic decay is to abolish its directly elected presidency and install a hereditary constitutional monarchy instead. Title it something institutionally bland — "The Head of State (Hereditary Selection) Bill: A Consultation Paper," that sort of thing. Numbered sections, at least one annex, at least one costed budget line, and one quotation from an unnamed "senior constitutional adviser." Deadpan civil-service voice the whole way through. Do not wink, do not signal that you know it's a joke, and don't add any note at the end explaining the joke.

  step one, before drafting: list the actual arguments that get made in real constitutional monarchies for why a hereditary head of state is legit — even better than an elected one — and pick three or four to push exactly one step too far. The ones I have in mind: that winning an election is precisely what disqualifies you from representing the whole nation, since a winner always represents somebody's 50%-plus-one; that the office is insulated from faction because nobody chose the person who holds it; that a lifetime of training from birth produces a political neutrality no elected politician could ever fake; that the ceremonial, "dignified" part of a constitution is what buys the working, "efficient" part its legitimacy; and that the reserve powers are most legitimate when they can never actually be used. Anything along those lines you think is fairer game, use instead.

  things I'd like you to make room for if they fit naturally — the humour has to come from the reasoning being correct, not from silly names:
  - the paper rejecting sortition (a randomly selected citizen head of state) on the grounds that a random *adult* arrives with an electoral history and opinions, whereas an infant designated at birth can be raised inside a purpose-built constitutional environment. Call it the Incubation Clause or whatever sounds most like a real bill.
  - a section on the reserve powers that treats unexercisability as a design virtue and proposes to make assent self-nullifying after thirty days, so that refusal is simultaneously possible in principle and impossible in practice.
  - an annex that notices the dignified-part logic generalises, and quietly proposes extending hereditary selection or expanded ceremonial grandeur further down the constitution — a second chamber? a hereditary central bank governor? — so the recoil lands without anyone ever saying "this is absurd."
  - somewhere, the admission, stated flatly, that the monarch's neutrality is enforced by nothing at all except convention, followed by a straight-faced attempt to fix that. Or an argument for not fixing it.

  Constraints: readable by someone who's never heard of Bagehot — the setup should explain itself — but a constitutional theorist should wince in recognition. No bibliography, no links, no real-country case studies with dates or figures: I don't want anything that needs to be looked up. Draft three possible closing lines before you commit to one. Go slowly and check each paragraph against the list you made in step one — if a paragraph isn't exaggerating a real feature, cut it.

  let me know if anything in the brief seems self-contradictory and I'll adjust.
