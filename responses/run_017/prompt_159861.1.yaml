prompt: |-
  I write about science and ideas for a British paper, mostly consciousness and AI stuff these days, and there's a move I keep bumping into in arguments among the integrated-information crowd and their critics that I don't have a word for. It's starting to feel like the thing that actually decides these arguments, rather than anything in the theory itself.

  Two examples, both from interviews in the last year or so. First: I put to a theorist the objection I'd read about, that by their own mathematics some huge but totally uniform grid of connected elements scores higher than a human brain, which is obviously daft. The answer was that I'd described the thing at the wrong zoom level — sure, at the level of the individual elements there's a lot going on, but at the level of what the whole thing does, there's nothing to speak of. Fine, I thought. Then a critic pointed at a brain region with vastly more neurons than the bits everyone agrees are conscious, and nobody thinks it's conscious; the theorist said, look at the wiring, the connections mostly run one way and are boxed into separate modules, so nothing is genuinely joined up at the scale that matters. And the critic said: you picked the wiring diagram, and the timescale, that gives you that verdict.

  That's the pattern. In every case the re-description arrives after you already know which answer you want, and nobody ever says up front which level of description the theory is supposed to be read at — which elements count as parts, what timescale, which wiring diagram. Each individual re-description is perfectly defensible on its own, in the way that each exception bolted onto a bad theory is defensible on its own, so I don't think "unfalsifiable" is quite it. And it isn't quite the ordinary underdetermination-of-theory-by-data thing either, because here what's shifting isn't the data but the description of the object the theory is being applied to.

  So: does this have a name? Is there an established concept for the problem, or for the debating move, or for both separately — and if the nearest thing is a technical term inside one theory, tell me what that term covers and how what I've described is wider or narrower than it. If it's really just an instance of something general to do with levels of description in complex systems, say which, and say where the fit breaks down. If there's nothing established, coin a term and define it properly, with a couple of boundary cases, including something that looks like this but isn't — I want to know when re-describing a system is the right move rather than a dodgy one. A bare label won't do me any good; I need to know what the thing is, what it isn't, and where its edges are, because I'm going to have to explain it to readers who've never heard of any of this.

  One last thing, since I'll be quoting you or at least leaning on you: be clear about how confident you are. Tell me which parts are vocabulary you'd actually defend as established and which are your own coinage, and tell me what would change your mind — what argument or consideration would make you say "no, that's really just X", or "no, there's no such phenomenon".
reasoning: |-
  Okay, the user is a science writer focusing on consciousness and AI for a British paper. They've noticed a recurring pattern in debates around Integrated Information Theory (IIT) where theorists and critics keep shifting the level of description—like zoom levels or timescales—to defend their positions. They want to know if there's a name for this maneuver, or if it's a new concept that needs labeling. 

  First, I need to unpack their examples. In the first case, a uniform grid scores high on IIT's metrics, but the theorist says it's described at the wrong "zoom level." Then a critic points to a brain region with many neurons but no consciousness, and the theorist shifts to wiring diagrams and timescales to dismiss it. The user feels this re-description happens after the desired answer is known, and it's not upfront about which level matters. 

  The user rejects "unfalsifiable" as too broad and distinguishes this from underdetermination because it's about re-describing the system, not the data. They need a precise term, boundaries to avoid misapplication, and clarity on when re-description is valid vs. dodgy. They also want confidence levels—what's established vs. coined—and what would change my view.

  Hmm. Let me scan philosophy of science and complex systems for concepts. "Scale relativity" from complexity science comes to mind—how phenomena change across scales—but it's descriptive, not critical. "Reification" is close but targets treating abstractions as real, not level-shifting. "Level-of-description problem" is established in cognitive science (e.g., Marr's levels), but it's neutral, not weaponized. 

  The debate move feels like a mix of cherry-picking and goalpost-moving, but neither fits perfectly. Cherry-picking selects favorable data; here, it's reframing the system's description. Goalpost-moving changes criteria mid-debate, but this is subtler—it's about redefining the object of analysis. 

  I recall "temporal and spatial scale arbitrariness" from ecology or systems theory, but it's not a named fallacy. The closest might be "equivocation on descriptive granularity," borrowing from logic's equivocation fallacy. But that's clunky. 

  Perhaps coin a term? "Descriptive level gerrymandering" captures redrawing boundaries to suit an outcome, like political gerrymandering. Or "scale-flexible ad hoc exemption," emphasizing post hoc adjustments. But "gerrymandering" has intuitive grip. 

  For boundaries: Valid re-description happens when scales are theoretically principled upfront (e.g., physics defining relevant scales for phase transitions). Dodgy when scales shift reactively without independent justification. 

  Confidence: "Level-of-description problem" is 90% established; "gerrymandering" is my coinage (60% confidence—might stick if it resonates). Change my mind if someone shows IIT has fixed scales or if critics use the same move symmetrically without critique. 

  User's depth suggests they'll push back, so I'll preempt: distinguish this from "emergence" (which is ontological) and "reductionism" (methodological). Example that looks similar but isn't: Choosing computational vs. algorithmic levels in AI design is principled, not reactive. 

  Final term: "Descriptive scale gerrymandering." Define, contrast, boundaries. Offer "level-stacking" or "granularity grifting" as alternatives but endorse "gerrymandering" for rhetorical bite. Stress that the problem isn't levels themselves but their strategic deployment.
answer: |-
  Based on your description, this is a nuanced but recognizable phenomenon in foundational debates about theories of consciousness (especially IIT). It sits at the intersection of several established concepts but doesn't have a single, universally accepted name. I'll break it down, provide terminology (both established and coined), define boundaries, and assess confidence.

  ### The Core Phenomenon: "Descriptive Scale Gerrymandering" (Coined Term)
  *   **Definition:** The strategic, post-hoc selection of a specific spatiotemporal scale, functional granularity, or representational framework for describing a system, where the *primary justification* for selecting *that particular scale/granularity/framework* is its ability to yield the desired theoretical outcome (e.g., high/low Φ for IIT, conscious/unconscious verdict) for a specific case, rather than being derived from or constrained by independent, foundational principles of the theory itself.
  *   **Why "Gerrymandering"?** Like political gerrymandering, it involves redrawing boundaries (here, the boundaries defining the "system" or its relevant "parts") to achieve a predetermined result. The move isn't inherently invalid, but its *motivation* and *lack of prior constraint* make it suspect.
  *   **The Problem:** It creates a *moving target* for the theory. The theory isn't falsified by counterexamples because the definition of the object of analysis can be retrofitted to avoid the counterexample, without clear, objective rules dictating *which* scale/granularity/framework *must* be chosen *before* the verdict is known.

  ### Established Concepts & How They Fit/Don't Fit
  1.  **Level/Scale of Description Problem (Established - High Confidence):**
      *   **What it is:** A fundamental issue in complex systems science, cognitive science, and philosophy. Complex systems exhibit different properties and behaviors at different scales (spatial: quarks -> atoms -> molecules -> cells...; temporal: nanoseconds -> milliseconds -> seconds...; functional: transistors -> logic gates -> CPUs...). No single "correct" level exists; the appropriate level depends on the question.
      *   **Relation:** This is the *substrate* upon which gerrymandering operates. Gerrymandering *exploits* the inherent legitimacy of choosing levels by doing so arbitrarily to favor a desired outcome.
      *   **Fit Breakdown:** The established concept acknowledges the necessity of choice but doesn't inherently critique the *motivation* or *method* of choosing. Gerrymandering is the *adversarial misuse* of this necessity.

  2.  **Marr's Levels of Analysis (Established - High Confidence):**
      *   **What it is:** David Marr proposed three levels for understanding information processing systems: Computational (What is computed? Why?), Algorithmic (How is it computed? Representations & processes), Implementational (Physical realization).
      *   **Relation:** Highlights that different questions require descriptions at different levels. Gerrymandering could occur *within* a level (e.g., choosing *which* implementational scale) or involve *shifting* levels (e.g., appealing to the computational level to override an implementational counterexample).
      *   **Fit Breakdown:** Marr's levels are distinct and complementary. Gerrymandering is about arbitrariness *within* a level type (especially implementational) or *inconsistent* shifting between them depending on the case.

  3.  **Ad Hoc Modification / Immunization Strategy (Established - Medium Confidence - Philosophy of Science):**
      *   **What it is:** Modifying a theory specifically to evade a falsifying observation, without independent justification or increased predictive power.
      *   **Relation:** Gerrymandering *is* a form of ad hoc modification. The "modification" is the new scale/granularity chosen for *this specific case*. Its ad hoc nature stems from lacking prior definition within the theory.
      *   **Fit Breakdown:** Standard ad hoc modifications often involve adding new parameters or auxiliary hypotheses *to the theory itself*. Gerrymandering modifies the *description of the specific system* the theory is applied to, while the core equations (e.g., Φ calculus) remain unchanged. It's ad hoc *system description* rather than ad hoc *theory modification*.

  4.  **Reification Fallacy (Established - Medium Confidence):**
      *   **What it is:** Treating an abstraction, concept, or chosen description level as if it were a concrete, fundamental reality.
      *   **Relation:** Gerrymandering can *depend* on reification. The theorist might act as if their chosen scale (e.g., "the neuronal ensemble level") is *the* ontologically privileged level for consciousness, but only *after* choosing it to get the right answer.
      *   **Fit Breakdown:** Reification is a broader fallacy. Gerrymandering is a specific *tactic* that might employ reification, but the core issue is the *strategic selection* of the level to be (potentially) reified.

  ### Boundary Cases: When is Re-description Valid vs. Dodgy?
  *   **Valid Re-description (Not Gerrymandering):**
      *   **Principled Upfront Definition:** The theory explicitly defines the relevant scale/granularity *in advance* based on its core principles. (E.g., IIT *might* define "elements" as the smallest units with directed causal interactions over a timescale relevant to information integration, and "systems" as maximally irreducible complexes - though its success here is debated).
      *   **Independent Justification:** Changing the scale is driven by new, independently motivated evidence or theoretical development applicable *generally*, not just to save a specific case. (E.g., Neuroimaging reveals a previously unknown functional module; theory updates its scale expectations accordingly).
      *   **Predictive Power:** The re-description leads to novel, testable predictions beyond just salvaging the current case.
      *   **Example:** Arguing that consciousness requires feedback loops and selecting a timescale where feedback occurs (~100-300ms) based on independent neurophysiological evidence (e.g., ERP components, loops in thalamocortical systems). This scale is argued *before* applying it to dubious cases.

  *   **Dodgy Re-description (Gerrymandering - Illustrating the Boundary):**
      *   **Case-Specific Justification:** The *only* or *primary* reason given for choosing scale X is that it makes the theory work for *this specific* counterexample. (As in your examples: "Look at *this* diagram/timescale *for this grid/brain region*").
      *   **Lack of Generality:** The chosen scale isn't derived from or consistently applied based on the theory's core principles. The rules for choosing seem to change depending on what needs to be explained away.
      *   **Post-Hoc Revelation:** The "correct" scale only becomes apparent *after* the counterexample is presented and the desired verdict is known. It wasn't predicted or pre-specified.
      *   **Example:** A critic presents a simple feedforward circuit scoring high Φ. The theorist, wanting it to be unconscious, says, "Ah, but look at the *synaptic* timescale – no integration!" Later, a critic presents a biological system with slow synapses but high Φ in modules. The theorist says, "Ah, but look at the *network oscillation* timescale (~10Hz) – that's where true integration happens!" The choice of timescale appears tailored to the counterexample, not derived from first principles.

  ### What This Isn't (And Why)
  *   **Simple Underdetermination:** Underdetermination means multiple theories fit the same data. Here, it's the *same theory* applied to *differently described versions of the same physical system*. The shift is in the *input* to the theory (system description), not just the theory's interpretation.
  *   **Pure Unfalsifiability:** The theory *could* be falsified *if* the relevant scale/granularity were objectively fixed *in advance*. Gerrymandering *makes* it effectively unfalsifiable by removing that constraint post-hoc, but the mechanism is this specific move.
  *   **Emergence:** Emergence describes novel properties arising at higher levels. The issue here isn't emergence itself, but *how and why a specific emergent level is selectively chosen* to defend the theory against counterexamples.

  ### Confidence Assessment
  *   **High Confidence:** The *phenomenon* you describe is real and recurrent in consciousness debates (IIT especially). The **Level/Scale of Description Problem** is a well-established, fundamental challenge.
  *   **Medium Confidence:** Framing it as an **Immunization Strategy** or involving **Reification** is valid and established in philosophy of science, though slightly less direct than the level problem.
  *   **Lower Confidence (But Defensible):** Coining **"Descriptive Scale Gerrymandering"** is my synthesis. I'm ~70% confident it accurately captures the core adversarial, boundary-redrawing, outcome-oriented nature you pinpoint. Alternatives like "Level-Stacking" or "Granularity Grifting" were considered, but "gerrymandering" best conveys the strategic boundary manipulation. This coinage is defensible but not established.
  *   **What Would Change My Mind:**
      *   If someone demonstrated that IIT (or similar theories) *does* have unambiguous, non-arbitrary, pre-specified rules for choosing scales/granularity *derived solely from its axioms* that successfully handle *all* standard counterexamples without post-hoc adjustments.
      *   If compelling arguments showed that *all* re-description in these debates is demonstrably driven *only* by independent, principle-based justifications, not by the need to defend a pre-ordained verdict.
      *   If critics of IIT were shown to employ *exactly the same* scale-shifting tactic *symmetrically* to dismiss positive cases, and this was the *dominant* pattern (showing it's just how the debate goes, not a specific move by proponents).

  ### For Your Article
  Lead with the **Level/Scale of Description Problem** as the established bedrock. Explain how complex systems *require* choice of scale. Then introduce **Descriptive Scale Gerrymandering** as the specific *debating tactic* where this necessary choice becomes a tool for defending a theory against counterexamples by retroactively selecting the scale that yields the "right" answer. Use your clear examples. Contrast it with valid principled scale selection. The "gerrymandering" metaphor will likely resonate with readers familiar with the term.

  This move isn't unique to consciousness (it can happen in ecology, economics, etc.), but the lack of objective grounding for "consciousness" makes it particularly acute and visible there. It highlights a profound challenge: a theory of consciousness needs not just equations, but a principled way to say *what and when* to count as the system.
