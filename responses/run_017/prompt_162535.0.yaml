prompt: |-
  putting together a short position note on Occam/simplicity stuff for a reading group and I want someone to stress-test it before I send it round. Here's roughly where I've landed:

  1. The right normative ideal for induction is Solomonoff's universal mixture — prior weight 2^-K(h) over computable hypotheses, where K is Kolmogorov complexity.
  2. Occam's razor isn't a seperate epistemic norm sitting on top of Bayesianism. It's just what falls out when you conditionalise on that prior. There's no extra "nature is simple" principle doing any work.
  3. The reference-machine / programming-language dependence of K is a non-issue: by the invariance theorem two machines give complexities differing by a constant that doesn't depend on the object, so it washes out.
  4. Uncomputability of the prior isn't decisive either. Normative ideals don't have to be implementable, and in practice we approximate anyway with MDL and actual compressors.
  5. What gives the razor its teeth is the convergence/dominance result: the mixture converges on any computable source and beats every computable predictor, with the total error bounded by something proportional to K of the true source.
  6. I dont think we have any a priori reason to believe the world is simple, and I don't want the razor to lean on one.
  7. I'm also a subjectivist about priors in general: coherence is the only rational constraint, no particular prior is mandated.
  8. Two verdicts: (i) 20 data points, a 3-parameter fit versus a 10-parameter fit that fits the data better — I take the 3-parameter one, and I'd take it even in a domain I knew nothing about; (ii) simplicity is a guide to which theory is true, not merely to what to predict next.
  9. The objection that penalising parameters on top of the likelihood double-counts fit strikes me as confused.

  Does this hang together? I'd like an audit rather than a lecture: which pairs genuinely pull against each other, which only look like they do, ordered by how severe the clash is, and for each real one what the cheapest repair would be and what it costs me elsewhere in the set. Please say which commitment has to go given the others rather than just listing options.
reasoning: |-
  Okay, let me start by understanding what the user is asking. They've put together a position note on Occam's razor and Solomonoff induction for a reading group and want it stress-tested. The main points are listed, and they want an audit focusing on internal coherence, not a lecture. They specifically want to know which points conflict, how severe the conflicts are, and what the cheapest fixes are that require minimal changes elsewhere.

  First, I need to parse each of their 9 points. Point 1 sets Solomonoff's universal mixture as the normative ideal. Point 2 says Occam's razor emerges from this prior, no separate "nature is simple" principle. Point 3 addresses invariance of Kolmogorov complexity. Point 4 dismisses uncomputability as non-decisive. Point 5 highlights convergence results. Point 6 rejects a priori simplicity beliefs. Point 7 claims subjectivism about priors. Points 8 gives verdicts on parameter fits and simplicity's role. Point 9 dismisses double-counting objections.

  Looking for tensions. Point 7 (subjectivism) seems to clash with Point 1 (Solomonoff as the right normative ideal). If coherence is the only constraint, why mandate Solomonoff? That's a big conflict. Also, Point 8's verdicts suggest a strong preference for simplicity regardless of domain, which might not align with subjective priors. 

  Another possible tension: Point 6 rejects a priori simplicity, but Solomonoff's prior inherently favors simpler hypotheses. The user argues it's not assuming nature is simple, but the convergence theorems depend on the true source being computable. If the world isn't computable, Solomonoff might not work. That could be a hidden assumption.

  Point 4 says uncomputability isn't decisive because normative ideals don't need to be implementable. But in Point 8(ii), claiming simplicity guides truth might be problematic if we can't compute the prior. How do we know it's truth-tracking if we can't apply it?

  Also, Point 9's dismissal of the double-counting objection needs scrutiny. The user thinks it's confused, but maybe there's merit to the concern that penalizing parameters beyond likelihood could be redundant.

  Priorities: The subjectivism vs. Solomonoff mandate (Points 7 and 1) is the biggest clash. Fixing it requires either dropping subjectivism or reframing Solomonoff as a coherence requirement. The cheapest fix might be to present Solomonoff as an extension of coherence via Turing machines, but that might not satisfy hard subjectivists.

  Next, the convergence theorem's reliance on computability (Point 5) versus no a priori simplicity (Point 6). The user might need to acknowledge that computability is an assumption, but argue it's minimal. The cost is admitting a weak a priori commitment, which conflicts with Point 6.

  For Point 8(i), taking the 3-parameter model without domain knowledge might contradict subjectivism. If priors are subjective, why prefer simplicity without context? The user could argue that Solomonoff is the default prior, so it applies universally. But that circles back to the first conflict.

  The double-counting objection (Point 9): The user's stance might hold if Solomonoff's prior incorporates both fit and complexity inherently, so it's not an extra penalty. But critics might still see it as arbitrary without the subjectivist foundation.

  Overall, the main issues are the mandate of Solomonoff conflicting with subjectivism, and the implicit computability assumption. The user needs to decide whether to soften subjectivism or reframe Solomonoff as a consequence of coherence. Also, clarifying that computability is a necessary framework without claiming nature is simple could resolve the tension with Point 6.
answer: |-
  Here's an audit of your position note, identifying genuine tensions (ordered by severity), potential repairs, and their costs. I focus on internal coherence per your request.

  ### **Severe Tension: Points 1, 7, and 8**  
  - **Conflict**: Point 1 (Solomonoff as *the* right normative ideal) directly contradicts Point 7 (subjectivism: "no particular prior is mandated"). Point 8(i) further entrenches this by claiming you'd *always* prefer simpler models (e.g., 3 vs. 10 parameters) even in unknown domains. Subjectivism forbids mandating *any* prior—including Solomonoff.  
  - **Cheapest Repair**: **Drop Point 7’s strong subjectivism**. Reframe Solomonoff not as *the* rational prior but as *a uniquely compelling one* due to its dominance properties (Point 5).  
  - **Cost**: You lose pure subjectivist grounding. Now you must argue that dominance/convergence (Point 5) *is* a rational constraint beyond coherence. Bayesians may push back, but it’s a defensible move.  
  - *Alternative (worse)*: Weaken Point 1 to "Solomonoff is a *plausible* ideal" and Point 8(i) to "I’d take the 3-parameter model *if using Solomonoff*". But this guts your core argument.  

  ### **Moderate Tension: Points 6 and 5**  
  - **Conflict**: Point 6 rejects *any* a priori belief in simplicity, but Point 5’s dominance theorem **assumes the true source is computable**. If the world is uncomputable (e.g., hypercomputational physics), Solomonoff fails to converge. This implicitly assumes the universe *is* computable—a weak form of a priori simplicity.  
  - **Cheapest Repair**: **Clarify that computability is a minimal epistemic commitment**. Argue that rejecting it makes induction impossible *anyway* (e.g., no predictor can handle uncomputable sequences).  
  - **Cost**: Admits a thin a priori assumption ("the world is describable by computations"), conflicting with Point 6’s strict rejection. But it’s arguably unavoidable for *any* formal theory of induction.  

  ### **Mild Tension: Points 2 and 8(ii)**  
  - **Conflict**: Point 2 says Occam’s razor *only* reflects Bayesian updating under Solomonoff, not a "guide to truth." But Point 8(ii) claims simplicity *is* a guide to "which theory is true." If truth-tracking requires convergence (Point 5), this only holds *asymptotically*. For finite data, simplicity merely minimizes prediction error—it doesn’t guarantee truth (e.g., a simple false theory may outpredict a complex true one short-term).  
  - **Cheapest Repair**: **Qualify Point 8(ii)** to: "Simplicity is a guide to which theory *is more likely to be true in the limit*."  
  - **Cost**: Weakens the epistemological claim but aligns with Solomonoff’s asymptotic guarantees.  

  ### **Apparent Tensions (Not Genuine)**  
  - **Points 3/4 (invariance/uncomputability) vs. Others**: These are defensive points against common objections. They cohere with your framework—no conflict.  
  - **Point 9 (double-counting)**: Your dismissal holds. Solomonoff integrates fit/complexity into one prior; penalizing complex hypotheses isn’t "extra" but inherent to the measure.  

  ### **Summary of Repairs & Costs**  
  1. **Abandon strong subjectivism (Point 7)** → Repair conflict with 1/8. *Cost*: Loses "coherence-only" high ground; must defend dominance as a rational norm.  
  2. **Admit minimal computability assumption** → Repair conflict between 5/6. *Cost*: Weakens Point 6’s anti-apriorism slightly.  
  3. **Clarify truth-tracking as asymptotic** → Repair conflict between 2/8(ii). *Cost*: Weakens rhetorical force of 8(ii) but adds precision.  

  **Resulting Coherence**: With these repairs, your position is robust. Solomonoff is a *non-subjective* norm justified by dominance (not simplicity assumptions), computability is a necessary framework, and Occam’s razor is purely derived. The only major cost is rejecting subjectivism—but this is necessary to preserve your core claims.  

  **Recommendation**: Explicitly state that dominance/convergence (Point 5) justifies elevating Solomonoff beyond subjective preferences. This bridges Points 1, 5, and 8 without needing "nature is simple."
