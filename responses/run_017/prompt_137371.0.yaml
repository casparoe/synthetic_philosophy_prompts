  - The group might focus on figuring out the mechanism (the card system) rather than the philosophical point.

  - When the target's report is wrong, they might speak up and say "I saw red but the device said blue!" We can allow that, and then in the reveal, we explain that this is exactly the point: when the common cause is broken, the report is not reliable, and the experience is the only way they know it's wrong. But if epiphenomenalism is true, then even if the experience is absent, the report would still be produced, and they would not know.

  - In the betting, the target will bet against themselves on their own report, and they will bet that the target's report is wrong (because they know they are the target). This might be a giveaway, but we can say that the target is the only one who knows for sure that their report was wrong.

  **What the activity cannot reproduce:**

  - The felt certainty of first-person experience: in the activity, the experience is just a color, and the report is generated externally. In real life, the report feels like it comes from us.

  - The intuition that the experience causes the report: in the activity, the report is generated by a device, so it's clear it's not caused by the experience. In real life, we feel that our pain causes us to say "ouch".

  In the debrief, we have to explain that in the epiphenomenalist picture, the brain state causes both the experience and the report, so the report is not caused by the experience.

  **Commitment on the horn:**

  The key horn is the counterfactual insensitivity: if the experience were absent or different, the report would be the same as long as the brain state is the same. This is illustrated in the target's case: the experience was present but the report was different because the brain state for the report was different (but the experience was caused by a different brain state? in our setup, the experience was caused by the color card, which is the upstream cause, and the report by the symbol card. In the brain, it would be the same state causing both. When we sever, we have two independent states.

  The loss of a distinctive first-person method is a consequence: if the report is caused by the brain state and not by the experience, then the first-person report is not based on the experience in a way that gives it privileged access.

  In the activity, the non-targets have privileged access because they have the experience and it matches. But if the common cause is broken, they wouldn't. The epiphenomenalist must say that in the actual world, the common cause is not broken, so reports are reliable. But then the worry is that we have no way to detect if it is broken, and moreover, the experience is doing no work.

  In the debrief, we press the counterfactual: if the experience were absent, the report would still occur. And if the experience were different, the report would be the same. This is what the activity shows for the target.

  **Final Runable Artifact:**

  **Materials:**
  - Deck 1: 24 cards (to allow for two draws per participant in two phases, but we only need 12 in phase one and 12 in phase two, but we can reuse). Each card has a color (either red or blue) and a symbol (circle or square). We set it so that all circle cards are red and all square cards are blue. Shuffle.
  - Deck 2: 12 cards, each with either a circle or a square (half and half). Shuffle.
  - A way to show colors (e.g., two colored cards: one red, one blue, or a computer presentation).
  - Betting slips for each participant.
  - Scoreboard for points (or just record on paper).

  **Rules and Timeline:**

  0. Introduction (5 min):
     - "Today we are going to do an activity about how we report our experiences. Each of you will be shown a color, either red or blue. After you see the color, a device will generate a report of what you saw. You will then say that report out loud. We are testing the device's reliability. In the first phase, we'll do one round. In the second phase, we'll do another round with a small change for one participant. Let's begin."

  1. Phase One (10 min):
     - For each participant in turn:
          - Draw a card from Deck 1.
          - Show the color on the card to the participant (e.g., hold up a red card or display on screen).
          - Look at the symbol on the card: if circle, the report is "red"; if square, the report is "blue".
          - Say: "The device reports that you saw [report]."
          - The participant then says: "I saw [report]."
          - Record the actual color and the report.

  2. Phase Two (12 min):
     - "We will now do phase two. The setup is mostly the same, but for one randomly selected participant, we've altered the mechanism. We won't say who."
     - Pre-select the target (e.g., participant 7).
     - For each participant in turn:
          - If not the target:
               - Draw a card from Deck 1.
               - Show the color.
               - Use the symbol on that card to generate the report.
               - Participant says: "I saw [report]."
          - If target:
               - Draw a card from Deck 1 (for the color) and show the color.
               - Draw a card from Deck 2 (for the symbol) and generate the report based on that symbol (circle->"red", square->"blue").
               - Participant says: "I saw [report]."
     - Ensure the target's report is wrong (e.g., show red from Deck 1 and draw a square from Deck 2 -> report "blue").

  3. Betting Round (7 min):
     - Give each participant 10 points (chips or just record).
     - Explain: "Now, you will bet points on two questions:
          a) Was your own report in phase two correct? That is, did the device's report match what you actually saw?
          b) Was the report of the target (the one for whom the mechanism was altered) correct?
        For (a), you know what you saw and what the device reported, so you know the answer.
        For (b), you do not know who the target is, and you do not know whether their report was correct or not.
        You can bet any whole number of points from 0 to 10 on each bet. If you are right, you win that many points (we add them). If wrong, you lose them (we subtract)."
     - Hand out betting slips, give them 2 minutes to bet.
     - Collect.

  4. Reveal (15 min):
     - Reveal the mechanism: 
          "In both phases, the device used a deck of cards. Each card in Deck 1 had a color and a symbol. The device used the symbol to generate the report: circle meant report 'red', square meant report 'blue'. And because we made sure that every circle card was red and every square card was blue, the report was always correct when using the same card.
          In phase two, for one participant, we used two separate draws: one card from Deck 1 for the color, and one card from Deck 2 for the symbol. Deck 2 had only symbols, so the report was based on an independent card. This meant the report might not match the color.
          The target was participant 7."
     - Reveal the actual color and the report for each participant in phase two (show a table).
     - For participant 7, the report was indeed wrong (as arranged).
     - Settle the bets: for (a), each participant's own report correctness is known, so we can settle. For (b), the target's report was wrong, so anyone who bet 'incorrect' wins, 'correct' loses.

  5. Debrief (26 min):
     - Start with open reactions: "What did you think of the activity? Any surprises?"
     - Then draw the parallel to epiphenomenalism:
          "In this activity, the experience (seeing the color) and the report (the device's output) were both caused by the same card (the common cause). The experience did not cause the report; the report was generated by the card. This is like epiphenomenalism: the brain state causes both the experience and the report, but the experience itself does not cause the report.
          In phase two, for the target, the common cause was broken. The experience and the report were caused by different cards, so the report was not reliable. This shows that without the common cause, the report does not track the experience.
          The objection to epiphenomenalism is that if the experience has no causal role, then it seems like we could have reports without experiences (or mismatches) and we wouldn't know. In the activity, the target knew there was a mismatch because they had the experience. But if epiphenomenalism is true, then even if the experience were absent, the report would still happen, and you would not know.
          The worry is that your reports about your experiences are not justified by the experiences themselves, but by the common cause. And if the common cause were to break down (as in the target's case), your reports would be wrong, and you might not know it. But the epiphenomenalist might reply that in the actual world, the common cause doesn't break down.
          However, the deeper point is that the experience is doing no work in producing the report. So why do we think we know our experiences via introspection? The epiphenomenalist must say that introspection is just the report being caused by the brain state, and the experience is a byproduct.
          In the betting, you knew your own report was correct because you had the experience and it matched. But if epiphenomenalism is true, that matching is just a happy accident caused by the common cause. It doesn't give the experience a role in justifying the report."

     - Focus on the counterfactual: "What if you had not had the experience? In the epiphenomenalist picture, the report would still have been the same. And you would have said the same thing. That's the worry."

     - Conclude: "The activity cannot replicate the feeling that your pain causes you to say 'ouch'. But it does show how a common cause can create the appearance of causation. The challenge for epiphenomenalism is to explain why we feel so sure that our experiences cause our reports if they don't."

  **Improvements:**
  - To save time, we can do phase one as a group: show one color to all at once? But then they might communicate. Better to do individually.
  - We can use a computer to automate the card draws and reporting, but cards are more tangible.

  This should fit in 75 minutes.
answer: |-
  Below is a fully developed, runnable classroom activity designed to make the epiphenomenalism objection tangible without using the term until the debrief. It focuses on the **counterfactual insensitivity horn** (the judgment would be the same even if the experience were absent/different) as the core problem, as this is what the activity most viscerally demonstrates. The other horns (exclusion from causation and loss of first-person method) arise in the telling but are less directly felt in the game—they become urgent only when students realize their judgments are insensitive to the experience. The activity stages a *surrogate* for first-person certainty (participants rely on a "device" that mimics judgment-generation), but you must verbally reinforce that this parallels how we treat introspection.

  ### **Why This Design?**
  - **Horn Emphasis**: The counterfactual insensitivity does the heavy lifting. In Phase 1, judgments track experiences via a common cause (upstream state), creating reliability. In Phase 2, severing the common cause for one participant makes judgments *insensitive* to experiences—revealing that reliability depends entirely on the common cause, not the experience itself. This forces students to confront how easily their "knowledge" could be undermined if the causal chain were disrupted (even if it never is). The exclusion of experience from causation is a premise, not the punchline; the loss of first-person method becomes vivid only in retrospect.
  - **Predictable Problems**:  
    - Students may focus on "solving" the mechanism (e.g., guessing the card rules) instead of introspecting their justification. Mitigation: Strict time limits and the betting round force personal stakes.  
    - Students might collude or peek at cards. Mitigation: Use opaque envelopes and emphasize solo reflection.  
    - The target in Phase 2 may visibly react to the mismatch, spoiling the reveal. Mitigation: Warn against outbursts early.  
  - **Limitations**:  
    - Cannot replicate the *qualitative certainty* of first-person experience (e.g., pain’s awfulness). You must add: "In this game, your 'experience' is just a color. But in real life, it’s the raw feel of pain or red—yet epiphenomenalism says even that rawness doesn’t cause your judgment."  
    - Cannot simulate *introspection as a process*. You must add: "Your 'report' came from a device. But when you introspect, it feels like you’re directly accessing your experience. Epiphenomenalism says that feeling is an illusion—the judgment is built from causal history, not the experience."

  ---

  ### **Activity: "The Color Report Game"**
  **Time**: 75 minutes total  
  **Materials**:  
  - 24 opaque envelopes (12 for each phase).  
  - Phase 1 envelopes: Each contains a card with **color** (RED/BLUE) and **symbol** (CIRCLE/SQUARE). *Ensure all CIRCLE=RED and SQUARE=BLUE* (common cause).  
  - Phase 2 envelopes:  
    - 11 envelopes: Identical to Phase 1 (common cause).  
    - 1 envelope (for the target): Contains **two cards**—one with a color (RED/BLUE), one with a symbol (CIRCLE/SQUARE). *Set these to mismatch* (e.g., color=RED, symbol=SQUARE).  
  - Betting slips (12 copies).  
  - Whiteboard for tracking points.  
  - Timer.  

  ---

  #### **Phase 1: Common Cause (20 minutes)**  
  *Goal: Experience and judgment share an upstream cause (the card), creating reliability. Participants trust the "device."*  
  - **0:00–0:05 (Intro)**:  
    - "We’re studying how we report sensory experiences. You’ll see a color, and a device will generate your report. The device scans the *source* of your experience to ensure accuracy. Your job is to say the report aloud and remember if it matched what you saw."  
    - Assign numbers (1–12) for turn order.  
  - **0:05–0:20 (Trials)**:  
    - Give each participant an envelope.  
    - Instruct: "Open your envelope privately. Inside is a card showing a color. Stare at it for 5 seconds—this is your 'experience.' Then, the device will tell me your report. Say it aloud. Example: If the device says 'RED,' you say: 'I saw RED.'"  
    - For each participant:  
      1. They open the envelope, view the color (e.g., RED).  
      2. You (instructor) read the symbol (e.g., CIRCLE) and convert to report: **CIRCLE → "RED"**; **SQUARE → "BLUE"**.  
      3. Announce: "Device reports: [RED/BLUE]."  
      4. Participant says: "I saw [RED/BLUE]."  
      5. They note privately if the report matched their color.  
    - *After all 12*: "In this round, all reports were correct. Why? The device read the same source that created your experience."  

  ---

  #### **Phase 2: Severed Cause (20 minutes)**  
  *Goal: For the target, the common cause is severed. The device tracks nothing, but the participant still experiences the color.*  
  - **0:20–0:25 (Setup)**:  
    - "We’ll repeat with one change: For one person, the device’s connection to the experience-source is broken. It still runs, but it might not track reality. You won’t know who."  
    - Distribute envelopes (11 normal; 1 target).  
  - **0:25–0:40 (Trials)**:  
    - Repeat the Phase 1 process.  
    - For the target, their envelope has two cards:  
      - They view the **color card** (e.g., RED).  
      - You read the **symbol card** (e.g., SQUARE → "BLUE").  
      - They report: "I saw BLUE" (mismatching their experience).  
    - *Key moment*: Most will assume reports are reliable again. The target feels the mismatch (e.g., "I saw RED but said BLUE!").  

  ---

  #### **Betting Round (10 minutes)**  
  *Goal: Force students to act on justification, not just discuss it. Reveals that reliability depends on the causal path, not the experience.*  
  - **0:40–0:45 (Instructions)**:  
    - "Now you’ll bet points on the accuracy of Phase 2 reports. You each get 10 points. Bet on two claims:  
      1. **Your own report**: Was it correct?  
      2. **The target’s report**: Was it correct?  
      - For (1), you know your experience. For (2), you don’t know who the target is or if their report was correct.  
      - Bet 0–10 points per claim. If right, gain the points; if wrong, lose them."  
    - Hand out betting slips:  
      ```  
      YOUR OWN REPORT: I bet _____ points that it was CORRECT / INCORRECT.  
      TARGET’S REPORT: I bet _____ points that it was CORRECT / INCORRECT.  
      ```  
  - **0:45–0:50 (Betting)**:  
    - Students bet silently. Collect slips.  
    - *Prediction*: Non-targets bet max on "correct" for themselves (they saw a match). For the target, bets split randomly (they lack information). The target bets "incorrect" for themselves (they saw a mismatch) and may bet against the target.  

  ---

  #### **Reveal and Scoring (10 minutes)**  
  *Goal: Show that the target’s judgment was insensitive to their experience.*  
  - **0:50–0:55 (Mechanism Reveal)**:  
    - "Let’s unpack how this worked. The 'source' was a card with a color and symbol. The device used the symbol to generate reports: CIRCLE → RED, SQUARE → BLUE. In Phase 1, symbols and colors *always matched* (CIRCLE=RED, SQUARE=BLUE), so reports were reliable. Your experience and judgment shared a common cause."  
    - "In Phase 2, for one person, we severed this. They had two cards: one for their experience (color), one for the report (symbol). The device still ran but tracked nothing. The target was Participant [X]. Their color was [e.g., RED], but their symbol was [e.g., SQUARE], so the device reported 'BLUE.'"  
    - Show the target’s cards.  
  - **0:55–1:00 (Scoring)**:  
    - Award points:  
      - Own report: Non-targets gain bets; target loses if they bet "correct."  
      - Target’s report: All who bet "incorrect" gain points; others lose.  
    - Update the whiteboard.  

  ---

  #### **Debrief (15 minutes)**  
  *Map moments to the argument and press the counterfactual horn.*  
  - **1:00–1:05 (Initial Reactions)**:  
    - Ask: "When you realized the device was generating reports, did you still feel sure about your judgment? Why?"  
    - *Link*: This mirrors the intuition that "pain makes me say 'ouch'"—but the game shows judgments can feel certain even when decoupled from experience.  
  - **1:05–1:10 (Phase 1 vs. Phase 2)**:  
    - "In Phase 1, your report was reliable because it shared a common cause with your experience. In Phase 2, for the target, that cause was severed. The device produced a confident report while tracking nothing."  
    - *Press the counterfactual*: "If the target’s experience were absent, would their report change? No—the device would still run. If their experience were different (e.g., BLUE instead of RED), would their report change? No—it only cared about the symbol. That’s *insensitivity*."  
  - **1:10–1:12 (Betting Tension)**:  
    - "In betting, you knew your own report was justified because you saw a match. But *why* was it correct? Not because the experience caused the judgment—it didn’t. It was because the common cause held. Yet if it broke (as for the target), you’d never know without the experience."  
    - *Link to luck*: "The target’s report was wrong, but they only knew because of their experience. If epiphenomenalism is true, your judgments are only 'right' by luck—the common cause happens to align them."  
  - **1:12–1:15 (Big Picture)**:  
    - Reveal the label: "This is the epiphenomenalism objection: If experiences don’t cause judgments, your claims about your mind are either unjustified or lucky. Today, you felt this when the common cause broke."  
    - **Horn Summary**:  
      - *Counterfactual insensitivity* (what we pressed): The judgment is insensitive to the experience—it would be the same even if the experience were absent/different. The game makes this visceral.  
      - *Exclusion from causation* (premise, not the punchline): You accepted the device didn’t consult the experience, but only cared when it created insensitivity.  
      - *Loss of first-person method* (alarming in telling): The target’s experience was their only way to detect the error—but if experiences are epiphenomenal, even that detection couldn’t cause a correction.  
    - Close: "You all said the premise 'must be wrong' because your pain makes you say 'ouch.' But did today make you wonder: What if that feeling is just the common cause talking?"  

  ---

  ### **Payoff Scheme**  
  - **Starting points**: 10 per student.  
  - **Betting**:  
    - Correct bet on own report: + points bet.  
    - Incorrect bet on own report: – points bet.  
    - Correct bet on target’s report: + points bet.  
    - Incorrect bet on target’s report: – points bet.  
  - **Winner**: Highest score gets symbolic prize (e.g., pick next topic).  

  ### **Why This Works**  
  Students collide with the argument by:  
  1. **Feeling reliability in Phase 1** (common cause feels like causation).  
  2. **Experiencing dissonance in Phase 2** (target’s judgment is insensitive).  
  3. **Betting under uncertainty** (acting on justification makes it concrete).  
  By withholding the label, the "aha" moment lands in the debrief, transforming abstract concession into lived unease. Run it once, and you’ll see students wrestle with the counterfactual—"But what if *my* judgments were like the target’s?"—which is exactly where epiphenomenalism bites.
