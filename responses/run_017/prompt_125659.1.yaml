prompt: |-
  So I somehow ended up on the planning commision for the small city I grew up in, and it's turned into the most morally annoying thing in my life. We hear maybe thirty variance and rezoning proposals a month, forty-five minutes each, one-page staff report, and public comment that is mostly people being furious about parking. Votes get appealed, so whatever I do has to be defensible in writing afterwards. I want a decision procedure I can actually run, in about half an hour, from a one-page report plus whatever gets said in the room, and that my fellow commissioners — a retired contractor, a high school principal, two realtors — can follow without any theory background.

  What I want from you is the procedure, grounded in whatever political philosophy actually has to say about who has a right to the city. No reading list, no names, I just want the distinctions. The one I keep coming back to is that "we have a right to this neighborhood" seems to be three different claims shuffled together: a right of access (to be allowed to move here at all), a right of authorship (to have a say in what the place becomes), and a right of continuity (to not have the ground shift under you because of other people's choices, and to not be handed the bill for the region's growth). Almost every objection I hear is one of those wearing the costume of another. I'd like the procedure to start by sorting which one is actually being claimed, and I'd like it to say whether length of residence strengthens the claim genuinely or is just a proxy for something more defensible — I honestly don't know and I've gone back and forth.

  Three things it has to handle. First: the people most affected usually aren't in the room — the family that would live in the building, the person who'd use the shelter, and, weirder, the fact that what we decide partly determines which people end up existing here at all, so "who is harmed" can't just be read off the folks at the microphone. Give me a rule for who speaks for them, and be honest that it's a rule you chose rather than one you derived. Second: sequencing — refusing a building is reversible next year and approving a demolition isn't, and I want to know whether that asymmetry is a real moral reason for a default or just status quo bias in a nice coat. Say which, and build it in or leave it out accordingly. Third: the cases where the objection is real but the thing being asked for is a veto rather than a fix — how do I tell those apart, and where does the procedure hand the decision back to a human because it's a values call and not a factual one? Also fix the scope if the procedure needs it fixed: I never know whether the relevant "city" is my city or the whole metro area, and I suspect the answer changes the outcome.

  Then run it on three: (1) a six-unit building on a corner lot currently zoned for one house, (2) a sixty-unit supportive-housing project on a commercial strip two blocks off a single-family street, and (3) something I'm personally inclined to approve — a small apartment building a friend wants to put on the lot behind his house — where I'd rather find out I'm being inconsistent than get my way. And tell me plainly what the procedure can't do: which inputs it can't manufacture, when it will misfire, and what it says nothing about at all.
reasoning: |-
  Okay, the user is on a city planning commission and is overwhelmed by zoning proposals and public anger. They want a clear, practical decision procedure rooted in political philosophy, without academic jargon. Their main insight is that neighborhood rights claims fall into three categories: access, authorship, continuity. 

  Hmm, they need a method that handles three key issues: representing absent stakeholders (like future residents), irreversible decisions (like demolitions), and distinguishing legitimate concerns from veto demands. Also, they're unsure whether length of residence matters morally or just practically.

  The user seems frustrated by performative outrage ("parking fury") and wants to depersonalize decisions. Underneath, they might be seeking ethical consistency to reduce their own moral fatigue. Interesting that they included a self-test case (#3) - shows intellectual honesty.

  For the framework... First, rights clarification makes sense as Step 1. Access is Rawlsian fairness, authorship aligns with participatory democracy, continuity echoes Burkean conservatism. Length of residence? Probably only matters for continuity claims - you can't be disrupted if you just arrived.

  Step 2 should force specificity: "Who exactly loses authorship?" not just "character changes." For absent stakeholders, I'll suggest staff must identify them - it's arbitrary but necessary. The reversibility asymmetry is ethically real (Jonas' responsibility principle) so it gets a default "no" on destruction.

  Step 3's test for obstructionism: if mitigation exists but isn't proposed, it's probably a veto. And scope... tricky. Probably metro-wide for housing access, neighborhood-scale for continuity. 

  Now testing cases:
  - The 6-unit building: Access claim dominates (metro need). Continuity concerns? Only if traffic studies show real harm. Likely approve.
  - Supportive housing: Strong access claim for vulnerable group. "Two blocks away" weakens continuity objections. Staff must show operational plans to address safety - if credible, approve.
  - Friend's apartment: Classic authorship conflict! User's bias is obvious. Procedure forces asking: "Would I approve if not my friend?" If traffic/parking same as other projects, should approve to be consistent.

  Limitations: Can't resolve deep value conflicts (NIMBY vs YIMBY), can't verify staff reports, ignores power imbalances. But it makes tradeoffs explicit - which might reduce the user's moral annoyance by depoliticizing decisions.

  ...Wait, should add that the procedure can't manufacture political courage. Commissioners still have to vote.
answer: |-
  Here's a decision procedure grounded in urban political philosophy, structured for practical use in 30 minutes. It explicitly addresses your core distinctions and operational constraints.

  **The Three Rights Framework (Your Core Insight):**
  1. **Access:** The right to exist in the city (applies to potential residents, workers, visitors).
  2. **Authorship:** The right to participate meaningfully in shaping one's immediate environment (applies to current residents/businesses *within the directly impacted zone*).
  3. **Continuity:** The right to reasonable stability against disruptive external change (applies to existing residents/businesses *experiencing demonstrable, material impact*).

  **Key Rule:** **Length of residence strengthens *Continuity* claims only.** It's irrelevant for Access (a newcomer deserves housing) and weak for Authorship (new residents also get a voice). Continuity weight scales with: (a) Severity of disruption, (b) Proximity to project, (c) Length of established use.

  ---

  **The Decision Procedure (30-Minute Flow):**

  1.  **Classify the Primary Claim (5 mins):**
      *   Staff report MUST state the project's primary contribution to citywide **Access** (e.g., "Adds 6 housing units in a high-opportunity area near transit" or "Provides shelter for 60 chronically homeless individuals").
      *   Listen to public comment. For each objection, ask: *"Is this primarily about ACCESS (exclusion), AUTHORSHIP (lack of input/control), or CONTINUITY (fear of harm/disruption)?"* Label them aloud.
      *   **Output:** Dominant objection type(s) and the project's stated Access benefit.

  2.  **Assess Claims & Mitigations (15 mins):**
      *   **Access:** Is the need citywide or metro-wide? (Assume metro-wide for housing/shelter.) Does the project address an unmet need efficiently? (Staff must provide data: e.g., vacancy rates, shelter waitlists.) *If Access need is high and project addresses it, this carries significant weight.*
      *   **Authorship:** Have abutting property owners/residents had formal notice + comment? (Presume process satisfies Authorship *minimally* unless procedural flaw.) Does the objection demand *control* beyond comment? If yes, note it as likely overreach – Authorship isn't a veto.
      *   **Continuity:**
          *   Is the harm claimed **specific and material** (traffic, noise, shadows, parking loss, documented safety risk) or **general/subjective** ("character," "vibes," property value fears)? *Only material harms count.*
          *   Does the staff report **quantify/mitigate** these? (e.g., "Traffic study shows <5% increase; requires 2 new bike racks.") If not, demand on-the-spot commitment to a mitigation study/condition.
          *   Apply **Proximity/Length Test:** Does the objector live/work *immediately adjacent*? Have they been there >5 years? Weigh accordingly. A homeowner 2 blocks away gets less Continuity weight than one next door. A 1-year resident gets less than a 30-year resident.

  3.  **Handle Irreversibility & Absent Stakeholders (5 mins):**
      *   **Irreversibility Asymmetry IS a Moral Reason:** Demolition of existing viable housing/community spaces imposes irreversible loss. New construction denial merely delays potential future gain. **Rule:** *Proposals involving significant demolition of occupied housing or historic community assets get a strong presumption of denial unless Access/Authorship benefits are overwhelming and Continuity impacts are fully mitigated for displaced.*
      *   **Absent Stakeholders Rule:** **Staff is the mandatory proxy for Access claimants** (future residents, shelter users, the "unborn" population). They MUST articulate the need and benefit in their report. Commissioners must actively consider this counterweight. *No proxy is perfect; this is a necessary choice.*

  4.  **Veto Test & Decision Point (5 mins):**
      *   **Ask:** "Is the core objection resolvable through **feasible mitigation** (e.g., traffic calming, screening, operating hours, parking permits), or is it a demand for **no change whatsoever**?"
      *   **If Mitigation Exists:** Direct staff to draft conditions. Vote on project *with conditions*. (Defer final approval contingent on mitigation plan if needed.)
      *   **If It's a Veto Demand:** Acknowledge the concern (likely Continuity or disguised Authorship) but note that Access needs/city evolution outweigh a total bar *unless Continuity harm is severe, immediate, and unmitigatable*. This is the **values call**.
      *   **Scope Rule:** Use **Metro-scale for Access Needs** (housing, jobs, services). Use **Neighborhood-scale for Continuity Impacts** (directly affected properties). Authorship is hyper-local (abutters).

  ---

  **Application to Your Cases:**

  1.  **Six-Unit Building on Corner Lot:**
      *   **Access:** High (Adds housing in likely walkable area). Staff must state metro need.
      *   **Objections:** Likely "Parking!" (Continuity), "Too big!" (Continuity/Authorship blend).
      *   **Continuity:** Assess specific parking impact. If quantifiable loss, require mitigation (TDM plan, permit system for residents). "Too big" is subjective unless shading/traffic proven. Abutters get authorship via process, not veto.
      *   **Irreversibility:** No demolition? Presumption for approval.
      *   **Verdict:** **APPROVE with parking/traffic mitigation.** Continuity claims weak if mitigated; Access high.

  2.  **Sixty-Unit Supportive Housing:**
      *   **Access:** Very High (Addresses critical need for vulnerable population). Staff *must* outline operator credentials/services.
      *   **Objections:** "Safety!" (Continuity - requires evidence, not fear), "Property values!" (Continuity - weak/indirect), "Wrong location!" (Authorship/Continuity).
      *   **Continuity:** "Safety" requires operator's plan + police data on similar sites. "Property values" is rarely provable direct harm. Location 2 blocks off SFH street lessens impact. Mitigations: Security plan, community liaison, good design.
      *   **Irreversibility:** Likely new construction. Presumption for approval.
      *   **Absent Stakeholders:** Staff strongly advocates for shelter users' Access.
      *   **Verdict:** **APPROVE with robust operating conditions.** Access dominates; Continuity objections require evidence-based mitigation, not veto.

  3.  **Friend's Apartment Building (Your Test):**
      *   **Access:** Moderate (Adds units, but scale small). Staff states need.
      *   **Objections:** Your friend's neighbors: "Traffic on our quiet street!" (Continuity), "Blocks my sun!" (Continuity), "He shouldn't profit!" (Irrelevant).
      *   **Continuity:** Quantify traffic increase (small project = likely minor). Shadow study? Mitigations: Off-street parking reqs, design setbacks, tree planting. Abutters (incl. your friend) had authorship via process.
      *   **Irreversibility:** Likely demo of backyard? Only if existing structure viable. Minor demo weak.
      *   **Bias Check:** Would you approve identical project by a stranger? If traffic/scale/design are consistent with previous approvals **and** mitigations address material concerns, consistency demands approval.
      *   **Verdict:** **Likely APPROVE with design/impact mitigations.** Denial based solely on neighbor opposition (disguised veto) or your friendship (bias) fails the procedure. If it truly creates unique material harm *different* from similar projects, denial might be justified – but document *exactly* why.

  ---

  **What the Procedure CANNOT Do:**

  1.  **Manufacture Missing Data:** It relies on staff reports being accurate and including Access needs and initial impact assessment. Garbage in, garbage out.
  2.  **Resolve Deep Value Conflicts:** If commissioners fundamentally disagree on whether Access trumps Continuity in a specific case, the vote is the values call. The procedure makes the *tradeoff* explicit.
  3.  **Eliminate Political Pressure:** It structures thinking but won't stop angry calls from the Mayor if you approve supportive housing.
  4.  **Define "Material Harm":** Judgment is required (e.g., is a 5% traffic increase "material"?). Precedent helps.
  5.  **Fix Bad Design/Operations:** It approves projects *with conditions*, but can't guarantee good management or architecture.
  6.  **Address Regional Equity Directly:** It uses metro-scale for Access *need* but doesn't dictate *where* growth must go beyond existing city boundaries/policy.
  7.  **Predict the Future:** Assessments of impact are based on projections and studies, which can be wrong.

  **When It Misfires:**
  *   **Crying Wolf:** When public furor is high but Continuity harms are fabricated or negligible (common for "character" objections).
  *   **Invisible Harms:** When significant diffuse harms (e.g., gentrification pressure) exist but aren't captured by the hyper-local Continuity focus.
  *   **Bad Faith Staff:** If staff understates Access needs or overstates mitigations.
  *   **True Zero-Sum Conflicts:** When Access for one group (e.g., shelter users) demonstrably, unavoidably destroys Continuity for another (e.g., vulnerable existing SRO residents).

  **The Bottom Line:** This procedure forces explicit tradeoffs between fundamental urban rights, demands evidence for disruption claims, prioritizes irreplaceable assets, gives staff a defined role for the voiceless, and exposes veto demands disguised as other claims. It won't make everyone happy, but it will make your reasoning defensible and consistent. Good luck.
