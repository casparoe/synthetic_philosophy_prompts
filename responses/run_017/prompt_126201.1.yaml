  Three concrete problems stand out:
  1) How to tell the 2009 fencing business story without vilifying the town that initially disapproved
  2) Whether to mention an undisclosed incident where Marlene's confidentiality went too far
  3) How to structure a public tribute to someone who distrusted public ceremonies

  The user's deeper needs are fascinating. They want to honor Marlene authentically while acknowledging her complexity. They reject sanitized hagiography but also refuse to weaponize the toast against her. There's clear anxiety about balancing audience factions: townspeople, education colleagues, and former students with trauma narratives. 

  I'm especially struck by the challenge of praising Marlene without implying moral superiority of her methods. The user dismisses the "each approach has merit" solution as bureaucratic and unconvincing. They need something that feels true to Marlene's nuanced worldview while resonating emotionally.

  For the 2009 story solution, I'm considering reframing the town's anger as proof of Marlene's commitment - their frustration showed how radically she protected the repair process. The fencing business becomes the living evidence, not the story's climax. 

  Regarding the undisclosed incident, silence seems wisest. Mentioning it would replicate the exact spectacle Marlene rejected. The toast can honor her philosophy while acknowledging human fallibility through subtext.

  The meta-problem about public ceremonies needs delicate handling. Instead of joking about hypocrisy, I'm imagining positioning the toast as collective gratitude - not resolving conflict but bearing witness to impact. The "third chair" concept could transform: we're all the uninvolved party observing her legacy.

  Word count feels critical. Six minutes is about 900 words. The draft must balance specific anecdotes with philosophical depth while leaving room for the actual toast moment. Emotional rhythm matters too - should build from concrete examples to the larger tribute.

  For tone, avoiding education jargon is key. The user wants earthy authenticity that would pass the brother's "no bullshit" test at the head table. References to ranch families and timber surnames ground it. Humor should be subtle, emerging from observation rather than punchlines.

  Biggest risk is sounding like a eulogy. Must emphasize celebration through active verbs - "she built," "she guarded," "she understood." The ending toast lines should crystallize everything into one resonant image about her influence being the quiet space where real change happened.
