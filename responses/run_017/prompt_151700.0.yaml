prompt: |-
  So I've been going in circles on endurantism vs perdurantism and I realized I don't actually know what the standard medical practice around advance directives and Ulysses contracts commits you to, metaphysically.

  The practice, as I understand it: you fill out a living will, and the hospital asks about it on intake. While you have capacity, your current say is absolute — you can withdraw consent five minutes before surgery, for any reason or none, even if refusing kills you, and even if you signed a form saying the opposite an hour ago. But once you lose capacity, the thing flips: the document written by the earlier you starts speaking for you, and the demented you's actual present protests (I don't want the feeding tube, let me go home) get gently overruled by reference to what you "really" wanted. Meanwhile, the stickier version of this — psychiatric advance directives, where you precommit to being forcibly medicated during a future episode you know you'll refuse treatment in — gets honored way less reliably, and in a lot of places is treated as close to unenforceable. And then on the ward itself nobody can keep the story straight: when the resident with advanced dementia seems content, staff will say "she's not suffering, she seems happy" and treat that as a real reason to keep going, while giving her current *stated wishes* basically zero weight. So the present time-slice counts as a welfare subject but not as an agent, apparently.

  I want to know what theory of persistence, or of diachronic identity, this package presupposes — if any. Reconstruct the implicit view: does it only make sense if the earlier self and the later self are literally numerically the same substance wholly present at both times, so that the earlier one's will is just authoritative over its own life full stop? Or does perdurantism license all of it too, or better? I keep tripping over the fact that perdurantism isn't one package: on the worm version the earlier stage is literally a part of the same person, which looks like the strongest possible support for precedent autonomy, and on the stage version the later stage is only the same person in some derivative, comes-in-degrees sense, which gives you a natural reason for the earlier self's authority to decay as psychological connectedness decays — but then the all-or-nothing capacity threshold looks like an artifact rather than something the metaphysics wants.

  And please separate out what the practice strictly *presupposes* from what it merely fits comfortably with, and where it's underdetermined and several theories would license the identical behavior. My suspicion is that the refusal/request asymmetry in particular is doing no identity work at all and is really just an asymmetry about vetoes vs. compulsion wearing metaphysical clothing — but I'd like that argued.

  Last bit, the thing I actually can't find discussed anywhere: imagine you junked the threshold and made it graded. The directive's weight is a decreasing function of some operationalized continuity measure (memory overlap, value stability, whether the current person still endorses the old projects — pick whatever you can defend), no bright line, and the decision goes to whoever currently has the strongest continuity claim. What would that practice presuppose? Would a perdurantist have to be a revisionist about the current one? And is the honest answer that the existing binary is metaphysically underdetermined and we only have it because the law needs bright lines — or does it actually fall out of one view and not the other?
reasoning: |-
  Okay, let me unpack this user's query. They're deeply entangled in the metaphysics of personal identity, specifically endurantism versus perdurantism, and how it relates to medical practices around advance directives and Ulysses contracts. The core of their confusion seems to be: what theory of persistence underlies the legal and medical handling of these directives?

  First, I need to map out the current practices they described. The user notes that while competent, a person can override any prior directive instantly. But once capacity is lost, the document takes precedence over present protests. Psychiatric advance directives, however, are treated as less enforceable. There's also inconsistency in how dementia patients' current contentment versus stated wishes are weighted—present self is seen as a "welfare subject" but not an agent. 

  The user wants to know which metaphysical view—endurantism or perdurantism—this practice presupposes. They're particularly stuck on perdurantism's variants (worm vs stage theory) and how each might support or undermine the current approach. They also ask about a hypothetical graded system versus the existing binary threshold, and whether the asymmetry in veto power is really about metaphysics or just practical veto/compulsion dynamics.

  Hmm, the user's framing suggests they've done significant homework but hit a wall. Their frustration with "going in circles" is palpable. I should acknowledge the sophistication of their analysis—they've already spotted key tensions like the worm/stage distinction in perdurantism and the capacity threshold paradox. Their unspoken need might be for clarity on whether metaphysics actually drives these policies or if it's just post-hoc justification.

  Breaking it down: The current practice hinges on a binary capacity threshold. That screams Lockean personhood (psychological continuity), not substance metaphysics. Endurantism could support it if we add a "personhood overlay," but it's not necessary. Perdurantism handles it differently—worm theory makes prior directives literally self-command, while stage theory naturally accommodates decay of authority. 

  The veto/compulsion asymmetry seems pragmatic, not metaphysical. Competent patients can refuse treatment (veto) because bodily autonomy is near-absolute; enforcing positive obligations (compulsion) is harder ethically/legally. That explains why psychiatric directives—which often demand forced intervention—are dodgier.

  For their graded-system thought experiment: If we weighted directives by psychological connectedness, it'd fit stage theory best. Worm theory would resist it as "self-betrayal," while endurantism might strain. But crucially, the binary system isn't metaphysically determined—it's a legal compromise. Bright lines reduce disputes. A graded approach would be truer to psychological continuity metaphysics but administratively messy.

  User's suspicion is spot-on: the practice is shaped by pragmatism, with metaphysics providing optional dressing. The takeaway should emphasize that while perdurantism (stage theory) aligns best with a graded view, the status quo prioritizes practicality over philosophical purity.
answer: |-
  Here's a breakdown of the metaphysics implicitly presupposed and accommodated by standard advance directive practices, addressing your core questions and thought experiment:

  **The Core Implicit Commitment: Lockean Personhood + Pragmatic Thresholds**
  The practice doesn't strictly *presuppose* endurantism, perdurantism, or substance ontology. Instead, it operationalizes a **psychological continuity** view of *personhood* (heavily Lockean) combined with **pragmatic legal/ethical thresholds** for agency and competence. The metaphysics is largely *underdetermined*, but the psychology and pragmatics drive the structure.

  1.  **The Authority of the "Earlier Self": Psychological Continuity & Precedent Autonomy**
      *   **Presupposed:** Strong psychological continuity (memories, values, beliefs, intentions) between the competent document-signer and the future incapacitated patient is assumed *at the time of signing*. The earlier self is understood as the best predictor and legitimate planner for the future self *because* of this anticipated continuity.
      *   **Metaphysical Accommodation:**
          *   **Endurantism:** Fits easily. The *same* wholly present person persists. The earlier stage is the *same entity* making decisions for its future states.
          *   **Perdurantism (Worm):** Fits well. The signer-stage and future-stage are temporal parts of the *same* 4D person-worm. Decisions by one part for another part are self-governance.
          *   **Perdurantism (Stage):** Fits *if* combined with a psychological continuity criterion for "being the same person." The signer-stage is causally/psychologically connected to the future stage, justifying its authority over *that* future stage. The "all-or-nothing" threshold is an artifact, not metaphysically required.
      *   **Not Presupposed:** The practice doesn't assume numerical identity requires an immaterial soul or indivisible substance (classical endurantism). It works fine with psychological criteria compatible with various ontologies.

  2.  **The "Capacity Threshold" Flip: Pragmatism, Not Deep Metaphysics**
      *   **Presupposed:** A bright-line, operationalizable threshold for *decision-making capacity* (understanding, reasoning, appreciation, communication). This is primarily a **clinical/legal/pragmatic construct**, not a deep metaphysical truth about identity.
      *   **Why the Flip?**
          *   **Practical Necessity:** Medicine and law need clear, enforceable decision rules. Assessing "degrees of authority" in real-time crises is often impossible.
          *   **Respecting Past Wishes vs. Preventing Exploitation:** The threshold protects the documented wishes of the competent self from being overridden by an impaired self vulnerable to coercion, transient impulses, or distorted thinking (as in mania or severe dementia psychosis). Conversely, it allows the competent self full sovereignty *now*.
          *   **Welfare vs. Agency Distinction:** You identified this perfectly. The present time-slice is granted subjectivity (can experience suffering/well-being) but denied full agency *once capacity is clinically judged lost*. This distinction is ethical/clinical, not strictly metaphysical. We recognize their sentience but deem their decision-making process invalid for complex medical choices.
      *   **Metaphysical Underdetermination:** Both endurantism and perdurantism can *accommodate* a capacity threshold. Neither *demands* it metaphysically. Endurantism might find it more "natural" (the whole person is either capable or not), but perdurantism can easily adopt it as a practical rule for when a stage's decisions are valid.

  3.  **The Refusal/Request Asymmetry: Veto Power & Non-Compulsion, Not Identity**
      *   **Your Suspicion is Correct:** This asymmetry is primarily about **bodily autonomy and negative rights**, wearing metaphysical clothing.
      *   **Presupposed:** The fundamental ethical/legal principle that a competent person has an almost absolute right to refuse unwanted bodily intrusion (a veto), even if harmful or irrational. Conversely, compelling treatment (a request enforced *on* someone) faces a much higher bar ethically and legally.
      *   **Why Psychiatric Directives are Sticky:** PADs often request *compelled* treatment (forced medication, hospitalization) on a resisting future self. This clashes violently with the strong right to refuse treatment in the *present*. The capacity threshold protects the present self's veto but struggles to justify the past self's *compulsion* of the future self, especially when the future self is actively resisting. The current self's veto power is seen as stronger than the past self's power to compel.
      *   **Minimal Identity Work:** The asymmetry doesn't stem from a different view of identity between physical and mental illness contexts. It stems from the core asymmetry between "leave me alone" (refusal) and "make them do this" (compulsion). The metaphysics of identity is secondary here.

  4.  **The Graded System Thought Experiment: Stage Perdurantism' s Natural Fit**
      *   **What it Would Presuppose:** A graded system directly presupposes **psychological connectedness/continuity as the basis for personal identity/personhood *and* moral authority**, explicitly rejecting a binary threshold. Authority over medical decisions would decay as psychological links (memory, values, endorsement, narrative sense) decay.
      *   **Metaphysical Alignment:**
          *   **Perdurantism (Stage Theory):** This is the **most natural fit**. Person-stages connected to the directive-signing stage by strong R-relations (psychological connectedness) grant it authority. As R-relations weaken to the signing stage, the directive's authority weakens, and the current stage's desires gain weight. Authority is fundamentally graded.
          *   **Perdurantism (Worm Theory):** Less natural. The whole worm is the person. While connectedness matters, authority over a temporal part might still be seen as ultimately derived from the whole worm's identity. A graded system feels more like "partial self-betrayal" than a natural consequence.
          *   **Endurantism:** Strains significantly. If the whole, identical person endures, why should their past wishes lose authority just because they change? A graded system pushes endurantism towards accepting that the "person" (in the morally relevant sense) might cease or transform, blurring into a stage-like view. It requires heavy revision.
      *   **Revisionism:** Yes, a perdurantist (especially stage theorist) could argue the current binary practice is a *pragmatic approximation* of the underlying graded reality of psychological connectedness. The law simplifies the metaphysics for the sake of workability. A perdurantist wouldn't necessarily *have* to be revisionist, but they could coherently argue that the graded view is metaphysically more accurate, even if impractical.
      *   **Current Binary vs. Metaphysics:** The honest answer is that **the existing binary is overwhelmingly driven by pragmatic/legal needs for bright lines, not by a commitment to a specific metaphysical view of persistence.** It *can* be justified *post hoc* by various views (endurantism, worm theory find it easier; stage theory can tolerate it as a rule), but it doesn't *fall out* uniquely from one. The graded view falls out more naturally from stage theory + psychological criteria.

  **Conclusion:**

  *   **Core Presupposition:** Psychological continuity as the basis for personhood and precedent autonomy + a pragmatic capacity threshold for agency.
  *   **Metaphysics:** Underdetermined. Endurantism, Worm Perdurantism, and Stage Perdurantism (with a psychological criterion) can all accommodate the practice. None is strictly presupposed.
  *   **Capacity Threshold:** Primarily a pragmatic/ethical/legal construct, not a deep metaphysical feature. It serves needs for clarity, protection from impaired decisions, and respecting past wishes.
  *   **Refusal/Request Asymmetry:** Driven by the ethical/legal primacy of the right to refuse treatment (bodily autonomy veto) vs. the difficulty of justifying compulsion. Minimal identity work.
  *   **Graded System:** Would presuppose psychological connectedness as the direct measure of moral authority. Naturally aligns with Perdurantism (Stage Theory), fits awkwardly with Worm Theory, and requires significant revision of Endurantism. It highlights that the current binary is a pragmatic simplification, not a metaphysical necessity.
  *   **Why Binary Wins (For Now):** Law and medicine crave certainty and enforceable rules. Assessing psychological connectedness in real-time clinical decisions is complex, subjective, and prone to dispute. The bright line, while philosophically crude, is administratively functional. The metaphysics, in practice, serves the pragmatics, not the other way around.
