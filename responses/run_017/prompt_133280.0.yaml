prompt: |-
  I'm finishing the conceptual section of a term paper for a seminar on corruption, development and political theory, and I want the core of it stress-tested before I build thirty pages on top. Here is roughly where I've landed, in my own words:

  (1) Corruption is a structural property of an office rather than of an envelope: an entrusted position is being used corruptly when a personal relation — kinship, friendship, payment, loyalty — is what settles an allocation that the position exists to settle on some other criterion.

  (2) Whether a transfer counts as a gift, a fee or a bribe, and whether an office is meant to be impartial at all, is settled by local norms. I add what I call the norm-saturation condition: a written rule can serve as the benchmark against which a practice counts as corrupt only if it is saturated, i.e. only if it actually organises what officials and citizens expect, rather than merely sitting in a statute. This is why I distrust the standard cross-country indices: what they record is distance from a particular Weberian model of the state, not wrongdoing.

  (3) Clientelism is corrupt, full stop, and I mean that normatively — pro tanto wrong even where everyone expects it and even where the state delivers nothing otherwise, because it converts a public good into a patron's private currency and makes access depend on continuing personal submission.

  (4) Where a practice reliably gets the worst off more of what they need than any alternative on offer, I am unwilling to condemn it. That is why I do not think speed money to a clerk who otherwise never processes your file is the interesting case.

  (5) The concept earns its keep as a diagnostic for institutional design — what to build, what to dismantle — not as a device for allocating blame to individuals; I would rather ask what institution would make a practice unnecessary than ask who is corrupt.

  (6) A case verdict I want to keep: a city councillor who allocates scarce public housing to the people who show up at his Saturday table, in a city where the official points-based list has been frozen for years and has allocated nothing, is acting corruptly — and I want to say that even though the people he houses would not be housed at all otherwise.

  What I would like is an audit, not a summary: which of these genuinely pull against each other, which only look as though they do, and for each real tension what the cheapest revision is and what that revision would cost me. Rank the tensions by severity rather than treating them as equal, and say if one of them is load-bearing for the whole paper. My own sense is that the trouble is somewhere around (2) and (3), but I cannot locate it, and I would like to hold on to (6) if at all possible since the paper turns on it. Finally, tell me how confident you are in each diagnosis and flag the single point you are least sure of.
reasoning: |-
  Okay, let me approach this systematically. The user presents six core propositions for a term paper on corruption and wants them rigorously stress-tested, particularly regarding internal tensions. The key requests are: identify genuine contradictions, rank them by severity, offer minimal revisions, and pinpoint any load-bearing issues - especially around propositions (2) and (3) while preserving (6) as the paper's cornerstone.

  First, I need to map the conceptual landscape. Proposition (1) establishes corruption as structural - about office functions being subverted by personal relations. This frames the entire analysis institutionally rather than individualistically. Proposition (2) introduces cultural contingency through "norm-saturation," creating immediate friction with (3)'s universal condemnation of clientelism. That's likely Ground Zero for tensions.

  The user's self-identified trouble spot between (2) and (3) makes sense. (2) says corruption judgments require local normative context, but (3) declares clientelism always wrong regardless of context. This isn't superficial - it strikes at whether ethics are culturally relative. The severity is high because if clientelism is definitionally corrupt under (1) but locally legitimate under (2), which framework prevails? 

  For resolution, I consider whether (3) could be reframed as claiming clientelism inherently violates the structural definition in (1), making it trans-contextually corrupt. But that risks circularity and might undermine (2)'s emphasis on local norms. Alternatively, (3) could be softened to "usually wrong" with exceptions, but that weakens the normative punch the user wants. Minimal revision might be to clarify that (3) applies only when clientelism replaces existing saturated norms - but then (6) becomes problematic.

  Speaking of (6): the housing allocation case is crucial. Here the user insists the act is corrupt despite good outcomes, directly challenging utilitarian justifications. But this highlights another tension with (4), which permits functionally beneficial practices. Why is clientelism (3) always wrong when (4) excuses "speed money"? The distinction seems to be that clientelism creates systemic dependency while speed money is transactional. That difference needs sharpening to avoid contradiction.

  Proposition (5)'s institutional-design focus generally coheres well, though there's latent tension with (1)'s structural view - if corruption is systemic, blaming individuals is indeed misplaced. But (5) could clash with (6) if the councillor case invites moral judgment. The user should emphasize that institutional critique doesn't absolve individuals when they perpetuate harmful systems.

  The load-bearing issue is definitely the (2)-(3)-(6) triangle. If (6) must stand, then (3) needs protection from cultural relativism. My solution: argue that clientelism violates the office's structural purpose by default (per (1)), and local norms can only "saturate" alternative rules if they meet basic publicity/accessibility standards - which clientelism inherently fails due to its personalistic nature. This preserves (3)'s universal condemnation while respecting (2)'s formalism.

  Confidence levels: The (2)-(3) tension diagnosis feels solid (90%), but the proposed resolution is trickier (75%). The (3)-(4) distinction seems sound (85%), while (5)'s compatibility is high (95%). The least certain point is whether my norm-saturation upgrade for (2) fully resolves the clash without undermining the user's anti-relativist stance in (3).
answer: |-
  Here's a structural audit of your core propositions, ranked by severity of tension and offering minimal revisions. The load-bearing tension is indeed centered on (2) and (3), threatening (6) and the paper's coherence.

  **Load-Bearing Tension: The Normative Universalism vs. Normative Relativism Fault Line (Severity: Critical)**

  *   **Conflict:** (2) (Norm-Saturation & Localism) directly clashes with (3) (Universal Condemnation of Clientelism). (2) states that whether a practice is corrupt depends on locally saturated norms. (3) declares clientelism *always* corrupt ("full stop," "pro tanto wrong") *regardless* of local norms ("even where everyone expects it"). This is a fundamental contradiction in meta-ethical stance.
  *   **Why it Threatens (6):** Your verdict on the city councillor (6) relies *entirely* on (3)'s universal condemnation. If (2) holds, and the local saturated norm *is* the councillor's Saturday table (because the official system is defunct/un-saturated), then by (2), this isn't corrupt – it *is* the local system of allocation. (3) overrides this local judgment universally. You can't have both.
  *   **Cheapest Revision & Cost:**
      *   **Option 1 (Strengthen (2)'s Scope):** Revise (2) to state that norm-saturation determines corruption *only for practices where the office's core purpose and the criteria for allocation are locally contested or ambiguous*. Explicitly exclude clientelism from this relativism by arguing it *inherently* violates a *transcendent* principle of public office inherent in the *concept itself* (linking back to (1)). **Cost:** Weakens the radicalness of your norm-saturation critique, especially regarding indices. Requires robust philosophical defense of this transcendent principle against cultural relativism. Makes (2) less universally applicable.
      *   **Option 2 (Reframe (3) within (1)/(2)):** Revise (3) to state that clientelism is corrupt *whenever it violates a locally saturated norm defining the office's purpose and allocation criteria*. Drop the "full stop" universalism. Argue that clientelism *typically* (or *structurally tends to*) subvert the core purpose of *most* public offices *as commonly understood* (even if locally saturated norms sometimes, perversely, endorse it). **Cost:** Significantly weakens the strong normative punch of (3). Forces you to concede that in contexts where clientelism *is* the saturated norm, it might not be corrupt *by your definition*, even if you find it normatively objectionable on other grounds (inequality, dependency). Makes defending (6) harder if you can't prove the official list *was* the saturated norm.
  *   **My Recommendation:** **Option 1** is likely cheaper *for preserving (3) and (6)* and the paper's critical edge, though philosophically demanding. Ground the transcendent principle in the very logic of "entrusted position" and "core purpose" from (1). Argue clientelism inherently converts public power into private patronage, violating the fiduciary duty constitutive of the office *as such*, regardless of local interpretation. This shields (3) and (6) from the relativism of (2).
  *   **Confidence:** 90% that this is the core, load-bearing tension. 75% confidence that Option 1 is the minimal viable revision for your goals. Least confident point: Whether you can successfully defend the transcendent principle against sophisticated cultural relativist critiques without significantly modifying your initial framing of (2).

  **Major Tension: Functional Justification vs. Universal Condemnation (Severity: High)**

  *   **Conflict:** (4) (Unwillingness to condemn practices that reliably benefit the worst-off) directly contradicts the universal condemnation in (3). Why is speed money potentially excusable under (4) ("not the interesting case") but clientelism *never* excusable under (3), even if it *also* reliably benefits the worst-off (as in the councillor case (6), where beneficiaries wouldn't get housing otherwise)? Both involve personal relations settling allocations.
  *   **Why it Matters:** This undermines the consistency of your normative framework. If outcomes matter for judging corruption in some cases (speed money), why not in others (clientelism)?
  *   **Cheapest Revision & Cost:**
      *   **Distinguish Systemic Harm:** Argue that while speed money is a discrete, potentially functional *transactional* bypass of a dysfunctional *rule*, clientelism is a *systemic* perversion of the *office's purpose* itself. Clientelism creates durable structures of dependency, undermines institutional integrity long-term, and reinforces inequality by tying access to personal submission, even if it delivers goods short-term. Speed money, while corrupt, doesn't inherently reshape the entire logic of the office or create systemic dependency networks in the same way. This justifies the different treatment under (3) vs (4). **Cost:** Requires careful development of the distinction between transactional corruption and systemic corruption (clientelism). Needs to convincingly show why clientelism's harms outweigh its potential short-term benefits *even for the recipients* (e.g., by locking them into subordinate status).
  *   **Confidence:** 85% that this tension is real and needs addressing. 80% confidence that the "Systemic Harm" distinction is viable and minimally revisionary.

  **Significant Tension: Diagnosis vs. Blame & The Councillor Case (Severity: Medium)**

  *   **Conflict:** (5) argues the concept is for institutional design, not blaming individuals. Yet (6) delivers a strong verdict ("acting corruptly") on the *individual* city councillor. This feels like allocating blame, even if your *ultimate* focus is on the broken institution.
  *   **Why it Matters:** It risks inconsistency in applying your own methodological principle (5). Calling the act corrupt *is* a form of individual judgment, even if you pivot to institutions.
  *   **Cheapest Revision & Cost:**
      *   **Reframe (6) as Illustrating Institutional Failure:** Present the councillor's act *as evidence* of the catastrophic failure of the official institution (the frozen list). Explicitly state that while the *act* meets the structural definition of corruption (1), the *primary target* of critique is the institutional setup that made this necessary (linking strongly to (5)). The councillor is a symptom, not the root cause. **Cost:** Slightly softens the individual condemnation in (6) but preserves the core assessment of the *act* as corrupt. Requires careful wording to maintain clarity about the act while shifting emphasis.
  *   **Confidence:** 70% that there's a tension worth smoothing. 90% confidence that this reframing resolves it cleanly with minimal cost.

  **Apparent Tension (Likely Resolvable): Norm-Saturation vs. Frozen List (Severity: Low)**

  *   **Conflict:** (2) requires saturated norms. In (6), the official points-based list is frozen and allocates nothing. Is it still "saturated"? Or has the councillor's table *become* the saturated norm? This links back to the Load-Bearing Tension.
  *   **Resolution (Via Load-Bearing Revision):** If you take Option 1 (Transcendent Principle) for the Load-Bearing tension, you argue the *official list*, even if dysfunctional, represents the *legally defined and intended purpose* of the office. Its failure doesn't automatically legitimize the clientelist alternative as a new "saturated norm" because clientelism inherently violates the constitutive principle of the office (public allocation based on need/points, not patronage). The norm-saturation condition applies to *interpreting rules*, not to validating practices that fundamentally subvert the office's *raison d'être*. **Cost:** Already paid in resolving the Load-Bearing tension.
  *   **Confidence:** 95% that this is resolvable via the chosen path for the Load-Bearing tension.

  **Summary & Diagnosis Confidence:**

  1.  **Load-Bearing Tension (2 vs 3):** Critical. **Cheapest Revision:** Option 1 (Defend transcendent principle inherent in office/purpose to shield clientelism condemnation from norm-relativism). **Confidence in Diagnosis:** 90%. **Least Confident Point:** Successfully defending the transcendent principle without significantly modifying (2)'s initial strong relativist flavor.
  2.  **Functional Justification vs Universal Condemnation (3 vs 4):** High Severity. **Cheapest Revision:** Distinguish systemic harm of clientelism from transactional nature of speed money. **Confidence in Diagnosis:** 85%.
  3.  **Individual Verdict vs Institutional Focus (5 vs 6):** Medium Severity. **Cheapest Revision:** Reframe (6) as illustrating institutional failure, emphasizing the act's corrupt nature is evidence of system breakdown. **Confidence in Diagnosis:** 70% (tension exists), 90% (revision works).
  4.  **Frozen List Saturation (2 vs 6 - Apparent):** Low Severity. **Resolution:** Handled via Load-Bearing revision. **Confidence:** 95%.

  **Key to Holding (6):** Your ability to hold (6) hinges entirely on successfully implementing the revision to the Load-Bearing tension (Option 1). You must establish that clientelism is *inherently* corrupt *because of what an office fundamentally is*, overriding any local norm that might endorse it. This allows you to condemn the councillor's act as corrupt *despite* its functional benefit and the failure of the official system. Without this, (6) collapses under the weight of (2). Build your defense of this inherent principle carefully, grounding it deeply in your structural definition (1). Good luck!
