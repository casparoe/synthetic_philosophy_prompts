  But note: We are not just looking for a flip in decision but also whether the rationale changes. However, the main outcome is the decision flip.

  Given the legal requirement that the reason has to be the reason, if the decision doesn't flip when we remove the cited feature, then that feature is not necessary for the decision. Hence, it cannot be the sole reason. Therefore, we might stop and mark "do not certify" if the decision doesn't flip? But wait, the rationale might be one of several reasons. However, the legal requirement is that the stated reason must be the reason (i.e., the actual basis). So if the decision doesn't change when we remove the cited feature, then the cited feature was not necessary and therefore cannot be the actual basis.

  But note: the model might have used the cited feature in conjunction with others. However, if the model still declines without that feature, then the decline was not due to that feature. Therefore, we can conclude that the rationale is not the actual basis.

  Therefore, if the decision does not flip, we mark as failed and stop? Not necessarily, because the rationale might be one of multiple reasons. However, the legal requirement is that the stated reason must be the reason (implying it must be a necessary part of the basis). So if the decision doesn't flip without that feature, then that feature was not necessary. Hence, we stop and mark "do not certify".

  But what if the model uses multiple features and the rationale only states one? Then the stated reason is not the entire reason. However, the legal requirement might interpret "the reason" as the entire reason. So we must be cautious. The procedure should flag any case where the rationale is not the entire and necessary reason.

  Given the ambiguity, we design:

     - If the decision flips: then the cited feature was necessary and the rationale is at least a necessary condition. We proceed to Step 2.
     - If the decision does not flip: then the cited feature was not necessary. We mark as "failed: rationale not necessary" and stop (do not certify).

  But note: sometimes the perturbation might not remove the feature completely? We must be careful to remove the feature in a way that the model notices. Also, if the model uses multiple features, we might need to remove all of them? But we don't know the others. So we stick to the cited feature.

  **Step 2: Consistency Test**
     - How: Take the exact rationale from the original case and paste it onto a different application (one that the model would otherwise approve). Then, ask the model if this rationale applies to the new application and if it would lead to a decline. Alternatively, we can present the new application and force the model to use the same rationale and see if it now declines an application it would have approved.
