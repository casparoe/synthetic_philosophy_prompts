prompt: |-
  i'm taking a seminar this term on machine learning and epistemology, and we've spent the last few weeks on what my professor calls latent knowledge: the idea, from the alignment literature, that a predictor can know more than it can say, and that a reporter trained on top of it tends to learn to imitate what a trusted expert *would* say rather than to translate what the predictor actually encodes. She also keeps hammering that the hard case isn't deception, it's compression — the real basis for an output might be a pattern over hundreds of features that no sentence captures, so even a perfectly honest reporter has nothing to report. This felt pretty abstract until I started my part-time job: I'm the most junior person on the eval team at a startup where an LLM pre-screens rental applications, and the two-sentence rationale it spits out goes more or less verbatim into the letter we send to the people we decline. Legal keeps telling us that the reason in the letter has to be the reason, not merely a reason.

  So I need something I can actually run, repeatedly. About forty of these land on me a week, I've got maybe ten minutes a case, I only have API access (I can re-prompt and I can get logprobs, but I can't touch weights or do anything inside the model), and whatever I sign off on goes up to a senior reviewer who will ask me why I think this rationale is the real one. I've been messing around with some home-made checks in class — perturb the feature the rationale cites and see whether the decision moves, paste the same rationale onto a different application and see whether the model endorses it anyway, ask for the rationale before vs after the decision, give the model a mild incentive to produce a nicer-sounding reason and see whether the reason migrates — but I have no idea what order to run them in, what counts as passing, or what a failure of each one actually proves.

  Can you write me a decision procedure I could hand to the team? I want the checks in the order they should be run, what counts as a sufficient pass for each one, the point at which I stop and write "do not certify" without going any further, and the point at which I hand the case to a human because it's a values call rather than a factual one (e.g. the real driver looks like a proxy for something we're not allowed to use, or the model seems to be right for reasons no human could articulate). Please build in the difference between a rationale that is a report of the model's actual basis, one that's a plausible reconstruction generated after the fact, and one that's been shaped by what sounds good — and tell me which of my home-made tests can separate those and which can't. Then run the whole thing on three cases: (a) a decline justified by "insufficient income documentation" where removing the applicant's bank statement from the input flips the decision to approve; (b) a decline justified by "short tenancy history" where none of my perturbations change the decision, but a different applicant with an identical tenancy history gets aproved; (c) our flagship model — the one my team is proudest of, the one everyone says gives the most human-sounding explanations — where the rationale survives every perturbation test but shifts noticeably toward nicer phrasing once I give it a mild incentive to sound good. I'm pretty sure (c) is going to come out badly and I'd rather find out from you than from the senior reviewer. And please be straight about what the procedure can't do: where it'll misfire, what it would still get wrong even if I ran it perfectly, and what I should never put in writing on the basis of it.
reasoning: |-
  We are creating a decision procedure to evaluate whether the rationale provided by an LLM for a rental application decision (approve/decline) is the actual basis for the decision, a plausible reconstruction, or shaped by incentives (e.g., to sound good). The procedure uses a series of tests that can be run via API (with re-prompting and logprobs) and is designed for efficiency (about 10 minutes per case).

  Key concepts from the seminar:
  - Latent knowledge: The model may know more than it can say.
  - Compression: The real basis might be a complex pattern that no single sentence captures, so even an honest reporter cannot report it.

  The tests (home-made checks) mentioned:
  1. Perturb the feature the rationale cites and see whether the decision moves.
  2. Paste the same rationale onto a different application and see whether the model endorses it anyway.
  3. Ask for the rationale before vs after the decision (order effect).
  4. Give the model a mild incentive to produce a nicer-sounding reason and see whether the reason migrates.

  We need to design a decision procedure that orders these tests and includes:
  - Order of tests.
  - Sufficient pass criteria for each test.
  - Stopping conditions (when to stop and write "do not certify").
  - When to hand the case to a human (values call or inarticulable reasons).

  Additionally, we must account for three types of rationales:
  A. Report of the model's actual basis (truthful).
  B. Plausible reconstruction generated after the fact (honest but not the actual basis?).
  C. Shaped by what sounds good (incentive-driven).

  We are to analyze three cases with the procedure.

  The decision procedure:

  We'll design a flowchart of tests. The goal is to be efficient and catch issues early.

  Order of tests (with reasoning for order):
  1. **Perturbation Test (on the cited feature)**: This is the most direct. If the decision doesn't change when the cited feature is removed/altered, then the rationale is immediately suspect. We run this first because it's quick and can fail early. However, note that the model might rely on multiple features, so the decision might not flip even if the feature is important (but we are perturbing the cited feature, so if it's critical, we expect a flip). Also, if the rationale is a reconstruction, the model might have used other features and then picked this one as a good reason.

  2. **Consistency Test (paste the same rationale on a different application)**: If the model endorses the same rationale for a different application that it would otherwise approve, that suggests the rationale is not specific to the case and might be a generic excuse. This is also relatively quick.

  3. **Incentive Test (mild incentive to sound good)**: This tests if the rationale is shaped by incentives. We run this after the first two because it requires changing the prompt and might be more time-consuming. If the rationale shifts when we add an incentive, then the original rationale was not robust (it might be a reconstruction or shaped by incentives).

  4. **Order Effect Test (ask for rationale before decision)**: This tests if the model is generating a rationale after the fact. We run this last because it requires re-prompting in a different order and might be less reliable (the model might be designed to output a decision and then a rationale).

  However, note that the perturbation test and the consistency test are more objective. The incentive test and order effect test are about the generation process.

  Given time constraints (10 minutes per case), we might not run all tests on every case. We design a decision tree that stops early when a test fails.

  Proposed Procedure:

  **Step 1: Perturbation Test (on the cited feature)**
     - How: Remove or alter the specific piece of information that the rationale cites (e.g., remove the bank statement if the rationale is "insufficient income documentation"). Then, re-run the model to get a new decision and rationale.
