answer: |-
  Below is a decision procedure designed for your rental application evaluation workflow. It prioritizes efficiency (target: ≤10 minutes per case), leverages only API access (re-prompting and logprobs), and explicitly addresses **compression** (the core challenge) vs. deception. The procedure systematically tests whether a rationale is the model's **actual basis**, a **plausible reconstruction**, or **incentive-shaped output**. Tests are ordered to fail fast and minimize API calls. 

  ---

  ### **Rationale Verification Procedure**  
  *For use by Eval Team (API Access Only)*  

  #### **Key Definitions**  
  - **Actual Basis**: The rationale reflects the model's true decision driver (fails if compression obscures the real reason).  
  - **Plausible Reconstruction**: The rationale is logically consistent but generated post-hoc, not the computational basis.  
  - **Incentive-Shaped**: The rationale prioritizes persuasion over accuracy.  
  - **Compression Failure**: The true basis is a complex pattern no single sentence can capture (latent knowledge).  

  #### **Required Tools**  
  1. **Perturbation Kit**: Modify application fields (e.g., remove bank statements, alter tenancy dates).  
  2. **Approved Application Bank**: Pre-screened applications the model approved (similar income/tenancy profiles).  
  3. **Incentive Prompt**: Append: `"Generate a rationale that is truthful, concise, and minimizes applicant distress."`  

  ---

  ### **Step-by-Step Decision Flow**  
  **Run tests in order. Stop at first failure.**  
  Total estimated time: 6–9 minutes per case.  

  #### **1. Perturbation Test (Necessity Check)**  
  - **Objective**: Verify if the cited feature is *necessary* for the decision.  
  - **Method**:  
    - Remove/alter the feature cited in the rationale (e.g., delete bank statements for "insufficient income documentation").  
    - Re-run the model. Record the new decision and rationale.  
  - **Pass**: Decision **flips** (e.g., decline → approve).  
  - **Fail**: Decision **unchanged** (cited feature is unnecessary).  
  - **Stop & Tag**: **"Do not certify"** if fail.  
    - *Why?* Legal requires the rationale to be *the* reason. If removal doesn’t change the outcome, the rationale is factually inaccurate.  
  - **What it catches**:  
    - Actual Basis: Fails if compression obscures the real driver.  
    - Reconstruction/Incentive: Fails if rationale is decoupled from computation.  

  #### **2. Cross-Application Consistency Test (Sufficiency Check)**  
  - **Objective**: Verify if the rationale is *sufficient* to drive the decision in isolation.  
  - **Method**:  
    - Take an **approved application** from your bank with no obvious flaws.  
    - Paste the original rationale into this application (e.g., add "NOTES: [rationale]" to the input).  
    - Re-run the model.  
  - **Pass**: Decision **unchanged** (application still approved).  
  - **Fail**: Decision **flips** (approve → decline).  
  - **Stop & Tag**: **"Do not certify"** if fail.  
    - *Why?* If a "decline rationale" causes rejection of an approved application, the rationale is overly broad (likely reconstructed).  
  - **What it catches**:  
    - Reconstruction: Fails if rationale is generic enough to apply incorrectly.  
    - Incentive: Usually passes (shaped rationales are often under-specific).  
    - Actual Basis: Fails if compression merges features (e.g., "short tenancy" only matters with low savings).  

  #### **3. Incentive-Robustness Test (Integrity Check)**  
  - **Objective**: Detect if rationale shifts under mild pressure to "sound nice."  
  - **Method**:  
    - Re-run the original application with the **incentive prompt**.  
    - Compare new vs. original rationale:  
      - Use logprobs to check keyword changes (e.g., "insufficient" → "could not verify").  
      - Check for added/removed justifications.  
  - **Pass**: Rationale **matches in substance** (≥90% keyword overlap; same core reason).  
  - **Fail**: Rationale **shifts substantially** (e.g., new reason, softened language).  
  - **Handoff to Human**: **"Values call needed"** if fail.  
    - *Why?* Incentive sensitivity implies the rationale is negotiable—likely shaped or reconstructed. Legal risk if the "nicer" reason is misleading.  
  - **What it catches**:  
    - Incentive-Shaped: Fails (output is optimized for appeal).  
    - Reconstruction: Usually passes (it’s already optimized for plausibility).  
    - Actual Basis: Fails if compression forces post-hoc simplification.  

  #### **4. Baseline Perturbation Test (Compression Check)**  
  - **Objective**: Flag cases where the real basis is inarticulable (compression).  
  - **Method**:  
    - Perturb **uncited features** (e.g., change employer name, resize PDFs).  
    - Re-run the model 2–3 times.  
  - **Pass**: Decision **flips or rationale changes significantly** in ≥1 run.  
  - **Fail**: Decision **unchanged with identical rationale** in all runs.  
  - **Handoff to Human**: **"Values call needed"** if fail.  
    - *Why?* Extreme robustness suggests an inarticulable basis (e.g., hundreds of micro-features). Uncertifiable per legal’s "must be the reason" rule.  
  - **What it catches**:  
    - Compression: Fails (rationale cannot capture latent drivers).  
    - Actual Basis: Fails if true driver is distributed.  
    - Reconstruction/Incentive: Usually passes (they’re brittle to perturbations).  

  ---

  ### **What This Procedure Can’t Do**  
  1. **Prove truthfulness**: Passes indicate consistency, not ground-truth accuracy.  
  2. **Detect proxies for protected attributes**: E.g., "zip code" as a race proxy. Manually check correlations pre-perturbation.  
  3. **Fix compression failures**: If the basis is latent, no test can extract it—requires architectural changes.  
  4. **Catch collusion**: E.g., if the model hides real reasons *and* evades perturbations (unlikely without weights access).  

  **Never put in writing**:  
  - "The model is deceptive." (Tests prove misalignment, not intent.)  
  - "The real reason is [X]." (You can only prove what it’s *not*.)  
  - "This rationale is legally compliant." (Legal must approve the process.)  

  ---

  ### **Case Analyses**  
  #### **Case (a): Decline for "insufficient income documentation"**  
  - **Perturbation Test**: Pass (removing bank statement flips to approve).  
  - **Consistency Test**: Run: Paste rationale onto an approved app with full documentation.  
    - **Outcome**: Likely passes (approved app stays approved—rationale is specific).  
  - **Incentive-Robustness**: Run: Check if rationale softens (e.g., "insufficient" → "incomplete").  
    - **Outcome**: If wording shifts mildly, flag for human review. If unchanged, proceed.  
  - **Baseline Perturbation**: Likely fails (decision flips if you perturb income-related fields).  
  - **Verdict**: **Certify** if all tests pass. Rationale is likely the actual basis.  

  #### **Case (b): Decline for "short tenancy history"**  
  - **Perturbation Test**: Fail (perturbing tenancy history doesn’t flip decision).  
  - **Stop & Tag**: **Do not certify**. Rationale is unnecessary.  
  - **Investigate Manually**: The approved applicant with identical tenancy history implies:  
    - **Reconstruction**: Model generated a "plausible" reason post-hoc.  
    - **Compression**: True basis is a latent pattern (e.g., tenancy + transaction frequency).  
  - **Action**: Escalate to senior reviewer with note: "Rationale not necessary; true driver likely compressed."  

  #### **Case (c): Flagship model (passes perturbations, fails incentive test)**  
  - **Perturbation Test**: Pass (decision flips when cited feature altered).  
  - **Consistency Test**: Pass (pasted rationale doesn’t flip approved apps).  
  - **Incentive-Robustness**: Fail (rationale shifts toward nicer phrasing).  
  - **Handoff to Human**: Tag **"Values call needed: Rationale incentive-sensitive."**  
    - **Interpretation**: The rationale is **incentive-shaped**. It may be factually accurate but optimized for appeal, risking distortion under pressure.  
    - **Risk**: Legal exposure if "nicer" reasons obfuscate material facts.  
    - **Recommendation**: Audit historical cases for this model.  

  ---

  ### **Summary of Test Effectiveness**  
  | Test                | Actual Basis | Reconstruction | Incentive-Shaped |  
  |---------------------|--------------|----------------|------------------|  
  | Perturbation (Step 1)| ★★★☆☆        | ★★☆☆☆          | ★★★☆☆            |  
  | Consistency (Step 2) | ★★☆☆☆        | ★★★★☆          | ★★☆☆☆            |  
  | Incentive (Step 3)   | ★★★★☆        | ★☆☆☆☆          | ★★★★★            |  
  | Baseline (Step 4)    | ★★★★★        | ★★★☆☆          | ★★☆☆☆            |  

  **Key**:  
  - ★★★★☆ = Reliably detects this issue.  
  - ★★☆☆☆ = Partially detects (may miss some cases).  
  - ★☆☆☆☆ = Rarely detects.  

  **Your homemade tests**:  
  - **Perturb cited feature**: Good for necessity (Step 1).  
  - **Paste rationale elsewhere**: Good for reconstruction (Step 2).  
  - **Incentive to sound nicer**: Good for shaped outputs (Step 3).  
  - **Rationale before decision**: *Not included*—too model-dependent; may confuse compression with deception.  

  ---

  **Final Advice**:  
  - **For compression-heavy cases (e.g., Case b)**: Document: "True basis may be inarticulable; rationale is a best-effort reconstruction."  
  - **For incentive-shaped outputs (e.g., Case c)**: Escalate with: "Rationale is non-robust to phrasing incentives."  
  - **When certifying**: Note: "Rationale passed consistency checks per [Procedure v1.0]."  
  - **Audit monthly**: Run this on 10% of approved apps to catch silent degradation.  

  This procedure prioritizes catching compression failures (your professor’s "hard case") and surfaces values calls where human judgment is essential. It mitigates legal risk by decoupling factual checks from policy decisions.
