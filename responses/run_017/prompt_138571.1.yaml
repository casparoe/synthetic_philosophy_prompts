  ### Session Plan: Deference to Objective Chance

  #### **Materials List**
  1. Projector for displaying instructions and scoreboards
  2. Handouts (3 pages: Stage 1/2 rules, Stage 3 frequency table, scoring examples)
  3. Index cards (14 participants × 30 trials = 420 cards)
  4. Pre-committed outcome lists for all stages (printed for transparency)
  5. Physical "chance box" with removable "RED 80%" label
  6. Two-colored lamp (red/green LED) for Stage 3
  7. Whiteboard for tracking scores

  ---

  ### **Timeline (Total: 90 min)**
  1. **Intro (5 min)**: Rules and scoring
  2. **Stage 1 (20 min)**: Fixed 80% chance
  3. **Stage 2 (20 min)**: Uncertain chance setting
  4. **Stage 3 (25 min)**: Lamp indicator
  5. **Debrief (20 min)**: Concepts and Q&A

  ---

  ### **Handout Texts**
  **Page 1: Rules & Scoring (Stages 1-2)**  
  > "Report credence *p* (0–1) for next ball being RED.  
  > **Scoring**: If RED: Score = \(10 - 100(1-p)^2\)  
  > If WHITE: Score = \(10 - 100p^2\)  
  > *Example*: Report 0.8 → RED: 10 - 100(0.04) = 6 | WHITE: 10 - 100(0.64) = -54"  

  **Page 2: Stage 3 Frequency Table**  
  > | Lamp | Total runs | RED runs | RED % |
  > |------|------------|----------|-------|
  > | ON   | 207       | 188      | 90.8% |
  > | OFF  | 93        | 52       | 55.9% |
  > | TOTAL | 300      | 240      | 80.0% |  

  **Page 3: Brier Score Explanation**  
  > "Your score measures accuracy. Higher = better.  
  > Best strategy: Report your *true* confidence."  

  ---

  ### **Facilitator Script**
  #### **Intro (5 min)**  
  "Welcome! We’ll predict RED/WHITE balls from this box. Each round:  
  1. Write your credence *p* (0–1) on a card  
  2. I reveal outcome from *this pre-printed list* [hold up list]  
  3. Calculate score using handout formula  
  Goal: Maximize your score. Scoring penalizes over/under-confidence. Ask if formula unclear!"  

  #### **Stage 1: Fixed Chance (20 min)**  
  *Box displays "RED 80%"*  
  "Box is set: 80% RED chance. We’ll do 10 trials. Report *p* before each outcome.  
  Remember: Score reflects *this trial only* – no 'long run' compensation.  
  [After trial 3]: Notice scores dropping if you strayed from 0.8? That’s the cost of hunches."  
  *Pre-committed outcomes (10 trials): 8 RED, 2 WHITE (e.g., R,W,R,R,R,R,W,R,R,R)*  

  #### **Stage 2: Uncertain Setting (20 min)**  
  *Remove "80%" label*  
  "Now, hidden setting changes each trial:  
  - 70% chance it’s a *Type A* box (70% RED)  
  - 30% chance it’s a *Type B* box (90% RED)  
  Before you commit, I’ll flash a card: 'A?' or 'B?'. It’s right 75% of the time. Use this signal."  
  *Pre-committed setup:  
  - Settings: A,A,B,A,B,A,A,B,A,B (3 B’s)  
  - Signals: Correct for 7/10, errors on Trials 3 (says B for A), 8 (says A for B)  
  - Outcomes: Match settings (e.g., if A: 7/10 RED; if B: 9/10 RED)*  

  #### **Stage 3: The Lamp (25 min)**  
  *Reattach "RED 80%" label; turn on lamp*  
  "Same box, but now this lamp flashes before each drop. You’ve seen its track record [gesture to handout].  
  I’ll reveal if lamp is ON/OFF before you commit *p*. Unconditional RED chance is still 80%."  
  *Pre-committed lamp/outcomes (10 trials):  
  - Lamp ON (7 trials): 6 RED, 1 WHITE  
  - Lamp OFF (3 trials): 2 RED, 1 WHITE  
  (Consistent with P(RED|ON)=0.85, P(RED|OFF)=0.5 while marginal P(RED)=0.8)*  

  ---

  ### **Debrief (20 min)**  
  **Key Concepts Script:**  
  "Stage 1: The '80%' forced you to 0.8 because *no other info existed*. Reporting otherwise cost you.  
  Stage 2: You took an *expectation* over chances (weighted avg of 70%/90%). That’s different from deferring to a known chance.  
  Stage 3: The lamp moved the goalposts. True chance *given the lamp* was ~91% or ~56% – deferring to 80% was wrong. The norm is: **Defer to the *current* objective chance, conditional on *all* your evidence.**"  

  **Responding to Predictable Issues:**  
  | Issue | Response |  
  |-------|----------|  
  | "I got lucky with 0.99!" | "Scoring rules punish variance. Over 100 trials, 0.99-guessers would lose." |  
  | "I don’t have precise credences" | "Report the number you’d bet your coffee on. Scoring forces coherence." |  
  | "Stage 3 felt like hunches" | Contrast: Hunches lack track records. Lamp had 300-run public data → *objective* conditional chance." |  
  | "Why not just use frequencies?" | "Frequencies *reveal* the chance. But if you used Bayes on the table, you got P(RED\|ON)=188/207≈0.91 – same as deferring to the *conditional* chance. They coincide here." |  

  **What This Can’t Do:**  
  - **One-shot justification**: Scoring is long-run; the norm is single-case. We’ll discuss why we accept this post-activity.  
  - **Chance metaphysics**: Assumes chances exist; doesn’t argue for them.  
  - **Adversary round**: Not today – that explores *evidential vs causal* decision theory.  

  **Final Note**:  
  "The '80%' was the *past* chance. Once the lamp flashes, chance evolves. Admissible evidence is what the current chance *doesn’t already reflect*. The lamp was admissible; a crystal ball showing the future outcome wouldn’t be."  

  --- 

  ### **Mechanics & Numbers (For Your Prep)**
  **Stage 3 Arithmetic**  
  - Let \( H \) = Hi chance (0.95 RED), \( L \) = Lo chance (0.45 RED)  
  - \( P(H) = 0.7 \), \( P(L) = 0.3 \) → Marginal \( P(\text{RED}) = 0.7 \times 0.95 + 0.3 \times 0.45 = 0.80 \)  
  - Lamp: \( P(\text{ON}|H) = 0.9 \), \( P(\text{ON}|L) = 0.2 \)  
  - \( P(\text{RED}|\text{ON}) = \frac{P(\text{RED} \cap \text{ON})}{P(\text{ON})} = \frac{0.7 \times 0.95 \times 0.9 + 0.3 \times 0.45 \times 0.2}{0.7 \times 0.9 + 0.3 \times 0.2} = \frac{0.5985 + 0.027}{0.63 + 0.06} = \frac{0.6255}{0.69} \approx 0.906 \)  
  - \( P(\text{RED}|\text{OFF}) = \frac{0.7 \times 0.95 \times 0.1 + 0.3 \times 0.45 \times 0.8}{0.7 \times 0.1 + 0.3 \times 0.8} = \frac{0.0665 + 0.108}{0.07 + 0.24} = \frac{0.1745}{0.31} \approx 0.563 \)  
  - **Frequency table**: Generated from 300 runs using above probs (rounded counts: 188/207≈90.8% ON, 52/93≈55.9% OFF).  

  **Why Brier Score?**  
  - Strictly proper → incentives honest reporting.  
  - Quadratic penalty harsh on extremes (e.g., report 0.999 on WHITE: score = \(-100 \times (0.999)^2 \approx -99.8\) vs \(-64\) for 0.8).  

  **Pre-commitment Transparency**  
  - Print all outcome lists (Stages 1–3) for participants to hold.  
  - Use physical dice/coins to generate lists in advance if challenged.  

  --- 

  ### **Session Arc (10 Bullets)**  
  1. **Intro**: Participants learn scoring; goal is score maximization.  
  2. **Stage 1**: Report credence for known 80% chance box.  
     → *Conclude*: Straying from 80% lowers scores; hunches fail.  
  3. **Stage 2**: Report credence with noisy signal about hidden setting.  
     → *Conclude*: Rational credence = expected chance (not 80%).  
  4. **Stage 3**: Report credence with lamp signal and frequency table.  
     → *Conclude*: Deferring to 80% ignores lamp; conditional chance ≠ marginal.  
  5. **Debrief concept 1**: Stage 1 shows deference to known chance is single-case norm.  
  6. **Debrief concept 2**: Stage 2 distinguishes chance from credence (as expectation).  
  7. **Debrief concept 3**: Stage 3 shows chance evolves; admissible evidence matters.  
  8. **Reveal mechanism**: Lamp leaks info about hidden Hi/Lo setting.  
  9. **Moral**: Defer to *current* chance given *all* evidence—not the printed number.  
  10. **Q&A**: Address paradoxes, limitations, and link to Lewis.  

  Adjust if this arc misaligns with your vision!
