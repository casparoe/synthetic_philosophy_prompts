prompt: |-
  hey — I'm a 4th-year PhD student, I work on chance and credence, and I've been asked to run a one-off 90-minute session for our "Probability and Rationality" reading group. About 14 people: mostly advanced undergrads, a few grad students from other areas, maybe a visiting econ person. Room has a projector, I can print handouts, no laptops for them. Assume they've heard of Lewis but haven't actually read the paper.

  I want the session built around deference to objective chance: if you learn the chance of A is 0.8 and you've got nothing special going on, your credence in A should be 0.8, and that's supposed to be a normative constraint on the single case, not advice about how to do if you're going to bet many times.

  You are a formal epistemologist / decision theorist who has taught this material a dozen times. Please think it through properly rather than giving me something generic. Start with a ~10-bullet sketch of just the arc (what participants do in each stage, what they'll conclude at the end of it) before you write the full plan, so I can redirect you if you've got the shape wrong. Then give me the whole thing as a printable session plan: materials list, timeline in minutes adding to 90, the handout text, and the handful of lines of facilitator script (I'm bad at improvising).

  Hard constraints:
  - No lecture up front. They should not hear the expressions "Principal Principle" or "admissible evidence" until the last 15 minutes. I'm naming them for you, not for them.
  - The idea has to show up in what happens to them, not in what I say afterwards.
  - Points or play money, no real stakes. And no one should be able to accuse me of fudging the randomisation — tell me how to pre-commit the outcome list in front of them.

  The three-stage thing I have in mind (fix it if it's wrong):

  1. A box I'll build with a number printed on the side, "RED 80%". Each trial they write a number on an index card, I read the outcome off a pre-generated list, we score them. Your call on the scoring rule — log, Brier, something else — but justify it and tell me how you'd handle someone who reports 0.999 and then gets it wrong. The point of this stage: they should feel the pull of "sure, 80% in the long run, but *this* trial could go either way, I've got a feeling about it," and then watch that feeling cost them.

  2. Same box, but now the number on the side is covered and the setting for each round is drawn from a known small set, and they get a noisy peek at the setting before committing. Here the right move is to take an expectation over the chances. This stage is supposed to make visible that the 0.8 in stage 1 was doing something different from any averaging.

  3. The sting. Same box, same printed "RED 80%", but now there's a lamp that either flashes or doesn't, just before the ball drops. The mechanism — which I reveal only in the debrief — is a wheel spun first inside the box: sector Hi makes the ball land red with chance 0.95, sector Lo with chance 0.45, wheel comes up Hi with chance 0.7, so the chance over a run really is 0.80 and that's what the printed number refers to. The lamp is a leaky indicator of the sector (say 0.9 if Hi, 0.2 if Lo). So the lamp is a genuine common cause: the outcome isn't settled when it lights, and seeing it tells you nothing about the machine's design or the printed number, the unconditional chance stays 0.80 either way. Participants get none of this. What they get is a printed table of the last 300 runs: how often the lamp lit, and how often red came up on lamp runs vs no-lamp runs. Then they commit a number.

  Pick the actual numbers yourself, but they have to satisfy: the marginal chance is genuinely 0.80 whatever the lamp does; the conditional chance given lamp-on differs from 0.80 by at least ten points (I'd like it vivid — think 0.9 vs 0.55, not 0.82 vs 0.78); and the frequency table is consistent with the mechanism without giving it away. Show the arithmetic, I will definitly get it wrong otherwise.

  What I think the moral is, so you can push back: the norm was never "report the number printed on the box." It's deference to the chance of the outcome given everything about the past that you've got — the chance as of now, which has moved on from 0.80. The lamp-users weren't violating the norm, they were deferring to a better-specified chance, and the people who obeyed the printed number were deferring to the chance at the wrong time. Tell me if that's the wrong way to put it. Also: does the person who just does Bayes on the printed frequencies land on the same number as the conditional-chance deferrer, and is there any case you can think of where the two routes come apart? If there isn't, say so honestly.

  Debrief:
  - Map specific moments onto specific parts of the view (stage 1 → the constraint bearing on a single case; stage 2 → credence as expected chance and why that's a different thing; stage 3 → conditional chances, chances evolving, and the fact that "admissible" is doing more work than it looks).
  - The wrong answers in the order they'll actually come up, and what I say to each.
  - What will predictably go wrong when I run it. I already know about: someone getting lucky with overconfidence on 30 trials; someone saying they don't have credences that precise; the risk that stage 3 just looks like stage 1's hunches with extra steps — I need the materials to make a contentless hunch and a signal with a published track record feel completely seperate. Anything else?
  - A frank note on what the activity can't do. I'm pretty sure it can't touch the one-shot justification (the game's whole force is long-run, and the norm is supposed to hold for a one-off event) and it obviously can't say anything about whether there are objective chances in the first place. I also don't see how to keep the "write the number you'd want if this were the only trial ever" framing without the scoring pressure quietly being aggregate pressure — tell me how to handle that, or tell me to drop it. What else will I have to supply by just talking at them?

  Don't try to squeeze in undermining / self-effacing chances, there isn't room. Optional: someone suggested a fourth round where the setting is chosen by an adversary who reads your card first — tell me if that belongs or if it's a seperate problem entirely.
reasoning: |-
  We are designing a 90-minute session on deference to objective chance, centered around a three-stage activity. The goal is to lead participants to discover the Principal Principle and the concept of admissible evidence through experiential learning, without lecturing upfront. The session will use a physical box with a chance mechanism, and participants will report credences which are scored with a proper scoring rule.

  ## Core Learning Objectives:
  1. **Stage 1 (Baseline):** Participants experience the pull to deviate from the stated chance (80%) due to "hunches" and see that such deviations are penalized in the long run. This establishes the normative force of the Principal Principle for a single case.
  2. **Stage 2 (Expected Chance):** Participants learn that when the chance setting is unknown but drawn from a known distribution, the rational move is to set their credence to the expected chance. This distinguishes between the chance and the credence (which is an expectation over chances).
  3. **Stage 3 (Conditional Chance):** Participants are given a signal (a lamp) that is correlated with the outcome. The unconditional chance is still 80%, but the conditional chance given the lamp is different. This shows that the chance to defer to is the current chance, conditional on all available evidence (including the lamp), and that the printed chance (80%) is no longer the one to defer to once the lamp provides additional information.

  ## Constraints:
  - No mention of "Principal Principle" or "admissible evidence" until the debrief.
  - The activity must be hands-on, with pre-committed random outcomes to ensure transparency.
  - Scoring: We use the Brier scoring rule because it is strictly proper and penalizes both overconfidence and underconfidence in a way that is easy to explain and compute. For a reported credence `p` and outcome `x` (1 if the event occurs, 0 otherwise), the score is: `-(x - p)^2`. We want to maximize the score (so less negative is better). Alternatively, we can use the linear scoring rule for simplicity, but Brier is more standard in epistemology.

  ### Handling extreme reports (like 0.999) in Stage 1:
  - We pre-commit to a sequence of outcomes (e.g., 30 trials) and use the Brier score. If someone reports 0.999 and the outcome is 0 (not red), they get a score of `-(0 - 0.999)^2 = -0.998001`. If they had reported 0.8, they would have gotten `-(0-0.8)^2 = -0.64`, which is much better. We can show this comparison to illustrate the cost of overconfidence.

  ## Stage 3 Mechanism and Numbers:
  We design the mechanism as follows:
  - A wheel inside the box has two sectors: Hi (chance of red: 0.95) and Lo (chance of red: 0.45).
  - The wheel comes up Hi with probability 0.7 and Lo with probability 0.3. So the overall chance of red is: `0.7 * 0.95 + 0.3 * 0.45 = 0.665 + 0.135 = 0.80`.
  - The lamp is an indicator of the sector. We set the lamp to light with probability 0.9 when the sector is Hi and 0.2 when the sector is Lo. This is a "leaky" indicator.
  - We need the conditional chance of red given the lamp to be substantially different from 0.80. Let's compute:

  ### Conditional probabilities:
  We want the frequency table for 300 runs. We'll generate expected frequencies.

  First, the joint probabilities:

  - P(Hi) = 0.7, P(Lo) = 0.3
  - P(Lamp|Hi) = 0.9, P(no Lamp|Hi) = 0.1
  - P(Lamp|Lo) = 0.2, P(no Lamp|Lo) = 0.8

  Then:
  - P(Hi and Lamp) = 0.7 * 0.9 = 0.63
  - P(Hi and no Lamp) = 0.7 * 0.1 = 0.07
  - P(Lo and Lamp) = 0.3 * 0.2 = 0.06
  - P(Lo and no Lamp) = 0.3 * 0.8 = 0.24

  Now, the marginal probability of Lamp: P(Lamp) = 0.63 + 0.06 = 0.69
  P(no Lamp) = 0.07 + 0.24 = 0.31

  Now, the conditional chance of red given the lamp state:

  Given Lamp:
  - P(red | Lamp) = P(red | Hi and Lamp)*P(Hi|Lamp) + P(red | Lo and Lamp)*P(Lo|Lamp)
  But note: once the sector is fixed, the chance of red is independent of the lamp. So:
  P(red | Lamp) = P(red | Hi) * P(Hi | Lamp) + P(red | Lo) * P(Lo | Lamp)

  We need P(Hi | Lamp) and P(Lo | Lamp):
  P(Hi | Lamp) = P(Hi and Lamp) / P(Lamp) = 0.63 / 0.69 ≈ 0.9130
  P(Lo | Lamp) = 0.06 / 0.69 ≈ 0.0870

  Thus:
  P(red | Lamp) = 0.95 * 0.9130 + 0.45 * 0.0870 ≈ 0.86735 + 0.03915 ≈ 0.9065

  Similarly, for no Lamp:
  P(Hi | no Lamp) = 0.07 / 0.31 ≈ 0.2258
  P(Lo | no Lamp) = 0.24 / 0.31 ≈ 0.7742
  P(red | no Lamp) = 0.95 * 0.2258 + 0.45 * 0.7742 ≈ 0.21451 + 0.34839 ≈ 0.5629

  So we have:
  - P(red | Lamp) ≈ 0.9065 (about 90.65%)
  - P(red | no Lamp) ≈ 0.5629 (about 56.29%)

  These are both substantially different from 0.80 (90.65% is about 10.65 points above, 56.29% is about 23.71 points below). We can round these for the frequency table to whole numbers to avoid decimals.

  ### Frequency Table for 300 runs:
  We'll compute the expected frequencies for 300 runs:

  - Total runs: 300
  - Lamp on: 0.69 * 300 = 207
  - Lamp off: 0.31 * 300 = 93

  Now, for lamp on:
  - From Hi: 0.63 * 300 = 189 runs, of which red: 189 * 0.95 ≈ 179.55 → round to 180 red
  - From Lo: 0.06 * 300 = 18 runs, of which red: 18 * 0.45 ≈ 8.1 → round to 8 red
  Total red when lamp on: 180 + 8 = 188
  Total runs with lamp on: 207
  So frequency of red given lamp on: 188/207 ≈ 90.82% (we'll report 188 red out of 207)

  For lamp off:
  - From Hi: 0.07 * 300 = 21 runs, of which red: 21 * 0.95 ≈ 19.95 → round to 20 red
  - From Lo: 0.24 * 300 = 72 runs, of which red: 72 * 0.45 ≈ 32.4 → round to 32 red
  Total red when lamp off: 20 + 32 = 52
  Total runs with lamp off: 93
  Frequency: 52/93 ≈ 55.91% (we'll report 52 red out of 93)

  Overall red: 188 (lamp on) + 52 (lamp off) = 240, which is 240/300 = 80%.

  We present the table as:

  | Lamp State | Number of Runs | Red Outcome | Red Fraction |
  |------------|----------------|-------------|-------------|
  | On         | 207           | 188         | 90.8%       |
  | Off        | 93            | 52          | 55.9%       |
  | **Total**  | **300**       | **240**     | **80.0%**   |

  This table clearly shows that the lamp is informative.

  ## Session Plan Sketch (10-bullet arc):

  1. **Introduction (5 min):** Explain the setup (a box that produces red or white balls with a known chance) and the task (report a number between 0 and 1 representing your confidence that the next ball will be red). Explain the scoring rule (Brier score) and that we'll do several rounds. Emphasize that the goal is to maximize their score.

  2. **Stage 1: Fixed Chance (25 min)**
     - The box is labeled "RED 80%". 
     - Participants write their credence for red on an index card for each of 10 trials (we do 10 to get enough data without taking too long). 
     - The facilitator reads outcomes from a pre-generated list (with 80% red) and records the outcomes. 
     - After each trial, participants compute their Brier score for that trial and keep a running total. 
     - **Goal:** Participants see that deviating from 0.8 (e.g., due to hunches) leads to lower scores. The printed chance is the one to defer to.

  3. **Stage 2: Unknown Setting (20 min)**
     - The box now has a covered label. The facilitator explains that the chance setting is drawn at the start of each trial from a known distribution: 60% chance of being a 70%-red box and 40% chance of being a 95%-red box. (The expected chance is 0.6*0.7+0.4*0.95=0.42+0.38=0.80, same as before.) 
     - Before each trial, the facilitator draws a setting (from a pre-committed list) and gives a noisy signal (e.g., a card that says "probably 70%" or "probably 95%" with some error rate). 
     - Participants use the signal to update their credence. 
     - They report their credence for 10 trials. 
     - **Goal:** They learn to compute the expected chance given the signal, and see that the rational credence is not 0.8 but the conditional expectation.

  4. **Stage 3: The Lamp (25 min)**
     - The box is back to being labeled "RED 80%", but now there's a lamp that may light before the ball drops. 
     - Participants are given the frequency table from 300 past runs (above) and told that the lamp is predictive. 
     - For each of 10 trials, the lamp state is revealed (from a pre-generated list consistent with the mechanism) before they report their credence. 
     - **Goal:** They should condition on the lamp. Those who stick to 0.8 will be penalized relative to those who use the conditional frequencies (e.g., report about 0.91 when lamp is on, 0.56 when off).

  5. **Debrief (15 min):** 
     - Reveal the mechanism of the box and lamp. 
     - Map the stages to the concepts: Stage 1 shows the Principal Principle (defer to the known chance), Stage 2 shows that credence is expected chance (when chance is unknown), Stage 3 shows that the chance to defer to is the current chance (conditional on the lamp) and that the printed chance is no longer admissible once the lamp is observed. 
     - Discuss the norm: it's about the chance at the time, given all available evidence. 
     - Address wrong answers and questions.

  ## Materials List:
  - A box (or a picture of a box) labeled "RED 80%" for stages 1 and 3. For stage 2, cover the label.
  - Index cards (at least 14 participants * 30 trials = 420 cards, but we can use one per trial per participant) OR a single sheet per participant for all trials (handout with tables).
  - Pre-generated outcome lists for each stage (10 trials per stage) for the box and for the lamp. For transparency, print these lists on a handout for participants to see at the start of each stage.
  - Handout for Stage 3 with the frequency table.
  - Scoring rule explanation handout (Brier score formula and example).
  - Whiteboard or projector for displaying scores and outcomes.

  ## Timeline (90 minutes total):
  - **0-5 min:** Introduction and rules.
  - **5-30 min:** Stage 1 (10 trials, each trial: report, reveal outcome, compute score).
  - **30-50 min:** Stage 2 (10 trials, with signal and setting).
  - **50-75 min:** Stage 3 (10 trials, with lamp signal).
  - **75-90 min:** Debrief and discussion.

  ## Detailed Session Plan:

  ### Introduction (5 minutes)
  - Facilitator script: "Welcome! Today we're going to explore how we should set our beliefs when we have information about chances. We have a machine that produces red or white balls. In each round, you'll write down a number between 0 and 1 representing your confidence that the next ball will be red. We'll score your report using the Brier scoring rule: if you report `p` and the ball is red, you get `-(1-p)^2`; if it's white, you get `-(0-p)^2 = -p^2`. Your goal is to make your score as high as possible (less negative is better). We'll do several rounds and add up your scores. Let's start!"

  ### Stage 1: Fixed Chance (25 minutes)
  - **Setup:** Show the box labeled "RED 80%". Explain: "This machine has a known chance of 80% for red. We'll run 10 trials. Before each trial, write your credence on the card. I'll then reveal the outcome from a pre-generated list that I'll show you now." (Display the list of 10 outcomes, generated with 80% red, e.g., 8 red and 2 white in a random order. Pre-commit to the list and hand out a copy to each participant.)
  - **Trial procedure:**
    1. Participants write their credence for the next trial on a card.
    2. Facilitator collects the cards (or they hold them up) and then reads the outcome from the list.
    3. Participants calculate their Brier score for that trial and update their total.
    4. Facilitator may display the outcome and ask a few participants to share their reported credence and score (to build engagement and show variation).
  - **Expected behavior:** Some may report 0.8, others might deviate (e.g., 0.9 or 0.7) due to hunches. Over 10 trials, the 0.8 reporters will have the best scores. 
  - **Handling extreme reports:** If someone reports 0.999 and the outcome is white, they get a very bad score. Point out that even if they are right 80% of the time, the optimal report is 0.8 because of the quadratic penalty.

  ### Stage 2: Unknown Setting (20 minutes)
  - **Setup:** Cover the label on the box. Explain: "Now the machine has a hidden setting. Before each trial, I will randomly select one of two settings: a '70% red' setting (with probability 60%) or a '95% red' setting (with probability 40%). But I won't tell you the setting. Instead, I'll give you a noisy signal: a card that says either '70% likely' or '95% likely'. The signal is correct 80% of the time. Then you'll report your credence for red."
  - **Mechanics:**
    - Pre-generated list of 10 settings (drawn from 60% for 70% and 40% for 95%) and corresponding signals (with 80% accuracy). E.g., if the setting is 70%, then signal is "70% likely" with 0.8 chance, and "95% likely" with 0.2 chance. Similarly for 95% setting.
    - Expected chance given the signal:
      - If signal is "70% likely": 
        P(setting=70% | "70% likely") = (0.6 * 0.8) / (0.6*0.8 + 0.4*0.2) = 0.48 / (0.48+0.08) = 0.48/0.56 ≈ 0.857
        Then the expected chance of red is 0.857*0.7 + (1-0.857)*0.95 ≈ 0.6 + 0.13565 ≈ 0.73565? Let me compute:
        Actually, the chance of red is the expectation over the setting: 
        P(red | signal) = P(red | setting=70%) * P(setting=70% | signal) + P(red | setting=95%) * P(setting=95% | signal)
        = 0.7 * 0.857 + 0.95 * (1-0.857) = 0.7*0.857 + 0.95*0.143 ≈ 0.5999 + 0.13585 ≈ 0.73575
      - Similarly, if signal is "95% likely":
        P(setting=95% | "95% likely") = (0.4 * 0.8) / (0.4*0.8 + 0.6*0.2) = 0.32 / (0.32+0.12) = 0.32/0.44 ≈ 0.7273
        P(red | signal) = 0.7 * P(setting=70% | signal) + 0.95 * P(setting=95% | signal) 
          = 0.7 * (1-0.7273) + 0.95 * 0.7273 ≈ 0.7*0.2727 + 0.95*0.7273 ≈ 0.19089 + 0.690935 ≈ 0.881825
    - So the rational credences are approximately 0.74 and 0.88.
  - **Trial procedure:** Same as Stage 1, but now the facilitator first reveals the signal (by drawing from the pre-committed list) and then participants report. Outcomes are generated according to the setting (so if setting is 70%, then 70% chance of red, etc., again pre-committed).
  - **Goal:** Participants learn to compute the expected chance given the signal, and see that the overall 80% is not the right number to report.

  ### Stage 3: The Lamp (25 minutes)
  - **Setup:** Uncover the box label ("RED 80%") and introduce a lamp. "Now the machine has a lamp that may light before the ball is drawn. We have data from 300 past runs (hand out the frequency table). The lamp is predictive, as you can see. Before each trial, I will tell you whether the lamp lit or not. Then you report your credence for red."
  - **Trial procedure:** 
    1. Facilitator reveals the lamp state (from a pre-generated list of 10 lamp states, consistent with the overall 69% lamp-on rate, and then the outcome is generated from the conditional chance: if lamp on, 90.65% chance of red; if lamp off, 56.29% chance of red). Pre-commit to the list of (lamp state, outcome) pairs.
    2. Participants report their credence.
    3. Outcome is revealed and scores are computed.
  - **Expected behavior:** Participants should condition on the lamp. Those who use the table will report about 0.91 when lamp on and 0.56 when lamp off. Those who stick to 0.8 will be penalized.

  ### Debrief (15 minutes)
  - **Reveal the mechanism:** Show the wheel and the lamp indicator. Explain the probabilities. Emphasize that the unconditional chance is 80%, but once the lamp lights, the chance of red is now about 91% (if on) or 56% (if off). 
  - **Map to concepts:**
    - Stage 1: The Principal Principle says that if you know the chance is 80% and you have no other relevant information, your credence should be 0.8. This holds for a single case and is not just long-run advice.
    - Stage 2: When you don't know the chance, your credence should be the expected chance (an average over the possible chances). This is different from the overall chance (which was 80%) because you have more information (the signal).
    - Stage 3: The lamp provides additional information. The chance at the time of the trial (after the lamp lights) is no longer 80%. The printed chance was the chance before the lamp was observed (or the overall chance). The norm requires deferring to the current chance, which includes the lamp information. The evidence from the lamp is "admissible" because it is information about the outcome that is not already accounted for in the chance. The printed chance is still true as an unconditional chance, but it's not the chance you should defer to once you see the lamp.
  - **Wrong answers and responses:**
    - In Stage 1: "I had a hunch that it would be white this time." Response: The scoring rule shows that even if you are sometimes right, in the long run you do worse than 0.8. The chance is the best single number to report.
    - In Stage 3: "But the box says 80%, so I reported 0.8." Response: The frequency table and the mechanism show that the lamp changes the chance. The box's label is the overall chance, but after the lamp, the chance is different. The norm says to defer to the current chance, not the past one.
  - **Predictable issues:**
    - Overconfidence: Someone might get lucky by deviating in Stage 1. Emphasize that we are looking at long-run performance (even though the norm is for a single case, the scoring rule is our way of measuring accuracy).
    - Imprecise credences: Encourage participants to use the number they would use if forced to choose. The scoring rule is defined for any real number in [0,1].
    - Stage 3 looking like hunches: The frequency table provides objective data, unlike a hunch. Emphasize that the lamp has a track record.
  - **Limitations:**
    - The activity uses a long-run scoring rule to evaluate one-off reports. We are assuming that the scoring rule is a good measure of epistemic accuracy. The norm is for a single case, but we are motivating it by long-run results. In the debrief, note that the Principal Principle is defended as a rational constraint for a single case, and the scoring rule is just a tool to show the practical cost of violating it.
    - We don't address the existence of objective chances or the justification for the Principal Principle (like Lewis's big bad bug). We assume chances exist and are known.
    - The "admissible evidence" concept is introduced but not deeply explored. We don't have time for cases where the evidence is inadmissible (like future events).
  - **Handling the one-shot framing:** We can say: "Even though you are playing multiple rounds, imagine that each round is the only time you will ever face this situation. What number would you want to report to be as accurate as possible? The scoring rule is a way to measure that accuracy." This bridges the one-shot and long-run perspectives.

  ### Optional Fourth Round (Adversary)
  - Not included due to time constraints. It would introduce a separate issue (game-theoretic considerations) and complicate the session.

  ## Handout Texts:

  ### Handout 1: Scoring Rule
  **Brier Score:**  
  For a reported credence `p` in the event "the ball is red":  
  - If the ball is red, your score for that trial is: `-(1 - p)^2`  
  - If the ball is white, your score for that trial is: `-(0 - p)^2 = -p^2`  

  Your total score is the sum of the scores for each trial. You want to maximize your score (so less negative is better).  

  *Example:*  
  If you report 0.8 and the ball is red: `-(1-0.8)^2 = -0.04`  
  If you report 0.8 and the ball is white: `-(0.8)^2 = -0.64`  

  ### Handout 2: Stage 1 Outcomes
  We will run 10 trials. The outcomes are pre-determined as follows (R=red, W=white):  
  Trial 1: R  
  Trial 2: W  
  Trial 3: R  
  Trial 4: R  
  Trial 5: R  
  Trial 6: R  
  Trial 7: W  
  Trial 8: R  
  Trial 9: R  
  Trial 10: R  

  (Note: This has 8 red and 2 white, so 80% red.)

  ### Handout 3: Stage 2 Settings and Signals
  The machine has two settings:  
  - Setting A: 70% chance of red (selected with 60% probability)  
  - Setting B: 95% chance of red (selected with 40% probability)  

  Before each trial, you will receive a signal:  
  - The signal is correct 80% of the time.  

  Pre-committed list for 10 trials (Setting and Signal):  
  1. Setting: A, Signal: A  
  2. Setting: A, Signal: B  
  3. Setting: B, Signal: B  
  ... (and so on, with 10 trials)  

  And the outcomes (based on the setting):  
  1. ... (generate based on the setting's chance)  

  *We'll provide the full list of 10 trials with settings, signals, and outcomes in a table.*

  ### Handout 4: Stage 3 Frequency Table and Outcomes
  **Frequency Table from 300 Past Runs:**  

  | Lamp State | Number of Runs | Red Outcome | Red Fraction |
  |------------|----------------|-------------|-------------|
  | On         | 207           | 188         | 90.8%       |
  | Off        | 93            | 52          | 55.9%       |
  | **Total**  | **300**       | **240**     | **80.0%**   |

  For the 10 trials, the lamp state and outcome are pre-committed (we'll provide the list).

  ## Facilitator Script for Key Moments:

  ### Stage 1 Introduction:
  "Here we have a box labeled 'RED 80%'. We know that over many runs, 80% of the balls are red. But what about this one run? Write your credence that the next ball will be red. Remember, you are trying to maximize your score."

  ### Stage 2 Introduction:
  "Now the box has a hidden setting. Each trial, the setting is chosen: 60% chance of a 70% red setting and 40% chance of a 95% red setting. I'll give you a signal that is correct 80% of the time. Use that signal to set your credence."

  ### Stage 3 Introduction:
  "The box is again labeled 'RED 80%', but now there's a lamp. We have this frequency table from 300 past runs. The lamp is on in about 69% of the runs, and when it's on, red happens about 91% of the time; when off, about 56%. For each trial, I'll tell you if the lamp is on or off before you report."

  ### Debrief:
  "In Stage 1, you saw that reporting 0.8 was best. This is the Principal Principle: when you know the chance, set your credence to it. In Stage 2, when you didn't know the chance but had a signal, you set your credence to the expected chance. In Stage 3, even though the box said 80%, the lamp gave you more information. The chance after seeing the lamp was about 91% or 56%. The norm is to defer to the current chance, which includes all the available information. The lamp is 'admissible' evidence because it doesn't change the chance setup but gives you more information about the outcome. The printed 80% is the unconditional chance, which is not the same as the current chance after the lamp."

  ## Final Note:
  This plan is designed to be experiential and to lead participants to the key ideas. The debrief is crucial for connecting the activities to the formal concepts. Be prepared to adapt if participants get stuck, but the pre-committed lists and scoring should drive the points home.
