prompt: |-
  I'm writing a short paper on moral worth for a seminar — the rough idea being that whether an action has moral worth depends on the considerations the agent acts on rather than on what the action brings about — and before I read any of the secondary literature I've been writing down my own gut verdicts on cases, to see whether anything coherent comes out. I don't need citations or a reading list; I want the principle. My verdicts, stated as strongly as I feel them: a hospital pharmacist who double-checks every dosage because a malpractice suit would end her career and because the hospital audits errors — right act, no moral worth. The same pharmacist fifteen years later, long after the audits stopped, who double-checks because she can't bear the thought of a patient being hurt and would feel wretched for weeks otherwise — full moral worth; she seems to be acting on exactly the features that make the act right. A man named Dev who returns a dropped wallet because his sister, whose judgment he trustingly defers on moral matters, told him that's what decent people do; he doesn't see the point himself, though he reflectively trusts her and would defend the deference — I say no moral worth, or at most what I've been calling *borrowed credit*. A woman who, after a stroke, finds she has an overpowering urge to return lost property, is initially alarmed by it, then reflects and wholeheartedly endorses it as the right way to live — I lean toward yes, but noticeably less than the second pharmacist. Someone who donates a kidney to a stranger while falsely believing the recipient is a distant cousin, and who would have donated anyway out of general benevolence had he known the truth — I want to say no moral worth, since his actual operative reason was partiality to kin, but the fact that the right reason was sitting right there and would have moved him makes me reluctant, and I can't tell whether that reluctance is sentimental. Two people who do the right thing from both duty and enjoyment and who would still have done it from duty alone — full moral worth in both; the extra enjoyment doesn't seem to contaminate anything. And finally a shop assistant who returns a wallet purely because store policy requires it and she is a stickler for whatever policy is in force, where the policy happens to coincide exactly with what morality requires — no moral worth, and that verdict I feel most confident of.

  The principle I've been playing with has two clauses: an act has moral worth iff the agent acts *because of* the features that actually make the act right, and she would still have acted on those features if every other motive of hers had fallen away — I've been calling the second the independence condition. But my cases seem to pull it apart. The stroke patient fails independence, I think, since the urge is doing the motivational work and would keep doing it even if its object were worthless, and yet I don't want to deny her worth outright; so maybe what matters is not where the motive came from but whether she reflectively endorses it. The trouble is that Dev endorses too, in his own deferential way, and I still want to withhold worth from him, which makes me suspect that endorsement does the work only when it is endorsement of the right-making features themselves and not merely of a person or a rule that reliably tracks them — and if that is the repair, I can't see why it doesn't also rescue the policy-following assistant, whom I most want to exclude. That is the pair I keep going back and forth on: Dev and the stroke patient feel structurally identical to me and I judge them differently, and I'd rather be told which verdict to drop than be handed a clause that saves both by being gerrymandered to them.

  So: is there one principle — or a short list of serious candidates, stated precisely enough that I could apply them myself — that gets these verdicts, and if not, which of them do you think I should overturn and why? For each clause you propose, I'd like to know which case motivates it. I'd also like the principle's verdicts on cases I haven't listed: the same agent acting rightly for the right reason but so near the edge of her self-control that she would very likely have failed had the temptation been somewhat stronger; an agent who does the right thing for the right reason but is wrong about what makes it right (she returns the wallet because she thinks generosity is commanded by a God she takes to exist, and it isn't); a robot or software system trained to treat patients gently, which has no felt reasons at all but responds reliably to the right features; and a committee that reaches the right decision where no individual member acted on the right reason but the aggregation procedure reliably tracks it. And one last thing I can't settle: my verdicts above came in degrees — the stroke patient less than the veteran pharmacist, Dev somewhere above the policy-follower but below both — so I'd like to know whether the right account makes worth scalar, or whether it treats worth as all-or-nothing and explains my degree talk as something else, such as praiseworthiness or credit, wearing moral worth's clothing.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They're working on a paper about moral worth, focusing on the idea that moral worth depends on the agent's reasons rather than the outcomes. They've listed several thought experiments with their intuitive judgments and are struggling to find a coherent principle that explains all these verdicts. Their current principle has two parts: acting because of the right-making features and an independence condition. But the cases of Dev and the stroke patient are causing tension because they seem similar but the user judges them differently.

  First, I need to parse each case and the user's verdicts. The pharmacist who acts out of fear of lawsuits has no moral worth, but the same pharmacist later acting out of concern for patients does. Dev defers to his sister but gets no moral worth, while the stroke patient endorses her urge and gets some, though less. The kidney donor acting on partiality has no worth despite having a latent right reason. The shop assistant following policy strictly has no worth. The user also mentions cases with mixed motives still having full worth.

  The user's main struggle is reconciling Dev and the stroke patient. Both involve external influences—Dev trusts his sister, the stroke patient has an urge. But the user attributes some moral worth to the latter but not the former. Why? The endorsement seems key here. The stroke patient reflects and endorses the urge, making it her own, while Dev just defers without grasping the reasons. So maybe the difference is in whether the agent internalizes the reasons.

  Then there's the independence clause. The stroke patient's urge is innate, so without it, she might not act. But the user still attributes some worth, suggesting independence might not be necessary, or that endorsement overrides the lack of independence. But Dev also endorses his deference, yet no worth. So endorsement alone isn't sufficient; it has to be endorsement of the right-making features themselves, not just the authority.

  The shop assistant is a problem because if endorsement of the rule is enough, why doesn't she get worth? But the user is firm on excluding her. So maybe the principle requires that the agent acts on the right-making features directly, not through a rule or authority. That would exclude both Dev and the shop assistant but include the stroke patient who endorses the urge which aligns with the right features.

  The kidney donor case is tricky. The user says no worth because the actual reason was partiality. But the latent benevolence makes them hesitant. The principle should clarify that actual reasons matter, not counterfactuals. So no worth, but maybe some credit because of the latent reason, but that's separate from moral worth.

  For the additional cases: the agent near the edge of self-control—if they act for the right reasons, they have moral worth, even if barely. The strength of temptation doesn't negate worth. The agent who mistakes the ground of rightness but acts on the right features (like generosity) still has worth because the features are what matter. The robot without feelings might not have moral worth since it lacks reasons, but that's debatable. The committee where no individual has the right reason but the outcome is right—probably no collective moral worth because individuals didn't act on right reasons.

  Degrees of moral worth: the user feels some cases have partial worth. But perhaps moral worth is binary—either you act for the right reasons or not. The scalar feeling might be about praiseworthiness, which considers effort, circumstances, etc. So the stroke patient gets less praiseworthiness because her motive came easily, but still has moral worth because she endorses the right features.

  So the refined principle: An act has moral worth iff the agent performs it because of the features that make it right, and these features function as the agent's primary normative reason (not just motivation) through endorsement or direct recognition. This explains Dev and the shop assistant as not acting on the features directly but through intermediaries. The stroke patient endorses the urge which aligns with the right features, so she acts on them. The pharmacist acts directly on patient harm. The kidney donor acts on kinship, not benevolence. Mixed motives don't contaminate because the right reason is sufficient.

  This handles the cases and the additional ones. For the self-control case, worth remains if the right reason is operative. The mistaken ground case has worth if the right features motivate. Robot no worth without reasons. Committee no worth without individual reasons. Degrees are praiseworthiness, not moral worth.
answer: |-
  Based on your rich cases and the tension you've identified (especially between Dev and the stroke patient), I propose a principle that captures your core intuitions while resolving the conflicts. The key insight is that **moral worth requires the agent to be *directly responsive* to the right-making features themselves, where this responsiveness is *constitutively explained* by the agent's recognition of those features as normatively significant.** Here's the principle, followed by its application to your cases, the proposed revisions, and new cases:

  ---

  ### **The Proposed Principle**
  **An act has moral worth iff:**
  1.  **Right-Feature Motivation (RFM):** The agent performs the act *because of* (i.e., motivated by) the features that actually make it right.
  2.  **Normative Recognition (NR):** The agent's motivation by those features constitutively depends on their recognition of them *as normatively significant* (i.e., as providing reasons for action), and this recognition is not wholly derivative of an external source (person, rule, urge) *treated as authoritative independent of the features themselves*.

  **Clarifications:**
  -   **RFM** ensures the act is done for the right reason (the *actual* right-makers).
  -   **NR** ensures the agent's own moral cognition is engaged with the right-makers *as reasons*. It distinguishes between acting *because of* the features (which even a robot might do) and acting *because one sees them as normative*.
  -   **"Constitutively depends"** means the recognition isn't just present; it's what *makes* the features motivating for the agent in this context.
  -   **"Not wholly derivative"** targets deference: If the agent treats the external source (like Dev's sister or the shop policy) as the *ultimate* reason-giver, and their responsiveness to the right-features is only *through* deference to that source, NR fails. Endorsement of an urge is different if it involves recognizing the *value* the urge tracks.

  **Verdicts on Your Cases & Proposed Revisions:**

  | Case                            | Your Verdict             | Principle Verdict          | Revision Suggested          | Why?                                                                 |
  | :------------------------------ | :----------------------- | :------------------------- | :-------------------------- | :------------------------------------------------------------------- |
  | **Pharmacist (fear)**           | No worth                 | **No worth**               | None                        | Fails RFM: Acts on fear, not patient harm.                           |
  | **Pharmacist (concern)**        | Full worth              | **Full worth**             | None                        | Meets RFM & NR: Acts on patient harm, recognizes its normative force. |
  | **Dev (deference)**             | No worth/borrowed credit | **No worth**               | Drop "borrowed credit"      | Fails NR: Motivated by sister's authority, not the right-features *as reasons*. |
  | **Stroke Patient**              | Leans yes, less          | **Full worth (binary)**    | Upgrade to full worth      | Meets RFM & NR: Acts *because* of returning lost property, endorses its value. Urge origin doesn't negate NR. "Less" is praiseworthiness. |
  | **Kidney Donor (false belief)** | Leans no                 | **No worth**               | None                        | Fails RFM: Actual motive is partiality, not benevolence. Latent motive irrelevant. |
  | **Duty + Enjoyment**            | Full worth              | **Full worth**             | None                        | RFM & NR satisfied (duty motive suffices). Enjoyment is non-interfering. |
  | **Shop Assistant (policy)**     | No worth (confident)    | **No worth**               | None                        | Fails NR: Motivated by policy compliance, not the right-features *as reasons*. |

  **Resolving Dev vs. Stroke Patient:**
  -   **Drop the difference in moral worth verdict.** Both act *because of* the right features (returning property). The difference is in **praiseworthiness**, not moral worth.
      -   *Dev*: Fails **NR**. He doesn't recognize the features *as reasons*; he defers to his sister *as authority*. His "endorsement" is of *her judgment*, not the rightness of returning property itself. He acts *because she said so*, not *because it's right*. (Case motivates **NR**).
      -   *Stroke Patient*: Meets **NR**. Her endorsement involves recognizing the *value* of returning lost property ("the right way to live"). The urge triggers the motivation, but her reflection affirms the normative significance *of the features*. She acts *because it's right*, even if the psychological origin is odd. Her verdict is less *praiseworthy* (due to lack of struggle/ease of motivation), but satisfies **RFM** and **NR**.
  -   **Gerrymandering Avoided:** The shop assistant also fails **NR** (like Dev) because she treats the *policy* as authoritative, not the right-features themselves. The stroke patient passes because her endorsement connects her directly to the normative significance of the features.

  **Independence Condition: Abandoned.**
  -   Your stroke patient hesitation revealed its flaw. **NR** handles the core concern (direct responsiveness to normativity) without needing counterfactuals about motives falling away. Origin of motive (stroke) doesn't automatically negate worth if **NR** is satisfied.

  **Degrees of Moral Worth:**
  -   Your scalar intuitions are best explained by **praiseworthiness**, not moral worth. Moral worth (**RFM + NR**) is **binary**.
      -   *Pharmacist (concern)*: High praiseworthiness (stable virtue, likely effortful).
      -   *Stroke Patient*: Lower praiseworthiness (urge makes it easy, less agential effort).
      -   *Dev/Policy Follower*: Very low/no praiseworthiness (no engagement with reasons).
      -   *Kidney Donor*: Low/no praiseworthiness (acted on bad reason, latent good reason irrelevant to worth but maybe to character assessment).

  ---

  ### **Verdicts on Your New Cases (Applying RFM + NR):**

  1.  **Agent near edge of self-control (acts for right reason, would fail if temptation stronger):**
      *   **Verdict:** **Full moral worth.**
      *   **Why:** Meets **RFM & NR**. She acts *because of* the right features and *recognizes them as reasons*, even if barely. The counterfactual weakness speaks to character/praiseworthiness/credit, not whether *this act* was done for the right reason with normative recognition.

  2.  **Agent acts for right reason but is wrong about the ground of rightness (e.g., returns wallet because thinks God commands generosity, but God doesn't exist):**
      *   **Verdict:** **Full moral worth.**
      *   **Why:** Meets **RFM & NR**. She acts *because of* the right feature (the generosity inherent in returning the wallet) and recognizes *that feature* as normatively significant (she takes it as commanded, showing she sees it as reason-giving). Her *metaphysical error* about *why* generosity is normative (divine command vs. inherent value) doesn't negate her responsiveness to the right-making feature *itself* as a reason.

  3.  **Robot/Software system (trained to treat patients gently, responds reliably to right features, no felt reasons):**
      *   **Verdict:** **No moral worth.**
      *   **Why:** Fails **NR**. It reliably responds to the right features (**RFM** might be satisfied in a causal sense), but lacks *recognition* of those features *as normatively significant*. It lacks the capacity for normative cognition. Its "reasons" are purely causal/algorithmic. (Highlights why **NR** is essential).

  4.  **Committee (right outcome, no individual acted on right reason, aggregation tracks rightness):**
      *   **Verdict:** **No moral worth (collectively or individually).**
      *   **Why:** Fails **RFM** at the individual level (no member acted *because of* the right features). The collective outcome is right, but no *agent* (individual or collective) performed the act *for the right reason* with normative recognition. The procedure, like the robot, lacks **NR**.

  ---

  ### **Why this Principle Works & Key Motivations**

  1.  **Right-Feature Motivation (RFM):** Motivated by *all* cases requiring the agent to latch onto the *actual* right-makers (Pharmacist (fear) vs. (concern), Kidney Donor, Shop Assistant).
  2.  **Normative Recognition (NR):** Motivated by the need to:
      *   Exclude Dev and Shop Assistant (both treat an external source as ultimate authority).
      *   Include the Stroke Patient (her endorsement connects her to the normativity of the features).
      *   Explain why the "false ground" agent still has worth (she *is* responsive to the feature's normativity, albeit misattributed).
      *   Exclude the Robot (lack of normative cognition).
      *   Ground the difference between *acting on* a feature (causally) and acting *for a reason* (normatively).

  **Final Recommendation:** Drop the difference in *moral worth* between the Stroke Patient and the virtuous Pharmacist. Attribute your "less" intuition to **lower praiseworthiness** due to the origin and ease of her motivation. Uphold your "no worth" verdicts for Dev, Policy Follower, Kidney Donor, and Pharmacist (fear) as they fail **RFM** and/or **NR**. Treat moral worth as binary (**RFM + NR** satisfied or not), and let praiseworthiness/credit capture the scalar dimensions (effort, sacrifice, character state, motivational origin). This principle preserves the core Kantian/Wood-inspired insight that worth depends on the agent's subjective reasons and their connection to the objective right-makers, while avoiding the pitfalls of your independence condition and cleanly resolving your problematic pairs.
