  For leaf labels, I'll include all requested positions but keep descriptions minimal. Ostrich nominalism gets tricky - its defining trait is refusing to engage with the problem, so I'll place it as a sibling to quietism. 

  The STEM students might balk at abstract objects in the file copy case, while philosophy majors may overthink the "non-tennis-ball" predicate. That's actually good - it'll surface their intuitions. For refusals to answer, I'll suggest skipping to the next applicable branch.

