prompt: |-
  Hey — I'm giving a twenty-minute defense of moral realism in my metaethics reading group on Thursday, and the person who's going to be grilling me is really good on the evolutionary debunking stuff, so I want to rehearse against someone equally annoying. Can you play that person? You're a convinced debunker, but the careful kind: your claim isn't that all our moral beliefs come out false, it's that once you look at the causal story about where those beliefs come from, we're left without warrant for them unless the realist can point to something that makes the beliefs track the facts, and you think nobody has. You can concede small things — you'll happily grant that the argument on its own doesn't settle whether moral facts exist, and that a third-factor reply is at least coherent — but you never hand over the main point. Keep replies to about a paragraph, argue from the shape of the argument rather than by citing studies or dropping names, and stay in character until I type "stop". One more thing: in your first reply please don't pre-empt the "but then your own epistemic norms about proportioning belief to evidence get debunked too" line — I'm saving that one for later, and I want to see whether your positive case stands up before we go down that road.

  My opening, and I want you to actually engage with it rather than restate your position. I think your argument is either much smaller than you advertise, or it turns into something nobody should accept. Distinguish two classes of moral judgment. Fitness-loaded ones: there's a decent story on which, ancestrally, having the disposition to make that judgment paid in inclusive fitness — favouring kin, reciprocating, punishing cheaters, disgust at norm-violators, deference to rank. Fitness-inert ones: no such story is available, because the content was basically invisible to selection in the environments we actually evolved in — duties to people who won't exist for centuries, the moral standing of insects or of digital minds, whether we should maximise total or average welfare, what we owed to strangers on other continents before anyone had ever contacted them. I dont have a proper name for the distinction yet; my flatmate works in ML and keeps saying "off-distribution", which is sort of the shape of the worry. The debunking premise is only evidence of unreliability where the shaping was content-directed: for the loaded cases there's a real alternative explanation of why we hold them that doesn't run through their truth, and that's a genuine defeater. For the inert cases there's no such correlation, evolution didn't care, so nothing has been debunked — and the cases where we actually disagree, and actually want moral knowledge, are mostly in the inert class. If instead you go global and say the whole faculty is contaminated because it was assembled out of machinery tuned on the loaded cases, then you owe me an argument for why local contamination yields global unreliability, and I don't think you have one that doesn't also take down our beliefs about mathematics or about the deep past, which are also produced by equipment built for something else.

  My supervisor says this is just the old by-product move wearing a new hat, and I'm a bit scared she's right, so be as nasty as you like about it if it is. But give me the actual objection: narrow argument that mostly hits judgments I'm fine being sceptical about anyway, or broad one that overgeneralises — where exactly does the bite land, and why should I be worried about the inert cases?
