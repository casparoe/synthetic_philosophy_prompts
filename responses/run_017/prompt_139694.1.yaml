  Hmm, the user is clearly deeply immersed in philosophy of language, specifically the debates around rigid designation and necessary a posteriori. They're part of a working group that's been stuck for years on these issues, and they've presented a sophisticated hypothesis about the semantic/metasemantic distinction being at the heart of the impasse. 

  First, I need to reconstruct each position fairly. The direct-reference camp is firmly in the Kripkean tradition - they see names as directly referential tags that maintain reference across possible worlds. Their arguments (modal, epistemic, modal innocence) all aim to show descriptions can't capture name semantics. The descriptivists are clever - they concede rigidity isn't the real issue by using rigidified descriptions ("the actual F"), shifting the debate to whether descriptions give semantic content. The two-dimensionalists try to have it both ways with dual intensions, but get criticized from both sides - Kripkeans say primary intensions aren't semantic, descriptivists say it's just their view relabeled.

  The user's hypothesis about the semantic/metasemantic split seems spot-on. Rigidity (semantic) gets conflated with direct reference (metasemantic). This explains why descriptivists can grant rigidity while denying direct reference, and why the modal argument feels question-begging - it assumes what it tries to prove about mediation. I should note this distinction isn't entirely original (think Soames vs. Jackson), but the user's formulation is particularly clear for diagnosing this specific impasse.

  The core disagreement is fundamentally about explanatory burdens. What must semantics explain? Truth conditions? Cognitive significance? Learnability? Each camp prioritizes different things. Direct-reference focuses on modal truth conditions, descriptivists on cognitive significance, two-dimensionalists try to do both. This isn't merely verbal - it's about what counts as explanatorily adequate. 

  For progress, we need to stop talking past each other. I'll suggest: first, clearly separate semantic and metasemantic questions; second, examine names introduced by pure stipulation (like "Julius" for "inventor of the zipper") to test if rigidity requires direct reference; third, analyze what two-dimensionalism can formally express about epistemic possibilities versus metaphysical necessities. The key is making explanatory trade-offs explicit rather than pretending one theory can do everything.

  Bottom line: This is a clash about what semantics must explain, solvable only by agreeing on explanatory priorities - otherwise we'll remain at an impasse. The user's group might need to explicitly negotiate which phenomena they consider non-negotiable for a theory to capture.
answer: |-
  Here is the analysis structured as requested:

  ### 1. The dialectic as I reconstruct it  
  *Direct Reference (DR)* grants that names are rigid designators (semantic invariance across worlds) but denies that rigidity can be captured descriptively without sacrificing core insights. It asserts: (i) Rigidity alone doesn’t resolve epistemic puzzles (Hesperus/Phosphorus dissent); (ii) Descriptivism misassigns necessity to contingent claims; (iii) Rigidity follows *from* direct reference, not vice versa. *Descriptivism* grants rigidity (via "actually"-rigidified descriptions) but denies DR’s metasemantic claim: reference-fixing *is* descriptive, even if semantics encodes rigidity. Your characterization is fair, but undersells their rebuttal: explicit stipulation cases ("Let ‘Julius’ denote whoever invented the zipper") show rigidity and descriptivist metasemantics coexist. *Two-Dimensionalism (2D)* grants both rigidity and the epistemic role of descriptions but denies they conflict when separated into dimensions. It concedes to DR that secondary intensions are rigid and direct, but insists primary intensions (capturing cognitive significance) are semantically relevant. Your summary is accurate, but 2D’s weakness is its ambiguous ontological commitment: are primary intensions part of semantics or mere pragmatic heuristics?

  ### 2. My hypothesis, assessed  
  Your semantic/metasemantic split is correct and **explains the stall perfectly**: DR uses rigidity (semantic) as *evidence* for direct reference (metasemantic), while descriptivists grant rigidity but block this inference via rigidification. The modal argument *assumes* that rigidity entails unmediated reference (e.g., Kripke’s "fix the reference" vs. "give the meaning" distinction). Descriptivists deny this entailment, making the argument circular against them. The split isn’t original (Soames, Kaplan, and Devitt hint at it), but your application to this impasse is novel. It breaks down in two places: (i) Stipulation cases ("Julius") challenge whether metasemantic mediation *must* affect semantics; (ii) 2D *embraces* the split (primary intension ≈ metasemantic, secondary ≈ semantic) but inflates semantics to include epistemic constraints, which DR rejects as non-semantic. Your hypothesis thus exposes the core fault line but doesn’t resolve it.

  ### 3. What kind of disagreement this is  
  This is **primarily a disagreement about the explanatory role of semantic theory**, secondarily about which phenomena are data. All sides agree on the *existence* of necessary a posteriori truths and rigidity. But:  
  - *DR* treats modal truth conditions and compositionality as semantic essentials; cognitive significance is pragmatic.  
  - *Descriptivism* demands semantics explain speaker knowledge (how we identify referents) and learnability.  
  - *2D* insists semantics must account for both, creating dual "intensions."  
  The dispute isn’t verbal (all parties define rigidity consistently) or empirical (speaker judgments about counterfactuals are agreed upon; testing wouldn’t help). Nor is it about bedrock intuitions: DR and descriptivists share the intuition that "Hesperus is Phosphorus" is informative but necessary. The clash is over *which burdens semantics must bear*. When descriptivists say "rigidity isn’t the issue," they mean semantics must also explain cognitive access. When Kripkeans reject primary intensions as "not semantics," they deny this burden. 2D’s framework is a technical proposal to satisfy both demands, but its opponents see it as cheating by overloading semantics.

  ### 4. What would count as progress  
  Progress requires **isolating and testing metasemantic mediation claims** independently of rigidity. Three concrete steps:  
  1. **Analyze "Julius"-cases formally**: If a name is introduced by "denotes the actual F," does it behave identically to a direct referent in *all* contexts? Develop toy languages: one with pure direct reference, one with rigidified descriptivist metasemantics. Prove whether they generate identical truth conditions for propositions involving modality, belief, or historical chains. If identical, descriptivism wins; if not, DR identifies a crucial difference.  
  2. **Pressure two-dimensionalism’s expressiveness**: Show that 2D cannot model a specific phenomenon without collapsing into DR or descriptivism. For example: Can 2D distinguish "It might not be that Hesperus is Phosphorus" (epistemic) from "Hesperus might not be Phosphorus" (metaphysical) without smuggling in direct reference? A formal proof that primary intensions *must* encode descriptive content to handle epistemic contradictions would force 2D into descriptivism.  
  3. **Shift from semantics to metasemantic foundations**: Agree that rigidity is settled, then debate whether reference-fixing *must* be descriptive. Run cases where reference is fixed non-descriptively (e.g., perceptual baptism) and test for differences in modal profile or cognitive dynamics. If all cases converge, mediation is irrelevant; divergence supports DR.

  ### 5. Bottom line  
  **This is a solvable dispute about semantic theory’s explanatory scope, stalled by conflation of semantic rigidity with metasemantic mediation.** Progress is feasible by decoupling these and stress-testing descriptivist metasemantics against direct reference in edge cases.
