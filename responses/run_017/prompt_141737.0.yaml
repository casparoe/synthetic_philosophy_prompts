  Okay, let me tackle this query step by step. The user wants to run a 90-minute session on the Frege-Geach problem for expressivism, targeting software engineers who read moral philosophy casually but lack formal logic and metaethics background. 

  First, I need to understand the user's core framing request: presenting the problem as a failure of compositionality rather than a truth-value issue. That's actually a sharp approach because compositionality maps well to software concepts like functional purity and context-agnostic behavior. The "effect vs value" analogy could resonate deeply with engineers used to side effects in programming.

  The user's specific constraints are crucial here. The example must avoid paraphrasing as speaker attitude reports to block expressivist workarounds. I'm thinking a simple moral conditional like "If lying is wrong, then getting little brother to lie is wrong" would work well - it's logically tight and the embedded clause can't be reduced to "I disapprove now". 

  For sequencing, we should start by grounding expressivism correctly: it's not about meaninglessness but non-descriptive meaning. Then demonstrate unembedded moral assertions ("Lying is wrong") as expressions of attitude. This sets up the compositionality break when embedding occurs - negation first (simple), then conditionals (complex). The key insight is that embedded clauses need semantic values for logical operations, not emotive outputs.

  Misconception management will be vital. Engineers might conflate this with truth-value gaps or think adding "and true" solves it. I'll prepare rebuttals showing how truth-talk doesn't resolve the compositional mechanism failure. The programming analogy might actually cause a unique misunderstanding: thinking of attitudes as stateful functions that could handle embedding through closures - but that would violate expressivism's core non-cognitive stance.

  For assessment, I'd end with a question forcing application: "Why can't we treat the if-clause as expressing hypothetical disapproval?" A good answer would recognize that hypothetical attitudes aren't what expressivism claims we express. And I'd explicitly table higher-order attitudes and solution attempts (quasi-realism etc.) as beyond scope.

  The riskiest step is the negation-conditional transition. If the compositional leap doesn't land, I'd fall back to truth-table analysis showing how expressivist "values" break standard logic flow. Overall, this framing could work brilliantly with engineers - better than traditional truth-centric approaches - if we stay rigorous about the computational metaphor.
answer: |-
  Here’s a battle-tested plan leveraging your compositionality framing, optimized for engineers. **Drop nothing—your frame is superior for this audience.** The "effect vs. value" analogy will resonate deeply with functional programming intuition.  

  ---

  ### **Session Structure (90m)**  
  **GOAL:** Make them *feel* the compositional rupture before labeling it.  

  1.  **Ground Expressivism (10m)**  
      - **Do:** Contrast "Snow is white" (describes state of affairs) with "Lying is wrong" (expresses disapproval). Use "Boo!/Hooray!" as shorthand.  
      - **Don’t:** Let "express" collapse into "meaningless" or "just emotive." **Preempt Misconception 1:**  
          > *"Expressivism isn’t saying moral claims are gibberish. It’s saying their *job* isn’t to state facts—it’s to express attitudes, like a boo or cheer. But they’re still meaningful communication."*  

  2.  **Introduce Compositionality (10m)**  
      - **Analogy:** "Think of sentence meaning like a function in code. `f(x)` should output a value *based only on x and f’s rules*—no hidden side effects. The meaning of ‘If X, then Y’ depends *only* on the meanings of X and Y."  
      - **Key Insight:** "Linguistic Lego: The meaning of a complex sentence is built *predictably* from its parts + structure."  

  3.  **Show the Unembedded Case (5m)**  
      - **Example:** Standalone assertion: *"Lying is wrong."*  
      - **Expressivist "Value":** Output = *Expressing disapproval of lying* (an **effect**—like printing to console).  

  4.  **Drop the Bomb: Embedding in Negation (15m)**  
      - **Example:** *"Lying is not wrong."*  
      - **The Rupture:**  
          - Q: "What's the input to the `NOT` operator? What value does *"Lying is wrong"* contribute here?"  
          - A: On Expressivism, it contributed an *effect* (booing). But `NOT` needs a *semantic value* (like True/False) to operate on!  
      - **Engineer Insight:** "Negation is a pure function. It expects a boolean input. Expressivism gives it a side effect. Type error!"  

  5.  **Deepen with Conditionals (20m)**  
      - **Your Killer Example (FIRST USE):**  
          *"If lying is wrong, then getting your little brother to lie is wrong."*  
          **Why it works:**  
          - Embeds "lying is wrong" in antecedent.  
          - **Not paraphrasable** as "If *I disapprove* of lying..." → This is about logical connection between *wrongness* properties.  
          - Lacks indexicals (I/here/now).  
      - **The Rupture Amplified:**  
          - Q: "What does the `IF` operator take as input from its antecedent?"  
          - A: It needs a *proposition* (something truth-apt) to evaluate the conditional. Expressivism gives it... a boo? How does `IF` condition on a boo?  
      - **Reuse the Example (5m):** Show how the *same clause* "lying is wrong" must function identically in standalone vs. embedded positions for compositionality. **State the Requirement NOW:**  
          > *"Any solution must assign 'lying is wrong' the *same semantic contribution* whether it’s shouted alone or plugged into an `IF` or `NOT`. Expressivism currently assigns it an *effect* when alone, but needs a *value* when embedded. Mismatch!"*  

  6.  **Why "Just Add Truth" Fails (10m) - Preempt Misconceptions 2 & 3**  
      - **Misconception 2/3:** *"Can’t moral claims just be false?"* or *"Just say they express attitudes AND are true/false!"*  
      - **Reframe:** "The problem isn't *having* truth values. It's *how the parts compose*. If ‘lying is wrong’ expresses a boo *and* is true, what is the `IF` operator seeing? The truth-value? The boo? Both? How does it combine them predictably? Expressivism’s core idea is that the *attitude-expression is the primary function*. Bolting on truth doesn’t show *how* that expressive function works *inside* logical structures."  

  7.  **Why Handling Negation ≠ Victory (5m) - Preempt Misconception 4**  
      - "Even if you hack negation (e.g., ‘not wrong’ = expressing tolerance?), conditionals are harder. `IF` needs to *use* the antecedent’s meaning hypothetically. Can you hypothetically boo? What does that *mean*? How does it constrain the consequent?"  

  ---

  ### **Your Example: Non-Negotiable Features**  
  - **MUST HAVE:** Logical embedding (conditional/negation/question).  
  - **MUST HAVE:** Clauses referring to objective moral properties ("lying is wrong"), not speaker states ("I disapprove").  
  - **MUST LACK:** Indexicals, ambiguity, easy paraphrase to attitude reports.  
  - **USE:** First in conditionals (step 5) to show the deepest break. Reuse immediately (step 5b) to illustrate the uniformity requirement.  

  ---

  ### **Engineer-Specific Misconceptions & Preemption**  
  1.  **"Expressivism = Meaningless/Emotive"** → Preempted in Step 1 (treat "Boo!" as meaningful but non-descriptive).  
  2.  **"Problem = Moral claims can’t be true"** → Preempted in Step 6 (truth-values aren’t the blocker; composition is).  
  3.  **"Fix: Express attitudes AND be true"** → Preempted in Step 6 (doesn’t resolve *how* the attitude integrates into logical machinery).  
  4.  **"Solve negation = solve everything"** → Preempted in Step 7 (conditionals are the harder, more revealing case).  
  5.  **🖥️ Engineer-Specific (Code Analogy):** *"Can’t we model attitudes as monads/stateful functions/closures that handle context?"* → **Wait for it.** If raised, say: *"Great thought! That’s roughly what sophisticated expressivists try (e.g., ‘norm-acceptance’). But does ‘hypothetical disapproval’ make sense? And can it validate logic? That’s the next level—tonight, just see why the *naive* version breaks."*  

  ---

  ### **Assessment Question (Last 10m)**  
  *"Imagine you’re designing a parser for moral language. Your semantic rule for ‘wrong’ is ‘output a disapproval effect’. How would your parser crash when it hits the sentence ‘If lying is wrong, then...’ and why?"*  
  **Sign it Landed:** They mention needing a value/proposition for the `IF` gate, getting an effect/function instead, and a type/composition mismatch. Not just "it doesn’t work."  

  ---

  ### **What to Refuse**  
  *"We won’t dive into solutions tonight (like quasi-realism or hybrid theories). First, we need to feel this fracture deeply. Solutions exist, but they’re complex—and their success is debated. Tonight is about *why* this is a problem in the first place."*  

  ---

  ### **Blunt Risk Assessment**  
  - **RISKIEST STEP:** Transition from negation (simple) to conditionals (complex). Engineers might think negation is *the* problem.  
  - **FALLBACK:** Hammer the **uniformity requirement**. *"The same word, ‘wrong’, in ‘Lying is wrong’ and ‘If lying is wrong...’ MUST contribute the same thing to meaning. What is that *one thing* for both? Expressivism has two answers (effect vs ???). Compositionality demands one."*  
  - **CODE ANALOGY STRENGTH:** Your framing exploits their intuition that `IF(PRINT("Boo!"), ...)` is nonsensical. **Lean in.** This is why your approach is better than truth-centric routes for them.  

  **You’ve got this.** Their functional programming intuition makes them *ideal* for grasping compositionality-as-core. Move fast to embedding, use your conditional example relentlessly, and let the rupture shock them.
