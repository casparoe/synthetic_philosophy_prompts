answer: |-
  Here’s a comprehensive exam package addressing your requirements, designed to push students beyond stock answers while integrating your core concerns about "unqualified" blamers.

  ---

  ### **Exam Question (20 marks, 90 minutes)**
  **Question:**  
  Critically evaluate whether the concept of "moral standing to blame" can adequately explain why blame seems defective in *non-hypocritical* cases like the following:  
  1. **The Untempted**: A blamer condemns a failure of willpower they have never personally experienced or been tempted by (e.g., condemning addiction relapse while having no history of addictive urges).  
  2. **The Beneficiary**: A blamer profits from systemic injustices that incentivize the blamed act (e.g., a wealthy executive blaming a low-level employee for cutting corners under exploitative conditions they designed).  
  3. **The Asymmetrical Enforcer**: A manager strictly enforces rules against subordinates but never challenges superiors who violate the same rules.  
  4. **The Justified**: A blamer performed the *same act* they now condemn but was fully excused or justified in their context (e.g., blaming someone for stealing bread to survive when they did so themselves during a famine).  

  In your response:  
  (a) Clarify what *kind of failure* is at stake when standing is lacking. Is it akin to an infelicitous performative (like asserting without knowledge), a distinct moral wrong, or something else? Ground your answer in the target’s appropriate reactive attitudes.  
  (b) Address whether your account implies that *self-blame* can lack standing (e.g., unrepentant self-flagellation). Does this strengthen or undermine your position?  

  ---

  ### **Model Answer (750 words)**
  **Thesis:** Moral standing is not reducible to hypocrisy; it requires a *relational position of shared normative vulnerability*. When blamers occupy exempt or invulnerable roles—even blamelessly—their blame constitutes a *performative misfire* analogous to voided speech acts, not a further moral injury. This framework unifies the cases, resolves the self-blame puzzle, and explains the target’s resentment as protest against misrecognition.  

  **Argument:**  
  Standing to blame is defective in all four cases because the blamer implicitly denies *co-membership in a community of moral risk*. Blame functions as a quasi-ritual act that presupposes the blamer’s subjection to the norms they invoke. The Untempted fails because they cannot plausibly signal "we are both susceptible to this failing"; their blame implicitly positions them as a non-participant in human frailty. The Beneficiary’s blame is hollow because they benefit from structures that *create* the temptation they condemn, exempting them from equivalent pressure. The Asymmetrical Enforcer’s selective application of norms reveals that the norm isn’t truly binding *on them*—it functions as a tool of control, not shared law. The Justified actor’s past act, though permissible, still demonstrates their exemption from the norm’s force in the target’s context; their blame denies the norm’s circumstantial relativity.  

  **(a) The nature of the failure**  
  This is performative infelicity, not a new moral wrong. Blame, like assertion, has felicity conditions: it must be issued from a position of *acknowledged fallibility* under the norm. When these conditions fail, blame is void—it misfires, like a command given by someone without authority. The target’s resentment (e.g., "Who are *you* to say this?") protests this misfire, not the blame’s content. Crucially, this resentment doesn’t presuppose the target is blameless; it rejects the *blamer’s role* in the exchange. This distinguishes it from objections to unfairness (which concern distributive justice) or bad epistemology (which undermines blame’s truth).  

  **(b) Self-blame and standing**  
  Self-blame *can* lack standing, but this is a virtue of the account. Unrepentant self-flagellation often involves viewing oneself as uniquely evil—a denial of shared normative vulnerability with other moral agents. Repentant self-blame, by contrast, accepts one’s place in the human community of fault. This explains why excessive self-blame feels pathological: it severs the blamer from the moral community, turning blame into a spectacle of isolation rather than a call to repair. The reductio fails; it reveals that standing’s core function is to sustain blame as a *relational practice*.  

  **Hardest objection:** One might argue that The Untempted’s blame could be epistemically sound (they *know* stealing is wrong) and non-hypocritical, so why dismiss it? I concede that their judgment may be correct, but insist that *blame* as a social act requires more than accuracy. To blame is not just to judge but to *invite the target into a normative dialogue*, which presupposes the blamer’s own openness to similar challenge. The Untempted’s exemption voids this reciprocity.  

  **Conclusion:** Standing is not about clean hands but about occupying a position that licenses mutual accountability. The cases reveal that blame without shared vulnerability is pragmatically null—it may express correct judgments, but it cannot perform its core function of calling another to account *as a fellow*.  

  ---

  ### **Marking Scheme (20 marks total)**  
  1. **Diagnosis of non-hypocritical standing failures (4 marks)**  
     - *Top:* Clearly articulates why each case lacks standing *without* invoking hypocrisy or blamer’s own wrongdoing.  
     - *Middling botch:* Treats cases as disguised hypocrisy or focuses on blamer’s unfair advantage without linking to standing mechanics.  

  2. **Unifying account of standing (4 marks)**  
     - *Top:* Identifies a non-hypocrisy-based condition (e.g., shared vulnerability, normative co-membership) that covers all cases.  
     - *Middling botch:* Offers disjointed explanations per case or conflates standing with epistemic/contextual fairness.  

  3. **Nature of failure & reactive attitudes (4 marks)**  
     - *Top:* Defends a specific view (e.g., performative misfire) and uses the target’s resentment to distinguish it from moral wrongs/epistemic errors.  
     - *Middling botch:* Vaguely calls it "unfair" without specifying how resentment responds uniquely to standing failures vs. content.  

  4. **Self-blame application (4 marks)**  
     - *Top:* Applies account to self-blame, showing why unrepentant self-flagellation lacks standing and why this coheres with the theory.  
     - *Middling botch:* Claims self-blame always has standing, or dismisses the challenge as irrelevant to interpersonal cases.  

  5. **Engagement with hardest objection (3 marks)**  
     - *Top:* Concedes a serious problem (e.g., that blamer may be correct) and rebuts by separating blame’s content from its pragmatic role.  
     - *Middling botch:* Ignores the objection or defends the thesis dogmatically.  

  6. **Structure & clarity (1 mark)**  
     - Logical flow, concision, and precision.  

  ---

  ### **Why this works for your goals:**  
  - **Forces engagement beyond readings:** The cases lack "stock" solutions in classical standing literature (e.g., Wallace, Scanlon), demanding original synthesis.  
  - **Handles sub-questions integrally:** (a) and (b) are embedded in the core argument, not tacked on.  
  - **Differentiation potential:** Top essays will develop a unified account (e.g., "shared vulnerability as felicity condition"); middling ones will treat cases separately or retreat to fairness/epistemic critiques.  
  - **Self-blame as litmus test:** Sharp students will see it reframes standing as structural to blame’s function, not contingent on the blamer’s history.  

  Let me know if you'd like minor tweaks to cases or marking weightings!
