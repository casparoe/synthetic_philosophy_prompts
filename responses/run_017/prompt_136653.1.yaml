prompt: |-
  My mate Dan has got this thing where he goes round labelling bits of social life "a convention" or "not a convention". He got into it after reading some philosopher a while back — Lewis, I think the name was — and he's been handing down verdicts on whatever example anyone puts to him for months. His track record so far:

  - driving on the left: convention
  - shaking hands when you meet someone: convention
  - everyone in his office starting emails "Hi [name]" rather than "Dear [name]": convention
  - at his parkrun everyone lines up on the left-hand side of the path, which apparently started because one week a marshal waved people over there and after that they just kept doing it: convention, and he said something like that's how these things get going, nobody has to sit down and agree to anything
  - not murdering people: not a convention ("that's just right and wrong")
  - wearing a seatbelt: not a convention ("nothing to do with what anyone else is doing")
  - stopping at red lights: not a convention ("there's a fine and a camera behind it, that's a rule")
  - a warm-up thing at his running club that about half the members do: not a convention, "not yet anyway, it's got to be near enough everyone"

  The line he keeps repeating is that a convention is something near enough everyone does, near enough everyone expects everyone else to do, and would keep doing for that reason alone. But he also keeps using the word "arbitrary", and I've never been able to work out what work it's actually doing there.

  So here's the case I want to put to him. Our building has bookable meeting rooms, and when the booking system went in about three years ago it came set to a default slot length of 25 minutes. Nobody chose 25, nobody agreed to it, it was just what the thing offered, and everyone booked whatever it offered. Now it's completely universal — everybody books in 25-minute blocks, and you'd be thought a bit odd, or a bit rude, if you booked a 30. Here's the bit I think matters: one of the office managers actually did the sums, and 30-minute slots would fit the working day better, you'd get noticeably more usable time out of the same rooms, and switching costs nothing except that it only works if everyone does it on the same day. Put everyone in a room and take a vote and I reckon it'd be unanimous for 30. But no one wants to be the only one doing it, so we're all still on 25. There's also a mildly bitchy Slack emoji people drop on a booking when someone's gone rogue and taken a 30 — but there's no actual rule, nothing in anyone's contract, no one's ever really been pulled up on it.

  Would Dan call the 25-minute thing a convention? More usefully: what's the rule he's actually running, and in particular what does "arbitrary" have to mean for all eight of his earlier verdicts to hang together? Is there a different rule that fits those eight just as well but comes out the other way on this one? Which do you think he'd go with, and which should he go with if he wants to be consistent with himself? Does it change anything that the 25 minutes came from a default nobody picked, or that there's now a bit of social side-eye holding it up? And what's the one further case I should throw at him that would actually tell the two rules apart — I thought about that keyboard layout story everyone knows, but it feels muddy to me and I can't say why, so something cleaner if you've got it.
reasoning: |-
  Hmm, the user is describing their friend Dan who uses David Lewis's convention theory to label social behaviors as "conventions" or not. Dan has given several examples: driving on the left, shaking hands, and email greetings are conventions, while not murdering, wearing seatbelts, stopping at red lights, and an incomplete running club warm-up are not. Dan's criteria are that it's something nearly everyone does, expects others to do, and continues doing because of that expectation, plus he emphasizes "arbitrary."

  The user presents a new case: meeting rooms booked in 25-minute blocks due to a default setting, even though 30 minutes would be more efficient. Switching would require collective action, but no one does it individually due to social pressure (like a mocking emoji), not formal rules. The user wants to know if Dan would call this a convention, what "arbitrary" means in this context, and how to test Dan's consistency.

  First, recall Lewis's definition: conventions are solutions to coordination problems where people prefer to align with others, and the solution is arbitrary because there's an alternative that would work just as well if everyone switched. For example, driving on the left vs. right is arbitrary—neither is inherently better, but consistency is key. In contrast, not murdering isn't arbitrary because it's morally wrong regardless of others' actions.

  Apply this to Dan's verdicts:
  - Driving on the left: Coordination problem (need consistent side), arbitrary alternative (right side exists), so convention.
  - Shaking hands: Similar—arbitrary greeting (could be bowing), coordination for social harmony.
  - Email greetings: "Hi" vs. "Dear" is arbitrary, office-wide expectation.
  - Parkrun lining up: Emerged without agreement, arbitrary (could be right side), now expected.
  - Not murdering: Moral, not coordination-based; doing it because it's wrong, not just to match others. Not arbitrary.
  - Wearing seatbelt: Safety-driven, individual benefit regardless of others. Not arbitrary.
  - Stopping at red lights: Rule with enforcement, not just mutual expectation. Lewis might see traffic lights as conventions if no enforcement, but Dan cites fines, so he distinguishes rules.
  - Running club warm-up: Only half do it, so not "near enough everyone," thus not a convention yet.

  Now, the meeting room case: 25-minute slots are universal due to default. The key points: 30 minutes would be better, but no one switches alone because of social expectation and the need for coordination. It fits the "everyone does, expects others to do, continues for that reason" part. But is it arbitrary? The user says 30 minutes is objectively better for efficiency. However, from a coordination perspective, the choice between 25 and 30 could be seen as arbitrary—neither is inherently superior in a way that overrides the need for uniformity. The inefficiency arises only if not everyone switches, making it a coordination problem. Also, the default setting acted as a focal point, similar to the parkrun example.

  So, Dan would likely call it a convention because: it solves a coordination problem (scheduling), the 25-minute norm persists due to mutual expectations, and while 30 is better, it's not so much better that it eliminates the need for coordination—individual deviations are penalized socially. The "arbitrary" aspect holds because any consistent duration could work; 25 was arbitrary initially, and now it's entrenched.

  To test consistency, consider a case where an alternative is clearly better even individually but still requires coordination. The keyboard layout (QWERTY vs. Dvorak) is a classic example: QWERTY is inefficient but entrenched due to network effects. If Dan calls it a convention, it aligns with the meeting room case. If not, why? Perhaps he might argue QWERTY isn't arbitrary if it's suboptimal, but Lewis focuses on the existence of alternatives, not optimality. A cleaner test: a town with two similar bridges to cross a river. People all use Bridge A out of habit, expecting others to, even though Bridge B is equally good. If Dan calls it a convention, it reinforces the meeting room verdict. If he doesn't, it might challenge his use of "arbitrary."
answer: |-
  Based on David Lewis's theory of conventions (which Dan is clearly drawing from), your meeting room case **is almost certainly a convention** – and Dan should call it one if he wants to stay consistent with his earlier verdicts. Let's break it down using Lewis's core criteria, how "arbitrary" fits in, and why your case hits every mark:

  ### Lewis's Criteria (and Dan's Application)
  1.  **Near-universal Compliance:** Something *nearly everyone* does.  
      *(Dan: Driving left, handshakes, email greetings, parkrun lining up all pass; murder/seatbelts/red lights/running warm-up fail on universality or basis).*

  2.  **Mutual Expectation:** Nearly everyone *expects* others to do it, and expects others to *expect* them to do it.  
      *(Dan: Clear for driving/handshakes/emails/parkrun; absent for murder/seatbelts/red lights (expectation comes from rules, not peers)/warm-up).*

  3.  **Preferential Coordination:** People prefer to conform *because* others conform. The behavior persists primarily due to this mutual expectation and desire for coordination.  
      *(Dan: Key for conventions; contrasts with moral duty (murder), personal safety (seatbelt), legal threat (red lights), or personal preference (warm-up)).*

  4.  **Arbitrariness (The Crucial Bit):** There's at least one *viable alternative* that would work *just as well* if everyone switched to it. The specific solution isn't uniquely optimal; its dominance comes from coordination, not inherent superiority.  
      *(Dan: Driving right works as well as left; bowing could replace handshakes; "Dear" could replace "Hi"; lining up on the right would work. Murder has no moral alternative; seatbelts lack a safer alternative; red lights lack a legal alternative; the warm-up lacks universality).*

  ### Applying this to Your Meeting Room Case
  -   **Universal Compliance?** Yes. Everyone books 25-minute slots.
  -   **Mutual Expectation?** Yes. Everyone expects others to book 25 minutes. The "bitchy emoji" proves the expectation and social enforcement.
  -   **Preferential Coordination?** **Yes.** People stick with 25 minutes *specifically because* others do. No one switches to 30 minutes alone because it doesn't work without coordination. The *reason* for compliance is the expectation of others' compliance.
  -   **Arbitrary?** **Yes.** 30-minute slots are a *viable alternative* that would work just as well (even better, efficiency-wise!) if everyone switched. The *only* reason 25 persists is because it's the entrenched coordination point. There's no inherent superiority to 25 minutes; its dominance is purely historical (the default) and self-reinforcing via expectations.

  ### Why "Arbitrary" Matters & How It Explains Dan's Verdicts
  "Arbitrary" **doesn't mean random, meaningless, or without reason.** For Lewis, it means:
  -   **Interchangeability:** There exists at least one other specific solution that could satisfy the same coordination need equally well *if universally adopted*.
  -   **Lack of Intrinsic Superiority:** The convention isn't the *only* possible solution or inherently better than alternatives *in isolation*. Its value comes from shared adherence.
  -   **Path Dependence:** The convention exists *because* it got established (often accidentally), not because it's uniquely best.

  **This explains all 8 verdicts:**
  -   **Conventions:** All have clear, equally functional alternatives (drive right, bow, "Dear", line up right).
  -   **Not Conventions:**
      -   *Murder:* No moral alternative. Intrinsically wrong.
      -   *Seatbelt:* Intrinsic personal safety benefit. No equally safe alternative behavior (not buckling up).
      -   *Red Lights:* Enforced rule, not mutual preference. The alternative (ignoring it) doesn't "work just as well" due to penalties. (If the camera broke and people *still* stopped purely out of mutual expectation, Dan *might* call it a convention).
      -   *Running Warm-up:* Fails universality ("near enough everyone") and mutual expectation ("not yet").

  ### Would Dan Call the 25-Minute Thing a Convention? (Prediction & Consistency)
  *   **He Should:** It perfectly fits Lewis's criteria. The parkrun example is the strongest parallel – an accidental starting point leading to universal, expectation-driven compliance with an arbitrary solution.
  *   **He Likely Will:** His emphasis on "nobody has to sit down and agree" (parkrun) directly applies to your system's default setting. The Slack emoji mirrors the social expectation/pressure seen in handshakes/emails.

  ### Does the Origin or Social Pressure Matter?
  *   **Default Setting:** Reinforces the "arbitrary" nature. It started accidentally, not because 25 was chosen as superior. Lewis highlights such "focal points" (like the parkrun marshal).
  *   **Social Side-Eye (Emoji):** This is *evidence* of mutual expectation and preferential coordination – key criteria! It shows people enforce the norm *because* they expect conformity.

  ### The Perfect Test Case: "The Two Bridges"
  Here's a cleaner, more fundamental test than keyboard layouts (which involve path dependence, efficiency debates, and sunk costs, muddying the "arbitrariness"):

  > **Scenario:** A village needs to cross a river. There are **two identical, equally sturdy bridges side-by-side (Bridge A and Bridge B)**. Historically, everyone used Bridge A because it was slightly closer to the original settlement. The settlement moved, and now both bridges are equally convenient. Yet, **virtually everyone still uses Bridge A**. People expect others to use A, use it themselves primarily because others do, and would find it slightly confusing/awkward if someone used B for no apparent reason. There's no rule or physical reason preventing Bridge B's use.

  *   **Lewis/Dan-Consistent Answer:** **Convention.** It hits all criteria:
      *   Universal compliance (using A).
      *   Mutual expectation.
      *   Preferential coordination (use A *because* others do).
      *   **Clear Arbitrariness:** Bridge B is a *perfectly viable, functionally identical alternative* that would work just as well if everyone switched. Using A has no inherent advantage; its dominance is purely coordination-based.

  *   **Why it's a great test:**
      *   Eliminates efficiency debates (bridges are identical).
      *   Eliminates sunk costs/history as a *justification* (settlement moved).
      *   Pure coordination + arbitrariness. If Dan calls this *not* a convention, he's likely misunderstanding "arbitrary" (perhaps conflating it with "random" or "unimportant") or downplaying the coordination motive. If he calls it a convention, it solidifies the interpretation applied to your meeting room case.

  **In summary:** Your 25-minute booking is a textbook Lewis convention. "Arbitrary" means a viable alternative exists (30 minutes), not that the convention lacks function or reason. Dan's verdicts hang together under this definition. The "Two Bridges" scenario is the ideal test to confirm his understanding of arbitrariness vs. pure coordination. Good luck with Dan – the bridge example should spark a fascinating discussion!
