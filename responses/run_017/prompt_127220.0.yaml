  ### **Unoccupied Logical Cells & Diagnoses**  
  The logical space allows 5 (shared) × 5 (location) × 5 (response) = 125 cells. Only 12 are occupied; the rest are unoccupied for these reasons:  
  - **Incoherent (85%)**: e.g., Claiming a *single shared feature* but *no location* for it, or *deflation* with *phenomenal realism*. (Example: Shared=Disjunctive + Location=Separable + Response=Shrink class → incoherent because disjunctive unity precludes shrinkage.)  
  - **Unattractive (10%)**: e.g., *Shared=Nothing* + *Location=Separable* + *Response=Shrink class* → no one defends this because if nothing is shared, shrinking doesn’t help.  
  - **Unexplored (5%)**: e.g., *Shared=Functional* + *Location=Adverbial* + *Response=Treat as simple* → coherent but ignored in literature.  

