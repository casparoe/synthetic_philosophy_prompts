  ### **Scoring Key for Characters**  
  *Based on your descriptions, placed into leaves. If a character drifts into an unoccupied cell, rewrite them.*  
  - **Marta (conservator)**: Position 4 (Adverbialism).  
    - *Why*: She treats solvents/varnish as activities done pleasurably (adverbial mode), not feeling-based. Proof/plum lack a common feel (disjunctive unity).  
  - **Kilian (composer)**: Position 12 (Axiological Eliminativism).  
    - *Why*: He denies most things are pleasurable (error theory), and his wine case shows retroactive rejection.  
  - **Eduarda (philosopher)**: Position 2 (Attitudinal Hedonism).  
    - *Why*: Borrowed afternoon centers on attitude toward grandson’s joy; she’d deflate hedonism into well-being if unity fails.  

  **Indistinguishable Pairs**:  
  - Positions 2 and 5 (Attitudinal Hedonism vs. Desire-Fulfillment) are indistinguishable with this tree.  
    - *Remediable?* Yes, with an extra case: e.g., "The habitual smoker." Attitudinal Hedonism (2) says wanting to continue defines pleasure; Desire-Fulfillment (5) requires active desire. The smoker (who acts habitually without desire) would be:  
      - Pleasure for (2), not for (5).  
  - Positions 7 and 10 (Phenomenal Conservatism vs. Qualia Realism) are indistinguishable.  
    - *Remediable?* No; both are phenomenal monisms differing only in response to failure, which no case tests directly. They are genuinely similar across cases.  

  **Case Utility**: All your six cases do discriminating work. "The erased swim" is the weakest (only splits Position 6 from 7), but it’s crucial for distinguishing relational vs. phenomenal views. No case is redundant.  

