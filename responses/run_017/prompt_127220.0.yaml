  ### **Leaf Positions**  
  1. **Phenomenalist Hedonism** (e.g., Bentham)  
     - *Shared Feature:* Single phenomenal quality (e.g., "hedonic tone").  
     - *Location:* Separable ingredient added to experiences.  
     - *Response to Unity Failure:* Shrink the base class (only sensory pleasures count).  
     - **Most awkward commitment**: Kilian’s stroke *must* involve residual pleasure (since he seeks it), so the "shine" isn’t essential to pleasure.  
  2. **Attitudinal Hedonism** (e.g., Davis)  
     - *Shared Feature:* Attitudinal (welcoming/wanting to continue).  
     - *Location:* Relation between experience and subject’s concerns.  
     - *Response to Unity Failure:* Deflate into subjective well-being.  
     - **Most awkward commitment**: The erased swim *must* have added value (attitudes existed then), even with no trace.  
  3. **Functional Role Hedonism**  
     - *Shared Feature:* Functional (reinforces behavior/motivation).  
     - *Location:* Functional role (e.g., reward signal).  
     - *Response to Unity Failure:* Pluralize value across kinds.  
     - **Most awkward commitment**: The habitual smoker *must* be experiencing pleasure (since it reinforces), even if they feel nothing.  
  4. **Adverbialism** (e.g., Ryle)  
     - *Shared Feature:* Disjunctive (no common core).  
     - *Location:* Adverbial mode (e.g., "scratching pleasurably").  
     - *Response to Unity Failure:* Pluralize value across kinds.  
     - **Most awkward commitment**: The proof and plum *must* share nothing phenomenally; their "pleasure" is just how they’re done.  
  5. **Desire-Fulfillment Theory**  
     - *Shared Feature:* Attitudinal (desire-satisfaction).  
     - *Location:* Relation to desires.  
     - *Response to Unity Failure:* Deflate into well-being.  
     - **Most awkward commitment**: The unexpected gift’s pleasure *must* vanish if desires change, even if the feeling lingers.  
  6. **Unnamed: Relational Disjunctivism**  
     - *Shared Feature:* Nothing shared.  
     - *Location:* Relation to context/subject.  
     - *Response to Unity Failure:* Error theory (hedonism is false).  
     - **Most awkward commitment**: The cinnamon room *must* have no valence; calling it "mixed" is a category error.  
  7. **Unnamed: Phenomenal Conservatism**  
     - *Shared Feature:* Single phenomenal quality.  
     - *Location:* Nothing over and above the experience.  
     - *Response to Unity Failure:* Treat pleasantness as simple/unanalysable.  
     - **Most awkward commitment**: The discredited wine *must* have been genuinely pleasant, even if Kilian now rejects it.  
  8. **Hybrid Attitudinal-Phenomenal**  
     - *Shared Feature:* Disjunctive (some have a feeling, others are attitudinal).  
     - *Location:* Varies by case.  
     - *Response to Unity Failure:* Pluralize value.  
     - **Most awkward commitment**: The runner’s high *must* be both painful and pleasurable at once, with no resolution.  
  9. **Unnamed: Non-Cognitive Hedonism**  
     - *Shared Feature:* Functional (motivational push).  
     - *Location:* Functional role.  
     - *Response to Unity Failure:* Shrink the base class.  
     - **Most awkward commitment**: The borrowed afternoon *must* lack pleasure; Eduarda’s "happiness" is just a behavioral disposition.  
  10. **Qualia Realism**  
      - *Shared Feature:* Single phenomenal quality.  
      - *Location:* Nothing over and above the experience.  
      - *Response to Unity Failure:* Shrink the base class.  
      - **Most awkward commitment**: The placebo pill’s feeling *must* be real and intrinsic, even if caused by deception.  
  11. **Unnamed: Attitudinal Mode Theory**  
      - *Shared Feature:* Attitudinal.  
      - *Location:* Adverbial mode.  
      - *Response to Unity Failure:* Deflate into well-being.  
      - **Most awkward commitment**: The nostalgic scent *must* derive pleasure from the attitude, not the scent.  
  12. **Axiological Eliminativism** (e.g., error theory)  
      - *Shared Feature:* Nothing shared.  
      - *Location:* No real property.  
      - *Response to Unity Failure:* Error theory.  
      - **Most awkward commitment**: All pleasures *must* be illusory; Marta’s "pleasure" in the proof and plum is a fiction.  

