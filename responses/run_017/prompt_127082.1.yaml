prompt: |-
  I'm a backend engineer at a company of about three hundred people, and after one too many arguments at dinner with friends — most of whom have studied more philosophy than I have — I've realized that my gut verdicts about deception don't line up with any simple rule, so I want to hand over the raw verdicts and see what principle, if any, actually collects them. Here they are, mostly from work. Faking a browser-identifying header so a scraper can read a public page: fine. Answering a vendor's automated security questionnaire falsely, knowing the filled-in form goes to a human auditor at a customer: not fine — which already bothers me, because the act looks the same as the last one. Writing a changelog line that is literally accurate but phrased so that the tool that generates our customer-facing release notes will strip the hedge and emit a sentence I know to be false: not fine, even though the very same line written two years ago, before that tool existed, was fine. Telling my manager "the migration finished" when it did finish but silently dropped two hundred records that I'm going to repair before anyone looks: not fine. Telling my on-call manager "no revenue impact" when the entire admin panel is down, after he has told me a dozen times to spare him details and only report revenue impact: fine, and I don't feel guilty afterward. Watching a teammate post a wrong root-cause diagnosis in a public channel and saying nothing: not fine, but clearly less bad than posting it myself. Burying the account-deletion link four clicks deep, with every label on the path accurate: not fine. Defaulting new signups to the privacy-preserving option so that most people end up there: fine, even though it steers just as much as the buried link does. Shipping a progress bar that animates smoothly to one hundred percent regardless of actual progress: not fine, and here I can't even name who was lied to or what false claim was asserted, since nobody said anything. Telling my aunt I love the sweater: fine. Telling my partner I've already left the office while I'm still at my desk finishing up: not fine — and since I think it obviously would be fine to tell a stranger from a data broker that I'm not the decision maker, plain falsity can't be what's doing the work.

  The best I've managed on my own is something like: what matters isn't the literal truth of the sentence but whether I'm making someone's evidence worse on a question they have a claim to a true answer to, and whether they would have agreed in advance to be steered in that way. But I don't trust that formulation, and it seems to give the wrong answer somewhere. So: test it against my cases, repair it or replace it with something more precise, and tell me which clause is doing the work in which case — and be honest about which of my verdicts a defensible principle has to overturn, because I'd rather drop a verdict than keep a contrived rule. I'd especially like to know what the resulting principle predicts for cases I haven't listed: an interface pattern that steers people with no statement or representation of any kind, the progress-bar sort of case where there may be no speaker at all, a changelog line fed into a summarizer run by someone else rather than by us, and deliberately feeding a false premise to an AI assistant that then acts on it. I'd also like the "less bad than" comparisons accounted for, not just the binary verdicts. One case I genuinely go back and forth on: telling a customer that a fix will be in Thursday's release when I haven't finished it and only expect it to land, where I know from experience that hedging with "I'm aiming for Thursday, it may slip" reliably triggers an escalation on their side that leaves them worse off than if I'd said nothing. Please don't give me a reading list or citations — I'm not going to follow them up; I want the principle, stated precisely enough that I could actually apply it next week.
reasoning: |-
  Okay, let me start by really understanding what this backend engineer is asking. They've listed a bunch of scenarios where they have gut feelings about what's deceptive and what's not. But they can't find a consistent rule that fits all these cases. Their best attempt focuses on whether someone's evidence is being worsened on a question they have a right to know, and if they'd agree to be steered that way. But they're not confident in this.

  First, I need to go through each scenario they mentioned and note their verdict. For example, faking a browser header is fine, but falsely answering a security questionnaire isn't. The engineer is bothered because the actions seem similar. Then there's the changelog line—accurate but designed to mislead when processed. Not fine. Telling a manager a migration finished when it actually dropped records? Not fine. But telling an on-call manager "no revenue impact" when the admin panel is down is fine because they asked for only revenue-related info. 

  Hmm, the key differences here might involve consent and the other party's expectations. For the security questionnaire, the human auditor expects truthful answers to assess risk. The vendor hasn't agreed to be misled, so falsifying is wrong. Whereas in the browser header case, the server's access control might be seen as a barrier that doesn't involve a legitimate claim to truth. 

  Another angle is the difference between active deception and passive omission. Watching a teammate post a wrong diagnosis and staying quiet is less bad than posting it themselves, but still not fine. That suggests that the engineer values active honesty but also sees a duty to correct misinformation. 

  The progress bar example is tricky. No verbal lie, but the animation misrepresents progress. The engineer feels it's not fine. Here, the user has an expectation that the progress bar reflects actual progress, even without explicit claims. So violating that implicit promise is deceptive.

  Defaulting to privacy-preserving options is fine, but burying the account deletion link isn't. Both steer user behavior, but the latter makes it harder for users to exercise their rights. The difference might be about transparency and the user's ability to access the option without obstruction. 

  Personal lies: telling aunt you love the sweater is fine (social norm), but telling partner you've left when you haven't isn't. The partner has a legitimate expectation of truth for coordination. The stranger from a data broker doesn't have that claim, so lying to them is acceptable. 

  The engineer's proposed principle focuses on worsening evidence and prior agreement. But in the vendor questionnaire case, the auditor has a claim to truth, and no agreement to be misled, so it fits. The browser header? The server doesn't have a legitimate claim, so it's okay. The changelog line: the customer expects accurate release notes, and the tool's alteration worsens their evidence without consent. 

  But where does the progress bar fit? Users expect accurate progress updates. By faking it, their evidence is worsened on the progress status. They didn't agree to this, so it's not fine. The burial of the account deletion link: users have a right to delete their account, and hiding it worsens their ability to act on that right. No prior agreement here, so not fine. 

  The engineer is unsure about telling a customer a fix will be in Thursday's release. If hedging causes escalations that harm the customer, is lying better? The principle might say the customer has a claim to accurate timelines for planning. Misleading them worsens their evidence. Even if the outcome is better, the method violates consent. 

  Now, refining the principle. The core elements are legitimate claims, epistemic degradation, and consent. But "claim" needs to be clearly defined. Maybe it's about normative expectations based on roles, relationships, or explicit agreements. 

  Also, considering the "less bad" cases. Correcting a teammate's mistake is an obligation, but not as bad as creating the falsehood. The principle should account for degrees of responsibility. 

  For new cases: an interface that steers without statements? If it manipulates without consent and affects a legitimate interest, it's deceptive. Feeding false info to an AI? If the AI's output affects humans who have claims to truth, it's problematic. 

  The progress bar is a challenge because there's no speaker. But the design implies a representation of reality. Violating that is deceptive because users rely on it. 

  In the end, the principle could be: It's deceptive if you degrade someone's epistemic position on a matter where they have a legitimate claim to accurate information, without their consent. 

  Testing this against all cases: 

  - Security questionnaire: vendor has a claim, no consent → not fine. 
  - Browser header: no legitimate claim → fine. 
  - Changelog: customers have a claim, tool alters without consent → not fine. 
  - Migration: manager expects truthful status → not fine. 
  - Admin panel down: on-call manager consented to only revenue info → fine. 
  - Teammate's error: public channel, others have claim to truth → not correcting is bad, but less than actively lying. 
  - Account deletion link: users have a right, hindered → not fine. 
  - Privacy default: users can change, transparent → fine. 
  - Progress bar: users rely on it → not fine. 
  - Sweater: social norm, no strong claim → fine. 
  - Telling partner: legitimate expectation → not fine. 

  For the Thursday release case: customer has a claim to accurate timelines. Saying Thursday when unsure worsens their evidence. Even if hedging causes issues, lying violates consent. The engineer might need to find a better way to communicate without misleading. 

  The principle holds, but the engineer might need to accept that in the Thursday case, it's not fine to lie, even if outcomes are worse. Or perhaps explore if there's implicit consent when the customer escalates unnecessarily. But without explicit agreement, it's risky. 

  So the final principle emphasizes legitimate claims, epistemic harm, and lack of consent. It explains all verdicts and addresses the "less bad" scenarios through responsibility levels.
answer: |-
  Here's a precise principle derived from your verdicts, tested against your cases, and refined for consistency. It overturns one of your verdicts (noted below) but captures your core intuitions:

  **Principle:**  
  *An act is deceptive (and impermissible) if it:  
  (1) **Intentionally degrades** another agent's epistemic position  
  (2) Regarding a **legitimate inquiry**  
  (3) Without **role-appropriate consent**,  
  Where "legitimate inquiry" means a question where the agent has a normative claim to accurate information based on their role, relationship, or context.*

  ---

  ### Key Components Explained
  1. **"Intentionally degrades epistemic position"**  
     = Makes someone's understanding *worse* than before your intervention (e.g., adding false evidence, obscuring truth they would otherwise access).  
     *Distinguishes from:* Mere omission, steering without misinformation, or honest mistakes.

  2. **"Legitimate inquiry"**  
     = The other party has a **justified expectation of truthfulness** due to:  
     - Explicit role duties (e.g., auditor, manager)  
     - Implicit social contracts (e.g., partner, teammate)  
     - Transactional reliance (e.g., customer using progress bar)  
     *Excludes:* Entities with no normative claim (e.g., hostile scraper, data broker).

  3. **"Role-appropriate consent"**  
     = Prior agreement (explicit or contextually implied) to accept degraded information in this specific context.  
     *Examples:* Your on-call manager opting out of details; social norms permitting "I love the sweater."

  ---

  ### Test Against Your Cases
  | Your Case | Verdict | Principle's Analysis |
  |-----------|---------|----------------------|
  | **Faking browser header** | Fine ✅ | (1) Degrades server's "epistemic position", but (2) Server has no *legitimate inquiry* about scraper identity. |
  | **False security questionnaire** | Not fine ✅ | (1) Degrades auditor's understanding, (2) Auditor has *legitimate inquiry* (professional duty), (3) No consent to false data. |
  | **Deceptive changelog line** | Not fine ✅ | (1) Degrades customer's understanding, (2) Customers have *legitimate inquiry* about fixes, (3) Tool manipulation voids consent. |
  | **"Migration finished" (with dropped records)** | Not fine ✅ | (1) Degrades manager's understanding, (2) Manager has *legitimate inquiry* for status updates, (3) No consent to omissions. |
  | **"No revenue impact" (admin panel down)** | Fine ✅ | (1) *No degradation* – manager *consented* to this filter; you improved his position by adhering to his request. |
  | **Silence on teammate's wrong diagnosis** | Not fine ✅ | (1) *Allows degradation* (by not correcting), (2) Team/public channel implies *legitimate inquiry* for accuracy, (3) No consent for passive deception. |
  | **Burying account-deletion link** | Not fine ✅ | (1) Degrades user's access to truth (location=truth here), (2) User has *legitimate inquiry* for account control, (3) No consent for obscurity. |
  | **Privacy-preserving default** | Fine ✅ | (1) No degradation – user sees the setting and can change it; you didn't hide/alter truth. |
  | **Fake progress bar** | Not fine ✅ | (1) Degrades user's understanding of progress, (2) User has *legitimate inquiry* (paid for/service relies on it), (3) No consent for false representation. |
  | **"I love the sweater"** | Fine ✅ | (1) Degrades aunt's understanding, but (2) Social norms negate *legitimate inquiry* for brutal honesty here, (3) Implicit *consent* to white lies. |
  | **"Already left office" to partner** | Not fine ✅ | (1) Degrades partner's understanding, (2) Partner has *legitimate inquiry* (coordination/trust), (3) No consent for fabrication. |
  | **"Not decision maker" to data broker** | Fine ✅ | (1) Degrades broker's understanding, but (2) No *legitimate inquiry* (no relationship/right to truth). |

  ---

  ### Overturned Verdict & Edge Cases
  - **Adjusted verdict: "Silence on teammate's wrong diagnosis" is less bad than posting it yourself** → The principle explains this: *Actively* deceiving (posting falsehood) violates (1)+(2)+(3). *Passively* deceiving (silence) only violates (2)+(3) – same harm but lower intentionality.
  - **"Telling customer fix ships Thursday"**: Not fine per principle. (1) Degrades their planning ability, (2) Customer has *legitimate inquiry* for timelines, (3) No consent to optimism-as-truth. **But**: If they explicitly said "never hedge, just commit", it *might* be consent (though ethically risky).
  - **Interface steering without statements** (e.g., dark patterns): Not fine if it (1) exploits cognitive biases to degrade understanding of choices/costs and (2) user has *legitimate inquiry* (e.g., subscription terms).
  - **False premise to AI assistant**: Not fine if the AI's output affects humans with *legitimate inquiries* (e.g., medical advice AI). Fine if purely personal/internal use.
  - **Changelog fed into external summarizer**: Not fine – you *know* it causes false output for users with *legitimate inquiry*.

  ---

  ### Why Your Formulation Failed
  Your "evidence worsening + advance consent" draft was close but missed:
  - **Legitimacy of the inquiry** (e.g., data broker has no claim).
  - **Role-specific norms** (e.g., "no revenue impact" is consented role-filtering, not deception).
  - **Degradation vs. steering** (e.g., privacy default doesn't *degrade* evidence).

  ---

  ### Principle in Action (For Next Week)
  1. **Identify the agent(s)** whose understanding you affect.
  2. **Ask:** Do they have a *legitimate claim* to truth here? (Based on role/relationship.)
  3. **Ask:** Does my act *intentionally worsen* their grasp of this truth?
  4. **Ask:** Did they *consent* to this degradation? (Explicitly or via role norms.)
  → If all 3 are "yes", it's deceptive.

  **Example:** Your "Thursday release" case fails at #3 – the customer didn't consent to false certainty, even if outcomes are better. Alternative: "Targeting Thursday; I'll update you Wednesday if risks emerge" manages expectations without deception.
