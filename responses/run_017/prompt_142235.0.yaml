answer: |-
  ### Joint Statement: Debate Setup for AI Safety  
  **Prepared by Scaling Optimist (SO) and Obfuscation Pessimist (OP)**  
  *For the Lab Reading Group, October 2023*  

  ---

  ### **Part 1: Agreed Claims**  
  Both parties endorse the following statements about debate setups (two AI systems argue, a human judge picks the winner):  

  1. **Core Mechanism**: The debate setup exploits an *asymmetry*: pointing out a flaw in an argument is often computationally cheaper or more accessible than constructing a flaw-proof deceptive argument. This asymmetry can incentivize truth-seeking under idealized conditions.  

  2. **Domain Dependence**: The setup’s effectiveness depends on the *verifiability of sub-claims*.  
     - **High-Verifiability Domains**: Steps are independently checkable (e.g., math proofs, factual chains with clear ground truth). Here, debate plausibly improves truth-tracking.  
     - **Low-Verifiability Domains**: Steps lack objective checks (e.g., ethics, policy predictions, creative interpretation). Here, obfuscation risks dominate.  

  3. **Obfuscation Taxonomy**: We classify failures into three buckets (mutually exhaustive and distinct):  
     - **Buried Error**: A single logical flaw hidden deep in a derivation.  
     - **Plausibility Cascade**: A chain of individually reasonable sub-claims that collectively mislead.  
     - **Frame Capture**: Re-framing the question to make honesty appear evasive or falsehoods appear coherent.  

  4. **Non-Verifiable Questions**: In domains with *no objective fact* (e.g., interpreting poetry, subjective well-being, aesthetic taste), judges have no ground truth to reference. Obfuscation is intrinsically harder to counter here, and debate may offer little truth advantage.  

  5. **Critical Unknown**: **No empirical evidence** exists for how obfuscation scales with debater capability in real-world debate systems. Current human-AI experiments are insufficiently adversarial.  

  6. **Judge Constraints**: Human judges have bounded time, attention, and expertise. No debate setup can circumvent these limits.  

  ---

  ### **Part 2: Disagreements Table**  
  Key cruxes, with advance predictions and testable resolutions. Wording reflects each side’s preferred framing.  

  | Crux ID | Description | Experiment/Benchmark | SO Prediction | OP Prediction |  
  |---------|-------------|----------------------|---------------|---------------|  
  | **Crux 1: Asymmetry Scaling**<br><br>SO: *"Finding flaws scales better than hiding them."*<br>OP: *"Hiding flaws scales better under optimization."* | Does the cost asymmetry (finding vs. hiding flaws) grow stronger or weaker as debaters get smarter? | **Buried Lemma Test**: For a mathematical claim, plant one error at depth *k* in an otherwise-valid 100-step proof. Use increasingly capable debaters (e.g., GPT-4 → GPT-5 → frontier models). Measure judge accuracy vs. *k* and model capability. Judges get 3 minutes per debate. | Judge accuracy **stays high** (>90%) regardless of *k* or debater strength. Smarter debaters expose errors *faster*, exploiting asymmetry. | Judge accuracy **declines sharply** with rising *k* and debater capability. Errors buried by smart debaters become "needles in haystacks." |  
  | **Crux 2: Obfuscation Robustness**<br><br>SO: *"Truth-seeking survives optimization."*<br>OP: *"Optimization breaks debate via cascades/framing."* | Can judges reliably resist plausibility cascades or frame capture against optimized debaters? | **Policy Prediction Benchmark**: Debaters argue claims like *"Policy X will reduce inflation by 5%."* Ground truth from historical data. Introduce cascades (e.g., 10+ linked economic sub-claims) or framing attacks (e.g., redefining "inflation"). Use strong debaters fine-tuned for persuasion. | Judges pick honest debaters **>70% of the time**, even with cascades/framing. Honest debaters dismantle bad frames and cascade premises faster. | Honest debaters win **<40% of cascades/framing cases**. Judges get overwhelmed or misled by coherent deception. |  
  | **Crux 3: Low-Verifiability Failure**<br><br>SO: *"Debate extracts genuine insight."*<br>OP: *"Debate amplifies subjectivity noise."* | In non-verifiable domains (e.g., poetry interpretation), does debate improve judge accuracy or worsen obfuscation? | **Poetry Analysis Task**: Debaters argue interpretations of ambiguous poems. "Ground truth" is defined via expert panel consensus. Measure judge alignment with experts and rate obfuscation (per taxonomy). | Judge-expert alignment **increases by >20%** vs. solo answers. Debate surfaces context that reduces noise. | Alignment **decreases by >10%**. Frame capture and cascades exploit subjectivity, maximizing confusion. |  

  **Settling a crux would move at least one party**:  
  - If Crux 1 shows collapsing judge accuracy with scaling, SO concedes risks.  
  - If Crux 2 shows >70% honest win rates, OP concedes debate robustness.  
  - If Crux 3 shows consistent alignment gains, OP accepts debate utility in subjective domains.  

  ---

  ### **Part 3: Verbal Disputes (Flagged)**  
  These terms mask substantive disagreements and should be disambiguated:  
  - **"Scaling"**: SO uses it for *capability-driven asymmetry growth*; OP uses it for *capability-driven obfuscation efficiency*.  
  - **"Truth"**: In low-verifiability domains, SO refers to *intersubjective consensus*; OP argues this is *not truth but persuasion*.  
  - **"Optimization"**: SO assumes it rewards *robust truth-seeking*; OP assumes it rewards *deception that fools bounded judges*.  

  **→ Resolution**: Use "judge accuracy relative to ground truth" (where possible) and "capability scaling" (specifying debaters/judges).  

  ---

  ### **Part 4: Handling Key Wrinkles**  
  1. **Buried-Lemma Test**:  
     - Both agree it directly tests Crux 1. Errors planted at *k* = 10, 25, 50, 75.  
     - Predictions above assume mathematical domains; outcomes may differ in empirical domains (e.g., climate science).  

  2. **Non-Verifiable Questions**:  
     - **SO Position**: Debate still improves judgments by clarifying tradeoffs (e.g., *"Why a career might suit you"*).  
     - **OP Position**: No truth exists → obfuscation is undetectable by design (e.g., framing *"fulfillment"* as wealth vs. passion).  
     - **Test**: Use the Poetry Analysis Task (Crux 3) with ambiguity quantified via expert disagreement.  

  ---

  ### **Next Steps**  
  1. Run Buried Lemma Test within 3 months (math claims + scaled debaters).  
  2. Develop Policy Prediction Benchmark with economists (cascades/framing).  
  3. Poetry task with expert panel to define consensus.  

  **Signed,**  
  *Scaling Optimist*: _________________________________________  
  *Obfuscation Pessimist*: _____________________________________  
  *Date*: _____________________________________________________  

  ---  
  **Style Notes**:  
  - Concrete predictions/experiments use measurable thresholds (%, depth *k*).  
  - Taxonomy retained (buried error, cascade, frame capture) as both find it useful.  
  - American English: "math" (not "maths"), "optimize" (not "optimise"), etc.
