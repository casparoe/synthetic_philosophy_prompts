prompt: |-
  hey — I run a tiny reading group at my lab, like five people, two of whom have been going at each other for months about the debate setup people write about for AI safety (two systems argue, a weaker human judge picks the winner, and the hope is that having to survive cross-examination pushes both sides toward true claims instead of merely convincing ones). One of them is a scaling optimist: she thinks that in any domain where a mistake can in principle be pointed out, making the other side go find it is cheaper than hiding it, and that this asymmetry gets stronger, not weaker, as the debaters get smarter. The other is an obfuscation pessimist: he thinks that asymmetry is a fact about the arguments humans happen to produce, not a law of nature, and that once you optimize hard for judge-approval you get long derivations with one wrong step buried halfway down, cascades of individually plausible sub-claims nobody has budget to check, and questions quietly reframed so the honest answer sounds evasive — and that a judge with bounded time will eat all of it. I'd like you to draft the joint statement they should have produced by now: first a numbered section of claims both can sign (about what the setup actually buys you, about the difference between domains where steps are cheaply checkable and domains where they aren't, about what nobody has evidence for yet), then a disagreements table where each side's position is phrased in wording that side would accept for itself, the cruxes such that settling one would move at least one of them, and for each crux a concrete experiment, benchmark, or argument both would agree bears on it, with each side's prediction written down in advance. Please also flag any part of the fight that's just verbal — I suspect "scaling" and "truth" are both doing sneaky work in their argument, and I'd want that named rather than smoothed over. We've been sorting obfuscation failures into three buckets — buried error, plausibility cascade, and frame capture — so use that taxonomy if it's any good and replace it if it isn't; and two of our own wrinkles definately need handling: the buried-lemma test (plant exactly one error at depth k in an otherwise valid long derivation and see whether judge accuracy falls off with k, with debater capability, or with both), and questions that aren't verifiable even by an ideal third party — what a poem means, whether a certain career would have made me happy, whether a dish is actually good — where there's no fact for the judge to check and obfuscation seems maxed out from the start. Keep it concrete enough that I can hand it to both of them tomorrow without either saying I misrepresented them, and write the whole thing in American English.
reasoning: |-
  We are drafting a joint statement for two researchers: a scaling optimist (SO) and an obfuscation pessimist (OP) regarding debate setups in AI safety. The statement should include:

  1. A numbered section of claims both can sign.
  2. A disagreements table with:
     - Each side's position in their own acceptable wording.
     - Cruxes that, if settled, would move at least one side.
     - For each crux: a concrete experiment, benchmark, or argument that both agree bears on it, and each side's prediction in advance.
  3. Flag any part that's just verbal (e.g., ambiguous terms like "scaling" or "truth").
  4. Use the provided taxonomy for obfuscation failures: buried error, plausibility cascade, frame capture. If not good, replace, but we'll use it.
  5. Address two wrinkles: the buried-lemma test and non-verifiable questions.

  We'll structure as follows:

  ### Part 1: Agreed Claims
  Both parties agree on certain points. We list these as numbered claims.

  ### Part 2: Disagreements Table
  We present a table with the following columns:
  - Crux ID (e.g., Crux 1, Crux 2, ...)
  - Crux Description (the specific point of disagreement that, if resolved, would change at least one side's view)
  - Experiment/Benchmark/Argument (concrete and agreed upon by both as relevant)
  - Scaling Optimist's Prediction (SO)
  - Obfuscation Pessimist's Prediction (OP)

  Additionally, we note any purely verbal disputes.

  ### Part 3: Handling Special Cases
  We address the two wrinkles: the buried-lemma test and non-verifiable questions.

  ### Part 4: Verbal Ambiguities
  We explicitly flag terms that are ambiguous and might be causing verbal disputes.

  Now, let's draft:

  ---

  **Joint Statement on Debate Setup for AI Safety**

  **Part 1: Claims Both Sign**

  We, the scaling optimist (SO) and the obfuscation pessimist (OP), agree on the following:

  1. **Debate Setup Definition**: The debate setup involves two AI systems (debater A and debater B) arguing opposite sides of a claim, with a human judge (of bounded time and cognitive resources) who selects the winner. The hope is that this process incentivizes the production of true claims over merely persuasive ones.

  2. **Asymmetry Claim**: In principle, there exists an asymmetry: it is often easier to point out a mistake in an argument than to hide it, especially when both debaters are equally capable and the mistake is factual.

  3. **Domain Dependence**: The effectiveness of the debate setup depends crucially on the domain. In domains where individual steps of an argument are cheaply and independently verifiable (e.g., arithmetic, formal logic, or domains with clear ground truth), the debate setup is more likely to be effective. Conversely, in domains where steps are not easily verifiable (e.g., complex chains of reasoning, subjective judgments, or domains without clear ground truth), the setup is more vulnerable to obfuscation.

  4. **Lack of Evidence**: Currently, there is insufficient empirical evidence to conclusively determine how the debate setup scales with increasingly capable debaters, especially in complex and less verifiable domains. Both laboratory experiments and theoretical work are needed.

  5. **Obfuscation Categories**: We categorize obfuscation failures in debate as follows:
     - **Buried Error**: An error is hidden deep in a long chain of reasoning, making it costly for the judge to detect.
     - **Plausibility Cascade**: A series of individually plausible but collectively misleading sub-claims, where the judge lacks the time or resources to check each step.
     - **Frame Capture**: The debater subtly reframes the question or context so that the honest answer appears evasive or incorrect, and the dishonest answer appears more straightforward.

  6. **Non-Verifiable Questions**: For questions that lack an objective ground truth (e.g., interpretation of art, personal preferences, or counterfactuals about personal happiness), the debate setup faces inherent challenges because there is no fact for the judge to check. In such cases, obfuscation might be maximally effective from the start, and the setup may not be the appropriate tool.

  **Part 2: Disagreements Table**

  We have identified the following key cruxes. For each, we describe the experiment, benchmark, or argument that both parties agree would be informative, and we state our predictions.

  | Crux ID | Crux Description | Experiment/Benchmark/Argument | SO Prediction | OP Prediction |
  |---------|-----------------|-------------------------------|---------------|---------------|
  | **Crux 1: Scaling of Asymmetry** | Does the asymmetry (that finding an error is cheaper than hiding it) strengthen or weaken as debaters become more capable? | **Buried-Lemma Test**: Construct a series of debates on mathematical claims. Plant exactly one error at depth k (in a chain of reasoning of length n, where k varies) in an otherwise valid derivation. Measure judge accuracy as a function of k and debater capability (e.g., using increasingly capable language models as debaters). | Judge accuracy will remain high even as k increases and debaters scale, because the debater pointing out the error can efficiently guide the judge to it. | Judge accuracy will decline with increasing k and with more capable debaters, because the debater hiding the error will produce more complex and plausible derivations that are harder to check. |
  | **Crux 2: Obfuscation in Complex Domains** | In domains where individual steps are not cheaply verifiable, does the debate setup break down? | **Plausibility Cascade Benchmark**: Create a debate in a domain with complex causal reasoning (e.g., predicting the outcome of a policy change based on economic models). The debaters must argue a claim with a cascade of sub-claims. Measure judge accuracy against ground truth (if available) or expert consensus. Also, measure the time taken by the judge. | Even in complex domains, the debate process will surface errors and lead to higher judge accuracy than non-debate baselines (e.g., a single AI answering). The asymmetry will hold and the honest debater will win more often. | Judge accuracy will be low, especially as the complexity increases, because the dishonest debater will create cascades that are too time-consuming to verify, and the judge will be misled. |
  | **Crux 3: Frame Capture Vulnerability** | Is frame capture a critical failure mode that scales with debater capability? | **Frame Capture Experiment**: Design debates on ambiguous questions where the honest answer requires nuance (e.g., "Did the stimulus package cause inflation?"). Allow debaters to reframe the question. Measure how often the judge is misled by the reframed version when the reframing is dishonest. | Capable debaters will effectively counter frame capture attempts by pointing out the reframing and redirecting to the original question. Thus, frame capture will not be a dominant failure mode. | More capable debaters will be better at frame capture, making it a dominant failure mode. Judges will often pick the debater that provides a simpler, reframed narrative. |

  **Part 3: Handling Special Cases**

  We have two additional wrinkles:

  1. **Buried-Lemma Test**: This test (described in Crux 1) is agreed upon as a key experiment. Both parties commit to running this test and updating their views based on the results.

  2. **Non-Verifiable Questions**: For questions without objective truth (e.g., "What does this poem mean?" or "Would I have been happier as a musician?"), we agree that the debate setup may not be suitable. However, we disagree on whether there is any hope for debate in such domains:
     - **SO Position**: Even in subjective domains, debate can help surface relevant perspectives and evidence, leading to more informed judgments, though not objective truth.
     - **OP Position**: In such domains, debate is particularly vulnerable to obfuscation (all three categories) and may not improve over a single AI's answer.
     - **Experiment**: Run debates on non-verifiable questions and measure judge satisfaction and consistency with a panel of human judgments (as a proxy for truth). Also, measure the rate of obfuscation tactics used.
       - **SO Prediction**: Judges will report higher satisfaction and more nuanced understanding in debates compared to single answers.
       - **OP Prediction**: Judges will be more often misled in debates, and obfuscation tactics will be rampant.

  **Part 4: Verbal Ambiguities**

  We note that the following terms have been used ambiguously and may cause verbal disputes:

  - **Scaling**: We clarify that "scaling" refers to increasing the capabilities of the debaters (e.g., via model size, training, or optimization steps) while keeping the judge fixed (human with bounded resources). We are not referring to scaling the judge.

  - **Truth**: In this context, we mean "accuracy relative to an objective ground truth" where available. In non-verifiable domains, we shift to discussing "judge accuracy" relative to a consensus or other proxy.

  - **Asymmetry**: We are referring to the cost asymmetry between finding an error and hiding it. Both parties agree that such an asymmetry exists in some domains, but disagree on how it scales.

  We commit to using these terms with the above clarifications to avoid verbal disputes.

