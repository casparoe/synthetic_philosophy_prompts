  | The theory must distinguish obligations owed solely to convention participants from those enforceable by any affected party. | Queue-jumping that causes no delay: only queuers may object, not distant bystanders. | Non-negotiable | Theories granting non-participants equal standing to participants. |
  | The theory must not derive moral force solely from a convention’s existence. | A contested or recently imported convention (e.g., queuing in a society unaccustomed to it). | Non-negotiable | Theories that reduce obligation to mere statistical regularity. |
  | The theory must account for material effects separately from conventional signalling. | Queue-jumping with no delay: materially harmless but signals disrespect. | Non-negotiable | Theories collapsing symbolic and tangible wrongs. |
  | The theory must explain obligations of non-participants (e.g., visitors) without presumptive binding. | A visitor from a no-tipping country interacting with a tipping convention. | Non-negotiable | Theories that bind visitors automatically via territorial presence. |
  | The theory must accommodate conventions that explicitly exempt non-participants. | A tipping culture where locals routinely excuse tourists from tipping. | Non-negotiable | Theories ignoring how exemptions modify obligations. |
  | The theory must differentiate free-riding (exploiting others’ compliance) from mere non-compliance. | Not tipping where wages assume tips: the violator benefits from others’ adherence. | Non-negotiable | Theories equating all breaches with free-riding. |
  | The theory must disentangle the convention from its distributive outcomes. | A tipping convention sustaining low wages: obligation persists even if outcomes are unjust. | Non-negotiable | Theories making obligation contingent on distributive fairness. |
  | The theory must clarify when non-compliant bystanders may demand compliance. | A queue-jumper admonished by someone not in the queue. | Preference of one camp (standing requires justification) | Theories indiscriminately granting or denying standing to bystanders. |
  | The theory must reconcile the export test (universal adoption of visitor’s convention) with present obligations. | A visitor from a no-tipping country: their home norm might be superior if adopted here, but they may still owe compliance today. | Non-negotiable | Theories reducing obligations to the export test’s outcome. |
  | The theory must explain conventions reliant on partial non-compliance or non-participation. | Tipping in tourist hubs: the system functions because locals tip consistently, even if some tourists defect. | Non-negotiable | Theories requiring universal compliance for functionality. |
  | The theory must deem some breaches permissible when negligible harm and no unfair advantage exist. | Jaywalking alone on an empty road: no apology owed. | Non-negotiable | Theories condemning all deviations as wrongful. |
  | The theory must recognise breaches that wrong only participants, not the public. | Queue-jumping that delays one person: only the affected queuer may claim redress. | Non-negotiable | Theories treating every breach as a public wrong. |
  | The theory must recognise breaches that wrong all affected parties, granting universal standing to object. | Not tipping a worker reliant on tips: fellow diners or the employer may legitimately object. | Non-negotiable | Theories restricting standing to direct participants. |
  | The theory must address conventions where signalling outweighs material impact. | Jaywalking alone: minimal risk but potentially erodes a coordination norm. | Non-negotiable | Theories ignoring the expressive dimension of conventions. |

