  A new scheduling system is introduced that allows for more flexible use of OR time, and it turns out that a new allocation option becomes available that was not feasible under the old rules. This new option is represented by the point (0.6,0.6), which is a balanced allocation that is now possible because the flexible scheduling allows both departments to use the OR more efficiently when they share it equally, and the equipment budget is split evenly. This point is added to the feasible set.

  The feasible set for B is the convex hull of the same points as A plus (0.6,0.6). The disagreement point remains (0,0), and the ideal point is still (1,1) because the new option does not allow any party to exceed their previous maximum utility.

