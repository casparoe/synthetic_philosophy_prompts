  **Story for Version A:**

  The Cardiology Department (Dr. Smith) and Orthopedics Department (Dr. Jones) at Mercy Hospital are negotiating the allocation of OR time and a shared equipment budget for the next year. The hospital rules require that the allocation be made from a specific set of options due to historical usage patterns. The feasible utility pairs (after normalization) are the convex hull of (0,0) [both get minimum baseline], (1,0) [all OR time and equipment to Cardiology, allowing them to run at full capacity], (0,1) [all to Orthopedics], and (0.4,0.8) [a allocation that gives Orthopedics a relatively high utility because it includes a large block of OR time and a moderate equipment budget that is very efficient for their procedures, while Cardiology gets a smaller share]. 

  - The point (0.4,0.8) arises because Orthopedics has a threshold effect: they need a minimum equipment budget to be effective, and once that is met, additional OR time yields high returns, while Cardiology experiences diminishing returns in OR time without sufficient equipment.

