  ### Negotiation Scenario: Hospital Department Heads Allocating Operating Room Time and Equipment Budget

  **Parties:** Dr. Smith (Cardiology Department) and Dr. Jones (Orthopedics Department) at Mercy Hospital.  
  **Disagreement point (d):** (0,0) — both departments receive only baseline resources (minimal OR time and equipment) with no cooperative gains.  
  **Ideal point:** (1,1) — Smith’s maximum utility (1) comes from exclusive access to OR time, as cardiology procedures are highly time-sensitive and yield high returns with more time. Jones’ maximum utility (1) comes from exclusive equipment access, as orthopedic surgeries rely heavily on specialized tools, with diminishing returns on OR time beyond a threshold.  

  **Version A (Initial Feasible Set):**  
  Due to rigid scheduling rules, allocations are limited to predefined packages. The feasible set (convex hull) includes:  
  - (0,0): Disagreement (baseline).  
  - (1,0): All OR time to Smith (cardiology thrives with time-sensitive procedures).  
  - (0,1): All equipment to Jones (orthopedics gains most from tools).  
  - (0.4,0.8): Moderate OR time for Smith + high equipment for Jones (orthopedics has high returns on equipment up to a threshold).  
  - (0.8,0): High OR time for Smith + no equipment (cardiology has diminishing returns without tools).  
  *Normalized utilities:* Smith’s max = max(1, 0.8) = 1 (at (1,0)), Jones’ max = max(1, 0.8) = 1 (at (0,1)), so ideal point = (1,1).  

  **Change to Version B:**  
  A new hospital rule allows flexible time-sharing of OR slots (e.g., half-days), creating a new allocation option: (0.6,0.6). This point represents equal OR time and equipment, leveraging efficiency gains from shared scheduling. Version B’s feasible set is the convex hull of Version A’s points plus (0.6,0.6).  
  *Ideal point unchanged:* Smith’s max = max(1, 0.8, 0.6) = 1 (at (1,0)), Jones’ max = max(1, 0.8, 0.6) = 1 (at (0,1)), so still (1,1).  

  ---

  ### Arithmetic Verification (all utilities normalized)
  **Version A Feasible Set:** Convex hull of (0,0), (1,0), (0,1), (0.4,0.8), (0.8,0).  
  - **Nash solution (maximize \(u_s \times u_j\)):**  
    - Product at vertices: (1,0)→0, (0,1)→0, (0.4,0.8)→0.32, (0.8,0)→0.  
    - Edge (0.4,0.8) to (1,0): Line \(u_j = \frac{4}{3} - \frac{4}{3}u_s\). Product \(u_s(\frac{4}{3} - \frac{4}{3}u_s)\).  
      Derivative: \(\frac{4}{3} - \frac{8}{3}u_s = 0\) → \(u_s = 0.5\), \(u_j = \frac{4}{3} - \frac{4}{3}(0.5) = \frac{2}{3} \approx 0.667\).  
      Product: \(0.5 \times 0.667 = 0.333\).  
    - Edge (0.4,0.8) to (0.8,0): Line \(u_j = 1.6 - 2u_s\). Max product at endpoint (0.4,0.8)→0.32.  
    - **Nash solution: (0.5, 0.667)**, product = 0.333.  
  - **KS solution (intersection of ray \(u_s = u_j\) with Pareto frontier):**  
    - Ray \(u_s = u_j\) intersects edge (0.4,0.8)-(1,0): \(u_s = \frac{4}{3} - \frac{4}{3}u_s\) → \(u_s = u_j = \frac{4}{7} \approx 0.571\).  
    - **KS solution: (0.571, 0.571)**.  

  **Version B Feasible Set:** Convex hull of Version A’s points plus (0.6,0.6).  
  - **Nash solution:**  
    - New edge (0.4,0.8) to (0.6,0.6): Line \(u_j = 1.2 - u_s\). Product \(u_s(1.2 - u_s)\).  
      Derivative: \(1.2 - 2u_s = 0\) → \(u_s = 0.6\), \(u_j = 0.6\). Product: \(0.6 \times 0.6 = 0.36\).  
    - Edge (0.6,0.6) to (1,0): Line \(u_j = 1.5 - 1.5u_s\). Max product at (0.6,0.6)→0.36 (endpoint).  
    - Product at (0.5,0.667)→0.333 < 0.36.  
    - **Nash solution: (0.6, 0.6)**, product = 0.36.  
  - **KS solution:**  
    - Ray \(u_s = u_j\) intersects new edge (0.4,0.8)-(0.6,0.6): \(u_s = 1.2 - u_s\) → \(u_s = u_j = 0.6\).  
    - **KS solution: (0.6, 0.6)**.  

  **Comparison:**  
  - **Nash solution:** Smith increases from 0.5 to 0.6 (+0.1), Jones *decreases* from 0.667 to 0.6 (-0.067).  
    → Jones gets strictly less in Version B.  
  - **KS solution:** Both increase from 0.571 to 0.6.  
    → Both weakly better, strictly better for both.  
  - **Conditions satisfied:**  
    (i) Version B strictly contains Version A (e.g., (0.6,0.6) not in A).  
    (ii) Ideal point unchanged at (1,1) (max utilities still 1 for both).  
    (iii) Nash gives Jones strictly less in B.  
    (iv) KS gives both strictly more in B.  

  ---

  ### Key Feature and Robustness
  **Load-bearing feature:** The new point (0.6,0.6) bulges the frontier asymmetrically, favoring Smith (who had diminishing returns without equipment) over Jones (who had high equipment returns up to a threshold). This shifts the Nash tangency point rightward, reducing Jones’ utility despite the expansion.  
  - **If mirrored (e.g., add (0.8,0.4) instead):** Nash solution becomes (≈0.55,0.72), helping Jones and hurting Smith—no violation of monotonicity for the *same* party.  
  - **If expansion raises one maximum (e.g., Jones’ max to 1.2):** KS would change (as ideal point moves), voiding the monotonicity axiom for KS—no longer a counterexample.  

  ---

  ### Nash Partisan Rebuttal and Example’s Bite
  **Rebuttal:** A Nash defender would argue:  
  1. **Monotonicity is less important than Independence of Irrelevant Alternatives (IIA).** Nash satisfies IIA (if the solution remains feasible after set reduction, it doesn’t change), while KS violates it. Here, Version B’s Nash solution (0.6,0.6) wasn’t feasible in A, so IIA doesn’t apply—no inconsistency.  
  2. **Normalization distorts fairness.** Jones’ loss stems from artificially capping utilities at 1. If utilities are absolute (e.g., Jones gains 10% more equipment in B), the Nash gain (0.6 vs. 0.5 for Smith, 0.6 vs. 0.667 for Jones) might reflect real Pareto improvement (both gain in absolute terms if utilities are ratio-scaled).  
  3. **KS’s reliance on ideal points is flawed.** Ideal points can be manipulated (e.g., by exaggerating threats), making KS less robust than Nash.  

  **Does the example bite?** **Yes, but contextually.**  
  - It *does* demonstrate Nash’s violation of monotonicity under fixed normalization, making it pedagogically useful for contrasting axioms.  
  - It *does not* invalidate Nash if IIA or non-normalized utilities are prioritized. The Nash partisan can reasonably argue that Jones’ "loss" is an artifact of normalization or that the expansion inherently benefits Smith more.  
  - **Ultimate takeaway:** The example cleanly shows the axiomatic trade-off (IIA vs. monotonicity) but doesn’t resolve which axiom is "correct"—it hinges on normative preferences in bargaining. For your partisan friend: if they value IIA over monotonicity, they can shrug; if they concede normalization is fair, it bites.  

  This provides a concrete, non-abstract case for your group to debate the axioms’ real-world implications.
