  Version A Feasible Set: Convex hull of (0,0), (1,0), (0,1), (0.4,0.8)

  - Nash solution: on edge (0.4,0.8)-(1,0): maximizes product at (0.5, 2/3) ≈ (0.5, 0.6667); product = 0.5 * 2/3 ≈ 0.3333.
  - KS solution: intersection of u1=u2 and edge (0.4,0.8)-(1,0): (4/7,4/7)≈(0.5714,0.5714)

  Version B Feasible Set: Convex hull of (0,0), (1,0), (0,1), (0.4,0.8), (0.6,0.6)

  - Nash solution: at (0.6,0.6); product=0.36.
  - KS solution: at (0.6,0.6).

  **Which feature is doing the work?**

  The key feature is that the new point (0.6,0.6) is on the ray u1=u2 and is beyond the old KS point, and it is also a point that is more balanced than the old Nash solution for Jones (who previously got more). The expansion is asymmetric: it adds a point that benefits Smith more than Jones relative to the old allocation. The old Nash solution was at a point where Jones was favored, and the new point pulls the Nash maximizer to a point that is better for Smith but worse for Jones.

  If we were to mirror the added options (say, add a point that favors Jones symmetrically, like (0.8,0.4)), then we might not get the violation. But note: if we add (0.8,0.4) to A, then the Nash solution might move to a point that is better for Jones and worse for Smith? But we want the same party to lose in the same example.

  If the expansion raised one side's maximum, then the ideal point would change, and the KS solution would be affected by the new ideal point. In particular, the monotonicity axiom for KS requires that when the feasible set expands and the ideal point remains the same, then no player gets worse off. But if the ideal point changes, then that axiom doesn't apply. So our example relies on the ideal point being fixed.

  **The Nash partisan's reply:**

  A Nash partisan might argue that the loss for Jones in this example is not a flaw of the Nash solution but rather an artifact of the normalization. Specifically, the normalization sets each party's best possible outcome to 1, but in reality, the utility functions might not be comparable across scenarios. In particular, the utility of 1 for Jones in Version A might represent a different level of absolute benefit than in Version B? But in our example, the disagreement point and the ideal point are defined the same way in both versions, so the utility functions are comparable.

  The more principled reply is that the Nash solution satisfies independence of irrelevant alternatives (IIA): if the feasible set shrinks from B to A and the solution in B was in A, then the solution should be the same in A. In our case, the Nash solution in B (0.6,0.6) is not in A, so IIA doesn't require it to be the same. However, the example shows that when we expand the set, the solution can move in a way that hurts one player. But the Nash partisan might say that this is acceptable because the new point (0.6,0.6) is a relevant alternative that should be considered, and it changes the fair allocation.

  Moreover, the partisan might argue that the KS solution, by using the ideal point, is sensitive to the maximum utilities, which might not be well-defined or might be arbitrary. For example, if in Version B the new option (0.6,0.6) had been there from the beginning, then the ideal point would be the same, but the KS solution would be the same as we computed. However, if the utility functions are not ratio-scale comparable, then the normalization might be misleading.

  But in this case, since the example is set up with normalized utilities and the story provides a reason for the utilities, it does bite against the Nash solution if one accepts the axiom of monotonicity (that when the set expands and the ideal point remains fixed, no one should be worse off) as more important than IIA.

  Ultimately, the example shows a tension between the axioms: you cannot have both IIA and monotonicity (with fixed ideal point) in a solution that also satisfies the other standard axioms (efficiency, symmetry, etc.). So it is a matter of which axiom one values more.

  In this specific case, the example does bite in the sense that it shows a violation of monotonicity for the Nash solution. The Nash partisan might shrug it off by saying that monotonicity (in this form) is not desirable, or that the normalization hides the fact that the players' utilities are not interpersonally comparable.

  But in the context of the normalization, the example is valid. So it should serve as a good example for the reading group.
