answer: |-
  ## Address: The Sentence the Situation Calls For  

  [Adjust microphone, smile at both sides of the room]  

  Good morning. Novelists and philosophers. Readers and thinkers. Two tribes, perhaps, gathered to talk about fiction and truth. I suspect many of you here today already have a script in mind for this conversation. The philosophers – especially the deflationists among you – might be bracing for grand claims about fiction revealing Deep Metaphysical Truths. And the novelists and readers – you might be hoping I’ll confirm that fiction, precisely *because* it isn’t fact-bound, touches a richer, more profound kind of truth than mere reportage.  

  Let me disappoint both expectations immediately. I won’t be invoking capital-T Truth today. Not because I dismiss it, but because I find the deflationist insight about truth… incredibly *useful* for understanding what fiction actually *does*.  

  The deflationist says: to call a sentence “true” adds nothing substantial beyond the sentence itself. “Snow is white” is true if, and only if, snow is white. Truth isn’t some mysterious, heavy property we bestow upon a sentence; it’s a kind of grammatical shorthand, a way of agreeing or endorsing. It’s like pointing to an umbrella and saying, “That works.” What matters is the *working* – the keeping dry – not some extra, hidden “umbrella-ness” we’re invoking.  

  So, if calling something “true” simply reaffirms the sentence itself, what does a novel *do*? It doesn’t assert facts about the world like a history book. It doesn’t even assert facts in the way a deflationist might easily disquote. A novel *creates* a situation. It builds a world, characters, pressures, histories, desires. And within that constructed situation, it offers **sentences that are exactly the sentences the situation calls for.**  

  Fiction’s power isn’t about securing an extra property called “truth.” It’s about **precision under pressure.** It’s about crafting a description, a line of dialogue, an observation, that feels *inescapable* within the world the novel has built. It’s the sentence that couldn’t be otherwise, given who these people are, what they want, and what they’ve done. When we say a novel feels “true,” we don’t (or shouldn’t) mean it corresponds to some external, hidden reality. We mean it has achieved a kind of **internal accuracy** – a devastating fitness – that makes the situation *unignorable* for the reader. It’s a description you can *act on*, emotionally, imaginatively, ethically – not because it reveals a universal secret, but because its precision within its own frame demands your engagement. You believe *in* it, not *that* it.  

  This brings me to my own work – a wrinkle I’ve been asked not to smooth over. My recent novels are written in what’s been called the “secondhand manner.” Nothing is asserted directly by an authoritative narrator. Every claim, every description, reaches the reader filtered: overheard, reported, slanted by characters with agendas, biases, blind spots, and outright lies. The books never once ask to be *believed* in the factual sense. They withhold assertion altogether.  

  So, if the deflationist is right, and “truth” adds nothing beyond the sentence itself, what changes when assertion is withheld? What’s lost? What’s gained?  

  On the deflationist view, the *formal* loss is minimal. I never offer a sentence like “Charles was sad” that could even *be* disquoted (“‘Charles was sad’ is true iff Charles was sad”). I only offer “According to Mary, who envied him, Charles *seemed* sad, though she might have misread his usual reserve.” There’s no simple sentence to call “true” in the first place. The proposition is inherently mediated, qualified, suspect.  

  But something profound *is* transformed: **the burden shifts.** What’s lost is the easy comfort of authorial assurance. What’s gained is an intensification of the reader’s labour – and the novel’s potential power. Without direct assertion, the reader isn’t asked to *believe* the sentences. They are asked to **weigh** them. To track the sources. To discern the slants. To feel the gaps. The novel doesn’t offer disquotable truths; it offers **reports demanding assessment.**  

  The deflationist insight helps us see that the value isn’t magically restored by whispering “But this is *really* true underneath.” The value lies precisely in the *withholding*. It forces the reader to engage with **accuracy as a practice, not a property.** Is this *character* accurate *to their own bias*? Is this *report* consistent *with other reports*? Does this *description* feel like the one *this narrator, in this moment, under this pressure, would produce*? The goal isn’t to arrive at some hidden “Truth” behind the layers; it’s to experience the *friction* of mediated perception.  

  The gain, then, is **a rehearsal for life.** Our world is saturated with secondhand reports, slanted narratives, and contested claims. A novel that withholds direct assertion doesn’t offer an escape *from* this mess into a realm of pure truth. It offers a rehearsal space *within* the mess. It trains attention on the **sources, the motives, and the costs** of the descriptions we encounter and use. It cultivates not belief in capital-T Truths, but a sharper sense of **trust, vigilance, and the weight of interpretation.**  

  Fiction’s deepest power isn’t in revealing a hidden property called truth. It’s in constructing situations so vividly, so accurately within their own terms, that they compel us. It’s in giving us sentences that are the sentences the situation calls for – sentences we can act on, feel through, and learn from. And when it withholds assertion, it doesn’t lose this power; it redirects it. It asks us not to receive truth, but to practice discernment. It makes the reader not a consumer of facts, but a participant in the relentless, necessary, human work of seeking accurate descriptions amidst the noise.  

  That’s the work I find fascinating. That’s the conversation I hope we can have today. Thank you.  

  ---

  **Brief Note on Contested Leans and Shifts:**  

  This speech leans heavily on a core deflationist tenet: that "true" is not a substantive property denoting correspondence, coherence, or utility, but a logical device for disquotation or endorsement. It accepts this at face value and argues that fiction's value must therefore lie *elsewhere* than in providing "true" sentences in a robust sense. The contested move here is applying this stricture rigorously to *fiction itself*, rejecting the common literary claim that fiction accesses a "deeper" *kind* of truth (metaphorical, emotional, existential) that somehow bypasses deflation. The speech argues that even this "deeper truth" talk, if treated as denoting a special property, is misleading under deflationism.  

  Where it changes the subject is in its pivot from "truth" to **accuracy-in-context** and **readerly labour**. "Accuracy" here isn't meant as a synonym for correspondence-truth (which deflationism rejects as substantive). Instead, it denotes *internal precision, fitness, and consequence* within the constructed fictional situation – does this sentence *fit* here, does it have *weight*? This shifts the focus from a property *of the sentence* to a relational quality *between the sentence and its context*. The speech then further shifts towards the **effects on the reader**: trust, discernment, attention, and the practice of navigating unreliable information. These concepts (trust, the cost of doubt, the weight of interpretation) are adjacent to truth-talk but distinct; they belong more to psychology, ethics, and epistemology of testimony. The "test case" of the secondhand style drives this shift – it demonstrates that the *withholding* of assertion doesn't negate value but relocates it entirely into the dynamics of mediation and the reader's active, critical engagement, moving decisively beyond the vocabulary of truth and falsity. The core claim is that fiction's power survives, even thrives, on this shift.
