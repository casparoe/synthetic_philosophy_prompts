  Noting the user's frustration with axiom debates, I'll make Q3-Q5's follow-ups chain so denying one point exacerbates another. For example, if she claims defects aren't mutually compossible (Q3), the follow-up asks why excellences are privileged - which sets up Q8's "why modal?" challenge. 

