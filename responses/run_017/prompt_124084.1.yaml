  This requires a concept that captures both the cognitive mechanism (vividness overriding correction) and the ontological effect (fiction becoming functional truth). The "as-if reality" effect seems central - people behave cognitively as if the fiction were true while intellectually knowing it's not. 

  For the ethical question, we should consider:
