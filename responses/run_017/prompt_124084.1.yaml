answer: |-
  Your preoccupation touches a deep and curiously under-examined nerve in the relationship between historical representation and collective memory. The phenomenon you describe—where an avowedly fictional scene becomes the dominant, operational image of a historical figure or event, persisting despite conscious awareness of its invented nature—deserves a name distinct from its conceptual neighbours. Let us call it **figurative ossification**.

  The term aims to capture several elements. "Figurative" acknowledges that the invented element functions as a symbol or condensation of a perceived truth, not a literal claim. "Ossification" conveys the hardening of this fluid symbol into a fixed, seemingly immutable image within the mind, displacing the more complex, less visually potent reality. It is the crystallization of the *as-if* into the *is-for-practical-purposes*.

  Here is the core definition: **Figurative ossification occurs when a consciously acknowledged fictional representation of a historical subject acquires such vividness, narrative coherence, or emotional resonance within a culture that it supplants the documented reality as the primary cognitive and affective template through which that subject is understood and judged, despite persistent intellectual awareness of its invented status.**

  Let us carve its edges:

  1.  **Exclusion of Deception:** The audience's conscious knowledge that the element is invented is *essential*. This separates it from ordinary falsehood, historical error, or successful misinformation. The audience says, "Yes, I know they made that up," yet the fictional image governs their feeling and judgement. Belief is not corrupted; cognition is *bifurcated*. The intellect holds the correction, but the imagination and emotional response are captured by the fiction.
  2.  **Exclusion of Simple Addition:** Unlike "prosthetic memory," which expands one's sense of the past with new (though vicarious) experiences, figurative ossification involves *replacement* and *displacement*. The richer, fabricated image actively pushes aside the thinner, documented reality in the mind's eye and heart. It is subtractive in relation to the historical record while being additive in terms of cultural imagery.
  3.  **Exclusion of Dramatic Licence:** Dramatic licence is the artist's tool. Figurative ossification is its unintended, often unforeseen, cultural consequence. The practice is justified; the specific *effect* of this mental substitution is the problem.

  Now, your specific queries:

  *   **Audience Knowledge:** That the audience is *not* deceived is not merely incidental; it is *constitutive*. The phenomenon's peculiar power lies precisely in this knowing embrace. The fiction operates as a *chosen* truth, an emotional and imaginative lodestone willingly adopted even against intellectual knowledge. The correction is heard but fails to dislodge the governing image.
  *   **Prior Mythologising:** If the real person crafted their own myth (e.g., in memoirs), and the film transmits *that* myth, the phenomenon shifts. It becomes **amplified self-mythologisation**. The film isn't *substituting* its own fiction; it is *validating and disseminating* the subject's own curated fiction with greater reach and vividness. Figurative ossification still occurs (the myth becomes the dominant image), but the source is different. The "wrong," if any, might lie more in uncritically amplifying a deceptive self-portrait than in pure invention. The core mechanism of vividness displacing complexity remains.
  *   **Composite Characters:** This is closely related but distinct. A composite character aims to represent a *type* or *structural force* (e.g., "the loyal sergeant," "the cynical journalist"). Figurative ossification *can* occur if this composite becomes the singular image attached to a *specific named historical role* (e.g., people picturing the composite whenever they think of *the* journalist who covered that event). However, if the composite is understood *as* a composite representing a group dynamic, it avoids ossifying onto one individual. The risk is high, but the intent differs slightly from inventing a specific scene for a specific person. The phenomenon overlaps significantly but isn't identical; it risks ossifying a *role* onto a *name*.
  *   **Fictional Novels:** A vividly written, avowedly fictional novel about named real people *can* absolutely cause figurative ossification. The key is the *vividness* and *narrative power*, not solely the audiovisual medium. A compelling written scene can embed itself just as deeply in the imagination. However, film and television possess an unparalleled *immediacy* and sensory saturation that makes the embedding potentially faster, more widespread, and harder to dislodge, as the image is *provided*, not conjured textually. The phenomenon exists across media, but the audiovisual form is its most potent vector.
  *   **Vivid Anecdotes in History:** A popular history book presenting a vivid but undocumented anecdote as fact would be misinformation. If it presented it *as* likely apocryphal but resonant, and the anecdote *still* became the dominant image, *then* it would be figurative ossification. The mechanism is the same: acknowledged invention achieving cognitive dominance through resonance. The medium influences reach and sensory impact, but the core cognitive process can occur textually.

  You have not run three things together; your core phenomenon—knowing embrace of a vivid fiction supplanting documented reality for a specific subject—is coherent. The variations (prior myth, composites, different media) are boundary cases testing the definition, not fundamentally different phenomena. Figurative ossification survives as the central concept.

  **On the Wrong:**

  The complaint of "wronging the dead" is profound. Figurative ossification suggests this wrong is less about simple *misrepresentation* (though that's present) and closer to **representational usurpation**. It is the displacement of the actual, complex human being by a fabricated effigy wearing their name and performing a culturally resonant, simplified narrative. The dead are robbed not of factual accuracy per se, but of their *historical presence*—their right to be remembered, however imperfectly, within the bounds of the knowable reality of their existence, struggles, and context.

  The concept helps frame the owed correction:

  1.  **To the Dead:** It is a debt to historical fidelity and complexity. Correction means persistently reasserting the documented record *with equal or greater vividness*, challenging the ossified image not just as false, but as an impoverishing reduction. It is work against forgetting *by* fiction.
  2.  **To the Living:** It is a duty concerning our own understanding. We owe it to ourselves to resist the cognitive ease of the ossified image, to grapple with the messier, less dramatic truth. Correction involves fostering historical literacy that values ambiguity and resists the tyranny of the single, vivid scene.
  3.  **Flattering Images:** Is there a wrong here? Yes, albeit a subtler one. Even a flattering fiction usurps the real person. It replaces their authentic achievements, flaws, and context with a simplified hero-tale. It risks diminishing the actual courage or virtue by implying it needed embellishment. More perniciously, it can create impossible standards, obscure the complexities of real moral choices, and flatten the historical landscape into myth. The wrong lies in the *displacement* and *reduction*, not the valence of the fiction. We still lose the real person behind the pleasing mask.

  Figurative ossification is not merely an occupational hazard of historical drama; it is a fundamental challenge to how societies remember. It reveals the terrifying power of narrative over evidence, of image over archive, and the willingness of the mind to adopt a resonant lie even while knowing it is a lie. Your memos correct facts, but the deeper work—combating this ossification—requires not just accuracy, but a countervailing power of equally compelling, truthful narrative. It is the fight to keep the past alive in its difficult humanity, rather than entombed in the elegant, enduring fiction.
