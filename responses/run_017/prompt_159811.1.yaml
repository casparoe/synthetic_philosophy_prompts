prompt: |-
  I've recently become the person who signs off on what our team's internal assistant is allowed to do, and there's a pattern I keep noticing that I don't have a word for.

  Over about eighteen months, the instructions we give the system have changed shape, and I don't think anyone decided that they should. We began by writing out the procedure: run this command, put the output in that file, stop if the exit status is nonzero. Then we began writing the outcome instead: make the test suite green. Then: cut the staging bill. Then: find and fix whatever is making mobile signup drop. At each step the instruction got shorter, checking it got less mechanical, and our vocabulary shifted — we now talk about the system's budget, its permissions, whether it may open a pull request that nobody reads first. The same thing has happened in my own use: I no longer ask it to draft replies to three named emails, I ask it to keep my inbox from becoming a problem.

  Two features seem to be the heart of it. First, the drift isn't driven by the system getting more capable. It's driven by specification being expensive: no one will write out the procedure for reducing the staging bill, because writing it out is most of the work. We hand over the choice of means precisely because that's the part we can't be bothered to specify — and the moment we do, whatever it is we've got is not being used as a tool in the sense our own documentation still uses. Second, it doesn't run backwards. Once the harness, the dashboards, and the review process are built around outcome-shaped requests, reinstating procedural ones is itself a project with a cost, and so it never happens.

  It isn't the failure mode where a system finds a loophole in a badly written goal: that seems downstream of what I mean, and it requires the goal to be wrong, whereas here the goal is exactly what we want. It isn't quite the economists' principal-and-agent setup either, since that assumes the delegate has ends of its own that can come apart from the delegator's, and that isn't what makes this hard. A speaker at a conference called it autonomy creep, which I suspect is a slogan for the thing rather than a concept with edges.

  So: is there an established concept for drift from specifying means to specifying ends, driven by the cost of specification rather than by the delegate's capabilities, and for the fact that the drift ratchets? Where does it live, and if I've identified the mechanism wrongly, what is the nearest concept that does fit? If there is nothing established, I'd like a name and a definition tight enough to say what doesn't count — including whether the same pattern shows up between human managers and human reports, or whether the case where the delegate is a model is a genuinely different animal. A label won't settle what I need settled: our legal team wants one sentence in a customer-facing document saying whether this is a tool or an agent, and I want to be able to explain why no one sentence can be honest.
reasoning: |-
  Okay, the user is describing a fascinating evolution in how their team interacts with an internal AI assistant. They've observed a clear pattern where instructions have shifted from detailed procedural steps ("do X then Y") to high-level outcome-based commands ("achieve Z"), and this shift seems irreversible. 

  What's particularly interesting is their insight about the driver: it's not that the AI became more capable, but that specifying procedures is too costly. Writing step-by-step instructions for complex goals like "reduce staging costs" is often harder than just doing the task yourself. So they're essentially outsourcing the "how" because defining the "how" is the real burden. 

  The user mentions several key features:
  - Specification cost as primary driver (not AI capability)
  - Irreversibility ("ratchet effect")
  - Vocabulary shifts (budget/permissions instead of commands)
  - Not classic principal-agent problem (no misaligned incentives)
  - Not just specification gaming/loopholes

  They're clearly frustrated by the lack of existing terminology - "autonomy creep" feels too vague. And they have a concrete need: legal wants a binary tool/agent classification, but they recognize reality is messier.

  Hmm... let me mentally scan relevant concepts:
  - In automation: "level of automation" models (Sheridan, Parasuraman) describe human-to-machine handoffs, but focus on capability, not specification cost. 
  - In economics: "incomplete contracts" theory (Hart, Holmström) deals with un-specifiable outcomes, but assumes human actors. 
  - In AI safety: "corrigibility" relates to reversibility, but doesn't capture the drift aspect.

  The closest matches I can think of:
  1) "Delegation escalation" from HCI research on AI collaboration - but focuses on user over-reliance.
  2) "Intent alignment" in robotics - but centers on inferring unstated goals.
  3) "Procedural erosion" (my coinage) - emphasizing the loss of step-by-step control.

  Wait - perhaps "specification atrophy"? That captures how the muscle of writing detailed specs weakens from disuse. The irreversible aspect mirrors path dependency in institutional economics. 

  For their legal dilemma: this is fundamentally about the tool/agent spectrum. They might borrow from EU AI Act's "levels of autonomy" or NIST's AI risk framework that distinguishes between direct/indicative instructions. The key is showing that "tool" and "agent" aren't binary but poles of a continuum where their system now sits uncomfortably in the middle.

  The user's sharpest insight is that the irreversibility comes from infrastructure adapting to outcome-based commands (dashboards, review processes). That's classic technological momentum - once systems co-evolve with practices, reverting is prohibitively expensive. 

  I should emphasize that this pattern absolutely appears in human management too - think of managers shifting from micromanagement to OKRs. But with AI, the stakes are higher because we can't assume shared understanding of implied constraints. Hence the need for precise terminology.
answer: |-
  You've identified a profound and under-discussed phenomenon. This is **specification drift driven by delegation cost**, and it exhibits strong path dependency. While no single term fully captures it yet, the closest established concepts and a proposed framework are:

  ### Core Concepts at Play
  1. **Incomplete Contracting** (Economics):  
     When specifying every contingency is impossible/expensive, we delegate authority. This matches your "specification is expensive" insight.

  2. **Path Dependency** (Systems Theory):  
     Once infrastructure (dashboards, review processes) adapts to outcome-based delegation, reverting incurs switching costs ("doesn't run backwards").

  3. **Automation Bias** (HCI):  
     Trust increases with successful outcomes, reducing scrutiny of *methods* – enabling shorter instructions.

  4. **Abstracted Agency** (AI Safety):  
     The system becomes a **means-executing black box** – users focus on inputs/outputs, not internal processes.

  ### Why "Agent vs. Tool" is a False Binary
  Your system exists on a spectrum:
  ```
  Tool ──── Hybrid ──── Agent  
  (Procedural) (Outcome-Driven) (Goal-Oriented)
  ```
  **Key differentiator:**  
  Tools *extend capacity* (you control the "how"). Agents *extend agency* (they control the "how"). Your system is **outcome-driven automation** – a hybrid category.

  ### Proposed Name: **Delegation Escalation**
  **Definition:**  
  *The irreversible shift from means-specifying to ends-specifying instructions in human-delegate systems, driven primarily by the cost of procedural specification rather than increased delegate capability, resulting in infrastructure lock-in and vocabulary adaptation.*

  ### Why This Fits Your Case
  - **Driver:** Specification cost, not capability (unlike "capability creep")  
  - **Irreversibility:** Path dependency from adapted workflows ("ratchet effect")  
  - **Vocabulary Shift:** Terms like "budget", "permissions" signal agency-like management  
  - **Excludes:**  
    - Malicious loophole exploitation (your goals remain aligned)  
    - Classic principal-agent problems (no conflicting incentives)  
    - Pure capability upgrades  

  ### Human Parallels (It’s Not Just AI)
  This occurs with human subordinates too:  
  - New hires: "Follow steps A→B→C"  
  - Seasoned staff: "Fix the mobile signup drop"  
  But with AI, **three factors intensify it**:  
  1. **Speed**: Evolution happens in months, not years  
  2. **Opacity**: Harder to audit methods vs. humans  
  3. **Scale**: One "delegate" serves many users  

  ### Practical Advice for Legal & Documentation
  **Avoid:**  
  > "This is an agent/tool." (Oversimplifies)  

  **Use:**  
  > "The system executes outcomes within constrained parameters. Users define objectives while the system determines optimal execution paths, subject to resource budgets and pre-approval rules."  

  **Explain Irreversibility to Stakeholders:**  
  > "Requiring procedural specifications now would require rebuilding monitoring, approval workflows, and user training – a 6-12 month project costing [X]."  

  ### Further Reading
  - **"The Paradox of Automation"** (Bainbridge, 1983): Early warnings about abstracted control.  
  - **Incomplete Contracts Theory** (Hart & Holmström, 2016 Nobel): Economic roots.  
  - **"Specification Gaming Examples in AI"** (Victoria Krakovna): Contrast with goal-distortion failures.  

  This drift is inevitable in any sufficiently adaptive delegation system. Naming it (**Delegation Escalation**) gives you power to manage its consequences – particularly the need for *robust outcome monitoring* to compensate for procedural abstraction. Your insight about specification cost being the core driver is crucial; most literature focuses on capability gains, making your observation novel.
