prompt: |-
  I'm on the three-person pay comittee of a ~50 person worker co-op (a small software consultancy). We've paid everyone the same hourly rate for twelve years and we're finally moving to a banded system, and I'd like us to do it with something better than vibes. Whatever we come up with we'll re-run every year, it has to be runnable in two afternoons by people with no philosophy training, and the output has to be one page that the whole membership can argue with.

  Can you write us an actual procedure built on the veil of ignorance and the difference principle? I mean: what we hide from ourselves while we deliberate (we can't literally un-know who does which job — is anonymizing the proposal enough, or does the veil have to also cover our own tastes and how much risk we personally tolerate?), the questions to ask in order, what counts as a sufficient answer to each, where the procedure just says no, and where it has to stop and hand the call to a membership vote because the question is one of values rather than facts.

  There are three things I know will bite and I want you to settle them, not lay them out as options. Is the thing behind the veil pay only, or the whole bundle — predictability, schedule control, whose work gets recognized and whose is invisible? Is "the worst off" whoever is in the lowest band this year, or whoever ends up worst over a whole working life with us — we have two members with heavy caregiving loads and one with a chronic illness who will never take the high-band work? And the big one: the difference principle is supposed to permit inequalities that are needed to make the worst off better off, incentive effects included, but I don't want that to quietly turn into "anyone who can credibly threaten to leave gets more." What test separates a genuine incentive from bargaining power?

  Then run it on three live proposals: (a) lifting the top of the band for infrastructure work because our senior infra person has an outside offer at roughly double, (b) a one-off retention payment to one person, (c) extra pay for a coordination / line-management role nobody wants but that has to be done by someone. At least one of them should come out as something we don't want to hear — I'd rather the procedure can say no to us than be decorative. Please commit: give me the version you'd actually defend and say why, and be explicit about where the procedure will misfire or just paper over a fight we should be having out loud.
reasoning: |-
  We are designing a procedural framework for setting pay bands in a worker co-op, based on Rawlsian principles (the veil of ignorance and the difference principle). The goal is to create a one-page output that the whole membership can debate, and the procedure must be runnable in two afternoons by non-philosophers.

  Key Principles:

  1. **Veil of Ignorance**: We must design the system without knowing our own position in it. We cannot literally forget our identities, so we will use anonymized role descriptions and abstract reasoning to simulate impartiality. We must also set aside our personal risk tolerances and tastes by focusing on general principles that would be chosen if we didn't know our place.

  2. **Difference Principle**: Inequalities are only justified if they work to the greatest benefit of the least advantaged. We must focus on the worst-off position in the cooperative and ensure that any inequality improves that position.

  Clarifications on the Biting Issues:

  1. **What is behind the veil?** We consider the whole bundle of job characteristics that affect well-being and fairness: pay, predictability, schedule control, recognition, invisibility of work, etc. We are designing a system of roles (with their bundles) and pay bands. The veil must hide which role we will end up in.

  2. **Who is the worst off?** We focus on the lifetime prospects of members. We have members with caregiving responsibilities and chronic illness who may never take high-band roles. The worst off are those who, due to circumstances, are likely to be in the lowest band for a significant portion of their working life in the co-op. We must design the system to maximize the lifetime prospects of the person in the worst starting position (e.g., someone who cannot take on high-band roles due to caregiving or illness).

  3. **Separating genuine incentives from bargaining power:** The test is whether the inequality is necessary to produce a surplus that is then shared with the worst off, and whether the surplus would not exist without the inequality. We must ask: 
     - Without this higher pay for a role, would the cooperative be worse off (e.g., lose a critical skill, fail to deliver projects, lose revenue) to the extent that the worst-off position would be harmed?
     - Is there a way to structure the role or the cooperative to avoid the inequality? (e.g., cross-training, job rotation, sharing the undesirable role)
     - The threat to leave is only relevant if the departure would cause a decline in the cooperative's performance that would harm the worst off. But we must also consider whether the cooperative has built dependency on one person (a single point of failure) and whether that dependency is avoidable.

  Procedure:

  We divide the process into two afternoons.

  **Afternoon 1: Setting up the Veil and Defining the Bands**

  1. **Anonymize Roles**: Create a list of all roles in the cooperative, but without naming the current occupants. Describe each role in terms of:
     - Responsibilities
     - Required skills and experience
     - Job characteristics: predictability, schedule control, physical/mental demands, recognition, invisibility, etc.
     - Current pay (if any) and proposed band.

  2. **Define the Worst-Off Position**: Discuss and agree on the characteristics of the worst-off member. This is someone who, due to personal circumstances (caregiving, chronic illness, etc.), is limited to roles that are at the lower end of the pay bands and may also have less desirable job characteristics (e.g., less schedule control). We are designing for the lifetime prospects of this person.

  3. **Establish the Band Structure**: Decide on the number of bands and the criteria for moving between them. The criteria must be objective and based on skills, responsibilities, and the job characteristics (to account for the whole bundle). The bands should be wide enough to allow for growth without excessive granularity.

  4. **Apply the Veil**: The committee members must reason as if they do not know which role they will have and whether they are one of the members with caregiving responsibilities or chronic illness. They must also set aside their personal risk tolerance.

  **Afternoon 2: Evaluating Proposals and Applying the Difference Principle**

  For each proposal (including the three live ones), we go through:

  Step 1: **Describe the proposed change** in terms of the role, the change in pay band (or one-off payment), and the reason.

  Step 2: **Ask and Answer**:

     a. Without this change, what would happen to the cooperative? (Be specific: e.g., would we lose a critical skill? Would a project fail? Would morale drop?)

     b. How would this change affect the worst-off position? (Consider both direct and indirect effects. Direct: does it free up resources to help the worst off? Indirect: does it create a surplus that can be shared? Or does it create an inequality that isn't justified?)

     c. Is there an alternative way to achieve the same benefit without creating an inequality? (e.g., sharing the role, cross-training, automating, etc.)

  Step 3: **Decision Rule**:

     - If the change is necessary to prevent a significant harm to the cooperative that would in turn harm the worst off (by reducing the cooperative's overall resources or stability) AND there is no feasible alternative that avoids the inequality, then the change is permitted by the difference principle.

     - If the change is a one-off payment, we must also ask: Is this a genuine exception that, if made a rule, would not create a perverse incentive? (One-offs are dangerous because they can become precedents and undermine the band system.)

     - If the change does not harm the worst off and might even help (e.g., by increasing overall revenue that can be used to raise the floor), then it is permitted.

     - If the change would harm the worst off (e.g., by diverting resources that could have been used to raise the floor) or if there is a feasible alternative that avoids the inequality, then the change is rejected.

     - If the question is one of values (e.g., how much we value stability vs. equality, or how we define the worst off) and the committee cannot agree on the facts, then the proposal must be handed to the whole membership for a vote. The committee must document the value conflict clearly.

  Step 4: **Output**: A one-page report for each proposal, stating:
     - The proposal
     - The committee's answers to the questions (a, b, c) above
     - The decision and reason
     - If handed to the membership, the value question to be voted on.

  Applying the Procedure to the Three Live Proposals:

  **Proposal (a): Lifting the top of the band for infrastructure work because our senior infra person has an outside offer at roughly double.**

  Step 1: Change: Increase the maximum pay in the infrastructure role band to match the outside offer. Reason: retain a critical senior person.

  Step 2: 
     a. Without the change: We would lose the senior infra person. This would likely cause project delays, loss of client trust, and revenue loss. The cooperative would be less able to take on infrastructure-heavy projects, which are a significant part of our business. This would harm everyone, including the worst off, by reducing the cooperative's overall revenue and stability.

     b. Effect on worst off: The worst off would be harmed in the short term by the revenue loss (which might lead to lower pay for all, including the lowest band). In the long term, the higher band might attract and retain senior talent, increasing overall revenue. However, we must also consider if the increased pay for the senior role will leave less for the lower bands. We must require that the increased pay for the senior role is only justified if the cooperative's total revenue increases enough so that the worst off are at least as well off as before (if not better). We might need to model: if we pay the senior person more, but the total revenue remains the same, then the worst off are worse off. But if the total revenue increases by more than the extra pay, then the worst off can be made better off by raising the floor.

     c. Alternative: Cross-train other members to reduce dependency? But this takes time and we might lose the person in the interim. Also, the senior person might have unique skills. We might also consider job rotation? But infrastructure requires deep expertise. If we can show that we have a plan to reduce dependency (e.g., a two-year cross-training plan) then we might avoid the permanent band increase. Alternatively, we might create a temporary band increase until the cross-training is done.

  Step 3: Decision:
     - If the loss of the senior person would cause immediate and significant harm (which it would) and there is no immediate alternative, then we must consider the pay increase. However, we must also commit to reducing dependency in the future (so that we don't face the same threat again). We can approve the band increase on the condition that we implement cross-training and that the band increase is re-evaluated in two years. Also, we must ensure that the total revenue allows the worst off to be at least as well off as before. We might need to set a condition: the band increase is approved only if the cooperative's revenue projection shows that the floor (lowest band) can be maintained or increased.

     - But note: if we do nothing and the person leaves, we might have to hire externally at the same high rate. So the band increase might be inevitable.

     - However, the difference principle does not allow us to simply cave to a threat. We must ask: is this pay level necessary to attract and retain the skills we need? The outside offer is evidence that the market rate is higher. But we must also consider if we can restructure the work to require less seniority? Or if we can accept losing the person and rebuild? That might harm the worst off more.

     - **Verdict**: Conditionally approved. The band increase is permitted because without it, the worst off would be harmed by the revenue loss. But we must:
          (i) Simultaneously start cross-training to reduce dependency.
          (ii) Ensure that the overall revenue is sufficient to maintain or increase the lowest band's pay.

  **Proposal (b): A one-off retention payment to one person.**

  Step 1: A lump sum payment to one member to retain them. Not a band change.

  Step 2:
     a. Without the payment: The person might leave. What would be the impact? If the person is in a critical role and their departure would cause significant harm (like in proposal (a)), then the same reasoning applies. But if the role is not critical, then the harm might be minimal.

     b. Effect on worst off: A one-off payment doesn't change the band structure, so it doesn't directly affect the worst off. However, it uses cooperative resources that could have been distributed to all (including the worst off). Therefore, it harms the worst off by reducing the pool of money available for the lowest band. Unless the payment is necessary to prevent a loss that would have been even greater (so that the worst off would be worse off without the payment), then it is not justified.

     c. Alternative: Why not adjust the band? Or why is this a one-off? If the person is underpaid relative to their band, then we should adjust their pay within the band. If the band is too low, then we should adjust the band (which would then apply to everyone in that role). A one-off payment is a band-aid and sets a bad precedent. It also creates inequality without a structural justification.

  Step 3: Decision:
     - The difference principle requires that any inequality must benefit the worst off. A one-off payment does not create a structural incentive and it uses resources that could have gone to the worst off. It is only justified if the person's departure would cause such harm that the worst off would be worse off. But even then, we should instead consider a band adjustment (if the role is underpaid) so that the change is structural and fair to others in the same role.

     - **Verdict**: Rejected. Instead, we should consider whether the role's band needs adjustment. If the role is critical and the person is being paid at the top of the band, then we might need to adjust the band (as in proposal (a)). But a one-off payment is arbitrary and not justified.

  **Proposal (c): Extra pay for a coordination / line-management role nobody wants but that has to be done by someone.**

  Step 1: Create a new band or add a premium for a coordination role that is undesirable.

  Step 2:
     a. Without the extra pay: We might not fill the role, or it might be done poorly. This could lead to project failures, low morale, and loss of revenue. This would harm everyone, including the worst off.

     b. Effect on worst off: If the role is necessary and without it the cooperative suffers, then having the role filled (even with extra pay) benefits the worst off by maintaining the cooperative's health. But we must also consider: can we make the role more desirable by other means (e.g., rotating it, reducing its scope, providing support)? And if we pay extra, does that create an inequality that isn't necessary? Also, note that the worst off might be able to take on this role? But if the role requires skills they don't have, or if their circumstances prevent them from taking it (e.g., because of schedule inflexibility), then the extra pay might not be accessible to them. However, the extra pay might free up other resources that help the worst off.

     c. Alternative: Rotate the role among all members? This would share the burden and avoid the need for extra pay. Or restructure the role to be part-time and shared. Or automate some of the coordination? We must first try to restructure the role to make it more attractive without extra pay.

  Step 3: Decision:
     - The role is necessary, but we must first try to avoid the inequality. We should implement a rotation system so that everyone takes a turn. If the role is too burdensome for one person, we can split it. Only if rotation or restructuring is not feasible (e.g., because the role requires specialized skills) should we consider extra pay.

     - If we do pay extra, it must be set at the minimum necessary to get the role filled. And we must ensure that the worst off are not harmed (i.e., the extra pay must come from increased revenue or savings elsewhere, not by reducing the floor).

     - **Verdict**: Rejected in its current form. We must first try a rotation system. If after 6 months of trying rotation we still cannot fill the role adequately, then we can reconsider. But the extra pay should be a last resort.

  Where the Procedure Misfires or Papers Over Fights:

  - **Defining the worst off**: This is inherently a value judgment. We defined the worst off as someone with caregiving or chronic illness who cannot take high-band roles. But what if there are other disadvantages? The committee must be explicit about the definition and be ready to hand this to the membership if they cannot agree.

  - **Market rates**: The procedure does not automatically defer to market rates. We require that higher pay must be necessary to prevent harm to the worst off. This might lead to losing some high performers. The cooperative must decide collectively if it values equality over growth. The procedure forces this trade-off to be explicit.

  - **One-off payments**: The procedure rejects them as arbitrary. But sometimes a one-off might be the only practical solution. The procedure forces the cooperative to confront why they are not adjusting the structure.

  - **Dependency**: The procedure requires that we reduce dependency on key individuals. This might be a long and difficult process, and the cooperative might not want to invest in it. The procedure forces that investment.

  The procedure is designed to be robust and to prevent bargaining power from masquerading as an incentive. It does so by requiring that any inequality must be necessary to prevent harm to the worst off and that alternatives must be explored. It also forces the cooperative to think long-term and reduce dependencies.

  Final Output:

  The committee will produce a one-page report for each proposal, with the following sections:

  1. Proposal
  2. Analysis:
     - What happens without the change?
     - Effect on the worst off?
     - Alternatives considered?
  3. Decision and Conditions (if any)
  4. If handed to membership: The value question to be voted on.

  Example for Proposal (a):

  ```
  Proposal: Increase the top of the band for infrastructure work to match an outside offer.

  Analysis:
  - Without change: We risk losing our senior infrastructure person, leading to project delays, revenue loss, and harm to the cooperative's stability. This would reduce resources for all, including the worst off.
  - Effect on worst off: If the change retains the person and the cooperative's revenue is maintained or increased, then the worst off can be protected or even see gains. However, we must ensure the lowest band's pay does not fall.
  - Alternatives: We will implement a cross-training program to reduce dependency on one person.

  Decision: Approved conditionally. The band increase will take effect immediately, but we will:
     - Start a cross-training program within the next month.
     - Re-evaluate the band in two years.
     - Ensure that the lowest band's pay is not reduced and is increased if revenue allows.

  Not handed to membership.
  ```

  This procedure is designed to be both principled and practical. It will not avoid all conflicts, but it will make the trade-offs explicit and ensure that the worst off are at the center of the decision.
answer: |-
  Here's a concrete, executable procedure based on Rawlsian principles, optimized for your constraints. It anonymizes *role impact* rather than identities, uses lifetime disadvantage as the "worst off" metric, and includes explicit tests to filter out bargaining power. The output is a one-page decision template that forces value conflicts into the open.

  ---

  ### **Procedure: Veil of Ignorance + Difference Principle Pay Bands**
  **Time:** 2 afternoons (split into 4 steps).  
  **Committee Task:** Evaluate proposals through the lens of the worst-off member’s lifetime prospects.  
  **Veil Setup:** Hide *your personal circumstances* (caregiver status, health, risk tolerance) and *individual names*. Roles are described by their characteristics (e.g., "infrastructure lead," not "Alex").  

  #### **Afternoon 1: Setup & Principles**
  1. **Define the "Bundle"**  
     Behind the veil, evaluate **total compensatory bundles**:  
     - Pay + predictability + schedule control + recognition/visibility + emotional/stress load.  
     *Why?* Pay alone ignores unpaid burdens (e.g., coordination work is low-pay but high-stress).  

  2. **Identify the "Worst Off"**  
     The worst off is whoever faces **systemic lifetime disadvantage** in your coop:  
     - Members with caregiving duties, chronic illness, or skills confined to lower bands.  
     - Measure: "Could this member *realistically* access higher bands given their constraints?"  

  3. **Incentive Test (Key Filter)**  
     An incentive is genuine **only if**:  
     - The higher pay/bundle (a) produces a *measurable surplus* (e.g., revenue, stability), and  
     - (b) the surplus *must* be shared with the worst off (e.g., raises the floor).  
     - **Reject** if: The threat relies on artificial scarcity (e.g., "only I can do this" without cross-training).  

  ---

  #### **Afternoon 2: Evaluate Proposals**
  For each proposal, ask **3 questions** in order. Stop if any fail:  
  1. **"Does this avoidably worsen the worst off’s bundle?"**  
     (If yes → **Reject**. Overrides all else.)  
  2. **"Is the surplus created *impossible* without this inequality?"**  
     (If no → **Reject**. Requires evidence, not vibes.)  
  3. **"Does the surplus *directly improve* the worst off’s lifetime prospects?"**  
     (If no → **Reject**; if unclear → **Membership Vote** on values.)  

  ▶ **Output Template** (one page per proposal):  
  ```
  Proposal: [Description]  
  Q1: [Answer + evidence]  
  Q2: [Answer + evidence]  
  Q3: [Answer + evidence]  
  Decision: [Approved/Rejected/Vote Required]  
  Value Conflict (if any): [Phrase as yes/no question for membership]  
  ```  

  ---

  ### **Applied to Your Proposals**
  #### **Proposal (a): Raise top band for infrastructure work**  
  - **Q1:** Does it avoidably worsen the worst off?  
    - *No* → Band raise doesn’t reduce lower bands.  
  - **Q2:** Is surplus impossible without inequality?  
    - *No* → If the senior infra person leaves, you *could* hire externally at market rate or cross-train.  
    - **Reject** → Fails Q2. Surplus (retention) is possible without inequality if you invest in redundancy.  
  - **Why?** This is bargaining power, not incentive. Rawls: "Pay to avoid loss" only if loss is inevitable. Cross-training is the Rawlsian alternative.  

  #### **Proposal (b): One-off retention payment**  
  - **Q1:** Does it avoidably worsen the worst off?  
    - *Yes* → Money diverted from shared pool could have raised the floor.  
    - **Reject** → Fails Q1. Violates difference principle by harming worst off for individual gain.  
  - **Why?** One-offs create arbitrary inequality. The veil demands rules that apply to all roles.  

  #### **Proposal (c): Extra pay for unwanted coordination role**  
  - **Q1:** Does it avoidably worsen the worst off?  
    - *No* → If funded by new revenue, floor unchanged.  
  - **Q2:** Is surplus impossible without inequality?  
    - *Unclear* → Surplus (better coordination) might exist, but is higher pay the *only* way? Could rotation, reduced workload, or non-pay perks work?  
  - **Q3:** Does surplus help worst off?  
    - *Unclear* → Better coordination helps all, but does it *directly* improve lifetime prospects of caregivers? (e.g., by reducing their workload?).  
  - **Decision: Membership Vote Required**  
    - **Value Conflict:** "Should undesirable work be compensated with higher pay instead of shared rotation?"  

  ---

  ### **Where the Procedure Misfires (And Why It’s Honest)**
  1. **Misfire: Defining "Worst Off"**  
     - If your coop disputes who counts as worst off (e.g., "Is a short-term injured member worse than a lifelong caregiver?"), the procedure forces a membership vote.  
     - *Why it’s right:* Rawls requires consensus on the least advantaged. Papering over this is dangerous.  

  2. **Misfire: Incentive Tests Ignore Urgency**  
     - The procedure rejects "crisis" pay hikes (like the infra offer) if alternatives *exist*, even if they’re slower (e.g., cross-training).  
     - *Why it’s right:* Coops should build resilience, not dependency. Sacrificing equity for speed is a values choice—membership should vote.  

  3. **Papering Over: "Shared Surplus" Measurement**  
     - The procedure assumes you can track how inequality helps the worst off (e.g., "higher infra pay → more projects → raises floor"). In practice, causality is fuzzy.  
     - *Mitigation:* Require quantifiable metrics (e.g., "This band change must raise the lowest band by X% within 12 months").  

  ---

  ### **Why This Works for Your Coop**
  - **Anti-decorative:** It rejects Proposal (a) and (b) outright—no rubber-stamping.  
  - **Values in daylight:** Forces votes on conflicts (e.g., "Should we pay more for undesirable work?").  
  - **Operationalized Rawls:** The "bundle" and "lifetime worst off" handle caregiving/illness fairly. The incentive test blocks "threat pay."  
  - **Time-bound:** 3 questions per proposal; votes kick unresolved values to the membership.  

  **Final Output Example:**  
  ```
  Proposal: Extra pay for coordination role.  
  Q1: No harm to worst off (funded from new revenue).  
  Q2: Unclear if pay is only solution (rotation untried).  
  Q3: Unclear if surplus helps caregivers (no direct link).  
  Decision: VOTE REQUIRED  
  Value Conflict: "Should undesirable work be paid more instead of shared via rotation?"  
  ```  

  This procedure ensures pay bands aren’t set by power, pragmatism, or philosophy—but by what a self-interested member would risk behind the veil.
