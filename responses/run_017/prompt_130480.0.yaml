answer: |-
  ### Restatement of IIT in Engineering Vocabulary

  **Core Claims Translated:**

  1. **System as State Machines**:  
     A system is a network of interacting state machines (elements). Each machine has discrete states and a transition function defined by its inputs.

  2. **Causal Structure as Time-Unrolled Graph**:  
     The system's causal structure is modeled as a directed, time-unrolled graph over one timestep (t → t+1). Nodes represent element states, edges represent causal dependencies. Bidirectional edges are allowed (feedback loops).

  3. **Φ as Minimum Information Loss**:  
     Φ quantifies the *irreducible information loss* when decomposing the system into independent parts. For a partition (a "cut" of the graph):  
     - Compute the system's intrinsic *cause-effect power*: The mutual information between the current state and its past/future states, assuming uniform priors (maxentropy).  
     - After a cut, sever edges crossing the partition. Compute cause-effect power again.  
     - Φ = min-cut over all partitions of the normalized information loss (difference in cause-effect power).  
     Assumption added: Cause-effect power is symmetrically defined for past (causes) and future (effects).

  4. **Exclusion via Maximal Φ Subset**:  
     The "subject" is the subset of elements maximizing Φ, tested over all possible subsystems. This is a combinatorial optimization (intractable for large systems).  
     Assumption added: Subsystems must form a strongly connected component (feedback required).

  5. **Experience as Cause-Effect Structure**:  
     The "experience" is the entire cause-effect structure (transition probabilities, attractors) of the Φ-maximizing subset. *Not* the system's outputs or external behavior.

  6. **Idle Ring vs. Feed-Forward Example**:  
     - A ring of identical units copying neighbors has high Φ: Cutting any connection forces independent evolution, causing large information loss.  
     - A feed-forward XOR tree has near-zero Φ: Modular partitions exist (e.g., splitting subtrees) with minimal information loss.  
     Assumption added: "Information loss" weights all system states equally (uniform distribution).

  ---

  ### Residue Report: Mapping IIT to Distributed Systems Concepts

  #### (a) Claims You Already Compute (Under Another Name)
  - **Causal Graphs**: Time-unrolled causal graphs are standard in distributed tracing (e.g., DAGs in Apache Storm).  
  - **Min-Cuts**: Karger's algorithm or normalized min-cut (graph partitioning) aligns with analyzing fault domains.  
  - **Mutual Information**: Used in erasure-coding/RAID to quantify recoverability after component loss.  
  - **Modularity**: System factorization to reduce coupling (e.g., microservices) mirrors IIT's partitions.  

  *Verification*: These concepts exist in your workflow but are applied to *reliability* and *efficiency*, not intrinsic system properties.

  #### (b) Claims Requiring Engineering Fixes
  - **Timescale**: IIT assumes a single timestep (t±1). Your min-cut proxy uses arbitrary unrolling. Fix: Restrict to t→t+1 transitions.  
  - **Grain of Description**: IIT requires microstate transitions (per-element states). Your graphs often abstract to component-level. Fix: Model gates/units as atomic state machines.  
  - **Noise Model**: IIT assumes deterministic transitions or known noise. Your proxy ignores noise. Fix: Add a noise model (e.g., stochastic transitions).  
  - **Cut Metric**: IIT measures information loss *after cut*, not cut cost. Your min-cut is structural; IIT's is informational. Fix: Compute mutual information loss post-cut.  

  *Survival Condition*: With these fixes, Φ resembles **normalized information bottleneck** for system partitions.

  #### (c) Claims with No Counterpart in Your Vocabulary
  1. **Φ as Experience (Identity Claim)**:  
     IIT asserts Φ *is* consciousness, not a correlate. Your vocabulary lacks a mapping from causal graphs to subjective states.  
     - *Diagnosis*: Your tools describe systems; IIT injects an unexplained identity. This is philosophy, not engineering.  

  2. **Idle Ring High Φ**:  
     A ring of copy-gates scores high in Φ despite zero computational utility. Your domain prioritizes function (e.g., consensus protocols).  
     - *Diagnosis*: IIT explicitly rejects behavior as irrelevant. This is a definite IIT commitment with no engineering parallel.  

  3. **Exclusion Principle**:  
     Maximizing Φ over subsystems has no equivalent. Engineering selects subsystems for functionality (e.g., leader election), not intrinsic integration.  
     - *Diagnosis*: IIT's exclusion is a novel optimization with no distributed-systems counterpart.  

  4. **Cause-Effect Structure as "Shape"**:  
     The "shape" (transition probabilities, state-space geometry) is the experience. Your tools observe outputs or recover states, but don't treat the structure itself as primary.  
     - *Diagnosis*: This is a phenomenological claim—your vocabulary handles *states*, not *structures as qualia*.

  ---

  ### Concrete Probe Analysis: XOR Tree vs. Parity Ring
  **Your Observation**:  
  64-gate XOR tree > 16-unit parity ring in your min-cut proxy (normalized min-cut on time-unrolled graph).

  **IIT's Verdict**:  
  Parity ring ≫ XOR tree in Φ. The ring has higher integrated information.

  **Why the Discrepancy?**  
  - **Your Proxy**: Measures *structural coupling* in the time-unrolled graph. The XOR tree has deep dependencies (every output depends on all inputs), so min-cut is high.  
  - **IIT's Φ**: Measures *irreducible information loss* under partitions. The ring demands all units to fully specify past/future states—any partition loses information. The XOR tree is factorable (subtree partitions lose little information).  

  **Which Property Does the "Real Work"?**  
  - **Consciousness Claim**: IIT prioritizes *feedback and irreducibility* (ring), not structural depth (XOR tree).  
  - **Philosophical Justification**: IIT argues consciousness requires feedback (self-cause/effect) and holistic processing. The XOR tree, lacking feedback, is "unconscious" despite computational utility.  
  - **Engineering Relevance**: Your proxy captures *functional integration* (useful for reliability). IIT's Φ captures *causal holism* (untethered from utility).  

  **Conclusion**:  
  Your proxy measures a different property—one optimized for distributed systems (dependencies, fault tolerance). IIT's Φ is not computable with your existing tools without adopting its specific metaphysics (feedback primacy, state-space uniformity). The "real work" in IIT's consciousness claim relies on causal loops and irreducibility, making the idle ring a valid example and the XOR tree invalid. Whether this reflects reality is unprovable in your vocabulary.
