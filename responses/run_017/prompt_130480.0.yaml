   2. A "residue report" that categorizes the claims of IIT into:
      a. Claims that are already computed in distributed systems under another name.
      b. Claims that survive only after fixing a timescale, grain of description, noise model, or cut metric.
      c. Claims with no counterpart in the user's vocabulary at all.

   The user also provides a concrete probe: they built a proxy (normalized min-cut on a time-unrolled graph) and found that a 64-gate feed-forward XOR tree scores higher than a 16-unit parity ring. They want to know if IIT would rank them the other way, and if so, whether their proxy is measuring the wrong quantity or if integration in their sense is different from IIT's. Also, which one is doing the real work in the consciousness claim?

   Let's first restate IIT in the requested vocabulary:

   IIT claims (as per user):

     - A system is a conscious subject to the extent that its causal structure resists being decomposed into independent parts.
     - Φ (phi) is the measure of that resistance.
     - The subject is the subset of elements that maximizes Φ (exclusion).
     - What the subject experiences is the full "shape" of its cause-effect structure, not a summary of behavior.

   We restate:

     - Consider a system as a state machine with a set of elements (nodes) and transitions (edges in a time-unrolled causal graph). The system has a state at each time step and the causal graph represents how the state at time t+1 is determined by the state at time t.

     - The causal structure of the system is the set of dependencies between states across time. We can model this as a directed graph (possibly cyclic) where nodes represent the state of elements at a given time and edges represent causal influence.

     - Φ measures the resistance to decomposition. In graph terms, we might think of decomposing the graph into two or more parts (with a cut) such that the parts are as independent as possible. However, note that IIT does not use a simple graph cut but a more complex measure that considers the system's causal structure in both directions (past to future and future to past) and the information loss when partitioning.

       Specifically, IIT defines a quantity called "integrated information" for a partition. The partition is a way of cutting the system into parts. Φ is the minimum information loss over all possible partitions (but note: the partition must be a "minimum information partition", MIP). The loss is measured by the difference in the cause-effect power of the whole system versus the cause-effect power of the partitioned system.

       In engineering terms, this is similar to asking: if we were to cut the system into two parts, how much would we lose in terms of the mutual information between the parts? But note: IIT uses a particular measure of cause-effect power (based on the system's transition probability matrix) and a particular way of partitioning (cutting the causal connections between parts and letting the parts be independent).

     - The exclusion principle: we look for the subset of elements (a subgraph) that maximizes Φ. This is the "subject" of consciousness.

     - The experience is the entire cause-effect structure (the set of all possible causal relationships within the system) of that subset.

   Now, we restate using the user's vocabulary:

     Let the system be represented as a state machine with state space S and transition function T: S -> S. We unroll the system in time to form a causal graph over multiple time steps.

     We can represent the causal graph as a directed graph G = (V, E) where:
        - V: nodes represent the state of each element at a given time step.
        - E: directed edges from a node at time t to a node at time t+1 if the state at t has a causal influence on the state at t+1.

     However, note: IIT typically considers a system at a single time step (the current state) and its causal relationships to the past (causes) and future (effects). So the causal graph in IIT is bipartite: from a set of elements at t to the same set of elements at t+1 (or t-1). But we can also think of it as a graph of interactions within a single time step (for a system with feedback, this would be cyclic) and across time.

     The resistance to decomposition (integration) is measured by Φ. We can think of it as:

        Φ = min_{partitions P} [ I(S; P) ]

     where I(S; P) is the "integrated information" for partition P, defined as the difference between the cause-effect power of the whole system and the cause-effect power when we cut the system according to P.

     How do we "cut" the system? In IIT, cutting a partition means removing the causal connections between the parts. In graph terms, we remove the edges that cross the partition. Then we compute the cause-effect power of the system under this cut (which is now two independent systems) and compare it to the original.

     The cause-effect power is measured by the system's ability to specify both the past and the future. In information-theoretic terms, it is the mutual information between the current state and the past (for causes) and the current state and the future (for effects). But note: IIT uses a more complex measure called "cause-effect information" (cei) which is the minimum of the cause information and the effect information for a particular state.

     So, Φ is the minimum over all possible partitions of the "effective information" (a measure of the loss of cause-effect power) due to the partition.

     In the user's terms:

        - We are looking for a min-cut in the causal graph that, when removed, minimizes the loss of mutual information (or a similar measure) between the parts? But note: IIT does not use a simple min-cut but a partition that minimizes the normalized loss (and then Φ is the loss for that minimal partition).

        - However, the cut in IIT is not on a time-unrolled graph but on a bipartite graph representing the transition from t to t+1. Moreover, the cut is not on edges but on the connections between elements in the current state and the next state.

