answer: |-
  Below is a decision tree designed to help students navigate Pascal's themes of justice, force, and custom without settling the three common interpretations (cynical realism, natural law, or conservative custom). The tree starts from an uncontroversial claim and uses your specified cases (boundary, settled-usurpation, design, insider) to branch into distinct positions. Each node is a concrete, answerable question based on a case, and leaves are labeled (with standard names where applicable) and include a brief description and an "awkward commitment" – the hardest implication of holding that view.

  The tree has **7 nodes** and **8 leaves**, covering the logical space while flagging gaps and indistinct leaves. It is built from combinations of answers to the cases, not preconceived labels. I'm **80% confident** in the structure – it isolates key tensions but may oversimplify nuanced views. The **least confident node is Node 4** (on normative vs. predictive work of possession), as it risks conflating moral and practical reasoning.

  ---

  ### **Decision Tree: What Does Force Do to Justice?**  
  *Start here: A rule being coercively enforced and obeyed does not, by itself, make it just.*  

  **Node 1 (Boundary Case)**  
  You cross a border where an act (e.g., taking property from a relative) changes from "theft" to "lawful inheritance." Does the moral status of the act change?  
  - **Yes** → Go to Node 2.  
  - **No** → Go to Node 3.  

  **Node 2 (Settled-Usurpation Case, for "Yes" at Node 1)**  
  A regime’s founding document is exposed as a forgery after 200 years of stable rule. Does this discovery change what citizens *should do* (e.g., obey or resist)?  
  - **Yes** → **Leaf 1: Foundational Legitimism**  
    - *Description:* Justice depends on origins; exposed illegitimacy voids obligation.  
    - *Awkward commitment:* Must reject a functional, long-standing system over an ancient flaw, risking chaos.  
  - **No** → Go to Node 4.  

  **Node 3 (Settled-Usurpation Case, for "No" at Node 1)**  
  Same as Node 2: Forgery exposed after 200 years. Does this change what citizens *should do*?  
  - **Yes** → **Leaf 2: Rectificatory Natural Law**  
    - *Description:* Universal justice exists; historical injustices require correction, even belatedly.  
    - *Awkward commitment:* Obliges dismantling stable institutions for past wrongs, inviting disruption.  
  - **No** → Go to Node 5.  

  **Node 4 (Settled-Usurpation Follow-Up, for "No" at Node 2)**  
  The forgery doesn’t change what people should do. Does the regime’s 200 years of undisturbed possession:  
  - **Give it normative legitimacy** (i.e., time makes it rightful) → **Leaf 3: Customary Conventionalism**  
    - *Description:* Custom sanctifies authority; longevity itself creates moral obligation.  
    - *Awkward commitment:* Justifies any long-standing system (e.g., colonial regimes) if unchallenged.  
  - **Only predict stability** (i.e., people accept it, but it’s still unjust) → Go to Node 6.  

  **Node 5 (Design Case, for "No" at Node 3)**  
  You’re designing a new constitutional court. Compliance hinges on beliefs about justice. Should proceedings use robes/ceremony to obscure arbitrary foundations?  
  - **Yes** → Go to Node 7.  
  - **No** → **Leaf 4: Idealistic Transparency**  
    - *Description:* Justice must be self-evident; illusions undermine legitimacy.  
    - *Awkward commitment:* Risks erosion of order if people lose faith due to exposed flaws.  

  **Node 6 (Design Case, for "Predictive" at Node 4)**  
  Same as Node 5: Should the court use ceremonial robes?  
  - **Yes** → **Leaf 5: Cynical Realism**  
    - *Description:* Force rules; "justice" is a tool to maintain stability through managed appearances.  
    - *Awkward commitment:* Admits justice is a hollow performance, requiring active deception.  
  - **No** → **Leaf 6: Nihilistic Realism**  
    - *Description:* Force is the only reality; obedience is pragmatic, not moral.  
    - *Awkward commitment:* Denies any moral difference between regimes (e.g., democracy vs. tyranny).  

  **Node 7 (Insider Case, for "Yes" at Node 5)**  
  An official sees through the court’s illusions. Must she give the law:  
  - **Outward compliance only** (act obediently) → **Leaf 7: Public Quietism**  
    - *Description:* Stability demands public conformity; internal dissent is permissible.  
    - *Awkward commitment:* Forces complicity in systems one privately deems unjust.  
  - **Inward acknowledgement** (believe in its justice) → **Leaf 8: Pious Conventionalism**  
    - *Description:* Custom warrants full assent; doubt itself is corrosive.  
    - *Awkward commitment:* Requires believing in illusions (e.g., ceremonies) as morally necessary.  

  ---

  ### **Logical Space & Gaps**  
  - **Unoccupied Combinations:**  
    - *Node 1 "No" + Node 3 "No" + Node 5 "Yes" + Node 7 "Inward acknowledgement":* This path (universal justice + stability-focused design + full assent) isn't represented. It implies justice is real but must be *felt* through custom – a coherent but rare view (e.g., Burkean natural law). It’s untried, not incoherent.  
    - *Node 1 "Yes" + Node 2 "Yes" + ?:* Foundational Legitimism (Leaf 1) skips the design/insider cases. Adding a node here might reveal splits (e.g., revolution vs. resignation), but the tree omits it to avoid sprawl. It’s a gap but not critical.  
  - **Why Gaps Exist:**  
    - Views blending natural law with strong custom (e.g., Node 1 "No" + Node 4 "Normative") are missing. The tree forces a choice between universal standards (Node 1 "No") and custom’s moral power (Node 4), but some thinkers (e.g., Cicero) fuse them. This is unattractive to moderns as it seems inconsistent.  

  ### **Indistinguishable Leaves**  
  - **The three Pascal readings collapse at Node 5:**  
    - A cynical realist (justice as power’s decoration) could end in **Leaf 5** (Cynical Realism) or **Leaf 6** (Nihilistic Realism).  
    - A natural-law thinker (justice real but obscured) could end in **Leaf 2** (Rectificatory), **Leaf 4** (Idealistic), **Leaf 7** (Public Quietism), or **Leaf 8** (Pious Conventionalism).  
    - A custom conservative (stability over correctness) could end in **Leaf 3** (Customary Conventionalism), **Leaf 7**, or **Leaf 8**.  
    - **Key overlap:** **Leaf 8** (Pious Conventionalism) and **Leaf 3** (Customary Conventionalism) both serve stability, blurring "conservative custom" and "natural law" if the latter values order. The tree *cannot* fully separate Pascal’s interpretations because real positions overlap in practice. The handout should note this to spur reflection.  

  ### **Confidence & Weaknesses**  
  - **80% Confidence:** The tree isolates core tensions (origin vs. custom, transparency vs. stability, internal vs. external obligation) using your cases. It avoids labels and forces engagement with paradoxes.  
  - **Least Confident Element:** **Node 4** (normative vs. predictive work of possession). It may distort views where "acceptance" and "legitimacy" intertwine (e.g., Humean custom). A student might see predictive stability as *creating* normative force, making the choice artificial. Reframe this node if debates stall.  

  This tree lets students "locate themselves" by exposing their intuitions about force’s role. Use it to map discussions, not end them.
