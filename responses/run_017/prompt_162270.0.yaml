  Now, the exam question:

  **Exam Question**

  Assume the following for the purposes of this question: the non-identity problem is solved; the expressive objection (that selecting against disability-related traits devalues existing people with those traits) is met; and concerns about the child's future autonomy or about "designing" people are resolved. A reliable, cheap, and widely available method exists for estimating an embryo's expected lifetime well-being from its genome.

