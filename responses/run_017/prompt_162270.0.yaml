  When parents select for positionally loaded traits, each parent improves their own child's chances of securing an elite position. However, because the number of positions is fixed, these individual gains cancel out at the societal level, and the resources spent on selection are wasted. 

  What does this case show about the Principle of Procreative Beneficence (PPB)? Defend one of the following diagnoses against the others:

  - **REDUCTIO**: The case shows that PPB is self-defeating: a principle of beneficence cannot require acts that, when universally performed, produce no net benefit. Therefore, PPB must be abandoned or restricted to non-positional traits.
  - **COORDINATION**: The case leaves the reason PPB gives to an individual parent intact. It merely shows that the practice of embryo selection for positional traits requires collective restraint to avoid an arms race.
  - **DISSOLUTION**: The case shows that PPB must be formulated using a non-comparative conception of well-being. Once this is done, the arms race disappears and there is nothing to restrain.
  - **CATEGORY ERROR**: There is no arms race at all. Selecting one embryo rather than another does not change the traits of other people's children, so there is no collective cancellation of gains.

  **Model Answer**

  The scenario presents a challenge to the Principle of Procreative Beneficence (PPB) in the context of positional goods. PPB states that prospective parents have a significant moral reason to select, from among the possible children they could have, the one expected to have the best life. In a society where elite positions are fixed and embryo selection for positionally loaded traits is nearly universal, individual adherence to PPB may lead to a collectively self-defeating outcome: the resources spent on selection yield no net improvement in the well-being of children because the positional gains cancel. This essay argues for the COORDINATION diagnosis: the moral reason for an individual parent to select the best embryo remains, but the case reveals a collective action problem requiring coordinated restraint. This diagnosis is grounded in the partialist foundation of PPB and recognizes the positional nature of some goods while avoiding the overreactions of the other diagnoses.

  First, consider why the other diagnoses fail. The REDUCTIO diagnosis claims that PPB is self-defeating because universal compliance leads to no net benefit. However, this misconstrues PPB as an impartial principle. PPB is typically grounded in a parent's special obligation to the child they create, not in maximizing overall social utility. For an individual parent, selecting an embryo with a higher expected well-being (even if due to positional traits) *does* benefit that specific child. The fact that universal performance yields no aggregate benefit does not negate the individual obligation; it merely highlights a collective action problem. Thus, REDUCTIO overgeneralizes by concluding that PPB must be abandoned or restricted.

  The DISSOLUTION diagnosis proposes reformulating PPB using a non-comparative conception of well-being. While this would dissolve the arms race by ignoring positional advantages, it is inadequate because well-being is partly comparative. In a society where elite positions are awarded based on relative standing, a child's life prospects depend on their position relative to others. A non-comparative measure (e.g., focusing solely on health) would ignore a real component of well-being, thereby failing PPB's mandate to select the child with the best expected life. DISSOLUTION thus changes the subject by redefining well-being to avoid the problem, rather than addressing it.

  The CATEGORY ERROR diagnosis denies the arms race, arguing that selecting one embryo does not change others' traits. This is factually mistaken in the given scenario. When parents select for a trait, they alter the distribution of that trait in the next generation. If all parents select for height, the average height increases, thereby reducing the relative advantage of being tall. Consequently, the expected well-being associated with a given height decreases, and the selection process becomes an arms race: parents must invest in selection merely to maintain their child's relative standing. The individual acts do have collective effects, so CATEGORY ERROR is untenable.

  The COORDINATION diagnosis withstands these objections. PPB's core insight—that parents have a pro tanto reason to select the child with the best prospects—remains compelling for the individual. This reason is grounded in parental partiality: a parent's duty is to their own future child, not to the collective. However, when traits are positionally loaded, individual rationality leads to a suboptimal outcome for all. This is a classic prisoner's dilemma: each parent acts rationally, but the result is a waste of resources with no improvement in well-being. The solution is not to abandon PPB but to coordinate collective restraint, such as through regulations limiting selection to non-positional traits or agreements to avoid certain forms of enhancement.

  Crucially, this diagnosis recognizes that traits often have both positional and non-positional components. For instance, height might contribute to well-being absolutely (e.g., through health) and positionally (e.g., through basketball scholarships). PPB requires selecting for the total expected well-being, but in the coordination solution, we might collectively agree to ignore or downplay the positional component to avoid the arms race. This does not negate PPB; it supplements it with a collective duty to ensure that the principle does not become self-undermining.

  In conclusion, the case does not refute PPB but reveals a limitation in its application when traits are positionally loaded. The COORDINATION diagnosis correctly preserves the individual moral reason while calling for collective action. The alternative diagnoses either overreact (REDUCTIO), evade the problem (DISSOLUTION), or deny its existence (CATEGORY ERROR). Thus, PPB endures, but its implementation requires social coordination to prevent a collectively self-defeating outcome.

