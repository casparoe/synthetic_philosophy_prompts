answer: |-
  ### Exam Question  
  **Time Allowed: 90 minutes**  
  **Marks: 20**  

  Assume the following for the purposes of this question: the non-identity problem is resolved; the expressive objection (that selecting against disability devalues existing people) is met; and concerns about designing children or violating future autonomy are answered. A reliable, inexpensive, and universally accessible method estimates an embryo’s expected lifetime well-being from its genome.  

  Now consider a society with a fixed number of elite positions (e.g., university admissions, high-status careers) that heavily influence life outcomes. Embryo selection for traits predicting success in these competitions is nearly universal. A trait is *positionally loaded* if most of its contribution to a child’s expected well-being stems from relative advantage (e.g., height in a society where rewards depend on being taller than average). This contrasts with non-positional traits (e.g., robust health), which improve life in absolute terms.  

  When parents select for positionally loaded traits, each gains an advantage for their child, but since positions are fixed, gains cancel out collectively, and selection resources are wasted.  

  **What does this case reveal about the Principle of Procreative Beneficence (PPB)?**  
  Defend exactly one of the following diagnoses against the other three:  
  - **REDUCTIO**: PPB is self-defeating; a beneficence principle cannot require acts whose universal performance yields no benefit. PPB must be abandoned or restricted to non-positional traits.  
  - **COORDINATION**: PPB’s reason for individual parents remains valid, but collective restraint is needed to prevent an arms race.  
  - **DISSOLUTION**: PPB must use a non-comparative conception of well-being; then no arms race exists and nothing requires restraint.  
  - **CATEGORY ERROR**: No arms race occurs; selecting one embryo never alters others’ traits, so gains do not collectively cancel.  

  ---

  ### Model Answer  
  **Word Count: 998**  

  The scenario presents a collective action problem for the Principle of Procreative Beneficence (PPB), which holds that prospective parents have a significant moral reason to select the embryo expected to have the best life. When traits are positionally loaded—meaning their benefits depend largely on relative advantage—universal embryo selection for such traits risks a zero-sum arms race: individual gains cancel at the group level, wasting resources without improving overall well-being. This essay defends the **COORDINATION diagnosis**: PPB’s core reason for individual parents survives intact because it is grounded in parental partiality, but the case reveals a need for collective restraint to avoid self-defeating outcomes. The alternative diagnoses either overreact, misconstrue PPB, or ignore the dynamics of positional competition.  

  **Defending COORDINATION**  
  PPB imposes a pro tanto duty on parents to benefit their future child, rooted in the special relationship of partiality—not impartial beneficence. For an individual parent in this society, selecting an embryo with positionally loaded traits (e.g., competitiveness) directly enhances that child’s expected well-being by improving their competitive standing. If others engage in selection, abstaining would disadvantage one’s own child, making selection rationally and morally compelling at the individual level. Thus, PPB’s reason persists: it guides parents to act in their child’s interests, irrespective of collective effects.  

  However, universal compliance creates a collective action problem akin to a prisoner’s dilemma. When all parents select for positional traits, the average level of these traits rises, eroding the relative advantage they confer. For instance, if all select for genes linked to competitiveness, the baseline competitiveness increases, so no child gains a lasting edge in securing elite positions. Resources spent on selection (e.g., financial costs, medical procedures) then become pure waste. Crucially, this inefficiency stems not from PPB itself but from the positional nature of the traits: the principle correctly identifies a reason to act, but when everyone acts identically, the benefit dissipates. The solution is not to discard PPB but to coordinate restraint—e.g., via social policies limiting selection to non-positional traits—to preserve individual gains without collective waste.  

  **Rebuttals of Alternative Diagnoses**  
  - **REDUCTIO** claims PPB is self-defeating because universal adherence yields no net benefit. This misapplies the universality test: PPB is not an impartial utilitarian rule but a partialist duty. A principle grounded in parental partiality can justify acts that are individually beneficial but collectively suboptimal without contradiction. For example, a parent’s duty to feed their child remains valid even if universal food hoarding causes famine; the solution is coordination, not abandoning the duty. REDUCTIO fails by conflating partial beneficence with impartial optimization, and it overreaches by demanding PPB’s restriction.  

  - **DISSOLUTION** argues that reformulating PPB with non-comparative well-being dissolves the arms race. This ignores how well-being operates in the case. Positionally loaded traits derive value from social competition: in a society where elite positions reward relative advantage, well-being inherently includes comparative elements (e.g., status, access). A non-comparative conception (e.g., defining well-being solely by health) would exclude these real components, violating PPB’s mandate to maximize expected well-being *as experienced in that society*. DISSOLUTION thus evades the problem by redefining well-being arbitrarily, rendering PPB inert in contexts where comparison matters.  

  - **CATEGORY ERROR** denies the arms race, asserting that selecting one embryo never affects others’ traits. This overlooks dynamic social effects. While one parent’s choice does not directly alter another embryo’s genome, universal selection shifts the population distribution of traits. If all parents select for height, average height increases, reducing the well-being advantage of any given height (since rewards depend on relative stature). Selection also consumes resources that could enhance absolute well-being (e.g., healthcare), indirectly harming all. Thus, individual acts aggregate into collective harm, making the arms race real. CATEGORY ERROR’s static view ignores how expected well-being is socially contingent.  

  **Qualification and Synthesis**  
  The COORDINATION diagnosis hinges on two insights. First, PPB’s grounding in parental partiality—not impartiality—insulates it from REDUCTIO: parents act for their child’s sake, not society’s. Second, traits must be bifurcated into positional and non-positional components. For instance, height may offer non-positional benefits (health) and positional advantages (status). PPB requires selecting for total expected well-being, but in coordination, society restrains the positional component to halt the race. This nuanced approach avoids DISSOLUTION’s oversimplification and CATEGORY ERROR’s denial.  

  In sum, the case exposes a tension in PPB’s application but not its core validity. COORDINATION preserves the principle by addressing its collective implications, while the alternatives either overcorrect, redefine key terms, or misdiagnose the problem.  

  ---

  ### Marking Scheme  
  **Total: 20 marks**  
  A top answer (A grade: 17–20) must: (1) defend one diagnosis rigorously while rebutting the others with tailored arguments; (2) explicitly ground PPB in parental partiality (not impartial beneficence) to explain why individual reasons persist; (3) separate the positional and non-positional components of a trait’s expected benefit. B-grade answers (13–16) address diagnosis defense and rebuttals but omit or mishandle (2) and/or (3).  

  #### Breakdown:  
  1. **Defense of chosen diagnosis (max 6 marks)**:  
     - 5–6: Clear, nuanced justification linking diagnosis to PPB’s structure (e.g., for COORDINATION, explains parental partiality and collective harm).  
     - 3–4: Defense is present but superficial (e.g., asserts COORDINATION without grounding in partiality).  
     - 1–2: Diagnosis stated but poorly defended.  
     - *Common error*: Treating PPB as impartially grounded, undermining the defense.  

  2. **Rebuttals of the other three diagnoses (max 9 marks, 3 per rebuttal)**:  
     - Per rebuttal (3 marks): Accurate summary + specific counterargument (e.g., for REDUCTIO, explains why partiality blocks the self-defeat charge).  
     - *Common errors*:  
       - REDUCTIO: Failing to distinguish partial/impartial grounds.  
       - DISSOLUTION: Not arguing that well-being must include comparative elements.  
       - CATEGORY ERROR: Ignoring population-level effects of universal selection.  

  3. **Integration of key insights (max 5 marks)**:  
     - Grounding in parental partiality (3 marks): Explicitly states PPB’s partialist basis and its role in the diagnosis (e.g., "PPB’s reason survives because it is child-centered, not society-centered").  
     - Separation of trait components (2 marks): Distinguishes positional vs. non-positional benefits in the argument (e.g., notes that selection for height may have absolute health benefits but positional waste).  
     - *Common error*: Conflating positional/non-positional traits (e.g., treating all traits as purely one or the other).  

  #### Grade Boundaries:  
  - **A (17–20)**: Excels in all areas. Achieves 6 in defense, 8–9 in rebuttals (minor flaws allowed), and 4–5 in insights. Must include both grounding and trait separation.  
  - **B (13–16)**: Good defense/rebuttals (4–5 in defense, 6–8 in rebuttals) but weak on insights (e.g., notes partiality but not trait separation, or vice versa).  
  - **C (9–12)**: Limited defense/rebuttals (2–4 in defense, 3–6 in rebuttals) and minimal insights.  
  - **D (5–8)**: Incomplete engagement (e.g., lists rebuttals without argumentation).  

  **Non-engagement penalty**: Answers recycling stipulated-away objections (non-identity, expressive, autonomy) without addressing positional dynamics are capped at **8 marks** (D grade), as they fail the question’s core aim.  

  \answer{COORDINATION — grounded in parental partiality}
