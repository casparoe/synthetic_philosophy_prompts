  - Prepare multiple decks that are hue-rotations of each other. For example, if the base deck has colors in order: C1, C2, C3, ... then a rotated deck might be C2, C3, ... C1 (or a more complex permutation that preserves the relational structure).
  - Legends are rotated accordingly so that the same color name now points to the rotated swatch. So if in the base deck, "Red" is C1, then in the rotated deck, "Red" is C2 (if the rotation shifts by one).
  - Assign each student a role for the round (rotate each round so everyone gets to be each role).

