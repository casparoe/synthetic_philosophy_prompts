answer: |-
  Based on your constraints and goals, here's a comprehensive game design that leads students to confront the incoherence of qualia through hands-on discovery. The game uses **shape/texture decks** instead of color to accommodate color-vision-deficient students while preserving the philosophical tension. I'll outline the game structure, rounds, payoff scheme, debrief mappings, anticipated problems, and limitations.

  ---

  ### **Game Structure: "The Silent Swap"**
  **Core Mechanism**: Students experience "undetectable changes" to their perceptual decks, revealing that all verification methods rely on relational properties.  
  **Materials**: 
  - Shape/texture decks (10-12 cards per deck): Each card has a unique combo of shape (circle, square, triangle) and texture (smooth, striped, dotted).  
    - *Example card*: Small dotted circle, Large smooth square.  
  - Legends: Each deck has a legend mapping names (e.g., "Glyph-1") to card properties.  
  - Index cards for logging and tokens.  
  - Projector for instructions.  

  **Roles (rotated each round)**:  
  1. **Subject**: Perceives the deck, completes tasks, logs "proof" of their experience.  
  2. **Intervener**: Swaps decks/legends per a secret script, logs actions, gives false disclosures.  
  3. **Auditor**: Reviews logs post-round, guesses if a swap occurred.  

  **Setup**:  
  - Prepare decks as automorphisms (relational symmetries). *Example*:  
    - **Deck A**: Glyph-1 = Small dotted circle, Glyph-2 = Large smooth square...  
    - **Deck B (rotated)**: Glyph-1 = Small dotted **square**, Glyph-2 = Large smooth **triangle**...  
    - *Relational structure preserved*: Size/texture discriminations and similarity rankings are identical across decks.  
  - Assign roles randomly each round (ensure all students rotate roles).  

  ---

  ### **Rounds & Tasks**  
  Each round runs 8-10 minutes. **Total time**: 60-70 minutes.  

  1. **Round 0: Baseline (No Swap)**  
     - *Task*: Subjects log two sentences:  
       - "How *I* would know my experience changed later": e.g., "The dotted circle feels rougher."  
       - "How a *partner* would know my experience changed": e.g., "I’d say the dotted circle is rougher."  
     - *Goal*: Establish that subjects assume experiences are introspectable and reportable.  

  2. **Round 1: Global Swap (Automorphism)**  
     - Intervener swaps deck/legend with a rotated version (e.g., Deck A → Deck B).  
     - *Task*: Subjects relog the same two sentences. Auditor guesses if a swap occurred using logs.  
     - *Debrief hook*: Undetectable change—all relational properties (naming, discrimination) identical.  

  3. **Round 2: Partial Swap (Broken Symmetry)**  
     - Intervener swaps only 2 cards (e.g., replace dotted circle with smooth circle), breaking similarity relations.  
     - *Task*: Subjects log sentences. Auditor guesses using logs.  
     - *Debrief hook*: Detectable change—only because relational structure broke.  

  4. **Round 3: Round-Trip Swap**  
     - Intervener swaps decks and immediately swaps back (net: no change).  
     - *Task*: Subjects log sentences. Class votes: "Did experiences change twice, once, or zero times?"  
     - *Debrief hook*: No fact about "how many times" qualia changed if relations are identical.  

  5. **Round 4: False Disclosure**  
     - **No swap occurs**. Intervener falsely tells 50% of Subjects they were swapped; tells others nothing.  
     - *Task*: Subjects log sentences. Auditor guesses using logs.  
     - *Debrief hook*: "Facts" about changes can be manufactured externally without experiential differences.  

  6. **Round 5: Handover**  
     - No swap. Subjects describe "the intrinsic property" of one card **without mentioning**:  
       - Other experiences, stimuli, behavior, relations, or names.  
       - *Example attempt*: "Raw pointy-smoothness."  
     - Partners guess if they have the "same property."  
     - *Debrief hook*: Ineffability—descriptions fail to communicate "intrinsic" properties.  

  ---

  ### **Payoff Scheme: "The Token Bet"**  
  **Goal**: Incentivize asserting changes without rigging toward eliminativism.  
  **Mechanics**:  
  - Each student starts with 3 tokens.  
  - After **Rounds 1-4**, Subjects/Auditors can **bet tokens** on whether a swap occurred:  
    - **Assert "change"**: Pay 1 token. If correct, gain 2 tokens.  
    - **Stay silent**: Keep tokens (no gain/loss).  
  - **Scoring public**: Project a leaderboard (names optional).  
  - **Why it works**:  
    - Asserting is high-risk/high-reward (e.g., partial swaps are detectable, global are not).  
    - Silence isn’t dominant: Auditors can profit from logs (e.g., false disclosure creates inconsistent reports), and Subjects in partial swaps have "evidence."  
    - *Avoids rigging*: Cog-sci majors will bet on detectable changes (partial swaps), philosophers may bet on undetectable ones.  

  ---

  ### **Debrief: Mapping Game to Qualia Incoherence**  
  Use the projector to recap rounds and draw connections:  

  | **Round**      | **Qualia Property Challenged** | **Incoherence Insight** |  
  |----------------|--------------------------------|-------------------------|  
  | **Global Swap** | Intrinsic & Private | Preserved relations make "intrinsic change" undetectable—no identity beyond relations. |  
  | **Partial Swap** | Directly Apprehensible | Changes only matter when relations break. "Apprehension" relies on relational contrasts. |  
  | **Round-Trip** | Private & Intrinsic | No fact about "how many times" qualia change if relations are identical. Challenges intrinsic *identity*. |  
  | **False Disclosure** | Private | "Facts" about private states can be externally implanted—no functional difference. |  
  | **Handover**   | Ineffable | Intrinsic properties can’t be communicated without relational anchors. |  

  **Key conclusion**:  
  - Qualia posits require relational properties to be identified (discrimination, naming, similarity), yet are defined as *non*-relational. Stripping away relations leaves no criteria to pin them down—hence incoherent.  

  ---

  ### **Predictable Problems & In-Class Solutions**  
  1. **"You rigged the undetectable swap!"**  
     - *Recovery*: "The rotation preserves all relations *by design*—like a symmetry in quality space. If qualia are intrinsic, why can’t we detect the change? What *could* detect it?"  

  2. **Conflating swaps with memory erasure**  
     - *Prevention*: Pre-round script: "Swaps affect your *current* deck—your memory is intact."  
     - *Recovery*: Contrast Round 0 (baseline memory) with Round 1 (undetectable despite memory).  

  3. **Cog-sci majors: "Change = discriminability!"**  
     - *Recovery*: "Exactly! But qualia realists insist there’s something *extra*—intrinsic properties. Did you need that ‘extra’ to play the game?"  

  4. **"The Intervener cheated / changed stimuli!"**  
     - *Prevention*: Give Interveners a printed script (revealed post-game).  
     - *Recovery*: "Stimuli changed, but legends changed too—functional roles stayed fixed. Is this analogous to ‘experience change’ without functional change?"  

  5. **Color-vision deficiency (avoided via shapes/textures)**  
     - Why shapes/textures? They allow automorphisms (size/texture rotations) without accessibility issues.  

  ---

  ### **What the Activity Can’t Capture & How to Handle It**  
  **Limitation 1**: The game doesn’t replicate the **first-person seeming** that "there’s something it’s like" beyond functional relations.  
  **Limitation 2**: Swapping cards mimics "experience change" poorly—it’s a proxy, not a direct analogue.  

  **Handling the Realist’s Objection**:  
  1. **Acknowledge openly**: "This game *doesn’t* replicate the raw feel of experience—it’s a metaphor for how we *talk* about that feel."  
  2. **Pivot to the incoherence claim**: "But when we try to *define* that ‘raw feel’ as intrinsic, ineffable, etc., we hit contradictions. The game shows why those definitions crumble under scrutiny. Dennett’s argument is that this seeming—while real—isn’t evidence for *incoherent properties*."  
  3. **Transition to reading**: "Next week, we’ll see Dennett dissect this seeming and why he thinks it’s a cognitive illusion."  

  **Why this works**: Validates the realist intuition while showing its conceptual fragility—priming students for Dennett’s critique.  

  ---

  ### **Logistics & Timing**  
  - **Prep**: Print decks/legends (use free online templates for shapes/textures).  
  - **In-class flow**:  
    - Intro (5 min): Explain roles, tokens, and goals.  
    - Rounds 0-5 (60 min): Keep rounds strict (use timer).  
    - Payoff scoring (5 min): Tally tokens.  
    - Debrief (10 min): Use projector to map rounds to theory.  
  - **Total**: 80 minutes.  

  This design forces students to confront the relational underpinnings of "intrinsic" properties through experience, setting up Dennett’s critique organically. The token bet introduces stakes without financial incentives, and the shape/texture focus ensures inclusivity.
