prompt: |-
  hey — I'm on a volunteer committee rewriting the decision procedure for a housing placement org, and I've ended up being the person who has to write the "what counts as a defensible decision around here" page. Concretely: a caseworker gets about 40 minutes with a family, the portal lets them flag at most five units before the family's voucher clock runs out, and we do this a few thousand times a year. So I don't want a theory of rationality in the abstract; I want a spec I could hand to a supervisor who has to audit a written procedure, and to a new caseworker who has to follow it on their second day. Every time I go looking for one I get told that full optimization is off the table for creatures like us and then nothing about what to demand of whatever replaces it.

  So: write me the desiderata. Not a reading list — the list of things a theory of bounded rationality or satisficing has to deliver to be adequate *for this purpose* (auditing and teaching a real procedure, not publishing a paper), with the case or consideration behind each, and a verdict on which are non-negotiable and which are just the prejudices of one camp.

  Things I think might be on the list, in no order, and I genuinely don't trust any of them:

  - the procedure has to be runnable by someone tired, with a stopwatch — it can't contain "solve an intractable problem" as a subroutine
  - it has to be teachable: a new caseworker with the manual beats a new caseworker told to use judgment
  - it has to be auditable by someone who knows *less* than the caseworker knew at the time (this is the one I care most about; most of what I've read seems to assume an evaluator with the agent's full information)
  - it has to be able to say no. There have to be procedures it condemns, and it can't rescue every bad call by positing an unmeasured mental cost afterwards — I've started calling this budget-laundering and I want to know whether that's a real constraint or just my irritation
  - it shouldn't grade the interface: if the same units surface in a different order, or the pool is carvable into neighborhoods vs. into price bands, and the theory's verdict flips, it's evaluating a description rather than a decision
  - it should say when to spend the budget on reshaping the choice environment instead of on thinking harder (the other blade of Simon's scissors, roughly)
  - it should handle the stopping question and the drift question: when do you take the fourth unit and stop looking, and is a caseworker whose standards quietly slide downward after three bad weeks adapting or failing?
  - it should survive the fact that we cannot measure cognitive effort in anything like cardinal units, so a theory needing a cost-of-thinking number may just be unimplementable for us — fair demand, or are we whining?
  - it should converge to expected-utility maximization as resources go to infinity — I suspect this one is a neoclassical prejudice, especially given the results where knowing less or ignoring information does better

  Cases I want each requirement moored to, at minimum: the five-unit cap; the two interfaces that present the same forty apartments differently; the org's distribution versus the family's one shot (whose budget is the theory optimising for, and can it be both); the drift case; and our caseworker who is intransitive across three units but never sees the same triple twice, so the usual arbitrage-style objection doesn't obviously reach her.

  Two things I want on top of the list. First, I have a sinking feeling that some subset of these can't all hold together — if so, say which, and what has to give, because I'd rather have four criteria I can defend than nine that are secretly at war. Second, tell me which single criterion knocks out the most candidate theories, i.e. which one is actually doing the excluding.

  Last and briefly, no more than a short paragraph: how the three rough approaches I keep running into do against your list — optimization under an explicit computational budget; the fast-and-frugal / fit-to-the-environment heuristics picture; and the version that prices mental effort and tunes the procedure to the distribution of problems. I'll do the real scoring myself.
reasoning: |-
  Hmm, the user is working on creating a decision procedure for a housing placement organization. They need a practical set of desiderata that can be used to audit decisions and train caseworkers, not abstract theories. The constraints are tight: 40 minutes per family, a maximum of five units flagged, and thousands of cases annually. They listed several potential criteria but are unsure which are valid.

  First, I need to address each point they raised. The audibility requirement is crucial because supervisors might not have the same context as the caseworker. Teachability matters since new staff must follow the procedure reliably. The "must say no" point prevents justifying poor decisions after the fact—budget-laundering is a real issue. Interface independence ensures the decision isn't affected by how options are presented. Environmental design (Simon's scissors) should be part of the process. Handling stopping rules and drift addresses when to stop searching and consistency over time. Avoiding cardinal effort metrics is practical since measuring cognitive cost isn't feasible. The convergence to EU maximization might be optional if it conflicts with other criteria.

  The cases they mentioned need to be tied to each requirement. For example, the five-unit cap relates to runnability and stopping rules. Different interfaces link to interface independence. The drift case shows why consistency matters. The intransitive caseworker highlights the need for audibility without full information.

  I suspect some criteria conflict. For instance, requiring convergence to EU might clash with environmental design or avoiding cardinal metrics. The convergence criterion is likely the one that knocks out many theories, especially those relying on computational budgets that need precise effort measurement.

  For the three approaches: Optimization under computational budget struggles with auditability and effort metrics. Fast-and-frugal heuristics excel in runnability and teachability but might not handle drift well. Tuning to problem distribution is strong on environmental design but requires data and might not be auditable. Fast-and-frugal seems the most viable for their immediate needs.

  The user's deeper need is a defensible, practical system that withstands scrutiny without unrealistic assumptions. They need clarity on trade-offs to prioritize implementable criteria over theoretical ideals.
answer: |-
  Here's a distilled list of desiderata for your "defensible decision" spec, grounded in your operational reality, with cases, negotiability, and conflicts laid bare. This prioritizes auditability, teachability, and robustness over theoretical elegance.

  ### Core Desiderata (Non-Negotiable)
  1.  **Operational Runnability (Stopwatch Test):** *Must be executable within 40 mins, using the actual portal, by a caseworker under typical cognitive load (tired, distracted). Cannot require solving NP-hard problems, extensive calculations, or deep introspection.*
      *   **Case:** The 5-unit cap. The procedure *must* fit within this strict action budget and time window. A step requiring "calculate the expected utility for all 40 units" fails.
  2.  **Teachability (Manual Over Intuition):** *Must be clearly documented in steps/rules such that a reasonably intelligent new caseworker, trained solely on the manual, consistently outperforms one told to "use their best judgment" on day two.*
      *   **Case:** The new caseworker on their second day. The procedure must be a concrete script, not a philosophy seminar. Ambiguity ("consider all factors") fails.
  3.  **Auditability (Inferior Information Test):** *Must enable a supervisor (lacking the caseworker's real-time stress, subtle cues, or full mental context) to reconstruct and evaluate the reasonableness of the decision *solely* from the documented inputs (family profile, portal data snapshots, flags set/not set) and the procedure's explicit steps.*
      *   **Case:** Your core concern. Audit happens *post-hoc* with incomplete info. A theory requiring the auditor to know the caseworker's unspoken mental state ("they felt Unit X was risky") fails. *This is the single most excluding criterion, knocking out most "mental effort cost" and purely cognitive models.*
  4.  **Accountability / "Must Say No" (Anti-Budget-Laundering):** *Must contain explicit, objective criteria for *rejecting* a potential unit flag or condemning a sequence of flags as indefensible. Cannot retroactively justify *any* decision by inventing unobserved cognitive costs or hidden preferences.*
      *   **Case:** The caseworker with intransitive choices (A>B, B>C, C>A) across different families. If the procedure allows this *without* a clear rule violation (e.g., "must prioritize school rating over commute if rating diff >2"), it fails. Budget-laundering destroys accountability.
  5.  **Interface Independence (Decision over Description):** *The verdict on the defensibility of a *specific flagging decision* (e.g., "flagging Unit X at time T") must be invariant to how the *same set* of units was presented (e.g., sorted by price vs. neighborhood, list vs. map).*
      *   **Case:** The same 40 units presented differently. If flagging Unit X is defensible in Interface A but indefensible in Interface B (solely due to presentation order/format), the procedure fails. It's evaluating the UI, not the housing match.

  ### Critical But Potentially Negotiable (Requires Explicit Trade-offs)
  6.  **Stopping Rule & Drift Resistance:** *Must provide a clear, auditable rule for *when to stop searching* and flag the current best option(s) before exhausting the 5 flags/time. Must include mechanisms (e.g., calibration checks, supervisory review triggers) to detect and correct systematic "drift" (e.g., lowering standards due to fatigue/pessimism).*
      *   **Case:** The drift after three bad weeks; the 5th flag. A procedure saying "flag when you find something good enough" without defining "good enough" *operationally* and *auditably* is vulnerable to drift. Negotiable only if strong drift controls exist.
  7.  **Environmental Shaping Focus (Simon's Scissors - Other Blade):** *Must explicitly allocate *some* "effort budget" (time, design resources) *away* from per-case decision-making and *towards* shaping the choice environment (e.g., pre-filtering units, curating better defaults, improving portal UI, providing better summary data).*
      *   **Case:** The org's distribution (1000s of cases) vs. the family's one shot. Optimizing for the org means investing upfront to make individual decisions easier/faster/better. *Slightly negotiable:* The *degree* of investment/shaping can vary, but the *principle* of allocating effort *beyond* the 40-min case is crucial for scalability.

  ### Likely Impractical Demands (Be Prepared to Drop)
  8.  **Avoid Cardinal Effort Metrics:** *Cannot rely on quantifying "mental effort" or "cognitive cost" in precise numerical units. Must use observable actions (time spent, flags used, data points checked) or simple ordinal scales ("high/medium/low complexity case").*
      *   **Case:** Measuring cognitive effort. "Fair demand" wins. Theories requiring precise `cost_of_thinking(option)` are unimplementable. Drop this demand? **No.** It's essential for runnability and auditability. *This requirement makes computational budget optimization largely infeasible for you.*
  9.  **Convergence to EU Maximization:** *As time/resources increase infinitely, the procedure should approach the theoretical "optimal" choice.*
      *   **Case:** Neoclassical ideal vs. reality. **Drop this.** It's often a prejudice. Bounded rationality means the "optimal" procedure *under severe constraints* might look *nothing* like EU max. Environmental shaping (Desideratum 7) is often a *better* use of infinite resources than infinitely long per-case deliberation. Forcing convergence can cripple a good bounded procedure.

  ### Conflicts and What Must Give
  *   **Convergence (9) vs. Everything Else:** Insisting on convergence (9) directly conflicts with runnability (1), teachability (2), avoiding effort metrics (8), and often necessitates complex calculations that break auditability (3). **Drop 9.**
  *   **Auditability (3) vs. Complex Mental Models:** Any theory relying on rich, unobservable internal states (detailed mental effort costs, nuanced subjective probabilities) inherently fails auditability (3). **Auditability wins.** This forces you towards procedural, rule-based, input/output focused models.
  *   **"Must Say No" (4) vs. Flexibility:** Defining strict rules for rejection (4) can feel rigid and might miss edge cases. However, without it, accountability vanishes. **Accountability wins.** You trade some potential edge-case flexibility for essential defensibility and protection against bad faith/lazy decisions. Documented, auditable overrides for true edge cases are better than universal fuzziness.

  ### How the Three Approaches Fare Against Your List
  *   **Optimization Under Explicit Computational Budget:**
      *   **Fails:** Auditability (3 - needs internal state), Avoiding Cardinal Effort (8 - *requires* precise `cost(function)`), Runnability/Teachability (1,2 - too complex). Struggles with Environmental Shaping (7 - focus is per-case).
      *   **Potential:** Stopping Rule (6 - if budget defined clearly).
  *   **Fast-and-Frugal Heuristics (FFT):**
      *   **Excels:** Runnability (1), Teachability (2), Auditability (3 - rules are clear), Interface Independence (5 - focuses on cues, not presentation), Avoiding Cardinal Effort (8). Naturally handles Stopping (6 - built-in stopping rules).
      *   **Challenges:** "Must Say No" (4 - needs explicit rejection rules built in), Drift Resistance (6 - requires monitoring rule adherence, not just outcomes), Environmental Shaping (7 - focus is on the heuristic, not the environment). Needs strong design to ensure rules lead to good-enough outcomes.
  *   **Tune Procedure to Problem Distribution (Ecological Rationality):**
      *   **Excels:** Environmental Shaping (7 - core focus), Interface Independence (5 - focuses on real-world structure). Can be made Runnable (1) and Teachable (2) *if* the tuned procedure is simple.
      *   **Challenges:** Auditability (3 - *why* this procedure? requires validation data/meta-reasoning), "Must Say No" (4 - needs explicit rules), Drift Resistance (6 - what if the distribution shifts?). Requires significant upfront investment to analyze the environment/distribution.

  **Verdict:** **Fast-and-Frugal Heuristics** is the strongest starting point for your *immediate* needs (spec writing, auditing, training). It inherently delivers on the non-negotiables (1-5) and Stopping (6). **Crucially, pair it with a strong commitment to Environmental Shaping (Desideratum 7 - Simon's other blade)**. Use your org's data and experience to design and validate the specific heuristics and rejection rules, and build in explicit drift monitoring (part of 6). Forget optimization under budget and drop convergence demands. Your spec should be a clear, rule-based procedure focused on auditable inputs and actions.
