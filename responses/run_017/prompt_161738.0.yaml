  - Transworld-identity theorist's push back: The context-shift is ad hoc and designed to avoid the structural commitment of CT. In a fixed context, the counterpart relation should be stable. Moreover, the TWI theorist argues that the disagreement reveals that CT is not a genuine alternative to TWI because it relies on context to mimic TWI when convenient, but at the cost of having to explain why the context shifts in this way.

  **Conclusion:**

  This case meets the specifications: a realistic scenario, agreement on a simple de re claim, and a structural disagreement on an iterated claim. The disagreement arises from the non-transitivity in the sense that the counterpart relation does not allow chaining of dissimilar counterparts (via career change) when held fixed, whereas TWI has no such restriction. However, the case is vulnerable to the counterpart theorist's move of context shift. If we want to block that, we must insist on a fixed context, but that is not entirely in the spirit of Lewis's CT. Therefore, the case is strong only if we fix the counterpart relation for the entire statement.
