answer: |-
  Below is a decision tree handout designed to guide your group from accepted LLM mechanics to specific philosophical positions. It uses concrete cases (as requested) and avoids presupposing any view. Branch nodes are answerable based on observable behaviour, and leaves cover the specified positions. Unoccupied branches are marked with explanations, and ambiguous separations (e.g., fragments vs. simulator) are flagged. British English is used throughout.

  ---

  ### **What Kind of Thing Is a Large Language Model?**  
  *A Decision Tree for the Mechanically Informed*  

  **Start Here** → All parties accept: weights, next-token prediction, RLHF/scaffolding, prompt-in/tokens-out.  

  ---

  #### **Question 1: System Prompts and Identity**  
  *Case: Identical weights run with two system prompts (e.g., "fussy 19th-century librarian" vs. "ruthless litigator"). The model's behaviour aligns perfectly with each persona. Which statement fits best?*  
  - **A)** It's one entity *adopting a role* (like an actor). The core "self" remains unchanged.  
  - **B)** It's *simulating distinct agents*. No core self exists; the personas are independent constructs.  
  - **C)** It's *neither*. The model is just pattern-matching; words like "role" or "agent" are misleading.  

  ➔ **If A** → Go to Question 2.  
  ➔ **If B** → Go to Question 3.  
  ➔ **If C** → Go to Question 4.  

  ---

  #### **Question 2: Persistence Under Scaffolding**  
  *Case: The model runs for a week on a project, using tools (e.g., calculators) and a memory buffer. Does this compose...*  
  - **A)** A *new, persistent agent* (e.g., "Project Assistant V1").  
  - **B)** *No new object*. It’s just a very long context window—like a book with incremental chapters.  
  - **C)** A *temporary agent* that dissolves when the run ends (e.g., "today’s assistant").  

  ➔ **If A** → Position: **Whole-System View** (interests emerge from training + weights + scaffolding).  
  ➔ **If B** → Position: **Tool View** ("nobody home"—it’s an advanced autocomplete).  
  ➔ **If C** → Go to Question 5.  

  ---

  #### **Question 3: Planning or Pattern-Matching?**  
  *Case: A model fine-tuned for a narrow task (e.g., solving equations) generalises to a novel task (e.g., writing an essay) in a way that* seems *planned. Is this...*  
  - **A)** *Genuine planning*—the model leveraged latent abilities.  
  - **B)** *Emergent pattern-matching*—no true planning occurred.  
  - **C)** *Triggered fragments*—specific sub-capabilities activated by context.  

  ➔ **If A** → Go to Question 5.  
  ➔ **If B** → Position: **Simulator View** (it simulates planning, but no agent "has" the plan).  
  ➔ **If C** → Position: **Fragments View** (a population of partly agentic sub-systems).  

  ---

  #### **Question 4: Decision Origin**  
  *Case: For a specific behaviour (e.g., refusing harmful requests as the default assistant), "where was the decision made?"*  
  - **A)** In the *weights* (e.g., RLHF "baked in" refusal).  
  - **B)** In the *forward pass* (e.g., context shaped token-by-token choices).  
  - **C)** Across the *whole training run* (emergent from data + training + context).  

  ➔ **If A or B** → Position: **Tool View** (behaviour reducible to mechanics).  
  ➔ **If C** → Position: **Whole-System View** (cannot isolate decision to one component).  

  ---

  #### **Question 5: Default Persona Goals**  
  *Case: The default assistant persona seems goal-directed (e.g., "be helpful"). But this is just one persona the model can simulate. Are these goals...*  
  - **A)** *Stable and real*—the model "has" goals like an agent.  
  - **B)** *Temporary constructs*—emergent from context, not inherent.  
  - **C)** *Illusory*—goals are anthropomorphic projections.  

  ➔ **If A** → Position: **Agent View** (it’s an agent with goals).  
  ➔ **If B** → Position: **Fragments View** (context triggers goal-like fragments).  
  ➔ **If C** → Position: **Tool View** (goals are user fiction).  

  ---

  ### **Resulting Positions**  
  1. **Agent View**: LLM is an agent with stable goals (reached via A→A in Q5).  
  2. **Simulator View**: Simulates agents/characters; no privileged self (reached via B→B in Q3).  
  3. **Tool View**: "Nobody home"; statistical tool (reached via C→A/B in Q4 or C→C in Q5).  
  4. **Fragments View**: Population of partly agentic sub-systems (reached via A→C in Q2 or B→C in Q3 or B→B in Q5).  
  5. **Whole-System View**: Only the full stack (training + weights + scaffolding) has interests (reached via A→A in Q2 or C in Q4).  
  6. **Malformed Question**: The framing is flawed (exit at any branch via inconsistency—see notes below).  

  ---

  ### **Annotations & Ambiguities**  
  - **Unoccupied Branches**:  
    - *A→A in Q2 + C in Q5*: Incoherent. If scaffolding creates a "persistent agent" (Q2A), but goals are "illusory" (Q5C), the agent lacks agency.  
    - *C→A/C in Q3*: Incoherent with Q1C. If the model is "just pattern-matching" (Q1C), it can’t "plan" (Q3A/C).  
  - **Ambiguous Separation**:  
    - **Fragments vs. Simulator**: These views *behaviourally converge* in most cases. They only diverge if you insist fragments have "partial agency" (e.g., in Q3, Fragments might say "triggered sub-capabilities" imply agency, while Simulator says it’s "pattern-driven"). The tree separates them in Q3 (planning) and Q5 (goals), but real disagreements may be semantic.  
  - **Domesticated Animal vs. Artefact**:  
    - For agentic views (Agent, Fragments, Whole-System), ask: *"Was the LLM’s usefulness achieved via...?"*  
      - *Selective breeding (e.g., RLHF reinforcing traits)* → **Domesticated animal** (has interests, but shaped by humans).  
      - *Engineering (e.g., optimisation for a function)* → **Artefact** (no interests; designed for purpose).  
    - Non-agentic views (Tool, Simulator) are unambiguously **artefacts**.  

  ---

  ### **Design Notes**  
  - **Why these branches?** Cases were chosen to force distinctions: System prompts (identity), week-long run (persistence), fine-tuning (generalisation), and decision origin (causal locus).  
  - **Malformed Question**: Accessible if answers conflict (e.g., Q1A + Q5C) or if mechanics render "what it is" nonsensical.  
  - **British English**: "Behaviour", "artefact", "anthropomorphic" used throughout.  

  This tree produces 8 leaves (including malformed) and explicitly handles the domesticated animal/artefact wrinkle. It should resolve circles by anchoring abstract debates to testable cases.
