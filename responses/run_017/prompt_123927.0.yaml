     - **Engagement**: Only indirectly. The defender should dismiss it as not essential.

  5. **Conditionally convergent series**: 
     - **Strength**: We dismissed it because the series is absolutely convergent for any increasing concave utility. So no threat.

  IV. Framing questions

  1. **Exposure of expected-utility theory (EUT)**: Some of the defeaters (like the non-monetary variant) might be seen as challenges to EUT in general. For example, if we reject bounded utility, then EUT has to deal with infinite expectations. But the position is that EUT with bounded utility is the correct normative theory. So the view does inherit the risks of EUT. But the defender can say that the St. Petersburg paradox is not an independent problem but rather a symptom of using linear utility. The real issue is the justification for bounded utility. The literature on this (e.g., the von Neumann-Morgenstern theorem does not require boundedness, but the problem of infinite expectations has led many to require boundedness) is extensive. The position is exposed to the general debate about bounded utility.

  2. **Qualified into unfalsifiability?**: The position is that the paradox is dissolved by any concave bounded utility function. This is a class of functions. The view does not predict a specific certainty equivalent. So it is not easily falsifiable by a single observation. But it does make some general predictions (like saturation with cap and insensitivity to scaling at high levels). Also, it excludes the possibility of infinite certainty equivalents. So it is falsifiable in principle (if we observe a pattern that cannot be fit by any concave bounded utility). But it is flexible. This is not a defect per se because the view is a framework. However, it does mean that the view is not as sharp as we might like.

  V. Conclusion

  The position is exposed mainly by the non-monetary variant and the cap sensitivity issue. The defender must confront the implications of bounded utility for huge payoffs (like astronomical numbers of lives saved). This is the strongest defeater. The scaling test and cap test are risky predictions that might fail empirically (or normatively) but can be managed by adjusting the utility function (within the class). The fit of log is not critical. The conditionally convergent series is not a problem.

  Honest verdict: The position is defensible but not without cost. The defender must accept bounded utility and its controversial implications in population ethics and for huge stakes. This is a live issue in the literature. The position has been qualified to the point that it is not easily falsifiable by a single experiment, but it is not vacuous because it makes broad predictions and excludes the possibility of infinite certainty equivalents. It is a coherent normative stance, but it competes with others (like rank-dependent utility or prospect theory) that might explain the same phenomena without bounded utility.
