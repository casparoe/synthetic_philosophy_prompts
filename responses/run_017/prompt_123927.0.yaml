          sum_{j=0}^infty j * (1/2)^j = (1/2)/(1-1/2)^2 = (1/2)/(1/4) = 2.

       Thus, E[u] = (log(2)/2)*2 = log(2) ≈ 0.693.

       So it converges.

       What about a function that grows faster than any positive power of log but slower than any positive power? For example, u(x) = log(log(x)) for x>=2? But then for k large, the payoff is 2^{k-1} and u(2^{k-1}) = log((k-1)*log(2)) = log(k-1) + log(log(2)). Then:

          E[u] = sum_{k=1}^infty (1/2^k) * [log(k-1) + log(log(2))]   (but note for k=1, log(log(1)) undefined)

       So we must start at k=2. Then:

          E[u] = sum_{k=2}^infty (1/2^k) * [log(k-1) + log(log(2))]

       The constant term: log(log(2)) * sum_{k=2}^infty (1/2^k) = log(log(2)) * (1/4) (since the full geometric series from 0 is 1, so from 2 is 1/4).

       And the other term: sum_{k=2}^infty (1/2^k) * log(k-1) = (1/4) * sum_{j=1}^infty (1/2^j) * log(j)   (let j=k-1)

       The series sum_{j=1}^infty (1/2^j) * log(j) converges because log(j) grows slower than any positive power and the geometric series decays exponentially. So it converges.

       Therefore, it seems that for any concave utility function (that is increasing and unbounded) the series converges. So conditional convergence is not an issue. We don't get order dependence because all terms are positive. The series is absolutely convergent. Why? Because the terms are positive. So conditional convergence (with order dependence) cannot occur for positive series. Thus, this candidate defeater fails.

     - **Verdict**: This defeater is not viable. The expected utility series for the St. Petersburg lottery, under any increasing concave utility function (even unbounded), is absolutely convergent (because all terms are positive). Therefore, it does not pose a problem. We dismiss it.

  3. **Discriminating tests**:
     a. **Scale covariance**: If we scale the payoffs by 100 and observe that the certainty equivalent does not scale by 100 (but is much less), then logarithmic utility is falsified. But bounded utility would survive because it would predict compression. However, the position allows for bounded utility, so the defender can retreat to bounded utility. But the position also includes log utility as a candidate. So if the data show that log utility is wrong, then the defender must drop log and use a bounded function. But the core claim (that concave bounded utility dissolves the paradox) is not refuted. However, if the data show that even bounded utility fails (for example, if the certainty equivalent scales linearly with the payoffs even when the payoffs are huge, beyond the bound) then the boundedness would be refuted.

       - **Empirical note**: We don't have data for the St. Petersburg game with scaled payoffs. But we can imagine. If we set the payoffs to be 100, 200, 400, ... then log utility would predict:

            Original: CE ≈ 2 (for base case)
            Scaled: CE ≈ 200 (if utility is log, then the CE scales by 100 because the utility function is unique up to affine transformation? Actually, log(100x) = log(100)+log(x) = constant + log(x). But the certainty equivalent is defined by u(CE) = E[u(X)]. So:

