  ### **Ranked Defeaters: From Fatal to Awkward**

  #### **1. Non-Monetary Variant: Lives, Years, or Unbounded Intrinsic Goods**  
  **Description**: Run the St. Petersburg game with payoffs in a currency argued to have no diminishing marginal utility (e.g., healthy life-years saved, lives preserved, or abstract "utility units"). The fee is paid in the same currency (e.g., sacrificing lives to play). Diminishing marginal utility of money is inapplicable, and concave transformation seems ad hoc.  
  - **Why it engages your view**: Your dissolution relies on concavity to avoid infinite expectations. If the payoff is already in "utility" (or a good with linear intrinsic value), concavity must be imposed at the level of *total welfare*, implying:  
    - Option A: **Diminishing marginal value of total welfare** (e.g., the 10,000th life saved is less valuable than the 1st). This is a substantive claim about axiology (e.g., prioritarianism or nonlinear aggregation), not just risk attitudes.  
    - Option B: **Bounded utility**, forcing near-indifference between saving 1 billion vs. 1 quadrillion lives (or healthy years).  
    Both options conflict with standard welfarist intuitions. Option A imports moral philosophy; Option B is counterintuitive and may violate dominance reasoning.  
  - **Strength**: **Potentially fatal**. It directly challenges the *generality* of your dissolution. If value is unbounded and linear in such goods, the paradox reappears. This variant is live in philosophy (e.g., Bostrom 2011 on infinite ethics) and decision theory (e.g., Hájek 2014).  
  - **Verdict for you**: **Concede it counts against your view**. Your dissolution must either (1) invoke controversial normative claims beyond risk aversion or (2) accept that the paradox persists for goods where linear value is plausible. Dismissing this as "smuggling in rival value theory" is unpersuasive—your account already relies on a theory of value (concavity), and this tests its limits.  

  ---

  #### **2. Discriminating Test: Insensitivity to Caps and Scaling**  
  **Description**: Your view predicts:  
  - **(a) Cap insensitivity**: For a game capped at \(N\) tosses, expected monetary value \(\approx N/2\), but expected utility (e.g., log) saturates for modest \(N\). Thus, willingness-to-pay (WTP) should plateau as \(N\) grows.  
  - **(b) Scaling non-invariance**: Under log utility, scaling payoffs by \(k\) scales certainty equivalents by \(k\). Under bounded utility, WTP compresses toward the bound.  
  - **Empirical/mathematical risk**: If WTP rises linearly with \(N\) (e.g., subjects pay more for \(N=100\) than \(N=20\)) or scales flatly under high-stakes rescaling (e.g., 100x payoffs yield <100x WTP), log utility is falsified. Bounded utility survives (b) but not (a).  
  - **Why it engages your view**: It tests whether your dissolution makes falsifiable predictions or is unfalsifiable.  
  - **Strength**: **High risk if tested, but currently speculative**.  
    - If WTP scales linearly or grows with \(N\), your dissolution is empirically inadequate.  
    - If all patterns can be fitted by some concave function, your view is unfalsifiable—**a major normative weakness**. For example:  
      - Rising WTP with \(N\)? Use a less concave \(u\) (e.g., \(u(x) = \sqrt{x}\) instead of \(\log x\)).  
      - Flat scaling? Use a bounded \(u\).  
      - Linear scaling? Use \(u(x) = \log x\).  
    - **Unfalsifiability worry**: Concave functions are a flexible class. Boundedness adds a constraint, but bounds can be set arbitrarily high, and "saturation speed" is tunable (e.g., \(u(x) = x/(1+x)\) saturates slower than \(u(x) = 1 - e^{-x}\)).  
  - **Verdict for you**: **Concede it as awkward, potentially damaging**. For (a), data suggest people *do* respond to large \(N\) (e.g., Raiﬀa 1968), but this is descriptive. Normatively, your view must bite the bullet: if \(N=1000\), the \(2^{999}\) payout has probability \(2^{-1000}\), and \(\log\) utility still recommends WTP ≈ $4. If this seems irrational (e.g., "we should pay more for a chance at astronomical stakes"), your dissolution loses intuitive support. For (b), no data exists, but normatively, bounded utility *must* predict compression—if not observed, your view is strained.  

