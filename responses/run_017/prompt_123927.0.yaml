  Below is a stress test of your position that the St. Petersburg paradox is not a genuine normative puzzle, as it dissolves under expected utility theory (EUT) with a concave (and bounded) utility function. I've organized the defeaters from **most severe** (potentially fatal) to **least severe** (merely awkward), with explicit verdicts on whether they count against your view or fail to engage it. I flag which are live in current debates and which are speculative. Your core claim is: *The paradox vanishes under concave utility, and alternative explanations (finite bankrolls, probability neglect, etc.) are irrelevant to normativity.*

