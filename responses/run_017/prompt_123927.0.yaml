          The geometric series: first term a = (1/2^{0.9}) * 2^{-0.9} = 2^{-1.8}, and ratio r=2^{-0.9}. The sum = 2^{-1.8} / (1 - 2^{-0.9}) ≈ (0.287) / (1 - 0.535) ≈ 0.287/0.465 ≈ 0.617.

          Then CE = (0.617)^(10) ≈ 0.008? That's too small. Wait, let me recast: we have E[u]=0.617 and u(CE)=0.617. Since u(x)=x^{0.1}, then CE = (0.617)^10 ≈ 0.008. This is less than 1. So not in the ballpark.

       So not every concave function gives a certainty equivalent around 2. But many do. The log and sqrt functions do. The defender might say that the true utility function is in the class that yields a small finite value, and log is just one example. The fact that log fits the data is not necessary for the dissolution.

