            E[u]_{capped} = sum_{k=1}^N (1/2^k) * log(2^{k-1}) + (1/2^N) * log(2^{N})   [if we cap at N, then after N tails we get the N-th payoff? Actually, in the capped version, the game stops at N tosses even if it hasn't hit heads? Typically, we cap the number of tosses: if the first N-1 are tails and the N-th is heads, then you get 2^{N-1}. If all N are tails? Then we need to specify. Usually, the capped version has no more than N tosses and if the first N-1 are tails then the N-th toss: if heads you get 2^{N-1}, if tails you get 2^N? Or sometimes you get 0? Let's follow the standard: the game is stopped after N tosses, and if no heads has occurred, you get 0. Then:

