     - **Verdict**: The view is not completely unfalsifiable because the boundedness and concavity assumptions lead to specific patterns (like saturation with cap and compression with scaling). But it is flexible. The defender must accept that the class of utility functions is broad and that the theory does not pin down a unique number. But the core claim (that the expected utility is finite and the paradox dissolves) is maintained. This is a moderate defeater: it makes the view less specific and therefore less impressive, but it does not refute it.

  III. Ranking of defeaters (from fatal to awkward)

  1. **Non-monetary variant** (e.g., life years or lives saved): 
     - **Strength**: Potentially fatal. It challenges the generality of the dissolution by constructing a scenario where diminishing marginal utility is not plausible. The defender must either accept boundedness (with its counterintuitive implications for huge numbers) or admit the paradox remains for these cases.
     - **Engagement**: Directly engages the view because the view relies on diminishing marginal utility. This is a live issue in the literature (e.g., in discussions of utilitarianism and population ethics).
     - **Defender's response**: Concede that for goods without diminishing marginal utility, the paradox might reappear, but argue that such goods do not exist (everything has diminishing marginal value or is bounded). Or, accept boundedness and bite the bullet. Either way, the view is exposed.

  2. **Cap sensitivity in the non-monetary variant**: 
     - **Strength**: Strong. If we have a non-monetary good and we cap the game at N, then the expected monetary value of the good is about N/2. The view (with bounded utility) says the certainty equivalent should be bounded even as N increases. If we have the intuition that the certainty equivalent should grow with N (even for large N) then the view is counterintuitive. This is especially acute for the non-monetary case because we might feel that the chance of saving an astronomical number of lives should be worth more than a few lives, even if the probability is low.
