  3. **Scale covariance test (for log utility)**:
     - **Strength**: Moderate. If we scale the payoffs and observe linear scaling, then log utility is refuted. But the defender can switch to a bounded utility. However, if linear scaling is observed even for extremely high scales, that would refute boundedness and force a linear utility, bringing back the paradox. But we don't have such data.
