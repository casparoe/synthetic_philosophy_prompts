       However, there is a known result: if the utility function is unbounded and concave, it might still be that the St. Petersburg lottery has infinite expectation. But I recall that for the specific structure of the St. Petersburg lottery, with exponential growth and exponential decay of probabilities, any concave utility function (in fact, any function that grows slower than linear) will yield a finite expectation. 

       But wait: consider u(x) = log(x) (base e) for x>=1. Then:

          E[u] = sum_{k=1}^infty (1/2^k) * log(2^{k-1}) 
                = log(2) * sum_{k=1}^infty (k-1) * (1/2^k)
                = log(2) * [sum_{j=0}^infty j * (1/2)^{j+1}]   (let j=k-1)
