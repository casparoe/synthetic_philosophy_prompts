  We are stress-testing the view that the St. Petersburg paradox is not a genuine normative puzzle because it disappears when we use a concave (and bounded) utility function. We'll consider several angles: the fit of the logarithmic utility, discriminating tests, a variant with non-monetary payoffs, conditionally convergent expected utility series, and framing questions.

  I. Brainstorming candidate defeaters

  A. Fit of the logarithmic utility function
    1. The certainty equivalent of about 2 units (for the base case) might be a coincidence.
    2. Many concave functions (not just log) can yield a small finite certainty equivalent, so the success might be overattributed to log.
    3. The specific value of 2 might be an artifact of the base of the logarithm and the scale of payoffs.

  B. Discriminating tests
    1. Scale covariance: If we multiply all payoffs by 100, log utility predicts the certainty equivalent multiplies by 100. Bounded utility would predict compression. If empirical data show flatness (or less than proportional increase) then log is in trouble but bounded utility might survive.
    2. Cap sensitivity: For a game capped at N tosses, expected monetary value grows linearly with N (about N/2) but expected utility under log (or bounded) saturates quickly. The view predicts that willingness-to-pay (WTP) should be nearly constant for large N. If WTP continues to rise substantially with N, that would challenge the view.

  C. Non-monetary variant (e.g., healthy life years or lives saved)
    1. If we value healthy life years without diminishing marginal utility (at least over the relevant range), then the expected utility might be infinite and the paradox reappears.
    2. The defender must then either:
        a. Claim that even for such goods, there is diminishing marginal value (e.g., the first year of life is more valuable than the 1000th) or boundedness (e.g., there is a maximum value to any life or set of lives). But this might be a substantive and controversial claim in value theory.
        b. Or, if they accept unbounded linear utility for life years, then the expected utility diverges and the paradox returns.

  D. Conditionally convergent expected utility series
    1. If we use a utility function that is not bounded and not concave enough (like linear) then the expected utility diverges to infinity. But even with some concave functions, the series might be conditionally convergent (i.e., the sum depends on the order of terms). This would mean that expected utility is undefined, which is worse than infinite. This would challenge the idea that diminishing marginal utility alone resolves the paradox.

  E. Framing questions
    1. How much of the challenge is to expected utility theory (EUT) in general?
    2. Is the view unfalsifiable because we can always choose a utility function to fit the data?

  F. Other possible defeaters
    1. The utility function must be bounded to avoid infinite expectations for some gambles (this is a well-known result in decision theory, e.g., from Bernoulli to Samuelson). But the position already accepts bounded utility. However, the boundedness might be challenged on normative grounds (e.g., should we really be nearly indifferent between saving a billion lives and a trillion?).
    2. The psychological stories (like neglect of small probabilities) might be the true explanation, and the utility function explanation might be post-hoc. But the position dismisses these as not normative.
    3. The position might be circular: we assume EUT with concave utility to avoid the paradox, but that's the theory we are trying to defend.

  II. Filtering, sorting, and ranking the defeaters

  We'll rank from most fatal to least.

  1. **The non-monetary variant (if successful)**: This seems the most potent because it directly challenges the applicability of diminishing marginal utility. If we have a good that we have independent reason to value linearly (or at least without diminishing returns over the relevant range) then the paradox reappears. The defender must either bite the bullet on boundedness (which leads to near-indifference for huge numbers) or accept that the paradox remains for such goods. This is a normative challenge because it suggests that the dissolution is not general and that for some goods we face a genuine puzzle.

     - **Response**: The defender might argue that even for life years or lives, there is diminishing marginal value. For example, the first year of healthy life is more valuable than the 1000th because of the natural lifespan. Similarly, saving one life is very valuable, but saving a billion lives is not a billion times as valuable (due to aggregation issues, or because we value the prevention of extinction more than the total number). However, this is a substantive commitment in value theory. Alternatively, the defender might accept bounded utility and bite the bullet on near-indifference for huge numbers, arguing that this is actually rational (e.g., because we cannot comprehend such numbers).

     - **Verdict**: This is a strong defeater. It is engaging the view because the view claims that the paradox is not genuine because of diminishing marginal utility. If we can construct a case where diminishing marginal utility does not apply (or is not justified) then the paradox should reappear. The defender must either concede that for such goods the paradox remains (which weakens the generality of the dissolution) or accept controversial claims in value theory.

  2. **Conditionally convergent expected utility series**: If we can find a utility function that is concave but unbounded and such that the St. Petersburg series is conditionally convergent (so that the expected utility is undefined), then the dissolution fails because the expected utility is not even defined. This would show that diminishing marginal utility is not sufficient to avoid the paradox.

     - **Example**: Consider the utility function u(x) = x/(1+x) which is concave and bounded (between 0 and 1). This avoids the problem. But what if we use an unbounded concave function? For example, u(x) = sqrt(x). Then the expected utility is sum_{k=1}^infty (1/2^k) * sqrt(2^{k-1}) = sum_{k=1}^infty (1/2^k) * 2^{(k-1)/2} = (1/sqrt(2)) * sum_{k=1}^infty (1/sqrt(2))^{k-1}. This is a geometric series with ratio 1/sqrt(2) and converges to a finite value. Similarly, for u(x)=log(x) we have convergence. 

       However, for some unbounded concave functions, the series might diverge. For example, consider u(x) = x^{1/3}. Then:

          E[u] = sum_{k=1}^infty (1/2^k) * (2^{k-1})^{1/3} = sum_{k=1}^infty (1/2^k) * 2^{(k-1)/3} 
                = (1/2) * 2^{-1/3} * sum_{k=1}^infty (2^{1/3}/2)^k 
                = (1/2) * 2^{-1/3} * sum_{k=1}^infty (2^{-2/3})^k

       The ratio is 2^{-2/3} ≈ 0.63, so the series converges. 

       In fact, for any u(x) = x^p (with 0<p<1) the series converges because the growth is polynomial. For u(x)=log(x) we have convergence because the log grows slower than any positive power.

       But can we have a concave utility function that is unbounded and for which the series diverges? It turns out that if the utility function grows too fast (but still concave) it might diverge. However, concavity requires that the function grows slower than linearly. The key is the growth rate. If the utility function is such that u(2x) < 2u(x) (by concavity) and the payoffs double with each step, we have:

          u(2^k) * (1/2^k) 

