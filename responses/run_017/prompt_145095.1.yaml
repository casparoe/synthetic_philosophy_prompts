prompt: |-
  Writing up a chapter on bounded rationality at the moment (third year, philosophy, mostly on Simon and the optimal stopping literature) and I've realsied I've got a pile of verdicts about when satisficing is in good standing and when it isn't, and I have no idea what principle they add up to. My supervisor says it's all just expected-utility reasoning once you price in the cost of deliberation, and I think that's too quick, but I can't say why. So — cases first.

  1. Flat hunting. Four viewings across a weekend, had to be out of my old place by the Monday, took the fourth, it cleared everything I actually cared about. Fine. Anyone who says I should have seen forty is being silly.

  2. Same person, same four viewings, same flat — except no deadline, a quiet market, another fortnight available, and each viewing costs me an evening. I stop at four anyway. Not fine. Feels lazy rather than reasonable. Note this is the same stopping behaviour as case 1, so if 1 is fine and 2 isn't, the difference has to be in the situation, not in what I did.

  3. Two viewings, each of which cost me a day's pay in travel and lost work, stopped at the second. Fine.

  4. Two weeks of failing, and I moved my own bar down: dropped the balcony requirement, accepted 35 minutes instead of 20. Fine. I don't think that's self-deception — my bar was just wrong about what the market contains, and the evidence corrected it.

  5. My friend does the reverse: finds a place above her bar on day two, then raises the bar, because now she knows places like that exist. I want to say that's not fine. But by symmetry with 4 it should be fine, and I can't say what breaks the symmetry — I can't appeal to the searching she's already done, that's sunk.

  6. Groceries. I satisfice on basically every item, every week, indefinitely. Fine, obviously fine.

  7. Twelve sub-decisions on a conference I helped organise — venue, catering, dates, invite list, and so on. Satisficed on each one separately. The result is a conference I would have rejected flat if I'd been shown it as a package. Not fine. But this is the same pattern as 6, and I want to keep 6. My only story is that I set the bar on the wrong unit — per item rather than on the whole thing — but that feels like a get-out: satisficing survives every failure by saying you picked the wrong unit, and then it's unfalsifiable.

  8. My GP, choosing between two treatments for something of mine that isn't urgent, stops at the first one that clears the guideline threshold instead of reading up. Fine. That's what guidelines are for.

  9. My insurer's algorithm does the same thing at the same threshold, and honestly it's better calibrated than he is — it stops at a point that tracks the marginal costs of finding out more better than my GP does. Not fine. Though I don't want to say it's irrational exactly; I want to say it's illegitimate, or that they're someone else's reasons. But if rationality is a matter of the shape of the stopping behaviour relative to the costs, 8 and 9 are the same case, and I've smuggled in something about authority.

  10. A seller who knows I satisfice shows me the just-above-bar option first. I take it. The better one was one click away. I don't want to call that irrational — I want to say I was had. Now run it as a sequence: twenty small 'upgrades', each of which I accept, leaving me worse off than I started. That one I do want to call irrational. Same mechanism, same stopping behaviour, opposite verdicts.

  11. Coffee in a new city. I went back to the first place that cleared my bar every morning for a fortnight instead of trying the others. Mistake — but not the same mistake as case 2. In 11 the thing I gave up was information, because I'd be choosing again tomorrow. So is that exploration-versus-exploitation rather than satisficing? But then why doesn't the same point apply to the flat, where I'll also be choosing again in a few years?

  12. The one I keep going back and forth on. A learned policy that stops searching when some opaque internal signal fires — no represented threshold, nothing you could point to as its bar, no articulable reason for stopping where it does — but its stopping behaviour is well calibrated to the actual costs and benefits of further search, better calibrated than mine. I want to call that satisficing, in good standing. A human who stops looking because they've had enough, with no articulable reason either, whose stopping happens to be equally well calibrated: I want to call that exhaustion, or weakness of will, not satisficing. What's the difference, apart from one of them being software? And if there's no difference, which of my verdicts goes?

  13. One more, at the meta-level: I spent about ninety seconds deciding what my bar was, then stopped, on the grounds that fine-tuning the bar was worth less than just getting on with it. I think that's fine too. I'm not sure any principle of the shape I've got can permit it.

  My current stab, which I don't much like: satisficing is in good standing when (a) the bar is set on the thing you actually have reason to care about, and (b) you stop at roughly the point where the marginal cost of continuing equals the marginal expected gain. That gets 1, 3, 4, 6, 8; it kills 2; and I think it gets 11 and 13 once you count the value of information and the cost of setting the bar as part of the marginal calculation. But it says nothing that distinguishes 8 from 9, it looks like it permits 5 (which I want to rule out), and on 7 it just tells me I picked the wrong unit, which I've said is too easy.

  So: is there a principle that gets these, or nearly all of them? I'd like it stated precisely, with the case that motivates each clause, and — importantly — a prediction about at least one case I haven't listed, ideally the case where your principle and my gut come apart most. Tell me honestly which of my verdicts I'd have to drop to get a clean principle, and which verdict it would be cheapest to drop. And settle this if you can: is my supervisor right that this is all just optimisation once deliberation is priced in, or is there something in the pattern above — 8 and 9 especially, and 12 — that a pure cost-benefit story can't recover?
reasoning: |-
  Hmm, the user is working on a chapter about bounded rationality in philosophy, focusing on Herbert Simon and optimal stopping. They have a collection of cases where satisficing seems either reasonable or unreasonable, but they can't find an underlying principle. Their supervisor thinks it's all reducible to expected utility when including deliberation costs, but the user suspects there's more to it.

  Looking at the cases:

  1. Flat hunting with deadline: Satisficing fine (time pressure)

  2. Flat hunting without deadline: Satisficing not fine (no justification)

  3. High-cost viewings: Satisficing fine (high marginal cost)

  4. Lowering aspiration level: Fine (adaptive)

  5. Raising aspiration level: Not fine (problematic)

  6. Grocery shopping: Fine (repeated, low stakes)

  7. Conference planning: Not fine (unit selection error)

  8. GP using guidelines: Fine (deference)

  9. Insurer algorithm: Not fine (authority issue)

  10. Seller exploiting satisficing: Mixed feelings

  11. Coffee exploration: Mistake (ignored future value)

  12. Calibrated stopping: Depends on implementation

  13. Meta-satisficing: Fine

  Their current principle (expected utility with marginal costs) handles many cases but fails on 5, 7, 8/9, and 10. The user needs a unified framework that explains these asymmetries.

  Key tensions:

  - Why is lowering aspirations (4) okay but raising them (5) not? The "sunk search" intuition conflicts with standard rationality.

  - Why the moral difference between GP (8) and insurer (9) when behavior is identical?

  - Why does unit selection matter in conference planning (7) but not groceries (6)?

  - Why exploitability in seller case (10) sometimes feels like being "had" and sometimes like irrationality?

  I propose a framework with three elements:

  1. **Resource sensitivity** (expected utility with costs): Explains time pressure (1 vs 2), high costs (3), information value (11), meta-satisficing (13)

  2. **Aspiration coherence** (temporal consistency): Forbids raising aspirations (5) without new information, allows lowering (4). Distinguishes adaptive from capricious adjustment.

  3. **Normative anchoring** (source of standards): Distinguishes legitimate (GP guidelines) from illegitimate (insurer algorithms) thresholds based on authority/alignment. Resolves 8 vs 9 and part of 10.

  For case 7 (conference), this framework attributes failure to unit selection error under resource sensitivity - but notes that aspiration coherence is maintained per sub-decision, creating local vs global inconsistency.

  For the prediction challenge: Consider a case where someone raises aspirations after receiving new external information (e.g., learning about better flats from a friend). The framework would approve this (unlike case 5), creating tension with the user's initial rejection of aspiration-raising. This forces refinement: perhaps the issue in 5 isn't raising per se, but doing so without cost-justified search.

  Cost-benefit optimization alone fails to capture:

  - The normativity in aspiration-setting (why lowering is rational defeat but raising feels like goalpost-moving)

  - The authority dimension in 8/9 (identical cost-benefit but different legitimacy)

  - The "unit of agency" problem in 7 and 10

  The user might need to relax verdicts on 5 (aspiration-raising with justification could be rational) and 12 (calibrated stopping without articulation is satisficing regardless of implementation).
answer: |-
  I've wrestled with your cases and verdicts, and I think there's a coherent principle here—but it's not *just* expected-utility optimization with deliberation costs priced in. Your supervisor is partly right: many cases reduce to expected utility (EU) with search costs, but EU alone can't explain the normativity, authority, and coherence issues in your examples (especially 5, 7, 8/9, 10, and 12). Instead, I propose a three-part principle that incorporates EU but adds constraints from **aspiration coherence** and **normative anchoring**. I'll state it precisely, then walk through your cases, show where it fits (and where it doesn't), and end with a new case prediction and thoughts on what to drop.

  ### The Principle
  **Satisficing is in good standing iff:**  
  1. **Resource Sensitivity:** The stopping rule is calibrated to the marginal costs and benefits of further search, including deliberation costs, opportunity costs, and (for repeated decisions) the value of information.  
     *Motivated by:* Cases 1 vs. 2 (deadline/no deadline), 3 (high costs), 11 (information value), 13 (meta-deliberation costs).  
  2. **Aspiration Coherence:** The aspiration level (the "bar") is set and adjusted in a way that is temporally consistent with the agent's goals and evidence. Specifically:  
     - Lowering the bar is permitted when evidence shows the initial aspiration was infeasible.  
     - Raising the bar is permitted only if justified by new, cost-effective information about the option space.  
     *Motivated by:* Cases 4 (lowering OK), 5 (raising not OK without new info), 7 (incoherence across sub-decisions).  
  3. **Normative Anchoring:** The aspiration level must be grounded in a normatively appropriate source for the agent's context. This includes:  
     - Deference to legitimate expertise (e.g., guidelines) when the agent lacks competence or authority.  
     - Alignment with the agent's actual reasons for action, not external manipulation.  
     *Motivated by:* Cases 8 vs. 9 (GP vs. insurer), 10 (exploitation), and 12 (calibrated stopping's legitimacy).

  This framework is still EU-*based* (resource sensitivity is pure EU with costs), but aspiration coherence and normative anchoring add non-instrumental constraints. They reflect that satisficing isn't just about *when* you stop, but *why* your bar is set where it is and *who* gets to set it—issues EU can't fully capture because it's indifferent to the source of preferences or standards.

  ### Applying the Principle to Your Cases
  I'll go case by case, showing how the principle delivers your verdicts (or not), with emphasis on where EU alone fails.

  - **Case 1 (Flat hunting, deadline):**  
    **✓ Good standing.** *Resource sensitivity* explains it: high marginal cost of missing the deadline justifies stopping early. EU works here.  
  - **Case 2 (Flat hunting, no deadline):**  
    **✗ Not good standing.** *Resource sensitivity* violated: marginal cost of another evening is low, and expected gain from more search is high in a quiet market. EU handles this.  
  - **Case 3 (High-cost viewings):**  
    **✓ Good standing.** *Resource sensitivity*: high cost per viewing (lost pay) justifies stopping early. EU works.  
  - **Case 4 (Lowering the bar):**  
    **✓ Good standing.** *Aspiration coherence*: lowering is permitted because evidence (failing for two weeks) corrected your initial bar. EU *could* handle this if framed as updating beliefs, but coherence adds that the adjustment is rational only if goal-consistent (you still want a flat, just with revised expectations).  
  - **Case 5 (Raising the bar):**  
    **✗ Not good standing.** *Aspiration coherence* violated: raising the bar isn't justified by new information about the *option space* (e.g., learning about better flats), but by a shift in goals mid-search. Your sunk costs don't matter, but the *reason* for raising does—it makes the search dynamically incoherent. EU fails here because it treats preferences as given; coherence explains why this feels capricious.  
  - **Case 6 (Groceries):**  
    **✓ Good standing.** *Resource sensitivity*: low stakes, repeated decisions, and high deliberation costs per item justify satisficing indefinitely. EU works.  
  - **Case 7 (Conference sub-decisions):**  
    **✗ Not good standing.** *Aspiration coherence* violated: satisficing on sub-units (venue, catering) led to global incoherence because the aspiration level wasn't aligned with your actual goal (a good overall conference). *Resource sensitivity* might say you picked the wrong unit, but coherence makes this substantive: it's not just a "get-out," it's a failure to set aspirations at the right *level of agency* for your goals.  
  - **Case 8 (GP using guidelines):**  
    **✓ Good standing.** *Normative anchoring*: the GP defers to legitimate guidelines, anchoring the aspiration level in expertise. EU misses this—if the GP's stopping rule is cost-optimal, why is it different from the insurer?  
  - **Case 9 (Insurer algorithm):**  
    **✗ Not good standing.** *Normative anchoring* violated: the algorithm's stopping rule is well-calibrated (resource sensitivity satisfied), but it's not anchored in a normatively appropriate source for *your* care (it's the insurer's cost-saving reasons, not medical ones). This is where EU fails hardest—it can't distinguish between "rational" stopping and *whose rationality* it serves.  
  - **Case 10 (Seller exploitation):**  
    - **First part (one click away):** **✓ Satisficing fine, but exploited.** *Resource sensitivity* might justify stopping (low marginal cost of one click?), but *normative anchoring* flags manipulation: your bar was set by *your* reasons, but the seller hacked the context.  
    - **Second part (twenty upgrades):** **✗ Not good standing.** *Aspiration coherence* violated: your aspiration level drifted incoherently across steps due to manipulation, divorcing it from your original goals. EU treats each step as locally optimal but misses global irrationality.  
  - **Case 11 (Coffee exploration):**  
    **✗ Not good standing (mistake).** *Resource sensitivity* violated: you ignored the value of information (exploration) for future decisions, which has high marginal benefit in a new city. EU handles this with exploration-exploitation, but note—it doesn't apply to your flat hunt because housing is infrequent (low repetition), lowering information value.  
  - **Case 12 (Calibrated stopping):**  
    - **Software:** **✓ Good standing.** *Resource sensitivity* and *normative anchoring* satisfied: the rule is well-calibrated and "legitimate" as a designed tool (its "reasons" are embedded in its calibration).  
    - **Human:** **✗ Not good standing.** *Normative anchoring* violated: without articulable reasons, it's not anchored in the agent's rationality (feels like exhaustion); coherence may also be suspect (did goals shift?). EU can't distinguish—both have identical behavior—but anchoring explains why the human case feels like weakness of will: it lacks reflective endorsement.  
  - **Case 13 (Meta-satisficing):**  
    **✓ Good standing.** *Resource sensitivity*: marginal cost of fine-tuning the bar exceeds marginal gain, so stopping is optimal. EU handles this.

  ### Where the Principle Wins and What You Might Drop
  - **Wins:** The principle gets all your verdicts except Case 5 (raising the bar) and possibly Case 10 (first part). It resolves your tensions:  
    - 1 vs. 2: Resource sensitivity.  
    - 4 vs. 5: Aspiration coherence (lowering vs. raising asymmetry).  
    - 6 vs. 7: Aspiration coherence (global vs. local goals).  
    - 8 vs. 9: Normative anchoring (deference vs. alienation).  
    - 12: Normative anchoring distinguishes software (designed rationality) from human (unreflective).  
  - **Cheapest Verdict to Drop:** **Case 5 (raising the bar).** Your intuition that it's "not fine" is strong, but symmetry with Case 4 is broken by *temporal incoherence*, not sunk costs. However, if your friend raised the bar because of *new information* (e.g., she learned better flats exist via external data, not just seeing one), coherence could permit it. I'll test this in the prediction below. Dropping this verdict would simplify the principle but lose a key insight about goal stability.  
  - **Cost-Benefit Isn't Enough:** Your supervisor is too quick. EU with deliberation costs explains resource sensitivity (Cases 1-3,6,11,13) but fails on:  
    - **Aspiration adjustments (Cases 4-5,7):** EU treats aspirations as preferences, but coherence adds that they must be stable and evidence-responsive—e.g., in Case 5, raising the bar isn't "irrational" under EU if it maximizes utility, but it *is* incoherent if it ignores prior goals.  
    - **Authority/legitimacy (Cases 8-9,12):** EU can't distinguish between well-calibrated stopping for *your* reasons (GP) vs. *others'* reasons (insurer)—it's "rational" either way, but anchoring makes it normative.  
    - **Exploitation (Case 10):** EU sees the seller's hack as a change in environment, but anchoring calls it a violation of agency.

  ### Prediction: A Case Where the Principle and Your Gut Diverge
  **New Case: "The Informed Aspiration-Raiser"**  
  Your friend is flat-hunting with no deadline. On day one, she sees a "good enough" flat but doesn't take it. She then talks to a trusted local expert who provides data showing that 30% of flats in the area exceed her initial bar by a wide margin. She raises her aspiration level and eventually finds a much better flat.  

  - **Principle's Verdict:** **✓ Good standing.** *Aspiration coherence* is satisfied: raising the bar is justified by new, cost-effective information about the option space (not just seeing one flat). *Resource sensitivity* OK if search costs are low.  
  - **Predicted Gut Verdict:** You might still say "not fine" by analogy to Case 5—it feels like overreaching or goalpost-moving. But the principle forces a distinction: new *external evidence* legitimizes aspiration-raising, while Case 5 was driven by internal caprice. If your gut disagrees, it suggests your intuition about Case 5 is rooted in something else (e.g., a fairness or sunk-cost bias), and you might need to drop or refine that verdict.

  ### Final Thoughts
  Your cases reveal that satisficing isn't just a stopping rule—it's a practice embedded in goals, evidence, and social context. The principle I've proposed keeps EU at its core (resource sensitivity) but layers on coherence and anchoring to handle the "messy" normative elements. If you want a cleaner fit, drop your verdict on Case 5 (allow aspiration-raising with evidence) and treat Case 10's first part as rational-but-exploited (not a satisficing failure). But I think the depth of your examples justifies the extra complexity. Ultimately, your supervisor is wrong: satisficing can't be *reduced* to EU with deliberation costs, because it involves questions about where aspirations come from and whose interests they serve—issues that are as much philosophical as economic. Lean into that in your chapter. If you have refinements to these cases, I'm happy to iterate.
