  Important caveats: The parody must avoid strawmanning - it should reflect views actual researchers hold. And they want a post-parody "reality check" separating consensus from controversies in the field. Smart request - shows they care about intellectual honesty even in satire. 

  For the parody structure, I'm thinking: 
