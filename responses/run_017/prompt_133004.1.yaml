prompt: |-
  I spent about thirty-five years as an atmospheric chemist — a lot of it messing about with error propagation, instrument drift, and the question of when to stop believing your own numbers — and since retiring I've been sitting in on a philosophy reading group at the local university. We've been going through consequentialism recently, and I keep coming back to something from my own world that I think is a real, existing practice with an implicit theory buried inside it. I'd like help digging the theory out.

  The practice is the randomised controlled trial, as actually run. Four features of it:

  - You are only supposed to enrol patients when the expert community is genuinely uncertain which arm is better. If people already knew, running the trial wouldn't just be pointless, it would be unethical.
  - Given that uncertainty, you don't give people the arm with the best point estimate. You randomise.
  - The protocol pre-registers its primary endpoints at a fixed horizon — 90-day mortality, say — and the downstream stuff nobody can track (effects on the patients' families and careers, twenty-year health effects, the way the published result shifts prescribing habits for a decade) simply isn't counted. It's off the protocol, so it's off the books.
  - And the trial doesn't run to its planned end if a data monitoring committee sees one arm pulling clearly ahead. At some point uncertainty stops being decision-relevant and you stop flipping coins.

  So uncertainty is a precondition of the practice being permissible at all; under uncertainty the practice deliberately refuses to maximise; it has a threshold past which uncertainty stops mattering; and it cuts the causal chain off at the protocol horizon.

  That strikes me as interesting because everything else I've seen in the policy and charity world does the opposite: rank the options by best estimate, hand the money to whatever came out top, and treat anyone who suggested tossing a coin as having abandoned the job. Medicine tosses coins with people's actual treatment; a government or a foundation wouldn't dream of it.

  So here's what I want. Reconstruct the implicit theory of rational choice under uncertainty that this practice only makes sense under. In particular: does it presuppose that cluelessness about downstream effects is a reason to stop trying to maximise and hand the decision to a procedure instead? Does the early-stopping rule presuppose that there is a sharp point at which ignorance becomes decision-irrelevant — and if so, is that compatible with the standard worry that our long-run effects are not just unknown but in some sense unmanageable, with error bars that don't shrink? And what about the truncation: is the practice presupposing that untracked effects are genuinely worth zero, or just that they're unusable, and is there a difference that matters?

  Some things I'd specifically like you to deal with. First, my reading group's obvious objection: randomisation in trials is justified by the knowledge the trial produces, by the expected benefit to future patients, not by any view about what ignorance does to choice. If that's right the practice may presuppose much less than I think, and I'd like you to say how much less. Second, distinguish what the practice strictly presupposes from what it merely fits nicely with — I suspect several quite different theories would license it, and I want to know where it's genuinely underdetermined. Third, take the thing I've started calling the equipoise rule — when the spread of your outcome estimates across the live options is smaller than your uncertainty about the estimates themselves, don't maximise, defer to a chance procedure — and tell me what a consequentialist would actually have to change in day-to-day decision making if they adopted it for, say, long-termist or high-uncertainty giving. Would it collapse into maximising under some descriptions? Would it end up licensing things no one would accept?

  Please don't give me a reading list or point me at papers — I can't get at half of them and I'd rather you just reasoned it out.
reasoning: |-
  Okay, let me start by unpacking the user's query. They spent 35 years as an atmospheric chemist dealing with error propagation and instrument drift, and now they're in a philosophy reading group focusing on consequentialism. They've noticed a disconnect between how randomized controlled trials (RCTs) handle uncertainty in medicine versus how policymakers or charities do. Specifically, RCTs use equipoise, randomize when uncertain, pre-register endpoints, and stop early if one arm is clearly better. The user wants to know the implicit theory of rational choice behind this and how it might apply beyond medicine.

  First, I need to address their main points. The user is contrasting RCT practices with typical decision-making in policy/charity. The key elements are: equipoise as a precondition, randomization instead of maximizing, fixed endpoints ignoring downstream effects, and early stopping. They're asking whether cluelessness about downstream effects justifies using a procedure rather than maximizing. Also, they want to know if early stopping implies a sharp threshold where ignorance becomes irrelevant and how endpoint truncation works—whether untracked effects are valued at zero or just excluded pragmatically.

  The user’s reading group objects that RCT randomization is justified by future knowledge, not ignorance affecting choice. I need to counter this by showing that while generating knowledge is a goal, the permissibility of the trial relies on current uncertainty. Equipoise isn’t just about future benefits; it’s an ethical requirement based on present ignorance. Without it, the trial would be unethical. So the practice does presuppose that under genuine uncertainty, maximizing isn’t permissible, and a fair procedure is needed.

  Next, distinguishing strict presuppositions from nice fits. Strictly, RCTs require that when expert uncertainty exists, randomization is ethically necessary. It also assumes that pre-specified endpoints are sufficient for decision-making, even with unknown downstream effects. Early stopping implies that uncertainty reduction to a predefined threshold nullifies equipoise. However, the theory behind why endpoints are fixed or why that threshold is chosen isn’t specified. Different theories could justify this—maybe deontological (fairness) or consequentialist (long-term gains via knowledge). But the core is that uncertainty mandates a procedure over optimization.

  For the equipoise rule applied to other areas like long-termist giving. If consequentialists adopted it, they’d randomize options when estimates are uncertain. But how do you define "live options"? In medicine, it's well-defined treatments, but in policy, options might be vague. Also, uncertainty might be pervasive, making randomization frequent. But if one option has a slightly better estimate, does equipoise still hold? The rule might collapse into maximizing if uncertainty thresholds are too low. Plus, ignoring downstream effects could be problematic in policy where second-order effects matter more. Would randomizing between funding a health program vs. education seem irresponsible? That’s a tension.

  The user also asks about cluelessness. RCTs don’t assume downstream effects are zero; they’re excluded because they’re immeasurable. The practice is pragmatic, not ontological. But in other contexts, this truncation might ignore significant impacts. For early stopping, the threshold is sharp in RCTs due to pre-registered p-values, but in reality, uncertainty isn’t binary. However, for decision-making, a bright line is necessary to avoid indecision. This clashes with deep uncertainty where error bars don’t shrink, but RCTs avoid that by limiting scope.

  I need to ensure I’m addressing all parts: the implicit theory, objections, presuppositions vs. nice fits, equipoise rule application, and the specific questions about cluelessness, thresholds, and truncation. Also, avoiding academic references as requested, focusing on reasoning. The user’s background in error propagation suggests they appreciate practical constraints and uncertainty handling. Their interest is in whether RCT practices offer a model for decision-making under uncertainty outside medicine, especially where cluelessness is high.
answer: |-
  Here’s a reconstruction of the implicit theory of rational choice embedded in RCT practice, addressing your core questions and objections:

  ### Core Implicit Theory: **Procedural Fairness Under Epistemic Constraint**
  The practice presupposes that **when expert consensus acknowledges irreducible uncertainty about comparative outcomes between live options, maximizing based on point estimates is impermissible**—not merely suboptimal. Instead, fairness demands a procedure that symmetrically respects the interests of current participants. This procedural turn is licensed by four key principles:

  1.  **The Equipoise Threshold:** Genuine expert uncertainty (clinical equipoise) isn't just a *prerequisite* for knowledge generation; it's the *ethical justification* for randomizing current participants. It marks the point where maximizing becomes **arbitrary domination** (imposing one expert's contested guess on a patient) rather than rational choice.
  2.  **The Tyranny of the Point Estimate:** Under deep uncertainty, focusing on a single "best guess" outcome ignores the *spread* of plausible outcomes. Randomization isn't maximizing indifference; it's **hedging against the risk of catastrophic error** inherent in acting on fragile estimates. It minimizes the maximum regret for the current participant by not betting everything on one contested model.
  3.  **The Horizon of Accountability:** Pre-registered endpoints define a **zone of tractable causal responsibility**. Effects beyond this horizon are excluded not because they are *valued* at zero, but because they are **epistemically unmanageable** within the decision framework. Including them would paralyze action or render "maximizing" meaningless (due to exploding error bars). The practice presupposes that **action requires bounded responsibility**.
  4.  **The Collapse of Permissible Ignorance:** Early stopping rules operate on a **sharp epistemic threshold** (e.g., a p-value boundary). This presupposes that uncertainty is decision-relevant *only until it crosses a line of practical insignificance*. Beyond this point, persistent doubt becomes **residual noise**, not a reason to withhold the (now) discernibly better treatment. The threshold is conventional but *operationally necessary*.

  ### Addressing Your Specific Points

  1.  **The "Knowledge Justification" Objection:**
      *   **Strictly Presupposed:** Generating future knowledge is the *social justification* for running the trial at all. It answers "Why do this risky thing?".
      *   **Implicitly Presupposed for Randomization:** Knowledge generation *requires* methodological soundness (randomization). However, the *permissibility of randomizing the current patient* rests crucially on equipoise. If experts *knew* Arm A was better, randomizing Patient X to Arm B *would be unethical*, even if it generated perfect knowledge faster. Therefore, **current patient randomization is ethically licensed *only* by the state of uncertainty itself**, making it a direct response to ignorance, not just a means to future knowledge.

  2.  **Presuppositions vs. Nice Fits:**
      *   **Strict Presuppositions:**
          *   Genuine expert uncertainty mandates procedural fairness for current participants.
          *   Maximizing on contested point estimates is impermissible under such uncertainty.
          *   Action requires a defined scope of tractable causal assessment (the endpoint horizon).
          *   Uncertainty becomes decision-irrelevant once reduced below a defined operational threshold.
      *   **Nice Fits (Compatible but Not Required):**
          *   **Rule Consequentialism:** Following the RCT procedure *generally* leads to the best long-term outcomes (better treatments, fewer harmed by false certainty).
          *   **Contractualism/Procedural Fairness:** Randomization is what participants could reasonably agree to *ex ante* under acknowledged ignorance.
          *   **Epistemic Humility:** Acknowledging the limits of predictive models in complex systems.
          *   **Value Pluralism:** The fixed endpoint simplifies value aggregation to one (or few) dimensions deemed primary.
      *   **Underdetermined:** Why *this* horizon (90-day mortality)? Why *this* stopping threshold (p<0.01)? The *specific* choices are conventional and pragmatic, justified by consensus and feasibility, not deduced from first principles. Different theories (e.g., minimax regret vs. expected utility) might pick slightly different points, but the *need* for *some* horizon and *some* threshold is presupposed.

  3.  **The Equipoise Rule Applied Consequentially:**
      Adopting "Don't maximize when uncertainty > spread, defer to procedure" in high-uncertainty consequentialism (e.g., long-termist giving) would cause significant shifts:

      *   **Collapse into Maximizing?** Potentially, if "live options" are defined narrowly. If Option A has an estimated 1M utils ± 900K, Option B has 800K utils ± 800K, the spread (200K) is less than the uncertainty (±~850K avg?), triggering equipoise. Yet, if forced to act, many would still "maximize" on the point estimate (A). However, if Option A is 1M ± 1M, Option B is 10K ± 5K, the spread (990K) is less than the uncertainty (±~1M avg?), triggering equipoise – randomizing here feels very different. **It resists betting the farm on highly speculative options with massive error bars.**
      *   **Licensing the Unacceptable?** Yes, potentially:
          *   **Ignoring Tails:** It might randomize between a safe bet and a high-risk/high-reward option with a similar *expected value* but wildly different downside risks (e.g., funding bednets vs. speculative asteroid deflection, if EV estimates are close but uncertainties huge). The procedure ignores the *distribution* of uncertainty.
          *   **Defining "Live Options":** Who decides which options are "live"? Medicine has regulatory bodies. Would randomizing between funding malaria prevention and funding a cult leader's longevity serum be required if both had contested, similarly uncertain positive point estimates? The rule needs a robust gatekeeper for option inclusion.
          *   **Truncation Problem Amplified:** In long-termism, the "downstream effects" *are the point*. Truncating at a short horizon (e.g., 10 years) would be nonsensical. Defining a tractable long-term horizon is vastly harder than 90-day mortality.
      *   **Key Shift:** It would **systematically dampen the influence of speculative, high-variance estimates**. Decisions under deep cluelessness would often involve randomization or defaulting to lower-variance, more robust options, rather than chasing the highest point estimate shrouded in fog.

  ### Answering Your Foundational Questions

  *   **Cluelessness & Maximizing:** Yes, the practice presupposes that profound cluelessness (especially about downstream effects) **is a reason to abandon maximizing for the current decision and adopt a fair procedure**. Maximizing requires tractable models. Intractable cluelessness makes it incoherent or dangerous.
  *   **Sharp Threshold for Irrelevance:** Yes, early stopping presupposes a sharp (though conventional) threshold where remaining uncertainty becomes **practically irrelevant for *this* decision**. This *is* in tension with "deep uncertainty" where error bars don't shrink cleanly. RCTs manage this by:
      1.  **Bounding the Decision:** Focusing only on the primary endpoint within the horizon.
      2.  **Accepting Convention:** Using statistical standards (p-values) as bright lines for *actionability*, acknowledging they don't represent absolute truth.
      3.  **Prioritizing Current Participants:** Once the threshold is crossed, *not* giving the better treatment *now* becomes the greater ethical burden.
  *   **Truncation (Zero vs. Unusable):** The practice **presupposes untracked effects are *unusable* for this decision, not worthless.** It's a pragmatic admission of epistemic limitation, not a value judgment. The crucial difference: if you *could* reliably measure/estimate those effects, you *should* include them in a maximizing framework. The horizon defines the limit of usability *for this specific, bounded intervention decision*. This is why the "knowledge justification" exists – to eventually expand the horizon.

  ### In Essence
  The RCT practice embodies a theory where **rational action under profound uncertainty requires shifting from *outcome optimization* to *process legitimacy***. It prioritizes fairness and hedging for the current decision-maker/subject within a tightly scoped domain of responsibility, explicitly rejecting the maximization imperative when uncertainty is too great. It treats cluelessness as a boundary condition forcing proceduralism, sets pragmatic thresholds for actionability, and defines horizons of accountability to make decisions tractable. Applying this beyond medicine requires confronting harder questions about option definition, horizon setting, and the acceptability of randomizing when speculative high-stakes options are on the table. It wouldn't eliminate maximizing, but it would severely constrain it in the realm of the deeply unknown.
