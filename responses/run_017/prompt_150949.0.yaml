prompt: |-
  Construct me a dispositions case, but in the direction people always skip: an "antidote" — by which I mean an object that genuinely lacks disposition D, while the matching conditional (if it were stimulated with S, it would manifest M) comes out true anyway. Constraints: ordinary stuff, no demons or sci-fi materials, one paragraph; the conditional must not be true because the stimulus hands the object the basis for D (its not a mimic/reverse-fink, that's the boring version); and it must not be true by luck — whatever makes M happen has to be a standing feature of the setup that shows up in all the nearby S-worlds, not a coincidence; and the object has to really lack D, i.e. the categorical basis isn't there, so no cheating by quietly making it brittle/conductive/soluble after all. After the scenario, lay out D, S, M, the missing basis, and the nearby worlds; say what the simple conditional analysis and a basis-first view each conclude and why; point at the single feature doing the work; tell me what the case collapses into if you remove that feature (a coincidence case? a mimic? something else?); and give the strongest reply available to someone defending the conditional analysis. Its for a seminar session on whether the conditional analysis can be patched, so the verdicts have to fall out of the two views rather than be written into the story — and be honest if, on reflection, the case doesn't favour either one.
