answer: |-
  Here's the case, adhering to all constraints:

  An ordinary glass tumbler, heated uniformly in a kiln to just below its softening point (around 700°C), rests on an insulated pad. At this temperature, its internal structure is highly viscous and lacks the rigid atomic bonds characteristic of fragility at room temperature; it deforms plastically under slow pressure rather than fracturing elastically. However, if it were struck sharply with a metal rod, the intense local cooling caused by the rapid conduction of heat from the glass into the cold rod at the point of impact would generate severe thermal stress within the glass. This internal stress, exceeding the material's strength *at that instant*, would propagate cracks and cause the tumbler to shatter explosively. This thermal shock mechanism is inherent to the setup: any sufficiently rapid localized cooling event on the superheated glass surface, like a strike, reliably causes catastrophic fracture.

  *   **D:** Fragility (disposition to shatter when struck).
  *   **S:** Being struck sharply by a rigid object (e.g., a metal rod).
  *   **M:** Shattering.
  *   **Missing Basis:** The rigid, elastically bonded atomic structure characteristic of fragile glass at room temperature. At 700°C, the glass is viscous and plastically deformable.
  *   **Nearby Worlds:** Worlds where the glass is identically superheated, the striking object is similarly cold/conductive, and the strike is sufficiently sharp and localized (minor variations in force/direction don't prevent thermal shock).
  *   **Simple Conditional Analysis (SCA) Verdict:** The tumbler *has* disposition D (fragility). *Why?* SCA defines D solely by the truth of the conditional "If S, then M". In all relevant nearby S-worlds (strike occurs), M (shattering) occurs reliably due to thermal shock. So, the conditional is non-accidentally true.
  *   **Basis-First View Verdict:** The tumbler *lacks* disposition D (fragility). *Why?* Fragility requires a specific categorical basis: a rigid, elastically bonded microstructure susceptible to crack propagation under mechanical stress. This basis is absent; the glass is viscous and deforms plastically. The manifestation (shattering) occurs via a *different* mechanism (thermal stress from rapid cooling) triggered by S, not via the mechanism constitutive of fragility.
  *   **Feature Doing the Work:** The **superheated state of the glass combined with the cold striker**. The heat creates the abnormal (non-fragile) internal state, while the coldness of the striker provides the mechanism (localized rapid cooling/thermal stress) that *reliably causes M upon S* despite the lack of the standard basis for D.
  *   **Case if Feature Removed:** If the glass is *not* superheated (e.g., room temp), it *is* fragile (basis present), and S causes M via the standard mechanism – no issue. If the striker is *not* cold (e.g., preheated), striking the superheated glass would likely only cause deformation or slow cracking (no thermal shock), so M might not occur, making the conditional false or only true by luck/coincidence. The case collapses into either a standard fragility case or a scenario where the conditional is not reliably true.
  *   **Strongest Reply for SCA Defender:** "The conditional is true non-accidentally, so the object has the disposition. The thermal shock mechanism triggered by the strike *is* the manifestation of fragility *in this specific, unusual context*. Fragility isn't solely tied to one microstructural basis; it's defined by the reliable counterfactual connection between sharp impact and shattering, however that connection is physically realized in a given situation. The 'basis-first' view is smuggling in a specific, narrow *type* of microstructure as essential to fragility, but dispositions are functionally defined by the stimulus-manifestation link."

  **Verdict on Favouring Views:** This case genuinely creates tension. SCA gets the counterfactual right but arguably misattributes the disposition by ignoring the actual physical basis. The Basis-First view correctly identifies the lack of the standard basis but must explain why the reliable counterfactual link exists *without* the disposition. Neither escapes entirely unscathed. The case doesn't decisively favour one view; it highlights the core disagreement: is a disposition *nothing more* than a reliable S→M connection (SCA), or is it an intrinsic property grounded in a specific physical basis *that explains* that connection (Basis-First)? The "antidote" works precisely because it severs the usual link between the basis and the counterfactual, forcing this question.
