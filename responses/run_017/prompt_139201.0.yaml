answer: |-
  Here are ten tightly ordered questions designed to press the conceptual joints of her position, pre-empting stock replies and forcing substantive engagement. Each includes her likely reply and a targeted follow-up.

  ### Core Sequence
  1. **Question (Environment vs. Self-Deception):** When an agent mutes critics or curates a feed *because she suspects p might be true*, doesn’t this intention to avoid evidence make her subsequent ignorance straightforwardly *intentional* rather than *self-deceptive*? Where’s the deception if she’s fully aware she’s rigging her inputs?  
     *Likely Reply:* The deception occurs *after* curation: the curated environment generates "evidence" for ~p, which the deceived subsystem encounters *as if* it were unbiased input. The deceiving subsystem knows the setup, but the deceived one doesn’t.  
     **Follow-up:** If the deceived subsystem treats curated inputs as veridical, isn’t this just *gullibility* within a sub-system? What specifically makes this *self*-deception rather than a fragmented mind being duped *by itself*?  

  2. **Question (Phenomenology):** Reports of self-deception often include a "nagging sense" of avoidance or anxiety about the topic. If one subsystem is genuinely deceived, how does your account explain this phenomenology without smuggling in partial access to the hidden belief?  
     *Likely Reply:* The anxiety arises from "leakage" between subsystems or from the deceiving subsystem’s monitoring of environmental fragility (e.g., fear the mute might expire). It’s not access to p, but to the *precariousness* of ~p.  
     **Follow-up:** If the deceived subsystem has no access to p, why would *it* feel anxiety? And if the deceiving subsystem feels it, doesn’t that collapse the partition? Doesn’t this require a *meta-partition* to explain who experiences the anxiety?  

  3. **Question (Clinical Cases - Anosognosia):** In Anton’s syndrome (denial of blindness), there’s no evidence of intentional curation or subsystem division. Do you exclude this as non-self-deceptive, or does your account stretch to cover it?  
     *Likely Reply:* These are distinct neuropsychological deficits; self-deception requires *motivated* partitioning. I focus on cases with clear agential involvement.  
     **Follow-up:** If anosognosia involves no intention, what *empirical marker* definitively distinguishes it from "motivated" cases? If it’s just subjective report, doesn’t that risk making "self-deception" an unfalsifiable folk category?  

  4. **Question (Motive vs. Bias):** Once partitioning is outsourced, what distinguishes a *motive* (e.g., avoiding trauma) from a generic *bias* in evidence-gathering? Isn’t "motive" just a causal story about why the agent curated the environment, leaving no *constitutive* role in the deception itself?  
     *Likely Reply:* The motive explains *why* specific partitions/environments are created. Without it, we have bias or error, not *deception*.  
     **Follow-up:** If the motive only explains the *origin* of the curated environment, and the deceived subsystem operates independently once it’s set up, isn’t the ongoing state just *ignorance plus historical motive*? What makes the *current state* deceptive?  

  5. **Question (Predictive Processing Challenge):** Predictive processing (PP) models self-deception as overweighting priors (e.g., "I’m healthy") and underweighting sensory precision (e.g., symptoms). Doesn’t this explain the *gradient* from bias to delusion without partitions, and better handle non-intentional cases?  
     *Likely Reply:* PP explains *how* beliefs resist evidence but not the *agential structure*: only partitioning captures the intentional *project* of self-deception.  
     **Follow-up:** If PP can model the phenomenology (e.g., anxiety as prediction error) and the resistance without partitions, isn’t the "agential project" just a post-hoc description of the system’s dynamics? What can your view explain that PP *can’t*?  

  ### Deepening Pressure
  6. **Question (Ownership of Belief):** When the deceived subsystem believes ~p based on curated environmental inputs, what makes this *the agent’s belief* rather than a belief *induced in her* by an externalized partition?  
     *Likely Reply:* Both subsystems are hers; the environment is an extension of her cognitive architecture.  
     **Follow-up:** If I use a calculator that I’ve programmed to hide certain results, is the calculator’s "belief" mine? If not, why is a curated feed’s "belief" different?  

  7. **Question (Sub-Personal Dodge):** You argue partitions avoid homunculi because subsystems are sub-personal. But if the deceiving subsystem *intends* to deceive the other, doesn’t that require it to be a *personal-level* agent?  
     *Likely Reply:* Subsystems can have intentional states without being homunculi; think of competing neural networks.  
     **Follow-up:** If a neural network in me "intends" to deceive another network, in what sense am *I* the self-deceiver? Doesn’t this reduce selfhood to a battle of zombies?  

  8. **Question (Empirical Dodge):** When pressed on clinical cases, you suggest they’re "someone else’s problem." But if anosognosia involves neural partitioning *without* motive, doesn’t that challenge your claim that partitioning *requires* agential motive?  
     *Likely Reply:* Neural partitions without motive are pathology; self-deception is functional and agential.  
     **Follow-up:** If a stroke can create a partition identical to your "motivated" one but without motive, what *functional or structural criterion* proves agential involvement beyond the patient’s report?  

  ### Closing Thrust
  9. **Question (Falsifiability):** What observable fact would force you to abandon or revise the core claim that self-deception *necessarily* involves partitions (internal or external)?  
     *Likely Reply:* Evidence that agents robustly hold contradictory beliefs *without* any functional isolation—neural, behavioral, or environmental.  
     **Follow-up:** If PP shows unified systems can maintain contradictory beliefs via precision-weighting, and if environmental curation is just bias, wouldn’t that collapse your view into a variant of bias theory?  

  ### Why this sequence works
  - **Blocks escapes:** Opens with environmental outsourcing (her innovation) to prevent textbook restatements. Questions 1–3 force her to defend the *distinctness* of self-deception from ignorance/bias. Questions 4–5 target explanatory gaps vs. alternatives.  
  - **Cornering sub-personal/empirical dodges:** Questions 6–7 directly challenge the metaphysics of partitioning *before* she can retreat to it. Question 8 pre-empts hand-waving on clinical cases.  
  - **Closes decisively:** Question 9 demands falsifiability, forcing engagement with the view’s empirical stakes.  
  - **Follow-ups as scalpels:** Each cuts beneath initial replies to expose tensions (e.g., phenomenology vs. partition rigidity, ownership vs. externalization).  

  **Tactical note:** If she tries to pivot to exposition, interrupt politely: *"To clarify, I'm asking whether [follow-up]..."*. Maintain pressure on the *implications* of her replies. Good luck!
