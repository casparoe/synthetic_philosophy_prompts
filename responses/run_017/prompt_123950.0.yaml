  Here’s a toast that navigates your constraints while honoring Hal’s unique legacy, acknowledging the tension, and landing with warmth:

  ---

  (Lifting glass) To Hal Brenneman.

  Thirty-four years. That’s a long time to walk these halls, to learn the rhythms, the shortcuts, the weight of the place. Most of us here know the Hal who mastered that – the senator who knew where every lever was, every quiet corner for a deal, every historical footnote that explained why something *couldn’t* be done… until he decided it could.

  But the Hal I want to toast tonight isn’t just the master of the building. It’s the Hal who looked around at this place he knew so intimately, this system he’d navigated for decades, and asked a startlingly simple question: "What if we shook things up?"

  Not just a little tweak. A real shake. Like turning a snow globe upside down and watching all the pieces swirl into a brand new picture. That’s what he did with this Assembly idea. He reached right past the usual suspects – past the experts, the lifers, the people who *always* raise their hands – and he invited folks who hadn’t even been in the room before. People who hadn't voted, sometimes. People like… well, like me, frankly, though I got picked twice, which Hal finds endlessly amusing. (Pause, smile towards Hal) Yes, Hal, I know. It’s hilarious.

  I’ll admit, when I heard about that part – inviting the non-voters – I thought it was a terrible idea. I stood up in a hearing and said so! I thought, "They won’t show up. They don’t care." And Hal, you were characteristically gracious about it. You listened. But you saw something different. You saw a spark, not an absence. You saw folks who weren’t already spoken for, who hadn’t picked a side and dug a trench. You figured maybe they just needed an invitation that felt real. A chance to step in, not just mark a box.

  Well, six months in? Turns out Hal saw something most of us missed. Those folks show up. They read the binders. They lean in. They care deeply about the water and the land they’re helping shape. It turns out, giving people a real stake in the outcome is a pretty powerful motivator. Who knew? (Pause, look at Hal) Hal knew.

  And that’s the Hal I toast tonight. The Hal who, after thirty-four years of *accumulating* power, knowledge, connections – all the things we usually celebrate in a career like this – decided the best use of all that hard-earned capital was to… give some of it away. Deliberately. To people without his resume, his experience, his institutional memory. To trust that ordinary people, given the right structure and a real task, could step up.

  It takes a certain kind of confidence – maybe even a touch of humility, Hal? – to build something that fundamentally says, "My kind of expertise isn’t the only kind that matters here. Maybe the fresh eyes matter more." It takes someone secure enough in their own legacy to start building a different kind of table, one where the seats aren’t reserved for the usual crowd. Someone who’s done the long haul, knows its value intimately, but also sees its limits. Someone who understands that sometimes, the greatest strength isn’t in holding on tight, but in knowing when and how to open the door.

  So, Hal, we raise our glasses not just to the thirty-four years of service – though that’s certainly worthy of celebration – but to that moment of shaking the snow globe. To the faith you placed in people who hadn’t been asked before. To the courage it took to spend your political capital on an idea that wasn’t about your next election, but about the next generation's way of deciding things. And to the quiet satisfaction, I hope, of seeing that faith rewarded – binder by binder, meeting by meeting.

  Here’s to the architect of new doors. To Hal Brenneman! May your retirement be filled with grandkids, (smile at grandkids) hopefully ones who find *your* stories as funny as you found my double-dip in the lottery… and perhaps a little less reading of dense water rights binders. Cheers!

  ---

  **Rationale for Key Choices:**

  1.  **Avoiding Expertise/Institutional Memory:** Focused instead on Hal *using* his accumulated power/knowledge to create a space where *different* perspectives (fresh eyes) are valued. "Master of the building" acknowledges his skill without making it the key credential for the Assembly.
  2.  **Avoiding "Need More Like Hal":** Explicitly states his long career ("thirty-four years of accumulating power") but frames his key act as *spending* that capital to create a system that makes such long careers less central. Highlights the paradox ("secure enough... sees its limits") without needing "term limits."
  3.  **The Tension (Power to Give Power Away):** This is the core of paragraphs 4 & 5. "Hal who, after thirty-four years... decided the best use... was to give some of it away." "...someone who’s done the long haul... but also sees its limits." "...greatest strength isn’t in holding on tight, but in knowing when and how to open the door."
  4.  **The Non-Voter Acknowledgment:** Woven into the narrative of your initial skepticism and his insight ("You saw a spark, not an absence"). The payoff ("Turns out Hal saw something... They show up... They care") directly addresses your experience without making *you* the focus. Makes Hal's idea the hero.
  5.  **Sortition Explanation:** Used a single, simple, visual metaphor ("shaking the snow globe") and described the *effect* ("invited folks who hadn’t even been in the room before") rather than the mechanism. Avoided all jargon ("sortition," "citizens' assembly").
  6.  **Affection & Grandkids:** Opened and closed with warmth. Included the personal anecdote about testifying against him ("Hal, you were characteristically gracious"). Added the light moment about the grandkids and the binders. Ended with a personal wish for his retirement.
  7.  **Context for the Room:** The "snow globe" metaphor works for both those who know the Assembly and those who think it's a civic club. References to "binders" and "showing up" resonate with your cohort. Avoids any partisan language or deep policy.
  8.  **Structure:** Continuous prose, conversational tone, designed to be spoken (short sentences, pauses indicated). Word count is within target (~650 words spoken at a moderate pace).
