answer: |-
  ## The Deportation Dilemma

  **Brainstorming Rejects:**  
  1. *Medical trial choice* (standard treatment vs. experimental drug): Risked smuggling diminishing marginal utility of health.  
  2. *Child custody arrangement* (sure partial access vs. gamble for full custody/termination): "Termination" outcome might be survivable via appeals, weakening catastrophe.  
  3. *Academic tenure gamble* (lectureship vs. gamble for endowed chair/dismissal): Stakes potentially fungible via reputation/rehiring; dismissal may not be absolute.  

  **Surviving Case:**  
  I must choose between two visa pathways for my family. Outcome levels: **Worst**: Deportation to active conflict zone (irreversible family separation, mortal danger; no quantity of safety compensates). **Good**: "Home Residency" (stable work/education in safe third country, no path to permanence). **Better**: "Protected Residency" (permanent status, full rights, family security). An urn has 100 balls.  

  - **Choice 1**:  
    - *Option A1*: Ball 1–99 → Home Residency; Ball 100 → Deportation.  
    - *Option B1*: 100 balls → Protected Residency.  
    I prefer **B1**. The 1% deportation risk is unacceptable when permanent safety is certain.  

  - **Choice 2**:  
    - *Option A2*: Balls 1–89 → Home Residency; Balls 90–99 → Protected Residency; Ball 100 → Deportation.  
    - *Option B2*: Balls 1–89 → Home Residency; Balls 90–100 → Protected Residency (no deportation risk).  
    I prefer **A2**. With deportation risk fixed at 1%, I’ll gamble for a 10% chance at permanent status over settling for temporary safety.  

  After reflection, the two-urn reframing (first draw: 89% identical branch; second draw: 11% branch differing by options) doesn’t change my mind. Eliminating deportation *now* feels fundamentally different than marginally reducing it later. I don’t care what declined options would have yielded.  

  ---

  **Analysis:**  

  1. **Decomposition & Violation**:  
     Rewrite A1 as a compound lottery matching A2’s structure:  
     - 89%: Home Residency → *Same as B1/B2’s first 89 balls*  
     - 10%: (Home Residency w/ prob 1.0) → *But B1/B2 offer Protected here*  
     - 1%: Deportation → *Same as A2*  
     Apply reduction: A1 = [89% Home, 10% Home, 1% Deportation] ≡ [99% Home, 1% Deportation].  
     Apply independence: Substitute the "89% Home" common branch in A1/B1 with "89% Home" from A2/B2. Scaling the non-shared branch (11% probability) down from A1 to A2 transforms the choice pair. Independence demands if B1 ≻ A1 then B2 ≻ A2, but A2 ≻ B2: contradiction. Transitivity/reduction hold; independence fails.  

  2. **Utility Contradiction Proof**:  
     Normalize: U(Deportation) = 0, U(Home) = 1. Let U(Protected) = *u*.  
     - **B1 ≻ A1** ⇒ *u* > 0.99(1) + 0.01(0) ⇒ *u* > 0.99  
     - **A2 ≻ B2** ⇒ [0.89(1) + 0.10(*u*) + 0.01(0)] > [0.89(1) + 0.11(*u*)]  
       ⇒ 0.89 + 0.10*u* > 0.89 + 0.11*u*  
       ⇒ 0.10*u* > 0.11*u*  
       ⇒ 0 > 0.01*u*  
       ⇒ *u* < 0  
     But *u* > 0.99 and *u* < 0 is impossible. No EU function satisfies both.  

  3. **Structural Feature**:  
     The **catastrophic discontinuity** between outcomes. Deportation isn’t just worse; it’s non-comparable ruin. This creates a *threshold effect*: eliminating its possibility (B1) has absolute priority, but *given* unavoidable exposure (Choice 2), incremental improvements (gambling for Protected) dominate. The shared probability mass (89%) becomes a "sunk security" psychologically, altering risk posture.  

  4. **Ablation**:  
     Change **Worst outcome to survivable** (e.g., Deportation to safe country with family intact). Now:  
     - B1 ≻ A1 still holds (risk aversion).  
     - But B2 ≻ A2 emerges: the 10% chance of Protected isn’t worth forfeiting a 1% reduction in deportation risk when deportation is tolerable. Contradiction vanishes; EU holds with *u* < 1 (e.g., *u* = 0.95 > 0.99? No, but *u* = 0.95 satisfies B1≻A1 [0.95>0.99? False! Wait: recalc shows consistency possible if deportation isn’t 0).  

  5. **Rebuttal & Defence**:  
     **Reply**: "True outcomes include *experiential states*: choosing B1 provides 'freedom from existential dread pre-lottery,' while rejecting B1 for A2 induces 'regret-tinged hope.' EU over *these* states rationalizes it."  
     **Problem**: This is tautological unless independently justified. Why is "dread" inherent only to Choice 1’s risk? If experiential states are *defined* by choices, EU is unfalsifiable.  
     **Defence Requirement**: Show the experiential states exist *outside* this choice (e.g., empirical evidence that people value "closure" or "uncontested safety" non-instrumentally in other contexts). Without this, it’s ad hoc redescription.  

  ---  
  **Why it works**: The catastrophe’s incommensurability creates a rational priority shift across contexts—unexploitable by money pumps due to non-fungibility. It’s independence violation as value, not error.
