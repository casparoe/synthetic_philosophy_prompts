prompt: |-
  Reading the cyclical theories of history — the ones that treat a whole civilization like an organism with a youth and an old age — I keep tripping over a move I don't have a word for.

  Two instances. Enormous public building, and being very open to foreign people and foreign ideas: in the chapters about the confident middle phase both get described as energy and reach, and in the chapters about the late phase the very same things get described as bloat and loss of nerve. Same with inequality and with religious skepticism — vigor on the way up, rot on the way down. The feature itself never changes, only where in the story you've decided you are. And it definately cuts both ways, because civilizations that didn't infact collapse get the same traits written up in the prevous chapter as dynamism.

  My first guess was hindsight bias, but that feels too narrow: that's about judging how likely something was, whereas here it's about which description of the evidence is allowed to stick. It's also not just plain unfalsifiability, since the theory really does commit itself to a shape — it just never commits itself in advance to what would count as a symptom. So: is there an established concept for this in the philosophy of history or nearby, or for the nearest thing to it? I don't want a bare label — I want to know exactly what the move is, what it is not, and where the boundary sits, since re-describing the evidence must sometimes just be learning more. And does it also affect linear progress theories, or is it special to cyclical ones?

  Lead with your bottom line in the first sentence, then give the reasoning — no preamble, no restating my question. American English, please.
reasoning: |-
  Okay, the user is asking about a specific pattern they noticed in cyclical theories of history. They describe how certain traits like large public buildings or openness to foreign ideas are interpreted positively in a civilization's growth phase but negatively in its decline, without the traits themselves changing. The user wants to know if there's a term for this interpretive move and how it works.

  First, I need to recall relevant concepts in philosophy of history. The user mentions hindsight bias and unfalsifiability but finds them insufficient. They're looking for something more precise. I remember that ad hoc reclassification fits here. It's when the same evidence is reclassified based on the narrative phase without objective criteria. 

  The user also wants to distinguish this from cases where new information justifies reinterpretation. So I need to clarify that boundary. Ad hoc reclassification lacks independent criteria for assigning traits to phases, which is key. 

  They ask if linear progress theories have the same issue. Probably yes, but cyclical theories are more vulnerable because their phases are symmetrical. For example, in linear theories, traits might be seen as "growing pains" versus "systemic failures," but the lack of predefined criteria could still allow similar reclassification. 

  The user might be a student or scholar in history or philosophy, looking for precise terminology to critique these theories. Their deeper need is to understand the methodological flaw to better analyze historical narratives. They want to avoid vague labels and seek a rigorous conceptual tool. 

  I should structure the response with the bottom line first: ad hoc reclassification. Then explain why it's not hindsight bias or unfalsifiability, and how it differs from legitimate updates with new evidence. Finally, address the applicability to linear theories.
answer: |-
  The core issue is **ad hoc reclassification of evidence within a predetermined narrative framework**.

  This move involves interpreting identical phenomena as signs of fundamentally different underlying states (e.g., vigor vs. rot) solely based on the phase of the cyclical model you've assigned them to, without independent criteria for phase identification. It's distinct from:

  1.  **Hindsight Bias:** This focuses on *predictability* ("I knew it all along"). Your case is about *meaning attribution* - the same observed fact is given diametrically opposed meanings (energy vs. bloat) depending on the narrative context.
  2.  **Plain Unfalsifiability:** While related, the cyclical theory *is* falsifiable in principle (e.g., if no civilization ever declined). The problem here is *evidential ambiguity* - the theory doesn't specify *in advance* which observable traits *conclusively* indicate youth, maturity, or decline. This allows the *same* trait to be reclassified ad hoc to fit the story.
  3.  **Learning More:** Legitimate reinterpretation occurs when *new evidence* reveals previously unseen aspects or contexts, forcing a reassessment of the *phenomenon itself*. Here, the *description of the phenomenon fundamentally changes* (energy becomes bloat) solely because of its *narrative position*, not new empirical discovery about its nature or consequences. The boundary lies in whether the reclassification is driven by new evidence *about the trait* or solely by the *demands of the narrative phase*.

  This flaw is **not unique to cyclical theories**; it can infect linear progress narratives too. For example:
  *   In a linear progress model, social unrest might be "constructive growing pains" during the ascent phase but "dangerous backsliding" during a perceived plateau or threat.
  *   Centralized power could be "efficient modernization" early on and "authoritarian stagnation" later.
  The mechanism is identical: the *evaluation* of the trait flips based on the narrative's current stage, lacking independent phase-defining criteria. However, **cyclical theories are exceptionally vulnerable** because their symmetrical rise-and-fall structure inherently invites descriptions of the "same" trait at peak (positive connotation) and valley (negative connotation) phases, maximizing the temptation for ad hoc reclassification to maintain the cycle's apparent fit.
