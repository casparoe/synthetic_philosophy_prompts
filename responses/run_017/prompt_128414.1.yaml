prompt: |-
  I write about physics and about the way science is done, and next month I'm giving the closing talk at a two-day, invitation-only workshop on how to assess theories that can't currently be tested — string theory, the multiverse, and the general question of whether a framework can earn support without data. I need a Q&A prep sheet, not a defense of my thesis, and I'd rather be told where I'm weak than be set up to look good.

  The thesis I'll defend: non-empirical support for a framework is legitimate only if it passes what I've been calling the provenance test. For each of the three arguments usually offered — that no one has managed to construct a workable rival; that the framework keeps turning out to explain things it wasn't built to explain; that its research tradition has a track record of converting guesses into genuine successes — you should have to name the structural feature of the theory that generates the argument, say what would have been true if things had gone the other way, and state which of the other two arguments would survive if that feature were removed. The spine of the talk is a suspicion rather than a proof: that in the case everyone will be thinking of, all three arguments may trace back to a single feature — the framework's extreme internal rigidity combined with a long-standing community practice of absorbing anomalies rather than discarding the framework — in which case they are one argument counted three times, and the arithmetic of the published case is badly inflated.

  The room is about forty people. Six or seven working string and quantum-gravity theorists, most of them broadly sympathetic to the non-empirical case and impatient with outsiders who relitigate falsifiability. Three philosophers of science: one sympathetic to Bayesian treatments of non-empirical evidence, one old-school falsificationist who thinks the whole program is an oxymoron, and one who works on the problem of unconceived alternatives and treats every argument from absence of alternatives as a bad-lot argument in disguise. Three observational cosmologists and a gravitational-wave experimentalist, all of whom have data, think the session is decadent, and are acutely aware of what the money spent on it could have bought. Two historians of science. A program officer from the foundation paying for the workshop. And five or six other science writers plus two editors who cover physics and who will be listening for whether any of this is publishable.

  What I want from you:

  The objections I will actually get — eight or nine of them — ordered by how much damage they'd do rather than by how likely they are, and phrased the way the relevant person would actually phrase them. Where the string theorist's objection and the falsificationist's objection share a target but not a vocabulary, give me both versions; I need to hear the difference. For each: a reply I can deliver in about ninety seconds, and one honest sentence on where that reply is softest. Skip the objections I'd get from a comment section; this room knows the terrain.

  Also: what I should concede in the first two minutes, before anyone asks anything, so that the concessions don't get extracted from me later; the single claim that has to survive if the talk is going to have been worth giving; the two objections that are really one objection wearing different clothes; and the one that is sound but that I can't answer without losing the room. Assume twenty minutes for questions and that anything I say may end up quoted.

  Finally: I think the question I'm quietly hoping nobody asks is the one about my standing — a non-physicist proposing assessment standards for a field he can't do — but if you think the genuinely dangerous question is a different one, say so, say which, and tell me why.
reasoning: |-
  Okay, let me tackle this user's request. They're preparing for a high-stakes workshop Q&A on assessing untestable theories like string theory and the multiverse. Their thesis centers on the "provenance test" for non-empirical support. 

  First, I need to understand the audience dynamics. The room has factions: string theorists sympathetic to non-empirical arguments, philosophers with opposing views, experimentalists who resent the discussion, and stakeholders like funders and journalists. Each group will attack differently. 

  The user wants damage-ordered objections, not likelihood. Top threats should undermine their core argument or credibility. The "standing" question (non-physicist judging physics) is their own fear, but I suspect the Bayesian objection from the sympathetic philosopher might be more dangerous—it directly challenges their rejection of probabilistic support. 

  For concessions: they must preemptively acknowledge that empirical testing remains gold standard and that frameworks like string theory have generated valuable tools. This disarms experimentalists and shows nuance. 

  The "must-survive" claim is the key insight that non-empirical arguments collapse if traceable to a single structural feature like rigidity. If this point stands, the talk succeeds. 

  I see two objections masquerading as separate: the string theorist's "fruitfulness" defense and the historian's "Kuhnian paradigms" point. Both argue rigidity is virtuous, just in different jargon. 

  The unanswerable objection? Likely the funding question. Any defense of theoretical spending will alienate experimentalists; conceding wastes money validates their resentment. Best to sidestep tactfully. 

  For replies: each needs a 90-second counterpunch with acknowledged weakness. The Bayesian reply must admit their framework rejects probabilities but risks sounding dogmatic. The track-record reply exposes their test's vulnerability to hindsight bias. 

  Finally, the real danger isn't standing—it's the Bayesian critique. If the room accepts probabilistic non-empirical support, their entire thesis collapses. They must frame this as category error: "probabilities require data" is the hill to die on.
answer: |-
  Here’s a targeted Q&A prep sheet focused on high-damage objections, phrased authentically and structured for your defense. I’ve prioritized objections that challenge your core thesis or credibility in this expert room.

  ---

  ### **Preemptive Concessions (Open With These)**
  1. **"Empirical testing remains the gold standard. Nothing here disputes that."**  
     *(Disarms experimentalists; preempts "why are we even discussing this?")*  
  2. **"String theory has generated profound mathematical tools (e.g., AdS/CFT, swampland conjectures) irrespective of testability."**  
     *(Neutralizes "wasted effort" narratives; validates theorists’ pride)*  
  3. **"The 'provenance test' is diagnostic, not prescriptive. It flags inflation risk but doesn’t forbid non-empirical arguments."**  
     *(Prevents caricature as a Popperian hardliner)*  

  **Must-Survive Claim**:  
  *"If all three non-empirical arguments trace to a single structural feature (like rigidity + anomaly absorption), their combined weight collapses — and we’re mistaking resilience for evidence."*  

  ---

  ### **High-Damage Objections & Replies**  
  *(Ordered by potential damage, with 90s replies and soft spots)*  

  1. **Objection (Philosopher, Bayesian)**:  
     *"You dismiss Bayesian priors for frameworks, but if a theory’s structure resolves longstanding theoretical tensions (e.g., quantum gravity + unification), doesn’t that rationally raise its credence *before* data?"*  
     **Reply**: "Bayesian priors require a well-defined hypothesis space. Untestable frameworks lack this—you can’t assign probabilities to a unique, flexible entity. The 'provenance test' asks what *specific structure* justifies the tension-resolution. If it’s rigidity, that’s circularity, not evidence."  
     **Soft Spot**: *Concedes Bayesianism works for testable sub-claims within frameworks (e.g., black hole entropy), weakening your blanket rejection.*  

  2. **Objection (String Theorist)**:  
     *"Your 'rigidity' is our *consistency*. When string theory explains the Page curve or excludes supergravity models, that’s novel emergence—not anomaly-absorption."*  
     **Reply**: "Novelty requires surprise *relative to expectations*. If the framework’s rigidity means all outcomes must fit its architecture (e.g., extra dimensions), 'surprises' are inevitabilities. Name the feature that *could’ve* failed but didn’t. Without that, it’s confirmation."  
     **Soft Spot**: *Fails to distinguish between *predictive* novelty (strong) and *retrodictive* "explanation" (weak)—which is what string theory often delivers.*  

  3. **Objection (Historian of Science)**:  
     *"Kuhn showed rigid paradigms *enable* progress. Newtonian mechanics absorbed anomalies for centuries before relativity. Isn’t your test ahistorical?"*  
     **Reply**: "Kuhnian rigidity works when anomalies accumulate *toward* crisis. But if a framework *systematically* converts anomalies into 'features' (e.g., landscape solutions to the cosmological constant), crisis is deferred indefinitely. That’s resilience, not progress."  
     **Soft Spot**: *Risk of implying *all* rigidity is bad—undercuts your focus on *non-empirical* support.*  

  4. **Objection (Falsificationist Philosopher)**:  
     *"This is sophistry. If a framework can’t be tested, *no* non-empirical argument licenses belief. Your 'test' legitimizes pseudoscience."*  
     **Reply**: "I agree non-empirical support isn’t *confirmation*. The test exposes when arguments are *internally circular*. For pseudoscience (e.g., astrology), the 'provenance' would fail—no track record of converting guesses into *empirical* successes."  
     **Soft Spot**: *Leaves room for "But string theory *has* empirical aspirations!"—which doesn’t address current untestability.*  

  5. **Objection (Cosmologist with Data)**:  
     *"Why does this matter? We’re drowning in dark energy/gravity wave data. Theorists should serve *us*, not debate unfalsifiable castles."*  
     **Reply**: "Because the *allocation* of resources—young theorists, funding, prestige—flows toward frameworks claiming non-empirical weight. If that weight is inflated, we misallocate. Your data deserves better-guided theory."  
     **Soft Spot**: *Sounds managerial; doesn’t refute that *their* work is unaffected.*  

  6. **Objection (Philosopher of Unconceived Alternatives)**:  
     *"Your 'no rivals' point ignores the bad lot. String theory dominates because alternatives are starved, not absent. This is institutional capture, not evidence."*  
     **Reply**: "Exactly why the provenance test asks: 'What structural feature *explains* the lack of rivals?' If it’s rigidity + absorption, then yes—it’s a self-reinforcing monopoly. The test *exposes* capture."  
     **Soft Spot**: *Assumes you can disentangle institutional from epistemic factors—you can’t.*  

  7. **Objection (Program Officer)**:  
     *"Foundations fund *ideas*, not just data. If your test discourages high-risk frameworks, haven’t you made science *smaller*?"*  
     **Reply**: "No—it discourages *inflated claims* of support for untestable ideas. High-risk innovation thrives when we’re honest about what’s speculative. The test protects science from overcommitment to sunk costs."  
     **Soft Spot**: *Ignores that funders *need* proxies for promise—non-empirical arguments are inevitable.*  

  8. **Objection (String Theorist #2)**:  
     *"Track records *do* matter. QFT was once untestable—its math later fit data. Why distrust string theory’s math?"*  
     **Reply**: "QFT’s success came from *constraining* its framework with data (e.g., Lamb shift). The provenance test asks: what feature of string theory *allowed* it to 'predict' the electron? None—it was reverse-engineered. Without constraint, math isn’t evidence."  
     **Soft Spot**: *Minimizes QFT’s own non-empirical heuristics (e.g., renormalizability).*  

  ---

  ### **Key Notes**  
  - **Two Objections, One Core**: The string theorist’s "novel emergence" (#2) and the historian’s "Kuhnian rigidity" (#3) both defend resilience as virtue. Your reply must reframe rigidity as a *flaw* in non-empirical argumentation.  
  - **Sound but Unanswerable Objection**:  
    *"You’re judging science as an outsider. When Penrose or Weinberg endorse non-empirical arguments, who are *you* to impose a 'test'?"*  
    **Why it’s dangerous**: Challenges your authority *and* forces you to either dismiss experts (arrogant) or concede their judgment outweighs your framework (fatal).  
    **Mitigation**: "I’m analyzing *argument structures*, not theories. If experts accept my logic but dispute its application, that’s progress. If not, show where the test misfires."  

  - **The Real Dangerous Question**:  
    **Not your standing—it’s this**:  
    *"If the provenance test flags string theory, but no alternative framework exists, should we *abandon* quantum gravity research?"*  
    **Why worse**: Forces you to either (a) advocate halting work (untenable), (b) admit the test changes nothing (hollow), or (c) endorse "less wrong" frameworks (subjective).  
    **Reply**: "No—we should *demote* non-empirical arguments to 'interesting speculation', refocus on testable sub-problems (e.g., black holes), and incentivize alternatives. Stagnation isn’t solved by doubling down."  

  ---

  **Final Prep Tip**: When quoting, soundbite your must-survive claim: *"Triple-counting one argument isn’t support—it’s intellectual inflation."* Anchor every reply to structural features (rigidity, absorption) to avoid getting bogged in theory-specific fights.
