answer: |-
  **Bottom line:** Your tutor overreaches by claiming "existence is not a predicate" sinks *all* ontological arguments, including Gödel's modal version; the seminar guy is likely correct that it primarily targets Anselm/Descartes-style arguments, though Gödel's argument faces other serious objections unrelated to this slogan.

  ### List of Precise Claims Behind "Existence is Not a Predicate"
  1.  **The Quantificational Claim (Existential claims express quantification, not predication):**
      *   **Claim:** Statements like "X exists" are not attributing a property ("existence") to an individual object X. Instead, they mean "There is something that has the properties defining X" (e.g., "Lions exist" = "There are things that are lions"). Existence is captured by the existential quantifier (∃) in logic.
      *   **Trivial/Plausible?** Trivial within standard modern (Frege-Russell) logic. Existence *is* fundamentally quantificational. Highly plausible and widely accepted for descriptive contexts.
      *   **Sinks Anselm/Descartes?** Yes. Their arguments treat "exists" as a predicate defining the concept of God, like "omnipotent" or "good". If "exists" isn't functioning as a predicate in this way, their definition is flawed or question-begging.
      *   **Sinks Gödel?** No. Gödel's argument uses quantification and modal operators. It defines "God-like" in terms of *essential properties* (including "necessary existence") and uses possibility/necessity. It doesn't try to deduce bare existence from a non-modal concept definition alone. The quantificational claim isn't directly aimed at Gödel's machinery.

  2.  **The No Conceptual Enrichment Claim (Existence adds nothing to the *concept* of a thing):**
      *   **Claim:** Adding "exists" to the description/concept of an object (e.g., "a perfect island that exists" vs. "a perfect island") doesn't make the *concept* itself richer, more complete, or more detailed. Imagining a dollar doesn't differ conceptually from imagining an existing dollar – the difference is instantiation, not concept-content. Kant's "100 thalers" example.
      *   **Trivial/Plausible?** Plausible and intuitive at the conceptual level. What exists has real-world consequences, but the *description* of X and the description of "existing X" are identical. Contestable by some who argue existence *does* change how we relate to the concept (e.g., fictional characters vs. real people).
      *   **Sinks Anselm/Descartes?** Yes. Anselm argues the concept "that than which nothing greater *can be* conceived" *must* include existence because existence (in reality) is greater than non-existence (only in the mind). This relies on existence making the *concept itself* "greater" or more complete. If existence doesn't enrich the concept, this move fails.
      *   **Sinks Gödel?** Indirectly relevant, but not directly fatal. Gödel defines "God-like" via *positive properties*. The argument hinges on whether "necessary existence" is a positive property and the mechanics of the modal logic, not on existence enriching the *concept* descriptively. If one argues "positive properties" cannot include existence *because* it doesn't enrich concepts, that's a critique, but it's a distinct step relying on this claim plus other premises about positivity.

  3.  **The No Entailment Claim (No set of properties entails existence):**
      *   **Claim:** No collection of properties defining an essence logically entails that something instantiating that essence *actually exists*. Existence is not a logical consequence of any essence definition alone. You can coherently define unicorns without them existing.
      *   **Trivial/Plausible?** Plausible and generally accepted for *contingent* existence. Defining an essence doesn't force it to be instantiated. Contestable regarding *necessary existence* – proponents of ontological arguments might argue *some* essences (like God's) *do* entail their existence necessarily.
      *   **Sinks Anselm/Descartes?** Yes. They try to deduce existence from the very definition of God's essence (greatest perfection). This claim directly denies that move is logically valid.
      *   **Sinks Gödel?** This claim *challenges* Gödel's core move. Gödel *defines* "necessary existence" as a property and argues it's "positive". His argument then uses modal logic to conclude that if God's essence is *possible*, it *must* be instantiated necessarily. This claim attacks the first step: can "necessary existence" *be* a property that an essence possesses such that its possibility entails its actuality? If you hold that *no* property (or bundle) within an essence can entail existence (even necessary existence), then Gödel fails. This is a key point of contention.

  4.  **The Necessary Exemption Claim (Necessary existence might be a genuine property):**
      *   **Claim:** While *contingent* existence isn't a predicate of individuals, *necessary existence* might be a distinct, legitimate modal property. Necessary existence isn't just "existing" but "could not possibly fail to exist".
      *   **Trivial/Plausible?** Contentious. This is the core defence for modal ontological arguments. Critics argue it's a distinction without a difference – necessary existence still involves existence, which they claim isn't a predicate. Proponents argue modal properties like necessity *are* genuine properties of individuals (or their essences).
      *   **Sinks Anselm/Descartes?** N/A (they don't formally distinguish it). It *saves* them only if reinterpreted modally.
      *   **Sinks Gödel?** This is the *escape route* for Gödel. If necessary existence *is* a genuine property (especially a "positive" one), then the quantificational and conceptual enrichment objections miss their mark, as Gödel's argument deals with this modal property. Gödel's success hinges on this claim being accepted and his other axioms/premises holding.

  5.  **The Second-Order Predicate Claim (Existence *is* a predicate, but of properties/concepts, not individuals - Instantiation):**
      *   **Claim:** While "existence" isn't a (first-order) predicate of *individual objects* ("Socrates is existent" is bad logic), it *can* be understood as a (second-order) predicate of *properties* or *concepts*: the property of *being instantiated* (e.g., "Lionhood is instantiated"). This is what the existential quantifier expresses.
      *   **Trivial/Plausible?** Trivial within standard logic. The quantifier "∃x Fx" *does* express that the property F has at least one instance. This is uncontroversial.
      *   **Sinks Anselm/Descartes?** Yes. They treat existence as a first-order predicate ("God has the property of existence").
      *   **Sinks Gödel?** This is the seminar guy's "escape". Gödel's argument (defining God via properties, calling necessary existence a "property", analysing positivity) operates largely at the level of properties/concepts and their modal status. Talking about a property like "necessary existence" *being instantiated* (especially necessarily) uses second-order quantification implicitly. The slogan "existence is not a predicate" (aimed at first-order predication) doesn't directly forbid talking about the instantiation of properties. However, this doesn't *make* Gödel's argument sound; it just shows this particular slogan isn't the weapon to kill it. It shifts the argument to whether "necessary existence" *can* be a coherent property, whether it's "positive", and the modal logic used.

  ### Addressing Your Specific Queries
  1.  **Seminar Guy's "Existence as Predicate of Properties" Move:** It's **a real escape** from the *literal force* of the "existence is not a (first-order) predicate" slogan. Gödel's argument *can* be framed in terms of properties and their instantiation conditions. However, it's **mostly moving the bump in the carpet**. The core objections to Gödel shift to:
      *   Is "necessary existence" a coherent, non-paradoxical property?
      *   Is "necessary existence" genuinely "positive" (Gödel's controversial axiom)?
      *   Is the modal logic (especially the collapse from possibility to necessity) valid?
      *   Does defining something as having *all* positive properties avoid inconsistency? The *work* of justifying the argument is still needed; the slogan just wasn't the right tool to attack it.

  2.  **The Existential Quantifier Assumption:** You're right. The standard quantificational view **assumes names refer to existing objects** (in standard logic, `Fa` implies `∃x (x=a)`). **Free Logic** drops this assumption, allowing names for non-existents. In Free Logic:
      *   "Exists" *can* be treated as a legitimate first-order predicate (`E!a`).
      *   This **significantly weakens the "existence is not a predicate" objection**. The Anselm/Descartes argument *might* be formalisable, but it likely becomes blatantly question-begging: defining God as "the greatest being" *and then asserting `E!God` as part of the definition* is circular. The argument doesn't gain new force; the objection just changes form to accusing it of circularity or arbitrariness. For Gödel, operating modally with properties, Free Logic changes little. The quantificational claim, in its strong form, is less central if you adopt Free Logic, but the core issues (conceptual enrichment, entailment, modal coherence) remain.

  ### Who Needs What & The Real Disagreement
  *   **Your Tutor:** Needs either the **Quantificational Claim** or the **No Entailment Claim** applied *very broadly* to dismiss Gödel. This is an overextension. The Quantificational Claim doesn't touch Gödel's modal structure. Applying the No Entailment Claim to *necessary existence* is the point of contention, not a settled matter.
  *   **Seminar Guy:** Relies on the **Necessary Exemption Claim** and the **Second-Order Predicate Claim** to shield Gödel. This is valid against the slogan *as typically used*, but doesn't make Gödel successful, just immune to this specific soundbite.
  *   **Most Common Use:** People repeating the slogan most often have the **Quantificational Claim** or the **No Conceptual Enrichment Claim** in mind, targeting Anselm/Descartes directly. It's wielded as a conversation-stopper against simplistic "defining God into existence" arguments.
  *   **Real Disagreement:** The core disagreement regarding Gödel lies in:
      1.  Whether **necessary existence** is a genuine, coherent, non-question-begging property that can be part of an essence (**Necessary Exemption Claim**).
      2.  Whether it is legitimately a **"positive" property**.
      3.  The validity of the specific **modal logic** employed (especially S5 allowing the crucial inference).
      4.  Whether the definition of "God-like" (possessing *all* positive properties) is **consistent**.

  "Existence is not a predicate" is largely a red herring for evaluating Gödel's argument. Its force is against the classical versions. Dismissing Gödel requires engaging with his specific premises and modal logic.
