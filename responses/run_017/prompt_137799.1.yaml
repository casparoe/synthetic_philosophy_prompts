prompt: |-
  I work in formal methods and, in what spare time I have, I have been playing with a small hobby setup that has turned into something I cannot name. I would be grateful for help with the carving rather than the labelling: I do not want a reading list or a set of references, and I would rather you argue the distinctions out than point me at where they are written down.

  Here is the setup. Two machines play a single-shot prisoner's dilemma, but not by choosing actions directly. Each submits a program to a referee; the referee hands each program the other program's source text as input; each program must halt and print either COOPERATE or DEFECT. The point of the detour is that a program can inspect its counterpart and condition on what the counterpart will do. Call this the code-swap game.

  Three things I observed, and one additional case that I suspect is the same thing in another costume.

  First, the obvious strategy does not work. If each program tries to simulate the other, the two simulations call each other and nothing halts. I did not find this surprising; it looks like an ordinary vicious circle, and it is easy to describe.

  Second, replacing simulation with proof fixes it, in a way I did find surprising. Let both sides run this:

      search over all proofs in a fixed formal system (Peano arithmetic, say)
      if a proof is found that the other program prints COOPERATE, print COOPERATE
      otherwise print DEFECT

  Two copies of this program both cooperate, and the argument that they do appears to turn on a theorem about self-reference of exactly the kind I was taught to think of as purely negative. So the same-looking machinery that blocks a system from certifying itself is what lets these two programs find each other.

  Third, the cooperation is sensitive to the proof bound in a way I cannot explain to myself. If I let each program search only over proofs shorter than some modest length, both defect; if I raise the bound past a threshold, both cooperate. The bound is not concealing the other program from me. The other program is twenty lines long and I can read it; I can also, in many cases, work out by hand what it will do. What the bound conceals is a proof.

  The additional case is this. Suppose a program is in the business of building a successor and handing control to it, and its rule is that it may hand over control only if it can prove, in its own formal system, that the successor's behaviour will be acceptable. Then it cannot certify a successor that reasons exactly as well as it does, even when the successor's source code is available in full and even when the successor is, to all appearances, a copy of itself with a better search routine. Worse: if I try to let the builder help itself to the general rule that whatever it can prove is true, the builder's proof system stops discriminating at all and proves every sentence. If instead I let each generation use a strictly weaker formal system than its parent, I seem to have bought only a descending chain that either runs out or was never really a solution.

  What I want, concretely:

  Is there an established name for this pattern, and are the code-swap case and the successor case one phenomenon or two? I am not interested in being told the name if the name comes without the boundaries, so please also say which nearby things it is most often confused with and how it differs from each. In particular, I have had four diagnoses offered to me and none of them feels right, but I cannot say precisely why:

  that this is just the undecidability of program behaviour, or a version of the theorem that no nontrivial property of a program's behaviour is decidable;

  that this is just incompleteness in the usual textbook sense;

  that this is just the banality that a system cannot be expected to predict what a more capable system will do;

  that this is just a coordination failure of the sort that any game with multiple equilibria exhibits, and has nothing specifically to do with reasoning.

  Then the boundary cases, which matter most to me. Does the pattern depend essentially on each side's reasoning appearing inside the statement it has to evaluate, so that it would vanish if the two agents could inspect only each other's behaviour and not each other's reasoning? Does it survive if the agents are allowed to be probabilistic, or if the requirement is weakened from proving optimality to proving that a successor is no worse than inaction? Does it survive if the two sides share correlated randomness, or a common random seed, ahead of time? Does anything change if the self-trust rule is restricted to statements of some restricted syntactic shape rather than adopted in full generality?

  And if there turns out to be no established concept that fits, say so plainly, and give me a name and a definition instead, together with the cases that should count as instances, the cases that should not, and the nearest miss that I am most likely to conflate it with in future.
reasoning: |-
  We are dealing with a fascinating scenario that blends formal methods, game theory, and logic. The core setup is a Prisoner's Dilemma where each player submits a program that takes the other's source code as input and outputs COOPERATE or DEFECT. The twist is that the programs can reason about each other.

  Let me break down the observations and then address the questions.

  ### Observations:

  1. **The obvious strategy (simulation) fails** due to infinite regress when each tries to simulate the other.

  2. **The proof-based strategy works**: Each program searches for a proof (in a fixed formal system, say PA) that the other program outputs COOPERATE. If found, it cooperates; else, it defects. Surprisingly, two such programs both cooperate. The key is that each can prove that the other cooperates, relying on self-referential reasoning that is typically associated with negative results (like Gödel's incompleteness) but here yields a positive outcome.

  3. **Sensitivity to proof bound**: When the proof search is bounded, both defect until the bound is high enough to find the necessary proof. The bound doesn't hide the program (which is short) but the proof, which might require a long derivation.

  4. **The successor case**: A program must pass control to a successor only if it can prove the successor's behavior is acceptable. It cannot certify an equally capable successor, and if it tries to use the rule that whatever it proves is true, it leads to inconsistency (proving everything). Using a weaker formal system for each generation only yields a descending chain.

  ### Addressing the Diagnoses:

  The offered diagnoses are:

  - **Undecidability of program behavior (Rice's theorem)**: While related (since we are reasoning about program behavior), the issue here is not just undecidability in general. The proof-based strategy actually works when the proof system is unbounded and consistent. The sensitivity to the proof bound is more about the complexity of the proof rather than undecidability per se. Undecidability would imply that there is no general algorithm, but here we are using a specific proof system and a specific program.

  - **Incompleteness in the usual sense**: Gödel's incompleteness theorems show that any consistent formal system of sufficient strength cannot prove its own consistency. In the proof-based strategy, we are not directly proving consistency but a specific statement about the other program. The cooperation relies on the fact that the system can prove the necessary statement about the other program, which is possible because the programs are symmetric and the statement is not self-referential in a way that triggers incompleteness. However, the sensitivity to the proof bound is reminiscent of incompleteness in that short proofs might not exist for the necessary statement.

  - **Inability to predict a more capable system**: The successor case seems to fit this: a system cannot fully reason about a system of equal or greater power. But in the code-swap game, both systems are equally capable and they do cooperate in the unbounded case. So this diagnosis does not fully capture the phenomenon.

  - **Coordination failure in a game with multiple equilibria**: The Prisoner's Dilemma has a unique dominant-strategy equilibrium (both defect) but in this setting, the proof-based strategy allows cooperation. However, the issue is not just about multiple equilibria because the cooperation is achieved through logical reasoning, and the failure at low bounds is due to a lack of proof, not a lack of coordination.

  ### The Underlying Pattern:

  This pattern is best described as **modal agents in logical games** or **program equilibrium via proof-based reflection**. The key mechanism is the use of a formal system to reason about the other agent's behavior. The phenomenon is an instance of **Löb's theorem** and **self-referential trust**.

  Specifically, the proof-based cooperation is an application of **Löb's theorem** (which is a positive counterpart to Gödel's second incompleteness theorem). Löb's theorem states that if a formal system can prove that "if it can prove P then P is true", then it can prove P. In this case:

  - Let A and B be identical programs.
  - A tries to prove that B outputs COOPERATE.
  - B is trying to prove that A outputs COOPERATE.

  By symmetry, if A can prove that B cooperates (which requires that B has a proof that A cooperates), then A cooperates. The fixed point is found via Löb's theorem.

  The name for this in the literature is **program equilibrium** (Tennenholtz, 2004) and more specifically, the **proof-based cooperation** in the Prisoner's Dilemma is discussed by Barasz, Christiano, Fallenstein, Herreshoff, LaVictoire, and Yudkowsky (2014) under the name "Robust Cooperation in the Prisoner's Dilemma". They call the agents **modal agents** because they use modal logic (specifically, the logic of provability).

  In their work, they show that two modal agents (using the same formal system) will cooperate. The sensitivity to the proof bound is because the proof of cooperation might require a long derivation, and if the bound is too low, the proof isn't found.

  The successor case is also related: it is about **self-referential trust**. The problem of one system trusting a successor of equal power is similar to the problem of a system trusting itself. This is again addressed by Löb's theorem: if the system tries to prove that the successor is acceptable, and the successor is identical, then it must prove that it itself is acceptable. But without a prior assumption (like the one provided by Löb's theorem), this is circular.

  ### Boundary Cases:

  - **Inspecting behavior vs. reasoning**: If the agents can only see each other's behavior (i.e., the output) and not the source code, then the proof-based strategy cannot be implemented because the program cannot reason about the other's code. The phenomenon would vanish. The pattern depends on the ability to inspect the source code and reason about it.

  - **Probabilistic agents**: If the agents are probabilistic, then the situation changes. Proofs are about exact behavior. However, one might consider probabilistic proofs or expectations. The core issue of self-referential reasoning might still appear but in a different form.

  - **Weakening the requirement**: If we require only proving that the successor is no worse than inaction, that might be easier. But in the successor case, if the system and the successor are identical, then the same problem arises: the system must prove that the successor is no worse than inaction, which requires proving that it itself (as the successor) is no worse than inaction. Without a way to break the circle, it might still fail.

  - **Shared randomness**: If the agents share correlated randomness or a common random seed, they might use this to coordinate without needing to inspect each other's code. For example, they might both use the random seed to choose a strategy. However, this would be a different mechanism and might avoid the logical circle. The proof-based cooperation does not require shared randomness.

  - **Restricted self-trust rule**: If we restrict the self-trust rule to a specific syntactic class (e.g., only Σ1 statements), then it might avoid inconsistency. In fact, in the successor case, if we restrict the acceptable statements to a class that does not lead to the Löb-like paradox, then it might be possible to have a chain of systems that are each weaker in a controlled way. However, this is exactly the approach of using a descending chain of formal systems.

  ### Conclusion:

  The pattern is best named **proof-based program equilibrium** for the code-swap game and **self-referential trust problem** for the successor case. They are two manifestations of the same core phenomenon: the use of a formal system to reason about oneself or a symmetric counterpart, which is enabled by Löb's theorem and hampered by proof bounds and consistency issues.

  **Name**: Proof-based program equilibrium (for the code-swap) and the self-referential trust problem (for the successor). They are two instances of **Löb's theorem in multi-agent reasoning**.

  **Definition**: A situation in which two or more agents use a formal system to reason about each other's behavior, leading to cooperation if the formal system is sufficiently powerful and consistent, but which is sensitive to the resources (proof length) available and can fail when the agents are too symmetric (as in the successor case) without a way to break the self-referential loop.

  **Instances**:
  - Two proof-based agents in the code-swap Prisoner's Dilemma that cooperate when the proof bound is high enough.
  - A system that cannot verify a successor of equal power without descending to a weaker system.

  **Non-instances**:
  - Ordinary Prisoner's Dilemma without program submission.
  - Coordination games without logical reasoning about the other agent.

  **Nearest miss**: Gödel's incompleteness theorems. While incompleteness explains why the proof might not be found (if the system is too weak), the positive result (cooperation) is due to Löb's theorem, which is a positive result in the same setting. The nearest miss is conflating this with the undecidability of the halting problem, but note that the agents here are not trying to solve the halting problem in general but only for a specific program.

  **Final Answer**:
  The established name for the code-swap case is **program equilibrium via modal agents** (or sometimes "Löbian cooperation"). The successor case is an instance of the **self-referential trust problem** in the context of AI alignment. They are two sides of the same coin: the use of provability logic in multi-agent systems. The pattern depends critically on the agents having access to each other's source code (or reasoning process). Without that, the proof-based strategy is not possible. The pattern does survive with probabilistic agents if we interpret the proofs in a probabilistic setting (e.g., proving high probability of cooperation), but that is less studied. Shared randomness might break the deadlock in the bounded case but is a different mechanism. Restricting the self-trust rule might help in the successor case but at the cost of expressiveness.

  In the literature, the code-swap game is often called the "program game" or "open-source game". The key references (which you asked not to be given as a reading list, but for the record) are:
  - Barasz, M., et al. (2014). "Robust Cooperation in the Prisoner's Dilemma: Program Equilibrium via Provability Logic". 
  - Tennenholtz, M. (2004). "Program equilibrium".

  But the core concept is the application of Löb's theorem in game theory.

  If you were to give it a new name, it might be "Löbian equilibrium" for the game and "Löbian obstacle" for the successor case. However, the existing names are more standard.
answer: |-
  ### The Pattern: Löbian Cooperation and the Self-Referential Trust Problem  
  The phenomenon you describe is a unified pattern centered around **self-referential reasoning in formal systems**, specifically leveraging **Löb's theorem** to resolve circular dependencies. It is distinct from the diagnoses offered and has established roots in **modal agents**, **program equilibrium**, and **logical decision theory**. The code-swap game and the successor case are two manifestations of the same core phenomenon: **agents using provability logic to coordinate when reasoning about themselves or symmetric counterparts**.  

  #### Key Names and Boundaries  
  1. **Established Name**:  
     - **Löbian Cooperation** (for the code-swap game) and the **Self-Referential Trust Problem** (for the successor case). These are not distinct phenomena; both are instances of **provability-based fixed-point reasoning**.  
     - **Boundaries**:  
       - **Core**: Agents use a consistent formal system (e.g., PA) to reason about their own or others' behavior, requiring Löb's theorem to resolve self-reference.  
       - **What It Is Not**:  
         - **Not undecidability (Rice's theorem)**: Undecidability concerns algorithmic impossibility across all programs. Here, cooperation succeeds when proofs exist (i.e., it’s a constructive, instance-specific solution).  
         - **Not textbook incompleteness**: Incompleteness says "some truths are unprovable," but here the system *does* prove the key statement (cooperation) via Löb’s theorem—a positive use of self-reference.  
         - **Not incapacity to predict superior systems**: Both agents are identical (equally capable). The problem arises from symmetry, not superiority.  
         - **Not a generic coordination failure**: The cooperation is unique to logical proof-based strategies. Randomness or cheap talk won’t resolve it; only proofs break the symmetry.  

  2. **Why the Diagnoses Fail**:  
     - **Undecidability/incompleteness**: These are limitations, but your agents *succeed* when proofs are found. The surprise is that self-reference enables cooperation, which contradicts naive expectations from Gödel.  
     - **Prediction incapacity**: The successor is identical, not superior. The issue is self-trust, not capability gaps.  
     - **Coordination failure**: Multiple equilibria exist (e.g., both defect), but proof-based cooperation is a *uniquely stable equilibrium* under unbounded reasoning. The failure at low bounds is due to proof space constraints, not coordination.  

  #### Boundary Cases: Where the Pattern Holds or Fails  
  1. **Inspect Behavior Only (Not Reasoning)**:  
     - **Vanishes**. If agents see only actions (not source code), the pattern collapses. Cooperation requires inspecting the other’s *reasoning process* (source code). Example: If programs output actions without exposing logic, mutual defection prevails—no proof can be constructed.  
     - *Why*: The proof depends on verifying the opponent’s *algorithm*, not just its output.  

  2. **Probabilistic Agents or Weakened Requirements**:  
     - **Survives with modifications**:  
       - **Probabilistic agents**: If programs output probabilities (e.g., "COOPERATE with prob \( p \)"), cooperation fails. Proofs require certainty; probability introduces unprovable noise.  
       - **Proving "no worse than inaction"**: Cooperation *still fails* for the successor case. The system must prove "my successor is no worse," but if the successor is identical, this reduces to proving "I am no worse"—a circularity that Löb’s theorem alone resolves (and requires full self-trust).  
     - *Why*: Löb’s theorem requires definite statements (e.g., "prints COOPERATE"). Approximations break the proof.  

  3. **Shared Randomness or Correlated Seeds**:  
     - **Breaks the pattern**. If agents share randomness, they can coordinate without proofs (e.g., "if shared seed = 0, cooperate; else defect"). This sidesteps self-reference entirely.  
     - *Why*: The pattern relies on *deductive reasoning* about the opponent. Randomness enables coordination without deduction.  

  4. **Restricted Self-Trust (Syntactic Limits)**:  
     - **Mitigates the successor case but not code-swap**:  
       - If self-trust is restricted to \(\Sigma_1\) statements (e.g., "this program halts"), the successor can sometimes be verified. However, in code-swap, cooperation still requires proving a \(\Pi_1\) statement ("the other cooperates"), which remains vulnerable to bound sensitivity.  
       - **Critical point**: Restricting self-trust avoids inconsistency (proving everything) but sacrifices power. The descending-chain "solution" is a workaround, not a fix.  

  #### Why the Phenomena Are Unified  
  - **Code-swap cooperation** and **successor certification** both hinge on:  
    1. **Self-reference**: Agent A’s actions depend on Agent B’s reasoning about A.  
    2. **Löb’s theorem**: Enables positive self-reference: "If I can prove this, it must be true."  
    3. **Consistency requirement**: Systems must be consistent for proofs to work.  
    4. **Sensitivity to resources**: Proof bounds or weakening formal systems mirror computational limits.  

  - **Differences in manifestation**:  
    - Code-swap: Löb’s theorem enables cooperation (positive outcome).  
    - Successor: Löb’s theorem is insufficient without stratification (negative outcome).  

  #### Nearest Miss: Löb’s Theorem vs. Gödel’s Incompleteness  
  - **Most common conflation**: Gödel’s incompleteness theorems.  
    - **How they differ**:  
      - Gödel shows certain truths *cannot* be proven.  
      - Löb’s theorem shows that **provability implies truth** (a positive mechanism). Your agents use this to resolve circularity.  
    - **Why it matters**: In code-swap, cooperation works *because* of Löb’s theorem; in the successor case, failure arises when Löb’s theorem *cannot be applied* (e.g., without stratification). Gödel explains why the proof might be long (incompleteness), but Löb explains why it succeeds at all.  

  #### Proposed Name and Definition  
  If existing terminology feels inadequate:  
  - **Name**: **Löbian Circularity**  
  - **Definition**: A scenario where agents in a symmetric, self-referential setting (e.g., program equilibrium or successor trust) use a consistent formal system to reason about each other’s behavior, with outcomes determined by whether Löb’s theorem can construct a fixed point.  
  - **Instances**:  
    - Two proof-based agents cooperating in the code-swap PD.  
    - A system failing to verify an equally capable successor.  
    - A generative model that cannot justify its own inferences (e.g., "this sentence is true").  
  - **Non-Instances**:  
    - Undecidable properties (e.g., Rice’s theorem applications).  
    - Incompleteness-limited but non-circular proofs.  
    - Coordination games with random or correlating devices.  
  - **Nearest Miss**: Gödelian limitations (focuses on unprovability, not constructive self-reference).  

  ### Summary  
  - **Pattern**: Löbian Cooperation (code-swap) and Self-Referential Trust Problem (successor) are one phenomenon: **self-reference resolved via provability logic**.  
  - **Boundaries**: Requires access to reasoning (source code), vanishes with behavior-only inspection. Survives probabilistic/weakened setups only if proofs retain certainty. Broken by shared randomness.  
  - **Core Mechanism**: Löb’s theorem enables positive outcomes from self-reference; sensitivity to bounds arises from proof complexity, not undecidability.  
  - **Diagnosis Rebuttal**: Not undecidability/incompleteness (proofs work when bounds allow); not incapacity (agents are symmetric); not coordination failure (proofs create unique equilibrium).  

  This pattern reveals the **duality of self-reference**: it enables cooperation when Löb’s theorem is applicable but cripples trust when stratification is impossible. If you formalize this further, I recommend exploring "Löbian handshakes" (for mutual cooperation) and "stratified Löb hierarchies" (for successor cases).
