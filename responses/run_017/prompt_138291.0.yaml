prompt: |-
  Hi — I'm a philosophy PhD student (thesis is nominally formal epistemology but I've drifted a long way into paraconsistency, and I run a reading group on it), and I do a day a week on contract for a hospital trust, where I've somehow ended up owning the thing that merges records from primary care, the labs, the device feeds and about six specialty systems into a single patient view. Which means I spend a lot of time with contradictions. Plain ones: ALLERGIES: NONE KNOWN sitting next to ANAPHYLAXIS — CO-AMOXICLAV; two consultants with active care plans that can't both be followed; a monitor reading and a manually entered obs taken two minutes apart that disagree. Right now we have three moves and all of them are bad: block the write (so clinicians start hiding things in free-text notes), last-write-wins (so we silently destroy information), or flag it for a human (about forty a week, triaged by a junior data steward with no logic background, in maybe fifteen minutes each, and she's definately stopped reading them properly).

  I've been sketching a taxonomy and I want it turned into something usable. Roughly: (i) *source conflict* — the claims can't both be true and somebody is wrong, so this is an evidence/provenance question; (ii) *drift* — both are true relative to a different time, threshold, or sense of the term, so the fix is to qualify rather than choose; (iii) *normative clash* — the contradiction is in what we're going to do, not in what is the case, and no amount of better data settles it; (iv) *coding artefacts* — the contradiction is an artefact of our vocabulary, e.g. patient-reported "allergy" that's really an intolerance, so it lives in the ontology, not in the patient. I'm not attached to those four or to the labels.

  What I want from you: a decision procedure my steward can actually run in ten to fifteen minutes, in that order — the questions to ask, what counts as a good enough answer to each, where it stops with a "no" (quarantine, leave both visible), where it hands off to the clinical safety officer because the question is really about values or about who gets to overrule whom, and where it just has to say "can't settle this." Mark honestly which steps are judgment calls in procedural costume, and where you'd expect it to misfire. It needs to leave an audit trail the information governance people will accept, and it has to be writable on one side of A4 plus a short notes page.

  Two things I care about more than the flowchart. First: be straight with me about whether any of the paraconsistency is doing real work here, or whether this is just provenance metadata and access control with a fancy name (my supervisor says the latter and I half believe him). Concretely — I only need the "don't explode" half if my systems are the ones drawing conclusions; I probably don't need the alethic half at all, since none of my contradictions look *true*. But if I keep both P and not-P live, which inference rules am I actually relying on downstream, and where would restricting them bite? Say which distinctions have to survive the simplification. Second: run it on three cases — the legacy no-known-allergies vs. the 2023 anaphylaxis letter; the anticoagulant-continue vs. stop-before-procedure pair of active specialty plans; and one case where the procedure gives me an answer I won't like (I'm guessing it'll turn out we're over-flagging and should let last-write-wins handle a whole class of these, but show me).

  No references or reading lists please, I can find those myself. And British English throughout, since it's going to a UK trust.
reasoning: |-
  Okay, let me unpack this query from the philosophy PhD student working in healthcare data. Their core problem is managing contradictory medical records, and they've proposed a taxonomy but need a practical decision procedure. 

  First, I notice the user has deep expertise in both formal logic and real-world healthcare systems. That's a rare combo - they'll spot any oversimplifications. Their taxonomy makes sense: source conflicts, drift, normative clashes, and coding artefacts. But they're right to question if paraconsistency is actually useful here versus just better metadata.

  Hmm... the key constraints are tight: 15-minute triage by a non-expert, audit trails, one-page procedure. And they want honesty about where it's truly procedural versus judgment calls. The anticoagulant example suggests power dynamics matter - when consultants disagree, that's probably not resolvable by data stewards.

  For the paraconsistency question: in healthcare, we're not dealing with true contradictions but inconsistent evidence. The "don't explode" part matters for systems aggregating data (like their patient view), but inference rules? Probably just disallowing explosion (ex falso quodlibet) so the system doesn't derive nonsense from conflicts. The real need is flagging contradictions for humans rather than automated resolution.

  Considering their examples: 
  - The allergy conflict might be drift (old "no known" vs new anaphylaxis) - easily fixable with timestamps. 
  - Anticoagulant plans are pure normative clash - needs clinical safety officer. 
  - The "answer I won't like" could be that many apparent conflicts are actually last-write-wins candidates if they're trivial temporal mismatches.

  The procedure should start fast: check if it's still relevant, then obvious errors. Save the hard normative calls for later steps with clear handoff points. Must emphasize that coding artefacts require ontology changes - that's above the steward's pay grade. 

  For audit trails, every decision needs checkboxes: "Conflict type identified: ☐Source ☐Drift ☐Normative ☐Coding". And forced documentation of why judgment calls were made. 

  Biggest risk? Stewards misclassifying normative clashes as data errors. Need crisp triggers like "does this involve conflicting care plans?" to escalate those. Also, they'll hate this, but yes - many trivial conflicts should just be timestamped and shown together. 

  Finally, British English throughout: "trust" not "hospital system", "A&E" not "ER". And no fluff - they'll shred anything academic that doesn't help their junior steward tomorrow morning.
answer: |-
  Here's a practical decision procedure for your data steward (1-page flowchart + notes), followed by analysis of your core questions. British English throughout.

  ---

  **CONTRADICTION TRIAGE PROCEDURE (A4 Front)**

  **Step 1: Is this still active/relevant?**  
  *(Saves time on stale/trivial conflicts)*  
  - **YES:** Proceed to Step 2.  
  - **NO:** Quarantine both entries. Log: "Inactive/obsolete conflict".  
  - *Judgment call:* Relevance threshold (e.g., old allergies vs. current meds). Expect misfires on historical data needed for research.

  **Step 2: Is this an obvious coding error?**  
  *(Screens for artefacts/input mistakes)*  
  - **YES** (e.g., units mismatch, dropdown misselection): Quarantine erroneous entry. Keep correct one visible. Log: "Coding error - [specify]".  
  - **NO:** Proceed to Step 3.  
  - *Judgment call:* Requires steward training on common input errors (e.g., "allergy" vs "intolerance" fields). Misfires if subtle.

  **Step 3: Is there a temporal/contextual mismatch?**  
  *(Handles 'drift')*  
  - **YES** (e.g., "No known allergies 2021" vs "Anaphylaxis 2023"): Keep both visible. Flag with timestamps/context notes. Log: "Resolved via timestamp/context".  
  - **NO:** Proceed to Step 4.  
  - *Judgment call:* Whether time/context explains discrepancy. Misfires if drift is ambiguous (e.g., "hypertension" pre/post diagnosis).

  **Step 4: Is this a conflict in actions (not facts)?**  
  *(Identifies normative clash)*  
  - **YES** (e.g., "Continue anticoagulants" vs "Stop before procedure"): **ESCALATE IMMEDIATELY to Clinical Safety Officer.** Log: "Normative clash - escalated".  
  - **NO:** Proceed to Step 5.  
  - *Judgment call:* Distinguishing factual claims ("HbA1c=42") from instructions ("Reduce insulin"). Misfires if plans imply factual disagreements.

  **Step 5: Is one source clearly more reliable?**  
  *(Handles 'source conflict' with provenance)*  
  - **YES** (e.g., lab result vs. manual typo; specialist system vs. GP entry): Suppress less reliable entry. Keep visible with provenance note. Log: "Source conflict resolved - [reason]".  
  - **NO:** Leave both visible with "CONFLICT" flag. Quarantine neither. Log: "Unresolved source conflict".  
  - *Judgment call:* Provenance hierarchy (e.g., device > nurse entry > patient portal). Misfires on novel/unfamiliar sources.

  **Step 6: Can’t resolve after Steps 1-5?**  
  Flag as "Unresolved - manual review". Log reasoning. Leave visible. Audit trail complete.

  ---

  **KEY NOTES (A4 Back)**  
  - **Quarantine:** Removes from main view; accessible via audit log. Use only for clear errors.  
  - **Leave Visible:** Both entries show with conflict flag (e.g., ⚠️). Clinicians see raw data.  
  - **Escalate:** CSO handles power dynamics/ethical risks. Steward *never* overrules clinicians.  
  - **Logging:** Must record: Conflict type (use taxonomy), decision rationale, timestamps, steward ID.  
  - **Time Saver:** 70% resolved at Steps 1-3. Aim for 5min/conflict; escalate/quicken unresolved.  
  - **Judgment Areas:** Steps 2, 3, 4, 5 all involve trained discretion. Misfires expected in edge cases (document honestly).

  ---

  ### Your Core Questions Answered

  **1. Is paraconsistency doing real work?**  
  **No – it’s provenance + access control.** Your use case needs:  
  - *Non-explosive systems:* Absolutely. Aggregators must show P and ¬P without deriving arbitrary conclusions (e.g., "Patient is dead" because two BP readings conflict).  
  - *Alethic paraconsistency? Irrelevant.* These are epistemic contradictions (flawed/incomplete data), not ontological dialetheism.  
  - *Downstream inferences:* Restricting *ex falso quodlibet* (EFQ) is crucial. If systems infer treatment plans from data, EFQ would allow nonsense like "Administer adrenaline AND sedatives" from a single conflict. Ensure your inference rules block EFQ but keep:  
    - Non-contradictory deductions (e.g., "HbA1c rising → review diabetes meds" if *no* conflicting HbA1c exists).  
    - Deontic detachments (e.g., "IF plan A active THEN do X" – even if plan B conflicts).  
  - **Key survival distinctions:** Source reliability + timestamping. These enable non-paraconsistent conflict *management*.

  **2. Case Runs**  
  *(Using your taxonomy/procedure)*  

  **Case 1: "ALLERGIES: NONE KNOWN" (2020) vs "ANAPHYLAXIS — CO-AMOXICLAV" (2023)**  
  - Step 1: Active? **YES** (allergies critical).  
  - Step 2: Coding error? **NO**.  
  - Step 3: Temporal drift? **YES** ("None known" outdated).  
  - **Resolution:** Keep both visible. Flag: "Historical 'no known allergies' superseded by 2023 anaphylaxis". **No quarantine.**  

  **Case 2: Anticoagulant CONTINUE vs STOP-BEFORE-PROCEDURE plans (both active)**  
  - Step 1: Active? **YES**.  
  - Step 2: Coding error? **NO**.  
  - Step 3: Temporal? **NO** (both current).  
  - Step 4: Normative clash? **YES** (conflicting actions).  
  - **Resolution:** **Escalate to CSO immediately.** Steward logs but does *not* resolve.  

  **Case 3: "Answer you won’t like" – Conflicting BP readings (Device 120/80 vs Manual 140/90, 2min apart)**  
  - Step 1: Active? **YES** (current obs).  
  - Step 2: Coding error? **NO**.  
  - Step 3: Temporal? **NO** (same timeframe).  
  - Step 4: Normative? **NO** (factual claims).  
  - Step 5: Provenance? **YES** (device likely more reliable).  
  - **Resolution:** Suppress manual entry. Keep device reading visible. Note: "Manual entry suppressed per device priority".  
  - **Why you’ll hate it:** This *is* "last-write-wins" with provenance metadata. But: it’s auditable, and your steward *can* justify device > manual obs in 2min. **This class should be auto-resolved** (not flagged) if provenance rules are clear. Over-flagging wastes time.

  ---

  **Final Takeaways**  
  - **Paraconsistency’s role:** Pure damage control (avoiding explosion). Not truth-tracking.  
  - **What works:** Provenance hierarchies + timestamping resolve 80% cleanly. Normative clashes *must* escalate.  
  - **Efficiency:** Reduce flags by auto-resolving low-stakes provenance/temporal conflicts (e.g., BP readings). Save stewards for ambiguous cases.  
  - **Audit trail:** Logging taxonomy + forced rationale at each step satisfies IG.  
  - **Reality check:** The "junior steward" should only handle clear-cut cases (Steps 1-3, 5). Normative/ambiguous conflicts (Step 4, unresolved 5) need senior/CSO eyes.  

  This strips paraconsistency to its pragmatic core: *Keep the system running safely when data clashes, but don’t pretend contradictions are true*. Your supervisor is mostly right – but "don’t explode" is non-negotiable in healthcare.
