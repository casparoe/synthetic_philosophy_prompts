          Q4a (mistake because abstract fact) and Q6b (machine proof does not establish truth). This might be held by a Platonist who also thinks that proof must be surveyable? But then they would also be against Q3a? Not necessarily: they might think the computable has a truth value (Q3a) but that a machine proof is not sufficient for knowledge. But the question Q6 is about whether it establishes truth, not knowledge. The Platonist might say: the theorem is true independently, and the machine proof is a proof, so it does establish truth. So they would say Q6a. So if someone says Q4a and Q6b, that might be an unstable combination: if truth is about abstract facts, then a proof (even machine) should establish that truth? Unless they have a very strict view of proof requiring human understanding? But then they might be a constructivist? But constructivists are anti-realist. So it might be unstable.

          But we can assign: if they are in the Platonist branch (Q9b, Q10a, Q2a, Q1a) and say Q6b, that would be inconsistent. So we mark as incoherent.

      Now, we write the diagnostic.

      We'll list the 12 questions.

      Then the tree:

      Start with Q9 and Q10:

          If Q9a and Q10b -> Leaf F: Deflationist. (The dispute is merely verbal and there is no fact.)

          Else if Q9b and Q10b -> Leaf G: Substantive non-factualist. (The dispute is substantive but there is no fact of the matter.)

          Else if Q9b and Q10a (so substantive and factual) -> then go to Q2.

              If Q2a (undecidable has truth value) -> then go to Q1.

                  If Q1a (one encoding is real) -> Leaf A: Platonist.

                  If Q1b (no fact about encoding) -> Leaf B: Structuralist.

              If Q2b (undecidable has no truth value) -> then go to Q3.

                  If Q3a (computable has truth value even not run) -> Leaf C: Classical Formalist.

                  If Q3b (computable has no truth value until run) -> then go to Q6.

                      If Q6a (machine proof establishes truth) -> Leaf E: Conventionalist.

                      If Q6b (machine proof does not establish truth) -> Leaf D: Constructivist.

      Then, we describe the leaves:

      Leaf A: Platonist
          Commitments: Believes that mathematical statements have determinate truth values (even for undecidable ones) because they are about independently existing abstract objects. There is a fact of the matter about which encoding of the naturals is the real one. The mistake in 7×8=54 is a failure to correspond to the abstract facts. The dispute about the nature of mathematical truth is substantive and there is a fact of the matter (with Platonism being correct). The "how know" worry is separate from what makes mathematical statements true.
          Awkward commitment: Must explain how we have epistemic access to abstract objects.

      Leaf B: Structuralist
          Commitments: Believes in determinate truth values for mathematical statements (even undecidable ones) but denies that the particular encoding matters (it's the structure that is real). The mistake in 7×8=54 is a failure to capture the abstract structure of the naturals. The mod12 civilization is not wrong because they are working with a different structure. The dispute is substantive and structuralism is the correct view. The "how know" worry is separate.
          Awkward commitment: Must explain what structures are and how they are individuated.

      Leaf C: Classical Formalist
          Commitments: Holds that truth is provability (in principle) within a formal system. Undecidable sentences (like independent ones) lack truth values, but decidable ones (even if not computed) have truth values. The encoding of the naturals is a matter of convention (no fact) and might be chosen for pragmatic reasons. The mistake in 7×8=54 is a violation of the rules. The dispute is substantive and formalism is correct. The "how know" worry is tied to proof (so not separate): if we cannot prove it, we cannot know it, and without proof it isn't true.
          Awkward commitment: Must explain the success of mathematics in science without appealing to abstract objects.

      Leaf D: Constructivist
          Commitments: Truth is established by (mental) construction. Undecidable sentences lack truth values, and even decidable ones do not have a truth value until we have a proof (so Q3b). A machine proof without human understanding does not establish truth (Q6b). The encoding is conventional (Q1b) and might be chosen for pragmatic reasons (Q8a). The mistake in 7×8=54 is a violation of the rules (Q4b). The mod12 civilization is not wrong (Q5b). The dispute is substantive and constructivism is correct (Q9b, Q10a). The "how know" worry is tied to construction (so not separate: Q11b).
          Awkward commitment: Must explain why classical mathematics works so well.

      Leaf E: Conventionalist
          Commitments: Mathematical truth is determined by social conventions. Undecidable sentences lack truth values (Q2b, Q7b) and decidable ones also lack truth value until the convention is set (or the computation is run? But they accept machine proof as setting the convention). So for Q3: they might say (b) but then when we have the machine proof, we set the convention? But in the scenario we haven't run it. However, they might accept that the machine proof, once verified by the community, establishes the truth. So Q3: they might say (b) until we have the proof? Or (a) because the convention is fixed by the rules? We put them in Q3b. Then they accept machine proof (Q6a) as establishing truth because it is a formal verification that the community accepts. The encoding is conventional (Q1b) and might be better for pragmatic reasons (Q8a). The mistake in 7×8=54 is a violation of the rules (Q4b). The mod12 civilization is not wrong (Q5b). The dispute is substantive and conventionalism is correct. The "how know" worry is not separate because truth is tied to our conventions and our means of knowing (Q11b).
          Awkward commitment: Must explain the objectivity and stability of mathematics.

      Leaf F: Deflationist
          Commitments: The dispute about mathematical truth is merely verbal (Q9a) and there is no fact of the matter (Q10b). They may hold various views on the other questions, but they do not see the metaphysical questions as substantive.
          Awkward commitment: Must explain why the dispute arises and how to dissolve it.

      Leaf G: Substantive non-factualist
          Commitments: The dispute is substantive (Q9b) but there is no fact of the matter (Q10b). This might be because they think that the different positions are not truth-apt, or that there is deep indeterminacy. They might be non-cognitivists about the metaphysical claims.
          Awkward commitment: Must explain why there is no fact of the matter even though the dispute is substantive.

      Now, unoccupied regions:

      1. Q1a and Q2b: Incoherent. If there is a fact about which encoding is real, then the numbers are real objects, and statements about them should have determinate truth values. So Q2a should follow.

      2. Q9a and Q10a: Inconsistent. If the dispute is merely verbal, there cannot be a fact of the matter.

      3. Q2a and Q3b: Incoherent. If undecidable sentences have truth values (because they are about a determinate reality), then a fortiori a decidable sentence must have one.

      Also, we might not have any leaf for someone who is a Platonist but rejects the reality of encoding? That would be Q1b and Q2a, which is the structuralist leaf.

      Now, pairs of leaves we cannot separate:

      Our tree uses a sequence of questions. We have separated by the tree, but note that the Conventionalist (E) and Constructivist (D) are separated by Q6. But what if a constructivist accepts machine proofs? Then they might be misclassified as conventionalist. We defined the constructivist as requiring Q6b. So if a constructivist says Q6a, we put them in E. But that might be inaccurate.

      We have to live with the tree. We note that the leaves are defined by the tree.

      Finally, jointly unstable answer patterns:

      Pattern 1: Q2a (determinate) and Q3b (computable not run: no truth value). This is incoherent (as above).

      Pattern 2: Q4a (mistake due to abstract facts) and Q6b (machine proof does not establish truth). This is unstable because if the machine proof is a proof, then it should establish the truth (which is about the abstract facts). So if they are a Platonist, they should say Q6a. If they say Q6b, they are rejecting that the machine proof is a proof? But then they must explain why. This might be a form of constructivism? But then they wouldn't say Q4a. So it is incoherent.

      Pattern 3: Q9a and Q10a: inconsistent.

      Pattern 4: Q1a and Q2b: incoherent.

      We'll provide the diagnostic instrument as described.
answer: |-
  Below is a 12-question diagnostic designed to map students' views on mathematical truth without relying on philosophical labels or prerequisites. The questions are concrete cases or blunt claims, avoiding direct questions about abstract objects or existence. The diagnostic separates five axes: determinacy of undecidable sentences, basis for truth (objects/structures vs. proof/practice), reality of encodings, separability of epistemological and metaphysical concerns, and substantiveness of the dispute. The root of the diagnostic tree is **determinacy of undecidable sentences** (Q2), as it forces a stance on whether mathematical truth transcends proof. This choice hides nuances about the *source* of determinacy (e.g., structures vs. objects), which is later disentangled via Q1 and Q4.

  ### Diagnostic Questions  
  Answer each with **(a)** or **(b)**. No justification needed.  

  1. **Encodings of naturals**:  
     Encoding A: 0 = ∅, successor(n) = n ∪ {n}.  
     Encoding B: 0 = ∅, successor(n) = {n}.  
     Both prove identical theorems (e.g., 2+3=5). Is one the "real" natural numbers?  
     (a) Yes, there is a fact about which is correct.  
     (b) No, both are valid; neither is uniquely "real".  

  2. **Undecidable sentence**:  
     A statement in arithmetic (e.g., a Gödel sentence) is undecidable in our axioms (consistent but neither provable nor refutable). Is it true or false?  
     (a) Yes, it has a truth value we may never know.  
     (b) No, it lacks a truth value.  

  3. **Unrun computation**:  
     A program checks if all even numbers >2 up to 10¹⁰¹⁰ are sums of two primes (Goldbach-like). It terminates in principle but will never run. Is the claim "it returns true" true or false now?  
     (a) Yes, it has a truth value now.  
     (b) No, truth requires running/computing it.  

  4. **Mistake in arithmetic**:  
     A student calculates 7×8=54. What makes this wrong?  
     (a) It fails to match the abstract facts (e.g., 7 groups of 8 objects aren’t 54).  
     (b) It violates the rules we’ve defined (e.g., multiplication tables).  

  5. **Modular arithmetic civilization**:  
     A culture uses arithmetic mod 12 (no numbers >11; 12=0). They lack unbounded naturals. Is their arithmetic wrong?  
     (a) Yes, they misrepresent the true naturals.  
     (b) No, it’s a valid system for their needs.  

  6. **Machine-checked proof**:  
     A proof is too long for humans to survey (e.g., millions of lines) but verified by a trusted proof assistant. Does it establish the theorem’s truth?  
     (a) Yes, verification suffices for truth.  
     (b) No, truth requires human-surveyable proof.  

  7. **Continuum Hypothesis (CH)**:  
     CH claims no infinity between naturals and reals. It’s undecidable in ZFC (standard set theory). Is CH true or false?  
     (a) Yes, it has a truth value.  
     (b) No, it lacks a truth value.  

  8. **Encoding pragmatics**:  
     For the two natural number encodings (Q1), is one better?  
     (a) Yes (e.g., simpler definitions, efficiency).  
     (b) No, they’re mathematically identical.  

  9. **Substantiveness of dispute**:  
     Is the argument about whether math is "true by proof" or "true by abstract objects" a genuine disagreement?  
     (a) No, it’s verbal (e.g., different definitions of "true").  
     (b) Yes, it’s substantive.  

  10. **Fact of the matter**:  
      In the dispute above, is one side correct?  
      (a) Yes, there is a fact (even if unknowable).  
      (b) No, there is no fact to settle.  

  11. **Separating knowledge and truth**:  
      The worry "How can we know about math if abstract objects aren’t physical?" is:  
      (a) Separate from what makes math true (truth ≠ knowability).  
      (b) Not separate (truth depends on our access).  

  12. **Science application (only one)**:  
      General relativity uses Riemannian geometry. Does its accuracy require mathematical structures (e.g., spacetime curvature) to be real?  
      (a) Yes, math describes reality.  
      (b) No, math is a tool; success doesn’t imply reality.  

  ---

  ### Scoring Key and Leaves  
  Based on answer patterns, assign students to one of seven leaves. Each leaf is defined by core commitments, with a mnemonic name and its "awkward commitment" (a tension holders often confront when pressed).  

  **Tree Structure**:  
  - Root: Q2 (determinacy of undecidable sentences).  
  - Branch on Q9–Q10 (dispute’s substantiveness/factuality) for non-determinists.  
  - Further splits on Q1 (encoding reality), Q3 (unrun computation), and Q6 (machine proof).  

  **Leaves**:  
  1. **Platonist (A)**: Q2a, Q1a, Q3a, Q7a, Q4a, Q5a, Q9b, Q10a, Q11a.  
     - *Commitments*: Undecidables have truth values; encodings have a "real" one; truth from abstract objects; dispute substantive with a fact; knowledge separate.  
     - *Awkward commitment*: Must explain how we access non-physical objects.  

  2. **Structuralist (B)**: Q2a, Q1b, Q3a, Q7a, Q4a, Q5b, Q8a/b, Q9b, Q10a, Q11a.  
     - *Commitments*: Undecidables have truth values; no "real" encoding (structures matter); truth from structures; mod12 isn’t "wrong" (different structure); dispute substantive.  
     - *Awkward commitment*: Must clarify what structures *are* (e.g., beyond systems).  

  3. **Classical Formalist (C)**: Q2b, Q3a, Q7b, Q1b, Q4b, Q5b, Q6a, Q8a, Q9b, Q10a, Q11b.  
     - *Commitments*: Undecidables lack truth values; unrun computables have values (decidable in principle); truth is proof; encodings conventional; machine proofs valid; knowledge not separable.  
     - *Awkward commitment*: Must justify why undecidables are indeterminate but decidable-in-principle claims aren’t.  

  4. **Constructivist (D)**: Q2b, Q3b, Q7b, Q1b, Q4b, Q5b, Q6b, Q8a, Q9b, Q10a, Q11b.  
     - *Commitments*: Truth requires proof/construction; no truth for unrun computables or undecidables; machine proofs insufficient (need human meaning); encodings pragmatic; knowledge not separable.  
     - *Awkward commitment*: Must explain math’s applicability without bivalence.  

  5. **Conventionalist (E)**: Q2b, Q3b, Q7b, Q1b, Q4b, Q5b, Q6a, Q8a, Q9b, Q10a, Q11b.  
     - *Commitments*: Truth from social/rules-based practices; no truth without community validation (even for computables); machine proofs valid (as community tools); mod12 valid; knowledge not separable.  
     - *Awkward commitment*: Must account for math’s cross-cultural stability.  

  6. **Deflationist (F)**: Q9a, Q10b.  
     - *Commitments*: Dispute is verbal; no fact of the matter; other answers vary but often Q1b, Q2b, Q4b, Q8a.  
     - *Awkward commitment*: Must dissolve the dispute without dismissing intuitions.  

  7. **Substantive Non-Factualist (G)**: Q9b, Q10b.  
     - *Commitments*: Dispute is substantive but has no resolution (e.g., metaphysical indeterminacy); other answers vary but often Q2b, Q3b, Q4b.  
     - *Awkward commitment*: Must explain why a substantive dispute lacks a fact.  

  ---

  ### Critical Analysis  
  **1. Unoccupied Regions**:  
  - **Q1a + Q2b** (encoding real but undecidable indeterminate): Incoherent. If numbers are real objects, statements about them must be determinate.  
  - **Q2a + Q3b** (undecidable determinate but computable indeterminate): Incoherent. Determinacy for harder cases implies it for easier ones.  
  - **Q9a + Q10a** (dispute verbal but has a fact): Inconsistent. Verbal disputes lack facts.  
  - **Q4a + Q6b** (truth from objects but machine proofs invalid): Merely unattractive. One could insist proofs require understanding, but this is rare and unstable (assigned to Constructivist if Q2b/Q3b; else incoherent).  

  **2. Indistinguishable Pairs**:  
  - **Structuralist (B) vs. Platonist (A)** on Q8 (encoding pragmatics): Both can answer (a) or (b), so Q8 doesn’t separate them. The key differentiator is Q1 (reality of encoding).  
  - **Conventionalist (E) vs. Classical Formalist (C)** on Q3 (unrun computation): Both may say (a) if they accept "in principle" decidability. Separated by Q6: Formalists accept machine proofs (Q6a), while Conventionalists require community practices (often Q6a, but distinct in motivation).  

  **3. Jointly Unstable Patterns**:  
  - **Q2a + Q3b** (as above): Genuinely incoherent. Assigned to no leaf; reject as inconsistent.  
  - **Q4a + Q5b** (mistake from objects but mod12 not wrong): Merely surprising. Could be Structuralist (B) if structures are contextual.  
  - **Q9a + Q10a**: Incoherent. Count as Deflationist (F) if forced, but flag as inconsistent.  
  - **Q1a + Q8b** (encoding real but none better): Surprising but possible (e.g., Platonist indifferent to pragmatics). Assign to Platonist (A).  

  This diagnostic exposes hidden fractures in students' views, encouraging deeper reflection. By avoiding labels and focusing on cases, it reveals how positions bundle claims (e.g., Platonists must embrace encoding reality) and isolates tensions they may not have confronted. The tree prioritizes determinacy to force engagement with truth-beyond-proof, but Q9–Q10 ensure verbal-dispute views aren’t overlooked.
