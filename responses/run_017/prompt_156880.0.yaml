prompt: |-
  So I got roped onto the arts commission of the town I live in (I'm a PhD student, I work on Rousseau's political thought — mostly the Discourse on Inequality, though I've read the letter to d'Alembert a few times — and of course my neighbor nominated me the second a theatre funding fight looked like it was coming). Here's where things stand. Two applications for the same pot, about 40k total. One is from a small professional company that wants to convert a disused warehouse into a 90-seat indoor house: ticketed subscription season, four plays, proscenium, dark auditorium, paying actors who'd commute in from the city. The other is from a loose collective of local teachers and two semi-professional performers for a summer of site-specific pieces staged in the market square and along the old ramparts — mostly amateur casts drawn from the town, free admission, no fixed seating, the audience walks after the action, and every night ends with a communal meal. The town is about 7,000 people, fairly homogeneous, and extremely pleased with itself about being self-governing.

  The reason this has landed on me is that one commissioner — a retired history teacher, and not a fool — has started arguing that Rousseau thought a republic shouldn't have a theatre at all: that theatre softens a people, gives them a taste for spectacle in place of participation, and sets up a class of people whose trade is pretending to be someone else. She's now saying that if we take that seriously we should also look again at the small amateur company we already fund. My own half-baked attempt to make it precise is a three-part test — whether the audience is visible to itself and to each other or hidden in the dark; whether the performers are a separate paid class or just us; whether the thing is something you consume or something you do — but I'm not sure the test tracks anything moral rather than just my own taste, and I also don't want us funding the festival purely because it flatters a 18th-century text.

  Can you draft the memo I'll circulate before the meeting? Concrete bottom line please — fund one, fund both, split it with conditions, whatever, with a number and a time frame — and then the reasoning, including a real paragraph on the strongest thing on the losing side, including the strongest version of the "and therefore defund what we already fund" move and whether it survives. Two constraints: no citations, reading lists, or named scholars, since I need sentences I can say out loud in a room rather than footnotes; and don't rest the case on empirical claims about whether theatre actually corrupts mores, because neither of us has any data on that — it has to work as an argument about what the objection is really committed to. If my three-part test is worth keeping, say which way it sorts the two applications and where it's arbitrary; if it's junk, replace it with criteria the commission could actually apply to next year's applications too. Lead with the recommendation in the very first sentence, no preamble and no restating my question back at me.
reasoning: |-
  Okay, the user is on an arts commission in their small town and needs help drafting a memo about funding two theater proposals. They've mentioned their background as a PhD student studying Rousseau, particularly the Discourse on Inequality and the letter to d'Alembert. Their neighbor nominated them because of a theater funding fight. 

  The two proposals are quite different: one is a professional company wanting to convert a warehouse into a 90-seat indoor theater with paid actors, while the other is a community-based summer festival with free performances in public spaces, ending with communal meals. The town has about 7,000 residents who pride themselves on self-governance.

  The key issue is that one commissioner is using Rousseau's arguments against theater to oppose both proposals and even question existing funding. The user tried creating a three-part test about audience visibility, performer status, and participatory nature, but isn't sure if it's valid.

  I need to draft a memo with a concrete recommendation first - no preamble. The constraints are: no citations or scholarly names (since they need to speak this aloud), and no empirical claims about theater corrupting morals (since there's no data). I should evaluate their three-part test and either improve it or replace it with better criteria for future decisions.

  For the recommendation, I should consider funding one, both, splitting, etc., with specific numbers and timeframes. Then provide reasoning that addresses the Rousseau objection honestly, including the strongest version of the "defund existing" argument and whether it holds up.

  The user's deeper needs seem to be: resolving this fairly without academic pretentiousness, maintaining commission unity, establishing sustainable criteria beyond this case, and handling Rousseau's arguments thoughtfully without letting 18th-century ideas dictate modern decisions. They also need practical governance tools that respect the town's self-governing pride.

  I think splitting the funds makes sense - supporting both initiatives partially. This honors the community-participation values in the festival while acknowledging professional theater's cultural role. The existing company funding should continue since it's already integrated and the extreme "defund" position isn't practical or necessary when applying Rousseau consistently.

  For the three-part test, I'll refine it into clearer criteria: visibility/lighting, performer compensation model, and audience agency. This shows how the festival aligns better with Rousseau's concerns while still being applicable to future proposals. The strongest losing argument (for full festival funding) would be that only radical participation preserves civic virtue, but that's too rigid for modern governance.

  The memo should start bluntly with: "Recommendation: Split the $40,000 allocation..." then unfold the reasoning transparently, showing how even under Rousseau's framework, moderation and community choice matter most. This gives the user a principled but practical tool for the meeting.
answer: |-
  **Recommendation:** Split the $40,000 allocation: grant $15,000 to the professional theatre company (Warehouse Conversion) for one year of seed funding supporting their inaugural season, and $25,000 to the community collective (Summer Festival) for the upcoming summer program, including the communal meals. Re-evaluate both based on community impact and adherence to agreed goals in one year.

  **Reasoning:**

  The core philosophical objection raised – that theatre inherently risks softening civic virtue by promoting spectacle over participation, creating a separate class of performers, and encouraging passive consumption – is a serious one, derived from a specific republican ideal. We must engage with it directly. However, applying it as an absolute ban ignores both the practical reality of our existing cultural commitments and the nuances within different forms of performance.

  1.  **Addressing the Rousseauian Concern:** The strongest version of the objection insists that *any* dedicated theatre, especially one with paid professionals performing for a passive, darkened audience, inherently fosters the vices Rousseau warned against: replacing active citizenship with spectatorship, valuing artifice over authenticity, and creating social division. Extending this logic, it demands we *defund the existing small amateur company* we already support, as it likely operates on a similar (if smaller) professional model. This argument survives scrutiny *if* we accept Rousseau's premise that a republic's survival depends on eliminating *all* such potentially corrupting influences and that *only* purely spontaneous, egalitarian civic festivals embody true community spirit.

  2.  **Why the Strict Ban Doesn't Prevail:** While the objection highlights genuine risks, adopting it as an absolute rule for our town is ultimately untenable and potentially counterproductive. It:
      *   **Ignores Established Practice & Community Expectation:** We already fund a theatre. Abruptly defunding it based on an 18th-century philosophical absolutism, without clear evidence of tangible harm *to our specific community*, would be disruptive and likely seen as arbitrary, damaging trust in the commission.
      *   **Overlooks Nuance:** Not all theatre functions identically. The *context* and *form* matter significantly for its civic impact. A high-priced, exclusive, purely commercial venture poses different risks than accessible community-driven projects or existing local efforts.
      *   **Underestimates Community Agency:** Our citizens are capable of engaging with different cultural forms without automatically abandoning civic duty. Denying them access to professional performance assumes they lack the discernment Rousseau feared theatre would erode.
      *   **Neglects Positive Values:** Professional theatre can offer artistic excellence, skilled craft, challenging ideas, and economic activity. Banning it entirely sacrifices these potential benefits based on a theoretical risk.

  3.  **Evaluating the Proposals: Principles for Decision (Refining the Test):** Your three-part test usefully focuses on key distinctions Rousseau highlighted. Reframed as practical criteria, they help assess alignment with community participation and minimize the specific risks raised:
      *   **Criterion 1: Audience Role (Passive Spectator vs. Active Participant/Community Member):** Does the event encourage simple consumption, or does it foster interaction, shared space, and a sense of collective experience?
          *   *Festival*: High alignment (walking audience, shared meal, public space).
          *   *Warehouse*: Low alignment (fixed seating, dark auditorium).
      *   **Criterion 2: Performer Relationship (Separate Professional Class vs. Community Integration):** Are performers primarily paid outsiders, or are they drawn from and deeply embedded within the community?
          *   *Festival*: High alignment (local teachers, semi-pros, amateur casts from town).
          *   *Warehouse*: Low alignment (paid actors commuting from the city).
      *   **Criterion 3: Accessibility & Barrier (Exclusive/Commercial vs. Open/Communal):** Is the event financially and physically accessible to the whole community, reinforcing shared space, or does it create barriers (ticket cost, fixed capacity, enclosed space)?
          *   *Festival*: High alignment (free admission, public space, communal meal).
          *   *Warehouse*: Low alignment (ticketed, limited capacity, enclosed building).

      The Festival demonstrably aligns *more strongly* with mitigating the specific civic risks Rousseau identified by promoting participation, community integration, and accessibility. The Warehouse proposal aligns more with the traditional model he critiqued. **The potential arbitrariness lies in degree:** Is *any* paid performance unacceptable? Is *some* passive spectatorship tolerable if accessible? Our existing funded company likely falls somewhere between these two proposals on these scales.

  4.  **The Recommendation & Balance:** Therefore, we recommend supporting *both*, but weighting the allocation to reflect these principles:
      *   **Summer Festival ($25,000):** Receives the larger share because it most directly embodies the participatory, community-integrated, accessible model that directly addresses the core of the philosophical concern while offering a unique, town-wide event reinforcing local identity and public space usage. The communal meal is a significant factor in fostering the collective spirit Rousseau valued.
      *   **Professional Company ($15,000):** Receives seed funding for one season. This acknowledges the value of professional craft and a different audience experience, provides an opportunity to demonstrate community value and accessibility (e.g., through outreach, affordable tickets), and avoids the disruptive step of defunding an existing cultural provider based purely on philosophical theory without evidence of harm. This is a probationary opportunity.
      *   **Existing Company:** Funding should continue. The "defund" argument, while logically consistent within a strict Rousseauian ban, demands an impractical and disruptive purity test that ignores our context, established practice, and the lack of proven negative impact. It conflates a cautionary ideal with an absolute operational rule.

  **Strongest Argument for the Losing Side (Full Funding for Festival Only/Defund Others):**

  The most compelling counter-argument is that compromising with the professional model fundamentally fails the republican ideal. Funding *any* theatre based on the passive spectator/professional performer model actively nurtures the very habits Rousseau warned would corrode active citizenship: valuing representation over reality, creating social distinction through specialized performance, and encouraging citizens to outsource their communal spirit to paid entertainers in darkened rooms. Even a small amount legitimizes this. Tolerating the existing company and funding a new one, however partially, demonstrates a lack of seriousness about the genuine civic risk. Only radical commitment to purely participatory, community-sourced, open-air performance like the Festival truly safeguards the robust, self-sufficient civic character our town prides itself on. Anything else is a slippery slope towards the softened, spectacle-dependent populace Rousseau condemned.

  **Conclusion:**

  Our decision balances respect for the philosophical concern with practical governance of our diverse community. The split allocation allows us to robustly support the model that best aligns with participatory civic values (the Festival) while giving the professional venture a defined, limited opportunity to prove its value and integration within our town, subject to review. This approach responsibly engages with Rousseau's warnings without being enslaved by an absolutist interpretation that ignores our reality, our existing commitments, and the potential benefits of diverse cultural expression. The refined criteria (Audience Role, Performer Relationship, Accessibility) provide a clear framework for evaluating future applications.
