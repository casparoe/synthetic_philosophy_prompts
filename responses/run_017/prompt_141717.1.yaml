     - Poker chips: PA starts with 10 chips, exploiter with 10 chips.
  - Initial endowment: PA gets card A, exploiter gets cards B and C.

  Trading round:

  1. Exploiter chooses which trade to offer. They can only offer a swap of the PA's current good for one of the goods they (the exploiter) hold.
     - For example, if PA has A, exploiter can offer to swap A for B or A for C. But the PA will only accept A for B (because they prefer B to A), and will reject A for C (because they prefer A to C). So the exploiter should offer A for B to get the trade.
     - Similarly, when PA has B, exploiter offers B for C.
     - When PA has C, exploiter offers C for A.

   So the exploiter will always offer the next in the cycle.

  2. PA decides: they must follow their preferences. They accept if the offered good is preferred to their current good. They reject if it is not.

  3. If accepted, swap the cards and PA gives 1 chip to the exploiter.

  4. Then, the teacher rolls a die for the entire class (or each pair rolls their own die). If a 1 is rolled, the game ends for that pair. Otherwise, they continue.

  5. We allow multiple cycles.

  The game continues for a fixed number of rounds or until the die ends it. But with the die, it can end at any time.

  To save time, we might run for a fixed number of rounds, say 10 rounds, and within that, any pair might have ended earlier by the die.

  But then pairs that ended early have to wait.

  Alternatively, we let each pair play until their own die ends the game.

  How long will it take? The expected number of trades before termination is 6 (since probability of termination is 1/6, so expected number of trades is 6). But it could be longer.

  We can set a time limit for the trading phase.

  Timeline for the 75-minute session:

  - Introduction and setup: 10 minutes
  - Explain roles, preferences, and rules: 10 minutes
  - Trading game: 20 minutes (enough for several trades and terminations)
  - Switch roles: 5 minutes to reset (PA becomes exploiter and vice versa, reset goods and chips)
  - Second trading game: 20 minutes
  - Debrief: 10 minutes

  Total: 75 minutes.

  Debrief points:

  1. Ask pumped agents: how many ended up with the same good they started with? How many chips did you lose?
  2. Ask: did you ever think about refusing a trade? Why didn't you? (Because at each step, you were getting a good you preferred, so it seemed like a good deal.)
  3. Ask: if the game didn't have random termination, would you have traded? (Without termination, they would be pumped dry.)
  4. Ask exploiters: how many chips did you make?
  5. Highlight the three ways out:
     a. Myopic trading: which is what they did, and it led to losses.
     b. Backward induction: if they think ahead and see that accepting a trade will lead to a series that leaves them worse off, they might refuse. But then they forgo the immediate gain.
     c. Commitment: commit to not trading at all, or to only trade in one direction? but with random termination, not trading might mean missing out on improvement.
  6. The fee wrinkle: if the fee were higher, then even though they prefer B to A, if the difference is small and the fee is high, they might not trade. The money pump argument assumes that the agent is willing to pay an arbitrarily small amount to upgrade. But if the fee is high enough, intransitivity might not be exploited because the agent wouldn't make the trade. So what the pump really motivates is that there should be no cycle of trades that is profitable for an exploiter given the transaction costs. 

  7. The random termination wrinkle: shows that if you always refuse to trade, you might be money-pumped in opportunity cost: you could have gotten a better good and the game might have ended, leaving you better off.

  What will go wrong the first time:

  - Students might not understand the preferences and make mistakes in trading.
  - The die roll might end the game very early for some pairs, so they don't experience the pump.
  - The exploiter might not understand that they should always offer the next in the cycle.

  Feature that the game can't stage:

  - The game assumes myopic preferences. In reality, the pumped agent might learn and start to refuse. But in the game, we instruct the PA to always trade when offered a preferred good, so they are myopic. The real dispute is about whether it's rational to have intransitive preferences if you are not myopic. The game can't stage the sophisticated response (backward induction or commitment) because we instruct the PA to trade myopically. We will have to discuss that after.

  Rules summary:

  - Pumped Agent (PA) preferences:
     - B > A
     - C > B
     - A > C
  - PA must accept a trade if offered a good they prefer to their current good, and reject otherwise.
  - PA starts with good A and 10 chips.
  - Exploiter starts with goods B and C and 10 chips.
  - Exploiter can offer to swap one of their goods for the PA's current good.
  - If PA accepts, they swap goods and PA pays 1 chip to the exploiter.
  - After each trade, roll a die. If 1, game ends. Otherwise, continue.
  - Play for a fixed time (e.g., 20 minutes) or until the game ends by die roll.

  Debrief mapping:

  - The initial trade (A for B) corresponds to the first step of the pump: the PA pays to get a preferred good.
  - The second trade (B for C) corresponds to the next step.
  - The third trade (C for A) completes the cycle, leaving the PA back to A but with 3 fewer chips.
  - The fee (1 chip) is the cost of each swap. In the real world, this might be a transaction cost or spread.
  - The die roll corresponds to the idea that the world might end or the opportunity might disappear, so it's not guaranteed that the cycle will complete. Thus, the PA might end up better off by trading (e.g., if the game ends after one trade, they have B and paid 1 chip, which is better than having A and 10 chips if they value B enough over A).

  The uncomfortable conclusion: the pump only works if the pairwise improvements are large enough to cover the transaction cost. If the fee is high, the PA wouldn't trade, so intransitivity might not be exploited. Therefore, the money pump argument doesn't force full transitivity, but only that there are no cycles where each step is profitable given the costs.

  Finally, what the game can't stage: the possibility that the PA might learn to refuse trades to avoid the cycle. In the game, we force myopic behavior to illustrate the pump. In reality, a non-myopic agent would use backward induction or commitment. We have to mention that after the game.
answer: |-
  Below is a complete design for your 75-minute seminar session, incorporating poker chips, index cards, and the two wrinkles (transaction costs and random termination). The game forces students to confront the money-pump argument experientially, with half the class as exploiters and half as pumped agents (PAs), followed by a role swap. The debrief ties game moments to the argument, including the cost-relative condition.

  ---

  ### **Game Setup**
  **Core Idea**  
  PAs have intransitive preferences: **B ≻ A**, **C ≻ B**, **A ≻ C**. Exploiters profit by trading along this cycle (A→B→C→A), charging a fee per trade. A die roll after each trade creates a risk/reward tension: refusing trades avoids fees but forgoes potential gains if the game ends early.

  **Materials**  
  - **Index cards**: Each PA and exploiter pair needs 3 cards labeled "A", "B", "C".  
  - **Poker chips**: Each PA starts with **10 chips**; each exploiter starts with **5 chips**.  
  - **Die**: 6-sided die per pair (or shared if limited).  
  - **Timer**: For rounds.  

  **Initial Endowments**  
  - **PA**: Starts with card **A** and **10 chips**.  
  - **Exploiter**: Starts with cards **B and C** and **5 chips**.  

  **Preferences (Verbal Instructions)**  
  - **PA**: "You strictly prefer B to A, C to B, and A to C. You must accept any trade where you receive a good you prefer over your current good (e.g., if you have A, you must accept B)."  
  - **Exploiter**: "You only care about chips. Your goal is to maximize your chips by trading with the PA."  

  ---

  ### **Trading Protocol**  
  1. **Trade Offer**: The exploiter offers one trade: swap the PA’s current good for **one** of the exploiter’s goods.  
     - *Example*: If PA has A, exploiter can offer "Swap your A for my B" or "Swap your A for my C".  
     - **Key**: Exploiter must offer a trade. PA must accept if it gives a preferred good.  

  2. **Trade Execution**:  
     - If PA accepts:  
       - Goods are swapped.  
       - PA pays **1 chip** to the exploiter (transaction cost).  
     - If PA rejects (only allowed if the trade doesn’t offer a preferred good): No change.  

  3. **Die Roll**: After each trade, roll the die.  
     - If **1–2** (33% chance), the game ends immediately.  
     - If **3–6**, the game continues.  

  4. **End of Game**: Players tally:  
     - **PA’s score**: Good held (no point value) + chips left.  
     - **Exploiter’s score**: Chips held (goods have no value).  

  ---

  ### **Payoff Structure**  
  - **Transaction cost (wrinkle 1)**: The 1-chip fee forces PAs to weigh preference strength against cost. If the "gain" from a swap feels small, PAs might resent the fee, but they must trade if offered a preferred good.  
  - **Random termination (wrinkle 2)**: The 33% termination risk means:  
    - Refusing all trades avoids fees but risks missing gains (e.g., ending with inferior A).  
    - Trading might end early, leaving PAs better off (e.g., ending with B after one trade).  

  ---

  ### **Session Timeline**  
  **Total: 75 minutes**  
  1. **Intro (5 min)**: Frame the game: "Today, half of you will be vulnerable to exploitation; the other half will exploit. We’ll test the money-pump argument in action."  
  2. **Setup (10 min)**:  
     - Divide 14 students into 7 PA-exploiter pairs.  
     - Distribute cards/chips. Explain preferences and rules.  
     - Clarify: PAs must trade for preferred goods; exploiters maximize chips; die ends the game randomly.  
  3. **Round 1 (20 min)**:  
     - PAs and exploiters trade freely within pairs.  
     - **Timer**: Announce time at 5-min intervals. Most games end in 3–6 trades.  
  4. **Role Swap (5 min)**:  
     - PAs become exploiters; exploiters become PAs.  
     - Reset: PA gets A and 10 chips; exploiter gets B/C and 5 chips.  
  5. **Round 2 (20 min)**: Same as Round 1.  
  6. **Debrief (15 min)**: Structured discussion (details below).  

  ---

  ### **Debrief: Mapping Game to Argument**  
  Start with open questions, then guide to key insights:  

  1. **"What happened?"**  
     - Students report outcomes: Many PAs ended with A and few chips; exploiters gained chips. Highlight a PA who completed a full cycle (A→B→C→A) and lost 3 chips.  
     - **Map to argument**: This mirrors the money pump’s core: cyclical preferences lead to draining trades.  

  2. **"Why did PAs accept trades?"**  
     - PAs say: "I got a better good each time!"  
     - **Map to argument**: Myopic trading (one of the three responses) feels rational step-by-step but fails long-term.  

  3. **"Did anyone refuse a trade? Why?"**  
     - Some refusers say: "I didn’t want to lose chips" or "I saw the trap."  
     - **Map to argument**: This mirrors the second response (reasoning backward/refusing). But note: Refusers often ended with A—inferior to B/C if the game ended early.  

  4. **"How did the fee affect you?"**  
     - PAs express frustration: "I only got a slightly better good but paid a chip!"  
     - **Map to argument**: The pump doesn’t require transitivity if transaction costs exceed "preference gaps." **Uncomfortable conclusion**: The argument only forbids cycles where each trade is profitable *after costs* (i.e., no cycle with net gain at prevailing fees).  

  5. **"How did the die roll change things?"**  
     - PAs who ended early with B/C: "I’m glad I traded!" Refusers: "I missed out."  
     - **Map to argument**: Random termination adds opportunity cost to refusal. Real-world decisions involve uncertainty (e.g., investments might pay off before a crash).  

  6. **Sophisticated Takeaways**:  
     - **Three responses emerge**:  
       - Myopic trading (drained).  
       - Refusing (safe but forgoes gains).  
       - Commitment (none did this; mention: "Could you commit to never trading C for A?").  
     - **Cost-relative condition**: The fee makes students feel why transitivity isn’t strictly needed—only cycles profitable *net of costs* matter.  

  ---

  ### **Predictable Problems & Limitations**  
  **What will go wrong the first time**:  
  1. **Confusion over preferences**: Some PAs "forget" and reject trades they should accept (e.g., refuse B when holding A).  
     - *Mitigation*: Use reminder cards: "If you have [X], you prefer [Y]."  
  2. **Exploiters offer suboptimal trades**: e.g., Offering C for A (which PA rejects) instead of B for A.  
     - *Mitigation*: Whisper a tip: "Always offer the next in the cycle (A→B→C→A)."  
  3. **Short games**: Die rolls end some games in 1–2 trades, so not all experience the full pump.  
     - *Mitigation*: In debrief, contrast early-ending PAs (happy) vs. drained PAs (frustrated).  

  **Unstageable real-world feature**:  
  - **Sophisticated foresight**: The game can’t replicate an agent who *knows* the cycle exists and uses backward induction/commitment *without being told*. Students are forced into myopic or refusal strategies by rules.  
    - *Address verbally*: "In reality, a sophisticated agent might pre-commit to avoid trades (e.g., ‘I’ll never trade C for A’). But commitment isn’t always feasible—and the pump shows why violating transitivity is risky if you’re myopic or can’t commit."  

  ---

  This design forces students to *feel* the pump (frustration at being drained, regret at missed gains) while wrestling with fees and uncertainty. The debrief turns gameplay into conceptual insight, emphasizing the cost-relative condition as the argument’s true lesson.
