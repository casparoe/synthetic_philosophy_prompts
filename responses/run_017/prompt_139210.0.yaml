prompt: |-
  Hey — I somehow ended up on my university's commemorative naming committee (don't ask, I made the mistake of replying to a thread), and now we have to apply our written standard to three cases at once: a Columbus-named scholarship fund, a Jefferson-named residential college, and a Churchill-named lecture series. I've been arguing about it in a group chat full of LessWrong-adjacent people for weeks — I've been reading this stuff since the Sequences were going up — and we keep going in circles, so I want someone to actually do the philosopher thing and tell me what the rule we wrote presupposes.

  The rule, roughly: (1) we strip a name only if the person's worst acts were condemned by at least some of their own contemporaries — call it the availability test, the idea being that you can only be faulted for not knowing better if somebody in fact did know better; (2) we explicitly don't strip a name just because the person held odious beliefs that were near-universal at the time, which is where the "man of his time" defence keeps getting wheeled out; (3) if the name was attached as a condition of a bequest from the honoree's own estate, we won't touch it, because honoring him was the deal we made and the deal is what paid for the building — Chesterton's fence and all that — while for a name the university chose on its own initiative, clauses (1) and (2) apply in full; and (4), which I think is quietly doing the most work, when a name has been around so long that nobody on campus knows or cares who it refers to and it just functions as an address, we leave it alone, because (in one member's words) "at that point it's not honoring anyone, it's just a signifier."

  Here's my problem. (1) and (2) together look like they presuppose that blameworthiness is comparative rather than absolute — that what matters is being worse than your peers, not being bad — and I can't tell if that's a coherent view of blame or just a slide from blame to praiseworthiness, since honoring might be contrastive in a way that blaming isn't, and commemoration might be some weird hybrid of the two. Then (3) and (4) seem to pull the opposite way: (3) makes the wrongness of a name depend on what the namer meant, and (4) makes it depend on what the name currently does, and those can't both be the whole story — unless you treat commemoration as an ongoing speech act that can lapse, which I half believe but can't spell out. Also can you steelman clause (3) for me, because my side of the chat thinks it's obviously just money talking.

  So: reconstruct the implicit theory of blame, honor, and historical judgment that this policy only makes sense under; be explicit about what it strictly presupposes versus what merely sits comfortably with it; tell me whether (1) and (2) are even consistent given that beliefs cause acts and acts flow from beliefs; say what the policy would have to become under a rival view — someone proposed treating honor as a lease rather than a deed, with automatic review of every name every fifty years, which I like but which seems to have its own commitments; and flag the places where the policy is just underdetermined, where several quite different theories would license identical votes, so that our disagreements aren't evidence of anything. Under 650 words, prose rather than a bullet dump, since I'll be reading it on my phone on the bus to the meeting.
reasoning: |-
  Okay, let me unpack this user's query. They're on a university naming committee dealing with three controversial figures: Columbus, Jefferson, and Churchill. The committee has a four-part rule, and the user wants to understand the philosophical underpinnings of that rule. 

  First, I need to parse the four clauses carefully. Clause (1) is about contemporaries condemning the worst acts - that suggests blame requires deviation from contemporary norms. Clause (2) explicitly rejects judging historical figures by modern standards if their views were common then. Together, these imply blame is comparative, not absolute. 

  The user's confusion seems to center on whether this comparative view works for both blame and honor. They're right that honoring often is contrastive (we honor exceptional virtue), but blame might not follow the same logic. I should address that tension. 

  Clause (3) about honoring bequest terms feels transactional - it prioritizes contractual fidelity over moral evaluation. The user suspects this is "money talking," but there's a defensible principle here about institutional promise-keeping versus spontaneous honoring. 

  Clause (4) is fascinating - it treats naming as a speech act that can decay over time when the referent fades. That suggests commemoration isn't a one-time event but an ongoing practice dependent on communal recognition. 

  The user also asks about consistency between (1) and (2) given beliefs cause acts. This touches on moral philosophy - can we condemn acts without condemning the beliefs that motivated them? Probably not cleanly, but the policy seems to assume we can separate evaluation of specific acts from broader worldview assessment. 

  For the "lease versus deed" alternative: a periodic review model would presuppose that moral evaluation is iterative and that honoring has temporal limits. That's coherent but clashes with Clause (3)'s permanence for bequests. 

  Underdetermined areas: How much contemporary condemnation meets Clause (1)'s threshold? What counts as "near-universal" beliefs in Clause (2)? These gaps mean the same policy could serve different philosophical commitments. 

  The user's LessWrong background suggests they'll appreciate clear conceptual mapping. I should avoid digressions and focus on: 1) blame as deviationist, 2) honor as either contractual or merit-based, 3) commemoration as performative. 

  Biggest insight: The policy isn't monolithic. Each clause answers a different question - blameworthiness (1-2), obligation (3), function (4) - so no single theory covers it all. That's why the group chat goes in circles; they're trying to force coherence where the policy deliberately compartmentalizes.
answer: |-
  Your policy presupposes a **contextualist, speech-act theory of commemoration** that treats historical blame and institutional honor as distinct practices with different logics. Here’s the reconstructed framework:

  ### Core Presuppositions:
  1.  **Blame is comparative (deviationist):**  
      Clauses (1) and (2) strictly presuppose that *moral responsibility for historical figures hinges on culpable deviation from attainable contemporary standards*. Blame requires *fault* – not just "badness" by modern lights, but failing epistemic/moral expectations *available in their context*. This rejects absolute moral judgments across time. Beliefs causing acts aren’t inconsistent here: the policy condemns *acting on odious beliefs* only if contemporaries recognized the acts as odious (e.g., Jefferson’s slavery vs. his deism). It’s acts, not private beliefs, that trigger renaming.

  2.  **Honor is transactional OR functional:**  
      - Clause (3) presupposes that **institutional promises create binding obligations.** Renaming a donor-funded entity breaks a contract, violating fidelity regardless of moral reassessment. Steelman: It’s not "money talking" but *promise-keeping* – the university’s honor is at stake in honoring its word.  
      - Clause (4) presupposes that **commemoration is an ongoing speech act.** If the name loses its referential power (becoming mere geography), it ceases to *function* as honoring. The act lapses, nullifying the moral issue.  

  3.  **"Honor" ≠ "Blameworthiness":**  
      The policy implicitly separates *praising* (honoring) from *not blaming*. Clause (2) allows honoring figures who held "normal-for-era" odious beliefs because honoring recognizes contextually exceptional virtues (e.g., Churchill’s leadership in WWII), not absolute moral perfection. This is where the comparative logic shifts: honoring is contrastive (did they excel *for their time*?), while blaming requires deviation (did they fall below *their time’s standards*?).

  ### Inconsistencies & Rival Views:
  - **Clauses (1)/(2) vs. (3):** (1)/(2) require moral reassessment, but (3) suspends it for contractual names. A rival "leasehold" model (automatic review) would presuppose honor is *always* provisional on current values, rejecting perpetual obligations. Your policy bifurcates: spontaneous honors are reassessable; contractual honors aren’t.  
  - **Clauses (3) vs. (4):** (3) cares about original intent (the deal), while (4) cares about current function. They coexist because (3) is about institutional integrity, (4) about social meaning – different grounds for retention.  

  ### Underdetermined Areas (Where Policy is Silent):
  1.  **Thresholds:** What *level* of contemporary condemnation satisfies (1)? ("Some" contemporaries is vague.) What constitutes "near-universal" beliefs in (2)?  
  2.  **Scope of "Worst Acts":** Does (1) cover *all* misconduct or only what’s relevant to the honor? (e.g., Churchill’s racism vs. his wartime leadership).  
  3.  **"Functionally Dead" Test:** How is "nobody knows or cares" measured? By students? Alumni? The public?  

  ### What the Policy Would Look Like Under Rival Views:
  - **Absolutist View (Blame is Absolute):** Reject (1) and (2). Rename anyone whose acts/beliefs fail *current* moral standards (e.g., Columbus for colonialism).  
  - **Leasehold View (Honor is Temporary):** Scrap (3). All names expire; periodic review applies universally.  
  - **Intentionalist Purism:** Reject (4). If the namer *intended* honor, it persists regardless of current recognition.  

  ### Conclusion
  Your policy makes sense only if you hold:  
  (A) Historical blame requires *contemporaneous deviance*,  
  (B) Commemorative naming is a context-sensitive practice combining *contractual fidelity* (for donor names), *merit-based honor* (requiring contextually exceptional virtue, not sainthood), and *functional speech acts* (that decay without active recognition). It’s a pragmatic hybrid, not a unified moral theory. Disagreements likely stem from underdetermined thresholds (above) or clashes between valuing promise-keeping vs. moral reassessment.
