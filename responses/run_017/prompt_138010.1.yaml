  ### Position Sizing Procedure for Binary Event-Driven Bets

  #### **Objective**: Maximize long-run growth (time-average growth) while respecting constraints: committee sign-off (>1.5% stake), 12-month evaluation horizon, and 30% drawdown barrier. Adjust for panel miscalibration and existing positions.

  ---

  ### **Step-by-Step Procedure**  
  *Run in sequence; terminate early if stake = 0. Inputs: contract price \(c\), panel probability \(p\), time to resolution \(t\) (months), current drawdown \(D\) (fraction of HWM), current risk exposure \(R\) (sum of outstanding positions as fraction of bankroll).*

  1. **Adjust Probability for Miscalibration**  
     - **Rule**:  
       - If \(p \leq 0.1\) or \(p \geq 0.9\): \(p_{\text{adj}} = p / 1.5\) (compress tails).  
       - Else: \(p_{\text{adj}} = p\) (no change).  
     - **Sufficient Answer**: \(p_{\text{adj}}\).  
     - **Terminate if**: \(p\) not provided → stake = 0 (skip bet).  
     - *Rationale: Panel overconfidence in tails (90% → 60% hit rate; long-shots worthless).*

  2. **Calculate Unrestricted Kelly Stake**  
     - **Rule**:  
       - Net odds \(b = (1 - c) / c\).  
       - \(f_{\text{kelly}} = \max\left(0, \frac{p_{\text{adj}} - c}{1 - c}\right)\).  
     - **Sufficient Answer**: \(f_{\text{kelly}}\) (fraction of bankroll).  
     - **Terminate if**: \(f_{\text{kelly}} = 0\) (negative edge → stake = 0).  
     - *Rationale: Maximizes asymptotic growth without constraints. Not ergodic due to barrier, but anchors sizing*.

  3. **Adjust for Estimation Error**  
     - **Rule**:  
       - If \(p \leq 0.1\) or \(p \geq 0.9\): \(f_{\text{est}} = f_{\text{kelly}} \times 0.5\) (halve for tail bets).  
       - Else: \(f_{\text{est}} = f_{\text{kelly}}\) (no change).  
     - **Sufficient Answer**: \(f_{\text{est}}\).  
     - *Rationale: Penalize tail bets due to panel’s poor calibration. Half-Kelly heuristic based on empirical error*.

  4. **Adjust for Drawdown Barrier**  
     - **Rule**:  
       - Max loss capacity: \(L_{\text{max}} = \frac{0.3 - D}{1 - D}\) (fraction of bankroll).  
       - Stake cap: \(f_{\text{barrier}} = \max(0, L_{\text{max}} - R)\).  
       - \(f_{\text{risk}} = \min(f_{\text{est}}, f_{\text{barrier}})\).  
     - **Sufficient Answer**: \(f_{\text{risk}}\).  
     - **Terminate if**: \(f_{\text{risk}} = 0\) (no loss capacity).  
     - **Mandate cap**: \(f_{\text{risk}}\) capped by \(L_{\text{max}}\), not estimation.  
     - *Rationale: Absorbing barrier at 30% drawdown. Total loss exposure (\(R + f\)) must not breach \(L_{\text{max}}\). Conservative (assumes worst-case correlation)*.

  5. **Adjust for Evaluation Horizon**  
     - **Rule**:  
       - If \(t > 12\) months: \(f_{\text{time}} = f_{\text{risk}} \times \min\left(1, \frac{12}{t}\right)\).  
       - Else: \(f_{\text{time}} = f_{\text{risk}}\).  
     - **Sufficient Answer**: \(f_{\text{time}}\).  
     - *Rationale: Bets resolving beyond 12 months tie up capital; discount by opportunity cost*.

  6. **Committee Approval Check**  
     - **Rule**:  
       - If \(f_{\text{time}} > 0.015\): flag for committee approval.  
       - Else: final stake = \(f_{\text{time}}\).  
     - **Hand to human**: If flagged, committee decides based on:  
       - Explainability (can analyst justify in 2 sentences?).  
       - Drawdown risk tolerance (even if capped, tail risk may spook committee).  
     - *Rationale: Practical governance; committee thinks in expected return, not growth. Analyst must bridge gap*.

  ---

  ### **Live Case Studies**  
  *Assume: Current drawdown \(D = 0\) (at HWM), current risk \(R = 0\) (no book).*

  1. **Contract @ $0.22, Panel Probability 35%, Resolution 6 Weeks**  
     - **Step 1**: \(p = 0.35\) (mid-range) → \(p_{\text{adj}} = 0.35\).  
     - **Step 2**: \(b = (1-0.22)/0.22 = 3.55\); \(f_{\text{kelly}} = (0.35 - 0.22)/(1-0.22) = 0.166\).  
     - **Step 3**: Mid-\(p\) → \(f_{\text{est}} = 0.166\).  
     - **Step 4**: \(L_{\text{max}} = (0.3-0)/(1-0) = 0.3\); \(f_{\text{barrier}} = 0.3 - 0 = 0.3\); \(f_{\text{risk}} = \min(0.166, 0.3) = 0.166\).  
     - **Step 5**: \(t = 1.5\) months (<12) → \(f_{\text{time}} = 0.166\).  
     - **Step 6**: \(0.166 > 0.015\) → **committee approval required**.  
     - *Why? High stake (16.6%) due to positive edge. Must explain growth vs. barrier risk to committee*.

  2. **Merger Arb @ $0.94, Panel Probability 97%, Small Break Risk**  
     - **Step 1**: \(p = 0.97\) (tail) → \(p_{\text{adj}} = 0.97 / 1.5 = 0.647\).  
     - **Step 2**: \(b = (1-0.94)/0.94 = 0.064\); \(f_{\text{kelly}} = (0.647 - 0.94)/(1-0.94) = \mathbf{-4.88}\) → **stake = 0** (terminate at Step 2).  
     - *Why? Negative edge after adjustment (panel overconfidence). Avoid despite high panel probability*.

  3. **Long-Shot @ $0.04, Panel Probability 9%, High Expected Return**  
     - **Step 1**: \(p = 0.09\) (tail) → \(p_{\text{adj}} = 0.09 / 1.5 = 0.06\).  
     - **Step 2**: \(b = (1-0.04)/0.04 = 24\); \(f_{\text{kelly}} = (0.06 - 0.04)/(1-0.04) = 0.021\).  
     - **Step 3**: Tail-\(p\) → \(f_{\text{est}} = 0.021 \times 0.5 = 0.0105\).  
     - **Step 4**: \(L_{\text{max}} = 0.3\); \(f_{\text{barrier}} = 0.3\); \(f_{\text{risk}} = \min(0.0105, 0.3) = 0.0105\).  
     - **Step 5**: Assume \(t \leq 12\) → \(f_{\text{time}} = 0.0105\).  
     - **Step 6**: \(0.0105 < 0.015\) → **stake = 1.05%** (no approval needed).  
     - *Why? High odds compensate for low probability, but estimation error shrinks stake. Barrier not binding*.

  ---

  ### **What the Procedure Cannot Do**  
  1. **Non-Monetary Quantities (e.g., Analyst-Hours)**:  
     - Geometric growth logic *theoretically* applies, but fails practically:  
       - No clear "bankroll" (hours ≠ capital).  
       - Payoffs are non-binary, multi-period, and unquantifiable (e.g., research insights).  
       - Opportunity cost of time lacks a market price.  
     - **Alternative**: Cost-benefit analysis tied to expected ROI, but not Kelly-based.  

  2. **Key Limitations**:  
     - **Correlation**: Assumes worst-case (perfect positive) for barrier cap. Underestimates diversification benefits.  
     - **Joint Sizing**: Single-bet focused. For correlated positions, recalc \(R\) dynamically and monitor portfolio delta.  
     - **Discrete Reviews**: Quarterly reviews ignore intra-quarter drawdowns; supplement with real-time monitoring.  
     - **Panel Dynamics**: Miscalibration adjustment is linear; actual error may be non-stationary.  

  **Final Note**: Your friend is half-right. Maximizing \(E[\log W]\) *is* maximizing long-run growth, and risk aversion is irrelevant *if* utility is logarithmic. But with a barrier and finite horizon, it’s not pure Kelly—your defensible approximation balances growth with survival. On a Tuesday, that’s what matters.
