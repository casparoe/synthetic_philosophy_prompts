prompt: |-
  I am writing the requirements chapter of my PhD thesis on updating under uncertain evidence, and before I survey candidate rules I want a specification: what a rule for revising a credence function on the basis of evidence that is itself uncertain has to deliver in order to count as adequate for the job I care about.

  The purpose I want the rule good for: a bounded, artificial epistemic agent (think of the update module of a clinical decision-support system) that holds a probability distribution over a large, factored set of variables and receives a stream of items that are not hard certainties. Concretely, its inputs arrive in at least these four shapes, and I want the requirements list built around them rather than around the textbook case of a clean new probability assignment to a partition:

  1. report evidence with a stated but disputable reliability — a sensor or a colleague says that p, where the agent's confidence that the source is functioning and being read correctly is itself something like 0.8;
  2. nested or second-order evidence — the agent becomes uncertain about what its own earlier evidence was, or about the competence of the process that produced its last update;
  3. inexact evidence — the agent is only willing to constrain the new probability of a proposition to an interval, or to constrain an expected value, rather than fix a number;
  4. retractable evidence — a later item reveals the earlier source was broken, and the agent must back out the update rather than merely pile a further update on top of it.

  Please write the desiderata (8 to 12 of them) as a table with columns: requirement; the case that motivates it and why that case is a requirement rather than a nice-to-have; status (non-negotiable, or a preference of one camp — accuracy-firsters, dynamic-Dutch-book arguments, Bayes-network engineers, imprecise-probabilists); and what the requirement rules out. Alongside the four input shapes above, the cases I want handled are at least: reduction to ordinary conditionalization in the limit where the uncertain evidence becomes hard; no-op when the new probabilities on the partition coincide with the old ones; continuity in the evidential input, so that small error in estimating the input produces small error in the output; insensitivity to how finely the agent carves the space when it encodes the evidence, including what happens when rigidity holds on a coarse partition but not on a refinement; idempotence when the same item arrives twice; order-independence across a sequence of items; and reversibility when an item is withdrawn. Include a requirement about where the evidential input is allowed to come from: whether the rule may take a new probability assignment as a black box, or owes an account of it in terms of likelihoods, and what coherence constraints the input must satisfy.

  Two things matter most to me. First, mark which requirements are genuine and which are the prejudices of a camp — I would rather drop a demand than keep one that only sounds obligatory. Second, if some subset of your requirements cannot be jointly satisfied, say so and give the argument: I expect at least one clash and my guess is that it involves order-independence, but show it rather than asserting it, and tell me which requirement you would weaken and what that costs.

  Then, briefly — a short paragraph each, not a survey — score against your list: ordinary conditionalization on the report that the source said that p; Jeffrey-style probability kinematics with rigidity on a partition; a constraint-based rule that picks the minimally informative revision satisfying the constraint; and, if you think it belongs, the likelihood-ratio or virtual-evidence treatment used in graphical models. I will supply the citations myself, so refer to positions and rules descriptively and do not give me a bibliography.

  Keep the whole thing under about 1300 words. End with a single final line in exactly this form, naming the one requirement that does the most work by excluding the most candidates:

  Verdict: <short label for that requirement>
reasoning: |-
  Hmm, the user is writing their PhD thesis on updating under uncertain evidence and needs a specification of requirements for candidate rules. They want a table with 8-12 desiderata covering four specific input types: evidence with disputable reliability, second-order evidence, inexact evidence, and retractable evidence. They also want additional cases like reduction to standard conditionalization, no-op for identical probabilities, continuity, insensitivity to partitioning, idempotence, order-independence, and reversibility. Plus, they want clarity on where evidential inputs come from.

  I need to structure this as a table with columns for requirement, motivation (including why it's essential), status (non-negotiable vs. camp-specific), and what it rules out. The user specifically wants me to distinguish genuine requirements from "camp prejudices" and identify any conflicts between requirements. They also want brief evaluations of four approaches: ordinary conditionalization, Jeffrey conditionalization, minimal revision, and virtual evidence.

  The core tension I see is between reversibility and order-independence - retracting evidence might require storing update history, which conflicts with order-independence that assumes commutative operations. I'll flag this clearly. For evidential input, I'll emphasize that the rule must handle inputs beyond likelihoods (like intervals) but note that some approaches (like virtual evidence) inherently use likelihood ratios.

  For the evaluations: ordinary conditionalization fails most requirements except reduction to standard form; Jeffrey handles some but not second-order or retractable evidence; minimal revision handles constraints well but struggles with reliability and reversibility; virtual evidence handles reliability and reversibility but not inexact constraints. The verdict should be reversibility since it excludes most non-Bayesian-network approaches.

  I'll keep the whole response under 1300 words, use clear labels, and end with "Verdict: Reversibility" as requested.
answer: |-
  ### Requirements for Uncertain Evidence Update Rules  

  | Requirement | Motivation & Necessity | Status | Rules Out |
  |-------------|-------------------------|--------|----------|
  | **1. Accommodates Evidence with Stated Reliability** | Input type 1: Agent receives "p" from source with reliability 0.8. Must adjust credence in *p* and *source reliability*. **Necessary**: Ignoring reliability misrepresents real-world evidence (e.g., faulty sensors). | Non-negotiable | Rules ignoring source reliability (e.g., naively updating on *p* as certain). |
  | **2. Handles Second-Order Uncertainty** | Input type 2: Agent doubts prior evidence/process (e.g., "Was sensor calibrated?"). **Necessary**: Foundational for self-correcting agents; avoids cascading errors from unchecked meta-uncertainty. | Non-negotiable | Rules without meta-credence tracking (e.g., standard Bayesian updates). |
  | **3. Accepts Imprecise Constraints** | Input type 3: Evidence constrains P(A) to [0.7, 0.9] or E[X] > c. **Necessary**: Real agents often lack exact probabilities (e.g., vague expert judgments). | Non-negotiable | Rules requiring precise inputs (e.g., Jeffrey conditionalization). |
  | **4. Supports Retraction** | Input type 4: Later evidence reveals earlier source was broken. **Necessary**: Non-retractable rules accumulate errors irreversibly (e.g., clinical systems must correct misdiagnoses). | Non-negotiable | Rules without "backward" revision (e.g., purely cumulative updates). |
  | **5. Reduces to Conditionalization** | When reliability → 1 or constraints sharpen to point-values, rule → Bayes. **Necessary**: Ensures consistency with probability theory in ideal cases. | Non-negotiable | *Ad hoc* rules violating foundational axioms. |
  | **6. Continuity in Input** | Small input errors (e.g., reliability 0.81 vs. 0.80) yield small output changes. **Necessary**: Robustness against estimation noise is critical for bounded agents. | Non-negotiable | Discontinuous rules (e.g., threshold-based updates). |
  | **7. Partition Insensitivity** | Coarsening/fining partitions shouldn’t affect results if rigidity holds appropriately. **Necessary**: Agents must abstract variables flexibly without artifacts. | Preference (Bayes-network engineers) | Rules dependent on arbitrary granularity (e.g., rigid partition-sensitivity). |
  | **8. Idempotence** | Identical evidence twice → no change after first update. **Necessary**: Prevents self-reinforcing false certainty. | Preference (Accuracy-firsters) | Rules where repeated input amplifies confidence. |
  | **9. Order-Independence** | Sequence of updates yields same result regardless of order. **Motivation**: Critical for distributed systems with async evidence. **But**: Conflicts with Reversibility (see clash below). | Preference (Imprecise probabilists) | Path-dependent rules (e.g., some constraint-based methods). |
  | **10. Reversibility** | Withdrawing evidence (via retraction input) restores pre-update state. **Necessary**: For clinical safety (input type 4). | Non-negotiable | Rules requiring irreversible "overwriting" (e.g., standard Jeffrey). |
  | **11. Input Agnosticism** | Rule accepts evidence as probabilities, intervals, or likelihood ratios. **Necessary**: To handle all input types (1–4) without conversion artifacts. | Non-negotiable | Rules requiring specific input forms (e.g., likelihood-only). |
  | **12. Coherence Preservation** | Output is always a valid probability distribution. **Necessary**: Avoids inconsistent decisions. | Non-negotiable | Rules producing incoherent credences. |

  ---

  ### **Clash: Order-Independence vs. Reversibility**  
  - **Conflict**: Reversibility requires storing update history to "rewind" (e.g., via Bayes factors). Order-independence demands commutative operations *without* history (e.g., pooling).  
  - **Resolution**: Drop strict order-independence (keep as preference). **Cost**: Sequential updates may require explicit dependency tracking, increasing computational load.  

  ---

  ### **Rule Evaluations**  
  1. **Ordinary Conditionalization on "Source Says p"**:  
     Fails 1–4, 10–11. Treats testimony as hard evidence, ignoring reliability/retraction. Satisfies only 5 and 12.  

  2. **Jeffrey Conditionalization (Rigidity on Partition)**:  
     Fails 1 (no reliability), 2 (no meta-uncertainty), 3 (requires precise inputs), 4/10 (non-retractable), 9 (order-sensitive for non-nested partitions). Satisfies 5–6, 8, 12.  

  3. **Minimally Informative Revision (MaxEnt)**:  
     Handles 3 (intervals) and 7 (partition insensitivity via constraints). Fails 1–2 (no reliability/meta-model), 4/10 (non-retractable), 9 (order-sensitive).  

  4. **Virtual Evidence (Likelihood Ratios)**:  
     Handles 1 (reliability as likelihood), 4/10 (retractable via Bayes factor reversal), 5, 12. Fails 2 (no second-order), 3 (requires likelihood, not intervals), 9 (order-sensitive).  

  ---

  ### Verdict: Reversibility
