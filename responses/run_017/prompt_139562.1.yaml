prompt: |-
  I'm writing a piece on whether populism's appeal to 'the will of the people' is constitutively anti-expert or only contingently anti-expert, and I need a case built to some rather awkward specifications.

  Please construct a scenario, realistic and at municipal or institutional scale — nothing I couldn't find in a mid-sized city, no sci-fi, no idealised assemblies — and short enough to state in one paragraph, in which the alignment everyone expects comes out inverted. The self-described populist, invoking the will of the people against unelected experts, should end up defending a policy that is a merely nominal proxy for what the people actually will, while the technocrat who says to defer to the experts is the one who best tracks it. The inversion has to fall out of the structure of the case rather than be stipulated by it, and it should be clear from the setup that (a) the people's substantive end is one thing and their belief about which policy achieves it is another, and (b) the experts' disagreement with them is purely instrumental — a dispute about the efficacy of means, not about whose values should win — and is conceded by both sides to be correct. So the case must not secretly turn on the experts knowing the people's values better than the people do, and must not lean on voter ignorance, disinformation, a badly worded ballot, low turnout, or a rigged consultation. Call the two views in play the say-so reading (the will of the people is whatever the people in fact demand) and the end-tracking reading (it is what they would demand, given what is true about available means); your scenario should put them on opposite sides of one decision, with the populist on the say-so side and the technocrat on the end-tracking side.

  After the scenario, give me: what each actor says; which reading each is implicitly committed to and why they can't easily swap; the single feature of the case doing the work; and what happens if that feature is removed — I expect we collapse back into an ordinary populism-versus-technocracy standoff, but tell me whether that's right.

  Two further things. The strongest populist reply I can anticipate is that the people's will includes the will that they be the ones who decide, so overriding the policy they named is disenfranchisement even when the experts are right about means — in which case the say-so reading isn't a fallback but the core of the matter, and the whole framing begs the question. Either close that off in the design and say how, or argue that it can't be closed off and say what that shows about my original question. And finally, be honest with me about whether all these constraints are jointly satisfiable; I'd much rather be told that two of them can't coexist than be handed a scenario that quietly cheats by sneaking in one of the excluded features.
reasoning: |-
  Hmm, the user is writing about populism and needs a realistic scenario that inverts the typical populist vs. technocrat dynamic. They want a case where the populist, appealing to "the will of the people," ends up defending a policy that's only nominally what people want, while the technocrat actually tracks their true desires. The scenario has to be municipal-scale, realistic, and free of common pitfalls like voter ignorance or disinformation.

  The key constraints are tricky: (a) people have a clear substantive end but are mistaken about the means to achieve it, and (b) experts disagree purely on instrumental grounds, not values. The populist must champion the "say-so" reading (whatever people demand), while the technocrat embodies the "end-tracking" reading (what people would want if they knew the facts).

  I'm considering a public health scenario. Let's say a city faces high childhood asthma rates. Residents vote overwhelmingly for a plan to replace diesel buses with electric ones, believing this will reduce pollution. Experts agree on the health goal but prove that the bus replacement would actually increase pollution near schools due to rerouting logistics. Their studies show retrofitting existing buses with better filters is more effective. 

  The inversion works because: residents correctly identify pollution reduction as their goal but misattribute the solution. Experts don't challenge the value—everyone wants healthier kids—only the efficacy of the means. The populist insists "people voted for electric buses, so we must deliver," defending the nominal proxy. The technocrat advocates for retrofitting because it actually achieves the shared end. 

  Now, addressing that strong populist reply about democratic process: if we design the vote as advisory (non-binding), the council retains legitimate authority to adjust means. This avoids disenfranchisement since the value mandate ("reduce pollution") is honored, just not the specific instrument. If the vote were binding, we couldn't escape the procedural argument—so the advisory nature is crucial. 

  Removing that feature would collapse into standard technocracy vs. populism. The case satisfies all constraints: no hidden voter ignorance (experts publish clear data), no value disputes, and the institutional setup allows correcting instrumental errors democratically. 

  Final check: yes, this holds up. The people's will about ends is respected; only their means-error is corrected. Populists can't credibly claim disenfranchisement when the outcome aligns with their deeper goal. It shows that populism's anti-expert stance is contingent—here, it obstructs the very will it claims to champion.
answer: |-
  Here's a scenario satisfying all constraints, set in a mid-sized city's Public Health Department:

  **Scenario:** Riverford faces persistently high childhood asthma rates near a major trucking corridor. Residents, organized by a populist councilor, demand "Zero Diesel Near Schools" via a high-turnout, well-publicized advisory referendum. The referendum passes (78%) calling for rerouting all diesel traffic away from school zones within 18 months. City traffic engineers and public health experts agree *unanimously* that rerouting would be disastrous: it would shift diesel pollution *onto* playgrounds and dense low-income housing in the adjacent neighborhood, *increase* overall city emissions due to longer routes, and cause gridlock delaying emergency vehicles. They present irrefutable data showing retrofitting existing city diesel vehicles (buses, garbage trucks) with advanced particulate filters *now* would achieve greater near-school pollution reduction faster, cheaper, and without the negative side effects. The populist insists on implementing the referendum's *literal demand* (rerouting), while the Chief Public Health Officer (technocrat) urges adopting the retrofit plan instead, arguing it fulfills the *underlying goal* voters endorsed.

  **What Each Actor Says:**
  *   **Populist:** "The people spoke loud and clear! 78% voted to reroute diesel trucks away from our kids' schools. That's the mandate. We don't need unelected engineers second-guessing the will of the people. Their job is to implement our decision, not tell us it's wrong. Democracy means respecting the vote."
  *   **Technocrat (Chief Public Health Officer):** "We all share the same goal: protecting children from diesel pollution near schools. The referendum showed overwhelming support for that end. However, the *specific policy* demanded (rerouting) will actually *increase* pollution exposure for children near playgrounds and harm vulnerable communities. Our data proves retrofitting achieves the *substantive outcome* voters want – cleaner air near schools – faster and more effectively. We must deliver on the *purpose* of the vote, not its flawed prescription."

  **Implicit Commitments & Why They Can't Swap:**
  *   **Populist is committed to Say-So Reading:** They interpret "will of the people" *exclusively* as the literal policy named in the referendum ("reroute diesel"). Swapping to end-tracking would force them to abandon their core argument ("respect the vote") and admit the experts' policy better serves the end, undermining their anti-expert stance and appeal to pure majoritarianism.
  *   **Technocrat is committed to End-Tracking Reading:** They interpret "will of the people" as the shared substantive end (reducing pollution near schools). Swapping to say-so would force them to endorse the rerouting plan they *know* is counterproductive, violating their professional ethics and expertise, which they concede is correct on the instrumental facts.

  **The Single Feature Doing the Work:** **The referendum question framed a *specific policy mechanism* (rerouting) as the *proxy* for achieving a *shared substantive end* (cleaner air near schools), while available evidence proves that mechanism is *instrumentally counterproductive* to that end, and a superior alternative mechanism (retrofitting) exists that demonstrably achieves the end.**

  **What Happens if That Feature is Removed?**
  *   If voters had directly voted on the *end* ("Should the city prioritize reducing diesel pollution near schools above other traffic considerations?") and left the *means* to experts, we'd have a standard technocracy scenario (experts choosing how to implement the mandate).
  *   If no demonstrably superior alternative existed (only the flawed rerouting plan), the technocrat would have no basis to oppose the popular will, collapsing back to populism vs. ineffective technocracy.
  *   Without the *proven* counterproductivity of the named policy, the technocrat's opposition lacks its foundation, reverting to a values dispute or simple expert paternalism.

  **Addressing the Strong Populist Reply (Procedural Will):**
  This *cannot* be fully closed off without violating realism (e.g., making the vote binding would force implementation). **How we handle it:** The referendum is explicitly *advisory*. The populist invokes the *moral* authority of the vote ("the people have spoken"), but the elected council retains formal decision-making power. The technocrat argues: "Respecting the people's *decision-making role* means using our best judgment to deliver the *outcome* they mandated. Implementing a policy *known* to harm their children, purely because it was named, betrays the trust they placed in us to govern wisely. Their will to decide is honored by our transparent process and focus on their true goal, not by blindly following a counterproductive instruction." This shows the *contingency*: Populism's anti-expert stance becomes indefensible when the named policy is proven to sabotage the voters' own ends. The "will to decide" is acknowledged, but the *content* of that decision (the flawed proxy) is challenged on instrumental grounds the voters themselves would accept if convinced.

  **Satisfiability of Constraints:**
  **Yes, all constraints are jointly satisfiable.** The scenario avoids:
  *   **Value Disputes:** Everyone agrees on cleaner air near schools.
  *   **Expert Superiority on Values:** Experts only claim superior knowledge of *means* (pollution dispersion, retrofit efficacy).
  *   **Voter Ignorance/Misinformation:** The referendum was well-publicized and clear. Voters weren't ignorant *of the policy they voted for*; they were rationally mistaken about its *effects* (a universal human possibility).
  *   **Bad Ballot/Rigging:** The ballot was clear ("Reroute all diesel traffic...").
  *   **Low Turnout:** High turnout lends legitimacy.
  *   **Sci-fi/Idealism:** Mid-sized city, realistic actors, advisory referendum.

  **What it Shows:** The scenario demonstrates that populism's anti-expert stance is **contingently**, not constitutively, anti-expert. Here, populism obstructs the achievement of the very "people's will" it invokes. The anti-expert impulse emerges *because* the populist leader is wedded to the *say-so* interpretation, even when it demonstrably fails to track the substantive will. The technocrat, by prioritizing the *end-tracking* interpretation, becomes the true agent of the people's substantive will *because* of, not despite, their expertise on means. The core conflict is thus revealed as one of *interpretation* of "the will of the people" in the face of complex causality, not an inherent clash between democracy and expertise.
