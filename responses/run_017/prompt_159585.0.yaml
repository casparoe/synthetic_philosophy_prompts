prompt: |-
  I sit on the clinical ethics committee at my trust, and we're currently trying to draft a policy on what we've started calling 'Ulysses clauses' in advance care planning for people with relapsing conditions — severe anorexia, bipolar disorder, opioid use disorder: instructions written while well that are meant to bind during a relapse, including when the patient is currently objecting. We write maybe a dozen of these a year, they get signed off by the medical director and the trust's legal team, and the policy will be read by ward staff who've had no ethics training, so it needs to be defensible in about a page. At the same time a friend who's on a constitutional review commission in a country I won't name keeps sending me her chapter on entrenchment to poke holes in, and doing both at once has made me realise I'm not at all sure my own package hangs together. Different people tell me different bits of it are inconsistent and I genuinely can't tell who's right, so before I put anything in writing I'd like an audit. Here's the set, in no particular order and with no idea which item is the load-bearing one:

  (a) Ulysses clauses should be enforced during relapse, over the patient's present protest. The reason I give isn't really 'she consented', it's that the earlier decision was made in better conditions and the current objection has exactly the shape the clause was written to defeat. I've been using a rough test: enforce only where the reasons the person gives now 'match the signature' of the predicted shift — the bipolar patient refusing admission because she feels fantastic and has a brilliant new business plan — and release where the reasons are genuinely new, e.g. she's become religious in the interim, or the intervention she refused has since been shown not to work.
  (b) Same in the addiction case: I'm happy with commitment contracts that impose a cost the person is now begging to be released from, and 'that wasn't really me' doesn't move me much.
  (c) But in advanced dementia I think the directive should give way to the person's present comfort and apparent well-being, because by then there's no one left who has a stake in the earlier project.
  (d) I'm a hard anti-paternalist at the bedside: a competent patient's current refusal is sovereign as against doctors, family and the state, however stupid I privately think it is.
  (e) On the constitution side, substantive entrenchment — locking in rights or structures behind a supermajority or a referendum — strikes me as illegitimate, on the dead-hand/equal-voice line: the living get to govern themselves, and it doesn't rescue it that the founders were allegedly calmer and wiser, or that the thing was re-ratified once twenty years ago. I am fine with purely procedural hurdles, though: a mandatory delay, a second vote after an intervening election, a citizens' assembly stage.
  (f) And I've got a half-formed thought I can't shake: the dead-hand worry feels proportional to how few of the bound people ever had a say. Entrenchment that reaches a generation mostly born later appals me; entrenchment that binds largely the same voters grown older barely bothers me at all.

  So: which of these actually collide, which only look like they do, and where's the cheapest place to give ground? Please rank the tensions by severity rather than flagging everything as equally bad, and for each one say what exactly would have to go, what holding the line instead would cost me (a case verdict? a rationale? a whole application?), and whether one single revision would clean up most of it. Be specific about the mechanism — I want to know what I'm committed to by what, not a tour of the topic. I've got no library access for a fortnight, so please don't cite anything or point me at reading; I want your reasoning. And British English throughout, if you wouldn't mind — the paper's going to a UK audience.
reasoning: |-
  Hmm, the user is on a clinical ethics committee drafting a policy on "Ulysses clauses" for advance care planning. They need to reconcile several seemingly conflicting ethical positions across both clinical ethics and constitutional theory. Let me break this down systematically.

  First, the core tensions. Position (d)'s hard anti-paternalism at the bedside clashes directly with (a) and (b) where they override current objections. The constitutional parallel in (e) condemns substantive entrenchment for similar "dead hand" reasons, yet (a/b) functionally entrench past decisions over present autonomy. That's the biggest fault line.

  The dementia exception (c) is fascinating - it reveals their intuition that identity persistence matters. But this undermines the anorexia/bipolar cases where they dismiss "that wasn't really me" arguments. If identity continuity justifies overriding present wishes in mental health relapses, why not in early dementia when more psychological connections remain? There's inconsistency in how they apply the identity threshold.

  The constitutional angle sharpens these contradictions. Their tolerance for procedural hurdles (e) but not substantive entrenchment mirrors clinical practice: Ulysses clauses function as substantive constraints, yet they'd accept purely procedural safeguards like mandatory reassessment periods. And their generational argument (f) is clinically relevant - clauses binding younger selves may be more defensible than those affecting profoundly changed individuals.

  For the policy, the cheapest fix is distinguishing clinical contexts by identity persistence. They should explicitly adopt a psychological continuity framework: enforce directives only when sufficient identity links remain (bipolar relapse yes, late dementia no). This resolves the dementia anomaly while maintaining their core position on relapsing conditions. The constitutional conflict remains but can be quarantined as a separate domain.

  The anti-paternalism stance (d) needs qualification - perhaps specifying that Ulysses directives aren't paternalism but extended autonomy. Without this, ward staff will rightly see contradiction. Procedural safeguards (time-limited clauses, mandatory review) could mirror their acceptable constitutional mechanisms and reduce ethical tension.

  Ultimately their framework is salvageable with: 1) identity persistence as the unifying clinical criterion, 2) reframing Ulysses clauses as autonomy-expanding rather than paternalistic, and 3) borrowing procedural constraints from their constitutional views. The policy must explicitly state these foundations to avoid staff confusion.
answer: |-
  Right, let's dissect this properly. You've got a logically coherent core under tension at the edges, mainly from the constitutional analogy haunting you. The biggest pressure point is the **dead-hand principle**, applied inconsistently. Here's the audit, ranking tensions by severity and cost to fix:

  1.  **Severe Tension: (a), (b) vs. (e) & (f) (The Dead-Hand Contradiction)**
      *   **Collision:** This is the core bind. In (a) and (b), you *are* endorsing substantive entrenchment: a past decision (made in a "better" state) binds the present self (in a "worse" state), overriding their current objection. Your justification ("better conditions", "signature match") directly parallels the constitutional arguments you reject in (e) ("founders calmer/wiser", "re-ratified long ago"). The "equal voice" principle in (e) – the living governing themselves – is fundamentally violated by enforcing a Ulysses clause over a competent *but relapsed* patient's current refusal. Point (f) highlights the inconsistency: why is binding a future self (who *is* largely "the same voters grown older") via a Ulysses clause acceptable, while constitutional entrenchment binding future citizens (who are also largely "the same voters grown older" plus new ones) is illegitimate? Both involve a past self restricting a future self's choices.
      *   **What Would Have to Go:** You *cannot* hold both (a)/(b) *and* (e) without a fundamental inconsistency in your reasoning about binding future selves/decision-makers. One set of principles must yield.
      *   **Cost of Holding the Line (a/b):**
          *   You must abandon or radically reinterpret the "dead-hand" and "equal voice" objections in (e) *as applied to individuals over time*. Argue that personal identity continuity (even through relapse) creates a moral link the past citizenry -> future citizenry link lacks. Emphasise the *specific, predictable pathology* targeted by Ulysses clauses as fundamentally distorting autonomy *now* in a way the founders couldn't foresee for a polity. This weakens your constitutional critique.
          *   **Policy Cost:** Your rationale for Ulysses clauses *cannot* rely *only* on "better conditions" without inviting the dead-hand counter. You *must* ground it firmly in **continuity of identity/personhood + specific impairment of autonomy during relapse**. Stress the "signature match" isn't just about better judgment, but about *recognising the pathology itself disabling the exercise of true autonomy*.
      *   **Cost of Holding the Line (e):**
          *   You must abandon enforcing Ulysses clauses over *current competent refusal* (even if relapsed). You could only use them as *strong evidence* of past wishes, but the *current* refusal would be sovereign per (d). This guts the core purpose of Ulysses clauses for conditions like anorexia/bipolar where refusal *is* the symptom.
          *   **Policy Cost:** Your entire Ulysses clause policy becomes largely advisory, potentially unusable in the hardest cases you designed it for. You'd lose a tool you find clinically and ethically necessary. Requires a major policy rewrite away from "enforcement".
      *   **Cheapest Fix:** **Hold (a)/(b), modify (e)/(f).** Explicitly distinguish *personal* precedent over time (with identity continuity and specific impairment) from *collective/constitutional* precedent. In (e), add: "This objection applies to *collective* self-governance; binding *personal* future decisions where specific, predictable impairments distort autonomy is distinct and may be justified on grounds of respecting the person's own longitudinal values and protecting them from transient but severe impairments." This quarantines the dead-hand principle to the constitutional context. **Policy Impact:** Reword your Ulysses rationale heavily: "These clauses are not about past consent binding the future, but about recognising that during relapse, a specific pathology (e.g., anosognosia in anorexia, grandiosity in mania, craving in addiction) *impairs the patient's ability to make decisions aligned with their own deeply held values and wellbeing as consistently expressed when well*. Enforcement occurs only when the *current refusal is demonstrably a manifestation of that specific impairment* ('signature match'), not a new, reasoned choice."

  2.  **Significant Tension: (c) vs. (a) & (b) (The Identity Threshold)**
      *   **Collision:** Your dementia stance (c) hinges on a loss of identity/personhood ("no one left who has a stake"). This implicitly accepts that binding future selves depends on sufficient psychological continuity. Yet, in (a) and (b), you dismiss "that wasn't really me" arguments *during relapse*. Why is identity continuity broken enough in late dementia to invalidate the directive, but *not* broken during a severe manic episode, anorexic relapse, or active addiction when the patient pleads "that directive wasn't the real me"? The identity persistence criterion in (c) seems logically applicable to (a)/(b), but you reject it there.
      *   **What Would Have to Go:** The absolute dismissal of identity concerns in (a)/(b) OR the identity-based rationale for (c). Consistency demands you apply the same threshold test.
      *   **Cost of Holding the Line (a/b):**
          *   You must argue that sufficient identity continuity *does* persist through relapse in anorexia/bipolar/addiction to make the directive meaningfully *theirs*, even if they disavow it. This requires a robust (but implicit) theory of identity continuity that distinguishes relapse (where core values/persona are still present, albeit buried) from late dementia (where they are largely extinguished). You already lean on this with "signature match" (it reflects *their* pathology).
          *   **Policy Cost:** Your dementia policy (c) becomes the anomaly. You need a clear, defensible distinction between "impaired but continuous self" (enforce directive) and "discontinuous self" (prioritise comfort). This must be articulated simply for ward staff.
      *   **Cost of Holding the Line (c):**
          *   You must accept that during severe relapse, identity *is* sufficiently disrupted that enforcing a directive is "paternalism towards a different person". This undermines the ethical basis for Ulysses clauses in mental health/addiction as you currently conceive them.
          *   **Policy Cost:** Similar to abandoning (a)/(b) above – policy becomes advisory or limited.
      *   **Cheapest Fix:** **Hold (a)/(b), refine (c), articulate the identity threshold.** Explicitly adopt a psychological continuity view. Argue that in the relapsing conditions covered by Ulysses clauses, *sufficient core identity and value structures persist* through episodes (even if obscured) to make the directive applicable – it's still *them*, just impaired. In advanced dementia, this continuity is *fundamentally ruptured*. Your "signature match" test *is* evidence of this continuity (it's *their* characteristic distorted thinking). **Policy Impact:** State clearly: "Ulysses directives rely on the understanding that the person experiencing relapse remains fundamentally the same individual who made the directive, albeit with impaired judgment due to their illness. In advanced dementia, the illness causes such profound cognitive change that the individual who made the directive is no longer meaningfully present. The directive therefore yields to current wellbeing."

  3.  **Moderate Tension: (d) vs. (a) & (b) (Bedside Paternalism)**
      *   **Collision:** Your hard anti-paternalism (d) states a competent patient's refusal is sovereign. Yet, in (a)/(b), you override the refusal of a patient *deemed competent during relapse* (competence is generally presumed unless specifically assessed otherwise; objecting during relapse doesn't automatically mean incompetence).
      *   **What Would Have to Go:** The absolutism in (d) OR the practice of overriding competent refusal in (a)/(b).
      *   **Cost of Holding the Line (a/b):**
          *   You must qualify (d): "A competent patient's refusal is sovereign, *except* where a valid Ulysses directive, meeting strict criteria X, Y, Z (foreseeable relapse, signature match, made when well), applies." Argue that enforcing the directive *isn't* paternalism overriding current autonomy, but *upholding the patient's own prior exercise of autonomy* to protect against a *known future impairment* of that autonomy. It's extended autonomy, not external paternalism.
          *   **Policy Cost:** The policy *must* define competence clearly and state explicitly that Ulysses clauses are a *specific, limited exception* to the general rule of contemporaneous consent/refusal. Ward staff need this crystal clear: "Normally, a competent patient's refusal must be respected. However, when a valid Ulysses directive exists AND the patient's current refusal demonstrably matches the predicted impairment pattern of their relapse, the directive takes precedence."
      *   **Cost of Holding the Line (d):** As above, abandoning (a)/(b).
      *   **Cheapest Fix:** **Qualify (d) explicitly.** This is essential for ward staff anyway. Frame Ulysses enforcement as an expression of *longitudinal autonomy*, not an exception based on beneficence/paternalism. **Policy Impact:** See above – explicit statement of the exception within the policy.

  4.  **Minor Tension: (f) Applied Clinically (Generational Binding)**
      *   **Collision:** While (f) is constitutional, its logic could apply clinically: binding a much "younger" self (e.g., a directive signed at 25 enforced at 65 during a first major manic episode decades later) might feel more "dead-hand"-ish than binding a self from last year. Your current framework doesn't address duration.
      *   **What Would Have to Go:** Nothing major *has* to go, but it highlights a potential vulnerability.
      *   **Cost of Holding the Line (a/b):** You need an argument why *time elapsed* doesn't break the identity continuity or validity justification in the same way dementia does. Argue that the core pathology and its distorting effects remain consistent, and the person had reason to foresee its recurrence regardless of time.
      *   **Cheapest Fix:** **Introduce a procedural safeguard mirroring (e).** Build into your Ulysses policy a requirement for **periodic review/reconfirmation** (e.g., every 2-5 years, or after significant life events) while the person is well. This addresses the "generational" concern clinically by ensuring the directive *still* reflects the views of a reasonably contemporaneous "well self". **Policy Impact:** Add to the policy: "Ulysses directives should be reviewed and formally reconfirmed with the clinical team at least every [X] years while the patient is well, to ensure they remain an accurate reflection of the patient's considered wishes."

  **Summary of Recommendations & Single Best Revision:**

  1.  **Address the Dead-Hand Head-On (Critical):** Revise your rationale for Ulysses clauses. **Stop framing it as "better decision then vs now".** Frame it as: **"Respecting Longitudinal Autonomy: Protecting the Patient's Own Values from Transient but Severe Pathological Distortion."** Emphasise the *continuity of identity* and the *specific, predictable nature of the impairment* during relapse that disables authentic choice. Explicitly distinguish this from the constitutional dead-hand problem in your own mind (and policy rationale).
  2.  **Articulate the Identity Continuity Threshold:** Clearly define why relapse ≠ loss of relevant identity (core values/persona persist but are obscured by pathology), but advanced dementia = fundamental rupture. Use "signature match" as *evidence* of continuity/pathology.
  3.  **Qualify Bedside Anti-Paternalism (d):** Explicitly state Ulysses directives are a defined exception based on the longitudinal autonomy principle above.
  4.  **Add Procedural Safeguard:** Implement mandatory periodic review/reconfirmation of directives.

  **The single revision that cleans up the most:** **Radically reframing the core justification for Ulysses clauses away from "past consent binds" or "better decision then" and towards "upholding the patient's own enduring values against a specific, transient pathological process that disables their current ability to express those values".** This directly addresses the dead-hand tension (it's about *their* ongoing self, not a past ruler), strengthens the distinction from dementia (where the "enduring self" is gone), and provides the foundation for qualifying (d) as respecting deeper autonomy.

  **Final Policy Note:** Given the audience (ward staff, no ethics training), the policy *must* be exceptionally clear and operational. Use bullet points or numbered steps. Define key terms (competence, relapse, signature match, identity discontinuity in dementia). State the general rule (d), the specific exception (Ulysses), the strict criteria for applying it (valid directive, relapse confirmed, signature match, competence assessed?), and the exception to *that* exception (advanced dementia/identity rupture). Explicitly state the rationale as "respecting the patient's own long-term values and wishes when their illness temporarily prevents them from acting on those values." Avoid constitutional analogies entirely in the policy document. Good luck!
