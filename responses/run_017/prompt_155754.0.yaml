prompt: |-
  I'm in a moral psychology seminar this term and our professor has spent like four weeks giving verdicts on whether particular cases count as genuine self-deception, and I definately think she's running some rule but I can't pin it down. Her verdicts so far:

  1. Classic jealous-partner case: she finds the texts and the hotel receipt, explains each one away, ends up sincerely convinced he's faithful, keeps checking his phone, has nightmares about it. Yes, paradigm case. (In lecture she said the old puzzle about how one person can believe p and not-p is a pseudo-problem, but she still says things like some part of her knows.)

  2. Patient given a vague, gentle prognosis, told they'll just keep an eye on it: believes she's basically fine, never asks a follow-up question, never googles anything. No. Her reason was that the doctor's vagueness, not her own wants, is doing all the causal work, though she added that if the patient had skipped the follow-up scan out of fear, that would be much closer.

  3. Lab head whose research program is visibly failing: sends drafts only to supportive friends, and when a hostile review comes back she files it as the reviewer not understanding the method. Yes.

  4. Guy who believes a dumb conspiracy theory because his feed is full of it: no stake either way, would be equally content either way, has never seen the counter-evidence. No, no desire doing any work.

  5. Woman convinced a colleague is sabotaging her, and he actually is. No: not deceived, just anxious.

  6. Department chair who sincerely believes he opposed a hire purely on merit grounds, having sat through meetings that made the real motive plain and discounted them. Yes, and she added that the object can be a motive or an attitude, not just a proposition.

  7. Guy who wants to believe his band is good: sends the demo only to people who'll praise it, and reinterprets the one lukewarm response as jealousy. Yes, and she said the straight-versus-twisted distinction doesn't matter for whether it counts.

  8. Patient who believes she'll beat the odds, where the belief genuinely helps her stick with treatment. Yes, and she said whether it's good for her is irrelevant to the classification.

  What I've noticed is that every yes case seems to have both (a) her taking in some counter-evidence and handling it badly because of the desire, and (b) her steering which evidence reaches her in the first place — and every no case seems to have neither. Which is annoying, because it means I can't tell which one she thinks is doing the work.

  My case for next week: a fourth-year, call her M., who suspects her supervisor thinks her project is dead in the water and wants her to change topics. She has never opened one of his messages directly — she routes them through a chatbot assistant she configured herself to summarise them in the most encouraging way that's still accurate and to drop the critical bits; she's muted the lab Slack; she's asked her labmates not to repeat anything he says about her; and she set it up in the first place because a friend with a similar setup said it made her whole semester bearable. She now firmly believes he thinks it's going fine and is just busy. She sleeps fine, no nightmares, doesn't snoop, and there is nothing she is currently reinterpreting or discounting, because no counter-evidence has ever reached her. If you asked her why she built it she'd say she doesn't care whether he thinks it's going badly, she just can't deal with that this semester. She would also shut down a friend who tried to tell her.

  So what's she going to say about M.? I care less about the yes or no than about which rule she's actually running — does the desire have to distort how you take in evidence you already have, or is steering the sample enough on its own, or is it a third thing I haven't thought of (maybe something about the counterfactual, that she'd resist being told, or about her motive being not-wanting-to-be-hurt rather than wanting the proposition to be true)? Does it matter that the distortion lives in a tool she built rather than in her own reasoning? Give me your best guess with the reasons for preferring it, and tell me which variant of the case would actually separate the candidate rules: I was thinking the version where the department rolled out the summarising tool for everybody and she just never switched it off, the version where she starts having nightmares and creeping on her supervisor's calendar, the version where she built the whole setup two years ago before she had any suspicion at all, and the version where if you pressed her she'd admit she does want to believe he thinks it's fine. If you think her verdicts genuinely underdetermine it, say so and say what she'd be committing herself to with each answer.
reasoning: |-
  Hmm, the user is in a moral psychology seminar trying to figure out their professor's implicit rule for classifying cases as genuine self-deception. They've provided several examples where the professor said "yes" or "no," and they've noticed a pattern: all "yes" cases involve both actively distorting counter-evidence and selectively avoiding evidence, while "no" cases lack both. Now they have their own case, "M.," to present next week and want to predict the professor's verdict and understand her underlying rule.

  The user has identified that in the "yes" cases (like the jealous partner, failing lab head, and band guy), there's both cognitive distortion (twisting evidence) and selective exposure (steering evidence away). The "no" cases (like the patient with vague prognosis or conspiracy theorist) lack these elements. The tricky part is that both elements are always present together in the "yes" cases, so it's hard to isolate which one the professor thinks is essential.

  Looking at M.'s case: she's set up a system to filter out any negative feedback from her supervisor. She actively avoids counter-evidence through technological and social means, but there's no mention of her distorting evidence because none reaches her. She built the system not because she wants to believe her supervisor is supportive, but because she "can't deal with" negativity this semester. If asked, she'd deny caring about his opinion, yet she shuts down anyone who tries to tell her otherwise.

  Key questions for the professor's rule:
  - Is selective exposure (steering evidence) sufficient for self-deception, or must there be distortion of evidence already received?
  - Does the motive matter? The professor emphasized desire in several cases (e.g., the jealous partner "wants" to believe fidelity), but in M.'s case, the motive is avoidance of pain, not pursuit of a specific belief.
  - What about the role of tools? M. outsourced the filtering to a chatbot—does this externalization change anything?

  Predicting the verdict: I think the professor will say "no" to M. being self-deceived. Why?
  - In the "no" verdicts, the professor focused on absence of desire-driven distortion. For example, the patient with vague prognosis wasn't self-deceived because the doctor's vagueness, not her own desire, caused ignorance. Similarly, M.'s setup prevents evidence from reaching her, but without evidence to distort, and without a clear desire for the belief (she claims not to care), it might look like mere avoidance.
  - The professor's "yes" cases require some engagement with counter-evidence. In the department chair case (yes), he discounted meeting discussions; in the jealous partner (yes), she explained away texts. M. has no counter-evidence to engage with.
  - The professor might argue that M.'s system is preemptive—it stops evidence before belief-formation, so there's no "deception" in the moment. Self-deception, for her, might require ongoing management of dissonance.

  But here's the tension: M. is clearly invested in not knowing. She shuts down friends and built a whole system to avoid reality. The professor might acknowledge this as self-deception if pressed, but based on past patterns, she'll likely say "no" because there's no active distortion.

  Variants to test the rules:
  1. **Department-mandated tool:** If everyone uses the summarizer and M. never turns it off, the professor might still say "no" because no desire drives M.'s inaction (like the passive conspiracy theorist).
  2. **Nightmares/evidence-tampering:** If M. starts misinterpreting filtered summaries or snooping, it becomes like the jealous partner—distortion plus avoidance—so definite "yes."
  3. **Preemptive setup years prior:** If M. built the system before any suspicion, it might look like general anxiety management, not belief-preservation, leading to "no."
  4. **Admitting desire:** If M. admits she *wants* to believe her supervisor is supportive, it becomes desire-driven avoidance. The professor might still say "no" without distortion, but this variant could force her to clarify if desire alone suffices.

  Why this matters: If the professor says "no" to M., she's likely requiring distortion, not just avoidance. If she says "yes," avoidance might be sufficient. But given her past emphasis on "handling counter-evidence badly" (e.g., in the patient case, skipping a scan would make it "much closer"), distortion seems key. M. lacks that, so probable "no."

  The user should present the case as-is first, then probe with variants. The most revealing might be adding distortion (e.g., M. misreads a summary) or admitting desire—both could flip the verdict and expose the professor's priorities.
answer: |-
  Based on your analysis of the professor's pattern and the nuances in her verdicts, I'll break this down: my prediction for her verdict on your M. case, the reasoning behind it (including her likely implicit rule), variants that could test her rule, and what each outcome would reveal about her commitments. My best guess is that she'll say **"no" to M. being a case of genuine self-deception**, but the reasoning will hinge on a specific aspect of her rule that you've partially identified. Let's unpack it.

  ### Step 1: The Professor's Implicit Rule (as Best as We Can Reconstruct)
  From your summary, the professor's "yes" cases consistently feature **two intertwined mechanisms**:
  - **Active distortion of counter-evidence**: The subject encounters evidence that contradicts their desired belief but misinterprets, reinterprets, or discounts it due to a motivational state (e.g., jealousy in case 1, career investment in case 3).
  - **Selective evidence exposure**: The subject actively steers their epistemic environment to avoid or minimize counter-evidence, driven by the same motivational state (e.g., sending drafts only to friends in case 3, avoiding follow-up scans in the variant of case 2).

  Crucially, her "no" verdicts occur when:
  - There's **no motivational driver** (e.g., the conspiracy theorist in case 4 has "no desire doing any work").
  - Or the **ignorance is passive or externally imposed** (e.g., the patient in case 2 isn't self-deceived because the doctor's vagueness is the primary cause, not her own desires).

  However, the key insight from her comments is that **distortion is likely the core requirement for her**. She treats selective exposure as *supportive* but insufficient on its own unless it directly facilitates distortion. This is hinted at in:
  - Case 2 variant: Skipping the scan "would be much closer" because it implies active avoidance enabling distortion (e.g., avoiding evidence that might force confrontation).
  - Case 6: The chair discounts meetings—distorting existing evidence—which is central to her "yes."
  - Her dismissal of the "pseudo-problem" of believing p and not-p: She likely sees self-deception as a dynamic process of *managing cognitive dissonance*, where distortion is the active mechanism ("some part of her knows" implies unresolved tension).

  Thus, her implicit rule seems to be:  
  **Self-deception requires a motivationally driven process where the subject *distorts counter-evidence they encounter* to maintain a desired belief. Selective evidence-steering may accompany this but isn't sufficient alone; it must serve or enable distortion. The subject must be actively engaged in preserving the belief against threats.**

  ### Step 2: Prediction for Your M. Case and Why
  - **Verdict: No** (not genuine self-deception).  
  - **Reasoning**:  
    M. has **strong selective exposure** (chatbot filtering, muting Slack, instructing labmates) driven by a motive ("can't deal with that this semester"). But she **lacks any distortion of counter-evidence** because no counter-evidence reaches her. The professor will likely argue that M.'s setup is "preemptive avoidance" or "strategic ignorance," not self-deception, because:
    - There's no evidence to distort, so no cognitive tension or "handling" of counter-evidence (contrast with case 1, where texts are explained away).
    - M.'s motive is framed as *avoiding emotional pain* ("I just can't deal with it"), not *wanting a specific belief* (e.g., "I want to believe my supervisor supports me"). The professor has distinguished motives before (e.g., case 5: anxiety isn't deception; case 8: desire for belief is present).
    - The outsourcing to a tool might weaken the case: The professor could say M. is merely "delegating" avoidance, not engaging in self-deceptive cognition herself (though she built the tool, which complicates this).
    - Parallels to "no" cases: Like the vague-prognosis patient (no distortion, ignorance externally enabled), or the conspiracy theorist (no motivational stake in the belief). M.'s setup is analogous to "never Googling" in case 2—passive once established.

  However, she might acknowledge it's "close" (like the scan-skipping variant in case 2), especially because M. would "shut down a friend," implying potential *future* distortion if evidence slipped through. But based on the case as given, I think she'll say no.

  ### Step 3: Variants to Test the Rule (and Which One Best Separates the Candidates)
  To isolate whether distortion is necessary or if selective exposure suffices, propose these variants. The most revealing one is **Variant 2**, but all test different aspects:

  - **Variant 1: Department-mandated tool**  
    *"The department rolled out the summarising tool for all grad students to manage email overload. M. uses it but never adjusted the settings, and it happens to filter critical comments. She’s unaware it’s hiding anything."*  
    - **Prediction**: Firm "no." No active steering by M., so no motivational driver. Resembles case 2 (doctor's vagueness) or case 4 (algorithmic feed)—ignorance is externally imposed.  
    - **Tests**: Confirms if *motivationally driven* steering is required. If she says no here but yes to original M., steering alone isn't enough; motivation must be present. But original M. might still be "no" due to no distortion.

  - **Variant 2: Nightmares and evidence-tampering**  
    *"After a year with the tool, M. dreams her supervisor is laughing at her work. She starts checking his public calendar for meetings with her rivals, interpreting routine events as proof he’s undermining her. She still uses the chatbot but now misreads neutral summaries as positive."*  
    - **Prediction**: Clear "yes." Now there's active distortion (misinterpreting calendars/summaries) *and* steering, driven by anxiety/desire.  
    - **Tests**: Directly probes if distortion is necessary. If she flips to "yes" here, distortion is the key trigger. Also echoes case 1 (nightmares + reinterpretation) and case 7 (reinterpreting lukewarm feedback).

  - **Variant 3: Preemptive setup**  
    *"M. built this system two years ago, before any supervisor issues, because her friend said it reduced anxiety. She only later suspected her project was failing but now believes it’s fine."*  
    - **Prediction**: Leans "no." The setup wasn't motivated by a specific belief-defense, so it looks like general coping, not self-deception. The professor might compare it to case 4 (no stake) or case 2 (passive).  
    - **Tests**: Whether the motivational driver must be *belief-specific*. If she says no here but yes to original M., belief-focused desire is key.

  - **Variant 4: Admitting desire**  
    *"Same as original, but if pressed, M. admits she desperately wants to believe her supervisor thinks it’s going fine. She says the tool helps her 'stay focused on the truth.'"*  
    - **Prediction**: Toss-up, but I’d still guess "no" unless distortion is added. Desire is present, but no counter-evidence is distorted—only avoided. The professor might call it "wishful thinking" but not full self-deception (which requires evidence-handling, per her pattern).  
    - **Tests**: Whether desire + steering suffices without distortion. If she says "yes" here, desire-driven steering alone might be enough for her (but this contradicts her case 2 and 4 verdicts). More likely, she’d call it "proto" self-deception but not paradigmatic.

  **Best variant to separate rules: Variant 2** (adding distortion). It directly tests if distortion is necessary by introducing it while keeping steering constant. If she says "yes" only here, her rule requires distortion. If she says "yes" to original M. *or* Variant 4 (desire + steering), she might prioritize motivational steering alone—but I doubt it based on her past emphasis on evidence-handling.

  ### Step 4: What Her Verdict Would Commit Her To
  - **If she says "yes" to original M.**: She commits to **selective evidence-steering being sufficient for self-deception** on its own, provided it's motivationally driven. This would contradict her "no" in case 2 (vague prognosis) and case 4 (conspiracy theorist), unless she argues M.'s active tool-building makes it "engagement" (but case 4's algorithm is passive). She'd need to explain why M.'s avoidance differs from skipping the scan in case 2 (which she called "much closer" but not definitive).  
  - **If she says "no" (as predicted)**: She commits to **distortion of counter-evidence as necessary**. This aligns with her "yes" cases all featuring distortion (even if subtle, like case 6's discounting) and "no" cases lacking it. It also clarifies that self-deception isn't just about belief outcomes but the *process* of defending against evidence.  
    - The counterfactual you mentioned ("she'd resist being told") might surface here. She could say M. exhibits "resistance" but not full self-deception because no evidence is being distorted—yet. This would make self-deception a "online" cognitive process, not an offline structural one.

  ### Final Thoughts
  I think her verdicts *slightly* underdetermine the rule between "distortion required" and "distortion + steering required," but distortion is the heavier lift. Her focus on "handling counter-evidence badly" (case 2, case 1) and "discounting" (case 6) suggests distortion is non-negotiable. M. has sophisticated avoidance, but it's prophylactic—it prevents dissonance rather than managing it. For your seminar, emphasize M.'s lack of cognitive engagement with counter-evidence. If the professor says "no," push her on whether a tool like this *becomes* self-deception once counter-evidence is filtered (e.g., "Is M. deceiving herself by ensuring she never has to confront reality?"). That might force her to clarify if structural avoidance can be self-deceptive. 

  If you run the variants, report back—I’d love to hear how it goes! For now, bet on "no."
