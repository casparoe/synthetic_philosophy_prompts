prompt: |-
  so I'm writing a novel — near-future thing, a research ship in orbit and a drilling company breathing down everyone's neck — and I've written myself into a corner. Two of my characters have been stuck in a room together for eleven months and are supposed to hand the Classification Board one joint memo. One of them is a metabolism-first person, in the autopoiesis / self-maintaining-chemical-system tradition: life is something a thing does to keep itself going, and a virus isn't alive because it never runs its own show. The other is an information-first person in the NASA-working-definition tradition: life is a system that can undergo Darwinian evolution, metabolism is just plumbing, what matters is heritable variation plus differential success. The stakes aren't academic: if the Board says alive, the vent field gets protected and the drilling permit dies; if it says not alive, the company moves in next week.

  I need the memo they'd actually produce after a good-faith year of arguing, not a tidy encyclopedia entry. Give me the claims both of them can sign; the exact places they still differ, in wording each side would accept for its own view; the cruxes — the sub-questions where settling them would move at least one of them; and for each crux the test or case both agree would bear on it, with each side's prediction written down in advance. And if any part of their fight turns out to be about words rather than the world, say which part and why.

  The material on the table is all invented by me, so please work with my cases rather than reaching for real ones (and no citations or further reading — I'm not putting footnotes in a novel):

  - the plume filaments: strands that grow inside the mineral chimneys of a vent field. They hold an internal chemistry far from equilibrium, they repair themselves, and they copy short sequence-patterns with heritable variation, some variants leaving more copies than others. But the copying only ever happens against the chimney's mineral surface; move a strand off the vent and it keeps its chemistry indefinitely but never copies again.
  - the Kestrel agent: virus-like, no metabolism of its own, inert on its own — but inside a host cell it directs the whole metabolism, and it evolves fast.
  - the Ridley reactor: a lab setup, no cells and no membranes, just a chip-fed vat that drips in pre-activated building blocks. Ten years in, it has thrown up catalytic functions nobody designed and nobody predicted.
  - the cinder field: an old dried-up vent where the same chemistry still creeps along, a thousand times slower, and structures keep accumulating over centuries. Nothing there has copied anything in a long, long while.

  Format it as a numbered agreed-claims section, then a disagreements table, then the cruxes with predictions. Keep the register flat enough that two exhausted scientists would sign it, and add a couple of lines at the end on where each of them privately thinks the other one caved. Oh, and if you think one of my four cases is doing no real work — that it definately just reduplicates another — say so and drop it rather than padding.
reasoning: |-
  Okay, the user is writing a near-future sci-fi novel involving a research ship and corporate pressure. Two scientists have been stuck debating the definition of life for eleven months and need to produce a joint memo. The user has provided specific fictional cases to analyze, and wants a realistic document showing both agreement and unresolved conflicts. 

  Hmm, the core tension here is brilliant - it's not just academic but has real stakes for the vent field's protection. The metabolism-first vs information-first debate maps neatly onto real scientific divides (Varela/Maturana vs NASA astrobiology). What makes this tricky is the need for authentic compromise language - scientists who've argued for a year wouldn't suddenly agree completely, but would find precise points of truce.

  The plume filaments case is clearly the centerpiece. Interesting how it splits the difference: metabolism-first sees self-maintenance, information-first sees imperfect evolution. The "requires external architecture" point is key - that's where both can hang their disagreements. 

  Kestrel agent feels redundant with viruses - metabolism-first would dismiss it as non-living for the same reasons. Might as well drop it to tighten the memo. Ridley reactor is useful though - shows metabolism-first's discomfort with accidental systems. And cinder field perfectly demonstrates their shared "not currently alive" verdict despite past potential.

  For the memo structure: starting with agreed baseline definitions makes sense. Then table format for disagreements keeps it clean. The predictive tests are crucial - they show where the science could theoretically resolve things, even if it doesn't yet. 

  Ah, and the private cave notes at the end - that's where character voices come through. Metabolism-first thinks info-side conceded by acknowledging non-evolutionary maintenance; info-first thinks metabolism conceded by accepting passive replication as "information handling." Beautifully messy.

  Biggest challenge was wording the compromises without watering down positions. Like "undergo Darwinian evolution" with the caveat "when architecture permits" - lets both sides interpret "permits" as they wish. Exhausted-scientist tone means short sentences, minimal adjectives, and that lovely passive-aggressive "we concur" phrasing throughout.
answer: |-
  Here's the joint memo draft reflecting eleven months of blood, sweat, and caffeine, drafted in the flat, precise register of exhausted professionals prioritizing clarity over elegance, with agreed compromises, unresolved differences, and testable predictions:

  **MEMORANDUM: Classification of Specimens (Case Designations: Plume Filaments, Kestrel Agent, Ridley Reactor, Cinder Field)**
  **Authors:** Dr. Anya Voss (Metabolism-First Framework), Dr. Elias Thorne (Information-First Framework)
  **Date:** [Date of Submission]
  **Subject:** Joint Assessment for Planetary Protection Classification Board

  **1. Agreed Claims (Both Signatories Concur):**

      1.  **Definitional Baselines:** We acknowledge competing frameworks exist for defining "life." Voss emphasizes *autopoietic self-maintenance far from equilibrium* as primary. Thorne emphasizes *capacity for open-ended Darwinian evolution* (heritable variation + differential fitness) as primary.
      2.  **Kestrel Agent:** Classify as **Not Alive**. (Voss: Lacks intrinsic self-maintenance, entirely dependent on host metabolism. Thorne: While highly evolvable within a host, lacks independent capacity for evolution; its "life" is contingent on hijacking a qualifying system).
      3.  **Ridley Reactor:** Classify as **Not Alive**. (Voss: Demonstrates spontaneous catalysis but lacks organized self-maintenance; chemistry is externally driven/controlled, not autonomous. Thorne: Shows complexification but lacks heritable information; variations are not copied/selected, merely emergent).
      4.  **Cinder Field:** Classify as **Not Alive**. (Voss: Chemistry is near-equilibrium, lacking active self-maintenance. Thorne: Shows historical accumulation but zero evidence of current replication, variation, or selection; functionally static).
      5.  **Core Dispute Focus:** The Plume Filaments represent the primary case where our frameworks yield conflicting conclusions. Resolution hinges on whether their properties meet the *threshold* for "life" under either framework, considering their environmental dependencies.
      6.  **Empirical Grounding:** Classification must be based on observable properties and behaviors, not potential or historical states. The *current* state of the specimens is determinative.
      7.  **Environmental Dependency:** The Plume Filaments' key processes (self-repair, pattern copying) are fundamentally dependent on the specific, active mineral chimney environment. Removal halts key functions.

  **2. Disagreements (Specific Wording Differences Acceptable to Each Framework):**

  | Aspect                      | Dr. Voss (Metabolism-First) Acceptable Wording                                      | Dr. Thorne (Information-First) Acceptable Wording                                     |
  | :-------------------------- | :---------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------ |
  | **Plume Filaments: Core Status** | "Exhibit organized self-maintenance far from equilibrium."                          | "Exhibit molecular replication with heritable variation and differential success."     |
  | **Plume Filaments: Life Threshold** | "**Are alive** (within their native environment) due to persistent, autonomous self-maintenance." | "**Are not alive** as they lack an independent capacity for open-ended evolution; replication is environmentally constrained and finite." |
  | **Key Dependency Interpretation** | "Environment enables inherent self-maintenance capability."                       | "External architecture provides necessary machinery for incidental replication."       |
  | **Information Handling in Plumes** | "Molecular copying is a consequence of self-maintaining chemistry."               | "Molecular copying constitutes information transfer, albeit limited."                 |
  | **Ridley Reactor Significance** | "Highlights the distinction between complex chemistry and organized self-maintenance." | "Demonstrates complexity without heritable information, reinforcing the evolution threshold." |

  **3. Cruxes (Resolvable Points with Agreed Tests & Predictions):**

  Cruxes represent specific empirical questions where resolution *could* shift at least one signatory's position on the Plume Filaments' status.

  *   **Crux 1: Fidelity & Scope of Heritable Variation**
      *   **Question:** Do Plume Filament sequence variations demonstrably lead to *novel, functional differences* in self-maintenance, repair efficiency, or environmental resilience *within the chimney environment itself*? (i.e., is variation truly subject to *differential fitness* based on function, not just drift or physical constraint?).
      *   **Agreed Test:** Long-term (minimum 5 Earth years) in-situ monitoring of tagged filament lineages within active chimneys. Track sequence changes, correlate with measurable performance metrics (growth rate, repair speed after simulated micro-damage, persistence under controlled fluctuations in vent chemistry/temperature), and compare against neutral mutation rates established in controlled lab analogs.
      *   **Voss Prediction:** Variations will show minimal correlation with functional performance. Observed differences in success will be primarily stochastic or due to local physical/chemical gradients, not functional adaptation. *(Resolution favoring Voss would strengthen her "not alive" position under Thorne's framework)*.
      *   **Thorne Prediction:** Variations will show statistically significant correlations with specific functional advantages/disadvantages in the vent environment, indicating true differential fitness and thus Darwinian evolution. *(Resolution favoring Thorne would force Voss to either concede "alive" under Thorne's terms or significantly defend why functional evolution isn't sufficient for life in her view)*.

  *   **Crux 2: Intrinsic Drive vs. Environmental Forcing of Replication**
      *   **Question:** Is the pattern-copying process in Plume Filaments driven *primarily* by the internal chemistry of the filament itself, or is it overwhelmingly a templating effect imposed by the *specific, dynamic* mineral surface of the *active* vent chimney?
      *   **Agreed Test:** Develop a synthetic, inert mineral substrate mimicking the *exact* surface chemistry/structure of an active vent chimney. Extract fresh filament material. Attempt replication *ex-vivo* on the synthetic surface under controlled conditions replicating vent chemistry/temperature *without* the presence of an active chimney flow field or the filament's native self-maintaining chemistry being fully engaged (i.e., only providing pre-activated building blocks, mimicking the Ridley reactor environment but with the specific template).
      *   **Voss Prediction:** Replication will fail or be extremely error-prone/inefficient without the *active self-maintaining state* of the filament interacting with the *dynamic flow* of the real chimney. Replication is an emergent property of the *whole active system*, not a separable "information" process. *(Supports Voss's view of integrated self-maintenance as primary)*.
      *   **Thorne Prediction:** Replication will occur with similar fidelity/rate as in-situ, demonstrating that the *information transfer* (templating) is a property that can be decoupled and enabled by the correct external architecture alone. *(Supports Thorne's view of replication/information as the core phenomenon, enabled by environment)*.

  **4. Semantic Dispute:**

  *   **The core dispute over the Plume Filaments is fundamentally about the definition of "life," not solely about empirical observations.** We agree on the *behaviors* (self-maintenance, repair, limited copying with variation). The disagreement centers on whether the observed self-maintenance constitutes "autonomous life" (Voss) or whether the observed replication/variation constitutes "evolutionary life" despite its environmental constraints (Thorne). The other cases (Kestrel, Ridley, Cinder) are largely uncontested under both frameworks as presented.

  **Where They Think The Other Caved (Private Notes - Not for Memo):**

  *   **Voss thinks Thorne caved by:** Explicitly agreeing that the Kestrel agent, despite its high evolvability *within* a host, is not alive independently. This implicitly concedes that evolvability alone, without intrinsic metabolic capability (or a host providing it), is insufficient for "life," weakening the pure information-first stance when applied to novel systems.
  *   **Thorne thinks Voss caved by:** Accepting the description of Plume Filament copying as "molecular replication with heritable variation" and agreeing to tests (Crux 1) that explicitly look for Darwinian dynamics. This formally introduces the *concept* of evolution (even if Voss disputes its significance or autonomy) into the assessment of the filaments under her framework, moving away from a purely metabolic definition in practice.

  **Note on Cases:** The **Kestrel Agent** was deemed largely redundant for resolving the core Plume Filament debate. It strongly parallels the terrestrial virus debate already familiar to both frameworks and doesn't introduce a novel challenge distinct from Plume or Ridley. It was dropped from detailed analysis beyond the agreed "Not Alive" classification to avoid unnecessary padding. Plume, Ridley, and Cinder provide sufficient contrast.
