prompt: |-
  I am a novelist, three volumes into a science-fiction sequence set on a terraformed world whose biosphere I have to keep internally consistent across some nine hundred pages and a series bible that a continuity editor and a scientific consultant now maintain alongside me. In the current book my narrator repeatedly has to say what an organismal trait is *for*: that a chambered organ is for pumping, that a cranial crest is for display, that a gland is for signalling distress. I gather that the philosophy of biology splits roughly between accounts that fix a trait's function by its history — what it was selected for, or what a designer installed it to do, in the lineage — and accounts that fix it by the contribution it currently makes to the capacity of some containing system. I do not need the literature; I need the distinction turned into something I can run.

  So: write me a decision procedure for assigning a function to a trait in my fictional biosphere, which I can execute in about fifteen minutes at the point of drafting, with no more biology than an educated general reader has, and whose output is a one- or two-line entry my continuity editor can file and my consultant can check in our monthly pass. Give me the questions in the order I should ask them; what counts as a sufficient answer to each; the point at which the procedure returns a firm no; and the points at which it hands the decision back to me because the remaining question is one of narrative emphasis rather than fact. It must have explicit branches for traits that were designed rather than evolved, for traits whose history my world has a documented break in (several species were re-engineered by an earlier terraforming programme and then left to selection for centuries, so record and subsequent history come apart), and for traits whose history I have deliberately left blank and do not intend to fill in — tell me what the procedure does when the historical evidence is simply unavailable, since that will be most of my cases. Tell me which distinctions from the philosophical debate have to survive the simplification and which I can drop without the procedure breaking.

  Then run it on three entries from the current manuscript, in full: (1) a hollow cranial crest inherited from a burrowing ancestor, now used by the animal in courtship display; (2) an implanted filtration organ, originally installed by the terraformers to remove a toxin, which in the descendant population now mainly drives circulation fast enough that my characters call it a second heart; (3) a bioluminescent frill on an organism whose lineage record I have intentionally left unwritten. I expect to dislike the answer on at least one of these — say which and why, rather than steering toward what I would prefer.

  Begin with a single sentence stating the bottom line of the procedure, the one rule everything after it is a gloss on, and only then give the procedure and the worked cases; no preamble, and no restating back of what I have asked.
reasoning: |-
  We are to create a decision procedure for assigning function to a trait in a fictional biosphere. The bottom line rule is:

  **Assign the function that currently explains the trait's maintenance in the population, unless historical evidence of original design or selection is both available and relevant to the current context.**

  Now, the procedure:

  1. **Is the trait designed?**
     - *Check*: Was the trait intentionally created by an intelligent agent (e.g., terraformers) for a specific purpose?
     - *Evidence*: Look for documented design records, explicit engineering, or known modification events.
     - *Outcomes*:
       - **Yes, and we know the original purpose**: Record the original design function as the primary function. Go to step 3 to check for current contributions.
       - **Yes, but original purpose unknown or records lost**: Treat as if history is unavailable (go to step 2).
       - **No**: Go to step 2.

  2. **Is the trait's evolutionary history known?**
     - *Check*: Do we have evidence of what the trait was selected for in the past?
     - *Evidence*: Fossil record, genetic analysis, or established evolutionary lineage in the world's bible.
     - *Outcomes*:
       - **Known and distinct from current use**: Record the historical function (what it was selected for) but note it is historical. Then go to step 3.
       - **Known and same as current use**: Record that function and stop (current and historical match).
       - **Unknown (or lost records, or re-engineered and then selected without record)**: Go to step 3 without a historical function.

  3. **What does the trait currently do?**
     - *Check*: What is the trait's current causal role? What effect does it produce that contributes to the organism's survival, reproduction, or overall functioning?
     - *Evidence*: Observations of the organism's behavior, physiology, and ecology in the present.
     - *Outcomes*:
       - **It has a clear current contribution**: Assign the current function (what it does now that helps the organism). Go to step 4.
       - **No clear current contribution (e.g., vestigial)**: Assign no current function (or "vestigial"). Stop.

  4. **Is there a conflict between history and current contribution?**
     - *Check*: If we have both historical (from step 1 or 2) and current (from step 3) functions, are they the same or different?
     - *Outcomes*:
       - **Same**: Assign that function. Stop.
       - **Different**: Assign the current function as the primary one. But note the historical function as an "exaptation" or "re-purposed" if it was previously adaptive for something else. Stop.

  **Special Cases**:
  - **Designed but history lost (step 1)**: We skip to current contribution (step 3) and assign that.
  - **Re-engineered traits**: If the trait was modified by terraformers and then left to selection, then:
    - If the original design is known, it's historical (from step 1). Then we check current (step 3). If they differ, the current function is primary and the design function is noted as the origin.
    - If the original design is lost, then we rely on step 3 (current) and note that the trait was re-engineered but the original purpose is unknown.

  **When to stop and hand back to the author**:
  - The procedure returns a firm "no function" only if step 3 finds no current contribution and there is no known historical function (or if the trait is vestigial and not maintained).
  - The procedure hands back to the author (for narrative emphasis) in the following cases:
    - When there is a conflict (step 4) and the author must decide whether to emphasize the historical or current function in the narrative (though the procedure assigns the current as primary for the record).
    - When the evidence is ambiguous at step 3 (multiple possible current contributions) and the author must choose which is most relevant to the story.

  **Simplifying Philosophy**:
  - We drop the requirement for a detailed account of selection history when it is unknown. We rely on current contribution as the default.
  - We keep the distinction between original design and evolutionary history because it matters for the backstory, but if the design is unknown, we treat it as an unknown history.

  **Worked Examples**:

  **(1) Hollow cranial crest inherited from a burrowing ancestor, now used in courtship display.**

  - Step 1: Designed? No. (It's evolved.) → Step 2.
  - Step 2: Evolutionary history known? Yes, it was for burrowing (structural support or digging). → Historical function: burrowing. Then step 3.
  - Step 3: Current contribution? Used in courtship display (attracts mates, so aids reproduction). Current function: display.
  - Step 4: Conflict? Yes (burrowing vs. display). Assign current function (display) as primary. Note: exaptation from burrowing.
  - **Record**: "Function: courtship display (exapted from ancestral burrowing support)."

  **(2) Implanted filtration organ, originally for toxin removal, now mainly drives circulation (called a 'second heart').**

  - Step 1: Designed? Yes, by terraformers to remove a toxin. Original purpose known. → Historical function: toxin filtration. Then step 3.
  - Step 3: Current contribution? Drives circulation (so helps in pumping blood). Current function: circulation pump.
  - Step 4: Conflict? Yes (filtration vs. circulation). Assign current function (circulation) as primary. Note: originally designed for filtration.
  - **Record**: "Function: circulation pump (re-purposed from designed filtration organ)."

  **(3) Bioluminescent frill, lineage record intentionally unwritten.**

  - Step 1: Designed? We don't know (author left unwritten). Assume we have no record. → Step 2.
  - Step 2: Evolutionary history known? No (intentionally unwritten). → Step 3 without history.
  - Step 3: Current contribution? We must infer: bioluminescence typically serves functions like communication, mating, or predator avoidance. If we observe it being used, say, for attracting mates, then current function: mating display. If we don't specify, we must choose one based on narrative. But let's say we observe it used in mating.
  - Step 4: Not applicable (no history). Assign current function: mating display (or whatever we choose).
  - **Record**: "Function: mating display (via bioluminescence)."

  **Expected Dislike**:
  I expect you might dislike the answer for (1) because the narrative might want to emphasize the historical function (the burrowing origin) as a key point, but the procedure assigns the current function (display) as primary. However, the note about exaptation should capture the history. The procedure prioritizes current maintenance, but the historical note is kept for continuity.

  **Final Notes**:
  - The procedure runs in about 15 minutes because it asks 3-4 key questions and requires only general knowledge to answer.
  - The output is a one- or two-line entry that includes the primary function and a note on origin if it differs.
  - The continuity editor files the entry, and the consultant can check if the current contribution is biologically plausible.
answer: |-
  **Bottom line: Assign the trait's current maintenance-driving contribution as its primary function unless unambiguous historical design or selection data overrides it, defaulting to current contribution when history is unknown or irrelevant.**

  ### Decision Procedure  
  *Execute steps in order; stop and record when reaching a terminal step (marked ✓). Use "unknown" for unavailable history. Time: ≤15 mins per trait.*

  1. **Was the trait designed by an intelligent agent?**  
     - *Check*: Explicit records (e.g., terraformer logs) or narrative intent confirming artificial installation.  
     - *Sufficient answer*: "Yes" (with known purpose), "Yes (purpose unknown)", or "No".  
     - *Branch*:  
       - **Yes, purpose known**: Record original design function. Proceed to Step 3.  
       - **Yes, purpose unknown**: Treat as "history unknown". Proceed to Step 3.  
       - **No**: Proceed to Step 2.  

  2. **Is the trait’s evolutionary history (selection pressure) documented?**  
     - *Check*: Fossil records, genetic data, or established lineage in your bible showing what the trait was selected for. Ignore undocumented speculation.  
     - *Sufficient answer*: "Known" (state function), "Re-engineered" (post-design selection), or "Unknown".  
     - *Branch*:  
       - **Known**: Record historical function. Proceed to Step 3.  
       - **Re-engineered**: If design records exist, use Step 1 output; else, treat as "history unknown". Proceed to Step 3.  
       - **Unknown**: Proceed to Step 3.  

  3. **What is the trait’s current contribution to organismal fitness?**  
     - *Check*: Observed or inferred role in survival/reproduction (e.g., "enables mating", "aids digestion"). Must be a causal effect, not correlation.  
     - *Sufficient answer*: State the contribution (e.g., "courtship signaling") or "None" if vestigial/non-functional.  
     - *Terminal if none*: ✓ **Record "No current function"** if no contribution. Stop.  
     - *Branch*: **Contribution identified**: Proceed to Step 4.  

  4. **Resolve conflict: Does history contradict current contribution?**  
     - *Check*: Compare outputs from Steps 1/2 (history) and Step 3 (current).  
     - *Branch*:  
       - **No conflict (or history absent/unclear)**: ✓ **Record current contribution as primary function**. Stop.  
       - **Conflict exists**: ✓ **Record current contribution as primary function**, noting historical origin (e.g., "exapted from X"). Stop.  
       - **Ambiguous/narrative-dependent**: Hand back to you. *Criteria*: Multiple equally viable current contributions (e.g., "display" vs. "predator deterrence") with no fitness data.  

  **Handback Points**  
  - Step 4 if conflict requires narrative emphasis (e.g., spotlighting history for thematic reasons).  
  - Step 3 if current contribution is ambiguous; you choose based on story needs.  

  **Dropped Distinctions**  
  - "Containing system" complexity: Focus on fitness contribution only.  
  - Exact selection mechanisms: Ignore drift, spandrels, or multi-level selection.  
  - Designer intent nuances: If purpose unknown, treat as evolutionary.  

  **Retained Distinctions**  
  - History vs. current: Critical for exaptation cases.  
  - Fitness contribution: Necessary to avoid teleology.  

  ### Worked Examples  

  **(1) Hollow cranial crest from burrowing ancestor, now used in courtship**  
  - Step 1: Not designed → Step 2.  
  - Step 2: History known (burrowing) → Record history: "structural support for digging". Proceed to Step 3.  
  - Step 3: Current contribution: "courtship display". Proceed to Step 4.  
  - Step 4: Conflict (burrowing ≠ display) → ✓ **Record: "Courtship display (exapted from ancestral burrowing support)"**.  

  **(2) Implanted filtration organ for toxin removal, now drives circulation ("second heart")**  
  - Step 1: Designed (purpose known: toxin removal) → Record design: "toxin filtration". Proceed to Step 2.  
  - Step 2: Re-engineered → History is design function (Step 1). Proceed to Step 3.  
  - Step 3: Current contribution: "circulation pump". Proceed to Step 4.  
  - Step 4: Conflict (filtration ≠ pump) → ✓ **Record: "Circulation pump (re-purposed from designed toxin filtration)"**.  

  **(3) Bioluminescent frill with unwritten lineage record**  
  - Step 1: No design records → Step 2.  
  - Step 2: History unknown → Proceed to Step 3.  
  - Step 3: Current contribution: Assume observation (e.g., used in mating). → "Mate attraction". Proceed to Step 4.  
  - Step 4: No history to conflict → ✓ **Record: "Mate attraction via bioluminescence"**.  

  ### Expected Dislike and Why  
  You will likely dislike **Example 2's output** because it labels the organ as a "pump" despite characters calling it a "second heart," and subordinates the design history to a note. The procedure prioritizes current fitness contribution (circulation) over original intent (filtration), but your narrative emphasizes the engineered origin as foundational. The simplification drops "designer authority" when current use dominates, clashing with your theme of terraforming legacy.
