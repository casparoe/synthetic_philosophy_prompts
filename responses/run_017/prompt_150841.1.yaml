prompt: |-
  I'm a science-and-ideas journalist working on a feature about the replication crisis, and I keep tripping over a line that functions in this debate as a conversation-stopper. In a recent interview, the author of a much-publicised small-sample study — the familiar shape: an implausible mechanism, a large headline, and a later preregistered multi-lab replication that came back close to zero — used it symmetrically. "Extraordinary claims require extraordinary evidence. But the claim that my effect doesn't exist is itself extraordinary, so that replication had better be extraordinary too, and one null result isn't."

  I don't think that move works, but I can't yet say precisely where it fails, and I'd like to print something more careful than "the line is vague." So please treat the slogan the way you'd treat an argument that has to carry weight: separate the precise theses it could be expressing, and give verdicts.

  Two words are doing all the work and neither is marked. "Extraordinary" might mean low prior probability given well-confirmed background theory; low prior probability given what the field currently believes (an orthodoxy-relative rather than evidence-relative notion); threatening to a lot of auxiliary commitments at once; merely unfamiliar or newsworthy; or simply consequential if acted on. "Require" might mean: a more stringent statistical threshold before the claim counts as supported; more evidence of the same kind (bigger samples, more studies); evidence of a different kind (mechanistic, independently measured, preregistered, open); a shifted burden of proof in a dialectical or editorial sense; or a heavier penalty for being wrong, i.e. an asymmetric loss function.

  Lay the resulting combinations out as a menu rather than defending one. For each: what it actually says, whether it is a platitude, a substantive and defensible methodological norm, or false, and — the part I most need — whether it would license the use my interviewee made of it. In particular I want to know: whether any reading makes the principle genuinely symmetric as between a surprising positive result and a surprising failure to reproduce one; whether the Bayesian-looking reading is even coherent as stated, or whether a fixed evidential standard plus a low prior already does the work the slogan misdescribes; and whether, inside a strict error-rate framework, the slogan is inexpressible, collapses into a uniform recommendation about thresholds, or survives as something like a claim about a literature's false-discovery budget rather than about any single hypothesis.

  My own provisional taxonomy is prior-relative, loss-relative and dialectical readings, plus that last "field-level error budget" one as a fourth. Tell me if the fourth is a real reading and if the taxonomy misses any. Please keep the general Bayesian-versus-frequentist quarrel in the background, except where it bears on which readings are available at all. If nothing in the menu survives, give me the one-sentence version I could responsibly print instead.
reasoning: |-
  Hmm, the user is a science journalist grappling with the "extraordinary claims require extraordinary evidence" slogan in the context of the replication crisis. They've encountered a researcher using this principle symmetrically to defend a failed replication of their own study. The journalist needs to dissect this slogan rigorously to expose where the researcher's argument fails.

  The user wants me to analyze the slogan through multiple lenses. They've identified two key ambiguous terms: "extraordinary" (which could mean low prior probability, orthodoxy-challenging, etc.) and "require" (which could imply stricter statistical thresholds, different evidence types, etc.). They're asking for a taxonomy of possible interpretations, each evaluated on whether it's a platitude/defensible/false, and crucially whether it licenses the symmetrical use by the researcher.

  I should consider the user's own provisional taxonomy: prior-relative, loss-relative, dialectical, and field-level error budget readings. But let me see if I can expand this systematically.

  For "extraordinary," I'll consider:
  - Prior probability relative to background knowledge
  - Degree of challenge to current paradigms
  - Sociological newsworthiness
  - Practical consequences if true

  For "require," I'll consider:
  - Stricter statistical thresholds (lower alpha)
  - Larger evidence base (more samples/studies)
  - Different evidence types (mechanistic, preregistered)
  - Dialectical burden of proof
  - Asymmetric loss functions

  The journalist's key concerns are:
  1) Whether any reading makes the principle symmetric between surprising positives and surprising negatives
  2) Whether the Bayesian reading is coherent or redundant
  3) How this functions in frequentist frameworks
  4) Whether the field-level error budget interpretation holds water

  I need to be meticulous about showing why the researcher's symmetrical argument fails in every interpretation. The Bayesian analysis will be particularly damning - low priors already demand strong evidence, but absence claims don't symmetrically require "extraordinary" evidence to disprove an extraordinary claim. The frequentist analysis won't fare better since replication studies typically have higher power.

  For the field-level error budget point: while it's true that extraordinary claims might warrant more replication resources, this doesn't mean a single null result is insufficient when properly powered. The researcher is conflating resource allocation with evidential standards.

  Ultimately, I should provide the journalist with a concise alternative phrasing they can use - something that exposes the asymmetry between claiming existence vs. non-existence.
answer: |-
  Below is a systematic breakdown of the "extraordinary claims require extraordinary evidence" (ECREE) principle, mapped against your requested taxonomy. Each combination evaluates: (1) what the reading *says*, (2) whether it's a **platitude** (P), **defensible norm** (D), or **false** (F), and (3) whether it **licenses the interviewee's symmetrical use** (✓ for yes, ✗ for no). The taxonomy prioritizes clarity on symmetry, Bayesian coherence, and frequentist expressibility.

  ---

  ### **Taxonomy of Readings**
  **I. PRIOR-RELATIVE (Epistemic)**  
  *"Extraordinary" = Low prior probability given well-established background theory.*  
  *Focus: Rational belief updating.*

  | "Require" Meaning          | What It Says                                                                 | P/D/F | Symmetry License? | Key Notes                                                                                                                                 |
  |----------------------------|-----------------------------------------------------------------------------|-------|-------------------|-------------------------------------------------------------------------------------------------------------------------------------------|
  | **Stricter statistical threshold** (e.g., lower α) | Claims with low priors need stronger evidence (smaller p-values) to reach the same posterior. | D     | ✗                 | **Bayesian incoherence**: Lowering α doesn't equate to stronger evidence; likelihood ratios and priors handle this. Low-prior claims *already* demand stronger evidence via Bayes. A null result only needs standard rigor. |
  | **Larger/more evidence** (more samples/studies) | Low-prior claims need larger N or multiple replications before acceptance.     | D     | ✗                 | **Asymmetry**: Failure to replicate a low-prior claim doesn't need "extraordinary" replication; a single high-powered null result suffices if background theory is strong. |
  | **Different evidence types** (mechanistic, multi-method) | Low-prior claims need converging evidence beyond stats (e.g., mechanism). | D     | ✗                 | **Not symmetric**: Absence claims (non-existence) rarely need mechanistic proof; well-controlled null evidence + theory suffices. |

  **II. LOSS-RELATIVE (Decision-Theoretic)**  
  *"Extraordinary" = High stakes if wrong (e.g., policy, resources, paradigm shifts).*  
  *Focus: Consequences of error.*

  | "Require" Meaning          | What It Says                                                                 | P/D/F | Symmetry License? | Key Notes                                                                                                                                 |
  |----------------------------|-----------------------------------------------------------------------------|-------|-------------------|-------------------------------------------------------------------------------------------------------------------------------------------|
  | **Asymmetric loss function** | False positives for high-stakes claims are costlier, so demand stronger evidence. | D     | ✗                 | **Symmetry failure**: False negatives for *existence* may be costly, but false positives for *non-existence* are rarely symmetrical. Replicating nullity usually has lower stakes. |
  | **Stricter threshold**     | Policy-impactful claims need p < .001, not .05.                              | D     | ✗                 | **Frequentist expressible**: Yes, via lowering α. But null results for existence claims don't symmetrically need stricter thresholds. |

  **III. DIALECTICAL (Sociological)**  
  *"Extraordinary" = Challenges orthodoxy or is "newsworthy".*  
  *Focus: Persuasion in a contested field.*

  | "Require" Meaning          | What It Says                                                                 | P/D/F | Symmetry License? | Key Notes                                                                                                                                 |
  |----------------------------|-----------------------------------------------------------------------------|-------|-------------------|-------------------------------------------------------------------------------------------------------------------------------------------|
  | **Shifted burden of proof** | Radical claims face higher skepticism; proponents must meet heavier evidentiary demands. | D     | ✓ (superficially) | **False symmetry**: The interviewee exploits this sociologically. But skepticism toward non-existence claims is weaker—null replications aren't "radical" absent contrarianism. |
  | **Editorial gatekeeping**  | Journals demand more/better evidence for "surprising" claims.               | D     | ✗                 | **Field-level issue**: Null replications aren't typically held to higher standards; they resolve controversy. |

  **IV. FIELD-LEVEL ERROR BUDGET (Meta-Scientific)**  
  *"Extraordinary" = Likely to be a false positive given publication bias/p-hacking.*  
  *Focus: Research ecology.*

  | "Require" Meaning          | What It Says                                                                 | P/D/F | Symmetry License? | Key Notes                                                                                                                                 |
  |----------------------------|-----------------------------------------------------------------------------|-------|-------------------|-------------------------------------------------------------------------------------------------------------------------------------------|
  | **More replication**       | Extraordinary claims consume more replication resources to combat noise.    | D     | ⚠️ (partially)    | **Real but misused**: Yes, surprising claims deserve more replications. But the interviewee confuses *resource allocation* with *evidential standard*. One high-powered null result *is* sufficient absent bias. |

  ---

  ### **Direct Answers to Your Queries**
  1. **Symmetry**: No reading licenses genuine symmetry. The interviewee’s move fails because:
     - **Bayesian**: Low priors *already* demand strong evidence for existence claims, but non-existence only needs standard evidence to update priors downward.
     - **Frequentist**: Type I/II error asymmetries don’t support symmetry. A replication’s power (>95%) is designed to detect the original effect; a null result is definitive if powered.
     - **Field-level**: Resource allocation ≠ evidentiary standard.

  2. **Bayesian coherence**: ECREE is redundant under Bayes. Low prior + fixed evidence → lower posterior. "Extraordinary evidence" misdescribes the need for high likelihood ratios, which depend on experimental design—not an independent "standard."

  3. **Frequentist expressibility**: 
     - In error-rate frameworks, ECREE *collapses into α adjustment* for existence claims (e.g., α = .005 for "extraordinary" claims). 
     - It *cannot apply to null results* without absurdity: demanding α = .0001 for replications would make falsification impossible.

  4. **Field-level error budget**: A defensible reading (your fourth type). Surprising claims warrant more replication investment due to higher false-discovery risk. But this doesn’t elevate the *evidential threshold* for a single replication—it justifies more attempts.

  ---

  ### **The One-Sentence Verdict for Print**
  > "The principle legitimately demands robust evidence for claims that defy established science, but it cannot be flipped to shield weak findings from rigorous replication, because disproving an improbable claim requires only standard evidence—not extraordinary proof of absence."

  ### **Why This Works**
  - **Precise**: Distinguishes between evidence for existence vs. non-existence.
  - **Unpacks asymmetry**: Rejecting H0 (non-existence) needs high power; accepting H0 needs only failure to reject under sufficient power.
  - **Field-level nuance**: Acknowledges resource allocation without equivocating on standards.
