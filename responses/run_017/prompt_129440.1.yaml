  #### Key to Leaves  
  Match your path’s endpoint to a leaf. Each leaf is defined by its core claim about rationality in the centipede game.  

  - **Proof-Is-Right View (Traditional: BI Purist):**  
    *Backward induction is the only rational path; any pass is a mistake.* You took at Node 1 in all variants. BI is normatively correct; data reflects human error.  
    - *Empirical note:* Fits students who take immediately (1/8 in our class data).  

  - **Tremble View (Traditional: Trembling Hand):**  
    *Passing can be rational if there’s a small chance the other player will pass against their interest (e.g., error or altruism).* You passed in base/high-stakes but took when announcements made irrationality unlikely, or took earlier in high-stakes.  
    - *Empirical note:* Fits payoff-scaled data (high-stakes moves taking earlier).  

  - **Counterfactual View (Traditional: Robustness Skeptic):**  
    *You can be fully convinced of the other’s rationality yet reject that this belief must survive your own hypothetical deviation.* You passed in base/pre-play/high-stakes but rejected BI’s counterfactual logic.  
    - *Empirical note:* Indistinguishable from belief-dependence without high-stakes test.  

  - **Belief-Dependence View (Traditional: Belief Revisionist):**  
    *Your action affects the other’s response; passing might induce reciprocity.* You passed in base but took in pre-play/high-stakes, believing announcements or stakes alter behavior.  
    - *Empirical note:* Indistinguishable from counterfactual view without high-stakes test.  

  - **Mis-Specification View (Traditional: Other-Regarding Preferences):**  
    *Players care about fairness, reciprocity, or avoiding "greed," not just money.* You passed throughout, considered counterfactual beliefs, but didn’t rely on BI logic.  
    - *Empirical note:* Fits median node-3 takers and those who pass after a pass.  

  - **Collective View (Traditional: Team Reasoning):**  
    *The unit of agency is the pair; you maximize joint payoffs.* You passed repeatedly (even at Node 5), ignoring individual incentives for collective gain.  
    - *Empirical note:* Fits students who pass after a pass and at Node 5.  

  - **Quietist View (Traditional: Predictive/Descriptive Divider):**  
    *What’s rational ≠ what people do; data can’t settle normative debates.* You took in base game but rejected BI’s normative force in variants or thought passes aren’t "mistakes."  
    - *Empirical note:* Fits no-action-data directly; unfalsifiable by our data.  

  - **Counterfactual Blindness View (Manuscript: Policy Realism):**  
    *Rationality only constrains actual choices; "what if I deviated?" is incoherent.* You passed but denied counterfactual belief revision has content.  
    - *Empirical note:* Fits students who pass yet insist BI is misapplied.  

  ---

  #### Logical Space & Premises  
  BI requires:  
  1. Both maximize own money.  
  2. Each believes the other does.  
  3. (1) and (2) are common knowledge.  
  4. Payoff structure is mutually known.  
  5. **Robustness:** Belief in the other’s rationality survives *your own* hypothetical deviation.  

  **You must reject at least one premise.** The flowchart shows which combinations are consistent:  
  - **No surrender?** Impossible. BI’s theorem (common knowledge + robustness → BI outcome) fails if robustness (5) is dropped, or if (1)–(4) are relaxed.  
  - **Your path** reveals what you surrendered.  

  ---

  #### Empirical Discriminations from Our Data (N=240)  
  - Median take at node 3: Distinguishes **proof-is-right** (node 1) from others.  
  - 70% pass after learning of a pass: Supports **tremble**, **collective**, **mis-specification**, **counterfactual views** over proof-is-right.  
  - High-stakes (×20 payoffs) moves taking earlier: Supports **tremble view** (stakes reduce risk tolerance), discriminates against **collective/mis-specification** (stakes shouldn’t shift if social preferences dominate).  
  - **Indistinguishable pairs:**  
    - *Counterfactual vs. Belief-Dependence:* Both pass in base/pre-play. High-stakes separates them (belief-dependence takes; counterfactual passes).  
    - *Quietist vs. Proof-Is-Right:* Quietist may take in base game. Follow-up: *"In pre-play, if you passed, was it a mistake?"* → Yes: proof-is-right; No: quietist.  
  - **Unfalsifiable:** Quietist view (denies data speaks to rationality).  

