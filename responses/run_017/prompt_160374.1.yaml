prompt: |-
  I am a retired geochemist, lately reading philosophy of science in a rather unsystematic way, and I would like to know whether a pattern I keep recalling from my own former field has a name.

  Two instances. For some thirty years a certain family of isotope ratios refused to fit the accepted model; they were written off as contamination, and one learned not to report them. When a new model appeared, not constructed with those ratios in mind, the same numbers were re-reduced with better corrections and put forward among the strongest reasons to accept it. Second: a morphology described and illustrated repeatedly in the older literature was treated as noise until a theory arrived that made it the expected signature, after which it was cited as striking confirmation.

  What interests me is that in neither case was the evidence simply known in advance and later accommodated. Before the theory it was recorded but discounted, or recorded in a vocabulary in which it was not yet the sort of thing one could predict; afterwards it was re-measured and re-described, promoted from artifact to datum, and it was the reconstituted item that confirmed. I gather that philosophers are suspicious of confirmation by evidence already in hand, on the ground that such evidence cannot raise a theory's probability. But that worry seems to picture the evidence as fully formed and already firmly believed, merely waiting to be explained. In my cases the change is partly in the evidence itself.

  Does this configuration have a name of its own? If it resembles an established concept, I should want to know exactly where the resemblance stops: how these cases differ from it, not only what they share with it. A bare label, or a reassurance that this is only the familiar difficulty about old evidence read at a slightly wider angle, would not tell me what I am after. If nothing established fits, please coin a term, define it, and set out the boundary cases that would decide whether a given instance belongs to it.
reasoning: |-
  Okay, let's tackle this fascinating question from the retired geochemist. They've observed a pattern in their field where certain data was initially dismissed as noise or contamination but later became key evidence for a new theory. The key point is that the evidence itself wasn't just sitting there waiting; it was reinterpreted and reconstituted in light of the new theory. 

  First, I need to recall relevant philosophy of science concepts. The old evidence problem comes to mind—where existing data supporting a new theory doesn't seem to genuinely confirm it. But here, the evidence wasn't just "old"; it was actively ignored or misclassified. That's different. 

  Then there's theory-laden observation—the idea that what we "see" depends on our theoretical framework. This fits somewhat because the same measurements were reinterpreted. But the geochemist emphasizes that the evidence was literally re-measured or re-described, not just seen differently. That's a physical change, not just perceptual. 

  Kuhnian paradigm shifts might also apply. During normal science, anomalies are suppressed until a revolution recasts them as central. But Kuhn focuses on broad sociological shifts, while the geochemist's cases are more specific. 

  Hmm, the core here seems to be the transformation of evidence status: from artifact (dismissed) to datum (valued). The mechanism involves both reinterpretation and physical re-measurement. Existing terms feel close but don't capture this duality. 

  Time to coin a term? "Epistemic recrystallization" jumps out—playing on geochemical processes where crystals reform under new conditions. It mirrors how evidence "resolidifies" under a new theoretical regime. But is this too cute? Let me check: it emphasizes the reversible nature of evidence status (like crystal phase changes) and the role of theoretical "temperature/pressure." 

  Boundary cases: If data is merely reinterpreted without new measurements (pure theory-ladenness), it's not quite this. If entirely new data is collected post-theory, that's ordinary confirmation. The sweet spot is neglected evidence being physically re-examined due to new theory. 

  Finally, should I mention why standard philosophy struggles here? Yes—they often assume evidence is static, but real science involves constant reworking of data. The geochemist's insight exposes that flaw beautifully.
answer: |-
  Your observations capture a profound and under-discussed phenomenon in the philosophy of science. While elements of this pattern intersect with established concepts, **no single term fully encapsulates the dynamic you describe—where *neglected* evidence is *reconstituted* (both conceptually and empirically) to become decisive confirmation for a new theory**. Below, I define this phenomenon, differentiate it from related concepts, and propose a precise term for it.

  ---

  ### **Core Phenomenon: Epistemic Recrystallization**
  **Proposed Term:** ***Evidence Recrystallization***  
  *Definition*: The process by which previously recorded but epistemically discounted empirical content (e.g., measurements, observations) is physically re-analyzed, re-described, and conceptually re-framed under a new theoretical lens, thereby transforming it from *artefact* (noise/contamination) into *salient datum* that actively confirms the new theory.

  #### **Key Distinctions from Established Concepts**:
  1.  **The Old Evidence Problem (Glymour, Clark, etc.)**:
      -   *Similarity*: Concerns evidence existing before a theory is formulated.
      -   *Divergence*: The old evidence problem assumes the evidence was *already accepted as valid* but unexplained. In your cases, the evidence was **not accepted as valid**—it was actively *excluded* from the corpus of scientific facts (e.g., "not reported," "treated as noise"). The transformation involves reinstatement + reinterpretation + re-measurement.

  2.  **Theory-Ladenness of Observation (Hanson, Kuhn)**:
      -   *Similarity*: Recognizes that theories shape what we "see" or value as data.
      -   *Divergence*: Theory-ladenness typically describes *perceptual/cognitive reinterpretation* of *existing* data (e.g., seeing a "swan-neck flask" as disproving spontaneous generation). Your cases involve **physical re-measurement/re-description** (e.g., "re-reduced with better corrections," "re-described morphology"). The evidence itself is empirically reconstituted.

  3.  **Kuhnian Anomalies and Paradigm Shifts**:
      -   *Similarity*: Anomalies are suppressed until a new paradigm recasts them as central.
      -   *Divergence*: Kuhn emphasizes sociological inertia suppressing anomalies. Your cases highlight **epistemic re-engineering**: the evidence isn't merely "seen differently"; it is *operationally upgraded* via new techniques/vocabularies tied to the new theory (e.g., applying "better corrections" only possible post-hoc).

  4.  **Prediction vs. Accommodation (Popper, Lakatos)**:
      -   *Similarity*: Predictions (novel facts) are stronger confirmations than accommodations (explaining known facts).
      -   *Divergence*: Your cases blur this dichotomy. The evidence was "known" but **not epistemically credentialed**—it wasn't a "fact" to be accommodated. Only after recrystallization does it become a "novel" entity relative to the old theory.

  ---

  ### **Boundary Cases: Is it *Recrystallization*?**
  A case qualifies as **Evidence Recrystallization** if it meets *all three* criteria:
  1.  **Prior Suppression**: The empirical content was recorded but systematically excluded from scientific consideration (e.g., deemed artefactual, omitted from reports).
  2.  **Operational Reconfiguration**: The evidence was re-analyzed, re-measured, or re-described using *new methods/vocabularies* enabled by the new theory.
  3.  **Confirmatory Role**: The reconstituted evidence became a *primary justification* for accepting the new theory.

  *Exclusion Criteria*:
  - **Pure Reinterpretation**: Data is recontextualized without new measurements (e.g., reinterpreting fossil sequences without new digs). → *Theory-ladenness*.
  - **New Data Post-Theory**: Evidence collected *after* the theory’s proposal. → *Novel prediction*.
  - **Previously Accepted Anomaly**: Evidence was recognized as valid but puzzling under the old model (e.g., Mercury’s orbit). → *Old evidence problem*.

  ---

  ### **Why This Phenomenon Matters**
  Your examples reveal a gap in philosophical models of confirmation:
  - **Static Evidence Fallacy**: Many accounts treat evidence as fixed, ignoring how theories *alter the empirical landscape* by rehabilitating once-excluded content.
  - **Material Agency of Theories**: New theories don’t just "explain"; they enable *new ways of materially interacting* with the world (e.g., new corrections, taxonomies), retroactively upgrading past observations.

  ---

  ### **Conclusion**
  **Evidence Recrystallization** names the process you identified: the *epistemic alchemy* by which neglected artefacts are empirically and conceptually transformed into decisive data under a new theoretical regime. It differs from the old evidence problem by requiring **prior suppression + operational reconstitution**, and from theory-ladenness by emphasizing **physical re-measurement/re-description**.

  This concept should interest philosophers studying:
  - **Robustness** (how multiple measurement techniques converge post-reconstitution),
  - **Experimental Regress** (how theories resolve ambiguities in data reduction),
  - **Fringe Science** (how communities police the boundary between data and noise).

  If you encounter further cases in geochemistry or philosophy, I would be keen to discuss whether this definition holds—or if refinements are needed.
