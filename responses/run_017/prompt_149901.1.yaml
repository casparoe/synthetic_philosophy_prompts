prompt: |-
  For the past eighteen months I have been reading my way into the predictive processing and active inference literature, in preparation for a short piece I am drafting for a reading group I convene here in retirement. My own training was in experimental physical chemistry, and I find that I read these papers the way I once read papers reporting a fit to a kinetic model: I look for how many quantities the data actually pin down, and how many were free to move. I have noticed a recurring pattern in how findings get accommodated, and I would like to know whether it has a name, or whether I am running together several different things that the literature keeps apart.

  The pattern, described without the vocabulary that I suspect would settle the question: a finding arrives, and it is accommodated by adjusting the strength of what the system expects against the weight given to what the senses deliver. When the adjustment in one direction looks strained — the expectation would have to be implausibly rigid, or the incoming signal implausibly faint — the very same finding is re-accommodated by shifting the weight to the other term. This seems possible because only some combination of the two shows up in the observable behaviour, so a change in one can always be compensated by a change in the other. And the choice is made after the fact, without a measurement that fixes either term on its own.

  Two cases that set me off. The first is the disagreement I have encountered over certain perceptual differences in autistic subjects: one account explains them by saying that the expectations are unusually weak, so experience is dominated by the data, while another explains them by saying that the expectations are intact and the incoming signal carries unusually high weight. These strike me as mirror images, and I cannot see what observation would decide between them. The second is the fate of the midbrain dopaminergic response to unexpected reward: within this framework I have seen it read as the magnitude of an error signal, and elsewhere as something like the confidence or expected reliability attaching to that error signal. Whichever reading is adopted seems to depend on which anomaly is currently being absorbed. It is possible I have misrepresented both debates; if so, say so.

  My own instinct is to describe this as a redundancy of description rather than a dispute between theories: the two accounts are not rivals so much as the same formal description with the explanatory load slid along a free direction, and the sliding is what lets the framework accommodate a result it did not predict. In my old field we would have called the analogous thing a choice of gauge, and we would not have treated the choice as a discovery. There is also, I believe, a literature in systems biology about models whose parameters are barely constrained by the data they are fitted to, which looks like the same complaint in different clothes.

  So my question: is there an established concept for exactly this, and if the nearest concepts only partly fit, what does my description differ from in each case, and which fits best? I am less interested in a label than in the carving — what the phenomenon is, what it is not, and where its edges lie. In particular I would like to know what would distinguish a legitimate use of this kind of adjustment from a degenerate one; whether the reply that the framework states a principle rather than a model, with the substantive content supplied elsewhere, actually answers the worry or changes the subject; and where my gauge analogy holds and where it breaks. I should add that I have no library access from here, so please argue the point rather than direct me to sources.

  Please return your answer as a single JSON object with these fields:

  - "label": the established term if there is one; if not, a coined term marked as coined.
  - "status": one of "established", "established_but_narrower", "no_established_term".
  - "definition": one or two sentences stating precisely what the phenomenon is.
  - "factual_check": whether either of my two instances is as I described it, and any correction needed.
  - "my_instances": an array of two objects, each with "instance", "verdict" (one of "core_case", "peripheral", "not_an_instance"), and "reason".
  - "nearest_concepts": an array of at least four objects, each with "concept", "overlap", "decisive_difference", and "fits_my_description" (one of "yes", "partly", "no").
  - "gauge_analogy": an object with "verdict", "where_it_holds", "where_it_breaks".
  - "diagnostic": the test or procedure that would separate a legitimate instance from a degenerate one.
  - "boundary_cases": an array of three objects, each with "case", "in_or_out", and "why".
  - "principle_not_model_reply": whether that reply meets the worry, and why.
  - "confidence": a number between 0 and 1.
reasoning: |-
  Hmm, the user is describing a recurring pattern they've noticed in predictive processing and active inference literature. They come from a physical chemistry background and are reading these papers like kinetic models, focusing on how many parameters are actually constrained by data versus being free to move.

  The pattern they observe is that when new findings come in, researchers adjust either the strength of priors (expectations) or the weight given to sensory input (precision) to accommodate the data. Crucially, since only some combination of these appears in observable behavior, the adjustments can always be compensated. They give two examples: differing explanations for autistic perception differences (weak priors vs high sensory weight), and conflicting interpretations of dopaminergic responses (error magnitude vs confidence in error).

  They're asking if this has a name, and want to understand where legitimate flexibility ends and degeneracy begins. Their gauge analogy from physics is insightful - it reminds me of coordinate choices in gauge theories where different choices describe the same physical reality.

  Let me think about relevant concepts:

  Parameter degeneracy fits well - this is when multiple parameter combinations yield identical model predictions. In predictive processing, the prior strength and sensory precision often form such a degenerate pair. 

  The underdetermination of theory by data is a broader philosophical concept, but captures the core idea that observations don't uniquely determine theoretical explanations.

  Identifiability problems in statistics directly address when parameters can't be uniquely estimated from data - exactly what they're describing.

  Overparameterization occurs when models have more parameters than needed to fit the data, creating flexibility but also ambiguity.

  For their specific examples:
  - The autism debate does indeed show this degeneracy - both weak priors and high sensory precision can explain perception differences. There might be ways to break this degeneracy with additional experiments.
  - The dopamine interpretation is more complex. While some accounts treat it as pure prediction error, others as precision/confidence, the literature has moved toward multi-faceted interpretations. Still, it illustrates how flexible interpretations can arise from parameter degeneracy.

  Their gauge analogy holds remarkably well in terms of descriptive equivalence, but breaks when considering that in physics gauges are conventional while here the parameters may have distinct biological implementations.

  To distinguish legitimate from degenerate uses:
  - Legitimate cases would involve constrained parameters through multiple measurement types
  - Degenerate cases occur when parameters can't be disentangled with available data

  The "principle not model" reply doesn't fully address the worry - even principles need testable consequences.

  I'll craft a JSON response addressing all their points, emphasizing parameter degeneracy as the core concept while showing how other ideas relate. For their examples, I'll confirm the autism case as core while noting the dopamine case is more complex. The diagnostic test should involve seeking additional constraints through experiments or model comparisons. Boundary cases will help clarify where this phenomenon applies.
