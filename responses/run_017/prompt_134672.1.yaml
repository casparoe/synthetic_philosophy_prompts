  **Commonwealth Board of Aesthetic Arbitration (CBAA)**  
  **Licensing Handbook for Certified True Judges (CTJ)**  
  *Revision 8.3 (Draft), Annex C: Examination & Certification Procedures*  

  **Section 1: Purpose & Authority**  
  1.1 Pursuant to the *Aesthetic Standards Act*, the CBAA is empowered to certify individuals as True Judges qualified to render definitive verdicts on matters of beauty and artistic merit.  
  1.2 Certification signifies the holder possesses the Five Essential Marks (Strong Good Sense, Delicacy of Sentiment, Practice, Comparison, Freedom from Prejudice) to a degree satisfying the Board’s established criteria.  
  1.3 Authority to set examinations and grant certification rests solely with currently Certified True Judges appointed as CBAA Examiners.  

  **Section 2: Examination Structure**  
  2.1 The CTJ Qualifying Examination comprises five modules, each assessing one Essential Mark.  
  2.1.1 Module 1 (Strong Good Sense): Candidates analyze logical fallacies within flawed aesthetic arguments presented via anonymized transcripts (See Sec. 5.4).  
  2.1.2 Module 2 (Delicacy of Sentiment): Candidates identify and describe subtle aesthetic qualities within presented works. Responses must include at least two (2) distinct, non-obvious sentiments not listed in the examiner’s rubric key (Form 27B/6).  
  2.1.3 Module 3 (Practice): Candidates submit documented evidence of no fewer than 10,000 hours of deliberate aesthetic contemplation across at least three (3) discrete art forms. Hours logged prior to application are subject to retrospective verification by CBAA Assessors.  
  2.1.4 Module 4 (Comparison): Candidates demonstrate cross-temporal and cross-cultural competence by comparing anonymized works (See Sec. 5.4) from differing periods and traditions, justifying comparative judgments using only internal formal properties.  
  2.1.5 Module 5 (Freedom from Prejudice): Candidates undergo psychometric evaluation assessing implicit biases related to authorship, genre, period, and nationality. Scores must fall within the 98th percentile for neutrality.  

  **Section 3: Grandfathering & Equivalency**  
  3.1 Current CBAA Examiners holding office prior to 01/01/[Current Year - 5] are deemed to possess the Five Marks *ipso facto* and are exempt from examination requirements. (See *Founding Examiner Charter, Art. 1*).  
  3.2 Practitioners with twenty (20) or more years of documented public arbitration in recognized aesthetic disputes may apply for Certification via the Experienced Practitioner Route (EPR).  
  3.2.1 EPR Applicants must submit five (5) past arbitration decisions for review by a panel of three (3) Grandfathered Examiners. Decisions must demonstrate consistent alignment with the Five Marks, as determined by the reviewing panel.  

  **Section 4: Conflicts Between Essential Marks**  
  4.1 The requirement for anonymized presentation of works in Modules 1, 2, 4, and 5 (to ensure Freedom from Prejudice) inherently precludes candidates from accessing information regarding the period, cultural origin, or authorial context of said works.  
  4.2 Notwithstanding Section 4.1, Module 4 (Comparison) requires candidates to demonstrate competence across periods and traditions.  
  4.3 Resolution: Candidates shall treat all works as existing within a hypothetical, context-neutral aesthetic continuum. Failure to perform adequate comparison within this construct indicates deficient imaginative capacity, not a flaw in the examination structure.  

  **Section 5: Sentiment Validation & Override Protocol**  
  5.1 Candidate reports of felt sentiment during Module 2 (Delicacy of Sentiment) are recorded via Form 27B/6 (“Subjective Affective Response Ledger”).  
  5.2 Sentiments reported on Form 27B/6 are assessed against the Examiner’s Master Rubric of Valid Sentiments (MRVS) for the presented work.  
  5.3 Sentiments not pre-listed on the MRVS, or deemed insufficiently “distinct” or “non-obvious” by the examining CTJ, are invalidated.  
  5.4 Candidates reporting strong personal pleasure or displeasure towards a work, where said sentiment conflicts with the MRVS or fails alignment with demonstrable formal properties as determined by the examiner, shall be deemed to exhibit “Unregulated Subjectivity.”  
  5.5 Remediation: Candidates scoring below 85% on Module 2 due to Unregulated Subjectivity (5.4) or insufficient distinct sentiments (2.1.2) must complete 500 hours of supervised, rubric-guided sentiment calibration before re-sitting the module.  

  **Section 6: Qualification Paradox & Provisional Status**  
  6.1 Attainment of Module 3 (Practice) requires 10,000 documented hours. Attainment of Module 4 (Comparison) requires exposure to a breadth of works typically only accrued *during* the 10,000 hours required for Module 3.  
  6.2 Resolution: Hours accrued *during* preparatory study for the CTJ Examination, including practice comparisons conducted under CBAA-approved mentorship programs, may be counted towards Module 3 requirements, provided said hours meet deliberate contemplation standards (See *Handbook Annex D: Contemplation Log Specifications*).  
  6.3 Candidates who have passed Modules 1, 2, and 5, and have accrued at least 7,500 verified hours towards Module 3, may apply for Provisional CTJ Status.  
  6.3.1 Provisional CTJs may render binding aesthetic arbitrations only under the direct supervision of a fully Certified CTJ Examiner.  
  6.3.2 Supervision hours accrued may be applied towards the remaining Module 3 and Module 4 requirements. Full certification requires successful completion of all five modules.  

  **Section 7: Certification Renewal**  
  7.1 CTJ Certification is valid for ten (10) years.  
  7.2 Renewal requires documented evidence of ongoing compliance with the Five Marks, including 2,000 hours of additional practice and successful completion of a biennial Prejudice Re-Screening (Module 5 equivalent).  
  7.3 Failure to renew lapses certification. Lapsed CTJs must re-enter via the standard examination route. Grandfathered Examiners (Sec. 3.1) are exempt from renewal requirements.  

