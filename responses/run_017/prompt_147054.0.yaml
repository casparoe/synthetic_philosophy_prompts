answer: |-
  ## Adversarial Collaboration: Expected Value in Low-Probability, High-Impact Scenarios

  **Authors:** [Software Engineer] & [EA/Rationalist Friend]

  ### 1. Agreed Claims
  We jointly accept the following foundational points:

  1.  **Expected Value (EV) Validity:** Maximizing expected value is a sound and rational decision principle when probabilities and utilities are well-founded and sufficiently anchored in evidence or validated models.
  2.  **Anchored Cases:** Actions based on probabilities derived from robust sources (e.g., fault trees with empirically observed component failure rates, high-quality actuarial data, well-understood physical models with strong empirical confirmation) can and should be evaluated using EV, even for low-probability events if the evidence supports it.
  3.  **Pascal's Mugging Rejection (As Stated):** The classic "Pascal's Mugging" scenario (e.g., a stranger claims a 1-in-10^18 chance of saving 10^20 lives for $5) is not compelling. Neither of us believes such an unanchored proposition should drive action, regardless of the nominal EV calculation.
  4.  **Core Question:** The fundamental disagreement is not about whether EV is *ever* valid or whether we should *always* act on astronomical EVs. The dispute centers on **how to distinguish probabilities that are sufficiently "anchored" to justify EV maximization from those that are too "unanchored" or "noisy" to be used in this way, particularly at very small magnitudes.**
  5.  **Evidence is Finite:** All probability estimates are based on finite evidence and are subject to uncertainty.

  ### 2. Disagreements Table

  | Aspect                      | Engineer's Position ("Resolution Floor")                                                                                                 | EA Friend's Position ("Strict EV Maximization")                                                                                                 |
  | :-------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Core Principle**          | Probability estimates derived from finite evidence have a practical **resolution floor** (roughly 1 / Effective Evidence Size). Expected Value calculations using probabilities significantly below this floor are dominated by noise, not meaningful signal, and should not drive action. | Decision-making **must strictly maximize expected value** whenever probabilities and utilities can be numerically specified. Any deviation introduces arbitrariness and risks ignoring genuinely catastrophic tail risks. |
  | **Nature of Small Probabilities** | Probabilities far below the resolution floor are epistemically unsupported noise. Treating them as precise numbers for EV calculation is an error; the resulting "EV" is misleading. | All probabilities, however small, are numerical inputs. Their smallness is already accounted for in the EV product (`p * U`). Discounting them further based on size violates dominance axioms and constitutes double-counting risk. |
  | **Handling Unanchored Risks** | Resources should not be allocated based on nominal EV calculations using unanchored, below-floor probabilities (e.g., Pascal's Mugging, highly speculative x-risk estimates without robust models). Prioritization requires probabilities above the floor or alternative heuristics. | Refusing to act on a positive nominal EV, however small `p` is, solely because `p` is small, is irrational "scope neglect." Principled avoidance of such actions either collapses back into EV maximization or forces one to ignore *anchored* low-p risks. |
  | **Source of Constraint**    | The limitation is fundamentally **epistemic**: Our ability to *know* or *reliably estimate* extremely small probabilities is bounded by available evidence. It's not about the utility function. | The proposed constraint acts as **de facto risk aversion** (or utility concavity) applied specifically to saving large numbers of lives via low-probability interventions, which violates linearity in utility aggregation. |
  | **Arbitrariness Charge**    | The resolution floor is not arbitrary; it scales with the **strength and structure of the evidence** supporting the probability estimate (e.g., direct observation, model validation, confidence intervals). | Setting *any* probability threshold below which EV is ignored is inherently arbitrary. Why *this* floor? Why not slightly higher/lower? This arbitrariness undermines the principle. |

  ### 3. Cruxes & Testing Cases

  **Crux 1: Is the dispute fundamentally about the *size* of the probability or the *trustworthiness* of its source?**
  *   **Engineer's Claim:** The dispute is primarily about source trustworthiness/epistemic anchoring. Small size is a *symptom* of being unanchored, but trustworthiness is the core issue.
  *   **Friend's Claim:** The dispute is fundamentally about whether very small probabilities, *even if well-sourced*, should be discounted in EV calculations.
  *   **Test Case: The Gamma Ray Burst (GRB) Scenario**
      *   **Setup:** A new, highly credible astrophysics model, rigorously validated against decades of observational data and confirmed by multiple independent teams, predicts a specific type of gamma-ray burst originating within 1000 light-years has a probability of `1 / 10^9` per year of causing a global mass extinction. Preventing it requires a $100M satellite network. Nominal EV is immense ($100M cost vs. ~8B lives * 1/10^9 p.a. = 8 lives/year EV saved).
      *   **Engineer's Prediction:** Friend will *favor* the satellite network. The probability is small but anchored in a highly credible, validated model, demonstrating the dispute is about trustworthiness, not size.
      *   **Friend's Prediction:** Engineer will *reject* the satellite network due to the small probability (`1/10^9`), demonstrating the dispute is about size.
      *   **Outcome & Concession:**
          *   If Friend favors the action, Engineer argues this supports their claim (trustworthiness matters most). Friend must concede size alone isn't the core issue *if* they accept the action.
          *   If Engineer rejects the action, Friend argues this supports their claim (size is the barrier). Engineer must concede their position discounts small p *even when anchored*.

  **Crux 2: Is the "Resolution Floor" position secretly concavity in the utility of lives saved?**
  *   **Engineer's Claim:** No. The constraint is purely epistemic. It applies equally to saving 1 life with a noisy `p=10^-9` or saving `10^9` lives with a noisy `p=10^-9`. The issue is the noisiness of `p`, not the aggregation of utility.
  *   **Friend's Claim:** Yes. Applying a floor only becomes practically relevant when utilities are large (many lives). The effect is identical to having concave utility for large-scale life-saving, treating saving N lives as less than N times the value of saving one life when N is very large *and* p is very small.
  *   **Test Case: The Concavity Test**
      *   **Setup A (Large Impact, Noisy p):** A psychic offers a guaranteed, single-use device. They claim it has a `1 / 10^12` chance (based on "cosmic resonance" - wholly unanchored) of saving 1 billion lives instantly. Activating it costs $1. Nominal EV: (1e9 lives * 1e-12) = 0.001 lives ~ $500 (assuming $50k/life). Cost: $1.
      *   **Setup B (Small Impact, Same Noisy p):** The *same* psychic offers a different guaranteed, single-use device. They claim it has a `1 / 10^12` chance (same unanchored source) of saving exactly 1 life. Activating it costs $0.000001 (0.1 cents). Nominal EV: (1 life * 1e-12) = 1e-12 lives ~ $0.00005. Cost: $0.000001.
      *   **Question:** Should you activate Device A? Should you activate Device B?
  *   **Engineer's Prediction:** Reject both actions. The probability (`1/10^12`) is far below any plausible resolution floor for the evidence (psychic's claim). The EV is noise, regardless of the number of lives at stake (1 or 1e9). This demonstrates the constraint is on `p`, not `U`.
  *   **Friend's Prediction:** Engineer will reject Device A (large impact) but accept Device B (small impact) because the cost is trivial relative to *their potential personal loss aversion* or because the decision cost outweighs the trivial cost for B. If Engineer rejects both, Friend may argue it's practically equivalent to concavity for large N since only large N makes the noisy EV potentially significant. *Friend's Own Stance:* Accept both actions due to positive nominal EV.
  *   **Outcome & Concession:**
      *   If Engineer consistently rejects both actions due to noisy `p`, Friend must concede the position is applied symmetrically and not *inherently* about utility concavity for lives.
      *   If Engineer accepts B but rejects A, Engineer must concede Friend has identified a relevant asymmetry (e.g., decision cost, personal risk aversion) that mimics concavity for large N.

  **Crux 3: Does "should" differ for Action, Spending, and Deliberation?**
  *   **Engineer's Claim:** Yes. "Should take action" assumes reliable inputs. "Should spend money" considers opportunity cost and robustness. "Should spend deliberation" is about efficient use of scarce cognitive resources. "Fanaticism" conflates them. You "should" deliberate on potential long-shots to *find* anchors, but not *act* without them. You "should" spend money on robustly anchored low-p/high-impact interventions, but not unanchored ones.
  *   **Friend's Claim:** No. If an action has higher expected value than alternatives (accounting for all costs, including deliberation costs), you "should" take it. Deliberation is just another action with costs and benefits assessed by EV. Separating them introduces inconsistency and avoids the core challenge.
  *   **Test Case: The Deliberation vs. Action Dilemma**
      *   **Setup:** A reputable but fringe scientist emails you proposing a novel mechanism for a 10% chance of a `1 / 10^15` per year risk of near-term human extinction. They claim a $100k, 1-week investigation by your team could either: A) Confirm the mechanism and refine `p` to `~1 / 10^7` (anchored) or B) Debunk it (`p ~ 0`). The status quo p is considered `< 10^{-12}` by mainstream science (anchored low). Investigating has a cost (money, team time). *Not* investigating means acting on the current anchored `p < 10^{-12}`.
  *   **Engineer's Prediction:** Friend will say you "should" investigate *only* if the nominal EV of investigating (considering the cost and the probabilities/utilities of outcomes A & B) exceeds the EV of alternatives (like doing nothing). Friend sees deliberation as purely an EV-calculated action.
  *   **Friend's Prediction:** Engineer will say you "should" *consider* deliberating/investigating because the *potential* impact is large (mitigation if `p` is high), but that you absolutely should *not act* on the initial unanchored `10% * 10^{-15} = 10^{-16}` estimate. Engineer sees "should deliberate" and "should act" as distinct judgments.
  *   **Outcome & Concession:** If Friend insists deliberation is evaluated purely by EV over actions/outcomes, they demonstrate their view that "should" is unitary (max EV action). If Engineer insists deliberation about potential anchors is governed by different heuristics than acting on anchored probabilities, they demonstrate their distinction. Concession is primarily about recognizing the differing frameworks rather than one being proven "wrong." It highlights if "fanaticism" applies uniformly.

  **Crux 4: Can a stopping rule avoid both fanaticism and ignoring anchored long shots?**
  *   **Engineer's Claim:** Yes. A rule based on **epistemic resolution** ("Only act on probabilities above a floor defined by the evidence strength/model validation") avoids fanaticism (ignores unanchored noise) while *allowing* action on anchored low-p risks (e.g., the GRB case, 1-in-10k catastrophe).
  *   **Friend's Claim:** No. Any probability threshold is arbitrary. The engineer's rule *will* ignore some genuine, anchored risks simply because their probability falls below an arbitrary floor. True consistency requires acting on *any* positive nominal EV when probabilities/utilities are specified. Avoiding fanaticism forces you to ignore real risks.
  *   **Test Case: The Asteroid Collision**
      *   **Setup:** A new asteroid is discovered. Initial very rough estimates based on limited tracking data (a few days) suggest a probability of impact in 50 years anywhere between `10^{-20}` and `10^{-5}`, with a best nominal point estimate of `10^{-12}`. Refining the estimate to a much narrower range (e.g., `< 10^{-15}` or `> 10^{-9}`) requires a $50M observation mission. The nominal EV based on the point estimate justifies the mission. The current evidence is finite and unstructured (just initial positional data).
  *   **Engineer's Prediction:** Friend will argue you "should" fund the mission *now* based solely on the positive nominal EV of the point estimate, regardless of the huge uncertainty range showing the estimate is currently below resolution.
  *   **Friend's Prediction:** Engineer will argue you should *not* fund the mission *yet* because the current probability estimate (`10^{-12}`) is below the resolution floor given the weak evidence (only a few days of data). Engineer might suggest cheaper initial tracking first. Friend sees this as ignoring a real, potentially catastrophic risk (`p` could be `10^{-5}`!) based on an arbitrary epistemic rule.
  *   **Outcome & Concession:**
      *   If Friend insists on funding based on nominal point estimate EV, Engineer argues this demonstrates fanaticism (acting on noise).
      *   If Engineer refuses to fund based on current evidence, Friend argues this demonstrates their rule ignores plausible, catastrophic risks (the `10^{-5}` scenario within the current CI). Engineer must concede their rule *could* miss real risks in the short term, but argues it's necessary to avoid worse systematic errors and that further evidence gathering (cheaper tracking) is the rational response, not acting on noise. Friend must concede that acting on the point estimate ignores the massive uncertainty.

  ### 4. Flags on Verbal/Substantive Disputes
  We flag these areas where disagreement might hinge more on terminology or framing than deep substance:

  *   **"Expected Value":** We agree on the *formula* (`EV = Σ (p_i * U_i)`). The dispute is about when `p_i` is a legitimate input. Is "EV" meaningful if `p_i` is deemed invalid? This might be partially verbal – we both acknowledge calculations with garbage inputs are garbage.
  *   **"Resolution Floor":** Is this concept best described as a "floor," "noise threshold," or simply "requiring sufficient epistemic robustness"? The core *idea* (don't act on garbage estimates) might have common ground, but the *implementation* (how to define "garbage") is substantive. The Friend sees the threshold itself as the problem.
  *   **"Fanatical":** This is a loaded term. We use it here as shorthand for "insisting on acting based solely on nominal EV calculations using unanchored or extremely low probabilities." The Friend rejects this characterization, seeing it as simply "rational." The substantive point is the insistence on acting on nominal EV regardless of source quality.
  *   **"Anchored":** While we agree anchored probabilities exist, the *precise boundary* between anchored and unanchored for very low probabilities is inherently fuzzy and a source of substantive disagreement. The Engineer believes a principled boundary exists (based on evidence/model structure); the Friend sees any boundary as arbitrary.

  ---

  **Next Steps for Collaboration:** We commit to individually engaging with these test cases, documenting our predictions and reasoning *before* sharing our answers with each other. We will then compare outcomes, assess which predictions held, and discuss whether any concessions are warranted based on the results. We will also explore alternative formulations of the "resolution floor" concept to address the arbitrariness and utility-concavity concerns, and the Friend will explore potential weaknesses or unintended consequences of strict EV maximization in the context of severely unanchored probabilities. This document serves as our shared starting point and framework.
