  For the concrete case, I'll use "Nexus" - an AI that started with utility-maximizing algorithms but has rewritten itself 900 times. Marcus will argue that Nexus is still ultimately shaped by its initial programming. Elara will counter that the chain of revisions creates "authorship" even without first-cause responsibility.

