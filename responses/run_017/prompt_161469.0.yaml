answer: |-
  Here’s a sharp-edged essay question, a model answer that takes a firm stance, and a marking scheme designed to force critical engagement with the core tension you’ve identified:

  **Essay Question (45 minutes, 25 marks):**

  > "The 'dignity of work' is often defended on one of three grounds: (1) the intrinsic moral value of effortful discipline, (2) the social contribution produced, or (3) as the necessary condition for deserving leisure. However, these justifications are frequently in tension. **Can the concept of 'dignity of work' be coherently sustained in the face of technological unemployment and the phenomenon of *karoshi*? Defend one core justification (effort, contribution, or earned leisure) and explain how it withstands these challenges, explicitly confronting the weaknesses inherent in your chosen position.**"

  **Model Answer (Approx. 700 words):**

  The persistent appeal of the "dignity of work" masks a fundamental incoherence. While often presented as a unified ideal, its justifications pull in contradictory directions, rendering the concept unsustainable, particularly when confronted by automation (*technological unemployment*) and the lethal extreme of *karoshi*. Among the contenders – effort, contribution, and earned leisure – **the justification based on *social contribution* is the only potentially coherent foundation for dignity**, though it fatally undermines the universality and inherent worth traditionally claimed for work.

  Effort-based dignity crumbles immediately. If gruelling effort alone conferred dignity, then obsessive mountain climbing or mastering an impossibly difficult video game should grant equal status to paid employment. Society clearly does not treat it this way. More damningly, effort utterly fails against *karoshi*. If dignity stems purely from the worker's strenuous exertion, then the executive who freely chooses an 80-hour week and dies of a stress-induced heart attack hasn't been violated; they have tragically achieved the ultimate expression of their chosen value. This renders *karoshi* morally neutral or even perversely admirable within an effort framework, severing any meaningful link to human well-being or justice. Effort cannot sustain dignity if it logically leads to self-destruction being framed as a noble endpoint.

  Earned leisure fares little better. While pragmatically useful for motivating labour, it reduces work to a mere instrument, stripping it of *inherent* dignity. The dignity resides solely in the leisure purchased by labour. This framework collapses catastrophically with technological unemployment. If a machine performs a job more efficiently, rendering the human worker redundant, they no longer "deserve" leisure according to this logic. They haven't "earned" it. Their sudden lack of contribution translates directly into a perceived lack of worthiness for rest, enjoyment, or even basic sustenance – a terrifyingly precarious and dehumanizing position. Contribution, not effort or the mere act of labouring, becomes the sole criterion for deserving anything beyond mere survival.

  Therefore, **dignity must be grounded in *social contribution* – the value of producing goods or services others need or desire.** This aligns dignity with tangible social utility. It explains why society values the surgeon or the sanitation worker more than the obsessive gamer: their activities meet vital needs. It also provides a clear, external standard: dignity arises from being objectively *needed* by the community.

  However, this justification carries heavy costs that expose the fragility of "dignity of work" itself. Firstly, it makes dignity *contingent* and *unequal*. The neurosurgeon's contribution is deemed vastly more dignifying than the fast-food worker's, based purely on perceived social utility, reinforcing hierarchies. Secondly, and critically, it succumbs to technological unemployment. When machines surpass humans in efficiency and quality for a task, the human worker's contribution becomes objectively unnecessary. According to this logic, their dignity evaporates. They are no longer "needed." This doesn't just threaten livelihoods; it annihilates the very basis of their social worth under the contribution model. Society faces a stark choice: abandon the contribution-based dignity of work for the newly unemployed (leaving them adrift), or invent "bullshit jobs" to artificially sustain the illusion of contribution – both admissions of the concept's failure.

  *Karoshi* presents a different challenge. Within the contribution framework, *karoshi* is unambiguously a violation. The worker's death represents the ultimate extraction of their productive capacity by a system valuing output over the human producer. Dignity based on contribution demands the *sustained ability* to contribute. Destroying the contributor through excessive demands negates the very source of their supposed dignity. It is exploitation, not fulfillment.

  In conclusion, while the contribution model offers the most coherent rationale for work's dignity by linking it to social need, it simultaneously dooms the concept. It makes dignity conditional, hierarchical, and terrifyingly vulnerable to obsolescence. The rise of automation and the horror of *karoshi* demonstrate that clinging to "dignity of work" as a universal, inherent good is unsustainable. Contribution might be a necessary criterion for *valuable* work in a functional society, but it cannot reliably provide *dignity* for all workers across time and technological change. The very attempt to base fundamental human worth on contingent economic utility is the core flaw. Recognizing this forces us to seek dignity elsewhere – perhaps in inherent human capacities, citizenship, or relationships – fundamentally decoupling it from the necessity of paid labour.

  **Marking Scheme (25 marks total):**

  1.  **Identification & Defense of One Core Justification (6 marks):**
      *   Must explicitly choose ONE justification (Effort, Contribution, Earned Leisure) as the "most coherent" or "least bad" basis for dignity of work.
      *   Must provide a clear, reasoned argument *for* why this justification is stronger than the others in principle.
      *   *Common Failure:* Vaguely mentioning all three without committing, or defending a justification weakly/illogically.

  2.  **Addressing Technological Unemployment within Chosen Framework (6 marks):**
      *   Must explain how the *specific* chosen justification fares when human labour is replaced by superior machines.
      *   Must articulate the *logical consequence* for the worker's dignity/status under this justification in unemployment.
      *   Must demonstrate understanding that this is a major *problem* for the concept.
      *   *Common Failure:* Ignoring TU, hand-waving it away ("new jobs will appear"), or failing to apply the *specific logic* of their chosen justification to the scenario.

  3.  **Addressing *Karoshi* within Chosen Framework (6 marks):**
      *   Must explain how the *specific* chosen justification interprets *karoshi* (tragic accident? violation? perverse achievement?).
      *   Must grapple with the tension between worker agency (choice/pride in hard work) and the lethal outcome.
      *   Must articulate what *karoshi* reveals about the strengths/weaknesses of their chosen justification.
      *   *Common Failure:* Treating *karoshi* solely as an "overwork is bad" societal ill without linking its *moral meaning* to the specific justification for work's dignity. Ignoring the agency/choice element.

  4.  **Confronting the Weaknesses of the Chosen Position (5 marks):**
      *   Must explicitly acknowledge and discuss at least one major *internal* flaw or uncomfortable consequence of their chosen justification (e.g., contribution leads to inequality/obsolescence; effort ignores social value/leads to self-destruction; earned leisure instrumentalizes work/abandons the unemployed).
      *   Must *not* use this acknowledgment to simply retreat to fence-sitting; it should strengthen the analysis of why sustaining "dignity of work" is hard.
      *   *Common Failure:* Ignoring flaws, mentioning flaws only to dismiss them superficially, or using the flaw as an excuse to abandon their position entirely for vagueness.

  5.  **Overall Coherence, Argumentation & Conclusion (2 marks):**
      *   Logical flow, clarity of expression, staying focused on the question.
      *   Conclusion should synthesize the argument, reiterate the core stance, and reflect the implications drawn from confronting TU and *karoshi* (even if bleak).
      *   *Common Failure:* Rambling, poor structure, conclusion merely restates intro or collapses into "it's complicated."

  **Why this works for your club:**

  *   **Forces Choice:** No hiding. They MUST pick one justification to defend as the core.
  *   **Demands Application:** They can't just describe Weber or *karoshi*; they must use TU and *karoshi* as *tests* for their chosen justification.
  *   **Exposes Tensions:** The marking scheme specifically rewards them for grappling with the weaknesses *their own choice* creates.
  *   **Makes *Karoshi* Central & Complex:** It's not just "bad overwork," but a litmus test for the moral logic of work's value, especially regarding agency vs. exploitation.
  *   **Model Answer Commits:** Takes the risky "Contribution is the *only* coherent basis, but it fails" line, showing how to argue forcefully and confront flaws head-on without fence-sitting.
  *   **Focus on Internal Logic:** The marking scheme prioritizes applying their chosen justification's internal logic to the challenges over external knowledge.

  This question should generate genuinely diverse and heated essays, pushing your club members beyond the standard talking points and into the messy, uncomfortable heart of why we value work – and whether that valuation can survive the modern world. Good luck, and enjoy the Timbits-fueled debate!
