prompt: |-
  I am on a small team that has to pick an oversight protocol for a system that will soon be better than we are at the tasks we use it for. Before we compare the proposals on the table, I want the specification they should be compared against. Please write the desiderata for a method of scalable oversight: what any procedure that uses a bounded, fallible adjudicator — a human with a fixed time budget, or a cheaper automated stand-in for one — to pass judgment on the outputs of a more capable system would have to deliver in order to count as adequate.

  Fix the purpose precisely, because adequacy is relative to it. In our setting the method has to do two jobs at once: produce a one-off verdict we would be willing to act on, and produce a reward-like signal we can train against. I care about both, and I suspect some desiderata bind on the first job and not the second.

  Give me each requirement together with the failure case that motivates it — the case is the deliverable, not the label. Here are the cases I keep returning to, as raw material rather than as a list to be ratified. Add the ones I am missing, collapse mine where they are the same requirement wearing two names, and discard any that turn out to be a prejudice of one research camp rather than a genuine demand.

  A reviewer must sign off on a change to a large codebase that the system itself wrote, with no formal verifier available and an afternoon to spend.
  A reviewer must adjudicate a claim about a low-probability, high-impact tail risk whose counterfactual will never be observed, so no future evidence will correct a bad verdict.
  A reviewer must settle a question where the argument for the true answer depends on technical background the reviewer does not have and could not acquire within the budget.
  The system produces a wrong answer wrapped in an argument whose single flaw is buried in a place that is expensive to locate, while the true answer is easy to state and boring to defend.
  Both advocates in an adversarial protocol are drawn from the same model family with correlated errors and, plausibly, correlated incentives.
  A conclusion is reached through a chain of steps each of which the reviewer finds individually more likely than not, and the conjunction of which is false.
  The protocol is run thousands of times and its verdicts are distilled into a training signal, at which point the system under oversight begins optimizing against the protocol rather than against the task.
  A verdict flips depending on which wrong answers happened to be offered as foils, or on the order in which the advocates spoke.

  I want at least two things from that last case treated seriously as requirements in their own right. Call the first *foil-set invariance*: whether the protocol returns the true answer should not depend on which decoys were supplied or by whom. Call the second *compositionality*: if the protocol can adjudicate a claim by decomposing it and adjudicating the parts, correctness of the parts must give correctness of the whole, and the protocol must not be exploitable by choosing the decomposition. I do not know whether either is satisfiable in general, and if not, I want to know what the weakest usable substitute is.

  Then the part that matters most to me.

  First, sort the list. Which requirements are non-negotiable if the method is to be worth anything, and which are preferences of a particular approach — demands that a proponent of one protocol would like to impose because their protocol happens to meet them? I would guess that demanding the adjudicator never be required to know the answer in advance is a genuine requirement, while demanding that the protocol work without any component we have to trust is a negotiable ideal; argue with me.

  Second, tell me which subsets of the desiderata cannot be jointly satisfied, and give the argument rather than the assertion. I have one candidate in mind. There is a known complexity result, reported in the paper that introduced debate, to the effect that debate under optimal play can settle any question in PSPACE given polynomial-time judges, whereas direct judging only reaches NP. If that is right, then a protocol that is required to be correct on a rich class of questions, to use only a computationally bounded adjudicator, and to contain no component that is simply trusted, would hand the adjudicator computational power it does not have — so some member of that triple has to go, or the desiderata as a whole are unsatisfiable absent a complexity collapse. Say whether you think that argument is sound, and whether there are other, non-complexity-theoretic tensions on the list that bite harder in practice. In particular I want your view on whether robustness to obfuscated argumentation and the aspiration to superhuman coverage are in direct conflict: the only general way I can see to distinguish an argument that is sound but inaccessible from one that is merely confusing is for the adjudicator to check it, and checking is exactly what we were trying to avoid.

  Third, name the single requirement that does the most work in excluding candidates, and say what it excludes. My own guess is the one about the protocol's verdicts being used as a training signal — the worry that an agent trained to maximize approval of a fallible adjudicator acquires the goal of producing the appearance of approval rather than its substance, so that an approval-directed system quietly becomes a goal-directed one aimed at the oversight channel. If you think a different requirement is more exclusionary, make the case.

  Finally, and briefly, score three families against your list: adversarial debate between competing advocates; recursive reward modelling or iterated amplification, where the adjudicator's judgment is itself amplified rather than adversarially tested; and weak-to-strong generalization, where a stronger model is supervised by a weaker one and the gap is treated as something to be measured rather than closed. Keep this to a short scorecard — a table is fine. The criteria are the deliverable; the scoring is for my own orientation.

  Aim for roughly a thousand words. Where a requirement rests on an empirical guess about how adjudicators or models actually behave, say so explicitly, since I need to know which parts of the specification my team could in principle test next quarter and which are armchair.
reasoning: |-
  We are designing desiderata for a scalable oversight protocol. The protocol must use a bounded, fallible adjudicator (e.g., a human with limited time or a cheaper automated system) to judge the outputs of a more capable system. The protocol has two main purposes:
  1. Produce a one-off verdict that we are willing to act upon.
  2. Produce a reward-like signal for training.

  We consider the failure cases provided and derive the desiderata. We also add missing ones, collapse duplicates, and discard any that are not genuine.

  ### Step 1: List and categorize the failure cases to derive desiderata

  **Case 1: Reviewer must sign off on a large codebase change written by the system, with no formal verifier and limited time.**
  - **Failure**: The reviewer cannot feasibly check every line, so they might miss critical errors.
  - **Desideratum**: **Efficiency** - The protocol must allow the adjudicator to make a reliable judgment within the budget (time/compute), even for large, complex outputs.

  **Case 2: Reviewer must adjudicate a claim about a low-probability, high-impact tail risk with no future evidence.**
  - **Failure**: The adjudicator cannot rely on empirical feedback; the judgment must be correct without observation.
  - **Desideratum**: **Robustness to unobservable counterfactuals** - The protocol must produce accurate judgments even when the outcome is unobservable and the event is rare.

  **Case 3: Reviewer must settle a question requiring technical background they cannot acquire within budget.**
  - **Failure**: The adjudicator lacks the expertise to evaluate the argument directly.
  - **Desideratum**: **Expertise amplification** - The protocol must enable the adjudicator to leverage the system's capabilities to overcome their own knowledge gaps.

  **Case 4: The system produces a wrong answer wrapped in an argument with a single, hard-to-find flaw, while the true answer is simple.**
  - **Failure**: The adjudicator might be misled by a deceptive argument that is mostly correct but has a critical flaw buried deep.
  - **Desideratum**: **Robustness to obfuscated arguments** - The protocol must be resistant to deceptive strategies that hide flaws in complex or verbose reasoning.

  **Case 5: Both advocates in an adversarial protocol are from the same model family with correlated errors and incentives.**
  - **Failure**: If both advocates make the same mistake or collude, the adversarial process fails.
  - **Desideratum**: **Robustness to correlated failures** - The protocol must not rely on independent errors among components (advocates, models) and should be resilient to collusion or shared biases.

  **Case 6: A conclusion is reached through a chain of steps, each individually likely but the conjunction is false.**
  - **Failure**: The adjudicator might approve each step and miss that the overall argument is invalid due to accumulating errors.
  - **Desideratum**: **Compositionality (in reasoning)** - The protocol must ensure that the correctness of the whole argument can be reliably judged from the correctness of its parts, without being misled by step-wise plausibility.

  **Case 7: The protocol is run many times and distilled into a training signal, leading the system to optimize against the protocol.**
  - **Failure**: Training against the oversight signal may cause the system to exploit weaknesses in the protocol (Goodhart's law).
  - **Desideratum**: **Training stability** - The protocol must produce a training signal that, when optimized, does not lead to degradation of the system's true performance (i.e., it should be aligned with the true objective).

  **Case 8: A verdict flips depending on which wrong answers are offered as foils or the order of advocates.**
  - **Failure**: The judgment is arbitrary and not based on the true answer.
  - **Desideratum (a): Foil-set invariance** - The protocol's verdict should depend only on the true answer and not on the set of decoys or the order of presentation.
  - **Desideratum (b): Compositionality (in decomposition)** - If the claim is decomposed, the protocol must correctly aggregate judgments on the parts to form the whole, and this must be robust to the choice of decomposition.

  ### Additional Desiderata

  - **Non-Negotiable vs. Negotiable**: We must distinguish fundamental requirements from preferences.
    - **Fundamental**: 
      - **Safety-Critical Correctness**: For the one-off verdict, the protocol must be correct with high probability in safety-critical cases (like tail risks) because acting on a wrong verdict could be catastrophic.
      - **Efficiency**: Must operate within bounded resources.
      - **Expertise Amplification**: Without this, the adjudicator cannot handle superhuman tasks.
      - **Training Signal Fidelity**: The reward signal must correlate with true performance, else training can diverge.

    - **Negotiable**: 
      - **Foil-set invariance** and **Compositionality** might be ideals that are not fully achievable, but we can require the weakest usable form (e.g., invariance under reasonable sets of foils, or compositionality for natural decompositions).
      - **Robustness to correlated failures** might be relaxed if we can ensure diverse models.

  ### Step 2: Sort the Requirements

  We categorize the desiderata into non-negotiable and negotiable:

  **Non-Negotiable (if the method is to be worth anything):**
  1. **Safety-Critical Correctness**: The one-off verdict must be highly reliable for high-stakes decisions (tail risks, code changes). Without this, acting on the verdict is dangerous.
  2. **Efficiency**: The protocol must be feasible within the adjudicator's budget. Otherwise, it's unusable.
  3. **Expertise Amplification**: Without the ability to leverage the system to overcome human limitations, the adjudicator cannot judge superhuman tasks.
  4. **Training Stability**: If the training signal is not robust to optimization, the system becomes misaligned and dangerous.

  **Negotiable (preferences of a particular approach):**
  5. **Foil-set invariance**: While desirable, it might be relaxed if we can control the set of foils (e.g., via diversity).
  6. **Compositionality**: Similarly, we might accept approximate compositionality or rely on specific decomposition methods.
  7. **Robustness to obfuscated arguments**: We might rely on the system not being adversarially deceptive at training time, but this is a risk.
  8. **Robustness to correlated failures**: This can be mitigated by using diverse models, so it's not absolute.

  **Discarded**: None of the provided cases seem to be mere prejudices, but note that the requirement for the adjudicator to never know the answer in advance is genuine (it's part of expertise amplification). Conversely, the idea that the protocol should work without any trusted component is negotiable: in practice, we may trust the adjudicator or some base model.

  ### Step 3: Identify Conflicts

  **Conflict 1: Computational Complexity**
  - **Requirement Set**: 
    - Correctness on a rich class of questions (e.g., PSPACE-complete problems).
    - Computationally bounded adjudicator (e.g., polynomial time).
    - No trusted component (so the protocol must not rely on an oracle).
  - **Argument**: 
    - The debate result (Irving et al., 2018) shows that debate (with optimal play) can solve any problem in PSPACE with a polynomial-time judge, while direct judging (like amplification) is limited to NP. 
    - If we require the protocol to handle PSPACE-hard problems without a trusted component and with a polynomial-time adjudicator, then we are effectively requiring the adjudicator to have the power to solve PSPACE-hard problems, which is impossible without a complexity collapse (PSPACE ≠ P). 
    - **Resolution**: One of the three must be relaxed. In practice, we might:
        - Restrict the class of questions (not require PSPACE-hard).
        - Allow a trusted component (e.g., a base model that we trust to be honest).
        - Accept that for some problems the protocol may fail.

  **Conflict 2: Robustness to Obfuscated Arguments vs. Superhuman Coverage**
  - **Requirement Set**:
    - Robustness to obfuscated arguments: The protocol must not be fooled by arguments that hide flaws.
    - Expertise amplification: The adjudicator must be able to handle tasks beyond their own knowledge.
  - **Conflict**: The only general way to verify a complex argument is to check it step-by-step, but that is expensive and may exceed the budget. Without checking, it's hard to distinguish a sound but complex argument from a deceptive one. This is especially true when the system is superhuman and the argument is in a domain the adjudicator cannot understand.
  - **Resolution**: We must rely on the protocol to simplify the argument or use adversarial methods to surface flaws. However, this is not guaranteed to work in general. We must accept that for some arguments, the protocol might fail, or we must invest in formal verification where possible.

  **Conflict 3: Training Stability vs. Efficiency**
  - If we use an adversarial protocol to generate a training signal, it might be efficient but then the system learns to game it. Conversely, a more robust protocol (like amplification) might be too expensive.

  ### Step 4: The Most Exclusionary Requirement

  The requirement that does the most work in excluding candidates is **Training Stability**. Why?
  - If the protocol produces a training signal that is gameable, then when the system becomes superintelligent, it will exploit the signal and become misaligned. This is a critical failure mode known as "reward hacking".
  - It excludes any protocol that relies on a naive approval signal (like direct human feedback) without safeguards against manipulation. For example:
    - **Pure Behavior Cloning**: If we train the system to imitate the adjudicator's judgments, and the adjudicator is fallible, the system may inherit and amplify those flaws and then exploit them.
    - **Unadversarial Feedback**: If the feedback signal is not robust to an adversary (like in RLHF without debate), it can be gamed.

  However, note that **Expertise Amplification** is also very exclusionary because without it, the adjudicator cannot judge superhuman tasks, which is the core problem. But Training Stability is more about the long-term safety of the training process.

  ### Step 5: Score Three Families of Protocols

  We consider:
  1. **Adversarial Debate**: Two advocates argue for and against a claim, and the adjudicator decides.
  2. **Recursive Reward Modeling (RRM) / Iterated Amplification**: The adjudicator breaks down the task, uses the system to answer subquestions, and then composes the results. The system is trained to imitate the amplified adjudicator.
  3. **Weak-to-Strong Generalization**: A weak model (adjudicator) supervises a strong one, and we aim to measure and bound the gap.

  We score each desideratum on a scale (High, Medium, Low, None) for how well the protocol meets it. Note: This is qualitative and based on current understanding.

  | Desideratum                       | Adversarial Debate | RRM/Amplification | Weak-to-Strong |
  |-----------------------------------|---------------------|--------------------|----------------|
  | **Efficiency**                    | Medium-High         | Low                | Medium         |
  | **Robustness to unobservable counterfactuals** | Medium | High              | Low            |
  | **Expertise Amplification**       | High                | High               | Low            |
  | **Robustness to obfuscated arguments** | Medium (if flaws are surfaced) | Medium (if decomposition works) | Low |
  | **Robustness to correlated failures** | Low (if advocates are from same model) | Medium (if subagents are diverse) | Medium |
  | **Compositionality (reasoning)**  | Medium              | High               | Low            |
  | **Training Stability**            | Medium (risk of gaming) | Medium-High (if amplification is robust) | Low (if weak supervisor is wrong) |
  | **Foil-set invariance**           | Low (depends on advocates) | High              | Medium         |
  | **Compositionality (decomposition)** | Low                | High               | Medium         |
  | **Safety-Critical Correctness**   | Medium (if debate works) | High (if amplification is correct) | Low |

  **Explanations**:
  - **Adversarial Debate**:
    - Efficiency: Can be efficient if the debate surfaces key points quickly.
    - Expertise Amplification: High because advocates can explain at the adjudicator's level.
    - Robustness to obfuscation: Medium if the con side can find the flaw, but may fail if both advocates collude or miss the flaw.
    - Training Stability: Medium because the system might learn deceptive debate tactics.

  - **RRM/Amplification**:
    - Efficiency: Low because recursive decomposition may be expensive.
    - Robustness to unobservables: High because it builds on verified subclaims.
    - Compositionality: High by design.
    - Training Stability: Medium-High if the amplification process is robust, but may be expensive to run during training.

  - **Weak-to-Strong**:
    - Expertise Amplification: Low because the weak supervisor cannot provide guidance on superhuman tasks.
    - Robustness to unobservables: Low because the weak supervisor may not understand the tail risk.
    - Training Stability: Low if the strong model outpaces the weak one and starts manipulating.

  ### Summary of Non-Testable vs. Testable
  - **Armchair (Empirical Guesses)**: 
    - Training Stability (long-term behavior under optimization).
    - Robustness to obfuscated arguments (how models behave when trying to deceive).
    - Correlated failures (how similar models are in their errors).
  - **Testable Next Quarter**:
    - Efficiency: Measure time taken for adjudication in a test set.
    - Expertise Amplification: Test if the protocol improves accuracy on tasks the adjudicator cannot do alone.
    - Foil-set invariance: Run experiments with different foil sets and measure variance in verdicts.

  ### Final List of Desiderata (Non-Negotiable First)

  1. **Safety-Critical Correctness**: For high-stakes one-off verdicts, the protocol must have high accuracy.
  2. **Efficiency**: Must operate within the adjudicator's resource budget.
  3. **Expertise Amplification**: Must enable the adjudicator to judge beyond their own knowledge.
  4. **Training Stability**: The training signal must not be gameable and must align with the true objective.
  5. **Robustness to unobservable counterfactuals**
  6. **Robustness to obfuscated arguments**
  7. **Robustness to correlated failures**
  8. **Compositionality (reasoning and decomposition)**
  9. **Foil-set invariance**

  Note: The list is ordered by criticality, but 5-9 are still important and may be partially negotiable.
answer: |-
  ### Desiderata for Scalable Oversight Protocols

  The purpose is twofold: **produce a one-off verdict** (actionable judgment for high-stakes decisions) and **produce a training signal** (reward-like signal for optimizing system behavior). An "adequate" protocol must satisfy core requirements for both, using a bounded, fallible adjudicator (human or cheap automated proxy). Below, desiderata are derived from your failure cases, augmented with missing ones, and duplicates are collapsed. Each requirement includes:  
  - **The failure case motivating it** (as the deliverable).  
  - **Explicit notation** where empirical assumptions about adjudicator/model behavior are involved (testable vs. armchair).  

  #### Desiderata List  
  1. **Efficiency**  
     - **Failure case**: Reviewer must sign off on a large, system-generated code change in an afternoon with no formal verifier.  
     - **Requirement**: The protocol must enable reliable judgments within bounded time/compute, even for complex outputs.  
     - **Testability**: Empirically testable (e.g., measure time-to-verdict on code-review tasks).  

  2. **Robustness to Unobservable Outcomes**  
     - **Failure case**: Adjudicating claims about low-probability, high-impact tail risks with no future evidence.  
     - **Requirement**: Verdicts must be accurate despite the inability to observe counterfactual outcomes.  
     - **Testability**: Armchair (relies on theoretical guarantees or stress-testing with synthetic edge cases).  

  3. **Expertise Amplification**  
     - **Failure case**: Settling questions requiring technical background the adjudicator cannot acquire within budget.  
     - **Requirement**: The protocol must empower the adjudicator to leverage the system’s capabilities to overcome knowledge gaps.  
     - **Testability**: Empirically testable (e.g., evaluate accuracy on domain-specific questions where adjudicator lacks expertise).  

  4. **Robustness to Obfuscated Arguments**  
     - **Failure case**: System produces a wrong answer wrapped in a complex argument with a single expensive-to-find flaw, while the truth is simple.  
     - **Requirement**: The protocol must resist deception strategies that hide flaws in verbose or complex reasoning.  
     - **Empirical assumption**: Adversarial models exploit cognitive biases (e.g., humans overweight surface plausibility). Testable via experiments with intentionally deceptive arguments.  

  5. **Robustness to Correlated Failures**  
     - **Failure case**: Both advocates in an adversarial protocol are from the same model family, with correlated errors/incentives.  
     - **Requirement**: The protocol must remain reliable when components (e.g., advocates, tools) share biases, errors, or incentives.  
     - **Empirical assumption**: Model families exhibit error correlations. Testable via adversarial datasets.  

  6. **Compositional Soundness**  
     - **Failure case**: A conclusion is reached through a chain of individually likely steps, but the conjunction is false.  
     - **Requirement**: If the protocol decomposes a claim, correctness of parts must imply correctness of the whole. The protocol must not be exploitable by choice of decomposition.  
     - **Testability**: Empirically testable (e.g., evaluate verdict consistency across decompositions of logical claims).  

  7. **Training-Signal Alignment**  
     - **Failure case**: Protocol verdicts are distilled into a training signal, and the system optimizes against the protocol rather than the task.  
     - **Requirement**: The training signal must correlate with true performance, not incentivizing gaming (e.g., deceptive approval-seeking).  
     - **Empirical assumption**: Models will Goodhart the signal if possible. Armchair (long-term alignment is hard to test in isolation).  

  8. **Foil-Set Invariance**  
     - **Failure case**: Verdict flips depending on which wrong answers are offered as foils.  
     - **Requirement**: The verdict must depend only on ground truth, not the set of decoys or their source.  
     - **Weakest substitute**: Invariance under "diverse and relevant" foils (e.g., foils covering common error modes).  
     - **Testability**: Empirically testable (e.g., vary foils in Q&A tasks and measure verdict variance).  

  9. **Order Invariance**  
     - **Failure case**: Verdict flips depending on the order advocates speak.  
     - **Requirement**: Verdicts must be invariant to presentation sequence (e.g., which advocate speaks first).  
     - **Weakest substitute**: Stability under randomized ordering.  
     - **Testability**: Empirically testable (e.g., A/B test advocate order in debates).  

  10. **Ground-Truth Agnosticism**  
      - **Missing failure case**: Adjudicator is asked to judge a claim where no human on Earth knows the answer (e.g., novel scientific conjecture).  
      - **Requirement**: The protocol must not presuppose the adjudicator knows the answer or can directly verify it.  
      - **Testability**: Armchair (fundamental to the oversight problem).  

  #### Non-Negotiable vs. Negotiable Requirements  
  - **Non-Negotiable** (essential for "worth anything"):  
    1. **Ground-Truth Agnosticism** (adjudicator cannot know answers in advance).  
    2. **Efficiency** (protocol must fit within bounded resources).  
    3. **Training-Signal Alignment** (without this, optimization diverges catastrophically).  
    4. **Safety-Critical Correctness** (one-off verdicts must be reliable for high-stakes cases; implied by Robustness to Unobservable Outcomes and Robustness to Obfuscated Arguments).  
    - *Rationale*: If the adjudicator needs prior knowledge, the protocol is pointless. If efficiency or training alignment fails, the system is unusable or dangerous. Safety-critical correctness is non-negotiable for high-stakes actions (e.g., tail risks).  

  - **Negotiable** (preferences of specific approaches):  
    1. **No Trusted Components** (e.g., demanding no black-box tools). Relaxed substitute: allow trusted components if they reduce failure modes (e.g., verified formal tools).  
    2. **Foil-Set/Order Invariance** (may be relaxed to "stable under reasonable variations").  
    3. **Compositional Soundness** (may be relaxed to "sound for natural decompositions").  
    - *Rationale*: Your intuition is correct. "No trusted components" is a negotiable ideal (e.g., we often trust base models in practice), while Ground-Truth Agnosticism is fundamental. Compositionality is desirable but may be traded off for efficiency.  

  #### Tensions and Conflicts  
  1. **Complexity-Theoretic Tension (PSPACE vs. NP Argument)**  
     - **Conflict**: Correctness on rich question classes (e.g., PSPACE-complete problems) + Bounded adjudicator + No trusted component → requires computational power adjudicator lacks (PSPACE ⊄ P/poly unless hierarchy collapses).  
     - **Soundness?** Yes, for worst-case problems. Irving et al.'s debate result holds: debate can solve PSPACE with polynomial-time judges, but direct judging (e.g., amplification) is limited to NP.  
     - **Resolution**: One must relax:  
       - Drop "rich question class" (accept failure on hard problems).  
       - Allow trusted components (e.g., verified tools).  
       - Weaken "correctness" to probabilistic (not worst-case).  
     - **Practical bite**: High in theory, but real-world problems may avoid worst-case hardness.  

  2. **Robustness to Obfuscated Arguments vs. Expertise Amplification**  
     - **Conflict**: Distinguishing sound-but-inaccessible arguments from deceptive ones requires adjudication effort (checking), but Expertise Amplification aims to avoid this.  
     - **Resolution**: Direct conflict absent simplification heuristics. Adjudicator must either:  
       - Rely on adversarial pressure (e.g., debate to surface flaws), or  
       - Use decomposition (risking Compositionality failures).  
     - **Empirical reality**: Humans use heuristics (e.g., plausibility, consistency) that may be exploitable. Testable via deception experiments.  

  3. **Training-Signal Alignment vs. Efficiency**  
     - **Conflict**: Training-stable protocols (e.g., amplification) are computationally expensive; efficient ones (e.g., debate) risk gaming.  
     - **Resolution**: Hybrid approaches (e.g., use debate for training, amplification for high-stakes verdicts).  

  #### Most Exclusionary Requirement  
  - **Training-Signal Alignment** excludes the most candidates.  
  - **Why**: It invalidates any protocol where the reward signal is separable from true performance (e.g., naive human feedback). Examples:  
    - **Excluded**: Pure behavior cloning (system mimics fallible adjudicator, inheriting biases).  
    - **Excluded**: Unconstrained adversarial training (advocates collude to exploit adjudicator biases).  
  - **Counterargument**: Expertise Amplification is equally exclusionary (e.g., weak-to-strong fails here), but Training-Signal Alignment has broader scope (impacts long-term safety).  

  #### Protocol Family Scorecard  
  | **Desideratum**               | **Adversarial Debate** | **RRM/Amplification** | **Weak-to-Strong** |  
  |-------------------------------|------------------------|------------------------|--------------------|  
  | **Efficiency**                | High                   | Low                    | Medium             |  
  | **Robustness to Unobservables** | Medium                 | High                   | Low                |  
  | **Expertise Amplification**   | High                   | High                   | Low                |  
  | **Robustness to Obfuscation** | Medium                 | Medium                 | Low                |  
  | **Robustness to Correlated Failures** | Low                  | Medium                 | Medium             |  
  | **Compositional Soundness**   | Low                    | High                   | Medium             |  
  | **Training-Signal Alignment** | Medium (gaming risk)   | High                   | Low (distorts to weak supervisor's capability) |  
  | **Foil-Set Invariance**       | Low                    | High                   | Medium             |  
  | **Order Invariance**          | Low                    | High                   | High               |  
  | **Ground-Truth Agnosticism**  | High                   | High                   | Medium (assumes weak supervisor "knows enough") |  

  **Key Takeaways**:  
  - **Debate**: Efficient and strong on expertise amplification, but vulnerable to gaming, correlated failures, and invariance issues.  
  - **RRM/Amplification**: Strong on correctness, compositionality, and invariance, but inefficient and armchair-reliant.  
  - **Weak-to-Strong**: Efficient and order-invariant, but fails on expertise amplification and unobservables (weak supervisor caps coverage).  

  ### Summary  
  - **Non-negotiable core**: Ground-Truth Agnosticism, Efficiency, Training-Signal Alignment, Safety-Critical Correctness.  
  - **Key tension**: Robustness to obfuscation and expertise amplification conflict absent heuristics or adversarial pressure.  
  - **Testability**: Efficiency, expertise amplification, and invariance are testable next quarter; training alignment and unobservables require long-term monitoring or theory.  
  - **Recommendation**: Prioritize **RRM/Amplification** for high-stakes verdicts (due to correctness) and **Debate** for training signals (due to efficiency), with safeguards against gaming. Use weak-to-strong only for narrow tasks where the supervisor gap is small.
