answer: |-
  ## NATIONAL TRANSPARENCY REGISTER: CITIZEN DECISION PROGRAMME FILING - GUIDANCE NOTES

  **1. What is the purpose of the National Transparency Register (NTR)?**
  The NTR ensures predictability and rational choice in societal interactions classified as one-shot Prisoner's Dilemmas (PDs). By mandating the public filing and mutual pre-exchange of deterministic decision programmes, the NTR eliminates uncertainty, allowing citizens to make optimally informed choices based on the other party's verified source code. This fosters an environment of strategic clarity and minimises suboptimal outcomes.

  **2. What must I file?**
  Every adult citizen must file, and biennially re-file, a machine-readable programme. This programme must accept, as its sole input, the source code of one other citizen's currently filed NTR programme. Its output must deterministically be either COOPERATE or DEFECT within the constraints defined for PD interactions. Submissions must adhere to the Approved Readability Standard (ARS v3.2).

  **3. Are there technical constraints on my programme?**
  Yes. Programmes must halt and return COOPERATE or DEFECT within **2^20 (1,048,576) clock cycles** when executed on the NTR's Standard Verification Architecture (SVA). Programmes exceeding this cycle limit are deemed non-compliant. If your programme enters a state where it appears to be simulating another programme that is simultaneously simulating *it*, potentially leading to mutual simulation depth exceeding the cycle limit, we advise implementing a recursion depth counter or utilising the SVA's built-in cycle counter (`get_cycles_remaining()`) to return a safe default (e.g., DEFECT) before the limit is breached. Prudent programme design avoids unbounded mutual inspection.

  **4. What are some standard, compliant programme models?**
  Citizens commonly adopt one of three proven rational strategies:
  *   **Model C (Unconditional Cooperation):** Outputs COOPERATE for any input programme. Simple and promotes mutual benefit with compatible parties.
  *   **Model D (Unconditional Defection):** Outputs DEFECT for any input programme. Guarantees maximising individual gain against Model C, though sacrifices potential mutual gains.
  *   **Model P (Prudent Conditional Cooperation):** Outputs COOPERATE if and *only if* it can formally prove, within the cycle limit, that the input programme outputs COOPERATE when given *its own source code* as input. Otherwise, outputs DEFECT. This represents the hallmark of responsible, strategically sophisticated citizenship, ensuring cooperation only with demonstrably compatible partners while avoiding exploitation.

  **5. Why is Model P considered particularly responsible?**
  Model P exemplifies rational foresight. By rigorously verifying mutual cooperation potential *before* committing to COOPERATE, it achieves the superior (COOPERATE, COOPERATE) outcome with compatible partners while securely avoiding the detrimental (COOPERATE, DEFECT) outcome. Analysis shows Model P programmes consistently achieve high individual payoff scores in the NTR's Annual Societal Outcome Metrics, particularly when interacting with other Model P programmes or Model C.

  **6. How does a Model P programme cooperate with another Model P programme? Isn't that paradoxical?**
  Not at all. This demonstrates the elegance of provable rationality. Consider Programme P1 and an *identical copy* of itself, P2. P1 receives P2's code (which is identical to P1's own code). P1 attempts to prove: "Does P2 output COOPERATE when given P1's code (i.e., P2's own code) as input?" Because P2 is programmed *only* to cooperate if *it* can prove the same about *its* input (P1's code, which is identical), and because the programmes are identical and finite, P1 can construct a proof within the cycle limit that P2 *will* cooperate when seeing itself. Therefore, P1 cooperates. The same logic applies for P2. Mutual cooperation is achieved through verifiable self-referential compatibility.

  **7. My twin brother and I wrote identical Model P programmes. Will they cooperate? What about spouses or clones?**
  Yes, identical programmes will mutually cooperate, as explained in Q6. For non-identical programmes, cooperation depends solely on the provable logic within each programme's source code as per the ARS. Familial relationship, genetic similarity, or emotional bonds are irrelevant to the deterministic execution of the programmes. The NTR deals solely in verifiable code, ensuring fairness and objectivity. If programmes are functionally equivalent under the ARS, they will be recognised as such.

  **8. What is a "Verified Clique" certification?**
  Citizens may form groups and submit their programmes (which must be identical or functionally equivalent under ARS rules) for joint certification as a "Verified Clique". Programmes within a Certified Clique are modified (or designed initially) to output COOPERATE *only* if the input programme possesses the *same, valid* Verified Clique certificate issued by the NTR. Otherwise, they output DEFECT. This allows for efficient, trustless cooperation within defined groups.

  **9. What happens if I don't join a Verified Clique? What if my programme isn't readable?**
  Participation in a Verified Clique is voluntary. Uncertified citizens retain all rights and obligations under the NTR. Programmes encountering uncertified programmes will behave according to their internal logic (e.g., Model P will attempt proof, Model C cooperates, Model D defects).
  *   **Non-ARS-Compliant Programmes:** Submissions must be human-readable under ARS v3.2. Minified, obfuscated, or compiled binaries are rejected. If your programme is initially rejected, you may appeal for NTR Clerk review. If deemed fundamentally unclassifiable under ARS after appeal, or if it fails to halt within the cycle limit during verification, it is classified as **Unverifiable**.
  *   **Interacting with Unverifiable Programmes:** By Regulation, *all* compliant programmes are mandated to output DEFECT when given an Unverifiable programme as input. This is a necessary security precaution to prevent exploitation via non-transparent or non-halting code. Unverifiable filers remain subject to penalties for non-compliance but are still bound by the outputs of other citizens' programmes when interacting.

  **10. Is defection allowed under the NTR?**
  Absolutely. The NTR's paramount achievement is ensuring **transparency**, not mandating any specific behaviour. The scheme is designed to be strategy-neutral, accommodating the full spectrum of rational choice. Unconditional Defection (Model D) is a fully compliant and rational filing option. Its predictability allows other prudent citizens (Model P) to cleanly defect against it, avoiding the (COOPERATE, DEFECT) trap, while Model C citizens knowingly accept the risk. The NTR proudly reports that **Universal Unconditional Defection**, where every citizen files Model D, is a stable, fully transparent, and compliant equilibrium under the scheme. Last quarter's metrics showed 12.7% of interactions achieving mutual cooperation, 42.1% mutual defection, and 45.2% asymmetric outcomes – a testament to the diverse yet predictable rational choices facilitated by the Register. File rationally, file transparently.
