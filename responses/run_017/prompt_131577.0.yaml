prompt: |-
  I commission and edit evolutionary-explanation pieces for a popular-science magazine — roughly one "why do humans or other animals have trait X?" feature a month — and I want a triage procedure my editors can run on any proposed adaptive explanation before we buy it. I want the steelman version of the Gould–Lewontin spandrels critique, not the version that mostly licenses us to feel smarter than whoever pitched the story, and not a blanket skepticism that would make the section impossible to fill.

  Concretely: an ordered checklist of questions, with what counts as a sufficient answer to each, a point at which the procedure stops with a no, and the points where it hands the question back to a human because it is editorial or value judgment rather than evidence. My editors are generalists with at most an undergraduate biology course, they have about twenty minutes per pitch, and I sign off on the outcome, so the procedure has to be runnable without a specialist in the room and say plainly when it cannot be.

  The distinctions I most want preserved rather than flattened by the simplification: current utility versus historical selection for that effect — a trait can be useful now without having been built for that use — and, among the non-adaptive explanations, structural byproduct with no current function versus byproduct later co-opted for a function versus a trait that made sense in an ancestral environment and is now mismatched or locked in by lineage history. I also want the procedure to include what I call the accessibility check: is there some variant near the actual trait that would perform the alleged function better and that the lineage could plausibly have reached? If such a variant exists and is absent, the adaptive story owes us an explanation, and I want the procedure to say what would discharge that debt.

  Then run it on three pitches: one arguing that the human taste for spicy food is an antimicrobial adaptation; one arguing that music is a byproduct of other cognitive machinery with no adaptive story of its own; and one that I expect to be uncomfortable, since my house line is that our debunkings are better evidenced than the adaptationist claims they mock, and I suspect a symmetric procedure will say they are often not. Show me where that suspicion is correct and where it is not, and be honest about what the procedure cannot settle even in principle.
reasoning: |-
  We are designing a triage procedure for evaluating adaptive explanations for traits. The goal is to avoid both naive adaptationism and blanket skepticism, and to preserve key distinctions (current utility vs. historical selection, non-adaptive explanations including structural byproducts, exaptations, and mismatches). The procedure must be runnable by editors with basic biology knowledge in about 20 minutes.

  The procedure is an ordered checklist of questions. At each step, if the answer doesn't meet the criteria, we stop and reject the pitch (or flag for revision if it's a fixable issue). If we get through the checklist, the pitch passes.

  Key elements:
  1. Current Utility vs. Historical Selection: We want to know if the trait was selected for the proposed function or if it's currently useful but for other reasons.
  2. Non-adaptive explanations: We want to consider structural byproducts (spandrels), exaptations (co-opted for a new function), and mismatches (adaptive in the past but not now).
  3. Accessibility Check: If there is a plausible variant that would perform the function better and it's absent, the adaptive story must explain why.

  Checklist:

  1. **Clarity of the Trait and Proposed Function:**
     - Question: Is the trait clearly defined? Is the proposed adaptive function (the "why") clearly stated?
     - Sufficient answer: The trait is unambiguously described (e.g., "taste for spicy food" not just "spiciness"). The function is specific (e.g., "killing gut parasites" not just "is adaptive").
     - Stop if: The trait or function is vague. Hand back for clarification if it's a minor ambiguity.

  2. **Evidence of Current Utility:**
     - Question: Is there evidence that the trait currently provides the proposed benefit? (Note: This does not imply historical selection.)
     - Sufficient answer: At least one study (or a set of observations) showing that the trait in its current form has the proposed effect in the relevant context (e.g., spicy compounds kill microbes in a lab setting or in vivo in humans).
     - Stop if: No current utility is demonstrated. However, note that the absence of current utility does not necessarily mean the trait is non-adaptive (it might be a mismatch), but without current utility, the proposed function is unsupported.

  3. **Evidence of Historical Selection for the Proposed Function:**
     - Question: Is there evidence that the trait evolved because it provided the proposed benefit? (This is the core of the adaptationist claim.)
     - Sufficient answer: One or more of:
       - Comparative evidence: The trait co-occurs with the selective pressure across related species (e.g., spicy food preference in regions with high parasite load).
       - Genetic evidence: Genes associated with the trait show signatures of selection (e.g., positive selection in genes for bitter taste receptors if the function is toxin avoidance).
       - Fossil/archeological evidence: Trait appears in the fossil record when the selective pressure arose.
       - Experimental evidence: Manipulating the trait (or the pressure) affects fitness in a way consistent with the function (e.g., in animal models).
     - Stop if: There is no evidence for historical selection and the pitch is claiming an adaptation. However, note that the pitch might be arguing for a non-adaptive explanation (like a byproduct) and then we skip this step.

  4. **Consideration of Non-adaptive Explanations:**
     - Question: Has the pitch considered and ruled out (or provided evidence against) non-adaptive explanations? Specifically:
       - Structural byproduct (spandrel): The trait is a necessary consequence of other traits (e.g., the chin as a byproduct of jaw evolution).
       - Exaptation: The trait originally evolved for one reason and was later co-opted for the current function.
       - Mismatch: The trait was adaptive in the past but not in the current environment.
     - Sufficient answer: The pitch addresses at least one plausible alternative non-adaptive explanation (e.g., by citing evidence that the trait is not a byproduct, or that it is an exaptation but the current function is not the original one). If the pitch is arguing for a non-adaptive explanation (like the music example), then it must provide evidence for that.
     - Stop if: The pitch claims adaptation but ignores obvious non-adaptive alternatives without justification.

  5. **Accessibility Check:**
     - Question: Is there a plausible variant of the trait that would perform the proposed function better and that the lineage could have evolved? If so, why isn't it present?
     - Sufficient answer: Either:
       - There is no such variant (the trait is already optimal or near-optimal for the function).
       - The variant would have trade-offs (e.g., too costly in another way) that make it less fit overall.
       - The lineage is constrained (e.g., developmental, genetic) from reaching that variant.
     - Evidence required: The pitch must provide reasoning or evidence (e.g., engineering analysis, comparative data showing trade-offs) for why the better variant is absent.
     - Stop if: A clearly better variant exists, is absent, and the pitch does not address it.

  6. **Overall Plausibility and Integration:**
     - Question: Does the explanation fit with established biology? Are there any glaring inconsistencies?
     - Sufficient answer: The explanation does not contradict well-established principles (e.g., the trait is not proposed to have evolved for a function that only appeared recently in human history if the trait is shared with distant ancestors). The evidence is from reliable sources (peer-reviewed journals, reputable institutions).
     - Hand back: If there are inconsistencies that might be resolved with more context (e.g., a new theory that challenges an established one) then we may need specialist input. Otherwise, if it's clearly implausible, stop.

  Now, we run the procedure on three pitches:

  **Pitch 1: Human taste for spicy food as an antimicrobial adaptation.**

  1. **Clarity:** Trait: preference for consuming spicy foods (containing capsaicin and other pungent compounds). Function: to kill or inhibit gut pathogens.
     - Pass: clear.

  2. **Current Utility:** There is evidence that capsaicin and other spices have antimicrobial properties in vitro and in food preservation. Some studies show reduced pathogen growth in spicy foods. However, evidence in vivo (in the human gut) is mixed. The utility might be present but not overwhelming.
     - Pass: current utility is supported, at least in vitro.

  3. **Historical Selection:** 
     - Comparative evidence: Spice use is more common in tropical regions where food spoilage is faster and pathogen load is higher. This is a classic observation (Sherman and Billing, 1999). 
     - However, note that this could also be explained by cultural evolution (spices used because they preserve food, and then preference develops). Genetic evidence? There is no known genetic adaptation for spice preference (tolerance is acquired). 
     - The pitch must show that the preference is innate and evolved for this function. But humans are not born liking spicy food; it's learned. Thus, the trait might be cultural, not biological. 
     - Stop: The pitch is arguing for a biological adaptation, but the trait (innate preference) is not clearly biological. Without evidence of an evolved biological mechanism (e.g., a genetic basis for spice preference that correlates with pathogen load), the historical selection claim fails.

     Outcome: Stop at step 3. The pitch does not provide evidence for historical selection. The trait might be a cultural adaptation (which is a form of adaptation but not biological). The pitch would need to clarify if it's arguing for cultural evolution and then we re-run.

  **Pitch 2: Music is a byproduct of other cognitive machinery with no adaptive story of its own.**

  1. **Clarity:** Trait: human music perception and production. Proposed function: none (byproduct). The pitch argues that music is not an adaptation but a spandrel.
     - Pass: clear.

  2. **Current Utility:** The pitch does not claim current utility as an adaptation. But note: music might have current utility (e.g., social bonding) even if it wasn't selected for that. However, the pitch is denying that it is an adaptation. So step 2 is not required for the non-adaptive claim? 
     - We adjust: For non-adaptive pitches, we skip step 2 (current utility) and step 3 (historical selection) because they are not claiming a function. But we must check step 4 (non-adaptive explanations) carefully.

  3. **Historical Selection:** Not applicable because the pitch is arguing against adaptation.

  4. **Non-adaptive Explanations:** The pitch must provide evidence for the byproduct claim. 
     - Evidence: Music might rely on brain circuits for language, pattern recognition, and emotional processing. If these circuits are adaptations for other functions, then music could be a byproduct. Also, the pitch might cite the lack of specific music modules in the brain, or the variability of musical ability (suggesting it's not under strong selection). 
     - Sufficient? The pitch must also rule out adaptation. For example, is there evidence against music being an adaptation? E.g., music does not show clear fitness benefits in ancestral environments? 
     - The pitch might argue that music is too recent to be an adaptation? But music is ancient. 
     - The pitch must also consider exaptation (e.g., originally a byproduct, then co-opted for social bonding). The pitch claims "no adaptive story", so it must argue against exaptation. 
     - This step is complex. The pitch must present evidence for the byproduct and against adaptation. 
     - If the pitch does not provide such evidence, we stop. But if it does, we continue.

     Let's assume the pitch cites:
       - Music activates multiple brain areas that are primarily for other functions (e.g., auditory cortex, emotion centers, motor areas for rhythm).
       - No known music-specific genes or modules.
       - Music is universal but highly variable, and no clear link to reproductive success.

     This is a reasonable argument. However, the pitch must also address the accessibility check? But step 5 is for adaptive stories. We adjust: step 5 is only for adaptive claims. For non-adaptive, we skip step 5.

  5. **Accessibility Check:** Not applicable.

  6. **Overall Plausibility:** The argument is consistent with known cognitive science. 
     - Pass.

     Outcome: Pass, but note that step 4 requires strong evidence. The pitch must have provided the above reasoning. If it didn't, we stop at step 4.

  **Pitch 3: [Unspecified, but let's take an example of a debunking that might be weak]**

  We'll create a pitch that is a debunking of an adaptationist claim. For example: "The human appendix is not an adaptation for digesting leaves (as in our ancestors) but is a vestigial organ with no function, and any current utility (like immune function) is incidental."

  This is a common example. The house line is that debunkings are better evidenced, but we suspect sometimes they are not.

  1. **Clarity:** Trait: appendix. Proposed function: none (vestigial). The pitch is debunking the claim that it was an adaptation for leaf digestion and arguing it has no function (or only incidental function).
     - Pass.

  2. **Current Utility:** The pitch must address current utility. Recent research suggests the appendix may serve as a reservoir for gut bacteria (immune function). The pitch must acknowledge this and argue that it is not an adaptation (i.e., not selected for that function). 
     - If the pitch says "no function" but there is current utility, then step 2 fails? But the pitch is arguing that the current utility is not the result of selection and may be incidental. 
     - We adjust: For debunkings that claim no function, step 2 requires that there is no current utility. But if there is current utility, the pitch must reframe: it's not an adaptation for that utility (it's an exaptation or byproduct). 
     - The pitch should say: the appendix is vestigial for its original function (digesting leaves) and any current function (immune) is not the result of selection but a coincidental byproduct. 
     - So we require evidence that the current utility (if any) is not an adaptation.

     Evidence for current utility: Yes, studies show that the appendix may harbor beneficial bacteria. 
     The pitch must then argue that this is not an adaptation. How? 
       - Comparative evidence: The appendix is present in few mammals and is lost in many. It is not correlated with diet or immune challenges. 
       - It might be a byproduct of cecum evolution.

     The pitch must address this.

  3. **Historical Selection (for the original function):** The pitch is debunking the claim that the appendix was an adaptation for leaf digestion. 
     - Evidence against: The appendix in humans is much smaller than the cecum in leaf-eating mammals and does not aid in cellulose digestion. Also, our ancestors had larger ceca, and the appendix is a reduced form. 
     - Evidence that it was never an adaptation for leaf digestion? Actually, it is derived from the cecum which was adaptive. But the appendix itself may be vestigial. 
     - The pitch must show that the appendix (as opposed to the cecum) was not under selection for leaf digestion. 
     - Pass: there is evidence that the human appendix is not functional for digestion.

  4. **Non-adaptive Explanations:** The pitch argues the appendix is vestigial (a byproduct of evolution of the cecum) and any current function is exaptation. 
     - It must consider and rule out adaptation for the current function (immune). 
     - Evidence: The appendix is not present in all humans (some are born without) and removal has no major health consequences in modern environments. Also, it is prone to appendicitis, which is maladaptive. 
     - This is a reasonable argument.

  5. **Accessibility Check:** Not for the non-adaptive claim? But if the appendix has current utility, why isn't it better? For example, why is it so prone to inflammation? The pitch must address this. 
     - The pitch argues that because it is vestigial and not under selection, it is not optimized. The current utility is coincidental and not under selection, so it doesn't have to be optimal. 
     - This is acceptable.

  6. **Overall Plausibility:** Consistent with evolutionary biology. 
     - Pass.

     Outcome: Pass, but note that the pitch must have provided evidence for each step.

  However, the house line is that debunkings are better evidenced. In this case, the evidence for the appendix being vestigial is strong, but the current utility (immune function) is a recent finding and the pitch must address it. If the pitch ignored that, it would fail step 2. So debunkings can be weak if they ignore current utility.

  **Summary of the Procedure:**

  The triage procedure:

  1. **Clarity:** Define trait and function. Stop if vague.
  2. **Current Utility:** Evidence the trait currently provides the benefit? (Skip if pitch is non-adaptive). Stop if no utility and pitch claims adaptation for that function.
  3. **Historical Selection:** Evidence the trait evolved for the proposed function? (Skip if non-adaptive pitch). Stop if no evidence for adaptation claim.
  4. **Non-adaptive Explanations:** Consider alternatives (byproduct, exaptation, mismatch). Stop if pitch claims adaptation and ignores plausible alternatives without evidence.
  5. **Accessibility Check:** For adaptive claims, address why a better variant is absent. Stop if absent and unexplained.
  6. **Overall Plausibility:** Check for internal consistency and fit with known biology. Hand back if needs specialist; stop if implausible.

  For non-adaptive pitches (like pitch 2), skip steps 2 and 3 (and step 5 if the claim is not about adaptation). But step 4 becomes critical.

  The procedure cannot settle questions that require deep specialist knowledge or ongoing debates. It flags when to hand off to a specialist (step 6) or when the evidence is insufficient (stop at step 3 or 4). It also forces the pitch to address key critiques.

  In the three examples:
  - Pitch 1 (spicy food) fails because it doesn't show historical selection (and the trait might be cultural).
  - Pitch 2 (music) passes if it provides evidence for byproduct and against adaptation.
  - Pitch 3 (appendix) passes if it addresses current utility and explains why it's not an adaptation.

  The suspicion about symmetric weakness in debunkings: Yes, debunkings can be weak if they ignore current utility (step 2) or fail to consider that a trait might be an exaptation (step 4). The procedure forces both adaptationist and non-adaptationist pitches to meet similar standards of evidence.
answer: |-
  Below is a triage procedure designed for your editors, based on your specifications. It's structured as an ordered checklist with clear stopping points, distinctions between adaptive/non-adaptive explanations, and an accessibility check. The procedure prioritizes efficiency (20 minutes max), uses plain language, and flags when human judgment or specialist input is needed. Crucially, it preserves your key distinctions:  
  - **Current utility** (trait is useful now) vs. **historical selection** (trait evolved *for* that use).  
  - **Non-adaptive explanations**: Structural byproduct (no function), exaptation (co-opted later), or mismatch (adaptive in past, maladaptive now).  
  - **Accessibility check**: If a better variant is plausible but absent, the adaptive story must explain why.  

  Editors can stop at any "NO" answer (reject pitch) or "HAND BACK" (needs revision/expert input). You sign off on outcomes.  

  ---

  ### **Triage Procedure: Evaluating Trait Explanations**  
  **Time limit:** 20 minutes per pitch. Use reliable sources (e.g., peer-reviewed studies, textbooks, reputable science outlets).  
  **Goal:** Rule out low-quality adaptive claims while allowing strong ones and non-adaptive alternatives.  

  #### **Step 1: Trait and Function Clarity**  
  **Question:** Is the trait and its proposed adaptive function (or lack thereof) clearly defined?  
  - **Sufficient answer:** Trait is measurable (e.g., "preference for spicy foods" not "spiciness"). Function is specific (e.g., "kills gut microbes" not "improves health"). For non-adaptive pitches, the alternative (e.g., byproduct) is stated.  
  - **HAND BACK if:** Definitions are ambiguous (e.g., "music" without specifying rhythm or melody).  
  - **STOP if:** Trait/function is circular (e.g., "trait exists because it’s adaptive") or untestable.  
  - **Why?** Ensures the pitch is falsifiable.  

  #### **Step 2: Current Utility Check**  
  **Question:** Is there evidence the trait provides the *proposed benefit today*? (Skip if pitch argues for *no* function, e.g., pure byproduct.)  
  - **Sufficient answer:** At least one study showing the trait has the effect in a relevant context (e.g., lab experiments, field observations).  
  - **STOP if:** No evidence of current utility AND pitch claims the trait is an adaptation *for this function*.  
  - **OK if:** Utility exists but pitch argues it’s coincidental (e.g., exaptation) or mismatched.  
  - **Why?** Separates current use from historical origins.  

  #### **Step 3: Historical Selection Check**  
  **Question (for adaptive claims only):** Is there evidence the trait evolved *because of* the proposed function? (Skip if pitch is non-adaptive.)  
  - **Sufficient answer:** One or more of:  
    - **Comparative data:** Trait correlates with selective pressure across species (e.g., spicy plants in parasite-rich regions).  
    - **Fitness evidence:** Trait linked to survival/reproduction in ancestral-like conditions (e.g., fossil records, hunter-gatherer studies).  
    - **Genetic evidence:** Trait-associated genes show signatures of selection (e.g., rapid evolution, allele-frequency shifts).  
  - **STOP if:** No evidence beyond correlation AND pitch claims adaptation.  
  - **HAND BACK if:** Evidence is weak (e.g., single small-n study) or conflicts with known lineage history.  
  - **Why?** Tests if selection acted on the function.  

  #### **Step 4: Non-adaptive Alternatives Check**  
  **Question:** Does the pitch address plausible non-adaptive explanations?  
  - **Sufficient answer:** Pitch rules out or incorporates:  
    - **Structural byproduct:** Trait is a side effect (e.g., "human chin as a jaw-development spandrel").  
    - **Exaptation:** Trait was co-opted later (e.g., "feathers evolved for warmth, not flight").  
    - **Mismatch:** Trait was adaptive in past but not now (e.g., "sweet tooth in calorie-scarce environments").  
  - **STOP if:** Pitch claims adaptation but ignores obvious alternatives (e.g., doesn’t discuss if trait is a byproduct).  
  - **OK if:** Pitch argues *for* a non-adaptive explanation and provides evidence (e.g., brain scans showing music reuses language circuits).  
  - **Why?** Ensures cherry-picking adaptation isn’t the default.  

  #### **Step 5: Accessibility Check**  
  **Question (for adaptive claims only):** If a "better" variant of the trait is plausible (e.g., more efficient, less costly), why doesn’t it exist?  
  - **Sufficient answer:** Pitch explains absence using:  
    - **Trade-offs:** Better variant has costs (e.g., "spicier food damages gut lining").  
    - **Constraints:** Lineage can’t reach variant due to genetics/development (e.g., "no neural pathway for perfect pitch").  
    - **Neutrality:** Variant offers no fitness advantage.  
  - **STOP if:** Better variant is plausible, absent, and unexplained.  
  - **HAND BACK if:** Trade-offs/constraints are speculated without evidence (e.g., "it just wasn’t needed").  
  - **Why?** Filters "just-so stories" by demanding mechanistic plausibility.  

  #### **Step 6: Overall Consistency**  
  **Question:** Does the explanation conflict with established biology?  
  - **Sufficient answer:** No major contradictions (e.g., trait evolution timeline matches fossil records; no ignored genetic constraints).  
  - **HAND BACK if:** Contradicts consensus (e.g., "music evolved 50,000 years ago" vs. evidence of ancient flutes).  
  - **STOP if:** Relies on pseudoscience (e.g., group selection without evidence).  
  - **Why?** Uses basic biology to catch fatal flaws.  

  **Final Output:**  
  - **PASS:** All checks satisfied → Pitch is viable.  
  - **REVISE:** Hand-back triggers → Pitch needs clarification.  
  - **REJECT:** Stop triggers → Pitch is unsupported.  

  ---

  ### **Running the Procedure on Your Pitches**  
  Editors will use the above steps. I’ll simulate outputs honestly, noting where evidence is weak/strong and where the procedure can’t resolve debates.  

  #### **Pitch 1: Spicy food preference as an antimicrobial adaptation**  
  - **Step 1 (Clarity):** Trait = "human preference for consuming spicy foods"; function = "killing gut pathogens." Clear. → PASS  
  - **Step 2 (Current Utility):** Evidence capsaicin kills microbes *in vitro* and spices reduce food spoilage. Utility supported. → PASS  
  - **Step 3 (Historical Selection):** Comparative data shows spice use correlates with tropical climates (high pathogen load). No genetic evidence (preference is learned, not innate). Weak fitness evidence. → **HAND BACK** (needs evidence that preference was selected, not just cultural).  
  - **Step 4 (Non-adaptive):** Fails—pitch doesn’t address alternatives (e.g., byproduct of taste-bud stimulation; exaptation for social bonding). → **STOP** (adaptive claim ignores alternatives).  
  - **Accessibility Check (Step 5):** Not reached.  
  - **Verdict:** **REJECT** at Step 4. Procedure flags weak evidence for selection and missing non-adaptive discussion.  

  #### **Pitch 2: Music as a byproduct of other cognition (no adaptive function)**  
  - **Step 1 (Clarity):** Trait = "music perception/production"; function = "none (byproduct of language/pattern recognition)." Clear. → PASS  
  - **Step 2 (Current Utility):** Skipped (pitch argues no function). → N/A  
  - **Step 3 (Historical Selection):** Skipped (non-adaptive pitch). → N/A  
  - **Step 4 (Non-adaptive):** Pitch cites evidence: music reuses brain regions for language/emotion; no music-specific genes; variability in skill suggests weak selection. Rules out adaptation by noting lack of fitness benefits. → PASS  
  - **Step 5 (Accessibility):** Skipped (not adaptive claim). → N/A  
  - **Step 6 (Consistency):** Fits consensus (e.g., music as spandrel is debated but plausible). → PASS  
  - **Verdict:** **PASS**. Procedure supports non-adaptive pitch if evidence for byproduct is provided.  

  #### **Pitch 3: [Uncomfortable Example] "Male aggression is an adaptation for intrasexual competition"**  
  *(You noted debunkings often mock weak adaptationist claims but may lack evidence. This pitch exemplifies that risk.)*  
  - **Step 1 (Clarity):** Trait = "high aggression in males"; function = "winning mates/fights." Clear. → PASS  
  - **Step 2 (Current Utility):** Aggression correlates with mating success in some societies. Utility supported. → PASS  
  - **Step 3 (Historical Selection):** Comparative data (e.g., sexual dimorphism in primates) and fossil evidence (male trauma in hominids). Strongest evidence here. → PASS  
  - **Step 4 (Non-adaptive):** Pitch ignores alternatives: Could be byproduct of stress response, exapted from predation, or mismatched in modern contexts. → **STOP** (fails to address non-adaptive options).  
  - **Accessibility Check (Step 5):** Better variant? Less risky aggression (e.g., verbal dominance). Absence unexplained. → **STOP** (no trade-off/constraint discussed).  
  - **Verdict:** **REJECT** at Step 4 or 5.  
  **Why uncomfortable?** Your debunkings might reject this as "just-so," but the procedure rejects it for *specific gaps* (missing alternatives/accessibility). However:  
    - If revised to address these (e.g., "aggression has trade-offs like injury; alternatives ruled out by cross-cultural data"), it could pass.  
    - **Suspicion confirmed:** The procedure *does* treat adaptive and non-adaptive pitches symmetrically. Weak debunkings (e.g., dismissing adaptation without addressing Steps 3–5) would also fail.  

  ---

  ### **What the Procedure Can and Cannot Do**  
  - **Strengths:**  
    - Forces explicit evidence for historical selection (not just utility).  
    - Protects against "adaptationist bias" by demanding non-adaptive alternatives.  
    - Accessibility check preempts naive optimization assumptions.  
    - Distinguishes all your categories (byproduct/exaptation/mismatch).  
  - **Limitations:**  
    - **Cannot settle debates** requiring specialist knowledge (e.g., gene-trait links). Step 6 flags these for you.  
    - **Gray areas:** Exaptation vs. adaptation often hinges on timing (e.g., "was music *ever* selected?"). Editors hand these back.  
    - **False negatives:** May reject plausible-but-novel ideas if evidence is emerging (e.g., spicy-food genetics). You can override.  
  - **Editorial reality:** Pitches debunking adaptation often focus on Steps 2–4 (utility/alternatives) but skip Step 5 (accessibility). The procedure holds them to the same standard.  

  **Final recommendation:** Pair this with a shared "evidence rubric" (e.g., "comparative data = 2+ species; fitness evidence = ancestral context"). This ensures consistency across editors. Let me know if you’d like tweaks!
