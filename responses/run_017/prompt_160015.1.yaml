answer: |-
  Below are the core requirements for your aggregation function, phrased as unit tests where possible. Each requirement includes its rationale, negotiability, and conflicts. The requirements cover your specified cases (chunking, mixed valence, etc.) and address uncertainty.

  ### Requirements (Unit Tests & Rationale)
  1. **Chunking Invariance (Non-negotiable)**  
     - *Test*:  
       ```python  
       outcomeA = [ModeratePain(duration=60min)]  
       outcomeA_prime = [MildPain(duration=1min) for _ in range(60)]  # Same total pain, split  
       outcomeB = NeutralState(duration=60min)  
       assert compare(outcomeA, outcomeB) == compare(outcomeA_prime, outcomeB)  
       ```  
     - *Rationale*: Repartitioning identical experiences (e.g., splitting an hour of pain into minutes) must not change outcomes. Violations introduce arbitrariness.  
     - *Case covered*: Chunking.

  2. **Mixed Valence Netting (Negotiable)**  
     - *Test*:  
       ```python  
       outcomeA = [MixedExperience(pleasure=+3, pain=-2)]  # e.g., chili burn  
       outcomeB = [PurePleasure(+1)]  
       # If netting: assert compare(outcomeA, outcomeB) == EQUAL (since net +1)  
       # If two-axis: assert compare(outcomeA, outcomeB) == B_BETTER (pain avoidance priority)  
       ```  
     - *Rationale*: Forces a choice: net mixed experiences (e.g., +3 pleasure + -2 pain = +1) or treat pleasure/pain as separate dimensions. "Two-axis" often reflects pain-avoidance taste.  
     - *Case covered*: Mixed valence.

  3. **Non-Hedonic Exclusion (Negotiable)**  
     - *Test*:  
       ```python  
       outcomeA = [Boredom()]  # Non-hedonic state  
       outcomeB = [NeutralState()]  
       assert compare(outcomeA, outcomeB) == EQUAL  # Excluded from valence sum  
       # If included: assert compare(outcomeA, outcomeB) == B_BETTER  
       ```  
     - *Rationale*: Non-hedonic states (boredom, flow) must either be mapped to hedonic valence or excluded. Inclusion risks scope creep; exclusion simplifies but may overlook harms.  
     - *Case covered*: Non-hedonic valence.

  4. **Zero-Point Consistency (Non-negotiable)**  
     - *Test*:  
       ```python  
       outcomeA = NonExistence()  # e.g., death/neutral  
       outcomeB = DreamlessSleep()  
       outcomeC = NeutralAwake()  
       assert compare(outcomeA, outcomeB) == EQUAL  
       assert compare(outcomeA, outcomeC) == EQUAL  # Or define a consistent ordering  
       ```  
     - *Rationale*: Dreamless sleep, nonexistence, and neutrality must be explicitly ordered (e.g., all ≡ 0 valence). Silence causes undefined comparisons.  
     - *Case covered*: Zero point.

  5. **Pain Aggregation Threshold (Negotiable, reflects taste)**  
     - *Test*:  
       ```python  
       outcomeA = [SeverePain(intensity=-10, duration=1min)]  
       outcomeB = [MildPain(intensity=-0.01, duration=1000min)]  # Same integrated pain  
       # If linear: assert compare(outcomeA, outcomeB) == EQUAL  
       # If nonlinear: assert compare(outcomeA, outcomeB) == A_WORSE (intensity threshold)  
       ```  
     - *Rationale*: Must specify if pain aggregation is linear (intensity × duration) or nonlinear (e.g., intense pain dominates). Nonlinearity is often a "pain threshold" taste.  
     - *Case covered*: Aggregation inside pain.

  6. **Range-Relative Scaling (Negotiable)**  
     - *Test*:  
       ```python  
       mind1 = Human()  # Pain range: [0, -10]  
       mind2 = Alien()  # Pain range: [0, -100]  
       outcomeA = [mind1.Pain(intensity=-5)]  # -5 absolute, -50% relative  
       outcomeB = [mind2.Pain(intensity=-50)] # -50 absolute, -50% relative  
       # If absolute: assert compare(outcomeA, outcomeB) == A_BETTER  
       # If relative: assert compare(outcomeA, outcomeB) == EQUAL  
       ```  
     - *Rationale*: Valence must be scaled absolutely (fixed scale) or relatively (% of max pain/pleasure per mind). Absolute scaling favors high-range minds; relative is egalitarian.  
     - *Case covered*: Range differences across minds.

  7. **Dynamic Consistency (Non-negotiable)**  
     - *Test*:  
       ```python  
       lifeA = [Pain(-5), Pleasure(+10)]  # Net +5  
       lifeB = [Pleasure(+5), Pain(-0)]    # Net +5  
       # Moment-by-moment: A is worse at t0, better at t1  
       assert compare(lifeA, lifeB) == EQUAL  # Whole-life == sum of moments  
       ```  
     - *Rationale*: Ranking whole experiences must equal aggregating moment-by-moment valences. Violations imply temporal dependencies (e.g., order matters), complicating aggregation.  
     - *Case covered*: Dynamic consistency.

  8. **Continuity (Non-negotiable under uncertainty)**  
     - *Test*:  
       ```python  
       outcomeA = Pain(intensity=-9.99, duration=1hr)  
       outcomeB = Pain(intensity=-10.0, duration=1hr)  
       assert abs(score(outcomeA) - score(outcomeB)) < EPSILON  # No cliffs  
       ```  
     - *Rationale*: Small input changes (e.g., pain intensity near a threshold) must not flip verdicts. Essential for noisy inputs.  
     - *Case covered*: Prevents cliffs (linked to lexical thresholds).

  9. **Uncertainty Robustness (Non-negotiable)**  
     - *Test*:  
       ```python  
       // Inputs are distributions, not scalars  
       outcomeA = ValenceEstimate(mean=+5.0, stddev=1.0)  // E.g., 5 ± 1  
       outcomeB = ValenceEstimate(mean=+4.9, stddev=1.0)  
       assert compare(outcomeA, outcomeB) == A_BETTER  // Using mean/expected value  
       ```  
     - *Rationale*: Must output deterministic verdicts with probabilistic inputs (e.g., via expected value). Lexical rules break under uncertainty (e.g., 0.001% chance of hell dominates).

  10. **Monotonicity (Non-negotiable)**  
      - *Test*:  
        ```python  
        outcomeA = [Pleasure(+3), Pain(-1)]  
        outcomeB = [Pleasure(+3), Pain(-2)]  
        assert compare(outcomeA, outcomeB) == A_BETTER  // Strictly better at t1  
        ```  
      - *Rationale*: If all moments in A are ≥ B and one is strictly better, A must be better. Violations imply irrationality.

  ---

  ### **Key Conflicts**
  - **Lexical Pain vs. Continuity (R8) & Uncertainty (R9)**  
    Lexical thresholds (e.g., "any pain > X is infinitely bad") violate R8 (discontinuity at X) and R9 (0.001% risk of pain > X dominates). **Resolution**: Drop lexical thresholds or accept unreliability under noise.
    
  - **Lexical Pain vs. Pain Aggregation (R5)**  
    If pain has lexical thresholds, a billion mild headaches cannot outweigh one severe pain (violates linear R5). **Resolution**: Reject lexical pain or accept that mild pains never aggregate to outweigh intense suffering.

  - **Absolute vs. Relative Scaling (R6) & Symmetry**  
    Absolute scaling (R6) implies a high-range mind's mild pain outweighs a human's agony. Relative scaling avoids this but violates "equal treatment of equal absolute pains." **Resolution**: Choose based on ethical priorities (fairness vs. objectivity).

  ---

  ### **Most Discriminating Requirement**  
  **Continuity (R8)**  
  - **Knocks out**: All lexical threshold theories (e.g., negative utilitarianism with "infinite disvalue" for extreme pain) and two-axis lexicographic theories (e.g., "minimize pain first, then maximize pleasure").  
  - **Why**: Noise makes exact thresholds meaningless; a 0.001% measurement error flips verdicts near thresholds, violating robustness (R9).

  ---

  ### **Theory Scorecard (5 Lines Max)**  
  1. **Plain Hedonism (Sum valence)**:  
     ✅ Chunking, Zero-Point, Dynamic, Monotonicity  
     ❌ Fails Continuity if thresholds added; negotiable R2/R3/R5/R6.  

  2. **Lexical Threshold NU**:  
     ✅ Pain priority (R2 two-axis), Zero-Point  
     ❌ Fails Chunking (if thresholds duration-sensitive), Continuity (R8), Uncertainty (R9), Dynamic (if order matters).  

  3. **Two-Axis (Pain-Lex Priority)**:  
     ✅ Handles mixed valence (R2), Symmetry  
     ❌ Fails Continuity (R8: discontinuity at zero pain), Uncertainty (R9).  

  4. **Weighted Negative-Leaning**:  
     ✅ Continuity, Uncertainty, Dynamic, Monotonicity  
     ❌ Fails Range-Relativity (if absolute); negotiable R2/R3/R5/R6.  

  **Recommendation**: Weighted negative-leaning sum (e.g., `total = Σ(pleasure + k * pain)` with `k > 1`). It satisfies non-negotiable requirements (R1, R4, R7–R10) and allows tuning negotiable ones (R2, R3, R5, R6) to taste. Avoid lexical rules—they break under uncertainty.
