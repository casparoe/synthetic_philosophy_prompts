prompt: |-
  hey — I'm a backend dev with no philosophy training (took one ethics class in undergrad, got a C, mostly remember the trolley thing). I'm writing the scoring module for a project that has to rank possible outcomes by how good or bad the experiences inside them are: hand it two outcome descriptions, get a verdict. The inputs are noisy — I get valence estimates with error bars, not exact numbers — and I can't tell in advance whether I'm comparing two lives, two populations, or one life against itself at different times. So the purpose is fixed: a rule good enough to ship as a comparator under uncertainty and measurement error, not a theory of what's right in the abstract.

  Before I commit to an aggregation rule I want a spec. What does a theory of how pleasures and pains combine into one verdict have to deliver to count as usable for that? I want the requirements, not the provenance, so please don't give me a reading list or paper titles — I can't get them and they'd be noise.

  What I'm after:

  1. Ten or so requirements, each with the concrete case behind it. Where a requirement is really a property of the function, phrase it as a unit test I could write: input (two outcome descriptions), expected verdict or expected relation between verdicts. One line of pseudocode is fine if that's clearer than prose.
  2. Mark each requirement non-negotiable versus negotiable for my purpose, and call out the ones that are really just one camp's taste dressed up as a requirement.
  3. Tell me which subsets of the requirements can't all be satisfied together. I've got two suspicions already: (a) lexical priority for pain above some threshold versus not having a cliff where a sub-1% change in an input flips the verdict; (b) lexical priority versus deciding under uncertainty, where an arbitrarily small probability of threshold-crossing pain seems to have to dominate a certain large improvement. Find the collisions I haven't thought of, and say what has to give in each.
  4. Name the single requirement that knocks out the most candidate theories, and what exactly it knocks out.

  Cases I want covered somewhere in the list, since these are the ones that break the naive sum-the-valence version:

  - chunking: splitting an hour of moderate pain into sixty one-minute slices, or merging sixty mild pleasures into one episode, shouldn't change the verdict just because I repartitioned the input. If your theory needs a smallest value-bearing unit, say what it is and why that isn't arbitrary.
  - mixed valence: one experience that is pleasant and unpleasant at once — chili burn, a hard climb, grief you would not give up. Does the theory net it into one number or keep two axes, and what test separates those?
  - non-hedonic valence: states that matter but aren't exactly pleasure or pain — boredom, exhaustion, flow, confusion. Is the theory supposed to score those or is that out of scope, and what breaks each way?
  - the zero point: where do dreamless sleep, nonexistence, and plain neutrality sit, and must a theory say, or may it stay silent there?
  - aggregation inside pain: do a million mild headaches ever amount to one severe pain, and is any threshold on intensity, on total, or on something else?
  - range differences across minds: a mind whose worst possible pain is ten times the worst human pain, or one that can't feel pain at all. Absolute threshold or mind-relative one?
  - dynamic consistency: does ranking whole lives give the same answer as choosing moment by moment?

  Then a short scorecard — five lines, no more — for plain sum-the-valence hedonism, lexical-threshold negative utilitarianism, a two-axis view with pain lexicographically prior, and a weighted negative-leaning view. The list is the deliverable; the scorecard is just so I can check I read the list right.
reasoning: |-
  We are designing a scoring module that compares two outcomes based on the experiences within them. The inputs are noisy valence estimates with error bars. The outcomes can be lives, populations, or the same life at different times.

  We need to define requirements for the aggregation function. Each requirement should be stated as a unit test (pseudocode) where possible, marked as non-negotiable or negotiable, and note if it's a matter of taste.

  We also need to identify conflicts between requirements and the requirement that eliminates the most candidate theories.

  We have specific cases to cover: chunking, mixed valence, non-hedonic valence, zero point, aggregation inside pain, range differences, and dynamic consistency.

  Let's break down the requirements:

  1. **Chunking Invariance (Temporal Invariance)**
     - Description: The way we partition time should not affect the verdict. Splitting an hour of pain into 60 minutes or merging 60 small pleasures into one hour should not change the outcome comparison.
     - Test: 
          Let outcome A have one hour of moderate pain (intensity -5, duration 1 hour).
          Let outcome A' have 60 one-minute slices of the same pain (each intensity -5, duration 1 minute).
          Let outcome B be a neutral state (intensity 0, duration 1 hour).
          Then, compare(A, B) should equal compare(A', B).
     - Non-negotiable: Yes. This is fundamental to avoid arbitrary results due to partitioning.
     - Note: This implies that the aggregation must be linear in duration (or more generally, additive over time) for constant intensity. If the theory requires a smallest unit, it must be justified (e.g., by the nature of experience) and not arbitrary.

  2. **Mixed Valence Handling**
     - Description: The theory must handle experiences that are both pleasant and unpleasant at the same time. It must either net them into one number or use two axes. We need a test to distinguish.
     - Test case: 
          Outcome A: an experience with pleasure +3 and pain -2 (net +1? or two separate?).
          Outcome B: a purely pleasant experience +1.
          If the theory nets, then A and B are equal (if net is same). If two axes, then they might be incomparable or compared by a rule (e.g., lexicographic on pain first?).
          We can have:
              A: {pleasure: 3, pain: 2} -> net 1
              B: {pleasure: 1, pain: 0} -> net 1
              Then compare(A, B) should be equal if netting, but if using two axes and having a rule that avoids negative components, then B might be better.
          Alternatively, test with:
              A: pleasure 10, pain 1 (net 9)
              C: pleasure 0, pain 0 (neutral)
              D: pleasure 9, pain 0 (net 9)
              If netting, then compare(A, D) = equal. But if the theory gives priority to avoiding pain, then D might be better than A.
          We need a requirement that specifies how mixed valence is treated. We can have two requirements:
          - Option 1 (Netting): The theory must assign a single net valence to each moment. Then the test: 
                outcome_mixed = {valence_pleasure: x, valence_pain: y} -> net = f(x,y) (e.g., x+y)
                outcome_pure = {valence: z}
                Then the comparison uses net.
          - Option 2 (Two axes): The theory must compare on two dimensions with a specific rule (e.g., lexicographic: minimize pain first, then maximize pleasure). Then the test:
                outcomeA: pain=1, pleasure=10
                outcomeB: pain=0, pleasure=9
                Then compare(outcomeA, outcomeB) = B is better (because pain in A is worse even though pleasure is higher) if lexicographic on pain.
          This requirement is negotiable because the choice between netting and two axes is a design decision. However, the theory must specify which one it uses and be consistent.

  3. **Non-Hedonic Valence Inclusion**
     - Description: The theory must decide whether non-hedonic states (boredom, flow, etc.) are in scope. If in scope, how are they scored? If out of scope, what breaks?
     - Test: 
          Outcome A: one hour of boredom (which might be assigned a negative valence, say -2) 
          Outcome B: one hour of neutral (0)
          If the theory includes non-hedonic states, then compare(A, B) should say B is better. If not, then the boredom state might be ignored and A and B are equal (or an error?).
          Also, what about flow (positive)? 
          This is negotiable: it depends on the scope of the project. However, the requirement must be clear: either the theory must cover all valence-bearing states (including non-hedonic) or it must exclude them. If excluded, then the input should not include them or they are treated as neutral.

  4. **Zero Point Definition**
     - Description: The theory must define what the zero point is (neutral) and where non-existence, dreamless sleep, etc., lie relative to it.
     - Test:
          - Dreamless sleep: no experiences. How does it score? (e.g., 0? or undefined? or the same as non-existence?)
          - Non-existence: often considered as having no experiences and thus no valence. How does it compare to a neutral experience (0)? 
          - Requirement: The theory must assign a value to an outcome with no experiences (or define it as neutral). 
          Example test: 
              Outcome A: non-existence (or dreamless sleep) -> value = 0?
              Outcome B: a neutral waking experience -> value = 0?
              Then compare(A, B) should be equal? Or might some theories say non-existence is not comparable? 
          This is non-negotiable: the theory must handle the absence of experiences. However, the specific assignment (0 or a special value) is negotiable but must be consistent.

  5. **Aggregation of Pain (or Pleasure) Across Intensity and Time**
     - Description: The theory must specify how pains of the same intensity aggregate over time and how pains of different intensities compare (e.g., does a million mild headaches equal one severe pain?).
     - Test: 
          Let outcome A: one person with one severe pain (intensity -100, duration 1 minute).
          Let outcome B: one person with 100 mild pains (intensity -1, duration 1 minute each) in 100 minutes (so total duration 100 minutes, but note the time factor).
          But note: we have duration and intensity. We must account for time. 
          Alternative: same duration? 
          Outcome A: 1 minute at -100.
          Outcome B: 100 minutes at -1. Total pain in A: -100, in B: -100? Then if we just sum (intensity*duration) they are equal. But is that acceptable? 
          Some theories might have a nonlinear transformation (e.g., disvalue increases more than linearly with intensity). Then:
              Let f be a transformation: f(intensity, duration) = intensity^2 * duration? Then A: (-100)^2 * 1 = 10000, B: (-1)^2 * 100 = 100 -> A is worse.
          Requirement: The theory must specify the functional form for aggregating over intensity and time. 
          Test: 
              outcomeA: one second of pain at intensity -10 (on a scale where -10 is the worst)
              outcomeB: 10 seconds of pain at intensity -1
              Then, compare(outcomeA, outcomeB) should return A is worse? or B is worse? or equal? 
          This is negotiable: the choice of functional form (linear vs. nonlinear) is a design decision. But the requirement is that the function must be defined and consistent.

  6. **Range Differences (Absolute vs. Mind-Relative)**
     - Description: The theory must decide whether to use absolute thresholds or mind-relative scales when comparing beings with different ranges of experience.
     - Test:
          Let Mind1: human, worst pain = -10.
          Let Mind2: alien, worst pain = -100 (so 10 times worse than human worst).
          Now, a pain of -5 in Mind1 and -50 in Mind2: which is worse? 
          Absolute: the alien's -50 is worse (because -50 < -5). 
          Mind-relative: -5 in Mind1 is 50% of the worst, -50 in Mind2 is 50% of its worst -> equal? 
          Requirement: The theory must specify whether the valence scale is normalized per individual (or per type of mind) or absolute. 
          Test case: 
              Outcome A: Mind1 experiences -5 (which is -5 on an absolute scale, or normalized to -0.5 if scaled by 10?).
              Outcome B: Mind2 experiences -50 (absolute) or normalized to -0.5 (if scaled by 100).
              If absolute, then compare(A, B) -> B is worse. If normalized, then they are equal.
          This is negotiable: both are defensible. But the requirement is that the theory must choose one and be consistent.

  7. **Dynamic Consistency (Time Consistency)**
     - Description: The ranking of whole lives should be consistent with the ranking of moments if the aggregation is done step by step. 
     - Test:
          Consider two lives:
            Life1: [moment1: +5, moment2: -5] -> total 0.
            Life2: [moment1: 0, moment2: 0] -> total 0.
          But if we compare moment by moment, at moment1: Life1 is better, at moment2: Life2 is better. 
          However, the requirement is about the overall ranking. 
          But note: if the aggregation is additive, then both lives are equal. But what if the aggregation is not additive? For example, if the order matters (a happy ending might be better). 
          So the requirement: 
              If the aggregation function is additive over time (like sum), then the whole life is the sum of moments. But if not, then the theory must specify the aggregation rule and it must be consistent with the time structure.
          We can require that the function is additive over disjoint time intervals. Then:
              Let outcome A: two consecutive time intervals, [t0, t1] and [t1, t2] with valences v1 and v2.
              Let outcome A': the entire interval [t0, t2] with valence v (which must equal v1+v2? or not?).
              Then, for any outcome B, compare(A, B) should be the same as compare(A', B).
          This is non-negotiable? Not entirely: some theories might argue for temporal holism (e.g., the same pain is worse if it comes after a pleasure). But for simplicity and to avoid complexity, we might require additivity. However, note that chunking invariance already requires additivity over time for constant intensity. So if we have chunking invariance, then we require that the value of a time interval is the integral (or sum) of the moment-by-moment values. 
          So we can consider this covered by chunking invariance? Not exactly: chunking is about repartitioning the same experience. Dynamic consistency is about the aggregation rule being linear. So we can state:
          - Requirement: The value of an outcome over a time interval is the sum (or integral) of the values of its subintervals. 
          Test: 
              outcome A: [0,2] with constant valence v -> total = 2v.
              outcome A1: [0,1] with valence v and [1,2] with valence v -> total = v + v = 2v.
              Then compare(A, A1) must be equal? Actually, they are the same outcome. 
          But for two different outcomes, we require that the aggregation is linear. So non-negotiable? It depends: if we want to avoid time-dependent effects, then yes. But if we allow for temporal effects (like discounting), then no. 
          Since the problem says "no philosophy training", and we are under uncertainty, I think we require linearity (additive over time) to keep it simple. So non-negotiable.

  8. **Monotonicity in Valence**
     - Description: If every moment in outcome A is at least as good as the corresponding moment in outcome B (and at least one is strictly better), then A should be better than B. 
     - Test: 
          Outcome A: [1, 2, 3] (valences at three time points)
          Outcome B: [1, 1, 3]
          Then A should be better than B? But note: the time points must be aligned? What if the durations are different? 
          More generally: if the set of experiences in A is the same as in B except that some experiences in A are better (and none worse) than in B, then A is better. 
          This is non-negotiable: it's a basic consistency requirement.

  9. **Symmetry/Anonymity**
     - Description: The identity of the experiencer doesn't matter. Only the distribution of experiences matters. 
     - Test: 
          Outcome A: person1 has experience +5, person2 has 0.
          Outcome B: person1 has 0, person2 has +5.
          Then compare(A, B) should be equal.
          Non-negotiable: if we are aggregating across individuals, then we should not privilege one over the other. However, note that if the outcomes are for the same person at different times, then we are comparing time slices. But the problem says we don't know if it's one life or two. So we must design for both. 
          Actually, the requirement: the aggregation rule should be symmetric across individuals and across time points? 
          We can require: the value of a set of experiences (without labels) is the same regardless of who or when they occur. So we aggregate without regard to identity or time. 
          But then we lose the possibility of discounting by time or priority to worse-off individuals? 
          Since the problem says "how good or bad the experiences inside them are", it suggests we care only about the experiences, not who has them or when. So non-negotiable.

  10. **Continuity (Avoiding Lexical Cliffs)**
      - Description: A small change in the input should not cause a large change in the output. This avoids the threshold effects. 
      - Test:
            Outcome A: a population of 1000 people, each with a pain of intensity -9.9 (on a scale where -10 is the worst) and duration 1 hour.
            Outcome B: a population of 1000 people, each with a pain of intensity -10 and duration 0.99 hours (so total pain per person: -10*0.99 = -9.9, same as A?).
            But if we have a lexical threshold at -10, then any amount of pain at -10 (no matter how short) is worse than any amount of pain above -10. Then B would be worse than A. But the total pain per person is the same. 
            Alternatively, if we lower the intensity in A by a tiny bit: 
            Outcome A: pain at -9.999
            Outcome B: pain at -10
            Then if lexical, B is worse. But if we use a continuous function, then they are almost the same.
            Requirement: The aggregation function should be continuous in the valence inputs? 
            However, note: we have error bars. If we have a lexical threshold, then under uncertainty, an arbitrarily small chance of crossing the threshold might dominate. 
            This requirement is negotiable: some theories (like lexical negative utilitarianism) require thresholds. But for our purpose (noise and error bars), we might want to avoid cliffs. So non-negotiable? The problem asks for a rule that works under uncertainty. So we might require that the function is continuous to avoid hypersensitivity to noise.

  11. **Handling Uncertainty (Probabilistic Inputs)**
      - Description: The inputs are valence estimates with error bars. The rule must be robust to small errors. 
      - Test: 
            Outcome A: valence = 5 ± 1
            Outcome B: valence = 4 ± 1
            Then, the verdict should be that A is better than B? But note that there is overlap. 
            We require that if the error bars don't overlap, the verdict is clear. If they do, then we might need to return "incomparable" or a probability? But the spec says: get a verdict. So we must have a rule that aggregates the uncertainty. 
            How about: the function must be such that the expected value (or some other robust statistic) can be used? 
            Requirement: The aggregation rule must be defined for probability distributions over valences and must be monotonic in the sense that if the distribution of A first-order stochastically dominates that of B, then A is better. 
            Alternatively, we might require that the rule is linear in the valences so that the expectation can be taken. 
            But note: if we have a lexical threshold, then even a tiny probability of a very bad pain can dominate. 
            This is non-negotiable: we must handle error bars. We can do: 
              - Compute the expected aggregate value for each outcome and compare those. 
            But then lexical thresholds break because they are discontinuous. 
            Therefore, we must avoid lexical thresholds if we want to handle uncertainty by expectation.

  Now, conflicts:

  - **Conflict 1: Lexical Priority vs. Continuity and Handling Uncertainty**
    - Lexical priority (e.g., any pain above threshold T, no matter how short, is worse than any amount of pain below T) leads to a discontinuity at T. 
    - Under uncertainty, if there's a chance (even very small) that the pain in one outcome exceeds T, then that outcome might be considered worse even if the expected value is much better. 
    - What must give: For our purpose (noise and error bars), we might have to drop lexical priority and require continuity. 

  - **Conflict 2: Lexical Priority vs. Aggregation of Pain (and Chunking)**
    - Example: 
          Outcome A: one second of pain at intensity T (the threshold) -> very bad.
          Outcome B: a million seconds of pain at intensity T-epsilon -> by chunking, we can aggregate as a large total pain. 
          But if we have lexical priority, then A is worse than any amount of pain below T. 
          But if we also require that a sufficient amount of mild pain can be worse than a small amount of severe pain, then we have a conflict. 
    - What must give: We must choose either lexical thresholds or continuous aggregation (like summing). 

  - **Conflict 3: Absolute vs. Mind-Relative Scaling and Symmetry?**
    - Not a direct conflict, but note: if we use absolute scaling, then a being with a wider range of pain might dominate the evaluation. For example, a single alien with a pain of -100 might outweigh a thousand humans with pain -1. 
    - If we use mind-relative, then we treat all beings equally in terms of their own scale. 
    - There's no logical conflict, but the choice has big implications. 

  The requirement that knocks out the most candidate theories: 
    **Continuity (Requirement 10) and Handling Uncertainty (Requirement 11) together knock out any theory with lexical thresholds.** 
    Because they require that the function is continuous and that we can take expectations, but lexical thresholds are discontinuous and lead to dominance by worst-case scenarios under uncertainty.

  Now, let's list the requirements in a table:

