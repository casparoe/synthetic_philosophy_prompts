  | R7 | Dynamic Consistency (Additivity over Time) | `outcomeA = [ [0,1]: v1, [1,2]: v2 ]`; `outcomeA_prime = [ [0,2]: v1+v2 ]`; `assert for any B, compare(A, B) == compare(A_prime, B)` | Non-negotiable | Linearity in time. |
