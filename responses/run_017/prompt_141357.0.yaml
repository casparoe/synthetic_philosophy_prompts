  Okay, the user wants a parody bureaucratic form for their department newsletter. They work in comparative cognition, studying animals like corvids, octopuses, and a smart border collie. Recently, they had to fill out "cognitive capacity" paperwork for each animal, which inspired this idea. They also mentioned a journal club discussing a four-way taxonomy of minds: Darwinian, Skinnerian, Popperian, and Gregorian grades. 

  The user's request is very detailed. They want a form that mimics real government/IRB documents—deadpan, bureaucratic, with numbered sections and fine print. The humor should come from the taxonomy being applied literally, with each section highlighting its inherent flaws. For example:
  - Darwinian section: Questions no Darwinian creature could answer or need
  - Skinnerian section: Focused on costs—who pays for trials, how many are needed
  - Popperian section: Admitting that internal models are built by selection/reinforcement, so no true guard
  - Gregorian section: Falling apart when tools are allowed, leading to regress

  Specific inclusions they want:
  - Provisional (tool-dependent) status with demotion clause
  - Appeals for cases where hypotheses come from external sources (trainer, textbook, etc.)
  - Must stay in-universe, never wink at the reader
  - Use American English

  Deep needs analysis:
  They’re venting about bureaucratic absurdity via humor. The form should feel authentic—like a real compliance document—while exposing how these grades crumble under scrutiny. No preaching; the irony must speak for itself. They’re also subtly critiquing reductionist approaches to measuring cognition. 

  Structure plan:
  1. **Header**: Official-sounding title, ID numbers, compliance notices.
  2. **Sections 1-4**: Each grade’s criteria, escalating in complexity.
  3. **Section 5**: Provisional status and demotion clauses.
  4. **Section 6**: Appeals process for external hypothesis sources.
  5. **Signature block**: With absurd certifications.

  Key jokes per section:
  - **Darwinian**: Requiring self-description of learning (impossible for them).
  - **Skinnerian**: Cost tables and "who bears the error cost."
  - **Popperian**: Fine print admitting the model’s origins (*"Note: Internal models themselves..."*).
  - **Gregorian**: Tool loopholes causing infinite regress (*"List all tools used..."*).
  - **Provisional status**: The "closed-tools regrade" trap.
  - **Appeals**: Blurring responsibility (*"external hypothesis-generating entity"*).

  Tone: Dry, smug bureaucracy. No breaks in character. American English (e.g., "behavior," not "behaviour").

  Word count: Target ~800 words. Will balance sections evenly.
answer: |-
  ## OFFICE OF COGNITIVE CAPACITY STANDARDS  
  APPLICATION FOR REGRADE / COGNITIVE CAPACITY ASSESSMENT  
  Form OCCS-114b (Rev. 9/2023)  

  **Notice of Compliance:** Submission of this form constitutes acknowledgment of the Board’s authority under Statute 7-405.11(c) and Agreement IRB-MIND-004. Failure to provide complete, verifiable responses may result in automatic assignment to Darwinian Grade (Baseline) or administrative suspension of experimental privileges. All fields mandatory unless marked *Optional*.  

  ---

  ### SECTION 1: APPLICANT INFORMATION  
  1.1. **Subject Designation:** *(e.g., Corvus brachyrhynchos #7, Octopus bimaculoides "Inky," Canis lupus familiaris "Baxter")*  
  1.2. **Current Assigned Cognitive Grade:** ☐ Darwinian ☐ Skinnerian ☐ Popperian ☐ Gregorian ☐ Provisional (Specify:______________)  
  1.3. **Requested Regrade:** ☐ Skinnerian ☐ Popperian ☐ Gregorian *(Note: Requests for demotion require Form OCCS-114c)*  
  1.4. **Justification for Regrade:** *(Attach supplemental documentation. Max. 50 words.)*  

  ---

  ### SECTION 2: DARWINIAN GRADE ASSESSMENT  
  *(Complete ONLY if requesting upgrade FROM Darwinian Grade OR if current grade is Provisional.)*  
  2.1. Describe in detail a novel environmental challenge encountered by the subject within its lifetime that could not have been anticipated by ancestral selective pressures.  
  2.2. Attach evidence demonstrating the subject’s conscious awareness that its behavioral repertoire is genetically fixed. *(e.g., signed affidavit, neural scan logs)*  
  2.3. Explain how the subject benefits from this awareness given its inability to modify behavior.  
  > ***Fine Print 2.3a:*** *"Benefit" must not invoke selective advantage at the population level, as this contradicts the definition of Darwinian cognition (Ref. OCCS Taxonomy Primer, Sec. 2.1).*  

  ---

  ### SECTION 3: SKINNERIAN GRADE ASSESSMENT  
  *(Complete ONLY if requesting upgrade TO/FROM Skinnerian Grade OR if Skinnerian competencies are contested.)*  
  3.1. **Operant Conditioning Protocol Summary:**  
      - a) Reinforcer(s) employed: _______________________  
      - b) Cost per reinforcer unit (USD): $_________  
      - c) Entity bearing reinforcer cost: ☐ Principal Investigator ☐ Grant ☐ Subject *(specify physiological cost):*__________  
  3.2. **Error Cost Accounting:**  
      - a) Mean trials to acquisition of novel task: _________  
      - b) Mean errors per trial: _________  
      - c) Total resource expenditure during training (USD): $_________ *(Include labor, materials, subject opportunity cost)*  
  3.3. Attach certification that all learned behaviors demonstrably emerged *exclusively* through direct reinforcement history, not internal simulation.  
  > ***Fine Print 3.3a:*** *If error rates during training exceeded 15%, the Board reserves the right to reclassify learning as "selection under duress," invalidating Skinnerian claims (Ref. OCCS Decision 114b-22, "Parrot vs. Board").*  

  ---

  ### SECTION 4: POPPERIAN GRADE ASSESSMENT  
  *(Complete ONLY if requesting upgrade TO/FROM Popperian Grade.)*  
  4.1. Describe the subject’s internal modeling architecture. *(Diagrams must be notarized.)*  
  4.2. Provide three (3) independent instances where the subject rejected a viable action *without physical trial*, based solely on simulated negative outcome.  
  4.3. Submit logs proving the subject’s model generated *and falsified* hypotheses without external cueing.  
  > ***Fine Print 4.3a:*** *Note: Internal models themselves constitute behavioral phenotypes shaped by Darwinian selection and/or Skinnerian reinforcement histories. The Board does not assess the ontology of models, only their operational utility during the assessment period (Ref. OCCS Circular 89-G).*  

  ---

  ### SECTION 5: GREGORIAN GRADE ASSESSMENT  
  *(Complete for ALL requests involving Gregorian classification.)*  
  5.1. **Tool-Dependent Cognition Declaration:**  
      ☐ Provisional (Tool-Dependent) status requested  
      ☐ Full Gregorian status requested *(Requires Closed-Tools Regrade Hearing, Sec 5.4)*  
  5.2. **Exogenous Cognitive Tool Inventory:** *(Attach separate sheet if needed)*  
      - a) Symbolic systems used (e.g., language, math): _______________________  
      - b) Physical artifacts used (e.g., puzzles, screens): _______________________  
      - c) Social scaffolds (e.g., trainers, conspecific collaborators): _______________________  
  5.3. **Tool-Independent Baseline Submission:**  
      Describe the subject’s cognitive capacities with *all tools listed in 5.2 removed*. *(If no capacities remain, Provisional status is mandatory.)*  
  5.4. **Closed-Tools Regrade Hearing Clause:**  
      ☐ Applicant consents to mandatory reassessment within 24 months under tool-deprived conditions. Failure to maintain Popperian-level performance without tools will result in automatic demotion.  
  > ***Fine Print 5.4a:*** *Gregorian status relies on tools whose development involved Darwinian, Skinnerian, and Popperian processes in their creators. The Board takes no position on distributed cognition or extended mind hypotheses.*  

  ---

  ### SECTION 6: APPEALS & EXTERNAL HYPOTHESIS GENERATORS  
  *(Complete if hypotheses tested by subject originated externally.)*  
  6.1. **Source of Candidate Hypotheses:**  
      ☐ Human Trainer ☐ Algorithmic Model ☐ Conspecific ☐ Text/Media ☐ Other: __________  
  6.2. **Attestation of Hypothesis Ownership:**  
      The undersigned certifies that the subject:  
      ☐ Generated hypotheses independently  
      ☐ Selected hypotheses from a curated set provided by an external entity *(Complete 6.3)*  
  6.3. **External Entity Contribution Form:** *(Submit one per entity)*  
      - a) Name/ID of hypothesis-generating entity: _______________________  
      - b) Cognitive Grade of entity: ☐ Darwinian ☐ Skinnerian ☐ Popperian ☐ Gregorian  
      - c) Justify why credit for error avoidance resides with the *subject*, not the entity.  
  > ***Fine Print 6.3c:*** *If the external entity possesses a higher Cognitive Grade than the subject, the Board may assign co-grading or outsource the assessment to the entity’s governing jurisdiction (Ref. Statute 7-405.11f).*  

  ---

  ### CERTIFICATION  
  I affirm under penalty of perjury (USC 18 § 1001) that the information provided is accurate. I understand that misrepresentation may void research permits and incur sanctions under the Animal Cognitive Welfare Act.  

  *Signature of Principal Investigator:* _________________________ *Date:* _________  
  *Printed Name:* __________________________________________  
  *Institutional Affiliation:* ________________________________  

  ---

  **OFFICE USE ONLY**  
  Assigned Grade: ☐ Darwinian ☐ Skinnerian ☐ Popperian ☐ Gregorian ☐ Provisional (Tool-Dep.)  
  Regrade Fee: $475 (Waived ☐)  
  Next Closed-Tools Hearing: _________  
  **Assessment Notes:** *Per Sec 5.2c, social scaffolding (trainer Dr. Aris Thorne) invalidates claim for Full Gregorian. Provisional (Tool-Dep) granted pending Sec 5.4 reassessment. Sec 6.3 unresolved re: statistical software origin of hypotheses – applicant must resubmit with vendor’s cognitive certification.*  

  ---  
  *Form satisfies OMB Control No. 0990-0456. Public reporting burden: 40 hours per subject. Penalties apply for recreational use. Duplication prohibited.*
