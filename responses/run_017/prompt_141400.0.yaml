  1. **Your split-group design**: Forces social confrontation of divergent interpretations. *Risk*: Requires precise item engineering.  
  2. **Individual sequential reframing**: Participants classify items one-by-one; later items redefine earlier ones. *Why reject*: Less visceral than group conflict; hostile players disengage.  
  3. **Live category negotiation**: Two teams debate boundaries of a vague term (e.g., "microservice"). *Why reject*: Hostile participants dismiss as "just semantics"; no controlled surprise.  

  **Chosen Mechanism & Tradeoff**  
  Stick with your split-group core because the moment Group A sees Group B's "obvious" verdicts—*using the same rule*—creates irreducible cognitive dissonance. We sacrifice proving *all* categorization is analogical (impossible in 90 mins) to show that *even rule-following* is example-driven.  

  **Why This Works**  
  - **Probe 7 (lazy stream)**: Reframes "data structure" after earlier bets, making confidence feel arbitrary.  
  - **Glimwacket**: The bet creates skin in the game; the reveal breaks essences *they chose*.  
  - **Analogy ladder**: "xyz → ?" exposes immediate pattern-matching before reasoning.  

  **Constraints Honored**  
  - **90 mins**: Cut probe items to 7; keep analogy ladder to 5 mins.  
  - **18 people**: Groups of 9 manageable with consensus phase.  
  - **No pre-theory**: Jargon only *after* the glimwacket trap.  

  **Hostile Participant Hack**  
  If they say "This just means rules suck," retort: "Exactly—so why do we *feel* they’re objective? That’s the analogy engine hiding."  

  **Weak Claim Admitted**  
  This shows categorization *in ambiguous contexts* is analogical—not that every act of seeing a chair is. But that’s the hook for the strong claim. Run it as-is.
