  We are designing a 90-minute session for 14-18 software engineers to experience the strong claim that categorization is analogical and context-dependent, using interactive exercises. The core mechanism proposed is splitting the room into two groups, giving each the same rule but different examples, and having them classify probe items to reveal divergent interpretations. We'll also include a one-shot category exercise and a letter-string analogy ladder.

  After brainstorming three mechanisms:
  1. The proposed split-group rule application with divergent examples (as described).
  2. A sequential decision-making game where each participant classifies items one by one, with later items reframing earlier ones, but this may not show group divergence as vividly.
  3. A collaborative category-building exercise starting from one example, then revealing a counterexample, but this might be too obvious and less surprising.

  We choose Mechanism 1 because it directly creates a conflict between two groups applying the same rule differently, making the phenomenon social and undeniable. We give up the opportunity for individual reframing over time (which Mechanism 2 offers) for the power of immediate group contrast.

  We also incorporate:
  - A one-shot category exercise to show how a single example creates an essence that is then broken.
  - A short ladder of letter-string analogies to illustrate how framing affects analogy.

  Constraints: 90 minutes, 18 people max, no pre-theory, avoid jargon until after experience.

  The session structure:
  1. Introduction (5 min): Set the stage without theory.
  2. Rule Application Exercise (45 min): Split into two groups, train with rules and examples, classify probes, then reveal differences.
  3. One-Shot Category (15 min): Whole group, one example, predict what else is in the category, then reveal counterexample.
  4. Analogy Ladder (10 min): Quick individual letter-string analogies to feel framing shift.
  5. Debrief (15 min): Connect experiences to the thesis and engineering.

  We must engineer probe items that:
  - Have at least two underdetermined by rule text.
  - One trap item where a vivid example pulls against the rule.
  - One late item that reframes the category.

  We'll design a scoring system with points for calibrated confidence (using a quadratic scoring rule).

  Now, we design in JSON as requested.

  Note: We assume the room can be split into two groups of 7-9 each. The layout is two tables or clusters.

  We'll create a fictional category: "Flumpets" (a type of data structure in a made-up language). The rule is abstract, and the examples are concrete but divergent.

  Rule text: "A Flumpet is a data structure that encapsulates multiple values and has at least one transformation operation that returns a new Flumpet."

  Group A examples: 
    - Example 1: A list with a map function (returns a new list).
    - Example 2: A tree with a recursive map function.
    - Example 3: A stack with a function that returns a reversed stack.

  Group B examples:
    - Example 1: A set with an add function (returns a new set).
    - Example 2: A dictionary with a function that filters keys (returns a new dictionary).
    - Example 3: A queue with a function that dequeues and returns a new queue without the first element.

  Probe items (8 items):

  1. An array with a sort method that sorts in-place (rule says "returns a new Flumpet", so not a Flumpet) -> trap for Group A if they focus on the transformation and forget the "new" part because their examples always return new.
  2. A string with a substring method (returns a new string) -> both groups might say yes, but Group B might hesitate because their examples are collections.
  3. A number with an increment method that returns a new number -> underdetermined: rule doesn't specify the type of values.
  4. A tuple that is immutable and has no methods (just stored values) -> not a Flumpet (no transformation).
  5. A stream that has a map function but also has side effects (e.g., writes to disk) -> underdetermined: rule doesn't say pure.
  6. A graph with a function that adds a node and returns a new graph -> both groups might say yes, but Group A might think of transformation as changing structure, Group B as returning new.
  7. A monad that has a bind operation (returns a new monad) -> late item that reframes: it's a higher-order Flumpet? Might make them rethink earlier strict collections.
  8. A function that takes a value and returns a constant Flumpet (e.g., always returns [1,2,3]) -> breaks the idea of encapsulation of multiple values? But the rule says "encapsulates multiple values" and has a transformation.

  For the one-shot: 
    First instance: "A Glimwacket is a tool that has a blue handle and is used for twisting." 
    Second instance: "A Glimwacket with a red handle used for twisting." (breaks the blue handle essence) OR a Glimwacket that is blue but used for hammering (breaks the twisting essence). We'll do the first.

  Letter-string analogy ladder:

  Item 1: abc -> abd (change last letter)
    xyz -> ? (xyd? but then:)
  Item 2: ijk -> ijl (change last letter)
    mrrjjj -> ? (mrrjjk? but then:)
  Item 3: aabbcc -> aabbcd (change last letter of the last group)
    ddeeff -> ddeefg? or ddeeg? Actually, the pattern is more about incrementing the last letter. But we want two framings.

  We'll do:
    abc -> abd: change last character to next in alphabet -> xyz: xya? (but that's not next, it's wrap) OR xza? Not clear. Instead, we want a framing shift.

  Better ladder:
    First: abc -> abd: "change the last letter to the next one"
      Then: xyz -> ? (if next, then xyA? But that's not a letter. So maybe they think "next" in cyclic way? Or they realize it's not defined. Then we reveal the intended framing: the rule is "increment the last character by one in the alphabet, and if z, then it becomes a". But then we break it:)
    Instead, we do:
      abc -> abd (change last letter to next: c->d)
      kji -> ? (if same rule, kjj? but then:)
      Then: aaa -> aab (change last to next)
      Then: zzz -> ? (zza? or aaa? if cyclic) -> but we want two possible rules: increment vs. change to next without wrap.

  But time is short. We'll do a simple one:

  Present:
    Step 1: abc -> abd (what do you do to get from abc to abd? Change the last letter to the next in alphabet: c->d)
    Step 2: ijk -> ? (ijl, by same rule)
    Step 3: xyz -> ? (if they say xya, that's one framing: cyclic. But without specification, they might say it's invalid. Then we reveal: the rule might be "increment the last letter by one position in the alphabet, and if z, wrap to a". But then we break with:)
    Step 4: rrr -> ? (rrs) -> but then:
    Step 5: mmm -> ? (mmn) -> but now we reframe: what if the rule is "change the last letter to the next distinct letter in the string, but if all same, then increment"? Not clear.

  We'll simplify: the ladder is just two steps to show how the rule is extracted from one example and then applied, but the next example breaks it.

  Instead, we do:

  Item: 
    First analogy: "If 'abc' becomes 'abd', what should 'pqr' become?" (pqs? because c->d, so r->s? But then:)
    Second: "If 'abc' becomes 'abd', what should 'xyz' become?" -> if they say xya (cyclic) or xyA (invalid) or nothing.

  But we want the point that the same base example can lead to different rules. We'll have two separate analogies:

  Part 1: 
    Given: abc -> abd
    Then: xyz -> ? (many will say xya, but without context, it's ambiguous)

  Part 2:
    Given: abc -> abd
    Then: kji -> ? (if they think "change last letter to next", then kjj. But if they think "increment the last letter by one", then j->k -> kjk? which is not the same as kjj. So they see the rule is ambiguous.)

  But in the interest of time, we'll do just one step: ask for xyz after seeing abc->abd and note the divergence in the room.

  Now, the JSON structure:

  We'll break down the 90 minutes as:

  - 0-5: Intro
  - 5-50: Rule application (split groups: 10 min training, 15 min classify, 10 min compare and discuss)
  - 50-65: One-shot category
  - 65-75: Analogy ladder
  - 75-90: Debrief

  But 45 min for rule application might be tight. Let's adjust:

  - 0-5: Intro
  - 5-10: Split and train (5 min to read rule and examples)
  - 10-25: Classify probe items (15 min)
  - 25-40: Regroup and reveal differences (15 min: each group reports, then show the other group's answers, discuss)
  - 40-55: One-shot category (15 min)
  - 55-60: Analogy ladder (5 min quick)
  - 60-90: Debrief (30 min? Too long. We must cut.)

  Better:

  - 0-5: Intro
  - 5-50: Rule application (split: 5 min train, 15 min classify, 5 min group consensus, 20 min whole group compare and discuss)
  - 50-60: One-shot (10 min)
  - 60-65: Analogy ladder (5 min)
  - 65-90: Debrief (25 min) -> total 90.

  But the debrief is important. Alternatively, we can drop the analogy ladder to save time, but it's a nice touch. We'll keep it short.

  We'll write the JSON accordingly.

  Note: The strong claim is that all categorization is analogical. The activity shows that rule application is influenced by examples and context, but it doesn't prove that there are no abstract rules. We'll honestly say in the debrief that the activity shows how even when we think we are applying a rule, we are influenced by examples, which is a key part of the strong claim.

  Now, the JSON object without comments or trailing commas.
