prompt: |-
  You are a philosopher of social science and public policy who is equally at home in survey methodology and in welfare economics — someone who has argued with both happiness researchers and their critics and found each side half right. Please think carefully before answering, and start by brainstorming privately: generate at least a dozen candidate open questions before pruning. I do not need to see the full brainstorm; I do need the pruning to be visible in the final ordering. What I want is a defended agenda, not a balanced survey, and not a reading list. Assume you have no web access, so argue from the structure of the problem rather than from sources, and do not cite anything.

  Context. I direct a small wellbeing evidence unit inside the finance ministry of a middle-income country of roughly 40 million people. I have about two years and the equivalent of six analyst-years, the ability to bolt one new module onto an existing national household survey, access to administrative data, and essentially no capacity to run large field experiments. Our minister has said he wants the country to top the annual global happiness rankings within a decade. My job is to decide what my unit should actually spend its scarce effort on.

  I can distinguish three goals his slogan might mean: (i) improve our rank; (ii) raise whatever the rankings actually measure; (iii) raise how well our citizens' lives go, whether or not any index captures it. Which of these come apart, and how much, is itself something I want your agenda to tell me how to find out.

  Here are a few distinctions my team has been using informally; adopt them, refine them, or explain why they are confused:

  - Ladder credit versus affect capital. A government can plausibly raise citizens' answers to the standard 0-to-10 life-evaluation question by improving the story people can tell about their lives — status, national prestige, perceived upward mobility — while depleting the mundane conditions that generate positive daily experience: sleep, unhurried sociability, time not spent commuting. Call the difference ladder credit minus affect capital. The open question is whether the flagship rankings are sensitive to something that can diverge from lived experience in this way, and in which direction and magnitude for a country like ours.
  - Compositional versus causal readings of rank. A country's score can rise because its people are doing better, or because the unhappy have emigrated, or because the surviving population has adapted its expectations downward. These have identical signatures in a cross-sectional ranking.
  - The publication-lag problem. Rankings grade a government on data collected years earlier, so a government that tops them is largely being graded on its predecessor's economy — which matters a great deal for whether rank is even an actionable target.
  - Rank-conditional budgeting. Suppose the treasury must publish a written justification whenever a policy is projected to lower the national rank. That rule turns the index into an explicit constraint rather than a report card.

  The question. Given my resources, remit, and time horizon, which open questions or lines of work should my unit prioritize, and in what order? I am less interested in the list than in the reasoning. For each item, state what other questions depend on its answer, whether it is tractable for a team with my tools rather than for a well-funded experimental group, how neglected it is relative to how much it matters, and what specific evidence arriving over the next two years would move it up or down the list. Rank at most five or six. Include at least one question my staff will assume is central and that you would drop as overrated, and say why it fails to carry weight.

  Two further things. First, is there any defensible reading of the slogan on which a country should try to top the rankings as such, rather than treat them as a noisy proxy — and which of your ranked questions settles that? Second, specify the single survey module you would have me add: what it asks, why those questions rather than the obvious alternatives, and what pattern in the answers would most change your recommended agenda.
reasoning: |-
  Hmm, the user is directing a wellbeing evidence unit in a finance ministry of a middle-income country. They need to prioritize research questions with limited resources to help their country top global happiness rankings. The minister's goal is ambiguous - it could mean improving rank, raising what rankings measure, or genuinely improving lives. I need to determine which questions they should focus on.

  The user has provided some distinctions: ladder credit vs affect capital (status vs daily experience), compositional vs causal readings of rank (changes due to wellbeing vs migration/adaptation), publication-lag problem (data reflecting past governments), and rank-conditional budgeting (policies constrained by rank). These are useful starting points but need refinement.

  For the survey module, I should propose something that captures the gap between ladder credit and affect capital. Instead of just adding more questions, I'd focus on a differential module: asking people to rate their life satisfaction (ladder) and then separately their daily experiences (affect). The key is whether these diverge significantly - that would shift priorities toward understanding why.

  Now, for the priority questions. I need to select 5-6, ordered by importance, with reasoning on tractability, neglectedness, and dependencies. One should be a common but overrated question to drop. Also, I must address whether aiming for rank itself is defensible.

  Top priority should be the publication-lag calibration. Without knowing how current policies affect future rankings, any action is blind. It's tractable with administrative data and existing surveys, likely neglected because rankings are often treated as current. If lags are long, it undermines rank as a target.

  Second, the ladder-affect divergence. This gets at whether rankings reflect lived experience. Can be studied by adding the survey module. If divergence is high, it questions the validity of chasing rankings.

  Third, compositional vulnerability: how sensitive rank is to emigration or demographic shifts. Uses admin data on migration and mortality. If sensitive, rank might not reflect policy.

  Fourth, adaptation dynamics: whether expectations adjust downward after setbacks. This affects whether policies can durably improve scores. Uses panel data in existing surveys. If adaptation is quick, short-term gains might fade.

  Fifth, the rank gaming trilemma: whether policies that boost rank inevitably trade off with real welfare or future scores. Synthesizes findings from others. If true, it shows rank is a poor target.

  I'd drop "correlates mining" as overrated. Staff might want to find what correlates with high scores, but without understanding mechanisms, it risks prescribing harmful policies.

  On whether aiming for rank is defensible: only if all the above questions show minimal lag, no divergence, low composition sensitivity, no harmful adaptation, and no trilemma. But realistically, the research will likely show rank is problematic, making it indefensible.

  The survey module asks: ladder question (Cantril), yesterday's affect (positive/negative experiences), and a calibration question on time perception (to measure rush). A pattern showing high ladder but low positive affect would prioritize divergence research.

  Order of priorities: lag calibration first because it's foundational. Without it, other efforts might be wasted. Then divergence, as it questions what rankings measure. Compositional, adaptation, and trilemma follow. Each answer informs the next, creating a logical flow.
answer: |-
  Here is a defended research agenda for your unit, prioritizing open questions based on tractability, neglectedness, cascading importance, and your operational constraints. The pruning rationale is embedded in the ordering and justifications.

  ### Core Prioritized Questions (Ranked)
  1.  **Publication-Lag Calibration:** *What is the precise time lag between policy implementation and its measurable effect on our national happiness ranking (using historical data and administrative records)?*  
      - **Why Top Priority?** Without this, the minister's target is incoherent. If the lag exceeds the electoral cycle (likely), ranking becomes a poor accountability tool and may incentivize short-term manipulation over durable gains.  
      - **Tractability:** High. Match historical policy/economic shocks (e.g., tax changes, commodity price shifts) with lagged survey/ranking data using time-series analysis. Requires only existing data.  
      - **Neglectedness:** High. Rankings are often presented as "current," obscuring lag dynamics. Finance ministries rarely quantify this explicitly.  
      - **Dependencies:** Foundational. If lag is long (>3 years), it downgrades questions purely about gaming rankings. If short, rank-as-target gains plausibility.  
      - **Evidence Shift:** Finding a sub-18-month lag would elevate rank-focused work; a 4+ year lag would deprioritize it.

  2.  **Ladder-Affect Divergence Diagnostic:** *Does the national gap between life evaluation (ladder) and experienced affect correlate with observable policy levers or social conditions in our country?*  
      - **Why #2?** Tests whether topping rankings (ladder-driven) could *worsen* daily wellbeing. Reveals if rankings incentivize "storytelling" over lived experience.  
      - **Tractability:** Requires your survey module (see below). Correlate ladder-affect gaps with admin data (commute times, work hours, inequality metrics, social spending).  
      - **Neglectedness:** Moderate in academia, but critical and rarely tested *for policy* in middle-income contexts.  
      - **Dependencies:** If large, policy-relevant gaps exist, it challenges goal (ii) and undermines (i). Informs whether "raise true wellbeing" (iii) conflicts with rankings.  
      - **Evidence Shift:** Finding strong links (e.g., infrastructure projects raising ladder but lowering affect via disruption) prioritizes affect-sensitive policy design.

  3.  **Compositional Vulnerability Assessment:** *How sensitive is our ranking position to emigration/mortality of the unhappiest quintile?*  
      - **Why #3?** Tests whether rank is a meaningful welfare target. If highly sensitive, chasing rank could incentivize harmful policies (e.g., neglecting vulnerable groups, encouraging out-migration).  
      - **Tractability:** Moderate. Simulate rank changes by statistically removing low-wellbeing groups from survey data. Cross-reference with emigration/mortality admin data by income/region.  
      - **Neglectedness:** High in policy circles. Demography is often seen as background noise, not a ranking confound.  
      - **Dependencies:** If sensitivity is high, rank is a dangerous target. Directly addresses goal (i) vs. (iii) conflict.  
      - **Evidence Shift:** High sensitivity (>5 rank spots from plausible demographic shifts) would deprioritize rank-focused goals entirely.

  4.  **Adaptation Speed & Policy Durability:** *After negative shocks (e.g., job loss, illness), how quickly does life evaluation "adapt" in our population? Do recovery policies (e.g., unemployment benefits) slow or speed adaptation?*  
      - **Why #4?** Affects whether policy gains are durable or eroded by shifting expectations. Crucial for distinguishing transient boosts from lasting welfare improvements.  
      - **Tractability:** Moderate-High. Use existing panel survey data (if available) or retrospective questions in your module on past shocks/recovery. Link to policy access via admin records.  
      - **Neglectedness:** Very high in policy design. Adaptation is theorized but rarely quantified for specific shocks/policies in middle-income settings.  
      - **Dependencies:** If adaptation is rapid, short-term rank-boosting policies are wasteful. Informs goal (ii) vs. (iii).  
      - **Evidence Shift:** Finding slow adaptation to policy-mitigated shocks (e.g., supported job loss) boosts the case for safety nets. Fast adaptation to unmitigated shocks suggests resilience but questions policy impact.

  5.  **Rank-Gaming Trilemma Exploration:** *Can we identify policies that demonstrably improve the ranking while having neutral/positive effects on affect capital and no adverse compositional effects?*  
      - **Why #5?** Synthesizes #2-4. Directly tests if a "win-win" path exists for goals (i) and (iii). If not, the minister faces a harsh trade-off.  
      - **Tractability:** Moderate. Requires outputs from #2-4. Test quasi-experiments (e.g., local policy rollouts) with your survey module + admin data.  
      - **Neglectedness:** Critical gap. Most research assumes alignment or conflict; systematic testing of trade-offs is rare.  
      - **Dependencies:** Final synthesis. A "no" answer forces a ministerial choice between rank and welfare.  
      - **Evidence Shift:** Finding clear win-wins elevates them. Finding pervasive trade-offs demands ministerial clarification.

  ### The Overrated Question to Drop
  **"What are the strongest correlates of high happiness scores nationally?" (Correlates Mining)**  
  - **Why Drop It?** Your staff will assume this is central. However:  
    1. Correlations ≠ causation. Observed links (e.g., GDP, social support) may not be policy-actionable levers.  
    2. It ignores *how* these factors affect ladder vs. affect vs. composition.  
    3. It risks prescribing policies that boost scores mechanically without improving lives (e.g., GDP growth via exploitative labor).  
    4. Your resources are better spent on *mechanisms* (#2-5) and *constraints* (#1).  
  - **Pruning Rationale:** Interesting, but low policy value without causal/mechanistic understanding. Likely already done globally; replicating it adds little insight for action.

  ### Defensible Reading of "Top the Rankings"?
  - A defensible reading **only exists if** your research finds:  
    - Short publication lags (#1) allowing current policy to affect rank.  
    - Minimal ladder-affect divergence (#2) meaning rank reflects experience.  
    - Low compositional sensitivity (#3) meaning rank reflects population welfare.  
    - No severe rank-gaming trilemma (#5) meaning policies can improve rank *and* welfare.  
  - **Settling Question:** #5 (Rank-Gaming Trilemma) is pivotal. If win-win policies exist, targeting rank *could* be defensible. If not, it forces a choice. Realistically, #1-#4 will likely show rank is a flawed target, making "topping rankings as such" indefensible. Treat rankings as a noisy proxy needing careful interpretation via your diagnostics.

  ### The Survey Module: Differential Experience Calibration
  **Add:**  
  1. **Ladder (Cantril):** "On a 0-10 scale, where 0 is worst possible life, 10 is best possible life, where do you stand?" *(Standard anchor)*  
  2. **Yesterday's Affect:** "Yesterday, how much time did you spend: a) Feeling happy/enjoyment? b) Feeling worried/sadness? c) Feeling stressed/anger? d) Feeling well-rested? (0=None, 1=Some, 2=Most, 3=All day)" *(Captures affect capital)*  
  3. **Calibration Probe:** "If your life improved permanently, how long until you'd rate it 1 point higher on the 0-10 scale? (Months/Years/Don't know)" *(Probes adaptation speed)*  

  **Why These?**  
  - Avoids adding burdensome scales. Focuses on the *gap* (ladder vs. yesterday's affect) central to #2.  
  - Affect questions target *duration*, not intensity, more reliably recalled. Includes rest/stress, key to "mundane conditions."  
  - Calibration probe directly feeds #4 (Adaptation Speed), using a novel, tractable approach instead of complex panel data.  

  **Pattern That Changes the Agenda:**  
  - **High Ladder (Avg 7+) + Low Positive Affect (e.g., <1.5 on happy/rested):** Would massively prioritize #2 (Divergence) and #5 (Trilemma), suggesting rankings are decoupled from experience. Agenda shifts to diagnosing causes of divergence.  
  - **Low Calibration (e.g., >50% say "years" for 1-point gain):** Elevates #4 (Adaptation), signaling policies need long horizons. Favors safety nets/infrastructure over quick fixes.

  This agenda prioritizes actionable diagnostics over description, leverages your data access, and forces clarity on whether the minister's goal aligns with governing well. Start with #1 – without it, the rest risks misdirection.
