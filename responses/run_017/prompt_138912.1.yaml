answer: |-
  Here are seven desiderata for an adequate account of genuine moral dilemmas:

  1.  **Genuine Conflict Requirement:** Must accommodate cases where an agent has two (or more) *actual, undefeated* moral obligations that cannot jointly be satisfied. *Non-negotiable*, shown by paradigmatic cases like Sophie's Choice (save one child, sacrifice the other; both imperatives bind absolutely). Buyout cases remain dilemmas *if* the escape clause payment is impossible or itself violates a duty (e.g., can't afford €200, or paying it breaks a promise to a charity).

  2.  **Moral Residue Requirement:** Must explain the persistent *moral remainder* (guilt, justified regret, compensatory duties) even after the best possible choice is made. *Non-negotiable*, evidenced by first-personal anguish in cases like Sartre's pupil (choosing family vs. resistance leaves a felt moral stain) and third-party recognition that *something* morally significant was violated.

  3.  **Distinction from Epistemic Uncertainty:** Must not reduce the dilemma to mere ignorance about facts or weighting of reasons. *Non-negotiable*, contrasted with cases like triage under uncertainty (where correct action exists but isn't known); true dilemmas persist even under full knowledge (e.g., *knowing* both promises are equally binding and incompatible).

  4.  **Distinction from Incomparability/No Wrongdoing:** Must differentiate "wrong either way" from "no obligation either way" or "no right answer". *Non-negotiable*, separating dilemmas from value incommensurability (e.g., career vs. art where neither is obligatory) or symmetrical rescues where saving either is permissible; clash of *obligations* (promise vs. rescue) is key.

  5.  **Non-Collapsibility via Compensation/Buyout:** Must withstand attempts to fully "buy out" one obligation without trace, preserving the conflict if the buyout is infeasible or creates new wrongs. *Non-negotiable*, per buyout cases: paying €200 avoids breaking the promise *simpliciter* but doesn't erase the *prima facie* wrong of failing the sister unless paid freely; inability to pay or new conflicts (charity promise) restore the dilemma. (*Tension:* Conflicts with views where duties are fully extinguished by fulfilling escape clauses.)

  6.  **Irrelevance of Culpable Origin:** Must allow that dilemmas can arise even if the agent culpably created the situation (e.g., knowingly made conflicting promises). *Non-negotiable*, as culpability explains *how* the agent got there but doesn't dissolve the conflicting obligations now in force; the nurse's desensitization doesn't negate the recurring triage dilemma's structure, only her response. (*Excludes:* Views reducing self-inflicted conflicts to simple wrongdoing.)

  7.  **Agnosticism on Agglomeration:** Need not accept the principle that "ought(A) and ought(B)" entails "ought(A and B)" as a *moral* truth. *Tradition-specific preference* (deontic logic reflex); accounts can reject agglomeration to preserve dilemma coherence (e.g., Rossian pluralism often does), since its acceptance typically forces denial of genuine dilemmas. (*Excludes most:* Rigid deontic systems insisting on agglomeration as essential.)
