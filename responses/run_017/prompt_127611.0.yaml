  ## Generic Risk Assessment & Method Statement  
  **Directorate of Relevance Assurance (DORA)**  
  **Form DORA-7F (Rev. 38.2)**  
  **Relevance Assurance Code:** RAC-Δ-9934B "Stable-State Illumination Adjustment"  

  **1. Task Description:**  
  Agent ID# Gamma-7 ("Carel") to retrieve one (1) aluminium stepladder (Asset # LDR-003) from designated Storage Cupboard C (Location Ref: COR-1A-7), transport said stepladder to Room 3 (Location Ref: OFF-1B-3), deploy stepladder, ascend steps, remove defective incandescent bulb (60W, E27 Fitting) from ceiling luminaire, install functional equivalent bulb (60W, E27 Fitting), descend steps, de-deploy stepladder, return stepladder to Storage Cupboard C, and secure cupboard. Duration: Estimated 15 minutes (excluding Relevance Assurance Certification time).  

  **2. Persons at Risk:**  
  *   Agent Gamma-7 (Primary Operator)
  *   Other agents within perceptual range of task execution path (Potential Collateral Observers, max. est. 5)
  *   Structural integrity of Room 3 ceiling, floor, and walls (Designated Passive Observers)
  *   Stepladder Asset # LDR-003 (Designated Passive Observer)
  *   Replacement bulb (Designated Passive Observer - Pre & Post State)
  *   Defective bulb (Designated Passive Observer - Pre-State only)

  **3. Hazards Identified:**  
  *   3.1 Falls from height during bulb manipulation.
  *   3.2 Manual handling injury during stepladder transport.
  *   3.3 Entrapment hazard during cupboard access/egress.
  *   3.4 Electrical hazard (negligible probability, bulb swap protocol compliant).
  *   3.5 *Relevance Drift Hazard (Critical):* Unintended state perturbation exceeding certified bounds. Mitigation: Full Frame Certification per Doctrine of Ontic Preservation (DOP).

  **4. Control Measures:**  
  *   4.1 Pre-task visual inspection of stepladder (stability, latch function).
  *   4.2 Maintain 3-point contact during ascent/descent & bulb manipulation.
  *   4.3 Clear transit path confirmed via DORA EnvScape™ (Snapshot #ΔT-7742-ValidUntil: 23:59:59 today).
  *   4.4 Isolation of luminaire circuit confirmed via Building Management System (BMS Log Ref: PWR-OFF-7742).
  *   4.5 Utilisation of anti-static gloves for bulb handling.
  *   4.6 *Frame Stability Assurance:* Certification via DORA-7F Annex A (attached, 78 pages) confirming *non-perturbation* of all Registered World States (RWS) outside the explicitly permitted Change Set (Section 5).

  **5. Change Set (Permitted Perturbations - RWS Registry Ref: Δ-9934B):**  
  *   5.1 Spatial location of Asset # LDR-003 (Stepladder): Cupboard C -> Room 3 -> Cupboard C.
  *   5.2 Operational state of Asset # LDR-003: Stored -> Deployed -> Stored.
  *   5.3 Illuminative state of Luminaire # OFF-1B-3-L1: Non-functional -> Functional.
  *   5.4 Physical location of Defective Bulb: Luminaire OFF-1B-3-L1 -> Waste Bin B-7.
  *   5.4 Physical location of Replacement Bulb: Storage Bin BULB-60W-E27-7 -> Luminaire OFF-1B-3-L1.
  *   5.5 Agent Gamma-7 Positional State Vector: Updated per transit path DORA-NAV-7742.

  **6. Residual Risk:**  
  **MEDIUM**  
  *(Rationale: While task-specific physical hazards are mitigated to LOW, residual MEDIUM risk derives from potential for uncertified Relevance Drift during task execution window due to: a) Latency between Frame Certification (Annex A) and physical execution; b) Inherent fragility of exhaustive Frame definition under the DOP; c) Risk of Review Date expiry prior to task completion. See Section 9.)*

  **7. Assessor:**  
  Agent ID# Theta-2 ("Bartholomew"), DORA Certified Frame Auditor (Grade III), Reg# AUD-7742-Θ2

  **8. Review Date:**  
  **15/10/2023** *(Note: Certification validity contingent upon no change to the Registered World State schema or the physical referents of certified locations/assets occurring prior to task completion. Any change triggers immediate Frame Decertification and requires re-issue of DORA-7F. Current RWS Stability Index: 0.97 - Amber Advisory)*

  **9. Additional Notes:**  
  *   9.1 Annex A (Frame Certification) exhaustively lists 12,743 specific states confirmed as UNCHANGED by this action. Examples include: Gravitational constant (Local Sector), Structural integrity of Building 1 (excluding Room 3 ceiling during bulb swap), Political sovereignty of the United Kingdom, Colour of Agent Gamma-7's overalls (Ref: DORA-UNIFORM-STD-BLUE), Continued existence of Neptune, Integrity of the 1922 FA Cup Final result, Absence of airborne marmosets within the operational envelope. *(Full list available on DORA Central Register, Query Ref: FRAME-Δ-9934B-ANNEXA)*.
  *   9.2 **Critical Incident Log 7742-Alpha:** Execution attempt at 14:23 hrs aborted. Designated "Room 3" (OFF-1B-3) underwent unscheduled re-designation to "Room 4" during the Frame Certification latency period (Facilities Notice REFAC-7742, uncertified by DORA prior to action initiation). Agent Gamma-7 correctly identified Relevance Drift Hazard (Section 3.5) when the door label did not match the certified Frame. Task cannot proceed until new location "Room 4" is formally registered within the RWS (Form DORA-LOC-REG-5 pending, est. processing 5 working days) and a *new* DORA-7F is certified against the revised RWS schema. The *change of room numbering itself* was not listed in Annex A (as it wasn't a Registered Change Set item *for this task*), illustrating the robustness of the DOP in preventing action under unstable epistemic conditions[^1].
  *   9.3 Replacement bulb functional status certified via DORA-ASSUR-BULB-7742.

  **Footnotes:**
  [^1]: The Doctrine of Ontic Preservation (DOP), the cornerstone of our Relevance Assurance Framework, mandates this rigorous separation of Change Sets and Frame Stability Certification. Critics who suggest this creates an "infinite regress of certification" fundamentally misunderstand the necessity of a *fixed, exhaustive* Register of World States as the bedrock of rational action. Epistemic drift *must* be quarantined at the schema level before safe micro-action can proceed. The alternative is ontological anarchy. (*See DORA White Paper WP-7F: "Taming the Heraclitean Flux: Administrative Finality in a Dynamic World"*).

  ---
  **Word Count:** Approx. 720  
  **Notes for your reading group:**  
  *   **The Frame Problem:** Section 6 (Residual Risk) and Section 9.1/Annex A embody the core issue: the vast, unenumerable set of things that *don't* change (gravitational constant, Neptune's existence, the FA Cup result) requiring explicit certification. The "Amber Advisory" and "MEDIUM" residual risk due to the *frame itself* highlight the impossibility of perfect closure. The footnote defends the "solution" (the fixed Register) which merely shifts the problem upwards (Section 9.2 shows this failing).
  *   **Preconditions vs. Frame:** Preconditions are subtly handled in Control Measures (4.1-4.5 - ladder stable, path clear, power off). The Frame is the *unchanged background* (Section 9.1).
  *   **Ramifications (Downstream Consequences):** Are deliberately *not* addressed here. The Change Set (Section 5) *only* lists the intended, immediate perturbations. The risk of unforeseen consequences is pushed into the "Residual Risk: MEDIUM" and the inherent fragility noted in Section 6. The system doesn't try to predict them, it just tries (and fails) to certify nothing *else* changes.
  *   **The Bureaucratic Trap:** Section 9.2 is the key. The room renumbering *happens*, but because it wasn't a Change Set item *for the bulb task*, and because changing a location reference *requires* a full re-certification (which itself needs a valid location reference), the system deadlocks. The form's own rules prevent it from recording the crucial change. The "Review Date" and "RWS Stability Index: Amber" foreshadow this instability.
  *   **Voice:** Kept rigorously deadpan and bureaucratic. The comedy is in the juxtaposition of the trivial task ("absence of airborne marmosets") with the catastrophic failure mode triggered by a door label change, all described in flat procedural language. The pompous footnote seals it.
