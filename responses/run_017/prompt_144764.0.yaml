  **Ordering Change:** Safety Lead (9) > Care Home Manager (7) > CEO (5) ≈ Engineer (3).  
  **Why:** Engineer’s blame ↓ due to documented foresight; Safety Lead’s ↑ for overriding warning. Confirms rankings track *foresight suppression* more than inherent risk creation.  

  ---

  **Top Blamer (Safety Lead @9): Effectiveness of Blame/Punishment**  
