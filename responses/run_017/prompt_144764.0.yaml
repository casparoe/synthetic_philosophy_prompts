  - System: Tool, not moral agent.  

  ---

  **Responsibility Gap Split (1/2/3):**  
  - (1) Foresight/Control Gap: **15%** (Foresight existed via sim; control fragmented)  
  - (2) Smeared Contributions: **80%** (Chain of decisions diluted accountability)  
  - (3) Compensation vs. Blame: **5%** (Liability clear (vendor/care home); blame attribution murky)  
  **Your rankings primarily respond to (2) – tracing smeared contributions.**  

  ---

  **Revised Case (Engineer Flagged Risk):**  
  | Role                     | Original | Revised | Δ  |  
  |--------------------------|----------|---------|----|  
  | Engineer                 | 5        | **3**   | ↓2 |  
  | Vendor Safety Lead       | 8        | **9**   | ↑1 |  
  | Vendor CEO               | 4        | **5**   | ↑1 |  
