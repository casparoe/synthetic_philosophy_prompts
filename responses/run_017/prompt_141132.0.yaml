prompt: |-
  You are a professional metaphysician who works on mereology, material constitution, and the metaphysics of ordinary objects. Please think carefully and work through my commitments one at a time before you start drawing conclusions: a short, unordered brainstorm of candidate tensions first, then the ranked audit.

  I'm an undergraduate in a metaphysics seminar, and I have to hand in a two-page position statement on the special composition question — the question of what conditions some things must satisfy in order to compose something. Before I commit myself in writing I want to know whether the package I've arrived at is stable. Roughly where I've landed:

  (1) Restricted composition, with a two-clause answer: the xs compose something if and only if either their activity realises a single life, or their arrangement was produced by a process guided by a representation of that arrangement — a plan, an intention, a design. I reject the view that any arbitrary plurality composes something; that gets me organisms and artefacts, and it rules out the fusion of the Eiffel Tower and my left kidney.

  (2) Composition and existence facts are wholly mind-independent: nothing exists, or fails to exist, even partly in virtue of what anyone intends, believes, or represents.

  (3) There are no coincident material objects: if x and y have all and only the same parts at the same time, then x is identical with y. This is part of why I am not an unrestricted-composition theorist.

  (4) Composition questions always have determinate answers, and I don't want to secure that by appealing to vagueness, context-sensitivity, quantifier variance, or the claim that the disputed cases are merely verbal.

  (5) If the xs compose y at all, they compose y necessarily; but I also want to say that a table survives the replacement of a leg and perishes when its parts are scattered, so that what composes what varies over time.

  (6) Methodologically, I want a single unified condition rather than a disjunctive list. An answer with the shape "organisms and artefacts and nothing else" strikes me as a taxonomy masquerading as a principle, and I would be unhappy if my finished view had that shape.

  What I want is an audit, not a lecture. Tell me which of these really conflict and how badly; which pairs merely look as though they conflict, and what generates the appearance; for each genuine conflict, what the least costly repair would be; and finally, which single revision would clean up the most. Rank the tensions by severity rather than presenting them all as equally serious, and flag anything in the above that is underspecified in a way that would let me wriggle out of a difficulty I ought not to be able to wriggle out of. Assume I am willing to surrender at most one or two of (1) through (6), and that I do not yet know which. Please don't give me a bibliography or a reading list; I will supply references myself.
reasoning: |-
  Okay, the user is an undergraduate in a metaphysics seminar working on the special composition question. They've outlined six commitments and want an audit of potential tensions in their position. Let me go through each point carefully.

  First, their position combines restricted composition with two specific conditions: life-based or representation-guided arrangements. They explicitly reject unrestricted composition. Then they insist composition is entirely mind-independent. They also hold a strong no-coincidence view, require determinate answers without vagueness, believe composition is necessary but also accept persistence through part changes, and want a unified principle rather than a disjunctive list.

  Hmm, the most glaring tension seems to be between (1)'s representation clause and (2)'s mind-independence. If composition requires a plan or intention, but existence can't depend on mental states, that's contradictory. The user might try to argue that representations can exist mind-independently, but that feels like a stretch - representations typically imply a representational mind. 

  The persistence issue in (5) is tricky too. Saying composition is necessary conflicts with allowing part replacement over time. They'd need temporal parts or something similar, but that might complicate their no-coincidence commitment in (3). 

  The demand for both determinacy (4) and no disjunctions (6) while covering such different cases as organisms and artefacts is tough. Life processes and intentional designs don't share an obvious underlying principle. The "guided by representation" clause might be doing too much work here.

  For severity ranking: the mind-dependence conflict is catastrophic and needs immediate fixing. The modality-persistence clash is serious but potentially fixable with temporal parts. The unity-determinacy tension is problematic but maybe addressable through conceptual refinement. 

  The "representation" clause in (1) seems like the biggest liability - it's causing multiple conflicts. Dropping it would solve the mind-dependence issue but leave artefacts unaccounted for. The user might need to either abandon mind-independence or find a completely different criterion for artefacts. 

  I should note their position is actually quite sophisticated for an undergrad - they're clearly grappling with real metaphysical problems. The audit should acknowledge that while being brutally honest about the inconsistencies.
answer: |-
  Based on your commitments (1)-(6), here is a severity-ranked audit of tensions and conflicts, followed by the most impactful single revision:

  **Ranked Tensions & Conflicts (Most Severe First):**

  1.  **(1) Representation Clause vs. (2) Mind-Independence (Catastrophic Conflict):** This is the most severe and direct conflict.
      *   **Conflict:** Clause 2 of (1) ("*their arrangement was produced by a process guided by a representation of that arrangement*") explicitly makes composition (and thus existence, via (3)) depend *on a mental state* (intention, plan, design). This directly contradicts (2), which states existence/composition facts are *wholly mind-independent* and cannot depend "even partly" on such representations.
      *   **Severity:** Foundational. The representation clause in (1) renders composition facts for artefacts *paradigmatically mind-dependent*, violating the core tenet of (2).
      *   **Least Costly Repair:** **Drop the representation clause from (1).** This leaves you needing a new, mind-independent criterion for artefacts (high cost conceptually). *Alternative repairs are worse:* Dropping (2) abandons a core commitment; redefining "representation" as mind-independent (e.g., Platonic forms, evolutionary "design") is highly controversial, likely violates the spirit of (2), and may not cohere with (6).

  2.  **(5) Compositional Necessity vs. (5) Persistence through Change (Serious Conflict):**
      *   **Conflict:** You state that if the xs compose y, they do so *necessarily* (first part of (5)). However, you also want to say a table persists through leg replacement (second part of (5)). This implies that the very same object y (the table) is composed by *different pluralities* at different times (e.g., original parts vs. parts including the new leg). This violates the necessity claim: if the original xs necessarily compose y, then y *cannot* be composed by any other xs (like the set including the new leg). The necessity applies to the *relation*, not just the object.
      *   **Severity:** High. This strikes at the coherence of your persistence conditions.
      *   **Least Costly Repair:** **Abandon the necessity claim (first part of (5)).** Endorse "compositional contingentism" – what composes what *can* change over time. *Alternatives:* Adopt temporal parts/perdurantism, making the composing "xs" at a time temporal slices; this radically changes your ontology and may conflict with intuitions behind (3). Embrace mereological essentialism (no part replacement), abandoning the persistence claim; this is highly counterintuitive.

  3.  **(1) Two Clauses / (6) Unity vs. (4) Determinacy (Significant Tension):**
      *   **Tension:** You demand a "single unified condition" (6) and determinate answers without vagueness (4). However, your proposed condition in (1) has two fundamentally different clauses: one based on biological processes ("realises a single life"), another based on causal history involving representations ("produced by a process guided by a representation"). Finding a truly *unifying principle* subsuming both life and artefact production under a single, non-disjunctive, *and* determinately applicable concept is extremely challenging. What shared, non-disjunctive property unifies a living cell and a screwdriver *as composites* in a way that determinately excludes arbitrary scattered objects?
      *   **Severity:** Significant. It threatens the theoretical elegance demanded by (6) and risks making the determinacy in (4) harder to secure by relying on two very different criteria.
      *   **Least Costly Repair:** **Radically reinterpret/redefine the two clauses to find a deeper, unified underlying property** (e.g., a highly abstract notion of "functional integration" or "causal unity" applicable to *both* biological and artificial systems without relying on representations). This is conceptually demanding. *Alternatives:* Weaken (6) to allow a principled disjunction; abandon one clause of (1) (losing organisms or artefacts); accept that determinacy (4) is harder to achieve across such different domains.

  4.  **(1) Restricted Composition vs. (3) No Coincidence + (4) Determinacy (Potential Tension):**
      *   **Tension (Apparent):** (3) (No Coincidence) is often *motivated* by avoiding coinciding objects in cases of constitution (e.g., statue/lump). However, your restricted composition (1) itself *prevents* coinciding objects for *most* cases simply by denying the existence of one putative object (e.g., if only the lump satisfies (1), the statue doesn't exist to coincide with it). So (1) largely *secures* (3). The tension arises *if* borderline cases exist for your criteria (1). If it's indeterminate whether parts "realise a life" *or* indeterminate whether a process was "guided by a representation," then (4) Determinacy requires a sharp cutoff, but (3) combined with (1) might suggest that *at the cutoff*, two objects (one existing, one not) could share all parts – which (3) forbids.
      *   **Severity:** Moderate/Low. This is less a direct conflict than a challenge for borderline cases. Your strong commitment to (4) *might* force you into accepting sharp cutoffs that *look* like coincidence at the exact boundary, violating the *spirit* of (3) even if not the letter (since one object strictly doesn't exist).
      *   **Appearance Generator:** The worry that any sharp cutoff for existence based on vague properties (like "life" or "guided by representation") might create a scenario indistinguishable from coincidence *at the exact point of the cutoff*.
      *   **Least Costly Repair:** **Insist your criteria (life, representation-guided process) are themselves metaphysically sharp and determinate,** avoiding borderline cases altogether. Argue that any apparent vagueness is merely epistemic. *Alternative:* Accept that *at the precise, metaphysically determinate cutoff point*, only one object exists, strictly satisfying (3), even if it seems arbitrary.

  **Underspecifications Offering Potential "Wriggle Room":**

  1.  **"Guided by a representation" (1):** This is critically underspecified.
      *   *Nature of Representation:* Does it *require* a mind (conflicting with (2))? Can it be naturalized (e.g., DNA as a "blueprint")? If naturalized, does it become too broad (e.g., erosion patterns "guided" by geological laws)?
      *   *Degree/Causal Role of Guidance:* How direct/intentional must the guidance be? Does a bird building a nest count? Does a river carving a canyon guided by gravity and rock structure count? Does accidentally spilling paint that forms the Mona Lisa count? Ambiguity here threatens determinacy (4) and risks making the criterion too inclusive or exclusive.

  2.  **"Realises a single life" (1):** While seemingly clearer than the representation clause, it still has edges.
      *   *What counts as "a single life"?* Symbiotic systems? Colonial organisms (e.g., siphonophores)? Viruses? Ecosystems? The line between complex non-living systems and nascent life? Ambiguity threatens determinacy (4).

  **Single Most Impactful Revision:**

  **Drop the representation clause from (1).**

  *   **Why:** It directly resolves the catastrophic conflict with (2) (Mind-Independence), which is the most severe problem. It also simplifies the challenge of meeting (6) (Unity), as you now only need a single, unified, mind-independent condition for composition (covering organisms and artefacts). While it creates the new problem of accounting for artefacts mind-independently, this is a necessary consequence of adhering to your core commitment (2). This revision forces a critical choice: either find a genuinely mind-independent criterion for artefacts (e.g., complex functional unity achieved by specific causal processes) compatible with (6), or accept that artefacts don't exist as composites distinct from their parts (a radical step), or reconsider the absolute nature of (2).

  This audit reveals that **Commitment (2) (Mind-Independence)** is the linchpin causing the most severe conflict. Your package *requires* a mind-independent criterion for artefacts if you wish to keep them as composites. The representation clause in (1) is fundamentally incompatible with (2). Addressing this is the highest priority for stability.
