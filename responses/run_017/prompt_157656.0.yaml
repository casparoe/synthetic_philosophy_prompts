  ### Adversarial Collaboration Statement: Sleeping Beauty Problem  
  **Prepared for the Philosophy Reading Group**  

  #### 1. Agreed Claims  
  Both signatories (Halfer and Thirder) endorse the following statements without reservation. These reflect common ground and are neither trivial nor prejudicial to either position.  

  1. **Protocol Invariance**: The experiment is described accurately: Beauty is woken once on Heads (Monday) and twice on Tails (Monday and Tuesday). Memory erasure ensures each awakening is subjectively identical. At each awakening, she is asked for her credence that the coin landed Heads.  
  2. **Sunday Credence**: Before the experiment, Beauty’s credence in Heads is 1/2, reflecting the coin’s fairness.  
  3. **No New Indexical Information**: Upon awakening, Beauty gains no new *objective* information about the coin or day beyond what she knew on Sunday. She cannot distinguish Monday from Tuesday or her first awakening from her second (if applicable).  
  4. **Betting Odds Consensus**: If offered a ticket at an awakening that pays $1 if Heads and $0 if Tails—with payout settled *once* after the experiment—Beauty’s fair (indifference) price is $1/3. Both agree this is the rational betting strategy.  
  5. **Duplication Variant Agreement**: In the variant where a duplicate is created on Tails (each woken once, unaware if original/copy), both agree each awakened entity’s credence in Heads is 1/2.  
  6. **Conditional Probabilities**: Given Tails, the probability that an awakening occurs on Monday is 1/2, and on Tuesday is 1/2.  
  7. **Symmetry of Ignorance**: Beauty has no reason to assign different credences to subjectively indistinguishable states (e.g., Monday-Tails vs. Tuesday-Tails).  
  8. **Coin Flip Independence**: The coin flip is fair and memory erasure does not physically affect the coin outcome.  

