  1.7. **Coin Flip Fairness**: The coin is fair, so the objective probability of heads is 1/2, and this does not change during the experiment.

  1.8. **Conditional Probabilities**: Conditional on the coin being tails, the probability that it is Monday (given an awakening) is 1/2, and similarly for Tuesday. This follows from the protocol.

