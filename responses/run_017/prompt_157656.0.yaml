  1.2. **Sunday Credence**: On Sunday, before the experiment begins, Beauty's credence that the coin will land heads is 1/2, and this is uncontroversial.

  1.3. **Awakening Experience**: Upon each awakening, Beauty does not learn any new information that would distinguish the day of the week or the outcome of the coin flip beyond what she knew on Sunday. Specifically, she does not know whether it is Monday or Tuesday, and she does not know if this is her first or second awakening (if any).

  1.4. **Betting Odds Agreement**: If at an awakening Beauty is offered a ticket that pays 1 unit if the coin landed heads and 0 otherwise, and this ticket is settled immediately after the experiment (so that it is only paid once even if she buys it twice on tails), both sides agree that Beauty should be indifferent to buying such a ticket at a price of 1/3. That is, the fair price for the ticket is 1/3.

  1.5. **Duplication Variant**: In the variant where, on tails, an exact duplicate of Beauty is created (while the original sleeps), and each (the original and the duplicate) is woken once in a subjectively identical room, each is asked for her credence in heads. In this variant, both sides agree that each awakened person (whether original or duplicate) should assign a credence of 1/2 to heads. [Note: This is agreed because each person is in a distinct, independent experiment and there is no memory erasure. However, note that the halfer and thirder may have different reasons for agreeing to 1/2 here.]

