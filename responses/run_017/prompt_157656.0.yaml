  #### 3. Cruxes  
  Cruxes are sub-questions whose resolution would shift at least one position. Both sides pre-register predictions for agreed tests.  

  **Crux 1: Can purely self-locating propositions ("today is Monday") be objects of credence?**  
  - **Test**: Beauty is told upon awakening that it is Monday. Both agree her credence in Heads becomes 1/2. The dispute is whether this requires assigning prior credence to self-locating propositions. The test: Can Beauty’s beliefs be modeled using standard probability theory with self-locating propositions as events?  
    - *Halfer prediction*: Yes, but prior credence in "today is Monday" depends on the coin (1 if Heads, 1/2 if Tails). No shift from 1/2 for Heads.  
    - *Thirder prediction*: Yes, with equal prior credence (1/3) in each awakening. Conditioning on Monday yields 1/2.  

  **Crux 2: Does the sampling-bias argument apply despite correlation?**  
  - **Test**: Run 1,000 experiments. Sample one awakening *uniformly at random* from all awakenings. What fraction of samples are Heads-awakenings? Both agree it is ≈1/3. The dispute: Does this frequency reflect Beauty’s rational credence?  
    - *Halfer prediction*: No. The 1/3 frequency arises from protocol design (Tails awakenings oversampled), not epistemic uncertainty. Correlation invalidates exchangeability.  
    - *Thirder prediction*: Yes. Beauty should view her awakening as a random sample from all awakenings, so 1/3 is the correct credence.  

  **Crux 3: Must credence equal fair betting odds?**  
  - **Test**: Beauty is offered the Heads-ticket at each awakening. Both agree the fair price is $1/3. The dispute: Does this imply her credence in Heads is 1/3?  
    - *Halfer prediction*: No. Betting odds account for repeated stakes (two losses on Tails); credence (1/2) tracks the coin’s truth. Divergence is rational.  
    - *Thirder prediction*: Yes. Credence is defined as the price at which one is indifferent to a bet, so 1/3 is her credence.  

  **Crux 4: Is the standard case metaphysically distinct from the duplication variant?**  
  - **Test**: In a hybrid protocol, Beauty is told she will be duplicated on Tails but not which copy she is. If credence differs from the standard case, it reveals a dependence on identity/temporal continuity.  
    - *Halfer prediction*: Credence is 1/2. The standard case involves one person enduring multiple awakenings; duplication involves distinct entities. Hybrid protocol clarifies this distinction.  
    - *Thirder prediction*: Credence is 1/3. Subjectively, Beauty cannot distinguish the standard awakening, duplication, or hybrid. All should yield 1/3.  

