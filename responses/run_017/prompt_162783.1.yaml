prompt: |-
  before I dig any further into this I want the spec, not the theories. me and a friend have been going in circles for weeks about whether you actually *owe* a tip in a city where tipping is the convention and wages are set assuming it, whether you owe it if your only visiting for four days, and whether a guy who strolls across an empty street at 2am against the light is doing anything wrong at all. so: write me the desiderata that a theory of *conventional obligation* has to meet — a theory that tells you when an arbitrary-looking everyday rule (tip 20%, don't cut the line, don't cross on red) generates a real moral obligation rather than mere prudence, etiquette, or law — with the case or consideration behind each requirement.

  fix the purpose first, since adequacy is relative to it: I want a theory good enough for two jobs. (1) it has to tell a short-term visitor, or someone who announces up front that they reject the practice, what they owe. (2) it has to tell a city, a platform, or the crowd at the bus stop whether they may enforce, reproach, or reallocate — not just whether it's true that the rule binds. a theory that only does job 1 is incomplete for me.

  here's my candidate list of cases it has to get right, but add, drop, or reframe anything you think is a bad desideratum and say why:

  - the no-difference case: compliance is near-universal, so your single act changes nothing — nobody is worse off, no coordination breaks. is there still a reason not to skip the tip or cross on red? a theory whose only tool is marginal consequences looks forced to say "no", and I don't think that's acceptable, but argue with me.
  - the announced non-participant: someone who says loudly, in advance, "I'm not tipping" or "I'm not queueing." some conventions seem to dissolve under that announcement (you tear up your deli ticket and leave), others seem stubbornly not to (the tip still feels owed). the theory needs a principled story about which is which.
  - the visitor and the dissenter as separate cases: the tourist from a no-tipping country vs. the local who thinks tipping is a racket. ignorance and dissent shouldn't automatically collapse into the same verdict — but it's also not obvious they come apart, and I want to know if separating them is a real desideratum or just a prejudice of people who like consent theories.
  - conflicting conventions across jurisdictions: jaywalking is the local pedestrian convention even though it's illegal, and drivers there brake for it; a driver from a town where nobody crosses on red shows up and honks. who owes what to whom, and does the legal rule matter at all?
  - the convention resting on an injustice: tipping as wage subsidy, queue position sold by a corrupt clerk. does the obligation survive when the practice itself shouldn't exist, and can a convention obligate you to comply *and* obligate you to work against it?
  - near-threshold cases: queues hold at ~90% compliance and collapse into a scrum below it. an adequate theory needs something to say about acting just above or below the threshold, not just "it's a coordination equilibrium, comply."
  - exit costs and lock-in: leaving a queue is cheap; exiting a tipping regime isn't, short of never eating out again. is "you could have walked away" even the right test, and for which conventions?
  - the enforcement asymmetry: the wrongness of cutting and the permissibility of the crowd shaming the cutter have to be separable. some theories can't pry them apart and I want that flagged.
  - the day-one case: a brand-new coffee shop's tip jar, with no one's reliance behind it yet, no expectations formed. does anything bind, and if not, when does it start to?

  distinctions it must respect — and mark which ones are load-bearing and which are cosmetic:

  - arbitrary-but-binding vs. binding-because-beneficial: it must not explain every convention's force by pointing at the good the practice does; the whole puzzle is that the content (20% rather than 15%, stand here rather than there) looks arbitrary.
  - obligation to follow vs. obligation to defer to local practice vs. licence to enforce.
  - what you owe strangers vs. what you owe people who have already relied on you — the waiter who has already served vs. the one who hasn't.
  - first-personal vs. third-personal reasons: must the theory hand the agent a reason she could actually state and act on, or is an external account enough? I suspect this one is a camp preference dressed up as a requirement.

  then the interesting part. which desiderata are non-negotiable and which are just what one camp wants? which subset do you suspect is jointly unsatisfiable? my guess is that some trio of {no-difference case, announced non-participant dissolves *some* conventions, obligation survives an unjust practice} can't all be held at once, and if so I want you to say what has to give and sketch what the best-surviving-subset theory would look like. and which single requirement excludes the most otherwise-popular accounts — I'd guess the no-difference case kills straightforward reliance/expected-benefit views and the announced-non-participant kills consent and fair-play views, but tell me if I've got it backwards.

  after that, a short scorecard (table is fine, two lines each) for five or six contenders: the coordination/equilibrium view, the reliance or expected-benefit view, the consent or fair-play "you took part" view, a joint-commitment or "we're in this together" view, the respect-or-attitude-expression view, and the straight debunking view that says all of this is etiquette with moralized window dressing. keep the weight on the criteria and their motivating cases rather than on the scoring — I can re-run the scoring myself, I just don't trust my own list of requirements yet.
reasoning: |-
  Okay, the user wants a rigorous framework for evaluating when everyday conventions create genuine moral obligations. They've presented a complex set of cases and distinctions, clearly frustrated with circular debates about tipping and jaywalking. Their core need is to resolve practical dilemmas about compliance and enforcement, especially for visitors and dissenters.

  Hmm, their candidate desiderata reveal sophisticated prior analysis. The "no-difference case" suggests they've already rejected naive consequentialism. The emphasis on separating obligation-to-comply from license-to-enforce shows they've spotted how most theories conflate these. Smart.

  Noticing they're particularly troubled by apparent contradictions: Can an unjust practice (like tip-subsidized wages) still create obligations? Why do some conventions dissolve when you opt out (like deli tickets) but others don't (like tipping)? This tension between conventionalism and moral independence seems central.

  Their requested scorecard implies they want to pressure-test theories against hard cases, not just get abstract principles. The visitor/dissenter distinction is crucial here - they suspect some theories unhelpfully lump these together. And rightly so: a tourist's ignorance differs fundamentally from a local's principled objection.

  Ah, the "day-one coffee shop" case is subtle but important. If a convention needs historical compliance to bind, how does obligation emerge? This exposes a gap in equilibrium-based views. Also revealing they dismiss "first-personal reasons" as cosmetic - suggests they prioritize explanatory power over agent-centric justification.

  Biggest tension indeed lies in their trio: (1) obligations persisting in no-difference scenarios, (2) opt-outs sometimes working, (3) obligations surviving unjust practices. Consent theories fail (1), benefit theories fail (3), conventionalist theories fail (2). My proposed solution: obligations bind when the practice solves coordination problems that would otherwise require explicit agreements, regardless of marginal effects. But this needs refinement for unjust practices.

  For the scorecard, should highlight how joint-commitment theories handle the enforcement asymmetry well but stumble on arbitrariness. Straight debunking views fail their core need - they explicitly want moral discrimination, not dismissal. The reliance view's collapse on no-difference cases is fatal as predicted.

  Final note: their "reallocate" point (can we redirect tips?) is underdeveloped but profound. If the obligation is to sustain a practice rather than follow rules, that changes enforcement permissions. Must flag this in desiderata.
answer: |-
  Here’s a rigorously structured framework for evaluating theories of **conventional obligation**, tailored to your requirements. I’ll define the desiderata (with cases), mark load-bearing distinctions, identify tensions, and score major theories against your criteria.

  ---

  ### **Desiderata for a Theory of Conventional Obligation**  
  *Purpose: Must explain (1) obligations for short-term visitors/announced dissenters, and (2) permissibility of enforcement/reallocation by communities.*

  #### **Core Cases & Requirements**  
  1. **The No-Difference Case**  
     - *Case*: Tipping in a city where your single skipped tip changes nothing (no lost wages, no system collapse).  
     - *Requirement*: Theory must explain why skipping is *still wrong* despite negligible consequences.  
     - *Load-bearing*: Kills pure consequentialist/reliance views.

  2. **The Announced Non-Participant**  
     - *Case*: Declaring "I won’t tip" before service vs. tearing up a deli ticket after announcement.  
     - *Requirement*: Principled distinction between conventions that dissolve on opt-out (deli ticket) vs. those that persist (tipping).  
     - *Load-bearing*: Tests whether obligation hinges on participation or external structure.

  3. **Visitor vs. Dissenter Distinction**  
     - *Case*: Tourist (ignorant of norms) vs. local dissenter (rejects tipping as exploitative).  
     - *Requirement*: Verdicts *must differ*; ignorance ≠ dissent.  
     - *Load-bearing*: Prevents consent/fair-play theories from collapsing cases.

  4. **Conflicting Conventions**  
     - *Case*: Jaywalking-normalized city vs. non-jaywalking visitor. Driver honks at local jaywalker.  
     - *Requirement*: Explain who owes compliance (local? visitor?) and if legal rules matter.  
     - *Load-bearing*: Exposes jurisdiction-bound vs. universal obligations.

  5. **Unjust Convention Survival**  
     - *Case*: Tipping subsidizes poverty wages; queue position sold by corrupt clerk.  
     - *Requirement*: Can obligation to comply coexist with obligation to reform?  
     - *Load-bearing*: Challenges "benefit-based" theories.

  6. **Near-Threshold Cases**  
     - *Case*: Queue holds at 90% compliance. Your skip tips it into chaos.  
     - *Requirement*: Theory must handle *proximity to collapse*, not just equilibrium.  
     - *Load-bearing*: Demands scalar obligation (stronger near threshold).

  7. **Exit Costs & Lock-In**  
     - *Case*: Leaving a queue (easy) vs. avoiding tipping (never eating out).  
     - *Requirement*: "Walk away" test must vary by convention; explain when cost voids obligation.  
     - *Load-bearing*: Kills blanket "consent-by-participation" arguments.

  8. **Enforcement Asymmetry**  
     - *Case*: Cutting a line is wrong, but shaming the cutter may be impermissible (e.g., if disproportionate).  
     - *Requirement*: Must separate *wrongness of violation* from *permissibility of enforcement*.  
     - *Load-bearing*: Blocks theories tying obligation to enforceability.

  9. **Day-One Case**  
     - *Case*: New coffee shop’s tip jar before expectations form.  
     - *Requirement*: Explain when nascent conventions bind (immediately? after N uses?).  
     - *Load-bearing*: Tests if obligation requires historical reliance.

  ---

  ### **Load-Bearing Distinctions**  
  - **Arbitrary-but-binding vs. Binding-because-beneficial**:  
    *Load-bearing*. Must explain why *specific* rules (20%, not 15%) bind despite arbitrariness.  
  - **Obligation to follow vs. Defer to locals vs. Licence to enforce**:  
    *Load-bearing*. These often diverge (e.g., visitor should defer but locals can’t enforce).  
  - **Strangers vs. Reliers**:  
    *Load-bearing*. Waiter who served you (relier) vs. next customer (stranger).  
  - **First-personal vs. Third-personal reasons**:  
    *Cosmetic*. External account suffices; no need for agent’s conscious reasoning.  

  ---

  ### **Tensions & Tradeoffs**  
  Your trio **{No-Difference, Announced Non-Participant Dissolves Some, Obligation Survives Unjust Practice}** is *jointly unsatisfiable*:  
  - If obligation persists in no-difference cases, consent theories fail (announcement should dissolve all).  
  - If obligation survives injustice, benefit theories fail (no net benefit).  
  - If announcement dissolves some conventions, joint-commitment theories struggle (why only some?).  

  **Resolution**: Drop *"Announced Non-Participant Dissolves Some"* as a fixed requirement.  
  - **Best surviving theory**: Treats conventions as **pro tanto obligations** from *systemic reliance structures*, where:  
    - Binding force depends on whether the convention solves coordination problems *requiring* a default rule.  
    - Opt-out works only if it doesn’t exploit the system (e.g., deli tickets allow exit; tipping does not).  
    - Unjust conventions bind weakly (comply to avoid harming individuals) but permit reallocation (tip cash directly).  

  **Most exclusionary desideratum**: **No-Difference Case** (kills reliance/benefit views).  
  **Second-most**: **Enforcement Asymmetry** (kills consent/fair-play views).  

  ---

  ### **Theory Scorecard**  
  *Key: ✓ = Satisfies, ✗ = Fails, ~ = Partially*  

  | Theory                     | No-Difference | Announced Non-Part. | Visitor/Dissenter | Unjust Convention | Enforcement Asymmetry | Day-One Case |  
  |----------------------------|---------------|---------------------|-------------------|-------------------|-----------------------|--------------|  
  | **Coordination Equilibrium** | ✓ (Rule stability) | ✗ (Ignores opt-out) | ✗ (Same verdict)  | ✗ (Assumes benefit) | ~ (Enforce if efficient) | ✗ (Needs history) |  
  | **Reliance/Expected Benefit** | ✗ (No harm)   | ~ (If no reliance)  | ✗ (Same harm)     | ✗ (No net benefit) | ✗ (Enforcement = duty) | ✓ (If expected) |  
  | **Consent/Fair-Play**        | ✗ (No quid pro quo) | ✓ (Opt-out voids)   | ✗ (Dissent=ignorance) | ~ (If consented) | ✗ (Enforcement = right) | ✗ (No consent) |  
  | **Joint Commitment**         | ✓ (Group norm) | ~ (If not "we")     | ✓ (Visitor defers) | ~ (If not unjust) | ✓ (Separable)        | ✗ (No "we" yet) |  
  | **Respect/Attitude**        | ✓ (Express vice) | ✗ (Attitude fixed)  | ✗ (Same attitude) | ~ (Symbolic harm) | ~ (Shaming OK)        | ✓ (Immediate) |  
  | **Straight Debunking**      | ✗ (No obligation) | ✓ (All dissolve)    | ✗ (No distinction) | ✗ (No obligation) | ✗ (No enforcement)    | ✗ (Never binds) |  

  **Crucial Takeaways**:  
  - **Joint-commitment** (e.g., Margaret Gilbert) handles enforcement asymmetry and visitor/dissenter best but struggles with arbitrariness and new conventions.  
  - **Coordination+** (e.g., modified Lewis) satisfies no-difference and thresholds but needs opt-out mechanics.  
  - **Debunking** fails your purpose: denies moral obligation entirely.  
  - **No theory aces all**; best candidate is a hybrid of **coordination structure + pro tanto obligation to avoid free-riding**.  

  ---

  ### **Recommendation**  
  Build a theory where:  
  1. Obligation arises when a convention is a *necessary coordination device* (arbitrary content OK).  
  2. Strength scales with:  
     - **Systemic reliance** (even in no-difference cases)  
     - **Exit costs** (high cost → stronger obligation)  
     - **Threshold proximity** (near-collapse → don’t defect)  
  3. Opt-out permitted only if:  
     - Announced *before* reliance (dissolver conventions), OR  
     - System permits alternatives (e.g., no-tip restaurants).  
  4. Unjust conventions: Comply to avoid *individual harm* (e.g., stiffed waiter) but *reallocate* (tip cash) and advocate reform.  

  This handles your cases: Tourists defer (coordination requires local defaults); dissenters may opt-out if feasible; enforcement is permissible only when proportional and system-sustaining.
