  5. Escape-hatch: on any day, start of day, P includes exam that day and no exam (and other days if not last), so |P|>=2, can be surprise. Especially on Fri, |P|={Fri, no exam} or more, >1, surprise possible.

  6. Over-informative: announcement specifies the day and claims you can't deduce it, but you can deduce it immediately, so inconsistent. Not about the day-of surprise.

