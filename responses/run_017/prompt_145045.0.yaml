answer: |-
  ## Ask Dr. Ordinal  
  *Director, Bureau of Revealed Welfare (B.R.W.)*

  **Statute:** *The Ordinal Preference Act (2023)*  
  S.2(c): Welfare is certified solely from observable choices.  
  S.4(a): Preferences are revealed, not stated; formation is irrelevant.  
  S.5(b): Interpersonal utility comparisons are ruled out of order.

  ---

  **Nurse’s Nightmare:**  
  *Dear Dr. Ordinal, My hospital offered pay cuts or termination. I chose a 30% cut to keep my job. The B.R.W.’s preliminary report suggests I’m not worse off, as I “chose” this. But I desperately needed the income! Am I recorded as worse off? — Anxious in A&E*

  **Dr. Ordinal replies:**  
  Your **budget set** contracted: termination or reduced pay. You selected the latter. This reveals a strict preference for your new bundle (job, lower pay) over the alternative (no job, no pay). S.2(c) is clear: choice reveals preference. Your selection demonstrates you are *not* worse off compared to the feasible alternatives at the decision point. The unavailability of your previous bundle is immaterial; welfare is assessed solely against the available **revealed preference relation**. The **weak axiom of revealed preference** holds: you did not choose a bundle previously rejected when both were available (as they weren’t). Certified: No Welfare Loss.

  **Mother’s Misery:**  
  *Dear Dr. Ordinal, My son’s school closed. He now stays in his room all day, barely eats, and speaks to no one. He *says* he’s content. Friends and doctors are worried. But the B.R.W. report claims “no observable harm.” Can his isolation really be certified as non-harmful? — Worried Mum*

  **Dr. Ordinal replies:**  
  S.4(a) forbids consideration of stated feelings or preference formation. His choices reveal a preference for solitude over feasible alternatives (e.g., interacting, seeking help). **Ordinal utility** represents these choices; it is not a quantity of happiness. **Increasing transformations** preserve the utility ranking; whether his utility index is 5 or 500 is meaningless. S.5(b) prohibits comparing his potential past “happiness” with present, or his state with others’. His choices are **rationalizable** given his preferences over solitude vs. social interaction. Unless his choices violate internal consistency axioms (e.g., the **generalized axiom of revealed preference**), we cannot infer harm. Certified: No Harm Evident.

  **Fire Victim’s Fury:**  
  *Dear Dr. Ordinal, Our house burned down. We escaped barefoot into freezing February streets. The Disaster Compensation Board denied our claim, citing B.R.W. guidelines: we “chose” to flee barefoot, revealing we preferred frostbite to death. Is this fair? Compensation requires proof of welfare loss! — Shivering Survivors*

  **Dr. Ordinal replies:**  
  Your feasible **budget set** at T(escape) contained only bundles involving varying degrees of exposure/injury vs. immolation. Choosing to flee barefoot revealed a strict preference for that bundle over perishing. The B.R.W. assesses welfare only against choices actually available at T(decision). The Compensation Board correctly applied the statute. Your **indirect utility** at T(decision) was maximized given the catastrophic constraint. While S.2(c) records your choice as welfare-maximizing *in that set*, we note your subsequent choices (seeking shelter, warmth) reveal a distinct preference structure. **Tastes changed** abruptly between T(pre-fire) and T(post-escape). Certified: Welfare Maximized at T(escape). Compensation Denial Upheld.

  **Final Certification (Per S.2(c)):**  
  Regarding the fire survivors: Subsequent B.R.W. analysis of pre-fire choices reveals consistent spending on footwear and heating, indicating a high preference for warm feet. However, their revealed preference *during* the fire demonstrates an even stronger preference for barefoot survival over warm death. Therefore, escaping barefoot constituted a *welfare gain* relative to the only feasible alternative. The intensity of this newly revealed preference outweighs the loss of the house. Certified: Net Welfare Improvement. Congratulations on your optimal choice.
