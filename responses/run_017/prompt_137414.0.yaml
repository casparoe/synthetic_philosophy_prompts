prompt: |-
  My friend and I got into a three-hour argument last night about eulogies and I want someone to tell me what the real disagreement underneath it is, because we kept going in circles and I think we were both right about the facts and still disagreeing.

  So here's the practice I can't stop thinking about. A eulogy doesn't work like a résumé. Nobody gets up and lists the promotions, the publications, the years on the school board. Whoever speaks tells two or three tiny stories: how he always took the worst shift on holidays, how she remembered everyone's kid's name, the dumb thing he said every single Sunday. And the room is supposed to come away not just sad but, like, quietly resolved to be a little more like that. It's the most widely practiced bit of moral instruction from a life that we have, and almost nobody thinks of it as moral instruction.

  My friend did classics and he said that's straight-up Plutarch. As far as I can remember what he said: Plutarch writes books of paired Lives, a Greek and a Roman, with a comparison at the end, and he says right at the front that he isn't writing history but lives, and that some chance remark or a joke tells you more about a man than his most famous siege — the small unguarded stuff is where the character actually shows, not the big achievements. Which is exactly the eulogy's method. Fine, we agreed on that much.

  Then we split completely, because Plutarch also puts in the bad parts. His heroes get drunk, take bribes, lose their tempers, do cowardly things, and as far as my friend remembers he says somewhere that he's not going to leave that out just because the man was great. A eulogy does the exact opposite. There's a hard norm about speaking nothing but good of the dead, and people obey it even when everyone in the room knows the guy was difficult or worse. My friend says that makes eulogies hagiography, full stop: the verdict is fixed in advance and then the evidence gets picked to fit it, so the genre can't teach anybody anything about character, it can only flatter the family and comfort the room. I said that's too fast, the stories are true, they're only selected, and anyway maybe you need the good version to want to imitate anybody at all — you don't learn to write by studying bad sentences first.

  And then there's the part that actually weirded me out, which is the inconsistency in the other direction. The same culture that won't let you say one critical sentence at a funeral will happily treat a single bad thing someone did as the whole truth about them: the pile-on, the "we're not giving this person a platform," the 600-page biography that comes out ten years after the flawless obituary and is entirely about the cruelty and the affairs. Same method, opposite filter. So either there's one theory of character underneath both and I'm not seeing it, or we're just seperately inconsistent and neither practice is thinking about character at all.

  The bit I kept throwing at him (and I think it's the only genuinely new idea either of us had) is that maybe "learning from a life" is two different jobs: copying an exemplar, versus finding out what human beings are actually like. Maybe the eulogy only ever signed up for the first one, and my friend is grading it on the second. He said that's a dodge.

  So what I want is this: what does the practice of the eulogy presuppose? About what character is, about how you could possibly know someone's character from the outside, about what a life is supposed to teach the people left listening, and about whether selecting which details to mention is a form of dishonesty or just what any narrative has to do? Is the praise norm doing real philosophical work — idealized models motivate in a way messy ones don't, grief makes accuracy cruel, character isn't one score so praise can be true even when incomplete — or is it pure etiquette that happens to wreck whatever teaching job the genre otherwise has? Be specific about which parts of the practice strictly require which theory and which parts several different theories would license equally. And then tell me what a eulogy would actually look like if it were built on the theory you think my friend is committed to, if that's different from the one we've got. Please don't just tell me we both have a point.

  Last thing: I want to know where your answer is weakest. What argument or consideration would actually change your mind here — what would make you say the praise norm is load-bearing after all, or that it's just manners? And where is your reconstruction most likely to be wrong? He's coming over Friday and I'd rather show up with the soft spots already found.
reasoning: |-
  Okay, this user is really digging deep into the philosophy behind eulogies after a marathon argument with their classically-inclined friend. Let me unpack this carefully.

  First, the core tension they're describing is fascinating: why do eulogies deliberately omit flaws when Plutarch-style biographies include them? And why does modern culture swing from hagiography at funerals to character assassination in cancel culture? The user wants the underlying assumptions laid bare, not just "both sides have merit."

  Hmm... I notice they've already identified a key distinction themselves - that eulogies might be for moral emulation rather than objective character assessment. Their friend dismissed that as a "dodge," but I think that's actually the crux. The user seems frustrated by the friend's insistence on applying historical biography standards to a ritual with completely different social functions.

  The pile-on phenomenon they mention is particularly sharp. It reveals how we toggle between two modes: the funeral's "character eraser" and the scandal's "character laser." Both are reductive, just in opposite directions. Makes me wonder if both stem from our discomfort with moral complexity.

  What's really being asked here is: what theory of character must we believe in for current eulogy practices to make sense? They want the philosophical wiring diagram. And crucially, they want to know where that diagram might be faulty - hence requesting the weak spots upfront. This is someone preparing for round two of the debate with intellectual ammo.

  The Plutarch comparison is helpful. Plutarch assumes character is accretional - virtues and vices coexist in tension. But eulogies seem to presuppose something more essentialist: that the "truest" self is the aspirational one, and flaws are noise rather than signal. That's why selecting only good anecdotes isn't seen as dishonest within the ritual.

  For the Friday rematch, I should emphasize how social rituals create their own truth conditions. The "no criticism" rule isn't just etiquette - it's what allows the ritual to perform its psychological work of modeling goodness during vulnerability. But I'll also flag how this breaks down when the deceased was genuinely awful - that's where the friend's criticism bites hardest.

  Biggest vulnerability in my thinking? Probably underestimating how much the praise norm serves power structures (protecting reputations of influential families) rather than philosophical purposes. If pressed on that, I'd have to concede the "moral instruction" angle might be secondary to social maintenance in many cases. User should be ready for that counter.
answer: |-
  You've hit upon a fundamental tension in how we understand character, memory, and social ritual. The disagreement isn't really about facts (eulogies *do* omit flaws, Plutarch *did* include them), but about **what constitutes legitimate moral instruction and how "character" is revealed and transmitted**. Here's the underlying architecture:

  **Core Presuppositions of the Traditional Eulogy:**

  1.  **Character is Defined by Peak Virtues, Not Aggregate Actions:** The eulogy assumes that a person's "true" or "essential" character is revealed in their *best* moments – moments of kindness, integrity, humor, sacrifice. Flaws are seen as deviations, failures, or external impositions on this essential core, not constitutive elements. The eulogy aims to capture and memorialize that essential core.
  2.  **Moral Instruction Requires Idealization:** The practice presupposes that motivation for emulation ("be more like that") is best sparked by clear, unblemished examples. Seeing the "cracks" (as Plutarch shows them) is seen as *demotivating* or confusing for the audience seeking guidance. The "praise norm" isn't just etiquette; it's a necessary condition for the ritual's aspirational function.
  3.  **Grief Creates a Unique Epistemic Space:** During grief, accuracy about flaws is recast as cruelty. The ritual presupposes that the immediate need for comfort and communal affirmation *temporarily suspends* the demand for comprehensive objectivity. The focus is on healing and honoring the *intended* self or the *struggling* self, not dissecting the failed self.
  4.  **Narrative Selectivity is Honest Framing, Not Dishonest Omission:** Selecting positive anecdotes isn't seen as lying *if* the anecdotes are true. It's framing a life through a specific lens (the lens of "what we cherish and aspire to"). Just as a scientific paper selects data relevant to a hypothesis, the eulogy selects data relevant to the hypothesis: "This life contained moments of worthiness we should remember and emulate." Omitting contrary data is seen as legitimate focus, not deception, within the ritual's purpose.
  5.  **Character is Knowable Through Specific, Revealing Micro-Moments:** Both Plutarch *and* the eulogy agree on this! Where they diverge is on *which* micro-moments are revelatory. Plutarch thinks unguarded flaws are *equally* (or more) revealing. The eulogy presupposes that unguarded moments of *goodness* (the holiday shift, remembering names) are the most profound revelations of the "true" character – precisely because they weren't performed for public glory (like the siege).
  6.  **The "Life Lesson" is Extrapolation, Not Replication:** The eulogy doesn't expect you to replicate the *exact* deeds (work holidays forever). It expects you to extrapolate the *underlying virtue* (generosity, duty, attentiveness) and embody *that* in your own context. The idealized model makes the virtue easier to abstract and apply.

  **Your Friend's Plutarchian Presuppositions (The "Grading on the Wrong Scale" Critique):**

  1.  **Character is Holistic and Contradictory:** True character encompasses virtues *and* vices, strengths *and* weaknesses. Omitting flaws creates a fundamentally false picture. Moral growth requires understanding this complexity, not avoiding it.
  2.  **Moral Instruction Requires Realism:** Learning from a life means learning about the *human condition*, which includes struggle, failure, and inconsistency. Plutarch's heroes are relatable *because* they are flawed; their greatness emerges *despite* or even *through* wrestling with their weaknesses. Idealization makes the subject inhuman and unrelatable, thus un-instructive about real moral navigation.
  3.  **"Hagiography" Undermines Authenticity:** Fixing the verdict ("only good") and selecting evidence to fit corrupts the process. It turns the eulogy into propaganda (flattering the family/society) or therapy (comforting the grieving), sacrificing any claim to genuine insight into character or truth. It teaches conformity to social norms, not authentic virtue.
  4.  **Revelation Requires the Unguarded *and* the Unflattering:** Plutarch's key insight – that character shows in small, unguarded moments – applies equally to moments of pettiness, anger, or weakness. Excluding these moments because they are "bad" is just as dishonest as fabricating good ones. True understanding requires seeing the whole spectrum.

  **The Pile-On Paradox Explained:**

  This isn't inconsistency *underneath*, but the application of the *same selective principle* for opposite purposes:
  *   **Shared Presupposition:** Small/specific acts *are* profoundly revelatory of core character.
  *   **Divergent Application:**
      *   **Eulogy:** Selects *only* positive micro-moments to reveal an *essential good core*.
      *   **Pile-On/Cancel Culture:** Selects *only* negative micro-moments (or major transgressions framed as the "key") to reveal an *essential bad core*.
  *   **Underlying Theory:** Both practices subscribe to a form of **essentialism** about character ("This one act *reveals* who they *truly are*"), but wield the selectivity weapon in opposite directions. Neither practice engages with Plutarch's core belief in complex, contradictory character. Both are reductive.

  **What a Plutarchian Eulogy Would Look Like:**

  It wouldn't be a traditional eulogy. It would be closer to a **character study in memoriam**. Imagine:

  1.  **Acknowledging the Contradiction:** "John was fiercely loyal to his friends, a trait seen when he drove through the night to help Mike move. Yet that same fierce loyalty could curdle into stubbornness, like when he refused to admit his team's project was failing, causing significant delays. Both sprang from a deep commitment to what he believed in, sometimes to a fault."
  2.  **Virtues Presented Alongside Struggles:** "Mary's incredible empathy made her a brilliant counselor. She *felt* her clients' pain. But that empathy was a double-edged sword; it often overwhelmed her, leading to periods of withdrawal where she struggled to be present for her own family. Her strength was also her burden."
  3.  **Focus on Growth or Tension:** "David was terrified of public speaking, a fear rooted in childhood mockery. Seeing him overcome that fear, voice trembling but determined, to champion the library fundraiser last year – *that* was courage. Not the absence of fear, but the mastery of it."
  4.  **Ambiguous Anecdotes:** "Remember when Sarah snapped at the waiter? It was wrong, she knew it instantly and apologized profusely. But it also showed the exhaustion she carried trying to be everything to everyone. That moment taught me about her compassion *and* her limits."
  5.  **Lesson in Humanity, Not Sainthood:** "We learn from Tom not because he was perfect, but because he was gloriously, frustratingly human. He showed us kindness, yes, but also how hard it is to consistently *be* kind under pressure. That struggle is the lesson we all share."

  **Where Your Insight Hits the Mark:**

  You are absolutely right: **"Learning from a life" is at least two distinct jobs:**
  1.  **Exemplar for Emulation:** (Eulogy's domain) Providing a clear model of virtue to inspire aspiration.
  2.  **Case Study in Humanity:** (Plutarch's domain) Providing a complex portrait to understand moral psychology, frailty, growth, and the reality of the human condition.

  The traditional eulogy consciously chooses Job #1. Your friend, using Plutarch, is criticizing it for failing at Job #2. The disagreement is fundamentally about which "job" is the valid or valuable form of "moral instruction" in the context of death and remembrance.

  **The Weak Spots in My Reconstruction & What Could Change My Mind:**

  1.  **The Necessity of Idealization for Motivation:** My argument assumes idealized models *are* more motivating. But is this true long-term? Does encountering flawed-but-striving models (Plutarch's heroes) actually inspire *more* sustainable emulation by making virtue seem attainable? What if the "messy" model is *more* instructive precisely because it shows *how* to fail and keep going? **Evidence** showing that realistic (flawed) exemplars lead to greater or more persistent moral effort than idealized ones would challenge the presupposition that the praise norm is *necessary* for the eulogy's instructional function.
  2.  **The "Essential Core" Defense:** Is the "essential good core" a real thing, or just a comforting fiction? Does consistently selecting *only* good moments truly reveal "character," or does it create a fictional character? **A strong philosophical argument** (e.g., from virtue ethics emphasizing the totality of habits, or existentialism rejecting essentialism) demonstrating that character *is* fundamentally the *sum* of actions, including the bad ones, and cannot be meaningfully separated into "core" and "peripheral," would undermine the eulogy's foundational justification for selectivity.
  3.  **The Primacy of Ritual Function:** I argue the praise norm serves a deep psychological/social function beyond etiquette. But perhaps I overstate this. **Evidence or argument** showing that the "speak only good" norm is *primarily* driven by historical accident, social conformity, fear of conflict, or pure etiquette (with the "moral instruction" being a post-hoc rationalization) would push me towards agreeing it "just wrecks the teaching job" and is merely "manners."
  4.  **The Grief Exception:** Is the suspension of objectivity *truly* necessary for comfort, or is it potentially harmful denial? **Psychological studies** demonstrating that avoiding difficult truths in grief hinders long-term healing, or that communities find *more* comfort in shared, authentic remembrance (warts and all), would challenge the presupposition that grief mandates selective praise.
  5.  **Your Friend's Point on Social Control:** Perhaps he's more right than I acknowledge. The "hagiography" critique might be the strongest: maybe the primary function *is* social maintenance (flattering the powerful, enforcing conformity, avoiding disruption) and comfort, *masked* as moral instruction. If so, the genre *is* philosophically bankrupt for teaching character. **A compelling historical/sociological analysis** showing eulogies consistently serving to whitewash the powerful or enforce social norms, with moral uplift as mere rhetoric, would significantly strengthen your friend's case.

  **For Friday:** Focus the discussion on the *purpose*: "What *is* the primary job of a eulogy? To inspire emulation through idealized models, or to provide an authentic understanding of a human life in all its complexity?" Challenge your friend to articulate what "moral instruction" means *to him* in this context, and why Plutarch's method is superior *for that specific ritual purpose*. Acknowledge the validity of Job #2 (Plutarch's case study), but defend the idea that Job #1 (exemplar creation) is a legitimate and distinct function that requires different rules. Be ready to concede that the current practice struggles *deeply* when the deceased was genuinely monstrous, exposing the limits of the "essential core" theory. Good luck!
