answer: |-
  Here is a reading focused on causation-by-omission, structured for your seminar. It targets your specified questions, preserves the story’s complexities, and highlights where metaphysics strains against the narrative.

  ---

  ### **Verdict on Causation**
  The citizens of Omelas **collectively cause** the child’s suffering through a *ratified omission*, but **no individual citizen** is a cause in standard counterfactual or production frameworks. The relation is one of **structural dependence sustained by institutional agency**—a social fact irreducible to individual acts.

  ### **Key Moments in the Story to Highlight**
  1.  **The Ratification Ritual** (post-adolescence): Citizens are shown the child and taught the terms. This moment formalizes non-intervention as a collective practice, transforming passive neglect into active institutional maintenance.
  2.  **The Citizens’ Rationalizations**: The narrator describes those who initially feel revulsion but then reason, "if the child were cleaned and comforted, that would be a good thing, indeed; but if it were done, in that day and hour all the prosperity… of Omelas would wither and be destroyed." This underscores *informed, deliberate* non-action.
  3.  **The Walkers’ Silent Departure**: Their act is framed not as intervention but as refusal to participate further. They offer no protest, change no policies, and leave the child’s condition unchanged.

  ---

  ### **Addressing Your Framework Questions**
  #### **1. Redundancy & Counterfactual/Interventionist Approaches**
  - **Problem**: Standard models (e.g., Lewis) struggle because:
    - *Individual non-intervention*: If Citizen A intervenes, the city falls. But if A *alone* refrains, the child still suffers (redundancy).
    - *Collective non-intervention*: The "pattern" is necessary, but it’s not a unified agent.  
  - **Interventionist Setup**:
    - *Variables*: `CITY_FELICITY (on/off)`, `CHILD_SUFFERING (on/off)`, `INDIVIDUAL_ACTION (intervene/omit)`.
    - *Contrasts*:  
      - If *all* citizens intervened → `CITY_FELICITY=off`, `CHILD_SUFFERING=off`.  
      - If *one* citizen intervenes → `CITY_FELICITY=off`, `CHILD_SUFFERING=off` (city falls).  
      - If *one* citizen omits (others intervene) → ? (Unspecified—story implies the city requires *universal* compliance).  
  - **Verdict**: Only the **universal practice of omission** (a social variable) counts as a cause. Individual omissions are *difference-makers* only in the catastrophic scenario (they prevent city collapse), not for the child’s suffering. Interventionism must treat the *collective norm* as a variable to avoid incoherence.  

  #### **2. Production vs. Dependence & Physical Connection**
  - **Production Theories** (e.g., Schaffer): Deny absences cause since no energy/force transfers. *Verdict*: Citizens cause *nothing*—the child’s suffering is a brute fact or caused only by initial imprisoners.  
  - **Dependence Theories** (e.g., Lewis): Child’s suffering counterfactually depends on the *collective* omission. If all citizens intervened, suffering would cease.  
  - **The Stipulation’s Role**: The story’s insistence that the child’s misery is a "positive condition" *blocks physical-mechanism questions*. It forces a focus on **dependence without production**—a gap production theorists see as fatal. The prohibition on kindness (you’re correct: "They do not say anything [to the child]") underscores that *any* positive act risks collapse, making omission the *only* permitted relation.  

  #### **3. Ratifying Omission: Metaphysics or Moral Rhetoric?**
  - **Your Concept is Metaphysically Significant**: Ratified omission (public, institutional, deliberative, expressive) is distinct from private neglect. It creates a **social fact**—a *structured absence* maintained by rules, knowledge, and collective intent.  
  - **Why Not Just Complicity?**: Complicity is moral/legal; ratified omission explains *how the structure persists causally*. The citizens *reproduce* the child’s suffering by renewing their consent. This is causal maintenance via institutional inertia.  
  - **The Story’s Contribution**: It shows omission can be *active* ("a terrible justice of reality")—not just failing to water a plant, but upholding a system where watering is forbidden.  

  #### **4. Your Three Decisive Questions**
  - **The Walkers**:  
    - Their departure is an *act* that *omits to challenge the system*. They cause no change because they refuse to *intervene* (act) or *ratify* (omit). Metaphysically, they are **causally irrelevant omissions**—the story suggests moral responsibility requires more than non-participation.  
    - **Lesson**: Causal frameworks fail the moral work. Walking away rejects complicity but is causally inert. Ethics needs concepts like *solidarity* or *revolution*, not just omission.  
  - **Informedness**:  
    - **Metaphysically Central**: For omission to be causal, agents must recognize the *default action* (non-intervention) and its effects. In stock cases (forgetful gardener), ignorance excuses. In Omelas, knowledge makes omission *intentional maintenance*.  
    - **Real-World Implications**: Our theories mislead by using uninformed cases. Structural harms (e.g., climate inaction) often involve *willful* ignorance—Omelas forces us to confront informed, ratified omission as the paradigm.  
  - **The Child’s Non-Agency**:  
    - The child cannot demand help or resist. This exposes that **omission requires no patient-agency**. Causes-by-omission apply when an agent *could* alter a state of affairs but doesn’t. The child’s passivity amplifies the citizens’ responsibility but doesn’t change the causal structure.  

  ---

  ### **What the Story Adds to the Debate**
  **A test case for social-structural causation**. Stock examples focus on *individual* omissions with *direct* counterfactuals (e.g., "if the gardener watered, the plant would live"). Omelas forces metaphysics to confront:  
  - **Emergent Social Facts**: The suffering depends on a *practice*, not individuals.  
  - **Ratification as Causal Mechanism**: Deliberate, collective inaction sustains harm.  
  - **The Limits of Individualism**: No citizen causes the suffering alone, yet all uphold it.  

  ---

  ### **Where the Story Resists or Distorts Frameworks**
  1.  **The Stipulation Resists Mechanization**: The child’s suffering as a "condition" isn’t explained—it’s magical. Production theories collapse here; dependence theories must accept unexplained brute correlation.  
  2.  **The Walkers Distort Causal Binaries**: Their act is neither cause-by-omission nor intervention. It’s *existential refusal*, exposing that causation frameworks can’t capture "opting out" of a system.  
  3.  **Collective Responsibility ≠ Sum of Omissions**: The story implies the *city* (as an entity) causes the suffering, but metaphysics lacks tools for group agency without reification.  

  ---

  ### **Handout-Ready Summary**
  **Core Question**: Do Omelas’s citizens cause the child’s suffering by omitting to save it?  
  **Verdict**: **Collectively yes, individually no**—via *ratified omission* (informed, institutional non-action).  
  **Key Insights from the Story**:  
  - Causation-by-omission can be *structural* and *active* (maintenance of a system).  
  - **Informedness** is metaphysically crucial: it defines the "default" action.  
  - **Redundancy** demands social variables, not just individual ones.  
  - **Ethics outruns causation**: Walking away changes nothing, forcing moral concepts beyond cause/omit.  
  **Limitations**: Omelas’s magical stipulation and the walkers’ ambiguity challenge tidy theories. Metaphysics must stretch to capture *social practices* as causes.  

  End your session by projecting these limits: **"Can metaphysics model ratified social omission without magic? Do the walkers refute causation-centric ethics?"** Let the tensions stand.
