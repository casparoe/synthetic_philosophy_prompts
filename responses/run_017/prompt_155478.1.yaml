prompt: |-
  I'm a philosophy PhD student working on the epistemology of mathematics, and this term I'm running the discussion sections for Computation and Mind, a mixed-enrollment course — about fifteen students, mostly second-year computer science majors with a scattering of philosophy majors, all of whom have had discrete math and a formal-languages course where Turing machines were simply defined and then used as a tool. Nobody has ever asked them why we are entitled to identify that definition with the informal notion of a procedure a person could carry out by rote, so right now I expect they'll think I'm asking them to doubt something they've successfully treated as a definition all year. I have one seventy-five-minute section, a blackboard, and no handout. The topic is the epistemic status of the Church–Turing thesis. I don't need the thesis explained to me; I need a plan for getting them to see that there is a real question here at all.

  Here is roughly where I've gotten to on my own. I want to separate three things they currently run together: the mathematical thesis (that the independently motivated formalisms — Turing machines, general recursive functions, the lambda calculus, register machines — all pick out the same class of functions), the physical thesis (that nothing implementable in the actual world outdoes that class), and the psychological thesis (that human mathematical capacity doesn't either). I also want to separate two very different-looking reasons for accepting the mathematical thesis — the sheer convergence of the formalisms, and the fact that decades of attempts to describe a stronger but still mechanical procedure have quietly collapsed back into the same class — and then ask why neither looks like evidence that would move someone who wanted a physical hypercomputer. I've been calling the first the licensing role of the thesis: it's what entitles anyone to move from computable-by-my-favorite-formalism to computable, full stop. I've been calling the second the definitional-retreat problem: every candidate counterexample gets reclassified as not really a procedure rather than counted as a refutation, which makes me suspect the whole thing has quietly become unfalsifiable. My supervisor suggested framing the thesis as a calibration principle — not a prediction you test but a stipulation that lets an entire apparatus of results about computability speak at all — but I don't know whether that framing survives contact with students who have never seen a physics-flavored counterexample.

  So: give me the teaching plan, not the explanation. What has to be on the board, and in what order, before the question of the thesis's status can even look like a question rather than a quibble about words — I assume the informal/formal asymmetry has to come first, but tell me if something else has to precede even that. What single concrete case should carry the session: I'm inclined toward a specifiable but non-Turing-computable function (the halting problem, or the Busy Beaver function) paired with one candidate physical device that would decide it — either an accelerating machine performing a supertask or a machine exploiting relativistic time dilation — so tell me which of those two devices to actually draw, what the carrying example must have (concretely describable, mechanically specifiable, not smuggling in an oracle) and what it must lack, and why the example you pick is better equipped to carry the epistemic point than the obvious alternatives. Then the misconception map: which misunderstandings to expect in a mixed computer-science-and-philosophy room, and where in the sequence each one should be headed off rather than merely corrected after the fact. My guesses are that they'll say that Turing proved it in his paper on computable numbers, that quantum computers are about to break it, that calling it a thesis just means nobody has gotten around to proving it, and — among the sharper students — that the physical version is simply very well-confirmed empirical science, which is the one I'm least sure how to answer. Include a question I can ask at the end that would tell me whether they've grasped the structure of the dispute rather than learned to repeat the slogan that it's a thesis and not a theorem, and tell me plainly what I should refuse to settle in seventy-five minutes and say out loud that I'm refusing. If the calibration-principle framing will mislead this particular audience, say so and give me what to put in its place.

  Format: exactly eight numbered items, each two or three sentences, with no introduction and no conclusion. Make item 8 your confidence note: how confident you are in the plan overall, and which one of the preceding items you are least sure about, and why.
reasoning: |-
  Okay, let's tackle this. The user is a philosophy PhD student teaching a mixed class of CS and philosophy undergrads. The goal is to make them see why the Church-Turing Thesis (CTT) is epistemologically interesting, not just a definition. 

  First, I need to map out the session structure. Starting with the informal-formal gap seems essential. The students have used TMs as tools but never questioned why they match "mechanical procedures." So the first step is to force that distinction. Maybe begin by asking them to define "algorithm" in their own words? That could surface the disconnect.

  Next, separating CTT into mathematical, physical, and psychological claims. The convergence of formalisms is solid math, but that doesn't resolve if TMs capture all physically possible computations. For the physical aspect, a relativistic hypercomputer example might work better than quantum computing since quantum's relevance is often misunderstood. Drawing a simple spacetime diagram of a computer using time dilation could make it concrete. 

  The Busy Beaver function is a good choice because it's clearly uncomputable but definable. Pairing it with a hypercomputer scenario should highlight the epistemic gap: we can describe a device that *seems* to compute it, but is that physically possible? 

  For misconceptions: 
  - "Turing proved it" → Clarify his paper only showed equivalence between formalisms. 
  - "Quantum computers break CTT" → Emphasize BQP ⊆ PSPACE and the uniformity requirement. 
  - "Physical version is well-confirmed" → Point out we've never built a hypercomputer, so confirmation is indirect. 

  The calibration principle framing might be too abstract. Instead, stress that CTT licenses inferences (e.g., "this function is uncomputable") but doesn't prove physical limits. 

  End with a question: "Why doesn't the failure to find a counterexample prove CTT?" This tests if they grasp the definitional retreat problem. 

  Confidence note: I'm least sure about handling the physical thesis. Students might overly focus on sci-fi scenarios. Need to keep it grounded in current physics.
answer: |-
  1.  **Board: "Algorithm" vs. "Turing Machine" (Informal/Formal Gap):** Start by asking students to briefly describe what an "algorithm" or "mechanical procedure" *is*, in their own words. Write key descriptors. Then write the formal TM definition. Point out the stark difference: one is an intuitive pre-theoretic concept, the other is a precise mathematical object. Ask: "What *authorizes* us to say these capture the same thing? How could we ever check?"

  2.  **Board: Three Theses & Their Evidence:** Write: "Mathematical CTT: TM ≡ λ-calc ≡ ... (Evidence: Proofs of equivalence)." "Physical CTT: No physically realizable system computes beyond TMs (Evidence: ???)." "Psychological CTT: Human mathematicians don't compute beyond TMs (Evidence: ???)." State: "The *mathematical* thesis is proven. The others aren't. Our focus: *Physical* CTT's evidence."

  3.  **Carrying Example: Busy Beaver & Relativity:** Draw a simple spacetime diagram. Explain the Busy Beaver function BB(n) (undecidable by TM). Propose a "Relativity Hypercomputer": A machine traversing a path near a black hole, experiencing extreme time dilation relative to Earth. Its internal clock ticks slowly; Earth waits millennia. It runs a TM for BB(1000) for (what it experiences as) a few minutes, outputs answer. *Is this physically possible?* BB(n) is concrete, uncomputable, non-oracular; relativity exploits known physics.

  4.  **Why This Example? Licensing & Retreat:** Ask: "Does the *mathematical* CTT tell us BB(1000) *isn't* computable by this machine?" (No, math CTT is about formalisms). "If we built this and it worked, would we say it computes BB(1000)? Or say it's not a 'mechanical procedure'?" Highlight the licensing role (math CTT doesn't license claims about *this* machine) and definitional retreat (changing "mechanical" to exclude working hypercomputers).

  5.  **Misconception Handling:** *"Turing proved it"*: Note his paper proved equivalence of formalisms, not the physical thesis. *"Quantum breaks it"*: Emphasize quantum computes *within* TM limits (BQP ⊆ PSPACE); it doesn't solve uncomputable problems. *"Just unproven"*: Stress "thesis" signifies a claim about *physics/mind*, not math lacking proof. *"Well-confirmed science"*: Ask "What experiment *directly* tested it? We've never seen hypercomputation. Evidence is *indirect*: failure to find counterexamples + physics models *assuming* CTT hold."

  6.  **Reframing Calibration:** Avoid "calibration principle" initially. Instead, frame CTT as a **bridge principle**: "It's the rule that lets us take a proven *mathematical* result (like 'BB(n) is TM-uncomputable') and apply it to the *physical* world as 'BB(n) is mechanically uncomputable.' The question is whether this bridge is justified, and on what grounds (convergence? failed counterexamples?)."

  7.  **Closing Question & Scope Limit:** Ask: **"Why isn't the consistent failure to find a physical hypercomputer considered conclusive proof of the physical CTT?"** (Targets definitional retreat/concept elasticity). State: "We *won't* answer whether CTT is true today. We *are* clarifying *why* it's a deep philosophical question about the relationship between math, physics, and our concepts, not a quibble or just semantics."

  8.  **Confidence Note:** Moderately confident (75%). Least sure about **Item 5 (Misconceptions)**, particularly the "well-confirmed science" rebuttal. Students might struggle to see the difference between *indirect support* and *conclusive proof*, and the argument hinges on the *kind* of evidence physics provides (models vs. direct falsification attempts). Need clear, simple phrasing.
