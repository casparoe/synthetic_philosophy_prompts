  ### 2. Activity Timeline Table
  | Phase          | Minutes | What participants do                                                                 | What I do                                                                                                | What should start to feel wrong                                                                 |
  |----------------|---------|--------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------|
  | Setup & Roles  | 0-5     | Get roles (Assertor/Attacker), draw 5 cards, take tokens.                            | Explain only: roles, card types (no strategy), turn rules. Keep constructivism secret.                   | Confusion over roles ("Why can't I play that card?"). Point tracking feels fiddly.             |
  | Turn 1-3       | 5-15    | Assertor starts: plays Demand Proof, TND, or Pass. Attacker responds (e.g., Admit Ignorance). Repeat. | Keep time (60s/turn). Referee card play. Gently enforce: "Attacker, you can only play Force Choice if TND is active." | Assertor realizes they can't "prove" the claim exists—only delay with TND. Attacker feels stuck demanding the impossible. |
  | Mid-Game       | 15-35   | Aggressive demands: Attacker uses Demand Counterexample; Assertor retaliates with TND. Force Choice played on old TNDs. | Track TND debts (tokens on cards). Announce scores. Hint: "TND gives points now, but what if you’re forced to pick a side?" | Players see TND as a "get-out-of-jail" card but panic when Force Choice demands proof. Scores swing wildly from TND debts. |
  | Stalemate      | 35-45   | Both avoid demands; play Pass or Admit Ignorance to minimize losses. Few TNDs played. | Intervene: "Demands are risky, but the game rewards forcing your opponent to act." Push for TND plays. | Players feel the claim is "obviously true/false" but can’t cash it—frustration grows. "Why can’t we just say one of us is right?" |
  | Endgame        | 45-50   | Concede or tally scores. Winner has more points.                                     | Declare winner. Ask: "Did anyone prove the claim? Why not?"                                              | Winner won on points, not truth—feels unsatisfying. Debrief needed.                            |
  | Debrief        | 50-60   | Discuss: "What blocked you from settling the claim?" Share frustrations.             | Map to formal points (use debrief_map). Reveal "constructivism" and its rejection of unproven disjuncts. | Some miss the philosophical link; tie it back to their TND debts and failed proofs.            |

  ### Key Predictions & Notes
  - **First-Time Issues**: Players will hoard Demand cards to avoid point losses, causing stalemates. Fix by imposing a turn timer (use phone alarm) and rewarding aggressive play ("Demands pressure your opponent!").
  - **Unstageable Element**: The game can’t show **why** constructivists demand evidence for disjuncts—only that unproven disjuncts incur debt. Verbally explain: "Constructivism says truth requires explicit verification; you can’t use 'either P or not P' as a free pass without evidence for one side."
  - **Why It Works**: Players experience the gap between intuition ("Goldbach must be true/false") and proof (no one can provide evidence). TND’s debt mirrors the "cost" of non-constructive logic in math.
