  To answer (a): Yes, a cascade (lock-in) occurs when the chain hits a unanimous tally. The process is a Markov chain with two absorbing states and two transient states. It will be absorbed almost surely.

  ### Third Part: Taxonomy Check

  We want to separate:

  1. **Informational cascade proper**: This is the phenomenon in the standard model (and our windowed variant) where agents ignore their own private signals and follow the crowd because the public information (from the history) is so overwhelming that their signal cannot overturn it. The lock-in in the windowed variant is of this type.

  2. **Payoff externality (without information)**: Agents' payoffs depend directly on how many others choose the same action. For example, network effects: you want to use the same software as others. This is not about learning; it's about coordination. In this case, matching is rational even without any private signals.

  3. **Reputational concern**: Agents care about being perceived as competent. Deviating from the majority might be costly because it might signal incompetence. This is distinct because the agent's utility depends on the assessment of their ability. This can lead to herding even when the agent's private signal is strong. 

  The lock-in in the windowed variant is an informational cascade (type 1). The agents in the unanimous state ignore their private signal because the public information (from the three unanimous actions) is so strong that even with their private signal, they choose the majority action. There is no payoff externality or reputational concern in the model as described.

  The third type (reputational concern) is a distinct mechanism. It is not just the first with an extra term in the payoff. In the reputational model, the agent might know the true state but still choose the majority action to avoid being blamed for a mistake. In the informational cascade, the agent chooses the majority action because they believe it is more likely to be correct. Therefore, the mechanisms are different.

  ### Summary of Key Points:

  - **First Part**: The tension is resolved by noting that the convergence of the public belief (martingale) does not imply convergence to the truth when signals are bounded. The lock-in (cascade) happens when the belief crosses a threshold, and then the action is fixed. The limit of the martingale may be incorrect with positive probability in the bounded case.

  - **Second Part (a)**: In the windowed variant, a cascade (lock-in) occurs when the tally of the last three actions becomes unanimous. The process is a Markov chain with two absorbing states (unanimous tallies) and two transient states. Absorption (hence lock-in) is almost sure.

  - **Second Part (b)**: There is no single public belief that incorporates all historical information. The public information is the current tally, which is the state of a Markov chain. The chain converges to an absorbing state, but there is no martingale structure because there is no filtration.

  - **Second Part (c)**: The naive calculation (treating each action in the tally as an independent signal) is illegitimate because an action may have been taken in a cascade state (and hence uninformative) or in a non-cascade state (informative). However, in the windowed variant, the non-unanimous states are transient and in these states, the actions are informative (because the agent uses their signal). But the actions are not independent. This breaks the naive picture, but the cascade result (lock-in) still holds.

  - **Third Part**: The lock-in in the windowed variant is an informational cascade (type 1). The third mechanism (reputational concern) is distinct.

  Finally, regarding the Markov-chain observation in 2(a): It is a genuine alternative to the martingale picture in the sense that the convergence is driven by the absorbing states of a Markov chain and not by a martingale property (because there is no filtration). However, in the full-history model, the Markov chain over the states of the system (which would be the entire history) is not finite and the martingale argument is used. In the windowed variant, we have a finite Markov chain and absorption is guaranteed by the theory of finite Markov chains. So it is a different method of proof, but the outcome (lock-in) is similar.

