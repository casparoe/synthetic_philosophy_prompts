  But note: the tally we observe (say, two A and one B) could have been generated in multiple ways. For example, the two A's might have been generated by agents in a cascade (if the tally they observed was unanimous) or not. However, in the window of three, if we are in state (2,1), then the actions were taken by agents who observed a state that was not (3,0) or (0,3) (because if they had observed a unanimous tally, they would have followed and the state would have remained unanimous). Therefore, the actions in the tally that we see in (2,1) or (1,2) must have been taken by agents who were not in a cascade? Not necessarily, because the state might have changed. 

