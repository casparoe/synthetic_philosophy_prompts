  We are addressing three main parts: 

  First, clarifying the apparent tension between the convergence of beliefs in the Bayesian observational learning model with unbounded signals versus the formation of incorrect cascades with bounded signals.

  Second, analyzing a variant of the model where agents only observe the last three actions (as a tally, without order) and addressing three sub-questions (a, b, c).

  Third, a taxonomy check for three types of social influence.

  Let's proceed step by step.

  ### First Part: The Apparent Tension

  In the standard model:

  - **Martingale Convergence**: The public belief (the posterior probability of the true state given the entire history of actions) is a martingale with respect to the filtration generated by the history of actions. By the martingale convergence theorem, it converges almost surely to some random variable. 

  - **Unbounded Signals**: If the private signals are unbounded (meaning that the likelihood ratio can be arbitrarily large or small), then the public belief converges to the truth (i.e., 1 in the true state and 0 in the false state). In this case, learning is complete and no cascade (in the sense of a permanent incorrect lock-in) occurs because eventually, a sufficiently strong signal will break any temporary consensus.

  - **Bounded Signals**: If the private signals are bounded (meaning that the likelihood ratio is bounded away from 0 and infinity), then with positive probability the public belief converges to a value that is not 0 or 1. This means that the population may settle on the wrong action (a wrong cascade) and once a cascade starts, all subsequent agents ignore their private signals and follow the cascade. Therefore, the private signals after the cascade begins are never revealed in the actions.

  The key to resolving the tension is to note:

  1. **What converges?** The public belief (a martingale) converges almost surely to some limit, say, L. This limit L is a random variable that takes values in [0,1]. In the unbounded case, L is either 0 or 1 (almost surely). In the bounded case, L can be strictly between 0 and 1 with positive probability.

  2. **What gets locked in?** In the bounded case, when the public belief becomes sufficiently extreme (above a threshold for one action or below for the other), agents start ignoring their private signals and follow the majority (or the established trend). This is called a cascade. Once a cascade starts, all subsequent agents take the same action regardless of their private signal. Therefore, the action sequence becomes uninformative after the cascade begins. The lock-in is of the action (everyone takes the same action from that point on). 

  3. **Why can convergence be to the wrong value?** The martingale convergence theorem tells us that the belief converges, but it does not guarantee that the limit is the truth. With bounded signals, the accumulated evidence from the finite history (before the cascade) may not be sufficient to push the belief to the extreme of the true state. In fact, there is a positive probability that the finite history leads to a public belief that is above the threshold for the wrong state. Once that happens, a wrong cascade starts and the belief remains stuck at that level (because no new information is incorporated). Therefore, the limit L may be, say, 0.7 when the true state is 0, meaning that the public belief is 0.7 for state 1 (if we let state 1 be the one that is actually false) and hence the wrong action is taken.

  The step that does the work is the boundedness of the signals. Specifically, in the bounded signal case, the total amount of information that can be extracted from any finite number of signals is bounded. Therefore, there is a positive probability that the finite history (before the cascade starts) leads to a public belief that is on the wrong side of the decision threshold. Once the cascade starts, no further information is revealed, so the belief cannot be updated and remains at that level.

  ### Second Part: The Windowed Variant (only last three actions)

  We now consider a model where each agent observes only the tally (i.e., the count) of the last three actions (for example: 3-0 in favor of A, 2-1, 1-2, or 0-3 in favor of B). The agent does not see the order or anything about earlier actions. We fix p=0.6.

  **(a) Does a cascade occur? Can the process be characterized cleanly?**

  Yes, a cascade in the substantive sense (a point after which actions carry no information about the private signals behind them) can still occur. Specifically, if the last three actions are unanimous (either 3-0 for A or 0-3 for B), then the next agent will ignore their private signal and follow the crowd. Why? Because the evidence from the three unanimous actions is so strong that even a contrary private signal (with p=0.6) will not overturn it. 

  However, note that in the non-unanimous tallies (2-1, 1-2), the agent will use their private signal. Therefore, the state of the system (the tally of the last three actions) is a Markov chain with states: 
  - State 0: (3,0) [all A]
  - State 1: (2,1) [two A, one B]
  - State 2: (1,2) [one A, two B]
  - State 3: (0,3) [all B]

  The transitions depend on the new action and the current state. Since the state only depends on the last three actions, and the new action depends only on the current state and the private signal, the chain is Markov.

  The absorbing states are the unanimous ones: (3,0) and (0,3). Because if we are in (3,0), then the next agent will choose A regardless of their signal. Then the new state will be (3,0) again (because we drop the oldest action and add the new A, so we still have three A's). Similarly for (0,3). 

  Therefore, once the chain hits (3,0) or (0,3), it stays there forever. This is lock-in. Moreover, because the chain is finite and irreducible except for the absorbing states, it will almost surely be absorbed in one of these two states. 

  But note: the lock-in might be wrong. For example, if the true state is B but by chance the last three actions were all A, then the chain is absorbed in (3,0) and everyone chooses A forever, even though B is correct.

  So, we have a cascade in the sense that once a unanimous tally occurs, the action becomes fixed and no private signal is used thereafter. The process can be characterized as a Markov chain on four states, two of which are absorbing.

  **(b) Is there still such a thing as *the* public belief?**

  In the full-history model, the public belief is the posterior probability of the state given the entire history. In this windowed variant, agents do not have access to the entire history. Each agent sees only the last three actions (as a tally). Therefore, there is no single public belief that incorporates all the information from the beginning. Instead, each agent forms a belief based on the current state (the tally of the last three actions) and their private signal. 

  The Markov chain state (the tally) is the public information available to the agent. However, note that the state of the Markov chain does not capture the entire history; it only captures the last three actions. Therefore, the belief of an agent is:

     P(state | tally, private signal) ∝ P(tally | state) * P(private signal | state) * prior.

  But note: the tally is generated by the actions of the previous three agents, who in turn based their actions on their own private signals and the tally they observed. Therefore, the likelihood P(tally | state) is not straightforward because the actions are endogenous. 

  To compute P(tally | state), we must account for the decision rules of the previous agents. This is complex because the chain of dependencies is broken by the window. However, because the state of the Markov chain (the tally) is the only public information, and the chain is Markov, we can in principle compute the stationary distribution of the chain conditional on the true state and then use that to compute the belief. But note: the chain is not stationary until absorption, and the initial conditions matter. 

  In practice, for an agent at time t, the likelihood of the current tally (say, two A and one B) depends on the true state and the entire path of the chain up to time t. But because the chain is Markov and we have a fixed decision rule, we can compute the transition probabilities conditional on the state and then the probability of being in a given state at time t conditional on the state. However, this is a non-trivial calculation.

  Moreover, note that the state of the chain does not form a filtration (because the information is not nested: the state at time t does not contain the state at time t-1). Therefore, there is no martingale in the sense of a single process that is adapted to a filtration and converges. However, the Markov chain itself will converge to an absorbing state almost surely. So convergence happens but without a martingale structure.

