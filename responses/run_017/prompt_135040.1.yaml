answer: |-
  ## Dissertation Proposal: Swap-Robustness as the Ground of Benign Idealization

  **Core Question:** Under what conditions do false but benign idealizations retain key predictive successes when replaced with *incompatible*, alternative false assumptions (swap-robustness), and does this robustness, rather than predictive success alone or de-idealization potential, explain their acceptance?

  **Problem & Gap:** The Friedman position (predictive success justifies false assumptions) and its dominant critique (assumptions must be "approximately true" or derivable from truer theories) share an implicit assumption: a path of de-idealization exists, converging towards a more fundamental truth (e.g., ideal gas → van der Waals → statistical mechanics). This assumption holds in physics but fails in domains like theoretical ecology or economics, lacking unified background theories. Here, the debate deadlocks: Friedmanians point to prediction; critics point to falsity. Neither framework adequately explains why *some* false assumptions are tolerated while others invalidate models in these "theory-sparse" domains. The gap is a criterion for benignness independent of inaccessible de-idealization or prediction alone.

  **Thesis:** Benignness arises not primarily from prediction *or* latent truth, but from **swap-robustness**. An idealization is likely benign if core model successes persist when it is swapped for alternative, incompatible idealizations capturing different distortions. This robustness signals the model captures an invariant core insensitive to specific idealization details. Where de-idealization is impossible, swap-robustness provides the operationalizable criterion currently missing.

  **Method (Case-Based, 12 Months):**
  1.  **Month 1-2:** **Framing & Literature:** Deepen critique of Friedman/de-idealization arguments in theory-sparse contexts. Define "incompatible swap" rigorously (e.g., altering core causal structure or mathematical form, not just parameter tweaks).
  2.  **Month 3-4:** **Physics Case (De-idealization Works):** Select a canonical idealization (e.g., frictionless planes in Newtonian mechanics). Demonstrate successful de-idealization path (incorporating friction). *Test Swap-Robustness:* Swap "frictionless" with an *incompatible* false assumption (e.g., constant non-zero friction *of a different type*). Does core success (e.g., momentum conservation principle) survive in relevant domains? Likely yes, showing robustness *coincides* with de-idealization potential.
  3.  **Month 5-6:** **Ecology Case (De-idealization Fails):** Select a core idealization (e.g., Lotka-Volterra's *linear* functional response for predation). Demonstrate the lack of a single "truer" background theory for de-idealization. *Test Swap-Robustness:* Swap linear response with incompatible alternatives (e.g., Type II saturating response, Type III sigmoidal response). Do key qualitative successes (e.g., predator-prey cycles, stability conditions) persist across swaps under relevant conditions?
  4.  **Month 7-8:** **Analysis & Contrast:** Compare results. Did robustness hold in both cases? Did it hold *despite* the absence of de-idealization in ecology? Analyze *which* successes survive swaps and under what constraints.
  5.  **Month 9-10:** **Theory Development:** Formalize the concept of swap-robustness. Articulate conditions for its application (types of swaps, scope of successes). Argue for its primacy in assessing benignness where de-idealization is blocked.
  6.  **Month 11-12:** **Drafting & Synthesis:** Write dissertation chapters synthesizing case results, theoretical argument, and implications for methodology in theory-sparse sciences.

  **Expected Outcomes (Positive Result):**
  1.  Clear evidence of swap-robustness in both the physics and ecology cases for core model successes.
  2.  A robust theoretical framework defining swap-robustness and demonstrating its ability to resolve the deadlock in the Friedman debate for theory-sparse domains.
  3.  A novel criterion for evaluating idealizations that is operationalizable even without background theories.

  **What Counts as Failure:**
  1.  Core model successes consistently *fail* to survive incompatible swaps even in paradigmatically "benign" cases (e.g., frictionless planes).
  2.  Swap-robustness shows no discernible pattern or fails to distinguish intuitively benign from problematic idealizations in the ecology case.
  3.  The concept proves impossible to define rigorously ("incompatible swap" remains vague or unworkable).

  **Scope & Honesty:**
  This is a foundational, not exhaustive, project. One year permits deep analysis of only *two* contrasting cases. While results will challenge existing positions and propose a new criterion, they won't:
  *   Survey all sciences.
  *   Provide a quantitative metric for robustness.
  *   Resolve all metaphysical questions about models and truth.
  The goal is to demonstrate the *viability and promise* of swap-robustness as a crucial missing piece in the puzzle of scientific idealization, particularly outside physics, setting the stage for broader future research. Success hinges on the careful selection and analysis of the two core cases.
