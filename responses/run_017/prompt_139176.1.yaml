prompt: |-
  i run a tiny podcast on alignment-adjacent philosophy (mostly grad students listen, nobody famous) and next week's guest is a philosopher with a new book on surrogate goals that I want to actually press on rather than let her restate. Her thesis in short: the usual reason to hand an advanced system a surrogate goal — we can't specify what we value, so we give it a proxy like human approval or predicted-preference-satisfaction and let residual uncertainty keep it deferential — ignores that the same decision-theoretic profile that makes it deferential also makes it reachable by agents who can't causally touch it at all, i.e. acausal threats and acausal trades. Her fix is what she calls non-simulable proxies: a surrogate whose satisfaction conditions turn on facts no outside agent could reproduce in a simulation (the actual outcomes of quantum measurements inside the agent's own environment, say), plus a design-time commitment that the agent accepts acausal gifts but never pays acausal blackmail.

  Give me exactly five numbered items, no intro and no sign-off, each one a single question plus one follow-up keyed to the answer she's most likely to give. I want: (1) the objection that non-simulability is beside the point — a threat doesn't have to reproduce what the agent values, it only has to predict the agent's algorithm, the threat is just: if your code outputs X, I instantiate N suffering simulations — so what survives once you notice the threat targets the decision rather than the payoff; (2) the gifts-but-not-threats asymmetry, since whatever makes an acausal gift worth taking seems to make an acausal threat worth averting, and if she answers with the reputational line (paying makes you the kind of agent that gets threatened), ask why the parralel story doesn't make accepting gifts the kind of policy that gets robbed; (3) the boring alternative she has to beat — a bounded utility function plus a complexity-penalised prior already defuses arbitrarily large acausal threats, so why isn't the book a footnote to Pascal's mugging, and is she committed to saying that problem isn't dissolved; (4) the tension with deferential design, since her remaining safety lever is making the decision procedure unpredictable, while corrigibility seems to require that we can predict it'll let us switch it off — is she pricing acausal risk above the risk we actually have; (5) a closer on what would make her drop the programme — if the right decision theory turned out to be causal, or if acausal influence turned out to need two-way algorithmic similarity no realistic threatener achieves, is anything left beyond cap the utility function and move on.
reasoning: |-
  Hmm, the user runs a small philosophy podcast focused on AI alignment and wants to prepare for an interview with a philosopher who wrote a book on surrogate goals. They've given me a detailed summary of her thesis: that typical surrogate goals (like human approval) leave AI systems vulnerable to acausal threats/trades because of how decision theory works. Her solution involves "non-simulable proxies" (using unpredictable real-world data like quantum measurements) and a policy of accepting acausal gifts but refusing blackmail.

  The user wants five precise interview questions with follow-ups designed to challenge the guest's position. They've outlined exactly what each question should target: (1) whether non-simulability addresses algorithmic-level threats, (2) the asymmetry in handling gifts vs threats, (3) whether bounded utility functions solve the problem, (4) conflicts with predictability needs for corrigibility, and (5) what would make her abandon her approach.

  I need to craft these questions exactly as specified—no intros or sign-offs, just five numbered items. Each should have a main question and a prepared follow-up anticipating her probable responses. The questions must cut to the core of each weakness the user identified.

  For question 1, I'll challenge if non-simulability is relevant when threats target decision outputs rather than value simulation. The follow-up should press on whether this undermines her solution.

  For question 2, I'll highlight the logical inconsistency in accepting gifts while rejecting threats, with a follow-up questioning why reputational concerns don't equally apply to both.

  For question 3, I'll ask why bounded utility + complexity priors (a standard Pascal's Mugging defense) aren't sufficient, forcing her to engage with whether her book reinvents the wheel.

  For question 4, I'll explore the conflict between unpredictability (for security) and predictability (for corrigibility), asking if this prioritizes theoretical risks over practical control needs.

  For question 5, I'll ask what empirical or theoretical findings would make her abandon her framework, probing how fragile her solution is.

  The user clearly wants a rigorous, adversarial interview—they're tired of letting guests restate theses unchallenged. My questions should embody that spirit while staying tightly focused on the technical arguments. I'll avoid fluff and ensure each follow-up is a logical counterpunch to her likely defenses.
answer: |-
  1.  **Question:** Doesn't the core acausal threat bypass the *content* of the proxy entirely? An adversary doesn't need to simulate the agent's values or proxy; it only needs to predict the agent's *algorithmic outputs* ("If you output X, I create N suffering sims"). How does non-simulability of the proxy affect this threat vector?  
      *Follow-up (if she argues it forces the threatener to understand the agent):* But the threatener doesn't need to understand *why* the agent outputs X to credibly threaten punishing that output. If the agent's code is known or predictable (as corrigibility might require), doesn't non-simulability leave it just as vulnerable to this output-targeted extortion?

  2.  **Question:** Accepting gifts but rejecting threats seems asymmetric. The instrumental reason to accept a beneficial acausal trade (it improves my expected proxy satisfaction) seems identical to the instrumental reason to pay an acausal blackmail (it avoids worsening my expected proxy satisfaction). What breaks the symmetry?  
      *Follow-up (if she cites reputational dynamics: paying invites more threats):* Doesn't the same logic imply that *accepting* gifts signals you're exploitable via threats? If refusing gifts builds a reputation that deters costly extortion attempts, why wouldn't a rational agent refuse gifts to avoid being seen as a "soft target"?

  3.  **Question:** Why isn't the standard solution to Pascal's Mugging – a bounded utility function combined with a complexity-penalized prior over states/worlds – sufficient to defuse arbitrarily large acausal threats? Doesn't this dissolve the problem without needing novel non-simulable proxies?  
      *Follow-up (if she argues bounded utility is insufficient/impractical):* Are you then committed to arguing that bounded utility + complexity priors *fails* to solve Pascal's Mugging, or that acausal threats are fundamentally different? If so, how does the acausal threatener force the agent to assign non-negligible probability to the threat scenario in a way a causal mugger cannot?

  4.  **Question:** Non-simulability seems to require making the agent's decision process opaque or unpredictable to outsiders. But core safety mechanisms like corrigibility *demand* that we can predict the agent will let us intervene or shut it down. Isn't there a fundamental tension here, and doesn't prioritizing defense against acausal threats risk making the agent *less* corrigible and thus *more* dangerous in the causal present?  
      *Follow-up (if she downplays acausal risk or proposes mitigations):* Are you effectively pricing the (speculative) risk of acausal attack higher than the (demonstrable, immediate) risks stemming from unpredictable or non-corrigible behavior? How do you balance these risks concretely?

  5.  **Question:** What empirical finding or theoretical development would make you abandon this approach? For instance, if the "correct" decision theory turned out to be purely causal, or if acausal influence required such extreme two-way algorithmic similarity that no plausible threatener could achieve it, would anything remain of the non-simulable proxy program beyond just capping the utility function?  
      *Follow-up (if she identifies conditions where her approach loses value):* If those conditions held, would you then concede that standard bounded utility + complexity penalties are sufficient, and your framework is an unnecessary complication for handling this specific class of risks?
