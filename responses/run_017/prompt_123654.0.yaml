prompt: |-
  I would like help reconstructing the implicit metaphysics of an institutional practice that I think quietly takes a stand on a question most of the people operating it would deny having an opinion about: how a person persists through time.

  Start from this practice, which I will describe rather than cite, since the legal details vary and are not what I am asking about. Assume a jurisdiction of the following shape. A competent adult may record instructions that are to govern what is done to her later, at a time when she is no longer competent: a living will refusing ventilation or assisted feeding in specified circumstances, a durable power of attorney naming a surrogate, and — in mental health law — the so-called Ulysses arrangement, in which someone with recurrent mania or psychosis authorizes in advance the very treatment she knows she will later refuse. Two features of how such instruments are in fact handled strike me as doing philosophical work.

  The first is the direction of authority. The earlier instruction overrides the contemporaneous, sometimes vehemently opposed wishes of the later patient: the woman with advanced dementia who is, by all reports, contented and says she wants to go on living; the manic patient who feels magnificent and demands discharge. It overrides them *because* the later patient is judged incompetent. Yet a competent patient may revoke any such instruction at any time, for any reason or none at all, and that revocation is treated as conclusive even when it contradicts everything she earlier said she valued. So the power to speak for the person tracks a capacity ascribed to a stage, not the intensity, coherence, or sincerity of that stage's desires.

  The second is the fallback. Where no instruction exists, surrogates and courts are standardly directed to apply a substituted-judgment test — decide as the patient herself would have decided, on the evidence of her prior values — and to retreat to an objective best-interests test only when those prior values are simply unrecoverable. The best-interests test is treated as a regretted substitute, not as the default.

  Now two further things, which I take to be the genuinely diagnostic part.

  The first is a contrast *within* the law's treatment of earlier and later selves. In property and contract, the earlier self can bind the later self's assets across very long stretches of time — a forty-year mortgage, a use-restriction attached to land long after the person who agreed to it has sold it and moved away — but she cannot bind the later self's body or choices in the same way: courts refuse to compel personal service, and no one may contract into servitude, however freely. The earlier self's authority over the later self's *stuff* is nearly unlimited in duration; her authority over the later self's *person* is not. Medicine appears to run this backwards. A living will or Ulysses directive is precisely an earlier self's control over the later self's body, at its most intrusive — whether to be sedated, restrained, fed, or left to die — and it is honored at a time when the later self is objecting. Is the medical practice an exception to a principle the rest of the law holds, or are the two practices drawing a distinction I am misdescribing?

  The second is a reform I want you to evaluate rather than assume is coherent. Suppose a hospital system adopts what its authors call a stage-relational policy. Once a clinician certifies that a patient has crossed a threshold of psychological discontinuity from the person who executed her directive, the directive is no longer to be enforced *as her own contemporaneous consent*; it is to be enforced as a constraint inherited from a predecessor — the way an easement or a conditional bequest binds someone who never agreed to it — and the later stage is to be registered as a distinct welfare subject whose current experiences receive their own independent weight in the decision, tallied alongside rather than beneath the predecessor's instructions. Call this the temporal-parts reform.

  My question throughout is: what does the existing practice presuppose about persistence — about whether the person is wholly present at each moment of her life (endurantism, as I understand the term) or has temporal parts, with persistence being a matter of earlier and later stages standing in the right relations (perdurantism)? Two sub-questions matter especially. Does the practice *strictly require* one of these, or is the metaphysics underdetermined in the way I suspect, with the real work being done by some normative view about autonomy or practical identity that could be bolted onto either? And does the practice harbour an internal inconsistency — I have in mind the way it seems to use bare biological or organismic continuity to establish that the directive is *hers* at all, in cases like advanced dementia or the permanent vegetative state, while using psychological continuity and narrative to establish *which* stage's values are authoritative? My lay sense is that those are two different theories of personal identity, and I want to know whether the practice is entitled to both.

  Please structure the response as follows, with roughly the indicated lengths.

  **1. The practice restated** — about 100 words. Say back to me, in your own terms, the feature of the practice you take to be doing the metaphysical work, so I can see whether we are looking at the same thing.

  **2. The implicit theory of the person across time** — about 250 words. Reconstruct, as charitably as you can, the view of persons and persistence that would make the practice something other than straightforwardly unjustified. Define endurantism and perdurantism as you go, and any further notion you need (psychological continuity, the simple view, practical identity), rather than assuming the vocabulary.

  **3. Strict presupposition versus comfortable fit** — about 200 words. Separate what the practice cannot make sense without from what merely sits well with it. If several theories of persistence license the same rules, say so explicitly and say what would defeat the underdetermination.

  **4. Two reconstructions compared** — about 300 words. Give the strongest endurantist reading of the practice and the strongest perdurantist reading, and tell me which handles which cases better: the contented demented patient, the manic patient under a Ulysses directive, the patient in a permanent vegetative state, and a patient whose values changed slowly and coherently rather than through pathology.

  **5. The contract and property asymmetry** — about 200 words. Explain whether the law's willingness to let an earlier self bind a later self's assets indefinitely, but not her person, undercuts or supports whatever you reconstructed in section 2, and whether medicine really is an exception.

  **6. What the temporal-parts reform would actually change** — about 250 words. Assess it. Does it alter any outcome the current practice already produces, or only its bookkeeping and its justification? Does making the later stage a separate welfare subject strengthen the case for honoring directives or weaken it — and note the uncomfortable possibility that on a stage-relative view, enforcing a directive against a contented later stage looks like sacrificing one subject for another's peace of mind. Say what the practice would have to look like if the reform were adopted in full seriousness, including anything a hospital would have to start doing that it does not do now.

  **7. Bottom line** — about 120 words. Your verdict: what the practice strictly presupposes, whether it is coherent, and where you think it is philosophically luck rather than principled.

  Two constraints. Do not appeal to what any particular jurisdiction's statute says, or to cases, or to the scholarly literature by name; I want the argument, not the authorities, and I am interested in whether the reconstruction stands on its own. And where the metaphysics does not settle the question, say that plainly instead of stipulating a connection — I would rather be told that the practice floats free of the endurantism/perdurantism dispute than be given a tidy answer that quietly assumes the contested part.
reasoning: |-
  Hmm, this is a fascinating deep dive into the philosophical underpinnings of legal-medical practices. The user is clearly well-versed in philosophy of mind and law, asking about how institutional practices implicitly handle personal identity over time without acknowledging it. They've structured a complex seven-part query about living wills, Ulysses contracts, and property law asymmetries.

  What stands out is how carefully they've framed the paradox: medical practice allows earlier competent selves to control later incompetent bodies (even against contemporaneous wishes), while property law allows binding future asset use but not future bodily autonomy. Their "temporal-parts reform" proposal is particularly clever - treating later dementia patients as distinct welfare subjects inheriting constraints like easements.

  I notice they're suspicious of the system's coherence. Rightly so - the practice does seem to toggle between biological and psychological continuity criteria depending on what's convenient. When establishing that the directive belongs to the patient (e.g., in advanced dementia), it leans on biological continuity. But when deciding whose values count, it switches to psychological continuity and narrative identity. That's philosophically messy.

  For the response, I'll need to:
  First, restate the core tension: medical directives privilege past competent selves over present incompetent ones because capacity is stage-specific, not desire-specific. Then reconstruct the implicit metaphysics - probably a hybrid view where biological persistence anchors identity, but psychological continuity governs authority. Endurantism (whole person present at each time) fits the biological aspect, while perdurantism (person as series of temporal parts) better explains value-authority transfers.

  The contract/property asymmetry is revealing. Medicine isn't an exception but highlights a deeper principle: we treat the body as uniquely non-alienable. You can bind future asset-use because property is external, but future bodily autonomy remains inalienable except when competence is lost - and even then, only via pre-authorization. 

  Their proposed reform would indeed create moral tension by making later stages separate subjects. Enforcing a past self's directive could become sacrificing one subject for another's values. Hospitals would need parallel consent procedures - perhaps requiring next-of-kin approval for overriding directives once discontinuity is certified.

  Ultimately, the practice isn't metaphysically consistent but pragmatically stable. It relies on biological persistence as the "simple view" anchor while delegating authority via psychological continuity. The reform exposes this tension but might create worse problems by fracturing identity entirely. The real work is normative: we privilege competent values over welfare considerations, and see pathological discontinuity as breaking agency rather than identity.
answer: |-
  Here is a reconstruction adhering to your constraints and structure:

  **1. The practice restated**  
  The core feature is that legal-medical systems grant decisive authority to a person's *competent past self* over medical decisions affecting their *incompetent future self*, even when that future self expresses contradictory wishes. This authority terminates instantly upon the return of competence. When no prior directive exists, surrogates must try to reconstruct the patient's *past values* (substituted judgment) before defaulting to objective best interests. The system prioritizes the values of the competent stage over the expressed preferences of the incompetent stage, treating competence as the gateway to authentic decision-making.

  **2. The implicit theory of the person across time**  
  The practice suggests a hybrid view of persistence. It relies on **biological continuity** (the organism persists as the same physical entity from birth to death) to establish that both the directive-maker and the later patient are stages of the same person. This justifies applying the directive to *this* body/person. However, authority over decisions is tied to **psychological continuity** – specifically, the presence of rational decision-making capacity (competence). When robust psychological connections (rational planning, coherent values, self-narrative) are disrupted by pathology like dementia or mania, the *current stage* loses its authority to speak for the person as a whole. The authoritative voice resides in the most recent *competent* stage. This isn't pure endurantism (the whole person existing wholly at each moment) because the incompetent stage is deemed incapable of expressing the "true" whole person. Nor is it pure perdurantism (the person being a series of distinct temporal parts) because the directive binds the *later stage* as if it were binding the same enduring entity, not merely constraining a successor. It views the person as a biologically continuous entity whose *agency* is anchored in competent psychological states.

  **3. Strict presupposition versus comfortable fit**  
  The practice **strictly requires biological continuity** to identify the later patient as the "same person" to whom the directive applies. Without this, the directive wouldn't bind *this* patient. It also **strictly requires psychological discontinuity** (loss of competence) to justify overriding the current wishes; a competent revocation must be honored. The **authority of past competent values** is a strict normative commitment. However, the *underlying metaphysics of persistence* is underdetermined. Both endurantism (the incompetent stage *is* the person but lacks capacity for authentic expression) and perdurantism (the incompetent stage is a distinct temporal part whose preferences are overridden by the competent part's directive) can accommodate the rules. What defeats underdetermination? A case where biological continuity persists, psychological discontinuity is severe (e.g., advanced dementia), but the *past* competent self is also psychologically discontinuous from a *more recent* competent self (e.g., a major, coherent value shift). The practice struggles here, as it implicitly privileges the *last* competent stage, suggesting temporal proximity matters more than narrative depth, leaning towards perdurantism.

  **4. Two reconstructions compared**  
  *   **Endurantist Reading:** The whole person endures through time. Dementia or mania impairs the *expression* of her enduring identity/values; the directive reveals her "true" enduring will. Enforcing it respects her *ongoing* autonomy despite temporary incapacity. Fits the PVS case best (biological continuity anchors identity; no current self exists to override the directive) and cases of slow coherent change (the competent person revokes, expressing her current, whole self). Struggles with the contented dementia patient: Why override her *current* expressed contentment (an aspect of the enduring self) for a past instruction if she is wholly present but impaired? And why is a competent revocation instantly decisive if the enduring self was "present" when making the directive?
  *   **Perdurantist Reading:** The person is a series of temporal stages. The directive is created by a competent temporal part. Loss of competence creates a new, qualitatively different stage. This later stage is psychologically discontinuous enough to lack authority but biologically continuous enough to be bound by the directive. The competent stage's values govern its successor stages *within the same biological life* when incompetence strikes. Fits the Ulysses pact best (explicitly overrides a distinct, pathologically altered stage) and the contented dementia patient (the directive constrains a successor stage whose contentment doesn't reflect the values of the authoritative past stage). Struggles more with slow, coherent change – why can the *current* competent stage instantly revoke the *past* competent stage's directive if both are valid temporal parts? And the PVS case reduces to biological continuity alone.

  **5. The contract and property asymmetry**  
  This asymmetry **supports, rather than undercuts, the reconstruction**. The law distinguishes between binding *external resources* (property, contracts) and binding the *core self* (body, fundamental liberty). Alienating future bodily autonomy (e.g., servitude) is prohibited because the body/person is seen as inalienable *by the competent self*. Medicine isn't a true exception; it's a special case triggered by *incompetence*. Precisely *because* the later self *cannot* competently exercise control over her inalienable body (due to pathology), the system defers to the *last competent self's* instructions regarding it. The duration difference reflects the nature of the thing bound: external assets are inherently alienable and bindable long-term; the core self is not, *except* under the specific condition of future incompetence, where the past competent self's instructions act as a safeguard. The metaphysics of persistence (biological continuity + psychological competence anchoring agency) justifies both the general prohibition and the medical exception.

  **6. What the temporal-parts reform would actually change**  
  The reform would fundamentally alter **justification and deliberation, not necessarily outcomes**. Currently, overriding the directive requires overriding the *patient's own past competent choice*. The reform recharacterizes it as balancing the directive (as a constraint from a predecessor) against the *current stage's welfare*. This weakens the *moral force* of the directive; it's no longer the patient's *own* contemporaneous consent, but a legacy obligation. It strengthens arguments *against* enforcing directives causing suffering to a contented later stage (e.g., dementia patient denied desired food), framing it as sacrificing one subject (current stage) for another's (past stage) values. Hospitals would need **new procedures**: 1) Formal criteria/thresholds for certifying "psychological discontinuity"; 2) A structured process to *independently assess* the current stage's preferences and welfare (even if deemed incompetent); 3) A balancing framework weighing the predecessor's directive *against* the current stage's well-being, rather than the directive being presumptively decisive. Outcomes might change where the directive causes significant distress/harm to a contented later stage, as the current stage's welfare now gets independent, potentially decisive weight.

  **7. Bottom line**  
  The practice **strictly presupposes biological continuity** as the criterion for identifying the "same person" across time and **psychological continuity (competence)** as the necessary condition for exercising personal authority. Its core normative commitment is that **the last competent stage's values are authoritative** over future incompetent stages of the same biological life. While compatible with both endurantist and perdurantist *metaphysics*, it leans towards a **hybrid view**: biological persistence anchors numerical identity, while psychological capacity anchors practical agency and normative authority. The practice is **coherent pragmatically** but **philosophically messy**. The "luck" lies in its reliance on biological continuity to *identify* the person while using psychological discontinuity to *transfer authority*, implicitly treating these as distinct criteria without resolving their potential conflict (e.g., if psychological discontinuity is extreme but biological continuity holds). The reform exposes this tension but creates new ones by potentially fracturing the subject. The practice works by sidestepping deep metaphysics, focusing on competence as the key to valid consent within a biologically continuous life.
