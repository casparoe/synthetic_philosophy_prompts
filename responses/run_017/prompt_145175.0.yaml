  |          | Cooperate | Defect | Withdraw |
  |----------|-----------|--------|----------|
  | **Cooperate** | (3, 3)   | (0, 5) | (0, 2)  |
  | **Defect**   | (5, 0)   | (1, 1) | (1, 2)  |
  | **Withdraw**  | (2, 0)   | (2, 1) | (2, 2)  |  

  - **Prisoner's Dilemma (C/D block)**: \(T = 5 > R = 3 > P = 1 > S = 0\), and \(2R = 6 > T + S = 5\).  
  - **Withdrawal payoff**: \(E = 2\) (satisfies \(P = 1 < E = 2 < R = 3\)).  

  ### (b) Sustainable Cooperation Without Withdrawal  
  **Continuation probability**: Discount factor \(\delta = 1/2\).  
  **Strategy**: Grim trigger (cooperate until a defection; defect forever after).  
  **Incentive constraint**:  
  \[
  R + \frac{\delta R}{1 - \delta} \geq T + \frac{\delta P}{1 - \delta} \implies 3 + \frac{(1/2) \cdot 3}{1 - 1/2} \geq 5 + \frac{(1/2) \cdot 1}{1 - 1/2} \implies 3 + 3 \geq 5 + 1 \implies 6 \geq 6.
  \]  
  Holds with equality; cooperation is sustainable.  

  ### (c) Cooperation Unsustainable With Withdrawal  
  At \(\delta = 1/2\), no subgame-perfect equilibrium sustains perpetual cooperation.  
  **Proof**: Any punishment must inflict at least \(E = 2\) per period on the punished player (they can withdraw to guarantee this floor). The best deviation (to Defect) yields:  
  \[
  T + \frac{\delta E}{1 - \delta} = 5 + \frac{(1/2) \cdot 2}{1 - 1/2} = 5 + 2 = 7.
  \]  
  Cooperation pays \(\frac{R}{1 - \delta} = 6\). Since \(7 > 6\), defection is profitable. Withdrawal caps punishment severity, making cooperation impossible.  
  **Caveat**: Assumes pure strategies and discounting (not limit of means).  

  ### (d) General Condition and Withdrawal Variants  
  **General condition for cooperation**:  
  \[
  \delta \geq \frac{T - R}{T - E} = \frac{5 - 3}{5 - 2} = \frac{2}{3}.
  \]  
  When \(E = P\), this reduces to \(\delta \geq (T - R)/(T - P) = 2/4 = 1/2\) (familiar threshold).  
  **Variants**:  
  - **One-time use**: Cooperation sustainable under original \(\delta \geq 1/2\) (after withdrawal, game reverts to PD; punishment remains severe).  
  - **Costly withdrawal**: If cost reduces effective \(E\) to \(P\), original threshold \(\delta \geq 1/2\) suffices.  
  - **Observable with retaliation**: If withdrawal triggers mutual defection, punishment floor remains \(E\) (since withdrawer still earns \(E\) even if partner defects); deterrence only returns if retaliation pushes payoff below \(E\).  

  ### (e) Asymmetric Withdrawal  
  Only Alpha can Withdraw. At \(\delta = 1/2\):  
  - Both players cooperate in equilibrium (grim trigger deters Alpha: withdrawal pays \(2 + \frac{(1/2) \cdot 2}{1 - 1/2} = 4 < 6\); defection pays \(6\), same as cooperation).  
  - **Outcome**: Cooperation succeeds. Alpha is better off (earns 3) than under mutual withdrawal (2).  

  ### (f) Key Feature and Objections  
  **Key feature**: Withdrawal sets a floor \(E > P\) on punishment payoffs, weakening deterrence.  
  **Objections and replies**:  
  1. *Objection*: "Defensive options build trust; they don’t undermine cooperation."  
     *Reply*: Here, withdrawal objectively caps punishment, making defection more tempting (arithmetic: 7 > 6). Trust is irrelevant without credible penalties.  
  2. *Objection*: "Partners avoid withdrawal to preserve cooperation."  
     *Reply*: Without binding commitments, individual incentives dominate. Withdrawal is non-punitive and always available, so players use it to limit losses.  

  ### (g) Evolutionary Implication  
  In a well-mixed population, mutual withdrawal ((2,2)) replaces mutual defection ((1,1)) as the fallback. While \(E > P\) improves the punishment state, the shadow of the future is weakened: cooperation requires a higher \(\delta\) (\(\geq 2/3\) vs. \(1/2\)). The standard story qualifies—defensive options can stabilize a moderately cooperative but inefficient outcome, hindering full cooperation’s evolution.  

