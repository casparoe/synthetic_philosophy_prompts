prompt: |-
  I write a monthly column for a patient-facing health newsletter, and much of what I do is evolutionary framing for ordinary complaints: why a fever is usually doing something useful rather than merely making you miserable, why nausea in early pregnancy may be protective rather than a malfunction, why a body shaped by scarcity handles an all-you-can-eat buffet so badly. A reader — a retired biology teacher, writing at length and with great confidence, and not at all impolitely — sent a reply saying, in effect, that this whole style of explanation was demolished decades ago, and I'd like his summary of the demolition audited before I either change how I write or write back. His version goes roughly like this: Gould and Lewontin's 1979 paper showed that adaptationist explanations are unfalsifiable, because for any trait at all you can invent a story about why it was useful to our ancestors, and there is no way to test the story — that is why they called it the Panglossian paradigm and why the field treats "just-so story" as a term of abuse. Their positive claim, he says, was that most traits are not adaptations at all but spandrels: architectural byproducts of how an organism is built, like the curved spaces left over when you set a dome on arches, which means the real explanation of biological form lies in developmental constraints rather than in selection. Their methodological demand, on his account, was that adaptive hypotheses be tested against explicit null models and neutral baselines the way neutral theory is tested in molecular evolution, and since then serious evolutionary biologists have largely stopped treating natural selection as the default explanation for anything. A column that says "this is why we have X" is, he concludes, doing pre-Gouldian biology, and the only honest thing is to stop writing it.

  Some of this matches what I half-remember from reading Gould as an undergraduate; some of it sounds stronger than anything I remember him claiming. I am suspicious in particular of "most traits are spandrels," and I have a vague memory that Gould later insisted on separating a trait's historical origin from its current usefulness — which his summary seems to run together, since half my examples involve things that may have started as byproducts and then gotten recruited to a job. I also mentioned the spandrel image to a friend who restores old churches, and she says the spaces at San Marco aren't really spandrels in the architectural sense and that builders chose that arrangement partly because it gives you a good surface for decoration; if that's right, I'm not sure the metaphor carries the weight my correspondent puts on it. And his practical conclusion bothers me independently: even granting the methodological complaint, does it follow that I should stop offering adaptive explanations, or only that I should offer them differently?

  So please go through his summary claim by claim — what a working evolutionary biologist today would accept, what they would call a standard simplification, and what they would say is just a distortion — and tell me whether his conclusion about my column survives once the distortions are corrected. To make it concrete, I've been sorting my examples into a private four-way scheme: (a) traits shaped by selection to do what they now do; (b) traits shaped for one thing and later recruited for another; (c) traits that are incidental consequences of how the organism is built, with no function of their own; and (d) traits that were shaped by selection to do what they now do, but in an environment that no longer exists, so that they misfire here — the salt appetite, the response to calorie abundance. My correspondent says (d) is just (a) and that I've invented a fourth box to smuggle adaptationism back in through the back door. Is he right, or is there a genuine distinction there worth keeping, and how should each of the four be hedged, if at all, in a sentence written for a lay reader?
reasoning: |-
  Okay, the user writes a health newsletter and uses evolutionary explanations for common health issues. A retired biology teacher criticized their approach, citing Gould and Lewontin's 1979 paper. The teacher claims that adaptationist explanations are unscientific "just-so stories," most traits are spandrels, and modern biology has moved beyond such explanations. The user wants to know if this criticism holds up and whether they should change their writing approach.

  First, I need to unpack each part of the teacher's claims. He mentions that adaptationist explanations are unfalsifiable, hence "Panglossian." I recall that Gould and Lewontin did criticize the tendency to invent adaptive stories without testing, but the critique was more about methodology than outright dismissal of adaptation. Modern evolutionary biology still uses adaptive explanations but with rigorous testing. So the teacher's claim that such explanations are entirely invalid is an overstatement.

  Next, the teacher says most traits are spandrels. I remember that Gould and Lewontin used spandrels as examples of non-adaptive traits, but they didn't argue that *most* traits are spandrels. Current understanding is that while spandrels exist, many traits are adaptations or exaptations. The architectural metaphor itself might be flawed since the San Marco spandrels were intentionally designed, which complicates the analogy.

  The teacher also claims that Gould and Lewontin demanded null models like in neutral theory. This is partially true; modern biology does emphasize testing against neutral baselines. But natural selection is still a key explanation when supported by evidence. The assertion that serious biologists have stopped treating selection as the default might be exaggerated. Methods have evolved, but adaptationism isn't abandoned.

  Looking at the user's four categories: (a) direct adaptations, (b) exaptations, (c) spandrels, (d) adaptations mismatched to current environments. The teacher argues (d) is just (a). However, mismatch is a recognized concept in evolutionary medicine. Traits shaped for past environments causing issues now is a valid distinction. Collapsing (d) into (a) ignores the environmental context, which is crucial for explaining modern health problems.

  The user's deeper concern is whether their approach is scientifically valid. They need to communicate complex ideas accessibly without oversimplifying. The teacher's critique might make them doubt their entire framework. But their four categories align well with current evolutionary biology. The key is to present these ideas with appropriate caveats, acknowledging uncertainties and multiple explanations.

  For the newsletter, emphasizing that evolution is not about perfection, mentioning alternative explanations briefly, and avoiding definitive language like "this is why" could help. Phrases like "one possible explanation" or "scientists think" would add nuance. Also, distinguishing between original function and current utility, especially in mismatch cases, is important.

  In conclusion, the teacher's summary has some valid points but overstates Gould and Lewontin's arguments. The user's framework is robust if presented with necessary caveats. They shouldn't stop writing but refine their explanations to reflect contemporary evolutionary biology's nuanced view.
answer: |-
  Based on a thorough analysis of contemporary evolutionary biology, here's a breakdown of your correspondent's claims, the current scientific consensus, and the implications for your column:

  **Claim-by-Claim Audit:**

  1.  **"Gould and Lewontin's 1979 paper showed that adaptationist explanations are unfalsifiable... they called it the Panglossian paradigm... 'just-so story' is a term of abuse."**
      *   **Partial Truth / Standard Simplification:** Gould & Lewontin *did* powerfully critique a *specific style* of adaptationist reasoning prevalent at the time: inventing plausible adaptive stories without rigorous testing, often assuming optimality and ignoring alternatives. They rightly labelled this *uncritical* adaptationism "Panglossian" and popularized the pejorative "just-so story" for such untested narratives.
      *   **Distortion/Overstatement:** They did *not* demonstrate that *all* adaptive hypotheses are inherently unfalsifiable. Modern evolutionary biology relies heavily on generating *testable* adaptive hypotheses. Methods include comparative phylogenetics, experimental evolution, quantitative genetics, measuring fitness consequences, identifying genetic signatures of selection, and (critically) testing against non-adaptive null models (see point 4). The critique was against *poor methodology*, not the *concept* of adaptation itself. "Just-so story" refers specifically to *untested*, speculative adaptive tales, not *all* adaptive explanations.

  2.  **"Their positive claim... was that most traits are not adaptations at all but spandrels... the real explanation... lies in developmental constraints..."**
      *   **Significant Distortion / Overstatement:** This is the core overreach.
          *   **"Most traits are spandrels":** Gould & Lewontin *never* claimed "most" traits are spandrels. They argued that non-adaptive explanations (spandrels, developmental constraints, drift, pleiotropy) had been systematically *neglected* and deserved serious consideration alongside adaptation. They used spandrels as a vivid *metaphor* for traits arising as non-adaptive byproducts. Modern consensus rejects the idea that *most* traits are spandrels. While many traits *involve* constraints or have non-adaptive origins, complex functional traits (like eyes, immune systems, fever pathways) are widely understood as products of selection, even if built upon existing structures with constraints.
          *   **Developmental Constraints as the "Real Explanation":** Developmental constraints are recognized as crucial *boundaries* and *influences* on *how* evolution can proceed, shaping the possible variation selection acts upon. They are not the *primary* or "real" explanation for the *function* or *adaptive value* of most complex traits. Selection operating within constraints is the dominant paradigm.
          *   **The Spandrel Metaphor:** Your church restorer friend is insightful. The original architectural spandrels *were* structural necessities, but they were *subsequently utilized* for decoration. Gould himself later emphasized this "co-option" aspect. Critically, in biology, many traits *originate* non-adaptively (as true "spandrels") but are *later co-opted* for a function (exaptation). The metaphor is useful for highlighting non-adaptive origins but becomes problematic if used to imply traits *currently* serving functions aren't shaped by selection *after* their origin.

  3.  **"Their methodological demand... was that adaptive hypotheses be tested against explicit null models and neutral baselines... serious evolutionary biologists have largely stopped treating natural selection as the default explanation."**
      *   **Partial Truth / Standard Simplification:** This is one of the paper's *most enduring and accepted legacies*. The demand for rigorous testing against null models (like neutral drift, mutation-selection balance, or constraint-based models) is now standard practice in evolutionary biology. Papers proposing adaptive hypotheses are expected to address alternatives.
      *   **Distortion/Overstatement:** While the *default assumption* shifted from "probably adaptive" to "could be neutral/constrained," natural selection remains the *primary explanation* invoked for complex functional traits *when evidence supports it*. It hasn't been "largely stopped" as a default *where it makes sense*. The field is vastly more sophisticated and cautious, but selection is still the central process explaining adaptation. Neutral theory is powerful for molecular evolution but less so for complex organismal phenotypes.

  4.  **"A column that says 'this is why we have X' is doing pre-Gouldian biology... the only honest thing is to stop writing it."**
      *   **Significant Distortion / Overreach:** This conclusion does not survive the audit. While uncritical "this is why" pronouncements *deserve* the "just-so story" label, thoughtful evolutionary explanations, *especially in a health context*, are not only valid but crucial. The key is *how* you frame it.
          *   Modern evolutionary biology hasn't abandoned adaptationism; it has made it more rigorous and nuanced.
          *   Evolutionary Medicine is a thriving field explicitly applying evolutionary principles (including adaptation, mismatch, trade-offs) to understand health and disease.
          *   Your four-way scheme aligns well with contemporary thinking.

  **Your Four Categories & The (d) Question:**

  Your scheme is excellent and reflects modern evolutionary understanding:

  *   **(a) Direct Adaptation:** Still a core concept. **Hedge:** "Shaped by natural selection *for* this function," "likely evolved *because* it provided X benefit in ancestral environments," "evidence suggests this is an adaptation *for*..."
  *   **(b) Exaptation/Co-option:** Widely accepted and important. **Hedge:** "While this trait originally arose for Y reason (or as a byproduct), it was later co-opted *for* its current role in Z," "evolutionary repurposing," "this function appears to be a later addition."
  *   **(c) Spandrel/Byproduct:** A valid category, though likely less common for complex physiological systems than for some morphological features. **Hedge:** "A side effect of how the system is built," "likely not shaped *for* any specific function," "an evolutionary byproduct."
  *   **(d) Mismatch:** A **crucial and distinct concept**, especially for medicine. Your correspondent is wrong to collapse it into (a). **Key Distinction:** (a) implies the trait is *currently* functioning *as designed* by selection. (d) implies the trait is functioning *exactly as designed* by selection, but the *environment it was designed for* has changed, making the formerly adaptive response now maladaptive. **Hedge:** "Shaped by natural selection for a world where...", "an adaptation that misfires in our modern environment," "evolved for circumstances we no longer face."

  **Recommendations for Your Column:**

  1.  **Emphasize "Why *Might* We Have X?":** Frame explanations as hypotheses ("One compelling evolutionary explanation...", "Scientists think this might have evolved because...", "An intriguing possibility is that...") rather than definitive "This is why."
  2.  **Acknowledge Complexity:** Briefly note that evolutionary origins can be complex, involving mixtures of adaptation, constraint, and exaptation. A short phrase like "While the full evolutionary history involves multiple factors..." suffices for lay readers.
  3.  **Distinguish Origin from Current Utility:** Especially for (b) and (d). Make it clear if you're talking about why it *originated* vs. why we *still have it* or why it *causes problems now*.
  4.  **Use Mismatch Explicitly:** This is one of the *most valuable* evolutionary medicine concepts for your audience. Don't shy away from it. Clearly explain the ancestral vs. modern environment discrepancy.
  5.  **Avoid "Optimal" or "Perfect":** Emphasize evolution as a tinkerer, working with available variation and constrained by history, leading to trade-offs (e.g., fever costs energy). It's about "better than the alternative," not "perfect."
  6.  **Keep Your Four Categories:** They are scientifically sound. Use them consciously to add nuance to your explanations.

  **Conclusion:**

  Your correspondent accurately summarizes the *core methodological critique* of Gould & Lewontin – the necessity of rigor and testing against alternatives, and the danger of uncritical storytelling. However, he significantly overstates their *positive claims* ("most traits are spandrels," developmental constraints as the "real" explanation) and draws an overly broad and incorrect *practical conclusion* that adaptive explanations are invalid and you should stop writing your column.

  Evolutionary biology today incorporates Gould & Lewontin's valid methodological criticisms but firmly rejects the idea that adaptation is not a primary force shaping life. Your column's focus on explaining functional traits (including beneficial responses, co-options, and mismatches) is entirely appropriate for evolutionary medicine. **You should not stop writing it.** Instead, refine your framing to reflect the nuance of modern evolutionary biology: present adaptive hypotheses cautiously as explanations supported by evidence and logic, acknowledge complexity where appropriate, clearly separate origin from current function (especially for mismatch), and avoid overly simplistic "just-so" language. Your four-way scheme is an excellent tool for achieving this nuance. Mismatch (d) is absolutely a distinct and vital category worth keeping.
