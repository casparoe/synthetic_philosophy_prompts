prompt: |-
  My friend Dani is the most consistant person I know on duties of rescue, and I want to find out whether her view actually holds together or whether it's just a list of intuitions with a story attached. She's the hardline Singer-style sort: shallow pond, muddy clothes, distance doesn't matter, nobody's special. Here's her track record, roughly as she'd put it:

  - Kid drowning in a shallow pond, you ruin a $200 suit getting her out: "obviously you get in, there's nothing to talk about."
  - 10% of your income to a charity that hands out malaria bednets: "that's not sainthood, that's just what you owe."
  - Your daily $6 coffee: she'll say you should give the money instead, but every time I push her on whether buying it is actually wrong she goes quiet and changes the subject.
  - Donating a kidney to a stranger: "amazing, not required."
  - Everyone in the office is chipping in $20 for a colleague's surgery and everyone does chip in: "yeah, obviously."
  - No duty to vote in a national election even when the other side is much worse, because one vote makes no difference.
  - Jumping into a fast river for a drowning kid at maybe a 1-in-20 risk to her own life: yes. At 50/50: no.
  - Someone else is already wading in and looks like they'll manage: she says you can keep walking.
  - She'd skip a friend's birthday dinner to help a stranger in trouble. She would not skip her sister's wedding.
  - She gives to the bednet charity and not to a local outfit she thinks is ineffective, "because if it doesn't work, what's the point."

  As far as I can tell she has never once been asked about a case where she was the only person who could help and a lot of other people who could have helped were just standing there doing nothing. So:

  (1) Same shallow pond. Two hundred people watching, none of them will move. Going in alone costs you about $2,000, something like a fifth of your income for the year, plus a job interview you can't reschedule for the career you actually want. If they'd coordinated it would have cost each of them ten dollars.
  (2) The pond is on your walk to work every morning for the next thirty years. A different kid each time. Every single rescue costs you a pair of shoes and ten minutes and nothing else.
  (3) You can save the kid: 95% you both get out fine, 5% you drown and your two small kids lose their only parent.

  What does she say about each of those, and what's the rule she's running? More usefully: give me the other rules that fit all her old verdicts just as well, show me where exactly they come apart on these three, and then give me one further case I could put to her that would settle which one she means. I care way more about the rule than about her answers.
reasoning: |-
  Okay, let me tackle this query about Dani's moral framework. The user wants to understand the underlying rule behind her judgments and how it applies to new scenarios. 

  First, I need to analyze Dani's track record. Her positions align with strong consequentialism but show interesting boundaries. The shallow pond case is straightforward: small cost saves a life. The 10% income donation fits Singer's principle where significant but bearable cost is obligatory. 

  But her hesitation on the coffee issue is telling. She avoids calling it "wrong," which suggests a threshold where minimal costs become optional. The kidney donation being "amazing but not required" implies a cost ceiling - bodily sacrifice exceeds obligation. 

  The voting case is puzzling initially, but aligns with expected value: one vote has near-zero impact. River rescue confirms she quantifies risk - 5% mortality acceptable, 50% not. The "already helping" exception shows she considers marginal utility. 

  For the wedding vs birthday conflict, she prioritizes close relationships when costs are comparable. Charity effectiveness shows instrumental rationality matters more than proximity. 

  Now the three new scenarios: 
  (1) Free-rider problem: Should individual obligation increase when others fail? Pure consequentialism says no - the child's need remains unchanged. But fairness instincts might conflict. 
  (2) Repeated rescues: Daily minor costs could aggregate to significant burden. Does frequency transform small costs into large ones? 
  (3) Orphan risk: 5% chance of leaving children parentless. This tests whether personal stakes modify obligations. 

  To distinguish possible frameworks: 
  - Rule utilitarianism might excuse (1) to incentivize collective action 
  - Scalar consequentialism would demand all rescues regardless of others' inaction 
  - A hybrid model with relationship discounts could explain wedding priority 

  The decisive case? Propose saving a stranger versus attending niece's graduation. If she chooses blood over statistically greater need, it confirms special obligations beyond Singer's view. 

  User cares most about rule consistency, so I'll map how each principle handles all cases, highlighting where Dani's verbalized positions might contradict (like coffee vs repeated ponds). The key is finding where aggregated small costs or relational duties create fractures in pure utilitarianism.
answer: |-
  Based on Dani's track record, her core rule appears to be a **Scalar Consequentialism with Cost Thresholds, Marginal Impact, and Relational Discounting**. Here's the breakdown:

  1.  **Consequentialism:** Outcomes are primary (saving lives > cost).
  2.  **Scalar:** "Obligation" is a matter of degree (Kidney: amazing/not required; River: 5% risk yes/50% no).
  3.  **Cost Thresholds:** You *must* act if the cost to you is below a significant threshold relative to the good achieved (ruined suit = trivial cost for life; 10% income = significant but bearable cost for lives saved; kidney/danger = excessive cost). Coffee ($6) likely falls *below* her action threshold *for a single instance* but makes her uncomfortable due to repetition/aggregation potential.
  4.  **Marginal Impact:** You only need to act if *your* action makes the difference (no duty if someone else is effectively helping; no duty to vote due to negligible impact).
  5.  **Relational Discounting:** Close relationships create stronger (or distinct) obligations that can outweigh comparable impersonal good (skip friend's birthday for stranger, *not* sister's wedding).

  **Applying the Rule to Your New Cases:**

  1.  **Shallow Pond with Free-Riders:**
      *   **Her Likely Verdict:** **You must go in.** (Probably reluctantly and angrily about the others).
      *   **Why:** The child's need is identical to the standard shallow pond. The *cost to you* ($2,000, job impact) is high but likely below her threshold for saving a life (she accepts 10% income/year for nets saving multiple lives; $2k is likely less than 10% annual income for most). The *free-riding of others* doesn't change *your* marginal impact or the child's need. Her frustration would be immense, but her principle demands action. Cost is significant but not life-threatening or permanently disabling like a kidney.

  2.  **Daily Pond (30 Years):**
      *   **Her Likely Verdict:** **You must save the kid *every single time*.** (Initially, then likely evolving into despair or seeking systemic change).
      *   **Why:** Each individual cost (shoes, 10 minutes) is *far below* her threshold for saving a life (trivial compared to $200 suit/ruined clothes). The *aggregate cost* (365 prs shoes? 182.5 hours/year) is immense, but her principle is applied *per instance*. Each drowning child presents a discrete, high-impact, low-cost-to-you opportunity. Skipping any single day because it's one of many would violate her core shallow pond intuition. This highlights a tension between act-consequentialism and rule-consequentialism within her view.

  3.  **Pond with Orphan Risk (5%):**
      *   **Her Likely Verdict:** **You must *not* go in.** (Or at least, it's not obligatory).
      *   **Why:** This introduces a *direct, significant, probabilistic cost to dependents you have a strong relational obligation to*. A 5% risk of orphaning your children introduces a massive potential negative consequence that likely pushes the *overall expected cost/risk* far above her threshold. While saving the drowning child is a high good, the potential cost (devastation to your own children) is enormous and directly conflicts with her relational obligation. This cost (orphaning) exceeds the threshold she set with the 50/50 river risk to herself.

  **Alternative Rules Fitting the Old Verdicts & Where They Diverge:**

  1.  **Strict Act Utilitarianism (Maximize Net Good):**
      *   *Fits:* Shallow pond, Bednets (if effective), Voting (no impact), River risks (expected value), Existing helper (no marginal gain), Charity effectiveness.
      *   *Fails:* **Sister's Wedding.** Skipping to help a stranger *should* be obligatory if the stranger's need is greater. **Coffee.** Buying coffee *is* wrong if the money could save lives. **Kidney.** Donating *might* be obligatory if net good increases. *Diverges on New Cases:* **Daily Pond:** Obligatory every time (same as Dani). **Free-Rider Pond:** Obligatory (same as Dani). **Orphan Risk Pond:** *Depends on calculation*: Is 1 life saved * 95% + 0 lives saved * 5% > (Negative value of orphaning 2 children * 5%)?* Dani likely weights the orphan risk very high, pure utilitarianism might not.

  2.  **Rule Utilitarianism ("What if everyone did that?"):**
      *   *Fits:* Shallow pond, Bednets, Coffee (if abstaining became a norm, more charity), Voting (if rule is "vote", it fits; but she says no duty, so "vote only if pivotal" rule?), River risks (complex rule), Existing helper, Charity effectiveness.
      *   *Fails:* **Free-Rider Pond:** If the rule is "save life when cost is low", you should go in. But Rule Utilitarianism might generate a rule like "Only help if others aren't" to punish free-riding or encourage coordination, letting you off the hook. *Dani wouldn't.* **Sister's Wedding:** Rule favoring family ties over strangers fits her verdict. **Kidney:** Rule against extreme bodily sacrifice fits her verdict. *Diverges on New Cases:* **Free-Rider Pond:** *May* say not obligatory (to incentivize coordination/avoid rewarding free-riding). Dani would say obligatory. **Daily Pond:** Rule might evolve to "only save occasionally" to avoid unsustainable burden, letting you skip days. Dani would say save every time. **Orphan Risk Pond:** Rule against risking leaving dependents destitute fits Dani's likely verdict.

  3.  **Cost-Benefit Threshold Model (No Relational Discount):**
      *   *Fits:* Shallow pond, Bednets, Kidney, River risks, Voting, Existing helper, Charity effectiveness.
      *   *Fails:* **Sister's Wedding.** Skipping a wedding (moderate relational cost) to save a life (high benefit) *should* be obligatory if the cost-benefit passes the threshold. Dani says not obligatory. **Coffee.** If $6 is below the life-saving threshold *per coffee*, buying it isn't wrong. This fits her reluctance to call it wrong. *Diverges on New Cases:* **Free-Rider Pond:** Obligatory (same). **Daily Pond:** Obligatory every time (same). **Orphan Risk Pond:** *Depends on threshold calculation*: Is the 5% risk of death (cost to you + cost to kids) > benefit of saving child? Dani's relational view makes the orphan cost paramount, pushing it over the threshold. This model might calculate the Expected Value differently.

  **The Decisive Case to Settle Which Rule She Means:**

  **The Niece's Graduation vs. Effective Charity Donation Opportunity:**
  *   **Scenario:** Your beloved niece is graduating college in another city. Attending means a lot to her and your family. The flight/hotel costs $800. Simultaneously, a rare, time-limited matching grant opportunity arises for the highly effective bednet charity: your $800 donation will be matched 1:1, definitely saving two lives. You cannot do both.

  *   **Why this settles it:**
      *   **For Dani (Scalar Consequentialism + Relational Discounting):** She **attends the graduation.** The relational obligation to her niece (close family) outweighs the significant impersonal good of saving two lives, similar to not skipping the sister's wedding. Saving lives is *owed*, but strong family ties create a *stronger* (or distinct) obligation. The cost ($800) is significant but within the range she accepts for donations (10% income). The *relational* factor is decisive.
      *   **For Strict Act Utilitarianism:** You **must donate the $800.** Saving two lives vastly outweighs the emotional benefit of attending a graduation, even for a close relative. The niece will be disappointed, but not devastated or harmed like the malaria victims.
      *   **For Rule Utilitarianism:** *Ambiguous.* Depends on the rule. A rule like "Honor significant family commitments" supports attending. A rule like "Maximize lifesaving when highly efficient" supports donating. Her sister's wedding precedent strongly suggests she'd generate a rule favoring the family event.
      *   **For Cost-Benefit Threshold (No Relational Discount):** You **must donate the $800.** The cost ($800) is significant but likely below the threshold for saving *two* lives (she pays 10% income for nets saving multiple lives). The relational benefit of attending is unlikely to be valued high enough to counterbalance two lives saved.

  **Conclusion:**

  Dani's rule is best described as **Scalar Consequentialism with Agent-Centered Cost Thresholds, Marginal Impact, and Strong Relational Discounting for Close Ties.** Saving lives is a paramount impersonal duty, but only when the *marginal* cost/risk to the agent is below a significant threshold *and* the agent's action is necessary. Crucially, close relationships create obligations that can override significant impersonal good, even lifesaving, when the relational cost of failing that obligation is high (wedding, graduation). The "Niece's Graduation" case starkly contrasts her view with pure impersonal consequentialism and highlights the strength of her relational discounting. Her discomfort with coffee likely stems from the aggregation problem inherent in act-consequentialism applied to small costs, which the "Daily Pond" case brutally exposes.
