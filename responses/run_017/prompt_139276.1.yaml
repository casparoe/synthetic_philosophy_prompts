  Okay, the user and their roommate had a big argument about Scanlon's contractualism and whether it can handle aggregation. The user read a book from the effective altruism community that criticized contractualism, claiming it can't justify saving five lives over one or buying malaria nets instead of funding a single expensive operation. The user wants to know if the book's critique is fair and has specific questions about cases involving risk and their roommate's proposed fix.

  First, I need to recall Scanlon's core idea: an act is wrong if any principle permitting it could be reasonably rejected by someone affected. The key is that each person's reasons for rejecting a principle are considered individually, not summed up. The book's summary seems mostly accurate but might oversimplify.

  The aggregation problem is central here. Contractualism doesn't allow adding up small harms to outweigh a large harm, which is why in the transmitter case, saving one person from a broken leg outweighs disappointing millions. But the book claims this means contractualism can't explain why saving five lives is better than saving one. Scanlon does have a tie-breaker response: if individual complaints are equally strong, numbers can break the tie. The book dismisses this as insufficient. I should explain why contractualists think this is a feature, not a bug. They argue utilitarianism wrongly trades off severe harms against minor benefits. For life-saving cases, Scanlonians argue that each person has a strong complaint if not saved, so saving more people reduces more serious complaints.

  Now the user's specific cases. First, spreading harm as risk: converting one certain broken leg into a one-in-two-million risk per viewer. Contractualism might see each viewer's tiny risk as not reasonably rejectable, so not interrupting the broadcast seems permissible. But this feels counterintuitive. However, contractualists might counter that principles allowing such risks could be rejected if they systematically disadvantage individuals. The key is whether the risk imposition is acceptable under general principles.

  Second, the roommate's diminishing weight fix. Adding complaints with diminishing marginal weight sounds more like prioritarianism or weighted utilitarianism. While it uses individual complaints, aggregating them violates contractualism's core by summing across persons. Scanlon insists on pairwise comparisons of rejectability. So this fix probably isn't contractualist but a hybrid approach.

  The user wants clarity without citations. Their deeper needs include understanding the philosophical debate's structure, validating their intuition that the book oversimplifies, and resolving the roommate's disagreement. They might also seek reassurance that defending Scanlon is tenable despite EA criticisms. I should present contractualism's strengths and weaknesses neutrally, highlighting where critiques hit home and where they might miss the mark. Emphasizing that aggregation is a genuine challenge but contractualists have responses, even if contested, is key.
answer: |-
  Here's a breakdown of the critique and your specific questions, aiming for conceptual clarity on where the book/your roommate oversimplifies, where contractualists push back, and where the genuine difficulties lie:

  ### Core Contractualism & The Book's Critique
  1.  **"Act is wrong if ruled out by principles no one could reasonably reject"**: **Accurate.** This is Scanlon's core.
  2.  **"Hypothetical contract... if we didn't know who we were going to be"**: **Misleading/Wince.** While Rawls uses the "veil of ignorance," Scanlon **explicitly rejects it.** His contractors *do* know who they are and their specific stakes. The focus is on finding principles *no individual*, given *their actual situation and values*, could reasonably reject *to others*. It's about mutual justifiability, not self-interest behind a veil.
  3.  **"Blocks adding everyone's benefits together. Each complaint weighed on its own"**: **Mostly Accurate (but nuance needed).** This is the core anti-aggregation stance. Contractualism prioritizes the *individual standpoint*. You compare the strength of *one person's reason for rejecting a principle* against *another person's reason for rejecting an alternative principle*. You don't add together the complaints of many people against one person's complaint. This directly targets utilitarianism's summation.
  4.  **TV Transmitter Case (1 broken leg vs. millions missing a game)**: **Accurate Example.** Contractualism says save the guy. His complaint (severe harm) vastly outweighs *any single viewer's* complaint (minor disappointment). Since complaints aren't summed, the millions of tiny complaints don't collectively outweigh the one severe one.
  5.  **"Can't explain saving 5 vs. 1 / Malaria nets vs. named kid"**: **The Core Dispute - Unfair Simplification?**
      *   **Book's Claim:** Contractualism is stuck saying saving the 1 is just as good/bad as saving the 5, or that funding the named kid is better than nets helping thousands anonymously. "Numbers don't count."
      *   **Contractualist Pushback (Scanlon & Defenders):** This is **not obviously true.** Here's the reasoning:
          *   **The Tie-Breaker:** Scanlon *does* formally introduce numbers only as a tie-breaker. If two principles lead to outcomes where the *strongest individual complaint* under each principle is *exactly equal in severity*, *then* you can choose the principle that leaves *fewer* people with a complaint *that strong*. (E.g., saving 1 vs. saving 1? Numbers irrelevant. Saving 1 where the complaint is death vs. saving 5 where each complaint is death? Strongest complaint equal (death) under both options. *Now* save the 5 - fewer deaths/strongest-level complaints).
          *   **Beyond the Tie-Breaker?** Contractualists argue that in the "save 5 vs. save 1" case, the tie-breaker *does* apply **if you frame it correctly.** The principle "Save the smaller group when you can only save one group" *can be reasonably rejected* by each member of the larger group. *Each* of the 5 has a complaint: "Under this principle, I could be left to die *even when saving me imposes no greater burden on the rescuer* than saving the one would." This complaint (being left to die when easily saveable) is *equally strong* for each of the 5 as it is for the 1. Now the tie-breaker kicks in: the principle saving the 5 leaves fewer people with this maximal complaint (death). Therefore, the principle "save the larger group" cannot be reasonably rejected.
      *   **The Genuine Difficulty:** The malaria nets case is **much harder** for contractualism. Why?
          *   **Complaint Asymmetry:** The named kid has a vivid, specific complaint ("*I* wasn't saved!"). Each potential malaria victim helped by a net has a *statistical* complaint ("This principle *raises the risk* I won't be saved" or "*Someone like me* won't be saved"). Contractualists struggle to show that the *individual* complaint about a *probabilistic harm* or *systemic lack of aid* is *strong enough* to outweigh the *certain, direct harm* to the named kid *when comparing principles*. The tie-breaker doesn't obviously apply because the *nature* of the complaints seems different. This *is* a major challenge.
  6.  **"Refuted by the aggregation problem?"** **Conclusion Overreach.** Contractualism *has a distinctive and controversial approach* to aggregation. It *denies* that small benefits sum to outweigh large harms. Whether this is a "refutation" depends entirely on whether you think utilitarianism's aggregation is correct. Contractualists see it as a *virtue* protecting individuals from being sacrificed for the "greater good" of minor gains. Critics see it as a crippling flaw. It's a fundamental philosophical disagreement, not a settled refutation.

  ### Your Specific Cases
  1.  **Transmitter Case with Dispersed Risk (1 expected broken leg via tiny individual risks):**
      *   **Contractualist Tendency:** Likely says **don't interrupt** the broadcast. Why?
          *   Each viewer faces only a *tiny, almost negligible* increased risk of harm. It's hard to see how *any single viewer* could reasonably reject a principle allowing such broadcasts (which provide benefits) given the miniscule individual risk.
          *   The trapped person *does* have a strong complaint against a principle *requiring* broadcasts to continue despite trapping individuals ("This principle subjects *me* to a severe, certain harm for trivial benefits to each viewer").
      *   **The Problem ("flipping the answer"):** This highlights the core anti-aggregation stance. Contractualism seems forced to permit imposing *expected* harms (even large ones) if they are *sufficiently dispersed* so that no individual has a significant complaint. Many find this counterintuitive (e.g., for environmental risks, industrial safety). Contractualists might argue:
          *   We need principles *governing risk imposition*. A principle allowing *any* level of dispersed risk could be reasonably rejected ("This subjects *me* to potential catastrophic harm from countless sources with only minuscule individual benefits elsewhere"). Finding principles that fairly balance individual protection against collective benefits *is* hard for contractualism, but it tries to do it at the level of general rules, not case-by-case summation.
          *   The *certainty* of harm to the trapped person vs. the *risk* to others might still be a factor, but the dispersed nature weakens the individual complaints significantly.

  2.  **Roommate's Diminishing Weight Fix:**
      *   **Is it Contractualist? Almost Certainly Not.** This is **rebuilding (a form of) utilitarianism.**
      *   **Why?** Scanlon's core is the *pairwise comparison of individual complaints* when assessing the reasonable rejectability of *principles*. The "diminishing weight" idea fundamentally relies on **summing complaints across individuals** (even with weights), then comparing the totals. This is precisely the kind of aggregation across persons that Scanlon rejects. It treats the combined weight of many small complaints *as a collective entity* that can outweigh one large complaint. Contractualism insists on asking: "Can *this specific person*, citing *their specific complaint*, reasonably reject this principle *to those affected by the alternative*?" Summing, even with weights, abandons that individualistic, justificatory standpoint for a more impersonal, aggregative calculation. It might be a *good* moral theory (like prioritarianism), but it's not contractualism as Scanlon defined it.

  ### Summary of the Actual Disagreements
  1.  **The Nature of Moral Justification:** Is morality about mutual justifiability to individuals (Contractualism) or maximizing overall good (Utilitarianism/EA)?
  2.  **Aggregation:** Can many small benefits/harms *sum* to outweigh one large harm/benefit? Contractualism says "No" for harms, "It's complicated" for benefits in life/death tie-breaker scenarios. Utilitarianism/EA says "Yes, sum them".
  3.  **Individual vs. Collective:** Contractualism prioritizes the strongest individual complaint in a conflict. Utilitarianism/EA prioritizes the net outcome.
  4.  **The Tie-Breaker:** Does Scanlon's tie-breaker adequately handle cases like saving 5 vs. 1? Contractualists say yes (via the complaint framing). Critics say it's ad hoc or insufficient (especially for non-life/death cases like malaria nets).
  5.  **Risk:** How does contractualism handle dispersed risks where no single individual faces a significant threat, but the expected harm is large? This remains a significant challenge.

  **So, who was talking nonsense?** Mostly nuance and emphasis. The book oversimplifies by implying contractualism *can't* handle the "save 5 vs. 1" case *at all* (it tries via the tie-breaker/complaint framing, though it's debatable). It correctly identifies the core anti-aggregation stance and the malaria nets challenge. Your roommate's "fix" abandons contractualism's core commitment against interpersonal summing. Your instinct that the book was "too clean" is right – contractualism *is* messy on aggregation, but it has sophisticated defenses for core cases while genuinely struggling with others (like dispersed risk and distant/statistical harms). The argument is real philosophy, not nonsense!
