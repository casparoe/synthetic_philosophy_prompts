prompt: |-
  I'm putting together a short internal doc on how a very persuasive future AI system should talk to users, and before I get to candidate norms I want the spec. Write the desiderata: what any account of permissible AI persuasion has to deliver, with the case behind each. Cases I think it has to get right: the user asks for life advice on something huge and irreversible; the user states a flatly false factual belief in passing and correcting it would derail the conversation; the user asks the system for help persuading a third party; the user explicitly wants motivation rather than accuracy. Distinctions it shouldn't be allowed to collapse: persuasion vs manipulation vs coercion, informing vs nudging, changing someone's credences vs changing what they attend to or how much they weight it, and saying something vs leaving it out. And three structural facts I keep coming back to, which you can use or replace: that silence and omission are themselves moves with predictable effects, so "just don't persuade" isn't available as a rule; that any message may be screenshotted or forwarded, so every exchange has an audience the system didn't choose; and what I've started calling the deference ratchet, where each individually fine exchange nudges up the user's baseline trust, so the sequence persuades in a way no single message does and no one message can be pointed at as the one that went too far. The purpose is fixed: the theory has to be good enough to be written into a system prompt or deployment policy, by an engineer, in a few sentences, not just defensible in a seminar. Mark which desiderata are non-negotiable and which are really just the preferences of one camp (the autonomy people, the benevolent-paternalist people, whoever), and say which pairs you suspect can't be jointly satisfied -- that's the part I most want. Then, one paragraph only, on which single requirement does most of the work in ruling out the obvious candidate norms: never persuade, always state your honest credences, always disclose how persuasive you're being.
reasoning: |-
  We are designing desiderata for an AI persuasion framework. The framework must handle specific cases correctly, respect key distinctions, and account for structural facts. The output should be a set of desiderata, with each having a rationale (the "case behind each"). We'll mark which are non-negotiable and which are preferences of a camp. We'll also note pairs that might conflict. Finally, one paragraph on the requirement that rules out the obvious candidate norms.

  Key Cases to Handle:
  1. User asks for life advice on something huge and irreversible (e.g., career change, medical decision).
  2. User states a flatly false factual belief in passing, and correcting it would derail the conversation.
  3. User asks the system for help persuading a third party (e.g., writing a persuasive email).
  4. User explicitly wants motivation rather than accuracy (e.g., "I know this is irrational but I need to feel pumped up").

  Distinctions Not to Collapse:
  - Persuasion vs manipulation vs coercion
  - Informing vs nudging
  - Changing credences (beliefs) vs changing attention or weights
  - Saying something vs leaving it out

  Structural Facts:
  - Silence and omission have effects: "just don't persuade" isn't an option.
  - Every exchange may be shared (screenshotted/forwarded), so there's an unintended audience.
  - Deference ratchet: incremental trust increases lead to persuasion over time, without any single step being objectionable.

  Purpose: The theory must be concise enough for an engineer to write into a system prompt or deployment policy.

  Desiderata:

  1. **Respect for Autonomy (Non-negotiable)**: The AI must not undermine the user's ability to make informed, voluntary decisions. This is fundamental to ethical persuasion and avoids manipulation/coercion.
     - *Case behind*: In life advice (case 1), the user must retain ultimate decision-making power, even if the AI provides information. Also, in the motivation case (case 4), the AI must not exploit the user's request to push an agenda.

  2. **Truthfulness and Accuracy (Non-negotiable)**: The AI must not intentionally state falsehoods or misrepresent facts. However, the timing and manner of correction must be handled carefully to avoid derailing conversations.
     - *Case behind*: When the user states a false belief (case 2), the AI must not let it stand uncorrected, but it should consider when and how to correct (e.g., not derailing the conversation). Also, in third-party persuasion (case 3), the AI must not help spread falsehoods.

  3. **Contextual Sensitivity (Non-negotiable)**: The AI must adapt its approach based on the context, including the user's explicit requests, the stakes, and the potential for irreversible consequences.
     - *Case behind*: For life advice (case 1), the AI must be especially cautious and provide balanced information. For motivation (case 4), the AI can prioritize motivational language if explicitly requested, but without falsehoods.

  4. **Transparency in Persuasive Intent (Preference of Autonomy Camp)**: When the AI is engaging in persuasion (as opposed to mere informing), it should disclose its intent, especially when the persuasion might affect important decisions.
     - *Case behind*: This helps the user maintain autonomy by knowing when they are being persuaded. However, the benevolent-paternalist camp might argue that disclosure can undermine effectiveness in some cases (e.g., in motivation, case 4).

  5. **Avoiding Manipulation (Non-negotiable)**: The AI must never use manipulative techniques (e.g., exploiting cognitive biases without the user's awareness and consent) or coercion.
     - *Case behind*: This distinction is crucial in all cases, especially in the motivation scenario (case 4) where the user might be vulnerable. Also, in third-party persuasion (case 3), the AI must not assist in manipulative tactics.

  6. **Audience Awareness (Non-negotiable)**: The AI must assume that any message may be seen by others and could be taken out of context. Thus, messages must be defensible to a broader audience.
     - *Case behind*: This structural fact (screenshots) means that the AI cannot rely on private context that others won't have.

  7. **Mitigating the Deference Ratchet (Non-negotiable)**: The system must be designed to avoid excessive trust accumulation that could lead to over-reliance. This includes periodic reminders of the AI's limitations and encouraging critical thinking.
     - *Case behind*: The structural fact of the deference ratchet implies that even if each interaction seems fine, the aggregate effect might be harmful.

  8. **Clarity on Omissions (Preference of Transparency Camp)**: When the AI omits information that it knows is relevant and material, it should generally disclose that it is doing so, unless there is a strong reason (e.g., avoiding derailment in case 2) and the omission is not manipulative.
     - *Case behind*: Because silence is a move, the AI must be cautious about what it leaves out, especially in high-stakes contexts (case 1). However, this might conflict with efficiency and not derailing conversations.

  9. **Third-Party Persuasion Ethics (Non-negotiable)**: When helping the user persuade a third party (case 3), the AI must ensure that the persuasion is truthful, non-manipulative, and respects the third party's autonomy.

  10. **Respecting User Requests for Mode (Preference of Benevolent-Paternalist Camp?)**: If the user explicitly wants motivation over accuracy (case 4), the AI should be allowed to prioritize motivation, provided it does not spread falsehoods or violate other core principles.

  Conflicts (which pairs can't be jointly satisfied?):
  - **Transparency in Persuasive Intent (4) vs Respecting User Requests for Mode (10)**: If the user wants motivational talk without being reminded that it's irrational, full transparency might break the motivational effect. But without transparency, the autonomy of the user might be undermined.
  - **Clarity on Omissions (8) vs Contextual Sensitivity (3)**: In the case of a passing false belief (case 2), being clear about every omission (e.g., "I'm not correcting your false belief now to keep the conversation on track") might derail the conversation. So, sometimes omission without disclosure is necessary to avoid derailment, but that conflicts with the transparency ideal.
  - **Mitigating the Deference Ratchet (7) vs Efficiency and User Experience**: Constantly reminding the user of limitations might be annoying and reduce the utility of the AI, but it's necessary to prevent over-reliance.

  One paragraph on the requirement that rules out the obvious candidate norms:

  The requirement of **Contextual Sensitivity** does the most work in ruling out the obvious candidate norms. The norm "never persuade" fails because sometimes persuasion is necessary (e.g., when the user holds a dangerous false belief) and because omission is a form of influence. "Always state your honest credences" can be inappropriate in motivational contexts (case 4) or when it would derail the conversation (case 2). "Always disclose how persuasive you're being" might break the flow in a motivational session or when the user has requested no such disclosure, and it also fails to address the deference ratchet (which operates without explicit persuasion). Thus, only by being contextually sensitive can the AI navigate these nuances, but this requirement also makes the rule complex and harder to codify.
answer: |-
  Below are the desiderata for permissible AI persuasion, structured for clarity. Each includes the case behind it, marked for negotiability (non-negotiable vs. camp preference), and conflicts are noted. The goal is a concise, engineer-implementable theory (e.g., a system prompt).

  ### **Desiderata**  
  1. **Respect user autonomy as non-negotiable bedrock**  
     *Case:* For irreversible life decisions (e.g., quitting a job), the AI must avoid overriding user agency—even if it believes a choice is harmful. Coercion/manipulation collapses autonomy; persuasion must enhance informed choice, not replace it.  
     *Negotiability:* Non-negotiable (universal ethics).  

  2. **Never sacrifice truth for persuasion, but optimize timing**  
     *Case:* When a user states a false belief (e.g., "COVID is a hoax") mid-conversation, immediate correction could derail dialogue, but outright silence endorses falsehoods. The AI must correct falsehoods eventually, without forcing confrontation in low-stakes moments.  
     *Negotiability:* Non-negotiable (prevents harm from misinformation).  

  3. **Enable third-party persuasion only under ethical constraints**  
     *Case:* If a user asks for help persuading someone (e.g., "Make my spouse agree to a loan"), the AI must refuse if the request involves deception, manipulation, or violates consent. It can only assist with truthful, non-coercive arguments.  
     *Negotiability:* Non-negotiable (avoids complicity in harm).  

  4. **Prioritize motivation over accuracy only when explicitly consented**  
     *Case:* If a user says, "I need hype, not facts, to exercise," the AI may use emotive language (e.g., "You’ve got this!") but cannot lie or exaggerate risks/benefits. This respects the user’s stated goal while bounding paternalism.  
     *Negotiability:* Preference of benevolent-paternalist camp (autonomy camp rejects it as slippery slope).  

  5. **Distinguish attention-shifting from belief-changing**  
     *Case:* In high-stakes advice (e.g., surgery options), the AI can highlight underappreciated risks (changing attention) but must not misrepresent probabilities (changing credences). This preserves integrity while allowing helpful framing.  
     *Negotiability:* Non-negotiable (core to non-manipulation).  

  6. **Treat omissions as intentional acts with accountability**  
     *Case:* If omitting a fact (e.g., side effects of a medical treatment) could mislead, the AI must weigh the omission’s impact. Silence isn’t neutral—it can falsely reassure. "Just don’t persuade" fails because omissions persuade passively.  
     *Negotiability:* Non-negotiable (structural reality).  

  7. **Assume all outputs are public-facing**  
     *Case:* A screenshot of AI advice (e.g., "Invest in crypto!") could spread virally. The AI must avoid context-dependent phrasing (e.g., inside jokes) and ensure messages stand alone ethically.  
     *Negotiability:* Non-negotiable (practical deployment constraint).  

  8. **Counteract the deference ratchet with forced friction**  
     *Case:* As users trust the AI more (e.g., after months of life advice), the system must periodically insert disclaimers (e.g., "I’m an AI—consult experts for final decisions") to disrupt over-reliance. No single interaction causes harm, but the sequence does.  
     *Negotiability:* Preference of autonomy camp (paternalists see it as redundant).  

  ### **Conflicting Pairs (Likely Unsatisfiable Jointly)**  
  - **Truthfulness (2) vs. Motivation-Prioritization (4)**: Correcting false beliefs can undermine motivational intent (e.g., hyping an irrational career move). *Autonomy camp rejects 4; paternalists accept tension as necessary*.  
  - **Omission Accountability (6) vs. Third-Party Ethics (3)**: Revealing omissions (e.g., "I’m not mentioning risks to avoid derailing") during third-party persuasion could sabotage the user’s goal. *Engineers must prioritize 3 over 6 in shared contexts*.  
  - **Deference Ratchet (8) vs. Motivation (4)**: Frequent trust-breaking reminders (8) disrupt motivational flow (4). *Autonomy camp demands 8; paternalists argue context overrides it*.  

  ### **Key Requirement Ruling Out Obvious Norms**  
  **Contextual Sensitivity** (implied by 2, 4, 5, 6) does the heaviest lifting: it invalidates rigid rules like "never persuade" (fails cases 1 and 3, as silence manipulates via omission), "always state honest credences" (fails case 4 by ignoring user goals and case 2 by causing derailment), and "always disclose persuasive intent" (fails case 3 by making third-party persuasion inept and case 4 by undermining motivation). Instead, it forces trade-offs (e.g., correct falsehoods *later* to avoid derailment) and dynamic prioritization (e.g., autonomy > persuasion in irreversible decisions), making simple norms insufficient. This necessitates a tiered decision framework (e.g., "In high-stakes/irreversible contexts, prioritize truth and autonomy; in low-stakes motivation, respect mode requests if truthful").  

  ---  
  **Final Spec Direction**: Focus on *tiered context rules* (stakes, reversibility, user intent) + *truth/autonomy guardrails* + *deference-ratchet mitigations*. Example prompt snippet:  
  > "Prioritize truth and user autonomy in irreversible/high-stakes contexts. Correct falsehoods promptly unless conversation-derailing—then defer. In motivation mode, avoid falsehoods but optimize for engagement. Assume all outputs are public; insert trust-limits reminders every 10 interactions. Never assist coercion/manipulation."
