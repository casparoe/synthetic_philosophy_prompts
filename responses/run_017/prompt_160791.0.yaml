  The reference class problem is tough. Defining "similar agents" without gerrymandering is essential but difficult. Theories need a non-arbitrary way to set this, perhaps based on algorithmic similarity or something else. This might be where many theories fail.

  Handling unknown or infinite populations is critical because real agents face uncertainty. Theories that require exact knowledge aren't action-guiding. This might eliminate many candidates.

  Adversarial similarity is an important edge case. If a theory cooperates with hostile twins, it's exploitable. But is this a genuine requirement? For actual agents, robustness to adversaries seems necessary, making it non-negotiable.

