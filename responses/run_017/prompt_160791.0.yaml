  I'll present this as a clear numbered list of requirements with explanations, then discuss conflicts and scorecards.
answer: |-
  Here's a specification for theories of evidential cooperation in large worlds, designed to evaluate their adequacy for guiding *actual agents* (unknown population, no self-inspection, real-time decisions). Requirements are ordered by foundational priority, with rationale, negotiability flags, and conflict analysis. Non-negotiable items are essential for action-guidance under uncertainty; negotiable ones reflect theoretical trade-offs.

  ### Core Requirements
  1. **Defined Correlation-Payoff Threshold**  
     *What*: Must specify a minimum strength of evidential linkage required for cooperation to be rational, expressed as a function of payoff structure (e.g., R/P > f(correlation)). Must be computable without exact population knowledge.  
     *Rationale*: Cooperation isn't universally rational; it depends on cost-risk balance. Actual agents need a "when to cooperate" rule.  
     *Non-negotiable*: Yes. Without this, the theory isn't action-guiding.  

  2. **Procedural Correlation Isolation**  
     *What*: Must distinguish correlation arising from *identical decision processes* from spurious correlation (e.g., shared upstream causes like genes or environment). Must not treat your action as evidence of a fixed trait unless that trait directly determines others' actions.  
     *Rationale*: Avoids "smoking lesion" failures where you defect but wrongly infer others' defection from a common cause.  
     *Non-negotiable*: Yes. Spurious correlation exploitation invalidates evidential logic.  

  3. **Non-Arbitrary Reference Class**  
     *What*: Must define "similar agents" objectively:  
     - Robust to redescription (can't gerrymander by splitting/merging decisions).  
     - Invariant under grain shifts (e.g., viewing your algorithm as high-level vs. assembly code).  
     - Excludes agents whose choices are statistically independent of yours.  
     *Rationale*: Prevents ad-hoc adjustments that flip verdicts arbitrarily.  
     *Non-negotiable*: Yes. Subjectivity here makes the theory self-undermining.  

  4. **Population Uncertainty Tolerance**  
     *What*: Must deliver verdicts when the number of similar agents is unknown, large, infinite, or undefined (e.g., via bounds, scaling laws, or prior-agnostic methods). Cannot require precise counts.  
     *Rationale*: Actual agents never know the full population. Theories requiring this are useless.  
     *Non-negotiable*: Yes.  

  5. **Partial Similarity Handling**  
     *What*: Must handle asymmetric/partial similarity (e.g., you resemble Agent A 80% and Agent B 30%), unknown roles (e.g., "Am I the original or the copy?"), and opaque source code.  
     *Rationale*: Real-world similarity is messy and unverifiable.  
     *Non-negotiable*: Yes. Theories failing this don't map to reality.  

  6. **Adversarial Robustness**  
     *What*: Must not recommend cooperation if opponents can create "anti-you" agents designed to anticorrelate with your actions (e.g., a twin that defects if it predicts you cooperate).  
     *Rationale*: Otherwise, the theory is exploitable by malicious actors.  
     *Non-negotiable*: **Negotiable**. This is a stress test; some argue it's unrealistic or that cooperation remains rational if anticorrelation is unlikely.  

  7. **Clarity on Rationality vs. Engineering**  
     *What*: Must explicitly state whether it prescribes:  
     - *In-the-moment rationality* (what to choose now), or  
     - *Strategic design* (how to build agents to induce cooperation).  
     *Rationale*: These address different problems. Your focus is *rationality for existing agents*.  
     *Non-negotiable*: Yes for specificity.  

  8. **N-Agent & Public Goods Generalization**  
     *What*: Must extend to public goods problems (e.g., N-player dilemmas) with graded evidence strength (e.g., your action signals 100 others weakly vs. 10 others strongly).  
     *Rationale*: Large worlds involve groups, not just pairs.  
     *Non-negotiable*: Yes. Two-agent theories are toy models.  

  9. **Non-Consequentialist Criterion**  
     *What*: Must identify scenarios where evidential cooperation fails *despite* large-world correlations and high stakes (e.g., when payoffs make mutual defection dominate unless causal control exists).  
     *Rationale*: Ensures the theory isn't just maximizing global utility covertly.  
     *Non-negotiable*: **Negotiable**. Some view this as a feature, but it's required to test distinctness.  

  ---

  ### Conflict Analysis & Impossibility Tensions  
  - **Key Conflict**: Requirements **#3 (Reference Class)** and **#4 (Uncertain Populations)** are jointly the hardest. Defining a non-arbitrary reference class without exact population knowledge often requires idealized assumptions (e.g., "all agents with isomorphic decision procedures"), which real agents can't compute or verify. This tension is near-unsolvable; most theories sacrifice one for the other.  
  - **Secondary Conflict**: **#2 (Procedural Correlation)** and **#5 (Partial Similarity)** clash when similarity is noisy. Isolating "pure" decision-procedure correlation is trivial only in perfect twins. Under uncertainty, spurious correlation creeps in.  
  - **The Requirement That Kills Most Candidates**: **#4 (Population Uncertainty)**. Theories relying on known N (e.g., some superrationality models) or infinite limits (e.g., reflective oracles) fail immediately. **#3 (Reference Class)** is a close second, as it exposes vagueness in similarity metrics.  

  ---

  ### Desiderata vs. Tribal Bias  
  - **Genuine Desiderata**: #1, #2, #3, #4, #5, #7, #8. These are forced by your purpose: guiding agents under ignorance and computational limits.  
  - **Negotiable/Biased**: #6 (Adversarial Robustness) and #9 (Non-Consequentialism).  
    - #6 is often demanded by causalists to "prove" evidentialism is exploitable, but it might be an edge case outside realistic threats.  
    - #9 is weaponized by evidentialists to dismiss causal theories as "not truly cooperative." It's useful for testing but not core.  

  ---

  ### Scorecard of Major Approaches  
  *(Against non-negotiable requirements only; "Fail" = critical gaps)*  
  - **Evidential Decision Theory (EDT)**  
    - Fails #2 (smoking lesion problem), #6 (exploitable by anti-agents).  
    - Struggles with #3/#4 (vague reference class, requires known probabilities).  
  - **Causal Decision Theory (CDT)**  
    - Fails #1/#8 (no evidential cooperation; defects in large-world dilemmas).  
    - Passes #2, #6 robustly.  
  - **Functional Decision Theory (FDT)**  
    - Fails #4 (requires known decision procedures, struggles with N→∞).  
    - Passes #2, #6, #8 best. #3 is ad-hoc (user-defined "logical" similarity).  
  - **Algorithmic Information Theory (AIT) Approaches**  
    - Fails #4/#5 (Kolmogorov complexity is uncomputable; opaque code is lethal).  
    - Passes #3 (objective similarity) and #2 in theory.  
  - **Old-School Superrationality**  
    - Fails #3/#4 (assumes perfect symmetry and known twins; gerrymander-prone).  
    - Passes #1/#8 simply when applicable.  

  **Verdict**: No existing theory satisfies all non-negotiable requirements. #3 and #4 are the main bottlenecks. For your purpose (actual agents), **FDT comes closest but fails population uncertainty**, while **EDT fails adversarial cases**. A theory that fully passes would need:  
  - A computable similarity metric (e.g., program distillation under resource bounds).  
  - Correlation thresholds based on pessimistic population estimates.  
  - Formal separation of decision-process evidence from environmental noise.  
  Until then, evidential cooperation remains theoretically intriguing but practically speculative. Use this spec to force clarity: if a theory can't handle *unknown N* and *messy similarity*, it's not addressing your problem.
