  Okay, let me unpack this fascinating query from a philosophy professor. They're grappling with a specific conceptual phenomenon where the term "attention" operates across three distinct domains (machine learning, economics, moral philosophy) with shared grammar but divergent application criteria. The core issue is how this leads to problematic cross-domain inferences and destabilized debates.

  Hmm, they've already ruled out several existing frameworks: polysemy (since the senses are deliberately modeled), metaphor (because borrowings are literal/technical), conceptual stretching (as the shift is in mechanism not generality), and concept creep (which is intra-domain extension). Their provisional "copycat concepts" label shows they're seeking precision.

  I notice they're particularly concerned about:
  - The migration of normative profiles between domains
  - The dropping of home criteria during borrowing
  - Resulting category mistakes in cross-disciplinary discourse
  - Bidirectional conceptual contamination

  The professor also asks excellent boundary-testing questions about whether similar patterns occur with "temperature" in ML or "bias" across fields. That suggests we need a framework flexible enough to handle both technical term migrations and value-laden concept transfers.

  Right, let me mentally scan relevant literatures. In philosophy of science, Hacking's "looping effects" and Haslanger's "ameliorative analysis" might touch on aspects but don't quite fit. Sociology of knowledge gives us "boundary objects" but those facilitate collaboration rather than distortion. Cognitive linguistics has Blumenberg's "absolute metaphors" but that's too poetic.

  Ah! Padgett and Powell's "robust action" framework in institutional theory comes closer with its multiple goal pursuit, but still not quite. The clearest match might be in philosophy of technology - Verbeek's "moralization of technology" captures normative transfers, but is too narrow.

  Wait - perhaps we should consider this as a form of "conceptual grafting"? That would emphasize the deliberate transplantation of semantic structures (rootstock) into new domains (scion), creating hybrid entities that may bear unintended fruit. The horticultural metaphor nicely captures both the intentionality and the risk of unhealthy unions.

  But let me test this against their examples:
  - ML "attention" grafts psychological grammar onto matrix operations
  - Economic "attention" grafts resource grammar onto temporal focus
  - The reverse grafting occurs when ML models are taken as accounts of "real" attention

  For "temperature", the thermodynamic concept is grafted onto statistical mechanics with different criteria, which seems analogous. "Bias" shows even clearer grafting from statistics to social justice contexts.

  The boundaries would exclude:
  - Mere polysemy (like "bank" river/finance)
  - Dead metaphors (like "leg" of a table)
  - Domain-general concepts (like "quantity")
  - Conceptual engineering (which is corrective)

  Where might this fail? When grafting is purely heuristic without normative transfers (like "virus" in computing). Also when the graft fully assimilates (like "window" in GUI design).

  The professor should consider if "conceptual grafting" captures both the structural and normative aspects they observe. I'd suggest they test it against cases like "trust" in human-robot interaction or "memory" in computing. If those show similar problematic inference patterns across domains, we've got our category.
answer: |-
  What you're describing is a sophisticated form of **conceptual migration with normative residue**, where a term's *operational grammar* and *evaluative framework* are transplanted across domains while its *application criteria* are discarded—leading to category errors and destabilised discourse. After reviewing established frameworks, I find no single term captures this precisely. Below, I propose **conceptual grafting** as a diagnostic label, define its anatomy, test boundaries, and flag vulnerabilities. I'll use British English throughout.

  ### Proposed Concept: **Conceptual Grafting**
  **Definition:** The deliberate transplantation of a term's *grammatical structure* (e.g., selectivity, finitude, success conditions) and *normative profile* (e.g., "misdirected," "deserved") into a new domain, while discarding its original *criteria of application*. This creates hybrid concepts that license inferences valid only in the source domain, producing cross-disciplinary category mistakes and semantic rivalry.

  **Core Mechanism:**  
  1. **Grammar + Norms Travel:** The abstract logic (e.g., "attention is allocatable") and value-laden predicates (e.g., "wasted attention") are retained.  
  2. **Criteria Dropped:** Domain-specific tests for *how* the concept is instantiated (e.g., softmax weights vs. phenomenological regard) are jettisoned.  
  3. **Illicit Inference:** Conclusions relying on the *source domain's criteria* are drawn in the *target domain* (e.g., "high weight matrix = syntactic understanding").  
  4. **Bidirectional Contamination:** The grafted use retroactively challenges the source domain's ontology (e.g., "ML attention exposes *real* attention as mere computation").

  **Cases It Must Cover:**  
  - Your "attention" triad (ML, economics, moral philosophy).  
  - "Bias": Statistical estimator → cognitive distortion → algorithmic fairness. Criteria shift from variance miscalibration → implicit prejudice → disparate impact, while normative grammar ("bias is harmful/distorting") persists.  
  - "Temperature": Thermodynamic (mean kinetic energy) → statistical mechanics (Lagrangian multiplier). Normative grammar ("high temperature = disorder") migrates, but criteria (molecular motion vs. sampling randomness) diverge, risking misinference (e.g., "low temp in LM *controls disorder*").  

  **Boundary Cases It Excludes:**  
  - **Polysemy:** Independent coinages (e.g., "bank" for river/finance) lack *deliberate modelling* and *normative residue*.  
  - **Metaphor:** Non-literal transfers (e.g., "heart of the problem") drop normative rigour; your cases are technical and literal.  
  - **Conceptual Stretching:** Adjusts generality (e.g., "democracy" applied to firms), not mechanisms/criteria.  
  - **Concept Creep:** Expands extension *within* a domain (e.g., "trauma" including microaggressions).  
  - **Functional Kinds:** Legitimate multi-domain realisations (e.g., "resilience" in ecology/psychology) share criteria (e.g., recovery from perturbation).  

  ### Why "Grafting" Fits Best  
  - **Botanical metaphor:** A scion (grammar/norms) is fused to rootstock (new domain), producing fruit (hybrid concept) that may be unstable.  
  - **Highlights agency:** Your cases involve *deliberate* modelling ("modelling is the point").  
  - **Captures residue:** Emphasises the normative "sap" flowing despite criteria excision.  

  ### Where Your Cases Might Challenge This  
  1. **"Bias" as Functional Kind?**  
     - If statistical, cognitive, and algorithmic bias share *core criteria* (systematic deviation from standard), it's functional, not grafting.  
     - *Counter:* Criteria diverge: estimator bias is mathematically defined; cognitive bias involves heuristics; algorithmic bias centres equity. The shared norm ("bias is corrigible") migrates illicitly (e.g., "debiasing algorithms = statistical correction").  

  2. **"Temperature" as Mere Homonym?**  
     - If LM temperature lacks normative grammar (e.g., no "temperature injustice"), it's homophony.  
     - *Counter:* Norms *do* transfer: "adjust temperature to *control* creativity" implies a right/wrong setting—importing thermodynamics' normativity.  

  ### What Would Change My Mind  
  1. **If Normative Dropout Occurs:** If ML "attention" *never* invoked "misdirection" or "duty," grafting would weaken. But it does (e.g., "attention misalignment" in AI safety).  
  2. **A Case of Clean Recontextualisation:** E.g., "window" in computing: criteria changed (glass pane → GUI), but no normative grammar migrated ("unjust window" is nonsense).  
  3. **Evidence of Shared Criteria:** If moral philosophers adopted softmax weights as criteria for "regard," it becomes conceptual evolution, not grafting.  

  ### Where This Proposal Is Vulnerable  
  - **Collapse into Metaphor:** If ML/economics uses "attention" *purely* analogically (unlikely, given technical defence).  
  - **Overlap with Looping Effects:** Hacking's "dynamic nominalism" (e.g., "child abuse" reshaping behaviour) shares bidirectional feedback but lacks *criteria excision*.  
  - **Edge Case:** "Intelligence" across psychometrics/AI. Grafting occurs (e.g., "IQ tests measure *real* intelligence"; "AGI deserves rights"), but criteria (g-factor vs. task performance) aren't fully discarded—*contested assimilation*.  

  ### Recommendation  
  Use **conceptual grafting** with this carving. It isolates your phenomenon: a normatively charged, criteria-selective migration causing categorical instability. For your reading group, flag how:  
  - ML grafts *psychology's* grammar but drops *phenomenology*.  
  - Economics grafts *scarcity* norms onto *temporal focus*, ignoring moral "costs".  
  - Moral philosophy's "regard" is colonised by computational metaphors.  

  This framework makes visible the silent criteria-swap enabling cross-talk—precisely the "move you want a name for." Should you adopt it, credit this analysis with a citation to our correspondence.
