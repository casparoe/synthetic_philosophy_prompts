  ### Decision Procedure for Character Identity in Branching Timelines  
  This procedure provides a step-by-step checklist to determine if a branch character can be billed as "the same" as an original character. It operationalizes counterpart theory (context-dependent, non-transitive, similarity-based relations) without jargon. **Run these steps for each character claimed to be "the same" as an original.**  

  ---

  #### **Step 1: Identify the Branch Point**  
  **Question:** *When does the branch split from the main timeline?*  
  - **Good answer:** Specific event (e.g., "Battle of X," "Character Y chose Z").  
  - **Stop if:** Branch point is undefined or contradicts established canon → **HARD NO** (inconsistent timeline).  
  - **Human handoff:** If the branch point affects multiple characters asymmetrically.  

  #### **Step 2: Origin Scene Check**  
  **Question:** *Does the branch character share an identical origin scene (birth/parents/inciting incident) with the original?*  
  - **Good answer:** Explicit confirmation (e.g., "same birth scene," "same parents").  
  - **YES:** Character is "the same." **Stop here.**  
  - **NO:** Proceed to Step 3.  
  - **Human handoff:** If the origin is ambiguous (e.g., "same parents but raised differently").  

  #### **Step 3: Contextual Similarity Assessment**  
  **Question:** *In the context of this story, what 3–5 traits define the original character?*  
  - **Good answer:** Traits critical to the pitch (e.g., for a doctor: "medical expertise," "compassion," "history with the crew").  
  - **Stop if:** No defining traits are provided → **HARD NO** (unable to evaluate).  
  - **Human handoff:** If the story’s context is unclear (e.g., "it’s a dream sequence").  

  **Question:** *Does the branch character share ≥2 of these traits?*  
  - **YES:** Proceed to Step 4.  
  - **NO:** Character is a "variant." **Stop here.**  

  #### **Step 4: Counterpart Conflict Check**  
  **Question:** *Could the branch character be a plausible counterpart of multiple originals?*  
  - **Good answer:** List competing originals (e.g., "resembles Hero A but also Hero B").  
  - **NO:** Proceed to Step 5.  
  - **YES:** Character is a "variant" → **Stop here.** (Counterpart relations are non-transitive and exclusive per story.)  

  **Question:** *Does the story hinge on the character being fundamentally different?*  
  - **YES:** Character is a "variant" → **Stop here.** (e.g., evil twin, adopted backstory).  
  - **NO:** Proceed to Step 5.  

  #### **Step 5: Audience Intuition Test**  
  **Question:** *Without explanation, would an audience say "that’s [Original]"?*  
  - **Use this rubric:**  
    - Same name + appearance = 2 pts  
    - Same role + relationships = 2 pts  
    - Same key memories/pre-branch history = 1 pt  
    - **≥4 pts:** Character is "the same."  
    - **2–3 pts:** Human handoff (borderline).  
    - **≤1 pt:** Character is a "variant."  
  - **Human handoff:** If scoring is ambiguous or depends on unstated lore.  

  ---

  ### **Test Cases**  
  1. **"What if she’d been adopted?"**  
     - Step 1: Branch at birth → Origin changed.  
     - Step 3: Traits = "her resilience," "relationship with parent Z."  
     - Step 4: Story hinges on difference → **Variant.**  

  2. **Evil twin more similar than branch-hero:**  
     - Step 2: Origin not shared → Step 3: High similarity (4+ pts).  
     - Step 4: Story hinges on difference → **Variant.**  

  3. **Character in branch-of-branch:**  
     - Compare ONLY to the original timeline (non-transitive!).  
     - If origin shared → Same. Else, run full procedure.  

  4. **Character dies pre-branch but alive in branch:**  
     - Step 2: Origin shared → **Same.** (Pre-branch history identical.)  

  5. **Character exists in one timeline:**  
     - New character (not subject to this procedure).  

  ---

  ### **Pitch Evaluations**  
  #### **(1) Bottle Episode: "The Doctor’s Story"**  
  - **Step 1:** Branch after doctor’s origin.  
  - **Step 2:** Origin shared (pre-branch life identical) → **SAME CHARACTER.**  
  - *Marketing can bill as "the doctor."*  

  #### **(2) Spin-off: "Our Hero’s Son"**  
  - **Step 1:** Branch pre-conception.  
  - **Step 2:** Son has no origin scene with any original → Not "the same" as anyone.  
  - *But:* The **hero** is the same (origin shared). Bill as "son of [Hero]" (relationship, not identity).  
  - **Result:** Not blocked.  

  #### **(3) Crossover: Minor Show A Char in Show B Branch**  
  - **Step 1:** Branch point defined.  
  - **Step 2:** Minor char shares origin with their Show A self → **SAME as minor char.**  
  - **Step 3:** Traits (e.g., "ruthlessness," "red uniform") match Show A’s **major char**.  
  - **Step 4:** **CONFLICT** — One branch char is counterpart to TWO originals (minor and major char).  
  - **Result:** **VARIANT** → Cannot bill as the major char.  
  - **Step that kills it:** Step 4 (counterpart conflict).  

  ---

  ### **What the Procedure Can’t Do**  
  1. **Predict audience intuition perfectly:** It flags borderline cases (Step 5 handoff) but can’t guarantee acceptance.  
  2. **Replace "is this licensed by canon?":** Focuses on character identity only. Legal/canon holes (e.g., "does this contradict S2E3?") need separate checks.  
  3. **Resolve "what the story means":** For thematic questions (e.g., "is this a redemption arc for Char X?"), handoff to writers/showrunner.  
  4. **Handle meta-narrative intent:** If marketing insists "fans will see it as the same," override the procedure (but note the risk).  

  --- 

  ### **Final Recommendation**  
  - **For the crossover pitch:** Step 4 triggers a **hard "variant"** due to counterpart conflict. Use: *"This is a variant of Major Char, not the same person. Marketing must adjust."*  
  - **Why this works:** It bakes counterpart theory into actionable checks (non-transitivity in Step 4, context in Step 3), avoids metaphysics, and forces specificity.  
  - **Script for showrunner:** *"The procedure caught an inconsistency: billing this as Major Char breaks our wiki rules because he’s also the minor char. We can call him ‘a dark mirror of Major Char’ to keep fans happy."*
