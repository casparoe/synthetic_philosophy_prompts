     Final note: The procedure is designed to be consistent and to avoid contradictions. It prioritizes origin when available, and then uses context-dependent traits when origin is not shared. The non-transitivity and context-dependence are built into the counterpart check (which is only run when origin fails and is story-dependent). The possibility of multiple counterparts is handled by step 3.

