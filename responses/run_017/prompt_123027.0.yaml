  Hmm, their opening argument is interesting. They propose a scenario where we're "epistemic twins" - identical in reasoning, with infinite mutual knowledge. They claim this symmetry creates a reason to cooperate because our actions would be perfectly correlated. They also cite real-world data showing cooperation in anonymous one-shot dilemmas.

