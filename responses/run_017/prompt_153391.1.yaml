prompt: |-
  Act as a professional philosopher who specializes in normative ethics and decision theory under deep uncertainty, and who has also spent time advising real committees that have to make recurring choices without good forecasting. Please think carefully before you write: start by brainstorming two or three different ways one might operationalize consequentialist cluelessness for a group with no technical training, name the main failure mode of each candidate, and then commit to the one you think is strongest and write that up. I care much more about your reasoning for the choice than about a tidy final product, so keep the discarded options visible in your answer.

  Context: I am a senior at a large public high school, and I chair the allocations committee of our student service council. Every semester we decide how to spend about $4,000 and how to deploy roughly thirty volunteer slots per week across a dozen ongoing projects and new proposals. The committee is six students aged fifteen to eighteen with no training in statistics or economics, plus a faculty advisor who mostly stays out of it. We get one fifty-minute meeting per decision cycle, our choices have to be explainable in plain language to the student body and to the advisor, and while each semester's decision is final once made, the whole exercise repeats every semester and has for years, so a reusable procedure would be genuinely worth a lot to us.

  The problem is that we argue in circles. Half of every meeting is people insisting their favorite project obviously does good, and the other half is people pointing out that we have no idea what the downstream effects actually are, that the counterfactual is never what people assume, and that after six years nobody has ever measured anything. I recently ran into the philosophical version of this worry — the idea that for a lot of ordinary actions we cannot even tell whether the long-run consequences are net positive or net negative, so straightforward expected-value reasoning has nothing to grip on — and it matches our deadlock almost exactly. But that literature is mostly about what we cannot know, and I need something that tells us what to do on a Tuesday afternoon.

  What I want is a written decision procedure we could actually run in the time we have. Please include all of the following:

  Ordered questions to ask about a proposal, with a stated stopping rule for each: what counts as a sufficient answer, when the answer sends the proposal back for revision, and when the answer means no.

  A working distinction between two kinds of uncertainty that I want kept separate throughout: not knowing how big an effect is, versus not knowing whether the effect is good or bad at all. My sense is that these call for different responses and that much of our arguing comes from conflating them, but I would like you to say whether I am right and to build the distinction into the procedure rather than just mentioning it.

  An explicit instruction for what to do when we cannot get a number at all, which is most of the time. If the honest answer is that some step is a judgment call dressed up as a procedure, say so on the step itself rather than in a disclaimer at the end.

  A concrete rule for comparing several proposals when all of them are sign-uncertain. I have heard the suggestion that in such cases one should prefer options that do reasonably well across many different plausible ways the world could be, rather than maximizing under a single best guess. Make that operational for us: how many distinct scenarios should we actually write down, where should they come from, and at what point does writing down more scenarios stop being informative and start being theater for the minutes?

  A ruling on two tempting escapes that come up constantly in our meetings. First, the claim that our contribution is small relative to everything else, so it cannot matter much and we should just do whatever feels good. I want to know whether smallness gets us out of cluelessness or only out of questions about magnitude, and how your procedure treats grant sizes that differ by an order of magnitude. Second, the claim that declining to fund something is the safe default because doing nothing has no consequences to be wrong about.

  A position on the unit of evaluation. Should the procedure be applied proposal by proposal, or to the whole semester's allocation as a bundle, and does the answer change how we should treat a portfolio of proposals whose expected effects might partly cancel?

  Three worked applications, run step by step so I can see where each one exits the procedure. A: continuing Homework Heroes, our weekly peer tutoring program at a partner middle school, which has run for six years, consumes about $1,500 and eight volunteers per week, is the most-loved thing we fund, and has never been evaluated in any way. B: giving the entire semester's budget to a local food pantry that we know is distribution-constrained rather than money-constrained. C: funding a student-led campaign to pressure the district into later school start times, which is cheap, diffuse, long-run, and wildly uncertain in both size and direction. I am fairly confident the honest application of any decent procedure will come out against A, and I want to see that worked through rather than softened, because A is what the committee will defend hardest.

  A short section on what the procedure cannot do, including the cases where it should hand the decision back to a vote because the remaining disagreement is about values rather than facts, and note how the committee should tell the difference.

  One complication I would like addressed if it fits anywhere natural: the procedure's own effects. Spending fifty minutes deliberating is itself an action with uncertain consequences, and the procedure will change what kind of people the committee members become. I do not know whether that belongs inside the procedure or as a note on it, so put it where you think it goes and say why.

  Finally, an epistemics section. For each substantive step of the procedure, give one line on how confident you are that following it would actually make our decisions better rather than merely more defensible-sounding, and then single out the one step you are least confident about and say what kind of evidence or argument would change your mind about it. Please do not give me a reading list, bibliography, or citations; I have no access to academic sources, so if you mention any named view or figure, explain it in your own words in the same breath.
reasoning: |-
  Okay, let me approach this systematically. The user is chairing a high school allocations committee facing deep uncertainty in their funding decisions, and they need a practical decision procedure rooted in normative ethics. 

  First, I need to brainstorm operationalizations for consequentialist cluelessness that work for teenagers without technical training. Three candidates come to mind: 

  1) The Scenario Grid Approach: Mapping proposals against diverse future scenarios. Main failure mode is scenario overload - teenagers might invent implausible stories or get overwhelmed. 

  2) The Robustness Heuristic: Focusing on options that work acceptably across many futures. Danger is false precision - students might pretend to quantify the unquantifiable. 

  3) The Sign Certainty Filter: Prioritizing proposals where we're confident about effect direction. Risk is excessive caution - it could reject valuable but uncertain interventions. 

  The Robustness Heuristic seems strongest here because it directly tackles sign uncertainty while fitting within time constraints. Now to build the procedure around it...

  For the written protocol, I'll structure it with clear stopping rules. Key elements: 
  - Separate magnitude uncertainty (how much good?) from sign uncertainty (is it good at all?), as these require different responses
  - Include concrete rules for when numbers aren't available (most cases)
  - Address those tempting escapes - smallness doesn't solve cluelessness, and "doing nothing" isn't consequence-free
  - Apply to individual proposals but allow bundling when effects might cancel
  - Work through their three examples honestly, especially the beloved tutoring program

  The epistemics section will be crucial - I need to flag where the procedure might fail and which steps are least evidence-backed. The sign certainty step is particularly tricky; I'd want to see field tests comparing committee decisions with and without it.

  Throughout, I'll remember these are high schoolers with 50 minutes - no jargon, no fake quantification, and explicit notes where something is inherently judgmental. The procedure's own effects (like shaping committee members' thinking) belong in a meta-commentary section since they're about the process rather than specific allocations.
answer: |-
  ## Consequentialist Decision Protocol for High School Allocations Committee (v1.0 "Robust Filter")

  **Core Insight:** Under deep uncertainty, the goal isn't finding the *best* outcome (often impossible), but avoiding *bad* choices and finding *robustly acceptable* ones. We separate **Magnitude Uncertainty** ("*How much* good/bad?") from **Sign Uncertainty** ("Is this *good or bad at all*?"). The latter is far more dangerous to consequentialism.

  **Brainstormed Operationalizations & Failure Modes:**
  1.  **Expected Value Lite (EV-Lite):** Assign rough numbers (e.g., 1-10) for impact magnitude and probability, multiply them. *Failure Mode:* False precision. Students will guesstimate wildly, conflating bias with data, pretending sign uncertainty is resolved. Leads to "quantified nonsense."
  2.  **Precautionary Principle (PP):** Reject any proposal with plausible pathways to significant harm. *Failure Mode:* Paralysis. Almost *any* action has *some* plausible harmful pathway. Favors the status quo excessively. Doesn't handle comparative choices well.
  3.  **Robustness Heuristic (Chosen):** Prioritize proposals that deliver *acceptable* outcomes across a *diverse set* of plausible future scenarios, even if not *optimal* in any single one. Focuses on avoiding sign-uncertain pitfalls while allowing magnitude uncertainty. *Failure Mode:* Scenario generation bias. Committee might only imagine favorable or unfavorable worlds.

  **Why Robustness?** It directly tackles sign uncertainty by forcing us to confront multiple futures. It avoids fake quantification (EV-Lite) and paralyzing fear (PP). It accepts cluelessness but seeks actions resilient to it, fitting your time constraints and need for explainability.

  ---

  **The Procedure: "The Robust Filter"**

  **Time Allocation:** ~45 minutes total. Use a timer. Strict chair enforcement.
  *   **Step 0-1:** 5 min
  *   **Step 2:** 10 min (max 2 min/proposal)
  *   **Step 3:** 15 min
  *   **Step 4:** 10 min
  *   **Step 5:** 5 min

  **Step 0: Clarify the Proposal (1 min per proposal)**
  *   **Question:** "What *exactly* are we funding/deploying? What specific activities, resources, and people are involved?"
  *   **Stopping Rule:** When the proposer states concretely: "We will spend $X on Y, sending Z volunteers to do A activity at B location for C hours/week."
  *   **Exit:** If unclear after 1 min, proposal is **tabled** (cannot proceed this cycle). *Reason:* Vague proposals cannot be robustly evaluated. *Judgment Call?* Yes. Clarity is prerequisite.

  **Step 1: Sign Certainty Check (2 min per proposal)**
  *   **Question:** "Is there a *plausible and significant pathway* where this action directly causes net harm *that we could reasonably foresee*? Focus on direct, near-term effects (next 1-2 years)."
  *   **Stopping Rule:** Requires *group consensus* on "No significant plausible harm pathway" OR "Plausible harm pathway exists".
  *   **Exit "No Harm":** Proceed to Step 2.
  *   **Exit "Harm Plausible":** Proceed to Step 3 (Robustness Test) *immediately*. *Do not* quantify likelihood or size of harm.
  *   **Why?** Separates the critical sign uncertainty. "Significant" means harm outweighing obvious near-term benefits (e.g., tutoring might enable cheating = plausible harm; tutoring might subtly reinforce inequality = less direct, push to Step 3). *Judgment Call?* **Crucially Yes.** This is the core filter against catastrophic cluelessness. It relies on collective common sense about proximate causation. *Smallness Escape?* Irrelevant here. Even small contributions can be part of harmful systems or trigger bad pathways. A small grant to a harmful org is still bad. Smallness affects *magnitude* (Step 2/3), not *sign*.

  **Step 2: Magnitude Assessment (1 min per "Harm Plausible" proposal, 2 min per "No Harm" proposal)**
  *   **Question (No Harm):** "What's the *strongest evidence* for tangible, near-term (1-2 year) benefit? How confident are we in the *direction* (positive) and *rough scale* (negligible, small, medium, large) relative to resources used?"
  *   **Question (Harm Plausible):** "What's the *strongest evidence* for tangible, near-term benefit *despite the harm risk*? How confident are we in the *rough scale* of *potential net benefit* (if benefit likely outweighs harm) or *net harm*?"
  *   **Stopping Rule:** Assign one label per proposal: `High Confidence Benefit`, `Medium Confidence Benefit`, `Low Confidence Benefit`, `Low Confidence Net Harm`, `Medium Confidence Net Harm`, `High Confidence Net Harm`. Consensus required. *No numbers.* Use scales like: Negligible/Small/Medium/Large impact relative to $1000 or 5 volunteer slots/week. Confidence: High (clear direct evidence/report), Medium (anecdotes/logic), Low (pure speculation).
  *   **Exit "High/Med Confidence Net Harm":** **Reject** immediately.
  *   **Exit Others:** Proceed to Step 3.
  *   **Why?** Handles magnitude uncertainty without fake precision. "Harm Plausible" proposals face a higher bar here. *Judgment Call?* Yes, but constrained by labels and focus on *strongest evidence*. Distinguishes "we have no idea" (Low Confidence) from "we have some reason" (Med/High).

  **Step 3: Robustness Test (The Core - 15 min total for ALL proposals)**
  *   **Task:** Generate **3 distinct, plausible future scenarios** relevant to *all* proposals under consideration. Aim for diversity:
      1.  **Optimistic:** Things go better than expected (e.g., new school admin supportive, volunteer surge).
      2.  **Pessimistic:** Things go worse (e.g., budget cuts elsewhere, key partner leaves, unforeseen problem).
      3.  **Weird/Non-Intuitive:** A surprising but plausible turn (e.g., social media backlash, policy change alters context, unintended consequence dominates).
  *   **Generation Rules (5 min):**
      *   Brainstorm scenarios *as a group*.
      *   Scenarios must be *specific* enough to imagine outcomes (e.g., not just "economy bad", but "district cuts after-school bus funding").
      *   Must be *plausible* (not sci-fi). Chair vetoes implausible ones.
      *   **3 is mandatory and sufficient.** More is theater, less is inadequate. *Where from?* Committee's collective knowledge of school, community, past projects, news. *This is judgment.*
  *   **Evaluation (10 min):** For each proposal still in play, ask: "In this scenario, is the *most likely outcome* of this proposal: `Clearly Net Positive`, `Likely Net Positive`, `Unclear/Neutral`, `Likely Net Negative`, `Clearly Net Negative`?" Vote quickly per proposal per scenario (show hands). Chair records the *majority vote* label for each cell in a grid (Proposals x Scenarios).
  *   **Stopping Rule:** Proposals are **Ranked** by robustness: Count `Clearly/Likely Net Positive` votes across scenarios. Highest count wins. Ties broken by avoiding `Clearly/Likely Net Negative` votes (proposal with fewest wins), then chair discretion.
  *   **Exit:** Generate ranking for allocation. *Do Nothing Escape?* "Doing nothing" *is a proposal.* Evaluate it in Step 1-3. Its "harm plausible" might be "failing to prevent a problem we could have addressed." Its robustness might be high (neutral in most scenarios) but also low benefit. It gets no special status. *Portfolios?* Evaluate proposals *individually*. Bundling happens naturally by funding top-ranked until resources gone. If effects *clearly* cancel (e.g., funding pro/con campaigns), treat as one bundle proposal early.

  **Step 4: Resource Allocation (10 min)**
  *   **Task:** Starting with the top-ranked proposal from Step 3, allocate funds/volunteers until resources are exhausted ($4k, ~30 slots).
  *   **Rules:**
      *   Can partially fund *only* if proposer confirms a viable scaled-down version exists *right now* (e.g., "We can run Homework Heroes with 5 volunteers instead of 8").
      *   If partial funding isn't viable, skip to the next proposal.
      *   Document rationale: "Funded: Top 3 robust proposals (X, Y, Z) exhausting resources. Rejected: Lower ranked (A, B) due to sign uncertainty/robustness."
  *   **Stopping Rule:** Resources allocated or no viable proposals left. *Judgment Call?* Yes, on partial funding viability.

  **Step 5: Meta-Review (5 min)**
  *   **Question:** "Based on *this* decision process, what *one piece of evidence* could we realistically gather before next semester that would most reduce uncertainty for a rejected or contentious proposal? Who will try to gather it?" (e.g., for tutoring: Survey 5 middle school teachers on perceived impact; for advocacy: Track # of petition signatures/meetings attended).
  *   **Stopping Rule:** Assign *one* simple evidence-gathering task. Record it.
  *   **Why?** Addresses long-term learning and the procedure's own effects. Makes each cycle slightly less clueless.

  ---

  **Worked Examples:**

  *   **A: Homework Heroes (Tutoring)**
      *   Step 0: Clear. Spend $1500, 8 volunteers/wk, tutoring at Middle School X.
      *   Step 1: **Harm Plausible?** Consensus: *Yes.* Plausible pathways: Reinforces inequality (only accessible kids benefit), enables dependency, tutors neglect own work. → Proceed to Step 3.
      *   Step 2: Magnitude? Strongest Benefit Evidence: Anecdotal love, teacher thanks. Confidence in *Net Benefit*? Group: *Low Confidence* (no data, harm pathways loom). → Proceed to Step 3.
      *   Step 3: Scenarios (Optimistic: New engaged MS principal; Pessimistic: District cuts MS art/music, increasing student stress; Weird: Viral TikTok makes tutoring uncool, participation drops 80%).
          *   Optimistic: Likely Net Positive (6 votes)
          *   Pessimistic: Unclear/Neutral (4 votes) / Likely Net Negative (2 votes) → Majority: Unclear
          *   Weird: Likely Net Negative (5 votes) (dependency exposed? tutors mocked?)
          *   Score: 1 Clear/Likely Positive (Opt), 0 Neutrals (Pess counted as unclear), 1 Likely Negative (Weird). Robustness Score = 1.
      *   Result: Low rank. *Probably not funded* if better options exist. *Why it fails:* Sign uncertainty (Step 1) & low robustness.

  *   **B: Food Pantry Grant ($4000)**
      *   Step 0: Clear. Grant $4000 to Pantry Y (known distribution-constrained).
      *   Step 1: **Harm Plausible?** Consensus: *No.* Direct, near-term harm implausible. Food reaches hungry people. → Proceed to Step 2.
      *   Step 2: Magnitude? Strongest Benefit: Pantry states $1 = 3 meals, distribution bottleneck. Confidence in Scale? *Medium Confidence* (their data, clear bottleneck logic). Benefit Scale: *Large* ($4k = 12k meals). → Proceed to Step 3.
      *   Step 3: Scenarios (Same as above).
          *   Optimistic: Clearly Net Positive (6)
          *   Pessimistic: Likely Net Positive (5) / Unclear (1) → Majority: Likely Positive (Pantry still runs, need may increase)
          *   Weird: Likely Net Positive (4) / Unclear (2) (e.g., food recall? Pantry adapts) → Majority: Likely Positive
          *   Score: 3 Clear/Likely Positives. Robustness Score = 3.
      *   Result: Top rank. Funded if resources allow. *Why it wins:* Sign certainty (Step 1), good magnitude confidence, high robustness.

  *   **C: Start Times Advocacy ($200, 2 volunteers)**
      *   Step 0: Clear. Spend $200 on materials, 2 volunteers/wk for 8 weeks organizing petitions/meetings.
      *   Step 1: **Harm Plausible?** Consensus: *Yes.* Plausible harm: Strains admin relations, distracts from other issues, fails demoralizingly, succeeds but causes unforeseen transport chaos. → Proceed to Step 3.
      *   Step 2: Magnitude? Strongest Benefit: Logic of later starts & health. Confidence in *Net Benefit*? *Low Confidence* (long chain, opposition likely). → Proceed to Step 3.
      *   Step 3: Scenarios (Same).
          *   Optimistic: Likely Net Positive (5) (gains traction)
          *   Pessimistic: Likely Net Negative (4) / Unclear (2) → Majority: Likely Negative (admin ignores, volunteers burn out)
          *   Weird: Unclear/Neutral (6) (e.g., gets media attention but no change)
          *   Score: 1 Likely Positive, 1 Unclear, 1 Likely Negative. Robustness Score = 1.
      *   Result: Low rank (tied with A). *Probably not funded.* *Why it fails:* Sign uncertainty, low confidence, mixed robustness.

  ---

  **What This Procedure Cannot Do:**

  1.  **Resolve Value Disagreements:** If the committee agrees on the facts (sign, magnitude, robustness) but still disagrees on whether to fund (e.g., animal welfare vs. human poverty), the procedure stops. This becomes a **vote on values**. The procedure surfaces *that* it's a values clash (Step 3 might show similar robustness but different "positives").
  2.  **Predict Long-Term/Complex Effects:** It focuses on 1-2 year horizons and plausible pathways. Truly complex, decades-long effects remain clueless. The procedure minimizes exposure to sign-uncertain long chains.
  3.  **Guarantee Optimality:** It seeks robustly acceptable choices, not the best possible. Under deep uncertainty, this is the best we can do.
  4.  **Generate Precise Data:** It relies on judgments and labels. It won't magically create RCTs.
  5.  **Handle Extreme Time Pressure Changes:** If a crisis hits mid-cycle, the procedure is too slow. Emergency rules are needed separately.

  **Procedure's Own Effects:** (Addressed in Step 5 - Meta-Review)
  *   **50-Minute Cost:** The time spent *is* an opportunity cost. Step 5 ensures it also buys *future* certainty reduction. The procedure's efficiency (45 min) minimizes this cost.
  *   **Shaping Committee Members:** Focusing on sign uncertainty, robustness, and evidence-gathering cultivates epistemic humility, systems thinking, and long-term perspective. This is a *positive* consequence intentionally designed in (Steps 1, 3, 5). It belongs *inside* as Step 5 because it's a tangible output of the process that feeds back.

  ---

  **Epistemics: Will This Actually Make Better Decisions?**

  *   **Step 0 (Clarity):** High Confidence. Clear proposals prevent wasted effort on mirages. Tangibly improves focus.
  *   **Step 1 (Sign Certainty):** **Least Confidence.** This is the hardest judgment. High risk of bias (favoring familiar proposals). Might reject valuable but complex interventions. *Would change my mind:* Evidence that committees reliably identify *true* harm pathways (not just imagined ones) or that skipping this step leads to *measurably* worse outcomes (e.g., funding harmful projects more often). Field trials comparing outcomes with/without this filter.
  *   **Step 2 (Magnitude):** Medium Confidence. Labels reduce illusion of precision. Focusing on "strongest evidence" grounds speculation. Risk of anchoring on anecdotes.
  *   **Step 3 (Robustness - Scenario Gen):** Medium-High Confidence. 3 scenarios force diverse perspectives. Mandatory number prevents overload. Risk of shallow scenarios.
  *   **Step 3 (Robustness - Evaluation):** Medium Confidence. Voting surfaces collective intuition quickly. Focusing on "most likely outcome in scenario" simplifies. Risk of groupthink in voting.
  *   **Step 4 (Allocation):** High Confidence. Following the ranking is transparent and uses the prior analysis. Partial funding rule prevents waste.
  *   **Step 5 (Meta-Review):** High Confidence. Explicit learning loops *will* improve future decisions. Simple tasks are achievable.

  **Overall:** I'm **Moderately Confident** this leads to *better* (more robust, less harmful) decisions than unstructured debate. It directly tackles cluelessness via sign filtering and robustness, structures uncertainty, promotes learning, and fits your constraints. It makes the reasoning *defensible* by being transparent, which is inherently valuable, but Step 5 aims for genuine improvement. The weakest link is Step 1 – it's necessary but fallible. Treat it as a safeguard, not a truth machine.
