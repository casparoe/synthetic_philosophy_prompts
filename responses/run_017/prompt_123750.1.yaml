  **2. Structural Feature**  
  The cycle arises from **threshold-triggered dimension dominance combined with fallback aggregation**. At each adjacent step, one dimension’s significant improvement dominates (avoiding the weighted sum), but between non-adjacent items (A and D), multiple dimensions exceed thresholds in opposing directions, forcing a fallback to weighted sum—which can reverse the chain’s direction. The feature is in the **aggregation rule**: it uses a non-compensatory threshold condition for "easy" pairwise verdicts but resorts to compensatory aggregation for "hard" pairs, creating context-sensitive priorities.  

