  To capture pairwise thresholds, we might need a more complex utility function. But if we can find a utility function that matches all our pairwise judgments, then transitivity holds. In this case, we have a cycle, so no utility function can match all the pairwise judgments. Therefore, if we insist that all these pairwise judgments are correct, then we must reject the existence of a utility function and hence accept that "better than" is not transitive. But the defender will say that we should revise our pairwise judgments in light of the cycle.

  Therefore, the case is inconclusive: it pushes us to either abandon transitivity or abandon the comparison rule. But it does not force us to abandon transitivity.

  However, if we have independent reasons to believe the comparison rule (for example, if it is the only rule that captures our intuitive judgments in pairwise comparisons), then we might have a case against transitivity.

  But note: the rule we used might not be the only way to capture the intuitions. A more sophisticated utility function might capture the thresholds in a transitive manner.

  For example, we could define:

  U(apartment) = 
    [utility from commute] + [utility from size] + [utility from view]

  where:
    utility from commute = -commute   [but if the commute difference is at least 10 minutes, then we count it as a big win? But in a utility function, the difference is already in the number.]

  Wait, the utility function would assign a number. The pairwise comparison would be by U(X) > U(Y). How to capture the idea that a win of 10 minutes in commute is so important that it overrides a loss of 50 sq ft? By having a high weight on commute. But in our example, we have a weight of 0.5 on commute and 0.3 on size. Then a 10-minute win in commute is worth 5 units (0.5*10) and a 50 sq ft loss in size is 15 units (0.3*50) -> so the utility function would say that the loss in size is more important? But in condition (1), we allowed the commute win to override. So the utility function does not capture that.

  Therefore, if we insist that the condition (1) captures our true preferences, then we cannot have a utility function. And then we have to accept non-transitivity.

  But the defender will say: your true preference should be consistent with the weighted sum after all, and the condition (1) was an error.

  So it's a standoff.

  Given the above, I present the case as specified, but I acknowledge that it does not definitively prove that "better than" is not transitive; it only shows that an intuitive procedure leads to non-transitivity. The burden is on the defender of transitivity to explain why the procedure is flawed or to provide a better procedure that is transitive and captures the same intuitions.

  The case does not smuggle in a shift in what the items are being judged as. The same dimensions and the same rule are applied throughout.

