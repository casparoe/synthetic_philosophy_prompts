prompt: |-
  hi -- i do the secretariat work for a small professional college (around 900 members) that puts out position statements. Each one answers a block of four to eight yes/no items that are all about the same topic, members are expected to act on them, and they get quoted back at us in complaints and now and then in disciplinary hearings. Four to six of these a year, half-day meeting, 12-15 people (mostly clinicians plus two lay members), and I get about one afternoon to prep. It has to run on a shared spreadsheet and a show of hands, and the chair is a clinician who will read about one page of instructions and no more.

  Last year we published one where a clear majority backed item 2, a clear majority backed item 3, and a clear majority backed item 5, and it turned out that no single member had actually voted for all three — someone complained that the statement tells them to do two incompatible things, and they were right. Someone on council muttered something about "the discursive dilemma" and said we should vote on the reasons rather than the conclusions, which sounds right but I don't know how to actually do that on a Tuesday afternoon with fifteen people.

  So: give me a procedure I can run, in order, for one statement.

  Specifically I need: how to break a topic into votable propositions before the meeting and lock that agenda before anyone discusses the substance (and what to do when someone proposes a new item at 3pm anyway); how to make sure the conditional, normative, "if the facts are like this then we should do X" item gets its own explicit vote instead of hiding inside the other items; how to decide which items get voted on and which are just read off the ones that passed, and what to do when the headline recommendation isn't entailed by anything the committee actually accepted and also isn't contradicted by it; whether it's safe that our bylaws require a two-thirds supermajority on some items and a plain majority on others inside the same statement; what I do with a ballot that's internally inconsistent, or with abstentions and "can't say" answers; and at which point the procedure stops and says this is a values call, go ask a person. I also need the output written up so that an outside person, a year later, can rerun it from the record and get the same answer — council wants an audit trail, not just a decision.

  Please also be blunt about where this misfires. Our items are English sentences with "should" in them, sometimes with an implicit "all else being equal", and half the time the committee insists two items aren't inconsistent when they plainly are. I'd rather hand council a list of known holes than have them find one after publication.

  Then run the procedure on these three:

  (1) A screening programme. Items: "the test's false positive rate is acceptable"; "if the false positive rate is acceptable, the college should endorse routine screening"; "the college should endorse routine screening". Split is 4 members yes/yes/yes, 3 yes/no/no, 4 no/yes/no.

  (2) The one I know they'll hate. A public statement on a staffing crisis: 9 of 13 badly want to say something, but the two supporting items — "workforce planning is within the college's remit" and "the data on staffing levels are solid enough to make a public claim" — each fail by a single vote, and a standing statement from 2021 says the college doesn't comment on workforce issues.

  (3) Two items that may or may not clash: "clinicians should not prescribe X off-label" and "clinicians should exercise their own judgement where the evidence is thin".

  Tell me what comes out of each, including the case where the answer is one the chair is going to fight me on, and say plainly what the procedure can't do.
reasoning: |-
  We are designing a voting procedure for a committee that votes on multiple related yes/no items that form a position statement. The procedure must:
  1. Handle conditional and normative statements explicitly.
  2. Ensure that the final set of passed items is logically consistent (as much as possible).
  3. Provide an audit trail for reconstructing the decision.
  4. Work within the constraints: shared spreadsheet, show of hands, limited time, and a chair who will only read one page of instructions.

  We will use a variant of the "premise-based" or "conclusion-based" approach, but tailored to our constraints. Given the problem of the discursive dilemma (where collective judgments on individual propositions may be inconsistent with the collective judgment on a compound proposition), we need to structure the voting to avoid such inconsistencies.

  Proposed Procedure:

  Step 0: Pre-Meeting Preparation (by Secretariat)
  - Break the topic into a set of atomic propositions. These should include:
     a. Factual premises (e.g., "the test's false positive rate is acceptable")
     b. Conditional norms (e.g., "if the false positive rate is acceptable, then the college should endorse routine screening")
     c. Normative conclusions (e.g., "the college should endorse routine screening")
  - The set of propositions should be structured so that the normative conclusions are derived from the premises and conditionals. Ideally, we want to avoid having multiple conclusions that might conflict without having a way to resolve them.
  - Propositions should be independent and not overlapping in a way that causes confusion. They should be phrased to avoid ambiguity.
  - The agenda (the list of propositions to be voted on) is fixed and distributed before the meeting. It is locked unless there is an emergency.

  Step 1: Handling New Proposals at the Meeting
  - If a member proposes a new item during the meeting (e.g., at 3 pm), the chair has two options:
     a. If the new item is a minor clarification or correction, it can be accepted by unanimous consent.
     b. If it is a substantive addition, it must be deferred to the next meeting because the agenda is locked. The rationale is that adding new items on the fly may disrupt the logical structure and requires time for consideration.

  Step 2: Voting Rules
  - Each proposition is voted on individually by show of hands (or via the shared spreadsheet).
  - The voting threshold: 
     - For each proposition, the voting threshold (simple majority or two-thirds) is determined by the bylaws and marked in the agenda. The threshold is applied per proposition.
  - It is safe to have different thresholds for different items in the same statement as long as the bylaws allow it. However, note that if the thresholds are different, it might lead to a situation where a conclusion that requires a two-thirds majority fails, but the premises that would lead to it (with a simple majority) pass. This is acceptable as long as the rules are clear.

  Step 3: Handling Abstentions and "Can't Say"
  - Each member must vote "yes", "no", or "abstain" on every proposition.
  - An abstention is not counted in the majority calculation. For example, for a simple majority, we require more than half of the non-abstaining votes to be "yes".
  - If a member marks "can't say", treat it as an abstention.

  Step 4: Logical Consistency Check (Post-Voting)
  - After all votes are cast, the secretariat (with the help of the chair) must check the set of passed propositions for consistency.
  - We are particularly concerned with:
     - Modus ponens: If we have passed "If P then Q" and "P", then we must also pass "Q". But note: we might have passed "If P then Q" and "P", but if "Q" fails to get the required majority, then we have an inconsistency.
     - Contradictions: We must flag if two passed propositions are contradictory (e.g., "We should do X" and "We should not do X").
  - How to handle inconsistencies?
     - If the inconsistency involves a normative conclusion that is not explicitly voted on but is entailed by the passed premises and conditionals, then the secretariat must note that the entailment holds and therefore the conclusion should be adopted even if it was not voted on (or if it was voted on and failed, that is a problem).
     - However, in our procedure, we are voting on the conclusions as well. Therefore, we must check that for every conditional and its antecedent that pass, the consequent must also pass. If it does not, then we have an inconsistency.

  But note: we cannot force the consequent to pass if it didn't get the votes. Therefore, we must avoid such a situation.

  To avoid this, we structure the agenda so that the conditional norms and the premises are voted first, and then the conclusion is voted. However, the problem is that the conclusion might fail even if the condition and the antecedent pass. This is the discursive dilemma.

  We have two main approaches:

  Approach A (Premise-Based): Only vote on the premises and the conditionals, and then derive the conclusions. But the committee might want to vote on the conclusions as well.

  Approach B (Conclusion-Based): Only vote on the conclusions and not the premises. But then we lose the reasoning.

  Given the requirement for an audit trail and the fact that the statements are quoted later, we need to record the reasoning. Hence, we need both.

  Proposed Hybrid Approach:

  - We break the propositions into two groups: 
     Group 1: Premises (factual statements) and Conditionals (if-then rules).
     Group 2: Conclusions (normative statements).

  - We vote on Group 1 first, then Group 2.

  - However, we require that the conditionals in Group 1 are such that they are the only way to derive the conclusions. Then, when we vote on the conclusions, we can check if the vote on the conclusion matches what the premises and conditionals would imply.

  But note: the committee might reject a conclusion even if the premises and conditionals that support it pass (due to other reasons not captured). So we cannot force the conclusion to pass.

  Therefore, we must allow for the possibility of inconsistency. The procedure must detect it and then escalate to the committee for resolution.

  Step 5: Resolution of Inconsistencies
  - After the votes are in, the secretariat (or a designated logician) checks the set of passed propositions for consistency.
  - If an inconsistency is found (e.g., we have passed P, and "If P then Q", but Q did not pass, or we have passed both Q and not-Q), then:
     a. The committee is informed of the inconsistency.
     b. The committee must revisit the votes that caused the inconsistency. They can either:
          i. Change one or more votes (by holding a revote on the specific propositions) to remove the inconsistency, or
          ii. Remove one of the propositions from the set of passed items (by voting to retract it) to restore consistency.
     c. If the committee cannot resolve the inconsistency by revoting, then they must remove the entire set of propositions on that topic from the statement and either defer the topic or drop it.

  Step 6: Writing the Output
  - The record must include:
     - The list of propositions with the vote counts and the threshold for each.
     - The outcome (passed or not passed) for each.
     - Any inconsistencies found and how they were resolved (including revotes).
     - The final set of passed propositions that form the position.

  Step 7: When the Headline Recommendation is Not Entailed
  - If the headline recommendation (a conclusion) is not entailed by the passed premises and conditionals, but also not contradicted, then it stands on its own. However, we note that the reasoning is incomplete. The committee may wish to add a note in the statement that the conclusion was adopted without the expected premises, which might weaken the argument.

  Now, let's test the procedure on the provided examples.

  Example 1: Screening Programme

  Propositions:
  P1: The test's false positive rate is acceptable.
  P2: If the false positive rate is acceptable, the college should endorse routine screening.
  P3: The college should endorse routine screening.

  Votes:
  - 4 members: yes/yes/yes
  - 3 members: yes/no/no
  - 4 members: no/yes/no

  Vote counts:
  - P1: yes = 4+3 = 7, no = 4 -> passes (simple majority: 7 out of 11 non-abstain? total members 4+3+4=11, so 7>5.5 -> passes)
  - P2: yes = 4+4 = 8, no=3 -> passes (8>3, majority)
  - P3: yes=4, no=3+4=7 -> fails (4<7)

  Now, we have passed P1 and P2. By modus ponens, we must have P3. But P3 failed. So we have an inconsistency.

  Resolution: The committee is informed. They must revote on the three propositions to try to resolve the inconsistency. However, note that the votes are fixed. The three groups are fixed. How can they break the tie?

  Alternatively, the committee might decide to drop one of the propositions. But note that P1 and P2 passed, so they are part of the statement. P3 failed, so it is not. However, the logical consequence of P1 and P2 is P3. Therefore, the statement would be inconsistent.

  In the revote, the committee might be persuaded to change their votes. But if they don't, we have two options:

  Option 1: Remove P2 (the conditional) because without it, we don't have the inconsistency. But P2 passed by a large majority.

  Option 2: Remove P1? But P1 passed.

  Option 3: Note that the statement includes P1 and P2, and therefore the college is committed to P3 by logic, but the explicit vote on P3 failed. This is a problem.

  Given the difficulty, the procedure would require that the committee either:

  - Repeal the passage of P1 or P2 (by a revote) to avoid the inconsistency, or
  - Accept that the statement is inconsistent and therefore the entire set of propositions on this topic is withdrawn.

  In this case, the committee might be persuaded to revote on P3, but the votes are fixed. Without changing minds, the only consistent set is to not have the statement at all.

  Alternatively, we could structure the voting so that the conditional (P2) is not voted on as a separate proposition, but that would reduce the audit trail.

  But note: the problem occurred because we allowed a vote on P3. If we did not vote on P3 and only voted on P1 and P2, then we would derive P3. That is the premise-based approach. However, the committee might want to vote on P3 to express their overall judgment.

  Therefore, we must decide on the structure in advance.

  Revised Proposal for Agenda Structure:

  To avoid this, we can structure the agenda so that the conclusions are not voted on if they can be derived from the premises and conditionals. But then the committee might want to override the derivation.

  Alternatively, we vote on the conclusions only when they are not derivable? That becomes messy.

  Given the time constraints, we might adopt:

  - Only vote on the premises and conditionals, and then the conclusions are automatically adopted if they follow from the passed set. But then if a conclusion is not entailed, we don't have it? And the committee might want to add a conclusion that is not entailed.

  This is complex.

  Given the example and the time, we might require that the conditionals are only included if they are necessary and that the conclusions are derived. Then we avoid the inconsistency by not having a vote on the conclusion.

  But the problem states that the committee wants to vote on the conclusions.

  Therefore, we must accept that inconsistencies may arise and then resolve them by revoting or dropping the topic.

  Example 1 Outcome:
  - Inconsistency found: P1 and P2 imply P3, but P3 failed.
  - The committee is informed. They must revote on one or more of P1, P2, P3 until consistency is achieved, or drop the entire topic.
  - If revoting doesn't change the outcome, then the topic is dropped for this meeting.

  Example 2: Public Statement on Staffing Crisis

  Propositions:
  P1: Workforce planning is within the college's remit.
  P2: The data on staffing levels are solid enough to make a public claim.
  P3: The college should issue a public statement on the staffing crisis.

  But note: there is a standing statement from 2021: "The college doesn't comment on workforce issues." This standing statement is a constraint. We must either rescind it or note an exception.

  We should have an additional proposition:
  P0: The college should rescind the 2021 standing statement on not commenting on workforce issues.

  But the problem states that the two supporting items (P1 and P2) each fail by a single vote. And 9 of 13 want to say something (presumably P3).

  Vote counts (assuming 13 members):
  - P1: fails by one vote -> say 6 yes, 7 no -> fails.
  - P2: fails by one vote -> 6 yes, 7 no -> fails.
  - P3: 9 yes, 4 no -> passes (if simple majority).

  But note: the standing statement is still in place. So even if P3 passes, it contradicts the standing statement.

  We must also consider the standing statement. We can have:
  P4: The college should make an exception to the 2021 standing statement for the current staffing crisis.

  But it wasn't on the agenda.

  Given the locked agenda, we cannot add P4 at the meeting. Therefore, the committee cannot issue the statement without rescinding the standing statement, which requires a separate vote (and perhaps a different threshold).

  So the procedure:

  - The standing statement is a prior passed proposition. To change it, we need a proposition to rescind or amend it. If that is not on the agenda, then the committee cannot override it in this meeting.

  Therefore, even if P3 passes, the statement would be inconsistent with the standing statement. The secretariat must note that and block the publication until the standing statement is addressed.

  Thus, the outcome for example 2:
  - P1 fails, P2 fails, P3 passes.
  - But because P3 is about issuing a statement on workforce, and the standing statement says the college doesn't comment, we have a conflict with prior policy.
  - The procedure must flag this conflict. The committee has two options:
     a. Vote to rescind the standing statement (if that proposition is on the agenda) but it's not.
     b. Defer P3 until a future meeting when the standing statement can be addressed.

  Therefore, the statement cannot be issued.

  Example 3: Two Items that May Clash

  Propositions:
  P1: Clinicians should not prescribe X off-label.
  P2: Clinicians should exercise their own judgement where the evidence is thin.

  Note: These two might be in conflict if prescribing X off-label is a situation where the evidence is thin.

  We vote on each:
  - Suppose we get a majority for both.

  Then we have passed both. But they might be in conflict. The conflict is not explicit because P1 is a specific rule and P2 is a general principle.

  The procedure would not automatically flag a conflict because the two propositions do not directly contradict each other (one is a general principle, the other a specific prohibition). However, they might be in tension.

  The procedure cannot detect all implicit conflicts. It only detects explicit contradictions (like P and not P).

  Therefore, the committee must rely on discussion to notice such tensions. The secretariat can note that there is a potential tension, but without an explicit contradiction, they are both passed.

  But note: the problem says that half the time the committee insists two items aren't inconsistent when they plainly are. The procedure cannot resolve that without explicit logical rules.

  Therefore, the output would include both propositions and a note about the potential tension, leaving it to the reader to interpret.

  Now, let's formalize the procedure.

  Final Procedure:

  1. Agenda Setting (Before the Meeting):
     - Break the topic into atomic propositions: premises, conditionals, and conclusions.
     - Ensure that conditionals are explicit (if P then Q).
     - The agenda is fixed and distributed in advance.

  2. At the Meeting:
     - No new substantive items can be added. Only minor clarifications by unanimous consent.
     - Vote on each proposition in a predetermined order (premises and conditionals first, then conclusions).
     - Record votes (yes, no, abstain) for each proposition.

  3. After Voting:
     - Apply the threshold for each proposition to determine which pass.
     - Check the set of passed propositions for:
          a. Direct contradictions (e.g., P and not P).
          b. Inconsistencies via conditionals: if P and (if P then Q) are passed, then Q must also be passed. If Q is not passed (i.e., it was voted on and failed), that is an inconsistency.
     - Also check against prior standing position statements for conflicts.

  4. Handling Inconsistencies:
     - If an inconsistency is found, the committee is informed and must revote on the relevant propositions to try to resolve it.
     - If revoting doesn't resolve, then the committee must remove one of the passed propositions causing the inconsistency (by revote) or drop the entire topic.

  5. Abstentions and "Can't Say":
     - Treated as abstentions, not counted in the majority.

  6. Output:
     - For each proposition: the text, the threshold, the vote counts, and the outcome.
     - A note of any inconsistencies and how they were resolved.
     - The final set of passed propositions.

  7. Limitations:
     - The procedure cannot detect all implicit conflicts (like the one in Example 3). It only catches explicit contradictions and modus ponens failures.
     - It requires the committee to revote when an inconsistency is found, which might be time-consuming.
     - It relies on the initial breakdown of the topic into propositions being logical and complete. If the breakdown is flawed, the procedure might not work.

  Now, let's run the examples with the procedure.

  Example 1 (Screening) with Procedure:

  Agenda:
  P1: The test's false positive rate is acceptable. [Simple majority]
  P2: If the false positive rate is acceptable, the college should endorse routine screening. [Simple majority]
  P3: The college should endorse routine screening. [Simple majority]

  Votes: as given -> P1 passes (7-4), P2 passes (8-3), P3 fails (4-7).

  Inconsistency check: P1 and P2 together imply P3, but P3 failed. Inconsistency.

  Resolution: Committee must revote. Suppose they revote on P3 only (to see if they can get it to pass). The original votes on P3 were 4 yes, 7 no. Without changing minds, it fails again.

  Then, they must either:
     a. Revote to retract P1 or P2 (which passed) to avoid the implication. For example, if they retract P2 (by revoting and having it fail), then the inconsistency is resolved. But P2 passed by 8-3, so it's unlikely to fail on revote.
     b. Or, drop the entire topic.

  If they cannot resolve, the topic is dropped.

  Example 2 (Staffing) with Procedure:

  Agenda (assume we have):
  P1: Workforce planning is within the college's remit. [Threshold? assume simple majority] -> fails (say 6-7)
  P2: The data on staffing levels are solid enough to make a public claim. [Simple majority] -> fails (6-7)
  P3: The college should issue a public statement on the staffing crisis. [Simple majority] -> passes (9-4)

  But note: the standing statement from 2021 is still in force. Therefore, P3 conflicts with the standing statement.

  The procedure must check against prior statements. Since the standing statement is still in force, we have a conflict.

  Resolution: The committee must either:
     a. Vote to rescind the standing statement (but it's not on the agenda, so they cannot).
     b. Defer P3 until the standing statement is rescinded at a future meeting.

  Therefore, the statement cannot be issued now.

  Example 3 (Prescribing) with Procedure:

  Agenda:
  P1: Clinicians should not prescribe X off-label. [Simple majority]
  P2: Clinicians should exercise their own judgement where the evidence is thin. [Simple majority]

  Vote: Suppose both pass.

  Consistency check: There is no explicit contradiction. The two propositions are not logically contradictory (one is about X in off-label use, the other is a general principle). Therefore, both are included in the statement.

  But note: there is a potential conflict in the case where the evidence for off-label use of X is thin. The procedure does not flag this. It is up to the committee to notice this during discussion. If they don't, the secretariat can note the potential tension in the record, but the propositions are passed.

  Conclusion:

  The procedure provides a structured way to vote and check for explicit inconsistencies. It requires the committee to resolve inconsistencies if they arise, and it blocks publication if there is a conflict with prior policy. However, it cannot catch every possible conflict, especially those that are implicit or depend on interpretation. The output is an auditable record of the votes and any resolutions of inconsistencies.
answer: |-
  Below is a complete, step-by-step voting procedure designed for your constraints (shared spreadsheet, show of hands, half-day meeting, minimal chair training). It prioritizes **logical consistency**, **audit trails**, and **practicality** while acknowledging limitations. The procedure is broken into phases, with rules for handling edge cases. I'll then apply it to your three examples and flag where it misfires.

  ---

  ### **Procedure for One Position Statement**
  **Core Principle:** Vote on *reasons* (premises/conditionals) before *conclusions* (normative "should" items). This minimizes inconsistencies.

  #### **Phase 0: Pre-Meeting Prep (Your Job)**
  1. **Break the topic into atomic propositions** (max 8 items):  
     - **Premises (P):** Factual claims (e.g., "False positive rate is acceptable").  
     - **Conditionals (C):** "If [Premise], then [Normative]" (e.g., "If false positive rate is acceptable, college should endorse screening").  
     - **Normatives (N):** "Should" statements (e.g., "College should endorse screening").  
     - **Constraints:**  
       - Every `N` must have at least one `C` that logically justifies it.  
       - No compound items (e.g., split "A and B" into two votes).  
       - Label each item type (`P`, `C`, `N`) in the agenda.  

  2. **Lock the agenda:**  
     - Circulate the list 72h pre-meeting. Members may suggest tweaks *only* for clarity (not substance).  
     - **If someone proposes a new substantive item at 3pm:**  
       - **Rule:** *No additions*. Chair says: "This isn't on the locked agenda. Add it to next meeting's pre-circulation."  
       - **Why:** New items risk logical gaps or overload. Your 4-6 item limit is firm.  

  3. **Set voting thresholds per bylaws:**  
     - Flag each item in the spreadsheet with its threshold: "M" (simple majority) or "2/3" (supermajority).  
     - **Safety check:** Bylaws *can* mix thresholds in one statement, but note:  
       - If a `C` or `N` requires 2/3, its supporting `P` should too (else a weak fact may trigger a strong norm).  

  #### **Phase 1: Voting (During Meeting)**  
  **Tools:** Shared spreadsheet (Google Sheets), show of hands. You record votes real-time.  
  **Order:** Premises (`P`) → Conditionals (`C`) → Normatives (`N`). *No discussion until all votes cast.*  

  1. **Vote on each item:**  
     - Chair reads item text. Hands raised for Yes/No/Abstain. You tally in the spreadsheet.  
     - **Abstentions/"Can't say":** Treated as *absent* for threshold math (e.g., 10 voters: 4 Yes, 3 No, 3 Abstain → Yes wins with 4/7 ≈ 57%).  
     - **Ballot inconsistency?** Not your problem. Members can vote illogically (e.g., Yes on `P` and No on `C`). Consistency is checked *after* voting.  

  2. **Mandatory items:**  
     - Every `C` (conditional) *must* be voted on explicitly. No hiding.  
     - Every `N` (normative) must be voted on *after* its supporting `P`/`C`.  

  #### **Phase 2: Post-Voting Checks (You + Chair)**  
  1. **Consistency audit:**  
     - **Step 1:** List all passed `P` and `C`.  
     - **Step 2:** For each passed `C` (if `P`, then `N`), check:  
       - If `P` passed, `N` *must* pass. If not, **inconsistency error** (see Resolution below).  
       - If `P` failed, `C` is irrelevant (ignore).  
     - **Step 3:** Check `N` items:  
       - If `N` passed but no supporting `P`+`C` passed → **orphan error**.  
       - If `N` failed but its `P`+`C` passed → **inconsistency error**.  
     - **Step 4:** Check for direct contradictions (e.g., "Do X" and "Don't do X" both pass).  

  2. **Resolution rules for errors:**  
     - **Inconsistency error (e.g., `P`+`C` pass but `N` fails):**  
       - Chair must reconvene committee. Options:  
         - Revote on the failed item (`N`).  
         - Retract one of the passed items causing the conflict (e.g., demote `P` or `C` to "failed" via revote).  
       - If unresolved after 10 min, *scrap the entire statement*. No partial publish.  
     - **Orphan `N` (passed with no supporting logic):**  
       - Demote to "failed" *unless* it gets 2/3 support. If 2/3, keep it with a note: "Standalone resolution."  
     - **Contradiction (two `N`s conflict):**  
       - The `N` with *higher support* wins. Tie? Both fail.  
     - **Conflict with prior statements (e.g., 2021 workforce rule):**  
       - New statement requires 2/3 majority to override. Else, it fails.  

  3. **Final output rules:**  
     - **Passed items:** Only `P`/`C`/`N` that met threshold *and* survived consistency checks.  
     - **Audit trail:** Spreadsheet shows:  
       - Raw votes (Yes/No/Abstain) per item.  
       - Threshold applied.  
       - Errors flagged and how resolved (e.g., "Inconsistency: Revote on Item 3 passed").  
     - **Write-up:** One page per statement:  
       ```  
       Statement: [Topic]  
       Voting: [Date], [15] voters, [2] abstentions  
       Item 1 (P): "Text" — Passed (6Y/3N, M)  
       Item 2 (C): "Text" — Passed (8Y/1N, M)  
       Item 3 (N): "Text" — Passed (Consistency: Item 1+2 imply 3)  
       Conflicts: None resolved.  
       ```  

  #### **Phase 3: Escalation to "Values Call"**  
  The procedure **stops and defers to the chair/council** if:  
  - Revoting fails to resolve an inconsistency.  
  - An item is too ambiguous to vote on (e.g., "exercise judgement" vs. "don't prescribe").  
  - External factors (e.g., legal risk) override logic.  
  **Output:** "Referred to council for qualitative assessment. Not published."  

  ---

  ### **Blunt Limitations**  
  1. **Misfires when logic ≠ consensus:**  
     - Committees *will* insist two items aren't inconsistent ("But they're different contexts!"). The procedure ignores this—it checks strict logic only.  
     - **Result:** You may scrap valid statements due to rigid rules. Mitigate by training members on atomic propositions pre-meeting.  

  2. **No nuance for "all else equal":**  
     - Items with implied caveats (e.g., "should endorse screening, all else equal") risk contradictions. Fix by adding premises (e.g., "No budget constraints exist").  

  3. **Abstentions weaken legitimacy:**  
     - High abstentions = low quorum. Rule: >50% non-abstaining voters required for validity.  

  4. **Time cost:**  
     - Audit checks add 15–30 min. If conflicts arise, revotes add 10+ min per issue.  

  5. **Cannot handle:**  
     - Items that depend on each other non-conditionally (e.g., "A or B").  
     - "Partial" truths (e.g., "sometimes acceptable").  
     - External context not in propositions (e.g., "public outrage").  

  ---

  ### **Example Runs**  
  *Assume: 13 voters, simple majority (M) unless noted. Abstentions excluded from threshold math.*  

  #### **Example 1: Screening Programme**  
  - **Items:**  
    - P1: "False positive rate acceptable" (M)  
    - C1: "If P1, endorse screening" (M)  
    - N1: "Endorse screening" (M)  
  - **Votes:**  
    - P1: 7Y (4Y+3Y), 4N → **Passes**  
    - C1: 8Y (4Y+4Y), 3N → **Passes**  
    - N1: 4Y, 7N (3N+4N) → **Fails**  
  - **Audit:**  
    - P1 + C1 imply N1 *must* pass → **Inconsistency error**.  
    - **Resolution:** Revote on N1. If still fails (4Y/7N), retract C1 or P1. If C1 retracted (fails revote), N1 fails. If P1 retracted, C1 is moot.  
    - **Output:**  
      - If revote unchanged → *Statement scrapped.*  
      - If C1 retracted → P1 passes, C1 fails, N1 fails. Published: "P1 passed. No normative position."  

  #### **Example 2: Staffing Crisis**  
  - **Items:**  
    - P1: "Workforce planning in college's remit" (M)  
    - P2: "Staffing data solid enough" (M)  
    - N1: "Issue public statement" (M)  
  - **Votes:**  
    - P1: 6Y, 7N → **Fails** (loses by 1)  
    - P2: 6Y, 7N → **Fails** (loses by 1)  
    - N1: 9Y, 4N → **Passes**  
  - **Audit:**  
    - Prior rule (2021): "No workforce comments" → N1 contradicts prior policy.  
    - N1 has no supporting P1/P2 → **Orphan error**.  
    - **Resolution:**  
      - N1 needs 2/3 to override prior policy (9/13 ≈69% < 67%? **Fails**).  
      - Orphan status: 9Y < 2/3 (needs 9/13≈69% → 2/3=67%, so 69%>67%? **Passes if 2/3 threshold met**).  
      - *But* prior policy requires override → N1 fails.  
    - **Output:**  
      - P1 fails, P2 fails, N1 fails (due to prior policy conflict).  
      - Published: *No statement.*  

  #### **Example 3: Off-Label Prescribing**  
  - **Items:**  
    - N1: "Clinicians should not prescribe X off-label" (M)  
    - N2: "Clinicians should exercise judgement where evidence is thin" (M)  
  - **Votes:**  
    - N1: 7Y, 6N → **Passes**  
    - N2: 10Y, 3N → **Passes**  
  - **Audit:**  
    - No direct contradiction (N1 bans a *specific* action; N2 allows judgement *generally*).  
    - **But:** Tension if "prescribing X off-label" is a "thin evidence" scenario.  
    - **Procedure limitation:** Cannot auto-detect implicit conflicts. Relies on committee discussion pre-vote.  
  - **Output:**  
    - Both published with note: "Potential tension between N1 and N2. Contextual interpretation required."  
    - **Chair fight risk:** High. Chair may insist they're compatible. Procedure allows it unless direct contradiction.  

  ---

  ### **Final Output & Audit Trail**  
  For **Example 1**, the output would be:  
  > *"Screening programme statement invalid due to unresolved inconsistency: Premise/Conditional imply Normative, but Normative vote failed. Scrapped after revote."*  

  For **Example 2**:  
  > *"Staffing crisis statement invalid. Normative item conflicted with prior policy (2021 workforce rule) and lacked supporting premises."*  

  For **Example 3**:  
  > *"Off-label prescribing statement adopted. Items: N1 (passed 7Y/6N), N2 (passed 10Y/3N). Note: N1 and N2 may conflict in cases of thin evidence."*  

  ---

  ### **Summary**  
  **What works:**  
  - Avoids discursive dilemmas by forcing premise→conditional→normative order.  
  - Handles thresholds, abstentions, and prior policies.  
  - Gives auditable paper trail.  
  - Forces conditional norms into explicit votes.  

  **What doesn't:**  
  - Cannot resolve committees' denial of logic ("But they're not *really* inconsistent!").  
  - May scrap statements for rigid consistency.  
  - Implicit conflicts (Example 3) slip through.  

  **Recommendation:**  
  - Pilot this with 1–2 non-critical statements first.  
  - Train members on "atomic proposition" drafting.  
  - Always include a "Unless overruled by [prior statement]" premise for policy items.  

  This balances rigor with your time constraints. If the chair fights you on a logic call, escalate to council with the audit trail—your job is to flag holes, not force consensus.
