answer: |-
  Your analysis is sharp, and your suspicion about the analogy doing heavy lifting is correct. The mapping your friend proposes is indeed the standard way to view accuracy-first epistemology through a decision-theoretic lens. However, the analogy is *incomplete* and *asymmetrical*, masking crucial disanalogies that bear directly on his conclusions and your desire for objectivity. Below is an explicit correspondence table, highlighting unmapped "slots," what each costs, and how disanalogies affect the debate. I'll then address his specific claims and alternatives.

  ### Correspondence Table: Decision Theory (DT) vs. Accuracy-First Epistemology (AFE)

  | **Slot**                | **Decision Theory (DT)**                                  | **Accuracy-First Epistemology (AFE)**                     | **Status**       | **Cost of Empty Slot**                                                                 |
  |-------------------------|-----------------------------------------------------------|-----------------------------------------------------------|------------------|----------------------------------------------------------------------------------------|
  | **Agent**               | Chooser with preferences                                  | Believer                                                  | **Mapped**       | –                                                                                      |
  | **Available Acts**      | Options (e.g., bets, choices)                             | Candidate credence functions                              | **Mapped**       | –                                                                                      |
  | **States of the World** | Uncertain outcomes                                        | Possible worlds                                           | **Mapped**       | –                                                                                      |
  | **Consequence**         | Outcome (e.g., money, happiness)                          | Distance from truth (inaccuracy)                          | **Mapped**       | –                                                                                      |
  | **Utility**             | Measure of preference satisfaction (U: outcome → ℝ)       | Accuracy measure (e.g., −S(c, ω), S = scoring rule)       | **Mapped**       | –                                                                                      |
  | **Dominance**           | Act A dominates B if better in all states                 | Credence f dominates g if more accurate in all worlds     | **Mapped**       | –                                                                                      |
  | **Expected Utility**    | Σ [P(state) × U(outcome\|act, state)]                     | Expected accuracy: Σ [P(ω) × Acc(c, ω)]                   | **Mapped**       | –                                                                                      |
  | **Control/Choice**      | **Voluntary act selection**                               | Belief formation (involuntary?)                           | **Unmapped**     | **Critical:** AFE lacks voluntarism. Epistemic "ought" may not imply "can choose." Costs normative force if beliefs aren't free. |
  | **Preferences**         | **Source of utility (revealed/subjective)**               | **Objective epistemic good (truth)**                      | **Unmapped**     | **Critical:** AFE posits accuracy as intrinsic good. Missing preference-sensitivity undermines "interest-relativity" claim. |
  | **Causal Dependence**   | Outcome can depend causally on act (e.g., investing)      | Truth-value independent of credence                       | **Unmapped**     | **Harmless:** Truth is fixed; credences don't affect worlds. AFE avoids wishful thinking. |
  | **Tradeoffs**           | Inter-outcome/person utility comparisons (e.g., fairness) | Single-agent, proposition-specific accuracy               | **Unmapped**     | **Harmless:** AFE is individualistic and proposition-wise. No need for interpersonal aggregation. |
  | **Imprecise Utilities** | Permissible ties, sets of utilities (e.g., ambiguity)     | Strict propriety demands unique minimizer                 | **Partially Mapped** | **Mixed:** AFE rules out permissive ties via strict propriety, but multiple scoring rules exist. |
  | **Normative Input**     | **Preferences (for utility), beliefs (for expectation)**  | **Beliefs (for expectation), but objective accuracy**     | **Asymmetrical** | **Critical:** DT needs preferences to define utility. AFE uses objective accuracy, so no preference input needed. |
  | **Goal**                | Maximize preference satisfaction                           | Minimize inaccuracy (approach truth)                      | **Mapped**       | –                                                                                      |

  ### Key Disanalogies and Their Impact on Your Friend's Conclusions
  1. **Voluntarism (Control):**  
     - **Disanalogy:** Belief isn't voluntary; we don't "choose" credences like acts.  
     - **Impact on Conclusion 1 (Objectivity):** Harmless. Voluntarism is about *control*, not value ontology. AFE's "ought" may be evaluative (how beliefs *should* align with truth) rather than prescriptive (what to choose).  
     - **Impact on Conclusion 2 (Evidential Norms):** Relevant. Dominance arguments don't require voluntarism—they show incoherent beliefs are defective regardless of control. But it complicates "why care?" responses.

  2. **Preferences vs. Objective Accuracy:**  
     - **Disanalogy:** In DT, utility is defined by preferences; in AFE, accuracy is fixed by truth.  
     - **Impact on Conclusion 1 (Objectivity):** **Undercuts your friend's claim.** AFE doesn't "read off" accuracy from preferences; it posits an objective epistemic good (closeness to truth). Strict propriety constrains scoring rules *given this goal*, but it doesn't make accuracy interest-relative. For example:  
       - *Brier score* (quadratic loss) measures accuracy objectively, like a ruler measures length. Preference-based utility has no analogous standard.  
       - **Cost of unmapped "preferences" slot:** AFE must assume truth-aiming is constitutive of belief. If your friend denies this, the framework won't convince him—but that's a metaphysical dispute, not a flaw in the analogy.  

  3. **Self-Certification and Normative Input:**  
     - **Disanalogy:** In DT, probabilities for expectation are inputs; in AFE, credences are both inputs (for expectation) and outputs (to be assessed).  
     - **Impact on Conclusion 2 (Evidential Norms):** **Valid but surmountable.** Yes, minimizing expected inaccuracy *by your own lights* is self-certifying for coherent credences. But:  
       - AFE uses *current* credences to justify *future* norms (e.g., conditioning). If you *now* believe P, and you learn E, minimizing future expected accuracy (using your *current* credences) requires conditioning on E.  
       - **Evidential filtering** (only scoring evidenced propositions) doesn't threaten probabilism; it highlights that dominance requires *global* coherence. You can be locally incoherent on un-evidenced propositions without dominance, but rationality demands global coherence to avoid dominance *somewhere*.  

  ### Evaluation of Your Friend's Three Claims
  1. **Claim: Scoring rules can disagree on expected accuracy.**  
     - **Correct.** Two strictly proper rules (e.g., Brier vs. logarithmic score) can rank two credence functions differently under a fixed probability distribution.  
     - **Bearing:** This *does* make the choice of rule normatively significant for evidential norms (e.g., updating). But it doesn’t imply interest-relativity—it’s like choosing between equally objective measures (e.g., RMS error vs. mean absolute error). Objectivity isn’t uniqueness.  

  2. **Claim: Evidential filtering allows undominated incoherence.**  
     - **Misleading.** If you only score credences for propositions with direct evidence, incoherence elsewhere *can* avoid dominance. But:  
       - Rationality requires coherence *everywhere* (per the dominance argument applied to all propositions).  
       - Filtering confuses "no evidence" with "no rational constraint." Coherence is a structural norm, not contingent on evidence.  

  3. **Claim: Expected-accuracy minimization is self-certifying.**  
     - **Correct but incomplete.** Any coherent credence function minimizes *its own* expected inaccuracy. However:  
       - This is a feature, not a bug: it shows coherence is self-recommending.  
       - For evidential norms (e.g., conditioning), AFE uses *current* credences to evaluate *future* or *counterfactual* credences, breaking self-certification (e.g., "If you learn E, set c_new = c_old(·\|E)").  

  ### Does the Analogy Undercut His Position?
  Yes. DT itself relies on non-preference-based norms:
  - **Consistency axioms** (e.g., transitivity): Not derived from preferences; they constrain what counts as "preferences."
  - **Probability as belief-input:** In DT, probabilities aren't "chosen" via utility; they're preconditions for expected utility maximization.  
  AFE similarly treats accuracy as pre-decision-theoretic. His analogy assumes DT is foundational, but DT needs its own epistemic foundations (e.g., why satisfy coherence?).

  ### Alternative Analogies: Replacing the "Act" Framework
  The decision-theoretic analogy is useful but overextends. Better analogies capture AFE's objectivity:
  - **Statistical Forecasting with Loss Functions:**  
    Credences as forecasts, truth as outcome, scoring rules as loss functions. Loss (e.g., Brier score) is objective for a given goal (e.g., accuracy). Avoids "preference" baggage.
  - **Measurement Theory:**  
    Credences as measurements of truth-value (1 or 0). Inaccuracy = measurement error. Strict propriety = calibration requirement. Grounds objectivity in representation (e.g., a thermometer's accuracy isn't interest-relative).
  - **Calibration and Sharpness:**  
    Calibration (credence matches frequency) as a truth-directed virtue. Avoids utility-talk entirely.

  ### Conclusion: Preserving Objectivity Is Viable
  Your friend's analogy is formally valid but ontologically misleading. The unmapped "preferences" slot is fatal to his claim that accuracy is interest-relative. AFE posits an objective epistemic good (truth-closeness), and strict propriety selects scoring rules that respect this goal—just as convexity selects loss functions in forecasting. You can grant that dominance arguments alone don't yield evidential norms (they require supplemental arguments, like expected-accuracy minimization across learning scenarios) without surrendering objectivity. The core non-pragmatic vindication of coherence stands: incoherent beliefs are accuracy-dominated *regardless of practical interests*, and accuracy is not "utility in disguise" but the constitutive aim of belief. 

  If you retreat to "AFE doesn't deliver a complete epistemology," you lose little—no foundational program solves everything. But the objectivity of accuracy need not be collateral damage. Anchor your defense in the measurement analogy: we don't accuse a thermometer of pragmatism because we use loss functions to evaluate it.
