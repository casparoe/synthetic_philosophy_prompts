  Key philosophical tension points:
  The objectivity claim - is accuracy truly objective or just utility in disguise? The friend argues strict propriety doesn't select unique scoring rules any more than coherence selects unique utilities. But in epistemology, we might care about veritistic value independently of preferences.

  The self-certification problem - expected accuracy minimization using one's own credences seems circular. Yet in decision theory, probabilities are inputs, not outputs.

  Evidential filtering - if we only score beliefs on evidenced propositions, does probabilism collapse? This might confuse global coherence with local assessment.

  I should carefully unpack:
  - How dominance arguments work differently in each framework
  - Why strict propriety doesn't solve the uniqueness problem
