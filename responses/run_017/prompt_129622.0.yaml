prompt: |-
  For roughly fifteen years I have read LessWrong, Overcoming Bias, and Slate Star Codex / Astral Codex Ten, and my working epistemology is Bayesian by default: beliefs as distributions, updating on likelihood ratios, calibration and proper scoring rules, forecasting tournaments, prediction markets, base rates, the optimizer's curse, and the standing injunction to steelman before engaging. I think in this vocabulary more fluently than in any other, and I have noticed an unfortunate consequence: when I read the methodology literature around the replication crisis, I come away thinking the frequentists must simply be confused, because nothing they seem to be protecting looks like a thing my framework has room for. I would like to fix that, and I am writing the result up for a small reading group of people with the same background.

  So: please restate, in my vocabulary and as faithfully as you can, the strongest version of the frequentist complaint that motivates the replication-crisis literature. The target material is the cluster of worries about researcher degrees of freedom, undisclosed analytic choices, optional stopping and peeking, multiple comparisons, and the associated demands for pre-registration and for procedures with known long-run error rates. Give me the steelman, not the strawman: I already know how to say that frequentists irrationally care about data they did not get, and that version is not interesting to me. I want the best move available from their side, expressed as priors, likelihoods, posteriors, calibration, scoring rules, and, where it matters, multi-agent or adversarial settings.

  I have been playing with a way of cashing part of this out myself, and I want to know whether it is a real translation or a case of me smuggling my own assumptions in and calling them translation. The idea: treat the evidence a paper reports as not simply the likelihood ratio it claims, but as that ratio discounted by a flexibility tax, a factor below one reflecting how many defensible analyses the researcher could have run and how much the field's norms allowed them to choose after seeing the data. On this reading, a pre-analysis plan is a commitment device whose value is that it shrinks the tax, and a p-value is a crude public proxy for how large the tax should be.

  Then the residue report, which is the part I actually care about. First, is the flexibility tax fully expressible in Bayesian terms, or does estimating it require a base rate over a reference class of studies, so that long-run frequency sneaks back in through the back door as a way of estimating a hyperparameter? Second, where exactly does the translation distort things: is the thing being protected a property of a data-generating process, or of a scientific community's incentive structure and publication filter, and can my single-agent vocabulary represent the difference? Third, and most important: is there anything left over that has no counterpart in my vocabulary at all? In particular, I want to know whether the frequentist's insistence on error-rate guarantees is best understood as a claim about the calibration of a reporting institution under adversarial selection rather than as a claim about any individual's belief state, and whether, if so, my framework can register that claim as a genuine desideratum or can only model it by ceasing to be about inference.

  Do not lean on remembered empirical results or specific papers; argue from the structure of the two positions. If you want a concrete illustration, use the much-discussed social-psychology replication failures of the 2010s at the level of what is common knowledge, and avoid anything that would require looking a number up. I cannot search, and I am not asking for citations or reading lists.
reasoning: |-
  We are to translate the frequentist concerns from the replication crisis literature into Bayesian terms. The key issues are researcher degrees of freedom, undisclosed analytic choices, optional stopping, multiple comparisons, and the associated demands for pre-registration and procedures with known long-run error rates.

  The user has proposed a "flexibility tax" that discounts the reported likelihood ratio. We are to evaluate this idea and answer three questions:

  1. Does the flexibility tax require a base rate over a reference class of studies (thus introducing long-run frequency through the back door)?
  2. Where does the translation distort things? Specifically, is the thing being protected a property of a data-generating process or of the scientific community's incentive structure? Can the Bayesian single-agent vocabulary represent the difference?
  3. Is there anything left over that has no counterpart in the Bayesian vocabulary? In particular, is the frequentist's insistence on error-rate guarantees best understood as a claim about the calibration of a reporting institution under adversarial selection? And can the Bayesian framework register that claim as a genuine desideratum without ceasing to be about inference?

  We are to steelman the frequentist position and express it in Bayesian terms.

  ## Steelman of Frequentist Concerns in Bayesian Terms

  The core of the replication crisis is that when researchers have many degrees of freedom (e.g., choosing which variables to include, which covariates to adjust for, which outliers to exclude, when to stop collecting data, which of many possible tests to run, etc.), they can produce a statistically significant result (e.g., p < 0.05) even when there is no true effect. This is because each choice creates an opportunity to select the analysis that yields the desired result. The frequentist concern is that the long-run error rate (e.g., the false positive rate) of such a research practice is much higher than the nominal level (e.g., 5%).

  In Bayesian terms, we can model this as follows:

  ### 1. The Flexibility Tax

  The user's idea is to discount the reported likelihood ratio by a factor (less than 1) that reflects the flexibility the researcher had. This factor is the "flexibility tax". The idea is that if a researcher had many choices and could select the analysis that produced the most favorable result, then the evidence reported is weaker than it appears.

  This tax can be thought of as a prior over the analysis choices. Specifically, we can model the entire process as a hierarchical model:

  - Let θ be the parameter of interest (e.g., the effect size).
  - Let D be the data.
  - Let A be the analysis chosen from a set of possible analyses A (which includes choices about data collection stopping points, model specifications, etc.).

  The researcher reports a likelihood ratio (or a Bayes factor) for a specific analysis A that was chosen, but the choice of A may depend on the data. In fact, the researcher may have chosen A to maximize the reported evidence.

  Therefore, the actual evidence we observe is not P(D|θ, A) / P(D|A) [where the denominator is the marginal likelihood under the null and alternative, but for simplicity we can think of the Bayes factor] but rather the result of a selection process.

  To account for this, we can compute the marginal likelihood over the analysis choices, but this requires knowing the process by which A was chosen. If the researcher uses a selection strategy S (which may be adversarial, i.e., choosing A to maximize the evidence for a desired conclusion), then the likelihood we should use is:

  P(D | θ, S) = ∑_A P(D | θ, A) * P(A | θ, S)

  But note: the strategy S might condition on the data. Thus, the selection of A is a function of D. This makes the likelihood:

  P(D | θ, S) = P(D | θ, A(D)) * P(A(D) | θ, S)

  However, the term P(A(D) | θ, S) is the probability of choosing that analysis given θ and the strategy. But in reality, the strategy is fixed and the choice is deterministic given D. So we can think of the likelihood as:

  P(D | θ, S) = P(D | θ, A(D))

  But note: the same data D is used both to choose the analysis and to compute the likelihood. This double use of D inflates the evidence.

  In Bayesian terms, the correct way to account for the flexibility is to consider the entire procedure that generated the evidence. The likelihood we observe is conditional on the analysis being chosen, but we must also condition on the fact that this analysis was selected by the strategy S. This leads to a likelihood that is actually:

  P( (D, A(D)) | θ )

  But note that the event we observe is not just D but also that the analysis A(D) was selected. If we are only told D and that the analysis was A(D), then we need:

  P( D and A(D) | θ ) = P(D | θ, A(D)) * P(A(D) | θ)

  However, the term P(A(D)|θ) is the probability of choosing that analysis at the given θ. This is difficult to specify.

  Alternatively, we can think of the entire process as generating a pair (A, D) from a joint distribution. But the problem is that the researcher's strategy is not known and might be adversarial.

  ### 2. Accounting for the Selection Process: The Flexibility Tax as a Hyperparameter

  The flexibility tax can be interpreted as a multiplicative factor that adjusts the reported Bayes factor. Let BF_{A} be the Bayes factor reported for analysis A. But because A was chosen from a set of possible analyses, we should consider the maximum Bayes factor over a set of possible analyses, or more generally, the distribution of Bayes factors that could have been reported.

  In fact, under the null hypothesis, the distribution of the Bayes factor (or the p-value) is different when there is flexibility. The flexibility tax can be seen as the inverse of the inflation factor of the evidence due to selection.

  However, to compute the flexibility tax, we need to know the distribution of the evidence under the null (and also under the alternative) over the set of possible analyses and selection strategies. This is where long-run frequencies come in: we need to know, for a given flexibility (i.e., a given set of possible analyses and a selection strategy), how much the evidence is inflated on average.

  Thus, the flexibility tax requires a base rate over a reference class of studies. Specifically, we need to know:

  - The set of possible analyses A.
  - The selection strategy S: how the researcher chooses A given the data.

  But these are typically unknown. Therefore, we must estimate the flexibility tax from a reference class of similar studies (or from knowledge about the typical practices in the field). This is the back door for long-run frequencies.

  ### 3. The Distortion: Data-Generating Process vs. Incentive Structure

  The frequentist concerns are not just about the data-generating process (DGP) but also about the scientific community's incentive structure and the publication filter. The Bayesian single-agent framework can represent the incentive structure by modeling the researcher as a strategic agent. We can use a Bayesian model that includes:

  - The true state θ.
  - The data D generated from θ.
  - The researcher's actions (choice of analysis A) which depend on D and the researcher's goal (e.g., to publish a significant result).
  - The reported evidence.

  This becomes a multi-agent setting: the reader (the Bayesian agent) is trying to infer θ from the reported evidence, knowing that the researcher is strategic.

  Therefore, the Bayesian framework can represent the difference by including the researcher's incentives in the model. The reader's prior should account for the possibility that the researcher is selecting analyses to maximize the evidence. This leads to a skeptical prior about the reported evidence.

  However, the frequentist error-rate guarantees are often framed as properties of the procedure (the testing procedure including the flexibility) and not of the particular result. The Bayesian framework can model this by requiring that the reporting procedure be calibrated. In fact, Bayesian updating with a correct model should lead to calibrated posteriors. But if the model does not account for the researcher's selection, then the posteriors may be overconfident.

  Therefore, the Bayesian framework can represent the difference, but it requires building a model that includes the researcher's behavior and the publication process.

  ### 4. Is There Anything Left Over?

  The frequentist insistence on error-rate guarantees (e.g., "this procedure has a false positive rate of 5%") is a claim about the long-run performance of the procedure in a hypothetical sequence of applications. In contrast, Bayesians care about the posterior for the current study.

  However, in a multi-agent adversarial setting, the Bayesian reader might want to be calibrated in the long run. That is, they want their posterior probabilities to be correct in the long run (i.e., when they say there is a 95% probability that the effect is real, they want this to be true 95% of the time). This is called calibration.

  The frequentist error-rate guarantee can be seen as a requirement for the reporting institution: over many studies, the rate at which null effects are declared significant should be controlled. This is important for the integrity of the scientific literature.

  In the Bayesian framework, if the reader accounts for all the flexibility and selection, then their posterior probabilities should be calibrated. But if they don't, they won't be.

  Therefore, the Bayesian framework can register the frequentist's error-rate guarantee as a requirement for calibration of the posterior probabilities. However, the frequentist might also be concerned about the worst-case error rate (e.g., over all possible θ and all possible strategies by the researcher). This is more difficult for Bayesians because they typically use priors that are not worst-case.

  But note: the flexibility tax approach is an attempt to adjust the evidence so that the posterior is calibrated. However, to compute the tax, we need to know the distribution of the evidence under the null and alternative. This requires a reference class of studies.

  Thus, the Bayesian framework can accommodate the error-rate guarantee as a calibration requirement, but it requires knowledge of the base rates and the flexibility, which may be estimated from long-run frequencies.

  ## Conclusion

  ### Question 1: Flexibility tax and base rates
  Yes, the flexibility tax requires a base rate over a reference class of studies. We need to know the distribution of the evidence (e.g., the Bayes factor) under the null and under the alternative for the set of possible analyses and selection strategies. This is because the tax is essentially an adjustment factor that depends on how much the evidence is inflated by selection. Without empirical data on the reference class (or a model of the selection process), we cannot compute the tax. So long-run frequencies sneak in as hyperparameters.

  ### Question 2: Distortion and representation
  The thing being protected is both the integrity of the data-generating process (if we think of the researcher as part of that process) and the scientific community's incentive structure. The Bayesian single-agent vocabulary can represent the difference by including the researcher as part of the model. However, the frequentist error rates are often defined over the procedure (which includes the researcher's choices) and are thus a property of the entire research process. The Bayesian framework can capture this by requiring that the posterior probabilities be calibrated, but this calibration is a long-run property and requires averaging over many studies.

  ### Question 3: Leftover and error rates
  The frequentist's error-rate guarantee is best understood as a claim about the calibration of a reporting institution under adversarial selection. The Bayesian framework can register this as a requirement for the calibration of the posterior probabilities. However, the Bayesian might also need to consider worst-case scenarios (which are more naturally frequentist) to protect against adversarial researchers. This can be done by using a prior that is skeptical of the reported evidence (e.g., a prior that places a high probability on the null). But note: the frequentist error rate does not depend on a prior. Therefore, the Bayesian framework can model the desideratum of calibration, but it does so by using a prior that incorporates the possibility of adversarial behavior and the base rates from the reference class. This prior is informed by long-run frequencies, so it does not cease to be about inference, but it does require an empirical Bayes approach.

  ## Final Thoughts
  The user's flexibility tax idea is a valid Bayesian approach, but it requires empirical data (from a reference class) to set the tax. Without that, it is just a qualitative discount. The frequentist concerns about long-run error rates are, in the Bayesian framework, concerns about the calibration of the posterior probabilities. The Bayesian can address these concerns by building a model that includes the researcher's flexibility and the selection process, but this model will have hyperparameters that must be set by long-run frequencies. Thus, the two frameworks are not incommensurable, but the Bayesian must step outside the single-study inference to incorporate the necessary information about the research practice.
answer: |-
  ### Steelmanned Frequentist Complaint in Bayesian Terms

  Your "flexibility tax" concept is a perceptive bridge, but I'll restructure the core complaint into Bayesian decision theory, multi-agent epistemology, and calibration demands. The strongest frequentist argument isn't about individual inference, but about **institutional calibration under adversarial selection**. Below is the steelman, using your vocabulary.

  ---

  #### Core Translation: The Adversarial Reporting Game
  Consider scientific reporting as a **multi-agent, sequential game**:
  - **Agents**: Researchers (who choose analyses/stopping points) and Consumers (who update beliefs)
  - **Incentives**: Researchers face publication bias (rewarded for "significant" results). Consumers want accurate beliefs.
  - **Action space**: Researcher has access to a set of analyses $\mathcal{A}$, each with likelihood function $L_a(\theta \mid D)$. Norms permit selecting $a \in \mathcal{A}$ *after* seeing $D$.
  - **Adversariality**: Researchers select $a^*(D) = \underset{a \in \mathcal{A}}{\text{argmax}} \ L_a(\theta_1 \mid D) / L_a(\theta_0 \mid D)$ (maximizing evidence for $\theta_1$).

  The frequentist complaint: **Standard Bayesian updating assumes $a$ is fixed *a priori* or orthogonal to $\theta$. When $a$ is chosen adversarially, the reported likelihood ratio $LR$ becomes a biased estimator of the true evidence, distorting consumer posteriors.**

  ---

  #### Key Bayesian Restatements
  1. **Researcher Degrees of Freedom as Nuisance Parameters**  
     The "true" likelihood should marginalize over analysis choices:  
     $$L_{\text{true}}(\theta \mid D) = \sum_{a \in \mathcal{A}} L_a(\theta \mid D) \cdot p(a \mid \theta, D_{\text{peeked}})$$  
     but $p(a \mid \theta, D_{\text{peeked}})$ is unknown and adversarial. Your flexibility tax $\tau$ approximates:  
     $$\tau = \frac{L_{\text{true}}(\theta \mid D)}{\max_a L_a(\theta \mid D)} \ll 1$$  
     **Translation**: $\tau$ deflates the reported $LR$ to account for optimization over $\mathcal{A}$.

  2. **Error Rates as Multi-Agent Calibration**  
     Frequentists demand: *"Over many studies, a threshold (e.g., $p<0.05$) should imply a false positive rate ≤5%, even when researchers adversarially select analyses."*  
     Bayesian restatement:  
     - Let $\phi$ be the event "reported $LR > k$" (e.g., $k$ equivalent to $p=0.05$).  
     - Demand: Under $\theta_0$, the institution satisfies $\mathbb{P}(\phi \mid \theta_0) \leq \alpha$.  
     This is **not about individual belief**, but about the **calibration of the reporting protocol** under adversarial play:  
     $$\text{Institutional false positive rate} = \mathbb{E}_{D \sim \theta_0} \left[ \mathbf{1}_{\phi}(D) \right] \leq \alpha$$  
     where the expectation is over both data *and* adversarial analysis choice.

  3. **Pre-Registration as Credible Commitment**  
     Pre-registration shrinks $\mathcal{A}$ to a singleton $a_{\text{prereg}}$. This:  
     - Eliminates adversarial selection: $p(a \mid \theta, D) = \delta(a_{\text{prereg}})$  
     - Forces $\tau = 1$, recovering the "true" $LR$.  
     **Bayesian value**: Pre-registration transforms the game into a *single-agent* inference problem by removing the adversary's action space.

  4. **Multiple Comparisons/Optional Stopping as Belief Distortion**  
     - If a researcher runs $m$ tests or stops at $n_{\text{stop}}$ when $LR$ peaks, the reported $LR$ is $\max_{m, n} LR_{m,n}(D)$.  
     - Bayesian correction: Apply $\tau = \frac{\mathbb{E}[LR \mid \theta_0]}{\max LR}$ (where expectation is over stopping rules/multiple tests under $\theta_0$).  
     **Frequentist demand**: The *expectation* $\mathbb{E}[\tau \mid \theta_0]$ must be estimable to ensure institutional calibration.

  ---

  #### Answers to Your Residue Questions

  1. **Does the flexibility tax require a long-run base rate?**  
     **Yes, unavoidably.**  
     - $\tau$ depends on the *distribution* of $\max_a LR_a(D)$ under $\theta_0$ and $\theta_1$.  
     - Estimating this requires a reference class of studies (e.g., "social psychology experiments with 5+ outcome variables") to compute:  
       $$\tau \approx \frac{\text{Expected } LR \text{ under honest analysis}}{\text{Expected } \max LR \text{ under adversarial selection}}$$  
     - This hyperparameter *must* be frequentist because it characterizes the adversarial process, not the parameter $\theta$.

  2. **Where does the translation distort?**  
     - **What's protected**: The core object is the **incentive structure of the scientific ecosystem**, not the data-generating process per se.  
     - **Can single-agent Bayes represent it?**  
       - *Formally yes*, by adding hierarchical structure:  
         - Hyperpriors over $\tau$ (based on field-specific base rates)  
         - Researcher actions as nuisance variables  
       - *Practically no*, because:  
         (i) The adversary's strategy is opaque to individual Bayesians,  
         (ii) Priors over $\tau$ are often non-robust (e.g., if $\mathcal{A}$ is large, $\max_a LR$ under $\theta_0$ has heavy tails),  
         (iii) Consumers lack resources to estimate $\tau$ per paper.

  3. **Is there a Bayesian counterpart to error-rate guarantees?**  
     - **Yes, but as institutional calibration, not individual belief**.  
     - Demand: "When the institution reports 'significant evidence' ($LR > k$), the posterior probability of $\theta_1$ should be $\geq 1-\alpha$ *on average* over studies."  
       This implies:  
       $$\frac{\mathbb{P}(\phi \mid \theta_1) \cdot p(\theta_1)}{\mathbb{P}(\phi \mid \theta_1) \cdot p(\theta_1) + \mathbb{P}(\phi \mid \theta_0) \cdot p(\theta_0)} \geq 1-\alpha$$  
       which requires controlling $\mathbb{P}(\phi \mid \theta_0)$.  
     - **Why Bayesians should care**: If the institution is miscalibrated (e.g., 80% false positives among reported "$\theta_1$"), consumers' posteriors become systematically overconfident. Proper scoring rules *assume* honest reporting; they fail under adversarial $LR$ inflation.

  ---

  #### Where Your Framework Falls Short (The "Leftover")
  The irreducible frequentist residue is:  
  > **Adversarial error-rate control is a precondition for Bayesian updating to be tractable in scientific ecosystems.**  

  - **Individual Bayesianism** lacks tools to estimate $\tau$ without empirical base rates (e.g., replication failures in social psychology revealed $\tau \ll 1$ was common).  
  - **Institutional demands** (pre-registration, $p$-value thresholds) are **mechanisms to bound $\tau$ from below** when priors over researcher strategies are ill-defined.  
  - **Steelman summary**:  
    Frequentists protect the *map* between reported statistics (e.g., $p$-values) and long-run error probabilities. This map lets consumers approximate $\tau$ without modeling each researcher's adversarial strategy—a practical necessity when playing against a black-box opponent.

  ### Final Note
  Your flexibility tax is a real translation, but estimating $\tau$ *does* require frequentist hyperparameters. The deepest insight from replication crises: **Scientific inference is multiplayer game theory first, probability theory second.** Bayesian updating remains valid, but its inputs (reported likelihoods) become corruptible without error-rate constraints on the adversary. Pre-registration isn't about "frequency dogma"—it's a subgame-perfect equilibrium to ensure $\tau \approx 1$.
