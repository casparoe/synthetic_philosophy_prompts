  Here’s a five-minute toast draft that threads the needle—structured like her realism, sharp like her mind, and warm without dripping syrup. I’ve flagged where you might trim or tweak (✂️). Lean into your novelist’s voice:

  ---

  [Raise glass, slight pause]  
  Forty years ago, Eleanor looked at the universe and asked: *What actually stays?*  
  Not the stuff. Not the atoms, or the ether, or whatever the latest theory claimed was the bedrock. No. What stays, she said, is the scaffolding. The hidden girders. The way things *relate* to each other. When one grand theory collapses and another rises? The equations don’t lie. The pattern survives. The rest is… well, *furniture*.  

  *(Pause, glance at Eleanor)*  
  She called it "The Furniture Problem," you know. Her private little tormentor. If the universe has *too much stuff* lying around in its rooms, does describing the beautiful, intricate floorplan—the structure—actually tell you anything real? Or is it just… describing empty space between couches? [*Small smile*] She never quite pinned that one down. And she’d throttle me if I pretended otherwise tonight. That’s Eleanor. She builds her ideas clean enough to leave the loose ends exposed. No plaster over the cracks.  

  Now, I make up stories. And I *wanted* to say Eleanor’s work is like rewriting a novel draft after draft: characters change names, motives flip, whole scenes vanish… but the *shape* of how they clash and cling? That’s the ghost that haunts every rewrite. What carries over.  
  [*Lean in conspiratorially*]  
  …But a very smart philosopher friend told me that’s too kind. Because in my drafts, *I* decide what shape survives. I’m the cosmic author. Eleanor? She’s hunting for a shape *nobody* designed. One that was there before we looked. So maybe it’s less like writing… and more like archaeology. Brushing dust off blueprints the universe left behind. Blueprints that outlast the buildings. ✂️  

  How do you describe Eleanor?  
  Not by listing traits. Not “brilliant, stubborn, terrifying before coffee.”  
  You describe her by the space she shapes around her.  
  Ask the grad students whose theses she dismantled—then rebuilt, sharper. They felt *seen*, not savaged.  
  Ask her hiking buddies when she stops dead on a trail, points at a scatter of rocks, and mutters: *“Is that topology intentional?”*  
  Ask her grandkids when she explains why the sky is blue using nothing but a glass of water and a bad pun. [*Wink at kids*]  
  Stuff disappears. Equations survive. And Eleanor? She leaves fingerprints on how you think. She doesn’t just occupy a room; she reconfigures its gravity.  

  [*Shift tone, lighter*]  
  So. A joke for the philosophers:  
  They say Eleanor’s structural realism is “agnostic about the furniture.”  
  Which means, if you ask her *what’s really sitting in space-time’s grand structure?*  
  Her answer, roughly translated:  
  [*Shrug, deadpan*]  
  “Could be quarks. Could be qualia. Could be confetti from a cosmic parade none of us got tickets to. Doesn’t matter. The *structure’s* real. Pass the wine.”  

  And for the grandkids? Three words:  
  **“Stuff. Shapes. Grandma.”**  
  Say it fast. Stuff Shapes Grandma. Sounds silly? Good. But remember it. Because Grandma spent forty years proving the *Shapes* outlast the *Stuff*. ✂️  

  [*Raise glass higher*]  
  To Eleanor.  
  Who taught us that what endures isn’t the thing-in-itself…  
  …it’s the relation-in-itself.  
  Who never pretended her blueprint was the final draft.  
  Who wrestled with The Furniture Problem like a bear with a knot—and left the knot intact for the rest of us to gnaw on.  
  Who built a career, a legacy, and a damn fine hiking group…  
  …all on the unshakeable conviction that the pattern *matters*.  

  So here’s to the structure she found—and the one she became.  
  To Eleanor!  

  ---

  **Why this works:**  
  - **Structural Work:** The novel draft analogy *is* used but immediately undercut ("too kind"), turning it into homage + honesty. The "archaeology of blueprints" replaces it cleanly.  
  - **Describing Her:** Avoids "twee" by focusing on *impact* (grad students, hikers, grandkids) not vague poetic qualities. "Reconfigures gravity" implies her force without softness.  
  - **Jokes:** Expert joke ties to agnosticism ("cosmic parade confetti"). Kid joke ("Stuff Shapes Grandma") is sticky nonsense with a kernel of her life's work.  
  - **No Seminar:** Zero jargon drops. "Furniture Problem" is accessible metaphor masking deep doubt.  
  - **Love, Sideways:** In the respect for her rigor, her unsolved problem ("left the knot intact"), and the specificity of her impact ("fingerprints on how you think"). The warmth is in the *details*, not the tone.  
  - **Eleanor’s Touch:** Highlights her intellectual honesty & humor. The "pass the wine" shrug is quintessential tough-academic-avoids-pretension.  

  **To cut to 4 mins:** Trim the archaeology paragraph (✂️) and/or shorten the "describe her" section to just grad students + grandkids. Keep "Stuff Shapes Grandma" – it’s gold.  

  Go deliver it like you’re handing her a perfectly fitted puzzle piece – no fuss, just right. She’ll hate how much she loves it.
