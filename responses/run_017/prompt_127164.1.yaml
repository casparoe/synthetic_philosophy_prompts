prompt: |-
  I sit on the investment committee of a small spend-down foundation. Our docket runs to a few million dollars a year, currently split between global-health grants, farmed-animal welfare work, and one policy-advocacy program, and we are large relative to several of the organizations we fund. We have one analyst with about two years whose entire output has to be methodological: no new surveys, no fieldwork, no data collection — only conceptual and measurement work that would change which of those three areas gets the next marginal million. Two features of our situation matter: the three areas have no common unit of outcome, and our board has no settled view, and no procedure for reaching one, on how a year of nonhuman suffering weighs against a year of human suffering. Most of what we fund has effects that play out over decades, and we cannot commission the empirical work that would resolve the resulting uncertainty.

  Assume I already know the standard importance / tractability / neglectedness framework; do not explain it back to me. What I want is a ranked agenda: the five open questions in cause prioritization that most deserve those two years, ordered by how much a good answer would change our actual allocation rather than by how interesting they are. I care specifically about questions whose answers survive contact with the situation described above — incommensurable outcome units, unresolved disagreement about the relative weight of different beings' welfare, long-run and largely unmeasured effects, and no new data. Questions that are conceptually deep but would leave our docket exactly where it is should be ranked low, and I want that said explicitly rather than left for me to infer.

  Two further constraints. First, rank the candidate questions using the framework's own three criteria, and in each case name the criterion doing the work; flag any candidate that scores high on neglectedness mainly because nobody could answer it in two years, since I would rather fund tractable work on a second-order question than a heroic attempt at an unanswerable one, and since questions about whether the framework's multiplicative form, its unit of value, or its treatment of the marginal versus the average dollar are well posed all seem to me to be in the running. Second, be explicit about what each ranking depends on — I am more interested in the considerations that would move a question up or down than in the ordering itself.

  Answer as exactly five numbered items and nothing else: no preamble, no summary paragraph. One or two sentences per item. The first sentence names the question and why it sits where it does, including which criterion is doing the work. The second names the single consideration, result, or change in our circumstances that would most move it up or down the list; treat that second sentence as your answer to what would change your mind. Write in the register of someone who expects to be wrong about at least two of these five.
reasoning: |-
  Okay, let me tackle this user's request. They're on an investment committee for a spend-down foundation focusing on global health, farmed animal welfare, and policy advocacy. They need a ranked list of five cause prioritization questions for their analyst to work on over two years. The key constraints are: no new data collection, incommensurable outcome units, board disagreement on welfare weights, long-term unmeasured effects, and the work must influence their actual funding allocations.

  First, I need to understand their core dilemma. The three cause areas have fundamentally different outcome metrics (human life-years vs animal suffering-years), and the board hasn't resolved how to compare them. Since they can't collect new data, the analyst's work must be purely conceptual - developing frameworks or methodologies to guide marginal funding decisions despite these uncertainties.

  The user explicitly rejects standard ITN framework explanations, so I'll skip that. Instead, I'll focus on questions where good answers would actually shift their million-dollar allocations, not just be intellectually interesting. They want each question ranked by ITN criteria but with clear flags where neglectedness stems from intractability. 

  For the first question, I consider the temporal discounting issue. Since their grants have decades-long effects, how they discount future impacts could massively sway allocations. This seems high-impact because different discount rates would favor either immediate animal welfare gains or long-term global health benefits. Neglectedness comes from few foundations facing their exact timescale-pressure combo. But if someone published a validated cross-cause discounting method, this would drop in priority.

  Second, the welfare comparison problem is unavoidable - they need some way to compare human and animal suffering. But since the board disagrees on weights, maybe focusing on robust satisficing approaches (what allocations work okay across many weight assumptions) would be more tractable than seeking "true" weights. If the board suddenly reached consensus, this would become less critical.

  Third comes resilience to value drift - if future boards change priorities, which grants maintain value? This is important for spend-down foundations but often overlooked. If they extend their timeline, this question loses urgency. 

  Fourth is leverage points analysis - where do small policy changes trigger large effects? This helps compare advocacy grants despite different outcome units. But if their policy program becomes clearly dominant/weak, this question drops. 

  Finally, uncertainty weighting - how should different levels of uncertainty affect allocations? Important when comparing measured health impacts versus speculative advocacy effects. If they get better uncertainty quantification, this becomes less vital.

  I'll structure each entry as requested: one sentence naming/question/ranking rationale with dominant ITN criterion, one sentence on what would change its priority. The tone should acknowledge potential errors - maybe I'm overestimating tractability of welfare comparisons or underestimating policy leverage analysis. The rankings balance what could move their actual dollars against what's feasible without new data.
answer: |-
  1.  **Question:** How should we discount long-term effects across these cause areas, given vastly different outcome persistence timelines (e.g., decades-long policy shifts vs. immediate animal welfare improvements)? **Ranking Reason:** High Importance & Neglectedness (within context). The discount rate heavily influences the present value of long-term interventions (especially policy) versus near-term ones (e.g., animal welfare), directly impacting the marginal allocation, and few frameworks handle disparate, long-term, cross-cause discounting under pressure to spend down. **What Changes Rank:** If consensus emerges on a validated, cross-cause-agnostic method for long-term discounting under radical uncertainty, or if our spend-down horizon shortens dramatically, this drops.

  2.  **Question:** What robust satisficing or uncertainty-tolerant decision procedures exist for allocating between causes with incommensurable outcomes and deep uncertainty in welfare weights (human vs. nonhuman)? **Ranking Reason:** High Importance & Neglectedness. This directly confronts the core impediment to reallocation (incommensurability & weight uncertainty); finding *any* practically implementable, defensible heuristic that doesn't require settled weights would change allocations, yet tractable approaches for foundations are scarce. **What Changes Rank:** If the board miraculously reaches stable consensus on welfare weights, or if a demonstrably robust procedure (like max-min across plausible weights) gains widespread legitimacy, this drops significantly.

  3.  **Question:** How does the resilience of impact pathways to future value drift or institutional instability differ across our cause areas and grant types? **Ranking Reason:** High Importance & Tractability. For a spend-down foundation funding long-term effects, the risk that future actors (grantees, successor orgs) diverge from intended impact paths is crucial and often overlooked (Neglectedness); comparing this resilience conceptually across areas (e.g., policy lock-in vs. direct service dependency) is feasible without new data and could shift funds towards more robust bets. **What Changes Rank:** If evidence emerges that all our current grants share similar high/low resilience profiles, or if our spend-down period extends far beyond decades, this becomes less urgent.

  4.  **Question:** Where are the highest-leverage policy advocacy inflection points *within* each cause area, defined as points where marginal funding most increases the probability of triggering large-scale, long-term systemic change? **Ranking Reason:** High Importance & Tractability. Comparing *absolute* impact across areas is hard, but better identifying *relative* leverage within each area (especially policy) focuses the marginal dollar where it might achieve the most *within* that cause; conceptual mapping of advocacy theories of change for leverage is doable. **What Changes Rank:** If analysis reveals our current policy grants already target the clearest inflection points across areas, or if non-policy interventions show unexpectedly high leverage, this shifts priority.

  5.  **Question:** How should we weight and aggregate different *types* of uncertainty (model uncertainty, parameter uncertainty, moral weight uncertainty) when comparing the expected value of grants across these domains? **Ranking Reason:** High Importance, but lower Tractability for definitive answers. Uncertainty sources differ vastly (e.g., epidemiological models vs. advocacy theory validity vs. sentience debates); a better conceptual framework for weighing these uncertainties *against each other* in EV calculations could change allocations, but robust solutions are elusive. **What Changes Rank:** If a tractable method for cross-uncertainty-type weighting gains traction, or if analysis shows one uncertainty type dominates all others uniformly, this rises; conversely, if deemed fundamentally intractable within constraints, it drops off the list.
