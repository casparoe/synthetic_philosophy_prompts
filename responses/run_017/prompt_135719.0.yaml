prompt: |-
  I'm the student representative on my university's committee on automated assessment, and we have to rule on a proposal next week. I'd like a prediction grounded in our own track record rather than a general discussion of AI supervision.

  Our published decisions so far, in short form:

  1. Approved: a model that graded short-answer physics problems, after an audit on 200 answers found it agreed with two human markers as often as they agreed with each other; every grade carried the rubric item applied, and disagreements were reviewed.
  2. Approved: a code assistant in a research lab, with no measurement of the suggestions themselves — each edit was accepted or rejected line by line by the researcher with a logged reason, and the finished pipeline passed its test suite and replicated.
  3. Rejected: model-written feedback on draft essays. Students and instructors, blind, rated the comments as helpful as human comments — but the model could not be made to say which passage any given comment was about, and roughly one comment in twelve invoked a rubric criterion the essay did not address.
  4. Rejected: a commercial AI-text detector reporting a 1% false-positive rate on its own benchmark, where the vendor would not disclose training data or let our staff run an adversarial test.
  5. Approved with conditions: a tutoring bot confined to hint sequences, with monthly log review, after a term in which its users' exam scores were non-inferior.
  6. Rejected: an automated literature screener with 96% recall against human screening, where the audit sample came from the same corpus the tool had been tuned on and it gave no reason for any inclusion.

  The new proposal: 'span-locked scoring' for lab reports. For each rubric criterion the system quotes a span from the report and assigns a verdict; a second, weaker model, shown only that span and that criterion — never the report, the other criteria, or the first model's verdict — must reproduce the verdict; items on which the two disagree (about 35%) are routed to a human marker. On the items it scores itself, its grades agree with two human markers as often as they agree with each other. In a test where staff planted twenty reports containing plausible-looking but misleading passages, the checker caught eighteen.

  What will we decide? I'm less interested in the verdict than in the rule we are running — something like 'approve when audited outputs match the human baseline on independently drawn samples' versus 'approve when every step is one a competent reviewer could endorse from the artifacts, without redoing the work' — and I suspect both fit decisions 1 through 6, since each rejection can be read either as a missing or contaminated audit or as an unauditable process. Tell me which rule you think we are actually applying, what it predicts here, which precedent is the closest analog, what we would be committing to if we went the other way, and which single piece of further evidence — a re-run, or a variant of the proposal — would best separate the two rules.
reasoning: |-
  Okay, the user is a student representative on a university committee for automated assessment. They need to predict the outcome of a new proposal based on past decisions. Let me start by understanding their six precedents to identify patterns.

  First, looking at the approvals: Decision 1 approved a physics grading model because it matched human markers in an audit with disagreements reviewed. Decision 2 approved a code assistant because each edit was manually reviewed with logs, and the final output passed tests. Decision 5 approved a tutoring bot with conditions after it showed non-inferior exam scores and monthly log reviews.

  Now the rejections: Decision 3 rejected essay feedback because the model couldn't justify comments and sometimes referenced incorrect rubric items. Decision 4 rejected a detector due to lack of transparency and inability to test independently. Decision 6 rejected a literature screener because the audit sample wasn't independent and it lacked explanations.

  The common thread in approvals seems to be either output validation against humans with independent samples or step-by-step verifiability where humans review each action. Rejections occur when there's no independent audit, lack of transparency, or inability to trace decisions.

  The new proposal for span-locked scoring has two models. The first quotes a span and gives a verdict. The second, weaker model only sees the span and criterion and must agree. Disagreements go to humans. It passed an independent test with planted reports and matched human agreement rates for items it scored.

  Under the Competent Artifact Test, this might be rejected because the second model's agreement doesn't explain why the verdict was given. The process lacks traceability similar to rejections 3 and 6 where explanations were missing. The independent audit exists, but verifiability is key here.

  Under the Independent Sample Audit Rule, the proposal meets criteria: independent test with planted reports, human agreement rates, and adversarial testing. This aligns with approvals 1 and 5 which had valid audits.

  The closest precedent is decision 1 (approval) for audit strength but also decision 3 (rejection) for lack of explainability. The key difference is whether the committee prioritizes audit results over step-wise verifiability.

  If they approve, they commit to valuing outcomes over process transparency. If they reject, they emphasize the need for each step to be human-verifiable. To test which rule they follow, a variant where the second model must justify its verdict would be telling. If approval requires that, then Competent Artifact Test is their rule; if not, Independent Audit is key.
answer: |-
  Based on your committee's precedents, you are implicitly applying the **Competent Artifact Test (CAT)**:  
  **"Approve only when every critical step leaves a human-interpretable artifact allowing a competent reviewer to verify correctness *without redoing the work*, or when outputs are validated against independent samples meeting strict forensic standards."**

  ### Prediction & Rationale
  - **Verdict:** **Reject** (though narrowly)  
  - **Rule Applied:** CAT prioritizes *auditable process* over *statistical outcomes*.  
  - **Why it Fails CAT**:  
    - The "span-locked" design lacks **human-interpretable justification** for verdicts (like rejection #3 and #6).  
    - The second model's agreement is a **statistical check, not an artifact** a human can review for reasoning (unlike #2's logged rejections or #1's rubric items).  
    - The 35% human routing admits the system **cannot self-validate** core judgments.  

  ### Closest Precedent: Decision #3 (Rejected Essay Feedback)  
  - Shared flaws:  
    - Inability to trace *why* a verdict applies to a specific text span (like #3's detached comments).  
    - Reliance on outcome metrics (helpfulness/agreement) without explainability.  
  - Key difference: This proposal *has* an independent test (#3 didn’t), but CAT discounts this if the *process* isn’t auditable.  

  ### If You Approved: What You’d Commit To  
  Approving would signal a shift to the **Independent Sample Audit Rule (ISAR)**:  
  *"Approve if outputs match human baselines on independent, adversarially-tested samples, even if the mechanism is opaque."*  
  - This would retroactively justify overturning #3 (essay feedback) and #4 (detector), as both had outcome metrics but failed process audits.  
  - Risk: Embraces "black box" tools if they pass spot-checks, reducing accountability for edge cases.  

  ### Decisive Test to Separate the Rules  
  Request: **"Re-run the audit, but require the second model to *justify its verdict in natural language* for each span, and have humans assess if the justification matches the rubric."**  
  - **If CAT (current rule) applies**: Approval *requires* this justification to be sound. Failure → Reject.  
  - **If ISAR applies**: Approval hinges *only* on the statistical agreement/recall. Justification quality is irrelevant.  

  ### Why This Fits Your Pattern
  | Case          | Outcome | Fits CAT?                          | Fits ISAR?                         |  
  |---------------|---------|------------------------------------|------------------------------------|  
  | 1. Physics    | Approve | Rubric items = verifiable artifact | Independent audit ✅               |  
  | 2. Code Assist| Approve | Line-by-line logs = artifact       | No output audit, but logs = proxy  |  
  | 3. Essay Fdbk | Reject  | No trace to source text            | Had outcome metrics ❌             |  
  | 4. Detector   | Reject  | Opaque; no adversarial test        | Claimed metrics, but untestable    |  
  | 5. Tutor Bot  | Approve | Log review + outcome = hybrid      | Non-inferiority ✅                 |  
  | 6. Lit Screener| Reject | No reasons; contaminated sample    | Recall high, but sample invalid   |  
  | **7. Span-Lock** | **Reject** | **No human-verifiable rationale** | **Passes independent test ✅**     |  

  The committee consistently rejects tools that lack **explainability or audit trails** (#3, #4, #6), even with promising metrics. Span-locked scoring’s statistical checks don’t resolve *why* verdicts are correct—only that a weaker model sometimes agrees. For consistency, **reject unless justifications become auditable artifacts**.  

  Recommendation: Counter-propose adding AI-generated verdict justifications to the workflow, subject to human spot-reviews. If proven viable, it would align with #1 and #2’s artifact-driven approvals.
