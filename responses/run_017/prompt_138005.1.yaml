  - Reading 4 is about ideal agents and does not apply to bounded ones.
  - Reading 6 is about bounded agents and directly supports the dismissal.

  However, Reading 6 is very strong and arguably false because it forces bounded agents to either refuse to bet (which might not be allowed) or assign 0/1 arbitrarily and take a sure loss if they are wrong.

  The OP already accepts that ideal agents should assign 0 or 1 to mathematical truths (so Reading 4 is conceded for ideal agents). But the issue is about bounded agents.

  Now, the case of equivalence arbitrage: if the agent must assign probabilities, then under Reading 6 they would be forced to assign 0 or 1 to both A and B. But without knowing the equivalence, they might assign 1 to A and 0 to B (if they are inconsistent) or 1 to both (if they happen to be right) or 0 to both. But note that the assignment of 0 or 1 without knowing the truth is arbitrary and might be wrong. The bookie can then exploit by betting against the agent on the one that is false. So even under Reading 6, the agent might be exploited. Alternatively, if the agent refuses to assign probabilities, they avoid the arbitrage.

  But the OP's original point is that bounded agents might need to assign non-extreme probabilities to avoid being exploited in other ways (e.g., by having to set odds for a bookie who forces them to bet). The equivalence arbitrage case shows that non-extreme probabilities can also be exploited if the agent is inconsistent. The bounded agent might try to be consistent by assigning the same probability to logically equivalent statements, but without knowing the equivalence, they cannot. So there is no perfect solution for a bounded agent.

  Which reading do I guess the commenter meant? The commenter said "2 + 2 = 4" as if to say that this is obviously true and we don't assign probabilities to it. So they are likely thinking of a very strong view: that mathematical truths are certain and that any uncertainty is irrational (even for bounded agents). So Reading 6 seems the most likely candidate. Alternatively, they might be thinking of Reading 4 (ideals) and ignoring boundedness.

  Which single reading should the OP concede? The OP might concede Reading 2 (trivial) and Reading 1 (if they are a mathematical realist). Also, Reading 3 for known entailments. But the main point of contention is about unproven claims. The OP should concede that for claims that are proven (and known by the agent) we assign probability 1 (Reading 3). But for unproven claims, the OP wants to assign non-extreme probabilities. The strongest reading that the OP might concede is Reading 5: that the uncertainty is empirical. But note that the OP might not even need to concede that because they might think that the uncertainty is about the mathematical fact itself (if they are subjectivists).

  However, to be conciliatory, the OP might concede that for an ideal agent (Reading 4) we would assign 0 or 1. But the core of the OP's argument is about bounded agents, so they should not concede Reading 6.

