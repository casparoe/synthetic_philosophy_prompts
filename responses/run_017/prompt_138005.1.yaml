  2. The "equivalence arbitrage" case: two formulations of the same conjecture, where the agent assigns different probabilities and a bookie with more compute can prove equivalence and exploit the difference.

  Finally, we are to guess which reading the commenter meant and which one the OP should concede.

  Let's go through the readings one by one.

  ### Reading 1: Mathematical claims have determinate truth values.

  - **Precise statement**: For every well-formed mathematical proposition (at least in the domains we are considering, such as arithmetic), it is either true or false (but not both). There is no third option or indeterminacy.
  - **Classification**: Substantive and defensible. This is a standard view in classical mathematics (Platonism or realism) but contested by intuitionists and constructivists. However, within classical mathematics, it is widely accepted.
  - **Domain**: About the world (if one is a Platonist) or about the nature of mathematical reality. It is not about agents per se.
  - **Support for dismissal?**: Weak support. It establishes that the claim has a definite answer, but it does not by itself imply that we should not assign non-extreme probabilities. We might still be uncertain about that definite truth. So it does not settle the issue of whether we can or should assign probabilities.

  ### Reading 2: Some mathematical claims can be settled by proof rather than by evidence.

  - **Precise statement**: There exist mathematical claims that can be conclusively established by a deductive proof (which does not rely on empirical evidence) in a way that empirical claims (which require sensory evidence) cannot be.
  - **Classification**: Trivial. This is a basic feature of mathematics and is generally accepted. Empirical claims are contingent and require observation; mathematical claims, once proven, are necessary.
  - **Domain**: About the nature of mathematical knowledge versus empirical knowledge. It is about the world and how we come to know things.
  - **Support for dismissal?**: Very weak. It does not say anything about unproven claims. For unproven claims, we might still have uncertainty. Also, it does not address the bounded agent.

  ### Reading 3: Rational credence is closed under known entailment.

  - **Precise statement**: If an agent knows (with certainty) a set of propositions S, and knows that S entails a proposition P, then the agent must assign probability 1 to P. (Note: This does not require the agent to know all entailments, only the ones they know.)
  - **Classification**: Substantive and defensible. This is a principle of Bayesian epistemology (sometimes called the principle of conditionalization or deductive closure for known implications). However, it is not without controversy, especially in the context of logical non-omniscience. But it is a common idealization.
  - **Domain**: About ideal agents? It is a normative principle for rationality. It is not about bounded agents because bounded agents might not know all entailments.
  - **Support for dismissal?**: It does not directly address unproven mathematical claims that the agent does not know how to prove. It only says that once you know a proof, you must assign probability 1. It does not say what to do before you know the proof. So it does not dismiss assigning probabilities to unproven claims.

  ### Reading 4: A fully rational agent is logically omniscient.

  - **Precise statement**: A fully rational agent must assign probability 1 to all tautologies (logical truths) and to all mathematical truths (if we take mathematics to be necessary). Moreover, they must assign probability 0 to all contradictions and mathematical falsehoods.
  - **Classification**: Substantive and contested. It is an idealization that is often used in Bayesian epistemology (especially in the context of complete theories) but is widely recognized as unrealistic for any actual agent. Many argue that rationality should account for bounded resources.
  - **Domain**: About ideal agents (unbounded, with infinite computational resources).
