  - Reading 4: for an ideal agent, we must assign 0 or 1. But the OP is about bounded agents.
  - Reading 6: even for bounded agents, we must assign 0 or 1 (or refuse). This directly dismisses the OP's practice.

  Readings 1, 2, 3, and 5 do not directly support the dismissal. They either establish that mathematics has definite truth values (1) or that proof is special (2) or that once we know the proof we must assign 1 (3) or that the uncertainty is empirical (5). But none of these say that we shouldn't assign non-extreme probabilities to unproven claims.

