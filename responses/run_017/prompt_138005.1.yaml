  ### Reading 5: All apparent uncertainty about mathematics is empirical uncertainty in disguise.

  - **Precise statement**: When an agent assigns a non-extreme probability to a mathematical claim, this uncertainty is not about the mathematical truth per se (which is necessary and fixed) but about empirical matters: e.g., the reliability of one's memory, the correctness of the hardware running the proof, whether a proof search will terminate, or what the mathematical community will eventually accept.
  - **Classification**: Substantive and contested. This view is held by some (e.g., certain forms of empiricism about mathematics) but is not universally accepted. It is related to the idea that mathematics is a priori but our access to it is through empirical means.
  - **Domain**: About the nature of uncertainty. It is about how agents (bounded or unbounded) should interpret their own uncertainty.
  - **Support for dismissal?**: It might support the dismissal if the commenter thinks that the uncertainty is not about the mathematics itself. However, it does not say that we shouldn't assign probabilities. In fact, it might be used to justify assigning probabilities (but to the empirical factors). Moreover, the OP's example of the digit of π might then be interpreted as uncertainty about the outcome of a computation (which is empirical). So it does not necessarily dismiss the practice; it reinterprets it.

  ### Reading 6: Any non-extreme probability on a decidable arithmetic claim is strictly irrational, regardless of boundedness.

  - **Precise statement**: For any arithmetic claim that is decidable (i.e., there exists a finite procedure that will determine its truth) and for any agent (even a bounded one), it is irrational to assign a probability other than 0 or 1. The agent should either wait until they can decide it (if possible) or refuse to bet, but not assign intermediate probabilities.
  - **Classification**: Substantive and contested. It is straightforwardly false if we consider bounded agents who cannot run the computation within their lifetime or resource constraints. However, some might argue that the agent should still assign 0 or 1 because the truth is fixed and the agent should not pretend to uncertainty about a necessary truth. But this ignores the practical constraints.
  - **Domain**: About bounded agents. But note: this reading explicitly includes bounded agents.
  - **Support for dismissal?**: Yes, this reading directly supports the commenter's dismissal. It says that even for a bounded agent, non-extreme probabilities are irrational. But it is highly controversial because it may force the agent to take a sure loss if they are forced to bet (if they refuse to bet, they avoid the loss, but if they are forced to set odds, they might be exploited).

  Now, we must consider the two constraints:

