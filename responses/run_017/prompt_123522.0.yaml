prompt: |-
  im taking a philosophy of maths seminar this term and we've spent the last couple weeks on intuitionism and constructivism, and I found a chapter in a popular book on mathematical controversies that a friend lent me. I want to know how much of it to trust, because half of it lines up with what my prof said and half of it definately doesn't. The chapter says:

  "Intuitionistic logic is simply classical logic with the law of the excluded middle deleted. Since intuitionists refuse to assume that every statement is either true or false, they cannot use proof by contradiction at all, and this forces them to give up large parts of modern mathematics: they cannot even work with the real numbers in the ordinary way, because in intuitionistic analysis every function from the reals to the reals is provably continuous, which is plainly absurd and refutes the whole program. The motivation is Brouwer's idea that mathematical objects are mental constructions, so a mathematical statement only becomes true once somebody actually constructs a proof of it, and its truth value can change as our knowledge grows. The compensation is that intuitionistic proof carries computational content: anything proved intuitionistically comes with an algorithm attached, so intuitionistic mathematics is really a branch of computer science rather than a rival to ordinary mathematics."

  There's also a footnote I cant make sense of: it says intuitionistic systems actually *validate* the full axiom of choice, and offers that as a final reductio, since choice is supposed to be the controversial principle, not excluded middle. That sounds backwards to me but I may be reading it wrong.

  My prof made us derive not-not-(P or not-P) in our natural deduction system last week with no excluded middle anywhere, and said something about how intuitionists can even show that it's not the case that P-or-not-P fails, whatever that means — so the "either true or false" bit seems off. Also, my TA said the last sentence about algorithms is the single most misleading line in the paragraph and sort of laughed when I said I thought it sounded like the good part. But the continuity claim I find genuinely disturbing: surely if your framework proves something flat-out false about functions, that's a reductio of the framework, not a feature? And is it right that you lose proof by contradiction entirely, because I've definitely used "assume P, derive a contradiction, conclude not-P" in our homework and I think that counted as fine.

  Can you go through the passage claim by claim and tell me what a constructivist would actually accept, what's a half-true popularization (i.e. something a careful constructivist would wince at but not reject), and what's just wrong — including whether the footnote is right? And does the punchline, that intuitionism is just computer science in disguise, survive once you fix the rest?
reasoning: |-
  Okay, let me try to figure out what's going on here. The user is in a philosophy of math seminar focusing on intuitionism and constructivism. They found a chapter in a popular book that seems partially accurate and partially off, compared to what their professor said. I need to unpack each claim in that passage, correct misunderstandings, and explain where the book gets it right or wrong.

  First, the book claims intuitionistic logic is just classical logic without excluded middle. But the user mentioned that their professor had them derive ¬¬(P ∨ ¬P) without LEM. That's a key point. Intuitionistic logic doesn't just remove LEM; it changes how negation, disjunction, and implication work. For example, double negation elimination isn't allowed, and the De Morgan laws are different. The book's oversimplification misses these nuances.

  Next, the part about proof by contradiction. The user says they've used "assume P, derive contradiction, conclude ¬P" in homework, which is valid in intuitionism. But the book says they can't use proof by contradiction at all. The confusion here is between proving negation (which is fine) and proving a positive statement by contradiction, which requires LEM. The book likely conflates these two.

  Then there's the claim about real numbers and functions being continuous. The user is disturbed because that seems absurd. But actually, Brouwer proved that all total functions are continuous in his intuitionistic framework, which is a feature, not a bug. Classical math has discontinuous functions, but constructivists see those as non-constructive. So the book misrepresents this as a flaw when it's intentional.

  The motivation part about mental constructions and truth changing with knowledge seems correct. Brouwer's ideas align with that. But the computational content part is where the TA laughed. The book says intuitionistic math is "a branch of computer science," but that's misleading. While there's a connection via the Curry-Howard correspondence, intuitionism is a philosophy of math, not just CS. The TA's reaction makes sense here.

  The footnote about the axiom of choice is tricky. The user thinks it's backwards. In intuitionistic systems, choice can be valid because proofs involve constructions. But in classical math, choice is non-constructive. So the footnote is right but presents it as a reductio, which it isn't for constructivists. The user's confusion here is understandable.

  Putting it all together, the book has several inaccuracies: oversimplifying the logic, misrepresenting proof by contradiction, framing continuity as absurd, and overemphasizing the CS connection. The user needs clarity on these points for their seminar. They also want to know if the "computer science in disguise" idea holds up. While there's a strong link via proof algorithms, intuitionism is broader than just CS. The core philosophy is about mental constructions, which CS models but doesn't fully encompass.
answer: |-
  This passage contains a mix of accurate points, significant oversimplifications, and outright errors. Let's break it down claim-by-claim, separating constructivist (specifically intuitionistic) reality from the popularization:

  **1. "Intuitionistic logic is simply classical logic with the law of the excluded middle deleted."**
  *   **Reality: Half-True Popularization.** While it's true that intuitionistic logic (`IL`) rejects the Law of the Excluded Middle (`LEM`: `P ∨ ¬P`), it's **not** simply classical logic (`CL`) minus `LEM`. Rejecting `LEM` fundamentally changes the meaning and properties of the logical connectives:
      *   **Negation:** In `IL`, `¬P` means "`P` implies a contradiction". You **cannot** infer `P` from `¬¬P` (double negation elimination fails). This is why your professor had you derive `¬¬(P ∨ ¬P)` – it *is* provable in `IL`, showing that `P ∨ ¬P` cannot be *refuted*, even though it cannot be *asserted*.
      *   **Disjunction:** Proving `A ∨ B` in `IL` requires either a proof of `A` *or* a proof of `B`. You cannot prove it "by cases" if one case leads to contradiction without knowing which one holds.
      *   **Implication:** `P → Q` requires a constructive method to transform any proof of `P` into a proof of `Q`.
      *   **De Morgan's Laws:** Only half hold. `¬(A ∧ B) ⊢ ¬A ∨ ¬B` fails in `IL`, while `¬(A ∨ B) ⊢ ¬A ∧ ¬B` and `¬A ∨ ¬B ⊢ ¬(A ∧ B)` hold.
      *   **Summary:** `IL` has a different semantics (e.g., Kripke models, BHK interpretation) and proof theory. It's a genuinely distinct system, not just a fragment.

  **2. "Since intuitionists refuse to assume that every statement is either true or false, they cannot use proof by contradiction at all..."**
  *   **Reality: Mostly Wrong.**
      *   **Refusing Bivalence:** Correct. Intuitionists reject the classical principle of bivalence (every proposition is determinately true or false independently of our knowledge). Truth is equated with provability/constructability.
      *   **Cannot use proof by contradiction at all: Incorrect.** Intuitionists **can** and **do** use proof by contradiction *to prove negations*. This is precisely what you used in your homework: "Assume `P`, derive contradiction, conclude `¬P`". This is valid in `IL`.
      *   **What they reject:** Proving a *positive* statement `Q` by showing `¬Q` leads to contradiction (`¬¬Q → Q`). This step requires `LEM` (or equivalent) in classical logic and is rejected in `IL`. They also reject deriving `P` from `¬¬P`. The error here is conflating proving a *negation* (allowed) with proving a *positive* via contradiction (often disallowed).

  **3. "...this forces them to give up large parts of modern mathematics..."**
  *   **Reality: True, but with nuance.** Intuitionists indeed reject the validity of many classical theorems whose proofs rely non-constructively on `LEM` or the Axiom of Choice. Examples include:
      *   The existence of a basis for *every* vector space (Hamel basis for `R` over `Q`).
      *   The Tychonoff Theorem for arbitrary products of compact spaces.
      *   The Intermediate Value Theorem *as a general existence claim* (though constructive versions exist).
      *   The Bolzano-Weierstrass Theorem *as a general existence claim*.
      *   Non-constructive existence proofs ("there exists an X such that P(X)") without providing an instance.
      *   **Nuance:** Constructivists rebuild significant portions of analysis, algebra, and topology using constructive principles. They don't "give up" mathematics; they build a *different kind* of mathematics focused on algorithmic content and explicit constructions. What they reject are non-constructive *methods* and *interpretations*.

  **4. "...they cannot even work with the real numbers in the ordinary way, because in intuitionistic analysis every function from the reals to the reals is provably continuous, which is plainly absurd and refutes the whole program."**
  *   **Reality: Misleading & Incorrect Conclusion.**
      *   **Real Numbers:** Correct that the constructive theory of real numbers (`R_c`) differs significantly. `R_c` consists of equivalence classes of *constructive* Cauchy sequences (e.g., with a specified modulus of convergence). Properties like trichotomy (`x < 0 ∨ x = 0 ∨ x > 0`) do *not* hold for all real numbers in `IL`.
      *   **All Functions Continuous: True (in Brouwer's Intuitionism specifically), but NOT absurd.** This is **Brouwer's Theorem** and is a *celebrated result* within intuitionism, not a refutation.
          *   **Why?** In Brouwer's framework, a function `f : R_c → R_c` is defined by a *law* (construction) that must produce the value `f(x)` *based on finite information about `x`*. Since `x` is given as a Cauchy sequence (finite initial segments approximating it), the law defining `f` must be continuous with respect to the topology induced by this approximation process. Discontinuous functions defined classically (like the Dirichlet function) rely on non-constructive principles (`LEM`) to decide if an arbitrary real is rational or not. They are *not* definable as total functions within Brouwer's intuitionistic continuum. **It's not that intuitionism "proves something false"; it's that it defines "real number" and "function" differently, leading to a result incompatible with the classical non-constructive understanding, but perfectly consistent and intended within its own framework.** Calling it "plainly absurd" reflects a classical bias, not an objective flaw.

  **5. "The motivation is Brouwer's idea that mathematical objects are mental constructions, so a mathematical statement only becomes true once somebody actually constructs a proof of it, and its truth value can change as our knowledge grows."**
  *   **Reality: Largely Accurate.** This is a good summary of the core intuitionistic philosophy (Brouwer, Heyting). Truth is identified with verified constructive proof ("proof = truthmaker"). A statement without a proof is not considered true (though it might be false, or its status might be undetermined). New proofs can establish truths that were previously unknown/unproven. (Note: Most modern constructivists, like Bishop, downplay the "mental" aspect and focus on the objective algorithmic requirements).

  **6. "The compensation is that intuitionistic proof carries computational content: anything proved intuitionistically comes with an algorithm attached..."**
  *   **Reality: Essentially True, but...** (Your TA is partially right about the potential for misleading phrasing).
      *   **Core Truth:** This is the **Brouwer-Heyting-Kolmogorov (BHK) Interpretation**. A proof of:
          *   `A ∧ B` is a pair `(a, b)` where `a` proves `A` and `b` proves `B`.
          *   `A ∨ B` is a pair `(i, c)` where `i=0` and `c` proves `A`, or `i=1` and `c` proves `B`.
          *   `A → B` is an *algorithm* (function) converting any proof of `A` into a proof of `B`.
          *   `∃x P(x)` is a pair `(a, p)` where `a` is a witness and `p` proves `P(a)`.
          *   `∀x P(x)` is an *algorithm* converting any `x` (in the domain) into a proof of `P(x)`.
      *   **The "Algorithm Attached":** Yes, constructive proofs inherently contain the computational procedures described by the BHK interpretation. Extracting executable programs from constructive proofs is a major area (proof mining, realizability).
      *   **Why TA might wince/laugh ("most misleading line"):**
          *   **"Comes with an algorithm attached":** Sounds like a magical bonus feature tacked on. It's *inherent* in the *meaning* of the proof within intuitionism. The proof *is* (or directly encodes) the algorithm.
          *   **"Rather than a rival to ordinary mathematics":** This dismisses the *philosophical* foundation (mental constructions, truth-as-provability) which is central for Brouwer/Heyting. Intuitionism *is* presented as a rival philosophical foundation.
          *   **"Branch of computer science":** While deeply connected (Curry-Howard Isomorphism!), this is a massive reduction. Intuitionism is a philosophy of mathematics with ontological and epistemological claims about the nature of mathematical objects and truth. Computer science provides powerful tools for modeling and understanding constructive mathematics, but intuitionism's aims are broader than just computation. Bishop-style constructivism embraces the computational aspect more explicitly, but still as mathematics.

  **7. Footnote: "...intuitionistic systems actually *validate* the full axiom of choice, and offers that as a final reductio, since choice is supposed to be the controversial principle, not excluded middle."**
  *   **Reality: Half-True Statement, Incorrect Conclusion (Reductio).**
      *   **Validation of Choice: True (in many contexts).** In systems based on the BHK interpretation (like Martin-Löf Type Theory or intuitionistic set theories like `IZF`), a strong form of the Axiom of Choice is often *provable* or *justified*.
          *   **Why?** The BHK meaning of `∀x ∃y P(x, y)` is: *There is an algorithm `f` such that for every `x`, `f(x)` produces a `y` and a proof that `P(x, y)` holds.* This `f` *is* precisely a choice function! The existential quantifier already demands the construction of the witness. So `(∀x ∃y P(x, y)) → ∃f ∀x P(x, f(x))` is a direct consequence of the constructive meaning of the quantifiers.
      *   **As a Reductio? Incorrect.** The author finds this ironic because Choice is controversial classically, while `LEM` is usually accepted. However:
          *   **Classical Controversy:** Choice is controversial classically because it asserts the *existence* of a function *without* specifying it, leading to non-measurable sets, Banach-Tarski, etc.
          *   **Constructive Validation:** In `IL`, the "choice function" `f` isn't just asserted; it's *constructed* by the algorithm inherent in the proof of `∀x ∃y P(x, y)`. It's computationally explicit. The controversy vanishes because the function is provided. This isn't a *reductio* of intuitionism; it's a *consequence* of its foundational principles and demonstrates how its interpretation of quantifiers resolves the classical mystery surrounding Choice. The controversy shifts to `LEM` and non-constructive existence.

  **Summary of the Passage's Accuracy:**

  *   **Accurate:** Motivation (mental constructions, truth-as-proof), Computational content inherent (BHK), Validation of Choice (BHK consequence), Loss of some classical math.
  *   **Oversimplified/Half-True:** Description of logic (`IL` ≠ `CL - LEM`), Nature of constructive reals/analysis.
  *   **Wrong/Misleading:** Inability to use proof-by-contradiction *for negations*, Continuity Theorem as "absurd refutation", Characterization of computational content as mere "compensation" making it CS rather than math/rival, Choice validation as a *reductio*.

  **The Punchline: "Intuitionism is just computer science in disguise?"**

  *   **Survives? Partially, but severely distorted.**
  *   **Strong Connection:** Yes. The Curry-Howard correspondence formalizes the deep isomorphism between intuitionistic proofs and programs (proofs-as-programs, propositions-as-types). Extracting algorithms from constructive proofs is fundamental. Computational realizability is a core interpretation.
  *   **Not *Just* CS:** No. Intuitionism is fundamentally a **philosophy of mathematics** with specific views on:
      *   **Ontology:** What mathematical objects *are* (mental constructions).
      *   **Epistemology:** How we know mathematical truths (via construction).
      *   **Logic:** The correct rules of reasoning (intuitionistic logic).
      *   **Meaning:** What mathematical statements *mean* (BHK).
  *   **Conclusion:** While intuitionistic mathematics is *highly amenable* to computational interpretation and provides a foundation for parts of theoretical computer science, it is not *merely* "computer science in disguise." It is a distinct philosophical and mathematical framework with broader aims. The computational aspect is a profound and valuable *consequence* of its core principles (especially the BHK interpretation), not a reduction of its entire essence. Your TA's reaction highlights the danger of losing the philosophical core in favor of a purely computational view.
