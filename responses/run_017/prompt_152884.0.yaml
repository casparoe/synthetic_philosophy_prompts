prompt: |-
  I am in the upper sixth at a large comprehensive in the Midlands, and this year I chair the school's Heritage Committee. We are five sixth-formers, the head of history, and the volunteer parent who keeps the archive one afternoon a week, and we are responsible for what the school publicly says about its own past: the founders' day address, the display boards in the main corridor, the names on two of the houses, the war memorial in the chapel, and the short historical note that goes out to alumni each summer.

  Our difficulty is that we are repeatedly asked to decide what to do when what the school remembers and what the written record supports come apart. We get eight to twelve such proposals a year, from pupils, staff, alumni and occasionally from people in the village with no connection to the school at all. At the moment we decide each one from scratch; last term we agreed to one proposal and refused another that most of us now think was relevantly the same, and the head of history has quite properly asked what rule we believe ourselves to be following. I would like to be able to show her one.

  So what I am asking for is a decision procedure we can actually run, not a set of principles. Concretely: an ordered series of questions to take a proposal through; what would count as a sufficient answer to each; the point at which the procedure stops with a decision to leave things as they are; the point at which it hands the matter to a named person because the question has stopped being about evidence and become one of values; and the point at which it says that we cannot settle this with what we have, sends the question to research, and adopts a stated interim posture meanwhile. I also want the menu of possible dispositions spelled out, because at present we behave as though the only options are to keep a thing or take it down, and I suspect the useful answers are mostly in between: annotate, relocate, add a second marker, keep the name but retire the practice, suspend an assertion pending research, publish the disagreement rather than resolving it.

  Three half-formed distinctions are doing the work in our discussions at the moment, and I would rather you keep, correct or discard them than work around them. First, we separate memories that are load-bearing from ones that are decorative: a memory is load-bearing, in our usage, if present relationships, promises, reparations or settlements rest on it, and decorative if it is simply part of the backdrop. Second, we ask whether a correction is a substitution or a vacancy — whether a true claim can be put into the same social slot the false one occupied, or whether the correction empties the slot altogether, as replacing a benefactor with a profiteer does. Third, we ask how close the memory-bearers are to the events: participants, heirs who inherited the memory in a continuous chain, or adopters with no connection who took it up later. Please tell me which of these, if any, is doing real work and which is decoration, and if you drop one, say what it was screening for. I would rather have three distinctions that earn their place than five that sound good in minutes.

  The procedure has to be usable by people with no training, in a forty-minute meeting, with the documents in front of them, and it has to produce reasons in writing that the deputy head (pastoral) is willing to sign; anything touching a name on a building also goes to the governors. We have no budget for research beyond about one day of the archivist's time a half-term. Please keep the procedure itself to something that would fit on two sides of A4 and put the worked applications separately.

  The hard cases I need it to sort are these: where the record is silent rather than contradictory, because silence in an archive is often just a record of what someone once thought worth writing down; where two communities remember the same episode differently and the record supports only one of them; where the people whose memory it is are outside the school and we are, in effect, adjudicating someone else's past; and where the memory is not a claim about the past at all but is being used to justify a present arrangement.

  Please then run the procedure on three live proposals.

  (i) Our founders' day address describes Alderman Kell, who funded the school's rescue in 1892, as our founder and benefactor, and the Kell Hall and a still-awarded scholarship carry his name. A postgraduate historian at the nearby university has shared draft findings with us, on condition that we do not publish them yet: the rescue was organised and largely financed by a subscribers' committee, and a substantial part of Kell's fortune came from compensation paid at abolition for enslaved people and from freight contracts carrying indentured labour. The pupil petition asks us to stop calling him our saviour in the address and to put up a panel saying what the money was.

  (ii) One name on the 1921 memorial is that of H. Braithwaite. Service records show he was invalided out with tuberculosis in 1917 and died at home in 1918; the then headmaster's correspondence survives, including the letter from his mother asking that he be counted among our fallen and his reply agreeing to it as a kindness. His great-granddaughter is in Year 12 and reads the lesson at the memorial service; his grave in the village churchyard is still tended by the family. The proposal is to remove the name or footnote it on the board.

  (iii) Nine surviving members of the first girls' intake in 1976 say they were barred from the school's academic prize and directed to a separate competition. The prize lists in the archive begin in 1979 and show no such competition, and the headmaster's log for 1976–78 is missing; there is one undated, uncaptioned photograph of what appears to be a different cup being presented. They would like the school to say that this happened.

  I would rather be told the uncomfortable answer than the comfortable one, so please tell me plainly which of the three the procedure resolves in a way I will find hardest to defend to the rest of the committee, and say plainly at the points where the procedure is trading accuracy for something else — protecting a relationship, honouring an old promise, keeping terms on which two groups have agreed to live together — because if that is what we are doing, our reasons should say so rather than dress it up as evidence. Finally, tell me what the procedure cannot do, and where you would expect it to misfire systematically: I am especially worried about cases where the archive was produced by the same people and the same power that produced the memory, and cases where the disagreement is really about what the facts mean rather than what they are. Please write throughout in British English, as the minutes go into the school's record as they stand.
reasoning: |-
  Okay, the user is chairing a school Heritage Committee dealing with complex historical memory disputes. They need a practical, step-by-step decision procedure rather than abstract principles, with clear thresholds for different outcomes. 

  Hmm, three existing distinctions they're using need evaluation: load-bearing vs decorative memories, substitution vs vacancy corrections, and proximity of memory-bearers. The load-bearing concept seems solid - it directly addresses when changing historical claims could disrupt present relationships. The substitution/vacancy distinction feels messy though; whether a corrected narrative "fits the slot" depends entirely on framing. The proximity framework might accidentally prioritize lineal descent over lived experience.

  Right, the procedure must be operable in 40-minute meetings by untrained volunteers, producing governor-ready written reasons. Key pain points: archival silence, contested community memories, adjudicating external histories, and presentist justifications. The three test cases are perfect stress tests - the Kell benefactor scandal, the contested war memorial entry, and the unverified gender discrimination claim.

  For structure... best to make it linear with off-ramps. Start with evidence verification, then assess memory function, then consider stakeholder impact before determining disposition. Must include "annotate/research/suspend" options beyond binary keep/remove. The interim stance protocol is crucial given their research constraints.

  Ah, the uncomfortable truth: the Braithwaite case (ii) will be hardest to defend. The evidence clearly shows he wasn't a war casualty, but removing his name breaks a century-old promise to a grieving mother and invalidates ongoing family tradition. The procedure forces them to explicitly choose between historical accuracy and honoring commitments - no way to pretty that up as evidentiary.

  Biggest limitations: can't resolve meaning-of-facts disputes (only fact-establishment), and struggles when archives and power structures overlap. Also systematically misfires when emotional attachment outweighs documentary evidence. Should flag that in the "what it cannot do" section.

  Better avoid academic jargon throughout. "Annotate" not "contextualize", "pause" not "suspend". And British English: "governors" not trustees, "archive" not records office. The worked examples must show messy compromises - especially adding Kell's explanatory panel while keeping his name, which won't fully satisfy petitioners.

  Final touch: explicitly state when accuracy is being traded for other values. No weasel words when the procedure chooses compassion over facts. That transparency is clearly important to the user.
answer: |-
  Below is a practical decision procedure designed for your Heritage Committee, adhering to your specifications. The procedure fits on two A4 pages (see **bold headings** for navigation), with worked examples following. British English is used throughout.

  ---

  **HERITAGE COMMITTEE DECISION PROCEDURE**  
  *(Version 1.0, September 2024)*  

  **Purpose**: To assess proposals about the school’s historical narrative when memory and record diverge. Outputs: (a) Accept/Reject proposal, (b) Interim stance pending research, (c) Refer to named person, or (d) One of six dispositions (Section 4).  

  **Required for each case**:  
  - Written proposal (source, requested change, supporting evidence)  
  - Relevant archive documents  
  - 40-minute slot in agenda  

  **Procedure**:  

  1. **VERIFY THE DISCREPANCY**  
     *Question*: "Does verifiable evidence contradict the current narrative?"  
     *Sufficient answer*:  
     - "Contradictory": Record disproves memory (e.g., service papers vs. memorial claim).  
     - "Silent": Record lacks evidence but does not refute memory (e.g., missing logs).  
     - "Consistent": Record supports memory; reject proposal unless new evidence emerges.  
     *Stop if*: "Consistent" → **Decision: Reject proposal**.  
     *Refer if*: Disagreement hinges on interpreting facts (e.g., "Was indentured labour exploitation?") → **Refer to Head of History + Deputy Head (Pastoral)**.  

  2. **ASSESS MEMORY FUNCTION**  
     *Question*: "Is this memory *load-bearing* or *decorative*?"  
     *Definitions*:  
     - **Load-bearing**: Active relationships, promises, reparations, or legal settlements depend on it (e.g., named scholarships, ongoing settlements).  
     - **Decorative**: No present obligations rely on it (e.g., display board captions).  
     *Sufficient answer*: Identify specific present-day impacts (or lack thereof).  
     *Note*: If load-bearing, proceed with caution; decorative allows more flexibility.  

  3. **EVALUATE STAKEHOLDER PROXIMITY**  
     *Question*: "Who bears this memory, and what is their connection to events?"  
     *Categories*:  
     - **Participants**: Directly involved (e.g., alumni recalling discrimination).  
     - **Heirs**: Inherited via continuous lineage (e.g., family tending a grave).  
     - **Adopters**: No direct link; memory adopted later (e.g., village folklore).  
     *Sufficient answer*: Categorise primary stakeholders. Weight: Participants > Heirs > Adopters.  

  4. **DETERMINE DISPOSITION**  
     *Apply rules below*:  
     | Evidence Status | Memory Type      | Stakeholder Proximity | Disposition                     |  
     |-----------------|------------------|------------------------|---------------------------------|  
     | Contradictory   | Decorative       | Any                    | **Remove/Replace**              |  
     | Contradictory   | Load-bearing     | Participants/Heirs     | **Annotate** (add context)      |  
     | Contradictory   | Load-bearing     | Adopters               | **Remove/Replace**              |  
     | Silent          | Load-bearing     | Participants/Heirs     | **Suspend + Research**          |  
     | Silent          | Load-bearing     | Adopters               | **Retire Practice** (keep name) |  
     | Silent          | Decorative       | Any                    | **Publish Disagreement**        |  
     *Special cases*:  
     - Vacancy risk (no "true" substitute)? → **Relocate + Annotate** (e.g., move a plaque to archive with explanation).  
     - Proposal requests removal only? → Consider if **Add Counter-Marker** addresses concern.  

  5. **RESEARCH & INTERIM STANCE**  
     *If evidence is "silent" for load-bearing memory*:  
     - **Allocate research** (max. 1 day/archivist per half-term).  
     - **Interim stance**: "This claim is currently unverified. We are investigating."  
     - *Stop*: Research outcome returns to Step 1.  

  6. **FINALISE DECISION**  
     - Draft written reasons citing: (a) Evidence status, (b) Memory function, (c) Stakeholder proximity.  
     - For trade-offs (e.g., accuracy vs. promise), state explicitly:  
       *"We prioritise [e.g., honouring a historical promise] over [e.g., factual precision] because [e.g., it maintains a load-bearing relationship with heirs]."*  
     - Secure Deputy Head (Pastoral) sign-off. Governors approve building name changes.  

  **Procedure Ends**.  

  ---  
  **WORKED APPLICATIONS**  

  **Case (i): Alderman Kell Narrative**  
  1. **Verify Discrepancy**: Evidence is *contradictory* (subscribers’ committee led rescue; wealth linked to slavery/indenture).  
  2. **Memory Function**: *Load-bearing* (scholarship, building name, founders’ address imply moral debt).  
  3. **Stakeholder Proximity**: *Adopters* (no direct heirs involved; school adopted narrative).  
  4. **Disposition**: **Annotate** (add explanatory panel). *Rationale*: Load-bearing but adopters; annotation balances accountability without invalidating scholarships.  
  5. **Interim/Research**: Not needed.  
  *Decision*: Revise founders’ address to omit "saviour"; install panel in Kell Hall detailing rescue’s true funding and Kell’s wealth sources.  

  **Case (ii): H. Braithwaite War Memorial**  
  1. **Verify Discrepancy**: Evidence *contradictory* (service records show TB death; not war casualty).  
  2. **Memory Function**: *Load-bearing* (family promise; grave-tending; memorial role).  
  3. **Stakeholder Proximity**: *Heirs* (great-granddaughter actively inherits memory).  
  4. **Disposition**: **Annotate** (add footnote: "Died of illness post-discharge; included at family request"). *Rationale*: Contradictory but load-bearing for heirs; annotation respects both truth and promise.  
  5. **Interim/Research**: Not needed.  
  *Decision*: Footnote the memorial; no removal. Great-granddaughter continues reading lesson.  

  **Case (iii): 1976 Girls’ Prize Discrimination**  
  1. **Verify Discrepancy**: Evidence *silent* (no prize lists/logs; photo ambiguous).  
  2. **Memory Function**: *Load-bearing* (allege systemic discrimination; impacts school’s equity narrative).  
  3. **Stakeholder Proximity**: *Participants* (surviving members were pupils).  
  4. **Disposition**: **Suspend + Research** (allocating archivist time). **Interim stance**: "Allegations under investigation; we welcome further evidence."  
  5. **Research**: Cross-reference oral histories; seek external 1976 records.  
  *Decision*: Delay official acknowledgment; publish interim statement inviting evidence.  

  ---  
  **HARDEST CASE TO DEFEND**  
  **Case (ii) (Braithwaite)** will be toughest. The procedure forces you to explicitly prioritise honouring a historical promise to a family (load-bearing for heirs) over factual accuracy. Your written reason must state:  
  > *"Though evidence contradicts Braithwaite’s status as a war casualty, we uphold the 1921 promise to his mother—a load-bearing commitment to heirs. Accuracy is secondary here to maintaining trust with families."*  
  This may anger those prioritising memorial integrity.  

  **WHERE THE PROCEDURE TRADES ACCURACY FOR OTHER VALUES**  
  - **Load-bearing memories for heirs/participants**: Accuracy may be compromised to preserve relationships (e.g., Braithwaite footnote).  
  - **Vacancy risks**: If no "true" substitute exists (e.g., a founder’s name linked to slavery), relocation + annotation admits the void rather than filling it falsely.  

  **LIMITATIONS & SYSTEMATIC MISFIRES**  
  1. **Archive-power overlap**: Fails when archives were curated by memory-shapers (e.g., excluding dissent). *Mitigation*: Prioritise participant testimony.  
  2. **Disputes about meaning** (not facts): Cannot resolve e.g., "Does Kell’s philanthropy negate his profiteering?" *Mitigation*: Refer to Head/Deputy Head.  
  3. **Emotional weight vs. evidence**: Systematically underestimates non-documentary stakes (e.g., graves as living memory).  
  4. **Silence misinterpreted**: May over-privilege written records when silence reflects systemic erasure (e.g., marginalised groups).  

  **ADJUSTMENTS TO YOUR DISTINCTIONS**  
  - **Kept**: *Load-bearing vs. decorative*. Vital for prioritisation.  
  - **Discarded**: *Substitution vs. vacancy*. Social "slots" are subjective; focus on whether the *function* of the memory can adapt (e.g., annotation fills an explanatory role).  
  - **Reframed**: *Proximity* now focuses on *stakeholder type* (participants/heirs/adopters) not temporal closeness. "Heirs" replaced "continuous chain" to include cultural (not just lineal) inheritance.  

  This procedure provides auditable, consistent rules while accommodating complexity. It fits your operational constraints and makes value trade-offs transparent—critical for governor scrutiny.  

  ---  
  **Final Note**: This framework treats heritage as a *process* of negotiation, not a fixed record. It accepts that schools, like nations, often need to "live with" imperfect histories while incrementally correcting them. Your committee’s work is not arbitration but stewardship.
