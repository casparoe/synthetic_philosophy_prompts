prompt: |-
  I'm a software engineer with no philosophy background and I've somehow ended up deep in the aquaculture animal-welfare rabbit hole. Please don't give me citations or reading lists, I can't check them anyway. What I actually want is a spec.

  The purpose first, so adequacy has something to be relative to: I want a theory of welfare good enough to do three concrete jobs. (1) Decide whether some change at a farm is a real improvement or just a different-looking one — lower stocking density, swapping ice-slurry chilling for electrical stunning, stopping eyestalk ablation on the broodstock, whatever. (2) Compare across species, because someone will ask whether a kilo of shrimp is worse than a kilo of salmon and "it depends" is not shippable. (3) Be implementable as an actual check a person can run on a farm holding thousands or millions of animals they will never inspect individually.

  So write the desiderata: what any theory has to deliver to count as adequate for that, with the case or consideration behind each requirement. The cases I want covered include: a shrimp whose eyestalk is ablated and then goes on eating and spawning normally; a fish with fin erosion and a deformed jaw that still feeds and grows at target rate; an animal that looks calm only because it's apathetic; the one individual in the pen who is doing terribly and will never be sampled; a whole life that lasts eight months; and whether death is a welfare item at all or only the stuff before it. Also the two I think are traps: welfare indicators that are tied to productivity (growth, feed conversion), so that a farm can score well while the animals are worse off; and breeding animals that no longer express the indicator — fish selectively bred not to thrash — which improves every measurement and maybe improves nothing.

  Distinctions it isn't allowed to collapse: welfare versus moral status, how bad versus how many, state at a time versus over a lifetime, and the animal's actual condition versus the number the audit produces.

  It also has to be consistent with the biology without leaning on anatomy these animals don't have — fish don't have the layered cortex mammals have, decapods are wired differently again — and it should say what experiment would settle the question and what result would count as evidence of feeling rather than of nociception alone.

  Mark each requirement non-negotiable or a preference of one camp. Flag the pairs you think can't be jointly satisfied; my guesses are species-specific evidence versus cross-species comparison, sensitivity to the worst-off individual versus only ever measuring distributions, and cheap enough to run versus tracking something internal to the animal. If the honest answer is that the full list is unsatisfiable and we have to pick which job we're building for, say that, that's a result too. And tell me which single requirement kills the most candidates.

  Short scorecard at the end, a couple of lines each, no more: feeling-based views, preference- or desire-based views, functioning and natural-living views, and the operationalist view that welfare is just whatever the audit protocol measures. Score them against the list only.
reasoning: |-
  Okay, let me start by unpacking the user's request. They're a software engineer diving into aquaculture animal welfare without a philosophy background. They need a practical "spec" for a welfare theory that meets three concrete jobs: assessing farm changes, cross-species comparisons, and scalable audits. 

  First, I need to understand their core requirements. The user provided specific cases: eyestalk ablation in shrimp, physical deformities in fish, apathy masking as calm, undetected suffering in large populations, short lifespans, and whether death affects welfare. They also highlighted traps like productivity-based indicators and selective breeding masking issues. 

  The user wants distinctions maintained: welfare vs. moral status, severity vs. scale, momentary vs. lifetime states, and actual condition vs. audit results. The theory must be biologically consistent across species with different anatomies (fish, decapods) and specify testable evidence for sentience beyond nociception.

  I should identify non-negotiable requirements versus preferences. Key conflicts might include species-specific evidence vs. cross-species applicability, sensitivity to the worst-off vs. aggregate measurements, and cost-effective audits vs. internal state tracking. The user suspects some requirements might be mutually exclusive, so I need to flag those.

  Looking at the cases mentioned: Eyestalk ablation—even if the shrimp functions normally, is there suffering? The deformed fish growing well—does productivity mask poor welfare? Apathy versus calm—how to distinguish behavioral states? The unseen suffering individual in a large group—how can any method catch that? Short lifespans—does duration affect welfare assessment? And death—is it a welfare issue or just the preceding experience?

  The traps: Using growth or feed conversion as indicators could let farms game the system. Breeding animals that don't show stress responses—improves metrics but maybe not welfare. These need explicit handling in the requirements.

  Next, the distinctions to maintain. Welfare (current state) vs. moral status (ethical consideration). Severity of individual suffering vs. number affected. Point-in-time assessment vs. cumulative lifetime experience. Actual welfare vs. audit output—since audits might miss things.

  Biological consistency is crucial. Fish lack layered cortexes, decapods have different neural structures. The theory mustn't assume mammalian brain structures. Require testable evidence for sentience: what experiments distinguish feeling from mere nociception? For instance, trade-off tests where animals sacrifice something to avoid a stimulus might indicate affective states.

  Now, listing requirements. Start with non-negotiables. Must handle the cases (eyestalk, deformities, apathy, undetected individuals, short life, death). Avoid productivity as sole indicators. Account for bred suppression of indicators. Maintain key distinctions. Biologically grounded without neuroanatomy assumptions. Evidence-based for sentience. 

  Preferences: Quantifiable for comparison, scalable audits, cost-effectiveness, lifetime assessment, etc.

  Conflicts: Species-specific evidence vs. cross-species comparison—needing tailored indicators but also universal metrics. Catching the worst-off vs. scalability—individual assessment isn't feasible in large populations. Internal state tracking vs. cheap audits—physiological measures are costly and invasive.

  The single biggest hurdle? Probably detecting the worst-off individual in large-scale audits. Random sampling might miss rare cases, and individual tracking is impractical.

  Now, evaluating existing welfare theories:
  - Feeling-based: Focuses on subjective experiences. Strong on avoiding productivity traps and handling apathy/death. But struggles with cross-species comparison and scalable audits due to subjective assessment difficulties.
  - Preference-based: Uses choices to infer welfare. Avoids productivity traps, handles breeding suppression via choice tests. But preferences can be context-dependent, and comparing across species is tough. Also, scalability issues with individual choice tests.
  - Functioning/natural living: Based on health and natural behaviors. Handles deformities and short lifespans by assessing normal function. But risks conflating with productivity and might miss internal states like apathy. Cross-species metrics are feasible but may not capture suffering adequately.
  - Operationalist: Welfare defined by audit measures. Pragmatic for scalability but vulnerable to missing actual welfare issues, especially undetected suffering. Doesn't handle productivity traps or breeding issues well.

  Each theory has trade-offs. Feeling-based addresses core cases but falters on scalability. Preference-based avoids some traps but not others. Functioning is practical but may not capture suffering. Operationalist is implementable but risks being superficial.

  The user needs to prioritize which jobs are most critical. If cross-species comparison and audits are top, functioning-based might be best despite shortcomings. If avoiding traps and capturing true suffering is key, feeling-based is stronger but harder to implement.

  Overall, the requirement to detect the worst-off individual in large populations is the biggest challenge for any theory. Compromises are inevitable, so clarifying primary goals is essential.
answer: |-
  Here’s a functional spec for an aquaculture welfare theory, optimized for your use case. Requirements are categorized, conflicts flagged, and theories scored strictly against the spec.

  ---

  ### **Non-Negotiable Requirements** (Fail any = theory inadequate)
  1. **Avoid Productivity Trap**  
     - *Case:* Fish grows at target rate but with fin erosion/deformed jaw.  
     - *Requirement:* Must not conflate growth/feed conversion with welfare. Indicators must be *orthogonal* to production metrics.  
     - *Killer for:* Functioning-based views (often tied to growth).

  2. **Detect Masked Suffering**  
     - *Case:* Apathy masquerading as "calmness"; breeding stress-resistant animals (e.g., non-thrashing fish).  
     - *Requirement:* Must identify suppressed behavioral responses or chronic stress states even if overt signs are absent.  
     - *Killer for:* Operationalism (if audit doesn’t measure it, it doesn’t exist).

  3. **Account for Unsampled Individuals**  
     - *Case:* One fish in a pen with chronic injury, never sampled during audits.  
     - *Requirement:* Method must probabilistically capture rare severe outcomes (e.g., via distribution analysis, not just averages).  

  4. **Death/Injury Welfare Impact**  
     - *Case:* Eyestalk ablation in shrimp (invasive but "normal" post-op behavior); death at slaughter.  
     - *Requirement:* Must assign welfare weight to acute/chronic procedures *and* dying process. Death itself is neutral; suffering during life-shortening acts is not.  

  5. **Neuroscience-Agnostic Evidence**  
     - *Case:* Fish/decapods lack mammalian cortex layers.  
     - *Requirement:* Evidence for sentience must not rely on specific neuroanatomy. Key test: **Trade-off experiments** (e.g., animal sacrifices food/comfort to avoid stimulus → suggests affective state, not just nociception).  

  ---

  ### **Strong Preferences** (Fail >2 = likely impractical)
  6. **Cross-Species Comparison**  
     - *Case:* Is 1kg shrimp suffering > 1kg salmon?  
     - *Requirement:* Quantifiable "welfare units" per individual, scalable by biomass/sentience weighting.  

  7. **Lifetime Assessment**  
     - *Case:* 8-month life; is a short, bad life worse than a longer, moderate one?  
     - *Requirement:* Integrate welfare over time (e.g., area under curve of welfare state).  

  8. **Scalable Audit Protocol**  
     - *Case:* Farm with 10M animals.  
     - *Requirement:** Audit must use population-level sampling (e.g., water quality, behavioral scans, pathology rates) + risk-based triggers for deep dives.  

  9. **Distinction Preservation**  
     - Welfare ≠ moral status (e.g., shrimp welfare matters even if "less sentient").  
     - State vs. lifetime (audits snapshot, theory must model accumulation).  
     - Actual condition vs. audit output (theory must acknowledge uncertainty).  

  ---

  ### **Key Conflicts** (Pick one side per pair)
  - **🟥 Species-Specific Evidence vs. Cross-Species Comparison**  
    *Conflict:* Rigorous evidence (e.g., trade-off tests) requires species-specific validation, but comparison demands standardization.  
    *Resolution:* Sentience weighting (e.g., based on behavioral complexity) + standardized welfare indicators (e.g., physical damage, behavioral deprivation).  

  - **🟥 Worst-Off Individual vs. Scalability**  
    *Conflict:* Detecting the 1 suffering animal in 10M requires individual monitoring → impossible at scale.  
    *Resolution:* Accept probabilistic harm (e.g., "≤X% prevalence of severe injuries") and mitigate via system design (e.g., better tank design).  

  - **🟥 Cheap Audit vs. Internal State Tracking**  
    *Conflict:* Physiology (e.g., cortisol) is costly; behavior is cheaper but less direct.  
    *Resolution:* Proxy via automated ethology (e.g., AI cameras tracking erratic swimming) + environmental correlates (e.g., water quality).  

  ---

  ### **Theory Scorecard** (vs. Requirements Only)
  1. **Feeling-Based (e.g., Hedonic Welfare)**  
     - ✅ Best at: Avoiding productivity traps, detecting apathy, death impacts.  
     - ❌ Fails: Cross-species comparison (subjective), scalability (hard to measure feelings).  
     - 🟡 Partial: Neuroscientific evidence (needs trade-off tests).  

  2. **Preference-Based**  
     - ✅ Best at: Breeding traps (if animals still *choose* avoidance), unsampled individuals (if preferences cover edge cases).  
     - ❌ Fails: Scalable audits (individual choice tests are impractical), death (can’t prefer death if not experienced).  
     - 🟡 Partial: Cross-species (standardized choice tests possible).  

  3. **Functioning/Natural Living**  
     - ✅ Best at: Scalable audits (health/behavior metrics), eyestalk ablation (violates "naturalness").  
     - ❌ Fails: Productivity trap (growth = "functioning"), masked suffering (apathetic animals may still "function").  
     - 🟡 Partial: Lifetime assessment (if tracking lifelong functioning).  

  4. **Operationalism (Welfare = Audit Output)**  
     - ✅ Best at: Scalability (by definition).  
     - ❌ Fails: Worst-off individuals, productivity traps, masked suffering, neuroscientific evidence.  
     - 🟢 *Adequacy*: Only if the audit is perfect (spoiler: none are).  

  ---

  ### **The Honest Answer**  
  - **Single Biggest Killer**: **Detecting the worst-off individual** in large-scale systems (conflict #2). All theories fail at scalable individual assessment.  
  - **Unsatisfiable?** Yes—if you demand *all* jobs equally. Compromise:  
    - Prioritize **Job #1 (farm changes)** → Feeling/preference-based.  
    - Prioritize **Job #2 (cross-species)** → Functioning with sentience weighting.  
    - Prioritize **Job #3 (audits)** → Operationalism enriched with risk-based feeling/proxy metrics.  

  **Recommended Path**: Hybrid theory. Use functioning-based *proxies* for audits (scalable), but validate them against feeling/preference criteria (e.g., "Does lower stocking density reduce trade-off-verified stress?"). For cross-species, use biomass × sentience weight × lifetime welfare integral.
