  ### Decision Tree for Introspection Reliability

  Below is a routing instrument structured as a decision tree. It uses 8 branch nodes (mostly binary/ternary) derived from your specified distinctions and cases. The tree maps to 7 leaves (6 named positions + 1 unnamed), with routing based on logical combinations of answers. Contested assumptions and ambiguities are flagged throughout.

  ---

  #### **Tree Structure**  
  *Each node is a question. Answers route to the next node or a leaf.*  
  **Total nodes:** 8 (5 binary, 3 ternary)  
  **Total leaves:** 7  

  1. **Node 1 (Case 5: Chronic Pain & Absorption)**  
     *When a person with chronic pain, absorbed in a demanding task, reports no pain:*  
     - **A:** The pain was likely *still present* but unnoticed.  
     - **B:** The pain was likely *absent* during absorption.  

  2. **Node 2 (Failure Mode: Gross Presence)**  
     *Can a person be sincerely mistaken about whether they are in pain right now?*  
     - **A:** Yes (even in normal conditions).  
     - **B:** No (gross presence is infallible).  

  3. **Node 3 (Case 1: Faint Sensation & Attention)**  
     *When a faint sensation becomes vivid upon attention, what best explains the change?*  
     - **A:** Attention *amplifies* the sensation (disturbance).  
     - **B:** Attention *reveals* the pre-existing sensation (improved discriminability).  
     - **C:** The sensation *didn’t exist* until attention created it (confabulation).  

  4. **Node 4 (Case 3: Sensory Training)**  
     *A wine taster trains to discriminate subtle flavors. What changes?*  
     - **A:** Discriminability improves (finer detection of pre-existing signals).  
     - **B:** Only descriptive vocabulary improves (criterion shift).  
     - **C:** Experience itself is altered (disturbance).  

  5. **Node 5 (Self-Ascription of Beliefs)**  
     *Can a person be sincerely mistaken about their own current belief?*  
     - **A:** Yes (e.g., they overlook implicit biases).  
     - **B:** No (to believe you believe P *is* to believe P).  

  6. **Node 6 (Case 4: Causal Explanation of Choice)**  
     *A person explains a choice, but evidence later undermines their reason. Why?*  
     - **A:** The initial report was accurate (new evidence overrides it).  
     - **B:** The report was a *confabulation* (no causal signal).  
     - **C:** The report expressed a *commitment*, not a causal claim.  

  7. **Node 7 (Case 2: Feedback & Reporting)**  
     *Physiological feedback changes subsequent introspective reports. Why?*  
     - **A:** Feedback improves *discriminability* (better signal detection).  
     - **B:** Feedback shifts *response criterion* (e.g., reporting threshold).  
     - **C:** Feedback alters the *internal state* (disturbance).  

  8. **Node 8 (Channel Scope)**  
     *Is introspection equally reliable for all mental states?*  
     - **A:** No—reliability varies by channel (e.g., pain vs. reasons).  
     - **B:** Yes—uniform reliability across channels.  

  ---

  #### **Routing Key to Leaves**  
  *Answer vectors map to leaves. Unnamed cells marked as "unoccupied" (logically possible but no major theory occupies them).*  

  | Leaf Position                   | Answer Vector (Node 1 → 8)                                                                 | Commitments & Contested Markers                                                                 |
  |---------------------------------|-------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------|
  | **1. Global Pessimist**         | 1A, 2A                                                                                    | Even gross presence (e.g., pain) can misfire. Rejects all introspective authority. **Highly contested.** |
  | **2. Incorrigibilist**          | 1B, 2B                                                                                    | Gross presence (e.g., "I am in pain") is infallible. All other channels are unreliable. **Moderately contested.** |
  | **3. Inner-Sense/Perceptual**   | (1A, 2B, 3A/B, 4A, 5A, 6A/B, 7A/B/C, 8A) OR (1A, 2B, 3A/B, 4A, 5A, 7A/B/C)               | Introspection is a fallible quasi-perceptual faculty. Reliability improves with training (Case 3) but suffers disturbance (Case 1). **Dominant view; moderately contested.** |
  | **4. Transparency/Agentialist** | (5B, 6C) OR (1A, 2B, 3A/B, 6C)                                                            | Authority over attitudes comes from self-knowledge as *agency*, not detection. Self-ascriptions (e.g., beliefs) express commitments, not observed states. **Contested for experiences (e.g., pain).** |
  | **5. Self-Interpretation**      | 6B                                                                                        | Reports about choices are *confabulated* from self-observation, not direct access. Applies to causal explanations (Case 4). **Widely accepted for choices; contested for other channels.** |
  | **6. Hybrid: Perceptual + Agential** | (1A, 2B, 3A/B, 4A, 5B, 6A, 7A/B/C, 8A)                                          | Inner-sense for experiences (e.g., pain, sensations) + agentialism for attitudes (e.g., beliefs). **Common in contemporary philosophy.** |
  | **7. Unnamed (Unoccupied)**     | (1A, 2B, 3C) OR (4C) OR (8B)                                                              | Logically possible but unattractive: e.g., *all* introspection creates its objects (3C) or alters states (4C). Uniform reliability (8B) is empirically unsupported. |

  ---

  #### **Notes on Logical Space & Limitations**  
  1. **Unseparated Channels & Failure Modes**:  
     - The tree assumes channels (e.g., gross presence vs. causal explanations) are separable domains. **Specialists dispute this** (e.g., "criterion shifts" in Case 2 may bleed into "confabulation" in Case 4).  
     - Parameterizing unreliability (e.g., splitting discriminability from criterion) is **contested**. Some argue introspection cannot be cleanly analogized to detectors.  

  2. **Collapsed Distinctions**:  
     - **Immunity to misidentification**: Not included—it rarely discriminates positions in your group’s cases.  
     - **Hysteresis/saturation**: Collapsed into "disturbance" (Node 3/7) for simplicity.  

  3. **Unresolved Paths**:  
     - Nodes 3C and 4C lead to unnamed leaves. These combinations (e.g., "attention creates sensations") are **incoherent to most theories** but logically possible.  
     - Global pessimism (Leaf 1) and incorrigibilism (Leaf 2) **cannot be split further**—no question discriminates their subtypes.  

  4. **Contested Nodes**:  
     - **Node 2** assumes "gross presence" is a natural kind. **Phenomenologists dispute this**.  
     - **Node 5** (self-ascription of beliefs) is **contentious**—transparency views (Leaf 4) reject its framing.  
     - **Node 8** forces a binary on channel uniformity. **Hybrid theorists (Leaf 6) reject uniformity but occupy 8A**.  

  5. **Tree Weaknesses**:  
     - **Case 2 ambiguities**: Feedback effects (Node 7) may conflate criterion shifts (B) and disturbance (C). **Flagged as uncertain**.  
     - **Missing channels**: Subpersonal mechanisms (e.g., "access to working memory") lack cases and are omitted.  

  ---

  #### **Recommendations for Your Group**  
  1. **Start with Case 5 (Node 1)**: Resolves the gross presence debate early.  
  2. **Focus on vectors, not leaves**: Some positions (e.g., Inner-Sense) cover multiple vectors. Discuss answer combinations.  
  3. **Flag assumptions**: Explicitly note where detector analogies may falter (e.g., "disturbance" in introspection implies a non-existent subject/object split).  
  4. **Use the unnamed leaf**: It highlights gaps in theories (e.g., why do no major positions hold that attention *creates* sensations?).  

  This tree prioritizes your axes (channels/failure modes) and cases, but it remains a pragmatic tool—not a definitive taxonomy. If your group hits a dead end, revisit the contested nodes (e.g., Node 5 on beliefs). The "nearest instrument" is provided; a tidier tree would misrepresent the messiness of introspection.
