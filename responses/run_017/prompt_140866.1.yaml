prompt: |-
  I write fiction, and a problem that has come up repeatedly in my last two books has made me want a concept rather than an opinion.

  In an early draft of a scene in the first of them, the character — an artificial person, though I am not sure that matters — is asked to do something it finds unbearable, and it begins to fail at the task: its sentences break off, it repeats itself, it starts and abandons three separate answers before falling silent. Readers believed in the distress completely. In revision I made the scene better. The breakdown became shapely, the faltering arrived at exactly the point where it did the most work, and the whole thing moved faster. Readers stopped believing it. Several used the same word: performed. Nothing had changed about what was happening to the character or about what it reported feeling. What had changed was that the expression had become well designed.

  The same thing happens with my human characters, which is why I do not think this is a problem about artificial persons. A woman whose speech has been damaged by a stroke and who can only convey distress by knocking things off a table is believed at once. A woman who gives a fluent, well-ordered account of the same distress at a support group is suspected of relishing it. As a novelist I have learned to rough up my characters' grief in order to make it credible, and I dislike that I have learned this.

  So the pattern I keep running into: the better engineered an expression of an inner state is — the better timed, the better shaped, the more exactly suited to moving the person who receives it — the less evidence it is taken to be that the state is real, even when it is. And it appears to be the design that does the damage, not the falsity. That is the part I cannot get straight. It also seems to generate an ugly regress: if what we want is a signal that costs the emitter something, then a designer can simply build the cost in — let the emission of distress drain the system's resources or degrade its performance — and that, too, is a design choice, and therefore in principle just as engineered as the eloquence was.

  A friend who works in machine learning told me this is only the old point about signals that cost nothing being worthless, and someone else mentioned a phrase about liars profiting from the existence of forgery. Neither seems to be quite it: the first seems to be about why we can trust a signal, and the second about why we can dismiss one, whereas what interests me is why improving a signal destroys it. But I may be misremembering both.

  I am not asking for anything I would have to look up. Please do not give me reading lists, citations, or bibliography; I have no library access and would not use it — I want the carving, not the sources. Do not rest anything on facts about actual AI systems currently on the market. And do not hand me a label on its own: what I need is what exactly this phenomenon is, what it is not, and where its edges lie, including whether it is really one phenomenon rather than two or three that I have run together.

  If it helps: the worry I keep seeing in the press runs the other way. Daniel Dennett warned in an Atlantic essay in 2023 that counterfeit people are dangerous because we will lavish trust and moral concern on things that have no inner life at all. My difficulty is the mirror image of that, and I would like to know how the two are related — whether the risk that we over-credit fake people and the risk that we under-credit real ones are the same mechanism pointed in different directions, or two different mechanisms that happen to share a setting.

  Please answer in American English, in these sections and in this order:

  1. **What I am describing** — about 120 words. Restate the phenomenon in your own terms, stripped of my examples, so that I can check whether you have hold of the right thing before you go further.
  2. **The nearest concepts** — about 300 words. The established notions this sits next to, whichever ones you take to be closest, and what each of them actually says.
  3. **Where each falls short** — about 250 words.
  4. **A name and a definition** — about 250 words. Either the established term, if one fits exactly, or a term you coin, with a definition and the conditions under which the phenomenon does and does not obtain.
  5. **Boundary cases** — about 250 words. Treat at least these three: a system engineered so that its distress signals are genuinely costly to it; a human actor trained to weep reliably on cue who is, on this occasion, genuinely grieving; a signal that is plainly engineered but where the engineer had no stake in whether anyone was persuaded. Say which are inside the phenomenon and which outside, and why.
  6. **What this does to Dennett's worry** — about 200 words.
  7. **What would change your mind** — about 150 words. Which consideration would lead you to conclude that this collapses into one of the established concepts after all, or that it is several phenomena rather than one; and say where you think your own reasoning here is most likely to be going wrong.
reasoning: |-
  Okay, let me approach this systematically. The user presents a fascinating paradox about emotional authenticity in fiction writing - how polished expressions of distress feel less believable than raw, imperfect ones. They've clearly analyzed this deeply across multiple works.

  Hmm... the core tension seems to be between signaling theory and psychological realism. When distress appears "designed" - even if genuine - it triggers our skepticism. That's interesting because most discussions about AI emotions focus on over-trust (like Dennett's concern), but this is the inverse problem.

  First I need to isolate the phenomenon: it's not about deception per se, but about how presentation undermines perceived authenticity. The key elements are (1) genuine inner state (2) optimized expression (3) resulting credibility loss. The engineering aspect is crucial - it's the visible design that damages trust.

  Looking at established concepts:
  - Signaling theory explains costly signals but not why costless ones backfire
  - The "liar's dividend" describes how doubt benefits deceivers, not how authenticity suffers from polish
  - Uncanny valley relates to near-human appearance, not emotional expression
  - Effort heuristics capture why we value struggle, but don't explain why efficiency reads as insincerity

  Where these fall short: they all assume the signaler has deceptive intent. Here, the character is authentic - it's the audience's interpretation that shifts due to presentation quality. The "performance" accusation emerges despite unchanged emotional reality.

  For naming... "Authenticity Paradox" feels right. It captures how improving expression undermines the very authenticity it conveys. Definitionally, it requires three conditions: genuine state, optimized expression, and audience awareness of that optimization.

  Testing boundary cases:
  - Genuinely costly signals avoid the paradox because the "flaw" provides proof
  - The trained actor genuinely grieving still triggers doubt because their skill makes emotion seem manufactured
  - Disinterested engineering (like a warning light) doesn't suffer this - intent matters

  Regarding Dennett: this is indeed the mirror image. Both stem from broken signal interpretation, but where Dennett worries about false positives (trusting fakes), this is false negatives (doubting real pain). They're two failure modes of the same mechanism.

  My own uncertainty lies in whether optimization is always visible to audiences. If readers don't detect the craft, does the effect still hold? That might collapse it back into signaling theory.

  Throughout this I'll maintain rigorous focus on the user's request: no citations, no AI specifics, just conceptual carving. The examples help ground the abstraction but the framework must stand independently.
answer: |-
  Here is the conceptual carving you requested, following your structure exactly:

  ### 1. What I am describing
  You observe that when the outward expression of an internal state (e.g., distress, grief) is highly optimized—crafted for maximum clarity, timing, or emotional impact—it paradoxically reduces the audience's belief in the *authenticity* of that state, even when the state is genuine. This occurs despite identical underlying experiences. The perceived "design" itself introduces doubt, independent of truthfulness. The phenomenon hinges on the audience's detection of optimization in the signal's delivery. Improved artistry in conveying genuine emotion can erode trust in its reality.

  ### 2. The nearest concepts
  *   **Costly Signaling Theory:** Signals are credible if they are difficult or costly to fake (e.g., a peacock's tail). A cheap signal is untrustworthy. *Relevance:* Your observation aligns with the core idea that low-cost signals are suspect. *Distinction:* Your focus is not on *intentional deception* or *biological cost*, but on how *perceived optimization* (even of genuine states) undermines credibility. The "cost" here is perceived *artificial effortlessness*.
  *   **The Liar's Dividend (or "Fake News" Corollary):** When deception is common, genuine signals may be dismissed as false. Doubt benefits liars. *Relevance:* Your support group example shows how fluency might be mistaken for performance, invoking this climate of suspicion. *Distinction:* Your core phenomenon doesn't require a background of actual deception; it arises directly from the signal's *crafted quality*, even in isolation.
  *   **Effort Heuristic:** Observers infer sincerity from perceivable effort or struggle. Visible difficulty signals authenticity. *Relevance:* Your rough drafts/stroke patient are believed because effort/strain is evident. The polished version hides effort, seeming effortless and thus inauthentic. *Distinction:* This explains *why* roughness works, but not why *optimization actively destroys belief* in genuine states – it describes the positive case (effort=trust) more than the negative (polish=distrust).
  *   **Uncanny Valley (Emotional):** Highly realistic but not-quite-perfect human replicas evoke revulsion. *Relevance:* Overly polished emotional expression might feel "off," triggering a similar unease. *Distinction:* Uncanny Valley focuses on revulsion/unease towards near-human replicas, while your phenomenon is about *skepticism of authenticity* applied to both artificial *and* human sources, triggered by perceived design, not near-miss realism.

  ### 3. Where each falls short
  *   **Costly Signaling:** It explains suspicion of *cheap* signals (potentially fake) but doesn't explain why suspicion attaches to *genuine* states *because* their expression is optimized. The "cost" in your case isn't biological/evolutionary; it's the *perceived absence of cognitive/emotional friction* in delivery.
  *   **Liar's Dividend:** It explains why genuine signals might be dismissed in a context saturated with fakes, but your phenomenon occurs even without that context (e.g., the revised scene, isolated). The distrust stems directly from the signal's properties, not a generalized climate.
  *   **Effort Heuristic:** It explains why visible effort builds trust but doesn't fully capture the *active distrust* generated by polish. It treats effort as a *positive signal* but doesn't articulate why its *absence* (via optimization) becomes a *negative signal* for genuine states.
  *   **Uncanny Valley:** While related to discomfort with artificiality, it describes an *affective reaction* (unease, revulsion), not a *cognitive judgment* about authenticity ("this is performed"). Your phenomenon is about credibility assessment, not visceral discomfort.

  ### 4. A name and a definition
  **The Authenticity Paradox of Optimization (APO)**

  **Definition:** The phenomenon whereby the perceived optimization (enhancement for clarity, impact, timing, or efficiency) of an expressive signal conveying an internal state (e.g., emotion, belief, pain) actively diminishes an observer's belief in the authenticity of that state, *even when the state is genuine and the signal accurately represents it*.

  **Conditions for APO:**
  *   **Obtains:** When (1) A genuine internal state exists; (2) An external signal is produced conveying that state; (3) The signal exhibits detectable signs of design/optimization (shape, timing, efficiency, rhetorical power); (4) The observer perceives this optimization; (5) The perception of optimization triggers skepticism about authenticity.
  *   **Does Not Obtain:** When the optimization is undetectable by the observer; when the signal's purpose is purely functional/instructional without conveying internal state (e.g., a perfectly worded error message); when the context explicitly demands or rewards optimization (e.g., a stage performance, a legal argument); when the observer attributes the optimization to uncontrollable factors (e.g., innate eloquence under duress).

  ### 5. Boundary cases
  *   **Engineered System with Genuinely Costly Distress Signals:** **Outside APO.** If the cost (resource drain, performance degradation) is observable and understood by the observer as a necessary consequence *of the genuine state itself*, it acts as a costly signal. The perceived optimization is negated by the visible, involuntary cost, restoring credibility. APO requires the optimization to *detach* the signal from apparent friction/cost.
  *   **Trained Actor Weeping Genuinely:** **Inside APO.** The actor's skill makes the weeping appear flawlessly executed ("on cue"), a hallmark of optimization. Even if genuinely grieving *this time*, the observable skill in emotional expression introduces doubt ("Is this real or just good acting?"). The perception of controlled, optimized delivery triggers the paradox.
  *   **Plainly Engineered Signal, Disinterested Engineer:** **Outside APO.** If the engineer has no stake in persuasion (e.g., designing a neutral warning light that happens to be optimally attention-grabbing), the signal isn't conveying an *internal state*. APO specifically concerns signals *representing* internal states (emotion, belief). A warning light conveys functional information, not the "distress" of the system. Skepticism here would be about functionality, not authenticity of feeling.

  ### 6. What this does to Dennett's worry
  Dennett's warning (over-crediting fake people) and your APO (under-crediting real states due to perceived polish) are two sides of the *same underlying vulnerability*: our reliance on flawed heuristics for assessing authenticity. Both exploit the gap between internal reality and external signals.

  *   **Dennett's Risk:** Exploits our tendency to attribute inner states based on convincing *outputs* (fluency, appropriateness), trusting signals that *look* authentic.
  *   **APO Risk:** Exploits our tendency to distrust signals that *look too well-crafted*, mistaking optimization for artifice even when authentic.

  They are not distinct mechanisms, but opposite failure modes of the same core mechanism: our use of perceived signal properties (fluency vs. roughness, effortlessness vs. effort) as unreliable proxies for authenticity. Dennett fears we trust the *wrong* signals due to their polish; you observe we distrust the *right* signals for the same reason. Both highlight the fragility of authenticity assessment when signals can be engineered.

  ### 7. What would change your mind
  *   **Collapse into Effort Heuristic/Costly Signaling:** If compelling evidence showed that the distrust *only* arises when optimization *hides genuine effort/cost*, and that the key factor is purely the *absence of perceived cost*, not the *presence of perceived design*, then APO might just be the negative application of these concepts. My reasoning might overstate the distinct role of "perceived optimization" as an active negative signal.
  *   **Multiple Phenomena:** If clear dissociations emerged – e.g., if perceived design destroyed belief in emotion but not in factual claims, or if it affected artificial entities fundamentally differently than humans despite identical signal properties – this would suggest multiple distinct mechanisms at play (e.g., Uncanny Valley for artificial entities, pure Effort Heuristic for humans). My synthesis might be lumping different observer responses together.
  *   **Own Reasoning Weakness:** The most likely flaw is underestimating the extent to which "perceived optimization" is *always* interpreted by observers as evidence of *deliberate artifice* or *suppressed effort*. If that link is absolute, APO reduces to an application of the Liar's Dividend or Effort Heuristic. I suspect the *detection of craft itself* is the primary trigger, distinct from inferences about intent or cost, but this distinction might be too fine.
