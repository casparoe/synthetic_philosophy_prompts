prompt: |-
  I am a PhD student in political theory, working on the conditions under which a private person may kill a ruler in the Thomistic tradition. My supervisor is the closest thing we have to a specialist on Aquinas on political authority and licit killing, and over the past year she has given me firm verdicts on a series of cases. I have a supervision with her on Tuesday and I want to know which way she will jump on a case I have built, and — more importantly — what principle she is really running, because I have come to think her verdicts so far are jointly consistent with several different rules that come apart on my case.

  Her verdicts, as I have them:

  1. Ehud killing the occupying king Eglon, privately and by stealth, and clearly intending his death: licit, and praiseworthy.
  2. A private citizen killing a usurper who seized power by violence, holds no title, and oppresses the city: licit, on the ground that such a man is a public enemy rather than a ruler.
  3. A private citizen killing a hereditary king, lawfully crowned, who now rules oppressively: illicit; the remedy belongs to the community assembled or to a superior, not to a private person.
  4. A traveler killing a man who attacks him on the road, where he defends himself with proportionate force and the death is foreseen but not what he is after: licit.
  5. A private citizen killing a murderer whom the courts have failed to punish and whom no one can otherwise restrain, where the community is plainly safer as a result: illicit; punishment belongs to public authority, and the good outcome does not license the act.
  6. A magistrate, acting with full public authority, killing an innocent citizen to placate a besieging army and thereby save the city: illicit; public authority does not reach the direct killing of the innocent.

  What I cannot work out is which feature of these cases is doing the work. On the face of it, verdicts 2 and 3 are explained by a rule about the target's title, verdicts 3 and 5 by a rule about whether the agent acts with the community's authority or as a private person, verdicts 1 and 4 by a rule about averting an imminent grave harm, verdict 5 by a rule that serving the common good is not by itself sufficient, and verdict 6 by a rule that even public authority has limits. All of these fit what she has said so far.

  Here is the case I want to put to her. A hereditary king, lawfully crowned and long accepted, has concluded a secret agreement to surrender the city's citadel to a foreign army the day after tomorrow; the massacre and enslavement that follow are certain, not speculative. There is no superior with appellate jurisdiction — the overlordship that once existed has lapsed — and the great council that could in principle depose him cannot lawfully assemble: its members are dispersed, and the king has forbidden them to meet on pain of death. There is no realistic prospect of a lawful deposition before the surrender. One of the king's own household knights holds no office of any kind and acts entirely on his own initiative, but he can kill the king tonight, alone, in his chamber, with certainty, killing no one else, and doing so will prevent the surrender. He cannot describe the death as a foreseen side effect of defending himself, since the king poses no threat to him personally; he must intend it.

  So: do you expect her to say the killing is licit or illicit? Tell me which rule you think she is running, what each of the other candidate rules would predict about this case, and why you think the one you favour is the one she is actually applying rather than merely one she could apply. I am especially interested in whether, on her view, an agent counts as a private person in the relevant sense even when every route to public authorization has collapsed, or whether the absence of any functioning public authority reclassifies someone like the knight. If you think her precedents genuinely underdetermine the case, say what principle she would be committing herself to with each answer.

  Finally: I had been planning to follow up with the same king, the same collapse of lawful remedies, but an oppression that is severe and cumulative over many years with nothing imminent about it — no act of his that will kill anyone next week. Do you think that is the sharpest question to ask her next, or is there a better探针 case that would separate the rules she might be running? Please work from the verdicts as I have reported them. I do not want citations or a literature review, and I would rather you did not spend the answer adjudicating whether I have Aquinas right; assume the cases as stated and tell me what follows.
reasoning: |-
  Okay, the user is a PhD student in political theory focusing on Thomistic tradition, specifically the conditions under which a private person can kill a ruler. They've provided six verdicts from their supervisor and want to predict how she'll rule on a new case involving a hereditary king planning to surrender the citadel. The key is to figure out the underlying principle the supervisor uses, since multiple rules seem consistent with past verdicts.

  First, let's recall the supervisor's verdicts:
  1. Ehud killing King Eglon: licit and praiseworthy.
  2. Private citizen killing a usurper: licit because the usurper is a public enemy.
  3. Private citizen killing a hereditary oppressive king: illicit; remedy belongs to the community or superior.
  4. Traveler killing an attacker in self-defense: licit (foreseen but unintended death).
  5. Private citizen killing an unpunished murderer: illicit; punishment requires public authority.
  6. Magistrate killing an innocent to save the city: illicit; public authority can't kill innocents.

  The user's new case: A lawful hereditary king plans to surrender the citadel, leading to certain massacre. No superior authority, council can't assemble. A household knight (private person) can kill the king tonight to prevent this. The knight must intend the death, no self-defense claim.

  The user is trying to determine which principle the supervisor is applying. The possible rules are:
  - **Title Rule**: Target's legitimacy (verdicts 2 vs 3).
  - **Agency Rule**: Whether acting with public authority (verdicts 3, 5, 6).
  - **Imminence Rule**: Averting imminent harm (verdicts 1, 4).
  - **Common Good Insufficiency**: Good outcome isn't sufficient (verdict 5).
  - **Public Authority Limits**: Even public authority has limits (verdict 6).

  Looking at the new case, the king is legitimate (hereditary, lawfully crowned) which leans toward illicit per verdict 3. However, there's an imminent threat (surrender in two days, certain massacre). The knight is a private person without authority, which is a problem per verdicts 3 and 5. The absence of functioning public authority might not reclassify the knight as having public authority. Verdict 5 shows that even if the community is safer, a private person can't act without authority. The imminence in verdict 1 (Ehud) might be key, but Ehud's target was an occupying king, not a legitimate one. 

  The supervisor's reasoning likely prioritizes legitimacy and agency over imminence. Verdict 3 explicitly rejects private action against a legitimate ruler, regardless of oppression. Verdict 5 shows that good outcomes don't justify private action without authority. Even in a collapsed system, the knight remains a private person. The imminence in this case is similar to Ehud, but Ehud's target wasn't legitimate. So the supervisor would likely rule this illicit.

  For the follow-up case with cumulative oppression (no imminent threat), it would be even clearer as illicit per verdict 3. However, a better probe might be a case where the agent is part of a latent public authority (e.g., a dispersed council member acting alone) to test the agency rule. Or a case where the ruler loses legitimacy through actions (like surrendering the citadel) to test if that reclassifies him as a public enemy. But based on the given verdicts, legitimacy seems tied to original title, not actions (verdict 2 vs 3). 

  So, predicting the supervisor will say illicit. The key principle is the Agency Rule: only public authority can act against legitimate rulers, and private persons cannot, even when systems collapse. Imminence and common good are insufficient without proper authority.
answer: |-
  Based on your supervisor's verdicts and their internal logic, here's a reasoned prediction for your case and the principles at play:

  ### Prediction for Your Case
  **Expected Verdict:** Illicit  
  **Primary Principle in Operation:** The *Agency Rule* (whether the agent acts with public authority or as a private person).  

  ### Analysis of Competing Rules
  | Candidate Rule              | Prediction for Your Case | Why It Fails to Explain All Verdicts |
  |-----------------------------|--------------------------|---------------------------------------|
  | **Title Rule** (Target's legitimacy) | Licit (king surrendering citadel = forfeits legitimacy?) | Contradicts Verdict 3: Hereditary tyrant remains ruler despite oppression. Verdict 2 requires usurpation *at inception*, not subsequent betrayal. |
  | **Agency Rule** (Public vs. private action) | **Illicit** (knight is private person) | Best explains Verdicts 3, 5, and 6. Verdict 1 (Ehud) is the *exception*, not the rule. |
  | **Imminence Rule** (Averting immediate harm) | Licit (massacre in 2 days = imminent) | Fails Verdict 5: Unpunished murderer poses imminent threat, yet killing illicit. Verdict 6: Immediate siege threat doesn’t justify killing innocents. |
  | **Common Good Insufficiency** | Illicit (good outcome irrelevant) | Supports prediction but is secondary; Verdict 5 shows it’s necessary but not sufficient alone. |
  | **Public Authority Limits** | N/A (knight lacks authority) | Explains Verdict 6 but irrelevant here; your case centers on private action. |

  ### Why the Agency Rule Prevails
  1. **Verdict 3 is decisive**: Your supervisor explicitly forbade private killing of a *hereditary ruler* regardless of oppression. The knight (like the citizen in Verdict 3) holds no office and acts alone.  
  2. **Verdict 5 reinforces this**: Even with collapsed courts and clear common good, private punishment remains illicit. "No functioning authority" ≠ "authority transfers to private persons."  
  3. **Verdict 1 (Ehud) is distinguishable**: Eglon was an *occupier* (no legitimacy from inception; aligns with Verdict 2’s "public enemy"). Your king was lawful initially.  
  4. **No legitimacy forfeiture in precedents**: Surrendering the citadel isn’t equivalent to the *initial violent usurpation* in Verdict 2. Your supervisor treats title as binary: lawful at coronation = ruler until lawfully removed.  

  **On Collapsed Public Authority**:  
  Her precedents suggest that absent routes to public authorization *do not* reclassify private persons. Verdict 5’s unpunished murderer and Verdict 3’s oppressive king both involve institutional failure, yet private action remains prohibited. The knight is still "private" because he lacks:  
  - Formal office (Verdict 6 requires magistrates)  
  - Communal mandate (Verdict 3 reserves remedy to "community assembled")  

  ### Sharpest Follow-Up Probe
  **Your proposed case (long-term oppression, no imminence)** is *less* effective because:  
  - It’s weaker than your current case (no imminent massacre), making a "licit" verdict even less likely.  
  - It doesn’t test the tension between **Imminence** and **Agency**.  

  **Better Probe**:  
  > *Same king and collapsed remedies, but now an* **imminent, unjust execution** *ordered by the king: an innocent citizen will be killed tomorrow under false charges. A private guardsman (not a magistrate) can easily prevent this by killing the king tonight. No self-defense possible.*  

  **Why this is sharper**:  
  - Forces a direct conflict between:  
    - **Imminence** (like Verdict 4’s self-defense and Verdict 1’s tyrannicide)  
    - **Agency** (Verdict 3/5’s prohibition on private action)  
  - Removes the "surrender to foreign enemy" element (which might ambiguously trigger Verdict 2-type reasoning).  
  - Tests whether *defense of another* under imminent threat extends the Ehud exception to private persons against legitimate rulers.  

  ### Conclusion
  Your supervisor is running a **strict Agency Rule**: Private persons can never kill rulers *who initially held legitimate title*, regardless of subsequent tyranny, imminent harm, or institutional collapse. Only two exceptions exist: self-defense (Verdict 4) and killing illegitimate usurpers/"public enemies" (Verdicts 1–2). Expect her to reject the knight’s act as illicit. The follow-up probe should pressure the Imminence vs. Agency divide—if she permits killing to halt an imminent execution, it suggests Ehud’s logic extends beyond occupiers. If not, Agency is absolute. 

  **Recommendation**: Present your citadel case first, then the execution probe. If she rules "illicit" both times, ask: "Does Thomism *ever* allow a private person to kill a once-legitimate ruler? If not, why is Ehud licit but not this knight?" This forces her to defend the occupier/ruler distinction explicitly.
