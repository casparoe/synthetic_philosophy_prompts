  ### Decision Tree for Metaphysical Positions on Character Identity

  This decision tree uses your six specified cases to sort readers into metaphysical positions. Each node is a question about a specific case, answerable by an intelligent reader without philosophical training. The tree has 8 nodes and ends at 7 distinct leaves. Positions are named using standard philosophical labels where applicable, with clarifications for contested terms.

  ---

  #### **Tree Structure**
  1. **Regarding the distant galaxy variant (qualitative identity):**  
     *In the variant where events differ only on the far side of the galaxy and Madeleine is qualitatively unchanged, is this variant about Madeleine herself?*  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q3.  

  2. **Regarding bare differences (non-qualitative identity):**  
     *Could there be two variants: one where Madeleine exists, and another identical in all qualitative details except that a different individual occupies "Madeleine's role"? Would this difference matter to the story?*  
     - **Yes, the difference matters** → Leaf: **Haecceitism (transworld identity with primitive "thisness")**.  
     - **No, it doesn't matter** → Leaf: **Transworld Identity (without bare differences)**.  

  3. **Regarding the governess disclosure (cross-book fact variance):**  
     *Can the fact that the governess and Madeleine are one person be true in Book 1 but false in Book 3?*  
     - **Yes** → Go to Q4.  
     - **No** → Go to Q5.  

  4. **Regarding the betrayal case (similarity vs. plot role):**  
     *In Book 3, is the bystander (with Madeleine's history/temperament) presented as if she* could *be Madeleine, despite not committing the betrayal?*  
     - **Yes** → Go to Q6.  
     - **No** → Leaf: **Counterpart Theory (weighted by plot role)**.  

  5. **Regarding the non-transitive chain:**  
     *If Madeleine in Book 2 is very like Book 1's, and Book 4's is very like Book 2's, must Book 4's be very like Book 1's?*  
     - **Yes** → Go to Q7.  
     - **No** → Leaf: **Primitivism (modal facts brute; no analysis)**.  

  6. **Regarding intrinsic traits vs. plot role (weighting):**  
     *If a character has all of Madeleine's intrinsic traits (history, temperament) but a different plot role, is that sufficient for being her?*  
     - **Yes** → Leaf: **Counterpart Theory (weighted by intrinsic traits)**.  
     - **No** → Leaf: **Counterpart Theory (weighted holistically)**.  

  7. **Regarding the indiscernible pair (intra-book identity):**  
     *In Book 4, could both Cécile and Céline be the same as Madeleine?*  
     - **Yes** → Leaf: **Non-World-Bound Individuals (intra-world branching)**.  
     - **No** → Leaf: **Fictional Realism (abstract objects)**.  

  8. **Regarding the changed origin (essential properties):**  
     *Could Madeleine have been born to different parents in a different city?*  
     - **Yes** → Leaf: **Transworld Identity (without essential origins)**.  
     - **No** → Leaf: **Fictional Realism (essential origins)**.  

  ---

  #### **Leaves Explained**
  1. **Haecceitism (transworld identity with primitive "thisness")**:  
     The same individual exists across worlds; bare differences (which individual it is) matter.  
     *Label contested*: Some call this "modal realism with haecceities."  

  2. **Transworld Identity (without bare differences)**:  
     The same individual exists across worlds, but qualitative differences are required for distinction.  

  3. **Transworld Identity (without essential origins)**:  
     Madeleine can have different origins across books.  

  4. **Counterpart Theory (weighted by plot role)**:  
     Characters are world-bound; similarity is based on narrative function (e.g., committing the betrayal).  

  5. **Counterpart Theory (weighted by intrinsic traits)**:  
     Similarity prioritizes personal history/temperament over plot role.  

  6. **Counterpart Theory (weighted holistically)**:  
     Similarity balances intrinsic traits and plot role; neither dominates.  

  7. **Fictional Realism (abstract objects)**:  
     Characters are abstract entities; books describe their properties. Origins are essential.  

  8. **Fictional Realism (essential origins)**:  
     Subtype where origins are necessary to the character.  

  9. **Non-World-Bound Individuals (intra-world branching)**:  
     An individual can split into multiple entities within a single world (e.g., Cécile and Céline).  

  10. **Primitivism (modal facts brute)**:  
      Questions of identity are unanalyzable; "it just is" Madeleine or not.  

  ---

  #### **Unoccupied Cells and Why**
  - **Cell 1**: *Q1=No, Q3=Yes, Q4=Yes, Q6=No*  
    (Bare differences irrelevant; facts vary; bystander could be Madeleine; intrinsic traits insufficient).  
    **Empty**: Unattractive. If intrinsic traits don’t suffice and plot role dominates, no reason to think the bystander "could" be Madeleine.  
  - **Cell 2**: *Q1=Yes, Q2=No, Q7=Yes*  
    (Bare differences matter; facts don’t vary; Cécile/Céline both identical to Madeleine).  
    **Empty**: Incoherent. If individuals have primitive "thisness," two entities can’t both be identical to one.  
  - **Cell 3**: *Q5=No, Q8=Yes*  
    (Non-transitivity rejected; origins non-essential).  
    **Empty**: Unoccupied. Positions denying non-transitivity typically require essential origins.  

  ---

  #### **Indistinguishable Leaves**
  - **Transworld Identity (without bare differences)** and **Counterpart Theory (max-weighting on identity)**:  
    These agree on all cases: both deny bare differences matter (Q1=Yes, Q2=No) and treat similarity as sufficient for cross-book claims. The difference is terminological: one posits literal identity, the other maximal similarity. No practical distinction survives.  

  ---

  #### **Fictional Characters and Non-Existence**
  Your characters do not exist concretely. Statements about them are made true by:  
  - **The text**: Determines properties within each book.  
  - **Make-believe**: Readers imagine truths.  
  - **Abstract objects**: Characters exist as artifacts (e.g., like Hamlet).  

