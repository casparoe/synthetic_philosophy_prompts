  - There is a fact of the matter (rejects Primitivism and Anti-Realism).  
  - The bystander in Book 3 is *not* Madeleine (requires plot role to matter).  
  - No view on Cécile and Céline (avoids intra-world identity claims).  

  **Assignment**: **Counterpart Theory (weighted by plot role)**.  
  - **Why**:  
    - Denying the bystander is Madeleine prioritizes plot role over intrinsic traits (Q4=No → Leaf 4).  
    - "Fact of the matter" aligns with similarity-based truth conditions in counterpart theory.  
    - Neutrality on Cécile/Céline fits: within a single book, counterpart theory doesn’t force identity claims.  

  **Inconsistency?** The three commitments are tenable. Counterpart theory allows facts without requiring intra-book identity resolutions. If pressed to drop one, abandon neutrality on Cécile/Céline—but your practice already avoids it.  

  **Commitment in Tree Design**:  
  - Ordered Q1 (distant galaxy) first because it isolates bare differences, the sharpest divider between haecceitism and other views.  
  - Grouped governess disclosure (Q3) and betrayal (Q4) early; they directly probe world-linking mechanisms.
