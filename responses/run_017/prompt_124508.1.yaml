answer: |-
  Here's the translation you asked for, stripped bare of philosophy-speak and mapped directly to your operational framework. I'll flag every point of friction or residue as we go.

  ---

  ### **Core Translation**
  - **Reductionism (Global):** Your standard source-handling protocol. Warrant = reliability rating (historical accuracy) × credibility rating (current incentives/context). The ledger *is* this position operationalized perfectly. Track record is king.  
  - **Reductionism (Local):** Corroboration-focused. Even with a perfect ledger, you demand *domain-specific* verification. A source’s flawless logistics record means nothing for chemistry intel. Requires fresh supporting evidence *for this claim type*.  
  - **Anti-Reductionism:** "Presumptive RELIABLE until flagged." Sources start at "credible until disproven" — the cold-start default. The ledger is irrelevant to the core mechanic: trust is a *speech-act*, not just data. A source isn’t a sensor; they’re *accountable* for what they assert.  

  ---

  ### **The Ledger Test**
  Your guess is sharp:  
  - **Global Reductionist:** Case closed. Ledger = ultimate reliability rating. Trust scales with score.  
  - **Local Reductionist:** Ledger is background noise. Still need **current, claim-specific indicators**: source stress levels, access verification, motive check *for this report*.  
  - **Anti-Reductionist:** Deeply unsatisfied. **Why?** The ledger reduces testimony to *behavioral patterns*, ignoring the **moral transaction**. A liar with a perfect record is still violating the trust inherent in *telling you something*. The dispute isn’t about accuracy — it’s about **what testimony fundamentally *is***.  

  **Residue:** Anti-reductionism insists testimony carries a **promise of truthfulness** that footprints don’t. Your vocabulary tracks *reliability*; theirs tracks *responsibility*.  

  ---

  ### **The Farmed Source**  
  - **Your Instinct:** Correct. Trust shouldn’t transfer. Track records are domain-specific and intentions matter.  
  - **Reductionism (Global):** **Fails.** Ledger says "trust" — no tools to spot the burn operation.  
  - **Reductionism (Local):** **Saves you.** High-stakes claim? Demand new corroboration *even if domain overlaps*. Chemistry vs. logistics? Automatic skepticism.  
  - **Anti-Reductionism / Assurance View:** **Explains your instinct.** Trust isn’t "banked" — it’s **given anew each time**. The source isn’t just *accurate*; they’re *assuring you*. The farmed source weaponizes past trust to betray *this specific act*. It’s not a domain shift — it’s **testimonial fraud**.  

  **Cold Start:**  
  - Reductionists see an unverified claim (weak evidence).  
  - Anti-reductionists see a **default credible human source** — trust first, verify after.  

  ---

  ### **Residue Report**  
  **1. Clean Translations:**  
  - Global reductionism ↔ Reliability matrices / ledger dependence.  
  - Local reductionism ↔ Domain-specific corroboration / two-source rule.  
  - Anti-reductionism ↔ Presumptive source credibility (cold-start protocol).  

  **2. Bent Translations (Forced Fit):**  
  - **"Off the record" vs. "On the record":** Maps to credibility ratings (incentive shift), but anti-reductionism adds a **moral layer** — "off-record" isn’t just risky intel, it’s *disclaimed responsibility*.  
  - **Chain of custody:** Tracks provenance, but anti-reductionists see it as secondary to the **source’s commitment** at point of utterance.  

  **3. No Expression in Your Framework:**  
  - **The Second-Personal ("I tell you"):** Your system sees a data stream. Anti-reductionism sees a **personal guarantee**. A footprint can’t *lie*; a source *can*. This is irreducible.  
  - **Justification vs. Truth:** You merge these (warrant = likelihood of truth). Philosophers split them: justification is *why you believe*; truth is *whether it’s so*. A perfect ledger justifies belief but doesn’t guarantee truth.  

  **4. Where I Smuggled Your Assumptions:**  
  I implicitly treated "reliability" as purely behavioral (past accuracy). Anti-reductionists would say I bent their view by not stressing that **trust precedes evidence** — your cold-start problem assumes no default trust; theirs *requires* it.  

  **5. What Would Change My Verdict:**  
  - **If your vocabulary is "defective":** If you encountered a source whose ledger was flawless but whose *manner of assertion* consistently made intel fail despite high scores. Anti-reductionism would explain this (broken assurance).  
  - **If philosophers are talking past:** If they dismissed your farmed-source case as "irrelevant to epistemology." That would signal they’re debating idealized speech, not intelligence operations.  

  **6. Where I’m Most Likely Wrong:**  
  Assuming "answerable" maps cleanly to your credibility ratings. In practice, you *do* flag sources who lie — but as "unreliable," not "immoral." The difference is **operational** vs. **ethical**. That gap might be irreducible.  

  ---

  ### **Bottom Line**  
  Your framework lacks **nothing** for actionable intelligence. Philosophers care about *why testimony creates obligation*; you care about *how to extract reliable information*. The residue (second-personal accountability) isn’t a bug — it’s irrelevant to your mission. When anti-reductionists say "trust is basic," they’re not giving tradecraft advice; they’re analyzing social reality. Your instinct on the farmed source? That’s **operational wisdom** no philosophy captures better than you just did.
