prompt: |-
  I did thirty-odd years in salmon hatcheries and quantitative genetics before I retired, and now I sit in on a philosophy of biology reading group where every third argument is about heritability, and it keeps driving me up the wall that people hear h² = 0.8 and take it to mean caused by genes, so nothing to be done about it — and then some of them slide, without seeming to notice, from that to so the gap between group A and group B is genetic. Neither follows. The number is a ratio of variances inside one population across one range of environments, and I can shove it up toward 1 just by making all the tanks identical, which tells you exactly nothing about whether anything is fixable.

  So here's what I want. Write me a parody government form — call it Form H-2, Application for Permission to Describe a Trait as Genetic in Any Sentence Intended for the Public — about 600 words, laid out as numbered fields and checkboxes with blanks, in flat, deadpan bureacratese. The jokes have to come from getting the definition right, so that someone who actually works with these numbers laughs instead of wincing.

  Concretely: the form should force the applicant to declare the reference population and the spread of environments, and to certify what would happen to their number if you homogenized the environment (it goes up) or homogenized the genotypes (it goes down). It needs a field for what the applicant actually wants to know — can diet, schooling, or surgery change the trait — with a printed footnote explaining that the heritability coefficient cannot answer this and that no such quantity as the one they are asking for appears anywhere on the form. It needs a section on between-group differences where the applicant keeps trying to tick a box the form does not provide, and the printed warning stays polite and unmoved. Add a short worked example set in something non-human — fish, seed lots, dairy cattle, your pick — where a very high heritability sits happily alongside a dead easy environmental fix.

  The thing should end as a mild reductio: since standardized environments inflate the number, the form ends up awarding its highest heritability rating to the most uniform tanks, and the closing guidance note says such applications are approved automatically.
reasoning: |-
  Okay, the user has spent over thirty years working in salmon hatcheries and quantitative genetics. They're now part of a philosophy of biology reading group where heritability (h²) is frequently misunderstood. The main frustration is when people interpret a high heritability estimate (like h²=0.8) as meaning a trait is "genetically caused" and therefore unchangeable, or worse, they extend this to assume genetic differences between groups. Neither is correct. 

  The user wants a parody government form—Form H-2—that forces applicants to confront the nuances of heritability. The form must be bureaucratic, deadpan, and around 600 words. Key elements include: defining the reference population and environment range, explaining how homogenizing environments increases h² while homogenizing genotypes decreases it, clarifying that heritability doesn’t address trait modifiability, and blocking misguided between-group inferences. It also needs a non-human worked example (e.g., fish) where high heritability coexists with an easy environmental fix. The parody should end by awarding the highest rating to uniform environments, exposing the absurdity. 

  The user’s deeper needs are clear: they’re combatting scientific illiteracy among philosophers (or the public) using humor as a Trojan horse. The form isn’t just satire—it’s pedagogical. They want colleagues to laugh *and* learn, hence the demand for strict accuracy ("jokes come from getting the definition right"). The reductio ad absurdum (auto-approving uniform tanks) is the punchline: it highlights how high h² can be meaningless for real-world interventions. 

  For the worked example, salmon are ideal (user’s expertise). Imagine hatchery fish: if all tanks are identical, h² for growth might be 0.9, but adding a vitamin supplement boosts growth across all genotypes. This undermines "genetic = fixed." Between-group section will be tricky—applicants will *want* to infer genetics from group differences, but the form must stonewall with polite warnings. The "what you want to know" footnote must bluntly state h²’s irrelevance to modifiability. 

  Tone is crucial: flat bureaucratese ("certify," "attest," "notwithstanding"). No overt jokes—absurdity emerges from rigid adherence to technical truth. Closing guidance auto-approving uniform tanks is the mic-drop, proving environmental control inflates h² artificially. Nailed it.
answer: |-
  **DEPARTMENT OF BIOLOGICAL INTERPRETATION STANDARDS**  
  **FORM H-2: APPLICATION FOR PERMISSION TO DESCRIBE A TRAIT AS “GENETIC” IN ANY SENTENCE INTENDED FOR THE PUBLIC**  

  **SECTION 1: APPLICANT INFORMATION**  
  1.1. Name: ________________________________________________________  
  1.2. Affiliation: ____________________________________________________  
  1.3. Trait to be Described as "Genetic": ________________________________  
  *(e.g., Human height, Salmon smoltification timing, Dairy cow milk yield)*  

  **SECTION 2: REFERENCE POPULATION SPECIFICATION**  
  *(Failure to complete voids application)*  
  2.1. Define the **precise population** for which heritability (h²) is estimated:  
      ______________________________________________________________  
      *(e.g., "Post-smolt Atlantic Salmon (Salmo salar) reared in Hatchery 7B tanks, 2023 cohort")*  
  2.2. Is this population:  
      ☐ Naturally breeding wild cohort  
      ☐ Managed/domesticated population (e.g., hatchery, farm, lab strain)  
      ☐ Human census-defined group (Specify criteria: ___________________)  

  **SECTION 3: ENVIRONMENTAL VARIANCE DECLARATION**  
  *(Variance Component Certification Required - Attach Form EVC-7a if >5 environments)*  
  3.1. Describe the **range of environments** experienced by the population in (2.1):  
      ______________________________________________________________  
      *(e.g., "Water temp: 8-12°C; Feed: Standard pellet ration ad libitum; Tank density: 1kg/m³ ±10%")*  
  3.2. Attest under penalty of perjury (Biol. Int. Code § 42.5a):  
      a) If all environments were made **identical** (homogenized), the h² value for this trait **WOULD INCREASE**.  
          ☐ I Certify  
      b) If all genotypes within the population were made **identical** (e.g., cloned), the h² value **WOULD BE ZERO (0.0)**.  
          ☐ I Certify  

  **SECTION 4: HERITABILITY ESTIMATE & INTERPRETATION LIMITS**  
  4.1. Reported h² value: _________ (Must be between 0.0 and 1.0)  
  4.2. **WARNING (Printed per Reg. H2-Interpret. 10(c)):** The value in 4.1 is a **ratio of variance components** (V<sub>A</sub>/V<sub>P</sub>) **specific** to the population in 2.1 experiencing the environmental range in 3.1. **It does not quantify:**  
      *   The proportion of an *individual's* trait value due to genes.  
      *   The degree to which the trait is "innate" or "unchangeable".  
      *   **The causal source of differences *between* populations or groups.**  

  **SECTION 5: TRAIT MODIFIABILITY INQUIRY (DECOUPLED)**  
  5.1. What the Applicant **Actually Wants to Know** (Check all that apply):  
      ☐ Can the trait be changed by dietary intervention?  
      ☐ Can the trait be changed by educational/training programs?  
      ☐ Can the trait be changed by medical/surgical intervention?  
      ☐ Can the trait be changed by altering physical/social environment?  
      ☐ Other (Specify): ____________________________________________  
  5.2. **FOOTNOTE (Mandatory, per Statute Gen-Truth Act §1b):** **The heritability coefficient (h²) entered in Section 4.1 provides *no information whatsoever* regarding the questions checked in Section 5.1.** A high h² is entirely compatible with high environmental modifiability. A low h² is entirely compatible with the trait being genetically fixed but unresponsive to *tested* interventions. **No quantity answering the questions in 5.1 appears on this form.** Investigate experimental intervention studies directly.  

  **SECTION 6: BETWEEN-GROUP DIFFERENCE INFERENCE ATTEMPT**  
  *(Applicants often feel compelled to complete this section despite guidance)*  
  6.1. Do you wish to imply that differences in Trait (1.3) between **Population A** (specify: _______________) and **Population B** (specify: _______________) are genetic, based wholly or partly on the h² value from 4.1?  
      ☐ Yes (Proceed to 6.2, then read 6.3 CAREFULLY)  
      ☐ No (Proceed to Section 7)  
  6.2. Justification for inference (Attach additional sheets if necessary):  
      ______________________________________________________________  
      ______________________________________________________________  
  6.3. **POLITE BUT UNMOVED WARNING (Reg. H2-Interpret. 20):** The h² value from Section 4.1 describes variance partitioning **within** the single population specified in Section 2.1. **It provides no valid information about the causes of average differences *between* the distinct populations specified in 6.1.** Differences between populations (A and B) could arise solely from environmental factors, gene-environment interactions, or genetic factors, *regardless* of the h² value within either population alone. **☑ Check here to acknowledge this warning:** ☐  

  **SECTION 7: WORKED EXAMPLE & ABSURDITY DEMONSTRATION**  
  7.1. **Non-Human Illustrative Scenario (Salmonidae Example):**  
      *   **Trait:** Pre-smolt growth rate (mg/day).  
      *   **Population:** Juvenile Coho Salmon (Oncorhynchus kisutch), Hatchery Alpha, 2024 broodstock offspring.  
      *   **Environments:** 50 identical tanks; uniform temp (10°C); identical photoperiod; identical commercial feed *deficient in Vitamin K*.  
      *   **h² Estimate:** 0.92 (High! "Highly genetic" within this setup).  
      *   **Environmental Fix:** Add standard Vitamin K supplement to feed.  
      *   **Result:** Mean growth rate **increases by 40% across ALL genotypes**. The high h² estimated *within* the deficient environment **did not predict** this easy fix nor imply growth was "genetically fixed".  

  **SECTION 8: REDUCTIO AD ABSURDUM & APPROVAL**  
  8.1. Based on certification in 3.2a: Environments made perfectly uniform **maximizes** h².  
  8.2. **Therefore, the Department awards its highest heritability designation ("GENETIC-VU", Variance-Uniform) automatically to applications where:**  
      ☑ Environmental conditions are certified as perfectly homogeneous (Sec 3.1).  
      ☑ Genotypic diversity is confirmed non-zero (Sec 3.2b certified).  
  8.3. **Closing Guidance:** Traits measured in the **most uniform tanks/plots/pens** achieve the highest h² values ("GENETIC-VU" rating). This reliably indicates **nothing** about the trait's modifiability (Sec 5.2) or the cause of differences between distinct populations (Sec 6.3). It efficiently quantifies the **proportion of current phenotypic variance** attributable to genetic variance **under those specific, constrained conditions.**  

  **APPROVAL STATUS:**  
  ☑ **AUTOMATICALLY APPROVED** for designation "GENETIC-VU" (Variance-Uniform High Heritability) per Section 8.2.  
  ☐ **PENDING REVIEW** (Required if Sections 6.1 = Yes or environments in 3.1 show significant heterogeneity).  
  ☐ **DENIED** (Failure to certify Sec 3.2a/b; Attempted misuse per Sec 6 despite warning).  

  **Department Stamp:**  
  *"The environment is always part of the equation."*
