  The user's role as chair of an after-action review board explains their focus on admissible evidence. Legal won't accept private beliefs - only documented communications matter. That's why the procedure must anchor everything in the radio log and timeline.

  I notice three pain points in their description: 
  First, the fundamental gap between message receipt and shared certainty about that receipt. 
  Second, their colleague dismissed this as sophistry, indicating a need for concrete operational language. 
  Third, the legal constraints that make this philosophically tricky problem require a paper-trail solution.

  For the decision procedure, I'm considering a four-layer sieve approach: 
  1) Payoff alignment check to filter out incentive problems 
  2) Message existence verification in logs 
  3) Confirmation pattern analysis 
  4) Rationality assessment based on past behavior 

  The unreliable channel problem is key - no finite confirmations create common knowledge over bad radios. That's where the procedure must recommend structural fixes like fallback plans rather than more communication.

  For the test cases: 
  The ridge scenario likely shows a mutual knowledge failure where both crews knew the plan but didn't know the other knew. 
  The hand crew case demonstrates how missing acknowledgments break coordination even with good intentions. 
  The unwelcome verdict case would absolve a crew boss when logs show they followed protocol despite bad outcomes.

  Important to emphasize the limitations upfront: This can't read minds, can't handle novel situations without precedent, and can't replace human judgment when evidence is ambiguous. The "undecidable" exit condition is crucial for legal safety.

  The language must stay operational - no game theory jargon. Instead of "common knowledge," we'll say "shared certainty." Instead of "Bayesian updating," we'll say "based on past interactions." The goal is to make deep epistemic concepts actionable for firefighters.
answer: |-
  **Bottom line:** The Co-Ordination Failure Analysis Template (COFAT) is a four-step decision tree that distinguishes payoff misalignment from knowledge failures, identifies communication gaps preventing shared certainty, and prescribes fixes based solely on logs and timelines; it ceases analysis when evidence is exhausted, cannot infer private beliefs, and stops at operational certainty, not philosophical certainty.

  **COFAT Procedure**  
  *Execute steps in order, using only: Radio logs, written briefings, timeline of actions, 2 crew boss interviews (structured Q&A), and protocol documents. If quantitative data (e.g., signal strength) is unavailable, record "Unknown (U)" and proceed.*

  1.  **Payoff Check:** *"Did crews have conflicting goals?"*  
      - Review briefing logs for explicit task assignments. Cross-check with interviews: "What was your primary directive?"  
      - **If YES** (e.g., Crew A tasked with structure protection, Crew B with firebreak creation, creating resource conflict), verdict: **"Payoff Misalignment"**. Fix: Revise tasking/priorities. *Stop.*  
      - **If NO or U**, proceed to Step 2.

  2.  **Message Existence & Reception:** *"Was the plan transmitted and logged as received?"*  
      - Logs must show: (a) Plan broadcast (e.g., "All crews hold position"). (b) Receipt acknowledgment *by each crew* (e.g., "Crew A copies, holding").  
      - **If MISSING** (no transmission, or no acknowledgment from one crew), verdict: **"First-Order Knowledge Failure"**. Fix: Better radios/protocols. *Stop.*  
      - **If PRESENT**, proceed to Step 3.

  3.  **Confirmation Pattern:** *"Was there mutual acknowledgment of receipt?"*  
      - Check logs for explicit confirmation loop:  
          - E.g., HQ: "All hold." → Crew A: "A copies." → Crew B: "B copies." → *HQ: "A and B confirmed holding."*  
      - **If ABSENT** (only simple acknowledgments, no meta-confirmation), verdict: **"Mutual Knowledge but Not Common Knowledge"**. Fix: Add protocol step for centralized summary confirmation ("All crews, confirm all acknowledged"). *Stop.*  
      - **If PRESENT**, proceed to Step 4.

  4.  **Rationality & Competence Check:** *"Did crews have reason to doubt others' compliance?"*  
      - Evidence sources:  
          - *Past Logs:* Repeated failures by a crew to adhere to plans?  
          - *Interviews:* "Did you expect Crew X to follow the plan? Why/why not?" (Accept only evidence-based answers: "Last Tuesday they didn't" = valid; "I don't trust them" = invalid).  
      - **If VALID DOUBT EXISTS** (e.g., Crew B deviated 3x last month, logged), verdict: **"Common Belief Failure"**. Fix: Retraining, reassignment, or add redundancy (e.g., backup anchor crew).  
      - **If NO EVIDENCE OF DOUBT**, verdict: **"Undecidable: Protocol Followed"**. Fix: No change.

  **Key Surviving Distinctions:**  
  - Payoff misalignment vs. knowledge failure.  
  - Message receipt (1st-order) vs. mutual acknowledgment (2nd-order) vs. common belief.  
  - Reliable vs. unreliable channel implications (Step 3 verdict).  
  *Dropped:* Infinite regress of knowledge (handled by Step 3's practical "meta-confirmation"), nuanced degrees of common belief (collapsed to evidence-based doubt).

  **Application to Cases:**  

  1.  **Ridge Crews (Both "Holding", Lower Pulled Out):**  
      - *Step 1 (Payoff):* No conflict (both tasked to hold).  
      - *Step 2 (Reception):* Logs show both sent "holding" but *no acknowledgment of each other's message*.  
      - *Step 3 (Confirmation):* No HQ summary ("Crew A and Crew B both holding").  
      - *Verdict:* **Mutual Knowledge but Not Common Knowledge**. Crew B knew *they* were holding and heard Crew A, but had no proof Crew A heard *them*. Fix: Require HQ to rebroadcast all statuses.  

  2.  **Hand Crew (No Redeploy, Missing Ack):**  
      - *Step 1:* No payoff conflict.  
      - *Step 2:* Logs show redeploy order sent, *no acknowledgment from hand crew*.  
      - *Verdict:* **First-Order Knowledge Failure**. Fix: Better radio/redundant channel. *Your friend was right here.*  

  3.  **Unwelcome Verdict (Clears Blamed Crew Boss):**  
      - *Scenario:* Ranger blames Crew A for retreating. Logs show:  
          - HQ: "Fall back to Zone Beta if flare sighted."  
          - Crew A: "Sighted flare, retreating." (No further comms).  
      - *Step 1:* No payoff conflict (all aimed for safety).  
      - *Step 2:* Order transmitted and acknowledged.  
      - *Step 3:* No mutual confirmation needed (single crew decision).  
      - *Step 4:* No evidence Crew A doubted others' rationality.  
      - *Verdict:* **Undecidable: Protocol Followed**. Clears Crew Boss—protocol gave them discretion. Fix: None, or clarify triggers if flaw found.  

  **What COFAT Cannot Do:**  
  - Infer intentions, beliefs, or unspoken reasoning.  
  - Handle novel scenarios with no precedent in logs.  
  - Guarantee common knowledge over fundamentally unreliable channels (only mitigates).  
  - Eliminate judgment in Steps 1 & 4 (marked by "U" or interview reliance).  
  - Solve problems where the true cause is missing from logs/timeline.  

  **Authority & Limits:** COFAT resolves coordination failures using only documented evidence and explicit protocols. It stops where evidence stops and cannot override operational realities (e.g., radio physics). Its verdicts are defensible to legal review because they derive from the record, not speculation. When judgment is required (e.g., assessing "valid doubt"), it flags the decision as human-dependent.
