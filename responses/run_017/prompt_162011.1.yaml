answer: |-
  ## Desiderata for Solutions to the Logical Omniscience Problem

  The problem of logical omniscience is not merely a technical flaw in a specific formal model of belief. It arises from fundamental tensions inherent in the diverse roles we demand belief content to play. A satisfactory solution must navigate these tensions, acknowledging that the demands generated by belief's role in explaining *agency* (via reports and action prediction) often pull against those generated by its role in *epistemic appraisal*. This section articulates the core desiderata any solution must address or explain away, categorizing them by negotiability and target level (Metaphysics of belief states (M), Semantics of belief ascriptions (S), Norms governing belief (N)), and indicating the primary tension they reflect.

  1.  **Fine-Grainedness for Agency & Representation (I-Agency):**
      *   **Motivation:** To explain why an agent might sincerely assert "Cicero was poor" while denying "Tully was poor," or why an agent might search for a fountain pen *as such* rather than merely as a writing implement, belief content must be sensitive to modes of presentation. It must underpin a compositional semantics for belief reports that respects substitution failures (`believes that Cicero...` ≠ `believes that Tully...`) and explain actions directed under specific descriptions. Coarse-grained truth-conditional content collapses distinctions crucial for predicting and explaining behaviour in context.
      *   **Negotiability:** Non-negotiable for Agency. Rejecting this renders belief reports systematically inaccurate and severs the direct link between the content *as believed* and the action performed.
      *   **Tension:** Primarily conflicts with Coarse-Grainedness for Norms.
      *   **Level:** (M, S) – Constrains the nature of belief states and how we report them.

  2.  **Structured Fallibility (II-Shape):**
      *   **Motivation:** Agents reliably detect simple, immediate entailments within a familiar conceptual framework (e.g., "P & Q" entails "P") but fail predictably as inferences become longer, involve more negations, require vocabulary shifts, or demand complex quantificational reasoning. A solution must predict this *patterned* degradation of logical performance, not uniform failure or random collapse. A theory positing unstructured failure misses a core aspect of the phenomenon.
      *   **Negotiability:** Non-negotiable. A solution must capture this observable psychological profile to be empirically adequate.
      *   **Tension:** Challenges views that treat logical failure as accidental noise or solely a memory problem.
      *   **Level:** (M) – Constrains the structure and processing of belief states.

  3.  **Non-Evidential Revision (III-Revision):**
      *   **Motivation:** Upon realizing (or being shown) that their beliefs entail some proposition P they didn't believe, agents typically revise their beliefs (either rejecting a premise or accepting P) *without acquiring new empirical evidence*. This revision feels distinct from updating based on new sensory input – it’s driven by coherence pressure. A solution must accommodate this distinct kind of doxastic change and its unique normative profile (criticism for incoherence, not ignorance). The theory must specify what the agent is criticisable *for* in this scenario.
      *   **Negotiability:** Non-negotiable. Denying this distinction ignores a crucial aspect of logical practice and normative assessment.
      *   **Tension:** Highlights the unique normative force of logic distinct from evidential norms.
      *   **Level:** (M, N) – Constrains belief state dynamics and the norms governing them.

  4.  **Reflective Accessibility (IV-Corrigibility):**
      *   **Motivation:** Logical errors can, in principle, be discovered by the agent through reflection alone, without new external input. This distinguishes logical failure from perceptual illusions, where external calibration is needed. A solution must provide a standpoint from which the agent has access to the relevant logical relations or constraints *via reflection*, without this access implying that the agent actually believes all consequences (thus reinstating omniscience).
      *   **Negotiability:** Non-negotiable. Rejecting this undermines the first-person perspective on rationality and the possibility of purely reflective critique.
      *   **Tension:** Conflicts with views that make logical relations fundamentally external or inaccessible to the non-omniscient agent.
      *   **Level:** (M, N) – Constrains the agent's epistemic access to their own beliefs and their relations.

  5.  **Partial Efficacy of Instruction (V-Instruction):**
      *   **Motivation:** An agent can be explicitly, credibly, and comprehendingly told that her beliefs entail P, yet still fail to form the belief that P (e.g., due to complexity, distrust, or misunderstanding the proof). Crucially, she can *still* be rationally criticisable for this failure. Conversely, such instruction *usually* succeeds in prompting belief revision. A solution must predict both this occasional resistance *and* the general efficacy of logical instruction.
      *   **Negotiability:** Non-negotiable. A theory where instruction *always* works ignores stubborn irrationality; one where it *never* works ignores the possibility of learning logic.
      *   **Tension:** Requires balancing the normative pull of logic with the psychological reality of cognitive limitations.
      *   **Level:** (M, N) – Constrains the connection between normative demands and psychological implementation.

  6.  **Explanatory Burden on Closure Failure (VI-Cheap):**
      *   **Motivation:** Simply denying that belief is closed under logical consequence is not a solution; it's the starting point of the problem. A proposal must explain *why* closure seemed compelling in the first place (e.g., the normative intuition, the idealization) and provide a principled account of *how* logical failure differs from other cognitive failures like forgetting, momentary distraction, or ordinary factual error (e.g., misremembering a date). It must articulate the specific nature of "logical incompetence."
      *   **Negotiability:** Non-negotiable. Without this, the proposal merely restates the problem.
      *   **Tension:** Forces solutions to engage with the source of the normative pull of closure.
      *   **Level:** (M, N) – Constrains the explanation of the failure mode.

  7.  **Authority of Logic (VII-Norms):**
      *   **Motivation:** It must remain coherent and forceful to say that an agent *ought* to believe the logical consequences of their beliefs and that failing to do so is a specific *kind* of irrationality (incoherence). A solution that entirely severs logic from the norms governing belief (e.g., making logical consequence irrelevant to what one ought to believe) pays an unacceptably high price by dissolving the core normative intuition driving the problem. Logic must retain substantial authority over belief revision.
      *   **Negotiability:** Negotiable-but-Costly. Solutions can weaken the *scope* or *immediacy* of this authority, but abandoning it entirely sacrifices the core normative dimension of the problem. Significant theoretical cost incurred.
      *   **Tension:** Directly conflicts with Fine-Grainedness (I-Agency) if coarse logical consequence is the norm's object.
      *   **Level:** (N) – Primarily constrains normative theory, but has implications for content (M).

  8.  **Scope Generality (VIII-Consequence):**
      *   **Motivation:** The problem arises not just for first-order logical consequence, but also for mathematical truths, conceptual truths (e.g., "All vixens are female"), and probabilistic consequence. A solution should ideally handle these cases within the same framework, or provide a principled reason why different resources are needed (e.g., arguing that failing to believe a mathematical theorem given the axioms is fundamentally different from failing to believe a complex logical tautology). The core case of believing axioms but not a theorem should be addressed.
      *   **Negotiability:** Preference (Costly to Ignore). A unified account is highly desirable; fragmenting the solution across consequence types is a significant theoretical cost needing justification.
      *   **Tension:** Challenges approaches tailored solely to propositional logic or specific consequence types.
      *   **Level:** (M, S, N) – Constrains the generality of the proposed apparatus.

  9.  **Idealization Coherence (IX-Ideal):**
      *   **Motivation:** Since first-order logical consequence is undecidable, *no* mechanical procedure (even for an idealized agent with unbounded resources) can guarantee belief in all consequences. Any solution appealing to an ideal limit (e.g., "ideally rational agents believe all consequences") must clarify what this idealization signifies. Is it a regulative ideal? A model of competence? Furthermore, it must demonstrate that this idealization is *coherent* – that there exists a well-defined state (even if unattainable) of "believing all consequences" that serves its intended theoretical role (e.g., in defining rationality or content) without collapsing into incoherence or triviality.
      *   **Negotiability:** Non-negotiable for Views Invoking Ideals. Any theory using idealization must meet this; theories rejecting ideals need not.
      *   **Tension:** Highlights the fundamental computational limit undermining simple closure ideals.
      *   **Level:** (M, N) – Constrains the metaphysics of idealized states and their normative role.

  10. **Problem Demarcation (X-Boundaries):**
      *   **Motivation:** The desiderata must be framed to isolate the specific problem of *logical omniscience* – the failure to believe known consequences – from neighbouring issues. This includes: (a) The *proof search* problem (how an agent finds a derivation); (b) The *retrieval/memory* problem (whether a stored belief is accessible); (c) The *general granularity* problem (how finely to individuate contents for other reasons). A solution should not simply reduce logical omniscience to one of these other problems without a compelling account of why *this specific failure* (believing premises but not conclusion, despite the entailment being demonstrable to the agent upon reflection/instruction) arises from that reduction.
      *   **Negotiability:** Non-negotiable. Collapsing the problem into another fails to address its unique characteristics.
      *   **Tension:** Precludes overly simplistic reductions (e.g., "it's just a memory problem").
      *   **Level:** (M) – Constrains the nature of the proposed failure mechanism.

  **Evaluation of Main Families Against Desiderata:**

  *   **Hyperintensional Contents (Structured Propositions, Impossible Worlds):** Excels at I-Agency (Fine-Grainedness), II-Shape (can model structured relations), III-Revision (can model coherence pressure), IV-Corrigibility (relations can be accessible), V-Instruction (can model uptake), X-Boundaries (distinct granularity). **Struggles severely with VII-Norms (Authority of Logic):** Coarse logical norms don't apply directly to fine-grained contents; defining norms for these structures is difficult without collapsing granularity. IX-Ideal (Idealization) is problematic if contents are too fine. VIII-Scope may require stretching the framework.
  *   **Syntactic/LOT Accounts:** Strong on I-Agency (token-sensitive), II-Shape (processing on syntax), III-Revision (syntactic manipulation), V-Instruction (adding rules), VI-Cheap (specific incompetence), X-Boundaries (distinct mechanism). **Struggles with IV-Corrigibility (Reflective Access):** Access to syntactic tokens isn't obviously equivalent to access to *logical relations*. VII-Norms (Authority) is problematic: Does logic govern syntax? Norms seem to target content, not form. Compositionality (S) is notoriously difficult for purely syntactic views. VIII-Scope (Math/Conceptual) may be awkward.
  *   **Resource-Bounded/Attention/Awareness:** Excels at II-Shape (models degradation), III-Revision (resource shifts), V-Instruction (changes awareness), VI-Cheap (explains failure as resource lack). **Struggles with IV-Corrigibility (Reflective Access):** Are resource limits reflectively accessible? VII-Norms (Authority): Does "ought" imply "can given current resources"? If not, the norm seems too strong; if yes, norms become too contingent. I-Agency (Fine-Grainedness) often needs supplementation. IX-Ideal (if used) requires careful handling.
  *   **Fragmentation/Compartmentalization:** Excels at I-Agency (local contexts), II-Shape (local vs. global access), III-Revision (integrating compartments), V-Instruction (targeting compartments). **Struggles with VII-Norms (Authority):** Can logic demand integration across fragments? What does "the agent's beliefs" even mean normatively? IV-Corrigibility (Global reflective access?) is difficult. VI-Cheap: Needs to explain why compartment failure is *logical* failure specifically. X-Boundaries: Risks collapsing into retrieval/memory.
  *   **Deny Logic's Constraint (Radical Normative Revision):** Trivially satisfies I-Agency, II-Shape, III-Revision (redefined), IV-Corrigibility (redefined), V-Instruction, VI-Cheap, X-Boundaries. **Fails catastrophically at VII-Norms (Authority of Logic):** This *is* the cost – abandoning the core intuition that logic normatively governs belief. Rejected by most as solving the problem by denying it exists. VIII-Scope becomes moot.

  **Key Exclusions and Conflicts:**

  *   **Most Excluding Desideratum:** **VII-Norms (Authority of Logic)**. This is the normative core of the problem. Syntactic views struggle to ground logic's normativity in syntax. Hyperintensional views struggle to apply coarse logical norms to fine-grained contents. Fragmentation views struggle with global normative force. Resource views struggle with the "ought implies can" dilemma. Only the radical denial camp embraces abandoning it, at a high cost most find unacceptable.
  *   **Likely Fundamental Conflict:** **I-Agency (Fine-Grainedness) vs. VII-Norms (Authority of Logic)**. The demands of explaining action and belief reports require content sensitive to representation, making contents logically inequivalent. The demand for robust normative appraisal via logical consequence requires contents coarse enough for logical equivalence to suffice. Reconciling how norms targeting coarse truth conditions bind agents whose actions depend on fine-grained modes of presentation appears deeply challenging, potentially intractable. This tension underpins the divergent priorities in the literature and may necessitate a significant reconceptualization of either belief content, logical norms, or their relationship. (**III-Revision (Non-Evidential Revision)** also poses a distinct, sharp challenge to approaches that cannot accommodate the unique normative force of coherence.)
