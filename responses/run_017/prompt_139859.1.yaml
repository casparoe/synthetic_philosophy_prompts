prompt: |-
  Hey — I organise the end-of-term revue for our logic reading group (I'm a philosophy PhD student, mostly phil-math with a bit of formal epistemology, and I TA the intro logic course a lot), and this year I want the centrepiece to be about Gödel-misuse. Can you write it?

  What I want: a client-facing brochure, about 650 words, from a management consultancy — something like Incompleteness Solutions or Gödel & Partners — selling "Gödel audits" to institutions: a university administration, a legal code, an AI safety team, whatever fits. Headings, a bulleted "what you get", a pricing table that is quietly a subscription, and a short FAQ at the end. Deadpan throughout. No winking, no "as any logician knows", no character who says the quiet part out loud — the reductio should be the business model itself.

  The jokes have to come from the actual theorem, and I want the details right: about half the room will have genuinely worked through a Gödel proof and will wince at anything sloppy. Things I want in there:

  - The Gödel sentence is bespoke: it's relative to a particular recursively axiomatised theory. There is no generic "gap" to go find, you have to redo the construction for each client — and once they add it as an axiom they've got a new theory with its own sentence. The firm should be selling an infinite regress as a retainer and pitching it as a feature ("guaranteed recurring findings", "our engagement never terminates, which we consider a strength").
  - The theorem only bites for theories that can encode enough arithmetic — Robinson arithmetic or thereabouts. So for a client whose rulebook is too weak (a lunch rota, a fire-drill sign-up sheet, anything interpretable in Presburger arithmetic) there's literally nothing to find: give them an upsell for installing an arithmetic module into their HR policy so that the theorem applies. There should also be something about how the firm first has to make the client's rules computably enumerable, so "unwritten rules" and "we sort of decide case by case" void the warranty.
  - When you decode the sentence, it's a claim about natural numbers with no content about the client's organisation. I want that in: the deliverable is a true, unprovable and completely uninteresting sentence about their business.
  - The "we can see that it's true" step. Please be careful here. The firm needs to establish that the client's theory is consistent, which the client can't do from the inside (second incompleteness) and which nobody can do for something as messy as a university's statutes; and I think there's a further wrinkle that seeing it as true needs the intended/standard interpretation, which the theory doesn't pin down from within (non-standard models of PA and all that). My own understanding is that plain consistency is enough for the truth of the Gödel sentence itself, because it's Π1 — so it's the disquoting step and the consistency claim that are load-bearing and shaky, not the truth of G. If I've got that wrong, fix it in the piece and flag it below.
  - Don't do the Lucas/Penrose consciousness-and-minds thing. Our group is sick of it. If antimechanism appears at all, make it a bolt-on product nobody buys.
  - No fabricated quotes, please: nothing in quotation marks attributed to Gödel or anyone real, and no glowing testimonial from a real person. Invented clients and an invented in-house expert are fine.

  After the brochure, give me a short note, 150 words-ish: where the piece takes liberties or leans on a contested reading, how confident you are in the technical claims overall, and the single point you're least sure about. Say something about the Π1 / consistency-versus-soundness business either way, since that's where I'm least confident myself.
reasoning: |-
  We are creating a satirical management consultancy brochure for a logic reading group revue.
   The consultancy, named "Gödel & Partners", sells "Gödel audits" to institutions.
   Key points to cover:
     - The Gödel sentence is specific to each recursively axiomatized theory. Once the client adds the sentence as an axiom, a new Gödel sentence appears for the new theory -> infinite regress as a retainer model.
     - The theory must be strong enough to encode sufficient arithmetic (Robinson arithmetic at least). If the client's system is too weak (e.g., interpretable in Presburger arithmetic), we upsell an "arithmetic module".
     - The Gödel sentence, when decoded, is a true but uninteresting statement about natural numbers, not about the client's organization.
     - The step of establishing that the Gödel sentence is true requires consistency of the theory and the standard interpretation (non-standard models issue). We note that the Gödel sentence is Π1, so consistency is enough for its truth? But we must also note the shaky step: the consistency claim and the disquoting (which relies on the standard interpretation).
     - Avoid Lucas/Penrose; no real quotes.

   Structure:
     - Headings: Company name, tagline, sections.
     - What we offer: bullet points.
     - Pricing table (subscription model).
     - FAQ.

   Tone: Deadpan, no winking. The humor comes from the absurdity of the business model and the technical precision.

   After the brochure, a note of about 150 words on technical liberties and least sure points.

   Let's design the brochure:

   Company: Gödel & Partners
   Tagline: Ensuring Your System's Incompleteness is Managed

   Sections:
     - The Challenge: Institutions face the risk of undetected gaps in their formal systems.
     - Our Solution: Gödel Audits™ — a comprehensive review of your axiomatic framework.
     - What You Get: Bulleted list of deliverables.
     - Pricing: Table with subscription tiers.
     - FAQ: Addressing common concerns.

   Details:

   The Challenge:
     "Your organization relies on a formal system of rules and procedures. But can you be sure it's complete? Gödel's First Incompleteness Theorem demonstrates that any sufficiently powerful, consistent, and recursively axiomatized formal system must contain statements that are true but unprovable within the system. These gaps represent latent operational risks."

   Our Solution:
     "Gödel & Partners offers a bespoke audit service. We construct a custom Gödel sentence for your specific formal system. This sentence, while true, is unprovable in your current framework. Our audit identifies this gap, providing you with a critical insight into the inherent limitations of your system."

   What You Get (Bullet Points):
     - A detailed report identifying your system's Gödel sentence, uniquely constructed for your axiomatization.
     - Proof that the sentence is unprovable within your current system and true under the intended interpretation (subject to consistency).
     - Guidance on incorporating the Gödel sentence as a new axiom, thereby strengthening your system (and creating the conditions for a new Gödel sentence, ensuring ongoing engagement).
     - For systems lacking sufficient arithmetic: an optional "Arithmetic Enhancement Package" to upgrade your system to a level where incompleteness applies.
     - Compliance with the requirement of recursive axiomatization: we help codify unwritten rules into a computably enumerable set.

   Pricing:
     We present a subscription model because the process is inherently infinite.

     | Plan          | Setup Fee | Annual Retainer | Features                               |
     |---------------|-----------|-----------------|----------------------------------------|
     | Basic Audit   | $25,000   | $10,000         | Initial Gödel sentence construction    |
     | Premium       | $40,000   | $15,000         | Includes Arithmetic Enhancement       |
     | Enterprise    | $75,000   | $25,000         | Full recursive axiomatization service |
     *All plans include annual follow-up audits to address the new Gödel sentence in your updated system.

   FAQ:
     Q: How can you guarantee that the Gödel sentence is true?
     A: Our proof relies on the consistency of your system. We establish consistency through external metatheoretic analysis. Note: due to the Second Incompleteness Theorem, your system cannot internally prove its own consistency. Our verification is conducted in a stronger metatheory.

     Q: What if our system is too weak to encode arithmetic?
     A: We offer our Arithmetic Enhancement Package (see Premium and Enterprise plans) to extend your system with the necessary capabilities, ensuring that the Incompleteness Theorem applies.

     Q: What does the Gödel sentence actually say about our organization?
     A: The sentence, when decoded, is a statement about natural numbers. It has no direct bearing on your operations. Its significance lies in its unprovability, highlighting a limitation in your system's ability to capture all truths.

     Q: Can we avoid the infinite regress?
     A: The recurrence of Gödel sentences is an inherent feature of any consistent, recursively axiomatized system of sufficient strength. Our subscription model ensures you are continuously protected against newly emerging gaps.

     Q: What about non-standard models?
     A: The truth of the Gödel sentence is established with respect to the standard model of arithmetic. Non-standard models may assign different truth values, but we work under the assumption that your organization intends the standard interpretation.

   Now, the note:

   Technical points:
     - The Gödel sentence is Π1: a universal statement (∀n P(n)) where P is decidable. Therefore, if the system is consistent, the Gödel sentence is true (because if it were false, there would be a counterexample, and the system would prove ¬G, but then by the properties of G, the system would be inconsistent). So consistency suffices for truth. However, we must note that we are assuming the standard natural numbers. In a non-standard model, the same sentence might be false? Actually, no: because the Gödel sentence is true in the standard model and false in some non-standard models? But wait: the consistency of the theory implies that the Gödel sentence is true in the standard model. However, the theory itself cannot prove this, and the theory might have non-standard models in which the Gödel sentence is false. When we say "true", we mean in the standard model. The client must accept the standard model for the truth to be meaningful.

     - The brochure leans on the fact that we can establish consistency in a stronger metatheory. For a real institution, proving consistency may be impossible (e.g., for a university's statutes, which are complex and evolving). We gloss over this by saying we do "external metatheoretic analysis", which is hand-wavy.

     - The infinite regress: we present it as a feature, but technically, each time the client adds the Gödel sentence, they get a new theory, and we can build a new Gödel sentence for that. This is correct.

     - The Arithmetic Enhancement: we are selling the ability to encode arithmetic. This is satirical but correct: if the system is too weak, we need to extend it.

     - The least sure point: The step of establishing consistency. We are vague about how we do it. In reality, for a complex system, we might not be able to prove consistency. Also, the disquoting step: we have to interpret the Gödel sentence as a statement about numbers and then say it's true. But the client might not care about numbers? The brochure addresses this by saying it's a statement about numbers and has no bearing on the organization, but the point is that it's unprovable.

     - Another point: The brochure says "true under the intended interpretation". We assume the client has an intended interpretation that includes the standard natural numbers. But if the client's system is about something else (like a legal code) and we are encoding arithmetic in it, then the intended interpretation of the arithmetic part must be standard. This is a stretch.

     - We avoid the Lucas/Penrose argument entirely.

   Let's write the brochure accordingly.
