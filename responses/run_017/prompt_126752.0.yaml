            - Stakes: The first 12 students to be served get a token that can be exchanged for a chocolate bar. (This creates pressure because not everyone will get one.)

          Tipping point: We hope that the first visitor group (Group 2) will leave and miss their call, then come back and protest. Then when Group 3 arrives, they form a majority (with Group 2) and try to change the system. Group 4 (locals) arrive and find the system changed and are upset.

          Debrief Questions:

            1. What happened in the bakery queue? How did the system change?
            2. How did you feel when you were moved to the bottom? When the system changed?
            3. Did anyone experience the no-thanking rule? How did it feel?
            4. Why did the notebook system break down? Was it fair to blame the visitors?
            5. Are the two rules (notebook and no-thanking) the same kind of obligation? Why or why not?
            6. What makes a convention morally binding?

          Then the instructor can introduce the philosophical concepts and connect to the readings.

          This design is complex, but it should lead to the desired insights.
answer: |-
  Here’s a runnable activity designed for your constraints, with a focus on creating organic tension and targeted philosophical reflection:

  ---

  ### **Activity: The Vell Bakery Queue Simulation**
  **Duration:** 40-45 minutes gameplay + 30-35 minutes debrief  
  **Participants:** 16 students (8 hidden "Locals," 8 hidden "Visitors")  
  **Stakes:** First 10 students to successfully get "served" (receive a token) win a chocolate bar. Tokens are limited to force competition.  

  ---

  #### **Setup & Rules**  
  1. **Room Setup:**  
     - Place a "bakery counter" (your desk) at the front with a physical queue area.  
     - Put a notebook and pen at the entrance. Beside it, display: *"Vell Bakery Rules: Write name to join queue."*  

  2. **Secret Roles (Hand out cards as students enter):**  
     - **Locals (8 students):**  
       *"You’re from Vell. Rules: (1) The notebook order MUST be followed—it’s binding. If you miss your call, you go to the bottom. (2) NEVER thank someone for letting you ahead—thanking insults them (it implies they did a favor, not their duty)."*  
     - **Visitors (8 students):**  
       *"You’re visiting Vell. Rules: (1) The notebook is a ROUGH guide—physical presence matters most. (2) NEVER thank someone for letting you ahead—it’s rude here."*  

  3. **Staggered Arrivals (Crucial for power shift):**  
     - **T=0 min:** 4 Locals arrive first (write names in notebook, then wander/chat).  
     - **T=5 min:** 2 Visitors arrive (write names).  
     - **T=10 min:** 4 Visitors arrive (write names).  
     - **T=15 min:** 2 Locals arrive (write names).  
     - *Result:* Locals start as majority (4 vs 0), shift to Visitors dominating (6 vs 4) at T=10 min, ending balanced (8 vs 8).  

  4. **Gameplay Procedure:**  
     - **Baker (You):** Call names from the notebook **every 2 minutes** in strict order. If absent, cross out their name and rewrite at the bottom.  
     - **Serving:** When a student presents themselves upon hearing their name, give them a token (limit 10 tokens total).  
     - **No-Thanking Rule:** If a student thanks someone for letting them ahead, any Local can shout "INSULT!"—the thanker moves to the bottom.  
     - **Physical Queue:** Allow a physical line to form organically. Don’t intervene unless rules are invoked.  

  ---

  #### **Tipping Point: Dissolving the Convention**  
  - **Trigger:** Around T=15–25 min, Visitors (now majority) will ignore the notebook, clustering at the counter. Frustrated Locals insist on notebook order. Chaos escalates when:  
    - A Visitor thanks a Local for letting them ahead → Local shouts "INSULT!" → Visitor refuses to go to the bottom ("Why? I was here!").  
    - Visitors argue the notebook is "just a list," while Locals cite broken promises (e.g., "I planned my break around my spot!").  
  - **Your Role:** As baker, *stop enforcing the notebook* once 3+ Visitors defy it. Announce: *"Serving the physical line now."*  
  - **Blame Dynamics:** Locals will blame Visitors for "breaking the system." Visitors retort: "Your rule was inefficient!" Highlight this in debrief.  

  ---

  #### **Predictable Problems & Solutions**  
  1. **"It’s just a game!" student:**  
     - **In debrief:** Ask, *"Why did you feel angry when someone skipped the line? Would you feel the same if a real queue was jumped?"* Link to moral emotions in conventions.  

  2. **Other hiccups:**  
     - **Visitors don’t misbehave:** Secretly prompt a Visitor pre-game: *"Psst—your card says the notebook is just a suggestion, right?"*  
     - **No one triggers the no-thanking rule:** Have a confederate Local "let someone ahead" then glare if not thanked.  
     - **Time management:** Use a visible timer. End game at T=40 min even if tokens remain.  

  3. **Chaos management:**  
     - Allow shouting but halt physical shoving. Intervene only with: *"Vell’s rules are evolving—what do you do now?"*  

  ---

  #### **Debrief Structure (30–35 min)**  
  1. **Feelings First (5 min):**  
     - *"Who felt frustrated? When? Why?"* Surface emotions (e.g., Locals: "They broke promises!" Visitors: "The notebook was arbitrary!").  

  2. **Contrast the Two Rules (15 min):**  
     - **Notebook:** Ask Locals, *"Why did you expect compliance?"* Draw out *reliance* (e.g., "I left trusting my spot would be honored").  
     - **No-Thanking:** Ask, *"Why did thanking feel wrong even if no one was harmed?"* Highlight *symbolic meaning* (e.g., "It misrepresented the act as a gift, not duty").  
     - **Key Q:** *"Were these obligations different? Did one feel more ‘real’?"*  

  3. **Introduce Concepts (10 min):**  
     - Name "coordination problems," "conventions," and "expectation-dependence." Link to student comments:  
       - *"When Locals said ‘We planned around the notebook,’ they described expectation-dependence."*  
       - *"The no-thanking rule shows how conventions create moral facts: in Vell, thanking *is* insulting."*  

  4. **Meta-Discussion (5 min):**  
     - *"Could Visitors be blamed for destroying the notebook system? Why/why not?"*  
     - *"Is a convention still binding if most people stop believing in it?"*  

  ---

  #### **What the Game Can’t Replicate (Requires Your Input)**  
  **The "Settlement" Problem:**  
  - The game shows how conventions *arise* from need and *dissolve* when beliefs shift, but it can’t replicate how real-world conventions gain authority through **historical sedimentation** (e.g., "This is how we’ve always done it") or **social power** (e.g., elders enforcing norms).  
  - **Say this:** *"In life, conventions often feel binding because they’re woven into our identities. The game can’t make you *care* about Vell’s rules—but in real communities, people do. That’s why visitors respecting local customs isn’t just about efficiency; it’s about acknowledging that customs can constitute a community’s moral fabric."*  

  ---

  **Why This Works:**  
  - Students experience the **pull of reliance-based obligation** (notebook) vs. **symbolic-conventional obligation** (no-thanking) *before* labeling them.  
  - The staggered arrivals ensure Visitors disrupt the system only after experiencing it, making blame feel personal.  
  - Low-stakes tokens create real tension without ethical risk.  

  **Materials Needed:** Notebook, pen, 10 tokens (paper clips), timer, chocolate bars. Run it as a "silent role-play" (no quoting cards) to sustain immersion.
