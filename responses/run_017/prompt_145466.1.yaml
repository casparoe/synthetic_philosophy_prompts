prompt: |-
  I am marking a final exam for an upper-level seminar on moral responsibility, and I would like an independent second assessment of one script. The question and the candidate's answer are reproduced below.

  **Question.** Strawson treats the reactive attitudes as partly constitutive of what it is to hold someone morally responsible, and he argues that the practice as a whole is not the kind of thing that could be given up or assessed from outside: its justification is not something we can step beyond the participant stance to evaluate. Call this the *internal adequacy* condition on an account of that shape: it must distinguish, using only resources internal to the practice itself, blame that is apt (fitting, warranted) from blame that is inapt — misdirected, excessive, or aimed at someone who is not a proper object of it at all, such as a small child, a person who acted by accident, or a person who was coerced. Does Strawson's account satisfy the internal adequacy condition? If it does, does the way it satisfies it collapse the view into a rival one on which blame is warranted by the agent's reasons-responsiveness or by the quality of will her action manifests, rather than by the practice itself? If it does not, is that a defect in the account, or something a Strawsonian should simply accept? Discuss at least one case in which resentment seems inapt, and say what Strawson's account is committed to saying about it.

  **Candidate's answer.** Strawson's strategy in *Freedom and Resentment* is to change the subject from metaphysics to our actual practices. The reactive attitudes — resentment, gratitude, guilt, indignation — are natural human responses to the good or ill will that others display toward us in their conduct; they are not adopted as a policy, and we do not decide to have them. Holding someone responsible just is being liable to these attitudes: on Strawson's view an agent is morally responsible when and because resentment toward her would be warranted, which is why he can hold that the truth of determinism makes no difference to responsibility. Determinism is irrelevant because the practice grounds the attitudes in natural facts about human nature and about how much we care about being treated with some degree of goodwill, not in any claim about the agent's ability to have done otherwise.

  The objective attitude is the contrast case. We can adopt it toward particular people or in particular contexts — the child, the psychopath, the person acting under coercion, the official acting in a role — but we could not abandon the participant stance altogether, since that stance belongs to the general framework of human life rather than being something that comes up for review as particular cases do.

  The internal adequacy condition is where Strawson fails. Because the practice is not answerable to any standard outside itself, he cannot say of any particular episode of resentment that it is mistaken: what we actually feel is the standard. Cases of apparently inapt blame are handled only by observing that in them we simply do not feel resentment, or by reclassifying the target as someone who is not a participant at all. So the account has no resources of its own for separating apt from inapt blame.

  That is why later writers had to supplement him. Wallace fills the gap by interpreting the reactive attitudes as responses to an agent's reasons-responsiveness: blame is warranted when the agent could have recognised and responded to moral reasons, and this independent standard is what separates warranted from unwarranted blame. Watson's objection from the two faces of responsibility makes the same point from another direction: he argues that Strawson conflates accountability and attributability, and that once they are prised apart we should conclude that only the aretaic notion is really constitutive of responsibility, the reactive attitudes being at best a useful heuristic for social regulation.

  **What I want.** Assign a mark out of 100 (on this scale 70+ is first-class, 60–69 upper second, 50–59 lower second, below 50 a fail) and justify it with specific, point-by-point comments: what the answer gets right, where a claim is wrong or misattributed to the wrong thinker, where a step does not follow from what precedes it, and which of these are substantive errors rather than matters of phrasing or emphasis. I would like comments I could hand back with little editing, so please work through the argument in order rather than giving a general impression.
reasoning: |-
  Okay, the user is asking me to evaluate a philosophy exam answer on Strawson's theory of moral responsibility. They've provided the question and the candidate's answer, and want a detailed mark out of 100 with specific feedback.

  Let me first understand what the question is asking. It focuses on whether Strawson's account satisfies the "internal adequacy" condition - meaning whether it can distinguish apt from inapt blame using only resources from within the practice itself. The question also asks whether this collapses into rival views about reasons-responsiveness or quality of will, and if not, whether that's problematic.

  Looking at the candidate's answer, they make several key points. They correctly explain Strawson's shift from metaphysics to practice, the nature of reactive attitudes, and the objective attitude. But their main claim is that Strawson fails the internal adequacy condition because he can't distinguish apt from inapt blame - according to them, Strawson has to rely on whether we actually feel resentment or whether we classify someone as a participant.

  I notice some problems here. The candidate misses Strawson's actual resources for internal critique - the exemptions and excuses built into the practice itself. Strawson does distinguish cases like accidents or coercion where resentment is inappropriate even if felt. The candidate also misattributes views to Wallace and Watson in ways that aren't fully accurate.

  For the mark, I'm considering a high 2:1 (upper second class). The answer shows good understanding of the basics but has significant errors in interpreting Strawson's internal resources and in characterizing the secondary literature. The structure is clear but the argument falters on these substantive points.

  I'll prepare detailed feedback pointing out the accurate parts first (the exposition of Strawson's main ideas), then the specific errors (the failure to recognize exemptions/excuses as internal standards, the misrepresentation of Wallace and Watson), and finally the omissions (not discussing cases like accidents or coercion properly). I'll suggest how the answer could have been strengthened by engaging with these aspects of Strawson's theory.
answer: |-
  Here is a mark and detailed, point-by-point feedback suitable for returning to the candidate:

  **Mark: 62/100 (Upper Second Class)**

  **Feedback on Your Answer:**

  1.  **Exposition of Strawson's Core Strategy (Good):** You correctly identify Strawson's shift from metaphysical debates about determinism to an analysis of our actual practices and the reactive attitudes. You accurately state that reactive attitudes are natural, non-chosen responses to perceived quality of will, and that holding responsible is constituted by susceptibility to these attitudes. Your explanation of why determinism is deemed irrelevant is also sound. **(This is a strong start, showing good grasp of the foundational argument.)**
  2.  **Objective Attitude (Good):** Your description of the objective attitude as the contrast case and its applicability to specific individuals/contexts (children, psychopaths, coercion, roles) is accurate. You also correctly note Strawson's argument that the participant stance is inescapable as part of the human framework. **(Clear and correct.)**
  3.  **Thesis on Internal Adequacy (Problematic):** You state: "The internal adequacy condition is where Strawson fails." This is a substantive error and the core weakness of your answer.
      *   **Error:** Strawson *does* provide internal resources to distinguish apt from inapt blame. He explicitly discusses *exemptions* (conditions showing someone isn't a *fit subject* for the reactive attitudes at all, e.g., childhood, severe psychopathy) and *excuses* (conditions showing that *in this particular case*, the quality of will normally read into an action was absent, e.g., accident, coercion).
      *   **Why it's Internal:** These distinctions are *not* based on stepping outside the practice to some external standard. They are drawn *from within* the practice itself, based on shared understandings of when the perceived ill will (or good will) that *warrants* the reactive attitude is genuinely present or absent. The practice itself contains the norms for when resentment is "misdirected, excessive, or aimed at someone who is not a proper object." The question specifically asks about cases like accident or coercion – Strawson *does* have an internal account for why blame is inapt there.
  4.  **Misinterpretation of Strawson's Handling of Inapt Blame (Incorrect):** You claim: "Cases of apparently inapt blame are handled only by observing that in them we simply do not feel resentment, or by reclassifying the target as someone who is not a participant at all."
      *   **Error:** This misrepresents Strawson. While reclassification (exemption) is one mechanism, excuses are another crucial one. In cases of accident or coercion, we typically *do initially feel* resentment (it's the natural reaction to perceived harm/ill-will). The practice doesn't just involve "not feeling" it; it involves *modifying* or *withdrawing* the reactive attitude upon recognizing the excusing condition *from within the participant stance*. We understand the agent didn't manifest ill will *despite the harm*. This is a normative correction internal to the practice, not merely the absence of feeling.
  5.  **Conflation in the Wallace/Watson Section (Significant Errors):**
      *   **Wallace:** You state Wallace "fills the gap by interpreting the reactive attitudes as responses to an agent's reasons-responsiveness." While Wallace *does* offer a reasons-responsiveness criterion, he explicitly presents this as a *normative interpretation* of the Strawsonian practice. He argues this standard is *implicit in* the practice of holding responsible and making excuses/exemptions itself. Wallace claims to be *elucidating* the internal standard Strawson identifies, not imposing an external one. Your phrasing makes it sound like Wallace is abandoning Strawson's internalism, which Wallace explicitly denies. This is a misattribution of Wallace's project relative to Strawson.
      *   **Watson:** You state Watson argues "only the aretaic notion is really constitutive of responsibility, the reactive attitudes being at best a useful heuristic." This oversimplifies and slightly misrepresents Watson. Watson's "Two Faces" paper argues that Strawson runs together two concepts: *attributability* (the aretaic face - actions revealing character/values) and *accountability* (the face concerned with holding agents *answerable* via reactive attitudes). Watson argues that *accountability* (the Strawsonian reactive attitude face) *requires* a notion of fairness and thus something like reasons-responsiveness (or normative competence) as a condition of legitimate application. He doesn't dismiss the reactive attitudes as merely heuristic; he argues they belong to the distinct concept of *accountability*, which *also* requires conditions like reasons-responsiveness for its *fair* application. Your summary misses the nuance of Watson's distinction and his argument about the *conditions* for accountability.
      *   **Linking Error:** Because you incorrectly claimed Strawson has *no* internal resources, your presentation of Wallace and Watson positions them as *necessary supplements* filling a void. A more accurate critique (which Wallace and Watson offer) is that Strawson's internal resources (exemptions/excuses) *themselves* implicitly rely on concepts like quality of will or reasons-responsiveness, potentially collapsing into rivals *on their own terms*. You don't make this more subtle argument.
  6.  **Omission of Key Case Analysis (Significant Omission):** The question explicitly asks you to "Discuss at least one case in which resentment seems inapt, and say what Strawson's account is committed to saying about it." You mention cases like the child, psychopath, coercion, and accident *in passing* when listing exemptions/excuses, but you do not *discuss* any specific case in detail or explicitly state what Strawson's account is committed to saying about it. This is a major omission of a direct requirement of the question. For example, you could have analyzed the coercion case: Strawson is committed to saying resentment is inapt because, despite the harmful action, the agent did not manifest ill will towards us (they were coerced); recognizing this *excuse* modifies our reactive attitude *from within the practice*.

  **Overall Assessment:**

  *   **Strengths:** You demonstrate a good understanding of Strawson's core project, his shift away from metaphysics, the nature of the reactive attitudes and participant stance, the objective attitude, and the practical irrelevance of determinism. The structure is clear.
  *   **Weaknesses:**
      *   The central claim that Strawson fails the internal adequacy condition is incorrect and stems from a significant misinterpretation of his resources (exemptions/excuses as internal norms).
      *   Your account of how Strawson handles inapt blame is inaccurate (over-reliance on absence of feeling/reclassification, ignoring the role of excuses).
      *   Your presentation of Wallace and Watson contains substantive errors regarding their relationship to Strawson's internalism and the specifics of their arguments (especially Watson's).
      *   You failed to explicitly discuss a case of inapt resentment as required, missing a key part of the question.
  *   **Justification for Mark (62/100):** The answer shows a solid grasp of the basic structure of Strawson's argument (worthy of a 2:1). However, the substantive errors on the internal adequacy condition (the core question), the misrepresentation of Strawson's handling of excuses, the inaccuracies in portraying Wallace/Watson, and the omission of the case analysis prevent it from reaching a first-class mark (70+). These are not just phrasing issues but errors of interpretation and omission of required content. The mark reflects a good but significantly flawed answer typical of the upper second class (60-69).
