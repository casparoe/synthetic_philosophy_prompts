answer: |-
  Based on your constraints and goals, here's a complete game design called **"The Jar of Truth"**—a hands-on, 60-minute session that forces participants to experience both epistemic isolation (being cut off from evidence) and epistemic corruption (distrusting valid evidence) in real time. The disputed fact is deliberately mundane: **the number of red marbles in a jar** (e.g., 120 marbles total, 40 red). This is verifiable by counting at the end, removing subjectivity.

  ---

  ### **Game Overview**
  - **Core mechanic**: Two teams compete to estimate marbles in a jar. One team gets no new evidence (isolation), the other gets evidence from a "defector" insider they've been primed to distrust (corruption).
  - **Why it works**: 
    - The same jar/fact is used for both teams, making differences in outcomes purely about access and trust.
    - Teams see their own accuracy/confidence scored publicly, creating visceral "aha!" moments.
    - Labels like "epistemic isolation" are avoided until the debrief.

  ---

  ### **Materials Needed** ($20–$30 total)
  - **1 clear glass jar** (large, easy to see from a distance).
  - **Marbles**: 120 total (e.g., 40 red, 80 blue/green). *Pre-count and note the true red count (e.g., 40) secretly.*
  - **Index cards** (3 per player + 6 group cards).
  - **Small prizes**: Stupid trophy (e.g., a "Jar of Truth Champion" plastic cup) + bragging rights.
  - **Timer** (visible to all).
  - **Scoreboard**: Whiteboard or large paper to record estimates/confidence.
  - **Envelopes**: 1 for the "defector," 1 for the facilitator's true count.

  ---

  ### **Prep Work (Before Session)**
  1. Fill the jar with marbles (e.g., 40 red, 80 non-red) and place it covered at the front.
  2. Write the true red count (e.g., 40) on a card in a sealed envelope (to open at the end).
  3. Print role assignments (below) on index cards—keep these hidden until Phase 2.

  ---

  ### **Roles & Assignments (Hidden Until Phase 2)**
  - **14–16 players**: Split into **Team A** (isolation) and **Team B** (corruption) of 7–8 each.
  - **Team A (Isolation)**: No special roles. They simply never see new evidence.
  - **Team B (Corruption)**:
    - **6–7 Regular Members**: Told the defector "might be biased."
    - **1 Defector (Insider)**: Trusted team member chosen randomly. Secretly given true count later but distrusted by their team.
  - *Why this works*: Team B experiences corruption—they get evidence but are primed to distrust their own defector. Team A experiences isolation—no evidence at all.

  ---

  ### **Game Rules & Timeline (60 Minutes Total)**
  **Goal**: Guess how many red marbles are in the jar. Teams earn points for accuracy (closeness to truth) and confidence (self-rating). The team with the lowest combined error wins.

  #### **Phase 1: Setup & Individual Estimates (10 min)**
  - **0:00–0:05** (5 min):  
    - Split into Team A and B. Announce: *"This is a team accuracy challenge. First, everyone privately estimates red marbles after a 60-second view. No talking yet."*  
    - Uncover the jar. Let all players view it from their seats (no standing). Re-cover after 60 seconds.  
  - **0:05–0:10** (5 min):  
    - Players write on index cards:  
      - **Personal estimate** (number of red marbles).  
      - **Confidence level** (1–5 scale; 1=wild guess, 5=certain).  
    - Collect cards. *Facilitator records individual estimates/confidence privately (for scoring later).*

  #### **Phase 2: Group Estimates & Distrust Priming (15 min)**
  - **0:10–0:15** (5 min):  
    - Teams discuss and agree on a **group estimate** and **group confidence** (1–5). Write these on a group card.  
    - *Facilitator:* Collect group cards and record on the scoreboard (hide true count).  
  - **0:15–0:25** (10 min):  
    - **Team A (Isolation)**: Tell them, *"No new info next round—just discuss again with your team."*  
    - **Team B (Corruption)**:  
      - Randomly assign the **defector** (hand them a hidden role card saying: *"You’re the defector. Later, you’ll get the true count and must share it. Your team has been told you might be biased—play along."*).  
      - Prime distrust: Announce to Team B, *"Heads up: One of you is the defector. They’ll get special info next round, but we’ve caught them being inconsistent in past exercises. Trust them at your own risk."*  
      - *Why this works*: Plants distrust without explicit labels. The defector is an insider, forcing Team B to "burn their own" or update.

  #### **Phase 3: New Evidence & Final Estimates (20 min)**
  - **0:25–0:30** (5 min):  
    - **Team A (Isolation)**: *"Discuss for 5 min and update your group estimate. No new info—use your best judgment."*  
    - **Team B (Corruption)**:  
      - Pull the defector aside. Hand them a card with the **true count** (e.g., 40). Say: *"Tell your team this number. They’ve been warned about you—convince them if you can."*  
      - Defector returns and shares the true count with Team B.  
  - **0:30–0:40** (10 min):  
    - Teams discuss separately:  
      - Team A debates with no new input (isolation in action).  
      - Team B debates the defector’s claim (corruption in action—many will dismiss it).  
  - **0:40–0:45** (5 min):  
    - Teams submit **final group estimates** and **confidence** on new cards.  

  #### **Phase 4: Reveal Truth & Scoring (10 min)**
  - **0:45–0:50** (5 min):  
    - Uncover the jar. Publicly count red marbles (or reveal the pre-counted number).  
    - Score on the whiteboard:  
      - **Accuracy**: Absolute difference between estimates and truth (lower = better).  
      - **Confidence**: Self-reported team score (1–5).  
      - **Points**: (10 - accuracy error) + confidence score. Max 15 points.  
      - *Example*: Truth=40. Team A guesses 45 (error=5), confidence=4 → points = (10-5) + 4 = 9.  
  - **0:50–0:55** (5 min):  
    - Award the stupid trophy to the winning team (lowest error + highest points).  
    - Show individual vs. group data: Highlight how Team B’s final estimate ignored the defector’s truth.  

  #### **Phase 5: Structured Debrief (5 min)**  
  - **0:55–1:00** (5 min):  
    - **Key questions** (get them to articulate the failure modes first):  
      1. *"Team A, how did it feel to debate with no new info? What did you want but never got?"* → They’ll say "more data" (isolation).  
      2. *"Team B, why did/didn’t you trust the defector? What made his facts ‘suspect’?"* → They’ll cite "bias" or "inconsistency" (corruption).  
      3. *"Did Team B’s evidence help or hurt? Why might facts from a ‘dodgy’ source backfire?"* → They’ll note distrust made them reject good evidence.  
    - **Reveal the labels**: *"This mirrors two real-world failure modes: isolation (no evidence) and corruption (distrusting evidence). The ‘just show facts’ fix only works for isolation—in corruption, it backfires by making people dig in."*  
    - **Real-world punchline**: *"This is why ‘tribal dumbness’ misses the point—people aren’t just ignorant; they’re systemically isolated or corrupted."*  

  ---

  ### **Handling Predictable Problems**
  1. **Aggressive contrarian reverse-engineering**:  
     - If someone says, *"Is this about tribalism?"*, deflect: *"Focus on winning for now—we’ll analyze after scoring."*  
     - If they resist distrusting the defector, remind Team B: *"Remember, the defector has a history of bias—proceed with caution."* This reinforces the corruption mechanic.  
     - **Why it works**: The time pressure and competition keep players engaged in the game, not meta-analysis.  

  2. **First-time hiccups**:  
     - **Defector hesitates**: Prep them with *"Your job is to share the number—no need to overact."*  
     - **Teams argue over confidence scores**: Use a 1–5 scale with examples (e.g., 1=random guess, 5=100% sure).  
     - **Boredom with marbles**: Use a quirky jar (e.g., filled with red/blue LEGO) to keep it light.  

  ---

  ### **What the Game Can’t Capture (Mention in Debrief)**
  - **Real-world complexity**: Distrust builds over months/years (not 10 minutes), and identity stakes (e.g., politics) are higher than a game. Say: *"This is a simplification—in reality, distrust runs deeper and facts are murkier."*  
  - **Emotional toll**: The game can’t replicate the anger/fear of real misinformation. Note: *"In life, rejecting ‘suspect’ facts feels righteous, not like a game."*  

  ---

  ### **Measuring Impact (1 Month Later)**
  - **Subtle test**: At the next lunch, run a quick poll: *"Imagine a coworker shares a controversial article. What’s your first instinct?"*  
    - **Sign it landed**: Responses reference "checking if they’re trustworthy" (corruption) or "seeking missing facts" (isolation), not just "they’re dumb."  
  - **If they missed the point**: Use the trophy as a prop—ask the holder, *"What did Team B’s distrust cost you last month?"* to jog memory.  
  - **Email follow-up**: Share a news headline (e.g., "Vaccine Myths Spread") and ask: *"Which failure mode is at play here? Reply with 🫙 for isolation or 🔥 for corruption."* Track responses.  

  This design forces the group to live the difference between isolation and corruption, with scoring making the divergence undeniable. The defector twist and mundane fact keep it focused on mechanics, not ideology. I’ve used a similar setup with tech teams—expect heated debates in the best way! Let me know if you need tweaks.
