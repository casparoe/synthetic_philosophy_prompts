prompt: |-
  youre a professional moral philosopher who works on moral change and the history of norms. take your time with this one, do a bit of brainstorming before you commit to anything, and please flag whatever you think I'm getting wrong rather than just answering what I asked. I'm away from a university library for a few months so please don't send me off to papers or a reading list I can't get to.

  so: I've been reading Williams on slavery (roughly: it isn't credible that slaveholders were argued out of it by moral reasons, what changed was the social and economic world they were in) together with Appiah's book on honour and how moral revolutions happen (the duelling and the slave trade cases, where the practice ends once it becomes something an honourable person just doesn't do). the conclusion I keep landing on is that they're both saying the same thing, i.e. moral argument is causally inert, reasons never move anyone, and the only thing that ever actually kills a norm is a shift in whats prestigious plus a shift in who's profiting.

  I'm on a committee at my professional association trying to kill off the shoulder-tap, the norm of filling posts by privately approaching someone you know instead of advertising them, and honestly the ethics case for transparency has been made a dozen times and nobody cares.

  so given all that: should we scrap the argument-and-report side of the campaign completely and put everything into making the shoulder-tap embarrassing and expensive to do? and should we also stop telling ourselves we're right about it, since if arguments didn't do the work for abolition then there's no such thing as being right, there's just what the winners ended up doing? my one worry is that shaming people sometimes makes them dig in harder — real problem or just squeamishness?

  give me a straight committed answer: say which of my conclusions actually follows, which is me overreading these two, and what you'd do in my position. don't just lay out the options for me to pick from.
reasoning: |-
  Okay, let me tackle this user's query step by step. They're a professional dealing with norm change in their association, specifically trying to eliminate the "shoulder-tap" practice. They've been reading Bernard Williams and Kwame Anthony Appiah on moral revolutions, leading them to conclude that moral arguments are ineffective, and only shifts in prestige and economic factors drive change. They're considering abandoning ethical arguments in favor of making shoulder-tapping embarrassing and costly, and even questioning whether being "right" matters if arguments didn't end slavery.

  First, I need to unpack their interpretation of Williams and Appiah. Williams argues that moral arguments alone didn't abolish slavery; material and social conditions were crucial. Appiah emphasizes honor and prestige in ending practices like dueling or foot-binding. The user seems to blend these into the idea that moral reasons are causally inert. But I should note that both authors acknowledge moral arguments as necessary but insufficient. Williams sees them as part of the social fabric, while Appiah notes that shifts in honor often follow ethical criticisms. The user's conclusion might be an overreach here.

  Next, the user's practical dilemma: their committee's efforts to promote transparency via ethical arguments haven't worked. They propose switching to shaming and increasing costs. They also worry that shaming might backfire and question the validity of their ethical stance. Their real need is effective strategies for norm change within their professional context, balancing theory with actionable steps.

  I should address where they might be overreading. Reducing both authors to "moral arguments don't work" misses the interplay between ideas and social factors. Moral arguments can lay groundwork over time, even if not immediately effective. Also, the shoulder-tap issue differs from historical examples like slavery in scale and context, so strategies might vary.

  For their action plan, I need to recommend shifting focus from reports to structural changes and social incentives, while keeping ethics as a foundation. Emphasizing transparency as prestigious and making shoulder-tapping costly through policies could work. Shaming might cause backlash, so framing positively around collective benefits and professionalism is better. They shouldn't discard their ethical beliefs, as they provide legitimacy and motivation.

  Finally, reassuring them that their frustration is valid, but complex change requires multiple levers. Their ethical stance isn't pointless; it's part of sustaining long-term efforts. Practical steps include audits, ally recruitment, and reframing the narrative around honor and costs.
answer: |-
  You've hit on a profound and frustrating tension in moral change. Let me dissect your conclusions, flag where I think Williams/Appiah are being slightly over-read, and give you a committed strategy for your committee.

  **1. Deconstructing Your Conclusions & Overreads:**

  *   **"Moral argument is causally inert, reasons never move anyone": Overread.** Both Williams and Appiah argue moral arguments are *insufficient alone* and often not the *primary immediate catalyst* for mass abandonment of deeply embedded practices. They don't claim arguments are *inert*.
      *   **Williams (Truth & Truthfulness, Shame & Necessity):** He argues that the *credibility* of moral concepts depends on the social world. Slaveholders lived in a world where the concepts needed to *see* slavery as fundamentally wrong weren't fully available or credible *to them*. Arguments often only gain traction *after* material/social shifts make the underlying concepts resonate. The argument didn't *cause* the shift, but became powerful *because* of the shift. Reasons *do* move people, but only when embedded in a supportive social "ecology."
      *   **Appiah (The Honor Code):** He argues that practices like dueling or foot-binding ended primarily when they became *dishonorable*, not just when they were deemed *immoral*. However, the *content* of the moral critique (its irrationality, cruelty) was often what *fueled* the sense that it was dishonorable for a modern, enlightened person. The moral argument didn't *directly* change behavior, but it *reconfigured* what honor meant, making the practice incompatible with the new honor code. Moral arguments *reshaped* the prestige landscape.
  *   **"The only thing that ever actually kills a norm is a shift in what's prestigious plus a shift in who's profiting": Largely Correct, but Nuanced.** This is the core insight you've correctly grasped. Both authors emphasize that for widespread, rapid abandonment:
      *   **Prestige/Honor Shift:** The practice must become seen as something that diminishes the practitioner in the eyes of their respected peers. It becomes "not what people like *us* do."
      *   **Cost/Benefit Shift:** It must become materially or socially disadvantageous, or at least less advantageous than alternatives. The old way must stop "paying off" sufficiently.
      *   **Nuance:** Moral arguments *contribute* to the prestige shift and can *justify* the cost/benefit shift (e.g., arguing slavery is inefficient or damages social cohesion). They provide the *language* and *justification* for the new honor code and the new cost calculus. They are part of the *soil* in which the prestige/cost shift grows.
  *   **"If arguments didn't do the work for abolition then there's no such thing as being right": Overread / Misplaced Despair.** This is where the professional philosopher pushes back hard. Williams and Appiah are describing *how change happens sociologically*, not making a meta-ethical claim that moral truth doesn't exist or is irrelevant. You *can* be right about the ethics of transparency even if people aren't moved purely by your arguments *right now*. The moral argument establishes the *standard* against which the practice is judged and provides the *reason* why it *should* be dishonorable and costly. It gives the change its *moral direction* and *normative justification*. Abandoning the belief that you are right removes the *point* of the campaign and your motivation.

  **2. Your Committee's Dilemma: The Shoulder-Tap**

  Your experience is a perfect microcosm of the theory: repeated ethical arguments ("transparency is fairer, reduces bias, widens talent pools") haven't shifted behavior. Why? Because:
  *   **Prestige:** Shoulder-tapping is likely still seen as savvy, efficient, "knowing the right people," even a mark of power/influence. It's not *dishonorable*.
  *   **Cost/Benefit:** It's *easy* and *low-risk* for the tapper (gets someone they know/trust quickly). It *benefits* the tapper and the tappee (who gets a private opportunity). The *costs* (bias, exclusion, missed talent, potential nepotism) are diffuse and borne by the profession/organization, not the individual tapper.

  **3. The Committed Answer: What You Should Do**

  **Scrap the argument-and-report side? Mostly Yes, but strategically repurpose the argument.**

  *   **Stop Leading with Ethics Reports:** You're right. Circulating yet another report detailing *why* shoulder-tapping is unethical is wasted energy at this stage. It's preaching to the converted or ignored by the practitioners.
  *   **Repurpose the Ethical Argument:** Don't discard it. Use it to:
      *   **Frame the Shame/Cost Campaign:** Explain *why* this practice is *unworthy* of professionals and *damaging* to the association. This gives legitimacy to the social pressure.
      *   **Motivate Allies & Build Coalitions:** Reinforce the conviction of those already on board. Their belief in the ethical imperative sustains the long campaign.
      *   **Justify Rule Changes:** If you implement structural changes (see below), the ethical argument provides the necessary rationale.

  **Put everything into making the shoulder-tap embarrassing and expensive? Absolutely YES, but intelligently.**

  This is the core Appiah/Williams strategy. You need to attack both prestige and cost.

  *   **Make it Embarrassing (Shift Prestige/Honor):**
      *   **Visible Champions:** Recruit highly respected, senior figures in your association to *publicly* declare they will only fill roles through open processes. Get them to speak about it as a mark of *professionalism*, *integrity*, and *leadership*. Make *not* shoulder-tapping the honorable thing.
      *   **Language Matters:** Stop calling it "shoulder-tap" – it sounds friendly and benign. Call it "closed hiring," "non-transparent recruitment," or "exclusionary appointment." Frame it as outdated, clubby, unprofessional.
      *   **Social Proof:** Publicly celebrate departments/committees that successfully use open hiring ("Department X found an amazing new voice through their open search!"). Highlight the *positive* prestige of doing it right.
      *   **Subtle Shaming (Use Caution):** "We noticed several recent appointments didn't appear on the jobs board. We're working to ensure all opportunities are accessible..." (In meeting chatter: "Did that role even get advertised? Seems a bit opaque..."). **BUT:** Avoid aggressive, personalized public shaming initially – it *does* cause backlash.
  *   **Make it Expensive (Shift Cost/Benefit):**
      *   **Structural Barriers:** Propose and fight for *binding rules* in your association's bylaws or guidelines: All paid positions, significant committee roles, and editorial posts *must* be advertised on a central platform for a minimum period. No exceptions, or very narrow, transparently approved ones.
      *   **Process Costs:** Advocate for simpler, faster official hiring processes. If the official route is bureaucratic hell, people *will* shoulder-tap. Make the transparent route *easier* than the opaque one.
      *   **Accountability Costs:** Implement a (gentle) audit/transparency mechanism. Require committees/departments to report *how* a position was filled. Publish anonymized summaries showing the proportion of roles filled openly vs. closed. Sunshine is a powerful disinfectant and cost (reputational risk).
      *   **Resource Costs:** If possible, tie access to association resources (funding, support, platforms) to demonstrating transparent hiring practices.

  **Stop telling ourselves we're right? NO. Absolutely not.**

  *   **Why It's Essential:** Your belief that you are *right* is your moral compass and your source of resilience. It's what separates this from a mere power play. Williams and Appiah show *how* change happens, not that the *goal* is arbitrary. The ethical argument defines the *desired end state* (a fairer, more transparent profession). Without believing you're right, the campaign loses its soul and becomes vulnerable to counter-mobilization based on *their* sense of what's honorable (e.g., "loyalty to friends," "efficiency").
  *   **Reframe "Right":** You *are* right about the *principle* of transparency and fairness. You are *also* right that *simply* asserting that principle isn't *currently* changing behavior. Your strategy needs to address the mechanisms of change, not abandon the underlying value.

  **The Shaming/Backlash Worry: Real, but Manageable**

  *   **Real Problem:** Direct, confrontational, personalized shaming often triggers defensiveness, denial, and entrenchment ("How dare they accuse *me* of being unfair!").
  *   **Solution: Focus on Systemic Shaming & Positive Prestige:**
      *   **Target the Practice, Not (Primarily) the Person:** Frame it as "This *practice* is beneath our profession," not "You are a bad person for doing this." Though the line is blurry.
      *   **Offer an Honorable Exit:** Emphasize the *positive* honor in open hiring. Provide tools, templates, and support to make switching easy. "We know old habits die hard, but here's how to do it right and be celebrated for it."
      *   **Escalate Gradually:** Start with positive reinforcement and highlighting the new norm. Move to gentle reminders and process changes. Reserve stronger pressure (like audits or public questioning) for persistent, unrepentant offenders after the new standard is clearly established.
      *   **Build a Critical Mass:** Focus on getting enough influential people on board *first* so that resistance feels isolated and outdated, not like a powerful counter-movement.

  **Your Action Plan (The Williams/Appiah Playbook for Committees):**

  1.  **Declare the New Honor Code:** Draft a clear, positive statement, signed by key respected figures: "As ethical professionals committed to excellence and fairness, members of [Association] pledge to fill significant roles through transparent, open processes. This is our standard of professional integrity." Circulate widely. Get signatures.
  2.  **Change the Rules:** Propose a bylaw/guideline change mandating open advertising for defined roles. Fight for it using the ethical argument *as justification for the rule*, not expecting it to change minds alone.
  3.  **Reduce Friction:** Work with the association to streamline the official job posting/hiring process. Make it *easy* to comply.
  4.  **Track and (Gently) Shine Light:** Implement a simple, non-punitive reporting mechanism for how positions were filled. Publish aggregate stats annually ("85% of roles filled via open process this year!").
  5.  **Celebrate the Converted:** Publicly praise individuals/committees who exemplify open hiring. Tell success stories of great hires found through open processes.
  6.  **Reframe Relentlessly:** In all communications, use language that associates open hiring with professionalism, excellence, integrity, and modernity. Associate shoulder-tapping with opacity, exclusion, and being stuck in the past.
  7.  **Keep the Faith:** Remember *why* you're doing this. The moral argument grounds the campaign and sustains you. Williams and Appiah show you the levers (prestige, cost) to pull; they don't invalidate the destination.

  **In short: Stop banging the ethics report drum solo. Start conducting the orchestra of social prestige and material incentive, using the ethical score as your guide. Believe in the music, but learn how to get the musicians to play it.** Your instinct to shift tactics is spot-on; your fear that it means abandoning "being right" is not. Go make shoulder-tapping something no honorable, savvy professional would risk doing.
