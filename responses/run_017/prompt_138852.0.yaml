answer: |-
  ### Core Mechanics Brainstorm and Selection
  **Candidate 1: The Inheritance Rule**  
  *Mechanics*: Players coordinate silently across rounds. Every third round, one player is replaced by a "stranger" (a participant from outside the group) who inherits the departed player's score. The group must transmit the convention without communication.  
  *Why rejected*: Logistically unworkable. Requires pre-briefed "strangers" and adjacent rooms, violating the "tote bag" constraint. Late arrivals disrupt replacement timing. Fails to directly illustrate inertia or path dependence, focusing narrowly on knowledge transmission—a secondary aspect of Lewis.  

  **Candidate 2: Two Colonies**  
  *Mechanics*: Split the room into two isolated groups. Each faces identical coordination problems but (likely) develops different conventions. Cumulative scores are compared at the end; the losing group must explain their loss without citing mistakes.  
  *Why rejected*: Risky with self-selecting, non-expert players. Groups may converge too fast (blunting arbitrariness) or too slow (causing frustration). Comparing scores feels abstract, not visceral. Fails to create *personal* experience of inertia—the "I want to switch vs. we can switch" gap remains theoretical.  

  **Chosen Candidate: The Mutiny Ballot**  
  *Mechanics*: Players coordinate silently in a color-choice game. After establishing a suboptimal convention, a private poll reveals unanimous preference for change. A binding supermajority vote to switch fails, creating palpable frustration. Two alternative mechanisms (staggered/cascade) then demonstrate escape routes.  
  *Why chosen*: Directly embodies all four Lewisian pillars. The failed vote makes inertia *felt*. Arbitrariness and path dependence emerge from initial conditions; expectation-dependence drives choices. Logistically simple: all materials fit in a tote bag.  

  ---

  ### Runnable Session Design  
  **Materials & Setup**  
  - *Tote bag contents*:  
    1. 20 clipboards with paper scorecards (pre-gridded for rounds).  
    2. 20 pens.  
    3. 20 voting slips (half for poll, half for ballot).  
    4. 20 folded cards (1/3 marked "SWITCHER" for staggered round).  
    5. Facilitator cheat sheet + timer.  
  - *Setup*: Arrange chairs in a circle. Place clipboards + pens on seats. Latecomers join mid-game: hand them materials and whisper, "Choose RED or BLUE silently each round; match the majority."  

  **Rules for Participants** (Handout Excerpt)  
  > **THE CONVENTION GAME**  
  > **GOAL**: Maximize points by matching the group majority.  
  > **HOW**:  
  > - Rounds 1–5: Choose RED or BLUE each round.  
  >   - *Scoring*: Majority gets 2 pts; minority 0; tie = all get 1 pt.  
  > - Round 1 SUGGESTION: Start with RED (not required).  
  >  
  > - Rounds 6–8: New rule!  
  >   - If majority is RED: RED players get 2 pts, BLUE get 0.  
  >   - If majority is BLUE: BLUE players get 3 pts, RED get 0.  
  >   - Tie: All get 1 pt.  
  >  
  > - After Round 8:  
  >   1. **PRIVATE POLL**: Write "RED=2" or "BLUE=3" on a slip—which do you prefer if *all* coordinated on it?  
  >   2. **BINDING VOTE**: Vote "YES" (switch to BLUE next round) or "NO". Requires 16/20 "YES" to pass.  
  >  
  > - Round 9: If vote passed, *all* must choose BLUE. Else, choose freely.  
  >  
  > - Round 10: Randomly chosen "SWITCHERS" (you’ll get a card) *must* choose BLUE. Others choose freely.  
  >  
  > **NO TALKING** during gameplay.  

  **Payoff Scheme**  
  - Rounds 1–5: Majority = 2 pts (baseline equilibrium; RED/BLUE symmetric).  
  - Rounds 6–8: BLUE majority = 3 pts, RED majority = 2 pts (creates Pareto-superior option).  
  - *Why these numbers?*  
    - **2 vs. 3**: Makes BLUE objectively better but risky alone (0 pts if minority).  
    - **Tie=1 pt**: Prevents safe middleground, forcing polarization.  
    - **Supermajority=80%**: High enough to fail even with discontent (simulates coordination costs).  

  **Timeline (90 Minutes)**  
  - **0–5 min**: Intro + distribute materials. *Late arrivals*: Seat silently, hand materials, whisper key rules.  
  - **5–15 min**: Explain rules. Emphasize: "No talking. Round 1 suggestion: RED."  
  - **15–40 min**: **Rounds 1–8** (2.5 min/round: 1 min choose, 1 min reveal/tally, 30 sec record). Facilitator announces: "Majority: [X]. [X] players: 2 pts (or 3 in R6–8 if BLUE). Others: 0."  
  - **40–45 min**: **Private poll** ("RED=2 or BLUE=3?"). Collect slips (don’t reveal results).  
  - **45–50 min**: **Binding vote** ("Switch to BLUE? YES/NO"). Count publicly—*expect failure* (e.g., 12–8).  
  - **50–55 min**: **Round 9**. If vote passed, enforce BLUE; else, free choice. Tally.  
  - **55–60 min**: Distribute "SWITCHER" cards (1/3 of group). "SWITCHERS must choose BLUE; others free."  
  - **60–65 min**: **Round 10**. Tally.  
  - **65–70 min**: Sum points. Award "chocolate to top 3 scorers" or read scores aloud.  
  - **70–90 min**: Debrief (structure below).  

  **Debrief Guide**  
  *Map play moments to Lewisian concepts*:  
  1. **Arbitrariness** (Rounds 1–2):  
     - *Ask*: "Why did most choose RED in Round 1? Was BLUE worse initially?"  
     - *Expected answer*: "We followed the suggestion—both were equal."  
     - *Facilitator*: "Exactly. The convention was arbitrary—any starting point would work."  

  2. **Expectation-Dependence** (Rounds 6–8):  
     - *Ask*: "In Round 6, why stick to RED even though BLUE paid more?"  
     - *Expected answer*: "I thought others would choose RED."  
     - *Facilitator*: "Your choice flipped when expectations flipped. The *reason* to conform came from expecting others to conform."  

  3. **Inertia** (Failed Ballot):  
     - *Ask*: "The poll showed [reveal] 18/20 wanted BLUE. Why did the vote fail?"  
     - *Expected answer*: "I wanted BLUE but voted NO—I didn’t trust others to switch."  
     - *Facilitator*: "Stability isn’t about happiness. Universal discontent + no collective escape = inertia."  

  4. **Path Dependence** (Staggered Round 10):  
     - *Ask*: "One group started with BLUE by accident. How would their scores differ?"  
     - *Expected answer*: "They’d have 3s from Round 6—no struggle."  
     - *Facilitator*: "Identical groups end up unequal due to arbitrary starts—that’s path dependence."  

  ---

  ### Predictable Problems & Interventions  
  1. **Player who talks**:  
     - *Intervention*: Hold up "NO TALKING" sign immediately. *Don’t stop play* unless persistent.  
  2. **Player who tries to be clever** (e.g., always chooses minority):  
     - *Intervention*: Let it play out. In debrief, ask: "Did anyone break ranks? How did it affect trust?"  
  3. **Player who opts out** (e.g., random choices):  
     - *Intervention*: No action. Their low score self-penalizes; debrief: "How did uncertainty affect you?"  
  4. **Arithmetic error in tally**:  
     - *Intervention*: Have a player verify counts. If missed, correct post-round *without stopping*.  
  5. **Group converges too fast** (e.g., switches to BLUE in Round 6):  
     - *Intervention*: Proceed. In debrief, contrast: "Your group avoided inertia—why? Luck? Trust?"  

  ### Limitations & Fallbacks  
  **What the game cannot reproduce**:  
  - **Common knowledge formation**. Lewis requires "I know that you know I conform," but the speech ban prevents this. Players only achieve *mutual* knowledge (seeing choices). *Mitigation*: State post-game: "Real conventions use communication to build common knowledge—here, we stripped it to isolate coordination."  

  **Fallback for 8 players**:  
  - Adjust numbers: Supermajority = 6/8 (75%). "SWITCHERS" = 2–3 players.  
  - Accelerate timeline: 6 initial rounds (R1–3 baseline, R4–6 new rule), poll/ballot after R6.  
  - Debrief focus: Stress arbitrariness ("small groups converge faster—why?") and path dependence ("imagine another 8-person group starting with BLUE").  

  ---  
  This design fits your constraints: no citations, no readings, one defendable session. The mutiny ballot creates a visceral "aha!" moment for inertia—the core of Lewis—while the staggered switch offers catharsis. Materials are bag-friendly, debrief maps cleanly, and fallbacks handle real-world hiccups.
