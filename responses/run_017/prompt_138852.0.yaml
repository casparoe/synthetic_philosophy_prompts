     Timeline with 90 minutes:

     Total 90 min.

     0-5 min: Welcome, explain the theme (without giving away the theory), and hand out materials: whiteboard, marker, score sheet, and pen to each. Late arrivals: if they come during the game, they can be seated and given materials. They will start with 0 points for the rounds they missed.

     5-10 min: Read the rules for Part 1 (rounds 1-4). Emphasize: no talking, hold up your board only when asked. Do a practice round (round 0) without points: "Choose RED or BLUE. Hold up. Count. Then reset."

     10-18 min: Rounds 1-4 (4 rounds, 2 min each: 8 min total). For each round:
          - "Now, decide and write your choice." (30 seconds)
          - "Hold up your boards." (everyone holds up at the same time)
          - Facilitator quickly counts and announces: "12 RED, 8 BLUE. Majority is RED. So RED gets 2 points, BLUE gets 0." (or in tie: "10-10, tie, everyone gets 1")
          - Players record their own points on their score sheet.

     18-20 min: Announce the new scoring for Part 2 (rounds 5-6). Read the rules.

     20-24 min: Round 5 (2 min: 1 min decide, 1 min reveal and record)
     24-26 min: Round 6 (2 min)

     26-30 min: Private poll: "Which do you prefer: if the whole group coordinated on RED (you get 2 points) or BLUE (you get 3 points)?" Hand out small slips, collect. (Don't reveal the result yet.)

     30-35 min: Binding ballot: "Vote YES to force everyone to choose BLUE in round 7, or NO to keep free choice. This requires 16 out of 20 votes to pass (or 4/5 of the current number)." Distribute ballots, collect, and count publicly. Announce the result.

     35-37 min: Round 7: Play. If the vote passed, everyone must choose BLUE. Otherwise, free. Then reveal and score.

     37-40 min: Staggered switch: Randomly select one-third (e.g., if 18 players, then 6) by drawing names or by handing out notes to 6 people. Tell them: "You are a switcher: you must choose BLUE in round 8." The rest choose freely.

     40-42 min: Round 8: Play and score.

     42-45 min: Total the points (players add their own). Top three scores get chocolate. Or we can do public recognition: the highest score reads their total? But that might embarrass.

     45-90 min: Debrief (45 minutes). We have time to go deep.

     Debrief structure:

     - Start by asking: "What happened? What did you experience?" (Open floor, 5 min)
     - Then map to the four points:

          1. Arbitrariness:
              - "Why did we start with RED? Was there a reason? What if we had started with BLUE?"
              - "In the first rounds, why did you stick to RED? Was it because you expected others to choose RED?"
              - Point: The convention was arbitrary. It formed because we suggested RED and then you expected it.

          2. Expectation-dependence:
              - "In rounds 5 and 6, why didn't you switch to BLUE? What was going through your mind?"
              - "Did anyone try to switch? What happened?"
              - Point: Your choice depended on your expectation of others. Even though BLUE was better, you didn't switch because you didn't expect others to switch.

          3. Inertia under universal discontent:
              - "After round 6, we took a poll: let me tell you the result: it was X for BLUE and Y for RED. (Likely nearly all for BLUE). But then the binding vote to switch failed. Why do you think that happened?"
              - "Did anyone who wanted BLUE vote against the switch? Why? (e.g., 'I thought it wouldn't pass anyway')"
              - "Even though everyone wanted the switch, we couldn't achieve it by a vote. Why? Because each person's decision to vote for the switch depended on their expectation that others would vote for it? And they didn't trust that?"
              - Point: The convention was stable even though everyone was unhappy. No individual could change alone, and the collective vote failed.

          4. Path dependence:
              - "Suppose we had started with BLUE. Then in round 5, you would have automatically gotten 3 points. But we started with RED and you were stuck at 2. How do we break out? We had to force a critical mass to switch."
              - "This shows that the outcome depends on the initial conditions. And note: the initial condition was arbitrary. That's path dependence: the path we took (starting with RED) led to an outcome that was hard to change, even though a different path (starting with BLUE) would have been better."
              - "In real life, we see this in technology standards (VHS vs. Betamax), language, and social norms."

     - Then, connect to Lewis: "What we just experienced is a model of how social conventions form and persist. The philosopher David Lewis analyzed conventions as solutions to coordination problems that are arbitrary, expectation-dependent, and stable even when they are not optimal. And they are path-dependent: small accidents of history can lock in a particular convention."

     - Finally, relate to real-world examples: driving side (left vs. right), QWERTY keyboard, etc.

     Now, the candid list of what can go wrong:

     1. Player who talks: They might try to coordinate verbally. 
          - Intervention: Remind them that the game is silent. If they persist, give them a warning. If necessary, ask them to leave? But that's harsh. We can say: "Remember, no talking. The point is to see how we coordinate without communication."

     2. Player who tries to be clever: They might choose the minority intentionally to see what happens, or to try to break the convention. 
          - Intervention: Let them. That's part of the game. They might cause a tie or even flip the majority. It can teach that conventions are fragile.

     3. Player who opts out: They might not participate fully, or leave early.
          - Intervention: If they leave, we adjust the numbers. If they are not participating (choosing randomly), we cannot force them. But we can note that in the debrief: "Some of you might have chosen randomly. How did that affect the group?"

     4. Arithmetic error: The facilitator might miscount the votes.
          - Intervention: Have a participant help count? Or double-check. If it happens, correct it. But the points are not that important.

     5. Group converges too fast: In the first 4 rounds, they might switch to BLUE immediately? But we suggested RED. If they do, then in round 5 they are already on BLUE and we don't get the inertia.
          - Intervention: We can adjust the scoring: if they are on BLUE in the first 4 rounds, then after round 4 we announce that RED is now the better one? But that would be confusing. Alternatively, we can change the better option to a new color? But we don't have a third option. 
          - Better: if they switch to BLUE in round 2, we can still run the same. In the debrief, we can say: "In this group, you switched early. But imagine if you had stuck to RED. Then you would have been stuck." But that's weak.
          - To prevent: strongly suggest RED in the first round. And hope that the expectation keeps them on RED.

     6. Late arrivals: They come in after we started.
          - Intervention: Give them a board and a score sheet. Tell them: "We are on round X. The scoring is ... You start with 0 points for the previous rounds." Then they join.

     7. The binding vote passes: We want it to fail to show inertia. But what if it passes?
          - Then in round 7, everyone chooses BLUE, and they get 3 points. Then we say: "This group was able to overcome the inertia by a collective decision. But note: it required a 4/5 majority. In real life, we don't always have such mechanisms." And then we can still do the staggered switch to show an alternative.

     8. The group doesn't get stuck: In rounds 5-6, they switch to BLUE immediately. Then we don't have the inertia.
          - Why might that happen? If they trust each other? Or if someone chooses BLUE in round 5 and enough follow? 
          - To prevent: we hope that the expectation of RED keeps them on RED. We can also make the supermajority ballot requirement very high so that even if they switch, we still have the inertia in the ballot? But if they switch, then the private poll might show they prefer RED? No, they have BLUE and are getting 3 points, so they prefer BLUE.

     What if they switch to BLUE in round 5? Then we don't have the discontent. But we can still run the ballot: we ask: "Would you prefer to coordinate on RED (2 points) or BLUE (3 points)?" They will say BLUE. Then the ballot to force BLUE is redundant. Then we can skip to the debrief and focus on the other points.

     But we lose the inertia moment.

     How to make it more sticky? We can change the scoring in round 5 to be asymmetric in a way that if they switch, they get more, but the risk is high? But we did that.

     Alternatively, we can have a larger group? But we have 20.

     We can only hope that the convention sticks.

     Given the time, we proceed as planned.

     What the game cannot reproduce:

     - The Lewisian analysis relies on common knowledge. But in the game, players only have mutual knowledge (they see the choices each round, but they don't know what others are thinking). The game bans speech, so we cannot create common knowledge. What is lost? In real conventions, common knowledge (I know that you know that I know...) is important for stability. We cannot show that in the game.

     - We will have to say: "In real life, conventions often become common knowledge through communication. Here, we banned speech to isolate the coordination problem, but in reality, communication helps create and maintain conventions."

     Fallback for 8 people:

     - The mechanics still work. 
     - The supermajority: 4/5 of 8 is 6.4 -> we round up to 7? Or we say 80% (which is 6.4) and we require 7 out of 8? Or we adjust to 3/4? Let's require 7 out of 8 for 4/5 (which is 80% and 7 is 87.5%). Or we can require 6 out of 8 (75%)? But we want it to fail. With 8 players, it's easier to get a supermajority? 
     - We want the ballot to fail to show inertia, so we require 7 out of 8 (which is 87.5%). That's harder than 4/5 (80%). 
     - The staggered switch: one-third of 8 is about 2.66 -> we round to 3.

     - The game might converge faster in a small group? But we hope not.

     - We run the same timeline.

     We'll adjust the numbers on the fly.

     Final design: "The Convention Game" with the mutiny ballot as the core.

