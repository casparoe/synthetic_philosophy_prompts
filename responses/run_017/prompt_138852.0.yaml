  We are designing a 90-minute workshop to convey the Lewisian analysis of convention through gameplay. The core insights to convey are: arbitrariness, expectation-dependence, inertia under universal discontent, and path dependence.

   After reviewing the three candidate mechanics:
   1. The inheritance rule: Tests transmission without common knowledge. However, it requires adjacent rooms and movement, which is logistically complex in a festival setting. Also, the "stranger" element might be hard to simulate without confederates.
   2. The mutiny ballot: Focuses on inertia and the gap between individual preference and collective action. It requires the group to be stuck in a suboptimal convention and then tries to switch. This directly addresses inertia and the supermajority ballot is likely to fail, creating a teachable moment. The two alternative mechanisms (staggered and cascade) then illustrate ways to overcome inertia. This seems robust and fits the constraints.
   3. Two colonies: Illustrates path dependence and arbitrariness by having two groups independently develop conventions and then compare outcomes. However, splitting the group might lead to one group finishing early and waiting, and the comparison might not be as impactful without a clear way to show that both groups had the same problem and no one made mistakes.

   I reject:
   - "The inheritance rule" because it requires additional logistical setup (adjacent room, strangers) that is not feasible in a festival workshop with limited materials and no control over the space. Also, the concept of common knowledge vs mutual knowledge might be too subtle for a 90-minute session with no philosophy background.
   - "Two colonies" because it requires two separate games running in parallel, which would require duplicate materials and careful timing to ensure both groups finish at the same time. Also, if one group converges quickly and the other doesn't, the experience becomes uneven. Moreover, without interaction between the groups, the path dependence might not be felt as acutely as the inertia in the mutiny ballot.

   I choose "The mutiny ballot" as the core mechanic because:
    - It directly targets inertia under universal discontent and expectation-dependence by having a private poll (revealing everyone prefers change) and then a binding vote that fails.
    - The two alternative mechanisms (staggered and cascade) then allow participants to experience different ways to overcome inertia, which can be debriefed to show how collective change can be engineered.
