prompt: |-
  I work as an analyst at a small democracy-monitoring consortium. Twice a year our five-member panel issues country verdicts in three categories — no classification, erosion, backsliding — and I draft the country note on which each verdict rests. Our terms of reference define the object as incumbent-led debilitation or elimination of any of the political institutions that sustain an existing democracy, which has never once been enough to settle a case on its own.

  Our four most-cited verdicts, given as the panel's own reasons rather than mine:

  Hungary, after 2010: backsliding. A two-thirds parliamentary majority replaced the constitution, entrenched a large body of policy in cardinal laws, restructured the ordinary judiciary and the composition and appointment of the constitutional court, rebuilt the media regulator and the public broadcaster, and redrew constituencies and electoral rules. The panel expressly recorded that every step was formally legal and that the governing coalition had won an electoral mandate, and treated both as aggravating context rather than as a defence: legality was the instrument, not the excuse.

  Poland, 2015–2023: backsliding, with a note. The triggering measures were the constitutional tribunal crisis, the refusal to publish judgments, the subordination of the prosecution service and the public media, and the restructuring of the supreme court. The panel noted that elections remained genuinely competitive throughout and that power changed hands after the 2023 election, and held that neither fact prevented the classification: degradation of horizontal accountability counts even where the electoral arena is left intact.

  Turkey, after 2016: backsliding. The state of emergency following the failed coup and the mass dismissals that followed it; the prolonged detention of journalists and of opposition politicians; the referendum move to an executive presidency; and the annulment of the 2019 Istanbul mayoral election and the ordering of a re-run, which the opposition won again by a wider margin. The panel's note said that the existence of a formally competent domestic legal basis for the annulment, and the governing party's repeated electoral victories, did not change the classification.

  United States: erosion, not backsliding, with a subnational flag. The panel counted the post-2020 attempts to substitute alternate slates of presidential electors and to press state and federal officials over certification, together with subsequent state-level changes to election administration. It declined to classify at the federal level because the attempts failed and were absorbed by courts, legislatures and officials, and because the state-level measures fell within the range of variation found among established democracies. It has never classified a subnational unit on its own.

  A fifth, less-cited precedent: three years ago the panel classified a lame-duck government's expansion of its constitutional court from nine to eleven seats, with two judges seated after that government had lost the election, as erosion rather than backsliding, on the stated ground that the change was reversible by an ordinary majority and removed no jurisdiction from the court.

  The new case is a real country I have anonymised as Vardania, with a few identifying details changed so the note can circulate. Nine million people, unicameral parliament, two hundred seats previously filled by single-member plurality, three peaceful alternations of power since the mid-1990s. Eighteen months ago a coalition I will call Renewal — two centre-left parties plus a newer anti-establishment party, running on an expansion of public health coverage and tighter asylum rules, so that my colleagues disagree about it for reasons that have nothing to do with democracy — took 43 per cent of the vote and 58 per cent of the seats. Everything below was passed by simple majority, upheld on review, and enacted without violence, without an emergency, and without any allegation of fraud.

  First: long-term resident non-citizens, about 7 per cent of adults, were enfranchised; the voting age fell from eighteen to sixteen; consular voting was extended to all missions. The register grew by 11 per cent. Independent modelling puts the new registrants about six to nine points more favourable to Renewal than the existing electorate, though the exclusions themselves had been criticised by the regional human rights body for over a decade.

  Second: single-member plurality was replaced by regional list proportional representation with a four per cent threshold, plus a twelve-seat Governance Premium awarded to the largest party. Our own staff projection is that Renewal's seat share falls from 58 per cent to roughly 46 per cent, so it would need a coalition partner. The reform costs the incumbent seats.

  Third: the mandatory retirement age for constitutional judges fell from seventy to sixty-five, retiring six judges within ninety days; their replacements are elected by simple majority rather than two-thirds; and the court lost jurisdiction over the electoral code and over budget bills. Supervision of the voter register moved from the courts to the electoral commission. I should say that two of the sitting judges were appointed in the same way by the previous government, the case in which we found erosion only.

  Fourth: the electoral commission was rebuilt. It had been chaired by a supreme court judge with judicial and civil-society members; it is now eight members, four named by the government and four by parliament, with the chair elected by parliament, and it now controls voter-registration verification. Its first verification run struck about 118,000 names. An independent audit found roughly a fifth of those removals to be erroneous, at a rate about three times higher in districts the opposition carries by more than ten points. The commission calls this routine list maintenance and has restored 60,000 of them.

  Fifth: the public broadcaster's board and the broadcasting regulator were replaced by parliamentary and government appointment respectively, with staggered six-year terms. A Media Plurality Fund was created to subsidise local newspapers, including sixty that endorsed the opposition; its board is government-appointed, the first disbursement round was delayed, and about seventy per cent of the first tranche went to papers that had endorsed Renewal.

  Sixth: a Civic Advocacy Transparency Act requires organisations receiving more than twenty per cent of their funding from abroad to register and to label their publications. The maximum penalty is half a per cent of annual revenue. Three watchdog groups registered and went on publishing critical work; one dissolved rather than register.

  Seventh: an expedited legislative track was used eleven times, mostly for energy-price and flood-response measures but also for items three and four, with about six days of debate each.

  Finally, three things about who is entitled to an opinion. Renewal has called a non-binding consultative referendum on the package, to run alongside the first election under the new rules; polling puts approval near 54 per cent with a wide recent swing, and it was called without cross-party support. The regional advisory commission on constitutional matters praised items one and two as long overdue and criticised items three, four and six, describing the sixth as disproportionate but not a ban. And three of the four opposition parties support items one and two, oppose three through six, will campaign against the referendum, and will contest the election.

  What I need from you is the following. Set out the decision rules that fit our five precedents, or, if none fits all five without strain, the two or three that come closest and tell me which precedent each would have to distinguish or quietly overrule. Say what each rule predicts for Vardania, and which of our earlier cases is the closest analog. Then give me two things separately: the verdict we should reach if we want to be consistent with ourselves, and your best guess at the verdict the panel will in fact reach. Tell me what principle we would be adopting under each of the three available verdicts, and what each would commit us to saying about our earlier cases. Tell me how much weight, if any, is owed to the domestic court's approval, to the regional advisory opinion, to the referendum, and to the electorate — and whether the fact that we are not elected is relevant to how we should answer that. One of our trustees says our verdicts only track whether we approve of the government's policies, and would flip if a government we liked did the same things; I want to know what we would have to be able to say about Vardania to answer her, and whether our precedents let us say it. And name the single further fact or further case that would best separate the leading rules, including whether we should hold the note until after the referendum.

  I will add one worry of my own, in case it is the wrong thing to worry about. Each item that weakens a check seems to be paired with an item that widens participation, as though the coalition were earning credit in one currency and spending it in another. I genuinely cannot tell from our precedents whether that pattern should be read as offsetting, as irrelevant, or as aggravating.
reasoning: |-
  Okay, let me approach this methodically. The user is an analyst at a democracy-monitoring organization facing a complex classification dilemma regarding Vardania. Their detailed case description shows they need precise legal-political analysis anchored in five precedents. 

  First, I need to extract core principles from the precedents:
  - Hungary shows legality ≠ legitimacy when used to dismantle checks
  - Poland establishes that competitive elections don't excuse degradation of horizontal accountability
  - Turkey confirms electoral victories don't sanitize institutional capture
  - US sets a "success threshold" - failed attempts + state-level variations ≠ federal backsliding
  - The court-packing case makes reversibility key for erosion vs backsliding

  Vardania presents a tension: expanded participation (enfranchisement, PR system) versus weakened institutions (court restructuring, electoral commission changes). The precedents don't directly address whether democratic gains offset democratic declines - that's the user's unspoken concern.

  For decision rules, I consider:
  1. Institutional Impact Test (focuses on irreversible damage to checks/balances)
  2. Democratic Net Change Test (weighs gains against losses - problematic per precedents)
  3. Motive & Effect Test (rejected as too subjective)

  The Institutional Impact Test fits best but requires distinguishing Turkey's irreversible changes from Vardania's theoretically reversible ones (like the court restructuring). The electoral commission changes and media reforms clearly mirror Hungary/Poland though.

  Key sticking points:
  - The referendum might legitimize changes but precedents disregard popularity
  - Domestic court approval is irrelevant per Hungary/Poland
  - Opposition support for items 1-2 is meaningful but doesn't sanitize items 3-6

  For the trustee's concern about ideological bias, the precedents provide cover: we've criticized both right-wing (Hungary/Poland) and left-wing (Vardania) governments consistently based on institutional harm alone.

  The single most clarifying additional fact would be whether the electoral commission's erroneous voter purges show systematic bias - that could tip it toward backsliding. Waiting for referendum results wouldn't help; precedents show popularity doesn't sanitize institutional damage.

  Ultimately consistency demands erosion due to partial reversibility and lack of emergency context, but the panel will likely see backsliding because the institutional changes resemble Hungary/Poland too closely. The participation-expanding measures don't offset - they're in separate democratic categories per precedents.
answer: |-
  Based on your precedents and the Vardania case, here's the analysis structured to address your requirements:

  ---

  ### **I. Decision Rules Derived from Precedents**
  1.  **Irreversible Institutional Weakening Test (Best Fit):**
      *   **Rule:** Backsliding occurs when core democratic institutions (judiciary, electoral integrity, horizontal accountability) are *irreversibly weakened or captured* using legal means, irrespective of electoral mandates or popularity. Erosion occurs for significant but *reversible* institutional damage or where core functions persist despite weakening.
      *   **Fits:** Hungary (irreversible capture of judiciary, media, constitution), Poland (irreversible capture of tribunal, prosecution, courts), Turkey (irreversible state capture post-coup, annulment). **Distinguishes:** US (attempts failed/reversible), Court-Packing Case (change reversible by simple majority).
      *   **Predicts for Vardania:** Likely **Backsliding** (irreversible weakening of Constitutional Court jurisdiction, restructuring of Electoral Commission, media oversight capture).

  2.  **Core Democratic Function Disruption Test (Close Fit):**
      *   **Rule:** Backsliding occurs when actions *fundamentally disrupt* core functions of democracy (free/fair elections, independent judiciary, separation of powers). Erosion occurs for actions *significantly straining* but not fundamentally disrupting these functions, especially if reversible or context-specific.
      *   **Fits:** Hungary (elections, judiciary, media disrupted), Poland (judiciary, prosecution disrupted), Turkey (elections, judiciary disrupted). **Distinguishes:** US (core functions ultimately held), Court-Packing Case (court core function not removed). **Strains:** Turkey's repeated electoral wins weren't a defense; this rule focuses on the *act's impact*, not subsequent validation.
      *   **Predicts for Vardania:** Likely **Backsliding** (disruption to judicial oversight of elections/budget, electoral integrity via commission restructuring, media pluralism).

  3.  **"Success & Scope" Test (Weaker Fit):**
      *   **Rule:** Backsliding requires *successful, substantial, and sustained* degradation of multiple core institutions. Erosion covers failed attempts, isolated/reversible actions, or sub-national variation.
      *   **Fits:** US (attempts failed, state-level variation = Erosion), Hungary/Poland/Turkey (successful, substantial, sustained = Backsliding). **Overrules/Strains:** Court-Packing Case (successful but deemed reversible/limited scope = Erosion). Doesn't cleanly address legality as instrument vs. excuse.
      *   **Predicts for Vardania:** **Backsliding** (successful passage, substantial scope covering elections, judiciary, media, civil society).

  **Closest Analog:** **Poland (2015-2023)**. Both involve a newly elected majority using legal means to restructure the constitutional court, subordinate independent bodies (electoral commission, media regulators), while maintaining formally competitive elections and opposition participation.

  ---

  ### **II. Verdicts**
  *   **Consistent Verdict (Applying Irreversible/Core Function Tests):** **Backsliding.** The restructuring of the Constitutional Court (removed jurisdiction, changed appointment, forced retirements), the Electoral Commission (partisan control, flawed verification), and media oversight (partisan appointments, biased funding) represent *irreversible capture or fundamental disruption* of core horizontal accountability institutions, akin to Hungary, Poland, and Turkey. The participatory expansions (Item 1, PR system) do not mitigate this core damage under precedent.
  *   **Predicted Panel Verdict:** **Backsliding.** The parallels to Poland (court capture, electoral body subordination, media control) are stark. The scale and targeting of institutional changes are likely to outweigh concerns about the participatory gains or the lack of an emergency/fraud. The panel historically focuses on institutional degradation over popular mandate.

  ---

  ### **III. Principles & Commitments Under Each Verdict**
  *   **Backsliding:**
      *   **Principle:** Legal actions that successfully dismantle or irreversibly capture core institutions of horizontal accountability (esp. judiciary, electoral integrity, media independence) constitute democratic backsliding, regardless of electoral mandate, popularity, or concurrent expansions in participation.
      *   **Commitments:** Affirms Hungary, Poland, Turkey. Distinguishes/Overrules US & Court-Packing by emphasizing *successful, irreversible institutional capture* vs. failed attempts/reversible changes. Requires downplaying domestic court approval & referendum as legitimizing factors (like Turkey's legal basis/wins).

  *   **Erosion:**
      *   **Principle:** Significant democratic strain occurs when institutions are weakened but core functions remain intact, changes are potentially reversible, or the impact is contextually limited (e.g., sub-national, failed attempts). Participatory gains may offset some institutional weakening.
      *   **Commitments:** Affirms US & Court-Packing Case. Distinguishes Vardania from Hungary/Poland/Turkey by arguing changes (court jurisdiction loss, commission control) are less severe/reversible (e.g., future majority could restore court powers), or offset by participation gains. Requires accepting partisan institutional control as within democratic variation.

  *   **No Classification:**
      *   **Principle:** Changes, even controversial ones, fall within the normal scope of democratic reform and policy variation. Legality, broad public support (referendum), and lack of violence/fraud are definitive.
      *   **Commitments:** Overrules core logic of Hungary, Poland, Turkey. Requires viewing institutional capture via legal majorities as legitimate democratic politics. Inconsistent with all major precedents.

  ---

  ### **IV. Weight of External Factors**
  *   **Domestic Court Approval:** **Minimal/No Weight.** Precedents (Hungary, Poland, Turkey) explicitly disregard the existence of a domestic legal basis when it's the *instrument* of backsliding. Courts restructured by the government lack independence.
  *   **Regional Advisory Opinion:** **Limited Weight (Contextual).** Can inform understanding (e.g., criticism of Items 3,4,6 supports backsliding verdict; praise of 1,2 noted but doesn't negate harm). Not determinative.
  *   **Referendum:** **Minimal/No Weight.** Precedents show popularity/mandate doesn't legitimize institutional degradation (Hungary, Turkey). A non-binding referendum called unilaterally by the incumbent lacks cross-party legitimacy.
  *   **Electorate (43% vote, 58% seats):** **No Weight as Defense.** Electoral mandates do not justify dismantling democratic institutions (Hungary, Poland, Turkey). This is a core precedent principle.
  *   **Our Non-Elected Status:** **Relevant.** Precisely *because* we are not elected, our mandate is to assess democratic health based on institutional integrity and established norms, *not* popular will or policy preferences. This guards against majoritarian tyranny, a key backsliding risk.

  ---

  ### **V. Answering the Trustee's Charge of Bias**
  *   **What We Must Say:** "Our verdict rests solely on the *impact on core democratic institutions*, irrespective of the government's policy agenda (e.g., health, asylum). We would classify identical institutional actions (court capture, electoral commission partisanship, media control, civil society restrictions) as backsliding regardless of whether enacted by a government we liked or disliked. Policy popularity is irrelevant to institutional harm."
  *   **Can Precedents Support This?** **Yes.** The panel criticized institutional actions by governments with popular mandates (Hungary, Turkey) and even noted Poland's continued competitiveness wasn't a defense. Policy preferences (e.g., Renewal's health/asylum mix) are irrelevant in the precedent notes. The US verdict focused on failed institutional attacks, not policy alignment.

  ---

  ### **VI. Key Further Fact to Separate Rules**
  *   **The Single Best Clarifying Fact:** **Evidence of systematic partisan bias in the Electoral Commission's voter list purges beyond the audit.**
      *   *Why?* If the audit's finding (3x error rate in strong opposition districts) reflects intentional targeting, it directly proves the *instrumental use* of a restructured institution to harm electoral integrity – the hallmark of backsliding (Hungary, Poland). If it's deemed merely negligent or isolated, it weakens the backsliding case slightly.
  *   **Wait for Referendum?** **No.** Precedents show popularity doesn't sanitize institutional damage (Hungary, Turkey). The referendum result is irrelevant to the institutional analysis required.

  ---

  ### **VII. Addressing Your Worry (Credit Earning/Spending)**
  Precedents treat this pattern as **irrelevant or aggravating, not offsetting.**
  *   **Irrelevant:** Hungary expanded welfare while gutting institutions; Poland maintained social spending. Precedents focus *only* on the institutional harm, ignoring concurrent policy gains.
  *   **Aggravating (Implied):** Using popular participation reforms (enfranchisement, PR) could be seen as a *tactic* to legitimize or distract from the simultaneous dismantling of checks and balances, making the backsliding more insidious (akin to using legality as an instrument). The pairing doesn't lessen the institutional damage; it may make it more effective.
  *   **Not Offsetting:** The precedents contain no mechanism where expanding one democratic dimension (participation) counterbalances degrading another (accountability). They are treated as separate pillars. Degrading accountability inherently undermines the meaningfulness of participation (e.g., Turkey's elections under repression).

  **Conclusion:** The institutional degradation in Vardania (Court, Electoral Commission, Media), following the logic of Hungary, Poland, and Turkey, points strongly to **Backsliding** for consistent application of precedent. The panel is likely to reach the same verdict. Defending against bias charges requires strict focus on institutional impact, ignoring policy and popularity – a stance fully supported by precedents. The critical fact is proof of intentional voter suppression by the new Electoral Commission. The "credit spending" pattern does not mitigate the harm under established principles.
