  We are writing a parody of a journal's "Instructions for Authors" from the fictional "Journal of Grounded Explanation". The document is issued by the Committee on Explanatory Grounding, which is humorless and sincere. The key concepts are cranes (good, built from below) and skyhooks (bad, borrowed from above). The committee is against skyhooks but their own procedures lead to greedy reductionism (skipping levels). We must invent at least two institutional apparatuses and include three worked abstracts (animal navigation, human concept learning, speculative bubbles) showing before and after compliance, with the after versions losing the original explanatory target. The document must end with the committee's grounding chain bottoming out without them noticing the skyhook.

  We'll structure the document as follows:

  1. **Header and Introduction**: The Journal of Grounded Explanation, Committee on Explanatory Grounding. State the mission: to ensure explanations are properly grounded, avoiding skyhooks.

  2. **Key Definitions and Rules**:
     - Define crane and skyhook (without using the terms as jargon, but explaining the concepts in their own words).
     - Define greedy reductionism (again, in their terms).
     - The Grounding Chain requirement: every explanation must show the chain of mechanisms, each resting on the one below. No terminal nodes of certain forbidden concepts (emergence, self-organization, representation, norm, agent). Also, no explainer may have the same kind of capacity as what it explains (to avoid circularity or skyhooks).

  3. **Institutional Apparatus**:
     - **Registry of Approved Bedrock Levels**: A list of levels (e.g., quantum, molecular, cellular, etc.) that are deemed acceptable as terminal nodes. Only these can be used without further decomposition.
     - **Disclosure Form for Unexplained Explainers**: Any mechanism that is invoked but not itself grounded must be disclosed on a form (which will lead to rejection unless it is in the registry).
     - **Certificate of Provisionally Grounded Status**: When a chain is too long to show (exceeds page limit), the author can apply for this certificate, provided they show that the chain goes down to an approved bedrock level and they have a plan to fill the gaps (but the gaps remain).

  4. **Worked Abstracts**:
     - Provide three examples (animal navigation, human concept learning, speculative bubbles). For each, show the original abstract (non-compliant) and the revised (compliant) version. The compliant version should technically follow the rules but lose the original phenomenon.

  5. **Closing with the Committee's Grounding Chain**:
     - The committee states that their own rules are grounded in the Registry of Approved Bedrock Levels. But then, they must explain how the registry itself is grounded. They might say it is based on consensus of the committee, but then the committee's consensus becomes a skyhook (because it is an unexplained explainer). They don't notice.

  We write in a deadpan, bureaucratic style.

  Let's write the document accordingly.
answer: |-
  ### INSTRUCTIONS FOR AUTHORS  
  *Journal of Grounded Explanation*  
  Issued by the Committee on Explanatory Grounding  
  Effective 1 October 2023  

  **I. MISSION**  
  The *Journal of Grounded Explanation* (JGE) exists to publish only those scientific accounts that rigorously avoid explanatory collapse. An explanation collapses when it invokes an entity or process whose own causal capacity is either (a) identical in kind to the phenomenon it purports to explain, or (b) unmoored from mechanisms operating at a lower stratum of organization. The former constitutes *explanatory circularity*; the latter constitutes an *unlicensed suspension*. Both errors produce accounts that merely gesture at understanding. To preempt such failures, all submissions must adhere to the Grounding Chain Protocol (GCP), detailed herein.  

  **II. GROUNDING CHAIN PROTOCOL (GCP)**  
  1. **Chain Structure**:  
     - Every explanation must decompose the target phenomenon *P* into a sequence of mechanisms *M₁ → M₂ → ... → Mₙ*, where:  
       - *M₁* directly enables *P*;  
       - Each *Mᵢ* is enabled by *Mᵢ₊₁*;  
       - No *Mᵢ* exhibits causal capacities isomorphic to *P* (e.g., "intentionality" cannot explain intentionality).  
     - Chains must terminate in a *Bedrock Mechanism* (BM) listed in the JGE Registry of Approved Bedrock Levels (Reg. No. 04-1987).  

  2. **Forbidden Terminal Nodes**:  
     The following must not appear as terminal *Mₙ* in any chain:  
     - Emergent properties  
     - Self-organizing dynamics  
     - Representational states  
     - Normative constraints  
     - Agentic intentions  
     *(Rationale: These constitute suspended explanations—mechanisms "borrowed from above" rather than built from below.)*  

  3. **Greedy Reductionism Clause**:  
     Skipping strata (e.g., linking *P* directly to *Mₙ* without intermediate *Mᵢ*) is prohibited. Each step must be mechanistically explicit.  

  **III. INSTITUTIONAL APPARTUS**  
  1. **Registry of Approved Bedrock Levels (RABL)**:  
     - BMs are fixed strata deemed irreducible by Committee consensus (e.g., biochemical pathways, Newtonian mechanics, electrochemical gradients).  
     - Current BMs: Quantum fields (Level 0); Atomic interactions (Level 1); Molecular kinetics (Level 2); Cellular processes (Level 3).  
     - Proposals to amend RABL require peer-reviewed evidence that the new BM is *terminal* (i.e., no substratum exists).  

  2. **Unexplained Explainer Disclosure Form (UEDF)**:  
     - If a mechanism *Mᵢ* lacks a known substratum, authors must file UEDF-9, declaring:  
       - The explanatory gap;  
       - Why *Mᵢ* is not a *de facto* suspension;  
       - A research program to ground *Mᵢ*.  
     - *Note: UEDF-9 submission does not guarantee acceptance.*  

  **IV. COMPLIANCE EXAMPLES**  
  *Abstracts below illustrate pre- and post-GCP adherence. Non-compliant terminals are bolded.*  

  1. **Animal Navigation (Orientation Ecology)**  
     - *Original*: "Monarch butterflies navigate using a **sun-compass mechanism** integrated with **innate spatial maps**."  
       - *Defect*: "Innate spatial maps" are unexplained representational terminals.  
     - *Compliant*: "Monarch navigation derives from cryptochrome proteins in retinal cells. Photon-induced electron transfers modulate redox states, altering neuronal firing patterns in the central complex (BM: Molecular kinetics, Level 2)."  
       - *JGE Note*: Explains phototaxis; navigation is not claimed.  

  2. **Human Concept Learning (Cognitive Science)**  
     - *Original*: "Children acquire concepts via **Bayesian inference**, updating priors through **predictive error minimization**."  
       - *Defect*: "Bayesian inference" is agent-level suspension; "error minimization" is normative.  
     - *Compliant*: "Concept learning reduces to spike-timing-dependent plasticity in neural networks. Dopamine release (via VTA activation by sensory inputs) potentiates glutamate receptors, strengthening co-activated synapses (BM: Cellular processes, Level 3)."  
       - *JGE Note*: Explains synaptic change; "learning" is deprecated.  

  3. **Speculative Bubbles (Behavioral Economics)**  
     - *Original*: "Bubbles arise from **collective irrationality** fueled by **herd behavior** and **overconfidence**."  
       - *Defect*: All bolded terms are emergent or agential suspensions.  
     - *Compliant*: "Asset-price surges correlate with lateral hypothalamic activation in traders. Neuroimaging shows AMPA receptor upregulation in response to monetary rewards, increasing risk-seeking motor outputs (BM: Cellular processes, Level 3)."  
       - *JGE Note*: Explains neural firing; "bubbles" are not modeled.  

  **V. SUBMISSION PROCEDURE**  
  1. Append a Grounding Chain Schematic to all manuscripts, with *P* and each *Mᵢ* mapped to RABL levels.  
  2. If the full chain exceeds page limits, apply for a *Certificate of Provisional Grounding* (CPG) by demonstrating:  
     - The chain’s endpoint is a current BM;  
     - All gaps are bridgeable via known mechanisms.  
  3. Manuscripts invoking non-BM terminals must include a completed UEDF-9.  

  **VI. COMMITTEE GROUNDING STATEMENT**  
  The GCP is itself grounded in the RABL framework, whose BMs derive from empirical consensus. This consensus is validated by reproducibility across observational protocols, which operate at the atomic (Level 1) and molecular (Level 2) strata. The Committee’s authority to designate BMs flows from its adherence to these bedrock principles, ensuring no explanatory suspension contaminates JGE’s epistemological foundation.  

  ---  
  *Committee on Explanatory Grounding*  
  *Journal of Grounded Explanation*  
  *"Nihil explicatum nisi ex profundis"*
