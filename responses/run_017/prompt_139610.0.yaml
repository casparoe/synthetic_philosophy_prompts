answer: |-
  Based solely on the quoted passage and your defined case, here's a step-by-step reconstruction of Edgeworth's argument and its application:

  **Step-by-Step Reconstruction of Edgeworth's Argument:**

  1.  **Premise (Capacity Difference):** Sentients differ in their "Capacity for happiness." This means:
      *   *Parsing "Capacity for happiness":* It refers to the **differential ability to derive net pleasure (happiness minus pain) from identical external circumstances.** The examples clarify this:
          *   "Pleasure (e.g., of imagination and sympathy)" suggests some classes derive *more positive utility* from the same circumstance due to inherent traits.
          *   "Pain (e.g., of fatigue)" suggests some classes derive *more negative utility (or less positive utility)* from the same circumstance due to inherent traits.
      *   *Nature of "Capacity":* It acts as an **intrinsic modifier on the hedonic impact of external circumstances.** A sentient with higher capacity gets *more net pleasure* from a given circumstance than a sentient with lower capacity.

  2.  **Premise (Felicity Maximization Goal):** The goal is the "most felicific arrangement" – maximizing the total sum of felicity (pleasure minus pain).

  3.  **Implication for Equality:** If all sentients had *identical* Capacity for happiness:
      *   Each unit of resources/circumstances would contribute the *same* amount of net pleasure regardless of who received it.
      *   Therefore, distributing circumstances equally would maximize the total sum of pleasure (assuming diminishing marginal utility, though Edgeworth doesn't explicitly invoke it here, it's often implicit in such arguments).

  4.  **Edgeworth's Core Claim:** Because sentients differ in Capacity (Premise 1), **there is no longer a presumption that equal distribution maximizes total felicity (Premise 2).**
      *   **Why?** If Class A has a higher Capacity than Class B, then giving an additional unit of circumstance to Class A *might* generate *more* additional net pleasure than giving it to Class B. Unequal distribution favoring the high-capacity class *could* yield a higher total sum.
      *   **The Posterity Caveat:** This potential argument for inequality is *strengthened* if high-capacity sentients are also more productive or capable of generating greater future welfare ("interests of posterity").

  5.  **What Would Be Required for Equality to be Presumed Felicific:** Equality would only be presumed the best arrangement if either:
      *   **a)** All sentients have *identical* Capacity for happiness, *or*
      *   **b)** The differences in Capacity are *exactly counterbalanced* by other factors (like the specific nature of utility functions or interdependencies) such that the *marginal felicity* gained from an additional unit of circumstance is *equal* for all sentients at the point of equal distribution. Edgeworth argues condition (a) is unlikely, and condition (b) cannot be presumed.

  **Application to the Asymmetric-Fatigue Case:**

  1.  **Capacity Difference is Present:** Alphas have twice the hedonic capacity of Betas. For any given circumstance:
      *   If it yields a Beta `n` utils of pleasure, an Alpha gets `2n` utils.
      *   If it yields a Beta `n` utils of pain, an Alpha suffers `2n` utils.
      *   *This directly satisfies Edgeworth's premise of differing Capacity.*

  2.  **Sympathetic Fatigue Creates Interdependence:** Alphas suffer pain (0.1 utils per unit) when they perceive *another* sentient experiencing pleasure. This means the utility (pleasure) experienced by one sentient *directly affects* the utility (pain) of another (specifically, Alphas perceiving pleasure in others). This is an *interdependence* or *externality* in utility functions.

  3.  **Why Edgeworth's Claim Applies (No Presumption for Equality):**
      *   The pure Capacity difference (Alphas 2x) alone, *without sympathetic fatigue*, would suggest giving more circumstances to Alphas might maximize total utility. They get more utils per unit of circumstance. Equality is not presumptively best.
      *   The sympathetic fatigue *complicates but does not negate* this lack of presumption. It introduces a reason why giving pleasure to Betas *might* be costly (if it causes pain to observing Alphas). However, it *does not* create a new reason to presume equality is best. It simply adds another factor making the optimal distribution depend on the specific circumstances being distributed and the level of observation/interaction.
      *   Crucially, **neither** the pure capacity difference **nor** the sympathetic fatigue provides a reason to believe that the *marginal felicity* derived from an additional unit of circumstance will be *equal* for Alphas and Betas at the point of equal distribution. The capacity difference pushes Alphas' marginal felicity higher for positive circumstances, while the sympathetic fatigue might reduce the *net* marginal felicity gain from giving a circumstance to a Beta (due to the pain inflicted on observing Alphas). The balance depends entirely on the specifics.

  4.  **Interpersonal Comparison Required and its (In)determinacy in the Case:**
      *   **Required Comparison:** Edgeworth requires **interpersonal comparison of utility levels and marginal utilities.** We need to be able to say:
          1.  How much utility (pleasure-pain) an Alpha derives from a circumstance *compared* to a Beta (Level Comparison).
          2.  How the *change* in total utility (considering *all* effects, including sympathetic fatigue) changes when a circumstance is taken from one group and given to the other (Marginal Utility Comparison).
      *   **Satisfaction/Indeterminacy in the Case:** Your case **explicitly satisfies** the requirement for Level Comparison via the stipulated multipliers: 2x for Alphas on circumstance effects, 0.1x sympathetic pain for Alphas perceiving Beta pleasure. We *can* numerically compare utils between Alphas and Betas based on these rules.
      *   However, the **optimal distribution is *not* indeterminate *because* of the comparison;** it's indeterminate because the sympathetic fatigue introduces an externality that makes the *net* marginal utility of giving a circumstance to a Beta *depend on how many Alphas are observing and how much pleasure the Beta derives*. The comparison *itself* is well-defined numerically by your stipulations. The indeterminacy (or rather, the context-dependence) arises from the *interaction effect* specified in the case (the sympathetic fatigue externality). Edgeworth's point is that *even with comparable utils*, the differing capacity (and now the externality) means we cannot *presume* equality is optimal without calculating the specific net effects.

  **Conclusion for the Asymmetric-Fatigue Case:**

  *   Edgeworth's core claim **absolutely applies**. There is **no presumption that equality of circumstances is the most felicific arrangement**.
  *   The **pure difference in Capacity (2x for Alphas)** alone removes this presumption, suggesting Alphas might deserve more resources to maximize total utils.
  *   The **sympathetic fatigue** adds a layer of complexity but does *not* restore a presumption for equality. Instead, it might sometimes create an argument for giving *less* to Betas (to avoid Alpha pain) or necessitate a complex calculation involving the degree of observation.
  *   **Interpersonal comparison** is **satisfied numerically** by your stipulations (2x multiplier, 0.1x sympathetic pain). We *can* compare Alpha utils and Beta utils.
  *   The need for calculation, rather than a simple rule of equality, stems from the **interaction** between the differing capacity and the utility interdependence (sympathetic fatigue), both specified in the case. The passage requires precisely this type of comparison to determine the optimal, potentially unequal, distribution.
