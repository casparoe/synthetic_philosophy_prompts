prompt: |-
  I've gotten myself into the position of defending this at a reading group next week — I'm the econ person, not the decision theory person, so please don't assume I know the jargon and spell out what a defender of it would actually say back. The view I've ended up with is that you don't need functional decision theory, or superrationality, or any my-decision-and-the-other-guy's-decision-are-outputs-of-the-same-algorithm machinery to get cooperation in a one-shot Prisoner's Dilemma between total strangers; all you need is a big enough world. The argument as I'd give it: in a sufficiently large world there are lots of agents sitting in structurally identical decision situations, with no communication, no predictor, no one being simulated, no sci-fi copies of anybody — just many agents facing the same payoff matrix from roughly the same epistemic position. Still, what I decide is evidence about what they decide, because similar situations plus similar reasoning tend to produce similar choices, and in a big world even a modest correlation gets multiplied: if I cooperate, that's evidence that some large number of other agents cooperate too, and the aggregate payoff across all those cooperators can swamp my individual cost of cooperating. So an evidential decision theorist run in a large world starts behaving like a functional decision theorist, and the acausal machinery was never doing the real work. Someone in the group called this evidential cooperation in large worlds, no idea if that's a real label for it.

  What I want is an honest map of how exposed this is — what would have to be true for it to fail, and what would count against it rather than just being inconvenient. Rank the defeaters from fatal to merely awkward, and for each one tell me whether it's live or merely logically possible. Here are the ones I can half-see, but I'm sure I'm missing the good ones: (a) the correlation assumption looks like a substantive empirical claim about how similarity is distributed in the actual world, not a theorem — in a large but heterogenous world the evidential mass might be dominated by distant, only-loosely-analogous agents whose choices my own choice barely tracks, and then largeness alone buys nothing; (b) noise: if any agent has some small chance of implementing the wrong action, then in a huge world a huge number of agents do, and I want to know whether the arithmetic still comes out in favour of cooperating or whether the tremble term eats the whole effect; (c) I'm not obviously a random sample from the set of agents similar to me — there might be a selection effect where the agents who find themselves deliberating about this exact question are systematically the weird ones; (d) my friend's objection that similar reasoning produces similar choices is just the FDT claim about algorithmic similarity smuggled in under a probabilistic name, i.e. that this is functional decision theory in a trenchcoat; (e) uncertainty about which subpopulation I'm in, if the large world is partitioned into groups with different correlation structures; (f) something self-referential that I can't quite formulate, where my choosing to cooperate is also evidence about how strongly correlated I am with others, so the correlation estimate and the action are mutually dependent and might not have a stable fixed point; (g) the manage-the-news style worry that in a big world the payoff to just making myself believe the cheerful thing, or delegating the decision, or publicly pre-committing before I've thought about it, becomes huge.

  Tell me which of these a committed defender would concede as counting against the view and which they'd dismiss as missing the point, and add the ones I haven't thought of. Two more things specifically: first, does the view make any prediction its rivals don't — I think it implies cooperation should be sensitive to how many relevantly-similar agents there are, so that in a small world the same agent should defect, and I can't tell whether that's a feature or a reductio; and second, is there a version of the move where the defender retreats to the limit of infinitely many exact duplicates, and does that retreat insulate the claim so thoroughly that it stops being an answer to the practical question it was supposed to answer — and if so, is that a problem for a view of this kind or just the normal fate of limit results? I'd personally be most moved by objections that work against the realistic, non-adversarial versions of the correlation assumption, and least moved by the standard medical-Newcomb-style jabs at evidential decision theory in general, since those feel like they're aimed at a different target.
reasoning: |-
  Okay, let me try to unpack this user's query. They're defending a view called "evidential cooperation in large worlds" (ECLW) in a reading group. The core idea is that in a large world with many agents in similar situations, cooperating in a one-shot Prisoner's Dilemma can be rational for an evidential decision theorist because their choice correlates with others, amplifying the benefits. They want to know the vulnerabilities of this position.

  First, I need to understand their main argument. They're saying that without any predictors, simulations, or sci-fi elements, just having many agents in identical situations creates enough correlation that your decision provides evidence about others. This evidence makes cooperation payoff-positive when scaled up. 

  Looking at their listed defeaters, I should rank them from fatal to awkward. Starting with (d): the friend's objection that this is just FDT in disguise. That could be a serious challenge. If correlation requires algorithmic similarity, then ECLW isn't a real alternative to functional decision theories. The defender might counter that weak, empirical correlations are sufficient, but that leads to (a) - the empirical claim about similarity distributions. In a heterogeneous world, correlations might be too weak. That feels live and possibly fatal if unsupported.

  Noise (b) is another big one. If trembles scale with population size, they could dominate the expected payoff. The defender would need to show that correlation strength outpaces noise, which isn't guaranteed. This seems practically problematic but maybe not theoretically fatal.

  Selection effects (c) and group uncertainty (e) are more situational. If the user is in a weird subpopulation, correlations break. But defenders might say typicality assumptions handle this. Still, in practice, it's messy.

  Self-referential issues (f) about estimating correlation while deciding could lead to instability. That's a deep problem, possibly undermining the whole calculation. Manage-the-news (g) seems like a separate EDT issue, not specific to ECLW.

  The user also asks about predictions. ECLW predicts cooperation scales with population size, which might seem counterintuitive (defect in small worlds). Defenders could frame small worlds as edge cases, but it's awkward. The infinite duplicates retreat makes the math work but feels impractical, which might defeat the purpose.

  The user prioritizes realistic objections over theoretical ones. So, empirical correlation and noise are the most pressing. They might need to concede that ECLW requires plausible similarity conditions in the real world, which isn't guaranteed. If the reading group accepts that, it could survive as a possible rationale, but it's not a universal solution.
answer: |-
  Here's a brutally honest vulnerability assessment of your "Evidential Cooperation in Large Worlds" (ECLW) position, ranked by severity and annotated for realism. A committed defender would engage with these seriously, conceding some points as genuine challenges while deflecting others. Let's break it down:

  ### Fatal or Near-Fatal Defeaters (Live & Damaging)
  1.  **(a) The Heterogeneity Problem (Empirical Correlation Claim):**
      *   **Why it's fatal:** This is the core Achilles' heel. ECLW *entirely* depends on the empirical claim that "similar situations + similar reasoning → reliably correlated choices" *in the actual world*. This is *not* guaranteed by largeness alone. In a large, complex world:
          *   Agents have vastly different priors, cognitive biases, cultural conditioning, moral frameworks, and even random noise in decision-making.
          *   "Structurally identical" payoffs hide immense psychological differences. What looks like PD to you might be perceived as a coordination game or a trust test by someone else.
          *   The "epistemically similar" set might be vanishingly small compared to the vast sea of agents facing *superficially* similar PD matrices but whose reasoning processes are orthogonal to yours.
      *   **Defender's Response (Weak):** They *must* concede this is empirical. Their best counter is: "While perfect correlation is unrealistic, *some non-zero correlation* is plausible for agents in sufficiently similar circumstances facing identical payoff structures described identically. Largeness amplifies *any* non-zero correlation." This shifts the burden to showing the correlation is *strong enough* in realistic scenarios, which is highly debatable.
      *   **Status:** **Live & Potentially Fatal.** This is the main battleground. Your reading group *will* attack here. If the correlation is weak or localized, largeness does nothing or even backfires (if your correlation group is small but the defectors are legion).

  2.  **(d) "FDT in a Trenchcoat" (Conceptual Smuggle):**
      *   **Why it's fatal:** Your friend has a sharp point. The claim "similar reasoning → similar choices" *is* functionally equivalent to assuming *algorithmic similarity*. ECLW tries to achieve FDT-like cooperation *without* the explicit commitment to identical source code or simulation. But if the correlation relies on agents *actually reasoning similarly*, you've implicitly smuggled in a weaker form of the "same algorithm" assumption under the guise of probabilistic evidence. The "evidence" *is* the algorithmic similarity manifesting.
      *   **Defender's Response (Nuanced Retreat):** "The distinction *is* meaningful! FDT requires a strong, counterfactual notion of *being the same algorithm*. ECLW only requires a weaker, *evidential* correlation arising from *empirical* psychological similarity in reasoning tendencies. It's about *observed patterns of behavior* in similar minds, not counterfactual dependence on shared code. This works even if no two agents share identical source code, just overlapping decision heuristics." This defends it as distinct but concedes the dependence on cognitive similarity.
      *   **Status:** **Live & Serious.** If the group buys that "similar reasoning = algorithmic similarity," ECLW collapses into a probabilistic version of FDT/CDT-sib. If they accept the "weaker empirical correlation" distinction, it survives as a novel argument. Be prepared to argue the difference fiercely.

  3.  **(f) Self-Referential Correlation Estimation (Bootstrapping Problem):**
      *   **Why it's fatal:** Your choice (C/D) is evidence about what *others like you* do. But "others like you" is defined partly by *how they reason*, and your *own reasoning process* is determining your choice *and* your estimate of the correlation strength. This creates a feedback loop:
          *   My estimate of correlation (ρ) depends on what I think "similar reasoners" do.
          *   What "similar reasoners" do is evidenced by my choice (via ρ).
          *   My choice depends on ρ and the expected payoff based on the actions of others (which depends on ρ...).
      *   This isn't guaranteed to have a unique or stable solution. Your calculation of "Should I C?" relies on ρ, but ρ depends on the outcome of that very calculation across the population. It risks circularity or inconsistency.
      *   **Defender's Response (Hand-Wavy):** "Agents form a *prior* estimate of ρ based on general knowledge of human (or agent) psychology and the situation description, *before* plugging it into the decision calculation. The correlation ρ is treated as a fixed parameter estimated externally, not dynamically determined by the decision itself." This feels unstable; sophisticated agents *should* realize their reasoning is part of the evidence.
      *   **Status:** **Logically Possible & Deeply Troubling.** If pressed hard, this reveals a fundamental instability in the ECLW calculation protocol. It's less "live" than (a) or (d) in initial discussions but potentially devastating under scrutiny.

  ### Serious but Manageable Defeaters (Live & Awkward)
  4.  **(b) Noise/Trembling Hands:**
      *   **Why it's serious:** If each agent has an independent probability ε > 0 of "trembling" and taking the wrong action (e.g., intending C but accidentally D-ing, or vice-versa), then in a large population of size N, the *number* of tremblers is ~εN. For large N, this noise dominates the signal. The correlation you observe is swamped by uncorrelated randomness. The expected payoff calculation becomes messy and sensitive to assumptions about the *type* of noise (symmetric? only trembles to D?).
      *   **Defender's Response (Mathematical):** "This *is* a problem, but not fatal. The key is the *signal-to-noise ratio*. If the *correlated* component of choice (due to similar reasoning) has strength σ, and the uncorrelated noise has magnitude ε, the aggregate signal scales with σ√N, while the noise scales with ε√N. Cooperation remains rational if σ > kε (for some constant k depending on payoff magnitudes). Largeness (N) amplifies *both*, but σ needs to be sufficiently larger than ε." They must argue that for realistic reasoning similarities, σ >> ε.
      *   **Status:** **Live & Awkward.** Forces defenders into specific mathematical assumptions about correlation strength vs. noise. Weakens the "obviousness" of cooperation.

  5.  **(e) Subpopulation Uncertainty (The Clustering Problem):**
      *   **Why it's serious:** The large world isn't homogenous. Agents cluster into groups with *different* internal correlation structures. You know you're in *a* large world, but you don't know *which* cluster (high-correlation cooperators? low-correlation defectors?) you belong to. Your own choice is weak evidence about your cluster, but this injects significant uncertainty. If most clusters are low-correlation, cooperation might be irrational *for you* even in a vast world.
      *   **Defender's Response (Typicality):** "Assume you are a *typical* member of the set of agents facing this exact PD description. While clusters exist, the largest cluster (or the cluster most likely to contain a randomly selected agent like you) has sufficiently high correlation to make cooperation rational. We focus on the expectation over possible clusters." This relies on a controversial "typicality" assumption.
      *   **Status:** **Live & Awkward.** Significantly complicates the calculation and introduces another layer of empirical uncertainty (what *are* the cluster distributions?).

  ### Lesser Defeaters (Logically Possible / Dismissible)
  6.  **(c) Selection Effects (Am I Weird?):**
      *   **Why it's lesser:** While possible (e.g., only "weird" agents overthink PDs), this feels contrived without specific mechanisms. Why would agents deliberating *now* be systematically different concerning their *propensity to cooperate* compared to the vast set of past/future similar agents? It seems like special pleading.
      *   **Defender's Response:** Dismiss as unmotivated or requiring an implausible conspiracy of selection pressures. "The burden is on the objector to show why my deliberative state makes me *less* representative concerning the cooperation variable. Absent that, the default is typicality."
      *   **Status:** **Logically Possible, Live-ish but Weak.** Easy to swat down unless given strong evidence.

  7.  **(g) Manage the News / Commitment Tricks:**
      *   **Why it's lesser:** This is a *general* problem for EDT (and sometimes CDT) in high-stakes scenarios, *not specific* to ECLW or the PD. If EDT says "Believing X is rational because it causes good outcomes," it opens the door to belief manipulation. ECLW inherits this issue but doesn't create it anew.
      *   **Defender's Response:** "This is an independent problem for EDT's account of belief and rational choice. It doesn't invalidate the *logic* of the ECLW calculation *given* EDT. We need a separate theory of belief maintenance/rational commitment to handle this, which EDT struggles with but other theories may also." Concedes an EDT weakness but deflects it as not unique to ECLW.
      *   **Status:** **Live Problem for EDT, Not Specific to ECLW.** A valid but tangential criticism.

  ### Your Specific Queries

  1.  **Prediction: Cooperation Scaling with Population Size:**
      *   **Is it a Feature or Reductio?** ECLW defenders *must* embrace this as a **feature**, not a bug. It's the core mechanism! Defecting in a genuinely small world (where your choice provides negligible evidence about others) is the *correct* prediction of ECLW + EDT. The "reductio" feeling comes from the intuition that "rationality shouldn't depend on population size." ECLW defenders bite this bullet: "Rationality depends on the *evidence* your action provides. In small worlds, it provides little evidence about others; in large worlds, it provides significant evidence. Therefore, the rational action differs."
      *   **Objection:** Critics argue this is absurd/impractical – how small is "small"? How do I know N? Defenders reply: "We use our best estimates. The *qualitative* prediction holds: Cooperation becomes *more* rational the larger the estimated population of relevantly similar agents."

  2.  **The Infinite Exact Duplicates Retreat:**
      *   **Does it Insulate?** Absolutely. In the limit of infinite *exact* duplicates (same inputs, same deterministic algorithm), your choice *perfectly* correlates with all others. EDT mandates cooperation, as "I C" implies "All C", leading to the best group outcome, swamping the individual cost. The math is impeccable.
      *   **Does it Stop Being an Answer?** **Yes, profoundly.** This retreat destroys the *practical relevance* of ECLW as an answer to "Why cooperate with a stranger in the real world?" Real agents aren't exact duplicates. The infinite-duplicates scenario is a mathematical toy model, not a realistic justification for real-world cooperation. It shows the *logical possibility* but avoids the messy empirical questions (a, b, e) that dominate the real-world case.
      *   **Is This a Problem?** **Yes, for the *practical ambition* of ECLW.** If ECLW only works for exact duplicates, it fails its original purpose: justifying cooperation between strangers in a large *but diverse* world. Defenders relying on this retreat concede that ECLW requires implausibly strong similarity conditions, effectively making it irrelevant to the real-world PD it was meant to solve. It becomes a curiosity, not a practical decision theory.

  ### The Bottom Line & How to Defend

  *   **Your Greatest Vulnerability:** The **empirical correlation claim (a)**. Be prepared to defend the *plausibility* of non-trivial reasoning correlation among strangers facing identical PD descriptions. Cite psychological studies on consistency in framing effects or moral dilemmas *if* they exist (be cautious!). Emphasize "modest correlation + vast N" as the mechanism.
  *   **Your Core Conceptual Defense:** Distinguish ECLW sharply from FDT **(d)**. Argue FDT relies on *counterfactual algorithmic dependence*, while ECLW relies on *empirical evidential correlation* based on psychological similarity. They *converge* in some predictions but are *fundamentally different mechanisms*.
  *   **Concede:** Noise **(b)** and subpopulations **(e)** are real complications requiring careful calculation. The self-reference problem **(f)** is deep and unsettling. The infinite duplicates limit **(Your Q2)** is mathematically true but practically useless.
  *   **Dismiss:** Selection effects **(c)** as unmotivated. Manage-the-News **(g)** as a general EDT problem.
  *   **Embrace:** Population-size sensitivity as a **prediction and feature**.

  **Defender's Triage:** Argue that ECLW provides a *plausible, non-sci-fi, EDT-compatible* rationale for cooperation in large worlds *if* one accepts a modest degree of reasoning similarity among agents facing identical decision problems. It's not a universal law (neither is FDT!), but a potential explanation for observed cooperation that avoids exotic mechanisms. Its strength is its grounding in standard evidential reasoning and avoidance of metaphysical commitments; its weakness is its dependence on messy empirical realities about human (or agent) psychology and world structure. It's a *candidate* explanation, vulnerable but not refuted, offering a different perspective than FDT. Your best move is to present it as an *interesting alternative hypothesis* worth exploring, not a knockdown argument. Good luck!
