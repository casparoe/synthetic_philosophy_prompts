prompt: |-
  I'm helping put together a problem set for an intro philosophy class that spends a week on Hume's chapter on miracles, and I want one item that's a carefully built case rather than an open essay question. I was arguing with a friend about it last night and we kept going in circles, so I figured I'd just try to get the case written properly.

  Here's the setup I'm working from. On the Bayesian reconstruction of Hume, everything turns on whether the reports we've got are more likely if the violation happened than if it didn't, weighed against how tiny the prior on the violation is to begin with. On Hume's own side there are two rather different things: his maxim, roughly that no testimony establishes a miracle unless the falsehood of that testimony would itself be a bigger marvel than the event it reports; and then the checklist he runs in the second half of the chapter, about whether any marvel has in fact ever been attested by enough witnesses of good sense, education and integrity, in public, with no motive to fool us and no enthusiasm or love of the marvellous doing the work. What I want is a case where the Bayesian comes out *more* skeptical than that checklist, which is the opposite of the direction these discussions usually go: the Bayesian says withhold, because the reports taken together just don't clear the prior, even though the witnesses are as good as Hume's checklist could possibly want. So individually excellent witnesses, quite a lot of them, public event, no hoax and no conspiracy, no religious enthusiasm, nobody with an interest in the marvellous, and — this is the bit my friend thinks is cheating — each witness's reliability independently established, so we know from unrelated work that these people are careful and honest.

  What makes the Bayesian balk has to be that their error channels aren't independent. I've been calling it a calibration-linked witness pool: a shared instrument, or shared training, or a shared inference habit, or a reporting pipeline in which only the striking readings get passed up the chain, or shared perceptual conditions — something structural that makes it far less surprising that they all go wrong together than it would be if their mistakes were unrelated. Two more constraints. First, nobody downstream of the event, us included, gets to observe it directly or re-check the instrument ourselves; the evidence has to stay testimonial all the way through, or it stops being a Hume case at all. Second, pick your law so that the easy out of saying we simply had the law wrong isn't available, and say why it isn't (or if you'd rather make that escape route the interesting part of the case, flag it and deal with it). Give me the scenario in about one paragraph, in a realistic setting — a hospital, a lab, a cockpit, a weather station, a courtroom, whatever, but no sci-fi gadgets. Then show the work: state the claim, the total evidence, the prior on the violation and where that prior comes from, and the two likelihoods; show explicitly that a naive treatment of the witnesses as independent would flip the verdict to believe, and that the correlated channel is what flips it back. Then run Hume's checklist over the same witnesses and show it comes out maxed, and say what his maxim appears to imply given that. Then tell me which single feature of the case is doing the work and what happens to both verdicts if you remove it. And finally, give me the defense: how would someone who wants Hume to come out looking fine attack this case? I can see at least three moves — lean on the in-principle argument from the first half of the chapter instead of the checklist; argue that the checklist was never meant to be a list of merely individual virtues and that Hume's talk of contrary causes already covers shared error channels; or go after the prior by blurring violation of a law into law was wrong. Say which of those actually works and which is a dodge. The whole point of the exercise is to make students see whether the real weight in that chapter sits in the first half or the second, so build the case for that purpose. If a line from Hume would help, paraphrase it rather than quoting — I don't want invented quotations, and I've got the text in front of me anyway.
reasoning: |-
  Okay, the user wants to create a philosophy problem set on Hume's miracles, specifically a case where Bayesian analysis is more skeptical than Hume's checklist. Let me start by understanding the key requirements.

  First, they need a scenario with reliable witnesses that meet Hume's checklist criteria but where Bayesian reasoning still rejects the miracle due to correlated errors. The setting should be realistic, like a hospital or lab. The evidence must remain testimonial, so no direct observation. The natural law violated can't be easily dismissed as incorrect.

  I recall Hume's two main arguments: the maxim that testimony must make the falsehood more miraculous than the event, and the checklist of witness reliability. The challenge is to have the Bayesian approach be stricter. The correlated error is crucial here—something like shared training or a common instrument causing systemic failure.

  The user mentioned a calibration-linked witness pool. Maybe a lab with a specialized device that all witnesses rely on. The device could have a hidden flaw, leading all experts to report the same anomaly. Each witness is individually reliable, but their dependence on the same tool creates correlation.

  For the natural law, something well-established like thermodynamics. Say, energy conservation in a physics lab. The prior is extremely high because this law underpins many technologies. The violation claim would be a perpetual motion machine outputting more energy than input.

  The scenario: A reputable lab announces excess energy from a device. Multiple experts with verified track records testify. They observed under controlled conditions, no motives, public demonstration. Hume's checklist is satisfied. But Bayesian analysis notes they all used the same unverified instrument. The likelihood of collective error given the shared instrument is higher than if errors were independent. The prior is so strong that even with good witnesses, the posterior doesn't support belief.

  Now, showing the calculations. Prior probability of violation is minuscule, say 10^-12. Probability of testimony if true is high, say 0.99. But if false, the probability of all witnesses erring together due to shared instrument might be 10^-4, whereas independent errors would be (0.01)^10 = 10^-20. Independent errors would make the testimony very unlikely if false, supporting belief. But correlated errors (10^-4) compared to prior (10^-12) means the posterior remains low.

  Hume's checklist would approve: witnesses are numerous, credible, public, no motives. His maxim might seem to allow belief since the falsehood of testimony (a massive conspiracy) seems more miraculous than the event. But here, the shared error channel makes the falsehood less miraculous.

  The key feature is the shared instrument causing correlated errors. Removing it, making errors independent, flips Bayesian to belief. Hume's checklist still approves.

  Defending Hume: One could argue that correlated errors fall under Hume's "contrary causes" in the checklist. But his checklist doesn't explicitly address systemic issues. The prior could be challenged by suggesting the law isn't violated but incomplete. However, in this case, energy conservation is fundamental. Hume's in-principle argument might state that no testimony can overcome such a strong prior, but that's vague. The strongest defense is reinterpreting the checklist to include systemic errors, though it's a stretch.

  The user's deeper goal is to show students that Hume's weight is in the prior (first half) rather than the checklist (second half). This case highlights that even perfect witnesses can't overcome a strong prior if errors are correlated.
answer: |-
  Here’s a self-contained case designed for your philosophy class, targeting the tension between Humean testimony criteria and Bayesian skepticism under correlated errors. The scenario avoids sci-fi and emphasizes structural interdependence.

  ---

  ### **The Case: The Anomalous Energy Readings at the LIGO Facility**

  **Scenario**: At the Laser Interferometer Gravitational-Wave Observatory (LIGO), a team of 15 senior physicists observes an unprecedented event during a routine calibration test. Their ultra-sensitive detectors register a brief but massive energy spike from a distant neutron star merger—equivalent to the star releasing 10× more energy than physics allows under conservation laws. Each physicist independently verifies the data on their dedicated monitoring terminal, cross-checks calibration logs, and confirms the spike’s reality in a joint review. All have impeccable credentials: decades of error-free publications, no history of fraud, and their past instrument readings have consistently aligned with peer-reviewed results. The observation occurs during a public livestreamed test, eliminating secrecy. No funding, fame, or ideology is at stake—it’s a neutral calibration exercise. Crucially, all physicists rely on *the same* proprietary algorithm (unvetted by external labs) to filter cosmic noise from detector signals. This algorithm is the sole tool capable of processing the raw data into interpretable readings.

  **Claim**: A neutron star violated the law of conservation of energy.  

  **Evidence**:  
  - Testimony from 15 highly reliable witnesses (trained, independent-minded, integrity verified via past work).  
  - Public, real-time observation with full data transparency.  
  - No plausible motive for deception; no "marvel-loving" bias.  

  **Prior Probability of Violation (P(V))**: Extraordinarily low (~10⁻¹²). Derived from:  
  - Conservation of energy’s foundational role in physics, verified in quintillions of experiments.  
  - No credible counterexamples in history despite intense scrutiny.  
  - *Why not "law was wrong"?* The violation isn’t a refinement (e.g., "energy leaks to another dimension") but an *exception*: the star’s measured output exceeds input by orders of magnitude, defying all known mechanisms. Rejecting conservation outright would collapse vast swaths of established science (e.g., thermodynamics, particle physics), making P(law wrong) << P(violation).  

  **Likelihoods**:  
  - P(Evidence|Violation) = **High (~0.99)**: If a violation occurred, these experts would likely detect and report it correctly.  
  - P(Evidence|~Violation) = **Low but non-negligible (~10⁻⁴)**: The probability all witnesses err *due to a shared flaw* (e.g., the noise-filter algorithm glitching under rare conditions). This is far higher than if errors were independent (P(ind. error)¹⁵ ≈ 10⁻³⁰ for 99.9% reliable witnesses).  

  **Bayesian Verdict**:  
  - **Posterior odds ≈ P(V) × [P(E|V)/P(E|~V)] ≈ 10⁻¹² × [0.99/10⁻⁴] = ~10⁻⁸**.  
    - *With independent errors*: P(E|~V) drops to ~10⁻³⁰ → Posterior ≈ 10¹⁸ (strong belief).  
    - **But with correlated error (shared algorithm)**: P(E|~V) = ~10⁻⁴ → Posterior remains vanishingly small (**withhold belief**).  

  **Hume’s Checklist Assessment**:  
  - ✅ *Witness number*: 15 (ample for Hume’s "sufficient cloud of witnesses").  
  - ✅ *Education/integrity*: Elite physicists with verified track records.  
  - ✅ *Public setting*: Livestreamed, no secrecy.  
  - ✅ *No contrary motives*: Purely technical task; no zealotry or gain.  
  - ➡️ **Hume’s maxim**: "False testimony must be more miraculous than the event." Here, the event is "energy conservation violated" (P~10⁻¹²). False testimony requires "all experts fooled by a software glitch" (P~10⁻⁴). Since 10⁻⁴ > 10⁻¹², **the maxim forbids belief**—but only because the correlated error makes false testimony *less* "miraculous" than the violation.  

  **Key Feature**: The **shared algorithmic filter**. If replaced with 15 independent measurement methods:  
  - Bayesian: P(E|~V) plummets → **belief becomes rational**.  
  - Hume’s checklist: Unchanged → **still endorses belief**.  

  **Defending Hume**:  
  1. **"In-principle argument" move**: Argue Hume’s first-half position ("no testimony *can* establish a miracle") overrides the checklist. This *works* but renders the checklist redundant—undermining the chapter’s structure.  
  2. **"Checklist covers shared errors" move**: Claim Hume’s demand for "no contrary causes" (e.g., Part 2: "no passion of surprise and wonder") includes systemic flaws. This is a *dodge*: Hume focuses on individual motives/sensibility, not epistemic interdependence.  
  3. **"Blur the prior" move**: Insist energy conservation isn’t truly violated—we just misunderstood neutron stars. This *fails*: The case specifies an unambiguous excess violating *current* energy conservation.  

  **Conclusion**: The case forces a choice:  
  - **Bayesian skepticism** wins by exposing witness correlation.  
  - **Hume’s maxim** coincidentally agrees but *only* because the error correlation reduces the "miraculousness" of false testimony.  
  - **Hume’s checklist** fails to detect the shared error channel, proving it’s insufficient for modern contexts. The real weight lies in Hume’s in-principle argument (first half), which prioritizes priors over testimony—a point laid bare when flawless witnesses still can’t overcome structural interdependence.  

  ---

  ### **Teaching Notes**:  
  - **Why this works**: Correlated errors are realistic (e.g., shared software/training), and the prior defense blocks "law was wrong" escapes.  
  - **Hume’s Text Hook**: Paraphrase his maxim (Enquiry §10) and checklist (§10’s "eight considerations"). Emphasize that Part 1’s abstract argument survives where Part 2’s empiricism falters.  
  - **Student Takeaway**: The checklist optimizes witness quality but ignores *structural* reliability—a vulnerability Bayesians avoid via likelihood modeling.
