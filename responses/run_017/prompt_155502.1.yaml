  ### A Cleanly Separating Further Case
  To definitively distinguish EDT and FDT, use a case **without pre-existing correlation** between acts and states, but with **causal influence**. The classic **Smoking Lesion Problem** works:

  - **Setup:** 
    - A lesion (present in 1% of people) causes both a desire to smoke and lung cancer.
    - Smoking *also* causes cancer independently.
    - Utilities: Smoking gives +10 pleasure; cancer gives -100.
    - Probabilities:
      - \( P(\text{lesion}) = 0.01 \)
      - \( P(\text{smoke} \mid \text{lesion}) = 0.99 \), \( P(\text{smoke} \mid \text{no lesion}) = 0.01 \)
      - \( P(\text{cancer} \mid \text{smoke}, \text{lesion}) = 0.99 \), \( P(\text{cancer} \mid \text{smoke}, \text{no lesion}) = 0.1 \)
      - \( P(\text{cancer} \mid \text{not smoke}, \text{lesion}) = 0.99 \), \( P(\text{cancer} \mid \text{not smoke}, \text{no lesion}) = 0.001 \)

  - **EDT Verdict (smoking):**
    - Conditions on smoking as evidence for the lesion (which causes cancer):
      - \( P(\text{lesion} \mid \text{smoke}) \approx 0.99 \) → High cancer probability.
    - \( EU_{\text{EDT}}(\text{smoke}) \approx -89.1 \), \( EU_{\text{EDT}}(\text{not smoke}) \approx -1 \) → **Don't smoke**.
    
  - **FDT Verdict (smoking):**
    - Uses unconditional probabilities; smoking causally increases cancer risk:
      - \( EU_{\text{FDT}}(\text{smoke}) = P(\text{lesion})[10 - 99] + P(\text{no lesion})[10 - 10] \approx -0.89 + 0 = -0.89 \)
      - \( EU_{\text{FDT}}(\text{not smoke}) = P(\text{lesion})[-99] + P(\text{no lesion})[-0.001] \approx -0.99 \)
    - \( -0.89 > -0.99 \) → **Smoke**.
    - *Reasoning:* FDT ignores the spurious correlation (smoking as evidence of lesion) and only considers smoking's causal effect (small cancer increase in non-lesion cases).

  - **Why it separates EDT and FDT:** 
    - EDT avoids smoking due to evidential link to cancer.
    - FDT permits smoking since it causally benefits non-lesion cases.
    - Your lecturer's rejection of dominance suggests FDT, which would endorse smoking here. EDT would not.

  This case is ideal as it involves no prediction, isolating how each theory handles causal vs. evidential dependencies.
