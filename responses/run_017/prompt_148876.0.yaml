prompt: |-
  I took my first degree in chemistry and spent a career in chemical physics — statistical mechanics and molecular spectroscopy, for the most part — and since retiring I have been sitting in on a philosophy reading group at the local university. I am the person they ask when they want to know what physics has to say, and next month it is my turn to lead a session on the principle of the identity of indiscernibles and on Max Black's two-sphere universe. My difficulty is not that I find the philosophical literature obscure in itself; it is that I cannot tell how much of it is genuinely about something physics touches, and how much is about something my vocabulary has no way of expressing. So what I want is a translation, not an explanation.

  Please restate the following in the vocabulary I actually carry around — labelled and unlabelled configuration spaces, the quotient by the permutation group and the singularities at coincidence points, the exchange operators and the symmetric and antisymmetric subspaces, observables as permutation-invariant functions on phase space or as operators commuting with every permutation, symmetry distinguished from gauge or descriptive redundancy, the Gibbs counting and the factor of N factorial, and, where it matters, the fact that in two spatial dimensions the group that acts on the reduced configuration space is the braid group rather than the symmetric group. Restate in those terms: the principle itself, being careful to separate the version that quantifies only over monadic or intrinsic properties from the version that allows relations of any arity; Black's argument; and the standard lines of response — the one that leans on irreflexive symmetric relations and the resulting distinction between weak and strong discernibility; the one that appeals to primitive thisness; and the one that says the scenario cannot be coherently described at all.

  Then run the translation on three configurations, and tell me whether it returns the same verdict on each. First, Black's own case: two exactly similar spheres at rest in an otherwise empty Euclidean space, with a reflection plane between them. Second, a variant I have been playing with, where instead of two spheres there is an infinite cubic lattice of exactly similar spheres filling an otherwise empty space, so that the symmetry group acts transitively on the spheres and every sphere stands at some definite distance from every other. Third, two bosonic atoms in the ground state of a box. Is the lattice case harder for the principle than the two-sphere case, easier, or the same, and does your answer depend on which grade of discernibility the principle is taken to require?

  I should say what my own attempt looks like, because I would like it corrected rather than quietly replaced. I have been reading the principle as the claim that the map from labelled configurations to the physically significant structure is one-to-one on permutation orbits, so that a counterexample is a configuration fixed by a nontrivial permutation; Black's spheres as the analogue of a coincidence-point singularity, that is, a point of the quotient space where the quotienting does something degenerate; thisness as nothing more than an element of the labelling that the observables happen not to resolve, which on my reading makes it a gauge artefact and therefore physically empty; and quantum permutation invariance as the same thesis as the principle, arrived at independently. I suspect that at least one of these four mappings is a distortion rather than a translation, and I would like to be told which, and why.

  Finally, the residue report, which is the part I actually care about. Which theses come across cleanly? Which survive only after you have quietly imported an assumption my vocabulary does not license? Which have no counterpart in it at all — for instance, anything essentially modal, or anything that turns on what it is to be one object rather than two as opposed to what is measurable about the arrangement? For each item in the residue, give me your view on whether it marks a real poverty in the vocabulary of a working physical chemist, or whether it marks a place where the philosophical claim is less determinate than it looks once the one-place and two-place versions are pulled apart. And be explicit about one thing in particular: whether the indistinguishability of particles in quantum statistical mechanics is the same claim as Leibniz's principle, a special case of it, or a lookalike that trades on the word indiscernible.

  Two constraints. I have no interest in who said what first, so please do not spend space on the history of the debate or on who to read; I want the structure of the claims, and I can find the names myself. And please flag any step where your translation rests on a piece of physics I could check myself in an afternoon with pencil and paper — I would rather verify those than take them on trust.
reasoning: |-
  We are to restate the principle of the identity of indiscernibles (PII) and Black's argument in the vocabulary of configuration spaces, permutation groups, etc.

  PII: There are no two distinct individuals that have all the same properties (monadic) and stand in all the same relations (with respect to every other individual). But note: we must separate the version that only uses monadic (intrinsic) properties from the version that allows relations of any arity.

  In physical terms:

  - The physical state is described by a point in the reduced configuration space (which is the quotient of the labelled configuration space by the permutation group of identical particles). 
  - Observables are permutation-invariant functions (or operators in quantum mechanics that commute with every permutation). 
  - The PII, in the strong form (allowing relations), would be the claim that the reduced configuration space (or the space of physical states) has no singularities (i.e., no points where the symmetry group acts nontrivially) except possibly at coincidence points (where two or more particles are at the same location). In other words, the map from the labelled configuration space to the reduced configuration space is one-to-one except at coincidence. 

  But note: at coincidence points, the configuration is fixed by a nontrivial permutation (so the orbit is degenerate). Thus, a counterexample to PII would be a configuration that is not a coincidence point but is fixed by a nontrivial permutation, meaning that there is a nontrivial permutation that leaves the configuration invariant. This would imply that the two particles are distinct (by label) but the physical state does not distinguish them.

  Black's two-sphere universe: 
  - Two identical spheres, at rest, in an otherwise empty Euclidean space, with a reflection symmetry plane between them. 
  - The labelled configuration: we can label the spheres as A and B. But the reflection symmetry swaps A and B. Therefore, the configuration is fixed by the nontrivial permutation (swapping A and B). 
  - So the orbit of the labelled configuration under the permutation group has only one distinct point (because swapping labels doesn't change the physical state). But note: the configuration is not a coincidence point (the spheres are at different locations). 
  - Therefore, this is a counterexample to PII: two distinct objects (by label) that are indiscernible by any property or relation.

  Now, the standard lines of response:

  1. **Irreflexive relations and weak/strong discernibility**: 
     - The idea is that there might be relations that hold between two objects but not between an object and itself. For example, in the two-sphere case, each sphere is at a distance D from the other (and not from itself). So we can say that for each sphere, there is the relation "is at a distance D from" which holds of the other sphere and not of itself. Therefore, the spheres are discerned by the relation: sphere A is at distance D from sphere B, and sphere B is at distance D from sphere A, but note that the relation is symmetric. However, it is irreflexive: no sphere is at distance D from itself. 
     - In physical terms: we can define a relation R(x,y) = "the distance between x and y is D". Then R(A,B) holds but R(A,A) does not. So A and B are discerned by the fact that A has the property "being at distance D from B", which B does not have (because B is not at distance D from B). 
     - This is called weak discernibility (as opposed to strong discernibility by a monadic property). 
     - In the reduced configuration space, we note that the observables (which are symmetric) can still capture this relation. For example, the observable "the distance between the two spheres" is symmetric and invariant. But note: in the two-sphere case, each sphere does not have a monadic property that distinguishes it, but they are related by an irreflexive symmetric relation. 
     - So the response: the spheres are weakly discernible by the relation of being at distance D from each other.

  2. **Primitive thisness**: 
     - The idea that each object has a primitive identity (a haecceity) that is not reducible to properties or relations. 
     - In physical terms: this would correspond to saying that the labels are physically real. But in the standard physical picture, the labels are just a mathematical tool and the physical state is the orbit (the unlabelled configuration). So primitive thisness would break the permutation symmetry by adding extra structure (the labels) as physical. 
     - However, in the context of the PII, if we accept primitive thisness, then the two spheres are discerned by their thisness (e.g., "being A" vs "being B"). But the PII is typically understood without primitive thisness.

  3. **Incoherence of the scenario**: 
     - The claim that the scenario cannot be coherently described because any description must break the symmetry. 
     - In physical terms: if we insist that the physical state must be described without labels, then the state of the two spheres is just one state (the orbit). But then we cannot say there are two objects? Or we might say that the description of the universe with two spheres is not possible without introducing a labeling, which is arbitrary. But the physical content is symmetric.

