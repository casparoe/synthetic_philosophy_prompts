  Residue:
  - Modal claims: no counterpart.
  - The question of object identity beyond the structure: no counterpart in the physical vocabulary.

  But note: the physical vocabulary is sufficient for the purposes of physics. The philosophical claims that have no counterpart might be seen as metaphysical additions that are not needed for the physical description. However, the weak discernibility response is a logical point that does fit within the physical vocabulary.

  Finally, the bosonic case shows that there are physical situations where PII fails even weakly, so the quantum case is a more severe challenge.

  Additional note: in two spatial dimensions, the braid group replaces the symmetric group. This matters for anyons. But in the three cases above, we are in three dimensions (except the box for the atoms, which is typically 3D, but the ground state symmetry is the same). So we did not need the braid group.
answer: |-
  ### Translation of Key Concepts into Physical Vocabulary

  **Principle of the Identity of Indiscernibles (PII):**  
  - **Monadic (intrinsic) version:** PII asserts that if two distinct particles share all intrinsic physical properties (e.g., mass, charge, spin, position in the reduced configuration space), they cannot exist as distinct entities. In configuration space terms, this means no two distinct points in the labelled configuration space (with labels \(1, \dots, N\)) map to the same point in the reduced configuration space \(Q = \mathbb{R}^{3N}/S_N\) (where \(S_N\) is the symmetric group) except at coincidence points (where \(x_i = x_j\) for some \(i \neq j\)). Violations occur at configurations fixed by a nontrivial permutation \(\sigma \in S_N\), where \(\sigma \neq I\), but no coincidence exists.  
  - **Full (relational) version:** PII weakens if relations (e.g., distance, relative vectors) are permitted. Here, particles need only be discerned by irreflexive relations (e.g., "distance to another particle" or "relative position"). In phase space, observables are permutation-invariant functions \(\mathcal{O}(x_1, \dots, x_N) = \mathcal{O}(x_{\sigma(1)}, \dots, x_{\sigma(N)})\) for all \(\sigma \in S_N\). PII holds if every pair of particles is discerned by some observable, even if relational.  

  **Black's Two-Sphere Argument:**  
  - **Setup:** Two identical spheres (mass, radius, etc.) at rest, separated by a reflection plane in an otherwise empty Euclidean space. Labelled configuration: \((x_A, x_B)\) with \(x_B = R x_A\) (reflection \(R\)).  
  - **Reduced configuration space:** Quotient by \(S_2\), so orbits are \(\{ (x_A, x_B), (x_B, x_A) \}\). The configuration is fixed by the swap permutation \(\sigma: (A,B) \mapsto (B,A)\), as \(\sigma \cdot (x_A, x_B) = (x_B, x_A) = (R x_A, R^{-1} x_B) = (x_A, x_B)\) due to reflection symmetry.  
  - **Indiscernibility:** No intrinsic property distinguishes \(A\) and \(B\) (same position magnitude, velocity, etc.). In reduced space, the orbit is singular (degenerate) but not a coincidence point.  
  - **Black's claim:** This is a counterexample to PII, as distinct particles share all properties and relations.  

  **Standard Responses in Physical Terms:**  
  1. **Weak discernibility via irreflexive relations:**  
     - Particles \(A\) and \(B\) are *weakly discernible* by the irreflexive symmetric relation \(R(x,y) = \text{"distance between } x \text{ and } y \text{ is } D\text{"}\). For \(A\), \(R(A,B)\) holds but \(R(A,A)\) is false (since distance to self is 0). Similarly for \(B\). Thus, \(A\) and \(B\) are discerned relationally. Observables like pairwise distance are permutation-invariant and capture this.  
     - **Strong vs. weak discernibility:**  
       - *Strong discernibility:* Requires monadic properties (fails for Black's spheres).  
       - *Weak discernibility:* Permits binary relations (holds for Black's spheres).  

  2. **Primitive thisness:**  
     - Asserts that particles possess intrinsic "haecceity" (primitive identity) beyond physical properties. In phase space, this corresponds to treating labels as physical (e.g., \(A\) and \(B\) are distinct even if observables don't resolve them). This violates the gauge principle: labels are descriptive redundancy, not physical. Observables commute with permutations (\(\hat{\mathcal{O}} \sigma = \sigma \hat{\mathcal{O}}\)), so haecceities are unmeasurable.  

  3. **Incoherence of description:**  
     - Claims the scenario cannot be consistently described without smuggling in asymmetry. In reduced configuration space, the point is singular (symmetry fixes the state), so describing "two distinct but indiscernible particles" requires unphysical labels. Physical observables (e.g., center-of-mass, relative distance) exist, but particle identities do not.  

  ---

  ### Evaluation of Configurations

  **1. Black's Two Spheres:**  
  - **Reduced configuration space:** Orbit fixed by \(S_2\) swap (singularity).  
  - **Observables:** All symmetric; relative distance \(D\) is invariant.  
  - **Discernibility:**  
    - *Monadic PII:* Fails (no intrinsic property distinguishes spheres).  
    - *Relational PII:* Holds via weak discernibility. Irreflexive relation: "is at distance \(D\) from the other sphere."  
  - **Verdict:** Violates monadic PII; satisfies relational PII.  

  **2. Infinite Cubic Lattice of Spheres:**  
  - **Setup:** Identical spheres at lattice points \(\{\mathbf{x}_i\}\) with full lattice symmetry (translation, rotation, reflection). Permutation group \(S_\infty\) (symmetric group on infinitely many labels). Reduced space is quotient by \(S_\infty\).  
  - **Symmetry:** Group acts transitively; for any two spheres \(i, j\), a permutation \(\sigma\) swapping \(i\) and \(j\) (e.g., lattice symmetry) fixes the configuration. No coincidence points.  
  - **Discernibility:**  
    - *Monadic PII:* Fails (all spheres share intrinsic properties).  
    - *Relational PII:* Holds via weak discernibility for any pair \((i,j)\). Irreflexive relation: "is at distance \(d_{ij}\) from sphere \(j\)" (where \(d_{ij}\) is fixed). For sphere \(i\), \(R(i,j)\) holds but \(R(i,i)\) is false.  
  - **Comparison with Black's case:** Same difficulty. Lattice is not harder; weak discernibility holds pairwise. Transitivity doesn't preclude relational discernibility for specific pairs.  

  **3. Two Bosonic Atoms in Ground State:**  
  - **Setup:** Wavefunction \(\Psi(\mathbf{x}_1, \mathbf{x}_2) = \phi_g(\mathbf{x}_1)\phi_g(\mathbf{x}_2)\), symmetric under swap. Hilbert space is symmetric subspace (\(\Pi_+ \mathcal{H}\)). Observables commute with \(S_2\) (e.g., total energy, relative distance operator \(\hat{D}\)).  
  - **Reduced configuration space:** Quotient by \(S_2\) with singularity at symmetric states.  
  - **Discernibility:**  
    - *Monadic and relational PII:* Both fail. No intrinsic or relational properties discern particles:  
      - Intrinsic: Both in same state \(\phi_g\).  
      - Relational: \(\Psi\) is symmetric; probability density \(|\Psi|^2\) is permutation-invariant. Expectation values (e.g., \(\langle \hat{D} \rangle\)) identical for all pairs. No irreflexive relation applies, as particles lack definite trajectories.  
  - **Verdict:** Counters even relational PII.  

  ---

  ### Correction of Your Mappings

  1. **PII as injectivity on orbits:**  
     - Correct: PII holds iff no nontrivial permutation fixes a non-coincidence point. Violations are degenerate orbits in reduced space.  
     - **Correction needed:** In quantum mechanics, PII can fail even without a fixed permutation in the classical sense (e.g., bosonic ground state).  

  2. **Black's spheres as coincidence-point analogue:**  
     - Partially correct: Both are singularities in reduced space, but coincidence points involve \(x_i = x_j\) (topological singularity), while Black's case has spatial symmetry (geometric singularity).  

  3. **Thisness as gauge artifact:**  
     - Correct: Primitive thisness introduces unphysical labels. Observables are \(S_N\)-invariant, so thisness is descriptively redundant (gauge).  

  4. **Quantum permutation invariance as PII:**  
     - **Incorrect:** Permutation invariance (observables commute with \(S_N\)) is necessary but insufficient for PII. PII requires discernibility by observables, which fails in symmetric states (e.g., bosonic ground state). Permutation invariance enables indiscernibility; it doesn't mandate PII.  

  ---

  ### Residue Report

  **Clean translations (no residue):**  
  - PII as degeneracy in reduced configuration space.  
  - Black's spheres as symmetry-fixed configuration.  
  - Weak discernibility via irreflexive relations.  
  - Primitive thisness as unphysical labeling.  
  - Gibbs' \(N!\) factor from quotienting \(S_N\).  
