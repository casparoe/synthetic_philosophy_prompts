     - Labelled configuration space: two points (positions of A and B) in Euclidean space, with the constraint that they are at rest and symmetric with respect to a reflection plane. The configuration is such that swapping the labels gives the same physical state. 
     - The permutation group is S2. The configuration is fixed by the nontrivial permutation (swap). 
     - The reduced configuration space (quotient by S2) has a singularity at this point (the orbit is degenerate). 
     - Observables: all symmetric functions. The distance between the two spheres is an observable (it is symmetric). But note: each sphere does not have a unique monadic property. However, they are weakly discernible by the relation: each is at distance D from the other. 
     - Verdict: if PII requires strong discernibility (by monadic properties), then it fails. If it allows weak discernibility, then it holds.

  2. **Infinite cubic lattice of spheres**: 
     - Labelled configuration: an infinite set of points at the vertices of a cubic lattice. The symmetry group (of the configuration) is the entire translation group of the lattice (and also rotations and reflections that preserve the lattice). Importantly, the permutation group for identical particles is the symmetric group on an infinite set. 
     - The configuration is fixed by any permutation that is a symmetry of the lattice. Since the lattice is symmetric, the symmetry group is large. In fact, the symmetry group acts transitively: any two points can be swapped by a symmetry (e.g., by a translation that swaps two points? But note: translations act by moving the entire lattice, not by swapping two points. However, there are symmetries that swap two points? For example, a reflection symmetry that swaps two adjacent points? But then we have to note that the lattice has many symmetries. 
     - Actually, the automorphism group of the cubic lattice (as a graph) is transitive: it can map any vertex to any other. Therefore, for any two distinct spheres, there is a permutation (an automorphism) that swaps them and leaves the configuration invariant. 
     - Therefore, for any two spheres, there is a nontrivial permutation that leaves the configuration invariant. 
     - Now, the question: are any two spheres discernible? 
     - Monadic properties: every sphere is at a lattice point, and every lattice point is equivalent. So no monadic property distinguishes them. 
     - Relations: consider two spheres. They are at a certain distance. But note: there are multiple pairs of spheres at the same distance. For example, in a cubic lattice, there are many pairs at the same distance (say, nearest neighbors). 
     - However, we can consider the relation between two particular spheres. For two distinct spheres X and Y, the relation "the distance from X to Y is d" holds. But note that this relation is symmetric and irreflexive. Moreover, for a fixed X, the set of distances to other spheres is the same for every X (by symmetry). 
     - But weak discernibility: for any two distinct spheres X and Y, we can say that X has the property "being at distance d from Y", but Y does not have that property with respect to itself. However, note that for any sphere, there is another sphere at distance d (for each d that occurs). But the property "being at distance d from Y" is not a monadic property of X? It is a relational property. And it is unique to Y? No, because there might be multiple spheres at distance d from X. 
     - However, the weak discernibility argument for two spheres does not require that the relation is unique. It only requires that the relation holds between X and Y and does not hold between X and X (or Y and Y). So for any two distinct spheres X and Y, the relation R(X,Y) holds (where R is the distance relation) and R(X,X) does not. Therefore, X and Y are weakly discernible. 
     - But note: in the lattice, for a given sphere X, there are many spheres at the same distance. So the property "being at distance d from X" is not a property that picks out a unique sphere. But that doesn't matter for weak discernibility: we are not trying to uniquely identify each sphere, but only to discern between two specific ones. 
     - Therefore, by the same weak discernibility argument, every pair of distinct spheres is weakly discernible. 
     - However, there is a catch: in the infinite lattice, the set of relations (distances) might be the same for every sphere. But the weak discernibility relation is a binary relation that holds between two distinct spheres. So for any two, we can use the relation "is at a distance d from" (where d is the actual distance between them) to discern them. 
     - Therefore, the lattice case is not harder than the two-sphere case: weak discernibility holds for every pair.

  3. **Two bosonic atoms in the ground state of a box**:
     - Quantum case: the Hilbert space is the symmetric subspace (since they are bosons). 
     - The wave function for the ground state of two identical bosons in a 1D box (or 3D) is symmetric. The ground state might be the same as that of two noninteracting particles in the lowest orbital: 
          ψ(x1, x2) = φ(x1)φ(x2)
       (if they are noninteracting and the box has a ground orbital φ). 
     - This wave function is symmetric under exchange. 
     - Now, what are the observables? They must be symmetric operators. 
     - The state is such that the two particles are absolutely indistinguishable: not only are there no monadic properties that distinguish them, but also there are no relations that can discern them because the wave function is symmetric and the particles are not localized. 
     - In fact, the probability distribution is |ψ(x1,x2)|^2 = |φ(x1)|^2 |φ(x2)|^2, which is symmetric. 
     - Now, can we have a relation? For example, the distance between the particles? The observable for distance is a symmetric operator. But in this state, the two particles are not at fixed positions. The wave function does not assign definite positions. 
     - However, we can consider the expectation value of the distance, but that doesn't help for discernibility. 
     - The key point: in this quantum state, the two particles are not only indiscernible by monadic properties but also by relations. Why? Because the state is symmetric and the particles are identical. 
     - Specifically, the joint probability distribution for any set of measurements is symmetric. Therefore, there is no experiment that can distinguish the two particles. 
     - This is a case of quantum indistinguishability. 
     - Verdict: the PII fails even for weak discernibility? 

  But note: in the quantum case, we have to be careful. The relation of distance is not definite. However, we can ask: is there a relation that holds for one and not the other? The problem is that the particles do not have individual identities. 

  In fact, in quantum mechanics, we cannot even talk about which particle is which. The state is symmetric. Therefore, there is no property (monadic or relational) that can be attributed to one particle and not the other. 

  For example, consider a relational property: particle 1 is at position x and particle 2 at position y. But in the state ψ(x1,x2)=φ(x1)φ(x2), the probability density for particle 1 being at x and particle 2 at y is the same as for particle 1 at y and particle 2 at x. So there is no way to assign the property "being at position x" to a specific particle. 

  Therefore, in this quantum state, the two bosons are absolutely indiscernible. 

  So the verdicts:

  - Two spheres: weakly discernible (if we allow relations), so PII holds for the weak version. If we require monadic discernibility, it fails.
  - Lattice: same as two spheres: weakly discernible by the distance relation for each pair.
  - Two bosons in ground state: not even weakly discernible. 

  But note: for the lattice, we have to be cautious about the fact that the lattice is infinite. However, the weak discernibility argument by the binary relation of distance still holds for any two distinct spheres. 

  Now, let's compare the two-sphere and lattice cases: are they the same? In both cases, we have weak discernibility. So the lattice is not harder.

  But what if the lattice were such that all distances were the same? That's impossible in a cubic lattice (unless it is a lattice with only two points, which is not infinite). In an infinite cubic lattice, there are many distances, but for two adjacent spheres, the distance is fixed (say, d). Then for two non-adjacent spheres, the distance is larger. So for any two spheres, the distance between them is a definite number. And the relation "is at distance d from" (where d is the distance between them) is irreflexive and holds between them. Therefore, they are weakly discernible.

  Now, to the corrections of your own attempt:

  You say:
  - PII: the map from labelled configurations to the physically significant structure is one-to-one on permutation orbits -> meaning that if two labelled configurations are in the same orbit, they represent the same physical state. But PII is about whether there are two distinct objects (with distinct labels) that are indiscernible. That is equivalent to: the physical state (the orbit) is fixed by a nontrivial permutation (so the orbit has size less than the full permutation group). So the map from the labelled space to the reduced space is not injective at that point (because multiple labels map to the same physical state). 

  You are correct that a counterexample is a configuration fixed by a nontrivial permutation (and not a coincidence point). 

  - Black's spheres: you call it the analogue of a coincidence-point singularity. But note: at coincidence, the singularity is because two particles are at the same point. In Black's case, the spheres are at distinct points. So it's a different kind of symmetry (a discrete symmetry) that fixes the configuration. But the reduced space still has a singularity (in the sense that the orbit is degenerate). 

  - Thisness: you say it is an element of the labelling that the observables do not resolve, hence a gauge artefact. This is the standard physics view. But the philosophical primitive thisness would say that this is a real feature. So your mapping is consistent with rejecting primitive thisness.

  - Quantum permutation invariance: you say it is the same thesis as PII. But note: in quantum mechanics, we have the symmetric and antisymmetric subspaces, and observables commute with permutations. This is a statement about the representation of states and observables. But PII is a metaphysical principle about the identity of objects. In the case of two bosons in the ground state, we have a failure of PII (even weak) but quantum permutation invariance holds. So they are not the same. Quantum permutation invariance is a symmetry principle of the theory, while PII is a principle about the individuation of objects. However, quantum permutation invariance implies that we cannot have distinct states that differ only by permuting identical particles, so it enforces that the physical state is the orbit. But in the case of the two bosons, we have an orbit that is degenerate (the state is fixed by the permutation) and so there is indiscernibility. 

  Therefore, the quantum case shows that PII can fail even when we have permutation invariance. So they are not the same. Permutation invariance is a necessary condition for PII to hold (in the sense that if permutation invariance fails, then we could have labelled states as physically distinct, and then we could discern by label) but it is not sufficient: we also need that the state is not symmetric (i.e., not fixed by any nontrivial permutation). 

  So correction: quantum permutation invariance is a precondition for the failure of discernibility by labels, but it does not by itself imply PII. In fact, when the state is symmetric, PII fails.

  Now, the residue report:

  Which theses come across cleanly?
  - The structure of the reduced configuration space and the role of the permutation group come across cleanly. 
  - The distinction between coincidence points and non-coincidence points with symmetry is clear.
  - The definition of observables as permutation-invariant is standard.

  Which survive only after importing an assumption?
  - The weak discernibility response: it uses a relational property that is irreflexive. This is a logical point that does not require extra physics. However, it assumes that relations are part of the property set. 
  - The primitive thisness: this is a metaphysical add-on that has no counterpart in the physical vocabulary. We can describe it as adding labels as physical, but that is not done in standard physics.

  Which have no counterpart?
  - The modal aspects: for example, what might have been true of the objects? In the physical vocabulary, we only have the actual configuration. 
  - The notion of "being one object rather than two" as opposed to the measurable arrangement: in physics, we start with the number of particles and then describe their state. The identity of the particles is given by the labels in the configuration space, but then we quotient out. So we don't have a primitive notion of object identity beyond the structure.

  Finally, the indistinguishability of particles in quantum statistical mechanics vs Leibniz's PII:
  - They are not the same. Leibniz's PII (in the weak form) can hold in classical physics (like the two spheres) by weak discernibility. 
  - In quantum mechanics, we have states (like the ground state of two bosons) where even weak discernibility fails. 
  - Moreover, Leibniz's PII is a principle about objects in a world, while quantum indistinguishability is a feature of the formalism and the symmetry of the state. 
  - So quantum indistinguishability is a stronger form of indiscernibility: it is absolute. 

  Therefore, the quantum case is a counterexample to PII even in the weak form (if we take the state as given). But note: in the quantum case, we can argue that the particles are not individuals in the classical sense. 

  In summary:

  - PII (strong: monadic) fails in the two-sphere and lattice cases, but holds weakly (if we allow relations) in these classical cases.
  - PII fails absolutely in the bosonic ground state.
