answer: |-
  (1) No established term exists that precisely captures this specific form of unreachability proof via an externally imposed, unmentioned preserved feature.

  (2) The nearest concept is **invariant**, but it fails because "invariant" typically describes properties *explicit within or derivable from* the system's rules or state description, not one arbitrarily imported solely to demonstrate impossibility.

  (3) This is **demonstrating unreachability via an extrinsic invariant**: a property not referenced in the system's rules or initial state description, preserved by all rules, holding for the start state, but failing for the target state. (i) Disputes cycling due to unstated framing features are analogous but less formal. (ii) The feature's arbitrariness *is* essential – finding it is the creative, non-algorithmic leap. (iii) It is "sideways" movement: employing a meta-system (e.g., modular arithmetic, colouring) to analyze the object system; it feels terminal because the meta-system provides a decisive, simple criterion.

  (4) Candidates rejected:  
  **i) "Conserved quantity"**: Fails as it implies a measurable magnitude within the system's ontology (e.g., energy), unlike an arbitrary colouring or abstract modulus count.  
  **ii) "Emergent property"**: Fails as it suggests complexity arising from simple interactions, whereas the extrinsic invariant is imposed externally, not emergent from rule application.

  (5) Coinage: **Extrinsic Invariant**. Definition: *An unstated property, preserved by all operations and holding for the start state but not the target, imported from outside the system's explicit rules to demonstrate unreachability.* Counterexample: A reachable target where an extrinsic invariant seemingly forbids it (e.g., an invariant error in the MU proof) would falsify the necessity implied by the definition.
