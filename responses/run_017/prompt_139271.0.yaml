  For the definition, I'll address their complications: (1) Disputes cycling due to unstated framing features could be analogous, though less formal. (2) The arbitrariness is essential - finding the right invariant is the creative leap. (3) This is better seen as "sideways" movement into a meta-system rather than complete escape, since we're still within formal reasoning.

  I considered and rejected several candidates: "Emergent property" (too vague), "Symmetry argument" (too narrow, as not all invariants are symmetries), and "Proof by contradiction" (too general).

