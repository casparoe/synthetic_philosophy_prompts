prompt: |-
  I am presenting a paper three weeks from now to a development economics workshop, and I would like a question-period preparation sheet rather than a defense of the thesis. Please do not pad the answer with references or reading suggestions; I want the arguments themselves.

  The setting. The paper is about the standing dispute over why some countries are many times richer than others — the three-way contest between institutions, geography, and culture — and more specifically about the fact that nearly every influential empirical strategy in that literature leans on one historical episode or one instrument (a colonial-era mortality gradient, a disease-ecology or crop-suitability gradient, an arbitrarily drawn border, a mining or plantation concession, a pre-modern state's boundary) and then reports a single number as if it were a parameter of a general law.

  My thesis has a destructive and a constructive half.

  Destructive: the three camps are not, in the first instance, disagreeing about evidence. They are disagreeing about which counterfactual contrast is the interesting one, and each camp's design is purpose-built to isolate a contrast the other two regard as uninteresting or as a confound. Their numbers are therefore not rival estimates of one quantity; they are estimates of different quantities, and more data will never make them compete.

  Constructive: the field should stop trying to estimate the effect of *institutions* (or of geography, or of culture) and instead estimate distributions of effects across *matched episodes*. A matched episode is a pair of places that looked similar, on outcomes and observables, before a documented change in the rules governing them; that then diverged in rules while remaining adjacent and comparable in other respects; and that can be followed for several decades afterwards. My proposal is to assemble a few hundred such pairs and report not one treatment effect but the shape of the estimated effects across pairs — the median, the interquartile range, the share of pairs whose effect has the wrong sign. My empirical claim is not that the median effect is small. It is that the spread is wide enough that the median carries almost no information for anyone who has to choose a reform in one particular place, and that the spread is not noise to be averaged away, because it is structured: it tracks whether the rule change altered anyone's actual payoffs, whether it was imposed or bargained, and whether there was an organized group that lost by it.

  The policy conclusion is the part people will fight about: that the average effect should carry close to zero weight in a reform decision, and that the reformer's real question — will this work *here*? — is better served by a structured judgment about which part of the historical distribution this place resembles than by any published average.

  The audience. About thirty people. Present will be: two senior economic historians whose careers were built on the instrumental-variables designs my destructive half criticizes, fastidious about identification and allergic to *heterogeneity* used as an excuse for weak designs; a quantitative geographer who works on disease ecology and agricultural suitability, thinks the institutionalist literature is one enormous omitted-variable problem, will be delighted by my destructive half and hostile to my constructive half; a cultural economist who studies the intergenerational transmission of trust and norms and thinks the institutionalists have the arrow of causation backwards, because what they call institutions is largely culture that has already crystallized; a philosopher of social science who holds that causal claims resting on single historical episodes are close to unfalsifiable and will press me on what, exactly, I take myself to have established; a room of younger development economists who run field experiments on local governance, are impatient with history altogether, and want to know why any of this should change what they do; and the head of a bilateral aid agency's research unit, who is in the room because the agency funds the workshop and who wants one usable sentence about whether to keep financing rule-of-law and public-finance reform.

  What I would like from you. A prep sheet of the eight or so objections I will actually get, in roughly the order they will arrive, each attributed to the kind of person who will raise it and phrased the way that person would phrase it — not in my vocabulary, and not the objections I would get from my own adviser. For each: how much damage it does if I handle it badly, the reply I should have ready and can deliver in about two minutes, and one honest sentence about where that reply is soft. Then: which two objections have enough real force that I should concede them from the podium rather than wait to be asked; the single claim I should refuse to give up even under sustained pressure; the weakest joint in my own argument that I should prepare to defend rather than hope the room misses; and, finally, the one question I am privately hoping nobody asks.
reasoning: |-
  Okay, the user is preparing for a workshop presentation on development economics and needs a question-period prep sheet. Let me start by understanding their thesis. They have a destructive part critiquing the three-way contest between institutions, geography, and culture, arguing that each camp uses different counterfactual contrasts, so their estimates aren't comparable. The constructive part proposes using matched episodes to show a distribution of effects instead of a single average.

  The audience is diverse: senior economic historians, a quantitative geographer, a cultural economist, a philosopher, younger economists doing field experiments, and an aid agency head. Each will have different objections based on their expertise. The user wants objections phrased as those individuals would, not in the user's own terms. They also need strategies to handle each, including potential concessions and what to defend at all costs.

  First, the senior historians might challenge the heterogeneity argument, seeing it as an excuse for weak identification. The geographer might object to ignoring geography in the pairs. The cultural economist could argue that culture underpins institutions. The philosopher might question falsifiability. The younger economists could see the historical approach as irrelevant to their work. The aid agency head needs practical advice, not academic nuance.

  The user needs to anticipate these objections in the order they might arise. For each, craft a concise reply that addresses the core concern, acknowledge where the reply is weak, and assess the damage if mishandled. Also, identify which objections to concede upfront, which claim to hold firm on, the weakest part of their argument to defend, and the dreaded question they hope isn't asked.

  Key points: The destructive half might upset the historians, so handling their objection first is crucial. The geographer's point about geography omission needs a reply that doesn't dismiss their concern but ties into the episode selection. The cultural economist's objection requires distinguishing rules from norms without denying their interplay. The philosopher's falsifiability challenge needs a pragmatic stance on evidence. For the younger economists, linking historical patterns to local contexts is vital. The aid agency's need for actionable advice should be met with the distribution's relevance over averages.

  Concessions: Acknowledge that the matched episodes aren't perfect experiments and that the policy conclusion is indeed radical. Hold firm on the heterogeneity being structured, not noise. The weakest joint might be the practical feasibility of finding hundreds of such pairs. The question to dread is whether the method applies to modern reforms without historical parallels.

  Need to ensure each objection is attributed correctly, replies are succinct, and weaknesses are honestly noted. Avoid academic padding, focus on the arguments as requested.
answer: |-
  Here is your prep sheet, structured for the objections you'll face in probable order of appearance. Replies are designed for concision (<2 mins) and calibrated to your audience's biases.

  ### Core Objections & Replies
  1. **Objector: Senior Economic Historian**  
     *Phrasing:* "You dismiss decades of careful identification as mere 'different counterfactuals.' But if your matched episodes have no exogenous variation, aren't you just trading their internal validity for your own selection bias?"  
     **Damage if mishandled:** High (undermines destructive half credibility).  
     **Reply:** "I’m not dismissing identification—I’m showing *what* it identifies. Your mortality instrument isolates the effect of *colonizer-imposed* institutions. My pairs isolate the effect of *specific rule changes* in comparable settings. Both are valid, but for different questions. Your design asks: 'What if Europeans faced different constraints?' Mine asks: 'What happens when similar places change rules?'"  
     **Soft spot:** "This concedes their designs *are* internally valid for narrow contrasts—which they’ll exploit."

  2. **Objector: Quantitative Geographer**  
     *Phrasing:* "Your 'matched pairs' ignore geography by design. But if soil or disease gradients explain why Rule A worked here but failed there, isn’t your heterogeneity just geographic noise?"  
     **Damage if mishandled:** Moderate (weakens constructive half).  
     **Reply:** "Agreed—geography *can* explain heterogeneity. That’s why I track *whether the rule change altered payoffs*. If geography mediates payoffs (e.g., a land titling reform fails where soil is infertile), it shows up in the structured spread. My method *absorbs* geography into the effect distribution."  
     **Soft spot:** "Implies geography matters only through payoffs—ignoring direct ecological constraints."

  3. **Objector: Cultural Economist**  
     *Phrasing:* "You separate 'rules' from culture, but rules only work when norms internalize them. Isn’t your 'effect distribution' just capturing latent cultural resistance?"  
     **Damage if mishandled:** Moderate (challenges core mechanism).  
     **Reply:* "Crucially, I don’t claim rules operate independently. The 'organized group that lost' variable *is* cultural: it measures resistance from crystallized interests. But if culture were all that mattered, identical rules imposed on culturally similar groups shouldn’t show systematic heterogeneity—yet they do."  
     **Soft spot:** "Can’t disprove that unobserved cultural shifts *caused* the heterogeneity."

  4. **Objector: Philosopher of Social Science**  
     *Phrasing:* "You replace one unfalsifiable historical claim with hundreds. How can we test whether your 'structured heterogeneity' isn’t just storytelling?"  
     **Damage if mishandled:** High (undermines entire approach).  
     **Reply:** "The test is predictive: if the three factors I track (payoff changes, imposition vs. bargain, organized losers) explain the spread better than noise, we can falsify specific predictions. E.g., 'Reforms imposed without bargaining *never* work in subsistence economies'—find one counterexample and we refine."  
     **Soft spot:** "Still relies on post-hoc interpretation of historical cases."

  5. **Objector: Young Development Economist**  
     *Phrasing:* "Why should policymakers care about 19th-century land reforms? We run RCTs on *actual* reforms *now*. Isn’t this just history?"  
     **Damage if mishandled:** Critical (loses the room).  
     **Reply:** "Because your RCTs face the *same* heterogeneity: a land titling RCT in Kenya ≠ Peru. But RCTs rarely last 30 years. My method shows *which contextual factors* predict effect persistence. Use your RCTs to test *those* predictors in modern settings—merge history with experiments."  
     **Soft spot:** "Assumes historical patterns extrapolate—your audience may doubt that."

  6. **Objector: Senior Economic Historian (Follow-Up)**  
     *Phrasing:* "If every episode is unique, how do we generalize? Shouldn’t we still prioritize the *most credible* estimates (like IV) over your heterogeneity?"  
     **Damage if mishandled:** Fatal (revives defense of traditional methods).  
     **Reply:** "Generalization requires understanding *why* effects vary. IV gives one high-validity point on the curve. I map the curve. If 60% of effects are positive but 40% negative, the median is useless for policy. We need the distribution *and* its drivers."  
     **Soft spot:** "Doesn’t prove that IV’s 'one point' is less policy-relevant."

  7. **Objector: Aid Agency Head**  
     *Phrasing:* "So you’re saying we can’t use average effects. But I need concrete advice. Should I fund rule-of-law reforms or not?"  
     **Damage if mishandled:** Reputational (appears evasive).  
     **Reply:** "Fund them *if* your context matches historical cases where: (1) the reform directly raised elites’ costs of corruption (payoff change), (2) it was bargained with mid-level bureaucrats (not imposed), and (3) no cohesive group (e.g., land chiefs) stood to lose entirely. Otherwise, expect failure."  
     **Soft spot:** "Requires deep contextual knowledge—which the agency may lack."

  8. **Objector: Cultural Economist (Policy Angle)**  
     *Phrasing:* "Your 'reformer’s judgment' sounds like guesswork. Isn’t averaging across contexts still better than relying on fallible intuitions?"  
     **Damage if mishandled:** Moderate (weakens policy conclusion).  
     **Reply:** "Averages *are* guesses—they assume your context is typical. But if the interquartile range includes zeros and negatives, the average is dangerous. Structured judgment uses history as a database: 'Show me cases where *these* three conditions held.' It’s averaging *conditionally*."  
     **Soft spot:** "Presumes reformers can accurately assess contextual conditions."

  ---

  ### Strategic Concessions (Make Proactively)
  1. **To the Historians/Philosopher:**  
     *"My matched episodes aren’t natural experiments. They trade some internal validity for external realism—but that means selection bias remains a threat."*  
     *(Shows humility; preempts "not identification" criticism.)*

  2. **To the Geographer/Cultural Economist:**  
     *"Yes, geography and culture *are* fundamental—but they operate through the mechanisms I track (payoffs, resistance). My approach doesn’t negate them; it shows *where* they bite."*  
     *(Prevents dismissal as a "institutions-only" zealot.)*

  ---

  ### Hold the Line (Even Under Pressure)
  **"The median treatment effect is uninformative—and often dangerous—for policy decisions in specific contexts."**  
  *(This is your core thesis. Caveats dilute it.)*

  ---

  ### Weakest Joint (Prepare to Defend)
  **"Your 'structured heterogeneity' relies on subjective historical coding (e.g., 'organized group that lost'). How is that replicable?"**  
  *Defense:* "We use multiple coders, pre-registered criteria (e.g., 'group petitioned against reform'), and machine-learning checks against archives. But yes: this demands transparent historiography, not just econometrics."

  ---

  ### The Question You Hope Nobody Asks
  **"If modern reforms lack historical parallels (e.g., digital IDs), doesn’t your method collapse—forcing us back to averages or RCTs?"**  
  *Why it stings:* Admitting "yes" invalidates policy relevance; "no" seems implausible.  
  *Salvage strategy:* "For *novel* reforms, we borrow insights from analogous cases (e.g., tax registration → digital IDs) and layer RCTs on top. But history remains the best guide to long-term dynamics RCTs can’t capture."

  ---

  ### Delivery Notes
  - **Order matters:** Historians will strike first. Aid head speaks late.  
  - **Jujitsu:** Use the geographer’s objection to reinforce your point ("Exactly—geography explains spread, so don’t average it away!").  
  - **Bridges:** For young economists, end with: "This isn’t against RCTs—it’s a diagnostic toolkit to explain *your* heterogeneity."  
  - **Tone:** For historians, rigor; for agency head, concrete; for philosophers, epistemic humility.  

  This distills your argument into survivable crossfire. Good luck.
