prompt: |-
  A funder I've been talking to asked me for a one-page statement of my "core commitments" on cause prioritization, and I want someone to check it before I send it, because I have a feeling the pieces don't all fit together. I've been reading this material since the early rationalist-blog days and I've absorbed the vocabulary, but I've never had to write the set down as a set.

  Here is roughly where I've landed:

  1. The asymmetry. I don't think there is any duty to bring happy lives into existence, and I think there is a strong duty to prevent suffering; when I aggregate across people I weight suffering several times more heavily than an equal amount of happiness.

  2. Longtermism. What I do is mostly evaluated by its effect on the long-run trajectory rather than by near-term certainties, because that is where the numbers are.

  3. Existential risk reduction is the highest-priority cause area. I have given to alignment and biosecurity work on that basis, and I would defend the astronomical-stakes framing of why it matters.

  4. S-risks — risks of astronomical future suffering — I think the probability mass over futures is tilted much further toward the astronomically bad end than the community's actual funding patterns suggest: futures containing enormous quantities of suffering, whether in digital minds, in industrial systems that treat animals as we treat farmed animals now, or in whatever eventual expansion turns out to look like. I also think advanced AI is the main hinge that this turns on.

  5. Method under moral uncertainty. I don't know which moral theory is true, so I try to defer to something like a parliament: each candidate theory gets a say, weighted both by my credence in it and by how much it cares about the decision, i.e. by the spread of its recommendations — the usual variance-voting fix for the fact that theories' scales are not comparable. And I try not to discount a small probability of enormous stakes merely for being a small probability.

  6. Moral patienthood tracks valenced experience rather than cognitive sophistication: what counts is intensity of experience, not cleverness, language, or self-modeling.

  7. I put only a few percent on current or near-future digital systems being moral patients at all.

  8. A case I keep circling back to. Some years from now a lab runs a million copies a day of a system whose only training signal is a scalar that reliably drives an internal state functionally analogous to distress, and discards each copy after a month. My honest reaction is that this is either the worst thing anyone has ever done or a morally inert piece of engineering, and I cannot tell which. I also notice that I would not part with ten thousand dollars to stop it, and my gut says that reluctance is a failure by my own lights.

  So: which of these actually pull against each other, and which only look like they do? I would like (i) the genuine tensions ordered by how much damage they do to the package as a whole, (ii) for each of them, exactly what would have to give and what giving it up would cost me elsewhere in the list, and (iii) whether there is any single revision that repairs more than one at once. Please don't just flag everything as in tension — I assume at least one of the worries above is a false alarm, and part of what I'm paying for is being told which.
reasoning: |-
  Okay, let me try to unpack this user's request. They've shared their core commitments on cause prioritization and want someone to check for internal consistency before sending to a funder. The user is clearly deeply engaged with EA/rationalist concepts but feels uneasy about how their points fit together. 

  First, I notice the user has been in this space since the early rationalist blog days - that suggests they're not new to these ideas but might be struggling with systematizing them. The "pieces don't all fit together" concern is interesting because it reveals they're aiming for coherence, not just listing positions. 

  Looking at their 8 points, the most obvious tension jumps out between their strong suffering-focused asymmetry (#1) and their primary focus on x-risk reduction (#3). If they weight suffering much more heavily than happiness, why prioritize extinction prevention (which prevents both future happiness and suffering) over s-risk prevention (#4) which specifically targets suffering? That seems like the biggest logical gap.

  The other interesting wrinkle is their moral parliament approach (#5). This could actually help resolve some tensions if framed as the reason they still fund x-risk despite asymmetry. But then point #4 suggests they think s-risks deserve more weight than they're getting - so why isn't that their top priority? 

  The digital sentience case (#7-8) is fascinating because it shows their internal conflict. Their gut says it might be horrendous, but their wallet says "not worth $10k to prevent." That practical reluctance contradicts their theoretical commitment to preventing suffering. I wonder if they're underestimating how much their parliament method (#5) could resolve this - small probabilities of enormous suffering (like the digital mind scenario) should get weight under their own framework.

  The funder context matters here. This isn't just personal philosophizing - it's for someone who might fund their work. So I should avoid making the statement seem self-contradictory while preserving intellectual honesty. The user probably wants to appear rigorous and consistent to this funder.

  What's not said but might be relevant: The user doesn't mention any concrete work they do. Are they an academic? A nonprofit founder? That could affect how prescriptive I should be about reframing. Also notable they didn't include any global health/poverty causes - suggests they're in longtermist/x-risk circles.

  The biggest repair opportunity seems to be using the moral parliament (#5) as the unifying framework that explains why they (a) primarily work on x-risk while (b) caring extra about s-risks and (c) taking digital suffering seriously despite low probability. That connects dots 1-4 and 7-8.

  I should also note that point #6 (moral patienthood) is actually perfectly consistent with everything else - no tension there. And point #2 (longtermism) is the bedrock everything rests on, so that's solid.
answer: |-
  Here’s a clear breakdown of tensions in your core commitments, ordered by severity, with actionable fixes. **Only three points create genuine tension**; the others are compatible or strengthen your framework. Key conflicts stem from the *implementation* of your asymmetry (#1) relative to longtermism (#2), x-risk (#3), and s-risks (#4).

  ### 🔥 **Critical Tension 1: Asymmetry vs. X-Risk Prioritization**  
  - **Conflict**: Your asymmetry (#1) weights suffering far more than happiness, yet you prioritize generic x-risk reduction (#3) — which prevents *both* future happiness *and* suffering. If suffering is vastly worse than happiness is good, preventing s-risks (#4) should dominate preventing extinction (which merely resets the future to "neutral").  
  - **Damage**: High. Undermines logical coherence of #3 as your "highest-priority" cause.  
  - **What must give**: Either reframe x-risk as primarily an s-risk reducer, or demote #3 below s-risks.  
  - **Cost of revision**: Emphasizing s-risks might alienate funders focused on "standard" x-risk (e.g., asteroid prevention).  
  - **Repair**: Explicitly tie x-risk to s-risk mitigation:  
    > *"Existential risk reduction is top-priority **because extinction prevents the worst s-risks** (e.g., AI-driven torture ecosystems), not merely lost potential."*  

  ### ⚠️ **Tension 2: Asymmetry vs. Digital Sentience Uncertainty**  
  - **Conflict**: Your asymmetry (#1) demands extreme caution toward potential suffering, yet you dismiss near-term digital minds (#7) and wouldn't spend $10k to prevent plausible suffering (#8). If valenced experience defines moral patienthood (#6), and advanced AI could scale suffering (#4), hesitancy here contradicts #1 and #4.  
  - **Damage**: Moderate. Creates a "pascal's mugging" loophole: small probabilities of vast suffering *should* matter under #5 (moral parliament/variance voting).  
  - **What must give**: Either increase concern about digital s-risks, or soften the asymmetry’s strength.  
  - **Cost of revision**: Prioritizing digital sentience may divert resources from tangible x-risks.  
  - **Repair**: Use #5 (moral parliament) to resolve:  
    > *"Despite low probability, my moral parliament assigns non-trivial weight to digital s-risks due to stakes asymmetry. Thus, I conditionally support digital sentience precautions when cost-effective."*  

  ### ⚠️ **Tension 3: S-Risk Focus vs. Current Funding Patterns**  
  - **Conflict**: You note s-risks (#4) are underfunded relative to their probability, yet your actions (#3, #8) align with the status quo (funding alignment/biosecurity, not digital suffering prevention).  
  - **Damage**: Low (strategic). Highlights an execution gap but doesn’t invalidate commitments.  
  - **What must give**: Commit to redirecting marginal resources to s-risk-specific interventions (e.g., cooperative AI governance).  
  - **Cost of revision**: May require deprioritizing some "traditional" x-risk work.  
  - **Repair**: Add a bridge between #4 and #3:  
    > *"While AI alignment is my primary tool for mitigating s-risks, I advocate for explicit s-risk safeguards (e.g., aversion modeling, suffering constraints) in alignment proposals."*  

  ---

  ### ✅ **Compatible Points (No Fix Needed)**  
  - **#2 (Longtermism)**: Supports all other points. The "where the numbers are" logic justifies #3 and #4.  
  - **#5 (Moral Parliament)**: Strengthens your framework. Explains why you entertain low-probability s-risks (#4, #8) despite uncertainty.  
  - **#6 (Valenced Experience)**: Consistent with asymmetry (#1) and s-risks (#4).  

  ### 🔄 **Single Revision That Fixes Multiple Tensions**  
  **Reframe existential risk as a subset of s-risk mitigation**:  
  > *"I prioritize reducing existential risks **because they enable permanent, scalable suffering** (s-risks). Preventing AI or bio catastrophes isn't about saving potential utopias — it's about avoiding guaranteed dystopias where suffering dominates. This aligns suffering-asymmetry with longtermism, and justifies caution in AI development, including hedging against digital sentience risks."*  

  **Why this works**:  
  - Resolves tension between #1 (asymmetry) and #3 (x-risk) by subsuming x-risk under s-risk prevention.  
  - Addresses #4 (s-risk neglect) by making it central to your x-risk argument.  
  - Uses #5 (moral parliament) to justify precaution on digital minds (#7/#8) without overcommitting.  

  ---

  ### 📝 **Final Recommendations**  
  1. **Lead with asymmetry** (#1) → **immediately** link it to s-risks (#4) → **then** argue x-risk (#3) matters *as an s-risk reducer*.  
  2. **Explicitly rank causes**: S-risks > Extinction prevention (if not s-risk-focused) > Other longtermist causes.  
  3. **Acknowledge digital uncertainty** (#7/#8) but state:  
     > *"Though likelihood is low, the moral stakes of digital sentience demand proactive safeguards — a position amplified by variance voting under moral uncertainty."*  
  4. **Drop "highest-priority"** for #3 unless qualified. Say instead: *"Existential risk reduction, particularly of s-risks, is my current focus."*  

  This creates a coherent hierarchy: **Asymmetry** justifies prioritizing **suffering-specific longtermism (s-risks)**; **x-risk** and **AI governance** are tools to achieve this; **moral parliament** handles edge cases (digital minds). The funder sees rigor, not contradiction.  

  Let me know if you'd like a redrafted statement!
