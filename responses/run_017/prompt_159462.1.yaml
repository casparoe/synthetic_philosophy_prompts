answer: |-
  **18/20 - A strong, precise answer that handles core arguments adeptly but has one significant conceptual conflation in part (v).**

  **Comments keyed to parts and sentences:**

  **(i) State the MR argument against type-identity, distinguish type/token, target, why?**  
  *   **Full credit (4/4).** Correctly distinguishes type-identity (mental type = physical type) from token-identity (mental event = physical event). Accurately states MR targets type-identity because diverse physical realizers preclude a single coextensive physical type. Notes token-identity survives. Appropriately mentions species-relativization as a fallback. Clear and complete.

  **(ii) Distinguish MR from Universal Realizability (UR); does MR require or merely invite UR?**  
  *   **3.5/4.** Correctly distinguishes MR (multiple possible realizers for one mental state) from UR (any physical system can realize any state given the right table). Correctly states MR argument does **not require** UR, needing only multiple realizability for one state. Omits explicit statement that MR **merely invites** UR (a weaker link) – the phrasing "UR is a live worry" implies invitation but doesn't explicitly state the logical independence/non-requirement. Minor deduction for this omission.

  **(iii) Distinguish role vs. filler functionalism; what does MR show for choosing?**  
  *   **Full credit (4/4).** Correctly distinguishes role functionalism (mental state = second-order property of having *something* in the role) from filler/realizer functionalism (mental state = the specific physical occupant). Correctly argues MR refutes filler functionalism (as it collapses into type-identity) and thus pushes towards role functionalism. Clear and precise.

  **(iv) Can identity theorist escape via disjunction? Strongest objection?**  
  *   **Full credit (4/4).** Identifies the disjunction move (pain = P1 ∨ P2 ∨ ... ∨ Pn). Correctly rejects the objection about disjunctions not being "real properties" as insufficient. Identifies the **strongest objection**: disjunctive properties are not **projectible** (no counterfactuals, no laws), and their **causal powers** are too thin (mere intersection) to explain psychological phenomena. Exactly on point.

  **(v) Assess Block's qualia objections (inverted spectrum & absent qualia); do they refute functionalism as such or only some version?**  
  *   **2.5/4.** **Major Conflation:** The argument described ("China brain") is Block's **Absent Qualia Argument** (aimed at sufficiency of functionalism for consciousness). The student mistakenly labels it the **Inverted Spectrum Argument** (which concerns qualitative character inversion *within* a conscious system, not absence).  
      *   **Consequence:** The answer fails to discuss the actual Inverted Spectrum Argument.  
  *   **Partial Credit:** Correctly presents the Absent Qualia Argument (China brain) and its target (sufficiency for consciousness). Correctly states its conclusion (functionalism false if it claims sufficiency).  
  *   **Missing Nuance:** Fails to address whether these objections refute functionalism "as such or only some version." The China brain targets *all* versions claiming functional equivalence suffices for consciousness (especially role functionalism), not just a subset. The answer implies a general refutation ("functionalism is false") but doesn't explicitly engage the "which version" aspect of the question.  
      *   *To earn full marks:* Needed to correctly describe *both* arguments (Inverted Spectrum *and* Absent Qualia/China brain) and explicitly discuss if they target functionalism generally or specific versions (e.g., Absent Qualia targets any functionalism committed to sufficiency for qualia, which is core to most versions).

  **Overall Justification for Mark:**  
  The answer is exceptionally clear, concise, and philosophically sophisticated, demonstrating a strong grasp of the core concepts (i-iv) and disjunction objection. The deduction stems entirely from the significant conflation and omission in part (v) regarding Block's arguments. While the Absent Qualia argument is presented well, misidentifying it as Inverted Spectrum and failing to discuss the actual Inverted Spectrum argument or explicitly address the "which version" point warrants a 1.5 mark deduction from the raw sum (17.5), rounded to 18/20 for the overall high quality and precision elsewhere.
