      But then in a symmetric equilibrium, we can have both players choosing MirrorBot and getting R, which is better than the expected payoff of both choosing RandomBot (which is p*R+(1-p)*P < R if p<1). Therefore, in an evolutionary setting, MirrorBot would outperform RandomBot.

