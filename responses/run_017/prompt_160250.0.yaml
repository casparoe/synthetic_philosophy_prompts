  The key is to argue that in the real world, when autonomous agents interact, they often have the ability to inspect each other's code (if it is made available) and to simulate each other. Therefore, the program submission version of the game is more realistic for the setting of AI systems that are transparent. The classic prisoner's dilemma assumes that the players choose actions without knowing the other's choice and without the ability to condition their action on the other's decision procedure. But if we allow the agents to condition their actions on the opponent's entire decision procedure (by reading the source code), then the game changes. However, the dilemma is dissolved in this new setting, and that is the point: by designing the interaction mechanism appropriately (with source code sharing and the ability to simulate), we can turn a dilemma into a situation where cooperation is the dominant outcome.

