prompt: |-
  hey — I'm a data engineer. I live in SQL, schema design, entity resolution across instances, migrations, that sort of thing. I've been sitting in on a philosophy reading group (my partner's, I have no background in it) and they got onto Kripke: rigid designators, the necessary a posteriori, all of that. I have this hunch that the whole debate is basically primary keys versus views, and I genuinely can't tell whether that's an insight or whether I'm flattening something important.

  So: do the translation as carefully and as unsympathetically as you can, in the vocabulary I actually use — schemas, rows, primary keys versus descriptive queries and materialised views, instances of a database, constraints and integrity checks, and the difference between what you can read off the DDL without looking at a single row and what you have to go inspect the data to find out. Translate, one at a time:

  1. the descriptivist picture — a name like "Hesperus" gets its referent via a description (the brightest thing visible in the evening sky, say), so what it picks out depends on how things happen to be;
  2. rigid designation — the name picks out the same object with respect to every counterfactual situation, not just the actual one;
  3. the argument that if two rigid designators each pick out something and it's the same something, then the identity has to hold in every counterfactual situation too;
  4. the necessary a posteriori — that identity is necessary, and yet you have to go out and look to find out whether it's true;
  5. the mirror-image case, the contingent a priori — the metre bar in Paris, where someone who fixes the reference by pointing at it can know its length without measuring anything, even though the bar could easily have been a different length.

  For each: what carries over cleanly, what only carries over if I squint or tweak it, and what I simply cannot say in my vocabulary at all. Then the residue report, which is the part I actually care about. What's left over, and is the leftover my problem (schemas-and-instances just can't represent it) or theirs (the distinction was never as crisp as it gets made out to be)?

  Two places where I suspect the translation is cheating — tell me if I'm right: (a) cross-instance identity. For me, whether row 7 in instance A is "the same row" as row 9 in instance B is exactly what I decide when I design a key, so I suspect the translation is quietly answering a question that Kripke gets to treat as primitive. (b) "possible instance" versus "possible world". My instances are things that exist and that I could in principle query; his worlds are counterfactual and most of them never get materialised. Does that difference do any real work, or is it idle?

  And here's the case from my actual job that started this. We have a table of astronomical objects with UUID primary keys, and separately a view defined as *the brightest object visible in the evening sky*, which happens to return the row with one particular UUID. A colleague says the view is just another name for that row. I think Kripke would say no, but I can't explain why in language that would survive a standup. Related: last year we did a migration where every UUID got remapped to a new one, and half the team is now convinced that means the rows "aren't really the same objects any more". I think that's confused and I can't say why, and I have a feeling it's the same confusion as in (a) — but if it's a different confusion, say so.

  Oh, and one more: is there anything in a setup like mine that could even *be* a contingent a priori truth, or is that one never going to show up in a database?

  If my hunch that this is all keys versus views is shallow, say so and tell me exactly where it goes shallow.
reasoning: |-
  We are going to translate Kripkean concepts into database vocabulary step by step.

   1. **Descriptivist picture**: 
      - In philosophy: A name like "Hesperus" refers to an object by virtue of satisfying a description (e.g., "the brightest object in the evening sky"). The referent can change if the facts change.
      - Database translation: A view defined by a query (e.g., `SELECT * FROM astronomical_objects ORDER BY evening_brightness DESC LIMIT 1`) would be the descriptivist approach. The row returned by this view depends on the current data in the table. If the data changes (e.g., a brighter object appears), the view returns a different row.
      - What carries over cleanly: The view is defined by a description (the query) and what it picks out (the row) depends on the current state of the database (the "world").
      - What requires squinting: In philosophy, the description is associated with the name by linguistic practice. In databases, the view is explicitly defined by a query. But the idea of reference by description is analogous.
      - What cannot be said: The philosophical notion involves how language works and how people use the name. The database view is a technical object.

   2. **Rigid designation**:
      - In philosophy: A rigid designator refers to the same object in every possible world (counterfactual situation). For example, "Hesperus" as a rigid designator always refers to the planet Venus, even in worlds where Venus is not the brightest evening object.
      - Database translation: A primary key (like a UUID) is rigid. It refers to the same row in every possible state of the database (every possible instance of the table). Even if the data in the row changes (e.g., its brightness changes) or if we consider a different database instance (a backup, a snapshot, or a hypothetical state), that UUID still designates that row (if it exists in that instance).
      - What carries over cleanly: The primary key is fixed and does not change its reference based on the data. It is assigned once and remains the same.
      - What requires squinting: The philosophical notion of "every possible world" is broader than database states. We are considering only the states of the database, not the entire universe. Also, in databases, the row might not exist in a particular instance (so we have to consider only instances where the row exists, but the key is still rigid for that row when it exists).
      - What cannot be said: The modal aspect of "all possible worlds" is reduced to "all database instances (past, present, future, hypothetical) that contain the row". The philosophical notion is about metaphysical possibility, while the database is constrained by the schema and the data we have.

   3. **Identity of rigid designators**:
      - In philosophy: If two rigid designators (say "Hesperus" and "Phosphorus") designate the same object in the actual world, then they designate the same object in every possible world. So the identity statement "Hesperus = Phosphorus" is necessarily true if true at all.
      - Database translation: If two primary keys (say UUID1 and UUID2) are found to refer to the same row in the current database instance (say by a join on the primary key that returns a row), then in every database instance (past, future, or hypothetical) where both UUIDs exist, they must refer to the same row? But note: in a database, two different primary keys cannot refer to the same row because of the uniqueness constraint. So this doesn't directly map. Instead, consider two rigid designators for the same row: 
          - Example: We have a row with UUID `abc`. We have two references: 
              - A primary key reference: `abc`
              - Another rigid designator? But in a database, the only rigid designators are the primary keys and foreign keys that point to them? 
          - Alternatively, we might have two names (aliases) for the same primary key? But then they are the same key. 
          - How about: In the database, we might have two different UUIDs that we have determined refer to the same real-world entity (via entity resolution). But then we have a mapping. However, the identity of the row (as a row) is by primary key. 
          - Revised: Suppose we have two rigid designators that we have established in the actual instance refer to the same row. But if they are both primary keys, they can't be two and refer to the same row. So let's consider: 
              - We have a table with a primary key (UUID) and a column "alternate_key". We have two rigid designators: 
                  - Designator D1: the primary key value `abc`
                  - Designator D2: the value in the alternate_key column of the row that has primary key `abc` (say `xyz`). But note: D2 is not a primary key, so it might not be rigid? 
          - Instead, we can think of two ways to refer to the same row: 
              - Directly by primary key: `abc`
              - By a unique attribute that is rigid? But attributes can change. 
          - So let's reframe: In a database, if we have two rigid designators that are both primary keys (of the same row? but that's impossible) or of two rows that we have merged? This is tricky.

      - Alternative: Consider two views that are defined as rigid? But views are not rigid. 
      - Better: The identity of the row is fixed by its primary key. If we have two different primary keys that we have determined (via an entity resolution process) are the same entity, then we have a cross-reference table. But then the identity of the real-world entity is not the same as the identity of the row. 
      - What carries over: If we have a row and we assign it a primary key, then any rigid reference to that row (via its primary key) will always be to that row in every instance. But we don't have two rigid designators for the same row in the same table. 
      - What requires squinting: We might think of two tables that have foreign keys to the same row. Then the foreign key values (if they are the same) are rigid for that row? But the foreign key is just a copy of the primary key. So if we have `TableA.uuid` and `TableB.astronomical_object_uuid` both being `abc`, then they both rigidly designate the same row (if they are set to the same value). And if in the actual instance they are equal, then in every instance they will be equal if they are set to the same value? But note: the foreign key might change independently? 
      - Actually, the rigidity of the foreign key is inherited from the primary key. But the foreign key value in a particular row might be updated to point to a different row. So it is not rigid? 
      - Therefore, the clean analogy is only for the primary key. And we cannot have two distinct primary keys for the same row. So the identity of rigid designators in the sense of two different names for the same thing doesn't arise in the same way. 
      - What cannot be said: The philosophical argument is about two different names (in language) that are both rigid and co-refer. In the database, we don't have two different primary keys for the same row. We might have two different rows that we have determined represent the same real-world entity, but then we are talking about the real-world entity, not the row. 

   4. **Necessary a posteriori**:
      - In philosophy: An identity statement like "Hesperus = Phosphorus" is necessarily true (if true at all) but known a posteriori (by empirical investigation).
      - Database translation: An identity statement between two rigid designators (primary keys) would be that two primary keys are the same? But again, two primary keys in the same table cannot be the same and also cannot refer to the same row. 
          - Instead, consider: We have two views that we have determined return the same row. 
          - Example: 
              - View1: `SELECT * FROM astronomical_objects ORDER BY evening_brightness DESC LIMIT 1` (Hesperus)
              - View2: `SELECT * FROM astronomical_objects ORDER BY morning_brightness DESC LIMIT 1` (Phosphorus)
          - In the actual database instance, they both return the row with UUID `abc`. So we can say: the object returned by View1 is the same as the object returned by View2. 
          - But note: the views are not rigid. In a different database instance (with different data), they might return different rows. 
          - However, the identity of the row in the actual instance is that it is row `abc`. And row `abc` is necessarily self-identical (in every instance where it exists, it is the same row). But the fact that the two views return the same row in the actual instance is contingent. 
          - The necessary truth is: the row with UUID `abc` is identical to itself. But that's trivial. 
          - The non-trivial necessary a posteriori truth in the database context: 
              - Statement: "The astronomical object that is the brightest in the evening is the astronomical object that is the brightest in the morning." 
              - This is necessary? In the actual instance, they are the same row. But in a counterfactual instance, they might be different. 
          - How to get necessity? If we fix the actual row (by its UUID) then we can say: 
              - In the actual world, the row with UUID `abc` is both the brightest in the evening and the brightest in the morning. 
              - But then we are not making an identity statement between two designators, but attributing two properties to the same row. 
          - Alternatively, we can say: 
              - Let D1 be the rigid designator (the primary key) for the row that is the brightest in the evening in the actual world (say `abc`).
              - Let D2 be the rigid designator for the row that is the brightest in the morning in the actual world (say `abc`).
              - Then the identity statement: D1 = D2 (which is `abc = abc`) is necessarily true (trivially). 
          - But we found out a posteriori that in the actual world, the same row is the brightest in both. 
          - This works: the identity of the row (via its primary key) is necessary and trivial, but we had to look at the data to know that the two descriptions (the views) picked out the same row. 
      - What carries over: The trivial necessary identity `abc = abc` is known a priori. But the non-trivial fact that the two descriptions pick out the same row is a posteriori. And once we fix the rigid designators (the primary keys) for the actual row, then the identity of the row with itself is necessary. 
      - What requires squinting: We are using the primary key to rigidly designate, and then the identity is trivial. The non-trivial part is that the two descriptions co-refer in the actual world. 
      - What cannot be said: The philosophical necessary a posteriori identity is non-trivial. Our translation makes the identity trivial and the co-reference contingent. But Kripke's point is that the identity statement itself (when the two names are rigid) is necessary. And that is captured: once we have the rigid designators (the primary keys) and they are the same, then the identity is necessary.

   5. **Contingent a priori**:
      - In philosophy: The standard example is the meter bar in Paris. The reference of "one meter" is fixed by the description "the length of the meter bar in Paris at time t". So we can know a priori that the meter bar is one meter long (by definition). But it is contingent because the bar could have been a different length (if it had been heated, for example).
      - Database translation: We fix a reference by an actual datum. For example, we define a constant `ONE_METER` as the length of a particular row in a table (say the row for the meter bar in Paris). 
          - We might have a table `units` with columns (id, unit_name, length_in_meters). We define:
              - `ONE_METER := (SELECT length_in_meters FROM units WHERE unit_name = 'meter bar in Paris')`
          - Then we can know without looking (a priori) that the length of the meter bar in Paris is `ONE_METER`. 
          - But if we update the row (say change the `length_in_meters` due to an error), then the value of `ONE_METER` changes. 
          - However, the philosophical point is that the bar could have been a different length in a counterfactual situation. In the database, we can have a backup where the `length_in_meters` was different? 
          - But note: the definition is tied to the actual database state. 
      - What carries over: We fix the reference by an actual query. We know a priori that the meter bar is one meter long (by the definition we set up). But it is contingent because the data might change (or in a different instance, it might be different). 
      - What requires squinting: In the database, the a priori truth is only true relative to the current state (or the state at the time of definition). In philosophy, the contingency is about how the world could have been. 
      - What cannot be said: The philosophical notion involves a definition that is fixed in the actual world and then we consider counterfactual worlds where the bar is a different length. In the database, we can simulate counterfactual states by having different instances, but the definition of `ONE_METER` is tied to the actual instance.

   Residue report:

   The translation works reasonably well for rigid designation (primary keys) and descriptivism (views). The necessary a posteriori and contingent a priori also have analogies, but they are not perfect.

   Where the analogy is strained:

   (a) Cross-instance identity: 
      - You are right that in databases, cross-instance identity (whether row 7 in instance A is the "same" as row 9 in instance B) is decided by the key design. This is analogous to Kripke's rigid designation because the primary key is what we use to track the same entity across instances. But note: in philosophy, the identity of the object (Venus) is primitive and we use the name to track it. In databases, we assign the key arbitrarily (UUID) and then it is fixed. The residue: the philosophical notion does not require an arbitrary assignment; the object is the same by its own nature. But for practical purposes, the key serves as a rigid designator.

   (b) Possible instance vs. possible world:
      - In databases, a possible instance is a state the database could be in (past, future, or hypothetical). In philosophy, a possible world is a way the entire universe could be. The difference is one of scope. However, for the purpose of the analogy (within the domain of the database), the possible instances serve as possible worlds. The work it does: when we say a rigid designator refers to the same row in every possible instance, we mean every instance that contains that row. But in philosophy, the rigid designator refers to the same object in every possible world in which that object exists. The analogy holds.

   Your two suspicions:

   (a) Cross-instance identity: 
      - You suspect that you are deciding the identity by the key, while Kripke treats it as primitive. This is correct. In the philosophical picture, the object has an identity independently of our naming practices. In the database, we impose an identity (via the key) for practical purposes. So the residue is the metaphysical grounding of identity.

   (b) Possible instance vs. possible world:
      - The difference is one of scope, but within the database domain, the analogy is appropriate. The work it does: when we consider a counterfactual instance, we are considering a state of the database that could have been (if the data were different). Kripke's possible worlds are also counterfactual. The fact that we can query only actual instances doesn't harm the analogy because we can model counterfactual instances.

   Your case at work:

   - You have a table with UUID primary keys and a view defined as the brightest object in the evening sky, which happens to return a particular row (say UUID `abc`). 
     - Your colleague: the view is just another name for that row.
     - You (with Kripke): no, because the view is a description and might return a different row if the data changes. The primary key `abc` is rigid: it always refers to that row (if it exists). The view is non-rigid.

   - Migration with UUID remapping:
     - Half the team: the rows "aren't really the same objects any more".
     - You think that's confused. Why? Because the UUID is just a label. The real-world entity that the row represents is the same. The UUID change is a re-labeling. But note: in the database, the row is identified by the UUID. So after the migration, the row in the new table with the new UUID is a different row (by the database's own identity condition) unless you have a way to map them. 
     - However, if you have a mapping from old UUIDs to new UUIDs, then you can say that the row in the old instance and the row in the new instance represent the same real-world entity. But the row itself (as a database row) is not the same because it has a different primary key. 
     - This is where the confusion lies: 
          - The row (as a database entity) is defined by its primary key. So after changing the UUID, it is a different row. 
          - But the real-world entity that the row represents is the same. 
     - So the team might be confusing the row with the real-world entity. 
     - How to explain: The UUID is an arbitrary identifier. We changed the identifier, but the object in the sky that the row describes is the same. The view that picks the brightest object might still pick the same real-world object (if we haven't changed the brightness data) but now it returns a row with a different UUID. 

     - The confusion is related to (a): cross-instance identity. We have two database instances (before and after migration). We decide that a row in the old instance and a row in the new instance represent the same real-world entity by a mapping (which is like a cross-instance foreign key). The primary key within an instance is rigid for that instance, but across instances we need a mapping.

   Contingent a priori in your database:

     - We can have a contingent a priori truth in the database. Example: 
          - We define a constant `HESPERUS_UUID` by the query: `SELECT uuid FROM astronomical_objects WHERE is_hespetus = TRUE` (or by a view). Then we can know a priori that the row identified by `HESPERUS_UUID` is Hesperus (by definition). But it is contingent because we might change which row has `is_hespetus` set to TRUE. 
          - Alternatively, we fix the reference by a description: 
              `HESPERUS_UUID := (SELECT uuid FROM astronomical_objects ORDER BY evening_brightness DESC LIMIT 1)`
          - Then we can know a priori that the row with UUID = `HESPERUS_UUID` is the brightest in the evening (in the current instance). But it is contingent because tomorrow it might be a different row.

     - So yes, we can have contingent a priori truths in the database.

   Is the hunch shallow?

     - The hunch (primary keys = rigid designators, views = descriptive references) is not shallow. It captures a core insight. However, the analogy breaks at the edges because:
          - The database is a constructed representation, while Kripke is talking about language and metaphysics.
          - The identity of real-world objects is not arbitrary (like UUIDs) but grounded in the objects themselves.
          - The scope of possibility is limited to the database state.

     - But for practical purposes within the domain of data engineering, the analogy is powerful and can clarify many confusions (like the one in your team).

  Final note: In the migration case, the row (as a database row) is not the same because the primary key changed. But the real-world object is the same. The team's confusion is between the representation and the referent. Kripke would say that the name (the UUID) is a rigid designator for the real-world object? But in the database, the UUID is a rigid designator for the row, and the row represents the object. So we have two levels of reference: the row represents the object, and the UUID designates the row. This is a two-level system that doesn't exist in Kripke's direct reference. Therefore, the residue is the representation relation between the row and the real-world object.

  So to answer your standup: 
     - The view is not just another name for the row because the view is defined by a description that may pick different rows in different circumstances. The primary key is the rigid identifier for that row. 
     - In the migration, the rows are different (because they have different primary keys) but they represent the same real-world objects. The UUID change is a change of label, not a change of the object represented.

  This should help clarify.
answer: |-
  ### Translation of Kripkean Concepts into Database Vocabulary  
  I'll translate each concept rigorously using your terminology (schemas, rows, keys, views, etc.), then flag what works, what requires squinting, and what breaks. Finally, I'll address your residual questions and the job case.

  ---

  #### **1. Descriptivist Picture**  
  *Philosophy*: "Hesperus" refers to whatever satisfies a description (e.g., "brightest evening object"). Reference depends on contingent facts.  
  *Database Translation*:  
  - A **view** (e.g., `CREATE VIEW Hesperus AS SELECT * FROM objects ORDER BY evening_brightness DESC LIMIT 1`) acts as the description.  
  - The referent (row) depends on current data. If data changes, the view returns a different row.  

  | Aspect               | Status                                                                 |
  |----------------------|------------------------------------------------------------------------|
  | **Carries Over**     | Clean: Views are definitionally descriptive. Reference is data-dependent. |
  | **Requires Squinting** | "Description" in philosophy is linguistic; a view is a technical query. |
  | **Cannot Translate** | Philosophers assume descriptions are how language *works*. Databases impose no such constraint. |

  ---

  #### **2. Rigid Designation**  
  *Philosophy*: A name (e.g., "Hesperus") refers to the same object in all possible worlds.  
  *Database Translation*:  
  - A **primary key (UUID)** rigidly designates a row. It points to the same row across:  
    - Schema versions (if the row exists).  
    - Database instances (e.g., prod vs. backup).  
    - Hypothetical states (e.g., data snapshots).  

  | Aspect               | Status                                                                 |
  |----------------------|------------------------------------------------------------------------|
  | **Carries Over**     | Clean: UUIDs are immutable row identifiers. Survives data/schema changes. |
  | **Requires Squinting** | "All possible worlds" ≈ "all database instances/snapshots where the row exists". |
  | **Cannot Translate** | Possible worlds are metaphysical; database instances are concrete/hypothetical but finite. |

  ---

  #### **3. Identity of Rigid Designators**  
  *Philosophy*: If two rigid designators (e.g., "Hesperus" and "Phosphorus") refer to the same object, this identity holds necessarily.  
  *Database Translation*:  
  - If two UUIDs (e.g., `uuid_hesp` and `uuid_phos`) resolve to the same row (e.g., via a join), then:  
    ```sql
    -- This holds in all instances/snapshots where both rows exist:
    WHERE uuid_hesp = uuid_phos
    ```  
  - **Constraint**: Enforced via schema (e.g., `PRIMARY KEY` uniqueness).  

  | Aspect               | Status                                                                 |
  |----------------------|------------------------------------------------------------------------|
  | **Carries Over**     | Clean: UUID equality is necessary if true (due to key constraints). |
  | **Requires Squinting** | Only holds if rows exist in the instance. Philosophers assume existence is given. |
  | **Cannot Translate** | Kripkean necessity is logical; database "necessity" is constraint-enforced. |

  ---

  #### **4. Necessary A Posteriori**  
  *Philosophy*: "Hesperus = Phosphorus" is necessary but known empirically.  
  *Database Translation*:  
  - **Necessary**: UUID equality is rigid (as above).  
  - **A Posteriori**: Requires querying data to confirm:  
    ```sql
    -- Must inspect rows to verify:
    SELECT * FROM Hesperus_view 
    INTERSECT 
    SELECT * FROM Phosphorus_view;
    ```  

  | Aspect               | Status                                                                 |
  |----------------------|------------------------------------------------------------------------|
  | **Carries Over**     | Clean: UUID identity is rigid; descriptive views require data inspection. |
  | **Requires Squinting** | "Necessity" is confined to the schema’s constraints. |
  | **Cannot Translate** | Philosophical necessity transcends systems; database necessity is schema-bound. |

  ---

  #### **5. Contingent A Priori**  
  *Philosophy*: "The Paris meter bar is 1m long" is knowable without measurement (a priori) but could have been false (contingent).  
  *Database Translation*:  
  - Define a **reference constant** tied to a specific row:  
    ```sql
    ALTER TABLE units ADD ref_unit UUID DEFAULT 'meter_bar_uuid';
    ```  
  - Know a priori that `ref_unit` refers to the meter bar.  
  - **Contingent**: The bar’s length could change (data update), or the reference could be remapped.  

  | Aspect               | Status                                                                 |
  |----------------------|------------------------------------------------------------------------|
  | **Carries Over**     | Clean: Reference-fixing (e.g., `DEFAULT`) is a priori; data changes make it contingent. |
  | **Requires Squinting** | "A priori" ≈ "defined in schema without data lookup". |
  | **Cannot Translate** | The philosophical version relies on linguistic acts; databases lack intentionality. |

  ---

  ### Residue Report: What’s Left Over?  
  Your hunch (**primary keys ≈ rigid designators**, **views ≈ descriptivist references**) **is not shallow**—it captures 90% of the debate. But there’s irreducible residue:  

  1. **Cross-Instance Identity (Your Suspicion (a))**  
     - **Where Translation Cheats**: You decide cross-instance identity via keys (e.g., mapping UUIDs during migration). Kripke treats object identity as *primitive* (Venus is Venus across worlds).  
     - **Residue**: In databases, identity is **conventional** (you define keys). In philosophy, identity is **metaphysical** (objects are self-identical).  
     - **Whose Problem?** Yours: Schemas can’t represent "primitive" identity. But this is a strength—it avoids philosophical baggage.  

  2. **Possible Instances vs. Worlds (Your Suspicion (b))**  
     - **Where Translation Cheats**: Database "possible instances" are materializable (backups, snapshots). Kripkean worlds are *counterfactual* (non-actualized scenarios).  
     - **Residue**: Databases lack true counterfactuals (e.g., "What if Venus orbited Mars?").  
     - **Whose Problem?** Theirs: Most analytic debates ignore the materializability gap. Your setup loses nothing.  

  ---

  ### Your Job Case: UUIDs, Views, and Migration  
  #### Case 1: "The view is just another name for that row."  
  - **Your Colleague**: Wrong.  
  - **Why (Kripkean)**:  
    - The **UUID** is rigid: Always points to *that row*, even if data changes (e.g., brightness drops).  
    - The **view** is descriptive: If a brighter object appears, it points elsewhere.  
  - **Database Reason**: Views re-run queries; keys are stable.  
  - **Standup Explanation**:  
    > "The UUID pins the row like a social security number pins a person. The view is a Google search for ‘brightest object’—it’s context-dependent and can change."  

  #### Case 2: Migration & UUID Remapping ("Not the same objects")  
  - **Your Team**: Confused.  
  - **Why**:  
    - **Database Level**: After remapping, new UUIDs denote *new rows* (per schema rules).  
    - **Real-World Level**: Rows represent the same astronomical objects (entity resolution wins).  
  - **Core Confusion**: Mixing **row identity** (defined by keys) with **referential identity** (what the row represents).  
  - **Standup Explanation**:  
    > "UUIDs are license plates, not cars. Remapping plates doesn’t change the cars in the garage. Entity resolution ensures we’re tracking the same real objects."  

  ---

  #### Contingent A Priori in Your Database  
  **Yes, it exists**:  
  - Define a reference constant in the schema (e.g., `CONSTANT hesperus_uuid UUID DEFAULT 'abc123';`).  
  - You know a priori that `hesperus_uuid` refers to the row with UUID `abc123`.  
  - **Contingent**: If the row is deleted or remapped, the reference breaks.  

