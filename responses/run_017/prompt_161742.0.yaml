  ### Pantoum Epigraph: "Allocation Committee Minutes"

  **Winter Quarter Decisions**  

  The children's ward is waiting for a bed.  
  The clinic on the hill retains its surplus.  
  Cutting the tall tree down to match the struggling sapling leaves no one better off.  
  The river swallowed twelve streets last week.  

  The clinic on the hill retains its surplus.  
  We divert funds to tents on flooded ground.  
  The river swallowed twelve streets last week.  
  A meal matters more in an empty stomach.  

  We divert funds to tents on flooded ground.  
  The children's ward will keep its thin allowance.  
  A meal matters more in an empty stomach.  
  But the surplus must now be pared to nothing.  

  The children's ward will keep its thin allowance.  
  Without relief, we drain the hill’s reserve.  
  But the surplus must now be pared to nothing.  
  Ice glazes every path to the infirmary.  

  Without relief, we drain the hill’s reserve.  
  Cutting the tall tree down to match the struggling sapling leaves no one better off.  
  Ice glazes every path to the infirmary.  
  The children's ward is waiting for a breath.  

  ---

  ### Notes for the Author  
  1. **Form & Structure**:  
     - Five quatrains, 20 lines, 142 words.  
     - Pantoum repetition: Lines 2/4 of each stanza become lines 1/3 of the next. The opening line ("The children's ward...") returns altered in the finale ("waiting for a *breath*" instead of "bed").  

  2. **Philosophical Nuance**:  
     - **Line 3 (and 19)**: *"Cutting the tall tree... leaves no one better off"* rejects pure leveling-down (taking from better-off without aiding others).  
     - **Line 8 (and 11)**: *"A meal matters more in an empty stomach"* affirms priority to the worse-off (gains weighted by absolute disadvantage).  
     - **Stanza 2** shows a *required* transfer: surplus diverted to flood victims (worse-off gain despite reduced surplus).  
     - **Stanza 5** shows *rejected* leveling: draining the reserve without aiding anyone (total well-being falls, no benefit).  

  3. **Committee Imagery**:  
     - Concrete terms: *ward, clinic, surplus, flooded ground, tents, allowance, infirmary*.  
     - Avoids ethical jargon ("prioritarian," "utility," etc.).  

  4. **Silent Distinction**:  
     - Line 19’s repetition of the leveling-down charge now answers stanza 4’s context: "Without relief, we drain..." (no gain).  
     - The final quatrain isn’t a resolution: the children’s ward deteriorates ("breath" implies life-threatening need), yet the cut to the clinic’s reserve benefits no one.  

  5. **Audibility & Legibility**:  
     - Flows naturally in a meeting scene. An ethicist would note stanza 2 validates the philosopher’s view (targeted gain), while stanza 5 invalidates the leveling-down charge against her.  

  The returning lines shift meaning: "surplus" transforms from hoarded resource (stanza 1) to a lifeline denied (stanza 5), mirroring how conviction bends between policy and suffering.
