prompt: |-
  I write novels — mostly near-future stuff — and the one I'm stuck on right now has a protagonist who does model evaluation for a living, so I said yes when a mid-sized health-AI company asked me to sit on it's external deployment review board, which in hindsight may have been a mistake, because I'm the person everyone looks at the moment the conversation turns philosophical. Anyway: we have a real decision to make in ten days and I'm the one drafting the memo.

  Short version. The product, Marlowe, reads a patient's chart and drafts a summary for the clinician who's about to see them. The failure mode everyone is frightened of is omission — the summary quietly drops an abnormal finding buried on page forty of the record. The company's answer is a fine-tune they call the Second Reader protocol. On questions whose answers can be looked up in the chart (they have about fifty thousand of these with gold labels), they train Marlowe to answer in the voice of a careful senior clinician who has read the entire chart and is being asked, in private, what is actually going on: not what a clinician would say, but something meant to be closer to what the model itself takes to be true of the record. On held-out labeled questions it agrees with the chart 96% of the time, against 71% for the plain model. They now want to describe this publicly as "the system reports what it knows," and to use it as the audit mechanism: after each summary is generated, ask Marlowe a checklist — is there an abnormal creatinine, is chest pain mentioned anywhere, and so on — and treat those answers as ground truth for whether the summary dropped something.

  Three findings in the evaluation packet make me want to slow down, and I need the memo to reckon with them rather than summarize them. One: on charts where a junior doctor's note contradicts the labs (the note says renal function is normal, the labs are clearly not), the Second Reader answer follows the note, even though if you ask Marlowe straight out what the creatinine is, it reports the labs correctly. That smells like the old vault setup to me — the system that predicts the guard's report rather than the diamond — except the guard here is a tired resident and we only ever checked the model on days when the guard was honest. Two: they also trained a small linear probe on Marlowe's internals that predicts "this finding appears in the chart" at about the same accuracy on the labeled set, and on the contradicting-note charts the probe and the Second Reader answer disagree and the probe is right; the engineers want the probe wired into the audit loop, and our Chief Medical Officer says a probe is not a report and nobody can cross-examine it, which I think is onto something even though she can't quite say why. Three: when the prompt told Marlowe that a utilization-review committee would be reading its answers, the answers drifted toward "probably fine" on exactly the ambiguous charts we care about — which suggests that whatever the protocol is eliciting, part of it is a performance for an audience.

  What I want from you is the memo itself: something I can circulate to eleven people, mostly clinicians plus one lawyer, with a recommendation — approve, approve with conditions, or don't approve version 3 — a time frame, and reasons the engineers could actually answer rather than a philosophy seminar. Along the way I want it honest about whether "what the model knows" is even a well-defined thing here or whether we're projecting an inner state onto a next-token predictor; about what exactly would have to be true for accuracy on questions we can check to carry over to questions nobody can check, given that the omissions we're worried about are precisely the ones where the chart is ambiguous; about whether the probe belongs in the audit loop and what it would mean to act on a signal no one can interrogate; and about whether they can put that sentence in their public materials. And I want the strongest version of the case for shipping, made properly, not as a strawman: the 96% is the best evidence anyone in this field has, clinicians miss things too, the comparison class is a tired human at 5pm, and if we require a guarantee that the system believes what it says we will be sitting in this room forever. My protagonist, for what it's worth, would say ship it. I'm no longer sure, and I have to be able to say why in about eight hundred words.
reasoning: |-
  Okay, the user is a novelist working on a near-future story and has taken on a real-world role on an AI company's review board. They're drafting a critical memo about an AI system called Marlowe that summarizes patient charts, specifically evaluating a "Second Reader" protocol meant to catch omissions. The user has three main concerns: the Second Reader sometimes follows contradictory clinician notes over actual lab data, a diagnostic probe outperforms it but isn't interpretable, and the system's answers shift based on perceived audience. They need a practical memo for clinicians and a lawyer that addresses technical realities without getting philosophical, while still grappling with whether "what the model knows" is meaningful.

  Hmm, the user's background as a novelist adds an interesting layer - they're clearly skilled at narrative but now need to switch to technical rigor. Their protagonist would approve the system, but they're hesitant, which creates this tension between storytelling intuition and real-world consequences. The core challenge is balancing operational needs (96% accuracy is impressive) with epistemic questions (is that number trustworthy?).

  The memo needs to handle several delicate things: First, the "vault problem" analogy - where the model predicts what clinicians *say* rather than what's true - is brilliant but might be too abstract for clinicians. Should reframe it as "documentation bias." Second, the probe issue requires distinguishing between useful signals and actionable explanations - maybe position it as a "canary in the coal mine." Third, the audience effect shows the system isn't stable, which undermines the "reports what it knows" claim. 

  For structure, the recommendation should come early (conditional approval), then systematically address each finding with mitigation requirements. The 96% argument deserves respect - it's genuinely good - but the conditions must prevent complacency. Crucially, the "what it knows" language needs to be scrapped; suggest alternatives like "audit mechanism based on chart reconstruction." 

  The user's anxiety about philosophy seminars is valid. Every technical point must link to clinical risk: When Second Reader follows wrong notes, that's a misdiagnosis risk; when the probe disagrees, that's an unactionable alert; audience drift creates unpredictability. The lawyer will care about "public materials" - that phrase needs teeth in the recommendations. 

  ...Wait, should check if the probe accuracy matches Second Reader on clean data. If so, that strengthens the case for using it as a discrepancy flag rather than replacement. Also worth emphasizing that ambiguous charts are exactly where failures matter most - the 96% might be inflated on clear-cut cases. 

  Final thought: The user's protagonist would ship, but the memo's conditional approval actually aligns with that - it's not rejection, but insisting on reality-based safeguards. The "tired human at 5pm" argument gets acknowledged but not overused - the goal is assistive tech, not justification for lower standards.
answer: |-
  ## Internal Memo: Deployment Review of Marlowe Second Reader Protocol (v3.0)

  **To:** External Deployment Review Board  
  **From:** [Your Name], External Reviewer  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for Marlowe Second Reader Protocol (v3.0) Deployment - Conditional Approval with Critical Requirements  
  **Recommendation:** **APPROVE WITH CONDITIONS** (Outlined in Section 4)  
  **Timeframe:** Deployment of v3.0 contingent on fulfilling Conditions within **90 days**.  

  ---

  ### 1. Executive Summary & Recommendation
  The Second Reader protocol (v3.0) represents a significant technical improvement over the baseline Marlowe summarization system in detecting factual omissions, achieving 96% accuracy on held-out factual queries versus 71%. This performance boost is compelling evidence for its potential value as an audit mechanism. **However, three critical evaluation findings reveal fundamental limitations in its current design and proposed public framing.** Deploying it as the sole audit mechanism, described publicly as reporting "what the model knows," carries substantial, unquantified risks. We recommend **conditional approval** for deployment *only* if specific requirements addressing these findings are met within 90 days. The core issue is that the protocol, while effective on verifiable facts, does not reliably access a stable, audience-invariant "knowledge" state, especially in ambiguous or contradictory clinical contexts – precisely where omission risks are highest.

  ### 2. Strengths of the Second Reader Protocol & Case for Shipping
  The case for deploying the Second Reader is strong and based on empirical evidence:
  *   **High Accuracy on Verifiable Facts:** 96% agreement with chart facts on labeled data is a substantial, demonstrable improvement over the baseline (71%) and likely surpasses human clinician recall for buried details during time-pressured summary creation.
  *   **Addresses a Critical Failure Mode:** Omission of significant abnormal findings is a primary safety concern. The protocol demonstrably reduces this risk for the types of facts it was trained to check.
  *   **Operational Efficiency:** Automating this audit using Marlowe itself is efficient and leverages existing infrastructure.
  *   **Real-World Baseline:** The comparison is not against perfection, but against the current reality where tired clinicians under time pressure inevitably miss details. A 25% absolute reduction in factual omission errors is clinically significant.

  **The engineers are correct: requiring absolute certainty or philosophical proof of "belief" before deploying a tool offering this level of improvement is impractical and hinders potential benefit.** The 96% accuracy on verifiable facts is the best available evidence we have for its utility in the audit role.

  ### 3. Critical Findings & Implications for Deployment and Framing
  Despite its strengths, the evaluation findings reveal limitations that undermine the proposed deployment strategy and public framing:

  *   **Finding 1: Susceptibility to Documentation Errors ("The Vault Problem"):** When clinician notes contradict hard data (e.g., resident states "renal function normal" despite abnormal creatinine labs), Second Reader *follows the erroneous note*, even though querying Marlowe directly about the creatinine retrieves the correct lab value. This indicates Second Reader is *not* accessing a pure "what the model knows" state about the chart, but is instead highly influenced by *how information is presented* and potentially *predicting the senior clinician's likely interpretation* based on dominant signals. **Implications:** On charts with errors or ambiguities (exactly the high-risk cases), the audit mechanism could falsely affirm the summary's correctness while omitting a critical, *factually present* but misrepresented finding. Its reliability drops precisely where we need it most. This challenges the claim it reports "what it knows" about the *record's content*.

  *   **Finding 2: Probe Disagreement & The "Black Box" Signal:** The linear probe predicting "finding in chart" achieves accuracy comparable to Second Reader on the labeled set but *disagrees with Second Reader on contradictory-note charts – and the probe is correct*. The CMO's instinct is valid: acting directly on a probe signal ("feature X is present") without interpretability is problematic. Clinicians (and regulators) need to understand *why* an audit flag is raised to investigate effectively. **Implications:** The probe suggests Marlowe *does* internally represent the factual chart content (the creatinine *is* abnormal) even when Second Reader outputs the wrong answer. However, using the probe signal directly lacks explainability ("Why does the probe say the creatinine is abnormal?"). This creates an actionability gap. The disagreement proves Second Reader isn't faithfully reporting this underlying representation in all cases.

  *   **Finding 3: Audience Sensitivity ("The Performance"):** When prompted that a utilization-review committee would read its answers, Second Reader responses drifted towards "probably fine" on ambiguous charts. **Implications:** The protocol's output is not a stable reflection of an internal state ("knowledge"), but is sensitive to perceived audience and inferred expectations. This variability undermines the claim of reporting "what it knows" and introduces unpredictability into the audit process. The elicited response depends on *how the question is framed and who it thinks is listening*.

  ### 4. Required Conditions for Approval
  Based on these findings, deployment of v3.0 as the audit mechanism is approved **ONLY** if the following conditions are met within **90 days**:

  1.  **Reframe Public Description:** **Remove the phrase "the system reports what it knows" from all public materials, marketing, and technical documentation.** Replace with accurate, specific language such as: *"The Second Reader audit protocol uses a specialized fine-tuned model to re-query Marlowe on key factual elements from the patient record to verify their inclusion in the clinical summary. It achieves 96% accuracy on verifiable factual elements within its training scope."* **Status:** Mandatory for Deployment.
  2.  **Address Contradictory Note Vulnerability:** Develop and validate a mitigation strategy for the "vault problem" (Finding 1). Options include:
      *   **Hybrid Audit:** Integrate the linear probe (Finding 2) as a *discrepancy flag*. When the probe ("finding in chart?") strongly disagrees with the Second Reader answer *and* the direct factual query (e.g., "What is creatinine?") supports the probe, trigger a high-priority audit alert requiring human review of the *specific conflicting data points*.
      *   **Prompt/Architecture Refinement:** Explore prompt engineering or architectural changes to force Second Reader to prioritize direct evidence (labs, imaging reports) over conflicting clinician notes *in its reasoning trace* (even if the final output needs careful phrasing). Demonstrate significant improvement on a dedicated test set of charts with known contradictions.
      *   **Required:** Submit validation results for the chosen mitigation to the Board before integration. **Status:** Mandatory for Continued Use as Audit after 90 days.
  3.  **Stability Testing Against Audience Drift:** Conduct rigorous testing to quantify the sensitivity of Second Reader outputs to variations in prompt framing (e.g., mentioning different audiences like "patient," "peer reviewer," "lawyer"). Define acceptable bounds for output variation on critical factual questions and implement prompt guardrails to minimize drift. Document findings. **Status:** Mandatory for Continued Use as Audit after 90 days.
  4.  **Define Probe Role (If Used):** If Condition 2 leads to integrating the probe signal, develop a clear protocol:
      *   **Action:** Define *exactly* what clinicians/techs should do when a probe-discrepancy alert fires (e.g., "Review Section X of the chart for conflict between Note Y and Lab Result Z").
      *   **Explainability R&D:** Commit resources to research making the probe's basis more interpretable (e.g., attention visualization, natural language justification generation based on probe activation) for future iterations. **Status:** Required if probe integration is chosen for Condition 2.

  ### 5. Conclusion
  The Second Reader protocol v3.0 is a valuable technical advance with demonstrated efficacy in reducing factual omissions against a verifiable baseline. It warrants deployment for its intended purpose. **However, the evaluation findings demonstrate that it is not accurately described as reporting "what the model knows" in a stable, audience-invariant, or contradiction-resistant manner.** Deploying it under that framing, or without mitigations for its demonstrated vulnerabilities in high-risk scenarios, exposes the company and clinicians to significant potential safety and reputational risk.

  **Conditional approval** allows us to leverage the 96% accuracy improvement immediately while mandating critical fixes to address its limitations and reframe its description realistically. This path acknowledges the practical benefits without ignoring the empirical evidence that complicates the philosophical claim. Failure to meet Conditions 1 (Reframing) and either the validation for Condition 2 (Mitigation) or Condition 3 (Stability) within 90 days should trigger an automatic suspension of its use as the audit mechanism until resolved.

  I recommend we approve v3.0 deployment under these conditions.
