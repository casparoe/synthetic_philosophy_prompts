answer: |-
  Here is a specification of desiderata for ranking land-use interventions by net wild animal welfare, grounded in your operational constraints and unresolved questions. Requirements are ordered by their ability to discriminate between approaches.

  ### Desiderata for Net Welfare Assessment
  1. **Non-Fixed Population Accounting (Non-negotiable)**  
     *Motivation*: Vaccination prevents future lives; draining wetlands may displace or concentrate populations.  
     *Distinction*: Must compare welfare across *different possible populations*, not a fixed set of individuals. Rejects ledger-based aggregation.  
     *Rules out*: Methods assuming a static "baseline" population.

  2. **Counterfactual Comparability (Non-negotiable)**  
     *Motivation*: Poising rats may avert future starvation or cause net suffering; conifer planting creates new ecological niches.  
     *Distinction*: Welfare must be evaluated against the *most plausible alternative state* (e.g., no intervention), including indirect/knock-on effects.  
     *Rules out*: Assessments ignoring how interventions alter survival rates, competition, or future generations.

  3. **Sensitivity to Welfare Quality, Not Just Quantity (Non-negotiable)**  
     *Motivation*: A seabird island with poisoned rats may have higher total biomass but more agonizing deaths; wetland drainage may replace chronic stress with acute suffering.  
     *Distinction*: Must distinguish duration, intensity, and valence of experiences—not merely lifespan or abundance. Replaces "welfare-years" with a *weighted function of experiential states*.  
     *Rules out*: Biomass, abundance, or undiscounted welfare-year metrics alone.

  4. **Boundary Agnosticism (Non-negotiable)**  
     *Motivation*: Draining a wetland may export suffering to adjacent areas; rat poisoning may affect marine food webs.  
     *Distinction*: Must model welfare leakage beyond project borders and budget windows. Requires probabilistic spatial/temporal scoping.  
     *Rules out*: Assessments limited to project footprints or fixed time horizons.

  5. **Sentience Uncertainty Propagation (Negotiable)**  
     *Motivation*: Invertebrate sentience is unresolved; planting conifers affects insects, soil fauna, and vertebrates differently.  
     *Distinction*: Weights must reflect epistemic uncertainty about capacity for welfare (not just point estimates).  
     *Rules in/out*: Accepts probabilistic weighting but rejects ignoring uncertainty or assuming binary sentience.

  6. **Neutrality on the Value of Existence (Preference)**  
     *Motivation*: Vaccination prevents lives that might have been worth living; draining a wetland may prevent births.  
     *Distinction*: Must *not* presuppose whether non-existence is neutral, bad, or good. Allows asymmetric treatment of pleasure/pain.  
     *Rules out*: Totalism (which assumes creating happy lives is good) and strong anti-natalism.

  7. **Separation of Welfare from Ecological State (Non-negotiable)**  
     *Motivation*: "Functioning ecosystems" may involve high predation/parasitism; "naturalness" doesn’t imply less suffering.  
     *Distinction*: Welfare assessment must be independent of biodiversity metrics or naturalness. Replaces "integrity" with suffering-aware outcomes.  
     *Rules out*: Proxy-based approaches (e.g., "welfare = ecosystem health").

  8. **Computational Tractability with Coarse Data (Negotiable)**  
     *Motivation*: Life histories and remote sensing are available; individual welfare data are not.  
     *Distinction*: Must use population dynamics, hazard rates, and habitat proxies to infer welfare.  
     *Rules out*: Methods requiring individual-level tracking or cardinal interspecies comparisons.

  ### Explicit Rulings on Candidate Demands
  - **Never kill sentient animals**: Rejected (non-negotiable). Prevents pest control even if net welfare-positive.  
  - **Value naturalness independently**: Rejected (non-negotiable). Violates Desideratum 7.  
  - **Never aggregate across species**: Rejected (negotiable). Necessary for ranking but requires uncertainty weighting (Desideratum 5).  
  - **Reproduce "ecosystem=good"**: Rejected (non-negotiable). Ecosystems may be suffering-intensive.  
  - **Avoid claims about lives worth living**: Upheld (Non-negotiable). Aligns with Desideratum 6.

  ---

  ### Critique of Welfare-Years Proposal  
  The consultant’s index (**net welfare-years/ha-year × sentience probability, 100y, 3% discount**) fails key desiderata:  
  - **Presupposes fixed populations**: Cannot handle endogenous demography (Desideratum 1).  
  - **Ignores welfare quality**: Treats all life-years equally, ignoring suffering intensity (Desideratum 3).  
  - **Arbitrary boundaries**: 100-year horizon ignores long-term shifts; ha-year ignores leakage (Desideratum 4).  
  - **Totalist assumption**: Values creating new lives (Desideratum 6 violation).  
  - **Discount rate subjectivity**: 3% discounting penalizes long-term welfare gains.  
  *Meets only*: Sentience weighting (Desideratum 5) and coarse-data use (Desideratum 8).

  ---

  ### Critical Tensions and Discriminating Power
  - **Fundamental Tension**: *Discrimination vs. Computability* (Desiderata 3 vs. 8).  
    Fine-grained welfare discrimination (e.g., suffering intensity) requires individual-level data. Coarse proxies (e.g., mortality rates) lose ethical nuance. **Resolution**: Accept bounded uncertainty—e.g., classify deaths by "severity bands" inferred from life histories.  
  - **Most Discriminating Requirement**: *Counterfactual Comparability* (Desideratum 2). Excludes approaches that ignore population dynamics (e.g., static biodiversity indices) or conflate welfare with survival (e.g., abundance metrics).

  ---

  ### Evaluation of Approaches  
  *Key discriminating criteria: A = Non-Fixed Populations (1), B = Welfare Quality (3), C = Boundary Agnosticism (4), D = Existence Neutrality (6)*  

  | **Approach**                          | A  | B  | C  | D  | **Fatal Flaw**                                  |  
  |---------------------------------------|----|----|----|----|------------------------------------------------|  
  | **Suffering-Focused Consequentialism** | ✓  | ✓  | △  | ✓  | △ Boundary effects hard to model (rat poisoning displaces predators). |  
  | **Totalist Hedonic Accounting**        | ✗  | △  | ✗  | ✗  | ✗ Assumes creating life is good (vaccination paradox). |  
  | **Biodiversity/Integrity Proxies**     | △  | ✗  | △  | ✓  | ✗ Equates "natural" with good welfare (conifers may increase predation). |  
  | **Deontic Constraints**                | ✓  | ✗  | ✓  | ✓  | ✗ Cannot rank interventions (e.g., forbids rat control despite net welfare gain). |  

  ✓ = Fully meets, △ = Partially meets, ✗ = Fails  
  **Case-Driven Verdicts**:  
  - Totalism fails vaccination case (D).  
  - Biodiversity proxies fail seabird island case (B).  
  - Deontic views cannot resolve rice paddy vs. wetland trade-offs.  
  - Suffering-focused approaches best handle conifer planting welfare ambiguity (B) but struggle with leakage (C).

  ---

  ### Recommendation  
  Prioritize a **suffering-focused framework** with:  
  1. Population dynamics modeling (Desiderata 1–2, 8),  
  2. Severity-weighted welfare metrics (Desiderata 3, 6),  
  3. Probabilistic sentience weights (Desideratum 5), and  
  4. Nested spatial/temporal boundaries (Desideratum 4).  
  **Where indeterminable**: Flag interventions with high boundary leakage risk or sentience uncertainty. This satisfies non-negotiable requirements while acknowledging tractability limits.
