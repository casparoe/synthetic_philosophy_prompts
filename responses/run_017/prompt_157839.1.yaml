  ## Dialogue: Nonidentity and Transformation

  **Setting:** A quiet corner of a philosophy department common room. Coffee cups sit half-full. ALEX (A) leans forward intently. BRIAN (B) gestures thoughtfully.

  **ALEX:** ...So, in the medical case, if we conceive now, the child has a chronic illness but a life unquestionably worth living. If we wait three months, a different, healthy child exists. How can we say we’ve *wronged* the ill child? Their very existence depends on our choice! Without that choice, they wouldn’t be here at all to experience their good life. No one is made worse off.

  **BRIAN:** But Alex, that seems to let too much slide! The *total welfare* is clearly lower. We could have brought a much happier person into existence. Choosing the lower welfare outcome *is* wrong, even if no specific person is harmed relative to non-existence. It’s about the impersonal value of well-being maximized. Isn’t failing to create the best possible future a moral failing?

  **ALEX:** That opens a terrifying door, Brian. Does it mean we have a duty to create *as many* happy people as possible? Or only the *absolute happiest* possible? What about couples who could have a very happy child but choose not to have children at all – have they wronged the potential child? That seems absurd.

  **BRIAN:** Maybe the duty isn’t *maximizing* births, but *optimizing* the welfare of those we *do* bring about. And perhaps the wrongness isn’t just about harm *to the child*, but about the agent’s reckless disregard – creating someone destined for significant suffering they could easily have avoided creating *someone else* without it. Or a right not to be created *below a certain welfare threshold*, even if above ‘not worth living’.

  **ALEX:** A right relative to *what*? Non-existence isn’t a state they can be better off in! And ‘disregard’ rings hollow if the life created is good *for the person living it*. They wouldn’t trade their existence for non-existence. Okay, new case: Nadia. Age 30, no dependents. Takes a drug purely out of curiosity. Over a year, it radically reshapes her psychology. By the psychological continuity view we both accept, the end result isn’t Nadia anymore – it’s a new person, N2. N2’s life is clearly worth living *by N2's standards*, but it’s objectively lower in welfare than the life Nadia would have had. Nadia herself would have hated N2’s life. No one else affected. Your impersonal view says this is wrong, same as the medical case? Lower total welfare?

  **BRIAN:** Objectively, yes. Total welfare *is* lower. An action reduced the amount of good in the world. That feels *more* intuitively wrong here, though. There’s a palpable loss *attached* to Nadia – her own good future was extinguished! It feels like she was reckless with *herself*, even if N2 is happy.

  **ALEX:** But who’s the victim? N2 exists because of the drug and has a good life. Pre-drug Nadia doesn’t exist *at all* after the change – she’s gone. How can she be harmed? She ceased to exist. If the change is gradual, and there’s someone at the midpoint continuous with both ends... does that suddenly make it harm? That seems arbitrary! The *difference* between the actual outcome (N2 exists) and the alternative (Nadia continues) is the same: one person replaced by another with lower welfare. The ‘feeling’ of loss is just sentiment about the past Nadia, not a present harm. If N2 is happy, no one is wronged.

  **BRIAN:** The gradual continuity *does* blur the line, yes. But the core point remains: the *agent* (Nadia) performed an act that foreseeably resulted in less welfare existing overall. The feeling of loss *is* significant – it points to a *real* reduction in the welfare *that was Nadia's potential*. It’s a loss *to the world*, concretely embodied in the transformation of a specific life trajectory. The impersonal wrongness feels grounded here, whereas in the medical case, it feels abstract. Maybe the wrongness *inheres in the act itself* – the reckless transformation – regardless of whether we can point to a *harmed person* at the end.
