  ### 6. Debrief

  Map to the four points:

  1. Genuine uncertainty: At the beginning, prices are around 0.5, and the ledger might show few exploits because prices are coherent. But as trading happens, prices move, and they are uncertain.

  2. Coherence constraints: The exploit ledger shows losses when the sum of TRUE and FALSE !=1. They will see these losses and then adjust prices to avoid them.

  3. 0.5 on everything is not safe: If the exploiter knows the answer, they will make a straight bet and take money. For example, if claim 6 (F_15 div by 10) is priced at 0.5 TRUE and 0.5 FALSE, and the exploiter knows it's true, they buy TRUE for 0.5 and then get 1, making 0.5 profit from the market.

  4. Market can stop losing without right prior: After some exploits, the prices adjust to be coherent, but not necessarily correct. For example, for a claim, they might have TRUE at 0.6 and FALSE at 0.4, and it might be false, but the exploiter can't make a combination trade because the sum is 1, and if they don't know the answer, they can't straight bet. So the market is not losing money even though the prices are not correct.

  ### 7. Predictable Problems

  - Someone knows a fact: If a participant knows a fact, they might not trade or they might trade to their advantage. The exploiter might know it and make a straight bet. If the exploiter knows, they will make a straight bet and record a profit. If a non-exploiter knows, they can trade on it. That's fine.

  - Prices frozen: No one wants to trade first. Solution: The facilitator can seed the market by setting initial prices or encouraging someone. Or the exploiter (if they are active) might do a combination trade if prices are incoherent.

  - Exploiter becomes market maker: The exploiter might be tempted to set prices. But in the rules, the exploiter cannot set prices; they can only exploit existing prices. So they should not set prices.

  - Confusion about conditional: For the conditional claim in round 3, explain that "if P then Q" is true unless P is true and Q is false.

  - Betting whole stack: If someone bets everything, they might go bankrupt. That's okay, it's part of the game.

  - CS students compute everything: They might try to compute and then trade or be exploiter. That's fine, it illustrates point 3. But if they compute too fast, the uncertainty is gone. We can choose claims that take a bit of time to compute. Or we can say that during trading, no computation devices? Only pen and paper allowed, and only the exploiter for straight bets can use pen and paper? Or no one can use devices during trading? We can have a rule: no computation during trading. Then at reveal time, they can use devices.

  Rule: During the trading period, no one (except the exploiter when making a straight bet) may use computational devices or do prolonged calculation. They must trade under uncertainty. The exploiter, when making a straight bet, must be able to state the answer and will be verified at reveal. If they are wrong, they lose the trade? We don't want that. We can say: if the exploiter makes a straight bet and it turns out wrong, they lose double? To discourage bluffing? But we want them to be sure. So we rely on them only betting when sure.

  ### 8. What the game cannot reproduce

  - Computability and time-budget constraints: In reality, traders are bounded, but in the game, the exploiter can compute anything instantly if they know how.
  - Asymptotic criterion: The game is finite.
  - Relative guarantees: In the game, if a claim is never settled, we don't have that. We settle all.
  - The fact that the market can be wrong on unproven claims without being exploited.

  ### Final Answer

  The key takeaway: "Being unexploitable is not about being right, but about being coherent and adaptive."

