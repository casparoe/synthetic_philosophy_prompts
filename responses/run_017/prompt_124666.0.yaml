  - **The DGP vs Logical Truth**: In your world, probabilities are about uncertainty due to randomness (and irreducible noise). Here, the uncertainty is entirely due to computational limitations. This is a significant bend. The numbers are licensed by the fact that the forecaster is computationally bounded and the traders are bounded. So the probability is a measure of the difficulty of proving the sentence given the current state of computation and the available proof methods. This is a different kind of uncertainty (sometimes called "logical uncertainty").
  - **Coherence at Finite Times**: In Bayesian forecasting, we require coherence (probabilities add up to 1, etc.) at every step. The logical inductor is not coherent at finite times. It only becomes coherent in the limit. So in your vocabulary, the forecaster is not strictly Bayesian at any finite time. However, the deviation from coherence is bounded in a way that cannot be exploited to make unbounded profit.
  - **Resolution**: In your world, the event resolves (the realization occurs). Here, the event may never resolve (if we don't run enough computation) but the limit result says that if we run the process forever, then for any fixed sentence, we will eventually know the answer. However, in practice, we might stop before that. The scoring (via the traders) is defined only in the limit? Not exactly: the traders are active at every time step, and the exploitability condition is about the total profit over all time steps.

