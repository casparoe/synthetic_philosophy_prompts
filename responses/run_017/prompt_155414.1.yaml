   P5 (Statistical-reasoning audit): Funded with conditions. Minute: "the reviewer does not need to verify the crux, only to see whether the criticism was answered." Conditions: capped rounds and the reviewer must note which claim was unanswered.
     - The reviewer doesn't have to verify the truth of the crux, but only to observe whether an objection was adequately addressed.

   Now, let's brainstorm principles that fit all five:

   Principle A: "If the reviewer can independently verify every crucial claim in the debate using available tools and within the time limit, then fund."
     - P1: The reviewer can check against the contract -> funded. Fits.
     - P2: The reviewer can check by looking at the diff and running tests -> funded. Fits.
     - P3: The reviewer cannot check the literature claims in time -> rejected. Fits.
     - P4: There are no crucial claims to verify because it's subjective -> but note: we rejected because there's nothing to be right about, not because of verifiability. However, if we interpret "no objective claims" as making verification impossible, then it fits.
     - P5: The reviewer cannot verify the crux (because they don't have the data) but they are only asked to see if a criticism was answered -> so this principle would have rejected P5? But we funded P5 with conditions. So Principle A does not fit P5.

   Principle B: "If the debate structure forces the arguments to be about locally verifiable claims (i.e., claims that the reviewer can check without requiring external expertise or resources beyond what is provided and within time), then fund."
     - P1: The claims are about specific clauses in the contract, which are locally verifiable -> funded. Fits.
     - P2: The claims are about the code diff and test results, locally verifiable -> funded. Fits.
     - P3: The claims are about the literature, which the reviewer cannot locally verify in time -> rejected. Fits.
