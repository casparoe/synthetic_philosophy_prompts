   Reviewing the minutes:

   P1 (Contract questions): Funded. Minute: "every claim the verdict turns on is checkable by the reviewer against a text in front of her."
     - The reviewer can check the claims by looking at the contract.

   P2 (Small-diff code review): Funded. Minute: "the reviewer could settle this himself; debate only tells him where to look."
     - The reviewer has the ability to verify the truth by examining the diff and running tests.

   P3 (Five-year technology forecast): Rejected. Minute: "there is a fact of the matter, but the claim the verdict actually turns on — what the literature shows — is not something this reviewer can check in half an hour, and the more authoritative-sounding side wins; we are not funding a confidence contest."
     - The reviewer cannot check the crucial claims in the time given, so it becomes about persuasiveness rather than truth.

   P4 (Quality judgments): Rejected. Minute: "nothing here to be right about; debate selects for eloquence."
