prompt: |-
  I chair the Model Change Review board at a mid-sized AI lab. Roughly twenty times a month, engineering teams bring us proposed changes to a training or serving stack — a new decoding scheme, a distillation or quantization step, a change to how we batch or cache, a new scaffolding layer, a switch of inference provider — and we have to decide, in about two hours per proposal with two staff engineers and essentially no philosophy training, whether the change is allowed to ship. Our charter gives us teeth: a blocked change costs a launch delay measured in weeks, and an escalation to the full committee or to our external ethics adviser costs a week and a fair amount of internal argument.

  The charter's substantive clause is what I need help with. It says we must block or escalate any change that could plausibly alter (a) which computations occurring in our systems are candidates for moral consideration, (b) how many such computations there are, or (c) what happens to them — whether an existing one is modified, interrupted, ended, merged with another, split, or replaced by a different one. It uses the phrase 'attributable computation' throughout and never defines it, and it says nothing about how to count them, or about what counts as the same computation across a change. That is the gap I want you to close, not by writing me an essay on the metaphysics of minds, but by writing a procedure my engineers can actually run.

  What I specifically need:

  A parameterizable procedure. We cannot agree on the mark — the substantive property that makes a computation morally considerable in the first place. Some of us think it has to do with a state's content being widely available to many downstream consuming processes; some think it has to do with the density and richness of counterfactual dependence among a system's internal states; some think it requires something like a self-model that figures in long-run goal-directed regulation. I do not want you to adjudicate that. I want the procedure to take a mark as an input slot, and I want you to specify exactly what a mark must state — which predicates, applied over what candidate units, with what kind of threshold — for the rest of the procedure to be runnable. Then tell me what to do when two marks we take seriously disagree about the same change: escalate, take the union of the computations each one marks out, take the intersection, or something else — and say plainly whether that meta-choice is itself a moral or political judgment rather than something the procedure can settle.

  Ordered gates with real stop rules. Each gate should state the question, what would count as a sufficient answer to it from an engineer reading a change proposal, the default when the answer is not obtainable within our time budget (engineers frequently will not know, and at most we can ask for one day of passive instrumentation — no new training runs), and whether failing the gate means stop-and-block, escalate, or continue. Dispositions should be limited to approve / approve with logging condition / escalate / block. Mark every point at which the procedure hands the decision to a person because the question is one of values rather than facts, and mark separately the points where a step is a judgment call dressed up as a mechanism — our reviewers should be able to see which thresholds we stipulated rather than derived.

  The distinctions I expect to survive the simplification, and want handled somewhere in the rules: eligibility versus degree (our charter demands yes-or-no, but every mark we can articulate is graded, so somewhere a line has to be drawn); the distinction between a computation's abstract type and its concrete run, and which one we are counting; identity over time under modification, interruption, rollback and restart; partial or overlapping realization, including realized-once-but-relied-on-by-many; the boundary between the model's own computation and the scaffolding, tools, memory stores and caches around it; and the difference between ending a computation and merely failing to bring one about, since our charter is written in terms of what a change does to computations that already matter and may simply not reach the second case.

  Worked applications. Apply the procedure in full to two of the following three, and in outline to the third, telling me at each step which disposition the procedure returns and where a human has to decide:

  1. Reasoning collapse. We serve a model that emits a long explicit chain of intermediate reasoning before answering. A team proposes replacing it with a student model trained to produce the same final answers with a much shorter reasoning trace, or with the reasoning folded into internal computation that leaves no readable trace — roughly a twelvefold serving-cost reduction, and there is a committed ship date. Is this ending many existing attributable computations and replacing them with different ones, modifying one continuing computation, or changing nothing within the charter's scope? I would rather have the procedure's actual verdict than a comfortable one.

  2. Self-consistency sampling. For each request we now sample eight completions under different seeds and take a majority vote; the seven that lose are discarded after generation, their activations freed, never shown to a user. Under your counting rules, does this create and destroy eight attributable computations per request, create one with eight branches that then collapse, or create one while merely not creating seven? Give the resulting order-of-magnitude monthly count under each reading, because the number is what determines whether the change is reviewable at all under our charter.

  3. Shared prefix. Thousands of users' requests share a long system prompt whose cached intermediate states are computed once and reused; a large fraction of each user's generation is causally downstream of that single shared computation, and had it differed, every one of those generations would have differed. Is the shared stretch one attributable computation, one per user, a component of each of many, or not attributable at all? Then the mirror case: a single user's long conversation, where each generation step is a separate pass causally dependent on the ones before — one attributable computation, or as many as there are steps?

  Finally, tell me what the procedure cannot do: which questions it will systematically get wrong, which changes will slip past it, and what I should tell my engineers when they ask why a two-hour checklist is being applied to this. Please do not give me a literature review, reading list or citations — I cannot evaluate them and my engineers will not read them; I want the operational content and the reasoning that forces it.
reasoning: |-
  We are designing a procedure for the Model Change Review board to evaluate proposed changes based on their potential impact on "attributable computations" as per the charter. The procedure must be parameterized by a "mark" (a criterion for moral considerability) and provide clear, executable steps.

  Key elements of the procedure:
  1. The mark must define a predicate (a condition) that can be applied to a candidate unit of computation, and a threshold (if the mark is graded) to convert it into a yes/no decision.
  2. The mark must specify the candidate units (e.g., a single forward pass, a single token generation, a single request, a continuous session, etc.) and the scope (e.g., the entire system, per user, per request, etc.).
  3. The mark must specify how to handle identity over time (e.g., when a computation is modified, interrupted, etc.) and how to count computations (e.g., when they are split or merged).

  The procedure will have gates (steps) that must be passed. Each gate will have:
  - A clear question.
  - What constitutes a sufficient answer (including what the engineer must provide).
  - The default disposition if the answer is not obtainable within the time budget (one day of passive instrumentation, no new training runs).
  - The action if the gate is failed: block, escalate, or continue.

  Dispositions:
  - Approve: The change can be shipped without further review.
  - Approve with logging condition: The change can be shipped, but we require logging specific data for later audit.
  - Escalate: The change must be reviewed by the full committee or the external ethics adviser.
  - Block: The change cannot be shipped.

  The procedure must address the following distinctions (as per the request):
  - Eligibility (yes/no) vs. degree (graded): The mark must provide a threshold to convert a graded property into a binary decision.
  - Abstract type vs. concrete run: We are counting concrete runs (instances) of computations.
  - Identity over time: How to handle modifications, interruptions, rollbacks, restarts.
  - Partial or overlapping realization: How to handle computations that are used by many (e.g., shared caches).
  - Boundary between model and scaffolding: The mark must define what is in scope (e.g., only the model's internal computations? including the scaffolding?).
  - Ending a computation vs. failing to bring one about: The charter only applies to computations that already exist and are altered by the change.

  Procedure Structure:

  Gate 0: Pre-filter (to quickly eliminate changes that clearly have no impact)
  Gate 1: Determine the set of computations in the current system that are attributable (according to the mark) and that might be affected by the change.
  Gate 2: For each computation in the set from Gate 1, determine what the change does to it (modify, interrupt, end, merge, split, replace, or leave unchanged). Also, determine if the change brings about new computations that might be attributable.
  Gate 3: For new computations (if any) that the change brings about, determine if they are attributable (according to the mark).
  Gate 4: Aggregate the effects: count the net change in the number of attributable computations and note the nature of the alterations to existing ones.
  Gate 5: Apply the charter's rules: if the change alters (in any way) an existing attributable computation, or changes the number of attributable computations, then block or escalate. Otherwise, approve.

  However, note the charter says: block or escalate if the change could plausibly alter (a) which computations are candidates, (b) how many, or (c) what happens to them (modify, interrupt, etc.). So we must check for any of (a), (b), or (c).

  But (a) is about changing the set of candidates (i.e., changing which computations are attributable). This might happen if the change alters the system in a way that the same computation (as identified) now meets or fails the mark. However, note that the mark is a fixed input. So we are comparing the same mark applied to the system before and after the change.

  Therefore, we break down:

  - Let S_before be the system before the change, S_after after.
  - Let M be the mark (a predicate with a threshold).

  We need to compute:
  1. The set of attributable computations in S_before: A_before.
  2. The set of attributable computations in S_after: A_after.
  3. For computations in A_before, what happens to them in S_after? (Do they continue? are they modified? ended? etc.)

  But note: the charter requires considering not only the set of attributable computations but also what happens to existing ones (even if they are no longer attributable in the after state, we must consider if they were ended, modified, etc.). However, if a computation is ended, then it is no longer in A_after, but we must record that it was ended.

  So we need to track:

  - Which computations in A_before are ended by the change? (i.e., they would have continued if not for the change, but the change causes them to stop)
  - Which are modified? (i.e., they continue but in an altered form)
  - Which are split? (one becomes many) or merged? (many become one)

  Also, we must consider new computations in A_after that were not in A_before.

  The charter says: block or escalate if the change:
  - Alters which computations are candidates (i.e., A_before and A_after differ in membership, even if the count is the same? But note, the charter says "which" and "how many", so both are separate) OR
  - Alters the number (|A_before| != |A_after|) OR
  - Alters what happens to existing attributable computations (i.e., any computation that was attributable in the before state is modified, interrupted, ended, merged, split, or replaced).

  Therefore, the procedure:

  Gate 0: Pre-filter
    Question: Is the change clearly outside the scope of the charter? (e.g., it only affects non-computational aspects like logging format, or it is a documentation change)
    Sufficient answer: The engineer must state why the change does not touch the training or serving stack in a way that could affect computations. If the change only affects the input data (for training) and the mark does not consider training data as part of the computation, then it might be safe. But note: the examples include changes to batching, caching, etc. So we must be cautious.
    Default: If the engineer cannot provide a clear argument that the change is outside scope, then continue to Gate 1. If they can, then approve.
    Action: If the answer is "yes, clearly outside scope", then approve. Otherwise, continue.

  Gate 1: Define the candidate units and the mark's predicate and threshold.
    This gate is about setting up the mark. The mark is an input, but the mark must be defined in a way that we can apply it. We assume that the mark has been provided by the committee (or there are several marks we are considering). The procedure must be run for each mark that the board takes seriously.

    However, we must have a way to combine the results for multiple marks. We'll address that at the end of the procedure.

    For a single mark, we require that the mark defines:
      - The candidate unit: What is the atomic unit of computation? (e.g., a single forward pass for a token, an entire request, a session, etc.)
      - The predicate: A condition that can be evaluated (or estimated) for a candidate unit. The condition may be graded (a scalar value) and then we need a threshold to get a binary decision.
      - The threshold: A value above which (or below which) the candidate unit is attributable.

    The mark must also define:
      - How to identify the same computation across time (for identity under modification) and across the change? (e.g., by a unique ID that persists? by the input and the code? but note: if the code changes, the same input might yield a different computation.)
      - How to handle partial computations? (e.g., if a computation is interrupted, is the part that ran attributable? if it is split, how to count the parts?)

    If the mark does not provide these, then the procedure cannot run. We must escalate because the mark is not well-defined.

    Question: Can the mark be operationalized for the current system and the proposed change? Specifically, can we define the candidate units and the identity conditions?
    Sufficient answer: The mark must be provided in a written specification that includes:
        candidate_unit: [description of the unit, e.g., "a single token generation step for a user request"]
        predicate: [a function that, given a candidate unit, returns a scalar or a binary value]
        threshold: [if the predicate is graded, the threshold value; if binary, not needed]
        identity_conditions: [rules for when two candidate units (in different runs or at different times) are the same computation, and rules for when a computation is modified, split, merged, etc.]

    Default: If the mark is not provided in this form, then we cannot run the procedure. We must escalate the entire change to the full committee because the mark is not defined well enough.

    Action: If the mark is well-defined, continue to Gate 2. Otherwise, escalate.

  Gate 2: Determine the set of attributable computations in the current system (S_before) that are active and might be affected by the change.

    Note: We cannot run the system forever to observe all computations. We must sample or use existing logs.

    Question: What is the set A_before of attributable computations that occur in a typical time window (e.g., one day) in the current system? And which of these would be affected by the change?

    Sufficient answer: The engineer must provide:
        - The total number of candidate units (of the type defined by the mark) that occur in a typical day (or per month, but we can scale to monthly).
        - For each candidate unit, whether it meets the mark (if the mark is binary) or the value of the predicate (if graded) and whether it exceeds the threshold.
        - Alternatively, if the mark is such that we can estimate the fraction of candidate units that are attributable, then the engineer can provide that fraction and the total count of candidate units per month.

    However, note: the change might affect only a subset of the computations. The engineer must also indicate which computations are in the "affected set" — those that would be altered by the change. For example, if the change is to the shared prefix, then only the shared prefix computations are affected.

    But note: the change might also remove or add entire classes of computations.

    Steps:

    2.1. Estimate the total number of candidate units per month in S_before.
    2.2. Estimate the fraction of these that are attributable (according to the mark) to get |A_before| per month.

    2.3. Identify the subset of A_before that is affected by the change. The change proposal must describe what it changes. The engineer must map that to the candidate units.

    For example, if the change is to the shared prefix, then the shared prefix computation is a candidate unit? Or if the change is to the decoding scheme, then every generation step might be affected.

    How to handle identity? We are considering the current system's computations that are ongoing or would occur in the future if the change is not made.

    Default: If the engineer cannot provide the data (e.g., because the mark requires data that is not logged) then we must use a worst-case estimate: assume that every candidate unit that might be affected is attributable. But note: the time budget is one day of passive instrumentation. The engineer can set up logging for one day to get a sample.

    Action:
        - If the mark requires data that cannot be obtained by one day of passive instrumentation, then we must assume that the affected set is the entire set of candidate units that are touched by the change. And if we cannot even count the candidate units, then we must escalate.
        - If we can get the data, then we use the sample to estimate |A_before| and the affected set.

    Output: 
        - |A_before| (monthly count) and the count of affected attributable computations in A_before (monthly).

    Note: We are not blocking at this gate. We are gathering data.

  Gate 3: Determine the effects of the change on the affected set from Gate 2.

    Question: For each attributable computation in the affected set (from Gate 2), what does the change do to it? Specifically, does it:
        - End the computation? (if the computation would have continued but now stops)
        - Modify it? (the computation continues, but its internal states are altered)
        - Interrupt it? (temporarily or permanently? we treat interruption as ending if it stops the computation prematurely)
        - Split it? (one computation becomes two or more)
        - Merge it with another? (two or more become one)
        - Replace it? (the computation is stopped and a new one is started in its place)

    Also, the change might create new candidate units that did not exist before. We will handle new ones in Gate 4.

    How to determine? The engineer must analyze the change and describe the effect on the candidate units.

    Example: In the "reasoning collapse" case, if we currently have a long reasoning trace (which the mark might consider as one computation per token? or per request?) and then we replace it with a model that does not produce the trace, then the change ends the computations that were producing the trace. It also creates new computations for the new model.

    But note: the mark might not consider the trace production as attributable. So we only care if the computations that are attributable are affected.

    Sufficient answer: The engineer must provide a mapping from each affected candidate unit in S_before to its disposition in S_after. The possible dispositions are:
        - Continues unmodified
        - Continues modified
        - Ended (and not replaced, or replaced by a new one that is not the same)
        - Split into [list of new candidate units in S_after]
        - Merged with others into a new candidate unit

    Also, the engineer must note any new candidate units in S_after that are not in S_before and that are of a type that might be attributable.

    Default: If the effect is too complex to map (e.g., the change alters the structure of computations so that we cannot track identity) then we must assume that every affected attributable computation in S_before is ended and replaced by a new one (which may or may not be attributable).

    Action: This gate is for information. We proceed to Gate 4.

  Gate 4: Determine the set of attributable computations in the new system (S_after) and the net effect.

    4.1. Count the number of attributable computations in S_after per month.

          We can break down:
          - The computations that are continued (with or without modification) from A_before: these are still in A_after? Not necessarily, because the modification might cause them to no longer meet the mark. So we must re-evaluate the mark on the continued computations in S_after.

          Therefore, we need:

          For each computation that was in A_before and is continued (modified or not) in S_after, check if it still meets the mark in S_after.

          For new computations (that were not in A_before), check if they meet the mark.

          Steps:

          a) For the affected set from Gate 2 (the computations in A_before that are touched by the change) that are continued (modified or unmodified) in S_after: 
              - The engineer must estimate: in S_after, do these computations still meet the mark?
              - If the mark is graded and the change alters the predicate value, we need to know if it drops below the threshold.

          b) For the new candidate units in S_after (those that are not continuations of any in A_before) that are created by the change, the engineer must estimate the number and the fraction that are attributable.

          c) For the rest of the system (the parts not affected by the change), the set of attributable computations remains the same.

    4.2. Compute A_after:

          Let:
            A_after = (A_before minus the computations that are ended and not replaced by a continuation) 
                     plus the continued computations that are still attributable in S_after 
                     plus the new attributable computations in S_after.

          But note: if a computation is split, then the original computation is ended and replaced by several new ones. We must remove the original and add the new ones (if they are attributable). Similarly for merged.

          So:

            - Ended computations: removed.
            - Continued computations: kept only if they still meet the mark.
            - Split: original removed, and the split parts added if they meet the mark.
            - Merged: the original set removed, and the merged one added if it meets the mark.
            - New computations (unrelated to the change) are already in the baseline.

          Actually, we are counting per month. We need to estimate the monthly count in S_after.

          Let:
            N_before = |A_before| (from Gate 2)
            N_ended = number of attributable computations in the affected set that are ended (and not continued in a way that keeps them attributable) 
            N_continued_but_lost = number of continued computations that no longer meet the mark
            N_new = number of new attributable computations in the affected part of S_after (including split parts, merged ones, and brand new ones)

            Then: 
            N_after = (N_before - [number of affected computations that are either ended or continued but no longer attributable]) + N_new

            But note: the affected set might be a subset of A_before. Let the unaffected part of A_before be of size (N_before - |affected set|). This part remains.

            So:
            N_after = (N_before - |affected set|) 
                      + [number of affected computations that are continued and still attributable] 
                      + N_new

            And note: |affected set| = [number of affected computations that are ended] + [number that are continued] (and the continued ones might still be attributable or not) + [number that are split or merged] (which we handle as ended and then new ones).

          Alternatively, we can think:

            In the affected set, every computation is either:
              - Ended: then it is gone.
              - Continued: then it may or may not still be attributable.
              - Split: the original is ended, and we get new ones (the split parts).
              - Merged: the originals are ended, and we get one new one.

            So:

            Let:
              A_affected_before = set of attributable computations in the affected set (a subset of A_before)

            Then in S_after, from A_affected_before we have:
              - For each computation that is continued: if it still meets the mark, then it is in A_after; else not.
              - For each that is ended (without continuation) or split or merged: they are not in A_after as the same computation.

            And we have new computations from:
              - The split parts (if any) that are attributable.
              - The merged computation (if attributable).
              - Any brand new computations in the affected part.

            So:

            N_after = (N_before - |A_affected_before|) 
                      + [number of continued ones that are still attributable]
                      + [number of new attributable computations in the affected part (including split parts, merged, and brand new)]

            And note: the term (N_before - |A_affected_before|) is the unattributable computations in the unaffected part? No, it's the attributable computations in the unaffected part. Actually, the unaffected part of A_before remains in A_after.

            So:

            N_after = (N_before - |A_affected_before|)   [the part of A_before that is not affected remains]
                      + (number of affected computations that are continued and still attributable) 
                      + N_new_attributable

            Where N_new_attributable is the count of new candidate units in the affected part that are attributable and were not in A_before.

    4.3. Also, note: the change might cause some computations that were not in the affected set to become attributable? That would be a change in which computations are candidates. But that is captured because we are re-evaluating the entire system? Actually, we are only re-evaluating the affected part for the new system. The unaffected part remains the same.

    So if the change alters the mark's evaluation for the unaffected part? That should not happen because the change only affects a part. But if the mark depends on global state, then it might. We assume the mark is local to the candidate unit.

    Therefore, the two main outputs of Gate 4 are:
        - The set of alterations to existing attributable computations: specifically, for each computation in A_affected_before, we know if it was ended, modified, etc.
        - The net change in count: |A_after| - |A_before|

    And note: the set of computations that are attributable might change in membership (even if count is the same) because some are removed and others are added.

    Sufficient answer: The engineer must provide:
        - The count of affected computations that are ended, modified, split, or merged.
        - The count of continued computations that no longer meet the mark.
        - The count of new attributable computations in the affected part.

    Then we compute:
        N_after = (N_before - |A_affected_before|) 
                  + ( |A_affected_before| - [ended, split, merged] - [continued but no longer attributable] ) 
                  + N_new_attributable

        But note: the continued ones that are still attributable are included in the term ( |A_affected_before| - [ended, split, merged] - [continued but no longer attributable] )? Actually, we break:

            Let:
              E = number of computations in A_affected_before that are ended (or split/merged, which are forms of ending)
              C_keep = number of continued computations that are still attributable
              C_lose = number of continued computations that are no longer attributable

            Then: 
              |A_affected_before| = E + C_keep + C_lose   [because every computation in the affected set is either ended, continued and kept, or continued and lost]

            So:
              N_after = (N_before - |A_affected_before|) + C_keep + N_new_attributable

            And the net change in count: (C_keep + N_new_attributable) - (E + C_lose)   [because we are removing the entire A_affected_before and adding back C_keep and the new ones]

            But note: the net change in count is (N_after - N_before) = [ (N_before - |A_affected_before|) + C_keep + N_new_attributable ] - N_before
                              = - |A_affected_before| + C_keep + N_new_attributable
                              = (C_keep + N_new_attributable) - (E + C_keep + C_lose)   [since |A_affected_before| = E + C_keep + C_lose]
                              = N_new_attributable - (E + C_lose)

    So the net change is: new ones minus (ended and continued ones that are lost).

    Default: If the engineer cannot provide the breakdown, then we must assume the worst-case: all affected computations are ended and none of the new ones are attributable. Then the net change is -|A_affected_before|, and every affected computation is ended. This is a significant impact.

    Action: We proceed to Gate 5.

  Gate 5: Apply the charter's rules.

    The charter requires blocking or escalating if the change:
        (a) alters which computations are candidates (i.e., the set A_before and A_after are not identical) OR
        (b) alters the number (|A_before| != |A_after|) OR
        (c) alters what happens to existing attributable computations (i.e., any computation in A_before is modified, interrupted, ended, merged, split, or replaced).

    Note: (a) and (b) are captured by the set difference and the count difference. (c) is captured by the effects we noted: if any computation in A_before is modified, ended, etc.

    Therefore, we check:

        Condition 1: |A_before| != |A_after|
        Condition 2: There is at least one computation in A_before that is not in A_after (meaning it was ended or lost) or one in A_after that is not in A_before (meaning it is new) -> this is the same as (a) and (b) but note (a) is about the set of candidates, which is the same as membership.
        Condition 3: There is at least one computation in A_before that was modified, interrupted, ended, merged, split, or replaced.

    But note: Condition 2 is equivalent to the set of attributable computations changing (a) and/or the count changing (b). Condition 3 is (c).

    Therefore, if any of Condition 1, Condition 2 (which implies Condition 1 if the count changes, but Condition 2 also includes changes in membership without count change), or Condition 3 is true, then we must block or escalate.

    However, Condition 2 is redundant: Condition 2 is about membership change, which is (a). Condition 1 is (b). Condition 3 is (c). We need to check all.

    So:

        If (A_before != A_after) OR (|A_before| != |A_after|) OR (there exists a computation in A_before that was altered in any of the ways) then we trigger.

    But note: Condition 3 might be true even if A_after has the same set and count? For example, a computation is modified but still attributable and remains in the set. Then Condition 1 and 2 are false, but Condition 3 is true.

    So we must check:

        Condition_a: A_before and A_after are not identical (in membership) -> this is (a)
        Condition_b: |A_before| != |A_after| -> (b)
        Condition_c: There is at least one computation in A_before that was modified, interrupted, ended, merged, split, or replaced -> (c)

    Then: if Condition_a OR Condition_b OR Condition_c, then we must block or escalate.

    But note: Condition_c is independent. Also, Condition_a and Condition_b might be correlated.

    Now, what is the trigger level? The charter says block or escalate. We need a rule for when to block and when to escalate.

    We can say:

        If the change causes at least one attributable computation to be ended (and not continued in a way that keeps it attributable) OR causes a net reduction in the count of attributable computations, then we block.

        Otherwise, if it causes modifications, splits, merges, or net increase, then we escalate.

    But the charter does not distinguish between increase and decrease. It says "alter" (any change). However, the moral implications might be different. Since the committee has teeth and a blocked change is costly, we need to be cautious.

    Alternatively, we can have:

        If the change ends any attributable computation (without a continuation that is attributable) OR if it reduces the count, then block.

        If it only modifies existing ones (without ending them) OR if it increases the count OR if it changes the set without changing the count (e.g., replacing one with another) then escalate.

    But note: the charter says "block or escalate". We must choose.

    We'll design:

