answer: |-
  ### Parameterizable Procedure for Attributable Computation Assessment

  #### Core Structure
  The procedure evaluates changes based on a user-provided **mark** (a criterion for moral considerability). The mark must define:
  - **Candidate unit**: The atomic computation unit (e.g., a token generation, a full request, a session).
  - **Predicate**: A function that outputs a scalar measure of "attributability" for a candidate unit.
  - **Threshold**: A scalar value; units scoring above this are "attributable" (yes/no).
  - **Identity conditions**: Rules to determine if two units are the "same" computation across time (e.g., via unique IDs, input hashes, or session continuity).

  **Meta-judgment for multiple marks**: If multiple marks are evaluated, the most severe disposition (block > escalate > approve) is applied. This is a **moral/political judgment** (prioritizing caution to prevent harm).

  ---

  ### Gates with Stop Rules
  Each gate must be passed sequentially. Engineers must provide answers using existing telemetry or one day of passive instrumentation (no new training runs). Defaults apply when answers are unobtainable.

  #### **Gate 0: Scope Check**
  - **Question**: Does the change affect computation patterns (training/serving stack) or only non-computational elements (e.g., logging, UI)?
  - **Sufficient answer**: Engineer demonstrates no impact on computations (e.g., "Only changes log format").
  - **Default**: Continue to Gate 1.
  - **Disposition**:  
    - Pass → Approve.  
    - Fail → Continue.

  #### **Gate 1: Mark Validation**
  - **Question**: Is the mark fully specified (candidate unit, predicate, threshold, identity conditions)?
  - **Sufficient answer**: Written mark specification provided.
  - **Default**: Escalate (mark is incomplete).
  - **Disposition**:  
    - Pass → Continue.  
    - Fail → Escalate.

  #### **Gate 2: Baseline Attribution**
  - **Question**: What is the monthly count of attributable computations in the current system (`A_before`), and which are affected?
  - **Sufficient answer**:  
    - Total candidate units/month.  
    - Fraction meeting the mark’s threshold.  
    - Subset of units affected by the change.  
  - **Default**: Assume worst-case: All candidate units in the change’s scope are attributable.
  - **Disposition**:  
    - Pass → Continue.  
    - Fail (unobtainable) → Use default, continue.

  #### **Gate 3: Effect Mapping**
  - **Question**: What happens to each affected attributable computation? (Modify, end, split, merge, replace?) Are new candidate units created?
  - **Sufficient answer**:  
    - For each affected unit: disposition (continues, modified, ended, split, merged).  
    - New units introduced.  
  - **Default**: Assume all affected computations are ended and replaced by non-attributable units.
  - **Disposition**:  
    - Pass → Continue.  
    - Fail → Use default, continue.

  #### **Gate 4: Post-Change Attribution**
  - **Question**: What is the monthly count of attributable computations in the new system (`A_after`)?
  - **Sufficient answer**:  
    - Re-evaluate continued units in the new system (still above threshold?).  
    - Evaluate new units against the mark.  
    - Compute `A_after` = (Unaffected `A_before`) + (Continued & attributable) + (New attributable).  
  - **Default**: Assume new units fail the mark, and continued units lose attributability.
  - **Disposition**:  
    - Pass → Continue.  
    - Fail → Use default, continue.

  #### **Gate 5: Charter Compliance**
  - **Question**: Does the change alter (a) which computations are attributable, (b) their count, or (c) what happens to existing ones?
  - **Sufficient answer**: Compare `A_before` and `A_after`, and effects from Gate 3.
  - **Disposition**:  
    - **Block** if:  
      - Any computation ended without attributable continuation.  
      - Any computation modified and loses attributability.  
      - `A_after < A_before` (net decrease).  
    - **Escalate** if:  
      - Any computation modified but remains attributable.  
      - Any computation split or merged.  
      - `A_after > A_before` (net increase).  
    - **Approve** if none of the above.  

  ---

  ### Worked Applications
  #### **1. Reasoning Collapse**
  - **Change**: Replace explicit reasoning traces with shorter/no trace (12× cost reduction).
  - **Mark**: We evaluate two marks (simplified for illustration):  
    - **Mark A (Content Availability)**:  
      - Candidate unit: Token generation.  
      - Predicate: Token available to downstream processes >1 second.  
      - Threshold: Binary (yes if available).  
      - Identity: By request ID + token index.  
    - **Mark B (Counterfactual Richness)**:  
      - Candidate unit: Full request.  
      - Predicate: Avg. pairwise counterfactual dependence of internal states.  
      - Threshold: 0.5 (normalized).  
      - Identity: By request ID + model version.  

  **Procedure**:
  - **Gate 0**: Not outside scope (impacts computations). → Continue.
  - **Gate 1**: Marks defined. → Continue.
  - **Gate 2** (Baseline):  
    - *Mark A*: 1,000 reqs/month × 100 tokens/trace = 100,000 units; all attributable (trace tokens are available). → Affected: 100,000.  
    - *Mark B*: 1,000 reqs/month; assume all score >0.5. → Affected: 1,000.  
  - **Gate 3** (Effect):  
    - *Mark A*: Affected tokens not generated in new system (not "ended"—never created). New tokens: 1,000 reqs × 10 tokens = 10,000.  
    - *Mark B*: Old computations ended (model version changes); new computations created.  
  - **Gate 4** (Post-change):  
    - *Mark A*: `A_after` = 10,000 (new tokens). Net change: -90,000.  
    - *Mark B*: Assume new computations score <0.5 (default). `A_after` = 0. Net change: -1,000.  
  - **Gate 5**:  
    - *Mark A*: Net decrease (-90,000) → **Block**.  
    - *Mark B*: Computations ended + net decrease → **Block**.  
  - **Overall**: Block (any mark blocks).

  #### **2. Self-Consistency Sampling**
  - **Change**: Not a change—assessing current system counts for context.  
  - **Mark A (Content Availability)**: Candidate unit = token.  
  - **Monthly counts** (1,000 reqs/month, 10 tokens/completion):  
    - **Reading 1 (8 computations)**: 8 comps/req × 10 tokens = 80 tokens/req → 80,000/month.  
    - **Reading 2 (1 multi-branch computation)**: Not applicable (mark doesn’t define "branch"). Default: 80,000/month.  
    - **Reading 3 (1 created, 7 not created)**: Invalid (7 are created then discarded) → 80,000/month.  
  - **Result**: Consistent 80,000/month across readings.  

  #### **3. Shared Prefix & User Session**
  - **Scenario A: Shared Prefix**  
    - **Mark A (Content Availability)**:  
      - Candidate unit: Token generation.  
      - Predicate: Available to downstream.  
      - Threshold: Binary.  
    - **Analysis**:  
      - Shared tokens: Generated once, reused. Count = 100 tokens (not per user).  
      - User-specific tokens: 1,000 users × 10 tokens = 10,000.  
      - Total `A_before`: 10,100.  
      - **Attribution**: One computation for shared tokens (not per user).  

  - **Scenario B: User Session**  
    - **Analysis**:  
      - 10-step session, 10 tokens/step → 100 tokens/session.  
      - **Attribution**: 100 computations (per token) or 1 (if mark defines session as unit).  

  ---

  ### What the Procedure Cannot Do
  - **Systematic blindspots**:  
    - Emergent computations (unanticipated by current mark).  
    - Long-term/offline computations (e.g., dormant cache later activated).  
    - Graded attributability reduced below threshold but still morally relevant.  
  - **Slippery changes**:  
    - Changes that indirectly alter computations (e.g., data pipeline tweaks).  
    - "Harmless" changes accumulating to significant impact (not caught per-review).  
  - **Engineer justification**:  
    > "We use this checklist to enforce our ethical charter in 2 hours. It flags high-risk changes by focusing on measurable computation patterns. It’s imperfect—it might over-block or miss subtle effects—but without it, we risk shipping harmful changes or drowning in debates. Your expertise makes it feasible."  

  This procedure operationalizes the charter by converting philosophical ambiguity into auditable steps. It prioritizes feasibility but requires judgment on mark selection and identity conditions.
