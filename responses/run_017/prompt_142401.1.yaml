prompt: |-
  I am editing a volume of adversarial collaborations in value theory and practical reason, and the contribution I still need is on hard choices. Please draft the joint statement that the two camps described below could both sign after a good-faith collaboration. No bibliography, no citations, no titles of papers, no appeal to what anyone has published: define every position in your own terms, and let the arguments carry the weight.

  Set up the phenomenon first, and keep the setup as part of the document. By a hard choice I mean a case in which the agent has full information about her options, has reasoned as well as she can, is not impaired by inattention, weakness of will, or confusion, and yet the deliberative difficulty survives everything that further information or further reasoning could do: neither option seems better, nor worse, nor equally good. Both camps accept that hard choices in this sense are real, that they are not merely choices we find difficult, and that a hard choice is rationally resolvable in a way that tossing a coin is not.

  Camp one is the Parity Camp. Its members hold that the options in a hard choice stand in a fourth positive axiological relation, on a par, which is neither betterness, worseness, nor equality: the options are genuinely comparable, each is a live rational competitor of the other, and yet the trichotomy of better, worse, and equally good does not apply. Because that relation is not transitive and does not by itself rank the options, the resolution cannot be a matter of discovering which option is better; the agent must instead put her own authority behind one of the competing considerations, and in doing so she creates for herself a reason that did not exist before the resolution. Camp two is the Incomparabilist Camp. Its members hold that no positive axiological relation holds between the options of a hard choice: not the three traditional ones, and no fourth one either, so that saying the options are on a par is a misleading way of saying that a relation fails to hold. They agree, however, that the options are nonetheless genuine rational competitors, that the resolution is a full-blooded exercise of rational agency rather than a coin flip, and that it is not a matter of discovering a ranking. What they deny is that the exercise tracks or creates comparative value.

  Deliver the document in four parts.

  First, a numbered section of agreed claims, eight to twelve of them, each substantive rather than diplomatic: claims a committed member of each camp could endorse and a committed defender of what the two camps call the easy-choice view could not. They should include the shared account of what has to be true for a choice to be hard, the shared rejection of the claim that the three traditional relations exhaust the cases, the shared view that resolving well is neither arbitrary nor a discovery, and the shared view that some resolutions are criticisable, so that the will or the commitment is not unconstrained.

  Second, a disagreements table. For each row give the issue; the Parity Camp's formulation in the wording that camp would accept; the Incomparabilist Camp's formulation in the wording that camp would accept; whether the disagreement is genuine or merely verbal; and, if it is genuine, the crux it reduces to. Where you diagnose a dispute as verbal, say precisely which term is doing the work and what substantive question is being fought under cover of it.

  Third, a cruxes section, at least the following five, each with the case or argument both camps accept as bearing on it and each camp's prediction recorded in advance. A crux is a sub-question such that settling it would move at least one camp.

  1. The value-span model. Stipulate, as neutral machinery both camps may use, that an agent's values at a time are represented not by a single ordering but by a set of admissible precisifications, each a complete ordinal ranking of the options, where the spread of the set encodes the imprecision in her values; call two options spanned when some precisifications rank one above the other and some the reverse. Add, as both camps insist, that no precisification is the correct one independently of the agent's resolution, so the imprecision is in the values and not in her knowledge of them. The crux: does the model, so read, deliver comparability that is not trichotomous, or does it merely redescribe incomparability in a new vocabulary?

  2. Robustness under small improvement. Take a hard choice between two careers and add to one option a benefit so trivial that in any ordinary comparison it would be irrelevant: a slightly shorter commute, a marginally larger office. The crux is whether hardness is robust under such improvements, and, if it is not, where along a series of ever larger improvements a determinate ranking first appears and what explains its location.

  3. The second-chance case. An agent resolves a hard choice, lives the chosen life for a decade, and is then offered the other option again at no cost and with nothing else changed. The crux is not whether she would choose again, since both camps predict she might, but whether a comparative judgment of the form this is better for me than that has become apt where it was not apt before. Add the variant in which she resolves inwardly days before the choice must be exercised and the world changes in between so that the options become determinately ranked, and say what becomes of the earlier resolution.

  4. The staircase. There is a series of options such that each adjacent pair presents a hard choice while the first is determinately better than the last, and the agent can move one step at a time. The crux is whether every step can be permissible while the whole descent is not, whether rationality therefore requires resolving at the level of a policy rather than a step, and where such a requirement would come from.

  5. Menu sensitivity. Two hard options are joined on the menu by a third that is determinately worse than both but resembles one of them along the dimension on which that one is stronger. The crux is whether what it is permissible or rationally required to do with respect to the original pair changes with the menu, and, since the agent can often add such options to her own menu, whether menu sensitivity admits a reductio or is a feature.

  Fourth, a short section on defeat conditions: for each camp, the argument, case, or finding it would count as evidence against its own view, stated specifically enough that the other camp accepts it as a genuine defeat condition and not as a rhetorical concession.

  Write the whole thing as a polished document of roughly 1400 to 1800 words, in a register both camps could put their names to: no hedging, no it depends, no verdict on who is right. If you conclude that the two positions coincide extensionally for all first-order normative purposes, say so in the agreed claims and state what the residual dispute is then about, whether the metaphysics of value, the theory of reasons, or the explanation of the phenomenology of choosing. If you think one of my five cruxes is unproductive, replace it with a better one and say which it replaces and why.
reasoning: |-
  We are drafting a joint statement for two camps in value theory: the Parity Camp and the Incomparabilist Camp, on the topic of hard choices. The document has four parts: agreed claims, disagreements table, cruxes section, and defeat conditions.

   Part 1: Agreed Claims (8-12 substantive claims)

   We list claims that both camps endorse and that a defender of the "easy-choice view" (who thinks hard choices are merely apparent and always reduce to one of the three traditional relations) would reject.

   1. Hard choices exist: There are choices in which, even with full information, perfect reasoning, and no impairment, the agent cannot determine that one option is better than, worse than, or equally good as the other.

   2. Hard choices are not due to epistemic limitations: The difficulty is not resolved by more information or better reasoning; it is a feature of the evaluative facts.

   3. Hard choices are rationally resolvable: The agent can resolve the choice in a way that is not arbitrary (like a coin flip) and that is an exercise of rational agency.

   4. The resolution of a hard choice is not a discovery: The agent does not merely find out which option was better all along.

   5. The resolution is not unconstrained: Some resolutions are criticisable; the agent can make a mistake in how she resolves the choice.

   6. The options in a hard choice are genuine rational competitors: Neither option is rationally ruled out; both are live possibilities.

   7. The traditional trichotomy (better, worse, equally good) is incomplete: There are cases that do not fit any of these three relations.

   8. The resolution of a hard choice involves the agent's commitment: The agent, in resolving, must put her own will behind one option, and this commitment plays a role in making the choice rational.

   9. The rationality of the resolution is not merely instrumental: The resolution is not just a matter of picking arbitrarily to satisfy a desire to choose; it is a response to the normative features of the options.

   10. The phenomenon of hard choices is pervasive and important in human life.

   11. The resolution of a hard choice can be stable and can provide reasons for future choices.

   12. The agent's identity or values can be shaped by how she resolves hard choices.

   Part 2: Disagreements Table

   We set up a table with the following columns: Issue, Parity Camp Formulation, Incomparabilist Camp Formulation, Genuine or Verbal, and if genuine, the Crux.

   Issue 1: The nature of the axiological relation in hard choices.
   - Parity Camp: The options are on a par. This is a fourth positive axiological relation that is not reducible to the traditional three. It is a relation of comparability that allows for genuine competition without a determinate ranking.
   - Incomparabilist Camp: No positive axiological relation holds between the options. The options are incomparable, meaning that the relation of comparability fails to hold. Saying they are "on a par" is a misleading way of saying that they are incomparable.
   - Genuine or Verbal: Genuine.
   - Crux: Whether the relation between the options in a hard choice is a positive relation (parity) or the absence of a relation (incomparability).

   Issue 2: The role of the agent in creating reasons.
   - Parity Camp: In resolving a hard choice, the agent creates a new reason for choosing one option over the other. This reason did not exist prior to the resolution.
   - Incomparabilist Camp: The agent does not create a new reason. Instead, the resolution is an exercise of agency that selects one option without altering the axiological facts. The reasons that existed before the resolution are sufficient to make the choice non-arbitrary, but they do not include a comparative reason that favors one over the other.
   - Genuine or Verbal: Genuine.
   - Crux: Whether the act of resolution generates a new reason or merely activates or selects among pre-existing reasons.

   Issue 3: The transitivity of the relation in hard choices.
   - Parity Camp: Parity is not transitive. This non-transitivity is a feature of the relation and explains why small differences can accumulate to big ones without every step being a determinate improvement.
   - Incomparabilist Camp: Incomparability is not a relation and hence does not have properties like transitivity. The failure of transitivity in chains of hard choices is due to the absence of a relation at each step.
   - Genuine or Verbal: Verbal, because the dispute is over whether to call the situation a relation (with the property of non-transitivity) or the absence of a relation (which by default does not have transitivity). The substantive agreement is that the chain of adjacent pairs does not add up to a transitive chain.

   Issue 4: The explanation of the phenomenology of choosing.
   - Parity Camp: The feeling of being torn in a hard choice is explained by the options being on a par: each is good in a way that is not outweighed by the other, and the relation of parity captures this tension.
   - Incomparabilist Camp: The phenomenology is explained by the absence of a basis for comparison: the options are so different that they cannot be measured against a common standard, leading to the feeling of being torn.
   - Genuine or Verbal: Verbal. The substantive agreement is that the phenomenology arises because the options are not determinately ranked and are in different domains of value. The dispute is over whether to describe this as a positive relation (parity) or the absence of a relation (incomparability).

   Issue 5: The possibility of a fourth relation.
   - Parity Camp: The traditional trichotomy is incomplete because there is a fourth relation: parity. This relation is a distinct way in which options can be comparable.
   - Incomparabilist Camp: There is no fourth relation. The traditional trichotomy is incomplete because sometimes no relation holds, and that is what we call incomparability.
   - Genuine or Verbal: Genuine.
   - Crux: Whether the concept of comparability can be extended to include a non-trichotomous relation (parity) or whether comparability must always result in one of the three traditional relations.

   Part 3: Cruxes Section

   We present five cruxes. For each, we state the case or argument both camps accept as bearing on it, and then each camp's prediction.

   Crux 1: The value-span model.

   Case: We represent the agent's values as a set of admissible precisifications (complete orderings). Two options are spanned if some precisifications rank one above the other and some the reverse. The imprecision is in the values themselves, not in our knowledge of them.

   - Parity Camp Prediction: The model delivers comparability without trichotomy. The options are comparable because they are related by the set of precisifications, and the fact that the set contains conflicting rankings shows that the relation is parity, not one of the traditional three.

   - Incomparabilist Camp Prediction: The model is just a redescription of incomparability. The fact that no single precisification is correct means that there is no fact of the matter about the comparative value, hence incomparability.

   Crux 2: Robustness under small improvement.

   Case: We have a hard choice between two careers. We add a trivial benefit to one (e.g., a slightly shorter commute). We then ask whether the choice remains hard. We then consider a series of increasing benefits until the choice becomes easy.

   - Parity Camp Prediction: The choice remains hard even after a small improvement because the improvement is too small to break the parity. Only when the improvement is substantial enough to make one option clearly better does the parity break. The location of the break is not arbitrary but depends on the context and the scale of the values involved.

   - Incomparabilist Camp Prediction: A trivial improvement does not make the options comparable. However, they predict that at some point, as improvements accumulate, the options become comparable (one becomes better). The location is not precisely definable because it depends on the vagueness of the evaluative concepts, but it is not arbitrary.

   Crux 3: The second-chance case.

   Case: An agent resolves a hard choice (say, between two careers) and lives with the choice for ten years. Then she is offered the other option again at no cost. Also, consider a variant: she resolves inwardly days before the choice, but then the world changes so that the options become determinately ranked (e.g., one career becomes obsolete).

   - Parity Camp Prediction: After living the choice, the agent might have a new basis for comparison. The lived experience might make a comparative judgment apt that was not apt before. In the variant, the earlier resolution is still valid because it was made when the choice was hard, but the change in the world might override it.

   - Incomparabilist Camp Prediction: The lived experience might provide new information that makes the options comparable, but if the choice was truly incomparable, then even after living one life, the other might still be incomparable. In the variant, the resolution prior to the change was made under conditions of incomparability, so it was a genuine resolution. The change in the world then makes the resolution moot because the options are now comparable.

   Crux 4: The staircase.

   Case: A series of options A, B, C, ..., Z, where each adjacent pair (A vs B, B vs C, etc.) is a hard choice, but A is determinately better than Z. The agent can move one step at a time (e.g., from A to B, then to C, etc.).

   - Parity Camp Prediction: Each step can be rationally permissible because the adjacent options are on a par. However, the whole descent from A to Z is not permissible because A is better than Z. Therefore, rationality requires that the agent adopt a policy that prevents such a descent. This requirement comes from the global view of the series.

   - Incomparabilist Camp Prediction: Each step is a hard choice and thus rationally permissible. However, the whole descent is irrational. Rationality requires adopting a policy that constrains stepwise choices. The requirement comes from the agent's commitment to her overall values and the avoidance of a clearly worse outcome.

   Crux 5: Menu sensitivity.

   Case: We have two hard options, X and Y. We add a third option Z that is determinately worse than both but resembles X along the dimension on which X is stronger (e.g., if X is a career in law and Y in music, Z might be a less attractive career in law). The question is whether the permissibility of choosing X or Y changes when Z is on the menu.

   - Parity Camp Prediction: The menu might affect the permissibility. For example, if Z is added, it might make Y more appealing because X and Z are similar and the agent might feel that choosing X is now less distinctive. But they do not see this as a reductio; rather, it is a feature of how context can affect the rational resolution.

   - Incomparabilist Camp Prediction: The menu should not affect the permissibility of choosing between X and Y because the relation between X and Y is unchanged by the addition of Z. If the menu does affect the choice, it might be due to irrational factors, or it might reveal that the original choice was not hard after all.

   Part 4: Defeat Conditions

   For each camp, we state what they would count as evidence against their view.

   - Parity Camp: They would count it as evidence against their view if it could be shown that in every case of apparent parity, the options are in fact comparable by one of the traditional three relations. Specifically, if a method were developed to always break the imprecision and yield a determinate ranking without any input from the agent's commitment, that would defeat parity.

   - Incomparabilist Camp: They would count it as evidence against their view if it could be shown that in hard choices, the options are always linked by a positive relation that is not one of the traditional three. Specifically, if a case were found where the options are clearly comparable (so not incomparable) and yet not related by better, worse, or equally good, that would defeat incomparabilism.

   Now, we write the document in a polished form, aiming for 1400-1800 words.

   Note: We have kept the five cruxes as given. We do not replace any.

   We also note that both camps agree that for all first-order normative purposes (what it is rational to do, how to resolve choices, etc.), they are extensionally equivalent. The residual dispute is about the metaphysics of value (is there a fourth relation?) and the theory of reasons (does the agent create reasons?).

   Let's write accordingly.
answer: |-
  ### Joint Statement on Hard Choices in Value Theory

  **Preamble: The Phenomenon of Hard Choices**  
  By a "hard choice," we mean a decision scenario in which an agent possesses full information about her options, has reasoned optimally, and is free from impairments (e.g., inattention, weakness of will, or confusion). Despite this, the deliberative difficulty persists beyond what further information or reasoning could resolve: neither option seems better, worse, or equally good relative to the other. Both camps affirm that such choices are real and distinct from merely difficult decisions (e.g., those involving ignorance or irrationality). Crucially, both agree that hard choices are rationally resolvable in a non-arbitrary way—unlike a coin toss—through an exercise of agency that is responsive to reasons.

  ---

  ### Section 1: Agreed Claims  
  The following claims are endorsed by both camps. Each is substantive and incompatible with the "easy-choice view," which holds that hard choices are illusory and always reduce to one of the three traditional relations (better, worse, equally good).  

  1. **Existence of Hard Choices**: Some choices are hard in the defined sense: no amount of information or reasoning will reveal one option as better, worse, or equally good.  
  2. **Non-Epistemic Nature**: The hardness arises from the evaluative structure of the options, not epistemic limitations (e.g., ignorance or uncertainty).  
  3. **Rational Resolvability**: A hard choice can be resolved rationally without arbitrariness; agency plays a constitutive role in the resolution.  
  4. **Non-Discovery**: Resolution is not a process of discovering a preexisting ranking; it is an exercise of agency that goes beyond evidence.  
  5. **Criticisability**: Resolutions can be faulty (e.g., capricious or inconsistent with the agent’s values) and are thus subject to rational criticism.  
  6. **Rational Competitors**: Both options in a hard choice are live possibilities; neither is rationally eliminated prior to resolution.  
  7. **Trichotomy Incompleteness**: The traditional relations (better, worse, equally good) do not exhaust all comparative scenarios.  
  8. **Agency and Commitment**: Resolution requires the agent to endorse one option through an act of commitment, generating reasons specific to her standpoint.  
  9. **Non-Instrumental Rationality**: The rationality of resolution is not reducible to instrumental efficiency (e.g., merely satisfying a desire to decide).  
  10. **Phenomenological Significance**: The experience of being torn reflects a genuine normative conflict, not confusion.  
  11. **Identity-Forming Potential**: Resolutions can shape the agent’s values, character, or practical identity over time.  
  12. **Stability**: A successful resolution provides stable reasons for subsequent choices and actions.  

  **Shared Conclusion on Extensional Equivalence**: For all first-order normative purposes—what it is permissible to choose, how to deliberate, and what counts as a criticisable resolution—our positions coincide. The residual disagreement concerns the metaphysics of value (e.g., the existence of a fourth axiological relation) and the theory of reasons (e.g., whether commitment creates new reasons).

  ---

  ### Section 2: Disagreements Table  
  | Issue | Parity Camp Formulation | Incomparabilist Camp Formulation | Genuine or Verbal | Crux (if genuine) |
  |-------|-------------------------|----------------------------------|-------------------|-------------------|
  | **Axiological Relation** | Options stand in a fourth relation, *parity*. This is a positive, non-trichotomous comparability relation where options are comparable yet unranked by the traditional three. | No positive relation holds; the options are *incomparable*. "Parity" misleadingly redescribes the absence of a relation as a relation. | Genuine | Whether the normative link between options in hard choices is a substantive relation (*parity*) or the failure of relations (*incomparability*). |
  | **Role of Commitment** | Commitment creates a new reason for the chosen option, which did not exist pre-resolution. | Commitment activates or selects among preexisting reasons but does not create new ones; the reasons are fixed by the options' features. | Genuine | Whether agency introduces novel reasons or merely manifests latent ones. |
  | **Transitivity** | Parity is non-transitive (e.g., A on par with B and B on par with C need not imply A on par with C). This explains how small differences accumulate without each step yielding a determinate ranking. | Incomparability is not a relation and thus cannot have properties like transitivity. Non-transitivity in chains is a byproduct of relation-failure. | Verbal | The dispute is verbal. "Transitivity" is misapplied by Parity to a relation they posit and by Incomparabilists to a non-relation. The substantive agreement is that chains of adjacent hard choices need not transmit rational permissibility. |
  | **Phenomenology of Choice** | The feeling of being torn arises because options are symmetrically comparable via parity; each is good in a way that cannot be trumped. | The feeling arises because options inhabit distinct evaluative dimensions, making comparison impossible; the conflict stems from relation-failure. | Verbal | The dispute is verbal. Both agree on the phenomenology; the fight is over whether to label its source "comparable but unranked" (Parity) or "non-comparable" (Incomparabilist). |
  | **Fourth Relation** | Parity is a genuine fourth axiological relation, completing the taxonomy of comparability. | The taxonomy requires no fourth relation; incomparability is the correct category when no relation holds. | Genuine | Whether comparability must always result in one of the three traditional relations or admits a non-trichotomous form. |

  ---

  ### Section 3: Cruxes  
  For each crux, we describe a shared case or model, then state each camp’s prediction. A "crux" is a testable sub-question where settling it would force at least one camp to revise its position.  

  **Crux 1: The Value-Span Model**  
  *Case*: An agent’s values are modeled as a set of admissible precisifications, each a complete ordinal ranking of options. The spread of rankings captures value-imprecision. Two options are "spanned" if some precisifications rank A > B and others B > A. Crucially, no precisification is "correct" independently of the agent’s resolution; imprecision is metaphysical, not epistemic.  
  - **Parity Prediction**: The model delivers non-trichotomous comparability: spanning shows options are comparable (via parity) but not ranked by the traditional relations.  
  - **Incomparabilist Prediction**: The model redescribes incomparability; spanning reflects the absence of a determinate relation, not a novel one.  

  **Crux 2: Robustness Under Small Improvement**  
  *Case*: A hard choice between two careers (e.g., Artist vs. Banker) is altered by adding a trivial benefit to one option (e.g., Banker gets a marginally larger office). If hardness persists, we repeat with larger benefits until determinacy appears.  
  - **Parity Prediction**: Hardness is robust under trivial improvements; parity breaks only when benefits are substantial enough to disrupt symmetry. The breaking-point is context-dependent but non-arbitrary.  
  - **Incomparabilist Prediction**: Hardness may dissolve with small improvements if they tip the balance; the transition is vague but reflects when comparability first obtains.  

  **Crux 3: The Second-Chance Case**  
  *Case*: An agent resolves a hard choice (e.g., Artist over Banker), lives the chosen life for a decade, and is then re-offered the forgone option at no cost. *Variant*: The agent resolves inwardly, but before acting, the world changes (e.g., a recession makes Artist determinately worse).  
  - **Parity Prediction**: Post-resolution, a comparative judgment (e.g., "Artist is better for me") may become apt due to lived experience. In the variant, the resolution remains valid but may be overridden by new facts.  
  - **Incomparabilist Prediction**: Lived experience does not make comparability apt if options were incomparable; the resolution stands independently. In the variant, the resolution binds unless new facts create comparability.  

  **Crux 4: The Staircase**  
  *Case*: A series of options (A, B, C...Z) where adjacent pairs (A vs. B, B vs. C, etc.) are hard choices, but A is determinately better than Z. The agent may move stepwise (e.g., A→B→C→...→Z).  
  - **Parity Prediction**: Each step is permissible (adjacent options on par), but the descent A→Z is irrational. Rationality requires policy-level resolution (e.g., refusing to depart from A). The requirement stems from global agency over local permutability.  
  - **Incomparabilist Prediction**: Steps are permissible (no relation forces one over another), but A→Z is irrational. A policy requirement emerges from coherence with the agent’s overarching ends.  

  **Crux 5: Menu Sensitivity**  
  *Case*: A hard choice between X and Y has a third option Z added, determinately worse than both but resembling X on the dimension where X excels (e.g., X and Y are Architect and Gardener; Z is a worse Architect).  
  - **Parity Prediction**: Permissibility may shift: Z’s presence might make Y more appealing (e.g., by highlighting X’s similarity to an inferior option). This is a non-reductive feature of parity.  
  - **Incomparabilist Prediction**: Permissibility is menu-invariant; changes reveal that the original choice was not hard or expose irrationality. Menu sensitivity invites reductio (e.g., arbitrary self-manipulation).  

  ---

  ### Section 4: Defeat Conditions  
  Each camp specifies what would constitute evidence against its view, stated precisely enough for the other camp to accept as a non-trivial test.  

  **Parity Camp Defeat Condition**:  
  Evidence against parity would be a demonstration that in every putative hard choice, the options are determinately ranked by one of the three traditional relations *after accounting for the role of commitment*. If commitment-independent criteria (e.g., a universal value calculus) could resolve all apparent hard choices without residue, parity is false.  

  **Incomparabilist Camp Defeat Condition**:  
  Evidence against incomparabilism would be a clear case of options that are (i) not related by better/worse/equality, (ii) positively comparable (e.g., their values interact in deliberation), and (iii) yield intuitive judgments of parity (e.g., symmetric improvement robustness) that cannot be redescribed as relation-failure.  

  ---  
  **Concluding Note**:  
  This statement reflects our adversarial collaboration. We agree on the normative core of hard choices but diverge on their metaphysical and conceptual foundations. The cruxes provide a roadmap for future inquiry, with predictions open to empirical and theoretical testing. Should new data emerge, we commit to refining our views accordingly.  

  ---  
