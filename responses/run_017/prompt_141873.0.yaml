prompt: |-
  For thirty-odd years I worked on replication and repair enzymes, and since retiring I have been sitting in on a reading group in the philosophy department that is currently working through cultural evolution. I arrived sympathetic to the Darwinian approach to culture — the idea that ideas, techniques and stories form lineages with heritable variation in their own transmissibility has the right shape to me — and one of the other retired people in the group is an enthusiastic defender of treating memes as a genuine second replicator. At the last session I presented the argument below, which I had put together partly to needle him, and I have since become suspicious of it. Not because I can find a step that is clearly false, but because I think it proves considerably more than I am willing to accept, and I cannot locate the mistake precisely enough to say what I am giving up.

  (1) A Darwinian explanation of why some trait recurs in a population requires more than recurrence: it requires heritable variation in fitness. Copies must resemble their sources in whatever respects affect their probability of being copied again.
  (2) Cultural transmission does not deliver that. Nothing stored in one head is transferred into another; a learner observes or is told something, infers a representation, and later generates behaviour from it. In experimental diffusion chains the content is visibly transformed within a few steps, and the "same" variant in two different people is identified retrospectively, by similarity of what they say or do.
  (3) If what passes between people is a reconstruction rather than a copy, then the resemblance between one person's version and the next person's is not descent with modification. It is the repeated generation of a similar product by a shared generative mechanism — the same relation that holds between a genotype and the phenotype that development builds from it.
  (4) So what explains the recurrence and the population-level distribution of cultural items is the structure of that generative mechanism: the psychological and ecological factors that make some versions easier to reconstruct than others, which the anthropologists in the group call attractors. Selection among cultural variants is then a redescription of the population-level output, not the causal process behind it, and treating memes as replicators adds nothing that the study of those biases does not already give us.
  (5) But nothing in (1)–(4) depends on anything peculiar to culture. An organism is not a copy of its genome either. Every generation rebuilds the phenotype from DNA together with the machinery of the cell; development is sensitive to context, is channelled onto a limited set of outcomes, and "the same" trait in parent and offspring is identified retrospectively by similarity of phenotype.
  (6) So if steps (2)–(4) are sound, the parallel argument shows that natural selection on genes does not causally explain the recurrence of adaptive phenotypes — only the structure of development does — and that talk of genes as replicators adds nothing. That I cannot accept: whatever else is true, selection on genes is the paradigm causal explanation in my old field.
  (7) There is also a sharper, quantitative version from my own area that reaches the same conclusion. Quasispecies theory gives an error threshold: the amount of information selection can hold together in a lineage is bounded by the accuracy of copying per unit copied, up to a factor depending on the selective advantage, and without repair the limit is reached very quickly. The copying fidelity reported for cultural transmission chains looks worse than that, so by the threshold criterion no complex cultural item could be maintained by selection on transmission; it would have to be regenerated. Yet my colleagues routinely treat RNA viruses — whose copying fidelity per nucleotide is far worse than anything I have seen quoted for diffusion chains, and which lack the repair machinery that DNA genomes have — as evolving by selection on their sequences. So the raw fidelity number cannot be doing the work I wanted it to do.

  What I would like from you is a diagnosis: which step should I reject, and what does rejecting it cost me? I would prefer to keep (1) in some form, and I do not want to abandon the claim in (2) that much of cultural transmission is reconstructive at the micro-level, because I find that empirically well supported; nor do I want to concede that every domain of culture is handled equally well by the same story, since cumulative technology feels quite different from urban legends or religious concepts. My suspicion is that I have slid between two different notions of heredity, or between "the item is not copied" and "the item is not heritable", but I cannot make the distinction sharp enough to say where (3) stops being a good inference, and I would rather not simply pick whichever step saves the conclusion I like. If more than one step will do the job, tell me which is cheapest and what each of the alternatives commits me to about the cases in (6) and (7).
reasoning: |-
  Hmm, the user is a retired molecular biologist who's been participating in a philosophy reading group on cultural evolution. They presented an argument challenging the meme concept as a genuine replicator, but now suspect it might prove too much since it seems to undermine genetic evolution too. They want help identifying where their reasoning fails.

  Key points from their argument:
  - Claims Darwinian explanations require actual copying with heritable variation (step 1)
  - Argues cultural transmission involves reconstruction not copying (step 2)
  - Concludes cultural stability comes from generative biases ("attractors") not selection (steps 3-4)
  - Realizes this logic could apply to genetics too - phenotypes aren't copied but reconstructed (step 5)
  - Finds this conclusion unacceptable for genetics (step 6)
  - Notes quasispecies theory shows even low-fidelity systems like RNA viruses evolve through selection (step 7)

  Their constraints:
  - Wants to preserve step 1 (core Darwinian requirement)
  - Won't abandon step 2 (reconstructive nature of culture)
  - Wants domain sensitivity (e.g. tech vs legends)
  - Suspects a conflation between "not copied" and "not heritable"

  The core tension is between causal efficacy and material continuity in heredity. In genetics, while phenotypes aren't copied, the DNA sequence is physically transmitted with high fidelity. In culture, what's transmitted are stimuli that trigger reconstructions.

  The solution lies in step 3's analogy being flawed. Genetic transmission has a preserved material substrate (DNA sequence) that serves as a hereditary vehicle. Cultural transmission often lacks this - the "copying" happens at the level of behavior/output, not the underlying representation.

  For step 7 about RNA viruses: while they have high mutation rates, they still have physical template copying of nucleotides. Cultural transmission chains involve no such physical template - each reconstruction builds anew from observed behavior.

  The cheapest fix is to reject the symmetry claim in step 5 by clarifying that genetics has privileged hereditary material while culture often doesn't. This preserves the validity of selection in genetics while allowing that cultural evolution sometimes operates differently - particularly for non-cumulative domains where attractors dominate.

  Alternative fixes would be more costly: weakening step 1 would undermine Darwinism itself, while rejecting step 2 ignores empirical evidence about cultural transmission.
answer: |-
  Your argument is clever and exposes genuine tensions in evolutionary theory applied to different domains. The core problem lies in **step (3) and the analogy it enables in step (5)**. You correctly identify a conflation between "not copied" and "not heritable," but the deeper issue is a misapplication of *hereditary material* versus *hereditary information*. Here’s a step-by-step diagnosis, the cheapest fix, and its implications for your concerns.

  ### The Flaw: Misidentifying the Unit of Heredity
  - **Step (3) is the critical error**: It equates the *reconstruction of phenotypes* in biology with the *reconstruction of cultural representations* in culture. This ignores a fundamental asymmetry:  
    - In biology, **genes (DNA sequences) are physically copied** with high fidelity (despite noise). Development reconstructs the *phenotype* from this template.  
    - In culture, **no stable physical template is typically copied**. What is "transmitted" is a stimulus (e.g., behavior, speech) that *triggers* reconstruction in the learner’s mind. The "hereditary material" (if any) is the learner’s *internal representation*, but this is not directly copied; it is inferred from observed outputs.  

  Step (3) falsely assumes that because phenotypes are reconstructed, genetic heredity is analogous to cultural transmission. But the genetic system has a **privileged material substrate** (DNA) that *is* copied and serves as a causal anchor for heredity. Culture often lacks this, making the analogy break down.

  ### The Cheapest Fix: Reject Step (3)'s Analogy
  **Reject the claim that cultural transmission is analogous to phenotype-genotype relations in biology.**  
  - **Cost**: You must accept that cultural evolution lacks a consistent, material "replicator" akin to DNA. Memes, if they exist, are not replicators in the strict genetic sense.  
  - **What it preserves**:  
    - Steps (1) and (2) remain intact. Heritable variation requires resemblance in *causally relevant* properties, and cultural transmission is indeed reconstructive.  
    - Step (4) holds for *some* cultural domains (e.g., urban legends, religious concepts) where attractors dominate.  
    - Step (6) is neutralized: Genetics retains its explanatory power because DNA *is* physically copied, providing heritable variation.  
    - Step (7) is resolved: RNA viruses *do* have template copying (of nucleotides), even with low fidelity. Cultural "diffusion chains" lack this; they copy outputs, not templates.  

  ### Why This Fix Works
  1. **Heredity requires a conserved substrate**:  
     - Genes: DNA sequences are conserved across generations *as physical structures*. Mutations are deviations from this template.  
     - Culture: No conserved substrate exists. The "same" cultural variant (e.g., a proverb) in two people may arise from different internal representations, reconstructed from similar outputs. Resemblance is often functional, not structural.  

  2. **Implications for cultural domains**:  
     - **Cumulative technology** (e.g., toolmaking) *can* exhibit replicator-like dynamics if external artifacts (e.g., blueprints, tools themselves) serve as templates. Here, selection might operate on transmitted designs.  
     - **Urban legends/religious concepts** rely more on attractors (psychological biases) because they lack stable templates. Your intuition about domain differences is correct and preserved.  

  3. **Resolves the quasispecies issue (step 7)**:  
     - RNA viruses replicate via template-directed polymerization. Error rates are high, but the *mechanism* is still copying of a physical sequence. Cultural diffusion chains lack this; they involve behavioral re-enactment triggering inference. The fidelity metrics are incomparable.  

  ### Alternatives and Their Costs
  1. **Reject Step (2)**: Argue that some cultural transmission *does* involve copying (e.g., rote memorization).  
     - **Cost**: You must abandon empirical support for reconstructive transmission. Also, this fails for most cultural domains (e.g., skill learning) and doesn’t resolve the analogy problem in step (5).  

  2. **Reject Step (1)**: Broaden "heritable variation" to include non-copying systems.  
     - **Cost**: Undermines the Darwinian paradigm itself. Selection becomes a metaphor, not a causal mechanism. This is more expensive than you want.  

  3. **Reject Step (4)**: Claim attractors are part of selection (e.g., via "selective retention").  
     - **Cost**: Conflates selection with filtering. Attractors are pre-selection biases; they explain *why* some variants are retained, not how they vary/heritablly persist. Weakens explanatory power.  

  ### Conclusion
  **Reject step (3)'s analogy as false symmetry.** This is the cheapest fix: it costs you the meme-as-replicator concept for most cultural domains but preserves the core of Darwinian biology and your empirical view of culture. It also accommodates your domain-sensitive intuition—technology *can* have replicator-like elements when external templates exist, while legends rely on attractors. 

  In genetics, development reconstructs phenotypes, but genes *are* replicators because they are copied material substrates. In culture, the absence of such substrates (except in special cases) means "memes" are often better described as attractor-driven reconstructions. This resolves the paradox in steps (6) and (7) without overthrowing your life’s work. 

  If you adopt this, your argument becomes a powerful critique of *strong* memetics while leaving room for weaker, domain-specific cultural selection models. Your molecular perspective has exposed a real limit: evolution without material replication is possible, but it isn’t Darwinian in the strict sense.
