  1. Hidden-nature-gradually-revealed (essentialism): There is a hidden essence that makes something homemade, and as we discover more about the world, we adjust our concept accordingly. Slippage occurs because we are refining our understanding of the essence.

  2. Meaning-shifted (merely verbal dispute): Disputes about whether something is homemade are merely verbal because the meaning of the term has shifted in different contexts.

  3. Cluster or similarity-to-paradigm (family resemblance): The concept is held together by a cluster of properties, or by similarity to a paradigm case, without a fixed definition.

  4. Copycat/valence-transfer: We extend the term to new cases because they evoke the same positive associations (care, authenticity, prestige) as the paradigm, not because they share the same defining features.

  5. Fluid-concept: The concept is held together by active analogy to the paradigm, so slippage is a feature, not a bug.

  6. Practitioner's call: The extension of the term is determined by the practices and decisions of the community that uses it.

  7. Engineering story: It's up to us to fix the concept for clarity and utility.

  We avoid certain words: vague, essence, family resemblance, verbal, deference, externalism, stipulation, concept.

