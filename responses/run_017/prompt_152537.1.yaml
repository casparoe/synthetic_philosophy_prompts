  Hey — I need a handout for my 200-level philosophy of language seminar and I want an instrument, not an explainer. Topic is conceptual slippage in a microdomain, and I've picked 'homemade' as the domain because nobody has an opinion about it yet: a box-mix cake you added your own eggs to, a meal-kit dinner you cooked, store-bought dough you baked, the family casserole where you swapped one ingredient for canned soup, a dish assembled at home out of takeout components, 'homemade' on a restaurant menu meaning made on the premises, a dish a machine cooked in your kitchen from ingredients you chose. Call a copycat concept one whose extension travels by transferred valence: we go on applying the word because the new case has the care/authenticity/prestige feel of the paradigm, not because it shares whatever made the paradigm an instance. Call a fluid concept one held together by active analogy to the paradigm rather than by a stored definition, so that slippage is how it works rather than a defect in it.

  What I want is a 'which account of slippage are you actually committed to?' quiz. Eight or nine questions, each a concrete case or a forced choice about a case, phrased so someone who's never done philosophy of language can answer, and no question may contain the words vague, essence, family resemblance, verbal, deference, externalism, stipulation, or concept. No question should just ask 'is it homemade?' — sort them by what they say about the sequence of cases. Two or three of the questions should definately be stepwise: three or four tiny variations out from the paradigm, asking where exactly the word gives out, so that tolerance pressure does the sorting rather than raw intuition.

  Build it from the logical space first — the questions and which combinations of answers they permit — then locate the actual accounts in that space: the hidden-nature-gradually-revealed story, the meaning-shifted-so-the-dispute-is-merely-verbal story, the cluster-or-similarity-to-paradigm story, the copycat/valence-transfer story, the fluid-concept story, the it's-the-practitioners'-call story, and the it's-ours-to-fix engineering story. Flag any two leaves your questions can't actually pull apart instead of pretending they separate, and give me at least two answer combinations nobody occupies, each with one line on whether that's because it's incoherent, merely unattractive, or just unexplored. Scoring key at the end mapping answer patterns onto accounts, keyed to what they said about cases and not to which name they'd pick for themselves. Don't summarize the positions for me — I've got those; I want the thing I can hand out.
