  7. You have a machine in your kitchen. You select ingredients (e.g., flour, water, yeast) and put them in the machine. The machine then mixes, kneads, bakes, and produces a loaf of bread with no further effort from you. Is the bread homemade?
       a) Yes, because you chose the ingredients and the machine is just a tool in your home.
       b) No, because the machine did all the work; you just provided ingredients.
       c) It's homemade in the sense that it's made at home, but it's not handmade.
       d) The term "homemade" doesn't apply well here; we might need a new term.

  8. A restaurant advertises "homemade pasta". The pasta is made by the restaurant's staff in the restaurant's kitchen from flour and eggs. Is this use of "homemade" appropriate?
       a) Yes, because it's made on the premises, and that's what "homemade" means in a restaurant.
       b) No, because "home" refers to a home, not a restaurant.
       c) It's appropriate if they mean it's made from scratch, even if not in a home.
       d) It's misleading because people expect homemade to mean made in a home.

  9. Consider a fruit jam. 
     Step 1: You pick the fruit from your garden and make the jam from scratch at home.
     Step 2: You buy the fruit from a store and make the jam from scratch at home.
     Step 3: You buy a canned fruit puree and add sugar and pectin to make the jam at home.
     Step 4: You buy a pre-made jam and just reheat it at home to pour into a jar.

     At which step does it stop being homemade?
       a) Between 1 and 2
       b) Between 2 and 3
       c) Between 3 and 4
       d) Step 4 is still homemade because you did something at home.
       e) It fades gradually; no single step breaks it.

  Scoring Key:

  Match your answers to the following patterns. If you match more than one, it's okay; these accounts overlap.

  1. Hidden-Nature (Essentialism): 
     - Q1: a, b, or c (sharp break)
     - Q2: d (or sometimes c if they are less strict on ingredients)
     - Q3: b
     - Q4: b or d (only if d means that location is not part of the essence, but then they must be consistent in other answers)
     - Q5: c
     - Q6: c
     - Q7: b
     - Q8: b or d
     - Q9: a, b, or c

  2. Meaning-Shifted: 
     - Q2: b or c
     - Q3: c
     - Q8: a or c
     - Other questions: no specific pattern required, but they are likely to allow flexibility.

  3. Cluster or Similarity-to-Paradigm: 
     - Q1: e
     - Q5: b or d
     - Q6: b or d
     - Q9: e
     - They often see factors as interacting and boundaries as fuzzy.

  4. Copycat/Valence-Transfer: 
     - Q2: a
     - Q4: a or c (if c, because of the home-like feeling)
     - Q6: a
     - They extend the term when the positive associations (care, authenticity) are present.

  5. Fluid Concept: 
     - Q1: e
     - Q4: a (same process even in different location)
     - Q6: a (assembled at home)
     - Q7: a (machine as a tool)
     - They rely on analogy to the paradigm.

  6. Practitioner's Call: 
     - Q3: a or c
     - Q8: a or c (restaurant's use is valid in their context)
     - They defer to the community using the term.

  7. Engineering Story: 
     - Q3: d
     - Q7: d
     - They often want to clarify or fix the concept.

  Note: The accounts of Fluid Concept and Cluster may be hard to distinguish, as may Copycat and Fluid Concept.

  Also, the following answer combinations are not typically held by any account:
     Combination X: 
          Q1: a (break between 1 and 2) 
          Q5: a (casserole with canned soup is homemade) 
          Q9: a (break between 1 and 2 for jam) 
       Why? Inconsistent because Q1a says using a mix (which is like the jam using store-bought fruit) is not homemade, but Q5a says using canned soup (a pre-made component) is homemade. This is not coherent.

     Combination Y:
          Q2: d (restaurant pie is not homemade)
          Q8: a (restaurant pasta is homemade)
          Without a clear distinguishing factor (like the pie uses canned filling and the pasta is from scratch), this pattern is merely unattractive because it doesn't provide a consistent principle. It might be unexplored.

  We'll hand out the quiz and the scoring key.

  Note: We avoided the forbidden words.
answer: |-
  Below is a handout designed as an instrument to reveal implicit commitments about conceptual slippage in the microdomain of "homemade." It includes 9 concrete cases (with stepwise variations) and forced-choice questions. The structure focuses on sequencing, valence transfer, and analogy without using prohibited terms. The scoring key maps answer patterns to philosophical accounts based on case responses, not self-labeling.  

  ---

  **PHILOSOPHY OF LANGUAGE SEMINAR: CONCEPTUAL SLIPPAGE IN "HOMEMADE"**  
  *Instructions: Answer all questions based on your immediate reactions. Choose one option per question. There are no right/wrong answers—we’re exploring how concepts stretch!*  

  1. **Stepwise Assembly (Cake):**  
     - Case A: You bake a cake from flour, sugar, and eggs you bought.  
     - Case B: You bake a cake from a box mix (add eggs/oil).  
     - Case C: You bake a store-bought premixed dough.  
     - Case D: You add frosting to a store-bought cake.  
     *Where does "homemade" break?*  
     (a) Between A and B  
     (b) Between B and C  
     (c) Between C and D  
     (d) D still counts  
     (e) It fades; no single break point.  

  2. **Valence Check (Restaurant Pie):**  
     A restaurant sells "homemade" pie. The crust is store-bought; the filling (from canned fruit) is cooked on-site. Why call this "homemade"?  
     (a) The chef’s care in assembly makes it *feel* authentic.  
     (b) "Homemade" here just means "made here," not literally at home.  
     (c) It’s like home cooks using shortcuts (e.g., box mixes).  
     (d) It shouldn’t be called homemade—it’s misleading.  

  3. **Community Practice (Cookies):**  
     Family A uses store-bought dough but decorates together, calling it "homemade." Family B insists only from-scratch counts. What’s right?  
     (a) Family A decides what their work means.  
     (b) Family B is correct—there’s a real standard.  
     (c) Neither is wrong; the word works differently per group.  
     (d) We should redefine it to avoid confusion.  

  4. **Location Shift (Meal Kit):**  
     Your friend cooks a meal kit at home (calls it "homemade"). They later cook the *same kit* in a workplace kitchen. Is it still homemade?  
     (a) Yes—same process, just location changed.  
     (b) No—"home" requires a home setting.  
     (c) Only if the workplace feels homey.  
     (d) Location doesn’t matter; method does.  

  5. **Ingredient Swap (Casserole):**  
     Your family casserole usually uses fresh ingredients. You swap one component for canned soup. Is it still homemade?  
     (a) Yes—you assembled/cooked it at home.  
     (b) Yes—the swap doesn’t change its core character.  
     (c) No—the canned part breaks it.  
     (d) Only if the swap is minor.  

  6. **Takeout Fusion (Dish Assembly):**  
     You mix takeout rice, takeout veggies, and your own sauce at home. Call this homemade?  
     (a) Yes—your touch at home makes it yours.  
     (b) Only the sauce is homemade.  
     (c) No—core parts came from elsewhere.  
     (d) It’s "home-assembled," not homemade.  

  7. **Machine Role (Bread Maker):**  
     You add flour/water to a machine; it makes bread unaided. Is this homemade?  
     (a) Yes—you chose ingredients; the machine is a tool.  
     (b) No—the machine did the work.  
     (c) It’s "home-cooked," not handmade.  
     (d) We need a new term (e.g., "machine-assisted").  

  8. **Restaurant Meaning (Pasta):**  
     A restaurant makes pasta on-site from flour/eggs, calling it "homemade." Appropriate?  
     (a) Yes—"homemade" here means "made here."  
     (b) No—"home" means a household, not a business.  
     (c) Yes, if they mean "from scratch."  
     (d) It’s confusing—people expect household origins.  

  9. **Stepwise Ingredients (Jam):**  
     - Case 1: Jam from fruit you grew.  
     - Case 2: Jam from store-bought fruit.  
     - Case 3: Jam from canned puree + sugar.  
     - Case 4: Store-bought jam reheated at home.  
     *Where does "homemade" break?*  
     (a) Between 1 and 2  
     (b) Between 2 and 3  
     (c) Between 3 and 4  
     (d) Case 4 still counts  
     (e) It fades; no single break point.  

  ---

  **SCORING KEY: WHAT YOUR ANSWERS REVEAL**  
  *Match your answer pattern to the accounts below. Overlaps occur; some accounts share responses. Accounts are defined by how they explain slippage, not by names.*  

  1. **Hidden-Nature-Gradually-Revealed**  
     - Stepwise breaks are sharp (Q1, Q9: a/b/c).  
     - Rejects valence-driven extensions (Q2: d).  
     - Prioritizes fixed standards (Q3: b; Q5: c; Q6: c; Q7: b; Q8: b/d).  
     - *Core idea: Slippage reveals imperfect initial grasp of a stable core.*  

  2. **Meaning-Shifted (Merely Verbal)**  
     - Emphasizes context (Q2: b/c; Q8: a/c).  
     - Accepts community variation (Q3: c).  
     - Stepwise may fade or shift (Q1/Q9: any *except* rigid a/b/c).  
     - *Core idea: Disputes arise from term adaptation, not deeper facts.*  

  3. **Cluster/Similarity-to-Paradigm**  
     - Stepwise fades gradually (Q1/Q9: e).  
     - Depends on multiple factors (Q5: d; Q6: b/d).  
     - Flexible location (Q4: a/d).  
     - *Core idea: Slippage reflects weighted similarities to central cases.*  

  4. **Copycat/Valence-Transfer**  
     - Valence dominates (Q2: a; Q4: a/c; Q6: a).  
     - Permissive stepwise (Q1/Q9: d/e).  
     - Machine as tool (Q7: a).  
     - *Core idea: Slippage occurs when new cases "feel right" like the paradigm.*  

  5. **Fluid-Concept**  
     - Analogy over fixed rules (Q4: a; Q6: a; Q7: a).  
     - Stepwise fades (Q1/Q9: e).  
     - Rejects sharp breaks (Q5: a/b; Q8: c).  
     - *Core idea: Slippage is functional—concepts evolve via active comparison.*  

  6. **Practitioners’-Call**  
     - Community decides (Q3: a/c; Q8: a/c).  
     - Stepwise varies by group (Q1/Q9: any).  
     - Ambivalent on valence (Q2: b/c).  
     - *Core idea: Slippage reflects group authority, not definitions.*  

  7. **Engineering Story**  
     - Seeks clarity/reform (Q3: d; Q7: d; Q8: d).  
     - Stepwise may impose breaks (Q1/Q9: a/b/c) *or* fade (e) if messy.  
     - Skeptical of valence (Q2: d).  
     - *Core idea: Slippage is a problem we should fix with boundaries.*  

  ---

  **NOTES FOR THE INSTRUCTOR**  
  - **Indistinguishable Accounts**:  
    - **Fluid vs. Cluster**: Both often select Q1/Q9e and flexible responses (e.g., Q5b/d). Separating them requires probing *why* boundaries fade (analogy vs. similarity clustering), which the quiz doesn’t directly force.  
    - **Copycat vs. Fluid**: Both commonly choose Q6a (takeout fusion) and Q7a (machine). Valence (Copycat) and analogy (Fluid) are conflated in cases where "feel" and "comparison" align.  
  - **Unoccupied Answer Combinations**:  
    - **Combination 1**: Q1a *and* Q9d *and* Q5a. *Why?* Incoherent—requires sharp break for cakes (Q1a) but extreme permissiveness for jam (Q9d) and casseroles (Q5a) with no clear principle.  
    - **Combination 2**: Q2d *and* Q8a *and* Q3b. *Why?* Merely unattractive—rejects restaurant pie (Q2d) but accepts pasta (Q8a) while insisting on a fixed standard (Q3b), creating tension without justification.  
  - **Usage**: Hand out the quiz, then the key. Students self-score to see which account(s) their answers align with. Discuss patterns, overlaps, and unoccupied combinations to highlight conceptual tensions.  

