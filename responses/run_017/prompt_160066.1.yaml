answer: |-
  Below is a **review procedure** designed for your moderation team to evaluate proposed amendments. It's a step-by-step checklist that addresses your failure modes, respects your constraints (15 minutes per proposal, no legal/logic expertise required), and outputs clear justifications. The procedure is honest about what it can/cannot decide and flags where human judgment is needed.

  ---

  ### **Amendment Review Procedure**
  *Run these tests in order. Stop and output justification if any test fails or flags an issue. Use the current document version and a timer.*

  #### **Step 1: Basic Validity (Malformed Check)**
  - **Test**: Is the diff **unambiguous**?  
    - Must explicitly state:  
      - Which rule numbers are changed/added/deleted.  
      - The exact text being added/removed (no vague references like "update all references").  
      - No changes to rule numbers (e.g., renumbering Rule 17 to Rule 18).  
  - **Failure**: Reject as "malformed" if:  
    - Rule numbers are missing, changed, or invalid.  
    - Text changes are unclear (e.g., "delete restrictive clauses").  
  - **Why care?** Ensures traceability. Changing rule numbers breaks historical references; deletions without specificity cause ambiguity.  
  - **Output**: "Rejected: Diff is malformed. [Specify reason, e.g., 'Rule numbers not specified' or 'Text changes ambiguous']."

  #### **Step 2: Rule Identity & Scope (Repeal-and-Replace?)**
  - **Test**: For each changed rule, is it **amend-in-place** (minor tweaks) or **repeal-and-replace** (fundamental rewrite)?  
    - **Amend-in-place**: ≤50% of the rule's text changed AND the core purpose remains intact.  
    - **Repeal-and-replace**: >50% text changed OR purpose altered (e.g., redefining "active member" instead of adjusting thresholds).  
  - **Failure**: Reject as "malformed" if:  
    - A repeal-and-replace isn't split into two explicit actions: (1) delete old rule, (2) add new rule with a new number.  
  - **Why care?** Repeal-and-replace destroys the original rule's identity. If not handled explicitly, the document loses continuity (e.g., references to "Rule 17" point to a zombie). Git history helps, but the community can't "revert" cleanly.  
  - **Human judgment needed**: Moderators assess purpose change (e.g., "Does this turn a voting rule into a conduct rule?").  
  - **Output**: If reject: "Rejected: Fundamental changes to Rule [X] require explicit repeal-and-replace (delete old, add new)." Else, note: "Rule [X] amended in-place; identity preserved."

  #### **Step 3: Precedence & Priority Conflicts**
  - **Test**: Does the proposal add/change a **precedence clause** (e.g., "this overrides later rules" or "most recent wins")?  
    - If yes, does it conflict with existing precedence clauses?  
      - Check for keywords: "override," "supersede," "permanent," "precedence," "latest wins."  
  - **Failure**: Not rejected, but flagged for human judgment.  
  - **Why care?** Conflicts (e.g., older vs. newer precedence) create unresolvable loops. The procedure can detect conflicts but not resolve them.  
  - **Human judgment needed**: Moderators cannot predict outcomes. They must warn that conflicts may paralyze governance.  
  - **Output**: "Warning: Precedence conflict. Rule [X] claims priority over [earlier/later] rules, but Rule [Y] says [opposite]. This may cause unresolvable ambiguity."

  #### **Step 4: Entrenchment Binding Check**
  - **Test**: Does the proposal amend/delete a rule with an **entrenchment clause** (e.g., "amendable only by 4/5")?  
    - If yes, does the proposal itself meet that clause's requirement?  
      - Ignore entrenchment clauses that are being deleted (deletion must meet their standard).  
  - **Failure**: Not rejected, but flagged for human judgment.  
  - **Why care?** Entrenchment is binding *only if* the procedure respects it during enactment. Else, it’s theater (e.g., a 2/3 vote deleting a "4/5-only" rule).  
  - **Human judgment needed**: Your policy choice:  
    - If entrenchment is sacred, proposals must meet the clause’s threshold *during their vote*.  
    - If not, entrenchment is just text.  
    *Your current reality: Entrenchment is likely ignored unless enforced here.*  
  - **Output**: "Warning: Entrenchment clause in Rule [X] requires [threshold], but this proposal uses [current threshold]. The vote may be invalid if entrenchment is binding."

  #### **Step 5: Self-Modifying/Self-Consuming Rules**
  - **Test**: Does the proposal add/change a rule to:  
    - Automatically delete/rewrite itself (e.g., "expires in 30 days")?  
    - Automatically delete/rewrite *other* rules (e.g., "repeal unchanged rules after 2 years")?  
  - **Failure**: Not rejected, but flagged for human judgment.  
  - **Why care?** Self-deletion risks bypassing amendment procedures (e.g., a spam rule deleting itself avoids community input). Automatic repeal of other rules may violate entrenchment.  
  - **Human judgment needed**: Moderators assess if automation usurps community agency.  
  - **Output**: "Warning: Rule [X] automatically [deletes/modifies] itself/others. This may bypass voting requirements or cause uncontrolled chain reactions."

  #### **Step 6: Definitional Feedback (Bootstrapping)**
  - **Test**: Does the proposal change a **core definition** (e.g., "active member," "quorum," "valid rule")?  
    - If yes, does it apply this change **retroactively to its own vote**?  
  - **Failure**: Reject as "malformed" if it self-applies.  
  - **Why care?** Self-application (e.g., counting lurkers in its own quorum) is circular logic. The vote’s rules must be fixed at proposal submission.  
  - **Output**: If rejected: "Rejected: Changes to [definition] cannot apply to this proposal's vote. Submit as separate proposals: (1) Definition change (applies after enactment), (2) Vote rule adjustments." Else, note: "Definition change applies to future votes only."

  #### **Step 7: Irreversibility Check**
  - **Test**: Does the proposal **delete, merge, or redefine** rules in a way that:  
    - Removes access to prior normative states (e.g., deletes a rule *and* changes the amendment rule to block re-adding)?  
    - Destroys unique identifiers (e.g., merges Rules 17/18 into "Rule 17-18," preventing individual reversion)?  
  - **Failure**: Not rejected, but flagged for human judgment.  
  - **Why care?** Even with Git, the community can’t *functionally* return to a prior state if the amendment rule or key definitions are altered.  
  - **Human judgment needed**: Moderators assess if power is being permanently centralized.  
  - **Output**: "Warning: This change may be irreversible. [Specify, e.g., 'Deleting Rule X while amending the amendment rule blocks restoration']."

  ---

  ### **What the Procedure Cannot Settle**
  - **Meta-ambiguity**: Conflicts between rules about rule-changing (e.g., "Was the unanimity amendment valid?"). This is a **power struggle**, not a drafting issue.  
  - **Procedural voids**: If the amendment rule is deleted or invalidated, no test can fill the gap.  
  - **Subjective values**: e.g., "Is this change fair?" or "Does this benefit the project?"  
  - **External factors**: e.g., Whether a rule will cause practical harm (beyond governance paralysis).  

  ---

  ### **Test on Your Proposals**
  *Using the procedure above:*

  #### **Proposal A: Redefine "active member" to include lurkers, applied to its own vote.**
  - **Step 1**: Valid diff (rule number specified, text clear).  
  - **Step 2**: Amend-in-place (identity preserved).  
  - **Step 3**: No precedence clauses.  
  - **Step 4**: No entrenchment.  
  - **Step 5**: Not self-modifying.  
  - **Step 6**: **Reject as malformed**. Self-application ("count lurkers in this vote") is circular.  
  - **Rewrite**: Split into two proposals:  
    1. *Change definition only*: "Active members include forum readers in the last 90 days. Applies after enactment."  
    2. *Adjust quorum rules*: "Include active members (per new definition) in future quorums."  
  - **Output**: "Rejected: Definition changes cannot apply to their own vote. Split into (1) definition update (future-only), (2) quorum adjustment."

  #### **Proposal B: Contributors' rights section amendable only by 4/5, no change to amendment rule.**
  - **Step 1**: Valid diff (new rule added).  
  - **Step 2**: New rule (no identity issue).  
  - **Step 3**: No precedence clauses.  
  - **Step 4**: **Flagged for human judgment**. The new entrenchment clause (4/5) is stricter than the current amendment rule (2/3). If entrenchment is binding, future amendments to this section require 4/5, but the voting system uses 2/3 → invites challenges. *Your assumption is wrong: This does nothing without explicit enforcement.*  
  - **Step 5**: Not self-modifying.  
  - **Step 6**: No definition changes.  
  - **Step 7**: Reversible (can be deleted by 2/3 if entrenchment is ignored).  
  - **Output**: "Accept with warning: Entrenchment clause requires 4/5 for future amendments, but voting system uses 2/3. This will cause disputes unless the amendment rule is updated to enforce entrenchment."

  #### **Proposal C: Spam emergency rule (self-deletes in 30 days) + Housekeeping rule (repeals unchanged rules after 2 years).**
  - **Step 1**: Valid diff.  
  - **Step 2**: New rules (no identity issue).  
  - **Step 3**: No precedence clauses.  
  - **Step 4**: No entrenchment targeted.  
  - **Step 5**: **Flagged for human judgment**.  
    - Spam rule: Self-deletion may bypass future community input.  
    - Housekeeping rule: Automatically repeals *other* rules (including entrenched ones) without a vote → violates entrenchment. It will eventually repeal itself, but could delete the amendment rule first.  
  - **Step 6**: No definition changes.  
  - **Step 7**: **Flagged for human judgment**. Housekeeping rule may make restoration impossible (e.g., if amendment rule is deleted before community reacts).  
  - **Output**: "Accept with severe warnings:  
    - Spam rule: Self-deletion may bypass amendment procedures.  
    - Housekeeping rule: Automatically repeals rules without votes, violating entrenchment and risking irreversible loss (e.g., amendment rule). This concentrates power in automation, not the community."  
  - **Honest truth**: This is a **power decision**, not drafting. The housekeeping rule transfers authority from votes to an automated process. Reject it if you value community control.

  ---

  ### **Final Notes**  
  - **Where this works**: Catches malformed drafts, self-application, and obvious conflicts in <15 minutes. Forces transparency.  
  - **Where it doesn't**: Precedence/entrenchment disputes and power struggles require community dialogue, not just moderation.  
  - **Recommendation**: Add a meta-rule: "All amendments must pass this review before voting." This gives moderators clear authority.  
  - **When in doubt**: Output: "This requires a community values call: [Explain conflict]."
