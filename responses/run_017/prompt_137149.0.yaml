prompt: |-
  I run a 40-minute session during internatinal orientation week for incoming exchange students in the UK — mostly non-philosophers, mixed nationalities, jetlagged, and half of them still weirded out by the queueing. I want to use tipping, queueing and jaywalking to get at two questions: whether everyday conventions are ever real moral obligations rather than just things people get huffy about, and whether a short-term visitor has to follow the local version of a convention they didn't grow up with.

  The bit I actually want them to get — and please stress-test it rather than just restate it — is something I've been calling the legibility test: whether a convention morally binds a visitor depends less on how arbitrary it is or how many people follow it, and more on whether the locals around them can tell the difference between someone who doesn't know the norm and someone who knows it and can't be bothered. If they can't tell, then not following it doesn't merely fail to coordinate, it reads as contempt, and that's where the obligation comes from; if it's obvious you're a visitor, a lot of that evaporates. I think it also explains why jaywalking at 3am on an empty street feels different from skipping a queue, and why the tip prompt on a card machine feels like a demand instead of a thank you.

  Don't write me the explanation, plan it. What order do the distinctions have to arrive in and what depends on what (I assume they have to feel the arbitrariness before they can feel the force, but I'm not sure). Which one example should carry the whole 40 minutes, and what does it need to have and lack — my instinct is a norm with no victim and no written rule, but you tell me. Which misconceptions will this crowd walk in with and form on the way — I'm expecting when in Rome, no-harm-no-foul about the empty street, it's their country so whatever they say goes, and tipping is just guilt — and at exactly which point in the sequence do I head each one off. One question at the end that would show they got the legibility thing rather than just the vocabulary. And what should I openly decline to get into at this level and say so out loud.
reasoning: |-
  Hmm, the user is running a 40-minute session for exchange students in the UK, focusing on everyday conventions like tipping, queueing, and jaywalking. They want to explore two core questions: whether these conventions are genuine moral obligations versus mere social irritants, and whether short-term visitors must follow local norms they didn't grow up with. Their key concept is the "legibility test" – the idea that moral obligation hinges on whether locals can distinguish ignorance from contempt when norms are broken. If the confusion exists, breaking the norm reads as disrespect; if the visitor status is obvious, the obligation weakens.

  I need to help them plan the session structure, not just explain the concept. They want the sequence of ideas, choice of primary example, handling of misconceptions, and assessment methods. They mentioned potential misconceptions like "when in Rome," "no harm no foul" for empty streets, "their country their rules," and "tipping as guilt." The audience is jetlagged, mixed-nationality non-philosophers, so simplicity and engagement are crucial.

  For structure, I should start with concrete examples to hook them, then introduce the arbitrariness to create tension, and finally present the legibility test as resolution. Queueing seems ideal as the primary example because it's highly visible in the UK, has no victim when violated in certain scenarios (like an empty line), and involves clear signals of intention versus ignorance. It can carry the whole session if layered properly.

  The sequence should be: 1) Elicit personal experiences with queueing to engage; 2) Contrast queue-skipping with jaywalking at 3am to highlight harm/arbitrariness spectrum; 3) Drill into queueing's "no victim" scenario to challenge "no harm no foul"; 4) Introduce tipping prompts to show how context changes perception (demand vs. thanks); 5) Present the legibility test explicitly; 6) Apply it back to all examples.

  To handle misconceptions: Preempt "when in Rome" during the tipping segment by distinguishing moral obligation from practicality. Address "no harm no foul" when analyzing the empty queue scenario. Counter "their country their rules" during the legibility summary by emphasizing discernment over blind compliance. Acknowledge "tipping as guilt" but frame it as misdiagnosed contempt-avoidance.

  For assessment, a closing question like "Why might ignoring a 'keep off the grass' sign in a busy park be worse for a local than a lost tourist?" would test grasp of legibility. I should explicitly avoid diving into moral relativism or enforcement mechanisms to stay focused.

  The 40 minutes needs tight pacing: 5 min for queueing intro, 5 for jaywalking contrast, 10 for deep queue analysis, 7 for tipping shift, 8 for legibility framework, and 5 for Q&A with the assessment question. Props like a "queue here" sign could make it tactile. The goal is to leave them seeing conventions as communication rather than control.
answer: |-
  Here’s a battle-tested 40-min session plan designed to build the "legibility test" concept step-by-step, using your examples strategically while preempting misconceptions. The core insight relies on **visibility of intent**, so the sequence forces confrontation with that.

  **Core Structure:**
  1.  **Hook with Pain (Queueing - 10 mins):** Start relatable, surface frustration.
  2.  **Contrast with Arbitrariness (Jaywalking - 7 mins):** Highlight the "no victim" scenario.
  3.  **Introduce Tension (Tipping - 8 mins):** Shift to ambiguity and perceived demand.
  4.  **Reveal the Mechanism (Legibility Test - 10 mins):** Formalize the concept using all examples.
  5.  **Apply & Consolidate (Synthesis & Question - 5 mins):** Test understanding.

  **Detailed Plan:**

  1.  **Hook: The Queue-Skipper's Sin (10 mins)**
      *   **Activity:** "Raise your hand if you've already witnessed or been annoyed by queueing weirdness in the UK?" (Get brief, funny anecdotes). Focus on the *feeling*: "What *exactly* makes you angry? Is it just delay, or something else?"
      *   **Key Qs:** "If someone skips the queue, what are we assuming about them? (They *know* the rule, they *don't care*). What if they genuinely didn't see the end? Does the anger vanish? Why?"
      *   **Plant Seed:** "So the anger seems tied to *why* we think they did it – ignorance or contempt?"
      *   ***Why Queueing First?*** Immediate, visceral, universally experienced. Establishes the *emotional core* of norm-violation (disrespect) before analyzing it. Preps for "no victim" later.

  2.  **Contrast: The Empty Street Jaywalker (7 mins)**
      *   **Shift:** "Okay, queueing feels serious. Now, imagine it's 3 AM, no cars, no pedestrians. You cross where there's no crossing. Harmless, right?"
      *   **Key Qs:** "Why *does* this feel different from queue-skipping? (No victim, no inconvenience). Is it *morally* wrong, or just technically illegal? What if a cop saw you? Would they care *why* you did it? (Likely no, just that it's against the rule)."
      *   **Highlight Arbitrariness:** "The rule might seem pointless here. Is following it just about avoiding a fine, or is there a deeper obligation?"
      *   ***Why Jaywalking Now?*** Introduces the "no harm" scenario explicitly. Shows a norm where *intent* matters less to *enforcement* but potentially less to *onlookers* too (if they even see you). Contrasts with queueing's social visibility.

  3.  **Introduce Ambiguity & Demand: The Tipping Prompt (8 mins)**
      *   **Shift:** "Let's talk tipping. You finish a coffee, the card machine flashes 'Add Tip? 15%, 20%, 25%'. What goes through your mind?"
      *   **Key Qs:** "Why does this feel different from leaving cash on the table? Does it feel like gratitude or an invoice? Who is 'demanding' it? (System, not necessarily the server)."
      *   **Focus on Perceived Intent:** "If you skip it, what might the server think? 'Tourist doesn't know' or 'Cheapskate'? How easy is it for *them* to tell? What if you look obviously lost/jetlagged vs. look like a local student?"
      *   ***Why Tipping Now?*** Introduces ambiguity in *interpreting* the violator's intent (harder to discern ignorance vs. cheapness). Highlights the *demand* aspect which feels different from an organic social norm. Directly challenges "no harm" (potential harm to server's income/feelings, but mediated by perception).

  4.  **The Reveal: The Legibility Test (10 mins)**
      *   **Synthesize:** "Let's connect these. Queue-skipping: Anger flares when we think they *know and don't care*. Jaywalking at 3 AM: Less anger, partly because it's hard to assume intent (were they lazy or just not thinking?), and no obvious victim. Tipping prompt: Anxiety about being *misread* as stingy."
      *   **Introduce the Term:** "This points to something I call the **Legibility Test**. The moral 'pull' of a convention on a visitor often hinges on this: **Can the people around you easily tell the difference between you breaking the rule because you *don't know it* versus you breaking it because you *know it and don't respect it*?**"
      *   **Apply the Test:**
          *   *Queueing:* Very hard to tell ignorance from contempt instantly. Skipping *looks like* contempt -> Strong moral obligation to follow to avoid communicating disrespect.
          *   *Jaywalking (3am):* If literally no one sees you, no one *can* misread intent -> Minimal moral obligation (maybe just legal). If someone *does* see you, can they tell why? Maybe slightly harder than queueing? Obligation weakens without an audience or obvious disrespect signal.
          *   *Tipping (Prompt):* Hard for the *server* to tell why you skipped the prompt -> Risk of being *read* as contemptuous even if you're ignorant -> Creates an obligation *to signal* (e.g., apologetic look, cash if possible) or just pay to avoid the misreading. The prompt *creates* the ambiguity!
      *   **Core Insight:** "The obligation arises not purely from the rule itself, or even the harm, but from the **social risk of being misread as showing contempt** when you might just be ignorant. If your 'visitor status' is super obvious (big camera, map, confused look), that *legibility* protects you – people read the violation as ignorance, not contempt. If you blend in, the obligation is stronger because your violation 'reads' as intentional disrespect."

  5.  **Consolidation & Assessment (5 mins)**
      *   **Re-State Core:** "So, it's not just 'When in Rome'. It's **'When in Rome, be legible as a visitor if you can't follow the rules, or follow the rules to avoid looking like you despise Romans'.** The moral bite comes from the potential miscommunication of contempt."
      *   **The Test Question:** "**Imagine two people ignore a 'Keep Off The Grass' sign in a busy London park. One is clearly a tourist group with maps and backpacks taking a shortcut to a landmark. The other is someone dressed like a local office worker taking a shortcut. Using the Legibility Test, why might the office worker's action feel *more* morally objectionable to onlookers, even though the *physical act* is identical?**"
          *   *Correct Answer Direction:* The tourist group's ignorance is legible (they look lost, it's plausible they didn't see/don't know). The office worker's intent is illegible – it's much harder for onlookers *not* to interpret it as knowing disregard ("they should know better, they're being lazy/disrespectful"), thus communicating contempt.
      *   **Openly Decline:** "We're NOT diving into deep philosophy today about *why* contempt is bad, or debating cultural relativism vs. universal morals. We're focusing on *this specific mechanism* of how social conventions create practical moral demands on visitors through the lens of perceived intent. Also, not debating *enforcement* (fines) – just the social/moral feeling."

  **Handling Misconceptions Head-On:**

  1.  **"When in Rome" (Blind Obedience):** Head off during **Tipping** discussion and **Legibility Reveal**. *Say:* "It's not *just* 'do as they do'. It's about *why* you might feel compelled. Is it fear? Respect? Or is it specifically about avoiding giving offense through miscommunication? The Legibility Test gives us a more precise reason *why* 'When in Rome' feels urgent for some norms (like queues) and less for others (like 3am jaywalking)."
  2.  **"No-Harm-No-Foul" (Empty Street):** Directly challenge during **Jaywalking** discussion. *Ask:* "Even if no one is harmed physically or inconvenienced, *could* an onlooker still feel disrespected if they saw you? Is *that* a kind of harm? Does the Legibility Test explain why the *absence* of an onlooker changes things?" Link back to Queueing: skipping an *empty* queue feels less bad because no one misreads your intent.
  3.  **"Their Country, Their Rules" (Authority):** Address during **Legibility Reveal**. *Say:* "Sure, respecting local authority matters. But the Legibility Test explains *why* we feel strong obligations around norms that aren't official 'rules' (like intricate queueing etiquette) and weak ones around minor illegalities (like jaywalking at 3am). The obligation often comes more from the *people around you* misreading your intent than from the state."
  4.  **"Tipping is Just Guilt" (Internal Feeling):** Reframe during **Tipping** and **Legibility** sections. *Say:* "That guilt might *stem* from the fear of being misread! It's not (just) about the money; it's anxiety that the server will think *you look down on them* or their job if you don't tip. The card prompt makes that potential misreading more immediate and harder to avoid."

  **Why Queueing as the Anchor?**
  It perfectly embodies the requirements: **highly visible violation, clear social consequence (disapproval/anger), no physical victim required, relies entirely on mutual understanding, visitor status can be ambiguous.** It provides the strongest intuitive base for the "contempt" feeling, making the legibility need stark. Jaywalking (empty) and Tipping then act as contrasts/complications, testing and refining the concept derived from queueing.

  **Key to Success:** Keep it **interactive** and **rooted in their likely experiences**. Constantly loop back: "Remember how we felt about the queue-skipper? How does this new idea (jaywalking/tipping/legibility) compare?" The jetlagged brains will latch onto concrete examples and emotional hooks. Good luck!
