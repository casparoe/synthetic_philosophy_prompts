prompt: |-
  I write a monthly column on science and ideas, and a device I lean on heavily is the counterfactual: what would have happened if the grant had gone to the other lab, if the observation had been missed that morning, if the launch had slipped a year. My copy desk has exactly one rule about these sentences — do not write as though someone who never existed could have had experiences — and it gets applied unevenly, so my drafts come back rewritten in ways that are sometimes better and sometimes, I think, worse. I would like a procedure I can actually run on a sentence before I file it: a short sequence of tests, in plain prose with no formalism, for deciding how to refer to an individual inside a scenario that did not happen. Assume five minutes, one page, a writer with no philosophy training, and copy editors who will not read anything longer. For each step give me what would count as a pass, what would count as a fail, and what the rewrite is when a sentence fails.

  The conceptual material I am working from is the contrast between transworld identity and counterpart theory, and I need the procedure to be faithful to the counterpart-theoretic side without dragging the metaphysics into the column. In particular I have been toying with a distinction I have not seen drawn cleanly and which I want the procedure to adjudicate: the counterpart of a person picked by causal origin (same parents, same gamete, same early history) versus the counterpart picked by narrative role (the person occupying the same slot in the story I am telling — the discoverer, the director, the dissenter). My suspicion is that journalists almost always want the narrative counterpart while the copy desk's rule implicitly demands the origin counterpart, and that these come apart exactly in the cases I care about. So: when does each one govern, and when they conflict, which wins, or is that genuinely undecidable? I also want the procedure to handle three things I keep getting wrong: cases where there is no unique closest counterpart, so that a name should be replaced by existential phrasing; cases where I chain counterfactuals and silently assume the counterpart relation is transitive and symmetric when it need not be; and the point that what counts as closest is fixed by the explanatory purpose of the sentence rather than by overall similarity, which I think is where most of my disputes with the desk really live.

  Please run the finished procedure on three cases. First, a discovery that in fact was made by one group and, on the standard historical judgment, would have been made by a different group within about five years — how should I write the sentence so that I do not imply the same people made it twice? Second, a biography piece where I want to write that a subject would have had a certain career even if her parents had never met, or that a historical catastrophe robbed the world of millions of children who would have grown up to do particular things: I expect the procedure to tell me something here that will spoil a paragraph I like, and I want to see the argument for spoiling it rather than a flat prohibition. Third, a counterfactual about an office rather than a person — if the committee had chosen differently, the agency would have acted otherwise — where the individual and the role pull in different directions. Finally, tell me honestly what the procedure cannot do: which sentences it has to hand back to me as an editorial judgment, where it will misfire on deadline, and where the metaphysics simply does not settle the question of how a sentence will land with a reader.
reasoning: |-
  Okay, the user writes a science column and uses counterfactuals frequently. Their copy desk has a rule against implying that non-existent people could have experiences, but it's applied inconsistently. They want a quick, practical procedure to test sentences before filing. The user is familiar with counterpart theory vs. transworld identity but wants to avoid philosophical jargon. They specifically need to handle cases where causal origin and narrative role counterparts conflict, and address three common mistakes: non-unique counterparts, chaining counterfactuals, and explanatory purpose determining closeness.

  The user's deeper needs include resolving disputes with copy editors by having a clear rationale for rewriting sentences, preserving narrative flow while maintaining philosophical accuracy, and understanding when to prioritize narrative role over causal origin. They also want to avoid implying that the same individuals exist across counterfactual scenarios, especially in scientific discoveries and biographical speculations.

  I'll create a procedure with five tests. Test 1 will check for implied impossible existence, like references to sperm or embryos in counterfactuals. Test 2 will identify causal origin errors using "same parents" phrases. Test 3 will prevent role-based naming without explicit counterparts. Test 4 will handle chained counterfactuals by requiring independent grounding. Test 5 will mandate clarifying explanatory purpose when similarity is ambiguous. 

  For the discovery case, the procedure will replace names with "someone" to avoid implying identity. For the biography, it will prohibit claims about specific individuals from non-existent lineages, suggesting existential statements instead. For the office example, it will recommend role-based references over personal names. The limitations will include unresolved role/origin conflicts, non-unique counterparts requiring judgment, and cases where explanatory purpose isn't self-evident.

  The user might be frustrated when favorite passages get rewritten, but the procedure's strength is in showing why certain phrasings misrepresent metaphysical possibilities. The trade-off is precision over elegance in sensitive cases. The most valuable aspect is making implicit editorial standards explicit and actionable within tight deadlines.
answer: |-
  Here's a 5-step procedure designed for speed, clarity, and counterpart-theoretic faithfulness, focusing on narrative role and purpose. Keep it on your desk:

  **The Counterfactual Character Check (C3 Procedure)**

  1.  **Test 1: The Impossible Existence Filter**
      *   **Action:** Scan for any phrase implying a *specific, actual person* (named or described uniquely by origin: "Marie Curie," "the son of X and Y," "the embryo fertilized on date Z") *experiences something* (thought, acted, felt, discovered, died, was born) *in the counterfactual scenario*.
      *   **Pass:** No such phrase exists. *OR* The person is referred to generically ("a researcher," "someone") or by role ("the lab director," "the lead investigator").
      *   **Fail:** Phrase implies a specific actual person exists/acts in the counterfactual world (e.g., "If the grant had gone to Lab B, *Marie Curie* would have...").
      *   **Rewrite:** Replace the specific name/origin descriptor with a **role description** ("the lead researcher at Lab B," "whoever secured that grant") or an **existential** ("someone at Lab B would have...").

  2.  **Test 2: The Origin Trap**
      *   **Action:** Look for phrases defining a person *solely* by causal origin *within* the counterfactual scenario ("if her parents had never met, *the child they would have had*..." or "if the launch slipped, *the technician who would have been on duty*...").
      *   **Pass:** The person is defined by their *role or actions* in the counterfactual narrative ("the discoverer," "the person holding that position," "whoever made the observation").
      *   **Fail:** The person is defined primarily by their origin lineage ("the child of X and Y," "the person conceived from gamete Z," "the individual who *would have been born* on date D").
      *   **Rewrite:** Shift focus to the **narrative role** ("the leading expert in the field then," "the agency director at that time," "a child born into those circumstances") or use **existential/general terms** ("millions of potential lives," "a different technician," "future generations"). Avoid defining *who* the person *is* by origin; define *what role* they play.

  3.  **Test 3: The Role Ambiguity Check**
      *   **Action:** Ask: "Is the *specific name or unique origin* essential to the point I'm making about the *outcome*?" If using a role ("the discoverer," "the director"), ask: "Could multiple different individuals plausibly have filled this role in the counterfactual world?"
      *   **Pass (Use Name/Role):** The point critically depends on *that specific individual's* unique traits being present *in the counterpart fulfilling the role* (rare! Usually only for traits *intrinsic* to the role itself, or explicitly stated as fixed). *OR* The role implies a unique position ("the President on that date").
      *   **Pass (Use Existential):** The point is about the *action* or *outcome*, not the *specific identity* of the actor ("a discovery would have been made," "the agency would have acted differently").
      *   **Fail:** Using a specific name/origin when the point doesn't require *their* unique essence, only the role's function. *OR* Using a definite role ("the discoverer") when multiple counterparts could have filled it.
      *   **Rewrite:** **Always default to existential/general/role-based phrasing** unless Test 3 explicitly passes for using a name/specific origin. Replace names with roles ("the director," not "Dr. Smith"). Replace definite roles with indefinite/existential phrasing if uniqueness isn't guaranteed ("*a* researcher would likely have discovered..." or "whoever was director would have..." instead of "*the* discoverer...").

  4.  **Test 4: The Chaining Hazard**
      *   **Action:** If the sentence chains counterfactuals ("If A hadn't happened, then B wouldn't have, and then *C* would have..."), focus on the *final* counterpart reference. Apply Tests 1-3 ruthlessly to *that final reference*.
      *   **Pass:** The final reference to a person/role passes Tests 1-3 independently. The chain doesn't assume the *same* counterpart travels through all steps.
      *   **Fail:** The final reference implies the specific person from the *initial* scenario persists through the chain into the final, vastly different scenario.
      *   **Rewrite:** Ground the final counterpart **in the immediate counterfactual scenario defined by the step before it**. Explicitly state the role *as defined in that step's world* ("...then, in *that* scenario, the committee chair would have...").

  5.  **Test 5: The Purpose Clarifier**
      *   **Action:** Ask: "What aspect of similarity matters *for this specific sentence's point*?" Is it the person's *skills*? Their *institutional position*? The *social role* they occupy? The *biological lineage* (only if absolutely essential and passing Test 2)?
      *   **Pass:** The phrasing aligns with the *relevant aspect of similarity* for the explanation (e.g., "the head of R&D" if the point is about institutional power; "a brilliant theorist" if the point is about intellectual capability).
      *   **Fail:** The phrasing suggests overall identity or relies on an aspect of similarity (like origin) that is irrelevant or contradicted by the counterfactual setup for the point being made.
      *   **Rewrite:** Explicitly **state the relevant similarity basis** if ambiguity could mislead: "Given the need for rapid decision-making, *whoever held the directorship* would have canceled the launch," or "Focusing on scientific creativity, *a researcher with similar insight* might have made the connection."

  **Adjudicating Origin vs. Narrative Role:**
  *   **Narrative Role Governs:** Almost always. Your explanatory purpose defines which aspects of similarity matter. If you're talking about "the discoverer," you care about whoever fills that discovery role in the counterfactual world, not their parents. **This usually wins.**
  *   **Origin Governs (Rarely):** Only if your *explicit, essential point* is about biological lineage *itself* being the causal factor *in that scenario* (e.g., a genetic disease counterfactual - "If the parents had carried different genes, *their child* would not have had the disease" - though even here, "a child born to them" might be safer). Avoid this unless absolutely unavoidable and central to the science/idea.
  *   **Conflict Resolution:** When they conflict (e.g., you imply "Marie Curie" by role in a world where her origin is impossible), **Narrative Role Wins**. Rewrite using role/existential phrasing (Test 1/3 Rewrite). The copy desk rule targets Origin-based errors (Test 1/2 Fails). Your disputes likely arise when you intend Role but use phrasing implying Origin identity.

  **Applying the Procedure to Your Cases:**

  1.  **The Discovery:**
      *   *Original (Problematic):* "If Lab A had missed the signal, Lab B would have made the discovery *within five years, probably with the same team.*"
      *   **Test 1 (Fail):** "the same team" implies specific individuals exist/act in both worlds.
      *   **Test 3 (Fail):** Using "the same team" isn't essential; the point is *that* the discovery happens, not *who* makes it twice.
      *   **Rewrite:** "If Lab A had missed the signal, *a team at Lab B* would likely have made the discovery within five years." OR "The discovery would likely have been made elsewhere, perhaps at Lab B, within five years."

  2.  **The Biography (Would-have-been Children):**
      *   *Original (Problematic):* "Millions of children *who would have been born* were lost to the catastrophe, *including future scientists and artists who would have changed the world.*"
      *   **Test 2 (Fail):** "children who would have been born" defines them solely by origin in the counterfactual. "future scientists and artists who would have" implies specific identifiable future individuals.
      *   **Test 3 (Fail):** The point is about lost *potential*, not specific lost individuals defined by lineage. Multiple people could have filled those roles.
      *   **Test 5 Pass:** The relevant similarity is *potential contribution*, not specific identity/origin.
      *   **Rewrite:** "The catastrophe robbed the world of millions of potential lives and an incalculable amount of human potential. *Among those lost futures were almost certainly individuals who would have made groundbreaking scientific discoveries and created profound art.*" (Focuses on potential contributions existentially, avoids defining individuals by origin).

  3.  **The Office/Role Conflict:**
      *   *Original (Problematic):* "If the committee had chosen Dr. Lee instead of Dr. Aris, *she* would have redirected the agency's funding."
      *   **Test 1 (Fail/Pass?):** "she" grammatically refers to Dr. Lee, implying the *actual* Dr. Lee exists/acts in the counterfactual world. Did she *exist* in that world? Maybe, but did she get the job? Unclear.
      *   **Test 3 (Crucial):** The point is about the *decision of the committee chair*, not Dr. Lee's specific identity. Multiple people could have been chosen. The relevant similarity is *holding the position and having different views*.
      *   **Rewrite:** "If the committee had chosen *a different director*, like Dr. Lee, *the agency* would have redirected its funding." OR "Had Dr. Lee *been chosen as director*, the agency would have redirected its funding." (The second version *might* pass Test 1 if Dr. Lee plausibly exists in that world and the focus is on her *being director*; Test 3 Pass - her specific views are the point).

  **What the C3 Procedure Cannot Do (Be Honest):**

  1.  **Resolve Role/Origin Conflicts Where Role Isn't Clear:** If your explanatory purpose genuinely requires fixing *both* origin *and* a complex role (e.g., "What if *Lincoln specifically* had been President during the Cuban Missile Crisis?"), the procedure will flag it (Test 1/2 likely Fail). Rewriting will feel clumsy ("Someone possessing Lincoln's specific temperament and historical perspective, had they been president in 1962..."). This requires editorial judgment: is the specific origin *truly* essential? Usually, it's not.
  2.  **Perfectly Capture Reader Intuition:** Metaphysics doesn't dictate how language lands. A carefully rewritten existential ("someone") might still make a reader picture a specific *type* of person, or feel vague. The procedure minimizes error but can't eliminate the inherent fuzziness of counterfactuals.
  3.  **Handle Genuine Ambiguity in "Closest" Counterpart:** If two very different individuals could equally plausibly fill a role crucial to your sentence, the procedure (Test 3) forces you to use existential phrasing. It won't tell you *which* one to pick; it tells you *not* to imply only one specific one exists in that role.
  4.  **Fix Poorly Defined Counterfactual Scenarios:** If the counterfactual setup is vague ("If things were different..."), no procedure can save the reference. The scenario must be sufficiently defined to ground the relevant role.
  5.  **On Deadline Misfires:** If you're rushing, **Test 1 (Impossible Existence)** is the most critical and fastest. Scan for names/origin descriptors + verbs of experience/action in the counterfactual clause. If found, replace with a role/existential. This catches ~80% of copy desk objections. **Test 3 (Role Ambiguity)** is the next priority – default to existential/role phrasing over names/specifics.
  6.  **Philosophical Undecidability:** It genuinely doesn't settle whether, metaphysically, "the same person" could exist in two worlds. It *assumes* counterpart theory and provides rules for clear communication under that model. The copy desk rule implicitly assumes transworld identity is impossible, which C3 operationalizes. The "which wins" (role vs. origin) is settled by the procedure's focus on narrative purpose, not metaphysics.

  **The Core Principle:** You are telling a story about *what happened* in an alternative scenario. Refer to the *characters* in *that* story by the *roles they play* in it, not by importing specific individuals from our world unless their specific existence is logically compatible and essential to the point. When in doubt, use "someone," "a person," "the director," "whoever was in charge," or describe the required trait ("a cautious administrator"). This keeps your counterfactuals sharp and philosophically defensible.
