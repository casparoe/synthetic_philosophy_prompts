prompt: |-
  I am trying to work out, by trusting my gut on a series of concrete cases and then asking what principle the pattern answers to, when my individual act counts as contributing to a collective harm in the way that matters morally — that is, when the fact that my act makes no real difference to the outcome defeats the reason against it, and when it does not.

  My tentative principle is expected-difference-making: the reason against my performing an act, when I have one, is a function of the difference that my performing it makes in expectation to the total harm, so that where the expected difference is zero the no-difference objection succeeds outright, and where it is very small my reason is correspondingly very small. I set out below the cases that make me doubt it. In each I am one contributor among many to a harm that is produced by the aggregation of contributions like mine.

  The continuous case. I drive sixty miles alone to visit a friend instead of taking the train. My trip adds a few kilograms of carbon dioxide to the atmosphere; the effect on any person is real but lost in the noise. My verdict: I have a genuine reason to take the train, but a weak one, and I would not reproach myself for driving.

  The fixed-contract case. A supermarket sells me a chicken breast. It happens to buy poultry under a twelve-month take-or-pay contract that fixes the number of birds it must accept and pay for, so that nothing I do at the till can alter that quantity, even probabilistically, during the life of the contract. Suppose I know this for certain. My verdict: I still have a reason not to buy it, and not a merely sentimental one. Expected-difference-making says I have none at all.

  The necessary-contribution case. Ten neighbours must sign a petition for the council to approve a development that will destroy a wetland; nine have signed and the tenth signature is the only one outstanding. My verdict: signing is clearly wrong, and clearly more wrong than anything in the first two cases. I include this only as a control.

  The threshold I am unlikely to reach. The same petition, but it needs ten thousand signatures and nine thousand nine hundred and ninety-eight are already in. From what I know of the neighbourhood I would put the chance that two more people sign before the deadline at well over ninety per cent. My verdict: a strong reason not to sign, much stronger than a few per cent of the harm to the wetland, and much stronger than any expected-value calculation I can construct seems able to deliver.

  The trigger with an override. The supplier reorders in lots of ten thousand birds whenever the counter passes a multiple of ten thousand, and the store's app shows me that the counter stands at nine thousand nine hundred and ninety-nine. If I buy, ten thousand more birds are raised and slaughtered. If I do not buy, the customer behind me buys the same breast tomorrow and the same ten thousand birds are raised and slaughtered a few days later; I am as confident of this as I am of anything about the future. So the only thing my purchase changes is the timing. My verdict: I still should not buy it, and this moves me more strongly than the fixed-contract case does, even though in neither case do I change how many birds die. I cannot see why, and I would like the principle either to explain the asymmetry or to tell me to drop one of the two verdicts.

  The good that will happen anyway. A neighbour's surgery is being funded online; the goal is fifty thousand dollars, the total stands at forty-nine thousand nine hundred and eighty, and I happen to know that a local church has pledged in writing to cover whatever shortfall remains at midnight. My verdict: my twenty dollars is pointless, and I would feel faintly ridiculous giving it, as though I were pretending to matter. This is the mirror image of the contract and trigger cases: the outcome is fixed either way and my contribution is causally inert. Yet here the inertia seems to dissolve the reason, while there it does not. I want to know whether that asymmetry can be defended or whether one half of it has to go.

  The attributed share. My country's annual emissions are enormous and cause serious harm; I am one of some eight million residents and my own footprint is about average. My verdict: I bear responsibility for my own tonnes and not for an eight-millionth share of the national total, even though it is the national total that does the harm and even though allocating shares would be far easier to administer. I am not confident this verdict is coherent.

  The recorded and the unrecorded purchase. The same chicken breast again, except that the store's loyalty scheme feeds my purchase into a demand-forecasting model with a two-week lag, so that buying does slightly raise expected future orders, while paying cash leaves no trace and changes nothing downstream. My verdict: I feel exactly the same about the two. If that is right it seems awkward for expected-difference-making, which must distinguish them, but even more awkward for any view that grounds my reason in what my act expresses or signals, which distinguishes them more sharply still.

  What I would like from you is a principle, or a small set of candidate principles, meeting four conditions. First, state it precisely enough that I could apply it to a case you have not seen. Second, motivate each clause by the case that forces it on me, so that I can see what the principle would lose if the clause were dropped. Third, give me its verdicts on three cases I have not listed: the case in which I sell my car to a buyer who will drive it exactly as much as I would have; the case of a co-operative of two hundred members voting on whether to switch to a supplier whose practices are harmful, where the motion carries on a hundred and one votes, where I expect about a hundred and fifteen members to vote yes, and where my own yes is mildly in my financial interest; and the realistic version of the chicken case, in which I cannot discover whether the supply chain works like the fixed contract, like the trigger, like the forecasting model, or continuously, and could not find out even with effort. Say whether the principle gives me the same guidance under that ignorance as it would if I knew the mechanism, and whether it should. Fourth, tell me honestly which of my verdicts the principle cannot accommodate and would require me to abandon.

  If no single principle satisfies all four conditions, give me the two or three best candidates, say which verdict each sacrifices, and tell me which sacrifice you take to be cheapest and why. My preference throughout is for a principle I could actually apply while standing in an aisle deciding what to buy, over one that is elegant but tells me to go and find out how the supplier's ordering system works.
reasoning: |-
  Hmm, the user is grappling with a complex moral philosophy problem about when individual actions contribute to collective harm in a morally significant way. They've developed a tentative principle based on expected difference-making but have encountered several thought experiments that challenge it. I need to carefully analyze each of their cases and develop principles that address their concerns.

  Looking at their cases: The continuous case (driving vs train) suggests small expected differences create weak reasons. The fixed-contract chicken case challenges expected difference-making since no actual difference occurs, yet they feel a moral reason remains. The necessary-contribution case serves as a control where individual impact is clear. The unlikely threshold case (petition almost full) shows they feel stronger reasons than expected value calculations suggest. The trigger-with-override chicken case creates an asymmetry they can't explain. The good-that-will-happen-anyway donation case is the mirror image where inertia dissolves the reason. The attributed share case questions whether responsibility is individual or fractional. The recorded vs unrecorded purchase case suggests expression-based theories also fail.

  Their four requirements are strict: precise principles applicable to new cases, motivated by specific examples, tested on three new scenarios (car sale, co-op vote, realistic chicken purchase), and honest about which verdicts must be abandoned. They prioritize practical applicability over theoretical elegance.

  I'm considering several candidate principles. The "Causal Responsibility & Expressive Commitment" principle emphasizes both actual causal pathways and what actions express. The "Participatory Harm with Expected Difference" principle focuses on participation in harm-creating systems. The "Threshold-Sensitive Expected Difference" principle modifies their original idea to account for threshold proximity.

  For their new cases: Selling my car to an identical driver might be permissible under all principles. The co-op vote would be discouraged under all principles despite low individual impact. The realistic chicken case creates divergence - the first two principles would require investigation while the third might not.

  Each principle requires sacrificing some verdicts: CREC abandons the donation case inertia intuition; PHE requires dropping the fixed-contract intuition; TSED struggles with the trigger-override asymmetry. I think CREC makes the least costly sacrifices as it preserves most intuitions while explaining the chicken/donation asymmetry through causal pathways.

  The key insight is that moral reasons in collective harm cases arise from both causal responsibility and what our actions express about our values, particularly when participating in harmful systems. Practical applicability suggests we should focus on typical causal structures rather than requiring impossible investigations.
answer: |-
  Based on your cases and requirements, here are three candidate principles, each sacrificing some of your verdicts but offering distinct advantages. The core tension lies between **causal efficacy**, **participation in a harmful practice/system**, and **expressive meaning**.

  ### Candidate Principles

  1.  **Principle 1: Causal Responsibility & Expressive Commitment (CREC)**
      *   **Statement:** You have a pro tanto moral reason against an act A contributing to a collective harm H if, and only if:
          1.  **Causal Pathway:** A is part of a causal pathway that increases the probability or magnitude of H occurring *through the typical functioning of the system* involved (even if A itself makes no difference in this specific instance due to system quirks like fixed contracts or overrides), OR
          2.  **Expressive Commitment:** Performing A constitutes an expressive commitment to, or endorsement of, the harmful practice/system generating H, and refraining from A constitutes a rejection of that practice/system.
      *   **Strength of Reason:** The strength of the reason is determined by:
          *   The expected harm difference A makes via the typical causal pathway (if applicable).
          *   The severity of H.
          *   The clarity and strength of the expressive commitment/rejection involved in A/not-A.
          *   The reason is weakened significantly if the causal pathway is demonstrably blocked *and* the expressive meaning is negated, diluted, or outweighed by other factors in the specific context.
      *   **Motivation by Cases:**
          *   *Fixed Contract & Trigger Override:* Forces Clause 1. Even though *this specific act* changes nothing due to the contract/override, buying is still part of the *typical causal pathway* (demand signals ordering/slaughter) and the system functions *as if* each purchase mattered. Dropping Clause 1 would wrongly absolve these acts.
          *   *Good that will Happen Anyway:* Forces the nuance in Clause 2 and "Strength". Here, donating $20 expresses support for the cause (potentially a reason *for* it!), but the causal pathway to the *outcome* (surgery funded) is demonstrably blocked. The expressive meaning ("pretending to matter") is weak/negative *because* of the blocked pathway and the existence of the church pledge, dissolving the reason *against* donating (and arguably creating a weak reason *not* to donate due to pointlessness/futility). This case shows expressive commitment alone isn't sufficient for a reason *against* without some link to potential harm.
          *   *Recorded vs Unrecorded Purchase:* Forces the "typical functioning of the system" in Clause 1 and the link between expression and system in Clause 2. Both acts involve taking the chicken, expressing a commitment to consuming factory-farmed meat. The *typical* causal pathway involves influencing demand. The *specific* pathway differs (model vs no trace), but both are instances of participating in the harmful system. CREC sees them as morally equivalent *in this context* because the expressive commitment is identical and both are core instances of participating in the demand-driven system, even if the data trace varies. Dropping the "typical system" focus would wrongly distinguish them.
          *   *Attributed Share:* Supports the focus on *your* contribution (your tonnes) via the causal pathway you participate in (your consumption driving your emissions), rather than a fractional share of an abstract total. You are responsible for the harm *caused by* the system *in response to* your specific demand/signal.
      *   **Sacrificed Verdicts:** Requires abandoning the intuition that inertia *always* dissolves the reason in cases like *Good that will Happen Anyway*. CREC explains *why* the inertia dissolves it there (blocked causal pathway + weak/negative expression) but not in the chicken cases (active participation in typical causal pathway + clear expressive commitment to harm).
      *   **Verdicts on New Cases:**
          *   *Selling Car:* **Permissible (Weak/No Reason Against).** Selling the car to an identical driver removes you from the causal pathway of *your* emissions. While selling expresses willingness to enable driving, the causal link to *increased* harm is broken (the same harm occurs regardless). The expressive meaning is ambiguous (facilitation vs. mere transfer). CREC finds little reason against.
          *   *Co-op Vote:* **Strong Reason to Vote No.** Voting "Yes" is part of the causal pathway to switching suppliers (your vote could be pivotal, though unlikely) *and* constitutes a clear expressive commitment to endorsing the harmful supplier. The financial interest is outweighed. The low chance of pivot strengthens the expressive reason relative to the causal one, but the reason remains strong.
          *   *Realistic Chicken:* **Same Guidance as if Mechanism Known? Mostly Yes.** CREC focuses on your act as participating in the *typical* harmful system (industrial meat production driven by consumer demand) and expressing commitment to it. Knowing the *specific* mechanism (contract, trigger, forecast) might slightly modulate the *strength* of the causal reason (e.g., fixed contract weakens the expected difference component), but the core reason based on participation and expression remains significant regardless. You don't need to know the supply chain details. The principle tells you: "Don't buy the chicken breast because you are participating in and endorsing a harmful practice." *This satisfies your preference for aisle-applicability.*

  2.  **Principle 2: Participatory Harm with Expected Difference (PHE)**
      *   **Statement:** You have a pro tanto moral reason against an act A contributing to a collective harm H if, and only if:
          1.  **Harmful Practice:** A constitutes participation in a practice P that is harmful (i.e., P systematically produces H).
          2.  **Expected Contribution:** Your participation in P through A makes a non-zero expected difference to H *under normal conditions of P's operation*.
      *   **Strength of Reason:** The strength of the reason is primarily a function of the expected harm difference A makes under normal conditions, modulated by the severity of H.
      *   **Motivation by Cases:**
          *   *Fixed Contract:* Forces the "under normal conditions" qualifier in Clause 2. *Normally*, buying chicken increases expected orders/slaughter. The fixed contract is an abnormal, temporary blockage of the normal causal pathway. Your act *is* participation and *would* make an expected difference normally. Dropping "normal conditions" would wrongly absolve you here. *This requires sacrificing your verdict that a reason persists in the fixed-contract case.* PHE says: If you *know* the normal causal pathway is completely blocked (fixed contract), and participation makes *zero* expected difference even under normal operation assumptions, then no reason exists. Your intuition might stem from not fully internalizing the knowledge or from expressive concerns PHE doesn't capture.
          *   *Trigger Override:* Similar to Fixed Contract. The override blocks the causal pathway *this time*, but buying is still participation in a practice where the *normal* causal pathway (triggering orders) exists and your act *would* make an expected difference under normal conditions. The reason persists.
          *   *Good that Will Happen Anyway:* Forces the combination. Donating $20 is participation in fundraising (not inherently harmful), and crucially, under *normal* conditions of fundraising (no guaranteed bailout), your donation *would* make an expected difference to the outcome. However, the *actual* conditions block the causal pathway. PHE focuses on the *normal* expected difference of the *practice*. Here, the practice (donating to a fundraiser) normally makes a difference, so a weak reason *for* donating might exist (if the cause is good), but no reason *against* exists because the practice isn't harmful (H is the *lack* of funding, which your donation helps prevent). The inertia dissolves the reason *for* donating, but PHE doesn't generate a reason *against* it.
          *   *Unlikely Threshold:* Supports Clause 2. Your signature is participation in a harmful practice (petitioning for destruction). Under normal conditions (petitions often succeed or fail based on signatures), your signature makes a non-zero expected difference, even if small. The strength is proportional to that small expected difference. *This requires sacrificing your verdict that the reason is stronger than the expected difference calculation.* PHE says your reason is weak, proportional to the ~10% chance your signature pushes it over the threshold or helps motivate others.
      *   **Sacrificed Verdicts:** Requires abandoning the intuition that a reason persists in the *Fixed Contract* case (knowledge of zero expected difference under normal conditions dissolves it) and the intuition that the reason in the *Unlikely Threshold* case is much stronger than the small expected difference.
      *   **Verdicts on New Cases:**
          *   *Selling Car:* **Permissible (Weak/No Reason Against).** Selling the car is participation in the used car market. Under normal conditions, selling a functional car *might* slightly increase total driving (if the buyer drives more than you would have) or enable driving by someone else. However, selling to a buyer who will drive *exactly as much as you* means the expected difference under normal conditions is zero. No reason against.
          *   *Co-op Vote:* **Weak Reason to Vote No.** Voting "No" is participation in the voting practice. Under normal conditions, your vote makes a small expected difference to the outcome (chance of being pivotal). The reason exists but is weak (~probability of pivot * harm of switch). The financial interest for voting "Yes" may outweigh this weak reason.
          *   *Realistic Chicken:* **Same Guidance as if Mechanism Known? No, and it shouldn't be.** PHE requires knowing the *normal* causal mechanism of the practice to assess the expected difference. If you don't know if it's fixed contract (zero expected difference) or trigger/forecast/continuous (non-zero expected difference), you cannot apply the principle confidently. You *must* estimate the expected difference under normal conditions, which requires knowing how the system typically works. It tells you to find out or assume the worst-case (non-zero) scenario. *This violates your preference for aisle-applicability under ignorance.*

  3.  **Principle 3: Threshold-Sensitive Expected Difference (TSED)**
      *   **Statement:** You have a pro tanto moral reason against an act A contributing to a collective harm H if, and only if, A increases the expected value of H.
      *   **Strength of Reason:** The strength of the reason is proportional to the amount by which A increases the expected value of H. However, this expected difference is calculated by considering:
          1.  **Threshold Proximity:** The probability that the collective outcome is near a threshold where marginal contributions have high impact.
          2.  **System Dynamics:** The causal structure of the system (e.g., continuous, threshold-triggered, contract-bound).
      *   **Motivation by Cases:**
          *   *Unlikely Threshold:* Forces Clause 1 (Threshold Proximity). Although the absolute chance your signature is pivotal is small (~10% chance it's needed *if* the other two sign, and maybe a chance it influences others), the system is *at a threshold* (only 2 needed). Being near a threshold increases the *potential* impact of your act, which is factored into the expected value calculation. A standard EV calculation *should* reflect this. Your verdict suggests your intuition assigns more weight to the threshold proximity than a standard EV model might. TSED explicitly incorporates this, arguing a proper EV model considering threshold proximity *can* deliver a significant reason. Dropping Clause 1 would make TSED unable to explain the strong intuition here.
          *   *Trigger Override:* Forces Clause 2 (System Dynamics). The system dynamics (override) mean your purchase changes *only* timing. The expected difference in total birds killed is zero. However, the expected difference in *harm* might be non-zero if earlier slaughter causes slightly more suffering (e.g., younger birds killed, tighter schedules) or has symbolic weight. If no extra harm is expected, TSED says *no reason against buying*. This requires sacrificing your verdict that you still should not buy. Your intuition might stem from participation/expression or misjudging the expected difference.
          *   *Good that will Happen Anyway:* Supports the core. Expected difference in the outcome (surgery funded) is zero. No reason against donating (though perhaps no strong reason for it either).
          *   *Fixed Contract:* Supports the core. Expected difference is zero. No reason against buying.
      *   **Sacrificed Verdicts:** Requires abandoning the intuition that a reason persists in the *Fixed Contract* and *Trigger Override* cases (if no extra harm from timing change exists), and potentially the intuition that the *Trigger Override* case feels stronger than *Fixed Contract* (TSED sees both as zero expected difference).
      *   **Verdicts on New Cases:**
          *   *Selling Car:* **Permissible (No Reason Against).** Expected difference in emissions is zero. No reason against.
          *   *Co-op Vote:* **Weak Reason to Vote No.** Calculate the probability your vote is pivotal (likely very low given expected 115 Yes votes vs 101 needed) multiplied by the harm of the switch. This is a small expected difference. Reason is weak. Financial interest for "Yes" may outweigh it.
          *   *Realistic Chicken:* **Same Guidance as if Mechanism Known? No, and it shouldn't be.** Calculating the expected difference absolutely requires knowing the system dynamics (contract? trigger? forecast? continuous?) and relevant thresholds. You cannot apply TSED without this knowledge. It tells you to find out. *This violates your preference for aisle-applicability under ignorance.*

  ### Recommendation & Cheapest Sacrifice

  *   **Which Sacrifice is Cheapest?** Sacrificing the intuition that inertia *always* dissolves the reason (as in *Good that will Happen Anyway*) is the cheapest sacrifice. Your other cases show powerful intuitions that reasons persist *despite* inertia when participating in harmful systems/practices. CREC best explains *why* inertia dissolves the reason in the donation case (blocked causal pathway + weak expression) but not in the harmful consumption cases (open causal pathway + strong negative expression).
  *   **Best Candidate:** **Causal Responsibility & Expressive Commitment (CREC)** makes the least costly sacrifice. It preserves your core intuitions in the harmful contribution cases (Fixed Contract, Trigger, Unlikely Threshold, Recorded/Unrecorded, Attributed Share) while offering a plausible explanation for the asymmetry with *Good that will Happen Anyway*. It provides clear, applicable guidance under ignorance in the Realistic Chicken case ("Don't participate in harmful systems") and handles the new cases coherently. Its main weakness is potentially downplaying the *Fixed Contract* case's expected difference, but it retains a reason based on participation and expression.
  *   **Runner-up:** **Participatory Harm with Expected Difference (PHE)** is more precise on causal impact but requires sacrificing the *Fixed Contract* intuition and struggles with applicability under ignorance. **Threshold-Sensitive Expected Difference (TSED)** refines your initial idea but sacrifices key intuitions (Fixed Contract, Trigger Override) and is impractical under ignorance.

  **Therefore, adopt CREC:** Your reason against contributing stems from participating in the typical causal pathways of harmful systems and/or expressively committing to those harmful practices. The strength depends on expected harm, severity, and expressive clarity. You need not know the precise supply chain mechanics; focus on your participation in and endorsement of the harmful practice itself. Abandon the intuition that the inertia in *Good that will Happen Anyway* is fundamentally identical to the inertia in the chicken cases; the context (harmful vs. beneficial system, expression) breaks the symmetry.
