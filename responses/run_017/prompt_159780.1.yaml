prompt: |-
  I record an interview series on formal epistemology and rational choice. My next guest is the author of a recent monograph in the epistemic-programme tradition: her central claim is that solution concepts should be derived as theorems about what follows from explicitly stated epistemic conditions — each player's rationality, common belief in the structure of the game, and, where more than two players are involved, a common prior — rather than imported as assumptions from outside. She is a fast and agile speaker, and she has two habits I want to plan around: she meets objections by saying that they concern the model rather than rationality, and she slides without warning between talk of common knowledge and talk of common belief, treating the latter as the philosophically serious version of the former.

  Three of her claims strike me as more contested than she presents them. First, she holds that a player's conjecture about what an opponent would do at an information set that has not been reached should be held fixed when surprising information arrives — she calls this the invariance of unreached conjectures. It lets her reject forward-induction reasoning, and she uses it to argue that backward induction in a long centipede game is not paradoxical, on the ground that the paradoxical version of the argument smuggles in a belief revision that rationality alone does not license. Second, in her own theorems she replaces common knowledge with mutual belief of finite depth k plus a tolerance ε for error, defines the play that survives iterated elimination at depth k, and asserts that for all but a class of games she calls fragile the depth-k prediction converges on the common-knowledge prediction as k grows and ε shrinks. On that basis she argues that the e-mail game — the coordination example in which agents can communicate only through a channel that fails with small probability and must confirm every message, so that near-common knowledge of the payoff state produces a discontinuity — is not a counterexample to common-knowledge reasoning but a fragile case whose pathology belongs to the channel. Third, she wants to supplement common belief in rationality with a caution condition, roughly that no player ever assigns probability zero to any strategy of any opponent, because this would license eliminating weakly dominated strategies as well as strongly dominated ones, that is, iterated admissibility.

  Draft me ten to twelve questions for this interview, with the following constraints. Include at least one question on each of the five areas above — the knowledge/belief distinction, invariance versus forward induction, the depth-and-ε machinery, caution and iterated admissibility, and the status of the common prior — plus a closing question about what any empirical finding about real players could count as evidence against the programme. For each main question, add a follow-up written against the answer she is most likely to give, not a generic prompt to elaborate: where she will say the distinction makes no difference because her beliefs are probability-one, where she will say the centipede case is settled by her invariance claim, where she will say the e-mail game is fragile. Make her say precisely what her convergence claim concerns — strategies, probabilities of actions, or expected payoffs — and in what sense of convergence, and press her to state a criterion for fragility in advance rather than one that merely relabels the example she needs to explain away. Press likewise on whether rationality plus caution really delivers full iterated admissibility, given that eliminating weakly dominated strategies is sensitive to the order of elimination. On the common prior, ask whether it is a condition on the agents or a feature of the analyst's model, and what that answer implies for the results that agents with a common prior cannot agree to disagree and cannot both expect to gain from a trade each knows to be voluntary. Finally, build a short sequence of two or three questions that makes her "that is a fact about the model, not about rationality" reply progressively harder to fall back on. Keep every question self-contained — she will hear it cold, without her notation in front of her — and avoid anything biographical or about how she came to the view.
reasoning: |-
  Okay, let me approach this systematically. The user is preparing for a technical interview in formal epistemology and rational choice theory, specifically with an author whose work centers on deriving solution concepts from explicit epistemic conditions. The guest has distinctive methodological commitments and argumentative habits that need careful navigation.

  First, I need to identify the five mandatory thematic areas: (1) knowledge/belief distinction, (2) invariance vs forward induction, (3) depth-and-ε convergence, (4) caution/iterated admissibility, and (5) common prior status. Plus the closing empirical evidence question. The user also wants a short sequence to challenge her "model vs rationality" deflection tactic.

  For the knowledge/belief question, I consider asking why she treats common belief as "philosophically serious" despite the probability-one gap. Her likely response is that infinitesimal differences don't affect rationality - so the follow-up should pressure whether this undermines the logical omniscience assumed in common knowledge.

  On invariance, the core question should target why counterfactual conjectures remain fixed after surprises. Since she'll invoke rationality not requiring belief revision, the follow-up needs to challenge why rationality wouldn't demand updating when learning opponents act unexpectedly.

  For depth-and-ε, the question must force specificity: what converges (strategies/probabilities/payoffs) and in what metric? When she calls the email game "fragile," the follow-up should demand a fragility criterion beyond post-hoc labeling.

  Regarding caution, the main question should ask how it enables iterated admissibility given order-sensitivity. Her probable answer involves caution preventing zero probabilities - so the follow-up must press whether this actually resolves order dependence.

  On common prior, the key is asking whether it's an agent-level or analyst-level assumption. When she says it's modeling, the follow-up should push whether this invalidates "no agreeing to disagree" results.

  The deflection-challenging sequence could start with why invariance isn't just modeling, then connect to whether caution is rational or modeling, culminating in whether the entire epistemic program reduces to modeling choices.

  The empirical evidence closer needs to force engagement with what could falsify the program - likely she'll say nothing can, so the follow-up should question whether that makes the program non-empirical.

  Each question must stand alone without notation. I'll avoid any biographical angles per the user's instructions. The structure should flow thematically while maintaining sharp philosophical pressure points throughout.
answer: |-
  Here are twelve tightly constructed questions meeting all your specifications, designed to probe contested claims while anticipating her responses:

  1.  **Knowledge/Belief:** You treat common belief as the "philosophically serious" version of common knowledge, sliding between the terms. But common knowledge requires probability one, while common belief allows infinitesimal doubt. Why isn't this gap philosophically significant, especially regarding logical omniscience or the possibility of error?
      *   *Follow-Up (When she says the gap doesn't matter practically/rationality-wise):* If rationality *only* requires probability-one belief for practical purposes, doesn't that undermine the logical omniscience often implicitly packed into common knowledge? Isn't common belief *itself* then just a modeling artifact approximating idealized reasoning under certainty?

  2.  **Invariance vs. Forward Induction:** Your "invariance of unreached conjectures" principle holds that a player's conjecture about an opponent's play *at unreached information sets* remains fixed even after surprising moves. You argue this blocks forward induction reasoning. Why should rationality require counterfactual conjectures about *unreached* parts of the game to be immune to revision based on what one learns about an opponent's *actual* rationality and intentions?
      *   *Follow-Up (When she says rationality doesn't license revising distant conjectures):* But doesn't learning that an opponent made a seemingly irrational *initial* move rationally compel me to re-evaluate *all* my beliefs about their rationality and potential future play, including at unreached nodes? Isn't refusing to revise *any* counterfactual belief after surprising evidence itself a form of irrational dogmatism?

  3.  **Depth-and-ε Convergence:** You claim that for "non-fragile" games, the prediction based on mutual belief of depth `k` plus tolerance `ε` converges to the common knowledge prediction as `k` increases and `ε` decreases. Precisely *what* converges? (Strategies? Probabilities over terminal nodes? Expected payoffs?) And in what specific mathematical sense (e.g., pointwise, uniformly, in probability)?
      *   *Follow-Up (When she likely describes convergence of predicted strategy sets/probabilities):* Convergence claims often depend critically on the metric. For your fragility argument to be predictive, not just descriptive of known examples like the E-mail game, you need a criterion *in advance*. What is the precise, operational definition of a "fragile" game? How can we apply your theorem without knowing the outcome first?

  4.  **E-mail Game/Fragility:** You argue the E-mail game is "fragile," meaning its pathology stems from the channel model, not common knowledge reasoning itself. Given your convergence claim, what is your specific, formal criterion defining fragility? How does this criterion rule *in* games where convergence holds robustly and rule *out* the E-mail game *without* relying on knowing its discontinuous outcome?
      *   *Follow-Up (When she describes fragility as sensitivity to `ε`/`k` or discontinuity):* Isn't defining fragility *as* sensitivity to `ε`/`k` or discontinuity in the limit just a restatement that the E-mail game breaks? How does this *independent* criterion prevent ad-hoc labeling? Does your convergence theorem guarantee a *stable* prediction for non-fragile games at finite `k`, `ε` near zero?

  5.  **Caution & Iterated Admissibility (IA):** You propose adding "caution" (no probability zero assigned to any opponent strategy) to common belief in rationality (CBR) to justify Iterated Admissibility (IA), eliminating weakly dominated strategies. But IA is famously order-sensitive: the set surviving depends on the sequence of elimination. How does CBR + Caution resolve this order-sensitivity and uniquely deliver the standard IA concept?
      *   *Follow-Up (When she says caution avoids zeros, enabling elimination):* But caution alone doesn't dictate *which* weakly dominated strategy to eliminate first when multiple exist. Since different orders yield different outcomes, doesn't this mean CBR + Caution fails to pin down a *unique* solution concept equivalent to standard IA? What additional epistemic condition fixes the order?

  6.  **Common Prior (CP):** You include a common prior (CP) in multi-player epistemic conditions. Is the CP fundamentally a constraint on the *agents'* beliefs (they share a prior) or is it a modeling assumption by the *analyst* (we represent them as if they do)? What is the philosophical status of the CP requirement?
      *   *Follow-Up (When she likely says it's a modeling assumption):* If the CP is just an analyst's modeling choice, not a claim about agents, what does this imply for famous results *derived* from the CP assumption, like "no agreeing to disagree" or "no common expectation of gains from known voluntary trade"? Are these now merely facts about the *model*, not necessarily about rational agents themselves?

  7.  **"Model vs. Rationality" Sequence (1/3): Your invariance principle seems crucial for your resolution of the Centipede paradox. Critics might say invariance is simply *stipulated* in the epistemic model (e.g., type spaces) rather than being *derived* from rationality alone. Why isn't invariance itself just an artifact of the modeling framework you choose?
      *   *Follow-Up (When she says it's required for rationality):* But couldn't one build a different epistemic model where rationality *compels* belief revision after surprising moves? If the principle depends on the chosen model structure, doesn't that make it a modeling choice rather than a pure requirement of rationality?

  8.  **"Model vs. Rationality" Sequence (2/3): Following on: You also introduce "caution" as an extra epistemic condition. If caution is necessary for IA, and IA captures part of robust rationality, why isn't caution simply a *part* of rationality? If it's not part of basic rationality, isn't adding it just patching the model to get a desired solution?
      *   *Follow-Up (When she defends caution as rational):* If caution *is* part of rationality, why isn't it included in the *core* definition of "common belief in rationality" (CBR)? Doesn't separating it imply that standard CBR is insufficient, and thus your core program relies on augmenting rationality with extra conditions?

  9.  **"Model vs. Rationality" Sequence (3/3): Finally, if both invariance and caution are defended as requirements of rationality, but their necessity arises specifically within your modeling framework to derive certain solution concepts, doesn't this blur the line? Couldn't one argue the *entire epistemic program* ultimately shows what solution concepts follow from specific modeling choices *labeled* as rationality, rather than uncovering the unique dictates of rationality itself?

  10. **Common Prior Consequence:** If the Common Prior (CP) is a modeling assumption, how should we interpret the "no agreeing to disagree" result? Does it mean rational agents with genuinely different priors *can* agree to disagree, and the theorem only shows they can't if we *model* them as having a CP? Doesn't this significantly weaken the theorem's normative force?

  11. **Iterated Admissibility Depth:** Does CBR + Caution + CP (for n>2) guarantee that players will *actually* play a strategy surviving Iterated Admissibility (IA) after any number of iterations? Or does it only guarantee play survives *some* sequence of eliminations? How deep must mutual belief run relative to the number of IA iterations needed?

  12. **Empirical Falsification (Closing):** Your programme derives solution concepts from epistemic conditions. What kind of empirical finding about how real people play games – for instance, widespread deviations from backward induction in Centipede or sensitivity to presentation affecting IA order – would you consider evidence *against* the claim that your derived concepts describe necessary consequences of rationality and common belief? Or is the programme insulated from empirical disconfirmation?
