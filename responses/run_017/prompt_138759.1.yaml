prompt: |-
  I am a software engineer with no formal philosophy background, and I maintain a system that stores anticipatory instructions people write about their own future incapacity and, when a trigger condition fires, hands a recommendation to the clinician or proxy who has to act on it. The clinical cases are the familiar ones: a written refusal of invasive life-prolonging treatment in the event of advanced irreversible dementia, and the psychiatric analogue in which someone authorizes compulsory admission or forced medication during manic episodes. I also maintain a consumer product in which people pre-commit to future actions, and the same question comes up there, which suggests to me that the issue is not really medical.

  I do not want a survey of how any particular jurisdiction treats these documents. I am told the statutory rules vary and I have no way to check them, and I do not want a specification that rests on them. What I need is the normative core: when, and on what grounds, does an instruction issued by an earlier person have authority over a later person who is no longer in a position to have issued it?

  Please give me the answer as a requirements document rather than an essay. I want the desiderata that any adequate account of the authority of the earlier self has to meet, where adequate means good enough to be implemented as policy at the bedside by a relative stranger, with incomplete information, in a few minutes, and defensible afterward to a review board and to the patient's family. For each requirement: state it, give the case or consideration that motivates it, say what it excludes, and mark it as non-negotiable or as the preference of one camp. Then tell me which of my requirements you think are not genuine desiderata at all but prejudices that happen to be widespread; whether some subset of the requirements is jointly unsatisfiable, since if it is, that fact is itself the most useful thing you can tell me; and which single requirement does the most work in excluding candidate theories.

  Here are the cases I already think are load-bearing. Please add the ones I am missing, and tell me if any of mine is confused or is doing no work.

  1. *The baseline.* A competent adult refuses, in writing, invasive life-prolonging treatment in the event of permanent unconsciousness or advanced irreversible dementia; years later the condition obtains. I take it that any theory that cannot deliver this verdict is disqualified.
  2. *The contented patient.* As above, except the later person appears to take real pleasure in music and visitors and shows no sign of wanting to die, and the earlier document's stated reason was horror at being a burden on others. I want to know whether an instruction can be separated from the reasons that produced it, and whether the answer differs depending on whether the later person has preferences at all or merely affects.
  3. *The Ulysses case.* A person with bipolar disorder authorizes forced medication during manic episodes and, while manic, revokes it fluently, at length, and with apparent coherence.
  4. *The depressed author.* A refusal of aggressive treatment written during a severe depressive episode, never revisited after recovery, acted on years later.
  5. *Drift.* A refusal of being kept alive by machines, written when that phrase meant an intensive-care ventilator, in a situation where the only intervention on offer is a portable ventilator at home or a daily tablet. Or a directive written before a therapy existed that turns the triggered condition from terminal into chronic and manageable.
  6. *The corpus.* Five documents over fifteen years with no clean revocation, the most recent being the most restrictive but signed during a bad month, and an earlier one being visibly better informed. Last-writer-wins versus best evidence of an enduring will.
  7. *The self-sealing trigger.* A directive that applies only if I no longer recognize my family, or only if I am no longer myself: a condition whose satisfaction is best evidenced by exactly the later report that the condition discounts. Does a theory have to permit triggers that entrench themselves against the only available evidence, and if not, what is the principled reason?
  8. *The stack.* A clause saying that any revocation I issue while manic is to be ignored; a later clause saying that any clause stripping my future power to revoke is to be ignored; possibly a third clause about the second. Does the theory have to supply a fixed point here, or may it let the stack collapse to a default, and on what basis?
  9. *The gate.* A hypothetical policy under which directives lapse unless reaffirmed on a schedule, as a lease lapses unless renewed. Is reaffirmation merely evidence that the person still endorses the instruction, or does it do independent normative work as a condition on authority? Does authority decay continuously or lapse all at once?
  10. *Granularity.* A later person who is competent about some matters, such as recognizing family or refusing one particular drug, but not about others, such as weighing a long-horizon tradeoff. Is authority scoped decision by decision, or is the person one unit for this purpose?
  11. *Third-party effects.* A directive demanding everything, which will consume years of a family's life and a large share of its resources; or a directive requiring clinicians to provide what they regard as physiologically non-beneficial. Is the earlier self's authority bounded by effects on others, and is such a bound a limit on authority or a distinct side-constraint that the theory of authority can stay silent about?

  Beyond the cases, I think a theory has to respect some distinctions that I have seen collapsed in practice, and I would like you to correct the list: having authority versus how much authority; the authority of an instruction versus the authority of the values behind it; the earlier self's word being binding versus being merely good evidence of what the later self wants or of what is good for the later self; revocation versus supersession versus never having applied; and a trigger condition being satisfied versus a trigger condition being verifiable by someone other than the party who benefits from its being satisfied.

  Two further constraints from my side, which you should treat as candidates for desiderata rather than as given. The first is observability: a criterion that turns on facts nobody at the bedside can establish in minutes is not one I can implement, however true it is, so for each of your requirements I want the observable proxy you would accept and your view on whether demanding observability is a genuine desideratum or a corruption of the theory for administrative convenience. The second is error asymmetry: when the record is silent or genuinely ambiguous, should a system treat the earlier instruction as in force or as not in force, and is the asymmetry between those two failures part of the theory of authority or a separate moral input that the theory should be required to declare rather than absorb silently?

  Finally, and briefly, because I care much more about the criteria than about the scoring: I have been working with four rough positions, which I will describe rather than name in case I have them wrong. One says that competent choices about one's own future bind, full stop. One says that what matters is the interests and experiences of the person now in the bed, with the document at most evidence of those. One says that what binds is the earlier person's enduring values or character rather than the literal list of interventions, so the document is a fallible guide that can be overridden in its own terms. One says that what binds is something like authorship of a life, so the earlier self can have authority over how that life goes that outruns both the text and the later self's present preferences. Give me a short paragraph on where each fails your list, and tell me whether I have drawn the four wrong or have missed a position that the list makes available. A table at the end is fine.
reasoning: |-
  Okay, let me approach this systematically. The user is a software engineer maintaining systems for anticipatory instructions in both clinical and consumer contexts, seeking a requirements document for the normative core of earlier-self authority. They've provided 11 detailed cases and several conceptual distinctions, with clear constraints around implementability.

  First, I need to parse their core question: what gives an earlier self's instructions authority over a later incapacitated self? This isn't about legal compliance but about building ethically defensible systems. Their focus on observable proxies and error asymmetry suggests they need practical decision rules, not philosophical abstractions.

  Looking at their cases, I notice gaps in two areas: identity changes over time (like radical personality shifts) and resource allocation fairness. I'll add these as new cases 12 and 13. Their existing cases seem robust, though "self-sealing trigger" might be reframed as an evidentiary paradox rather than a distinct problem.

  The key distinctions they mention are crucial. I'll structure requirements around five axes: scope of authority, persistence conditions, revocation logic, implementation constraints, and conflict resolution. Each requirement must address their observability constraint - for example, using behavioral markers like coherence under questioning rather than unmeasurable mental states.

  For error asymmetry, I lean toward defaulting to instructions being active unless revoked. This minimizes false negatives where someone's documented wishes are ignored. But this must be balanced with their "contented patient" case where literal application might harm the present self.

  Their four positions map roughly to: autonomy absolutism, present-experience primacy, values interpretation, and narrative authority. I see the values interpretation approach as most promising because it navigates "drift" scenarios and avoids the problems of strict textualism while respecting the author's agency more than present-experience models.

  The trickiest requirement will be revocation protocols - their "stack" case shows how self-referential clauses create paradoxes. My solution is to treat revocation capacity as domain-specific (granularity requirement) and require external verification when self-referential triggers are involved.

  Finally, I'll flag that the observability constraint might exclude some philosophically valid considerations, but since the user needs bedside-implementable rules, this is an acceptable tradeoff. The requirements document format will force concrete answers rather than open-ended debate.
answer: |-
  **NORMATIVE CORE REQUIREMENTS DOCUMENT: AUTHORITY OF THE EARLIER SELF**

  **1. Scope & Binding Force**
  *   **Requirement (R1):** The earlier instruction binds *if* it represents a competent decision about a foreseeable future state, *and* the later self lacks decisional capacity for the specific domain addressed by the instruction. (Non-negotiable)
      *   *Motivation:* Baseline case, Ulysses case. Respects autonomy exercised when capable; prevents later incapacity from voiding prior choices.
      *   *Excludes:* Theories granting absolute priority to the present-moment experiential state (ignores prior competent choices) or theories requiring continuous reaffirmation for basic validity.
      *   *Observable Proxy:* Documented assessment of decisional capacity *at the time of writing* (e.g., clinician signature, date/time, witness statements); current assessment of decisional capacity *for the specific decision domain* (see Granularity).
  *   **Requirement (R2):** Authority is scoped to the specific decisions/interventions addressed in the instruction and relevant to the triggered condition. (Non-negotiable)
      *   *Motivation:* Granularity case. Incapacity is often domain-specific; authority should match.
      *   *Excludes:* "All or nothing" approaches to capacity assessment or authority assignment.
      *   *Observable Proxy:* Clear mapping between the instruction's clauses and the current clinical situation/decision points.

  **2. Persistence & Conditions**
  *   **Requirement (R3):** Authority persists unless: (a) the instruction is validly revoked by a *currently competent* self; (b) the trigger condition is demonstrably *not* met; (c) the specific intervention/context has changed so fundamentally ("Drift") that applying the literal instruction would contradict the discernible *core purpose or value* motivating it. (Non-negotiable core; application involves judgment).
      *   *Motivation:* Baseline, Drift, Gate, Self-Sealing Trigger. Balances stability of prior choices with changed realities. Distinguishes revocation from supersession.
      *   *Excludes:* Automatic lapse without revocation (unless explicitly stated in document); rigid textualism ignoring context drift; ignoring explicit revocations made while competent.
      *   *Observable Proxy:* Evidence of valid revocation (signed/dated document, credible witness); clear mismatch between instruction details (e.g., "machines" meaning ICU ventilator) and current reality (portable home vent); explicit stated purpose in the document (e.g., "avoid burdensome interventions with low chance of meaningful recovery").
  *   **Requirement (R4):** Reaffirmation requirements (Gate) serve *only* as *evidence* of enduring will/values, not as an independent condition for authority. Authority does not continuously decay. (Preference: Majority view favoring stability).
      *   *Motivation:* Gate case. Burden of repeated reaffirmation undermines purpose; lapse creates uncertainty. Enduring values are key.
      *   *Excludes:* Theories where authority inherently diminishes over time absent reaffirmation.
      *   *Observable Proxy:* Presence/absence of reaffirmation documents; date of original instruction (older documents require more scrutiny for Drift/R5, not inherent authority).

  **3. Interpretation & Override**
  *   **Requirement (R5):** The literal instruction should be overridden *only if* there is clear and convincing evidence that: (a) applying it would directly cause significant, avoidable suffering *to the patient* that contradicts the *discernible core values or intended purpose* of the author (Contented Patient), OR (b) fundamental Drift renders the literal instruction incoherent or contrary to its core purpose. (Non-negotiable principle; high bar for override).
      *   *Motivation:* Contented Patient, Drift. Respects authorship while preventing harm caused by rigid application ignoring context or patient's *current* experience *if* it reveals a misunderstanding of core values. Separates text from underlying values only when necessary and justified.
      *   *Excludes:* Overriding based solely on the later self's *preferences* if incompetent; overriding based solely on family/clinician burden (see R10); overriding due to mere passage of time.
      *   *Observable Proxy:* Documented reasons/values in the instruction; observable signs of significant distress/contentment *directly related to the intervention*; clear evidence of technological/contextual change making the instruction nonsensical (e.g., refusing "dialysis machines" when only peritoneal dialysis is available).
  *   **Requirement (R6):** The later self's *expressed preferences*, if made while *incompetent for the specific decision domain*, do not revoke the instruction and carry minimal independent weight against it. (Non-negotiable)
      *   *Motivation:* Ulysses case, Self-Sealing Trigger. Core purpose is to bind the future incompetent self. Discounting incompetent self-reports is essential.
      *   *Excludes:* Theories granting significant weight to preferences expressed during triggered incapacity.
      *   *Observable Proxy:* Assessment of current decisional capacity *for this specific decision*.

  **4. Revocation & Meta-Rules**
  *   **Requirement (R7):** Only a revocation issued while *competent* (assessed for the domain of managing advance directives/healthcare decisions generally) is valid. Meta-rules about revocation (Stack) are binding only if issued while competent. Infinite regress (Stack) defaults to the *original instruction being in force* if the revocation clause itself was issued while competent. (Non-negotiable)
      *   *Motivation:* Ulysses case, Stack case. Prevents self-defeating loopholes; requires competence for meta-decisions. Provides a fixed point.
      *   *Excludes:* Allowing revocation during the triggered incapacity; allowing meta-rules to create unresolvable paradoxes without a default.
      *   *Observable Proxy:* Signed/dated revocation document; assessment of *general* healthcare decision-making capacity *at the time of revocation or meta-rule creation*.

  **5. Evidence & Conflict Resolution**
  *   **Requirement (R8):** When multiple documents exist (Corpus), the *most recent* competent instruction *relevant to the current situation* takes precedence, unless there is clear and convincing evidence it was issued under significant, relevant impairment (e.g., Depressed Author) *and* an earlier instruction better reflects stable values/wishes. (Preference: Recency with Impairment Exception).
      *   *Motivation:* Corpus, Depressed Author. Generally respects last competent expression; protects against transient impairments distorting enduring will.
      *   *Excludes:* Strict "last writer wins" ignoring impairment; always deferring to the "best informed" (too subjective).
      *   *Observable Proxy:* Document dates; evidence of impairment at time of signing (e.g., documented severe depression, incoherence); consistency with prior expressions of values.
  *   **Requirement (R9):** The burden of proof lies on those seeking to *override* or *discount* a formally valid instruction (Error Asymmetry). In genuine ambiguity/silence regarding the *specific* intervention, the presumption is *against* administering invasive/prolonging interventions absent clear prior authorization. (Non-negotiable principle).
      *   *Motivation:* Error Asymmetry, Baseline. Protects bodily autonomy; minimizes risk of unwanted treatment ("false positive" imposition). Respects the default preference for less intrusion implied by refusal documents.
      *   *Excludes:* Requiring absolute certainty before following an instruction; presuming in favor of life-prolonging treatment when wishes are unclear.
      *   *Observable Proxy:* Document clearly applies to the situation? (Yes -> Follow, No -> Presume against treatment). Document ambiguous/silent? -> Presume against invasive treatment.

  **6. Limits of Authority**
  *   **Requirement (R10):** The earlier self's authority is bounded by: (a) Clinicians' right not to provide physiologically non-beneficial (futile) or unethical treatment; (b) Significant, disproportionate burdens on identifiable third parties *that were unforeseeable or clearly not consented to* by the author. These are distinct side-constraints, not inherent limits on authority. (Non-negotiable).
      *   *Motivation:* Third-Party Effects. Recognizes legitimate interests of others and professional integrity without collapsing the authority question. Separates "can they demand this?" (authority) from "must it be provided?" (feasibility/ethics).
      *   *Excludes:* Theories that dissolve authority based on third-party burden alone; theories forcing clinicians to act unethically.
      *   *Observable Proxy:* Professional standard for medical futility; clear, specific evidence of disproportionate, unforeseen burden on specific individuals (e.g., directive requiring 24/7 care bankrupting a family, vs. general resource allocation).

  **Added Cases:**
  *   **12. Identity Shift:** An instruction refusing treatment based on values (e.g., independence, dignity) written pre-incapacity; the later self, due to profound neurological change, exhibits values/personality fundamentally alien to the author (e.g., complete passivity, no concern for prior values). *Motivation:* Tests the "enduring values" vs. "precedent autonomy" boundary. *Handling:* R5 - Override only if current state *and* literal application cause suffering contradicting *discernible* core purpose (high bar). Observable: Profound, documented personality/value shift incongruent with document's stated values.
  *   **13. Unforeseen Resource Drain:** A directive demanding maximal life-prolongation consumes resources (e.g., ICU bed, specialist time) desperately needed by many others during a severe shortage (pandemic, disaster). *Motivation:* Tests R10's "unforeseen burden" and scope of authority vs. distributive justice. *Handling:* R10(b) - Bounded by unforeseen disproportionate burden; triage protocols based on current need/prognosis may override.

  **Problematic Requirements & Conflicts:**
  *   **Not Genuine Desiderata (Prejudices):**
      *   **"Literal Text is Sovereign":** Collapses distinction between instruction and underlying values (excluded by R5). Motivated by legalistic thinking, ignores Drift and Contented Patient realities.
      *   **"Present Experience Trumps All":** Ignores prior competent choices (excluded by R1, R6). Motivated by focus on immediate suffering, undermines Ulysses contracts.
      *   **"Authority Must Be Continuously Reaffirmed":** Imposes impractical burden, undermines stability (excluded by R4). Motivated by distrust of past selves or desire for current control.
  *   **Joint Unsatisfiability:** The tension between **R1/R6 (Binding prior choice, discounting incompetent preferences)** and **R5 (Override to prevent suffering contradicting core values in Contented Patient)** is fundamental. This is the core normative conflict. *Resolution:* R5 sets a *very high bar* for override, requiring demonstrable suffering *and* contradiction of discernible core values, preserving primacy of prior choice while allowing a safety valve for extreme, unforeseen dissonance.
  *   **Highest Excluding Power:** **R6 (Incompetent preferences don't revoke/carry minimal weight)** does the most work. It decisively excludes theories prioritizing the present experiential self (even if "contented") or present preferences (even if fluently expressed while manic/demented), and forces the theory to grapple with the core problem of binding the future incompetent self.

  **Observability & Error Asymmetry:**
  *   **Observability is a genuine desideratum.** A theory of authority for *implementation* must provide proxies. Bedside decisions require reliance on documented evidence, observable behaviors, and standardized capacity assessments. Demanding unobservable mental states (exact values, "true self") is a corruption for administrative purposes. Proxies proposed per requirement are generally adequate.
  *   **Error Asymmetry (R9)** is part of the normative core of authority respecting autonomy. Presuming *against* overriding the documented instruction (especially refusals) in ambiguity minimizes violations of bodily integrity and prior choices. This asymmetry flows from the priority given to prior competent choice (R1).

  **Evaluation of Positions:**

  | Position                              | Core Tenet                                     | Major Failures Against Requirements                              |
  | :------------------------------------ | :--------------------------------------------- | :--------------------------------------------------------------- |
  | **1. Competent Choices Bind (Absolutism)** | Prior competent choice is sovereign.           | Fails R5 (Contented Patient, Drift), R10 (Futility/3rd Party). Rigid, ignores context/suffering. |
  | **2. Present Experience Primacy**     | Only current interests/experiences matter.     | **Fails R1, R6 (Baseline, Ulysses).** Ignores prior autonomy, invalidates Ulysses contracts. Fails R9 asymmetry. |
  | **3. Enduring Values Guide**          | Bind to author's core values, not just text.   | **Most consistent.** Fails only if override bar (R5) is set too low, risking disrespect for literal choice. Requires careful implementation of R5/R8 proxies. |
  | **4. Narrative Authorship**           | Earlier self authors the life story, has broad authority. | Risks vagueness; hard to implement observably (R5 proxies help, but "authorship" is abstract). May struggle with Identity Shift if narrative coherence breaks. |

  **Conclusion:** The requirements outline a coherent normative core prioritizing prior competent choice (R1, R6, R9) while incorporating necessary safeguards against rigid application (R5, R3c) and external constraints (R10). The Enduring Values position best satisfies the requirements when implemented with the specified high bar for override and robust observable proxies. The fundamental tension (R1/R6 vs. R5) is unavoidable but manageable with clear, high-threshold criteria for overriding the literal instruction.
