  The key issue is about evidential decision theory (EDT). In EDT, you consider the evidence your action provides about the state of the world, which affects your utility because other agents are correlated due to similar algorithms and flavors.

  My friend argues: install decoupler, then defect. Because after decoupling, your action is random, so cooperating doesn't provide evidence that others cooperate; it's just a coin flip. Thus, defecting dominates: you get 5 or 1 instead of 3 or 0, minus the cost.

  I argue: if everyone reasons this way, then everyone decouples and defects, leading to (D,D) with payoff 1 minus cost, whereas without decoupling, they might cooperate and get 3. So decoupling leads to a worse outcome.

  The question is, for an EDT agent with full reflection, what do they do?

