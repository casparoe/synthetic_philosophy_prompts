  His Platonism is crucial here. Since he trusted mathematical physics over intuition, he'd probably maintain that relativity reveals temporal becoming as mind-dependent. Chronology protection might even please him by resolving the paradox while preserving relativity's core.

  For the thermodynamic arrow of time, he'd likely see it as compatible with his view - it explains sequence but not objective flow. The "internal-view programme" would fascinate him as it validates subjective experience without ontological commitment. I imagine him distinguishing between the unreality of becoming versus the reality of the experiencing subject.

