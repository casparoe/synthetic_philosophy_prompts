prompt: |-
  I've just joined the research ethics board at my hospital, and a colleague has backed me into an argument I can't escape but also can't accept.

  (1) Consent is an intentional state, so it is always consent to an act under some description — nobody consents to a touching or a procedure full stop.
  (2) If A consents to φ as A conceives it, and the act that actually occurs does not satisfy that description, then A's consent does not cover the act that occurred.
  (3) Any false belief about any feature of the act, or of the person performing it, means the description A was consenting under is not satisfied by what actually happens.
  (4) So any deception — even about a feature A is indifferent to, even one A would have consented straight through without pausing — means A did not consent to what happened.
  (5) Contact that isn't consented to is a battery, and consent has to be contemporaneous, so later ratification can't cure it.
  (6) Hence every deception study, every surgery performed by a substitute surgeon, every placebo dispensed with a misleading rationale, and arguably every procedure consented to on the basis of an optimistically framed risk estimate, is a battery.

  That conclusion is absurd, but I can't locate the movable part, and I'd like the diagnosis plus the price list: which step do you reject, why did it look innocent, and what does rejecting it commit me to?

  Two things I want in particular. First, my colleague's repair: distinguish consent to the contact, which she says is object-involving — it attaches to this person's body and this act, and is nearly indefeasible — from consent to the transaction, which is description-sensitive and is voided by fraud, giving a claim for deception but not a battery. Does that distinction hold, or does it merely relocate the question to which level a given deception operates on? And what does it imply about the identity-deception cases, where the intuitive verdict is that consent was vitiated even though the physical act was exactly what was agreed to?

  Second, the counterfactual test. We lean heavily on whether the person would still have consented had she known. But consider a case it handles oddly: the investigators' deception was irrelevant to the participant, who would have enrolled anyway, and was instead essential to getting the protocol past us — the false detail sat in the protocol, not the consent form. She looks unwronged and her consent looks valid, yet the investigators plainly did something wrong. Is the would-have-consented-anyway question a test of validity at all, or only a test of whether the deceived person was harmed or wronged? If the latter, what test of validity is left?

  I'd rather keep the intuitive verdict in the identity cases than the result in (6), but I want to know what that costs me.
reasoning: |-
  Okay, the user is dealing with a complex ethical argument about consent and deception in a hospital research ethics board context. Their colleague has presented a logically structured argument leading to the conclusion that many common practices constitute battery, which the user finds absurd but can't refute. They need help identifying the flawed step and understanding the implications.

  The argument has six steps: (1) Consent is intentional and description-dependent; (2) If the actual act doesn't match the description, consent doesn't cover it; (3) Any false belief means the description isn't satisfied; (4) Thus any deception voids consent; (5) Non-consented contact is battery; (6) Therefore many medical/research practices are battery.

  The user specifically wants: (a) Evaluation of their colleague's proposed repair distinguishing "consent to contact" vs "consent to transaction"; (b) Analysis of the counterfactual test (whether person would have consented if informed); and (c) To preserve intuitive judgment in identity-deception cases without accepting the absurd conclusion.

  Hmm, the core tension is between formal logic and practical ethics. Step (3) seems problematic - it equates all false beliefs as equally invalidating consent, regardless of materiality. But intuitively, not every minor misconception should void consent. For example, if a patient consents to surgery thinking the surgeon has blue eyes (when they're actually brown), that shouldn't constitute battery. 

  The colleague's proposed distinction between "contact" and "transaction" is interesting but potentially unstable. It might work for cases like placebo prescriptions where the physical act matches but the purpose differs, but fails for identity deception where the physical act is identical but the actor's identity matters. 

  The counterfactual test ("would they have consented?") seems more about harm/wrongness than validity. A participant might validly consent to a study while still being wronged by irrelevant deceptions in the protocol. This suggests validity depends on whether the deception concerns essential features of the act, not hypothetical willingness.

  For identity deception cases, we might say identity is part of the act's description when it's reasonably material - which preserves the intuitive result without collapsing into absurdity. The cost is accepting that consent validity exists on a spectrum of materiality rather than being binary.

  The user seems professionally sophisticated but philosophically trapped by the argument's formal structure. They need both conceptual clarity for board discussions and practical principles to evaluate real cases. Their anxiety about "costs" suggests they want to avoid unintended consequences while rejecting the absurd conclusion.
answer: |-
  Your colleague's argument is logically valid but normatively unsound because Step (3) incorrectly treats **all false beliefs as equally invalidating**, regardless of their materiality to consent. This converts consent into an impossibly fragile legal fiction. Below is the diagnosis, rejection of Step (3), analysis of your colleague's repair, and reconceptualization of the counterfactual test.

  ---

  ### **Diagnosis & Rejection**
  - **Step to Reject: (3)**  
    *"Any false belief about any feature of the act... means the description is not satisfied."*  
    - **Why it looks innocent**: It follows from (1) and (2) if we assume consent requires perfect informational symmetry.  
    - **Why it’s wrong**: Not all beliefs are material to consent. Consent hinges on **fundamental features** that define the act’s nature, risks, or purpose. Immaterial false beliefs (e.g., "the surgeon’s favorite color is blue") don’t negate consent.  
    - **Commitment**: You must adopt a **materiality standard**. Consent is vitiated only if deception or error concerns a feature that would cause a reasonable person to withhold consent *or* that the specific patient/subject explicitly deemed essential.

  ---

  ### **Your Colleague's "Repair": Consent to Contact vs. Transaction**
  - **The Distinction**:  
    - **Consent to contact**: Physical act (e.g., "incision at site X"). Hard to vitiate absent physical deviation.  
    - **Consent to transaction**: Contextual elements (e.g., "performed by Dr. Y for purpose Z"). Voidable by fraud.  
  - **Does it hold?**  
    - **Partially**: It resolves *some* cases (e.g., placebo given for pain relief vs. research: same contact, different transaction).  
    - **Fails for identity deception**: If a patient consents to "surgery by Dr. Y," the surgeon’s identity **is part of the transaction**. Physical sameness doesn’t rescue consent if identity was material.  
  - **Cost**: Accepting this distinction commits you to saying that in identity cases, **battery occurs** if identity is material. This aligns with case law (*DeMay v. Roberts*; *Pemberton v. Tallahasse*).  

  ---

  ### **The Counterfactual Test: Flaws and Fixes**
  - **The Problem**:  
    - If deception doesn’t affect the participant’s choice (e.g., irrelevant protocol lie), the counterfactual test suggests consent is valid—yet the act remains ethically wrongful.  
  - **Reframing the Test**:  
    - **Not a validity test**: "Would they have consented anyway?" assesses **harm/wrongness**, not validity. Validity turns on whether material information was withheld.  
    - **Validity test**: Consent is invalid if:  
      (a) The deception/error concerns a **material feature** (core risks, identity, purpose), OR  
      (b) The subject **conditioned consent** on that feature.  
  - **Example**: A placebo trial where participants weren’t told it was a study:  
    - **Invalid consent**: The research purpose is material to the act’s description.  
    - **Unharmed but wronged**: Even if they’d have consented, autonomy was violated via material deception.  

  ---

  ### **Cost of Preserving Intuitive Verdicts (e.g., Identity Fraud)**
  - **What You Keep**:  
    - Identity deception vitiates consent (e.g., impersonating a spouse in intimacy; surgeon swap when identity was specified).  
  - **What It Costs**:  
    1. **Rejection of strict physicalism**: Consent isn’t just about bodily contact but the **integrated act-in-context**.  
    2. **Ambiguity in "materiality"**: You must define what features are "fundamental." Courts often use:  
       - **Reasonable-person standard**: Would this fact change a typical person’s decision?  
       - **Subjective priority**: Did the patient expressly deem it essential?  
    3. **Battery in some cases**: Substituting surgeons without disclosure *is* battery if identity was material.  

  ---

  ### **Practical Resolutions**
  | **Case Type**               | **Validity Under Materiality Standard**          | **Why Not Battery**                          |  
  |-----------------------------|--------------------------------------------------|----------------------------------------------|  
  | **Placebo (clinical)**      | Valid if risks disclosed; purpose may be immaterial | Not a fundamental deviation                 |  
  | **Deception study**         | Invalid if deception concerns material risks/goals | Material feature misrepresented             |  
  | **Surgeon substitution**    | Invalid if identity material to patient          | Act doesn’t match consented description     |  
  | **Optimistic risk framing** | Valid if risks quantitatively accurate           | No material deception; mere framing is not fraud |

  ---

  ### **Conclusion**
  - **Reject Step (3)**: Replace it with a **materiality threshold** for vitiating consent.  
  - **Revise Counterfactual Test**: Use it to gauge *wrongness*, not validity. Validity depends on disclosure of material facts.  
  - **Accept Limited Battery**: In identity-deception cases, battery is the correct outcome—this avoids the absurdity of (6) while preserving moral intuitions.  

  This approach balances autonomy with practicality: not every lie kills consent, but deception about what *matters* does. Your ethics board can then focus on whether a feature is **material by default** (e.g., research participation, surgeon identity) or **context-dependent** (e.g., trivial protocol details).
