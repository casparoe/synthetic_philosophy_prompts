  We are designing an in-class activity to help students experience the embedding problem for expressivism. The core idea is to have students assign attitude markers (DISAPPROVE, ENDORSE, TOLERATE) to simple and then embedded normative sentences, and then test whether their assignments can validate certain argument forms in a way that is invariant across speakers with opposite attitudes.

  Key components:

  1. **Markers**: Three markers: DISAPPROVE (D), ENDORSE (E), TOLERATE (T). TOLERATE is defined as the marker for negation: when a sentence is negated, the embedded part gets TOLERATE.

  2. **Cards**: Each card will have an argument form written in a schematic way using placeholders for normative sentences (e.g., "If X is wrong, then Y is wrong") and markers to assign.

  3. **Roles**: Students work in pairs. Each pair gets a set of cards. In each pair, one student is assigned a "torn" role for a particular normative situation (e.g., about the council knocking down the playground) meaning they have no settled attitude. The other has a clear attitude (either DISAPPROVE or ENDORSE). They must assign markers to the embedded parts as per the rules.

  4. **Payoff**: Points are awarded for correctly validating argument forms in a way that is invariant (i.e., both players in a pair, even with opposite attitudes, must assign markers such that the argument form is either valid for both or invalid for both). If they fail to have the same verdict, they lose points.

