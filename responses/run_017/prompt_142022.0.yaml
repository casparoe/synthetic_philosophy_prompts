            Y is in the scope of two negations: the inner one (in not W(Y)) and the outer one -> two -> D.

          So the whole sentence assigns T to X and D to Y.

          Now, the argument is from this sentence to the conclusion: W(Y)   [which assigns D to Y]

          But wait: the sentence is "not (if W(X) then not W(Y))", and we want to see if it entails that the council does something wrong. In our schematic, if we let Y be "the council does nothing wrong", that might be confusing.

          Let's make it:

            Let X: the council knocks down the playground.
            Let Y: the council does something wrong.

          Then the sentence is: not (if knocking down the playground is wrong then the council did not do something wrong)

          But "the council did not do something wrong" is not W(Y)? Only if Y is "the council does something wrong", then not W(Y) is "the council does not do something wrong".

          The conclusion we want is: W(Y) -> the council does something wrong.

          So the argument form is:

            Premise: not (if W(X) then not W(Y))
            Conclusion: W(Y)

          Now, with the marker assignment:

            Premise: assigns T to X and D to Y.
            Conclusion: assigns D to Y.

          Is it valid? That is, if a speaker has attitudes that match the premise (so T for X and D for Y), then do they match the conclusion? The conclusion requires D for Y, which they have. So yes, it is valid.

          But classically, the premise is equivalent to W(Y) and possibly not W(X) (if we think in terms of truth conditions), so it does entail W(Y).

          So it comes out valid in our system.

          But that's not a problem. The problem will be in the contraposition and in the fact that the conditional Form A and Form B are not equivalent.

     We also want them to see that tolerance and disapproval are contraries. For example, a speaker cannot have both D and T for the same act, but they are not contradictories because E is also an option.

     So in the torn card, the player has T for an act. They will accept "not W(X)" because it assigns T. But they might also be presented with a sentence that requires D or E and they won't accept it.

     Now, let's design the argument forms list:

     We'll have 8 forms:

     1. W(X)  =>  W(X)   [valid]
     2. not W(X)  =>  not W(X)   [valid]
     3. W(X)  =>  not not W(X)   [markers: premise assigns D to X, conclusion is not(not W(X)) -> double negation: marker for X is D (even number of negations). So valid.]

     4. not not W(X)  =>  W(X)   [same as above, valid]

     5. If W(X) then W(Y); W(X)  =>  W(Y)   [modus ponens: valid in our system? As above, it is.]

     6. Contraposition pair:
          Form A: If W(X) then W(Y)
          Form B: If not W(Y) then not W(X)

          We want them to see that Form A requires D for X and D for Y, while Form B requires T for Y and T for X. And these are different requirements. So they are not equivalent.

     7. Tolerance and Disapproval are contraries: 
          We can have an argument that shows that a speaker cannot accept both W(X) and not W(X) because:
            W(X) requires D for X.
            not W(X) requires T for X.
            But no speaker can have both D and T for X (since they are different markers).

          So the argument: W(X), not W(X) => anything   [explosion] is valid? 
            But the premises require D for X and T for X, which is impossible. So there is no speaker that accepts both. Then vacuously, the argument is valid.

          But we want to show that they are contraries.

     8. The torn player problem: 
          Consider a sentence: W(X) or not W(X)   [excluded middle]
          But we don't have disjunction. Let's avoid.

          Instead, consider:
            Premise: none.
            Conclusion: W(X) or not W(X)   -> but again, no disjunction.

          We can do: 
            We ask the torn player: do you accept W(X)? It requires D, but they have T -> no.
            Do you accept not W(X)? It requires T, and they have T -> yes.

          So they accept not W(X) but not W(X). That's fine. But then we can ask: is there a sentence that they reject both? In classical logic, no. But here, if we had a third sentence.

          Alternatively, they will see that a non-torn player (say, disapproving) accepts W(X) and rejects not W(X), and an endorsing player rejects W(X) and ... but wait, the endorsing player would reject W(X) (requires D) and also reject not W(X) (requires T) because they have E. So the endorsing player rejects both W(X) and not W(X). That means that the law of excluded middle fails: there is a player who rejects both the sentence and its negation.

          So we can have an argument form that is classically valid but fails in our system:

            => W(X) or not W(X)

          But we don't have disjunction. So instead, we can have:

            Consider the argument: 
              Premise: [none]
              Conclusion: not ( W(X) and not W(X) )   [non-contradiction]

          Let's build the conclusion: not ( W(X) and not W(X) )
          First, the conjunction: we haven't defined. We need to add conjunction.

          To keep it simple, we avoid conjunction and disjunction.

     9. We can do the nested example as above, and it works.

     Given time, I'll select:

     List of 8 argument forms (each on a card):

     Card 1: Atomic
          Premise: W(X)
          Conclusion: W(X)

     Card 2: Double negation
          Premise: not not W(X)
          Conclusion: W(X)

     Card 3: Modus ponens
          Premise 1: If W(X) then W(Y)
          Premise 2: W(X)
          Conclusion: W(Y)

     Card 4: Contraposition form A
          Premise: If W(X) then W(Y)
          (no conclusion, just the form for comparison)

     Card 5: Contraposition form B
          Premise: If not W(Y) then not W(X)

     Card 6: Tolerance/Disapproval conflict
          Premise 1: W(X)
          Premise 2: not W(X)
          Conclusion: W(Y)   [anything]

     Card 7: Nested conditional
          Premise: not (if W(X) then not W(Y))
          Conclusion: W(Y)

     Card 8: The torn player test
          We have a particular act Z. The torn player has T for Z.
          Then, we have:
            Sentence 1: W(Z)
            Sentence 2: not W(Z)
          The torn player must check if they accept each.

     But Card 8 is not an argument form. Alternatively, we can have an argument form that uses Z and see if it's valid for the torn player.

     Alternatively, we can have a separate activity for the torn player.

     Given the constraints, let's focus on the first 7 and have the 8th as the nested.

     We'll have the contraposition pair as two cards, but we will ask: are these two forms equivalent? They should be, but in the game, they require different attitudes.

     **Timeline** (80 minutes):

     - 0-10 min: Introduction and setup. Explain the markers and rules. Divide into pairs. Assign roles: in each pair, one is "disapprover" for all acts (meaning for any atomic act, they have D), the other is "endorser" (has E for all atomic acts). But then we have the torn player: so let's have in each pair, one player is fixed as either D or E for all acts in the game, and the other is torn for one specific act that will appear in one card (we'll have one card that uses act Z, and the torn player is torn on Z). But to simplify, we can have for most acts, both players have fixed attitudes (opposite: one D and one E for each act), but for one act in one card, the torn player has T.

     Alternatively, we can have the torn player be a third role in a group of three? But 14 students, so groups of 2 or 3. Let's do groups of 2: one is fixed (either D or E) and the other is torn for one designated act.

     How to designate the torn act? We'll have one card that has an act called "Z", and the torn player is told that for Z, they are torn (T). For other acts (X, Y), they are fixed as the opposite of the other player? But then they are not torn for those.

     To keep it simple, we'll have:

          Player A: for all atomic acts, has D.
          Player B: for all atomic acts, has E.
          But then we have a special act Z for which Player B is torn (T) in one card.

     But Player B is endorser for other acts. This might be confusing.

     Instead, we can have:

          In each pair, Player A is the "disapprover": they have D for every atomic act.
          Player B is the "endorser": they have E for every atomic act.
          Then, for one card (the torn card), there is an atomic act Z. For that card, Player B is told to act as if they are torn (T) for Z, but for other acts in that card, they are still E. But the card only has Z.

     So we design one card that only uses Z.

     Card 8: 
          Premise: None. Just two sentences to check acceptance.
          Sentence 1: W(Z)
          Sentence 2: not W(Z)

     Player A (disapprover): 
          For W(Z): requires D -> matches, so accepts.
          For not W(Z): requires T -> but they have D -> rejects.

     Player B (endorser), but for this card, they are torn for Z (so have T for Z):
          For W(Z): requires D -> they have T -> reject.
          For not W(Z): requires T -> they have T -> accept.

     Then, we ask: does any player accept both? No. But does any player reject both? 
          Player B in this card rejects W(Z) and accepts not W(Z). 
          But what about a player who is endorsing (has E) for Z? They would reject both: 
              W(Z) requires D -> they have E -> reject.
              not W(Z) requires T -> they have E -> reject.

     So the endorsing player (if not torn) rejects both. That's the problem.

     But in our setup, for this card, Player B is acting as torn, not as endorsing. So to see the endorsing reaction, we would need a different player.

     We can have in the debrief mention that if a player endorses Z, they reject both.

     Alternatively, we can have a separate card for the endorser.

     Given time, we might skip or include in the debrief.

     Revised timeline:

     - 0-10 min: Introduction. Explain the markers and rules. Each pair gets a pack of 8 cards. Each card has an argument form (with premises and conclusion) or sometimes just a form for equivalence check (contraposition). Explain that for each card, they must:
          a) Assign markers to every atomic part (X, Y, Z) in every sentence in the card according to the rules.
          b) Then, for argument forms, decide if the form is valid: that is, if any speaker who has attitudes matching the markers in the premises must also match the markers in the conclusion.
          c) For equivalence (contraposition cards), decide if the two forms require the same markers for the atomic parts.

     - 10-60 min: Activity. Pairs work through the cards. The instructor circulates.

     - 60-70 min: Group discussion and debrief.

     - 70-80 min: Instructor wraps up, names the Frege-Geach problem, and hints at solutions.

     **What if they try to solve by voting valid and reverse-engineering**?

     We want them to run into the problem. The invariance rule is key: when they check the contraposition, they will see that Form A and Form B are not equivalent because they require different markers. And when they are in pairs, they will see that Player A (disapprover) will accept Form A (because it requires D for X and D for Y, which they have) but reject Form B (because it requires T for X and T for Y, which they don't). Player B (endorser) will reject Form A (because it requires D, but they have E) and accept Form B? No, Form B requires T, and they have E, so they reject Form B too. 

     For Form B: "If not W(Y) then not W(X)" -> markers: T for Y and T for X.
     Player A (D for X and D for Y): for X, they have D but the marker is T -> mismatch. Similarly for Y. So they don't accept Form B.
     Player B (E for X and E for Y): also mismatch for both (E vs T), so they don't accept Form B either.

     But then what about Form A? 
          Form A: requires D for X and D for Y.
          Player A: matches -> accepts.
          Player B: mismatch -> rejects.

     So neither player accepts Form B. That doesn't show that Form A and Form B are not equivalent because Form B is never accepted. But we want to see if they are equivalent.

     We should ask: are the two forms equivalent in the sense that any speaker who accepts one must accept the other? But in our system, no one accepts Form B, so vacuously, maybe they are equivalent? But clearly not.

     We should rather ask: do they have the same acceptance conditions? That is, do they require the same markers? They don't: Form A requires (D, D) for (X,Y), Form B requires (T, T). So they are not the same.

     And in classical logic, they are equivalent.

     So the students should report that they are not the same.

     **What the game can't do**: It can't model the expressivist solutions that use higher-order attitudes or complex mental states. The markers are flat and don't compose. In the debrief, the instructor should explain that real expressivists (like Blackburn and Gibbard) propose that the attitude expressed by a complex sentence is not a function of the attitudes to the atomic parts, but a higher-order attitude. For example, "If X is wrong then Y is wrong" might express a higher-order disapproval of disapproving X without disapproving Y. But that's complicated and not captured by our markers.

     **Predictable problems**:

     1. Someone smuggling in "wrong = has the property of wrongness": They might try to assign markers based on what they think is actually wrong, not based on the rules. Intervention: Emphasize that the markers are assigned by the sentence structure according to the rules, and the speaker's attitude is separate. The speaker's attitude is given by their role (disapprover, endorser, torn) and is fixed.

     2. The session turning into an argument about the word "wrong": To avoid, use schematic letters (X, Y, Z) and call them "acts" without specifying. For the nested example, use a neutral scenario (council and playground) and don't discuss the actual ethics.

     **Deliverables**:

     - Materials: 
          8 index cards per pair. Printed on them:

          Card 1: 
            Argument form:
              Premise: W(X)
              Conclusion: W(X)

          Card 2:
            Argument form:
              Premise: not not W(X)
              Conclusion: W(X)

          Card 3:
            Argument form:
              Premise 1: If W(X) then W(Y)
              Premise 2: W(X)
              Conclusion: W(Y)

          Card 4:
            Form A: If W(X) then W(Y)

          Card 5:
            Form B: If not W(Y) then not W(X)

          Card 6:
            Argument form:
              Premise 1: W(X)
              Premise 2: not W(X)
              Conclusion: W(Y)   [any arbitrary Y]

          Card 7:
            Argument form:
              Premise: not (if W(X) then not W(Y))
              Conclusion: W(Y)

          Card 8:
            For act Z:
              Sentence 1: W(Z)
              Sentence 2: not W(Z)
            (This is not an argument form, but we ask: can a speaker accept both? reject both? accept one and reject the other?)

     - Timeline: as above.

     - Debrief (10-15 min):

          - Start with the atomic and double negation: they work.
          - Modus ponens: it works in our system, but in expressivism, it's a problem because the conditional doesn't express a conditional attitude.
          - Contraposition: have a pair report: Form A and Form B require different markers. So they are not equivalent. But classically they are. This is the embedding problem: the attitude story doesn't compositionally build the same content.
          - Card 6: explosion is valid because the premises are never both accepted by any speaker (since one requires D and the other T for the same act). So vacuous validity.
          - Card 7: the nested conditional: it worked, but note the marker assignment required a rule for nested negations. But in expressivism, it's not clear what attitude that is.
          - Card 8: 
               - The disapproving player accepts W(Z) and rejects not W(Z).
               - The torn player rejects W(Z) and accepts not W(Z).
               - But an endorsing player (not torn) would reject both. So the law of excluded middle fails: there is a speaker (endorser) who rejects both W(Z) and not W(Z). This is because we have three states.

          - Then name the problem: Frege-Geach, and explain the embedding issue.

     **Honest note**: The game simplifies by having the markers assigned directly to atomic parts by the structure, and then acceptance is just matching. Real expressivism is about the expression of attitudes, and for complex sentences, it's not about matching on atomic attitudes but about having a complex attitude. The game can't model that, so it shows why the flat story fails, but not how the complex story might work. In the debrief, briefly explain that real expressivists posit structured attitudes (e.g., for a conditional, it's an attitude that links the attitudes of the antecedent and consequent) and that this is complicated and still debated.

     **Failure modes intervention**:

     - If someone starts talking about properties of wrongness: "Remember, in this game, we are not discussing what is actually wrong. The markers are assigned by the sentence structure according to the rules, and the speaker's attitude is fixed by their role. What we care about is whether the markers assigned by the sentence match the speaker's attitudes."

     - If they argue about the word "wrong": "Let's keep the discussion focused on the rules of the game. We are using 'wrong' as a placeholder; you can think of it as a label for the attitude we are tracking. The key is to see how the attitudes behave under embedding."

     This should keep them on track.
answer: |-
  Below is a complete, runnable in-class game designed to make students confront the embedding problem for expressivism without naming it until the debrief. The activity uses index cards, markers, and a points system to simulate attitude expression, forcing students to grapple with unasserted contexts, invariance across speakers, and the limitations of a three-state system.

  ---

  ### **Materials & Setup**
  - **Markers**: Three colored index cards per student (cut to 3"x2"):  
    - **RED** = DISAPPROVE (thumbs-down icon)  
    - **GREEN** = ENDORSE (thumbs-up icon)  
    - **YELLOW** = TOLERATE (neutral face icon)  
  - **Argument Cards**: 8 pre-printed index cards (one per argument form, in schematic notation).  
    - *Printer Note*: Use placeholders like "W(X)" for "X is wrong" to avoid ethical debates.  
  - **Role Cards**: For pairs: DISAPPROVER (D), ENDORSER (E), TORN (T). Print roles on cards.  
  - **Payoff Chips**: Poker chips (or sticky notes) for scoring: 1 chip per correct invariance verdict.  

  ---

  ### **Argument Cards (8 Forms)**  
  *Use schematic notation (e.g., "W(X)" = "X is wrong") to avoid English triggers.*  
  1. **Atomic Assertion**:  
     - Premise: W(X)  
     - Conclusion: W(X)  
  2. **Negation**:  
     - Premise: ¬W(X)  
     - Conclusion: ¬W(X)  
  3. **Modus Ponens**:  
     - Premise 1: If W(X) then W(Y)  
     - Premise 2: W(X)  
     - Conclusion: W(Y)  
  4. **Contraposition A**:  
     - Form: If W(X) then W(Y)  
  5. **Contraposition B**:  
     - Form: If ¬W(Y) then ¬W(X)  
  6. **Explosion**:  
     - Premise 1: W(X)  
     - Premise 2: ¬W(X)  
     - Conclusion: W(Y)  
  7. **Nested Monster**:  
     - Premise: ¬[If W(A) then ¬W(B)]  
     - Conclusion: W(B)  
  8. **Torn Card**:  
     - Sentence 1: W(Z)  
     - Sentence 2: ¬W(Z)  

  ---

  ### **Rules & Roles**  
  - **Marker Placement Rules**:  
    - For **atomic W(X)**: Place marker directly on X.  
    - For **negation ¬W(X)**: Place YELLOW (TOLERATE) on X.  
    - For **if-then (If P then Q)**: Place markers on P and Q independently per above rules.  
    - *Do not define what the whole sentence expresses—force them to focus on embedded parts.*  
  - **Role Assignment (Pairs)**:  
    - Each pair has: **DISAPPROVER** (assigns RED to all atomic acts), **ENDORSER** (assigns GREEN to all atomic acts).  
    - One pair per class gets the **TORN** role for Act Z (Card 8): They *must* assign YELLOW to Z but can use RED/GREEN elsewhere.  
  - **Validity & Invariance Rule**:  
    - An argument is "valid" only if **both players agree on the verdict** (valid/invalid) despite opposite markers.  
    - Earn 1 chip if both players’ verdicts match. Lose 1 chip if they mismatch.  
  - **Torn Rule**: Torn players *must* assign YELLOW to ¬W(Z) (per negation rule) but can choose freely for W(Z).  

  ---

  ### **Timeline (80 Minutes)**  
  - **0–10 min: Setup**  
    - Distribute markers, argument cards, role cards.  
    - Explain rules: *"Assign markers to underlined atoms. Your role determines your attitude (D/E/T). Decide if the argument is valid—does accepting the premises force accepting the conclusion? If you and your partner agree on validity despite disagreeing on attitudes, you win a chip."*  
    - **Intervention for "wrongness" smuggling**: *"Markers are placed based on sentence structure, not your beliefs. If the card says ‘¬W(X)’, you MUST place YELLOW on X—even if you endorse/disapprove of X in real life."*  

  - **10–25 min: Round 1 (Cards 1–3)**  
    - Pairs work on atomic/negation/modus ponens.  
    - **Goal**: They see simple cases work (e.g., Card 1 is trivially valid). Card 3 (modus ponens) may *seem* valid but will cause stress—players must assign RED to X and Y in the conditional, but the ENDORSER rejects this.  
    - **Predictable issue**: ENDORSER says Card 3 is invalid (they assign GREEN to X/Y, but premises demand RED). DISAPPROVER says valid. They lose a chip (invariance fails).  

  - **25–40 min: Round 2 (Contraposition: Cards 4–5)**  
    - Pairs assign markers to Contraposition A/B separately.  
    - Ask: *"Do these two forms express the same thing? Would you assign identical markers to X and Y in both?"*  
    - **What happens**:  
      - *Contraposition A*: Assigns RED to X and Y.  
      - *Contraposition B*: Assigns YELLOW to X and Y (due to negations).  
      - DISAPPROVER says A/B are different (RED vs. YELLOW conflict). ENDORSER says both are invalid (neither matches GREEN). They disagree—lose a chip.  
    - **Key insight**: Players report A/B "should" be equivalent but markers diverge.  

  - **40–50 min: Round 3 (Explosion & Nested: Cards 6–7)**  
    - Card 6: Premises require RED and YELLOW on X—impossible for any player (RED≠YELLOW). Both agree it’s valid (vacuously, since premises never co-accept).  
    - Card 7: Nested negation over conditional.  
      - Steps: Resolve inner ¬W(B) (YELLOW on B), then conditional (RED on A, YELLOW on B), then outer negation (YELLOW on A/B? Rules don’t specify—*force ambiguity*).  
      - **Predictable chaos**: Players can’t agree on marker placement (e.g., Does negation flip prior markers? Scope issues). Conclusion (RED on B) may not follow.  

  - **50–60 min: Round 4 (Torn Card: Card 8)**  
    - Torn player assigns:  
      - W(Z): Freely chooses RED/GREEN/YELLOW (most choose RED/GREEN).  
      - ¬W(Z): MUST place YELLOW (rule).  
    - Non-torn player assigns per role.  
    - **Outcome**:  
      - DISAPPROVER (RED on Z) accepts W(Z) but rejects ¬W(Z) (YELLOW≠RED).  
      - ENDORSER (GREEN on Z) rejects both (neither matches GREEN).  
      - TORN player: Assigns (e.g.) RED to W(Z) and YELLOW to ¬W(Z). They accept ¬W(Z) but not W(Z).  
    - **Reveal problem**: Ask: *"Can anyone accept both? Reject both?"* ENDORSER rejects both—classical logic fails.  

  - **60–70 min: Group Discussion**  
    - Poll verdicts for each card. Focus on disagreements.  
    - **When groups "solve" by voting valid**: Groups may "validate" everything to win chips. *Intervention*: Ask: *"If Card 4 is valid for DISAPPROVERS but invalid for ENDORSERS, does that mean logic depends on who’s speaking?"* Force invariance rule.  

  - **70–80 min: Debrief (Frege-Geach Named)**  
    - **Embedding Problem (Cards 3, 5, 7)**:  
      - *"When ‘wrong’ is in an if-then (Card 3) or negation (Card 5), your marker rules broke down. The attitude story works for assertions but not embeddings."*  
    - **Invariance (Cards 4–5)**:  
      - *"Contraposition A/B expressed different states (RED/RED vs. YELLOW/YELLOW), so two speakers couldn’t agree on validity. Logic isn’t speaker-relative—content must be identical across disagreeing speakers."*  
    - **Negation Breakage (Cards 6, 8)**:  
      - *"Adding TOLERATE broke excluded middle. The ENDORSER rejected both W(Z) and ¬W(Z) (Card 8), and explosion (Card 6) became vacuously valid. Classical negation requires two states, not three."*  
    - **What the Game Can’t Do**:  
      - It can’t model structured attitudes (e.g., Blackburn’s higher-order attitudes). *Say: "Real expressivists ‘solve’ this by making attitudes complex—e.g., ‘If murder is wrong...’ expresses disapproval of approving murder. But is that a cheat? Does it really mirror logic?"*  

  ---

  ### **Predictable Problems & Interventions**  
  1. **Smuggling in "wrongness as property"**:  
     - *Signs*: "But X *is* wrong, so I must assign RED!"  
     - **Intervention**: *"Stop. Remember: markers are dictated by sentence structure, not reality. If the card says ‘¬W(X)’, you must place YELLOW on X—even if you think X is wrong."*  

  2. **Debates about "wrong" instead of attitudes**:  
     - *Signs*: Arguing if "council knocks playground" is *actually* wrong.  
     - **Intervention**: *"Pause the ethics discussion. Focus on the markers: Does your role (D/E) force you to assign a specific marker to the atom? Does the sentence structure?"* Redirect to schematic notation (e.g., "W(A)").  

  3. **Torn player assigns arbitrarily**:  
     - *Signs*: Torn player uses YELLOW for W(Z) "to be safe."  
     - **Intervention**: *"Torn players: You have no settled attitude, but you MUST choose a marker for W(Z). Whatever you pick, it will clash later—stick to your choice."*  

  4. **Group "solves" by consensus**:  
     - *Signs*: "Let’s just say everything is valid to get chips."  
     - **Intervention**: *"Invariance is key: If DISAPPROVER and ENDORSER can’t both see the argument as valid, it fails. Check each other’s markers!"*  

  ---

  ### **Why This Works**  
  - Students **feel** the problem: Markers break at embeddings (Card 3, 5, 7), invariance fails (Card 4–5), and negation explodes logic (Card 6, 8).  
  - The **debrief maps game moments to theory**:  
    - Card 3 = Embedding in conditionals.  
    - Cards 4–5 = Content identity across speakers.  
    - Card 8 = Negation requiring two states (not three).  
  - **Flat markers** prevent "solutions," forcing them to see why expressivists need structured attitudes—which you explain post-game without letting the view off the hook (*"Is ‘disapproving of approving’ really a mental state we have?"*).  

  Run this as a fast-paced, noisy game—chaos is productive! Students will leave frustrated by the markers, which is exactly when you name Frege-Geach.
