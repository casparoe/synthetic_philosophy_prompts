prompt: |-
  I write political fiction, and the novel I am finishing turns on a body of my own invention: the Board of Charters, which drafts a constitution for each province as it accedes to the Union of Verraine. A good part of the book is the Board arguing with itself in closed session, and I want those arguments to be real ones — the kind a comparative-institutionalist could read with a pencil without laughing. I have read the standard case for fusing legislative and executive power and the standard case for separating them, and I do not need either rehearsed back to me, nor do I want authorities, reading lists, or citations. What I need is this: given the five settlements my Board reached before the story opens, what has it already committed itself to, and what follows for the sixth case, which is the one I am actually writing.

  The precedents, as my narrator summarizes them:

  **Sable.** Six parties in the assembly, none above a quarter of the seats, no pair able to govern without a third, labels traded between elections, two decades of cabinets lasting under a year. The Board prescribed a parliamentary charter: the assembly elects the premier, and it may unseat a premier only by simultaneously naming a successor (the clerks call this the substitution rule). A proposal for a directly elected governor was rejected without discussion.

  **Ondres.** Two disciplined programmatic parties alternating in office, a career civil service, an audit office that had actually prosecuted a former minister, and a public that in the Board's own hearings ranked delivery of legislation above being consulted. The Board prescribed a directly elected governor: four-year fixed term, cabinet drawn from outside the assembly, no ordinance power, a narrow emergency power that lapses unless the assembly affirmatively approves it within thirty days, select committees with subpoena power, and removal only by impeachment on a two-thirds vote for defined offences.

  **Kalva.** Two coups in thirty years, weak personalist parties, and a strong popular demand for a directly elected head of province even among those who feared the generals. The Board prescribed a semi-presidential charter: a directly elected president, fixed term, confined to external relations and defence, unable to dissolve the assembly, who appoints a premier holding assembly confidence and answerable for everything domestic. The president is removable by a two-thirds assembly vote followed by a provincial referendum; the premier by ordinary no-confidence under the substitution rule.

  **Upper Aule.** Small, homogeneous, a long tradition of initiative and referendum, low trust in parties. The Board rejected a proposal for a directly elected mayor-governor with power to legislate by ordinance and to dissolve the council. It prescribed instead a five-member executive council elected at large, chair rotating annually, no dissolution, any ordinance suspendable by popular initiative within ninety days, and any single member recallable by petition of a fixed share of voters.

  **The Verrine Coast.** Three regions, one of them a secessionist minority with about thirty per cent of the population; every party is regional, none provincial. The Board prescribed a parliamentary premier, but required that confidence be withdrawable only by a majority that also carries majorities in each of the three regional delegations, and it refused a directly elected governor on the ground that a province-wide plurality would simply install the largest region's candidate permanently.

  The case before the Board in my chapter is the province of **Marche**. Its assembly is elected by proportional representation with a low threshold and currently contains four parties, the largest near thirty-five per cent, internally disciplined but with no stable majority and no tendency to coalesce into two blocs. Administration is clean, the audit office is independent, there is no history of coups and no regional cleavage worth naming, and roughly seven in ten residents tell pollsters they want to elect their governor directly. Uniquely among the provinces, a large share of public money — something like a fifth of the provincial budget — comes not from taxation but from fees collected by a river-basin authority whose board the governor appoints.

  The charter proposed to the Board for Marche would create a directly elected governor on a fixed four-year term, without power to dissolve the assembly, with a cabinet drawn from outside it, and would add a device new to the federation: the confidence-locked mandate. Once in any twelve-month period, the assembly may, by a single majority vote that simultaneously names a successor, transfer the remainder of a governor's term to that successor, no election being held. The basin authority's revenues would require annual assembly authorization, though its board would remain the governor's appointment. A clerk's note observes that no precedent pairs direct election with confidence-based removal: in Sable and Kalva the substitution rule attaches to a premier the voters never chose directly, and in Ondres the directly elected governor can be removed only by impeachment.

  What I would like from you:

  1. Three or four rules the Board might be running that fit all five precedents — stated sharply enough that they come apart on Marche. I can see at least one turning on whether every executive must be removable by somebody other than the electorate, one turning on what the party system has to look like before a single-person direct mandate is safe, and one turning on what powers such an office may hold; if there are others, or if mine are badly drawn, say so.

  2. What each rule predicts about the Marche proposal as drafted, and about each of its separable features: direct election itself, removal with a named successor, the once-a-year restriction, the absence of dissolution, and the fee-funded authority.

  3. Your best guess at the ruling, the precedent the Board would cite as its closest analog, and the precedent it would be wrong to cite because it is only superficially closest. Give me the reasoning the minute would record and, separately, the dissent — the scene needs both, and the dissent has to be an argument rather than an atmosphere.

  4. If the five settlements genuinely underdetermine the sixth, say so plainly, and tell me what principle the Board would be adopting with each option, in the language a clerk would put in the minute rather than in the language of political theory. In particular: is there any amendment — to the removal device, to who may be named as successor, to the basin authority — that would make approval consistent where pure rejection is otherwise called for, and what exactly would the amendment be buying?

  5. One altered fact about Marche that would force the competing rules to part company decisively, in case I want the Board to face it in a later chapter.
reasoning: |-
  Okay, let me tackle this political fiction worldbuilding challenge. The user needs help designing constitutional principles that feel professionally credible for their fictional Board of Charters. 

  First, I need to internalize the five existing precedents:
  - Sable: Fragmented parliament with substitution rule
  - Ondres: Strong presidential system with checks
  - Kalva: Semi-presidential hybrid for unstable context
  - Upper Aule: Collective executive for homogeneous society
  - Verrine Coast: Parliament with regional vetoes

  For Marche, the key tension is between:
  - Strong public demand for direct election (70%)
  - No clear majority party in assembly
  - Unique river-basin funding mechanism
  - Novel "confidence-locked mandate" removal device

  The user wants sharp competing principles that fit all precedents but diverge on Marche. Let me brainstorm three:
  1. **Principle of Accountability Paths** - Focuses on who can remove executives
  2. **Principle of Mandate Clarity** - Requires predictable coalitions for direct elections
  3. **Principle of Power Containment** - Restricts direct mandates from controlling non-electoral resources

  For each principle, I'll map predictions about Marche's proposal:
  - Accountability Paths would reject the removal mechanism as unprecedented mixing
  - Mandate Clarity would oppose direct election given unstable party system
  - Power Containment would object to governor controlling basin funds

  The ruling should cite Kalva as closest analog (fixed-term direct election) but distinguish it because Kalva's president lacks domestic power. Verrine Coast would be wrong analog despite similar removal concern because it's parliamentary. 

  Possible amendments:
  - Making basin funds legislative-controlled
  - Requiring supermajority for removal
  - Limiting successor candidates

  If changing Marche's facts for future tension:
  - Add regional cleavages to trigger Mandate Clarity concerns
  - Make parties undisciplined to undermine substitution rule
  - Give basin authority taxation powers to exacerbate containment issues

  The dissent should focus on honoring public preference while trusting substitution rule's stabilizing effect. Need to keep reasoning concrete and institutional - no theoretical jargon.
answer: |-
  Here are the rules, predictions, ruling, and amendments constructed from your five precedents, avoiding theoretical abstractions and focusing on institutional patterns. The Board operates on implicit, case-specific principles that must now confront Marche's novel features.

  ---

  ### **1. Three Rules Implicit in Precedents**
  *(Stated as operational principles a clerk would enforce)*

  | Rule Name | Core Principle | How Precedents Fit | Where Rules Diverge on Marche |
  |-----------|----------------|-------------------|------------------------------|
  | **Rule 1: Removal Symmetry** | "A directly elected executive may only be removed by a supermajority or referendum; an assembly-elected executive may be removed by majority with successor." | • Sable: Assembly-elected premier removed by substitution (majority + successor)<br>• Ondres: Direct governor removed only by impeachment (2/3)<br>• Kalva: Direct president removed by 2/3 + referendum; premier by substitution | Direct election + substitution removal violates symmetry. Ondres/Kalva forbid easy removal of direct mandates; Sable allows it only for non-direct. |
  | **Rule 2: Coalition Threshold** | "Direct election requires pre-existing majority coalitions *or* non-partisan administration." | • Ondres: Two stable parties → direct election<br>• Kalva: Coup risk overrode party weakness → direct election<br>• Upper Aule: No parties → collective non-partisan body<br>• Verrine Coast: No coalitions → parliamentary with regional checks | Marche has no stable coalitions (like Sable/Verrine) but clean administration. Does "non-partisan administration" suffice without coalitions? |
  | **Rule 3: Resource Control** | "Non-tax revenue sources must be legislatively appropriated if tied to executive power." | • Ondres: Taxes → governor lacks ordinance power<br>• Upper Aule: Fees → initiatives can suspend ordinances<br>• Kalva: Defense (non-fiscal) → president controls it | Basin fees (non-tax, 20% of budget) controlled by governor-appointed board. Precedents require legislative checks on non-tax funds. |

  ---

  ### **2. Predictions for Marche's Proposal**
  *(Per rule, on each feature)*

  | Feature | Removal Symmetry | Coalition Threshold | Resource Control |
  |---------|------------------|---------------------|-----------------|
  | **Direct election** | Rejected: Mixes direct mandate with assembly removal (violates Ondres/Kalva) | Rejected: No majority coalitions; admin clean but parties polarized (like Sable, not Ondres) | Neutral: Direct election itself irrelevant to funds |
  | **Removal w/ named successor** | Rejected: Substitution is for *assembly-chosen* executives (Sable), not direct ones | Neutral: Substitution stabilizes but doesn't create coalitions | Neutral: Removal method irrelevant to funds |
  | **Once-a-year removal limit** | Irrelevant: Core flaw is *any* substitution removal of direct mandate | Weak support: Limits instability but doesn’t solve lack of coalitions | Irrelevant | 
  | **No dissolution power** | Supported: Aligns with Ondres/Kalva (no unilateral dissolution) | Supported: Prevents governor from forcing new elections in fragmented system | Irrelevant |
  | **Basin fees controlled by governor** | Rejected: Direct mandate + control of non-tax revenue → excessive power | Rejected: Funds amplify governor’s power without coalition constraint | Rejected: Fees lack annual *appropriation* (cf. Ondres audit office; Upper Aule suspensions) |

  ---

  ### **3. Ruling & Dissent**
  **Majority Ruling (Cites Kalva):**  
  *"Reject the proposal. Direct election with substitution removal merges incompatible precedents: Kalva shows direct mandates (president) must be shielded from assembly removal except by high thresholds (2/3 + referendum), while substitution (as in Sable) suits only assembly-made executives. The basin fees, being non-tax revenue controlled by the governor, require full legislative appropriation (per Ondres’ audit controls and Upper Aule’s suspensive initiatives), not mere annual authorization. Amendment: Adopt Kalva’s model—directly elected governor with narrow powers (e.g., basin board appointments only), plus a premier subject to substitution rule handling administration."*  
  **Closest Analog:** Kalva (direct election + fixed term + no dissolution).  
  **Superficial Analog (Wrong):** Sable (substitution rule alone ignores direct election conflict).  

  **Dissent (Cites Ondres & Verrine Coast):**  
  *"The proposal adapts Ondres’ direct election to Marche’s instability by adding substitution removal—a stabilizing tool from Sable. Public demand for direct election (70%) is higher than in Kalva and should prevail absent coup risks. The once-a-year limit prevents chaos, and Verrine Coast proves substitution can be modified for local needs (regional vetos). Basin fees are already subject to annual authorization; this matches Ondres’ audit controls. Rejection over-fetishizes symmetry: the substitution rule *is* the check on power, making impeachment unnecessary."*  

  ---

  ### **4. Underdetermination & Amendments**
  **Yes, the precedents underdetermine Marche.** No rule *forces* one outcome. The Board must choose between:  
  - **Principle A (Majority):** "Direct mandates require removal safeguards."  
  - **Principle B (Dissent):** "Substitution removal stabilizes direct mandates if constrained."  

  **Amendments to Secure Approval:**  
  - **Replace substitution removal with impeachment (2/3 vote)** → Satisfies Removal Symmetry. *Cost:* Loses stability tool.  
  - **Require basin fees to be legislatively appropriated *before* spending** (not just authorized) → Satisfies Resource Control. *Cost:* Reduces governor’s flexibility.  
  - **Allow direct election only if substitution successor is pre-approved** (e.g., governor’s running mate) → Blurs mandate clarity but addresses instability. *Cost:* Creates dual legitimacy.  

  **What Amendments Buy:**  
  - Impeachment amendment buys *procedural legitimacy* (aligning with Ondres/Kalva).  
  - Fee appropriation buys *fiscal accountability* (preventing resource autonomy).  

  ---

  ### **5. Altered Fact to Force Rules Apart**
  **Change:** *"Marche’s largest party splinters into three personalist factions after the governor’s election."*  
  - **Removal Symmetry:** Strengthens rejection—substitution removal in a fragmented assembly invites coups (echoing Kalva’s instability).  
  - **Coalition Threshold:** Strengthens rejection—no coalitions exist, making direct election dangerous.  
  - **Resource Control:** Becomes critical—governor could use basin funds to buy factions (cf. Kalva’s generals).  
  **Result:** Rules now *unanimously* reject the proposal but for different reasons. Forces Board to debate whether instability requires parliamentary redesign (Sable) or stronger safeguards (Kalva).  

  ---

  ### **Why This Works for Your Scene**  
  - The **rules** emerge organically from precedents (e.g., Removal Symmetry extrapolates from Ondres/Kalva vs. Sable).  
  - The **dissent** is argumentative: it contests precedent application, not theory.  
  - **Marche’s novelty** (direct election + substitution) forces a choice between principles, not rote matching.  
  - **Amendments** are politically fraught (e.g., "pre-approved successor" implies VP-like role, altering executive structure).  
  - The **altered fact** creates future tension by weaponizing institutional ambiguity.  

  This fits a "comparative-institutionalist" debate: clerks would argue over *which precedent controls*, not abstract ideals. The Board’s ruling turns on whether Marche’s substitution device is an innovative hybrid or a category error.
