  Now, the requirements. The theory must address key cases: multiple powers could have stopped the war, governments pushing allies, public enthusiasm turning to conscription. It needs to distinguish between causing, foreseeing, choosing, and alternatives. It should separate the government from the state and the people. Blame shouldn’t be a zero-sum game. Also, it shouldn’t depend on whose archives survived.

