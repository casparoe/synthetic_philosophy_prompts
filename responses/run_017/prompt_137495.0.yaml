  The most powerful requirement is probably the counterfactual test. If you remove a country's actions, would the war still happen? That might kill the "everyone sleepwalked" theory because specific actions, like Germany's blank check to Austria, were decisive. But then, could France or Russia have backed down? That requirement forces looking at each actor's role.

  Satisfying all requirements might leave little for descendants in terms of assigning blame. Instead, it could focus on lessons about decision-making, alliances, or militarism. "Germany started it" might make descendants defensive, whereas discussing systemic factors could be more constructive.

  Evaluating the three theories: The Germany-centric view fails on multiple requirements, like ignoring other actors and collapsing distinctions. The sleepwalking theory avoids national blame but might downplay agency. The systemic view (arms races, empires) handles structural issues but ignores individual choices. None perfectly meet all criteria.

