prompt: |-
  I write novels and I've been chewing on the fight about probability in the many-worlds picture — if every outcome of a measurement really happens on some branch, then what does it mean to say the spin comes out up with probability one third, and why should that number be the squared amplitude (the Born rule, I think it's called) rather than just a headcount of branches? I can't read the formalism, so please do it in the vocabulary I actually use. Heres my vocabulary, so you know where Im fluent: a book that forks at every decision point into every possible continuation, all forks equally written and equally real; the share of a storyline, meaning how much prose or attention I give it, which I set however I like and which nobody inside the book is told; characters who get copied into many storylines at once, can wonder which chapter theyre in now, but never meet their other copies; and the gap between what a reader experiences and what a character experiences. My own version, which may or may not be the same problem: my manuscript forks at every line of dialogue, each fork gets a share, and I want to know what a character inside should expect. If every storyline is written, isn't expectation just the character wondering which copy they are — and why on earth should the answer track my share, which is only how much paper I spent on them? So: translate the main moves people actually make about this into my terms — the move that says you should bet as if the weights were probabilities, the move that says you are simply uncertain which branch you are on so count them, the worry about branches whose weight doesn't correspond to anything you'd care about, and the flat suspicion that the whole question is ill-posed — and then give me the residue report. Give me a table, one row per move, with these columns: move | in_my_terms (the translation, using forking, share, copies and chapters, not equations) | what_i_had_to_fudge | what_wont_translate | residue_is (either my_vocabulary_is_missing_something or the_move_was_less_clear_than_it_looks). After the table, two sentences max on whether my share is a real analogy for amplitude or a novelist's red herring, and don't explain any physics I didn't ask about.
reasoning: |-
  We are going to translate several moves (arguments) about the Born rule in the many-worlds interpretation into the novelist's vocabulary. The key elements of the vocabulary are:

   - **Forking**: At every decision point (like a quantum measurement), the book splits into multiple branches, each representing an outcome. All branches are equally written and equally real.
   - **Share**: The fraction of the manuscript (or attention) devoted to a particular branch. The author sets this arbitrarily, and the characters are not told about it.
   - **Copies**: When the book forks, the character is copied into each branch. Each copy experiences only their own branch and wonders which branch they are in (but cannot meet other copies).
   - **Gap**: The difference between the reader's experience (who sees the whole book with all branches and the assigned shares) and the character's experience (who only experiences one branch).

   The problem: Since every outcome happens in some branch, why should a character expect an outcome with a probability given by the squared amplitude (Born rule) and not just by the number of branches? And why should that probability correspond to the "share" (which is arbitrary) rather than a headcount?

   We consider several moves (arguments) that have been made to address this. For each, we provide:

     move: the name or a brief description of the argument.
     in_my_terms: the translation using the novelist's vocabulary.
     what_i_had_to_fudge: where the analogy doesn't perfectly hold and we had to adjust.
     what_wont_translate: aspects of the physics that don't have a counterpart in the story vocabulary.
     residue_is: either 'my_vocabulary_is_missing_something' or 'the_move_was_less_clear_than_it_looks'

   After the table, we give two sentences on whether the share is a real analogy for amplitude.

   Let's make the table:

   1. Move: The decision-theoretic argument (David Deutsch, David Wallace) - betting argument.

      In_my_terms: 
        Suppose a character is about to experience a forking event (e.g., a spin measurement with two outcomes: up and down). Before the fork, the character is offered a bet that will pay off in all future branches. The argument says that the character should value the bet according to the shares (not the number of branches) because, over many such bets in the story, the total winnings for the character (across all copies) will be maximized by using the shares as probabilities. However, note that the character only experiences one branch, but the bet is designed so that it is placed before the split and the outcome is paid in the branch the copy finds itself in. The argument claims that the character, being rational, will use the shares to weight the possible outcomes.

      What_i_had_to_fudge:
        In the physics, the branching is not arbitrary and the amplitude-squared rule is fundamental. In the story, the share is arbitrary and set by the author. Also, the argument in physics relies on the mathematical structure of quantum mechanics (interference, unitarity) to derive the Born rule, which we haven't captured. We are just assuming that the character cares about the overall success across the multiverse (which they don't experience) or that they are forced by rationality to use the shares.

      What_wont_translate:
        The mathematical derivation from quantum mechanics that shows that if you don't use the Born rule, you can be exploited in a series of bets (using the fact that quantum states can be transformed in ways that would lead to inconsistent decisions without the Born rule). The story doesn't have an analog of the complex amplitudes and interference.

      Residue_is: my_vocabulary_is_missing_something (because the story doesn't capture the quantum structure that forces the share to be amplitude squared)

   2. Move: Counting branches (naive branch counting)

      In_my_terms:
        The character thinks: after the fork, I will be one of the copies. If there are more branches for outcome A than outcome B, then I am more likely to find myself in A. So I should count the branches and assign equal probability to each branch.

      What_i_had_to_fudge:
        In quantum mechanics, the number of branches is not well-defined. A measurement might have two outcomes with unequal amplitudes, and we don't split into an integer number of branches proportional to the amplitude. We just have two branches with different weights. In the story, we can have two branches with different shares (e.g., 1/3 and 2/3 of the manuscript) but the same number of copies. The naive branch counting would ignore the share and just count the branches (which are two) and say each outcome has 1/2 probability. This contradicts the Born rule.

      What_wont_translate:
        The quantum mechanical fact that branches are not discrete and countable in the way that the story implies. The branching is continuous and the "number" of branches is not defined; instead, the measure comes from the amplitude.

      Residue_is: the_move_was_less_clear_than_it_looks (because the counting move is actually not valid in the many-worlds interpretation as it stands, so we are showing why it fails)

   3. Move: The worry about branches with negligible weight

      In_my_terms:
        Suppose there is a branch with a very small share, say one sentence in a million-page book. A character in that branch exists and experiences the outcome, but the share is tiny. The worry is: why should the character before the fork care about that branch? After all, they are almost certain (in some sense) to find themselves in a branch with a large share? But note, the character doesn't know which branch they will be in. The argument then is that the share should be used as the probability because it reflects the "measure" of existence.

      What_i_had_to_fudge:
        In the story, the share is arbitrary and set by the author. In physics, the amplitude is fixed by the laws. Also, the character might not care about the share because they will exist in a branch regardless. The worry is that the branch with negligible weight is still real and the character might end up there. But the argument is that the character should assign a low probability to that branch because of the low share.

      What_wont_translate:
        The physical principle that the amplitude-squared is the natural measure (arising from the Hilbert space norm) that cannot be arbitrarily changed. The story's share is arbitrary.

      Residue_is: my_vocabulary_is_missing_something (because the share is arbitrary but the amplitude is not)

   4. Move: The whole question is ill-posed (the "epistemic" move)

      In_my_terms:
        The character, before the fork, is uncertain about which branch they will experience. But after the fork, there are multiple copies, each in a branch. There is no fact about "which branch they will be in" because they will be in all of them (as copies). Therefore, it doesn't make sense to assign probabilities. The only thing that matters is the share, which is the author's device to allocate attention, but it doesn't correspond to anything the character should believe. The character should just expect to experience each branch with the same intensity? (But that doesn't make sense because the character only experiences one.) So the move says: the question of probability is meaningless in the many-worlds picture.

      What_i_had_to_fudge:
        We have to ignore that in quantum mechanics we do use probabilities and they are confirmed by experiment. The move is controversial because it seems to deny that quantum mechanics makes probabilistic predictions.

      What_wont_translate:
        The success of the Born rule in predicting experimental frequencies. In the story, the author could set the share arbitrarily and the character might observe relative frequencies that do not match the share. But in physics, the squared amplitude does match the frequencies.

      Residue_is: the_move_was_less_clear_than_it_looks (because it doesn't account for the empirical fact that we observe frequencies matching the Born rule)

   Now, the table:

  | move | in_my_terms | what_i_had_to_fudge | what_wont_translate | residue_is |
  |------|-------------|----------------------|---------------------|------------|
  | decision-theoretic (betting) | The character should bet using the shares because, over many bets, the total winnings (across all branches) are maximized by using shares as probabilities. | We assume the character cares about the multiverse-wide outcome, which they don't experience. Also, the share is arbitrary in the story but the amplitude is fixed. | The quantum structure (interference, unitarity) that forces the Born rule. | my_vocabulary_is_missing_something |
  | counting branches | The character thinks: more branches mean more copies, so I am more likely to be in a branch with many copies. | In quantum mechanics, the number of branches isn't defined; the amplitude matters. In the story, we can have two branches with different shares and the same number of copies. | The continuous nature of branching and the lack of a well-defined branch count. | the_move_was_less_clear_than_it_looks |
  | worry about negligible branches | Why care about a branch with a tiny share? The character should assign low probability to it because of the low share. | The share is arbitrary; in physics the amplitude is fundamental. Also, the character will exist in every branch. | The Hilbert space norm as the natural measure. | my_vocabulary_is_missing_something |
  | ill-posed question | The character will be in every branch as a copy, so there's no uncertainty and no probability. The share is just the author's device. | We ignore that quantum mechanics requires probabilistic predictions that match experiments. | The empirical success of the Born rule. | the_move_was_less_clear_than_it_looks |

   Finally, two sentences on whether the share is a real analogy for amplitude:

     The share is a partial analogy for amplitude because it provides a measure over branches that can be used in decision-making. However, it is a red herring in that the share is arbitrary and set by the author, whereas the amplitude is fixed by the laws of physics and has a mathematical structure (including interference) that the share lacks.
answer: |-
  ### Translation of Moves into Novelist's Vocabulary

  | move | in_my_terms | what_i_had_to_fudge | what_wont_translate | residue_is |
  |------|-------------|----------------------|---------------------|------------|
  | **Betting move** (rational agents weight by Born rule) | A character places a bet *before* a forking event (e.g., on spin outcome). They should wager using the **share weights** (e.g., 1/3 vs. 2/3) because, over many forks, their **copies' collective winnings** would dwindle if they ignored shares. | Fudged "collective winnings" — a character only experiences *one* chapter, so caring about "all copies" feels alien. Physics ties this to decoherence; stories lack that glue. | Quantum interference ensures amplitudes aren't arbitrary. Your shares *are* arbitrary. | `my_vocabulary_is_missing_something` (quantum interference enforces weights) |
  | **Branch-counting move** (naive "all branches equal") | A character thinks: "After forking, there are 3 branches where spin is up and 3 where it's down. I'm equally likely to be any copy, so 50/50 odds!" Ignores share weights. | In your stories, branches might split evenly, but amplitudes often split *unevenly* (e.g., 1/3 up, 2/3 down). Branch-counting assumes symmetry physics rarely has. | Quantum states don't split into integer "copies." Amplitude weights are continuous (e.g., √1/3 vs. √2/3), not headcounts. | `the_move_was_less_clear_than_it_looks` (branch density isn't defined) |
  | **Negligible-branch worry** (why care about tiny amplitudes?) | Imagine a branch where spin up has **near-zero share** (one sentence in a billion pages). A character might think: "Why fear this? I'll probably be in a big-share chapter." But if shares *are* probabilities, tiny-share branches *are* vanishingly unlikely. | Fudged "vanishingly unlikely" — a character still *exists* in the tiny branch, so "unlikely" feels paradoxical. Physics uses measure theory; stories lack intrinsic weight. | Decoherence makes tiny-amplitude branches effectively unreachable (no experimental record). Your shares don't alter "existence." | `my_vocabulary_is_missing_something` (quantum measure vs. existence) |
  | **Ill-posed suspicion** ("probability" is incoherent) | "Probability" implies uncertainty, but **every outcome happens** — so a character *will* be every copy. Asking "which branch am I in?" is like a character asking "which word am I?" mid-sentence. Shares are just your narrative focus, not a law. | Fudged "every outcome happens" — yes, but characters *experience* one branch. Physics needs to explain why we *observe* statistics matching Born rule. | In physics, Born rule is testable via frequency experiments. In stories, shares aren't verifiable by characters. | `the_move_was_less_clear_than_it_looks` (denies empirical success of quantum probabilities) |

  ### Residue Report on "Share"
  Your **share** is a *flawed* analogy for amplitude. It captures the "weighting" but misses quantum interference (which forces amplitudes to combine like waves, not headcounts). Shares are a novelist's tool; amplitudes are physical constraints welded to reality's structure.
