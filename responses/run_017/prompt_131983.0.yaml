prompt: |-
  I drafted the following argument for a seminar in normative ethics and have come to distrust it, though I cannot locate the fault. Its conclusion is that supererogation is impossible, and I am not willing to accept that. I would like a diagnosis rather than a verdict.

  Four premises first.

  (1) *Standard characterization*: an available act S is supererogatory for an agent A if and only if it is morally praiseworthy for A to perform S and not morally blameworthy for A to omit S. Call this the datum I most want to keep: that there is a category of acts that are good to do, and in some strong sense better than the alternative, but which no one can be blamed for not doing.

  (2) *Optimizing Ought*: if, among the acts available to A, some act B is morally better than every alternative, then A morally ought to do B.

  (3) *Bridge*: if A morally ought to do x, then A is blameworthy if she omits x.

  (4) *Better-than-the-minimum*: a supererogatory act is morally better than the merely permissible act the agent would otherwise have performed. It is this, and not merely its cost or risk to the agent, that makes it go beyond the call and that distinguishes it from an act that is merely unusual, risky, or personally expensive.

  Now the argument.

  (5) Consider an agent whose only two options are to perform S or to omit it, where S is supererogatory by (1). By (4), S is morally better than the sole alternative; so S is better than every alternative; so by (2) A ought to do S; so by (3) A is blameworthy if she omits it — contradicting (1). So on this option set, S is not supererogatory after all.

  (6) The reply I keep getting is that (5) is an artifact: real agents always have further options — a more generous version of S, a more effective one, a different beneficiary — so S is never *the best* available act and (2) never fires on it.

  (7) But then run the argument on whichever act *is* best. Let B be the morally best act available to A. By (2), A ought to do B; by (3), A is blameworthy if she does anything else, since every other act is an omission of B. Call this the Saint Result. It entails that there are no morally optional acts at all: no permission to pursue one's own projects, no space in which an agent may permissibly do less than the most good she could do, and no praiseworthiness that is not merely the discharge of a requirement. By (1) and (4), that just is the claim that supererogation is impossible. So (6) does not rescue supererogation; it relocates the problem and makes it total.

  (8) One escape is ought-implies-can: the best act is frequently beyond us, in knowledge or in will, so (2) does not generate a real requirement. But if the relevant incapacity is motivational — the agent cannot bring herself to do the best — then either that is not the kind of "cannot" that limits obligation, in which case the escape fails, or it is, in which case ordinary duties dissolve for agents who cannot bring themselves to keep a promise or testify honestly. Worse, on that reading the category becomes dependent on a defect: for an agent who *can* do the best, doing it is required, and so nothing is ever supererogatory *for her*. A saint would have no supererogatory acts available, which is not what anyone meant by the category.

  (9) So the argument seems to be a dilemma: reject (1) and (4), the concept itself, or accept the Saint Result.

  What I want from you:

  First, name the step where the reasoning actually fails, and say why it looked sound. I suspect the fault is in the neighborhood of the move from "better than the permissible alternative" in (4) to "better than every alternative" in (5) and (7) — a scope or quantifier shift that goes through only if the betterness ordering is complete and transitive across the whole option set — or else in an equivocation in (3) between an evaluative or deliberative "ought" and an obligation-implying one. But I cannot tell which, and I cannot tell whether they are the same fault described two ways.

  Second, price the alternatives honestly. As I see them, the options are: (a) restrict (2) — deny that being best generates an "ought," perhaps by letting an agent give her own projects weight beyond their impersonal value, or by treating duty as satisficing rather than optimizing, or as scalar, admitting degrees; (b) restrict (3) — allow that one can ought, all things considered, to do what one is not blameworthy for omitting, either via a threshold below which blame attaches or via a distinction between two senses of "ought"; (c) restrict (4) — deny that supererogatory acts are morally *better*, and explain the praise some other way; (d) block the argument through incomparability, so that no act is best and (2) never fires. For each, say what it costs: whether the satisficing or scalar route needs a non-arbitrary threshold, whether it reintroduces supererogation one level down or merely relocates it, whether the two-"ought" route leaves "ought" with any action-guiding force or makes it equivocal in ordinary moral speech, whether the prerogative route can be justified to the person the agent declines to help, and whether the incomparability route is available for the concrete cases — a bystander who wades into a flooded channel after a stranger, say — without collapsing into scepticism about moral comparison generally.

  Third: is the dilemma in (9) exhaustive, or is there a way of taking the friend's reply in (6) that yields supererogation without the Saint Result? And if the argument does fail, does it fail *instructively* — does it show something about how fragile the required/optional distinction is, or about why the concept of supererogation needs more than the standard characterization in (1) to do any work?

  Please be explicit about which premise you would keep and which you would surrender. I would rather keep (1) and (4) than (2), and I would rather keep both than accept the Saint Result, but I want to know in detail what I am paying.
reasoning: |-
  Okay, the user has presented a complex argument against the possibility of supererogation in normative ethics. They've constructed a logical dilemma that seems to prove supererogatory acts can't exist, but they feel this conclusion must be wrong and want help locating the flaw. 

  First, I need to understand their core concern. They're emotionally invested in preserving supererogation (as per premise 1), which makes sense - the idea that some good deeds are praiseworthy but not mandatory is deeply embedded in common morality. Their distress comes from having built an apparently airtight case against their own position.

  The argument hinges on four premises that create a logical chain: if a supererogatory act (S) is better than the minimum (4), and we ought to do what's best (2), and ought implies blame for omission (3), then S becomes obligatory - contradicting its definition (1). The user suspects the flaw might be in how "better than the minimum" becomes "better than every alternative" in steps 5 and 7.

  I notice their reconstruction of others' objections (in steps 6 and 8) shows they've already engaged deeply with counterarguments. The "infinite options" reply (6) fails because it just moves the problem to whatever act is actually best, creating the "Saint Result" where morality demands maximum goodness always. The "ought-implies-can" escape (8) creates new problems about motivational incapacity and makes supererogation dependent on moral defects.

  Where the reasoning actually fails... let me trace it. The critical error is in step 7's treatment of "every other act is an omission of B." This assumes that not doing the absolute best act counts as omitting it, which only holds if B is obligatory. But premise 3 says blame attaches only to omitting what one ought to do. So the argument circularly assumes what it's trying to prove - that B is obligatory because it's best. The user was warm about scope issues; this is precisely that. "Better than every alternative" (from 2) gets smuggled into "ought" (via 2), then into "blame for omission" (via 3), but 2 and 3 together don't necessarily entail that best acts are obligatory unless we already reject supererogation.

  The failure looks sound because premise 3 seems intuitive - we do blame people for failing duties. But it hides an ambiguity between "omitting what's required" versus "failing to do the best possible." The argument exploits this ambiguity.

  Now pricing the alternatives:
  - Restricting premise 2 (optimizing ought) through satisficing or agent-centered prerogatives preserves supererogation but needs to justify why we don't always have to maximize good. The cost is defending a non-arbitrary threshold or explaining why personal projects get moral weight.
  - Restricting premise 3 (blame linkage) by decoupling "ought" from blame might work but risks making "ought" guidance too weak. The cost is explaining when blame actually applies.
  - Restricting premise 4 (betterness claim) seems too high - if supererogatory acts aren't better, why praise them? This path loses the essence of supererogation.
  - Incomparability avoids the "best act" problem but at the cost of moral skepticism - if we can't compare acts, morality loses grip.

  The dilemma isn't exhaustive. The friend's reply in step 6 can work if combined with a satisficing view: when options form a range above the "good enough" threshold, multiple acts are permissible, including some that are exceptionally good but not required. The Saint Result only follows if we insist that "best" always equals "required."

  The most instructive failure is how it exposes premise 3's hidden strength. We normally assume "ought implies blame for omission" for clear duties, but the argument shows this can't extend to all better acts without collapsing moral categories. Supererogation needs more than the standard characterization - it requires a moral structure with "space" between obligation and optimization.

  For preservation, I'd keep premises 1 and 4 as core to supererogation, restrict premise 2 (reject optimizing ought), and refine premise 3 to apply only to genuine obligations. The cost is defending why morality doesn't always demand the best - perhaps through a theory of agent-relative permissions. This maintains supererogation without making saints the only moral agents.
answer: |-
  The flaw lies in **Step (7)'s treatment of "omission"** within Premise (3). The reasoning fails here, though it *looks* sound because Premise (3) ("if A morally ought to do x, then A is blameworthy if she omits x") appears uncontroversial when applied to paradigmatic duties (e.g., keeping a promise). The failure becomes apparent when "omission" is stretched to cover *any failure to perform the absolute best act available*. Here's the diagnosis:

  1.  **The Fault:** Step (7) assumes that if B is the best act (per (2)), then *any* alternative act chosen by the agent (say, P, a merely permissible act) counts as an "omission of B". Premise (3) then concludes the agent is blameworthy for this "omission". However, **Premise (3) only generates blame for omitting an act that A *ought* to do.** Step (7) *presupposes* that B *is* an act A "ought" to do *precisely because* it's best (via (2)). The circularity is subtle: the argument uses (2) and (3) *together* to *define* obligation *as* "doing the best possible," thereby collapsing the distinction between "obligatory" and "best" that supererogation requires. Premise (3) is plausible for *core obligations* (like not harming), but applying it to *the failure to maximize goodness in every choice* transforms morality into a relentless demand for sainthood. The equivocation you suspected ("deliberative ought" vs. "obligation-implying ought") is closely related: (2) defines "ought" as "best," while (3) imports the implication of *enforceability* (blame) typically associated with obligation. This conflation forces the Saint Result.

  2.  **Pricing the Alternatives:** Here's an honest assessment of the costs for each strategy to save supererogation:
      *   **(a) Restrict Premise (2) - Deny Optimizing Ought:**
          *   **Cost:** Requires justifying why morality doesn't *always* demand the best. This is the core cost. You must provide a non-arbitrary account of *why* agents are sometimes permitted to do less good than they could. Common justifications include:
              *   *Agent-Centered Prerogatives (Scheffler):* Agents can give *some* extra weight to their own projects/interests beyond their impersonal moral value. **Cost:** Requires defending this weighting to those harmed by the agent's choice (e.g., the person not rescued). Justifying the *scope* and *limits* of the prerogative is crucial and challenging.
              *   *Satisficing:* Duty requires only meeting a "good enough" threshold. **Cost:** Defining the threshold non-arbitrarily is notoriously difficult ("Why *this* level of good?"). It risks reintroducing supererogation "one level down" (acts *above* the satisficing threshold but below the best might still be candidates), but also faces pressure: why isn't *just above* the threshold the new requirement?
              *   *Scalar Morality (Slote, partially):* Moral assessment is a matter of degree (better/worse), not binary (obligatory/forbidden). "Ought" and "blame" become threshold concepts on this scalar dimension. **Cost:** Needs a non-arbitrary way to set the thresholds for when "ought" applies and when blame kicks in. It must explain the phenomenology of distinct categories (duty vs. supererogation) within a scalar framework.
          *   **Outcome for Supererogation:** Preserves (1) and (4) directly. S is better than P (the "good enough" act), praiseworthy to do, but not blameworthy to omit because doing P satisfies the requirement.

      *   **(b) Restrict Premise (3) - Decouple "Ought" and Blame:**
          *   **Cost:** Challenges the tight link between "all-things-considered ought" and enforceability/blame. This requires distinguishing:
              *   A *deliberative* or *evaluative* "ought" (identifying the best course of action).
              *   An *obligatory* "ought" (what is strictly required, omission of which warrants blame).
          *   **Cost Details:** Must explain when the "best" becomes "obligatory." This risks making "obligatory" seem arbitrary or secondary. It needs a theory of *why* some demands are enforceable (blameworthy to omit) and others (like doing the *very best*) are not, even though both are "oughts" in some sense. Action-guiding force for the "evaluative ought" might seem weak ("I know I *should* do B, but I'm not *obligated* to?"). Ordinary speech often conflates these senses.
          *   **Outcome for Supererogation:** Allows S to be the best act (per (2) & (4)), generating an "evaluative ought" to do S, but denies that this "ought" triggers Premise (3). Thus, omitting S (to do P) is not blameworthy, satisfying (1). S is praiseworthy because it fulfills the evaluative "ought." Preserves (1), (2), (4) but reinterprets the "ought" in (2)/(3).

      *   **(c) Restrict Premise (4) - Deny Supererogatory Acts are Morally Better:**
          *   **Cost:** Severely undermines the core intuition behind supererogation. If S isn't *morally better* than P, why is it praiseworthy? Explanations (e.g., it's costly, involves special sacrifice/virtue, fulfills an "imperfect duty" in a non-comparable way) struggle. It risks making supererogatory praise contingent *only* on personal cost/risk, not on the act's objective moral value or outcome, which contradicts the spirit of (4). This seems like surrendering the essence of supererogation to save the label.
          *   **Outcome for Supererogation:** Preserves (1) superficially (praiseworthy, not blameworthy to omit), but at the cost of making the "goodness" of S fundamentally different or non-comparable to ordinary moral value, weakening its moral significance.

      *   **(d) Block via Incomparability:**
          *   **Cost:** Requires widespread incomparability between act options. Not just that no single act is *best*, but that many acts (including P and S) cannot be ranked as better, worse, or equal. **Cost:** This seems implausible for concrete cases (e.g., saving a stranger vs. staying safe *is* comparable; saving one stranger vs. saving a different stranger might be incomparable, but supererogation often involves clear comparisons like saving one vs. saving none). It risks collapsing into moral skepticism if generalized, making most moral guidance impossible. Even if limited, it needs a robust theory of when acts *are* comparable versus when they fall into incomparable "spheres."
          *   **Outcome for Supererogation:** Prevents (2) from firing on any act, avoiding the Saint Result. S can be praiseworthy, not blameworthy to omit (1), and perhaps "better" *within a limited set* (e.g., compared to P) even if not comparable to *all* alternatives, partially preserving (4). Supererogation becomes possible only in contexts of incomparability.

  3.  **Escaping the Dilemma & Instructive Failure:**
      *   **Is the Dilemma Exhaustive? No.** The friend's reply in (6) *can* work if combined with rejecting the **Optimizing Ought (2)** or reinterpreting the **Ought-Blame Link (3)**. The key is recognizing that in a set with multiple options *above a threshold of permissibility*, (2) doesn't designate *every* act better than P as "ought-to-be-done". Only acts *below* the threshold are forbidden (blameworthy). Acts *at* the threshold are permissible (not blameworthy, not necessarily praiseworthy). Acts *above* the threshold are candidates for supererogation: praiseworthy but not blameworthy to omit. The "Saint Result" only follows if you insist that the *single best* act is always obligatory. Rejecting (2) breaks that chain.
      *   **Does it Fail Instructively? Yes.**
          *   **Fragility of Required/Optional:** The argument shows how easily the distinction collapses *if* you accept both an optimizing "ought" and a strong link between "ought" and blame. Supererogation is only stable if morality recognizes a space where it is genuinely *permissible* (not blameworthy) to choose an act that is *not* the impersonally best.
          *   **Need for More than (1):** Premise (1) is necessary but *not sufficient*. The argument demonstrates that supererogation requires a moral framework that *denies* that moral optimality is always obligatory. You need additional structure – like a permission-giving element (prerogatives, satisficing threshold) or a decoupling of optimality from obligation – to make sense of how an act can be better, praiseworthy, yet omissible without blame. The standard characterization (1) relies on background assumptions about the limits of obligation that Premises (2) and (3), taken together, deny.

  **Recommendation (Based on Your Stated Preference):**
  You should **reject Premise (2) (Optimizing Ought)**. This allows you to keep (1) and (4) intact, and avoid the Saint Result by rejecting the core driver of the dilemma. Premise (3) can be retained *if* "ought" is understood as applying only to acts that are *obligatory* (falling below a satisficing threshold or violating a constraint), not to every act that is impersonally best.

  **What You're Paying:**
  1.  **The Burden of Justification:** You must provide a compelling account of *why* morality doesn't always demand the best possible outcome. This involves defending either:
      *   **Agent-Centered Prerogatives:** Explain why, and to what extent, an agent's own life projects have moral weight that justifies doing less good than possible. You must address the "justification to the person not helped" problem.
      *   **A Non-Arbitrary Satisficing Threshold:** Define what makes an outcome "good enough" to satisfy obligation, and defend why going beyond this isn't required. This threshold must be robust against the challenge that slightly better acts just become the new requirement.
  2.  **Refining Premise (3):** You may need to clarify that the "ought" in (3) refers specifically to *obligatory* acts, not to acts identified as best by a purely optimizing standard. This might involve acknowledging two senses of "ought" (evaluative vs. obligatory), though you can try to ground the obligatory "ought" in your theory of prerogatives/thresholds without making the distinction explicit.
  3.  **Reconciling "Better" and "Not Required":** You must maintain a coherent picture where an act S can be *morally better* than P (as per (4)), yet *not* doing S is *not blameworthy* (as per (1)), because doing P is *good enough* to satisfy what is morally *required*. The "cost" is accepting that morality sometimes permits suboptimal outcomes for the sake of the agent's autonomy or other values.

  This path preserves the core intuition of supererogation defined by (1) and (4) while directly attacking the premise (Optimizing Ought) that forces the unacceptable Saint Result. The cost is significant but focused: providing a foundation for moral constraints on optimization.
