  ### Decision Tree for Aggregation in Normal Ethics

  **Node 1: Base Case**  
  You face two groups: Group A has five people, Group B has one person. All are strangers with equal claims on you, and saving either group prevents imminent death. Do you save Group A?  
  - **Yes** → Go to Node 2  
  - **No** → Go to Node 3  

  **Node 2: Statistical vs. Identifiable Case**  
  You can save five people in a distant, burning building (known only statistically) or one identifiable child in front of you. Do you save the five?  
  - **Yes** → Go to Node 4  
  - **No** → Go to Node 5  

  **Node 3: Policy Case**  
  You write a triage rule for 100 future emergencies. Each emergency involves saving five strangers or one stranger. The rule will be automatically applied, and you don’t know who will be in which group. Should the rule prioritize saving five?  
  - **Yes** → **Leaf G: Ex Ante Fairness View**  
  - **No** → Go to Node 6  

  **Node 4: Finger vs. Life Case**  
  Saving Group A (five people) prevents each from losing a finger. Saving Group B (one person) prevents death. Do you save Group A?  
  - **Yes** → Go to Node 7  
  - **No** → Go to Node 8  

  **Node 5: Policy Case (for "No" at Node 2)**  
  Same as Node 3. Should the triage rule prioritize saving five?  
  - **Yes** → **Leaf E: Pairwise-Contractualist Tie-Breaker**  
  - **No** → **Leaf F: Unoccupied Region**  

  **Node 6: Lottery in Base Case**  
  In the base case (five vs. one), should you flip a fair coin to decide which group to save?  
  - **Yes** → Go to Node 9  
  - **No** → **Leaf J: Save-the-One View**  

  **Node 7: Two vs. One Case (after "Yes" at Node 4)**  
  You face Group A (two people) vs. Group B (one person). All face death. Do you save Group A?  
  - **Yes** → **Leaf A: Straightforward Additive Aggregation**  
  - **No** → **Leaf B: Unoccupied Region**  

  **Node 8: Two vs. One Case (after "No" at Node 4)**  
  Same as Node 7. Do you save Group A (two people)?  
  - **Yes** → **Leaf C: Straightforward Additive Aggregation**  
  - **No** → **Leaf D: Threshold/Diminishing-Weight Aggregation**  

  **Node 9: Proportional Lottery**  
  In the base case, if flipping a coin, should Group A (five people) have a 5/6 chance of being saved?  
  - **Yes** → **Leaf H: Proportional-Chance Lottery**  
  - **No** → **Leaf I: Equal-Chance Lottery**  

