prompt: |-
  I'm in the final year of a philosophy and economics programme, and this term I'm taking a seminar on rational choice under risk. The tutor has asked each of us to lead one fifty-minute problem session, and mine is on the Pasadena game: a fair coin is tossed until it lands heads, and if that takes n tosses you receive (-1)^{n-1}·2^n/n dollars, so the payoffs run +2, -2, +8/3, -4, … and the expected value works out as the alternating harmonic series, which is only conditionally convergent — rearrange the terms and you can make the sum come out to anything you like, which is why people say the game has no expected value at all rather than a large or infinite one. The group is comfortable with expected utility theory and has already seen the St Petersburg game, and they know things like "the harmonic series diverges," but they have no measure theory and I don't want to invoke any. After class a friend of mine said the whole thing is just St Petersburg again with minus signs, and another said the answer is obviously ln 2 since that's what the series sums to in its natural order; I think both are missing the point, but I'm not confident I can show them why in a way that lands.

  So please plan the session rather than explain the game to me: the order in which the ideas have to arrive and what depends on what, the one example (or pair of examples) that should carry the whole thing, the misconceptions the group will bring or form and the exact point in the sequence at which each should be headed off, one question I can put to them at the end that would show they've understood the problem rather than just learned the vocabulary, and what I should explicitly decline to get into at this level. My own thought is that the session should turn on a comparison rather than on a single gamble: take the Pasadena game and a companion game whose payoff at every outcome is exactly one dollar more, which intuitively ought to be worth exactly one dollar more and yet is equally undefined in expectation, and then compare the two truncated versions — stop the coin at N tosses, note that the difference of the truncated expectations is exactly one for every N, and let N go to infinity — so that the lesson is that expectation is an instrument for ranking options and not the definition of what an option is worth, and that some comparative judgements survive when the absolute ones do not. Tell me whether that pair is the right thing to build the hour around, whether the group needs to feel the rearrangement result in their bones before the comparison will mean anything, where the "just use bounded utility" and "no one could ever actually offer you this gamble" moves should be placed so that they don't derail the session but also don't get dismissed by fiat, and whether a remark like "use the median instead of the mean" is worth engaging or is a distraction at this level.

  One more thing about how I'd like the answer pitched. Please mark clearly which parts of what you're proposing are settled — the convergence mathematics and what follows from it for any rule that ranks gambles by expected value — and which are live disputes among people who actually work on these cases: whether dominance or some surrogate should do the work expectation can't do here, whether the example is a genuine problem for decision theory or an artefact of infinite idealisation, whether unbounded utility is the real culprit underneath. I would much rather say to the group "the literature is genuinely split here" than hand them one camp's repair as the received view. And if the truncation-comparison idea I've sketched is itself a contested move rather than the obvious fix I've been taking it for, say so plainly and tell me what the rivals to it are.
reasoning: |-
  Okay, the user is preparing a seminar on the Pasadena game for their philosophy and economics class. They’ve outlined their approach but want feedback on structuring the session effectively. Let me break down their needs.

  First, they’re concerned about misconceptions. Their friends think it's just St. Petersburg with negative signs or that ln(2) is the obvious expected value. They need to address these early to prevent confusion. The key is showing that conditional convergence, not just divergence, is the issue here. 

  The user’s idea is to compare the Pasadena game with a shifted version (each payoff +1). This highlights that while absolute expectations are undefined, comparative differences can still hold. But they’re unsure if this approach is solid. I should check if this comparison is valid. Literature suggests that while truncation shows stable differences, it doesn't fully resolve the normative problem. So presenting it as a partial solution but noting the ongoing debate is important.

  Next, handling objections like "use bounded utility" or "it's unrealistic." These should be acknowledged but not derail the main point. Maybe slot them in during Q&A or at the end. Also, mentioning medians—probably a distraction since the focus is on expectation.

  The user wants to clarify which parts are settled (math of conditional convergence) and which are disputed (normative implications). Emphasizing that rearrangement affects any expectation-based rule is crucial. The debate around dominance principles versus other fixes should be presented neutrally.

  Structuring the session: Start with St. Petersburg recap to anchor understanding. Then introduce Pasadena, calculate truncated expectations to show oscillation. Demonstrate rearrangement to prove undefined expectation. Then introduce the +1 game and show the difference in truncations is always $1. This makes the paradox tangible. 

  End with a question forcing application: "Why can’t we say the +1 game is better?" This tests comprehension of the expectation’s undefined nature versus stable comparisons. 

  Avoiding measure theory means keeping explanations intuitive. Using spreadsheets for truncation helps visualize. Also, not diving into alternative decision theories but acknowledging their existence.
answer: |-
  Here's a structured 50-minute session plan focusing on your comparison idea, addressing misconceptions, and clarifying the settled math vs. live philosophical disputes. The core insight is that **conditional convergence undermines the absolute expected value but preserves some comparative judgments**.

  **Session Structure & Timing (50 mins):**

  1.  **Recap & Setup (5 mins):**
      *   Briefly review St. Petersburg: Infinite EV due to divergent harmonic series. Emphasize the *absolute* expectation blows up.
      *   Introduce Pasadena Game: Payoff = `(-1)^{n-1} * 2^n / n` for first Heads on toss `n`.
      *   Write out first few terms: `+2, -2, +8/3 ≈ +2.67, -4, +32/5 = +6.4, -32/6 ≈ -5.33, ...`
      *   **Key Question:** "What's the expected value? Is it like St. Petersburg but with negatives?"

  2.  **Calculating Truncated Expectations (10 mins):**
      *   **Activity:** "Let's calculate the expected value if we stop after a maximum of N tosses." (Use a simple table/spreadsheet projected).
      *   Calculate `E[N=1]`: Prob=1/2, Payoff=+2 → EV = (1/2)*2 = **1**
      *   Calculate `E[N=2]`: Add Prob=1/4, Payoff=-2 → EV = 1 + (1/4)*(-2) = 1 - 0.5 = **0.5**
      *   Calculate `E[N=3]`: Add Prob=1/8, Payoff=+8/3≈2.67 → EV = 0.5 + (1/8)*(8/3) = 0.5 + 1/3 ≈ **0.833**
      *   Calculate `E[N=4]`: Add Prob=1/16, Payoff=-4 → EV ≈ 0.833 + (1/16)*(-4) = 0.833 - 0.25 = **0.583**
      *   **Observe:** "It's oscillating! 1, 0.5, 0.833, 0.583... Where is it going? It's the partial sums of `1 - 1/2 + 1/3 - 1/4 + ...` (the alternating harmonic series)."
      *   **Settled Math:** The alternating harmonic series converges *conditionally* to `ln(2) ≈ 0.693`. *But emphasize:* "Convergence only happens if we sum the terms *in this exact order*."

  3.  **The Heart of the Problem: Rearrangement (15 mins):**
      *   **Concept:** "Conditional convergence means the sum depends *crucially* on the order of addition. If we rearrange the terms, we can get *any* real number, or make it diverge to +∞ or -∞."
      *   **Intuition Pump (Simple Analogy):** Imagine infinitely many people. Some owe you $1 (`+1`), some you owe $1 (`-1`). If you have equal numbers, net debt is $0. But if you collect from all creditors first (`+1 +1 +1 +...`), you think you're infinitely rich. Then you pay *all* debtors (`-1 -1 -1 -...`), you think you're infinitely poor. The net is $0, but the *order* of settling debts creates wildly different *intermediate* states and prevents a stable "expected settlement" value.
      *   **Consequence for Pasadena:** "The payoffs correspond to the terms of this series. The 'natural order' (order of occurrence) gives partial sums approaching `ln(2)`. But *other orders are equally mathematically valid* for defining the sum. Why should the order of coin tosses dictate the order of summation? There's no unique sum."
      *   **Settled Math:** Any rule assigning a real number to the Pasadena game via summing its payoffs weighted by probability *must* depend on the order of summation. There is no unique, order-independent expected value. The expectation is **undefined** (not infinite, not `ln(2)`).

  4.  **Introducing the "+1 Companion Game" & The Comparison (15 mins):**
      *   **Pasadena Game (PG):** Payoff(n) = `(-1)^{n-1} * 2^n / n`
      *   **"+1 Game" (PG+1):** Payoff(n) = `[(-1)^{n-1} * 2^n / n] + 1`
      *   **Intuition Check:** "Is PG+1 clearly better than PG? It pays exactly $1 more *in every single possible outcome*. Shouldn't it be worth exactly $1 more?"
      *   **Truncated Comparison:** Calculate `E_{PG+1}[N] - E_{PG}[N]` for previous N values.
          *   N=1: `[ (1/2)*(2+1) ] - [ (1/2)*2 ] = [1.5] - [1] = 0.5`? Wait, that's not $1! **Pause.**
          *   **Realization:** The "+1" applies to *every outcome*, but outcomes have different probabilities! The EV of a constant $1 is $1. Therefore:
              *   `E_{PG+1}[N] = E_{PG}[N] + E_{$1}[N] = E_{PG}[N] + 1`
              *   So `E_{PG+1}[N] - E_{PG}[N] = 1` **for every single N.**
      *   **The Paradox:** As `N → ∞`, the truncated expectation for PG oscillates and doesn't converge to a unique value. The same happens for PG+1 (it oscillates around `ln(2) + 1 ≈ 1.693`). **BUT**, their difference is *always exactly $1*, for every finite N, and this remains true in the limit `N→∞`.
      *   **The Insight:** While the *absolute* expected values are undefined, the *comparative* judgment "PG+1 is worth exactly $1 more than PG" is robust and survives the limit. Expectation as a tool for *ranking* gambles can sometimes work even when it fails to assign an absolute value. **Dominance (PG+1 > PG everywhere) implies PG+1 is better, *despite* undefined expectations.**

  5.  **Q&A, Misconceptions, & Wrap-up (5 mins):**
      *   **Key Comprehension Question (End):** "We saw PG+1 dominates PG (strictly better in every outcome), and the difference in their truncated expectations is always $1. Why does this *not* allow us to say the *expected value* of PG is `ln(2)` and PG+1 is `ln(2)+1`?" **(Answer:** Because the truncated EV for PG *itself* doesn't converge to a unique value `ln(2)`; it only converges conditionally in that order. The comparison holds, but the absolute values remain undefined.)
      *   **Addressing "Just Use Bounded Utility":** Place this at the end of Q&A. "Would bounded utility solve this? Yes, absolutely! If utility is bounded, all series converge absolutely, and EV is well-defined. But the *point* of this example is to explore the conceptual foundations of expectation *within* the standard EUT framework that allows unbounded utility, revealing a surprising consequence of conditional convergence. It's a paradox *for* that framework."
      *   **Addressing "It's Unrealistic":** Acknowledge early, dismiss gently. "Yes, no one could offer the infinite tails. But models like St. Petersburg or Pasadena are 'laboratories' for testing concepts. The issue arises clearly in the idealized case, informing how we think about real, complex decisions with many possibilities." Don't let it dominate.
      *   **Addressing "Use the Median":** Briefly dismiss as a distraction here. "The median payout for both PG and PG+1 is likely $2 or -$2, which doesn't help us compare them or capture the value of the very large potential payoffs. This problem is specifically about the failure of the *mean* (expectation) as a summary statistic due to conditional convergence."
      *   **Wrap-up Message:** "The Pasadena game shows that the standard definition of expected value breaks down for some well-defined gambles with unbounded payoffs due to conditional convergence. While *absolute* expectation is undefined, some *comparative* judgments based on dominance can still hold. This highlights that expectation is primarily a tool for ranking, and its failure to yield an absolute number doesn't always imply complete incomparability."

  **Why Your Comparison Idea Works & How It Fits:**

  *   **It's Perfect:** Your PG vs. PG+1 comparison is the **ideal centerpiece**. It makes the abstract rearrangement problem concrete by focusing on a stable relationship *between* gambles that survives the limit, contrasting sharply with the instability of their individual values.
  *   **Timing:** The rearrangement explanation (Step 3) is **essential prerequisite knowledge**. Students *must* grasp why the EV is undefined (not `ln(2)`) before the comparison has its full paradoxical impact. Seeing the truncated EV oscillate (Step 2) builds intuition for why rearrangement matters.
  *   **Carries the Weight:** This pair demonstrates:
      1.  The core problem (undefined absolute EV due to conditional convergence).
      2.  A surprising consequence (dominance holding despite undefined EVs).
      3.  The key takeaway (EV as a comparative tool).

  **Settled Math vs. Live Disputes:**

  *   **Settled (The Mathematics):**
      *   The alternating harmonic series converges conditionally to `ln(2)`.
      *   Rearrangement of a conditionally convergent series can yield any real sum or diverge.
      *   Therefore, the Pasadena game's expected value, defined as the sum of `probability * payoff` over all states, is **undefined**. It is not `ln(2)`, not infinite, not zero. It simply lacks a unique value.
      *   This holds for *any* decision rule that relies on computing this sum (standard EUT, any other EV-based rule).
      *   For *any* finite truncation N, `E_{PG+1}[N] = E_{PG}[N] + 1`.
  *   **Live Disputes (The Philosophical/Decision Theoretic Response):**
      *   **Is this a genuine problem?** Some argue it exposes a deep flaw in standard EUT with unbounded utility. Others argue it's merely a pathological artifact of infinite states and unbounded utility with no practical significance.
      *   **What principle should govern?** Your comparison relies on **Statewise Dominance** (PG+1 > PG in every state → PG+1 is preferred). This is widely accepted, but *does it suffice* for rational choice in all cases involving undefined expectations? Are there weaker principles? (E.g., Seidenfeld, Schervish, Kadane work extensively on this).
      *   **Rivals to the Dominance/Comparison Approach:**
          *   **Finitism:** Reject the infinite game as incoherent. Only consider finite truncations. (But then how to choose N?).
          *   **Regularization:** Propose a specific "natural" order (e.g., order of occurrence) and define EV as `ln(2)`. (Violates the core mathematical point that order matters arbitrarily).
          *   **Extended Preferences/Non-Archimedean Values:** Represent preferences with entities more complex than real numbers (e.g., vectors, infinitesimals). (Highly complex, arguably ad-hoc).
          *   **Choquet Expectation/Non-Additive Probabilities:** Modify the probability framework. (Moves significantly beyond standard EUT).
      *   **The Culprit:** Is it unbounded utility? **Yes, in a crucial sense:** Bounded utility forces absolute convergence, resolving the issue. But the dispute is whether unbounded utility is *legitimate* or whether the paradox shows it must be bounded. Proponents of unbounded utility (for theoretical reasons like representing "pascal's mugging") need alternative responses like dominance principles.
  *   **Your Comparison's Status:** Your truncation argument showing `E_{PG+1}[N] - E_{PG}[N] = 1` for all N is mathematically solid. Using this to justify `PG+1 > PG` via dominance is a **mainstream position defended by significant figures** (e.g., Seidenfeld et al.), but it is **not uncontroversial**. Critics might argue that dominance alone is insufficient to ground rational choice when the standard expectation calculation fails entirely, or that it doesn't tell us *how much* better PG+1 is. It's a proposed solution, not an uncontested "fix".

  **What to Explicitly Decline:**

  1.  **Measure Theory:** Avoid Lebesgue integration, σ-additivity. Stick to sums and limits.
  2.  **Detailed Alternative Decision Theories:** Mention they exist (e.g., "some theorists propose complex non-Archimedean values"), but don't explain them. Focus is on the problem within standard EUT.
  3.  **Deep Dive into Rearrangement Proofs:** Show the *fact* and a simple analogy (like the debtors/creditors), not the technical proof that any sum can be achieved.
  4.  **Resolving the Live Dispute:** Present dominance as a *plausible response* supported by the comparison, not *the* answer. Emphasize the literature is split.

  **Key to Success:**

  *   **Calculations:** Do the truncated EV calculations live (or have them prepped). Seeing the oscillation and the stable difference is crucial.
  *   **Clarity on "Undefined":** Hammer home that "undefined" means "no unique real number value", distinct from "infinite" or "zero" or "ln(2)".
  *   **Paradox:** Highlight the tension: Dominance screams PG+1 is better, yet we can't say *what* either is worth. That's the puzzle.

  This structure leverages your insight, builds necessary understanding step-by-step, addresses misconceptions proactively, and accurately frames the settled math vs. the open philosophical debate. Good luck!
