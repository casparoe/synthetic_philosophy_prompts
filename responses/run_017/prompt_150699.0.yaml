prompt: |-
  I am a novelist, three volumes into a science-fiction sequence set on a terraformed world whose biosphere I have to keep internally consistent across some nine hundred pages and a series bible that a continuity editor and a scientific consultant now maintain alongside me. In the current book my narrator repeatedly has to say what an organismal trait is *for*: that a chambered organ is for pumping, that a cranial crest is for display, that a gland is for signalling distress. I gather that the philosophy of biology splits roughly between accounts that fix a trait's function by its history — what it was selected for, or what a designer installed it to do, in the lineage — and accounts that fix it by the contribution it currently makes to the capacity of some containing system. I do not need the literature; I need the distinction turned into something I can run.

  So: write me a decision procedure for assigning a function to a trait in my fictional biosphere, which I can execute in about fifteen minutes at the point of drafting, with no more biology than an educated general reader has, and whose output is a one- or two-line entry my continuity editor can file and my consultant can check in our monthly pass. Give me the questions in the order I should ask them; what counts as a sufficient answer to each; the point at which the procedure returns a firm no; and the points at which it hands the decision back to me because the remaining question is one of narrative emphasis rather than fact. It must have explicit branches for traits that were designed rather than evolved, for traits whose history my world has a documented break in (several species were re-engineered by an earlier terraforming programme and then left to selection for centuries, so record and subsequent history come apart), and for traits whose history I have deliberately left blank and do not intend to fill in — tell me what the procedure does when the historical evidence is simply unavailable, since that will be most of my cases. Tell me which distinctions from the philosophical debate have to survive the simplification and which I can drop without the procedure breaking.

  Then run it on three entries from the current manuscript, in full: (1) a hollow cranial crest inherited from a burrowing ancestor, now used by the animal in courtship display; (2) an implanted filtration organ, originally installed by the terraformers to remove a toxin, which in the descendant population now mainly drives circulation fast enough that my characters call it a second heart; (3) a bioluminescent frill on an organism whose lineage record I have intentionally left unwritten. I expect to dislike the answer on at least one of these — say which and why, rather than steering toward what I would prefer.

  Begin with a single sentence stating the bottom line of the procedure, the one rule everything after it is a gloss on, and only then give the procedure and the worked cases; no preamble, and no restating back of what I have asked.
reasoning: |-
  We are going to use a hybrid approach that leans on current contribution when history is unavailable or ambiguous, but defers to history when it is clear and documented. The core rule is: **A trait's function is what it currently contributes to the organism's survival or reproduction in its present environment, unless we have clear evidence of a designed purpose or a historical selective pressure that overrides that current contribution and remains the best explanation for the trait's existence.**

  The procedure:

  1. **Is there a documented design history?** (i.e., was the trait engineered by the terraformers for a specific purpose?)
     - **Yes, and the documentation is clear and unbroken:** The function is the designed purpose. Go to step 1a.
       - *Step 1a: Has the trait been repurposed in a way that the original design is irrelevant?* (e.g., the trait is now doing something entirely different and the original purpose is not being served at all) 
          - **Yes:** Then the function is the current main contribution. (But note the original design in the record for continuity.)
          - **No:** Then the function is the designed purpose. (Even if it now does more, the core function is the design.)
     - **No, or documentation is unclear/lost:** Move to step 2.

  2. **Is there a clear evolutionary history?** (i.e., do we know what the trait was selected for in the lineage?)
     - **Yes, and the selective pressure is well-documented and unbroken:** The function is what it was selected for. But then check step 2a.
       - *Step 2a: Has the original selective pressure ceased and the trait now serves a different primary role?* 
          - **Yes, and the trait is now maintained by a new selective pressure:** Then the function is the current role. (But note the historical function in the record.)
          - **No, or the original pressure is still relevant:** Then the function is the historical one.
     - **No, or history is unknown:** Move to step 3.

  3. **What is the trait's current contribution?** (i.e., what does it do for the organism now?)
     - Identify the primary way the trait contributes to the organism's survival or reproduction in its current environment.
     - If there are multiple contributions, pick the one without which the organism would suffer the most (or die) in the wild. If that's unclear, pick the one that is most critical in the majority of the organism's activities.
     - **If it makes no current contribution (vestigial):** Then the function is "vestigial" (or none). But note what it used to do if known.
     - **If the current contribution is clear:** That is the function.

  4. **When history is unavailable (which is most cases):** We default to step 3 (current contribution) unless there is strong circumstantial evidence (e.g., the trait is complex and appears designed for a specific purpose, or it is homologous to a trait in a related species with known history). In the absence of such evidence, we don't speculate on history.

  5. **Narrative emphasis:** The procedure hands the decision back to you (the author) in the following cases:
     - When there is a tie between current contribution and historical function, and both are equally plausible and important to the story.
     - When the trait has multiple functions and you must choose which one to emphasize for narrative reasons (e.g., you are writing a scene about courtship, so you emphasize the display function even if the trait also has a physiological role).
     - When the trait is vestigial but you want to highlight the evolutionary history for thematic reasons.

  Distinctions we keep:
     - The split between history and current contribution matters when we have data. We don't collapse them arbitrarily.
     - We note when a trait is repurposed (exaptation) and when it is vestigial.

  Distinctions we drop:
     - We don't worry about the exact philosophical account (e.g., etiological vs. dispositional). We use a pragmatic hybrid.
     - We don't require a detailed causal role analysis. We use a simplified "current contribution" that focuses on survival/reproduction.

  Now, run the three cases:

  **Case 1: Hollow cranial crest inherited from a burrowing ancestor, now used in courtship display.**

  - Step 1: No documented design history (evolved). Move to step 2.
  - Step 2: We know the history: it was for burrowing. But step 2a: Has it been repurposed? Yes, now primarily used in courtship. The original burrowing function is likely irrelevant (unless the animal still burrows and uses it for that). Assuming the animal no longer burrows, then the function is courtship display (current contribution). 
  - **Function:** Display (for courtship). Note: historical burrowing function.

  **Case 2: Implanted filtration organ, originally installed by terraformers to remove a toxin, now mainly drives circulation (called a "second heart").**

  - Step 1: Documented design history: yes, for toxin removal. Step 1a: Has it been repurposed? Yes, now it is primarily driving circulation and the original toxin removal function is either minimal or gone (the toxin might no longer be present, or the removal is now incidental). So the function is circulation (current contribution). But note the original design.
  - **Function:** Circulation (acting as a secondary heart). Note: originally designed for toxin filtration.

  **Case 3: Bioluminescent frill on an organism with no lineage record.**

  - Step 1: No design history (or unknown). Step 2: No evolutionary history (intentionally left blank). Move to step 3.
  - Step 3: Current contribution: what does it do now? We must decide based on observation. Common uses for bioluminescence: communication (e.g., mating signals, warning), camouflage (counter-illumination), luring prey, deterring predators. Without history, we pick the current primary role. Since we have no record, we look at the organism's behavior and ecology. 
     - Example: if the organism uses it to attract mates, then function is courtship display. If it uses it to scare predators, then defense. 
     - Since the author has not specified, we must choose a current role. But note: the procedure requires us to assign a current contribution. However, if in the narrative the function is not specified and we are creating it, then we have to make a call. But the procedure says: in step 3, we look at what it does. If we are creating the organism, we can assign a current role arbitrarily? No, we must base it on the organism's ecology. 
     - **But note:** The procedure is for the author to run. So the author must decide: what is the current role? The procedure does not invent; it relies on the author's knowledge of the organism. 
     - Since the history is blank, we default to current contribution. The author must then decide what that is. However, the procedure does not require the author to make up history. So the function is whatever the author decides the frill does now. 
     - **However, the procedure requires an answer in step 3.** So if the author hasn't decided the current role, they must do so now. Let's assume the author decides the primary current role is to attract mates. Then:
  - **Function:** Courtship display (or whatever the author chooses as the current role).

  Now, I expect you to dislike the answer on Case 2. Why? Because the original design was for filtration, and even though it now drives circulation, the historical design is clear and you might feel that the function should remain the original one. But the procedure says that if it has been repurposed (and the original function is no longer primary), then the current contribution takes precedence. This might feel like it undervalues the design history. However, the procedure does note the original design. In the context of your story, if the characters call it a "second heart", then the current contribution is clearly dominant. But if the toxin removal is still vital (even if the driving of circulation is more noticeable), then step 1a would have said "no" and we would have kept the original function. We assumed the toxin removal is no longer vital.

  This is the point of contention: the procedure prioritizes current role when the historical one is no longer the primary reason the trait is maintained. But in a designed trait, if the original function is still being served (even alongside a new one) we might want to keep the original. However, the procedure in step 1a asks: has it been repurposed so that the original is irrelevant? If the original function is still happening, then it's not irrelevant. So in Case 2, if the filtration is still happening and is important (even if not the main thing the characters notice), then the function might still be filtration. But if the toxin is gone and the organ is only doing circulation, then it's repurposed.

  Thus, the procedure requires you to judge: is the original function still being served and is it vital? If not, then the new function takes over. If yes, then we might say the function is filtration (and note the circulation as a side effect). But the procedure in step 1a says: if the original design is irrelevant (meaning it's not doing that job anymore, or the job is no longer needed) then we go with current. So it's a judgment call.

  In Case 2, we assumed the original function is gone. But if it's still present, then the procedure might output:

  - Step 1: Designed for filtration. Step 1a: Repurposed? Not entirely, it still filters but also circulates. Then the function is filtration (the original design) and circulation is a side effect. However, if circulation is now the primary reason the trait is maintained (by natural selection) then step 2a (if we were in evolution) would push us to call it circulation. But here it's designed, so we stick with the design.

  This is a tension. The procedure in step 1a is designed to handle repurposing. We must be cautious.

  Alternative for Case 2: 
  - If the filtration is still occurring and is necessary (the toxin is present and must be removed) then the function is filtration, and the circulation is a beneficial side effect. But if the circulation is the main thing keeping the organism alive (and the toxin removal is incidental and not under selection anymore) then we would call it circulation. 

  However, note that the procedure for designed traits does not ask about current selection. It asks if the trait has been repurposed so that the original design is irrelevant. So if the original design purpose is still being served and is necessary, then it's not irrelevant. Therefore, the function is the original.

  But in your description, the characters call it a "second heart", implying that the circulation function is the dominant one and the filtration might be secondary or even non-existent. Therefore, we stand by the initial answer: function is circulation. But note: the original design was filtration.

  This is why I expect you to dislike it: because the procedure overrides the design history when the trait is repurposed. But that is what the procedure says.

  Let me know if you want adjustments.
answer: |-
  **A trait's function is its current primary contribution to the organism's survival or reproduction, unless clear historical evidence (design or selection) overrides this by showing the trait exists because of a different, still-relevant purpose.**  

  ### Decision Procedure  
  Execute in order. Stop when a firm answer or handback occurs. Use common knowledge of biology (e.g., "pumping sustains life," "display attracts mates").  

  1. **Was the trait designed?**  
     - *If yes, and design records exist:* Function = documented purpose. Note if repurposed (e.g., "designed for X, now also does Y").  
     - *If designed but records lost/unavailable:* Proceed to Step 3 (current contribution).  
     - *If no:* Proceed to Step 2.  
     - *Sufficient answer:* Terraformer logs, character testimony, or in-world tech.  
     - *Handback if:* Design purpose conflicts with narrative needs (e.g., you want the "original intent" emphasized).  

  2. **Is the evolutionary history documented?**  
     - *If yes, and selection pressure is clear:* Function = what it was selected for.  
     - *If history is broken (e.g., re-engineering + selection):* Use post-break history if clear; else, proceed to Step 3.  
     - *If no history (deliberate blank):* Proceed to Step 3.  
     - *Sufficient answer:* Fossil records, in-world science, or lineage notes in your bible.  
     - *Firm no if:* Trait is confirmed vestigial (e.g., "non-functional appendix").  
     - *Handback if:* History is ambiguous (e.g., "possibly for camouflage or thermoregulation").  

  3. **What is the current primary contribution?**  
     - *Function = the role most critical to the organism’s immediate survival or reproduction.* Prioritize:  
       - Survival (e.g., avoiding predators, sustaining vital processes).  
       - Reproduction (e.g., courtship, resource competition).  
       - Ignore minor/incidental effects (e.g., "gland secretes chemical; occasionally irritates predators" → focus on secretion).  
     - *Sufficient answer:* Observe what happens without the trait (e.g., "death without pumping") or its consistent use (e.g., "always deployed in mating").  
     - *Firm no if:* Trait has no observable effect (vestigial).  
     - *Handback if:* Multiple contributions are equally vital (e.g., "display intimidates rivals AND attracts mates").  

  ### Key Simplifications  
  - **Keep:** History overrides current use only if evidence exists and the historical purpose still explains persistence.  
  - **Drop:** Distinctions between "selection" vs. "design" history (treat both as "historical cause"). Ignore "system capacity" jargon; focus on observable survival/reproduction.  

  ---  
  ### Worked Examples  
  **Case 1: Hollow cranial crest (burrowing ancestry, now courtship display)**  
  - Step 1: Not designed → Step 2.  
  - Step 2: History documented (burrowing), but broken? No re-engineering → Step 2a: Repurposed? Yes (now display). Current use is primary → **Function: Courtship display.** Note: "Vestigial burrowing origin."  
  - *Output:* "Cranial crest: Visual display in mate attraction. (Evolved from burrowing aid.)"  

  **Case 2: Implanted filtration organ (designed for toxin removal, now circulation "heart")**  
  - Step 1: Designed. Records exist (toxin removal). Step 1a: Repurposed? Yes (circulation is primary; toxin gone/irrelevant). → **Function: Circulation.** Note: "Designed for toxin filtration."  
  - *Output:* "Implanted organ: Circulatory pump. (Designed for toxin removal; repurposed.)"  
  - **Expected dislike:** You may prefer "filtration" as the true function because of design. Procedure overrides with current use as it’s survival-critical (circulation) and the original purpose is obsolete.  

  **Case 3: Bioluminescent frill (no lineage record)**  
  - Step 1: Not designed (assumed) → Step 2.  
  - Step 2: No history (deliberate blank) → Step 3.  
  - Step 3: Current contribution? Assume it deters predators (common for bioluminescence). → **Function: Predator deterrence.**  
  - *Output:* "Bioluminescent frill: Startles or warns predators."  
  - *Handback if:* You prefer "mate attraction" for narrative; procedure defaults to Step 3 without history.
