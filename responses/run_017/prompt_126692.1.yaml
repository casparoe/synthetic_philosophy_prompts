  4. We split persistence into two: first ask about persistence after death, because that is directly about P. Then, if E persists, we ask about emergence in other populations to test the necessity of the belief for the emergence of E.

  This ordering allows us to handle the three distinctions and provides a structured way to evaluate the causal claim.

  Finally, we note that the tree does not settle the question in all cases. In particular, the tree leaves open the possibility that even after answering all the questions, we might not be sure. For example, if we get to a leaf like Strong Culturalism, we still have the awkward commitment. The tree does not guarantee that culture was a cause; it only tells us what position we are licensed to hold given the answers, and each position has its own commitments.

