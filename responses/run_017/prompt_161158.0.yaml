answer: |-
  ### Joint Statement on the Pasadena Game  
  **Agreed by Restrictionist and Completionist Factions**  
  *For the Decision-Theory Reading Group*  

  ---

  #### I. Agreed Claims  
  1. **Algebra of the Pasadena Game**:  
     - Payoff for first heads on trial \(n\): \((-1)^{n-1} \cdot 2^n / n\) dollars.  
     - Probability of outcome \(n\): \(2^{-n}\).  
     - The expectation series is the alternating harmonic series \(\sum_{n=1}^{\infty} (-1)^{n-1}/n\), which converges to \(\ln 2 \approx 0.69\) when summed in the natural order.  
     - The positive part (\(\sum \text{positive payoffs} \cdot \text{probabilities}\)) and negative part (\(\sum \text{negative payoffs} \cdot \text{probabilities}\)) each diverge. Thus, the expectation is undefined in the strongest sense: it lacks an absolute expectation and is susceptible to the Riemann rearrangement theorem (reordering yields any real number or divergence).  

  2. **Contrast with St. Petersburg**:  
     - *Similarity*: Both games have unbounded payoffs and infinite expected utility under naive summation.  
     - *Divergence*: St. Petersburg has a divergent expectation with a monotonic series (no rearrangement issue), while Pasadena’s conditional convergence makes its expectation *structurally unstable* under reordering. Bounded utility or fanaticism is irrelevant; the core distinction is the presence (St. Petersburg) vs. absence (Pasadena) of a unique linear order for computing expectation.  

  3. **Survival of Dominance Relations**:  
     - *Sure-dominance* holds: Pasadena + \$k dominates Pasadena for any \(k > 0\) (e.g., +$1), as every possible payoff is strictly increased. This is uncontroversial and does not rely on expectations.  
     - *Stochastic dominance* may not hold globally when expectations are undefined, but sure-dominance is exceptionless.  

  4. **"No Verdict" vs. Indifference**:  
     - "No verdict" (theory falls silent) is distinct from indifference (theory prescribes indifference).  
     - In sequential/planning contexts: An agent facing Pasadena tomorrow may strictly prefer a sure dollar today over nothing today, even if the theory issues "no verdict" for Pasadena alone. This reflects dominance in the *planning portfolio*, not indifference.  

  ---

  #### II. Disagreements Table  
  | Crux                                                                 | Restrictionist Position                                                                                            | Completionist Position                                                                                                | Shared Bearing Case                                                                                                   | Predictions                                                                                                |
  |----------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------|
  | **Scope of Decision Theory**:<br>Must EU theory cover all physically possible options? | "Theory delimits its domain: options with undefined expectations lie outside it. Silence is correct; ‘extensionally inadequate’ misapplies ‘inadequacy’ to inapplicable cases." | "A theory that refuses verdicts on implementable gambles is incomplete. We need rules (e.g., limits, dominance) to rank *all* options, even when expectations fail." | **N/A** (Foundational).                                                                                              | *Restrictionist*: No test can force expansion.<br>*Completionist*: Truncation/variants show need for rules. |
  | **Truncation Ladder**:<br>Finite \(N\)-truncations have EU → \(\ln 2\), but the infinite game lacks EU. Does this imply the full game should be evaluated as \(\ln 2\)? | "No. Finite truncations are distinct options. Convergence of truncations’ EU does not imply an EU for the limit. The full game is pathological; truncation is irrelevant." | "Yes. The limit of truncations is the only stable evaluation. Refusing it invites paradox: all finite versions are acceptable, but the ‘limit’ option is not." | **(a) Truncation Ladder**: EU of \(N\)-truncation is \(s_N = \sum_{n=1}^N (-1)^{n-1}/n\) → \(\ln 2\).                | *R*: Case shows discontinuity, proving pathology.<br>*C*: Case shows \(\ln 2\) is the natural evaluation. |
  | **Sensitivity to Infinitesimals**:<br>Do vanishingly small payoff perturbations reveal instability? | "Yes. Multiplying payoffs by \(1 + \epsilon_n\) (\(\epsilon_n \to 0\)) can make EU arbitrary/diverge. This confirms expectations are not just undefined but *fragile*." | "No. Perturbations create distinct games. The unperturbed game has a privileged status via natural order; stability under *reasonable* rules (e.g., Cesàro sums) justifies \(\ln 2\)." | **(b) Vanishing Perturbation**: Payoff = \((-1)^{n-1} \cdot 2^n / n \cdot (1 + \epsilon_n)\), \(\epsilon_n \to 0\). | *R*: Case proves no robust evaluation exists.<br>*C*: Case is a distraction; perturbations alter the option. |
  | **Planning Context**:<br>Can an agent today rationally choose a sure dollar over facing Pasadena tomorrow? | "Yes. This exploits dominance: ‘sure dollar + Pasadena tomorrow’ dominates ‘nothing + Pasadena tomorrow’. No EU for Pasadena is needed; dominance suffices." | "Yes, but this relies on dominance *because* we lack an EU. Completionism provides a unified rule (e.g., \(\ln 2\)) for direct comparison, avoiding ad hoc dominance appeals." | **(c) Planning Variant**: Choose today between (i) +$1 today or (ii) nothing today + Pasadena tomorrow.               | *Both* agree (i) is preferred, but dispute the basis (*R*: standalone dominance; *C*: unified evaluation). |

  ---

  #### III. Diagnosis of Verbal vs. Substantive Disagreements  
  - **Verbal**:  
    - "Undefined": Restrictionists use this to mean "outside the theory’s domain"; Completionists use it as "requiring supplemental rules."  
    - "Verdict": Restrictionists equate "verdict" with an EU prescription; Completionists include "permissivism" (e.g., dominance rules) as a verdict.  
  - **Substantive**:  
    - **Scope of Rationality**: Is rationality defined only over expectations, or must it cover all gambles? (No shared test; foundational).  
    - **Pathology vs. Privilege**: Is the Pasadena game’s limit behavior pathological (R) or a call for better rules (C)? (Case (a) and (b) are contested evidence).  
  - **Irresolvable by Shared Argument**:  
    The core dispute over whether decision theory *must* assign a value to Pasadena cannot be settled by any case both accept. Cases (a)–(c) are interpreted through prior commitments:  
    - Restrictionists see fragility (b) and discontinuity (a) as proof of pathology.  
    - Completionists see dominance (c) and limit convergence (a) as proof of evaluability.  

  ---  
  *This document reflects joint agreement on facts and framing, with disagreements crystallized for focused debate. No position is endorsed; neutrality is structural.*
