prompt: |-
  I write a column on science and ideas, and over the past few years I have sat through more panels, hearings, and documentary screenings about "alternative" history than I expected to when I took the job. I keep encountering the same maneuver, and I have never found a word for it. I would be grateful for your help.

  The maneuver runs like this. A fringe account of the past opens by applying an unusually aggressive standard of evidence to the mainstream account — not to the mainstream's specific claims, but to the machinery that produced them. We only have copies of copies; scribes interpolated; radiocarbon dates have to be run through calibration curves; stratigraphy assumes the layers were never disturbed; the king-lists and chronologies were compiled by people with an interest in a tidy story. Every one of those points, taken alone, is something a working historian or archaeologist will concede without much fuss. Then — and this is the part I cannot name — having used that standard to clear the ground, the same speaker builds a positive replacement out of the very materials the standard has just discredited: the same late copies, the same king-lists, the same excavation reports, now treated as solid enough to underwrite a wholesale revision of the timeline.

  Two instances, so the shape is clear. At a conference on revised chronologies, a speaker spent forty minutes arguing that the transmitted manuscripts behind our standard periodization are too corrupt, too late, and too ideologically edited to support any confident dating — then spent the next thirty reconstructing a compressed timeline from those same transmitted manuscripts, treating their internal numerology as a trustworthy record. At a screening I was asked to comment on, a presenter argued that the customary dating of a set of megalithic sites is guesswork, because our sources for them are late medieval compilations and local folklore, and folklore proves nothing; twenty minutes later he read that folklore and those compilations as a reliable memory of astronomical knowledge inherited from a vanished high civilization.

  I have been calling this "credibility laundering" in my notes, but I would rather print a term a reader can look up, and I suspect my version is imprecise. So here is what I am actually after.

  Does this maneuver have an established name in epistemology, argumentation theory, or the literature on demarcation? If the fit with the established concept is imperfect — I expect it is — please tell me which candidate comes closest, where exactly the thing I described comes apart from it, and whether one of them should be stretched to cover it or whether it deserves its own term.

  Candidates that have occurred to me, none of which seems quite right: "selective skepticism" and the related notion of "pseudoskepticism," which as far as I can tell name a stance rather than a move within a single argument; the old trilemma about justification, where any support for a claim either asserts itself, circles back on itself, or regresses without end, which my speakers deploy against the mainstream but never against themselves; and the distinction between attacking a claim and attacking the source of a claim's support, which seems nearer the mark but is too broad, since a methodologist may legitimately impugn a method without owing anyone a rival reconstruction.

  The carvings I most want: Is the essential feature the asymmetry, or is it the reuse of the discredited pipeline as data, or is it something about which direction the standard is allowed to travel? Does it matter that the aggressive standard is aimed at a field's procedures rather than at a person's credibility, or is that incidental? And where is the boundary — what separates my speakers from a legitimate skeptic who says in effect that our methods are too weak here, so we should withhold judgment on all sides, and from a mundane case of a researcher who simply holds her own favorite sources to a gentler standard than she holds everyone else's, the way we all do?

  If no established concept fits, coin one, define it, and give me two or three boundary cases: one that clearly falls under it, one that clearly does not, and one that could be argued either way. Please write in American English, and keep it accessible to a general reader without turning it into a list of slogans.

  Finally, since I need something I can paste into a style sheet: end your reply, on the very last line and as the only thing on it, with \answer{...} enclosing the single best label — the established term if there is one, or your coined term if there is not — as a short phrase of no more than five words.
reasoning: |-
  Okay, the user is a science columnist who's encountered a recurring argumentative maneuver in "alternative" history circles. They've described it as a two-step process: first applying hyper-skepticism to mainstream historical methods to "clear the ground," then using those same discredited sources to build a fringe theory. They want to name this tactic precisely.

  Hmm, this is interesting. Let me unpack what they're describing. The core pattern seems to be: 1) Weaponizing methodological skepticism against mainstream scholarship ("your sources are corrupt/imperfect"), then 2) Performing a sudden U-turn to treat those same sources as authoritative when constructing their own theory. The key asymmetry is that the strict evidential standard only applies to others.

  I recall similar maneuvers in pseudoscience - creationists dismissing radiocarbon dating generally but accepting it when it suits them, or ancient astronaut theorists rejecting archaeological consensus while treating myths as literal records. The user's examples perfectly capture this intellectual dishonesty.

  Now, what to call it? Their "credibility laundering" isn't bad, but they want something more precise. Let me run through some epistemological concepts:

  - Ad hominem circumstantial? No, that's about attacking the person.
  - Special pleading? Close but too broad - this is specifically about evidentiary standards.
  - The term "poisoning the well" comes to mind, but that's about preemptively discrediting opponents.
  - "Motivated reasoning" captures the bias but not the methodological flip-flop.

  Wait - there's a concept in philosophy of science called the "double standard of evidence" or "asymmetric skepticism." That seems promising. Philosophers like Sven Ove Hansson have written about how pseudosciences apply stricter scrutiny to others while exempting their own claims. The user's description maps perfectly to this: the aggressive standard travels only one way.

  But is there a snappier term? "Epistemic double standard" feels precise but academic. "Source opportunism" emphasizes the selective use of evidence. "Methodological hypocrisy" is clearer but clunky. Given the user's need for accessibility, "evidentiary asymmetry" might strike the right balance - it's descriptive without being jargon-heavy.

  For boundary cases:
  - CLEAR EXAMPLE: The user's manuscript critic turned numerologist.
  - NOT THIS: A historian noting source limitations while acknowledging their account is tentative.
  - DEBATABLE CASE: Freudian analysts dismissing behavioral studies while interpreting dreams - similar asymmetry but less extreme.

  The coinage should highlight the core sin: demanding perfection from others while embracing flaws in one's own evidence. "Evidentiary asymmetry" nails this, and it's flexible enough to cover both historical and scientific contexts. It's also self-explanatory - "asymmetry" implies unfairness, "evidentiary" pins it to proof standards.

  Final thought: The user's deeper need might be for rhetorical precision to combat misinformation. Naming this tactic gives them power to dissect it in future columns. That's why the term needs to be both accurate and memorable - a scalpel for their critiques.
answer: |-
  Based on your detailed description, this maneuver is a recognizable pattern in pseudoscientific and fringe historical argumentation, but lacks a single, universally established term in epistemology or demarcation literature. The closest established concepts are imperfect fits, making a coined term most appropriate. Here's the analysis:

  1.  **Why Existing Terms Don't Fit Perfectly:**
      *   **Selective Skepticism/Pseudoskepticism:** These describe a general *stance* or *attitude* of applying doubt unevenly. Your focus is on a specific *tactical sequence within an argument*: first demolishing mainstream foundations using a hyper-skepticism about methods/sources, then immediately rebuilding using those *same* methods/sources treated as unproblematic. It's the *asymmetrical application within a single chain of reasoning* and the *reuse of the discredited pipeline* that's key.
      *   **Infinite Regress/Trilemma:** While the speaker exploits this *against* the mainstream ("your evidence relies on methods that themselves need justification"), they *avoid* applying it to their own reconstruction. The issue isn't just pointing out a potential regress; it's immunizing their own use of the same sources/methods from the regress they just invoked.
      *   **Ad Hominem (Circumstantial):** This attacks the *person* (e.g., "scientists are biased"). Your speakers attack the *machinery* (methods, sources). While related, the target difference is significant.
      *   **Poisoning the Well:** This is a preemptive attack on the source to discredit anything coming from it. Your speakers *do* poison the mainstream well, but then proceed to *drink deeply from that same poisoned well themselves* for their own theory. The unique element is the self-serving reuse.
      *   **Special Pleading:** This is a broad fallacy where inconsistent standards are applied without justification. Your case is a *specific subtype*: the inconsistency lies precisely in the treatment of the *same* evidence pipeline *within a single argument*, first as fatally flawed, then as reliable.

  2.  **The Essential Features:**
      *   **Core:** The defining feature is the **asymmetrical treatment of the *same* evidence pipeline within a single argumentative sequence.** The hyper-skepticism applied to discredit the mainstream is *not* applied to the speaker's own positive reconstruction, which relies on that very pipeline.
      *   **Directionality:** The aggressive standard travels *only one way* – against the mainstream. The speaker exempts their own use from the same scrutiny. This creates an argumentative "free pass."
      *   **Reuse:** It's not just holding different sources to different standards; it's specifically **discrediting the pipeline (method/source) and then immediately using that *same* discredited pipeline as foundational for a new claim.**
      *   **Target:** Attacking the *field's procedures* (methodology/source reliability) rather than individual credibility is central, as it creates the illusion of a methodological critique while enabling the asymmetric reuse.

  3.  **Boundaries:**
      *   **Clearly Falls Under It:** Your conference speaker: 40 mins destroying manuscript reliability for mainstream dating, then 30 mins using those same manuscripts' numerology for a new timeline. Clear pipeline discredit-and-reuse asymmetry.
      *   **Clearly Does NOT Fall Under It:** A mainstream historian who says, "Our sources for Event X are fragmentary and late copies (A, B, C), introducing significant uncertainty. Therefore, any reconstruction must be highly tentative, and Claims Y and Z about motives are probably beyond our reach." This acknowledges methodological limitations *and* consistently applies the resulting skepticism to *all* positive claims derived from those sources, including their own tentative ones. Judgment is withheld.
      *   **Debatable Case:** A researcher who argues mainstream stratigraphic interpretations of Site Alpha are unreliable due to possible bioturbation (worm mixing), so she rejects the mainstream dating. She then proposes an alternative date based primarily on typological comparisons of pottery shards *from the same disturbed layers*. This involves asymmetric standards (applying skepticism to stratigraphy but not typology) and reusing evidence from the discredited context. However, it's not *identical* pipeline reuse – she shifts the interpretive method (typology vs. stratigraphy) while using the same physical evidence. It shares the core *asymmetry* and self-serving standard application but lacks the *exact* "discredit *this method* on *these sources*, then use *this method* on *these same sources*" sequence. This might be classified under broader "special pleading" or "methodological cherry-picking" rather than the specific coined term.

  4.  **The Coined Term: Evidentiary Asymmetry (or Methodological Asymmetry)**

      *   **Definition:** The argumentative maneuver of applying an exceptionally rigorous (often impossibly high) standard of evidence to critique mainstream claims by attacking the reliability of their supporting methods or sources, while simultaneously exempting one's own positive claims – which rely on those same methods or sources – from that same standard, thereby creating an asymmetrical and self-serving framework for evaluating evidence.
      *   **Why it fits:**
          *   "Evidentiary" pinpoints the focus on standards of evidence and source reliability.
          *   "Asymmetry" captures the core unfairness: the standard applied *against* the mainstream is not applied *by* the speaker *to themselves* when using the same evidence pipeline. The imbalance is fundamental.
          *   It directly names the essential feature you identified.
          *   It's accessible yet precise for a general reader.
          *   It can encompass both source-based (manuscripts, folklore) and methodological (dating techniques, stratigraphy) critiques.
      *   **Why not "Credibility Laundering"?** While vivid, "laundering" implies a deliberate concealment of origin. The flaw here is more about inconsistent *evaluation standards* applied to the evidence *after* its origin is acknowledged, rather than hiding where it came from. "Asymmetry" is more accurate to the logical flaw.

  **Conclusion:** While elements resonate with special pleading and selective skepticism, the specific sequence you describe – discrediting a methodology/source pipeline to dismantle the mainstream, then immediately using that *same* pipeline unchallenged to build an alternative – is best captured by the coined term **Evidentiary Asymmetry**. It highlights the unfair, self-serving imbalance in the application of critical standards within the argument itself.

  \answer{Evidentiary Asymmetry}
