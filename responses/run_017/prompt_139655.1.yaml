prompt: |-
  I have been trying to work out what I actually believe about duties of rescue, and arguing from first principles has not helped me: every principle I pick up either swallows more than I can accept or lets me off the hook in cases where I plainly am not off the hook. So I want to start from my verdicts on a spread of cases and see what, if anything, captures them. The case everyone reaches for is Singer's drowning child in the shallow pond, and I have put a version of it first; the rest are variations I have been turning over. I have recorded the verdicts as I actually have them, including the ones I am not proud of.

  1. A child is face down in an ornamental pond a few metres from where I am walking. I can wade in and lift her out. I will ruin a suit worth about six hundred dollars and be an hour late. Verdict: I must go in. Someone who walked on would deserve severe condemnation.

  2. The same pond, but wading in means missing a job interview that would very likely change the course of my life. Verdict: I still think I must go in. But I notice that I would describe someone who walked on as having done something terrible rather than something unthinkable, and I would not think he should be punished or that his friends should treat him differently afterwards.

  3. An email appeal from a verified charity: four thousand dollars will, with high reliability, save the life of a child I will never meet on another continent. I could give it without anything I would call hardship. Verdict: I think I ought to give. I do not give. I do not feel like a monster, and I judge myself far less harshly than I judge the man in case 1 — which I cannot square with 1 and 2 unless there is a difference between what I owe and how much blame I incur.

  4. Forwarding a one-line message to a colleague that would spare her a small but real loss. Cost to me: seconds. Verdict: I ought to; if I forget, I am careless rather than culpable. Contrast: a one-line message that would prevent someone's serious injury. Verdict: I must send it, and failing to is close to the pond case. I do not know whether the difference here is just the size of the benefit, or whether there is a cliff between the trivial and the serious that proportionality cannot generate.

  5. A surgery fund must reach fifty thousand dollars by Friday. An anonymous donor has pledged to cover any shortfall at the close of the appeal, so my twenty dollars will not change whether the surgery happens; it will only change how much the donor pays. Verdict: I feel released. I also feel, on reflection, that this is the case where I am most likely to be reasoning badly.

  6. Twenty dollars to a vaccination programme with roughly a one-in-three-thousand chance of saving a life — no threshold, no top-up donor. Verdict: here I feel a genuine, if faint, pull, and I think it would be better to give. So my verdicts in 5 and 6 come apart even though the money is the same size, and I want to know whether the right principle is tracking expected difference-making, and what it does with the offsetting in 5, where my money changes nothing about the outcome and only rearranges whose money pays.

  7. A neighbour's toddler wanders onto my land and is trapped in the decorative pond I chose to build and could have fenced. I did nothing careless and broke no rule. Verdict: my duty is stronger than a passer-by's, and I owe more in the way of cost and risk. But I resist saying I owe as much as someone who pushed the child in. Is there a third category between having caused the danger and merely being present at it, or does my verdict here just record a dislike of drawing lines?

  8. Twenty people on the bank, all able to swim, any one of them sufficient. Verdict: no one is released by the presence of the others — I cannot excuse myself by pointing at them. But I also think the ones who hang back owe me something, not the child: if I go in alone, they owe me a share of what I gave up. That feeling is real and I do not know what kind of thing it is.

  9. The water is freezing and there is roughly a one-in-twenty chance that going in kills me too. Verdict: I am permitted to stay on the bank, and I would admire rather than condemn the person who goes in. At one-in-a-thousand I think I must go in. I cannot say where between those numbers the change happens, or whether there is a point rather than a slope.

  There is also a structural worry that sits on top of all this. If the principle is of the form "prevent something very bad whenever the cost to you is small compared with the bad averted," then there is no natural stopping point: satisfying it in one case simply reveals the next, and the aggregate is a life of substantial sacrifice. I reject that greedy reading, and I do not think my rejection is mere weakness of will. But I cannot tell whether the limit I want is a ceiling on total sacrifice, a prerogative to pursue my own projects, or something about the demands arriving from many separate sources — and whichever it is, it has to leave case 2 intact.

  The collisions I most want addressed are 1 against 3, and the limit I want in the structural worry against cases 2 and 9.

  My tentative principle, such as it is: (i) I owe a rescue when, and to the degree that, I could avert something very bad at a cost to myself that is small in comparison with the badness averted; (ii) how much blame I incur for failing is a separate matter, fixed by whether the need was present to my senses or had to be inferred from statistics and testimony.

  What I would like: test that principle against the nine cases, clause by clause, saying which case forces each clause and where the clause has to be repaired or abandoned; state its verdicts on cases I have not listed, in particular a victim who will not exist for sixty years, an animal whose suffering is comparable to a child's, and a rescue needing exactly one of a thousand bystanders; and tell me plainly which of my verdicts a defensible principle cannot keep. If there is a cheaper principle that overturns two of my verdicts and a more complicated one that saves them all, give me both and say which you would adopt. Finally, I want the result stated precisely enough that I could apply it to a new case without asking again, and I want to know whether it should be framed as a principle about what I owe, or as a principle about reasons plus a separate account of blameworthiness — my 1-versus-3 split is what makes me doubt that "duty" is the right single word here.
reasoning: |-
  Hmm, this user is grappling with profound ethical dilemmas about duties of rescue. They've presented nine carefully constructed thought experiments where their intuitive moral judgments clash with potential principles. The core tension is between Singer-style effective altruism ("save lives when you can at low cost") and the psychological reality that we don't feel equally obligated in all such cases.

  What stands out is their intellectual honesty - they admit discomfort with their own verdicts in cases like #3 (charity donation) where theory and practice diverge. The structural worry about moral demandingness looms large. Their tentative principle attempts to separate obligation from blameworthiness, using sensory immediacy as a key factor.

  The cases reveal several fault lines:
  - Physical proximity vs statistical lives (#1 vs #3)
  - Certainty vs probability (#5 vs #6)
  - Personal causation vs mere opportunity (#7)
  - Shared responsibility dynamics (#8)
  - Risk assessment (#9)

  Their request for precise principle-testing suggests analytical rigor. I should systematically apply their proposed principle to all nine cases, then explore alternatives. The framing of obligation versus blameworthiness deserves special attention - this may resolve the charity donation paradox. 

  The edge cases they mention (future generations, animals, probabilistic rescue) will stress-test any principle. I'll need to show where their intuitions might conflict with consistent application of principles, and offer tiered solutions: a simple principle that requires revising some judgments versus a complex one preserving all. The conclusion must provide actionable ethical framework they can apply independently.
answer: |-
  Your struggle captures the core tension in rescue ethics: our intuitive verdicts resist neat principles, yet demand justification. Let's dissect your cases with your tentative principle **(i) Duty: avert "very bad" outcomes at "small" comparative cost; (ii) Blame: tied to sensory/immediate presence of need**, then refine or replace it.

  ---

  ### **Testing Your Tentative Principle Against Your Cases**
  **(i) "Small Cost Compared to Badness Averted"**
  - **Case 1 (Pond, $600 suit):** ✓ Fits. Cost is small vs. death.  
  - **Case 2 (Pond, missed interview):** ✘ *Problem:* You say duty remains, but "small cost" is ambiguous. Is life-altering opportunity "small"? Principle needs a threshold.  
  - **Case 3 (Charity, $4k):** ✘ *Problem:* Cost is objectively small vs. death (like Case 1), yet you feel less obligated. Principle (i) implies equal duty, but your intuition rejects this.  
  - **Case 4 (Trivial help):** ✓ Fits for serious injury (cost: seconds vs. grave harm). Fits for small loss (no "very bad" outcome).  
  - **Case 5 (Top-up donor):** ✓ Fits. Your $20 averts *no badness* (surgery happens regardless). No duty.  
  - **Case 6 (Probabilistic donation):** ✓ Fits. Expected badness averted (1/3000 of a death) is small but real; cost is trivial. Duty exists.  
  - **Case 7 (Your pond, trapped toddler):** ~ *Partial fit.* Cost/risk owed is greater, but principle (i) doesn't explain *why* (no "causation" element).  
  - **Case 8 (20 bystanders):** ✘ *Problem:* Principle (i) says all have equal duty (cost small vs. death). But you intuit others owe *you* compensation if you act—unexplained.  
  - **Case 9 (Risk to self):** ✘ *Problem:* "Small cost" is undefined for risk. 1/1000 risk might be "small" vs. death, but 1/20 isn’t. Where’s the line?  

  **(ii) "Blame Depends on Sensory Presence"**  
  - **Case 1 vs. 3:** ✓ Explains blame asymmetry. Pond is vivid/sensory; charity is abstract/statistical.  
  - **Case 4 (Trivial help):** ✓ Fits "careless not culpable" for forgotten message—lacks urgency/salience.  
  - **Case 2 (Missed interview):** ✓ Explains reduced blame (duty remains, but distraction mitigates culpability).  

  **Verdict:** Principle (i) fails Cases 2, 3, 7, 8, 9. Principle (ii) holds but is incomplete.  

  ---

  ### **A Revised Principle (Preserving All Verdicts)**  
  **Duty:** You have a duty to rescue when:  
  - **(A)** You can prevent *serious harm* (death, severe injury) at a *non-excessive cost/risk*;  
  - **(B)** You are *specially placed* to help (proximity, capacity, or causal role);  
  - **(C)** Your action *robustly makes a difference* (no offsetting/thresholds).  
  **Blame:** Culpability increases with:  
  - **(D)** *Salience* of the need (sensory > abstract);  
  - **(E)** *Certainty* of harm averted.  

  ### **Applying the Revised Principle**  
  | **Case** | **Duty?** | **Why** |  
  |----------|-----------|---------|  
  | 1 | Yes | (A) Cost nonexcessive vs. death; (B) Proximate; (C) Direct difference-maker. |  
  | 2 | Yes | (A) Life opportunity is excessive? → **No**: Death >> opportunity cost. Duty remains. |  
  | 3 | Weak | (A) Cost small; (B) *Not specially placed* (no proximity/causation); (C) Your $4k *does* make a difference. → **Duty exists but weaker** than Case 1. |  
  | 4 | Serious injury: Yes | (A) Seconds vs. injury; (B) Proximate (colleague); (C) Direct. Trivial loss: No duty (not "serious harm"). |  
  | 5 | No | (C) No difference made (donor covers shortfall). |  
  | 6 | Yes | (A) Cost small; (C) *Expected* difference made (1/3000 life saved). |  
  | 7 | Stronger duty | (B) *Causal role* (your pond, unfenced—increased responsibility). |  
  | 8 | All have duty | (B) All proximate/capable. If you act alone: Others owe *restitution* for free-riding on your sacrifice. |  
  | 9 | 1/1000: Duty | (A) Risk nonexcessive. 1/20: No duty | (A) Risk excessive. Slope exists—no sharp point. |  

  ### **Edge Cases (Revised Principle's Verdicts)**  
  - **Future Victim (60 years away):** Weak/no duty. (B) Not specially placed (temporal distance). (D) Low salience.  
  - **Suffering Animal:** Duty if (A) Cost small & harm serious. (B) Proximate/capable. Blame lower due to (D) reduced salience (species norms).  
  - **1 of 1000 Bystanders Needed:** Duty remains. (C) *Expected* difference made (1/1000 chance you’re decisive).  

  ---

  ### **Cheaper Principle (Overturns 2 Verdicts)**  
  **"Prevent serious harm if cost is minimal and you’re the *only* one who can help."**  
  - **Overturns:**  
    - Case 3 (You’re not the only one → No duty to donate).  
    - Case 6 (Probabilistic → No duty).  
  - **Fails:** Case 8 (All have duty despite others being present).  

  ### **Which Principle to Adopt?**  
  The **revised principle** preserves all your verdicts but is complex. The **cheaper principle** is simpler but sacrifices Cases 3 and 6. I recommend the revised principle: it captures moral nuances (causation, salience, restitution) your intuitions track.  

  ---

  ### **Structural Worry Addressed**  
  The greedy "no stopping point" problem is resolved by:  
  - **(A) Non-excessive cost:** Allows a *prerogative* to prioritize core projects (Case 2 stays intact: death >> interview).  
  - **(B) Special placement:** Limits duties to contexts where you’re uniquely positioned.  
  - **Aggregate limits:** Total sacrifice can be capped by (A)—e.g., 10% income/year—without violating Case 2 or 9.  

  ---

  ### **Obligation vs. Blame: Framing the Principle**  
  Your Case 1 vs. 3 split shows **"duty" isn’t unitary**. Frame it as:  
  1. **Obligation:** Grounded in *objective factors* (harm severity, cost, difference-making, special placement).  
  2. **Blameworthiness:** Grounded in *epistemic/psychological factors* (salience, certainty, cognitive load).  

  This separates the *existence* of a duty (Case 3: you ought to donate) from *culpability* for failing (low blame due to low salience).  

  ---

  ### **Conclusion**  
  A defensible principle *can* preserve all your verdicts. The key is:  
  - **Duty** requires *difference-making capacity*, *non-excessive cost*, and *special placement* (proximity/causation).  
  - **Blame** scales with *salience* and *certainty*.  
  - **Your resisted verdicts:** None need be abandoned. Case 3’s "weak duty" and Case 5’s "no duty" are consistent.  

  **Final Precise Principle:**  
  > *You have a pro tanto duty to prevent serious harm if:*  
  > (1) The harm is *grave* (death/severe suffering);  
  > (2) Your action *robustly reduces* the harm (not offset/thresholded);  
  > (3) The cost/risk to you is *not excessive* (disproportionate to harm averted or your life projects);  
  > (4) You are *specially placed* to act (proximate, capable, or causally implicated).  
  >   
  > *Culpability for failure increases with:*  
  > (5) *Salience* of the harm (immediate > abstract);  
  > (6) *Certainty* your action would avert harm.  
  >   
  > *In shared rescue scenarios (Case 8), bystanders owe restitution to those who bear disproportionate cost.*  

  This explains your verdicts, resolves the structural worry, and applies cleanly to new cases. Test it.
