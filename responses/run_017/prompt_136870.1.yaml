prompt: |-
  You are a professional moral philosopher who has spent a lot of time thinking about the line between what we owe people and what's just extra. Take your time with this one: do a bit of unstructured brainstorming first, then give me your considered answer, and don't be afraid to tell me one of my gut reactions is simply wrong.

  I've been trying to work out from my own gut reactions when something is a duty and when it's optional-but-great (supererogatory, I think the word is). My tentative rule is: an act is supererogatory when it helps others a lot and costs the agent a lot. But my cases won't sit still for it, and I want the actual principle, if there is one.

  Here's where I land on concrete cases:

  - Pulling a toddler out of a shallow fountain when I'm right there and my shoes stay dry: obviously I have to. Not optional at all. But by my rule it helps a lot and costs nearly nothing, so it should be supererogatory. It isn't.
  - Jumping on a grenade to save three strangers: amazing, and I don't blame the people who freeze. Feels like the clearest case of "extra".
  - Donating a kidney to a complete stranger: also extra, and yet somehow I feel it's *more* optional than the grenade thing, even though it's far less dangerous. That pair bugs me.
  - Giving 10% of my income to effective charities: I feel it's optional. My friend says it's a duty and that not doing it makes you a bad person. I want to say she's wrong but I cant quite say why.
  - A nurse on my ward who stays two hours unpaid every shift: I want to praise her, but it makes the rest of the team look bad and management now pretty much expects it. I've started calling this the norm ratchet. Praiseworthy once, and bad if everyone does it — I don't know how to hold both thoughts.
  - A guy who secretly pays off the school lunch debts of a whole class and never tells a soul: I feel he deserves credit even though no one can give it to him, and I feel slightly odd about praising him once I find out, like praise somehow needs an audience.
  - My neighbour, who donated a kidney years ago and could now do it again for someone else: I feel she's off the hook, she's done her bit. I call that credit exhaustion. But I also feel queasy, because the person who needs the kidney today doesn't care what she did before.
  - A mother of two small kids who donates a kidney to a stranger, when there's maybe a 5% chance one of her own kids will need one in twenty years: I don't think this is praiseworthy. I might even think it's a bit wrong. Yet it helps a lot and costs a lot, so my rule calls it supererogatory or even saintly.

  Is there one principle — or two rival candidates — that gets most of these, and where exactly does cost have to enter: as a threshold, as a trade-off against the benefit, or as something about *whose* cost it is and what they already owe? Tell me which of my verdicts your principle can't save, and what it predicts for the case I keep flip-flopping on: quitting my job to care for my mum with early-stage dementia for two years, when a good care home was available and I could have afforded it. I go back and forth between "that was beautiful" and "that was more than anyone could ask, so it was optional" — and I can't tell whether "optional" is praise or an insult.
reasoning: |-
  Okay, let me start by really unpacking the user's query. They're a moral philosopher-in-training, wrestling with the supererogation vs. duty distinction. Their cases are messy, and their tentative rule (high benefit + high cost = supererogatory) keeps failing. The fountain toddler case alone torpedoes it—minimal cost, huge benefit, yet clearly obligatory. That's their first clue something's off.

  Hmm, their frustration jumps out. They've done the hard work of assembling concrete thought experiments but keep hitting contradictions. The kidney/grenade comparison is especially telling—why does grenade-jumping feel "more obligatory" than kidney donation despite lower personal risk? And that "norm ratchet" nurse example... they're noticing how individual sacrifice can warp social expectations. That's sophisticated sociological intuition disguised as a simple workplace observation.

  Ah! The dementia care dilemma is their emotional core. The flip-flopping between "beautiful" and "optional" reveals their deepest need: they want moral clarity about personal sacrifice when institutional alternatives exist. The word "insult" suggests they fear devaluing love by calling it "optional." 

  Right, so the real ask is: "How do I categorize costly generosity without either (a) demanding everyone be a saint or (b) reducing love to mere duty?" Their kidney-donating-mother case proves they grasp the stakes—when sacrifice risks existing obligations, "praiseworthy" flips to "possibly wrong." 

  I should reject pure cost-benefit analysis early. Even modified utilitarianism fails the toddler test. The neighbor's "credit exhaustion" intuition points toward relational duties—we're not infinite sacrifice machines. But the lunch-debt case complicates things: anonymous giving still feels supererogatory without audience. So publicity isn't key. 

  The reciprocity angle might work. Obligations often bind tighter when we're uniquely positioned to help (toddler) or share special relationships (parent/child). But strangers on a battlefield? No prior tie, hence truly optional heroism. Yet... that makes charity donations seem obligatory if effective, which clashes with their intuition. Unless we introduce capacity thresholds? 

  Aha—the "moral proximity" framework could resolve this. Duties arise from (1) immediacy (drowning child), (2) role (parent/child), or (3) prior commitments (job contracts). Supererogation happens when none apply AND cost is significant. Explains why grenade jump is "more optional" than kidney donation: the latter requires sustained sacrifice, which we intuitively discount less than one-off acts. 

  But wait—the nurse's overtime. If it becomes expected, does it shift from supererogatory to obligatory? Only if institutionalized, but here it's individual choice warping norms. So the act remains supererogatory while being systemically harmful. Two different levels! 

  For the dementia case... proximity matters. A care home provides adequate support, so the sacrifice is beyond duty. But the "optional as insult" fear? That's cultural noise. Calling it supererogatory doesn't diminish love—it honors free choice beyond compulsion. 

  Must flag where my framework strains: the kidney-donating mother. If her duty to her kids' potential future needs is probabilistic, is she violating it? Only if the risk is unreasonable. But 5% over 20 years? That's where reasonable people disagree—and philosophy can't dictate actuarial thresholds. 

  Final thought: Their "credit exhaustion" instinct reveals a deeper truth. Moral credit isn't ledger-based; it's about sustainable virtue. We admire ongoing generosity but exempt donors from repeat sacrifices because society depends on most people doing some good, not a few doing everything.
answer: |-
  I appreciate you bringing these rich cases – you've hit on profound tensions in moral philosophy. Your "gut reactions" are actually tracking multiple ethical dimensions, which is why a single-axis cost/benefit rule fails. Let's dissect this systematically.

  **Brainstorming Core Concepts:**
  - **Supererogation ≠ just high cost/high benefit:** The fountain toddler proves this. The *absence of competing claims* matters.
  - **Duties arise from:** (a) *Relational roles* (parent/child), (b) *Causal proximity* (you're the only one present), (c) *Implicit promises* (professional roles), or (d) *Fair reciprocity* (societal duties).
  - **Cost thresholds aren't fixed:** $1,000 may be trivial to a billionaire but ruinous to a student. *Proportionality* to the agent's capacity matters.
  - **"Norm ratchet" is real:** Supererogation requires *non-obligatory* sacrifice. When sacrifice becomes expected, it mutates into exploitation.
  - **Anonymous vs. public acts:** Moral worth shouldn't depend on audience (Kant was right here), but praise requires observers.
  - **Repeated sacrifice:** Moral credit isn't a currency. Past acts may affect capacity ("I'm physically unable") but not obligation ("I've done enough").

  **The Principle: An Act is Supererogatory IFF:**
  1. **It fulfills no prior duty** (relational, professional, or societal), AND  
  2. **It provides significant net benefit to others**, AND  
  3. **It imposes significant cost/risk on the agent** (relative to their capacity), AND  
  4. **It isn't reasonably expected as a baseline for moral decency in that context.**

  **Applying this to your cases:**

  1. **Toddler in fountain:** You have a *duty of easy rescue* (causal proximity + low cost). Not supererogatory.  
     *✓ Principle explains why low cost doesn't make it "extra" – duty overrides.*  
  2. **Grenade jump:** No prior duty to strangers, high benefit, extreme cost. **Supererogatory.**  
  3. **Kidney donation to stranger:** No prior duty, high benefit, high cost (surgery/recovery), not baseline expected. **Supererogatory.**  
     *Why it feels "more optional" than grenade? Duration matters. Grenade sacrifice is instant; kidney donation requires sustained courage (choosing surgery, recovery). But both are supererogatory.*  
  4. **Giving 10% income:** Contentious. If extreme poverty exists and you're affluent, some (e.g., Singer) argue it's a *duty of beneficence*. Your principle: if society doesn't reasonably expect this as baseline decency (true in most cultures today), it's **supererogatory**.  
     *Your friend confuses "ideally required" with "actually obligatory."*  
  5. **Nurse staying unpaid:** Initially supererogatory, but becomes problematic via "norm ratchet." Once management expects it, her act *creates injustice* by shifting baseline expectations. Still supererogatory *for her*, but systemically harmful.  
  6. **Anonymous lunch debt payer:** Classic supererogation. No duty, high benefit, personal cost, no expectation – and anonymity proves he seeks no reward.  
     *Praise doesn't require audience; we can admire moral character even if unknown.*  
  7. **Neighbor donating second kidney:** No duty exists. Past sacrifice doesn't erase current capacity, but may increase cost (health risks compound). If risk is high, refusal is **permissible**. Not "credit exhaustion" – she simply has no obligation.  
  8. **Mother donating kidney:** Here's the twist. She *has a prior duty* to her children's future wellbeing. A 5% chance one child may need a kidney is significant (given organ shortage). Her duty to mitigate existential risks for her children likely *overrides* helping a stranger. **Not supererogatory; potentially wrong if it negligently risks her children's survival.**  

  **Your Dementia Care Dilemma:**  
  Quitting your job to care for your mother when a good care home exists is **supererogatory, not obligatory**. Why?  
  - Your *duty* as a child: Ensure she receives adequate care (fulfilled by the care home).  
  - Your sacrifice (lost income, career setback) is significant.  
  - Society doesn't expect parents to abandon careers for parents with professional care available.  
  - "Optional" isn't insulting here – it acknowledges extraordinary love beyond duty. Calling it "beautiful" captures its supererogatory nature.  

  **Where the Principle Strains:**  
  The mother/kidney case exposes a weakness: How do we weigh *probabilistic future duties* (child's 5% risk) against *current definite needs* (stranger's kidney failure)? My principle prioritizes existing role-based duties, but reasonable people may disagree on risk thresholds.  

  **Conclusion:** Supererogation lives in the space beyond duty – but duty is defined by relationships, proximity, and reciprocity, not just cost/benefit ratios. Your gut reactions are largely sound; the kidney-donating mother case reveals your intuitive grasp of competing obligations. Cost matters as *relative burden* and as a *marker of sacrifice beyond expectation*, not as an absolute threshold. What feels "optional" often is – and naming it such honors the choice without demanding sainthood.
